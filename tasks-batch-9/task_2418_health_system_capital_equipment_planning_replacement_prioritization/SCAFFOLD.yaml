scenario: |
  Generate task harder than expert level!

  2418. Health System Capital Equipment Planning & Replacement Prioritization (capital committee):
  equipment inventory with age, service history and remaining useful life scoring, replacement
  request intake with clinical justification and volume projections, prioritization scoring across
  safety, growth, regulatory and end-of-support drivers, capital budget allocation across facilities
  with contingency reserves, total cost of ownership including service contracts, disposables and
  facility modifications, group purchasing and capital vendor negotiation with trade-in credits,
  installation project sequencing with downtime and construction dependencies, post-implementation
  utilization audit against the business case

domain_name: health-system-capital-equipment-planning
api_prefix: "/capital"

complexity_profile:
  difficulty_level: expert_plus          # §0.4 Expert band, deliberately denser (14 entities, 69 endpoints, 8 calculations, 6 state machines, 53 validations)
  primary_archetype: quota_allocation    # finite capital pool competed for, reserved, committed, released
  secondary_archetype: multi_party_negotiation   # capital committee quorum / weighted tally / safety-officer veto
  complexity_layers:
    - dual_variant_calculation           # nominal vs adjusted RULS; PRO_RATA vs RANK_ORDERED allocation; budgetary vs negotiated TCO
    - cascading_side_effects             # fund -> allocation -> cycle -> sibling requests (depth 4)
    - optimistic_concurrency             # OCC on ReplacementRequest.version and CapitalCycle.version
    - rate_threshold_triggers            # RULS eligibility 30.00, derate 15.00, expedite 85.00, quorum 60%, two-thirds approval

  entity_topology: graph
  # Junction entities (FacilityAllocation = CapitalCycle x Facility, CommitteeVote = ReplacementRequest x CommitteeMember),
  # a self-referential DAG (InstallationProject.predecessor_project_id), and cross-aggregate FKs
  # (VendorQuote.trade_in_asset_id -> EquipmentAsset) make the reference graph non-tree.

  state_machine_shape: parallel
  # InstallationProject carries two independent state dimensions (construction_status x equipment_status);
  # VendorQuote is cyclic (SUBMITTED <-> COUNTERED with a round cap); ReplacementRequest is branching
  # (screen ACCEPT | RETURN) with a revision loop (RETURNED -> DRAFT -> SUBMITTED); CapitalCycle is a
  # linear stage pipeline whose stage gates every child operation.

  relationship_patterns:
    - one_to_many          # Facility -> Department -> EquipmentAsset; ReplacementRequest -> VendorQuote
    - many_to_many         # FacilityAllocation (cycle x facility), CommitteeVote (request x member)
    - self_referential     # InstallationProject.predecessor_project_id (DAG, cycle detection on PATCH)
    - cross_aggregate      # VendorQuote.trade_in_asset_id -> EquipmentAsset; UtilizationAudit -> InstallationProject

  role_model: segregation_of_duties
  # The CapitalPlanner user id that ran POST /capital/cycles/{id}/allocate may not fund requests in that
  # cycle; a CommitteeMember who sponsors a request or sits in its department may not vote on it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_conventions:
  money: "All monetary amounts are integer cents in fields suffixed `_cents`. No floats are persisted for money."
  score_precision: "All score/percentage fields are decimals with exactly 2 fractional digits, round_half_up."
  list_ordering: |
    Every list endpoint returns rows sorted by `created_at ASC` (server-minted, ISO 8601 UTC with three
    fractional digits) and then paginates with limit/offset. `id` is never a sort key. Filters listed in an
    endpoint's `input:` are ANDed before sorting.
  logical_clock: |
    All date comparisons (asset age, OEM support end, quote validity, audit windows, downtime windows) read
    the server logical clock, not wall-clock time. Startup default is exactly 2026-08-01T00:00:00Z and is
    only changed by POST /_clock/set_current_utc.
  id_discipline: |
    `id` values are server-minted UUIDv4 strings with no type prefix and are used only for identity. No
    selector, ranking, tie-break, allocation order, cascade order or remainder distribution may read `id`;
    where a final tie-break over common fields is needed the scaffold uses `created_at ASC`.

entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Hospital / site display name
        constraints: 1..120 chars, non-blank
      - name: code
        type: string
        source: input
        description: Short facility code
        constraints: 2..8 chars, uppercase A-Z0-9, unique across facilities
      - name: region
        type: enum
        source: input
        description: Geographic region of the facility
        constraints: NORTH | SOUTH | EAST | WEST
      - name: max_concurrent_construction
        type: integer
        source: input
        description: Maximum number of ACTIVE InstallationProjects whose construction intervals may overlap at any instant at this facility
        default: 1
        constraints: ">= 1, <= 5"
      - name: active_asset_count
        type: integer
        source: computed
        description: Count of EquipmentAsset rows for this facility whose status != DECOMMISSIONED
        default: 0

  - name: Department
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; owning facility, immutable after creation
      - name: name
        type: string
        source: input
        description: Clinical department name
        constraints: 1..120 chars
      - name: modality_scope
        type: enum
        source: input
        description: Equipment modality this department schedules downtime for; downtime-window conflicts are evaluated per department
        constraints: CT | MRI | CATH_LAB | ULTRASOUND | LAB | SURGICAL
      - name: utilization_penalty_points
        type: integer
        source: computed
        description: Cumulative post-implementation audit penalty subtracted from every composite score computed for this department's requests
        default: 0
        constraints: "0..20, +10 per UNDERPERFORMING UtilizationAudit, capped at 20"
      - name: underperformance_flag
        type: boolean
        source: computed
        description: True once at least one UtilizationAudit for this department's requests reached UNDERPERFORMING
        default: false

  - name: CapitalCycle
    parent: null
    common_fields: true
    fields:
      - name: plan_year
        type: integer
        source: input
        description: Fiscal plan year this capital cycle funds
        constraints: 2026..2035, unique per plan_year
      - name: plan_year_start
        type: datetime
        source: input
        description: First instant of the plan year; regulatory and end-of-support drivers are measured against this instant
      - name: total_capital_cents
        type: integer
        source: input
        description: Total capital pool for the cycle in cents
        constraints: "> 0"
      - name: contingency_pct
        type: number
        source: input
        description: System-level contingency fraction withheld from the pool before distribution
        constraints: 0.00..0.50, at most 4 decimals
      - name: facility_contingency_pct
        type: number
        source: input
        description: Per-facility contingency reserve fraction, drawn from the system contingency on top of each facility's allocated capital
        constraints: 0.00..0.50, at most 4 decimals
      - name: allocation_method
        type: enum
        source: system
        description: Variant of facility_allocation_waterfall used by the most recent allocation run, taken from that call's `allocation_method` input; null before the first run
        default: null
        constraints: PRO_RATA | RANK_ORDERED
      - name: status
        type: enum
        source: system
        description: Cycle stage; gates every child operation
        default: DRAFT
        constraints: DRAFT | INTAKE_OPEN | SCORING | ALLOCATED | COMMITTED
      - name: system_contingency_cents
        type: integer
        source: computed
        description: round_half_up(total_capital_cents * contingency_pct), set by the allocation run
        default: 0
      - name: distributable_cents
        type: integer
        source: computed
        description: total_capital_cents - system_contingency_cents, set by the allocation run
        default: 0
      - name: unallocated_cents
        type: integer
        source: computed
        description: distributable_cents minus the sum of FacilityAllocation.allocated_cents after the allocation run
        default: 0
      - name: contingency_drawn_cents
        type: integer
        source: computed
        description: Sum of FacilityAllocation.contingency_reserve_cents drawn from system_contingency_cents
        default: 0
      - name: allocation_count
        type: integer
        source: computed
        description: Number of FacilityAllocation rows with posture != SUPERSEDED for this cycle
        default: 0
      - name: exhausted_allocation_count
        type: integer
        source: computed
        description: Number of FacilityAllocation rows for this cycle with posture == EXHAUSTED
        default: 0
      - name: scored_count
        type: integer
        source: computed
        description: Number of ReplacementRequest rows moved to SCORED by the most recent scoring run
        default: 0
      - name: expedited_count
        type: integer
        source: computed
        description: Number of ReplacementRequest rows in this cycle whose expedited flag is currently true
        default: 0
      - name: allocated_by_user_id
        type: string
        source: system
        description: X-User-ID of the CapitalPlanner who ran the most recent allocation; segregation-of-duties input for funding
        default: null

  - name: FacilityAllocation
    parent: CapitalCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: FK -> CapitalCycle.id; cycle this allocation belongs to
      - name: facility_id
        type: string
        source: system
        description: FK -> Facility.id; facility receiving the allocation
      - name: demand_cents
        type: integer
        source: computed
        description: Sum of (estimated_capital_cents + facility_modification_cents) over the eligible (status == SCORED) requests of this facility's departments at allocation time
      - name: weighted_score
        type: number
        source: computed
        description: Capital-weighted mean composite_score of the eligible requests of this facility, 2 decimals round_half_up
      - name: allocated_cents
        type: integer
        source: computed
        description: Capital granted to the facility by the allocation run
      - name: contingency_reserve_cents
        type: integer
        source: computed
        description: round_half_up(allocated_cents * cycle.facility_contingency_pct), drawn from cycle.system_contingency_cents
      - name: contingency_status
        type: enum
        source: system
        description: Whether the facility contingency reserve has been released into available capital
        default: HELD
        constraints: HELD | RELEASED
      - name: released_contingency_cents
        type: integer
        source: computed
        description: 0 while contingency_status == HELD, equal to contingency_reserve_cents once RELEASED
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of funded_amount_cents over this facility's requests currently in status FUNDED, IMPLEMENTED or AUDITED
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: allocated_cents + released_contingency_cents - committed_cents; the conserved capital identity
      - name: posture
        type: enum
        source: system
        description: ACTIVE while available_cents > 0; EXHAUSTED once available_cents == 0; SUPERSEDED when a re-run of the allocation replaces the row
        default: ACTIVE
        constraints: ACTIVE | EXHAUSTED | SUPERSEDED

  - name: EquipmentAsset
    parent: Department
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; facility the asset is installed in; must equal the owning department's facility_id
      - name: department_id
        type: string
        source: input
        description: FK -> Department.id; clinical department operating the asset
      - name: modality
        type: enum
        source: input
        description: Equipment modality
        constraints: CT | MRI | CATH_LAB | ULTRASOUND | LAB | SURGICAL
      - name: model_name
        type: string
        source: input
        description: Vendor model designation
        constraints: 1..120 chars
      - name: install_date
        type: datetime
        source: input
        description: Instant the asset entered service; age is measured from here against the logical clock
      - name: expected_life_years
        type: integer
        source: input
        description: Manufacturer expected useful life in years
        constraints: "1..30"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: Original capital cost in cents
        constraints: "> 0"
      - name: oem_support_end_date
        type: datetime
        source: input
        description: Instant OEM support ends; drives both the RULS end-of-support penalty and the end-of-support priority driver
      - name: status
        type: enum
        source: system
        description: Asset lifecycle state
        default: IN_SERVICE
        constraints: IN_SERVICE | DERATED | REPLACEMENT_PENDING | DECOMMISSIONED
      - name: disposition_status
        type: enum
        source: system
        description: Trade-in disposition state; HELD_FOR_TRADE_IN while an ACCEPTED VendorQuote claims the asset
        default: NONE
        constraints: NONE | HELD_FOR_TRADE_IN | TRADED_IN | SCRAPPED
      - name: trade_in_credit_applied_cents
        type: integer
        source: computed
        description: Trade-in credit currently claimed against this asset by an ACCEPTED VendorQuote; 0 when no accepted quote claims it
        default: 0
      - name: age_years
        type: number
        source: computed
        description: round_half_up(days_between(install_date, ruls_as_of) / 365, 2)
        default: 0.00
      - name: nominal_ruls_score
        type: number
        source: computed
        description: Age-only remaining-useful-life score, variant `nominal` of asset_ruls_score
        default: 100.00
      - name: adjusted_ruls_score
        type: number
        source: computed
        description: Service-history and end-of-support adjusted remaining-useful-life score, variant `adjusted` of asset_ruls_score
        default: 100.00
      - name: service_penalty_points
        type: number
        source: computed
        description: min(40.00, 3.00 * corrective_count_24m + 0.50 * downtime_hours_24m)
        default: 0.00
      - name: corrective_count_24m
        type: integer
        source: computed
        description: Count of CORRECTIVE ServiceEvents whose event_date lies in the trailing 730-day window ending at ruls_as_of
        default: 0
      - name: downtime_hours_24m
        type: number
        source: computed
        description: Sum of ServiceEvent.downtime_hours of any category whose event_date lies in the trailing 730-day window ending at ruls_as_of
        default: 0.00
      - name: unresolved_recall
        type: boolean
        source: computed
        description: True when the latest RECALL ServiceEvent (event_date DESC, created_at DESC) has recall_resolved == false
        default: false
      - name: ruls_as_of
        type: datetime
        source: computed
        description: Logical-clock instant at which the stored RULS fields were computed (asset creation or latest ServiceEvent append)

  - name: ServiceEvent
    parent: EquipmentAsset
    common_fields: false
    fields:
      - name: asset_id
        type: string
        source: system
        description: FK -> EquipmentAsset.id; asset the event belongs to, taken from the path
      - name: event_date
        type: datetime
        source: input
        description: Instant the service event occurred; must be <= logical clock now
      - name: category
        type: enum
        source: input
        description: Service event category
        constraints: PM | CORRECTIVE | RECALL | UPGRADE
      - name: downtime_hours
        type: number
        source: input
        description: Clinical downtime caused by the event, in hours, 2 decimals
        default: 0.00
        constraints: ">= 0, <= 8760"
      - name: cost_cents
        type: integer
        source: input
        description: Service cost in cents
        default: 0
        constraints: ">= 0"
      - name: recall_resolved
        type: boolean
        source: input
        description: For category RECALL, whether this event records the resolution of the recall; ignored for other categories
        default: false
      - name: notes
        type: string
        source: input
        description: Free-text service note
        constraints: 0..500 chars

  - name: ReplacementRequest
    parent: Department
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> CapitalCycle.id; capital cycle the request competes in
      - name: department_id
        type: string
        source: input
        description: FK -> Department.id; requesting clinical department; must equal the acting ClinicalRequester's X-User-ID
      - name: asset_id
        type: string
        source: input
        description: FK -> EquipmentAsset.id; asset proposed for replacement; must belong to department_id
      - name: sponsor_member_id
        type: string
        source: input
        description: FK -> CommitteeMember.id; optional committee sponsor, barred from voting on this request
        default: null
      - name: clinical_justification
        type: string
        source: input
        description: Narrative clinical justification
        constraints: 20..2000 chars
      - name: current_annual_volume
        type: integer
        source: input
        description: Current annual procedure volume on the asset
        constraints: ">= 0"
      - name: projected_annual_volume
        type: integer
        source: input
        description: Projected annual procedure volume after replacement; also the disposables volume driver in TCO
        constraints: ">= 1"
      - name: estimated_capital_cents
        type: integer
        source: input
        description: Budgetary capital estimate in cents; the allocation demand contribution and the budgetary TCO capital term
        constraints: "> 0"
      - name: facility_modification_cents
        type: integer
        source: input
        description: Facility modification (construction, shielding, power) cost in cents
        default: 0
        constraints: ">= 0, <= 30% of estimated_capital_cents"
      - name: annual_service_contract_cents
        type: integer
        source: input
        description: Year-1 service contract cost in cents, escalated across the TCO horizon
        constraints: ">= 0"
      - name: disposable_unit_cents
        type: integer
        source: input
        description: Per-procedure disposables cost in cents
        constraints: ">= 0"
      - name: regulatory_mandate_flag
        type: boolean
        source: input
        description: Whether a regulatory mandate compels the replacement
        default: false
      - name: mandate_deadline
        type: datetime
        source: input
        description: Regulatory compliance deadline; required when regulatory_mandate_flag is true
        default: null
      - name: status
        type: enum
        source: system
        description: Request lifecycle state
        default: DRAFT
        constraints: DRAFT | SUBMITTED | SCREENED | RETURNED | SCORED | IN_COMMITTEE | APPROVED | DEFERRED | REJECTED | FUNDED | IMPLEMENTED | AUDITED | WITHDRAWN
      - name: revision_count
        type: integer
        source: computed
        description: Number of times the request re-entered DRAFT from RETURNED via PATCH
        default: 0
      - name: return_count
        type: integer
        source: computed
        description: Number of times screening returned the request
        default: 0
      - name: safety_driver
        type: number
        source: computed
        description: Safety priority driver, 0.00..100.00, from priority_composite_score
        default: 0.00
      - name: growth_driver
        type: number
        source: computed
        description: Growth priority driver tier value, one of 0 / 25 / 50 / 75 / 100
        default: 0.00
      - name: regulatory_driver
        type: number
        source: computed
        description: Regulatory priority driver, one of 0 / 70 / 100
        default: 0.00
      - name: eos_driver
        type: number
        source: computed
        description: End-of-support priority driver, one of 0 / 60 / 100
        default: 0.00
      - name: composite_score
        type: number
        source: computed
        description: Weighted composite priority score after department penalty, 2 decimals
        default: 0.00
      - name: expedited
        type: boolean
        source: computed
        description: True when composite_score >= 85.00 at the most recent scoring
        default: false
      - name: budgetary_operating_5y_cents
        type: integer
        source: computed
        description: Five-year operating total of the `budgetary` variant of five_year_tco
        default: 0
      - name: budgetary_tco_cents
        type: integer
        source: computed
        description: Five-year TCO of the `budgetary` variant of five_year_tco
        default: 0
      - name: negotiated_operating_5y_cents
        type: integer
        source: computed
        description: Five-year operating total of the `negotiated` variant of five_year_tco; null until a VendorQuote is ACCEPTED
        default: null
      - name: negotiated_tco_cents
        type: integer
        source: computed
        description: Five-year TCO of the `negotiated` variant of five_year_tco; null until a VendorQuote is ACCEPTED
        default: null
      - name: baseline_year1_opex_cents
        type: integer
        source: computed
        description: Year-1 operating total (service + disposables) of the authoritative TCO variant (negotiated when present, else budgetary); the business-case baseline the utilization audit measures against
        default: 0
      - name: funded_amount_cents
        type: integer
        source: computed
        description: Capital committed against the facility allocation; net_capital_cents of the ACCEPTED quote plus facility_modification_cents when a quote is accepted, else estimated_capital_cents
        default: 0

  - name: PriorityScore
    parent: ReplacementRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: system
        description: FK -> ReplacementRequest.id; scored request
      - name: sequence
        type: integer
        source: computed
        description: 1-based append sequence of scores for this request; the highest sequence is the authoritative score
      - name: reason
        type: enum
        source: system
        description: What produced this score row
        constraints: CYCLE_SCORING | ASSET_CONDITION_CHANGE | DEPARTMENT_PENALTY_CHANGE
      - name: asset_adjusted_ruls_snapshot
        type: number
        source: computed
        description: EquipmentAsset.adjusted_ruls_score pinned at scoring time
      - name: corrective_count_snapshot
        type: integer
        source: computed
        description: EquipmentAsset.corrective_count_24m pinned at scoring time
      - name: safety_driver
        type: number
        source: computed
        description: Safety driver value of this score row
      - name: growth_driver
        type: number
        source: computed
        description: Growth driver value of this score row
      - name: regulatory_driver
        type: number
        source: computed
        description: Regulatory driver value of this score row
      - name: eos_driver
        type: number
        source: computed
        description: End-of-support driver value of this score row
      - name: department_penalty_points
        type: integer
        source: computed
        description: Department.utilization_penalty_points subtracted in this score row
      - name: composite_score
        type: number
        source: computed
        description: Composite score of this row, 2 decimals
      - name: expedited
        type: boolean
        source: computed
        description: Whether this row's composite_score >= 85.00

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Member display name
        constraints: 1..120 chars
      - name: seat
        type: enum
        source: input
        description: Committee seat; CHAIR closes voting, SAFETY_OFFICER may cast VETO
        constraints: CHAIR | FINANCE | CLINICAL | FACILITIES | SAFETY_OFFICER
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; when set the member only votes on requests of that facility; null means a system-wide seat
        default: null
      - name: department_id
        type: string
        source: input
        description: FK -> Department.id; when set the member is conflicted out of that department's requests
        default: null
      - name: voting_weight
        type: integer
        source: input
        description: Integer vote weight used for quorum and tally cross-multiplication
        constraints: "1..5"
      - name: active
        type: boolean
        source: system
        description: Whether the seat currently counts toward quorum
        default: true

  - name: CommitteeVote
    parent: ReplacementRequest
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: system
        description: FK -> ReplacementRequest.id; request being voted on, taken from the path
      - name: member_id
        type: string
        source: system
        description: FK -> CommitteeMember.id; voting member, taken from X-User-ID
      - name: vote
        type: enum
        source: input
        description: Ballot value; VETO is restricted to the SAFETY_OFFICER seat
        constraints: APPROVE | REJECT | ABSTAIN | VETO
      - name: rationale
        type: string
        source: input
        description: Free-text ballot rationale
        constraints: 0..500 chars
      - name: counted_weight
        type: integer
        source: computed
        description: CommitteeMember.voting_weight pinned when the ballot was cast
      - name: superseded
        type: boolean
        source: computed
        description: True once the same member casts a later ballot on the same request; superseded ballots are excluded from quorum and tally
        default: false

  - name: GpoContract
    parent: null
    common_fields: true
    fields:
      - name: contract_code
        type: string
        source: input
        description: Group purchasing contract code
        constraints: 2..24 chars, unique
      - name: vendor_name
        type: string
        source: input
        description: Contracted vendor name
        constraints: 1..120 chars
      - name: small_tier_pct
        type: number
        source: input
        description: Discount fraction when list_price_cents < tier_mid_floor_cents
        constraints: 0.00..0.50, at most 4 decimals
      - name: mid_tier_pct
        type: number
        source: input
        description: Discount fraction when tier_mid_floor_cents <= list_price_cents < tier_large_floor_cents
        constraints: 0.00..0.50, at most 4 decimals
      - name: large_tier_pct
        type: number
        source: input
        description: Discount fraction when list_price_cents >= tier_large_floor_cents
        constraints: 0.00..0.50, at most 4 decimals
      - name: tier_mid_floor_cents
        type: integer
        source: input
        description: Inclusive lower bound of the MID discount tier, evaluated on list price
        constraints: "> 0"
      - name: tier_large_floor_cents
        type: integer
        source: input
        description: Inclusive lower bound of the LARGE discount tier, evaluated on list price
        constraints: "> tier_mid_floor_cents"
      - name: multi_unit_addendum_pct
        type: number
        source: input
        description: Additional discount fraction applied to the post-GPO-discount amount when multi_unit_count >= 2
        constraints: 0.00..0.20, at most 4 decimals
      - name: trade_in_cap_pct
        type: number
        source: input
        description: Cap on trade-in credit as a fraction of the post-discount subtotal
        constraints: 0.00..0.50, at most 4 decimals
      - name: expires_on
        type: datetime
        source: input
        description: Contract expiry instant; quotes may not be created against an expired contract

  - name: VendorQuote
    parent: ReplacementRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: FK -> ReplacementRequest.id; request being quoted, taken from the path
      - name: gpo_contract_id
        type: string
        source: input
        description: FK -> GpoContract.id; group purchasing contract whose tier table prices the quote
      - name: trade_in_asset_id
        type: string
        source: input
        description: FK -> EquipmentAsset.id; asset offered for trade-in; must be the request's asset_id
        default: null
      - name: vendor_name
        type: string
        source: input
        description: Quoting vendor
        constraints: 1..120 chars
      - name: list_price_cents
        type: integer
        source: input
        description: Current list price in cents; counters and revisions overwrite it and re-run negotiated_capital_price
        constraints: "> 0"
      - name: trade_in_offer_cents
        type: integer
        source: input
        description: Vendor's offered trade-in amount in cents before the contract cap
        default: 0
        constraints: ">= 0"
      - name: multi_unit_count
        type: integer
        source: input
        description: Number of units on the quote; >= 2 activates the multi-unit addendum
        default: 1
        constraints: "1..10"
      - name: warranty_months
        type: integer
        source: input
        description: Included warranty months; waives the service contract for TCO year 1 at >= 12 and year 2 at >= 24
        default: 0
        constraints: 0 | 12 | 24
      - name: service_escalation_pct
        type: number
        source: input
        description: Annual service contract escalation fraction used by the negotiated TCO variant
        constraints: 0.00..0.25, at most 4 decimals
      - name: valid_until
        type: datetime
        source: input
        description: Last instant the quote may be accepted, compared against the logical clock
      - name: status
        type: enum
        source: system
        description: Negotiation state
        default: SUBMITTED
        constraints: SUBMITTED | COUNTERED | ACCEPTED | WITHDRAWN | SUPERSEDED
      - name: negotiation_round
        type: integer
        source: computed
        description: 1 at creation, incremented by each counter; a revise beyond MAX_NEGOTIATION_ROUNDS is rejected
        default: 1
      - name: gpo_tier
        type: enum
        source: computed
        description: Tier selected from list_price_cents by negotiated_capital_price step 1
        constraints: SMALL | MID | LARGE
      - name: gpo_discount_cents
        type: integer
        source: computed
        description: Step 2 of negotiated_capital_price
        default: 0
      - name: multi_unit_addendum_cents
        type: integer
        source: computed
        description: Step 3 of negotiated_capital_price
        default: 0
      - name: subtotal_cents
        type: integer
        source: computed
        description: Step 4 of negotiated_capital_price
        default: 0
      - name: trade_in_credit_cents
        type: integer
        source: computed
        description: Step 5 of negotiated_capital_price, capped at trade_in_cap_pct of subtotal_cents
        default: 0
      - name: net_capital_cents
        type: integer
        source: computed
        description: Step 6 of negotiated_capital_price; the capital term of the negotiated TCO variant
        default: 0

  - name: InstallationProject
    parent: ReplacementRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: FK -> ReplacementRequest.id; funded request being installed, taken from the path
      - name: facility_id
        type: string
        source: system
        description: FK -> Facility.id; copied from the request's department at creation; construction capacity is evaluated per facility
      - name: department_id
        type: string
        source: system
        description: FK -> Department.id; copied from the request at creation; downtime conflicts are evaluated per department
      - name: predecessor_project_id
        type: string
        source: input
        description: FK -> InstallationProject.id; project that must reach equipment_status COMMISSIONED before this one may go live
        default: null
      - name: construction_required
        type: boolean
        source: input
        description: Whether facility construction is part of the project
        default: false
      - name: construction_start
        type: datetime
        source: input
        description: Inclusive start of the construction interval; required when construction_required is true
        default: null
      - name: construction_end
        type: datetime
        source: input
        description: Inclusive end of the construction interval; required when construction_required is true
        default: null
      - name: downtime_start
        type: datetime
        source: input
        description: Start of the clinical downtime interval, half-open [downtime_start, downtime_end)
      - name: downtime_end
        type: datetime
        source: input
        description: End of the clinical downtime interval, exclusive; must be > downtime_start
      - name: construction_status
        type: enum
        source: system
        description: Construction state dimension; advances independently of equipment_status
        default: NOT_REQUIRED
        constraints: NOT_REQUIRED | DESIGN | PERMIT | BUILD | COMPLETE
      - name: equipment_status
        type: enum
        source: system
        description: Equipment state dimension; advances independently of construction_status
        default: AWAITING_DELIVERY
        constraints: AWAITING_DELIVERY | DELIVERED | INSTALLED | COMMISSIONED
      - name: record_status
        type: enum
        source: system
        description: ACTIVE rows occupy downtime and construction windows; CANCELLED rows release them
        default: ACTIVE
        constraints: ACTIVE | CANCELLED
      - name: go_live_at
        type: datetime
        source: system
        description: Logical-clock instant the project went live
        default: null

  - name: UtilizationAudit
    parent: ReplacementRequest
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: system
        description: FK -> ReplacementRequest.id; implemented request being audited, taken from the path
      - name: installation_project_id
        type: string
        source: input
        description: FK -> InstallationProject.id; project whose go-live starts the audit window
      - name: audit_window_start
        type: datetime
        source: input
        description: Start of the observation window; must be >= the project's go_live_at
      - name: audit_window_end
        type: datetime
        source: input
        description: End of the observation window; must be > audit_window_start
      - name: projected_annual_volume_snapshot
        type: integer
        source: computed
        description: ReplacementRequest.projected_annual_volume pinned at audit creation
      - name: baseline_year1_opex_snapshot
        type: integer
        source: computed
        description: ReplacementRequest.baseline_year1_opex_cents pinned at audit creation
      - name: actual_annual_volume
        type: integer
        source: input
        description: Observed annual volume, supplied by the collect call
        default: null
        constraints: ">= 0"
      - name: actual_annual_opex_cents
        type: integer
        source: input
        description: Observed annual operating cost in cents, supplied by the collect call
        default: null
        constraints: ">= 0"
      - name: volume_attainment_pct
        type: number
        source: computed
        description: round_half_up(actual_annual_volume / projected_annual_volume_snapshot * 100, 2)
        default: null
      - name: opex_variance_pct
        type: number
        source: computed
        description: round_half_up((actual_annual_opex_cents - baseline_year1_opex_snapshot) / baseline_year1_opex_snapshot * 100, 2)
        default: null
      - name: status
        type: enum
        source: system
        description: Audit state; the verdict branch is decided by business_case_variance
        default: SCHEDULED
        constraints: SCHEDULED | PASSED | UNDERPERFORMING

state_machines:
  - entity: CapitalCycle
    initial_state: DRAFT
    terminal_states: [COMMITTED]
    transitions:
      - from: DRAFT
        to: INTAKE_OPEN
        trigger: "POST /capital/cycles/{id}/open-intake"
        actor: CapitalPlanner
        preconditions: ["cycle.status == DRAFT"]
        side_effects: ["cycle.version += 1"]
      - from: INTAKE_OPEN
        to: SCORING
        trigger: "POST /capital/cycles/{id}/close-intake"
        actor: CapitalPlanner
        preconditions: ["cycle.status == INTAKE_OPEN"]
        side_effects:
          - "requests of this cycle still in DRAFT, RETURNED or SUBMITTED keep their status and can no longer be submitted or screened forward into this cycle"
          - "cycle.version += 1"
        note: "Only requests already in SCREENED enter the scoring run."
      - from: SCORING
        to: SCORING
        trigger: "POST /capital/cycles/{id}/score"
        actor: CapitalPlanner
        preconditions: ["cycle.status == SCORING"]
        side_effects:
          - "for each request of this cycle in SCREENED (created_at ASC): run priority_composite_score, append a PriorityScore row with reason CYCLE_SCORING, move request SCREENED -> SCORED, request.version += 1"
          - "for each request of this cycle already in SCORED (created_at ASC): re-run priority_composite_score, append a PriorityScore row with reason CYCLE_SCORING, request.version += 1"
          - "cycle.scored_count = count of this cycle's requests with status == SCORED after the run"
          - "cycle.expedited_count = count of this cycle's requests with expedited == true after the run"
          - "cycle.version += 1"
      - from: SCORING
        to: ALLOCATED
        trigger: "POST /capital/cycles/{id}/allocate"
        actor: CapitalPlanner
        preconditions:
          - "cycle.status == SCORING"
          - "expected_cycle_version == cycle.version"
          - "at least one request of this cycle has status == SCORED"
        side_effects:
          - "run facility_allocation_waterfall with the requested allocation_method; create one FacilityAllocation per facility receiving capital"
          - "cycle.allocation_method, system_contingency_cents, distributable_cents, unallocated_cents, contingency_drawn_cents, allocation_count set"
          - "cycle.allocated_by_user_id = X-User-ID of the caller"
          - "cycle.exhausted_allocation_count = 0"
          - "cycle.version += 1"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "POST /capital/cycles/{id}/allocate (re-run, supersedes the prior allocation set)"
        actor: CapitalPlanner
        preconditions:
          - "cycle.status == ALLOCATED"
          - "expected_cycle_version == cycle.version"
          - "every FacilityAllocation of this cycle with posture != SUPERSEDED has committed_cents == 0"
          - "at least one request of this cycle has status == SCORED"
        side_effects:
          - "every existing FacilityAllocation of this cycle -> posture SUPERSEDED, allocation.version += 1"
          - "a fresh allocation set is created from the current composite scores with the newly requested allocation_method"
          - "cycle.allocation_method, allocated_by_user_id and all allocation aggregates are overwritten; cycle.version += 1"
      - from: ALLOCATED
        to: COMMITTED
        trigger: "POST /capital/cycles/{id}/commit, or system when exhausted_allocation_count reaches allocation_count after a funding"
        actor: CapitalPlanner | system
        preconditions: ["cycle.status == ALLOCATED"]
        side_effects:
          - "every request of this cycle with status IN {SCORED, IN_COMMITTEE}, processed created_at ASC, -> DEFERRED with request.version += 1"
          - "cycle.version += 1"
        note: "COMMITTED is sticky: a later withdraw-funding restores allocation capital but never returns the cycle to ALLOCATED."

  - entity: ReplacementRequest
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN, AUDITED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /capital/requests/{id}"
        actor: ClinicalRequester
        preconditions:
          - "request.status == DRAFT"
          - "X-User-ID == request.department_id"
          - "facility_modification_cents <= 30% of estimated_capital_cents after the patch"
        side_effects: ["request.version += 1"]
      - from: RETURNED
        to: DRAFT
        trigger: "PATCH /capital/requests/{id}"
        actor: ClinicalRequester
        preconditions:
          - "request.status == RETURNED"
          - "X-User-ID == request.department_id"
          - "facility_modification_cents <= 30% of estimated_capital_cents after the patch"
        side_effects: ["request.revision_count += 1", "request.version += 1"]
        note: "The revision loop RETURNED -> DRAFT -> SUBMITTED is bounded by MAX_REVISIONS at submit time."
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /capital/requests/{id}/submit"
        actor: ClinicalRequester
        preconditions:
          - "request.status == DRAFT"
          - "X-User-ID == request.department_id"
          - "cycle.status == INTAKE_OPEN"
          - "request.revision_count <= MAX_REVISIONS (3)"
          - "asset.status != DECOMMISSIONED AND (asset.adjusted_ruls_score <= 30.00 OR asset.status == DERATED OR asset.unresolved_recall == true)"
          - "no other request with the same asset_id and cycle_id has status NOT IN {WITHDRAWN, REJECTED, DEFERRED}"
          - "regulatory_mandate_flag == false OR mandate_deadline is not null"
          - "facility_modification_cents <= 30% of estimated_capital_cents"
        side_effects:
          - "run five_year_tco variant `budgetary`: set budgetary_operating_5y_cents, budgetary_tco_cents, baseline_year1_opex_cents"
          - "request.version += 1"
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /capital/requests/{id}/screen with decision == ACCEPT"
        actor: CapitalPlanner
        preconditions: ["request.status == SUBMITTED", "cycle.status IN {INTAKE_OPEN, SCORING}"]
        side_effects: ["request.version += 1"]
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /capital/requests/{id}/screen with decision == RETURN"
        actor: CapitalPlanner
        preconditions: ["request.status == SUBMITTED", "cycle.status IN {INTAKE_OPEN, SCORING}"]
        side_effects: ["request.return_count += 1", "request.version += 1"]
        note: "Branch point: the same endpoint forks into SCREENED or RETURNED with disjoint side-effect sets."
      - from: SCREENED
        to: SCORED
        trigger: "POST /capital/cycles/{id}/score (system, per request)"
        actor: system
        preconditions: ["request.status == SCREENED", "cycle.status == SCORING"]
        side_effects:
          - "append PriorityScore (reason CYCLE_SCORING, sequence = prior max + 1) with the four driver values and the department penalty snapshot"
          - "request.safety_driver, growth_driver, regulatory_driver, eos_driver, composite_score, expedited refreshed from that row"
          - "request.version += 1"
      - from: SCORED
        to: SCORED
        trigger: "POST /capital/cycles/{id}/score re-run, or system re-score after an asset condition change or a department penalty change"
        actor: system
        preconditions: ["request.status == SCORED"]
        side_effects:
          - "append PriorityScore with reason CYCLE_SCORING | ASSET_CONDITION_CHANGE | DEPARTMENT_PENALTY_CHANGE and sequence = prior max + 1"
          - "request.composite_score and expedited refreshed; cycle.expedited_count refreshed"
          - "request.version += 1"
      - from: SCORED
        to: IN_COMMITTEE
        trigger: "POST /capital/requests/{id}/votes (first counted ballot)"
        actor: CommitteeMember
        preconditions:
          - "request.status == SCORED"
          - "expected_request_version == request.version"
          - "cycle.status == ALLOCATED"
          - "a FacilityAllocation with posture != SUPERSEDED exists for cycle_id and the request's facility"
          - "the acting member is eligible: active == true, (facility_id is null OR facility_id == request facility), member.id != request.sponsor_member_id, member.department_id != request.department_id"
        side_effects:
          - "create CommitteeVote with counted_weight = member.voting_weight"
          - "request.version += 1"
      - from: IN_COMMITTEE
        to: IN_COMMITTEE
        trigger: "POST /capital/requests/{id}/votes (subsequent ballots)"
        actor: CommitteeMember
        preconditions:
          - "request.status == IN_COMMITTEE"
          - "expected_request_version == request.version"
          - "cycle.status == ALLOCATED"
          - "the acting member is eligible (same eligibility predicate as above)"
        side_effects:
          - "any prior CommitteeVote of the same member on this request -> superseded = true"
          - "create CommitteeVote with counted_weight = member.voting_weight"
          - "request.version += 1"
      - from: IN_COMMITTEE
        to: APPROVED
        trigger: "POST /capital/requests/{id}/committee-decision"
        actor: CommitteeMember
        preconditions:
          - "request.status == IN_COMMITTEE"
          - "acting member seat == CHAIR (presiding is procedural; the chair's own voting eligibility for this request is NOT required)"
          - "no counted ballot from an eligible SAFETY_OFFICER has vote == VETO"
          - "eligible voter set is non-empty"
          - "quorum: cast_weight * 5 >= quorum_weight * 3"
          - "approval: approve_weight * 3 >= cast_weight * 2"
        side_effects: ["request.version += 1"]
      - from: IN_COMMITTEE
        to: DEFERRED
        trigger: "POST /capital/requests/{id}/committee-decision"
        actor: CommitteeMember
        preconditions:
          - "request.status == IN_COMMITTEE"
          - "acting member seat == CHAIR (presiding is procedural; the chair's own voting eligibility for this request is NOT required)"
          - "no VETO from an eligible SAFETY_OFFICER"
          - "quorum met"
          - "approve_weight * 3 < cast_weight * 2 AND approve_weight * 2 >= cast_weight"
        side_effects: ["request.version += 1"]
      - from: IN_COMMITTEE
        to: REJECTED
        trigger: "POST /capital/requests/{id}/committee-decision"
        actor: CommitteeMember
        preconditions:
          - "request.status == IN_COMMITTEE"
          - "acting member seat == CHAIR (presiding is procedural; the chair's own voting eligibility for this request is NOT required)"
          - "a counted ballot from an eligible SAFETY_OFFICER has vote == VETO (veto is evaluated before quorum), OR quorum met AND approve_weight * 2 < cast_weight"
        side_effects: ["request.version += 1"]
      - from: SCORED
        to: DEFERRED
        trigger: "POST /capital/cycles/{id}/commit, or the system auto-commit that follows an allocation-exhausting funding"
        actor: system
        preconditions: ["request.status == SCORED", "cycle transitions ALLOCATED -> COMMITTED"]
        side_effects: ["request.version += 1"]
      - from: IN_COMMITTEE
        to: DEFERRED
        trigger: "POST /capital/cycles/{id}/commit, or the system auto-commit that follows an allocation-exhausting funding"
        actor: system
        preconditions: ["request.status == IN_COMMITTEE", "cycle transitions ALLOCATED -> COMMITTED"]
        side_effects: ["request.version += 1"]
      - from: APPROVED
        to: FUNDED
        trigger: "POST /capital/requests/{id}/fund"
        actor: CapitalPlanner
        preconditions:
          - "request.status == APPROVED"
          - "cycle.status == ALLOCATED"
          - "X-User-ID != cycle.allocated_by_user_id"
          - "a FacilityAllocation with posture IN {ACTIVE, EXHAUSTED} exists for cycle_id and the request's facility"
          - "allocation.available_cents >= funded_amount_cents computed by request_funded_amount"
        side_effects:
          - "request.funded_amount_cents set by request_funded_amount; request.version += 1"
          - "allocation.committed_cents += funded_amount_cents; allocation.available_cents recomputed; allocation.version += 1"
          - "asset.status IN_SERVICE|DERATED -> REPLACEMENT_PENDING; asset.version += 1"
          - "CASCADE hop 2: because allocation.available_cents reached 0, allocation.posture -> EXHAUSTED"
          - "CASCADE hop 3: because that allocation became EXHAUSTED, cycle.exhausted_allocation_count += 1 and, when it equals cycle.allocation_count, cycle.status -> COMMITTED with cycle.version += 1"
          - "CASCADE hop 4: because the cycle reached COMMITTED, every request of the cycle still in SCORED or IN_COMMITTEE -> DEFERRED (created_at ASC), each with request.version += 1"
      - from: FUNDED
        to: APPROVED
        trigger: "POST /capital/requests/{id}/withdraw-funding"
        actor: CapitalPlanner
        preconditions:
          - "request.status == FUNDED"
          - "no InstallationProject of this request has record_status == ACTIVE"
        side_effects:
          - "allocation.committed_cents -= request.funded_amount_cents; allocation.available_cents recomputed; allocation.version += 1"
          - "allocation.posture EXHAUSTED -> ACTIVE and cycle.exhausted_allocation_count -= 1 when available_cents becomes > 0 (cycle.status is not reverted)"
          - "request.funded_amount_cents -> 0; request.version += 1"
          - "asset.status REPLACEMENT_PENDING -> DERATED when asset.adjusted_ruls_score <= 15.00 OR asset.unresolved_recall == true, else -> IN_SERVICE; asset.version += 1"
      - from: FUNDED
        to: IMPLEMENTED
        trigger: "POST /capital/installation-projects/{id}/go-live (system, on the request)"
        actor: system
        preconditions: ["request.status == FUNDED", "project.record_status == ACTIVE"]
        side_effects: ["request.version += 1"]
      - from: IMPLEMENTED
        to: AUDITED
        trigger: "POST /capital/audits/{id}/collect (system, on the request)"
        actor: system
        preconditions: ["request.status == IMPLEMENTED", "audit.status == SCHEDULED"]
        side_effects: ["request.version += 1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /capital/requests/{id}/withdraw"
        actor: ClinicalRequester
        preconditions: ["request.status IN {DRAFT, RETURNED, SUBMITTED, SCREENED, SCORED}", "X-User-ID == request.department_id"]
        side_effects: ["request.version += 1", "cycle.scored_count and expedited_count refreshed when the request was SCORED"]
        note: "Same transition applies from RETURNED, SUBMITTED, SCREENED and SCORED; FUNDED and later states cannot be withdrawn."

  - entity: EquipmentAsset
    initial_state: "IN_SERVICE — but POST /capital/assets runs the asset_ruls_score derate gate (step 9) before the row is written, so an asset whose adjusted_ruls_score is <= 15.00 at creation, or that is created with an unresolved recall, is born DERATED instead"
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: DERATED
        trigger: "POST /capital/assets/{id}/service-events (system, after asset_ruls_score re-run)"
        actor: system
        preconditions: ["asset.status == IN_SERVICE", "adjusted_ruls_score <= 15.00 OR unresolved_recall == true"]
        side_effects:
          - "asset.version += 1"
          - "CASCADE hop 3: because the asset became DERATED, every request of this asset in status SCORED is re-scored (new PriorityScore, reason ASSET_CONDITION_CHANGE) and its composite_score / expedited refreshed"
          - "CASCADE hop 4: because a re-scored request's expedited flipped, cycle.expedited_count is refreshed and cycle.version += 1"
      - from: DERATED
        to: IN_SERVICE
        trigger: "POST /capital/assets/{id}/service-events (system, after asset_ruls_score re-run)"
        actor: system
        preconditions: ["asset.status == DERATED", "adjusted_ruls_score > 15.00", "unresolved_recall == false"]
        side_effects:
          - "asset.version += 1"
          - "requests of this asset in status SCORED are re-scored (reason ASSET_CONDITION_CHANGE)"
        note: "Cycle IN_SERVICE -> DERATED -> IN_SERVICE: a RECALL resolution event or a downtime window rolling out of the trailing 730 days restores service."
      - from: IN_SERVICE
        to: REPLACEMENT_PENDING
        trigger: "POST /capital/requests/{id}/fund (system)"
        actor: system
        preconditions: ["asset.status IN {IN_SERVICE, DERATED}", "request.asset_id == asset.id"]
        side_effects: ["asset.version += 1"]
        note: "Also applies from DERATED."
      - from: REPLACEMENT_PENDING
        to: IN_SERVICE
        trigger: "POST /capital/requests/{id}/withdraw-funding (system)"
        actor: system
        preconditions: ["asset.status == REPLACEMENT_PENDING", "adjusted_ruls_score > 15.00 AND unresolved_recall == false"]
        side_effects: ["asset.version += 1"]
        note: "When the condition fails the asset returns to DERATED instead."
      - from: REPLACEMENT_PENDING
        to: DECOMMISSIONED
        trigger: "POST /capital/assets/{id}/decommission"
        actor: CapitalPlanner
        preconditions:
          - "asset.status == REPLACEMENT_PENDING"
          - "the InstallationProject of the funding request with record_status == ACTIVE has equipment_status == COMMISSIONED"
          - "disposition input TRADED_IN requires asset.disposition_status == HELD_FOR_TRADE_IN"
        side_effects:
          - "asset.disposition_status -> TRADED_IN or SCRAPPED per the disposition input"
          - "facility.active_asset_count -= 1; facility.version += 1"
          - "asset.version += 1"

  - entity: VendorQuote
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /capital/vendor-quotes/{id}/counter"
        actor: CapitalPlanner
        preconditions: ["quote.status == SUBMITTED"]
        side_effects:
          - "list_price_cents = counter_list_price_cents; trade_in_offer_cents = counter_trade_in_offer_cents when supplied"
          - "negotiation_round += 1; re-run negotiated_capital_price (gpo_tier, gpo_discount_cents, multi_unit_addendum_cents, subtotal_cents, trade_in_credit_cents, net_capital_cents)"
          - "quote.version += 1"
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /capital/vendor-quotes/{id}/revise"
        actor: CapitalPlanner
        preconditions: ["quote.status == COUNTERED", "quote.negotiation_round <= MAX_NEGOTIATION_ROUNDS (3)"]
        side_effects:
          - "list_price_cents = revised_list_price_cents; trade_in_offer_cents / warranty_months replaced when supplied"
          - "re-run negotiated_capital_price; quote.version += 1"
        note: "Cyclic negotiation: SUBMITTED -> COUNTERED -> SUBMITTED repeats until negotiation_round exceeds MAX_NEGOTIATION_ROUNDS."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /capital/vendor-quotes/{id}/accept"
        actor: CapitalPlanner
        preconditions:
          - "quote.status == SUBMITTED"
          - "request.status IN {APPROVED, FUNDED}"
          - "logical clock now <= quote.valid_until"
          - "request.safety_driver < 90.00 OR safety_review_ack == true"
          - "trade_in_asset_id is null OR (trade_in_asset_id == request.asset_id AND asset.status != DECOMMISSIONED AND asset.disposition_status IN {NONE, HELD_FOR_TRADE_IN})"
        side_effects:
          - "any other ACCEPTED quote of the same request -> SUPERSEDED, its trade-in credit released from the asset, quote.version += 1"
          - "asset.trade_in_credit_applied_cents = quote.trade_in_credit_cents and asset.disposition_status = HELD_FOR_TRADE_IN when trade_in_asset_id is set; asset.version += 1"
          - "CASCADE hop 2: because a quote is now ACCEPTED, run five_year_tco variant `negotiated` -> request.negotiated_operating_5y_cents, negotiated_tco_cents, baseline_year1_opex_cents and request_funded_amount -> request.funded_amount_cents; request.version += 1"
          - "CASCADE hop 3: because request.funded_amount_cents changed while request.status == FUNDED, allocation.committed_cents is adjusted by the delta and available_cents recomputed; allocation.version += 1"
          - "CASCADE hop 4: because allocation.available_cents became > 0, allocation.posture EXHAUSTED -> ACTIVE and cycle.exhausted_allocation_count -= 1; cycle.version += 1"
          - "quote.version += 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /capital/vendor-quotes/{id}/withdraw"
        actor: CapitalPlanner
        preconditions: ["quote.status IN {SUBMITTED, COUNTERED, ACCEPTED}", "request.status != IMPLEMENTED", "request.status != AUDITED"]
        side_effects:
          - "when the quote was ACCEPTED: asset.trade_in_credit_applied_cents -> 0 and asset.disposition_status HELD_FOR_TRADE_IN -> NONE; asset.version += 1"
          - "when the quote was ACCEPTED: request.negotiated_operating_5y_cents and negotiated_tco_cents -> null, baseline_year1_opex_cents recomputed from the budgetary variant, request_funded_amount re-run; request.version += 1"
          - "when request.status == FUNDED: allocation.committed_cents adjusted by the delta, available_cents recomputed, posture refreshed, allocation.version += 1"
          - "quote.version += 1"
        note: "Also applies from SUBMITTED and COUNTERED, where only the quote row changes."
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /capital/vendor-quotes/{id}/accept on a sibling quote of the same request (system)"
        actor: system
        preconditions: ["quote.status IN {SUBMITTED, COUNTERED, ACCEPTED}", "another quote of the same request transitions to ACCEPTED"]
        side_effects: ["quote.version += 1", "trade-in credit released when the superseded quote was ACCEPTED"]

  - entity: InstallationProject
    initial_state: "construction_status = NOT_REQUIRED (DESIGN when construction_required == true) x equipment_status = AWAITING_DELIVERY x record_status = ACTIVE"
    terminal_states: ["record_status = CANCELLED", "go_live_at set with construction_status IN {NOT_REQUIRED, COMPLETE} and equipment_status = COMMISSIONED"]
    transitions:
      - from: "construction_status = DESIGN"
        to: "construction_status = PERMIT"
        trigger: "POST /capital/installation-projects/{id}/advance-construction"
        actor: FacilityDirector
        preconditions: ["project.record_status == ACTIVE", "project.construction_status == DESIGN", "X-User-ID == project.facility_id"]
        side_effects: ["project.version += 1"]
        note: "Construction axis advances DESIGN -> PERMIT -> BUILD -> COMPLETE, one step per call, independently of equipment_status."
      - from: "construction_status = PERMIT"
        to: "construction_status = BUILD"
        trigger: "POST /capital/installation-projects/{id}/advance-construction"
        actor: FacilityDirector
        preconditions: ["project.record_status == ACTIVE", "project.construction_status == PERMIT", "X-User-ID == project.facility_id"]
        side_effects: ["project.version += 1"]
      - from: "construction_status = BUILD"
        to: "construction_status = COMPLETE"
        trigger: "POST /capital/installation-projects/{id}/advance-construction"
        actor: FacilityDirector
        preconditions: ["project.record_status == ACTIVE", "project.construction_status == BUILD", "X-User-ID == project.facility_id"]
        side_effects: ["project.version += 1"]
      - from: "construction_status = NOT_REQUIRED"
        to: "(rejected)"
        trigger: "POST /capital/installation-projects/{id}/advance-construction"
        actor: FacilityDirector
        preconditions: ["project.construction_status IN {DESIGN, PERMIT, BUILD}"]
        side_effects: []
        note: "A project created with construction_required == false has no construction axis; advancing it fails with ERR_PROJECT_INVALID_STATE."
      - from: "equipment_status = AWAITING_DELIVERY"
        to: "equipment_status = DELIVERED"
        trigger: "POST /capital/installation-projects/{id}/advance-equipment"
        actor: FacilityDirector
        preconditions: ["project.record_status == ACTIVE", "project.equipment_status == AWAITING_DELIVERY", "X-User-ID == project.facility_id"]
        side_effects: ["project.version += 1"]
        note: "Equipment axis advances AWAITING_DELIVERY -> DELIVERED -> INSTALLED -> COMMISSIONED and never reads construction_status."
      - from: "equipment_status = DELIVERED"
        to: "equipment_status = INSTALLED"
        trigger: "POST /capital/installation-projects/{id}/advance-equipment"
        actor: FacilityDirector
        preconditions: ["project.record_status == ACTIVE", "project.equipment_status == DELIVERED", "X-User-ID == project.facility_id"]
        side_effects: ["project.version += 1"]
      - from: "equipment_status = INSTALLED"
        to: "equipment_status = COMMISSIONED"
        trigger: "POST /capital/installation-projects/{id}/advance-equipment"
        actor: FacilityDirector
        preconditions: ["project.record_status == ACTIVE", "project.equipment_status == INSTALLED", "X-User-ID == project.facility_id"]
        side_effects: ["project.version += 1"]
      - from: "record_status = ACTIVE, go_live_at = null"
        to: "go_live_at set"
        trigger: "POST /capital/installation-projects/{id}/go-live"
        actor: FacilityDirector
        preconditions:
          - "project.record_status == ACTIVE AND project.go_live_at is null"
          - "X-User-ID == project.facility_id"
          - "project.construction_status IN {NOT_REQUIRED, COMPLETE}"
          - "project.equipment_status == COMMISSIONED"
          - "request.status == FUNDED"
          - "predecessor_project_id is null OR the predecessor has record_status == ACTIVE AND equipment_status == COMMISSIONED"
        side_effects:
          - "project.go_live_at = logical clock now; project.version += 1"
          - "request.status FUNDED -> IMPLEMENTED; request.version += 1"
        note: "Fork-join: both independent axes must have converged before the join step succeeds."
      - from: "record_status = ACTIVE"
        to: "record_status = CANCELLED"
        trigger: "POST /capital/installation-projects/{id}/cancel"
        actor: CapitalPlanner
        preconditions: ["project.record_status == ACTIVE", "project.go_live_at is null"]
        side_effects:
          - "project.record_status = CANCELLED; project.version += 1"
          - "the project's downtime and construction intervals stop occupying their resources, so a later project may claim overlapping windows"

  - entity: UtilizationAudit
    initial_state: SCHEDULED
    terminal_states: [PASSED, UNDERPERFORMING]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /capital/audits/{id}/collect"
        actor: ComplianceAuditor
        preconditions:
          - "audit.status == SCHEDULED"
          - "request.status == IMPLEMENTED"
          - "business_case_variance yields volume_attainment_pct >= 80.00 AND opex_variance_pct <= 10.00"
        side_effects:
          - "audit.actual_annual_volume, actual_annual_opex_cents, volume_attainment_pct, opex_variance_pct set; audit.version += 1"
          - "request.status IMPLEMENTED -> AUDITED; request.version += 1"
      - from: SCHEDULED
        to: UNDERPERFORMING
        trigger: "POST /capital/audits/{id}/collect"
        actor: ComplianceAuditor
        preconditions:
          - "audit.status == SCHEDULED"
          - "request.status == IMPLEMENTED"
          - "business_case_variance yields volume_attainment_pct < 80.00 OR opex_variance_pct > 10.00"
        side_effects:
          - "audit metrics set; audit.version += 1; request.status -> AUDITED; request.version += 1"
          - "CASCADE hop 2: because the verdict is UNDERPERFORMING, department.utilization_penalty_points += 10 (capped at 20) and department.underperformance_flag = true; department.version += 1"
          - "CASCADE hop 3: because the department penalty changed, every request of that department in status SCORED whose cycle.status IN {SCORING, ALLOCATED} is re-scored (new PriorityScore, reason DEPARTMENT_PENALTY_CHANGE) with the new penalty subtracted; each request.version += 1 and its cycle.expedited_count refreshed"

concurrency_rules:
  - rule_id: vote-create-stale-request
    parent_entity: ReplacementRequest
    write_endpoint: "POST /capital/requests/{id}/votes"
    occ_field: "expected_request_version"
    description: |
      A ballot carrying a request version older than the request's current version is rejected. A member
      may legitimately re-cast on the same request (the later ballot supersedes the earlier one under the
      vote-supersede rule), so a second create is not blocked by any state precondition; the stale-version
      check is what stops a member from voting against a composite score that has already been replaced by
      a re-score (asset condition change or department penalty change) or by another member's ballot.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

  - rule_id: allocate-supersede-stale-cycle
    parent_entity: CapitalCycle
    write_endpoint: "POST /capital/cycles/{id}/allocate"
    occ_field: "expected_cycle_version"
    description: |
      An allocation run carrying a cycle version older than the cycle's current version is rejected. A
      re-run legitimately supersedes the prior allocation set while nothing is committed, so the second
      call is not blocked by a state precondition; the stale-version check is what stops a run computed
      from a superseded score set (a scoring re-run or a withdrawal changed the eligible requests) from
      overwriting a newer allocation.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

calculations:
  - name: asset_ruls_score
    trigger: "POST /capital/assets, PATCH /capital/assets/{id}, POST /capital/assets/{id}/service-events"
    algorithm_type: [decay_function, weighted_scoring, threshold]
    variants: [nominal, adjusted]
    input_set: "The asset row plus every ServiceEvent of the asset whose event_date lies in the closed trailing window [now - 730 days, now], where now is the logical clock at the triggering call"
    constants:
      DAYS_PER_YEAR: 365
      SERVICE_WINDOW_DAYS: 730
      CORRECTIVE_POINTS: "3.00"
      DOWNTIME_POINTS_PER_HOUR: "0.50"
      SERVICE_PENALTY_CAP: "40.00"
      EOS_ELAPSED_PENALTY: "20.00"
      EOS_IMMINENT_PENALTY: "8.00"
      EOS_IMMINENT_DAYS: 365
      RECALL_PENALTY: "10.00"
      DERATE_THRESHOLD: "15.00"
      ELIGIBILITY_THRESHOLD: "30.00"
    formula: |
      ruls_as_of = logical clock now.
      Step 1  age_years = round_half_up(days_between(install_date, ruls_as_of) / 365, 2).
              days_between is a whole-day count, so a 2190-day-old asset is age 6.00.
      Step 2  life_fraction_remaining = (expected_life_years - age_years) / expected_life_years.
      Step 3  VARIANT `nominal`:
                nominal_ruls_score = clamp(round_half_up(life_fraction_remaining * 100, 2), 0.00, 100.00)
              The nominal variant reads NOTHING but install_date and expected_life_years. It is the
              value stored in EquipmentAsset.nominal_ruls_score and is never used for eligibility,
              derating or the safety driver.
      Step 4  Window aggregates over the closed trailing 730-day window ending at ruls_as_of:
                corrective_count_24m = count of ServiceEvents with category == CORRECTIVE
                downtime_hours_24m   = sum of downtime_hours over ServiceEvents of ANY category
              (An UPGRADE or PM event contributes downtime but not corrective count.)
      Step 5  service_penalty_points = min(40.00,
                round_half_up(3.00 * corrective_count_24m + 0.50 * downtime_hours_24m, 2))
      Step 6  eos_penalty = 20.00                          when oem_support_end_date <= ruls_as_of
                          = 8.00                           when ruls_as_of < oem_support_end_date <= ruls_as_of + 365 days
                          = 0.00                           otherwise
      Step 7  unresolved_recall = true when the latest RECALL ServiceEvent of the asset, ordered
              (event_date DESC, created_at DESC) over ALL history (not just the 730-day window),
              has recall_resolved == false; false when there is no RECALL event at all.
              recall_penalty = 10.00 when unresolved_recall else 0.00.
      Step 8  VARIANT `adjusted`:
                adjusted_ruls_score = clamp(round_half_up(
                    nominal_ruls_score - service_penalty_points - eos_penalty - recall_penalty, 2),
                    0.00, 100.00)
              The penalties are SUBTRACTED from the nominal score, never multiplied into it.
      Step 9  Derate gate: asset.status is set to DERATED when adjusted_ruls_score <= 15.00 OR
              unresolved_recall == true, and to IN_SERVICE otherwise. On POST /capital/assets this
              decides the created row's status; on a service-event append it drives the
              IN_SERVICE <-> DERATED transitions. Assets already in REPLACEMENT_PENDING or
              DECOMMISSIONED are not re-gated.
      Step 10 Eligibility gate (read by POST /capital/requests/{id}/submit): the asset may back a
              replacement request when adjusted_ruls_score <= 30.00 OR status == DERATED OR
              unresolved_recall == true.
    precision: "age_years, all penalty terms and both scores are 2 decimals, round_half_up, clamped to [0.00, 100.00]"
    worked_example: |
      Asset A1: install_date 2020-08-02T00:00:00Z, expected_life_years 10, oem_support_end_date
      2029-01-01T00:00:00Z, logical clock 2026-08-01T00:00:00Z.
        days_between = 2190 -> age_years = round_half_up(2190/365, 2) = 6.00
        life_fraction_remaining = (10 - 6.00) / 10 = 0.40 -> nominal_ruls_score = 40.00
      Two CORRECTIVE ServiceEvents with downtime_hours 4.00 each, both inside the window:
        corrective_count_24m = 2, downtime_hours_24m = 8.00
        service_penalty_points = min(40.00, 3.00*2 + 0.50*8.00) = min(40.00, 10.00) = 10.00
        eos_penalty = 0.00 (2029-01-01 > 2027-08-01), recall_penalty = 0.00
        adjusted_ruls_score = 40.00 - 10.00 = 30.00  -> status IN_SERVICE (30.00 > 15.00),
                                                        eligible (30.00 <= 30.00)
      Asset A2, identical except downtime_hours 3.99 each:
        downtime_hours_24m = 7.98 -> service_penalty_points = 6.00 + 3.99 = 9.99
        adjusted_ruls_score = 30.01 -> NOT eligible (30.01 > 30.00)
      Asset B1: same install/life, oem_support_end_date 2026-12-01T00:00:00Z, four CORRECTIVE
      events with downtime_hours 0.00:
        service_penalty_points = 12.00, eos_penalty = 8.00 (2026-08-01 < 2026-12-01 <= 2027-08-01)
        adjusted_ruls_score = 40.00 - 12.00 - 8.00 = 20.00, corrective_count_24m = 4
    wrong_readings:
      - "Computing age from created_at (the row's insert time) instead of install_date — every asset would score 100.00."
      - "Multiplying the nominal score by a penalty factor (nominal * (1 - penalty/100)) instead of subtracting the penalty points."
      - "Rounding age_years only at the end, so the 2190-day asset scores 40.0000 rather than the 2-decimal chain."
      - "Deriving unresolved_recall from RECALL events inside the 730-day window only, so an older unresolved recall silently clears."
      - "Counting PM/UPGRADE events toward corrective_count_24m, or excluding their downtime_hours from downtime_hours_24m — the two aggregates have deliberately different category filters."
      - "Applying the SERVICE_PENALTY_CAP of 40.00 to the sum of all penalties instead of to service_penalty_points alone."

  - name: priority_composite_score
    trigger: "POST /capital/cycles/{id}/score; system re-score on an asset condition change or a department penalty change"
    algorithm_type: [weighted_scoring, tiered_pricing, threshold]
    input_set: "One ReplacementRequest with status SCREENED or SCORED, its EquipmentAsset (adjusted_ruls_score and corrective_count_24m as stored), its Department (utilization_penalty_points) and its CapitalCycle (plan_year_start)"
    constants:
      WEIGHT_SAFETY: "0.35"
      WEIGHT_GROWTH: "0.20"
      WEIGHT_REGULATORY: "0.25"
      WEIGHT_EOS: "0.20"
      SAFETY_RULS_COEFFICIENT: "0.75"
      SAFETY_CORRECTIVE_POINTS: "4.00"
      GROWTH_TIER_BREAKS: "[0.00, 10.00, 25.00, 50.00]"
      GROWTH_TIER_VALUES: "[0.00, 25.00, 50.00, 75.00, 100.00]"
      REGULATORY_NEAR_DEADLINE_DAYS: 365
      EOS_HORIZON_DAYS: 730
      EXPEDITE_THRESHOLD: "85.00"
    formula: |
      Step 1  safety_driver = min(100.00, round_half_up(
                  (100.00 - asset.adjusted_ruls_score) * 0.75
                  + 4.00 * asset.corrective_count_24m, 2))
              Reads the ADJUSTED variant of asset_ruls_score, never the nominal one.
      Step 2  volume_growth_pct = round_half_up(
                  (projected_annual_volume - current_annual_volume) / max(current_annual_volume, 1) * 100, 2)
              The 2-decimal rounding happens BEFORE the tier lookup, so a raw ratio of 9.995 becomes
              10.00 and crosses into the next tier.
              growth_driver =   0.00 when volume_growth_pct <   0.00
                             =  25.00 when   0.00 <= volume_growth_pct < 10.00
                             =  50.00 when  10.00 <= volume_growth_pct < 25.00
                             =  75.00 when  25.00 <= volume_growth_pct < 50.00
                             = 100.00 when  50.00 <= volume_growth_pct
      Step 3  regulatory_driver = 0.00 when regulatory_mandate_flag == false
                                = 100.00 when mandate_deadline <= cycle.plan_year_start + 365 days
                                = 70.00 otherwise
      Step 4  eos_driver = 100.00 when asset.oem_support_end_date <= cycle.plan_year_start
                         = 60.00  when asset.oem_support_end_date <= cycle.plan_year_start + 730 days
                         = 0.00   otherwise
              Note the eos DRIVER is measured against cycle.plan_year_start while the eos PENALTY
              inside asset_ruls_score is measured against the logical clock. The two dates are
              deliberately different.
      Step 5  weighted_sum = round_half_up(
                  0.35 * safety_driver + 0.20 * growth_driver
                + 0.25 * regulatory_driver + 0.20 * eos_driver, 2)
              ONE rounding over the whole weighted sum; the individual products are not rounded.
      Step 6  composite_score = clamp(round_half_up(
                  weighted_sum - department.utilization_penalty_points, 2), 0.00, 100.00)
              The department penalty is an integer point count subtracted AFTER weighting.
      Step 7  expedited = (composite_score >= 85.00)
      Step 8  Append a PriorityScore row: sequence = (max existing sequence for the request) + 1,
              reason from the trigger, asset_adjusted_ruls_snapshot, corrective_count_snapshot,
              the four driver values, department_penalty_points, composite_score, expedited.
              The request's own driver / composite_score / expedited fields mirror the highest-sequence row.
    precision: "Every driver and score is 2 decimals, round_half_up; the weighted sum is rounded once"
    worked_example: |
      Request R1 (asset A1 above: adjusted 30.00, corrective 4-> here 2), department penalty 0,
      cycle plan_year_start 2027-01-01T00:00:00Z:
        safety_driver = min(100.00, round_half_up(70.00*0.75 + 4.00*2, 2))
                      = min(100.00, round_half_up(52.50 + 8.00, 2)) = 60.50
        current 1200 -> projected 1801: volume_growth_pct = round_half_up(601/1200*100, 2) = 50.08
                      -> growth_driver = 100.00
        regulatory_mandate_flag true, mandate_deadline 2027-06-30 <= 2028-01-01 -> 100.00
        oem_support_end_date 2029-01-01 > 2028-12-31 -> eos_driver = 0.00
        weighted_sum = round_half_up(0.35*60.50 + 0.20*100.00 + 0.25*100.00 + 0.20*0.00, 2)
                     = round_half_up(21.175 + 20.00 + 25.00, 2) = round_half_up(66.175, 2) = 66.18
        composite_score = 66.18, expedited = false
      Request R2 (asset B1: adjusted 20.00, corrective 4), same cycle:
        safety_driver = round_half_up(80.00*0.75 + 16.00, 2) = 76.00
        current 20000 -> projected 21999: raw ratio 1999/20000*100 = 9.995
                      -> volume_growth_pct = 10.00 -> growth_driver = 50.00 (tier crossed by rounding)
        regulatory 100.00; oem_support_end_date 2026-12-01 <= 2027-01-01 -> eos_driver = 100.00
        weighted_sum = round_half_up(26.60 + 10.00 + 25.00 + 20.00, 2) = 81.60
        composite_score = 81.60
      Expedite boundary pair (growth 100.00, regulatory 100.00, eos 100.00, penalty 0):
        safety 57.13 -> 0.35*57.13 = 19.9955 -> weighted_sum = round_half_up(84.9955, 2) = 85.00 -> expedited
        safety 57.12 -> 0.35*57.12 = 19.9920 -> weighted_sum = round_half_up(84.9920, 2) = 84.99 -> not expedited
    wrong_readings:
      - "Using nominal_ruls_score in the safety driver — a heavily-serviced asset would look healthy."
      - "Looking up the growth tier from the unrounded ratio, so 9.995 stays in the 25.00 tier instead of crossing to 50.00."
      - "Treating the growth tier breaks as inclusive-above rather than inclusive-below (exactly 10.00 belongs to the 50.00 tier, exactly 25.00 to the 75.00 tier, exactly 50.00 to the 100.00 tier)."
      - "Measuring eos_driver against the logical clock instead of cycle.plan_year_start (they differ by months in every fixture)."
      - "Subtracting the department penalty before weighting, or weighting the penalty."
      - "Rounding each weighted product to 2 decimals before summing, which drifts the total."
      - "Comparing composite_score > 85.00 instead of >= 85.00 for expedited."

  - name: negotiated_capital_price
    trigger: "POST /capital/requests/{id}/quotes, POST /capital/vendor-quotes/{id}/counter, POST /capital/vendor-quotes/{id}/revise"
    algorithm_type: [tiered_pricing, threshold]
    input_set: "One VendorQuote and its GpoContract tier table"
    constants:
      TIER_NAMES: "SMALL | MID | LARGE"
      MULTI_UNIT_MIN_COUNT: 2
    formula: |
      The six steps run in exactly this order; every later step consumes the previous step's output.
      Step 1  gpo_tier  = LARGE when list_price_cents >= contract.tier_large_floor_cents
                        = MID   when list_price_cents >= contract.tier_mid_floor_cents
                        = SMALL otherwise
              The tier is selected from the LIST price only. Both floors are inclusive.
      Step 2  tier_pct = large_tier_pct | mid_tier_pct | small_tier_pct per the selected tier
              gpo_discount_cents = round_half_up(list_price_cents * tier_pct)
      Step 3  multi_unit_addendum_cents =
                round_half_up((list_price_cents - gpo_discount_cents) * contract.multi_unit_addendum_pct)
                  when multi_unit_count >= 2
                0 otherwise
              The addendum applies to the POST-DISCOUNT amount, not to the list price.
      Step 4  subtotal_cents = list_price_cents - gpo_discount_cents - multi_unit_addendum_cents
      Step 5  trade_in_credit_cents =
                min(trade_in_offer_cents, round_half_up(subtotal_cents * contract.trade_in_cap_pct))
                  when trade_in_asset_id is not null
                0 otherwise
              The cap is a fraction of the SUBTOTAL, not of the list price.
      Step 6  net_capital_cents = subtotal_cents - trade_in_credit_cents
      The quote is priced for ONE unit even when multi_unit_count > 1; multi_unit_count only unlocks
      the addendum discount.
    precision: "Every money step is integer cents, round_half_up on each step; no intermediate is carried as a fraction"
    worked_example: |
      Contract GPO-1: small 0.05, mid 0.12, large 0.18, tier_mid_floor 100000000,
      tier_large_floor 240000000, multi_unit_addendum_pct 0.03, trade_in_cap_pct 0.10.
      Quote Q1: list_price_cents 250000001, multi_unit_count 2, trade_in_offer_cents 30000000,
      trade_in_asset_id set.
        Step 1  250000001 >= 240000000 -> LARGE, tier_pct 0.18
        Step 2  gpo_discount_cents = round_half_up(45000000.18) = 45000000
        Step 3  250000001 - 45000000 = 205000001;
                multi_unit_addendum_cents = round_half_up(6150000.03) = 6150000
        Step 4  subtotal_cents = 205000001 - 6150000 = 198850001
        Step 5  cap = round_half_up(19885000.10) = 19885000; min(30000000, 19885000) = 19885000
        Step 6  net_capital_cents = 198850001 - 19885000 = 178965001
      Tier boundary: list_price_cents 240000000 -> LARGE; 239999999 -> MID.
    wrong_readings:
      - "Applying multi_unit_addendum_pct to list_price_cents (7500000 instead of 6150000), which yields subtotal 197500001 and net 177750001."
      - "Capping the trade-in credit at trade_in_cap_pct of list_price_cents (25000000) instead of of the subtotal, so the full 30000000 offer would still be capped but to the wrong number."
      - "Multiplying by multi_unit_count so the quote prices N units."
      - "Selecting the tier from the post-discount subtotal or from net_capital_cents, which would put this quote in MID."
      - "Treating tier floors as exclusive, so a list price exactly equal to tier_large_floor_cents falls into MID."

  - name: five_year_tco
    trigger: "POST /capital/requests/{id}/submit (variant budgetary); POST /capital/vendor-quotes/{id}/accept and POST /capital/vendor-quotes/{id}/withdraw (variant negotiated)"
    algorithm_type: [projection, aggregation, forward_looking]
    variants: [budgetary, negotiated]
    input_set: "One ReplacementRequest; for the negotiated variant also its ACCEPTED VendorQuote"
    constants:
      HORIZON_YEARS: 5
      BUDGETARY_ESCALATION_PCT: "0.05"
      YEAR1_UTILIZATION_RAMP: "0.85"
      WARRANTY_WAIVES_YEAR1_MONTHS: 12
      WARRANTY_WAIVES_YEAR2_MONTHS: 24
    formula: |
      Both variants project five plan years y = 1..5 and round EACH YEAR to whole cents before summing.
      Year service cost:
        escalation_pct = 0.05                              (variant budgetary)
                       = quote.service_escalation_pct       (variant negotiated)
        service_waived(y) = true when (variant == negotiated AND quote.warranty_months >= 12 AND y == 1)
                                  OR (variant == negotiated AND quote.warranty_months >= 24 AND y <= 2)
                          = false always in the budgetary variant
        service_year_cents(y) = 0 when service_waived(y)
                              = round_half_up(annual_service_contract_cents * (1 + escalation_pct)^(y-1))
        The power is evaluated exactly (as a decimal), multiplied, and only then rounded.
      Year disposables cost:
        disposables_year_cents(1) = round_half_up(projected_annual_volume * disposable_unit_cents * 0.85)
        disposables_year_cents(y) = projected_annual_volume * disposable_unit_cents   for y in 2..5
        Year 1 carries the 0.85 utilization ramp; later years run at full volume. Disposables do not
        escalate.
      Aggregates:
        operating_5y_cents = SUM over y = 1..5 of (service_year_cents(y) + disposables_year_cents(y))
        capital_term_cents = estimated_capital_cents + facility_modification_cents   (budgetary)
                           = quote.net_capital_cents  + facility_modification_cents  (negotiated)
        tco_cents = capital_term_cents + operating_5y_cents
      Persistence:
        variant budgetary  -> budgetary_operating_5y_cents, budgetary_tco_cents
        variant negotiated -> negotiated_operating_5y_cents, negotiated_tco_cents
        baseline_year1_opex_cents = service_year_cents(1) + disposables_year_cents(1) of the
          AUTHORITATIVE variant: negotiated when negotiated_tco_cents is not null, else budgetary.
          This is the figure the utilization audit measures actual opex against.
      facility_modification_cents sits in the CAPITAL term of both variants, never in the operating total.
    precision: "Integer cents; round_half_up applied per plan year, never once over the five-year sum"
    worked_example: |
      Request R2: estimated_capital_cents 150000000, facility_modification_cents 40000000,
      annual_service_contract_cents 9000001, disposable_unit_cents 100, projected_annual_volume 21999.
      Variant budgetary (escalation 0.05, no waiver):
        y1 service round_half_up(9000001            ) =  9000001 ; disposables round_half_up(2199900*0.85) = 1869915
        y2 service round_half_up(9450001.05         ) =  9450001 ; disposables 2199900
        y3 service round_half_up(9922501.1025       ) =  9922501 ; disposables 2199900
        y4 service round_half_up(10418626.157625    ) = 10418626 ; disposables 2199900
        y5 service round_half_up(10939557.46550625  ) = 10939557 ; disposables 2199900
        budgetary_operating_5y_cents = 49730686 + 10669515 = 60400201
        budgetary_tco_cents = 150000000 + 40000000 + 60400201 = 250400201
        baseline_year1_opex_cents = 9000001 + 1869915 = 10869916
      Rounding-discipline contrast: summing the five exact service amounts and rounding once gives
      49730687, one cent more than the per-year total 49730686, so budgetary_operating_5y_cents would
      come out 60400202 under the wrong reading.
      Variant negotiated for request R1 (net_capital_cents 178965001, facility_modification_cents
      60000000, annual_service_contract_cents 12345678, service_escalation_pct 0.04,
      warranty_months 12, projected_annual_volume 1801, disposable_unit_cents 1230):
        y1 service 0 (waived by the 12-month warranty); disposables round_half_up(2215230*0.85) = 1882946
        y2 12839505, y3 13353085, y4 13887209, y5 14442697; disposables 2215230 in each of y2..y5
        negotiated_operating_5y_cents = 54522496 + 10743866 = 65266362
        negotiated_tco_cents = 178965001 + 60000000 + 65266362 = 304231363
        baseline_year1_opex_cents = 0 + 1882946 = 1882946
    wrong_readings:
      - "Summing the five exact service amounts and rounding once at the end (off by one cent on request R2)."
      - "Escalating disposables alongside the service contract; disposables are flat after the year-1 ramp."
      - "Applying the 0.85 utilization ramp to every year, or to the service contract as well."
      - "Waiving year 2 at warranty_months == 12 (only >= 24 waives year 2)."
      - "Putting facility_modification_cents into the operating total, which double-counts it against the capital term."
      - "Using the budgetary escalation constant 0.05 in the negotiated variant instead of the quote's service_escalation_pct."
      - "Leaving baseline_year1_opex_cents at the budgetary value after a quote is accepted."

  - name: facility_allocation_waterfall
    trigger: "POST /capital/cycles/{id}/allocate"
    algorithm_type: [waterfall_allocation, aggregation, chronological]
    variants: [PRO_RATA, RANK_ORDERED]
    input_set: "Every ReplacementRequest of the cycle whose status == SCORED, grouped by its department's facility. Requests in any other status — DRAFT, SUBMITTED, SCREENED, RETURNED, IN_COMMITTEE, DEFERRED, WITHDRAWN, REJECTED — are excluded, and a facility with no SCORED request gets no FacilityAllocation row at all."
    constants:
      REMAINDER_STEP_CENTS: 1
    formula: |
      Step 1  Per eligible request: project_cost_cents = estimated_capital_cents + facility_modification_cents.
      Step 2  Per facility f with at least one eligible request:
                demand_cents(f)   = SUM project_cost_cents
                weighted_score(f) = round_half_up(
                    SUM(composite_score * project_cost_cents) / SUM(project_cost_cents), 2)
                A capital-weighted mean, not a plain average of composite scores.
      Step 3  system_contingency_cents = round_half_up(cycle.total_capital_cents * cycle.contingency_pct)
              distributable_cents      = cycle.total_capital_cents - system_contingency_cents
      Step 4  rank_order = facilities sorted by
                (weighted_score DESC, demand_cents DESC, Facility.created_at ASC)
              This single ordering drives the RANK_ORDERED grant sequence AND the PRO_RATA remainder
              sweep. Facility.id is never consulted.
      Step 5  VARIANT `PRO_RATA`:
                total_demand_cents = SUM demand_cents over the facilities.
                provisional(f) = min(demand_cents(f),
                    floor(distributable_cents * demand_cents(f) / total_demand_cents))
                FLOOR, not round — the shortfall is redistributed rather than over-committed.
                leftover = distributable_cents - SUM provisional(f).
                Remainder sweep: walk rank_order repeatedly, granting 1 additional cent to each
                facility whose running grant is still below demand_cents(f), until leftover reaches 0
                or every facility is at its demand.
                allocated_cents(f) = provisional(f) + cents granted by the sweep.
              VARIANT `RANK_ORDERED`:
                remaining = distributable_cents.
                Walk rank_order once: allocated_cents(f) = min(demand_cents(f), remaining);
                remaining -= allocated_cents(f).
                The top-ranked facility is filled to its full demand before the next facility receives
                anything, so a lower-ranked facility can receive nothing at all.
      Step 6  Both variants: contingency_reserve_cents(f) =
                round_half_up(allocated_cents(f) * cycle.facility_contingency_pct)
              contingency_status starts HELD, released_contingency_cents starts 0,
              committed_cents starts 0, available_cents = allocated_cents(f) + 0 - 0,
              posture = ACTIVE when available_cents > 0 else EXHAUSTED.
      Step 7  Cycle aggregates:
                unallocated_cents       = distributable_cents - SUM allocated_cents
                contingency_drawn_cents = SUM contingency_reserve_cents
                allocation_count        = number of rows created
                exhausted_allocation_count = 0
              contingency_drawn_cents must not exceed system_contingency_cents; when it would, the
              whole allocation is rejected (see the ERR_CONTINGENCY_RESERVE_EXCEEDED validation) and
              no FacilityAllocation row is created.
      Invariant maintained for the life of every allocation row:
        allocated_cents + released_contingency_cents == committed_cents + available_cents
    precision: "Integer cents throughout; floor on the pro-rata share, round_half_up on the contingency reserve, 2-decimal round_half_up on weighted_score"
    worked_example: |
      Cycle C1: total_capital_cents 500000000, contingency_pct 0.10, facility_contingency_pct 0.05.
        system_contingency_cents = 50000000, distributable_cents = 450000000
      Two eligible requests:
        R1 at facility A: estimated 250000001 + modification 60000000 = 310000001, composite 66.18
        R2 at facility B: estimated 150000000 + modification 40000000 = 190000000, composite 81.60
        demand A 310000001 (weighted_score 66.18), demand B 190000000 (weighted_score 81.60)
        rank_order = [B (81.60), A (66.18)]     total_demand_cents = 500000001
      VARIANT PRO_RATA:
        provisional B = floor(450000000 * 190000000 / 500000001) = 170999999
        provisional A = floor(450000000 * 310000001 / 500000001) = 279000000
        leftover = 450000000 - 449999999 = 1 -> swept to B (rank 1)
        allocated: B 171000000, A 279000000; unallocated_cents 0
        contingency reserves: B round_half_up(8550000.00) = 8550000, A 13950000
        contingency_drawn_cents = 22500000 <= 50000000 OK
      VARIANT RANK_ORDERED on the identical data:
        B first: min(190000000, 450000000) = 190000000, remaining 260000000
        A next : min(310000001, 260000000) = 260000000, remaining 0
        allocated: B 190000000, A 260000000; unallocated_cents 0
        contingency reserves: B 9500000, A 13000000; contingency_drawn_cents 22500000
      The two variants differ by 19000000 cents at facility B and 19000000 at facility A on identical
      inputs, and only PRO_RATA exercises the 1-cent remainder sweep.
    wrong_readings:
      - "Pro-rating on composite_score or on weighted_score instead of on demand_cents."
      - "Using round_half_up rather than floor for the provisional share, which over-commits distributable_cents by up to one cent per facility and leaves a negative leftover."
      - "Sweeping the remainder by Facility.id, by insertion order, or all-to-the-largest-demand instead of by the declared rank_order."
      - "Allocating from total_capital_cents instead of distributable_cents (skipping the system contingency withholding)."
      - "Computing weighted_score as the unweighted mean of the facility's composite scores."
      - "Including SCREENED or IN_COMMITTEE requests in demand_cents, or excluding facility_modification_cents from project_cost_cents so demand and the later funded amount disagree."
      - "Taking contingency_reserve_cents out of the facility's allocated_cents (which would reduce available_cents) instead of drawing it from the system contingency on top."

  - name: request_funded_amount
    trigger: "POST /capital/requests/{id}/fund; recomputed by POST /capital/vendor-quotes/{id}/accept and POST /capital/vendor-quotes/{id}/withdraw while the request is FUNDED"
    algorithm_type: [threshold, aggregation]
    input_set: "One ReplacementRequest and, when one exists, its single VendorQuote with status == ACCEPTED"
    constants: {}
    formula: |
      accepted = the request's VendorQuote with status == ACCEPTED (at most one may exist at a time).
      funded_amount_cents = (accepted is null ? estimated_capital_cents : accepted.net_capital_cents)
                            + facility_modification_cents
      The facility modification cost is always added, quoted or not, so the funded amount is directly
      comparable with the request's contribution to FacilityAllocation.demand_cents.
      When the amount changes while the request is already FUNDED, the delta is applied to the
      allocation: committed_cents += (new - old), available_cents recomputed, posture refreshed.
      A change that would drive available_cents below 0 is rejected before anything is written.
    precision: "Integer cents"
    worked_example: |
      Request R1 unquoted: 250000001 + 60000000 = 310000001.
      Request R1 with quote Q1 accepted (net_capital_cents 178965001): 178965001 + 60000000 = 238965001.
      Funding R1 after accepting Q1 therefore draws 238965001 from the facility A allocation, and
      withdrawing Q1 afterwards raises the draw back to 310000001 — which is rejected when the
      allocation cannot cover the increase.
    wrong_readings:
      - "Using net_capital_cents alone and dropping facility_modification_cents, so the allocation under-commits."
      - "Falling back to budgetary_tco_cents (which includes five years of operating cost) instead of the capital figure."
      - "Continuing to use estimated_capital_cents after a quote is accepted."
      - "Counting a SUPERSEDED or WITHDRAWN quote as the accepted one."

  - name: committee_tally
    trigger: "POST /capital/requests/{id}/committee-decision"
    algorithm_type: [aggregation, threshold]
    input_set: "The request's CommitteeVote rows with superseded == false whose member is in the eligible voter set; the eligible voter set is derived from every CommitteeMember row"
    constants:
      QUORUM_NUMERATOR: 3
      QUORUM_DENOMINATOR: 5
      APPROVAL_NUMERATOR: 2
      APPROVAL_DENOMINATOR: 3
      DEFER_NUMERATOR: 1
      DEFER_DENOMINATOR: 2
    formula: |
      Step 1  Eligible voter set E = every CommitteeMember m with
                m.active == true
                AND (m.facility_id is null OR m.facility_id == the request's facility)
                AND m.id != request.sponsor_member_id
                AND (m.department_id is null OR m.department_id != request.department_id)
              quorum_weight = SUM m.voting_weight over E. E must be non-empty.
      Step 2  Counted ballots = CommitteeVote rows of this request with superseded == false whose
              member_id is in E. A ballot from a member who has since become ineligible (deactivated,
              or newly conflicted) is dropped from both sums.
                cast_weight    = SUM counted_weight over counted ballots (APPROVE, REJECT, ABSTAIN and
                                 VETO all count toward cast weight)
                approve_weight = SUM counted_weight where vote == APPROVE
              counted_weight is the weight PINNED on the ballot, not the member's current voting_weight.
      Step 3  veto_present = at least one counted ballot with vote == VETO cast by a member whose
              seat == SAFETY_OFFICER.
      Step 4  Decision, evaluated in exactly this order:
                4a  veto_present                             -> REJECTED   (quorum is not consulted)
                4b  E empty                                  -> ERR_NO_ELIGIBLE_VOTERS
                4c  cast_weight * 5 < quorum_weight * 3      -> ERR_QUORUM_NOT_MET
                4d  approve_weight * 3 >= cast_weight * 2    -> APPROVED
                4e  approve_weight * 2 >= cast_weight        -> DEFERRED
                4f  otherwise                                -> REJECTED
              Every threshold is an integer cross-multiplication. No percentage is ever materialised,
              so no rounding mode can shift a boundary.
    precision: "Pure integer arithmetic; the 60% quorum and two-thirds approval bars are expressed as cross-multiplications"
    worked_example: |
      Members: M1 CHAIR weight 3 (system-wide), M2 FINANCE weight 2 (system-wide),
      M3 CLINICAL weight 5 (system-wide), M4 SAFETY_OFFICER weight 3 (system-wide),
      M5 FACILITIES weight 1 (facility_id = facility A), M6 CLINICAL weight 2 (department_id = DEPT-A1).
      Request R1 sits at facility A / department DEPT-A1 with sponsor_member_id = M3:
        E = {M1(3), M2(2), M4(3), M5(1)} -> quorum_weight = 9
        M3 drops out as sponsor, M6 drops out on the department conflict.
      Quorum boundary:
        ballots M1 + M2 -> cast_weight 5; 5*5 = 25 < 9*3 = 27 -> ERR_QUORUM_NOT_MET
        ballots M1 + M2 + M5 -> cast_weight 6; 6*5 = 30 >= 27 -> quorum met
      Approval boundary at cast_weight 6:
        M1 APPROVE(3), M5 APPROVE(1), M2 REJECT(2): approve_weight 4; 4*3 = 12 >= 6*2 = 12 -> APPROVED
        M1 APPROVE(3), M2 REJECT(2), M5 REJECT(1): approve_weight 3; 3*3 = 9 < 12 and 3*2 = 6 >= 6 -> DEFERRED
        M2 APPROVE(2), M1 REJECT(3), M5 REJECT(1): approve_weight 2; 2*2 = 4 < 6 -> REJECTED
      Veto precedence: a single VETO ballot from M4 (cast_weight 3, far short of quorum) still yields
      REJECTED, not ERR_QUORUM_NOT_MET.
    wrong_readings:
      - "Computing quorum_weight over all CommitteeMember rows instead of over the eligible set E."
      - "Counting ballots by head instead of by weight, or summing the member's current voting_weight instead of the ballot's counted_weight."
      - "Excluding ABSTAIN ballots from cast_weight — an abstention counts toward quorum and therefore raises the approval bar."
      - "Including superseded ballots, so a member who re-votes is counted twice."
      - "Evaluating quorum before the safety-officer veto, which turns a vetoed request into ERR_QUORUM_NOT_MET."
      - "Using floating-point 0.6 / 0.667 comparisons, which flips the exact-boundary cases 25/27 and 12/12."
      - "Measuring the approval bar against quorum_weight instead of cast_weight."

  - name: business_case_variance
    trigger: "POST /capital/audits/{id}/collect"
    algorithm_type: [threshold, projection]
    input_set: "One UtilizationAudit with status SCHEDULED, using the snapshots pinned at audit creation and the actuals supplied by the collect call"
    constants:
      VOLUME_ATTAINMENT_FLOOR_PCT: "80.00"
      OPEX_VARIANCE_CEILING_PCT: "10.00"
      PENALTY_POINTS_PER_UNDERPERFORMANCE: 10
      PENALTY_POINTS_CAP: 20
    formula: |
      Step 1  volume_attainment_pct = round_half_up(
                actual_annual_volume / projected_annual_volume_snapshot * 100, 2)
      Step 2  opex_variance_pct = round_half_up(
                (actual_annual_opex_cents - baseline_year1_opex_snapshot)
                / baseline_year1_opex_snapshot * 100, 2)
              A negative variance means the equipment came in under its business-case operating cost.
      Step 3  verdict = PASSED when volume_attainment_pct >= 80.00 AND opex_variance_pct <= 10.00
                      = UNDERPERFORMING otherwise
              Both metrics are compared AFTER the 2-decimal rounding, so an exact 80.00 attainment and
              an exact 10.00 overrun both pass.
      Step 4  On UNDERPERFORMING: department.utilization_penalty_points =
                min(20, current + 10) and department.underperformance_flag = true; the department's
              SCORED requests in cycles still in SCORING or ALLOCATED are re-scored with the new
              penalty (reason DEPARTMENT_PENALTY_CHANGE).
              On PASSED nothing outside the audit row changes.
      The snapshots are the ones pinned at audit creation; a later change to the request's
      projected_annual_volume or baseline_year1_opex_cents does not move an already-scheduled audit's
      denominators.
    precision: "Both percentages are 2 decimals, round_half_up; the penalty points are integers"
    worked_example: |
      Audit on request R3: projected_annual_volume_snapshot 2000,
      baseline_year1_opex_snapshot 10850000 (service 10000000 + disposables round_half_up(1000000*0.85) = 850000).
        actual_annual_volume 1600 -> round_half_up(1600/2000*100, 2) = 80.00 -> attainment bar met exactly
        actual_annual_volume 1599 -> 79.95 -> attainment bar missed
        actual_annual_opex_cents 11935000 -> round_half_up(1085000/10850000*100, 2) = 10.00 -> bar met exactly
        actual_annual_opex_cents 11935542 -> raw 10.004999... -> 10.00 -> still PASSED
        actual_annual_opex_cents 11935543 -> raw 10.005004... -> 10.01 -> UNDERPERFORMING
      So (1600, 11935542) is the PASSED corner and (1600, 11935543) the UNDERPERFORMING corner one cent
      apart, while (1599, 11935000) fails on the volume metric alone.
    wrong_readings:
      - "Dividing by the request's live projected_annual_volume instead of the pinned snapshot."
      - "Measuring actual opex against budgetary_tco_cents or against the five-year operating total instead of baseline_year1_opex_cents."
      - "Comparing the unrounded percentages, which flips the 11935542 / 11935543 pair."
      - "Using strict inequalities (> 80.00, < 10.00), which fails both exact-boundary corners."
      - "Adding the penalty points without the cap of 20, or re-adding them on a PASSED verdict."
      - "Re-scoring requests in cycles that are already COMMITTED, or requests that are no longer SCORED."

validations:
  # Rows are listed in strict evaluation order. When a single call violates several rows, the row with
  # the LOWEST priority number produces the response; nothing later in the table is evaluated and no
  # side effect is written. Priority bands: 10 auth, 20 existence, 30 ownership, 40 shape,
  # 50 state, 58 concurrency, 60 business, 70 segregation-of-duties, 76 capacity, 82 temporal.
  - id: V01
    priority: 10
    category: auth
    applies_to: every endpoint
    condition: "The X-User-ID header is absent or blank."
    error_id: ERR_USER_CONTEXT_REQUIRED
    http_status: 401

  - id: V02
    priority: 12
    category: auth
    applies_to: every endpoint
    condition: "The acting role (resolved from X-User-ID per §1.7) is not listed in the endpoint's `roles`."
    error_id: ERR_UNAUTHORIZED
    http_status: 403

  - id: V03
    priority: 20
    category: existence
    applies_to: every endpoint with a path id
    condition: "No row exists for a templated path id."
    error_id: "ERR_FACILITY_NOT_FOUND | ERR_DEPARTMENT_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_GPO_CONTRACT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_AUDIT_NOT_FOUND"
    http_status: 404

  - id: V04
    priority: 22
    category: existence
    applies_to: every endpoint carrying an FK in its body
    condition: "A body FK (facility_id, department_id, cycle_id, asset_id, sponsor_member_id, gpo_contract_id, trade_in_asset_id, predecessor_project_id, installation_project_id) references no row."
    error_id: "the referenced entity's NOT_FOUND id, as in V03"
    http_status: 404

  - id: V05
    priority: 30
    category: ownership
    applies_to: "POST /capital/requests, PATCH /capital/requests/{id}, POST /capital/requests/{id}/submit, POST /capital/requests/{id}/withdraw"
    condition: "The acting ClinicalRequester's X-User-ID is not the request's department_id."
    error_id: ERR_DEPARTMENT_SCOPE_VIOLATION
    http_status: 403

  - id: V06
    priority: 32
    category: ownership
    applies_to: "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}, POST /capital/installation-projects/{id}/advance-construction, POST /capital/installation-projects/{id}/advance-equipment, POST /capital/installation-projects/{id}/go-live"
    condition: "The acting FacilityDirector's X-User-ID is not the project's facility_id (for creation, not the request's facility)."
    error_id: ERR_FACILITY_SCOPE_VIOLATION
    http_status: 403

  - id: V07
    priority: 40
    category: shape
    applies_to: every write endpoint
    condition: "A required input field is absent, a field has the wrong JSON type, an enum value is outside its declared set, a string breaks its length bounds, or a number breaks its declared range."
    error_id: ERR_VALIDATION
    http_status: 422

  - id: V08
    priority: 42
    category: shape
    applies_to: every list endpoint
    condition: "limit < 1, limit > 100, offset < 0, or either is not an integer."
    error_id: ERR_VALIDATION
    http_status: 422

  - id: V09
    priority: 44
    category: shape
    applies_to: "POST /capital/facilities, POST /capital/cycles, POST /capital/gpo-contracts"
    condition: "Facility.code, CapitalCycle.plan_year or GpoContract.contract_code duplicates an existing row."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409

  - id: V10
    priority: 45
    category: referential
    applies_to: "POST /capital/assets, PATCH /capital/assets/{id}"
    condition: "facility_id does not equal the referenced department's facility_id."
    error_id: ERR_ASSET_FACILITY_MISMATCH
    http_status: 422

  - id: V11
    priority: 46
    category: referential
    applies_to: "POST /capital/requests, PATCH /capital/requests/{id}"
    condition: "The referenced asset's department_id does not equal the request's department_id."
    error_id: ERR_ASSET_DEPARTMENT_MISMATCH
    http_status: 422

  - id: V12
    priority: 47
    category: shape
    applies_to: "POST /capital/requests, PATCH /capital/requests/{id}, POST /capital/requests/{id}/submit"
    condition: "facility_modification_cents * 10 > estimated_capital_cents * 3 (integer cross-multiplication of the 30% cap)."
    error_id: ERR_MODIFICATION_COST_EXCEEDS_CAP
    http_status: 422

  - id: V13
    priority: 48
    category: shape
    applies_to: "POST /capital/requests, PATCH /capital/requests/{id}, POST /capital/requests/{id}/submit"
    condition: "regulatory_mandate_flag is true while mandate_deadline is null."
    error_id: ERR_MANDATE_DEADLINE_REQUIRED
    http_status: 422

  - id: V14
    priority: 50
    category: state
    applies_to: "every cycle stage transition; POST /capital/requests/{id}/submit; POST /capital/requests/{id}/screen; POST /capital/requests/{id}/votes; POST /capital/requests/{id}/fund"
    condition: "cycle.status is not the status the operation requires (DRAFT to open intake, INTAKE_OPEN to submit or close intake, SCORING to score or first-allocate, ALLOCATED to vote / decide / fund / re-allocate / commit)."
    error_id: ERR_CYCLE_INVALID_STATE
    http_status: 409

  - id: V19
    priority: 51
    category: state
    applies_to: "POST /capital/audits/{id}/collect"
    condition: >-
      audit.status != SCHEDULED. Deliberately ordered BEFORE V15 (priority 52), matching the audit
      transition's own precondition order: a second collect on an already-collected audit is an
      audit-row fault (ERR_AUDIT_INVALID_STATE), while a first collect on a SCHEDULED audit whose
      request has already been moved to AUDITED by a sibling audit is a request-state fault (V15).
    error_id: ERR_AUDIT_INVALID_STATE
    http_status: 409

  - id: V15
    priority: 52
    category: state
    applies_to: "every ReplacementRequest transition endpoint, POST /capital/requests/{id}/quotes, POST /capital/requests/{id}/installation-projects, POST /capital/requests/{id}/audits"
    condition: >-
      request.status is not in the set the operation requires. The sets are pinned as: submit {DRAFT, RETURNED};
      PATCH {DRAFT, RETURNED}; screen {SUBMITTED}; withdraw {DRAFT, RETURNED, SUBMITTED, SCREENED, SCORED};
      votes {SCORED, IN_COMMITTEE}; committee-decision {IN_COMMITTEE}; fund {APPROVED}; withdraw-funding {FUNDED};
      POST .../quotes {SCORED, IN_COMMITTEE, APPROVED, FUNDED}; POST .../installation-projects {FUNDED};
      POST .../audits {IMPLEMENTED}.
    error_id: ERR_REQUEST_INVALID_STATE
    http_status: 409

  - id: V16
    priority: 53
    category: state
    applies_to: "POST /capital/assets/{id}/service-events, POST /capital/assets/{id}/decommission, PATCH /capital/assets/{id}"
    condition: "asset.status is DECOMMISSIONED (service events and edits are closed), or decommission is called while status != REPLACEMENT_PENDING."
    error_id: ERR_ASSET_INVALID_STATE
    http_status: 409

  - id: V17
    priority: 54
    category: state
    applies_to: "POST /capital/vendor-quotes/{id}/counter, .../revise, .../accept, .../withdraw"
    condition: "quote.status is not in the set the operation requires (SUBMITTED to counter or accept, COUNTERED to revise, SUBMITTED|COUNTERED|ACCEPTED to withdraw)."
    error_id: ERR_QUOTE_INVALID_STATE
    http_status: 409

  - id: V18
    priority: 55
    category: state
    applies_to: "PATCH /capital/installation-projects/{id}, .../advance-construction, .../advance-equipment, .../go-live, .../cancel"
    condition: >-
      project.record_status == CANCELLED, go_live_at is already set, the construction axis is NOT_REQUIRED or already
      COMPLETE when advancing construction, the equipment axis is already COMMISSIONED when advancing equipment, or —
      on go-live — construction_status is not in {NOT_REQUIRED, COMPLETE} or equipment_status != COMMISSIONED (the
      fork-join guard: an unconverged axis is a project-state fault, not a request-state fault).
    error_id: ERR_PROJECT_INVALID_STATE
    http_status: 409

  - id: V20
    priority: 57
    category: state
    applies_to: "POST /capital/allocations/{id}/release-contingency"
    condition: "allocation.contingency_status == RELEASED, or allocation.posture == SUPERSEDED."
    error_id: ERR_CONTINGENCY_ALREADY_RELEASED
    http_status: 409

  - id: V21
    priority: 58
    category: concurrency
    applies_to: "POST /capital/requests/{id}/votes"
    condition: "expected_request_version != request.version (§1.2.1 rule vote-create-stale-request)."
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

  - id: V22
    priority: 58
    category: concurrency
    applies_to: "POST /capital/cycles/{id}/allocate"
    condition: "expected_cycle_version != cycle.version (§1.2.1 rule allocate-supersede-stale-cycle)."
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - id: V23
    priority: 60
    category: business
    applies_to: "POST /capital/requests/{id}/submit"
    condition: "The asset fails the eligibility gate of asset_ruls_score step 10: adjusted_ruls_score > 30.00 AND status != DERATED AND unresolved_recall == false."
    error_id: ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE
    http_status: 422

  - id: V24
    priority: 61
    category: business
    applies_to: "POST /capital/requests/{id}/submit"
    condition: "Another request with the same asset_id and cycle_id has status not in {WITHDRAWN, REJECTED, DEFERRED}."
    error_id: ERR_DUPLICATE_ASSET_REQUEST
    http_status: 409

  - id: V25
    priority: 62
    category: business
    applies_to: "POST /capital/requests/{id}/submit"
    condition: "request.revision_count > MAX_REVISIONS (3)."
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409

  - id: V26
    priority: 63
    category: business
    applies_to: "POST /capital/vendor-quotes/{id}/revise"
    condition: "quote.negotiation_round > MAX_NEGOTIATION_ROUNDS (3)."
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 409

  - id: V27
    priority: 64
    category: business
    applies_to: "POST /capital/requests/{id}/quotes"
    condition: "The GpoContract's expires_on <= logical clock now."
    error_id: ERR_GPO_CONTRACT_EXPIRED
    http_status: 409

  - id: V28
    priority: 65
    category: business
    applies_to: "POST /capital/vendor-quotes/{id}/accept"
    condition: "quote.valid_until < logical clock now. Validity is evaluated lazily at accept time, never at creation, counter or revise."
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409

  - id: V29
    priority: 66
    category: referential
    applies_to: "POST /capital/requests/{id}/quotes"
    condition: "trade_in_asset_id is set and does not equal the request's asset_id."
    error_id: ERR_TRADE_IN_ASSET_MISMATCH
    http_status: 422

  - id: V30
    priority: 67
    category: business
    applies_to: "POST /capital/vendor-quotes/{id}/accept"
    condition: "The trade-in asset is DECOMMISSIONED, or its disposition_status is not in {NONE, HELD_FOR_TRADE_IN}, or it is HELD_FOR_TRADE_IN for a different request's accepted quote."
    error_id: ERR_TRADE_IN_ASSET_UNAVAILABLE
    http_status: 409

  - id: V31
    priority: 68
    category: business
    applies_to: "POST /capital/vendor-quotes/{id}/accept"
    condition: "request.safety_driver >= 90.00 while safety_review_ack is absent or false. A high-safety-driver replacement cannot be contracted without an explicit safety acknowledgement."
    error_id: ERR_SAFETY_REVIEW_REQUIRED
    http_status: 422

  - id: V32
    priority: 69
    category: business
    applies_to: "POST /capital/assets/{id}/service-events"
    condition: "event_date > logical clock now."
    error_id: ERR_EVENT_DATE_IN_FUTURE
    http_status: 422

  - id: V33
    priority: 70
    category: segregation_of_duties
    applies_to: "POST /capital/requests/{id}/fund"
    condition: "X-User-ID equals cycle.allocated_by_user_id — the planner who ran the allocation may not draw capital from it."
    error_id: ERR_SOD_ALLOCATOR_CANNOT_FUND
    http_status: 403

  - id: V34
    priority: 71
    category: segregation_of_duties
    applies_to: "POST /capital/requests/{id}/votes"
    condition: "The acting member fails the eligibility predicate of committee_tally step 1: inactive, facility-scoped to a different facility, the request's sponsor_member_id, or seated in the request's department."
    error_id: ERR_VOTE_CONFLICT_OF_INTEREST
    http_status: 403

  - id: V35
    priority: 72
    category: business
    applies_to: "POST /capital/requests/{id}/votes"
    condition: "vote == VETO while the acting member's seat != SAFETY_OFFICER."
    error_id: ERR_VETO_NOT_PERMITTED
    http_status: 422

  - id: V36
    priority: 73
    category: segregation_of_duties
    applies_to: "POST /capital/requests/{id}/committee-decision"
    condition: "The acting member's seat != CHAIR. Closing voting is procedural, so the chair need not itself be an eligible voter on this request."
    error_id: ERR_CHAIR_REQUIRED
    http_status: 403

  - id: V37
    priority: 74
    category: business
    applies_to: "POST /capital/requests/{id}/committee-decision"
    condition: "The eligible voter set E is empty (committee_tally step 4b). Evaluated after the veto branch."
    error_id: ERR_NO_ELIGIBLE_VOTERS
    http_status: 409

  - id: V38
    priority: 75
    category: business
    applies_to: "POST /capital/requests/{id}/committee-decision"
    condition: "cast_weight * 5 < quorum_weight * 3 (committee_tally step 4c). Evaluated after the veto branch, so a vetoed request is REJECTED rather than rejected-for-quorum."
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409

  - id: V39
    priority: 76
    category: capacity
    applies_to: "POST /capital/requests/{id}/fund, POST /capital/vendor-quotes/{id}/accept, POST /capital/vendor-quotes/{id}/withdraw"
    condition: "No FacilityAllocation with posture in {ACTIVE, EXHAUSTED} exists for (cycle_id, the request's facility)."
    error_id: ERR_NO_FACILITY_ALLOCATION
    http_status: 409

  - id: V40
    priority: 77
    category: capacity
    applies_to: "POST /capital/requests/{id}/fund, POST /capital/vendor-quotes/{id}/accept, POST /capital/vendor-quotes/{id}/withdraw"
    condition: "The draw computed by request_funded_amount (or the delta of a re-computation) exceeds allocation.available_cents."
    error_id: ERR_ALLOCATION_INSUFFICIENT
    http_status: 409

  - id: V41
    priority: 78
    category: capacity
    applies_to: "POST /capital/cycles/{id}/allocate"
    condition: "The contingency_drawn_cents that facility_allocation_waterfall step 7 would produce exceeds cycle.system_contingency_cents. No allocation row is written."
    error_id: ERR_CONTINGENCY_RESERVE_EXCEEDED
    http_status: 422

  - id: V42
    priority: 79
    category: capacity
    applies_to: "POST /capital/cycles/{id}/allocate"
    condition: "The cycle is already ALLOCATED and at least one FacilityAllocation with posture != SUPERSEDED has committed_cents > 0."
    error_id: ERR_ALLOCATION_ALREADY_COMMITTED
    http_status: 409

  - id: V43
    priority: 80
    category: business
    applies_to: "POST /capital/cycles/{id}/allocate"
    condition: "No request of the cycle has status == SCORED."
    error_id: ERR_NO_ELIGIBLE_REQUESTS
    http_status: 409

  - id: V44
    priority: 82
    category: temporal
    applies_to: "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}, POST /capital/requests/{id}/audits"
    condition: "downtime_end <= downtime_start, construction_end < construction_start, or audit_window_end <= audit_window_start."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422

  - id: V45
    priority: 83
    category: temporal
    applies_to: "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}"
    condition: "construction_required is true while construction_start or construction_end is null, or construction_required is false while either is supplied."
    error_id: ERR_CONSTRUCTION_WINDOW_REQUIRED
    http_status: 422

  - id: V46
    priority: 84
    category: temporal
    applies_to: "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}"
    condition: |
      Some other InstallationProject with record_status == ACTIVE in the SAME department_id (excluding
      the row being patched) satisfies the buffered half-open overlap test
        (new_downtime_start - 24h) < other.downtime_end AND other.downtime_start < (new_downtime_end + 24h)
      DOWNTIME_BUFFER_HOURS is 24 and is applied only to the incoming interval; the stored intervals are
      compared raw. Because the test is half-open, a new window whose buffered start lands exactly on
      another window's downtime_end does NOT conflict.
    error_id: ERR_DOWNTIME_WINDOW_CONFLICT
    http_status: 409

  - id: V47
    priority: 85
    category: capacity
    applies_to: "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}"
    condition: |
      Count the InstallationProjects with record_status == ACTIVE and construction_required == true in
      the SAME facility_id (excluding the row being patched) whose CLOSED construction interval
      intersects the incoming closed interval:
        other.construction_start <= new_construction_end AND new_construction_start <= other.construction_end
      When that count + 1 > facility.max_concurrent_construction the write is rejected. Unlike the
      downtime test this interval is closed and unbuffered, so two projects that merely touch on a
      single instant DO count against the same capacity slot.
    error_id: ERR_CONSTRUCTION_CAPACITY_EXCEEDED
    http_status: 409

  - id: V48
    priority: 86
    category: referential
    applies_to: "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}"
    condition: "Following predecessor_project_id transitively from the incoming value reaches the project being written, i.e. the edge would close a cycle in the InstallationProject DAG. A project may also not be its own predecessor."
    error_id: ERR_PROJECT_DEPENDENCY_CYCLE
    http_status: 422

  - id: V49
    priority: 87
    category: state
    applies_to: "POST /capital/installation-projects/{id}/go-live"
    condition: "predecessor_project_id is set and the predecessor is CANCELLED or its equipment_status != COMMISSIONED."
    error_id: ERR_PREDECESSOR_NOT_COMMISSIONED
    http_status: 409

  - id: V50
    priority: 88
    category: temporal
    applies_to: "POST /capital/requests/{id}/audits"
    condition: "The referenced InstallationProject belongs to a different request, has no go_live_at, or audit_window_start < go_live_at."
    error_id: ERR_AUDIT_WINDOW_INVALID
    http_status: 422

  - id: V51
    priority: 89
    category: state
    applies_to: "POST /capital/requests/{id}/withdraw-funding"
    condition: "An InstallationProject of the request has record_status == ACTIVE. Cancel the project first."
    error_id: ERR_PROJECT_ACTIVE
    http_status: 409

  - id: V52
    priority: 90
    category: state
    applies_to: "POST /capital/assets/{id}/decommission"
    condition: "The funding request's InstallationProject with record_status == ACTIVE has equipment_status != COMMISSIONED, or the asset has no such project."
    error_id: ERR_INSTALLATION_NOT_COMMISSIONED
    http_status: 409

  - id: V53
    priority: 91
    category: business
    applies_to: "POST /capital/assets/{id}/decommission"
    condition: "disposition == TRADED_IN while asset.disposition_status != HELD_FOR_TRADE_IN."
    error_id: ERR_TRADE_IN_NOT_HELD
    http_status: 422

endpoints:
  # ---- logical clock ------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [CapitalPlanner]
    input: [now]
    output: "{ now: datetime }"
    description: "Sets the server logical clock. Startup default is 2026-08-01T00:00:00Z. Every date comparison in §1.3 and §1.4 reads this clock."
    side_effects:
      - "The logical clock is set to `now`. No stored RULS, TCO or score field is recomputed; those are refreshed only by their own triggering calls."
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- Facility -----------------------------------------------------------
  - method: POST
    path: /capital/facilities
    roles: [CapitalPlanner]
    input: ["name", "code", "region", "max_concurrent_construction?"]
    output: Facility
    side_effects: ["Creates a Facility with active_asset_count 0 and version 1."]
    errors: [ERR_VALIDATION, ERR_DUPLICATE_KEY, ERR_UNAUTHORIZED, ERR_USER_CONTEXT_REQUIRED]
  - method: PATCH
    path: /capital/facilities/{id}
    roles: [CapitalPlanner]
    input: ["name?", "region?", "max_concurrent_construction?"]
    output: Facility
    side_effects:
      - "Updates the supplied fields; facility.version += 1."
      - "Lowering max_concurrent_construction does not retroactively invalidate ACTIVE projects; it only tightens later V47 checks."
    errors: [ERR_VALIDATION, ERR_FACILITY_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/facilities/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: Facility
    errors: [ERR_FACILITY_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/facilities
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["region?", "code?", "limit?", "offset?"]
    output: Facility[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- Department ---------------------------------------------------------
  - method: POST
    path: /capital/departments
    roles: [CapitalPlanner]
    input: [facility_id, name, modality_scope]
    output: Department
    side_effects: ["Creates a Department with utilization_penalty_points 0, underperformance_flag false, version 1."]
    errors: [ERR_VALIDATION, ERR_FACILITY_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: PATCH
    path: /capital/departments/{id}
    roles: [CapitalPlanner]
    input: ["name?", "modality_scope?"]
    output: Department
    side_effects: ["Updates the supplied fields; department.version += 1. facility_id and utilization_penalty_points are not writable."]
    errors: [ERR_VALIDATION, ERR_DEPARTMENT_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/departments/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: Department
    errors: [ERR_DEPARTMENT_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/departments
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["facility_id?", "modality_scope?", "underperformance_flag?", "limit?", "offset?"]
    output: Department[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]

  # ---- CapitalCycle -------------------------------------------------------
  - method: POST
    path: /capital/cycles
    roles: [CapitalPlanner]
    input: [plan_year, plan_year_start, total_capital_cents, contingency_pct, facility_contingency_pct]
    output: CapitalCycle
    side_effects: ["Creates a CapitalCycle in DRAFT with allocation_method null, every aggregate 0, allocated_by_user_id null, version 1."]
    errors: [ERR_VALIDATION, ERR_DUPLICATE_KEY, ERR_UNAUTHORIZED]
  - method: PATCH
    path: /capital/cycles/{id}
    roles: [CapitalPlanner]
    input: ["total_capital_cents?", "contingency_pct?", "facility_contingency_pct?", "plan_year_start?"]
    output: CapitalCycle
    side_effects: ["Updates the supplied fields; cycle.version += 1. Rejected unless cycle.status == DRAFT."]
    errors: [ERR_VALIDATION, ERR_CYCLE_NOT_FOUND, ERR_CYCLE_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/cycles/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: CapitalCycle
    errors: [ERR_CYCLE_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/cycles
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["status?", "plan_year?", "allocation_method?", "limit?", "offset?"]
    output: CapitalCycle[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/cycles/{id}/open-intake
    roles: [CapitalPlanner]
    input: []
    output: CapitalCycle
    side_effects: ["DRAFT -> INTAKE_OPEN; cycle.version += 1."]
    errors: [ERR_CYCLE_NOT_FOUND, ERR_CYCLE_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/cycles/{id}/close-intake
    roles: [CapitalPlanner]
    input: []
    output: CapitalCycle
    side_effects:
      - "INTAKE_OPEN -> SCORING; cycle.version += 1."
      - "Requests left in DRAFT, RETURNED or SUBMITTED keep their status but can no longer be submitted into this cycle."
    errors: [ERR_CYCLE_NOT_FOUND, ERR_CYCLE_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/cycles/{id}/score
    roles: [CapitalPlanner]
    input: []
    output: CapitalCycle
    side_effects:
      - "Runs priority_composite_score over the cycle's SCREENED and SCORED requests in created_at ASC order, appending one PriorityScore row each with reason CYCLE_SCORING."
      - "SCREENED requests move to SCORED; each touched request.version += 1."
      - "cycle.scored_count, cycle.expedited_count refreshed; cycle.version += 1."
    errors: [ERR_CYCLE_NOT_FOUND, ERR_CYCLE_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/cycles/{id}/allocate
    roles: [CapitalPlanner]
    input: [allocation_method, expected_cycle_version]
    output: CapitalCycle
    side_effects:
      - "Runs facility_allocation_waterfall with the requested variant; creates one FacilityAllocation per facility with an eligible request."
      - "On a re-run every prior FacilityAllocation of the cycle moves to posture SUPERSEDED with allocation.version += 1."
      - "cycle.allocation_method, system_contingency_cents, distributable_cents, unallocated_cents, contingency_drawn_cents, allocation_count, exhausted_allocation_count and allocated_by_user_id are written; cycle.status -> ALLOCATED; cycle.version += 1."
    errors: [ERR_VALIDATION, ERR_CYCLE_NOT_FOUND, ERR_CYCLE_INVALID_STATE, ERR_STALE_CYCLE_VERSION, ERR_NO_ELIGIBLE_REQUESTS, ERR_CONTINGENCY_RESERVE_EXCEEDED, ERR_ALLOCATION_ALREADY_COMMITTED, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/cycles/{id}/commit
    roles: [CapitalPlanner]
    input: []
    output: CapitalCycle
    side_effects:
      - "ALLOCATED -> COMMITTED; cycle.version += 1."
      - "Every request of the cycle in SCORED or IN_COMMITTEE moves to DEFERRED in created_at ASC order, each with request.version += 1."
    errors: [ERR_CYCLE_NOT_FOUND, ERR_CYCLE_INVALID_STATE, ERR_UNAUTHORIZED]

  # ---- FacilityAllocation -------------------------------------------------
  - method: GET
    path: /capital/allocations/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: FacilityAllocation
    errors: [ERR_ALLOCATION_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/allocations
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["cycle_id?", "facility_id?", "posture?", "contingency_status?", "limit?", "offset?"]
    output: FacilityAllocation[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/allocations/{id}/release-contingency
    roles: [CapitalPlanner]
    input: []
    output: FacilityAllocation
    side_effects:
      - "contingency_status HELD -> RELEASED; released_contingency_cents = contingency_reserve_cents; available_cents recomputed as allocated_cents + released_contingency_cents - committed_cents."
      - "posture EXHAUSTED -> ACTIVE when available_cents becomes > 0, and cycle.exhausted_allocation_count -= 1 with cycle.version += 1."
      - "allocation.version += 1."
    errors: [ERR_ALLOCATION_NOT_FOUND, ERR_CONTINGENCY_ALREADY_RELEASED, ERR_UNAUTHORIZED]

  # ---- EquipmentAsset -----------------------------------------------------
  - method: POST
    path: /capital/assets
    roles: [CapitalPlanner]
    input: [facility_id, department_id, modality, model_name, install_date, expected_life_years, acquisition_cost_cents, oem_support_end_date]
    output: EquipmentAsset
    side_effects:
      - "Runs asset_ruls_score (both variants) at the logical clock; writes age_years, nominal_ruls_score, adjusted_ruls_score, service_penalty_points, corrective_count_24m, downtime_hours_24m, unresolved_recall and ruls_as_of."
      - "status = DERATED when adjusted_ruls_score <= 15.00, else IN_SERVICE; disposition_status NONE; trade_in_credit_applied_cents 0; version 1."
      - "facility.active_asset_count += 1; facility.version += 1."
    errors: [ERR_VALIDATION, ERR_FACILITY_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND, ERR_ASSET_FACILITY_MISMATCH, ERR_UNAUTHORIZED]
  - method: PATCH
    path: /capital/assets/{id}
    roles: [CapitalPlanner]
    input: ["model_name?", "install_date?", "expected_life_years?", "oem_support_end_date?", "acquisition_cost_cents?"]
    output: EquipmentAsset
    side_effects:
      - "Updates the supplied fields, re-runs asset_ruls_score and re-applies the derate gate; asset.version += 1."
      - "Requests of this asset in status SCORED are re-scored with reason ASSET_CONDITION_CHANGE."
    errors: [ERR_VALIDATION, ERR_ASSET_NOT_FOUND, ERR_ASSET_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/assets/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: EquipmentAsset
    errors: [ERR_ASSET_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/assets
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["facility_id?", "department_id?", "modality?", "status?", "disposition_status?", "limit?", "offset?"]
    output: EquipmentAsset[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/assets/{id}/service-events
    roles: [CapitalPlanner]
    input: ["event_date", "category", "downtime_hours?", "cost_cents?", "recall_resolved?", "notes?"]
    output: ServiceEvent
    side_effects:
      - "Appends an immutable ServiceEvent."
      - "Re-runs asset_ruls_score at the logical clock and rewrites every derived asset field; asset.version += 1."
      - "Applies the derate gate: IN_SERVICE <-> DERATED per adjusted_ruls_score <= 15.00 or unresolved_recall."
      - "When the asset's status changed, every request of this asset in status SCORED is re-scored (PriorityScore reason ASSET_CONDITION_CHANGE) and its cycle's expedited_count is refreshed."
    errors: [ERR_VALIDATION, ERR_ASSET_NOT_FOUND, ERR_ASSET_INVALID_STATE, ERR_EVENT_DATE_IN_FUTURE, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/assets/{id}/service-events
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["category?", "limit?", "offset?"]
    output: ServiceEvent[]
    errors: [ERR_VALIDATION, ERR_ASSET_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/assets/{id}/decommission
    roles: [CapitalPlanner]
    input: [disposition]
    output: EquipmentAsset
    side_effects:
      - "REPLACEMENT_PENDING -> DECOMMISSIONED; disposition_status = TRADED_IN or SCRAPPED per the input; asset.version += 1."
      - "facility.active_asset_count -= 1; facility.version += 1."
    errors: [ERR_VALIDATION, ERR_ASSET_NOT_FOUND, ERR_ASSET_INVALID_STATE, ERR_INSTALLATION_NOT_COMMISSIONED, ERR_TRADE_IN_NOT_HELD, ERR_UNAUTHORIZED]

  # ---- ReplacementRequest -------------------------------------------------
  - method: POST
    path: /capital/requests
    roles: [ClinicalRequester]
    input: ["cycle_id", "department_id", "asset_id", "clinical_justification", "current_annual_volume", "projected_annual_volume", "estimated_capital_cents", "annual_service_contract_cents", "disposable_unit_cents", "sponsor_member_id?", "facility_modification_cents?", "regulatory_mandate_flag?", "mandate_deadline?"]
    output: ReplacementRequest
    side_effects: ["Creates a ReplacementRequest in DRAFT with every computed driver 0.00, composite_score 0.00, expedited false, revision_count 0, return_count 0, funded_amount_cents 0, version 1."]
    errors: [ERR_VALIDATION, ERR_CYCLE_NOT_FOUND, ERR_DEPARTMENT_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_DEPARTMENT_SCOPE_VIOLATION, ERR_ASSET_DEPARTMENT_MISMATCH, ERR_MODIFICATION_COST_EXCEEDS_CAP, ERR_MANDATE_DEADLINE_REQUIRED, ERR_UNAUTHORIZED]
  - method: PATCH
    path: /capital/requests/{id}
    roles: [ClinicalRequester]
    input: ["clinical_justification?", "current_annual_volume?", "projected_annual_volume?", "estimated_capital_cents?", "facility_modification_cents?", "annual_service_contract_cents?", "disposable_unit_cents?", "sponsor_member_id?", "regulatory_mandate_flag?", "mandate_deadline?"]
    output: ReplacementRequest
    side_effects:
      - "Updates the supplied fields; request.version += 1."
      - "RETURNED -> DRAFT with request.revision_count += 1; a DRAFT request stays in DRAFT and revision_count is unchanged."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_DEPARTMENT_SCOPE_VIOLATION, ERR_MODIFICATION_COST_EXCEEDS_CAP, ERR_MANDATE_DEADLINE_REQUIRED, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/requests/{id}
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: []
    output: ReplacementRequest
    errors: [ERR_REQUEST_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/requests
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["cycle_id?", "department_id?", "asset_id?", "sponsor_member_id?", "status?", "expedited?", "limit?", "offset?"]
    output: ReplacementRequest[]
    errors: [ERR_VALIDATION, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/submit
    roles: [ClinicalRequester]
    input: []
    output: ReplacementRequest
    side_effects:
      - "DRAFT -> SUBMITTED; request.version += 1."
      - "Runs five_year_tco variant `budgetary`, writing budgetary_operating_5y_cents, budgetary_tco_cents and baseline_year1_opex_cents."
    errors: [ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_CYCLE_INVALID_STATE, ERR_DEPARTMENT_SCOPE_VIOLATION, ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE, ERR_DUPLICATE_ASSET_REQUEST, ERR_REVISION_LIMIT_EXCEEDED, ERR_MODIFICATION_COST_EXCEEDS_CAP, ERR_MANDATE_DEADLINE_REQUIRED, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/screen
    roles: [CapitalPlanner]
    input: ["decision", "screening_note?"]
    output: ReplacementRequest
    side_effects:
      - "decision ACCEPT: SUBMITTED -> SCREENED; request.version += 1."
      - "decision RETURN: SUBMITTED -> RETURNED with request.return_count += 1; request.version += 1."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_CYCLE_INVALID_STATE, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/withdraw
    roles: [ClinicalRequester]
    input: ["withdrawal_reason?"]
    output: ReplacementRequest
    side_effects:
      - "DRAFT | RETURNED | SUBMITTED | SCREENED | SCORED -> WITHDRAWN; request.version += 1."
      - "When the request was SCORED, cycle.scored_count and cycle.expedited_count are refreshed and cycle.version += 1."
    errors: [ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_DEPARTMENT_SCOPE_VIOLATION, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/requests/{id}/scores
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["reason?", "limit?", "offset?"]
    output: PriorityScore[]
    description: "Append-only score history for the request, ordered created_at ASC; the highest `sequence` is authoritative."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/votes
    roles: [CommitteeMember]
    input: ["vote", "expected_request_version", "rationale?"]
    output: CommitteeVote
    side_effects:
      - "Creates a CommitteeVote with counted_weight pinned from the member's current voting_weight."
      - "Any earlier non-superseded ballot of the same member on this request is marked superseded = true."
      - "SCORED -> IN_COMMITTEE on the first counted ballot; request.version += 1 on every ballot."
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_CYCLE_INVALID_STATE, ERR_STALE_REQUEST_VERSION, ERR_VOTE_CONFLICT_OF_INTEREST, ERR_VETO_NOT_PERMITTED, ERR_UNAUTHORIZED]
  - method: GET
    path: /capital/requests/{id}/votes
    roles: [CapitalPlanner, ClinicalRequester, FacilityDirector, CommitteeMember, ComplianceAuditor]
    input: ["member_id?", "superseded?", "limit?", "offset?"]
    output: CommitteeVote[]
    errors: [ERR_VALIDATION, ERR_REQUEST_NOT_FOUND, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/committee-decision
    roles: [CommitteeMember]
    input: ["decision_note?"]
    output: ReplacementRequest
    side_effects:
      - "Runs committee_tally and moves IN_COMMITTEE -> APPROVED | DEFERRED | REJECTED per its step 4; request.version += 1."
      - "No ballot is mutated and no capital is reserved by this call."
    errors: [ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_CHAIR_REQUIRED, ERR_NO_ELIGIBLE_VOTERS, ERR_QUORUM_NOT_MET, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/fund
    roles: [CapitalPlanner]
    input: []
    output: ReplacementRequest
    side_effects:
      - "APPROVED -> FUNDED; funded_amount_cents from request_funded_amount; request.version += 1."
      - "allocation.committed_cents += funded_amount_cents; available_cents recomputed; allocation.version += 1."
      - "asset IN_SERVICE | DERATED -> REPLACEMENT_PENDING; asset.version += 1."
      - "CASCADE: available_cents == 0 -> allocation.posture EXHAUSTED -> cycle.exhausted_allocation_count += 1 -> when it equals cycle.allocation_count the cycle moves ALLOCATED -> COMMITTED -> every remaining SCORED or IN_COMMITTEE request of the cycle moves to DEFERRED in created_at ASC order."
    errors: [ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_CYCLE_INVALID_STATE, ERR_SOD_ALLOCATOR_CANNOT_FUND, ERR_NO_FACILITY_ALLOCATION, ERR_ALLOCATION_INSUFFICIENT, ERR_UNAUTHORIZED]
  - method: POST
    path: /capital/requests/{id}/withdraw-funding
    roles: [CapitalPlanner]
    input: ["withdrawal_reason?"]
    output: ReplacementRequest
    side_effects:
      - "FUNDED -> APPROVED; funded_amount_cents -> 0; request.version += 1."
      - "allocation.committed_cents -= the released amount; available_cents recomputed; posture EXHAUSTED -> ACTIVE when available_cents > 0 with cycle.exhausted_allocation_count -= 1; allocation.version += 1."
      - "asset REPLACEMENT_PENDING -> DERATED when adjusted_ruls_score <= 15.00 or unresolved_recall, else -> IN_SERVICE; asset.version += 1."
      - "A cycle already in COMMITTED stays COMMITTED and previously DEFERRED siblings are not revived."
    errors: [ERR_REQUEST_NOT_FOUND, ERR_REQUEST_INVALID_STATE, ERR_PROJECT_ACTIVE, ERR_NO_FACILITY_ALLOCATION, ERR_UNAUTHORIZED]

