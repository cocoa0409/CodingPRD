            - { call: "POST /jobs/${job_a}/incidents", payload: { incident_type: "PROPERTY_DAMAGE", description: "Fence post damaged", claimed_amount_cents: 100000, assignment_id: "${asg_a}" }, as: Dispatcher, as_user_id: "disp-1", captures: { inc2: $.data.id } }
          trigger:
            - { call: "POST /incidents/${inc1}/assess", payload: { escort_fault_share_pct: 60 }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /incidents/${inc1}/settle", payload: {}, as: FinanceManager }
            - { call: "POST /incidents/${inc2}/assess", payload: { escort_fault_share_pct: 60 }, as: SafetyManager, as_user_id: "sm-1" }
            - { call: "POST /incidents/${inc2}/settle", payload: {}, as: FinanceManager }
          assert:
            - "After settle 1: Escort.${esc_id}.reliability_score == 65 (100 - 35) and escort_status == ACTIVE (65 >= 40)"
            - "After settle 2: reliability_score == 30 < 40 -> escort_status == SUSPENDED (link 1: settle mutated the Escort)"
            - "EscortAssignment.${asg_b}.assignment_status == RELEASED with release_cause == ESCORT_SUSPENDED (link 2: the suspension — not the settle — released the assignment)"
            - "Job.${job_b}.job_status == CLEARED (link 3: the release — not the suspension directly — demoted the SCHEDULED job because its required REAR position became uncovered)"
            - "Incident.${inc1}.escort_share_cents == 10000 and Incident.${inc2}.escort_share_cents == 10000 (chargebacks recorded for invoice composition)"

      - name: clock_permit_expiry_leg_job_demote
        grounds:
          - state_machines.Permit.ISSUED_to_EXPIRED
          - state_machines.RouteLeg.CLEARED_to_BLOCKED
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (logical-clock advance, not an
          incident settle): clock sweep expires the ISSUED permit, the expiry
          itself blocks the CLEARED leg, and the blocked leg demotes the
          SCHEDULED job to BOOKED.
        test_recipe:
          setup:
            - "Zero-position job C (width 150 / height 150, TX 120mi) booked; permit ISSUED with valid_until 2026-08-11T00:00:00Z; job CLEARED then SCHEDULED (traversal 2026-08-10 09:00..13:00 inside validity and outside curfew)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Llano Logistics", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Wide crate", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-8", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-11T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: Dispatcher }
          assert:
            - "Permit.${permit_id}.permit_status == EXPIRED (link 1: the clock advance mutated the permit)"
            - "RouteLeg.${leg_id}.leg_status == BLOCKED (link 2: the permit expiry — not the clock call directly — blocked the leg)"
            - "Job.${job_id}.job_status == BOOKED (link 3: the blocked leg demoted the SCHEDULED job, skipping CLEARED because the permit gate broke)"
            - "No API call touched the leg or job directly; the entire chain is a side effect of POST /_clock/set_current_utc"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — DIFFERENT error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_accept_quote
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - errors[ERR_JOB_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_fiscal (priority 17):
          the job is CANCELLED AND the carrier's credit (100) cannot cover the
          quote (47500); the state error must win.
        test_recipe:
          setup:
            - "Carrier with credit_limit_cents 100; job width 170 / height 170 (survey required -> quoted 47500); quoted, then cancelled from QUOTED (fee tier NONE)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Broke Trailers LLC", credit_limit_cents: 100 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Tall box", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/cancel", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}", captures: { err: $.data.error_id } }
          assert:
            - "Response is http 409 with data.error_id == ERR_JOB_INVALID_STATE (captured err == ERR_JOB_INVALID_STATE)"
            - "NOT ERR_CREDIT_LIMIT_WOULD_BE_EXCEEDED (402): the state precondition (priority 7) fires before the fiscal check (priority 17) even though quoted_cents 47500 > credit_available 100 also holds"
            - "Job.${job_id}.job_status remains CANCELLED; no credit hold was placed"

      - name: safety_beats_temporal_on_assignment
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_ESCORT_NOT_CERTIFIED_FOR_STATE]
          - errors[ERR_ESCORT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Category pair business_safety (priority 8) vs business_temporal
          (priority 12) — a different pair from state-vs-fiscal: the explicit
          escort both lacks TX certification AND has a buffered window conflict;
          the certification error must win.
        test_recipe:
          setup:
            - "Escort E2 certified only in OK, with an ACCEPTED REAR assignment on booked OK job K (window 2026-08-10 09:00..13:00)"
            - "Booked TX job B (width 185 -> 2 positions) whose window 2026-08-10 10:00..14:00 overlaps K's buffered window"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Sooner Shipping", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Okie Only", certified_state_codes: ["OK"] }, as: Dispatcher, captures: { esc2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "OK job", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "OK", sequence_index: 0, distance_miles: 100, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_k: $.data.id } }
            - { call: "GET /jobs/${job_k}/legs", payload: {}, as: Dispatcher, captures: { leg_k: "$.data[0].id" } }
            - { call: "POST /jobs/${job_k}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_k}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_k}/assignments", payload: { position: "REAR", escort_id: "${esc2_id}" }, as: Dispatcher, captures: { asg_k: $.data.id } }
            - { call: "POST /assignments/${asg_k}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc2_id}" }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "TX job", width_inches: 185, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T10:00:00Z", window_end_at: "2026-08-10T14:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T10:00:00Z", planned_exit_at: "2026-08-10T14:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_b: $.data.id } }
            - { call: "GET /jobs/${job_b}/legs", payload: {}, as: Dispatcher, captures: { leg_b: "$.data[0].id" } }
            - { call: "POST /jobs/${job_b}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_b}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /legs/${leg_b}/assignments", payload: { position: "REAR", escort_id: "${esc2_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "Response is http 422 with data.error_id == ERR_ESCORT_NOT_CERTIFIED_FOR_STATE (captured err == ERR_ESCORT_NOT_CERTIFIED_FOR_STATE)"
            - "NOT ERR_ESCORT_WINDOW_CONFLICT (409): safety (priority 8) beats temporal (priority 12) even though E2's buffered window on job K (08:00..14:00) overlaps job B's buffered window (09:00..15:00)"
            - "No assignment was created on leg B (GET /legs/${leg_b}/assignments returns an empty list)"

  # ---------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — DIFFERENT metrics via DISTINCT endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: width_threshold_inclusive_168
        grounds:
          - calculations.escort_requirement_determination
          - entities.RouteLeg.fields.required_rear_escorts
        distinguishing_aspect: |
          Metric: load width in inches, evaluated by POST /jobs/{id}/quote.
          The rear-escort threshold is INCLUSIVE (>=): width 168 == TX
          rear_threshold triggers the requirement; 167 does not.
        test_recipe:
          setup:
            - "Carrier; clock 2026-08-05; two DRAFT TX jobs identical except width: W1 = 168, W2 = 167 (height 150, weight 150000, 100mi)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Precision Carriers", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Exactly 168", width_inches: 168, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T11:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 100, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T11:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_w1: $.data.id } }
            - { call: "GET /jobs/${job_w1}/legs", payload: {}, as: Dispatcher, captures: { leg_w1: "$.data[0].id" } }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Just 167", width_inches: 167, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-11T09:00:00Z", window_end_at: "2026-08-11T11:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 100, planned_entry_at: "2026-08-11T09:00:00Z", planned_exit_at: "2026-08-11T11:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_w2: $.data.id } }
            - { call: "GET /jobs/${job_w2}/legs", payload: {}, as: Dispatcher, captures: { leg_w2: "$.data[0].id" } }
          trigger:
            - { call: "POST /jobs/${job_w1}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_w2}/quote", payload: {}, as: Dispatcher }
          assert:
            - "RouteLeg.${leg_w1}.required_rear_escorts == 1 (168 >= 168: inclusive boundary)"
            - "RouteLeg.${leg_w2}.required_rear_escorts == 0 and required_front_escorts == 0 (167 < 168)"
            - "Job.${job_w1}.quoted_cents == 18000 (2.0h x 1 position x 9000; ceil(100/50*2)/2 = 2.0h); Job.${job_w2}.quoted_cents == 0 (no positions, no equipment)"

      - name: standby_grace_boundary_30_vs_31
        grounds:
          - calculations.standby_billing
          - entities.DelayEvent.fields.standby_amount_cents
        distinguishing_aspect: |
          Metric: delay minutes, evaluated by POST /delay-events/{id}/close —
          a different metric AND endpoint from the width boundary. A delay of
          exactly 30 minutes bills zero (grace is inclusive); 31 minutes bills
          one full 15-minute increment.
        test_recipe:
          setup:
            - "TX job (width 170 / height 150, 1 REAR position) EN_ROUTE since 2026-08-10T09:00:00Z"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Grace Boundary Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Steady Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc1_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Press", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-10", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc1_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc1_id}" }
            - { call: "POST /jobs/${job_id}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/depart", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/delay-events", payload: { cause: "CARRIER_DELAY", started_at: "2026-08-10T10:00:00Z" }, as: Dispatcher, captures: { d30: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:30:00Z" }, as: Dispatcher }
            - { call: "POST /delay-events/${d30}/close", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/delay-events", payload: { cause: "CARRIER_DELAY", started_at: "2026-08-10T11:00:00Z" }, as: Dispatcher, captures: { d31: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:31:00Z" }, as: Dispatcher }
            - { call: "POST /delay-events/${d31}/close", payload: {}, as: Dispatcher }
          assert:
            - "DelayEvent.${d30}: raw_minutes == 30, billable_minutes == 0, standby_amount_cents == 0 (exactly 30 is fully inside the grace: max(0, 30-30) = 0)"
            - "DelayEvent.${d31}: raw_minutes == 31, billable_minutes == 15 (31-30 = 1 chargeable -> ceil(1/15)*15 = 15), standby_amount_cents == 1875 (0.25h x 7500 x 1 position)"

  # ---------------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency — DIFFERENT entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_accept_requires_escort_active
        grounds:
          - state_machines.EscortAssignment.OFFERED_to_ACCEPTED
          - state_machines.Escort.ACTIVE_to_SUSPENDED
          - errors[ERR_ESCORT_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair EscortAssignment -> Escort: an OFFERED assignment (which
          suspension deliberately does NOT release — only ACCEPTED ones) cannot
          be accepted while its escort is SUSPENDED.
        test_recipe:
          setup:
            - "Escort E (TX); booked TX job (width 170 / height 150); OFFERED REAR assignment to E"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Stable Freight", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Shaky Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Crates", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_id: $.data.id } }
          trigger:
            - { call: "POST /escorts/${esc_id}/suspend", payload: {}, as: SafetyManager }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}", captures: { err: $.data.error_id } }
          assert:
            - "Suspension left EscortAssignment.${asg_id}.assignment_status == OFFERED (only ACCEPTED assignments are cascade-released)"
            - "Accept returns http 409 with data.error_id == ERR_ESCORT_INVALID_STATE"
            - "Escort.${esc_id}.escort_status == SUSPENDED and the assignment remains OFFERED (no partial mutation)"

      - name: job_cleared_gate_permit_and_survey
        grounds:
          - state_machines.Job.BOOKED_to_CLEARED
          - state_machines.Permit.APPLIED_to_ISSUED
          - state_machines.RouteSurvey.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Entity pair Job -> (Permit, RouteSurvey) — different pair from
          Assignment -> Escort: issuing the permit alone leaves the job BOOKED
          because the survey gate is unmet; only the survey accept (verdict
          PASS) flips the job to CLEARED via the system re-evaluation.
        test_recipe:
          setup:
            - "Booked TX job width 170 / height 170 (survey required; map clearance 180); permit ISSUED; survey SUBMITTED with surveyed_min 180 (required clearance 176 -> PASS)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Gate Test Carriers", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Tall press", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_id}/permits", payload: { permit_number: "TX-P-11", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_id: $.data.id } }
            - { call: "POST /permits/${permit_id}/issue", payload: {}, as: Dispatcher }
            - { call: "GET /jobs/${job_id}", payload: {}, as: Dispatcher, captures: { status_mid: $.data.job_status } }
            - { call: "POST /legs/${leg_id}/route-surveys", payload: {}, as: RouteSurveyor, captures: { survey_id: $.data.id } }
            - { call: "POST /route-surveys/${survey_id}/submit", payload: { surveyed_min_clearance_inches: 180 }, as: RouteSurveyor }
          trigger:
            - { call: "GET /legs/${leg_id}", payload: {}, as: Dispatcher, captures: { leg_v: $.data.version } }
            - { call: "POST /route-surveys/${survey_id}/accept", payload: { expected_leg_version: "${leg_v}", outcome: "ACCEPTED" }, as: SafetyManager }
          assert:
            - "Captured status_mid == BOOKED: permit issuance alone did NOT clear the job (survey gate unmet)"
            - "After survey accept: Job.${job_id}.job_status == CLEARED (the accept re-evaluated the aggregate gate)"
            - "RouteLeg.${leg_id}.clearance_verdict == PASS and leg_status == CLEARED"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — DIFFERENT interval semantics, DIFFERENT resources
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: escort_buffered_window_touch_vs_conflict
        grounds:
          - calculations.escort_assignment_overlap_check
          - errors[ERR_ESCORT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource: Escort; semantics: ABSOLUTE windows expanded by a 60-minute
          deadhead buffer on BOTH sides with strict-inequality overlap —
          exactly 120 minutes of separation (buffer+buffer) touches and is
          ALLOWED; 119 minutes conflicts.
        test_recipe:
          setup:
            - "Escort E (TX) ACCEPTED on booked job A (window 2026-08-10 09:00..13:00, width 185 -> REAR position used)"
            - "Booked job B window 2026-08-10 15:00..17:00 (120 min after A ends) and booked job C window 2026-08-10 13:59..16:00 (119 min after A ends); carrier credit 1000000"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Overlap Test Co", credit_limit_cents: 1000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Busy Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "A", width_inches: 185, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_a: $.data.id } }
            - { call: "GET /jobs/${job_a}/legs", payload: {}, as: Dispatcher, captures: { leg_a: "$.data[0].id" } }
            - { call: "POST /jobs/${job_a}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_a}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_a}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_a: $.data.id } }
            - { call: "POST /assignments/${asg_a}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "B", width_inches: 185, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T15:00:00Z", window_end_at: "2026-08-10T17:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 60, planned_entry_at: "2026-08-10T15:00:00Z", planned_exit_at: "2026-08-10T17:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_b: $.data.id } }
            - { call: "GET /jobs/${job_b}/legs", payload: {}, as: Dispatcher, captures: { leg_b: "$.data[0].id" } }
            - { call: "POST /jobs/${job_b}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_b}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "C", width_inches: 185, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T13:59:00Z", window_end_at: "2026-08-10T16:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 60, planned_entry_at: "2026-08-10T13:59:00Z", planned_exit_at: "2026-08-10T16:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_c: $.data.id } }
            - { call: "GET /jobs/${job_c}/legs", payload: {}, as: Dispatcher, captures: { leg_c: "$.data[0].id" } }
            - { call: "POST /jobs/${job_c}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_c}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /legs/${leg_b}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg_b: $.data.id } }
            - { call: "POST /legs/${leg_c}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "Job B assignment created (201): A's expanded window [08:00, 14:00] merely TOUCHES B's expanded window [14:00, 18:00] — strict-inequality overlap test passes at exactly 120 minutes of separation"
            - "Job C assignment rejected: http 409, data.error_id == ERR_ESCORT_WINDOW_CONFLICT (119-minute separation: expanded [12:59, 17:00] overlaps A's expanded [08:00, 14:00])"
            - "Escort.${esc_id}.active_assignment_count == 1 (B's OFFERED assignment does not count; C created nothing)"

      - name: curfew_half_open_boundaries
        grounds:
          - calculations.curfew_window_validation
          - errors[ERR_CURFEW_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Resource: RouteLeg traversal slot; semantics: HALF-OPEN RECURRING
          daily windows with NO buffer — different interval semantics and
          resource from the escort overlap rule. Entry exactly at curfew end
          (09:00) and exit exactly at curfew start (16:00) are both allowed;
          straddling [08:30, 09:30) violates.
        test_recipe:
          setup:
            - "Three booked zero-position TX jobs (width 150 / height 150), all CLEARED via issued permits: D traverses 09:00..13:00, E traverses 08:30..09:30, F traverses 13:00..16:00 on 2026-08-10 (TX curfews [07:00,09:00) and [16:00,18:30) UTC)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Curfew Test Co", credit_limit_cents: 1000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "D", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_d: $.data.id } }
            - { call: "GET /jobs/${job_d}/legs", payload: {}, as: Dispatcher, captures: { leg_d: "$.data[0].id" } }
            - { call: "POST /jobs/${job_d}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_d}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_d}/permits", payload: { permit_number: "TX-P-12", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_d: $.data.id } }
            - { call: "POST /permits/${permit_d}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "E", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T08:30:00Z", window_end_at: "2026-08-10T09:30:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 30, planned_entry_at: "2026-08-10T08:30:00Z", planned_exit_at: "2026-08-10T09:30:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_e: $.data.id } }
            - { call: "GET /jobs/${job_e}/legs", payload: {}, as: Dispatcher, captures: { leg_e: "$.data[0].id" } }
            - { call: "POST /jobs/${job_e}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_e}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_e}/permits", payload: { permit_number: "TX-P-13", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_e: $.data.id } }
            - { call: "POST /permits/${permit_e}/issue", payload: {}, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "F", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T16:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 90, planned_entry_at: "2026-08-10T13:00:00Z", planned_exit_at: "2026-08-10T16:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_f: $.data.id } }
            - { call: "GET /jobs/${job_f}/legs", payload: {}, as: Dispatcher, captures: { leg_f: "$.data[0].id" } }
            - { call: "POST /jobs/${job_f}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_f}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
            - { call: "POST /legs/${leg_f}/permits", payload: { permit_number: "TX-P-14", valid_from: "2026-08-09T00:00:00Z", valid_until: "2026-08-12T00:00:00Z" }, as: Dispatcher, captures: { permit_f: $.data.id } }
            - { call: "POST /permits/${permit_f}/issue", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /jobs/${job_d}/schedule", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_e}/schedule", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
            - { call: "POST /jobs/${job_f}/schedule", payload: {}, as: Dispatcher }
          assert:
            - "Job D scheduled (job_status == SCHEDULED): planned_entry_at == 09:00 == TX morning curfew END is allowed (half-open: 09:00 < 09:00 is false)"
            - "Job E rejected: http 409, data.error_id == ERR_CURFEW_WINDOW_VIOLATION ([08:30, 09:30) intersects [07:00, 09:00))"
            - "Job F scheduled (job_status == SCHEDULED): planned_exit_at == 16:00 == TX evening curfew START is allowed (16:00 < 16:00 is false)"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — DIFFERENT conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: book_cancel_conserves_credit
        grounds:
          - calculations.carrier_credit_availability
          - calculations.cancellation_fee
          - state_machines.Job.QUOTED_to_BOOKED
        distinguishing_aspect: |
          Conserved quantity: Carrier.credit_available_cents = credit_limit -
          quoted holds - outstanding invoice totals. The accept-quote (hold)
          and cancel (release) pair MUST return the carrier to exactly its
          pre-booking availability (10000000) even though a 4750 cancellation
          fee accrued on the job.
        test_recipe:
          setup:
            - "Carrier credit_limit_cents 10000000; TX job width 170 / height 170 quoted at 47500 and accepted (BOOKED)"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Conservation Carriers", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Cancel me", width_inches: 170, height_inches: 170, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /jobs/${job_id}/cancel", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          assert:
            - "After accept-quote: Carrier.${carrier_id}.credit_available_cents == 9952500 (10000000 - 47500 quoted hold)"
            - "After cancel: Carrier.${carrier_id}.credit_available_cents == 10000000 — the book+cancel pair conserves credit_available_cents exactly (CANCELLED jobs leave the quoted-hold set and no invoice exists)"
            - "Job.${job_id}.job_status == CANCELLED, cancel_fee_tier == TIER_10, cancel_fee_cents == 4750 (round_half_up(47500 x 0.10)) — the fee accrues on the job without perturbing the conserved quantity"

      - name: offer_accept_release_conserves_assignment_count
        grounds:
          - entities.Escort.fields.active_assignment_count
          - state_machines.EscortAssignment.OFFERED_to_DECLINED
          - state_machines.EscortAssignment.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Conserved quantity: Escort.active_assignment_count (count of
          assignments in {ACCEPTED, ACTIVE}) — a different quantity from credit
          cents. OFFERED entries do not move it; offer+decline and
          accept+release pairs both leave it unchanged.
        test_recipe:
          setup:
            - "Escort E (TX); booked TX job (width 170 / height 150) with a DETERMINED leg"
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "Count Conservation Co", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_id: $.data.id } }
            - { call: "POST /escorts", payload: { operator_name: "Counted Rider", certified_state_codes: ["TX"] }, as: Dispatcher, captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_id}", load_description: "Counting job", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-10T09:00:00Z", window_end_at: "2026-08-10T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-10T09:00:00Z", planned_exit_at: "2026-08-10T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_id}", captures: { job_id: $.data.id } }
            - { call: "GET /jobs/${job_id}/legs", payload: {}, as: Dispatcher, captures: { leg_id: "$.data[0].id" } }
            - { call: "POST /jobs/${job_id}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs/${job_id}/accept-quote", payload: {}, as: CarrierRep, as_user_id: "${carrier_id}" }
          trigger:
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/decline", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /legs/${leg_id}/assignments", payload: { position: "REAR", escort_id: "${esc_id}" }, as: Dispatcher, captures: { asg2: $.data.id } }
            - { call: "POST /assignments/${asg2}/accept", payload: {}, as: EscortOperator, as_user_id: "${esc_id}" }
            - { call: "POST /assignments/${asg2}/release", payload: {}, as: Dispatcher }
          assert:
            - "After offer+decline: Escort.${esc_id}.active_assignment_count == 0 (OFFERED never incremented; decline changed nothing)"
            - "After accept: Escort.${esc_id}.active_assignment_count == 1"
            - "After release: Escort.${esc_id}.active_assignment_count == 0 (accept+release pair conserves the count) and EscortAssignment.${asg2}.release_cause == DISPATCHER"
            - "EscortAssignment.${asg1}.assignment_status == DECLINED; quota freed by both terminal outcomes (a third REAR offer would still be creatable)"

