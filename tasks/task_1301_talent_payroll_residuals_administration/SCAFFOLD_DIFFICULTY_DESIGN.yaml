# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_1301_talent_payroll_residuals_administration
# Every instance: 2+ per §0.5 rule; grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# YAML anchors defined at first use (&c_*) are the shared fixture calls; aliases
# (*c_*) reuse them so each instance stays executable from empty-DB.
# Standard fixture numbers (verified by executing the §1.3 formulas):
#   agreement T1 tier: day_rate 100000, OT threshold 480, multiplier 1.5
#   TC-A: call 08:00, meal 14:30-15:00, wrap 19:00 -> worked 630, OT 150,
#         day_gross 146875, MEAL penalty 2500 (delay 390 > 360)
#   TIMECARD pay line: gross 149375, tax 14938 (CA 0.10), disposable 134437,
#         garnishment cap 33609; O1 (20%) -> 26887; O2 fixed 5000 -> 5000;
#         garnished 31887, net 102550, PHW 23453 (8963+12697+1793)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: timecard_penalty_provisional_vs_final
        grounds:
          - calculations.penalty_assessment_calculation
          - entities.Timecard.fields.provisional_penalty_cents
          - entities.Timecard.fields.final_penalty_cents
        distinguishing_aspect: |
          On the Timecard/penalty domain: the provisional variant (scheduled_hours only)
          yields 2500 for a 9-hour schedule, while the final variant (actual timestamps,
          on-time meal) yields 0 — identical contract, different result per variant.
        test_recipe:
          setup:
            - "RATIFIED SAG_AFTRA agreement with T1/T2 tiers; production SHOOTING with CA jurisdiction; performer; engagement ACTIVE on tier T1, window 2026-08-03..2026-09-11"
            - "timecard for 2026-08-10 with scheduled_hours 9 but actual meal on time (13:30, i.e. 330 min after call)"
          setup_api_calls:
            - &c_agr
              call: "POST /payroll/union-agreements"
              payload: { union_code: "SAG_AFTRA", name: "SAG Basic 2026", effective_from: "2026-01-01", effective_to: "2027-01-01", rate_tiers: [{ tier_code: "T1", category: "PRINCIPAL", day_rate_cents: 100000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }, { tier_code: "T2", category: "BACKGROUND", day_rate_cents: 20000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }], meal_penalty_cents: 2500, rest_penalty_cents: 1000, turnaround_min_hours: 10, phw_pension_pct: 0.06, phw_health_pct: 0.085, phw_welfare_pct: 0.012, residual_base_pct_by_market: { NETWORK_REBROADCAST: 0.025, SYNDICATION: 0.045, STREAMING: 0.012 } }
              as: PayrollAdmin
              captures: { agr: $.data.id }
            - &c_ratify
              call: "POST /payroll/union-agreements/${agr}/ratify"
              payload: {}
              as: PayrollAdmin
            - &c_prod
              call: "POST /payroll/productions"
              payload: { title: "Picture A", production_company: "Studio X", union_agreement_id: "${agr}", production_type: "FILM", jurisdictions: [{ jurisdiction_code: "CA", tax_pct: 0.10, valid_from: "2026-01-01", valid_to: "2027-01-01" }, { jurisdiction_code: "NM", tax_pct: 0.05, valid_from: "2026-01-01", valid_to: "2027-01-01" }] }
              as: PayrollAdmin
              captures: { prod: $.data.id }
            - &c_adv
              call: "POST /payroll/productions/${prod}/advance"
              payload: {}
              as: PayrollAdmin
            - &c_perf
              call: "POST /payroll/performers"
              payload: { legal_name: "Pat Star", primary_union_code: "SAG_AFTRA", tax_residency_state: "CA" }
              as: PayrollAdmin
              captures: { perf: $.data.id }
            - &c_eng
              call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T1", payee_type: "DIRECT", weekly_guarantee_cents: 500000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11" }
              as: ProductionAccountant
              captures: { eng: $.data.id }
            - &c_engsub
              call: "POST /payroll/engagements/${eng}/submit"
              payload: {}
              as: ProductionAccountant
            - &c_engapp
              call: "POST /payroll/engagements/${eng}/approve"
              payload: {}
              as: PayrollSupervisor
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T13:30:00Z", first_meal_in: "2026-08-10T14:00:00Z", wrap_time: "2026-08-10T17:00:00Z", scheduled_hours: 9 }
              as: ProductionAccountant
              captures: { tc: $.data.id }
          trigger:
            - call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
          assert:
            - "At creation, Timecard.${tc}.provisional_penalty_cents == 2500 (scheduled_hours 9 > 6 forces a provisional MEAL unit)"
            - "After approve, Timecard.${tc}.final_penalty_cents == 0 (actual meal delay 330 <= 360; rest 30 not < 30; no previous timecard for turnaround)"
            - "After approve, Timecard.${tc}.day_gross_cents == 109375 (worked 510, OT 30 -> 100000 + 9375)"
            - "GET /payroll/penalty-assessments?timecard_id=${tc} returns zero rows (no units > 0)"
      - name: residual_provisional_vs_final_by_market
        grounds:
          - calculations.residual_calculation
          - entities.ResidualObligation.fields.provisional_amount_cents
          - entities.ResidualObligation.fields.final_amount_cents
        distinguishing_aspect: |
          On the ResidualObligation/reuse-market domain (a different entity domain than
          the timecard penalty instance): provisional pins 100000 x 0.045 = 4500 from the
          tier day rate, while final uses reported receipts 20000000 x 0.045 x 1.0 = 900000.
        test_recipe:
          setup:
            - "standard fixture: agreement RATIFIED, production SHOOTING, performer, engagement ACTIVE (T1)"
            - "residual obligation SYNDICATION window 2027-01-05..2027-06-30 with reported receipts 20000000"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - &c_resid
              call: "POST /payroll/residual-obligations"
              payload: { engagement_id: "${eng}", reuse_market: "SYNDICATION", window_start: "2027-01-05", window_end: "2027-06-30", reported_gross_receipts_cents: 20000000 }
              as: ProductionAccountant
              captures: { res: $.data.id }
          trigger:
            - call: "POST /payroll/residual-obligations/${res}/calculate"
              payload: {}
              as: PayrollClerk
          assert:
            - "At creation (REPORTED), ResidualObligation.${res}.provisional_amount_cents == 4500 and final_amount_cents == 0"
            - "After calculate, final_amount_cents == 900000 (20000000 x 0.045 x discount 1.0 for window_sequence 1)"
            - "provisional_amount_cents remains 4500 after calculation (snapshot fields never rewritten)"
            - "window_sequence == 1 and base_pct == 0.045 (pinned from the agreement at creation)"

  - rule_id: combinatorial_formula
    instances:
      - name: daily_gross_tiered_overtime_composition
        grounds:
          - calculations.daily_gross_calculation
          - entities.Timecard.fields.day_gross_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula (worked_minutes x ot_daily_threshold_minutes
          x ot_multiplier x day_rate_cents) with nested min/max and tier lookup through the
          engagement; OT minutes are priced at 1.5x only beyond the 480-minute threshold.
        test_recipe:
          setup:
            - "standard fixture with engagement ACTIVE (T1)"
            - "timecard 2026-08-10: call 08:00, meal 14:30-15:00 (late: 390 > 360), wrap 19:00"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - &c_tca
              call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T14:30:00Z", first_meal_in: "2026-08-10T15:00:00Z", wrap_time: "2026-08-10T19:00:00Z", scheduled_hours: 10 }
              as: ProductionAccountant
              captures: { tc: $.data.id }
          trigger:
            - call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
          assert:
            - "Timecard.${tc}.worked_minutes == 630 (660 elapsed - 30 meal)"
            - "Timecard.${tc}.overtime_minutes == 150 (630 - 480)"
            - "Timecard.${tc}.day_gross_cents == 146875 (round_half_up(480/60*12500) + round_half_up(150/60*12500*1.5) = 100000 + 46875)"
            - "Timecard.${tc}.final_penalty_cents == 2500 (one MEAL unit)"
      - name: garnishment_waterfall_per_order_rounding
        grounds:
          - calculations.garnishment_waterfall
          - entities.PayLine.fields.garnished_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding with pinned order: each order's request is rounded
          half-up BEFORE allocation against the remaining cap (O1 request 26887.4 rounds
          to 26887, not 26888); rounding per line then summing would drift by cents.
        test_recipe:
          setup:
            - "standard fixture, engagement ACTIVE (T1), timecard TC-A approved (line gross will be 149375)"
            - "garnishment O1: CHILD_SUPPORT priority 1, pct_of_disposable 0.20; O2: CREDITOR_JUDGMENT priority 2, fixed 5000"
            - "batch cutoff 2026-08-31 closes over the approved timecard"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - &c_tcaapp
              call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
            - &c_garn1
              call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf}", creditor_name: "County CSA", order_type: "CHILD_SUPPORT", priority_rank: 1, pct_of_disposable: 0.20 }
              as: PayrollAdmin
              captures: { g1: $.data.id }
            - &c_garn2
              call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf}", creditor_name: "Collections Inc", order_type: "CREDITOR_JUDGMENT", priority_rank: 2, fixed_amount_cents: 5000 }
              as: PayrollAdmin
              captures: { g2: $.data.id }
            - &c_batch
              call: "POST /payroll/pay-batches"
              payload: { period_label: "2026-W33", cutoff_date: "2026-08-31" }
              as: PayrollClerk
              as_user_id: "clerk-1"
              captures: { bat: $.data.id }
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
              captures: { }
            - call: "GET /payroll/pay-lines"
              payload: { pay_batch_id: "${bat}" }
              as: PayrollClerk
              captures: { line_gross: "$.data[0].gross_cents" }
          assert:
            - "PayLine.gross_cents == 149375 (146875 day gross + 2500 CONFIRMED meal penalty)"
            - "PayLine.tax_cents == 14938 (round_half_up(149375 x 0.10) = 14937.5 -> 14938)"
            - "disposable 134437 -> cap round_half_up(134437 x 0.25) == 33609; O1 request round_half_up(134437 x 0.20) == 26887 (26887.4 rounds down); O2 == 5000"
            - "PayLine.garnished_cents == 31887 and PayLine.net_cents == 102550"
            - "PayLine.phw_cents == 23453 (8963 pension + 12697 health + 1793 welfare, each rounded per component)"
      - name: payline_net_evaluation_order_pinned
        grounds:
          - calculations.payline_net_calculation
          - entities.PayLine.fields.net_cents
          - entities.PayLine.fields.phw_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency resolved by pinned evaluation order:
          garnishment cap is computed from disposable (gross - tax), PHW is computed from
          gross and is employer-side, and net == gross - tax - garnished EXCLUDES PHW
          (had PHW reduced net, net would be 79097 instead of 102550).
        test_recipe:
          setup:
            - "identical to garnishment_waterfall_per_order_rounding (single TC-A line, O1+O2 active, batch closed)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_garn1
            - *c_garn2
            - *c_batch
            - &c_close
              call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
          trigger:
            - call: "GET /payroll/pay-lines"
              payload: { pay_batch_id: "${bat}" }
              as: PayrollSupervisor
              captures: { ln_gross: "$.data[0].gross_cents", ln_tax: "$.data[0].tax_cents", ln_garn: "$.data[0].garnished_cents", ln_phw: "$.data[0].phw_cents", ln_net: "$.data[0].net_cents" }
          assert:
            - "PayLine.net_cents == 102550 == gross_cents(149375) - tax_cents(14938) - garnished_cents(31887)"
            - "PayLine.phw_cents == 23453 is NOT subtracted from net_cents (employer-side contribution)"
            - "PayBatch.${bat}.total_gross_cents == 149375 and total_net_cents == 102550 and total_garnished_cents == 31887 and total_phw_cents == 23453"

  - rule_id: non_linear_state_machine
    instances:
      - name: timecard_flag_revise_review_cycle
        grounds:
          - state_machines.Timecard.review_SUBMITTED_to_FLAGGED
          - state_machines.Timecard.review_FLAGGED_to_SUBMITTED
          - state_machines.Timecard.review_SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Timecard carries a cyclic review dimension (SUBMITTED -> FLAGGED -> SUBMITTED
          -> APPROVED) AND a parallel payment dimension (UNBATCHED -> BATCHED -> PAID)
          that evolves independently on the same row: the review cycle never touches
          payment_status, and batch close only sweeps APPROVED+UNBATCHED cards.
        test_recipe:
          setup:
            - "standard fixture, engagement ACTIVE; timecard TC-A submitted (review SUBMITTED, payment UNBATCHED)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
          trigger:
            - call: "POST /payroll/timecards/${tc}/flag"
              payload: { flag_reason: "meal time looks late" }
              as: PayrollClerk
            - call: "POST /payroll/timecards/${tc}/revise"
              payload: { call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T14:30:00Z", first_meal_in: "2026-08-10T15:00:00Z", wrap_time: "2026-08-10T19:00:00Z", scheduled_hours: 10 }
              as: ProductionAccountant
            - call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
          assert:
            - "After flag: review_status == FLAGGED while payment_status stays UNBATCHED"
            - "After revise: review_status == SUBMITTED again (cycle completed) and provisional_penalty_cents recomputed == 2500"
            - "After approve: review_status == APPROVED, payment_status STILL UNBATCHED (independent dimension), final_penalty_cents == 2500, day_gross_cents == 146875"
      - name: residual_dispute_recalculate_cycle
        grounds:
          - state_machines.ResidualObligation.APPROVED_to_DISPUTED
          - state_machines.ResidualObligation.DISPUTED_to_CALCULATED
          - state_machines.ResidualObligation.CALCULATED_to_APPROVED
        distinguishing_aspect: |
          ResidualObligation loops APPROVED -> DISPUTED -> CALCULATED -> APPROVED (a cycle
          on a different entity than Timecard): recalculation after a dispute recomputes
          deterministically from the pinned base_pct/window_sequence, so final_amount_cents
          is stable at 900000 across the loop.
        test_recipe:
          setup:
            - "standard fixture; residual SYNDICATION 2027-01-05..2027-06-30, receipts 20000000, calculated and approved"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_resid
            - &c_rescalc
              call: "POST /payroll/residual-obligations/${res}/calculate"
              payload: {}
              as: PayrollClerk
            - &c_resapp
              call: "POST /payroll/residual-obligations/${res}/approve"
              payload: {}
              as: PayrollSupervisor
          trigger:
            - call: "POST /payroll/residual-obligations/${res}/dispute"
              payload: { dispute_reason: "receipts understated for window" }
              as: UnionAuditor
            - call: "POST /payroll/residual-obligations/${res}/calculate"
              payload: {}
              as: PayrollClerk
            - call: "POST /payroll/residual-obligations/${res}/approve"
              payload: {}
              as: PayrollSupervisor
          assert:
            - "After dispute: status == DISPUTED"
            - "After re-calculate: status == CALCULATED and final_amount_cents == 900000 (identical to the first pass — pinned base_pct 0.045, window_sequence 1)"
            - "After re-approve: status == APPROVED and provisional_amount_cents still == 4500"

  - rule_id: transitive_cascade
    instances:
      - name: batch_disburse_four_link_cascade
        grounds:
          - state_machines.PayBatch.APPROVED_to_DISBURSED
          - state_machines.Timecard.payment_BATCHED_to_PAID
          - calculations.performer_ytd_reconciliation
          - entities.Engagement.fields.ytd_paid_cents
          - entities.Performer.fields.ytd_gross_cents
        distinguishing_aspect: |
          Depth-4 chain from POST /pay-batches/{id}/disburse: batch flips each PayLine
          UNPAID -> PAID; each PayLine flip mutates its source Timecard BATCHED -> PAID;
          each timecard flip recomputes Engagement.ytd_paid_cents; each engagement
          recompute rolls into Performer.ytd_gross_cents / ytd_garnished_cents and the
          GarnishmentOrder.total_withheld_cents accumulators.
        test_recipe:
          setup:
            - "standard fixture; TC-A approved; garnishments O1 (0.20) and O2 (5000) ACTIVE; batch closed and approved by a different user (SoD)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_garn1
            - *c_garn2
            - *c_batch
            - *c_close
            - &c_batapp
              call: "POST /payroll/pay-batches/${bat}/approve"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/disburse"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
          assert:
            - "PayBatch.${bat}.status == DISBURSED"
            - "The PayLine status == PAID (link 1: batch -> line)"
            - "Timecard.${tc}.payment_status == PAID (link 2: line -> source)"
            - "Engagement.${eng}.ytd_paid_cents == 102550 (link 3: source -> engagement aggregate)"
            - "Performer.${perf}.ytd_gross_cents == 149375 and ytd_garnished_cents == 31887 (link 4: engagement -> performer)"
            - "GarnishmentOrder.${g1}.total_withheld_cents == 26887 and GarnishmentOrder.${g2}.total_withheld_cents == 5000"
      - name: grievance_resolve_adjustment_two_link_cascade
        grounds:
          - state_machines.GrievanceCase.UNDER_REVIEW_to_RESOLVED
          - entities.PayLine.fields.source_type
          - entities.Engagement.fields.accrued_adjustment_cents
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (grievance resolve, not batch disburse):
          resolve with award 10000 creates a GRIEVANCE_ADJUSTMENT PayLine in the OPEN
          batch (link 1), and that line creation recomputes
          Engagement.accrued_adjustment_cents to 10000 (link 2).
        test_recipe:
          setup:
            - "standard fixture, engagement ACTIVE; an OPEN pay batch exists (not yet closed)"
            - "grievance FILED on the engagement, responded (UNDER_REVIEW)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_batch
            - &c_griev
              call: "POST /payroll/grievance-cases"
              payload: { engagement_id: "${eng}", category: "UNDERPAYMENT", claimed_amount_cents: 10000, description: "OT underpaid for 2026-08-10" }
              as: UnionAuditor
              as_user_id: "aud-1"
              captures: { grv: $.data.id }
            - &c_grievresp
              call: "POST /payroll/grievance-cases/${grv}/respond"
              payload: { response_note: "reviewing timecard audit" }
              as: PayrollClerk
          trigger:
            - call: "POST /payroll/grievance-cases/${grv}/resolve"
              payload: { awarded_amount_cents: 10000 }
              as: PayrollSupervisor
          assert:
            - "GrievanceCase.${grv}.status == RESOLVED and awarded_amount_cents == 10000"
            - "GET /payroll/pay-lines?pay_batch_id=${bat} shows exactly one line with source_type == GRIEVANCE_ADJUSTMENT, source_id == ${grv}, gross_cents == 10000, tax_cents == 1000 (performer residency CA 0.10), garnished_cents == 0 (exempt), phw_cents == 1570, net_cents == 9000, status UNPAID (link 1)"
            - "Engagement.${eng}.accrued_adjustment_cents == 10000 (link 2, caused by the line creation)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: batch_close_state_error_beats_empty_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=25]
          - errors[ERR_BATCH_INVALID_STATE]
          - errors[ERR_BATCH_EMPTY]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a second close on an already-CLOSED
          batch ALSO has an empty sweep set (its only timecard is already BATCHED), yet
          the response must be ERR_BATCH_INVALID_STATE (priority 4), never ERR_BATCH_EMPTY
          (priority 25).
        test_recipe:
          setup:
            - "standard fixture; TC-A approved; batch created and closed once (sweep consumed the only eligible timecard)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_batch
            - *c_close
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
              captures: { err: $.data.error_id }
          assert:
            - "Second close returns HTTP 409 with error_id == ERR_BATCH_INVALID_STATE"
            - "error_id != ERR_BATCH_EMPTY even though the sweep set is empty (state check fires first)"
      - name: residual_window_temporal_error_beats_overlap_constraint
        grounds:
          - validations[priority=15]
          - validations[priority=18]
          - errors[ERR_INVALID_TEMPORAL]
          - errors[ERR_RESIDUAL_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint (different pair than the
          state/fiscal instance): a residual whose window_start > window_end ALSO overlaps
          an existing window for the same engagement+market, yet the response must be
          ERR_INVALID_TEMPORAL (priority 15), never ERR_RESIDUAL_WINDOW_OVERLAP (18).
        test_recipe:
          setup:
            - "standard fixture; one residual SYNDICATION 2027-06-01..2027-12-31 already exists"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - call: "POST /payroll/residual-obligations"
              payload: { engagement_id: "${eng}", reuse_market: "SYNDICATION", window_start: "2027-06-01", window_end: "2027-12-31", reported_gross_receipts_cents: 5000000 }
              as: ProductionAccountant
          trigger:
            - call: "POST /payroll/residual-obligations"
              payload: { engagement_id: "${eng}", reuse_market: "SYNDICATION", window_start: "2027-12-01", window_end: "2027-06-01", reported_gross_receipts_cents: 1000000 }
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP 422 with error_id == ERR_INVALID_TEMPORAL (window_start 2027-12-01 > window_end 2027-06-01)"
            - "error_id != ERR_RESIDUAL_WINDOW_OVERLAP even though [2027-12-01, 2027-06-01] intersects the existing window under the closed-interval test"

  - rule_id: boundary_precision_check
    instances:
      - name: overtime_threshold_exact_minute_boundary
        grounds:
          - calculations.daily_gross_calculation
          - entities.Timecard.fields.overtime_minutes
        distinguishing_aspect: |
          Metric = worked minutes on POST /timecards + approve: exactly at the 480-minute
          threshold overtime_minutes == 0 and day_gross_cents == 100000 (boundary itself
          is NOT overtime); one minute more (481) yields overtime_minutes == 1 and
          day_gross_cents == 100313 (the 312.5-cent OT component rounds half-up to 313).
        test_recipe:
          setup:
            - "standard fixture, engagement ACTIVE (T1)"
            - "two timecards on different work_dates: 480 worked minutes vs 481 worked minutes"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T12:00:00Z", first_meal_in: "2026-08-10T12:30:00Z", wrap_time: "2026-08-10T16:30:00Z", scheduled_hours: 8 }
              as: ProductionAccountant
              captures: { tc480: $.data.id }
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-11", jurisdiction_code: "CA", call_time: "2026-08-11T08:00:00Z", first_meal_out: "2026-08-11T12:00:00Z", first_meal_in: "2026-08-11T12:30:00Z", wrap_time: "2026-08-11T16:31:00Z", scheduled_hours: 8 }
              as: ProductionAccountant
              captures: { tc481: $.data.id }
          trigger:
            - call: "POST /payroll/timecards/${tc480}/approve"
              payload: {}
              as: PayrollClerk
            - call: "POST /payroll/timecards/${tc481}/approve"
              payload: {}
              as: PayrollClerk
          assert:
            - "Timecard.${tc480}.worked_minutes == 480 and overtime_minutes == 0 and day_gross_cents == 100000"
            - "Timecard.${tc481}.worked_minutes == 481 and overtime_minutes == 1 and day_gross_cents == 100313"
            - "Neither timecard accrues penalties: final_penalty_cents == 0 on both (meal delay 240 <= 360; rest 30; turnaround gap 15.5h >= 10h)"
      - name: garnishment_cap_exact_cent_clamp
        grounds:
          - calculations.garnishment_waterfall
          - validations[priority=25]
        distinguishing_aspect: |
          Metric = cents against the 25%-of-disposable cap, reached via POST
          /pay-batches/{id}/close (a different metric and endpoint than the overtime
          instance): a fixed request of exactly the remaining cap (6722) allocates in
          full — garnished == cap == 33609 — while a request one cent higher (6723)
          clamps to 6722 with identical results.
        test_recipe:
          setup:
            - "standard fixture; TWO performers each with an ACTIVE T1 engagement and an approved TC-A timecard (line gross 149375, tax 14938, disposable 134437, cap 33609)"
            - "performer 1: O1 20% (allocates 26887, remaining 6722) + O2 fixed 6722 (== remaining exactly)"
            - "performer 2: O1' 20% + O2' fixed 6723 (remaining + 1 cent)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf}", creditor_name: "County CSA", order_type: "CHILD_SUPPORT", priority_rank: 1, pct_of_disposable: 0.20 }
              as: PayrollAdmin
            - call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf}", creditor_name: "Exact Creditor", order_type: "CREDITOR_JUDGMENT", priority_rank: 2, fixed_amount_cents: 6722 }
              as: PayrollAdmin
            - call: "POST /payroll/performers"
              payload: { legal_name: "Jordan Star", primary_union_code: "SAG_AFTRA", tax_residency_state: "CA" }
              as: PayrollAdmin
              captures: { perf2: $.data.id }
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf2}", tier_code: "T1", payee_type: "DIRECT", weekly_guarantee_cents: 500000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11" }
              as: ProductionAccountant
              captures: { eng2: $.data.id }
            - call: "POST /payroll/engagements/${eng2}/submit"
              payload: {}
              as: ProductionAccountant
            - call: "POST /payroll/engagements/${eng2}/approve"
              payload: {}
              as: PayrollSupervisor
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng2}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T14:30:00Z", first_meal_in: "2026-08-10T15:00:00Z", wrap_time: "2026-08-10T19:00:00Z", scheduled_hours: 10 }
              as: ProductionAccountant
              captures: { tc2: $.data.id }
            - call: "POST /payroll/timecards/${tc2}/approve"
              payload: {}
              as: PayrollClerk
            - call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf2}", creditor_name: "County CSA", order_type: "CHILD_SUPPORT", priority_rank: 1, pct_of_disposable: 0.20 }
              as: PayrollAdmin
            - call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf2}", creditor_name: "Overask Creditor", order_type: "CREDITOR_JUDGMENT", priority_rank: 2, fixed_amount_cents: 6723 }
              as: PayrollAdmin
            - *c_batch
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
          assert:
            - "Performer 1 line (GET /pay-lines?engagement_id=${eng}): garnished_cents == 33609 (exactly the cap; O2's 6722 fits exactly), net_cents == 100828"
            - "Performer 2 line (GET /pay-lines?engagement_id=${eng2}): garnished_cents == 33609 (O2' clamped from 6723 to 6722), net_cents == 100828"
            - "PayBatch.${bat}.total_garnished_cents == 67218 and total_gross_cents == 298750"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: timecard_create_requires_engagement_active
        grounds:
          - validations[priority=12]
          - state_machines.Engagement
        distinguishing_aspect: |
          Entity pair Timecard -> Engagement: timecard creation is gated on the
          ENGAGEMENT's status == ACTIVE; while the engagement sits in DRAFT the same
          well-formed timecard payload is rejected with ERR_ENGAGEMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "standard fixture but the engagement is left in DRAFT (never submitted/approved)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
          trigger:
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T13:30:00Z", first_meal_in: "2026-08-10T14:00:00Z", wrap_time: "2026-08-10T17:00:00Z", scheduled_hours: 9 }
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_ENGAGEMENT_NOT_ACTIVE"
            - "GET /payroll/timecards?engagement_id=${eng} returns zero rows (nothing persisted)"
      - name: production_wrap_blocked_by_open_engagement
        grounds:
          - validations[priority=14]
          - state_machines.Production.SHOOTING_to_WRAPPED
        distinguishing_aspect: |
          Entity pair Production -> Engagement (different pair than Timecard ->
          Engagement): advancing a SHOOTING production to WRAPPED is rejected while any
          of its engagements is PENDING_APPROVAL or AMENDMENT_PENDING, forcing wrap
          order (mid-flight engagements must be approved or rejected first).
        test_recipe:
          setup:
            - "standard fixture with the engagement submitted but NOT yet approved (PENDING_APPROVAL)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
          trigger:
            - call: "POST /payroll/productions/${prod}/advance"
              payload: {}
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_PRODUCTION_HAS_OPEN_ENGAGEMENTS"
            - "Production.${prod}.status remains SHOOTING"
            - "Engagement.${eng}.status remains PENDING_APPROVAL (no cascade fired on rejection)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_ratify_half_open_window_adjacency
        grounds:
          - validations[priority=16]
          - state_machines.UnionAgreement.DRAFT_to_RATIFIED
        distinguishing_aspect: |
          Resource = union agreement coverage calendar, HALF-OPEN semantics
          [effective_from, effective_to): a successor whose effective_from equals the
          incumbent's effective_to (2026-06-30) ratifies cleanly, while one starting a
          day earlier (2026-06-29) collides with ERR_AGREEMENT_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "agreement A SAG_AFTRA [2026-01-01, 2026-06-30) created and ratified"
            - "agreement B SAG_AFTRA [2026-06-30, 2027-01-01) created (adjacent, touch at boundary)"
            - "agreement C SAG_AFTRA [2026-06-29, 2027-01-01) created (overlaps both A and B)"
          setup_api_calls:
            - call: "POST /payroll/union-agreements"
              payload: { union_code: "SAG_AFTRA", name: "A", effective_from: "2026-01-01", effective_to: "2026-06-30", rate_tiers: [{ tier_code: "T1", category: "PRINCIPAL", day_rate_cents: 100000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }], meal_penalty_cents: 2500, rest_penalty_cents: 1000, turnaround_min_hours: 10, phw_pension_pct: 0.06, phw_health_pct: 0.085, phw_welfare_pct: 0.012, residual_base_pct_by_market: { SYNDICATION: 0.045 } }
              as: PayrollAdmin
              captures: { agA: $.data.id }
            - call: "POST /payroll/union-agreements/${agA}/ratify"
              payload: {}
              as: PayrollAdmin
            - call: "POST /payroll/union-agreements"
              payload: { union_code: "SAG_AFTRA", name: "B", effective_from: "2026-06-30", effective_to: "2027-01-01", rate_tiers: [{ tier_code: "T1", category: "PRINCIPAL", day_rate_cents: 100000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }], meal_penalty_cents: 2500, rest_penalty_cents: 1000, turnaround_min_hours: 10, phw_pension_pct: 0.06, phw_health_pct: 0.085, phw_welfare_pct: 0.012, residual_base_pct_by_market: { SYNDICATION: 0.045 } }
              as: PayrollAdmin
              captures: { agB: $.data.id }
            - call: "POST /payroll/union-agreements"
              payload: { union_code: "SAG_AFTRA", name: "C", effective_from: "2026-06-29", effective_to: "2027-01-01", rate_tiers: [{ tier_code: "T1", category: "PRINCIPAL", day_rate_cents: 100000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }], meal_penalty_cents: 2500, rest_penalty_cents: 1000, turnaround_min_hours: 10, phw_pension_pct: 0.06, phw_health_pct: 0.085, phw_welfare_pct: 0.012, residual_base_pct_by_market: { SYNDICATION: 0.045 } }
              as: PayrollAdmin
              captures: { agC: $.data.id }
          trigger:
            - call: "POST /payroll/union-agreements/${agB}/ratify"
              payload: {}
              as: PayrollAdmin
              captures: { bstat: $.data.status }
            - call: "POST /payroll/union-agreements/${agC}/ratify"
              payload: {}
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "B ratifies: HTTP 200 and status == RATIFIED (boundary touch at 2026-06-30 is adjacency, not overlap, under half-open semantics)"
            - "C ratify is rejected: HTTP 409 error_id == ERR_AGREEMENT_WINDOW_OVERLAP ([2026-06-29, ...) intersects both A and B)"
      - name: engagement_submit_closed_interval_double_booking
        grounds:
          - validations[priority=17]
          - state_machines.Engagement.DRAFT_to_PENDING_APPROVAL
        distinguishing_aspect: |
          Resource = performer availability, CLOSED-interval semantics (a different
          resource and different interval arithmetic than the agreement calendar):
          engagement E2 [2026-09-11, 2026-10-09] for the same performer conflicts with
          ACTIVE E1 [2026-08-03, 2026-09-11] because they SHARE the boundary date
          2026-09-11 — adjacency itself is a conflict here.
        test_recipe:
          setup:
            - "standard fixture with E1 ACTIVE on window 2026-08-03..2026-09-11"
            - "E2 for the same performer created in DRAFT with window 2026-09-11..2026-10-09"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T1", payee_type: "DIRECT", weekly_guarantee_cents: 500000, guaranteed_days: 15, start_date: "2026-09-11", end_date: "2026-10-09" }
              as: ProductionAccountant
              captures: { eng2: $.data.id }
          trigger:
            - call: "POST /payroll/engagements/${eng2}/submit"
              payload: {}
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_PERFORMER_DOUBLE_BOOKED (shared boundary date 2026-09-11 conflicts under closed-interval semantics)"
            - "Engagement.${eng2}.status remains DRAFT"

  - rule_id: compensating_invariant
    instances:
      - name: batch_close_recall_reclose_totals_conserved
        grounds:
          - state_machines.PayBatch.OPEN_to_CLOSED
          - state_machines.PayBatch.APPROVED_to_OPEN
          - entities.PayBatch.fields.total_gross_cents
        distinguishing_aspect: |
          Conserved quantity = batch aggregate integrity: total_gross_cents must equal
          the sum of member PayLine.gross_cents after close, after recall (both zero /
          zero lines), and after an identical re-close — the forward action (close)
          paired with its compensating action (recall) leaves zero drift in the totals.
        test_recipe:
          setup:
            - "standard fixture; TC-A approved; no garnishments; batch created (OPEN)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_batch
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
            - call: "POST /payroll/pay-batches/${bat}/approve"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
            - call: "POST /payroll/pay-batches/${bat}/recall"
              payload: {}
              as: PayrollSupervisor
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
          assert:
            - "First close: total_gross_cents == 149375, total_tax_cents == 14938, total_garnished_cents == 0, total_phw_cents == 23453, total_net_cents == 134437; sum over GET /pay-lines?pay_batch_id=${bat} equals each total"
            - "After recall: status == OPEN, all five totals == 0, GET /pay-lines?pay_batch_id=${bat} returns zero rows, Timecard.${tc}.payment_status == UNBATCHED (compensation complete)"
            - "Second close reproduces IDENTICAL totals (149375 / 14938 / 0 / 23453 / 134437) — close+recall+close conserves the batch totals invariant"
      - name: garnishment_release_restores_net_identity
        grounds:
          - calculations.garnishment_waterfall
          - state_machines.GarnishmentOrder.ACTIVE_to_RELEASED
          - entities.PayLine.fields.net_cents
        distinguishing_aspect: |
          Conserved quantity = the per-line identity net == gross - tax - garnished
          (different quantity than batch totals): releasing O2 between two closes moves
          the line's net by exactly O2's prior allocation (5000 cents) — garnished drops
          31887 -> 26887 and net rises 102550 -> 107550, identity intact on both sides.
        test_recipe:
          setup:
            - "standard fixture; TC-A approved; O1 (20%) and O2 (fixed 5000) ACTIVE; batch created"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - *c_garn1
            - *c_garn2
            - *c_batch
          trigger:
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
            - call: "POST /payroll/pay-batches/${bat}/approve"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
            - call: "POST /payroll/pay-batches/${bat}/recall"
              payload: {}
              as: PayrollSupervisor
            - call: "POST /payroll/garnishment-orders/${g2}/release"
              payload: {}
              as: PayrollAdmin
            - call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
          assert:
            - "First close: line garnished_cents == 31887, net_cents == 102550 (149375 - 14938 - 31887)"
            - "After release: GarnishmentOrder.${g2}.status == RELEASED"
            - "Second close: line garnished_cents == 26887 (O1 only), net_cents == 107550 — the delta vs the first close is exactly 5000, O2's released allocation"
            - "Invariant holds on both closes: net_cents == gross_cents - tax_cents - garnished_cents"
