            - { call: "POST /credentialing/nurses", payload: { full_name: "Lic B", email: "lic.b@x.com", primary_state_of_residence: "TX", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_b: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_a}", state_code: "AZ", license_number: "RN-777", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_a: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_b}", state_code: "AZ", license_number: "RN-777", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_b}", state_code: "TX", license_number: "RN-777", license_class: "RN", multistate_flag: false, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_b: "$.data.id" } }
