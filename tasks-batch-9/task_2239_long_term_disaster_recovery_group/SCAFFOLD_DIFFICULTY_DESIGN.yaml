  - rule_id: boundary_precision_check
    instances:
      - name: dob_exposure_zero_clears_and_one_cent_over_flags
        grounds:
          - "calculations.dob_exposure_check"
          - "calculations.dob_exposure_check.constants.DOB_FLAG_THRESHOLD_CENTS"
          - "calculations.dob_exposure_check.constants.DOB_COUNTED_DOCUMENTATION_STATUSES"
          - "state_machines.Disbursement.transitions.REQUESTED_to_DOB_CLEARED"
          - "state_machines.Disbursement.transitions.REQUESTED_to_DOB_FLAGGED"
        distinguishing_aspect: "The DOB pool is 500000 against a CONTENTS_REPLACEMENT bucket need of 1500000, leaving exactly 1000000 of headroom. A request of exactly 1000000 must clear with dob_exposure_cents 0, and a request of 1000001 must flag with dob_exposure_cents 1. An implementation using a strict `>` on the wrong side flags the exact-fit request; one using `>=` on the threshold clears the one-cent overrun. Also load-bearing: the DISPUTED 100000 record IS counted in the DOB pool (DOB_COUNTED_DOCUMENTATION_STATUSES includes DISPUTED) even though it is excluded from unmet-need offsets, so an implementation that reuses the offset filter computes a pool of 400000 and clears both requests."
        test_recipe:
          setup:
            - "Case C15: CONTENTS damage verified 1500000 -> CONTENTS_REPLACEMENT need 1500000."
            - "Two CONTENTS_REPLACEMENT assistance records: 400000 DOCUMENTED and 100000 DISPUTED, so the DOB pool is 500000 while prior_disbursed_cents is 0."
            - "No award chain is needed because POST /disbursements gates only on FK existence and OCC."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Sandoval Household", primary_contact_phone: "555-0115", household_size: 4, income_band: "VLI", head_of_household_age: 52, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { s15: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${s15}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { c15: "$.data.id" }
            - call: POST /recovery-cases/{id}/damage-items
              payload: { category: "CONTENTS", item_description: "All household contents", documented_cost_cents: 1500000, photo_count: 11, is_habitability_critical: false }
              as: CaseManager
              as_user_id: u_cm_1
              captures: { d15: "$.data.id" }
            - call: POST /damage-items/{id}/verification
              payload: { verification_status: "VERIFIED", verified_cost_cents: 1500000 }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /recovery-cases/{id}/assistance-records
              payload: { source_type: "NONPROFIT_GRANT", purpose_code: "CONTENTS_REPLACEMENT", awarded_cents: 400000, received_on: "2026-08-02", documentation_status: "DOCUMENTED" }
              as: CaseManager
              as_user_id: u_cm_1
            - call: POST /recovery-cases/{id}/assistance-records
              payload: { source_type: "INSURANCE_SETTLEMENT", purpose_code: "CONTENTS_REPLACEMENT", awarded_cents: 100000, received_on: "2026-08-04", documentation_status: "DISPUTED" }
              as: CaseManager
              as_user_id: u_cm_1
            - call: GET /recovery-cases/{id}
              payload: {}
              as: DisbursementOfficer
              as_user_id: u_do_1
              captures: { cv15: "$.data.version" }
          trigger:
            - call: POST /disbursements
              payload: { case_id: "${c15}", purpose_code: "CONTENTS_REPLACEMENT", requested_cents: 1000000, payee_name: "Valley Furniture Co", expected_case_version: "${cv15}" }
              as: DisbursementOfficer
              as_user_id: u_do_1
              captures: { db15a: "$.data.id" }
            - call: GET /recovery-cases/{id}
              payload: {}
              as: DisbursementOfficer
              as_user_id: u_do_1
              captures: { cv15b: "$.data.version" }
            - call: POST /disbursements
              payload: { case_id: "${c15}", purpose_code: "CONTENTS_REPLACEMENT", requested_cents: 1000001, payee_name: "Valley Furniture Co", expected_case_version: "${cv15b}" }
              as: DisbursementOfficer
              as_user_id: u_do_1
              captures: { db15b: "$.data.id" }
            - call: GET /recovery-cases/{id}/dob-report
              payload: { purpose_code: "CONTENTS_REPLACEMENT" }
              as: DisbursementOfficer
              as_user_id: u_do_1
          assert:
            - "First disbursement (1000000, exactly at the headroom): status DOB_CLEARED, dob_pool_cents 500000, dob_exposure_cents 0."
            - "Second disbursement (1000001, one cent past it): status DOB_FLAGGED, dob_pool_cents 500000, dob_exposure_cents 1."
            - "The dob-report for CONTENTS_REPLACEMENT confirms dob_pool_cents 500000 and bucket_need_cents 1500000, with the DISPUTED 100000 included in the pool."
      - name: skill_fit_exactly_at_minimum_accepted_and_one_day_shorter_rejected
        grounds:
          - "calculations.volunteer_skill_fit_score.constants.MIN_FIT_BPS"
          - "calculations.volunteer_skill_fit_score.constants.VOLUNTEER_HOURS_PER_DAY"
          - "validations[priority 34]"
          - "entities.VolunteerDeployment.fields.skill_fit_score_bps"
          - "endpoints[POST /volunteer-deployments]"
        distinguishing_aspect: "A 5-day window scores exactly 6000 bps (weighted_covered 810 / weighted_required 1350) and must be ACCEPTED because the gate is `>=`. A 4-day window scores 10000*696/1350 = 5155.55... which round_half_up takes to 5156 and must be REJECTED. An implementation using a strict `>` rejects the exact-boundary deployment; one that truncates instead of rounding half up reports 5155 rather than 5156. The 4-day window starts on 2026-09-20, comfortably past the first deployment's departure plus DEPLOYMENT_TURNAROUND_DAYS, so the turnaround rule cannot be confused for the cause of the rejection."
