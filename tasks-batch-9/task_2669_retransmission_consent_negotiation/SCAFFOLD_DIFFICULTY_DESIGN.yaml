  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: agreement_execution_guarded_on_affiliation_agreement_state
        grounds:
          - validations[priority=26]
          - state_machines.AffiliationAgreement.ACTIVE_to_EXPIRED
          - state_machines.CarriageAgreement.EXEC:PENDING_EXECUTION_to_EXEC:EXECUTED
          - entities.AffiliationAgreement.fields.status
          - entities.CarriageAgreement.fields.execution_status
          - endpoints[POST /retrans/expiration-sweep]
        distinguishing_aspect: |
          Entity pair (CarriageAgreement, AffiliationAgreement): the guard sits on a THIRD entity that
          is not the operand's parent and not reachable from the request path. The carriage agreement
          is network-approved and otherwise perfectly executable, and nothing about the agreement
          itself changes; only the station's affiliation ageing out of ACTIVE flips execute from
          allowed to refused. The distinguishing move is that the offer was legally submitted while
          the affiliation was ACTIVE, so the block appears strictly between submission and execution.
        test_recipe:
          setup:
            - "One CBS station whose affiliation term ends 2026-09-01, ACTIVE at the 2026-08-01 clock default"
            - "One CABLE distributor and a filed election with an OPEN negotiation"
            - "A 250-cent station offer accepted into a PENDING_EXECUTION agreement, network-approved"
            - "Clock moved to 2026-09-02 and an expiration sweep run, expiring the affiliation"
          setup_api_calls:
            - call: "POST /retrans/stations"
              payload: { call_sign: "WXYZ", market_code: "SEA", dma_rank: 12, market_tv_households: 1800000, network_affiliation: "CBS" }
              as: CarriageAdmin
              as_user_id: "admin-1"
              captures: { st_id: "$.data.id" }
