  - { method: GET, path: "/api/promo-programs", description: "list programs; filters account_id?, product_id?, status?", roles: [BrandAdmin, DistributorRep, RetailManager], code: 200, input: ["account_id?", "product_id?", "status?"], output: "PromoProgram[]", side_effects: [] }
