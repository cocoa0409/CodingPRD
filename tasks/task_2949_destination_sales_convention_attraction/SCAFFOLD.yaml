  - method: POST
    path: "/servicing-orders"
    description: "Opens a housing, transportation or volunteer servicing order for a DEFINITE opportunity."
    roles: [ServicesManager]
    code: 201
    input: [opportunity_id, category, requested_units, window_start, window_end]
    output: ServicingOrder
    side_effects: ["status set to REQUESTED with assigned_units and delivered_units 0"]

  - method: GET
    path: "/servicing-orders/{id}"
    description: "Reads one servicing order."
    roles: [BureauAdmin, ServicesManager, SalesManager]
    code: 200
    input: []
    output: ServicingOrder
    side_effects: []

  - method: GET
    path: "/opportunities/{id}/servicing-orders"
    description: "Lists the servicing orders of one opportunity (FK reverse-reachability for ServicingOrder.opportunity_id)."
    roles: [BureauAdmin, ServicesManager, SalesManager, BoardAnalyst]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: ServicingOrder[]
    side_effects: []

  - method: POST
    path: "/servicing-orders/{id}/schedule"
    description: "Schedules the order with the units actually assigned."
    roles: [ServicesManager]
    code: 200
    input: [assigned_units]
    output: ServicingOrder
    side_effects: ["status REQUESTED -> SCHEDULED and assigned_units stored"]

  - method: POST
    path: "/servicing-orders/{id}/deliver"
    description: "Marks the order delivered. When it is the last non-terminal servicing order of a DEFINITE opportunity, the opportunity bubbles up to SERVICED."
    roles: [ServicesManager]
    code: 200
    input: [delivered_units]
    output: ServicingOrder
    side_effects: ["status SCHEDULED -> DELIVERED and delivered_units stored", "BUBBLE-UP: when no ServicingOrder of the opportunity remains in REQUESTED or SCHEDULED, Opportunity -> SERVICED, its COMMITTED blocks are RELEASED, attrition is frozen by calculations.attrition_settlement and the fund charge is disbursed"]

  - method: POST
    path: "/servicing-orders/{id}/cancel"
    description: "Cancels a REQUESTED or SCHEDULED servicing order. A DELIVERED order can never be cancelled; if the cancellation leaves no order in REQUESTED or SCHEDULED and at least one sibling is DELIVERED, the opportunity bubbles up to SERVICED."
    roles: [ServicesManager]
    code: 200
    input: []
    output: ServicingOrder
    side_effects: ["status REQUESTED or SCHEDULED -> CANCELLED", "CONDITIONAL BUBBLE-UP: when no ServicingOrder of the opportunity remains in REQUESTED or SCHEDULED and at least one is DELIVERED, the full SERVICED cascade of POST /servicing-orders/{id}/deliver fires"]

  # --- board reporting -------------------------------------------------------
  - method: POST
