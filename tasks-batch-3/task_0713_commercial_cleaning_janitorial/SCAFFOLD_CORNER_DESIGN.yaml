      - name: mark_ready_underallocated_returns_hours_underallocated
        claim_type: Precondition Enforcement
        grounds: [state_machines.StartupPlan.CREWED_to_READY, "errors[ERR_HOURS_UNDERALLOCATED]"]
        distinguishing_aspect: "mark-ready with allocated_hours (4.00) < planned_monthly_hours (187.62) returns ERR_HOURS_UNDERALLOCATED."
