              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "VERS01", flight_id: "${fl_id}", fare_family_id: "${f_bare_id}", distribution_channel_id: "${ch_direct_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/disclosure"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
              captures: { fp: $.data.disclosed_fee_fingerprint }
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "POST /bookings/${bk_id}/disclosure-ack"
              payload: { acknowledged_fee_fingerprint: "${fp}" }
              as: ChannelPartner
              as_user_id: "${ch_direct_id}"
            - call: "GET /bookings/${bk_id}"
              payload: {}
              as: ChannelPartner
