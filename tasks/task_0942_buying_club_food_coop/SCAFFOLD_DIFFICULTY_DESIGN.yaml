    - calculations.credit_consumption_fifo
    - entities.CreditGrant.fields.expires_at
    - state_machines.CreditGrant.ACTIVE_to_PARTIALLY_CONSUMED
    - entities.MemberOrder.fields.credit_applied_cents
    distinguishing_aspect: 'This instance is the dual variant on the CreditGrant domain: Mara''s older grant expires later than her newer one, so soonest_expiry_first draws 4000 from the newer 5000-cent grant and leaves the older 3000-cent grant untouched, while oldest_grant_first would consume the older grant entirely.'
