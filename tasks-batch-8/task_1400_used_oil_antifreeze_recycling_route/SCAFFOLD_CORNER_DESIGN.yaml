            - "After second pickup (40): Route.loaded_gallons == 100 (60+40, derived field reconciled)"

      - name: idempotency_client_request_id_per_stop
        claim_type: idempotency
        grounds:
          - complexity_profile.complexity_layers
          - entities.PickupTicket.fields.client_request_id
        distinguishing_aspect: "Same client_request_id may be REUSED across different RouteStops (scope is per-stop), but NOT within the same RouteStop."
        excluded_because:
          difficulty_instance: boundary_precision_check / density_zone_minimum_at_exact_threshold
          rationale: "Idempotency is already exercised via pickup_idempotency_same_client_request_id (Section 5). This stub exists to mark that we also cover the cross-stop reuse case in spirit."

      - name: temporal_windowing_route_stop_windows
        claim_type: temporal_windowing
        grounds:
          - entities.RouteStop.fields.scheduled_window_start
          - entities.RouteStop.fields.scheduled_window_end
        distinguishing_aspect: "Stops have time windows; windows are half-open [start, end) — overlapping windows on the same route are permitted (they are dispatch targets, not exclusive locks). The endpoint pattern does NOT enforce window non-overlap; the route capacity rule does the real gating."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / route_capacity_aggregate_overlap
          rationale: "Temporal window semantics for stops are subsumed by the route-capacity and facility-day-window rules covered in §1.8 rule-8."

      - name: rate_threshold_halogen_violation_count
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.settlement_amount
          - entities.Customer.fields.halogen_violation_count
        distinguishing_aspect: "Surcharge tier thresholds at halogen_violation_count = 2 and 4 are boundary-tested by §1.8 instances (settlement_amount_tiered_surcharge_and_zone_fee) and Section 3 tier tests."
        excluded_because:
          difficulty_instance: combinatorial_formula / settlement_amount_tiered_surcharge_and_zone_fee
          rationale: "Tier boundaries covered in §1.8 combinatorial_formula instance."

