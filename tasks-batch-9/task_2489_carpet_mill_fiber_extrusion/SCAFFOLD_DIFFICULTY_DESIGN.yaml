      - name: credit_admission_inclusive_while_credit_hold_flip_is_also_inclusive
        grounds:
          - calculations.cut_order_credit_reservation
          - calculations.account_credit_ledger
          - state_machines.Account.ACTIVE_to_CREDIT_HOLD
          - validations[priority=30]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
          - entities.Account.fields.credit_limit_cents
        distinguishing_aspect: |
          Two comparisons meet at the same integer: an order whose 513000-cent reservation exactly
          equals the limit is ADMITTED (admission is <=) and simultaneously drives the account into
          CREDIT_HOLD (the hold comparison is >=), while an account one cent lower rejects the very
          same order with 422/ERR_CREDIT_LIMIT_EXCEEDED — an integer-cents boundary, unlike the
          two-decimal shade and peel boundaries.
