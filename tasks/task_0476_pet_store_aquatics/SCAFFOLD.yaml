# =============================================================================
# Pet Store & Aquatics Supply — benchmark seed tables (v1)
# Expert tier (§0.4): 13 entities, 31 endpoints, 26 errors, 4+ calc variants,
# 6 state machines (parallel dimensions + cycles + cascades), flat topology.
# =============================================================================

scenario: |
  Pet Store & Aquatics Supply (Petco style): SKU & livestock
  (fish/reptile/small-animal) inventory, livestock health & quarantine,
  adoption-event partnership, grooming/vaccine-clinic linkage,
  subscription/auto-ship, loyalty & prescription-diet, special order,
  recall management

domain_name: pet-store-aquatics
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity lives at a top-level collection /<collection> + /<collection>/{id}.
  # Parent links are FK body fields; reverse-reachability via ?fk filters on lists.

  state_machine_shape: parallel
  # LivestockBatch carries parallel dimensions (health_state × sale_state).
  # Subscription has cyclic ACTIVE↔PAUSED and HALTED↔ACTIVE recovery loops.
  # Recall fans out a 3-hop cascade across stores.

  relationship_patterns:
    - one_to_many        # Store -> InventoryLot, LivestockBatch, ClinicAppointment
    - many_to_many       # AdoptionEvent <-> LivestockBatch via AdoptionPlacement
    - cross_aggregate    # Recall -> InventoryLot / Subscription across stores

  role_model: peer_roles
  # InventoryManager owns lots/recalls; LivestockKeeper owns batches/quarantine;
  # ClinicVet owns appointments + prescriptions; StoreClerk owns POS/sales;
  # Customer is entity_backed and owns own subscriptions/orders.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Store display name" }
      - { name: state_code, type: string, source: input, description: "US state code, e.g. CA, NY; governs recall jurisdiction scoping" }
      - { name: loyalty_point_value_cents, type: integer, source: input, default: 1, description: "Cents of redeemable value per 1 loyalty point at this store" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Store status. Values: OPEN, CLOSED (CLOSED blocks new sales)" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU; globally unique" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "Catalog category. Values: FOOD, HABITAT, ACCESSORY, MEDICATION" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit in cents; > 0" }
      - { name: is_prescription_diet, type: boolean, source: input, default: false, description: "True when sale requires an ACTIVE Prescription authorization" }
      - { name: loyalty_points_per_unit, type: integer, source: input, default: 0, description: "Loyalty points earned per unit sold; >= 0" }
      - { name: recall_state, type: enum, source: computed, default: "CLEAR", description: "Derived from OPEN Recalls covering this product. Values: CLEAR, RECALLED" }

  - name: InventoryLot
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the stocked product" }
      - { name: lot_code, type: string, source: input, description: "Manufacturer lot code; unique per product_id" }
      - { name: quantity_on_hand, type: integer, source: input, description: "Sellable units physically present; decremented on sale, never below 0" }
      - { name: quantity_reserved, type: integer, source: system, default: 0, description: "Units reserved for pending auto-ship/special-order; <= quantity_on_hand" }
      - { name: received_at, type: datetime, source: input, description: "ISO 8601 receiving timestamp; secondary allocation order key" }
      - { name: expiry_date, type: datetime, source: input, description: "ISO 8601 lot expiry; primary allocation order key (FEFO)" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "Lot status. Values: AVAILABLE, QUARANTINED, DEPLETED" }

  - name: LivestockBatch
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; owning store" }
      - { name: species, type: string, source: input, description: "Species label, e.g. betta, bearded_dragon" }
      - { name: animal_class, type: enum, source: input, description: "Husbandry class. Values: FISH, REPTILE, SMALL_ANIMAL" }
      - { name: head_count, type: integer, source: input, description: "Original number of live animals at intake; > 0" }
      - { name: unit_price_cents, type: integer, source: input, description: "Adoption/sale price per head in cents; > 0" }
      - { name: intake_at, type: datetime, source: input, description: "ISO 8601 intake timestamp; starts the quarantine window" }
      - { name: quarantine_days, type: integer, source: input, description: "Required quarantine duration in days; > 0" }
      - { name: mortality_count, type: integer, source: system, default: 0, description: "Cumulative recorded deaths; <= head_count" }
      - { name: health_state, type: enum, source: system, default: "QUARANTINE", description: "Health dimension (parallel). Values: QUARANTINE, HEALTHY, UNDER_TREATMENT, CONDEMNED" }
      - { name: sale_state, type: enum, source: system, default: "HELD", description: "Sale dimension (parallel, independent). Values: HELD, ON_FLOOR, RESERVED, SOLD_OUT" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique customer email" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: home_store_id, type: string, source: input, description: "FK -> Store.id; default fulfilling store" }
      - { name: loyalty_points, type: integer, source: system, default: 0, description: "Redeemable loyalty point balance; >= 0" }
      - { name: lifetime_spend_cents, type: integer, source: system, default: 0, description: "Cumulative net paid cents across all sales; drives loyalty tier" }
      - { name: loyalty_tier, type: enum, source: computed, default: "BRONZE", description: "Derived from lifetime_spend_cents thresholds. Values: BRONZE, SILVER, GOLD" }

  - name: Prescription
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the prescription-diet product authorized" }
      - { name: issued_by_appointment_id, type: string, source: input, description: "FK -> ClinicAppointment.id; the COMPLETED VET_EXAM appointment that issued it" }
      - { name: max_units_per_order, type: integer, source: input, description: "Cap on prescription-diet units per single sale; > 0" }
      - { name: expires_at, type: datetime, source: input, description: "ISO 8601 expiry; a prescription with expires_at <= current clock is treated as not-honored at sale time even while status == ACTIVE" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Authorization status. Values: ACTIVE, REVOKED (expiry is enforced at sale time against expires_at, not by a status change)" }

  - name: ClinicAppointment
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; clinic location" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; pet owner" }
      - { name: service_type, type: enum, source: input, description: "Service. Values: GROOMING, VACCINE, VET_EXAM" }
      - { name: room, type: string, source: input, description: "Clinic room identifier; resource for overlap checks" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 appointment start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 appointment end (exclusive); must be > start_at" }
      - { name: fee_cents, type: integer, source: input, description: "Service fee in cents; >= 0" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "Appointment status. Values: BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW" }

  - name: Subscription
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; subscriber" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; auto-shipped product" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; fulfilling store" }
      - { name: quantity_per_cycle, type: integer, source: input, description: "Units shipped each cycle; > 0" }
      - { name: cycle_days, type: integer, source: input, description: "Days between shipments; > 0" }
      - { name: discount_pct, type: number, source: input, default: 0.0, description: "Auto-ship base discount fraction 0.0..0.5 applied before loyalty tier discount" }
      - { name: next_ship_at, type: datetime, source: input, description: "ISO 8601 timestamp of next scheduled shipment" }
      - { name: shipments_count, type: integer, source: system, default: 0, description: "Number of successful shipments fulfilled" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Subscription status. Values: ACTIVE, PAUSED, HALTED, CANCELLED" }

  - name: Shipment
    parent: Subscription
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id; parent subscription" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; lot the units were allocated from (last lot drawn)" }
      - { name: units, type: integer, source: system, description: "Units shipped this cycle (= subscription.quantity_per_cycle at run time)" }
      - { name: gross_cents, type: integer, source: system, description: "Pre-discount charge = units * product.unit_price_cents" }
      - { name: net_cents, type: integer, source: system, description: "Charged amount after auto-ship + loyalty discounts, rounded once at end" }
      - { name: status, type: enum, source: system, default: "FULFILLED", description: "Shipment status; append-only record of a fulfilled cycle. Values: FULFILLED" }

  - name: SpecialOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; special-ordered product" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; pickup store" }
      - { name: quantity, type: integer, source: input, description: "Units requested; > 0" }
      - { name: deposit_pct, type: number, source: input, default: 0.25, description: "Deposit fraction 0.0..1.0 charged up-front" }
      - { name: deposit_cents, type: integer, source: computed, description: "Computed up-front deposit, set at request time" }
      - { name: balance_cents, type: integer, source: computed, description: "Remaining balance charged at fulfillment" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "Order status. Values: REQUESTED, ALLOCATED, FULFILLED, CANCELLED" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; recalled product" }
      - { name: lot_code, type: string, source: input, required: false, description: "Optional manufacturer lot_code; when null the recall covers all lots of the product" }
      - { name: severity, type: enum, source: input, description: "Severity. Values: ADVISORY, MANDATORY" }
      - { name: scope_state_code, type: string, source: input, required: false, description: "Optional US state code; when set, only lots in stores of that state_code are frozen" }
      - { name: affected_lot_count, type: integer, source: computed, default: 0, description: "Number of InventoryLots quarantined when this recall was issued" }
      - { name: halted_subscription_count, type: integer, source: computed, default: 0, description: "Number of Subscriptions halted by this recall" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Recall status. Values: OPEN, RESOLVED" }

  - name: AdoptionEvent
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: input, description: "FK -> Store.id; hosting store" }
      - { name: partner_name, type: string, source: input, description: "Partner rescue/shelter name" }
      - { name: event_date, type: datetime, source: input, description: "ISO 8601 event date" }
      - { name: capacity, type: integer, source: input, description: "Maximum head of livestock the event can place; > 0" }
      - { name: placed_head, type: integer, source: system, default: 0, description: "Cumulative head currently placed via PLACED AdoptionPlacements; <= capacity" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Event status. Values: SCHEDULED, OPEN, CLOSED" }

  - name: AdoptionPlacement
    parent: AdoptionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> AdoptionEvent.id; the event" }
      - { name: batch_id, type: string, source: input, description: "FK -> LivestockBatch.id; the placed batch" }
      - { name: head, type: integer, source: input, description: "Head placed from the batch; > 0" }
      - { name: status, type: enum, source: system, default: "PLACED", description: "Placement status. Values: PLACED, RETURNED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: LivestockBatch
    note: "Parallel dimensions: health_state and sale_state evolve independently."
    initial_state: "QUARANTINE (health) × HELD (sale)"
    terminal_states: ["CONDEMNED (health)", "SOLD_OUT (sale)"]
    transitions:
      # ---- health dimension ----
      - from: "health=QUARANTINE"
        to: "health=HEALTHY"
        trigger: "POST /livestock-batches/{batchId}/clear-quarantine"
        actor: LivestockKeeper
        preconditions:
          - "batch.health_state == QUARANTINE (ERR_BATCH_HEALTH_STATE_INVALID)"
          - "current clock >= intake_at + quarantine_days (ERR_QUARANTINE_NOT_ELAPSED)"
          - "mortality_count == 0 (ERR_QUARANTINE_MORTALITY_BLOCK)"
        side_effects:
          - "health_state = HEALTHY"
          - "version += 1"

      - from: "health=QUARANTINE"
        to: "health=UNDER_TREATMENT"
        trigger: "POST /livestock-batches/{batchId}/record-mortality"
        actor: LivestockKeeper
        preconditions:
          - "batch.health_state IN {QUARANTINE, HEALTHY, UNDER_TREATMENT} (ERR_BATCH_HEALTH_STATE_INVALID)"
        side_effects:
          - "mortality_count += deaths (see mortality_condemn_rate)"
          - "if mortality_count / head_count >= MORTALITY_CONDEMN_RATE then health_state = CONDEMNED and sale_state = SOLD_OUT else health_state = UNDER_TREATMENT"
          - "version += 1"

      - from: "health=HEALTHY"
        to: "health=UNDER_TREATMENT"
        trigger: "POST /livestock-batches/{batchId}/record-mortality"
        actor: LivestockKeeper
        preconditions:
          - "batch.health_state IN {QUARANTINE, HEALTHY, UNDER_TREATMENT}"
        side_effects:
          - "mortality_count += deaths"
          - "if mortality_count / head_count >= MORTALITY_CONDEMN_RATE then health_state = CONDEMNED and sale_state = SOLD_OUT"
          - "version += 1"

      - from: "health=UNDER_TREATMENT"
        to: "health=HEALTHY"
        trigger: "POST /livestock-batches/{batchId}/clear-quarantine"
        actor: LivestockKeeper
        note: "Cyclic recovery loop: a treated batch may return to HEALTHY."
        preconditions:
          - "batch.health_state == UNDER_TREATMENT (ERR_BATCH_HEALTH_STATE_INVALID)"
          - "mortality_count / head_count < MORTALITY_CONDEMN_RATE (ERR_QUARANTINE_MORTALITY_BLOCK)"
        side_effects:
          - "health_state = HEALTHY"
          - "version += 1"

      - from: "health=UNDER_TREATMENT"
        to: "health=CONDEMNED"
        trigger: "POST /livestock-batches/{batchId}/condemn"
        actor: LivestockKeeper
        preconditions:
          - "batch.health_state == UNDER_TREATMENT (ERR_BATCH_HEALTH_STATE_INVALID)"
        side_effects:
          - "health_state = CONDEMNED"
          - "sale_state = SOLD_OUT"
          - "version += 1"

      # ---- sale dimension ----
      - from: "sale=HELD"
        to: "sale=ON_FLOOR"
        trigger: "POST /livestock-batches/{batchId}/list-on-floor"
        actor: LivestockKeeper
        preconditions:
          - "batch.sale_state == HELD (ERR_BATCH_SALE_STATE_INVALID)"
          - "batch.health_state == HEALTHY (ERR_BATCH_NOT_HEALTHY)"
        side_effects:
          - "sale_state = ON_FLOOR"
          - "version += 1"

      - from: "sale=ON_FLOOR"
        to: "sale=RESERVED"
        trigger: "POST /adoption-placements"
        actor: LivestockKeeper
        note: "Placing the full live head into an adoption event reserves the batch."
        preconditions:
          - "batch.sale_state == ON_FLOOR (ERR_BATCH_SALE_STATE_INVALID)"
          - "batch.health_state == HEALTHY (ERR_BATCH_NOT_HEALTHY)"
          - "placement.head <= head_count - mortality_count (ERR_INSUFFICIENT_HEAD)"
          - "event.placed_head + placement.head <= event.capacity (ERR_EVENT_CAPACITY_EXCEEDED)"
        side_effects:
          - "if placement.head == head_count - mortality_count then sale_state = RESERVED"
          - "event.placed_head += placement.head (event.version += 1)"
          - "version += 1"

      - from: "sale=RESERVED"
        to: "sale=ON_FLOOR"
        trigger: "POST /adoption-placements/{placementId}/return"
        actor: LivestockKeeper
        note: "Compensation: returning a placement frees the batch back to the floor."
        preconditions:
          - "placement.status == PLACED (ERR_PLACEMENT_NOT_RETURNABLE)"
        side_effects:
          - "placement.status = RETURNED"
          - "event.placed_head -= placement.head (event.version += 1)"
          - "if batch.sale_state == RESERVED then sale_state = ON_FLOOR"
          - "version += 1"

      - from: "sale=ON_FLOOR"
        to: "sale=SOLD_OUT"
        trigger: "POST /livestock-sales"
        actor: StoreClerk
        preconditions:
          - "batch.sale_state == ON_FLOOR (ERR_BATCH_SALE_STATE_INVALID)"
          - "batch.health_state == HEALTHY (ERR_BATCH_NOT_HEALTHY)"
        side_effects:
          - "sale_state = SOLD_OUT"
          - "livestock_sale_total: customer.lifetime_spend_cents += net; customer.loyalty_points += earned; customer.loyalty_tier recomputed"
          - "version += 1"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscriptions/{subId}/pause"
        actor: Customer
        preconditions:
          - "subscription.status == ACTIVE (ERR_SUBSCRIPTION_STATE_INVALID)"
        side_effects:
          - "status = PAUSED"
          - "version += 1"

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscriptions/{subId}/resume"
        actor: Customer
        note: "Cyclic ACTIVE↔PAUSED loop."
        preconditions:
          - "subscription.status == PAUSED (ERR_SUBSCRIPTION_STATE_INVALID)"
          - "product.recall_state == CLEAR (ERR_PRODUCT_RECALLED)"
        side_effects:
          - "status = ACTIVE"
          - "next_ship_at = current clock + cycle_days"
          - "version += 1"

      - from: ACTIVE
        to: HALTED
        trigger: "system: POST /recalls cascade (hop 3)"
        actor: system
        note: "Recall cascade halts every ACTIVE/PAUSED subscription whose product becomes RECALLED and whose store is in recall scope."
        preconditions:
          - "a new OPEN Recall covers subscription.product_id and the subscription's store is in scope"
        side_effects:
          - "status = HALTED"
          - "recall.halted_subscription_count += 1"
          - "version += 1"

      - from: PAUSED
        to: HALTED
        trigger: "system: POST /recalls cascade (hop 3)"
        actor: system
        preconditions:
          - "a new OPEN Recall covers subscription.product_id and the subscription's store is in scope"
        side_effects:
          - "status = HALTED"
          - "recall.halted_subscription_count += 1"
          - "version += 1"

      - from: HALTED
        to: ACTIVE
        trigger: "system: POST /recalls/{recallId}/resolve cascade"
        actor: system
        note: "Compensation: resolving the recall reactivates the subscriptions it halted, only when product.recall_state returns to CLEAR (no other OPEN recall covers it)."
        preconditions:
          - "subscription was HALTED by this recall AND product.recall_state recomputes to CLEAR"
        side_effects:
          - "status = ACTIVE"
          - "next_ship_at = current clock + cycle_days"
          - "version += 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{subId}/cancel"
        actor: Customer
        preconditions:
          - "subscription.status IN {ACTIVE, PAUSED, HALTED} (ERR_SUBSCRIPTION_STATE_INVALID)"
        side_effects:
          - "status = CANCELLED"
          - "version += 1"

      - from: PAUSED
        to: CANCELLED
        trigger: "POST /subscriptions/{subId}/cancel"
        actor: Customer
        preconditions:
          - "subscription.status IN {ACTIVE, PAUSED, HALTED}"
        side_effects:
          - "status = CANCELLED"
          - "version += 1"

      - from: HALTED
        to: CANCELLED
        trigger: "POST /subscriptions/{subId}/cancel"
        actor: Customer
        preconditions:
          - "subscription.status IN {ACTIVE, PAUSED, HALTED}"
        side_effects:
          - "status = CANCELLED"
          - "version += 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{subId}/run-shipment"
        actor: StoreClerk
        note: "Self-loop: fulfilling a due cycle creates a Shipment and advances next_ship_at; OCC-guarded."
        preconditions:
          - "subscription.status == ACTIVE (ERR_SUBSCRIPTION_STATE_INVALID)"
          - "expected_subscription_version == subscription.version (ERR_STALE_VERSION)"
          - "current clock >= next_ship_at (ERR_SHIPMENT_NOT_DUE)"
          - "product.recall_state == CLEAR (ERR_PRODUCT_RECALLED)"
          - "ordered free units across AVAILABLE lots for (store, product) >= quantity_per_cycle (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "create Shipment (status=FULFILLED); allocate units FEFO (inventory_allocation_order); each drawn lot.quantity_on_hand -= n; lot DEPLETED at 0 (lot.version += 1)"
          - "shipments_count += 1; next_ship_at += cycle_days"
          - "auto_ship_charge: customer.lifetime_spend_cents += net_cents; customer.loyalty_points += earned; customer.loyalty_tier recomputed"
          - "increments Subscription.version by 1"

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /special-orders/{orderId}/allocate"
        actor: InventoryManager
        preconditions:
          - "order.status == REQUESTED (ERR_SPECIAL_ORDER_STATE_INVALID)"
          - "product.recall_state == CLEAR (ERR_PRODUCT_RECALLED)"
          - "sum of AVAILABLE lot free units (on_hand - reserved) for (store, product) >= order.quantity (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "reserve order.quantity across AVAILABLE lots FEFO: lot.quantity_reserved += allocated (lot.version += 1)"
          - "status = ALLOCATED"
          - "version += 1"

      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /special-orders/{orderId}/fulfill"
        actor: StoreClerk
        preconditions:
          - "order.status == ALLOCATED (ERR_SPECIAL_ORDER_STATE_INVALID)"
          - "product.recall_state == CLEAR (ERR_PRODUCT_RECALLED)"
        side_effects:
          - "for each reserved lot: quantity_reserved -= n; quantity_on_hand -= n; if on_hand == 0 then status = DEPLETED (lot.version += 1)"
          - "status = FULFILLED"
          - "customer.lifetime_spend_cents += (deposit_cents + balance_cents); customer.loyalty_points += earned; customer.loyalty_tier recomputed"
          - "version += 1"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /special-orders/{orderId}/cancel"
        actor: Customer
        preconditions:
          - "order.status IN {REQUESTED, ALLOCATED} (ERR_SPECIAL_ORDER_STATE_INVALID)"
        side_effects:
          - "status = CANCELLED"
          - "version += 1"

      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /special-orders/{orderId}/cancel"
        actor: Customer
        note: "Compensation: cancelling an ALLOCATED order releases all reservations."
        preconditions:
          - "order.status IN {REQUESTED, ALLOCATED}"
        side_effects:
          - "for each reserved lot: quantity_reserved -= n (release) (lot.version += 1)"
          - "status = CANCELLED"
          - "version += 1"

  - entity: ClinicAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /clinic-appointments/{apptId}/check-in"
        actor: ClinicVet
        preconditions:
          - "appointment.status == BOOKED (ERR_APPOINTMENT_STATE_INVALID)"
          - "current clock >= start_at (ERR_APPOINTMENT_NOT_STARTED)"
        side_effects:
          - "status = CHECKED_IN"
          - "version += 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /clinic-appointments/{apptId}/complete"
        actor: ClinicVet
        note: "Completing a VET_EXAM is the cross-entity precondition that unlocks Prescription issuance referencing this appointment."
        preconditions:
          - "appointment.status == CHECKED_IN (ERR_APPOINTMENT_STATE_INVALID)"
        side_effects:
          - "status = COMPLETED"
          - "clinic_loyalty_accrual: customer.lifetime_spend_cents += fee_cents; customer.loyalty_points += earned; customer.loyalty_tier recomputed"
          - "version += 1"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /clinic-appointments/{apptId}/cancel"
        actor: ClinicVet
        preconditions:
          - "appointment.status == BOOKED (ERR_APPOINTMENT_STATE_INVALID)"
        side_effects:
          - "status = CANCELLED"
          - "version += 1"

      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /clinic-appointments/{apptId}/no-show"
        actor: ClinicVet
        preconditions:
          - "appointment.status == BOOKED (ERR_APPOINTMENT_STATE_INVALID)"
          - "current clock >= end_at (ERR_APPOINTMENT_NOT_ENDED)"
        side_effects:
          - "status = NO_SHOW"
          - "version += 1"

  - entity: AdoptionEvent
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /adoption-events/{eventId}/open"
        actor: StoreClerk
        preconditions:
          - "event.status == SCHEDULED (ERR_EVENT_STATE_INVALID)"
        side_effects:
          - "status = OPEN"
          - "version += 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /adoption-events/{eventId}/close"
        actor: StoreClerk
        note: "Closing the event returns every still-PLACED placement to its batch floor (cascade across placements then batches)."
        preconditions:
          - "event.status == OPEN (ERR_EVENT_STATE_INVALID)"
        side_effects:
          - "for each placement with status == PLACED: placement.status = RETURNED; placed_head -= placement.head; if its batch.sale_state == RESERVED then batch.sale_state = ON_FLOOR (batch.version += 1)"
          - "status = CLOSED"
          - "version += 1"

  - entity: Recall
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: "(creation)"
        to: OPEN
        trigger: "POST /recalls"
        actor: InventoryManager
        note: "Issuing a recall fans out a 3-hop transitive cascade across stores."
        preconditions:
          - "product exists (ERR_PRODUCT_NOT_FOUND)"
        side_effects:
          - "hop1: every in-scope AVAILABLE InventoryLot for the product (matching optional lot_code and scope_state_code) → status = QUARANTINED; affected_lot_count = count; each lot.version += 1"
          - "hop2 (caused by hop1): product.recall_state recomputed from now-QUARANTINED coverage → RECALLED"
          - "hop3 (caused by hop2): every ACTIVE/PAUSED Subscription whose product is now RECALLED and whose store is in scope → status = HALTED; halted_subscription_count = count; each subscription.version += 1"
          - "status = OPEN"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /recalls/{recallId}/resolve"
        actor: InventoryManager
        note: "Compensation: reverse THIS recall's own quarantine + halt effects, each gated by whether another OPEN recall still covers the lot/product."
        preconditions:
          - "recall.status == OPEN (ERR_RECALL_STATE_INVALID)"
        side_effects:
          - "for each lot quarantined by THIS recall and NOT covered by another OPEN recall: status = AVAILABLE (lot.version += 1)"
          - "product.recall_state recomputed: CLEAR when no OPEN recall covers it"
          - "for each subscription HALTED by THIS recall whose product is now CLEAR: status = ACTIVE; next_ship_at = clock + cycle_days (subscription.version += 1)"
          - "status = RESOLVED"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: shipment-run-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{subId}/run-shipment"
    occ_field: "expected_subscription_version"
    description: |
      Running an auto-ship cycle against a Subscription whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer already ran the due shipment (advancing
      next_ship_at and shipments_count and bumping the version), so the
      current writer's view of the subscription is stale; re-running would
      double-charge the customer and double-decrement inventory.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lot-adjust-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /inventory-lots/{lotId}/adjust"
    occ_field: "expected_lot_version"
    description: |
      Adjusting an InventoryLot's quantity_on_hand against a version the
      client last observed is rejected when the lot's version has since
      advanced — e.g. a recall just quarantined the lot or a shipment just
      decremented it. The stale adjustment would write a quantity computed
      from a no-longer-current on-hand figure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: auto_ship_charge
    trigger: "POST /subscriptions/{subId}/run-shipment (subscription self-loop)"
    algorithm: tiered_pricing
    formula: |
      Inputs: units = subscription.quantity_per_cycle,
              unit_price = product.unit_price_cents,
              base_disc = subscription.discount_pct (0.0..0.5),
              tier_disc = TIER_DISCOUNT[customer.loyalty_tier] evaluated AT shipment run time
                          (BRONZE=0.00, SILVER=0.05, GOLD=0.10).
      gross_cents = units * unit_price                  (exact integer)
      # PINNED EVALUATION ORDER (combinatorial mode (c) — circular-looking
      # dependency resolved by pinning order): the two discounts compose
      # MULTIPLICATIVELY, base first then tier, on the GROSS SUM as a whole
      # (sum-then-discount), and the result is rounded EXACTLY ONCE at the end:
      after_base = gross_cents * (1 - base_disc)        # real number
      after_tier = after_base * (1 - tier_disc)         # real number
      net_cents  = round_half_up(after_tier)            # single final rounding
      Shipment.gross_cents = gross_cents
      Shipment.net_cents   = net_cents
    input_set: "Single subscription's current cycle; loyalty_tier read at run time, not at subscription creation."
    constants:
      TIER_DISCOUNT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "net_cents integer; round_half_up applied exactly once after both discounts compose on the gross sum."
    note: "Order pinned: base then tier on gross sum, single final rounding (sum-then-round)."

  - name: special_order_total
    trigger: "POST /special-orders (deposit at request) and POST /special-orders/{id}/fulfill (balance)"
    algorithm: tiered_pricing
    formula: |
      Inputs: quantity, unit_price = product.unit_price_cents,
              deposit_pct (0.0..1.0),
              tier_disc = TIER_DISCOUNT[customer.loyalty_tier] evaluated AT REQUEST time, frozen on the order.
      # DUAL-VARIANT vs auto_ship_charge: special orders apply the tier discount
      # PER UNIT then round PER UNIT then sum (round-per-line-item), the opposite
      # rounding order from auto_ship_charge's round-once-at-end. Identical
      # price/qty/tier inputs therefore yield a different net.
      per_unit_net    = round_half_up(unit_price * (1 - tier_disc))   # round EACH unit
      gross_net_cents = per_unit_net * quantity                       # then sum
      deposit_cents   = round_half_up(gross_net_cents * deposit_pct)  # set at request time
      balance_cents   = gross_net_cents - deposit_cents               # charged at fulfillment
    input_set: "Single special order; tier_disc frozen at request time even if the tier later changes."
    constants:
      TIER_DISCOUNT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10 }
    precision: "round_half_up per unit (line item), then sum; deposit rounded half-up; balance = gross_net - deposit."
    note: "Round-per-line-item order pinned — diverges from auto_ship_charge's round-once-at-end on identical inputs."

  - name: loyalty_tier
    trigger: "recomputed after any transition that increments customer.lifetime_spend_cents"
    algorithm: threshold
    formula: |
      Let s = customer.lifetime_spend_cents.
      if s >= GOLD_THRESHOLD:     loyalty_tier = GOLD
      elif s >= SILVER_THRESHOLD: loyalty_tier = SILVER
      else:                       loyalty_tier = BRONZE
      # Boundary inclusive: s == SILVER_THRESHOLD is SILVER; s == GOLD_THRESHOLD is GOLD.
    input_set: "Single customer's cumulative lifetime_spend_cents."
    constants:
      SILVER_THRESHOLD: 5000000    # cents ($50,000) inclusive lower bound for SILVER
      GOLD_THRESHOLD: 20000000     # cents ($200,000) inclusive lower bound for GOLD
    precision: "Integer comparison; >= inclusive at both thresholds."
    note: "Threshold boundary precision on a cumulative spend metric (>=, not >)."

  - name: mortality_condemn_rate
    trigger: "POST /livestock-batches/{batchId}/record-mortality"
    algorithm: threshold
    formula: |
      Let r = mortality_count / head_count   (real division; head_count is original intake count, NOT net of mortality).
      if r >= MORTALITY_CONDEMN_RATE: batch condemned (health_state = CONDEMNED, sale_state = SOLD_OUT)
      else:                           health_state = UNDER_TREATMENT
      # Boundary inclusive: r exactly 0.5 condemns.
    input_set: "Single batch; head_count fixed at intake."
    constants:
      MORTALITY_CONDEMN_RATE: 0.5    # inclusive: r >= 0.5 condemns
    precision: "Real division; >= 0.5 condemns (inclusive boundary)."
    note: "Boundary precision on a mortality ratio — a different metric and endpoint from loyalty_tier's spend threshold."

  - name: livestock_sale_total
    trigger: "POST /livestock-sales"
    algorithm: aggregation
    formula: |
      Inputs: head = batch.head_count - batch.mortality_count (live head sold),
              unit_price = batch.unit_price_cents,
              tier_disc = TIER_DISCOUNT[customer.loyalty_tier] at sale time.
      net_cents     = round_half_up(head * unit_price * (1 - tier_disc))   # round once
      earned_points = (net_cents // 100) * LOYALTY_POINTS_PER_DOLLAR
      customer.lifetime_spend_cents += net_cents
      customer.loyalty_points += earned_points
      customer.loyalty_tier = loyalty_tier(customer.lifetime_spend_cents)
    input_set: "Single livestock sale of the full remaining live head of one batch."
    constants:
      LOYALTY_POINTS_PER_DOLLAR: 1
    precision: "round_half_up once; points = floor(net/100) * 1."

  - name: clinic_loyalty_accrual
    trigger: "POST /clinic-appointments/{apptId}/complete"
    algorithm: aggregation
    formula: |
      net = appointment.fee_cents
      earned_points = (net // 100) * LOYALTY_POINTS_PER_DOLLAR * SERVICE_MULTIPLIER[service_type]
      customer.lifetime_spend_cents += net
      customer.loyalty_points += earned_points
      customer.loyalty_tier = loyalty_tier(customer.lifetime_spend_cents)
    input_set: "Single completed appointment."
    constants:
      LOYALTY_POINTS_PER_DOLLAR: 1
      SERVICE_MULTIPLIER: { GROOMING: 1, VACCINE: 2, VET_EXAM: 3 }
    precision: "floor(net/100) integer points × service multiplier."

  - name: inventory_allocation_order
    trigger: "run-shipment, special-order allocate, special-order fulfill, product-sales"
    algorithm: waterfall_allocation
    formula: |
      Candidate lots = InventoryLot where store_id == fulfilling store AND product_id == target
                       AND status == AVAILABLE AND (quantity_on_hand - quantity_reserved) > 0.
      Order (FEFO, fully pinned, NO random fields):
        1. expiry_date ASC      (earliest expiry first)
        2. received_at ASC      (tie-break: earliest received first)
        3. created_at ASC       (final tie-break over a common field; never id)
      Allocate greedily from the head of the ordered list until the requested
      unit count is satisfied; the last lot may be drawn partially.
      If the ordered free-unit sum < requested units → ERR_INSUFFICIENT_INVENTORY (no partial allocation).
    input_set: "AVAILABLE lots only; QUARANTINED and DEPLETED excluded; free units = on_hand - reserved."
    constants: {}
    precision: "Integer unit allocation; deterministic order key (expiry_date, received_at, created_at)."
    note: "Tie-break ladder explicit; created_at (never id) is the final fallback per scaffold rules."

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: auth
    check: "For Customer-owned resources, acting Customer (X-User-ID) must own the targeted resource (customer_id match)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "subscription pause/resume/cancel, special-order cancel (Customer role)"

  - priority: 4
    category: existence
    check: "All path-resource IDs exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 5
    category: existence
    check: "Referenced FK body fields (product_id, store_id, batch_id, customer_id, subscription_id, event_id, issued_by_appointment_id) resolve to existing entities"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints carrying FK body fields"

  - priority: 6
    category: business_constraint
    check: "Body field types/ranges valid (quantity > 0, head > 0, end_at > start_at, unit_price_cents > 0, discount_pct in [0,0.5], deposit_pct in [0,1], severity/category/animal_class/service_type enums valid)"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all creation/action endpoints with a body"

  - priority: 7
    category: business_constraint
    check: "Uniqueness: Product.sku globally unique; InventoryLot.lot_code unique per product_id; Customer.email unique"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /products, POST /inventory-lots, POST /customers"

  - priority: 8
    category: state
    check: "Target resource is in a state that permits the requested transition (and OCC matches where applicable, checked before deeper business rules)"
    error_id: "varies (ERR_SUBSCRIPTION_STATE_INVALID, ERR_BATCH_HEALTH_STATE_INVALID, ERR_BATCH_SALE_STATE_INVALID, ERR_SPECIAL_ORDER_STATE_INVALID, ERR_APPOINTMENT_STATE_INVALID, ERR_EVENT_STATE_INVALID, ERR_RECALL_STATE_INVALID, ERR_PLACEMENT_NOT_RETURNABLE)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal current parent.version (checked immediately after the state precondition, before inventory/charge work)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /subscriptions/{id}/run-shipment, POST /inventory-lots/{id}/adjust"

  - priority: 10
    category: business_temporal
    check: "Clinic room double-booking: a BOOKED/CHECKED_IN appointment in the same store+room whose half-open interval [start_at,end_at) overlaps is rejected (touching endpoints do NOT overlap)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /clinic-appointments"

  - priority: 11
    category: business_temporal
    check: "Quarantine clearance requires current clock >= intake_at + quarantine_days (closed lower bound); check-in requires clock >= start_at; no-show requires clock >= end_at; run-shipment requires clock >= next_ship_at"
    error_id: "varies (ERR_QUARANTINE_NOT_ELAPSED, ERR_APPOINTMENT_NOT_STARTED, ERR_APPOINTMENT_NOT_ENDED, ERR_SHIPMENT_NOT_DUE)"
    http_status: 409
    applies_to: "clear-quarantine, check-in, no-show, run-shipment"

  - priority: 12
    category: business_safety
    check: "Livestock sale / floor-listing / placement requires batch.health_state == HEALTHY"
    error_id: ERR_BATCH_NOT_HEALTHY
    http_status: 409
    applies_to: "POST /livestock-sales, POST /livestock-batches/{id}/list-on-floor, POST /adoption-placements"

  - priority: 13
    category: business_safety
    check: "Selling/shipping/allocating/resuming a product whose recall_state == RECALLED is blocked"
    error_id: ERR_PRODUCT_RECALLED
    http_status: 409
    applies_to: "run-shipment, special-order allocate/fulfill, subscription resume, product-sales"

  - priority: 14
    category: business_safety
    check: "Prescription-diet product sale requires a Prescription for (customer, product) with status == ACTIVE AND expires_at > current clock AND units <= max_units_per_order"
    error_id: ERR_PRESCRIPTION_REQUIRED
    http_status: 409
    applies_to: "POST /product-sales (when product.is_prescription_diet)"

  - priority: 15
    category: business_referential
    check: "Prescription issuance requires issued_by_appointment_id to be a COMPLETED VET_EXAM appointment for the same customer"
    error_id: ERR_APPOINTMENT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /prescriptions"

  - priority: 16
    category: business_constraint
    check: "Adoption placement head <= batch live head (ERR_INSUFFICIENT_HEAD) AND event.placed_head + head <= event.capacity (ERR_EVENT_CAPACITY_EXCEEDED); the head check is evaluated before the capacity check"
    error_id: "varies (ERR_INSUFFICIENT_HEAD, ERR_EVENT_CAPACITY_EXCEEDED)"
    http_status: 409
    applies_to: "POST /adoption-placements"

  - priority: 17
    category: business_fiscal
    check: "Loyalty redemption: requested redeem_points <= customer.loyalty_points"
    error_id: ERR_INSUFFICIENT_LOYALTY_POINTS
    http_status: 409
    applies_to: "POST /product-sales (redeem_points)"

  - priority: 18
    category: business_fiscal
    check: "Inventory allocation: ordered free-unit sum across AVAILABLE lots >= requested units (checked after recall + prescription safety gates)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "run-shipment, special-order allocate, product-sales"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Store ----------
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [InventoryManager]
    code: 201
    input: [name, state_code, "loyalty_point_value_cents?"]
    output: Store
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/stores"
    description: "List stores"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Store[]"
    side_effects: []

  - method: GET
    path: "/stores/{storeId}"
    description: "Get a store"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []

  # ---------- Product ----------
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [InventoryManager]
    code: 201
    input: [sku, name, category, unit_price_cents, "is_prescription_diet?", "loyalty_points_per_unit?"]
    output: Product
    side_effects: ["recall_state = CLEAR"]

  - method: GET
    path: "/products"
    description: "List products"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/products/{productId}"
    description: "Get a product (includes derived recall_state)"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  # ---------- InventoryLot ----------
  - method: POST
    path: "/inventory-lots"
    description: "Receive an inventory lot at a store"
    roles: [InventoryManager]
    code: 201
    input: [store_id, product_id, lot_code, quantity_on_hand, received_at, expiry_date]
    output: InventoryLot
    side_effects: ["status = AVAILABLE", "quantity_reserved = 0"]

  - method: GET
    path: "/inventory-lots"
    description: "List inventory lots (filterable by store_id and/or product_id)"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: ["store_id?", "product_id?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []

  - method: GET
    path: "/inventory-lots/{lotId}"
    description: "Get an inventory lot"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: POST
    path: "/inventory-lots/{lotId}/adjust"
    description: "Adjust a lot's quantity_on_hand (OCC-guarded receiving/shrink correction)"
    roles: [InventoryManager]
    code: 200
    input: [delta, expected_lot_version]
    output: InventoryLot
    side_effects:
      - "quantity_on_hand += delta (must stay >= quantity_reserved and >= 0)"
      - "if quantity_on_hand == 0 then status = DEPLETED; else if was DEPLETED and now > 0 then status = AVAILABLE"
      - "increments InventoryLot.version by 1"

  # ---------- LivestockBatch ----------
  - method: POST
    path: "/livestock-batches"
    description: "Intake a livestock batch (enters quarantine)"
    roles: [LivestockKeeper]
    code: 201
    input: [store_id, species, animal_class, head_count, unit_price_cents, intake_at, quarantine_days]
    output: LivestockBatch
    side_effects: ["health_state = QUARANTINE", "sale_state = HELD", "mortality_count = 0"]

  - method: GET
    path: "/livestock-batches"
    description: "List livestock batches (filterable by store_id)"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: ["store_id?", "limit?", "offset?"]
    output: "LivestockBatch[]"
    side_effects: []

  - method: GET
    path: "/livestock-batches/{batchId}"
    description: "Get a livestock batch"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: []
    output: LivestockBatch
    side_effects: []

  - method: POST
    path: "/livestock-batches/{batchId}/clear-quarantine"
    description: "Clear quarantine → HEALTHY (also UNDER_TREATMENT → HEALTHY recovery)"
    roles: [LivestockKeeper]
    code: 200
    input: []
    output: LivestockBatch
    side_effects: ["health_state = HEALTHY", "version += 1"]

  - method: POST
    path: "/livestock-batches/{batchId}/record-mortality"
    description: "Record deaths; may trigger UNDER_TREATMENT or CONDEMNED via mortality_condemn_rate"
    roles: [LivestockKeeper]
    code: 200
    input: [deaths]
    output: LivestockBatch
    side_effects: ["mortality_count += deaths", "health/sale state per mortality_condemn_rate", "version += 1"]

  - method: POST
    path: "/livestock-batches/{batchId}/list-on-floor"
    description: "List a healthy batch on the sales floor (HELD → ON_FLOOR)"
    roles: [LivestockKeeper]
    code: 200
    input: []
    output: LivestockBatch
    side_effects: ["sale_state = ON_FLOOR", "version += 1"]

  - method: POST
    path: "/livestock-batches/{batchId}/condemn"
    description: "Condemn an under-treatment batch (UNDER_TREATMENT → CONDEMNED)"
    roles: [LivestockKeeper]
    code: 200
    input: []
    output: LivestockBatch
    side_effects: ["health_state = CONDEMNED", "sale_state = SOLD_OUT", "version += 1"]

  # ---------- LivestockSale ----------
  - method: POST
    path: "/livestock-sales"
    description: "Sell a full healthy on-floor batch to a customer"
    roles: [StoreClerk]
    code: 201
    input: [batch_id, customer_id]
    output: LivestockBatch
    side_effects: ["sale_state = SOLD_OUT", "livestock_sale_total accrual to customer", "version += 1"]

  # ---------- Customer ----------
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [StoreClerk, InventoryManager]
    code: 201
    input: [email, full_name, home_store_id]
    output: Customer
    side_effects: ["loyalty_points = 0", "lifetime_spend_cents = 0", "loyalty_tier = BRONZE"]

  - method: GET
    path: "/customers"
    description: "List customers (filterable by home_store_id)"
    roles: [InventoryManager, StoreClerk, ClinicVet]
    code: 200
    input: ["home_store_id?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer (includes derived loyalty_tier)"
    roles: [InventoryManager, StoreClerk, ClinicVet, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---------- Prescription ----------
  - method: POST
    path: "/prescriptions"
    description: "Issue a prescription-diet authorization tied to a COMPLETED VET_EXAM"
    roles: [ClinicVet]
    code: 201
    input: [customer_id, product_id, issued_by_appointment_id, max_units_per_order, expires_at]
    output: Prescription
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/prescriptions"
    description: "List prescriptions (filterable by customer_id, product_id, issued_by_appointment_id)"
    roles: [InventoryManager, StoreClerk, ClinicVet, Customer]
    code: 200
    input: ["customer_id?", "product_id?", "issued_by_appointment_id?", "limit?", "offset?"]
    output: "Prescription[]"
    side_effects: []

  - method: GET
    path: "/prescriptions/{prescriptionId}"
    description: "Get a prescription"
    roles: [InventoryManager, StoreClerk, ClinicVet, Customer]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: POST
    path: "/prescriptions/{prescriptionId}/revoke"
    description: "Revoke a prescription (ACTIVE → REVOKED)"
    roles: [ClinicVet]
    code: 200
    input: []
    output: Prescription
    side_effects: ["status = REVOKED", "version += 1"]

  # ---------- ClinicAppointment ----------
  - method: POST
    path: "/clinic-appointments"
    description: "Book a grooming/vaccine/vet-exam appointment"
    roles: [ClinicVet, StoreClerk]
    code: 201
    input: [store_id, customer_id, service_type, room, start_at, end_at, fee_cents]
    output: ClinicAppointment
    side_effects: ["status = BOOKED", "room overlap check (half-open interval)"]

  - method: GET
    path: "/clinic-appointments"
    description: "List clinic appointments (filterable by store_id and/or customer_id)"
    roles: [InventoryManager, ClinicVet, StoreClerk, Customer]
    code: 200
    input: ["store_id?", "customer_id?", "limit?", "offset?"]
    output: "ClinicAppointment[]"
    side_effects: []

  - method: GET
    path: "/clinic-appointments/{apptId}"
    description: "Get a clinic appointment"
    roles: [InventoryManager, ClinicVet, StoreClerk, Customer]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: []

  - method: POST
    path: "/clinic-appointments/{apptId}/check-in"
    description: "Check in a booked appointment"
    roles: [ClinicVet]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status = CHECKED_IN", "version += 1"]

  - method: POST
    path: "/clinic-appointments/{apptId}/complete"
    description: "Complete an appointment (accrues clinic loyalty; unlocks prescription)"
    roles: [ClinicVet]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status = COMPLETED", "clinic_loyalty_accrual to customer", "version += 1"]

  - method: POST
    path: "/clinic-appointments/{apptId}/cancel"
    description: "Cancel a booked appointment"
    roles: [ClinicVet]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status = CANCELLED", "version += 1"]

  - method: POST
    path: "/clinic-appointments/{apptId}/no-show"
    description: "Mark a booked appointment as no-show after its end time"
    roles: [ClinicVet]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status = NO_SHOW", "version += 1"]

  # ---------- Subscription / Shipment ----------
  - method: POST
    path: "/subscriptions"
    description: "Create an auto-ship subscription"
    roles: [Customer, StoreClerk]
    code: 201
    input: [customer_id, product_id, store_id, quantity_per_cycle, cycle_days, "discount_pct?", next_ship_at]
    output: Subscription
    side_effects: ["status = ACTIVE", "shipments_count = 0"]

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions (filterable by customer_id, product_id, store_id)"
    roles: [InventoryManager, StoreClerk, Customer]
    code: 200
    input: ["customer_id?", "product_id?", "store_id?", "limit?", "offset?"]
    output: "Subscription[]"
    side_effects: []

  - method: GET
    path: "/subscriptions/{subId}"
    description: "Get a subscription"
    roles: [InventoryManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/subscriptions/{subId}/pause"
    description: "Pause an active subscription"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status = PAUSED", "version += 1"]

  - method: POST
    path: "/subscriptions/{subId}/resume"
    description: "Resume a paused subscription"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status = ACTIVE", "next_ship_at = clock + cycle_days", "version += 1"]

  - method: POST
    path: "/subscriptions/{subId}/cancel"
    description: "Cancel a subscription"
    roles: [Customer]
    code: 200
    input: []
    output: Subscription
    side_effects: ["status = CANCELLED", "version += 1"]

  - method: POST
    path: "/subscriptions/{subId}/run-shipment"
    description: "Fulfill a due auto-ship cycle (OCC-guarded; allocates inventory FEFO; charges customer)"
    roles: [StoreClerk]
    code: 201
    input: [expected_subscription_version]
    output: Shipment
    side_effects:
      - "create Shipment (FULFILLED); allocate units FEFO; drawn lot.quantity_on_hand -= n; lot DEPLETED at 0"
      - "shipments_count += 1; next_ship_at += cycle_days"
      - "auto_ship_charge accrual to customer; loyalty_tier recomputed"
      - "increments Subscription.version by 1"

  - method: GET
    path: "/shipments"
    description: "List shipments (filterable by subscription_id and/or lot_id)"
    roles: [InventoryManager, StoreClerk, Customer]
    code: 200
    input: ["subscription_id?", "lot_id?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [InventoryManager, StoreClerk, Customer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  # ---------- SpecialOrder ----------
  - method: POST
    path: "/special-orders"
    description: "Request a special order (charges deposit via special_order_total)"
    roles: [Customer, StoreClerk]
    code: 201
    input: [customer_id, product_id, store_id, quantity, "deposit_pct?"]
    output: SpecialOrder
    side_effects: ["status = REQUESTED", "deposit_cents/balance_cents computed"]

  - method: GET
    path: "/special-orders"
    description: "List special orders (filterable by customer_id, product_id, store_id)"
    roles: [InventoryManager, StoreClerk, Customer]
    code: 200
    input: ["customer_id?", "product_id?", "store_id?", "limit?", "offset?"]
    output: "SpecialOrder[]"
    side_effects: []

  - method: GET
    path: "/special-orders/{orderId}"
    description: "Get a special order"
    roles: [InventoryManager, StoreClerk, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []

  - method: POST
    path: "/special-orders/{orderId}/allocate"
    description: "Reserve inventory for a special order (REQUESTED → ALLOCATED)"
    roles: [InventoryManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["reserve quantity FEFO (quantity_reserved += n)", "status = ALLOCATED", "version += 1"]

  - method: POST
    path: "/special-orders/{orderId}/fulfill"
    description: "Fulfill an allocated special order (ALLOCATED → FULFILLED; charges balance)"
    roles: [StoreClerk]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["consume reserved units; status = FULFILLED", "customer accrual of deposit+balance; loyalty_tier recomputed", "version += 1"]

  - method: POST
    path: "/special-orders/{orderId}/cancel"
    description: "Cancel a special order (releases reservations if ALLOCATED)"
    roles: [Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["release reserved units", "status = CANCELLED", "version += 1"]

  # ---------- POS product sale ----------
  - method: POST
    path: "/product-sales"
    description: "Point-of-sale of catalog product units (prescription + recall + loyalty checks; allocates FEFO)"
    roles: [StoreClerk]
    code: 201
    input: [store_id, product_id, customer_id, quantity, "redeem_points?"]
    output: InventoryLot
    side_effects:
      - "allocate units FEFO from AVAILABLE lots; drawn lot.quantity_on_hand -= n; lot DEPLETED at 0"
      - "charge = quantity*unit_price - redeemed value; customer.loyalty_points -= redeem_points; += earned"
      - "customer.lifetime_spend_cents += net charge; loyalty_tier recomputed"

  # ---------- Recall ----------
  - method: POST
    path: "/recalls"
    description: "Issue a product recall (3-hop cascade: quarantine lots → recompute recall_state → halt subscriptions)"
    roles: [InventoryManager]
    code: 201
    input: [product_id, severity, "lot_code?", "scope_state_code?"]
    output: Recall
    side_effects:
      - "quarantine in-scope AVAILABLE lots; set affected_lot_count"
      - "recompute product.recall_state → RECALLED"
      - "halt in-scope ACTIVE/PAUSED subscriptions; set halted_subscription_count"
      - "status = OPEN"

  - method: GET
    path: "/recalls"
    description: "List recalls (filterable by product_id)"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: ["product_id?", "limit?", "offset?"]
    output: "Recall[]"
    side_effects: []

  - method: GET
    path: "/recalls/{recallId}"
    description: "Get a recall"
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk, Customer]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: POST
    path: "/recalls/{recallId}/resolve"
    description: "Resolve a recall (reverse quarantine + reactivate subscriptions, gated by other OPEN recalls)"
    roles: [InventoryManager]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "un-quarantine lots not covered by another OPEN recall"
      - "recompute product.recall_state"
      - "reactivate subscriptions halted by this recall whose product is now CLEAR"
      - "status = RESOLVED"

  # ---------- AdoptionEvent ----------
  - method: POST
    path: "/adoption-events"
    description: "Schedule an adoption-partner event"
    roles: [StoreClerk]
    code: 201
    input: [store_id, partner_name, event_date, capacity]
    output: AdoptionEvent
    side_effects: ["status = SCHEDULED", "placed_head = 0"]

  - method: GET
    path: "/adoption-events"
    description: "List adoption events (filterable by store_id)"
    roles: [InventoryManager, LivestockKeeper, StoreClerk, Customer]
    code: 200
    input: ["store_id?", "limit?", "offset?"]
    output: "AdoptionEvent[]"
    side_effects: []

  - method: GET
    path: "/adoption-events/{eventId}"
    description: "Get an adoption event"
    roles: [InventoryManager, LivestockKeeper, StoreClerk, Customer]
    code: 200
    input: []
    output: AdoptionEvent
    side_effects: []

  - method: POST
    path: "/adoption-events/{eventId}/open"
    description: "Open a scheduled event for placements"
    roles: [StoreClerk]
    code: 200
    input: []
    output: AdoptionEvent
    side_effects: ["status = OPEN", "version += 1"]

  - method: POST
    path: "/adoption-events/{eventId}/close"
    description: "Close an event (returns still-placed batches to floor)"
    roles: [StoreClerk]
    code: 200
    input: []
    output: AdoptionEvent
    side_effects: ["return PLACED placements; batch RESERVED→ON_FLOOR; status = CLOSED", "version += 1"]

  # ---------- AdoptionPlacement ----------
  - method: POST
    path: "/adoption-placements"
    description: "Place livestock head into an open event (reserves the batch when full head placed)"
    roles: [LivestockKeeper]
    code: 201
    input: [event_id, batch_id, head]
    output: AdoptionPlacement
    side_effects: ["event.placed_head += head", "batch sale_state → RESERVED if full live head placed", "status = PLACED"]

  - method: GET
    path: "/adoption-placements"
    description: "List placements (filterable by event_id and/or batch_id)"
    roles: [InventoryManager, LivestockKeeper, StoreClerk, Customer]
    code: 200
    input: ["event_id?", "batch_id?", "limit?", "offset?"]
    output: "AdoptionPlacement[]"
    side_effects: []

  - method: GET
    path: "/adoption-placements/{placementId}"
    description: "Get a placement"
    roles: [InventoryManager, LivestockKeeper, StoreClerk, Customer]
    code: 200
    input: []
    output: AdoptionPlacement
    side_effects: []

  - method: POST
    path: "/adoption-placements/{placementId}/return"
    description: "Return a placed batch (PLACED → RETURNED; batch back to ON_FLOOR)"
    roles: [LivestockKeeper]
    code: 200
    input: []
    output: AdoptionPlacement
    side_effects: ["placement.status = RETURNED", "event.placed_head -= head", "batch sale_state → ON_FLOOR", "version += 1"]

  # ---------- Test-driving clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical server clock. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [InventoryManager, LivestockKeeper, ClinicVet, StoreClerk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601 for all subsequent time-gated checks"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting Customer is not the owner of the targeted customer-scoped resource" }
  # --- not found ---
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id not found" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id not found" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot id not found" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "LivestockBatch id not found" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id not found" }
  - { id: ERR_PRESCRIPTION_NOT_FOUND, http: 404, condition: "Prescription id not found" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "ClinicAppointment id not found" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "Subscription id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id not found" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "SpecialOrder id not found" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "AdoptionEvent id not found" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "AdoptionPlacement id not found" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall id not found" }
  # --- input / uniqueness ---
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "Body field out of range or wrong type (quantity<=0, end_at<=start_at, bad enum, discount/deposit out of range)" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Uniqueness violation (sku, lot_code per product, customer email)" }
  # --- state ---
  - { id: ERR_BATCH_HEALTH_STATE_INVALID, http: 409, condition: "Batch health_state does not permit this transition" }
  - { id: ERR_BATCH_SALE_STATE_INVALID, http: 409, condition: "Batch sale_state does not permit this transition" }
  - { id: ERR_SUBSCRIPTION_STATE_INVALID, http: 409, condition: "Subscription status does not permit this transition" }
  - { id: ERR_SPECIAL_ORDER_STATE_INVALID, http: 409, condition: "SpecialOrder status does not permit this transition" }
  - { id: ERR_APPOINTMENT_STATE_INVALID, http: 409, condition: "Appointment status does not permit this transition" }
  - { id: ERR_EVENT_STATE_INVALID, http: 409, condition: "AdoptionEvent status does not permit this transition" }
  - { id: ERR_RECALL_STATE_INVALID, http: 409, condition: "Recall already RESOLVED" }
  - { id: ERR_PLACEMENT_NOT_RETURNABLE, http: 409, condition: "Placement already RETURNED" }
  # --- temporal ---
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Clinic room half-open interval overlaps an existing BOOKED/CHECKED_IN appointment in the same store" }
  - { id: ERR_QUARANTINE_NOT_ELAPSED, http: 409, condition: "Quarantine window has not elapsed (clock < intake_at + quarantine_days)" }
  - { id: ERR_APPOINTMENT_NOT_STARTED, http: 409, condition: "Check-in before start_at" }
  - { id: ERR_APPOINTMENT_NOT_ENDED, http: 409, condition: "No-show before end_at" }
  - { id: ERR_SHIPMENT_NOT_DUE, http: 409, condition: "run-shipment before next_ship_at" }
  # --- safety / referential ---
  - { id: ERR_BATCH_NOT_HEALTHY, http: 409, condition: "Operation requires batch.health_state == HEALTHY" }
  - { id: ERR_QUARANTINE_MORTALITY_BLOCK, http: 409, condition: "Quarantine clearance blocked by recorded mortality" }
  - { id: ERR_PRODUCT_RECALLED, http: 409, condition: "Product recall_state == RECALLED blocks sale/ship/allocate/resume" }
  - { id: ERR_PRESCRIPTION_REQUIRED, http: 409, condition: "Prescription-diet sale lacks an ACTIVE non-expired prescription or exceeds max_units_per_order" }
  - { id: ERR_APPOINTMENT_NOT_ELIGIBLE, http: 409, condition: "issued_by_appointment_id is not a COMPLETED VET_EXAM for this customer" }
  # --- capacity / fiscal ---
  - { id: ERR_INSUFFICIENT_HEAD, http: 409, condition: "Placement head exceeds batch live head" }
  - { id: ERR_EVENT_CAPACITY_EXCEEDED, http: 409, condition: "placed_head + head exceeds event capacity" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Allocatable free units across AVAILABLE lots < requested units" }
  - { id: ERR_INSUFFICIENT_LOYALTY_POINTS, http: 409, condition: "redeem_points exceeds customer.loyalty_points" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent.version" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: InventoryManager
    description: "Owns catalog, stores, inventory lots, recalls, and special-order allocation"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores — Create store"
      - "POST /products — Create product"
      - "POST /inventory-lots — Receive lot"
      - "POST /inventory-lots/{id}/adjust — Adjust lot (OCC)"
      - "POST /recalls — Issue recall"
      - "POST /recalls/{id}/resolve — Resolve recall"
      - "POST /special-orders/{id}/allocate — Allocate special order"
    shared_operations:
      - "POST /customers — Register customer (with StoreClerk)"
      - "GET reads across all collections"

  - name: LivestockKeeper
    description: "Owns livestock intake, health/quarantine transitions, and adoption placements"
    identity: "opaque"
    exclusive_operations:
      - "POST /livestock-batches — Intake batch"
      - "POST /livestock-batches/{id}/clear-quarantine — Clear quarantine"
      - "POST /livestock-batches/{id}/record-mortality — Record mortality"
      - "POST /livestock-batches/{id}/list-on-floor — List on floor"
      - "POST /livestock-batches/{id}/condemn — Condemn batch"
      - "POST /adoption-placements — Place livestock"
      - "POST /adoption-placements/{id}/return — Return placement"
    shared_operations:
      - "GET reads across stores/products/lots/batches/recalls/events/placements"

  - name: ClinicVet
    description: "Owns clinic appointments and prescription issuance/revocation"
    identity: "opaque"
    exclusive_operations:
      - "POST /clinic-appointments/{id}/check-in — Check in"
      - "POST /clinic-appointments/{id}/complete — Complete"
      - "POST /clinic-appointments/{id}/cancel — Cancel appointment"
      - "POST /clinic-appointments/{id}/no-show — Mark no-show"
      - "POST /prescriptions — Issue prescription"
      - "POST /prescriptions/{id}/revoke — Revoke prescription"
    shared_operations:
      - "POST /clinic-appointments — Book appointment (with StoreClerk)"
      - "GET reads across stores/products/customers/prescriptions/appointments"

  - name: StoreClerk
    description: "Owns POS sales, livestock sales, subscription shipment runs, special-order fulfillment, adoption events"
    identity: "opaque"
    exclusive_operations:
      - "POST /product-sales — POS product sale"
      - "POST /livestock-sales — Livestock sale"
      - "POST /subscriptions/{id}/run-shipment — Run auto-ship cycle"
      - "POST /special-orders/{id}/fulfill — Fulfill special order"
      - "POST /adoption-events — Schedule event"
      - "POST /adoption-events/{id}/open — Open event"
      - "POST /adoption-events/{id}/close — Close event"
    shared_operations:
      - "POST /customers — Register customer (with InventoryManager)"
      - "POST /clinic-appointments — Book appointment (with ClinicVet)"
      - "POST /subscriptions — Create subscription (with Customer)"
      - "POST /special-orders — Request special order (with Customer)"
      - "GET reads across all collections"

  - name: Customer
    description: "Entity-backed end user; owns own subscriptions, special orders, prescriptions"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /subscriptions/{id}/pause — Pause own subscription"
      - "POST /subscriptions/{id}/resume — Resume own subscription"
      - "POST /subscriptions/{id}/cancel — Cancel own subscription"
      - "POST /special-orders/{id}/cancel — Cancel own special order"
    shared_operations:
      - "POST /subscriptions — Create own subscription (with StoreClerk)"
      - "POST /special-orders — Request own special order (with StoreClerk)"
      - "GET reads of own customer record, subscriptions, special-orders, prescriptions, shipments, and public catalog"
