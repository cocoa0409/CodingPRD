              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Returnee", email: "q@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1, gpa_hundredths: 300, cumulative_attempted_credits: 30, cumulative_completed_credits: 30 }
              as: AidOfficer
