# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3145_dental_benefit_plan_administration_fee_tiers_predetermination
#
# Breadth probe: every testable claim §1.1–§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners covered
# by §1.8 appear as excluded_because stubs.
#
# Standard anchor block (&c_*): plan DD-STD (annual_max 150000, deductible 0,
# prev 100 / basic 80 / major 50, no waiting periods, missing-tooth off, ABP
# off), PPO provider, fee schedule PPO effective 2026-01-01 with
# D0120 PREVENTIVE 5000 / D2391 BASIC 10000 / D2740 MAJOR 10000 (no attachment
# required, no ABP alternative), subscriber effective 2026-01-01 PRIMARY.
# Every test runs against an empty DB, so shared plan_code/npi literals in
# anchors never collide within an instance.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: plan_create_returns_declared_fields_with_draft_status
        claim_type: Creation
        grounds:
          - entities.Plan
          - endpoints.POST_/dental/plans
        distinguishing_aspect: "A plan created with the full field set returns 201 with status DRAFT, version 1, and server-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - &c_plan
              call: "POST /dental/plans"
              payload: { plan_code: "DD-STD", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Plan.${plan_id}.plan_code == \"DD-STD\" and annual_maximum_cents == 150000"
            - "Plan.${plan_id}.status == DRAFT and version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: provider_create_defaults_status_active
        claim_type: Defaults
        grounds:
          - entities.Provider
          - state_machines.Provider
        distinguishing_aspect: "A provider created without any status field lands in the machine's initial_state ACTIVE with version 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - &c_prov
              call: "POST /dental/providers"
              payload: { npi: "1999999999", legal_name: "Standard Dental", tier: "PPO", license_state: "CA", contracted_on: "2025-01-01T00:00:00Z" }
              as: NetworkManager
              captures: { provider_id: $.data.id }
          assert:
            - "Provider.${provider_id}.status == ACTIVE (initial state applied by the system)"
            - "Provider.${provider_id}.version == 1"
            - "Provider.${provider_id}.tier == \"PPO\""

      - name: claim_attachment_is_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ClaimAttachment
          - endpoints.POST_/dental/claims/{id}/attachments
        distinguishing_aspect: "ClaimAttachment is declared common_fields: false — the create response carries id and created_at but no version and no updated_at, and no update endpoint exists in §1.5 for attachments."
        test_recipe:
          setup:
            - "Standard stack, but the fee schedule's D2740 entry requires attachment so the claim pends."
            - "Claim for D2740 submitted 9000 in PENDED_ATTACHMENTS."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - &c_plan_act
              call: "POST /dental/plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - *c_prov
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 10000, category: "MAJOR", requires_attachment: true, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - &c_fees_act
              call: "POST /dental/fee-schedules/${fees_id}/activate"
              payload: {}
              as: NetworkManager
            - &c_sub
              call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-STD", full_name: "Stan Standard", date_of_birth: "1980-01-01T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "PRIMARY" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "14", submitted_amount_cents: 9000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { line_id: "$.data[0].id" }
          trigger:
            - call: "POST /dental/claims/${claim_id}/attachments"
              payload: { claim_line_id: "${line_id}", attachment_kind: "RADIOGRAPH", blob_ref: "blob://xray-14" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { att_id: $.data.id }
          assert:
            - "the attachment response carries a non-null id and created_at"
            - "the attachment response does NOT carry a version field (common_fields: false)"
            - "ClaimAttachment.${att_id}.attachment_kind == \"RADIOGRAPH\" and blob_ref == \"blob://xray-14\""

      - name: fee_schedule_get_returns_stored_window
        claim_type: Retrieval
        grounds:
          - entities.FeeSchedule
          - endpoints.GET_/dental/fee-schedules/{id}
        distinguishing_aspect: "Every posted FeeSchedule field round-trips through GET, including the null effective_to on an open-ended schedule."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. One PENDING open-ended PREMIER schedule."
          setup_api_calls:
            - *c_clock
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PREMIER", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 7000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
          trigger:
            - call: "GET /dental/fee-schedules/${fees_id}"
              payload: {}
              as: NetworkManager
          assert:
            - "FeeSchedule.${fees_id}.tier == \"PREMIER\" and effective_from == \"2026-01-01T00:00:00Z\""
            - "FeeSchedule.${fees_id}.effective_to is null"
            - "FeeSchedule.${fees_id}.status == PENDING"

      - name: claims_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/dental/claims
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three claims on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count counts the full filtered set."
        test_recipe:
          setup:
            - "Standard stack. Three claims for the subscriber, all D0120 cleanings on distinct service dates."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - &c_fees
              call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D0120", allowed_cents: 5000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }, { cdt_code: "D2391", allowed_cents: 10000, category: "BASIC", requires_attachment: false, abp_alternative_cdt: "" }, { cdt_code: "D2740", allowed_cents: 10000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-03-01T00:00:00Z", received_date: "2026-03-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-04-01T00:00:00Z", received_date: "2026-04-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
          trigger:
            - call: "GET /dental/claims"
              payload: { subscriber_id: "${sub_id}", limit: 2, offset: 0 }
              as: ClaimsExaminer
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /dental/claims?subscriber_id=${sub_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /dental/claims?subscriber_id=${sub_id} with no pagination params returns 3 rows (defaults limit 10, offset 0)"

      - name: plan_get_unknown_id_returns_plan_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/dental/plans/{id}
          - errors.ERR_PLAN_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated plan id returns the typed 404 ERR_PLAN_NOT_FOUND, not generic ERR_NOT_FOUND and not 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /dental/plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_PLAN_NOT_FOUND"

      - name: claim_create_missing_lines_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/dental/claims
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "POST /dental/claims without the required lines field is rejected 400 ERR_INVALID_REQUEST before any business validation runs."
        test_recipe:
          setup:
            - "Standard stack."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: claim_get_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Claim
          - endpoints.GET_/dental/claims/{id}
        distinguishing_aspect: "A stored claim round-trips service_date, provider_id, subscriber_id and computed totals through GET /dental/claims/{id}."
        test_recipe:
          setup:
            - "Standard stack. One adjudicated D0120 claim (submitted 5000, plan pays 5000)."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "GET /dental/claims/${claim_id}"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "Claim.${claim_id}.service_date == \"2026-02-01T00:00:00Z\" and provider_id == ${provider_id}"
            - "Claim.${claim_id}.status == ADJUDICATED"
            - "Claim.${claim_id}.total_submitted_cents == 5000 and total_allowed_cents == 5000 and total_plan_pay_cents == 5000 and total_patient_pay_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: predet_approve_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Predetermination
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "APPROVE is declared only from UNDER_REVIEW; calling it on a SUBMITTED predetermination (never assigned) fails 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup:
            - "Standard stack. Predetermination for D2740 submitted 9000 planned 2026-06-01 in SUBMITTED."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id, predet_v: $.data.version }
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "GET /dental/predeterminations/${predet_id} still shows status == SUBMITTED"

      - name: pay_pended_review_claim_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "PAY is declared only from ADJUDICATED; a SECONDARY subscriber's claim sits in PENDED_REVIEW and pay is rejected 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Standard stack, but the subscriber has cob_priority SECONDARY with other_plan_external_id EXT-9, so claim creation auto-pends PENDED_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-SEC", full_name: "Sadie Secondary", date_of_birth: "1980-01-01T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "SECONDARY", other_plan_external_id: "EXT-9" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /dental/claims/${claim_id}/pay"
              payload: {}
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "GET /dental/claims/${claim_id} still shows status == PENDED_REVIEW"

      - name: withdraw_approved_predet_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Predetermination
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "WITHDRAW is declared only from SUBMITTED and UNDER_REVIEW; withdrawing an APPROVED predetermination fails 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Standard stack. Predetermination for D2740 submitted 9000 planned 2026-06-01 assigned and APPROVED."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
              captures: { predet_v: $.data.version }
            - call: "POST /dental/predeterminations/${predet_id}/approve"
              payload: { expected_predetermination_version: "${predet_v}" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /dental/predeterminations/${predet_id}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "GET /dental/predeterminations/${predet_id} still shows status == APPROVED"

      - name: subscriber_terminate_with_open_claim_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Subscriber.ACTIVE_to_TERMINATED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Subscriber termination requires all claims in terminal states; with one claim ADJUDICATED (not yet PAID), terminate is rejected 409."
        test_recipe:
          setup:
            - "Standard stack. One adjudicated (unpaid) D0120 claim."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /dental/subscribers/${sub_id}/terminate"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "GET /dental/subscribers/${sub_id} still shows status == ACTIVE"

      - name: provider_terminate_with_under_review_predet_returns_provider_busy
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Provider.ACTIVE_to_TERMINATED
          - validations[priority=13]
          - errors.ERR_PROVIDER_BUSY
        distinguishing_aspect: "Provider termination is blocked while the provider has a predetermination UNDER_REVIEW — 409 ERR_PROVIDER_BUSY, distinct from the generic ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Standard stack. Predetermination with this provider assigned (UNDER_REVIEW)."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
            - call: "POST /dental/predeterminations/${predet_id}/assign"
              payload: { clinical_reviewer_id: "rev-1" }
              as: ClinicalReviewer
              as_user_id: "rev-1"
          trigger:
            - call: "POST /dental/providers/${provider_id}/terminate"
              payload: {}
              as: NetworkManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_PROVIDER_BUSY"
            - "GET /dental/providers/${provider_id} still shows status == ACTIVE"

      - name: subscriber_terminate_cascades_to_dependents_and_open_predets
        claim_type: Cascade down
        grounds:
          - state_machines.Subscriber.ACTIVE_to_TERMINATED
          - state_machines.Dependent.ACTIVE_to_TERMINATED
          - state_machines.Predetermination.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "Terminating a subscriber with no open claims cascades: dependents go TERMINATED and SUBMITTED/UNDER_REVIEW predeterminations go WITHDRAWN in the same request."
        test_recipe:
          setup:
            - "Standard stack. Subscriber has one dependent and one SUBMITTED predetermination; no claims."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/subscribers/${sub_id}/dependents"
              payload: { full_name: "Kid Standard", date_of_birth: "2015-06-01T00:00:00Z", relationship: "CHILD" }
              as: PlanAdmin
              captures: { dep_id: $.data.id }
            - call: "POST /dental/predeterminations"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", cdt_code: "D2740", submitted_amount_cents: 9000, planned_service_date: "2026-06-01T00:00:00Z" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { predet_id: $.data.id }
          trigger:
            - call: "POST /dental/subscribers/${sub_id}/terminate"
              payload: {}
              as: PlanAdmin
            - call: "GET /dental/dependents/${dep_id}"
              payload: {}
              as: PlanAdmin
              captures: { dep_status: $.data.status }
            - call: "GET /dental/predeterminations/${predet_id}"
              payload: {}
              as: PlanAdmin
              captures: { predet_status: $.data.status }
          assert:
            - "Subscriber.${sub_id}.status == TERMINATED"
            - "Dependent.${dep_id}.status == TERMINATED (cascade)"
            - "Predetermination.${predet_id}.status == WITHDRAWN (cascade)"

      - name: attachment_completion_moves_claim_from_pended_to_adjudicated
        claim_type: Valid Transition
        grounds:
          - state_machines.Claim.PENDED_ATTACHMENTS_to_ADJUDICATED
          - state_machines.Claim.RECEIVED_to_PENDED_ATTACHMENTS
        distinguishing_aspect: "A claim whose only line requires an attachment auto-pends at creation, then the final attachment upload triggers the full adjudication pipeline in the same request."
        test_recipe:
          setup:
            - "Standard stack, but the schedule's D2740 entry has requires_attachment=true."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 10000, category: "MAJOR", requires_attachment: true, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "14", submitted_amount_cents: 9000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id, pended_status: $.data.status }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { line_id: "$.data[0].id" }
            - call: "POST /dental/claims/${claim_id}/attachments"
              payload: { claim_line_id: "${line_id}", attachment_kind: "RADIOGRAPH", blob_ref: "blob://xray-14" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "GET /dental/claims/${claim_id}"
              payload: {}
              as: ClaimsExaminer
              captures: { final_status: $.data.status, plan_pay: $.data.total_plan_pay_cents }
          assert:
            - "claim creation returns status == PENDED_ATTACHMENTS (auto-pend, lines stay PENDING)"
            - "after the attachment upload: claim status == ADJUDICATED"
            - "Claim.total_allowed_cents == 9000 (min(9000, 10000)) and total_plan_pay_cents == 4500 (floor(9000*50/100))"

      - name: cob_pended_claim_adjudicates_on_cob_confirm
        claim_type: Valid Transition
        grounds:
          - state_machines.Claim.RECEIVED_to_PENDED_REVIEW
          - state_machines.Claim.PENDED_REVIEW_to_ADJUDICATED
        distinguishing_aspect: "A SECONDARY subscriber's claim auto-pends PENDED_REVIEW at creation; the examiner's cob-confirm supplies the primary payment and runs the adjudication pipeline."
        test_recipe:
          setup:
            - "Standard stack, subscriber cob_priority SECONDARY with other_plan_external_id EXT-9."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-SEC2", full_name: "Sid Secondary", date_of_birth: "1980-01-01T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "SECONDARY", other_plan_external_id: "EXT-9" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id, pended: $.data.status }
            - call: "POST /dental/claims/${claim_id}/cob-confirm"
              payload: { cob_other_plan_paid_cents: 7000 }
              as: ClaimsExaminer
              captures: { final_status: $.data.status, secondary_pay: $.data.cob_secondary_payment_cents }
          assert:
            - "claim creation returns status == PENDED_REVIEW"
            - "after cob-confirm: claim status == ADJUDICATED"
            - "Claim.cob_other_plan_paid_cents == 7000"

      - name: auto_deny_when_all_lines_denied
        claim_type: invalid_transition
        grounds:
          - state_machines.Claim.ADJUDICATED_to_DENIED
        excluded_because:
          difficulty_instance: claim_branching_denied_path_and_paid_then_void_revert
          rationale: "The all-denied branch (ADJUDICATED → DENIED) is asserted in the named §1.8 instance via the waiting-period-denied claim."

  # ===========================================================================
  - section: calculations
    instances:

      - name: cob_waterfall_caps_secondary_payment_at_remaining_responsibility
        claim_type: Correct Result
        grounds:
          - calculations.cob_waterfall
          - entities.Claim.fields.cob_secondary_payment_cents
        distinguishing_aspect: "Secondary payment is min(what this plan would pay as primary, allowed minus primary paid): hypothetical primary 8000 vs remaining responsibility 3000 -> pays 3000, not 8000."
        test_recipe:
          setup:
            - "Standard stack, subscriber SECONDARY (other_plan_external_id EXT-9)."
            - "Claim for D2391 submitted 10000, pended PENDED_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - call: "POST /dental/subscribers"
              payload: { plan_id: "${plan_id}", member_id: "M-COB", full_name: "Coby Secondary", date_of_birth: "1980-01-01T00:00:00Z", effective_date: "2026-01-01T00:00:00Z", cob_priority: "SECONDARY", other_plan_external_id: "EXT-9" }
              as: PlanAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /dental/claims/${claim_id}/cob-confirm"
              payload: { cob_other_plan_paid_cents: 7000 }
              as: ClaimsExaminer
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { line_plan: "$.data[0].plan_pay_cents", line_patient: "$.data[0].patient_pay_cents" }
          assert:
            - "line plan_pay_cents == 3000 (min(hypothetical primary floor(10000*80/100)=8000, allowed 10000 - primary 7000 = 3000))"
            - "Claim.cob_secondary_payment_cents == 3000"
            - "line patient_pay_cents == 7000 (allowed 10000 - plan 3000)"

      - name: abp_repricing_charges_patient_the_difference
        claim_type: Correct Result
        grounds:
          - calculations.allowed_amount_resolution
          - entities.ClaimLine.fields.abp_patient_difference_cents
          - entities.Plan.fields.abp_enabled
        distinguishing_aspect: "With abp_enabled and an alternate code, the line prices at the LESSER alternate allowance (6000 vs 9000 base) and the 3000 difference lands on the patient on top of normal cost share."
        test_recipe:
          setup:
            - "Standard stack except plan has abp_enabled=true and the schedule maps D2740 (allowed 10000) to alternate D2799 (allowed 6000)."
          setup_api_calls:
            - *c_clock
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-ABP", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: true }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - *c_plan_act
            - *c_prov
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D2740", allowed_cents: 10000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "D2799" }, { cdt_code: "D2799", allowed_cents: 6000, category: "MAJOR", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "14", submitted_amount_cents: 9000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { allowed: "$.data[0].allowed_cents", abp: "$.data[0].abp_applied", diff: "$.data[0].abp_patient_difference_cents", plan: "$.data[0].plan_pay_cents", patient: "$.data[0].patient_pay_cents" }
          assert:
            - "line abp_applied == true and allowed_cents == 6000 (alternate allowance, not the 9000 base)"
            - "line abp_patient_difference_cents == 3000 (base 9000 - alternate 6000)"
            - "line plan_pay_cents == 3000 (floor(6000*50/100))"
            - "line patient_pay_cents == 6000 (6000 - 3000 plan + 3000 ABP difference)"

      - name: missing_tooth_clause_denies_replacement
        claim_type: Correct Result
        grounds:
          - calculations.limitation_rule_evaluation
          - entities.Plan.fields.missing_tooth_clause_active
          - entities.Claim.fields.tooth_missing_prior_to_coverage
        distinguishing_aspect: "With the clause active and tooth 14 attested missing before coverage, a crown on tooth 14 is denied MISSING_TOOTH while the same crown on any other tooth pays normally."
        test_recipe:
          setup:
            - "Standard stack except plan has missing_tooth_clause_active=true."
          setup_api_calls:
            - *c_clock
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-MTC", plan_year_start_month: 1, annual_maximum_cents: 150000, deductible_cents: 0, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: true, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", tooth_missing_prior_to_coverage: { "14": true }, lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "14", submitted_amount_cents: 8000 }, { line_number: 2, cdt_code: "D2740", tooth_number: "15", submitted_amount_cents: 8000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { d1: "$.data[0].denial_code", s2: "$.data[1].status", p2: "$.data[1].plan_pay_cents" }
          assert:
            - "line 1 (tooth 14, attested missing prior to coverage): denial_code == MISSING_TOOTH and plan_pay_cents == 0"
            - "line 2 (tooth 15, not attested): status == PAYABLE and plan_pay_cents == 4000 (floor(8000*50/100))"
            - "claim status == ADJUDICATED (mixed outcome: not all lines denied)"

      - name: age_max_limitation_denies_sealant_over_age
        claim_type: Correct Result
        grounds:
          - calculations.limitation_rule_evaluation
          - entities.LimitationRule.fields.age_years_max
        distinguishing_aspect: "AGE_MAX uses whole years as of service_date: a 10-year-old dependent gets the sealant paid, a 15-year-old dependent is denied AGE_LIMIT — the rule reads Dependent.date_of_birth, not the subscriber's."
        test_recipe:
          setup:
            - "Standard stack plus LimitationRule D1351 AGE_MAX age_years_max=14, and schedule gains D1351 PREVENTIVE 4000."
            - "Two dependents: childA DOB 2015-06-01 (age 10 at service), childB DOB 2010-06-01 (age 15 at service)."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - call: "POST /dental/plans/${plan_id}/limitation-rules"
              payload: { cdt_code: "D1351", rule_kind: "AGE_MAX", window_months: 0, max_occurrences: 0, age_years_min: 0, age_years_max: 14 }
              as: PlanAdmin
            - *c_prov
            - call: "POST /dental/fee-schedules"
              payload: { tier: "PPO", effective_from: "2026-01-01T00:00:00Z", entries: [{ cdt_code: "D1351", allowed_cents: 4000, category: "PREVENTIVE", requires_attachment: false, abp_alternative_cdt: "" }] }
              as: NetworkManager
              captures: { fees_id: $.data.id }
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/subscribers/${sub_id}/dependents"
              payload: { full_name: "Child A", date_of_birth: "2015-06-01T00:00:00Z", relationship: "CHILD" }
              as: PlanAdmin
              captures: { dep_a: $.data.id }
            - call: "POST /dental/subscribers/${sub_id}/dependents"
              payload: { full_name: "Child B", date_of_birth: "2010-06-01T00:00:00Z", relationship: "CHILD" }
              as: PlanAdmin
              captures: { dep_b: $.data.id }
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", dependent_id: "${dep_a}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D1351", tooth_number: "19", submitted_amount_cents: 4000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_a: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", dependent_id: "${dep_b}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D1351", tooth_number: "19", submitted_amount_cents: 4000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_b: $.data.id }
            - call: "GET /dental/claims/${claim_a}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { a_status: "$.data[0].status", a_plan: "$.data[0].plan_pay_cents" }
            - call: "GET /dental/claims/${claim_b}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { b_denial: "$.data[0].denial_code" }
          assert:
            - "childA (age 10 <= 14): line PAYABLE with plan_pay_cents == 4000 (prev 100%)"
            - "childB (age 15 > 14): line denied with denial_code == AGE_LIMIT and claim status == DENIED"

      - name: replacement_interval_denies_early_crown_replacement
        claim_type: Correct Result
        grounds:
          - calculations.limitation_rule_evaluation
          - entities.LimitationRule.fields.window_months
          - entities.ClaimLine.fields.tooth_number
        distinguishing_aspect: "REPLACEMENT_INTERVAL keys on (patient, tooth_number): a second crown on tooth 9 within 60 months of a paid crown is denied FREQUENCY, while the same code on tooth 10 the same day pays — the rule is per-tooth, not per-patient."
        test_recipe:
          setup:
            - "Standard stack plus LimitationRule D2740 REPLACEMENT_INTERVAL window_months=60."
            - "Paid crown on tooth 9, service 2026-01-10."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - call: "POST /dental/plans/${plan_id}/limitation-rules"
              payload: { cdt_code: "D2740", rule_kind: "REPLACEMENT_INTERVAL", window_months: 60, max_occurrences: 0, age_years_min: 0, age_years_max: 0 }
              as: PlanAdmin
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-01-10T00:00:00Z", received_date: "2026-01-11T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "9", submitted_amount_cents: 8000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_1: $.data.id }
            - call: "POST /dental/claims/${claim_1}/pay"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2028-01-01T00:00:00Z", received_date: "2028-01-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2740", tooth_number: "9", submitted_amount_cents: 8000 }, { line_number: 2, cdt_code: "D2740", tooth_number: "10", submitted_amount_cents: 8000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_2: $.data.id }
            - call: "GET /dental/claims/${claim_2}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { d1: "$.data[0].denial_code", s2: "$.data[1].status" }
          assert:
            - "line 1 (tooth 9, 24 months after a paid crown on the same tooth, within the 60-month window): denial_code == FREQUENCY"
            - "line 2 (tooth 10, no prior history on that tooth): status == PAYABLE"
            - "claim 2 status == ADJUDICATED (mixed outcome)"

      - name: allowed_amount_is_min_of_submitted_and_schedule
        claim_type: Correct Result
        grounds:
          - calculations.allowed_amount_resolution
        distinguishing_aspect: "When the submitted charge (4500) is below the schedule allowance (5000), the allowed amount is the SUBMITTED charge — a plan never allows more than was billed."
        test_recipe:
          setup:
            - "Standard stack."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-02-01T00:00:00Z", received_date: "2026-02-02T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 4500 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /dental/claims/${claim_id}/lines"
              payload: {}
              as: ClaimsExaminer
              captures: { allowed: "$.data[0].allowed_cents", plan: "$.data[0].plan_pay_cents" }
          assert:
            - "line allowed_cents == 4500 (min(4500 submitted, 5000 schedule))"
            - "line plan_pay_cents == 4500 (prev 100% of allowed)"

      - name: plan_year_rollover_resets_deductible_accumulator
        claim_type: Correct Result
        grounds:
          - calculations.annual_max_accumulator
          - entities.Plan.fields.plan_year_start_month
          - entities.BenefitAccumulator.fields.plan_year_key
        distinguishing_aspect: "With plan_year_start_month=7, a claim on 2026-06-15 lands in plan-year 2025-2026 and a claim on 2026-07-15 lands in 2026-2027 — the deductible resets across the boundary, so both claims absorb the full 5000 deductible."
        test_recipe:
          setup:
            - "Standard stack except plan has plan_year_start_month=7 and deductible_cents=5000."
          setup_api_calls:
            - *c_clock
            - call: "POST /dental/plans"
              payload: { plan_code: "DD-PYR", plan_year_start_month: 7, annual_maximum_cents: 150000, deductible_cents: 5000, deductible_applies_preventive: false, preventive_coinsurance_pct: 100, basic_coinsurance_pct: 80, major_coinsurance_pct: 50, basic_waiting_months: 0, major_waiting_months: 0, missing_tooth_clause_active: false, abp_enabled: false }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-06-15T00:00:00Z", received_date: "2026-06-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "19", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_jun: $.data.id }
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-07-15T00:00:00Z", received_date: "2026-07-16T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D2391", tooth_number: "20", submitted_amount_cents: 10000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { claim_jul: $.data.id }
            - call: "GET /dental/subscribers/${sub_id}/accumulators"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "two BenefitAccumulator rows exist for the subscriber: plan_year_key \"2025-2026\" and \"2026-2027\""
            - "the 2025-2026 accumulator has deductible_met_cents == 5000 and annual_max_used_cents == 4000"
            - "the 2026-2027 accumulator has deductible_met_cents == 5000 and annual_max_used_cents == 4000 (deductible fully reset at the July boundary)"

  # ===========================================================================
  - section: validations
    instances:

      - name: timely_filing_rejects_claim_received_after_365_days
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_TIMELY_FILING
        distinguishing_aspect: "received_date 2027-01-05 is 369 days after service 2026-01-01 (> 365) — rejected 422 ERR_TIMELY_FILING at claim creation before any pricing occurs."
        test_recipe:
          setup:
            - "Standard stack."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
          trigger:
            - call: "POST /dental/claims"
              payload: { subscriber_id: "${sub_id}", provider_id: "${provider_id}", service_date: "2026-01-01T00:00:00Z", received_date: "2027-01-05T00:00:00Z", lines: [{ line_number: 1, cdt_code: "D0120", tooth_number: "", submitted_amount_cents: 5000 }] }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_TIMELY_FILING"
            - "GET /dental/claims?subscriber_id=${sub_id} returns 0 rows (no claim persisted)"

      - name: retroactive_predetermination_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors.ERR_RETROACTIVE_PREDETERMINATION
        distinguishing_aspect: "planned_service_date 2026-05-01 is before the logical clock 2026-06-01 — a predetermination cannot estimate treatment in the past."
        test_recipe:
          setup:
            - "Standard stack; logical clock advanced to 2026-06-01."
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_plan_act
            - *c_prov
            - *c_fees
            - *c_fees_act
            - *c_sub
            - call: "POST /dental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
