    input: { "license_state?": string, "directory_verified?": boolean, "status?": enum, "limit?": integer, "offset?": integer }
    output: Prescriber[]
    side_effects: []
    description: Paginated prescriber list.

  - method: POST
    path: /prescribers/{id}/suspend
    name: suspend_prescriber
    roles: [PlatformAdmin]
    code: 200
    input: {}
    output: Prescriber
    side_effects:
      - Sets status to SUSPENDED, blocking new verification requests to this prescriber.
    description: Suspends a prescriber.

  - method: POST
    path: /customers
    name: create_customer
    roles: [PlatformAdmin]
    code: 201
    input: { full_name: string, email: string, state_code: string, "insurance_plan_id?": uuid }
    output: Customer
    side_effects: []
    description: Registers a patient with all derived ledgers at zero and auto_reorder_enabled false.

  - method: GET
    path: /customers/{id}
    name: get_customer
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: {}
    output: Customer
    side_effects: []
    description: Reads one customer including every derived ledger field.

  - method: GET
    path: /customers
    name: list_customers
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: { "insurance_plan_id?": uuid, "state_code?": string, "auto_reorder_enabled?": boolean, "limit?": integer, "offset?": integer }
    output: Customer[]
    side_effects: []
    description: Paginated customer list filterable by plan.

  - method: GET
    path: /customers/{id}/ledger
    name: get_customer_ledger
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: {}
    output: { customer_id: uuid, lifetime_charged_cents: integer, lifetime_refunded_cents: integer, net_cash_position_cents: integer, store_credit_cents: integer, allowance_used_cents: integer, allowance_remaining_cents: integer, open_hold_count: integer, active_schedule_count: integer, auto_reorder_enabled: boolean }
    output_description: Computed read that recomputes every ledger from live rows so invariant drift is observable.
    side_effects: []
    description: Reconciled ledger view used by the money and allowance invariants.

  - method: POST
    path: /prescriptions
    name: create_prescription
    roles: [Customer, PlatformAdmin]
    code: 201
    input: { customer_id: uuid, product_id: uuid, capture_mode: enum, issue_date: date, expiry_date: date, od_sphere: decimal, os_sphere: decimal, base_curve: decimal, diameter: decimal, boxes_authorized_total: integer, "prescriber_id?": uuid, "supersedes_prescription_id?": uuid, "document_reference?": string, "self_reported_prescriber_name?": string }
    output: Prescription
    side_effects: []
    description: Captures a prescription in DRAFT.

  - method: GET
    path: /prescriptions/{id}
    name: get_prescription
    roles: [PlatformAdmin, ComplianceOfficer, Customer, Prescriber]
    code: 200
    input: {}
    output: Prescription
    side_effects: []
    description: Reads one prescription including version for optimistic concurrency.

  - method: GET
    path: /prescriptions
    name: list_prescriptions
    roles: [PlatformAdmin, ComplianceOfficer, Customer, Prescriber]
    code: 200
    input: { "customer_id?": uuid, "prescriber_id?": uuid, "product_id?": uuid, "supersedes_prescription_id?": uuid, "status?": enum, "limit?": integer, "offset?": integer }
    output: Prescription[]
    side_effects: []
    description: Paginated prescription list filterable by every foreign key including the self-reference.

  - method: POST
    path: /prescriptions/{id}/submit
    name: submit_prescription
    roles: [Customer, PlatformAdmin]
    code: 200
    input: {}
    output: Prescription
    side_effects:
      - UPLOAD captures move straight to VERIFIED_ACTIVE; other capture modes move to PENDING_VERIFICATION.
      - Appends a ComplianceEvent RX_SUBMITTED.
      - When supersedes_prescription_id is set, invalidates the superseded prescription and cancels its ACTIVE schedules.
    description: Branching submit fork.

  - method: POST
    path: /prescriptions/{id}/verification-requests
    name: send_verification_request
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: { prescriber_id: uuid }
    output: VerificationRequest
    side_effects:
      - Computes passive_deadline_at on the business-hour clock from the prescriber directory_verified flag.
      - Increments Prescription verification_rounds and moves CORRECTION_PENDING back to PENDING_VERIFICATION.
      - Appends a ComplianceEvent REQUEST_SENT.
    description: Opens a passive verification round.

  - method: GET
    path: /prescriptions/{id}/compliance-events
    name: list_compliance_events_for_prescription
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: { "event_type?": enum, "subject_type?": string, "limit?": integer, "offset?": integer }
    output: ComplianceEvent[]
    side_effects: []
    description: Append-only audit trail for the path prescription, ordered by occurred_at then insertion order.

  - method: POST
    path: /prescriptions/{id}/invalidate
    name: invalidate_prescription
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { reason: string }
    output: Prescription
    side_effects:
      - Moves the prescription to INVALIDATED, opens a MANUAL ReorderHold and recomputes the customer ledgers.
    description: Manual invalidation used when a correction round stalls.

  - method: GET
    path: /verification-requests/{id}
    name: get_verification_request
    roles: [PlatformAdmin, ComplianceOfficer, Prescriber]
    code: 200
    input: {}
    output: VerificationRequest
    side_effects: []
    description: Reads one verification request including passive_deadline_at.

  - method: GET
    path: /verification-requests
    name: list_verification_requests
    roles: [PlatformAdmin, ComplianceOfficer, Prescriber]
    code: 200
    input: { "prescription_id?": uuid, "prescriber_id?": uuid, "status?": enum, "limit?": integer, "offset?": integer }
    output: VerificationRequest[]
    side_effects: []
    description: Paginated verification request list filterable by prescription and prescriber.

  - method: POST
    path: /verification-requests/{id}/respond
    name: respond_to_verification_request
    roles: [Prescriber, PlatformAdmin]
    code: 200
    input: { response_type: enum, "corrected_od_sphere?": decimal, "corrected_os_sphere?": decimal, "note?": string }
    output: VerificationRequest
    side_effects:
      - CONFIRMED promotes the prescription and clears every RX_PENDING order on it.
      - CORRECTED overwrites the prescription spheres and moves it to CORRECTION_PENDING.
      - DENIED invalidates the prescription, blocks its PENDING orders, opens a PRESCRIBER_DENIED hold, pauses its ACTIVE schedules and recomputes the customer ledgers.
    description: Prescriber response inside the passive window.

  - method: POST
    path: /compliance/verification-sweep
    name: run_verification_sweep
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: {}
    output: { promoted_prescription_ids: "array[uuid]", timed_out_request_ids: "array[uuid]", expired_prescription_ids: "array[uuid]", holds_opened_count: integer, schedules_paused_count: integer }
    side_effects:
      - Step 1 promotes every prescription whose SENT request has reached its passive_deadline_at and clears their RX_PENDING orders.
      - Step 2 then expires every VERIFIED_ACTIVE prescription whose expiry_date has arrived, opens PRESCRIPTION_EXPIRED holds, blocks their PENDING orders and pauses their ACTIVE schedules.
      - Both steps append ComplianceEvents and recompute the affected customer ledgers.
    description: Deferred-action sweep whose two steps run in the stated order within one call, so a prescription can be promoted and expired by the same sweep.

  - method: POST
    path: /orders
    name: create_order
    roles: [Customer, FulfillmentOperator, PlatformAdmin]
    code: 201
    input: { customer_id: uuid, prescription_id: uuid, ordered_product_id: uuid, boxes_od: integer, boxes_os: integer, "itemized_receipt_reference?": string }
    output: Order
    side_effects:
      - Snapshots unit_price_cents and lenses_per_box_at_capture from the ordered product.
      - Computes subtotal_cents, shipping_cents and total_cents.
      - Sets fulfilled_product_id to ordered_product_id and verification_state from the prescription status, RX_CLEARED when VERIFIED_ACTIVE and RX_PENDING otherwise.
      - Increases Prescription boxes_consumed and Customer lifetime_charged_cents and net_cash_position_cents.
    description: Places a boxes order against a prescription.

  - method: GET
    path: /orders/{id}
    name: get_order
    roles: [PlatformAdmin, ComplianceOfficer, FulfillmentOperator, Customer]
    code: 200
    input: {}
    output: Order
    side_effects: []
    description: Reads one order including version for optimistic concurrency and both state dimensions.

  - method: GET
    path: /orders
    name: list_orders
    roles: [PlatformAdmin, ComplianceOfficer, FulfillmentOperator, Customer]
    code: 200
    input: { "customer_id?": uuid, "prescription_id?": uuid, "ordered_product_id?": uuid, "fulfilled_product_id?": uuid, "verification_state?": enum, "fulfillment_state?": enum, "limit?": integer, "offset?": integer }
    output: Order[]
    side_effects: []
    description: Paginated order list filterable by every foreign key and by each state dimension independently.

  - method: POST
    path: /orders/{id}/substitution
    name: apply_substitution
    roles: [FulfillmentOperator, PlatformAdmin]
    code: 200
    input: { substitute_product_id: uuid, expected_order_version: integer, "patient_consent?": boolean }
    output: Order
    side_effects:
      - Sets fulfilled_product_id, substitution_type, parameter_deviation_index, fulfilled_od_sphere and fulfilled_os_sphere.
      - Leaves unit_price_cents, subtotal_cents, shipping_cents and total_cents untouched because substitution is price-neutral.
      - Appends a ComplianceEvent SUBSTITUTION_APPLIED and increments the Order version.
    description: Swaps the fulfilled product within the equivalence and deviation rules under optimistic concurrency.

  - method: POST
    path: /orders/{id}/ship
    name: ship_order
    roles: [FulfillmentOperator, PlatformAdmin]
    code: 200
    input: {}
    output: Order
    side_effects:
      - Sets fulfillment_state to SHIPPED and shipped_at to the logical clock, leaving verification_state unchanged.
    description: Ships a cleared, unheld order.

  - method: POST
    path: /orders/{id}/deliver
    name: deliver_order
    roles: [FulfillmentOperator, PlatformAdmin]
    code: 200
    input: {}
    output: Order
    side_effects:
      - Sets fulfillment_state to DELIVERED and delivered_at, which anchors the claim window.
    description: Marks an order delivered.

  - method: POST
    path: /orders/{id}/cancel
    name: cancel_order
    roles: [Customer, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { cancellation_reason: enum }
    output: Order
    side_effects:
      - Sets fulfillment_state to CANCELLED and records cancellation_reason.
      - Decrements Prescription boxes_consumed by the ordered boxes.
      - Recomputes Customer lifetime_charged_cents and net_cash_position_cents.
      - Voids every ReimbursementClaim on the order in DRAFT, GENERATED or SUBMITTED, releasing consumed allowance.
      - Appends a ComplianceEvent ORDER_CANCELLED.
    description: Compensating cancellation that reverses every forward ledger effect of order creation.

  - method: POST
    path: /reorder-holds
    name: create_reorder_hold
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: { customer_id: uuid, prescription_id: uuid, reason: enum }
    output: ReorderHold
    side_effects:
      - Records opened_by_user_id from X-User-ID.
      - Increments Customer open_hold_count and recomputes auto_reorder_enabled.
      - Appends a ComplianceEvent HOLD_OPENED.
    description: Opens a compliance hold manually.

  - method: GET
    path: /reorder-holds/{id}
    name: get_reorder_hold
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: {}
    output: ReorderHold
    side_effects: []
    description: Reads one hold including opened_by_user_id.

  - method: GET
    path: /reorder-holds
    name: list_reorder_holds
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: { "customer_id?": uuid, "prescription_id?": uuid, "reason?": enum, "status?": enum, "limit?": integer, "offset?": integer }
    output: ReorderHold[]
    side_effects: []
    description: Paginated hold list filterable by customer and prescription.

  - method: POST
    path: /reorder-holds/{id}/release
    name: release_reorder_hold
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { "note?": string }
    output: ReorderHold
    side_effects:
      - Records released_by_user_id, which must differ from opened_by_user_id.
      - Decrements Customer open_hold_count and recomputes auto_reorder_enabled.
      - Appends a ComplianceEvent HOLD_RELEASED.
    description: Releases a hold under segregation of duties and only when no dispute is open.

  - method: POST
    path: /reorder-holds/{id}/escalate
    name: escalate_reorder_hold
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { escalated_reason: string }
    output: ReorderHold
    side_effects:
      - Moves the hold to ESCALATED, decrements Customer open_hold_count and recomputes auto_reorder_enabled.
      - Appends a ComplianceEvent HOLD_ESCALATED.
    description: Escalates a hold instead of releasing it, which also clears the fulfillment block.

  - method: POST
    path: /auto-reorder-schedules
    name: create_auto_reorder_schedule
    roles: [Customer, PlatformAdmin]
    code: 201
    input: { customer_id: uuid, prescription_id: uuid, product_id: uuid, boxes_per_run: integer, anchor_date: date, "cadence_basis?": enum, "observed_days_per_box?": integer }
    output: AutoReorderSchedule
    side_effects:
      - Computes cadence_days from the selected variant and next_run_at at 08:00Z.
      - Increments Customer active_schedule_count and recomputes auto_reorder_enabled.
    description: Starts a recurring shipment plan on a verified prescription.

  - method: GET
    path: /auto-reorder-schedules/{id}
    name: get_auto_reorder_schedule
    roles: [PlatformAdmin, ComplianceOfficer, FulfillmentOperator, Customer]
    code: 200
    input: {}
    output: AutoReorderSchedule
    side_effects: []
    description: Reads one schedule including cadence_days and next_run_at.

  - method: GET
    path: /auto-reorder-schedules
    name: list_auto_reorder_schedules
    roles: [PlatformAdmin, ComplianceOfficer, FulfillmentOperator, Customer]
    code: 200
    input: { "customer_id?": uuid, "prescription_id?": uuid, "product_id?": uuid, "status?": enum, "limit?": integer, "offset?": integer }
    output: AutoReorderSchedule[]
    side_effects: []
    description: Paginated schedule list filterable by every foreign key.

  - method: POST
    path: /auto-reorder-schedules/{id}/pause
    name: pause_auto_reorder_schedule
    roles: [Customer, PlatformAdmin]
    code: 200
    input: {}
    output: AutoReorderSchedule
    side_effects:
      - Sets pause_reason CUSTOMER_REQUEST and recomputes Customer active_schedule_count and auto_reorder_enabled.
    description: Customer-initiated pause.

  - method: POST
    path: /auto-reorder-schedules/{id}/resume
    name: resume_auto_reorder_schedule
    roles: [Customer, PlatformAdmin]
    code: 200
    input: {}
    output: AutoReorderSchedule
    side_effects:
      - Clears pause_reason, resets consecutive_skip_count to 0 and recomputes Customer active_schedule_count and auto_reorder_enabled.
    description: Resume, refused while any hold is open or the prescription is not VERIFIED_ACTIVE.

  - method: POST
    path: /auto-reorder-schedules/{id}/cancel
    name: cancel_auto_reorder_schedule
    roles: [Customer, PlatformAdmin]
    code: 200
    input: {}
    output: AutoReorderSchedule
    side_effects:
      - Moves the schedule to CANCELLED and recomputes Customer active_schedule_count and auto_reorder_enabled.
    description: Terminal cancellation from PAUSED.

  - method: POST
    path: /fulfillment/auto-reorder-run
    name: run_auto_reorder
    roles: [FulfillmentOperator, PlatformAdmin]
    code: 200
    input: {}
    output: { run_at: timestamp, shipped_order_ids: "array[uuid]", skipped_schedule_ids: "array[uuid]", paused_schedule_ids: "array[uuid]" }
    side_effects:
      - For every ACTIVE schedule whose next_run_at has arrived, creates and ships an order when the prescription is VERIFIED_ACTIVE, no hold is open and the remaining box authorization suffices.
      - Otherwise increments consecutive_skip_count, and pauses the schedule with pause_reason SKIP_LIMIT once it reaches MAX_CONSECUTIVE_SKIPS of 2.
      - Advances next_run_at by cadence_days on both paths and recomputes the customer ledgers.
    description: Deferred-action run of due schedules, processed in ascending next_run_at then created_at order.

  - method: POST
    path: /return-requests
    name: create_return_request
    roles: [Customer, PlatformAdmin]
    code: 201
    input: { order_id: uuid, customer_id: uuid, reason: enum, "unopened_boxes?": integer, "opened_box_used_counts?": "array[integer]", "torn_lens_count?": integer }
    output: ReturnRequest
    side_effects:
      - Derives settlement_mode from reason and previews settlement_cents and settlement_channel without moving money.
    description: Opens a torn-lens or prescription-change return.

  - method: GET
    path: /return-requests/{id}
    name: get_return_request
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: {}
    output: ReturnRequest
    side_effects: []
    description: Reads one return request including settlement_mode and settlement_cents.

  - method: GET
    path: /return-requests
    name: list_return_requests
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: { "order_id?": uuid, "customer_id?": uuid, "reason?": enum, "status?": enum, "limit?": integer, "offset?": integer }
    output: ReturnRequest[]
    side_effects: []
    description: Paginated return list filterable by order and customer.

  - method: POST
    path: /return-requests/{id}/approve
    name: approve_return_request
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: {}
    output: ReturnRequest
    side_effects:
      - Records approved_by_user_id and freezes settlement_mode and settlement_cents.
    description: Approval step of the two-person return workflow.

  - method: POST
    path: /return-requests/{id}/reject
    name: reject_return_request
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { rejection_reason: string }
    output: ReturnRequest
    side_effects:
      - Moves the request to REJECTED with no money movement.
    description: Rejects a return.

  - method: POST
    path: /return-requests/{id}/settle
    name: settle_return_request
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: {}
    output: ReturnRequest
    side_effects:
      - Records settled_by_user_id, which must differ from approved_by_user_id.
      - Credits store_credit_cents for STORE_CREDIT settlements or increases lifetime_refunded_cents for CASH_REFUND settlements, then recomputes net_cash_position_cents.
      - Sets refund_offset_cents on every DRAFT claim on the order.
    description: Settlement step of the two-person return workflow; this is where money moves.

  - method: POST
    path: /reimbursement-claims
    name: create_reimbursement_claim
    roles: [Customer, PlatformAdmin]
    code: 201
    input: { order_id: uuid, customer_id: uuid, insurance_plan_id: uuid }
    output: ReimbursementClaim
    side_effects:
      - Creates the claim in DRAFT with every money field null and refund_offset_cents seeded from settled returns on the order.
    description: Opens an out-of-network reimbursement claim.

  - method: GET
    path: /reimbursement-claims/{id}
    name: get_reimbursement_claim
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: {}
    output: ReimbursementClaim
    side_effects: []
    description: Reads one claim including all eight money steps.

  - method: GET
    path: /reimbursement-claims
    name: list_reimbursement_claims
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: { "order_id?": uuid, "customer_id?": uuid, "insurance_plan_id?": uuid, "status?": enum, "limit?": integer, "offset?": integer }
    output: ReimbursementClaim[]
    side_effects: []
    description: Paginated claim list filterable by every foreign key.

  - method: POST
    path: /reimbursement-claims/{id}/generate
    name: generate_reimbursement_claim
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: {}
    output: ReimbursementClaim
    side_effects:
      - Computes the eight money steps in order and sets packet_reference.
      - Increases Customer allowance_used_cents by applied_allowance_cents.
    description: Generates the reimbursement paperwork and consumes plan-year allowance.

  - method: POST
    path: /reimbursement-claims/{id}/submit
    name: submit_reimbursement_claim
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: {}
    output: ReimbursementClaim
    side_effects:
      - Sets submitted_at from the logical clock; allowance consumption is unchanged.
    description: Submits a generated packet inside the claim window.

  - method: POST
    path: /reimbursement-claims/{id}/void
    name: void_reimbursement_claim
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { voided_reason: enum }
    output: ReimbursementClaim
    side_effects:
      - Decreases Customer allowance_used_cents by applied_allowance_cents, releasing exactly what generation consumed.
      - Appends a ComplianceEvent CLAIM_VOIDED.
    description: Compensating void of a claim.

  - method: POST
    path: /prescriber-disputes
    name: file_prescriber_dispute
    roles: [Prescriber, PlatformAdmin]
    code: 201
    input: { prescription_id: uuid, prescriber_id: uuid, dispute_reason: enum, expected_prescription_version: integer }
    output: PrescriberDispute
    side_effects:
      - Appends a ComplianceEvent DISPUTE_FILED.
      - Blocks release of any open hold on the same prescription while the dispute is OPEN.
    description: Files a dispute under optimistic concurrency on the Prescription version.

  - method: GET
    path: /prescriber-disputes/{id}
    name: get_prescriber_dispute
    roles: [PlatformAdmin, ComplianceOfficer, Prescriber]
    code: 200
    input: {}
    output: PrescriberDispute
    side_effects: []
    description: Reads one dispute.

  - method: GET
    path: /prescriber-disputes
    name: list_prescriber_disputes
    roles: [PlatformAdmin, ComplianceOfficer, Prescriber]
    code: 200
    input: { "prescription_id?": uuid, "prescriber_id?": uuid, "status?": enum, "limit?": integer, "offset?": integer }
    output: PrescriberDispute[]
    side_effects: []
    description: Paginated dispute list filterable by prescription and prescriber.

  - method: POST
    path: /prescriber-disputes/{id}/resolve
    name: resolve_prescriber_dispute
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 200
    input: { resolution: enum }
    output: PrescriberDispute
    side_effects:
      - UPHELD invalidates the prescription, cancels its PENDING orders in created_at ascending order, recall-flags its SHIPPED and DELIVERED orders, voids the claims on the cancelled and recall-flagged orders and recomputes every affected customer ledger.
      - DISMISSED changes nothing outside the dispute row.
      - Appends a ComplianceEvent DISPUTE_RESOLVED either way.
    description: Deepest cascade in the system, or a no-op, depending on the resolution.

errors:
  - error_id: ERR_UNAUTHENTICATED
    status_code: 401
    message: Caller identity headers are missing.
  - error_id: ERR_UNAUTHORIZED
    status_code: 403
    message: Role may not perform this operation.
  - error_id: ERR_IDENTITY_MISMATCH
    status_code: 403
    message: Entity-backed caller does not own the addressed resource.
  - error_id: ERR_INVALID_REQUEST
    status_code: 400
    message: Request body or query parameters are malformed.
  - error_id: ERR_INVALID_STATE_TRANSITION
    status_code: 409
    message: Requested transition is not declared for the current state.
  - error_id: ERR_SEGREGATION_OF_DUTIES
    status_code: 409
    message: The same user may not perform both steps of this two-person workflow.
  - error_id: ERR_STALE_ORDER_VERSION
    status_code: 412
    message: expected_order_version does not match the stored Order version.
  - error_id: ERR_STALE_PRESCRIPTION_VERSION
    status_code: 412
    message: expected_prescription_version does not match the stored Prescription version.
  - error_id: ERR_INSURANCE_PLAN_NOT_FOUND
    status_code: 404
    message: Insurance plan does not exist.
  - error_id: ERR_PRODUCT_NOT_FOUND
    status_code: 404
    message: Product does not exist.
  - error_id: ERR_PRESCRIBER_NOT_FOUND
    status_code: 404
    message: Prescriber does not exist.
  - error_id: ERR_CUSTOMER_NOT_FOUND
    status_code: 404
    message: Customer does not exist.
  - error_id: ERR_PRESCRIPTION_NOT_FOUND
    status_code: 404
    message: Prescription does not exist.
  - error_id: ERR_VERIFICATION_REQUEST_NOT_FOUND
    status_code: 404
    message: Verification request does not exist.
  - error_id: ERR_ORDER_NOT_FOUND
    status_code: 404
    message: Order does not exist.
  - error_id: ERR_REORDER_HOLD_NOT_FOUND
    status_code: 404
    message: Reorder hold does not exist.
  - error_id: ERR_SCHEDULE_NOT_FOUND
    status_code: 404
    message: Auto-reorder schedule does not exist.
  - error_id: ERR_RETURN_REQUEST_NOT_FOUND
    status_code: 404
    message: Return request does not exist.
  - error_id: ERR_CLAIM_NOT_FOUND
    status_code: 404
    message: Reimbursement claim does not exist.
  - error_id: ERR_DISPUTE_NOT_FOUND
    status_code: 404
    message: Prescriber dispute does not exist.
  - error_id: ERR_DUPLICATE_EMAIL
    status_code: 409
    message: A customer with this email already exists.
  - error_id: ERR_DUPLICATE_LICENSE
    status_code: 409
    message: A prescriber with this license number already exists in this state.
  - error_id: ERR_EXPIRY_BEFORE_ISSUE
    status_code: 400
    message: expiry_date must be strictly after issue_date.
  - error_id: ERR_CAPTURE_MODE_REQUIRES_DOCUMENT
    status_code: 400
    message: UPLOAD capture requires document_reference.
  - error_id: ERR_CAPTURE_MODE_REQUIRES_PRESCRIBER
    status_code: 400
    message: DOCTOR_LOOKUP capture requires prescriber_id.
  - error_id: ERR_SELF_REPORT_REQUIRES_NAME
    status_code: 400
    message: SELF_REPORT capture requires self_reported_prescriber_name.
  - error_id: ERR_PRESCRIPTION_INTERVAL_OVERLAP
    status_code: 409
    message: Prescription validity interval overlaps an existing prescription that it does not supersede.
  - error_id: ERR_PRESCRIPTION_EXPIRED
    status_code: 409
    message: Prescription is expired.
  - error_id: ERR_PRESCRIPTION_NOT_VERIFIED
    status_code: 409
    message: Prescription is not VERIFIED_ACTIVE.
  - error_id: ERR_PRESCRIPTION_INVALIDATED
    status_code: 409
    message: Prescription has been invalidated.
  - error_id: ERR_PRESCRIBER_SUSPENDED
    status_code: 409
    message: Prescriber is suspended and cannot be contacted.
  - error_id: ERR_VERIFICATION_WINDOW_CLOSED
    status_code: 409
    message: The passive verification window has already closed.
  - error_id: ERR_PRESCRIBER_CONTACT_COOLDOWN
    status_code: 429
    message: This prescriber was already contacted about this prescription inside the cooldown window.
  - error_id: ERR_PRESCRIBER_REQUEST_CAPACITY
    status_code: 409
    message: Prescriber already has the maximum number of pending verification requests.
  - error_id: ERR_MAX_VERIFICATION_ROUNDS
    status_code: 409
    message: The verification round cap has been reached.
  - error_id: ERR_PARAMETER_DEVIATION_EXCEEDED
    status_code: 422
    message: Parameter deviation index exceeds the maximum allowed for any substitution.
  - error_id: ERR_CONSENT_REQUIRED
    status_code: 422
    message: This substitution requires explicit patient consent.
  - error_id: ERR_NO_EQUIVALENCE_MAPPING
    status_code: 422
    message: No active lens equivalence maps these products.
  - error_id: ERR_PRODUCT_INACTIVE
    status_code: 409
    message: Product is inactive.
  - error_id: ERR_OPEN_DISPUTE_BLOCKS_RELEASE
    status_code: 409
    message: A dispute on this prescription is still open.
  - error_id: ERR_HOLD_OPEN_BLOCKS_ACTION
    status_code: 409
    message: An open reorder hold blocks this action.
  - error_id: ERR_PLAN_RETIRED
    status_code: 409
    message: Insurance plan is retired.
  - error_id: ERR_PLAN_NOT_OUT_OF_NETWORK
    status_code: 422
    message: Only out-of-network plans support reimbursement claims.
  - error_id: ERR_ITEMIZED_RECEIPT_REQUIRED
    status_code: 422
    message: This plan requires an itemized receipt reference on the order.
  - error_id: ERR_CLAIM_WINDOW_CLOSED
    status_code: 409
    message: The claim window for this order has closed.
  - error_id: ERR_ALLOWANCE_EXHAUSTED
    status_code: 409
    message: No plan-year allowance remains.
  - error_id: ERR_BOX_AUTHORIZATION_EXCEEDED
    status_code: 409
    message: Requested boxes exceed the prescription authorization.
  - error_id: ERR_RETURN_QUANTITY_EXCEEDS_ORDER
    status_code: 422
    message: Returned quantities exceed what the order shipped.
  - error_id: ERR_REFUND_EXCEEDS_CAPTURE
    status_code: 409
    message: Settlement would refund more than the order captured.

roles:
  - name: Customer
    identity: entity_backed:Customer
    description: The patient. X-User-ID must equal the Customer id and may only address that customer's own prescriptions, orders, schedules, returns and claims.
    exclusive_operations:
      - POST /prescriptions
      - POST /prescriptions/{id}/submit
      - POST /auto-reorder-schedules
      - POST /auto-reorder-schedules/{id}/pause
      - POST /auto-reorder-schedules/{id}/resume
      - POST /auto-reorder-schedules/{id}/cancel
      - POST /return-requests
      - POST /reimbursement-claims
    shared_operations:
      - POST /orders
      - POST /orders/{id}/cancel
      - GET /orders/{id}
      - GET /prescriptions/{id}
      - GET /customers/{id}/ledger
  - name: Prescriber
    identity: entity_backed:Prescriber
    description: The eye-care provider. X-User-ID must equal the Prescriber id and may only respond to that prescriber's own verification requests and dispute prescriptions naming them.
    exclusive_operations:
      - POST /verification-requests/{id}/respond
      - POST /prescriber-disputes
    shared_operations:
      - GET /verification-requests/{id}
      - GET /verification-requests
      - GET /prescriptions/{id}
      - GET /prescriber-disputes/{id}
  - name: ComplianceOfficer
    identity: opaque
    description: Compliance staff. Opens verification rounds, runs sweeps, and performs one half of each two-person workflow; the other half must be performed by a different ComplianceOfficer X-User-ID.
    exclusive_operations:
      - POST /prescriptions/{id}/verification-requests
      - POST /prescriptions/{id}/invalidate
      - POST /compliance/verification-sweep
      - POST /reorder-holds
      - POST /reorder-holds/{id}/release
      - POST /reorder-holds/{id}/escalate
      - POST /return-requests/{id}/approve
      - POST /return-requests/{id}/reject
      - POST /return-requests/{id}/settle
      - POST /reimbursement-claims/{id}/generate
      - POST /reimbursement-claims/{id}/submit
      - POST /reimbursement-claims/{id}/void
      - POST /prescriber-disputes/{id}/resolve
    shared_operations:
      - GET /prescriptions/{id}/compliance-events
      - GET /orders
      - POST /orders/{id}/cancel
  - name: FulfillmentOperator
    identity: opaque
    description: Warehouse staff. Ships, delivers and substitutes; never touches compliance holds, claims or disputes.
    exclusive_operations:
      - POST /orders/{id}/substitution
      - POST /orders/{id}/ship
      - POST /orders/{id}/deliver
      - POST /fulfillment/auto-reorder-run
    shared_operations:
      - POST /orders
      - GET /orders/{id}
      - GET /products
      - GET /products/{id}/lens-equivalences
  - name: PlatformAdmin
    identity: opaque
    description: Operator of the platform. Owns reference-data setup and the logical clock, and may perform any other operation, but is still bound by segregation of duties on the two-person workflows.
    exclusive_operations:
      - POST /_clock/set_current_utc
      - POST /insurance-plans
      - POST /insurance-plans/{id}/retire
      - POST /products
      - POST /products/{id}/deactivate
      - POST /products/{id}/lens-equivalences
      - POST /prescribers
      - POST /prescribers/{id}/suspend
      - POST /customers
    shared_operations:
      - Every endpoint in this scaffold
