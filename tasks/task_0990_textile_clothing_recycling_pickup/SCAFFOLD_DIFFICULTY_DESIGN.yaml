            - "L3: fund held_cents == 0, paid_cents == 0, available_cents == 100000 (fully restored by the release)"
            - "pickup remains WEIGHED (${id} == WEIGHED) — no bubble-up revert is declared"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two dual-failure scenarios on
  # DIFFERENT error-category pairs: (state vs business_fiscal) and
  # (business_safety vs business_constraint).
