  # ============================================================== rbac
  - section: rbac
    instances:
      - name: customer_cannot_create_equipment
        claim_type: role_denial
        grounds: ["roles", "validations[priority=2]"]
        distinguishing_aspect: "Equipment creation is Manager-exclusive; Customer gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["One customer"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Role Play", email: "rp@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
          trigger:
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "170cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 60000, base_daily_rate_cents: 4000 }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_UNAUTHORIZED; HTTP 403"]

      - name: technician_cannot_resolve_damage
        claim_type: role_denial
        grounds: ["roles", "validations[priority=2]"]
        distinguishing_aspect: "Dispute resolution is Manager-exclusive (segregation from the technician who filed the assessment); Technician gets ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Rental returned; COSMETIC assessment INVOICED and then DISPUTED by the customer"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Seg Duty", email: "sd@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/equipment-items", payload: { gear_type: "SKI", size_label: "160cm", tier: "STANDARD", din_min: 2, din_max: 10, purchase_price_cents: 20000, base_daily_rate_cents: 3000 }, as: Manager, captures: { unit: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${cust}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${cust}", captures: { res: "$.data.id" } }
            - { call: "POST /shop/reservations/${res}/items", payload: { gear_type_requested: "SKI", tier_requested: "STANDARD" }, as: Customer, as_user_id: "${cust}", captures: { item: "$.data.id" } }
            - { call: "POST /shop/reservation-items/${item}/assign", payload: {}, as: FrontDesk }
            - { call: "POST /shop/reservations/${res}/confirm", payload: { deposit_authorized_cents: 2400 }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/pickup", payload: {}, as: FrontDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-12T17:00:00Z" }, as: Manager }
            - { call: "POST /shop/reservations/${res}/return", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments", payload: { reservation_id: "${res}", equipment_item_id: "${unit}", severity: "COSMETIC" }, as: Technician, captures: { dmg: "$.data.id" } }
            - { call: "POST /shop/damage-assessments/${dmg}/invoice", payload: {}, as: FrontDesk }
            - { call: "POST /shop/damage-assessments/${dmg}/dispute", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /shop/damage-assessments/${dmg}/resolve", payload: { resolution: "WAIVED" }, as: Technician, captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_UNAUTHORIZED; assessment stays DISPUTED"]

      - name: customer_cannot_read_others_reservation
        claim_type: role_denial
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Customer B reading Customer A's reservation is ERR_FORBIDDEN_OWNERSHIP (ownership check, distinct from role denial)."
        test_recipe:
          setup: ["Customer A with a reservation; Customer B exists"]
          setup_api_calls:
            - { call: "POST /shop/customers", payload: { full_name: "Own Er", email: "oa@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { ca: "$.data.id" } }
            - { call: "POST /shop/customers", payload: { full_name: "Pee Per", email: "pb@x.com", date_of_birth: "1992-05-20", height_cm: 168, weight_kg: 62, boot_sole_mm: 290, skier_type: "TYPE_1" }, as: FrontDesk, captures: { cb: "$.data.id" } }
            - { call: "POST /shop/reservations", payload: { customer_id: "${ca}", start_date: "2026-12-10", end_date: "2026-12-12", pickup_method: "SHOP" }, as: Customer, as_user_id: "${ca}", captures: { res: "$.data.id" } }
          trigger:
            - { call: "GET /shop/reservations/${res}", payload: {}, as: Customer, as_user_id: "${cb}", captures: { err: "$.data.error_id" } }
          assert: ["${err} == ERR_FORBIDDEN_OWNERSHIP; HTTP 403"]

      - name: manager_override_performs_technician_quote
        claim_type: role_allowance
        grounds: ["roles"]
        distinguishing_aspect: "Hierarchical override: Manager may perform the Technician-exclusive quote action and succeeds."
        test_recipe:
          setup: ["Clock 2026-12-01 with capacity; own-gear WAX ticket in INTAKE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T09:00:00Z" }, as: Manager }
            - { call: "POST /shop/shop-day-capacity", payload: { service_date: "2026-12-01", base_labor_minutes: 480, rush_reserved_minutes: 120 }, as: Manager }
            - { call: "POST /shop/customers", payload: { full_name: "Man Agement", email: "mg@x.com", date_of_birth: "1996-01-15", height_cm: 175, weight_kg: 70, boot_sole_mm: 300, skier_type: "TYPE_2" }, as: FrontDesk, captures: { cust: "$.data.id" } }
            - { call: "POST /shop/tune-tickets", payload: { customer_id: "${cust}", own_gear_description: "own skis", services: ["WAX"], rush: false }, as: Customer, as_user_id: "${cust}", captures: { tk: "$.data.id" } }
          trigger:
            - { call: "POST /shop/tune-tickets/${tk}/quote", payload: {}, as: Manager, captures: { st: "$.data.status", qp: "$.data.quoted_price_cents" } }
          assert: ["${st} == QUOTED; ${qp} == 2500 (Manager override succeeds)"]

