scaffold_corner_design:

  # =====================================================================
  # Section 1: Entities — creation, retrieval, listing, required fields,
  # defaults, computed fields, system fields, type constraints, parent
  # relationships, FK integrity
  # =====================================================================
  - section: entities
    instances:
      - name: member_create_with_required_fields_returns_201
        claim_type: creation
        grounds:
          - entities.Member
          - endpoints[POST /members]
        distinguishing_aspect: "POST /members with full_name, email, home_property_id (valid Property) returns 201 with computed fields defaulted: tier_status=GOLD, tier_credits_ytd=0, tier_credits_lifetime=0, exclusion_status=NOT_EXCLUDED, velocity_status=NORMAL, assigned_host_id=null, version=1."
        test_recipe:
          setup:
            - "One Property exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "Alice K", email: "alicek@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { m_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "Member.${m_id}.tier_status == GOLD"
            - "Member.${m_id}.tier_credits_ytd == 0"
            - "Member.${m_id}.tier_credits_lifetime == 0"
            - "Member.${m_id}.exclusion_status == NOT_EXCLUDED"
            - "Member.${m_id}.velocity_status == NORMAL"
            - "Member.${m_id}.assigned_host_id == null"
            - "Member.${m_id}.version == 1"

      - name: member_get_by_unknown_id_returns_404
        claim_type: not_found
        grounds:
          - entities.Member
          - endpoints[GET /members/{id}]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /members/{non-existent UUID} → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["No member with target id exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MemberServices
              as_user_id: "ms_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: member_list_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /members]
          - response_envelope
        distinguishing_aspect: "GET /members returns paginated list with limit/offset/total_count/has_more in the envelope."
        test_recipe:
          setup: ["At least one member exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "P", email: "p@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
          trigger:
            - call: "GET /members"
              payload: {}
              as: MemberServices
              as_user_id: "ms_1"
          assert:
            - "response.status_code == 200"
            - "response.data.total_count >= 1"
            - "response.data.has_more in {true, false}"

      - name: member_create_missing_email_returns_400
        claim_type: required_fields
        grounds:
          - entities.Member.fields.email
          - endpoints[POST /members]
        distinguishing_aspect: "Omitting required field email → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A Property exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "NoMail", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.status_code == 400"

      - name: gaming_session_invalid_game_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.GamingSession.fields.game_type
          - endpoints[POST /gaming-sessions]
        distinguishing_aspect: "Invalid enum value for game_type (e.g., 'BACCARAT') → ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Member + Property exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "G", email: "g@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /gaming-sessions"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", started_at: "2026-02-01T10:00:00Z", ended_at: "2026-02-01T11:00:00Z", game_type: "BACCARAT", theoretical_loss_cents: 10000 }
              as: MemberServices
              as_user_id: "ms_1"
          assert:
            - "response.status_code == 400"

      - name: property_get_member_fk_reverse_reachability
        claim_type: parent_relationships
        grounds:
          - entities.Member.fields.home_property_id
          - endpoints[GET /properties/{id}/members]
        distinguishing_aspect: "FK reverse-reachability: GET /properties/{id}/members returns array of Members whose home_property_id == {id}."
        test_recipe:
          setup: ["One Property + two Members assigned to it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "P1", email: "p1@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
            - call: "POST /members"
              payload: { full_name: "P2", email: "p2@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
          trigger:
            - call: "GET /properties/${prop_id}/members"
              payload: {}
              as: MemberServices
              as_user_id: "ms_1"
          assert:
            - "response.status_code == 200"
            - "response.data.total_count == 2"

  # =====================================================================
  # Section 2: State Machines — initial state, valid transitions,
  # invalid-from rejection, terminal lockdown, idempotency
  # =====================================================================
  - section: state_machines
    instances:
      - name: comp_room_booking_initial_state_is_pending
        claim_type: initial_state
        grounds:
          - state_machines.CompRoomBooking
        distinguishing_aspect: "A freshly-created CompRoomBooking has status=PENDING."
        test_recipe:
          setup: ["Property + PLATINUM member"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Init", email: "init@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { m_id: $.data.id }
            - call: "POST /gaming-sessions"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", started_at: "2026-02-15T01:00:00Z", ended_at: "2026-02-15T02:00:00Z", game_type: "SLOTS", theoretical_loss_cents: 1500000 }
              as: MemberServices
              as_user_id: "ms_1"
            - call: "GET /members/${m_id}"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /comp-room-bookings"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", check_in: "2026-03-15T15:00:00Z", check_out: "2026-03-16T11:00:00Z", expected_member_version: "${m_v}" }
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { bk_id: $.data.id }
          assert:
            - "CompRoomBooking.${bk_id}.status == PENDING"

      - name: comp_room_booking_check_in_from_pending_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.CompRoomBooking.PENDING_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cannot /check-in directly from PENDING — must be CONFIRMED first. Trigger from PENDING returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["PLATINUM member with PENDING CompRoomBooking"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Inv", email: "inv@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { m_id: $.data.id }
            - call: "POST /gaming-sessions"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", started_at: "2026-02-20T01:00:00Z", ended_at: "2026-02-20T02:00:00Z", game_type: "SLOTS", theoretical_loss_cents: 1500000 }
              as: MemberServices
              as_user_id: "ms_1"
            - call: "GET /members/${m_id}"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { m_v: $.data.version }
            - call: "POST /comp-room-bookings"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", check_in: "2026-03-20T15:00:00Z", check_out: "2026-03-21T11:00:00Z", expected_member_version: "${m_v}" }
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /comp-room-bookings/${bk_id}/check-in"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: comp_room_booking_terminal_completed_cannot_be_cancelled
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CompRoomBooking
        distinguishing_aspect: "Once status=COMPLETED, /cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A CompRoomBooking that has reached COMPLETED via check-in then check-out"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Term", email: "term@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { m_id: $.data.id }
            - call: "POST /gaming-sessions"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", started_at: "2026-03-01T01:00:00Z", ended_at: "2026-03-01T02:00:00Z", game_type: "SLOTS", theoretical_loss_cents: 1500000 }
              as: MemberServices
              as_user_id: "ms_1"
            - call: "GET /members/${m_id}"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { m_v: $.data.version }
            - call: "POST /comp-room-bookings"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", check_in: "2026-04-01T15:00:00Z", check_out: "2026-04-02T11:00:00Z", expected_member_version: "${m_v}" }
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { bk_id: $.data.id }
            - call: "POST /comp-room-bookings/${bk_id}/confirm"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T16:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /comp-room-bookings/${bk_id}/check-in"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T12:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /comp-room-bookings/${bk_id}/check-out"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
          trigger:
            - call: "POST /comp-room-bookings/${bk_id}/cancel"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_booking_from_already_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CompRoomBooking
        distinguishing_aspect: "Second /cancel on an already-CANCELLED booking returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A PENDING booking has been cancelled once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "C1", email: "c1@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /comp-room-bookings"
              payload: { member_id: "${m_id}", property_id: "${prop_id}", check_in: "2026-04-05T15:00:00Z", check_out: "2026-04-06T11:00:00Z", expected_member_version: "${m_v}" }
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { bk_id: $.data.id }
            - call: "POST /comp-room-bookings/${bk_id}/cancel"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
          trigger:
            - call: "POST /comp-room-bookings/${bk_id}/cancel"
              payload: {}
              as: LoyaltyManager
              as_user_id: "lm_1"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: host_assignment_self_approve_blocked_by_sod
        claim_type: precondition_enforcement
        grounds:
          - state_machines.HostAssignment.PENDING_APPROVAL_to_ACTIVE
        distinguishing_aspect: "Same LoyaltyManager X-User-ID cannot both create and approve the same HostAssignment (segregation_of_duties)."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / host_assignment_approve_requires_host_active
          rationale: "Asserted as the trigger of that §1.8 instance."

      - name: annual_reset_execute_before_due_returns_reset_not_due
        claim_type: precondition_enforcement
        grounds:
          - state_machines.AnnualResetRun.SCHEDULED_to_EXECUTED
          - errors[ERR_RESET_NOT_DUE]
        distinguishing_aspect: "Executing AnnualResetRun before current_utc reaches scheduled_for returns ERR_RESET_NOT_DUE."
        test_recipe:
          setup: ["A SCHEDULED AnnualResetRun with scheduled_for in the future"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /annual-reset-runs"
              payload: { reset_year: 2027, scheduled_for: "2028-01-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /annual-reset-runs/${ar_id}/execute"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status_code == 422"
            - "response.data.error_id == ERR_RESET_NOT_DUE"

  # =====================================================================
  # Section 3: Calculations — correct result, constants applied,
  # precision, variant divergence, dual-variant reconciliation
  # =====================================================================
  - section: calculations
    instances:
      - name: tier_credit_accrual_diamond_slots_correct
        claim_type: correct_result
        grounds:
          - calculations.tier_credit_accrual
        distinguishing_aspect: "DIAMOND member, SLOTS, theoretical_loss_cents=500000 → tier_credits_earned == 7500.00 (5000 * 1.0 * 1.5)."
        test_recipe:
          setup: ["DIAMOND member m_dia at Property"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-LV", market_segment: "VEGAS_STRIP", base_room_rate_cents: 30000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "D", email: "d@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { mdia_id: $.data.id }
            # Promote to DIAMOND: SLOTS GOLD 1.0 mult; need 75000 ytd to reach DIAMOND.
            # theor_loss=7500000 cents -> base=75000.00 * 1.0 = 75000.00 -> DIAMOND threshold hit.
            - call: "POST /gaming-sessions"
              payload: { member_id: "${mdia_id}", property_id: "${prop_id}", started_at: "2026-02-01T01:00:00Z", ended_at: "2026-02-01T02:00:00Z", game_type: "SLOTS", theoretical_loss_cents: 7500000 }
              as: MemberServices
              as_user_id: "ms_1"
          trigger:
            - call: "POST /gaming-sessions"
              payload: { member_id: "${mdia_id}", property_id: "${prop_id}", started_at: "2026-02-01T03:00:00Z", ended_at: "2026-02-01T04:00:00Z", game_type: "SLOTS", theoretical_loss_cents: 500000 }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { s_id: $.data.id, s_tc: $.data.tier_credits_earned }
          assert:
            - "GamingSession.${s_id}.tier_credits_earned == 7500.00"

      - name: comp_room_rate_gold_member_regional_property_provisional
        claim_type: correct_result
        grounds:
          - calculations.comp_room_rate
        distinguishing_aspect: "GOLD member, REGIONAL property, base=20000 cents → step_a=18000, step_b=18000 (mult=1.00)."
        test_recipe:
          setup: ["GOLD member m_g + REGIONAL Property base=20000"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /properties"
              payload: { name: "CP-Reg", market_segment: "REGIONAL", base_room_rate_cents: 20000 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { prop_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "G", email: "gg@x.com", home_property_id: "${prop_id}" }
              as: MemberServices
              as_user_id: "ms_1"
              captures: { mg_id: $.data.id, mg_v: $.data.version }
          trigger:
            - call: "POST /comp-room-bookings"
              payload: { member_id: "${mg_id}", property_id: "${prop_id}", check_in: "2026-03-10T15:00:00Z", check_out: "2026-03-11T11:00:00Z", expected_member_version: "${mg_v}" }
              as: LoyaltyManager
              as_user_id: "lm_1"
              captures: { bk_id: $.data.id }
          assert:
            - "CompRoomBooking.${bk_id}.provisional_rate_cents == 18000"
            - "CompRoomBooking.${bk_id}.nights == 1"
            - "CompRoomBooking.${bk_id}.total_charge_cents == 18000"

      - name: tier_credit_accrual_per_session_rounding_precision
        claim_type: precision
        grounds:
          - calculations.tier_credit_accrual.precision
        distinguishing_aspect: "Per-session round_half_up to 2 decimals; PLATINUM SLOTS, theor_loss_cents=333 → tier_credits_earned==4.16."
        test_recipe:
          setup: ["PLATINUM member"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-12T00:00:00Z" }
              as: ComplianceOfficer
