  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_term_closed_interval_touching_endpoints_overlap
        grounds:
          - validations[priority=15]
          - entities.Contract.fields.term_start
          - entities.Contract.fields.term_end
        distinguishing_aspect: |
          CLOSED-interval semantics on the Contract resource: a new contract for
          a player whose new term_start (2026-12-31) equals an existing ACTIVE
          contract's term_end (2026-12-31) is rejected — touching endpoints count
          as overlap (ERR_CONTRACT_TERM_OVERLAP).
        test_recipe:
          setup:
            - "Player P FREE_AGENT after waiving is NOT used; here P holds one ACTIVE contract on T1 with term [2026-01-01, 2026-12-31]."
            - "Two teams T1 and T2 so the second sign is a fresh ACTIVE contract on a different team for the SAME player."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T1", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t1_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T2", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t2_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t1_id}", player_id: "${p_id}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t1_id}"
          trigger:
            - call: "POST /contracts"
              payload: { team_id: "${t2_id}", player_id: "${p_id}", base_salary_cents: 6000000, contract_type: "STANDARD", term_start: "2026-12-31T00:00:00.000Z", term_end: "2027-06-30T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CONTRACT_TERM_OVERLAP"
      - name: stint_half_open_interval_adjacency_allowed
        grounds:
          - validations[priority=16]
          - entities.Stint.fields.starts_at
          - entities.Stint.fields.ends_at
        distinguishing_aspect: |
          HALF-OPEN-interval semantics on the Stint resource (different geometry
          from the closed Contract term): a new stint whose starts_at equals an
          existing stint's ends_at is ACCEPTED (adjacency allowed, 201), proving
          the boundary treatment differs from the touching-overlap Contract rule.
        test_recipe:
          setup:
            - "Team T, player P on an ACTIVE TWO_WAY contract C; one existing stint [2026-03-01T00:00:00Z, 2026-03-10T00:00:00Z) on C."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 4000000, contract_type: "TWO_WAY", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /stints"
              payload: { contract_id: "${c_id}", starts_at: "2026-03-01T00:00:00.000Z", ends_at: "2026-03-10T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /stints"
              payload: { contract_id: "${c_id}", starts_at: "2026-03-10T00:00:00.000Z", ends_at: "2026-03-20T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
              captures: { stint2_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Stint.${stint2_id}.starts_at == 2026-03-10T00:00:00.000Z"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_assess_then_waive_conserves_penalty_points
        grounds:
          - state_machines.Fine.transitions.ASSESSED_to_WAIVED
          - entities.Team.fields.penalty_points
        distinguishing_aspect: |
          Conserved quantity = Team.penalty_points. Invariant pinned as
          team.penalty_points == sum(f.penalty_points for f in Fine where
          f.team_id == team.id and f.status == ASSESSED). Assess (+2) then waive
          (-2) returns penalty_points to its starting value 0.
        test_recipe:
          setup:
            - "Season; team T with penalty_points=0; player P signed on T."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000, penalty_threshold: 3 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 5000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /fines"
              payload: { team_id: "${t_id}", player_id: "${p_id}", amount_cents: 50000, penalty_points: 2 }
              as: LeagueCommissioner
              captures: { fine_id: $.data.id }
            - call: "POST /fines/${fine_id}/waive"
              as: LeagueCommissioner
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { pts_after: $.data.penalty_points }
          assert:
            - "Team.${t_id}.penalty_points == 0"
            - "Team.${t_id}.posture == OPEN"
      - name: contract_sign_then_waive_conserves_cap_payroll
        grounds:
          - state_machines.Contract.transitions.ACTIVE_to_WAIVED
          - calculations.active_payroll
          - entities.Team.fields.payroll_active_cents
        distinguishing_aspect: |
          Different conserved quantity = Team.payroll_active_cents, pinned as
          sum(c.base_salary_cents for c in Contract where c.team_id==team.id and
          c.status==ACTIVE and cap_counts(c)). Signing a STANDARD contract
          (+7000000) then waiving it (-7000000) returns payroll to its starting 0.
        test_recipe:
          setup:
            - "Season; team T with one ACTIVE STANDARD contract base_salary_cents=7000000 (payroll_active_cents=7000000); player P signed."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "T", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { t_id: $.data.id }
            - call: "POST /players"
              payload: { season_id: "${season_id}", handle: "p" }
              as: LeagueCommissioner
              captures: { p_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${t_id}", player_id: "${p_id}", base_salary_cents: 7000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "GET /teams/${t_id}"
              as: LeagueCommissioner
              captures: { t_v: $.data.version }
          trigger:
            - call: "POST /contracts/${c_id}/waive"
              payload: { expected_team_version: "${t_v}" }
              as: TeamGM
              as_user_id: "${t_id}"
            - call: "GET /teams/${t_id}/payroll"
              as: LeagueCommissioner
              captures: { payroll_after: $.data.payroll_active_cents }
          assert:
            - "before waive Team.${t_id}.payroll_active_cents == 7000000"
            - "after waive Team.${t_id}.payroll_active_cents == 0"

