            - { call: "POST /api/suppliers/${sup_id}/parts", payload: { part_number: "PN-IC", description: "module", critical: false }, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { part_id: "$.data.id" } }
            - { call: "POST /api/supplier-parts/${part_id}/receive", payload: { quantity: 100 }, as: SupplierQualityEngineer, as_user_id: "sqe-1" }
            - { call: "POST /api/device-lots", payload: { lot_number: "LT-IC", dmr_id: "${dmr_id}", validation_protocol_id: "${proto_id}", quantity: 10, manufactured_at: "2026-08-02T00:00:00Z" }, as: ProductionOperator, as_user_id: "po-1", captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/device-lots/${lot_id}/components", payload: { supplier_part_id: "${part_id}", quantity_used: 10, supplier_lot_number: "SL-IC" }, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot_id}/complete", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
            - { call: "POST /api/device-lots/${lot_id}/record-sterility-result", payload: { result: "PASSED" }, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/device-lots/${lot_id}/udi-labels", payload: { udi_di: "12345678901231" }, as: ProductionOperator, as_user_id: "po-1", captures: { lbl_id: "$.data.id" } }
            - { call: "POST /api/udi-labels/${lbl_id}/approve", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/udi-labels/${lbl_id}/print", payload: {}, as: ProductionOperator, as_user_id: "po-1" }
          trigger:
            - { call: "POST /api/device-lots/${lot_id}/release", payload: {}, as: QualityManager, as_user_id: "qm-bob", captures: { disp: "$.data.disposition_status" } }
            - { call: "GET /api/supplier-parts/${part_id}", payload: {}, as: SupplierQualityEngineer, as_user_id: "sqe-1", captures: { committed: "$.data.quantity_committed", released: "$.data.quantity_in_released_lots" } }
          assert:
            - "release response itself: disposition_status == RELEASED"
            - "immediately after: SupplierPart.${part_id}.quantity_committed == 0 and quantity_in_released_lots == 10 (no async reconciliation)"
