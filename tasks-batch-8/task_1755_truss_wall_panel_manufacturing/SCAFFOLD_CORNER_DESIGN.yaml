# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner Design (Coverage Index)
# Truss & Wall-Panel Manufacturing. Breadth coverage of every testable claim
# in §1.1–§1.7 not already covered by §1.8. Sections follow the claim-extraction
# guide. All chains start from empty DB; logical clock default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_customer_applies_documented_defaults
        claim_type: defaults
        grounds: ["entities.CustomerAccount.fields.storage_free_days", "entities.CustomerAccount.fields.max_drops_per_day"]
        distinguishing_aspect: "Omitting optional fields yields exactly the documented defaults; computed credit_used_cents starts at 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Defaults Co", credit_limit_cents: 500000, delivery_terms: "FOB_PLANT" }, as: PlantManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "GET /plant/customer-accounts/${cust}", as: PlantManager }
          assert:
            - "CustomerAccount.${cust}.credit_hold == false and storage_free_days == 2 and storage_daily_fee_cents == 15000 and storage_fee_cap_cents == 300000 and max_drops_per_day == 2"
            - "CustomerAccount.${cust}.credit_used_cents == 0 (computed field initialized)"
            - "CustomerAccount.${cust}.version == 1 and id is a prefix-free UUID"

      - name: create_job_window_inverted_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["entities.Job.fields.delivery_window_end", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "delivery_window_end < delivery_window_start violates the entity constraint -> 400 before any state exists."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Bad Window", jobsite_address: "1 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-27T00:00:00Z", delivery_window_end: "2026-08-20T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and HTTP status 400"
            - "GET /plant/jobs?customer_id=${cust} returns total_count == 0 (nothing persisted)"

      - name: computed_and_system_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Job.fields.posture", "entities.Job.fields.status", "entities.Job.fields.invoiced_cents"]
        distinguishing_aspect: "Client-supplied posture/status/invoiced_cents on create are ignored; server computes all three."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Override Attempt", jobsite_address: "2 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000, posture: "BLOCKED", status: "COMPLETED", invoiced_cents: 99999999 }, as: PlantManager, captures: { job: $.data.id } }
          assert:
            - "Job.${job}.status == QUOTED (client COMPLETED ignored)"
            - "Job.${job}.posture == GREEN (client BLOCKED ignored)"
            - "Job.${job}.invoiced_cents == 0 and credit_issued_cents == 0"

      - name: create_lumber_lot_missing_dimension_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["entities.InventoryLot.fields.lumber_dimension", "validations[priority=5]"]
        distinguishing_aspect: "Conditional input rule: lot_kind LUMBER without lumber_dimension -> 400; PLATE lot with received_board_feet > 0 -> 400."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0 }, as: InventoryManager, captures: { err1: $.data.error_id } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "PLATE", plate_class: "P20", received_plates: 100, received_board_feet: 10.0 }, as: InventoryManager, captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_REQUEST (lumber_dimension missing for LUMBER)"
            - "${err2} == ERR_INVALID_REQUEST (received_board_feet must be 0 for PLATE)"

      - name: jig_setup_immutability_surface
        claim_type: immutability
        grounds: ["entities.JigSetup"]
        distinguishing_aspect: "JigSetup carries common_fields: false — reads expose id and created_at but no version and no updated_at; no update/transition endpoint exists for it."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jig: $.data.id } }
          trigger:
            - { call: "GET /plant/jig-setups/${jig}", as: PlantManager }
          assert:
            - "response data has keys id and created_at and NOT version / updated_at (common_fields false)"
            - "JigSetup.${jig}.changeover_minutes_from == {} as created"

      - name: fk_reverse_lookup_designs_by_job
        claim_type: parent_relationships
        grounds: ["entities.ComponentDesign.fields.job_id", "entities.ComponentDesign.fields.supersedes_design_id"]
        distinguishing_aspect: "Filtered list GET /plant/designs?job_id= returns exactly the job's designs; supersedes_design_id filter returns [] before any revision exists."
        test_recipe:
          setup: ["customer, engineer, confirmed job, one DRAFT design"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "FK Job", jobsite_address: "3 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
          trigger:
            - { call: "GET /plant/designs", payload: { job_id: "${job}" }, as: PlantManager, captures: { hit: $.data.0.id } }
            - { call: "GET /plant/designs", payload: { supersedes_design_id: "${dsg}" }, as: PlantManager }
          assert:
            - "GET /plant/designs?job_id=${job} returns total_count == 1 and data[0].id == ${dsg}"
            - "GET /plant/designs?supersedes_design_id=${dsg} returns total_count == 0 (empty array, not error)"

      - name: list_pagination_defaults_and_offsets
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "Default limit 10 with has_more/total_count; offset 10 returns the remaining 2 with has_more false; default sort created_at ASC."
        test_recipe:
          setup: ["twelve engineers registered"]
          setup_api_calls:
            - { call: "POST /plant/engineers", payload: { full_name: "E01", license_number: "PE-01", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E02", license_number: "PE-02", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E03", license_number: "PE-03", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E04", license_number: "PE-04", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E05", license_number: "PE-05", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E06", license_number: "PE-06", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E07", license_number: "PE-07", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E08", license_number: "PE-08", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E09", license_number: "PE-09", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E10", license_number: "PE-10", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E11", license_number: "PE-11", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
            - { call: "POST /plant/engineers", payload: { full_name: "E12", license_number: "PE-12", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_ONLY" }, as: PlantManager }
          trigger:
            - { call: "GET /plant/engineers", as: PlantManager }
            - { call: "GET /plant/engineers", payload: { offset: 10 }, as: PlantManager }
          assert:
            - "first page: 10 items, total_count == 12, has_more == true, ordered created_at ASC (E01 first)"
            - "second page (offset 10): 2 items, total_count == 12, has_more == false"

  - section: state_machines
    instances:
      - name: initial_states_sweep
        claim_type: initial_state
        grounds: ["state_machines.Job", "state_machines.ComponentDesign", "state_machines.InventoryLot", "state_machines.CraneSlot"]
        distinguishing_aspect: "Freshly created job/design/lot/slot read back exactly their declared initial states; lot availability initializes to received quantities."
        test_recipe:
          setup: ["customer, engineer, job, DRAFT design, lumber lot, crane with one slot"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Init Job", jobsite_address: "4 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0 }, as: InventoryManager, captures: { lot: $.data.id } }
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-C", capacity_lbs: 8000, crane_class: "STANDARD", hourly_rate_cents: 15000 }, as: PlantManager, captures: { cr: $.data.id, cr_v: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { slot: $.data.id } }
          trigger:
            - { call: "GET /plant/jobs/${job}", as: PlantManager }
            - { call: "GET /plant/inventory-lots/${lot}", as: InventoryManager }
          assert:
            - "Job.${job}.status == QUOTED and posture == GREEN"
            - "ComponentDesign.${dsg}.status == DRAFT and revision_no == 1"
            - "InventoryLot.${lot}.status == ACTIVE and available_bf == 500.00 and reserved_bf/consumed_bf/scrapped_bf == 0"
            - "CraneSlot.${slot}.status == BOOKED"

      - name: terminal_lockdown_design_void_and_slot_cancelled
        claim_type: invalid_transition
        grounds: ["state_machines.ComponentDesign", "state_machines.CraneSlot.BOOKED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal VOID (design) and CANCELLED (slot), every further trigger is rejected; no side effects fire."
        test_recipe:
          setup: ["design voided from DRAFT; slot cancelled from BOOKED"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Lock Job", jobsite_address: "5 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "VOID" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-C", capacity_lbs: 8000, crane_class: "STANDARD", hourly_rate_cents: 15000 }, as: PlantManager, captures: { cr: $.data.id, cr_v: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { slot: $.data.id } }
            - { call: "POST /plant/crane-slots/${slot}/transition", payload: { to_state: "CANCELLED" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { err1: $.data.error_id } }
            - { call: "POST /plant/crane-slots/${slot}/transition", payload: { to_state: "COMPLETED" }, as: ProductionPlanner, captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_INVALID_STATE (VOID is terminal); ComponentDesign.${dsg}.status remains VOID"
            - "${err2} == ERR_INVALID_STATE (CANCELLED is terminal); CraneSlot.${slot}.status remains CANCELLED"

      - name: design_seal_skip_state_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ComponentDesign.SEAL_REQUESTED_to_SEALED"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / seal_state_beats_safety"
          rationale: "DRAFT -> SEALED skip rejected with ERR_DESIGN_NOT_AWAITING_SEAL is the failure path of the named §1.8 instance."

      - name: batch_qc_rework_loop_with_posture
        claim_type: valid_transition
        grounds: ["state_machines.ProductionBatch.BUILT_to_QC_FAILED", "state_machines.ProductionBatch.QC_FAILED_to_REWORK", "state_machines.ProductionBatch.REWORK_to_QC_PASSED", "calculations.job_posture_derivation"]
        distinguishing_aspect: "Cyclic QC loop: BUILT -> QC_FAILED -> REWORK -> QC_PASSED; job posture flips AT_RISK while in the loop and returns GREEN on QC_PASSED; STAGED reachable afterwards via completed build pick."
        test_recipe:
          setup: ["production preamble: job IN_PRODUCTION, cl1 RELEASED and fully reserved, bat1 CUTTING with both lines marked cut, ASSEMBLY, BUILT"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 100000000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "QC Job", jobsite_address: "6 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 1000000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jig_roof: $.data.id } }
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-HEAVY", capacity_lbs: 30000, crane_class: "HEAVY", hourly_rate_cents: 20000 }, as: PlantManager, captures: { craneh: $.data.id, craneh_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 32.0, pitch_degrees: 26.57, design_load_psf: 40.0, lumber_grade: "SPF_MSR2400", plating: "P20", quantity_required: 10, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg1: $.data.id } }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg1}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg1}/cut-lists", payload: { jig_setup_id: "${jig_roof}", lines: [ { member_label: "TC-1", dimension: "L2X6", length_ft: 12.0, qty: 10 }, { member_label: "BC-1", dimension: "L2X4", length_ft: 20.0, qty: 5 } ] }, as: ProductionPlanner, captures: { cl1: $.data.id } }
            - { call: "POST /plant/cut-lists/${cl1}/release", as: ProductionPlanner }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X6", lumber_grade: "SPF_MSR2400", received_board_feet: 500.0 }, as: InventoryManager, captures: { lot6: $.data.id, lot6_v: $.data.version } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "LUMBER", lumber_dimension: "L2X4", lumber_grade: "SPF_MSR2400", received_board_feet: 400.0 }, as: InventoryManager, captures: { lot4: $.data.id, lot4_v: $.data.version } }
            - { call: "POST /plant/inventory-lots", payload: { lot_kind: "PLATE", plate_class: "P20", received_plates: 1000 }, as: InventoryManager, captures: { plot: $.data.id, plot_v: $.data.version } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}", dimension: "L2X6" }, as: ProductionPlanner, captures: { line1: $.data.0.id } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl1}", dimension: "L2X4" }, as: ProductionPlanner, captures: { line2: $.data.0.id } }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot6}", cut_list_line_id: "${line1}", reserved_bf: 126.00, expected_lot_version: "${lot6_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${lot4}", cut_list_line_id: "${line2}", reserved_bf: 72.67, expected_lot_version: "${lot4_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/material-reservations", payload: { lot_id: "${plot}", cut_list_id: "${cl1}", reserved_plates: 280, expected_lot_version: "${plot_v}" }, as: ProductionPlanner }
            - { call: "POST /plant/jobs/${job}/batches", payload: { cut_list_id: "${cl1}", jig_setup_id: "${jig_roof}", requested_completion_at: "2026-08-15T00:00:00Z" }, as: ProductionPlanner, captures: { bat1: $.data.id } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${craneh}", purpose: "BUILD_PICK", production_batch_id: "${bat1}", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T12:00:00Z", expected_crane_version: "${craneh_v}" }, as: ProductionPlanner, captures: { slotA: $.data.id } }
            - { call: "POST /plant/crane-slots/${slotA}/transition", payload: { to_state: "COMPLETED" }, as: ProductionPlanner }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "CUTTING" }, as: ShopFloorLead }
            - { call: "POST /plant/cut-list-lines/${line1}/mark-cut", as: ShopFloorLead }
            - { call: "POST /plant/cut-list-lines/${line2}/mark-cut", as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "ASSEMBLY" }, as: ShopFloorLead }
            - { call: "POST /plant/batches/${bat1}/transition", payload: { to_state: "BUILT" }, as: ShopFloorLead }
          trigger:
