              as: ProgramOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AUTHORITY_POSTURE (Authority SUSPENDED blocks issue even though the notice is legally DRAFT)"
            - "EnrollmentNotice.status remains DRAFT; account_count_noticed == 0"
      - name: billing_line_gated_by_account_enrollment
        grounds:
          - state_machines.ServiceAccount.ENROLLED_to_OPTED_BACK_TO_BUNDLED
          - validations[priority=12]
          - endpoints: "POST /cca/billing-extracts/{id}/lines"
        distinguishing_aspect: |
          Entity pair BillingLine -> ServiceAccount (different pair than
          EnrollmentNotice -> Authority): line posting requires the referenced account
          to be ENROLLED; an account that just transitioned ENROLLED ->
          OPTED_BACK_TO_BUNDLED rejects new lines even though the extract is legally DRAFT.
        test_recipe:
          setup:
            - "Authority ACTIVE; account ENROLLED via wave, then opts back to bundled (OPT_BACK_TO_BUNDLED election)"
            - "Extract E2 in DRAFT for 2026-06"
