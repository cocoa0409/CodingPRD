            - { call: "POST /v1/channels", payload: { name: "Ch SC", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P2", reporting_tier: "PREMIUM" }, as: PlatformAdmin, captures: { p2: $.data.id } }
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "PATCH /v1/distributor-platforms/${p2}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag1: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p2}", rev_share_bps_below: 2500, rev_share_bps_above: 3500, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag2: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag2}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/revenue-reports", payload: { channel_id: "${ch}", platform_id: "${p1}", period_month: "2026-09" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { rp1: $.data.id } }
            - { call: "POST /v1/revenue-reports", payload: { channel_id: "${ch}", platform_id: "${p2}", period_month: "2026-09" }, as: FinanceAnalyst, as_user_id: "fin-1", captures: { rp2: $.data.id } }
          trigger:
            - { call: "GET /v1/revenue-reports", payload: {}, as: DistributorPartner, as_user_id: "${p2}" }
