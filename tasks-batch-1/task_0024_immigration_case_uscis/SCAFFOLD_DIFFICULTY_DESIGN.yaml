  # =========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 instances, different interval semantics + resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: same_case_two_biometrics_window_overlap_halfopen_interval
        grounds:
          - validations[priority=13]
          - errors[id=ERR_APPT_OVERLAP_SAME_CASE]
          - state_machines.BiometricsAppointment
          - endpoints."POST /uscis/cases/{id}/biometrics"
        distinguishing_aspect: |
          Half-open window semantics [start, start+60min): two BiometricsAppointment slots on the
          SAME case at 2026-07-01T15:00Z and 2026-07-01T15:30Z geometrically intersect (the second
          starts mid-window of the first) and the second is rejected with ERR_APPT_OVERLAP_SAME_CASE.
          Resource: Case (per-case appointment uniqueness). Window arithmetic on a fixed-length
          duration with strict-open end.
        test_recipe:
          setup:
            - "I-485 case post-file with one existing SCHEDULED biometrics at 2026-07-01T15:00:00Z (60-min window)."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A121212121", full_name: "N Overlap", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "n@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-07-01T15:00:00Z", asc_location_code: "ASC-SF-07" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { biom_a_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-07-01T15:30:00Z", asc_location_code: "ASC-SF-08" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == 'ERR_APPT_OVERLAP_SAME_CASE'"
            - "BiometricsAppointment.${biom_a_id}.status == 'SCHEDULED'"

      - name: asc_location_point_instant_collision_capacity_one_resource_asc
        grounds:
          - validations[priority=14]
          - errors[id=ERR_ASC_SLOT_TAKEN]
          - entities.BiometricsAppointment.fields.asc_location_code
        distinguishing_aspect: |
          Different interval semantics from instance #1: this rule uses POINT-INSTANT collision
          (NOT a half-open window). Two SCHEDULED BiometricsAppointment rows for DIFFERENT cases
          with the EXACT SAME scheduled_at at the SAME ASC location collide regardless of any
          window duration. Resource: ASC location (cross-case shared capacity-of-1), distinct
          from instance #1's per-case scope.
