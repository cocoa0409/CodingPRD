            - call: "POST /disputes/${d1_id}/decide"
              payload: { decision: "UPHOLD", decision_note: "Self-review attempt by the member." }
              as: DisputeArbiter
              as_user_id: "${m1_id}"
              captures: { e4: $.data.error_id }
            - call: "POST /disputes/${d1_id}/decide"
              payload: { decision: "REJECT", decision_note: "Independent review: the 150/case card was applied correctly." }
              as: DisputeArbiter
              as_user_id: "arbiter-02"
              captures: { d1_final: $.data.status }
          assert:
            - "call 1: 403 with error_id == ERR_SEGREGATION_OF_DUTIES — the member id that opened the dispute cannot request evidence from itself, even while presenting the DisputeArbiter role"
            - "call 2: 200 with status == EVIDENCE_REQUESTED for the uninvolved arbiter-01"
            - "call 4: 403 with error_id == ERR_SEGREGATION_OF_DUTIES — dual-01 is batch ${b1_id}.accrued_by_user_id, recorded while acting as RebateAnalyst"
            - "call 5: 403 with error_id == ERR_SEGREGATION_OF_DUTIES — dual-02 is accrual ${a1_id}.validated_by_user_id"
            - "call 6: 403 with error_id == ERR_SEGREGATION_OF_DUTIES — the opener is barred from deciding, and UPHOLD versus REJECT makes no difference to the gate"
            - "after calls 4, 5 and 6 the dispute is still OPEN with decided_by_user_id == null and decision_note == null, and RebateAccrual.${a1_id} is still DISPUTED"
            - "call 7: 200 — arbiter-02 matches none of the three recorded ids, so the dispute becomes REJECTED with decided_by_user_id == arbiter-02 and the accrual is restored to VALIDATED (its accrual_status_before)"
            - "Member.${m1_id}.dispute_reversal_count == 0 and reconciliation_posture == CLEAR: the three refusals and the REJECT decision move no money and no counter"

  - section: cross_cutting_complexity_layers
    instances:

      - name: rate_card_create_with_a_stale_contracted_item_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.rate-card-create-stale-item
          - validations[priority=10]
          - errors.ERR_STALE_PARENT_VERSION
        distinguishing_aspect: |
          The OCC token is the PARENT item's version, and that version moves for
          two different reasons: every rate-card create bumps it by exactly one,
          and so does every approve. So a caller who read the item once, created a
          card, and then reuses the same token is stale, and a caller who read
          after the create but before an approve is stale too. A refused 412 must
          leave the item version untouched, otherwise the client can never
          converge.
        test_recipe:
          setup:
            - "Deal PBC-2026 exists with ContractedItem PBC-PATTY-4OZ at version 1 and approved_rate_card_count 0."
          setup_api_calls:
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v1: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v1}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-03-31" }
              as: GpoAdmin
              captures: { card1_id: $.data.id }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v1}", rate_type: "PER_CASE", flat_rate_cents_per_case: 160, effective_from: "2026-04-01", effective_to: "2026-06-30" }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v2: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 160, effective_from: "2026-04-01", effective_to: "2026-06-30" }
              as: GpoAdmin
              captures: { card2_id: $.data.id }
            - call: "POST /rate-cards/${card1_id}/approve"
              as: GpoAdmin
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v2}", rate_type: "PER_CASE", flat_rate_cents_per_case: 170, effective_from: "2026-07-01", effective_to: "2026-09-30" }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /contracted-items/${item_id}"
              as: GpoAdmin
              captures: { item_v4: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v4}", rate_type: "PER_CASE", flat_rate_cents_per_case: 170, effective_from: "2026-07-01", effective_to: "2026-09-30" }
              as: GpoAdmin
              captures: { card3_id: $.data.id }
          assert:
            - "call 1: ${item_v1} == 1 on a freshly created item"
            - "call 2: 201 and ContractedItem.${item_id}.version becomes 2 — a successful create bumps the parent by exactly 1"
            - "call 3: 412 with error_id == ERR_STALE_PARENT_VERSION — the token the client read before call 2 is now one behind"
            - "call 4: ${item_v2} == 2, so the refused call 3 did NOT bump the parent version and created no RateCard row"
            - "call 5: 201 with a non-overlapping window, taking ContractedItem.${item_id}.version to 3"
            - "call 6: 200 and ContractedItem.${item_id}.version becomes 4 with approved_rate_card_count 1 — approve also moves the OCC token, and RateCard.${card1_id}.pinned_item_version == 3, the version observed at approval"
            - "call 7: 412 with error_id == ERR_STALE_PARENT_VERSION — token 2 is two writes behind, and the 412 is returned even though the requested window overlaps nothing"
            - "call 8: ${item_v4} == 4"
            - "call 9: 201 — with the current token the same card body is accepted, taking the version to 5"
            - "GET /rate-cards with contracted_item_id == ${item_id} returns total_count == 3: the two 412s created nothing"

      - name: claim_restatement_with_a_stale_deal_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.claim-restatement-stale-deal
          - validations[priority=10]
          - validations[priority=14]
        distinguishing_aspect: |
          The second OCC rule guards a different parent with a different mover:
          every claim create bumps the DEAL's version, and so does an unrelated
          admin action like suspend. The pair of trailing calls separates the two
          gates that can both fire on the same request — with a stale token on a
          SUSPENDED deal the answer is the 412 (priority 10), and only once the
          token is current does the 409 ERR_DEAL_NOT_OPEN_FOR_CHANGES surface.
        test_recipe:
          setup:
            - "Deal PBC-2026 is ACTIVE (item PBC-PATTY-4OZ with one APPROVED PER_CASE card)."
          setup_api_calls:
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: GpoAdmin
              captures: { card_id: $.data.id }
            - call: "POST /rate-cards/${card_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
          trigger:
            - call: "GET /manufacturer-deals/${deal_id}"
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { deal_v1: $.data.version }
            - call: "POST /manufacturer-claims"
              payload: { deal_id: "${deal_id}", expected_deal_version: "${deal_v1}", period_start: "2026-06-01", period_end: "2026-06-30", claimed_units: 30, claimed_amount_cents: 4500 }
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { cl1_id: $.data.id }
            - call: "POST /manufacturer-claims"
              payload: { deal_id: "${deal_id}", expected_deal_version: "${deal_v1}", period_start: "2026-07-01", period_end: "2026-07-31", claimed_units: 40, claimed_amount_cents: 6000 }
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { e1: $.data.error_id }
            - call: "GET /manufacturer-deals/${deal_id}"
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { deal_v2: $.data.version }
            - call: "POST /manufacturer-claims"
              payload: { deal_id: "${deal_id}", expected_deal_version: "${deal_v2}", period_start: "2026-07-01", period_end: "2026-07-31", claimed_units: 40, claimed_amount_cents: 6000 }
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { cl2_id: $.data.id }
            - call: "POST /manufacturer-deals/${deal_id}/suspend"
              as: GpoAdmin
            - call: "GET /manufacturer-deals/${deal_id}"
              as: GpoAdmin
              captures: { deal_v3: $.data.version }
            - call: "POST /manufacturer-claims"
              payload: { deal_id: "${deal_id}", expected_deal_version: "${deal_v2}", period_start: "2026-08-01", period_end: "2026-08-31", claimed_units: 10, claimed_amount_cents: 1500 }
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { e2: $.data.error_id }
            - call: "POST /manufacturer-claims"
              payload: { deal_id: "${deal_id}", expected_deal_version: "${deal_v3}", period_start: "2026-08-01", period_end: "2026-08-31", claimed_units: 10, claimed_amount_cents: 1500 }
              as: ManufacturerRep
              as_user_id: "rep-01"
              captures: { e3: $.data.error_id }
          assert:
            - "call 2: 201 with status == SUBMITTED, and ManufacturerDeal.${deal_id}.version == ${deal_v1} + 1 — a claim create moves its parent deal"
            - "call 3: 412 with error_id == ERR_STALE_PARENT_VERSION — the rep's own previous claim invalidated the token it was holding"
            - "call 4: ${deal_v2} == ${deal_v1} + 1, proving the 412 did not bump the version and stored no claim"
            - "call 5: 201 for the same July body once the token is refreshed"
            - "call 6: 200 with status == SUSPENDED, and ${deal_v3} == ${deal_v2} + 2 (one bump from call 5, one from the suspend)"
            - "call 8: 412 with error_id == ERR_STALE_PARENT_VERSION and NOT ERR_DEAL_NOT_OPEN_FOR_CHANGES — the deal is SUSPENDED and the token is stale, and priority 10 outranks priority 14"
            - "call 9: 409 with error_id == ERR_DEAL_NOT_OPEN_FOR_CHANGES — with a current token the state gate finally answers, which is what proves both gates were live in call 8"
            - "GET /manufacturer-claims with deal_id == ${deal_id} returns total_count == 2"

      - name: reconciliation_posture_flips_only_on_the_second_upheld_reversal
        claim_type: rate_threshold_triggers
        grounds:
          - entities.ProgramTier.reversal_posture_limit
          - entities.Member.dispute_reversal_count
          - endpoints[POST /disputes/{dispute_id}/decide]
        distinguishing_aspect: |
          The posture threshold is CUMULATIVE and its default limit is 2, so the
          first upheld reversal must leave the member CLEAR with payout_hold false
          while the second flips it — an implementation that flips on any reversal
          passes the §1.8 limit-1 instance and fails here. The flip is also
          one-way: a later SUSPENDED -> ACTIVE reactivation clears payout_hold but
          must NOT clear RESTRICTED.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z; ProgramTier ELITE created WITHOUT reversal_posture_limit, so it defaults to 2."
            - "Member Harbor Grill is ACTIVE with an ACTIVE letter from METRO-01; deal PBC-2026 is ACTIVE with an APPROVED PER_CASE card at 150 cents."
            - "Batch METRO-2026-06 carries a 30-case line and a 40-case line for that member and has been ACCRUED by analyst-01, producing accruals ${a1_id} (member_share 3274) and ${a2_id} (member_share 4365)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: GpoAdmin
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id, posture_limit: $.data.reversal_posture_limit }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", signatory_name: "Dana Reyes", scope: "PURCHASE_DATA_AND_PRICING" }
              as: GpoAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /authorization-letters/${l1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: GpoAdmin
              captures: { card_id: $.data.id }
            - call: "POST /rate-cards/${card_id}/approve"
              as: GpoAdmin
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88213", vendor_item_description: "BEEF PATTY 4OZ 40CT", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { line1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88213", vendor_item_description: "BEEF PATTY 4OZ 40CT", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 40, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8540, invoice_date: "2026-06-19" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { line2_id: $.data.id }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "POST /purchase-batches/${b1_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "GET /accruals"
              payload: { purchase_line_id: "${line1_id}" }
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /accruals"
              payload: { purchase_line_id: "${line2_id}" }
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { a2_id: "$.data[0].id" }
          trigger:
            - call: "POST /disputes"
              payload: { accrual_id: "${a1_id}", reason_code: "RATE_MISMATCH", disputed_amount_cents: 3274 }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /disputes/${d1_id}/decide"
              payload: { decision: "UPHOLD", decision_note: "First reversal: wrong rate applied." }
              as: DisputeArbiter
              as_user_id: "arbiter-01"
            - call: "GET /members/${m1_id}"
              as: GpoAdmin
              captures: { posture_after_1: $.data.reconciliation_posture, hold_after_1: $.data.payout_hold }
            - call: "POST /disputes"
              payload: { accrual_id: "${a2_id}", reason_code: "UNITS_MISMATCH", disputed_amount_cents: 4365 }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /disputes/${d2_id}/decide"
              payload: { decision: "UPHOLD", decision_note: "Second reversal: units overstated." }
              as: DisputeArbiter
              as_user_id: "arbiter-01"
            - call: "GET /members/${m1_id}"
              as: GpoAdmin
              captures: { posture_after_2: $.data.reconciliation_posture, hold_after_2: $.data.payout_hold }
            - call: "POST /compliance-reviews"
              payload: { member_id: "${m1_id}", deal_id: "${deal_id}", window_start: "2026-07-01", window_end: "2026-07-31" }
              as: GpoAdmin
              captures: { review_id: $.data.id, review_result: $.data.result }
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
              captures: { posture_after_reactivation: $.data.reconciliation_posture, hold_after_reactivation: $.data.payout_hold }
          assert:
            - "setup: ${posture_limit} == 2 — the tier payload omitted reversal_posture_limit, so the default applies"
            - "call 2: dispute ${d1_id} is UPHELD and accrual ${a1_id} is REVERSED with reversal_reason == DISPUTE_UPHELD"
            - "call 3 (BELOW the threshold): dispute_reversal_count == 1, ${posture_after_1} == CLEAR and ${hold_after_1} == false — one reversal is not enough"
            - "call 3: the counters moved by exactly the reversed accrual's components — accrued_member_share_cents == 4365, attributed_gpo_retention_cents == 1455, attributed_admin_fee_cents == 180"
            - "call 5: dispute ${d2_id} is UPHELD and accrual ${a2_id} is REVERSED"
            - "call 6 (AT the threshold): dispute_reversal_count == 2, ${posture_after_2} == RESTRICTED and ${hold_after_2} == true"
            - "call 6: PurchaseBatch.${b1_id}.payout_hold == true — the flip cascades to the ACCRUED batch that still holds this member's lines"
            - "call 6: all three money counters are back to 0, and both accruals keep their own member_share_cents (3274 and 4365) — a reversal decrements the member, it does not rewrite the accrual"
            - "call 7: ${review_result} == BREACH — committed_spend_prorated_cents == round_half_up(20000000 * 31 / 365) == 1698630 against contracted_spend_cents == 0 (no July lines), purchase_ratio_bps == 0, and window_days 31 < the deal's required_purchase_window_days 60 so DEAL_LOST cannot fire — which drives the member ACTIVE -> SUSPENDED"
            - "call 8: enrollment_status == ACTIVE and ${hold_after_reactivation} == false, but ${posture_after_reactivation} == RESTRICTED — the threshold flip is one-way and reactivation never clears it"
            - "a third dispute is still creatable afterwards: RESTRICTED is a posture, not a lock"

      - name: the_four_hop_dispute_upheld_cascade_reaches_every_dependent_row
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /disputes/{dispute_id}/decide]
        excluded_because:
          difficulty_instance: transitive_cascade / dispute_upheld_four_hop_ledger_and_posture_cascade
          rationale: "That §1.8 instance walks the whole layer end to end — dispute -> accrual -> the three member counters and dispute_reversal_count -> posture, payout_hold and the ACCRUED batch's payout_hold — and pins the ordering plus the untouched sibling accrual, which is exactly the N-level chain this layer asks for."

      - name: both_accrual_variants_produce_their_declared_totals
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.rebate_gross
        excluded_because:
          difficulty_instance: dual_variant_calc / accrual_marginal_batch_vs_blended_period_rebase
          rationale: "That §1.8 instance computes MARGINAL_BATCH at accrue time and BLENDED_PERIOD at close-period on the same lines, pins both gross values and the signed final_adjustment_cents delta on the switch, and covers the layer's 'delta on switch is correct' claim."

  - section: consistency_model
    instances:

      - name: every_write_is_visible_in_its_own_response_and_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.data
        distinguishing_aspect: |
          The consistency model is immediate, so an action's OWN response body must
          already carry the counters it just recomputed (the batch returned by
          audit-markup already shows overbilled_cents, the letter returned by
          countersign already shows ACTIVE), and the very next read of every OTHER
          row the write touched must be current with no second call, no polling
          and no refresh step. The recipe reads each dependent row exactly once,
          immediately after the write that changed it.
        test_recipe:
          setup:
            - "Clock 2026-08-01T09:00:00Z; ProgramTier ELITE; Distributor METRO-01; Member Harbor Grill PENDING with a SUBMITTED letter."
            - "Deal PBC-2026 is ACTIVE with an APPROVED PER_CASE card at 150 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: GpoAdmin
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", signatory_name: "Dana Reyes", scope: "PURCHASE_DATA_AND_PRICING" }
              as: GpoAdmin
              captures: { l1_id: $.data.id }
            - call: "POST /manufacturer-deals"
              payload: { manufacturer_name: "Prairie Beef Co", deal_code: "PBC-2026", effective_from: "2026-01-01", effective_to: "2026-12-31", required_purchase_window_days: 60 }
              as: GpoAdmin
              captures: { deal_id: $.data.id }
            - call: "POST /contracted-items"
              payload: { deal_id: "${deal_id}", manufacturer_sku: "PBC-PATTY-4OZ", normalized_item_key: "BEEF-PATTY-4OZ-CS40", pack_size: 40, baseline_unit_cost_cents: 9800, contract_unit_cost_cents: 8900 }
              as: GpoAdmin
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /rate-cards"
              payload: { contracted_item_id: "${item_id}", expected_contracted_item_version: "${item_v}", rate_type: "PER_CASE", flat_rate_cents_per_case: 150, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: GpoAdmin
              captures: { card_id: $.data.id }
            - call: "POST /rate-cards/${card_id}/approve"
              as: GpoAdmin
              captures: { pinned_v: $.data.pinned_item_version }
            - call: "POST /manufacturer-deals/${deal_id}/activate"
              as: GpoAdmin
          trigger:
            - call: "POST /authorization-letters/${l1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { l1_status: $.data.status }
            - call: "GET /members/${m1_id}"
              as: GpoAdmin
              captures: { letters_after_countersign: $.data.active_letter_count }
            - call: "GET /distributors/${dist_id}"
              as: GpoAdmin
              captures: { dist_letters: $.data.active_letter_count }
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88213", vendor_item_description: "BEEF PATTY 4OZ 40CT", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { line1_id: $.data.id, line_extended: $.data.invoice_extended_cents }
            - call: "GET /purchase-batches/${b1_id}"
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { batch_lines: $.data.line_count, batch_cases: $.data.total_cases_ingested, batch_unmatched: $.data.unmatched_cases }
            - call: "POST /purchase-batches/${b1_id}/normalize"
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { matched_after_normalize: $.data.matched_cases }
            - call: "GET /purchase-lines/${line1_id}"
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { line_match_status: $.data.match_status }
            - call: "POST /purchase-batches/${b1_id}/accrue"
              as: RebateAnalyst
              as_user_id: "analyst-01"
            - call: "GET /members/${m1_id}"
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { ms_after_accrue: $.data.accrued_member_share_cents }
            - call: "POST /purchase-batches/${b1_id}/audit-markup"
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { batch_overbilled: $.data.overbilled_cents, batch_audit: $.data.audit_status }
            - call: "GET /purchase-lines/${line1_id}"
              as: RebateAnalyst
              as_user_id: "analyst-01"
              captures: { line_overbilled: $.data.overbilled_cents }
          assert:
            - "call 1's OWN response already carries ${l1_status} == ACTIVE and a non-null countersigned_at == 2026-08-01T09:00:00.000Z — no follow-up read is needed to see the transition"
            - "call 2 (the very next read): ${letters_after_countersign} == 1 — the member counter written by call 1 is already visible"
            - "call 3: ${dist_letters} == 1 — the second row the same write touched is equally current"
            - "call 6's OWN response carries ${line_extended} == 274200 == 30 * 9140, match_status == UNMATCHED, contracted_item_id == null and accrual_block_reason == NONE"
            - "call 7 (immediately after the line create): ${batch_lines} == 1, ${batch_cases} == 30 and ${batch_unmatched} == 30 — the parent's three counters all moved inside the child's create"
            - "call 8's OWN response carries ${matched_after_normalize} == 30 and unmatched_cases == 0, computed during that same request"
            - "call 9: ${line_match_status} == MATCHED with contracted_item_id == ${item_id} — the per-line result of the batch-level calculation is readable at once"
            - "call 11 right after the accrue: ${ms_after_accrue} == 3274, so the member ledger moved inside the accrue call and not in a later sweep"
            - "call 12's OWN response carries ${batch_overbilled} == 300 and ${batch_audit} == AUDIT_OVERBILLED"
            - "call 13: ${line_overbilled} == 300 — the per-line figure the batch total was summed from is already stored"
            - "no read in this recipe is ever repeated to obtain a fresh value: every assertion holds on the FIRST read after the write"
