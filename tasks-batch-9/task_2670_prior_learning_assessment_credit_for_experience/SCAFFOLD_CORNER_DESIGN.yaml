              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS350", title: "Distributed Systems", department_code: "CS", credits: 6, level: "UPPER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OCU", description: "Design a replicated store", weight_bp: 10000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { ocu_id: "$.data[0].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
