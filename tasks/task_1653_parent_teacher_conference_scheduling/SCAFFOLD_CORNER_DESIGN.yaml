  - section: validations
    instances:
      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /conf/windows", captures: { err: $.data.error_id } }
          assert: ["HTTP 401 and error_id == ERR_UNAUTHENTICATED"]

      - name: open_booking_before_open_at_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BOOKING_WINDOW_NOT_OPEN]"]
        distinguishing_aspect: "open-booking with the logical clock (2026-08-15) before booking_open_at (2026-09-01) is rejected even though the window is PUBLISHED with slots."
        test_recipe:
          setup: ["window PUBLISHED with slots; clock 2026-08-15T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
          trigger:
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BOOKING_WINDOW_NOT_OPEN, HTTP 422; window stays PUBLISHED"]

      - name: lock_before_close_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BOOKING_WINDOW_NOT_CLOSED]"]
        distinguishing_aspect: "lock with clock 2026-09-15 before booking_close_at 2026-10-01 is rejected with ERR_BOOKING_WINDOW_NOT_CLOSED."
        test_recipe:
          setup: ["window BOOKING_OPEN; clock 2026-09-15T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SchoolAdmin }
          trigger:
            - { call: "POST /conf/windows/${w}/lock", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BOOKING_WINDOW_NOT_CLOSED, HTTP 422; window stays BOOKING_OPEN"]

      - name: open_booking_without_slots_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.ConferenceWindow.PUBLISHED_to_BOOKING_OPEN", "errors[ERR_INVALID_WINDOW_STATE]"]
        distinguishing_aspect: "open-booking with slots_total_count == 0 (generate-slots never ran) is rejected."
        test_recipe:
          setup: ["window PUBLISHED, no slots; clock 2026-09-01"]
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6 }
              as: SchoolAdmin
              captures: { w: $.data.id }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin }
          trigger:
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_WINDOW_STATE, HTTP 409"]

      - name: publish_with_invalid_day_window_rejected
