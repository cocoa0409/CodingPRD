  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: pricing_agreement_window_half_open_boundary
        grounds:
          - calculations.placard_determination
          - entities.PricingAgreement.fields.effective_to
        distinguishing_aspect: |
          Boundary metric: effective_to treated as EXCLUSIVE (half-open
          [from, to)). A release attempted with current_utc exactly equal to
          effective_to must fail with ERR_AGREEMENT_NOT_ACTIVE; one second
          before must succeed. Metric: temporal boundary on datetime.
          Endpoint: POST /batch-jobs/{id}/release.
        test_recipe:
          setup:
            - "Customer C11, PA11 with effective_from=2026-08-01T00:00:00Z, effective_to=2026-09-01T00:00:00Z (ACTIVE)"
            - "R11 APPROVED NON_HAZ, T11 CLEAN_VALIDATED, L11 lot"
