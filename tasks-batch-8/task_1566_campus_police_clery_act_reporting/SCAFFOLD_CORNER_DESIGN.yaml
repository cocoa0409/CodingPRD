            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer }
          trigger:
            - { call: "POST /program-reviews/${pr}/advance", payload: {}, as: FederalReviewer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNRESOLVED_ACTIONS, HTTP 422; status remains FINDINGS_ISSUED"

      - name: submit_review_before_final_compile_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_FINAL_COMPILE_REQUIRED]"]
        distinguishing_aspect: "submit-review after only a PROVISIONAL compile yields ERR_FINAL_COMPILE_REQUIRED 422."
        test_recipe:
          setup: ["ASR 2026 COLLECTING with one PROVISIONAL compile"]
          setup_api_calls:
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr: $.data.id, av: $.data.version } }
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "PROVISIONAL", expected_report_version: "${av}" }, as: CleryCoordinator }
          trigger:
            - { call: "POST /annual-security-reports/${asr}/submit-review", payload: {}, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FINAL_COMPILE_REQUIRED, HTTP 422; status remains COLLECTING"

      - name: reopen_after_72h_window_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ALERT_WINDOW_EXPIRED]"]
        distinguishing_aspect: "reopen more than 72h after closed_at yields ERR_ALERT_WINDOW_EXPIRED 422 (strictly greater than 72h)."
        test_recipe:
          setup: ["alert decided NO_ISSUE and CLOSED at 2026-08-01T00:00:00Z; clock at 2026-08-04T00:00:01Z (+72h00m01s)"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "T", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-28T09:00:00Z", occurred_at: "2026-07-28T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "TIMELY_WARNING" }, as: CleryCoordinator, captures: { a: $.data.id } }
            - { call: "POST /safety-alerts/${a}/decide", payload: { decision: "NO_ISSUE", decision_rationale: "no threat" }, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a}/close", payload: {}, as: CleryCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:01Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /safety-alerts/${a}/reopen", payload: { reason: "late info" }, as: CleryCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALERT_WINDOW_EXPIRED, HTTP 422; status remains CLOSED"

  # ============================================================
  # Section: endpoints
  # ============================================================
  - section: endpoints
    instances:
      - name: statistic_lines_filtered_by_column
        claim_type: list_filtering
        grounds: ["endpoints.GET /annual-security-reports/{id}/statistic-lines"]
        distinguishing_aspect: "The geography_column filter narrows the snapshot read to exactly the requested column."
        test_recipe:
          setup: ["residential geography; incident classified with BURGLARY (counts in both ON_CAMPUS and ON_CAMPUS_RESIDENTIAL); ASR compiled FINAL"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "Hall F", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-02-10T09:00:00Z", occurred_at: "2026-02-10T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "BURGLARY", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CleryCoordinator }
            - { call: "POST /annual-security-reports", payload: { report_year: 2026 }, as: SystemAdmin, captures: { asr: $.data.id, av: $.data.version } }
            - { call: "POST /annual-security-reports/${asr}/compile", payload: { variant: "FINAL", expected_report_version: "${av}" }, as: CleryCoordinator }
          trigger:
            - { call: "GET /annual-security-reports/${asr}/statistic-lines", payload: { geography_column: "ON_CAMPUS_RESIDENTIAL" }, as: CleryCoordinator }
            - { call: "GET /annual-security-reports/${asr}/statistic-lines", payload: { geography_column: "NON_CAMPUS" }, as: CleryCoordinator }
          assert:
            - "Filter ON_CAMPUS_RESIDENTIAL: exactly 1 line (BURGLARY, count 1)"
            - "Filter NON_CAMPUS: 0 lines (total_count == 0)"

      - name: daily_log_public_access_hides_unfounded
        claim_type: list_filtering
        grounds: [entities.DailyCrimeLogEntry.fields.is_public, "endpoints.GET /daily-crime-log"]
        distinguishing_aspect: "Anonymous list omits non-public (unfounded) entries; staff with include_unfounded=true sees them."
        test_recipe:
          setup: ["incident classified then UNFOUNDED (its log entry is non-public)"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "S", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-05T09:00:00Z", occurred_at: "2026-03-05T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator, captures: { iv: $.data.version } }
            - { call: "POST /incident-reports/${i}/classify", payload: { geography_id: "${g}", offense_counts: [ { offense_type: "MOTOR_VEHICLE_THEFT", victim_count: 1 } ], expected_incident_version: "${iv}" }, as: CleryCoordinator }
            - { call: "POST /incident-reports/${i}/unfound", payload: { justification: "Recovered; owner error" }, as: PoliceChief }
          trigger:
            - { call: "GET /daily-crime-log", payload: {}, as: Anonymous }
            - { call: "GET /daily-crime-log", payload: { include_unfounded: true }, as: PoliceChief }
          assert:
            - "Anonymous list: total_count == 0 (unfounded entry hidden)"
            - "Staff list with include_unfounded: total_count == 1 with disposition == UNFOUNDED"

      - name: anonymous_get_unfounded_entry_forbidden
        claim_type: conditional_action
        grounds: ["validations[priority=6]", "errors[ERR_ENTRY_NOT_PUBLIC]"]
        distinguishing_aspect: "Anonymous direct GET of a non-public entry yields ERR_ENTRY_NOT_PUBLIC 403."
        test_recipe:
          setup: ["incident submitted then UNFOUNDED; entry id captured while still public"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "R", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-03-06T09:00:00Z", occurred_at: "2026-03-06T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "GET /daily-crime-log", payload: { incident_id: "${i}" }, as: PoliceChief, captures: { le: "$.data[0].id" } }
            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator }
            - { call: "POST /incident-reports/${i}/unfound", payload: { justification: "False report" }, as: PoliceChief }
          trigger:
            - { call: "GET /daily-crime-log/${le}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENTRY_NOT_PUBLIC, HTTP 403"

      - name: forward_sets_forwarded_fields
        claim_type: action_endpoint
        grounds: [state_machines.CSAReferralReport.RECEIVED_to_FORWARDED]
        distinguishing_aspect: "forward moves RECEIVED -> FORWARDED, stamps forwarded_at, and computes forward_overdue false at the same instant."
        test_recipe:
          setup: ["ACTIVE CSA; referral RECEIVED at default clock"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Nora Nurse", email: "nora@example.edu", department: "Health", csa_category: "OTHER_OFFICIAL" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2026-06-15T10:00:00Z", score: 93 }, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "Clinic", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-07-31T21:00:00Z", geography_id: "${g}", offense_suspicion: "DATING_VIOLENCE", narrative: "x" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { r: $.data.id } }
          trigger:
            - { call: "POST /csa-referral-reports/${r}/forward", payload: {}, as: CampusSecurityAuthority, as_user_id: "${c}" }
          assert:
            - "CSAReferralReport.${r}.status == FORWARDED"
            - "forwarded_at == 2026-08-01T00:00:00Z and forward_overdue == false"

      - name: fulfill_pending_inspection_request
        claim_type: action_endpoint
        grounds: [state_machines.LogInspectionRequest.PENDING_to_FULFILLED, calculations.inspection_fulfillment_window]
        distinguishing_aspect: "A request whose window is older than 60 days starts PENDING with due_at = +2 business days; fulfill moves it to FULFILLED."
        test_recipe:
          setup: ["submitted incident occurred 2026-05-01 (older than 60 days at request time); clock 2026-08-03T10:00:00Z (Monday)"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "P", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-05-01T09:00:00Z", occurred_at: "2026-05-01T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-crime-log/inspection-requests", payload: { requester_name: "Jo", requester_contact: "jo@example.com", from_date: "2026-05-01", to_date: "2026-05-02" }, as: Anonymous, captures: { lir: $.data.id } }
          trigger:
            - { call: "POST /log-inspection-requests/${lir}/fulfill", payload: {}, as: CleryCoordinator }
          assert:
            - "At creation: status == PENDING with due_at == 2026-08-05T10:00:00Z (2 business days from Monday)"
            - "After fulfill: status == FULFILLED and fulfilled_at == 2026-08-03T10:00:00Z (is_overdue == false at that instant)"

  # ============================================================
  # Section: errors
  # ============================================================
  - section: errors
    instances:
      - name: statistics_stale_set_on_unfound
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
