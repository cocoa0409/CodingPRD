  - section: calculations
    instances:
      - name: refund_half_inside_48h_window
        claim_type: correct_result
        grounds: [calculations.refund_amount, calculations.fare_quote]
        distinguishing_aspect: "Inside the 48h line the refund is exactly half, round_half_up: a FIRST_CLASS party-1 booking (paid 11000) cancelled at slot_start - 47h refunds 5500."
        test_recipe:
          setup: ["Published REGULAR excursion (slot 2026-10-15 10:00 start) with one FIRST_CLASS car; one CONFIRMED FIRST_CLASS booking party 1 (unit 11000, paid 11000)"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
