      - name: deciding_an_already_decided_application_is_refused
        claim_type: invalid_transitions
        grounds:
          - validations.priority_50_ERR_APPLICATION_NOT_DECIDABLE
          - state_machines.CreditApplication.SUBMITTED_to_APPROVED
          - state_machines.CreditApplication.APPROVED_to_ORIGINATED
        distinguishing_aspect: |
          A decision is legal only from SUBMITTED: the second POST
          /credit-applications/{id}/decision on an APPROVED application returns HTTP 409
          ERR_APPLICATION_NOT_DECIDABLE without rewriting the band, and after origination the
          same call on the now-ORIGINATED application is refused too — decided_at,
          credit_score_band and credit_limit_cents keep their first-decision values even
          though the retry names a different band.
        test_recipe:
          setup:
