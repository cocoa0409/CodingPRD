# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2393_new_product_development_stage_gate
# 9 rule_ids from §0.5, 22 instances. Every numeric assert below was produced by
# executing the §1.3 formulas as decimal round_half_up code.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: business_case_volume_variant_divergence
        grounds:
          - calculations.forecast_volume_and_revenue
          - calculations.business_case_financials
          - entities.BusinessCase.fields.variant_mode
          - entities.BusinessCase.fields.annual_units
          - concurrency_rules[business-case-create-stale-project]
        distinguishing_aspect: |
          This dual variant lives on the BusinessCase cost/volume domain: two cases holding
          byte-identical ForecastLine sets diverge because TOP_DOWN derives volume from
          category size times share while BOTTOM_UP sums the channel lines, giving
          annual_units 500000 versus 821248 and npv_usd 1155954.60 versus 2899498.14.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One BEVERAGE NEW_BRAND project in dev_status IDEA."
            - "A first TOP_DOWN business case (case_type PRELIMINARY) carrying the two channel lines."
            - "A second BOTTOM_UP business case (case_type FINAL) carrying the identical two channel lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Sparkling Yuzu", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-p1"
              captures: { p1_id: $.data.id, p1_v1: $.data.version }
            - call: "POST /innovation-projects/${p1_id}/business-cases"
              payload: { expected_project_version: "${p1_v1}", variant_mode: "TOP_DOWN", category_size_units_year: 40000000, target_share_pct: 1.25, cogs_per_unit_usd: 1.0500, slotting_fees_usd: 250000.00, capex_usd: 900000.00, discount_rate_pct: 9.00 }
              as: InnovationLead
              captures: { bc_td_id: $.data.id }
            - call: "POST /business-cases/${bc_td_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 4200, base_velocity_units_per_store_week: 1.75, promo_weeks: 6, promo_lift_pct: 45.5, list_price_usd: 3.4915 }
              as: InnovationLead
            - call: "POST /business-cases/${bc_td_id}/forecast-lines"
              payload: { channel: "MASS", store_count: 3150, base_velocity_units_per_store_week: 2.35, promo_weeks: 8, promo_lift_pct: 57.5, list_price_usd: 3.2875 }
              as: InnovationLead
            - call: "GET /innovation-projects/${p1_id}"
              as: InnovationLead
              captures: { p1_v2: $.data.version }
            - call: "POST /innovation-projects/${p1_id}/business-cases"
              payload: { expected_project_version: "${p1_v2}", variant_mode: "BOTTOM_UP", category_size_units_year: 40000000, target_share_pct: 1.25, cogs_per_unit_usd: 1.0500, slotting_fees_usd: 250000.00, capex_usd: 900000.00, discount_rate_pct: 9.00 }
              as: InnovationLead
              captures: { bc_bu_id: $.data.id }
            - call: "POST /business-cases/${bc_bu_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 4200, base_velocity_units_per_store_week: 1.75, promo_weeks: 6, promo_lift_pct: 45.5, list_price_usd: 3.4915 }
              as: InnovationLead
          trigger:
            - call: "POST /business-cases/${bc_bu_id}/forecast-lines"
              payload: { channel: "MASS", store_count: 3150, base_velocity_units_per_store_week: 2.35, promo_weeks: 8, promo_lift_pct: 57.5, list_price_usd: 3.2875 }
              as: InnovationLead
          assert:
            - "BusinessCase.${bc_td_id}.case_type == PRELIMINARY and BusinessCase.${bc_bu_id}.case_type == FINAL"
            - "BusinessCase.${bc_td_id}.annual_units == 500000"
            - "BusinessCase.${bc_td_id}.gross_revenue_usd == 1702050.00"
            - "BusinessCase.${bc_td_id}.trade_spend_rate_pct == 12.00 and BusinessCase.${bc_td_id}.trade_spend_usd == 204246.00"
            - "BusinessCase.${bc_td_id}.net_revenue_usd == 1247804.00 and BusinessCase.${bc_td_id}.gross_margin_pct == 57.93"
            - "BusinessCase.${bc_td_id}.npv_usd == 1155954.60 and BusinessCase.${bc_td_id}.payback_months == 15"
            - "BusinessCase.${bc_bu_id}.annual_units == 821248"
            - "BusinessCase.${bc_bu_id}.gross_revenue_usd == 2781915.07"
            - "BusinessCase.${bc_bu_id}.net_revenue_usd == 2198085.26 and BusinessCase.${bc_bu_id}.gross_margin_pct == 60.77"
            - "BusinessCase.${bc_bu_id}.npv_usd == 2899498.14 and BusinessCase.${bc_bu_id}.payback_months == 9"
            - "BusinessCase.${bc_td_id}.avg_list_price_usd == 3.4041 == BusinessCase.${bc_bu_id}.avg_list_price_usd"
            - "BusinessCase.${bc_bu_id}.annual_units - BusinessCase.${bc_td_id}.annual_units == 321248"
            - "BusinessCase.${bc_td_id}.status == SUPERSEDED and BusinessCase.${bc_bu_id}.status == COMPUTED"

      - name: post_launch_attainment_basis_divergence
        grounds:
          - calculations.post_launch_attainment
          - entities.PostLaunchPeriod.fields.attainment_basis
          - entities.PostLaunchPeriod.fields.attainment_cumulative_pct
          - entities.PostLaunchPeriod.fields.attainment_trailing_pct
          - state_machines.InnovationProject.dev_status.LAUNCHED_to_IN_MARKET_FIX
        distinguishing_aspect: |
          This dual variant lives on the PostLaunchPeriod in-market performance domain, not on
          BusinessCase cost accounting: with plan_units_per_period 38304.00 and actuals 34000 then
          26000, the CUMULATIVE basis reads 78.32 and would decide FIX while the TRAILING basis
          reads 67.88 on the same stored row and decides DISCONTINUE.
        test_recipe:
          setup:
            - "Logical clock walked 2026-08-03 -> 2026-08-06 -> 2026-09-10 -> 2026-10-26."
            - "HOUSEHOLD gate 2 (required [PRELIM_BUSINESS_CASE], quorum 1) and gate 3 (required [MANUFACTURING_READINESS, SALES_SELL_IN_PLAN], quorum 1), both with zero hurdles and readiness floor 0.00."
            - "A HOUSEHOLD LINE_EXTENSION project driven all the way to dev_status LAUNCHED with commercial_status SHIPPED."
            - "Its LOCKED BOTTOM_UP business case carries annual_units 153216."
            - "Period 1 already reported on the CUMULATIVE basis at 34000 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "HOUSEHOLD", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["PRELIM_BUSINESS_CASE"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { g2h_id: $.data.id }
            - call: "POST /stage-gates"
              payload: { gate_number: 3, category: "HOUSEHOLD", stage_from: "PILOT_QUALIFIED", stage_to: "LAUNCH_READY", required_deliverable_types: ["MANUFACTURING_READINESS", "SALES_SELL_IN_PLAN"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 999, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { g3h_id: $.data.id }
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo Pilot", line_code: "TOL-1", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 850.00 }
              as: PortfolioAdmin
              captures: { plh_id: $.data.id }
            - call: "POST /retailers"
              payload: { name: "HomeMart", channel: "GROCERY", acv_contribution_pct: 32.50, presentation_lead_days: 21 }
              as: PortfolioAdmin
              captures: { reth_id: $.data.id }
            - call: "POST /retailers/${reth_id}/shelf-reset-windows"
              payload: { category: "HOUSEHOLD", window_start: "2026-10-05T00:00:00Z", window_end: "2026-10-30T23:59:59Z", max_presentations: 3 }
              as: PortfolioAdmin
              captures: { winh_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Citrus Surface Wipes", brand: "PureHome", category: "HOUSEHOLD", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 200000.00 }
              as: InnovationLead
              as_user_id: "lead-ph"
              captures: { ph_id: $.data.id }
            - call: "POST /innovation-projects/${ph_id}/screen"
              payload: {}
              as: GateChair
              as_user_id: "chair-ph"
              captures: { ph_v2: $.data.version }
            - call: "POST /innovation-projects/${ph_id}/business-cases"
              payload: { expected_project_version: "${ph_v2}", variant_mode: "BOTTOM_UP", category_size_units_year: 0, target_share_pct: 0.00, cogs_per_unit_usd: 3.2000, slotting_fees_usd: 50000.00, capex_usd: 300000.00, discount_rate_pct: 9.00 }
              as: InnovationLead
              captures: { bch_id: $.data.id }
            - call: "POST /business-cases/${bch_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2400, base_velocity_units_per_store_week: 1.20, promo_weeks: 4, promo_lift_pct: 30.00, list_price_usd: 5.7500 }
              as: InnovationLead
            - call: "GET /innovation-projects/${ph_id}"
              as: InnovationLead
              captures: { ph_v3: $.data.version }
            - call: "POST /innovation-projects/${ph_id}/formulations"
              payload: { expected_project_version: "${ph_v3}", spec_summary: "Citrus wipe substrate rev A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 3.2000 }
              as: RnDLead
              captures: { formh_id: $.data.id }
            - call: "POST /formulations/${formh_id}/pilot-runs"
              payload: { pilot_line_id: "${plh_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 60000.00 }
              as: RnDLead
              captures: { runh_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-runs/${runh_id}/start"
              payload: {}
              as: RnDLead
            - call: "POST /pilot-runs/${runh_id}/complete"
              payload: { actual_units: 8500 }
              as: RnDLead
            - call: "GET /formulations/${formh_id}"
              as: RnDLead
              captures: { formh_v2: $.data.version }
            - call: "POST /formulations/${formh_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${formh_v2}", duration_days: 30, committed_cost_usd: 40000.00, start_at: "2026-08-06T17:00:00Z" }
              as: RnDLead
              captures: { studyh_id: $.data.id }
            - call: "POST /shelf-life-studies/${studyh_id}/timepoints"
