      - name: withdraw_accepts_four_states_and_cascades_only_onto_the_children_that_exist
        claim_type: Conditional action
        grounds:
          - endpoints.POST /programs/{program_id}/withdraw
          - state_machines.Program[DRAFT->WITHDRAWN]
          - state_machines.Program[IN_MARKET->WITHDRAWN]
          - validations[priority=21]
        distinguishing_aspect: |
          One endpoint, one payload, four legal source states and a footprint that depends entirely
          on what has been built underneath: on a bare DRAFT program it is a single status write with
          nothing to cascade, while on an IN_MARKET program it lapses layers in two different source
          states (an OPEN layer never taken to market and an IN_MARKET layer with live quotes),
          closes the submissions and lapses the quotes. The precondition set is
          {DRAFT, SUBMISSION_READY, IN_MARKET, FIRM_ORDER}, so WITHDRAWN itself is not in it and the
          action is not idempotent — a second call is a state error, not a no-op.
        test_recipe:
          setup:
            - "Program A stays a bare DRAFT with no exposure package and no layers."
            - "Program B reaches IN_MARKET with two layers: one CATASTROPHE layer out to two markets with one live quote, and one QUOTA_SHARE layer never submitted anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /cedents"
