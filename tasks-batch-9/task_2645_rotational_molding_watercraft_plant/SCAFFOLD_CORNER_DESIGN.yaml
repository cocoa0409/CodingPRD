              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_b: $.data.id, shp_b_v: $.data.version }
          trigger:
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_a}", finished_unit_id: "${fu1}", expected_shipment_version: "${shp_a_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_a}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_a_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_a}", finished_unit_id: "${fu2}", expected_shipment_version: "${shp_a_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_b}", finished_unit_id: "${fu3}", expected_shipment_version: "${shp_b_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shp_b_v2: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shp_b}", finished_unit_id: "${fu4}", expected_shipment_version: "${shp_b_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipments/${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /shipment-lines?shipment_id=${shp_b}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /finished-units/${fu4}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "the first line on each trailer is charged the FULL gross cube 1.2345 — it is position 1 of PM-CVT on that trailer — so both trailers read nested_cube_m3 1.2345 after one line, which is under 1.8517 and proves each hull fits individually"
            - "the second line on SHP-CVJ-A returns 201: its own contribution is round(1.2345 * 0.5000, 4) == 0.6173 and the rollup round(1.2345 + 0.6173, 4) == 1.8518 <= capacity 1.8518, the equality case of rung 77"
            - "the second line on SHP-CVJ-B fails 409 ERR_TRAILER_CUBE_EXCEEDED: the same 1.8518 rollup exceeds 1.8517 by one ten-thousandth of a cubic metre — the aggregate, not the individual line, is what binds"
            - "rung 78 is satisfied throughout: round(30.000 + 30.000, 3) == 60.000 kg against trailer_max_payload_kg 1000.000, so the payload rung cannot be mistaken for the cube rung"
            - "the nesting is per-TRAILER, not per-warehouse: fu3 pays the full 1.2345 on SHP-CVJ-B even though three siblings of the same model are nested behind an anchor back at WH-CVA"
            - "after the refusal SHP-CVJ-B still reads nested_cube_m3 1.2345, loaded_weight_kg 30.000 and status LOADING, and GET /shipment-lines?shipment_id=${shp_b} returns total_count 1"
            - "GET /finished-units/${fu4} still reads logistics_status STORED with its warehouse footprint intact — a refused line never moves the hull out of the warehouse"
            - "SHP-CVJ-A now reads cube_utilization_pct == round(1.8518 / 1.8518 * 100, 2) == 100.00, so it is sealable, while SHP-CVJ-B sits at round(1.2345 / 1.8517 * 100, 2) == 66.67 and is also sealable — the aggregate refusal did not strand the trailer below MIN_SEAL_UTILIZATION_PCT"

      # -----------------------------------------------------------------------
      # V14 — priority 79: the overbuild ceiling is floored, and it counts
      # SCHEDULED cycles, so an ABORTED cycle gives the quota back.
      # -----------------------------------------------------------------------
      - name: val_aggregate_order_overbuild_ceiling_binds_on_the_third_cycle
        claim_type: "Aggregate validation"
        grounds:
          - validation_rules.priority_79
          - errors.ERR_ORDER_OVERBUILD
          - calculations.order_completion_rollup
          - state_machines.MoldingCycle.status
          - endpoints.POST_/molding-cycles
        distinguishing_aspect: "For an ordered_qty of 2 the ceiling is floor(2 * 1.20) == 2, so the first two single-cavity cycles are scheduled and the third fails 409 ERR_ORDER_OVERBUILD even though a third free mould, a third free arm and a third free cooling slot all exist; aborting one cycle immediately re-admits it."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-01T09:00:00Z. ProductModel PM-CVN (nominal_charge_kg 12.000) with THREE single-cavity moulds MLD-CVN-1, MLD-CVN-2 and MLD-CVN-3 (nominal_charge_kg 12.000, service_interval_cycles 10), oven OV-CVN with arm_count 3 and changeover_buffer_min 15, bay CB-CVN with concurrent_slot_capacity 3, site WH-CVA and resin lot LOT-CVN (100.000 kg)."
            - "ProductionOrder PO-CVN with ordered_qty 2 is RELEASED and READY_TO_SCHEDULE with no cycles: every capacity rung except the overbuild quota has room to spare."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvN_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVN", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.0000, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 200000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvN_mold1
              call: "POST /molds"
              payload: { mold_code: "MLD-CVN-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold1: $.data.id }
            - &cvN_mold2
              call: "POST /molds"
              payload: { mold_code: "MLD-CVN-2", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold2: $.data.id }
            - &cvN_mold3
              call: "POST /molds"
              payload: { mold_code: "MLD-CVN-3", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold3: $.data.id }
            - &cvN_oven
              call: "POST /oven-stations"
              payload: { station_code: "OV-CVN", arm_count: 3, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
