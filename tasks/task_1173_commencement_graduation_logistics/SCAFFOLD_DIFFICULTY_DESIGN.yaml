              as: Graduate
              as_user_id: "${g}"
              captures: { req_ok: $.data.requested_count, prov_ok: $.data.provisional_granted_count, av2: $.data.version }
            - call: "POST /api/ticket-allocations/${a}/request"
              payload: { requested_count: 5, expected_ticket_allocation_version: "${av2}" }
              as: Graduate
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
          assert:
            - "requested_count == 4 accepted (cap is inclusive): requested_count == 4 and provisional_granted_count == 4"
            - "requested_count == 5 rejected: error_id == ERR_TICKET_CAP_EXCEEDED (5 > 4 strictly)"
            - "zero edge: requested_count must be >= 1 per schema (ERR_INVALID_REQUEST at priority 4)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_request_requires_eligible_graduate
        grounds:
          - validations[priority=10]
          - state_machines.TicketAllocation.PENDING_to_PENDING
        distinguishing_aspect: |
          TicketAllocation -> Graduate dependency: the allocation exists
          (auto-created) but the request is rejected while Graduate.status is
          PENDING_AUDIT. Different entity pair than the PrintBatch -> Ceremony
          dependency below.
        test_recipe:
          setup:
            - "Ceremony AUDIT_OPEN; graduate imported but NOT yet audited (status PENDING_AUDIT); allocation auto-created"
          setup_api_calls:
