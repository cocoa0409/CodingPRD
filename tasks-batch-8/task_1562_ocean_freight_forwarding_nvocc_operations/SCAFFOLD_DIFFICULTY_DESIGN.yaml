          - errors[ERR_BOOKING_NOT_CANCELLABLE]
          - errors[ERR_OUTSTANDING_BALANCE]
        distinguishing_aspect: |
          Error-category pair (state, business_fiscal): the booking is LOADED
          (state band, priority 6) AND has an ISSUED unpaid invoice (fiscal
