  - name: version_increments_on_every_mutation
    claim_type: optimistic_concurrency
    grounds:
    - entities.Product
    distinguishing_aspect: 'common_fields contract: create gives version 1; a PATCH mutation gives version 2; discontinue gives version 3.'
    test_recipe:
      setup:
      - product P-V created
