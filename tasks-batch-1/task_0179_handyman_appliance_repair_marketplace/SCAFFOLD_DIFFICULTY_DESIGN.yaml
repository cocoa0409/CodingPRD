              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c16@x.com", full_name: "C Sixteen", zip_code: "30301" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { email: "p16a@x.com", full_name: "P 16a", home_zip_code: "30301", skill_tags: ["hvac"] }
              as: Anonymous
              captures: { pro_a: $.data.id }
            - call: "POST /pros/${pro_a}/background-checks"
