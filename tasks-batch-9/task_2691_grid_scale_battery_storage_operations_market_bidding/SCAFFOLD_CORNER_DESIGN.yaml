      - name: closed_event_rejects_suppression_and_a_second_close
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVENT_NOT_OPEN]
          - errors[ERR_EVENT_NOT_SUPPRESSING]
          - state_machines.SafetyEvent
        distinguishing_aspect: |
          The two SafetyEvent state codes are not interchangeable: discharge-suppression demands
          status == OPEN while close accepts either OPEN or SUPPRESSION_ACTIVE. A CLOSED event is
          therefore the single state that trips both, and each endpoint must answer with its own
          code rather than a shared one. An ADVISORY event is used so the close path is not itself
          gated by suppression or emergency acknowledgement.
        test_recipe:
          setup:
            - "asset A1 commissioned; ADVISORY THERMAL_ANOMALY event E1 opened by cro_1 (imposed_safety_state NONE)"
            - "E1 closed by a different officer so_9, satisfying segregation of duties"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
            - call: "POST /safety-events"
              payload: { asset_id: "${a1}", event_type: "THERMAL_ANOMALY", severity: "ADVISORY", detected_max_cell_temp_c: 48.0 }
              as: ControlRoomOperator
              as_user_id: "cro_1"
              captures: { ev: $.data.id, ev_imposed: $.data.imposed_safety_state }
            - call: "POST /safety-events/${ev}/close"
              payload: { responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { ev_status: $.data.status }
          trigger:
            - call: "POST /safety-events/${ev}/discharge-suppression"
              payload: { suppression_agent_kg: 12.5 }
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { e_open: $.data.error_id }
            - call: "POST /safety-events/${ev}/close"
              payload: { responder_cleared: true }
              as: SafetyOfficer
              as_user_id: "so_9"
              captures: { e_suppressing: $.data.error_id }
          assert:
            - "${ev_imposed} == \"NONE\" (ADVISORY) and ${ev_status} == \"CLOSED\" after the legitimate close"
            - "discharge-suppression on a CLOSED event: HTTP 409 with ${e_open} == \"ERR_EVENT_NOT_OPEN\""
            - "second close: HTTP 409 with ${e_suppressing} == \"ERR_EVENT_NOT_SUPPRESSING\" - close accepts OPEN or SUPPRESSION_ACTIVE, so CLOSED is the only rejecting state"
            - "suppression_discharged stays false and suppression_agent_kg stays null - the rejected call wrote nothing"

      - name: critical_event_close_requires_full_emergency_acknowledgement
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EMERGENCY_ACK_REQUIRED]
          - validations[priority=15]
          - endpoints[POST /safety-events/{id}/close]
        distinguishing_aspect: |
          Priority 15 is a three-part conjunction - acknowledgement instant, responder_cleared true
          and at least one named agency - so an implementation that checks only the timestamp
          releases the plant while the incident commander still holds the site. A CRITICAL
          non-runaway event imposes ALARM rather than LOCKOUT, so suppression is not required and
          the acknowledgement conjunction is the only thing standing between the event and CLOSED.
        test_recipe:
          setup:
            - "asset A1 commissioned; CRITICAL OFFGAS_DETECTED event E2 opened by cro_1 -> imposed ALARM, asset market_state SUSPENDED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
