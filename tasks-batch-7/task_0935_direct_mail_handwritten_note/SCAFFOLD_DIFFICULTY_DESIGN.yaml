          setup:
            - "The seven-record list deduped in HOUSEHOLD mode and locked, giving a committed job with 6 billable pieces and total_due 553."
            - "One machine SLOT-MED with daily_capacity_minutes 25 and one 20000-microlitre INK_BLUE_A lot."
