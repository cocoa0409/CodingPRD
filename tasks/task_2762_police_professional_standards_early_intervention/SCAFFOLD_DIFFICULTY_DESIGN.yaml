      - name: alert_escalation_cycle_returns_to_plan_required
        grounds:
          - state_machines.EarlyInterventionAlert.PLAN_REQUIRED_to_PLAN_ACTIVE
          - state_machines.EarlyInterventionAlert.PLAN_ACTIVE_to_ESCALATED
          - state_machines.EarlyInterventionAlert.ESCALATED_to_PLAN_REQUIRED
          - state_machines.InterventionPlan.ACTIVE_to_ESCALATED
          - calculations.plan_compliance_score
          - entities.EarlyInterventionAlert.fields.plan_count
          - entities.Officer.fields.intervention_escalation_count
        distinguishing_aspect: |
          The alert leaves PLAN_REQUIRED, passes through PLAN_ACTIVE and ESCALATED and returns to
          PLAN_REQUIRED on re-planning, so plan_count reaches 2 while the alert is still open and
          the officer's intervention_escalation_count is exactly 1 - a linear alert lifecycle
          cannot reach PLAN_REQUIRED a second time.
        test_recipe:
          setup:
            - "Officer Kerr is a PATROL officer whose five in-window events give composite_score 63.75 and band ALERT, so event ingest created an EarlyInterventionAlert that sits in PLAN_REQUIRED with the officer open_alert_count 1."
            - "A first intervention plan with required_checkin_count 2 and duration_days 30 was activated at 2026-08-01T00:00:00Z, so its check-ins are due 2026-08-11T00:00:00Z and 2026-08-21T00:00:00Z and end_date is 2026-08-31T00:00:00Z."
            - "Check-in 1 was completed on time as SATISFACTORY at 2026-08-11T00:00:00Z; check-in 2 was left untouched and swept to MISSED by an EIS run at 2026-08-25T00:00:00Z."
            - "The plan was then closed, and with compliance_score 50.00 below the 80 success floor it closed ESCALATED and dragged the alert to ESCALATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
