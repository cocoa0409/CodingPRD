# =============================================================================
# Scaffold: Title Insurance Underwriter & Escrow (task_0428)
# =============================================================================

scenario: |
  428. Title Insurance Underwriter & Escrow (First American style): order & title
  search/exam, commitment (Schedule A / B exceptions), title plant & chain-of-title,
  owner/lender policy & endorsements, escrow-trust accounting & wire, recording & gap
  coverage, premium split & agency remittance, claim & curative

domain_name: title-insurance-escrow
api_prefix: /title

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - multi_tenancy_isolation

  entity_topology: hybrid
  # Flat top-level collections under /title with FK references between them, plus a
  # short Order -> Commitment -> Exception ownership chain. Sub-resource GETs give
  # every FK a reverse-reachability channel.

  state_machine_shape: cyclic
  # Commitment ISSUED <-> UPDATED revision loop and Claim INVESTIGATING <-> CURATIVE
  # loop are the two non-linear machines; Order/Disbursement carry branching+revert.

  relationship_patterns:
    - one_to_many        # Order has many TitleSearches, Commitments, Policies, Deposits, Disbursements
    - cross_aggregate    # Policy references Commitment; CurativeAction references an Exception or a Claim

  role_model: peer_roles
  # Agency (entity-backed, owns its Orders), TitleOfficer (search/exam/commitment/curative),
  # Underwriter (policy/endorsement/claim/remittance/escrow-wire). Non-overlapping surfaces.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table  (§1.1)
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Title agency legal name" }
      - { name: remit_split_pct, type: number, source: input, description: "Fraction of gross premium this agency RETAINS on remittance, 0..1 (e.g. 0.82). Underwriter receives the remainder.", constraints: "0 <= remit_split_pct <= 1" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE", constraints: "ACTIVE | SUSPENDED" }

  - name: TitlePlantRecord
    parent: null
    common_fields: false
    fields:
      - { name: parcel_id, type: string, source: input, description: "Parcel / APN the recorded instrument belongs to" }
      - { name: county, type: string, source: input, description: "Recording county" }
      - { name: instrument_type, type: enum, source: input, description: "DEED | MORTGAGE | LIEN | EASEMENT | RELEASE", constraints: "DEED | MORTGAGE | LIEN | EASEMENT | RELEASE" }
      - { name: recorded_date, type: datetime, source: input, description: "ISO 8601 UTC date the instrument was recorded into the plant" }
      - { name: sequence_no, type: integer, source: input, description: "Monotonic recording sequence on the parcel; chain-of-title order key", constraints: "sequence_no >= 1" }
      - { name: grantor, type: string, source: input, description: "Party conveying the interest" }
      - { name: grantee, type: string, source: input, description: "Party receiving the interest" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the agency that owns and operates this order" }
      - { name: parcel_id, type: string, source: input, description: "Parcel / APN under order; matches TitlePlantRecord.parcel_id for chain-of-title" }
      - { name: county, type: string, source: input, description: "Recording county for this transaction" }
      - { name: transaction_type, type: enum, source: input, description: "PURCHASE | REFINANCE | REISSUE", constraints: "PURCHASE | REFINANCE | REISSUE" }
      - { name: sales_price_cents, type: integer, source: input, description: "Purchase price in cents (owner coverage basis); 0 for pure REFINANCE", constraints: "sales_price_cents >= 0" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Loan amount in cents (lender coverage basis); 0 if no lender policy", constraints: "loan_amount_cents >= 0" }
      - { name: status, type: enum, source: system, description: "OPENED -> IN_TITLE -> COMMITTED -> CLEAR_TO_CLOSE -> CLOSED ; CANCELLED from any non-terminal", constraints: "OPENED | IN_TITLE | COMMITTED | CLEAR_TO_CLOSE | CLOSED | CANCELLED" }
      - { name: escrow_deposit_total_cents, type: integer, source: computed, description: "Sum of EscrowDeposit.amount_cents for this order with status=POSTED" }
      - { name: escrow_disbursed_total_cents, type: integer, source: computed, description: "Sum of Disbursement.amount_cents for this order with status=WIRED" }
      - { name: escrow_balance_cents, type: integer, source: computed, description: "= escrow_deposit_total_cents - escrow_disbursed_total_cents (trust ledger balance)" }
      - { name: gap_open, type: boolean, source: computed, description: "Set true when a TitleSearch COMPLETES (the uninsured gap window opens); set false on order CLOSE/CANCEL. Gap-defect checks on the parcel apply only while true.", default: false }

  - name: TitleSearch
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: searched_parcel_id, type: string, source: input, description: "Parcel searched (copied from order)" }
      - { name: effective_date, type: datetime, source: input, description: "ISO 8601 UTC search effective date; the start of the insured gap window" }
      - { name: status, type: enum, source: system, description: "ORDERED -> IN_EXAM -> COMPLETED ; CANCELLED from ORDERED/IN_EXAM", constraints: "ORDERED | IN_EXAM | COMPLETED | CANCELLED" }
      - { name: chain_verified, type: boolean, source: input, description: "Set true on COMPLETED when chain-of-title from the plant is unbroken", default: false }
      - { name: gap_from_date, type: datetime, source: input, description: "Inclusive start of the uninsured gap window (= effective_date) set on COMPLETED" }
      - { name: gap_to_date, type: datetime, source: input, description: "Inclusive end of the uninsured gap window (= expected recording date) set on COMPLETED" }

  - name: Commitment
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: effective_date, type: datetime, source: input, description: "ISO 8601 UTC commitment effective date; start of the commitment window" }
      - { name: expiry_date, type: datetime, source: input, description: "ISO 8601 UTC commitment expiry; EXCLUSIVE end of the half-open commitment window [effective_date, expiry_date)" }
      - { name: schedule_a_estate, type: enum, source: input, description: "Estate insured in Schedule A: FEE_SIMPLE | LEASEHOLD", constraints: "FEE_SIMPLE | LEASEHOLD" }
      - { name: insured_amount_cents, type: integer, source: input, description: "Schedule A insured amount in cents (ceiling for owner policy coverage)", constraints: "insured_amount_cents > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> UPDATED -> ISSUED (revision loop) ; EXPIRED/CANCELLED terminal", constraints: "DRAFT | ISSUED | UPDATED | EXPIRED | CANCELLED" }
      - { name: open_exception_count, type: integer, source: computed, description: "Count of child Exceptions whose status IN {RAISED, CURATIVE_PENDING}" }
      - { name: revision_no, type: integer, source: computed, description: "Number of times this commitment has been re-issued (ISSUED->UPDATED->ISSUED cycles); starts at 0", default: 0 }

  - name: Exception
    parent: Commitment
    common_fields: true
    fields:
      - { name: commitment_id, type: string, source: input, description: "FK -> Commitment.id" }
      - { name: exception_type, type: enum, source: input, description: "STANDARD (pre-printed Schedule B-I) | SPECIAL (B-II specific defect) | SUBORDINATE_LIEN", constraints: "STANDARD | SPECIAL | SUBORDINATE_LIEN" }
      - { name: description, type: string, source: input, description: "Plain-text description of the exception" }
      - { name: curative_required, type: boolean, source: input, description: "True if the exception must go through curative before it can clear", default: false }
      - { name: status, type: enum, source: system, description: "RAISED -> WAIVED | RAISED -> CURATIVE_PENDING -> CLEARED ; CURATIVE_PENDING -> RAISED (revert) ; VOID on commitment cancel", constraints: "RAISED | CURATIVE_PENDING | WAIVED | CLEARED | VOID" }

  - name: Policy
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: commitment_id, type: string, source: input, description: "FK -> Commitment.id; the commitment whose Schedule A this policy realizes" }
      - { name: policy_type, type: enum, source: input, description: "OWNER (coverage basis sales_price) | LENDER (coverage basis loan_amount)", constraints: "OWNER | LENDER" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Coverage in cents; must be <= commitment.insured_amount_cents", constraints: "coverage_amount_cents > 0" }
      - { name: is_reissue, type: boolean, source: input, description: "True if a qualifying prior policy within REISSUE_WINDOW_YEARS exists -> reissue/refi rate applies", default: false }
      - { name: co_issued_with_owner, type: boolean, source: input, description: "LENDER only: true if co-issued together with an OWNER policy on the same order -> co-issue rate", default: false }
      - { name: gross_premium_cents, type: integer, source: computed, description: "Computed premium per owner_premium / lender_premium calc; input value ignored" }
      - { name: status, type: enum, source: system, description: "PENDING -> ISSUED -> VOID ; ISSUED is the only state from which claims/remittance attach", constraints: "PENDING | ISSUED | VOID" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; starts at 1" }

  - name: Endorsement
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: form_code, type: enum, source: input, description: "ALTA endorsement form: ENV_PROTECTION | ZONING | SURVEY | RESTRICTIONS", constraints: "ENV_PROTECTION | ZONING | SURVEY | RESTRICTIONS" }
      - { name: charge_pct, type: number, source: input, description: "Endorsement charge as fraction of policy gross_premium_cents (e.g. 0.10)", constraints: "0 < charge_pct <= 1" }
      - { name: charge_cents, type: integer, source: computed, description: "= round_half_up(policy.gross_premium_cents * charge_pct)" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ATTACHED -> REMOVED", constraints: "REQUESTED | ATTACHED | REMOVED" }

  - name: EscrowDeposit
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: amount_cents, type: integer, source: input, description: "Deposit amount in cents", constraints: "amount_cents > 0" }
      - { name: source_ref, type: string, source: input, description: "External wire / check reference for the incoming funds" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> POSTED -> REVERSED ; only POSTED deposits count toward escrow_balance", constraints: "RECEIVED | POSTED | REVERSED" }

  - name: Disbursement
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id" }
      - { name: payee, type: string, source: input, description: "Wire payee name" }
      - { name: amount_cents, type: integer, source: input, description: "Outgoing wire amount in cents", constraints: "amount_cents > 0" }
      - { name: purpose, type: enum, source: input, description: "SELLER_PROCEEDS | PAYOFF | PREMIUM | RECORDING_FEE | CLAIM_PAYOUT", constraints: "SELLER_PROCEEDS | PAYOFF | PREMIUM | RECORDING_FEE | CLAIM_PAYOUT" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED -> WIRED ; REQUESTED/APPROVED -> VOID ; only WIRED reduces escrow_balance", constraints: "REQUESTED | APPROVED | WIRED | VOID" }
      - { name: wire_window_start, type: datetime, source: input, description: "Inclusive start of the bank wire window [start, end) reserved on the escrow account" }
      - { name: wire_window_end, type: datetime, source: input, description: "EXCLUSIVE end of the half-open bank wire window [start, end)" }

  - name: PremiumRemittance
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: gross_premium_cents, type: integer, source: computed, description: "Copied from policy.gross_premium_cents at creation (snapshot)" }
      - { name: agency_retained_cents, type: integer, source: computed, description: "= round_half_up(gross_premium_cents * Agency.remit_split_pct)" }
      - { name: underwriter_remit_cents, type: integer, source: computed, description: "= gross_premium_cents - agency_retained_cents (exhaustive split, no drift)" }
      - { name: status, type: enum, source: system, description: "PENDING -> REMITTED ; PENDING/REMITTED -> REVERSED on policy void", constraints: "PENDING | REMITTED | REVERSED" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the ISSUED policy under which this claim is brought" }
      - { name: claim_type, type: enum, source: input, description: "UNDISCLOSED_LIEN | BOUNDARY_DISPUTE | FORGERY | ACCESS_DEFECT", constraints: "UNDISCLOSED_LIEN | BOUNDARY_DISPUTE | FORGERY | ACCESS_DEFECT" }
      - { name: estimated_loss_cents, type: integer, source: input, description: "Adjuster estimate of the loss in cents (reserve basis)", constraints: "estimated_loss_cents >= 0" }
      - { name: reserve_cents, type: integer, source: computed, description: "Provisional reserve set at FNOL per claim_reserve calc" }
      - { name: settled_loss_cents, type: integer, source: input, description: "Final settled loss in cents, supplied on the PAID transition", default: 0 }
      - { name: paid_cents, type: integer, source: computed, description: "Amount actually paid on PAID = min(settled_loss_cents, policy.coverage_amount_cents)" }
      - { name: status, type: enum, source: system, description: "FNOL -> INVESTIGATING -> CURATIVE -> INVESTIGATING (loop) ; INVESTIGATING -> DENIED ; CURATIVE -> PAID ; PAID/DENIED terminal", constraints: "FNOL | INVESTIGATING | CURATIVE | PAID | DENIED" }
      - { name: version, type: integer, source: system, description: "Optimistic-concurrency version; starts at 1" }

  - name: CurativeAction
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order whose title is being cured" }
      - { name: subject_type, type: enum, source: input, description: "Polymorphic subject discriminator: EXCEPTION | CLAIM", constraints: "EXCEPTION | CLAIM" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic reference: when subject_type=EXCEPTION resolves Exception.id; when subject_type=CLAIM resolves Claim.id" }
      - { name: action_type, type: enum, source: input, description: "PAYOFF | RELEASE_FILED | QUIET_TITLE | INDEMNITY", constraints: "PAYOFF | RELEASE_FILED | QUIET_TITLE | INDEMNITY" }
      - { name: status, type: enum, source: system, description: "OPEN -> RESOLVED ; OPEN -> ABANDONED", constraints: "OPEN | RESOLVED | ABANDONED" }

# =============================================================================
# Table 2: State Machine Table  (§1.2)
# =============================================================================
state_machines:
  - entity: Agency
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /title/agencies/{id}/transitions (to_status=SUSPENDED)"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /title/agencies/{id}/transitions (to_status=ACTIVE)"
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: Order
    initial_state: OPENED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: OPENED
        to: IN_TITLE
        trigger: "POST /title/orders/{id}/transitions (to_status=IN_TITLE)"
        actor: TitleOfficer
        preconditions:
          - "At least one TitleSearch exists for the order in status ORDERED or IN_EXAM"
        side_effects: []

      - from: IN_TITLE
        to: COMMITTED
        trigger: "POST /title/orders/{id}/transitions (to_status=COMMITTED)"
        actor: TitleOfficer
        preconditions:
          - "Order has a Commitment in status ISSUED (cross-entity: Commitment.status == ISSUED) (ERR_NO_ISSUED_COMMITMENT)"
          - "Order has a TitleSearch in status COMPLETED with chain_verified == true (ERR_CHAIN_NOT_VERIFIED)"
        side_effects: []

      - from: COMMITTED
        to: CLEAR_TO_CLOSE
        trigger: "POST /title/orders/{id}/transitions (to_status=CLEAR_TO_CLOSE)"
        actor: TitleOfficer
        preconditions:
          - "The order's ISSUED Commitment has open_exception_count == 0 (every Exception is WAIVED or CLEARED) (ERR_EXCEPTIONS_OPEN)"
          - "Order has at least one Policy in status ISSUED (ERR_NO_ISSUED_POLICY)"
        side_effects: []

      - from: CLEAR_TO_CLOSE
        to: CLOSED
        trigger: "POST /title/orders/{id}/transitions (to_status=CLOSED) OR auto on escrow_balance reaching 0 via Disbursement WIRE"
        actor: TitleOfficer
        preconditions:
          - "escrow_balance_cents == 0 (every deposited dollar disbursed) (ERR_ESCROW_NOT_ZERO)"
        side_effects:
          - "gap_open set false (recording complete, gap window closed)"

      - from: OPENED
        to: CANCELLED
        trigger: "POST /title/orders/{id}/transitions (to_status=CANCELLED)"
        actor: Agency
        preconditions:
          - "escrow_balance_cents == 0 (no posted funds left in trust) (ERR_ESCROW_NOT_ZERO)"
        side_effects: []

      - from: IN_TITLE
        to: CANCELLED
        trigger: "POST /title/orders/{id}/transitions (to_status=CANCELLED)"
        actor: Agency
        preconditions:
          - "escrow_balance_cents == 0 (ERR_ESCROW_NOT_ZERO)"
        side_effects:
          - "CASCADE A link 1: every Commitment of the order in {ISSUED, UPDATED, DRAFT} -> CANCELLED"

      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /title/orders/{id}/transitions (to_status=CANCELLED)"
        actor: Agency
        preconditions:
          - "escrow_balance_cents == 0 (ERR_ESCROW_NOT_ZERO)"
        side_effects:
          - "CASCADE A link 1: every Commitment of the order in {ISSUED, UPDATED, DRAFT} -> CANCELLED (which itself fires CASCADE A link 2 on Policies, then link 3 on PremiumRemittances/Endorsements)"

  - entity: TitleSearch
    initial_state: ORDERED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ORDERED
        to: IN_EXAM
        trigger: "POST /title/title-searches/{id}/transitions (to_status=IN_EXAM)"
        actor: TitleOfficer
        preconditions: []
        side_effects: []

      - from: IN_EXAM
        to: COMPLETED
        trigger: "POST /title/title-searches/{id}/transitions (to_status=COMPLETED)"
        actor: TitleOfficer
        preconditions:
          - "Request supplies chain_verified, gap_from_date, gap_to_date"
          - "gap_from_date <= gap_to_date (ERR_INVALID_GAP_WINDOW)"
        side_effects:
          - "chain_verified, gap_from_date, gap_to_date persisted"
          - "parent Order.gap_open set true (the uninsured gap window opens; gap-defect checks now apply to the parcel)"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /title/title-searches/{id}/transitions (to_status=CANCELLED)"
        actor: TitleOfficer
        preconditions: []
        side_effects: []

      - from: IN_EXAM
        to: CANCELLED
        trigger: "POST /title/title-searches/{id}/transitions (to_status=CANCELLED)"
        actor: TitleOfficer
        preconditions: []
        side_effects: []

  - entity: Commitment
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /title/commitments/{id}/transitions (to_status=ISSUED)"
        actor: TitleOfficer
        preconditions:
          - "No OTHER Commitment on the same order is currently in status ISSUED (the create-supersede mechanic keeps at most one ISSUED commitment per order) (ERR_INVALID_STATE)"
        side_effects: []

      - from: ISSUED
        to: UPDATED
        trigger: "POST /title/orders/{id}/commitments (re-issue create supersedes prior; prior ISSUED commitment flips to UPDATED)"
        actor: TitleOfficer
        preconditions:
          - "Prior commitment is the order's current ISSUED commitment"
        side_effects:
          - "revision_no of the prior commitment incremented by 1"
          - "Order.version incremented by 1 (OCC parent bump for commitment re-issue)"

      - from: UPDATED
        to: ISSUED
        trigger: "POST /title/commitments/{id}/transitions (to_status=ISSUED) (re-issue of a superseded commitment; revision loop)"
        actor: TitleOfficer
        preconditions:
          - "No OTHER Commitment on the same order is currently in status ISSUED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /title/commitments/{id}/transitions (to_status=EXPIRED)"
        actor: TitleOfficer
        preconditions:
          - "Logical clock now >= expiry_date (ERR_COMMITMENT_NOT_EXPIRABLE)"
        side_effects:
          - "Every child Exception in {RAISED, CURATIVE_PENDING} -> VOID"

      - from: ISSUED
        to: CANCELLED
        trigger: "system cascade from Order CANCEL (CASCADE A link 1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2: every Policy of this commitment in {PENDING, ISSUED} -> VOID (which itself fires CASCADE A link 3)"
          - "Every child Exception in {RAISED, CURATIVE_PENDING} -> VOID"

      - from: UPDATED
        to: CANCELLED
        trigger: "system cascade from Order CANCEL (CASCADE A link 1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2: every Policy of this commitment in {PENDING, ISSUED} -> VOID"

      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade from Order CANCEL (CASCADE A link 1)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Exception
    initial_state: RAISED
    terminal_states: [WAIVED, CLEARED, VOID]
    transitions:
      - from: RAISED
        to: WAIVED
        trigger: "POST /title/exceptions/{id}/transitions (to_status=WAIVED)"
        actor: TitleOfficer
        preconditions:
          - "curative_required == false (a curative-required exception cannot be waived) (ERR_CURATIVE_REQUIRED)"
        side_effects:
          - "Parent Commitment.open_exception_count recomputed"

      - from: RAISED
        to: CURATIVE_PENDING
        trigger: "POST /title/exceptions/{id}/transitions (to_status=CURATIVE_PENDING)"
        actor: TitleOfficer
        preconditions: []
        side_effects: []

      - from: CURATIVE_PENDING
        to: CLEARED
        trigger: "POST /title/exceptions/{id}/transitions (to_status=CLEARED)"
        actor: TitleOfficer
        preconditions:
          - "A CurativeAction with subject_type=EXCEPTION, subject_id=this exception exists in status RESOLVED (ERR_NO_RESOLVED_CURATIVE)"
        side_effects:
          - "Parent Commitment.open_exception_count recomputed"

      - from: CURATIVE_PENDING
        to: RAISED
        trigger: "POST /title/exceptions/{id}/transitions (to_status=RAISED) (curative failed; revert)"
        actor: TitleOfficer
        preconditions: []
        side_effects: []

      - from: RAISED
        to: VOID
        trigger: "system cascade from Commitment EXPIRED or Commitment CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Commitment.open_exception_count recomputed"

      - from: CURATIVE_PENDING
        to: VOID
        trigger: "system cascade from Commitment EXPIRED or Commitment CANCELLED"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Commitment.open_exception_count recomputed"

  - entity: Policy
    initial_state: PENDING
    terminal_states: [VOID]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /title/policies/{id}/transitions (to_status=ISSUED)"
        actor: Underwriter
        preconditions:
          - "The policy's Commitment is in status ISSUED (cross-entity: Commitment.status == ISSUED) (ERR_COMMITMENT_NOT_ISSUED)"
          - "The Commitment has open_exception_count == 0 (ERR_EXCEPTIONS_OPEN)"
          - "coverage_amount_cents <= Commitment.insured_amount_cents (ERR_COVERAGE_EXCEEDS_COMMITMENT)"
        side_effects:
          - "gross_premium_cents computed and frozen per owner_premium / lender_premium calc"
          - "A PremiumRemittance is created in status PENDING with the split snapshot (premium_split calc)"

      - from: ISSUED
        to: VOID
        trigger: "POST /title/policies/{id}/transitions (to_status=VOID) OR system cascade from Commitment CANCEL (CASCADE A link 2)"
        actor: Underwriter
        preconditions:
          - "No Claim under this policy is in status {INVESTIGATING, CURATIVE} (ERR_POLICY_HAS_OPEN_CLAIM)"
        side_effects:
          - "CASCADE A link 3: this policy's PremiumRemittance in {PENDING, REMITTED} -> REVERSED; every Endorsement in {REQUESTED, ATTACHED} -> REMOVED"

      - from: PENDING
        to: VOID
        trigger: "system cascade from Commitment CANCEL (CASCADE A link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 3: any PremiumRemittance -> REVERSED; every Endorsement -> REMOVED"

  - entity: Endorsement
    initial_state: REQUESTED
    terminal_states: [REMOVED]
    transitions:
      - from: REQUESTED
        to: ATTACHED
        trigger: "POST /title/endorsements/{id}/transitions (to_status=ATTACHED)"
        actor: Underwriter
        preconditions:
          - "Parent Policy.status == ISSUED (cross-entity) (ERR_POLICY_NOT_ISSUED)"
        side_effects:
          - "charge_cents computed = round_half_up(policy.gross_premium_cents * charge_pct)"

      - from: ATTACHED
        to: REMOVED
        trigger: "POST /title/endorsements/{id}/transitions (to_status=REMOVED) OR system cascade from Policy VOID"
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: REQUESTED
        to: REMOVED
        trigger: "system cascade from Policy VOID (CASCADE A link 3)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EscrowDeposit
    initial_state: RECEIVED
    terminal_states: [REVERSED]
    transitions:
      - from: RECEIVED
        to: POSTED
        trigger: "POST /title/deposits/{id}/transitions (to_status=POSTED)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Order.escrow_deposit_total_cents and escrow_balance_cents recomputed (escrow_balance calc)"

      - from: POSTED
        to: REVERSED
        trigger: "POST /title/deposits/{id}/transitions (to_status=REVERSED)"
        actor: Underwriter
        preconditions:
          - "Reversing this deposit does not drive escrow_balance_cents negative (ERR_ESCROW_WOULD_GO_NEGATIVE)"
        side_effects:
          - "Order.escrow_deposit_total_cents and escrow_balance_cents recomputed (compensating action; trust cash invariant preserved)"

      - from: RECEIVED
        to: REVERSED
        trigger: "POST /title/deposits/{id}/transitions (to_status=REVERSED)"
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [WIRED, VOID]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /title/disbursements/{id}/transitions (to_status=APPROVED)"
        actor: Underwriter
        preconditions:
          - "Parent Order.status IN {CLEAR_TO_CLOSE, CLOSED} for non-CLAIM_PAYOUT purposes; CLAIM_PAYOUT allowed when Order.status == CLOSED (cross-entity) (ERR_ORDER_NOT_DISBURSABLE)"
        side_effects: []

      - from: APPROVED
        to: WIRED
        trigger: "POST /title/disbursements/{id}/transitions (to_status=WIRED)"
        actor: Underwriter
        preconditions:
          - "amount_cents <= Order.escrow_balance_cents (ERR_INSUFFICIENT_ESCROW)"
          - "wire window [wire_window_start, wire_window_end) does not overlap any other WIRED disbursement window on the same order (ERR_WIRE_WINDOW_OVERLAP)"
        side_effects:
          - "CASCADE B link 1: Order.escrow_disbursed_total_cents += amount_cents; escrow_balance_cents recomputed"
          - "CASCADE B link 2: if escrow_balance_cents == 0 AND Order.status == CLEAR_TO_CLOSE -> Order auto-transitions CLEAR_TO_CLOSE -> CLOSED (gap_open set false)"

      - from: REQUESTED
        to: VOID
        trigger: "POST /title/disbursements/{id}/transitions (to_status=VOID)"
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: VOID
        trigger: "POST /title/disbursements/{id}/transitions (to_status=VOID)"
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: PremiumRemittance
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: REMITTED
        trigger: "POST /title/remittances/{id}/transitions (to_status=REMITTED)"
        actor: Underwriter
        preconditions:
          - "Parent Policy.status == ISSUED (cross-entity) (ERR_POLICY_NOT_ISSUED)"
        side_effects: []

      - from: PENDING
        to: REVERSED
        trigger: "system cascade from Policy VOID (CASCADE A link 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Premium-conservation invariant preserved: agency_retained_cents + underwriter_remit_cents == gross_premium_cents is unwound atomically"

      - from: REMITTED
        to: REVERSED
        trigger: "system cascade from Policy VOID (CASCADE A link 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Premium-conservation invariant preserved on reversal"

  - entity: Claim
    initial_state: FNOL
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FNOL
        to: INVESTIGATING
        trigger: "POST /title/claims/{id}/transitions (to_status=INVESTIGATING)"
        actor: Underwriter
        preconditions:
          - "Parent Policy.status == ISSUED (cross-entity) (ERR_POLICY_NOT_ISSUED)"
        side_effects:
          - "reserve_cents computed per claim_reserve calc (provisional reserve)"

      - from: INVESTIGATING
        to: CURATIVE
        trigger: "POST /title/claims/{id}/transitions (to_status=CURATIVE)"
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: CURATIVE
        to: INVESTIGATING
        trigger: "POST /title/claims/{id}/transitions (to_status=INVESTIGATING) (curative inconclusive; loop back)"
        actor: Underwriter
        preconditions: []
        side_effects: []

      - from: INVESTIGATING
        to: DENIED
        trigger: "POST /title/claims/{id}/transitions (to_status=DENIED)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "reserve_cents set to 0 (reserve released)"

      - from: CURATIVE
        to: PAID
        trigger: "POST /title/claims/{id}/transitions (to_status=PAID, settled_loss_cents=...)"
        actor: Underwriter
        preconditions:
          - "A CurativeAction with subject_type=CLAIM, subject_id=this claim exists in status RESOLVED (ERR_NO_RESOLVED_CURATIVE)"
          - "Request supplies settled_loss_cents"
        side_effects:
          - "paid_cents = min(settled_loss_cents, policy.coverage_amount_cents) (claim_payout calc, final variant)"
          - "reserve_cents set to 0"

  - entity: CurativeAction
    initial_state: OPEN
    terminal_states: [RESOLVED, ABANDONED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /title/curative-actions/{id}/transitions (to_status=RESOLVED)"
        actor: TitleOfficer
        preconditions: []
        side_effects:
          - "Unblocks the dependent Exception CLEARED or Claim PAID precondition for the cited subject"

      - from: OPEN
        to: ABANDONED
        trigger: "POST /title/curative-actions/{id}/transitions (to_status=ABANDONED)"
        actor: TitleOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: commitment-reissue-stale-order
    parent_entity: Order
    write_endpoint: "POST /title/orders/{id}/commitments"
    occ_field: "expected_order_version"
    description: |
      Creating a re-issued Commitment supersedes the order's current ISSUED
      commitment (flipping it to UPDATED). When the order's version has advanced
      since the client last observed it, the create is rejected on a stale version:
      another writer has already re-issued the commitment and the current writer's
      view of the order is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disbursement-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /title/orders/{id}/disbursements"
    occ_field: "expected_order_version"
    description: |
      Creating a Disbursement draws against the order's escrow balance. When the
      order's version has advanced since the client last read it (another writer
      created a disbursement that legitimately drew down the trust balance), the
      create is rejected on a stale version so the new wire is not authorized
      against an outdated balance view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table  (§1.3)
# =============================================================================
calculations:
  - name: owner_premium
    trigger: "Policy PENDING -> ISSUED for policy_type=OWNER"
    algorithm: tiered_pricing
    formula: |
      cov_dollars = coverage_amount_cents / 100
      base = 0
      tier1 = min(cov_dollars, 100000)
      base += (tier1 / 1000) * RATE1_PER_1000          # first $100,000
      if cov_dollars > 100000:
        tier2 = min(cov_dollars, 500000) - 100000
        base += (tier2 / 1000) * RATE2_PER_1000         # $100,000.01 .. $500,000
      if cov_dollars > 500000:
        tier3 = cov_dollars - 500000
        base += (tier3 / 1000) * RATE3_PER_1000         # above $500,000
      base_cents = base * 100
      if is_reissue (variant): base_cents = base_cents * REISSUE_FACTOR
      gross_premium_cents = round_half_up(base_cents)
    input_set: "Single Policy with policy_type=OWNER at issuance; coverage_amount_cents, is_reissue."
    constants:
      RATE1_PER_1000: 5.00
      RATE2_PER_1000: 4.00
      RATE3_PER_1000: 3.00
      TIER1_CEIL_DOLLARS: 100000
      TIER2_CEIL_DOLLARS: 500000
      REISSUE_FACTOR: 0.60
    precision: "round_half_up to whole cents; reissue factor applied to the un-rounded base, then rounded once"
    variants:
      - name: standard_rate
        when: "is_reissue == false (new PURCHASE owner policy)"
        difference: "Full tiered rate; no reissue factor."
      - name: reissue_rate
        when: "is_reissue == true (qualifying prior policy within REISSUE_WINDOW_YEARS)"
        difference: "Multiplies the un-rounded tiered base by REISSUE_FACTOR (0.60) before the single final rounding — strictly lower premium for identical coverage."

  - name: lender_premium
    trigger: "Policy PENDING -> ISSUED for policy_type=LENDER"
    algorithm: tiered_pricing
    formula: |
      base_cents = owner_premium tiered base for coverage_amount_cents (same RATE tiers, no reissue factor)
      if co_issued_with_owner (variant): final = CO_ISSUE_FLAT_CENTS    # flat co-issue rate
      else: final = round_half_up(base_cents)
      gross_premium_cents = final
    input_set: "Single Policy with policy_type=LENDER at issuance; coverage_amount_cents, co_issued_with_owner."
    constants:
      CO_ISSUE_FLAT_CENTS: 2500
    precision: "round_half_up to whole cents"
    variants:
      - name: standalone_lender
        when: "co_issued_with_owner == false"
        difference: "Full tiered base (same tiers as owner_premium), rounded."
      - name: co_issue
        when: "co_issued_with_owner == true (issued alongside an OWNER policy on the same order)"
        difference: "Flat CO_ISSUE_FLAT_CENTS (2500) regardless of tiered base — evaluation order pins owner premium first, then lender at the co-issue flat rate."

  - name: premium_split
    trigger: "PremiumRemittance creation on Policy PENDING -> ISSUED"
    algorithm: aggregation
    formula: |
      gross = policy.gross_premium_cents
      agency_retained_cents  = round_half_up(gross * Agency.remit_split_pct)   # ROUND FIRST
      underwriter_remit_cents = gross - agency_retained_cents                   # THEN SUBTRACT (exhaustive)
    input_set: "Single Policy's gross_premium_cents and the owning Agency's remit_split_pct."
    constants: {}
    precision: |
      Rounding ORDER is pinned: round agency_retained_cents to whole cents FIRST, then
      derive underwriter_remit_cents = gross - agency_retained_cents. This guarantees
      agency_retained_cents + underwriter_remit_cents == gross_premium_cents with zero drift.
      Computing both halves independently and rounding each would not conserve the gross.

  - name: claim_reserve
    trigger: "Claim FNOL -> INVESTIGATING (provisional reserve); recomputed value frozen until settlement"
    algorithm: weighted_scoring
    formula: |
      loaded = estimated_loss_cents * LOSS_LOADING_FACTOR     # defense/curative loading
      reserve_cents = min(round_half_up(loaded), policy.coverage_amount_cents)   # capped at coverage
    input_set: "Single Claim's estimated_loss_cents and parent Policy.coverage_amount_cents."
    constants:
      LOSS_LOADING_FACTOR: 1.15
    precision: "round_half_up to whole cents, then cap at coverage"
    variants:
      - name: provisional_reserve
        when: "Claim transitions FNOL -> INVESTIGATING"
        difference: "Reserve from the adjuster ESTIMATE (estimated_loss_cents) with LOSS_LOADING_FACTOR; an open exposure number."
      - name: final_payout
        when: "Claim transitions CURATIVE -> PAID with settled_loss_cents"
        difference: "paid_cents = min(settled_loss_cents, coverage) using the ACTUAL settled loss (no loading factor); reserve released to 0. Same Claim, different number than the provisional reserve."

  - name: escrow_balance
    trigger: "EscrowDeposit POST/REVERSE and Disbursement WIRE; any change to deposits/disbursements"
    algorithm: aggregation
    formula: |
      escrow_deposit_total_cents  = sum(EscrowDeposit.amount_cents WHERE order_id=this AND status == POSTED)
      escrow_disbursed_total_cents = sum(Disbursement.amount_cents WHERE order_id=this AND status == WIRED)
      escrow_balance_cents = escrow_deposit_total_cents - escrow_disbursed_total_cents
    input_set: "All EscrowDeposit rows in status POSTED and all Disbursement rows in status WIRED for the order."
    constants: {}
    precision: "integer cents; exact"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)  (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7; entity-backed Agency may act only on its own orders (Order.agency_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist within scope, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integer/number ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_order_version matches Order.version on commitment re-issue and disbursement create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /title/orders/{id}/commitments, POST /title/orders/{id}/disbursements"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /transitions endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity preconditions on the referenced entity's state (e.g. Policy issue requires Commitment ISSUED; Disbursement APPROVE requires Order CLEAR_TO_CLOSE/CLOSED)"
    error_id: ERR_COMMITMENT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /title/policies/{id}/transitions, POST /title/orders/{id}/transitions, POST /title/disbursements/{id}/transitions"

  - priority: 8
    category: business_temporal
    check: "Temporal-overlap rules. (a) parcel gap defect (CLOSED interval): a LIEN/MORTGAGE plant record whose recorded_date is inside the closed gap window [gap_from_date, gap_to_date] of an active gap on the same parcel -> ERR_GAP_DEFECT. (b) disbursement wire-window overlap (HALF-OPEN interval): a WIRE whose half-open window [wire_window_start, wire_window_end) collides with another WIRED disbursement window on the order -> ERR_WIRE_WINDOW_OVERLAP (exactly adjacent windows are allowed)."
    error_id: ERR_GAP_DEFECT
    http_status: 409
    applies_to: "POST /title/plant-records, POST /title/disbursements/{id}/transitions"

  - priority: 9
    category: business_safety
    check: "Title-safety / curative gates (an insurer may not insure over an uncured defect): commitment open_exception_count must be 0 before policy issue or CLEAR_TO_CLOSE (ERR_EXCEPTIONS_OPEN); a curative_required exception cannot be WAIVED (ERR_CURATIVE_REQUIRED); Exception CLEARED / Claim PAID require a RESOLVED CurativeAction (ERR_NO_RESOLVED_CURATIVE)"
    error_id: ERR_EXCEPTIONS_OPEN
    http_status: 409
    applies_to: "POST /title/policies/{id}/transitions, POST /title/orders/{id}/transitions, POST /title/exceptions/{id}/transitions, POST /title/claims/{id}/transitions"

  - priority: 10
    category: business_fiscal
    check: "Fiscal checks last: coverage <= commitment insured amount; disbursement <= escrow balance; reversal must not drive balance negative; order close/cancel requires escrow_balance == 0"
    error_id: ERR_INSUFFICIENT_ESCROW
    http_status: 409
    applies_to: "POST /title/disbursements/{id}/transitions, POST /title/policies/{id}/transitions, POST /title/deposits/{id}/transitions, POST /title/orders/{id}/transitions"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table  (§1.5)
# =============================================================================
endpoints:
  # ---- Agency ----
  - method: POST
    path: "/title/agencies"
    description: "Register a title agency"
    roles: [Underwriter]
    code: 201
    input: [name, remit_split_pct]
    output: Agency
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/title/agencies/{id}"
    description: "Get an agency"
    roles: [Underwriter, Agency]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: POST
    path: "/title/agencies/{id}/transitions"
    description: "Transition agency status (SUSPEND/REACTIVATE)"
    roles: [Underwriter]
    code: 200
    input: [to_status]
    output: Agency
    side_effects: ["Agency state machine"]

  # ---- TitlePlantRecord (chain-of-title reference data) ----
  - method: POST
    path: "/title/plant-records"
    description: "Add a recorded instrument to the title plant (chain-of-title). Rejected with ERR_GAP_DEFECT when a LIEN/MORTGAGE recorded_date falls inside the CLOSED gap window [gap_from_date, gap_to_date] of any COMPLETED TitleSearch on the same parcel whose order is still gap_open."
    roles: [TitleOfficer]
    code: 201
    input: [parcel_id, county, instrument_type, recorded_date, sequence_no, grantor, grantee]
    output: TitlePlantRecord
    side_effects: ["gap-defect overlap check against active gap windows on the parcel"]

  - method: GET
    path: "/title/plant-records/{id}"
    description: "Get a single plant record"
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: []
    output: TitlePlantRecord
    side_effects: []

  - method: GET
    path: "/title/plant-records"
    description: "List plant records, filterable by parcel_id for chain-of-title walk"
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: ["parcel_id?", "limit?", "offset?"]
    output: TitlePlantRecord[]
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/title/orders"
    description: "Open a new title order"
    roles: [Agency]
    code: 201
    input: [agency_id, parcel_id, county, transaction_type, sales_price_cents, loan_amount_cents]
    output: Order
    side_effects: ["status=OPENED; escrow_balance_cents=0; gap_open=false"]

  - method: GET
    path: "/title/orders/{id}"
    description: "Get an order (includes computed escrow fields)"
    roles: [Agency, TitleOfficer, Underwriter]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/title/orders"
    description: "List orders, filterable by agency_id"
    roles: [Agency, TitleOfficer, Underwriter]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/title/orders/{id}/transitions"
    description: "Transition order status; CANCEL fires CASCADE A; CLOSE requires escrow_balance==0"
    roles: [Agency, TitleOfficer]
    code: 200
    input: [to_status]
    output: Order
    side_effects: ["Order state machine; CASCADE A on CANCEL"]

  # ---- TitleSearch ----
  - method: POST
    path: "/title/orders/{id}/title-searches"
    description: "Order a title search/exam under an order"
    roles: [TitleOfficer]
    code: 201
    input: [searched_parcel_id, effective_date]
    output: TitleSearch
    side_effects: ["status=ORDERED"]

  - method: GET
    path: "/title/orders/{id}/title-searches"
    description: "List title searches for an order (FK reverse-reachability TitleSearch.order_id)"
    roles: [TitleOfficer, Underwriter, Agency]
    code: 200
    input: ["limit?", "offset?"]
    output: TitleSearch[]
    side_effects: []

  - method: GET
    path: "/title/title-searches/{id}"
    description: "Get a title search"
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: []
    output: TitleSearch
    side_effects: []

  - method: POST
    path: "/title/title-searches/{id}/transitions"
    description: "Transition title search; COMPLETED persists chain_verified + gap window"
    roles: [TitleOfficer]
    code: 200
    input: [to_status, "chain_verified?", "gap_from_date?", "gap_to_date?"]
    output: TitleSearch
    side_effects: ["TitleSearch state machine"]

  # ---- Commitment ----
  - method: POST
    path: "/title/orders/{id}/commitments"
    description: "Issue (or re-issue) a commitment for an order; re-issue supersedes prior ISSUED commitment (-> UPDATED) and bumps Order.version (OCC)"
    roles: [TitleOfficer]
    code: 201
    input: [effective_date, expiry_date, schedule_a_estate, insured_amount_cents, expected_order_version]
    output: Commitment
    side_effects: ["status=DRAFT; on re-issue prior ISSUED commitment -> UPDATED, revision_no incremented; increments Order.version by 1"]

  - method: GET
    path: "/title/orders/{id}/commitments"
    description: "List commitments for an order (FK reverse-reachability Commitment.order_id)"
    roles: [TitleOfficer, Underwriter, Agency]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Commitment[]
    side_effects: []

  - method: GET
    path: "/title/commitments/{id}"
    description: "Get a commitment (Schedule A + computed open_exception_count)"
    roles: [TitleOfficer, Underwriter, Agency]
    code: 200
    input: []
    output: Commitment
    side_effects: []

  - method: POST
    path: "/title/commitments/{id}/transitions"
    description: "Transition commitment status (DRAFT->ISSUED, UPDATED->ISSUED revision loop, ISSUED->EXPIRED)"
    roles: [TitleOfficer]
    code: 200
    input: [to_status]
    output: Commitment
    side_effects: ["Commitment state machine; window-overlap check on ISSUED"]

  # ---- Exception (Schedule B) ----
  - method: POST
    path: "/title/commitments/{id}/exceptions"
    description: "Raise a Schedule B exception on a commitment"
    roles: [TitleOfficer]
    code: 201
    input: [exception_type, description, "curative_required?"]
    output: Exception
    side_effects: ["status=RAISED; parent Commitment.open_exception_count recomputed"]

  - method: GET
    path: "/title/commitments/{id}/exceptions"
    description: "List exceptions for a commitment (FK reverse-reachability Exception.commitment_id)"
    roles: [TitleOfficer, Underwriter, Agency]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Exception[]
    side_effects: []

  - method: GET
    path: "/title/exceptions/{id}"
    description: "Get an exception"
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: []
    output: Exception
    side_effects: []

  - method: POST
    path: "/title/exceptions/{id}/transitions"
    description: "Transition exception (WAIVE/CURATIVE_PENDING/CLEARED/revert)"
    roles: [TitleOfficer]
    code: 200
    input: [to_status]
    output: Exception
    side_effects: ["Exception state machine; parent open_exception_count recomputed"]

  # ---- Policy ----
  - method: POST
    path: "/title/orders/{id}/policies"
    description: "Create an owner or lender policy (PENDING) tied to a commitment"
    roles: [Underwriter]
    code: 201
    input: [commitment_id, policy_type, coverage_amount_cents, "is_reissue?", "co_issued_with_owner?"]
    output: Policy
    side_effects: ["status=PENDING; version=1"]

  - method: GET
    path: "/title/policies"
    description: "List policies, filterable by order_id and/or commitment_id (FK reverse-reachability Policy.order_id and Policy.commitment_id)"
    roles: [Underwriter, TitleOfficer, Agency]
    code: 200
    input: ["order_id?", "commitment_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/title/policies/{id}"
    description: "Get a policy (includes computed gross_premium_cents once ISSUED)"
    roles: [Underwriter, TitleOfficer, Agency]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/title/policies/{id}/transitions"
    description: "Transition policy (ISSUE computes premium + creates PremiumRemittance; VOID fires CASCADE A link 3)"
    roles: [Underwriter]
    code: 200
    input: [to_status]
    output: Policy
    side_effects: ["Policy state machine; premium calc on ISSUE; remittance create on ISSUE; cascade on VOID"]

  # ---- Endorsement ----
  - method: POST
    path: "/title/policies/{id}/endorsements"
    description: "Request an endorsement on a policy"
    roles: [Underwriter]
    code: 201
    input: [form_code, charge_pct]
    output: Endorsement
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/title/policies/{id}/endorsements"
    description: "List endorsements for a policy (FK reverse-reachability Endorsement.policy_id)"
    roles: [Underwriter, TitleOfficer, Agency]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Endorsement[]
    side_effects: []

  - method: GET
    path: "/title/endorsements/{id}"
    description: "Get an endorsement"
    roles: [Underwriter, TitleOfficer]
    code: 200
    input: []
    output: Endorsement
    side_effects: []

  - method: POST
    path: "/title/endorsements/{id}/transitions"
    description: "Transition endorsement (ATTACH computes charge_cents; REMOVE)"
    roles: [Underwriter]
    code: 200
    input: [to_status]
    output: Endorsement
    side_effects: ["Endorsement state machine; charge calc on ATTACH"]

  # ---- EscrowDeposit ----
  - method: POST
    path: "/title/orders/{id}/deposits"
    description: "Record an incoming escrow deposit on an order"
    roles: [Agency, Underwriter]
    code: 201
    input: [amount_cents, source_ref]
    output: EscrowDeposit
    side_effects: ["status=RECEIVED"]

  - method: GET
    path: "/title/orders/{id}/deposits"
    description: "List deposits for an order (FK reverse-reachability EscrowDeposit.order_id)"
    roles: [Agency, Underwriter, TitleOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EscrowDeposit[]
    side_effects: []

  - method: GET
    path: "/title/deposits/{id}"
    description: "Get a deposit"
    roles: [Agency, Underwriter]
    code: 200
    input: []
    output: EscrowDeposit
    side_effects: []

  - method: POST
    path: "/title/deposits/{id}/transitions"
    description: "Transition deposit (POST -> recompute escrow; REVERSE -> compensating recompute)"
    roles: [Underwriter]
    code: 200
    input: [to_status]
    output: EscrowDeposit
    side_effects: ["EscrowDeposit state machine; escrow_balance recompute"]

  # ---- Disbursement ----
  - method: POST
    path: "/title/orders/{id}/disbursements"
    description: "Request an outgoing wire/disbursement against the order escrow; bumps Order.version (OCC)"
    roles: [Underwriter]
    code: 201
    input: [payee, amount_cents, purpose, wire_window_start, wire_window_end, expected_order_version]
    output: Disbursement
    side_effects: ["status=REQUESTED; increments Order.version by 1"]

  - method: GET
    path: "/title/orders/{id}/disbursements"
    description: "List disbursements for an order (FK reverse-reachability Disbursement.order_id)"
    roles: [Underwriter, Agency, TitleOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: GET
    path: "/title/disbursements/{id}"
    description: "Get a disbursement"
    roles: [Underwriter, Agency]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: POST
    path: "/title/disbursements/{id}/transitions"
    description: "Transition disbursement (APPROVE/WIRE/VOID); WIRE fires CASCADE B and may auto-close order"
    roles: [Underwriter]
    code: 200
    input: [to_status]
    output: Disbursement
    side_effects: ["Disbursement state machine; CASCADE B on WIRE"]

  # ---- PremiumRemittance ----
  - method: GET
    path: "/title/policies/{id}/remittances"
    description: "List premium remittances for a policy (FK reverse-reachability PremiumRemittance.policy_id)"
    roles: [Underwriter, Agency]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PremiumRemittance[]
    side_effects: []

  - method: GET
    path: "/title/remittances/{id}"
    description: "Get a premium remittance (split snapshot)"
    roles: [Underwriter, Agency]
    code: 200
    input: []
    output: PremiumRemittance
    side_effects: []

  - method: POST
    path: "/title/remittances/{id}/transitions"
    description: "Transition remittance (REMIT)"
    roles: [Underwriter]
    code: 200
    input: [to_status]
    output: PremiumRemittance
    side_effects: ["PremiumRemittance state machine"]

  # ---- Claim ----
  - method: POST
    path: "/title/policies/{id}/claims"
    description: "File a claim (FNOL) under an issued policy"
    roles: [Underwriter]
    code: 201
    input: [claim_type, estimated_loss_cents]
    output: Claim
    side_effects: ["status=FNOL; version=1"]

  - method: GET
    path: "/title/policies/{id}/claims"
    description: "List claims for a policy (FK reverse-reachability Claim.policy_id)"
    roles: [Underwriter, Agency]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/title/claims/{id}"
    description: "Get a claim (includes reserve_cents/paid_cents)"
    roles: [Underwriter, Agency]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/title/claims/{id}/transitions"
    description: "Transition claim (INVESTIGATING computes reserve; CURATIVE<->INVESTIGATING loop; PAID computes payout)"
    roles: [Underwriter]
    code: 200
    input: [to_status, "settled_loss_cents?"]
    output: Claim
    side_effects: ["Claim state machine; reserve calc; payout calc on PAID"]

  # ---- CurativeAction ----
  - method: POST
    path: "/title/orders/{id}/curative-actions"
    description: "Open a curative action against an exception or claim on the order"
    roles: [TitleOfficer, Underwriter]
    code: 201
    input: [subject_type, subject_id, action_type]
    output: CurativeAction
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/title/orders/{id}/curative-actions"
    description: "List curative actions for an order (FK reverse-reachability CurativeAction.order_id)"
    roles: [TitleOfficer, Underwriter, Agency]
    code: 200
    input: ["subject_type?", "subject_id?", "status?", "limit?", "offset?"]
    output: CurativeAction[]
    side_effects: []

  - method: GET
    path: "/title/curative-actions/{id}"
    description: "Get a curative action"
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: []
    output: CurativeAction
    side_effects: []

  - method: POST
    path: "/title/curative-actions/{id}/transitions"
    description: "Transition curative action (RESOLVE/ABANDON)"
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: [to_status]
    output: CurativeAction
    side_effects: ["CurativeAction state machine"]

  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/title/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. Used for commitment-expiry and gap-window determinism."
    roles: [TitleOfficer, Underwriter]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced"]

# =============================================================================
# Table 6: Error Code Catalog  (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Agency acting on an order it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist in scope" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, out-of-range number" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version does not match current Order.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_INVALID_GAP_WINDOW, http: 422, condition: "TitleSearch COMPLETED with gap_from_date > gap_to_date" }
  - { id: ERR_NO_ISSUED_COMMITMENT, http: 409, condition: "Order -> COMMITTED requires a Commitment in ISSUED" }
  - { id: ERR_CHAIN_NOT_VERIFIED, http: 409, condition: "Order -> COMMITTED requires a COMPLETED TitleSearch with chain_verified == true" }
  - { id: ERR_EXCEPTIONS_OPEN, http: 409, condition: "Operation requires the commitment's open_exception_count == 0" }
  - { id: ERR_NO_ISSUED_POLICY, http: 409, condition: "Order -> CLEAR_TO_CLOSE requires at least one ISSUED policy" }
  - { id: ERR_COMMITMENT_NOT_ISSUED, http: 409, condition: "Policy issue requires its Commitment in ISSUED" }
  - { id: ERR_COVERAGE_EXCEEDS_COMMITMENT, http: 409, condition: "Policy coverage_amount_cents exceeds Commitment.insured_amount_cents" }
  - { id: ERR_COMMITMENT_NOT_EXPIRABLE, http: 409, condition: "Commitment -> EXPIRED before logical clock reaches expiry_date" }
  - { id: ERR_GAP_DEFECT, http: 409, condition: "LIEN/MORTGAGE plant record recorded_date falls inside the closed gap window of an active gap on the parcel" }
  - { id: ERR_POLICY_NOT_ISSUED, http: 409, condition: "Operation requires the parent Policy in ISSUED" }
  - { id: ERR_POLICY_HAS_OPEN_CLAIM, http: 409, condition: "Policy VOID blocked while a claim is INVESTIGATING or CURATIVE" }
  - { id: ERR_CURATIVE_REQUIRED, http: 409, condition: "A curative_required exception cannot be WAIVED" }
  - { id: ERR_NO_RESOLVED_CURATIVE, http: 409, condition: "Exception CLEARED or Claim PAID requires a RESOLVED CurativeAction on that subject" }
  - { id: ERR_ORDER_NOT_DISBURSABLE, http: 409, condition: "Disbursement APPROVE requires Order in CLEAR_TO_CLOSE/CLOSED (CLAIM_PAYOUT requires CLOSED)" }
  - { id: ERR_INSUFFICIENT_ESCROW, http: 409, condition: "Disbursement WIRE amount exceeds escrow_balance_cents" }
  - { id: ERR_WIRE_WINDOW_OVERLAP, http: 409, condition: "Disbursement wire window overlaps another WIRED disbursement window on the order" }
  - { id: ERR_ESCROW_WOULD_GO_NEGATIVE, http: 409, condition: "Deposit reversal would drive escrow_balance_cents below 0" }
  - { id: ERR_ESCROW_NOT_ZERO, http: 409, condition: "Order CLOSE/CANCEL requires escrow_balance_cents == 0" }

# =============================================================================
# Table 7: RBAC Matrix  (§1.7)
# =============================================================================
roles:
  - name: Agency
    description: "Title agency operator. Owns orders it opens and may act only on its own orders. Initiates escrow deposits and disbursement requests on its orders."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /title/orders — open order (agency_id must equal X-User-ID)"
      - "POST /title/orders/{id}/transitions — CANCEL its own order"
    shared_operations:
      - "POST /title/orders/{id}/deposits — record escrow deposit (own order)"
      - "GET reads on its own orders, deposits, disbursements, commitments, policies, claims, remittances"

  - name: TitleOfficer
    description: "Title production. Runs search/exam, maintains the title plant, issues/re-issues commitments, raises and clears Schedule B exceptions, drives curative, and advances order workflow through CLEAR_TO_CLOSE."
    identity: "opaque"
    exclusive_operations:
      - "POST /title/plant-records — add chain-of-title instrument"
      - "POST /title/orders/{id}/title-searches — order search"
      - "POST /title/title-searches/{id}/transitions — exam workflow"
      - "POST /title/orders/{id}/commitments — issue/re-issue commitment"
      - "POST /title/commitments/{id}/transitions — commitment workflow"
      - "POST /title/commitments/{id}/exceptions — raise exception"
      - "POST /title/exceptions/{id}/transitions — exception workflow"
    shared_operations:
      - "POST /title/orders/{id}/transitions — IN_TITLE/COMMITTED/CLEAR_TO_CLOSE/CLOSED"
      - "POST /title/orders/{id}/curative-actions and /title/curative-actions/{id}/transitions — curative"
      - "POST /title/_clock/set_current_utc"

  - name: Underwriter
    description: "Underwriting & escrow disbursement. Registers agencies, issues owner/lender policies and endorsements, posts/reverses deposits, approves and wires disbursements, manages premium remittance and claims/curative."
    identity: "opaque"
    exclusive_operations:
      - "POST /title/agencies — register agency"
      - "POST /title/orders/{id}/policies and /title/policies/{id}/transitions — policy issuance/void"
      - "POST /title/policies/{id}/endorsements and /title/endorsements/{id}/transitions — endorsements"
      - "POST /title/deposits/{id}/transitions — post/reverse deposit"
      - "POST /title/orders/{id}/disbursements and /title/disbursements/{id}/transitions — wire"
      - "POST /title/remittances/{id}/transitions — remit"
      - "POST /title/policies/{id}/claims and /title/claims/{id}/transitions — claims"
    shared_operations:
      - "POST /title/orders/{id}/deposits — record escrow deposit"
      - "POST /title/orders/{id}/curative-actions and /title/curative-actions/{id}/transitions — curative"
      - "POST /title/_clock/set_current_utc"
