# =============================================================================
# PRD Benchmark Scaffold — task_3232
# Licensed Merchandise Hot Market Production & Event Fulfillment
# =============================================================================
scenario: |
  Licensed Merchandise Hot Market Production & Event Fulfillment (Fanatics): league, team
  and player licensing rights with royalty structures and approval workflows for designs,
  hot market production where championship and milestone merchandise is manufactured within
  hours of an event outcome, pre-produced inventory for both possible outcomes with
  destruction or donation of the losing side's goods, on-demand printing and embroidery
  capacity placed near demand with rush shipping commitments, venue retail and event pop-up
  operations synchronized with the same inventory pool, athlete transaction events such as
  trades and signings triggering rapid assortment changes, counterfeit enforcement around
  venues and online, returns and demand collapse after the event window.

domain_name: licensed-merchandise-hot-market
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  entity_count: 11
  state_machine_count: 7
  calculation_count: 7
  validation_count: 32
  endpoint_count: 39
  error_code_count: 30
  role_count: 8
  concurrency_rule_count: 2
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: Licensor
    parent: null
    common_fields: true
    role: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Rights holder display name"
      - name: league_code
        type: string
        source: input
        description: "League identifier, e.g. NBL, NBLM, NBLW"
      - name: royalty_rate_pct
        type: number
        source: input
        description: "Contractual per-unit royalty rate, expressed as a decimal fraction"
        constraints: "0 <= royalty_rate_pct <= 1"
      - name: minimum_guarantee_cents
        type: integer
        source: input
        description: "Contractual minimum royalty guarantee; penalty-free early settlement may not recover below it"
        constraints: ">= 0"
      - name: accrued_royalty_cents
        type: integer
        source: computed
        description: "Running sum of current-version RUSH_or_STANDARD RoyaltyAccrual.accrued_cents plus STANDARD/shortfall? RoyaltyAccrual.accrued_cents; excludes superseded versions and retired-original-version accruals"
        default: 0
      - name: guarantee_recovery_block_cents
        type: integer
        source: computed
        description: "Sum of guarantee_shortfall_cents over this licensor's APPROVED early settlements; floor used when reversing a settlement"
        default: 0
      - name: accrued_unsettled_cents
        type: integer
        source: computed
        description: "max(0, accrued_royalty_cents - guarantee_recovery_block_cents)"
        default: 0
      - name: currency
        type: string
        source: input
        description: "ISO currency code"
        default: "USD"

  - name: Design
    parent: null
    common_fields: true
    role: resource
    fields:
      - name: licensor_id
        type: string
        source: input
        description: "FK -> Licensor.id; rights holder whose marks appear on this design"
      - name: team_code
        type: string
        source: input
        description: "Team whose marks appear on this design"
      - name: player_code
        type: string
        source: input
        description: "Player code, or null for team-only marks"
        default: null
      - name: garment_sku
        type: enum
        source: input
        description: "Garment this design prints on: JERSEY | TRACTOR | DUFFEL | CAP | MINI | PENNANT"
      - name: design_name
        type: string
        source: input
        description: "Human-readable design name"
      - name: approval_state
        type: enum
        source: system
        description: "PENDING_LICENSOR_APPROVAL | APPROVED | APPROVAL_REJECTED; initial PENDING_LICENSOR_APPROVAL"
        default: PENDING_LICENSOR_APPROVAL
      - name: approved_version
        type: integer
        source: computed
        description: "Design.version captured at the moment the licensor approves; pinned as ProductionOrder.retired_design_version; null while unapproved"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Reason recorded when the licensor rejects; null otherwise"
        default: null

  - name: ProductionOrder
    parent: null
    common_fields: true
    role: resource
    fields:
      - name: licensor_id
        type: string
        source: input
        description: "FK -> Licensor.id; rights holder governing this production run"
      - name: design_id
        type: string
        source: input
        description: "FK -> Design.id; pinned at creation, immutable"
      - name: team_code
        type: string
        source: input
        description: "Team whose marks this run prints"
      - name: trigger_type
        type: enum
        source: input
        description: "CHAMPIONSHIP_WIN | MILESTONE | ATHLETE_TRANSACTION | STANDARD"
      - name: event_outcome
        type: enum
        source: input
        description: "WIN_FAVORED_TEAM | WIN_UNDERDOG_TEAM | NO_OUTCOME; guides hot-market capacity commitment"
        default: NO_OUTCOME
      - name: status
        type: enum
        source: system
        description: "PARALLEL_HOLD | COMMITTED | PRINTING | RETIRED_DESTROYED | RETIRED_DONATED; initial PARALLEL_HOLD"
        default: PARALLEL_HOLD
      - name: expected_demand_qty
        type: integer
        source: input
        description: "Projected sellable quantity for the outcome this run is printed for"
        constraints: "> 0"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Planned landed unit cost of the base garment"
        constraints: "> 0"
      - name: layer_ids
        type: array
        source: computed
        description: "Ids of the print layers currently attached to this run, in submission order"
        default: []
      - name: base_units_printed
        type: integer
        source: computed
        description: "Sum of committed_qty over this run's PrintLayer rows whose print_type == BASE"
        default: 0
      - name: accessory_units_printed
        type: integer
        source: computed
        description: "Sum of committed_qty over this run's PrintLayer rows whose print_type is EMBROIDER, HEAT_PRESS or PENNANT"
        default: 0
      - name: hold_allocation_cents
        type: integer
        source: computed
        description: "parallel_hold_inventory_cents for this run, shared by the two outcomes of the same event"
        default: 0
      - name: committed_inventory_cents
        type: integer
        source: computed
        description: "capitalized_inventory_cents for this run after the outcome commits"
        default: 0
      - name: pennants_included
        type: boolean
        source: input
        description: "Whether PENNANT layers are counted as sellable units in hot-market commitment scoring"
        default: true
      - name: retired_design_version
        type: integer
        source: computed
        description: "Value of Design.approved_version pinned when this run was created; compared against Design.approved_version on every layering request"
        default: null
      - name: observed_current_design_version
        type: integer
        source: computed
        description: "Latest observed value of the referenced Design's version, refreshed by every layering request"
        default: null
      - name: win_probability_pct
        type: number
        source: input
        description: "Probability this run's outcome occurs; the hot-market calculation floors it at PROBABILITY_FLOOR"
        default: 0.5
        constraints: "0 <= win_probability_pct <= 1"
      - name: outcome_at
        type: datetime
        source: input
        description: "Instant the deciding event is scheduled to resolve; the hot-market calculation derives its hour band from the logical clock to this instant"
        default: null
      - name: capacity_commitment_units
        type: integer
        source: computed
        description: "Units hot_market_capacity_commitment commits for this run; written when the run is created"
        default: 0
      - name: rush_delivery_points
        type: integer
        source: computed
        description: "Weighted rush-or-standard delivery points computed by rush_delivery_commitment over this run's HELD reservations"
        default: 0
      - name: write_down_inventory_cents
        type: computed
        description: "Inventory write-down booked on this run by demand_collapse_write_down once it is retired"
        source: computed
        default: 0
      - name: destroyed_units
        type: integer
        source: computed
        description: "Units of this run destroyed after the event window, summed over the run's DISTRESSED orders, its retired DESTROY-mode orders and any retire request that named a DESTROY mode"
        default: 0
      - name: donated_units
        type: integer
        source: computed
        description: "Units of this run donated to a nonprofit recipient rather than destroyed"
        default: 0
      - name: committed_at
        type: datetime
        source: system
        description: "Timestamp of the PARALLEL_HOLD -> COMMITTED transition; null while the run is still in PARALLEL_HOLD"
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: "Timestamp of the COMMITTED -> RETIRED_* transition; null otherwise"
        default: null
      - name: retire_reason
        type: enum
        source: input
        description: "OUTCOME_COMMITTED | LOSING_OUTCOME | ASSORTMENT_CHANGED | DEMAND_COLLAPSE; null while not retired"
        default: null

  - name: PrintLayer
    parent: null
    common_fields: true
