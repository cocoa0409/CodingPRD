            - "Driver.${drv_id}.reimbursement_accrued_cents == 0, because provisional lines are not yet ACCRUED"
            - "Dispatch.${dsp_id}.status == EN_ROUTE (the cascade did not close the route)"

      - name: mvr_failure_four_hop_cascade_recalls_route_and_restores_backlog
        grounds:
          - state_machines.Driver.to_DISQUALIFIED
          - state_machines.Dispatch.EN_ROUTE_to_RECALLED
          - state_machines.Order.fulfillment_status.ASSIGNED_to_READY
          - entities.ReimbursementLine.fields.status
          - entities.Store.fields.unassigned_order_count
          - endpoints.POST_driver_mvr_checks
        distinguishing_aspect: |
          A single MvrCheck with result FAILED, recorded on an already QUALIFIED
          driver who is mid-route, must ripple four hops UPWARD through entities
          the request never names: Driver -> Dispatch -> DispatchStop plus Order
          plus ReimbursementLine -> Store. The already DELIVERED stop and the
          cash it collected must survive untouched while only the PENDING stop is
          released, and the provisional line of the delivered stop must become
