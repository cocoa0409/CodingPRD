              captures: { s_ada_id: $.data.id }
            - call: "POST /residence-life/ra-applications"
              payload: { applicant_student_id: "${s_ada_id}", term_code: "2026FA", essay_ref: "E-ADA" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { app_id: $.data.id }
            - call: "POST /residence-life/ra-applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_ada_id}"
            - call: "POST /residence-life/ra-applications/${app_id}/review"
              payload: { interview_score: 88 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/decision"
              payload: { decision: "OFFER" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ra-applications/${app_id}/response"
              payload: { response: "ACCEPT" }
              as: Student
              as_user_id: "${s_ada_id}"
              captures: { ra_id: $.data.created_ra_id }
            - call: "POST /residence-life/ras/${ra_id}/floor-assignment"
              payload: { floor_id: "${f_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/ras/${ra_id}/employment"
              payload: { action: "ACTIVATE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/students"
              payload: { full_name: "Dee Sun", email: "dee@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_dee_id: $.data.id }
            - call: "POST /residence-life/students/${s_dee_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/room-inspections"
              payload: { room_id: "${r201_id}", inspection_type: "HEALTH_SAFETY", scheduled_for: "2026-08-10T09:00:00Z", expected_room_version: "${r201_v_old}" }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { err: $.data.error_id }
            - call: "GET /residence-life/rooms/${r201_id}"
              payload: {}
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_v_now: $.data.version }
            - call: "POST /residence-life/room-inspections"
              payload: { room_id: "${r201_id}", inspection_type: "HEALTH_SAFETY", scheduled_for: "2026-08-10T09:00:00Z", expected_room_version: "${r201_v_now}" }
              as: ResidentAssistant
              as_user_id: "${ra_id}"
              captures: { insp_id: $.data.id }
          assert:
            - "The first inspection create returns HTTP 412 with data.error_id == ERR_STALE_ROOM_VERSION"
            - "GET /residence-life/room-inspections?room_id=${r201_id} returns total_count == 0 immediately after that refusal"
            - "The second inspection create returns HTTP 201 and RoomInspection.${insp_id}.status == SCHEDULED"
            - "Room.${r201_id}.version is greater after the successful create than the value read into r201_v_now"

      - name: stale_expected_student_version_on_case_create_returns_stale_student_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[room-change-create-stale-student]
          - errors[ERR_STALE_STUDENT_VERSION]
          - validations[priority=25]
        distinguishing_aspect: "Opening the first case advanced Student.version, so a second create still carrying the pre-case value returns HTTP 412 ERR_STALE_STUDENT_VERSION and the earlier case is NOT superseded."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with rooms 201 and 202; Dee Sun occupies room 202."
            - "The client captured Student.version from the placement response, then opened one SELF_REQUEST case which advanced that version."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "202", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r202_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Dee Sun", email: "dee@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_dee_id: $.data.id }
            - call: "POST /residence-life/students/${s_dee_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r202_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { dee_v_old: $.data.version }
            - call: "POST /residence-life/room-change-cases"
              payload: { student_id: "${s_dee_id}", origin: "SELF_REQUEST", from_room_id: "${r202_id}", expected_student_version: "${dee_v_old}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { rcc1_id: $.data.id }
            - call: "POST /residence-life/room-change-cases/${rcc1_id}/placement-request"
              payload: { to_room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/room-change-cases"
              payload: { student_id: "${s_dee_id}", origin: "SELF_REQUEST", from_room_id: "${r202_id}", expected_student_version: "${dee_v_old}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412 with data.error_id == ERR_STALE_STUDENT_VERSION"
            - "GET /residence-life/room-change-cases?student_id=${s_dee_id} returns total_count == 1"
            - "RoomChangeCase.${rcc1_id}.placement_status == REQUESTED - the refused create superseded nothing"
            - "RoomChangeCase.${rcc1_id}.to_room_id == ${r201_id}"

      - name: entity_version_increments_by_one_on_each_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Building.fields.posture
          - state_machines.Building.OPEN_to_RESTRICTED
          - state_machines.Building.RESTRICTED_to_OPEN
        distinguishing_aspect: "Building.version starts at 1 on create and advances to 2 then 3 across two posture mutations, one increment per successful write and none for reads."
        test_recipe:
          setup:
            - "A freshly created hall in posture OPEN with version 1."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id, v_create: $.data.version }
          trigger:
            - call: "GET /residence-life/buildings/${b_id}"
              payload: {}
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/buildings/${b_id}/posture"
              payload: { target_posture: "RESTRICTED", reason: "elevator outage" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "POST /residence-life/buildings/${b_id}/posture"
              payload: { target_posture: "OPEN" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "v_create == 1"
            - "The GET leaves Building.${b_id}.version == 1"
            - "After the RESTRICTED call Building.${b_id}.version == 2"
            - "After the OPEN call Building.${b_id}.version == 3"
            - "Building.${b_id}.posture == OPEN and closure_reason == null"

      - name: duty_shift_list_combines_status_filter_with_pagination
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /residence-life/duty-shifts]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three OPEN shifts and one VOID shift on the floor, status=OPEN with limit 2 returns 2 rows and total_count 3 (the VOID row is excluded from the count, not merely from the page)."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 holds four shifts; one of them has been VOIDed while OPEN, leaving three OPEN."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/duty-shifts"
              payload: { floor_id: "${f_id}", shift_type: "WEEKDAY", start_at: "2026-09-01T18:00:00Z", end_at: "2026-09-02T02:00:00Z" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s1_id: $.data.id }
            - call: "POST /residence-life/duty-shifts"
              payload: { floor_id: "${f_id}", shift_type: "WEEKDAY", start_at: "2026-09-03T18:00:00Z", end_at: "2026-09-04T02:00:00Z" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s2_id: $.data.id }
            - call: "POST /residence-life/duty-shifts"
              payload: { floor_id: "${f_id}", shift_type: "WEEKEND", start_at: "2026-09-05T18:00:00Z", end_at: "2026-09-06T02:00:00Z" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s3_id: $.data.id }
            - call: "POST /residence-life/duty-shifts"
              payload: { floor_id: "${f_id}", shift_type: "WEEKEND", start_at: "2026-09-07T18:00:00Z", end_at: "2026-09-08T02:00:00Z" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s4_id: $.data.id }
            - call: "POST /residence-life/duty-shifts/${s4_id}/outcome"
              payload: { action: "VOID" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "GET /residence-life/duty-shifts"
              payload: { floor_id: "${f_id}", status: "OPEN", limit: 2, offset: 0 }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "GET /residence-life/duty-shifts"
              payload: { floor_id: "${f_id}", status: "OPEN", limit: 2, offset: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "First call: data length 2, total_count == 3, has_more == true"
            - "Second call: data length 1, total_count == 3, has_more == false"
            - "DutyShift.${s4_id} appears in neither page"
            - "Floor.${f_id}.uncovered_shift_count == 3 and Floor.${f_id}.coverage_status == CRITICAL"

  - section: consistency_model
    instances:

      - name: closure_cascade_is_visible_without_any_re_read_delay
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Building.OPEN_to_EMERGENCY_CLOSED
          - state_machines.Room.OCCUPIED_to_OFFLINE
        distinguishing_aspect: "consistency_model is immediate: the very next read after the posture call already shows Room 201 OFFLINE and the Floor frozen, with no retry, polling or second mutation required."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with room 201 occupied by Dee Sun and posture OPEN."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Dee Sun", email: "dee@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_dee_id: $.data.id }
            - call: "POST /residence-life/students/${s_dee_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/buildings/${b_id}/posture"
              payload: { target_posture: "EMERGENCY_CLOSED", reason: "structural inspection" }
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "GET /residence-life/rooms/${r201_id}"
              payload: {}
              as: ResidenceDirector
              as_user_id: "rd-1"
            - call: "GET /residence-life/floors/${f_id}"
              payload: {}
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "The posture response itself returns Building.posture == EMERGENCY_CLOSED"
            - "The immediately following room read returns Room.${r201_id}.status == OFFLINE and pre_closure_status == OCCUPIED"
            - "The immediately following floor read returns Floor.${f_id}.programming_frozen == true"
            - "Student.${s_dee_id}.current_room_id == ${r201_id} - closure does not evict residents"
            - "Building.${b_id}.assigned_bed_count == 1"

  - section: errors
    instances:
      # ---- corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml ----

      - name: error_training_credits_insufficient_on_certify
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRAINING_CREDITS_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / certification_credit_threshold_eleven_fails_twelve_passes
          rationale: "Asserted as the 11-credit failure path of the named §1.8 instance, together with the 12-credit success."

      - name: error_duty_coverage_conflict_on_assignment
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUTY_COVERAGE_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / duty_shift_half_open_interval_plus_eight_hour_rest_buffer
          rationale: "Asserted as the gap-0 failure path of the named §1.8 instance, together with the gap-480 success."

      - name: error_break_housing_capacity_on_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_BREAK_HOUSING_CAPACITY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / break_housing_closed_interval_aggregate_bed_capacity
          rationale: "Asserted as the third-collider failure path of the named §1.8 instance."

      - name: error_revision_limit_reached_on_application_decision
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVISION_LIMIT_REACHED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / ra_application_revision_cycle_capped_at_two_rounds
          rationale: "Asserted as the third REQUEST_REVISION failure path of the named §1.8 instance."

      - name: error_program_not_held_on_reimbursement
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROGRAM_NOT_HELD]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / reimbursement_state_check_outranks_floor_budget_check
          rationale: "Asserted as the winning error of the state-versus-fiscal priority pair in the named §1.8 instance."

      - name: error_floor_budget_exceeded_on_reimbursement
        claim_type: violation_to_error
        grounds: ["errors[ERR_FLOOR_BUDGET_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / reimbursement_state_check_outranks_floor_budget_check
          rationale: "Asserted as the second (post-HOLD) failure path of the named §1.8 instance."

      - name: error_ra_not_certified_on_shift_assignment
        claim_type: violation_to_error
        grounds: ["errors[ERR_RA_NOT_CERTIFIED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / duty_assignment_safety_check_outranks_temporal_conflict_check
          rationale: "Asserted as the winning error of the safety-versus-temporal priority pair in the named §1.8 instance."

      - name: error_ra_not_active_on_shift_assignment
        claim_type: violation_to_error
        grounds: ["errors[ERR_RA_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / duty_shift_assignment_reads_both_ra_state_dimensions
          rationale: "Asserted as the SUSPENDED-but-CERTIFIED failure path of the named §1.8 instance."

      - name: error_building_not_open_on_placement_decision
        claim_type: violation_to_error
        grounds: ["errors[ERR_BUILDING_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / placement_approval_gated_by_target_building_posture
          rationale: "Asserted as the RESTRICTED-posture failure path of the named §1.8 instance."

      - name: error_student_on_probation_blocks_break_housing_approval
        claim_type: violation_to_error
        grounds: ["errors[ERR_STUDENT_ON_PROBATION]"]
        excluded_because:
          difficulty_instance: transitive_cascade / conduct_sanction_probation_then_placement_denied_then_break_revoked
          rationale: "The PROBATION standing and the resulting loss of break_housing_eligible are asserted end to end in the named §1.8 instance."
