        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_QUANTITY_INVALID]"]
        distinguishing_aspect: "A mortality report whose cumulative dead+condemned exceeds placed_head is rejected even though each individual report is non-negative."
        test_recipe:
          setup: ["flock PLACED with 1000 head"]
          setup_api_calls:
