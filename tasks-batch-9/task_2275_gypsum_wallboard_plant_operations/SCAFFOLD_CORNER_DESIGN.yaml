      - name: lot_status_check_precedes_the_tonnage_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 8, ERR_LOT_NOT_APPROVED]
          - validations[priority 20, ERR_LOT_TONS_INSUFFICIENT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lot_not_approved_precedes_lot_tons_insufficient
          rationale: "That instance makes both conditions true on one feed and shows the priority-8 state error wins over the priority-20 quantity error."

      - name: calciner_rate_is_validated_over_aggregated_sub_intervals
        claim_type: aggregate_validation
        grounds:
          - validations[priority 18, ERR_CALCINER_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / calciner_aggregate_rate_over_overlapping_subinterval
          rationale: "That instance builds three partially overlapping feed windows and shows the check is per sub-interval sum, not per batch."

      - name: fire_rated_stucco_check_precedes_the_line_window_check
        claim_type: cascading_validation
        grounds:
          - validations[priority 11, ERR_FIRE_RATED_STUCCO_NONCONFORMING]
          - validations[priority 14, ERR_LINE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / fire_rated_stucco_precedes_line_window_conflict
          rationale: "That instance violates a quality gate and a scheduling gate in one schedule call and pins the order between the two categories."

      - name: restricted_posture_check_precedes_the_stucco_balance_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 10, ERR_POSTURE_RESTRICTED_FIRE_RATED]
          - validations[priority 20, ERR_STUCCO_INSUFFICIENT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / posture_restricted_precedes_stucco_insufficient
          rationale: "That instance schedules a fire-rated run on a RESTRICTED plant with an impossible reservation and shows the posture error wins."

