scenario: "917. Palliative Telehealth & Advance-Care Planning: referral & goals-of-care, symptom assessment & plan, advance-directive & POLST completion, interdisciplinary & family meeting, medication & DME, hospice-transition, after-hours support, documentation"
domain_name: "palliative-telehealth-advance-care"
api_prefix: "/palliative"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: graph
  # 14 entities; Patient is the hub but children cross-reference each other
  # (CodeStatusOrder -> AdvanceCareDocument, SymptomAssessment -> CarePlan,
  # OnCallEscalation -> SymptomAssessment, AcpBillingClaim -> CareConference,
  # CareConference -> SurrogateDesignation) and AdvanceCareDocument is
  # self-referential via supersedes_document_id.

  state_machine_shape: parallel
  # 13 machines total; SymptomAssessment carries two independent axes
  # (triage_status x escalation_status); Referral, CodeStatusOrder,
  # AdvanceCareDocument, CareConference, MedicationOrder, DmeOrder,
  # HospiceElection, OnCallEscalation, AcpBillingClaim, CarePlan and Patient
  # are cyclic, branching or capped-self-loop.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Declared constants. Every ALL_CAPS identifier used anywhere in this scaffold
# resolves to exactly one row below, or is an enum member / error code / state
# name. There are no undeclared constants.
# ---------------------------------------------------------------------------
constants:
  # --- clock / formatting ---
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  DATETIME_RENDER_FORMAT: "YYYY-MM-DDTHH:MM:SS.mmmZ"

  # --- referral triage ---
  MAX_REREFERRALS: 2
  REFERRAL_PROGNOSIS_MAX_MONTHS: 12
  REFERRAL_ACCEPT_MIN_SCORE: 60
  TRIAGE_SCORE_CAP: 100
  TRIAGE_SOURCE_WEIGHT_HOSPITAL_DISCHARGE: 30
  TRIAGE_SOURCE_WEIGHT_PAYER: 20
  TRIAGE_CRITERION_POINTS: 12
  TRIAGE_PROGNOSIS_POINTS_PER_MONTH: 4
  TRIAGE_CLINICIAN_CRITERION_MULTIPLIER: 2
  TRIAGE_CLINICIAN_PROGNOSIS_POINTS_PER_MONTH: 2

  # --- symptom scoring ---
  SYMPTOM_ITEM_MIN: 0
  SYMPTOM_ITEM_MAX: 10
  SELF_REPORT_MULTIPLIER: 2
  PROXY_SUBJECTIVE_WEIGHT: 0.6
  PROXY_REPORT_MULTIPLIER: 2.5
  DISTRESS_SCORE_CAP: 100
  DISTRESS_TIER_SEVERE_MIN: 70
  DISTRESS_TIER_MODERATE_MIN: 40
  DISTRESS_TIER_MILD_MIN: 15
  SLA_MINUTES_SEVERE: 30
  SLA_MINUTES_MODERATE: 240
  SLA_MINUTES_MILD: 1440
  SLA_MINUTES_MINIMAL: 4320

  # --- opioid / MME ---
  MME_FACTOR_MORPHINE_PO: 1.0
  MME_FACTOR_OXYCODONE_PO: 1.5
  MME_FACTOR_HYDROMORPHONE_PO: 5.0
  MME_FACTOR_FENTANYL_TD: 2.4
  OPIOID_NAIVE_SAFETY_FACTOR: 0.75
  MME_REVIEW_THRESHOLD: 90
  BREAKTHROUGH_FRACTION: 0.15
  EARLY_REFILL_WINDOW_DAYS: 2

  # --- conferences ---
  CONFERENCE_BUFFER_MINUTES: 15
  ATTESTATION_WINDOW_HOURS: 72
  IDT_CADENCE_MAX_DAYS: 15
  IDT_REQUIRED_DISCIPLINES: ["PHYSICIAN", "NURSE", "SOCIAL_WORKER", "CHAPLAIN"]

  # --- advance care documents ---
  WITNESS_COUNT_REQUIRED_TWO_WITNESS: 2
  NOTARY_COUNT_REQUIRED_NOTARY: 1
  POLST_PHYSICIAN_SIGNATURE_REQUIRED: 1
  POLST_PATIENT_OR_SURROGATE_SIGNATURE_REQUIRED: 1
  DIRECTIVE_REATTESTATION_DAYS: 365

  # --- code status ladder ---
  CODE_STATUS_RANK_FULL_CODE: 1
  CODE_STATUS_RANK_DNR: 2
  CODE_STATUS_RANK_DNR_DNI: 3
  CODE_STATUS_RANK_COMFORT_MEASURES_ONLY: 4
  MAX_LADDER_STEP_PER_ORDER: 1
  CODE_STATUS_ATTESTATIONS_REQUIRED: 2

  # --- surrogate hierarchy ---
  SURROGATE_RANK_HEALTHCARE_AGENT: 1
  SURROGATE_RANK_SPOUSE: 2
  SURROGATE_RANK_ADULT_CHILD: 3
  SURROGATE_RANK_PARENT: 4
  SURROGATE_RANK_SIBLING: 5

  # --- hospice benefit periods ---
  BENEFIT_PERIOD_1_DAYS: 90
  BENEFIT_PERIOD_2_DAYS: 90
  BENEFIT_PERIOD_SUBSEQUENT_DAYS: 60
  HOSPICE_CERTIFIERS_REQUIRED: 2
  FACE_TO_FACE_MIN_PERIOD_NUMBER: 3
  FACE_TO_FACE_WINDOW_DAYS: 30

  # --- after-hours escalation ---
  ESCALATION_TIER_MIN: 1
  ESCALATION_TIER_MAX: 3
  ESCALATION_ACK_SLA_MINUTES_TIER_1: 15
  ESCALATION_ACK_SLA_MINUTES_TIER_2: 30
  ESCALATION_ACK_SLA_MINUTES_TIER_3: 60

  # --- ACP time-based billing ---
  ACP_FIRST_UNIT_MIN_MINUTES: 16
  ACP_ADDITIONAL_UNIT_MINUTES: 30
  ACP_MAX_UNITS: 4
  ACP_BASE_RATE_CENTS: 8600
  ACP_ADDITIONAL_UNIT_RATE_CENTS: 7500
  TELEHEALTH_RATE_FACTOR: 0.85
  IN_PERSON_RATE_FACTOR: 1.0
  TELEHEALTH_MODIFIER_CODE: "95"
  ACP_ANNUAL_CAP_CENTS: 40000
  COINSURANCE_TIER_LOW_MAX_CENTS: 10000
  COINSURANCE_PCT_LOW: 0.1
  COINSURANCE_PCT_HIGH: 0.2

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; unique across all Patient rows"
        constraints: "non-empty; unique"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name"
      - name: date_of_birth
        type: string
        source: input
        description: "Date of birth, YYYY-MM-DD"
      - name: jurisdiction_code
        type: enum
        source: input
        description: "Execution law that governs this patient's advance care documents"
        constraints: "one of JUR_TWO_WITNESS, JUR_NOTARY"
      - name: attending_clinician_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the attending clinician of record; disqualified from witnessing this patient's documents"
      - name: opioid_status
        type: enum
        source: input
        default: OPIOID_NAIVE
        description: "Discriminator selecting the MME variant used for this patient's medication orders"
        constraints: "one of OPIOID_NAIVE, OPIOID_TOLERANT"
      - name: capacity_status
        type: enum
        source: system
        default: HAS_CAPACITY
        description: "Decision-making capacity; flipped only by POST /patients/{id}/capacity-determinations"
        constraints: "one of HAS_CAPACITY, LACKS_CAPACITY"
      - name: program_status
        type: enum
        source: system
        default: REFERRED
        description: "Program lifecycle state of the patient"
        constraints: "one of REFERRED, ACTIVE, HOSPICE_ELECTED, DECEASED"
      - name: code_status
        type: enum
        source: computed
        default: FULL_CODE
        description: "Current effective code status; rewritten by the EFFECTIVE CodeStatusOrder and by supersession cascades"
        constraints: "one of FULL_CODE, DNR, DNR_DNI, COMFORT_MEASURES_ONLY"
      - name: code_status_rank
        type: integer
        source: computed
        default: 1
        description: "Ladder rank of code_status; 1=FULL_CODE, 2=DNR, 3=DNR_DNI, 4=COMFORT_MEASURES_ONLY"
      - name: records_frozen
        type: boolean
        source: computed
        default: false
        description: "Global write-gate flag; set true when program_status becomes DECEASED"
      - name: deceased_at
        type: datetime
        source: system
        description: "Logical-clock instant recorded by POST /patients/{id}/death-events; null before death"
      - name: active_daily_mme
        type: number
        source: computed
        default: 0
        description: "Conserved ledger equal to the sum of mme_daily over this patient's MedicationOrder rows with status ACTIVE"
      - name: acp_minutes_claimed
        type: integer
        source: computed
        default: 0
        description: "Conserved ledger equal to the sum of documented_minutes over this patient's AcpBillingClaim rows with status in {SUBMITTED, PAID}"
      - name: acp_paid_cents_ytd
        type: integer
        source: computed
        default: 0
        description: "Sum of net_payable_cents over this patient's AcpBillingClaim rows with status PAID; feeds the annual cap"
      - name: open_symptom_count
        type: integer
        source: computed
        default: 0
        description: "Count of this patient's SymptomAssessment rows with triage_status in {OPEN, ACKNOWLEDGED}"

  - name: Referral
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient being referred"
      - name: source
        type: enum
        source: input
        description: "Referral source; selects the triage scoring variant"
        constraints: "one of HOSPITAL_DISCHARGE, ONCOLOGY, PRIMARY_CARE, SELF, PAYER"
      - name: prognosis_months
        type: integer
        source: input
        description: "Estimated prognosis in months"
        constraints: "integer 1..24 inclusive"
      - name: serious_illness_criteria_count
        type: integer
        source: input
        description: "Number of serious-illness eligibility criteria documented"
        constraints: "integer 0..5 inclusive"
      - name: triage_variant
        type: enum
        source: computed
        description: "PAYER_SOURCED when source in {HOSPITAL_DISCHARGE, PAYER}; CLINICIAN_SOURCED otherwise"
        constraints: "one of PAYER_SOURCED, CLINICIAN_SOURCED"
      - name: triage_score
        type: integer
        source: computed
        description: "Referral triage score, 0..100, produced by calculations.referral_triage_score"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "Referral lifecycle state"
        constraints: "one of RECEIVED, ACCEPTED, DECLINED"
      - name: decline_reason_code
        type: enum
        source: system
        description: "Reason supplied on a DECLINE decision; null otherwise"
        constraints: "one of NOT_SERIOUS_ILLNESS, PROGNOSIS_OUT_OF_RANGE, OUT_OF_SERVICE_AREA, DUPLICATE_REFERRAL, PATIENT_DECLINED"
      - name: re_referral_count
        type: integer
        source: system
        default: 0
        description: "Number of times this referral has been returned from DECLINED to RECEIVED"

  - name: SurrogateDesignation
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this surrogate may speak for"
      - name: person_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the surrogate person; disqualified from witnessing this patient's documents"
      - name: person_name
        type: string
        source: input
        description: "Surrogate legal name"
      - name: relationship
        type: enum
        source: input
        description: "Relationship to the patient; determines hierarchy_rank"
        constraints: "one of HEALTHCARE_AGENT, SPOUSE, ADULT_CHILD, PARENT, SIBLING"
      - name: hierarchy_rank
        type: integer
        source: computed
        description: "1 for HEALTHCARE_AGENT, 2 SPOUSE, 3 ADULT_CHILD, 4 PARENT, 5 SIBLING; lower rank wins the authority selector"
      - name: is_beneficiary
        type: boolean
        source: input
        default: false
        description: "True when this person is a beneficiary of the patient's estate; disqualified from witnessing"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Designation lifecycle state"
        constraints: "one of PROPOSED, ACTIVE, REVOKED"

  - name: AdvanceCareDocument
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the document belongs to"
      - name: document_type
        type: enum
        source: input
        description: "Kind of advance care document; POLST carries extra signature requirements"
        constraints: "one of LIVING_WILL, HEALTHCARE_PROXY, POLST"
      - name: stated_code_status
        type: enum
        source: input
        description: "Code status the document states; copied into any CodeStatusOrder that cites it"
        constraints: "one of FULL_CODE, DNR, DNR_DNI, COMFORT_MEASURES_ONLY"
      - name: supersedes_document_id
        type: string
        source: input
        description: "FK -> AdvanceCareDocument.id; the prior executed document this one replaces; null for a first document"
      - name: witness_signature_count
        type: integer
        source: computed
        default: 0
        description: "Count of signature_log entries with signature_type WITNESS"
      - name: notary_signature_count
        type: integer
        source: computed
        default: 0
        description: "Count of signature_log entries with signature_type NOTARY"
      - name: physician_signature_count
        type: integer
        source: computed
        default: 0
        description: "Count of signature_log entries with signature_type SIGNING_PHYSICIAN"
      - name: patient_or_surrogate_signature_count
        type: integer
        source: computed
        default: 0
        description: "Count of signature_log entries with signature_type PATIENT_OR_SURROGATE"
      - name: signature_log
        type: array
        source: computed
        description: "Append-only list of objects with keys signature_type, signer_user_id, signed_at"
      - name: execution_ready
        type: boolean
        source: computed
        default: false
        description: "True when calculations.document_execution_requirement is satisfied for this document"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant the document reached EXECUTED; null before execution"
      - name: reattest_due_at
        type: datetime
        source: computed
        description: "executed_at plus DIRECTIVE_REATTESTATION_DAYS days; null before execution"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Document lifecycle state"
        constraints: "one of DRAFT, PENDING_EXECUTION, EXECUTED, SUPERSEDED, REVOKED"

  - name: CodeStatusOrder
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient whose code status this order changes"
      - name: source_document_id
        type: string
        source: input
        description: "FK -> AdvanceCareDocument.id; the EXECUTED document this order transcribes; null for a clinician-only order"
      - name: requested_code_status
        type: enum
        source: input
        description: "Target code status on the ladder"
        constraints: "one of FULL_CODE, DNR, DNR_DNI, COMFORT_MEASURES_ONLY"
      - name: prior_code_status
        type: enum
        source: computed
        description: "Patient.code_status captured at order creation"
        constraints: "one of FULL_CODE, DNR, DNR_DNI, COMFORT_MEASURES_ONLY"
      - name: ladder_direction
        type: enum
        source: computed
        description: "DE_ESCALATION when requested rank > prior rank; RE_ESCALATION when requested rank < prior rank; NO_CHANGE when equal"
        constraints: "one of DE_ESCALATION, RE_ESCALATION, NO_CHANGE"
      - name: surrogate_stated
        type: boolean
        source: input
        default: false
        description: "True when the requested status was stated by a surrogate rather than the patient"
      - name: patient_prior_statement
        type: enum
        source: input
        description: "The patient's own previously recorded preference, when one exists; drives the goals conflict branch"
        constraints: "one of FULL_CODE, DNR, DNR_DNI, COMFORT_MEASURES_ONLY"
      - name: attesting_clinician_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID that supplied the CLINICIAN attestation; null until attested"
      - name: attesting_party_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID that supplied the PATIENT_OR_SURROGATE attestation; null until attested"
      - name: conflict_resolution_note
        type: string
        source: computed
        description: "Text supplied to clear a CONFLICT_HOLD; null when no conflict occurred"
      - name: attestation_count
        type: integer
        source: computed
        default: 0
        description: "Number of distinct attestations accepted on this order"
      - name: effective_at
        type: datetime
        source: system
        description: "Logical-clock instant the order became EFFECTIVE; null otherwise"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Order lifecycle state"
        constraints: "one of DRAFT, ATTESTED, CONFLICT_HOLD, EFFECTIVE, SUPERSEDED"

  - name: CarePlan
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this plan governs"
      - name: plan_title
        type: string
        source: input
        description: "Human-readable plan title"
      - name: problem_list
        type: array
        source: input
        description: "List of problem strings addressed by the plan"
      - name: revision_number
        type: integer
        source: computed
        default: 0
        description: "Incremented by one each time the plan returns from UNDER_REVISION to ACTIVE"
      - name: closed_reason
        type: enum
        source: system
        description: "Reason the plan closed; null while open"
        constraints: "one of PATIENT_DEATH, GOALS_MET, TRANSFERRED"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Plan lifecycle state"
        constraints: "one of DRAFT, ACTIVE, UNDER_REVISION, CLOSED"

  - name: SymptomAssessment
    parent: CarePlan
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient assessed"
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id; the ACTIVE plan the assessment is filed under"
      - name: reporter_type
        type: enum
        source: input
        description: "Discriminator selecting the distress roll-up variant"
        constraints: "one of SELF, PROXY"
      - name: item_pain
        type: integer
        source: input
        description: "Pain item score"
        constraints: "integer 0..10 inclusive"
      - name: item_dyspnea
        type: integer
        source: input
        description: "Dyspnea item score"
        constraints: "integer 0..10 inclusive"
      - name: item_nausea
        type: integer
        source: input
        description: "Nausea item score"
        constraints: "integer 0..10 inclusive"
      - name: item_anxiety
        type: integer
        source: input
        description: "Anxiety item score; down-weighted in the PROXY variant"
        constraints: "integer 0..10 inclusive"
      - name: item_fatigue
        type: integer
        source: input
        description: "Fatigue item score; down-weighted in the PROXY variant"
        constraints: "integer 0..10 inclusive"
      - name: distress_score
        type: integer
        source: computed
        description: "Rolled-up distress score 0..100 from calculations.symptom_distress_score"
      - name: severity_tier
        type: enum
        source: computed
        description: "Tier derived from distress_score; drives the response SLA"
        constraints: "one of MINIMAL, MILD, MODERATE, SEVERE"
      - name: response_due_at
        type: datetime
        source: computed
        description: "created_at plus the tier SLA minutes from calculations.symptom_response_due_at"
      - name: triage_status
        type: enum
        source: system
        default: OPEN
        description: "First independent axis: clinical triage handling of the assessment"
        constraints: "one of OPEN, ACKNOWLEDGED, RESOLVED"
      - name: escalation_status
        type: enum
        source: system
        default: NONE
        description: "Second independent axis: after-hours escalation handling of the same assessment"
        constraints: "one of NONE, ESCALATED, DISPOSITIONED"
      - name: resolution_reason
        type: enum
        source: system
        description: "Why the assessment reached triage_status RESOLVED; null while unresolved"
        constraints: "one of SYMPTOM_CONTROLLED, PLAN_CLOSED, ESCALATION_DISPOSITIONED"

  - name: CareConference
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the conference concerns"
      - name: conference_type
        type: enum
        source: input
        description: "IDT conferences require discipline quorum; FAMILY conferences require a lawful decision maker"
        constraints: "one of IDT, FAMILY"
      - name: modality
        type: enum
        source: input
        description: "Delivery modality of the conference"
        constraints: "one of TELEHEALTH, IN_PERSON"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the booked conference interval on the patient's calendar"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the booked conference interval; must be strictly after scheduled_start"
      - name: decision_maker_id
        type: string
        source: input
        description: "FK -> SurrogateDesignation.id; the surrogate consenting at a FAMILY conference; null when the patient consents personally or when the server selects the surrogate"
      - name: decision_maker_kind
        type: enum
        source: computed
        description: "PATIENT when the patient consented personally, SURROGATE when a designation consented; null for IDT conferences"
        constraints: "one of PATIENT, SURROGATE"
      - name: disciplines_present
        type: array
        source: computed
        description: "Disciplines recorded present at hold time; each member one of PHYSICIAN, NURSE, SOCIAL_WORKER, CHAPLAIN"
      - name: quorum_met
        type: boolean
        source: computed
        default: false
        description: "True when disciplines_present covers every member of IDT_REQUIRED_DISCIPLINES"
      - name: documented_minutes
        type: integer
        source: computed
        default: 0
        description: "Face-to-face minutes recorded at hold time; feeds ACP billing"
      - name: held_at
        type: datetime
        source: system
        description: "Logical-clock instant the conference was held; null while SCHEDULED"
      - name: attestation_due_at
        type: datetime
        source: computed
        description: "held_at plus ATTESTATION_WINDOW_HOURS hours; null while SCHEDULED"
      - name: attested_disciplines
        type: array
        source: computed
        description: "Disciplines whose note attestation has been accepted inside the window"
      - name: attestation_complete
        type: boolean
        source: computed
        default: false
        description: "True when attested_disciplines covers every member of disciplines_present"
      - name: consent_recorded
        type: boolean
        source: computed
        default: false
        description: "True when a FAMILY conference was held with a lawful decision maker"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: "Conference lifecycle state"
        constraints: "one of SCHEDULED, HELD, QUORUM_FAILED, ATTESTED, CONSENT_INVALIDATED"

  - name: MedicationOrder
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the drug is ordered for"
      - name: drug
        type: enum
        source: input
        description: "Controlled drug ordered; selects the MME conversion factor"
        constraints: "one of MORPHINE_PO, OXYCODONE_PO, HYDROMORPHONE_PO, FENTANYL_TD"
      - name: dose_amount
        type: number
        source: input
        description: "Milligrams per day for the PO drugs; micrograms per hour for FENTANYL_TD"
        constraints: "greater than 0"
      - name: days_supply
        type: integer
        source: input
        description: "Days of supply dispensed per fill"
        constraints: "integer 1..90 inclusive"
      - name: breakthrough_drug
        type: enum
        source: input
        description: "Drug used for breakthrough dosing; null when no breakthrough dose is ordered"
        constraints: "one of MORPHINE_PO, OXYCODONE_PO, HYDROMORPHONE_PO"
      - name: prescriber_user_id
        type: string
        source: system
        description: "Opaque X-User-ID that created the order"
      - name: verifier_user_id
        type: string
        source: system
        description: "Opaque X-User-ID that supplied the VERIFICATION attestation; must differ from prescriber_user_id"
      - name: mme_variant
        type: enum
        source: computed
        description: "NAIVE when Patient.opioid_status is OPIOID_NAIVE, TOLERANT otherwise"
        constraints: "one of NAIVE, TOLERANT"
      - name: mme_daily
        type: number
        source: computed
        description: "Daily morphine milligram equivalents from calculations.medication_daily_mme, one decimal"
      - name: breakthrough_dose_mg
        type: number
        source: computed
        description: "Breakthrough dose in milligrams from calculations.breakthrough_dose_mg; null when breakthrough_drug is null"
      - name: last_fill_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent fill; set when the order becomes ACTIVE and on each refill"
      - name: next_refill_allowed_at
        type: datetime
        source: computed
        description: "last_fill_at plus days_supply days minus EARLY_REFILL_WINDOW_DAYS days"
      - name: refill_count
        type: integer
        source: system
        default: 0
        description: "Number of accepted refills"
      - name: mme_review_count
        type: integer
        source: system
        default: 0
        description: "Number of accepted MME_REVIEW attestations on this order"
      - name: status
        type: enum
        source: system
        default: PENDING_VERIFICATION
        description: "Order lifecycle state"
        constraints: "one of PENDING_VERIFICATION, ACTIVE, REVIEW_REQUIRED, DISCONTINUED"

  - name: DmeInventoryItem
    parent: null
    common_fields: true
    fields:
      - name: device_type
        type: enum
        source: input
        description: "Kind of durable medical equipment stocked in this row"
        constraints: "one of OXYGEN_CONCENTRATOR, HOSPITAL_BED, WHEELCHAIR, SUCTION_MACHINE"
      - name: total_units
        type: integer
        source: input
        description: "Conserved total; never changes after creation"
        constraints: "integer 1..500 inclusive"
      - name: prior_auth_required
        type: boolean
        source: input
        default: false
        description: "When true, orders against this item open in PENDING_AUTH and cannot be scheduled until authorized"
      - name: available_units
        type: integer
        source: computed
        description: "Units free to reserve; initialised to total_units"
      - name: reserved_units
        type: integer
        source: computed
        default: 0
        description: "Units held by DmeOrder rows in status REQUESTED, PENDING_AUTH or SCHEDULED"
      - name: delivered_units
        type: integer
        source: computed
        default: 0
        description: "Units held by DmeOrder rows in status DELIVERED"

  - name: DmeOrder
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient receiving the equipment"
      - name: inventory_item_id
        type: string
        source: input
        description: "FK -> DmeInventoryItem.id; the stock row the units come from"
      - name: quantity
        type: integer
        source: input
        description: "Units requested"
        constraints: "integer 1..10 inclusive"
      - name: delivery_window_start
        type: datetime
        source: input
        description: "Start of the requested delivery window on the inventory item's calendar"
      - name: delivery_window_end
        type: datetime
        source: input
        description: "End of the requested delivery window; must be strictly after delivery_window_start"
      - name: prior_auth_reference
        type: string
        source: system
        description: "Authorization reference recorded when the order leaves PENDING_AUTH; null otherwise"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant of delivery; null before delivery"
      - name: closed_reason
        type: enum
        source: system
        description: "Why the order closed; null while open"
        constraints: "one of CANCELLED, RETURNED, PICKED_UP_ON_DISCHARGE"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Order lifecycle state"
        constraints: "one of REQUESTED, PENDING_AUTH, SCHEDULED, DELIVERED, CLOSED"

  - name: HospiceElection
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient electing hospice"
      - name: concurrent_care_carve_out
        type: boolean
        source: input
        default: false
        description: "When true, palliative ACP claims dated inside an elected benefit period are carved out and may be billed"
      - name: attending_certifier_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the attending physician certification; null until certified"
      - name: hospice_director_certifier_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the hospice medical director certification; must differ from attending_certifier_user_id"
      - name: certification_count
        type: integer
        source: computed
        default: 0
        description: "Number of distinct certifier user ids recorded; HOSPICE_CERTIFIERS_REQUIRED are needed to reach CERTIFIED"
      - name: current_period_number
        type: integer
        source: computed
        default: 0
        description: "Benefit period ordinal; 0 before election, 1 for the first elected period"
      - name: current_period_start
        type: datetime
        source: system
        description: "Start of the current benefit period; null before election"
      - name: current_period_end
        type: datetime
        source: computed
        description: "Exclusive end of the current benefit period from calculations.hospice_benefit_period_schedule"
      - name: cumulative_benefit_days
        type: integer
        source: computed
        default: 0
        description: "Sum of the lengths in days of every benefit period opened on this election"
      - name: face_to_face_at
        type: datetime
        source: system
        description: "Instant of the face-to-face encounter supplied for the most recent period; null when none"
      - name: revocation_count
        type: integer
        source: system
        default: 0
        description: "Number of times this election has been revoked"
      - name: status
        type: enum
        source: system
        default: PENDING_CERT
        description: "Election lifecycle state"
        constraints: "one of PENDING_CERT, CERTIFIED, ELECTED, REVOKED, CLOSED_ON_DEATH"

  - name: OnCallEscalation
    parent: SymptomAssessment
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the after-hours contact concerns"
      - name: symptom_assessment_id
        type: string
        source: input
        description: "FK -> SymptomAssessment.id; the assessment that triggered the escalation"
      - name: tier
        type: integer
        source: computed
        default: 1
        description: "Current on-call tier, ESCALATION_TIER_MIN..ESCALATION_TIER_MAX"
      - name: tier_notified_at
        type: datetime
        source: system
        description: "Logical-clock instant the current tier was notified"
      - name: ack_due_at
        type: datetime
        source: computed
        description: "tier_notified_at plus the tier acknowledgment SLA minutes"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock instant of acknowledgment; null while unacknowledged"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID that acknowledged; null while unacknowledged"
      - name: disposition
        type: enum
        source: system
        description: "Recorded disposition; null before disposition"
        constraints: "one of ADVICE, URGENT_TELEHEALTH_VISIT, DISPATCH, ED_REFERRAL, ADMINISTRATIVE_CLOSE"
      - name: status
        type: enum
        source: system
        default: TIER_NOTIFIED
        description: "Escalation lifecycle state"
        constraints: "one of TIER_NOTIFIED, ACKNOWLEDGED, DISPOSITIONED, CLOSED"

  - name: AcpBillingClaim
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the service was rendered to"
      - name: conference_id
        type: string
        source: input
        description: "FK -> CareConference.id; the conference whose documentation supports the claim; null for a bedside encounter"
      - name: service_date
        type: datetime
        source: input
        description: "Instant the advance-care-planning service was rendered"
      - name: documented_minutes
        type: integer
        source: input
        description: "Documented face-to-face minutes"
        constraints: "integer 0..240 inclusive"
      - name: modality
        type: enum
        source: input
        description: "Discriminator selecting the allowed-amount variant"
        constraints: "one of TELEHEALTH, IN_PERSON"
      - name: concurrent_care_carve_out
        type: boolean
        source: input
        default: false
        description: "Claimant assertion that this service is carved out of a concurrent hospice benefit period"
      - name: billable_units
        type: integer
        source: computed
        description: "Time-based units from calculations.acp_billable_units, capped at ACP_MAX_UNITS"
      - name: modifier_code
        type: string
        source: computed
        description: "TELEHEALTH_MODIFIER_CODE when modality is TELEHEALTH; null when IN_PERSON"
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Allowed amount from calculations.claim_allowed_amount_cents"
      - name: coinsurance_pct
        type: number
        source: computed
        description: "Coinsurance rate selected from the capped allowed_amount_cents tier"
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "allowed_amount_cents times coinsurance_pct, rounded half up to whole cents"
      - name: net_payable_cents
        type: integer
        source: computed
        description: "allowed_amount_cents minus patient_responsibility_cents"
      - name: documentation_attested
        type: boolean
        source: computed
        default: false
        description: "True once a BillingSpecialist has attested the documentation on this claim"
      - name: attested_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID that attested the documentation; null before attestation"
      - name: denial_reason
        type: enum
        source: system
        description: "Payer denial reason; null unless status is DENIED"
        constraints: "one of DOCUMENTATION_INSUFFICIENT, DUPLICATE_SERVICE, NON_COVERED"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Claim lifecycle state"
        constraints: "one of DRAFT, ATTESTED, SUBMITTED, PAID, DENIED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table  (13 machines; 12 non-linear)
# ---------------------------------------------------------------------------
state_machines:
  - entity: Patient
    initial_state: REFERRED
    terminal_states: [DECEASED]
    shape: "cyclic (HOSPICE_ELECTED returns to ACTIVE on revocation) plus a terminal global write-gate"
    transitions:
      - from: REFERRED
        to: ACTIVE
        trigger: "POST /palliative/referrals/{id}/decision with decision ACCEPT"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECEIVED"
          - "Referral.triage_score >= REFERRAL_ACCEPT_MIN_SCORE"
          - "Patient.records_frozen == false"
        side_effects:
          - "Referral.status becomes ACCEPTED"
          - "Patient.program_status becomes ACTIVE; Patient.version increments by 1"
      - from: ACTIVE
        to: HOSPICE_ELECTED
        trigger: "POST /palliative/hospice-elections/{id}/periods opening benefit period number 1"
        actor: HospiceMedicalDirector
        preconditions:
          - "HospiceElection.status == CERTIFIED"
          - "Patient.records_frozen == false"
        side_effects:
          - "HospiceElection.status becomes ELECTED and current_period_number becomes 1"
          - "Patient.program_status becomes HOSPICE_ELECTED; Patient.version increments by 1"
      - from: HOSPICE_ELECTED
        to: ACTIVE
        trigger: "POST /palliative/hospice-elections/{id}/revoke"
        actor: HospiceMedicalDirector
        preconditions:
          - "HospiceElection.status == ELECTED"
          - "Patient.records_frozen == false"
        side_effects:
          - "HospiceElection.status becomes REVOKED and revocation_count increments by 1"
          - "Patient.program_status returns to ACTIVE; Patient.version increments by 1"
        note: "Cyclic: the patient may be re-certified and re-elect, returning to HOSPICE_ELECTED."
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /palliative/patients/{id}/death-events"
        actor: PalliativePhysician
        preconditions:
          - "Patient.program_status in {ACTIVE, HOSPICE_ELECTED}"
          - "Patient.records_frozen == false"
        side_effects:
          - "Patient.deceased_at is set to the current logical clock; Patient.records_frozen becomes true; Patient.version increments by 1"
          - "CASCADE HOP 1 - every HospiceElection for this patient with status in {PENDING_CERT, CERTIFIED, ELECTED, REVOKED} transitions to CLOSED_ON_DEATH"
          - "CASCADE HOP 2 - because that election closed, every MedicationOrder for this patient with status in {PENDING_VERIFICATION, ACTIVE, REVIEW_REQUIRED} transitions to DISCONTINUED, and Patient.active_daily_mme is recomputed to 0.0"
          - "CASCADE HOP 3 - because the patient's medication orders were discontinued, every CarePlan for this patient with status in {DRAFT, ACTIVE, UNDER_REVISION} transitions to CLOSED with closed_reason PATIENT_DEATH"
          - "CASCADE HOP 4 - because that plan closed, every SymptomAssessment whose care_plan_id equals that plan and whose triage_status is in {OPEN, ACKNOWLEDGED} sets triage_status to RESOLVED with resolution_reason PLAN_CLOSED, and Patient.open_symptom_count is recomputed to 0"
          - "CASCADE HOP 5 - because that assessment resolved, every OnCallEscalation whose symptom_assessment_id equals it and whose status is in {TIER_NOTIFIED, ACKNOWLEDGED, DISPOSITIONED} transitions to CLOSED with disposition ADMINISTRATIVE_CLOSE"
          - "Every DmeOrder for this patient with status DELIVERED is left open so it can be closed with closed_reason PICKED_UP_ON_DISCHARGE after death"
        note: "When the patient has no HospiceElection row, HOP 2 is triggered directly by the freeze instead of by HOP 1; HOPS 3-5 are unchanged. Post-death the only permitted writes are POST /palliative/dme-orders/{id}/close, POST /palliative/claims/{id}/attest, POST /palliative/claims/{id}/submit, POST /palliative/claims/{id}/adjudicate and POST /palliative/conferences/{id}/attestations."
      - from: HOSPICE_ELECTED
        to: DECEASED
        trigger: "POST /palliative/patients/{id}/death-events"
        actor: PalliativePhysician
        preconditions:
          - "Patient.records_frozen == false"
        side_effects:
          - "Identical to the ACTIVE to DECEASED transition, including CASCADE HOPS 1 through 5"

  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [ACCEPTED]
    shape: "branching (accept vs decline) with a capped cycle back from DECLINED"
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /palliative/referrals/{id}/decision with decision ACCEPT"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECEIVED"
          - "Referral.triage_score >= REFERRAL_ACCEPT_MIN_SCORE"
        side_effects:
          - "Patient.program_status becomes ACTIVE; Patient.version increments by 1"
      - from: RECEIVED
        to: DECLINED
        trigger: "POST /palliative/referrals/{id}/decision with decision DECLINE"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == RECEIVED"
          - "decline_reason_code is supplied"
        side_effects:
          - "Referral.decline_reason_code is stored"
          - "Patient.program_status is left unchanged at REFERRED"
      - from: DECLINED
        to: RECEIVED
        trigger: "POST /palliative/referrals/{id}/decision with decision RE_REFER"
        actor: IntakeCoordinator
        preconditions:
          - "Referral.status == DECLINED"
          - "Referral.re_referral_count < MAX_REREFERRALS"
        side_effects:
          - "Referral.re_referral_count increments by 1; Referral.decline_reason_code is cleared to null"
          - "Referral.triage_score and triage_variant are recomputed from the unchanged source, prognosis_months and serious_illness_criteria_count"
        note: "Cyclic. The third RE_REFER attempt fails with ERR_REREFERRAL_LIMIT because re_referral_count has reached MAX_REREFERRALS."

  - entity: SurrogateDesignation
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    shape: "linear with an early terminal"
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /palliative/surrogates/{id}/status with target_status ACTIVE"
        actor: SocialWorker
        preconditions:
          - "SurrogateDesignation.status == PROPOSED"
          - "Patient.records_frozen == false"
        side_effects:
          - "The designation joins the authority candidate pool used by calculations.surrogate_authority_selection"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /palliative/surrogates/{id}/status with target_status REVOKED"
        actor: SocialWorker
        preconditions:
          - "SurrogateDesignation.status == PROPOSED"
        side_effects:
          - "The designation never enters the authority candidate pool"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /palliative/surrogates/{id}/status with target_status REVOKED"
        actor: SocialWorker
        preconditions:
          - "SurrogateDesignation.status == ACTIVE"
        side_effects:
          - "The designation leaves the authority candidate pool; the next-ranked ACTIVE designation becomes the lawful decision maker"

  - entity: AdvanceCareDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    shape: "branching with signature self-loops and a supersession fan-in"
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /palliative/advance-care-documents/{id}/signatures while the execution requirement is still unmet"
        actor: SocialWorker
        preconditions:
          - "AdvanceCareDocument.status == DRAFT"
          - "The signer is not disqualified by the witness segregation rule"
          - "Patient.records_frozen == false"
        side_effects:
          - "signature_log gains one entry; the matching signature counter increments by 1"
          - "execution_ready is recomputed by calculations.document_execution_requirement and stays false"
      - from: DRAFT
        to: PENDING_EXECUTION
        trigger: "POST /palliative/advance-care-documents/{id}/signatures that completes the execution requirement"
        actor: SocialWorker
        preconditions:
          - "AdvanceCareDocument.status == DRAFT"
          - "calculations.document_execution_requirement is satisfied after this signature"
        side_effects:
          - "execution_ready becomes true"
      - from: PENDING_EXECUTION
        to: PENDING_EXECUTION
        trigger: "POST /palliative/advance-care-documents/{id}/signatures adding a further signature"
        actor: SocialWorker
        preconditions:
          - "AdvanceCareDocument.status == PENDING_EXECUTION"
        side_effects:
          - "signature_log gains one entry; execution_ready stays true"
      - from: PENDING_EXECUTION
        to: EXECUTED
        trigger: "POST /palliative/advance-care-documents/{id}/execute"
        actor: PalliativePhysician
        preconditions:
          - "AdvanceCareDocument.status == PENDING_EXECUTION and execution_ready == true; a document still in DRAFT is admitted past the generic state rung so that the jurisdiction and POLST-signature rungs can report the specific unmet requirement"
          - "expected_patient_version equals the patient's current version"
          - "Patient.records_frozen == false"
        side_effects:
          - "executed_at is set to the current logical clock; reattest_due_at becomes executed_at plus DIRECTIVE_REATTESTATION_DAYS days"
          - "Patient.version increments by 1"
          - "CASCADE HOP 1 - when supersedes_document_id is non-null and that document has status EXECUTED, it transitions to SUPERSEDED"
          - "CASCADE HOP 2 - because that document was superseded, every CodeStatusOrder whose source_document_id equals it and whose status is EFFECTIVE transitions to SUPERSEDED"
          - "CASCADE HOP 3 - because that order was superseded, Patient.code_status becomes the newly executed document's stated_code_status and Patient.code_status_rank is recomputed"
          - "CASCADE HOP 4 - because Patient.code_status changed, every CodeStatusOrder for this patient with status in {DRAFT, ATTESTED} transitions to CONFLICT_HOLD because its prior_code_status is now stale"
      - from: EXECUTED
        to: SUPERSEDED
        trigger: "system - a newer AdvanceCareDocument naming this row in supersedes_document_id reaches EXECUTED"
        actor: system
        preconditions:
          - "AdvanceCareDocument.status == EXECUTED"
        side_effects:
          - "Triggers CASCADE HOP 2 described above"
      - from: EXECUTED
        to: REVOKED
        trigger: "POST /palliative/advance-care-documents/{id}/revoke"
        actor: PalliativePhysician
        preconditions:
          - "AdvanceCareDocument.status == EXECUTED"
          - "Patient.records_frozen == false"
        side_effects:
          - "Every CodeStatusOrder whose source_document_id equals this row and whose status is EFFECTIVE transitions to SUPERSEDED"
          - "Patient.code_status reverts to the stated_code_status of this patient's most recently executed AdvanceCareDocument with status EXECUTED ordered by executed_at descending, tie-broken by created_at ascending, or to FULL_CODE when no such document exists"

  - entity: CodeStatusOrder
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: "branching into a conflict hold that re-enters the main path"
    transitions:
      - from: DRAFT
        to: ATTESTED
        trigger: "POST /palliative/code-status-orders/{id}/attestations - first attestation, no goals conflict"
        actor: PalliativePhysician
        preconditions:
          - "CodeStatusOrder.status == DRAFT"
          - "The ladder step size rule is satisfied"
          - "NOT (surrogate_stated == true AND patient_prior_statement is non-null AND patient_prior_statement != requested_code_status)"
        side_effects:
          - "attestation_count becomes 1; attesting_clinician_user_id or attesting_party_user_id is stamped from X-User-ID depending on attestation_role"
      - from: DRAFT
        to: CONFLICT_HOLD
        trigger: "POST /palliative/code-status-orders/{id}/attestations - first attestation while surrogate-stated wishes contradict the patient's own prior statement"
        actor: PalliativePhysician
        preconditions:
          - "CodeStatusOrder.status == DRAFT"
          - "surrogate_stated == true AND patient_prior_statement is non-null AND patient_prior_statement != requested_code_status"
        side_effects:
          - "attestation_count becomes 1; the order is parked and cannot become EFFECTIVE until the conflict is cleared"
      - from: CONFLICT_HOLD
        to: ATTESTED
        trigger: "POST /palliative/code-status-orders/{id}/attestations carrying conflict_resolution_note"
        actor: SocialWorker
        preconditions:
          - "CodeStatusOrder.status == CONFLICT_HOLD"
          - "conflict_resolution_note is supplied and non-empty"
        side_effects:
          - "conflict_resolution_note is stored; attestation_count increments by 1"
        note: "Re-entrant: the order rejoins the main path. Without the note the call fails with ERR_GOALS_CONFLICT."
      - from: ATTESTED
        to: EFFECTIVE
        trigger: "POST /palliative/code-status-orders/{id}/attestations supplying the second, different attestation_role"
        actor: SocialWorker
        preconditions:
          - "CodeStatusOrder.status == ATTESTED"
          - "attestation_count == 1 and the incoming attestation_role differs from the role already recorded"
          - "Patient.records_frozen == false"
        side_effects:
          - "attestation_count becomes CODE_STATUS_ATTESTATIONS_REQUIRED; effective_at is set to the current logical clock"
          - "Every other CodeStatusOrder for this patient with status EFFECTIVE transitions to SUPERSEDED"
          - "Patient.code_status becomes requested_code_status; Patient.code_status_rank is recomputed; Patient.version increments by 1"
      - from: EFFECTIVE
        to: SUPERSEDED
        trigger: "system - a newer CodeStatusOrder for the same patient becomes EFFECTIVE, or DOCUMENT CASCADE HOP 2, or CAPACITY CASCADE HOP 3"
        actor: system
        preconditions:
          - "CodeStatusOrder.status == EFFECTIVE"
        side_effects:
          - "Patient.code_status is rewritten by whichever rule fired - the new order's requested_code_status, the newly executed document's stated_code_status, or, for the capacity cascade, the stated_code_status of the patient's most recently executed AdvanceCareDocument with status EXECUTED ordered by executed_at descending and tie-broken by created_at ascending, falling back to FULL_CODE when none exists"
          - "Triggers DOCUMENT CASCADE HOP 4 / CAPACITY CASCADE HOP 4 - in-flight orders park in CONFLICT_HOLD"
      - from: ATTESTED
        to: CONFLICT_HOLD
        trigger: "system - DOCUMENT CASCADE HOP 4 or CAPACITY CASCADE HOP 4: Patient.code_status changed underneath this in-flight order"
        actor: system
        preconditions:
          - "CodeStatusOrder.status in {DRAFT, ATTESTED}"
        side_effects:
          - "prior_code_status is stale; the order must be re-attested with a conflict_resolution_note before it can proceed"

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: "cyclic revision loop"
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /palliative/care-plans/{id}/activate"
        actor: PalliativeNurse
        preconditions:
          - "CarePlan.status == DRAFT"
          - "Patient.program_status in {ACTIVE, HOSPICE_ELECTED}"
          - "Patient.records_frozen == false"
        side_effects:
          - "The plan becomes the target for new SymptomAssessment rows; CarePlan.version increments by 1"
      - from: ACTIVE
        to: UNDER_REVISION
        trigger: "POST /palliative/care-plans/{id}/revisions"
        actor: PalliativeNurse
        preconditions:
          - "CarePlan.status == ACTIVE"
          - "expected_care_plan_version equals the plan's current version"
          - "Patient.records_frozen == false"
        side_effects:
          - "CarePlan.problem_list is replaced by the supplied revised_problem_list; CarePlan.version increments by 1"
      - from: UNDER_REVISION
        to: ACTIVE
        trigger: "POST /palliative/care-plans/{id}/activate"
        actor: PalliativeNurse
        preconditions:
          - "CarePlan.status == UNDER_REVISION"
          - "Patient.records_frozen == false"
        side_effects:
          - "CarePlan.revision_number increments by 1; CarePlan.version increments by 1"
        note: "Cyclic: ACTIVE to UNDER_REVISION to ACTIVE may repeat without limit."
      - from: ACTIVE
        to: CLOSED
        trigger: "system - CASCADE HOP 3 of the patient death event"
        actor: system
        preconditions:
          - "CarePlan.status in {DRAFT, ACTIVE, UNDER_REVISION}"
        side_effects:
          - "closed_reason becomes PATIENT_DEATH"
          - "Triggers CASCADE HOP 4 - open SymptomAssessment rows on this plan resolve"
      - from: UNDER_REVISION
        to: CLOSED
        trigger: "system - CASCADE HOP 3 of the patient death event"
        actor: system
        preconditions:
          - "CarePlan.status == UNDER_REVISION"
        side_effects:
          - "closed_reason becomes PATIENT_DEATH"

  - entity: SymptomAssessment
    initial_state: "triage_status OPEN and escalation_status NONE"
    terminal_states: ["triage_status RESOLVED", "escalation_status DISPOSITIONED"]
    shape: "parallel - triage_status and escalation_status advance independently on the same row"
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /palliative/symptom-assessments/{id}/triage-update with action ACKNOWLEDGE"
        actor: PalliativeNurse
        preconditions:
          - "SymptomAssessment.triage_status == OPEN"
          - "Patient.records_frozen == false"
        side_effects:
          - "triage_status becomes ACKNOWLEDGED; escalation_status is left untouched"
        note: "Axis 1 of the parallel machine."
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /palliative/symptom-assessments/{id}/triage-update with action RESOLVE"
        actor: PalliativeNurse
        preconditions:
          - "SymptomAssessment.triage_status == ACKNOWLEDGED"
          - "Patient.records_frozen == false"
        side_effects:
          - "resolution_reason becomes SYMPTOM_CONTROLLED when escalation_status is NONE, and ESCALATION_DISPOSITIONED when escalation_status is DISPOSITIONED"
          - "Patient.open_symptom_count decrements by 1"
          - "Every OnCallEscalation whose symptom_assessment_id equals this row and whose status is DISPOSITIONED transitions to CLOSED"
      - from: OPEN
        to: RESOLVED
        trigger: "system - CASCADE HOP 4 of the patient death event"
        actor: system
        preconditions:
          - "SymptomAssessment.triage_status in {OPEN, ACKNOWLEDGED}"
        side_effects:
          - "resolution_reason becomes PLAN_CLOSED"
          - "Triggers CASCADE HOP 5 - linked escalations close"
      - from: NONE
        to: ESCALATED
        trigger: "POST /palliative/escalations creating an escalation against this assessment"
        actor: OnCallClinician
        preconditions:
          - "SymptomAssessment.escalation_status == NONE"
          - "SymptomAssessment.triage_status in {OPEN, ACKNOWLEDGED}"
          - "Patient.records_frozen == false"
        side_effects:
          - "escalation_status becomes ESCALATED; triage_status is left untouched"
        note: "Axis 2 of the parallel machine - an assessment can be ACKNOWLEDGED on axis 1 while still NONE on axis 2, and vice versa."
      - from: ESCALATED
        to: DISPOSITIONED
        trigger: "POST /palliative/escalations/{id}/response with response_type DISPOSITION"
        actor: OnCallClinician
        preconditions:
          - "SymptomAssessment.escalation_status == ESCALATED"
          - "OnCallEscalation.status == ACKNOWLEDGED"
        side_effects:
          - "escalation_status becomes DISPOSITIONED; triage_status is left untouched"

  - entity: CareConference
    initial_state: SCHEDULED
    terminal_states: [ATTESTED, CONSENT_INVALIDATED]
    shape: "branching hold outcome with a re-entrant retry from QUORUM_FAILED"
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /palliative/conferences/{id}/hold"
        actor: SocialWorker
        preconditions:
          - "CareConference.status == SCHEDULED"
          - "For conference_type IDT - disciplines_present covers every member of IDT_REQUIRED_DISCIPLINES"
          - "For conference_type FAMILY - the consenting party resolved by calculations.surrogate_authority_selection is lawful"
          - "Patient.records_frozen == false"
        side_effects:
          - "held_at is set to the current logical clock; attestation_due_at becomes held_at plus ATTESTATION_WINDOW_HOURS hours"
          - "documented_minutes is stored from the request; quorum_met becomes true for IDT"
          - "For FAMILY conferences consent_recorded becomes true and decision_maker_kind becomes PATIENT or SURROGATE"
      - from: SCHEDULED
        to: QUORUM_FAILED
        trigger: "POST /palliative/conferences/{id}/hold with an IDT discipline roster short of quorum"
        actor: SocialWorker
        preconditions:
          - "CareConference.status == SCHEDULED and conference_type == IDT"
          - "disciplines_present is missing at least one member of IDT_REQUIRED_DISCIPLINES"
        side_effects:
          - "quorum_met stays false; held_at stays null; documented_minutes is stored for the record"
          - "The conference does not count toward IDT cadence compliance"
      - from: QUORUM_FAILED
        to: HELD
        trigger: "POST /palliative/conferences/{id}/hold retried with a complete discipline roster"
        actor: SocialWorker
        preconditions:
          - "CareConference.status == QUORUM_FAILED"
          - "disciplines_present covers every member of IDT_REQUIRED_DISCIPLINES"
        side_effects:
          - "held_at is set to the current logical clock; quorum_met becomes true"
        note: "Re-entrant retry: the same endpoint drives the failed conference back onto the main path."
      - from: QUORUM_FAILED
        to: QUORUM_FAILED
        trigger: "POST /palliative/conferences/{id}/hold retried and still short of quorum"
        actor: SocialWorker
        preconditions:
          - "CareConference.status == QUORUM_FAILED"
          - "disciplines_present is still missing at least one required discipline"
        side_effects:
          - "disciplines_present is replaced by the new roster; quorum_met stays false"
      - from: HELD
        to: ATTESTED
        trigger: "POST /palliative/conferences/{id}/attestations completing every discipline present"
        actor: Chaplain
        preconditions:
          - "CareConference.status == HELD"
          - "The current logical clock is at or before attestation_due_at"
          - "The attesting discipline is a member of disciplines_present and has not already attested"
        side_effects:
          - "attested_disciplines gains the discipline; attestation_complete becomes true when it covers disciplines_present"
          - "For conference_type IDT the conference now counts as the patient's most recent attested IDT for cadence compliance"
      - from: HELD
        to: CONSENT_INVALIDATED
        trigger: "system - CAPACITY CASCADE HOP 2 of a capacity determination that changes the lawful decision maker"
        actor: system
        preconditions:
          - "CareConference.conference_type == FAMILY and consent_recorded == true"
          - "CareConference.status in {HELD, ATTESTED}"
        side_effects:
          - "consent_recorded becomes false"
          - "Triggers CAPACITY CASCADE HOP 3 - every EFFECTIVE CodeStatusOrder for this patient with surrogate_stated true transitions to SUPERSEDED"
          - "Parallel leg - every AcpBillingClaim whose conference_id equals this conference and whose status is in {DRAFT, ATTESTED} returns to DRAFT with documentation_attested false"
      - from: ATTESTED
        to: CONSENT_INVALIDATED
        trigger: "system - CAPACITY CASCADE HOP 2 of a capacity determination that changes the lawful decision maker"
        actor: system
        preconditions:
          - "CareConference.conference_type == FAMILY and consent_recorded == true"
        side_effects:
          - "consent_recorded becomes false; attestation_complete is left as recorded"
          - "Triggers CAPACITY CASCADE HOP 3 as above"

  - entity: MedicationOrder
    initial_state: PENDING_VERIFICATION
    terminal_states: [DISCONTINUED]
    shape: "cyclic - ACTIVE and REVIEW_REQUIRED exchange in both directions"
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /palliative/medication-orders/{id}/attestations with attestation_type VERIFICATION"
        actor: PalliativeNurse
        preconditions:
          - "MedicationOrder.status == PENDING_VERIFICATION"
          - "X-User-ID differs from MedicationOrder.prescriber_user_id"
          - "Patient.active_daily_mme plus this order's mme_daily is strictly less than MME_REVIEW_THRESHOLD"
          - "Patient.records_frozen == false"
        side_effects:
          - "verifier_user_id is stamped from X-User-ID; last_fill_at is set to the current logical clock"
          - "next_refill_allowed_at becomes last_fill_at plus days_supply days minus EARLY_REFILL_WINDOW_DAYS days"
          - "Patient.active_daily_mme increases by this order's mme_daily"
          - "breakthrough_dose_mg is recomputed for this order from the patient's new ACTIVE order set"
      - from: PENDING_VERIFICATION
        to: REVIEW_REQUIRED
        trigger: "POST /palliative/medication-orders/{id}/attestations with attestation_type VERIFICATION crossing the MME threshold"
        actor: PalliativeNurse
        preconditions:
          - "MedicationOrder.status == PENDING_VERIFICATION"
          - "X-User-ID differs from MedicationOrder.prescriber_user_id"
          - "Patient.active_daily_mme plus this order's mme_daily is greater than or equal to MME_REVIEW_THRESHOLD"
        side_effects:
          - "verifier_user_id is stamped; Patient.active_daily_mme is NOT changed because the order is not yet active"
      - from: REVIEW_REQUIRED
        to: ACTIVE
        trigger: "POST /palliative/medication-orders/{id}/attestations with attestation_type MME_REVIEW"
        actor: PalliativePhysician
        preconditions:
          - "MedicationOrder.status == REVIEW_REQUIRED"
          - "X-User-ID differs from MedicationOrder.prescriber_user_id"
          - "Patient.records_frozen == false"
        side_effects:
          - "mme_review_count increments by 1; last_fill_at is set to the current logical clock"
          - "next_refill_allowed_at is recomputed; Patient.active_daily_mme increases by this order's mme_daily"
      - from: ACTIVE
        to: REVIEW_REQUIRED
        trigger: "POST /palliative/medication-orders/{id}/refills while the patient is at or above the MME review threshold"
        actor: PalliativeNurse
        preconditions:
          - "MedicationOrder.status == ACTIVE"
          - "The current logical clock is at or after next_refill_allowed_at"
          - "Patient.active_daily_mme is greater than or equal to MME_REVIEW_THRESHOLD"
        side_effects:
          - "refill_count increments by 1; last_fill_at is set to the current logical clock; next_refill_allowed_at is recomputed"
          - "Patient.active_daily_mme decreases by this order's mme_daily because the order leaves the ACTIVE set"
        note: "Cyclic back-edge: the order must be re-reviewed by a physician before it becomes ACTIVE again."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /palliative/medication-orders/{id}/refills while the patient is below the MME review threshold"
        actor: PalliativeNurse
        preconditions:
          - "MedicationOrder.status == ACTIVE"
          - "The current logical clock is at or after next_refill_allowed_at"
          - "Patient.active_daily_mme is strictly less than MME_REVIEW_THRESHOLD"
        side_effects:
          - "refill_count increments by 1; last_fill_at and next_refill_allowed_at are recomputed; Patient.active_daily_mme is unchanged"
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /palliative/medication-orders/{id}/discontinue, or CASCADE HOP 2 of the patient death event"
        actor: PalliativePhysician
        preconditions:
          - "MedicationOrder.status in {PENDING_VERIFICATION, ACTIVE, REVIEW_REQUIRED}"
        side_effects:
          - "Patient.active_daily_mme decreases by exactly the mme_daily that this order contributed, restoring the conservation invariant"
          - "breakthrough_dose_mg is recomputed for the patient's remaining ACTIVE orders"
      - from: REVIEW_REQUIRED
        to: DISCONTINUED
        trigger: "POST /palliative/medication-orders/{id}/discontinue"
        actor: PalliativePhysician
        preconditions:
          - "MedicationOrder.status == REVIEW_REQUIRED"
        side_effects:
          - "Patient.active_daily_mme is unchanged because the order was not contributing"
      - from: PENDING_VERIFICATION
        to: DISCONTINUED
        trigger: "POST /palliative/medication-orders/{id}/discontinue"
        actor: PalliativePhysician
        preconditions:
          - "MedicationOrder.status == PENDING_VERIFICATION"
        side_effects:
          - "Patient.active_daily_mme is unchanged"

  - entity: DmeOrder
    initial_state: "REQUESTED when the named DmeInventoryItem.prior_auth_required is false; PENDING_AUTH when it is true"
    terminal_states: [CLOSED]
    shape: "branching - the initial state forks on the inventory item's prior-auth flag and the close leg forks on closed_reason"
    note: "PENDING_AUTH is an ALTERNATE INITIAL STATE, not a state entered from REQUESTED. POST /palliative/dme-orders picks between the two at creation time from the inventory item's prior_auth_required flag, and POST /palliative/dme-orders/{id}/authorize is the only edge out of PENDING_AUTH into the main path."
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /palliative/dme-orders/{id}/fulfillment with event SCHEDULED"
        actor: PalliativeNurse
        preconditions:
          - "DmeOrder.status == REQUESTED"
          - "The delivery window does not overlap another non-closed order on the same inventory_item_id"
          - "Patient.records_frozen == false"
        side_effects:
          - "The reservation on DmeInventoryItem is retained; no ledger movement occurs"
      - from: PENDING_AUTH
        to: REQUESTED
        trigger: "POST /palliative/dme-orders/{id}/authorize"
        actor: ProgramAdmin
        preconditions:
          - "DmeOrder.status == PENDING_AUTH"
          - "Patient.records_frozen == false"
        side_effects:
          - "prior_auth_reference is stored"
        note: "Orders open in PENDING_AUTH when DmeInventoryItem.prior_auth_required is true, and in REQUESTED otherwise."
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /palliative/dme-orders/{id}/fulfillment with event DELIVERED"
        actor: PalliativeNurse
        preconditions:
          - "DmeOrder.status == SCHEDULED"
          - "Patient.records_frozen == false"
        side_effects:
          - "delivered_at is set to the current logical clock"
          - "DmeInventoryItem.reserved_units decreases by quantity and delivered_units increases by quantity, leaving total_units unchanged"
      - from: SCHEDULED
        to: CLOSED
        trigger: "POST /palliative/dme-orders/{id}/close with closed_reason CANCELLED"
        actor: PalliativeNurse
        preconditions:
          - "DmeOrder.status in {REQUESTED, PENDING_AUTH, SCHEDULED}"
        side_effects:
          - "DmeInventoryItem.reserved_units decreases by quantity and available_units increases by quantity, restoring the conservation invariant exactly"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /palliative/dme-orders/{id}/close with closed_reason RETURNED or PICKED_UP_ON_DISCHARGE"
        actor: PalliativeNurse
        preconditions:
          - "DmeOrder.status == DELIVERED"
        side_effects:
          - "DmeInventoryItem.delivered_units decreases by quantity and available_units increases by quantity, restoring the conservation invariant exactly"
        note: "PICKED_UP_ON_DISCHARGE is the post-death pickup leg and is permitted while Patient.records_frozen is true."

  - entity: HospiceElection
    initial_state: PENDING_CERT
    terminal_states: [CLOSED_ON_DEATH]
    shape: "cyclic - revocation returns to PENDING_CERT and benefit periods self-loop on ELECTED"
    transitions:
      - from: PENDING_CERT
        to: PENDING_CERT
        trigger: "POST /palliative/hospice-elections/{id}/certifications - first certification"
        actor: PalliativePhysician
        preconditions:
          - "HospiceElection.status == PENDING_CERT and certification_count == 0"
          - "Patient.records_frozen == false"
        side_effects:
          - "attending_certifier_user_id is stamped from X-User-ID; certification_count becomes 1"
      - from: PENDING_CERT
        to: CERTIFIED
        trigger: "POST /palliative/hospice-elections/{id}/certifications - second certification by a different physician"
        actor: HospiceMedicalDirector
        preconditions:
          - "HospiceElection.status == PENDING_CERT and certification_count == 1"
          - "X-User-ID differs from attending_certifier_user_id"
        side_effects:
          - "hospice_director_certifier_user_id is stamped; certification_count becomes HOSPICE_CERTIFIERS_REQUIRED"
      - from: CERTIFIED
        to: ELECTED
        trigger: "POST /palliative/hospice-elections/{id}/periods opening benefit period 1"
        actor: HospiceMedicalDirector
        preconditions:
          - "HospiceElection.status == CERTIFIED"
          - "expected_election_version equals the election's current version"
          - "The patient's most recent ATTESTED IDT conference is within IDT_CADENCE_MAX_DAYS of the current logical clock"
        side_effects:
          - "current_period_number increments by 1 (reaching 1 on a first election, and continuing the sequence after a revoke and re-election); current_period_start is the supplied period_start; current_period_end is computed by calculations.hospice_benefit_period_schedule"
          - "cumulative_benefit_days increases by the new period's length; HospiceElection.version increments by 1"
          - "Patient.program_status becomes HOSPICE_ELECTED; Patient.version increments by 1"
      - from: ELECTED
        to: ELECTED
        trigger: "POST /palliative/hospice-elections/{id}/periods opening the next benefit period"
        actor: HospiceMedicalDirector
        preconditions:
          - "HospiceElection.status == ELECTED"
          - "expected_election_version equals the election's current version"
          - "The supplied period_start is at or after current_period_end"
          - "When the new period number is at or above FACE_TO_FACE_MIN_PERIOD_NUMBER, face_to_face_at falls inside the bounded window before period_start"
          - "The patient's most recent ATTESTED IDT conference is within IDT_CADENCE_MAX_DAYS of the current logical clock"
        side_effects:
          - "current_period_number increments by 1; current_period_start and current_period_end are recomputed"
          - "cumulative_benefit_days increases by the new period's length; HospiceElection.version increments by 1"
        note: "Self-loop: periods 1 and 2 last BENEFIT_PERIOD_1_DAYS and BENEFIT_PERIOD_2_DAYS; every later period lasts BENEFIT_PERIOD_SUBSEQUENT_DAYS."
      - from: ELECTED
        to: REVOKED
        trigger: "POST /palliative/hospice-elections/{id}/revoke"
        actor: HospiceMedicalDirector
        preconditions:
          - "HospiceElection.status == ELECTED"
          - "Patient.records_frozen == false"
        side_effects:
          - "revocation_count increments by 1; current_period_number is retained for the audit trail"
          - "Patient.program_status returns to ACTIVE; Patient.version increments by 1"
      - from: REVOKED
        to: PENDING_CERT
        trigger: "POST /palliative/hospice-elections/{id}/certifications after revocation"
        actor: PalliativePhysician
        preconditions:
          - "HospiceElection.status == REVOKED"
        side_effects:
          - "certification_count resets to 1; attending_certifier_user_id is re-stamped; hospice_director_certifier_user_id is cleared to null"
        note: "Cyclic: the patient may re-elect after revocation, walking PENDING_CERT to CERTIFIED to ELECTED again."
      - from: ELECTED
        to: CLOSED_ON_DEATH
        trigger: "system - CASCADE HOP 1 of the patient death event"
        actor: system
        preconditions:
          - "HospiceElection.status in {PENDING_CERT, CERTIFIED, ELECTED, REVOKED}"
        side_effects:
          - "Triggers CASCADE HOP 2 - the patient's medication orders are discontinued"

  - entity: OnCallEscalation
    initial_state: TIER_NOTIFIED
    terminal_states: [CLOSED]
    shape: "capped self-loop - tier promotion repeats until ESCALATION_TIER_MAX"
    transitions:
      - from: TIER_NOTIFIED
        to: TIER_NOTIFIED
        trigger: "POST /palliative/escalations/{id}/promote"
        actor: OnCallClinician
        preconditions:
          - "OnCallEscalation.status == TIER_NOTIFIED"
          - "OnCallEscalation.tier is strictly less than ESCALATION_TIER_MAX"
          - "The current logical clock is at or after ack_due_at"
          - "Patient.records_frozen == false"
        side_effects:
          - "tier increments by 1; tier_notified_at is set to the current logical clock; ack_due_at is recomputed from the new tier's SLA"
        note: "Capped: promotion from tier ESCALATION_TIER_MAX has no transition and fails with ERR_INVALID_STATE."
      - from: TIER_NOTIFIED
        to: ACKNOWLEDGED
        trigger: "POST /palliative/escalations/{id}/response with response_type ACKNOWLEDGE"
        actor: OnCallClinician
        preconditions:
          - "OnCallEscalation.status == TIER_NOTIFIED"
          - "Patient.records_frozen == false"
        side_effects:
          - "acknowledged_at and acknowledged_by_user_id are stamped"
      - from: ACKNOWLEDGED
        to: DISPOSITIONED
        trigger: "POST /palliative/escalations/{id}/response with response_type DISPOSITION"
        actor: OnCallClinician
        preconditions:
          - "OnCallEscalation.status == ACKNOWLEDGED"
          - "disposition is supplied and is not ADMINISTRATIVE_CLOSE"
        side_effects:
          - "disposition is stored"
          - "The linked SymptomAssessment sets escalation_status to DISPOSITIONED"
      - from: DISPOSITIONED
        to: CLOSED
        trigger: "system - the linked SymptomAssessment reaches triage_status RESOLVED"
        actor: system
        preconditions:
          - "OnCallEscalation.status == DISPOSITIONED"
        side_effects:
          - "The escalation leaves the open queue"
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "system - CASCADE HOP 5 of the patient death event"
        actor: system
        preconditions:
          - "OnCallEscalation.status in {TIER_NOTIFIED, ACKNOWLEDGED, DISPOSITIONED}"
        side_effects:
          - "disposition becomes ADMINISTRATIVE_CLOSE"

  - entity: AcpBillingClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    shape: "branching adjudication with a cycle from DENIED back to ATTESTED"
    transitions:
      - from: DRAFT
        to: ATTESTED
        trigger: "POST /palliative/claims/{id}/attest"
        actor: BillingSpecialist
        preconditions:
          - "AcpBillingClaim.status in {DRAFT, DENIED}"
          - "When conference_id is non-null, that conference has attestation_complete == true"
        side_effects:
          - "documentation_attested becomes true; attested_by_user_id is stamped from X-User-ID"
      - from: ATTESTED
        to: SUBMITTED
        trigger: "POST /palliative/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "AcpBillingClaim.status == ATTESTED and documentation_attested == true"
        side_effects:
          - "Patient.acp_minutes_claimed increases by documented_minutes"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /palliative/claims/{id}/adjudicate with outcome PAID"
        actor: ProgramAdmin
        preconditions:
          - "AcpBillingClaim.status == SUBMITTED"
        side_effects:
          - "Patient.acp_paid_cents_ytd increases by net_payable_cents"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /palliative/claims/{id}/adjudicate with outcome DENIED"
        actor: ProgramAdmin
        preconditions:
          - "AcpBillingClaim.status == SUBMITTED"
          - "denial_reason is supplied"
        side_effects:
          - "denial_reason is stored; documentation_attested returns to false and attested_by_user_id is cleared to null"
          - "Patient.acp_minutes_claimed decreases by exactly the documented_minutes added at submission, restoring the conservation invariant"
      - from: DENIED
        to: ATTESTED
        trigger: "POST /palliative/claims/{id}/attest re-attesting a denied claim"
        actor: BillingSpecialist
        preconditions:
          - "AcpBillingClaim.status == DENIED"
        side_effects:
          - "documentation_attested becomes true again; denial_reason is retained for the audit trail"
        note: "Cyclic: DENIED to ATTESTED to SUBMITTED may repeat."
      - from: ATTESTED
        to: DRAFT
        trigger: "system - parallel leg of a capacity determination that invalidated the supporting conference consent"
        actor: system
        preconditions:
          - "AcpBillingClaim.status in {DRAFT, ATTESTED}"
          - "The claim's conference_id names a conference that reached CONSENT_INVALIDATED"
        side_effects:
          - "documentation_attested becomes false; attested_by_user_id is cleared to null"
        note: "This leg runs alongside CAPACITY CASCADE HOP 3; it is not itself a hop of that chain."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's version; three distinct parents)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: document-execute-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /palliative/advance-care-documents/{id}/execute"
    occ_field: "expected_patient_version"
    description: |
      Executing an advance care document against a Patient whose version has
      advanced since the client last observed it is rejected. A newly executed
      document legitimately supersedes the prior one and rewrites
      Patient.code_status, so a client holding a stale view of the patient
      cannot know which document it is superseding.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: care-plan-revision-stale-plan
    parent_entity: CarePlan
    write_endpoint: "POST /palliative/care-plans/{id}/revisions"
    occ_field: "expected_care_plan_version"
    description: |
      Opening a revision on a CarePlan whose version has advanced since the
      client last observed it is rejected. A revision replaces the plan's
      problem_list wholesale, so a client working from a stale plan would
      silently discard problems added by an earlier accepted revision.
    error_id: ERR_STALE_CARE_PLAN_VERSION
    http_status: 412

  - rule_id: hospice-period-stale-election
    parent_entity: HospiceElection
    write_endpoint: "POST /palliative/hospice-elections/{id}/periods"
    occ_field: "expected_election_version"
    description: |
      Opening a benefit period on a HospiceElection whose version has advanced
      since the client last observed it is rejected. Each accepted period
      legitimately advances current_period_number and the benefit-period
      arithmetic, so a client holding a stale election would compute the wrong
      period length and the wrong face-to-face requirement.
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table  (16 rules; 5 dual-variant)
# ---------------------------------------------------------------------------
calculations:
  - name: referral_triage_score
    trigger: "POST /palliative/referrals, and again on every accepted RE_REFER decision"
    algorithm: weighted_scoring
    formula: |
      prognosis_gap = max(0, REFERRAL_PROGNOSIS_MAX_MONTHS - prognosis_months)

      # variant PAYER_SOURCED  (source in {HOSPITAL_DISCHARGE, PAYER})
      source_weight = TRIAGE_SOURCE_WEIGHT_HOSPITAL_DISCHARGE  when source == HOSPITAL_DISCHARGE
                      TRIAGE_SOURCE_WEIGHT_PAYER               when source == PAYER
      raw_payer = source_weight
                + TRIAGE_CRITERION_POINTS * serious_illness_criteria_count
                + TRIAGE_PROGNOSIS_POINTS_PER_MONTH * prognosis_gap

      # variant CLINICIAN_SOURCED  (source in {ONCOLOGY, PRIMARY_CARE, SELF})
      raw_clinician = TRIAGE_CRITERION_POINTS * TRIAGE_CLINICIAN_CRITERION_MULTIPLIER
                        * serious_illness_criteria_count
                    + TRIAGE_CLINICIAN_PROGNOSIS_POINTS_PER_MONTH * prognosis_gap

      triage_score = min(TRIAGE_SCORE_CAP, raw)   # integer arithmetic throughout
    input_set: "The single Referral row being scored; no other rows participate."
    constants:
      REFERRAL_PROGNOSIS_MAX_MONTHS: 12
      TRIAGE_SOURCE_WEIGHT_HOSPITAL_DISCHARGE: 30
      TRIAGE_SOURCE_WEIGHT_PAYER: 20
      TRIAGE_CRITERION_POINTS: 12
      TRIAGE_PROGNOSIS_POINTS_PER_MONTH: 4
      TRIAGE_CLINICIAN_CRITERION_MULTIPLIER: 2
      TRIAGE_CLINICIAN_PROGNOSIS_POINTS_PER_MONTH: 2
      TRIAGE_SCORE_CAP: 100
    precision: "integer; no rounding step exists because every term is an integer product"
    variants:
      - name: PAYER_SOURCED
        when: "Referral.source in {HOSPITAL_DISCHARGE, PAYER}"
        difference: "Adds a flat source weight and scores criteria at face value; prognosis urgency is worth TRIAGE_PROGNOSIS_POINTS_PER_MONTH per month of gap."
      - name: CLINICIAN_SOURCED
        when: "Referral.source in {ONCOLOGY, PRIMARY_CARE, SELF}"
        difference: "Carries no source weight, doubles the criteria points instead, and halves the per-month prognosis points. Identical criteria_count and prognosis_months therefore yield a different triage_score than PAYER_SOURCED."

  - name: symptom_distress_score
    trigger: "POST /palliative/symptom-assessments"
    algorithm: weighted_scoring
    formula: |
      objective  = item_pain + item_dyspnea + item_nausea
      subjective = item_anxiety + item_fatigue

      # variant SELF
      raw_self  = (objective + subjective) * SELF_REPORT_MULTIPLIER

      # variant PROXY
      raw_proxy = (objective + PROXY_SUBJECTIVE_WEIGHT * subjective) * PROXY_REPORT_MULTIPLIER

      distress_score = min(DISTRESS_SCORE_CAP, round_half_up(raw, 0))
    input_set: "The five item scores on the single SymptomAssessment row being created."
    constants:
      SELF_REPORT_MULTIPLIER: 2
      PROXY_SUBJECTIVE_WEIGHT: 0.6
      PROXY_REPORT_MULTIPLIER: 2.5
      DISTRESS_SCORE_CAP: 100
    precision: "integer, round_half_up at the single final step"
    variants:
      - name: SELF
        when: "SymptomAssessment.reporter_type == SELF"
        difference: "All five items carry equal weight and the sum is doubled."
      - name: PROXY
        when: "SymptomAssessment.reporter_type == PROXY"
        difference: "The two subjective items (anxiety, fatigue) are discounted to PROXY_SUBJECTIVE_WEIGHT because a caregiver cannot observe them directly, and the resulting total is scaled by the larger PROXY_REPORT_MULTIPLIER. Identical item scores therefore yield a different distress_score than SELF."

  - name: symptom_response_due_at
    trigger: "POST /palliative/symptom-assessments, immediately after symptom_distress_score"
    algorithm: threshold
    formula: |
      severity_tier =
          SEVERE   when distress_score >= DISTRESS_TIER_SEVERE_MIN
          MODERATE when DISTRESS_TIER_MODERATE_MIN <= distress_score <  DISTRESS_TIER_SEVERE_MIN
          MILD     when DISTRESS_TIER_MILD_MIN     <= distress_score <  DISTRESS_TIER_MODERATE_MIN
          MINIMAL  when distress_score <  DISTRESS_TIER_MILD_MIN

      sla_minutes = SLA_MINUTES_SEVERE   when severity_tier == SEVERE
                    SLA_MINUTES_MODERATE when severity_tier == MODERATE
                    SLA_MINUTES_MILD     when severity_tier == MILD
                    SLA_MINUTES_MINIMAL  when severity_tier == MINIMAL

      response_due_at = SymptomAssessment.created_at + sla_minutes minutes
    input_set: "The distress_score just computed on this assessment."
    constants:
      DISTRESS_TIER_SEVERE_MIN: 70
      DISTRESS_TIER_MODERATE_MIN: 40
      DISTRESS_TIER_MILD_MIN: 15
      SLA_MINUTES_SEVERE: 30
      SLA_MINUTES_MODERATE: 240
      SLA_MINUTES_MILD: 1440
      SLA_MINUTES_MINIMAL: 4320
    precision: "response_due_at is rendered in DATETIME_RENDER_FORMAT, the same format as created_at"
    note: "Every tier floor is INCLUSIVE and every tier ceiling is EXCLUSIVE. distress_score exactly 70 is SEVERE, exactly 40 is MODERATE, exactly 15 is MILD, and 14 is MINIMAL."

  - name: medication_daily_mme
    trigger: "POST /palliative/medication-orders"
    algorithm: tiered_pricing
    formula: |
      factor = MME_FACTOR_MORPHINE_PO       when drug == MORPHINE_PO
               MME_FACTOR_OXYCODONE_PO      when drug == OXYCODONE_PO
               MME_FACTOR_HYDROMORPHONE_PO  when drug == HYDROMORPHONE_PO
               MME_FACTOR_FENTANYL_TD       when drug == FENTANYL_TD
      base_mme = dose_amount * factor

      # variant TOLERANT
      mme_daily = round_half_up(base_mme, 1)
      # variant NAIVE
      mme_daily = round_half_up(base_mme * OPIOID_NAIVE_SAFETY_FACTOR, 1)
    input_set: "The single MedicationOrder row being created, plus Patient.opioid_status as the variant discriminator."
    constants:
      MME_FACTOR_MORPHINE_PO: 1.0
      MME_FACTOR_OXYCODONE_PO: 1.5
      MME_FACTOR_HYDROMORPHONE_PO: 5.0
      MME_FACTOR_FENTANYL_TD: 2.4
      OPIOID_NAIVE_SAFETY_FACTOR: 0.75
    precision: "one decimal place, round_half_up"
    variants:
      - name: TOLERANT
        when: "Patient.opioid_status == OPIOID_TOLERANT"
        difference: "The raw conversion is used unmodified."
      - name: NAIVE
        when: "Patient.opioid_status == OPIOID_NAIVE"
        difference: "The raw conversion is scaled by OPIOID_NAIVE_SAFETY_FACTOR before rounding, so an identical drug and dose_amount yields a strictly smaller mme_daily than TOLERANT."

  - name: breakthrough_dose_mg
    trigger: "Recomputed whenever a MedicationOrder for the patient enters or leaves status ACTIVE"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED - round per order FIRST, then sum.
      # STEP 1: each order's mme_daily is already rounded to one decimal by
      #         calculations.medication_daily_mme. Use those rounded values.
      # STEP 2: sum the rounded values.
      total_24h_mme = sum(o.mme_daily
                          for o in MedicationOrder
                          where o.patient_id == this.patient_id and o.status == ACTIVE)
      # STEP 3: apply the fraction to the SUM, never per order.
      breakthrough_mme = total_24h_mme * BREAKTHROUGH_FRACTION
      # STEP 4: convert into the breakthrough drug and round ONCE, at the end.
      breakthrough_dose_mg = round_half_up(breakthrough_mme / MME_FACTOR_<breakthrough_drug>, 1)
    input_set: "Every MedicationOrder for the patient with status ACTIVE, evaluated after the triggering transition has been applied. Orders in PENDING_VERIFICATION, REVIEW_REQUIRED or DISCONTINUED are excluded."
    constants:
      BREAKTHROUGH_FRACTION: 0.15
      MME_FACTOR_MORPHINE_PO: 1.0
      MME_FACTOR_OXYCODONE_PO: 1.5
      MME_FACTOR_HYDROMORPHONE_PO: 5.0
    precision: "one decimal place, round_half_up, applied exactly once at STEP 4"
    note: "The rejected alternative order - sum the UNROUNDED base_mme values and round only at the end - produces different milligrams for the same orders. This scaffold pins round-per-order-then-sum. breakthrough_dose_mg is null when breakthrough_drug is null."

  - name: acp_billable_units
    trigger: "POST /palliative/claims"
    algorithm: threshold
    formula: |
      # Rejected upstream by ERR_INSUFFICIENT_DOCUMENTED_TIME when
      # documented_minutes < ACP_FIRST_UNIT_MIN_MINUTES.
      billable_units = min(ACP_MAX_UNITS,
                           1 + floor((documented_minutes - ACP_FIRST_UNIT_MIN_MINUTES)
                                     / ACP_ADDITIONAL_UNIT_MINUTES))
    input_set: "The documented_minutes supplied on the single AcpBillingClaim row being created."
    constants:
      ACP_FIRST_UNIT_MIN_MINUTES: 16
      ACP_ADDITIONAL_UNIT_MINUTES: 30
      ACP_MAX_UNITS: 4
    precision: "integer; floor division, never rounding"
    note: "Threshold/midpoint rule with INCLUSIVE lower edges. 15 minutes is rejected, 16 minutes yields exactly 1 unit, 45 yields 1, 46 yields 2, 75 yields 2, 76 yields 3, 106 yields 4, and 240 is capped at ACP_MAX_UNITS = 4."

  - name: claim_allowed_amount_cents
    trigger: "POST /palliative/claims, immediately after acp_billable_units"
    algorithm: tiered_pricing
    formula: |
      base_cents = ACP_BASE_RATE_CENTS
                 + (billable_units - 1) * ACP_ADDITIONAL_UNIT_RATE_CENTS

      # variant TELEHEALTH
      rated_cents   = round_half_up(base_cents * TELEHEALTH_RATE_FACTOR, 0)
      modifier_code = TELEHEALTH_MODIFIER_CODE
      # variant IN_PERSON
      rated_cents   = round_half_up(base_cents * IN_PERSON_RATE_FACTOR, 0)
      modifier_code = null

      cap_remaining_cents  = max(0, ACP_ANNUAL_CAP_CENTS - Patient.acp_paid_cents_ytd)
      allowed_amount_cents = min(rated_cents, cap_remaining_cents)
    input_set: "billable_units from this claim, modality from this claim, and Patient.acp_paid_cents_ytd, which counts only this patient's claims with status PAID."
    constants:
      ACP_BASE_RATE_CENTS: 8600
      ACP_ADDITIONAL_UNIT_RATE_CENTS: 7500
      TELEHEALTH_RATE_FACTOR: 0.85
      IN_PERSON_RATE_FACTOR: 1.0
      TELEHEALTH_MODIFIER_CODE: "95"
      ACP_ANNUAL_CAP_CENTS: 40000
    precision: "whole cents, round_half_up applied once to the rated amount before the cap is applied"
    variants:
      - name: TELEHEALTH
        when: "AcpBillingClaim.modality == TELEHEALTH"
        difference: "The base amount is scaled by TELEHEALTH_RATE_FACTOR and modifier_code is stamped TELEHEALTH_MODIFIER_CODE."
      - name: IN_PERSON
        when: "AcpBillingClaim.modality == IN_PERSON"
        difference: "The base amount passes through at IN_PERSON_RATE_FACTOR and modifier_code stays null, so identical documented_minutes yield a strictly larger allowed_amount_cents than TELEHEALTH whenever the annual cap is not binding."

  - name: claim_net_payable_cents
    trigger: "POST /palliative/claims, immediately after claim_allowed_amount_cents"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The coinsurance tier looks circular because
      # it is keyed on the very amount that the cap may have reduced, so the
      # order below is normative:
      #   (1) billable_units
      #   (2) allowed_amount_cents INCLUDING the annual-cap min()
      #   (3) coinsurance_pct read off the CAPPED allowed_amount_cents
      #   (4) patient_responsibility_cents
      #   (5) net_payable_cents
      coinsurance_pct = COINSURANCE_PCT_LOW
                          when allowed_amount_cents <= COINSURANCE_TIER_LOW_MAX_CENTS
                        COINSURANCE_PCT_HIGH
                          when allowed_amount_cents >  COINSURANCE_TIER_LOW_MAX_CENTS
      patient_responsibility_cents = round_half_up(allowed_amount_cents * coinsurance_pct, 0)
      net_payable_cents            = allowed_amount_cents - patient_responsibility_cents
    input_set: "The allowed_amount_cents computed for this claim, after the annual cap."
    constants:
      COINSURANCE_TIER_LOW_MAX_CENTS: 10000
      COINSURANCE_PCT_LOW: 0.1
      COINSURANCE_PCT_HIGH: 0.2
    precision: "whole cents, round_half_up on the responsibility only; net_payable_cents is an exact subtraction"
    note: "The tier boundary is INCLUSIVE at the low end: allowed_amount_cents of exactly COINSURANCE_TIER_LOW_MAX_CENTS uses COINSURANCE_PCT_LOW, and 10001 uses COINSURANCE_PCT_HIGH. Reading the tier off the UNCAPPED rated amount is the wrong order and yields a different net_payable_cents whenever the cap binds."

  - name: document_execution_requirement
    trigger: "Recomputed on every POST /palliative/advance-care-documents/{id}/signatures, and read again by POST /palliative/advance-care-documents/{id}/execute"
    algorithm: constraint_propagation
    formula: |
      # variant JUR_TWO_WITNESS
      base_ok = witness_signature_count >= WITNESS_COUNT_REQUIRED_TWO_WITNESS
      # variant JUR_NOTARY
      base_ok = notary_signature_count  >= NOTARY_COUNT_REQUIRED_NOTARY

      polst_ok = true
                   when document_type in {LIVING_WILL, HEALTHCARE_PROXY}
                 (physician_signature_count >= POLST_PHYSICIAN_SIGNATURE_REQUIRED
                  and patient_or_surrogate_signature_count
                        >= POLST_PATIENT_OR_SURROGATE_SIGNATURE_REQUIRED)
                   when document_type == POLST

      execution_ready = base_ok and polst_ok
    input_set: "The signature counters on the single AdvanceCareDocument row, plus Patient.jurisdiction_code as the variant discriminator."
    constants:
      WITNESS_COUNT_REQUIRED_TWO_WITNESS: 2
      NOTARY_COUNT_REQUIRED_NOTARY: 1
      POLST_PHYSICIAN_SIGNATURE_REQUIRED: 1
      POLST_PATIENT_OR_SURROGATE_SIGNATURE_REQUIRED: 1
    precision: "boolean; every comparison is >= and therefore INCLUSIVE at the required count"
    variants:
      - name: JUR_TWO_WITNESS
        when: "Patient.jurisdiction_code == JUR_TWO_WITNESS"
        difference: "Requires WITNESS_COUNT_REQUIRED_TWO_WITNESS witness signatures and ignores notary signatures entirely; a notarised document with zero witnesses is NOT execution-ready."
      - name: JUR_NOTARY
        when: "Patient.jurisdiction_code == JUR_NOTARY"
        difference: "Requires NOTARY_COUNT_REQUIRED_NOTARY notary signature and ignores witness signatures entirely; an identical document with two witnesses and no notary is NOT execution-ready. The same signature_log therefore produces opposite execution_ready values under the two jurisdictions."

  - name: surrogate_authority_selection
    trigger: "POST /palliative/conferences/{id}/hold for conference_type FAMILY, and again on POST /palliative/patients/{id}/capacity-determinations"
    algorithm: topological
    formula: |
      # eligibility filter
      candidates = SurrogateDesignation
                   where patient_id == this.patient_id and status == ACTIVE
      # ranking expression
      order by hierarchy_rank ASC
      # tie-break
      then by created_at ASC
      lawful_surrogate = first(candidates)

      lawful_decision_maker =
          PATIENT   when Patient.capacity_status == HAS_CAPACITY
          lawful_surrogate when Patient.capacity_status == LACKS_CAPACITY

      # empty-pool fallback
      when Patient.capacity_status == LACKS_CAPACITY and candidates is empty
          -> ERR_SURROGATE_HIERARCHY_EMPTY
    input_set: "SurrogateDesignation rows for this patient with status ACTIVE. Rows with status PROPOSED or REVOKED never enter the candidate set."
    constants:
      SURROGATE_RANK_HEALTHCARE_AGENT: 1
      SURROGATE_RANK_SPOUSE: 2
      SURROGATE_RANK_ADULT_CHILD: 3
      SURROGATE_RANK_PARENT: 4
      SURROGATE_RANK_SIBLING: 5
    precision: "exact integer comparison on hierarchy_rank; created_at ASC breaks ties; SurrogateDesignation.id is never consulted"
    note: "When Patient.capacity_status is HAS_CAPACITY the patient consents personally and decision_maker_id MUST be omitted; supplying one yields ERR_NOT_AUTHORIZED_DECISION_MAKER. When capacity_status is LACKS_CAPACITY and decision_maker_id is supplied, it must equal lawful_surrogate.id or the call yields ERR_NOT_AUTHORIZED_DECISION_MAKER."

  - name: hospice_benefit_period_schedule
    trigger: "POST /palliative/hospice-elections/{id}/periods"
    algorithm: chronological
    formula: |
      new_period_number = current_period_number + 1
      period_length_days =
          BENEFIT_PERIOD_1_DAYS          when new_period_number == 1
          BENEFIT_PERIOD_2_DAYS          when new_period_number == 2
          BENEFIT_PERIOD_SUBSEQUENT_DAYS when new_period_number >= 3

      current_period_start = period_start supplied on the request
      current_period_end   = current_period_start + period_length_days days
      # the period is HALF-OPEN [current_period_start, current_period_end)

      cumulative_benefit_days = cumulative_benefit_days + period_length_days

      face_to_face_required = new_period_number >= FACE_TO_FACE_MIN_PERIOD_NUMBER
      face_to_face_valid =
          (current_period_start - FACE_TO_FACE_WINDOW_DAYS days) <= face_to_face_at
          and face_to_face_at < current_period_start
    input_set: "The single HospiceElection row plus the period_start and optional face_to_face_at supplied on the request."
    constants:
      BENEFIT_PERIOD_1_DAYS: 90
      BENEFIT_PERIOD_2_DAYS: 90
      BENEFIT_PERIOD_SUBSEQUENT_DAYS: 60
      FACE_TO_FACE_MIN_PERIOD_NUMBER: 3
      FACE_TO_FACE_WINDOW_DAYS: 30
    precision: "whole days; current_period_end is rendered in DATETIME_RENDER_FORMAT"
    note: "Two 90-day periods then unlimited 60-day periods. The face-to-face window's lower edge is INCLUSIVE (exactly 30 days before period_start is valid) and its upper edge is EXCLUSIVE (an encounter at exactly period_start is invalid). period_start must be at or after the outgoing current_period_end."

  - name: dme_inventory_ledger
    trigger: "Every DmeOrder create, fulfillment DELIVERED, and close"
    algorithm: waterfall_allocation
    formula: |
      # CONSERVATION INVARIANT (must hold after every one of the four moves):
      #   total_units == available_units + reserved_units + delivered_units
      create order      : available_units -= quantity ; reserved_units  += quantity
      fulfillment DELIVERED : reserved_units  -= quantity ; delivered_units += quantity
      close CANCELLED   : reserved_units  -= quantity ; available_units += quantity
      close RETURNED or PICKED_UP_ON_DISCHARGE :
                          delivered_units -= quantity ; available_units += quantity

      # availability gate at create time
      accept when available_units >= quantity   # INCLUSIVE
      reject with ERR_INSUFFICIENT_INVENTORY otherwise
    input_set: "The single DmeInventoryItem row named by DmeOrder.inventory_item_id."
    constants: {}
    precision: "integer units; no rounding"
    note: "Conserved quantity number 1 of 3. A create followed by its compensating close CANCELLED leaves all three counters exactly where they started."

  - name: idt_cadence_compliance
    trigger: "POST /palliative/hospice-elections/{id}/periods"
    algorithm: threshold
    formula: |
      last_idt_at = max(CareConference.held_at
                        for c in CareConference
                        where c.patient_id == this.patient_id
                          and c.conference_type == IDT
                          and c.status == ATTESTED)
      days_since_last_idt = floor((current_utc - last_idt_at) / 86400 seconds)
      compliant = (last_idt_at is not null)
                  and (days_since_last_idt <= IDT_CADENCE_MAX_DAYS)
    input_set: "CareConference rows for this patient with conference_type IDT and status ATTESTED. Conferences in SCHEDULED, HELD, QUORUM_FAILED or CONSENT_INVALIDATED are excluded, so a held-but-unattested IDT does not restore cadence."
    constants:
      IDT_CADENCE_MAX_DAYS: 15
    precision: "whole days, floor; the comparison is <= and therefore INCLUSIVE at exactly IDT_CADENCE_MAX_DAYS"
    note: "The aggregate is a max over held_at, which is unique per conference because held_at is stamped from the logical clock; no tie-break is required. When the patient has no ATTESTED IDT conference at all, compliant is false and the period call fails with ERR_IDT_CADENCE_LAPSED."

  - name: escalation_tier_deadline
    trigger: "POST /palliative/escalations and every POST /palliative/escalations/{id}/promote"
    algorithm: threshold
    formula: |
      sla_minutes = ESCALATION_ACK_SLA_MINUTES_TIER_1 when tier == 1
                    ESCALATION_ACK_SLA_MINUTES_TIER_2 when tier == 2
                    ESCALATION_ACK_SLA_MINUTES_TIER_3 when tier == 3
      ack_due_at = tier_notified_at + sla_minutes minutes
      promotion_allowed = (current_utc >= ack_due_at) and (tier < ESCALATION_TIER_MAX)
    input_set: "The single OnCallEscalation row."
    constants:
      ESCALATION_TIER_MIN: 1
      ESCALATION_TIER_MAX: 3
      ESCALATION_ACK_SLA_MINUTES_TIER_1: 15
      ESCALATION_ACK_SLA_MINUTES_TIER_2: 30
      ESCALATION_ACK_SLA_MINUTES_TIER_3: 60
    precision: "ack_due_at is rendered in DATETIME_RENDER_FORMAT"
    note: "The promotion clock check is INCLUSIVE: the current logical clock exactly equal to ack_due_at permits promotion; one second earlier does not. tier == ESCALATION_TIER_MAX has no promote transition."

  - name: patient_active_daily_mme
    trigger: "Recomputed on every MedicationOrder transition into or out of status ACTIVE"
    algorithm: aggregation
    formula: |
      # CONSERVATION INVARIANT (must hold after every medication transition):
      Patient.active_daily_mme
        == sum(o.mme_daily for o in MedicationOrder
               where o.patient_id == Patient.id and o.status == ACTIVE)
    input_set: "MedicationOrder rows for this patient with status exactly ACTIVE. Rows in PENDING_VERIFICATION, REVIEW_REQUIRED and DISCONTINUED contribute zero."
    constants: {}
    precision: "one decimal place; the sum of one-decimal terms needs no further rounding"
    note: "Conserved quantity number 2 of 3. Verifying an order and then discontinuing it must return active_daily_mme to exactly its prior value with no drift."

  - name: patient_acp_minutes_claimed
    trigger: "Recomputed on every AcpBillingClaim transition into or out of status SUBMITTED or PAID"
    algorithm: aggregation
    formula: |
      # CONSERVATION INVARIANT (must hold after every claim transition):
      Patient.acp_minutes_claimed
        == sum(c.documented_minutes for c in AcpBillingClaim
               where c.patient_id == Patient.id and c.status in {SUBMITTED, PAID})
      Patient.acp_paid_cents_ytd
        == sum(c.net_payable_cents for c in AcpBillingClaim
               where c.patient_id == Patient.id and c.status == PAID)
    input_set: "AcpBillingClaim rows for this patient. Rows in DRAFT, ATTESTED and DENIED contribute zero to acp_minutes_claimed; only PAID rows contribute to acp_paid_cents_ytd."
    constants: {}
    precision: "integer minutes and integer cents; no rounding"
    note: "Conserved quantity number 3 of 3. Submitting a claim and then having it DENIED must return acp_minutes_claimed to exactly its prior value."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table  (31 rungs, evaluated strictly in priority order;
#     the FIRST rung that fails determines the response error_id)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a role declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the request path resolves to an existing row, validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: business_constraint
    check: "Request body shape: every required field is present; every field has the declared type; every enum-typed field carries a declared member; every bounded numeric field is inside its declared range; every datetime pair satisfies its ordering rule (scheduled_end strictly after scheduled_start, delivery_window_end strictly after delivery_window_start). Enum-membership failures are reported with this same error_id, not a separate enum code."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: existence
    check: "Every foreign-key id supplied in the request body resolves to an existing row of the declared parent entity"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /palliative/referrals, POST /palliative/surrogates, POST /palliative/advance-care-documents, POST /palliative/code-status-orders, POST /palliative/care-plans, POST /palliative/symptom-assessments, POST /palliative/conferences, POST /palliative/conferences/{id}/hold, POST /palliative/medication-orders, POST /palliative/dme-orders, POST /palliative/hospice-elections, POST /palliative/escalations, POST /palliative/claims"

  - priority: 6
    category: business_safety
    check: "GLOBAL WRITE GATE - when the patient reached by this request has records_frozen == true, the request is rejected. Exactly five write operations remain permitted after death: POST /palliative/dme-orders/{id}/close, POST /palliative/conferences/{id}/attestations, POST /palliative/claims/{id}/attest, POST /palliative/claims/{id}/submit and POST /palliative/claims/{id}/adjudicate. Every other write, and every rung below this one, is unreachable on a frozen patient."
    error_id: ERR_RECORD_FROZEN
    http_status: 409
    applies_to: "all write endpoints except the five bereavement, pickup and final-documentation operations named in the check"

  - priority: 7
    category: state
    check: "The target row is in a from-state that the requested transition declares. Four endpoints deliberately declare a WIDER from-state set here so that a more specific rung below can fire: POST /palliative/medication-orders/{id}/refills accepts {ACTIVE, REVIEW_REQUIRED}; POST /palliative/dme-orders/{id}/fulfillment with event SCHEDULED accepts {REQUESTED, PENDING_AUTH}; POST /palliative/conferences/{id}/attestations accepts {HELD, QUORUM_FAILED}; POST /palliative/advance-care-documents/{id}/execute accepts {DRAFT, PENDING_EXECUTION}. Without these four widenings the generic state rung would permanently mask rungs 12, 13, 18, 22 and 24."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 8
    category: state
    check: "The supplied expected_patient_version, expected_care_plan_version or expected_election_version equals the current version of the named parent row"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /palliative/advance-care-documents/{id}/execute uses ERR_STALE_PATIENT_VERSION; POST /palliative/care-plans/{id}/revisions uses ERR_STALE_CARE_PLAN_VERSION; POST /palliative/hospice-elections/{id}/periods uses ERR_STALE_ELECTION_VERSION"

  - priority: 9
    category: business_constraint
    check: "A decision of ACCEPT requires Referral.triage_score >= REFERRAL_ACCEPT_MIN_SCORE (inclusive)"
    error_id: ERR_REFERRAL_INELIGIBLE
    http_status: 422
    applies_to: "POST /palliative/referrals/{id}/decision"

  - priority: 10
    category: business_constraint
    check: "A decision of RE_REFER requires Referral.re_referral_count < MAX_REREFERRALS (strict)"
    error_id: ERR_REREFERRAL_LIMIT
    http_status: 409
    applies_to: "POST /palliative/referrals/{id}/decision"

  - priority: 11
    category: business_safety
    check: "SEGREGATION OF DUTIES - a signature with signature_type WITNESS is rejected when signer_user_id equals Patient.attending_clinician_user_id, or equals the person_user_id of any SurrogateDesignation for this patient whose status is in {PROPOSED, ACTIVE}, or equals the person_user_id of any SurrogateDesignation for this patient whose is_beneficiary is true regardless of status"
    error_id: ERR_WITNESS_CONFLICT
    http_status: 422
    applies_to: "POST /palliative/advance-care-documents/{id}/signatures"

  - priority: 12
    category: business_safety
    check: "The jurisdiction execution requirement is satisfied - JUR_TWO_WITNESS needs witness_signature_count >= WITNESS_COUNT_REQUIRED_TWO_WITNESS, JUR_NOTARY needs notary_signature_count >= NOTARY_COUNT_REQUIRED_NOTARY (both inclusive)"
    error_id: ERR_EXECUTION_REQUIREMENT_UNMET
    http_status: 422
    applies_to: "POST /palliative/advance-care-documents/{id}/execute"

  - priority: 13
    category: business_referential
    check: "A document with document_type POLST additionally carries physician_signature_count >= POLST_PHYSICIAN_SIGNATURE_REQUIRED and patient_or_surrogate_signature_count >= POLST_PATIENT_OR_SURROGATE_SIGNATURE_REQUIRED"
    error_id: ERR_SIGNATURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /palliative/advance-care-documents/{id}/execute"

  - priority: 14
    category: business_safety
    check: "CODE STATUS LADDER - the absolute difference between the ladder rank of requested_code_status and the ladder rank of prior_code_status is at most MAX_LADDER_STEP_PER_ORDER; and any RE_ESCALATION (requested rank strictly lower than prior rank) additionally requires Patient.capacity_status == HAS_CAPACITY and surrogate_stated == false"
    error_id: ERR_CODE_STATUS_LADDER_VIOLATION
    http_status: 422
    applies_to: "POST /palliative/code-status-orders/{id}/attestations"

  - priority: 15
    category: business_safety
    check: "An attestation against an order in CONFLICT_HOLD must carry a non-empty conflict_resolution_note"
    error_id: ERR_GOALS_CONFLICT
    http_status: 409
    applies_to: "POST /palliative/code-status-orders/{id}/attestations"

  - priority: 16
    category: business_referential
    check: "For a FAMILY conference held while Patient.capacity_status == LACKS_CAPACITY with decision_maker_id omitted, the candidate pool of SurrogateDesignation rows with status ACTIVE is non-empty"
    error_id: ERR_SURROGATE_HIERARCHY_EMPTY
    http_status: 422
    applies_to: "POST /palliative/conferences/{id}/hold"

  - priority: 17
    category: business_safety
    check: "When decision_maker_id IS supplied it must equal the id of the highest-ranked ACTIVE SurrogateDesignation resolved by calculations.surrogate_authority_selection, and Patient.capacity_status must be LACKS_CAPACITY; supplying a decision_maker_id while the patient HAS_CAPACITY, or naming any surrogate other than the top-ranked one, is rejected"
    error_id: ERR_NOT_AUTHORIZED_DECISION_MAKER
    http_status: 422
    applies_to: "POST /palliative/conferences/{id}/hold"

  - priority: 18
    category: business_constraint
    check: "An attestation is only accepted on a conference whose quorum outcome was recorded - a conference in QUORUM_FAILED is rejected here rather than at rung 7"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /palliative/conferences/{id}/attestations"

  - priority: 19
    category: business_temporal
    check: "The current logical clock is at or before CareConference.attestation_due_at (inclusive at exactly attestation_due_at)"
    error_id: ERR_ATTESTATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /palliative/conferences/{id}/attestations"

  - priority: 20
    category: business_safety
    check: "SEGREGATION OF DUTIES - X-User-ID differs from MedicationOrder.prescriber_user_id for both attestation_type VERIFICATION and attestation_type MME_REVIEW"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /palliative/medication-orders/{id}/attestations"

  - priority: 21
    category: business_safety
    check: "SEGREGATION OF DUTIES - the second hospice certification's X-User-ID differs from HospiceElection.attending_certifier_user_id"
    error_id: ERR_DUPLICATE_CERTIFIER
    http_status: 422
    applies_to: "POST /palliative/hospice-elections/{id}/certifications"

  - priority: 22
    category: business_safety
    check: "A refill against an order whose status is REVIEW_REQUIRED is rejected until a physician MME_REVIEW attestation returns the order to ACTIVE"
    error_id: ERR_MME_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /palliative/medication-orders/{id}/refills"

  - priority: 23
    category: business_temporal
    check: "The current logical clock is at or after MedicationOrder.next_refill_allowed_at (inclusive at exactly next_refill_allowed_at)"
    error_id: ERR_EARLY_REFILL
    http_status: 422
    applies_to: "POST /palliative/medication-orders/{id}/refills"

  - priority: 24
    category: business_referential
    check: "A fulfillment event of SCHEDULED against an order still in PENDING_AUTH is rejected until POST /palliative/dme-orders/{id}/authorize records a prior_auth_reference"
    error_id: ERR_PRIOR_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /palliative/dme-orders/{id}/fulfillment"

  - priority: 25
    category: business_temporal
    check: "TEMPORAL OVERLAP, two rules with different interval semantics. (a) DME - the requested [delivery_window_start, delivery_window_end) must not intersect the window of any other DmeOrder on the same inventory_item_id whose status is in {REQUESTED, PENDING_AUTH, SCHEDULED, DELIVERED}; the interval is HALF-OPEN so back-to-back windows that touch at a single instant are accepted. (b) Conference - a new CareConference on the same patient_id must leave a gap of at least CONFERENCE_BUFFER_MINUTES from every other conference whose status is in {SCHEDULED, HELD, ATTESTED}; formally it is rejected when new_start < existing_end + CONFERENCE_BUFFER_MINUTES AND existing_start < new_end + CONFERENCE_BUFFER_MINUTES, so a gap of exactly CONFERENCE_BUFFER_MINUTES is accepted and a gap of one minute less is rejected."
    error_id: ERR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /palliative/dme-orders/{id}/fulfillment (rule a) and POST /palliative/conferences (rule b)"

  - priority: 26
    category: business_constraint
    check: "DmeInventoryItem.available_units >= the requested quantity (inclusive - a request for exactly the remaining units succeeds)"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /palliative/dme-orders"

  - priority: 27
    category: business_constraint
    check: "calculations.idt_cadence_compliance is true - the patient has at least one CareConference with conference_type IDT and status ATTESTED whose held_at is within IDT_CADENCE_MAX_DAYS of the current logical clock (inclusive at exactly IDT_CADENCE_MAX_DAYS)"
    error_id: ERR_IDT_CADENCE_LAPSED
    http_status: 422
    applies_to: "POST /palliative/hospice-elections/{id}/periods"

  - priority: 28
    category: business_temporal
    check: "When the new benefit period number is >= FACE_TO_FACE_MIN_PERIOD_NUMBER, face_to_face_at is supplied and satisfies period_start - FACE_TO_FACE_WINDOW_DAYS days <= face_to_face_at < period_start (lower edge inclusive, upper edge exclusive)"
    error_id: ERR_FACE_TO_FACE_WINDOW
    http_status: 422
    applies_to: "POST /palliative/hospice-elections/{id}/periods"

  - priority: 29
    category: business_fiscal
    check: "documented_minutes >= ACP_FIRST_UNIT_MIN_MINUTES (inclusive - exactly 16 minutes is billable, 15 is not)"
    error_id: ERR_INSUFFICIENT_DOCUMENTED_TIME
    http_status: 422
    applies_to: "POST /palliative/claims"

  - priority: 30
    category: business_fiscal
    check: "A claim whose service_date falls inside the half-open [current_period_start, current_period_end) of a HospiceElection with status ELECTED for the same patient is rejected unless BOTH the claim's concurrent_care_carve_out and that election's concurrent_care_carve_out are true, so the same service is never counted twice"
    error_id: ERR_CONCURRENT_CARE_OVERLAP
    http_status: 409
    applies_to: "POST /palliative/claims"

  - priority: 31
    category: business_fiscal
    check: "DOCUMENTATION ATTESTATION GATE - when AcpBillingClaim.conference_id is non-null, that CareConference must have attestation_complete == true before the claim may be attested"
    error_id: ERR_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /palliative/claims/{id}/attest"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table  (65 endpoints)
# ---------------------------------------------------------------------------
endpoints:
  # ---- Patient ------------------------------------------------------------
  - method: POST
    path: "/palliative/patients"
    description: "Register a patient record ahead of referral triage."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [mrn, full_name, date_of_birth, jurisdiction_code, attending_clinician_user_id, "opioid_status?"]
    output: Patient
    side_effects:
      - "Creates the patient in program_status REFERRED, capacity_status HAS_CAPACITY, code_status FULL_CODE, code_status_rank 1, records_frozen false, active_daily_mme 0, acp_minutes_claimed 0, acp_paid_cents_ytd 0, open_symptom_count 0, version 1"

  - method: POST
    path: "/palliative/patients/{id}/capacity-determinations"
    description: "Record a capacity determination, which may change who may lawfully consent. capacity_status is one of HAS_CAPACITY, LACKS_CAPACITY."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 200
    input: [capacity_status, determination_note]
    output: Patient
    side_effects:
      - "Sets Patient.capacity_status and increments Patient.version by 1"
      - "CAPACITY CASCADE HOP 2 - every FAMILY CareConference for this patient with consent_recorded true and status in {HELD, ATTESTED} whose recorded decision_maker_kind no longer matches the lawful decision maker resolved by calculations.surrogate_authority_selection transitions to CONSENT_INVALIDATED with consent_recorded false"
      - "CAPACITY CASCADE HOP 3 - because that conference's consent was invalidated, every CodeStatusOrder for this patient with status EFFECTIVE and surrogate_stated true transitions to SUPERSEDED and Patient.code_status reverts to the stated_code_status of the patient's most recently executed AdvanceCareDocument with status EXECUTED ordered by executed_at descending and tie-broken by created_at ascending, or FULL_CODE when none exists"
      - "CAPACITY CASCADE HOP 4 - because Patient.code_status changed, every CodeStatusOrder for this patient with status in {DRAFT, ATTESTED} transitions to CONFLICT_HOLD"
      - "Parallel leg - every AcpBillingClaim whose conference_id names an invalidated conference and whose status is in {DRAFT, ATTESTED} returns to DRAFT with documentation_attested false and attested_by_user_id null"

  - method: POST
    path: "/palliative/patients/{id}/death-events"
    description: "Record the patient's death. Freezes the record program-wide and runs the five-hop closure cascade."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 200
    input: [pronouncing_clinician_user_id]
    output: Patient
    side_effects:
      - "Sets program_status DECEASED, records_frozen true and deceased_at to the current logical clock; increments Patient.version by 1"
      - "DEATH CASCADE HOPS 1 through 5 as declared on the Patient state machine"

  # ---- Referral -----------------------------------------------------------
  - method: POST
    path: "/palliative/referrals"
    description: "Open a referral and score it with calculations.referral_triage_score."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 201
    input: [patient_id, source, prognosis_months, serious_illness_criteria_count]
    output: Referral
    side_effects:
      - "Computes triage_variant and triage_score; creates the referral in status RECEIVED with re_referral_count 0"

  - method: POST
    path: "/palliative/referrals/{id}/decision"
    description: "Decide a referral. decision is one of ACCEPT, DECLINE, RE_REFER; decline_reason_code is required when decision is DECLINE and is ignored otherwise."
    roles: [IntakeCoordinator, ProgramAdmin]
    code: 200
    input: [decision, "decline_reason_code?"]
    output: Referral
    side_effects:
      - "decision ACCEPT moves the referral to ACCEPTED and the patient to program_status ACTIVE, incrementing Patient.version by 1"
      - "decision DECLINE moves the referral to DECLINED and stores decline_reason_code"
      - "decision RE_REFER returns the referral to RECEIVED, increments re_referral_count by 1, clears decline_reason_code and recomputes triage_score"

  # ---- SurrogateDesignation ----------------------------------------------
  - method: POST
    path: "/palliative/surrogates"
    description: "Designate a potential decision maker; hierarchy_rank is derived from relationship."
    roles: [SocialWorker, ProgramAdmin]
    code: 201
    input: [patient_id, person_user_id, person_name, relationship, "is_beneficiary?"]
    output: SurrogateDesignation
    side_effects:
      - "Creates the designation in status PROPOSED with hierarchy_rank derived from relationship"

  - method: POST
    path: "/palliative/surrogates/{id}/status"
    description: "Activate or revoke a surrogate designation. target_status is one of ACTIVE, REVOKED."
    roles: [SocialWorker, ProgramAdmin]
    code: 200
    input: [target_status]
    output: SurrogateDesignation
    side_effects:
      - "target_status ACTIVE puts the designation into the authority candidate pool; target_status REVOKED removes it"

  # ---- AdvanceCareDocument -----------------------------------------------
  - method: POST
    path: "/palliative/advance-care-documents"
    description: "Draft a living will, healthcare proxy or POLST for a patient."
    roles: [SocialWorker, PalliativePhysician, ProgramAdmin]
    code: 201
    input: [patient_id, document_type, stated_code_status, "supersedes_document_id?"]
    output: AdvanceCareDocument
    side_effects:
      - "Creates the document in status DRAFT with all four signature counters at 0, execution_ready false and an empty signature_log"

  - method: POST
    path: "/palliative/advance-care-documents/{id}/signatures"
    description: "Append one signature. signature_type is one of WITNESS, NOTARY, SIGNING_PHYSICIAN, PATIENT_OR_SURROGATE."
    roles: [SocialWorker, PalliativePhysician, Caregiver, ProgramAdmin]
    code: 200
    input: [signature_type, signer_user_id]
    output: AdvanceCareDocument
    side_effects:
      - "Appends to signature_log, increments the matching counter and recomputes execution_ready by calculations.document_execution_requirement"
      - "Moves the document from DRAFT to PENDING_EXECUTION on the signature that makes execution_ready true"

  - method: POST
    path: "/palliative/advance-care-documents/{id}/execute"
    description: "Execute a document that has met its jurisdiction requirement. OCC-guarded on the patient."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 200
    input: [expected_patient_version]
    output: AdvanceCareDocument
    side_effects:
      - "Sets executed_at and reattest_due_at; moves the document to EXECUTED"
      - "increments Patient.version by 1"
      - "DOCUMENT CASCADE HOPS 1 through 4 as declared on the AdvanceCareDocument state machine"

  - method: POST
    path: "/palliative/advance-care-documents/{id}/revoke"
    description: "Revoke an executed document."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 200
    input: [revocation_reason]
    output: AdvanceCareDocument
    side_effects:
      - "Moves the document to REVOKED, supersedes the CodeStatusOrder rows that cited it and rewrites Patient.code_status"

  # ---- CodeStatusOrder ----------------------------------------------------
  - method: POST
    path: "/palliative/code-status-orders"
    description: "Draft a goals-of-care order proposing a new position on the code-status ladder."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 201
    input: [patient_id, requested_code_status, "source_document_id?", "surrogate_stated?", "patient_prior_statement?"]
    output: CodeStatusOrder
    side_effects:
      - "Captures prior_code_status from Patient.code_status, derives ladder_direction and creates the order in status DRAFT with attestation_count 0"

  - method: POST
    path: "/palliative/code-status-orders/{id}/attestations"
    description: "Attest a code-status order. attestation_role is CLINICIAN or PATIENT_OR_SURROGATE; two distinct roles are required to make the order EFFECTIVE."
    roles: [PalliativePhysician, SocialWorker, Caregiver, ProgramAdmin]
    code: 200
    input: [attestation_role, attestation_text, "conflict_resolution_note?"]
    output: CodeStatusOrder
    side_effects:
      - "First attestation moves DRAFT to ATTESTED, or to CONFLICT_HOLD when surrogate-stated wishes contradict patient_prior_statement"
      - "An attestation carrying conflict_resolution_note moves CONFLICT_HOLD back to ATTESTED"
      - "The second, differently-roled attestation moves ATTESTED to EFFECTIVE, supersedes the patient's other EFFECTIVE orders, rewrites Patient.code_status and code_status_rank and increments Patient.version by 1"

  # ---- CarePlan -----------------------------------------------------------
  - method: POST
    path: "/palliative/care-plans"
    description: "Create a symptom care plan for an enrolled patient."
    roles: [PalliativeNurse, SocialWorker, ProgramAdmin]
    code: 201
    input: [patient_id, plan_title, problem_list]
    output: CarePlan
    side_effects:
      - "Creates the plan in status DRAFT with revision_number 0 and version 1"

  - method: POST
    path: "/palliative/care-plans/{id}/activate"
    description: "Activate a DRAFT plan, or return an UNDER_REVISION plan to ACTIVE."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 200
    input: ["activation_note?"]
    output: CarePlan
    side_effects:
      - "DRAFT to ACTIVE leaves revision_number at 0; UNDER_REVISION to ACTIVE increments revision_number by 1"
      - "increments CarePlan.version by 1"

  - method: POST
    path: "/palliative/care-plans/{id}/revisions"
    description: "Open a revision on an ACTIVE plan, replacing its problem list. OCC-guarded on the plan."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 200
    input: [expected_care_plan_version, revised_problem_list]
    output: CarePlan
    side_effects:
      - "Moves the plan to UNDER_REVISION and replaces problem_list with revised_problem_list"
      - "increments CarePlan.version by 1"

  # ---- SymptomAssessment --------------------------------------------------
  - method: POST
    path: "/palliative/symptom-assessments"
    description: "File a five-item symptom assessment against an ACTIVE care plan."
    roles: [PalliativeNurse, Caregiver, ProgramAdmin]
    code: 201
    input: [patient_id, care_plan_id, reporter_type, item_pain, item_dyspnea, item_nausea, item_anxiety, item_fatigue]
    output: SymptomAssessment
    side_effects:
      - "Runs calculations.symptom_distress_score then calculations.symptom_response_due_at, stamping distress_score, severity_tier and response_due_at"
      - "Creates the row with triage_status OPEN and escalation_status NONE and increments Patient.open_symptom_count by 1"

  - method: POST
    path: "/palliative/symptom-assessments/{id}/triage-update"
    description: "Advance the triage axis. action is ACKNOWLEDGE or RESOLVE."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 200
    input: [action, "triage_note?"]
    output: SymptomAssessment
    side_effects:
      - "action ACKNOWLEDGE moves triage_status OPEN to ACKNOWLEDGED without touching escalation_status"
      - "action RESOLVE moves triage_status ACKNOWLEDGED to RESOLVED, stamps resolution_reason, decrements Patient.open_symptom_count by 1 and closes any DISPOSITIONED OnCallEscalation on this assessment"

  # ---- CareConference -----------------------------------------------------
  - method: POST
    path: "/palliative/conferences"
    description: "Book an interdisciplinary or family conference on the patient's calendar."
    roles: [SocialWorker, ProgramAdmin]
    code: 201
    input: [patient_id, conference_type, modality, scheduled_start, scheduled_end]
    output: CareConference
    side_effects:
      - "Applies the CONFERENCE_BUFFER_MINUTES overlap rule against the patient's other conferences in {SCHEDULED, HELD, ATTESTED}"
      - "Creates the conference in status SCHEDULED with quorum_met false, attestation_complete false and consent_recorded false"

  - method: POST
    path: "/palliative/conferences/{id}/hold"
    description: "Hold the conference. IDT conferences supply disciplines_present, each member one of PHYSICIAN, NURSE, SOCIAL_WORKER, CHAPLAIN; FAMILY conferences may supply decision_maker_id or let the server resolve the lawful surrogate."
    roles: [SocialWorker, ProgramAdmin]
    code: 200
    input: [documented_minutes, "disciplines_present?", "decision_maker_id?"]
    output: CareConference
    side_effects:
      - "IDT with full quorum moves SCHEDULED or QUORUM_FAILED to HELD, stamping held_at, attestation_due_at and quorum_met true"
      - "IDT short of quorum moves SCHEDULED to QUORUM_FAILED, or re-records the roster on an already QUORUM_FAILED conference"
      - "FAMILY resolves the lawful decision maker by calculations.surrogate_authority_selection, stamps decision_maker_kind and sets consent_recorded true"

  - method: POST
    path: "/palliative/conferences/{id}/attestations"
    description: "Record one discipline's note attestation inside the attestation window. discipline is one of PHYSICIAN, NURSE, SOCIAL_WORKER, CHAPLAIN. Permitted after patient death as final documentation."
    roles: [PalliativePhysician, PalliativeNurse, SocialWorker, Chaplain, ProgramAdmin]
    code: 200
    input: [discipline, note_text]
    output: CareConference
    side_effects:
      - "Appends the discipline to attested_disciplines and recomputes attestation_complete"
      - "Moves the conference to ATTESTED once attested_disciplines covers disciplines_present"

  # ---- MedicationOrder ----------------------------------------------------
  - method: POST
    path: "/palliative/medication-orders"
    description: "Order a controlled analgesic. The acting user becomes prescriber_user_id and may not verify the order."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 201
    input: [patient_id, drug, dose_amount, days_supply, "breakthrough_drug?"]
    output: MedicationOrder
    side_effects:
      - "Stamps prescriber_user_id from X-User-ID; runs calculations.medication_daily_mme to set mme_variant and mme_daily"
      - "Creates the order in status PENDING_VERIFICATION with refill_count 0 and mme_review_count 0"

  - method: POST
    path: "/palliative/medication-orders/{id}/attestations"
    description: "Second-clinician attestation. attestation_type is VERIFICATION or MME_REVIEW."
    roles: [PalliativeNurse, PalliativePhysician, ProgramAdmin]
    code: 200
    input: [attestation_type, "attestation_note?"]
    output: MedicationOrder
    side_effects:
      - "VERIFICATION moves PENDING_VERIFICATION to ACTIVE, or to REVIEW_REQUIRED when the patient would reach MME_REVIEW_THRESHOLD"
      - "MME_REVIEW moves REVIEW_REQUIRED to ACTIVE and increments mme_review_count by 1"
      - "Entering ACTIVE stamps last_fill_at and next_refill_allowed_at, increases Patient.active_daily_mme by mme_daily and recomputes breakthrough_dose_mg"

  - method: POST
    path: "/palliative/medication-orders/{id}/refills"
    description: "Dispense a refill once the early-refill window has opened."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 200
    input: ["refill_note?"]
    output: MedicationOrder
    side_effects:
      - "Increments refill_count by 1 and re-stamps last_fill_at and next_refill_allowed_at"
      - "When Patient.active_daily_mme is at or above MME_REVIEW_THRESHOLD the order returns to REVIEW_REQUIRED and Patient.active_daily_mme decreases by this order's mme_daily"

  - method: POST
    path: "/palliative/medication-orders/{id}/discontinue"
    description: "Discontinue an order and release its contribution to the patient MME ledger."
    roles: [PalliativePhysician, ProgramAdmin]
    code: 200
    input: [discontinue_reason]
    output: MedicationOrder
    side_effects:
      - "Moves the order to DISCONTINUED and, when it was ACTIVE, decreases Patient.active_daily_mme by exactly its mme_daily"

  # ---- DME ----------------------------------------------------------------
  - method: POST
    path: "/palliative/dme-inventory"
    description: "Stock a durable medical equipment line."
    roles: [ProgramAdmin]
    code: 201
    input: [device_type, total_units, "prior_auth_required?"]
    output: DmeInventoryItem
    side_effects:
      - "Creates the item with available_units equal to total_units, reserved_units 0 and delivered_units 0"

  - method: POST
    path: "/palliative/dme-orders"
    description: "Request equipment for a patient and reserve the units."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 201
    input: [patient_id, inventory_item_id, quantity, delivery_window_start, delivery_window_end]
    output: DmeOrder
    side_effects:
      - "Moves quantity units from available_units to reserved_units on the inventory item"
      - "Opens the order in PENDING_AUTH when the item's prior_auth_required is true, and in REQUESTED otherwise"

  - method: POST
    path: "/palliative/dme-orders/{id}/authorize"
    description: "Record the prior authorization that releases a PENDING_AUTH order."
    roles: [ProgramAdmin]
    code: 200
    input: [prior_auth_reference]
    output: DmeOrder
    side_effects:
      - "Stores prior_auth_reference and moves the order to REQUESTED"

  - method: POST
    path: "/palliative/dme-orders/{id}/fulfillment"
    description: "Advance fulfillment. event is SCHEDULED or DELIVERED."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 200
    input: [event]
    output: DmeOrder
    side_effects:
      - "event SCHEDULED applies the half-open delivery-window overlap rule on the inventory item and moves REQUESTED to SCHEDULED"
      - "event DELIVERED stamps delivered_at and moves quantity units from reserved_units to delivered_units"

  - method: POST
    path: "/palliative/dme-orders/{id}/close"
    description: "Close an order. closed_reason is one of CANCELLED, RETURNED, PICKED_UP_ON_DISCHARGE: CANCELLED releases a reservation while RETURNED and PICKED_UP_ON_DISCHARGE release a delivery. Permitted after patient death."
    roles: [PalliativeNurse, ProgramAdmin]
    code: 200
    input: [closed_reason]
    output: DmeOrder
    side_effects:
      - "CANCELLED moves quantity units from reserved_units back to available_units"
      - "RETURNED and PICKED_UP_ON_DISCHARGE move quantity units from delivered_units back to available_units"

  # ---- HospiceElection ----------------------------------------------------
  - method: POST
    path: "/palliative/hospice-elections"
    description: "Open a hospice election record awaiting two physician certifications."
    roles: [PalliativePhysician, HospiceMedicalDirector, ProgramAdmin]
    code: 201
    input: [patient_id, "concurrent_care_carve_out?"]
    output: HospiceElection
    side_effects:
      - "Creates the election in status PENDING_CERT with certification_count 0, current_period_number 0, cumulative_benefit_days 0, revocation_count 0 and version 1"

  - method: POST
    path: "/palliative/hospice-elections/{id}/certifications"
    description: "Certify terminal illness. Two distinct physician user ids are required to reach CERTIFIED."
    roles: [PalliativePhysician, HospiceMedicalDirector, ProgramAdmin]
    code: 200
    input: [terminal_diagnosis_code]
    output: HospiceElection
    side_effects:
      - "First certification stamps attending_certifier_user_id and sets certification_count 1"
      - "Second certification by a different user stamps hospice_director_certifier_user_id, sets certification_count 2 and moves the election to CERTIFIED"
      - "A certification against a REVOKED election restarts the cycle at PENDING_CERT with certification_count 1"

  - method: POST
    path: "/palliative/hospice-elections/{id}/periods"
    description: "Open the next benefit period. OCC-guarded on the election."
    roles: [HospiceMedicalDirector, ProgramAdmin]
    code: 200
    input: [expected_election_version, period_start, "face_to_face_at?"]
    output: HospiceElection
    side_effects:
      - "Runs calculations.idt_cadence_compliance, then calculations.hospice_benefit_period_schedule"
      - "Increments current_period_number by 1, stamps current_period_start and current_period_end and adds the period length to cumulative_benefit_days"
      - "increments HospiceElection.version by 1"
      - "Period 1 moves the election to ELECTED and the patient to program_status HOSPICE_ELECTED, incrementing Patient.version by 1"

  - method: POST
    path: "/palliative/hospice-elections/{id}/revoke"
    description: "Revoke an elected hospice benefit and return the patient to the palliative program."
    roles: [HospiceMedicalDirector, ProgramAdmin]
    code: 200
    input: [revocation_reason]
    output: HospiceElection
    side_effects:
      - "Moves the election to REVOKED, increments revocation_count by 1, returns Patient.program_status to ACTIVE and increments Patient.version by 1"

  # ---- OnCallEscalation ---------------------------------------------------
  - method: POST
    path: "/palliative/escalations"
    description: "Open an after-hours escalation against a symptom assessment at tier 1."
    roles: [OnCallClinician, PalliativeNurse, ProgramAdmin]
    code: 201
    input: [patient_id, symptom_assessment_id, contact_summary]
    output: OnCallEscalation
    side_effects:
      - "Creates the escalation in status TIER_NOTIFIED at tier ESCALATION_TIER_MIN, stamping tier_notified_at and ack_due_at"
      - "Sets the linked SymptomAssessment.escalation_status to ESCALATED without touching its triage_status"

  - method: POST
    path: "/palliative/escalations/{id}/promote"
    description: "Promote an unacknowledged escalation to the next on-call tier once its acknowledgment SLA has elapsed."
    roles: [OnCallClinician, ProgramAdmin]
    code: 200
    input: ["promotion_note?"]
    output: OnCallEscalation
    side_effects:
      - "Increments tier by 1, re-stamps tier_notified_at and recomputes ack_due_at from the new tier's SLA"

  - method: POST
    path: "/palliative/escalations/{id}/response"
    description: "Acknowledge or disposition an escalation. response_type is ACKNOWLEDGE or DISPOSITION."
    roles: [OnCallClinician, ProgramAdmin]
    code: 200
    input: [response_type, "disposition?"]
    output: OnCallEscalation
    side_effects:
      - "ACKNOWLEDGE stamps acknowledged_at and acknowledged_by_user_id and moves the escalation to ACKNOWLEDGED"
      - "DISPOSITION stores the disposition, moves the escalation to DISPOSITIONED and sets the linked SymptomAssessment.escalation_status to DISPOSITIONED"

  # ---- AcpBillingClaim ----------------------------------------------------
  - method: POST
    path: "/palliative/claims"
    description: "Create a time-based advance-care-planning claim."
    roles: [BillingSpecialist, ProgramAdmin]
    code: 201
    input: [patient_id, service_date, documented_minutes, modality, "conference_id?", "concurrent_care_carve_out?"]
    output: AcpBillingClaim
    side_effects:
      - "Runs calculations.acp_billable_units, then calculations.claim_allowed_amount_cents, then calculations.claim_net_payable_cents in that pinned order"
      - "Creates the claim in status DRAFT with documentation_attested false"

  - method: POST
    path: "/palliative/claims/{id}/attest"
    description: "Attest the claim's documentation. Permitted after patient death as final documentation."
    roles: [BillingSpecialist, ProgramAdmin]
    code: 200
    input: [attestation_statement]
    output: AcpBillingClaim
    side_effects:
      - "Sets documentation_attested true, stamps attested_by_user_id and moves the claim from DRAFT or DENIED to ATTESTED"

  - method: POST
    path: "/palliative/claims/{id}/submit"
    description: "Submit an attested claim to the payer. Permitted after patient death."
    roles: [BillingSpecialist, ProgramAdmin]
    code: 200
    input: ["submission_note?"]
    output: AcpBillingClaim
    side_effects:
      - "Moves the claim to SUBMITTED and increases Patient.acp_minutes_claimed by documented_minutes"

  - method: POST
    path: "/palliative/claims/{id}/adjudicate"
    description: "Record the payer outcome. outcome is PAID or DENIED; denial_reason is required for DENIED. Permitted after patient death."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome, "denial_reason?"]
    output: AcpBillingClaim
    side_effects:
      - "PAID increases Patient.acp_paid_cents_ytd by net_payable_cents"
      - "DENIED stores denial_reason, clears documentation_attested and attested_by_user_id and decreases Patient.acp_minutes_claimed by exactly documented_minutes"

  # ---- test-driving clock -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time. Every stamped datetime is rendered in DATETIME_RENDER_FORMAT."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Moves the logical clock; no entity rows are mutated"

