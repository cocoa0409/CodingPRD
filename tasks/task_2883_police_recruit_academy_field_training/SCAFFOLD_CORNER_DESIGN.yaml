              as_user_id: "rc-1"
            - call: "GET /recruits/${rec_id}/certification-progress"
              payload: {}
              as: RecordsCustodian
              as_user_id: "rc-1"
          assert:
            - "deliver: HTTP 200 with data.status == 'DELIVERED'"
            - "the immediately following class read, by a RecordsCustodian rather than the writer: data.status == 'IN_SESSION', data.credited_topic_hours_total == 2.00 and data.unmet_topic_hours['PATROL'] == 0.00 - no second call, no retry and no polling loop is needed to see any of it"
            - "the immediately following recruit read: data.credited_hours_total == 2.00, data.per_topic_credited_hours['PATROL'] == 2.00 and data.academy_status == 'COMPLETE' - the parent's own stored fields moved inside the delivery request, not afterwards"
            - "the progress report read in the same instant: data.credited_hours_total == 2.00, data.unmet_topic_hours['PATROL'] == 0.00 and data.eligible_for_certification is computed from the state the delivery just produced - the recomputed view never lags the stored one"
            - "attendance list before the duplicate attempt: meta.total_count == 1 with the single row's ledger_status == 'CREDITED' and credited_hours == 2.00 - the child row was promoted in the same request as the delivery"
            - "the duplicate attendance write: HTTP 409 with data.error_id == 'ERR_ATTENDANCE_ALREADY_RECORDED'"
            - "attendance list after the duplicate attempt: meta.total_count is still 1 - the rejected write left nothing pending that a later read could surface"
            - "class read after the duplicate attempt: data.credited_topic_hours_total is still 2.00 - a rejected call contributes nothing, immediately or eventually"
            - "void-delivery: HTTP 200 with data.status == 'VOIDED'"
            - "the immediately following class read: data.credited_topic_hours_total == 0.00 and data.unmet_topic_hours['PATROL'] == 2.00 - the compensation is applied inside the void request, not deferred to a reconciliation pass"
            - "the immediately following recruit read: data.credited_hours_total == 0.00 and data.academy_status is back to 'IN_PROGRESS'"
            - "the progress report in the same instant: data.credited_hours_total == 0.00 and data.eligible_for_certification == false - stored fields and recomputed report agree at every single point in the sequence"
