# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2165_elevator_service_contract
# Breadth probe over every testable claim §1.1-§1.7 declares that §1.8 does not
# already cover. Sections and claim_type values come from
# references/claim-extraction-guide.md.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_contract_returns_defaults_and_common_fields
        claim_type: Creation
        grounds:
          - entities.ServiceContract
          - endpoints[POST /elevator-program/contracts]
        distinguishing_aspect: "A freshly created contract returns 201 with status DRAFT, version 1, all four penalty ledger fields 0, performance_score null, renegotiation_round_count 0 and cars_out_of_service_count 0."
        test_recipe:
          setup: ["Empty database; logical clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner One", building_address: "1 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c1", contractor_user_id: "sc-c1", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "ServiceContract.${c1_id}.status == \"DRAFT\""
            - "${c1_v} == 1"
            - "ServiceContract.${c1_id}.penalty_lifetime_assessed_cents == 0"
            - "ServiceContract.${c1_id}.penalty_lifetime_waived_cents == 0"
            - "ServiceContract.${c1_id}.penalty_lifetime_credited_cents == 0"
            - "ServiceContract.${c1_id}.penalty_balance_cents == 0"
            - "ServiceContract.${c1_id}.performance_score == null"
            - "ServiceContract.${c1_id}.renegotiation_round_count == 0"
            - "ServiceContract.${c1_id}.cars_out_of_service_count == 0"
            - "ServiceContract.${c1_id}.id matches ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ with no type prefix"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""

      - name: create_contract_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=50]
          - errors[ERR_VALIDATION]
          - endpoints[POST /elevator-program/contracts]
        distinguishing_aspect: "Omitting the required monthly_base_fee_cents field yields 400 ERR_VALIDATION and no ServiceContract row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Two", building_address: "2 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c2", contractor_user_id: "sc-c2", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${e_id} == \"ERR_VALIDATION\""
            - "GET /elevator-program/contracts returns an empty array with total_count == 0"

      - name: create_contract_invalid_enum_scope_type_returns_validation
        claim_type: Type Constraints
        grounds:
          - entities.ServiceContract.fields.scope_type
          - validations[priority=50]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "scope_type accepts only FULL_MAINTENANCE or OIL_AND_GREASE; the undeclared member PARTS_ONLY yields 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Three", building_address: "3 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c3", contractor_user_id: "sc-c3", scope_type: "PARTS_ONLY", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_id2: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "${e_id2} == \"ERR_VALIDATION\""

      - name: create_car_client_supplied_state_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ElevatorCar.fields.availability_state
          - entities.ElevatorCar.fields.compliance_state
          - endpoints[POST /elevator-program/cars]
        distinguishing_aspect: "availability_state and compliance_state are source: system; supplying them in the body is ignored and the car still starts IN_SERVICE / INSPECTION_DUE with version 1."
        test_recipe:
          setup: ["One DRAFT contract."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Four", building_address: "4 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c4", contractor_user_id: "sc-c4", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c4_id: $.data.id }
          trigger:
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c4_id}", car_code: "CAR-C4", car_type: "TRACTION", capacity_lbs: 3000, availability_state: "DECOMMISSIONED", compliance_state: "CERTIFIED" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car4_id: $.data.id, car4_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "ElevatorCar.${car4_id}.availability_state == \"IN_SERVICE\""
            - "ElevatorCar.${car4_id}.compliance_state == \"INSPECTION_DUE\""
            - "ElevatorCar.${car4_id}.scheduled_downtime_minutes == 0"
            - "ElevatorCar.${car4_id}.open_part_order_count == 0"
            - "${car4_v} == 1"

      - name: callback_optional_fields_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Callback.fields.passengers_trapped
          - entities.Callback.fields.out_of_service
          - endpoints[POST /elevator-program/callbacks]
        distinguishing_aspect: "Omitting passengers_trapped and out_of_service applies the declared defaults 0 and true, and the true default immediately pulls the car OUT_OF_SERVICE."
        test_recipe:
          setup: ["One ACTIVE contract with one IN_SERVICE car."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Five", building_address: "5 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c5", contractor_user_id: "sc-c5", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c5_id: $.data.id }
            - call: "POST /elevator-program/contracts/${c5_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c5_id}", car_code: "CAR-C5", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car5_id: $.data.id }
          trigger:
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${car5_id}", callback_type: "MALFUNCTION" }
              as: BuildingManager
              as_user_id: "bm-c5"
              captures: { cb5_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Callback.${cb5_id}.passengers_trapped == 0"
            - "Callback.${cb5_id}.out_of_service == true"
            - "Callback.${cb5_id}.status == \"REPORTED\""
            - "Callback.${cb5_id}.reported_at == \"2026-08-01T00:00:00.000Z\""
            - "Callback.${cb5_id}.response_minutes == null"
            - "ElevatorCar.${car5_id}.availability_state == \"OUT_OF_SERVICE\""
            - "ServiceContract.${c5_id}.cars_out_of_service_count == 1"
            - "ServiceContract.${c5_id}.status == \"ACTIVE\""

      - name: get_contract_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A syntactically valid but unused UUID on GET /contracts/{contractId} yields 404 ERR_CONTRACT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /elevator-program/contracts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_id3: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${e_id3} == \"ERR_CONTRACT_NOT_FOUND\""
            - "response_type == \"error\""

      - name: create_car_under_unknown_contract_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ElevatorCar.fields.contract_id
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A body FK to a non-existent contract is rejected at the existence stage with 404 ERR_CONTRACT_NOT_FOUND before any car row is written."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", car_code: "CAR-GHOST", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_id4: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${e_id4} == \"ERR_CONTRACT_NOT_FOUND\""
            - "GET /elevator-program/cars returns an empty array with total_count == 0"

      - name: list_cars_supports_limit_offset_and_contract_filter
        claim_type: Listing
        grounds:
          - endpoints[GET /elevator-program/cars]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /elevator-program/cars?contract_id=...&limit=2&offset=0 returns exactly 2 of the 3 cars with total_count 3 and has_more true; offset=2 returns 1 with has_more false."
        test_recipe:
          setup: ["One ACTIVE contract with exactly three cars CAR-01, CAR-02, CAR-03."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Six", building_address: "6 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c6", contractor_user_id: "sc-c6", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c6_id: $.data.id }
            - call: "POST /elevator-program/contracts/${c6_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c6_id}", car_code: "CAR-01", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c6_id}", car_code: "CAR-02", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c6_id}", car_code: "CAR-03", car_type: "HYDRAULIC", capacity_lbs: 2000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          trigger:
            - call: "GET /elevator-program/cars"
              payload: { contract_id: "${c6_id}", limit: 2, offset: 0 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /elevator-program/cars"
              payload: { contract_id: "${c6_id}", limit: 2, offset: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "trigger[0] returns exactly 2 ElevatorCar rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger[1] returns exactly 1 ElevatorCar row, total_count == 3, has_more == false, offset == 2"
            - "response_type == \"array\" on both"

      - name: car_computed_certificate_fields_track_posted_certificate
        claim_type: Computed Fields
        grounds:
          - entities.ElevatorCar.fields.current_certificate_number
          - entities.ElevatorCar.fields.certificate_expiry_date
          - calculations.certificate_issuance
        distinguishing_aspect: "current_certificate_number and certificate_expiry_date are null until a certificate is POSTED; after posting they equal CERT-NY-NYC-CAR-C7-20260801 and 2027-08-01."
        test_recipe:
          setup: ["One ACTIVE contract in jurisdiction NY-NYC with one car CAR-C7 that has a SCHEDULED PERIODIC inspection; logical clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Seven", building_address: "7 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c7", contractor_user_id: "sc-c7", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c7_id: $.data.id }
            - call: "POST /elevator-program/contracts/${c7_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c7_id}", car_code: "CAR-C7", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car7_id: $.data.id }
            - call: "POST /elevator-program/inspections"
              payload: { car_id: "${car7_id}", inspection_type: "PERIODIC", scheduled_date: "2026-08-01" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { i7_id: $.data.id }
            - call: "POST /elevator-program/inspections/${i7_id}/record-result"
              payload: { result: "PASS_WITH_DEFICIENCIES", deficiency_codes: ["DOOR-11"] }
              as: StateInspector
              as_user_id: "si-1"
              captures: { cert7_no: $.data.certificate_number }
          trigger:
            - call: "POST /elevator-program/inspections/${i7_id}/post-certificate"
              payload: {}
              as: BuildingManager
              as_user_id: "bm-c7"
          assert:
            - "${cert7_no} == \"CERT-NY-NYC-CAR-C7-20260801\""
            - "StateInspection.${i7_id}.certificate_issued_date == \"2026-08-01\""
            - "StateInspection.${i7_id}.certificate_expiry_date == \"2027-08-01\""
            - "StateInspection.${i7_id}.certificate_state == \"POSTED\""
            - "StateInspection.${i7_id}.posted_by_user_id == \"bm-c7\""
            - "ElevatorCar.${car7_id}.current_certificate_number == \"CERT-NY-NYC-CAR-C7-20260801\""
            - "ElevatorCar.${car7_id}.certificate_expiry_date == \"2027-08-01\""
            - "ElevatorCar.${car7_id}.compliance_state == \"CERTIFIED\""

      - name: spare_part_self_reference_reverse_lookup_lists_predecessor
        claim_type: Computed Fields
        grounds:
          - entities.SparePart.fields.superseded_by_part_id
          - endpoints[GET /elevator-program/parts]
        distinguishing_aspect: "The self-referential FK is reverse-reachable: GET /elevator-program/parts?superseded_by_part_id=<successor id> returns exactly the one predecessor part, and the successor itself is not in that list."
        test_recipe:
          setup: ["Catalog holds P-OLD (ACTIVE) and P-NEW (ACTIVE); P-OLD is then obsoleted with P-NEW as replacement."]
          setup_api_calls:
            - call: "POST /elevator-program/parts"
              payload: { part_number: "P-OLD", description_text: "Legacy sheave", part_class: "WEAR_ITEM", unit_price_cents: 90000, lead_time_days: 12 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { pold_id: $.data.id }
            - call: "POST /elevator-program/parts"
              payload: { part_number: "P-NEW", description_text: "Replacement sheave", part_class: "WEAR_ITEM", unit_price_cents: 110000, lead_time_days: 9 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { pnew_id: $.data.id }
            - call: "POST /elevator-program/parts/${pold_id}/obsolete"
              payload: { replacement_part_id: "${pnew_id}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          trigger:
            - call: "GET /elevator-program/parts"
              payload: { superseded_by_part_id: "${pnew_id}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "the response array has exactly 1 element with total_count == 1"
            - "the element's id == ${pold_id}"
            - "SparePart.${pold_id}.lifecycle_state == \"OBSOLETE\""
            - "SparePart.${pold_id}.obsoleted_at == \"2026-08-01T00:00:00.000Z\""
            - "SparePart.${pnew_id}.lifecycle_state == \"ACTIVE\""
            - "SparePart.${pnew_id}.superseded_by_part_id == null"

      - name: visit_computed_missing_task_codes_reflects_oil_and_grease_scope
        claim_type: Computed Fields
        grounds:
          - calculations.visit_task_compliance
          - entities.MaintenanceVisit.fields.missing_task_codes
          - entities.MaintenanceVisit.fields.completed_task_codes
        distinguishing_aspect: "Under an OIL_AND_GREASE contract the required set is {LUBRICATION, PIT_CLEAN, VISUAL_INSPECTION}; a perform that completes LUBRICATION and marks PIT_CLEAN completed:false leaves missing_task_codes == [\"PIT_CLEAN\", \"VISUAL_INSPECTION\"] and completed_task_codes == [\"LUBRICATION\"]."
        test_recipe:
          setup: ["One ACTIVE OIL_AND_GREASE contract with one car and a SCHEDULED 2026-08 visit."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Corner Eight", building_address: "8 Corner St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-c8", contractor_user_id: "sc-c8", scope_type: "OIL_AND_GREASE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 200000, callback_response_minutes: 90, entrapment_response_minutes: 45, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c8_id: $.data.id }
            - call: "POST /elevator-program/contracts/${c8_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${c8_id}", car_code: "CAR-C8", car_type: "HYDRAULIC", capacity_lbs: 2000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { car8_id: $.data.id }
            - call: "POST /elevator-program/visits"
              payload: { car_id: "${car8_id}", period_month: "2026-08", scheduled_date: "2026-08-15" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { v8_id: $.data.id }
          trigger:
            - call: "POST /elevator-program/visits/${v8_id}/perform"
              payload: { task_items: [ { task_code: "LUBRICATION", completed: true, note: "greased" }, { task_code: "PIT_CLEAN", completed: false, note: "flooded pit" } ] }
              as: ServiceContractor
              as_user_id: "sc-c8"
          assert:
            - "MaintenanceVisit.${v8_id}.status == \"PERFORMED\""
            - "MaintenanceVisit.${v8_id}.completed_task_codes == [\"LUBRICATION\"]"
            - "MaintenanceVisit.${v8_id}.missing_task_codes == [\"PIT_CLEAN\", \"VISUAL_INSPECTION\"]"
            - "MaintenanceVisit.${v8_id}.performed_by_user_id == \"sc-c8\""
            - "MaintenanceVisit.${v8_id}.performed_at == \"2026-08-01T00:00:00.000Z\""
            - "MaintenanceVisit.${v8_id}.rework_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: activate_an_already_active_contract_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ServiceContract.status.DRAFT_to_ACTIVE
          - validations[priority=70]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Activate is not idempotent: the second call observes status ACTIVE, which is not a declared from-state, so it returns 409 ERR_INVALID_STATE_TRANSITION and does not bump version again."
        test_recipe:
          setup: ["One contract activated exactly once, so status is ACTIVE and version is 2."]
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "SM One", building_address: "1 SM St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-s1", contractor_user_id: "sc-s1", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { s1_id: $.data.id }
            - call: "POST /elevator-program/contracts/${s1_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { s1_v_after: $.data.version }
          trigger:
            - call: "POST /elevator-program/contracts/${s1_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { e_sm1: $.data.error_id }
          assert:
            - "${s1_v_after} == 2"
            - "HTTP status == 409"
            - "${e_sm1} == \"ERR_INVALID_STATE_TRANSITION\""
            - "ServiceContract.${s1_id}.status == \"ACTIVE\""
            - "ServiceContract.${s1_id}.version == 2"

      - name: terminated_contract_is_locked_down_for_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
