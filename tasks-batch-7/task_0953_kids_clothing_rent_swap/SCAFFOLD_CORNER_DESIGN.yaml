  # =====================================================================
  # SECTION: endpoints
  # =====================================================================
  - section: endpoints
    instances:

      - name: corner_ep_logical_clock_defaults_to_the_declared_instant
        claim_type: Computed read
        grounds: ["endpoints.POST_/kidswear/_clock/set_current_utc", "global_constants.DEFAULT_CLOCK_UTC"]
        distinguishing_aspect: "Before any set_current_utc call the server's logical clock reads exactly 2026-05-01T00:00:00Z, so a member created first carries that instant as size_effective_at; the clock never falls back to real wall-clock time."
        test_recipe:
          setup: ["Empty database with the clock untouched."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { e1_plan: $.data.id }
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${e1_plan}", email: "e1@kidswear.test", display_name: "Clock Default", child_size_code: "5" }
              as: PlatformAdmin
              captures: { e1_m: $.data.id }
          assert:
            - "Member.${e1_m}.size_effective_at == 2026-05-01T00:00:00.000Z"
            - "Member.${e1_m}.created_at == 2026-05-01T00:00:00.000Z"

