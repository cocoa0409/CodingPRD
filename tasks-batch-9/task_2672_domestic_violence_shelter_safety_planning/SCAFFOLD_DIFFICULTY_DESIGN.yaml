          assert:
            - "${poc_status_before} == FILED and ${refile_before} == 2 (the loop was traversed twice)"
            - "ProtectiveOrderCase.${poc_id}.status == DENIED_FINAL"
            - "ProtectiveOrderCase.${poc_id}.refile_count == 2 (not incremented past the cap)"
            - "ProtectiveOrderCase.${poc_id}.outcome_recorded_at == 2026-08-21T12:00:00Z"
            - "Client.${client_id}.protective_order_active == false"
            - "Client.${client_id}.confidentiality_posture == NORMAL"

