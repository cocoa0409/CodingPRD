      - name: error_station_unavailable_on_booking
        claim_type: Violation to Error
        grounds: ["errors[ERR_STATION_UNAVAILABLE]"]
        excluded_because:
          difficulty_instance: station_buffer_window_conflict
          rationale: "ERR_STATION_UNAVAILABLE is asserted by the named §1.8 temporal-overlap instance."
      - name: error_member_double_booked_on_booking
        claim_type: Violation to Error
        grounds: ["errors[ERR_MEMBER_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: member_cross_station_overlap_conflict
          rationale: "ERR_MEMBER_DOUBLE_BOOKED is asserted by the named §1.8 temporal-overlap instance."

  # ==========================================================================
  - section: rbac
    instances:
      - name: customer_cannot_fulfill_returns_unauthorized
        claim_type: Cannot perform other roles operations
        grounds: [roles.ShopStaff, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /orders/{id}/fulfill (a ShopStaff-exclusive op) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A member with a paid, reserved order."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-uz@x.com", full_name: "UZ" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-UZ-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_read_others_order_returns_forbidden
        claim_type: Cannot perform other roles operations
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN_NOT_OWNER]"]
        distinguishing_aspect: "Customer B reading Customer A's order via GET /orders/{id} returns ERR_FORBIDDEN_NOT_OWNER (403)."
        test_recipe:
          setup: ["Two members A and B; A owns an order."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-owna@x.com", full_name: "Own A" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/members"
              payload: { email: "cor-ownb@x.com", full_name: "Own B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-OWN-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${a_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /api/orders/${o_id}"
              payload: {}
              as: Customer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_NOT_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/fusti/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: None
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"

  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_member_supersede_subscription_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-create-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a second Subscription for the same product with the member version observed BEFORE the first create (now stale) returns ERR_STALE_VERSION (412); the first create bumped Member.version."
        test_recipe:
          setup: ["A member (version 1) and a BOTTLE product; one subscription created (bumping member version to 2)."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-occ@x.com", full_name: "OCC" }
              as: PlatformAdmin
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /api/products"
              payload: { sku: "COR-OCC-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/subscriptions"
              payload: { product_id: "${p_bot}", quantity: 1, cadence_days: 30, expected_member_version: "${m_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /api/subscriptions"
              payload: { product_id: "${p_bot}", quantity: 1, cadence_days: 30, expected_member_version: "${m_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_stale_order_version_on_pay
        claim_type: optimistic_concurrency
        grounds: ["validations[priority=7]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Paying an order with expected_order_version one below its current value (a deliberately stale version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A member with a freshly created order at version 1."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-occ2@x.com", full_name: "OCC2" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-OCC2-BOT", name: "Bottle", product_type: "BOTTLE", unit_price_cents: 2000 }
              as: InventoryManager
              captures: { p_bot: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "UNIT", product_id: "${p_bot}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v} - 1" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: replenishment_receive_returns_fusti_to_service
        claim_type: cascading_side_effects
        grounds: [state_machines.ReplenishmentOrder.REQUESTED_to_RECEIVED, state_machines.Fusti.LOW_to_IN_SERVICE, entities.Fusti.current_volume_ml]
        distinguishing_aspect: "Receiving the auto-created replenishment for a LOW fusti refills current_volume_ml to capacity (10000) and returns it to IN_SERVICE (receive -> volume raised -> status cascade)."
        test_recipe:
          setup: ["A fusti driven to LOW by a fulfilled 1000ml draw (as in the fulfill cascade), leaving a REQUESTED replenishment."]
          setup_api_calls:
            - call: "POST /api/members"
              payload: { email: "cor-rcv@x.com", full_name: "RCV" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "COR-RCV-OIL", name: "EVOO RCV", product_type: "BULK_OIL", price_per_ml_cents: 0.30, shelf_life_days: 540 }
              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 6000, reorder_point_ml: 5000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { f_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 1000 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /api/orders/${o_id}/fulfill"
              payload: { expected_order_version: "${o_v2}" }
              as: ShopStaff
            - call: "GET /api/replenishment-orders?fusti_id=${f_id}"
              payload: {}
              as: ShopStaff
              captures: { ro_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/replenishment-orders/${ro_id}/receive"
              payload: { received_harvest_date: "2026-07-10T00:00:00Z" }
              as: ShopStaff
          assert:
            - "ReplenishmentOrder.${ro_id}.status == RECEIVED"
            - "Fusti.${f_id}.current_volume_ml == 10000"
            - "Fusti.${f_id}.status == IN_SERVICE"

      - name: fefo_selector_picks_earliest_best_by
        claim_type: selector_policy
        grounds: [calculations.fusti_selection, entities.Reservation.fusti_id]
        distinguishing_aspect: "With two eligible fusti for the same product, pay reserves against the one with the earlier best_by_date (FEFO), not the later batch."
