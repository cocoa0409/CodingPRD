              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /clearance/estimates/${est_id}/price"
              payload: {}
              as: FinancialCounselor
              captures: { allowed: $.data.allowed_amount_cents }
          assert:
            - "Estimate.${est_id}.allowed_amount_cents == 2500000 (90001 primary 1000000 + 90002 secondary 3 x 500000)"
            - "the 90001 line carries unit_rate_cents 1000000 and the 90002 line carries adjusted rate 500000"

      - name: bundling_none_pays_full_sum
        claim_type: correct_result
        grounds: [calculations.bundled_contract_pricing]
        distinguishing_aspect: "Under bundling_rule NONE every line pays 100% of its contracted rate: [27447 x1 @ 3000000, 29881 x1 @ 1000000] yields allowed 4000000, exactly 500000 more than MPR would pay for the same lines."
