            - call: "POST /customers"
              payload: { full_name: "Buyer B", email: "bb@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { cb_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${ca_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { da_id: $.data.id }
            - call: "POST /deals/${da_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${da_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://j/a-ca.pdf" }
              as: SalesManager
            - call: "POST /deals/${da_id}/documents"
              payload: { doc_type: "INSURANCE", uri: "s3://j/a-ins.pdf" }
              as: SalesManager
            - call: "POST /deals/${da_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${da_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
              captures: { da_ver_appr: $.data.version }
            - call: "POST /deals/${da_id}/finance-contracts"
              payload: { lender_program_id: "${lp_id}", markup_bps: 100, term_months: 72, expected_deal_version: "${da_ver_appr}" }
              as: FinanceManager
            - call: "POST /deals/${da_id}/contract"
              payload: {}
              as: FinanceManager
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: FinanceManager
              captures: { v_ver_pre_fund: $.data.version }
            - call: "POST /deals/${da_id}/fund"
              payload: { expected_vehicle_version: "${v_ver_pre_fund}" }
              as: FinanceManager
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${cb_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { db_id: $.data.id }
          trigger:
            - call: "POST /deals/${db_id}/desk"
              payload: {}
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "POST /deals/${db_id}/desk response status == 409 and data.error_id == ERR_VEHICLE_NOT_AVAILABLE (V is SOLD, not AVAILABLE)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_testdrive_halfopen_with_buffer
        grounds:
          - validations[priority=11]
          - errors[ERR_TESTDRIVE_OVERLAP]
          - endpoints.POST_/test-drives
        distinguishing_aspect: |
          TestDrive on Vehicle uses HALF-OPEN intervals [start, end) PLUS a 30-minute turnaround buffer
          appended after each drive: a new drive 10:30-11:00 is rejected against an existing 10:00-10:30
          because 10:30 falls inside the prior drive's buffer (ends 11:00). Resource: Vehicle.
        test_recipe:
          setup:
            - "Vehicle with one SCHEDULED test drive 10:00-10:30; both customers licensed."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000121", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { vt_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "TD One", email: "td1@x.com", monthly_income_cents: 1000000, credit_tier: "TIER_C", drivers_license_valid: true }
              as: SalesManager
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "TD Two", email: "td2@x.com", monthly_income_cents: 1000000, credit_tier: "TIER_C", drivers_license_valid: true }
              as: SalesManager
              captures: { c2_id: $.data.id }
            - call: "POST /test-drives"
              payload: { vehicle_id: "${vt_id}", customer_id: "${c1_id}", start_at: "2026-06-11T10:00:00.000Z", end_at: "2026-06-11T10:30:00.000Z" }
              as: SalesManager
          trigger:
            - call: "POST /test-drives"
              payload: { vehicle_id: "${vt_id}", customer_id: "${c2_id}", start_at: "2026-06-11T10:30:00.000Z", end_at: "2026-06-11T11:00:00.000Z" }
              as: SalesManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_TESTDRIVE_OVERLAP (10:30 within prior drive's 30-min turnaround buffer)"

      - name: overlap_repair_bay_closed_interval_no_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_BAY_OVERLAP]
          - endpoints.POST_/repair-orders
        distinguishing_aspect: |
          RepairOrder bay uses CLOSED intervals [start, end] with NO buffer and aggregate capacity 1 per
          bay: a new OPEN order in BAY_1 09:00-10:00 collides with an existing OPEN order 10:00-11:00
          because closed-interval endpoints touch at 10:00 (whereas the half-open test-drive rule would
          allow exact end==start). Different interval semantics, different resource (RepairOrder bay).
        test_recipe:
          setup:
            - "BAY_1 has one OPEN repair order 10:00-11:00 on some vehicle."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000131", condition: "USED", make: "ACME", model: "CPE", model_year: 2023, msrp_cents: 1800000, list_price_cents: 1600000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { vehicle_id: "${v_id}", deal_id: null, ro_type: "RETAIL", bay: "BAY_1", scheduled_start_at: "2026-06-12T10:00:00.000Z", scheduled_end_at: "2026-06-12T11:00:00.000Z", parts_cents: 5000, labor_cents: 12000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders"
              payload: { vehicle_id: "${v_id}", deal_id: null, ro_type: "RETAIL", bay: "BAY_1", scheduled_start_at: "2026-06-12T09:00:00.000Z", scheduled_end_at: "2026-06-12T10:00:00.000Z", parts_cents: 0, labor_cents: 8000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and data.error_id == ERR_BAY_OVERLAP (closed intervals touch at 10:00)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_fund_unwind_preserves_floorplan_principal
        grounds:
          - state_machines.Deal.CONTRACTED_to_FUNDED
          - state_machines.Deal.FUNDED_to_UNWOUND
          - state_machines.FloorPlanLine.PAID_OFF_to_REINSTATED
          - entities.FloorPlanLine.fields.principal_outstanding_cents
        distinguishing_aspect: |
          Conserved quantity = sum of FloorPlanLine.principal_outstanding_cents for the vehicle. fund pays
          off (1800000 -> 0); unwind reinstates (0 -> 1800000). The forward+compensating pair leaves the
          named quantity unchanged at exactly 1800000 cents.
        test_recipe:
          setup:
            - "FUNDED deal DF whose vehicle had an ACTIVE FloorPlanLine principal 1800000, now PAID_OFF (outstanding 0); no ACCEPTED title."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000141", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id, v_ver_create: $.data.version }
            - call: "POST /vehicles/${v_id}/floor-plan-lines"
              payload: { lender_name: "FLOORBANK", principal_cents: 1800000, annual_rate_bps: 825, floored_on: "2026-05-01T00:00:00.000Z", expected_vehicle_version: "${v_ver_create}" }
              as: InventoryClerk
              captures: { fp_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Twl", email: "c12@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /lender-programs"
              payload: { lender_name: "CREDITONE", tier: "TIER_A", buy_rate_bps: 549, max_markup_bps: 200, max_ltv_bps: 12500, max_pti_bps: 1800, max_term_months: 72, active: true }
              as: FinanceManager
              captures: { lp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "CREDIT_APP", uri: "s3://j/ca.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/documents"
              payload: { doc_type: "INSURANCE", uri: "s3://j/ins.pdf" }
              as: SalesManager
            - call: "POST /deals/${d_id}/submit-to-lender"
              payload: {}
              as: SalesManager
            - call: "POST /deals/${d_id}/lender-decision"
              payload: { decision: "APPROVE", lender_program_id: "${lp_id}" }
              as: FinanceManager
              captures: { d_ver_appr: $.data.version }
            - call: "POST /deals/${d_id}/finance-contracts"
              payload: { lender_program_id: "${lp_id}", markup_bps: 100, term_months: 72, expected_deal_version: "${d_ver_appr}" }
              as: FinanceManager
            - call: "POST /deals/${d_id}/contract"
              payload: {}
              as: FinanceManager
            - call: "GET /vehicles/${v_id}"
              payload: {}
              as: FinanceManager
              captures: { v_ver_pre_fund: $.data.version }
            - call: "POST /deals/${d_id}/fund"
              payload: { expected_vehicle_version: "${v_ver_pre_fund}" }
              as: FinanceManager
          trigger:
            - call: "POST /deals/${d_id}/unwind"
              payload: {}
              as: FinanceManager
              captures: { d_status: $.data.status }
          assert:
            - "before unwind FloorPlanLine.${fp_id}.principal_outstanding_cents == 0 (PAID_OFF)"
            - "Deal.${d_id}.status == UNWOUND and Vehicle.${v_id}.status == AVAILABLE"
            - "after unwind FloorPlanLine.${fp_id}.status == REINSTATED and principal_outstanding_cents == 1800000 (conserved quantity restored)"

      - name: invariant_product_add_void_preserves_amount_financed
        grounds:
          - calculations.amount_financed
          - state_machines.DealProduct
          - endpoints.POST_/deals/{id}/products
          - endpoints.DELETE_/deals/{id}/products/{deal_product_id}
        distinguishing_aspect: |
          Different conserved quantity = Deal.amount_financed_cents. Adding a DealProduct (sold 200000)
          raises amount_financed from 2145000 to 2345000; voiding the same product (DELETE) restores it to
          exactly 2145000. Forward add + compensating void leave amount_financed unchanged.
        test_recipe:
          setup:
            - "Desked deal DF with amount_financed 2145000 (sale 2000000, tax 145000, no products)."
          setup_api_calls:
            - call: "POST /vehicles"
              payload: { vin: "1HGAC1ANCM1000151", condition: "NEW", make: "ACME", model: "SED", model_year: 2026, msrp_cents: 2200000, list_price_cents: 2000000 }
              as: InventoryClerk
              captures: { v_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C Trt", email: "c13@x.com", monthly_income_cents: 2500000, credit_tier: "TIER_A", drivers_license_valid: true }
              as: SalesManager
              captures: { c_id: $.data.id }
            - call: "POST /finance-products"
              payload: { code: "VSCX", name: "VSC", cost_cents: 120000, max_retail_cents: 250000, taxable: false }
              as: FinanceManager
              captures: { fp_id: $.data.id }
            - call: "POST /deals"
              payload: { vehicle_id: "${v_id}", customer_id: "${c_id}", deal_type: "FINANCE", sale_price_cents: 2000000, accessories_cents: 0, doc_fee_cents: 0, title_fee_cents: 0, registration_fee_cents: 0, tax_rate_bps: 725, cash_down_cents: 0 }
              as: SalesManager
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/desk"
              payload: {}
              as: SalesManager
              captures: { af_base: $.data.amount_financed_cents }
            - call: "POST /deals/${d_id}/products"
              payload: { finance_product_id: "${fp_id}", sold_price_cents: 200000 }
              as: FinanceManager
              captures: { dp_id: $.data.id }
          trigger:
            - call: "DELETE /deals/${d_id}/products/${dp_id}"
              payload: {}
              as: FinanceManager
              captures: { dp_status: $.data.status }
          assert:
            - "after add, GET /deals/${d_id} amount_financed_cents == 2345000 and fi_products_total_cents == 200000"
            - "DealProduct.${dp_id}.status == VOID after DELETE"
            - "after void, GET /deals/${d_id} amount_financed_cents == 2145000 and fi_products_total_cents == 0 (conserved quantity restored)"
