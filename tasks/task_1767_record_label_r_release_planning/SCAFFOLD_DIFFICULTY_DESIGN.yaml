            - { call: "POST /api/royalty-runs/${run_q3}/calculate", payload: {}, as: FinanceController }
          trigger:
            - { call: "GET /api/royalty-runs/${run_q3}/statements", payload: {}, as: FinanceController, captures: { earned: "$.data[0].royalty_earned_cents" } }
          assert:
            - "royalty_earned_cents == 17: the single unit sits at cumulative position 500000, which is NOT strictly greater than the 500000 threshold, so tier-1 rate 1950 applies"
            - "royalty_earned_cents != 18 (what tier-2 rate 2150 would have paid)"

      - name: budget_exact_hundred_percent_pay
        grounds:
          - calculations.budget_posture_and_gate
          - validations[priority=32]
        distinguishing_aspect: |
          Metric spent-cents via POST /api/milestones/{id}/pay: a payment that
          brings spent to EXACTLY the budget (1000000 == 1000000) is allowed
          (<=, not <), while the next 1-cent payment is rejected.
        test_recipe:
          setup:
            - "Label defaults; funded contract; project RECORDING budget 1000000; M1 payment 600000 already PAID; M2 payment 400000 APPROVED"
          setup_api_calls:
