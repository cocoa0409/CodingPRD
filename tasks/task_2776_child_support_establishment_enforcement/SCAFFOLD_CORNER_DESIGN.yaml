              captures: { ch2_status: "$.data.status", ch2_paid: "$.data.paid_cents", ch2_unpaid: "$.data.unpaid_balance_cents" }
          assert:
            - "${pay_ac} == 20000  # bucket 1: 2026-09-20 falls inside charge 2's period"
            - "${before_tc} == 150000, ${before_ap} == 130000  # 75000 unpaid on charge 1 plus 55000 on charge 2, both due on or before 2026-09-20"
            - "${before_int} == 375  # aggregate variant: the only month end strictly before 2026-09-20 with a due balance is 2026-08-31, round_half_up(75000*0.005)"
            - "${before_col} == 20000"
            - "${e_partial} == ERR_CHARGE_PARTIALLY_PAID with HTTP 409  # charge 2 has paid_cents 20000"
            - "${v_status} == VOID"
            - "${after_tc} == 75000  # 150000 - the voided charge's amount_cents"
            - "${after_ap} == 55000  # only charge 2 remains OPEN"
            - "${after_int} == 0  # with charge 1 VOID the 2026-08-31 snapshot has no due balance, so the already-accrued 375 disappears retroactively"
            - "${after_col} == 20000  # collections are untouched by voidance"
            - "${ch2_status} == OPEN, ${ch2_paid} == 20000, ${ch2_unpaid} == 55000"

