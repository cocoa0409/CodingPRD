# =============================================================================
# SCAFFOLD — Public Records Redaction & Body-Worn Camera Release
# Sections §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2647. Public Records Redaction & Body-Worn Camera Release (police records unit): request
  intake with scope clarification and fee estimate for extensive video review, exemption
  analysis across ongoing investigation, privacy, juvenile and victim protections, redaction
  workflow for faces, license plates, audio identifiers and protected content with quality
  review, statutory release requirements for critical incidents with defined timelines,
  notification to depicted individuals and their objection rights where required, cost
  recovery limits for redaction labor and media production, denial letters with statutory
  citations and appeal pathways, retention schedules and litigation hold coordination

domain_name: public-records-redaction-bwc-release
api_prefix: /records

complexity_profile:
  difficulty_level: expert_plus          # §0.4 Expert band, deliberately over-coupled
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # ResponsiveRecord is a junction entity resolving the many-to-many between
  # PublicRecordsRequest and VideoAsset; ExemptionClaim / RedactionTask hang off the
  # junction, DepictedIndividual hangs off the asset, and FeeLedgerEntry is
  # self-referential (reverses_entry_id). No strict ownership tree exists: the same
  # VideoAsset participates in many requests with per-request exemption posture.

  state_machine_shape: parallel
  # PublicRecordsRequest carries two independent dimensions that evolve separately
  # (processing_status × fee_status) and interact only at two pinned junctions
  # (RELEASED + fee settled -> CLOSED; reversal of a settled charge -> INVOICED).
  # Non-linear shapes elsewhere: RedactionTask cycles (QA_PENDING -> QA_REJECTED ->
  # QA_PENDING), ResponsiveRecord cycles (RESPONSIVE -> WITHHELD_IN_FULL ->
  # RESPONSIVE), VideoAsset cycles (SCHEDULED -> SUSPENDED -> SCHEDULED),
  # ExemptionClaim and DenialLetter branch fork-style with divergent side effects.

  relationship_patterns:
    - one_to_many          # Request -> ResponsiveRecord, VideoAsset -> DepictedIndividual
    - many_to_many         # Request <-> VideoAsset via ResponsiveRecord
    - self_referential     # FeeLedgerEntry.reverses_entry_id -> FeeLedgerEntry.id
    - cross_aggregate      # ExemptionClaim.depicted_individual_id crosses request/asset aggregates
    - polymorphic: false

  role_model: segregation_of_duties
  # The LegalCounsel who asserted an ExemptionClaim may not adjudicate it; the
  # RedactionTechnician assigned to a RedactionTask may not be its QA reviewer.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Requester
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the person or organization filing public records requests"
      - name: email
        type: string
        source: input
        description: "Contact address used for notices, estimates and denial letters"
      - name: requester_type
        type: enum
        source: input
        description: "Statutory requester category driving fee waiver and open-request limits"
        constraints: "one of MEDIA, INVOLVED_PARTY, ATTORNEY, GENERAL_PUBLIC, COMMERCIAL"
      - name: indigency_certified
        type: boolean
        source: input
        default: false
        description: "True when the requester filed a certified indigency affidavit"
      - name: fee_waiver_pct
        type: number
        source: computed
        description: "Base statutory waiver fraction. 1.00 when indigency_certified is true, else 0.25 when requester_type == MEDIA, else 0.00. Recomputed only at Requester creation"
        constraints: "0.00, 0.25 or 1.00; 2 decimal places"
      - name: open_request_count
        type: integer
        source: computed
        default: 0
        description: "Count of PublicRecordsRequest rows with requester_id == this.id and processing_status NOT IN {RELEASED, DENIED, CLOSED}"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Records-unit staff member name"
      - name: role_type
        type: enum
        source: input
        description: "Functional assignment inside the records unit"
        constraints: "one of CLERK, TECHNICIAN, REVIEWER, COUNSEL, SUPERVISOR"
      - name: redaction_certification_level
        type: integer
        source: input
        default: 0
        description: "Redaction certification tier. 0 = uncertified, 1 = faces and plates, 2 = audio and protected content, 3 = juvenile-cleared"
        constraints: "integer in [0, 3]"
      - name: open_qa_assignment_count
        type: integer
        source: computed
        default: 0
        description: "Count of RedactionTask rows with qa_reviewer_id == this.id and status == QA_PENDING"

  - name: PublicRecordsRequest
    parent: null
    common_fields: true
    fields:
      - name: requester_id
        type: string
        source: input
        description: "FK -> Requester.id; the filer on whose behalf the request is processed"
      - name: received_at
        type: datetime
        source: input
        description: "Instant the request was received at the counter, supplied at intake (normally the logical clock value); statutory anchor for non-critical-incident requests"
      - name: subject_incident_number
        type: string
        source: input
        description: "Police incident number the request describes; free text, not a foreign key"
      - name: requested_date_from
        type: datetime
        source: input
        description: "Inclusive start of the requested recording window (latest clarification wins)"
      - name: requested_date_to
        type: datetime
        source: input
        description: "Inclusive end of the requested recording window (latest clarification wins)"
      - name: scope_narrative
        type: string
        source: input
        description: "Narrative scope text; replaced wholesale by each scope clarification"
      - name: scope_clarification_count
        type: integer
        source: computed
        default: 0
        description: "Number of accepted scope clarifications; each supersedes the prior scope"
      - name: extension_days_granted
        type: integer
        source: input
        default: 0
        description: "Statutory extension days granted at clarification; clamped to MAX_EXTENSION_DAYS"
        constraints: "integer in [0, 10]"
      - name: processing_status
        type: enum
        source: computed
        description: "Dimension 1 of the parallel state machine: records-processing lifecycle"
        constraints: "one of INTAKE, SCOPING, EXEMPTION_REVIEW, REDACTION, RELEASE_READY, PARTIALLY_RELEASED, RELEASED, DENIED, CLOSED"
      - name: fee_status
        type: enum
        source: computed
        description: "Dimension 2 of the parallel state machine: cost-recovery lifecycle, independent of processing_status"
        constraints: "one of NOT_ASSESSED, ESTIMATED, DEPOSIT_DUE, DEPOSIT_PAID, INVOICED, SETTLED, WAIVED"
      - name: is_critical_incident
        type: boolean
        source: computed
        default: false
        description: "True iff at least one ResponsiveRecord with request_id == this.id and inclusion_status IN {RESPONSIVE, WITHHELD_IN_FULL, RELEASED} points at a VideoAsset with is_critical_incident == true"
      - name: statutory_deadline_at
        type: datetime
        source: computed
        description: "Statutory release deadline; see calculations.statutory_deadline"
      - name: tolled_days
        type: integer
        source: computed
        default: 0
        description: "Whole days the statutory clock was tolled awaiting a deposit; frozen when the qualifying payment posts (see calculations.statutory_deadline)"
      - name: deposit_due_at
        type: datetime
        source: computed
        description: "Set when fee_status becomes DEPOSIT_DUE: clock at estimate time plus DEPOSIT_DUE_DAYS; null while fee_status has never been DEPOSIT_DUE"
      - name: estimated_total_cents
        type: integer
        source: computed
        default: 0
        description: "estimated_total_cents of the FeeEstimate with request_id == this.id and status == ACTIVE; 0 when no ACTIVE estimate exists"
      - name: deposit_required_cents
        type: integer
        source: computed
        default: 0
        description: "deposit_required_cents of the FeeEstimate with status == ACTIVE; 0 when no ACTIVE estimate exists"
      - name: invoiced_total_cents
        type: integer
        source: computed
        default: 0
        description: "Final invoice amount pinned by calculations.fee_invoice_total; 0 until the invoice is issued"
      - name: deposit_paid_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of FeeLedgerEntry.amount_cents for entry_type IN {DEPOSIT_PAYMENT} plus the amount_cents of REVERSAL entries whose reversed target is a DEPOSIT_PAYMENT"
      - name: fee_recognized_cents
        type: integer
        source: computed
        default: 0
        description: "Absolute value of SUM of FeeLedgerEntry.amount_cents for entry_type IN {LABOR_CHARGE, MEDIA_CHARGE} net of REVERSAL entries whose reversed target is one of those two types"
      - name: deposit_balance_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of FeeLedgerEntry.amount_cents over every entry with request_id == this.id (all entry types, reversals included). Conserved-quantity anchor: deposit_balance_cents == deposit_paid_cents + waiver_credit_total_cents - fee_recognized_cents"
      - name: waiver_credit_total_cents
        type: integer
        source: computed
        default: 0
        description: "SUM of FeeLedgerEntry.amount_cents for entry_type == WAIVER_CREDIT net of REVERSAL entries whose reversed target is a WAIVER_CREDIT"
      - name: billable_labor_minutes
        type: integer
        source: computed
        default: 0
        description: "SUM of RedactionTask.approved_labor_minutes over tasks whose responsive_record_id belongs to this request and whose status == APPROVED. Conserved-quantity anchor for the QA reject compensation"
      - name: responsive_record_count
        type: integer
        source: computed
        default: 0
        description: "Count of ResponsiveRecord rows with request_id == this.id and inclusion_status != EXCLUDED"
      - name: unadjudicated_claim_count
        type: integer
        source: computed
        default: 0
        description: "Count of ExemptionClaim rows with status == ASSERTED whose responsive_record_id belongs to this request"
      - name: open_notification_count
        type: integer
        source: computed
        default: 0
        description: "Count of DepictedIndividual rows on VideoAssets of this request's ResponsiveRecords with inclusion_status == RESPONSIVE whose notification_status IN {PENDING, NOTIFIED, OBJECTED}"

  - name: VideoAsset
    parent: null
    common_fields: true
    fields:
      - name: incident_number
        type: string
        source: input
        description: "Police incident number; the join key litigation holds match on"
      - name: device_serial
        type: string
        source: input
        description: "Body-worn camera serial that produced the recording"
      - name: officer_badge
        type: string
        source: input
        description: "Badge number of the officer wearing the camera"
      - name: recorded_start_at
        type: datetime
        source: input
        description: "Wall-clock start of the recording; statutory anchor for critical incidents"
      - name: duration_ms
        type: integer
        source: input
        description: "Recording length in milliseconds"
        constraints: "integer > 0"
      - name: is_critical_incident
        type: boolean
        source: input
        default: false
        description: "True when the recording depicts a statutorily defined critical incident"
      - name: classification
        type: enum
        source: input
        description: "Incident classification driving the review-minute multiplier"
        constraints: "one of ROUTINE, USE_OF_FORCE, JUVENILE_CONTACT, OFFICER_INVOLVED_SHOOTING, IN_CUSTODY_DEATH"
      - name: retention_category
        type: enum
        source: input
        description: "Retention schedule the asset was filed under"
        constraints: "one of EVIDENTIARY_7Y, INVESTIGATIVE_3Y, NON_EVIDENTIARY_180D"
      - name: scheduled_purge_at
        type: datetime
        source: input
        description: "Earliest instant the retention schedule permits destruction"
      - name: disposition_state
        type: enum
        source: computed
        description: "Retention lifecycle position"
        constraints: "one of SCHEDULED, SUSPENDED, PURGED"
      - name: suspended_by_hold_id
        type: string
        source: computed
        description: "FK -> LitigationHold.id; nullable. Set by the hold cascade to the ACTIVE LitigationHold whose scope_incident_number == this.incident_number with the smallest created_at (tie-break: none needed, created_at is unique per hold); cleared when that hold is released and no other ACTIVE hold matches"
      - name: retention_locked
        type: boolean
        source: computed
        default: false
        description: "True iff at least one LitigationHold with status == ACTIVE has scope_incident_number == this.incident_number, OR at least one ResponsiveRecord references this asset with inclusion_status IN {CANDIDATE, RESPONSIVE, WITHHELD_IN_FULL} on a request whose processing_status NOT IN {RELEASED, DENIED, CLOSED}"
      - name: depicted_individual_count
        type: integer
        source: computed
        default: 0
        description: "Count of DepictedIndividual rows with video_asset_id == this.id"

  - name: ResponsiveRecord
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PublicRecordsRequest.id; the request this record answers"
      - name: video_asset_id
        type: string
        source: input
        description: "FK -> VideoAsset.id; the recording under review for that request"
      - name: inclusion_status
        type: enum
        source: computed
        description: "Per-request responsiveness position of the asset"
        constraints: "one of CANDIDATE, RESPONSIVE, WITHHELD_IN_FULL, RELEASED, EXCLUDED"
      - name: release_posture
        type: enum
        source: computed
        description: "Derived gate over child ExemptionClaims; see calculations.record_release_posture. Gates redaction-task creation and release inclusion"
        constraints: "one of OPEN, RESTRICTED, BLOCKED"
      - name: estimated_review_minutes
        type: integer
        source: computed
        description: "Projected first-pass viewing labor; see calculations.record_review_minutes. Frozen at ResponsiveRecord creation"
      - name: presumptive_burden_minutes
        type: integer
        source: computed
        default: 0
        description: "Worst-case redaction burden counting ASSERTED and SUSTAINED claims; see calculations.record_redaction_burden variant presumptive"
      - name: adjudicated_burden_minutes
        type: integer
        source: computed
        default: 0
        description: "Burden counting SUSTAINED claims only; see calculations.record_redaction_burden variant adjudicated"
      - name: approved_labor_minutes
        type: integer
        source: computed
        default: 0
        description: "SUM of RedactionTask.approved_labor_minutes over tasks with responsive_record_id == this.id and status == APPROVED"
      - name: unadjudicated_claim_count
        type: integer
        source: computed
        default: 0
        description: "Count of ExemptionClaim rows with responsive_record_id == this.id and status == ASSERTED"
      - name: redacted_segment_ms
        type: integer
        source: computed
        default: 0
        description: "SUM of (clip_end_ms - clip_start_ms) over RedactionTask rows with responsive_record_id == this.id and status == APPROVED"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical clock value when inclusion_status became RELEASED; null otherwise"

  - name: ExemptionClaim
    parent: null
    common_fields: true
    fields:
      - name: responsive_record_id
        type: string
        source: input
        description: "FK -> ResponsiveRecord.id; the request-scoped record the exemption is asserted against"
      - name: exemption_code
        type: enum
        source: input
        description: "Statutory exemption asserted"
        constraints: "one of ONGOING_INVESTIGATION, PERSONAL_PRIVACY, MEDICAL, VICTIM_PROTECTION, JUVENILE, CONFIDENTIAL_INFORMANT"
      - name: statutory_citation
        type: string
        source: input
        description: "Statutory citation text; must equal CITATION_MAP[exemption_code] exactly (pinned by validations priority 18): ONGOING_INVESTIGATION -> 119.071(2)(c), PERSONAL_PRIVACY -> 119.071(4)(d), JUVENILE -> 985.04(1), VICTIM_PROTECTION -> 119.071(2)(j), MEDICAL -> 456.057(7), CONFIDENTIAL_INFORMANT -> 119.071(2)(f)"
      - name: asserted_scope
        type: enum
        source: input
        description: "FULL_WITHHOLD withholds the entire recording; PARTIAL_REDACT requires targeted redaction"
        constraints: "one of FULL_WITHHOLD, PARTIAL_REDACT"
      - name: claim_source
        type: enum
        source: system
        description: "STAFF_ANALYSIS when asserted by counsel; DEPICTED_OBJECTION when materialized from a depicted individual objection"
        constraints: "one of STAFF_ANALYSIS, DEPICTED_OBJECTION"
      - name: depicted_individual_id
        type: string
        source: system
        description: "FK -> DepictedIndividual.id; nullable. Non-null only when claim_source == DEPICTED_OBJECTION"
      - name: asserted_by_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; nullable. X-User-ID of the LegalCounsel who asserted the claim; null when claim_source == DEPICTED_OBJECTION"
      - name: adjudicated_by_staff_id
        type: string
        source: computed
        description: "FK -> StaffMember.id; nullable. X-User-ID of the LegalCounsel who adjudicated the claim"
      - name: status
        type: enum
        source: computed
        description: "Adjudication position"
        constraints: "one of ASSERTED, SUSTAINED, OVERRULED, WITHDRAWN"
      - name: adjudicated_at
        type: datetime
        source: computed
        description: "Logical clock value at adjudication; null while ASSERTED"
      - name: adjudication_note
        type: string
        source: computed
        description: "Free-text rationale recorded with the adjudication; null while ASSERTED"
      - name: estimated_redaction_minutes
        type: integer
        source: computed
        description: "Per-claim redaction minutes; see calculations.claim_redaction_minutes. Frozen at claim creation"

  - name: RedactionTask
    parent: null
    common_fields: true
    fields:
      - name: responsive_record_id
        type: string
        source: input
        description: "FK -> ResponsiveRecord.id; the record whose timeline is being obscured"
      - name: exemption_claim_id
        type: string
        source: input
        description: "FK -> ExemptionClaim.id; nullable. Non-null when the redaction implements a specific exemption; null for the baseline face/plate pass"
      - name: target_type
        type: enum
        source: input
        description: "What is obscured on the clip"
        constraints: "one of FACE, LICENSE_PLATE, AUDIO_IDENTIFIER, PROTECTED_CONTENT"
      - name: clip_start_ms
        type: integer
        source: input
        description: "Inclusive start offset into VideoAsset.duration_ms of the obscured interval"
        constraints: "integer >= 0"
      - name: clip_end_ms
        type: integer
        source: input
        description: "Exclusive end offset of the obscured interval; interval is half-open [clip_start_ms, clip_end_ms)"
        constraints: "integer > clip_start_ms and <= VideoAsset.duration_ms"
      - name: assigned_technician_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the technician who must perform and submit the work"
      - name: qa_reviewer_id
        type: string
        source: computed
        description: "FK -> StaffMember.id; nullable. Reviewer booked by the latest submit-qa call"
      - name: qa_window_start_at
        type: datetime
        source: computed
        description: "Inclusive start of the reviewer's booked QA window; null before first submit"
      - name: qa_window_end_at
        type: datetime
        source: computed
        description: "Inclusive end of the reviewer's booked QA window; null before first submit"
      - name: status
        type: enum
        source: computed
        description: "Redaction lifecycle; cycles between QA_PENDING and QA_REJECTED on rework"
        constraints: "one of DRAFT, QA_PENDING, QA_REJECTED, APPROVED, CANCELLED"
      - name: logged_labor_minutes
        type: integer
        source: computed
        default: 0
        description: "Minutes claimed by the technician on the most recent submit-qa call"
      - name: approved_labor_minutes
        type: integer
        source: computed
        default: 0
        description: "logged_labor_minutes frozen at the instant status became APPROVED; 0 in every other status including QA_REJECTED and CANCELLED"
      - name: rework_count
        type: integer
        source: computed
        default: 0
        description: "Number of times this task re-entered QA_PENDING from QA_REJECTED"
      - name: defect_codes
        type: array
        source: computed
        description: "Defect codes recorded by the most recent failing QA outcome; empty array otherwise"

  - name: DepictedIndividual
    parent: null
    common_fields: true
    fields:
      - name: video_asset_id
        type: string
        source: input
        description: "FK -> VideoAsset.id; the recording this person appears in"
      - name: display_label
        type: string
        source: input
        description: "Non-identifying label used in the case file, e.g. SUBJECT-1"
      - name: relationship
        type: enum
        source: input
        description: "Depiction role driving whether pre-release notification is statutorily required"
        constraints: "one of VICTIM, JUVENILE, WITNESS, OFFICER, BYSTANDER, SUSPECT"
      - name: notification_required
        type: boolean
        source: computed
        description: "True iff relationship IN {VICTIM, JUVENILE, WITNESS}"
      - name: notification_status
        type: enum
        source: computed
        description: "Notification and objection position"
        constraints: "one of NOT_REQUIRED, PENDING, NOTIFIED, OBJECTED, OBJECTION_SUSTAINED, OBJECTION_OVERRULED, WAIVED"
      - name: notice_method
        type: enum
        source: computed
        description: "Delivery channel of the issued notice; null while PENDING or NOT_REQUIRED"
        constraints: "one of FIRST_CLASS_MAIL, EMAIL, PERSONAL_SERVICE"
      - name: notified_at
        type: datetime
        source: computed
        description: "Logical clock value when the notice issued; null before notification"
      - name: objection_deadline_at
        type: datetime
        source: computed
        description: "notified_at plus JUVENILE_OBJECTION_WINDOW_DAYS when relationship == JUVENILE, else notified_at plus OBJECTION_WINDOW_DAYS; null before notification"
      - name: objection_basis
        type: enum
        source: computed
        description: "Statutory basis supplied with a recorded objection; null otherwise. Maps 1:1 onto the exemption_code of the ExemptionClaim the objection materializes: PRIVACY -> PERSONAL_PRIVACY, VICTIM_STATUS -> VICTIM_PROTECTION, JUVENILE_STATUS -> JUVENILE, MEDICAL_STATUS -> MEDICAL"
        constraints: "one of PRIVACY, VICTIM_STATUS, JUVENILE_STATUS, MEDICAL_STATUS; null before an objection is recorded"

  - name: FeeEstimate
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PublicRecordsRequest.id; the request being priced"
      - name: sequence_number
        type: integer
        source: computed
        description: "1-based ordinal of this estimate within the request; increments by 1 per accepted estimate"
      - name: basis
        type: enum
        source: input
        description: "Which ResponsiveRecord burden field feeds the projection: PRESUMPTIVE uses presumptive_burden_minutes, ADJUDICATED uses adjudicated_burden_minutes"
        constraints: "one of PRESUMPTIVE, ADJUDICATED"
      - name: media_type
        type: enum
        source: input
        description: "Projected production medium"
        constraints: "one of DIGITAL_DOWNLOAD, DVD, USB"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE until superseded by a newer estimate or invalidated by an exemption adjudication"
        constraints: "one of ACTIVE, SUPERSEDED, STALE"
      - name: projected_review_minutes
        type: integer
        source: computed
        description: "SUM of ResponsiveRecord.estimated_review_minutes over the included set (see calculations.fee_estimate_total step 1)"
      - name: projected_burden_minutes
        type: integer
        source: computed
        description: "SUM of the basis-selected burden field over the included set (see calculations.fee_estimate_total step 2)"
      - name: billable_minutes
        type: integer
        source: computed
        description: "max(0, projected_review_minutes + projected_burden_minutes - FREE_ALLOWANCE_MINUTES)"
      - name: estimated_labor_cents
        type: integer
        source: computed
        description: "Labor component after the statutory free allowance"
      - name: media_production_cents
        type: integer
        source: computed
        description: "Media component; see calculations.media_production_cost"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "estimated_labor_cents + media_production_cents; the value the public-interest tier is keyed on"
      - name: effective_waiver_pct
        type: number
        source: computed
        description: "min(1.00, Requester.fee_waiver_pct + PUBLIC_INTEREST_TIER_PCT(subtotal_cents))"
      - name: waiver_credit_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * effective_waiver_pct)"
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "subtotal_cents - waiver_credit_cents"
      - name: deposit_required_cents
        type: integer
        source: computed
        description: "round_half_up(estimated_total_cents * DEPOSIT_PCT) when estimated_total_cents > DEPOSIT_THRESHOLD_CENTS, else 0"

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PublicRecordsRequest.id; the request whose cost-recovery account this entry moves"
      - name: entry_type
        type: enum
        source: system
        description: "Ledger line kind. Sign convention: DEPOSIT_PAYMENT and WAIVER_CREDIT are positive, LABOR_CHARGE / MEDIA_CHARGE / REFUND are negative, REVERSAL carries exactly the negation of its target"
        constraints: "one of DEPOSIT_PAYMENT, LABOR_CHARGE, MEDIA_CHARGE, WAIVER_CREDIT, REVERSAL, REFUND"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed movement in cents; never zero"
      - name: reverses_entry_id
        type: string
        source: system
        description: "FK -> FeeLedgerEntry.id; nullable. Non-null only on REVERSAL entries, pointing at the entry being undone (taken from the reversal endpoint path)"
      - name: memo
        type: string
        source: input
        description: "Operator note recorded with the entry"
      - name: source_kind
        type: enum
        source: system
        description: "Which workflow emitted the entry"
        constraints: "one of DEPOSIT, INVOICE, ADJUSTMENT, WAIVER"

  - name: LitigationHold
    parent: null
    common_fields: true
    fields:
      - name: matter_number
        type: string
        source: input
        description: "Docket or matter identifier; globally unique across LitigationHold rows"
        constraints: "unique"
      - name: scope_incident_number
        type: string
        source: input
        description: "Incident number the hold covers; matched against VideoAsset.incident_number by exact string equality"
      - name: hold_type
        type: enum
        source: input
        description: "Legal basis for the hold"
        constraints: "one of LITIGATION, SUBPOENA, INTERNAL_AFFAIRS"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while the hold suppresses destruction; RELEASED once counsel lifts it"
        constraints: "one of ACTIVE, RELEASED"
      - name: placed_at
        type: datetime
        source: system
        description: "Logical clock value when the hold was placed"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical clock value when the hold was released; null while ACTIVE"
      - name: suspended_asset_count
        type: integer
        source: computed
        default: 0
        description: "Count of VideoAsset rows whose suspended_by_hold_id == this.id"

  - name: DenialLetter
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PublicRecordsRequest.id; the request being denied in whole or in part"
      - name: denial_type
        type: enum
        source: input
        description: "FULL denies the entire request; PARTIAL accompanies a release with withheld records"
        constraints: "one of FULL, PARTIAL"
      - name: statutory_citations
        type: array
        source: computed
        description: "Distinct ExemptionClaim.statutory_citation values over claims with status == SUSTAINED on this request's ResponsiveRecords, deduplicated and sorted ascending by citation string"
      - name: withheld_record_count
        type: integer
        source: computed
        description: "Count of ResponsiveRecord rows on this request with inclusion_status == WITHHELD_IN_FULL at issuance"
      - name: appeal_authority
        type: enum
        source: computed
        description: "SUPERIOR_COURT when denial_type == FULL, DISTRICT_ATTORNEY when denial_type == PARTIAL"
        constraints: "one of SUPERIOR_COURT, DISTRICT_ATTORNEY"
      - name: appeal_pathway_note
        type: string
        source: input
        description: "Instructional text appended to the statutory appeal pathway paragraph"
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical clock value at issuance"
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "issued_at plus APPEAL_WINDOW_DAYS; the last instant an appeal may be filed (inclusive)"
      - name: status
        type: enum
        source: computed
        description: "Appeal lifecycle of the letter"
        constraints: "one of ISSUED, APPEALED, UPHELD, REVERSED"
      - name: appeal_grounds
        type: string
        source: computed
        description: "Grounds text supplied by the requester when the appeal was filed; null while ISSUED"
      - name: appeal_filed_at
        type: datetime
        source: computed
        description: "Logical clock value when the appeal was filed; null while ISSUED"
      - name: appeal_decided_at
        type: datetime
        source: computed
        description: "Logical clock value when the appeal was decided; null until UPHELD or REVERSED"

  - name: ReleasePackage
    parent: null
    common_fields: true
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> PublicRecordsRequest.id; the request this production answers"
      - name: package_kind
        type: enum
        source: computed
        description: "Derived, never supplied: FINAL when this package released every remaining RESPONSIVE record of the request, INTERIM when RESPONSIVE records remain (see calculations.release_eligible_set)"
        constraints: "one of INTERIM, FINAL"
      - name: media_type
        type: enum
        source: input
        description: "Production medium actually produced"
        constraints: "one of DIGITAL_DOWNLOAD, DVD, USB"
      - name: included_record_count
        type: integer
        source: computed
        description: "Count of ResponsiveRecord rows transitioned to RELEASED by this package"
      - name: produced_minutes
        type: integer
        source: computed
        description: "ceil(SUM of VideoAsset.duration_ms over the included records / 60000)"
      - name: disc_count
        type: integer
        source: computed
        description: "Media units produced; see calculations.media_production_cost"
      - name: production_cost_cents
        type: integer
        source: computed
        description: "Media production charge for this package; see calculations.media_production_cost"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical clock value when the package was produced"
      - name: waived_notification_count
        type: integer
        source: computed
        default: 0
        description: "Count of DepictedIndividual rows this package's notification sweep moved from NOTIFIED to WAIVED"

# =============================================================================
# §1.2 State Machine Table
# PublicRecordsRequest carries TWO independent dimensions (processing_status and
# fee_status). They are declared as two machines on the same entity and are
# disambiguated by the `dimension:` key.
# =============================================================================
state_machines:

  - entity: PublicRecordsRequest
    dimension: processing_status
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: SCOPING
        trigger: "POST /records/requests/{id}/scope-clarification"
        actor: RecordsClerk
        preconditions:
          - "processing_status == INTAKE or processing_status == SCOPING"
          - "expected_request_version equals the request's current version (OCC, see concurrency_rules.scope-clarification-stale-request)"
          - "extension_days_granted, when supplied, is in [0, 10]"
        side_effects:
          - "scope_narrative, requested_date_from, requested_date_to replaced wholesale by the payload values"
          - "extension_days_granted set to min(payload value, MAX_EXTENSION_DAYS); omitted payload leaves the stored value unchanged"
          - "scope_clarification_count incremented by 1"
          - "statutory_deadline_at recomputed by calculations.statutory_deadline"
          - "increments PublicRecordsRequest.version by 1"
        note: "Self-loop from SCOPING is legal and is how a second clarification supersedes the first; each loop re-runs every side effect above."
      - from: SCOPING
        to: EXEMPTION_REVIEW
        trigger: "POST /records/responsive-records/{id}/inclusion with inclusion_status == RESPONSIVE (auto-advance, bubble up from the child)"
        actor: system
        preconditions:
          - "the ResponsiveRecord's request has processing_status == SCOPING"
        side_effects:
          - "is_critical_incident recomputed over the RESPONSIVE / WITHHELD_IN_FULL / RELEASED set"
          - "statutory_deadline_at recomputed by calculations.statutory_deadline (the anchor may move to the earliest responsive recorded_start_at)"
          - "increments PublicRecordsRequest.version by 1"
      - from: EXEMPTION_REVIEW
        to: REDACTION
        trigger: "POST /records/responsive-records/{id}/redaction-tasks (the first live task on the request), or POST /records/exemption-claims/{id}/adjudication (auto-advance evaluated after the adjudication cascade settles)"
        actor: system
        preconditions:
          - "on the task-creation trigger: the created RedactionTask is the first task on the request with status IN {DRAFT, QA_PENDING, QA_REJECTED}. No claim state is required, so a request carrying no ExemptionClaim at all still reaches REDACTION and from there RELEASE_READY"
          - "on the adjudication trigger: unadjudicated_claim_count == 0 after the cascade"
          - "on the adjudication trigger: at least one ResponsiveRecord on the request has inclusion_status == RESPONSIVE and release_posture == RESTRICTED"
        side_effects:
          - "increments PublicRecordsRequest.version by 1"
        note: "When an adjudication leaves every RESPONSIVE record at posture OPEN and no live task exists, the request jumps EXEMPTION_REVIEW -> RELEASE_READY instead (next transition)."
      - from: EXEMPTION_REVIEW
        to: RELEASE_READY
        trigger: "POST /records/exemption-claims/{id}/adjudication (auto-advance evaluated after the adjudication cascade settles)"
        actor: system
        preconditions:
          - "unadjudicated_claim_count == 0 after the cascade"
          - "no ResponsiveRecord on the request has inclusion_status == RESPONSIVE and release_posture == RESTRICTED"
          - "no RedactionTask on the request has status IN {DRAFT, QA_PENDING, QA_REJECTED}"
          - "at least one ResponsiveRecord on the request has inclusion_status == RESPONSIVE"
        side_effects:
          - "increments PublicRecordsRequest.version by 1"
      - from: REDACTION
        to: RELEASE_READY
        trigger: "POST /records/redaction-tasks/{id}/qa-outcome with outcome == PASS, or the RedactionTask cancellation cascade fired by POST /records/exemption-claims/{id}/adjudication (auto-advance)"
        actor: system
        preconditions:
          - "every RedactionTask whose responsive_record_id belongs to this request has status IN {APPROVED, CANCELLED}"
          - "at least one ResponsiveRecord on the request has inclusion_status == RESPONSIVE"
        side_effects:
          - "billable_labor_minutes recomputed by calculations.request_billable_labor_minutes"
          - "increments PublicRecordsRequest.version by 1"
      - from: EXEMPTION_REVIEW
        to: DENIED
        trigger: "POST /records/requests/{id}/denial-letters with denial_type == FULL"
        actor: LegalCounsel
        preconditions:
          - "processing_status IN {EXEMPTION_REVIEW, REDACTION, RELEASE_READY}"
          - "unadjudicated_claim_count == 0"
          - "every ResponsiveRecord on the request with inclusion_status != EXCLUDED has inclusion_status == WITHHELD_IN_FULL"
        side_effects:
          - "a DenialLetter is created with status ISSUED, statutory_citations gathered from SUSTAINED claims, appeal_deadline_at = clock + APPEAL_WINDOW_DAYS"
          - "Requester.open_request_count decremented by 1"
          - "increments PublicRecordsRequest.version by 1"
        note: "denial_type == PARTIAL does NOT move processing_status; it only records the withheld-record citations alongside a release."
      - from: DENIED
        to: CLOSED
        trigger: "POST /records/denial-letters/{id}/appeal-decision with decision == UPHELD"
        actor: LegalCounsel
        preconditions:
          - "the letter has status == APPEALED and denial_type == FULL"
          - "processing_status == DENIED"
        side_effects:
          - "no ExemptionClaim, ResponsiveRecord or RedactionTask is touched: upholding a denial is the inert branch of the fork"
          - "VideoAsset.retention_locked recomputed for every asset referenced by this request's ResponsiveRecords (the request is no longer open)"
          - "increments PublicRecordsRequest.version by 1"
        note: "CLOSED is reachable from two directions: RELEASED -> CLOSED settles a fulfilled request, DENIED -> CLOSED settles an exhausted appeal."
      - from: DENIED
        to: EXEMPTION_REVIEW
        trigger: "POST /records/denial-letters/{id}/appeal-decision with decision == REVERSED"
        actor: LegalCounsel
        preconditions:
          - "the letter has status == APPEALED and denial_type == FULL"
        side_effects:
          - "every ExemptionClaim with status == SUSTAINED on this request's ResponsiveRecords transitions to WITHDRAWN (cascade link 1)"
          - "each affected ResponsiveRecord recomputes release_posture and adjudicated_burden_minutes, and any record with inclusion_status == WITHHELD_IN_FULL returns to RESPONSIVE (cascade link 2)"
          - "Requester.open_request_count incremented by 1"
          - "increments PublicRecordsRequest.version by 1"
        note: "This is the cyclic edge of the processing dimension: DENIED is not terminal while an appeal can still reverse it."
      - from: RELEASE_READY
        to: PARTIALLY_RELEASED
        trigger: "POST /records/requests/{id}/release-packages with package_kind == INTERIM"
        actor: RecordsClerk
        preconditions:
          - "processing_status IN {RELEASE_READY, PARTIALLY_RELEASED}"
          - "at least one ResponsiveRecord is release-eligible per calculations.release_eligible_set"
          - "open_notification_count == 0 after the notification sweep"
          - "deposit_balance_cents >= deposit_required_cents when fee_status == DEPOSIT_DUE"
        side_effects:
          - "notification sweep runs FIRST: every DepictedIndividual with notification_status == NOTIFIED and clock >= objection_deadline_at moves to WAIVED"
          - "each release-eligible ResponsiveRecord moves to RELEASED with released_at = clock"
          - "a ReleasePackage is created; produced_minutes, disc_count and production_cost_cents pinned by calculations.media_production_cost"
          - "increments PublicRecordsRequest.version by 1"
      - from: PARTIALLY_RELEASED
        to: RELEASED
        trigger: "POST /records/requests/{id}/release-packages with package_kind == FINAL"
        actor: RecordsClerk
        preconditions:
          - "processing_status IN {RELEASE_READY, PARTIALLY_RELEASED}"
          - "no ResponsiveRecord on the request has inclusion_status == CANDIDATE"
          - "open_notification_count == 0 after the notification sweep"
        side_effects:
          - "same sweep, release and package side effects as the INTERIM transition"
          - "Requester.open_request_count decremented by 1"
          - "increments PublicRecordsRequest.version by 1"
      - from: RELEASE_READY
        to: RELEASED
        trigger: "POST /records/requests/{id}/release-packages with package_kind == FINAL"
        actor: RecordsClerk
        preconditions:
          - "same preconditions as the PARTIALLY_RELEASED -> RELEASED transition"
        side_effects:
          - "same side effects as the PARTIALLY_RELEASED -> RELEASED transition"
      - from: RELEASED
        to: CLOSED
        trigger: "POST /records/requests/{id}/invoice or POST /records/requests/{id}/payments (auto-advance across dimensions)"
        actor: system
        preconditions:
          - "processing_status == RELEASED"
          - "fee_status IN {SETTLED, WAIVED} after the fee dimension settles in the same request"
        side_effects:
          - "VideoAsset.retention_locked recomputed for every asset referenced by this request's ResponsiveRecords; an asset with no ACTIVE matching LitigationHold and no other open request becomes retention_locked == false and is therefore purgeable"
          - "increments PublicRecordsRequest.version by 1"
        note: "The only cross-dimension junction in the forward direction: closure requires both dimensions to be finished."

  - entity: PublicRecordsRequest
    dimension: fee_status
    initial_state: NOT_ASSESSED
    terminal_states: [WAIVED]
    transitions:
      - from: NOT_ASSESSED
        to: ESTIMATED
        trigger: "POST /records/requests/{id}/fee-estimates"
        actor: RecordsClerk
        preconditions:
          - "fee_status IN {NOT_ASSESSED, ESTIMATED, DEPOSIT_DUE}"
          - "expected_request_version equals the request's current version (OCC, see concurrency_rules.fee-estimate-create-stale-request)"
          - "the computed deposit_required_cents == 0 (i.e. estimated_total_cents <= DEPOSIT_THRESHOLD_CENTS) and estimated_total_cents > 0"
        side_effects:
          - "any FeeEstimate on this request with status IN {ACTIVE, STALE} moves to SUPERSEDED"
          - "a new FeeEstimate is created with status ACTIVE and sequence_number = prior count + 1"
          - "estimated_total_cents and deposit_required_cents copied onto the request"
          - "increments PublicRecordsRequest.version by 1"
      - from: NOT_ASSESSED
        to: DEPOSIT_DUE
        trigger: "POST /records/requests/{id}/fee-estimates"
        actor: RecordsClerk
        preconditions:
          - "fee_status IN {NOT_ASSESSED, ESTIMATED, DEPOSIT_DUE}"
          - "expected_request_version equals the request's current version"
          - "the computed deposit_required_cents > 0"
        side_effects:
          - "same estimate supersede / create / copy side effects as the NOT_ASSESSED -> ESTIMATED transition"
          - "deposit_due_at set to clock + DEPOSIT_DUE_DAYS"
          - "increments PublicRecordsRequest.version by 1"
        note: "ESTIMATED -> DEPOSIT_DUE and DEPOSIT_DUE -> ESTIMATED are both legal via a superseding estimate whose total crosses DEPOSIT_THRESHOLD_CENTS in either direction."
      - from: NOT_ASSESSED
        to: WAIVED
        trigger: "POST /records/requests/{id}/fee-estimates"
        actor: RecordsClerk
        preconditions:
          - "fee_status IN {NOT_ASSESSED, ESTIMATED, DEPOSIT_DUE}"
          - "expected_request_version equals the request's current version"
          - "the computed estimated_total_cents == 0"
        side_effects:
          - "same estimate supersede / create / copy side effects"
          - "a WAIVER_CREDIT FeeLedgerEntry is written for the full waiver_credit_cents with source_kind WAIVER"
          - "increments PublicRecordsRequest.version by 1"
        note: "Reachable for an indigency-certified requester (fee_waiver_pct == 1.00) and for a zero-labor request under the free allowance."
      - from: DEPOSIT_DUE
        to: DEPOSIT_PAID
        trigger: "POST /records/requests/{id}/payments"
        actor: Requester
        preconditions:
          - "fee_status == DEPOSIT_DUE"
          - "deposit_balance_cents after this payment >= deposit_required_cents"
        side_effects:
          - "a DEPOSIT_PAYMENT FeeLedgerEntry is written with source_kind DEPOSIT"
          - "deposit_paid_cents and deposit_balance_cents recomputed"
          - "tolled_days frozen at floor((clock - deposit_due_at) / 1 day), floored at 0"
          - "statutory_deadline_at recomputed by calculations.statutory_deadline with the frozen tolled_days"
          - "increments PublicRecordsRequest.version by 1"
      - from: DEPOSIT_PAID
        to: INVOICED
        trigger: "POST /records/requests/{id}/invoice"
        actor: RecordsSupervisor
        preconditions:
          - "processing_status IN {PARTIALLY_RELEASED, RELEASED, DENIED}"
          - "fee_status IN {ESTIMATED, DEPOSIT_DUE, DEPOSIT_PAID}"
        side_effects:
          - "invoiced_total_cents pinned by calculations.fee_invoice_total"
          - "one LABOR_CHARGE FeeLedgerEntry (labor plus review component), one MEDIA_CHARGE FeeLedgerEntry (0 is skipped, no entry is written when the component is 0) and one WAIVER_CREDIT FeeLedgerEntry (skipped when 0) are written with source_kind INVOICE"
          - "fee_recognized_cents, waiver_credit_total_cents and deposit_balance_cents recomputed"
          - "increments PublicRecordsRequest.version by 1"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /records/requests/{id}/invoice (auto-advance when the deposit already covers the invoice) or POST /records/requests/{id}/payments"
        actor: system
        preconditions:
          - "deposit_balance_cents >= 0"
        side_effects:
          - "when processing_status == RELEASED the request also advances to CLOSED (see the processing dimension)"
          - "increments PublicRecordsRequest.version by 1"
      - from: SETTLED
        to: INVOICED
        trigger: "POST /records/fee-ledger-entries/{id}/reversal"
        actor: RecordsSupervisor
        preconditions:
          - "fee_status == SETTLED"
          - "deposit_balance_cents after the reversal is < 0"
        side_effects:
          - "a REVERSAL FeeLedgerEntry is written carrying exactly the negation of the target entry's amount_cents"
          - "fee_recognized_cents, waiver_credit_total_cents, deposit_paid_cents and deposit_balance_cents recomputed"
          - "increments PublicRecordsRequest.version by 1"
        note: "The reverse cross-dimension junction: undoing a settled charge reopens the fee dimension without touching processing_status."

  - entity: ResponsiveRecord
    initial_state: CANDIDATE
    terminal_states: [RELEASED, EXCLUDED]
    transitions:
      - from: CANDIDATE
        to: RESPONSIVE
        trigger: "POST /records/responsive-records/{id}/inclusion with inclusion_status == RESPONSIVE"
        actor: RecordsClerk
        preconditions:
          - "inclusion_status == CANDIDATE"
          - "the parent request has processing_status IN {SCOPING, EXEMPTION_REVIEW} (cross-entity guard; INTAKE is rejected with ERR_REQUEST_STATE_INVALID)"
        side_effects:
          - "request.responsive_record_count and request.is_critical_incident recomputed"
          - "request.statutory_deadline_at recomputed"
          - "request auto-advances SCOPING -> EXEMPTION_REVIEW"
      - from: CANDIDATE
        to: EXCLUDED
        trigger: "POST /records/responsive-records/{id}/inclusion with inclusion_status == EXCLUDED"
        actor: RecordsClerk
        preconditions:
          - "inclusion_status == CANDIDATE"
        side_effects:
          - "request.responsive_record_count recomputed"
          - "VideoAsset.retention_locked recomputed for the referenced asset"
      - from: RESPONSIVE
        to: WITHHELD_IN_FULL
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == SUSTAINED on a claim whose asserted_scope == FULL_WITHHOLD (cascade)"
        actor: system
        preconditions:
          - "inclusion_status == RESPONSIVE"
          - "the adjudicated claim's responsive_record_id == this.id"
        side_effects:
          - "release_posture becomes BLOCKED"
          - "every RedactionTask on this record with status IN {DRAFT, QA_PENDING, QA_REJECTED} moves to CANCELLED (cascade link 3 of calculations-driven chain)"
      - from: WITHHELD_IN_FULL
        to: RESPONSIVE
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == WITHDRAWN, or the SUSTAINED -> WITHDRAWN cascade fired by POST /records/denial-letters/{id}/appeal-decision with decision == REVERSED"
        actor: system
        preconditions:
          - "inclusion_status == WITHHELD_IN_FULL"
          - "after the withdrawal no ExemptionClaim on this record has status == SUSTAINED and asserted_scope == FULL_WITHHOLD"
        side_effects:
          - "release_posture recomputed by calculations.record_release_posture"
          - "adjudicated_burden_minutes recomputed"
        note: "The cyclic edge of the record dimension; CANCELLED redaction tasks are NOT resurrected, new tasks must be created."
      - from: RESPONSIVE
        to: RELEASED
        trigger: "POST /records/requests/{id}/release-packages"
        actor: RecordsClerk
        preconditions:
          - "inclusion_status == RESPONSIVE"
          - "the record is in calculations.release_eligible_set for this request"
        side_effects:
          - "released_at set to the logical clock"
          - "redacted_segment_ms recomputed"
          - "the enclosing ReleasePackage counts this record in included_record_count and produced_minutes"

  - entity: ExemptionClaim
    initial_state: ASSERTED
    terminal_states: [SUSTAINED, OVERRULED, WITHDRAWN]
    transitions:
      - from: ASSERTED
        to: SUSTAINED
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == SUSTAINED"
        actor: LegalCounsel
        preconditions:
          - "status == ASSERTED"
          - "X-User-ID != asserted_by_staff_id (segregation of duties; vacuously satisfied when asserted_by_staff_id is null)"
        side_effects:
          - "adjudicated_by_staff_id = X-User-ID, adjudicated_at = clock, adjudication_note stored"
          - "CASCADE LINK 1 (caused by the status flip): the parent ResponsiveRecord recomputes release_posture and adjudicated_burden_minutes; unadjudicated_claim_count decremented on both the record and the request"
          - "CASCADE LINK 2 (caused by link 1 when the sustained claim's asserted_scope == FULL_WITHHOLD): the ResponsiveRecord moves RESPONSIVE -> WITHHELD_IN_FULL and its release_posture becomes BLOCKED"
          - "CASCADE LINK 3 (caused by link 2): every RedactionTask on that record with status IN {DRAFT, QA_PENDING, QA_REJECTED} moves to CANCELLED and its approved_labor_minutes stays 0; APPROVED tasks are terminal and are NOT touched, so PublicRecordsRequest.billable_labor_minutes is provably unchanged by this link"
          - "CASCADE LINK 4 (caused by link 3): for every task link 3 cancelled out of QA_PENDING, the booked reviewer's StaffMember.open_qa_assignment_count is decremented (qa_reviewer_id itself is retained for audit); and because link 3 left every RedactionTask on the request terminal, the request auto-advances REDACTION -> RELEASE_READY when at least one ResponsiveRecord is still RESPONSIVE"
          - "FAN-OUT (not part of the chain): the FeeEstimate on the request with status == ACTIVE moves to STALE, because the adjudicated burden it projected has changed"
          - "when claim_source == DEPICTED_OBJECTION the linked DepictedIndividual moves OBJECTED -> OBJECTION_SUSTAINED"
      - from: ASSERTED
        to: OVERRULED
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == OVERRULED"
        actor: LegalCounsel
        preconditions:
          - "status == ASSERTED"
          - "X-User-ID != asserted_by_staff_id"
        side_effects:
          - "adjudicated_by_staff_id = X-User-ID, adjudicated_at = clock, adjudication_note stored"
          - "the parent ResponsiveRecord recomputes release_posture and adjudicated_burden_minutes; unadjudicated_claim_count decremented on record and request"
          - "every RedactionTask on that record with exemption_claim_id == this claim and status IN {DRAFT, QA_PENDING, QA_REJECTED} moves to CANCELLED (the redaction it implemented is no longer authorized)"
          - "the ACTIVE FeeEstimate on the request moves to STALE"
          - "when claim_source == DEPICTED_OBJECTION the linked DepictedIndividual moves OBJECTED -> OBJECTION_OVERRULED"
        note: "Divergent branch: OVERRULED cancels only the tasks tied to THIS claim, while SUSTAINED with FULL_WITHHOLD cancels every task on the record."
      - from: ASSERTED
        to: WITHDRAWN
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == WITHDRAWN"
        actor: LegalCounsel
        preconditions:
          - "status == ASSERTED"
          - "X-User-ID != asserted_by_staff_id"
        side_effects:
          - "adjudicated_by_staff_id = X-User-ID, adjudicated_at = clock, adjudication_note stored"
          - "the parent ResponsiveRecord recomputes release_posture, presumptive_burden_minutes and adjudicated_burden_minutes; both unadjudicated counters decremented"
          - "the ACTIVE FeeEstimate on the request moves to STALE"
          - "when claim_source == DEPICTED_OBJECTION the linked DepictedIndividual moves OBJECTED -> OBJECTION_OVERRULED"
        note: "WITHDRAWN is the only decision that also lowers presumptive_burden_minutes, because a withdrawn claim leaves the worst-case set."
      - from: SUSTAINED
        to: WITHDRAWN
        trigger: "POST /records/denial-letters/{id}/appeal-decision with decision == REVERSED (cascade)"
        actor: system
        preconditions:
          - "status == SUSTAINED"
          - "the claim's responsive_record_id belongs to the letter's request"
        side_effects:
          - "the parent ResponsiveRecord recomputes release_posture and both burden fields and returns WITHHELD_IN_FULL -> RESPONSIVE when no FULL_WITHHOLD SUSTAINED claim remains"

  - entity: RedactionTask
    initial_state: DRAFT
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QA_PENDING
        trigger: "POST /records/redaction-tasks/{id}/submit-qa"
        actor: RedactionTechnician
        preconditions:
          - "status IN {DRAFT, QA_REJECTED}"
          - "X-User-ID == assigned_technician_id"
          - "qa_reviewer_id != assigned_technician_id (segregation of duties)"
          - "the reviewer's redaction_certification_level meets calculations.certification_requirement for this task"
          - "qa_window_start_at < qa_window_end_at"
          - "the requested window does not collide with any other QA_PENDING task booked on the same reviewer under the buffered-closed-interval rule (validations priority 26)"
        side_effects:
          - "logged_labor_minutes set to the payload value"
          - "qa_reviewer_id, qa_window_start_at, qa_window_end_at set"
          - "StaffMember.open_qa_assignment_count incremented for the reviewer"
      - from: QA_PENDING
        to: APPROVED
        trigger: "POST /records/redaction-tasks/{id}/qa-outcome with outcome == PASS"
        actor: QualityReviewer
        preconditions:
          - "status == QA_PENDING"
          - "X-User-ID == qa_reviewer_id"
          - "exemption_claim_id is null OR the referenced ExemptionClaim has status == SUSTAINED (cross-entity dependency)"
        side_effects:
          - "approved_labor_minutes frozen at logged_labor_minutes; defect_codes set to the empty array"
          - "ResponsiveRecord.approved_labor_minutes and redacted_segment_ms recomputed"
          - "PublicRecordsRequest.billable_labor_minutes recomputed"
          - "StaffMember.open_qa_assignment_count decremented for the reviewer"
          - "the request auto-advances REDACTION -> RELEASE_READY once every task on it is APPROVED or CANCELLED"
      - from: QA_PENDING
        to: QA_REJECTED
        trigger: "POST /records/redaction-tasks/{id}/qa-outcome with outcome == FAIL"
        actor: QualityReviewer
        preconditions:
          - "status == QA_PENDING"
          - "X-User-ID == qa_reviewer_id"
        side_effects:
          - "defect_codes set to the payload list"
          - "approved_labor_minutes stays 0, so PublicRecordsRequest.billable_labor_minutes is unchanged by the submit/reject pair"
          - "StaffMember.open_qa_assignment_count decremented for the reviewer, releasing the booked window"
      - from: QA_REJECTED
        to: QA_PENDING
        trigger: "POST /records/redaction-tasks/{id}/submit-qa"
        actor: RedactionTechnician
        preconditions:
          - "same preconditions as the DRAFT -> QA_PENDING transition"
        side_effects:
          - "same side effects as the DRAFT -> QA_PENDING transition"
          - "rework_count incremented by 1"
          - "logged_labor_minutes overwritten by the new payload value (it is not accumulated)"
        note: "The cyclic edge of the redaction dimension; a task may loop indefinitely and rework_count is the loop counter."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /records/exemption-claims/{id}/adjudication (cascade link 3 for SUSTAINED FULL_WITHHOLD, or the claim-scoped cancellation for OVERRULED)"
        actor: system
        preconditions:
          - "status IN {DRAFT, QA_PENDING, QA_REJECTED}"
        side_effects:
          - "approved_labor_minutes stays 0"
          - "StaffMember.open_qa_assignment_count decremented when the task was QA_PENDING"
          - "PublicRecordsRequest.billable_labor_minutes recomputed; it never moves on this edge, because only APPROVED tasks contribute and APPROVED tasks are never cancelled"

  - entity: DepictedIndividual
    initial_state: PENDING
    terminal_states: [NOT_REQUIRED, WAIVED, OBJECTION_SUSTAINED, OBJECTION_OVERRULED]
    transitions:
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /records/video-assets/{id}/depicted-individuals (initialization branch)"
        actor: system
        preconditions:
          - "relationship NOT IN {VICTIM, JUVENILE, WITNESS}"
        side_effects:
          - "notification_required set to false; the individual never gates a release"
        note: "Initialization branch: the row is created directly in NOT_REQUIRED when notification is not statutorily required, and directly in PENDING when it is."
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /records/depicted-individuals/{id}/notification"
        actor: RecordsClerk
        preconditions:
          - "notification_status == PENDING"
          - "notification_required == true"
        side_effects:
          - "notice_method stored, notified_at = clock"
          - "objection_deadline_at = notified_at + (JUVENILE_OBJECTION_WINDOW_DAYS when relationship == JUVENILE else OBJECTION_WINDOW_DAYS)"
          - "PublicRecordsRequest.open_notification_count recomputed for every request whose RESPONSIVE records reference this asset"
      - from: NOTIFIED
        to: OBJECTED
        trigger: "POST /records/depicted-individuals/{id}/objection"
        actor: RecordsClerk
        preconditions:
          - "notification_status == NOTIFIED"
          - "clock <= objection_deadline_at (inclusive; the deadline instant itself is still open)"
          - "the supplied responsive_record_id references a ResponsiveRecord whose video_asset_id == this.video_asset_id"
        side_effects:
          - "objection_basis stored"
          - "a new ExemptionClaim is created on the supplied ResponsiveRecord with claim_source DEPICTED_OBJECTION, asserted_scope PARTIAL_REDACT, status ASSERTED, asserted_by_staff_id null, depicted_individual_id = this.id"
          - "that record's presumptive_burden_minutes, unadjudicated_claim_count and release_posture recompute, and the request's unadjudicated_claim_count increments"
          - "the ACTIVE FeeEstimate on that request moves to STALE"
      - from: OBJECTED
        to: OBJECTION_SUSTAINED
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == SUSTAINED on the objection-sourced claim (cascade)"
        actor: system
        preconditions:
          - "notification_status == OBJECTED"
        side_effects:
          - "PublicRecordsRequest.open_notification_count recomputed (the individual no longer blocks release)"
      - from: OBJECTED
        to: OBJECTION_OVERRULED
        trigger: "POST /records/exemption-claims/{id}/adjudication with disposition == OVERRULED or WITHDRAWN on the objection-sourced claim (cascade)"
        actor: system
        preconditions:
          - "notification_status == OBJECTED"
        side_effects:
          - "PublicRecordsRequest.open_notification_count recomputed"
      - from: NOTIFIED
        to: WAIVED
        trigger: "POST /records/requests/{id}/release-packages (notification sweep, runs before every other release side effect)"
        actor: system
        preconditions:
          - "notification_status == NOTIFIED"
          - "clock >= objection_deadline_at (the deadline instant itself already waives)"
        side_effects:
          - "the enclosing ReleasePackage increments waived_notification_count"
          - "PublicRecordsRequest.open_notification_count recomputed"
        note: "Boundary: an individual notified at T with a 10-day window is still OBJECTED-capable at T+10d exactly, and is swept to WAIVED by a release attempt at exactly T+10d."

  - entity: VideoAsset
    initial_state: SCHEDULED
    terminal_states: [PURGED]
    transitions:
      - from: SCHEDULED
        to: SUSPENDED
        trigger: "POST /records/litigation-holds (cascade)"
        actor: system
        preconditions:
          - "disposition_state == SCHEDULED"
          - "the new hold's scope_incident_number == this.incident_number"
        side_effects:
          - "CASCADE LINK 1 (caused by the hold becoming ACTIVE): retention_locked set to true"
          - "CASCADE LINK 2 (caused by link 1): disposition_state SCHEDULED -> SUSPENDED and suspended_by_hold_id set to the hold id"
          - "CASCADE LINK 3 (caused by link 2): LitigationHold.suspended_asset_count incremented by 1"
      - from: SUSPENDED
        to: SCHEDULED
        trigger: "POST /records/litigation-holds/{id}/release (cascade)"
        actor: system
        preconditions:
          - "disposition_state == SUSPENDED"
          - "suspended_by_hold_id == the released hold's id"
          - "no other LitigationHold with status == ACTIVE has scope_incident_number == this.incident_number"
        side_effects:
          - "suspended_by_hold_id cleared to null"
          - "retention_locked recomputed (it stays true while an open request still references the asset)"
          - "LitigationHold.suspended_asset_count decremented by 1"
        note: "Cyclic edge of the retention dimension. When another ACTIVE hold still matches, suspended_by_hold_id is repointed to that hold (smallest created_at) and disposition_state stays SUSPENDED."
      - from: SCHEDULED
        to: PURGED
        trigger: "POST /records/video-assets/{id}/purge"
        actor: RecordsSupervisor
        preconditions:
          - "disposition_state == SCHEDULED"
          - "retention_locked == false"
          - "clock >= scheduled_purge_at"
        side_effects:
          - "the asset becomes non-releasable; every ResponsiveRecord referencing it keeps its row for audit but the asset can never be added to a new request"

  - entity: DenialLetter
    initial_state: ISSUED
    terminal_states: [UPHELD, REVERSED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /records/denial-letters/{id}/appeal"
        actor: Requester
        preconditions:
          - "status == ISSUED"
          - "X-User-ID == the request's requester_id"
          - "clock <= appeal_deadline_at (inclusive)"
        side_effects:
          - "appeal_grounds stored, appeal_filed_at = clock"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /records/denial-letters/{id}/appeal-decision with decision == UPHELD"
        actor: LegalCounsel
        preconditions:
          - "status == APPEALED"
        side_effects:
          - "appeal_decided_at = clock; no cascade fires and the request stays DENIED"
      - from: APPEALED
        to: REVERSED
        trigger: "POST /records/denial-letters/{id}/appeal-decision with decision == REVERSED"
        actor: LegalCounsel
        preconditions:
          - "status == APPEALED"
        side_effects:
          - "appeal_decided_at = clock"
          - "every SUSTAINED ExemptionClaim on the request's ResponsiveRecords moves to WITHDRAWN"
          - "each affected ResponsiveRecord recomputes posture and burden and returns WITHHELD_IN_FULL -> RESPONSIVE"
          - "when denial_type == FULL the request returns DENIED -> EXEMPTION_REVIEW and Requester.open_request_count increments"
        note: "Branching fork with radically different side-effect sets per branch: UPHELD is inert, REVERSED reopens three entity levels."

  - entity: FeeEstimate
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: STALE
        trigger: "POST /records/exemption-claims/{id}/adjudication or POST /records/depicted-individuals/{id}/objection (fan-out side effect)"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "the claim's responsive_record_id belongs to this estimate's request"
        side_effects:
          - "no monetary field changes; the estimate is only marked as no longer reflecting the adjudicated burden"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /records/requests/{id}/fee-estimates"
        actor: RecordsClerk
        preconditions:
          - "status IN {ACTIVE, STALE}"
        side_effects:
          - "the newly created estimate becomes the ACTIVE one and its estimated_total_cents is copied onto the request"
      - from: STALE
        to: SUPERSEDED
        trigger: "POST /records/requests/{id}/fee-estimates"
        actor: RecordsClerk
        preconditions:
          - "status IN {ACTIVE, STALE}"
        side_effects:
          - "same as the ACTIVE -> SUPERSEDED transition"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on PublicRecordsRequest.version only
# =============================================================================
concurrency_rules:
  - rule_id: fee-estimate-create-stale-request
    parent_entity: PublicRecordsRequest
    write_endpoint: "POST /records/requests/{id}/fee-estimates"
    occ_field: "expected_request_version"
    description: |
      Creating a FeeEstimate against a request whose version has advanced since the
      client last read it is rejected. A new estimate legitimately supersedes the
      prior ACTIVE one, so the operation cannot be blocked by a state precondition:
      a clerk holding a stale view of the request would silently price the request
      against superseded scope, burden or waiver inputs.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

  - rule_id: scope-clarification-stale-request
    parent_entity: PublicRecordsRequest
    write_endpoint: "POST /records/requests/{id}/scope-clarification"
    occ_field: "expected_request_version"
    description: |
      Recording a scope clarification against a request whose version has advanced
      since the client last read it is rejected. Each clarification replaces the
      stored scope narrative and date window wholesale and is legal from both INTAKE
      and SCOPING, so a stale writer would overwrite a newer clarification with the
      scope it read earlier.
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Global rounding convention: `round_half_up(x)` returns the nearest integer with
# ties going away from zero. `ceil(x)` is the smallest integer >= x. Every money
# field is an integer count of cents; no float cents are ever stored.
# No random field (notably `id`) participates in any ordering, selector,
# tie-break or accumulation below; `created_at ASC` is the only fallback order.
# =============================================================================
calculations:

  - name: record_review_minutes
    trigger: "POST /records/requests/{id}/responsive-records — frozen on ResponsiveRecord.estimated_review_minutes at creation and never recomputed"
    algorithm: threshold
    formula: |
      asset_minutes    = ceil(VideoAsset.duration_ms / 60000)
      multiplier       = REVIEW_MULTIPLIER[VideoAsset.classification]
      estimated_review_minutes = ceil(asset_minutes * multiplier)
    input_set: "exactly one VideoAsset, the one named by ResponsiveRecord.video_asset_id; no filtering"
    constants:
      REVIEW_MULTIPLIER_ROUTINE: 1.0
      REVIEW_MULTIPLIER_USE_OF_FORCE: 2.0
      REVIEW_MULTIPLIER_JUVENILE_CONTACT: 2.5
      REVIEW_MULTIPLIER_OFFICER_INVOLVED_SHOOTING: 3.0
      REVIEW_MULTIPLIER_IN_CUSTODY_DEATH: 3.0
    precision: "integer minutes; ceil is applied twice — first to the millisecond duration, then to the product"

  - name: claim_redaction_minutes
    trigger: "POST /records/responsive-records/{id}/exemption-claims and POST /records/depicted-individuals/{id}/objection — frozen on ExemptionClaim.estimated_redaction_minutes at creation"
    algorithm: weighted_scoring
    formula: |
      asset_minutes = ceil(VideoAsset.duration_ms / 60000)      # asset behind the parent ResponsiveRecord
      weight        = (asserted_scope == FULL_WITHHOLD) ? 1.00 : EXEMPTION_WEIGHT[exemption_code]
      estimated_redaction_minutes = ceil(asset_minutes * weight)
    input_set: "the single claim being created plus its grandparent VideoAsset"
    constants:
      EXEMPTION_WEIGHT_ONGOING_INVESTIGATION: 0.30
      EXEMPTION_WEIGHT_PERSONAL_PRIVACY: 0.40
      EXEMPTION_WEIGHT_MEDICAL: 0.50
      EXEMPTION_WEIGHT_VICTIM_PROTECTION: 0.60
      EXEMPTION_WEIGHT_JUVENILE: 0.80
      EXEMPTION_WEIGHT_CONFIDENTIAL_INFORMANT: 0.90
      FULL_WITHHOLD_WEIGHT: 1.00
    precision: "integer minutes, ceil"
    note: "asserted_scope dominates exemption_code: a FULL_WITHHOLD ONGOING_INVESTIGATION claim scores the whole recording, not 30% of it."

  - name: record_redaction_burden
    trigger: "recomputed on the parent ResponsiveRecord by POST /records/responsive-records/{id}/exemption-claims, POST /records/depicted-individuals/{id}/objection and POST /records/exemption-claims/{id}/adjudication"
    algorithm: aggregation
    formula: |
      asset_minutes      = ceil(VideoAsset.duration_ms / 60000)
      baseline_minutes   = ceil(asset_minutes * BASELINE_OBSCURATION_RATIO)   # unavoidable face/plate pass
      claim_sum(states)  = SUM of ExemptionClaim.estimated_redaction_minutes
                           over claims with responsive_record_id == this.id
                           and status IN states
      presumptive_burden_minutes = baseline_minutes + claim_sum({ASSERTED, SUSTAINED})
      adjudicated_burden_minutes = baseline_minutes + claim_sum({SUSTAINED})
    input_set: "all ExemptionClaim rows on this ResponsiveRecord; the two variants differ ONLY in the status filter — presumptive counts not-yet-adjudicated claims at full weight, adjudicated ignores them"
    constants:
      BASELINE_OBSCURATION_RATIO: 0.25
    precision: "integer minutes; the baseline is ceil'd before the sum, never after"
    variants:
      - name: presumptive
        when: "quoted to the requester before exemption review closes, and whenever FeeEstimate.basis == PRESUMPTIVE"
        difference: "includes ASSERTED claims, so it is >= adjudicated_burden_minutes for the same data; it is the worst-case labor exposure"
      - name: adjudicated
        when: "used after exemption review closes, and whenever FeeEstimate.basis == ADJUDICATED"
        difference: "counts SUSTAINED claims only; an OVERRULED or WITHDRAWN claim contributes zero, so the same claim set yields a strictly smaller burden"

  - name: record_release_posture
    trigger: "recomputed on ResponsiveRecord whenever an ExemptionClaim on it is created or adjudicated"
    algorithm: constraint_propagation
    formula: |
      if EXISTS claim with responsive_record_id == this.id
              and status == SUSTAINED and asserted_scope == FULL_WITHHOLD:
          release_posture = BLOCKED
      elif EXISTS claim with responsive_record_id == this.id
              and status IN {ASSERTED, SUSTAINED}:
          release_posture = RESTRICTED
      else:
          release_posture = OPEN
    input_set: "every ExemptionClaim on this ResponsiveRecord regardless of claim_source; OVERRULED and WITHDRAWN claims are ignored entirely"
    precision: "n/a (enum)"
    note: "Evaluation order is pinned: the FULL_WITHHOLD test runs first, so a record carrying both a sustained FULL_WITHHOLD claim and an asserted PARTIAL_REDACT claim is BLOCKED, not RESTRICTED."

  - name: certification_requirement
    trigger: "POST /records/responsive-records/{id}/redaction-tasks (technician) and POST /records/redaction-tasks/{id}/submit-qa (reviewer)"
    algorithm: threshold
    formula: |
      base_level = (target_type IN {FACE, LICENSE_PLATE}) ? 1 : 2
      if exemption_claim_id is not null
         and the referenced ExemptionClaim.exemption_code == JUVENILE:
          required_level = 3
      else:
          required_level = base_level
      technician_requirement = required_level
      reviewer_requirement   = max(required_level, MIN_REVIEWER_LEVEL)
    input_set: "the task's target_type and, when present, its linked ExemptionClaim"
    constants:
      MIN_REVIEWER_LEVEL: 2
    precision: "integer levels; the comparison is `StaffMember.redaction_certification_level >= requirement`"

  - name: statutory_deadline
    trigger: "POST /records/requests (intake), POST /records/requests/{id}/scope-clarification, POST /records/responsive-records/{id}/inclusion, POST /records/requests/{id}/payments (deposit satisfied)"
    algorithm: forward_looking
    formula: |
      # Step 1 — anchor selection (conditional branch)
      critical_set = ResponsiveRecords of this request with
                     inclusion_status IN {RESPONSIVE, WITHHELD_IN_FULL, RELEASED}
                     whose VideoAsset.is_critical_incident == true
      if is_critical_incident and critical_set is non-empty:
          anchor = MIN(VideoAsset.recorded_start_at) over critical_set
      else:
          anchor = received_at
      # Step 2 — day budget (three additive inputs, one clamped)
      base_days = is_critical_incident ? CRITICAL_INCIDENT_RELEASE_DAYS : STANDARD_RESPONSE_DAYS
      granted   = min(extension_days_granted, MAX_EXTENSION_DAYS)
      budget    = base_days + granted + tolled_days
      # Step 3 — floor guard (nested max; a stale incident date may not shorten the clock)
      statutory_deadline_at = max(anchor + budget days,
                                  received_at + STANDARD_RESPONSE_DAYS days)
    input_set: "is_critical_incident, extension_days_granted, tolled_days, received_at and the earliest critical recorded_start_at; ties on recorded_start_at are irrelevant because MIN is order-independent"
    constants:
      STANDARD_RESPONSE_DAYS: 20
      CRITICAL_INCIDENT_RELEASE_DAYS: 45
      MAX_EXTENSION_DAYS: 10
      DEPOSIT_DUE_DAYS: 30
      APPEAL_WINDOW_DAYS: 30
    precision: "whole days added to an ISO-8601 UTC instant; the time-of-day of the anchor is preserved exactly"
    note: |
      tolled_days is frozen when the qualifying deposit posts:
      tolled_days = max(0, floor((payment_clock - deposit_due_at) / 86400 seconds)).
      Before any deposit is required it is 0, and it is never recomputed afterwards.
      Two further deadlines are struck from the same clock with the same whole-day arithmetic:
      deposit_due_at = the clock at which DEPOSIT_DUE is entered + DEPOSIT_DUE_DAYS days, and
      DenialLetter.appeal_deadline_at = issued_at + APPEAL_WINDOW_DAYS days (inclusive).

  - name: media_production_cost
    trigger: "POST /records/requests/{id}/release-packages (actual production) and step 6 of fee_estimate_total (projection)"
    algorithm: tiered_pricing
    formula: |
      produced_minutes = ceil(SUM(VideoAsset.duration_ms over the included set) / 60000)
      if media_type == DIGITAL_DOWNLOAD:
          disc_count = 0
          production_cost_cents = DIGITAL_DOWNLOAD_CENTS
      elif media_type == DVD:
          disc_count = ceil(produced_minutes / DVD_MINUTES_PER_DISC)
          production_cost_cents = disc_count * DVD_CENTS_PER_DISC
      else:  # USB
          disc_count = ceil(produced_minutes / USB_MINUTES_PER_UNIT)
          production_cost_cents = disc_count * USB_CENTS_PER_UNIT
    input_set: |
      For an actual ReleasePackage the included set is the records this package moved to RELEASED
      (calculations.release_eligible_set). For the projection inside fee_estimate_total the included
      set is the request's ResponsiveRecords with inclusion_status == RESPONSIVE only — records
      already WITHHELD_IN_FULL are never pressed onto media.
    constants:
      DIGITAL_DOWNLOAD_CENTS: 0
      DVD_MINUTES_PER_DISC: 120
      DVD_CENTS_PER_DISC: 500
      USB_MINUTES_PER_UNIT: 240
      USB_CENTS_PER_UNIT: 1500
    precision: "integer cents; ceil on the minute total and again on the unit count"
    note: "Boundary: 120 produced minutes on DVD is exactly 1 disc, 121 minutes is 2. An empty included set yields produced_minutes 0, disc_count 0 and cost 0 for every media type."

  - name: fee_estimate_total
    trigger: "POST /records/requests/{id}/fee-estimates — every field of the new FeeEstimate is pinned by these steps in this order"
    algorithm: forward_looking
    formula: |
      # Step 1 — labour inclusion set (pending review counts, excluded records do not)
      labor_set = ResponsiveRecords of this request with
                  inclusion_status IN {RESPONSIVE, WITHHELD_IN_FULL}
      # Step 2 — review projection (frozen per-record values, never re-derived here)
      projected_review_minutes = SUM(ResponsiveRecord.estimated_review_minutes) over labor_set
      # Step 3 — burden projection, selected by the estimate's declared basis
      projected_burden_minutes =
          (basis == PRESUMPTIVE) ? SUM(presumptive_burden_minutes) over labor_set
                                 : SUM(adjudicated_burden_minutes) over labor_set
      # Step 4 — free allowance is applied ONCE to the combined minute total, never per record
      billable_minutes = max(0, projected_review_minutes + projected_burden_minutes
                                - FREE_ALLOWANCE_MINUTES)
      # Step 5 — labour money, single rounding at the end
      estimated_labor_cents = round_half_up(billable_minutes / 60 * HOURLY_RATE_CENTS)
      # Step 6 — media projection over the NARROWER set (withheld records are never pressed)
      media_set = ResponsiveRecords of this request with inclusion_status == RESPONSIVE
      media_production_cents = calculations.media_production_cost(media_set, this.media_type)
      # Step 7 — pre-waiver subtotal
      subtotal_cents = estimated_labor_cents + media_production_cents
      # Step 8 — public-interest tier, keyed on the PRE-WAIVER subtotal (see note)
      public_interest_pct = PUBLIC_INTEREST_TIER(subtotal_cents)
      # Step 9 — statutory waiver, clamped at 100%
      effective_waiver_pct = min(1.00, Requester.fee_waiver_pct + public_interest_pct)
      # Step 10 — credit and cap
      waiver_credit_cents  = round_half_up(subtotal_cents * effective_waiver_pct)
      estimated_total_cents = min(subtotal_cents - waiver_credit_cents,
                                  STATUTORY_COST_RECOVERY_CAP_CENTS)
      # Step 11 — deposit, strict greater-than at the threshold
      deposit_required_cents = (estimated_total_cents > DEPOSIT_THRESHOLD_CENTS)
                               ? round_half_up(estimated_total_cents * DEPOSIT_PCT)
                               : 0
    input_set: |
      Two different inclusion sets are used inside one calculation: the labour set keeps
      WITHHELD_IN_FULL records (the review labour was really spent), the media set drops them.
      EXCLUDED and CANDIDATE records are in neither. RedactionTask rows are never consulted —
      an estimate is a projection, not a measurement.
    constants:
      HOURLY_RATE_CENTS: 4200
      FREE_ALLOWANCE_MINUTES: 60
      DEPOSIT_THRESHOLD_CENTS: 3500
      DEPOSIT_PCT: 0.50
      STATUTORY_COST_RECOVERY_CAP_CENTS: 50000
      PUBLIC_INTEREST_TIER_T1_MAX_CENTS: 5000       # subtotal <= 5000 -> 0.00
      PUBLIC_INTEREST_TIER_T2_MAX_CENTS: 25000      # 5001..25000     -> 0.10
      PUBLIC_INTEREST_TIER_T1_PCT: 0.00
      PUBLIC_INTEREST_TIER_T2_PCT: 0.10
      PUBLIC_INTEREST_TIER_T3_PCT: 0.20             # subtotal > 25000 -> 0.20
    precision: "integer cents; exactly two roundings occur (step 5 and step 10) and both are round_half_up"
    variants:
      - name: presumptive_basis
        when: "basis == PRESUMPTIVE — the mandatory basis while processing_status IN {INTAKE, SCOPING}, and always permitted afterwards"
        difference: "step 3 sums presumptive_burden_minutes, so ASSERTED claims are billed at full weight; produces the higher quote"
      - name: adjudicated_basis
        when: "basis == ADJUDICATED — permitted only once processing_status IN {EXEMPTION_REVIEW, REDACTION, RELEASE_READY, PARTIALLY_RELEASED}"
        difference: "step 3 sums adjudicated_burden_minutes, so ASSERTED claims contribute nothing; the smaller subtotal can also land in a lower public-interest tier, changing effective_waiver_pct as well as the base amount"
    note: |
      Apparent circularity resolved: the public-interest tier looks like it should be keyed on the
      amount the requester actually owes, which would depend on the waiver, which depends on the
      tier. The pinned reading is step 8 — the tier is ALWAYS keyed on subtotal_cents, the
      pre-waiver figure. Re-keying the tier on estimated_total_cents (the plausible misreading)
      yields a different tier, a different effective_waiver_pct and a different total whenever the
      subtotal sits within one tier width of a boundary.

  - name: fee_invoice_total
    trigger: "POST /records/requests/{id}/invoice"
    algorithm: chronological
    formula: |
      # Step 1 — labour: round EACH approved task, THEN sum (order pinned, see note)
      approved_tasks = RedactionTasks whose responsive_record_id belongs to this request
                       and status == APPROVED, ordered by created_at ASC
      task_cents(t)  = round_half_up(t.approved_labor_minutes / 60 * HOURLY_RATE_CENTS
                                     * TARGET_COMPLEXITY_FACTOR[t.target_type])
      labor_cents    = SUM(task_cents(t)) over approved_tasks
      # Step 2 — review labour on what was actually released, allowance applied once
      released_set   = ResponsiveRecords of this request with inclusion_status == RELEASED
      review_minutes = max(0, SUM(estimated_review_minutes over released_set)
                              - FREE_ALLOWANCE_MINUTES)
      review_cents   = round_half_up(review_minutes / 60 * HOURLY_RATE_CENTS)
      # Step 3 — media actually produced
      media_cents    = SUM(ReleasePackage.production_cost_cents) over packages of this request
      # Step 4 — same tier/waiver ladder as the estimate, keyed on the pre-waiver subtotal
      subtotal_cents        = labor_cents + review_cents + media_cents
      effective_waiver_pct  = min(1.00, Requester.fee_waiver_pct
                                        + PUBLIC_INTEREST_TIER(subtotal_cents))
      waiver_credit_cents   = round_half_up(subtotal_cents * effective_waiver_pct)
      # Step 5 — statutory cost-recovery ceiling binds the invoice, not the subtotal
      invoiced_total_cents  = min(subtotal_cents - waiver_credit_cents,
                                  STATUTORY_COST_RECOVERY_CAP_CENTS)
    input_set: "APPROVED RedactionTasks only — DRAFT, QA_PENDING, QA_REJECTED and CANCELLED tasks contribute nothing even though logged_labor_minutes may be non-zero; RELEASED records only for review labour"
    constants:
      HOURLY_RATE_CENTS: 4200
      FREE_ALLOWANCE_MINUTES: 60
      STATUTORY_COST_RECOVERY_CAP_CENTS: 50000
      TARGET_COMPLEXITY_FACTOR_FACE: 1.00
      TARGET_COMPLEXITY_FACTOR_LICENSE_PLATE: 0.85
      TARGET_COMPLEXITY_FACTOR_AUDIO_IDENTIFIER: 1.15
      TARGET_COMPLEXITY_FACTOR_PROTECTED_CONTENT: 1.30
    precision: |
      integer cents. Step 1 rounds once per task and only then adds — rounding the aggregate
      instead (round_half_up(SUM(minutes * factor) / 60 * rate)) drifts by one or more cents.
      Two LICENSE_PLATE tasks of 5 minutes each: per-task 298 + 298 = 596, aggregate-rounded 595.
    note: |
      The invoice deliberately disagrees with the estimate on identical work: the estimate prices
      projected minutes at the flat HOURLY_RATE_CENTS, the invoice prices measured minutes at the
      rate scaled by TARGET_COMPLEXITY_FACTOR of each task's target_type. A request may therefore
      be invoiced above or below its ACTIVE estimate, and that is not an error condition.

  - name: objection_deadline
    trigger: "POST /records/depicted-individuals/{id}/notification"
    algorithm: forward_looking
    formula: |
      window_days = (DepictedIndividual.relationship == JUVENILE)
                    ? JUVENILE_OBJECTION_WINDOW_DAYS
                    : OBJECTION_WINDOW_DAYS
      objection_deadline_at = notified_at + window_days days
    input_set: "the individual's own relationship plus the logical clock at notification; the deadline is frozen at notification and never recomputed"
    constants:
      OBJECTION_WINDOW_DAYS: 10
      JUVENILE_OBJECTION_WINDOW_DAYS: 15
    precision: "whole days from the logical clock value stored in notified_at"

  - name: release_eligible_set
    trigger: "POST /records/requests/{id}/release-packages — determines exactly which records the package moves to RELEASED"
    algorithm: constraint_propagation
    formula: |
      candidate(r) is TRUE when ALL of the following hold for ResponsiveRecord r:
        1. r.request_id == this request and r.inclusion_status == RESPONSIVE
        2. r.release_posture != BLOCKED
        3. r.unadjudicated_claim_count == 0
        4. every RedactionTask on r has status IN {APPROVED, CANCELLED}
           and at least one has status == APPROVED
        5. r's VideoAsset.disposition_state != PURGED
        6. every DepictedIndividual on r's VideoAsset with notification_required == true
           has notification_status IN {WAIVED, NOT_REQUIRED, OBJECTION_OVERRULED}
           OR (notification_status == NOTIFIED and clock >= objection_deadline_at)
        7. r's VideoAsset has no ACTIVE LitigationHold matching its incident_number
      release_eligible_set = { r : candidate(r) } ordered by created_at ASC
      package_kind = (release_eligible_set == all RESPONSIVE records of the request)
                     ? FINAL : INTERIM
    input_set: "condition 6 is the notification sweep: a NOTIFIED individual whose objection window has expired is swept to WAIVED by this endpoint, and that sweep happens BEFORE eligibility is frozen, so the individual counts as satisfied in the same call"
    precision: "n/a (set selection); an empty set is rejected by validation, never produces an empty package"
    note: "Condition 4 means a record whose every task was CANCELLED by a FULL_WITHHOLD cascade is not releasable even though posture may have returned to RESTRICTED."

  - name: request_billable_labor_minutes
    trigger: "POST /records/redaction-tasks/{id}/qa-outcome (both outcomes), POST /records/exemption-claims/{id}/adjudication (cancellation cascade)"
    algorithm: aggregation
    formula: |
      ResponsiveRecord.approved_labor_minutes =
          SUM(RedactionTask.approved_labor_minutes) over tasks with
          responsive_record_id == this record and status == APPROVED
      PublicRecordsRequest.billable_labor_minutes =
          SUM(ResponsiveRecord.approved_labor_minutes) over records with
          request_id == this request        # EXCLUDED records included: their tasks are CANCELLED anyway
    input_set: "APPROVED tasks only; a task's approved_labor_minutes is zeroed the instant it leaves APPROVED"
    precision: "integer minutes, no rounding"
    note: |
      Conserved quantity (labour): a submit-qa followed by a FAIL qa-outcome must leave
      billable_labor_minutes exactly as it was before the submit-qa, because the task never
      reached APPROVED. A PASS then a later cancellation must also restore the pre-PASS value.
      The invariant is `billable_labor_minutes == SUM over APPROVED tasks` at every observable
      instant, so drift from incremental += bookkeeping is detectable.

  - name: ledger_conservation
    trigger: "POST /records/requests/{id}/payments, POST /records/requests/{id}/invoice, POST /records/fee-ledger-entries/{id}/reversal"
    algorithm: aggregation
    formula: |
      Sign convention: DEPOSIT_PAYMENT and WAIVER_CREDIT are positive, LABOR_CHARGE and
      MEDIA_CHARGE are negative, and a REVERSAL entry carries exactly -1 * target.amount_cents.
      deposit_balance_cents     = SUM(amount_cents) over ALL entries of the request
      deposit_paid_cents        = SUM over DEPOSIT_PAYMENT entries and reversals of such entries
      fee_recognized_cents      = abs(SUM over LABOR_CHARGE / MEDIA_CHARGE entries and reversals of such entries)
      waiver_credit_total_cents = SUM over WAIVER_CREDIT entries and reversals of such entries
      INVARIANT: deposit_balance_cents
                 == deposit_paid_cents + waiver_credit_total_cents - fee_recognized_cents
    input_set: "every FeeLedgerEntry with request_id == this request, in created_at ASC order; the ledger is append-only, so a correction is always a new REVERSAL row and never an edit"
    precision: "integer cents; a charge followed by its reversal returns deposit_balance_cents to the exact pre-charge value with zero drift, while the ledger row count grows by two"

  - name: clip_overlap
    trigger: "POST /records/responsive-records/{id}/redaction-tasks"
    algorithm: interval_merge
    formula: |
      Two RedactionTasks conflict when ALL hold:
        - same responsive_record_id
        - same target_type
        - the existing task's status IN {DRAFT, QA_PENDING, QA_REJECTED, APPROVED}
        - half-open intervals intersect:
              new.clip_start_ms < existing.clip_end_ms
          AND existing.clip_start_ms < new.clip_end_ms
    input_set: "CANCELLED tasks are invisible to this check, so the clip they occupied is immediately reusable"
    precision: |
      Half-open [start, end) with NO buffer: a task ending at 30000 ms and a task starting at
      30000 ms are adjacent, not overlapping, and both are accepted. One millisecond of
      penetration (start 29999) is a conflict. Different target_type on the identical range is
      always accepted — a face blur and a plate blur legitimately cover the same seconds.

  - name: qa_window_conflict
    trigger: "POST /records/redaction-tasks/{id}/submit-qa"
    algorithm: interval_merge
    formula: |
      Two QA assignments conflict when ALL hold:
        - same qa_reviewer_id
        - the existing task's status == QA_PENDING
        - closed intervals inflated by a symmetric buffer intersect:
              new.qa_window_start_at - QA_BUFFER_MINUTES <= existing.qa_window_end_at
          AND existing.qa_window_start_at - QA_BUFFER_MINUTES <= new.qa_window_end_at
    input_set: "only QA_PENDING tasks of the same reviewer; a task that already passed or failed QA frees the reviewer's calendar"
    constants:
      QA_BUFFER_MINUTES: 30
      MAX_CONCURRENT_QA_PER_REVIEWER: 3
    precision: |
      Deliberately different interval semantics from clip_overlap: CLOSED endpoints plus a
      symmetric 30-minute buffer. Two windows that merely touch (one ends 14:00, the next starts
      14:00) conflict here, and so do windows 30 minutes apart; a gap of exactly 31 minutes is
      clear. The same reviewer may hold at most MAX_CONCURRENT_QA_PER_REVIEWER QA_PENDING tasks
      regardless of window placement.

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# The ladder is evaluated top-to-bottom on every request and stops at the first
# violation. Two deliberate cross-band conflicts are pinned in §1.8:
#   * priority 9  (ERR_REQUEST_NOT_RELEASE_READY) beats priority 30 (ERR_DEPOSIT_UNPAID)
#   * priority 12 (ERR_RECORD_RELEASE_BLOCKED)    beats priority 21 (ERR_CLIP_OVERLAP)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty; X-User-Role names a role declared in §1.7; for entity_backed roles X-User-ID resolves to an existing row of the backing entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints including POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "the authenticated role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: business_constraint
    check: "request body parses; every required input field is present and non-null; every enum field holds a declared value; every integer field is an integer within its declared range; pagination limit is in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"

  - priority: 4
    category: existence
    check: "every id embedded in the path exists, validated left-to-right. Mapping: /requests/{id} -> ERR_REQUEST_NOT_FOUND, /video-assets/{id} -> ERR_VIDEO_ASSET_NOT_FOUND, /responsive-records/{id} -> ERR_RESPONSIVE_RECORD_NOT_FOUND, /exemption-claims/{id} -> ERR_EXEMPTION_CLAIM_NOT_FOUND, /redaction-tasks/{id} -> ERR_REDACTION_TASK_NOT_FOUND, /depicted-individuals/{id} -> ERR_DEPICTED_INDIVIDUAL_NOT_FOUND, /denial-letters/{id} -> ERR_DENIAL_LETTER_NOT_FOUND, /litigation-holds/{id} -> ERR_LITIGATION_HOLD_NOT_FOUND, /fee-ledger-entries/{id} -> ERR_LEDGER_ENTRY_NOT_FOUND"
    error_id: ERR_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 5
    category: existence
    check: "every FK supplied in the request body exists. Mapping: requester_id -> ERR_REQUESTER_NOT_FOUND, video_asset_id -> ERR_VIDEO_ASSET_NOT_FOUND, exemption_claim_id -> ERR_EXEMPTION_CLAIM_NOT_FOUND, depicted_individual_id -> ERR_DEPICTED_INDIVIDUAL_NOT_FOUND, assigned_technician_id / qa_reviewer_id / asserted_by_staff_id -> ERR_STAFF_NOT_FOUND"
    error_id: ERR_STAFF_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose input includes a foreign key"

  - priority: 6
    category: auth
    check: "when X-User-Role == Requester, the addressed PublicRecordsRequest.requester_id equals X-User-ID; a requester may never read or act on another requester's request"
    error_id: ERR_REQUESTER_MISMATCH
    http_status: 403
    applies_to: "GET /records/requests/{id}, GET /records/requests, POST /records/requests/{id}/payments, POST /records/denial-letters/{id}/appeal"

  - priority: 7
    category: state
    check: "expected_request_version equals the addressed PublicRecordsRequest.version (see §1.2.1)"
    error_id: ERR_STALE_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /records/requests/{id}/fee-estimates, POST /records/requests/{id}/scope-clarification"

  - priority: 8
    category: state
    check: "the addressed entity is in a state from which the requested transition is declared in §1.2. Mapping: PublicRecordsRequest.processing_status -> ERR_REQUEST_STATE_INVALID, PublicRecordsRequest.fee_status -> ERR_FEE_STATE_INVALID, ResponsiveRecord.inclusion_status -> ERR_RECORD_STATE_INVALID, ExemptionClaim.status != ASSERTED on adjudication -> ERR_CLAIM_ALREADY_ADJUDICATED, RedactionTask.status -> ERR_TASK_STATE_INVALID, DepictedIndividual.notification_status -> ERR_NOTIFICATION_STATE_INVALID, DenialLetter.status -> ERR_LETTER_STATE_INVALID, VideoAsset.disposition_state -> ERR_ASSET_STATE_INVALID, LitigationHold.status -> ERR_HOLD_STATE_INVALID"
    error_id: ERR_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "every write endpoint that drives a §1.2 transition"

  - priority: 9
    category: state
    check: "release requires processing_status IN {RELEASE_READY, PARTIALLY_RELEASED}; invoicing requires processing_status IN {RELEASED, PARTIALLY_RELEASED, DENIED}. Checked before any fiscal check, so an unpaid deposit on a not-yet-ready request reports the readiness failure"
    error_id: ERR_REQUEST_NOT_RELEASE_READY
    http_status: 409
    applies_to: "POST /records/requests/{id}/release-packages, POST /records/requests/{id}/invoice"

  - priority: 10
    category: business_safety
    check: "the acting staff member is not the same person as the counterpart of the duty being separated: adjudication X-User-ID != ExemptionClaim.asserted_by_staff_id; qa-outcome X-User-ID != RedactionTask.assigned_technician_id; submit-qa qa_reviewer_id != RedactionTask.assigned_technician_id; appeal-decision X-User-ID != the LegalCounsel who issued the denial letter"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /records/exemption-claims/{id}/adjudication, POST /records/redaction-tasks/{id}/submit-qa, POST /records/redaction-tasks/{id}/qa-outcome, POST /records/denial-letters/{id}/appeal-decision"

  - priority: 11
    category: business_safety
    check: "the acting or nominated staff member's redaction_certification_level meets calculations.certification_requirement for the task's target_type and linked exemption_code"
    error_id: ERR_CERTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /records/responsive-records/{id}/redaction-tasks, POST /records/redaction-tasks/{id}/submit-qa"

  - priority: 12
    category: business_safety
    check: "the parent ResponsiveRecord.release_posture != BLOCKED — no redaction work may be created for, and no package may include, a record carrying a SUSTAINED FULL_WITHHOLD claim"
    error_id: ERR_RECORD_RELEASE_BLOCKED
    http_status: 409
    applies_to: "POST /records/responsive-records/{id}/redaction-tasks, POST /records/requests/{id}/release-packages"

  - priority: 13
    category: business_safety
    check: "no ExemptionClaim with status == ASSERTED remains on any record the operation would release or deny, and a redaction task may not be approved while the ExemptionClaim named by its exemption_claim_id is still ASSERTED"
    error_id: ERR_UNADJUDICATED_CLAIM
    http_status: 409
    applies_to: "POST /records/requests/{id}/release-packages, POST /records/requests/{id}/denial-letters, POST /records/redaction-tasks/{id}/qa-outcome"

  - priority: 14
    category: business_safety
    check: "every DepictedIndividual with notification_required == true on an included asset is in notification_status WAIVED, NOT_REQUIRED or OBJECTION_OVERRULED, or is NOTIFIED with an expired objection window; an OBJECTED individual or an unexpired NOTIFIED window blocks release"
    error_id: ERR_OBJECTION_UNRESOLVED
    http_status: 409
    applies_to: "POST /records/requests/{id}/release-packages"

  - priority: 15
    category: business_safety
    check: "no LitigationHold with status == ACTIVE has scope_incident_number equal to the VideoAsset.incident_number, and VideoAsset.retention_locked is false where destruction is requested"
    error_id: ERR_RETENTION_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /records/video-assets/{id}/purge, POST /records/requests/{id}/release-packages"

  - priority: 16
    category: business_referential
    check: "cross-parent coherence: exemption_claim_id names a claim whose responsive_record_id equals the path record; depicted_individual_id names an individual whose video_asset_id equals the record's video_asset_id; reverses_entry_id names an entry on the same request"
    error_id: ERR_CLAIM_RECORD_MISMATCH
    http_status: 422
    applies_to: "POST /records/responsive-records/{id}/redaction-tasks, POST /records/responsive-records/{id}/exemption-claims, POST /records/depicted-individuals/{id}/objection, POST /records/fee-ledger-entries/{id}/reversal"

  - priority: 17
    category: business_constraint
    check: "uniqueness. One ResponsiveRecord per (request_id, video_asset_id) -> ERR_DUPLICATE_RESPONSIVE_RECORD; LitigationHold.matter_number globally unique -> ERR_DUPLICATE_MATTER_NUMBER; DepictedIndividual.display_label unique per video_asset_id -> ERR_DUPLICATE_DEPICTED_LABEL. A DepictedIndividual can raise at most one objection because NOTIFIED -> OBJECTED is one-way, so no separate duplicate-objection code is needed"
    error_id: ERR_DUPLICATE_RESPONSIVE_RECORD
    http_status: 409
    applies_to: "POST /records/requests/{id}/responsive-records, POST /records/litigation-holds, POST /records/video-assets/{id}/depicted-individuals, POST /records/depicted-individuals/{id}/objection"

  - priority: 18
    category: business_referential
    check: "statutory_citation exactly equals CITATION_MAP[exemption_code] — ONGOING_INVESTIGATION 119.071(2)(c), PERSONAL_PRIVACY 119.071(4)(d), JUVENILE 985.04(1), VICTIM_PROTECTION 119.071(2)(j), MEDICAL 456.057(7), CONFIDENTIAL_INFORMANT 119.071(2)(f)"
    error_id: ERR_CITATION_MISMATCH
    http_status: 422
    applies_to: "POST /records/responsive-records/{id}/exemption-claims"

  - priority: 19
    category: business_constraint
    check: "FeeEstimate.basis == ADJUDICATED is permitted only when processing_status IN {EXEMPTION_REVIEW, REDACTION, RELEASE_READY, PARTIALLY_RELEASED} — i.e. once at least one record has been ruled responsive; basis == PRESUMPTIVE is mandatory while processing_status IN {INTAKE, SCOPING}"
    error_id: ERR_ESTIMATE_BASIS_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /records/requests/{id}/fee-estimates"

  - priority: 20
    category: business_constraint
    check: "clip range sanity: 0 <= clip_start_ms < clip_end_ms <= the VideoAsset.duration_ms behind the parent record"
    error_id: ERR_INVALID_CLIP_RANGE
    http_status: 422
    applies_to: "POST /records/responsive-records/{id}/redaction-tasks"

  - priority: 21
    category: business_constraint
    check: "no live RedactionTask on the same record with the same target_type overlaps the requested half-open clip interval (see calculations.clip_overlap)"
    error_id: ERR_CLIP_OVERLAP
    http_status: 409
    applies_to: "POST /records/responsive-records/{id}/redaction-tasks"

  - priority: 22
    category: business_constraint
    check: "a Requester with requester_type == COMMERCIAL may not exceed COMMERCIAL_OPEN_REQUEST_LIMIT (3) requests whose processing_status is not RELEASED, DENIED or CLOSED; the check is on the count BEFORE this insert (>= limit rejects)"
    error_id: ERR_OPEN_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /records/requests"

  - priority: 23
    category: business_constraint
    check: "scope_clarification_count < MAX_SCOPE_CLARIFICATIONS (2) before a further clarification is accepted"
    error_id: ERR_SCOPE_CLARIFICATION_LIMIT
    http_status: 409
    applies_to: "POST /records/requests/{id}/scope-clarification"

  - priority: 24
    category: business_constraint
    check: "calculations.release_eligible_set is non-empty for this request"
    error_id: ERR_NO_RELEASABLE_RECORDS
    http_status: 409
    applies_to: "POST /records/requests/{id}/release-packages"

  - priority: 25
    category: business_temporal
    check: "ordered instants: requested_date_from <= requested_date_to on intake and clarification; qa_window_start_at < qa_window_end_at on submit-qa"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /records/requests, POST /records/requests/{id}/scope-clarification, POST /records/redaction-tasks/{id}/submit-qa"

  - priority: 26
    category: business_temporal
    check: "the nominated qa_reviewer_id holds no QA_PENDING task whose buffered window intersects the requested window (see calculations.qa_window_conflict)"
    error_id: ERR_QA_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /records/redaction-tasks/{id}/submit-qa"

  - priority: 27
    category: business_constraint
    check: "the nominated qa_reviewer_id holds fewer than MAX_CONCURRENT_QA_PER_REVIEWER (3) QA_PENDING tasks; evaluated after the window check so a conflicting window is reported even when the reviewer is also at capacity"
    error_id: ERR_QA_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /records/redaction-tasks/{id}/submit-qa"

  - priority: 28
    category: business_temporal
    check: "windows are open: an appeal requires clock <= DenialLetter.appeal_deadline_at; an objection requires clock <= DepictedIndividual.objection_deadline_at"
    error_id: ERR_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /records/denial-letters/{id}/appeal, POST /records/depicted-individuals/{id}/objection"

  - priority: 29
    category: business_temporal
    check: "clock >= VideoAsset.scheduled_purge_at before destruction is permitted"
    error_id: ERR_PURGE_NOT_DUE
    http_status: 409
    applies_to: "POST /records/video-assets/{id}/purge"

  - priority: 30
    category: business_fiscal
    check: "the request's outstanding deposit is satisfied: deposit_paid_cents >= deposit_required_cents, or fee_status IN {WAIVED, DEPOSIT_PAID, INVOICED, SETTLED}. Deliberately below priority 9, so a release attempt on a request that is neither release-ready nor paid reports ERR_REQUEST_NOT_RELEASE_READY"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 402
    applies_to: "POST /records/requests/{id}/release-packages, POST /records/responsive-records/{id}/redaction-tasks"

  - priority: 31
    category: business_fiscal
    check: "amount_cents > 0 on every payment"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /records/requests/{id}/payments"

  - priority: 32
    category: business_fiscal
    check: "a payment may not exceed the amount still owed: amount_cents <= max(deposit_required_cents - deposit_paid_cents, invoiced_total_cents - deposit_paid_cents) evaluated against the request's current fee_status"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /records/requests/{id}/payments"

  - priority: 33
    category: business_fiscal
    check: "the targeted FeeLedgerEntry has entry_type != REVERSAL and is not already referenced by an existing REVERSAL entry's reverses_entry_id"
    error_id: ERR_ENTRY_ALREADY_REVERSED
    http_status: 409
    applies_to: "POST /records/fee-ledger-entries/{id}/reversal"

# =============================================================================
# §1.5 API Endpoint Table
# 27 write endpoints + 21 read endpoints. Every state in §1.2 is reachable from an
# empty database by composing these calls only; no seeding back door exists.
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- directory
  - method: POST
    path: "/records/staff"
    description: "Register a records-unit staff member (counsel, technician, reviewer or supervisor)"
    roles: [RecordsSupervisor]
    code: 201
    input: [full_name, role_type, redaction_certification_level]
    output: StaffMember
    side_effects: ["open_qa_assignment_count initialised to 0"]

  - method: POST
    path: "/records/requesters"
    description: "Register a public-records requester and freeze their statutory fee-waiver fraction"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 201
    input: [full_name, email, requester_type, "indigency_certified?"]
    output: Requester
    side_effects: ["fee_waiver_pct computed once: 1.00 when indigency_certified, else 0.25 for MEDIA, else 0.00", "open_request_count initialised to 0"]

  # ------------------------------------------------------------- video assets
  - method: POST
    path: "/records/video-assets"
    description: "Catalogue a body-worn camera recording together with its retention schedule"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 201
    input: [incident_number, device_serial, officer_badge, recorded_start_at, duration_ms, classification, retention_category, scheduled_purge_at, "is_critical_incident?"]
    output: VideoAsset
    side_effects:
      - "disposition_state = SCHEDULED, depicted_individual_count = 0"
      - "retention_locked recomputed from ACTIVE LitigationHold rows matching incident_number"
      - "if an ACTIVE LitigationHold already covers incident_number: disposition_state = SUSPENDED, suspended_by_hold_id = that hold (smallest created_at), hold.suspended_asset_count += 1"

  - method: POST
    path: "/records/video-assets/{id}/depicted-individuals"
    description: "Log a person depicted in the recording; sets whether pre-release notification is statutorily required"
    roles: [RecordsClerk, LegalCounsel]
    code: 201
    input: [display_label, relationship]
    output: DepictedIndividual
    side_effects:
      - "notification_required = relationship IN {VICTIM, JUVENILE, WITNESS}"
      - "notification_status = notification_required ? PENDING : NOT_REQUIRED"
      - "VideoAsset.depicted_individual_count += 1"

  - method: POST
    path: "/records/video-assets/{id}/purge"
    description: "Execute the retention schedule and destroy the recording"
    roles: [RecordsSupervisor]
    code: 200
    input: ["destruction_note?"]
    output: VideoAsset
    side_effects:
      - "disposition_state SCHEDULED -> PURGED"
      - "rejected by ERR_RETENTION_HOLD_ACTIVE while retention_locked, and by ERR_PURGE_NOT_DUE before scheduled_purge_at"

  # ----------------------------------------------------------------- requests
  - method: POST
    path: "/records/requests"
    description: "Intake a public records request and start the statutory response clock"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 201
    input: [requester_id, received_at, subject_incident_number, requested_date_from, requested_date_to, scope_narrative, "extension_days_granted?"]
    output: PublicRecordsRequest
    side_effects:
      - "processing_status = INTAKE, fee_status = NOT_ASSESSED, version = 1"
      - "statutory_deadline_at from calculations.statutory_deadline with is_critical_incident false (no records yet)"
      - "Requester.open_request_count += 1"

  - method: POST
    path: "/records/requests/{id}/scope-clarification"
    description: "Record a clarified scope, optionally granting a statutory extension; supersedes the prior scope and any live estimate"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 200
    input: [scope_narrative, requested_date_from, requested_date_to, expected_request_version, "extension_days_granted?"]
    output: PublicRecordsRequest
    side_effects:
      - "processing_status INTAKE -> SCOPING (idempotent when already SCOPING)"
      - "scope_clarification_count += 1, scope_narrative replaced wholesale, version += 1"
      - "statutory_deadline_at recomputed with the new extension_days_granted"
      - "any FeeEstimate with status == ACTIVE on this request -> STALE"

  - method: POST
    path: "/records/requests/{id}/responsive-records"
    description: "Attach a candidate recording to the request as a request-scoped responsive record"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 201
    input: [video_asset_id]
    output: ResponsiveRecord
    side_effects:
      - "inclusion_status = CANDIDATE, release_posture = OPEN"
      - "estimated_review_minutes from calculations.record_review_minutes"
      - "presumptive_burden_minutes = adjudicated_burden_minutes = baseline obscuration minutes"
      - "PublicRecordsRequest.responsive_record_count recomputed"
      - "VideoAsset.retention_locked recomputed (an open request locks the asset)"

  - method: POST
    path: "/records/responsive-records/{id}/inclusion"
    description: "Rule a candidate record responsive or non-responsive, opening exemption review. inclusion_status is one of RESPONSIVE, EXCLUDED"
    roles: [RecordsClerk, LegalCounsel, RecordsSupervisor]
    code: 200
    input: [inclusion_status]
    output: ResponsiveRecord
    side_effects:
      - "inclusion_status CANDIDATE -> RESPONSIVE or CANDIDATE -> EXCLUDED"
      - "request.is_critical_incident, statutory_deadline_at, responsive_record_count, open_notification_count recomputed"
      - "processing_status SCOPING -> EXEMPTION_REVIEW on the first RESPONSIVE record"
      - "VideoAsset.retention_locked recomputed on EXCLUDED"

  # --------------------------------------------------------- exemption review
  - method: POST
    path: "/records/responsive-records/{id}/exemption-claims"
    description: "Assert a statutory exemption against a responsive record"
    roles: [LegalCounsel]
    code: 201
    input: [exemption_code, statutory_citation, asserted_scope]
    output: ExemptionClaim
    side_effects:
      - "status = ASSERTED, claim_source = STAFF_ANALYSIS, asserted_by_staff_id = X-User-ID"
      - "estimated_redaction_minutes from calculations.claim_redaction_minutes"
      - "record presumptive_burden_minutes, release_posture and unadjudicated_claim_count recomputed"
      - "request.unadjudicated_claim_count recomputed"
      - "any FeeEstimate with status == ACTIVE on the record's request -> STALE"

  - method: POST
    path: "/records/exemption-claims/{id}/adjudication"
    description: "Sustain, overrule or withdraw an asserted exemption; drives the four-level withholding cascade. disposition is one of SUSTAINED, OVERRULED, WITHDRAWN and names the target claim status"
    roles: [LegalCounsel]
    code: 200
    input: [disposition, "adjudication_note?"]
    output: ExemptionClaim
    side_effects:
      - "status ASSERTED -> SUSTAINED | OVERRULED | WITHDRAWN, adjudicated_by_staff_id = X-User-ID, adjudicated_at = clock"
      - "record adjudicated_burden_minutes / presumptive_burden_minutes / release_posture / unadjudicated_claim_count recomputed"
      - "SUSTAINED + FULL_WITHHOLD: record -> WITHHELD_IN_FULL, every non-terminal RedactionTask on it -> CANCELLED, request.billable_labor_minutes recomputed"
      - "claim_source == DEPICTED_OBJECTION: the linked DepictedIndividual -> OBJECTION_SUSTAINED (SUSTAINED) or OBJECTION_OVERRULED (OVERRULED/WITHDRAWN)"
      - "request.unadjudicated_claim_count recomputed; processing_status EXEMPTION_REVIEW -> RELEASE_READY when no claims remain ASSERTED and no live RedactionTask exists"
      - "any FeeEstimate with status == ACTIVE on the request -> STALE"

  # ------------------------------------------------------ redaction production
  - method: POST
    path: "/records/responsive-records/{id}/redaction-tasks"
    description: "Open a redaction task over a clip range for one obscuration target"
    roles: [RedactionTechnician, RecordsSupervisor]
    code: 201
    input: [target_type, clip_start_ms, clip_end_ms, assigned_technician_id, "exemption_claim_id?"]
    output: RedactionTask
    side_effects:
      - "status = DRAFT, rework_count = 0, logged_labor_minutes = 0, approved_labor_minutes = 0, defect_codes = []"
      - "request processing_status EXEMPTION_REVIEW -> REDACTION on the first task"

  - method: POST
    path: "/records/redaction-tasks/{id}/submit-qa"
    description: "Submit finished redaction work and book a quality reviewer's window"
    roles: [RedactionTechnician]
    code: 200
    input: [logged_labor_minutes, qa_reviewer_id, qa_window_start_at, qa_window_end_at]
    output: RedactionTask
    side_effects:
      - "status DRAFT -> QA_PENDING, or QA_REJECTED -> QA_PENDING with rework_count += 1"
      - "qa_reviewer_id, qa_window_start_at, qa_window_end_at and logged_labor_minutes overwritten by this call"
      - "StaffMember.open_qa_assignment_count += 1 for the nominated reviewer"
      - "billable_labor_minutes is NOT touched — the task has not been approved"

  - method: POST
    path: "/records/redaction-tasks/{id}/qa-outcome"
    description: "Record the quality review verdict on a submitted redaction task. outcome is one of PASS, FAIL"
    roles: [QualityReviewer]
    code: 200
    input: [outcome, "defect_codes?"]
    output: RedactionTask
    side_effects:
      - "PASS: status QA_PENDING -> APPROVED, approved_labor_minutes = logged_labor_minutes, defect_codes = []"
      - "FAIL: status QA_PENDING -> QA_REJECTED, approved_labor_minutes = 0, defect_codes stored"
      - "reviewer open_qa_assignment_count -= 1"
      - "record approved_labor_minutes and redacted_segment_ms recomputed; request.billable_labor_minutes recomputed"
      - "request processing_status REDACTION -> RELEASE_READY when every task on the request is APPROVED or CANCELLED"

  # ----------------------------------------------- notification and objections
  - method: POST
    path: "/records/depicted-individuals/{id}/notification"
    description: "Issue the statutory pre-release notice to a depicted individual and start their objection window"
    roles: [RecordsClerk]
    code: 200
    input: [notice_method]
    output: DepictedIndividual
    side_effects:
      - "notification_status PENDING -> NOTIFIED, notified_at = clock, notice_method stored"
      - "objection_deadline_at from calculations.objection_deadline"
      - "request.open_notification_count recomputed for every request holding this asset"

  - method: POST
    path: "/records/depicted-individuals/{id}/objection"
    description: "Record a depicted individual's objection; materializes it as an adjudicable exemption claim on the named record"
    roles: [RecordsClerk, LegalCounsel]
    code: 201
    input: [objection_basis, responsive_record_id]
    output: ExemptionClaim
    side_effects:
      - "DepictedIndividual notification_status NOTIFIED -> OBJECTED, objection_basis stored"
      - "creates ExemptionClaim on responsive_record_id with claim_source = DEPICTED_OBJECTION, depicted_individual_id = path id, asserted_by_staff_id = null, status = ASSERTED, asserted_scope = PARTIAL_REDACT"
      - "exemption_code and statutory_citation derived from objection_basis via the objection mapping and CITATION_MAP — never supplied by the caller"
      - "estimated_redaction_minutes, record burdens / release_posture / unadjudicated_claim_count and request.unadjudicated_claim_count recomputed"
      - "any FeeEstimate with status == ACTIVE on the record's request -> STALE"

  # ------------------------------------------------------------ cost recovery
  - method: POST
    path: "/records/requests/{id}/fee-estimates"
    description: "Issue a cost-recovery estimate on the declared basis, superseding any live estimate"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 201
    input: [basis, media_type, expected_request_version]
    output: FeeEstimate
    side_effects:
      - "sequence_number = prior estimate count + 1; every prior ACTIVE or STALE estimate on the request -> SUPERSEDED; this one is ACTIVE"
      - "all money fields pinned by calculations.fee_estimate_total"
      - "request.estimated_total_cents / deposit_required_cents mirrored; request.version += 1"
      - "fee_status -> WAIVED when estimated_total_cents == 0, else DEPOSIT_DUE when deposit_required_cents > 0 (deposit_due_at = clock + DEPOSIT_DUE_DAYS), else ESTIMATED"

  - method: POST
    path: "/records/requests/{id}/payments"
    description: "Post a payment against the request's cost-recovery account"
    roles: [Requester, RecordsClerk]
    code: 201
    input: [amount_cents, "memo?"]
    output: FeeLedgerEntry
    side_effects:
      - "append-only FeeLedgerEntry with entry_type = DEPOSIT_PAYMENT, source_kind = DEPOSIT, amount_cents positive"
      - "request deposit_paid_cents and deposit_balance_cents recomputed by calculations.ledger_conservation"
      - "fee_status DEPOSIT_DUE -> DEPOSIT_PAID once deposit_paid_cents >= deposit_required_cents; INVOICED -> SETTLED once deposit_paid_cents >= invoiced_total_cents"
      - "on the transition into DEPOSIT_PAID: tolled_days frozen and statutory_deadline_at recomputed"

  - method: POST
    path: "/records/requests/{id}/invoice"
    description: "Issue the final cost-recovery invoice from measured redaction labour and produced media"
    roles: [RecordsSupervisor]
    code: 200
    input: ["memo?"]
    output: PublicRecordsRequest
    side_effects:
      - "invoiced_total_cents pinned by calculations.fee_invoice_total"
      - "appends LABOR_CHARGE (negative), MEDIA_CHARGE (negative) and WAIVER_CREDIT (positive) FeeLedgerEntry rows, in that order, all with source_kind = INVOICE; a component of 0 is skipped entirely, because amount_cents is never zero"
      - "fee_recognized_cents, waiver_credit_total_cents and deposit_balance_cents recomputed"
      - "fee_status -> SETTLED when deposit_paid_cents >= invoiced_total_cents, else INVOICED"
      - "processing_status RELEASED -> CLOSED when fee_status becomes SETTLED"

  - method: POST
    path: "/records/fee-ledger-entries/{id}/reversal"
    description: "Reverse a posted ledger entry with a compensating append-only entry"
    roles: [RecordsSupervisor]
    code: 201
    input: [memo]
    output: FeeLedgerEntry
    side_effects:
      - "appends FeeLedgerEntry with entry_type = REVERSAL, source_kind = ADJUSTMENT, reverses_entry_id = path id, amount_cents = -1 * target.amount_cents"
      - "every derived money field on the request recomputed; deposit_balance_cents returns to its exact pre-target value"
      - "fee_status SETTLED -> INVOICED when the reversal leaves deposit_paid_cents < invoiced_total_cents"
      - "processing_status CLOSED is NOT reopened by a reversal"

  # ---------------------------------------------------------------- production
  - method: POST
    path: "/records/requests/{id}/release-packages"
    description: "Produce a release package over every currently releasable record, sweeping expired objection windows first"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 201
    input: [media_type]
    output: ReleasePackage
    side_effects:
      - "notification sweep first: every notification_required DepictedIndividual on the request's RESPONSIVE assets with notification_status == NOTIFIED and clock >= objection_deadline_at -> WAIVED, counted in waived_notification_count"
      - "release_eligible_set frozen after the sweep; each member ResponsiveRecord RESPONSIVE -> RELEASED with released_at = clock"
      - "included_record_count, produced_minutes, disc_count and production_cost_cents from calculations.media_production_cost"
      - "package_kind = FINAL when the set covered every RESPONSIVE record, else INTERIM"
      - "processing_status -> RELEASED when no RESPONSIVE record remains, else PARTIALLY_RELEASED"
      - "VideoAsset.retention_locked recomputed for every released asset"

  # ------------------------------------------------------- denial and appeals
  - method: POST
    path: "/records/requests/{id}/denial-letters"
    description: "Issue a denial letter carrying statutory citations and the appeal pathway"
    roles: [LegalCounsel]
    code: 201
    input: [denial_type, appeal_pathway_note]
    output: DenialLetter
    side_effects:
      - "status = ISSUED, issued_at = clock, appeal_deadline_at = clock + APPEAL_WINDOW_DAYS"
      - "statutory_citations derived from the distinct statutory_citation values of the request's SUSTAINED claims, deduplicated and sorted ascending; appeal_authority = SUPERIOR_COURT for FULL, DISTRICT_ATTORNEY for PARTIAL"
      - "withheld_record_count = count of the request's records with inclusion_status == WITHHELD_IN_FULL"
      - "processing_status EXEMPTION_REVIEW -> DENIED when denial_type == FULL; unchanged for PARTIAL"

  - method: POST
    path: "/records/denial-letters/{id}/appeal"
    description: "File the requester's administrative appeal against a denial"
    roles: [Requester]
    code: 200
    input: [appeal_grounds]
    output: DenialLetter
    side_effects:
      - "status ISSUED -> APPEALED, appeal_filed_at = clock, appeal_grounds stored"
      - "rejected by ERR_WINDOW_CLOSED once clock exceeds appeal_deadline_at"

  - method: POST
    path: "/records/denial-letters/{id}/appeal-decision"
    description: "Decide the appeal; a reversal reopens exemption review on a closed-out denial. decision is one of UPHELD, REVERSED"
    roles: [LegalCounsel]
    code: 200
    input: [decision]
    output: DenialLetter
    side_effects:
      - "status APPEALED -> UPHELD | REVERSED, appeal_decided_at = clock"
      - "UPHELD: request processing_status DENIED -> CLOSED"
      - "REVERSED: request processing_status DENIED -> EXEMPTION_REVIEW, and every ExemptionClaim on the request with status == SUSTAINED -> WITHDRAWN with the record cascade of each withdrawal applied"

  # ---------------------------------------------------- retention and holds
  - method: POST
    path: "/records/litigation-holds"
    description: "Place a litigation hold over every recording of an incident"
    roles: [LegalCounsel]
    code: 201
    input: [matter_number, scope_incident_number, hold_type]
    output: LitigationHold
    side_effects:
      - "status = ACTIVE, placed_at = clock"
      - "every VideoAsset with incident_number == scope_incident_number: retention_locked = true and disposition_state SCHEDULED -> SUSPENDED with suspended_by_hold_id = this hold"
      - "suspended_asset_count = number of assets this hold suspended; already-PURGED assets are skipped"

  - method: POST
    path: "/records/litigation-holds/{id}/release"
    description: "Lift a litigation hold and return unheld recordings to their retention schedule"
    roles: [LegalCounsel]
    code: 200
    input: ["release_note?"]
    output: LitigationHold
    side_effects:
      - "status ACTIVE -> RELEASED, released_at = clock, suspended_asset_count = 0"
      - "every VideoAsset with suspended_by_hold_id == this hold: reassigned to the remaining ACTIVE hold with the smallest created_at, or SUSPENDED -> SCHEDULED with suspended_by_hold_id = null when none remains"
      - "retention_locked recomputed per asset (an open request keeps it locked even with no hold)"

  # ------------------------------------------------------ test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z and the server never falls back to wall-clock time; every deadline, objection window and purge check reads this clock."
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel, Requester]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent reads of the logical clock return current_utc"]

  # ------------------------------------------------- reads: single resources
  - method: GET
    path: "/records/staff/{id}"
    description: "Fetch one records-unit staff member"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/records/requesters/{id}"
    description: "Fetch one requester with their frozen waiver fraction and open-request count"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: []
    output: Requester
    side_effects: []

  - method: GET
    path: "/records/requests/{id}"
    description: "Fetch one public records request with both state dimensions and every derived money and labour field"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel, Requester]
    code: 200
    input: []
    output: PublicRecordsRequest
    side_effects: []

  - method: GET
    path: "/records/video-assets/{id}"
    description: "Fetch one recording with its retention posture"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel]
    code: 200
    input: []
    output: VideoAsset
    side_effects: []

  - method: GET
    path: "/records/depicted-individuals/{id}"
    description: "Fetch one depicted individual with their notification and objection posture"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: []
    output: DepictedIndividual
    side_effects: []

  - method: GET
    path: "/records/responsive-records/{id}"
    description: "Fetch one request-scoped responsive record with both burden variants and its release posture"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel]
    code: 200
    input: []
    output: ResponsiveRecord
    side_effects: []

  - method: GET
    path: "/records/exemption-claims/{id}"
    description: "Fetch one exemption claim with its adjudication position"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: []
    output: ExemptionClaim
    side_effects: []

  - method: GET
    path: "/records/redaction-tasks/{id}"
    description: "Fetch one redaction task with its QA booking and labour figures"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel]
    code: 200
    input: []
    output: RedactionTask
    side_effects: []

  - method: GET
    path: "/records/fee-ledger-entries/{id}"
    description: "Fetch one immutable cost-recovery ledger entry"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 200
    input: []
    output: FeeLedgerEntry
    side_effects: []

  - method: GET
    path: "/records/litigation-holds/{id}"
    description: "Fetch one litigation hold with its suspended-asset count"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: []
    output: LitigationHold
    side_effects: []

  - method: GET
    path: "/records/denial-letters/{id}"
    description: "Fetch one denial letter with its appeal position"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel, Requester]
    code: 200
    input: []
    output: DenialLetter
    side_effects: []

  # ------------------------------------------------- reads: filtered lists
  - method: GET
    path: "/records/requests"
    description: "List public records requests, filterable by requester and by either state dimension"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel, Requester]
    code: 200
    input: ["requester_id?", "processing_status?", "fee_status?", "limit?", "offset?"]
    output: PublicRecordsRequest[]
    side_effects: []

  - method: GET
    path: "/records/video-assets"
    description: "List recordings, filterable by incident, retention posture and suspending hold"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: ["incident_number?", "suspended_by_hold_id?", "disposition_state?", "limit?", "offset?"]
    output: VideoAsset[]
    side_effects: []

  - method: GET
    path: "/records/responsive-records"
    description: "List responsive records, filterable by request, recording and inclusion posture"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel]
    code: 200
    input: ["request_id?", "video_asset_id?", "inclusion_status?", "release_posture?", "limit?", "offset?"]
    output: ResponsiveRecord[]
    side_effects: []

  - method: GET
    path: "/records/exemption-claims"
    description: "List exemption claims, filterable by record, depicted individual, asserting and adjudicating staff"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: ["responsive_record_id?", "depicted_individual_id?", "asserted_by_staff_id?", "adjudicated_by_staff_id?", "status?", "claim_source?", "limit?", "offset?"]
    output: ExemptionClaim[]
    side_effects: []

  - method: GET
    path: "/records/redaction-tasks"
    description: "List redaction tasks, filterable by record, implementing claim, technician and QA reviewer"
    roles: [RecordsClerk, RecordsSupervisor, RedactionTechnician, QualityReviewer, LegalCounsel]
    code: 200
    input: ["responsive_record_id?", "exemption_claim_id?", "assigned_technician_id?", "qa_reviewer_id?", "status?", "limit?", "offset?"]
    output: RedactionTask[]
    side_effects: []

  - method: GET
    path: "/records/fee-ledger-entries"
    description: "List cost-recovery ledger entries in created_at ASC order, filterable by request, type and reversal target"
    roles: [RecordsClerk, RecordsSupervisor]
    code: 200
    input: ["request_id?", "reverses_entry_id?", "entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  # ------------------------------------------------- reads: sub-resources
  - method: GET
    path: "/records/video-assets/{id}/depicted-individuals"
    description: "List the people depicted in one recording"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel]
    code: 200
    input: ["notification_status?", "limit?", "offset?"]
    output: DepictedIndividual[]
    side_effects: []

  - method: GET
    path: "/records/requests/{id}/fee-estimates"
    description: "List every estimate ever issued on the request, newest sequence_number last"
    roles: [RecordsClerk, RecordsSupervisor, Requester]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FeeEstimate[]
    side_effects: []

  - method: GET
    path: "/records/requests/{id}/denial-letters"
    description: "List the denial letters issued on the request"
    roles: [RecordsClerk, RecordsSupervisor, LegalCounsel, Requester]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DenialLetter[]
    side_effects: []

  - method: GET
    path: "/records/requests/{id}/release-packages"
    description: "List the release packages produced for the request"
    roles: [RecordsClerk, RecordsSupervisor, Requester]
    code: 200
    input: ["limit?", "offset?"]
    output: ReleasePackage[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# Every code below is triggerable from at least one §1.5 endpoint; the §1.4
# priority column governs which one surfaces when several conditions hold.
# =============================================================================
errors:

  # -- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/empty, role not declared in §1.7, or an entity_backed role whose X-User-ID resolves to no row"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "authenticated role is not listed in the target endpoint's roles"
  - id: ERR_REQUESTER_MISMATCH
    http: 403
    condition: "acting as Requester on a PublicRecordsRequest whose requester_id != X-User-ID"

  # -- schema ----------------------------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "unparseable body, missing required input field, undeclared enum value, non-integer or out-of-range numeric, limit outside [1,100] or negative offset"

  # -- existence -------------------------------------------------------------
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "no PublicRecordsRequest with the addressed id"
  - id: ERR_REQUESTER_NOT_FOUND
    http: 404
    condition: "requester_id in the body names no Requester"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "assigned_technician_id, qa_reviewer_id or an addressed staff id names no StaffMember"
  - id: ERR_VIDEO_ASSET_NOT_FOUND
    http: 404
    condition: "no VideoAsset with the addressed or referenced id"
  - id: ERR_RESPONSIVE_RECORD_NOT_FOUND
    http: 404
    condition: "no ResponsiveRecord with the addressed or referenced id"
  - id: ERR_EXEMPTION_CLAIM_NOT_FOUND
    http: 404
    condition: "no ExemptionClaim with the addressed or referenced id"
  - id: ERR_REDACTION_TASK_NOT_FOUND
    http: 404
    condition: "no RedactionTask with the addressed id"
  - id: ERR_DEPICTED_INDIVIDUAL_NOT_FOUND
    http: 404
    condition: "no DepictedIndividual with the addressed or referenced id"
  - id: ERR_DENIAL_LETTER_NOT_FOUND
    http: 404
    condition: "no DenialLetter with the addressed id"
  - id: ERR_LITIGATION_HOLD_NOT_FOUND
    http: 404
    condition: "no LitigationHold with the addressed id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "no FeeLedgerEntry with the addressed id"

  # -- concurrency -----------------------------------------------------------
  - id: ERR_STALE_REQUEST_VERSION
    http: 412
    condition: "expected_request_version does not equal the addressed PublicRecordsRequest.version (§1.2.1)"

  # -- state -----------------------------------------------------------------
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "the request's processing_status admits no such transition, e.g. attaching a responsive record to a CLOSED request or clarifying scope after EXEMPTION_REVIEW"
  - id: ERR_FEE_STATE_INVALID
    http: 409
    condition: "the request's fee_status admits no such transition, e.g. invoicing a request whose fee_status is NOT_ASSESSED or paying a WAIVED request"
  - id: ERR_RECORD_STATE_INVALID
    http: 409
    condition: "the record's inclusion_status admits no such transition, e.g. ruling inclusion twice or claiming an exemption on an EXCLUDED or RELEASED record"
  - id: ERR_CLAIM_ALREADY_ADJUDICATED
    http: 409
    condition: "adjudicating an ExemptionClaim whose status is not ASSERTED"
  - id: ERR_TASK_STATE_INVALID
    http: 409
    condition: "the task's status admits no such transition, e.g. submit-qa on a QA_PENDING or CANCELLED task, or qa-outcome on a DRAFT task"
  - id: ERR_NOTIFICATION_STATE_INVALID
    http: 409
    condition: "notifying an individual whose notification_status is not PENDING, or recording an objection from one who is not NOTIFIED"
  - id: ERR_LETTER_STATE_INVALID
    http: 409
    condition: "appealing a letter that is not ISSUED, or deciding an appeal on a letter that is not APPEALED"
  - id: ERR_ASSET_STATE_INVALID
    http: 409
    condition: "purging an asset whose disposition_state is SUSPENDED or already PURGED, or attaching a PURGED asset to a request"
  - id: ERR_HOLD_STATE_INVALID
    http: 409
    condition: "releasing a LitigationHold whose status is already RELEASED"
  - id: ERR_REQUEST_NOT_RELEASE_READY
    http: 409
    condition: "producing a release package outside {RELEASE_READY, PARTIALLY_RELEASED}, or invoicing outside {RELEASED, PARTIALLY_RELEASED, DENIED}"

  # -- safety / compliance ---------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting staff member is the counterpart of the separated duty: adjudicating one's own exemption claim, reviewing one's own redaction, nominating oneself as QA reviewer, or deciding the appeal of one's own denial letter"
  - id: ERR_CERTIFICATION_INSUFFICIENT
    http: 422
    condition: "redaction_certification_level below calculations.certification_requirement for the task's target_type or its linked JUVENILE claim"
  - id: ERR_RECORD_RELEASE_BLOCKED
    http: 409
    condition: "the record's release_posture is BLOCKED by a SUSTAINED FULL_WITHHOLD claim"
  - id: ERR_UNADJUDICATED_CLAIM
    http: 409
    condition: "an ExemptionClaim with status == ASSERTED still stands on a record the operation would release or deny, or a QA pass is attempted on a task implementing a still-ASSERTED claim"
  - id: ERR_OBJECTION_UNRESOLVED
    http: 409
    condition: "a notification-required depicted individual is OBJECTED, or is NOTIFIED with an objection window that has not expired"
  - id: ERR_RETENTION_HOLD_ACTIVE
    http: 409
    condition: "an ACTIVE LitigationHold covers the asset's incident_number, or the asset is otherwise retention_locked"

  # -- referential coherence -------------------------------------------------
  - id: ERR_CLAIM_RECORD_MISMATCH
    http: 422
    condition: "exemption_claim_id belongs to a different responsive record, depicted_individual_id belongs to a different recording, or reverses_entry_id belongs to a different request"
  - id: ERR_CITATION_MISMATCH
    http: 422
    condition: "statutory_citation is not CITATION_MAP[exemption_code] for the asserted exemption"

  # -- constraints -----------------------------------------------------------
  - id: ERR_DUPLICATE_RESPONSIVE_RECORD
    http: 409
    condition: "a ResponsiveRecord already links this (request_id, video_asset_id) pair"
  - id: ERR_DUPLICATE_MATTER_NUMBER
    http: 409
    condition: "a LitigationHold already carries this matter_number"
  - id: ERR_DUPLICATE_DEPICTED_LABEL
    http: 409
    condition: "the recording already has a DepictedIndividual with this display_label"
  - id: ERR_ESTIMATE_BASIS_NOT_PERMITTED
    http: 422
    condition: "basis == ADJUDICATED while processing_status is INTAKE or SCOPING, i.e. before any record has been ruled responsive"
  - id: ERR_INVALID_CLIP_RANGE
    http: 422
    condition: "clip_start_ms < 0, clip_end_ms <= clip_start_ms, or clip_end_ms beyond the recording's duration_ms"
  - id: ERR_CLIP_OVERLAP
    http: 409
    condition: "a live RedactionTask on the same record and target_type already covers part of the half-open clip interval"
  - id: ERR_OPEN_REQUEST_LIMIT
    http: 409
    condition: "a COMMERCIAL requester already holds COMMERCIAL_OPEN_REQUEST_LIMIT open requests"
  - id: ERR_SCOPE_CLARIFICATION_LIMIT
    http: 409
    condition: "scope_clarification_count already equals MAX_SCOPE_CLARIFICATIONS"
  - id: ERR_NO_RELEASABLE_RECORDS
    http: 409
    condition: "calculations.release_eligible_set is empty after the notification sweep"
  - id: ERR_QA_LOAD_EXCEEDED
    http: 409
    condition: "the nominated reviewer already holds MAX_CONCURRENT_QA_PER_REVIEWER QA_PENDING tasks"

  # -- temporal --------------------------------------------------------------
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "requested_date_from after requested_date_to, or qa_window_start_at not before qa_window_end_at"
  - id: ERR_QA_WINDOW_CONFLICT
    http: 409
    condition: "the nominated reviewer holds a QA_PENDING task whose window, inflated by QA_BUFFER_MINUTES, intersects the requested window"
  - id: ERR_WINDOW_CLOSED
    http: 409
    condition: "an appeal is filed after appeal_deadline_at, or an objection is recorded after objection_deadline_at"
  - id: ERR_PURGE_NOT_DUE
    http: 409
    condition: "the logical clock has not reached the asset's scheduled_purge_at"

  # -- fiscal ----------------------------------------------------------------
  - id: ERR_DEPOSIT_UNPAID
    http: 402
    condition: "deposit_paid_cents is below deposit_required_cents and fee_status is DEPOSIT_DUE"
  - id: ERR_INVALID_AMOUNT
    http: 422
    condition: "amount_cents is zero or negative"
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "the payment would push deposit_paid_cents above what the request currently owes"
  - id: ERR_ENTRY_ALREADY_REVERSED
    http: 409
    condition: "the targeted ledger entry is itself a REVERSAL, or is already referenced by an existing REVERSAL"

# =============================================================================
# §1.7 RBAC Matrix
# role_model: segregation_of_duties. Staff roles are peers with disjoint
# exclusive surfaces; RecordsSupervisor is the only fiscal-authority role and
# does NOT inherit LegalCounsel's adjudication surface.
# =============================================================================
roles:

  - name: RecordsClerk
    description: "Intake and production desk: registers requesters and recordings, drives scope, inclusion, notification and release production"
    identity: "opaque"
    exclusive_operations:
      - "POST /records/depicted-individuals/{id}/notification"
    shared_operations:
      - "POST /records/requesters"
      - "POST /records/video-assets"
      - "POST /records/video-assets/{id}/depicted-individuals"
      - "POST /records/requests"
      - "POST /records/requests/{id}/scope-clarification"
      - "POST /records/requests/{id}/responsive-records"
      - "POST /records/responsive-records/{id}/inclusion"
      - "POST /records/depicted-individuals/{id}/objection"
      - "POST /records/requests/{id}/fee-estimates"
      - "POST /records/requests/{id}/payments"
      - "POST /records/requests/{id}/release-packages"
      - "all GET endpoints except /records/requesters/{id} restrictions noted in §1.5"

  - name: RecordsSupervisor
    description: "Unit supervisor holding the fiscal authority and the destruction authority; cannot adjudicate exemptions or perform QA"
    identity: "opaque"
    exclusive_operations:
      - "POST /records/staff"
      - "POST /records/requests/{id}/invoice"
      - "POST /records/fee-ledger-entries/{id}/reversal"
      - "POST /records/video-assets/{id}/purge"
    shared_operations:
      - "POST /records/requesters"
      - "POST /records/video-assets"
      - "POST /records/requests"
      - "POST /records/requests/{id}/scope-clarification"
      - "POST /records/requests/{id}/responsive-records"
      - "POST /records/responsive-records/{id}/inclusion"
      - "POST /records/responsive-records/{id}/redaction-tasks"
      - "POST /records/requests/{id}/fee-estimates"
      - "POST /records/requests/{id}/release-packages"
      - "all GET endpoints"

  - name: LegalCounsel
    description: "Attorney who asserts and adjudicates statutory exemptions, issues denial letters, decides appeals and manages litigation holds"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /records/responsive-records/{id}/exemption-claims"
      - "POST /records/exemption-claims/{id}/adjudication"
      - "POST /records/requests/{id}/denial-letters"
      - "POST /records/denial-letters/{id}/appeal-decision"
      - "POST /records/litigation-holds"
      - "POST /records/litigation-holds/{id}/release"
    shared_operations:
      - "POST /records/video-assets/{id}/depicted-individuals"
      - "POST /records/responsive-records/{id}/inclusion"
      - "POST /records/depicted-individuals/{id}/objection"
      - "GET /records/requests/{id}, /records/video-assets/{id}, /records/responsive-records/{id}, /records/exemption-claims/{id}, /records/redaction-tasks/{id}, /records/depicted-individuals/{id}, /records/litigation-holds/{id}, /records/denial-letters/{id} and their list forms"

  - name: RedactionTechnician
    description: "Redaction operator: opens redaction tasks and submits finished work for quality review; may never approve it"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /records/redaction-tasks/{id}/submit-qa"
    shared_operations:
      - "POST /records/responsive-records/{id}/redaction-tasks"
      - "GET /records/staff/{id}, /records/requests/{id}, /records/video-assets/{id}, /records/responsive-records/{id}, /records/redaction-tasks/{id} and their list forms"

  - name: QualityReviewer
    description: "Quality reviewer who passes or fails submitted redaction work; may never perform the redaction being reviewed"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /records/redaction-tasks/{id}/qa-outcome"
    shared_operations:
      - "GET /records/staff/{id}, /records/requests/{id}, /records/video-assets/{id}, /records/responsive-records/{id}, /records/redaction-tasks/{id} and their list forms"

  - name: Requester
    description: "The filer. Sees and pays only their own request and appeals only their own denial letters"
    identity: "entity_backed:Requester"
    exclusive_operations:
      - "POST /records/denial-letters/{id}/appeal"
    shared_operations:
      - "POST /records/requests/{id}/payments"
      - "GET /records/requests/{id}, GET /records/requests, GET /records/requests/{id}/fee-estimates, GET /records/requests/{id}/denial-letters, GET /records/requests/{id}/release-packages, GET /records/denial-letters/{id} — all narrowed by the priority-6 ownership check"
