# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pediatric Speech & OT Clinic — Expert band
# Nine §0.5 rules, >= 2 instances each (>= 18 total).
#
# Shared setup conventions (all recipes drive from empty DB):
#   - Logical clock default is 2026-01-01T00:00:00Z. Authorization windows below
#     use valid_from 2026-06-01T00:00:00Z .. valid_until 2026-09-01T00:00:00Z so
#     June appointments fall inside the window. The week of 2026-06-08 is a Monday.
#   - Evaluator/Therapist are entity_backed:Therapist; their X-User-ID equals a
#     Therapist.id. Recipes create the Therapist first, then act as that role
#     passing as_user_id = that therapist id where ownership/authorship matters.
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_balance_reserved_vs_committed_divergence
        grounds:
          - calculations.visit_balance
          - entities.Authorization.fields.reserved_visits
          - entities.Authorization.fields.committed_visits
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          On Authorization (visit-cap domain): a SCHEDULED appointment sits in
          reserved_visits; completing it moves the same unit to committed_visits
          with available_visits unchanged, whereas cancelling a reserved one
          returns the unit to the free pool — a committed visit can never be
          released, a reserved one can. This is a different entity domain from
          goal_progress (PlanOfCare/Goal).
        test_recipe:
          setup:
            - "One child, one SLP therapist (caseload 5, weekly cap 600), one FINALIZED SLP evaluation, one ACTIVE plan of care, one ACTIVE SLP authorization with authorized_visits=3 (available=3)."
            - "Two appointments booked against the authorization (reserved=2, available=1). One is completed at/after its slot; the other is cancelled."
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T SLP", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid A", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 55 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-08T09:00:00Z", end_time: "2026-06-08T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_complete_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-09T09:00:00Z", end_time: "2026-06-09T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_cancel_id: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt_complete_id}/complete"
              payload: { narrative: "Session completed fine.", minutes_delivered: 45, goal_progress_entries: [] }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /clinic/appointments/${appt_cancel_id}/cancel"
              payload: {}
              as: ClinicAdmin
          assert:
            - "Authorization.${auth_id}.committed_visits == 1"
            - "Authorization.${auth_id}.reserved_visits == 0"
            - "Authorization.${auth_id}.available_visits == 2"
            - "Appointment.${appt_complete_id}.status == COMPLETED"
            - "Appointment.${appt_cancel_id}.status == CANCELLED"

      - name: goal_progress_forward_vs_chronological_divergence
        grounds:
          - calculations.goal_progress
          - entities.Goal.fields.latest_progress_pct
          - entities.PlanOfCare.fields.overall_progress_pct
          - state_machines.Appointment.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          On PlanOfCare/Goal (clinical-progress domain): Goal.latest_progress_pct
          is selected strictly by the GoalProgressEntry with the maximum
          recorded_session_time (the appointment start_time), so a later-inserted
          but earlier-dated session note does NOT override a higher recorded value
          from a later-dated session; PlanOfCare.overall_progress_pct then rolls
          up that current latest across goals. Different entity domain from
          visit_balance (Authorization).
        test_recipe:
          setup:
            - "One child, SLP therapist, FINALIZED eval, ACTIVE plan with one OPEN goal (weight 1, baseline 10, target 60)."
            - "ACTIVE authorization with 3 visits. Two appointments: a LATER-dated slot (2026-06-15) and an EARLIER-dated slot (2026-06-01). The later slot is completed first recording 55; the earlier slot is completed afterward recording 70 (back-dated)."
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T2", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid B", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 55 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care/${poc_id}/goals"
              payload: { description: "Articulate /r/", weight: 1, baseline_pct: 10, target_pct: 60 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { goal_id: $.data.id }
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-15T09:00:00Z", end_time: "2026-06-15T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_late_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-01T09:00:00Z", end_time: "2026-06-01T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_early_id: $.data.id }
            - call: "POST /clinic/appointments/${appt_late_id}/complete"
              payload: { narrative: "Later dated session.", minutes_delivered: 45, goal_progress_entries: [ { goal_id: "${goal_id}", recorded_pct: 55 } ] }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /clinic/appointments/${appt_early_id}/complete"
              payload: { narrative: "Earlier dated session, recorded later.", minutes_delivered: 45, goal_progress_entries: [ { goal_id: "${goal_id}", recorded_pct: 70 } ] }
              as: Therapist
              as_user_id: "${th_id}"
          assert:
            - "Goal.${goal_id}.latest_progress_pct == 55"
            - "PlanOfCare.${poc_id}.overall_progress_pct == 90.0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: goal_progress_weighted_nonlinear_three_inputs
        grounds:
          - calculations.goal_progress
          - entities.Goal.fields.weight
          - entities.Goal.fields.baseline_pct
          - entities.Goal.fields.target_pct
        distinguishing_aspect: |
          MODE (a) non-linear >=3 inputs: overall_progress_pct combines per-goal
          weight, a clamp((latest-baseline)/(target-baseline),0,1) ratio, and the
          goal's status (DISCONTINUED goals drop out of both numerator and
          denominator) — weight, clamp, and conditional status interact
          non-linearly, not a single tiered lookup.
        test_recipe:
          setup:
            - "ACTIVE plan with two OPEN goals: A (weight 2, baseline 20, target 70), B (weight 3, baseline 0, target 50)."
            - "One completed appointment records goal A at 45 and goal B at 50. Goal B reaches its target (MET)."
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T3", discipline: "OT", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid C", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "OT", severity_score: 72 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 90 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care/${poc_id}/goals"
              payload: { description: "Goal A", weight: 2, baseline_pct: 20, target_pct: 70 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { goal_a: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/goals"
              payload: { description: "Goal B", weight: 3, baseline_pct: 0, target_pct: 50 }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { goal_b: $.data.id }
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "OT", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /clinic/appointments/${appt_id}/complete"
              payload: { narrative: "Two-goal session note.", minutes_delivered: 45, goal_progress_entries: [ { goal_id: "${goal_a}", recorded_pct: 45 }, { goal_id: "${goal_b}", recorded_pct: 50 } ] }
              as: Therapist
              as_user_id: "${th_id}"
          assert:
            - "Goal.${goal_a}.latest_progress_pct == 45"
            - "Goal.${goal_b}.status == MET"
            - "PlanOfCare.${poc_id}.overall_progress_pct == 80.0"

      - name: visit_balance_eval_order_pinned_dependency
        grounds:
          - calculations.visit_balance
          - entities.Authorization.fields.available_visits
          - state_machines.Authorization.ACTIVE_to_EXHAUSTED
          - validations[priority=12]
        distinguishing_aspect: |
          MODE (c) circular-looking dependency with pinned evaluation order:
          available_visits = authorized - reserved - committed, yet a booking both
          READS available_visits (must be >= 1 first) and then WRITES reserved+=1.
          The order is pinned — capacity is checked against the PRE-reservation
          available_visits, so the visit that takes available to exactly 0 still
          succeeds and only THEN flips the authorization to EXHAUSTED. Distinct
          mode from the weighted_scoring instance (a).
        test_recipe:
          setup:
            - "ACTIVE authorization with authorized_visits=2 (available=2). One appointment already booked (reserved=1, available=1)."
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T4", discipline: "SLP", max_caseload: 5, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Kid D", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_id}", discipline: "SLP", severity_score: 40 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /clinic/evaluations/${ev_id}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_id}", evaluation_id: "${ev_id}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_id}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 2, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-08T09:00:00Z", end_time: "2026-06-08T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_id}", therapist_id: "${th_id}", authorization_id: "${auth_id}", plan_of_care_id: "${poc_id}", start_time: "2026-06-08T10:00:00Z", end_time: "2026-06-08T10:45:00Z" }
              as: ClinicAdmin
              captures: { appt2_id: $.data.id }
          assert:
            - "Appointment.${appt2_id}.status == SCHEDULED"
            - "Authorization.${auth_id}.reserved_visits == 2"
            - "Authorization.${auth_id}.available_visits == 0"
            - "Authorization.${auth_id}.status == EXHAUSTED"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: waitlist_entry_cyclic_offer_decline_reoffer
        grounds:
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_WAITING
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          WaitlistEntry is CYCLIC: WAITING -> OFFERED -> WAITING. Declining the
          top-priority offer returns that entry to WAITING and re-runs promotion,
          which then OFFERS the next-highest-priority eligible entry — a loop, not
          a one-way pipeline. (Entity = WaitlistEntry, distinct from Appointment.)
        test_recipe:
          setup:
            - "One SLP therapist (weekly cap 600). Two children each with a FINALIZED SLP evaluation; child HIGH severity_score=90, child LOW severity_score=30. Each child has an ACTIVE plan and an ACTIVE SLP authorization with available visits."
            - "A SCHEDULED appointment for an unrelated third child occupies a therapist slot; both HIGH and LOW children are WAITING on this therapist's waitlist. Cancelling the appointment OFFERS the HIGH entry."
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T5", discipline: "SLP", max_caseload: 9, weekly_visit_minutes_cap: 600 }
              as: ClinicAdmin
              captures: { th_id: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Occupier", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_occ: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_occ}", discipline: "SLP", severity_score: 50 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_occ: $.data.id }
            - call: "POST /clinic/evaluations/${ev_occ}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_occ}", evaluation_id: "${ev_occ}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_occ: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_occ}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_occ}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_occ: $.data.id }
            - call: "POST /clinic/appointments"
              payload: { child_id: "${ch_occ}", therapist_id: "${th_id}", authorization_id: "${auth_occ}", plan_of_care_id: "${poc_occ}", start_time: "2026-06-10T09:00:00Z", end_time: "2026-06-10T09:45:00Z" }
              as: ClinicAdmin
              captures: { appt_occ: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "High Need", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_high: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_high}", discipline: "SLP", severity_score: 90 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_high: $.data.id }
            - call: "POST /clinic/evaluations/${ev_high}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_high}", evaluation_id: "${ev_high}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 120 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_high: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_high}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_high}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_high: $.data.id }
            - call: "POST /clinic/children"
              payload: { full_name: "Low Need", date_of_birth: "2023-01-01" }
              as: ClinicAdmin
              captures: { ch_low: $.data.id }
            - call: "POST /clinic/evaluations"
              payload: { child_id: "${ch_low}", discipline: "SLP", severity_score: 30 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { ev_low: $.data.id }
            - call: "POST /clinic/evaluations/${ev_low}/finalize"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/plans-of-care"
              payload: { child_id: "${ch_low}", evaluation_id: "${ev_low}", primary_therapist_id: "${th_id}", planned_weekly_minutes: 60 }
              as: Evaluator
              as_user_id: "${th_id}"
              captures: { poc_low: $.data.id }
            - call: "POST /clinic/plans-of-care/${poc_low}/activate"
              payload: {}
              as: Evaluator
              as_user_id: "${th_id}"
            - call: "POST /clinic/authorizations"
              payload: { child_id: "${ch_low}", discipline: "SLP", payer_name: "PayerX", authorized_visits: 3, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { auth_low: $.data.id }
            - call: "POST /clinic/waitlist-entries"
              payload: { child_id: "${ch_high}", therapist_id: "${th_id}", discipline: "SLP", evaluation_id: "${ev_high}", requested_minutes: 45 }
              as: SchedulingCoordinator
              captures: { wl_high: $.data.id }
            - call: "POST /clinic/waitlist-entries"
              payload: { child_id: "${ch_low}", therapist_id: "${th_id}", discipline: "SLP", evaluation_id: "${ev_low}", requested_minutes: 45 }
              as: SchedulingCoordinator
              captures: { wl_low: $.data.id }
            - call: "POST /clinic/appointments/${appt_occ}/cancel"
              payload: {}
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/waitlist-entries/${wl_high}/decline"
              payload: {}
              as: SchedulingCoordinator
          assert:
