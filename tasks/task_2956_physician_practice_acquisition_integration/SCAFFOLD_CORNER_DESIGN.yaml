              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "Acquisition.${acq_id}.deal_status == SOURCING and readiness_posture is unchanged"
            - "the same request sent by DealLead dl-1 succeeds"
            - "a DealLead calling POST /acquisitions/${acq_id}/compliance-clearance is refused with ERR_FORBIDDEN_ROLE (403), because that dimension belongs to the ComplianceOfficer"
            - "the IntegrationManager can still create a readiness task on ${acq_id} and set the logical clock, so the refusal is operation-scoped rather than acquisition-scoped"

      - name: practice_physician_cannot_list_the_payer_contracts
        claim_type: Cannot perform another role's exclusive operation
        grounds:
          - roles[PracticePhysician].shared_operations
          - endpoints[GET /payer-contracts]
