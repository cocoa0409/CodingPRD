          assert:
            - "409 ERR_ENGAGEMENT_NOT_CONFIRMED - ticketing_status was a valid TIERS_DRAFT source state, so the rejection can only come from the lifecycle precondition."
            - "engagement.ticketing_status is still 'TIERS_DRAFT' and lifecycle_status is still 'DRAFT'."
            - "engagement.version is still 1: neither the tier draft nor the rejected on-sale bumped it."
            - "The tier is still ACTIVE with sold_qty 0 and available_qty 400; engagement.projected_gross_cents is still 0 because on-sale never ran its recompute."

      - name: counter_on_superseded_round_is_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "§1.2 FeeNegotiation terminal_states [ACCEPTED, SUPERSEDED]; no transition leaves SUPERSEDED."
          - "§1.6 ERR_NEGOTIATION_NOT_OPEN (409); §1.4 priority 40."
        distinguishing_aspect: >-
          Locks down the terminal state that is reached by a CASCADE rather than
          by an explicit call, which is the one an implementation is most likely
          to leave writable: round 1 was superseded as a side effect of opening
          round 2, so its row was never the subject of a transition endpoint.
          Both outgoing triggers of the OFFERED/COUNTERED states are probed.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (guarantee_floor_cents 200000) exist, plus a DRAFT PRESENTED engagement (2026-10-11 performance)."
            - "Round 1 was opened at 300000 / 0.10 (engagement 1 -> 2) and round 2 at 350000 / 0.12 (engagement 2 -> 3); the supersede cascade left round 1 in SUPERSEDED with version 2."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg1_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              captures: { eng_v1: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 350000, offered_artist_share_pct: 0.12, expected_engagement_version: "${eng_v1}" }
              captures: { neg2_id: "$.data.id" }
          trigger:
            - call: "POST /fee-negotiations/${neg1_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { counter_fee_cents: 320000, counter_artist_share_pct: 0.11 }
              captures: { err_counter: "$.data.error_id" }
            - call: "POST /fee-negotiations/${neg1_id}/accept"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              captures: { err_accept: "$.data.error_id" }
            - call: "GET /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
          assert:
            - "Counter attempt: 409 ERR_NEGOTIATION_NOT_OPEN even though the caller is the correct owning representative and the engagement is still DRAFT."
            - "Accept attempt on the same superseded row: 409 ERR_NEGOTIATION_NOT_OPEN."
            - "Round 1 is unchanged: status 'SUPERSEDED', counter_fee_cents null, accepted_fee_cents null, version still 2."
            - "Round 2 is untouched at status 'OFFERED'; engagement.negotiated_fee_cents is still 0 and engagement.version is still ${eng_v1} + 1."

      - name: second_review_on_a_reviewed_rider_is_rejected
        claim_type: idempotency
        grounds:
          - "§1.2 TechRider SUBMITTED -> CAPABLE requires review_status == SUBMITTED; CAPABLE is not a source state for review."
          - "§1.6 ERR_RIDER_INVALID_STATE (409); §1.4 priority 40."
        distinguishing_aspect: >-
          Replaying the review call is the natural retry for a technical director
          whose first response was lost; the scaffold declares no idempotency
          key, so the retry must be a hard 409 with zero drift (no second
          version bump, no re-stamped reviewer). Distinct from §1.8's rider work,
          which asserts the fork outcomes rather than the replay.
        test_recipe:
          setup:
            - "Grand Hall (5000 kg rigging, 400 A, 4 DMX universes) and rental client 'Meridian Dance Company' exist, plus a DRAFT RENTAL engagement (2026-10-02 performance)."
            - "The client contact submitted a rider well inside every capability limit (1000 kg, 200 A, 2 universes, no pit), and the technical director reviewed it, so §1.3 produced an empty gap list and the rider is CAPABLE at version 2 with reviewed_by_user_id 'user-td-1'."
