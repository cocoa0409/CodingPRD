              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { brk_id: $.data.id }
            - call: "POST /brokers/${brk_id}/agreements"
              payload: { agreement_ref: "AGR-2834-16", fee_structure: "BASIS_POINT_FEE", fee_bps: 10, termination_notice_days: 30, effective_date: "2026-07-01", aml_program_score: 80, financial_condition_score: 75, insurance_coverage_score: 70, recordkeeping_score: 65 }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Gate CD Draft Attempt", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "START_DILIGENCE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Gate CD Diligence Attempt", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
              as_user_id: "op_desk"
            - call: "POST /broker-agreements/${agr_id}/diligence-actions"
              payload: { action: "APPROVE" }
              as: ComplianceReviewer
              as_user_id: "op_comp"
            - call: "POST /deposit-programs"
              payload: { institution_id: "${inst_id}", broker_id: "${brk_id}", agreement_id: "${agr_id}", program_name: "Gate CD Approved Attempt", funding_channel_claim: "BROKERED", product_type: "TIME_DEPOSIT", tenor_days: 60, offered_rate_bps: 470, early_withdrawal_penalty_days: 30, titling_convention: "DIRECT_TITLED" }
              as: FundingDeskOfficer
