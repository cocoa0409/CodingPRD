          trigger: >-
            PATCH /employees/${employee_id} with employment_status TERMINATED and
            termination_date 2026-09-01
          assert: >-
            Baseline from setup: the listing rate is 32000 (40000 * 0.80), the enrollment gross is
            160000 with employer_reserved_cents 88000 (round_half_up(160000 * 0.55)), and the
            approved claim is 104000 (effective_pct 0.55 + 0.10 = 0.65 because grade 3.60 >= 3.50)
            with platform_admin_fee_cents 5200, leaving cap_disbursed_cents 104000 and
            cap_available_cents 696000 plus a BENEFIT entry of 104000/104000/0.
