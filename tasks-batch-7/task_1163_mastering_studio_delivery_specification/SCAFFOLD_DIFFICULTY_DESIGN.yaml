            - call: "POST /studio/clients"
              payload: { legal_name: "C", contact_email: "c@x.com" }
              as: StudioManager
              captures: { cli_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/credit-adjustments"
              payload: { amount_cents: 100000, reason: "seed" }
              as: StudioManager
            - call: "POST /studio/projects"
              payload: { client_id: "${cli_id}", title: "P", upc: "012345678901", target_platform_profile_id: "${prof_id}", scheduled_start_at: "2026-05-11T10:00:00Z", scheduled_duration_minutes: 60, rush_tier: "STANDARD" }
              as: Client
              as_user_id: "${cli_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /studio/clients/${cli_id}/activate"
              payload: {}
              as: StudioManager
            - call: "GET /studio/clients/${cli_id}"
              as: StudioManager
              captures: { cli_ver: $.data.version }
            - call: "POST /studio/projects/${proj_id}/book"
              payload: { expected_client_version: "${cli_ver}" }
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/projects/${proj_id}/begin-intake"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/source-assets"
              payload: { filename: "a.wav", sha256: "5555555555555555555555555555555555555555555555555555555555555555", sample_rate_hz: 44100, bit_depth: 24, duration_seconds: 60.0, channels: 2 }
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { sa_id: $.data.id }
            - call: "POST /studio/source-assets/${sa_id}/qc-pass"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/qc/complete"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
            - call: "POST /studio/projects/${proj_id}/start-mastering"
              payload: {}
              as: Engineer
              as_user_id: "${eng_id}"
              captures: { r1_id: $.data.current_revision_round_id, pv1: $.data.version }
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/submit"
              payload: { expected_project_version: "${pv1}" }
              as: Engineer
              as_user_id: "${eng_id}"
          trigger:
            - call: "POST /studio/projects/${proj_id}/rounds/${r1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli_id}"
            - call: "POST /studio/clients/${cli_id}/credit-adjustments"
              payload: { amount_cents: 80000, reason: "refund" }
              as: StudioManager
          assert:
            - "Project.${proj_id}.final_price_cents == 80000"
            # After approve: credit = 100000 - 80000 = 20000; after refund: 20000 + 80000 = 100000
            - "Client.${cli_id}.account_credit_cents == 100000"
            - "Invariant: (credit_before - final_price) + final_price == credit_before; after refund, credit == credit_before"

