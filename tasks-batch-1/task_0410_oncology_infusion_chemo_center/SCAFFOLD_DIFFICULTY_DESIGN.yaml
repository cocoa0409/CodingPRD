  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_order_create_requires_cycle_active
        grounds:
          - validations[priority=6]
          - entities.TreatmentCycle.fields.status
          - entities.DrugOrder.fields.treatment_cycle_id
        distinguishing_aspect: |
          Entity pair DrugOrder->TreatmentCycle: creating a DrugOrder requires the
          parent TreatmentCycle to be ACTIVE; against an ON_HOLD cycle the create is
          rejected with ERR_CYCLE_NOT_ACTIVE — the child operation's legality depends
          on the parent cycle's state, not on any field of the order itself.
        test_recipe:
          setup:
            - "Cycle activated then placed ON_HOLD; no surviving non-terminal orders"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "M13", full_name: "P Thirteen", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
