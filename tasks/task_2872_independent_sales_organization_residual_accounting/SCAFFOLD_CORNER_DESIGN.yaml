      - name: override_walk_visits_three_ancestors_and_a_zero_differential_burns_one
        claim_type: Constants Applied
        grounds:
          - calculations.residual_split_allocation (MAX_OVERRIDE_LEVELS, STEP 2)
          - entities.ResidualAllocation.fields.tier_level
          - entities.Agent.fields.parent_agent_id
        distinguishing_aspect: "A five-level chain is walked from the owning agent with MAX_OVERRIDE_LEVELS 3. The middle ancestor's override_pct equals the running cumulative_pct, so its differential is 0 and no allocation row is written — but its VISIT still counts, so the walk stops one level below the root and the root earns nothing. tier_level must therefore be 0, 1 and 3 with no tier 2, and iso_retained_cents 18000. Implementations that count paid tiers instead of visits pay the root 2000 more."
        test_recipe:
          setup: ["Agents A1 (root, 0.20/0.60) <- A2 (0.25/0.55) <- A3 (0.30/0.45) <- A4 (0.35/0.45) <- A5 (0.40/0.40), each parent satisfying parent.override_pct >= max(child.split_pct, child.override_pct). Merchant M1 is owned by A5 (equipment 0) and its 2026-07 line normalizes to an agent_basis of 40000."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Root", split_pct: 0.20, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2 Level1", split_pct: 0.25, override_pct: 0.55, vesting_start_date: "2024-01-15", parent_agent_id: "${a1}" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /agents"
              payload: { name: "A3 Level2", split_pct: 0.30, override_pct: 0.45, vesting_start_date: "2024-01-15", parent_agent_id: "${a2}" }
              as: IsoAdmin
              captures: { a3: $.data.id }
            - call: "POST /agents"
              payload: { name: "A4 Level3", split_pct: 0.35, override_pct: 0.45, vesting_start_date: "2024-01-15", parent_agent_id: "${a3}" }
              as: IsoAdmin
              captures: { a4: $.data.id }
            - call: "POST /agents"
              payload: { name: "A5 Producer", split_pct: 0.40, override_pct: 0.40, vesting_start_date: "2024-01-15", parent_agent_id: "${a4}" }
              as: IsoAdmin
              captures: { a5: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a5}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:ov-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 45100 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          trigger:
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /residual-allocations"
              payload: { period_month: "2026-07" }
              as: ResidualController
          assert:
            - "hierarchy_depth is 0 / 1 / 2 / 3 / 4 for A1..A5 — the chain sits exactly at MAX_HIERARCHY_DEPTH"
            - "GET /residual-allocations?period_month=2026-07 returns total_count 3, not 4 and not 5"
            - "the DIRECT_SPLIT row is agent_id ${a5}, tier_level 0, applied_pct 0.40, basis_cents 40000, gross_allocation_cents 16000"
            - "the first OVERRIDE row is agent_id ${a4}, tier_level 1, applied_pct 0.05 (0.45 - 0.40), gross_allocation_cents 2000"
            - "there is NO row with tier_level 2 and none for agent ${a3}: its differential was max(0, 0.45 - 0.45) == 0"
            - "the second OVERRIDE row is agent_id ${a2}, tier_level 3, applied_pct 0.10 (0.55 - 0.45), gross_allocation_cents 4000 — the tier_level records the visit index, so 2 is skipped"
            - "there is NO allocation and NO AgentStatement for the root agent ${a1}: the walk consumed all three visits on A4, A3 and A2"
            - "MerchantProfitability for the line has agent_basis_cents 40000, allocated_total_cents 22000 and iso_retained_cents 18000"
            - "GET /agent-statements?period_month=2026-07 returns total_count 3, with gross_after_trueup_cents 16000 / 2000 / 4000 for ${a5} / ${a4} / ${a2}"

      - name: half_cent_allocations_round_half_up_and_the_remainder_stays_with_the_house
        claim_type: Precision
        grounds:
          - calculations.residual_split_allocation (precision)
          - calculations.merchant_profitability (STEP 2 proration precision)
          - calculations.normalize_residual_line
        distinguishing_aspect: "Both exact half-cent cases in one posted batch: a 3333-cent basis at 0.50 must give 1667 (not 1666) with 1666 to the house, and a 501-cent lease prorated over 15 of 30 days must give 251 (not 250), which in turn makes the basis 9749 and the allocation 4875. Banker's rounding produces 1666 and 250 and cascades a one-cent error into the basis."
        test_recipe:
          setup: ["Agent A1 (split 0.50) with merchants MA (equipment 0) and MB (equipment 501, attrited mid-period on 2026-06-15). One 2026-06 batch carries a line for each: MA gross 8433 -> net 3333, MB gross 15100 -> net 10000."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { ma: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9002", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 501, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { mb: $.data.id }
            - call: "POST /merchants/${ma}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${mb}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${mb}/attrite"
              payload: { attrition_date: "2026-06-15" }
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-06", coverage_start: "2026-06-01", coverage_end: "2026-07-01", file_checksum: "sha256:pr-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${ma}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 8433 }
              as: ResidualAnalyst
              captures: { la: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${mb}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 15100 }
              as: ResidualAnalyst
              captures: { lb: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          trigger:
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /merchant-profitability"
              payload: { residual_batch_id: "${b1}" }
              as: ResidualController
          assert:
            - "ResidualLine.${la}.processor_cost_cents == 5100 and normalized_net_revenue_cents == 3333; ResidualLine.${lb} the same cost with net 10000"
            - "ResidualBatch.${b1}.line_count == 2, gross_volume_cents == 2000000, total_normalized_net_revenue_cents == 13333"
            - "MB's profitability row has equipment_cost_cents == 251 == round_half_up(501 x 15 / 30) — active_days is (15 - 1) + 1 == 15 out of 30, and 250.5 rounds UP"
            - "MB's profitability row has agent_basis_cents == 9749 and its DIRECT_SPLIT allocation has gross_allocation_cents == 4875 == round_half_up(9749 x 0.50); iso_retained_cents == 4874"
            - "MA's profitability row has equipment_cost_cents == 0, agent_basis_cents == 3333, and its DIRECT_SPLIT allocation has gross_allocation_cents == 1667 == round_half_up(3333 x 0.50); iso_retained_cents == 1666"
            - "no allocation row has vesting_withheld_cents != 0 (the agent is ACTIVE) and every row satisfies basis_cents == allocated_total_cents + iso_retained_cents for its profitability row"
            - "the agent's 2026-06 statement has direct_residual_cents == 6542 (1667 + 4875) and net_payable_cents == 6542; the rounding gains are not swept back out of the agent"
            - "ResidualBatch.${b1}.iso_retained_cents == 6540 (1666 + 4874)"

