          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-01-01'
          valid_until: '2026-06-30'
          approved_ship_to_address: 18 Groom Gln
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          a1_id: $.data.id
      trigger:
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-06-30'
          valid_until: '2026-12-31'
          approved_ship_to_address: 18 Groom Gln
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      - call: POST /vet/manufacturer-authorizations
        payload:
          clinic_id: ${c_id}
          manufacturer_code: ZOETIS
          valid_from: '2026-07-01'
          valid_until: '2026-12-31'
          approved_ship_to_address: 18 Groom Gln
          quarterly_quantity_cap: 100
        as: ComplianceOfficer
        captures:
          a3_status: $.data.status
      assert:
      - A2 (valid_from 2026-06-30) -> error_id == ERR_AUTHORIZATION_WINDOW_OVERLAP, http 409 (shared date 2026-06-30 under closed semantics)
      - A3 (valid_from 2026-07-01) -> 201, status PENDING (disjoint)
      - A1.status remains PENDING and its version is unchanged
- rule_id: compensating_invariant
  instances:
  - name: lot_quantity_conservation_invariant
    grounds:
    - entities.InventoryLot.fields.qty_available
    - state_machines.Order.APPROVED_to_CANCELLED
    - calculations.fefo_allocation
    distinguishing_aspect: "Conserved quantity: PHYSICAL UNITS. For the lot,\nqty_on_hand == qty_allocated + qty_available at every checkpoint;\nthe approve (allocate 5) then cancel (release 5) pair returns\n\
      qty_allocated to exactly 0 \u2014 no drift from the forward+compensating\naction pair.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C; CONSUMABLE product (GEN, 10000c); lot qty 8 expiry 2027-06-30; order qty 5 APPROVED
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic I1
          license_number: LIC-I1
          ship_to_address: 19 Foal Ford
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-I1
          product_name: Bandage Roll
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-I1
          expiry_date: '2027-06-30'
          qty_on_hand: 8
        as: SupplyChainPlanner
        captures:
          lot_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 19 Foal Ford
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 5
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: GET /vet/inventory-lots/${lot_id}
        as: AccountManager
        captures:
          alloc_mid: $.data.qty_allocated
          avail_mid: $.data.qty_available
          onhand_mid: $.data.qty_on_hand
      trigger:
      - call: POST /vet/orders/${o_id}/cancel
        as: AccountManager
      - call: GET /vet/inventory-lots/${lot_id}
        as: AccountManager
        captures:
          alloc_end: $.data.qty_allocated
          avail_end: $.data.qty_available
          onhand_end: $.data.qty_on_hand
      assert:
      - 'After approve: qty_on_hand == 8, qty_allocated == 5, qty_available == 3 (8 == 5 + 3)'
      - "After cancel: qty_on_hand == 8, qty_allocated == 0, qty_available == 8 (8 == 0 + 8) \u2014 allocation pair nets to zero drift"
      - Lot status AVAILABLE at both checkpoints (qty_available > 0)
  - name: rebate_accrual_reversal_invariant
    grounds:
    - state_machines.RebateAccrual.PROVISIONAL_to_REVERSED
    - state_machines.Order.APPROVED_to_CANCELLED
    - entities.BundleEnrollment.fields.qtd_qualifying_cents
    distinguishing_aspect: "Conserved quantity: MONEY (rebate cents), a different conserved\nquantity than physical units: the approve-then-cancel pair leaves\nthe enrollment's payable surface unchanged\
      \ \u2014 the accrual is REVERSED\nand qtd_qualifying_cents returns to exactly 0.\n"
    test_recipe:
      setup:
      - ACTIVE clinic C enrolled (2026-Q3) in ACTIVE program (ACME-VET, [CONSUMABLE], min 1, discount 0, 200/500bp, threshold 1000000)
      - CONSUMABLE product (ACME-VET, 10000c) in stock; order qty 10 (net 100000c) APPROVED -> PROVISIONAL accrual 2000c
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic I2
          license_number: LIC-I2
          ship_to_address: 20 Colt Cir
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
          c_v: $.data.version
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
        captures:
          c_v: $.data.version
      - call: POST /vet/products
        payload:
          sku: CONS-I2
          product_name: IV Line Set
          manufacturer_code: ACME-VET
          product_type: CONSUMABLE
          unit_price_cents: 10000
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/inventory-lots
        payload:
          product_id: ${p_id}
          lot_number: LOT-I2
          expiry_date: '2027-06-30'
          qty_on_hand: 50
        as: SupplyChainPlanner
      - call: POST /vet/bundle-programs
        payload:
          program_name: ACME inv
          manufacturer_code: ACME-VET
          qualifying_product_types:
          - CONSUMABLE
          min_distinct_categories: 1
          bundle_discount_pct: 0
          rebate_base_rate_bp: 200
          rebate_bonus_rate_bp: 500
          bonus_threshold_cents: 1000000
        as: AccountManager
        captures:
          prog_id: $.data.id
      - call: POST /vet/bundle-programs/${prog_id}/activate
        as: AccountManager
      - call: POST /vet/clinics/${c_id}/bundle-enrollments
        payload:
          program_id: ${prog_id}
          quarter: 2026-Q3
          expected_clinic_version: ${c_v}
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          enr_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 20 Colt Cir
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 10
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      - call: POST /vet/orders/${o_id}/submit
        as: ClinicBuyer
        as_user_id: ${c_id}
      - call: POST /vet/orders/${o_id}/approve
        as: AccountManager
      - call: GET /vet/rebate-accruals?order_id=${o_id}
        as: AccountManager
        captures:
          acc_id: $.data[0].id
          acc_prov: $.data[0].provisional_amount_cents
      trigger:
      - call: POST /vet/orders/${o_id}/cancel
        as: AccountManager
      - call: GET /vet/rebate-accruals/${acc_id}
        as: AccountManager
        captures:
          acc_status: $.data.status
      - call: GET /vet/bundle-enrollments/${enr_id}
        as: AccountManager
        captures:
          enr_qtd: $.data.qtd_qualifying_cents
      assert:
      - 'Before cancel: accrual PROVISIONAL with provisional_amount_cents == 2000 (100000 * 200/10000)'
      - 'After cancel: RebateAccrual.status == REVERSED'
      - "BundleEnrollment.qtd_qualifying_cents == 0 (100000 accrued then reversed \u2014 conserved)"
      - Sum of accrual amounts in {PROVISIONAL, FINALIZED} for the enrollment == 0
