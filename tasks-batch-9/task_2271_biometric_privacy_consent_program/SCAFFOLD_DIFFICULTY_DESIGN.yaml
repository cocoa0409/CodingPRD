  - rule_id: priority_pair_validation_conflict
    instances:
      - name: posture_block_priority_9_outranks_vendor_risk_gate_priority_10
        grounds:
          - validations[priority=9].ERR_PROGRAM_POSTURE_BLOCKED
          - validations[priority=10].ERR_VENDOR_RISK_TOO_HIGH
          - calculations.program_posture
          - calculations.vendor_risk_score
        distinguishing_aspect: |
          Pair (9, 10): a program-wide state gate versus a per-vendor business-safety gate. Both are
          violated by the same CLASSIFIED -> ACTIVE call, and the state-category rule at priority 9
          wins with 409 ERR_PROGRAM_POSTURE_BLOCKED even though the vendor-risk breach at priority
          10 would return 422. This pair spans the state/business_safety categories.
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy v1.0 and a PUBLISHED (IL, EMPLOYEE) notice."
            - "Asset A1 (in-house) was activated and then manually gated, so gated_asset_count is 1 and ComplianceProgram.posture is RESTRICTED — which blocks any CLASSIFIED -> ACTIVE transition."
            - "Vendor RiskyLens with sells_biometric_data true, subprocessor_count 1, deletion_sla_days 30, subprocessor_disclosure_complete false and attestation_status REQUESTED, giving risk_score 75 (> VENDOR_RISK_GATE 70), holding one APPROVED VendorContract."
            - "Asset A2 is operated by RiskyLens and sits in CLASSIFIED, so activating it violates both the posture rule and the vendor-risk rule."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
