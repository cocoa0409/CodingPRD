            - call: "POST /complaint-office/products"
              payload: { product_code: "P-E3", display_name: "E3" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.E3" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-E3", channel_code: "WEB", product_code: "P-E3", category_code: "C.E3", narrative: "clock check" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          assert:
            - "Complaint.${cid}.received_at == 2026-08-03T04:05:06Z"

      - name: complaint_default_clock_startup_value
        claim_type: defaults
        grounds:
          - endpoints[POST /complaint-office/_clock/set_current_utc]
        distinguishing_aspect: "Without any set_current_utc call, intake stamps received_at with the fixed startup default 2026-08-01T00:00:00Z (never wall-clock)."
        test_recipe:
          setup: ["No clock call made"]
          setup_api_calls:
