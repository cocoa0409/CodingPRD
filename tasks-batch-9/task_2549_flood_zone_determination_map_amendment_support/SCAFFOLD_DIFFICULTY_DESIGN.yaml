  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: panel_effective_five_hop_cascade_to_notice_supersession
        grounds:
          - state_machines.MapPanel.LFD_ISSUED_to_EFFECTIVE
          - state_machines.MapPanel.EFFECTIVE_to_SUPERSEDED
          - state_machines.Determination.ISSUED_to_FLAGGED_FOR_REVIEW
          - state_machines.ComplianceNotice.SENT_to_SUPERSEDED
          - calculations.compliance_posture
          - calculations.open_notice_count_reconciliation
        distinguishing_aspect: |
          Depth 5, triggered by MapPanel LFD_ISSUED -> EFFECTIVE: each hop is
          caused by the previous one (new panel effective -> old panel
          SUPERSEDED -> determinations pointing at the OLD panel flagged ->
          those folios' pending_redetermination_count / posture change -> the
          SENT notices on exactly those folios superseded). The other instance
          starts from an agency dispute decision instead.
        test_recipe:
          setup:
            - "FL community 125129 REGULAR; panel 12086C0312K seq 1 EFFECTIVE, BFE 7.75, effective 2020-06-05"
            - "property ROOFTOP 0.95; structure sfha_offset_ft -12.0; folio principal 28000000, escrow 500000"
            - "ORIGINATION determination against panel 1 -> ISSUED, sfha_flag true, mandatory_purchase_flag true"
            - "MANDATORY_PURCHASE notice SENT at 2026-08-01, response_deadline_at 2026-09-15, open_notice_count 1"
            - "successor panel seq 2 (zone VE, BFE 12.50, shift 0, effective_date 2027-04-28) walked PRELIMINARY -> APPEAL_OPEN -> LFD_ISSUED at 2026-10-30"
            - "clock advanced to 2027-05-01 so lfd_issued_at + LFD_WAITING_PERIOD_DAYS (180) == 2027-04-28 has passed"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
