  # ===========================================================================
  # Rule 4 — transitive_cascade (3 instances, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: claim_accept_transitive_assignment_handoff_provisional_chain
        grounds:
          - state_machines.SittingClaim.transitions.PENDING_to_ACCEPTED
          - state_machines.SittingRequest.transitions.OPEN_to_CLAIMED
          - state_machines.SittingRequest.transitions.CLAIMED_to_ASSIGNED
          - entities.SittingAssignment.fields.status
          - entities.AccessHandoff.fields.status
          - concurrency_rules[claim-accept-stale-request]
        distinguishing_aspect: |
          Trigger: claim accept. Depth-4 chain where each link is caused by the
          previous: claim ACCEPTED -> SittingRequest OPEN->CLAIMED (system, on claim
          acceptance) -> CLAIMED->ASSIGNED creating the SittingAssignment row ->
          AccessHandoff(PENDING) created for that assignment and
          sitter.provisional_credit_hours += 4.00. The losing PENDING claim from F3
          is REJECTED as part of the OPEN->CLAIMED hop, not by the original action.
        test_recipe:
          setup:
            - "Founders VETTED; F1 owns pet; canonical request (4h, offered 4.00) OPEN with TWO PENDING claims (F2 and F3)"
          setup_api_calls:
            - *mk_f1
            - *mk_f2
            - *mk_f3
            - *ref_f1f2
            - *ref_f1f3
            - *ref_f2f1
            - *ref_f2f3
            - *ref_f3f1
            - *ref_f3f2
            - *liab_f1
            - *liab_f2
            - *liab_f3
            - *sub_f1
            - *sub_f2
            - *sub_f3
            - *acc_f1f2
            - *acc_f1f3
            - *acc_f2f1
            - *acc_f2f3
            - *acc_f3f1
            - *acc_f3f2
            - *fin_f1
            - *fin_f2
            - *fin_f3
            - *pet_f1
            - *req_a
            - *claim_f2
            - call: "POST /coop/sitting-requests/${req_id}/claims"
              payload: { message: "F3 also available" }
              as: Member
              as_user_id: "${f3_id}"
              captures: { claim3_id: $.data.id }
          trigger:
            - *accept_a
          assert:
            - "SittingClaim.${claim_id}: status == ACCEPTED with decided_at non-null"
            - "SittingRequest.${req_id}.status == ASSIGNED and version == ${req_v} + 1 (OCC bump)"
            - "GET /coop/sitting-requests/${req_id}/assignment -> 1 row: status CONFIRMED, sitter_member_id == ${f2_id}, owner_member_id == ${f1_id}, scheduled window copied from request"
            - "GET /coop/sitting-assignments/<asg>/access-handoff -> 1 row status PENDING (created by the chain, not by any direct call)"
            - "Member.${f2_id}.provisional_credit_hours == 4.00 (provisional variant booked by the CLAIMED->ASSIGNED hop)"
            - "SittingClaim.${claim3_id}.status == REJECTED (losing claim cascaded by OPEN->CLAIMED)"

      - name: member_suspend_transitive_request_claim_assignment_chain
        grounds:
          - state_machines.Member.transitions.VETTED_to_SUSPENDED
          - state_machines.SittingRequest.transitions.OPEN_to_CANCELLED
          - state_machines.SittingClaim.transitions.PENDING_to_REJECTED
          - state_machines.SittingAssignment.transitions.CONFIRMED_to_CANCELLED_BY_SITTER
          - entities.Member.fields.provisional_credit_hours
        distinguishing_aspect: |
          Trigger: member suspend (different trigger from claim accept). Two depth-3
          transitive links: (1) suspend -> F2's OPEN request CANCELLED with reason
          OWNER_SUSPENDED -> F3's PENDING claim on it REJECTED (claim rejected by the
          request cancellation, not by the suspend itself); (2) suspend -> F2's
          CONFIRMED assignment (as sitter) CANCELLED_BY_SITTER -> F2's
          provisional_credit_hours reversed 4.00 -> 0.00.
        test_recipe:
          setup:
            - "Founders VETTED; F2 owns pet P2 and posts OPEN request R2 (2026-09-20T10:00+4h); F3 has a PENDING claim on R2"
            - "F2 is sitter on F1's canonical request (assignment CONFIRMED; F2 provisional 4.00)"
