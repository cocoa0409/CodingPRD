              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { round_2: $.data.revision_round }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "substantiate round three" }
              as: DemandReviewLead
              as_user_id: "lead-1"
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v3: $.data.version }
            - call: "POST /sop/consensus-adjustments/${adj_id}/resubmit"
              payload: { rationale: "round three", delta_units: 130, expected_demand_forecast_version: "${fc_v3}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { round_3: $.data.revision_round }
            - call: "POST /sop/consensus-adjustments/${adj_id}/reviews"
              payload: { decision: "REQUEST_REVISION", review_note: "one round too far" }
              as: DemandReviewLead
