              as_user_id: "admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "The response is 409 with data.error_id == ERR_INVALID_PERMIT_STATE"
            - "The response is NOT ERR_VGB_NONCOMPLIANT and NOT ERR_OUTSTANDING_FEES even though both conditions hold"
            - "Facility.${fac_id}.vgb_compliance_status == NONCOMPLIANT at clock 2026-06-15T00:00:00Z, confirming the safety rule genuinely applies"
            - "Permit.${permit_id}.status == ISSUED and assessed_fee_cents == 30000 (unchanged by the rejected request)"
            - "Operator.${op_id}.fee_balance_cents == 30000 (no second PERMIT_FEE posted)"

