      - name: salt_spray_failure_reenters_rework_loop
        claim_type: cyclic
        grounds: [state_machines.SaltSprayLot.PENDING_to_FAILED, state_machines.WorkOrder.AWAITING_LOT_TEST_to_REJECTED, calculations.salt_spray_acceptance]
        distinguishing_aspect: "A FAILED lot (2 failures > 1 allowed at sample_count 5) throws the order back into REJECTED with last_defect_type LOT_CORROSION; after a strip-replate lap and a second PASSING lot the order reaches COMPLETE — the lot gate participates in the rework cycle."
        test_recipe:
          setup: ["order WS requires_salt_spray, first pass OK -> AWAITING_LOT_TEST; logical clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Salt Co" }, as: ShopManager, captures: { cs: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-S", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bs: $.data.id } }
