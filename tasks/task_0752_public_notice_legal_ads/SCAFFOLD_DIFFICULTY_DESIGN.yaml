              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_id: "$.data.id"}
            - call: "POST /notices/${notice_id}/submit"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}/proofs"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { proof_id: "$.data[0].id"}
            - call: "POST /proofs/${proof_id}/approve"
              as: Advertiser
              as_user_id: "${acct_id}"
            - call: "GET /notices/${notice_id}"
              as: Advertiser
              as_user_id: "${acct_id}"
              captures: { notice_v: "$.data.version"}
            - call: "POST /notices/${notice_id}/schedule"
              payload: { first_publication_date: "2026-03-01", expected_notice_version: "${notice_v}" }
              as: Advertiser
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /notices/${notice_id}/insertions"
              payload: { scheduled_date: "2026-03-22" }
              as: Advertiser
              as_user_id: "${acct_id}"
          assert:
            - "response.error_id == ERR_INSERTION_SPACING_VIOLATION"
            - "response.http_status == 409"
            - "GET /notices/${notice_id}/insertions returns exactly 2 rows"

  # =========================================================================
  # RULE 9 — compensating-action invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: outstanding_balance_conserved_issue_then_void
        grounds:
          - state_machines.Affidavit.PENDING_to_ISSUED
          - state_machines.Affidavit.ISSUED_to_VOID
          - entities.Account.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (account.outstanding_balance_cents = sum(ISSUED invoice totals) -
          sum(payments)). Forward action issue-affidavit raises it 0 -> 4100; compensating action
          void-affidavit lowers it 4100 -> 0. Net drift is zero: outstanding_balance_cents returns to
          its pre-issue value 0.
