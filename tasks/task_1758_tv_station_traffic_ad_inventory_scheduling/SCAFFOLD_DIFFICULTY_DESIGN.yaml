              as: TrafficManager
              captures: { week14_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week14_id}/avail-units"
              payload: { program_id: "${prog14_id}", air_date: "2026-08-03", break_position: 1, total_seconds: 60 }
              as: TrafficManager
              captures: { unit14_id: "$.data.id",  unit14_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv14_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order14_id: "$.data.id"}
            - call: "POST /traffic/orders/${order14_id}/lines"
              payload: { program_id: "${prog14_id}", weeks_requested: 1, spots_per_week: 2, spot_length_seconds: 30, gross_rate_cents: 7000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order14_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order14_id}"
              payload: {}
              as: SalesRep
              captures: { order14_v: "$.data.version"}
            - call: "POST /traffic/orders/${order14_id}/approve"
              payload: { expected_order_version: "${order14_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv14_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy14_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy14_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order14_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line14_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line14_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot14a_id: "$.data[0].id",  spot14b_id: "$.data[1].id"}
            - call: "POST /traffic/spots/${spot14a_id}/place"
              payload: { avail_unit_id: "${unit14_id}", expected_avail_unit_version: "${unit14_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week14_id}/log-days"
              payload: { log_date: "2026-08-03" }
              as: TrafficManager
              captures: { log14_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log14_id}/finalize"
              payload: {}
              as: TrafficManager
            - call: "GET /traffic/avail-units/${unit14_id}"
              payload: {}
              as: TrafficManager
              captures: { unit14_v_locked: "$.data.version"}
          trigger:
            - call: "POST /traffic/spots/${spot14b_id}/place"
              payload: { avail_unit_id: "${unit14_id}", expected_avail_unit_version: "${unit14_v_locked}" }
              as: TrafficManager
              captures: { lock_err: "$.data.error_id"}
          assert:
            - "${lock_err} == ERR_INVALID_STATE — owning AvailWeek is LOCKED after finalize"
            - "Spot.${spot14b_id}.status stays PENDING_PLACEMENT"
            - "AvailUnit.${unit14_id}.booked_commercial_seconds stays 30 (no partial placement)"
      - name: reconcile_gated_by_logday_finalized
        grounds:
          - state_machines.Spot.SCHEDULED_to_AIRED
          - state_machines.LogDay.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Pair (Spot, LogDay): a Spot reaches AIRED only via reconcile of a
          LogDay in status FINALIZED; reconciling while the LogDay is DRAFT
          is rejected — Spot terminal progress depends on LogDay state, a
          different entity pair than (Spot, AvailWeek).
        test_recipe:
