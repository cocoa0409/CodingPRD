          trigger:
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st2}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403; data.error_id == ERR_NOT_RESOURCE_OWNER"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A protected endpoint (GET /clients/{id}) called with an unrecognized role returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["A registered client."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
          trigger:
            - { call: "GET /clients/${c}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 401; data.error_id == ERR_UNAUTHENTICATED (Anonymous is not a read role)"

  # ---------------------------------------------- Cross-cutting: OCC / errors
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_client_version_on_schedule_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fix-schedule-stale-client]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After scheduling fix A (which bumps Client.version), scheduling fix B with the pre-A expected_client_version returns 412 ERR_STALE_VERSION; the successful first schedule proves the version advanced."
        test_recipe:
          setup: ["CA client ACTIVE; client version captured before any schedule."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (second schedule carries the stale pre-A version)"

      - name: occ_correct_version_supersedes_prior_fix
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fix-schedule-stale-client]", state_machines.Fix.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Scheduling fix B with the CURRENT (re-read) client version succeeds and supersedes prior REQUESTED fix A (A -> CANCELLED); Client.version increments each time."
        test_recipe:
          setup: ["CA client ACTIVE with REQUESTED fix A; client version re-read after A."]
          setup_api_calls:
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv1: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv1}" }, as: Client, as_user_id: "${c}", captures: { fa: $.data.id } }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv2: $.data.version } }
          trigger:
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv2}" }, as: Client, as_user_id: "${c}", captures: { fb: $.data.id } }
          assert:
            - "HTTP 201; Fix.${fb} created REQUESTED; Fix.${fa}.status == CANCELLED (superseded)"

  - section: errors
    instances:
      - name: assign_inactive_stylist_returns_inactive
        claim_type: violation_to_error
        grounds: ["errors[ERR_STYLIST_INACTIVE]", state_machines.Stylist.ACTIVE_to_INACTIVE]
        distinguishing_aspect: "Assigning a fix to a deactivated (INACTIVE) stylist returns 409 ERR_STYLIST_INACTIVE."
        test_recipe:
          setup: ["CA client ACTIVE with a REQUESTED fix; stylist deactivated."]
          setup_api_calls:
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: "$.data.id" } }
            - { call: "POST /stylists/${st}/deactivate", payload: {}, as: OpsAdmin }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: "$.data.id" } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: "$.data.version" } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: "$.data.id" } }
          trigger:
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409; data.error_id == ERR_STYLIST_INACTIVE"

      - name: fix_not_found_under_wrong_path
        claim_type: violation_to_error
        grounds: ["errors[ERR_FIX_NOT_FOUND]"]
        distinguishing_aspect: "GET /fixes/{bogus} returns 404 ERR_FIX_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /fixes/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; data.error_id == ERR_FIX_NOT_FOUND"

      - name: return_receive_twice_not_receivable
        claim_type: violation_to_error
        grounds: ["errors[ERR_RETURN_NOT_RECEIVABLE]", state_machines.ReturnShipment]
        distinguishing_aspect: "Receiving an already-RECEIVED ReturnShipment returns 409 ERR_RETURN_NOT_RECEIVABLE."
        test_recipe:
          setup: ["A fix whose ReturnShipment has already been RECEIVED (kept 1 of 3, received)."]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "A", name: "A", category: "TOP", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "B", name: "B", category: "BOTTOM", size: 8, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p2: $.data.id } }
            - { call: "POST /products", payload: { sku: "C", name: "C", category: "SHOE", size: 9, price_cents: 3000, total_stock: 5 }, as: OpsAdmin, captures: { p3: $.data.id } }
            - { call: "POST /stylists", payload: { email: "s@x.com", name: "S" }, as: OpsAdmin, captures: { st: $.data.id } }
            - { call: "POST /clients", payload: { email: "c@x.com", full_name: "C", region_code: "CA" }, as: Anonymous, captures: { c: $.data.id } }
            - { call: "POST /clients/${c}/style-profile", payload: { quiz_top_size: 8, quiz_bottom_size: 8, quiz_shoe_size: 9, price_tier: "MID" }, as: Client, as_user_id: "${c}" }
            - { call: "GET /clients/${c}", payload: {}, as: OpsAdmin, captures: { cv: $.data.version } }
            - { call: "POST /clients/${c}/fixes", payload: { expected_client_version: "${cv}" }, as: Client, as_user_id: "${c}", captures: { fix: $.data.id } }
            - { call: "POST /fixes/${fix}/assign", payload: { stylist_id: "${st}" }, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p1}" }, as: Stylist, as_user_id: "${st}", captures: { i1: $.data.id } }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p2}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/items", payload: { product_id: "${p3}" }, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/submit-preview", payload: {}, as: Stylist, as_user_id: "${st}" }
            - { call: "POST /fixes/${fix}/ship", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/mark-delivered", payload: {}, as: OpsAdmin }
            - { call: "POST /fixes/${fix}/checkout", payload: { kept_item_ids: ["${i1}"] }, as: Client, as_user_id: "${c}" }
            - { call: "GET /fixes/${fix}/returns", payload: {}, as: OpsAdmin, captures: { ret: "$.data[0].id" } }
            - { call: "POST /fixes/${fix}/returns/${ret}/receive", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /fixes/${fix}/returns/${ret}/receive", payload: {}, as: OpsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; data.error_id == ERR_RETURN_NOT_RECEIVABLE"

  # ----------------------------------------------- Stubs (covered by §1.8)
  - section: state_machines
    instances:
      - name: fix_preview_revision_cycle_stub
        claim_type: cyclic
        grounds: [state_machines.Fix.PREVIEW_to_STYLING]
        excluded_because:
          difficulty_instance: non_linear_state_machine / fix_preview_revision_cycle
          rationale: "The STYLING<->PREVIEW revision cycle is exercised directly by the named §1.8 instance."
      - name: client_pause_resume_cycle_stub
        claim_type: cyclic
        grounds: [state_machines.Client.PAUSED_to_ACTIVE]
        excluded_because:
          difficulty_instance: non_linear_state_machine / client_pause_resume_cycle
          rationale: "ACTIVE<->PAUSED cycle asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: hold_overlap_stub
        claim_type: Temporal validation
        grounds: ["errors[ERR_HOLD_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_windows_pairwise_overlap_rejected
          rationale: "ERR_HOLD_OVERLAP is the asserted failure of the named §1.8 instance."
      - name: stylist_capacity_stub
        claim_type: Aggregate validation
        grounds: ["errors[ERR_STYLIST_AT_CAPACITY]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stylist_aggregate_capacity_exceeded
          rationale: "ERR_STYLIST_AT_CAPACITY is asserted by the named §1.8 instance."
      - name: checkout_deadline_inclusive_stub
        claim_type: Temporal validation
        grounds: [state_machines.Fix.DELIVERED_to_CHECKED_OUT]
        excluded_because:
          difficulty_instance: boundary_precision_check / checkout_at_exact_deadline_inclusive
          rationale: "The inclusive deadline boundary is asserted by the named §1.8 instance; §1.9 adds only the strictly-after complement."
