          setup:
            - "Logical clock at 2026-08-02T08:00:00Z, then advanced to 2026-08-20T08:00:00Z."
            - "One community with residents A and B, both baseline_weight_kg 78.0."
            - "Each resident has one observation on 2026-08-02 at 80.0 kg with intake_pct 80 (well above the 50.00 intake trigger)."
