  - method: GET
    path: "/rmn/trade-fund-accounts"
    description: "Lists trade-fund accounts, filterable by owning advertiser, fiscal period and status."
    roles: [NetworkAdmin, BillingOps, CreditAnalyst, AccountManager, AdvertiserUser]
    code: 200
    input: ["advertiser_id?", "fiscal_period_code?", "account_status?", "limit?", "offset?"]
    output: TradeFundAccount[]
    side_effects: []
  - method: GET
    path: "/rmn/trade-fund-accounts/{id}"
    description: "Reads one trade-fund account with its accrued / reserved / deducted / available decomposition."
    roles: [NetworkAdmin, BillingOps, CreditAnalyst, AccountManager, AdvertiserUser]
    code: 200
    input: []
    output: TradeFundAccount
    side_effects: []
  - method: POST
    path: "/rmn/trade-fund-accounts/{id}/accruals"
    description: "Books a supplier accrual into an OPEN fund account, raising the pool the media deduction waterfall can draw on."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["accrual_amount_cents", "accrual_reference"]
    output: TradeFundAccount
    side_effects: ["adds accrual_amount_cents to accrued_cents and to available_cents via trade_fund_available", "increments TradeFundAccount.version by 1"]
  - method: POST
    path: "/rmn/trade-fund-accounts/{id}/deductions"
    description: "Applies a manual deduction against an OPEN fund account. Optimistically concurrent against the fund account itself."
    roles: [NetworkAdmin, BillingOps]
    code: 201
    input: ["deduction_amount_cents", "deduction_reference", "expected_trade_fund_account_version"]
    output: TradeFundAccount
    side_effects: ["moves deduction_amount_cents from available_cents to deducted_cents, preserving accrued == available + reserved + deducted", "increments TradeFundAccount.version by 1"]
  - method: POST
    path: "/rmn/trade-fund-accounts/{id}/freeze"
    description: "Freezes an OPEN fund account so no accrual, deduction or invoice issuance may touch it."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["frozen_reason"]
    output: TradeFundAccount
    side_effects: ["sets account_status=FROZEN", "blocks the trade-fund leg of invoice_settlement_waterfall for every DRAFT invoice bound to this account", "increments TradeFundAccount.version by 1"]
  - method: POST
    path: "/rmn/trade-fund-accounts/{id}/unfreeze"
    description: "Returns a FROZEN fund account to OPEN, optionally passing through RECONCILING when a reconciliation pass is requested."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["run_reconciliation?"]
    output: TradeFundAccount
    side_effects: ["sets account_status=OPEN (via RECONCILING when run_reconciliation is true) and stamps last_reconciled_at", "clears frozen_reason", "increments TradeFundAccount.version by 1"]
  # --- Campaign -------------------------------------------------------------
  - method: POST
    path: "/rmn/campaigns"
    description: "Creates a DRAFT campaign bound to one funded budget plan, fixing its channel mix, pacing mode and attribution model."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 201
    input: ["advertiser_id", "budget_plan_id", "name", "channel_mix", "flight_start_at", "flight_end_at", "allocated_budget_cents", "pacing_mode", "daily_cap_cents", "attribution_model", "attribution_window_days"]
    output: Campaign
