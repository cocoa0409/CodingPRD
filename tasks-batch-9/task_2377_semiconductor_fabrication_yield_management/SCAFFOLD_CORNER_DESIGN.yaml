              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 25 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id, lot_v0: $.data.version }
