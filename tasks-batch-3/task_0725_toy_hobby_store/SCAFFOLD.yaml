# =============================================================================
# PRD-bench scaffold: Toy & Hobby Store (specialty retail) — Expert
# =============================================================================

scenario: |
  725. Toy & Hobby Store (specialty retail): SKU & age-grade/safety labeling,
  seasonal & exclusive/allocation, demo/event & loyalty, special order & layaway,
  gift registry/wishlist, recall management, BOPIS/ship-from-store, return policy

domain_name: toy-hobby-store
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers: [cascading_side_effects, rate_threshold_triggers, optimistic_concurrency, derived_field_reconciliation]
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, cross_aggregate, polymorphic]
  role_model: peer_roles
  consistency_model: immediate
  difficulty: Expert

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit code", constraints: "unique across all Products" }
      - { name: name, type: string, source: input, description: "Product display name" }
      - { name: category, type: enum, source: input, description: "BOARD_GAME | MODEL_KIT | PLUSH | ACTION_FIGURE | CRAFT_KIT" }
      - { name: age_grade_min_months, type: integer, source: input, description: "Minimum recipient age in months for safe use", constraints: ">= 0" }
      - { name: safety_labels, type: array, source: input, description: "Array of enum labels: CHOKING_HAZARD | SMALL_PARTS | FLAMMABLE | BATTERY | NONE" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in cents", constraints: ">= 0" }
      - { name: is_exclusive, type: boolean, source: input, default: false, description: "Exclusive/allocation-only item; never discountable" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DISCONTINUED", default: DRAFT }
      - { name: recall_status, type: enum, source: system, description: "CLEARED | RECALLED (parallel dimension to status)", default: CLEARED }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Store name" }
      - { name: state_code, type: string, source: input, description: "US state code, 2 letters" }
      - { name: event_buffer_minutes, type: integer, source: input, default: 30, description: "Required cleanup gap between demo events at this store" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: InventoryItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: store_id, type: string, source: input, description: "FK -> Store.id" }
      - { name: on_hand_qty, type: integer, source: system, description: "Total physical units held; conserved quantity", constraints: ">= 0" }
      - { name: reserved_qty, type: integer, source: computed, description: "Units reserved by open/submitted OrderLines", constraints: ">= 0" }
      - { name: quarantined_qty, type: integer, source: computed, description: "Units frozen by an active recall", constraints: ">= 0" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty - quarantined_qty", constraints: ">= 0" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 on every mutation" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
