              payload: { first_name: "Lang", last_name: "Uage", date_of_birth: "1981-01-21", sex_at_birth: "M", primary_phone: "+15551400002" }
              as: Registrar
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /patient-access/patients/${p_id}/accommodation-flags"
              payload: { flag_type: "INTERPRETER" }
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "POST /patient-access/patients/${p_id}/accommodation-flags"
              payload: { flag_type: "INTERPRETER", language_code: "es" }
              as: Registrar
              captures: { ok_id: $.data.id }
          assert:
            - "err == ERR_LANGUAGE_REQUIRED"
            - "ok_id is a non-null UUID"

      - name: priority_rank_conflict_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_PRIORITY_RANK_CONFLICT]
        distinguishing_aspect: "Second ACTIVE policy with priority_rank 1 for the same patient returns ERR_PRIORITY_RANK_CONFLICT / 409."
        test_recipe:
          setup: ["patient with one ACTIVE policy rank 1"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Rank", last_name: "One", date_of_birth: "1982-02-22", sex_at_birth: "F", primary_phone: "+15551400003" }
              as: Registrar
              captures: { p_id: $.data.id }
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER1", member_id: "MRK1", plan_type: "PPO", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
          trigger:
            - call: "POST /patient-access/insurance-policies"
              payload: { patient_id: "${p_id}", payer_id: "PAYER2", member_id: "MRK2", plan_type: "MEDICARE", effective_start: "2026-01-01", priority_rank: 1, deductible_remaining_cents: 0, oop_max_remaining_cents: 500000 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PRIORITY_RANK_CONFLICT"

      - name: cross_patient_policy_reference_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_CROSS_PATIENT_REFERENCE]
        distinguishing_aspect: "Creating a CopayEstimate naming a policy that belongs to a different patient returns ERR_CROSS_PATIENT_REFERENCE / 422."
        test_recipe:
          setup: ["patients P1, P2; policy of P2; appointment of P1"]
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Xp", last_name: "One", date_of_birth: "1983-03-23", sex_at_birth: "M", primary_phone: "+15551400004" }
              as: Registrar
              captures: { p1: $.data.id }
            - call: "POST /patient-access/patients"
              payload: { first_name: "Xp", last_name: "Two", date_of_birth: "1984-04-24", sex_at_birth: "F", primary_phone: "+15551400005" }
              as: Registrar
              captures: { p2: $.data.id }
