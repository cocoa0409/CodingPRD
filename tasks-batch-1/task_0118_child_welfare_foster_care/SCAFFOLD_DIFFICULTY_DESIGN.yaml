  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: visitation_half_open_interval_overlap_rejected
        grounds:
          - validations[priority=10]
          - errors[ERR_VISIT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics A — half-open [window_start, window_end) overlap on the CHILD resource:
          a new visit whose window genuinely intersects an existing SCHEDULED visit (10:30 inside
          [10:00,11:00)) is rejected ERR_VISIT_OVERLAP. Geometric treatment: strict interior overlap.
        test_recipe:
          setup:
            - "A child has one SCHEDULED visit [10:00, 11:00) under a case plan."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
