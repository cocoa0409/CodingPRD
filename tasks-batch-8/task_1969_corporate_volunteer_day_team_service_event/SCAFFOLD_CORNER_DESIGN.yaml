  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: net_event_cost_offset_capped_at_half_gross
        claim_type: correct_result
        grounds: [calculations.net_event_cost, calculations.event_spend_position, entities.ServiceEvent.fields.net_event_cost_cents]
        distinguishing_aspect: "Mode (c) circular-looking dependency resolved by pinned evaluation order: with committed gross 1088 and a COMMITTED FLAT sponsorship of 10000, the offset is min(10000, round_half_up(0.50 x 1088) = 544) = 544, so net_event_cost_cents == 1088 - 544 == 544 — the 50%-of-gross cap binds, not the credit."
        test_recipe:
          setup:
            - "Event budget 1000000; project MATCHED; order total 1088 APPROVED (committed); FLAT sponsorship rate 10000 cap 20000 COMMITTED"
          setup_api_calls:
            - { call: "POST /nonprofit-partners", payload: { name: "River Guild", contact_email: "ops@river.org" }, as: CommunityEngagementManager, captures: { np1: $.data.id } }
            - { call: "POST /service-projects", payload: { nonprofit_id: "${np1}", title: "Park Build", min_volunteers: 1, max_volunteers: 10 }, as: NonprofitCoordinator, as_user_id: "${np1}", captures: { proj1: $.data.id } }
            - { call: "POST /service-events", payload: { name: "Day 10", event_start_at: "2026-08-20T09:00:00Z", event_end_at: "2026-08-20T15:00:00Z", budget_cents: 1000000 }, as: CommunityEngagementManager, captures: { ev1: $.data.id } }
            - { call: "POST /service-projects/${proj1}/vet", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /service-projects/${proj1}/match", payload: { event_id: "${ev1}" }, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders", payload: { event_id: "${ev1}", project_id: "${proj1}", lines: [ { item_name: "Gloves", quantity: 2, unit_cost_cents: 500 } ] }, as: CommunityEngagementManager, as_user_id: "cem-1", captures: { ord1: $.data.id } }
            - { call: "POST /procurement-orders/${ord1}/submit", payload: {}, as: CommunityEngagementManager }
            - { call: "POST /procurement-orders/${ord1}/approve", payload: {}, as: ProcurementOfficer, as_user_id: "po-1" }
            - { call: "POST /sponsorships", payload: { event_id: "${ev1}", sponsor_name: "FlatCorp", match_type: "FLAT", rate_cents: 10000, pledge_cap_cents: 20000 }, as: FinanceController, captures: { sp1: $.data.id } }
            - { call: "POST /sponsorships/${sp1}/commit", payload: {}, as: FinanceController }
          trigger:
            - { call: "GET /service-events/${ev1}", payload: {}, as: Any, captures: { gross: $.data.committed_spend_cents, credit: $.data.sponsorship_credit_cents, net: $.data.net_event_cost_cents } }
          assert:
            - "committed_spend_cents == 1088 (round_half_up(2 x 500 x 1.0875) = 1088)"
            - "sponsorship_credit_cents == 10000 (COMMITTED provisional FLAT = min(10000, cap 20000))"
            - "net_event_cost_cents == 544: offset = min(10000, round_half_up(0.5 x 1088) = 544) = 544; net = 1088 - 544"

