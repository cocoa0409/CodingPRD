        distinguishing_aspect: "One error code guards both ends of the submit/accept bracket: an empty turn-in cannot be submitted and a turn-in holding an unassessed asset cannot be accepted, so ERR_TURN_IN_NOT_ASSESSED is reachable from two different from-states."
