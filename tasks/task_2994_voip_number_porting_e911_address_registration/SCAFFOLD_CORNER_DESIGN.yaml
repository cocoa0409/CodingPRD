            - "NumberReservation.${res1_id}.status is still HELD and PhoneNumber.${pn1_id}.status is still RESERVED"
            - "NumberBlock.${blk_id}.reserved_count == 1 and version equals ${blk_v2}"

      - name: the_third_resubmission_is_refused_once_the_limit_is_reached
        claim_type: aggregate_validation
        grounds:
          - validations[priority=36]
          - state_machines.PortRequest
