            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-17T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
            - call: "POST /reskilling-programs/${rp_id}/enrollments"
              payload: { consultant_id: "${c1_id}" }
              as: ResourceManager
              captures: { bs_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ResourceManager
            - call: "POST /bench-runs"
              payload: {}
              as: ResourceManager
          trigger:
            - call: "POST /reskilling-programs/${rp_id}/complete"
              payload: {}
              as: ResourceManager
