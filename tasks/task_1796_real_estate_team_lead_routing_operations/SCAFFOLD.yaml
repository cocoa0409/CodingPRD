    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: RoutingPolicy
    side_effects: []
  - method: GET
    path: "/crm/routing-policies"
    description: "List routing policies"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
