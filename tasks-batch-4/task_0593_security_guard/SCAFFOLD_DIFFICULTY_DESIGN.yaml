            - call: "GET /guards/${guard_id}/payroll-summary"
              payload: { week_start: "2026-05-04T00:00:00Z" }
              as: ComplianceOfficer
          assert:
            - "CoverageShift.${s1_id}.pay_cents == 26400"
            - "CoverageShift.${s4_id}.paid_hours == 8.00"
            - "CoverageShift.${s4_id}.overtime_hours == 4.00"
            - "CoverageShift.${s4_id}.pay_cents == 24200"
            - "payroll-summary.total_paid_hours == 44.00"
            - "payroll-summary.regular_hours == 40.00"
            - "payroll-summary.overtime_hours == 4.00"
            - "payroll-summary.weekly_pay_cents == 103400"
            - "payroll-summary.shift_count == 4"

      - name: invoice_admin_fee_tier_keyed_on_subtotal_not_total
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.admin_fee_pct
          - entities.Invoice.fields.admin_fee_cents
          - entities.Invoice.fields.total_cents
          - state_machines.Invoice.DISPUTED_to_ADJUSTED
        distinguishing_aspect: |
          Mode (c) — the circular-looking total/fee dependency is resolved by pinning the tier lookup on
          subtotal_cents: a 40000-cent credit drops the subtotal from 180000 (tier 5.0%) to 140000 (tier 8.0%),
          so admin_fee_cents RISES from 9000 to 11200 while total_cents falls from 189000 to 151200 — an
          implementation that keys the tier on total_cents cannot reproduce both numbers.
        test_recipe:
          setup:
            - "Client Acme (margin_floor_pct 20.0) with one post at bill_rate 4500 c/h, no checkpoints."
            - "Guard Ada (pay_rate 2200 c/h) worked and had VERIFIED four shifts in the week of 2026-05-04: three 12h shifts (final 54000 each, pay 26400 each) and one 4h shift (final 18000, pay 8800)."
            - "An invoice for [2026-05-04, 2026-05-11) has been created (subtotal 180000, admin_fee_pct 5.0, total 189000), ISSUED and then DISPUTED."
