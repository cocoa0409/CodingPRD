      - name: direct_routing_requires_a_claimant_rate_and_collective_requires_a_collective
        claim_type: conditional_validation
        grounds:
          - validations.priority_20
          - errors.ERR_COLLECTIVE_NOT_ELIGIBLE
          - entities.RightsHolder.fields.direct_deal_rate_bps
        distinguishing_aspect: |
          Priority 20 is routing-conditional and points in two directions: with routing DIRECT it
          inspects the CLAIMANT's direct_deal_rate_bps (null means there is no deal to pay under),
          and with routing COLLECTIVE it inspects the referenced collective_id's holder_type. A
          LABEL passed as collective_id resolves as a real RightsHolder — so this is not a 404 — but
          is still ineligible.
        test_recipe:
          setup:
            - "A LABEL with direct_deal_rate_bps OMITTED (null), a LABEL with a rate, a PUBLISHER with a rate, a COLLECTIVE holder whose home_territory_code is WORLD, one RECORDING and one COMPOSITION with no usage."
