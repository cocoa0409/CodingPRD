            - "OrderLine.${line_id}.allocated_yards == 4.950 and shortfall_yards == 10.000 and status == MATERIAL_SHORTFALL"
            - "CustomerOrder.${order_id}.status == MATERIAL_HOLD (caused by the line flip, not by the recall directly)"
            - "CellBooking.${booking_id}.status == RELEASED and Cell.${c_cut}.committed_hours == 0.0 (end of the chain)"

      - name: order_cancel_cascade
        grounds:
          - state_machines.CustomerOrder.CONFIRMED_to_CANCELLED
          - state_machines.OrderLine.ALLOCATED_to_CANCELLED
          - state_machines.MaterialAllocation.ACTIVE_to_RELEASED
          - state_machines.SupplyRequisition.OPEN_to_CANCELLED
          - state_machines.CutPlan.DRAFT_to_VOID
          - state_machines.ComplianceCertificate.DRAFT_to_VOID
        distinguishing_aspect: |
          Trigger = POST /mill/customer-orders/{id}/cancel (different trigger from the lot
          recall instance). Depth 3: order → CANCELLED causes lines → CANCELLED, which causes
          each line's ACTIVE allocations → RELEASED, which causes the lot's allocated_yards to
          recompute to 0.0; the same cascade also fans out to requisitions, cut plans,
          bookings, and certificates.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-CX (no match, rule (A, ESPRESSO, allowed, 0), no components, TB117_2013)"
            - "PLANT spec FAB-A; lot AVAILABLE 30.0 yards; order ORD-CX with line qty 2 confirmed → CONFIRMED (7.165 yards reserved)"
            - "One OPEN DOMESTIC requisition (FRAME × 10); one DRAFT cut plan; one BOOKED CUT booking; one DRAFT certificate"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-CX", category: "CHAIR", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 30.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 30.0 }
              as: MaterialReceiver
            - call: "POST /mill/material-lots/${lot_id}/inspect"
              payload: { result: "PASS", usable_yards: 30.0, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-CX", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 2 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/supply-requisitions"
              payload: { order_line_id: "${line_id}", component_code: "FRAME", quantity: 10, source_type: "DOMESTIC" }
              as: ProductionPlanner
              captures: { req_id: $.data.id }
            - call: "GET /mill/order-lines/${line_id}"
              as: ProductionPlanner
              captures: { ln_v: $.data.version }
            - call: "POST /mill/order-lines/${line_id}/cut-plans"
              payload: { expected_order_line_version: "${ln_v}" }
              as: ProductionPlanner
              captures: { cp_id: $.data.id }
            - call: "POST /mill/cells"
              payload: { cell_code: "C-CUT", cell_type: "CUTTING", capacity_slots: 1, certifications: [] }
              as: ProductionPlanner
              captures: { c_cut: $.data.id }
            - call: "POST /mill/cell-bookings"
              payload: { cell_id: "${c_cut}", order_line_id: "${line_id}", operation: "CUT", start_at: "2026-06-03T08:00:00Z", end_at: "2026-06-03T10:00:00Z" }
              as: ProductionPlanner
              captures: { booking_id: $.data.id }
            - call: "POST /mill/compliance-certificates"
              payload: { order_id: "${order_id}", standard: "TB117_2013", label_lot_number: "LBL-1", label_count: 2 }
