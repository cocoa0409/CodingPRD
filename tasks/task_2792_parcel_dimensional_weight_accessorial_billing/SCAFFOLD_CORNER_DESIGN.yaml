            - call: "GET /shipments/${pa}/billing-preview"
              payload: {}
              as: RevenueAuditor
              as_user_id: "auditor.one"
              captures: { prev: $.data.line_total_cents }
          assert:
            - "Every call above returns 200 or 201 — no ERR_ROLE_NOT_PERMITTED and no ERR_SHIPPER_SCOPE_VIOLATION anywhere in the chain"
            - "${c1_state} == ACTIVE and ${w_state} == ACTIVE — CarrierAdmin owns onboarding, contracts, service levels and windows"
            - "${tol} == WITHIN_TOLERANCE and ${pa_mv} == DELIVERED — CarrierOps owns induction, scanning and delivery"
            - "${manual_amt} == 2200 — POST /shipments/{id}/accessorials is a shared operation and CarrierOps may use it (BillingOps may too)"
            - "${lc} == 1 and ${net} == 3250, then ${inv_state} == ISSUED — BillingOps owns the sweep and the issue"
            - "${ev_ok} == true and ${credit} == 590 — ShipperUser owns disputes and evidence, RevenueAuditor owns the evidence request and the resolution"
            - "${prev} == 2660 after the resolution waived the RESIDENTIAL charge — GET /shipments/{id}/billing-preview is shared between BillingOps and RevenueAuditor"
            - "The November PEAK window never touched the August pricing"

      - name: no_role_may_reach_another_roles_exclusive_operations
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds:
          - validations[priority=3]  # ERR_ROLE_NOT_PERMITTED
          - roles[CarrierOps]
          - roles[BillingOps]
          - roles[RevenueAuditor]
        distinguishing_aspect: |
          Seven crossings of the role boundary all return 403 ERR_ROLE_NOT_PERMITTED, including
          the two that a naive implementation is most likely to allow: CarrierAdmin — the
          most powerful role — may not issue an invoice, and RevenueAuditor, who adjudicates
          the money, may not propose the adjustment that moves it.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
