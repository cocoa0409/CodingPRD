      - name: information_architecture_depth_limit_exceeded_at_the_sixth_level
        claim_type: error_triggerable
        grounds: ["errors.ERR_IA_DEPTH_EXCEEDED", "validations.priority_41", "entities.Topic.ia_depth"]
        distinguishing_aspect: "MAX_IA_DEPTH is 4 and ia_depth starts at 0 for a root, so a chain of FIVE topics is legal and only the sixth is rejected. An off-by-one implementation rejects the fifth (depth 4) or accepts the sixth (depth 5)."
