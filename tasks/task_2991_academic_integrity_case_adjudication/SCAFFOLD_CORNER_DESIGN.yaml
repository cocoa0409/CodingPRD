            - call: "POST /integrity/panel-votes"
              payload: { session_id: "${session_id}", panelist_id: "${pan1_id}", verdict: "RESPONSIBLE", severity_recommendation: 3 }
              as: IntegrityOfficer
              captures: { err_officer_cannot_vote: $.data.error_id }
            - call: "POST /integrity/cases/${case_id}/notation/post"
              as: IntegrityOfficer
              captures: { err_officer_cannot_post_notation: $.data.error_id }
            - call: "POST /integrity/sanctions"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v_notified}", kind: "GRADE_PENALTY_COURSE", ladder_rank: 3, effective_from: "2026-08-21T00:00:00Z" }
              as: PanelChair
