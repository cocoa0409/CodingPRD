  # =====================================================================
  # R6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: spc_control_limit_is_inclusive_at_exactly_ucl
        grounds:
          - calculations.spc_violation_classification
          - state_machines.SpcChart.MONITORING_to_SUSPENDED
          - entities.MetrologyMeasurement.fields.classification
          - endpoints[POST /fab/measurements]
        distinguishing_aspect: |
          Metric: the SPC control-limit comparison, which is INCLUSIVE (measured_value >= ucl is a
          violation) while the spec-limit comparison on the same chart is STRICT (> usl). Endpoint:
          POST /fab/measurements. 105.99 against ucl 106.00 is only a WARN, and one hundredth
          higher — exactly 106.00 — flips to OUT_OF_CONTROL, opens an excursion and suspends
          the chart. Naive `> ucl` implementations classify 106.00 as WARN and never suspend.
        test_recipe:
          setup:
            - "FLOW-A RELEASED (seq 10 LITHO 2.0h, seq 20 ETCH 3.0h metrology-required with rework target seq 10, seq 30 LITHO 2.0h) with one SPC chart on seq 20: target 100.00, sigma 2.00, usl 110.00, lsl 90.00, ucl 106.00, lcl 94.00, status MONITORING, consecutive_same_side_count 0, violation_count 0."
            - "LITHO-1/CH_L1 and ETCH-1/CH_E1 QUALIFIED at 2026-08-01T00:00:00Z; operator OP-001 certified for LITHO/ETCH/CMP and GOWNED."
            - "PLAN-A COMMITTED; LOT-001 (3 wafers, STANDARD) released, step seq 10 tracked out, and an OPEN step-seq-20 run on CH_E1."
            - "No measurement and no excursion exist yet."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
