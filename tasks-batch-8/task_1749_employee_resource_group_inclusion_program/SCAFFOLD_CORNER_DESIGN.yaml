            - { call: "GET /v1/venues/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: DeiAdmin, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "err == ERR_NOT_FOUND and msg is a non-empty string"
            - "envelope has meta.api_request_id and meta.api_request_timestamp, response_type == 'error'"
      - name: fk_reverse_reachability_filtered_lists
        claim_type: standard_crud
        grounds:
          - entities.ErgEvent.fields.venue_id
          - entities.GroupMembership.fields.group_id
        distinguishing_aspect: "Every FK is discoverable from the parent side via the filtered-list GETs: events by venue_id, memberships by group_id."
        test_recipe:
          setup: ["program OPEN; group CHARTER_DRAFT with 2 members; venue"]
          setup_api_calls:
            - { call: "POST /v1/programs", payload: { fiscal_year: 2027, pool_total_cents: 100000 }, as: DeiAdmin, captures: { pid: $.data.id } }
            - { call: "POST /v1/programs/${pid}/open", payload: {}, as: DeiAdmin }
