            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingAdministrator
              captures: { inv: $.data.id, prov_sub: $.data.line_subtotal_cents }
          trigger:
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { err_empty: $.data.error_id }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { final_total: $.data.total_due_cents }
          assert:
            - "Before the trigger: Invoice.${inv}.variant == PROVISIONAL, line_entry_ids == [${te}], line_subtotal_cents == 22500, admin_fee_cents == 1575, total_due_cents == 24075"
            - "The first ISSUED attempt returns HTTP 422 with error_id ERR_NO_BILLABLE_ACTIVITY"
            - "After the failed attempt: Invoice.${inv}.status == DRAFT and Invoice.${inv}.issued_at == null and TimeEntry.${te}.status == SUBMITTED"
            - "After the entry is APPROVED, the second ISSUED attempt returns HTTP 200 with Invoice.${inv}.status == ISSUED"
            - "After issuing: Invoice.${inv}.variant == FINAL, line_entry_ids == [${te}], line_subtotal_cents == 22500, admin_fee_cents == 1575, total_due_cents == 24075"
            - "After issuing: Invoice.${inv}.retainer_applied_cents == 0 and Invoice.${inv}.balance_due_cents == 24075 and TimeEntry.${te}.status == INVOICED"
            - "After issuing: Client.${cli}.status == PROSPECT (no care plan was ever activated, so no nonpayment suspension is reachable)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: care_plan_creation_requires_accepted_assessment_state
        grounds:
          - validations[priority=42]
          - errors[ERR_ASSESSMENT_NOT_ACCEPTED]
          - state_machines.Assessment.SUBMITTED_to_ACCEPTED
          - entities.CarePlan.fields.source_assessment_id
          - entities.CarePlan.fields.pinned_assessment_version
        distinguishing_aspect: |
          Entity pair CarePlan -> Assessment: POST /care/care-plans is legal only while the named
          Assessment sits in status ACCEPTED, so the identical request body is refused with
          ERR_ASSESSMENT_NOT_ACCEPTED while the assessment is SUBMITTED and accepted afterwards,
          pinning the assessment's post-acceptance version onto the new plan.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-14T09:00:00Z."
            - "Care manager Dana (author) and supervisor Iris (reviewer)."
            - "Client Jonah with one Assessment in status SUBMITTED (never accepted yet)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Jonah Sturridge", residence_setting: "SKILLED_NURSING" }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 3, cognition: 3, medical_complexity: 3, social_support: 3, safety: 3, finances: 3 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm_status_1: $.data.status }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
          trigger:
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Reduce fall risk"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_state: $.data.error_id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { asm_v_accepted: $.data.version }
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v2: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v2}", goals: ["Reduce fall risk"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
          assert:
            - "The first POST /care/care-plans returns HTTP 409 with error_id ERR_ASSESSMENT_NOT_ACCEPTED"
            - "GET /care/care-plans?client_id=${cli} returns an empty list immediately after the rejected call"
            - "Assessment.${asm}.status == ACCEPTED and Assessment.${asm}.comprehensive_acuity == 60 after the review transition"
            - "The second POST /care/care-plans returns HTTP 201 with CarePlan.${cp}.status == DRAFT"
            - "CarePlan.${cp}.pinned_assessment_version == ${asm_v_accepted}"
            - "CarePlan.${cp}.coverage_gap_flag == true and CarePlan.${cp}.activated_at == null"
            - "Client.${cli}.risk_posture == ROUTINE (acuity_score 60 < 70)"

      - name: authorization_authorize_requires_active_care_plan_state
        grounds:
          - validations[priority=44]
          - errors[ERR_CARE_PLAN_NOT_ACTIVE]
          - state_machines.ServiceAuthorization.PROPOSED_to_AUTHORIZED
          - state_machines.CarePlan.PENDING_FAMILY_APPROVAL_to_ACTIVE
          - entities.ServiceAuthorization.fields.care_plan_id
        distinguishing_aspect: |
          A DIFFERENT entity pair — ServiceAuthorization -> CarePlan rather than CarePlan ->
          Assessment: a PROPOSED authorization may be created against a DRAFT plan but may not be
          AUTHORIZED until the parent CarePlan reaches ACTIVE, so the identical PATCH is refused with
          ERR_CARE_PLAN_NOT_ACTIVE before family approval and succeeds unchanged afterwards.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T09:00:00Z."
            - "Care manager Dana, supervisor Iris."
            - "Client Katarina with retainer_floor_cents 0, one surrogate contact Lena, an ACCEPTED assessment and one CarePlan still in DRAFT."
            - "Vendor Northgate Home Care (no referral relationship)."
            - "One ServiceAuthorization in auth_status PROPOSED, coi_status NOT_REQUIRED, against that DRAFT plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Katarina Belov", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Lena Belov", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_lena: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Overnight supervision"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id, cp_v1: $.data.version }
            - call: "POST /care/service-authorizations"
              payload: { care_plan_id: "${cp}", vendor_id: "${vnd}", expected_care_plan_version: "${cp_v1}", coverage_start: "2026-09-01T08:00:00Z", coverage_end: "2026-09-01T16:00:00Z", concurrent_caregivers: 1, hourly_cost_cents: 4000 }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { auth: $.data.id, auth_hours: $.data.coverage_hours }
          trigger:
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { err_plan: $.data.error_id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc_lena}"
            - call: "PATCH /care/service-authorizations/${auth}/state"
              payload: { to_state: "AUTHORIZED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
              captures: { auth_state: $.data.auth_status }
          assert:
            - "The first AUTHORIZED attempt returns HTTP 409 with error_id ERR_CARE_PLAN_NOT_ACTIVE"
            - "After the rejected attempt: ServiceAuthorization.${auth}.auth_status == PROPOSED and Client.${cli}.authorized_coverage_hours == 0"
            - "After family approval: CarePlan.${cp}.status == ACTIVE, CarePlan.${cp}.approved_by_contact_id == ${fc_lena}, Client.${cli}.status == ACTIVE_CARE"
            - "The second AUTHORIZED attempt returns HTTP 200 with ServiceAuthorization.${auth}.auth_status == AUTHORIZED"
            - "ServiceAuthorization.${auth}.coverage_hours == 8 and Client.${cli}.authorized_coverage_hours == 8"
            - "CarePlan.${cp}.coverage_gap_flag == false and Client.${cli}.risk_posture == ROUTINE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: care_manager_calendar_half_open_overlap_and_travel_buffer
        grounds:
          - validations[priority=65]
          - validations[priority=66]
          - errors[ERR_TIME_ENTRY_OVERLAP]
          - errors[ERR_TRAVEL_BUFFER_VIOLATION]
          - entities.TimeEntry.fields.start_at
          - entities.TimeEntry.fields.service_location_id
        distinguishing_aspect: |
          Interval semantics here are HALF-OPEN and PAIRWISE on the CareManager's calendar: an entry
          starting exactly when another ends does NOT collide (15:00 abutting 15:00 is accepted),
          while any strict interior overlap is rejected, and a location change adds a separate
          30-minute geometric buffer that a gap of exactly 30 minutes satisfies.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-16T00:00:00Z."
            - "Care manager Dana with hourly_rate_cents 22500."
            - "Client Eleanor with billing_increment_min 15."
            - "One existing TimeEntry A for Dana: 2026-08-16T14:00:00Z to 15:00:00Z at service_location_id CLIENT_HOME."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Eleanor Whitfield", residence_setting: "PRIVATE_HOME", billing_increment_min: 15 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-16T14:00:00Z", end_at: "2026-08-16T15:00:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_a: $.data.id }
          trigger:
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-16T14:30:00Z", end_at: "2026-08-16T15:30:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-16T15:00:00Z", end_at: "2026-08-16T15:45:00Z", service_location_id: "CLIENT_HOME" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_c: $.data.id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-16T15:45:00Z", end_at: "2026-08-16T16:00:00Z", service_location_id: "HOSPITAL_A" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /care/time-entries"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", service_type: "CARE_COORDINATION", start_at: "2026-08-16T16:15:00Z", end_at: "2026-08-16T17:00:00Z", service_location_id: "HOSPITAL_A" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { te_d: $.data.id }
          assert:
            - "The 14:30-15:30Z call returns HTTP 409 with error_id ERR_TIME_ENTRY_OVERLAP"
            - "The 15:00-15:45Z call returns HTTP 201 (previous.end_at == candidate.start_at does not intersect a half-open interval)"
            - "TimeEntry.${te_c}.rounded_minutes == 45 and TimeEntry.${te_c}.billable_amount_cents == 16875"
            - "The 15:45-16:00Z call at HOSPITAL_A returns HTTP 409 with error_id ERR_TRAVEL_BUFFER_VIOLATION (gap 0 < 30 minutes across a location change)"
            - "The 16:15-17:00Z call at HOSPITAL_A returns HTTP 201 (gap from 15:45Z is exactly 30 minutes, which passes)"
            - "GET /care/time-entries?care_manager_id=${cm_dana}&service_date=2026-08-16 returns exactly 3 rows: ${te_a}, ${te_c}, ${te_d}"
            - "Client.${cli}.unbilled_accrual_cents == 56250 (22500 + 16875 + 16875)"

      - name: client_caregiver_capacity_closed_interval_aggregate_overlap
        grounds:
          - validations[priority=64]
          - errors[ERR_COVERAGE_CAPACITY_EXCEEDED]
          - entities.Client.fields.authorized_concurrent_caregivers
          - entities.ServiceAuthorization.fields.coverage_start
          - entities.ServiceAuthorization.fields.coverage_end
          - calculations.client_authorized_coverage_hours
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: ServiceAuthorization coverage
          windows are CLOSED intervals measured against an AGGREGATE capacity on the Client, so two
          windows that merely touch at 16:00:00Z count as intersecting and their concurrent_caregivers
          are summed against authorized_concurrent_caregivers, whereas the TimeEntry rule is
          half-open and pairwise with no summation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-17T09:00:00Z."
            - "Care manager Dana, supervisor Iris."
            - "Client Mira with authorized_concurrent_caregivers 2 and retainer_floor_cents 0, an ACCEPTED assessment, surrogate contact Nadia, and an ACTIVE care plan."
            - "Vendor Northgate Home Care (no referral relationship)."
            - "One ServiceAuthorization already AUTHORIZED covering 2026-09-01T08:00:00Z..16:00:00Z with concurrent_caregivers 2, saturating the client's capacity for that window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Mira Toussaint", residence_setting: "PRIVATE_HOME", retainer_floor_cents: 0, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Nadia Toussaint", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_nadia: $.data.id }
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
              payload: { client_id: "${cli}", care_manager_id: "${cm_dana}", domain_scores: { adl: 2, cognition: 2, medical_complexity: 2, social_support: 2, safety: 2, finances: 2 } }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { asm: $.data.id }
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/assessments/${asm}/state"
              payload: { to_state: "ACCEPTED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "GET /care/clients/${cli}"
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cli_v1: $.data.version }
            - call: "POST /care/care-plans"
              payload: { client_id: "${cli}", source_assessment_id: "${asm}", expected_client_version: "${cli_v1}", goals: ["Two-caregiver daytime coverage"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { cp: $.data.id }
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "PENDING_FAMILY_APPROVAL" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/care-plans/${cp}/state"
              payload: { to_state: "ACTIVE" }
              as: FamilyDecisionMaker
              as_user_id: "${fc_nadia}"
