  - rule_id: resource_temporal_overlap
    instances:
      - name: mariner_strict_half_open_zero_tolerance
        grounds:
          - calculations.assignment_overlap_checks
          - errors[ERR_MARINER_ASSIGNMENT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics (A): strict half-open [sign_on, planned_relief) with ZERO overlap
          tolerance on the Mariner resource. A 1-day overlap (11-09 start vs 11-10 end) is
          rejected; touching endpoints (new.start == existing.end on 11-10) are accepted.
          Rejection input set is the mariner's own {CONFIRMED, ONBOARD, SUSPENDED} assignments.
        test_recipe:
          setup:
            - "M activated; vessel ACTIVE with slots s1 and s2; rotation plan"
            - "A1 CONFIRMED on s1 [2026-08-10, 2026-11-10)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Overlap One", mariner_reference_number: "MRN-RO1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
