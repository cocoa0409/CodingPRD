            - "the rejected booking is untouched — Booking.${b2}.status == PENDING_APPROVAL"
            - "the balance did not move on the failure — ${bal} == 40"

      - name: guarantee_below_the_distributor_floor_is_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=26]
          - errors[ERR_GUARANTEE_BELOW_FLOOR]
          - entities.Distributor.fields.guarantee_floor_cents
        distinguishing_aspect: "The distributor's floor is a cross-entity bound: a booking carrying a 100-cent guarantee is refused with 422 ERR_GUARANTEE_BELOW_FLOOR against a 1000000-cent floor, even though it is inside the booking's own ceiling."
        test_recipe:
          setup:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
          setup_api_calls:
            - *k_clock
            - *k_dist
            - *k_circ_b
            - *k_acc_b
            - *k_th_ca
            - *k_title_a
            - *k_pub_a
          trigger:
