              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T08:00:00Z", free_chlorine_ppm: 25.0, ph: 6.7, orp_mv: 690, turbidity_ntu: 2.0 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
