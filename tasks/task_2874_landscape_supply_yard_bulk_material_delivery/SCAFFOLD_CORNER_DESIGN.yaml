        distinguishing_aspect: "confirm is not idempotent: the second call is rejected with 409 ERR_ORDER_NOT_DRAFT rather than re-running the pricing and double-counting the reservation against the lot and the credit line."
        test_recipe:
          setup:
            - "A CONFIRMED order for 5.0 cubic yards at 2000 cents/cy (quoted_total 10000, no fees: quantity is under the discount tier and under the min-load subtotal but the mode is WILL_CALL so no min-load fee applies)."
