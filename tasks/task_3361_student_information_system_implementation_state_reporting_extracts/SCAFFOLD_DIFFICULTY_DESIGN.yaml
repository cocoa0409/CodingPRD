# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3361_student_information_system_implementation_state_reporting_extracts
# 9 rules x >=2 instances = 19 instances. Every setup_api_calls chain replays from
# empty-DB using only §1.5 endpoints. Logical clock default: 2026-09-01T00:00:00Z.
# Standard fixture year: [2026-08-01, 2027-06-01), 304 calendar days, 180 instructional
# days, count_date 2026-10-01. Standard spec: TX, ADM, window [2027-06-15, 2027-07-15),
# chronic threshold 0.10, auto_withdraw_streak 3, min_membership_days 10.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fte_adm_vs_count_date_divergence_on_enrollment
        grounds:
          - calculations.fte_calculation
          - entities.Enrollment.fields.fte_adm
          - entities.Enrollment.fields.fte_count_date
        distinguishing_aspect: "On the Enrollment domain the ADM variant prorates membership (100/180 = 0.556) while the COUNT_DATE variant yields 1.000 for the same 100-day enrollment that spans the count date — identical data, two valid algorithms, different results."
        test_recipe:
          setup:
            - "Clock default 2026-09-01T00:00:00Z. TX district LIVE; TX ADM spec PUBLISHED; year Y1 [2026-08-01, 2027-06-01) OPEN with instructional_days 180 and count_date 2026-10-01; one student enrolled ACTIVE with entry 2026-08-01 then withdrawn with exit 2026-11-09 (membership 100 days, spans count date)."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_d1
              call: "POST /sis/districts"
              payload: { name: "Lone Star ISD", state_code: "TX" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - &c_d1_act
              call: "POST /sis/districts/${d1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { d1_v: $.data.version }
            - &c_sp1
              call: "POST /sis/collection-specs"
              payload: { state_code: "TX", funding_method: "ADM", attendance_code_map: { "U": { state_code: "S_ABS_U", absence_weight: 1.0, is_excused: false }, "E": { state_code: "S_ABS_E", absence_weight: 1.0, is_excused: true }, "H": { state_code: "S_ABS_H", absence_weight: 0.5, is_excused: false }, "P": { state_code: "S_ABS_P", absence_weight: 0.0, is_excused: false } }, discipline_code_map: { "FIGHT": { state_offense_code: "S_OFF_29", severity_base: 25 }, "TARDY": { state_offense_code: "S_OFF_51", severity_base: 5 } }, program_code_map: { "EL": { state_program_code: "S_PRG_EL", weight_factor: 1.2 }, "HDK": { state_program_code: "S_PRG_HDK", weight_factor: 0.5 } }, submission_window_opens_at: "2027-06-15T00:00:00Z", submission_window_closes_at: "2027-07-15T00:00:00Z", chronic_absence_threshold: 0.10, auto_withdraw_streak: 3, min_membership_days: 10 }
              as: PlatformAdmin
              captures: { sp1: $.data.id }
            - &c_sp1_pub
              call: "POST /sis/collection-specs/${sp1}/publish"
              payload: {}
              as: PlatformAdmin
            - &c_y1
              call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2026-2027", start_date: "2026-08-01T00:00:00Z", end_date: "2027-06-01T00:00:00Z", instructional_days: 180, count_date: "2026-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { y1: $.data.id }
            - &c_y1_open
              call: "POST /sis/school-years/${y1}/open"
              payload: {}
              as: DistrictAdmin
            - &c_st1
              call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S001", first_name: "Ada", last_name: "Lopez", birth_date: "2011-03-04T00:00:00Z", entry_grade_level: "09" }
              as: Registrar
              captures: { st1: $.data.id }
            - &c_en1
              call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en1: $.data.id }
            - &c_en1_wd
              call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-11-09T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "GET /sis/enrollments/${en1}"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${en1}.membership_days == 100"
            - "Enrollment.${en1}.fte_adm == 0.556 (round_half_up(100/180 * 1.0, 3))"
            - "Enrollment.${en1}.fte_count_date == 1.0 (entry <= 2026-10-01 and exit 2026-11-09 > count_date)"
            - "Enrollment.${en1}.fte_adm != Enrollment.${en1}.fte_count_date"

      - name: severity_cap_variant_by_action_type
        grounds:
          - calculations.severity_score_calc
          - entities.DisciplineIncident.fields.severity_score
        distinguishing_aspect: "On the DisciplineIncident domain, identical severity_base (25) x action_days (6) yields 100 under the CAPPED variant (OSS) but 150 under the UNCAPPED variant (EXPULSION) — a different entity domain than the Enrollment FTE dual-variant."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED with FIGHT severity_base 25; year OPEN; one ACTIVE enrollment."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
          trigger:
            - call: "POST /sis/discipline-incidents"
              payload: { student_id: "${st1}", enrollment_id: "${en1}", incident_date: "2026-10-05T00:00:00Z", raw_offense_code: "FIGHT", action_type: "OSS", action_days: 6 }
              as: Registrar
              captures: { inc_oss: $.data.id, sev_oss: $.data.severity_score }
            - call: "POST /sis/discipline-incidents"
              payload: { student_id: "${st1}", enrollment_id: "${en1}", incident_date: "2026-10-06T00:00:00Z", raw_offense_code: "FIGHT", action_type: "EXPULSION", action_days: 6 }
              as: Registrar
              captures: { inc_exp: $.data.id, sev_exp: $.data.severity_score }
          assert:
            - "DisciplineIncident.${inc_oss}.severity_base == 25 and severity_score == 100 (min(150, SEVERITY_CAP))"
            - "DisciplineIncident.${inc_exp}.severity_score == 150 (uncapped)"
            - "severity values differ for identical severity_base and action_days"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fte_weight_cap_interaction_three_inputs
        grounds:
          - calculations.fte_calculation
          - entities.Enrollment.fields.program_weight
        distinguishing_aspect: "Mode (a): FTE combines membership_days, instructional_days and program_weight through a non-linear min(1.0, days/180 * weight) — an EL-weighted full-year student clips to 1.000 while an HDK-weighted one lands at 0.844."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED (EL weight 1.2, HDK weight 0.5); year OPEN; two students each enrolled full-year ACTIVE from 2026-08-01 (membership 304)."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z", program_code: "EL" }
              as: Registrar
              captures: { en_el: $.data.id }
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st2}", school_year_id: "${y1}", grade_level: "KG", entry_date: "2026-08-01T00:00:00Z", program_code: "HDK" }
              as: Registrar
              captures: { en_hdk: $.data.id }
          trigger:
            - call: "GET /sis/enrollments/${en_el}"
              payload: {}
              as: Registrar
            - call: "GET /sis/enrollments/${en_hdk}"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${en_el}.program_weight == 1.2 and membership_days == 304"
            - "Enrollment.${en_el}.fte_adm == 1.0 (min(1.0, 304/180 * 1.2) = min(1.0, 2.0267) clips at the cap)"
            - "Enrollment.${en_hdk}.fte_adm == 0.844 (round_half_up(304/180 * 0.5, 3) = round_half_up(0.84444, 3))"

      - name: extract_total_rounds_per_record_then_sums
        grounds:
          - calculations.extract_snapshot_totals
          - entities.ReportingExtract.fields.total_fte_millis
        distinguishing_aspect: "Mode (b): the pinned order rounds each record's FTE to 3 decimals BEFORE summing — two 80-day enrollments (0.444 each) total 888 millis, whereas the rejected sum-then-round order would yield 889."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; ADM spec PUBLISHED; year OPEN then CLOSED_FOR_REPORTING; two students each enrolled 2026-08-01 and withdrawn 2026-10-20 (membership 80 days each; fte_adm 0.444 each)."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st1}", school_year_id: "${y1}", grade_level: "09", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en_a: $.data.id }
            - call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S002", first_name: "Bo", last_name: "Reyes", birth_date: "2013-09-09T00:00:00Z", entry_grade_level: "KG" }
              as: Registrar
              captures: { st2: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${st2}", school_year_id: "${y1}", grade_level: "KG", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { en_b: $.data.id }
            - call: "POST /sis/enrollments/${en_a}/withdraw"
              payload: { exit_date: "2026-10-20T00:00:00Z" }
              as: Registrar
            - call: "POST /sis/enrollments/${en_b}/withdraw"
              payload: { exit_date: "2026-10-20T00:00:00Z" }
              as: Registrar
            - &c_y1_close
              call: "POST /sis/school-years/${y1}/close-for-reporting"
              payload: {}
              as: DistrictAdmin
              captures: { y1_v: $.data.version }
          trigger:
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
          assert:
            - "ReportingExtract.${ex1}.record_count == 2"
            - "ReportingExtract.${ex1}.total_fte_millis == 888 (444 + 444; NOT 889 from sum-then-round)"
            - "ReportingExtract.${ex1}.invalid_record_count == 0 (80 >= min_membership_days 10)"
            - "ReportingExtract.${ex1}.status == DRAFT and generation == 1"

      - name: truancy_streak_infers_exit_then_membership
        grounds:
          - calculations.truancy_exit_inference
          - calculations.absence_rate_calc
        distinguishing_aspect: "Mode (c): the exit date depends on the absence streak, the streak is scanned only over the current segment, and membership/absence-weight are computed only AFTER the exit is inferred — the pinned order yields exit 2026-09-03, membership 33, weight sum 2.0 (the streak-completing event on the exit date is excluded by the half-open window)."
        test_recipe:
          setup:
            - "Clock default 2026-09-01T00:00:00Z. TX district LIVE; spec PUBLISHED with auto_withdraw_streak 3; year OPEN; one ACTIVE enrollment from 2026-08-01; three consecutive-day unexcused full-day events on 2026-09-01, 2026-09-02, 2026-09-03."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-01T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-02T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-03T00:00:00Z", raw_code: "U" }
              as: Registrar
          trigger:
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${en1}.exit_date == 2026-09-03T00:00:00Z (date of the 3rd consecutive unexcused full-day absence)"
            - "Enrollment.${en1}.membership_days == 33 (half-open [2026-08-01, 2026-09-03))"
            - "Enrollment.${en1}.absence_weight_sum == 2.0 (events strictly before the exit date; the 09-03 event excluded)"
            - "Enrollment.${en1}.absence_posture == AT_RISK (2.0/33 = 0.0606 is >= 0.05 and < 0.10)"
            - "Enrollment.${en1}.lifecycle == WITHDRAWN"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: extract_rejection_revision_cycle
        grounds:
          - state_machines.ReportingExtract.DRAFT_to_VALIDATED
          - state_machines.ReportingExtract.SUBMITTED_to_REJECTED
          - state_machines.ReportingExtract.REJECTED_to_DRAFT
          - state_machines.ReportingExtract.VALIDATED_to_DRAFT
        distinguishing_aspect: "Cyclic machine on ReportingExtract: DRAFT -> VALIDATED -> SUBMITTED -> REJECTED -> DRAFT -> VALIDATED -> SUBMITTED -> ACCEPTED traverses the revision loop, which no linear pipeline can express."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; ADM spec PUBLISHED (window [2027-06-15, 2027-07-15)); one full-year ACTIVE enrollment (membership 304, no absences); year CLOSED_FOR_REPORTING."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - *c_y1_close
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sis/reporting-extracts/${ex1}/validate"
              payload: {}
              as: StateReporter
            - call: "POST /sis/reporting-extracts/${ex1}/submit"
              payload: {}
              as: StateReporter
            - call: "POST /sis/reporting-extracts/${ex1}/resolve"
              payload: { outcome: "REJECTED" }
              as: StateReporter
              captures: { ex_rej: $.data.status, esc_pri: $.data.escalation_priority }
            - call: "POST /sis/reporting-extracts/${ex1}/reopen"
              payload: {}
              as: StateReporter
            - call: "POST /sis/reporting-extracts/${ex1}/validate"
              payload: {}
              as: StateReporter
            - call: "POST /sis/reporting-extracts/${ex1}/submit"
              payload: {}
              as: StateReporter
            - call: "POST /sis/reporting-extracts/${ex1}/resolve"
              payload: { outcome: "ACCEPTED" }
              as: StateReporter
          assert:
            - "extract reached REJECTED after the first submit (captured ${ex_rej} == REJECTED)"
            - "at 2027-07-01 the window has 336 hours remaining, so escalation_priority == STANDARD (${esc_pri} == STANDARD)"
            - "after reopen the extract is DRAFT with escalation_priority == NONE"
            - "second validate/submit succeed from the reopened DRAFT state (revision loop)"
            - "final status == ACCEPTED and ReportingExtract.${ex1}.submitted_at == 2027-07-01T00:00:00Z"

      - name: enrollment_parallel_lifecycle_and_absence_dimensions
        grounds:
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - state_machines.Enrollment.WITHDRAWN_to_ACTIVE
          - calculations.absence_rate_calc
        distinguishing_aspect: "Parallel dimensions on one Enrollment row: lifecycle (ACTIVE -> WITHDRAWN -> ACTIVE) evolves independently of absence_posture (CLEAR -> CHRONIC -> CLEAR), and posture transitions fire while lifecycle is WITHDRAWN."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED; year OPEN; one ACTIVE enrollment from 2026-08-01 with ten unexcused full-day events 2026-09-01..2026-09-10."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-01T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-02T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-03T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-04T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-05T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-06T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-07T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-08T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-09T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-10T00:00:00Z", raw_code: "U" }
              as: Registrar
          trigger:
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-10-20T00:00:00Z" }
              as: Registrar
              captures: { wd_posture: $.data.absence_posture, wd_life: $.data.lifecycle }
            - call: "POST /sis/enrollments/${en1}/reenter"
              payload: { reentry_date: "2027-01-05T00:00:00Z" }
              as: Registrar
              captures: { re_posture: $.data.absence_posture, re_life: $.data.lifecycle, re_days: $.data.membership_days }
          assert:
            - "after withdraw: lifecycle == WITHDRAWN while absence_posture == CHRONIC (10.0 / 80 = 0.125 >= 0.10) — posture transitioned in a non-ACTIVE lifecycle"
            - "after reenter: lifecycle == ACTIVE, membership_days == 227 (80 + 147), absence_weight_sum == 10.0"
            - "after reenter: absence_posture == CLEAR (10.0 / 227 = 0.0441 < 0.05) — posture improved on the recompute independent of lifecycle"
            - "Student.${st1}.status == ENROLLED after reenter (was INACTIVE after withdraw)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: rollover_graduation_portal_cascade_depth3
        grounds:
          - state_machines.RolloverRun.PENDING_to_COMMITTED
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
          - state_machines.Student.ENROLLED_to_GRADUATED
          - state_machines.PortalAccount.INVITED_to_REVOKED
        distinguishing_aspect: "Depth-3 cascade from rollover execute: enrollment COMPLETED (hop 1) flips Student to GRADUATED (hop 2) which itself revokes the student's portal accounts (hop 3) — each hop caused by the previous one, triggered by POST execute."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED; source year Y1 OPEN with one grade-12 ACTIVE enrollment; student has an INVITED portal account; target year Y2 [2027-08-01, 2028-06-01) OPEN; source year then CLOSED_FOR_REPORTING."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - &c_st_grad
              call: "POST /sis/students"
              payload: { district_id: "${d1}", student_number: "S100", first_name: "Gail", last_name: "Senior", birth_date: "2008-05-01T00:00:00Z", entry_grade_level: "12" }
              as: Registrar
              captures: { stg: $.data.id }
            - call: "POST /sis/enrollments"
              payload: { student_id: "${stg}", school_year_id: "${y1}", grade_level: "12", entry_date: "2026-08-01T00:00:00Z" }
              as: Registrar
              captures: { eng: $.data.id }
            - &c_pa1
              call: "POST /sis/portal-accounts"
              payload: { student_id: "${stg}", account_type: "STUDENT", access_level: "FULL" }
              as: DistrictAdmin
              captures: { pa1: $.data.id }
            - &c_y2
              call: "POST /sis/school-years"
              payload: { district_id: "${d1}", label: "2027-2028", start_date: "2027-08-01T00:00:00Z", end_date: "2028-06-01T00:00:00Z", instructional_days: 180, count_date: "2027-10-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { y2: $.data.id }
            - &c_y2_open
              call: "POST /sis/school-years/${y2}/open"
              payload: {}
              as: DistrictAdmin
            - *c_y1_close
            - call: "POST /sis/rollover-runs"
              payload: { district_id: "${d1}", source_school_year_id: "${y1}", target_school_year_id: "${y2}", expected_district_version: "${d1_v}" }
              as: DistrictAdmin
              captures: { rr1: $.data.id }
          trigger:
            - call: "POST /sis/rollover-runs/${rr1}/execute"
              payload: {}
              as: DistrictAdmin
          assert:
            - "RolloverRun.${rr1}.status == COMMITTED with graduated_count == 1 and promoted_count == 0"
            - "Enrollment.${eng}.lifecycle == COMPLETED (hop 1)"
            - "Student.${stg}.status == GRADUATED (hop 2)"
            - "PortalAccount.${pa1}.status == REVOKED (hop 3 — caused by the graduation, not by the execute call directly)"
            - "SchoolYear.${y1}.status == ROLLED_OVER"
            - "GET /sis/enrollments?school_year_id=${y2}&lifecycle=ACTIVE returns total_count == 0 (graduates are not promoted)"

      - name: discipline_approve_absence_cascade_depth2
        grounds:
          - state_machines.DisciplineIncident.REPORTED_to_APPROVED
          - state_machines.DisciplineIncident.APPROVED_to_VOIDED
          - calculations.absence_rate_calc
        distinguishing_aspect: "Depth-2 cascade from incident approve: the approval mutates the enrollment's absence_weight_sum (hop 1) and that field mutation itself forces the absence_rate/absence_posture recompute (hop 2) — a different triggering transition than the rollover cascade."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED; year OPEN; one ACTIVE enrollment from 2026-08-01; one REPORTED OSS incident (FIGHT, 9 days)."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - call: "POST /sis/discipline-incidents"
              payload: { student_id: "${st1}", enrollment_id: "${en1}", incident_date: "2026-10-05T00:00:00Z", raw_offense_code: "FIGHT", action_type: "OSS", action_days: 9 }
              as: Registrar
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /sis/discipline-incidents/${inc1}/approve"
              payload: {}
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/withdraw"
              payload: { exit_date: "2026-10-20T00:00:00Z" }
              as: Registrar
              captures: { wd_posture: $.data.absence_posture, wd_sum: $.data.absence_weight_sum }
            - call: "POST /sis/discipline-incidents/${inc1}/void"
              payload: {}
              as: Registrar
          assert:
            - "after approve: Enrollment.${en1}.absence_weight_sum == 9.0 (hop 1 — the incident approval, not a direct enrollment write)"
            - "after withdraw: absence_posture == CHRONIC (9.0 / 80 = 0.1125 >= 0.10 — hop 2 recompute driven by the hop-1 weight)"
            - "after void: Enrollment.${en1}.absence_weight_sum == 0.0 and absence_posture == CLEAR (compensation reverses both hops)"
            - "DisciplineIncident.${inc1}.status == VOIDED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: submit_state_error_beats_window_error
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_EXTRACT_NOT_VALIDATED
          - errors.ERR_SUBMISSION_WINDOW_CLOSED
        distinguishing_aspect: "Category pair {state, business_temporal}: a submit against a DRAFT extract outside the submission window violates both rules, and the state error (priority 5) MUST win over the window error (priority 7)."
        test_recipe:
          setup:
            - "Clock moved to 2027-08-01T00:00:00Z (window closed 2027-07-15). TX district LIVE; spec PUBLISHED; year CLOSED_FOR_REPORTING with one full-year enrollment; extract created and left in DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
            - *c_en1
            - *c_y1_close
            - call: "POST /sis/reporting-extracts"
              payload: { school_year_id: "${y1}", collection_spec_id: "${sp1}", expected_school_year_version: "${y1_v}" }
              as: StateReporter
              captures: { ex1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sis/reporting-extracts/${ex1}/submit"
              payload: {}
              as: StateReporter
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 with error_id == ERR_EXTRACT_NOT_VALIDATED (state, priority 5)"
            - "error_id != ERR_SUBMISSION_WINDOW_CLOSED although the window is also closed"

      - name: enrollment_referential_error_beats_temporal_error
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_REFERENCED_ENTITY_NOT_FOUND
          - errors.ERR_ENTRY_OUTSIDE_YEAR
        distinguishing_aspect: "Category pair {business_referential, business_temporal} — distinct from the {state, business_temporal} pairing: an enrollment create with a non-existent student_id AND an entry_date outside the year returns the referential error (priority 6), not the temporal one (priority 7)."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED; year OPEN."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
          trigger:
            - call: "POST /sis/enrollments"
              payload: { student_id: "00000000-0000-4000-8000-000000000000", school_year_id: "${y1}", grade_level: "09", entry_date: "2025-01-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response status 422 with error_id == ERR_REFERENCED_ENTITY_NOT_FOUND (priority 6)"
            - "error_id != ERR_ENTRY_OUTSIDE_YEAR although the entry date is also outside the year"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: chronic_threshold_exact_rate_boundary
        grounds:
          - calculations.absence_rate_calc
          - entities.Enrollment.fields.absence_posture
          - entities.StateCollectionSpec.fields.chronic_absence_threshold
        distinguishing_aspect: "Boundary on the absence-rate metric: a rate of exactly 0.10 (10.0 / 100) IS chronic because the comparison is >=, while 0.095 (9.5 / 100) is only AT_RISK — exercised through the withdraw endpoint's recompute."
        test_recipe:
          setup:
            - "Clock default. TX district LIVE; spec PUBLISHED (chronic threshold 0.10); year OPEN; student A with 10 unexcused full-day events 09-01..09-10; student B with 9 full-day events 09-01..09-09 plus one half-day event (weight 0.5) on 09-10; both withdrawn with exit 2026-11-09 (membership 100 each)."
          setup_api_calls:
            - *c_clock
            - *c_d1
            - *c_d1_act
            - *c_sp1
            - *c_sp1_pub
            - *c_y1
            - *c_y1_open
            - *c_st1
