            - "first trigger, sent with X-User-ID qr-001, returns HTTP 409 with ${e_self_review} == ERR_SEGREGATION_OF_DUTIES — the role is correct and the state is correct, only the identity collides"
            - "GET /complaints/${cx} after the refusal still returns status == FILED with reviewer_user_id == null and reviewer_recommendation == null"
            - "second trigger, the byte-identical role sent with X-User-ID qr-002, returns HTTP 200 with ${cx_status2} == REVIEWED and ${cx_reviewer} == qr-002"
            - "${cx_status3} == SUBSTANTIATED with ${cx_adjudicator} == pa-001 (the adjudicating ProgramAdmin identity), and a DisciplinaryAction of action_type PROBATION with points == 10 reaches IN_EFFECT"
            - "GET /interpreters/${iA} then returns complaint_points == 10 and rolling_12_month_score == 60 (100 - 4 * 10), exactly at the class-A quality floor"
