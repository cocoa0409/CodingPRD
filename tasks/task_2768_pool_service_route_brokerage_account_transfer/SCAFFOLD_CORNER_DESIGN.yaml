      - name: close_state_rule_outranks_the_fiscal_rule_on_the_same_request
        claim_type: priority_ordering
        grounds:
          - "validations[priority=23]"
          - "validations[priority=51]"
          - "errors.ERR_DEAL_NOT_FUNDED"
          - "errors.ERR_ESCROW_UNDERFUNDED"
          - "endpoints[POST /deals/{id}/close]"
        distinguishing_aspect: "The claim is that one close request violating both the state rule (priority 23) and the fiscal rule (priority 51) returns ERR_DEAL_NOT_FUNDED, and that fixing only the state violation then surfaces ERR_ESCROW_UNDERFUNDED from the same request shape."
        excluded_because:
          difficulty_instance: "pair_a_state_beats_fiscal_on_close"
          rationale: "That \u00a71.8 instance is built exactly on this pair: a DILIGENCE_CLEARED deal with a partially funded escrow is closed (both rules violated -> ERR_DEAL_NOT_FUNDED), then the same underfunding is reached from ESCROW_FUNDED so that only the fiscal rule is violated (-> ERR_ESCROW_UNDERFUNDED). Restating it in \u00a71.9 would add no new observable."

      - name: introduction_safety_rule_outranks_the_temporal_window_rule
        claim_type: priority_ordering
        grounds:
          - "validations[priority=22]"
          - "validations[priority=47]"
          - "errors.ERR_ACCOUNT_NOT_INTRODUCIBLE"
          - "errors.ERR_INTRODUCTION_WINDOW_CLOSED"
          - "endpoints[POST /service-accounts/{id}/introduce]"
        distinguishing_aspect: "The claim is that an introduce request that is both out of state (the account is already INTRODUCED) and out of window (the clock is past accepted_on + 45 days) returns the business_safety error ERR_ACCOUNT_NOT_INTRODUCIBLE, not the temporal one."
        excluded_because:
          difficulty_instance: "pair_b_safety_beats_temporal_on_introduce"
          rationale: "That \u00a71.8 instance drives both orderings from one fixture: the doubly-violating call returns ERR_ACCOUNT_NOT_INTRODUCIBLE, and a PENDING account addressed after the same window has closed returns ERR_INTRODUCTION_WINDOW_CLOSED, isolating each rule. A \u00a71.9 duplicate would use the same two calls."

