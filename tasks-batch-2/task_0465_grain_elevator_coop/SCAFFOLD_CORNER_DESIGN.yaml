        grounds: ["validations[priority=8]", "errors[ERR_NO_CURRENT_PRICE]", state_machines.Contract.OPEN_to_PRICED]
        distinguishing_aspect: "Fixing a CASH contract when no PriceBoard exists for the commodity returns 409 ERR_NO_CURRENT_PRICE."
        test_recipe:
          setup: ["CORN commodity with NO price board; an OPEN CASH contract."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
