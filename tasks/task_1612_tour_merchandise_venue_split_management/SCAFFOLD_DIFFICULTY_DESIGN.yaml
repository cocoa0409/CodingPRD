              as_user_id: "tm-1"
              captures: { sl_c: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_a: $.data.id }
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_c}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_c: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_a}", allocation_id: "${a_id}", quantity: 100, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_c}", allocation_id: "${a_id}", quantity: 100, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_c}"
            - call: "POST /merch/seller-sessions/${ss_a}/count-out"
              payload: { counted_cash_cents: 406000 }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_c}/count-out"
              payload: { counted_cash_cents: 406001 }
              as: Seller
              as_user_id: "${sl_c}"
          trigger:
            - call: "POST /merch/seller-sessions/${ss_a}/verify"
              payload: { decision: "APPROVE" }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/seller-sessions/${ss_c}/verify"
              payload: { decision: "APPROVE" }
              as: Seller
              as_user_id: "${sl_b}"
              captures: { err: $.data.error_id }
          assert:
            - "Session A (variance exactly +1000 == tolerance): verify succeeds, status == VERIFIED"
            - "Session C (variance +1001 == tolerance + 1): err == ERR_VARIANCE_OVERRIDE_REQUIRED, HTTP 409, status stays COUNTED_OUT"

      - name: lead_time_exactly_48h_boundary
        grounds:
          - validations[priority=6.7]
          - state_machines.Shipment.DRAFT_to_DISPATCHED
        distinguishing_aspect: |
          Time metric on the dispatch endpoint: with the default logical clock
          2026-08-01T00:00:00Z, a show at exactly now+48h (2026-08-03T00:00:00Z)
          dispatches fine (>= is inclusive), while a show 1 second inside the
          buffer (2026-08-02T23:59:59Z) fails with ERR_LEAD_TIME_VIOLATION.
        test_recipe:
          setup:
            - "Tour with OS product (warehouse OS 1000); show FAR at 2026-08-03T00:00:00Z (exactly 48h after the default clock); show NEAR at 2026-08-02T23:59:59Z (1s inside the buffer)"
            - "Two WAREHOUSE-origin DRAFT shipments of 10 OS units, one to each show"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "BP2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Mesa", venue_name: "BP2 Far Hall", show_date: "2026-08-03T00:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_far: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Mesa", venue_name: "BP2 Near Hall", show_date: "2026-08-02T23:59:59Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_near: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "BP2-TEE", name: "BP2 Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/shipments"
              payload: { tour_id: "${t_id}", origin_type: "WAREHOUSE", destination_show_id: "${s_far}", lines: [ { product_id: "${p_id}", size: "OS", quantity: 10 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sh_far: $.data.id }
            - call: "POST /merch/shipments"
              payload: { tour_id: "${t_id}", origin_type: "WAREHOUSE", destination_show_id: "${s_near}", lines: [ { product_id: "${p_id}", size: "OS", quantity: 10 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sh_near: $.data.id }
          trigger:
            - call: "POST /merch/shipments/${sh_far}/dispatch"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shipments/${sh_near}/dispatch"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "Shipment.${sh_far}.status == DISPATCHED (exactly 48h lead is allowed: boundary is inclusive)"
            - "Shipment.${sh_far}.dispatched_at == 2026-08-01T00:00:00Z (default logical clock)"
            - "err == ERR_LEAD_TIME_VIOLATION for the 47h59m59s case, HTTP 409, Shipment.${sh_near} stays DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: show_open_requires_active_tour
        grounds:
          - state_machines.Show.SCHEDULED_to_OPEN
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair Show -> Tour: opening a SCHEDULED show whose tour is
          still PLANNING fails with ERR_TOUR_NOT_ACTIVE; after activating the
          tour the same call succeeds — the show's valid transitions depend on
          the parent tour's state.
        test_recipe:
          setup:
            - "Tour in PLANNING (never activated) with one SCHEDULED show"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CE1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Eugene", venue_name: "CE1 Hall", show_date: "2026-08-23T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "first open attempt: err == ERR_TOUR_NOT_ACTIVE, HTTP 409, Show stays SCHEDULED"
            - "after tour activation: open succeeds and Show.${s_id}.status == OPEN"

      - name: reconcile_requires_all_sessions_verified
        grounds:
          - state_machines.Settlement.PROVISIONAL_to_RECONCILED
          - validations[priority=4]
        distinguishing_aspect: |
          Entity pair Settlement -> SellerSession: reconcile requires every
          session of the show VERIFIED; with one session only COUNTED_OUT the
          reconcile is rejected with ERR_UNRESOLVED_SESSIONS even though
          begin-reconciliation accepted COUNTED_OUT sessions.
        test_recipe:
          setup:
            - "ACTIVE tour; FLAT 1500 show opened; OS product price 2000, 100 allocated; sellers A and B"
            - "Session A: sale 5 CASH (10000), counted 15000, VERIFIED by B"
            - "Session B: sale 3 CASH (6000), counted 11000, still COUNTED_OUT"
            - "begin-reconciliation succeeded (COUNTED_OUT is enough for that gate); settlement is PROVISIONAL"
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CE2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Salinas", venue_name: "CE2 Hall", show_date: "2026-08-24T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CE2-CAP", name: "Cap", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 2000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 2000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 100 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "CE2-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller B", seller_code: "CE2-B" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_b: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_a: $.data.id }
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_b}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_b: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_a}", allocation_id: "${a_id}", quantity: 5, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_b}", allocation_id: "${a_id}", quantity: 3, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/seller-sessions/${ss_a}/count-out"
              payload: { counted_cash_cents: 15000 }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_b}/count-out"
              payload: { counted_cash_cents: 11000 }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/seller-sessions/${ss_a}/verify"
              payload: { decision: "APPROVE" }
              as: Seller
              as_user_id: "${sl_b}"
            - call: "POST /merch/shows/${s_id}/begin-reconciliation"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { st_id: $.data.settlement_id }
          trigger:
            - call: "POST /merch/settlements/${st_id}/reconcile"
              payload: {}
              as: Accountant
