              as: CompensationCommittee
              as_user_id: "cc_scorecard"
            - call: "POST /bonus-plans/${plan_id}/submit-for-certification"
              payload: {}
              as: PlanAdmin
          assert:
            - "Attempt 1: HTTP 422, error_id == ERR_METRIC_WEIGHTS_INVALID"
            - "Attempt 2 (after EBITDA at 40.00): HTTP 409, error_id == ERR_METRICS_NOT_ALL_ACTUALIZED"
            - "Attempt 2 does NOT return ERR_SCORECARDS_NOT_ALL_CERTIFIED even though that rule is also violated"
            - "Attempt 3 (after both actuals): HTTP 409, error_id == ERR_SCORECARDS_NOT_ALL_CERTIFIED"
            - "Attempt 4 (after certification): HTTP 200, BonusPlan.${plan_id}.status == PENDING_CERTIFICATION"
            - "BonusPlan.${plan_id}.company_achievement_pct == 100.00"
            - "BonusPlan.${plan_id}.total_target_cents == 4000000"

      - name: certification_without_any_eligible_participant_rejected
