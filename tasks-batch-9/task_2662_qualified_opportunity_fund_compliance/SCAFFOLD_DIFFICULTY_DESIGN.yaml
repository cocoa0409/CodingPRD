# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2662_qualified_opportunity_fund_compliance
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only; deleting this file
# changes no declared behavior. Conventions shared by all 24 instances:
#
#   * The logical clock reads 2026-08-01T00:00:00Z until a chain calls
#     POST /qof/_clock/set_current_utc (§1.5 mandatory default).
#   * Opaque-role actor ids are fixed literals: "admin-1" (PlatformAdmin),
#     "mgr-fund-1" (FundManager, always written into Fund.manager_user_id so
#     validations priority 9 passes), "co-measurer-1" and "co-certifier-1"
#     (both ComplianceOfficer, kept distinct so priority 10 segregation of
#     duties is satisfiable in both polarities).
#   * Investor is identity: entity_backed:Investor, so as_user_id is always
#     "${inv_id}" captured from POST /qof/investors.
#   * Money literals carry 2 dp and percentage literals 4 dp, matching the
#     precision clauses of §1.3.
#   * Every expected_*_version value derives from a captured server response
#     (§1.8 contract 3c); no OCC literal appears anywhere below.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: asset_test_valuation_variant_divergence
        grounds:
          - calculations.semiannual_asset_test_ratio
          - entities.AssetTest.fields.valuation_method
          - entities.Fund.fields.asset_test_valuation_method
          - state_machines.AssetTest.DRAFT_to_MEASURED
        distinguishing_aspect: |
          This instance exercises the dual variant in the FUND-COMPLIANCE
          measurement domain (AssetTest valuation of FundAsset rows): the same
          two asset rows produce ratio_pct 85.0000 / result FAIL under
          UNADJUSTED_COST_BASIS and ratio_pct 95.0000 / result PASS under
          APPLICABLE_FINANCIAL_STATEMENT, so the variant flips the compliance
          verdict rather than merely shifting a number.
        test_recipe:
          setup:
            - "One Fund managed by mgr-fund-1, certification_status SELF_CERTIFIED, compliance_posture UNTESTED, asset_test_valuation_method UNADJUSTED_COST_BASIS."
            - "Exactly two FundAssets: a QOZ_BUSINESS_PROPERTY with original_use_in_zone true carried at unadjusted_cost_basis 850000.00 / afs_fair_value 950000.00 (derived qualification QUALIFIED), and a CASH asset carried at unadjusted_cost_basis 150000.00 / afs_fair_value 50000.00 (derived qualification NONQUALIFIED)."
            - "Two DRAFT AssetTests over the adjacent half-open periods [2026-01-01, 2026-07-01) and [2026-07-01, 2027-01-01), the first pinned to UNADJUSTED_COST_BASIS and the second to APPLICABLE_FINANCIAL_STATEMENT via valuation_method_override."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Divergence Fund I", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 850000.00, afs_fair_value: 950000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { qual_asset_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 150000.00, afs_fair_value: 50000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cash_asset_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", valuation_method_override: "UNADJUSTED_COST_BASIS" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { cost_test_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-12-31T00:00:00Z", period_start: "2026-07-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", valuation_method_override: "APPLICABLE_FINANCIAL_STATEMENT" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { afs_test_id: $.data.id }
          trigger:
            - call: "POST /qof/asset-tests/${cost_test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/asset-tests/${afs_test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          assert:
            - "AssetTest.${cost_test_id}.valuation_method == UNADJUSTED_COST_BASIS"
            - "AssetTest.${cost_test_id}.included_asset_count == 2"
            - "AssetTest.${cost_test_id}.qualified_numerator == 850000.00"
            - "AssetTest.${cost_test_id}.total_denominator == 1000000.00"
            - "AssetTest.${cost_test_id}.ratio_pct == 85.0000"
            - "AssetTest.${cost_test_id}.result == FAIL"
            - "AssetTest.${cost_test_id}.shortfall_amount == 50000.00"
            - "AssetTest.${cost_test_id}.failed_month_count == 6"
            - "AssetTest.${afs_test_id}.valuation_method == APPLICABLE_FINANCIAL_STATEMENT"
            - "AssetTest.${afs_test_id}.included_asset_count == 2"
            - "AssetTest.${afs_test_id}.qualified_numerator == 950000.00"
            - "AssetTest.${afs_test_id}.total_denominator == 1000000.00"
            - "AssetTest.${afs_test_id}.ratio_pct == 95.0000"
            - "AssetTest.${afs_test_id}.result == PASS"
            - "AssetTest.${afs_test_id}.shortfall_amount == 0.00"
            - "AssetTest.${afs_test_id}.failed_month_count == 0"
            - "AssetTest.${cost_test_id}.result != AssetTest.${afs_test_id}.result over an identical FundAsset set"
            - "Fund.${fund_id}.compliance_posture == UNTESTED (measurement alone certifies nothing)"

      - name: substantial_improvement_aggregation_variant_divergence
        grounds:
          - calculations.substantial_improvement_ratio
          - entities.ImprovementProject.fields.aggregation_method
          - entities.ImprovementProject.fields.group_key
          - state_machines.ImprovementProject.OPEN_to_SATISFIED
          - concurrency_rules[improvement-expenditure-stale-project]
        distinguishing_aspect: |
          This instance exercises the dual variant in the ASSET-IMPROVEMENT
          domain (ImprovementProject pooling of CapitalExpenditure rows), a
          different entity domain from the AssetTest valuation instance: a
          450000.00 / 500000.00 project reaches only 90.0000 and stays OPEN
          under ASSET_BY_ASSET, while the identical expenditure row pooled
          under AGGREGATED_GROUP reaches 105.0000 and becomes SATISFIED.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1."
            - "Four FundAssets, each QOZ_BUSINESS_PROPERTY with original_use_in_zone false and unadjusted_cost_basis / afs_fair_value 500000.00."
            - "Four OPEN ImprovementProjects with window_start 2026-01-01 (window_end 2028-07-01): two ASSET_BY_ASSET, two AGGREGATED_GROUP sharing group_key GRP-NORTH."
            - "One CAPITALIZED_IMPROVEMENT expenditure per project: 600000.00, 450000.00, 600000.00, 450000.00 respectively, all spent at the clock instant 2026-08-01 which lies inside every window."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Divergence Fund II", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { a1_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { a2_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { a3_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 500000.00, afs_fair_value: 500000.00, original_use_in_zone: false }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { a4_id: $.data.id }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${a1_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${a2_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "ASSET_BY_ASSET" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${a3_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "AGGREGATED_GROUP", group_key: "GRP-NORTH" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { p3_id: $.data.id, p3_v: $.data.version }
            - call: "POST /qof/improvement-projects"
              payload: { fund_asset_id: "${a4_id}", window_start: "2026-01-01T00:00:00Z", aggregation_method: "AGGREGATED_GROUP", group_key: "GRP-NORTH" }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { p4_id: $.data.id, p4_v: $.data.version }
            - call: "POST /qof/improvement-projects/${p1_id}/expenditures"
              payload: { amount: 600000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${p1_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/improvement-projects/${p2_id}/expenditures"
              payload: { amount: 450000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${p2_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/improvement-projects/${p3_id}/expenditures"
              payload: { amount: 600000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${p3_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/improvement-projects/${p4_id}/expenditures"
              payload: { amount: 450000.00, expenditure_kind: "CAPITALIZED_IMPROVEMENT", expected_project_version: "${p4_v}" }
              as: FundManager
              as_user_id: "mgr-fund-1"
          trigger:
            - call: "POST /qof/improvement-projects/${p2_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "POST /qof/improvement-projects/${p4_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
          assert:
            - "ImprovementProject.${p2_id}.qualified_additions_total == 450000.00"
            - "ImprovementProject.${p2_id}.improvement_ratio_pct == 90.0000"
            - "ImprovementProject.${p2_id}.status == OPEN"
            - "ImprovementProject.${p2_id}.evaluated_at == 2026-08-01T00:00:00Z"
            - "ImprovementProject.${p4_id}.qualified_additions_total == 1050000.00"
            - "ImprovementProject.${p4_id}.improvement_ratio_pct == 105.0000"
            - "ImprovementProject.${p4_id}.status == SATISFIED"
            - "ImprovementProject.${p3_id}.status == SATISFIED (sibling promoted by the shared group_key)"
            - "FundAsset.${a4_id}.status == HELD and FundAsset.${a4_id}.qualification == QUALIFIED"
            - "FundAsset.${a3_id}.status == HELD and FundAsset.${a3_id}.qualification == QUALIFIED"
            - "FundAsset.${a2_id}.status == IMPROVING and FundAsset.${a2_id}.qualification == IMPROVEMENT_PENDING"
            - "Fund.${fund_id}.aggregate_asset_basis == 2000000.00"
            - "Fund.${fund_id}.aggregate_qualified_basis == 1000000.00"
            - "ImprovementProject.${p2_id}.improvement_ratio_pct != ImprovementProject.${p4_id}.improvement_ratio_pct over identical 450000.00 expenditure rows"

  - rule_id: combinatorial_formula
    instances:
      - name: qozb_management_and_tangible_nested_min_composite
        grounds:
          - calculations.qozb_prong_evaluation
          - entities.BusinessTest.fields.safe_harbor_used
          - entities.QOZBusiness.fields.nqfp_amount
          - state_machines.BusinessTest.DRAFT_to_MEASURED
          - state_machines.QOZBusiness.UNTESTED_to_AT_RISK
          - validations[priority=28]
        distinguishing_aspect: |
          Mode (a) — nested-conditional composite: the MANAGEMENT_AND_TANGIBLE
          branch of gross_income_pct is min(100.0000, round(min(mgmt_component,
          tangible_component) * 1.25, 4)) over THREE independent inputs, so the
          value 37.5000 can only be produced by taking the inner min before the
          1.25 credit; a max() inner reduction yields 100.0000 and the
          GROSS_INCOME_ACTUAL branch yields 80.0000 on the same request body.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1."
            - "One QOZBusiness with declared_nqfp_amount 40000.00, total_asset_value 1000000.00, total_tangible_property_basis 900000.00, no working-capital plan, so nqfp_amount == 40000.00 and qualification_status == UNTESTED."
            - "One DRAFT BusinessTest with testing_date 2026-06-30."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Composite Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/qoz-businesses"
              payload: { fund_id: "${fund_id}", legal_name: "North Mill LLC", zone_tract_code: "12345678901", declared_nqfp_amount: 40000.00, total_asset_value: 1000000.00, total_tangible_property_basis: 900000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { qozb_id: $.data.id }
            - call: "POST /qof/qoz-businesses/${qozb_id}/business-tests"
              payload: { testing_date: "2026-06-30T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { bt_id: $.data.id }
          trigger:
            - call: "POST /qof/business-tests/${bt_id}/measure"
              payload: { safe_harbor_used: "MANAGEMENT_AND_TANGIBLE", gross_income_zone_amount: 800000.00, gross_income_total_amount: 1000000.00, intangibles_zone_use_amount: 30000.00, intangibles_total_amount: 100000.00, total_asset_value_measured: 1000000.00 }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
            - call: "POST /qof/business-tests/${bt_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
          assert:
            - "BusinessTest.${bt_id}.nqfp_amount_measured == 40000.00"
            - "BusinessTest.${bt_id}.gross_income_pct == 37.5000"
            - "BusinessTest.${bt_id}.gross_income_pct != 100.0000 (an inner max() reduction would produce 100.0000)"
            - "BusinessTest.${bt_id}.gross_income_pct != 80.0000 (the GROSS_INCOME_ACTUAL branch would produce 80.0000)"
            - "BusinessTest.${bt_id}.gross_income_prong == FAIL"
            - "BusinessTest.${bt_id}.intangibles_pct == 30.0000"
            - "BusinessTest.${bt_id}.intangibles_prong == FAIL"
            - "BusinessTest.${bt_id}.nqfp_pct == 4.0000"
            - "BusinessTest.${bt_id}.nqfp_prong == PASS"
            - "BusinessTest.${bt_id}.status == FAILED"
            - "BusinessTest.${bt_id}.measured_by_user_id == co-measurer-1"
            - "BusinessTest.${bt_id}.certified_by_user_id == co-certifier-1"
            - "QOZBusiness.${qozb_id}.qualification_status == AT_RISK"
            - "QOZBusiness.${qozb_id}.consecutive_failed_business_tests == 1"

      - name: failed_test_penalty_per_month_rounding_order
        grounds:
          - calculations.failed_test_penalty
          - calculations.semiannual_asset_test_ratio
          - state_machines.AssetTest.MEASURED_to_CERTIFIED_FAIL
          - state_machines.Fund.UNTESTED_to_DEFICIENT
          - entities.PenaltyAssessment.fields.monthly_penalty_amount
        distinguishing_aspect: |
          Mode (b) — order-of-operations trap: rounding the per-month figure to
          the cent BEFORE summing over 6 failed months yields
          gross_penalty_amount 1999.98, whereas the natural single-rounding
          order (shortfall * 0.08 / 12 * 6 rounded once) yields 2000.00; the
          two-cent gap is the only observable that distinguishes the contract
          from the plausible alternative.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund managed by mgr-fund-1 with compliance_posture UNTESTED and consecutive_failed_tests 0."
            - "Two FundAssets: QUALIFIED QOZ_BUSINESS_PROPERTY at 850000.00 and NONQUALIFIED CASH at 150000.00."
            - "One MEASURED AssetTest over [2026-01-01, 2026-07-01) with measurement_date 2026-06-30, result FAIL, shortfall_amount 50000.00 and failed_month_count 6, measured by co-measurer-1."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Rounding Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 850000.00, afs_fair_value: 850000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { qual_asset_id: $.data.id }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "CASH", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 150000.00, afs_fair_value: 150000.00 }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cash_asset_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          trigger:
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
            - call: "GET /qof/penalty-assessments?fund_id=${fund_id}"
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
              captures: { pa_id: "$.data[0].id" }
          assert:
            - "AssetTest.${test_id}.status == CERTIFIED_FAIL"
            - "AssetTest.${test_id}.shortfall_amount == 50000.00"
            - "AssetTest.${test_id}.failed_month_count == 6"
            - "PenaltyAssessment.${pa_id}.asset_test_id == ${test_id}"
            - "PenaltyAssessment.${pa_id}.shortfall_amount == 50000.00"
            - "PenaltyAssessment.${pa_id}.failed_month_count == 6"
            - "PenaltyAssessment.${pa_id}.monthly_penalty_amount == 333.33"
            - "PenaltyAssessment.${pa_id}.gross_penalty_amount == 1999.98"
            - "PenaltyAssessment.${pa_id}.gross_penalty_amount != 2000.00 (the rejected single-rounding order)"
            - "PenaltyAssessment.${pa_id}.cure_credit_amount == 0.00"
            - "PenaltyAssessment.${pa_id}.net_penalty_amount == 1999.98"
            - "PenaltyAssessment.${pa_id}.status == ASSESSED"
            - "Fund.${fund_id}.cumulative_penalty_months == 6"
            - "Fund.${fund_id}.consecutive_failed_tests == 1"
            - "Fund.${fund_id}.compliance_posture == DEFICIENT"
            - "Fund.${fund_id}.certification_status == SELF_CERTIFIED"

      - name: penalty_cure_credit_tier_from_gross
        grounds:
          - calculations.penalty_cure_credit_netting
          - state_machines.PenaltyAssessment.CURE_REQUESTED_to_CURED
          - entities.PenaltyAssessment.fields.cure_credit_amount
          - validations[priority=39]
        distinguishing_aspect: |
          Mode (c) — evaluation-order pinning of a self-referential definition:
          the credit cap tier is selected from gross_penalty_amount 1999.98
          (>= 1000.00 -> 0.60), producing cure_credit_amount 1199.99 and
          net_penalty_amount 799.99; re-deriving the tier from the resulting
          net (799.99 < 1000.00 -> 0.40) would produce 800.00 / 1199.98, so the
          pair (1199.99, 799.99) uniquely identifies the pinned single pass.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund with a CERTIFIED_FAIL AssetTest (shortfall_amount 50000.00, failed_month_count 6) and the resulting PenaltyAssessment in status ASSESSED with gross_penalty_amount 1999.98."
