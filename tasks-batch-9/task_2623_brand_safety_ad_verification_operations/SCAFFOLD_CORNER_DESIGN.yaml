      - name: aggregate_credit_cap_across_claims
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: rejected_claim_over_exhausted_cap_returns_state_error_not_fiscal_error
          rationale: |
            The aggregate-validation corner here is validation 34: each claim is
            individually approvable but their summed net_credit_cents crosses
            Advertiser.credit_cap_cents. The §1.8 instance already approves a
            first claim that consumes most of the cap, drives a second claim to
            ERR_CREDIT_CAP_EXCEEDED on approval, and then shows that a
            REJECTED-then-reversed claim surfaces ERR_INVALID_CLAIM_STATE rather
            than the fiscal error - i.e. it pins the aggregate boundary and its
            interaction with the state guard in one fixture. A standalone corner
            instance would only re-run the cheaper half.

      - name: counts_check_outranks_window_collision
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: inconsistent_counts_outrank_window_collision_on_batch_intake
          rationale: |
            The priority-conflict corner on batch intake - a request that
            violates both validation 23 (impression counts) and validation 30
            (60-second window buffer) must answer
            ERR_IMPRESSION_COUNTS_INCONSISTENT - is exactly what the §1.8
            instance constructs, including the mirrored control call that
            isolates each rule on its own. Re-emitting it here would duplicate
            the fixture verbatim.

      - name: appeal_sod_outranks_round_exhaustion
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: appeal_sod_breach_outranks_round_exhaustion
          rationale: |
            The second priority conflict in the scaffold pits validation 10
            (appeal segregation of duties) against validation 26 (three-round
            cap) on a single decide call. The §1.8 instance drives an appeal to
            round 3 and then has the disqualified officer attempt the decision,
            asserting ERR_SEGREGATION_OF_DUTIES rather than
            ERR_APPEAL_ROUNDS_EXHAUSTED, plus the clean-officer control. Fully
            covered.

      - name: revised_tier_guard_applies_only_to_the_overturned_branch
        claim_type: conditional_validation
        grounds:
          - validations.priority_14
          - errors[ERR_REVISED_TIER_REQUIRED]
          - endpoints[POST /appeals/{id}/decide]
          - calculations.page_suitability_tier
        distinguishing_aspect: |
          Validation 14 is a two-armed conditional keyed on the decision itself,
          not on stored state: OVERTURNED REQUIRES revised_tier and requires it
          to be strictly better, while UPHELD FORBIDS the same field. Both arms
          answer one error id, so the same payload shape is legal on one branch
          and illegal on the other. Two appeals over identical MEDIUM_RISK pages
          run the full grid - missing, equal, worse, and better on the overturn
          branch; present and absent on the uphold branch - so an implementation
          that only checks presence, or that accepts a tier of equal rank, or
          that ignores a stray revised_tier on an uphold, is caught.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z. Two pages of one publisher, each classified from category_codes [GAMBLING] by analyst-1 as MODEL with model_confidence 0.95: mfa_score = 4.00 density (0.10 * 100 * 0.4) + 0.00 refresh + 8.00 sourced (0.40 * 20) + 1.50 originality ((100 - 90) * 0.15) = 13.50, below the 70.00 flag, so mfa_multiplier is 1.0; model_confidence 0.95 >= 0.80 so confidence_multiplier is 1.0; adjusted_risk_points = 15.00 -> assigned_tier MEDIUM_RISK (TIER_RANK 2). Each record is CONFIRMED by analyst-2 and then appealed by the publisher, so both appeals sit in FILED and both pages in APPEALED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/odds" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_a: $.data.id, page_a_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_a}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_a_ver}", classifier_kind: "MODEL", category_codes: ["GAMBLING"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_a: $.data.id, tier_a: $.data.assigned_tier }
            - call: "POST /page-classifications/${cls_a}/review"
              payload: { decision: "CONFIRM", review_note: "Odds page, gambling only" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
            - call: "POST /appeals"
              payload: { classification_id: "${cls_a}", reason_code: "CONTEXT_IGNORED", evidence_note: "Editorial odds coverage, not a betting product" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { appeal_a: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/parlay" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_b: $.data.id, page_b_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_b}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_b_ver}", classifier_kind: "MODEL", category_codes: ["GAMBLING"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_b: $.data.id, tier_b: $.data.assigned_tier }
            - call: "POST /page-classifications/${cls_b}/review"
              payload: { decision: "CONFIRM", review_note: "Parlay page, gambling only" }
              as: ClassificationAnalyst
              as_user_id: "analyst-2"
            - call: "POST /appeals"
              payload: { classification_id: "${cls_b}", reason_code: "CONTEXT_IGNORED", evidence_note: "Same editorial argument as the odds page" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { appeal_b: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_a}/decide"
              payload: { outcome: "OVERTURNED", decision_note: "Overturn with no remedy named" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_missing: $.data.error_id }
            - call: "POST /appeals/${appeal_a}/decide"
              payload: { outcome: "OVERTURNED", revised_tier: "MEDIUM_RISK", decision_note: "Overturn to the very tier under dispute" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_equal: $.data.error_id }
            - call: "POST /appeals/${appeal_a}/decide"
              payload: { outcome: "OVERTURNED", revised_tier: "HIGH_RISK", decision_note: "Overturn downward" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_worse: $.data.error_id }
            - call: "POST /appeals/${appeal_a}/decide"
              payload: { outcome: "OVERTURNED", revised_tier: "LOW_RISK", decision_note: "Editorial context accepted, one tier of relief" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { a_state: $.data.appeal_state }
            - call: "POST /appeals/${appeal_b}/decide"
              payload: { outcome: "UPHELD", revised_tier: "SAFE", decision_note: "Uphold, but a remedy tier is attached anyway" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { e_stray: $.data.error_id }
            - call: "POST /appeals/${appeal_b}/decide"
              payload: { outcome: "UPHELD", decision_note: "Classification stands" }
              as: DisputeOfficer
              as_user_id: "officer-1"
              captures: { b_state: $.data.appeal_state }
            - call: "GET /pages/${page_a}"
              payload: {}
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_a_state: $.data.classification_state, page_a_tier: $.data.current_tier }
            - call: "GET /pages/${page_b}"
              payload: {}
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_b_state: $.data.classification_state, page_b_tier: $.data.current_tier }
          assert:
            - "Setup: ${tier_a} == MEDIUM_RISK and ${tier_b} == MEDIUM_RISK, both from adjusted_risk_points 15.00"
            - "Trigger 1 (overturn arm, field absent): HTTP 422 and ${e_missing} == ERR_REVISED_TIER_REQUIRED; Appeal.${appeal_a}.appeal_state is still FILED and round_no is still 1"
            - "Trigger 2 (overturn arm, TIER_RANK[MEDIUM_RISK] == TIER_RANK[MEDIUM_RISK]): HTTP 422 and ${e_equal} == ERR_REVISED_TIER_REQUIRED - the rule demands strictly better, so equal rank is not relief"
            - "Trigger 3 (overturn arm, TIER_RANK[HIGH_RISK] 1 < 2): HTTP 422 and ${e_worse} == ERR_REVISED_TIER_REQUIRED"
            - "After triggers 1-3: Page.${page_a}.classification_state is still APPEALED, current_classification_id is still ${cls_a} and PageClassification.${cls_a}.review_state is still CONFIRMED - three refusals mutated nothing"
            - "Trigger 4 (overturn arm, TIER_RANK[LOW_RISK] 3 > 2): HTTP 200 and ${a_state} == OVERTURNED"
            - "Trigger 5 (uphold arm with revised_tier supplied): HTTP 422 and ${e_stray} == ERR_REVISED_TIER_REQUIRED - the identical field that made trigger 4 legal makes this call illegal, which is the conditional the rule encodes"
            - "Trigger 6 (uphold arm, field absent): HTTP 200 and ${b_state} == UPHELD"
            - "Trigger 7: ${page_a_state} == RECLASSIFIED and ${page_a_tier} == LOW_RISK - the overturn minted an APPEAL_REMEDY classification and repointed the page"
            - "Trigger 8: ${page_b_state} == HUMAN_CONFIRMED and ${page_b_tier} == MEDIUM_RISK - the uphold changed no tier"
            - "Publisher.${pub_id}.decided_appeal_count == 2 and overturned_appeal_count == 1: only the two accepted decisions were counted"

      - name: claim_window_check_consumes_the_dereferenced_batch_set
        claim_type: cascading_validation
        grounds:
          - validations.priority_33
          - validations.priority_15
          - validations.priority_5
          - endpoints[POST /refund-claims]
        distinguishing_aspect: |
          The 30-day claim window is measured against the LATEST window_end among
          the cited batches, so the temporal check cannot even be evaluated until
          every element of batch_ids has been dereferenced (priority 5) and
          confirmed to belong to the claim's campaign and publisher (priority
          15). The fixture cites a 70-day-old batch every time and peels one
          upstream defect per attempt: an unresolvable id must answer not-found
          rather than window-closed, an out-of-scope id must answer scope
          mismatch, and only once the set is clean does the window verdict
          appear. An implementation that computes the window from whichever
          batches happened to resolve reports ERR_CLAIM_WINDOW_CLOSED on the
          first two attempts and fails here.
        test_recipe:
          setup:
            - "Two campaigns of one advertiser (both DISPLAY) and one classified page. At clock 2026-06-15T00:00:00Z a batch is measured for each campaign over window [2026-06-01T00:00:00Z, 2026-06-01T01:00:00Z]; measured 10000 / measurable 6000 / in_view 6000 gives coverage_rate 0.6000 below the pinned floor 0.7, so certify QUARANTINES both, making them claimable. The clock then advances to 2026-08-10T00:00:00Z - 69 days past that window_end, well outside CLAIM_FILING_WINDOW_DAYS 30 - and a third batch is measured for the main campaign over [2026-08-09T00:00:00Z, 2026-08-09T01:00:00Z] and quarantined the same way."
