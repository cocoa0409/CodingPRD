          - entities.Offer.fields.effective_price_cents
        distinguishing_aspect: |
          On POST /contingencies/{id}/resolve for APPRAISAL, appraised_value_cents == effective_price_cents
          (exact equality, 50000000 == 50000000) SATISFIES via >=, where one cent less (49999999) FAILS — a
          numeric >= boundary on the appraisal-gap metric.
