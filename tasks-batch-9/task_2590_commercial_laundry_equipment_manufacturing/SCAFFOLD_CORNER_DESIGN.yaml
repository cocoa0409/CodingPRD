  - section: endpoints
    instances:
      - name: model_lifecycle_release_then_manual_suspend
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /clm/machine-models/{id}/lifecycle-actions]
          - state_machines.MachineModel
          - entities.MachineModel.fields.suspended_reason
        distinguishing_aspect: "One action endpoint multiplexes two different transitions by its action field: RELEASE moves CERTIFIED to RELEASED and leaves suspended_reason NONE, while SUSPEND with reason MANUAL moves RELEASED to SUSPENDED and records the operator's reason rather than the cascade's YIELD_RESURVEY."
        test_recipe:
          setup: ["OPL-60-A certified through both review dimensions"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
          trigger:
            - call: "POST /clm/machine-models/${m1}/lifecycle-actions"
              payload: { action: "RELEASE" }
              as: ProductEngineer
              as_user_id: "u-pe-01"
            - call: "POST /clm/machine-models/${m1}/lifecycle-actions"
              payload: { action: "SUSPEND", reason: "MANUAL" }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { v2: $.data.version }
          assert:
            - "after the first trigger call MachineModel.${m1}.certification_state == RELEASED and suspended_reason == NONE"
            - "after the second trigger call MachineModel.${m1}.certification_state == SUSPENDED"
            - "MachineModel.${m1}.suspended_reason == MANUAL"
            - "${v2} == 4 (create, certify, release, suspend)"
            - "CertificationDossier.${d1}.dossier_state == CERTIFIED (a suspension does not resurvey the dossier)"

      - name: quote_decision_requests_revision_then_accepts_resubmission
        claim_type: conditional_action
        grounds:
          - endpoints[POST /clm/quotes/{id}/decision]
          - state_machines.PackageQuote
          - entities.PackageQuote.fields.revision_round
        distinguishing_aspect: "REQUEST_REVISION is the one decision branch that does NOT terminate the quote: it increments revision_round, reopens line editing, and a resubmission recomputes the financing fields from the amended line set — verified_credit_score stays null because only APPROVE requires it."
        test_recipe:
          setup:
            - "Model OPL-60-A at list 1250000; Distributor D-01 AUTHORIZED"
            - "SUBMITTED quote with one line of 1 unit, financing NONE"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
