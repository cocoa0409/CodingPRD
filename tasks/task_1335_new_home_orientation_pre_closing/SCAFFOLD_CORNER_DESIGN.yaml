            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id", v1: "$.data.version" } }
          trigger:
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager, captures: { v2: "$.data.version" } }
