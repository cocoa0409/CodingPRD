              as_user_id: "ad-2"
            - call: "POST /caption-ad/audio-description-tracks/${ad_2}/approve-script"
              payload: {}
              as: QCSpecialist
              as_user_id: "qc-1"
          trigger:
            - call: "POST /caption-ad/audio-description-tracks/${ad_2}/book-studio"
              payload: { studio_id: "ST-A", record_start_at: "2026-08-12T15:30:00Z", record_end_at: "2026-08-12T16:00:00Z" }
              as: ADProducer
              as_user_id: "ad-2"
            - call: "POST /caption-ad/audio-description-tracks/${ad_2}/book-studio"
              payload: { studio_id: "ST-A", record_start_at: "2026-08-12T15:29:00Z", record_end_at: "2026-08-12T16:00:00Z" }
              as: ADProducer
              as_user_id: "ad-2"
              captures: { err: $.data.error_id }
          assert:
            - "Booking at 15:30 succeeds: exactly 30 minutes after the prior booking's closed end 15:00 satisfies the minimum gap (15:30 >= 15:00 + 30min)"
            - "Re-booking attempt at 15:29 fails ERR_STUDIO_TURNOVER_VIOLATION (409): 29 minutes < 30-minute turnover"
            - "The 15:30 booking remains stored on ${ad_2} (the failed second call changes nothing)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: preemption_capacity_conservation
        grounds:
          - calculations.stenographer_committed_minutes
          - state_machines.LiveAssignment.ACCEPTED_to_PREEMPTED
          - entities.Stenographer.fields.make_up_minutes_credited
        distinguishing_aspect: |
          Conserved quantity = committed live-minutes: across accept -> preempt ->
          accept-elsewhere, committed(S,day) + released(S,day) == total ever booked,
          and make_up_minutes_credited tracks exactly the preempted booked_minutes —
          preemption credits compensation, no-show does not.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T08:00:00Z"
            - "Client; S1 ACTIVE CERT_CBC cap 300"
            - "E1 2026-08-10 09:00-10:00 prep 15 wrap 5 (booked 80): ACCEPTED then PREEMPTED"
            - "E2 2026-08-10 12:00-12:30 prep 0 wrap 0 (booked 30): ACCEPTED"
            - "E3 2026-08-10 14:00-14:10 prep 0 wrap 0 (booked 10): ACCEPTED then marked NO_SHOW at/after 14:00"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Live Client", compliance_standard: "FCC_BROADCAST" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/stenographers"
              payload: { display_name: "S1", certification: "CERT_CBC", certified_since: "2020-01-01T00:00:00Z", cert_valid_until: "2027-01-01T00:00:00Z" }
              as: Scheduler
              captures: { s_1: $.data.id }
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E1", channel_id: "CH1", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T10:00:00Z", required_certification: "CERT_CBC" }
              as: Scheduler
              captures: { ev_1: $.data.id, ev_1_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_1}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_1_v}" }
              as: Scheduler
              captures: { asg_1: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_1}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/live-assignments/${asg_1}/preempt"
              payload: { preemption_reason: "SCHEDULER_OVERRIDE" }
              as: Scheduler
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E2", channel_id: "CH2", start_at: "2026-08-10T12:00:00Z", end_at: "2026-08-10T12:30:00Z", required_certification: "CERT_CBC", prep_minutes: 0, wrap_minutes: 0 }
              as: Scheduler
              captures: { ev_2: $.data.id, ev_2_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_2}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_2_v}" }
              as: Scheduler
              captures: { asg_2: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_2}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/live-events"
              payload: { client_id: "${c_id}", title: "E3", channel_id: "CH3", start_at: "2026-08-10T14:00:00Z", end_at: "2026-08-10T14:10:00Z", required_certification: "CERT_CBC", prep_minutes: 0, wrap_minutes: 0 }
              as: Scheduler
              captures: { ev_3: $.data.id, ev_3_v: $.data.version }
            - call: "POST /caption-ad/live-events/${ev_3}/assignments"
              payload: { stenographer_id: "${s_1}", expected_live_event_version: "${ev_3_v}" }
              as: Scheduler
              captures: { asg_3: $.data.id }
            - call: "POST /caption-ad/live-assignments/${asg_3}/accept"
              payload: {}
              as: Stenographer
              as_user_id: "${s_1}"
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/live-assignments/${asg_3}/mark-no-show"
              payload: {}
              as: Scheduler
          trigger:
            - call: "GET /caption-ad/stenographers/${s_1}"
              payload: {}
              as: Scheduler
              captures: { make_up: $.data.make_up_minutes_credited, noshow: $.data.no_show_count }
          assert:
            - "Stenographer.${s_1}.make_up_minutes_credited == 80 (only the PREEMPTED booking credits; the NO_SHOW booking does not)"
            - "Stenographer.${s_1}.no_show_count == 1"
            - "Conservation: committed == 30 (E2 only), released == 90 (80 preempted + 10 no-show), total ever booked 120 == 30 + 90"
            - "After preemption, a new booking for the freed 09:45-10:05 window would be admissible — released capacity is immediately reusable"

      - name: current_version_cardinality_invariant
        grounds:
          - state_machines.CaptionTrack
          - state_machines.Complaint.TRIAGED_to_REMEDIATING
          - entities.CaptionTrack.fields.version_no
        distinguishing_aspect: |
          Conserved quantity = cardinality of the current caption version (different
          conserved quantity from committed minutes): across direct supersede, a
          complaint remediation round, and a second remediation round, exactly one
          track per work order sits outside {SUPERSEDED, ARCHIVED,
          QC_FAILED_PERMANENT} at every observable point, and version_no strictly
          increases 1 -> 2 -> 3.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T10:00:00Z"
            - "INTERNAL client, CAPTIONS order IN_PRODUCTION with track v1 AUTHORING"
          setup_api_calls:
            - call: "POST /caption-ad/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OperationsManager
            - call: "POST /caption-ad/clients"
              payload: { name: "Internal Client", compliance_standard: "INTERNAL" }
              as: OperationsManager
              captures: { c_id: $.data.id }
            - call: "POST /caption-ad/media-assets"
              payload: { client_id: "${c_id}", title: "Prog", media_kind: "FILE_BASED", duration_seconds: 3600, frame_rate: "FPS_30" }
              as: IntakeCoordinator
              captures: { m_a: $.data.id }
            - call: "POST /caption-ad/media-assets/${m_a}/begin-inspection"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/media-assets/${m_a}/clear"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders"
              payload: { client_id: "${c_id}", media_asset_id: "${m_a}", service_type: "CAPTIONS", turnaround_tier: "STANDARD", language: "en-US" }
              as: IntakeCoordinator
              captures: { wo_a: $.data.id }
            - call: "POST /caption-ad/work-orders/${wo_a}/quote"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /caption-ad/work-orders/${wo_a}/confirm"
              payload: {}
              as: ClientContact
              as_user_id: "${c_id}"
            - call: "POST /caption-ad/work-orders/${wo_a}/start-production"
              payload: {}
              as: CaptionEditor
              captures: { wo_a_v: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "DASH", expected_work_order_version: "${wo_a_v}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_1: $.data.id }
          trigger:
            - call: "GET /caption-ad/work-orders/${wo_a}"
              payload: {}
              as: CaptionEditor
              captures: { wo_a_v2: $.data.version }
            - call: "POST /caption-ad/work-orders/${wo_a}/caption-tracks"
              payload: { language: "en-US", caption_format: "SRT", speaker_id_style: "CHEVRON", supersedes_track_id: "${t_1}", expected_work_order_version: "${wo_a_v2}" }
              as: CaptionEditor
              as_user_id: "editor-1"
              captures: { t_2: $.data.id, t_2_vno: $.data.version_no }
            - call: "POST /caption-ad/caption-tracks/${t_2}/submit-review"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_2}/enqueue-qc"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/caption-tracks/${t_2}/qc-reviews"
              payload: { review_mode: "FULL_REVIEW", total_words: 10000, minor_errors: 100, major_errors: 0, critical_errors: 0 }
              as: QCSpecialist
              as_user_id: "qc-1"
            - call: "POST /caption-ad/caption-tracks/${t_2}/mark-conformed"
              payload: {}
              as: CaptionEditor
              as_user_id: "editor-1"
            - call: "POST /caption-ad/work-orders/${wo_a}/deliver"
              payload: {}
              as: OperationsManager
            - call: "POST /caption-ad/complaints"
              payload: { severity: "MINOR", description: "timing drift", caption_track_id: "${t_2}" }
              as: ClientContact
              as_user_id: "${c_id}"
              captures: { comp: $.data.id }
            - call: "POST /caption-ad/complaints/${comp}/triage"
              payload: {}
              as: OperationsManager
            - call: "POST /caption-ad/complaints/${comp}/begin-remediation"
              payload: {}
              as: OperationsManager
              as_user_id: "ops-1"
              captures: { t_3: $.data.remediation_track_id }
            - call: "GET /caption-ad/caption-tracks?work_order_id=${wo_a}"
              payload: {}
              as: OperationsManager
          assert:
            - "After direct supersede: ${t_1} SUPERSEDED, ${t_2} version_no == 2 and is the sole non-terminal track"
            - "After complaint + begin-remediation: ${t_2} SUPERSEDED, remediation track ${t_3} AUTHORING with version_no == 3 and supersedes_track_id == ${t_2}"
            - "GET list shows exactly 3 tracks and exactly one with track_status NOT IN {SUPERSEDED, ARCHIVED, QC_FAILED_PERMANENT} — cardinality conserved through every hop"
            - "WorkOrder.${wo_a}.order_status == IN_PRODUCTION after begin-remediation (REMEDIATION -> IN_PRODUCTION leg)"
