  - { method: GET, path: "/vendor-office/trays/{id}", description: "Get tray", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: LoanerTray, side_effects: [] }
  - { method: POST, path: "/vendor-office/trays/{id}/mark-missing", description: "EXPECTED -> MISSING; auto-creates MISSING_TRAY escalation", roles: [VendorCoordinator], code: 200, input: [], output: LoanerTray, side_effects: ["Escalation OPEN MISSING_TRAY created", "readiness recompute"] }
  - { method: POST, path: "/vendor-office/trays/{id}/stage", description: "STERILE_READY -> STAGED (case must be SCHEDULED)", roles: [ORCirculatorNurse], code: 200, input: [], output: LoanerTray, side_effects: ["readiness recompute"] }

  # --- CheckInEvent ---
  - { method: POST, path: "/vendor-office/requests/{id}/check-ins", description: "Vendor rep delivery check-in with count sheet + documentation; covered trays -> DELIVERY_PENDING", roles: [VendorRep], code: 201, input: [lines, ifu_provided, "implant_log_provided?", loaner_agreement_ref], output: CheckInEvent, side_effects: ["delivered_at = clock; rep_id = X-User-ID; trays EXPECTED/MISSING -> DELIVERY_PENDING"] }
  - { method: GET, path: "/vendor-office/check-ins", description: "List check-ins (FK reverse for request_id, rep_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["request_id?", "rep_id?", "status?", "limit?", "offset?"], output: "CheckInEvent[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/check-ins/{id}", description: "Get check-in", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: CheckInEvent, side_effects: [] }
  - { method: POST, path: "/vendor-office/check-ins/{id}/verify", description: "Coordinator verifies count sheet with per-line disposition; late minutes computed; late delivery creates ACCRUING penalty (cascade link 1) and updates request penalty_exposure (link 2)", roles: [VendorCoordinator], code: 200, input: [line_dispositions], output: CheckInEvent, side_effects: ["verified_by_user_id = X-User-ID; late_minutes computed", "late_minutes > vendor.late_grace_minutes -> PenaltyAssessment ACCRUING created -> request.penalty_exposure_cents recomputed", "line trays -> CHECKED_IN or QUARANTINED with escalations"] }

  # --- SterilizationTurn ---
  - { method: POST, path: "/vendor-office/trays/{id}/turns", description: "Open sterilization turn on CHECKED_IN tray (turn starts DECONTAMINATING; tray -> PROCESSING)", roles: [SterileProcessingTech], code: 201, input: [], output: SterilizationTurn, side_effects: ["tray -> PROCESSING; decon_started_at = clock; readiness recompute"] }
  - { method: GET, path: "/vendor-office/turns", description: "List turns (FK reverse for tray_id, sterilizer_unit_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["tray_id?", "sterilizer_unit_id?", "status?", "limit?", "offset?"], output: "SterilizationTurn[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/turns/{id}", description: "Get turn", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: SterilizationTurn, side_effects: [] }
  - { method: POST, path: "/vendor-office/turns/{id}/start-cycle", description: "DECONTAMINATING -> STERILIZING on a unit; decon minimum + slot capacity guards", roles: [SterileProcessingTech], code: 200, input: [sterilizer_unit_id], output: SterilizationTurn, side_effects: ["cycle_started_at = clock; tray projection set; readiness recompute"] }
  - { method: POST, path: "/vendor-office/turns/{id}/release", description: "COOLDOWN -> RELEASED (QA pass); tray -> STERILE_READY", roles: [SterileProcessingTech], code: 200, input: [], output: SterilizationTurn, side_effects: ["released_at = clock; tray -> STERILE_READY; readiness recompute"] }
  - { method: POST, path: "/vendor-office/turns/{id}/fail-qa", description: "STERILIZING/COOLDOWN -> FAILED_QA; tray rework loop (CHECKED_IN) or QUARANTINED past MAX_REWORKS with escalation", roles: [SterileProcessingTech], code: 200, input: ["reason?"], output: SterilizationTurn, side_effects: ["tray rework_count +1; tray -> CHECKED_IN or QUARANTINED (+Escalation STERILIZATION_DELAY); projection + readiness recompute (cascade per §1.2)"] }

  # --- Escalation ---
  - { method: POST, path: "/vendor-office/requests/{id}/escalations", description: "Manual escalation on a request", roles: [VendorCoordinator], code: 201, input: [type, "linked_tray_id?"], output: Escalation, side_effects: ["status OPEN"] }
  - { method: GET, path: "/vendor-office/escalations", description: "List escalations (FK reverse for request_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["request_id?", "status?", "type?", "linked_tray_id?", "limit?", "offset?"], output: "Escalation[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/escalations/{id}", description: "Get escalation", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: Escalation, side_effects: [] }
  - { method: POST, path: "/vendor-office/escalations/{id}/acknowledge", description: "OPEN -> ACKNOWLEDGED", roles: [VendorCoordinator], code: 200, input: [], output: Escalation, side_effects: [] }
  - { method: POST, path: "/vendor-office/escalations/{id}/resolve", description: "OPEN/ACKNOWLEDGED -> RESOLVED with per-type guards", roles: [VendorCoordinator], code: 200, input: [resolution_type], output: Escalation, side_effects: ["resolution_type stamped"] }

  # --- ORAccessPass ---
  - { method: POST, path: "/vendor-office/access-passes", description: "Request OR access for a rep on a case (case must be SCHEDULED; VendorRep callers may only request for themselves)", roles: [VendorRep, VendorCoordinator], code: 201, input: [rep_id, case_id], output: ORAccessPass, side_effects: ["status REQUESTED"] }
  - { method: GET, path: "/vendor-office/access-passes", description: "List access passes (FK reverse for rep_id, case_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["rep_id?", "case_id?", "status?", "limit?", "offset?"], output: "ORAccessPass[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/access-passes/{id}", description: "Get access pass", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: ORAccessPass, side_effects: [] }
  - { method: POST, path: "/vendor-office/access-passes/{id}/decide", description: "Approve (credential + vendor + case guards; computes window) or deny", roles: [VendorCoordinator], code: 200, input: [decision, "reason?"], output: ORAccessPass, side_effects: ["APPROVE: window_start_at/window_end_at computed; DENY: denial_reason stamped"] }
  - { method: POST, path: "/vendor-office/access-passes/{id}/admit", description: "APPROVED -> ADMITTED within [window_start_at, window_end_at)", roles: [ORCirculatorNurse], code: 200, input: [], output: ORAccessPass, side_effects: [] }

  # --- PickupRecord ---
  - { method: POST, path: "/vendor-office/requests/{id}/pickups", description: "Post-case pickup with returned count sheet; covered trays -> PICKED_UP", roles: [VendorRep], code: 201, input: [lines], output: PickupRecord, side_effects: ["picked_up_at = clock; rep_id = X-User-ID; trays AWAITING_PICKUP -> PICKED_UP with returned counts"] }
  - { method: GET, path: "/vendor-office/pickups", description: "List pickups (FK reverse for request_id, rep_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["request_id?", "rep_id?", "status?", "limit?", "offset?"], output: "PickupRecord[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/pickups/{id}", description: "Get pickup", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: PickupRecord, side_effects: [] }
  - { method: POST, path: "/vendor-office/pickups/{id}/reconcile", description: "Reconcile counts (SoD vs check-in verifier); shortage/damage auto-claims; tray -> RECONCILED; request bubble-up CLOSED", roles: [VendorCoordinator], code: 200, input: [], output: PickupRecord, side_effects: ["per-line shortage + auto DamageLossClaim (calc_reconciliation_shortage_claims)", "trays -> RECONCILED", "request CLOSED when all trays terminal and case COMPLETED"] }
  - { method: POST, path: "/vendor-office/pickups/{id}/dispute", description: "SUBMITTED -> DISPUTED by vendor rep (before reconcile)", roles: [VendorRep], code: 200, input: ["reason?"], output: PickupRecord, side_effects: [] }

  # --- DamageLossClaim ---
  - { method: POST, path: "/vendor-office/claims", description: "Manual claim against a tray (provisional presumptive share computed at filing)", roles: [VendorCoordinator], code: 201, input: [tray_id, request_id, damage_type, claimed_amount_cents], output: DamageLossClaim, side_effects: ["provisional_vendor_share_cents computed per calc_liability_apportionment"] }
  - { method: GET, path: "/vendor-office/claims", description: "List claims (FK reverse for tray_id, request_id, pickup_id); order (created_at ASC, claim_seq ASC)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["tray_id?", "request_id?", "pickup_id?", "status?", "limit?", "offset?"], output: "DamageLossClaim[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/claims/{id}", description: "Get claim", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: DamageLossClaim, side_effects: [] }
  - { method: POST, path: "/vendor-office/claims/{id}/apportion", description: "OCC-guarded apportion / re-apportion after dispute; computes final shares; vendor liability rollup +=", roles: [VendorCoordinator], code: 200, input: [vendor_share_percent, expected_claim_version], output: DamageLossClaim, side_effects: ["final shares computed (round_half_up vendor, hospital remainder)", "vendor.outstanding_liability_cents += final_vendor_share_cents", "claim.version +1"] }
  - { method: POST, path: "/vendor-office/claims/{id}/dispute", description: "APPORTIONED -> DISPUTED by the vendor's rep; liability rollup -=", roles: [VendorRep], code: 200, input: ["reason?"], output: DamageLossClaim, side_effects: ["vendor.outstanding_liability_cents -= final_vendor_share_cents"] }
  - { method: POST, path: "/vendor-office/claims/{id}/settle", description: "APPORTIONED -> SETTLED; liability rollup -=", roles: [VendorCoordinator], code: 200, input: [], output: DamageLossClaim, side_effects: ["vendor.outstanding_liability_cents -= final_vendor_share_cents"] }

  # --- PenaltyAssessment ---
  - { method: GET, path: "/vendor-office/penalties", description: "List penalties (FK reverse for request_id, check_in_id)", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: ["request_id?", "check_in_id?", "status?", "limit?", "offset?"], output: "PenaltyAssessment[]", side_effects: [] }
  - { method: GET, path: "/vendor-office/penalties/{id}", description: "Get penalty", roles: [VendorCoordinator, ORScheduler, SterileProcessingTech, ORCirculatorNurse, VendorRep], code: 200, input: [], output: PenaltyAssessment, side_effects: [] }
  - { method: POST, path: "/vendor-office/penalties/{id}/assess", description: "ACCRUING -> ASSESSED (case must be COMPLETED); computes delay surcharge from final attribution; rollups", roles: [VendorCoordinator], code: 200, input: [], output: PenaltyAssessment, side_effects: ["delay_surcharge_cents + assessed_cents computed", "request.penalty_exposure_cents recompute; vendor.outstanding_penalty_cents += outstanding_cents"] }
  - { method: POST, path: "/vendor-office/penalties/{id}/waive", description: "Partial/full waiver (SoD vs check-in verifier); full waiver -> WAIVED_CLOSED", roles: [VendorCoordinator], code: 200, input: [waive_amount_cents, reason], output: PenaltyAssessment, side_effects: ["waived_cents += amount; outstanding recompute; vendor.outstanding_penalty_cents -= amount"] }
  - { method: POST, path: "/vendor-office/penalties/{id}/settle", description: "Settle exactly the outstanding amount -> SETTLED", roles: [VendorCoordinator], code: 200, input: [settle_amount_cents], output: PenaltyAssessment, side_effects: ["settled_cents += amount; outstanding 0; vendor.outstanding_penalty_cents -= amount"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "X-User-Role not in the endpoint's roles list" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, wrong type, invalid enum member, non-positive numeric where required" }
  # --- existence ---
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "vendor id does not exist" }
  - { id: ERR_REP_NOT_FOUND, http: 404, condition: "rep id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "OR room id does not exist" }
  - { id: ERR_STERILIZER_NOT_FOUND, http: 404, condition: "sterilizer unit id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "case id does not exist" }
  - { id: ERR_REQUEST_NOT_FOUND, http: 404, condition: "loaner request id does not exist" }
  - { id: ERR_TRAY_NOT_FOUND, http: 404, condition: "tray id does not exist" }
  - { id: ERR_CHECKIN_NOT_FOUND, http: 404, condition: "check-in id does not exist" }
  - { id: ERR_TURN_NOT_FOUND, http: 404, condition: "sterilization turn id does not exist" }
  - { id: ERR_ESCALATION_NOT_FOUND, http: 404, condition: "escalation id does not exist" }
  - { id: ERR_PASS_NOT_FOUND, http: 404, condition: "access pass id does not exist" }
  - { id: ERR_PICKUP_NOT_FOUND, http: 404, condition: "pickup id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id does not exist" }
  - { id: ERR_PENALTY_NOT_FOUND, http: 404, condition: "penalty id does not exist" }
  - { id: ERR_DELAY_EVENT_NOT_FOUND, http: 404, condition: "delay event id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the entity's current version" }
  # --- state ---
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "vendor not ACTIVE where required (request create/approve, pass approve)" }
  - { id: ERR_VENDOR_HAS_OPEN_WORK, http: 409, condition: "terminate blocked by open requests, penalties, or claims" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "case not in required state (start/complete/cancel/reschedule/stage/assess guards)" }
  - { id: ERR_CASE_READINESS_BLOCKED, http: 409, condition: "case start blocked: a linked APPROVED request is not READY and no override supplied" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "request not in required state (add tray, submit, decide, cancel, check-in, pickup, escalate guards)" }
  - { id: ERR_TRAY_INVALID_STATE, http: 409, condition: "tray not in required state (mark-missing, turns create, stage, check-in line, pickup line guards)" }
  - { id: ERR_TURN_INVALID_STATE, http: 409, condition: "turn not in required state for start-cycle/release/fail-qa" }
  - { id: ERR_CHECKIN_INVALID_STATE, http: 409, condition: "check-in not SUBMITTED for verify" }
  - { id: ERR_PICKUP_INVALID_STATE, http: 409, condition: "pickup not in required state for reconcile/dispute" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "claim not in required state for apportion/dispute/settle" }
  - { id: ERR_PENALTY_INVALID_STATE, http: 409, condition: "penalty not in required state for assess/waive/settle" }
  - { id: ERR_PASS_INVALID_STATE, http: 409, condition: "pass not in required state for decide/admit" }
  - { id: ERR_ESCALATION_INVALID_STATE, http: 409, condition: "escalation not in required state for acknowledge/resolve" }
  # --- safety ---
  - { id: ERR_REP_CREDENTIAL_NOT_ACTIVE, http: 409, condition: "rep credential not ACTIVE (check-in create, pickup create, pass approve)" }
  - { id: ERR_CREDENTIAL_EXPIRY_PAST, http: 422, condition: "approve-credential expiry not in the future" }
  - { id: ERR_CREDENTIAL_WINDOW_INSUFFICIENT, http: 409, condition: "credential expires at or before case scheduled_end_at on pass approve" }
  - { id: ERR_IMPLANT_LOG_REQUIRED, http: 422, condition: "implant tray in check-in lines without implant_log_provided=true" }
  - { id: ERR_DECON_MIN_NOT_ELAPSED, http: 409, condition: "start-cycle before decon_started_at + 30 minutes" }
  - { id: ERR_COOLDOWN_NOT_ELAPSED, http: 409, condition: "release before cycle_completed_at + cooldown_minutes" }
  # --- temporal ---
  - { id: ERR_ROOM_TIME_CONFLICT, http: 409, condition: "case window collides with another SCHEDULED/IN_PROGRESS case in the same room under buffered half-open semantics" }
  - { id: ERR_ACCESS_WINDOW_CLOSED, http: 409, condition: "admit outside [window_start_at, window_end_at)" }
  - { id: ERR_REQUEST_DEADLINE_INFEASIBLE, http: 422, condition: "submit when case.scheduled_start_at - now < lead_hours(priority_class)" }
  # --- constraint ---
  - { id: ERR_DUPLICATE_VENDOR_CODE, http: 409, condition: "vendor_code already exists" }
  - { id: ERR_DUPLICATE_CASE_NUMBER, http: 409, condition: "case_number already exists" }
  - { id: ERR_DUPLICATE_TRAY_CODE, http: 409, condition: "tray_code already used within the request" }
  - { id: ERR_DUPLICATE_TRAY_LINE, http: 409, condition: "same tray_id appears twice in check-in lines" }
  - { id: ERR_STERILIZER_CAPACITY_EXCEEDED, http: 409, condition: "start-cycle when active STERILIZING turns on the unit == slot_capacity" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "same X-User-ID performed check-in verification and now attempts pickup reconcile or penalty waive on the same request" }
  - { id: ERR_REQUEST_NO_TRAYS, http: 409, condition: "submit a request with zero trays" }
  - { id: ERR_ESCALATION_RESOLUTION_INVALID, http: 409, condition: "resolve MISSING_TRAY with BACKFILL_DELIVERY while linked tray is still EXPECTED/MISSING/CANCELLED" }
  # --- referential ---
  - { id: ERR_REP_VENDOR_MISMATCH, http: 403, condition: "acting rep does not belong to the request's/claim's vendor, or VendorRep requests a pass for another rep" }
  - { id: ERR_TRAY_NOT_IN_REQUEST, http: 422, condition: "check-in line or escalation linked tray belongs to a different request" }
  - { id: ERR_DELAY_REQUEST_LINK, http: 422, condition: "vendor-cause delay event missing attributable_request_id, or request not linked to this case" }
  - { id: ERR_DELAY_EVENT_INVALID, http: 422, condition: "delay event minutes <= 0, case not IN_PROGRESS/COMPLETED, or other per-field guard" }
  # --- fiscal ---
  - { id: ERR_CLAIM_AMOUNT_INVALID, http: 422, condition: "claimed_amount_cents <= 0 or tray not in a claim-eligible state (PICKED_UP/RECONCILED/QUARANTINED)" }
  - { id: ERR_CLAIM_APPORTION_INVALID, http: 422, condition: "vendor_share_percent outside [0, 100]" }
  - { id: ERR_WAIVER_EXCEEDS_OUTSTANDING, http: 422, condition: "waive_amount_cents > penalty.outstanding_cents" }
  - { id: ERR_SETTLE_AMOUNT_MISMATCH, http: 422, condition: "settle_amount_cents != penalty.outstanding_cents" }
  - { id: ERR_PICKUP_COUNT_EXCEEDS_DELIVERED, http: 422, condition: "pickup line instrument_count_returned > tray.delivered_instrument_count" }
  - { id: ERR_CASE_DELAY_OVERATTRIBUTED, http: 422, condition: "cumulative vendor-cause delay minutes would exceed case.delay_minutes_provisional" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VendorCoordinator
    description: "OR vendor management office staff: vendor/rep administration, request approval, check-in verification, escalations, access decisions, reconciliation, claims and penalties"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-office/vendors, /suspend, /reinstate, /terminate"
      - "POST /vendor-office/vendors/{vendorId}/reps; POST /vendor-office/reps/{id}/approve-credential, /revoke-credential"
      - "POST /vendor-office/requests/{id}/decide"
      - "POST /vendor-office/check-ins/{id}/verify"
      - "POST /vendor-office/trays/{id}/mark-missing"
      - "POST /vendor-office/requests/{id}/escalations; POST /vendor-office/escalations/{id}/acknowledge, /resolve"
      - "POST /vendor-office/access-passes/{id}/decide"
      - "POST /vendor-office/pickups/{id}/reconcile"
      - "POST /vendor-office/claims (+ /apportion, /settle)"
      - "POST /vendor-office/penalties/{id}/assess, /waive, /settle"
      - "POST /vendor-office/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /vendor-office/access-passes (shared with VendorRep)"
  - name: ORScheduler
    description: "OR scheduling office: rooms, surgical cases, case lifecycle, loaner request drafting/submission/cancellation, delay event recording"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-office/or-rooms"
      - "POST /vendor-office/cases (+ /reschedule, /start, /complete, /cancel)"
      - "POST /vendor-office/requests (+ /trays, /submit, /cancel)"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /vendor-office/cases/{id}/delay-events (shared with ORCirculatorNurse)"
  - name: SterileProcessingTech
    description: "Sterile processing department technician: sterilizer units and sterilization turns"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-office/sterilizer-units"
      - "POST /vendor-office/trays/{id}/turns; POST /vendor-office/turns/{id}/start-cycle, /release, /fail-qa"
    shared_operations:
      - "All GET endpoints (role Any)"
  - name: ORCirculatorNurse
    description: "OR circulator: stages trays for cases, admits credentialed reps, records intra-op delay events"
    identity: opaque
    exclusive_operations:
      - "POST /vendor-office/trays/{id}/stage"
      - "POST /vendor-office/access-passes/{id}/admit"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /vendor-office/cases/{id}/delay-events (shared with ORScheduler)"
  - name: VendorRep
    description: "Vendor representative (entity-backed by VendorRep): delivers trays (check-in), picks up post-case, requests OR access, disputes claims/pickups"
    identity: "entity_backed:VendorRep"
    exclusive_operations:
      - "POST /vendor-office/requests/{id}/check-ins"
      - "POST /vendor-office/requests/{id}/pickups"
      - "POST /vendor-office/pickups/{id}/dispute"
      - "POST /vendor-office/claims/{id}/dispute"
    shared_operations:
      - "All GET endpoints (role Any)"
      - "POST /vendor-office/access-passes (self only: rep_id must equal X-User-ID, else ERR_REP_VENDOR_MISMATCH)"
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
