        distinguishing_aspect: "QUALIFY is not idempotent: repeating it on a QUALIFIED row returns ERR_STATE_INVALID (409) and does not re-stamp qualified_by_user_id or bump the foundry's counters."
        test_recipe:
          setup:
            - "A foundry with one QUALIFIED CASTING/CF8M qualification qualified by qm-c7."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C7", name: "Corner Idem Castings", country_code: "IN" }
