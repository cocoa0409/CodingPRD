              as: EmployerAdmin
              as_user_id: "${emp_id}"
          assert:
            - "the first call returns 404 with error.code == 'ERR_CREDENTIAL_NOT_FOUND'"
            - "the second call returns 404 with error.code == 'ERR_EMPLOYER_NOT_FOUND', not ERR_CREDENTIAL_NOT_FOUND"
            - "EmployerLocation.${loc_a_id}.assigned_server_count == 0 and GET /employer-locations/${loc_a_id}/server-assignments returns total_count 0"

