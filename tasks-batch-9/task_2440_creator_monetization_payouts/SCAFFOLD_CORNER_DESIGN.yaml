            - "error.error_id == 'ERR_FUND_NOT_ALLOCATED'"
            - "CreatorFund.${fd}.status == 'DRAFT'"
            - "CreatorFund.${fd}.recipient_count == 0"
            - "CreatorFund.${fd}.allocated_cents == 0"
            - "CreatorFund.${fd}.unallocated_remainder_cents == 104000"
            - "Creator.${cr_a}.fund_credit_balance_cents == 0"

      - name: payout_retries_exhausted_is_unreachable_and_masked_by_payout_not_failed
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_PAYOUT_RETRIES_EXHAUSTED]"
          - "validations[priority 35]"
          - "validations[priority 36]"
        excluded_because:
          difficulty_instance: payout_retry_cycle_forks_to_abandoned_on_exhaustion
          rationale: "ADJUDICATION: the settlement at retry_count == MAX_PAYOUT_RETRIES forks straight to the terminal ABANDONED, so no payout is ever FAILED with retry_count == 2 and rule 36's error id has no reachable trigger. That instance already walks the cycle to ABANDONED and asserts the follow-up retry answers ERR_PAYOUT_NOT_FAILED at priority 35, which is the observable contract."

      - name: below_payout_threshold_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_BELOW_PAYOUT_THRESHOLD]"
          - "validations[priority 75]"
        excluded_because:
          difficulty_instance: payout_create_missing_tax_safety_outranks_below_threshold_fiscal
          rationale: "That instance reaches the threshold rule after adding a VERIFIED profile and asserts ERR_BELOW_PAYOUT_THRESHOLD for a balance one cent under payout_threshold_cents."

      - name: content_creator_mismatch_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_CONTENT_CREATOR_MISMATCH]"
          - "validations[priority 49]"
        excluded_because:
          difficulty_instance: revenue_event_content_mismatch_referential_outranks_no_open_period_temporal
          rationale: "That instance posts an event whose content_item_id belongs to a different creator and asserts ERR_CONTENT_CREATOR_MISMATCH wins over the temporal period rule."

      - name: creator_not_eligible_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_CREATOR_NOT_ELIGIBLE]"
          - "validations[priority 38]"
        excluded_because:
          difficulty_instance: revenue_event_gated_by_creator_eligibility_dimension
          rationale: "That instance posts a revenue event for a PENDING_REVIEW creator and asserts ERR_CREATOR_NOT_ELIGIBLE with no ledger movement."

      - name: creator_not_payable_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_CREATOR_NOT_PAYABLE]"
          - "validations[priority 37]"
        excluded_because:
          difficulty_instance: payout_create_arrears_state_outranks_zero_balance_fiscal
          rationale: "That instance attempts a payout for an ARREARS creator and asserts ERR_CREATOR_NOT_PAYABLE outranks the zero-balance rule."

      - name: no_payable_balance_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_NO_PAYABLE_BALANCE]"
          - "validations[priority 74]"
        excluded_because:
          difficulty_instance: payout_create_arrears_state_outranks_zero_balance_fiscal
          rationale: "The same instance clears the ARREARS state and then asserts ERR_NO_PAYABLE_BALANCE for the zero-balance creator, so both rules 37 and 74 are triggered there."

      - name: payout_held_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_PAYOUT_HELD]"
          - "validations[priority 33]"
        excluded_because:
          difficulty_instance: payout_submit_gated_by_creator_hold_from_investigation
          rationale: "That instance opens a holding investigation after payout creation and asserts submit answers ERR_PAYOUT_HELD while the payout stays PENDING."

      - name: fund_not_allocatable_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_FUND_NOT_ALLOCATABLE]"
          - "validations[priority 40]"
        excluded_because:
          difficulty_instance: allocate_disbursed_fund_state_outranks_stale_fund_version_occ
          rationale: "That instance re-allocates a DISBURSED fund with a stale version and asserts ERR_FUND_NOT_ALLOCATABLE wins over the OCC rule."

      - name: fund_period_finalized_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_FUND_PERIOD_FINALIZED]"
          - "validations[priority 63]"
        excluded_because:
          difficulty_instance: period_finalization_derived_from_children_then_blocks_fund_creation
          rationale: "That instance derives the period's FINALIZED status from its children and then asserts a new fund for that period is rejected with ERR_FUND_PERIOD_FINALIZED."

      - name: fund_pool_empty_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_FUND_POOL_EMPTY]"
          - "validations[priority 78]"
        excluded_because:
          difficulty_instance: fund_candidate_pool_empty_at_one_minute_above_watch_floor
          rationale: "That instance sets min_watch_time_minutes one minute above the only candidate's watch time and asserts allocate answers ERR_FUND_POOL_EMPTY."

      - name: investigation_window_overlap_has_a_trigger
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_INVESTIGATION_WINDOW_OVERLAP]"
          - "validations[priority 70]"
        excluded_because:
          difficulty_instance: investigation_closed_interval_collides_on_touch_and_releases_on_clear
          rationale: "That instance opens a second investigation touching the first window at a single instant and asserts ERR_INVESTIGATION_WINDOW_OVERLAP, then shows the collision disappears once the first is cleared."

  - section: rbac
    instances:
      - name: auditor_mutation_is_403_before_the_404
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[Auditor].scoping"
          - "validations[priority 4]"
          - "validations[priority 10]"
        distinguishing_aspect: "An Auditor probing a payout id that does not exist receives 403 ERR_ROLE_NOT_PERMITTED, not 404 ERR_PAYOUT_NOT_FOUND, so the role gate at priority 4 runs before path resolution at 10 and the read-only role cannot enumerate ids by error code."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /monetization/payouts/00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: Auditor
              as_user_id: "aud_1"
            - call: "POST /monetization/creators"
              payload: { display_name: "Auditor's Creator", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: Auditor
              as_user_id: "aud_1"
          assert:
            - "first trigger: HTTP status == 403 and error.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "second trigger: HTTP status == 403 and error.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /monetization/creators as Auditor: total_count == 0"

      - name: auditor_can_read_every_collection_including_ledger_and_allocations
        claim_type: role_can_perform_own_operations
        grounds:
          - "roles[Auditor].shared_operations"
          - "endpoints[GET /monetization/creator-funds/{fund_id}/fund-allocations]"
        distinguishing_aspect: "The Auditor's read surface includes the two money-detail reads that PolicyReviewer is denied, so ledger-entries and fund-allocations both answer 200 for an Auditor."
        test_recipe:
          setup: ["Two ELIGIBLE creators; one OPEN period; a 104000-cent PRO_RATA fund allocated and disbursed, so both ledger and allocation rows exist."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Top Creator", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 800000 }
