  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: restaurant_capacity_half_open_windows_touch_at_1230_without_overlapping
        grounds:
          - validations[priority=21]
          - entities.Restaurant.fields.max_concurrent_group_deliveries
          - entities.GroupOrder.fields.window_start
          - errors.ERR_RESTAURANT_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Restaurant occupancy uses HALF-OPEN windows: with max_concurrent_group_deliveries 1, a
          12:30-13:00 group order submits alongside an already-SUBMITTED 12:00-12:30 one because the
          intervals only touch, while a 12:15-12:45 group order intersects both and is refused. All
          three deliver to different docks so the dock rule at priority 20 cannot be the cause.
        test_recipe:
          setup:
            - "Clock at 2026-08-04T10:00:00Z. Program / Engineering / Thai Garden with max_concurrent_group_deliveries 1."
            - "Three docks: HQ Lobby (0,0), Annex Dock (1,1) and West Dock (2,0), each with dock_buffer_minutes 15; all are within 8.0 km of Thai Garden at (3,4)."
            - "Ada, Ben and Cleo each hold an OPEN 2026-08 period and each organises one group order with themselves as sole member (one 1000-cent line), then locks it: G1 12:00-12:30 at HQ Lobby, G2 12:30-13:00 at Annex Dock, G3 12:15-12:45 at West Dock, all with cutoff 11:00Z."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-04T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
