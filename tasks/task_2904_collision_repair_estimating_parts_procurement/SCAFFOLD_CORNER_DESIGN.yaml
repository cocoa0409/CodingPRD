              payload: { part_number: "REM-9051", part_description: "Reman module", part_type: "RECONDITIONED", list_price_cents: 8000, qty: 1 }
              as: PartsManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with data.error_id == ERR_PART_TYPE_NOT_ALLOWED_BY_INSURER"
            - "GET /parts-lines?estimate_line_id=${el1} returns total_count 0 - the refused line was never created"
            - "the same call with part_type AFTERMARKET and oem_upgrade true returns HTTP 422 ERR_OEM_UPGRADE_NOT_APPLICABLE - the flag belongs to OEM lines only"
            - "part_type OEM with oem_upgrade true also returns ERR_OEM_UPGRADE_NOT_APPLICABLE, because a 2024 vehicle at the 2026 clock is younger than the 5-year alternate-parts age"
            - "part_type AFTERMARKET without the flag is accepted and lands with authorization_status PENDING_CONSENT, which drives RepairOrder.${ro_id}.authorization_posture to CONSENT_REQUIRED"

