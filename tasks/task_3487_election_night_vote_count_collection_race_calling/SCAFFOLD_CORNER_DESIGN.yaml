            - "reported_precincts == 5 and expected_precincts_total == 15 (10 + 5 linked)"
            - "candidate_totals contains ${cand_w}: 4000 and ${cand_t}: 3000"
            - "total_votes == 7000, margin_pct == 0.142857 (1000/7000 at 6dp)"
            - "outstanding_detail has one entry per linked county"

