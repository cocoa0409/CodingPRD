            - { call: "GET /forestry/sales/${sa_id}", payload: {}, as: Buyer, as_user_id: "${b2_id}", captures: { sa_v_fresh: "$.data.version" } }
            - { call: "POST /forestry/sales/${sa_id}/bids", payload: { expected_sale_version: "${sa_v_fresh}", deposit_cents: 60000, lump_sum_amount_cents: 8100000 }, as: Buyer, as_user_id: "${b2_id}", captures: { bid2_id: "$.data.id" } }
          assert:
            - "${err} == ERR_STALE_VERSION (sale version advanced by buyer1's bid)"
            - "Bid.${bid2_id}.status == SUBMITTED after fresh-version retry"

      - name: occ_stale_certify_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[cruise-certify-stale-stand]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Certifying cruise B against the stand version captured before cruise A's certification is rejected 412 ERR_STALE_VERSION; retrying with the fresh version certifies B and supersedes A."
        test_recipe:
          setup: ["stand at version 1; cruise A CERTIFIED (stand now version 2); cruise B RECONCILED"]
          setup_api_calls:
            - { call: "POST /forestry/foresters", payload: { license_no: "F-100", full_name: "Francis Forester", email: "f@x.com" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /forestry/landowners", payload: { full_name: "Lara Landowner", email: "l@x.com", tax_id: "T-1" }, as: PlatformAdmin, captures: { lo_id: "$.data.id" } }
