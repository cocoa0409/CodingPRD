  - rule_id: compensating_invariant
    instances:
      - name: reclassify_pair_conserves_census
        grounds:
          - calculations.contributing_census
          - concurrency_rules[reclassify-stale-property]
        distinguishing_aspect: |
          Conserved quantity = district contributing census: the pair
          (reclassify CONTRIBUTING -> NON_CONTRIBUTING, reclassify back) must
          leave HistoricDistrict.contributing_count and preservation_posture
          exactly as before, with each step guarded by a fresh OCC version.
          The companion instance conserves a different quantity (meeting
          agenda occupancy).
        test_recipe:
          setup:
            - "District with a single CONTRIBUTING property (census 1/1, posture STABLE)"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
            - call: "POST /preservation/owners"
              payload: { full_name: "Quinn Owner", email: "quinn@x.com", mailing_address: "17 Main St" }
              as: PreservationStaff
              captures: { o_id: $.data.id }
            - call: "POST /preservation/properties"
              payload: { address: "60 Beech", parcel_number: "P-1500", district_id: "${d_id}", owner_id: "${o_id}", contributing_status: "CONTRIBUTING", construction_year: 1905, assessed_value_cents: 7000000 }
              as: PreservationStaff
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /preservation/properties/${p_id}/reclassify"
              payload: { contributing_status: "NON_CONTRIBUTING", expected_property_version: "${p_v}" }
              as: PreservationStaff
              captures: { p_v2: $.data.version }
            - call: "GET /preservation/districts/${d_id}"
              payload: {}
              as: PreservationStaff
              captures: { mid_count: $.data.contributing_count, mid_posture: $.data.preservation_posture }
            - call: "POST /preservation/properties/${p_id}/reclassify"
              payload: { contributing_status: "CONTRIBUTING", expected_property_version: "${p_v2}" }
              as: PreservationStaff
            - call: "GET /preservation/districts/${d_id}"
              payload: {}
              as: PreservationStaff
              captures: { end_count: $.data.contributing_count, end_posture: $.data.preservation_posture }
          assert:
            - "after forward step: contributing_count == 0 and preservation_posture == AT_RISK (0*2 < 1)"
            - "after compensating step: contributing_count == 1 and preservation_posture == STABLE (exactly the pre-pair values)"
            - "total_inventory_count == 1 throughout (reclassification never touches the denominator)"

      - name: schedule_continue_pair_conserves_agenda
        grounds:
          - state_machines.Hearing.SCHEDULED_to_CONTINUED
          - entities.CommissionMeeting.fields.scheduled_hearing_count
        distinguishing_aspect: |
          Conserved quantity = meeting agenda occupancy: the pair (schedule
          hearing, continue hearing) must leave
          CommissionMeeting.scheduled_hearing_count unchanged at 0. The
          companion instance conserves a different quantity (district
          contributing census).
        test_recipe:
          setup:
            - "COMMISSION-track application ACCEPTED; meeting capacity 2 at 2026-09-01"
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "Old Town", boundary_description: "Blocks 1-9", significance_tier: "LOCAL" }
              as: PreservationStaff
              captures: { d_id: $.data.id }
