scenario: "Contracted Delivery Route Service Provider Settlement (FedEx Ground): route acquisition by independent service providers with contiguous service area assignments and negotiated agreements, weekly settlement computed from stop counts, package volume, fuel and accessorial components with deductions, provider obligations for vehicle branding, driver qualification, insurance and safety standards, peak season volume surges with temporary vehicle and driver additions, performance measurement on service, safety and customer experience affecting agreement renewal, provider transfer and sale of a service area with company approval, charge-back for damages, missed pickups and equipment, dispute resolution over settlement calculations"

domain_name: "route-service-provider-settlement"
api_prefix: "/route-settlement"
complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Multi-party negotiation"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "rate_threshold_triggers"
  entity_topology: "hybrid"
  state_machine_shape: "compound"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "self_referential"
    - "cross_aggregate"
  role_model: "delegated_authority"
  consistency_model: "saga"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceProvider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the independent service provider entity."
        constraints: "non-empty"
      - name: provider_type
        type: enum
        source: input
        description: "Whether the provider is the contracted operator of its service areas or an approved successor acquirer."
        constraints: "AGREED | SUCCESSOR"
        default: "AGREED"
      - name: tax_id
        type: string
        source: input
        description: "Taxpayer identifier used on settlement statements."
        constraints: "unique across ServiceProvider rows"
      - name: brand_compliance_pct
        type: number
        source: computed
        description: "Derived fleet branding compliance percentage across the provider's ACTIVE non-temporary vehicles; recomputed by the owned_vehicle_count_reconciliation calculation."
      - name: qualification_pct
        type: number
        source: computed
        description: "Derived driver qualification percentage across the provider's ACTIVE non-temporary roster; recomputed by the owned_driver_count_reconciliation calculation."
        default: 100.0
      - name: safety_index
        type: number
        source: computed
        description: "Derived provider safety score in [0.00, 100.00] propagated by the safety_index_propagation cascade; authoritative input to the provider_renewal_recommendation and metrics-driven settlement variants."
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Conserved running total of released settlement net amounts; source-of-truth for the settlement_conservation_invariant."
      - name: chargeback_outstanding_cents
        type: integer
        source: computed
        description: "Sum of CHARGEBACK deductions on RECONCILED and RELEASED settlements not yet offset by a reduction."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Provider lifecycle state; gates one-step approval of successor acquisitions."
        constraints: "UNDER_REVIEW | APPROVED | SUSPENDED"
        default: "UNDER_REVIEW"

  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - name: area_code
        type: string
        source: input
        description: "Contiguous service area identifier (e.g. terminal letter-route)."
        constraints: "unique across non-ARCHIVED ServiceArea rows"
      - name: state_code
        type: string
        source: input
        description: "Two-letter state in which the contiguous territory sits; basis of the fuel_region component and the resource temporal-overlap rule."
        constraints: "2 uppercase letters"
      - name: zip_prefix_low
        type: string
        source: input
        description: "Low end of the contiguous ZIP range covered by this area."
        constraints: "3 digits"
      - name: zip_prefix_high
        type: string
        source: input
        description: "High end of the contiguous ZIP range covered by this area; must be >= zip_prefix_low."
        constraints: "3 digits"
      - name: stop_capacity_weekly
        type: integer
        source: input
        description: "Planned weekly stop capacity of the area; basis of the stop_capacity utilization boundary."
        constraints: ">= 1"
      - name: assigned_provider_id
        type: string
        source: computed
        description: "FK -> ServiceProvider.id; the provider currently holding the active route_assignments row for this area (null when no ACTIVE assignment exists)."
      - name: status
        type: enum
        source: system
        description: "Area lifecycle state; ARCHIVED areas stay queryable but reject new assignments."
        constraints: "UNASSIGNED | ASSIGNED | ARCHIVED"
        default: "UNASSIGNED"

  - name: RouteAssignment
    parent: null
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the territory this assignment title covers."
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider holding the assignment when status is ACTIVE."
      - name: acquiring_provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the approved successor named on a PENDING_TRANSFER assignment."
        default: null
      - name: superseded_by_assignment_id
        type: string
        source: computed
        description: "FK -> RouteAssignment.id; self-reference to the assignment that replaced this one when it was TRANSFERRED. Null otherwise."
        default: null
      - name: effective_date
        type: datetime
        source: input
        description: "Date the assignment title takes effect; basis of the assignment temporal-overlap rule."
      - name: transfer_price_cents
        type: integer
        source: input
        description: "Negotiated price for the sale of the route when the assignment is transferred."
        default: 0
      - name: occupancy_ends_at
        type: datetime
        source: system
        description: "Instant the assignment's occupancy interval closed; null while the assignment is DRAFT, ACTIVE or PENDING_TRANSFER, and set to the logical clock when it becomes TRANSFERRED or TERMINATED. The occupancy interval is [effective_date, occupancy_ends_at) when set and [effective_date, +inf) otherwise."
        default: null
      - name: compliance_failures_count
        type: integer
        source: system
        description: "Count of driver-qualification failures observed on the most recent POST /route-assignments/{id}/reaffirm; incremented by driver_qualification_compliance."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state; the PENDING_TRANSFER round-trip drives the cyclic negotiation machine."
        constraints: "DRAFT | ACTIVE | PENDING_TRANSFER | TRANSFERRED | TERMINATED"
        default: "DRAFT"

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider this negotiated agreement binds."
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the territory governed by this agreement."
      - name: base_rate_cents_per_stop
        type: integer
        source: input
        description: "Negotiated base compensation per stop; the tiered-rate floor of the gross settlement calculation."
        constraints: ">= 0"
      - name: package_rate_cents
        type: integer
        source: input
        description: "Negotiated compensation per package handled."
        constraints: ">= 0"
      - name: peak_surcharge_cents
        type: integer
        source: input
        description: "Negotiated per-stop surcharge applied during declared peak weeks."
        constraints: ">= 0"
      - name: insurance_coverage_cents
        type: integer
        source: input
        description: "Contracted minimum auto liability coverage; the insurance floor of the insurance_compliance invariant."
        constraints: ">= 0"
      - name: negotiated_by
        type: string
        source: input
        description: "X-User-ID of the AccountManager who ran the negotiation rounds recorded on this agreement."
      - name: renewal_due_at
        type: datetime
        source: computed
        description: "Stamped when the agreement is signed: activation time plus the 365-day renewal term. Source of the negotiation_round_boundary temporal rule."
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle state; approximation variants of the settlement depend on the RE_NEGOTIATION branch."
        constraints: "DRAFT | PENDING_REVIEW | RE_NEGOTIATION | ACTIVE | EXPIRED | TERMINATED"
        default: "DRAFT"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider whose fleet this vehicle belongs to."
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the territory this vehicle is permitted to run."
      - name: vehicle_class
        type: enum
        source: input
        description: "Gross vehicle weight class; STEP_VAN is refused on a service area whose stop_capacity_weekly exceeds STEP_VAN_STOP_CEILING = 1500, while BOX_TRUCK and TRACTOR_TRAILER are accepted on every area. Drives the vehicle_class_eligibility selector and the maintenance reserve constant."
        constraints: "STEP_VAN | BOX_TRUCK | TRACTOR_TRAILER"
      - name: gvwr_pounds
        type: integer
        source: input
        description: "Gross vehicle weight rating; floor for the tractor-trailer eligibility tier."
        constraints: ">= 1"
      - name: is_temporary
        type: boolean
        source: input
        description: "True when added under a peak-season temporary-vehicle authorization; temporary vehicles are not counted in the tank capacity boundary."
        default: false
      - name: branding_compliance
        type: enum
        source: input
        description: "Provider branding obligation outcome; FAILED vehicles surface as ERR_BRANDING_NONCOMPLIANT."
        constraints: "PASSED | FAILED"
        default: "PASSED"
      - name: status
        type: enum
        source: system
        description: "Fleet lifecycle state; only ACTIVE vehicles feed provider brand_compliance_pct."
        constraints: "PENDING | ACTIVE | DECOMMISSIONED"
        default: "PENDING"

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider that employs or contracts this driver."
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the territory this driver is qualified to serve."
      - name: full_name
        type: string
        source: input
        description: "Driver name of record."
      - name: license_class
        type: enum
        source: input
        description: "Commercial license class held; the license_class_eligibility selector reads this field."
        constraints: "CLASS_C | CLASS_B | CLASS_A"
      - name: qualification_status
        type: enum
        source: input
        description: "Driver qualification outcome against the qualification matrix."
        constraints: "QUALIFIED | UNQUALIFIED"
        default: "UNQUALIFIED"
      - name: is_temporary
        type: boolean
        source: input
        description: "True when hired under a peak-season temporary-driver authorization; temporary drivers are not counted in the driver roster boundary."
        default: false
      - name: duty_window_starts_at
        type: datetime
        source: input
        description: "Start of the most recent recorded duty interval; basis of the guard-buffered driver duty overlap rule."
        default: null
      - name: duty_window_ends_at
        type: datetime
        source: input
        description: "End of the most recent recorded duty interval; a candidate duty interval is refused when it falls inside the inclusive 1-minute guard buffer after this instant."
        default: null
      - name: status
        type: enum
        source: system
        description: "Driver lifecycle state; transitions to SUSPENDED on the worst finding of a safety observation."
        constraints: "PENDING | ACTIVE | SUSPENDED | TERMINATED"
        default: "PENDING"

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider insured under this policy."
      - name: policy_type
        type: enum
        source: input
        description: "Coverage line; only AUTO_LIABILITY participates in the insurance_compliance invariant."
        constraints: "AUTO_LIABILITY | CARGO | GENERAL_LIABILITY"
      - name: coverage_cents
        type: integer
        source: input
        description: "Per-occurrence coverage limit; compared against the governing Agreement.insurance_coverage_cents floor."
        constraints: ">= 0"
      - name: expires_at
        type: datetime
        source: input
        description: "Policy expiry instant; evaluated against the logical clock for the insurance expiry gate."
      - name: verified_by
        type: string
        source: input
        description: "X-User-ID of the ComplianceOfficer who verified the certificate."
        default: null
      - name: status
        type: enum
        source: system
        description: "Policy lifecycle state; EXPIRED policies stop satisfying the insurance invariant."
        constraints: "SUBMITTED | VERIFIED | EXPIRED | REJECTED"
        default: "SUBMITTED"

  - name: SettlementPeriod
    parent: null
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider settled for this week."
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the territory settled for this week."
      - name: week_start_at
        type: datetime
        source: input
        description: "Monday 00:00Z opening the half-open [week_start_at, week_start_at + 7 days) settlement week."
      - name: is_peak_week
        type: boolean
        source: input
        description: "True when the week falls inside a declared peak season; applies Agreement.peak_surcharge_cents."
        default: false
      - name: fuel_rate_cents_per_mile
        type: integer
        source: input
        description: "Fuel index rate in effect at the close of the settlement week; read by the gross settlement calculation."
        constraints: ">= 0"
      - name: base_gross_cents
        type: computed
        description: "Derived gross compensation before deductions; sum of the non-CHARGEBACK deduction segments plus net_amount_cents."
      - name: net_amount_cents
        type: computed
        description: "Derived payout; recomputed by both the gross_settlement_calculation and its variants."
      - name: performance_multiplier
        type: number
        source: computed
        description: "Tiered performance multiplier in {0.90, 1.00, 1.05} selected by the metrics-driven settlement variant."
        default: 1.0
      - name: status
        type: enum
        source: system
        description: "Settlement lifecycle state; the RELEASED release is the sole mutation of ServiceProvider.lifetime_paid_cents."
        constraints: "OPEN | ACCRUAL_CLOSED | RECONCILED | DISPUTED | RELEASED"
        default: "OPEN"

  - name: StopObservation
    parent: SettlementPeriod
    common_fields: false
    fields:
      - name: settlement_period_id
        type: string
        source: input
        description: "FK -> SettlementPeriod.id; the week this observation accrues into."
      - name: observed_date
        type: datetime
        source: input
        description: "Service date of the observation; recorded_at may lag this instant (late accrual)."
      - name: recorded_at
        type: datetime
        source: input
        description: "Instant the observation was posted; governs half-open settlement-week window membership."
      - name: stops_count
        type: integer
        source: input
        description: "Stops served."
        constraints: ">= 0"
      - name: packages_count
        type: integer
        source: input
        description: "Packages handled."
        constraints: ">= 0"
      - name: miles_driven
        type: integer
        source: input
        description: "Miles driven on the route for this observation."
        constraints: ">= 0"
      - name: accessorial_cents
        type: integer
        source: input
        description: "Accessorial charges for this observation (liftgate, oversize, signature)."
        constraints: ">= 0"

  - name: SettlementDeduction
    parent: SettlementPeriod
    common_fields: false
    fields:
      - name: settlement_period_id
        type: string
        source: input
        description: "FK -> SettlementPeriod.id; the week this deduction reduces."
      - name: deduction_type
        type: enum
        source: input
        description: "Which deduction segment this row contributes to."
        constraints: "FUEL | MAINTENANCE | ACCESSORIAL | CHARGEBACK"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross amount of the deduction before the segment cap and performance multiplier."
        constraints: ">= 0"
      - name: chargeback_category
        type: enum
        source: input
        description: "Charge-back classification; required when deduction_type is CHARGEBACK."
        constraints: "DAMAGE | MISSED_PICKUP | EQUIPMENT | null"
        default: null
      - name: performance_factor_eligible
        type: boolean
        source: input
        description: "True when the deduction responds to the performance multiplier; false for fixed government fuel-index and charge-back segments."
        default: true

  - name: PerformanceMetric
    parent: ServiceProvider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider measured by this scorecard."
      - name: service_score
        type: number
        source: input
        description: "Service score in [0.00, 100.00]; drives the metrics-driven settlement multiplier tier."
        constraints: "[0.00, 100.00]"
      - name: safety_score
        type: number
        source: input
        description: "Safety score in [0.00, 100.00]; drives the safety propagation cascade and agreement ACTIVE-to-SUSPENDED branching."
        constraints: "[0.00, 100.00]"
      - name: customer_experience_score
        type: number
        source: input
        description: "Customer experience score in [0.00, 100.00]."
        constraints: "[0.00, 100.00]"
      - name: composite_score
        type: number
        source: computed
        description: "Derived weighted composite in [0.00, 100.00]; floor is the max(65.00, prior composite - 5.00) under the contagion layer, ceiling 100.00."
      - name: renewal_recommendation
        type: enum
        source: computed
        description: "Derived renewal disposition consuming Agreement.renewal_due_at and the terminal ServiceProvider safety index."
        constraints: "RENEW | CONDITIONAL | DO_NOT_RENEW"

  - name: ChargebackClaim
    parent: ServiceProvider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> ServiceProvider.id; the provider against whom the charge-back is asserted."
      - name: settlement_period_id
        type: string
        source: input
        description: "FK -> SettlementPeriod.id; the week the charge-back is applied to."
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; equipment involved in the claim (null for missed pickups)."
        default: null
      - name: claim_type
        type: enum
        source: input
        description: "Charge-back classification; MISSED_PICKUP and EQUIPMENT claims reject when a not-yet-picked-up observation remains on the week's route."
        constraints: "DAMAGE | MISSED_PICKUP | EQUIPMENT"
      - name: amount_cents
        type: integer
        source: input
        description: "Asserted charge-back amount."
        constraints: ">= 1"
      - name: net_of_recovery_cents
        type: integer
        source: computed
        description: "Derived amount charged after the salvage recovery rate is applied and the pre-charge-back service area score is recomputed."
      - name: recovery_rate_pct
        type: number
        source: input
        description: "Salvage recovery percentage applied to the asserted amount."
        default: 0
        constraints: "[0, 100]"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle state; REJECTED and SETTLED are terminal."
        constraints: "FILED | APPROVED | REJECTED | SETTLED"
        default: "FILED"

  - name: Dispute
    parent: SettlementPeriod
    common_fields: false
    fields:
      - name: settlement_period_id
        type: string
        source: input
        description: "FK -> SettlementPeriod.id; the week whose arithmetic is contested."
      - name: filed_by_role
        type: string
        source: input
        description: "X-User-Role that opened the dispute; ServiceProvider disputes require the provider to be named on the settlement scope."
      - name: disputed_amount_cents
        type: integer
        source: input
        description: "Net amount the filer asserts is owed."
        constraints: ">= 0"
      - name: reason_code
        type: enum
        source: input
        description: "Contest classification."
        constraints: "STOP_COUNT | FUEL_RATE | ACCESSORIAL | DEDUCTION | CHARGEBACK"
      - name: rounds_used
        type: integer
        source: system
        description: "Count of consecutive counter-offers on this dispute; a third RECOUNTER is refused."
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: "Instant the dispute was filed against the logical clock."
      - name: expires_at
        type: datetime
        source: system
        description: "opened_at plus 90 days; a still-open DISPUTED week past this instant is refused by the release gate."
      - name: status
        type: enum
        source: system
        description: "Dispute lifecycle state; the DISPUTED to COUNTERED to ESCALATED loop drives the cyclic negotiation machine."
        constraints: "OPEN | EVIDENCE_SUBMITTED | COUNTERED | ESCALATED | RESOLVED | WITHDRAWN"
        default: "OPEN"

  - name: PeakSeasonDeclaration
    parent: null
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the territory placed under surge authorization."
      - name: declaration_code
        type: string
        source: input
        description: "Operator-facing code for the declared peak window."
      - name: starts_on
        type: datetime
        source: input
        description: "Inclusive start of the declared surge window."
      - name: ends_on
        type: datetime
        source: input
        description: "Exclusive end of the declared surge window; basis of the peak window boundary rule."
      - name: authorized_vehicles
        type: integer
        source: input
        description: "Number of temporary vehicles approved for the window."
        constraints: ">= 0"
      - name: authorized_drivers
        type: integer
        source: input
        description: "Number of temporary drivers approved for the window."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Declaration lifecycle state; only ACTIVE declarations let temporary assets satisfy qualification gates."
        constraints: "DECLARED | ACTIVE | ENDED | CANCELED"
        default: "DECLARED"

  - name: FuelIndexRate
    parent: null
    common_fields: true
    fields:
      - name: region_state_code
        type: string
        source: input
        description: "Two-letter state the index covers; must equal the settling ServiceArea.state_code."
      - name: effective_on
        type: datetime
        source: input
        description: "First week the rate governs; the index selection is the latest effective_on not after the prior day's end."
      - name: rate_cents_per_mile
        type: integer
        source: input
        description: "Published fuel index rate."
        constraints: ">= 0"
      - name: published_by
        type: string
        source: input
        description: "X-User-ID of the PlatformAdmin who published the index row."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RouteAssignment
    initial_state: DRAFT
    terminal_states: [TRANSFERRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /route-assignments/{id}/activate"
        actor: AccountManager
        preconditions:
          - "the governing Agreement for RouteAssignment.service_area_id is in state ACTIVE"
          - "ServiceArea.status IN {UNASSIGNED}"
          - "no other RouteAssignment on the same service_area_id has status IN {ACTIVE, PENDING_TRANSFER}"
          - "no other RouteAssignment on the same service_area_id with status IN {ACTIVE, PENDING_TRANSFER} has an occupancy interval overlapping [RouteAssignment.effective_date, +inf) (independent ServiceArea ON /provider/suspend gate)"
          - "the acquiring ServiceProvider.status IN {UNDER_REVIEW, APPROVED}"
          - "all Vehicle rows with service_area_id == ServiceArea.id and is_temporary == false have branding_compliance == PASSED"
        side_effects:
          - "ServiceArea.status := ASSIGNED"
          - "ServiceArea.assigned_provider_id := RouteAssignment.provider_id"
          - "recompute the owned_vehicle_count_reconciliation calculation output Vehicle.status for the provider's fleet"
          - "recompute the owned_driver_count_reconciliation calculation output Driver.status for the provider's roster"
          - "increment RouteAssignment.version by 1 and refresh updated_at"
        note: "Fork A of the assignment fork-join; the composed gate path is Provider ON then ServiceArea ON."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /route-assignments/{id}/terminate"
        actor: AccountManager
        preconditions:
          - "no SettlementPeriod with service_area_id == RouteAssignment.service_area_id has status IN {DISPUTED}"
        side_effects:
          - "ServiceArea.status := UNASSIGNED"
          - "ServiceArea.assigned_provider_id := null"
          - "Agreement.status := TERMINATED for the agreement governing this service_area_id"
          - "increment RouteAssignment.version by 1 and refresh updated_at"

      - from: ACTIVE
        to: PENDING_TRANSFER
        trigger: "POST /route-assignments/{id}/request-transfer"
        actor: ServiceProvider
        preconditions:
          - "ServiceProvider.chargeback_outstanding_cents == 0 for the transferring provider"
          - "every InsurancePolicy of the transferring provider with policy_type == AUTO_LIABILITY has status IN {SUBMITTED, VERIFIED} and coverage_cents >= the governing Agreement.insurance_coverage_cents"
          - "the acquiring ServiceProvider is in state APPROVED"
        side_effects:
          - "Agreement.status := RE_NEGOTIATION for the agreement governing this service_area_id"
          - "increment RouteAssignment.version by 1 and refresh updated_at"

      - from: PENDING_TRANSFER
        to: TRANSFERRED
        trigger: "POST /route-assignments/{id}/approve-transfer"
        actor: AccountManager
        preconditions:
          - "the acquiring ServiceProvider is in state APPROVED"
        side_effects:
          - "ServiceArea.assigned_provider_id := RouteAssignment.acquiring_provider_id"
          - "RouteAssignment.status := TRANSFERRED and its version is incremented by 1"
          - "create a new RouteAssignment with status DRAFT, provider_id == the transferring RouteAssignment.acquiring_provider_id, effective_date == the transferring RouteAssignment.effective_date + 1 day, transfer_price_cents == the transferring RouteAssignment.transfer_price_cents, and superseded_by_assignment_id == null | the new assignment initializes at DRAFT and increments ServiceArea.version by 1"
          - "the new RouteAssignment's created event sets the transferring RouteAssignment.superseded_by_assignment_id := the new RouteAssignment.id"
          - "recompute ServiceProvider.brand_compliance_pct for the transferring provider via the owned_vehicle_count_reconciliation calculation"
          - "increment RouteAssignment.version by 1 and refresh updated_at"

      - from: PENDING_TRANSFER
        to: ACTIVE
        trigger: "POST /route-assignments/{id}/withdraw-transfer"
        actor: ServiceProvider
        preconditions: []
        side_effects:
          - "Agreement.status := ACTIVE for the agreement governing this service_area_id"
          - "increment RouteAssignment.version by 1 and refresh updated_at"
        note: "Cycle back-edge: PENDING_TRANSFER -> ACTIVE -> PENDING_TRANSFER is legal any number of times."

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /route-assignments/{id}/reaffirm"
        actor: AccountManager
        preconditions:
          - "the governing Agreement is in state ACTIVE"
          - "every Vehicle row with service_area_id == ServiceArea.id and is_temporary == false has branding_compliance == PASSED"
          - "Driver.qualification_status == QUALIFIED for every Driver with service_area_id == ServiceArea.id and is_temporary == false"
        side_effects:
          - "increment RouteAssignment.version by 1 and refresh updated_at"
          - "recompute the driver_qualification_compliance calculation output and write it to RouteAssignment.compliance_failures_count"
        note: "Self-loop closed cycle of length 1 — the guard-driven correction round trip. A failed re-check does NOT block the transition; it increments RouteAssignment.compliance_failures_count."

  - entity: Agreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /agreements/{id}/submit"
        actor: ServiceProvider
        preconditions:
          - "Agreement.base_rate_cents_per_stop >= 1"
          - "Agreement.package_rate_cents >= 1"
          - "Agreement.insurance_coverage_cents >= 500000"
        side_effects:
          - "increment Agreement.version by 1 and refresh updated_at"

      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: "POST /agreements/{id}/sign"
        actor: AccountManager
        preconditions:
          - "Agreement.negotiated_by is set to the X-User-ID signing the agreement"
          - "every driver with service_area_id == Agreement.service_area_id reports qualification_status == QUALIFIED"
          - "every InsurancePolicy of Agreement.provider_id with policy_type == AUTO_LIABILITY has coverage_cents >= Agreement.insurance_coverage_cents and expires_at > now"
        side_effects:
          - "Agreement.status := ACTIVE; Agreement.negotiated_by := the signed X-User-ID"
          - "Agreement.renewal_due_at := Agreement.activated_at + 365 days"
          - "all Vehicle rows with service_area_id == Agreement.service_area_id become eligible for the ACTIVE brand compliance requirement"
          - "increment Agreement.version by 1 and refresh updated_at"

      - from: PENDING_REVIEW
        to: RE_NEGOTIATION
        trigger: "POST /agreements/{id}/renegotiate"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "increment Agreement.version by 1 and refresh updated_at"

      - from: RE_NEGOTIATION
        to: PENDING_REVIEW
        trigger: "POST /agreements/{id}/submit"
        actor: ServiceProvider
        preconditions:
          - "Agreement.base_rate_cents_per_stop >= 1"
        side_effects:
          - "increment Agreement.version by 1 and refresh updated_at"
        note: "Back-edge of the renegotiation cycle."

      - from: RE_NEGOTIATION
        to: TERMINATED
        trigger: "POST /agreements/{id}/terminate"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "every RouteAssignment with service_area_id == Agreement.service_area_id and status IN {DRAFT} is set to TERMINATED"
          - "increment Agreement.version by 1 and refresh updated_at"

      - from: ACTIVE
        to: RE_NEGOTIATION
        trigger: "POST /agreements/{id}/renegotiate"
        actor: AccountManager
        preconditions:
          - "Agreement.renewal_due_at - now <= 30 days"
        side_effects:
          - "increment Agreement.version by 1 and refresh updated_at"
        note: "Negotiation round boundary: refused while more than 30 days remain before renewal_due_at."

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /agreements/{id}/expire"
        actor: AccountManager
        preconditions:
          - "now >= Agreement.renewal_due_at"
        side_effects:
          - "every RouteAssignment with service_area_id == Agreement.service_area_id and status IN {ACTIVE} is set to TERMINATED"
          - "ServiceArea.status := UNASSIGNED and ServiceArea.assigned_provider_id := null for Agreement.service_area_id"
          - "increment Agreement.version by 1 and refresh updated_at"

      - from: ACTIVE
        to: PENDING_REVIEW
        trigger: "POST /agreements/{id}/amend"
        actor: AccountManager
        preconditions:
          - "Agreement.renewal_due_at - now > 30 days"
        side_effects:
          - "increment Agreement.version by 1 and refresh updated_at"
        note: "Second back-edge; combined with the RE_NEGOTIATION branch this makes the machine non-linear on a second entity."

  - entity: SettlementPeriod
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: ACCRUAL_CLOSED
        trigger: "POST /settlement-periods/{id}/close-accrual"
        actor: SettlementAnalyst
        preconditions:
          - "now > SettlementPeriod.week_start_at + 7 days"
        side_effects:
          - "every StopObservation whose recorded_at falls in [week_start_at, week_start_at + 7 days) is frozen; later-recorded observations are ignored by the accrual window"
          - "recompute the gross_settlement_calculation and write SettlementPeriod.base_gross_cents and SettlementPeriod.net_amount_cents"
          - "increment SettlementPeriod.version by 1 and refresh updated_at"

      - from: ACCRUAL_CLOSED
        to: RECONCILED
        trigger: "POST /settlement-periods/{id}/reconcile"
        actor: SettlementAnalyst
        preconditions:
          - "SettlementPeriod.base_gross_cents - SettlementPeriod.net_amount_cents == sum of all non-CHARGEBACK SettlementDeduction.amount_cents on this period"
          - "every SettlementDeduction with deduction_type == CHARGEBACK on this period has chargeback_category set to one of DAMAGE, MISSED_PICKUP, EQUIPMENT"
        side_effects:
          - "recompute the deduction_segment_cap calculation and write every SettlementDeduction.amount_cents"
          - "recompute the chargeback_net_recovery calculation and write ChargebackClaim.net_of_recovery_cents for every claim on this period"
          - "recompute ServiceProvider.chargeback_outstanding_cents for SettlementPeriod.provider_id"
          - "recompute the late_accrual_settlement_variant and write SettlementPeriod.net_amount_cents when any StopObservation was recorded more than 3 days after its observed_date"
          - "recompute the metrics_driven_settlement_variant and write SettlementPeriod.performance_multiplier and SettlementPeriod.net_amount_cents"
          - "increment SettlementPeriod.version by 1 and refresh updated_at"

      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /settlement-periods/{id}/dispute"
        actor: ServiceProvider
        preconditions:
          - "SettlementPeriod.provider_id == the X-User-ID of the filing ServiceProvider"
        side_effects:
          - "create a Dispute with status OPEN, opened_at := now, expires_at := now + 90 days, filed_by_role := ServiceProvider, and rounds_used := 0"
          - "increment SettlementPeriod.version by 1 and refresh updated_at"

      - from: RECONCILED
        to: RELEASED
        trigger: "POST /settlement-periods/{id}/release"
        actor: AccountManager
        preconditions:
          - "no Dispute on this period has status IN {OPEN, EVIDENCE_SUBMITTED, COUNTERED, ESCALATED}"
        side_effects:
          - "ServiceProvider.lifetime_paid_cents := ServiceProvider.lifetime_paid_cents + SettlementPeriod.net_amount_cents"
          - "every SettlementDeduction with deduction_type == CHARGEBACK on this period reduces ServiceProvider.chargeback_outstanding_cents by amount_cents"
          - "increment SettlementPeriod.version by 1 and refresh updated_at"

      - from: DISPUTED
        to: RELEASED
        trigger: "POST /settlement-periods/{id}/release"
        actor: AccountManager
        preconditions:
          - "every Dispute on this period has status IN {RESOLVED, WITHDRAWN}"
          - "SettlementPeriod.week_start_at + 7 days + 90 days > now"
        side_effects:
          - "ServiceProvider.lifetime_paid_cents := ServiceProvider.lifetime_paid_cents + SettlementPeriod.net_amount_cents"
          - "every SettlementDeduction with deduction_type == CHARGEBACK on this period reduces ServiceProvider.chargeback_outstanding_cents by amount_cents"
          - "increment SettlementPeriod.version by 1 and refresh updated_at"

      - from: ACCRUAL_CLOSED
        to: ACCRUAL_CLOSED
        trigger: "POST /settlement-periods/{id}/close-accrual"
        actor: SettlementAnalyst
        preconditions: []
        side_effects:
          - "increment SettlementPeriod.version by 1 and refresh updated_at"
        note: "Second occurrence refreshes the derived totals without re-opening the accrual window; observed by the close_accrual_repeat_instance corner."

  - entity: ChargebackClaim
    initial_state: FILED
    terminal_states: [REJECTED, SETTLED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /chargeback-claims/{id}/approve"
        actor: AccountManager
        preconditions:
          - "SettlementPeriod.status IN {OPEN, ACCRUAL_CLOSED, RECONCILED} for ChargebackClaim.settlement_period_id"
          - "ChargebackClaim.vehicle_id resolves to a Vehicle whose service_area_id equals the claim's SettlementPeriod.service_area_id when ChargebackClaim.claim_type == EQUIPMENT"
          - "every StopObservation on the claim's period whose observed_date is on or before the period end has a recorded_at set, when ChargebackClaim.claim_type IN {MISSED_PICKUP, EQUIPMENT}"
        side_effects:
          - "recompute the chargeback_net_recovery calculation and write ChargebackClaim.net_of_recovery_cents"
          - "create a SettlementDeduction with deduction_type CHARGEBACK, chargeback_category := ChargebackClaim.claim_type, amount_cents := ChargebackClaim.net_of_recovery_cents, settlement_period_id := ChargebackClaim.settlement_period_id, and performance_factor_eligible := false"
          - "ChargebackClaim.status := SETTLED"
          - "increment ServiceProvider.chargeback_outstanding_cents by ChargebackClaim.net_of_recovery_cents for ChargebackClaim.provider_id"
          - "recompute ServiceProvider.brand_compliance_pct via the owned_vehicle_count_reconciliation calculation"
          - "increment ChargebackClaim.version by 1 and refresh updated_at"

      - from: APPROVED
        to: SETTLED
        trigger: "POST /chargeback-claims/{id}/settle"
        actor: AccountManager
        preconditions:
          - "ChargebackClaim.net_of_recovery_cents is set"
        side_effects:
          - "increment ChargebackClaim.version by 1 and refresh updated_at"

      - from: FILED
        to: REJECTED
        trigger: "POST /chargeback-claims/{id}/reject"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "increment ChargebackClaim.version by 1 and refresh updated_at"
        note: "Compensating back-edge; a rejected claim restores the pre-charge-back service area score."

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: EVIDENCE_SUBMITTED
        trigger: "POST /disputes/{id}/submit-evidence"
        actor: ServiceProvider
        preconditions: []
        side_effects:
          - "increment Dispute.version by 1 and refresh updated_at"

      - from: EVIDENCE_SUBMITTED
        to: COUNTERED
        trigger: "POST /disputes/{id}/counter"
        actor: SettlementAnalyst
        preconditions:
          - "Dispute.rounds_used <= 1"
        side_effects:
          - "Dispute.rounds_used := Dispute.rounds_used + 1"
          - "increment Dispute.version by 1 and refresh updated_at"
        note: "Round counter: POST /disputes/{id}/counter succeeds while Dispute.rounds_used is below DISPUTE_ROUND_LIMIT = 2, so the third counter-offer is refused by validation priority 29."

      - from: COUNTERED
        to: ESCALATED
        trigger: "POST /disputes/{id}/escalate"
        actor: SettlementAnalyst
        preconditions:
          - "now >= Dispute.opened_at"
        side_effects:
          - "increment Dispute.version by 1 and refresh updated_at"
        note: "Escalation takes the settlement week to DISPUTED, where the release gate switches to the all-resolved clause."

      - from: COUNTERED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /disputes/{id}/resubmit-evidence"
        actor: ServiceProvider
        preconditions:
          - "Dispute.rounds_used <= 1"
        side_effects:
          - "increment Dispute.version by 1 and refresh updated_at"
        note: "Back-edge of the dispute cycle; the same round budget of validation priority 29 gates it."

      - from: EVIDENCE_SUBMITTED
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: SettlementAnalyst
        preconditions: []
        side_effects:
          - "SettlementPeriod.status stays DISPUTED until the release gate runs"
          - "increment Dispute.version by 1 and refresh updated_at"

      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /disputes/{id}/resolve"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "increment Dispute.version by 1 and refresh updated_at"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: ServiceProvider
        preconditions:
          - "Dispute.filed_by_role == ServiceProvider"
        side_effects:
          - "increment Dispute.version by 1 and refresh updated_at"

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: ServiceProvider
        preconditions:
          - "Dispute.filed_by_role == ServiceProvider"
        side_effects:
          - "increment Dispute.version by 1 and refresh updated_at"

  - entity: PeakSeasonDeclaration
    initial_state: DECLARED
    terminal_states: [ENDED, CANCELED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: "POST /peak-season-declarations/{id}/activate"
        actor: AccountManager
        preconditions:
          - "PeakSeasonDeclaration.starts_on <= now < PeakSeasonDeclaration.ends_on"
          - "PeakSeasonDeclaration.authorized_vehicles <= 25"
          - "every ServiceArea row with the same state_code and status IN {UNASSIGNED, ASSIGNED} has no other PeakSeasonDeclaration with status ACTIVE whose [starts_on, ends_on) overlaps this declaration's window (buffer 0 days)"
        side_effects:
          - "temporary Vehicle rows with service_area_id == PeakSeasonDeclaration.service_area_id become eligible for the peak_season_surge_capacity boundary"
          - "increment PeakSeasonDeclaration.version by 1 and refresh updated_at"

      - from: ACTIVE
        to: ENDED
        trigger: "POST /peak-season-declarations/{id}/end"
        actor: AccountManager
        preconditions:
          - "now >= PeakSeasonDeclaration.ends_on"
        side_effects:
          - "every Vehicle with service_area_id == PeakSeasonDeclaration.service_area_id and is_temporary == true is set to DECOMMISSIONED"
          - "every Driver with service_area_id == PeakSeasonDeclaration.service_area_id and is_temporary == true is set to TERMINATED and qualification_status := UNQUALIFIED"
          - "increment PeakSeasonDeclaration.version by 1 and refresh updated_at"

      - from: DECLARED
        to: CANCELED
        trigger: "POST /peak-season-declarations/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "increment PeakSeasonDeclaration.version by 1 and refresh updated_at"

  - entity: ServiceProvider
    initial_state: UNDER_REVIEW
    terminal_states: [SUSPENDED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /service-providers/{id}/approve"
        actor: AccountManager
        preconditions:
          - "every InsurancePolicy of this provider with policy_type == AUTO_LIABILITY has status == VERIFIED and expires_at > now"
          - "every Vehicle of this provider with is_temporary == false has branding_compliance == PASSED"
        side_effects:
          - "ServiceProvider.status := APPROVED"
          - "every Vehicle of this provider with status IN {PENDING} and is_temporary == false is set to ACTIVE"
          - "every Driver of this provider with status IN {PENDING} and qualification_status == QUALIFIED and is_temporary == false is set to ACTIVE"
          - "recompute ServiceProvider.brand_compliance_pct via the owned_vehicle_count_reconciliation calculation"
          - "increment ServiceProvider.version by 1 and refresh updated_at"

      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /service-providers/{id}/reopen-review"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "increment ServiceProvider.version by 1 and refresh updated_at"

      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /service-providers/{id}/suspend"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "every RouteAssignment with provider_id == ServiceProvider.id and status IN {DRAFT, ACTIVE, PENDING_TRANSFER} is set to TERMINATED"
          - "every ServiceArea with assigned_provider_id == ServiceProvider.id is set to status UNASSIGNED and assigned_provider_id := null"
          - "every Agreement with provider_id == ServiceProvider.id and status IN {DRAFT, PENDING_REVIEW, RE_NEGOTIATION, ACTIVE} is set to TERMINATED"
          - "increment ServiceProvider.version by 1 and refresh updated_at"

      - from: APPROVED
        to: APPROVED
        trigger: "system event: POST /performance-metrics/{id}/compose"
        actor: system
        preconditions:
          - "the composing PerformanceMetric.provider_id == ServiceProvider.id"
          - "PerformanceMetric.composite_score < 50.00"
        side_effects:
          - "ServiceProvider.safety_index := PerformanceMetric.safety_score"
          - "ServiceProvider.status := UNDER_REVIEW"
          - "increment ServiceProvider.version by 1 and refresh updated_at"
        note: "Compound/automatic self-loop with a guard: composes a metric whose composite falls below 50.00 and demotes the provider, which in turn cascades to Vehicle and Driver rows."

      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "system event: POST /performance-metrics/{id}/compose"
        actor: system
        preconditions:
          - "the composing PerformanceMetric.provider_id == ServiceProvider.id"
          - "PerformanceMetric.composite_score < 65.00"
        side_effects:
          - "ServiceProvider.safety_index := PerformanceMetric.safety_score"
          - "every RouteAssignment with provider_id == ServiceProvider.id and status IN {DRAFT, ACTIVE, PENDING_TRANSFER} is set to TERMINATED"
          - "every ServiceArea with assigned_provider_id == ServiceProvider.id is set to status UNASSIGNED and assigned_provider_id := null"
          - "every Agreement with provider_id == ServiceProvider.id and status IN {ACTIVE, RE_NEGOTIATION} is set to TERMINATED"
          - "increment ServiceProvider.version by 1 and refresh updated_at"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-area
    parent_entity: ServiceArea
    write_endpoint: "POST /route-settlement/route-assignments"
    occ_field: "expected_service_area_version"
    description: |
      Creating a RouteAssignment against a ServiceArea whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has already replaced the area's assignment
      title (which legitimately supersedes the prior title) and the current
      writer's view of the area is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: periods-create-stale-provider
    parent_entity: ServiceProvider
    write_endpoint: "POST /route-settlement/settlement-periods"
    occ_field: "expected_provider_version"
    description: |
      Opening a SettlementPeriod against a ServiceProvider whose version has
      advanced since the client last observed it is rejected. A release of an
      earlier week legitimately advances the provider's version between the
      client's read and this call, so the create is refused as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transfer-create-stale-area
    parent_entity: ServiceArea
    write_endpoint: "POST /route-settlement/route-assignments/{id}/approve-transfer"
    occ_field: "expected_service_area_version"
    description: |
      Approving a transfer against a ServiceArea whose version has advanced
      since the client last observed it is rejected. The approving client read
      the area before an intervening mutation, so its view of the area is
      stale and the successor title cannot be minted from it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: gross_settlement_calculation
    trigger: "POST /settlement-periods/{id}/close-accrual on an OPEN period, and again on POST /settlement-periods/{id}/reconcile"
    algorithm: tiered_pricing
    formula: |
      # Half-open accrual window, ordered by (recorded_at ASC, created_at ASC)
      observations = StopObservation where settlement_period_id == P.id
                     and recorded_at >= P.week_start_at
                     and recorded_at <  P.week_start_at + 7 days

      # Tiered rate is selected from the high end of the observed stop count.
      tier_stop_count = min(sum(o.stops_count for o in observations), TIER_CEILING)
      # Marginal rate from the cumulative stop-tier table:
      #   stops 1..1000   -> base_rate_cents_per_stop
      #   stops 1001..2500 -> base_rate_cents_per_stop, and stops beyond 1000
      #                       earn base_rate_cents_per_stop + TIER_INCREMENT
      #   stops 2501..     -> stops beyond 2500 earn base_rate_cents_per_stop + 2*TIER_INCREMENT
      # The marginal rate is applied to ALL stops once the high tier is reached
      # (a "cliff" tier, not a marginal-bracket tier). This is the pinned reading.
      if tier_stop_count <= 1000:
          tier_rate = A.base_rate_cents_per_stop
      elif tier_stop_count <= 2500:
          tier_rate = A.base_rate_cents_per_stop + TIER_INCREMENT
      else:
          tier_rate = A.base_rate_cents_per_stop + 2 * TIER_INCREMENT

      stops_gross = tier_stop_count * tier_rate
      package_gross = sum(o.packages_count for o in observations) * A.package_rate_cents
      peak_gross = sum(o.stops_count for o in observations) * A.peak_surcharge_cents
                   if P.is_peak_week else 0
      accessorial_gross = sum(o.accessorial_cents for o in observations)

      # Fuel appears ONLY as a deduction segment; it is deliberately NOT added
      # to base_gross_cents, so the fuel index cannot be double-counted.
      P.base_gross_cents = stops_gross + package_gross + peak_gross
                           + accessorial_gross

      # Deduction segments; CHARGEBACK and non-performance-eligible FUEL rows are
      # applied AFTER the multiplier, everything else BEFORE it.
      pre_multiplier = MAINTENANCE + ACCESSORIAL_DEDUCTION   # capped at DEDUCTION_CAP
      post_multiplier = FUEL + CHARGEBACK                    # uncapped
      gross_fee = round_half_up(pre_multiplier * P.performance_multiplier, 0)
      P.net_amount_cents = P.base_gross_cents - gross_fee - post_multiplier

      # Pinned evaluation order: multiplier is resolved first (it depends only on
      # the provider's PerformanceMetric), then the deduction segments are split,
      # then the pre-multiplier bundle is scaled once and rounded once.
    input_set: "StopObservation rows with settlement_period_id == P.id and recorded_at in the half-open [week_start_at, week_start_at+7d) window; SettlementDeduction rows with settlement_period_id == P.id; the governing Agreement row whose service_area_id and provider_id match P; the PerformanceMetric row with provider_id == P.provider_id"
    constants:
      TIER_INCREMENT: 3
      TIER_CEILING: 4000
      DEDUCTION_CAP: 50000
      PEAK_WINDOW_DAYS: 7
    precision: "integer cents, round_half_up at each round() call; the pre-multiplier bundle is scaled then rounded exactly once"
    ordering_note: "Every order-sensitive fold in this calculation pins created_at ASC as its tie-break. Server-minted UUID id values never participate in ordering, allocation remainders, or side-effect sequencing."
    variants:
      - name: provisional_on_accrual_close
        when: "POST /settlement-periods/{id}/close-accrual"
        difference: "Uses the PERFORMANCE-ADJUSTED deduction bundle and the currently published fuel_rate_cents_per_mile; a week exempted from the multiplier by a §1.4 override returns the higher net_amount_cents."
      - name: final_on_reconcile
        when: "POST /settlement-periods/{id}/reconcile"
        difference: "Re-runs the tiered rate against the frozen accrual window, re-caps the deduction segments, and replaces net_amount_cents with the reconciled figure."
      - name: late_accrual_recut
        when: "POST /settlement-periods/{id}/reconcile when any StopObservation was recorded more than LATE_ACCRUAL_DAYS after its observed_date"
        difference: "Re-buckets each late observation by observed_date rather than recorded_at, so observations recorded after the week closed still move the tier boundary."

  - name: deduction_segment_cap
    trigger: "POST /settlement-periods/{id}/reconcile when the summed non-CHARGEBACK deduction segments exceed DEDUCTION_CAP"
    algorithm: waterfall_allocation
    formula: |
      # Evaluate in a fixed segment order: MAINTENANCE, ACCESSORIAL.
      # The FUEL segment is exempt from the cap (published index, not
      # provider-controlled) and is applied before the capped segments are filled.
      #   MAINTENANCE is filled first, ACCESSORIAL absorbs the remainder.
      # Rounding remainders stay in the last eligible segment; no re-splitting.
      remaining = DEDUCTION_CAP
      for segment in [MAINTENANCE, ACCESSORIAL]:
          want = sum(d.amount_cents for d in deductions
                     where d.deduction_type == segment and d.performance_factor_eligible == true)
          fill = min(want, remaining)
          remaining = remaining - fill
          write_fill(segment_filter(segment), fill)
      # FUEL and CHARGEBACK rows are never capped and are written through unchanged.
    input_set: "SettlementDeduction rows with settlement_period_id == P.id and deduction_type IN {MAINTENANCE, ACCESSORIAL, FUEL, CHARGEBACK}; rows with performance_factor_eligible == false are excluded from the capped segments"
    constants:
      DEDUCTION_CAP: 50000
    precision: "integer cents, exact"
    variants:
      - name: maintenance_first
        when: "every reconcile where the capped segments straddle the cap"
        difference: "MAINTENANCE is filled to its full requested amount before any ACCESSORIAL cents are allocated, so a provider with both segments large loses all ACCESSORIAL first."
      - name: maintenance_deferred
        when: "POST /settlement-periods/{id}/reconcile when the period's Agreement is in state RE_NEGOTIATION or the settling week is a peak week"
        difference: "ACCESSORIAL is filled first and MAINTENANCE absorbs the remainder, so the same input rows yield a different per-segment split while the total deduction is identical."

  - name: chargeback_net_recovery
    trigger: "POST /chargeback-claims/{id}/approve and on POST /settlement-periods/{id}/reconcile"
    algorithm: threshold
    formula: |
      # Salvage recovery is applied to the asserted amount, then a per-provider
      # escalation applies once the provider's cumulative approved charge-backs
      # for the calendar year cross the escalation threshold.
      base_recovery = round_half_up(C.amount_cents * C.recovery_rate_pct / 100, 0)
      net = C.amount_cents - base_recovery
      prior_year_approved = sum(c.net_of_recovery_cents for c in claims
                                where c.provider_id == C.provider_id
                                  and c.status IN {APPROVED, SETTLED}
                                  and c.id != C.id
                                  and calendar_year(c.created_at) == calendar_year(C.created_at))
      if prior_year_approved >= CHARGEBACK_ESCALATION_CENTS:
          net = round_half_up(net * (1 + CHARGEBACK_ESCALATION_PCT / 100), 0)
      C.net_of_recovery_cents = net
    input_set: "ChargebackClaim rows with provider_id == C.provider_id and status IN {APPROVED, SETTLED} in the same calendar year; excluded: claims with status IN {FILED, REJECTED}"
    constants:
      CHARGEBACK_ESCALATION_CENTS: 200000
      CHARGEBACK_ESCALATION_PCT: 10
    precision: "integer cents, round_half_up"
    variants:
      - name: assessed_at_approval
        when: "POST /chargeback-claims/{id}/approve"
        difference: "The escalation test sees only claims already in {APPROVED, SETTLED} before this claim, so the claim that crosses the threshold is charged at the un-escalated amount."
      - name: reassessed_at_reconcile
        when: "POST /settlement-periods/{id}/reconcile"
        difference: "The escalation test re-runs over the same set but including claims that settled during the reconcile pass, so a claim that crossed the threshold is escalated."

  - name: provider_composite_score
    trigger: "POST /performance-metrics/{id}/compose"
    algorithm: weighted_scoring
    formula: |
      raw = round_half_up(PERF_WEIGHT * m.service_score
                          + SAFETY_WEIGHT * m.safety_score
                          + CX_WEIGHT * m.customer_experience_score, 2)
      composite = min(raw, COMPOSITE_CEILING)   # 100.00
      composite = max(composite, COMPOSITE_FLOOR)  # 0.00
      # Contagion floor: this composition may not fall more than MAX_SWING below
      # the provider's prior composite, so a single bad week cannot crater it.
      # Pinned reading: floor = prior - MAX_SWING. The floor binds on the
      # SECOND and later compositions only; a first-ever composition has no prior.
      prior = latest PerformanceMetric.composite_score with provider_id == m.provider_id
              and created_at < m.created_at, ordered by created_at ASC
      if prior is not null:
          composite = max(composite, prior - MAX_SWING)
      m.composite_score = composite
    input_set: "the PerformanceMetric row being composed; the provider's most recent earlier PerformanceMetric row by created_at ASC"
    constants:
      PERF_WEIGHT: 0.5
      SAFETY_WEIGHT: 0.3
      CX_WEIGHT: 0.2
      COMPOSITE_FLOOR: 0.00
      COMPOSITE_CEILING: 100.00
      MAX_SWING: 5.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: delivery_emphasized
        when: "POST /performance-metrics/{id}/compose when the provider's governing Agreement is in state ACTIVE"
        difference: "Weights become performance 0.6 / safety 0.25 / customer experience 0.15, so the same three scores yield a different composite."
      - name: safety_emphasized
        when: "POST /performance-metrics/{id}/compose when the provider's ServiceProvider.status IN {UNDER_REVIEW, SUSPENDED}"
        difference: "Weights become performance 0.4 / safety 0.4 / customer experience 0.2, so the same three scores yield a different composite than the delivery-emphasized reading."

  - name: settlement_performance_multiplier
    trigger: "POST /settlement-periods/{id}/reconcile"
    algorithm: threshold
    formula: |
      # Sub-metric scores are aggregated first, then the tier boundary is tested
      # on the AGGREGATE. Boundary precision is pinned: 85.00 does NOT earn the
      # top tier (strict greater-than), but 85.01 does.
      agg = round_half_up(SERVICE_WEIGHT * m.service_score
                          + SAFETY_WEIGHT * m.safety_score
                          + CX_WEIGHT * m.customer_experience_score, 2)
      if agg > TIER_3_MIN:          # 85.00
          P.performance_multiplier = 1.05
      elif agg >= TIER_2_MIN:       # 75.00
          P.performance_multiplier = 1.00
      elif agg >= TIER_1_MIN:       # 60.00
          P.performance_multiplier = 0.90
      else:
          P.performance_multiplier = 0.90
      # A maintenance-only week is exempt: a period whose StopObservation rows are
      # all zero-stop rows (no_stops_filed) does not receive the multiplier.
    input_set: "the PerformanceMetric row with provider_id == P.provider_id; SettlementPeriod.base_gross_cents as the multiplier base"
    constants:
      SERVICE_WEIGHT: 0.5
      SAFETY_WEIGHT: 0.3
      CX_WEIGHT: 0.2
      TIER_1_MIN: 60.00
      TIER_2_MIN: 75.00
      TIER_3_MIN: 85.00
    precision: "2 decimal places for agg; multiplier to 2 decimals"
    variants:
      - name: default_tiering
        when: "POST /settlement-periods/{id}/reconcile"
        difference: "Aggregate tier test with tier 3 entered only above 85.00."
      - name: exempt_symbol_weight
        when: "POST /settlement-periods/{id}/reconcile when the settling week has zero stops and at least one nonzero accessorial_miles_filed observation"
        difference: "The multiplier is forced to 1.00 and the tier table is skipped, so the same metric scores produce no adjustment."

  - name: provider_renewal_recommendation
    trigger: "GET /agreements/{id}/renewal-recommendation and on POST /agreements/{id}/expire"
    algorithm: aggregation
    formula: |
      # Uses the TERMINAL safety index (the latest ServiceProvider.safety_index),
      # NOT the min..max across the window. That is the pinned reading.
      terminal_safety = latest PerformanceMetric.safety_score for the provider
                        ordered by created_at DESC limit 1
      median_service = median(PerformanceMetric.service_score for the provider
                              within the trailing 4 composed metrics,
                              ordered by created_at ASC)
      if terminal_safety < 60.00:
          recommendation = DO_NOT_RENEW
      elif median_service < 75.00 or terminal_safety < 80.00:
          recommendation = CONDITIONAL
      else:
          recommendation = RENEW
    input_set: "PerformanceMetric rows for the provider; the terminal ServiceProvider.safety_index; Agreement.renewal_due_at and the logical clock"
    constants:
      SAFETY_MIN_RENEW: 80.00
      SAFETY_MIN_CONDITIONAL: 60.00
      SERVICE_MIN_RENEW: 75.00
      TRAILING_WINDOW: 4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: terminal_safety_reading
        when: "GET /agreements/{id}/renewal-recommendation"
        difference: "Reads only the latest safety score, so a provider that improved from 55.00 to 88.00 recommends RENEW."
      - name: worst_window_reading
        when: "GET /agreements/{id}/renewal-recommendation when Agreement.renewal_due_at - now <= 30 days"
        difference: "Reads the minimum safety score inside the trailing 4-metric window, so the same provider recommends CONDITIONAL instead."

  - name: driver_qualification_compliance
    trigger: "POST /route-assignments/{id}/reaffirm and POST /agreements/{id}/sign"
    algorithm: aggregation
    formula: |
      roster = Driver where service_area_id == area.id and is_temporary == false
      if roster is empty:
          compliance_pct = 100.00
          failures = 0
      else:
          failures = count(d in roster where d.qualification_status != QUALIFIED
                           or d.license_class == CLASS_C
                           or d.status IN {SUSPENDED, TERMINATED})
          compliance_pct = round_half_up(
              (count(roster) - failures) / count(roster) * 100, 2)
      write compliance_pct to the assignment's derived roster field and
      write failures to RouteAssignment.compliance_failures_count
    input_set: "Driver rows with service_area_id == area.id and is_temporary == false; temporary drivers are excluded by definition"
    constants:
      MIN_COMPLIANCE_PCT: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: strict_roster
        when: "POST /agreements/{id}/sign"
        difference: "Every non-temporary driver must be QUALIFIED; any single failure blocks the signature."
      - name: tolerated_roster
        when: "POST /route-assignments/{id}/reaffirm"
        difference: "The transition proceeds regardless of failures and records them on RouteAssignment.compliance_failures_count, so a 50.00 percent roster still reaffirms."

  - name: owned_vehicle_count_reconciliation
    trigger: "POST /service-providers/{id}/approve, POST /route-assignments/{id}/approve-transfer, POST /chargeback-claims/{id}/approve, POST /route-assignments/{id}/terminate"
    algorithm: aggregation
    formula: |
      # Branding compliance percentage over the provider's own fleet only.
      fleet = Vehicle where provider_id == sp.id and is_temporary == false
      active_fleet = [v for v in fleet if v.status == ACTIVE]
      if active_fleet is empty:
          sp.brand_compliance_pct = 0.00
      else:
          sp.brand_compliance_pct = round_half_up(
              count(v in active_fleet where v.branding_compliance == PASSED)
              / count(active_fleet) * 100, 2)
    input_set: "Vehicle rows with provider_id == sp.id and is_temporary == false; DECOMMISSIONED rows are excluded from the denominator"
    constants:
      BRAND_MIN_PCT: 100.00
      STEP_VAN_STOP_CEILING: 1500
    precision: "2 decimal places, round_half_up"
    variants:
      - name: active_fleet_denominator
        when: "POST /service-providers/{id}/approve"
        difference: "Denominator is the ACTIVE non-temporary fleet, so a PENDING vehicle does not drag the percentage down."
      - name: all_owned_denominator
        when: "POST /route-assignments/{id}/approve-transfer"
        difference: "Denominator includes PENDING non-temporary vehicles, so the same fleet yields a lower percentage."

  - name: owned_driver_count_reconciliation
    trigger: "POST /route-assignments/{id}/activate, POST /peak-season-declarations/{id}/end"
    algorithm: aggregation
    formula: |
      roster = Driver where provider_id == sp.id and is_temporary == false
      active_roster = [d for d in roster if d.status == ACTIVE]
      sp.qualification_pct = round_half_up(
          count(d in active_roster where d.qualification_status == QUALIFIED)
          / max(count(active_roster), 1) * 100, 2)
      # Cooperative rule with the peak-season end transition: temporary drivers
      # are removed from the roster before this recompute, so ending a peak
      # declaration and deactivating its assets are applied atomically.
    input_set: "Driver rows with provider_id == sp.id and is_temporary == false; temporary drivers are excluded"
    constants:
      DRIVER_MIN_PCT: 100.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: active_only
        when: "POST /route-assignments/{id}/activate"
        difference: "Denominator counts only ACTIVE drivers, so SUSPENDED drivers neither help nor hurt."
      - name: rostered_all
        when: "POST /peak-season-declarations/{id}/end"
        difference: "Denominator counts every non-terminal driver including SUSPENDED ones, so the same roster yields a lower percentage."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are present and the role is a declared §1.7 role"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the calling role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "ServiceProvider path id resolves to a row with status IN {UNDER_REVIEW, APPROVED, SUSPENDED}"
    error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    applies_to: ["POST /route-assignments", "POST /settlement-periods", "POST /vehicles", "POST /drivers", "POST /insurance-policies", "POST /agreements", "POST /chargeback-claims"]

  - priority: 4
    category: existence
    check: "ServiceArea path id resolves in left-to-right path order before any later path id is read"
    error_id: ERR_SERVICE_AREA_NOT_FOUND
    http_status: 404
    applies_to: ["POST /route-assignments", "POST /agreements", "POST /vehicles", "POST /drivers", "POST /peak-season-declarations"]

  - priority: 5
    category: existence
    check: "Agreement path id resolves"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: ["POST /agreements/{id}/submit", "POST /agreements/{id}/sign", "POST /agreements/{id}/renegotiate", "POST /agreements/{id}/terminate", "POST /agreements/{id}/expire", "POST /agreements/{id}/amend", "GET /agreements/{id}/renewal-recommendation", "GET /agreements/{id}/negotiation-rounds"]

  - priority: 6
    category: existence
    check: "SettlementPeriod path id resolves"
    error_id: ERR_SETTLEMENT_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: ["POST /settlement-periods/{id}/close-accrual", "POST /settlement-periods/{id}/reconcile", "POST /settlement-periods/{id}/dispute", "POST /settlement-periods/{id}/release", "POST /settlement-periods/{id}/stop-observations", "POST /settlement-periods/{id}/deductions", "GET /settlement-periods/{id}/summary"]

  - priority: 7
    category: existence
    check: "RouteAssignment path id resolves"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: ["POST /route-assignments/{id}/activate", "POST /route-assignments/{id}/terminate", "POST /route-assignments/{id}/request-transfer", "POST /route-assignments/{id}/approve-transfer", "POST /route-assignments/{id}/withdraw-transfer", "POST /route-assignments/{id}/reaffirm"]

  - priority: 8
    category: existence
    check: "Vehicle path id resolves"
    error_id: ERR_VEHICLE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /vehicles/{id}/branding-check", "POST /vehicles/{id}/activate"]

  - priority: 9
    category: existence
    check: "ChargebackClaim path id resolves"
    error_id: ERR_CHARGEBACK_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: ["POST /chargeback-claims/{id}/approve", "POST /chargeback-claims/{id}/reject", "POST /chargeback-claims/{id}/settle"]

  - priority: 10
    category: existence
    check: "Dispute path id resolves"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: ["POST /disputes/{id}/submit-evidence", "POST /disputes/{id}/counter", "POST /disputes/{id}/resubmit-evidence", "POST /disputes/{id}/escalate", "POST /disputes/{id}/resolve", "POST /disputes/{id}/withdraw"]

  - priority: 11
    category: existence
    check: "PeakSeasonDeclaration path id resolves"
    error_id: ERR_PEAK_DECLARATION_NOT_FOUND
    http_status: 404
    applies_to: ["POST /peak-season-declarations/{id}/activate", "POST /peak-season-declarations/{id}/end", "POST /peak-season-declarations/{id}/cancel"]

  - priority: 12
    category: existence
    check: "every body-declared foreign key (service_area_id, provider_id, acquiring_provider_id, settlement_period_id, vehicle_id, fuel_index_rate_id) resolves to a row; a dangling body FK fails here rather than later"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: ["all with a request body"]

  - priority: 13
    category: existence
    check: "the Driver path id resolves"
    error_id: ERR_DRIVER_NOT_FOUND
    http_status: 404
    applies_to: ["POST /drivers/{id}/qualify", "POST /drivers/{id}/suspend", "POST /drivers/{id}/duty-shifts", "GET /drivers/{id}/duty-shifts"]

  - priority: 14
    category: state
    check: "the requested transition is legal from the resource's current status"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["all action endpoints"]

  - priority: 15
    category: state
    check: "the resource is not already in a terminal state (TRANSFERRED, TERMINATED, EXPIRED, RELEASED, REJECTED, SETTLED, ENDED, CANCELED, SUSPENDED, WITHDRAWN, RESOLVED)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: ["all action endpoints"]

  - priority: 16
    category: business_fiscal
    check: "the OCC expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /route-assignments", "POST /settlement-periods", "POST /route-assignments/{id}/approve-transfer"]

  - priority: 17
    category: business_referential
    check: "no other RouteAssignment on the same service_area_id has status IN {ACTIVE, PENDING_TRANSFER}"
    error_id: ERR_AREA_ALREADY_ASSIGNED
    http_status: 409
    applies_to: ["POST /route-assignments", "POST /route-assignments/{id}/activate", "POST /route-assignments/{id}/approve-transfer"]

  - priority: 18
    category: business_temporal
    check: "the candidate occupancy interval [effective_date, +inf) does not overlap another RouteAssignment occupancy interval on the same service_area_id; abutting endpoints (one interval ending exactly where the other begins) are permitted, gap 0 days"
    error_id: ERR_TEMPORAL_OVERLAP
    http_status: 409
    applies_to: ["POST /route-assignments", "POST /route-assignments/{id}/activate"]

  - priority: 19
    category: business_temporal
    check: "the candidate driver duty interval [starts_at, ends_at) does not intersect Driver.duty_window_ends_at extended by an inclusive DRIVER_GUARD_MINUTES = 1 buffer; a candidate starting exactly at the prior end instant IS a violation"
    error_id: ERR_DRIVER_HOURS_EXCEEDED
    http_status: 409
    applies_to: ["POST /drivers/{id}/duty-shifts"]

  - priority: 20
    category: business_safety
    check: "every driver assigned to the signing area reports qualification_status == QUALIFIED and license_class IN {CLASS_B, CLASS_A}"
    error_id: ERR_DRIVER_NOT_QUALIFIED
    http_status: 422
    applies_to: ["POST /agreements/{id}/sign", "POST /route-assignments/{id}/reaffirm"]

  - priority: 21
    category: business_safety
    check: "the provider's AUTO_LIABILITY InsurancePolicy coverage_cents is >= the governing Agreement.insurance_coverage_cents and expires_at > now"
    error_id: ERR_INSURANCE_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /route-assignments", "POST /route-assignments/{id}/request-transfer", "POST /agreements/{id}/sign", "POST /service-providers/{id}/approve"]

  - priority: 22
    category: business_safety
    check: "every non-temporary Vehicle of the provider on the affected service_area_id reports branding_compliance == PASSED"
    error_id: ERR_BRANDING_NONCOMPLIANT
    http_status: 422
    applies_to: ["POST /route-assignments/{id}/activate", "POST /service-providers/{id}/approve"]

  - priority: 23
    category: business_safety
    check: "the vehicle_class satisfies the selector's eligibility tier for the requested service area: STEP_VAN is refused when ServiceArea.stop_capacity_weekly exceeds STEP_VAN_STOP_CEILING = 1500, and BOX_TRUCK or TRACTOR_TRAILER are accepted on every area"
    error_id: ERR_VEHICLE_INELIGIBLE
    http_status: 422
    applies_to: ["POST /vehicles", "POST /vehicles/{id}/activate"]

  - priority: 24
    category: business_constraint
    check: "the week's summed stops_count is <= the governing ServiceArea.stop_capacity_weekly; the boundary is evaluated only when the accrual window closes, so observations may be posted above capacity while the period is OPEN"
    error_id: ERR_STOP_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /settlement-periods/{id}/close-accrual"]

  - priority: 25
    category: business_constraint
    check: "the ACTIVE PeakSeasonDeclaration on the area covers the requested instant (starts_on <= now < ends_on) and the temporary asset counts stay within authorized_vehicles / authorized_drivers"
    error_id: ERR_PEAK_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: ["POST /vehicles", "POST /drivers"]

  - priority: 26
    category: business_fiscal
    check: "the summed non-CHARGEBACK deduction segments do not exceed DEDUCTION_CAP unless the reconcile request sets allow_over_cap to true; the cap is evaluated on POST /settlement-periods/{id}/reconcile, so a reconciling caller who does not set allow_over_cap may always drive the cap with two POST /settlement-periods/{id}/deductions calls"
    error_id: ERR_DEDUCTION_CAP_EXCEEDED
    http_status: 422
    applies_to: ["POST /settlement-periods/{id}/reconcile"]

  - priority: 27
    category: business_fiscal
    check: "ServiceProvider.chargeback_outstanding_cents == 0 for the transferring provider before a route title may move"
    error_id: ERR_CHARGEBACK_OUTSTANDING
    http_status: 422
    applies_to: ["POST /route-assignments/{id}/request-transfer", "POST /route-assignments/{id}/approve-transfer"]

  - priority: 28
    category: business_fiscal
    check: "the dispute is filed while now < SettlementPeriod.week_start_at + 7 days + 90 days"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /settlement-periods/{id}/dispute"]

  - priority: 29
    category: business_constraint
    check: "a negotiation round is opened beyond its budget: an Agreement may consume at most RENEGOTIATION_ROUND_LIMIT = 3 renegotiation rounds, and a Dispute may consume at most DISPUTE_ROUND_LIMIT = 2 counter-offers, so the third counter-offer on one dispute is refused"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: ["POST /agreements/{id}/renegotiate", "POST /agreements/{id}/submit", "POST /disputes/{id}/counter", "POST /disputes/{id}/resubmit-evidence"]


# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/route-settlement/service-providers"
    description: "Register an independent service provider entity into review."
    roles: [AccountManager]
    code: 201
    input: [legal_name, tax_id, "provider_type?"]
    output: ServiceProvider
    side_effects: ["ServiceProvider.status := UNDER_REVIEW", "recompute ServiceProvider.brand_compliance_pct via the owned_vehicle_count_reconciliation calculation"]

  - method: GET
    path: "/route-settlement/service-providers"
    description: "List service providers with optional status filter and pagination."
    roles: [AccountManager, SettlementAnalyst, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ServiceProvider[]
    side_effects: []

  - method: GET
    path: "/route-settlement/service-providers/{id}"
    description: "Read a single service provider, including its derived compliance fields."
    roles: [AccountManager, SettlementAnalyst, ComplianceOfficer, ServiceProvider]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: []

  - method: POST
    path: "/route-settlement/service-providers/{id}/approve"
    description: "Approve a provider under review once insurance and branding gates clear."
    roles: [AccountManager]
    code: 200
    input: ["expected?"]
    output: ServiceProvider
    side_effects: ["ServiceProvider.status := APPROVED", "promote PENDING non-temporary Vehicle rows to ACTIVE", "promote PENDING QUALIFIED non-temporary Driver rows to ACTIVE", "recompute ServiceProvider.brand_compliance_pct via the owned_vehicle_count_reconciliation calculation", "increment ServiceProvider.version by 1"]

  - method: POST
    path: "/route-settlement/service-providers/{id}/reopen-review"
    description: "Return an approved provider to review (cycle back-edge)."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: ["ServiceProvider.status := UNDER_REVIEW", "increment ServiceProvider.version by 1"]

  - method: POST
    path: "/route-settlement/service-providers/{id}/suspend"
    description: "Suspend a provider and cascade termination across its assignments, areas and agreements."
    roles: [AccountManager]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: ["cascade: RouteAssignment rows for the provider set to TERMINATED", "cascade: ServiceArea rows for the provider set to UNASSIGNED", "cascade: Agreement rows for the provider set to TERMINATED", "increment ServiceProvider.version by 1"]

  - method: POST
    path: "/route-settlement/service-areas"
    description: "Create a contiguous service area."
    roles: [AccountManager]
    code: 201
    input: [area_code, state_code, zip_prefix_low, zip_prefix_high, stop_capacity_weekly]
