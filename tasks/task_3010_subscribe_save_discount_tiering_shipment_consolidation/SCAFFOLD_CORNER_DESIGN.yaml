  # ===========================================================================
  - section: consistency_model
    instances:

      - name: lock_response_carries_final_totals_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/sns/delivery-plans/{id}/lock
        distinguishing_aspect: "Immediate consistency: the lock response itself contains charged_total_cents, tier_discount_pct, and LOCKED status — no re-read or settling window is required."
        test_recipe:
          setup: ["Logical clock default. Customer, product 1000 stocked, one subscription, plan generated."]
          setup_api_calls:
            - *k_clock
            - &kcm_cust
              call: "POST /sns/customers"
              payload: { email: "kcm@x.com", full_name: "K Consist", region: "US-WEST", preferred_delivery_day: 10 }
              as: PlatformAdmin
              captures: { kcm_cust: $.data.id }
            - &kcm_prod
              call: "POST /sns/products"
              payload: { sku: "K-CM", name: "Consist Product", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kcm_prod: $.data.id }
            - call: "POST /sns/products/${kcm_prod}/price-events"
              payload: { price_cents: 1000, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sns/inventory-placements"
              payload: { product_id: "${kcm_prod}", region: "US-WEST" }
              as: PlatformAdmin
              captures: { kcm_pl: $.data.id }
            - call: "POST /sns/inventory-placements/${kcm_pl}/receive"
              payload: { units: 50 }
              as: PlatformAdmin
            - call: "POST /sns/subscriptions"
              payload: { customer_id: "${kcm_cust}", product_id: "${kcm_prod}", cadence_months: 1, quantity: 2, start_date: "2026-09-10" }
              as: Customer
              as_user_id: "${kcm_cust}"
            - call: "POST /sns/ops/generate-plans"
              payload: { delivery_month: "2026-09" }
              as: PlatformAdmin
              captures: { kcm_plan: "$.data[0].id" }
          trigger:
            - call: "POST /sns/delivery-plans/${kcm_plan}/lock"
              payload: {}
              as: Customer
