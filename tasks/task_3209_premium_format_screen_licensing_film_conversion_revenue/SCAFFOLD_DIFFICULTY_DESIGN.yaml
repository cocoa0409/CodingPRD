            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${film_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv_id: $.data.id } }
            - { call: "POST /v1/release-windows", payload: { window_label: "W37", window_start_date: "2026-09-07T00:00:00Z", window_end_date: "2026-09-14T00:00:00Z", total_premium_screen_seconds_pool: 10000000 }, as: ReleaseScheduler, captures: { win_id: $.data.id, win_v0: $.data.version } }
            - { call: "POST /v1/screen-slots", payload: { window_id: "${win_id}", auditorium_id: "${aud_id}", studio_film_id: "${film_id}", conversion_order_id: "${conv_id}", slot_start_date: "2026-09-07T00:00:00Z", slot_end_date: "2026-09-14T00:00:00Z", showings_per_day: 2, expected_window_version: "${win_v0}" }, as: ReleaseScheduler, captures: { slot_id: $.data.id } }
          trigger:
            - { call: "POST /v1/screen-slots/${slot_id}/confirm", payload: {}, as: ReleaseScheduler, captures: { err_id: $.data.error_id } }
          assert:
