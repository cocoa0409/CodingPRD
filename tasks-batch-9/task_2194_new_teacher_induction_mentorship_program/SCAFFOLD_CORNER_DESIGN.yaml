            - "data.credited_attendance_count == 0 — credit only counts against HELD sessions"
            - "GET /seminar-sessions/${s1_id} reports status == \"HELD\" and credited_attendance_count == 1 — the sibling session is untouched"
            - "GET /seminar-attendances?session_id=${s1_id}&credited=true returns total_count == 1"
            - "GET /novice-teachers/${novice_id} reports credited_seminar_sessions == 1"
            - "GET /novice-teachers/${novice_id}/readiness reports held_sessions == 1, seminar_denominator == 1, seminar_component == 1.00 and readiness_index_live == 25.00 — the cancelled session never entered the denominator"

  - section: calculations
    instances:
      - name: subject_match_tier_resolves_adjacent_from_adjacency_map
