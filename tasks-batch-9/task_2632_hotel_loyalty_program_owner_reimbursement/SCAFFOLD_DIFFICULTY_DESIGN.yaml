# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2632 - Hotel Loyalty Program & Owner Reimbursement
# 9 rule_id blocks, 19 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7; every setup_api_calls chain drives empty-DB -> the stated setup
# using only §1.5 endpoints. Logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: stay_bonus_provisional_tier_at_checkin_vs_final_tier_at_adjustment
        grounds:
          - calculations.stay_elite_bonus_points
          - calculations.elite_tier_recompute
          - state_machines.Stay.POSTED_QUALIFYING_to_DISPUTED
          - state_machines.Stay.DISPUTED_to_ADJUSTED
          - entities.Stay.fields.bonus_multiplier_applied
          - entities.Stay.fields.tier_at_checkin
        distinguishing_aspect: |
          The two variants of stay_elite_bonus_points read the multiplier from two different tier
          sources on the same Stay row: provisional_tier_at_checkin uses Stay.tier_at_checkin
          (BASE, multiplier 0.00, 0 bonus points) while final_tier_at_adjustment uses the member's
          live elite_tier (PLATINUM, multiplier 0.75, 92587 bonus points) - a 92587-point delta on
          byte-identical stay data.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.0475 and a qualifying TRANSIENT rate plan earning 10 points per dollar."
            - "One member enrolled at BASE tier."
            - "A 2-night stay S1 with room_revenue_cents 1234500 posted while the member was still BASE, so its awarded bonus is 0 and its recorded multiplier is 0.00."
            - "A later 50-night stay S2 posted afterwards, lifting the member to PLATINUM (52 qualifying nights)."
            - "S1 then moved to DISPUTED by the member, which drops its 2 nights from the YTD count and leaves the member at exactly 50 qualifying nights - still PLATINUM."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Harborline Central", brand_code: "HRB", market_tier: "URBAN", program_fee_pct: 0.0475, rooms_count: 220, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "dv1@example.com", full_name: "Dana Vance", enrollment_date: "2026-01-05" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 1234500 }
              as: ProgramAdministrator
              captures: { s1_id: $.data.id }
            - call: "POST /loyalty/stays/${s1_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-05-01", checkout_date: "2026-06-20", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { s2_id: $.data.id }
            - call: "POST /loyalty/stays/${s2_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays/${s1_id}/dispute"
              payload: { dispute_reason: "Folio shows a rate the guest never agreed to" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /loyalty/stays/${s1_id}/adjust"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "response code 200 and Stay.${s1_id}.status == ADJUSTED"
            - "Stay.${s1_id}.base_points_awarded == 123450 (unchanged: room_revenue_cents was not restated)"
            - "Stay.${s1_id}.bonus_points_awarded == 92587 (floor(123450 * 0.75), not 92587.5 and not 92588)"
            - "Stay.${s1_id}.bonus_multiplier_applied == 0.75, where it read 0.00 immediately after posting"
            - "sum of PointLedgerEntry.points over source_stay_id == ${s1_id} equals 216037 (123450 base + 0 provisional bonus + 92587 bonus delta)"
            - "Member.${m_id}.point_balance == 217271 (123450 + 1234 + 92587)"
            - "Member.${m_id}.elite_tier == PLATINUM and Member.${m_id}.qualifying_nights_ytd == 50"
            - "Hotel.${h_id}.fee_ledger_balance_cents == 59225 (58639 + 586), unchanged by the adjustment"

      - name: owner_reimbursement_accrual_estimate_vs_settlement_actual
        grounds:
          - calculations.owner_reimbursement
          - calculations.batch_item_selection
          - state_machines.Redemption.CONFIRMED_to_STAYED
          - state_machines.ReimbursementBatch.OPEN_to_RELEASED
          - entities.ReimbursementBatch.fields.occupancy_pct_at_release
          - entities.Redemption.fields.estimated_reimbursement_cents
          - entities.Redemption.fields.settled_reimbursement_cents
        distinguishing_aspect: |
          The two variants of owner_reimbursement read occupancy and ADR from two different places
          for the same 2-night award stay: accrual_estimate uses the live hotel figures at
          completion (0.82 occupancy -> the 0.75 STRONG band -> 22500 per night -> 45000) while
          settlement_actual uses the batch's release-time snapshot (0.96 occupancy -> the
          COMPRESSION band -> full ADR 30000 per night -> 60000).
        test_recipe:
          setup:
            - "One ACTIVE resort with trailing_12m_occupancy_pct 0.82 and trailing_12m_adr_cents 30000, and no posted paid stays, so its fee ledger reads 0."
            - "A STANDARD award price window covering all of 2026 at 40000 points per night, 1500 cents copay per night, min_tier_required BASE, award_allotment_per_night 5."
            - "A member holding 100000 points from a settled direct point purchase."
            - "A 2-night award booking (2026-09-10 to 2026-09-12) confirmed, then completed with the clock at 2026-09-20, accruing under the live 0.82 occupancy."
            - "The property's performance then restated to 0.96 occupancy at the same 30000 ADR, and an OPEN 2026-09 reimbursement batch created."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Coral Point Resort", brand_code: "CPR", market_tier: "RESORT", program_fee_pct: 0.05, rooms_count: 150, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 1500, min_tier_required: "BASE", award_allotment_per_night: 5 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "dv2@example.com", full_name: "Omar Reyes", enrollment_date: "2026-02-01" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 100000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-12", expected_hotel_version: "${h_v}" }
              as: ProgramAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /loyalty/redemptions/${r_id}/confirm"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /loyalty/redemptions/${r_id}/complete-stay"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/performance-refresh"
              payload: { trailing_12m_occupancy_pct: 0.96, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${h_id}", period_month: "2026-09" }
              as: ProgramAdministrator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loyalty/reimbursement-batches/${b_id}/release"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-release-01"
          assert:
            - "response code 200 and ReimbursementBatch.${b_id}.status == RELEASED"
            - "Redemption.${r_id}.estimated_reimbursement_cents == 45000 (22500 per night, written at completion under accrual_estimate)"
            - "Redemption.${r_id}.settled_reimbursement_cents == 60000 (30000 per night, written at release under settlement_actual)"
            - "the settlement exceeds the accrual by exactly 15000 cents on identical redemption data"
            - "ReimbursementBatch.${b_id}.occupancy_pct_at_release == 0.96 and ReimbursementBatch.${b_id}.adr_cents_at_release == 30000"
            - "ReimbursementBatch.${b_id}.item_count == 1 and gross_reimbursement_cents == 60000"
            - "ReimbursementBatch.${b_id}.fee_offset_base_cents == 0, delinquency_surcharge_cents == 0, net_payable_cents == 60000"
            - "Redemption.${r_id}.reimbursement_status == BATCHED while fulfillment_status stays STAYED"
            - "ReimbursementBatch.${b_id}.released_by_user_id == \"op-release-01\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: peak_award_price_evaluation_order_capped_discount_then_surcharge_then_floor
        grounds:
          - calculations.redemption_points_price
          - calculations.redemption_pricing_selection
          - calculations.elite_tier_recompute
          - entities.RedemptionPricing.fields.points_per_night
          - entities.Hotel.fields.market_tier
          - entities.Redemption.fields.points_charged
        distinguishing_aspect: |
          Mode (a) - evaluation ORDER of a five-input formula. The tier discount is floored and then
          capped (4 percent of 70000 is 3500, capped to 3000), the free night is withheld because
          the season is PEAK, the RESORT surcharge is a ceil applied to the post-discount gross, and
          the per-night floor is compared last: 271350. Re-ordering any pair (capping after the
          multiply, granting the free night, or flooring before the surcharge) changes the answer.
        test_recipe:
          setup:
            - "One ACTIVE RESORT property (peak surcharge 0.35) with a qualifying TRANSIENT rate plan."
            - "A PEAK award price window covering 2026-09-01 to 2026-09-30 at 70000 points per night, 2000 cents copay per night, min_tier_required BASE, award_allotment_per_night 3, and no STANDARD window covering September."
            - "A member at GOLD tier (30 qualifying nights from one posted stay) holding 301234 points: 1234 earned on that stay, 100000 from a settled direct purchase, 200000 from a goodwill grant."
            - "The program fund holds 110000 cents of purchase cash, so its posture is not IMPAIRED and peak inventory is open."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Dune Ridge Resort", brand_code: "DRR", market_tier: "RESORT", program_fee_pct: 0.0475, rooms_count: 300, trailing_12m_occupancy_pct: 0.88, trailing_12m_adr_cents: 45000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "PEAK", window_start_date: "2026-09-01", window_end_date: "2026-09-30", points_per_night: 70000, cash_copay_cents: 2000, min_tier_required: "BASE", award_allotment_per_night: 3 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "cf1@example.com", full_name: "Ilse Brandt", enrollment_date: "2026-01-10" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-06-01", checkout_date: "2026-07-01", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id }
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 100000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/members/${m_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { m_v: $.data.version }
            - call: "POST /loyalty/point-adjustments"
              payload: { member_id: "${m_id}", points: 200000, adjustment_reason: "Status-match promotion top-up", expected_member_version: "${m_v}" }
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
          trigger:
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-13", expected_hotel_version: "${h_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
          assert:
            - "response code 201 and Redemption.${r_id}.season == PEAK"
            - "Redemption.${r_id}.points_per_night_applied == 70000 and Redemption.${r_id}.award_allotment_applied == 3"
            - "Redemption.${r_id}.nights == 3 and no free night is granted (the free night is STANDARD-only)"
            - "the GOLD discount is floor(70000 * 0.05) == 3500 capped to 3000, so the per-night charge is 67000 and the gross is 201000"
            - "the RESORT peak surcharge is ceil(201000 * 0.35) == 70350"
            - "Redemption.${r_id}.points_charged == 271350, above the 18000 floor (6000 * 3) so the floor does not bind"
            - "Redemption.${r_id}.cash_copay_cents == 6000 (2000 per night * 3 nights)"
            - "Member.${m_id}.point_balance == 29884 (301234 - 271350)"
            - "Member.${m_id}.elite_tier == GOLD and qualifying_nights_ytd == 30"

      - name: program_fee_rounds_per_stay_before_summing_not_after
        grounds:
          - calculations.program_fee_assessment
          - state_machines.Stay.PENDING_POSTING_to_POSTED_QUALIFYING
          - entities.Stay.fields.program_fee_assessed_cents
          - entities.Hotel.fields.fee_ledger_balance_cents
          - entities.Hotel.fields.program_fee_pct
        distinguishing_aspect: |
          Mode (b) - ROUNDING ORDER. Three 12345-cent stays at a 0.0475 program fee round to 586
          cents each and sum to 1758; summing the raw revenue first (37035) and rounding once gives
          1759. The one-cent gap is only visible because the fee percentage produces a .3875
          fractional cent per stay.
        test_recipe:
          setup:
            - "One ACTIVE property with program_fee_pct 0.0475 and a qualifying TRANSIENT rate plan."
            - "One member, three separate 1-night stays each with room_revenue_cents 12345, two of them already posted so the ledger reads 1172."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Kestrel Inn Midtown", brand_code: "KIM", market_tier: "SELECT", program_fee_pct: 0.0475, rooms_count: 90, trailing_12m_occupancy_pct: 0.71, trailing_12m_adr_cents: 14000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "cf2@example.com", full_name: "Pia Lund", enrollment_date: "2026-03-03" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-02", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { s1_id: $.data.id }
            - call: "POST /loyalty/stays/${s1_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-08", checkout_date: "2026-07-09", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { s2_id: $.data.id }
            - call: "POST /loyalty/stays/${s2_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-15", checkout_date: "2026-07-16", room_revenue_cents: 12345 }
              as: ProgramAdministrator
              captures: { s3_id: $.data.id }
          trigger:
            - call: "POST /loyalty/stays/${s3_id}/post"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "response code 200 and Stay.${s3_id}.status == POSTED_QUALIFYING"
            - "Stay.${s1_id}.program_fee_assessed_cents == 586 and Stay.${s2_id}.program_fee_assessed_cents == 586 and Stay.${s3_id}.program_fee_assessed_cents == 586"
            - "Hotel.${h_id}.fee_ledger_balance_cents == 1758, NOT 1759 (round-then-sum, not sum-then-round)"
            - "each stay awards floor(12345 * 10 / 100) == 1234 base points, so Member.${m_id}.point_balance == 3702"
            - "Member.${m_id}.qualifying_nights_ytd == 3 and elite_tier == BASE"
            - "Hotel.${h_id}.status == ACTIVE (1758 is far below the 250000 delinquency threshold)"

      - name: batch_surcharge_tier_keyed_on_net_before_surcharge_not_on_final_net
        grounds:
          - calculations.batch_net_payable
          - calculations.batch_item_selection
          - calculations.owner_reimbursement
          - calculations.program_fee_assessment
          - state_machines.Hotel.ACTIVE_to_FEE_DELINQUENT
          - state_machines.ReimbursementBatch.OPEN_to_RELEASED
          - entities.ReimbursementBatch.fields.delinquency_surcharge_cents
        distinguishing_aspect: |
          Mode (c) - CONDITIONAL BRANCH SELECTION on an apparently circular figure. The surcharge
          tier is keyed on net_before_surcharge (505000 -> the 0.01 HIGH band -> surcharge 7000 ->
          net_payable 498000). Keying it on the final net_payable instead would read 498000, select
          the 0.02 band, and produce surcharge 14000 with net_payable 491000.
        test_recipe:
          setup:
            - "One property with program_fee_pct 0.05, trailing_12m_occupancy_pct 0.96 and trailing_12m_adr_cents 241000, and a GROUP rate plan (qualifying and fee-bearing, but not elite-counting)."
            - "A 14-night GROUP stay with room_revenue_cents 14000000 posted, assessing a 700000-cent program fee and pushing the property into FEE_DELINQUENT."
            - "A STANDARD award price window covering all of 2026 at 40000 points per night, min_tier_required BASE, award_allotment_per_night 5."
            - "A 5-night award booking completed with the clock at 2026-09-20, accrued at the full 241000 ADR because occupancy sits in the compression band."
            - "An OPEN 2026-09 reimbursement batch for the delinquent property."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Grand Meridian Convention", brand_code: "GMC", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 400, trailing_12m_occupancy_pct: 0.96, trailing_12m_adr_cents: 241000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "GRP1", rate_category: "GROUP" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-12-31", points_per_night: 40000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 5 }
              as: ProgramAdministrator
            - call: "POST /loyalty/members"
              payload: { email: "cf3@example.com", full_name: "Marc Aubert", enrollment_date: "2026-01-20" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", rate_plan_id: "${rp_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-15", room_revenue_cents: 14000000 }
              as: ProgramAdministrator
              captures: { s_id: $.data.id }
            - call: "POST /loyalty/stays/${s_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-10", checkout_date: "2026-09-15", expected_hotel_version: "${h_v}" }
              as: ProgramAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /loyalty/redemptions/${r_id}/confirm"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /loyalty/redemptions/${r_id}/complete-stay"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/reimbursement-batches"
              payload: { hotel_id: "${h_id}", period_month: "2026-09" }
              as: ProgramAdministrator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /loyalty/reimbursement-batches/${b_id}/release"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "op-release-02"
          assert:
            - "response code 200 and ReimbursementBatch.${b_id}.status == RELEASED"
            - "Hotel.${h_id}.status == FEE_DELINQUENT and Hotel.${h_id}.fee_ledger_balance_cents == 700000"
            - "Redemption.${r_id}.settled_reimbursement_cents == 1205000 (241000 * 5, compression band)"
            - "ReimbursementBatch.${b_id}.gross_reimbursement_cents == 1205000 and fee_offset_base_cents == 700000"
