# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Restaurant Surplus Food Rescue Logistics
# Enumerates every testable claim of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Stubs cite the covering
# §1.8 instance; all other instances carry full structured test_recipes.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities ===
  - section: entities
    instances:
      - name: donor_creation_defaults
        claim_type: creation
        grounds: [entities.DonorSite]
        distinguishing_aspect: "A minimally-populated donor create returns 201 with every system/computed default materialized."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Default Bistro", ein: "100000001", contact_email: "d@bistro.example" }
              as: DispatchAdmin
              captures: { d_status: "$.data.status", d_strikes: "$.data.strike_count", d_life: "$.data.lifetime_weight_lbs", d_pend: "$.data.pending_estimated_lbs", d_tax: "$.data.lifetime_tax_value_cents", d_ver: "$.data.version", d_enh: "$.data.enhanced_deduction_eligible" }
          assert:
            - "d_status == PENDING_REVIEW (initial state)"
            - "d_strikes == 0 and d_life == 0 and d_pend == 0 and d_tax == 0"
            - "d_ver == 1 and d_enh == false (field default applied)"

      - name: driver_and_cooler_creation_defaults
        claim_type: defaults
        grounds: [entities.VolunteerDriver, entities.Cooler]
        distinguishing_aspect: "Driver create defaults cold_chain_certified=false, reliability 100, ONBOARDING; cooler create is AVAILABLE with null cleaning_ends_at."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V Def", email: "vd@example.com", vehicle_capacity_lbs: 300, cooler_slot_count: 1 }
              as: DispatchAdmin
              captures: { v_status: "$.data.status", v_score: "$.data.reliability_score", v_cert: "$.data.cold_chain_certified", v_done: "$.data.completed_run_count", v_strikes: "$.data.upheld_strike_count" }
            - call: "POST /api/coolers"
              payload: { label: "C-DEF", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c_status: "$.data.status", c_ends: "$.data.cleaning_ends_at" }
          assert:
            - "v_status == ONBOARDING and v_score == 100 and v_cert == false and v_done == 0 and v_strikes == 0"
            - "c_status == AVAILABLE and c_ends == null"

      - name: offer_requires_cold_chain_computed
        claim_type: computed_fields
        grounds: [entities.DonationOffer.fields.requires_cold_chain]
        distinguishing_aspect: "requires_cold_chain is server-computed from food_category: true for COLD_HELD, false for SHELF_STABLE."
        test_recipe:
          setup: ["Donor D exists (any status; creation of DRAFT offers is not gated)"]
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "CC Bistro", ein: "100000002", contact_email: "cc@bistro.example" }
              as: DispatchAdmin
              captures: { d: $.data.id }
          trigger:
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 10, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { cold_cc: "$.data.requires_cold_chain" }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "SHELF_STABLE", estimated_weight_lbs: 10, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { shelf_cc: "$.data.requires_cold_chain" }
          assert:
            - "cold_cc == true and shelf_cc == false (computed, never client-set)"

      - name: temperature_log_is_immutable_event
        claim_type: immutability
        grounds: [entities.TemperatureLog]
        distinguishing_aspect: "TemperatureLog has common_fields=false: log entries expose id/created_at but no version/updated_at, and no endpoint mutates them."
        test_recipe:
          setup:
            - "Cold-chain run R CONFIRMED (donor ACTIVE, agency cold 100, driver V1 certified window 09:00-15:00Z, cooler C1 30L, offer est 50 window 10:00-12:00Z); clock advanced to 2026-08-02T10:15:00Z"
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "TL Bistro", ein: "100000003", contact_email: "tl@bistro.example" }
              as: DispatchAdmin
              captures: { d: $.data.id }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/recipient-agencies"
              payload: { name: "AG", accepts_categories: ["COLD_HELD"], capacity_cold_held_lbs: 100, capacity_hot_held_lbs: 0, capacity_produce_lbs: 0, capacity_shelf_stable_lbs: 0 }
              as: DispatchAdmin
              captures: { ag: $.data.id }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v1: $.data.id }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/coolers"
              payload: { label: "C1", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 50, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: DispatchAdmin
            - call: "GET /api/donation-offers/${o}"
              as: DispatchAdmin
              captures: { ov: $.data.version }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o}", expected_offer_version: "${ov}", driver_id: "${v1}", agency_id: "${ag}", cooler_ids: ["${c1}"] }
              as: DispatchAdmin
              captures: { r: $.data.id }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", pickup_temp_f: 35.0, attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v1}"
          trigger:
            - call: "GET /api/rescue-runs/${r}/temperature-logs"
              as: DispatchAdmin
              captures: { log_point: "$.data[0].point", log_temp: "$.data[0].temp_f", log_at: "$.data[0].recorded_at", log_by: "$.data[0].recorded_by_user_id" }
          assert:
            - "Exactly 1 log exists; log_point == PICKUP and log_temp == 35.0"
            - "log_at == 2026-08-02T10:15:00Z (recorded_at mirrors pickup_time) and log_by == ${v1}"
            - "The log object has id and created_at but NO version or updated_at field (common_fields: false)"

      - name: get_nonexistent_resources_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_AGENCY_NOT_FOUND]", "errors[ERR_DRIVER_NOT_FOUND]", "errors[ERR_COOLER_NOT_FOUND]", "errors[ERR_OFFER_NOT_FOUND]", "errors[ERR_RUN_NOT_FOUND]", "errors[ERR_STRIKE_REPORT_NOT_FOUND]"]
        distinguishing_aspect: "Every resource GET/action with a well-formed but unknown id returns that resource's 404 code."
        test_recipe:
          setup: ["One driver V1 exists (to drive the run-scoped 404s)"]
          setup_api_calls:
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V N", email: "vnf@example.com", vehicle_capacity_lbs: 300, cooler_slot_count: 1 }
              as: DispatchAdmin
              captures: { v1: $.data.id }
          trigger:
            - call: "GET /api/recipient-agencies/00000000-0000-4000-8000-0000000000aa"
              as: DispatchAdmin
              captures: { e_ag: $.data.error_id }
            - call: "GET /api/volunteer-drivers/00000000-0000-4000-8000-0000000000ab"
              as: DispatchAdmin
              captures: { e_dr: $.data.error_id }
            - call: "GET /api/coolers/00000000-0000-4000-8000-0000000000ac"
              as: DispatchAdmin
              captures: { e_co: $.data.error_id }
            - call: "GET /api/donation-offers/00000000-0000-4000-8000-0000000000ad"
              as: DispatchAdmin
              captures: { e_of: $.data.error_id }
            - call: "POST /api/rescue-runs/00000000-0000-4000-8000-0000000000ae/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
              captures: { e_ru: $.data.error_id }
            - call: "POST /api/strike-reports/00000000-0000-4000-8000-0000000000af/adjudicate"
              payload: { outcome: "UPHELD" }
              as: DispatchAdmin
              captures: { e_st: $.data.error_id }
          assert:
            - "e_ag == ERR_AGENCY_NOT_FOUND and e_dr == ERR_DRIVER_NOT_FOUND and e_co == ERR_COOLER_NOT_FOUND"
            - "e_of == ERR_OFFER_NOT_FOUND and e_ru == ERR_RUN_NOT_FOUND and e_st == ERR_STRIKE_REPORT_NOT_FOUND"
  # ======================================================== state machines ===
  - section: state_machines
    instances:
      - name: donor_invalid_transition_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DonorSite, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "PENDING_REVIEW -> SUSPENDED is not a declared transition; only ACTIVE -> SUSPENDED is."
        test_recipe:
          setup: ["Donor D in PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "IT Bistro", ein: "100000004", contact_email: "it@bistro.example" }
              as: DispatchAdmin
              captures: { d: $.data.id }
          trigger:
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "SUSPENDED" }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/donor-sites/${d}"
              as: DispatchAdmin
              captures: { d_status: "$.data.status", d_ver: $.data.version }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "d_status == PENDING_REVIEW and d_ver == 1 (rejected transition mutates nothing)"

      - name: donor_deactivate_with_open_offer_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DonorSite]
        distinguishing_aspect: "DEACTIVATED requires zero in-flight offers; cancelling the last OPEN offer unblocks deactivation."
        test_recipe:
          setup: ["Donor D ACTIVE with one SHELF_STABLE offer O in OPEN"]
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Deact Bistro", ein: "100000005", contact_email: "de@bistro.example" }
              as: DispatchAdmin
              captures: { d: $.data.id }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "SHELF_STABLE", estimated_weight_lbs: 5, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
          trigger:
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "DEACTIVATED" }
              as: DispatchAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "CANCELLED" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "DEACTIVATED" }
              as: DispatchAdmin
              captures: { d_status: "$.data.status" }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION while O is OPEN"
            - "d_status == DEACTIVATED after O is CANCELLED"

      - name: offer_terminal_lockdown_and_double_respond_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DonationOffer, state_machines.RescueRun, "errors[ERR_RUN_NOT_IN_EXPECTED_STATE]"]
        distinguishing_aspect: "A CLOSED offer rejects cancel; a VERIFIED run rejects respond — terminal states admit no transitions. Also a second respond after ACCEPT fails (idempotency)."
        test_recipe:
          setup:
            - "SHELF_STABLE rescue fully completed: offer O CLOSED, run R VERIFIED (pickup 10:15Z, arrival 13:15Z, actual 40 lbs; no temperature fields for non-cold-chain)"
            - "A second run R2 on offer O2 is CONFIRMED (same driver/agency, second window 13:00-15:00Z, offer window 13:15-14:15Z)"
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "Lock Bistro", ein: "100000006", contact_email: "lk@bistro.example" }
              as: DispatchAdmin
              captures: { d: $.data.id }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/recipient-agencies"
              payload: { name: "AG", accepts_categories: ["SHELF_STABLE"], capacity_cold_held_lbs: 0, capacity_hot_held_lbs: 0, capacity_produce_lbs: 0, capacity_shelf_stable_lbs: 100 }
              as: DispatchAdmin
              captures: { ag: $.data.id }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 0 }
              as: DispatchAdmin
              captures: { v1: $.data.id }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T13:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T13:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "SHELF_STABLE", estimated_weight_lbs: 40, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: DispatchAdmin
            - call: "GET /api/donation-offers/${o}"
              as: DispatchAdmin
              captures: { ov: $.data.version }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o}", expected_offer_version: "${ov}", driver_id: "${v1}", agency_id: "${ag}" }
              as: DispatchAdmin
              captures: { r: $.data.id }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T13:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-delivery"
              payload: { arrival_time: "2026-08-02T13:15:00Z", actual_weight_lbs: 40 }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/rescue-runs/${r}/verify-delivery"
              as: AgencyCoordinator
              as_user_id: "${ag}"
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "SHELF_STABLE", estimated_weight_lbs: 10, pickup_window_start: "2026-08-02T13:15:00Z", pickup_window_end: "2026-08-02T14:15:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o2: $.data.id }
            - call: "PATCH /api/donation-offers/${o2}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "GET /api/donation-offers/${o2}"
              as: DispatchAdmin
              captures: { ov2: $.data.version }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o2}", expected_offer_version: "${ov2}", driver_id: "${v1}", agency_id: "${ag}" }
              as: DispatchAdmin
              captures: { r2: $.data.id }
            - call: "POST /api/rescue-runs/${r2}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
          trigger:
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "CANCELLED" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { e_cancel: $.data.error_id }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "DECLINE" }
              as: VolunteerDriver
              as_user_id: "${v1}"
              captures: { e_term: $.data.error_id }
            - call: "POST /api/rescue-runs/${r2}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
              captures: { e_twice: $.data.error_id }
          assert:
            - "e_cancel == ERR_INVALID_STATE_TRANSITION (CLOSED is terminal for offers)"
            - "e_term == ERR_RUN_NOT_IN_EXPECTED_STATE (VERIFIED is terminal for runs)"
            - "e_twice == ERR_RUN_NOT_IN_EXPECTED_STATE (second respond after ACCEPT is a no-op rejection, not a silent success)"

      - name: verify_before_delivery_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RescueRun]
        distinguishing_aspect: "verify-delivery requires run_status == DELIVERED; calling it on a PICKED_UP run fails and leaves both status dimensions untouched."
        test_recipe:
          setup: ["Cold-chain run R PICKED_UP (pickup 2026-08-02T10:15Z @35.0F; est 50)"]
          setup_api_calls:
            - call: "POST /api/donor-sites"
              payload: { legal_name: "VB Bistro", ein: "100000007", contact_email: "vb@bistro.example" }
              as: DispatchAdmin
              captures: { d: $.data.id }
            - call: "PATCH /api/donor-sites/${d}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/recipient-agencies"
              payload: { name: "AG", accepts_categories: ["COLD_HELD"], capacity_cold_held_lbs: 100, capacity_hot_held_lbs: 0, capacity_produce_lbs: 0, capacity_shelf_stable_lbs: 0 }
              as: DispatchAdmin
              captures: { ag: $.data.id }
            - call: "POST /api/volunteer-drivers"
              payload: { full_name: "V One", email: "v1@example.com", vehicle_capacity_lbs: 500, cooler_slot_count: 2, cold_chain_certified: true }
              as: DispatchAdmin
              captures: { v1: $.data.id }
            - call: "PATCH /api/volunteer-drivers/${v1}/status"
              payload: { target_status: "ACTIVE" }
              as: DispatchAdmin
            - call: "POST /api/volunteer-drivers/${v1}/availability-windows"
              payload: { window_start: "2026-08-02T09:00:00Z", window_end: "2026-08-02T15:00:00Z" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/coolers"
              payload: { label: "C1", capacity_liters: 30 }
              as: DispatchAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donation-offers"
              payload: { donor_site_id: "${d}", food_category: "COLD_HELD", estimated_weight_lbs: 50, pickup_window_start: "2026-08-02T10:00:00Z", pickup_window_end: "2026-08-02T12:00:00Z" }
              as: DonorCoordinator
              as_user_id: "${d}"
              captures: { o: $.data.id }
            - call: "PATCH /api/donation-offers/${o}/status"
              payload: { target_status: "OPEN" }
              as: DonorCoordinator
              as_user_id: "${d}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:30:00Z" }
              as: DispatchAdmin
            - call: "GET /api/donation-offers/${o}"
              as: DispatchAdmin
              captures: { ov: $.data.version }
            - call: "POST /api/rescue-runs"
              payload: { offer_id: "${o}", expected_offer_version: "${ov}", driver_id: "${v1}", agency_id: "${ag}", cooler_ids: ["${c1}"] }
              as: DispatchAdmin
              captures: { r: $.data.id }
            - call: "POST /api/rescue-runs/${r}/respond"
              payload: { decision: "ACCEPT" }
              as: VolunteerDriver
              as_user_id: "${v1}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:15:00Z" }
              as: DispatchAdmin
            - call: "POST /api/rescue-runs/${r}/record-pickup"
              payload: { pickup_time: "2026-08-02T10:15:00Z", pickup_temp_f: 35.0, attestation_confirmed: true }
              as: VolunteerDriver
              as_user_id: "${v1}"
          trigger:
