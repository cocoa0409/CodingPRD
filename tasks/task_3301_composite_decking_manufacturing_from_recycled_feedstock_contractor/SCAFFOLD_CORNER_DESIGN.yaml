# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3301_composite_decking_manufacturing_from_recycled_feedstock_contractor
#
# Breadth probe over §1.1–§1.7 claims not covered by §1.8. Corners already
# exercised by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: plant_create_returns_defaults_and_zeroed_stores
        claim_type: Creation
        grounds:
          - entities.Plant
          - endpoints.POST_/decking/plants
        distinguishing_aspect: "Creating a plant returns 201 with version 1, zeroed resin_store/fg_store/reserved_fg_store, and season_posture derived from the logical clock — never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the startup default; no clock call needed). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 2, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id }
          assert:
            - "response status 201; Plant.${plant_id}.version == 1"
            - "Plant.${plant_id}.resin_store == { VIRGIN_PE: 0, REPRO_PE: 0, PCR_FILM: 0, WOOD_FLOUR: 0 }"
            - "Plant.${plant_id}.season_posture == SELLING (09-01 is outside 01-01..02-28)"
            - "id, created_at, updated_at present and server-generated"

      - name: plant_create_at_preseason_end_boundary_is_preseason
        claim_type: Computed Fields
        grounds:
          - entities.Plant.fields.season_posture
          - calculations.season_posture
        distinguishing_aspect: "Window-end day itself is PRE_SEASON (inclusive end); the next day is SELLING."
        test_recipe:
          setup:
            - "Logical clock 2026-02-28T12:00:00Z."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-28T12:00:00Z" }
              as: OpsManager
          trigger:
            - call: "POST /decking/plants"
              payload: { name: "Fernley", daily_capacity_lf: 5000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id }
          assert:
            - "Plant.${plant_id}.season_posture == PRE_SEASON (02-28 equals the inclusive window end)"

      - name: supplier_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/decking/suppliers/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A well-formed but unallocated UUID yields 404 ERR_NOT_FOUND, not 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /decking/suppliers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: QualityEngineer
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 404 and error_id == ERR_NOT_FOUND"

      - name: product_line_create_missing_formulation_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ProductLine.fields.formulation_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting required formulation_id is a 400 ERR_INVALID_REQUEST, distinct from the 422 ERR_REFERENCED_NOT_FOUND a dangling-but-present FK yields."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16 }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"

      - name: product_line_create_dangling_formulation_returns_referenced_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ProductLine.fields.formulation_id
          - validations[priority=4]
          - errors.ERR_REFERENCED_NOT_FOUND
        distinguishing_aspect: "A present-but-dangling formulation_id is 422 ERR_REFERENCED_NOT_FOUND, a different check from the missing-field 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "00000000-0000-4000-8000-000000000000" }
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 422 and error_id == ERR_REFERENCED_NOT_FOUND"

      - name: contractor_email_uniqueness_enforced
        claim_type: Type Constraints
        grounds:
          - entities.Contractor.fields.email
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A second contractor application with the same email is rejected 400 ERR_INVALID_REQUEST (unique constraint)."
        test_recipe:
          setup:
            - "One contractor already applied with email a@build.example."
          setup_api_calls:
            - call: "POST /decking/contractors"
              payload: { name: "Pro A", email: "a@build.example" }
              as: ProgramAdmin
          trigger:
            - call: "POST /decking/contractors"
              payload: { name: "Pro A2", email: "a@build.example" }
              as: ProgramAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"

      - name: run_kind_defaults_to_sellable
        claim_type: Defaults
        grounds:
          - entities.ProductionRun.fields.run_kind
        distinguishing_aspect: "Omitting run_kind on run creation stores the default SELLABLE; the completed run's lot lands in fg_store."
        test_recipe:
          setup:
            - "Plant, ACTIVE formulation and product line."
          setup_api_calls:
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 100, production_date: "2026-09-01", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run_id: $.data.id }
          assert:
            - "ProductionRun.${run_id}.run_kind == SELLABLE (default applied)"

      - name: repair_support_only_defaults_false
        claim_type: Defaults
        grounds:
          - entities.ProductLine.fields.repair_support_only
        distinguishing_aspect: "Omitting repair_support_only stores false; SELLABLE runs and orders remain allowed on the ACTIVE line."
        test_recipe:
          setup:
            - "ACTIVE formulation."
          setup_api_calls:
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 10000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
          trigger:
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
          assert:
            - "ProductLine.${line_id}.repair_support_only == false"

      - name: dealer_list_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints.GET_/decking/dealers/{id}/shipment-orders
        distinguishing_aspect: "List responses carry limit/offset/total_count/has_more with defaults limit 10 offset 0; the second page of an 11-row dealer order list reports has_more false and total_count 11."
        test_recipe:
          setup:
            - "One dealer with eleven REQUESTED shipment orders."
          setup_api_calls:
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 100000000 }
              as: ChannelManager
              captures: { dealer_id: $.data.id }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 10000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-03-02" }
              as: DealerSalesRep
          trigger:
            - call: "GET /decking/dealers/${dealer_id}/shipment-orders"
              payload: {}
              as: DealerSalesRep
          assert:
            - "response_type == array; total_count == 11; first page returns 10 rows with has_more == true"
            - "offset=10 returns exactly 1 row with has_more == false and total_count == 11"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: feedstock_lot_starts_in_quarantine
        claim_type: initial_state
        grounds:
          - state_machines.FeedstockLot
        distinguishing_aspect: "A newly registered lot is QUARANTINE and contributes nothing to resin_store until released."
        test_recipe:
          setup:
            - "Plant and supplier exist."
          setup_api_calls:
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 500, received_date: "2026-09-01", moisture_pct: 5.0, contamination_ppm: 100, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_id: $.data.id }
          assert:
            - "FeedstockLot.${lot_id}.status == QUARANTINE"
            - "Plant.${plant_id}.resin_store.WOOD_FLOUR == 0 (quarantine adds no stock)"

      - name: rejected_lot_is_terminal_and_reject_twice_fails
        claim_type: invalid_transition
        grounds:
          - state_machines.FeedstockLot
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "REJECTED is terminal: a second reject on the same lot fails 409 ERR_INVALID_STATE and the supplier reliability is not recomputed twice for one lot."
        test_recipe:
          setup:
            - "One lot already REJECTED."
          setup_api_calls:
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 500, received_date: "2026-09-01", moisture_pct: 5.0, contamination_ppm: 100, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_id: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot_id}/reject"
              payload: {}
              as: QualityEngineer
          trigger:
            - call: "POST /decking/feedstock-lots/${lot_id}/reject"
              payload: {}
              as: QualityEngineer
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_INVALID_STATE"
            - "Supplier.${sup_id}.reliability_score_bp == 0 (one rejected lot out of one total; not recomputed a second time)"

      - name: discontinue_blocked_by_open_orders
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductLine.ACTIVE_to_DISCONTINUED
          - errors.ERR_LINE_HAS_OPEN_ORDERS
        distinguishing_aspect: "A REQUESTED order on the line blocks discontinuation; cancelling the order unblocks it."
        test_recipe:
          setup:
            - "ACTIVE line with one REQUESTED order."
          setup_api_calls:
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 10000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Vintage", color: "Red", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/dealers"
              payload: { name: "Dealer D", territory_code: "VA-N", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { dealer_id: $.data.id }
            - call: "POST /decking/shipment-orders"
              payload: { dealer_id: "${dealer_id}", product_line_id: "${line_id}", lf: 10, ship_week_start: "2026-09-07" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /decking/product-lines/${line_id}/discontinue"
              payload: {}
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_LINE_HAS_OPEN_ORDERS"
            - "ProductLine.${line_id}.status remains ACTIVE"

      - name: sunset_blocked_by_remaining_finished_goods
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductLine.REPAIRED_SUPPORTED_to_SUNSET
          - errors.ERR_LINE_STOCK_REMAINS
        distinguishing_aspect: "fg_store > 0 for the line blocks sunset even with no open claims."
        test_recipe:
          setup:
            - "REPAIRED_SUPPORTED line with fg_store 100 lf from an earlier SELLABLE run; no registrations or claims."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Vintage", color: "Red", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/suppliers"
              payload: { name: "Sup S", kind: "BROKER" }
              as: QualityEngineer
              captures: { sup_id: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "VIRGIN_PE", weight_lbs: 500, received_date: "2026-02-20", moisture_pct: 1.0, contamination_ppm: 10, melt_flow_index: 0.7, certificate_ref: "C-1" }
              as: QualityEngineer
              captures: { lot_pe: $.data.id }
            - call: "POST /decking/feedstock-lots"
              payload: { supplier_id: "${sup_id}", material: "WOOD_FLOUR", weight_lbs: 500, received_date: "2026-02-20", moisture_pct: 5.0, contamination_ppm: 100, certificate_ref: "C-2" }
              as: QualityEngineer
              captures: { lot_wf: $.data.id }
            - call: "POST /decking/feedstock-lots/${lot_pe}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/feedstock-lots/${lot_wf}/release"
              payload: { release_disposition: "PRODUCTION" }
              as: QualityEngineer
            - call: "POST /decking/plants/${plant_id}/production-runs"
              payload: { product_line_id: "${line_id}", planned_lf: 100, production_date: "2026-03-01", run_kind: "SELLABLE", expected_plant_version: "${plant_v0}" }
              as: OpsManager
              captures: { run_id: $.data.id }
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/start"
              payload: {}
              as: OpsManager
            - call: "POST /decking/plants/${plant_id}/production-runs/${run_id}/complete"
              payload: { actual_lf: 100 }
              as: OpsManager
            - call: "POST /decking/product-lines/${line_id}/discontinue"
              payload: {}
              as: ProductManager
            - call: "POST /decking/product-lines/${line_id}/set-repair-support"
              payload: { repair_support_only: true }
              as: ProductManager
          trigger:
            - call: "POST /decking/product-lines/${line_id}/sunset"
              payload: {}
              as: ProductManager
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_LINE_STOCK_REMAINS"
            - "ProductLine.${line_id}.status remains REPAIRED_SUPPORTED"

      - name: certification_rejected_with_stale_module_version
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Contractor.IN_TRAINING_to_CERTIFIED
          - errors.ERR_STALE_TRAINING
        distinguishing_aspect: "A module re-versioned after the contractor passed it invalidates the pass for certification: certify fails ERR_STALE_TRAINING; passing the new version fixes it."
        test_recipe:
          setup:
            - "Contractor passed module M at version 1; M re-versioned to 2."
          setup_api_calls:
            - call: "POST /decking/contractors"
              payload: { name: "Pro A", email: "a@build.example" }
              as: ProgramAdmin
              captures: { contractor_id: $.data.id }
            - call: "POST /decking/training-modules"
              payload: { title: "Install Basics", version_no: 1, duration_hours: 4.0, required_for_tier: "SILVER" }
              as: ProgramAdmin
              captures: { module_id: $.data.id }
            - call: "POST /decking/training-records"
              payload: { contractor_id: "${contractor_id}", module_id: "${module_id}" }
              as: Contractor
              as_user_id: "${contractor_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /decking/training-records/${tr_id}/pass"
              payload: {}
              as: ProgramAdmin
            - call: "POST /decking/training-modules/${module_id}/re-version"
              payload: { duration_hours: 5.0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /decking/contractors/${contractor_id}/certify"
              payload: {}
              as: ProgramAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_STALE_TRAINING"
            - "Contractor.${contractor_id}.status remains IN_TRAINING"
            - "TrainingModule.${module_id}.version_no == 2"

      - name: run_complete_overage_boundary
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
          - errors.ERR_OVERAGE_LIMIT
        distinguishing_aspect: "actual_lf exactly at 110% of planned succeeds; one foot above fails ERR_OVERAGE_LIMIT."
        test_recipe:
          setup:
            - "RUNNING run planned_lf 1000."
          setup_api_calls:
            - call: "POST /decking/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OpsManager
            - call: "POST /decking/plants"
              payload: { name: "Winchester", daily_capacity_lf: 10000, lines: 1, pre_season_window_start: "01-01", pre_season_window_end: "02-28" }
              as: OpsManager
              captures: { plant_id: $.data.id, plant_v0: $.data.version }
            - call: "POST /decking/formulations"
              payload: { name: "F1", lines: [{ material: "VIRGIN_PE", weight_fraction_bp: 5000 }, { material: "WOOD_FLOUR", weight_fraction_bp: 5000 }] }
              as: ProcessEngineer
              captures: { form_id: $.data.id }
            - call: "POST /decking/formulations/${form_id}/activate"
              payload: {}
              as: ProcessEngineer
            - call: "POST /decking/product-lines"
              payload: { name: "Transcend", color: "Grey", capped: false, profile: "GROOVED", emboss: "WOODGRAIN", board_length_ft: 16, formulation_id: "${form_id}" }
              as: ProductManager
              captures: { line_id: $.data.id }
            - call: "POST /decking/suppliers"
