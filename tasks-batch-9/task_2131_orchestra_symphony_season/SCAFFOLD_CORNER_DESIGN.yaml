# =============================================================================
# Task 2131 — §1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_concert_returns_201_with_all_three_status_dimensions
        claim_type: Creation
        grounds: ["endpoints[POST /orchestra/concerts]", "entities.Concert.fields.programming_status"]
        distinguishing_aspect: "A concert created with every required field returns 201 and echoes programming_status DRAFT, sale_status UNANNOUNCED, performance_status SCHEDULED, readiness_posture READY and version 1."
        test_recipe:
          setup: ["A season and a venue with one ORCHESTRA section of 100 seats exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
          trigger:
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 105 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Concert.${c1}.programming_status == DRAFT"
            - "Concert.${c1}.sale_status == UNANNOUNCED"
            - "Concert.${c1}.performance_status == SCHEDULED"
            - "Concert.${c1}.readiness_posture == READY"
            - "Concert.${c1}.version == 1"
            - "Concert.${c1}.section_inventory has exactly 1 element with seat_section_id == ${sec_orch}, capacity 100, held_count 0, sold_count 0, available_count 100, fill_bp 0, demand_band LOW"

      - name: section_inventory_is_snapshotted_and_not_retrofitted
        claim_type: Parent Relationships
        grounds: ["endpoints[POST /orchestra/sections]", "entities.Concert.fields.section_inventory"]
        distinguishing_aspect: "A SeatSection created AFTER a concert exists never appears in that concert's section_inventory, while a concert created afterwards carries both sections."
        test_recipe:
          setup: ["A venue with one BALCONY section and one concert already created against it"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "BALCONY", capacity: 50, price_multiplier_bp: 8000, donor_priority_rank: 4 }
              as: ArtisticAdmin
              captures: { sec_balc: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Early Concert", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
              captures: { sec_orch: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Late Concert", performance_start_utc: "2026-12-05T19:30:00Z", performance_end_utc: "2026-12-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c2: "$.data.id" }
          assert:
            - "Concert.${c1}.section_inventory has exactly 1 element and it is ${sec_balc}"
            - "Concert.${c2}.section_inventory has exactly 2 elements, ${sec_balc} and ${sec_orch}"
            - "Venue.${v1}.total_capacity == 150"

      - name: venue_and_union_defaults_applied_when_omitted
        claim_type: Defaults
        grounds: ["entities.Venue.fields.changeover_buffer_minutes", "entities.UnionAgreement.fields.max_service_minutes", "entities.SeatSection.fields.min_renewal_priority_score"]
        distinguishing_aspect: "Omitting changeover_buffer_minutes yields 60, omitting the union tuning fields yields max_service_minutes 150 / overtime 400 / rest 90 / max_services_per_day 2 / doubling 1250 / break 20 / principal 2000, and omitting min_renewal_priority_score yields 0."
        test_recipe:
          setup: ["An empty database with the clock pinned"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/venues"
              payload: { name: "Bare Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
              captures: { sec1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
              captures: { ua1: "$.data.id" }
          assert:
            - "Venue.${v1}.changeover_buffer_minutes == 60"
            - "SeatSection.${sec1}.min_renewal_priority_score == 0"
            - "UnionAgreement.${ua1}.max_service_minutes == 150"
            - "UnionAgreement.${ua1}.overtime_rate_cents_per_minute == 400"
            - "UnionAgreement.${ua1}.min_rest_minutes_between_services == 90"
            - "UnionAgreement.${ua1}.max_services_per_day == 2"
            - "UnionAgreement.${ua1}.doubling_premium_bp == 1250"
            - "UnionAgreement.${ua1}.mandatory_break_minutes == 20"
            - "UnionAgreement.${ua1}.principal_premium_bp == 2000"
            - "Season.${s1}.loyalty_discount_bp == 500"

      - name: patron_system_fields_start_at_zero_and_are_server_owned
        claim_type: System Fields
        grounds: ["entities.Patron.fields.donor_level", "entities.Patron.fields.credit_balance_cents", "entities.Patron.fields.lifetime_cash_in_cents"]
        distinguishing_aspect: "A freshly registered patron carries donor_level NONE, lifetime_donation_cents 0, credit_balance_cents 0, lifetime_cash_in_cents 0 and consecutive_renewal_years 0, all server-minted rather than supplied."
        test_recipe:
          setup: ["An empty database with the clock pinned"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoxOfficeAgent
          trigger:
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test", subscriber_since_year: 2018 }
              as: BoxOfficeAgent
              captures: { p1: "$.data.id" }
          assert:
            - "Patron.${p1}.donor_level == NONE"
            - "Patron.${p1}.lifetime_donation_cents == 0"
            - "Patron.${p1}.credit_balance_cents == 0"
            - "Patron.${p1}.lifetime_cash_in_cents == 0"
            - "Patron.${p1}.consecutive_renewal_years == 0"
            - "Patron.${p1}.renewal_priority_score == 80  (2026 clock year minus 2018, times 10)"
            - "Patron.${p1}.version == 1"

      - name: venue_total_capacity_is_computed_from_sections
        claim_type: Computed Fields
        grounds: ["entities.Venue.fields.total_capacity", "endpoints[POST /orchestra/sections]"]
        distinguishing_aspect: "Venue.total_capacity is recomputed on every section creation: 100 then 150, and is never an input the caller can set."
        test_recipe:
          setup: ["An empty database with the clock pinned"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall", changeover_buffer_minutes: 60 }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "BALCONY", capacity: 50, price_multiplier_bp: 8000, donor_priority_rank: 4 }
              as: ArtisticAdmin
            - call: "GET /orchestra/venues/${v1}"
              payload: {}
              as: ArtisticAdmin
              captures: { cap: "$.data.total_capacity" }
          assert:
            - "${cap} == 150"
            - "GET /orchestra/sections?venue_id=${v1} returns total_count == 2"

      - name: concert_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints[GET /orchestra/concerts]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /orchestra/concerts?season_id=...&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One season with three concerts at the same venue"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "C1", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "C2", performance_start_utc: "2026-12-05T19:30:00Z", performance_end_utc: "2026-12-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "C3", performance_start_utc: "2027-01-05T19:30:00Z", performance_end_utc: "2027-01-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
          trigger:
            - call: "GET /orchestra/concerts"
              payload: { season_id: "${s1}", limit: 2, offset: 0 }
              as: ArtisticAdmin
            - call: "GET /orchestra/concerts"
              payload: { season_id: "${s1}", limit: 2, offset: 2 }
              as: ArtisticAdmin
          assert:
            - "First response data array length == 2, meta total_count == 3, has_more == true"
            - "Second response data array length == 1, total_count == 3, has_more == false"
            - "response_type == array on both"

      - name: engagement_junction_resolves_both_directions
        claim_type: Retrieval
        grounds: ["entities.MusicianEngagement.fields.service_id", "entities.MusicianEngagement.fields.musician_id", "endpoints[GET /orchestra/engagements]"]
        distinguishing_aspect: "MusicianEngagement is a genuine many-to-many junction: filtering by service_id returns the two musicians on that service and filtering by musician_id returns the two services that musician plays."
        test_recipe:
          setup:
            - "One PROGRAMMED concert with two DRAFT services on different days and two roster musicians"
            - "Both musicians are engaged on service A; musician 1 is also engaged on service B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
            - call: "POST /orchestra/musicians"
              payload: { full_name: "Pia Solberg", instrument: "VIOLIN" }
              as: OrchestraManager
              captures: { m1: "$.data.id" }
            - call: "POST /orchestra/musicians"
              payload: { full_name: "Tomas Reiner", instrument: "CELLO" }
              as: OrchestraManager
              captures: { m2: "$.data.id" }
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T14:00:00Z", scheduled_end_utc: "2026-11-04T16:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { svA: "$.data.id" }
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "DRESS_REHEARSAL", scheduled_start_utc: "2026-11-05T14:00:00Z", scheduled_end_utc: "2026-11-05T16:00:00Z", minimum_complement: 0, break_minutes: 20 }
              as: OrchestraManager
              captures: { svB: "$.data.id" }
          trigger:
            - call: "POST /orchestra/rehearsals/${svA}/engagements"
              payload: { musician_id: "${m1}" }
              as: OrchestraManager
            - call: "POST /orchestra/rehearsals/${svA}/engagements"
              payload: { musician_id: "${m2}" }
              as: OrchestraManager
            - call: "POST /orchestra/rehearsals/${svB}/engagements"
              payload: { musician_id: "${m1}" }
              as: OrchestraManager
          assert:
            - "GET /orchestra/engagements?service_id=${svA} returns total_count == 2"
            - "GET /orchestra/engagements?musician_id=${m1} returns total_count == 2"
            - "GET /orchestra/engagements?musician_id=${m2} returns total_count == 1"
            - "RehearsalService.${svA}.confirmed_engagement_count == 2"

      - name: create_concert_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting program_minutes on POST /orchestra/concerts returns ERR_INVALID_REQUEST with HTTP 422 and creates nothing."
        test_recipe:
          setup: ["A season and a venue exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Nameless", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z" }
              as: ArtisticAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "GET /orchestra/concerts?season_id=${s1} returns total_count == 0"

      - name: create_service_with_non_increasing_times_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_REQUEST]", "entities.RehearsalService.fields.scheduled_end_utc"]
        distinguishing_aspect: "scheduled_end_utc equal to scheduled_start_utc is rejected with ERR_INVALID_REQUEST (422); the pair must be strictly increasing."
        test_recipe:
          setup: ["A PROGRAMMED concert exists at a venue"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${s1}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "ORCHESTRA", capacity: 100, price_multiplier_bp: 15000, donor_priority_rank: 1 }
              as: ArtisticAdmin
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${s1}", venue_id: "${v1}", title: "Opening Night", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /orchestra/concerts/${c1}/program"
              payload: {}
              as: ArtisticAdmin
          trigger:
            - call: "POST /orchestra/rehearsals"
              payload: { concert_id: "${c1}", venue_id: "${v1}", service_type: "REHEARSAL", scheduled_start_utc: "2026-11-04T14:00:00Z", scheduled_end_utc: "2026-11-04T14:00:00Z", minimum_complement: 0, break_minutes: 0 }
              as: OrchestraManager
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "GET /orchestra/rehearsals?concert_id=${c1} returns total_count == 0"

      - name: duplicate_patron_email_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "entities.Patron.fields.email", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A second patron registered with an email already in use returns ERR_INVALID_REQUEST (422) and leaves exactly one patron row."
        test_recipe:
          setup: ["One patron already registered as noel@patron.test"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoxOfficeAgent
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /orchestra/patrons"
              payload: { full_name: "Noel Vance Junior", email: "noel@patron.test" }
              as: BoxOfficeAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 422"
            - "GET /orchestra/patrons/${p1} still returns full_name == Noel Vance"

      - name: renewal_chain_is_discoverable_through_self_referential_fk
        claim_type: Retrieval
        grounds: ["entities.SubscriptionPackage.fields.prior_package_id", "endpoints[GET /orchestra/subscriptions]"]
        distinguishing_aspect: "GET /orchestra/subscriptions?prior_package_id=<prior> returns exactly the one RENEWAL package that renews it, proving the self-referential FK is reverse-reachable."
        test_recipe:
          setup:
            - "Season 2027 in RENEWAL_WINDOW with one PROGRAMMED concert; patron holds an ACTIVE 1-seat BALCONY package on it"
            - "Season 2028 in RENEWAL_WINDOW with one PROGRAMMED concert at the same hall"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ArtisticAdmin
            - call: "POST /orchestra/seasons"
              payload: { name: "2027 Season", fiscal_year: 2027, renewal_deadline_utc: "2026-10-01T00:00:00Z", base_ticket_price_cents: 6000 }
              as: ArtisticAdmin
              captures: { sA: "$.data.id" }
            - call: "POST /orchestra/union-agreements"
              payload: { season_id: "${sA}", scale_service_fee_cents: 20000 }
              as: OrchestraManager
            - call: "POST /orchestra/venues"
              payload: { name: "Grand Hall" }
              as: ArtisticAdmin
              captures: { v1: "$.data.id" }
            - call: "POST /orchestra/sections"
              payload: { venue_id: "${v1}", name: "BALCONY", capacity: 50, price_multiplier_bp: 8000, donor_priority_rank: 4, min_renewal_priority_score: 0 }
              as: ArtisticAdmin
              captures: { sec_balc: "$.data.id" }
            - call: "POST /orchestra/concerts"
              payload: { season_id: "${sA}", venue_id: "${v1}", title: "A1", performance_start_utc: "2026-11-05T19:30:00Z", performance_end_utc: "2026-11-05T21:30:00Z", program_minutes: 100 }
              as: ArtisticAdmin
              captures: { cA1: "$.data.id" }
            - call: "POST /orchestra/concerts/${cA1}/program"
