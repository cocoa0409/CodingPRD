  - rule_id: boundary_precision_check
    instances:
      - name: conformity_ratio_exactly_at_threshold_conforms
        grounds:
          - calculations.conformity_ratio
          - entities.InUseComplianceResult.fields.conformity_ratio
          - entities.EngineFamily.fields.in_use_compliance_status
        distinguishing_aspect: |
          Metric: conformity ratio. 9/10 rounds to exactly 0.9000 and the
          >= 0.9 comparison is boundary-inclusive, so the outcome is
          CONFORMING, while 8/9 = 0.8889 is NON_CONFORMING — one unit of
          sample mass flips the family's compliance posture. Metric and
          endpoint (in-use-results) differ from the core-return-date instance.
        test_recipe:
          setup:
            - "Logical clock 2027-06-01T00:00:00Z; family IN_PRODUCTION."
          setup_api_calls:
            - *c_clock0
            - *c_std
            - *c_std_pub
            - *c_fam
            - *c_spec
            - *c_cal
            - *c_act
            - *c_bt
            - *c_ftp
            - *c_ftp_rec
            - *c_ftp_rev
            - *c_rmc
            - *c_rmc_rec
            - *c_rmc_rev
            - *c_set
            - *c_set_rec
            - *c_set_rev
            - *c_submit
            - *c_cert
            - *c_eip
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /emissions/engine-families/${fam_id}/in-use-results"
              payload: { test_period_label: "2027-MY-Q2", sample_size: 10, passing_units: 9 }
              as: RegulatoryOfficer
              captures: { iur_a_ratio: $.data.conformity_ratio, iur_a_outcome: $.data.outcome }
            - call: "POST /emissions/engine-families/${fam_id}/in-use-results"
              payload: { test_period_label: "2027-MY-Q3", sample_size: 9, passing_units: 8 }
              as: RegulatoryOfficer
              captures: { iur_b_ratio: $.data.conformity_ratio, iur_b_outcome: $.data.outcome }
          assert:
            - "first result: conformity_ratio == 0.9 exactly (round_half_up(9/10, 4)) and outcome == CONFORMING via ${iur_a_ratio}/${iur_a_outcome} — boundary is inclusive"
            - "second result: conformity_ratio == 0.8889 (round_half_up(8/9, 4)) and outcome == NON_CONFORMING via ${iur_b_ratio}/${iur_b_outcome}"
            - "EngineFamily.${fam_id}.in_use_compliance_status == CONFORMING after the first record and == NON_CONFORMING after the second (latest record stamps the family)"

