          - state_machines.LeaseAssignment.ACTIVE_to_SUSPENDED
          - calculations.bank_posture
        distinguishing_aspect: >-
          The depth-4 cascade from one violated condition through the right and
          its active leases to the account's FROZEN posture, including the
          committed/leased_out swap that keeps available_credit_af unchanged.
        excluded_because:
          difficulty_instance: condition_violation_suspension_cascade
          rationale: >-
            The §1.8 instance already drives POST /approval-conditions/{id}/violate
            end to end and asserts every link of the cascade (condition VIOLATED,
            right SUSPENDED with the 12-point penalty, ACTIVE lease SUSPENDED, the
            leased_out -> committed swap with available_credit_af held constant,
            suspended_lease_count 1 and posture FROZEN dominating RESTRICTED).
            Repeating it here as a breadth instance would add no new
            discrimination; the corner design instead covers the OPPOSITE leg —
            the cure and reinstatement path in
            sm_approval_condition_cure_leg_unlocks_water_right_reinstatement.

      - name: sm_protest_resolution_clearance_cascade_finalizes_the_analysis
        claim_type: side_effect_execution
        grounds:
          - state_machines.Protest.IN_NEGOTIATION_to_RESOLVED_STIPULATED
          - state_machines.TransferApplication.UNDER_PROTEST_to_READY_FOR_DECISION
          - state_machines.InjuryAnalysis.DRAFT_to_FINALIZED
        distinguishing_aspect: >-
          The resolution path into the clearance cascade, where the NEGOTIATION
          stipulation also feeds offset_af back into the injury recomputation
          before the analysis is frozen.
        excluded_because:
          difficulty_instance: protest_clearance_finalization_cascade
          rationale: >-
            The §1.8 instance already drives POST /protests/{id}/resolve for the
            last unresolved protest and asserts links 3-5 (counter to 0,
            application auto-transition to READY_FOR_DECISION, analysis FINALIZED
            with the recomputed offset, pending_review_count decrement). The
            corner design covers the structurally different clearance trigger
            instead — withdrawal, which grants no offset — in
            sm_protest_withdrawal_of_the_last_protest_finalizes_the_application.

      - name: sm_initial_states_are_server_chosen_and_status_input_ignored
        claim_type: initial_state
        grounds:
          - state_machines.WaterRight
          - state_machines.PointOfDiversion
          - state_machines.AdjudicationClaim
          - state_machines.DecreeDocket
          - entities.WaterBankAccount.posture
        distinguishing_aspect: >-
          Every machine's entry state is server-chosen and unforgeable, and three of
          them are counter-intuitive: a PointOfDiversion created AFTER its right is
          already ACTIVE still enters PROPOSED (the authorization cascade fires only at
          activation time, it is not a standing rule); an AdjudicationClaim enters two
          independent axes at once (FILED, UNVERIFIED); and a brand-new WaterBankAccount
          enters RESTRICTED, not OPEN, because 0.00 available credit is below the
          low-credit floor. A supplied status/phase/posture value is ignored.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A exists; a right is activated with one METER record so that a claim can be filed against it."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id", standing_initial: "$.data.standing_status"}}
          trigger:
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000, status: ACTIVE, certified_hcu_af: 500.00}, as: WaterRightsAnalyst, captures: {wr: "$.data.id", right_status: "$.data.status"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/points-of-diversion", payload: {legal_description: "NE1/4 SW1/4 Sec 14 T3S R21E", stream_reach_code: "SNK-14-A", max_rate_cfs: 5.000, stream_miles_from_headwater: 12.00}, as: WaterRightsAnalyst, captures: {pod: "$.data.id", pod_status: "$.data.status"}}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-14", claim_filing_deadline: "2026-04-01T00:00:00Z", phase: DECREE_ENTERED}, as: BasinAdjudicator, captures: {dk: "$.data.id", docket_phase: "$.data.phase"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1901-05-01T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {cm: "$.data.id", filing_initial: "$.data.filing_status", verification_initial: "$.data.verification_status"}}
            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acc: "$.data.id", posture_initial: "$.data.posture"}}
          assert:
            - "WaterRight enters UNADJUDICATED with certified_hcu_af 0.00 despite the payload asking for ACTIVE and 500.00 — supplied system/computed values are ignored, not rejected."
            - "PointOfDiversion enters PROPOSED even though its parent right is already ACTIVE; only POST /water-rights/{id}/activate authorizes PROPOSED headgates, and it has already run."
            - "DecreeDocket enters OPEN_FOR_CLAIMS with claim_count 0, decreed_claim_count 0 and total_decreed_af 0.00, ignoring the requested DECREE_ENTERED phase."
            - "AdjudicationClaim enters BOTH axes at their own initial values simultaneously: filing_status FILED and verification_status UNVERIFIED, with decreed_af 0.00, objection_count 0 and priority_rank null."
            - "WaterBankAccount enters posture RESTRICTED with deposited/committed/leased_out/available all 0.00, because available_credit_af 0.00 is strictly below the 5.00 AF low-credit floor — a naive OPEN default is wrong."
            - "Claimant enters standing_status IN_GOOD_STANDING with outstanding_fee_balance_usd 0.00 and open_application_count 0."
            - "Every created row starts at version 1."

  - section: calculations
    instances:
      - name: calc_hcu_transferable_volume_correct_result
        claim_type: correct_result
        grounds: [calculations.hcu_transferable_volume]
        distinguishing_aspect: >-
          The end-to-end figure for a three-year DIVERSION_BASED study, including
          the pinned round-per-year-then-average order that a single average
          would get wrong by cents.
        excluded_because:
          difficulty_instance: hcu_round_per_year_then_average_order
          rationale: >-
            The §1.8 instance already computes the whole pipeline on
            deliberately un-round inputs and asserts both the correct
            round-per-year-then-average figure and the wrong
            average-then-round-once figure that must NOT appear, plus the
            face-value cap and the final 2-dp rounding. A breadth-level
            correct_result instance over rounder numbers would be strictly
            weaker and add no discrimination.

      - name: calc_hcu_input_set_filtering_excludes_inadmissible_records
        claim_type: input_set_filtering
        grounds: [calculations.hcu_transferable_volume]
        distinguishing_aspect: >-
          Only METER / AERIAL_IMAGERY records with reported_diversion_af > 0 and
          use_year inside the inclusive period are quantified, even though
          AFFIDAVIT and zero rows still count for the forfeiture look-back.
        excluded_because:
          difficulty_instance: hcu_qualifying_set_and_haircut_boundaries
          rationale: >-
            The §1.8 instance already builds a record set that straddles every
            edge of the qualifying predicate (period bounds inclusive on both
            ends, AFFIDAVIT and NONE excluded, reported_diversion_af == 0
            excluded) and pins qualifying_year_count at the 3-versus-2 haircut
            boundary. Re-deriving the same filter here would duplicate it exactly.

      - name: calc_injury_variant_divergence_same_inputs_two_methods
        claim_type: variant_divergence
        grounds: [calculations.injury_net_analysis, complexity_profile.cross_cutting_complexity_layers]
        distinguishing_aspect: >-
          Identical stored inputs (requested_af 100.00, pod_move_miles 4.00, no
          credits) produce materially different figures under the two methods —
          86.48 versus 78.00 — so a single-formula implementation cannot satisfy
          both, and the divergence is visible on two rows of the same application.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A with a DRAFT CHANGE_OF_USE application for 100.00 AF; re-posting an analysis voids the prior DRAFT, so both variants can be computed on the same application with identical inputs."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
