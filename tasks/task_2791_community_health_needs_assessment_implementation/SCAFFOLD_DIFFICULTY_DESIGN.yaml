  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_adjacent_window_rejected_by_thirty_minute_facilitator_buffer
        grounds:
          - calculations.facilitator_buffer_overlap
          - validations.priority_15.ERR_FACILITATOR_WINDOW_CONFLICT
          - entities.StakeholderInterview.fields.facilitator_party_id
        distinguishing_aspect: |
          The facilitator is an EXCLUSIVE resource carrying a 30-minute travel
          buffer, so the conflict test is not plain interval intersection: a
          session butting straight onto the previous one (15:00 start against a
          15:00 end) conflicts, a session starting exactly 30 minutes later
          (15:30) does not, and the buffer is scoped to one facilitator — the
          rejected 15:00 window is accepted immediately when a second internal
          party runs it.
