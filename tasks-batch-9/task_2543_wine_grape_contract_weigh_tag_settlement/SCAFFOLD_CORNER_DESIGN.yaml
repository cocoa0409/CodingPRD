          is inclusive (now >= window_end); an implementation that shares one comparison
          helper gets one of the two wrong. DELINQUENT is also not terminal: priority 26
          keeps a delinquent installment payable, and paying it in full still bubbles the
          contract to CLOSED, so lateness costs the producer nothing structurally.
