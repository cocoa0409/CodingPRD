          difficulty_instance: transitive_cascade / bco_abort_cascade_through_load_to_offer
          rationale: "The multi-hop cascade claim is grounded and asserted in the named §1.8 instance, which walks BCO to Trip to Load to Offer; this corner has no distinct arithmetic to add."

      - name: settlement_reject_clears_derived_allocation_fields
        claim_type: Compensation
        grounds:
          - state_machines.Settlement.transitions.PENDING_APPROVAL_to_DRAFT
        excluded_because:
          difficulty_instance: compensating_invariant / maintenance_withholding_reversal_restores_balance
          rationale: "The compensating-action claim is grounded and asserted in the named §1.8 instance, which pins the conserved quantity explicitly; duplicating it here would repeat the same invariant."

