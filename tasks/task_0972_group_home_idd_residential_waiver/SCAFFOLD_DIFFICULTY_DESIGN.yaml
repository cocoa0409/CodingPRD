            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T12:00:00Z", check_out_at: "2026-06-02T14:30:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v2_id: $.data.id } }
            - { call: "POST /evv-visits/${v1_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v2_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
