              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002", fill_count: 5, fills_at_last_pressure_test: 5 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003", fill_count: 6, fills_at_last_pressure_test: 6 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /float-agreements"
