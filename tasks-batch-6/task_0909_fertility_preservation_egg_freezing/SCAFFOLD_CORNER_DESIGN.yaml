# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of §1.1–§1.7 claims)
# Fertility Preservation & Egg Freezing.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_patient_success
        claim_type: creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /patients with required fields returns 201 with a server-minted id, version 1, and echoes full_name."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /patients", payload: { full_name: "Ada Lovelace", date_of_birth: "1990-12-10T00:00:00Z", email: "ada@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", v: "$.data.version" } }
          assert:
            - "response.status == 201"
            - "response.data.full_name == Ada Lovelace"
            - "response.data.version == 1"

      - name: get_patient_not_found
        claim_type: not_found
        grounds: [entities.Patient]
        distinguishing_aspect: "GET /patients/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /patients/00000000-0000-0000-0000-000000000000", payload: {}, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_consultation_missing_amh_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Consultation.fields.amh_level, "validations[priority=3]"]
        distinguishing_aspect: "POST /consultations without amh_level returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["A patient exists."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P C", date_of_birth: "1990-01-01T00:00:00Z", email: "pc@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, antral_follicle_count: 12 }, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: storage_tank_used_slots_computed_zero
        claim_type: computed_fields
        grounds: [entities.StorageTank.fields.used_slots, entities.StorageTank.fields.is_full]
        distinguishing_aspect: "A freshly created StorageTank has used_slots 0 and is_full false regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /storage-tanks", payload: { name: "T-new", capacity_slots: 5 }, as: Embryologist, captures: { t: "$.data.id", u: "$.data.used_slots" } }
          assert:
            - "response.data.used_slots == 0"
            - "response.data.is_full == false"

      - name: list_consultations_pagination_envelope
        claim_type: listing
        grounds: [endpoints, entities.Consultation]
        distinguishing_aspect: "GET /consultations?patient_id returns response_type array with pagination fields total_count/has_more."
        test_recipe:
          setup: ["A patient with one consultation."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P L", date_of_birth: "1990-01-01T00:00:00Z", email: "pl@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 2.0, antral_follicle_count: 12 }, as: Coordinator }
          trigger:
            - { call: "GET /consultations", payload: { patient_id: "${p_id}", limit: 10, offset: 0 }, as: Coordinator }
          assert:
            - "response.response_type == array"
            - "response.data length == 1"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: revoke_already_revoked_directive_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Directive.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Second revoke on a REVOKED directive returns 409 ERR_INVALID_STATE; no further side effects."
        test_recipe:
          setup: ["Patient with a CONSENT directive already REVOKED."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P R", date_of_birth: "1990-01-01T00:00:00Z", email: "pr@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}", captures: { dir_id: "$.data.id" } }
            - { call: "POST /directives/${dir_id}/revoke", payload: {}, as: Patient, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /directives/${dir_id}/revoke", payload: {}, as: Patient, as_user_id: "${p_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: trigger_from_draft_cycle_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.StimulationCycle.MONITORING_to_TRIGGERED]
        distinguishing_aspect: "Triggering a DRAFT cycle (never scheduled/monitored) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT cycle referencing a not-yet-completed consultation."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr T", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P D", date_of_birth: "1990-01-01T00:00:00Z", email: "pd@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 2.0, antral_follicle_count: 12 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: execute_before_authorize_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ThawTransferAuthorization.AUTHORIZED_to_EXECUTED]
        distinguishing_aspect: "Executing a REQUESTED (not AUTHORIZED) authorization returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REQUESTED thaw authorization (specimen validation is deferred to authorize)."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr U", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Emb U", provider_role: "EMBRYOLOGIST" }, as: PlatformAdmin, captures: { emb1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P E", date_of_birth: "1990-01-01T00:00:00Z", email: "pe@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["11111111-1111-1111-1111-111111111111"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth1}/execute", payload: {}, as: Embryologist, as_user_id: "${emb1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: complete_already_completed_consultation_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Consultation.REQUESTED_to_COMPLETED]
        distinguishing_aspect: "Completing a COMPLETED consultation again returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED consultation."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr V", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P F", date_of_birth: "1990-01-01T00:00:00Z", email: "pf@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 2.0, antral_follicle_count: 12 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # ------------------------------------------------------------ Validations
  - section: validations
    instances:
      - name: early_renew_before_period_end_returns_period_not_elapsed
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", state_machines.StorageSubscription.ACTIVE_to_PAST_DUE]
        distinguishing_aspect: "Renewing an ACTIVE subscription before current_period_end (clock still 2026-05-01) returns 409 ERR_PERIOD_NOT_ELAPSED."
        test_recipe:
          setup: ["Active subscription with period 2026-05-01..2027-05-01; clock at default."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P G", date_of_birth: "1990-01-01T00:00:00Z", email: "pg@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions", payload: { patient_id: "${p_id}" }, as: BillingAdmin, captures: { sub_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions/${sub_id}/record-payment", payload: {}, as: BillingAdmin }
          trigger:
            - { call: "POST /storage-subscriptions/${sub_id}/renew", payload: {}, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PERIOD_NOT_ELAPSED"

      - name: duplicate_active_subscription_returns_duplicate
        claim_type: violation_to_error
        grounds: ["validations[priority=17]"]
        distinguishing_aspect: "Creating a second non-terminal StorageSubscription for the same patient returns 409 ERR_DUPLICATE_ACTIVE_RESOURCE."
        test_recipe:
          setup: ["Patient already has a PENDING_ACTIVATION subscription."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P H", date_of_birth: "1990-01-01T00:00:00Z", email: "ph@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /storage-subscriptions", payload: { patient_id: "${p_id}" }, as: BillingAdmin }
          trigger:
            - { call: "POST /storage-subscriptions", payload: { patient_id: "${p_id}" }, as: BillingAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_ACTIVE_RESOURCE"

      - name: appointment_end_not_after_start_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", entities.MonitoringAppointment.fields.scheduled_end]
        distinguishing_aspect: "Creating an appointment with scheduled_end <= scheduled_start returns 400 ERR_VALIDATION (field validation precedes state/existence)."
        test_recipe:
          setup: ["A DRAFT cycle and a provider exist."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr W", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P I", date_of_birth: "1990-01-01T00:00:00Z", email: "pi@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 2.0, antral_follicle_count: 12 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
          trigger:
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T09:00:00Z" }, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: priority_state_over_temporal_appointment
        claim_type: priority_ordering
        grounds: ["validations[priority=5]", "validations[priority=13]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / appt_state_beats_provider_temporal
          rationale: "The state-vs-temporal precedence is exercised as the named §1.8 priority-conflict instance."

  # ------------------------------------------------------------ Endpoints
  - section: endpoints
    instances:
      - name: cancel_cycle_cascades_appointment_cancellation
        claim_type: side_effect_execution
        grounds: [state_machines.StimulationCycle.MONITORING_to_CANCELLED, entities.MonitoringAppointment.fields.visit_status]
        distinguishing_aspect: "Cancelling a MONITORING cycle sets its SCHEDULED MonitoringAppointment.visit_status to CANCELLED (cascade)."
        test_recipe:
          setup: ["A MONITORING cycle with one SCHEDULED appointment."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr X", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P J", date_of_birth: "1990-01-01T00:00:00Z", email: "pj@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 3.0, antral_follicle_count: 16 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator, captures: { appt_id: "$.data.id" } }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc_id}/cancel", payload: {}, as: Coordinator, captures: { st: "$.data.status" } }
          assert:
            - "StimulationCycle.${cyc_id}.status == CANCELLED"
            - "MonitoringAppointment.${appt_id}.visit_status == CANCELLED"

      - name: fk_reverse_list_specimens_by_tank
        claim_type: side_effect_execution
        grounds: [entities.CryoSpecimen.fields.tank_id, endpoints]
        excluded_because:
          difficulty_instance: transitive_cascade / retrieval_complete_cascade_depth3
          rationale: "Specimen creation and tank linkage are asserted by the named §1.8 cascade instance; the GET /cryo-specimens?tank_id filter is its discovery channel."

  # ------------------------------------------------------------ Errors
  - section: errors
    instances:
      - name: overlapping_retrieval_same_room_returns_room_unavailable
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_UNAVAILABLE]", "validations[priority=14]"]
        distinguishing_aspect: "A second retrieval 08:30-09:30 that truly overlaps an existing 08:00-09:00 booking on the same room returns 409 ERR_ROOM_UNAVAILABLE."
        test_recipe:
          setup: ["cycle1 retrieved 08:00-09:00 in room1; cycle2 triggered."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr Y", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR-R", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T-R", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P K", date_of_birth: "1994-03-01T00:00:00Z", email: "pk@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /consultations/${c1}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c1}" }, as: Coordinator, captures: { cyc1: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc1}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc1}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc1}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc1}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc1}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc1}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 6, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c2: "$.data.id" } }
            - { call: "POST /consultations/${c2}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c2}" }, as: Coordinator, captures: { cyc2: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc2}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc2}", provider_id: "${phys1}", scheduled_start: "2026-05-03T09:00:00Z", scheduled_end: "2026-05-03T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc2}", provider_id: "${phys1}", scheduled_start: "2026-05-03T10:00:00Z", scheduled_end: "2026-05-03T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc2}", provider_id: "${phys1}", scheduled_start: "2026-05-03T11:00:00Z", scheduled_end: "2026-05-03T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc2}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
          trigger:
            - { call: "POST /stimulation-cycles/${cyc2}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:30:00Z", retrieval_end: "2026-05-10T09:30:00Z", oocytes_retrieved: 5, mature_oocyte_count: 2, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ROOM_UNAVAILABLE"

      - name: thaw_authorize_same_provider_returns_segregation
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[priority=10]"]
        distinguishing_aspect: "Authorizing a thaw with the SAME physician who requested it (consent+disposition active, specimen owned/STORED) returns 409 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Patient with 1 STORED specimen, consent+disposition ACTIVE; auth requested by phys1."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr Z", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR-S", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T-S", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P M", date_of_birth: "1994-03-01T00:00:00Z", email: "pm@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 4, mature_oocyte_count: 1, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "GET /cryo-specimens", payload: {}, as: Embryologist, captures: { s0: "$.data[0].id" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { p_v2: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "DISPOSITION", disposition_action: "THAW_TO_SELF", expected_patient_version: "${p_v2}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s0}"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth1}/authorize", payload: {}, as: Physician, as_user_id: "${phys1}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: authorize_reserved_specimen_returns_specimen_not_available
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPECIMEN_NOT_AVAILABLE]", "validations[priority=12]"]
        distinguishing_aspect: "Authorizing a second thaw over a specimen already RESERVED by a prior authorization returns 409 ERR_SPECIMEN_NOT_AVAILABLE."
        test_recipe:
          setup: ["Patient with 1 specimen already RESERVED via an authorized thaw; a second auth references the same specimen."]
          setup_api_calls:
            - { call: "POST /providers", payload: { full_name: "Dr AA", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys1: "$.data.id" } }
            - { call: "POST /providers", payload: { full_name: "Dr BB", provider_role: "PHYSICIAN" }, as: PlatformAdmin, captures: { phys2: "$.data.id" } }
            - { call: "POST /procedure-rooms", payload: { name: "OR-A", room_kind: "RETRIEVAL_OR" }, as: PlatformAdmin, captures: { room1: "$.data.id" } }
            - { call: "POST /storage-tanks", payload: { name: "T-A", capacity_slots: 10 }, as: PlatformAdmin, captures: { tank1: "$.data.id" } }
            - { call: "POST /patients", payload: { full_name: "P N", date_of_birth: "1994-03-01T00:00:00Z", email: "pn@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /consultations", payload: { patient_id: "${p_id}", patient_age_years: 30, amh_level: 4.0, antral_follicle_count: 20 }, as: Coordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /consultations/${c_id}/complete", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles", payload: { patient_id: "${p_id}", consultation_id: "${c_id}" }, as: Coordinator, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /stimulation-cycles/${cyc_id}/schedule", payload: {}, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T09:00:00Z", scheduled_end: "2026-05-02T09:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T10:30:00Z" }, as: Coordinator }
            - { call: "POST /monitoring-appointments", payload: { cycle_id: "${cyc_id}", provider_id: "${phys1}", scheduled_start: "2026-05-02T11:00:00Z", scheduled_end: "2026-05-02T11:30:00Z" }, as: Coordinator }
            - { call: "POST /stimulation-cycles/${cyc_id}/trigger", payload: {}, as: Physician, as_user_id: "${phys1}" }
            - { call: "POST /stimulation-cycles/${cyc_id}/retrieve", payload: { retrieval_room_id: "${room1}", retrieval_start: "2026-05-10T08:00:00Z", retrieval_end: "2026-05-10T09:00:00Z", oocytes_retrieved: 4, mature_oocyte_count: 1, tank_id: "${tank1}", specimen_type: "VIAL" }, as: Physician, as_user_id: "${phys1}" }
            - { call: "GET /cryo-specimens", payload: {}, as: Embryologist, captures: { s0: "$.data[0].id" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { p_v2: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "DISPOSITION", disposition_action: "THAW_TO_SELF", expected_patient_version: "${p_v2}" }, as: Patient, as_user_id: "${p_id}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s0}"], transfer_type: "THAW_TO_TRANSFER" }, as: Physician, as_user_id: "${phys1}", captures: { auth1: "$.data.id" } }
            - { call: "POST /thaw-transfer-authorizations/${auth1}/authorize", payload: {}, as: Physician, as_user_id: "${phys2}" }
            - { call: "POST /thaw-transfer-authorizations", payload: { patient_id: "${p_id}", specimen_ids: ["${s0}"], transfer_type: "TRANSFER_OUT" }, as: Physician, as_user_id: "${phys1}", captures: { auth2: "$.data.id" } }
          trigger:
            - { call: "POST /thaw-transfer-authorizations/${auth2}/authorize", payload: {}, as: Physician, as_user_id: "${phys2}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SPECIMEN_NOT_AVAILABLE"

      - name: create_patient_missing_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A write sent with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Request issued with authentication headers omitted (the as:/as_user_id below denote the endpoint under test only)."]
          setup_api_calls: []
          trigger:
            - { call: "POST /patients", payload: { full_name: "No Auth", date_of_birth: "1990-01-01T00:00:00Z", email: "na@x.com" }, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ------------------------------------------------------------ RBAC
  - section: rbac
    instances:
      - name: coordinator_cannot_authorize_thaw
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "A Coordinator calling POST /thaw-transfer-authorizations/{id}/authorize is denied with 403 ERR_UNAUTHORIZED (authorization precedes existence, so any id suffices)."
        test_recipe:
          setup: ["No setup needed; authorization check precedes existence."]
          setup_api_calls: []
          trigger:
            - { call: "POST /thaw-transfer-authorizations/22222222-2222-2222-2222-222222222222/authorize", payload: {}, as: Coordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: patient_cannot_create_stimulation_cycle
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "A Patient calling POST /stimulation-cycles is denied with 403 ERR_UNAUTHORIZED (only Coordinator may create cycles)."
        test_recipe:
          setup: ["No setup needed; authorization check precedes existence."]
          setup_api_calls: []
          trigger:
            - { call: "POST /stimulation-cycles", payload: { patient_id: "33333333-3333-3333-3333-333333333333", consultation_id: "44444444-4444-4444-4444-444444444444" }, as: Patient, as_user_id: "33333333-3333-3333-3333-333333333333", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

  # ------------------------------------------------------------ Cross-cutting layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_directive_returns_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[directive-create-stale-patient]", "validations[priority=6]"]
        distinguishing_aspect: "After a CONSENT directive create bumps Patient.version to 2, a DISPOSITION directive create still carrying the original expected_patient_version (1) returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Patient version 1; one CONSENT directive created (advances Patient.version to 2)."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P O", date_of_birth: "1990-01-01T00:00:00Z", email: "po@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}" }
          trigger:
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "DISPOSITION", disposition_action: "THAW_TO_SELF", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_correct_version_directive_supersedes_prior
        claim_type: optimistic_concurrency
        grounds: [state_machines.Directive.ACTIVE_to_SUPERSEDED, "concurrency_rules[directive-create-stale-patient]"]
        distinguishing_aspect: "A second CONSENT directive created with the up-to-date expected_patient_version supersedes the prior one (prior -> SUPERSEDED, new -> ACTIVE)."
        test_recipe:
          setup: ["Patient with one ACTIVE CONSENT directive; version re-read after the first create."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P P2", date_of_birth: "1990-01-01T00:00:00Z", email: "pp2@x.com" }, as: Coordinator, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v}" }, as: Patient, as_user_id: "${p_id}", captures: { dir1: "$.data.id" } }
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { p_v2: "$.data.version" } }
          trigger:
            - { call: "POST /directives", payload: { patient_id: "${p_id}", directive_type: "CONSENT", expected_patient_version: "${p_v2}" }, as: Patient, as_user_id: "${p_id}", captures: { dir2: "$.data.id" } }
          assert:
            - "response.status == 201"
            - "Directive.${dir1}.status == SUPERSEDED"
            - "Directive.${dir2}.status == ACTIVE"

  # ------------------------------------------------------------ Consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_patient
        claim_type: immediate
        grounds: [entities.Patient]
        distinguishing_aspect: "A patient created in one request is immediately readable by id in the next (immediate consistency)."
        test_recipe:
          setup: ["Create a patient."]
          setup_api_calls:
            - { call: "POST /patients", payload: { full_name: "P Q2", date_of_birth: "1990-01-01T00:00:00Z", email: "pq2@x.com" }, as: Coordinator, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "GET /patients/${p_id}", payload: {}, as: Coordinator, captures: { got: "$.data.id" } }
          assert:
            - "response.status == 200"
            - "response.data.id == ${p_id}"
