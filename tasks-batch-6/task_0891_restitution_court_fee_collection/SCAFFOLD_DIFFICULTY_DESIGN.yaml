# =============================================================================
# task_0891 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_statutory_priority_fills_top_first
        grounds:
          - calculations.payment_allocation
          - entities.Obligation.fields.paid_amount_cents
          - entities.Payment.fields.allocation_method
        distinguishing_aspect: |
          On the Payment/Obligation ledger domain, a 20000c payment under
          STATUTORY_PRIORITY drives restitution.paid_amount_cents to 20000 and
          fee to 0, whereas PRO_RATA on the same inputs would yield 15000/5000 —
          divergent per-obligation results from identical data.
        test_recipe:
          setup:
            - "Case with a rank-1 RESTITUTION obligation (30000c) and a rank-2 COURT_FEE obligation (10000c); a victim exists"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-STAT", defendant_name: "Dana Ross" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/victims"
              payload: { name: "Val Payee" }
              as: CollectionsClerk
              captures: { victim_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "RESTITUTION", assessed_amount_cents: 30000, victim_id: "${victim_id}", priority_rank: 1 }
              as: CollectionsClerk
              captures: { rest_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000, priority_rank: 2 }
              as: CollectionsClerk
              captures: { fee_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 20000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
          assert:
            - "Obligation.${rest_id}.paid_amount_cents == 20000"
            - "Obligation.${rest_id}.status == PARTIALLY_PAID"
            - "Obligation.${fee_id}.paid_amount_cents == 0"

      - name: ability_to_pay_net_disposable_installment
        grounds:
          - calculations.ability_to_pay_installment
          - entities.PaymentPlan.fields.monthly_amount_cents
          - entities.PaymentPlan.fields.ability_to_pay_method
        distinguishing_aspect: |
          On the PaymentPlan/obligor-finance domain (a different entity domain
          from allocation), NET_DISPOSABLE with income 400000c / expenses 250000c
          yields monthly_amount_cents 15000, while GROSS_INCOME on identical
          inputs yields 40000 — dual-variant divergence on a separate subject.
        test_recipe:
          setup:
            - "Case with a single 500000c COURT_FEE obligation (balance 500000)"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-ATP-NET", defendant_name: "Nora Webb" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 500000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
          assert:
            - "PaymentPlan.${plan_id}.monthly_amount_cents == 15000"
            - "PaymentPlan.${plan_id}.status == PROPOSED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: prorata_floor_then_remainder_by_priority
        grounds:
          - calculations.payment_allocation
          - entities.Obligation.fields.paid_amount_cents
          - entities.Obligation.fields.priority_rank
        distinguishing_aspect: |
          Mode (b) nested rounding order: a 10001c PRO_RATA payment across
          10000/6000/4000 balances floors each share (5000/3000/2000) then hands
          the single leftover cent to the lowest priority_rank obligation, giving
          5001 — 'floor per share then remainder to priority' is pinned, not 'sum then round'.
        test_recipe:
          setup:
            - "Case with three obligations: RESTITUTION 10000c rank1 (victim), COURT_FEE 6000c rank2, FINE 4000c rank3"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-PRORATA", defendant_name: "Pat Lyle" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/victims"
              payload: { name: "Vic Prorata" }
              as: CollectionsClerk
              captures: { victim_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "RESTITUTION", assessed_amount_cents: 10000, victim_id: "${victim_id}", priority_rank: 1 }
              as: CollectionsClerk
              captures: { rest_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 6000, priority_rank: 2 }
              as: CollectionsClerk
              captures: { fee_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "FINE", assessed_amount_cents: 4000, priority_rank: 3 }
              as: CollectionsClerk
              captures: { fine_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 10001, allocation_method: "PRO_RATA" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
          assert:
            - "Obligation.${rest_id}.paid_amount_cents == 5001"
            - "Obligation.${fee_id}.paid_amount_cents == 3000"
            - "Obligation.${fine_id}.paid_amount_cents == 2000"

      - name: ability_to_pay_gross_nested_min_max
        grounds:
          - calculations.ability_to_pay_installment
          - entities.PaymentPlan.fields.monthly_amount_cents
          - entities.Case.fields.balance_cents
        distinguishing_aspect: |
          Mode (a) non-linear >=3-input formula: monthly = min(max(MIN_INSTALLMENT_CENTS,
          round(basis*RATE)), case.balance_cents). GROSS_INCOME basis 400000c gives
          raw 40000, max(2500,40000)=40000, min(40000,500000)=40000 — three inputs
          interacting through nested max/min.
        test_recipe:
          setup:
            - "Case with a single 500000c COURT_FEE obligation (balance 500000)"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-ATP-GROSS", defendant_name: "Gil Adams" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 500000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "GROSS_INCOME", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
          assert:
            - "PaymentPlan.${plan_id}.monthly_amount_cents == 40000"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_default_then_reinstate_cycle
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - state_machines.PaymentPlan.DEFAULTED_to_ACTIVE
          - entities.PaymentPlan.fields.missed_payment_count
        distinguishing_aspect: |
          PaymentPlan is cyclic: ACTIVE -> DEFAULTED (sweep) -> ACTIVE (reinstate).
          After reinstatement the same row is ACTIVE again with missed_payment_count
          reset to 0 — a genuine loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Clock at 2026-06-01; case with 100000c COURT_FEE obligation; an ACTIVE plan whose next_due_date is 2026-07-01; clock advanced to 2026-07-31; sweep has defaulted the plan"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/cases"
              payload: { case_number: "C-CYCLE", defendant_name: "Cy Doran" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 100000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/activate"
              payload: {}
              as: CollectionsSupervisor
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/delinquency-sweep"
              payload: {}
              as: SystemAdmin
          trigger:
            - call: "POST /collections/payment-plans/${plan_id}/reinstate"
              payload: {}
              as: CollectionsSupervisor
              captures: { plan_status: $.data.status }
          assert:
            - "PaymentPlan.${plan_id}.status == ACTIVE"
            - "PaymentPlan.${plan_id}.missed_payment_count == 0"
            - "Case.${case_id}.delinquency_status == CURRENT"

      - name: obligation_forks_to_waived_branch
        grounds:
          - state_machines.Obligation.OUTSTANDING_to_WAIVED
          - state_machines.Obligation.OUTSTANDING_to_SATISFIED
          - state_machines.Obligation.OUTSTANDING_to_WRITTEN_OFF
        distinguishing_aspect: |
          Obligation is a branching fork: OUTSTANDING -> {SATISFIED, WAIVED,
          WRITTEN_OFF} with divergent side-effects (SATISFIED bumps victim payable,
          WAIVED bumps Case.total_waived_cents, WRITTEN_OFF bumps total_written_off).
          This instance drives the WAIVED branch; the entity differs from PaymentPlan.
        test_recipe:
          setup:
            - "Clock at 2026-06-01; amnesty program covering the clock (waiver_pct 1.0); case with a 10000c COURT_FEE obligation; a REQUESTED waiver for 10000c by clerk-1"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Summer Amnesty", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z", waiver_pct: 1.0 }
              as: SystemAdmin
              captures: { amn_id: $.data.id }
            - call: "POST /collections/cases"
              payload: { case_number: "C-WAIVE", defendant_name: "Wes Ford" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_id}", obligation_id: "${obl_id}", requested_amount_cents: 10000 }
              as: CollectionsClerk
              as_user_id: "clerk-1"
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /collections/waiver-requests/${wr_id}/approve"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-1"
          assert:
            - "Obligation.${obl_id}.status == WAIVED"
            - "Obligation.${obl_id}.balance_cents == 0"
            - "Case.${case_id}.total_waived_cents == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: delinquency_cascade_plan_case_judgment_hold
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
          - entities.Case.fields.delinquency_status
          - entities.EnforcementAction.fields.type
        distinguishing_aspect: |
          Depth-3 chain, each link caused by the prior: sweep defaults the plan ->
          plan default flips Case.delinquency_status to DELINQUENT (link1) -> the
          case becoming delinquent dockets a CIVIL_JUDGMENT EnforcementAction
          (link2) -> the docketed judgment triggers a LICENSE_HOLD EnforcementAction (link3).
        test_recipe:
          setup:
            - "Clock 2026-06-01; case with 100000c COURT_FEE obligation; ACTIVE plan due 2026-07-01; clock advanced to 2026-07-31"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/cases"
              payload: { case_number: "C-CASCADE3", defendant_name: "Cas Reed" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 100000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/activate"
              payload: {}
              as: CollectionsSupervisor
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /collections/delinquency-sweep"
              payload: {}
              as: SystemAdmin
              captures: { defaulted: $.data.defaulted_plan_ids }
          assert:
            - "PaymentPlan.${plan_id}.status == DEFAULTED"
            - "Case.${case_id}.delinquency_status == DELINQUENT"
            - "GET /collections/enforcement-actions?case_id=${case_id} returns exactly two ACTIVE actions with types {CIVIL_JUDGMENT, LICENSE_HOLD}"

      - name: payment_satisfies_restitution_bumps_victim
        grounds:
          - state_machines.Obligation.OUTSTANDING_to_SATISFIED
          - calculations.victim_payable_balance
          - entities.Victim.fields.payable_balance_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (payment posting): posting a payment
          fully covers a RESTITUTION obligation -> obligation transitions to SATISFIED
          (link1) -> that satisfaction raises the linked Victim.payable_balance_cents (link2).
        test_recipe:
          setup:
            - "Case with a single 10000c RESTITUTION obligation tied to a victim"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-CASCADE2", defendant_name: "Cara Bell" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/victims"
              payload: { name: "Vera Owen" }
              as: CollectionsClerk
              captures: { victim_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "RESTITUTION", assessed_amount_cents: 10000, victim_id: "${victim_id}" }
              as: CollectionsClerk
              captures: { rest_id: $.data.id }
          trigger:
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 10000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
          assert:
            - "Obligation.${rest_id}.status == SATISFIED"
            - "Victim.${victim_id}.payable_balance_cents == 10000"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: waiver_approve_state_beats_sod
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - state_machines.WaiverRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Category pair state (priority 6) vs business_safety/SoD (priority 9):
          a second approve on an already-APPROVED waiver, issued by the original
          requester, violates both; the state check wins with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Clock 2026-06-01; amnesty covering clock; case + 10000c COURT_FEE obligation; waiver requested by sup-A then validly APPROVED by sup-B"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Amnesty A", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-01T00:00:00Z", waiver_pct: 1.0 }
              as: SystemAdmin
              captures: { amn_id: $.data.id }
            - call: "POST /collections/cases"
              payload: { case_number: "C-SOD-STATE", defendant_name: "Sam Ott" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_id}", obligation_id: "${obl_id}", requested_amount_cents: 10000 }
              as: CollectionsSupervisor
              as_user_id: "sup-A"
              captures: { wr_id: $.data.id }
            - call: "POST /collections/waiver-requests/${wr_id}/approve"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-B"
          trigger:
            - call: "POST /collections/waiver-requests/${wr_id}/approve"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-A"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: waiver_approve_temporal_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.WaiverRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Category pair business_temporal (priority 8) vs business_fiscal (priority 11):
          approving a waiver whose amount (999999c) exceeds the obligation balance
          while no amnesty window covers the clock violates both; the temporal check
          wins with ERR_NO_ACTIVE_AMNESTY, not ERR_WAIVER_EXCEEDS_BALANCE.
        test_recipe:
          setup:
            - "Clock 2026-06-01; NO amnesty program exists; case + 10000c COURT_FEE obligation; waiver requested for 999999c by clerk-1"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/cases"
              payload: { case_number: "C-TEMP-FISC", defendant_name: "Tia Frey" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/waiver-requests"
              payload: { case_id: "${case_id}", obligation_id: "${obl_id}", requested_amount_cents: 999999 }
              as: CollectionsClerk
              as_user_id: "clerk-1"
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /collections/waiver-requests/${wr_id}/approve"
              payload: {}
              as: CollectionsSupervisor
              as_user_id: "sup-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ACTIVE_AMNESTY"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: delinquency_grace_exactly_30_days
        grounds:
          - calculations.delinquency_evaluation
          - state_machines.PaymentPlan.ACTIVE_to_DEFAULTED
        distinguishing_aspect: |
          Boundary metric: days_past_due on the delinquency-sweep endpoint. next_due
          2026-07-01, clock 2026-07-31 is exactly DELINQUENCY_GRACE_DAYS (30) past due;
          '>= 30' means the plan DEFAULTS at exactly 30, not only 31.
        test_recipe:
          setup:
            - "Clock 2026-06-01; ACTIVE plan due 2026-07-01; clock moved to 2026-07-31 (exactly 30 days past)"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/cases"
              payload: { case_number: "C-BND-DELQ", defendant_name: "Bea Nunn" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 100000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/activate"
              payload: {}
              as: CollectionsSupervisor
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /collections/delinquency-sweep"
              payload: {}
              as: SystemAdmin
          assert:
            - "PaymentPlan.${plan_id}.status == DEFAULTED"

      - name: writeoff_age_exactly_1825_days
        grounds:
          - calculations.writeoff_aging_eligibility
          - state_machines.Obligation.OUTSTANDING_to_WRITTEN_OFF
        distinguishing_aspect: |
          Boundary metric: obligation age_days on the write-off endpoint (a different
          metric and endpoint from delinquency). Obligation created at 2026-05-01,
          clock 2031-04-30 is exactly WRITEOFF_AGE_DAYS (1825); '>= 1825' permits
          write-off at exactly the boundary.
        test_recipe:
          setup:
            - "Clock at default 2026-05-01; obligation created then; clock advanced to 2031-04-30 (exactly 1825 days later)"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-BND-WOFF", defendant_name: "Wren Ash" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "FINE", assessed_amount_cents: 20000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2031-04-30T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /collections/obligations/${obl_id}/write-off"
              payload: {}
              as: CollectionsSupervisor
          assert:
            - "Obligation.${obl_id}.status == WRITTEN_OFF"
            - "Obligation.${obl_id}.balance_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_activate_requires_case_open
        grounds:
          - state_machines.PaymentPlan.PROPOSED_to_ACTIVE
          - entities.Case.fields.status
        distinguishing_aspect: |
          Entity pair PaymentPlan -> Case: activating a PROPOSED plan is rejected
          when Case.status is SATISFIED (balance 0), returning ERR_CASE_NOT_OPEN —
          the plan's transition depends on the case's derived status.
        test_recipe:
          setup:
            - "Case whose single 10000c COURT_FEE obligation is fully paid (Case.status SATISFIED); a PROPOSED plan exists"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-NOTOPEN", defendant_name: "Ned Cole" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 10000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /collections/payment-plans/${plan_id}/activate"
              payload: {}
              as: CollectionsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_NOT_OPEN"
            - "Case.${case_id}.status == SATISFIED"

      - name: enforcement_lift_requires_case_current
        grounds:
          - state_machines.EnforcementAction.ACTIVE_to_LIFTED
          - entities.Case.fields.delinquency_status
        distinguishing_aspect: |
          Entity pair EnforcementAction -> Case (a different pair): lifting an ACTIVE
          enforcement action is rejected while Case.delinquency_status is DELINQUENT,
          returning ERR_CASE_STILL_DELINQUENT.
        test_recipe:
          setup:
            - "Delinquent case (plan defaulted via sweep) with an ACTIVE enforcement action; delinquency_status still DELINQUENT"
          setup_api_calls:
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/cases"
              payload: { case_number: "C-STILL-DELQ", defendant_name: "Del Marr" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 100000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "GET /collections/cases/${case_id}"
              payload: {}
              as: CollectionsClerk
              captures: { cv: $.data.version }
            - call: "POST /collections/payment-plans"
              payload: { case_id: "${case_id}", monthly_income_cents: 400000, monthly_expenses_cents: 250000, ability_to_pay_method: "NET_DISPOSABLE", expected_case_version: "${cv}" }
              as: CollectionsClerk
              captures: { plan_id: $.data.id }
            - call: "POST /collections/payment-plans/${plan_id}/activate"
              payload: {}
              as: CollectionsSupervisor
            - call: "POST /collections/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /collections/delinquency-sweep"
              payload: {}
              as: SystemAdmin
            - call: "GET /collections/enforcement-actions?case_id=${case_id}"
              payload: {}
              as: SystemAdmin
              captures: { ea_id: "$.data[0].id" }
          trigger:
            - call: "POST /collections/enforcement-actions/${ea_id}/lift"
              payload: {}
              as: CollectionsSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CASE_STILL_DELINQUENT"
            - "Case.${case_id}.delinquency_status == DELINQUENT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: amnesty_halfopen_window_overlap_rejected
        grounds:
          - calculations.amnesty_window_overlap
          - entities.AmnestyProgram.fields.start_date
          - entities.AmnestyProgram.fields.end_date
        distinguishing_aspect: |
          AmnestyProgram uses half-open [start,end) geometric non-overlap: window
          B [2026-05-01,2026-07-01) shares interior with A [2026-01-01,2026-06-01)
          and is rejected, while pure adjacency (start==prior end) would be allowed.
        test_recipe:
          setup:
            - "One AmnestyProgram A spanning [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Window A", start_date: "2026-01-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", waiver_pct: 0.5 }
              as: SystemAdmin
              captures: { amn_a: $.data.id }
          trigger:
            - call: "POST /collections/amnesty-programs"
              payload: { name: "Window B", start_date: "2026-05-01T00:00:00Z", end_date: "2026-07-01T00:00:00Z", waiver_pct: 0.5 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AMNESTY_WINDOW_OVERLAP"
            - "HTTP status == 409"

      - name: wage_aggregate_withhold_capacity_exceeded
        grounds:
          - calculations.wage_withhold_capacity
          - entities.WageAssignment.fields.monthly_withhold_cents
          - entities.WageAssignment.fields.effective_start_date
        distinguishing_aspect: |
          WageAssignment uses closed-interval aggregate-capacity semantics (a
          different interval treatment and entity): an existing ACTIVE 40000c order
          over [2026-06-01,2026-12-31] plus a new 20000c order over
          [2026-08-01,2026-09-30] sums to 60000 > MAX_MONTHLY_WITHHOLD_CENTS (50000)
          on their intersection, so the new order is rejected.
        test_recipe:
          setup:
            - "Case with one ACTIVE wage assignment of 40000c over [2026-06-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-WAGE-CAP", defendant_name: "Wade Kimm" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/wage-assignments"
              payload: { case_id: "${case_id}", employer_name: "Acme Co", monthly_withhold_cents: 40000, effective_start_date: "2026-06-01T00:00:00Z", effective_end_date: "2026-12-31T00:00:00Z" }
              as: FinanceOfficer
              captures: { wa1: $.data.id }
          trigger:
            - call: "POST /collections/wage-assignments"
              payload: { case_id: "${case_id}", employer_name: "Beta LLC", monthly_withhold_cents: 20000, effective_start_date: "2026-08-01T00:00:00Z", effective_end_date: "2026-09-30T00:00:00Z" }
              as: FinanceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WITHHOLD_CAPACITY_EXCEEDED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_reverse_restores_case_total_paid
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - calculations.case_balance_reconciliation
          - entities.Case.fields.total_paid_cents
        distinguishing_aspect: |
          Conserved quantity Case.total_paid_cents == sum of POSTED Payment.amount_cents.
          Posting 6000c then reversing it returns total_paid_cents to 0 and the
          obligation to OUTSTANDING with paid_amount_cents 0 — zero drift.
        test_recipe:
          setup:
            - "Case with a 10000c COURT_FEE obligation and one POSTED 6000c payment (obligation PARTIALLY_PAID, case total_paid 6000)"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-INV-PAY", defendant_name: "Ivy Poe" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "COURT_FEE", assessed_amount_cents: 10000 }
              as: CollectionsClerk
              captures: { obl_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 6000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /collections/payments/${pay_id}/reverse"
              payload: {}
              as: CollectionsSupervisor
          assert:
            - "Case.${case_id}.total_paid_cents == 0"
            - "Obligation.${obl_id}.paid_amount_cents == 0"
            - "Obligation.${obl_id}.status == OUTSTANDING"

      - name: disbursement_void_restores_victim_payable
        grounds:
          - state_machines.Disbursement.PENDING_to_VOIDED
          - calculations.victim_payable_balance
          - entities.Victim.fields.payable_balance_cents
        distinguishing_aspect: |
          A different conserved quantity: Victim.payable_balance_cents == collected
          restitution - PENDING/PAID disbursements. Debiting 4000c via a disbursement
          then voiding it returns payable_balance_cents to the collected 10000 — zero drift.
        test_recipe:
          setup:
            - "Victim with 10000c collected restitution (RESTITUTION obligation fully paid) and one PENDING 4000c disbursement (payable now 6000)"
          setup_api_calls:
            - call: "POST /collections/cases"
              payload: { case_number: "C-INV-DISB", defendant_name: "Dot Vane" }
              as: CollectionsClerk
              captures: { case_id: $.data.id }
            - call: "POST /collections/victims"
              payload: { name: "Vin Hale" }
              as: CollectionsClerk
              captures: { victim_id: $.data.id }
            - call: "POST /collections/obligations"
              payload: { case_id: "${case_id}", obligation_type: "RESTITUTION", assessed_amount_cents: 10000, victim_id: "${victim_id}" }
              as: CollectionsClerk
              captures: { rest_id: $.data.id }
            - call: "POST /collections/payments"
              payload: { case_id: "${case_id}", amount_cents: 10000, allocation_method: "STATUTORY_PRIORITY" }
              as: CollectionsClerk
              captures: { pay_id: $.data.id }
            - call: "POST /collections/disbursements"
              payload: { victim_id: "${victim_id}", case_id: "${case_id}", amount_cents: 4000 }
              as: FinanceOfficer
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /collections/disbursements/${disb_id}/void"
              payload: {}
              as: FinanceOfficer
          assert:
            - "Victim.${victim_id}.payable_balance_cents == 10000"
            - "Disbursement.${disb_id}.status == VOIDED"
