          - errors.ERR_PROJECT_NOT_FOUND
        distinguishing_aspect: |
          Both referenced rows exist, so the per-kind existence checks at priorities 40 and 45 pass;
          the request still fails at priority 51 with HTTP 404 ERR_PROJECT_NOT_FOUND because the
          monitoring_plan_id belongs to a different project than project_id, which is a
