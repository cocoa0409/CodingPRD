          - errors[ERR_REPORT_NOT_FOUND]
          - errors[ERR_MEMO_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_MAINTENANCE_ORDER_NOT_FOUND]
          - validations[priority=50]
        distinguishing_aspect: "Each collection raises its own domain-specific 404 rather than a shared generic one: route, trip, vehicle, driver, on-demand request, report, memo, offer and maintenance order each return their distinct error_id."
        test_recipe:
          setup:
            - "Empty database, so every id below is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: ContractAdmin
          trigger:
