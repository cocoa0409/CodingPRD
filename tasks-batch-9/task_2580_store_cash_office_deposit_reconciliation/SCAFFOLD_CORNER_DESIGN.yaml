              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { final_id: $.data.id }
            - call: "POST /cash-ops/deposits/${deposit_id}/reconcile-bank"
              payload: { bank_credit_record_ids: ["${final_id}"] }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
            - call: "GET /cash-ops/variance-cases"
              payload: { deposit_id: "${deposit_id}" }
