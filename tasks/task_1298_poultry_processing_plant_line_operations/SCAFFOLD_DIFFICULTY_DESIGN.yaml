          trigger:
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SHIFT_NOT_RUNNING (shift SCHEDULED gates the run's transition)"
            - "LineRun.${r1}.status == QUEUED unchanged"

