              captures: { ua_id: "$.data.id" }
            - call: "POST /osup/use-areas/${ua_id}/needs-assessments"
              payload: { assessment_year: 2027, public_need_finding: "NEED_EXISTS", determined_capacity_service_days: 900, allocated_service_days: 0 }
              as: PermitSpecialist
              captures: { na_id: "$.data.id" }
            - call: "POST /osup/needs-assessments/${na_id}/publish"
              payload: {}
              as: AuthorizedOfficer
            - call: "POST /osup/outfitters"
              payload: { legal_name: "Alpine Outfitters LLC", ein: "410000001", contact_email: "ops@alpine.example", prequalification_insurance_verified: true }
              as: PermitSpecialist
              captures: { oa_id: "$.data.id" }
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 200, proposed_activity_type: "RIVER_FLOAT", narrative: "Guided day floats." }
              as: PermitSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_id}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications/${app_id}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_id}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /osup/permits/${p_id}/performance-evaluations"
              payload: { evaluation_year: 2027, resource_protection_score: 80, client_safety_score: 80, reporting_timeliness_score: 80, fee_compliance_score: 80 }
              as: AuthorizedOfficer
              as_user_id: "officer-eval-1"
              captures: { ev1_id: "$.data.id" }
            - call: "POST /osup/permits/${p_id}/performance-evaluations"
              payload: { evaluation_year: 2028, resource_protection_score: 60, client_safety_score: 60, reporting_timeliness_score: 60, fee_compliance_score: 60 }
              as: AuthorizedOfficer
              as_user_id: "officer-eval-2"
              captures: { ev2_id: "$.data.id" }
            - call: "GET /osup/permits/${p_id}/performance-evaluations"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
          assert:
            - "both filings return 201; each response carries id and created_at but NO version field, and §1.5 declares no PUT, PATCH or DELETE path for performance evaluations"
            - "the 2027 row: raw_score 80.00, provisional_band SATISFACTORY, penalty_points_applied 0.00 (0 open points x multiplier 1.0), weighted_score 80.00, rating SATISFACTORY, evaluator_user_id \"officer-eval-1\""
            - "the 2028 row: raw_score 60.00, provisional_band MARGINAL, penalty_points_applied 0.00, weighted_score 60.00, rating MARGINAL, evaluator_user_id \"officer-eval-2\""
            - "the listing returns both rows ordered evaluation_year ASC (2027 then 2028) and the 2027 row is unchanged field-for-field after the second filing — no updated_at bump, no rating rewrite"
            - "the permit's latest_performance_rating == \"MARGINAL\": the highest evaluation_year wins even though it is the WORSE rating"
            - "Permit.version incremented once per filing, so the immutable child still drives a mutable parent"

      - name: flat_topology_cross_reference_integrity_rejects_mismatched_owners
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - validations[ERR_GUIDE_OUTFITTER_MISMATCH]
          - validations[ERR_SUCCESSION_PREDECESSOR_INVALID]
          - validations[ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED]
        distinguishing_aspect: |
          The topology is flat, so relationships live in FK fields rather than URLs — and each FK is
          validated for OWNERSHIP and STATE, not merely existence. A guide that exists but belongs to
          another outfitter, a predecessor permit that exists but is held by another outfitter, a
          predecessor supplied on a NEW application, and a needs assessment that exists but is still
          DRAFT are four distinct rejections of perfectly resolvable ids.
        test_recipe:
          setup:
            - "canonical BRW-01 chain: Alpine holds ISSUED permit ${p_id}; NeedsAssessment ${na_id} is PUBLISHED for 2027"
            - "a second outfitter Cedar (ein 410000002) is registered and hires QUALIFIED guide Tom Reed (LEAD / WFR / 2030-06-30)"
            - "a second DRAFT NeedsAssessment ${na2_id} is drafted for 2028 and never published"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
              as: ProgramAdministrator
              captures: { ua_id: "$.data.id" }
