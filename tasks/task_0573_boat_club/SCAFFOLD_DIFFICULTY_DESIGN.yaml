            - { call: "POST /enrollments", payload: { member_id: "${m2}", session_id: "${so1}" }, as: Member, as_user_id: "${m2}", captures: { eo2: "$.data.id" } }
            - { call: "POST /enrollments/${eo2}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /enrollments", payload: { member_id: "${m2}", session_id: "${sb1}" }, as: Member, as_user_id: "${m2}", captures: { eb2: "$.data.id" } }
            - { call: "POST /enrollments/${eb2}/mark-attendance", payload: { attended: true }, as: DockStaff }
            - { call: "POST /reservations", payload: { member_id: "${m1}", dock_id: "${hd}", boat_type: "PONTOON", start_time: "2026-05-05T10:00:00Z", end_time: "2026-05-05T12:00:00Z" }, as: Member, as_user_id: "${m1}", captures: { ra: "$.data.id" } }
            - { call: "POST /reservations/${ra}/confirm", payload: {}, as: Member, as_user_id: "${m1}" }
          trigger:
