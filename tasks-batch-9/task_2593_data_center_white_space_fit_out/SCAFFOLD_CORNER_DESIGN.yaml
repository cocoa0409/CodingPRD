              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop_h_id: $.data.id }
            - call: "POST /mops"
              payload: { hall_id: "${hall_id}", target_resource_type: "BUSWAY", target_resource_id: "${bw_a2_id}", title: "Infrared scan", risk_class: "MEDIUM", backout_plan: "Close the covers and leave the run as found.", window_start: "2026-08-11T02:00:00Z", window_end: "2026-08-11T06:00:00Z" }
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { mop_m_id: $.data.id }
            - call: "POST /mops/${mop_h_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
              captures: { req_h: $.data.required_approval_count }
            - call: "POST /mops/${mop_m_id}/submit"
              payload: {}
              as: ElectricalContractor
              as_user_id: "u-elec-1"
