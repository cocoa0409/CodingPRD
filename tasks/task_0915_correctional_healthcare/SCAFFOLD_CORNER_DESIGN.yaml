              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /inmates/${inm}/grievances"
              payload: { grievance_text: "grievance A", grieved_event_at: "2026-05-01T00:00:00Z" }
              as: Inmate
              as_user_id: "${inm}"
              captures: { grv_a: $.data.id }
            - call: "POST /grievances/${grv_a}/accept"
              payload: {}
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
            - call: "POST /grievances/${grv_a}/decide"
              payload: { outcome: "DENIED" }
              as: GrievanceCoordinator
              as_user_id: "u-gc-1"
            - call: "POST /inmates/${inm}/grievances"
