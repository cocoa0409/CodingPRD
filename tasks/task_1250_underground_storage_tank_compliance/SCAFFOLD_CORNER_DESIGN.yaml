          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Link Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank1: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T2", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank2: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank1}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank2}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank1}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-X" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank1}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - { call: "POST /service-orders/${so}/results", payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }, as: Technician, as_user_id: "${t_cp}" }
            - { call: "GET /deficiencies?source_service_order_id=${so}", as: Any, captures: { d1: "$.data[0].id" } }
          trigger:
            - call: "POST /service-orders"
              payload: { facility_id: "${fac}", tank_system_id: "${tank2}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }], linked_deficiency_id: "${d1}" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DEFICIENCY_LINK_INVALID (deficiency ${d1} belongs to ${tank1}, not ${tank2})"

      - name: claim_release_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_CLAIM_RELEASE_MISMATCH]
        distinguishing_aspect: "A fund claim may only reference a release of the same facility; cross-facility references fail with ERR_CLAIM_RELEASE_MISMATCH before any fiscal check."
        test_recipe:
          setup: ["Facilities F1 (owner-1) and F2 (owner-2), each ACTIVE with a tank in service; F2 has a CONFIRMED release"]
          setup_api_calls:
