          On the Case resource, hearings use half-open [start,end) intervals: a second hearing
          09:00-11:00 vs 10:00-12:00 overlaps => ERR_HEARING_OVERLAP, while a touching 11:00-13:00
          would be allowed. Interval arithmetic = pure overlap with adjacency permitted.
