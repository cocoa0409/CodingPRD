            - call: "POST /consignment-items/${ci_id}/schedule-inspection"
              payload: { authenticator_id: "${auth_id}", inspection_window_start: "2026-07-01T13:00:00Z", inspection_window_end: "2026-07-01T13:30:00Z" }
              as: Authenticator
