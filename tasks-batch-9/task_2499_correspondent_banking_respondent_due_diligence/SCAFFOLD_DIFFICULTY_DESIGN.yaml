  - rule_id: compensating_invariant
    instances:
      - name: obligation_counters_are_conserved_across_allocate_reverse_with_the_residue_pinned_to_the_largest_corridor
        grounds:
          - calculations.settlement_allocation
          - entities.ClosurePlan.fields.outstanding_obligation_cents
          - entities.ClosurePlan.fields.settled_cents
          - entities.ClosurePlan.fields.allocation_round
          - entities.ClosurePlan.fields.last_allocated_cents
          - validations[priority=43]
          - calculations.wind_down_cap
        distinguishing_aspect: |
          The conserved quantity is outstanding_obligation_cents + settled_cents ==
          original_obligation_cents, and it must survive a full ALLOCATE / ALLOCATE / REVERSE
          sequence plus four refused calls. Two allocations of the same corridor split are chosen so
          the residue has OPPOSITE signs: 5000000 cents leaves a residue of +1 that pushes the
          largest corridor up to 2142858, and 2 cents leaves a residue of -1 that pushes it DOWN to
          0 while the two smaller corridors each keep 1. An implementation that spreads the residue,
          that rounds the total instead of each line, or that drops the jurisdiction_code ASC
          tie-break between the two equal 2000000.00 corridors produces different lines; one that
          fails to reset last_allocated_cents to 0 on REVERSE lets a second REVERSE through.
        test_recipe:
          setup: >
            JurisdictionProfiles DE, AT and CH all with corridor_risk_weight 1.00, PERMITTED,
            fatf_listing NONE, secrecy_flag false, max_permitted_risk_rating HIGH and
            basel_aml_index 4.0 (DE), 3.0 (AT), 3.0 (CH). Respondent L home DE with
            expected_monthly_volume_usd 7000000.00, expected_monthly_count 200,
            nested_activity_permitted false, licensed, one VERIFIED 100.00% DE natural-person owner
            and eight self_rating 3 rows assessed ONBOARDING_PROVISIONAL: control_score 60.00,
            control_credit 0.2250, inherent 8.00 + 0 + 0 + 6 = 14.00, residual 10.85, risk_rating
            LOW; approved by the committee at clock 2026-08-01T00:00:00Z. A monitoring profile is
            opened over [2026-07-01T00:00:00Z, 2026-12-31T00:00:00Z] with tolerance_pct 0.00 and
            expected_corridors given in the DELIBERATELY UNSORTED payload order AT 2000000.00,
            DE 3000000.00, CH 2000000.00 (counts 60/100/40) and calibrated, so
            aggregate_usd_threshold = round((3900000.00 + 2600000.00 + 2600000.00)*1.10, 2) =
            10010000.00. The relationship manager then drafts a ClosurePlan with termination_reason
            COMMERCIAL, cap_basis FORWARD_PROJECTED and original_obligation_cents 12000000, submits
            it and the committee approves it: notice_period_days = 90 + 15 (obligation > 0) = 105 and
            wind_down_cap_usd = round(7000000.00*(105/30.0)*0.60, 2) = 14700000.00. The allocation
            sort order is therefore DE (3000000.00), then AT and CH tied at 2000000.00 broken by
            jurisdiction_code ASC, and total_expected is 7000000.00.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "AT", name: "Austria", basel_aml_index: 3.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "CH", name: "Switzerland", basel_aml_index: 3.0, corridor_risk_weight: 1.00, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Donaubruecke Bank AG", swift_bic: "DONBDEF0XXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 7000000.00, expected_monthly_count: 200, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { l_id: $.data.id } }
