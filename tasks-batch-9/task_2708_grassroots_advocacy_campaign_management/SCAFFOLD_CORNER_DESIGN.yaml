  - section: rbac
    instances:
      - name: absent_or_unrecognised_role_header_is_unauthenticated_before_any_lookup
        claim_type: unauthenticated_request
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - endpoints.GET_advocacy_campaigns_campaign_id
        distinguishing_aspect: "Authentication is priority 1, so a request with no X-User-Role header and a request naming a seventh role that does not exist both return 401 ERR_UNAUTHENTICATED for a campaign id that really exists - the 404/403 machinery is never reached."
        test_recipe:
          setup:
            - "One DRAFT campaign so the target id is real and a leaked 404 would be detectable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CampaignDirector
            - call: "POST /advocacy/campaigns"
              payload: { name: "Fair Housing Now", goal_statement: "Pass HB-1420 out of committee", bill_reference: "HB-1420", target_chamber: "HOUSE", start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", success_metric_target_actions: 500, success_metric_target_supporters: 200, funded_total_cents: 100000 }
              as: CampaignDirector
              as_user_id: "u_dir_1"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "GET /advocacy/campaigns/${camp_id}"
              payload: {}
              as: "<no X-User-Role header sent>"
            - call: "GET /advocacy/campaigns/${camp_id}"
              payload: {}
              as: "CoalitionBoss"
              as_user_id: "u_ghost_1"
            - call: "GET /advocacy/campaigns/${camp_id}"
              payload: {}
              as: CampaignDirector
          assert:
            - "call with no X-User-Role header -> response status == 401 with error_id == ERR_UNAUTHENTICATED"
            - "call with X-User-Role CoalitionBoss -> response status == 401 with error_id == ERR_UNAUTHENTICATED"
            - "call as CampaignDirector with no X-User-ID header -> response status == 401 with error_id == ERR_UNAUTHENTICATED"
            - "Campaign.${camp_id}.status == DRAFT"
            - "Campaign.${camp_id}.version == 1"

      - name: compliance_officer_cannot_author_copy_and_field_organizer_cannot_launch
