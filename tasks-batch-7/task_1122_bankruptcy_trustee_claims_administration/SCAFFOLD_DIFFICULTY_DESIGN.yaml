  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict: two conflicts on DIFFERENT
  # error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_begin_liquidation
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Case.CLAIMS_ADMINISTRATION_to_LIQUIDATION
        distinguishing_aspect: |
          Pair = state vs business_temporal. A begin_liquidation call where the
          case is still OPEN (state violation) AND the clock is before any bar
          date (temporal violation) must return ERR_INVALID_STATE (priority 5
          state outranks priority 7 temporal), not ERR_BAR_DATE_NOT_PASSED.
        test_recipe:
          setup:
            - "Case freshly created, status OPEN, claim_bar_date null; logical clock at default 2026-05-01 (before any plausible bar date)"
          setup_api_calls:
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10009", debtor_name: "Debtor Nine", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /trustee/cases/${case_id}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE   # state priority (5) beats temporal priority (7)"

      - name: business_safety_vs_business_fiscal_on_fee_pay
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.FeeApplication.APPROVED_to_PAID
        distinguishing_aspect: |
          Pair = business_safety vs business_fiscal (different pair from
          instance 1). A fee pay call from a user who is NOT the assigned
          trustee on a case whose estate cash is also insufficient must return
          ERR_NOT_ASSIGNED_TRUSTEE (priority 6 safety) rather than
          ERR_INSUFFICIENT_ESTATE_FUNDS (priority 11 fiscal).
        test_recipe:
          setup:
            - "Case in CLAIMS_ADMINISTRATION with trustee_user_id 'trust-0001'; an APPROVED fee application of 100,000 with effective_on in the past; estate cash is 0 (insufficient)"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor I", creditor_ref: "CR-I-1", contact_email: "i@x.com" }
              as: Clerk
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10010", debtor_name: "Debtor Ten", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001", objection_window_days: 1 }
              as: Clerk
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /trustee/cases/${case_id}/assets"
              payload: { description: "Safe", scheduled_value_cents: 100000 }
