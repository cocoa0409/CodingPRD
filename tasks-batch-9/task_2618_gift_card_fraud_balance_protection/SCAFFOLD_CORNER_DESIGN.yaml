  # ==========================================================================
  - section: validations
    instances:

      - name: physical_issuance_with_broken_seal_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=55]
          - errors.ERR_PACKAGING_SEAL_BROKEN
          - entities.IssuanceRequest.fields.packaging_seal_intact
        distinguishing_aspect: "packaging_seal_intact false is refused at request time with 422 ERR_PACKAGING_SEAL_BROKEN, while the identical request with the seal intact is accepted — the tamper-evident packaging check runs on the request itself, not only at screening."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN, one INTACT CardRack, and two INACTIVE GiftCards."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Seal Check Store", region_code: "NE", address_line: "30 Seal Sq" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-SC", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6001" }
              as: PosAssociate
              captures: { cardA_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-6002" }
              as: PosAssociate
              captures: { cardB_id: $.data.id }
          trigger:
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardA_id}", pos_terminal_id: "T-60", packaging_seal_intact: false }
              as: PosAssociate
              captures: { err: $.data.error_id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 5000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardB_id}", pos_terminal_id: "T-60", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irB_id: $.data.id, irB_state: $.data.state }
          assert:
            - "first trigger call: HTTP status == 422 and ${err} == ERR_PACKAGING_SEAL_BROKEN"
            - "GET /issuance-requests?card_id=${cardA_id} returns total_count == 0 — the rejected request was not persisted"
            - "GiftCard.${cardA_id}.activation_state == INACTIVE and current_balance_cents == 0"
            - "second trigger call: HTTP status == 201 and ${irB_state} == SUBMITTED"
            - "IssuanceRequest.${irB_id}.packaging_seal_intact == true"
            - "CardRack.${rack1_id}.tamper_state == INTACT — a broken seal on a request does not by itself reclassify the rack"

      - name: bulk_approval_without_identity_above_threshold_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations[priority=60]
          - errors.ERR_IDENTITY_VERIFICATION_REQUIRED
          - state_machines.BulkPurchaseOrder.PENDING_IDENTITY_to_IDENTITY_VERIFIED
          - calculations.bulk_order_total
        distinguishing_aspect: "The identity requirement is conditional on the computed total crossing 50000: 20 cards at 5000 gives subtotal 100000 / 225 bps / fee 2250 / total 102250, so APPROVE is refused with 422 ERR_IDENTITY_VERIFICATION_REQUIRED until an ID is recorded, after which the identical APPROVE succeeds."
        test_recipe:
          setup:
            - "One RetailStore with floor_posture OPEN."
            - "One BulkPurchaseOrder of 20 cards at 5000 cents each, so total_cents 102250 lands above the 50000 identity threshold and the order stays PENDING_IDENTITY."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Identity Gate Store", region_code: "MW", address_line: "31 Gate Rd" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /bulk-purchase-orders"
              payload: { store_id: "${store1_id}", card_quantity: 20, face_value_cents_each: 5000, purchaser_name: "Halberd Logistics Inc", payment_method: "CORPORATE_ACH" }
              as: PosAssociate
              captures: { order_id: $.data.id, o_total: $.data.total_cents, o_state0: $.data.state }
          trigger:
            - call: "POST /bulk-purchase-orders/${order_id}/decide"
              payload: { decision: "APPROVE", decision_note: "approving before the ID is taken" }
              as: RiskManager
              as_user_id: "risk-61"
              captures: { err: $.data.error_id }
            - call: "POST /bulk-purchase-orders/${order_id}/identity-verification"
              payload: { id_type: "DRIVER_LICENSE", id_number_hash: "idh-61", id_expiry_date: "2030-04-30" }
              as: PosAssociate
              captures: { o_state1: $.data.state }
            - call: "POST /bulk-purchase-orders/${order_id}/decide"
              payload: { decision: "APPROVE", decision_note: "ID on file, approved" }
              as: RiskManager
              as_user_id: "risk-61"
              captures: { o_state2: $.data.state }
          assert:
            - "BulkPurchaseOrder.${order_id}.face_value_subtotal_cents == 100000"
            - "BulkPurchaseOrder.${order_id}.fee_rate_bps == 225 and activation_fee_cents == 2250"
            - "${o_total} == 102250 and ${o_state0} == PENDING_IDENTITY"
            - "first trigger call: HTTP status == 422 and ${err} == ERR_IDENTITY_VERIFICATION_REQUIRED"
            - "after the rejected approve, BulkPurchaseOrder.${order_id}.state == PENDING_IDENTITY and decided_by_user_id == null"
            - "${o_state1} == IDENTITY_VERIFIED"
            - "BulkPurchaseOrder.${order_id}.identity_id_type == DRIVER_LICENSE and identity_id_number_hash == idh-61 and identity_id_expiry_date == 2030-04-30"
            - "third trigger call: HTTP status == 200 and ${o_state2} == APPROVED"
            - "BulkPurchaseOrder.${order_id}.decided_by_user_id == risk-61"

      - name: physical_claim_without_packaging_photo_cannot_be_approved
