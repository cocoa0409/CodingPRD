              as_user_id: "admin-1"
              captures: { cyc26: "$.data.id" }
            - call: "POST /induction-cycles"
              payload: { cycle_year: 2025, sport_code: "BASEBALL", max_inductees: 5, travel_budget_cents: 1000000, escort_pool_size: 1 }
              as: ElectionAdministrator
