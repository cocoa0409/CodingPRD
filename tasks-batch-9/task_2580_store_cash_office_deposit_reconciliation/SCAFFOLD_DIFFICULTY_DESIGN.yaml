              captures: { journal_1_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-04" }
              as: CashOfficeClerk
              captures: { journal_2_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-05" }
              as: CashOfficeClerk
              captures: { journal_3_id: $.data.id }
          trigger:
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "${journal_1_id}", card_network: "VISA_MC", gross_card_sales_cents: 300000, txn_count: 120, monthly_volume_cents: 5000000, funded_amount_cents: 291960, chargeback_cents: 0 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { settlement_1_id: $.data.id }
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "${journal_2_id}", card_network: "VISA_MC", gross_card_sales_cents: 300000, txn_count: 120, monthly_volume_cents: 4999999, funded_amount_cents: 291960, chargeback_cents: 0 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { settlement_2_id: $.data.id }
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "${journal_3_id}", card_network: "VISA_MC", gross_card_sales_cents: 412750, txn_count: 143, monthly_volume_cents: 21000000, funded_amount_cents: 401485, chargeback_cents: 1500 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { settlement_3_id: $.data.id }
          assert:
            - "CardSettlement.${settlement_1_id}.expected_fee_cents == 8040"
            - "CardSettlement.${settlement_1_id}.expected_funded_cents == 291960"
            - "CardSettlement.${settlement_1_id}.settlement_variance_cents == 0"
            - "CardSettlement.${settlement_1_id}.settlement_status == MATCHED"
            - "CardSettlement.${settlement_2_id}.expected_fee_cents == 8940"
            - "CardSettlement.${settlement_2_id}.expected_funded_cents == 291060"
            - "CardSettlement.${settlement_2_id}.settlement_variance_cents == 900"
            - "CardSettlement.${settlement_2_id}.settlement_status == VARIANCE"
            - "CardSettlement.${settlement_3_id}.expected_fee_cents == 9765"
            - "CardSettlement.${settlement_3_id}.expected_funded_cents == 401485"
            - "CardSettlement.${settlement_3_id}.settlement_variance_cents == 0"
            - "CardSettlement.${settlement_3_id}.expected_fee_cents != 9764"
            - "SalesJournal.${journal_2_id}.settlement_variance_total_cents == 900"
            - "SalesJournal.${journal_1_id}.settlement_count == 1"

