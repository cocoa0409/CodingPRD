  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_certify_requires_non_stale_agreement_reconciliation
        grounds:
          - validations[priority=58]
          - state_machines.DisclosureReport.DRAFT_to_CERTIFIED
          - state_machines.PublisherAgreement.COMPUTED_to_STALE
          - state_machines.PublisherAgreement.STALE_to_COMPUTED
          - errors[ERR_RECONCILIATION_NOT_CURRENT]
        distinguishing_aspect: |
          A DisclosureReport transition is gated on a field of a THIRD entity two hops away
          (report -> term -> sections -> charges -> titles -> PublisherAgreement.reconciliation_status):
          the report is certifiable while the agreement is COMPUTED, becomes uncertifiable the moment
          an unrelated student's opt-out flips the agreement to STALE, and becomes certifiable again
          only after a fresh run - the report itself never changes state in between.
        test_recipe:
          setup:
            - "Base FA26 fixture: two charges of 9450 cents; PUB-A reconciled once (run A) so reconciliation_status is COMPUTED."
            - "A DRAFT DisclosureReport for state code CA exists for FA26."
            - "S-1001 then files and is granted an opt-out on 2026-08-26, whose last cascade hop flips PUB-A to STALE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
