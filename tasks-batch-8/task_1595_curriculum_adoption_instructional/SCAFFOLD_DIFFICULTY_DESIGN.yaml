  - rule_id: resource_temporal_overlap
    instances:
      - name: pilot_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - entities.PilotProgram.fields.starts_on
          - entities.PilotProgram.fields.ends_on
        distinguishing_aspect: |
          Half-open interval semantics on the school+subject pilot resource: [starts_on, ends_on)
          windows may touch (a pilot starting 2026-08-20 coexists with one ending 2026-08-20) but
          any strict overlap is rejected, and CANCELLED pilots release the window. Distinct
          interval semantics from public_review_window_gap_rule (closed windows with a mandatory
          30-day gap).
        test_recipe:
          setup:
            - "Cycle in PILOT_OPEN with a VETTED material; pilot P1 at SCH-A occupying [2026-08-10, 2026-08-20)"
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
