              as: PeerReviewer
              as_user_id: "${rev_m4_id}"
              captures: { asg_m4_response: $.data.response, asg_m4_status: $.data.status }
            - call: "GET /accreditation/reviewers/${rev_m4_id}"
              payload: {}
              as: CommissionStaff
              captures: { m4_load_post: $.data.current_assignment_count }
            - call: "GET /accreditation/review-teams/${team_id}/assignments"
              payload: { reviewer_id: "${rev_m5_id}" }
              as: CommissionStaff
              captures: { replacement_response: "$.data[0].response" }
            - call: "POST /accreditation/review-teams/${team_id}/confirm"
              payload: {}
              as: CommissionStaff
              captures: { confirm_err: $.data.error_id }
          assert:
            - "m4_load_pre == 1 (assembly debit) and m4_load_post == 0 (decline credit) — the conserved load is unchanged net-net"
            - "asg_m4_response == DECLINED and asg_m4_status == CLOSED"
            - "a replacement TeamAssignment for Reviewer.${rev_m5_id} exists with response == PENDING (selector filled the seat)"
            - "confirm fails with confirm_err == ERR_TEAM_INCOMPLETE until the replacement accepts (seat-count invariant enforced at confirm)"

