            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /recharge-batches/${bat9}/finalize", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "GET /recharge-entries", payload: { usage_log_id: "${ul1}" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { e1: "$.data[0].id" } }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 10 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat10: $.data.id } }
          trigger:
            - { call: "POST /recharge-entries/${e1}/dispute", payload: { dispute_reason: "hours look wrong" }, as: Researcher, as_user_id: "${u1}", captures: { st1: $.data.status } }
            - { call: "POST /recharge-entries/${e1}/resolve-dispute", payload: { resolution: "UPHOLD" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { st2: $.data.status, reason2: $.data.dispute_reason } }
            - { call: "POST /recharge-entries/${e1}/dispute", payload: { dispute_reason: "recount requested by PI" }, as: Researcher, as_user_id: "${u1}", captures: { st3: $.data.status } }
            - { call: "POST /recharge-entries/${e1}/resolve-dispute", payload: { resolution: "WRITE_OFF", note: "goodwill" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { st4: $.data.status } }
            - { call: "GET /grants/${g1}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { used_after: $.data.budget_used_cents, avail_after: $.data.budget_available_cents } }
          assert:
            - "First dispute: status == DISPUTED; UPHOLD: status == BILLED and dispute_reason == null (loop traversed)"
            - "Second dispute: status == DISPUTED again; WRITE_OFF: status == WRITTEN_OFF"
            - "Grant.${g1}.budget_used_cents == 0 and budget_available_cents == 100000 after the write-off"
            - "An ADJUSTMENT RechargeEntry with amount_cents == -15000 and net_amount_cents == -15000 exists in batch ${bat10} (GET /recharge-entries?batch_id=${bat10}&kind=ADJUSTMENT)"
            - "Batch ${bat9} totals remain frozen: gross_amount_cents == 15000"

      - name: rate_set_review_reject_loop
        grounds:
          - state_machines.RateSet.UNDER_REVIEW_to_DRAFT
          - state_machines.RateSet.DRAFT_to_UNDER_REVIEW
          - concurrency_rules[rate-set-edit-stale-rate-set]
        distinguishing_aspect: |
          RateSet is a branching review loop: DRAFT -> UNDER_REVIEW -> DRAFT on
          reject, editable again via OCC-guarded PUT, then re-submitted and
          approved — the loop can repeat and version advances on every pass.
        test_recipe:
          setup:
            - "Instrument i1; FY2027 period OPEN; DRAFT rate set rs27 for 2027 (line internal 12500, external 18000, increment 15, min 30, projected 500 h, effective_from 2027-01-01) developed by admin-1"
          setup_api_calls:
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2027 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2027, effective_from: "2027-01-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12500, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs27: $.data.id, rs_v: $.data.version } }
            - { call: "POST /rate-sets/${rs27}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { st1: $.data.status } }
            - { call: "POST /rate-sets/${rs27}/reject", payload: { reason: "revise external rate" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { st2: $.data.status, rs_v2: $.data.version } }
          trigger:
            - { call: "PUT /rate-sets/${rs27}", payload: { expected_rate_set_version: "${rs_v2}", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12500, external_rate_cents_per_hour: 19000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs_v3: $.data.version } }
            - { call: "POST /rate-sets/${rs27}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { st3: $.data.status } }
            - { call: "POST /rate-sets/${rs27}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { st4: $.data.status } }
          assert:
            - "Statuses traverse the loop: UNDER_REVIEW -> DRAFT (reject) -> UNDER_REVIEW (re-submit) -> APPROVED"
            - "RateSet.${rs27}.version increments on every mutation (1 at create, +1 submit, +1 reject, +1 PUT, +1 submit, +1 approve == 6)"
            - "RateSet.${rs27}.approved_by == fin-1 and developed_by == admin-1"
            - "Break-even verdicts recomputed on the second submit: line for ${i1} verdict PASS (12500 x 500 = 6250000 >= 120000 overhead, no contract)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (3 instances; one depth-3, two depth-2; three
  # different triggering transitions)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fiscal_close_carryforward_cascade
        grounds:
          - state_machines.FiscalYearPeriod.OPEN_to_CLOSED
          - calculations.fiscal_trueup
          - calculations.derived_rate_computation
          - entities.RateSet.fields.line_verdicts
        distinguishing_aspect: |
          Depth-3 chain from POST /fiscal-years/{id}/close: FY2026 CLOSED with
          surplus_deficit -155000 -> auto-created FY2027 period stamped
          carryforward_in_cents = -155000 -> the DRAFT FY2027 rate set's derived
          suggestion recomputes to round((170000 - (-155000)) / 500) = 650 ->
          its stored 12000-cent line deviates > 5% so flagged_for_review flips
          true. Each hop is caused by the previous hop's mutation.
        test_recipe:
          setup:
            - "Canonical stack; maintenance contract on i1 covering 2026-01-01..2027-12-31 at 50000 cents/yr; one completed+validated usage (74 actual min) whose 15000-cent entry is BILLED via finalized batch 2026-09; a DRAFT rate set rs27 for FY2027 with internal 12000, projected 500 h exists BEFORE the close"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy26: $.data.id } }
            - { call: "POST /maintenance-contracts", payload: { instrument_id: "${i1}", vendor: "Bruker Service", sla_response_hours: 24, coverage_start: "2026-01-01", coverage_end: "2027-12-31", annual_cost_cents: 50000 }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2027, effective_from: "2027-01-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs27: $.data.id } }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 100000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /recharge-batches", payload: { period_year: 2026, period_month: 9 }, as: FinanceOfficer, as_user_id: "fin-1", captures: { bat: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:14:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /bookings/${b1}/complete", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs", payload: { booking_id: "${b1}", actual_start_at: "2026-09-01T09:00:00Z", actual_end_at: "2026-09-01T10:14:00Z" }, as: CoreStaff, as_user_id: "staff-1", captures: { ul1: $.data.id } }
            - { call: "POST /usage-logs/${ul1}/submit", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /recharge-batches/${bat}/finalize", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
          trigger:
            - { call: "POST /fiscal-years/${fy26}/close", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { surplus: $.data.surplus_deficit_cents, cf_out: $.data.carryforward_out_cents } }
            - { call: "GET /fiscal-years", payload: { status: "OPEN" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { fy27_cf_in: "$.data[0].carryforward_in_cents", fy27_year: "$.data[0].fiscal_year" } }
            - { call: "GET /rate-sets/${rs27}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { rs27_verdicts: $.data.line_verdicts } }
          assert:
            - "Hop 1: FiscalYearPeriod.${fy26}.surplus_deficit_cents == -155000 (revenue 15000 - cost 170000) and carryforward_out_cents == -155000"
            - "Hop 2: auto-created FY2027 period has fiscal_year == 2027, status == OPEN, carryforward_in_cents == -155000"
            - "Hop 3: DRAFT RateSet.${rs27} line for ${i1} re-derived: suggested = round_half_up((50000 + 120000 - (-155000)) / 500) = 650 cents/h"
            - "Hop 4: that line's line_verdicts element has flagged_for_review == true (|12000 - 650| / 12000 > 0.05)"

      - name: downtime_confirm_cancellation_cascade
        grounds:
          - state_machines.DowntimeEvent.REPORTED_to_CONFIRMED
          - state_machines.Booking.APPROVED_to_CANCELLED
          - state_machines.Grant.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: |
          Depth-2 chain from POST /downtime-events/{id}/confirm: the CONFIRMED
          event cancels the overlapping APPROVED booking (waived, reason
          DOWNTIME); that cancellation releases the 18000-cent encumbrance,
          flipping the exactly-saturated grant from EXHAUSTED back to ACTIVE —
          the grant hop is caused by the booking hop, not by the confirm
          directly. Trigger differs from fiscal_close and instrument_retire.
        test_recipe:
          setup:
            - "Canonical stack with grant total exactly 18000; b1 APPROVED 2026-09-01 09:00-10:30 (estimate 18000 -> grant EXHAUSTED at available 0); REPORTED downtime 2026-09-01T08:00:00Z-12:00:00Z (UNSCHEDULED_FAILURE); clock at 2026-09-01T08:30:00Z (inside the window)"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 18000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "GET /grants/${g1}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { g_status_pre: $.data.status, g_avail_pre: $.data.budget_available_cents } }
            - { call: "POST /downtime-events", payload: { instrument_id: "${i1}", kind: "UNSCHEDULED_FAILURE", start_at: "2026-09-01T08:00:00Z", end_at: "2026-09-01T12:00:00Z", notes: "cryogen fault" }, as: CoreStaff, as_user_id: "staff-1", captures: { dt1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:30:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /downtime-events/${dt1}/confirm", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { dt_status: $.data.status } }
            - { call: "GET /bookings/${b1}", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { b_status: $.data.status, b_reason: $.data.cancellation_reason, b_pen: $.data.penalty_cents, b_waived: $.data.penalty_waived } }
            - { call: "GET /grants/${g1}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { g_status_post: $.data.status, g_enc_post: $.data.budget_encumbered_cents, g_avail_post: $.data.budget_available_cents } }
            - { call: "GET /instruments/${i1}", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { i_status: $.data.status } }
          assert:
            - "Pre-cascade: grant status == EXHAUSTED with budget_available_cents == 0 (18000 - 18000 encumbered)"
            - "DowntimeEvent.${dt1}.status == CONFIRMED and Instrument.${i1}.status == DOWN (window contains now)"
            - "Hop 1: Booking.${b1}.status == CANCELLED, cancellation_reason == DOWNTIME, penalty_waived == true, penalty_cents == 0"
            - "Hop 2: Grant.${g1}.budget_encumbered_cents == 0, budget_available_cents == 18000, status == ACTIVE (recovered via the release, not directly)"

      - name: instrument_retire_cascade
        grounds:
          - state_machines.Instrument.AVAILABLE_to_RETIRED
          - state_machines.Booking.APPROVED_to_CANCELLED
          - state_machines.Grant.EXHAUSTED_to_ACTIVE
        distinguishing_aspect: |
          Depth-2 chain from POST /instruments/{id}/retire (different origin
          transition than the downtime/fiscal cascades): retirement cancels the
          future APPROVED booking with reason INSTRUMENT_RETIRED, and that
          cancellation releases the encumbrance that flips the saturated grant
          EXHAUSTED -> ACTIVE.
        test_recipe:
          setup:
            - "Canonical stack with grant total exactly 18000; b1 APPROVED 2026-09-01 09:00-10:30; grant EXHAUSTED at available 0"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
            - { call: "POST /training-records/${t1}/certify", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
            - { call: "POST /fiscal-years", payload: { fiscal_year: 2026 }, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets", payload: { fiscal_year: 2026, effective_from: "2026-08-01T00:00:00Z", lines: [ { instrument_id: "${i1}", internal_rate_cents_per_hour: 12000, external_rate_cents_per_hour: 18000, billing_increment_minutes: 15, min_charge_minutes: 30, projected_billable_hours: 500, break_even_waiver_reason: null } ] }, as: FacilityAdmin, as_user_id: "admin-1", captures: { rs26: $.data.id } }
            - { call: "POST /rate-sets/${rs26}/submit", payload: {}, as: FacilityAdmin, as_user_id: "admin-1" }
            - { call: "POST /rate-sets/${rs26}/approve", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /rate-sets/${rs26}/activate", payload: {}, as: FinanceOfficer, as_user_id: "fin-1" }
            - { call: "POST /grants", payload: { grant_code: "NIH-1", pi_user_id: "${u1}", title: "Ion channels", budget_total_cents: 18000, start_date: "2026-01-01", end_date: "2026-12-31" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { g1: $.data.id } }
            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-01T09:00:00Z", end_at: "2026-09-01T10:30:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { b1: $.data.id } }
            - { call: "POST /bookings/${b1}/approve", payload: {}, as: CoreStaff, as_user_id: "staff-1" }
          trigger:
            - { call: "POST /instruments/${i1}/retire", payload: {}, as: FacilityAdmin, as_user_id: "admin-1", captures: { i_status: $.data.status } }
            - { call: "GET /bookings/${b1}", payload: {}, as: CoreStaff, as_user_id: "staff-1", captures: { b_status: $.data.status, b_reason: $.data.cancellation_reason, b_waived: $.data.penalty_waived } }
            - { call: "GET /grants/${g1}", payload: {}, as: FinanceOfficer, as_user_id: "fin-1", captures: { g_status_post: $.data.status, g_avail_post: $.data.budget_available_cents } }
          assert:
            - "Instrument.${i1}.status == RETIRED"
            - "Hop 1: Booking.${b1}.status == CANCELLED with cancellation_reason == INSTRUMENT_RETIRED and penalty_waived == true"
            - "Hop 2: Grant.${g1}.budget_encumbered_cents == 0, budget_available_cents == 18000, status == ACTIVE"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (3 instances, distinct
  # error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_booking_approve
        grounds:
          - validations[priority=6]
          - validations[priority=35]
        distinguishing_aspect: |
          Pair (state, business_fiscal): the booking is already CANCELLED AND
          the grant is amended down to 1 cent of room — the approve surfaces
          ERR_INVALID_STATE (priority 6), never ERR_GRANT_BUDGET_EXCEEDED
          (priority 35).
        test_recipe:
          setup:
            - "Canonical stack; b1 REQUESTED then cancelled (free); grant amended to budget_total_cents 1 via OCC PUT"
          setup_api_calls:
            - { call: "POST /users", payload: { full_name: "Rita Rao", email: "r1@uni.edu", affiliation: "INTERNAL", is_pi: true }, as: FacilityAdmin, as_user_id: "admin-1", captures: { u1: $.data.id } }
            - { call: "POST /instruments", payload: { name: "NMR-600", model: "Bruker AV600", location: "Lab 1", requires_training: true, booking_buffer_minutes: 30, min_booking_minutes: 30, max_booking_minutes: 480, cancellation_free_notice_hours: 24, late_cancel_penalty_pct: 0.5, no_show_penalty_pct: 1.0 }, as: FacilityAdmin, as_user_id: "admin-1", captures: { i1: $.data.id } }
            - { call: "POST /training-records", payload: { user_id: "${u1}", instrument_id: "${i1}" }, as: CoreStaff, as_user_id: "staff-1", captures: { t1: $.data.id } }
