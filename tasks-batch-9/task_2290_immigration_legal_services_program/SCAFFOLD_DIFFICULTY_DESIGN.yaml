              payload: { matter_id: "${m1_id}", event_type: "ASYLUM_INTERVIEW", starts_at_utc: "2026-09-20T09:00:00.000Z", ends_at_utc: "2026-09-20T11:00:00.000Z", location_code: "USCISASO", assigned_representative_id: "${rep_a_id}" }
              as: ProgramDirector
              captures: { x_event_id: "$.data.id" }
          trigger:
            - call: "POST /calendar-events"
              payload: { matter_id: "${m2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-20T11:00:00.000Z", ends_at_utc: "2026-09-20T11:30:00.000Z", location_code: "USCISB", assigned_representative_id: "${rep_b_id}" }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m2_id}", event_type: "BIOMETRICS", starts_at_utc: "2026-09-20T11:00:00.000Z", ends_at_utc: "2026-09-20T11:30:00.000Z", location_code: "USCISB", assigned_representative_id: "${rep_b_id}", client_conflict_waived: true }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${m2_id}", event_type: "FILING_DEADLINE", starts_at_utc: "2026-09-20T10:00:00.000Z", ends_at_utc: "2026-09-20T10:30:00.000Z", location_code: "MAIL" }
              as: ProgramDirector
          assert:
            - "Setup event ${x_event_id} has status 'SCHEDULED' and travel_buffer_minutes == 45 (ASYLUM_INTERVIEW)."
            - "trigger step 1 returns HTTP 409 with error_id 'ERR_CLIENT_CALENDAR_CONFLICT': the client test is fully closed, so candidate.starts_at_utc (11:00:00.000) <= X.ends_at_utc (11:00:00.000) AND X.starts_at_utc (09:00:00.000) <= candidate.ends_at_utc both hold. The scan reaches geometry B because ${rep_b_id} holds no other event, and the two events belong to DIFFERENT matters of the SAME client ${c1_id}."
            - "trigger step 2 returns HTTP 201 for the byte-identical interval once client_conflict_waived is true, with client_conflict_waived == true and travel_buffer_minutes == 30 on the created row; the waiver disables geometry B only."
            - "trigger step 3 returns HTTP 201 even though 10:00-10:30 lies entirely INSIDE the 09:00-11:00 hearing of the same client: candidate.event_type == 'FILING_DEADLINE' short-circuits geometry B, assigned_representative_id is null so geometry A never runs, and the created row has travel_buffer_minutes == 0 and client_conflict_waived == false."
            - "Final state: GET /calendar-events?matter_id=${m2_id} returns total_count 2 (the waived BIOMETRICS and the FILING_DEADLINE); GET /calendar-events?matter_id=${m1_id} returns total_count 1."

  # =====================================================================
  # RULE 9 - compensating_invariant
  # Three DIFFERENT conserved quantities:
  #   INV-CAPACITY-SLOTS      (cycle slot pools)
  #   INV-CASELOAD            (representative counters)
  #   INV-GRANT-ALLOCATION    (money allocation)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: intake_withdrawal_restores_slot_pools_without_touching_detained_reserve
        grounds:
          - calculations.capacity_slot_waterfall
          - calculations.cycle_capacity_posture
          - state_machines.IntakeScreening.SCREENED_to_ACCEPTED
          - state_machines.IntakeScreening.ACCEPTED_to_WITHDRAWN
          - entities.ProgramCapacityCycle.fields.available_slot_count
        distinguishing_aspect: |
          Conserved quantity: general_slots_consumed + detained_slots_consumed +
          available_slot_count == total_case_slots, together with the pool ATTRIBUTION of each
          surviving matter. Accepting a detained intake draws from DETAINED_RESERVED and
          accepting a non-detained one draws from GENERAL; withdrawing only the non-detained
          intake must return the triple to exactly (0, 1, 9) and utilization_ratio to exactly
          0.1000 - not (1, 0, 9), and not a general pool that silently absorbed the detained
          reserve. An implementation that decrements a single scalar counter, or that
          re-attributes the surviving detained matter to GENERAL, breaks the identity.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "Cycle with total_case_slots 10 and reserved_detained_slots 3, so at acceptance time detained_pool_free is 3 and general_pool_free is 10 - 3 - 0 == 7."
            - "Facility in the served jurisdiction 'TX-ELP' so the detained intake is not rejected as INELIGIBLE_JURISDICTION."
            - "Intake iD: detained BOND_HEARING (a FEE_EXEMPT case type) -> pool_order ['DETAINED_RESERVED', 'GENERAL'] -> DETAINED_RESERVED."
            - "Intake iG: non-detained ADJUSTMENT_OF_STATUS -> pool_order ['GENERAL'] -> GENERAL, and its matter is staffed with an ACTIVE LEAD so the withdrawal cascade has assignments to release."
            - "No IntakeScreening is ever WAITLISTED, so the withdrawal cascade stops at hop 3 and no promotion re-consumes the freed slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-CONS", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 10, reserved_detained_slots: 3 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /detention-facilities"
              payload: { name: "El Paso SPC", jurisdiction_code: "TX-ELP", visit_lead_time_hours: 48, max_daily_visit_slots: 2, expedited_filing_days: 21, access_credential_required: false }
              as: ProgramDirector
              captures: { facility_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-940001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Ada Okafor", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 12, max_supervisees: 3, weekly_capacity_hours: 40, bar_number: "TX-940002" }
              as: ProgramDirector
              captures: { rep_a_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Kofi Mensah", preferred_language_code: "en", country_of_birth_code: "GH", date_of_birth: "1989-01-19", household_size: 1, annual_household_income_cents: 1200000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { cd_id: "$.data.id" }
            - call: "PATCH /clients/${cd_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Lucia Ferreira", preferred_language_code: "en", country_of_birth_code: "BR", date_of_birth: "1990-02-20", household_size: 1, annual_household_income_cents: 1300000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { cg_id: "$.data.id" }
            - call: "PATCH /clients/${cg_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${cd_id}", cycle_id: "${cycle_id}", case_type: "BOND_HEARING", detained: true, facility_id: "${facility_id}" }
              as: ProgramDirector
              captures: { id_intake: "$.data.id" }
            - call: "POST /intake-screenings/${id_intake}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${id_intake}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_DETAINED_PRIORITY" }
              as: SupervisingAttorney
              as_user_id: "${rep_a_id}"
            - call: "POST /intake-screenings"
              payload: { client_id: "${cg_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { ig_intake: "$.data.id" }
            - call: "POST /intake-screenings/${ig_intake}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${ig_intake}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${rep_a_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${id_intake}" }
              as: ProgramDirector
              captures: { md_id: "$.data[0].id" }
            - call: "GET /case-matters"
              payload: { intake_id: "${ig_intake}" }
              as: ProgramDirector
              captures: { mg_id: "$.data[0].id", mg_ver: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${mg_id}", representative_id: "${rep_a_id}", role_on_case: "LEAD", expected_matter_version: "${mg_ver}" }
              as: ProgramDirector
              captures: { asg_g_id: "$.data.id" }
            - call: "POST /case-assignments/${asg_g_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
          trigger:
            - call: "POST /intake-screenings/${ig_intake}/withdraw"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
          assert:
            - "Pre-trigger baseline: ProgramCapacityCycle ${cycle_id}.general_slots_consumed == 1, detained_slots_consumed == 1, available_slot_count == 8, utilization_ratio == 0.2000, capacity_posture == 'OPEN', waitlisted_count == 0; CaseMatter ${md_id}.slot_pool_consumed == 'DETAINED_RESERVED' and ${mg_id}.slot_pool_consumed == 'GENERAL'; Representative ${rep_a_id}.active_case_load == 1."
            - "The trigger returns HTTP 200 and IntakeScreening ${ig_intake}.status == 'WITHDRAWN'."
            - "Post-trigger the conserved triple is restored exactly: general_slots_consumed == 0, detained_slots_consumed == 1, available_slot_count == 9, and 0 + 1 + 9 == total_case_slots 10."
            - "utilization_ratio == 0.1000 exactly (1 / 10, 4 decimals) and capacity_posture == 'OPEN'; waitlisted_count is still 0, so no promotion re-consumed the freed slot."
            - "Pool attribution is untouched for the survivor: CaseMatter ${md_id}.slot_pool_consumed is STILL 'DETAINED_RESERVED' and its representation_status is unchanged - the freed slot came out of GENERAL, not out of the detained reserve."
            - "CaseMatter ${mg_id}.representation_status == 'WITHDRAWN_FROM', filing_status == 'CLOSED_NO_FILING', outcome == 'WITHDRAWN' and closed_at_utc == '2026-09-01T00:00:00.000Z'; it is excluded from both slot counts."
            - "CaseAssignment ${asg_g_id}.status == 'RELEASED' with release_reason_code 'CLIENT_WITHDREW', and Representative ${rep_a_id}.active_case_load is back to 0."

      - name: activate_then_release_restores_caseload_and_supervisee_counters_exactly
        grounds:
          - calculations.invariant_active_caseload_conservation
          - state_machines.CaseAssignment.PROPOSED_to_ACTIVE
          - state_machines.CaseAssignment.ACTIVE_to_RELEASED
          - calculations.supervisor_auto_selection
          - entities.Representative.fields.active_case_load
          - entities.Representative.fields.supervisee_count
        distinguishing_aspect: |
          Conserved quantities: sum(active_case_load) == count of ACTIVE LEAD/CO_COUNSEL rows
          AND sum(supervisee_count) == count of ACTIVE rows with a non-null supervision_link_id.
          One ACTIVATE moves BOTH denormalized counters on TWO different representatives (the
          accredited lead and its auto-selected supervisor) and advances the matter to
          SUPERVISED_STAFFED; the compensating RELEASE must decrement exactly those two counters
          and no others, leaving both sums at 0 while the supervisor's own ACTIVE SUPERVISOR
          assignment survives untouched. An implementation that forgets supervisee_count on
          release, or that decrements the supervisor's active_case_load (a SUPERVISOR row never
          counted toward it), breaks a sum identity.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z."
            - "Recognition ACTIVE with authorized_forums ['USCIS']; acc_rep is an ACCREDITED_REP (supervision_required true) holding an APPROVED PARTIAL accreditation over ['USCIS']."
            - "Matter M from an ADJUSTMENT_OF_STATUS intake, so forum == 'USCIS' and the accredited representative's PARTIAL grant covers it as LEAD."
            - "sup_s is a STAFF_ATTORNEY with bar_number, languages ['en','es'], max_supervisees 3, and holds the matter's only ACTIVE SUPERVISOR assignment; the client's preferred_language_code is 'es', which sup_s speaks, so it is the sole auto-selection candidate."
            - "The LEAD assignment is created (PROPOSED) but not yet activated, so both counters are still 0 at the moment the trigger starts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "BIA-R-2026-0777", effective_date: "2026-01-01", expiry_date: "2029-12-31", authorized_forums: ["USCIS"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-970101" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Sofia Marquez", rep_type: "STAFF_ATTORNEY", languages: ["en", "es"], max_case_load: 12, max_supervisees: 3, weekly_capacity_hours: 40, bar_number: "TX-970102" }
              as: ProgramDirector
              captures: { sup_s_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Hector Delgado", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 8, max_supervisees: 0, weekly_capacity_hours: 35 }
              as: ProgramDirector
              captures: { acc_rep_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${acc_rep_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
              captures: { acc_id: "$.data.id" }
            - call: "POST /accreditations/${acc_id}/transition"
              payload: { action: "APPROVE", decision_reason_code: "CREDENTIALS_VERIFIED" }
              as: SupervisingAttorney
              as_user_id: "${sup_s_id}"
            - call: "POST /clients"
              payload: { full_name: "Rosa Jimenez", preferred_language_code: "es", country_of_birth_code: "GT", date_of_birth: "1987-09-09", household_size: 3, annual_household_income_cents: 2600000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: true }
              as: ProgramDirector
              captures: { client_id: "$.data.id" }
            - call: "PATCH /clients/${client_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${client_id}", cycle_id: "${cycle_id}", case_type: "ADJUSTMENT_OF_STATUS", detained: false }
              as: ProgramDirector
              captures: { intake_id: "$.data.id" }
            - call: "POST /intake-screenings/${intake_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${intake_id}/decide"
              payload: { decision: "ACCEPT", decision_reason_code: "ACCEPTED_ON_MERIT" }
              as: SupervisingAttorney
              as_user_id: "${sup_s_id}"
            - call: "GET /case-matters"
              payload: { intake_id: "${intake_id}" }
              as: ProgramDirector
              captures: { matter_id: "$.data[0].id", m_ver1: "$.data[0].version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${sup_s_id}", role_on_case: "SUPERVISOR", expected_matter_version: "${m_ver1}" }
              as: ProgramDirector
              captures: { asg_sup_id: "$.data.id" }
            - call: "POST /case-assignments/${asg_sup_id}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramDirector
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { m_ver2: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${acc_rep_id}", role_on_case: "LEAD", expected_matter_version: "${m_ver2}" }
              as: ProgramDirector
              captures: { asg_lead_id: "$.data.id" }
          trigger:
            - call: "POST /case-assignments/${asg_lead_id}/transition"
              payload: { action: "ACTIVATE" }
