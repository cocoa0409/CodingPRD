            - call: "POST /supply/takeoffs/${tk49}/lock"
              payload: { expected_takeoff_version: "${tk49_v}" }
              as: EstimatorUser
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${p50}" }
              as: EstimatorUser
              captures: { tk50: $.data.id }
            - call: "POST /supply/takeoffs/${tk50}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk50}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk50}"
              payload: {}
              as: EstimatorUser
              captures: { tk50_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk50}/lock"
              payload: { expected_takeoff_version: "${tk50_v}" }
              as: EstimatorUser
          trigger:
            - call: "POST /supply/projects/${p49}/open-stocking"
              payload: {}
              as: Foreman
