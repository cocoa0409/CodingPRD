            - { call: "POST /surveys/${survey_id}/submissions", payload: { submitted_by_employee_id: "${analyst_id}", incumbent_snapshot: [{ employee_id: "${subject_id}", job_id: "${job_id}", base_salary_annual_cents: 9000000, geo_code: "US-SF" }] }, as: CompAnalyst, as_user_id: "${analyst_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /submissions/${sub_id}/mark_ready", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /submissions/${sub_id}/submit", payload: {}, as: CompAnalyst, as_user_id: "${analyst_id}" }
            - { call: "POST /surveys/${survey_id}/close", payload: {}, as: VendorAdmin }
