# =============================================================================
# 1.9 Scaffold Corner Design — breadth walk of claim-extraction-guide.md against
# this scaffold's §1.1-§1.7 surface. Depth (the nine §0.5 reasoning rules) lives
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there are emitted
# here as `excluded_because:` stubs.
#
# Recurring reachability chains referenced by the prose in `setup:`:
#   CHAIN-APPLIED : POST operators -> POST mine-sites -> POST permits
#                   (permit in APPLICATION_SUBMITTED, no bond determination yet)
#   CHAIN-ISSUED  : CHAIN-APPLIED -> POST reclamation-cost-estimates
#                   -> GET permit (version) -> accept estimate (bond_required
#                   865998.00 at 6000.00/acre over 120 acres)
#                   -> POST bond-instruments CASH 900000.00 -> accept
#                   -> POST permits/{id}/decide ISSUE
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: operator_creation_returns_declared_fields_with_zeroed_ledgers
        claim_type: creation
        grounds:
          - entities.Operator
          - endpoints[POST /mining/operators]
          - response_envelope.success
        distinguishing_aspect: "A single POST /mining/operators with the six declared input fields returns 201 with registry_status ACTIVE, self_bond_status UNTESTED and every computed ledger at zero."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mining/operators"
              payload: { legal_name: "Ashfall Mining Corporation", tangible_net_worth: 15000000.00, fixed_assets_in_state: 7000000.00, total_liabilities: 5000000.00, net_income_prior_year: 600000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op1_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object and meta.api_request_id present"
            - "Operator.${c_op1_id}.legal_name == 'Ashfall Mining Corporation' and elected_financial_test == NET_WORTH_TEST"
            - "Operator.${c_op1_id}.registry_status == ACTIVE and self_bond_status == UNTESTED"
            - "Operator.${c_op1_id}.self_bond_capacity_amount == 0.00, self_bond_exposure_amount == 0.00, violation_points_total == 0, outstanding_penalty_balance == 0.00, forfeiture_count == 0, refund_due_amount == 0.00"
            - "Operator.${c_op1_id}.version == 1 with id, created_at and updated_at populated"

      - name: mine_site_retrieval_returns_stored_and_defaulted_fields
        claim_type: retrieval
        grounds:
          - entities.MineSite
          - endpoints[GET /mining/mine-sites/{id}]
        distinguishing_aspect: "GET /mining/mine-sites/{id} echoes the stored name, county and total_acres and shows the declared defaults site_class ACTIVE_PERMITTED, hazard_class H3_MODERATE and funding_status NOT_APPLICABLE."
        test_recipe:
          setup:
            - "One MineSite created with name, county and total_acres only (site_class omitted)."
          setup_api_calls:
            - call: "POST /mining/mine-sites"
              payload: { name: "Ashfall North Pit", county: "Rosebud", total_acres: 310.00 }
              as: ProgramDirector
              captures: { c_site1_id: $.data.id }
          trigger:
            - call: "GET /mining/mine-sites/${c_site1_id}"
              as: PublicParticipant
          assert:
            - "MineSite.${c_site1_id}.name == 'Ashfall North Pit', county == 'Rosebud', total_acres == 310.00"
            - "MineSite.${c_site1_id}.site_class == ACTIVE_PERMITTED and hazard_class == H3_MODERATE (declared defaults)"
            - "MineSite.${c_site1_id}.funding_status == NOT_APPLICABLE, legacy_priority_score == 0.00, awarded_funding_amount == 0.00, unfunded_reclamation_need == 0.00"

      - name: permit_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /mining/permits]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three permits for one operator, GET /mining/permits?operator_id&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One operator with three APPLICATION_SUBMITTED permits, one per site."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Threefold Quarries", tangible_net_worth: 14000000.00, fixed_assets_in_state: 7000000.00, total_liabilities: 5000000.00, net_income_prior_year: 500000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op2_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Threefold Site One", county: "Gallatin", total_acres: 200.00 }
              as: ProgramDirector
              captures: { c_site2a_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Threefold Site Two", county: "Gallatin", total_acres: 200.00 }
              as: ProgramDirector
              captures: { c_site2b_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Threefold Site Three", county: "Gallatin", total_acres: 200.00 }
              as: ProgramDirector
              captures: { c_site2c_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site2a_id}", operator_id: "${c_op2_id}", mining_plan_acres: 40.00, post_mining_land_use: "CROPLAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op2_id}"
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site2b_id}", operator_id: "${c_op2_id}", mining_plan_acres: 50.00, post_mining_land_use: "CROPLAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op2_id}"
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site2c_id}", operator_id: "${c_op2_id}", mining_plan_acres: 60.00, post_mining_land_use: "CROPLAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op2_id}"
          trigger:
            - call: "GET /mining/permits"
              payload: { operator_id: "${c_op2_id}", limit: 2, offset: 0 }
              as: PermitReviewer
            - call: "GET /mining/permits"
              payload: { operator_id: "${c_op2_id}", limit: 2, offset: 2 }
              as: PermitReviewer
          assert:
            - "First page: response_type == array, exactly 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: exactly 1 data row, total_count == 3, has_more == false, offset == 2"
            - "The two pages together contain three distinct permit ids, all with operator_id == ${c_op2_id}"

      - name: permit_get_with_unknown_id_rejected
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_PERMIT_NOT_FOUND]
          - endpoints[GET /mining/permits/{id}]
        distinguishing_aspect: "A syntactically valid but unstored permit id returns ERR_PERMIT_NOT_FOUND with HTTP 404 rather than an empty object."
        test_recipe:
          setup:
            - "Empty database — no Permit rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /mining/permits/00000000-0000-0000-0000-0000000000ff"
              as: PermitReviewer
              captures: { c_err_nf: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error and ${c_err_nf} == ERR_PERMIT_NOT_FOUND"
            - "The response body carries meta.api_request_id and data.message"

      - name: estimate_creation_missing_direct_cost_per_acre_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /mining/reclamation-cost-estimates]
        distinguishing_aspect: "Omitting the required direct_cost_per_acre input returns ERR_INVALID_REQUEST (422) and stores no ReclamationCostEstimate row."
        test_recipe:
          setup:
            - "CHAIN-APPLIED: one operator, one site, one APPLICATION_SUBMITTED permit of 120 acres."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Halfform Estimating Client", tangible_net_worth: 12000000.00, fixed_assets_in_state: 6000000.00, total_liabilities: 4500000.00, net_income_prior_year: 400000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op3_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Halfform Pit", county: "Carbon", total_acres: 250.00 }
              as: ProgramDirector
              captures: { c_site3_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site3_id}", operator_id: "${c_op3_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op3_id}"
              captures: { c_permit3_id: $.data.id }
          trigger:
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${c_permit3_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01" }
              as: Operator
              as_user_id: "${c_op3_id}"
              captures: { c_err_req: $.data.error_id }
          assert:
            - "HTTP 422 with ${c_err_req} == ERR_INVALID_REQUEST"
            - "GET /mining/permits/${c_permit3_id}/reclamation-cost-estimates returns total_count == 0"
            - "Permit.${c_permit3_id}.bond_required_amount == 0.00 and status == APPLICATION_SUBMITTED"

      - name: release_application_defaults_public_participation_counters
        claim_type: defaults
        grounds:
          - entities.BondReleaseApplication.fields.comment_count
          - entities.BondReleaseApplication.fields.objection_count
          - entities.BondReleaseApplication.fields.objections_resolved
          - calculations.bond_release_amount
        distinguishing_aspect: "A freshly created PHASE_I application on a permit with 60 disturbed acres defaults comment_count 0, objection_count 0 and objections_resolved false while its computed requested_amount is 173199.60."
        test_recipe:
          setup:
            - "CHAIN-ISSUED with bond_required 865998.00 and bond_held 900000.00, then disturbance reported as 60.00 acres, so per_acre_bond is round(865998.00 / 60, 2) == 14433.30."
            - "A PHASE_I application for 20.00 acres: eligible round(14433.30 * 20 * 0.60, 2) == 173199.60, retention_floor 346399.20, available 553600.80."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Quiet Fork Minerals", tangible_net_worth: 16000000.00, fixed_assets_in_state: 8000000.00, total_liabilities: 5000000.00, net_income_prior_year: 700000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op4_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Quiet Fork Pit", county: "Boone", total_acres: 260.00 }
              as: ProgramDirector
              captures: { c_site4_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site4_id}", operator_id: "${c_op4_id}", mining_plan_acres: 120.00, post_mining_land_use: "FORESTLAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op4_id}"
              captures: { c_permit4_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${c_permit4_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${c_op4_id}"
              captures: { c_est4_id: $.data.id }
            - call: "GET /mining/permits/${c_permit4_id}"
              as: PermitReviewer
              captures: { c_p4v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est4_id}/accept"
              payload: { expected_permit_version: "${c_p4v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${c_permit4_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${c_op4_id}"
              captures: { c_inst4_id: $.data.id }
            - call: "POST /mining/bond-instruments/${c_inst4_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${c_permit4_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "PATCH /mining/permits/${c_permit4_id}/disturbance"
              payload: { disturbed_acres: 60.00 }
              as: Operator
              as_user_id: "${c_op4_id}"
          trigger:
            - call: "POST /mining/bond-release-applications"
              payload: { permit_id: "${c_permit4_id}", phase: "PHASE_I", acres_requested: 20.00 }
              as: Operator
              as_user_id: "${c_op4_id}"
              captures: { c_app4_id: $.data.id }
          assert:
            - "BondReleaseApplication.${c_app4_id}.status == SUBMITTED (declared initial state)"
            - "BondReleaseApplication.${c_app4_id}.comment_count == 0, objection_count == 0, objections_resolved == false"
            - "BondReleaseApplication.${c_app4_id}.approved_amount == 0.00, notice_start_date == null, notice_end_date == null, inspection_id == null, decided_by_user_id == null"
            - "BondReleaseApplication.${c_app4_id}.requested_amount == 173199.60"

      - name: bond_instrument_credited_amount_computed_at_acceptance_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.BondInstrument.fields.credited_amount
          - entities.BondInstrument.fields.status
          - calculations.bond_instrument_credited_amount
        distinguishing_aspect: "A creation payload that also carries credited_amount 999999.00 and status ACCEPTED is stored as credited_amount 0.00 / status PROPOSED, and acceptance later computes credited_amount 810000.00 from the SURETY A multiplier."
        test_recipe:
          setup:
            - "CHAIN-APPLIED plus an ACCEPTED estimate, so bond_required_amount is 865998.00 and instruments may be posted."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Overreach Surety Client", tangible_net_worth: 15000000.00, fixed_assets_in_state: 7500000.00, total_liabilities: 5000000.00, net_income_prior_year: 600000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op5_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Overreach Pit", county: "Logan", total_acres: 240.00 }
              as: ProgramDirector
              captures: { c_site5_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site5_id}", operator_id: "${c_op5_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op5_id}"
              captures: { c_permit5_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${c_permit5_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${c_op5_id}"
              captures: { c_est5_id: $.data.id }
            - call: "GET /mining/permits/${c_permit5_id}"
              as: PermitReviewer
              captures: { c_p5v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est5_id}/accept"
              payload: { expected_permit_version: "${c_p5v1}" }
              as: PermitReviewer
          trigger:
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${c_permit5_id}", instrument_type: "SURETY", face_amount: 900000.00, surety_company_name: "Cordillera Surety", surety_naic_rating: "A", credited_amount: 999999.00, status: "ACCEPTED" }
              as: Operator
              as_user_id: "${c_op5_id}"
              captures: { c_inst5_id: $.data.id }
            - call: "POST /mining/bond-instruments/${c_inst5_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
          assert:
            - "At creation BondInstrument.${c_inst5_id}.credited_amount == 0.00 and status == PROPOSED — the client-supplied 999999.00 and ACCEPTED are ignored"
            - "After acceptance BondInstrument.${c_inst5_id}.credited_amount == 810000.00 (900000.00 x SURETY_RATING_MULTIPLIER[A] 0.90) and status == ACCEPTED"
            - "Permit.${c_permit5_id}.bond_held_amount == 810000.00 and bond_deficiency_amount == 55998.00"

      - name: permit_system_fields_server_generated_client_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Permit
          - response_envelope.success
        distinguishing_aspect: "A creation payload carrying id, version, created_at and status is stored with a server-minted id, version 1, a server clock created_at and status APPLICATION_SUBMITTED — none of the four client values survive."
        test_recipe:
          setup:
            - "One operator and one site; the logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Spoofed Fields Mining", tangible_net_worth: 11000000.00, fixed_assets_in_state: 5500000.00, total_liabilities: 4000000.00, net_income_prior_year: 300000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op6_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Spoofed Fields Pit", county: "Dunn", total_acres: 180.00 }
              as: ProgramDirector
              captures: { c_site6_id: $.data.id }
          trigger:
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site6_id}", operator_id: "${c_op6_id}", mining_plan_acres: 90.00, post_mining_land_use: "INDUSTRIAL", proposed_start_date: "2026-09-01", id: "11111111-1111-1111-1111-111111111111", version: 47, created_at: "2020-01-01T00:00:00Z", status: "ISSUED" }
              as: Operator
              as_user_id: "${c_op6_id}"
              captures: { c_permit6_id: $.data.id }
          assert:
            - "${c_permit6_id} != '11111111-1111-1111-1111-111111111111'"
            - "Permit.${c_permit6_id}.version == 1 and created_at == 2026-08-01T00:00:00Z (logical clock), not 2020-01-01T00:00:00Z"
            - "Permit.${c_permit6_id}.status == APPLICATION_SUBMITTED and issued_at == null"
            - "Permit.${c_permit6_id}.compliance_posture == COMPLIANT, bond_required_amount == 0.00, bond_held_amount == 0.00"

      - name: permit_creation_invalid_post_mining_land_use_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Permit.fields.post_mining_land_use
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A post_mining_land_use value outside the declared six-member enum returns ERR_INVALID_REQUEST (422) and creates no Permit row."
        test_recipe:
          setup:
            - "One operator and one site."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Bad Enum Mining", tangible_net_worth: 11500000.00, fixed_assets_in_state: 5700000.00, total_liabilities: 4200000.00, net_income_prior_year: 320000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op7_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Bad Enum Pit", county: "Ward", total_acres: 170.00 }
              as: ProgramDirector
              captures: { c_site7_id: $.data.id }
          trigger:
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site7_id}", operator_id: "${c_op7_id}", mining_plan_acres: 60.00, post_mining_land_use: "GOLF_COURSE", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op7_id}"
              captures: { c_err_enum: $.data.error_id }
          assert:
            - "HTTP 422 with ${c_err_enum} == ERR_INVALID_REQUEST"
            - "GET /mining/permits with operator_id ${c_op7_id} returns total_count == 0"

      - name: violation_notice_severity_points_above_declared_maximum_rejected
        claim_type: type_constraints
        grounds:
          - entities.ViolationNotice.fields.severity_points
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "severity_points 41 breaches the declared 0..40 range and returns ERR_INVALID_REQUEST (422), so no notice row and no points accrual occur."
        test_recipe:
          setup:
            - "CHAIN-ISSUED, one inspector, and one COMPLETED ROUTINE inspection with result VIOLATIONS_FOUND on that permit."
          setup_api_calls:
            - call: "POST /mining/operators"
              payload: { legal_name: "Range Overflow Mining", tangible_net_worth: 13000000.00, fixed_assets_in_state: 6500000.00, total_liabilities: 4600000.00, net_income_prior_year: 450000.00, elected_financial_test: "NET_WORTH_TEST" }
              as: ProgramDirector
              captures: { c_op8_id: $.data.id }
            - call: "POST /mining/mine-sites"
              payload: { name: "Range Overflow Pit", county: "Emery", total_acres: 220.00 }
              as: ProgramDirector
              captures: { c_site8_id: $.data.id }
            - call: "POST /mining/permits"
              payload: { mine_site_id: "${c_site8_id}", operator_id: "${c_op8_id}", mining_plan_acres: 120.00, post_mining_land_use: "RANGELAND", proposed_start_date: "2026-09-01" }
              as: Operator
              as_user_id: "${c_op8_id}"
              captures: { c_permit8_id: $.data.id }
            - call: "POST /mining/reclamation-cost-estimates"
              payload: { permit_id: "${c_permit8_id}", estimator_firm: "Ridgeline Reclamation Engineers", estimator_license_no: "RE-4417", estimate_effective_date: "2026-07-01", direct_cost_per_acre: 6000.00 }
              as: Operator
              as_user_id: "${c_op8_id}"
              captures: { c_est8_id: $.data.id }
            - call: "GET /mining/permits/${c_permit8_id}"
              as: PermitReviewer
              captures: { c_p8v1: $.data.version }
            - call: "POST /mining/reclamation-cost-estimates/${c_est8_id}/accept"
              payload: { expected_permit_version: "${c_p8v1}" }
              as: PermitReviewer
            - call: "POST /mining/bond-instruments"
              payload: { permit_id: "${c_permit8_id}", instrument_type: "CASH", face_amount: 900000.00 }
              as: Operator
              as_user_id: "${c_op8_id}"
              captures: { c_inst8_id: $.data.id }
            - call: "POST /mining/bond-instruments/${c_inst8_id}/accept"
              as: BondSpecialist
              as_user_id: "bs-001"
            - call: "POST /mining/permits/${c_permit8_id}/decide"
              payload: { decision: "ISSUE" }
              as: PermitReviewer
            - call: "POST /mining/inspector-profiles"
              payload: { full_name: "Cassie Vollmer", certification_level: "CERT_III", region: "WEST" }
              as: ProgramDirector
              captures: { c_insp8_id: $.data.id }
            - call: "POST /mining/inspections"
              payload: { permit_id: "${c_permit8_id}", inspector_id: "${c_insp8_id}", inspection_type: "ROUTINE", scheduled_start: "2026-08-04T09:00:00Z", duration_hours: 3 }
              as: ProgramDirector
              captures: { c_ins8_id: $.data.id }
            - call: "POST /mining/inspections/${c_ins8_id}/record-result"
              payload: { result: "VIOLATIONS_FOUND", findings_note: "Sediment control structures not maintained." }
              as: Inspector
              as_user_id: "${c_insp8_id}"
          trigger:
