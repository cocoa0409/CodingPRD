          assert:
            - "at 4 assigned: open_inbox_count == 4 and inbox_overloaded == false"
            - "at 5 assigned: open_inbox_count == 5 and inbox_overloaded == true (>= 5 boundary)"
            - "after completing one: open_inbox_count == 4 and inbox_overloaded == false (flag re-evaluated on every change)"

      - name: disclosed_fee_ceiling_and_requote_recovery
        claim_type: reconciliation
        grounds:
          - "validations[priority=30]"
          - "errors[ERR_DISCLOSED_FEE_EXCEEDED]"
          - "state_machines.ConsentRecord.GRANTED_to_SUPERSEDED"
        distinguishing_aspect: "Consent pins the disclosed fee at determination time (8 min -> 5000c); adding 10 more provider minutes before completion makes the computed fee 8000c, which claim creation rejects until a re-determination supersedes the consent and re-discloses 8000c."
        test_recipe:
          setup: ["Message determined BILLABLE_CANDIDATE at 8 minutes (disclosed 5000c); patient GRANTED; then provider logs 10 more minutes (total 18) while message is back IN_REVIEW"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent1: "$.data[0].id", fee1: "$.data[0].disclosed_fee_cents" } }
            - { call: "POST /inbox/consent-records/${consent1}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 10 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "extended review" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/portal-messages/${m}/reply", payload: { body: "one more symptom" }, as: Patient, as_user_id: "${pat}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v3: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v3}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
