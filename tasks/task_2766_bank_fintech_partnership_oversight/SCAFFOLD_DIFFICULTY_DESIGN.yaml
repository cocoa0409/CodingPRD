      - name: compliance_capability_floor_outranks_composite_floor_on_diligence_pass
        grounds:
          - validations[priority=56]
          - validations[priority=57]
          - calculations.diligence_composite_score
          - state_machines.DiligenceReview.SUBMITTED_to_PASSED
        distinguishing_aspect: |
          Two sub-score sets that both fail the PASSED gate are contrasted on one
          differential: partner A scores compliance_capability 59 with composite
          54.7 so BOTH floors are violated and the answer must be 422
          ERR_COMPLIANCE_CAPABILITY_FLOOR (priority 56), while partner B scores
          compliance_capability 60 with composite 54.8 so only the composite
          floor is violated and the answer must be 422
          ERR_DILIGENCE_SCORE_BELOW_FLOOR (priority 57); this is a
          business_rule/business_rule pair distinct from the 52/46
          business_safety-versus-state pair above. Two partners are required
          because validation priority 70 permits only one open review per
          partner.
        test_recipe:
          setup:
            - "One OPEN cycle. Partner A 'Tallow Credit' and partner B 'Rushmere Credit', both PROSPECT with end_user_account_count = 0 so complaint_rate_bps = 0 and the INITIAL variant consumes complaint_history_score verbatim."
            - "A's review: 60 / 60 / 59 / 35 -> 12.00 + 15.00 + 20.65 + 7.00 = 54.65 -> 54.7; compliance_capability_score 59 < 60."
            - "B's review: 60 / 59 / 60 / 35 -> 12.00 + 14.75 + 21.00 + 7.00 = 54.75 -> 54.8; compliance_capability_score 60 passes its floor, composite 54.8 < 55.0."
            - "Both reviews are SUBMITTED by po_1 and decided by co_1, satisfying the segregation-of-duties precondition so priority 14 cannot pre-empt either pair."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners"
              payload: { legal_name: "Tallow Credit LLC", business_model: "LENDING", funding_stage: "SEED", months_runway: 9, disclosed_complaints_per_10k: 40.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { a_id: "$.data.id", a_v1: "$.data.version" }
            - call: "POST /oversight/partners"
              payload: { legal_name: "Rushmere Credit LLC", business_model: "LENDING", funding_stage: "SEED", months_runway: 9, disclosed_complaints_per_10k: 40.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { b_id: "$.data.id", b_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${a_id}", review_type: "INITIAL", business_model_score: 60, funding_score: 60, compliance_capability_score: 59, complaint_history_score: 35, expected_partner_version: "${a_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { a_dr: "$.data.id" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${b_id}", review_type: "INITIAL", business_model_score: 60, funding_score: 59, compliance_capability_score: 60, complaint_history_score: 35, expected_partner_version: "${b_v1}" }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { b_dr: "$.data.id" }
            - call: "POST /oversight/diligence-reviews/${a_dr}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { a_comp: "$.data.composite_score", a_tier: "$.data.tier" }
            - call: "POST /oversight/diligence-reviews/${b_dr}/submit"
              payload: {}
              as: ProgramOfficer
              as_user_id: po_1
              captures: { b_comp: "$.data.composite_score", b_tier: "$.data.tier" }
          trigger:
            - call: "POST /oversight/diligence-reviews/${a_dr}/decide"
              payload: { outcome: "PASSED", decision_note: "attempt A" }
              as: ComplianceOfficer
              as_user_id: co_1
            - call: "POST /oversight/diligence-reviews/${b_dr}/decide"
              payload: { outcome: "PASSED", decision_note: "attempt B" }
              as: ComplianceOfficer
              as_user_id: co_1
          assert:
            - "${a_comp} == 54.7 and ${a_tier} == UNRATED"
            - "${b_comp} == 54.8 and ${b_tier} == UNRATED"
            - "the ${a_dr} decide call responds 422 with error_id ERR_COMPLIANCE_CAPABILITY_FLOOR   # both floors broken, 56 wins"
            - "the ${a_dr} response error_id is NOT ERR_DILIGENCE_SCORE_BELOW_FLOOR"
            - "the ${b_dr} decide call responds 422 with error_id ERR_DILIGENCE_SCORE_BELOW_FLOOR   # only 57 is broken"
            - "DiligenceReview.${a_dr}.status == SUBMITTED and DiligenceReview.${b_dr}.status == SUBMITTED"
            - "Partner.${a_id}.status == IN_DILIGENCE and Partner.${b_id}.status == IN_DILIGENCE"
            - "Partner.${a_id}.capability_tier == UNRATED"
            - "Partner.${a_id}.latest_composite_score == 54.7   # recomputed at submit, unaffected by the refused decision"

      - name: stale_partner_occ_outranks_terminal_partner_guard_on_agreement_create
        grounds:
          - concurrency_rules[agreement-create-stale-partner]
          - validations[priority=28]
          - validations[priority=32]
          - state_machines.DiligenceReview.SUBMITTED_to_FAILED
        distinguishing_aspect: |
          An agreement-create request carries a partner version captured before a
          FAILED diligence decision, so the OCC precondition (priority 28,
          concurrency category, 412 ERR_STALE_PARTNER_VERSION) and the terminal
          partner guard (priority 32, state category, 409 ERR_PARTNER_TERMINAL)
          are simultaneously violated; the OCC error must win, and retrying with
          the freshly captured version then surfaces the 409, proving both
          conditions were live. This is a concurrency/state pair, different from
          both pairs above.
        test_recipe:
          setup:
            - "One OPEN cycle. Partner 'Bitterroot Neo' takes an INITIAL review scored 30 / 30 / 30 / 30, submitted by po_1."
            - "The partner version is captured immediately after submit and held as the stale token."
            - "co_1 then decides FAILED, which drives Partner.status IN_DILIGENCE -> DILIGENCE_FAILED (terminal) and bumps its version."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: po_1
            - call: "POST /oversight/partners"
              payload: { legal_name: "Bitterroot Neo Inc", business_model: "PAYMENT_FACILITATION", funding_stage: "SEED", months_runway: 4, disclosed_complaints_per_10k: 80.00, end_user_account_count: 0 }
              as: ProgramOfficer
              as_user_id: po_1
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /oversight/diligence-reviews"
              payload: { partner_id: "${p_id}", review_type: "INITIAL", business_model_score: 30, funding_score: 30, compliance_capability_score: 30, complaint_history_score: 30, expected_partner_version: "${p_v1}" }
