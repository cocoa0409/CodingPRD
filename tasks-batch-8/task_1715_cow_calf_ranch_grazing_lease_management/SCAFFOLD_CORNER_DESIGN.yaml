  # ---------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_lease_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-amend-stale-version]", "errors[ERR_STALE_VERSION]", "endpoints[PATCH /api/grazing-leases/{id}]"]
        distinguishing_aspect: "PATCH with the pre-activation version (stale by one activation bump) fails 412; the version from the activate response succeeds and increments."
        test_recipe:
          setup: ["Ranch R; LEASED pasture P base 500; lease L created (version 1) then ACTIVATED (version 2)"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 1600, tenure: "LEASED", forage_type: "NATIVE_RANGE", base_capacity_aum: 500 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/grazing-leases", payload: { ranch_id: "${ranch_id}", pasture_id: "${p}", lessor_name: "L", start_date: "2026-01-01", end_date: "2026-12-31", aum_allotment: 100, rate_per_aum_cents: 2500, minimum_commit_aum: 10, overage_tier1_cap_aum: 10, overage_tier1_rate_cents: 3000, overage_tier2_rate_cents: 3750, settlement_basis: "ACTUAL_USE" }, as: RangeManager, captures: { lease: $.data.id, lv1: $.data.version } }
            - { call: "POST /api/grazing-leases/${lease}/activate", payload: {}, as: RangeManager, captures: { lv2: $.data.version } }
          trigger:
            - { call: "PATCH /api/grazing-leases/${lease}", payload: { expected_lease_version: "${lv1}", rate_per_aum_cents: 2600 }, as: RangeManager, captures: { err: $.data.error_id } }
            - { call: "PATCH /api/grazing-leases/${lease}", payload: { expected_lease_version: "${lv2}", rate_per_aum_cents: 2600 }, as: RangeManager }
          assert:
            - "${err} == ERR_STALE_VERSION with HTTP 412 (version moved 1 -> 2 at activation)"
            - "Retry with the fresh version succeeds: rate_per_aum_cents == 2600 and version == ${lv2} + 1 == 3"

      - name: occ_assessment_finalize_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assessment-finalize-stale-ranch]", "errors[ERR_STALE_VERSION]", "endpoints[POST /api/drought-assessments/{id}/finalize]"]
        distinguishing_aspect: "Finalize carrying the ranch version from before a policy PATCH fails 412; re-reading the ranch and finalizing with the current version succeeds (posture WATCH applied, seq 1)."
        test_recipe:
          setup: ["Ranch R (v1); pasture P base 100; group G 10 GROWING @800 (no deficit at any posture); ranch PATCHed to grace 21 (v2); assessment A at 80 pct (DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id, rv1: $.data.version } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 400, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 100 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "GROWING", head_count: 10, avg_weight_lbs: 800 }, as: HerdManager }
            - { call: "PATCH /api/ranches/${ranch_id}", payload: { destock_grace_days: 21 }, as: RanchManager, captures: { rv2: $.data.version } }
            - { call: "POST /api/drought-assessments", payload: { ranch_id: "${ranch_id}", assessment_date: "2026-08-01", pasture_measurements: [ { pasture_id: "${p}", production_pct_of_normal: 80 } ] }, as: RangeManager, captures: { a: $.data.id } }
          trigger:
            - { call: "POST /api/drought-assessments/${a}/finalize", payload: { expected_ranch_version: "${rv1}" }, as: RangeManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/drought-assessments/${a}/finalize", payload: { expected_ranch_version: "${rv2}" }, as: RangeManager }
          assert:
            - "${err} == ERR_STALE_VERSION (412) — the PATCH advanced Ranch.version 1 -> 2 after the client read it"
            - "Second finalize with current version succeeds: assessment_status == FINALIZED; Ranch.drought_posture == WATCH, ranch_production_pct == 80.0, assessment_seq == 1, version == 3"

      - name: pasture_available_reconciles_after_shorten
        claim_type: derived_field_reconciliation
        grounds: [calculations.effective_pasture_capacity, entities.Pasture.fields.consumed_total_aum]
        excluded_because:
          difficulty_instance: "compensating_invariant / aum_reserve_cancel_conservation"
          rationale: "The shorten proration (consumed 9.33, available 190.67) is asserted there."

      - name: drought_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.DroughtAssessment.DRAFT_to_FINALIZED]
        excluded_because:
          difficulty_instance: "transitive_cascade / drought_finalize_critical_cascade"
          rationale: "The 4-link cascade including blocking gate and compliance close-out is asserted there."

  # ---------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_assignment_create
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.Pasture.fields.committed_aum]
        distinguishing_aspect: "The create response's side effects are visible on the very next read: after creating a 40.0-AUM assignment, GET pasture shows committed 40.0 / available 160.0 with no delay."
        test_recipe:
          setup: ["Ranch R; DEEDED pasture P base 200; group G 20 MATURE_COW @1000"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/pastures", payload: { ranch_id: "${ranch_id}", name: "P", acreage: 900, tenure: "DEEDED", forage_type: "NATIVE_RANGE", base_capacity_aum: 200 }, as: RangeManager, captures: { p: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 20, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /api/grazing-assignments", payload: { pasture_id: "${p}", herd_group_id: "${g}", ranch_id: "${ranch_id}", start_date: "2026-06-01", planned_end_date: "2026-07-31" }, as: RangeManager, captures: { a: $.data.id } }
            - { call: "GET /api/pastures/${p}", payload: {}, as: RangeManager, captures: { committed: $.data.committed_aum, available: $.data.available_aum } }
          assert:
            - "GrazingAssignment.${a}.assignment_status == ACTIVE and reserved_aum == 40.0 in the create response"
            - "${committed} == 40.0 and ${available} == 160.0 on the immediate next read"
