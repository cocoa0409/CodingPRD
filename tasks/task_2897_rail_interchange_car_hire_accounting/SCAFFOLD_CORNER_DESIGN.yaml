          - global_constants.LATE_REPORT_LIMIT_HOURS
        excluded_because:
          difficulty_instance: clearinghouse_fee_steps_down_at_exactly_500000_cents_of_pre_fee_net
          rationale: "The cumulative money threshold is pinned at break-1 / break / break+1 in the difficulty index, and the instantaneous time threshold is pinned at exactly 168 h and 169 h in late_event_limit_inclusive_at_exactly_168_hours_and_refused_at_169; both boundary families are therefore already covered."

  # ===========================================================================
  - section: consistency model
    instances:

      - name: every_cascade_is_visible_in_the_same_response_not_on_a_later_read
        claim_type: All changes visible in same request's response
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - state_machines.Dispute.OPEN_to_ACCEPTED
          - state_machines.SettlementCycle.EXCHANGED_to_RECONCILED
        distinguishing_aspect: "consistency_model is immediate, so the response body of the mutating call must ALREADY carry every derived consequence — the accepting call's own payload shows the final resolution_amount_cents, and an immediately following read of the movement, the cycle and the ledger must match that body byte for byte with no second write and no settling delay. This is the claim that fails for an implementation that recomputes lazily on the next GET: the write's own response would show stale money even though a later read looks right."
        test_recipe:
          setup:
            - "The CYCLE_1 fixture computed and exchanged at clock 2026-09-01T00:00:00Z (gross_hire_cents 11464, clearinghouse_fee_cents 57, net_settlement_cents 11407). BN, the payer, files a HIRE_RATE dispute of 5000 against the single movement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-28T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 1000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-28T00:00:00Z", odometer_miles: 1240, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "GET /car-hire/hire-movements?car_id=${car_id}&handling_road_id=${bn_id}&status=CLOSED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { mv_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/settlement-cycles"
              payload: { payer_road_id: "${bn_id}", payee_road_id: "${cx_id}", period_month: "2026-08" }
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { cycle_id: "$.data.id" }
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/compute"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { net_before: "$.data.net_settlement_cents" }
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/exchange"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { cyc_v: "$.data.version" }
            - call: "POST /car-hire/disputes"
              payload: { settlement_cycle_id: "${cycle_id}", dispute_reason: "HIRE_RATE", disputed_amount_cents: 5000, expected_cycle_version: "${cyc_v}", movement_id: "${mv_id}" }
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { dispute_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/disputes/${dispute_id}/accept"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { d_status: "$.data.status", d_resolution: "$.data.resolution_amount_cents", d_resolved_at: "$.data.resolved_at" }
            - call: "GET /car-hire/hire-movements/${mv_id}"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { mv_adjusted: "$.data.adjusted_net_hire_cents", mv_net: "$.data.net_hire_cents" }
            - call: "GET /car-hire/settlement-cycles/${cycle_id}"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { c_status: "$.data.status", c_pre_fee: "$.data.pre_fee_net_cents", c_fee: "$.data.clearinghouse_fee_cents", c_net: "$.data.net_settlement_cents" }
            - call: "GET /car-hire/ledger-entries?dispute_id=${dispute_id}"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { l_type: "$.data[0].entry_type", l_amount: "$.data[0].amount_cents" }
            - call: "GET /car-hire/settlement-cycles/${cycle_id}/statement"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { s_adjustment: "$.data.dispute_adjustment_cents", s_net: "$.data.net_settlement_cents" }
          assert:
            - "net_before == 11407 before the dispute exists"
            - "the accept RESPONSE ITSELF already carries d_status ACCEPTED, d_resolution 5000 and d_resolved_at 2026-09-01T00:00:00Z — the caller never has to re-read to learn the outcome"
            - "mv_adjusted == 6464 (11464 - 5000) and mv_net is unchanged at 11464 — the adjustment lands on the adjusted field, preserving the as-reported figure"
            - "c_status == RECONCILED, c_pre_fee == 6464, c_fee == 32 (round_half_up(6464 * 0.005)) and c_net == 6432, all visible on the first read after the accept with no recompute call in between"
            - "l_type == DISPUTE_ADJUSTMENT and l_amount == -5000 — the ledger row exists already, not after a sweep"
            - "s_adjustment == -5000 and s_net == c_net == 6432 — the computed read and the stored cycle agree in the same instant"
            - "repeating all four reads a second time returns byte-identical data apart from meta.api_request_id, so nothing was still settling on the first read"
