          - "state_machines.Robot"
          - "entities.DepotBay.fields.state"
        distinguishing_aspect: >-
          Every configuration-layer machine has a declared initial state that the create endpoint must
          stamp without any transition running, so one create per entity yields ServiceZone PROVISIONED,
          SidewalkSegment MAPPED, SegmentClosure SCHEDULED, Merchant PENDING, Robot OFFLINE on the duty
          dimension and NOMINAL on the health dimension, and DepotBay OPEN - six machines, six first
          states, all at version 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "the database is empty apart from the logical clock"
            - "the closure is scheduled for a window that already contains the current clock instant but is never activated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
