      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_life_id}
          quantity: 1
          planned_shop_days: 1
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-20'
        as: ProductionPlanner
        captures:
          po_life_id: $.data.id
      - call: POST /api/v1/production-orders/${po_life_id}/reserve-components
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_life_id}/release
        payload: {}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/PRI-L1/changeover
        payload:
          production_order_id: ${po_life_id}
