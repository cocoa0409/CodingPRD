          assert:
            - "the fund attempt returns ERR_MONITORING_NOT_PROVISIONED with HTTP 422"
            - "Contract.${k11_id}.contract_status == CANCELLED with validation_failure_code == ERR_MONITORING_NOT_PROVISIONED"
            - "the contract never reaches ACTIVE while its monitoring account is UNPROVISIONED"

      - name: package_funding_requires_dealer_standing_not_suspended
        grounds:
