            - "right-edge adjacency is legal: ${right_adj_status} == AUTHORIZED with ${right_adj_id} non-null, because [2026-09-30, 2026-10-05) starts exactly where [2026-09-20, 2026-09-30) ends and a half-open interval does not include its end_date"
            - "left-edge adjacency is legal too: ${left_adj_status} == AUTHORIZED, because [2026-09-19, 2026-09-20) ends exactly where the existing interval starts"
            - "the straddling request is HTTP 409 with ${straddle_err} == ERR_LODGING_INTERVAL_OVERLAP — [2026-09-29, 2026-10-02) shares 2026-09-29 with the base interval and 2026-09-30 through 2026-10-01 with the right-adjacent one"
            - "the fully contained request is HTTP 409 with ${contained_err} == ERR_LODGING_INTERVAL_OVERLAP — a one-night interval strictly inside [2026-09-20, 2026-09-30) is still an overlap"
            - "GET /displacement-lodgings?lease_id=${l1_id} returns exactly 3 rows — the base interval and the two adjacent ones; neither rejected request created a row"
            - "all three surviving rows still carry nights_displaced 0, per_night_authorized_cents 0, lodging_authorized_cents 0 and rent_abatement_cents 0, since none has been closed"
            - "after POST /displacement-lodgings/${base_lodg_id}/close with actual_end_date 2026-09-30 the base row becomes CLOSED, and a fresh request for [2026-09-22, 2026-09-24) is STILL HTTP 409 ERR_LODGING_INTERVAL_OVERLAP — CLOSED intervals keep occupying the calendar"

      - name: unit_turn_buffer_minimum_whole_day_gap_between_leases
        grounds:
          - validations[priority=41]
          - entities.HousingUnit.fields.last_lease_end_date
          - entities.Installation.fields.turn_buffer_days
          - state_machines.HousingUnit.OCCUPIED_to_AVAILABLE
          - endpoints.POST_/leases
        distinguishing_aspect: |
          The contended resource is the HousingUnit itself and the semantics are
          the OPPOSITE of 8.1's: there is no interval to overlap, only a required
          empty gap of Installation.turn_buffer_days WHOLE DAYS after the unit's
          last_lease_end_date, so touching or nearly touching is precisely what
