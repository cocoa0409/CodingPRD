            - "PayrollSubmission.${sub_id}.make_whole_underpayment_cents != 3755"

      - name: apprentice_ratio_single_pass_pins_circular_reclassification
        grounds:
          - calculations.apprentice_ratio_compliance
          - entities.PayrollLine.fields.reclassified_journey_hours
          - entities.PayrollSubmission.fields.excess_apprentice_hours
          - entities.ApprenticeProgram.fields.allowed_apprentice_hours_per_100_journey
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order, a
          different axis from the rounding-order instance. Two journeyworkers at 40 h
          each give J_ELEC = 80.00; a 25-per-100 ratio permits allowed_A = 20.00; the
          single apprentice's 40.00 h therefore leaves excess = 20.00 exactly. Because
          the 20 excess hours are repriced at the journeyworker rate, a fixed-point
          reader would grow J and converge near 16.25 excess hours; the pinned SINGLE
          PASS makes excess_apprentice_hours == 20.00, and the apprentice line's
          reclassified_journey_hours == 20.00 with line_underpayment_cents == 50000.
