      - name: effectiveness_bands_pin_critical_and_the_exact_below_target_floor
        claim_type: Correct Result
        grounds:
          - calculations.recall_effectiveness_rate.formula
          - calculations.recall_effectiveness_rate.constants
        distinguishing_aspect: |
          The band ladder has two edges and the lower one is derived, not a
          constant: with participation_goal_pct 30.00 the BELOW_TARGET floor is
          round_half_up(30.00 x BELOW_TARGET_FRACTION 0.5, 2) == 15.00. Two
          successive reports sit on opposite sides of it — 14 units corrected gives
          14.00 CRITICAL, and one more unit gives exactly 15.00, which must be
          BELOW_TARGET because the comparison is non-strict. Hard-coding the floor,
          or using a strict >, flips the second reading to CRITICAL.
        test_recipe:
          setup:
            - "fixture chain F1 carried to a MONITORING recall with units_in_commerce 100, participation_goal_pct 30.00 and stop_sale_effective_at 2026-03-13T00:00:00Z"
