              as: ProgramCoordinator
              captures: { s1d2: $.data.id }
            - call: "POST /ja-programs/sessions/${s1d2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del2_id}", volunteer_id: "${vol2_id}", scheduled_date: "2026-09-16", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s2d2: $.data.id }
            - call: "POST /ja-programs/sessions/${s2d2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del2_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-23", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s3d2: $.data.id }
            - call: "POST /ja-programs/sessions/${s3d2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/sessions"
              payload: { delivery_id: "${del2_id}", volunteer_id: "${vol1_id}", scheduled_date: "2026-09-30", start_minutes: 540, end_minutes: 600 }
              as: ProgramCoordinator
              captures: { s4d2: $.data.id }
            - call: "POST /ja-programs/sessions/${s4d2}/transition"
              payload: { action: "CONFIRM" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del2_id}/transition"
              payload: { action: "CONFIRM_TEACHER" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del2_id}/transition"
              payload: { action: "RESERVE_KITS" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/deliveries/${del2_id}/transition"
              payload: { action: "SCHEDULE" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s1d1}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu1}/transition"
              payload: { action: "SUBMIT_PRE", score: 60 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu2}/transition"
              payload: { action: "SUBMIT_PRE", score: 70 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu3}/transition"
              payload: { action: "SUBMIT_PRE", score: 50 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/students/${stu4}/transition"
              payload: { action: "SUBMIT_PRE", score: 90 }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s1d2}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s2d1}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s2d2}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s3d1}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
            - call: "POST /ja-programs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ja-programs/sessions/${s4d1}/transition"
              payload: { action: "RECORD_DELIVERY" }
              as: ProgramCoordinator
