# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1-§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_payoff_projected_vs_settled_actual
        grounds:
          - calculations.projected_payoff_months
          - state_machines.Client.ACTIVE_to_GRADUATED
          - entities.Client.fields.status
        distinguishing_aspect: "Forward-looking projected_payoff_months (concession-APR interest model on Client) yields 11 months while the settled-actual variant (chronological count of DisbursementRun cycles to all-SETTLED) yields a different cycle count for identical balances; the two operate on the Client payoff domain via two different algorithms."
        test_recipe:
          setup:
            - "Agency with monthly_fee_cents=3500; one creditor default_concession_apr=0.0699."
            - "Client gross=500000 housing=150000; three ENROLLED accounts A(bal=300000,prop=30000,capr=0.0699), B(bal=150000,prop=15000), C(bal=100000,prop=10000)."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI", setup_fee_cents: 5000, monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cora", hud_certified: false }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "BankOne", default_concession_apr: 0.0699, waives_late_fees: true, min_proposed_payment_pct: 0.02 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Dan", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A-1", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "B-1", original_balance_cents: 150000, original_apr: 0.1999, min_payment_cents: 4500, proposed_monthly_payment_cents: 15000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daB: $.data.id, pB: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pB}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "C-1", original_balance_cents: 100000, original_apr: 0.1799, min_payment_cents: 3000, proposed_monthly_payment_cents: 10000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daC: $.data.id, pC: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pC}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "GET /agencies/clients/${cl}/payoff_projection"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Client.${cl}.projected_payoff_months == 11"
            - "Client.${cl}.status == ACTIVE"

      - name: dual_proration_full_vs_post_drop
        grounds:
          - calculations.disbursement_proration
          - state_machines.DebtAccount.ENROLLED_to_DROPPED
          - entities.DisbursementLine.fields.amount_cents
        distinguishing_aspect: "disbursement_proration (DebtAccount/DisbursementLine domain) splits 55000 disbursable as A=30000/B=15000/C=10000 in the full set, but after C is DROPPED the same calc re-prorates 45000 as A=30000/B=15000 — the survivor amounts change because W shrinks; this is a different entity domain than the Client payoff dual-variant."
        test_recipe:
          setup:
            - "Two ACTIVE clients each with ENROLLED A(prop=30000),B(prop=15000),C(prop=10000); client K1 keeps all three, client K2 drops C before the run."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "GP", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "K2", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "B", original_balance_cents: 150000, original_apr: 0.1999, min_payment_cents: 4500, proposed_monthly_payment_cents: 15000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daB: $.data.id, pB: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pB}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "C", original_balance_cents: 100000, original_apr: 0.1799, min_payment_cents: 3000, proposed_monthly_payment_cents: 10000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daC: $.data.id, pC: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pC}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/debt-accounts/${daC}/drop"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/clients/${cl}/deposits"
              payload: { amount_cents: 48500 }
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/agencies/${ag}/run_disbursement"
              payload: {}
              as: AgencyAdmin
              captures: { run: $.data.id }
          assert:
            - "DisbursementLine for ${daA} in run ${run} amount_cents == 30000"
            - "DisbursementLine for ${daB} in run ${run} amount_cents == 15000"
            - "No DisbursementLine exists for ${daC} (DROPPED, excluded from weights)"
            - "DebtAccount.${daA}.current_balance_cents == 270000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_proration_hamilton_with_balance_cap
        grounds:
          - calculations.disbursement_proration
          - entities.DisbursementLine.fields.amount_cents
          - entities.DebtAccount.fields.current_balance_cents
        distinguishing_aspect: "Mode (a): disbursement_proration takes >=3 inputs (disbursable, weights, per-account balance caps) with non-linear interaction — a near-payoff account A capped at 5000 forces 25000 overflow to re-flow to B by created_at ASC, producing A=5000,B=40000,C=10000 instead of the naive even 30000/15000/10000."
        test_recipe:
          setup:
            - "ACTIVE client; A near payoff with current_balance_cents=5000 (prop=30000), B(bal=200000,prop=15000), C(bal=200000,prop=10000); deposit 58500."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI2", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Eve", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 65000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "B", original_balance_cents: 200000, original_apr: 0.1999, min_payment_cents: 4500, proposed_monthly_payment_cents: 15000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daB: $.data.id, pB: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pB}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "C", original_balance_cents: 200000, original_apr: 0.1799, min_payment_cents: 3000, proposed_monthly_payment_cents: 10000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daC: $.data.id, pC: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pC}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/clients/${cl}/deposits"
              payload: { amount_cents: 58500 }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/agencies/${ag}/run_disbursement"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/clients/${cl}/deposits"
              payload: { amount_cents: 58500 }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/agencies/${ag}/run_disbursement"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agencies/clients/${cl}/deposits"
              payload: { amount_cents: 58500 }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/agencies/${ag}/run_disbursement"
              payload: {}
              as: AgencyAdmin
              captures: { run3: $.data.id }
          assert:
            - "After three cycles A.current_balance_cents reaches 5000 before cycle 3; cycle-3 DisbursementLine for ${daA} amount_cents == 5000"
            - "Cycle-3 DisbursementLine for ${daB} amount_cents == 40000 (absorbs A overflow by created_at ASC)"
            - "Cycle-3 DisbursementLine for ${daC} amount_cents == 10000"
            - "DebtAccount.${daA}.status == SETTLED after cycle 3"

      - name: combinatorial_savings_floor_order
        grounds:
          - calculations.concession_savings
          - entities.DebtAccount.fields.concession_apr
          - entities.DebtAccount.fields.original_apr
        distinguishing_aspect: "Mode (b): concession_savings pins the rounding order 'floor(original interest) then floor(concession interest) then subtract' — for bal=100000/original_apr=0.2499/concession_apr=0.0499 this gives 2082-415=1667, whereas the forbidden 'subtract then floor' order gives 1666; the scaffold fixes floor-then-subtract."
        test_recipe:
          setup:
            - "ACCEPTED DebtAccount with current_balance_cents=100000, original_apr=0.2499, concession_apr=0.0499."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI3", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0499 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Fay", gross_monthly_income_cents: 400000, housing_payment_cents: 0 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "C", original_balance_cents: 100000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 10000, requested_concession_apr: 0.0499 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daC: $.data.id, pC: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pC}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
          trigger:
            - call: "GET /agencies/debt-accounts/${daC}/savings"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "DebtAccount.${daC}.original_monthly_interest_cents == 2082"
            - "DebtAccount.${daC}.concession_monthly_interest_cents == 415"
            - "DebtAccount.${daC}.monthly_interest_savings_cents == 1667"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: cyclic_session_revision_loop
        grounds:
          - state_machines.CounselingSession.OPEN_to_NEEDS_REVISION
          - state_machines.CounselingSession.NEEDS_REVISION_to_OPEN
        distinguishing_aspect: "CounselingSession exhibits a cycle OPEN->NEEDS_REVISION->OPEN that can repeat across multiple rounds before COMPLETED — a non-linear shape on the CounselingSession entity, distinct from the CreditorProposal cycle."
        test_recipe:
          setup:
            - "An OPEN BUDGET_INTAKE session for a client."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI4", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Gail", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/sessions/${sess}/request_revision"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/sessions/${sess}/resume"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/sessions/${sess}/request_revision"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "CounselingSession.${sess}.status == NEEDS_REVISION (second loop entry succeeds)"

      - name: cyclic_proposal_negotiation_rounds
        grounds:
          - state_machines.CreditorProposal.SUBMITTED_to_COUNTERED
          - state_machines.CreditorProposal.COUNTERED_to_SUBMITTED
          - entities.CreditorProposal.fields.round_index
        distinguishing_aspect: "CreditorProposal cycles SUBMITTED->COUNTERED->SUBMITTED with round_index incrementing each resubmit — a negotiation loop on the CreditorProposal entity, a different entity than CounselingSession."
        test_recipe:
          setup:
            - "A SUBMITTED proposal on a fresh debt account."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI5", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Hank", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/counter"
              payload: { countered_concession_apr: 0.1099 }
              as: CreditorRep
              as_user_id: "${cr}"
          trigger:
            - call: "POST /agencies/proposals/${pA}/resubmit"
              payload: { requested_concession_apr: 0.0899 }
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "CreditorProposal.${pA}.status == SUBMITTED"
            - "CreditorProposal.${pA}.round_index == 2"
            - "DebtAccount.${daA}.status == PROPOSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_disbursement_settle_graduate
        grounds:
          - state_machines.DebtAccount.ENROLLED_to_SETTLED
          - state_machines.Client.ACTIVE_to_GRADUATED
          - entities.DisbursementLine.fields.balance_after_cents
        distinguishing_aspect: "Depth-3 cascade from run_disbursement: the run reduces DebtAccount.current_balance_cents (hop 1) -> that balance hitting 0 transitions the account ENROLLED->SETTLED (hop 2, caused by hop 1) -> the final account settling bubbles Client ACTIVE->GRADUATED (hop 3, caused by hop 2)."
        test_recipe:
          setup:
            - "ACTIVE client with a single ENROLLED account A(bal=30000,prop=30000); deposit covers full payoff in one cycle."
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI6", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Ivy", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 30000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
