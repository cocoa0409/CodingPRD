            - call: "GET /disclosure/documents/${script_id}"
              payload: {}
              as: InvestorRelations
              as_user_id: "${ir_id}"
              captures: { gate_after_low: $.data.qa_gate_status }
            - call: "POST /disclosure/documents/${script_id}/qa-items"
