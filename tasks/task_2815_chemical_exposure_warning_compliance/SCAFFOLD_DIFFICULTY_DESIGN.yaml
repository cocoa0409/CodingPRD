  # ===========================================================================
  # RULE 6 - boundary_precision_check
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: exposure_exactly_at_safe_harbor_is_at_or_above
        grounds:
          - calculations.safe_harbor_verdict
          - calculations.daily_exposure_ug
          - entities.ExposureAssessment.fields.result
        distinguishing_aspect: |
          Inclusive-comparison boundary on a 3-decimal quantity: an exposure of exactly 0.500 ug
          against a 0.5 ug MADL is AT_OR_ABOVE_SAFE_HARBOR with margin_ratio 1.0, while 0.499 ug -
          one thousandth below, produced by uses_per_day 0.998 on identical rows - is
          BELOW_SAFE_HARBOR with margin_ratio 0.998, so a strict > comparison flips the first case.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL exactly 0.5 ug/day."
            - "Product SKU-BP1 has one ACTIVE component of RM-100 (declared 40.0 ppm, disclosure VERIFIED, quantity 0.25 g/unit, contact_factor 0.5), so a DERMAL assessment scales linearly with uses_per_day: 0.500 ug at 1.0 and 0.499 ug at 0.998."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-BP1", product_name: "Measuring Scoop", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_at: $.data.id }
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 0.998 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_below: $.data.id }
          assert:
            - "ExposureAssessment.${asmt_at}.daily_exposure_ug == 0.5"
            - "ExposureAssessment.${asmt_at}.margin_ratio == 1.0"
            - "ExposureAssessment.${asmt_at}.result == AT_OR_ABOVE_SAFE_HARBOR"
            - "ExposureAssessment.${asmt_below}.daily_exposure_ug == 0.499"
            - "ExposureAssessment.${asmt_below}.margin_ratio == 0.998"
            - "ExposureAssessment.${asmt_below}.result == BELOW_SAFE_HARBOR"

      - name: complete_cure_at_exact_deadline_instant_then_one_second_later
        grounds:
          - calculations.cure_evaluation
          - validations[priority=62]
          - errors[ERR_CURE_WINDOW_CLOSED]
          - state_machines.NoticeOfViolation.CURE_ELECTED_to_CURED_WITHIN_WINDOW
          - entities.NoticeOfViolation.fields.cure_deadline_at
        distinguishing_aspect: |
          Inclusive boundary on an INSTANT rather than a number: cure_deadline_at is served_at plus
          exactly 60 x 86400 seconds (2026-06-01 -> 2026-07-31T00:00:00Z), a COMPLETE_CURE at that
          exact instant is inside the window, and the same call one second later on a
          twin notice fails with ERR_CURE_WINDOW_CLOSED - an exclusive comparison breaks the first,
          an off-by-one-day deadline breaks both.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and Product SKU-BP2 has annual_units 50000 (inside the cure ceiling), one ACTIVE component, a FINAL AT_OR_ABOVE assessment, an APPROVED determination with required_channels [LABEL] and one IMPLEMENTED LABEL placement - so the cure-completion precondition on warning coverage is already satisfied."
            - "Every bill-of-materials and warning write happens BEFORE any notice exists, because the first notice puts the product on ENFORCEMENT_HOLD and freezes the BOM."
            - "Two twin PRIVATE_PARTY FAILURE_TO_WARN notices are served at 2026-06-01T00:00:00Z, so both have cure_deadline_at 2026-07-31T00:00:00Z, and both elect the cure while the window is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-BP2", product_name: "Picnic Tumbler", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-06-01T00:00:00Z", placement_detail: "Back panel warning block" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { plc_1: $.data.id }
            - call: "POST /warning-placements/${plc_1}/transitions"
              payload: { action: "IMPLEMENT" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-06-01T00:00:00Z", served_at: "2026-06-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_on: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Delta Watch Alliance", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-06-01T00:00:00Z", served_at: "2026-06-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_late: $.data.id }
            - call: "POST /notices/${nov_on}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_on}/transitions"
              payload: { action: "ELECT_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_late}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_late}/transitions"
              payload: { action: "ELECT_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /notices/${nov_on}/transitions"
              payload: { action: "COMPLETE_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-31T00:00:01Z" }
              as: RegistryAdmin
            - call: "POST /notices/${nov_late}/transitions"
              payload: { action: "COMPLETE_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "NoticeOfViolation.${nov_on}.cure_deadline_at == 2026-07-31T00:00:00Z and cure_eligible == true"
            - "NoticeOfViolation.${nov_late}.cure_deadline_at == 2026-07-31T00:00:00Z and cure_eligible == true"
            - "at exactly the deadline: the COMPLETE_CURE on the first notice returns 200 and NoticeOfViolation.${nov_on}.status == CURED_WITHIN_WINDOW with cure_completed_at == 2026-07-31T00:00:00Z"
            - "one second later: the COMPLETE_CURE on the twin returns HTTP 409 with error_id ERR_CURE_WINDOW_CLOSED"
            - "after the refusal: NoticeOfViolation.${nov_late}.status == CURE_ELECTED and cure_completed_at is null"
            - "Product.${prod_1}.open_notice_count == 1 and compliance_posture == ENFORCEMENT_HOLD (the cured notice left the open set, the twin has not)"

      - name: cure_eligibility_at_exact_annual_unit_ceiling_and_one_above
        grounds:
          - calculations.cure_evaluation
          - entities.Product.fields.annual_units
          - entities.NoticeOfViolation.fields.cure_eligible
          - errors[ERR_CURE_NOT_AVAILABLE]
          - state_machines.NoticeOfViolation.UNDER_EVALUATION_to_CURE_ELECTED
        distinguishing_aspect: |
          Integer boundary with an inclusive ceiling, on a different quantity and a different
          entity than the other two instances: a product selling exactly 100000 units is still
          cure eligible while 100001 is not, and the one-unit difference is what turns ELECT_CURE
          from a legal transition into ERR_CURE_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED."
            - "Product SKU-BP3A has annual_units exactly 100000 (the CURE_UNIT_CEILING) and Product SKU-BP3B has annual_units 100001."
            - "Each product receives one PRIVATE_PARTY FAILURE_TO_WARN notice served 2026-07-15, so both cure windows are open at the 2026-08-01 clock (cure_deadline_at 2026-09-13T00:00:00Z)."
            - "No EXECUTED settlement exists anywhere, so the quiet-period term of cure_evaluation is satisfied for both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-BP3A", product_name: "Ceiling Product", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100000 }
              as: RegistryAdmin
              captures: { prod_at: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-BP3B", product_name: "Over Ceiling Product", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 100001 }
              as: RegistryAdmin
              captures: { prod_over: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_at}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-07-01T00:00:00Z", served_at: "2026-07-15T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_at: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_over}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-07-01T00:00:00Z", served_at: "2026-07-15T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_over: $.data.id }
          trigger:
            - call: "POST /notices/${nov_at}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_over}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_at}/transitions"
              payload: { action: "ELECT_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_over}/transitions"
              payload: { action: "ELECT_CURE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
          assert:
            - "NoticeOfViolation.${nov_at}.cure_deadline_at == 2026-09-13T00:00:00Z"
            - "after EVALUATE: NoticeOfViolation.${nov_at}.cure_eligible == true and status == UNDER_EVALUATION"
            - "after EVALUATE: NoticeOfViolation.${nov_over}.cure_eligible == false and status == UNDER_EVALUATION"
            - "ELECT_CURE on the ceiling notice returns 200 and NoticeOfViolation.${nov_at}.status == CURE_ELECTED with cure_attempted == true"
            - "ELECT_CURE on the one-above notice returns HTTP 409 with error_id ERR_CURE_NOT_AVAILABLE"
            - "after the refusal: NoticeOfViolation.${nov_over}.status == UNDER_EVALUATION and cure_attempted == false"

  # ===========================================================================
  # RULE 7 - cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assessment_create_requires_listed_chemical_status
        grounds:
          - validations[priority=70]
          - errors[ERR_CHEMICAL_NOT_LISTED]
          - state_machines.ListedChemical.PROPOSED_to_LISTED
          - endpoints[POST /products/{product_id}/exposure-assessments]
        distinguishing_aspect: |
          The blocking state lives on a registry row two hops away from the write target: creating
          an ExposureAssessment is refused with ERR_CHEMICAL_NOT_LISTED while its ListedChemical is
          PROPOSED, and the identical request succeeds the moment a RegistryAdmin LISTs the
          chemical - nothing about the product or the request body changes.
        test_recipe:
          setup:
            - "Bisphenol A has been proposed but not listed: its status is PROPOSED and listing_effective_date is null."
            - "Product SKU-CE1 exists and is in DEVELOPMENT, so no parent-state rule interferes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-CE1", product_name: "Utility Bin", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
          trigger:
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
          assert:
            - "first create: HTTP 409 with error_id ERR_CHEMICAL_NOT_LISTED"
            - "after the refusal: no ExposureAssessment row exists for Product.${prod_1}"
            - "after LIST: ListedChemical.${chem_bpa}.status == LISTED and warning_required_from == 2027-01-01T00:00:00Z"
            - "second create: HTTP 201 and ExposureAssessment.${asmt_1}.status == DRAFT"
            - "ExposureAssessment.${asmt_1}.daily_exposure_ug == 0.0 and contribution_count == 0 (the product has no ACTIVE components yet)"

      - name: settlement_create_requires_notice_in_negotiation
        grounds:
          - validations[priority=72]
          - errors[ERR_NOTICE_NOT_NEGOTIABLE]
          - state_machines.NoticeOfViolation.UNDER_EVALUATION_to_SETTLEMENT_NEGOTIATION
          - concurrency_rules[settlement-create-stale-notice]
        distinguishing_aspect: |
          Dependency is on the PARENT's state in the same aggregate, and it gates a child create
          rather than a child transition: a Settlement cannot be opened while its notice is merely
          UNDER_EVALUATION, and after ESCALATE the same body succeeds - but only with a refreshed
          expected_notice_version, because the escalation itself bumps the notice version.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and Product SKU-CE2 has zero ACTIVE components and annual_units 500000."
            - "A PRIVATE_PARTY notice served 2026-06-01 has been evaluated and is sitting in UNDER_EVALUATION."
            - "The clock is 2026-08-01 at settlement time, so violation_days is 61 and no empty-window rule fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /products"
              payload: { sku: "SKU-CE2", product_name: "Hose Reel", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 500000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /notices"
              payload: { product_id: "${prod_1}", chemical_id: "${chem_bpa}", noticing_party_name: "Coastal Compliance Group", noticing_party_type: "PRIVATE_PARTY", alleged_violation_type: "FAILURE_TO_WARN", alleged_units: 4000, earliest_violation_date: "2026-06-01T00:00:00Z", served_at: "2026-06-01T00:00:00Z" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { nov_1: $.data.id }
            - call: "POST /notices/${nov_1}/transitions"
              payload: { action: "EVALUATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "GET /notices/${nov_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_eval: $.data.version }
          trigger:
            - call: "POST /notices/${nov_1}/settlements"
              payload: { requested_attorney_fees_cents: 300000, reformulation_commitment: false, expected_notice_version: "${nv_eval}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /notices/${nov_1}/transitions"
              payload: { action: "ESCALATE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "GET /notices/${nov_1}"
              payload: {}
              as: RegulatoryCounsel
              captures: { nv_neg: $.data.version }
            - call: "POST /notices/${nov_1}/settlements"
              payload: { requested_attorney_fees_cents: 300000, reformulation_commitment: false, expected_notice_version: "${nv_neg}" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
              captures: { stl_1: $.data.id }
          assert:
            - "first settlement create: HTTP 409 with error_id ERR_NOTICE_NOT_NEGOTIABLE"
            - "after the refusal: no Settlement row exists for NoticeOfViolation.${nov_1}"
            - "after ESCALATE: NoticeOfViolation.${nov_1}.status == SETTLEMENT_NEGOTIATION and ${nv_neg} != ${nv_eval}"
            - "second settlement create: HTTP 201, Settlement.${stl_1}.status == PROPOSED, violation_days == 61, mitigation_factor == 1.0, adjusted_penalty_cents == 2000000, allowed_fees_cents == 300000"

      - name: bom_write_blocked_while_product_on_enforcement_hold
        grounds:
          - validations[priority=44]
          - errors[ERR_ENFORCEMENT_HOLD_FREEZE]
          - state_machines.Product.any_to_ENFORCEMENT_HOLD
          - state_machines.NoticeOfViolation.UNDER_EVALUATION_to_DISMISSED
          - entities.Product.fields.compliance_posture
        distinguishing_aspect: |
          The gate is a COMPUTED posture on the write target's own parent rather than an explicit
          status field, and it is driven by a sibling entity: an open notice pushes the product to
          ENFORCEMENT_HOLD and every bill-of-materials write is refused with
          ERR_ENFORCEMENT_HOLD_FREEZE until the notice is dismissed, at which point the identical
          component create succeeds.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and Material RM-100 is VERIFIED with a declared 40.0 ppm link."
            - "Product SKU-CE3 has zero ACTIVE components and one notice served 2026-07-15 sitting in RECEIVED, so ladder clause 1 pins compliance_posture at ENFORCEMENT_HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
