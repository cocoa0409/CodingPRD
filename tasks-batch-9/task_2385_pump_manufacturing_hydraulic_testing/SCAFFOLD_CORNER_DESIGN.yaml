      - name: repair_kit_receipt_adds_to_stock_and_bumps_the_version_used_for_concurrency
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /repair-kits/{id}/receipts"]
          - entities.RepairKit.fields.qty_received_total
          - concurrency_rules
        distinguishing_aspect: |
          A goods receipt raises qty_on_hand and qty_received_total by the same amount, leaves the
          reserved, issued and consumed buckets alone and increments version each time - which is exactly
          the version an allocation must echo, so two receipts make the version read 3 rather than 2.
        test_recipe:
          setup:
            - "RepairKit KIT-HSC14-STD is ACTIVE with every quantity at 0 and version 1."
          setup_api_calls:
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
