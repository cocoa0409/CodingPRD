    side_effects: []

  - method: GET
    path: "/child-find/service-lines/{id}"
    description: "Fetch one service line."
    roles: [ChildFindCoordinator, EvaluationChair, PlacementAdministrator, DistrictAdmin]
    code: 200
    input: []
    output: ServiceLine
    side_effects: []

  # -------------------------------------------------------------- reads: lists
  - method: GET
