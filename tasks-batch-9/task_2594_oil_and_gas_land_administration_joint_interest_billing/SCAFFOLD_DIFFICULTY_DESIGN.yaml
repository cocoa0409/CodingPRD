    instances:
      - name: transfer_state_check_beats_expired_ppr_window
        grounds:
          - validations[priority=50, error_id=ERR_TRANSFER_NOT_PENDING]
          - validations[priority=60, error_id=ERR_PPR_WINDOW_EXPIRED]
          - state_machines.AssignmentTransfer.NOTICED_to_PPR_EXERCISED
          - endpoints.POST_/land-admin/assignment-transfers/{transfer_id}/ppr-elections
        conflicting_pair:
          higher: { priority: 50, category: state, error_id: ERR_TRANSFER_NOT_PENDING, http: 409 }
          lower: { priority: 60, category: business_temporal, error_id: ERR_PPR_WINDOW_EXPIRED, http: 422 }
        distinguishing_aspect: |
          Own-entity state versus temporal window. OA has already exercised the preferential right, so
          the transfer sits in PPR_EXERCISED, and the clock has also moved past ppr_deadline_date, so a
          late election by the second eligible holder OP violates both rules at once. The state check
          at 50 must win over the deadline check at 60: the answer is ERR_TRANSFER_NOT_PENDING (409),
          not ERR_PPR_WINDOW_EXPIRED (422). OP is a genuinely eligible holder that filed no earlier
          election, so no referential or duplicate-election rule interferes with the pair.
