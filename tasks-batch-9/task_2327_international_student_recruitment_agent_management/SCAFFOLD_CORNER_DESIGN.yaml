              as_user_id: "compliance-1"
          trigger:
            - call: "GET /recruitment/agencies/${ag1_id}/risk-profile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'HTTP 200 with data.rolling_risk_score == 30.00 and data.lifetime_risk_score == 30.00 (only the CONFIRMED incident counts, so no decay difference is visible)'
            - 'data.lifetime_minus_rolling_delta == 0.00 and data.confirmed_incident_count == 1'
            - 'data.reviewed_document_count == 0, data.confirmed_fraud_document_count == 0 (fraud_rate contributes 0 when no document has been reviewed)'
            - 'data.posture_band == "GOOD_STANDING" (30.00 < 40.00)'
            - 'IntegrityIncident.${inc_open_id}.status == "REPORTED" and IntegrityIncident.${inc_dism_id}.status == "DISMISSED"'

