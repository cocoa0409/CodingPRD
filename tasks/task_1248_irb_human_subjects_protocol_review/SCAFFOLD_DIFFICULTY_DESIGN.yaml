            - call: "POST /irb/review-assignments/${asg_m}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_m}"
            - call: "POST /irb/review-assignments/${asg_n}/respond"
              payload: { response: "ACCEPT" }
              as: Reviewer
              as_user_id: "${rev_n}"
            - call: "POST /irb/review-assignments/${asg_m}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_m}"
            - call: "POST /irb/review-assignments/${asg_n}/recommendations"
              payload: { recommendation: "APPROVE" }
              as: Reviewer
              as_user_id: "${rev_n}"
            - call: "POST /irb/protocols/${proto_id}/expedited-determination"
              payload: { outcome: "APPROVE" }
              as: IrbChair
              as_user_id: "${chair_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: IrbAdmin
            - call: "POST /irb/protocols/${proto_id}/adverse-events"
              payload: { event_type: "SERIOUS_ADVERSE_EVENT", occurred_at: "2026-05-10T00:00:00Z", description: "on-time SAE" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { ae_on_time: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:01Z" }
              as: IrbAdmin
            - call: "POST /irb/protocols/${proto_id}/adverse-events"
              payload: { event_type: "SERIOUS_ADVERSE_EVENT", occurred_at: "2026-05-10T00:00:00Z", description: "one-second-late SAE" }
              as: PrincipalInvestigator
