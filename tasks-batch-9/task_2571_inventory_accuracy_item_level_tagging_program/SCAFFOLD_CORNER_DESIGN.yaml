          - calculations.physical_reconciliation
        distinguishing_aspect: "The recount gate compares net_variance_bps against the inventory's own recount_threshold_bps, defaulted to 150, and is satisfied EITHER by being inside the threshold OR by having already burned a recount round — so the first pass of a wildly varying count cannot be reconciled but the second can."
