            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, accessories: [{ sku: "CVR-1", accessory_type: "COVER", unit_price_cents: 1999 }], proof_of_purchase_token: "RCPT-R" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /grillops/warranty-claims", payload: { sale_id: "${sale_id}", component: "BURNER", failure_description: "Burner failed" }, as: ServiceAgent, captures: { cl_id: "$.data.id" } }
            - { call: "POST /grillops/warranty-claims/${cl_id}/adjudicate", payload: { action: "REVIEW" }, as: ServiceAgent }
