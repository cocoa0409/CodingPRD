# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3496_rail_rate_complaint_adjudication_transaction_review
# Breadth probe over §1.1–§1.7 claims not exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: carrier_create_returns_computed_defaults
        claim_type: creation
        grounds:
          - entities.Carrier
          - endpoints.POST_/stb/carriers
        distinguishing_aspect: "A carrier registered with only the four input fields returns 201 with computed defaults: active_route_miles == base_route_miles, abandoned/trail_use 0, revenue_adequacy_status UNDETERMINED, compliance_standing GOOD, reparation_exposure_cents 0, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          assert:
            - "http status 201 and response_type == object"
            - "Carrier.${c1}.active_route_miles == 1000 and abandoned_route_miles == 0 and trail_use_route_miles == 0"
            - "Carrier.${c1}.revenue_adequacy_status == UNDETERMINED and compliance_standing == GOOD and reparation_exposure_cents == 0"
            - "Carrier.${c1}.version == 1 and id / created_at / updated_at are non-null"

      - name: carrier_get_returns_stored_fields
        claim_type: retrieval
        grounds:
          - entities.Carrier
          - endpoints.GET_/stb/carriers/{carrierId}
        distinguishing_aspect: "Every carrier field round-trips through GET exactly as created, including computed defaults."
        test_recipe:
          setup:
            - "Carrier OKTX registered."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /stb/carriers/${c1}"
              as: BoardAdjudicator
          assert:
            - "http status 200; Carrier.${c1}.carrier_code == \"OKTX\" and legal_name == \"Oklahoma & Texas Railway\""
            - "carrier_class == \"I\" and base_route_miles == 1000 and active_route_miles == 1000"

      - name: rate_complaint_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/stb/carriers/{carrierId}/rate-complaints
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three complaints on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup:
            - "Carrier OKTX; three rate complaints filed by shp-ada."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "CORN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "COAL", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
          trigger:
            - call: "GET /stb/carriers/${c1}/rate-complaints?limit=2&offset=0"
              as: Shipper
              as_user_id: "shp-ada"
            - call: "GET /stb/carriers/${c1}/rate-complaints?limit=2&offset=2"
              as: Shipper
              as_user_id: "shp-ada"
          assert:
            - "page 1: data has 2 items, total_count == 3, has_more == true"
            - "page 2: data has 1 item, total_count == 3, has_more == false"

      - name: get_carrier_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_CARRIER_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown carrier id yields ERR_CARRIER_NOT_FOUND, not a generic 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stb/carriers/00000000-0000-4000-8000-000000000000"
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CARRIER_NOT_FOUND and http status 404"

      - name: get_rate_complaint_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_RATE_COMPLAINT_NOT_FOUND]
        distinguishing_aspect: "Unknown complaint id yields ERR_RATE_COMPLAINT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stb/rate-complaints/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RATE_COMPLAINT_NOT_FOUND and http status 404"

      - name: abandonment_decide_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ABANDONMENT_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "Decide on an unknown abandonment application id yields ERR_ABANDONMENT_APPLICATION_NOT_FOUND before any state logic."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stb/abandonment-applications/00000000-0000-4000-8000-000000000000/decide"
              payload: { outcome: "GRANTED", public_convenience_finding: "SERVED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ABANDONMENT_APPLICATION_NOT_FOUND and http status 404"

      - name: petition_terminate_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_PETITION_NOT_FOUND]
        distinguishing_aspect: "Terminate on an unknown petition id yields ERR_PETITION_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stb/reciprocal-switching-petitions/00000000-0000-4000-8000-000000000000/terminate"
              payload: {}
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PETITION_NOT_FOUND and http status 404"

      - name: merger_amend_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_MERGER_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "Amend on an unknown merger id yields ERR_MERGER_APPLICATION_NOT_FOUND (existence precedes the OCC version check); the carried version comes from a real merger on a different carrier."
        test_recipe:
          setup:
            - "Carriers CSXT and NSOR; a real merger M1 exists (its current version captured as the stale OCC value)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "CSXT", legal_name: "Crescent South Extension Transport", carrier_class: "I", base_route_miles: 2100 }
              as: PlatformAdmin
              captures: { c_csxt: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "NSOR", legal_name: "Northern & Southern Railway", carrier_class: "II", base_route_miles: 640 }
              as: PlatformAdmin
              captures: { c_nsor: $.data.id }
            - call: "POST /stb/merger-applications"
              payload: { acquiring_carrier_id: "${c_csxt}", target_carrier_id: "${c_nsor}", transaction_value_cents: 900000000, competition_preservation_score: 80, service_reliability_score: 70, shipper_impact_score: 60 }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { m1: $.data.id, m1_v: $.data.version }
          trigger:
            - call: "POST /stb/merger-applications/00000000-0000-4000-8000-000000000000/amend"
              payload: { expected_merger_application_version: "${m1_v}" }
              as: CarrierOperator
              as_user_id: "${c_csxt}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MERGER_APPLICATION_NOT_FOUND and http status 404"

      - name: verify_evidence_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_EVIDENCE_NOT_FOUND]
        distinguishing_aspect: "Verify on an unknown evidence id yields ERR_EVIDENCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stb/evidence-submissions/00000000-0000-4000-8000-000000000000/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EVIDENCE_NOT_FOUND and http status 404"

      - name: invalid_enum_carrier_class_rejected
        claim_type: type_constraints
        grounds:
          - entities.Carrier.fields.carrier_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "carrier_class outside {I, II, III} is rejected with ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "BADX", legal_name: "Bad Class Railway", carrier_class: "IV", base_route_miles: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"

      - name: missing_required_field_on_complaint_create_rejected
        claim_type: required_fields
        grounds:
          - entities.RateComplaint.fields.challenged_rate_cents_per_ton
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting challenged_rate_cents_per_ton (a required input with no default) fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Carrier OKTX exists."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status 400"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.RateComplaint
          - state_machines.MergerApplication
          - state_machines.AbandonmentApplication
          - state_machines.ReciprocalSwitchingPetition
        distinguishing_aspect: "New entities land in their declared initial states: complaint FILED with market_dominance UNDETERMINED, merger COMMENT_PERIOD with comment_close_at == created_at + 45 days, abandonment UNDER_REVIEW, petition FILED."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Carriers OKTX and NSOR exist."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers"
              payload: { carrier_code: "NSOR", legal_name: "Northern & Southern Railway", carrier_class: "II", base_route_miles: 640 }
              as: PlatformAdmin
              captures: { c_nsor: $.data.id }
          trigger:
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/merger-applications"
              payload: { acquiring_carrier_id: "${c_oktx}", target_carrier_id: "${c_nsor}", transaction_value_cents: 100000000, competition_preservation_score: 80, service_reliability_score: 70, shipper_impact_score: 60 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
              captures: { m1: $.data.id }
            - call: "POST /stb/abandonment-applications"
              payload: { carrier_id: "${c_oktx}", line_segment_ref: "MP 100.0-MP 120.0", segment_miles: 20 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
              captures: { ab1: $.data.id }
            - call: "POST /stb/service-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", issue_type: "DELAY", territory_code: "PLAINS" }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { sc1: $.data.id }
            - call: "POST /stb/reciprocal-switching-petitions"
              payload: { shipper_id: "shp-ada", incumbent_carrier_id: "${c_oktx}", interchange_code: "IX-KC", facility_distance_miles: 10, evidence_service_complaint_id: "${sc1}", service_start_date: "2026-10-01", service_end_date: "2026-12-01" }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { p1: $.data.id }
          assert:
            - "RateComplaint.${rc1}.status == FILED and market_dominance == UNDETERMINED and award_status == NONE and track == THREE_BENCHMARK"
            - "MergerApplication.${m1}.status == COMMENT_PERIOD and comment_close_at == 2026-10-16T00:00:00Z and service_review_hold == false"
            - "AbandonmentApplication.${ab1}.status == UNDER_REVIEW and nitu_expires_at is null"
            - "ServiceComplaint.${sc1}.status == OPEN and ReciprocalSwitchingPetition.${p1}.status == FILED"

      - name: determine_md_on_dismissed_complaint_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RateComplaint.FILED_to_DISMISSED
          - errors[ERR_COMPLAINT_NOT_FILED]
        distinguishing_aspect: "A complaint dismissed for absent market dominance is terminal for determination purposes — a second determine-market-dominance call fails with ERR_COMPLAINT_NOT_FILED."
        test_recipe:
          setup:
            - "Carrier OKTX; complaint with ratio 1.7999 already DISMISSED via a first determination."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 17999, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMPLAINT_NOT_FILED and http status 409"
            - "RateComplaint.${rc1}.status == DISMISSED and market_dominance == ABSENT (unchanged)"

      - name: decide_from_filed_state_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RateComplaint.EVIDENTIARY_PHASE_to_DECIDED
          - errors[ERR_COMPLAINT_NOT_IN_EVIDENTIARY]
        distinguishing_aspect: "Decide on a FILED complaint (market dominance never determined) fails with ERR_COMPLAINT_NOT_IN_EVIDENTIARY before any evidence/finding checks."
        test_recipe:
          setup:
            - "Carrier OKTX; complaint FILED."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 20000, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-1", tons: 1.000 }] }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMPLAINT_NOT_IN_EVIDENTIARY and http status 409"
            - "RateComplaint.${rc1}.status == FILED (unchanged)"

      - name: verify_evidence_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.EvidenceSubmission.SUBMITTED_to_VERIFIED
          - errors[ERR_EVIDENCE_ALREADY_REVIEWED]
        distinguishing_aspect: "Verifying an already-VERIFIED submission fails with ERR_EVIDENCE_ALREADY_REVIEWED; the adjudicated ratio is not recomputed a second time."
        test_recipe:
          setup:
            - "Carrier OKTX; complaint in EVIDENTIARY_PHASE with one VERIFIED evidence (cost 10500 -> adjudicated 1.8571)."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 100, relief_sought_cents: 50000000, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EVIDENCE_ALREADY_REVIEWED and http status 409"
            - "RateComplaint.${rc1}.adjudicated_rvc_ratio == 1.8571 (unchanged)"

      - name: consummate_after_trail_converted_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AbandonmentApplication.TRAIL_PENDING_to_TRAIL_CONVERTED
          - errors[ERR_ABANDONMENT_NOT_GRANTED]
        distinguishing_aspect: "A TRAIL_CONVERTED application is terminal: consummate-abandonment fails with ERR_ABANDONMENT_NOT_GRANTED and carrier mileage is not double-moved."
        test_recipe:
          setup:
            - "Carrier OKTX (base 1000); abandonment AB (20 miles) GRANTED -> TRAIL_PENDING -> TRAIL_CONVERTED."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/abandonment-applications"
              payload: { carrier_id: "${c1}", line_segment_ref: "MP 100.0-MP 120.0", segment_miles: 20 }
              as: CarrierOperator
              as_user_id: "${c1}"
              captures: { ab1: $.data.id }
            - call: "POST /stb/abandonment-applications/${ab1}/decide"
              payload: { outcome: "GRANTED", public_convenience_finding: "SERVED" }
              as: BoardAdjudicator
            - call: "POST /stb/abandonment-applications/${ab1}/issue-trail-use-notice"
              payload: {}
              as: BoardAdjudicator
            - call: "POST /stb/abandonment-applications/${ab1}/convert-to-trail-use"
              payload: {}
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/abandonment-applications/${ab1}/consummate-abandonment"
              payload: {}
              as: BoardAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ABANDONMENT_NOT_GRANTED and http status 409"
            - "Carrier.${c1}.active_route_miles == 980 and trail_use_route_miles == 20 and abandoned_route_miles == 0 (no double move)"

      - name: reopen_on_closed_complaint_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RateComplaint.DECIDED_to_CLOSED
          - errors[ERR_COMPLAINT_NOT_DECIDED]
        distinguishing_aspect: "A complaint CLOSED by full payment is terminal for reopen: the shipper's reopen fails with ERR_COMPLAINT_NOT_DECIDED."
        test_recipe:
          setup:
            - "Carrier OKTX with 2025 finding (INADEQUATE, floor 1.10). Complaint decided UPHELD (prescribed 11550, award 79500) and fully paid -> CLOSED."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /stb/carriers/${c1}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c1}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
