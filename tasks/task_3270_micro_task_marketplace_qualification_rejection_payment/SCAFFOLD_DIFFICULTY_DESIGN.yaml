            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "XA Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 XA", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id, a1_v: $.data.version }
            - call: "POST /mkt/workers/${w1}/suspend"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /mkt/assignments/${a1}/submit"
              payload: { expected_assignment_version: "${a1_v}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_WORKER_SUSPENDED"
            - "Assignment.${a1}.status == ACCEPTED (the Assignment itself is untouched)"
            - "Worker.${w1}.status == SUSPENDED"

      - name: publish_requires_acting_requester_active
        grounds:
          - state_machines.HIT.transitions.DRAFT_to_PUBLISHED
          - errors.ERR_REQUESTER_NOT_ACTIVE
          - validations[priority=5]
        distinguishing_aspect: "A DRAFT HIT cannot reach PUBLISHED while its owning Requester row is SUSPENDED — the HIT transition reads the Requester entity's status, a different entity pair than the Assignment-Worker gate."
