    - "validations[priority=11]"
    - "endpoints[GET /idv/verification-sessions/{id}]"
    distinguishing_aspect: "Two integrators hold the same role, so isolation cannot come from RBAC alone: integrator B reading client A's session id is refused at priority 11 with ERR_CLIENT_SCOPE_VIOLATION\
      \ even though the session exists."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
