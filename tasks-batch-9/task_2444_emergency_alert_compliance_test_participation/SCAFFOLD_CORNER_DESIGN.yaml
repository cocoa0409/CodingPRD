      - name: uniqueness_conflict_errors_for_call_sign_and_relay_priority_are_triggerable
        claim_type: error_triggerable
        grounds:
          - "§1.6 ERR_DUPLICATE_CALL_SIGN (409) 'POST /stations with a call_sign that already exists'"
          - "§1.6 ERR_DUPLICATE_RELAY_PRIORITY (409) 'POST /relay-rules where the plan already has an ACTIVE rule with the same event_code and priority'"
          - "§1.4 priority 11 uniqueness/lifecycle conflicts"
        distinguishing_aspect: "Call-sign uniqueness is global (a second plan does not free the name) while relay-priority uniqueness is scoped to the (plan, event_code, priority) triple and only counts ACTIVE rules — retiring the incumbent makes the same priority reusable."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; two ACTIVE plans: KS 2026-R1 (plan_a) and NE 2026-R1 (plan_b). Station KWEA created under plan_a."
