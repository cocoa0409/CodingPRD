              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_c2_id}", mrn: "C2-1000", last_name: "Vasquez", first_name: "Ramona", dob: "1985-03-07", sex: "F", ssn_last4: "4455", postal_code: "85001", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_c2a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_c2_id}", mrn: "C2-2000", last_name: "Vasquez", first_name: "Ramona", dob: "1985-07-03", sex: "F", ssn_last4: "4455", postal_code: "85001", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_c2b_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_c2a_id}", record_b_id: "${rec_c2b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 201"
            - "$.data.attribute_score_breakdown == {\"last_name\": 25.00, \"first_name\": 15.00, \"dob\": 12.50, \"ssn_last4\": 15.00, \"sex\": 5.00, \"postal_code\": 10.00, \"phone\": 0.00}"
            - "$.data.raw_score == 82.50 and $.data.match_score == 82.50"
            - "$.data.classification == POTENTIAL_DUPLICATE (82.50 is below auto_link_threshold 85.00 and at or above review_threshold 70.00)"
            - "$.data.queue_state == NEW and $.data.base_band == P2 and $.data.priority_band == P2"

      - name: conflict_penalty_is_charged_once_per_conflict_flag
        claim_type: constants_applied
        grounds:
          - calculations.pair_match_score
          - entities.MatchRuleSet.fields.conflict_penalty_points
        distinguishing_aspect: "conflict_penalty_points is multiplied by the number of conflict flags, not applied once: two flags cost 24.00, taking a raw_score of 60.00 down to 36.00, and the flags are emitted in the pinned order [SSN4_CONFLICT, INSURANCE_CONFLICT]."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-C3 and one MatchRuleSet RS-BASE with conflict_penalty_points 12.00."
            - "Two PatientRecord rows agreeing on last_name, first_name, sex, postal_code and phone but with different dob, different ssn_last4 (1234 vs 5678) and different insurance_member_id (INS-A vs INS-B); biometric_template_hash is null on both sides."
            - "raw_score is 25.00 + 15.00 + 0.00 + 0.00 + 5.00 + 10.00 + 5.00 = 60.00, which is below FRAUD_AUTO_OPEN_RAW_SCORE_MIN 70.00, so the auto-open fraud branch must NOT fire even though INSURANCE_CONFLICT is present."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
