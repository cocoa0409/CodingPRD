        distinguishing_aspect: |
          Entity pair (DoseAdministration -> StorageUnit): a DoseAdministration
          can be created only when the Lot's StorageUnit is NOT quarantined
          (no active TemperatureExcursion). This is a cross-entity state
          dependency: the dose's valid creation depends on the unit's state.
        test_recipe:
          setup:
            - "Site S; unit U; product P; lot L (PRIVATE 5 doses) in U; patient pat (COMMERCIAL); screening scr PRIVATE_ONLY on 2026-08-05"
