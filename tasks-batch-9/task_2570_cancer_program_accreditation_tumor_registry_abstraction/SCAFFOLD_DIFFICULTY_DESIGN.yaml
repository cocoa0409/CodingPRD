# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: cancer-program-accreditation-tumor-registry (api_prefix /cancer-registry)
# Logical clock starts at 2026-08-01T00:00:00Z on every fresh database.
# Every numeric assert below was computed by executing the §1.3 formula with its
# declared constants against the pinned fixture in the same instance.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: follow_up_rate_coc_five_year_vs_state_central_all_years_divergence
        grounds:
          - calculations.follow_up_rate
          - entities.CancerProgram.fields.follow_up_rate_coc_pct
          - entities.CancerProgram.fields.follow_up_rate_state_pct
          - entities.CancerProgram.fields.lost_to_follow_up_pct
          - entities.TumorCase.fields.last_contact_date
          - endpoints[GET /cancer-registry/programs/{programId}/compliance-summary]
        distinguishing_aspect: |
          Both variants read the SAME two COMPLETED analytic cases, yet coc_five_year reports
          100.0 while state_central_all_years reports 50.0, because the 2021 case falls outside
          the 1826-day CoC diagnosis cohort (age 1998 days) but stays in the state denominator
          where its 426-day-old contact exceeds STATE_CONTACT_DAYS (365) without exceeding
          LOST_CONTACT_DAYS (456).
        test_recipe:
          setup:
            - "One program (timeliness_standard_days 180, reference_year 2018) with two abstractors: an author and a QA reviewer."
            - "Case R was diagnosed 2026-03-02 (CLASS_10, analytic) and is COMPLETED with a 2026-07-20 contact, vital_status ALIVE."
            - "Case O was diagnosed 2021-02-10 (CLASS_10, analytic) and is COMPLETED with a 2025-06-01 contact, vital_status ALIVE."
            - "The logical clock is still at its 2026-08-01T00:00:00Z default, so case O is 1998 days past diagnosis and its contact is 426 days old."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Lakeside Regional Cancer Program", coc_program_id: "COC-14550", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-3001", accession_date: "2026-08-05", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-03-02", first_contact_date: "2026-03-09", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { entry_r_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_r_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_r_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_r_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_r_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_r_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_r_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-03-20", treatment_modalities: ["SURGERY", "RADIATION"], radiation_start_date: "2026-04-15", diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-01" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_r_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_r_id}/submit-qa"
              payload: { submit_note: "recent case ready for QA" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_r_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-3002", accession_date: "2026-08-06", primary_site_code: "C34.9", histology_code: "8140/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2021-02-10", first_contact_date: "2021-02-20", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { entry_o_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_o_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_o_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_o_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_o_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_o_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_o_v}", stage_source: "PATHOLOGIC", t_category: "T1", n_category: "N0", m_category: "M0", stage_group: "STAGE_I", first_treatment_date: "2021-03-01", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2021-06-15" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_o_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_o_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_o_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/cases/${case_r_id}/follow-up-contacts"
              payload: { contact_date: "2026-07-20", contact_method: "CLINIC_VISIT", outcome: "CONTACT_MADE", vital_status_at_contact: "ALIVE" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/cases/${case_o_id}/follow-up-contacts"
              payload: { contact_date: "2025-06-01", contact_method: "LETTER", outcome: "CONTACT_MADE", vital_status_at_contact: "ALIVE" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
          trigger:
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: {}
              as: RegistryManager
          assert:
            - "CancerProgram.${prog_id}.follow_up_rate_coc_pct == 100.0"
            - "CancerProgram.${prog_id}.follow_up_rate_state_pct == 50.0"
            - "CancerProgram.${prog_id}.lost_to_follow_up_pct == 0.0"
            - "CancerProgram.${prog_id}.follow_up_rate_coc_pct != CancerProgram.${prog_id}.follow_up_rate_state_pct on one identical case set"
            - "TumorCase.${case_o_id}.last_contact_date == 2025-06-01 and TumorCase.${case_o_id}.follow_up_status == DELINQUENT"
            - "TumorCase.${case_o_id}.follow_up_due_date == 2026-06-01"
            - "TumorCase.${case_r_id}.follow_up_status == CURRENT"
            - "CancerProgram.${prog_id}.open_backlog_count == 0 and CancerProgram.${prog_id}.registry_posture == OPEN"

      - name: abstractor_quality_rolling_weighted_vs_cumulative_unweighted_divergence
        grounds:
          - calculations.abstractor_quality_score
          - calculations.audit_weighted_error_score
          - entities.Abstractor.fields.quality_score_rolling_90d
          - entities.Abstractor.fields.quality_score_cumulative
          - entities.Abstractor.fields.lifetime_discrepancy_points
          - endpoints[POST /cancer-registry/qa-audits/{auditId}/score]
        distinguishing_aspect: |
          The two variants disagree on WHICH audits and WHICH weighting: rolling_90d_weighted sees
          only the audit scored on 2026-11-09 and weights its 3 minor findings as 3 points (94.0),
          while cumulative_unweighted sees both audits, counts 4 raw discrepancies over 100 audited
          fields and reports 96.0 — the older critical audit lowers the all-time score yet is
          invisible to the 90-day score, the reverse of the CoC/state follow-up split.
        test_recipe:
          setup:
            - "One program with an authoring abstractor (Dana) and a QA reviewer/auditor (Priya)."
            - "Two of Dana's abstractions were APPROVED at the 2026-08-01 clock default."
            - "Audit #1 (50 fields, 1 critical) was scored on 2026-08-01, closing CLOSED_FAIL with weighted_error_score 5 and cascading its case back to REWORK_PENDING."
            - "The clock then moved to 2026-11-09, putting audit #1 outside the 90-day window (cutoff 2026-08-11)."
            - "Audit #2 is OPEN on Dana's second abstraction with a 2026-11-01..2026-11-09 window."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Harbor Point Cancer Center", coc_program_id: "COC-14551", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-3101", accession_date: "2026-08-05", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-03-02", first_contact_date: "2026-03-09", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { entry_1_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_1_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_1_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_1_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_1_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_1_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_1_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-03-20", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-01" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_1_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_1_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_1_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-3102", accession_date: "2026-08-06", primary_site_code: "C18.9", histology_code: "8140/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-03-15", first_contact_date: "2026-03-20", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { entry_2_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_2_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_2_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_2_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_2_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_2_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_2_v}", stage_source: "PATHOLOGIC", t_category: "T1", n_category: "N0", m_category: "M0", stage_group: "STAGE_I", first_treatment_date: "2026-04-01", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-05" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_2_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_2_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
            - call: "POST /cancer-registry/abstractions/${abst_2_id}/qa-decision"
              payload: { verdict: "APPROVED" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_1_id}", auditor_id: "${abs_q_id}", audit_type: "ROUTINE_10PCT", window_start: "2026-07-01", window_end: "2026-07-31" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_1_id: $.data.id }
            - call: "POST /cancer-registry/qa-audits/${audit_1_id}/score"
              payload: { audited_field_count: 50, minor_discrepancy_count: 0, major_discrepancy_count: 0, critical_discrepancy_count: 1 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cancer-registry/qa-audits"
              payload: { abstraction_id: "${abst_2_id}", auditor_id: "${abs_q_id}", audit_type: "TARGETED", window_start: "2026-11-01", window_end: "2026-11-09" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
              captures: { audit_2_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/qa-audits/${audit_2_id}/score"
              payload: { audited_field_count: 50, minor_discrepancy_count: 3, major_discrepancy_count: 0, critical_discrepancy_count: 0 }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
          assert:
            - "QaAudit.${audit_2_id}.weighted_error_score == 3"
            - "QaAudit.${audit_2_id}.verdict == MINOR_FAIL and QaAudit.${audit_2_id}.audit_state == CLOSED_FAIL"
            - "Abstractor.${abs_a_id}.quality_score_rolling_90d == 94.0"
            - "Abstractor.${abs_a_id}.quality_score_cumulative == 96.0"
            - "Abstractor.${abs_a_id}.quality_score_rolling_90d != Abstractor.${abs_a_id}.quality_score_cumulative"
            - "Abstractor.${abs_a_id}.lifetime_discrepancy_points == 8"
            - "Abstractor.${abs_a_id}.audit_fail_streak == 2 and Abstractor.${abs_a_id}.employment_status == ACTIVE"
            - "QaAudit.${audit_1_id}.audit_state == CLOSED_FAIL and QaAudit.${audit_1_id}.weighted_error_score == 5"
            - "TumorCase.${case_1_id}.case_state == REWORK_PENDING"

  - rule_id: combinatorial_formula
    instances:
      - name: abstraction_required_field_set_recombines_on_three_independent_inputs
        grounds:
          - calculations.abstraction_completeness
          - calculations.class_of_case_determination
          - entities.Abstraction.fields.missing_required_fields
          - entities.Abstraction.fields.completeness_score
          - validations[priority=53]
          - endpoints[POST /cancer-registry/abstractions]
        distinguishing_aspect: |
          The required-field SET itself is recombined by three independent inputs at once
          (stage_source PATHOLOGIC adds t/n/m, class_of_case_code CLASS_00 adds
          diagnostic_confirmation_code, treatment_modalities ["NO_TREATMENT"] REMOVES
          first_treatment_date), so an abstraction that omits first_treatment_date and
          radiation_start_date still scores exactly 100 and submits; a fixed 11-field
          requirement scores 88 (or 76 if radiation_start_date is also always required).
        test_recipe:
          setup:
            - "One program (timeliness_standard_days 180) with a CTR abstractor."
            - "Case X came from an entry with diagnosed_at_facility true and first_treatment_at_facility false, so class_of_case_code is CLASS_00 and analytic_flag is true."
            - "Case X is ASSIGNED to the abstractor and the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Cedar Valley Cancer Program", coc_program_id: "COC-14552", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Whitfield", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "DISEASE_INDEX", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-3201", accession_date: "2026-08-04", primary_site_code: "C61.9", histology_code: "8140/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-03-02", first_contact_date: "2026-03-09", diagnosed_at_facility: true, first_treatment_at_facility: false }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { entry_x_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_x_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_x_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_x_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_x_v: $.data.version }
          trigger:
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_x_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_x_v}", stage_source: "PATHOLOGIC", t_category: "T1", n_category: "N0", m_category: "M0", stage_group: "STAGE_I", treatment_modalities: ["NO_TREATMENT"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-01" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_x_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_x_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
          assert:
            - "Abstraction.${abst_x_id}.missing_required_fields == []"
            - "Abstraction.${abst_x_id}.completeness_score == 100"
            - "Abstraction.${abst_x_id}.abstraction_state == SUBMITTED_FOR_QA"
            - "TumorCase.${case_x_id}.case_state == QA_PENDING"
            - "TumorCase.${case_x_id}.class_of_case_code == CLASS_00 and TumorCase.${case_x_id}.analytic_flag == true"
            - "first_treatment_date and radiation_start_date are absent from missing_required_fields even though both were omitted from the payload"

      - name: quality_measure_stratified_mean_of_rounded_rates_vs_pooled_ratio
        grounds:
          - calculations.quality_measure_performance
          - entities.QualityMeasure.fields.performance_rate_pct
          - entities.QualityMeasure.fields.pooled_rate_pct
          - entities.QualityMeasure.fields.included_strata_count
          - state_machines.QualityMeasure.DRAFT_to_MEASURED
          - endpoints[POST /cancer-registry/quality-measures/{measureId}/evaluate]
        distinguishing_aspect: |
          The ORDER of rounding and aggregation is recombined over the same four strata: rounding
          each stratum first and taking the unweighted mean yields 79.4 (MEETS the 75.0 threshold),
          while pooling numerators and denominators first yields 73.7 (UNDER_THRESHOLD) — the same
          inputs flip the accreditation verdict, and the zero-eligible stratum must be dropped
          before either arithmetic runs.
        test_recipe:
          setup:
            - "One program with one DRAFT quality measure whose threshold_pct is 75.0."
            - "The clock is at its 2026-08-01T00:00:00Z default; no cases are needed because strata are supplied in the request."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northshore Cancer Institute", coc_program_id: "COC-14553", annual_analytic_caseload: 620, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/quality-measures"
              payload: { program_id: "${prog_id}", measure_code: "BCSRT", measurement_year: 2025, threshold_pct: 75.0 }
              as: RegistryManager
              captures: { qm_id: $.data.id }
          trigger:
            - call: "POST /cancer-registry/quality-measures/${qm_id}/evaluate"
              payload: { strata: [{ stage_group: "STAGE_I", eligible_case_count: 7, compliant_case_count: 5 }, { stage_group: "STAGE_II", eligible_case_count: 3, compliant_case_count: 3 }, { stage_group: "STAGE_III", eligible_case_count: 9, compliant_case_count: 6 }, { stage_group: "STAGE_IV", eligible_case_count: 0, compliant_case_count: 0 }] }
              as: RegistryManager
          assert:
            - "QualityMeasure.${qm_id}.included_strata_count == 3"
            - "QualityMeasure.${qm_id}.performance_rate_pct == 79.4"
            - "QualityMeasure.${qm_id}.pooled_rate_pct == 73.7"
            - "QualityMeasure.${qm_id}.performance_state == MEETS"
            - "QualityMeasure.${qm_id}.measure_state == MEASURED"
