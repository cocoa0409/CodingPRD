      - "increments EnrollmentSyncBatch.version by 1"

  # ---- MergeRequest -------------------------------------------------------
  - method: POST
    path: "/merge-requests"
    description: "Open a cross-listing request that would absorb a child shell's enrollments into a parent shell. Optimistic-concurrency guarded on the parent shell."
    roles: [LmsAdmin]
    code: 201
    input: [parent_shell_id, child_shell_id, expected_parent_shell_version, "justification?"]
    output: MergeRequest
    side_effects:
      - "rejects with ERR_STALE_VERSION when expected_parent_shell_version does not match the parent CourseShell's current version (§1.2.1 merge-request-create-stale-parent-shell)"
      - "increments CourseShell.version by 1 on the parent shell, so a superseding request must re-read it"
      - "merge_state initialised to DRAFT and submitted_by_user_id set to the acting X-User-ID"

  - method: GET
    path: "/merge-requests"
    description: "List merge requests, filterable by either side of the cross-list pair (reverse reachability for parent_shell_id and child_shell_id)."
    roles: [LmsAdmin, Registrar]
    code: 200
    input: ["limit?", "offset?", "parent_shell_id?", "child_shell_id?", "merge_state?"]
    output: MergeRequest[]
    side_effects: []

  - method: GET
    path: "/merge-requests/{id}"
    description: "Read one merge request including its seat-ledger snapshots."
    roles: [LmsAdmin, Registrar]
    code: 200
    input: []
    output: MergeRequest
    side_effects: []

  - method: POST
    path: "/merge-requests/{id}/transitions"
    description: "Drive a merge request: SUBMIT, APPROVE, DECLINE, APPLY, REVERSE."
    roles: [LmsAdmin]
    code: 200
    input: [action, "reason?"]
    output: MergeRequest
    side_effects:
      - "APPROVE and DECLINE enforce segregation of duties against submitted_by_user_id and record decided_by_user_id"
      - "APPLY relocates the child's ACTIVE enrollments onto the parent in created_at ASC order, stamping merged_from_shell_id, and moves the child shell to MERGED"
      - "REVERSE returns exactly the rows carrying merged_from_shell_id == child_shell_id and restores the child shell to PROVISIONED"
      - "enrollment_seat_ledger requires seat_ledger_after == seat_ledger_before across both directions"
      - "increments MergeRequest.version by 1"

  # ---- RolloverJob --------------------------------------------------------
  - method: POST
    path: "/rollover-jobs"
    description: "Open a term-rollover job that copies content from a concluded shell into a new-term shell. Optimistic-concurrency guarded on the target shell."
    roles: [LmsAdmin]
    code: 201
    input: [source_shell_id, target_shell_id, target_term_id, expected_target_shell_version, "strip_dates?", "strip_submissions?", "strip_grades?", "date_shift_mode?"]
    output: RolloverJob
    side_effects:
      - "rejects with ERR_STALE_VERSION when expected_target_shell_version does not match the target CourseShell's current version (§1.2.1 rollover-job-create-stale-target-shell)"
      - "increments CourseShell.version by 1 on the target shell, so a superseding job must re-read it"
      - "job_state initialised to DRAFT; strip_dates, strip_submissions and strip_grades default to true; date_shift_mode defaults to ANCHOR_PROPORTIONAL"

  - method: GET
    path: "/rollover-jobs"
    description: "List rollover jobs, filterable by source shell, target shell or target term (reverse reachability)."
    roles: [LmsAdmin, Instructor]
    code: 200
    input: ["limit?", "offset?", "source_shell_id?", "target_shell_id?", "target_term_id?", "job_state?"]
    output: RolloverJob[]
    side_effects: []

  - method: GET
    path: "/rollover-jobs/{id}"
    description: "Read one rollover job including copy, strip and shift tallies."
    roles: [LmsAdmin, Instructor]
    code: 200
    input: []
    output: RolloverJob
    side_effects: []

  - method: POST
    path: "/rollover-jobs/{id}/transitions"
    description: "Drive a rollover job: VALIDATE, EXECUTE, COMPENSATE."
    roles: [LmsAdmin]
    code: 200
    input: [action, "reason?"]
    output: RolloverJob
    side_effects:
      - "VALIDATE counts eligible source items and enforces source/target eligibility"
      - "EXECUTE copies items in created_at ASC order, applying rollover_due_date_projection under date_shift_mode when strip_dates is false, then settles automatically into COMPLETED or into FAILED when a SANDBOX/DEV target passes SANDBOX_STORAGE_QUOTA_MB"
      - "COMPLETED recomputes the target term's term_rollover_completion_pct"
      - "COMPENSATE marks the copies SKIPPED and restores target_shell.storage_mb to its pre-EXECUTE value"
      - "increments RolloverJob.version by 1"

  # ---- ToolIntegration / ToolReview / ToolPlacement -----------------------
  - method: POST
    path: "/tool-integrations"
    description: "Register a third-party learning tool for privacy and accessibility review."
    roles: [LmsAdmin]
    code: 201
    input: [vendor_name, tool_name, tool_version, data_sharing_scope, "pii_tier?", "vpat_score?", "wcag_level?"]
    output: ToolIntegration
    side_effects:
      - "approval_state DRAFT, both review dimensions PENDING, risk_score computed by tool_approval_risk_score with zero placement exposure"

  - method: GET
    path: "/tool-integrations"
    description: "List registered tools."
    roles: [LmsAdmin, PrivacyReviewer, AccessibilityReviewer, Instructor]
    code: 200
    input: ["limit?", "offset?", "approval_state?", "data_sharing_scope?", "pii_tier?"]
    output: ToolIntegration[]
    side_effects: []

  - method: GET
    path: "/tool-integrations/{id}"
    description: "Read one tool including its two review dimensions and current risk_score."
    roles: [LmsAdmin, PrivacyReviewer, AccessibilityReviewer, Instructor]
    code: 200
    input: []
    output: ToolIntegration
    side_effects: []

  - method: PATCH
    path: "/tool-integrations/{id}"
    description: "Record a vendor upgrade or revised privacy/accessibility metadata. A tool_version change strands approved_version and produces version drift."
    roles: [LmsAdmin]
    code: 200
    input: ["tool_version?", "data_sharing_scope?", "pii_tier?", "vpat_score?", "wcag_level?"]
    output: ToolIntegration
    side_effects:
      - "risk_score recomputed by tool_approval_risk_score; approved_version is NOT advanced"
      - "increments ToolIntegration.version by 1"

  - method: POST
    path: "/tool-integrations/{id}/transitions"
    description: "Drive a tool's approval dimension: OPEN_REVIEW, FINALIZE_REVIEW, SUSPEND, REOPEN_REVIEW."
    roles: [LmsAdmin]
    code: 200
    input: [action, "reason?"]
    output: ToolIntegration
    side_effects:
      - "FINALIZE_REVIEW forks three ways on the two dimensions plus the freshly computed risk_score against RISK_CONDITIONAL_THRESHOLD and RISK_REJECT_THRESHOLD"
      - "REJECTED and SUSPENDED cascade this tool's placements to BLOCKED, which drops the affected shells' publish_readiness and unpublishes them"
      - "REOPEN_REVIEW resets both dimensions to PENDING and clears approved_version"
      - "increments ToolIntegration.version by 1"

  - method: POST
    path: "/tool-reviews"
    description: "File the privacy or accessibility verdict for a tool under review. One record per dimension, and no reviewer may decide both dimensions of one tool."
    roles: [PrivacyReviewer, AccessibilityReviewer]
    code: 201
    input: [tool_id, dimension, decision, "conditions_note?"]
    output: ToolReview
    side_effects:
      - "sets the tool's privacy_review_state or accessibility_review_state to CLEARED, CONDITIONAL or BLOCKED"
      - "reviewer_user_id set to the acting X-User-ID and checked against the other dimension's reviewer"
      - "increments ToolIntegration.version by 1"

  - method: GET
    path: "/tool-reviews"
    description: "List review records, filterable by tool_id (reverse reachability)."
    roles: [LmsAdmin, PrivacyReviewer, AccessibilityReviewer]
    code: 200
    input: ["limit?", "offset?", "tool_id?", "dimension?", "decision?"]
    output: ToolReview[]
    side_effects: []

  - method: GET
    path: "/tool-reviews/{id}"
    description: "Read one review record. ToolReview is immutable: no PATCH, no version field."
    roles: [LmsAdmin, PrivacyReviewer, AccessibilityReviewer]
    code: 200
    input: []
    output: ToolReview
    side_effects: []

  - method: POST
    path: "/tool-placements"
    description: "Request a tool placement in a shell the acting Instructor owns."
    roles: [Instructor, LmsAdmin]
    code: 201
    input: [tool_id, shell_id]
    output: ToolPlacement
    side_effects:
      - "placement_state initialised to REQUESTED, which immediately drops shell.publish_readiness to false"

  - method: GET
    path: "/tool-placements"
    description: "List placements, filterable by tool_id or shell_id (reverse reachability for the many-to-many junction)."
    roles: [Instructor, LmsAdmin]
    code: 200
    input: ["limit?", "offset?", "tool_id?", "shell_id?", "placement_state?"]
    output: ToolPlacement[]
    side_effects: []

  - method: GET
    path: "/tool-placements/{id}"
    description: "Read one placement including its pinned_tool_version."
    roles: [Instructor, LmsAdmin]
    code: 200
    input: []
    output: ToolPlacement
    side_effects: []

  - method: POST
    path: "/tool-placements/{id}/transitions"
    description: "Drive a placement: ACTIVATE or REMOVE."
    roles: [Instructor, LmsAdmin]
    code: 200
    input: [action, "reason?"]
    output: ToolPlacement
    side_effects:
      - "ACTIVATE requires an APPROVED or CONDITIONAL tool with approved_version == tool_version and no FERPA-blocked student in the shell; it pins pinned_tool_version and re-scores tool_approval_risk_score"
      - "REMOVE releases the placement and recomputes shell.publish_readiness"
      - "increments ToolPlacement.version by 1"

  # ---- GradePassback / GradeDispute ---------------------------------------
  - method: POST
    path: "/grade-passbacks"
    description: "Stage the shell's gradebook for registrar passback. One passback per shell."
    roles: [Instructor]
    code: 201
    input: [shell_id]
    output: GradePassback
    side_effects:
      - "term_id copied from the shell; staged_enrollment_count counted over STUDENT rows in ACTIVE or COMPLETED"
      - "final_grade_percentage variant PROVISIONAL written to every staged Enrollment.provisional_grade_pct"
      - "variant_applied set to PROVISIONAL and all three ledger buckets set to 0.00"

  - method: GET
    path: "/grade-passbacks"
    description: "List passbacks, filterable by shell_id or term_id (reverse reachability)."
    roles: [Instructor, Registrar, LmsAdmin]
    code: 200
    input: ["limit?", "offset?", "shell_id?", "term_id?", "passback_state?"]
    output: GradePassback[]
    side_effects: []

  - method: GET
    path: "/grade-passbacks/{id}"
    description: "Read one passback including the passback_points_ledger buckets and amendment_round."
    roles: [Instructor, Registrar, LmsAdmin]
    code: 200
    input: []
    output: GradePassback
    side_effects: []

  - method: POST
    path: "/grade-passbacks/{id}/transitions"
    description: "Drive the instructor side of a passback: SUBMIT or RESTAGE."
    roles: [Instructor]
    code: 200
    input: [action]
    output: GradePassback
    side_effects:
      - "SUBMIT switches variant_applied to FINAL, rewrites every staged Enrollment.final_grade_pct via final_grade_percentage, and seeds submitted_points_total"
      - "SUBMIT is blocked while the term's continuity_posture is CONTINUITY_MODE or a FERPA-blocked student is staged"
      - "RESTAGE returns a RETURNED passback to PROVISIONAL figures and zeroes submitted_points_total"
      - "AMENDED -> SUBMITTED decrements AcademicTerm.open_amendment_count"
      - "increments GradePassback.version by 1"

  - method: POST
    path: "/grade-passbacks/{id}/registrar-decisions"
    description: "Registrar accepts or returns a submitted passback."
    roles: [Registrar]
    code: 200
    input: [decision, "note?"]
    output: GradePassback
    side_effects:
      - "ACCEPT moves accepted_points_total to submitted_points_total, satisfying the passback_points_ledger invariant"
      - "RETURN zeroes the ledger and sends the passback back to the instructor"
      - "registrar_note recorded; segregation of duties enforced against the submitting instructor"
      - "increments GradePassback.version by 1"

  - method: POST
    path: "/grade-disputes"
    description: "A student disputes one graded item on an accepted passback."
    roles: [Student]
    code: 201
    input: [passback_id, enrollment_id, content_item_id, claimed_earned_points]
    output: GradeDispute
    side_effects:
      - "held_points escrowed from the enrollment's earned_points_total; passback buckets shift per passback_points_ledger event E4"
      - "the passback takes ACCEPTED -> DISPUTED on the first dispute and AcademicTerm.open_amendment_count is incremented"
      - "filed_by_user_id set to the acting X-User-ID; the filing is gated on the term's student_access_end_at"

  - method: GET
    path: "/grade-disputes"
    description: "List disputes, filterable by passback_id, enrollment_id or content_item_id (reverse reachability)."
    roles: [Student, Instructor, Registrar]
    code: 200
    input: ["limit?", "offset?", "passback_id?", "enrollment_id?", "content_item_id?", "dispute_state?"]
    output: GradeDispute[]
    side_effects: []

  - method: GET
    path: "/grade-disputes/{id}"
    description: "Read one dispute including held_points and any adjusted_earned_points."
    roles: [Student, Instructor, Registrar]
    code: 200
    input: []
    output: GradeDispute
    side_effects: []

  - method: POST
    path: "/grade-disputes/{id}/resolve"
    description: "The owning instructor upholds the original grade or changes it."
    roles: [Instructor]
    code: 200
    input: [outcome, "adjusted_earned_points?", "note?"]
    output: GradeDispute
    side_effects:
      - "UPHELD releases the escrow with zero ledger drift (passback_points_ledger event E5) and can return the passback to ACCEPTED"
      - "CHANGED rewrites the enrollment's earned_points_total, re-runs final_grade_percentage variant FINAL, absorbs the delta into the ledger (event E6) and drives the passback to AMENDED"
      - "resolved_at stamped from the logical clock"

  # ---- ContinuityWindow ---------------------------------------------------
  - method: POST
    path: "/continuity-windows"
    description: "Open an outage, extension or maintenance window over a term or a single shell. Optimistic-concurrency guarded on the term."
    roles: [LmsAdmin]
    code: 201
    input: [term_id, kind, window_start, window_end, expected_term_version, "shell_id?"]
    output: ContinuityWindow
    side_effects:
      - "rejects with ERR_STALE_VERSION when expected_term_version does not match the AcademicTerm's current version (§1.2.1 continuity-window-create-stale-term)"
      - "increments AcademicTerm.version by 1, so a superseding window must re-read the term"
      - "shell-scoped windows are checked with half-open [start, end) intersection against OPEN windows of the same shell and kind; abutment is allowed"
      - "term-wide OUTAGE windows are additionally checked against the closed-interval concurrency cap MAX_CONCURRENT_OUTAGE_WINDOWS"
      - "affected_enrollment_count and extension_days_granted computed at creation"

  - method: GET
    path: "/continuity-windows"
    description: "List continuity windows, filterable by term_id or shell_id (reverse reachability)."
    roles: [LmsAdmin, Registrar, Instructor]
    code: 200
    input: ["limit?", "offset?", "term_id?", "shell_id?", "kind?", "window_state?"]
    output: ContinuityWindow[]
    side_effects: []

  - method: GET
    path: "/continuity-windows/{id}"
    description: "Read one continuity window."
    roles: [LmsAdmin, Registrar, Instructor]
    code: 200
    input: []
    output: ContinuityWindow
    side_effects: []

  - method: POST
    path: "/continuity-windows/{id}/transitions"
    description: "Drive a window: CLOSE or CANCEL."
    roles: [LmsAdmin]
    code: 200
    input: [action]
    output: ContinuityWindow
    side_effects:
      - "CLOSE stamps closed_at and frees the window's slot under the concurrency cap"
      - "CANCEL requires the logical clock to be strictly before window_start and zeroes affected_enrollment_count and extension_days_granted"
      - "increments ContinuityWindow.version by 1"

  # ---- Test-driving endpoints (/_ namespace) -------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the server's logical clock, which every deadline, expiry, window and
      retention rule reads. The server's startup default is exactly
      2026-08-01T00:00:00Z: before any call to this endpoint the logical clock
      reads that instant and never falls back to real wall-clock time.
    roles: [LmsAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "no entity is mutated; subsequent requests evaluate add_drop_deadline_at, sandbox_expires_at, student_access_end_at, retention_purge_at and continuity window bounds against the new instant"

  - method: POST
    path: "/_grade-records"
    description: "Record (or overwrite) one enrollment's earned points for one content item. This is the only way to put grades into a gradebook, so the two final_grade_percentage variants are drivable from an empty database."
    roles: [Instructor]
    code: 201
    input: [enrollment_id, content_item_id, earned_points]
    output: Enrollment
    side_effects:
      - "enrollment.earned_points_total set to the sum of its grade records; graded_points_possible set to the sum of the graded items' points_possible"
      - "final_grade_percentage variant PROVISIONAL rewrites enrollment.provisional_grade_pct"
      - "increments Enrollment.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not one of the six declared roles, or is not listed on the target endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Instructor acts on a shell they do not own, or a Student acts on an enrollment that is not theirs"

  # ---- existence ----------------------------------------------------------
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "term_id in a path or body does not resolve to an AcademicTerm"
  - id: ERR_PERSON_NOT_FOUND
    http: 404
    condition: "owner_person_id or person_id does not resolve to a Person"
  - id: ERR_SHELL_NOT_FOUND
    http: 404
    condition: "a shell id in a path or body (shell_id, parent_shell_id, child_shell_id, source_shell_id, target_shell_id) does not resolve to a CourseShell"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "an enrollment id in a path or body does not resolve to an Enrollment"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "a sync batch id does not resolve to an EnrollmentSyncBatch"
  - id: ERR_MERGE_REQUEST_NOT_FOUND
    http: 404
    condition: "a merge request id does not resolve to a MergeRequest"
  - id: ERR_CONTENT_ITEM_NOT_FOUND
    http: 404
    condition: "a content item id in a path or body does not resolve to a ContentItem"
  - id: ERR_ROLLOVER_JOB_NOT_FOUND
    http: 404
    condition: "a rollover job id does not resolve to a RolloverJob"
  - id: ERR_TOOL_NOT_FOUND
    http: 404
    condition: "tool_id does not resolve to a ToolIntegration"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "a review id does not resolve to a ToolReview"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "a placement id does not resolve to a ToolPlacement"
  - id: ERR_PASSBACK_NOT_FOUND
    http: 404
    condition: "passback_id does not resolve to a GradePassback"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "a dispute id does not resolve to a GradeDispute"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "a continuity window id does not resolve to a ContinuityWindow"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum member, out-of-range number, unparseable datetime, window_end not after window_start, term_end_at not after term_start_at, finals_window_end_at after term_end_at, merge child equal to parent, non-zero points_possible on a PAGE or FILE, missing conditions_note on a CONDITIONS review, or missing adjusted_earned_points on a CHANGED dispute resolution"

  # ---- uniqueness / referential integrity ---------------------------------
  - id: ERR_DUPLICATE_TERM_CODE
    http: 409
    condition: "term_code already exists"
  - id: ERR_DUPLICATE_SECTION_CODE
    http: 409
    condition: "an OFFICIAL shell with the same (term_id, sis_section_code) already exists and is not REJECTED or PURGED"
  - id: ERR_DUPLICATE_TOOL
    http: 409
    condition: "a ToolIntegration with the same (vendor_name, tool_name) already exists"
  - id: ERR_DUPLICATE_PASSBACK
    http: 409
    condition: "a GradePassback already exists for the shell"
  - id: ERR_SHELL_ALREADY_MERGED
    http: 409
    condition: "the child shell of a merge already carries merged_into_shell_id or is in provisioning_state MERGED"
  - id: ERR_CROSS_TERM_MERGE
    http: 422
    condition: "the two shells of a merge belong to different terms, or either is not shell_type OFFICIAL"
  - id: ERR_MERGE_CHAIN_FORBIDDEN
    http: 422
    condition: "the merge parent is itself absorbed into a third shell, or the child has already absorbed a shell of its own"
  - id: ERR_REVIEW_DIMENSION_CONFLICT
    http: 409
    condition: "a ToolReview already exists for that tool and dimension in the current review round"
  - id: ERR_REVIEW_INCOMPLETE
    http: 422
    condition: "FINALIZE_REVIEW attempted while privacy_review_state or accessibility_review_state is still PENDING"

  # ---- state / concurrency ------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the entity's current state, the entity is in a terminal state, or a cross-entity state precondition of the transition fails"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_parent_shell_version, expected_target_shell_version or expected_term_version does not match the parent's current version (§1.2.1)"

  # ---- safety / compliance ------------------------------------------------
  - id: ERR_FERPA_BLOCK_ACTIVE
    http: 403
    condition: "a Person with ferpa_block == true would be exposed by activating a data-sharing tool placement or submitting a grade passback"
  - id: ERR_STUDENT_ACCESS_EXPIRED
    http: 403
    condition: "a Student read or dispute filing occurs after the term's student_access_end_at, or the acting Person's access_revoked_at has passed"
  - id: ERR_TOOL_NOT_APPROVED
    http: 409
    condition: "activating a placement whose tool is DRAFT, UNDER_REVIEW, REJECTED or SUSPENDED"
  - id: ERR_TOOL_VERSION_DRIFT
    http: 409
    condition: "activating a placement whose tool.approved_version no longer equals tool.tool_version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the same X-User-ID would perform two duties that must be separated: submitting and deciding a merge request, deciding both tool review dimensions, or submitting and accepting a grade passback"
  - id: ERR_RETENTION_HOLD_ACTIVE
    http: 403
    condition: "purge attempted on a term with retention_class == LEGAL_HOLD"

  # ---- temporal -----------------------------------------------------------
  - id: ERR_ADD_DROP_WINDOW_CLOSED
    http: 409
    condition: "reinstating a dropped enrollment after the term's add_drop_deadline_at"
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "a shell-scoped continuity window's half-open [window_start, window_end) intersects an OPEN window of the same shell and kind"
  - id: ERR_CONTINUITY_CAP_EXCEEDED
    http: 422
    condition: "a new OPEN OUTAGE window would make three of the term's OUTAGE windows cover one instant under closed-interval arithmetic"
  - id: ERR_WINDOW_ALREADY_STARTED
    http: 409
    condition: "cancelling a continuity window at or after its window_start"
  - id: ERR_SANDBOX_EXPIRED
    http: 409
    condition: "adding content, placements or rollover output to a SANDBOX or DEV shell after its sandbox_expires_at"
  - id: ERR_PURGE_NOT_DUE
    http: 409
    condition: "purge attempted before the term's retention_purge_at, or when retention_purge_at is null"
  - id: ERR_TERM_POSTURE_FROZEN
    http: 409
    condition: "grade passback submission or lifecycle advancement out of FINALS attempted while the term's continuity_posture is CONTINUITY_MODE"

  # ---- cross-entity constraints -------------------------------------------
  - id: ERR_SHELL_NOT_PUBLISH_READY
    http: 422
    condition: "publish attempted while the shell has a BLOCKED or still-REQUESTED ToolPlacement"
  - id: ERR_SHELL_STATE_BLOCKS_ENROLLMENT
    http: 409
    condition: "enrollment, placement or passback attempted against a shell whose provisioning_state does not permit it"
  - id: ERR_SANDBOX_NOT_PUBLISHABLE
    http: 422
    condition: "publish attempted on a SANDBOX or DEV shell, or a STUDENT enrollment created in one"
  - id: ERR_ROLLOVER_SOURCE_INELIGIBLE
    http: 422
    condition: "the rollover source shell is not CONCLUDED or ARCHIVED, or belongs to the target term"
  - id: ERR_ROLLOVER_TARGET_NOT_EMPTY
    http: 422
    condition: "the rollover target shell already holds content items or enrollments"
  - id: ERR_ROLE_CONFLICT
    http: 409
    condition: "duplicate or contradictory role assignment for one (shell, person) pair, the shell owner enrolled as STUDENT in their own shell, or a second OPEN dispute on one enrollment"
  - id: ERR_SYNC_EPOCH_OUT_OF_ORDER
    http: 409
    condition: "applying a sync batch whose batch_seq is not the term's sis_sync_epoch + 1"
  - id: ERR_NO_GRADES_STAGED
    http: 422
    condition: "submitting a passback where no staged enrollment has graded_points_possible > 0"
  - id: ERR_OPEN_DISPUTES_BLOCK_CLOSE
    http: 422
    condition: "closing a term while any of its passbacks is DISPUTED or AMENDED"
  - id: ERR_ROLLOVER_INCOMPLETE
    http: 422
    condition: "opening registration while the term's rollover_completion_pct is below 100.00"
  - id: ERR_ITEM_HAS_SUBMISSIONS
    http: 409
    condition: "deleting a content item that already has submissions"

  # ---- capacity / quota ---------------------------------------------------
  - id: ERR_SANDBOX_QUOTA_EXCEEDED
    http: 422
    condition: "the owner already holds MAX_SANDBOX_SHELLS_PER_PERSON live SANDBOX or DEV shells"
  - id: ERR_SEAT_CAP_EXCEEDED
    http: 422
    condition: "promoting or reinstating a STUDENT enrollment when waitlist_promotion_capacity reports no open seat under effective_seat_cap"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
# The two reviewer roles are peers that must not overlap on one tool; the merge
# submitter and merge approver are the same role but must be different users;
# the instructor that submits a passback may not be the registrar that accepts
# it. Every duty pair is enforced on X-User-ID, which is why the two
# person-facing roles are entity_backed.
# =============================================================================

roles:

  - name: Registrar
    description: "Owns the registrar calendar: terms, people, the SIS enrollment feed and the archival tail of shells. Accepts or returns grade passbacks."
    identity: opaque
    exclusive_operations:
      - "POST /academic-terms"
      - "PATCH /academic-terms/{id}"
      - "POST /academic-terms/{id}/lifecycle-transitions"
      - "POST /people"
      - "PATCH /people/{id}"
      - "POST /course-shells/{id}/lifecycle-transitions"
      - "POST /enrollments"
      - "POST /enrollments/{id}/transitions"
      - "POST /enrollment-sync-batches"
      - "POST /enrollment-sync-batches/{id}/transitions"
      - "POST /grade-passbacks/{id}/registrar-decisions"
    shared_operations:
      - "GET /academic-terms and GET /academic-terms/{id}"
      - "GET /people and GET /people/{id}"
      - "GET /course-shells and GET /course-shells/{id}"
      - "GET /enrollments and GET /enrollments/{id}"
      - "GET /enrollment-sync-batches and GET /enrollment-sync-batches/{id}"
      - "GET /merge-requests and GET /merge-requests/{id}"
      - "GET /grade-passbacks and GET /grade-passbacks/{id}"
      - "GET /grade-disputes and GET /grade-disputes/{id}"
      - "GET /continuity-windows and GET /continuity-windows/{id}"

  - name: LmsAdmin
    description: "Operates the LMS: shell provisioning, cross-list merges, term rollover, tool registration and approval, continuity windows, and the term's continuity posture."
    identity: opaque
    exclusive_operations:
      - "POST /course-shells"
      - "POST /course-shells/{id}/provisioning-decisions"
      - "POST /academic-terms/{id}/posture-changes"
      - "POST /merge-requests"
      - "POST /merge-requests/{id}/transitions"
      - "POST /rollover-jobs"
      - "POST /rollover-jobs/{id}/transitions"
      - "POST /tool-integrations"
      - "PATCH /tool-integrations/{id}"
      - "POST /tool-integrations/{id}/transitions"
      - "POST /continuity-windows"
      - "POST /continuity-windows/{id}/transitions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on every collection and single resource except GET /tool-reviews"
      - "POST /content-items"
      - "POST /course-shells/{id}/publish and POST /course-shells/{id}/unpublish"
      - "POST /tool-placements and POST /tool-placements/{id}/transitions"
    notes: |
      Segregation of duties inside this single role: the LmsAdmin whose
      X-User-ID created a MergeRequest may not be the X-User-ID that APPROVEs or
      DECLINEs it (ERR_SEGREGATION_OF_DUTIES).

  - name: Instructor
    description: "Instructor of record for a shell: authors content, requests tool placements, stages and submits grade passbacks, resolves disputes on their own shells."
    identity: "entity_backed:Person"
    exclusive_operations:
      - "PATCH /content-items/{id}"
      - "DELETE /content-items/{id}"
      - "POST /content-items/{id}/submissions"
      - "POST /grade-passbacks"
      - "POST /grade-passbacks/{id}/transitions"
      - "POST /grade-disputes/{id}/resolve"
      - "POST /_grade-records"
    shared_operations:
      - "POST /content-items"
      - "POST /course-shells/{id}/publish and POST /course-shells/{id}/unpublish"
      - "POST /tool-placements and POST /tool-placements/{id}/transitions"
      - "GET /academic-terms, /people/{id}, /course-shells, /content-items, /enrollments, /rollover-jobs, /tool-integrations, /tool-placements, /grade-passbacks, /grade-disputes, /continuity-windows"
    notes: |
      X-User-ID must equal CourseShell.owner_person_id for every write against
      a shell and for dispute resolution, else ERR_NOT_RESOURCE_OWNER. An
      Instructor may not accept their own passback — that duty belongs to
      Registrar and is additionally guarded by ERR_SEGREGATION_OF_DUTIES.

  - name: PrivacyReviewer
    description: "Campus privacy office reviewer; decides the PRIVACY dimension of a tool integration review."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /tool-reviews (dimension PRIVACY)"
      - "GET /tool-integrations, GET /tool-integrations/{id}, GET /tool-reviews, GET /tool-reviews/{id}"
    notes: |
      A PrivacyReviewer may post only dimension PRIVACY; posting ACCESSIBILITY
      is an AccessibilityReviewer duty. The same X-User-ID may never hold
      ToolReview rows on both dimensions of one tool
      (ERR_SEGREGATION_OF_DUTIES).

  - name: AccessibilityReviewer
    description: "Campus accessibility office reviewer; decides the ACCESSIBILITY dimension of a tool integration review."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /tool-reviews (dimension ACCESSIBILITY)"
      - "GET /tool-integrations, GET /tool-integrations/{id}, GET /tool-reviews, GET /tool-reviews/{id}"
    notes: |
      Peer of PrivacyReviewer with the mirrored restriction: only dimension
      ACCESSIBILITY, and never both dimensions of one tool under one X-User-ID.

  - name: Student
    description: "Enrolled learner; reads their own enrollments and course material and files grade disputes within the post-term access window."
    identity: "entity_backed:Person"
    exclusive_operations:
      - "POST /grade-disputes"
    shared_operations:
      - "GET /academic-terms/{id}, GET /course-shells/{id}, GET /content-items, GET /content-items/{id}, GET /enrollments, GET /enrollments/{id}, GET /grade-disputes, GET /grade-disputes/{id}"
    notes: |
      X-User-ID must equal the Enrollment.person_id being read or disputed
      (ERR_NOT_RESOURCE_OWNER), and every read is gated on the term's
      student_access_end_at (ERR_STUDENT_ACCESS_EXPIRED).
