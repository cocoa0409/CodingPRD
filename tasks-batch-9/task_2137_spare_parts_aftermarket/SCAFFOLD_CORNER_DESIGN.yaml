        distinguishing_aspect: "With zero qualifying CONSUMED lines the downtime term is 0 rather than undefined, so 20 + 0 + 20 + 6 == 46.00 lands in the ESSENTIAL band and the 1.28 service factor gives safety_stock_units 3 and reorder_point_units 5."
        test_recipe:
          setup:
            - "one ACTIVE ESSENTIAL price rule with base_uplift_pct 0.35, max_uplift_pct 0.60, min_margin_pct 0.20"
            - "a dealer, one equipment model and exactly two ACTIVE installed units at build_revision 100"
            - "part ESS-1 with unit_cost_cents 1333 and lead_time_days 60, and an ACTIVE applicability row from build revision 0 with qty_per_unit 25"
            - "a CURRENT 12-month INSTALLED_BASE_RATE forecast: 2 * 25 * 0.20 == 10.00 so forecast_units == 10"
            - "no work orders exist at all, so the downtime input set is empty"
          setup_api_calls:
            - call: "POST /aftermarket/price-rules"
              payload: { criticality_class: "ESSENTIAL", base_uplift_pct: 0.35, max_uplift_pct: 0.60, min_margin_pct: 0.20 }
