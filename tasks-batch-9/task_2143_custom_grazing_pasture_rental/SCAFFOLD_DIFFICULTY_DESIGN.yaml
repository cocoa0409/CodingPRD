              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "POST /grazing/pastures/${pa}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/pastures"
              payload: { name: "Coulee B", acres: 600, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 0 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { pb: $.data.id, pb_v0: $.data.version }
            - call: "POST /grazing/pastures/${pb}/capacity-assessments"
              payload: { expected_pasture_version: "${pb_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1700, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "POST /grazing/pastures/${pb}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o1}", pasture_id: "${pa}", billing_mode: "PER_HEAD_PER_DAY", rate_cents: 100, shrink_pct: 0, out_shrink_pct: 0, head_count_committed: 100, head_value_cents: 130000, start_date: "2026-08-10", end_date: "2026-11-10", min_days: 60, treatment_cost_split_pct: 0, water_responsibility: "GRAZIER", fence_responsibility: "GRAZIER", infrastructure_owner_cap_cents: 100000, death_loss_terms: "OWNER_BEARS_ALL", death_loss_threshold_pct: 2.0 }
