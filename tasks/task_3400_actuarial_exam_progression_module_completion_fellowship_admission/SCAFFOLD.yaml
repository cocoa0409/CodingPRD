# =============================================================================
# PRD Benchmark Scaffold — Actuarial Exam Progression, Module Completion &
# Fellowship Admission (Society of Actuaries style)
# =============================================================================

scenario: |
  Actuarial Exam Progression, Module Completion & Fellowship Admission (Society
  of Actuaries): preliminary examination sequence with computer-based testing
  windows, registration deadlines and pass mark setting by committee,
  validation by educational experience where university coursework can
  substitute for certain requirements with transcript review, fellowship track
  selection with specialty modules, project assessments and written
  examinations graded by volunteer committees, professionalism course
  requirement scheduled at a specific stage with attendance verification, exam
  content updates and transition rules when the syllabus changes mid-candidacy
  with credit mapping, candidate record maintenance and transfer credit from
  other actuarial bodies through mutual recognition, continuing professional
  development attestation for members, discipline process for professional
  conduct violations.

domain_name: "actuarial-exam-progression"
api_prefix: "/actuarial"

complexity_profile:
  primary_archetype: compliance_audit        # progression gating with audit trail, cooling-off-style cooldowns, segregation of duties
  secondary_archetype: multi_party_negotiation  # pass-mark committee ratification; two-grader consensus with resolver on projects
  complexity_layers:
    - optimistic_concurrency      # OCC on ExamWindow.version (pass-mark create) and Candidate.version (credential application)
    - cascading_side_effects      # discipline sanction cascade (depth 4); syllabus activation cascade (depth 4); module pass bubble-up
    - derived_field_reconciliation  # seats_held, completion_pct, credit totals recomputed from children
    - ops_run_checkpoint          # POST /_clock/set_current_utc sweeps window/session/suspension epochs

  entity_topology: flat            # peer entities joined by declared FKs; two sub-resource reads for FK reverse-reachability
  state_machine_shape: cyclic      # Candidate ACTIVE->SUSPENDED->ACTIVE; CPDAttestation ATTESTED->SHORTFALL->VERIFIED; plus parallel dims on ExamRegistration and fork/join on ProjectAssessment

  relationship_patterns:
    - one_to_many            # Candidate -> registrations/submissions/attestations/cases
    - self_referential       # Exam.prerequisite_exam_id -> Exam.id (DAG, acyclic)
    - cross_aggregate        # ModuleAttempt -> TrackEnrollment + Module; CourseAttendance -> Session + Candidate

  role_model: segregation_of_duties  # project grader != prior graders; committee/registrar/reviewer/board split
  consistency_model: immediate       # every mutation visible in the same response

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across all candidates."
        constraints: "unique; RFC-5322-ish non-empty string"
      - name: full_name
        type: string
        source: input
        description: "Legal full name."
      - name: membership_tier
        type: enum
        source: system
        description: "Credential ladder dimension (parallel to status)."
        default: CANDIDATE
        constraints: "one of {CANDIDATE, ASSOCIATE, FELLOW}; only advances"
      - name: status
        type: enum
        source: system
        description: "Standing dimension; SUSPENDED auto-lifts when suspended_until is reached by the logical clock."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, EXPELLED}"
      - name: suspended_until
        type: datetime
        source: system
        description: "Set when a SUSPENSION sanction resolves; null otherwise."
        default: null
      - name: associate_admitted_at
        type: datetime
        source: system
        description: "Set when an ASA CredentialApplication is APPROVED."
        default: null
      - name: fellow_admitted_at
        type: datetime
        source: system
        description: "Set when an FSA CredentialApplication is APPROVED."
        default: null
      - name: earned_exam_credit_hours
        type: integer
        source: computed
        description: "Sum of credit_hours over distinct exams on which the candidate holds a PASS credit, counting a credit earned on a RETIRED exam toward its mapped ACTIVE exam per transition_credit_mapping (no double count)."
      - name: transfer_credit_hours
        type: integer
        source: computed
        description: "Sum of granted_hours over the candidate's TransferCreditRequest rows with status GRANTED."
      - name: total_credit_hours
        type: integer
        source: computed
        description: "earned_exam_credit_hours + transfer_credit_hours."
      - name: last_evaluated_at
        type: datetime
        source: system
        description: "Stamped with the logical clock on every CredentialApplication creation; bumps version even when the application is DENIED."
        default: null

  - name: SyllabusVersion
    parent: null
    common_fields: true
    fields:
      - name: version_code
        type: string
        source: input
        description: "Edition code, e.g. '2026-A'."
        constraints: "unique"
      - name: status
        type: enum
        source: system
        description: "DRAFT until activated; at most one version is ACTIVE at any time."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"
      - name: credit_map
        type: object
        source: input
        description: "Transition rules: maps an outgoing ACTIVE version's exam_code to this version's exam_code; validated at activation (keys must be exam codes of the version being retired, values must be exam codes of exams belonging to this version)."
        default: {}
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of activation."
        default: null

  - name: Exam
    parent: null
    common_fields: true
    fields:
      - name: exam_code
        type: string
        source: input
        description: "Short code, e.g. 'P', 'FM', 'IFM'."
        constraints: "unique"
      - name: title
        type: string
        source: input
        description: "Exam title."
      - name: credit_hours
        type: integer
        source: input
        description: "Credit hours granted on PASS."
        constraints: ">= 1"
      - name: is_prelim
        type: boolean
        source: input
        description: "True when the exam belongs to the preliminary examination sequence required for ASA."
        default: true
      - name: prerequisite_exam_id
        type: string
        source: input
        description: "FK -> Exam.id; nullable. Must reference an exam on the SAME syllabus version; the prerequisite graph across all exams of one syllabus version MUST be acyclic (rejected with ERR_INVALID_REQUEST otherwise)."
        default: null
      - name: syllabus_version_id
        type: string
        source: input
        description: "FK -> SyllabusVersion.id; owning syllabus edition."
      - name: status
        type: enum
        source: system
        description: "Mirrors owning syllabus: created DRAFT, ACTIVE when its syllabus activates, RETIRED when its syllabus retires."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, RETIRED}"

  - name: ExamWindow
    parent: null
    common_fields: true
    fields:
      - name: exam_id
        type: string
        source: input
        description: "FK -> Exam.id; the exam this computer-based testing window administers."
      - name: window_code
        type: string
        source: input
        description: "Window code, e.g. 'P-2026-10'."
        constraints: "unique"
      - name: registration_opens_at
        type: datetime
        source: input
        description: "Window auto-advances SCHEDULED -> REGISTRATION_OPEN on a clock sweep when current_utc >= registration_opens_at."
      - name: registration_deadline
        type: datetime
        source: input
        description: "Window auto-advances to REGISTRATION_CLOSED on a clock sweep when current_utc >= registration_deadline. Boundary: a registration at exactly the deadline is REJECTED because the sweep has already closed the window (>= semantics)."
      - name: testing_starts_at
        type: datetime
        source: input
        description: "Window auto-advances to TESTING when current_utc >= testing_starts_at."
      - name: testing_ends_at
        type: datetime
        source: input
        description: "Window auto-advances to SCORING when current_utc >= testing_ends_at; REGISTERED registrations become SAT in the same sweep."
      - name: capacity
        type: integer
        source: input
        description: "Maximum seats held by REGISTERED registrations."
        constraints: ">= 1"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Early registration fee component in cents."
        constraints: ">= 0"
      - name: late_surcharge_cents
        type: integer
        source: input
        description: "Added when registration is created at or after registration_deadline minus LATE_FEE_WINDOW_DAYS (14)."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Driven by the logical clock sweep and pass-mark publication."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, REGISTRATION_OPEN, REGISTRATION_CLOSED, TESTING, SCORING, RESULTS_PUBLISHED, CANCELLED}"
      - name: seats_held
        type: integer
        source: computed
        description: "Count of this window's ExamRegistration rows with logistics_status == REGISTERED. Invariant: seats_held always equals that count."
      - name: waitlist_count
        type: integer
        source: computed
        description: "Count of this window's ExamRegistration rows with logistics_status == WAITLISTED."

  - name: ExamRegistration
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: exam_window_id
        type: string
        source: input
        description: "FK -> ExamWindow.id; the window being registered for."
      - name: logistics_status
        type: enum
        source: system
        description: "Parallel dimension 1 (seat logistics), independent of grading_status."
        default: null
        constraints: "one of {REGISTERED, WAITLISTED, SAT, CANCELLED}; set at creation (REGISTERED if seats_held < capacity else WAITLISTED)"
      - name: grading_status
        type: enum
        source: system
        description: "Parallel dimension 2 (grading), independent of logistics_status."
        default: PENDING
        constraints: "one of {PENDING, RELEASED}"
      - name: raw_score
        type: integer
        source: system
        description: "Raw item score 0..MAX_RAW_SCORE (60), entered by the ExamCommittee via record-score while the window is SCORING."
        default: null
      - name: scaled_score
        type: number
        source: computed
        description: "round_half_up(raw_score / MAX_RAW_SCORE * 10, 1); null until raw_score is set."
      - name: result
        type: enum
        source: system
        description: "Official PASS/FAIL set at pass-mark publication: PASS iff scaled_score >= ratified_mark."
        default: null
        constraints: "one of {PASS, FAIL, null}"
      - name: projected_result
        type: enum
        source: computed
        description: "Provisional variant: PASS iff scaled_score >= the current projection mark (ratified_mark if the window's latest non-SUPERSEDED PassMarkSetting is RATIFIED, else its proposed_mark); null when grading_status == RELEASED or no pass mark / raw score exists."
        default: null
        constraints: "one of {PASS, FAIL, null}"
      - name: fee_charged_cents
        type: integer
        source: system
        description: "Fee per registration_fee_cents calculation; computed at creation for REGISTERED, at promotion for WAITLISTED."
        default: null
      - name: refund_cents
        type: integer
        source: system
        description: "Credited on cancellation per refund_cents calculation; null until cancelled."
        default: null
      - name: cancel_reason
        type: enum
        source: system
        description: "Why the registration was cancelled."
        default: null
        constraints: "one of {CANDIDATE, DISCIPLINE_SUSPENSION, DISCIPLINE_EXPULSION, SYLLABUS_RETIREMENT, null}"
      - name: sat_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the registration was marked SAT."
        default: null

  - name: PassMarkSetting
    parent: null
    common_fields: true
    fields:
      - name: exam_window_id
        type: string
        source: input
        description: "FK -> ExamWindow.id; the window whose pass mark this committee setting governs."
      - name: proposed_mark
        type: number
        source: input
        description: "Committee-proposed pass mark on the 0-10 scaled score."
        constraints: "0 <= mark <= 10, one decimal place"
      - name: ratified_mark
        type: number
        source: system
        description: "Mark ratified at ratification; may differ from proposed_mark. Null until RATIFIED."
        default: null
        constraints: "0 <= mark <= 10, one decimal place"
      - name: status
        type: enum
        source: system
        description: "Committee workflow state."
        default: PROPOSED
        constraints: "one of {PROPOSED, RATIFIED, PUBLISHED, SUPERSEDED}"

  - name: VEECourseSubmission
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: topic
        type: enum
        source: input
        description: "Validation by Educational Experience topic."
        constraints: "one of {ECONOMICS, CORPORATE_FINANCE, APPLIED_STATISTICS}"
      - name: university
        type: string
        source: input
        description: "Institution whose coursework is offered for substitution."
      - name: course_title
        type: string
        source: input
        description: "Course identifier/title on the transcript."
      - name: grade_points
        type: number
        source: input
        description: "Transcript grade on the 4.0 scale; approvable only when >= VEE_GRADE_MIN (2.7)."
        constraints: "0.0 <= grade_points <= 4.0"
      - name: status
        type: enum
        source: system
        description: "Transcript-review state. REJECTED is terminal; a fresh submission for the same topic is the resubmission path."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED}"
      - name: reviewer_note
        type: string
        source: system
        description: "Reviewer's note recorded at review."
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the review decision."
        default: null

  - name: TrackEnrollment
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: track_code
        type: enum
        source: input
        description: "Fellowship specialty track."
        constraints: "one of {QFI, ILA, CFE, RET, GH}"
      - name: status
        type: enum
        source: system
        description: "ENROLLED until every non-capstone module of the track is PASSED (auto -> CAPSTONE_ELIGIBLE); COMPLETED when the capstone module is PASSED; WITHDRAWN only via expulsion cascade."
        default: ENROLLED
        constraints: "one of {ENROLLED, CAPSTONE_ELIGIBLE, COMPLETED, WITHDRAWN}"
      - name: modules_passed_count
        type: integer
        source: computed
        description: "Count of distinct modules of this track with at least one PASSED ModuleAttempt under this enrollment."
      - name: completion_pct
        type: number
        source: computed
        description: "Per track_completion_pct: round_half_up(100 * (2*noncapstone_passed + 3*capstone_passed + 2*project_passed) / (2*noncapstone_total + 3 + 2), 2). Evaluation order is pinned: the capstone-eligibility gate reads ONLY non-capstone module passes and is evaluated before any capstone/project contribution is added."

  - name: Module
    parent: null
    common_fields: true
    fields:
      - name: module_code
        type: string
        source: input
        description: "Module code, e.g. 'QFI-M1'."
        constraints: "unique"
      - name: track_code
        type: enum
        source: input
        description: "Fellowship track this module belongs to."
        constraints: "one of {QFI, ILA, CFE, RET, GH}"
      - name: sequence_index
        type: integer
        source: input
        description: "Ordering within the track; attempting sequence k requires a PASSED attempt on sequence k-1 of the same track under the same enrollment."
        constraints: ">= 1; unique within track_code"
      - name: title
        type: string
        source: input
        description: "Module title."
      - name: is_capstone
        type: boolean
        source: input
        description: "Capstone modules additionally require the enrollment to be CAPSTONE_ELIGIBLE."
        default: false
      - name: passing_score
        type: integer
        source: input
        description: "Submit score >= passing_score grades the attempt PASSED (>= boundary)."
        constraints: "1 <= passing_score <= 100"
      - name: cooldown_days
        type: integer
        source: input
        description: "Days that must elapse after a FAILED attempt before a new attempt on the same module is allowed (>= boundary on submitted_at + cooldown_days)."
        default: 14
        constraints: ">= 0"

  - name: ModuleAttempt
    parent: null
    common_fields: true
    fields:
      - name: track_enrollment_id
        type: string
        source: input
        description: "FK -> TrackEnrollment.id; enrollment under which the attempt is made. Must equal an enrollment of the acting candidate."
      - name: module_id
        type: string
        source: input
        description: "FK -> Module.id; module being attempted. The module's track_code must equal the enrollment's track_code."
      - name: attempt_number
        type: integer
        source: system
        description: "1 + count of prior attempts on the same module under the same enrollment."
      - name: status
        type: enum
        source: system
        description: "IN_PROGRESS until submitted; submit grades synchronously."
        default: IN_PROGRESS
        constraints: "one of {IN_PROGRESS, PASSED, FAILED}"
      - name: score
        type: integer
        source: system
        description: "Assessment score 0-100 supplied at submit; PASSED iff score >= module.passing_score."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of submit; basis for the retake cooldown."
        default: null

  - name: ProjectAssessment
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: track_enrollment_id
        type: string
        source: input
        description: "FK -> TrackEnrollment.id; must be the acting candidate's enrollment in status CAPSTONE_ELIGIBLE (or COMPLETED)."
      - name: title
        type: string
        source: input
        description: "Project title."
      - name: status
        type: enum
        source: system
        description: "Fork/join volunteer-grading workflow: SUBMITTED -> IN_REVIEW on first grade; second grade joins to DECIDED when |g1-g2| <= CONSENSUS_TOLERANCE (10), else forks to SPLIT; SPLIT -> DECIDED on a third distinct grader."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, IN_REVIEW, SPLIT, DECIDED}"
      - name: grader_ids
        type: array
        source: system
        description: "Ordered list of Grader X-User-ID values who have graded; segregation of duties forbids repeats."
        default: []
      - name: scores
        type: array
        source: system
        description: "Ordered integer scores parallel to grader_ids (0-100 each)."
        default: []
      - name: final_score
        type: integer
        source: system
        description: "Consensus path: round_half_up((g1+g2)/2, 0). Split path: median(g1, g2, r). Null until DECIDED."
        default: null
      - name: result
        type: enum
        source: system
        description: "PASS iff final_score >= PROJECT_PASS_SCORE (70)."
        default: null
        constraints: "one of {PASS, FAIL, null}"

  - name: ProfessionalismCourseSession
    parent: null
    common_fields: true
    fields:
      - name: session_code
        type: string
        source: input
        description: "Session code, e.g. 'APC-2026-11'."
        constraints: "unique"
      - name: starts_at
        type: datetime
        source: input
        description: "Session start; bookable only while current_utc < starts_at."
      - name: ends_at
        type: datetime
        source: input
        description: "Session end; clock sweep marks the session HELD when current_utc >= ends_at."
      - name: capacity
        type: integer
        source: input
        description: "Maximum BOOKED attendances."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "SCHEDULED until the clock passes ends_at, then HELD."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD}"
      - name: attendance_booked
        type: integer
        source: computed
        description: "Count of CourseAttendance rows with status BOOKED for this session."

  - name: CourseAttendance
    parent: null
    common_fields: true
    fields:
      - name: course_session_id
        type: string
        source: input
        description: "FK -> ProfessionalismCourseSession.id; session being booked."
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: status
        type: enum
        source: system
        description: "BOOKED until the Registrar verifies attendance after the session is HELD."
        default: BOOKED
        constraints: "one of {BOOKED, ATTENDED, NO_SHOW}"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of verification."
        default: null
      - name: verified_by
        type: string
        source: system
        description: "X-User-ID of the verifying Registrar (opaque operator id)."
        default: null

  - name: TransferCreditRequest
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: source_body
        type: enum
        source: input
        description: "Other actuarial body whose credits are offered under mutual recognition."
        constraints: "one of {IFOA, CIA, IAA, CAS, OTHER}"
      - name: claimed_hours
        type: integer
        source: input
        description: "Credit hours claimed from the source body."
        constraints: ">= 1"
      - name: agreement_class
        type: enum
        source: computed
        description: "BILATERAL for {IFOA, CIA}; NON_BILATERAL for {IAA, CAS}; UNRECOGNIZED for {OTHER}."
      - name: granted_hours
        type: integer
        source: system
        description: "Per transfer_equivalency at creation: BILATERAL -> min(claimed, 30); NON_BILATERAL -> min(round_half_up(claimed * 0.5), 15); UNRECOGNIZED -> 0."
      - name: status
        type: enum
        source: system
        description: "Decided synchronously at creation by the mutual-recognition rule: UNRECOGNIZED -> DENIED, else GRANTED."
        constraints: "one of {GRANTED, DENIED}"

  - name: CPDAttestation
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate. Candidate must hold membership_tier ASSOCIATE or FELLOW."
      - name: cycle_year
        type: integer
        source: input
        description: "Calendar-year CPD cycle; at most one attestation per (candidate, cycle_year)."
      - name: attested_hours
        type: number
        source: input
        description: "Self-attested CPD hours (attested variant of compliance)."
        constraints: ">= 0"
      - name: carryover_hours
        type: integer
        source: input
        description: "Hours carried from the prior cycle; only min(carryover_hours, CPD_CARRYOVER_CAP = 10) reduces required_hours."
        default: 0
        constraints: ">= 0"
      - name: required_hours
        type: integer
        source: computed
        description: "Per cpd_required_hours at creation."
      - name: verified_hours
        type: number
        source: system
        description: "Evidence-backed hours recorded by the Registrar at verify (verified variant of compliance)."
        default: null
      - name: status
        type: enum
        source: system
        description: "ATTESTED on creation; VERIFIED when verified_hours >= required_hours; SHORTFALL when verified_hours < required_hours; SHORTFALL -> VERIFIED on a later verify whose verified_hours >= required_hours."
        default: ATTESTED
        constraints: "one of {ATTESTED, VERIFIED, SHORTFALL}"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the latest verification."
        default: null

  - name: DisciplineCase
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; subject of the conduct case."
      - name: charge
        type: string
        source: input
        description: "Professional-conduct charge text."
      - name: severity
        type: integer
        source: input
        description: "Charge severity 1-10 recorded for the file."
        constraints: "1 <= severity <= 10"
      - name: status
        type: enum
        source: system
        description: "FILED until the DisciplineBoard resolves it."
        default: FILED
        constraints: "one of {FILED, RESOLVED}"
      - name: resolution
        type: enum
        source: system
        description: "Board resolution; SUSPENSION requires suspension_days and triggers the suspension cascade; EXPULSION triggers the expulsion cascade."
        default: null
        constraints: "one of {DISMISSED, REPRIMAND, SUSPENSION, EXPULSION, null}"
      - name: suspension_days
        type: integer
        source: system
        description: "Sanction input copied onto the case; suspended_until = resolve time + suspension_days."
        default: null
        constraints: ">= 1 when resolution == SUSPENSION"
      - name: suspended_until
        type: datetime
        source: system
        description: "Copied to Candidate.suspended_until on a SUSPENSION resolution."
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of resolution."
        default: null

  - name: CredentialApplication
    parent: null
    common_fields: true
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; must equal X-User-ID of the acting Candidate."
      - name: credential
        type: enum
        source: input
        description: "Credential applied for."
        constraints: "one of {ASA, FSA}"
      - name: status
        type: enum
        source: system
        description: "Evaluation is synchronous at creation: APPROVED or DENIED_DEFICIENCY. Resubmission after deficiency cure is a new application."
        constraints: "one of {APPROVED, DENIED_DEFICIENCY}"
      - name: deficiency_codes
        type: array
        source: system
        description: "Ordered list of unmet requirements, in canonical order [MISSING_PRELIM_CREDIT, MISSING_VEE_TOPIC, INSUFFICIENT_TOTAL_CREDITS, MISSING_ASA, TRACK_INCOMPLETE, MISSING_PROJECT_PASS, MISSING_PROFESSIONALISM]; empty when APPROVED."
        default: []
      - name: evaluated_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of the synchronous evaluation."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Candidate
    initial_state: "status=ACTIVE, membership_tier=CANDIDATE"
    terminal_states: ["status=EXPELLED"]
    note: "Two parallel state dimensions on one entity: status (standing) and membership_tier (credential ladder) evolve independently."
    transitions:
      - from: "status=ACTIVE"
        to: "status=SUSPENDED"
        trigger: "POST /actuarial/discipline-cases/{id}/sanction with resolution=SUSPENSION"
        actor: DisciplineBoard
        preconditions:
          - "discipline_case.status == FILED and candidate.status == ACTIVE"
        side_effects:
          - "candidate.suspended_until := current_utc + suspension_days; candidate.version += 1"
          - "CASCADE link 1: every ExamRegistration of the candidate with logistics_status in {REGISTERED, WAITLISTED} transitions to CANCELLED with cancel_reason=DISCIPLINE_SUSPENSION"
          - "CASCADE link 2: each such cancellation sets refund_cents := fee_charged_cents (100%, timing-independent) for formerly-REGISTERED rows (WAITLISTED rows with no fee charged get refund 0 / null)"
          - "CASCADE link 3: each freed seat on a window still in REGISTRATION_OPEN triggers waitlist_promotion of the earliest-created WAITLISTED registration on that window (which then has fee_charged_cents computed at promotion time)"
      - from: "status=SUSPENDED"
        to: "status=ACTIVE"
        trigger: "system: POST /actuarial/_clock/set_current_utc sweep when current_utc >= candidate.suspended_until (>= boundary)"
        actor: system
        preconditions:
          - "candidate.status == SUSPENDED and suspended_until <= current_utc"
        side_effects:
          - "candidate.suspended_until := null; candidate.version += 1"
        note: "Completes the ACTIVE -> SUSPENDED -> ACTIVE cycle. Cancelled registrations are NOT restored."
      - from: "status=ACTIVE or SUSPENDED"
        to: "status=EXPELLED"
        trigger: "POST /actuarial/discipline-cases/{id}/sanction with resolution=EXPULSION"
        actor: DisciplineBoard
        preconditions:
          - "discipline_case.status == FILED and candidate.status in {ACTIVE, SUSPENDED}"
        side_effects:
          - "candidate.status := EXPELLED (terminal); candidate.version += 1"
          - "CASCADE: registrations in {REGISTERED, WAITLISTED} -> CANCELLED with cancel_reason=DISCIPLINE_EXPULSION and refund_cents := 0 (fees forfeited); freed seats still trigger waitlist_promotion on REGISTRATION_OPEN windows"
          - "CASCADE: candidate's TrackEnrollment in {ENROLLED, CAPSTONE_ELIGIBLE} -> WITHDRAWN"
      - from: "membership_tier=CANDIDATE"
        to: "membership_tier=ASSOCIATE"
        trigger: "POST /actuarial/credential-applications evaluating ASA to APPROVED"
        actor: Candidate
        preconditions:
          - "credential_application evaluation outcome APPROVED (zero deficiency_codes)"
        side_effects:
          - "candidate.associate_admitted_at := current_utc; candidate.version += 1"
      - from: "membership_tier=ASSOCIATE"
        to: "membership_tier=FELLOW"
        trigger: "POST /actuarial/credential-applications evaluating FSA to APPROVED"
        actor: Candidate
        preconditions:
          - "credential_application evaluation outcome APPROVED (zero deficiency_codes)"
        side_effects:
          - "candidate.fellow_admitted_at := current_utc (fellowship admission); candidate.version += 1"

  - entity: SyllabusVersion
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /actuarial/syllabus-versions/{id}/activate"
        actor: Registrar
        preconditions:
          - "syllabus_version.status == DRAFT"
          - "credit_map keys are exam codes of the currently ACTIVE version (or empty when none is ACTIVE) and credit_map values are exam codes of exams belonging to this version (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "syllabus_version.activated_at := current_utc"
          - "CASCADE link 1: the previously ACTIVE SyllabusVersion (if any) transitions ACTIVE -> RETIRED"
          - "CASCADE link 2: every Exam of the retired version transitions ACTIVE -> RETIRED; every Exam of this version transitions DRAFT -> ACTIVE"
          - "CASCADE link 3: every ExamWindow of a retired exam with status in {SCHEDULED, REGISTRATION_OPEN, REGISTRATION_CLOSED} transitions to CANCELLED"
          - "CASCADE link 4: every ExamRegistration of a cancelled window with logistics_status in {REGISTERED, WAITLISTED} transitions to CANCELLED with cancel_reason=SYLLABUS_RETIREMENT and refund_cents := fee_charged_cents (full refund); NO waitlist promotion fires from a CANCELLED window"
          - "Transition credit: PASS credits on retired exams continue to count via transition_credit_mapping toward the mapped ACTIVE exam"
      - from: ACTIVE
        to: RETIRED
        trigger: "system: activation of another SyllabusVersion (cascade only; no direct endpoint)"
        actor: system
        preconditions:
          - "another syllabus version is being activated"
        side_effects:
          - "exams and windows cascade as listed on the activating version's DRAFT -> ACTIVE transition"

  - entity: Exam
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system: owning SyllabusVersion activates"
        actor: system
        preconditions:
          - "owning syllabus transitions DRAFT -> ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "system: owning SyllabusVersion retires"
        actor: system
        preconditions:
          - "owning syllabus transitions ACTIVE -> RETIRED"
        side_effects:
          - "future windows of this exam are CANCELLED (see SyllabusVersion activation cascade links 3-4)"

  - entity: ExamWindow
    initial_state: SCHEDULED
    terminal_states: [RESULTS_PUBLISHED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: REGISTRATION_OPEN
        trigger: "system: clock sweep when current_utc >= registration_opens_at"
        actor: system
        preconditions:
          - "window.status == SCHEDULED and current_utc >= registration_opens_at"
        side_effects: []
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "system: clock sweep when current_utc >= registration_deadline"
        actor: system
        preconditions:
          - "window.status == REGISTRATION_OPEN and current_utc >= registration_deadline"
        side_effects: []
      - from: REGISTRATION_CLOSED
        to: TESTING
        trigger: "system: clock sweep when current_utc >= testing_starts_at"
        actor: system
        preconditions:
          - "window.status == REGISTRATION_CLOSED and current_utc >= testing_starts_at"
        side_effects: []
      - from: TESTING
        to: SCORING
        trigger: "system: clock sweep when current_utc >= testing_ends_at"
        actor: system
        preconditions:
          - "window.status == TESTING and current_utc >= testing_ends_at"
        side_effects:
          - "every registration with logistics_status == REGISTERED transitions to SAT with sat_at := current_utc (WAITLISTED registrations remain WAITLISTED)"
      - from: SCORING
        to: RESULTS_PUBLISHED
        trigger: "POST /actuarial/pass-mark-settings/{id}/publish on this window's RATIFIED pass mark"
        actor: ExamCommittee
        preconditions:
          - "window.status == SCORING and pass_mark_setting.status == RATIFIED"
        side_effects:
          - "every SAT registration of the window: result := PASS iff scaled_score >= ratified_mark else FAIL; grading_status := RELEASED"
      - from: "SCHEDULED or REGISTRATION_OPEN or REGISTRATION_CLOSED"
        to: CANCELLED
        trigger: "system: owning exam retires (syllabus activation cascade)"
        actor: system
        preconditions:
          - "window.exam.status transitions ACTIVE -> RETIRED"
        side_effects:
          - "registrations in {REGISTERED, WAITLISTED} -> CANCELLED with cancel_reason=SYLLABUS_RETIREMENT and full refund; no waitlist promotion"
    note: "A single clock-set call advances each window directly to its furthest due status as ONE mutation (version increments once per window per sweep), passing through all intermediate states whose thresholds have passed."

  - entity: ExamRegistration
    initial_state: "logistics_status=(REGISTERED|WAITLISTED per capacity), grading_status=PENDING"
    terminal_states: ["logistics_status=CANCELLED", "logistics_status=SAT with grading_status=RELEASED"]
    note: "PARALLEL dimensions: logistics_status (REGISTERED/WAITLISTED/SAT/CANCELLED) and grading_status (PENDING/RELEASED) evolve independently on the same row; a registration may be SAT+PENDING, SAT+RELEASED, CANCELLED+PENDING, etc."
    transitions:
      - from: "(creation)"
        to: "logistics_status=REGISTERED, grading_status=PENDING"
        trigger: "POST /actuarial/exam-registrations when window.seats_held < window.capacity"
        actor: Candidate
        preconditions:
          - "window.status == REGISTRATION_OPEN (ERR_WINDOW_NOT_OPEN otherwise)"
          - "candidate.status == ACTIVE (ERR_CANDIDATE_NOT_ACTIVE)"
          - "prerequisite exam credit held when the exam declares prerequisite_exam_id (ERR_PREREQUISITE_NOT_MET)"
          - "no existing registration of this candidate for this window with logistics_status in {REGISTERED, WAITLISTED} (ERR_DUPLICATE_REGISTRATION)"
        side_effects:
          - "fee_charged_cents computed per registration_fee_cents at the creation timestamp; window.seats_held recomputed (+1)"
      - from: "(creation)"
        to: "logistics_status=WAITLISTED, grading_status=PENDING"
        trigger: "POST /actuarial/exam-registrations when window.seats_held >= window.capacity (boundary: == capacity waitlists)"
        actor: Candidate
        preconditions:
          - "same preconditions as the REGISTERED creation path; capacity overflow is NOT an error"
        side_effects:
          - "no fee charged; fee_charged_cents stays null until promotion"
      - from: "logistics_status=WAITLISTED"
        to: "logistics_status=REGISTERED"
        trigger: "system: waitlist_promotion when a seat is freed while window.status == REGISTRATION_OPEN"
        actor: system
        preconditions:
          - "a cancellation decremented seats_held and this registration is the earliest-created WAITLISTED row for the window (tie-break: candidate.created_at ASC)"
        side_effects:
          - "fee_charged_cents computed per registration_fee_cents at the promotion timestamp"
      - from: "logistics_status=REGISTERED"
        to: "logistics_status=SAT"
        trigger: "system: window sweep TESTING -> SCORING"
        actor: system
        preconditions:
          - "owning window reaches SCORING"
        side_effects:
          - "sat_at := current_utc"
      - from: "logistics_status in {REGISTERED, WAITLISTED}"
        to: "logistics_status=CANCELLED"
        trigger: "POST /actuarial/exam-registrations/{id}/cancel"
        actor: "Candidate (owner) or Registrar"
        preconditions:
          - "logistics_status in {REGISTERED, WAITLISTED} and grading_status == PENDING and window.status in {REGISTRATION_OPEN, REGISTRATION_CLOSED} (ERR_REGISTRATION_NOT_CANCELLABLE otherwise)"
        side_effects:
          - "cancel_reason := CANDIDATE; refund_cents per refund_cents calculation (100% before deadline, 50% at/after deadline while window is REGISTRATION_CLOSED; WAITLISTED rows had no fee -> refund null)"
          - "if the cancelled row was REGISTERED: seats_held recomputed (-1) and waitlist_promotion fires when window.status == REGISTRATION_OPEN"
      - from: "grading_status=PENDING"
        to: "grading_status=RELEASED"
        trigger: "POST /actuarial/pass-mark-settings/{id}/publish"
        actor: ExamCommittee
        preconditions:
          - "registration is SAT and its window is being published"
        side_effects:
          - "result := PASS iff scaled_score >= ratified_mark else FAIL"

  - entity: PassMarkSetting
    initial_state: PROPOSED
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: "(creation)"
        to: PROPOSED
        trigger: "POST /actuarial/exam-windows/{wid}/pass-mark-settings"
        actor: ExamCommittee
        preconditions:
          - "window.status in {REGISTRATION_CLOSED, TESTING, SCORING} (ERR_PASS_MARK_INVALID_STATE otherwise)"
          - "expected_exam_window_version matches window.version (ERR_STALE_WINDOW_VERSION 412)"
        side_effects:
          - "any existing PassMarkSetting of the window in {PROPOSED, RATIFIED} transitions to SUPERSEDED (create-with-supersede)"
          - "window.version += 1"
      - from: PROPOSED
        to: RATIFIED
        trigger: "POST /actuarial/pass-mark-settings/{id}/ratify"
        actor: ExamCommittee
        preconditions:
          - "pass_mark_setting.status == PROPOSED"
        side_effects:
          - "ratified_mark := request value (may differ from proposed_mark)"
      - from: RATIFIED
        to: PUBLISHED
        trigger: "POST /actuarial/pass-mark-settings/{id}/publish"
        actor: ExamCommittee
        preconditions:
          - "pass_mark_setting.status == RATIFIED and window.status == SCORING (ERR_PASS_MARK_INVALID_STATE otherwise)"
        side_effects:
          - "window transitions SCORING -> RESULTS_PUBLISHED; SAT registrations graded and RELEASED per the ExamRegistration machine"
      - from: "PROPOSED or RATIFIED"
        to: SUPERSEDED
        trigger: "system: a new PassMarkSetting is created for the same window"
        actor: system
        preconditions:
          - "a create on the same window succeeds"
        side_effects: []

  - entity: VEECourseSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: "(creation)"
        to: SUBMITTED
        trigger: "POST /actuarial/vee-submissions"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE"
          - "no APPROVED submission exists for (candidate, topic) (ERR_VEE_TOPIC_ALREADY_CREDITED)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /actuarial/vee-submissions/{id}/review with decision=APPROVE"
        actor: AcademicReviewer
        preconditions:
          - "submission.status == SUBMITTED (ERR_VEE_NOT_REVIEWABLE otherwise)"
          - "submission.grade_points >= VEE_GRADE_MIN (2.7) (ERR_VEE_GRADE_BELOW_THRESHOLD otherwise; >= boundary: 2.70 approves)"
        side_effects:
          - "reviewer_note := request note; reviewed_at := current_utc"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /actuarial/vee-submissions/{id}/review with decision=REJECT"
        actor: AcademicReviewer
        preconditions:
          - "submission.status == SUBMITTED"
        side_effects:
          - "reviewer_note := request note; reviewed_at := current_utc; resubmission is a NEW POST /actuarial/vee-submissions for the same topic"

  - entity: TrackEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: "(creation)"
        to: ENROLLED
        trigger: "POST /actuarial/track-enrollments"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE"
          - "candidate.membership_tier in {ASSOCIATE, FELLOW} (ERR_REQUIRES_ASSOCIATE otherwise)"
          - "no existing enrollment of this candidate in {ENROLLED, CAPSTONE_ELIGIBLE} (ERR_ENROLLMENT_ACTIVE_EXISTS)"
        side_effects: []
      - from: ENROLLED
        to: CAPSTONE_ELIGIBLE
        trigger: "system: bubble-up when every non-capstone module of the track has a PASSED attempt under this enrollment"
        actor: system
        preconditions:
          - "modules_passed_count over non-capstone modules == count of the track's non-capstone modules"
        side_effects:
          - "completion_pct recomputed per track_completion_pct"
      - from: CAPSTONE_ELIGIBLE
        to: COMPLETED
        trigger: "system: bubble-up when the track's capstone module attempt is PASSED"
        actor: system
        preconditions:
          - "enrollment.status == CAPSTONE_ELIGIBLE and a PASSED attempt on the capstone module exists under this enrollment"
        side_effects:
          - "completion_pct recomputed"
      - from: "ENROLLED or CAPSTONE_ELIGIBLE"
        to: WITHDRAWN
        trigger: "system: expulsion cascade from Candidate"
        actor: system
        preconditions:
          - "candidate transitions to EXPELLED"
        side_effects: []

  - entity: ModuleAttempt
    initial_state: IN_PROGRESS
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: "(creation)"
        to: IN_PROGRESS
        trigger: "POST /actuarial/module-attempts"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE (ERR_CANDIDATE_NOT_ACTIVE)"
          - "enrollment.status in {ENROLLED, CAPSTONE_ELIGIBLE} (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "module.track_code == enrollment.track_code (ERR_INVALID_REQUEST)"
          - "module.is_capstone == false OR enrollment.status == CAPSTONE_ELIGIBLE (ERR_MODULE_SEQUENCE_LOCKED)"
          - "for non-capstone module with sequence_index k > 1: a PASSED attempt exists on the same track's module with sequence_index k-1 under this enrollment (ERR_MODULE_SEQUENCE_LOCKED)"
          - "cooldown: no FAILED attempt on the same module under this enrollment with submitted_at + module.cooldown_days > current_utc (ERR_MODULE_COOLDOWN_ACTIVE; boundary: current_utc == submitted_at + cooldown_days is ALLOWED, >= semantics)"
        side_effects:
          - "attempt_number := 1 + prior attempts on (enrollment, module)"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /actuarial/module-attempts/{id}/submit with score >= module.passing_score (>= boundary)"
        actor: Candidate
        preconditions:
          - "attempt.status == IN_PROGRESS (ERR_INVALID_REQUEST otherwise — a decided attempt is terminal)"
        side_effects:
          - "score := request score; submitted_at := current_utc"
          - "BUBBLE-UP link 1: enrollment.modules_passed_count recomputed"
          - "BUBBLE-UP link 2: if all non-capstone modules passed -> enrollment ENROLLED -> CAPSTONE_ELIGIBLE; if this was the capstone and enrollment was CAPSTONE_ELIGIBLE -> enrollment -> COMPLETED; completion_pct recomputed"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /actuarial/module-attempts/{id}/submit with score < module.passing_score"
        actor: Candidate
        preconditions:
          - "attempt.status == IN_PROGRESS"
        side_effects:
          - "score := request score; submitted_at := current_utc (starts the retake cooldown)"

  - entity: ProjectAssessment
    initial_state: SUBMITTED
    terminal_states: [DECIDED]
    note: "Fork/join (branching): the second grade either joins to DECIDED (consensus) or forks to SPLIT; only the SPLIT branch runs the resolver leg. Segregation of duties: each grading call's Grader X-User-ID must not already appear in grader_ids (ERR_GRADER_CONFLICT)."
    transitions:
      - from: "(creation)"
        to: SUBMITTED
        trigger: "POST /actuarial/project-assessments"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE"
          - "enrollment exists for the candidate and enrollment.status in {CAPSTONE_ELIGIBLE, COMPLETED} (ERR_PROJECT_REQUIRES_CAPSTONE otherwise)"
        side_effects: []
      - from: SUBMITTED
        to: IN_REVIEW
        trigger: "POST /actuarial/project-assessments/{id}/grades (first grade)"
        actor: Grader
        preconditions:
          - "project.status in {SUBMITTED, IN_REVIEW, SPLIT} (ERR_PROJECT_NOT_GRADABLE otherwise)"
          - "acting grader id not in grader_ids (ERR_GRADER_CONFLICT)"
        side_effects:
          - "grader_ids += [grader]; scores += [score]"
      - from: IN_REVIEW
        to: DECIDED
        trigger: "POST /actuarial/project-assessments/{id}/grades (second grade) when |g1 - g2| <= CONSENSUS_TOLERANCE (10)"
        actor: Grader
        preconditions:
          - "same grading preconditions"
        side_effects:
          - "final_score := round_half_up((g1 + g2) / 2, 0); result := PASS iff final_score >= PROJECT_PASS_SCORE (70)"
      - from: IN_REVIEW
        to: SPLIT
        trigger: "POST /actuarial/project-assessments/{id}/grades (second grade) when |g1 - g2| > 10"
        actor: Grader
        preconditions:
          - "same grading preconditions"
        side_effects:
          - "scores recorded; no final_score yet"
      - from: SPLIT
        to: DECIDED
        trigger: "POST /actuarial/project-assessments/{id}/grades (third, distinct grader)"
        actor: Grader
        preconditions:
          - "same grading preconditions (third grader must differ from BOTH prior graders)"
        side_effects:
          - "final_score := median(g1, g2, r); result := PASS iff final_score >= 70"

  - entity: ProfessionalismCourseSession
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "system: clock sweep when current_utc >= ends_at"
        actor: system
        preconditions:
          - "session.status == SCHEDULED and current_utc >= ends_at"
        side_effects: []

  - entity: CourseAttendance
    initial_state: BOOKED
    terminal_states: [ATTENDED, NO_SHOW]
    transitions:
      - from: "(creation)"
        to: BOOKED
        trigger: "POST /actuarial/course-attendances"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE"
          - "candidate.membership_tier in {ASSOCIATE, FELLOW} — the professionalism course is gated to this stage (ERR_REQUIRES_ASSOCIATE)"
          - "session.status == SCHEDULED and current_utc < session.starts_at (ERR_SESSION_NOT_BOOKABLE)"
          - "session.attendance_booked < session.capacity (ERR_SESSION_FULL; boundary: == capacity rejects)"
          - "no other BOOKED/ATTENDED attendance of this candidate whose session starts on the SAME CALENDAR DATE (UTC) as this session's starts_at (ERR_SESSION_SAME_DAY_CONFLICT; date-equality semantics, NOT interval overlap)"
        side_effects:
          - "session.attendance_booked recomputed (+1)"
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /actuarial/course-attendances/{id}/verify with outcome=ATTENDED"
        actor: Registrar
        preconditions:
          - "attendance.status == BOOKED and session.status == HELD (ERR_ATTENDANCE_NOT_VERIFIABLE otherwise)"
        side_effects:
          - "verified_at := current_utc; verified_by := acting Registrar X-User-ID"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /actuarial/course-attendances/{id}/verify with outcome=NO_SHOW"
        actor: Registrar
        preconditions:
          - "attendance.status == BOOKED and session.status == HELD"
        side_effects:
          - "verified_at := current_utc; verified_by := acting Registrar X-User-ID"

  - entity: TransferCreditRequest
    initial_state: "(decided at creation)"
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: "(creation)"
        to: "GRANTED or DENIED"
        trigger: "POST /actuarial/transfer-credit-requests"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE"
        side_effects:
          - "agreement_class and granted_hours computed per transfer_equivalency; status := DENIED iff agreement_class == UNRECOGNIZED else GRANTED"
          - "candidate.transfer_credit_hours and total_credit_hours recomputed on GRANTED"

  - entity: CPDAttestation
    initial_state: ATTESTED
    terminal_states: [VERIFIED]
    transitions:
      - from: "(creation)"
        to: ATTESTED
        trigger: "POST /actuarial/cpd-attestations"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE"
          - "candidate.membership_tier in {ASSOCIATE, FELLOW} (ERR_CPD_NOT_MEMBER)"
          - "no existing attestation for (candidate, cycle_year) (ERR_CPD_CYCLE_DUPLICATE)"
        side_effects:
          - "required_hours computed per cpd_required_hours"
      - from: ATTESTED
        to: VERIFIED
        trigger: "POST /actuarial/cpd-attestations/{id}/verify with verified_hours >= required_hours (>= boundary)"
        actor: Registrar
        preconditions:
          - "attestation.status in {ATTESTED, SHORTFALL} (ERR_CPD_NOT_VERIFIABLE otherwise)"
        side_effects:
          - "verified_hours := request value; verified_at := current_utc"
      - from: ATTESTED
        to: SHORTFALL
        trigger: "POST /actuarial/cpd-attestations/{id}/verify with verified_hours < required_hours"
        actor: Registrar
        preconditions:
          - "attestation.status in {ATTESTED, SHORTFALL}"
        side_effects:
          - "verified_hours := request value; verified_at := current_utc"
      - from: SHORTFALL
        to: VERIFIED
        trigger: "POST /actuarial/cpd-attestations/{id}/verify with a new verified_hours >= required_hours (cure cycle)"
        actor: Registrar
        preconditions:
          - "attestation.status == SHORTFALL"
        side_effects:
          - "verified_hours := new value; verified_at := current_utc"

  - entity: DisciplineCase
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: "(creation)"
        to: FILED
        trigger: "POST /actuarial/discipline-cases"
        actor: Registrar
        preconditions:
          - "candidate exists and candidate.status != EXPELLED (ERR_CANDIDATE_NOT_ACTIVE)"
        side_effects: []
      - from: FILED
        to: RESOLVED
        trigger: "POST /actuarial/discipline-cases/{id}/sanction"
        actor: DisciplineBoard
        preconditions:
          - "case.status == FILED (ERR_DISCIPLINE_ALREADY_RESOLVED)"
          - "resolution == SUSPENSION requires suspension_days >= 1 and candidate.status == ACTIVE; resolution == EXPULSION requires candidate.status in {ACTIVE, SUSPENDED} (ERR_INVALID_REQUEST / ERR_CANDIDATE_NOT_ACTIVE)"
        side_effects:
          - "resolution, suspension_days, resolved_at recorded"
          - "resolution == SUSPENSION -> Candidate ACTIVE -> SUSPENDED cascade (see Candidate machine; suspended_until := current_utc + suspension_days)"
          - "resolution == EXPULSION -> Candidate -> EXPELLED cascade (registrations cancelled with refund 0; enrollment WITHDRAWN)"
          - "resolution in {DISMISSED, REPRIMAND} -> no candidate mutation"

  - entity: CredentialApplication
    initial_state: "(evaluated at creation)"
    terminal_states: [APPROVED, DENIED_DEFICIENCY]
    transitions:
      - from: "(creation)"
        to: "APPROVED or DENIED_DEFICIENCY"
        trigger: "POST /actuarial/credential-applications"
        actor: Candidate
        preconditions:
          - "candidate.status == ACTIVE (ERR_CANDIDATE_NOT_ACTIVE)"
          - "expected_candidate_version matches candidate.version (ERR_STALE_CANDIDATE_VERSION 412)"
          - "credential not already held: ASA when tier in {ASSOCIATE, FELLOW}, or FSA when tier == FELLOW (ERR_CREDENTIAL_ALREADY_HELD)"
        side_effects:
          - "evaluation per credential_evaluation; deficiency_codes recorded in canonical order; evaluated_at := current_utc"
          - "candidate.last_evaluated_at := current_utc; candidate.version += 1 (even when DENIED)"
          - "APPROVED -> membership_tier advances (CANDIDATE -> ASSOCIATE or ASSOCIATE -> FELLOW) and the matching admitted_at is stamped"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: pass-mark-create-stale-window
    parent_entity: ExamWindow
    write_endpoint: "POST /actuarial/exam-windows/{wid}/pass-mark-settings"
    occ_field: expected_exam_window_version
    description: |
      Creating a PassMarkSetting against an ExamWindow whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another committee writer has just created a setting
      (which legitimately supersedes the prior PROPOSED/RATIFIED one per the
      PassMarkSetting machine) — or a clock sweep advanced the window — so
      the current writer's view of the window is stale.
    error_id: ERR_STALE_WINDOW_VERSION
    http_status: 412
  - rule_id: credential-application-stale-candidate
    parent_entity: Candidate
    write_endpoint: "POST /actuarial/credential-applications"
    occ_field: expected_candidate_version
    description: |
      Creating a CredentialApplication against a Candidate whose version has
      advanced since the client last observed it is rejected. A successful
      application always bumps Candidate.version (last_evaluated_at stamp,
      plus tier advancement on APPROVED), so a second application carrying
      the first writer's observed version is stale — e.g. a candidate whose
      ASA was just approved must re-read their record before filing for FSA.
    error_id: ERR_STALE_CANDIDATE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: scaled_score
    trigger: "on record-score entry and whenever projected_result/result is computed"
    algorithm: threshold
    formula: |
      scaled_score = round_half_up(raw_score / MAX_RAW_SCORE * 10, 1)
      PASS iff scaled_score >= pass_mark   (boundary: equality passes)
    input_set: "ExamRegistration rows with logistics_status == SAT and raw_score set; PASS/FAIL applies the window's PassMarkSetting mark"
    constants:
      MAX_RAW_SCORE: 60
    precision: "1 decimal place, round_half_up"
    variants:
      - name: projected
        when: "window not yet RESULTS_PUBLISHED; grading_status == PENDING"
        difference: "uses the PROJECTION mark: ratified_mark if the window's latest non-SUPERSEDED PassMarkSetting is RATIFIED, else its proposed_mark; drives projected_result (null once RELEASED)"
      - name: official
        when: "pass-mark publish"
        difference: "uses the PUBLISHED setting's ratified_mark; drives the immutable result field"

  - name: registration_fee_cents
    trigger: "ExamRegistration creation (REGISTERED path) and waitlist promotion"
    algorithm: tiered_pricing
    formula: |
      late = (creation_time >= window.registration_deadline - LATE_FEE_WINDOW_DAYS)
      subtotal = window.base_fee_cents + (late ? window.late_surcharge_cents : 0)
      processing_cents = round_half_up(subtotal * PROCESSING_RATE)   # to whole cents
      fee_charged_cents = subtotal + processing_cents
      PINNED ROUNDING ORDER: processing is computed ONCE on the summed subtotal,
      rounded half-up to whole cents, then added. The alternative order
      (rounding each component's share of processing separately, then summing)
      is NOT used and can differ by one cent.
    input_set: "the ExamWindow row; the creation/promotion timestamp"
    constants:
      LATE_FEE_WINDOW_DAYS: 14
      PROCESSING_RATE: 0.015
    precision: "whole cents, round_half_up"

  - name: refund_cents
    trigger: "ExamRegistration cancellation (any cancel_reason)"
    algorithm: threshold
    formula: |
      if cancel_reason == DISCIPLINE_EXPULSION: refund = 0
      elif cancel_reason in {DISCIPLINE_SUSPENSION, SYLLABUS_RETIREMENT}: refund = fee_charged_cents
      elif cancel_reason == CANDIDATE:
        if cancel_time < window.registration_deadline: refund = fee_charged_cents
        else: refund = round_half_up(fee_charged_cents * 0.5)
      (boundary: cancel at exactly the deadline -> 50%; WAITLISTED rows have fee null -> refund null)
    input_set: "the cancelled ExamRegistration, its window, the cancellation timestamp"
    constants:
      LATE_REFUND_RATIO: 0.5
    precision: "whole cents, round_half_up"

  - name: waitlist_promotion
    trigger: "after any cancellation that frees a seat (REGISTERED row cancelled) while window.status == REGISTRATION_OPEN"
    algorithm: aggregation
    formula: |
      candidates = registrations r where r.exam_window_id == window.id
                   and r.logistics_status == WAITLISTED
      promote the row with earliest r.created_at; tie-break: the candidate's
      created_at ASC (never id). If candidates is empty, no-op.
      Promoted row: logistics_status := REGISTERED; fee_charged_cents computed
      per registration_fee_cents at the promotion timestamp.
    input_set: "WAITLISTED registrations of the window only"
    constants: {}
    precision: "n/a"

  - name: cpd_required_hours
    trigger: "CPDAttestation creation"
    algorithm: threshold
    formula: |
      admitted_in_cycle = (year(candidate.associate_admitted_at) == cycle_year)
      if admitted_in_cycle:
        months_remaining = 13 - month(candidate.associate_admitted_at)   # admission month counts in full
        base = ceil(CPD_BASE_HOURS * months_remaining / 12)
      else:
        base = CPD_BASE_HOURS
      required_hours = max(0, base - min(carryover_hours, CPD_CARRYOVER_CAP))
    input_set: "the candidate's associate_admitted_at; request cycle_year and carryover_hours"
    constants:
      CPD_BASE_HOURS: 30
      CPD_CARRYOVER_CAP: 10
    precision: "whole hours, ceil on proration"

  - name: cpd_compliance
    trigger: "CPDAttestation verify"
    algorithm: threshold
    formula: |
      attested_compliant = (attested_hours >= required_hours)   # self-report variant
      verified_compliant = (verified_hours >= required_hours)   # evidence variant; drives status
      status := VERIFIED iff verified_compliant else SHORTFALL
    input_set: "the CPDAttestation row"
    constants: {}
    precision: "hours compared as given (>= boundary)"
    variants:
      - name: attested
        when: "between creation and first verify"
        difference: "provisional standing uses attested_hours (self-reported); never changes status"
      - name: verified
        when: "on Registrar verify"
        difference: "official standing uses verified_hours (evidence-backed); alone drives VERIFIED/SHORTFALL"

  - name: transfer_equivalency
    trigger: "TransferCreditRequest creation"
    algorithm: tiered_pricing
    formula: |
      agreement_class = BILATERAL if source_body in {IFOA, CIA}
                        else NON_BILATERAL if source_body in {IAA, CAS}
                        else UNRECOGNIZED
      BILATERAL:      granted_hours = min(claimed_hours, BILATERAL_CAP);       status = GRANTED
      NON_BILATERAL:  granted_hours = min(round_half_up(claimed_hours * NON_BILATERAL_RATIO), NON_BILATERAL_CAP); status = GRANTED
      UNRECOGNIZED:   granted_hours = 0;                                        status = DENIED
    input_set: "the request row"
    constants:
      BILATERAL_CAP: 30
      NON_BILATERAL_CAP: 15
      NON_BILATERAL_RATIO: 0.5
    precision: "whole hours, round_half_up"

  - name: credit_hour_totals
    trigger: "recomputed on read of Candidate and on every mutation touching registrations, syllabus versions, or transfer requests"
    algorithm: aggregation
    formula: |
      earned_exam_credit_hours = sum of credit_hours over DISTINCT exams with a held
        PASS credit, where a PASS on a RETIRED exam counts toward its mapped ACTIVE
        exam (transition_credit_mapping) and is NOT double-counted
      transfer_credit_hours = sum of granted_hours over GRANTED TransferCreditRequests
      total_credit_hours = earned_exam_credit_hours + transfer_credit_hours
    input_set: "ExamRegistration rows with result == PASS; GRANTED TransferCreditRequests; the ACTIVE syllabus credit_map chain"
    constants: {}
    precision: "whole hours"

  - name: transition_credit_mapping
    trigger: "SyllabusVersion activation; prerequisite checks; credit_hour_totals"
    algorithm: topological
    formula: |
      A PASS credit earned on exam E under a version that later RETIRES confers
      credit on exam E' = credit_map[E.exam_code] of the version whose activation
      retired E's version, when such a key exists; otherwise the credit remains a
      historical credit on E itself (counts toward totals, satisfies only E).
      Mapping chains across multiple retirements are evaluated in version
      activation order (chronological): a v1 credit mapped into a v2 exam is
      treated as a v2 credit when v3 activates and may map again.
    input_set: "PASS credits of the candidate; the sequence of SyllabusVersion rows in activated_at order"
    constants: {}
    precision: "n/a"

  - name: track_completion_pct
    trigger: "recomputed on read of TrackEnrollment and on every ModuleAttempt/ProjectAssessment mutation"
    algorithm: weighted_scoring
    formula: |
      # PINNED EVALUATION ORDER (resolves the circular-looking dependency):
      # phase 1 (gate): eligibility uses ONLY non-capstone module passes —
      #   capstone_eligible = (passed non-capstone modules == all non-capstone modules of track)
      # phase 2 (reported percentage):
      #   completion_pct = round_half_up(100 * (2*noncapstone_passed + 3*capstone_passed + 2*project_passed)
      #                                  / (2*noncapstone_total + 3 + 2), 2)
      #   where capstone_passed in {0,1} and project_passed in {0,1}
      # The capstone gate therefore never depends on the percentage that itself
      # includes the capstone.
    input_set: "modules of the enrollment's track; PASSED attempts under the enrollment; the candidate's project for the enrollment"
    constants:
      NONCAPSTONE_WEIGHT: 2
      CAPSTONE_WEIGHT: 3
      PROJECT_WEIGHT: 2
    precision: "2 decimal places, round_half_up"

  - name: consensus_grade
    trigger: "ProjectAssessment grading calls"
    algorithm: weighted_scoring
    formula: |
      after grades g1, g2:
        if |g1 - g2| <= CONSENSUS_TOLERANCE:  final = round_half_up((g1 + g2) / 2, 0); DECIDED
        else:                                 SPLIT (no final yet)
      after resolver grade r (distinct grader):
        final = median(g1, g2, r); DECIDED
      result = PASS iff final >= PROJECT_PASS_SCORE
    input_set: "ordered scores of the assessment"
    constants:
      CONSENSUS_TOLERANCE: 10
      PROJECT_PASS_SCORE: 70
    precision: "whole points, round_half_up on the mean"

  - name: module_retake_cooldown
    trigger: "ModuleAttempt creation"
    algorithm: threshold
    formula: |
      blocked iff exists FAILED attempt on same (enrollment, module) with
        submitted_at + module.cooldown_days > current_utc
      boundary: current_utc == submitted_at + cooldown_days is ALLOWED (strict > blocks)
    input_set: "FAILED attempts on the same module under the same enrollment"
    constants:
      DEFAULT_COOLDOWN_DAYS: 14
    precision: "datetime comparison"

  - name: credential_evaluation
    trigger: "CredentialApplication creation (synchronous)"
    algorithm: constraint_propagation
    formula: |
      For credential == ASA, collect (in canonical order):
        MISSING_PRELIM_CREDIT      if any is_prelim exam of the ACTIVE syllabus lacks a credit
                                   (direct PASS or mapped per transition_credit_mapping);
                                   ALSO emitted when no syllabus version is ACTIVE at all
        MISSING_VEE_TOPIC          if any of {ECONOMICS, CORPORATE_FINANCE, APPLIED_STATISTICS}
                                   lacks an APPROVED VEECourseSubmission
        INSUFFICIENT_TOTAL_CREDITS if earned_exam_credit_hours
                                   + min(transfer_credit_hours, ASA_TRANSFER_CREDIT_CAP)
                                   < ASA_MIN_TOTAL_CREDITS
      For credential == FSA, collect (in canonical order):
        MISSING_ASA                if membership_tier == CANDIDATE
        TRACK_INCOMPLETE           if no TrackEnrollment with status == COMPLETED
        MISSING_PROJECT_PASS       if no ProjectAssessment with result == PASS
        MISSING_PROFESSIONALISM    if no CourseAttendance with status == ATTENDED
      APPROVED iff the collected list is empty; else DENIED_DEFICIENCY with the list.
    input_set: "the candidate's registrations, VEE submissions, enrollments, projects, attendances, transfer requests, and the ACTIVE syllabus"
    constants:
      ASA_MIN_TOTAL_CREDITS: 10
      ASA_TRANSFER_CREDIT_CAP: 15
    precision: "n/a"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID header present except for role Anonymous"
    error_id: ERR_MISSING_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body schema (structural gate, 400): required fields present, types correct, enum values in range, conditional requirements met (e.g. suspension_days required iff resolution == SUSPENSION); exam prerequisite graph acyclic and same-version; credit_map keys/values resolvable at syllabus activation; UNKNOWN body fields are IGNORED (not rejected), including attempts to set system/computed fields; window date ordering; clock monotonicity"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path parameters resolve, left to right (candidate, syllabus, exam, window, registration, pass-mark, submission, attempt, project, session, attendance, attestation, case)"
    error_id: "ERR_*_NOT_FOUND (per resource)"
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "Ownership: for Candidate-scoped endpoints, the resource's candidate_id (or the path candidate id) equals X-User-ID; Grader endpoints have no ownership restriction beyond segregation"
    error_id: ERR_FORBIDDEN_OWNER
    http_status: 403
    applies_to: "all Candidate-role endpoints touching a specific candidate's resources"
  - priority: 6
    category: existence
    check: "Body foreign keys resolve (exam_id, syllabus_version_id, prerequisite_exam_id, exam_window_id, module_id, track_enrollment_id, course_session_id)"
    error_id: "ERR_*_NOT_FOUND (per referenced resource)"
    http_status: 404
    applies_to: "creation endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_exam_window_version == window.version on pass-mark creation; expected_candidate_version == candidate.version on credential application"
    error_id: "ERR_STALE_WINDOW_VERSION | ERR_STALE_CANDIDATE_VERSION"
    http_status: 412
    applies_to: ["POST /actuarial/exam-windows/{wid}/pass-mark-settings", "POST /actuarial/credential-applications"]
  - priority: 8
    category: state
    check: "Target/parent state preconditions: window REGISTRATION_OPEN for registration; enrollment active for attempts; pass-mark/window states for propose-ratify-publish; submission SUBMITTED for review; project gradable; session bookable/held; attestation verifiable; case FILED; syllabus DRAFT for activation; exam ACTIVE for window creation; application credential not held"
    error_id: "ERR_WINDOW_NOT_OPEN | ERR_ENROLLMENT_NOT_ACTIVE | ERR_PASS_MARK_INVALID_STATE | ERR_VEE_NOT_REVIEWABLE | ERR_PROJECT_NOT_GRADABLE | ERR_SESSION_NOT_BOOKABLE | ERR_ATTENDANCE_NOT_VERIFIABLE | ERR_CPD_NOT_VERIFIABLE | ERR_DISCIPLINE_ALREADY_RESOLVED | ERR_REGISTRATION_NOT_CANCELLABLE | ERR_SYLLABUS_ACTIVATION_INVALID | ERR_EXAM_NOT_ACTIVE | ERR_CREDENTIAL_ALREADY_HELD"
    http_status: 422
    applies_to: "action endpoints"
  - priority: 9
    category: business_safety
    check: "Standing/compliance hold: candidate.status == ACTIVE for registrations, VEE submissions, enrollments, attempts, projects, attendances, transfers, attestations, applications; SUSPENSION sanction requires ACTIVE, EXPULSION allows ACTIVE or SUSPENDED"
    error_id: ERR_CANDIDATE_NOT_ACTIVE
    http_status: 422
    applies_to: "all candidate-initiated writes and discipline sanction"
  - priority: 10
    category: business_constraint
    check: "Uniqueness/graph gates: duplicate active registration per (candidate, window); VEE topic already credited; one active enrollment per candidate; one attestation per (candidate, cycle_year); exam prerequisite credit held; module sequence gate; project requires CAPSTONE_ELIGIBLE+; ASA/FSA tier gates (ERR_REQUIRES_ASSOCIATE, ERR_CPD_NOT_MEMBER); grader segregation (ERR_GRADER_CONFLICT)"
    error_id: "ERR_DUPLICATE_REGISTRATION | ERR_VEE_TOPIC_ALREADY_CREDITED | ERR_ENROLLMENT_ACTIVE_EXISTS | ERR_CPD_CYCLE_DUPLICATE | ERR_PREREQUISITE_NOT_MET | ERR_MODULE_SEQUENCE_LOCKED | ERR_PROJECT_REQUIRES_CAPSTONE | ERR_REQUIRES_ASSOCIATE | ERR_CPD_NOT_MEMBER | ERR_GRADER_CONFLICT"
    http_status: "409 for uniqueness conflicts (first four); 422 for gate violations (rest) — see error catalog"
    applies_to: "creation and grading endpoints"
  - priority: 11
    category: business_temporal
    check: "Time windows: module retake cooldown; exam-window testing-interval overlap for the same exam (half-open, adjacency allowed); course same-calendar-day conflict (date equality); session starts_at in future for booking"
    error_id: "ERR_MODULE_COOLDOWN_ACTIVE | ERR_WINDOW_SCHEDULE_CONFLICT | ERR_SESSION_SAME_DAY_CONFLICT | ERR_SESSION_NOT_BOOKABLE"
    http_status: "422 for cooldown/bookability; 409 for the two conflict errors — see error catalog"
    applies_to: ["POST /actuarial/module-attempts", "POST /actuarial/exam-windows", "POST /actuarial/course-attendances"]
  - priority: 12
    category: business_fiscal
    check: "Capacity: session attendance_booked < capacity (== capacity rejects). Exam-window capacity overflow is NOT an error — it waitlists."
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: ["POST /actuarial/course-attendances"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/actuarial/_clock/set_current_utc"
    description: "Sets the logical clock (test-driving endpoint). Startup default: the clock reads exactly 2026-09-01T00:00:00Z before any set call and NEVER falls back to wall-clock time. The clock is monotonic: setting an earlier timestamp than the current one is rejected with ERR_INVALID_REQUEST. Each set runs the ops-run sweep as a single mutation per affected entity: windows advance to their furthest due status (auto-SAT at SCORING), sessions past ends_at become HELD, SUSPENDED candidates with suspended_until <= current_utc return to ACTIVE. A set that changes nothing performs no mutations (versions unchanged, all response counters zero)."
    roles: [Registrar]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, windows_advanced: integer, registrations_marked_sat: integer, sessions_held: integer, suspensions_lifted: integer }"
    side_effects: ["window/session/suspension sweeps per state machines"]

  - method: POST
    path: "/actuarial/candidates"
    description: "Register a new candidate (self-service)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/actuarial/candidates/{id}"
    description: "Read a candidate record including computed credit totals (candidate record maintenance). Candidate role restricted to own record."
    roles: [Candidate, Registrar]
    code: 200
    input: []
    output: Candidate
    side_effects: []

  - method: POST
    path: "/actuarial/syllabus-versions"
    description: "Create a syllabus edition in DRAFT with its transition credit_map."
    roles: [Registrar]
    code: 201
    input: [version_code, "credit_map?"]
    output: SyllabusVersion
    side_effects: []

  - method: POST
    path: "/actuarial/syllabus-versions/{id}/activate"
    description: "Activate a DRAFT syllabus; retires the current ACTIVE one and runs the retirement cascade + credit mapping."
    roles: [Registrar]
    code: 200
    input: []
    output: SyllabusVersion
    side_effects: ["syllabus/exam/window/registration cascade per state machines"]

  - method: GET
    path: "/actuarial/syllabus-versions/{id}"
    description: "Read one syllabus version (status, credit_map, activated_at)."
    roles: [Registrar, ExamCommittee]
    code: 200
    input: []
    output: SyllabusVersion
    side_effects: []

  - method: POST
    path: "/actuarial/exams"
    description: "Create an exam under a syllabus version (DRAFT until activation)."
    roles: [Registrar]
    code: 201
    input: [exam_code, title, credit_hours, syllabus_version_id, "is_prelim?", "prerequisite_exam_id?"]
    output: Exam
    side_effects: []

  - method: GET
    path: "/actuarial/exams/{id}"
    description: "Read one exam."
    roles: [Registrar, Candidate, ExamCommittee]
    code: 200
    input: []
    output: Exam
    side_effects: []

  - method: GET
    path: "/actuarial/exams"
    description: "List exams with filters. Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Registrar, Candidate, ExamCommittee]
    code: 200
    input: ["syllabus_version_id?", "prerequisite_exam_id?", "status?", "limit?", "offset?"]
    output: "Exam[]"
    side_effects: []

  - method: POST
    path: "/actuarial/exam-windows"
    description: "Schedule a computer-based testing window for an ACTIVE exam; testing interval must not overlap another window of the same exam (half-open [testing_starts_at, testing_ends_at); adjacency allowed)."
    roles: [Registrar]
    code: 201
    input: [exam_id, window_code, registration_opens_at, registration_deadline, testing_starts_at, testing_ends_at, capacity, base_fee_cents, "late_surcharge_cents?"]
    output: ExamWindow
    side_effects: []

  - method: GET
    path: "/actuarial/exam-windows/{id}"
    description: "Read one window (includes version for OCC and computed seats_held/waitlist_count)."
    roles: [Registrar, Candidate, ExamCommittee]
    code: 200
    input: []
    output: ExamWindow
    side_effects: []

  - method: GET
    path: "/actuarial/exam-windows"
    description: "List windows with filters. Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Registrar, Candidate, ExamCommittee]
    code: 200
    input: ["exam_id?", "status?", "limit?", "offset?"]
    output: "ExamWindow[]"
    side_effects: []

  - method: POST
    path: "/actuarial/exam-registrations"
    description: "Register the acting candidate for a window; capacity overflow waitlists instead of failing."
    roles: [Candidate]
    code: 201
    input: [exam_window_id]
    output: ExamRegistration
    side_effects: ["fee computation; seats_held recompute"]

  - method: POST
    path: "/actuarial/exam-registrations/{id}/cancel"
    description: "Cancel a cancellable registration; computes refund and fires waitlist promotion when a seat frees on a REGISTRATION_OPEN window."
    roles: [Candidate, Registrar]
    code: 200
    input: []
    output: ExamRegistration
    side_effects: ["refund_cents calculation", "waitlist_promotion"]

  - method: POST
    path: "/actuarial/exam-registrations/{id}/record-score"
    description: "ExamCommittee enters the raw score for a SAT registration while its window is SCORING."
    roles: [ExamCommittee]
    code: 200
    input: [raw_score]
    output: ExamRegistration
    side_effects: ["scaled_score recomputed", "projected_result refresh"]

  - method: GET
    path: "/actuarial/candidates/{id}/registrations"
    description: "List the candidate's registrations (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["logistics_status?", "limit?", "offset?"]
    output: "ExamRegistration[]"
    side_effects: []

  - method: GET
    path: "/actuarial/exam-windows/{id}/registrations"
    description: "List a window's registrations (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Registrar, ExamCommittee]
    code: 200
    input: ["logistics_status?", "limit?", "offset?"]
    output: "ExamRegistration[]"
    side_effects: []

  - method: POST
    path: "/actuarial/exam-windows/{wid}/pass-mark-settings"
    description: "Committee proposes a pass mark for the window; supersedes any non-PUBLISHED setting. OCC: expected_exam_window_version must match."
    roles: [ExamCommittee]
    code: 201
    input: [proposed_mark, expected_exam_window_version]
    output: PassMarkSetting
    side_effects: ["supersedes prior PROPOSED/RATIFIED setting", "increments ExamWindow.version by 1"]

  - method: POST
    path: "/actuarial/pass-mark-settings/{id}/ratify"
    description: "Ratify a PROPOSED pass mark; ratified_mark may differ from proposed_mark."
    roles: [ExamCommittee]
    code: 200
    input: [ratified_mark]
    output: PassMarkSetting
    side_effects: []

  - method: POST
    path: "/actuarial/pass-mark-settings/{id}/publish"
    description: "Publish a RATIFIED mark: grades all SAT registrations of the window (result + RELEASED) and advances the window to RESULTS_PUBLISHED."
    roles: [ExamCommittee]
    code: 200
    input: []
    output: PassMarkSetting
    side_effects: ["scaled_score threshold grading for every SAT registration", "window SCORING -> RESULTS_PUBLISHED"]

  - method: GET
    path: "/actuarial/exam-windows/{id}/pass-mark-settings"
    description: "List pass-mark settings of a window (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Registrar, ExamCommittee]
    code: 200
    input: ["limit?", "offset?"]
    output: "PassMarkSetting[]"
    side_effects: []

  - method: POST
    path: "/actuarial/vee-submissions"
    description: "Submit university coursework for VEE transcript review."
    roles: [Candidate]
    code: 201
    input: [topic, university, course_title, grade_points]
    output: VEECourseSubmission
    side_effects: []

  - method: POST
    path: "/actuarial/vee-submissions/{id}/review"
    description: "AcademicReviewer approves or rejects a SUBMITTED submission; approval requires grade_points >= 2.7."
    roles: [AcademicReviewer]
    code: 200
    input: [decision, "reviewer_note?"]
    output: VEECourseSubmission
    side_effects: ["status transition; stamps reviewer_note/reviewed_at"]

  - method: GET
    path: "/actuarial/candidates/{id}/vee-submissions"
    description: "List a candidate's VEE submissions (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, AcademicReviewer, Registrar]
    code: 200
    input: ["topic?", "status?", "limit?", "offset?"]
    output: "VEECourseSubmission[]"
    side_effects: []

  - method: POST
    path: "/actuarial/track-enrollments"
    description: "Select a fellowship track; requires ASSOCIATE or FELLOW tier."
    roles: [Candidate]
    code: 201
    input: [track_code]
    output: TrackEnrollment
    side_effects: []

  - method: GET
    path: "/actuarial/candidates/{id}/track-enrollments"
    description: "List a candidate's track enrollments (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TrackEnrollment[]"
    side_effects: []

  - method: POST
    path: "/actuarial/modules"
    description: "Registrar defines a specialty module within a track."
    roles: [Registrar]
    code: 201
    input: [module_code, track_code, sequence_index, title, "is_capstone?", passing_score, "cooldown_days?"]
    output: Module
    side_effects: []

  - method: POST
    path: "/actuarial/module-attempts"
    description: "Start an attempt on a module under the acting candidate's enrollment; enforces standing, sequence, capstone gate and cooldown."
    roles: [Candidate]
    code: 201
    input: [track_enrollment_id, module_id]
    output: ModuleAttempt
    side_effects: []

  - method: POST
    path: "/actuarial/module-attempts/{id}/submit"
    description: "Submit the attempt with the assessment score; grades synchronously (>= passing_score passes) and bubbles up to the enrollment."
    roles: [Candidate]
    code: 200
    input: [score]
    output: ModuleAttempt
    side_effects: ["enrollment bubble-up recomputation and auto-transitions"]

  - method: GET
    path: "/actuarial/module-attempts/{id}"
    description: "Read one module attempt."
    roles: [Candidate, Registrar]
    code: 200
    input: []
    output: ModuleAttempt
    side_effects: []

  - method: GET
    path: "/actuarial/module-attempts"
    description: "List module attempts with filters (FK reverse lookup for module_id and track_enrollment_id). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["track_enrollment_id?", "module_id?", "status?", "limit?", "offset?"]
    output: "ModuleAttempt[]"
    side_effects: []

  - method: POST
    path: "/actuarial/project-assessments"
    description: "Submit a written project assessment; requires the enrollment to be CAPSTONE_ELIGIBLE or COMPLETED."
    roles: [Candidate]
    code: 201
    input: [track_enrollment_id, title]
    output: ProjectAssessment
    side_effects: []

  - method: POST
    path: "/actuarial/project-assessments/{id}/grades"
    description: "A volunteer Grader submits a score. First grade moves SUBMITTED -> IN_REVIEW; second grade joins to DECIDED when |g1-g2| <= 10 else forks to SPLIT; a third distinct grade resolves a SPLIT. A grader may not grade the same assessment twice (segregation of duties)."
    roles: [Grader]
    code: 200
    input: [score]
    output: ProjectAssessment
    side_effects: ["consensus_grade calculation; DECIDED sets final_score and result"]

  - method: GET
    path: "/actuarial/project-assessments/{id}"
    description: "Read one project assessment."
    roles: [Candidate, Registrar, Grader]
    code: 200
    input: []
    output: ProjectAssessment
    side_effects: []

  - method: GET
    path: "/actuarial/project-assessments"
    description: "List project assessments with filters (FK reverse lookup for candidate_id and track_enrollment_id). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar, Grader]
    code: 200
    input: ["candidate_id?", "track_enrollment_id?", "status?", "limit?", "offset?"]
    output: "ProjectAssessment[]"
    side_effects: []

  - method: POST
    path: "/actuarial/course-sessions"
    description: "Registrar schedules a professionalism course session."
    roles: [Registrar]
    code: 201
    input: [session_code, starts_at, ends_at, capacity]
    output: ProfessionalismCourseSession
    side_effects: []

  - method: POST
    path: "/actuarial/course-attendances"
    description: "Book the acting candidate into a professionalism session; stage-gated to ASSOCIATE/FELLOW; enforces capacity and the same-calendar-day rule."
    roles: [Candidate]
    code: 201
    input: [course_session_id]
    output: CourseAttendance
    side_effects: ["attendance_booked recompute"]

  - method: POST
    path: "/actuarial/course-attendances/{id}/verify"
    description: "Registrar verifies attendance once the session is HELD."
    roles: [Registrar]
    code: 200
    input: [outcome]
    output: CourseAttendance
    side_effects: ["stamps verified_at/verified_by"]

  - method: GET
    path: "/actuarial/course-attendances/{id}"
    description: "Read one attendance."
    roles: [Candidate, Registrar]
    code: 200
    input: []
    output: CourseAttendance
    side_effects: []

  - method: GET
    path: "/actuarial/course-attendances"
    description: "List attendances with filters (FK reverse lookup for course_session_id and candidate_id). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["course_session_id?", "candidate_id?", "status?", "limit?", "offset?"]
    output: "CourseAttendance[]"
    side_effects: []

  - method: POST
    path: "/actuarial/transfer-credit-requests"
    description: "Claim transfer credit from another actuarial body; mutual-recognition rule decides GRANTED/DENIED synchronously."
    roles: [Candidate]
    code: 201
    input: [source_body, claimed_hours]
    output: TransferCreditRequest
    side_effects: ["transfer_equivalency calculation; candidate credit totals recompute on GRANTED"]

  - method: GET
    path: "/actuarial/candidates/{id}/transfer-credit-requests"
    description: "List a candidate's transfer credit requests (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TransferCreditRequest[]"
    side_effects: []

  - method: POST
    path: "/actuarial/cpd-attestations"
    description: "Member (ASSOCIATE/FELLOW) attests CPD hours for a cycle year; required_hours computed at creation."
    roles: [Candidate]
    code: 201
    input: [cycle_year, attested_hours, "carryover_hours?"]
    output: CPDAttestation
    side_effects: ["cpd_required_hours calculation"]

  - method: POST
    path: "/actuarial/cpd-attestations/{id}/verify"
    description: "Registrar records evidence-backed hours; VERIFIED when >= required_hours else SHORTFALL; re-verification of a SHORTFALL cures it when the new value meets the requirement."
    roles: [Registrar]
    code: 200
    input: [verified_hours]
    output: CPDAttestation
    side_effects: ["cpd_compliance (verified variant) drives status"]

  - method: GET
    path: "/actuarial/candidates/{id}/cpd-attestations"
    description: "List a candidate's CPD attestations (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["cycle_year?", "status?", "limit?", "offset?"]
    output: "CPDAttestation[]"
    side_effects: []

  - method: POST
    path: "/actuarial/discipline-cases"
    description: "Registrar files a professional-conduct case against a non-EXPELLED candidate."
    roles: [Registrar]
    code: 201
    input: [candidate_id, charge, severity]
    output: DisciplineCase
    side_effects: []

  - method: POST
    path: "/actuarial/discipline-cases/{id}/sanction"
    description: "DisciplineBoard resolves a FILED case; SUSPENSION and EXPULSION run the candidate cascades."
    roles: [DisciplineBoard]
    code: 200
    input: [resolution, "suspension_days?"]
    output: DisciplineCase
    side_effects: ["Candidate status cascades per state machines (suspension: full-refund registration cancellations + waitlist promotions; expulsion: zero-refund cancellations + enrollment withdrawal)"]

  - method: GET
    path: "/actuarial/candidates/{id}/discipline-cases"
    description: "List a candidate's discipline cases (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar, DisciplineBoard]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DisciplineCase[]"
    side_effects: []

  - method: POST
    path: "/actuarial/credential-applications"
    description: "Apply for ASA or FSA; evaluation is synchronous. OCC: expected_candidate_version must match. On APPROVED the membership tier advances (fellowship admission for FSA)."
    roles: [Candidate]
    code: 201
    input: [credential, expected_candidate_version]
    output: CredentialApplication
    side_effects: ["credential_evaluation", "candidate.last_evaluated_at stamp (version += 1)", "tier advancement + admitted_at stamp on APPROVED"]

  - method: GET
    path: "/actuarial/candidates/{id}/credential-applications"
    description: "List a candidate's credential applications (FK reverse lookup; sub-resource). Results are ordered by created_at ASC (stable; no id-based ordering)."
    roles: [Candidate, Registrar]
    code: 200
    input: ["credential?", "status?", "limit?", "offset?"]
    output: "CredentialApplication[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth / schema ---
  - id: ERR_MISSING_HEADERS
    http: 401
    condition: "X-User-Role missing/undeclared, or X-User-ID missing for a non-Anonymous role"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Role not in the endpoint's roles list"
  - id: ERR_FORBIDDEN_OWNER
    http: 403
    condition: "Candidate-role caller acting on another candidate's resource (path candidate id or resource candidate_id != X-User-ID)"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/typed/enum schema violation; duplicate unique field (email, version_code, exam_code, window_code, module_code, session_code); conditional field missing (suspension_days for SUSPENSION); prerequisite cycle or cross-version prerequisite; bad credit_map at activation; submit of a decided attempt; grade outside 0-100; window dates not ordered opens <= deadline <= testing_starts <= testing_ends; clock-set to a timestamp earlier than the current logical clock"
  # --- optimistic concurrency ---
  - id: ERR_STALE_WINDOW_VERSION
    http: 412
    condition: "expected_exam_window_version != exam_window.version on pass-mark creation"
  - id: ERR_STALE_CANDIDATE_VERSION
    http: 412
    condition: "expected_candidate_version != candidate.version on credential application"
  # --- existence (path or body FK) ---
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "Candidate id in path (or X-User-ID for Candidate role) does not resolve"
  - id: ERR_SYLLABUS_VERSION_NOT_FOUND
    http: 404
    condition: "Syllabus version id does not resolve"
  - id: ERR_EXAM_NOT_FOUND
    http: 404
    condition: "Exam id (path or body exam_id / prerequisite_exam_id) does not resolve"
  - id: ERR_EXAM_WINDOW_NOT_FOUND
    http: 404
    condition: "Exam window id (path or body exam_window_id) does not resolve"
  - id: ERR_EXAM_REGISTRATION_NOT_FOUND
    http: 404
    condition: "Exam registration id does not resolve"
  - id: ERR_PASS_MARK_SETTING_NOT_FOUND
    http: 404
    condition: "Pass-mark setting id does not resolve"
  - id: ERR_VEE_SUBMISSION_NOT_FOUND
    http: 404
    condition: "VEE submission id does not resolve"
  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "Module id (body module_id) does not resolve"
  - id: ERR_MODULE_ATTEMPT_NOT_FOUND
    http: 404
    condition: "Module attempt id does not resolve"
  - id: ERR_TRACK_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Track enrollment id (body track_enrollment_id) does not resolve"
  - id: ERR_PROJECT_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "Project assessment id does not resolve"
  - id: ERR_COURSE_SESSION_NOT_FOUND
    http: 404
    condition: "Course session id (body course_session_id) does not resolve"
  - id: ERR_COURSE_ATTENDANCE_NOT_FOUND
    http: 404
    condition: "Course attendance id does not resolve"
  - id: ERR_CPD_ATTESTATION_NOT_FOUND
    http: 404
    condition: "CPD attestation id does not resolve"
  - id: ERR_DISCIPLINE_CASE_NOT_FOUND
    http: 404
    condition: "Discipline case id does not resolve"
  # --- state ---
  - id: ERR_WINDOW_NOT_OPEN
    http: 422
    condition: "Registration attempted when window.status != REGISTRATION_OPEN (includes the exact-deadline boundary: the sweep closes the window at >= deadline)"
  - id: ERR_REGISTRATION_NOT_CANCELLABLE
    http: 422
    condition: "Cancel attempted when logistics_status not in {REGISTERED, WAITLISTED}, or grading RELEASED, or window past REGISTRATION_CLOSED"
  - id: ERR_PASS_MARK_INVALID_STATE
    http: 422
    condition: "Pass-mark create when window not in {REGISTRATION_CLOSED, TESTING, SCORING}; ratify of non-PROPOSED; publish of non-RATIFIED or window not SCORING"
  - id: ERR_VEE_NOT_REVIEWABLE
    http: 422
    condition: "Review attempted on a submission not in SUBMITTED"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 422
    condition: "Module attempt attempted when enrollment.status not in {ENROLLED, CAPSTONE_ELIGIBLE}"
  - id: ERR_PROJECT_NOT_GRADABLE
    http: 422
    condition: "Grade attempted when project.status == DECIDED (or otherwise not in {SUBMITTED, IN_REVIEW, SPLIT})"
  - id: ERR_SESSION_NOT_BOOKABLE
    http: 422
    condition: "Attendance booking when session HELD or current_utc >= session.starts_at"
  - id: ERR_ATTENDANCE_NOT_VERIFIABLE
    http: 422
    condition: "Verify attempted when attendance not BOOKED or session not yet HELD"
  - id: ERR_CPD_NOT_VERIFIABLE
    http: 422
    condition: "Verify attempted on an attestation already VERIFIED"
  - id: ERR_DISCIPLINE_ALREADY_RESOLVED
    http: 422
    condition: "Sanction attempted on a RESOLVED case"
  - id: ERR_SYLLABUS_ACTIVATION_INVALID
    http: 422
    condition: "Activation of a non-DRAFT syllabus version"
  - id: ERR_EXAM_NOT_ACTIVE
    http: 422
    condition: "Window creation for an exam not in ACTIVE status"
  - id: ERR_CREDENTIAL_ALREADY_HELD
    http: 409
    condition: "Applying for ASA while ASSOCIATE/FELLOW, or FSA while FELLOW"
  # --- business: safety ---
  - id: ERR_CANDIDATE_NOT_ACTIVE
    http: 422
    condition: "Candidate-initiated write (or SUSPENSION sanction / case filing) while candidate.status != ACTIVE"
  # --- business: constraint ---
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "Candidate already holds a {REGISTERED, WAITLISTED} registration for the window"
  - id: ERR_PREREQUISITE_NOT_MET
    http: 422
    condition: "Exam declares prerequisite_exam_id and the candidate holds no credit on it (direct PASS or mapped via transition_credit_mapping)"
  - id: ERR_VEE_TOPIC_ALREADY_CREDITED
    http: 409
    condition: "An APPROVED submission already exists for (candidate, topic)"
  - id: ERR_VEE_GRADE_BELOW_THRESHOLD
    http: 422
    condition: "APPROVE decision on a submission with grade_points < 2.7"
  - id: ERR_REQUIRES_ASSOCIATE
    http: 422
    condition: "Track enrollment or professionalism booking by a CANDIDATE-tier member"
  - id: ERR_ENROLLMENT_ACTIVE_EXISTS
    http: 409
    condition: "Candidate already has an enrollment in {ENROLLED, CAPSTONE_ELIGIBLE}"
  - id: ERR_MODULE_SEQUENCE_LOCKED
    http: 422
    condition: "Attempting sequence k without a PASSED attempt on sequence k-1 of the track, or attempting a capstone module before CAPSTONE_ELIGIBLE"
  - id: ERR_PROJECT_REQUIRES_CAPSTONE
    http: 422
    condition: "Project submission while enrollment not in {CAPSTONE_ELIGIBLE, COMPLETED}"
  - id: ERR_GRADER_CONFLICT
    http: 422
    condition: "Grader X-User-ID already present in the assessment's grader_ids (segregation of duties)"
  - id: ERR_CPD_NOT_MEMBER
    http: 422
    condition: "CPD attestation by a CANDIDATE-tier user"
  - id: ERR_CPD_CYCLE_DUPLICATE
    http: 409
    condition: "An attestation already exists for (candidate, cycle_year)"
  # --- business: temporal ---
  - id: ERR_MODULE_COOLDOWN_ACTIVE
    http: 422
    condition: "Retake attempted while a FAILED attempt's submitted_at + cooldown_days > current_utc (equality allowed)"
  - id: ERR_WINDOW_SCHEDULE_CONFLICT
    http: 409
    condition: "New window's [testing_starts_at, testing_ends_at) overlaps another window of the SAME exam; touching intervals (end == start) are allowed"
  - id: ERR_SESSION_SAME_DAY_CONFLICT
    http: 409
    condition: "Candidate already holds BOOKED/ATTENDED attendance to a session starting on the same UTC calendar date (date-equality semantics)"
  # --- business: fiscal/capacity ---
  - id: ERR_SESSION_FULL
    http: 409
    condition: "Booking when session.attendance_booked >= session.capacity (== capacity rejects)"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-registration."
    identity: opaque
    exclusive_operations: ["POST /actuarial/candidates"]
    shared_operations: []
  - name: Candidate
    description: "Actuarial candidate/member acting on their own record; X-User-ID must equal the owning Candidate.id (ownership, ERR_FORBIDDEN_OWNER)."
    identity: "entity_backed:Candidate"
    exclusive_operations: ["POST /actuarial/exam-registrations", "POST /actuarial/vee-submissions", "POST /actuarial/track-enrollments", "POST /actuarial/module-attempts", "POST /actuarial/module-attempts/{id}/submit", "POST /actuarial/project-assessments", "POST /actuarial/course-attendances", "POST /actuarial/transfer-credit-requests", "POST /actuarial/cpd-attestations", "POST /actuarial/credential-applications"]
    shared_operations: ["POST /actuarial/exam-registrations/{id}/cancel", "GET endpoints scoped to own record"]
  - name: Registrar
    description: "Society operations staff: syllabus/exam/window/module/session administration, clock sweep, attendance and CPD verification, case filing."
    identity: opaque
    exclusive_operations: ["POST /actuarial/_clock/set_current_utc", "POST /actuarial/syllabus-versions", "POST /actuarial/syllabus-versions/{id}/activate", "POST /actuarial/exams", "POST /actuarial/exam-windows", "POST /actuarial/modules", "POST /actuarial/course-sessions", "POST /actuarial/course-attendances/{id}/verify", "POST /actuarial/cpd-attestations/{id}/verify", "POST /actuarial/discipline-cases"]
    shared_operations: ["POST /actuarial/exam-registrations/{id}/cancel", "GET endpoints"]
  - name: ExamCommittee
    description: "Volunteer examination committee: pass-mark proposal/ratification/publication and score entry."
    identity: opaque
    exclusive_operations: ["POST /actuarial/exam-windows/{wid}/pass-mark-settings", "POST /actuarial/pass-mark-settings/{id}/ratify", "POST /actuarial/pass-mark-settings/{id}/publish", "POST /actuarial/exam-registrations/{id}/record-score"]
    shared_operations: ["GET /actuarial/exams*", "GET /actuarial/exam-windows*"]
  - name: AcademicReviewer
    description: "Transcript reviewer for VEE coursework."
    identity: opaque
    exclusive_operations: ["POST /actuarial/vee-submissions/{id}/review"]
    shared_operations: ["GET /actuarial/candidates/{id}/vee-submissions"]
  - name: Grader
    description: "Volunteer committee grader for written project assessments; segregation of duties forbids grading the same assessment twice."
    identity: opaque
    exclusive_operations: ["POST /actuarial/project-assessments/{id}/grades"]
    shared_operations: ["GET /actuarial/project-assessments*"]
  - name: DisciplineBoard
    description: "Professional-conduct board; resolves filed cases with sanctions."
    identity: opaque
    exclusive_operations: ["POST /actuarial/discipline-cases/{id}/sanction"]
    shared_operations: ["GET /actuarial/candidates/{id}/discipline-cases"]
