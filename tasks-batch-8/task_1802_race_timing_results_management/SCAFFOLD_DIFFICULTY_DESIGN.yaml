# =============================================================================
# Task 1802 — Scaffold Difficulty Design (Test Targeting Index, §1.8)
# 9 rules x >=2 instances = 19 instances. Every chain drives empty-DB -> target
# state using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: gun_vs_chip_award_divergence
        grounds:
          - calculations.ranking_with_exclusions
          - calculations.award_computation
          - entities.Race.fields.status
        distinguishing_aspect: |
          Identical finish data yields different category winners under the two
          ranking bases: rank_by_gun (OVERALL_M) puts wave-1 athlete A first
          (gun 1925000 < 1940000) while rank_by_chip (AG_M_35_39) puts wave-2
          athlete B first (chip 1910000 < 1920000) — a wave-offset reversal.
        test_recipe:
          setup:
            - "10km CERTIFIED_COURSE race, cutoff 120min, qualifying standard 1800000ms; waves W1@07:00 and W2@07:10 (10min gap)"
            - "A (M, 1990-01-01, age 36) in W1 chip CHIP-A; B (M, 1990-06-15, age 36) in W2 chip CHIP-B; both CHECKED_IN"
            - "A reads: START 07:00:05.000, SPLIT5k 07:16:05.000, FINISH 07:32:05.000 -> chip 1920000, gun 1925000"
            - "B reads: START 07:10:30.000, SPLIT5k 07:26:15.000, FINISH 07:42:20.000 -> chip 1910000, gun 1940000"
            - "results published at 09:00:00 (cutoff met: 07:00+120min)"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Divergence 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120, qualifying_standard_ms: 1800000 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-001", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: SPLIT, distance_km: 5.0, device_id: "MAT-002", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_split: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 3, kind: FINISH, distance_km: 10.0, device_id: "MAT-003", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_split}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 100 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 2, scheduled_start_time: "2026-08-01T07:10:00Z", max_capacity: 100 }
              as: RaceDirector
              captures: { wave2: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-A" }
              as: RegistrationClerk
              captures: { chip_a: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-B" }
              as: RegistrationClerk
              captures: { chip_b: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "101", participant_name: "Athlete A", birth_date: "1990-01-01", gender: M }
              as: RegistrationClerk
              captures: { reg_a: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_a}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_a}/confirm", as: RegistrationClerk }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave2}", bib_number: "102", participant_name: "Athlete B", birth_date: "1990-06-15", gender: M }
              as: RegistrationClerk
              captures: { reg_b: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_b}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_b}/confirm", as: RegistrationClerk }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/registrations/${reg_a}/assign-chip", payload: { chip_id: "${chip_a}" }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_b}/assign-chip", payload: { chip_id: "${chip_b}" }, as: RegistrationClerk }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: RaceDirector }
            - { call: "POST /race-timing/waves/${wave1}/start", as: TimingOperator }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:10:00Z" }, as: RaceDirector }
            - { call: "POST /race-timing/waves/${wave2}/start", as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_start}", chip_id: "${chip_a}", read_timestamp: "2026-08-01T07:00:05.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_split}", chip_id: "${chip_a}", read_timestamp: "2026-08-01T07:16:05.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_fin}", chip_id: "${chip_a}", read_timestamp: "2026-08-01T07:32:05.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_start}", chip_id: "${chip_b}", read_timestamp: "2026-08-01T07:10:30.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_split}", chip_id: "${chip_b}", read_timestamp: "2026-08-01T07:26:15.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_fin}", chip_id: "${chip_b}", read_timestamp: "2026-08-01T07:42:20.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: RaceDirector }
            - { call: "GET /race-timing/races/${race_id}", as: RaceDirector, captures: { race_v: $.data.version } }
            - { call: "POST /race-timing/races/${race_id}/publish-results", payload: { expected_race_version: "${race_v}" }, as: RaceDirector }
          trigger:
            - { call: "GET /race-timing/results", payload: { race_id: "${race_id}" }, as: RaceOfficial }
            - { call: "GET /race-timing/races/${race_id}/awards", as: RaceOfficial }
          assert:
            - "Result(reg_a).chip_time_ms == 1920000 and Result(reg_a).gun_time_ms == 1925000"
            - "Result(reg_b).chip_time_ms == 1910000 and Result(reg_b).gun_time_ms == 1940000"
            - "Result(reg_a).overall_rank_gun == 1 and Result(reg_b).overall_rank_gun == 2 (gun basis: A wins)"
            - "Result(reg_a).age_group_rank_chip == 2 and Result(reg_b).age_group_rank_chip == 1 (chip basis: B wins) — same data, reversed order"
            - "Award(OVERALL_M, place 1).registration_id == reg_a with basis == GUN and basis_time_ms == 1925000, status PROJECTED"
            - "Award(AG_M_35_39, place 1).registration_id == reg_b with basis == CHIP and basis_time_ms == 1910000, status PROJECTED"
            - "Result(reg_a).qualified == false and Result(reg_b).qualified == false (chips 1920000/1910000 > standard 1800000)"

      - name: live_projection_vs_furthest_point_standing
        grounds:
          - calculations.live_board_projection
          - calculations.time_derivation
        distinguishing_aspect: |
          Two valid standings of the same in-race reads disagree: chronological
          furthest-point standing puts M (reached 7km) ahead of N (only 3km),
          while the forward-looking pace projection puts N (projected_total_sec
          2331) ahead of M (2529) — projection vs actual, a different entity
          domain (live feed) than result ranking.
        test_recipe:
          setup:
            - "10km race IN_PROGRESS, one wave started 07:00:00; splits at 3km and 7km"
            - "M reads: START 07:00:00.000, SPLIT3k 07:12:30.000, SPLIT7k 07:29:30.000 (paces 250/255 -> total 2529)"
            - "N reads: START 07:00:00.000, SPLIT3k 07:11:40.000 (single segment pace 233 -> total 2331)"
            - "logical clock 07:35:00 at board read"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Live Board 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-101", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: SPLIT, distance_km: 3.0, device_id: "MAT-102", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_s3: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 3, kind: SPLIT, distance_km: 7.0, device_id: "MAT-103", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_s7: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 4, kind: FINISH, distance_km: 10.0, device_id: "MAT-104", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_s3}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_s7}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 100 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-M" }
              as: RegistrationClerk
              captures: { chip_m: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-N" }
              as: RegistrationClerk
              captures: { chip_n: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "201", participant_name: "Runner M", birth_date: "1995-03-10", gender: M }
              as: RegistrationClerk
              captures: { reg_m: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_m}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_m}/confirm", as: RegistrationClerk }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "202", participant_name: "Runner N", birth_date: "1992-11-20", gender: M }
              as: RegistrationClerk
              captures: { reg_n: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_n}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_n}/confirm", as: RegistrationClerk }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/registrations/${reg_m}/assign-chip", payload: { chip_id: "${chip_m}" }, as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_n}/assign-chip", payload: { chip_id: "${chip_n}" }, as: RegistrationClerk }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: RaceDirector }
            - { call: "POST /race-timing/waves/${wave1}/start", as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_start}", chip_id: "${chip_m}", read_timestamp: "2026-08-01T07:00:00.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_s3}", chip_id: "${chip_m}", read_timestamp: "2026-08-01T07:12:30.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_s7}", chip_id: "${chip_m}", read_timestamp: "2026-08-01T07:29:30.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_start}", chip_id: "${chip_n}", read_timestamp: "2026-08-01T07:00:00.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/timing-reads", payload: { timing_point_id: "${tp_s3}", chip_id: "${chip_n}", read_timestamp: "2026-08-01T07:11:40.000Z" }, as: TimingOperator }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:35:00Z" }, as: RaceDirector }
          trigger:
            - call: "GET /race-timing/races/${race_id}/live-board"
              as: Spectator
              captures: { board: $.data.entries }
          assert:
            - "board.entries[0].registration_id == reg_n and board.entries[0].projected_total_sec == 2331 (N projected first)"
            - "board.entries[1].registration_id == reg_m and board.entries[1].projected_total_sec == 2529"
            - "Chronological furthest-point standing would order M (7km, elapsed 1770s) ahead of N (3km, elapsed 700s) — the projected order diverges"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: age_bracket_boundary_categorization
        grounds:
          - calculations.age_group_categorization
          - entities.Registration.fields.age_group
        distinguishing_aspect: |
          Mode (a) multi-input conditional formula: identical computation on
          birth_date x race_date x gender branches at exact ages — 2006-08-01
          yields age 20 -> "20-24" (not "1-19"), 2006-08-02 yields 19 -> "1-19",
          1946-07-31 yields 80 -> "80+" (not "75-79").
        test_recipe:
          setup:
            - "Race with race_date 2026-08-01, registration open, one wave"
            - "Three registrations: F1 born 2006-08-01, F2 born 2006-08-02, F3 born 1946-07-31 (all gender F)"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Age Bracket 5K", race_date: "2026-08-01T00:00:00Z", distance_km: 5.0, course_type: UNCERTIFIED_COURSE, course_time_limit_minutes: 90 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 100 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "301", participant_name: "F Twenty", birth_date: "2006-08-01", gender: F }
              as: RegistrationClerk
              captures: { reg_f1: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "302", participant_name: "F Nineteen", birth_date: "2006-08-02", gender: F }
              as: RegistrationClerk
              captures: { reg_f2: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "303", participant_name: "F Eighty", birth_date: "1946-07-31", gender: F }
              as: RegistrationClerk
              captures: { reg_f3: $.data.id }
          trigger:
            - { call: "GET /race-timing/registrations/${reg_f1}", as: RegistrationClerk }
            - { call: "GET /race-timing/registrations/${reg_f2}", as: RegistrationClerk }
            - { call: "GET /race-timing/registrations/${reg_f3}", as: RegistrationClerk }
          assert:
            - "Registration(reg_f1).age_on_race_day == 20 and age_group == '20-24' (birthday on race day counts as reached)"
            - "Registration(reg_f2).age_on_race_day == 19 and age_group == '1-19' (birthday one day after race day)"
            - "Registration(reg_f3).age_on_race_day == 80 and age_group == '80+' (masters bracket at exactly 80)"

      - name: nested_rounding_live_pace_order_pinned
        grounds:
          - calculations.live_board_projection
        distinguishing_aspect: |
          Mode (b) nested rounding where the pinned order changes the answer:
          per-segment round_half_up (247, 257) then rounded mean 252 then
          multiply remaining 4.0km yields projected_total_sec 2518; the
          unrounded-then-round-at-end order yields 2517 — one second apart.
        test_recipe:
          setup:
            - "10km race IN_PROGRESS, one wave started 07:00:00; splits at 3km and 6km"
            - "E reads: START 07:00:00.000, SPLIT3k 07:12:20.000 (740s/3km -> 247), SPLIT6k 07:25:10.000 (770s/3km -> 257)"
            - "projected pace round_half_up(mean(247,257)) = 252; remaining 4.0km -> 1008s; elapsed 1510s; total 2518"
          setup_api_calls:
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: RaceDirector }
            - call: "POST /race-timing/races"
              payload: { name: "Rounding 10K", race_date: "2026-08-01T00:00:00Z", distance_km: 10.0, course_type: CERTIFIED_COURSE, course_time_limit_minutes: 120 }
              as: RaceDirector
              captures: { race_id: $.data.id }
            - { call: "POST /race-timing/races/${race_id}/open-registration", as: RaceDirector }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 1, kind: START, distance_km: 0.0, device_id: "MAT-201", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_start: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 2, kind: SPLIT, distance_km: 3.0, device_id: "MAT-202", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_s3: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 3, kind: SPLIT, distance_km: 6.0, device_id: "MAT-203", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_s6: $.data.id }
            - call: "POST /race-timing/timing-points"
              payload: { race_id: "${race_id}", point_index: 4, kind: FINISH, distance_km: 10.0, device_id: "MAT-204", deploy_at: "2026-08-01T05:00:00Z", expected_teardown_at: "2026-08-01T12:00:00Z" }
              as: TimingOperator
              captures: { tp_fin: $.data.id }
            - { call: "POST /race-timing/timing-points/${tp_start}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_s3}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_s6}/deploy", as: TimingOperator }
            - { call: "POST /race-timing/timing-points/${tp_fin}/deploy", as: TimingOperator }
            - call: "POST /race-timing/waves"
              payload: { race_id: "${race_id}", wave_index: 1, scheduled_start_time: "2026-08-01T07:00:00Z", max_capacity: 100 }
              as: RaceDirector
              captures: { wave1: $.data.id }
            - call: "POST /race-timing/chips"
              payload: { chip_code: "CHIP-E" }
              as: RegistrationClerk
              captures: { chip_e: $.data.id }
            - call: "POST /race-timing/registrations"
              payload: { race_id: "${race_id}", wave_id: "${wave1}", bib_number: "401", participant_name: "Runner E", birth_date: "1988-05-05", gender: M }
              as: RegistrationClerk
              captures: { reg_e: $.data.id }
            - { call: "POST /race-timing/registrations/${reg_e}/pay", as: RegistrationClerk }
            - { call: "POST /race-timing/registrations/${reg_e}/confirm", as: RegistrationClerk }
            - { call: "POST /race-timing/races/${race_id}/lock-timing", as: RaceDirector, as_user_id: "director-1" }
            - { call: "POST /race-timing/registrations/${reg_e}/assign-chip", payload: { chip_id: "${chip_e}" }, as: RegistrationClerk }
            - { call: "POST /race-timing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: RaceDirector }
