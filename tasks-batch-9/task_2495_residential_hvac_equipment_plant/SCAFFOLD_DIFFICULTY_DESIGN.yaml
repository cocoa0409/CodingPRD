          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE standard SOUTHEAST (14.30 / 15.20 / 16.00) that permits flammable refrigerant."
            - "A RELEASED HIGH-tier A2L platform rated SEER2 15.80, comfortably above the 15.20 regional minimum for its tier."
            - "A SOUTHEAST certification record that was submitted and then REJECTED by the auditor."
            - "For supply month 2026-11: compressor lot 100 units and control-board lot 100 units, both untouched."
            - "A SOUTHEAST distributor order for 25 units, UNALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plant/refrigerant-programs"
              payload: { refrigerant_code: "R-454B", gwp: 466, flammability_class: "A2L", manufacture_cutoff_utc: "2027-01-01T00:00:00Z", sell_through_deadline_utc: "2027-07-01T00:00:00Z" }
