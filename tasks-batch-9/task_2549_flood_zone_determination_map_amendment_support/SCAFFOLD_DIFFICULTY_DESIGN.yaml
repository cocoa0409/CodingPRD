# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2549 - Flood Zone Determination & Map Amendment Support
#
# 9 rule_id blocks x 2 instances = 18 instances. Every instance grounds in
# elements already declared in SCAFFOLD.yaml §1.1-§1.7; deleting this file would
# not change a single declared behavior. Every numeric literal in an `assert:`
# was computed by executing the relevant §1.3 formula with its `constants:`.
#
# Shared fixture vocabulary used by the chains below (each instance builds its
# own fixtures from empty DB; nothing is shared at runtime):
#   community 125129 / FL  -> DATUM_OFFSET_FT = -1.15, REGULAR, coverage FULL
#   panel 12086C0312K seq 1 -> zone AE, BFE 7.75, shift 0, uncertainty 0,
#                              effective 2020-06-05, created EFFECTIVE
#   clock default            -> 2026-08-01T00:00:00Z (every chain sets it anyway)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: zone_determination_strict_vs_lenient_on_indeterminate_structure
        grounds:
          - calculations.structure_zone_determination
          - calculations.preliminary_map_impact_analysis
          - entities.Determination.fields.position_class
          - entities.Determination.fields.sfha_flag
          - entities.MapPanel.fields.sfha_boundary_shift_ft
          - state_machines.Determination.ISSUED_to_FLAGGED_FOR_REVIEW
        distinguishing_aspect: |
          This dual variant lives on the Structure/Determination domain (a
          geometric position classification): with effective_offset_ft exactly 0
          and buffer 0 the structure is INDETERMINATE, and origination_strict
          reports sfha_flag true / zone VE while life_of_loan_lenient reports
          sfha_flag false / zone X for byte-identical Structure, Property and
          MapPanel inputs.
        test_recipe:
          setup:
            - "FL community 125129 in REGULAR participation (coverage_availability FULL)"
            - "panel 12086C0312K revision_sequence 1, zone AE, BFE 7.75, sfha_boundary_shift_ft 0, horizontal_uncertainty_ft 0, created directly EFFECTIVE"
            - "property geocoded ROOFTOP (GEOCODE_BUFFER_FT 0) with confidence 0.95"
            - "structure with sfha_offset_ft +30.0, so under panel 1 it is OUTSIDE (30 - 0 > 0)"
            - "loan folio with an ORIGINATION determination: position_class OUTSIDE, sfha_flag false, zone_code X"
            - "successor panel 12086C0312K revision_sequence 2 with sfha_boundary_shift_ft 30.0 and zone VE, walked to LFD_ISSUED but not yet effective, effective_date 2027-04-28"
            - "clock advanced to 2027-05-01 so the LFD 180-day waiting period has elapsed"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z", sfha_boundary_shift_ft: 0.0, horizontal_uncertainty_ft: 0.0 }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "44 Ridge Line Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7743, longitude: -80.1937, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_d_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_d_id}", structure_label: "Ridge dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: 30.0 }
              as: ProviderAnalyst
              captures: { st_d_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_d_id}", loan_number: "LN-9012", borrower_user_id: "borrower-d", principal_balance_cents: 19000000, policy_anniversary_date: "2027-01-10T00:00:00Z", escrow_balance_cents: 400000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_d_id: $.data.id, f_d_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_d_id}", structure_id: "${st_d_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_d_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_d_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}", sfha_boundary_shift_ft: 30.0, horizontal_uncertainty_ft: 0.0, study_case_number: "26-04-1234P" }
              as: AgencyOfficer
              captures: { p2_id: $.data.id }
            - call: "POST /flood-zone/map-panels/${p2_id}/appeal-period"
              payload: { appeal_period_end_date: "2026-10-30T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-10-30T00:00:00Z" }
              as: AgencyOfficer
            - call: "POST /flood-zone/map-panels/${p2_id}/appeal-decision"
              payload: { outcome: "LFD_ISSUED" }
              as: AgencyOfficer
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T00:00:00Z" }
              as: AgencyOfficer
          trigger:
            - call: "GET /flood-zone/map-panels/${p2_id}/impact-analysis"
              payload: {}
              as: ProviderAnalyst
              captures: { strict_newly_in: $.data.newly_in_sfha_count, strict_evaluated: $.data.structures_evaluated }
            - call: "POST /flood-zone/map-panels/${p2_id}/effective"
              payload: {}
              as: AgencyOfficer
            - call: "GET /flood-zone/loan-folios/${f_d_id}"
              payload: {}
              as: ProviderAnalyst
              captures: { f_d_version_2: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_d_id}", structure_id: "${st_d_id}", determination_type: "LIFE_OF_LOAN_REVIEW", expected_loan_folio_version: "${f_d_version_2}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_d2_id: $.data.id }
          assert:
            - "impact-analysis on panel ${p2_id} returns structures_evaluated == 1 and newly_in_sfha_count == 1 (origination_strict turns the INDETERMINATE structure into sfha_flag true)"
            - "impact-analysis on panel ${p2_id} returns aggregate_new_required_coverage_cents == 19000000 (min(19000000 principal, 32000000 replacement, 25000000 cap))"
            - "Determination.${det_d_id}.position_class == OUTSIDE and Determination.${det_d_id}.sfha_flag == false and Determination.${det_d_id}.zone_code == X"
            - "Determination.${det_d_id}.status == SUPERSEDED after the LIFE_OF_LOAN_REVIEW determination is issued"
            - "Determination.${det_d2_id}.position_class == INDETERMINATE (effective_offset_ft == 30.0 - 30.0 == 0.0, buffer_ft == 0.0)"
            - "Determination.${det_d2_id}.sfha_flag == false and Determination.${det_d2_id}.zone_code == X (life_of_loan_lenient carries the prior OUTSIDE outcome forward)"
            - "Determination.${det_d2_id}.base_flood_elevation_ft == null and Determination.${det_d2_id}.mandatory_purchase_flag == false"
            - "LoanFolio.${f_d_id}.required_coverage_cents == 0 and LoanFolio.${f_d_id}.insurance_status == NOT_REQUIRED"
            - "the two variants disagree on identical inputs: origination_strict would have written sfha_flag true / zone_code VE / base_flood_elevation_ft 12.50 for structure ${st_d_id} under panel ${p2_id}"

      - name: force_place_premium_forward_estimate_vs_chronological_actual
        grounds:
          - calculations.force_place_premium
          - calculations.compliance_posture
          - entities.ComplianceNotice.fields.estimated_force_place_premium_cents
          - entities.LoanFolio.fields.force_placed_premium_cents
          - entities.LoanFolio.fields.force_placed_coverage_days
          - state_machines.LoanFolio.NONE_to_FORCE_PLACED
        distinguishing_aspect: |
          This dual variant lives on the LoanFolio/ComplianceNotice money domain,
          not the geometric domain of the other instance: for the same
          annual_premium_rate_cents 288000 and the same policy anniversary
          2027-03-15, forward_looking_estimate stores 144000 on the notice
          (6 whole months / 12) while chronological_actual stores 142027 on the
          folio (180 days / 365), a 1973-cent divergence.
        test_recipe:
          setup:
            - "FL community 125129 REGULAR, panel 12086C0312K seq 1 EFFECTIVE with BFE 7.75"
            - "property geocoded ROOFTOP 0.95; structure sfha_offset_ft -12.0 so the determination is INSIDE with sfha_flag true"
            - "loan folio: principal 28000000, escrow 500000, policy_anniversary_date 2027-03-15, borrower_user_id borrower-a"
            - "ORIGINATION determination issued -> mandatory_purchase_flag true, required_coverage_cents 25000000"
            - "MANDATORY_PURCHASE notice sent at clock 2026-08-01 with annual_premium_rate_cents 288000 -> response_deadline_at 2026-09-15"
            - "clock advanced to 2026-09-16, one day past the deadline"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z", escrow_balance_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_a_id: $.data.id }
            - call: "POST /flood-zone/compliance-notices"
              payload: { loan_folio_id: "${f_a_id}", determination_id: "${det_a_id}", notice_type: "MANDATORY_PURCHASE", annual_premium_rate_cents: 288000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { notice_a_id: $.data.id, notice_a_deadline: $.data.response_deadline_at, notice_a_estimate: $.data.estimated_force_place_premium_cents }
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
          trigger:
            - call: "POST /flood-zone/loan-folios/${f_a_id}/force-placements"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
              captures: { fp_premium: $.data.force_placed_premium_cents, fp_days: $.data.force_placed_coverage_days }
          assert:
            - "ComplianceNotice.${notice_a_id}.response_deadline_at == 2026-09-15T00:00:00Z (sent_at + NOTICE_RESPONSE_DAYS[MANDATORY_PURCHASE] == 45 days)"
            - "ComplianceNotice.${notice_a_id}.estimated_force_place_premium_cents == 144000 (forward_looking_estimate: 6 whole months, 288000 * 6 / 12)"
            - "LoanFolio.${f_a_id}.force_placed_coverage_days == 180"
            - "LoanFolio.${f_a_id}.force_placed_premium_cents == 142027 (chronological_actual: 288000 * 180 / 365, round_half_up)"
            - "LoanFolio.${f_a_id}.force_placed_premium_cents != ComplianceNotice.${notice_a_id}.estimated_force_place_premium_cents (delta exactly 1973 cents)"
            - "LoanFolio.${f_a_id}.escrow_balance_cents == 357973 (500000 - 142027)"
            - "LoanFolio.${f_a_id}.insurance_status == FORCE_PLACED and LoanFolio.${f_a_id}.compliance_posture == FORCE_PLACED"
            - "LoanFolio.${f_a_id}.uninsured_exposure_cents == 0 and LoanFolio.${f_a_id}.required_coverage_cents == 25000000"
            - "ComplianceNotice.${notice_a_id}.status == EXPIRED (the force-placement call first lapses the notice)"
            - "Lender.${lender_id}.open_force_placement_count == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: elevation_freeboard_nested_rounding_order_pinned
        grounds:
          - calculations.elevation_certificate_conversion
          - entities.ElevationCertificate.fields.converted_lowest_floor_ft
          - entities.ElevationCertificate.fields.freeboard_ft
          - entities.ElevationCertificate.fields.lag_freeboard_ft
          - entities.MapPanel.fields.base_flood_elevation_ft
        distinguishing_aspect: |
          Mode (b) - nested rounding where the ORDER changes the result: the
          scaffold pins convert -> round to 1dp -> subtract BFE -> round to 1dp,
          which yields freeboard_ft 0.1 for a NGVD29 survey of 8.94 ft in FL
          against a 2-decimal BFE of 7.75, whereas the rejected single-rounding
          order (8.94 - 1.15 - 7.75 rounded once) yields 0.0 and would flip
          LOMA eligibility from grant to ERR_STRUCTURE_NOT_ABOVE_BFE.
        test_recipe:
          setup:
            - "FL community 125129 (DATUM_OFFSET_FT[FL] == -1.15)"
            - "panel 12086C0312K seq 1 EFFECTIVE with base_flood_elevation_ft 7.75 (two decimals, deliberately off the 0.1 grid)"
            - "property geocoded ROOFTOP 0.95 so calculations.effective_panel_selector resolves the panel"
            - "structure on that property; no folio or determination is needed to file a certificate"
            - "clock at 2026-08-01 so a 2026-07-01 survey is well inside CERTIFICATE_VALIDITY_DAYS (365)"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/elevation-certificates"
              payload: { structure_id: "${st_a_id}", surveyor_license_number: "FL-PSM-8841", survey_date: "2026-07-01T00:00:00Z", datum: "NGVD29", raw_lowest_floor_elevation_ft: 8.94, raw_lowest_adjacent_grade_ft: 8.90, machinery_elevation_ft: 9.50 }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { cert_a_id: $.data.id, cert_a_freeboard: $.data.freeboard_ft }
          assert:
            - "ElevationCertificate.${cert_a_id}.converted_lowest_floor_ft == 7.8 (round_half_up(8.94 + (-1.15), 1))"
            - "ElevationCertificate.${cert_a_id}.converted_lag_ft == 7.8 (round_half_up(8.90 + (-1.15), 1) - the 7.75 midpoint rounds up)"
            - "ElevationCertificate.${cert_a_id}.freeboard_ft == 0.1 (round_half_up(7.8 - 7.75, 1)) and NOT 0.0"
            - "ElevationCertificate.${cert_a_id}.lag_freeboard_ft == 0.1 and NOT 0.0"
            - "ElevationCertificate.${cert_a_id}.reference_panel_id == ${p1_id}"
            - "ElevationCertificate.${cert_a_id}.status == SUBMITTED and ElevationCertificate.${cert_a_id}.submitted_by_user_id == analyst-1"
            - "Structure.${st_a_id}.lowest_floor_elevation_ft == null (a SUBMITTED certificate publishes nothing onto the structure)"

      - name: amendment_fee_tier_keyed_on_pre_surcharge_base
        grounds:
          - calculations.map_amendment_fee
          - entities.MapAmendmentRequest.fields.base_review_fee_cents
          - entities.MapAmendmentRequest.fields.fee_tier
          - entities.MapAmendmentRequest.fields.expedite_surcharge_cents
          - entities.MapAmendmentRequest.fields.total_fee_cents
          - validations[priority=18]
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency resolved by a pinned
          evaluation order, a different axis from the other instance's rounding
          order: fee_tier is keyed on base_review_fee_cents (50000 -> TIER_2 ->
          30% -> total 65000), and keying it on total_fee_cents instead would
          land in TIER_3 and produce 72500, so the same three inputs admit two
          self-consistent answers and only the pinned one is correct.
        test_recipe:
          setup:
            - "FL community 125129 REGULAR; panel 12086C0312K seq 1 EFFECTIVE, BFE 7.75"
            - "property geocoded ROOFTOP 0.95; structure with fill_placed_flag true (LOMR_F eligible) and sfha_offset_ft -12.0"
            - "loan folio with an ORIGINATION determination (INSIDE, sfha_flag true)"
            - "elevation certificate filed by analyst-1 and VALIDATED by reviewer-1 (segregation of duties satisfied)"
            - "clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "77 Filled Lot Way", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7701, longitude: -80.1901, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_f_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_f_id}", structure_label: "Filled-pad dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 30000000, sfha_offset_ft: -12.0, fill_placed_flag: true }
              as: ProviderAnalyst
              captures: { st_f_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_f_id}", loan_number: "LN-7788", borrower_user_id: "borrower-f", principal_balance_cents: 26000000, policy_anniversary_date: "2027-02-01T00:00:00Z", escrow_balance_cents: 300000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_f_id: $.data.id, f_f_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_f_id}", structure_id: "${st_f_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_f_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_f_id: $.data.id }
            - call: "POST /flood-zone/elevation-certificates"
              payload: { structure_id: "${st_f_id}", surveyor_license_number: "FL-PSM-8841", survey_date: "2026-07-01T00:00:00Z", datum: "NGVD29", raw_lowest_floor_elevation_ft: 8.94, raw_lowest_adjacent_grade_ft: 8.90, machinery_elevation_ft: 9.50 }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { cert_f_id: $.data.id }
            - call: "POST /flood-zone/elevation-certificates/${cert_f_id}/review"
              payload: { decision: "VALIDATED" }
              as: ProviderReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /flood-zone/map-amendment-requests"
              payload: { determination_id: "${det_f_id}", elevation_certificate_id: "${cert_f_id}", request_type: "LOMR_F", expedite_flag: true }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { mar_f_id: $.data.id, mar_f_tier: $.data.fee_tier, mar_f_total: $.data.total_fee_cents }
          assert:
            - "MapAmendmentRequest.${mar_f_id}.base_review_fee_cents == 50000 (BASE_FEE_CENTS[LOMR_F] 50000 + RESUBMISSION_FEE_CENTS * 0)"
            - "MapAmendmentRequest.${mar_f_id}.fee_tier == TIER_2 (keyed on the 50000 base, which is <= 50000)"
            - "MapAmendmentRequest.${mar_f_id}.expedite_surcharge_cents == 15000 (EXPEDITE_SURCHARGE_PCT[TIER_2] 0.30 * 50000)"
            - "MapAmendmentRequest.${mar_f_id}.total_fee_cents == 65000"
            - "MapAmendmentRequest.${mar_f_id}.total_fee_cents != 72500 (keying fee_tier on the 65000 total would give TIER_3, a 22500 surcharge and 72500 - the circular reading the scaffold forbids)"
            - "MapAmendmentRequest.${mar_f_id}.status == DRAFT and MapAmendmentRequest.${mar_f_id}.resubmission_count == 0"
            - "Structure.${st_f_id}.lowest_floor_elevation_ft == 7.8 and Structure.${st_f_id}.elevation_source_certificate_id == ${cert_f_id} (published by the VALIDATED review)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_remand_cycle_returns_determination_to_issued
        grounds:
          - state_machines.Dispute.JOINT_AGENCY_REVIEW_to_SUBMITTED
          - state_machines.Dispute.JOINT_AGENCY_REVIEW_to_DENIED
          - state_machines.Determination.ISSUED_to_UNDER_DISPUTE
          - state_machines.Determination.UNDER_DISPUTE_to_ISSUED
          - entities.Dispute.fields.round_number
          - entities.Dispute.fields.resolution
        distinguishing_aspect: |
          The non-linearity here is a two-entity cycle on Dispute and
          Determination: JOINT_AGENCY_REVIEW -> SUBMITTED on NON_CONCUR raises
          round_number to 2 and clears provider_recommendation, and the
          Determination completes the cycle ISSUED -> UNDER_DISPUTE -> ISSUED
          with the SAME determination id and no revised determination minted.
        test_recipe:
          setup:
            - "FL community 125129 REGULAR; panel 12086C0312K seq 1 EFFECTIVE, BFE 7.75"
            - "property ROOFTOP 0.95; structure sfha_offset_ft -12.0; folio borrower_user_id borrower-a"
            - "ORIGINATION determination issued by analyst-1 -> status ISSUED, sfha_flag true"
            - "clock at 2026-08-01 so the dispute's decision_due_at lands on 2026-08-31"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z", escrow_balance_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_a_id: $.data.id }
          trigger:
            - call: "POST /flood-zone/disputes"
              payload: { determination_id: "${det_a_id}", basis: "STRUCTURE_LOCATION", borrower_statement: "The dwelling sits on the ridge, outside the mapped floodway.", asserted_sfha_offset_ft: 30.0 }
              as: Borrower
              as_user_id: "borrower-a"
              captures: { disp_a_id: $.data.id, disp_a_due: $.data.decision_due_at }
            - call: "POST /flood-zone/disputes/${disp_a_id}/provider-review"
              payload: { provider_recommendation: "UPHOLD" }
              as: ProviderReviewer
              as_user_id: "reviewer-1"
            - call: "POST /flood-zone/disputes/${disp_a_id}/agency-review"
              payload: { agency_concurrence: "NON_CONCUR" }
              as: AgencyOfficer
              as_user_id: "agency-1"
              captures: { disp_a_round: $.data.round_number }
            - call: "POST /flood-zone/disputes/${disp_a_id}/provider-review"
              payload: { provider_recommendation: "UPHOLD" }
              as: ProviderReviewer
              as_user_id: "reviewer-1"
            - call: "POST /flood-zone/disputes/${disp_a_id}/agency-review"
              payload: { agency_concurrence: "CONCUR" }
              as: AgencyOfficer
              as_user_id: "agency-1"
              captures: { disp_a_resolution: $.data.resolution }
          assert:
            - "after the dispute is filed: Determination.${det_a_id}.status == UNDER_DISPUTE and Dispute.${disp_a_id}.status == SUBMITTED and Dispute.${disp_a_id}.round_number == 1"
            - "Dispute.${disp_a_id}.decision_due_at == 2026-08-31T00:00:00Z (filed_at + DISPUTE_DECISION_DAYS 30)"
            - "after the NON_CONCUR remand: Dispute.${disp_a_id}.status == SUBMITTED, Dispute.${disp_a_id}.round_number == 2, Dispute.${disp_a_id}.provider_recommendation == null, Dispute.${disp_a_id}.provider_reviewed_by_user_id == null"
            - "the remand does NOT move the determination: Determination.${det_a_id}.status == UNDER_DISPUTE throughout round 2"
            - "final: Dispute.${disp_a_id}.status == DENIED and Dispute.${disp_a_id}.resolution == UPHELD_BY_CONCURRENCE and Dispute.${disp_a_id}.resolved_at == 2026-08-01T00:00:00Z"
            - "cycle closed: Determination.${det_a_id}.status == ISSUED again, Determination.${det_a_id}.superseded_at == null"
            - "Dispute.${disp_a_id}.revised_determination_id == null and Structure.${st_a_id}.sfha_offset_ft == -12.0 (a denial mutates nothing)"
            - "GET /flood-zone/determinations?loan_folio_id=${f_a_id} returns exactly 1 determination (no revision was minted)"

