  # -------------------------------------------------------------------
  - section: errors
    instances:

      - name: six_duplicate_business_key_errors_are_distinct
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_LOCATION_CODE
          - errors.ERR_DUPLICATE_CASING_SERIAL
          - errors.ERR_DUPLICATE_VEHICLE_UNIT
          - errors.ERR_DUPLICATE_TIRE_POLICY
          - errors.ERR_DUPLICATE_LINE_CODE
          - errors.ERR_DUPLICATE_AGREEMENT_CODE
        distinguishing_aspect: "Six uniqueness errors share one HTTP status but must not share one error_id, and their scopes differ: location_code, casing_serial and agreement_code are globally unique, while vehicle unit_number is unique per fleet, tire policy per (fleet, position) and line_code per location — so the same unit_number under a different fleet is accepted."
        test_recipe:
          setup: ["two locations, two fleets, one vehicle, one DRIVE policy, one line and one agreement already created"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Unique Commercial", location_code: "UQC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4032", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { locA_id: $.data.id }
            - call: "POST /service-locations"
              payload: { name: "Unique Second", location_code: "UQD", state_code: "IN", road_service_response_minutes_committed: 120, scrap_permit_number: "IN-SCRAP-4032", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { locB_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Unique Fleet A", account_type: "NATIONAL_ACCOUNT", home_location_id: "${locA_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleetA_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Unique Fleet B", account_type: "SINGLE_LOCATION", home_location_id: "${locB_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleetB_id: $.data.id }
            - call: "POST /fleet-accounts/${fleetA_id}/vehicles"
              payload: { unit_number: "T-200", vehicle_type: "TRACTOR", current_odometer_miles: 1000 }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleetA_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
