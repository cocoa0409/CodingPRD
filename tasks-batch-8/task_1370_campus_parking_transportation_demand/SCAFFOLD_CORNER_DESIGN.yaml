              as: ParkingAdmin
          trigger:
            - call: "GET /parking/lots/${lot_av}"
              as: ParkingAdmin
              captures: { avail: $.data.available_capacity, reserved: $.data.reserved_spaces_total }
          assert:
            - "captured avail == 74 and reserved == 25"

