scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: escalated_cost_present_vs_year_of_need
        grounds:
          - calculations.escalated_cost
          - calculations.waterfall_allocation
          - entities.PlanLineItem.fields.escalated_cost_cents
        distinguishing_aspect: |
          Same deficiency cost_estimate_cents yields two different dollar figures depending on variant:
          present_day_cost leaves backlog at the raw estimate while escalated_to_year_of_need compounds
          at the scenario escalation_rate — this instance exercises dual-variant costing on the
          deficiency/plan domain (distinct from the RUL variant instance on the AssetSystem domain).
        test_recipe:
          setup:
            - "Facility F with one ACTIVE AssetSystem (HVAC, replacement_cost_cents=100000000, install_year 2010, design_life 25, rating 4)"
            - "Deficiency D on that system: cost_estimate_cents=100000000, severity 3, urgency 3, recommended_year 2029, no code/accessibility flags"
            - "CapitalPlan P for F: start_year 2027, horizon_years 3, status DRAFT"
            - "FundingScenario S under P: annual_budget_cents=200000000, escalation_rate 0.03, status CONFIGURED"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Plant 1", address: "1 Industrial Way", gross_square_feet: 50000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "Chiller 1", install_year: 2010, design_life_years: 25, replacement_cost_cents: 100000000, condition_rating: 4 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "Compressor bearing wear", cost_estimate_cents: 100000000, severity: 3, urgency: 3, recommended_year: 2029 }
              as: Consultant
              captures: { def_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "FY27-FY29 Plan", start_year: 2027, horizon_years: 3, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "Baseline", annual_budget_cents: 200000000, escalation_rate: 0.03 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
          trigger:
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan_v}" }
              as: CapitalPlanner
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: Consultant
              captures: { fac_backlog: "$.data.backlog_cost_cents" }
            - call: "GET /fca/plan-line-items"
              payload: { capital_plan_id: "${plan_id}" }
              as: CapitalPlanner
              captures: { item0_cost: "$.data[0].escalated_cost_cents" }
          assert:
            - "Facility.${fac_id}.backlog_cost_cents == 100000000 (present-day variant, escalation treated as 0)"
            - "PlanLineItem[0].escalated_cost_cents == 109272700 (escalated_to_year_of_need variant: 100000000 * 1.03^3 round_half_up)"
            - "backlog_cost_cents != escalated_cost_cents — the two variants diverge for identical input data"
      - name: rul_optimistic_vs_pessimistic_refresh_health
        grounds:
          - calculations.remaining_useful_life
          - calculations.plan_refresh_health
          - entities.AssetSystem.fields.remaining_useful_life_years
        distinguishing_aspect: |
          Same AssetSystem age/rating data yields remaining_useful_life_years = 9 under the optimistic
          display variant while the pessimistic variant used by plan_refresh_health yields 7 — a
          dual-variant RUL calculation on the AssetSystem domain, distinct from the cost-escalation
          variant on the Deficiency/Plan domain.
        test_recipe:
          setup:
            - "Facility F with one ACTIVE AssetSystem: install_year 2010, design_life_years 25, condition_rating 4, replacement_cost_cents 50000000"
            - "Logical clock at default 2026-08-01T00:00:00Z (year 2026)"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Beta LLC", contact_email: "pm@beta.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Office A", address: "9 Main St", gross_square_feet: 20000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "Membrane Roof", install_year: 2010, design_life_years: 25, replacement_cost_cents: 50000000, condition_rating: 4 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
          trigger:
            - call: "GET /fca/asset-systems/${sys_id}"
              payload: {}
              as: Consultant
              captures: { rul_display: "$.data.remaining_useful_life_years" }
            - call: "GET /fca/facilities/${fac_id}/refresh-health"
              payload: {}
              as: Consultant
              captures: { stressed: "$.data.stressed_backlog_cents" }
          assert:
            - "AssetSystem.${sys_id}.remaining_useful_life_years == 9 (optimistic variant: max(0, 25 - (2026-2010)))"
            - "pessimistic variant over the same inputs = max(0, 9 - 2) = 7; refresh-health evaluates the pessimistic variant while the entity read exposes the optimistic one"
            - "refresh-health on this deficiency-free facility returns stressed_backlog_cents == 0 and health == 'GOOD', while the stored display RUL remains 9 — the variants are distinct computations over identical inputs"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_weighted_multi_input
        grounds:
          - calculations.deficiency_priority_score
        distinguishing_aspect: |
          Mode (a) combinatorial: the formula takes >=3 inputs (severity, urgency, is_code_violation,
          is_accessibility_violation) with non-linear conditional branches (two additive flag bonuses),
          exercised here with all four combinations of the two boolean flags.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE AssetSystem S (PLUMBING, install 2015, design 20, rating 3, replacement 30000000)"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Gamma Inc", contact_email: "g@gamma.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Depot", address: "4 Dock Rd", gross_square_feet: 8000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "PLUMBING", name: "Domestic Water", install_year: 2015, design_life_years: 20, replacement_cost_cents: 30000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
          trigger:
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "no flags", cost_estimate_cents: 1000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { d_none: "$.data.id", s_none: "$.data.priority_score" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "code only", cost_estimate_cents: 1000000, severity: 3, urgency: 3, is_code_violation: true, recommended_year: 2027 }
              as: Consultant
              captures: { d_code: "$.data.id", s_code: "$.data.priority_score" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "accessibility only", cost_estimate_cents: 1000000, severity: 3, urgency: 3, is_accessibility_violation: true, recommended_year: 2027 }
              as: Consultant
              captures: { d_acc: "$.data.id", s_acc: "$.data.priority_score" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "both flags", cost_estimate_cents: 1000000, severity: 3, urgency: 3, is_code_violation: true, is_accessibility_violation: true, recommended_year: 2027 }
              as: Consultant
              captures: { d_both: "$.data.id", s_both: "$.data.priority_score" }
          assert:
            - "Deficiency.${d_none}.priority_score == 3.00 (0.6*3 + 0.4*3)"
            - "Deficiency.${d_code}.priority_score == 13.00 (+10 code branch)"
            - "Deficiency.${d_acc}.priority_score == 8.00 (+5 accessibility branch)"
            - "Deficiency.${d_both}.priority_score == 18.00 (both branches compose additively, 3.00 + 10 + 5)"
      - name: waterfall_per_item_rounding_then_compare
        grounds:
          - calculations.waterfall_allocation
          - calculations.escalated_cost
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: each item's escalated cost is rounded
          (round_half_up, integer cents) ONCE before the budget-remainder comparison, and the pinned
          order (round per-item, then subtract; never round the running remainder) decides whether
          the second item funds — a different combinatorial mode than the weighted-branch formula.
        test_recipe:
          setup:
            - "Facility F with one ACTIVE AssetSystem (ELECTRICAL, install 2012, design 30, rating 4, replacement 500000000)"
            - "Deficiency D1: cost 60000000 cents, severity 5, urgency 4, code flag true, recommended_year 2027 (priority 14.60)"
            - "Deficiency D2: cost 50000000 cents, severity 3, urgency 3, no flags, recommended_year 2027 (priority 3.00, created strictly after D1)"
            - "CapitalPlan P: start_year 2027, horizon_years 3, DRAFT"
            - "FundingScenario S: annual_budget_cents 100000000, escalation_rate 0.03"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Delta Co", contact_email: "d@delta.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Tower", address: "7 Hill Ave", gross_square_feet: 120000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ELECTRICAL", name: "Main Switchgear", install_year: 2012, design_life_years: 30, replacement_cost_cents: 500000000, condition_rating: 4 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "Arc-flash remediation", cost_estimate_cents: 60000000, severity: 5, urgency: 4, is_code_violation: true, recommended_year: 2027 }
              as: Consultant
              captures: { d1_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "Panel labeling", cost_estimate_cents: 50000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { d2_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "FY27 Plan", start_year: 2027, horizon_years: 3, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "Tight", annual_budget_cents: 100000000, escalation_rate: 0.03 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
          trigger:
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan_v}" }
              as: CapitalPlanner
          assert:
            - "PlanLineItem for ${d1_id}: escalated_cost_cents == 61800000 and funding_status == FUNDED (round_half_up(60000000 * 1.03) once = 61800000 <= 100000000)"
            - "PlanLineItem for ${d2_id}: escalated_cost_cents == 51500000 and funding_status == UNFUNDED (51500000 > 100000000 - 61800000 = 38200000)"
            - "CapitalPlan.${plan_id}.total_programmed_cents == 61800000 (sum of FUNDED items only)"
            - "Ordering note: per-item rounded cost is compared against the un-rounded remainder; rounding the remainder first would be a different formula and is forbidden"

  - rule_id: non_linear_state_machine
    instances:
      - name: capital_plan_reject_revise_cycle
        grounds:
          - state_machines.CapitalPlan.SUBMITTED_to_REJECTED
          - state_machines.CapitalPlan.REJECTED_to_DRAFT
        distinguishing_aspect: |
          CapitalPlan exhibits a revision loop (DRAFT -> SUBMITTED -> REJECTED -> DRAFT), a cyclic
          non-linear shape on the CapitalPlan entity — distinct from the parallel-dimensions shape
          on Deficiency.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE system, one OPEN deficiency (cost 10000000, sev 3, urg 3, rec_year 2027)"
            - "CapitalPlan P DRAFT with scenario run so that one FUNDED line item exists; plan submittable"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Epsilon Ltd", contact_email: "e@epsilon.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Lab", address: "2 Science Park", gross_square_feet: 30000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "FIRE_PROTECTION", name: "Sprinklers", install_year: 2008, design_life_years: 25, replacement_cost_cents: 80000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "Head corrosion", cost_estimate_cents: 10000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P1", start_year: 2027, horizon_years: 2, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "Base", annual_budget_cents: 50000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan_v}" }
              as: CapitalPlanner
          trigger:
            - call: "POST /fca/capital-plans/${plan_id}/submit"
              payload: {}
              as: CapitalPlanner
            - call: "POST /fca/capital-plans/${plan_id}/reject"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
            - call: "POST /fca/capital-plans/${plan_id}/revise"
              payload: {}
              as: CapitalPlanner
            - call: "POST /fca/capital-plans/${plan_id}/submit"
              payload: {}
              as: CapitalPlanner
          assert:
            - "after reject: CapitalPlan.${plan_id}.status == REJECTED"
            - "after revise: CapitalPlan.${plan_id}.status == DRAFT (loop back to origin state)"
            - "second submit succeeds: CapitalPlan.${plan_id}.status == SUBMITTED (cycle is repeatable)"
      - name: deficiency_parallel_remediation_verification_dimensions
        grounds:
          - state_machines.Deficiency
          - entities.Deficiency.fields.remediation_status
          - entities.Deficiency.fields.verification_status
        distinguishing_aspect: |
          Deficiency carries two independent parallel state dimensions (remediation_status x
          verification_status) evolving on one row — verify is illegal until remediation CORRECTED,
          and verification rejection drives remediation backwards (IN_PROGRESS), a cross-dimension
          interaction distinct from CapitalPlan's cycle.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE system, one Deficiency D (cost 2000000, sev 3, urg 3, rec_year 2027) in OPEN/UNVERIFIED"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Zeta SA", contact_email: "z@zeta.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Annex", address: "3 Oak Ln", gross_square_feet: 9000 }
              as: Consultant
              captures: { fac_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "CONVEYANCE", name: "Elevator 1", install_year: 2011, design_life_years: 25, replacement_cost_cents: 90000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "Controller obsolete", cost_estimate_cents: 2000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id" }
          trigger:
            - call: "POST /fca/deficiencies/${def_id}/start-remediation"
              payload: {}
              as: FacilityManager
            - call: "POST /fca/deficiencies/${def_id}/complete-remediation"
              payload: {}
              as: FacilityManager
            - call: "POST /fca/deficiencies/${def_id}/reject-verification"
              payload: {}
              as: Consultant
            - call: "POST /fca/deficiencies/${def_id}/complete-remediation"
              payload: {}
              as: FacilityManager
            - call: "POST /fca/deficiencies/${def_id}/verify"
              payload: {}
              as: Consultant
          assert:
            - "after start+complete: remediation_status == CORRECTED, verification_status == UNVERIFIED (dimensions independent)"
            - "reject-verification drives remediation_status CORRECTED -> IN_PROGRESS while verification_status becomes REJECTED"
            - "after second complete + verify: remediation_status == CORRECTED and verification_status == VERIFIED (terminal pair)"
            - "verify while remediation_status == OPEN would fail with ERR_INVALID_STATE (cross-dimension precondition)"

  - rule_id: transitive_cascade
    instances:
      - name: retire_system_cascades_to_line_item_and_plan_total
        grounds:
          - state_machines.AssetSystem.ACTIVE_to_RETIRED
          - calculations.facility_condition_index
        distinguishing_aspect: |
          Depth-3 cascade: AssetSystem.retire mutates PlanLineItem (FUNDED -> REMOVED), which itself
          triggers recompute of CapitalPlan.total_programmed_cents, while the retire also recomputes
          Facility CRV/FCI — chain A(retire) -> B(line item) -> C(plan total) with each link caused
          by the previous link. The deficiency is first corrected so the retire precondition passes.
        test_recipe:
          setup:
            - "Facility F with ACTIVE systems S1 (replacement 500000000) and S2 (replacement 300000000)"
            - "Deficiency D on S1: cost 10000000, sev 3 urg 3, rec_year 2027; remediated CORRECTED so retire is legal"
            - "DRAFT CapitalPlan P (2027, horizon 2) with scenario run at escalation 0.0: D FUNDED at 10000000; P.total_programmed_cents == 10000000"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Eta GmbH", contact_email: "eta@eta.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Warehouse", address: "11 Rail Spur", gross_square_feet: 60000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "ROOF", name: "Roof A", install_year: 2005, design_life_years: 25, replacement_cost_cents: 500000000, condition_rating: 3 }
              as: Consultant
              captures: { sys1_id: "$.data.id" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "INTERIOR", name: "Finishes", install_year: 2015, design_life_years: 15, replacement_cost_cents: 300000000, condition_rating: 4 }
              as: Consultant
              captures: { sys2_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys1_id}", description: "Membrane failure", cost_estimate_cents: 10000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { def_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 2, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "Flat", annual_budget_cents: 50000000, escalation_rate: 0.0 }
              as: CapitalPlanner
              captures: { scen_id: "$.data.id" }
            - call: "POST /fca/funding-scenarios/${scen_id}/run"
              payload: { expected_capital_plan_version: "${plan_v}" }
              as: CapitalPlanner
            - call: "POST /fca/deficiencies/${def_id}/start-remediation"
              payload: {}
              as: FacilityManager
            - call: "POST /fca/deficiencies/${def_id}/complete-remediation"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fca/asset-systems/${sys1_id}/retire"
              payload: {}
              as: FacilityManager
            - call: "GET /fca/plan-line-items"
              payload: { capital_plan_id: "${plan_id}" }
              as: CapitalPlanner
              captures: { item0_status: "$.data[0].funding_status" }
            - call: "GET /fca/capital-plans/${plan_id}"
              payload: {}
              as: CapitalPlanner
              captures: { plan_total: "$.data.total_programmed_cents" }
            - call: "GET /fca/facilities/${fac_id}"
              payload: {}
              as: Consultant
              captures: { crv_after: "$.data.current_replacement_value_cents", fci_after: "$.data.facility_condition_index" }
          assert:
            - "AssetSystem.${sys1_id}.status == RETIRED"
            - "PlanLineItem for ${def_id} (the only line item) has funding_status == REMOVED (link 1: retire -> line item)"
            - "CapitalPlan.${plan_id}.total_programmed_cents == 0 (link 2: line-item removal recomputes plan total)"
            - "Facility.${fac_id}.current_replacement_value_cents == 300000000 (RETIRED system excluded from CRV; only S2 remains)"
            - "Facility.${fac_id}.facility_condition_index == 0.0000 (backlog already 0 after correction; CRV recomputed)"
      - name: scenario_run_supersedes_prior_run_removing_its_line_items
        grounds:
          - state_machines.FundingScenario.CONFIGURED_to_RUN
          - calculations.waterfall_allocation
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: FundingScenario.run mutates the sibling scenario
          (RUN -> SUPERSEDED), whose own mutation forces its PlanLineItem rows to REMOVED and
          recomputes CapitalPlan.total_programmed_cents — trigger differs from the retire cascade.
        test_recipe:
          setup:
            - "Facility F, one ACTIVE system, deficiency D1 (cost 40000000, sev 3, urg 3, rec_year 2027, OPEN)"
            - "Plan P (2027, horizon 1, DRAFT); Scenario S_A budget 50000000 esc 0.0; Scenario S_B budget 30000000 esc 0.0"
          setup_api_calls:
            - call: "POST /fca/clients"
              payload: { name: "Theta NV", contact_email: "t@theta.example" }
              as: Consultant
              captures: { client_id: "$.data.id" }
            - call: "POST /fca/facilities"
              payload: { client_id: "${client_id}", name: "Clinic", address: "5 Elm St", gross_square_feet: 15000 }
              as: Consultant
              captures: { fac_id: "$.data.id", fac_v: "$.data.version" }
            - call: "POST /fca/asset-systems"
              payload: { facility_id: "${fac_id}", system_category: "HVAC", name: "RTU-1", install_year: 2009, design_life_years: 20, replacement_cost_cents: 60000000, condition_rating: 3 }
              as: Consultant
              captures: { sys_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
