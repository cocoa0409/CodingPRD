          Two more metrics on a third endpoint, POST /staff-shifts: the gap in minutes between a new
          shift and an existing one measured against REST_BUFFER_MIN 30 (closed-interval buffer, so a gap
          of exactly 30 still collides and 31 is the first admissible gap), and the shift's own duration
          measured against MAX_SHIFT_MINUTES 600 (exactly 600 is admissible, 601 is not). Both edges are
          one minute wide and they sit on opposite sides of the inclusive/exclusive divide, so an
          implementation that uses the same comparison operator for both fails exactly one of the four
          calls.
