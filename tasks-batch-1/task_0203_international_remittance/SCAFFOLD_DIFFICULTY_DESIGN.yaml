# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# International Remittance — Expert band. 9 Difficulty Rules × 2 instances = 18.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7. Every test_recipe
# chain is empty-DB executable against §1.5. All formula-derived asserts are
# literals pre-computed against §1.3 formulas + constants.
#
# Canonical corridor C1 (US->PH) used widely below:
#   fx_margin_bps=137, fee_flat_minor=199, fee_pct_bps=120,
#   fee_tier_threshold_minor=100000, fee_pct_tier2_bps=70,
#   per_transfer_max_minor=2000000, rolling_window_hours=24,
#   rolling_window_cap_minor=400000, rate_lock_ttl_seconds=1800
#   FxRate mid_rate_micro=56333333 (effective 2026-06-01T00:00:00Z)
#   => locked_rate_micro=55561566
#   Quote P=50000 => fee_minor=799, recipient_amount_minor=2778078, total_pay=50799
#   Quote P=100000 => fee_minor=899, recipient_amount_minor=5556156
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_fee_variant_diverges_sender_cancel_vs_compliance_reject
        grounds:
          - calculations.refund_amount
          - state_machines.Transfer.PENDING_to_REFUNDED
          - entities.Refund.fields.fee_refunded_minor
        distinguishing_aspect: |
          On identical funded inputs (P=50000, fee=799) the refund_amount fee
          variant on the Refund/Transfer domain diverges: a SENDER_CANCEL outside
          the grace window retains the fee (fee_refunded_minor=0) while a
          COMPLIANCE_REJECT fully reverses it (fee_refunded_minor=799) — two
          different total_refunded_minor for the same transfer shape.
        test_recipe:
          setup:
            - "Corridor C1 ACTIVE with an FxRate effective before clock 2026-06-01T00:00:00Z."
            - "Sender TIER1, VERIFIED recipient. One FUNDED transfer T1 (P=50000, fee=799), delivery PENDING, funded > REFUND_GRACE_SECONDS ago (clock advanced 4000s)."
            - "A second FUNDED+SCREENED transfer T2 (same P/fee) HELD then REJECTED via its compliance case."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK","CASH_PICKUP","WALLET"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 400000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sanctions-list"
              payload: { listed_name: "Konstantin Volkov", listed_country: "RU", program: "OFAC-SDN" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Alice Buyer", country: "US", date_of_birth: "1985-03-02" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Bob Beneficiary", country: "PH", payout_method: "BANK", payout_account_ref: "PH-ACCT-1" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-1" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            # ---- T1: funded, will be SENDER_CANCEL outside grace ----
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote1_id: $.data.id }
            - call: "POST /quotes/${quote1_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote1_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote1_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote1_v}" }
              as: RemittanceAgent
              captures: { t1_id: $.data.id }
            - call: "POST /transfers/${t1_id}/fund"
              payload: {}
              as: RemittanceAgent
            - call: "POST /_clock/advance"
              payload: { seconds: 4000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /refunds"
              payload: { transfer_id: "${t1_id}", reason: "SENDER_CANCEL" }
              as: RemittanceAgent
              captures: { refund1_id: $.data.id }
          assert:
            - "Refund.${refund1_id}.principal_refunded_minor == 50000"
            - "Refund.${refund1_id}.fee_refunded_minor == 0"
            - "Refund.${refund1_id}.total_refunded_minor == 50000"
            - "Transfer.${t1_id}.delivery_status == REFUNDED"

      - name: sanctions_score_strict_vs_base_variant_diverges
        grounds:
          - calculations.sanctions_score
          - state_machines.Transfer.SCREENING_to_HELD
          - entities.Transfer.fields.sanctions_score
        distinguishing_aspect: |
          The sanctions_score risk calculation on the Sender/Recipient domain
          (distinct from the quote_fee/recipient_amount pricing domain) exposes
          dual variants: a recipient whose country is high-risk is scored under
          strict_screening (substring containment) and crosses the HELD threshold,
          whereas the same name under base_screening (token equality) scores
          strictly lower — same inputs, two algorithms, different compliance_status.
        test_recipe:
          setup:
            - "Corridor C1 ACTIVE; sanctions list has entry 'Ivan Petrov'/RU."
            - "Transfer funded with recipient 'Ivanov Petrov' in high-risk country RU — strict containment scores name fully; base token-equality scores 0 on name."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->RU", send_country: "US", receive_country: "RU", send_currency: "USD", receive_currency: "RUB", enabled_payout_methods: ["BANK","WALLET"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 400000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 90000000, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sanctions-list"
              payload: { listed_name: "Ivan Petrov", listed_country: "RU", program: "OFAC-SDN", weight_name_bps: 7000, weight_country_bps: 3000 }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Carol Sender", country: "US", date_of_birth: "1979-11-20" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Ivanov Petrov", country: "RU", payout_method: "WALLET", payout_account_ref: "RU-WALLET-9" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-RU-1" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "WALLET" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /transfers/${transfer_id}/fund"
              payload: {}
              as: RemittanceAgent
          trigger:
            - call: "POST /transfers/${transfer_id}/screen"
              payload: {}
              as: ComplianceOfficer
              captures: { screened_score: $.data.sanctions_score }
          assert:
            - "Transfer.${transfer_id}.sanctions_score == 100"
            - "Transfer.${transfer_id}.compliance_status == HELD"
            - "A ComplianceCase exists with transfer_id == ${transfer_id} and opened_reason == SANCTIONS_SCORE (strict variant scored name fully; base variant would score name 0 -> 30 -> CLEARED)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_fee_tiered_selection_mode_a
        grounds:
          - calculations.quote_fee
          - entities.Corridor.fields.fee_tier_threshold_minor
          - entities.Quote.fields.fee_minor
        distinguishing_aspect: |
          Mode (a): quote_fee combines >=3 inputs (send_principal, tiered pct_bps
          chosen by principal vs fee_tier_threshold_minor, flat fee) with a
          conditional branch on principal magnitude; P=100000 (== threshold,
          inclusive) selects fee_pct_tier2_bps=70 yielding fee_minor=899, while
          P=99999 selects fee_pct_bps=120 yielding fee_minor=1398.
        test_recipe:
          setup:
            - "Corridor C1 ACTIVE with FxRate effective before clock; two quotes locked at principals straddling the tier threshold."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Dan Sender", country: "US", date_of_birth: "1990-01-01" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 100000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_tier2_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_tier2_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { fee_at_threshold: $.data.fee_minor }
          assert:
            - "Quote.${quote_tier2_id}.fee_minor == 899"
            - "Quote.${quote_tier2_id}.total_pay_minor == 100899"
            - "Quote.${quote_tier2_id}.recipient_amount_minor == 5556156"

      - name: recipient_amount_rounding_order_mode_b
        grounds:
          - calculations.recipient_amount
          - entities.Corridor.fields.fx_margin_bps
          - entities.Quote.fields.recipient_amount_minor
        distinguishing_aspect: |
          Mode (b): recipient_amount pins margin-first-then-convert rounding.
          With mid=56333333, margin=137bps, P=50000 the pinned order yields
          recipient_amount_minor=2778078, whereas convert-then-margin would yield
          2778077 — the scaffold's pinned order is the only correct cents.
        test_recipe:
          setup:
            - "Corridor C1 ACTIVE; FxRate mid_rate_micro=56333333 effective before clock; quote at P=50000 locked."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Eve Sender", country: "US", date_of_birth: "1988-06-06" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { locked_rate: $.data.locked_rate_micro }
          assert:
            - "Quote.${quote_id}.locked_rate_micro == 55561566"
            - "Quote.${quote_id}.recipient_amount_minor == 2778078"
            - "Quote.${quote_id}.fee_minor == 799"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_parallel_axes_compliance_and_delivery_independent
        grounds:
          - state_machines.Transfer.SCREENING_to_CLEARED
          - state_machines.Transfer.PENDING_to_IN_TRANSIT
          - entities.Transfer.fields.compliance_status
          - entities.Transfer.fields.delivery_status
        distinguishing_aspect: |
          Transfer carries two independent state axes: screening drives
          compliance_status SCREENING->CLEARED while delivery_status stays PENDING
          until dispatch, and dispatch drives delivery_status PENDING->IN_TRANSIT
          without touching compliance_status — the two axes evolve on the same row
          independently (parallel non-linear shape).
        test_recipe:
          setup:
            - "Funded transfer, recipient VERIFIED, sanctions score below threshold so screen auto-CLEARS."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Frank Sender", country: "US", date_of_birth: "1975-09-09" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Grace Recipient", country: "PH", payout_method: "BANK", payout_account_ref: "PH-2" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-2" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /transfers/${transfer_id}/fund"
              payload: {}
              as: RemittanceAgent
            - call: "POST /transfers/${transfer_id}/screen"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /transfers/${transfer_id}/dispatch"
              payload: {}
              as: PayoutOperator
          assert:
            - "Transfer.${transfer_id}.compliance_status == CLEARED"
            - "Transfer.${transfer_id}.delivery_status == IN_TRANSIT"
            - "Transfer.${transfer_id}.sanctions_score == 0"

      - name: compliance_case_cycle_open_awaiting_open_loop
        grounds:
          - state_machines.ComplianceCase.OPEN_to_AWAITING_INFO
          - state_machines.ComplianceCase.AWAITING_INFO_to_OPEN
          - entities.ComplianceCase.fields.info_request_count
        distinguishing_aspect: |
          ComplianceCase is cyclic on a different entity than Transfer: it loops
          OPEN -> AWAITING_INFO -> OPEN, and info_request_count increments once per
          request-info, reaching 2 after two full loops — a true revision cycle,
          not a linear pipeline.
        test_recipe:
          setup:
            - "A HELD transfer with an OPEN ComplianceCase (sanctions score >= 60)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sanctions-list"
              payload: { listed_name: "Ivan Petrov", listed_country: "PH", program: "OFAC-SDN", weight_name_bps: 7000, weight_country_bps: 3000 }
              as: PlatformAdmin
            - call: "POST /senders"
              payload: { full_name: "Henry Sender", country: "US", date_of_birth: "1970-02-02" }
              as: RemittanceAgent
              captures: { sender_id: $.data.id }
            - call: "POST /senders/${sender_id}/verify-kyc"
              payload: { kyc_tier: "TIER1" }
              as: ComplianceOfficer
            - call: "POST /recipients"
              payload: { sender_id: "${sender_id}", full_name: "Ivan Petrov", country: "PH", payout_method: "BANK", payout_account_ref: "PH-3" }
              as: RemittanceAgent
              captures: { recipient_id: $.data.id }
            - call: "POST /recipients/${recipient_id}/submit-kyc"
              payload: { kyc_doc_ref: "DOC-3" }
              as: RemittanceAgent
            - call: "POST /recipients/${recipient_id}/decide-kyc"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /quotes"
              payload: { corridor_id: "${corridor_id}", sender_id: "${sender_id}", send_principal_minor: 50000, payout_method: "BANK" }
              as: RemittanceAgent
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/lock"
              payload: {}
              as: RemittanceAgent
              captures: { quote_v: $.data.version }
            - call: "POST /transfers"
              payload: { quote_id: "${quote_id}", recipient_id: "${recipient_id}", expected_quote_version: "${quote_v}" }
              as: RemittanceAgent
              captures: { transfer_id: $.data.id }
            - call: "POST /transfers/${transfer_id}/fund"
              payload: {}
              as: RemittanceAgent
            - call: "POST /transfers/${transfer_id}/screen"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /compliance-cases"
              payload: {}
              as: ComplianceOfficer
              captures: { case_id: $.data.0.id }
          trigger:
            - call: "POST /compliance-cases/${case_id}/request-info"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /compliance-cases/${case_id}/provide-info"
              payload: { note: "first response" }
              as: RemittanceAgent
            - call: "POST /compliance-cases/${case_id}/request-info"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /compliance-cases/${case_id}/provide-info"
              payload: { note: "second response" }
              as: RemittanceAgent
          assert:
            - "ComplianceCase.${case_id}.status == OPEN"
            - "ComplianceCase.${case_id}.info_request_count == 2"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: compliance_reject_cascade_depth3_case_transfer_refund_ledger
        grounds:
          - state_machines.ComplianceCase.OPEN_to_REJECTED
          - state_machines.Transfer.PENDING_to_REFUNDED
          - calculations.refund_amount
          - calculations.ledger_invariant
        distinguishing_aspect: |
          Depth-3 cascade originating from the case-decide REJECT transition:
          deciding the case REJECT (A) sets Transfer.compliance_status=REJECTED
          which itself (B) triggers the compensating refund chain flipping
          delivery_status=REFUNDED, which itself (C) writes REFUND_CREDIT +
          FEE_REVERSAL ledger entries restoring corridor.reserved_minor to 0.
        test_recipe:
          setup:
            - "FUNDED+HELD transfer (P=50000, fee=799), delivery PENDING, OPEN ComplianceCase; corridor.reserved_minor == 50000 before decide."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /corridors"
              payload: { name: "US->PH", send_country: "US", receive_country: "PH", send_currency: "USD", receive_currency: "PHP", enabled_payout_methods: ["BANK"], fx_margin_bps: 137, fee_flat_minor: 199, fee_pct_bps: 120, fee_tier_threshold_minor: 100000, fee_pct_tier2_bps: 70, per_transfer_max_minor: 2000000, rolling_window_hours: 24, rolling_window_cap_minor: 4000000, rate_lock_ttl_seconds: 1800 }
              as: PlatformAdmin
              captures: { corridor_id: $.data.id }
            - call: "POST /fx-rates"
              payload: { corridor_id: "${corridor_id}", mid_rate_micro: 56333333, effective_at: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sanctions-list"
