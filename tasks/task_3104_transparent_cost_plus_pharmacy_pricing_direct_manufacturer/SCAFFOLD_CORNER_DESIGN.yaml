        distinguishing_aspect: >
          The overview variant is a units-weighted average, so a 100-unit row at 20
          cents barely moves the 12-cent, 900-unit row: the result is 13 and not the
          12 a cheapest-row reading would return.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Drug D has eligible rows {P1 12c x 900u, P2 20c x 100u}."
