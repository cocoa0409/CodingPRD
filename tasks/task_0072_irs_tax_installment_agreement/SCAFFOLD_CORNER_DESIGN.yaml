    instances:
      - name: immediate_visibility_of_cascade_in_accept_response
        claim_type: immediate
        grounds: [state_machines.OfferInCompromise.EVALUATING_to_ACCEPTED, entities.TaxAccount.fields.collection_status]
        excluded_because:
          difficulty_instance: transitive_cascade / oic_accept_depth3_payment_abate_account_resolve_agreement_close
