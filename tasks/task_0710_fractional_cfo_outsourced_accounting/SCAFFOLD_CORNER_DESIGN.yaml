      - name: covenant_breach_below_floor_422
        claim_type: Violation to Error
        grounds: ["validations[priority=14]", "errors[ERR_COVENANT_BREACH]"]
        distinguishing_aspect: "Approving a forecast whose min_projected_balance_cents (399999) is one cent below covenant_floor_cents (400000) returns ERR_COVENANT_BREACH (422). The §1.8 boundary instance shows the inclusive >= pass; this shows the strict-below failure."
