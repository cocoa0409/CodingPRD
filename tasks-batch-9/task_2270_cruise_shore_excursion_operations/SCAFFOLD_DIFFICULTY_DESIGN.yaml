  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: operator_vetting_info_request_loop_is_capped_at_three_cycles
        grounds:
          - state_machines.TourOperator.SUBMITTED_to_INFO_REQUESTED
          - state_machines.TourOperator.INFO_REQUESTED_to_SUBMITTED
          - entities.TourOperator.fields.vetting_cycle_count
          - validations[27].ERR_VETTING_CYCLE_EXHAUSTED
          - endpoints[POST /shore-excursions/operators/{operatorId}/vetting-actions]
        distinguishing_aspect: |
          Cycle: TourOperator.vetting_status revisits SUBMITTED through the
          SUBMITTED -> INFO_REQUESTED -> SUBMITTED loop, and the loop is bounded by a counter
          rather than by a state — the fourth RESUBMIT is refused with ERR_VETTING_CYCLE_EXHAUSTED
          while the operator is left parked in INFO_REQUESTED with vetting_cycle_count 4.
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port."
            - "One operator in DRAFT has one INITIAL SafetyAudit and insurance valid to 2027-06-30, so SUBMIT is available."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Maya Reef Excursions", contact_email: "ops@maya.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 1800 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-07-20T00:00:00Z", raw_score: 82, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "SUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
          trigger:
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "REQUEST_INFO", note: "cycle 1" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "RESUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "REQUEST_INFO", note: "cycle 2" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "RESUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "REQUEST_INFO", note: "cycle 3" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "RESUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "REQUEST_INFO", note: "cycle 4" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "RESUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
          assert:
            - "the third RESUBMIT (vetting_cycle_count 3) returns 200 and TourOperator.${op_id}.vetting_status == SUBMITTED"
            - "the fourth REQUEST_INFO returns 200 and TourOperator.${op_id}.vetting_cycle_count == 4"
            - "the fourth RESUBMIT returns 422 with data.error_id == ERR_VETTING_CYCLE_EXHAUSTED"
            - "TourOperator.${op_id}.vetting_status == INFO_REQUESTED"
            - "TourOperator.${op_id}.vetting_cycle_count == 4"
            - "TourOperator.${op_id}.safety_score == 82"

      - name: booking_fulfillment_and_financial_dimensions_advance_independently
        grounds:
          - state_machines.Booking.fulfillment_status.TICKETED_to_CANCELLED_BY_GUEST
          - state_machines.Booking.financial_status.CHARGED_to_PARTIALLY_REFUNDED
          - state_machines.Booking.financial_status.PARTIALLY_REFUNDED_to_REFUNDED
          - state_machines.ExcursionDeparture.SELLING_to_CANCELLED_WEATHER
          - calculations.guest_refund_settlement
          - entities.Booking.fields.refunded_cents
          - entities.Booking.fields.retained_cents
          - entities.RefundLedgerEntry
        distinguishing_aspect: |
          Parallel dimensions: Booking carries two independent state dimensions. The guest cancellation
          drives fulfillment_status to the terminal CANCELLED_BY_GUEST while financial_status only reaches
          PARTIALLY_REFUNDED; the later WEATHER cancellation of the departure then advances the financial
          dimension PARTIALLY_REFUNDED -> REFUNDED and leaves the fulfillment dimension untouched at
          CANCELLED_BY_GUEST (it is NOT rewritten to CANCELLED_BY_LINE).
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port with one APPROVED operator and one PUBLISHED PREMIUM excursion at base_price_cents 12000."
            - "Port call V2609 is OPEN_FOR_SALE; one SELLING departure meets 2026-09-15T09:00:00Z with capacity 40 split 25/15."
            - "One GOLD guest holds a party_size 4 PRE_CRUISE booking quoted 48508, fee 1455, charge 49963, TICKETED and CHARGED."
