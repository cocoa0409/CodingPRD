        distinguishing_aspect: "Four equal 2500 bp units against a pinned pool of 916667 cents make the per-line round_half_up OVERSHOOT (4 x 229167 = 916668), so the drift is -1 and STEP 5 must SUBTRACT a cent from the first participant in interest_bp DESC / created_at ASC order — implementations that only handle positive remainders leave the post-condition sum(share) == pool_cents broken by one cent."
