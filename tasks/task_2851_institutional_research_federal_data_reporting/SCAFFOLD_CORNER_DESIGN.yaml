      - name: corner_sm_cohort_lock_blocked_while_an_exclusion_claim_is_unresolved
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=12]
          - errors[ERR_UNRESOLVED_EXCLUSION_CLAIM]
          - state_machines.CohortMember.CLAIMED_to_DENIED
          - state_machines.CohortDefinition.DRAFT_to_LOCKED
        distinguishing_aspect: |
          A single CLAIMED exclusion blocks the cohort lock with ERR_UNRESOLVED_EXCLUSION_CLAIM
          (409); denying that claim leaves the member in the denominator, so the lock then
          succeeds with initial_count 4, adjusted_count 4 and federal_rate_pct 50.0.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is CENSUS_LOCKED; clock at 2026-11-01T00:00:00Z."
            - "DRAFT GRAD_RATE_150 cohort FALL2020 holds S001 and S002 COMPLETED_150, S003 and S004 NO_LONGER_ENROLLED; S004 has a CLAIMED ARMED_FORCES exclusion."
