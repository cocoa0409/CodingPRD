          trigger:
            - { call: "POST /estate/sale-events", payload: { project_id: "${proj_id}", crew_id: "${crew_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-07T10:00:00Z" }, as: SaleManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_CREW_DOUBLE_BOOKED"

  # ---------------------------------------------------------------------------
