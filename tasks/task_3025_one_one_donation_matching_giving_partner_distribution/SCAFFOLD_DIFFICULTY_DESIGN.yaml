  # ===========================================================================
  # Rule 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: settlement_hops_line_to_line_to_product_to_season_to_partner
        grounds:
          - state_machines.DonationProductLine.ACTIVE_to_VESTED
          - state_machines.DonationProduct.RETIRED_to_ACTIVE
          - state_machines.DonationLiability.ACCUMULATING_to_ACCUMULATING
          - state_machines.SalesOrder.PAID_to_DONATION_SATISFIED
        distinguishing_aspect: "Five dependent hops from one trigger: settling a line mutates its DonationProductLine, which makes every sibling line of the product evaluable by the product-level roll-up, which rewrites the product's obligation total, which rewrites the season aggregate, which rewrites each participating partner's attributed units — and each hop names the preceding hop as its cause."
