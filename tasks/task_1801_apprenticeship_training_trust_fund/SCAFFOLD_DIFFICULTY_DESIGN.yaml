# =============================================================================
# §1.8 Scaffold Difficulty Design — Apprenticeship & Training Trust Fund (JATC)
# Two instances per Difficulty Rule (§0.5); every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is replayable from empty-DB via §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_contribution_provisional_vs_final
        grounds:
          - "calculations.contribution_due_cents"
          - "entities.ContributionReport.fields.provisional_due_cents"
          - "entities.ContributionReport.fields.contribution_due_cents"
        distinguishing_aspect: |
          Contribution-domain dual variant: provisional_due_cents is computed at
          report creation with the employer rate at that moment, while
          contribution_due_cents is recomputed at submit with the rate in effect
          then — an intervening PATCH to the employer rate makes the same lines
          price differently (50000 vs 60000 cents).
        test_recipe:
          setup:
            - "Fund F; employer E rate 500; apprentice A INDENTURED and REGISTERED."
            - "Report R (period 2026-06, line 100 hrs for A) created while rate is 500, then the rate is raised to 600 BEFORE submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app_id}", ojt_hours: 100 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id, provisional_seen: $.data.provisional_due_cents }
            - call: "PATCH /employers/${emp_id}"
              payload: { agreement_rate_cents_per_hour: 600 }
              as: TrustAdmin
          trigger:
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { final_due: $.data.contribution_due_cents }
          assert:
            - "provisional_seen == 50000"
            - "ContributionReport.${rep_id}.contribution_due_cents == 60000"
            - "provisional_due_cents != contribution_due_cents for identical lines"
            - "Employer.${emp_id}.outstanding_cents == 60000"

      - name: dual_variant_instructor_pay_scheduled_vs_actual
        grounds:
          - "calculations.instructor_payable_cents"
          - "entities.InstructorPayClaim.fields.pay_basis"
          - "entities.InstructorPayClaim.fields.payable_cents"
        distinguishing_aspect: |
          Payroll-domain dual variant (different entity domain from the
          contribution variant): for two identical 120-minute classes at
          6000 cents/hour, pay_basis SCHEDULED yields 12000 cents while pay_basis
          ACTUAL with 150 declared minutes (exactly the 125% cap) yields 15000.
        test_recipe:
          setup:
            - "Fund F; classes C1 (600-720) and C2 (800-920, same instructor inst-1, gap 80 >= 30), both COMPLETED with empty attendance."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 10, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls1_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-102", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-B", rti_credit_value: 8, capacity: 10, start_minute: 800, end_minute: 920 }
              as: TrustAdmin
              captures: { cls2_id: $.data.id }
            - call: "POST /classes/${cls1_id}/complete"
              payload: { attended_enrollment_ids: [] }
              as: TrustAdmin
            - call: "POST /classes/${cls2_id}/complete"
              payload: { attended_enrollment_ids: [] }
              as: TrustAdmin
          trigger:
            - call: "POST /pay-claims"
              payload: { class_id: "${cls1_id}", pay_basis: "SCHEDULED" }
              as: Instructor
              as_user_id: "inst-1"
              captures: { clm1_id: $.data.id, pay1: $.data.payable_cents }
            - call: "POST /pay-claims"
              payload: { class_id: "${cls2_id}", pay_basis: "ACTUAL", actual_minutes: 150 }
              as: Instructor
              as_user_id: "inst-1"
              captures: { clm2_id: $.data.id, pay2: $.data.payable_cents }
          assert:
            - "InstructorPayClaim.${clm1_id}.payable_cents == 12000"
            - "InstructorPayClaim.${clm2_id}.payable_cents == 15000"
            - "pay1 != pay2 for identical scheduled windows and rates"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_contribution_line_rounding_order
        grounds:
          - "calculations.contribution_due_cents"
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Three lines of 1.5 hours at 333 cents/hour give 3 x round(499.5) = 1500;
          the forbidden sum-then-round order would give round(1498.5) = 1499.
        test_recipe:
          setup:
            - "Fund F; employer E rate 333; three INDENTURED + REGISTERED apprentices A1, A2, A3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 333 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App One", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { a1: $.data.id }
            - call: "POST /apprentices/${a1}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${a1}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${a1}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App Two", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { a2: $.data.id }
            - call: "POST /apprentices/${a2}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${a2}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${a2}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "App Three", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { a3: $.data.id }
            - call: "POST /apprentices/${a3}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${a3}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${a3}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${a1}", ojt_hours: 1.5 }, { apprentice_id: "${a2}", ojt_hours: 1.5 }, { apprentice_id: "${a3}", ojt_hours: 1.5 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { due: $.data.contribution_due_cents }
          assert:
            - "ContributionReport.${rep_id}.contribution_due_cents == 1500"
            - "contribution_due_cents != 1499 (the sum-then-round value)"
            - "Employer.${emp_id}.outstanding_cents == 1500"

      - name: combinatorial_wage_step_dual_gated_tiers
        grounds:
          - "calculations.wage_step_determination"
          - "entities.Apprentice.fields.current_wage_step"
        distinguishing_aspect: |
          Mode (a) multi-input non-linear formula: the wage step requires BOTH an
          hours tier AND an RTI-credit gate. At 2000 hours with 0 credits the
          apprentice stays step 1; only after a 144-credit class does the same
          2000 hours produce step 2 (rate 2400 cents from base 4000).
        test_recipe:
          setup:
            - "Apprentice A (base 4000) INDENTURED + REGISTERED, with 2000 OJT hours credited and 0 RTI credits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app_id}", ojt_hours: 2000 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "GET /apprentices/${app_id}"
              as: TrustAdmin
              captures: { step_mid: $.data.current_wage_step, rate_mid: $.data.current_wage_rate_cents }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "RTI-144", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 144, capacity: 10, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app_id}" }
              as: TrustAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /classes/${cls_id}/complete"
              payload: { attended_enrollment_ids: ["${enr_id}"] }
              as: TrustAdmin
            - call: "GET /apprentices/${app_id}"
              as: TrustAdmin
              captures: { step_end: $.data.current_wage_step, rate_end: $.data.current_wage_rate_cents, rti_end: $.data.rti_credits_accumulated }
          assert:
            - "step_mid == 1 (hours gate met but credit gate failed)"
            - "rate_mid == 2000"
            - "rti_end == 144"
            - "step_end == 2"
            - "rate_end == 2400"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: apprentice_parallel_dimensions_revoke_reinstate
        grounds:
          - "state_machines.Apprentice.program_status"
          - "state_machines.Apprentice.registration_status"
        distinguishing_aspect: |
          Apprentice carries two interacting state dimensions: revoking the
          registration of an INDENTURED apprentice forces program_status to
          SUSPENDED, and a later REGISTERED decision reinstates INDENTURED —
          a loop across dimensions, on a different entity than the report cycle.
        test_recipe:
          setup: ["Apprentice A is INDENTURED with registration REGISTERED."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
          trigger:
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REVOKED" }
              as: TrustAdmin
              captures: { prog_revoked: $.data.program_status, reg_revoked: $.data.registration_status }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "FEDERAL" }
              as: TrustAdmin
              captures: { reg_resub: $.data.registration_status }
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
              captures: { prog_end: $.data.program_status, reg_end: $.data.registration_status }
          assert:
            - "prog_revoked == SUSPENDED"
            - "reg_revoked == REVOKED"
            - "reg_resub == SUBMITTED (resubmission from REVOKED allowed)"
            - "prog_end == INDENTURED"
            - "reg_end == REGISTERED"
            - "Apprentice.${app_id}.registration_agency == FEDERAL"

      - name: contribution_report_flag_resubmit_cycle
        grounds:
          - "state_machines.ContributionReport"
          - "calculations.contribution_due_cents"
        distinguishing_aspect: |
          ContributionReport supports a genuine cycle SUBMITTED -> FLAGGED ->
          SUBMITTED (audit rework loop), distinct from the apprentice dimensions:
          resubmission with corrected lines (100 -> 90 hours) reprices the due
          from 50000 to 45000 at the unchanged rate.
        test_recipe:
          setup: ["Employer E (rate 500); apprentice A INDENTURED + REGISTERED; report R submitted with 100 hours."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app_id}", ojt_hours: 100 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /contribution-reports/${rep_id}/flag"
              payload: { reason: "audit: hours overstated" }
              as: TrustAdmin
              captures: { st_flagged: $.data.status }
            - call: "POST /contribution-reports/${rep_id}/resubmit"
              payload: { lines: [{ apprentice_id: "${app_id}", ojt_hours: 90 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { st_back: $.data.status, due2: $.data.contribution_due_cents }
          assert:
            - "st_flagged == FLAGGED"
            - "st_back == SUBMITTED (cycle closed)"
            - "due2 == 45000"
            - "Apprentice.${app_id}.ojt_hours_accumulated == 90"
            - "Employer.${emp_id}.outstanding_cents == 45000"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: remit_cure_chain_report_employer_fund
        grounds:
          - "state_machines.ContributionReport.DELINQUENT_to_PAID"
          - "state_machines.Employer.DELINQUENT_to_ACTIVE"
          - "state_machines.TrustFund.COMPLIANCE_HOLD_to_OPERATING"
        distinguishing_aspect: |
          Depth-3 cascade from remit: report DELINQUENT -> PAID triggers the
          employer's cure (DELINQUENT -> ACTIVE), which itself triggers the
          fund's posture clear (COMPLIANCE_HOLD -> OPERATING) — each hop caused
          by the previous mutation, not by the remit directly.
        test_recipe:
          setup:
            - "Employer E with a SUBMITTED report for period 2026-05 (due 2026-06-15T00:00:00Z); clock advanced to 2026-06-16; run-ops has marked the report DELINQUENT, employer DELINQUENT, fund COMPLIANCE_HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 5, lines: [{ apprentice_id: "${app_id}", ojt_hours: 200 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds/${fund_id}/run-ops"
              payload: {}
              as: TrustAdmin
              captures: { posture_hold: $.data.posture }
          trigger:
            - call: "POST /contribution-reports/${rep_id}/remit"
              payload: { amount_tendered_cents: 100000 }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_status: $.data.status }
            - call: "GET /employers/${emp_id}"
              as: TrustAdmin
              captures: { emp_status: $.data.status, emp_outstanding: $.data.outstanding_cents }
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_posture: $.data.posture, fund_received: $.data.contributions_received_cents }
          assert:
            - "posture_hold == COMPLIANCE_HOLD (precondition observed before trigger)"
            - "rep_status == PAID"
            - "emp_status == ACTIVE (cured by the remit, no separate call)"
            - "emp_outstanding == 0"
            - "fund_posture == OPERATING (cascade hop 3)"
            - "fund_received == 100000"

      - name: class_complete_credit_chain
        grounds:
          - "state_machines.TrainingClass.SCHEDULED_to_COMPLETED"
          - "state_machines.ClassEnrollment.ENROLLED_to_CREDITED"
          - "calculations.rti_credit_award"
          - "calculations.wage_step_determination"
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: completing a class flips the
          attended enrollment to CREDITED, whose credit mutation itself recomputes
          the apprentice's RTI total and wage step (1 -> 2 at the 144-credit gate).
        test_recipe:
          setup:
            - "Apprentice A (base 4000) INDENTURED + REGISTERED, 2000 OJT hours already credited, 128 RTI credits from class C1 (still step 1)."
            - "Class C2 (rti_credit_value 16) with A ENROLLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
