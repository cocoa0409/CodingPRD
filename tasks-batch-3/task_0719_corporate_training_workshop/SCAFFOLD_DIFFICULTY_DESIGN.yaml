  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_conflict_closed_interval_abutment_rejected
        grounds:
          - validations[priority=11]
          - entities.Session.fields.room_or_url
          - entities.Session.fields.starts_at
          - entities.Session.fields.ends_at
        distinguishing_aspect: |
          Resource = Session room_or_url, CLOSED-interval semantics: two same-room sessions that merely ABUT at a
          shared boundary instant (first ends_at == second starts_at) are rejected with ERR_ROOM_CONFLICT — adjacency
          is a conflict, so back-to-back needs a gap.
        test_recipe:
          setup:
            - "A SCHEDULED cohort spanning the day; one session 09:00-10:00 in room ROOM-A already added"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Room Prog", category: "TECHNICAL", delivery_mode: "ONSITE" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 8, pricing_model: "PER_SEAT", per_seat_cents: 10000, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Fac R", email: "facr@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${fac_id}", seat_capacity: 5, delivery_mode: "ONSITE", starts_at: "2026-06-07T08:00:00Z", ends_at: "2026-06-07T18:00:00Z", enroll_deadline: "2026-06-06T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/sessions"
              payload: { title: "S1", starts_at: "2026-06-07T09:00:00Z", ends_at: "2026-06-07T10:00:00Z", room_or_url: "ROOM-A" }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /training/cohorts/${coh_id}/sessions"
              payload: { title: "S2", starts_at: "2026-06-07T10:00:00Z", ends_at: "2026-06-07T11:00:00Z", room_or_url: "ROOM-A" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_ROOM_CONFLICT (abutting at 10:00 boundary rejected under closed-interval semantics)"

      - name: facilitator_double_booked_half_open_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.SessionAssignment.fields.facilitator_id
          - entities.Session.fields.starts_at
          - entities.Session.fields.ends_at
        distinguishing_aspect: |
          DIFFERENT resource (Facilitator via SessionAssignment) and DIFFERENT interval semantics (HALF-OPEN): an
          ACTIVE assignment touching another at a boundary instant (S2 10:00 starts as S1 10:00 ends) is ALLOWED,
          while a genuine overlap (S3 09:30-10:30 over S1 09:00-10:00) is rejected with ERR_FACILITATOR_DOUBLE_BOOKED —
          opposite adjacency rule to the room's closed interval.
        test_recipe:
          setup:
            - "Cohort with sessions S1 09:00-10:00 (ROOM-1), S2 10:00-11:00 (ROOM-2), S3 09:30-10:30 (ROOM-3); co-facilitator assigned to S1 and S2 (boundary touch allowed)"
          setup_api_calls:
