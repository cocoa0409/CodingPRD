              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { e3_cost_after: $.data.committed_cost_cents, e3_readiness_after: $.data.service_readiness, e3_covered: $.data.covered_service_types }
            - call: "GET /service-providers/${prov_e3}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_e3}"
              captures: { e3_encumbered: $.data.encumbered_capacity_days }
          assert:
            - "${e3_cost_before} == 0"
            - "${e3_readiness_before} == PENDING"
            - "${e3_days_a} == 46"
            - "${e3_status_a} == FULFILLED"
            - "${e3_cost_mid} == 500000"
            - "${e3_readiness_mid} == PENDING"
            - "${e3_cost_after} == 800000"
            - "${e3_covered} contains exactly POLICE and FIRE"
            - "${e3_readiness_after} == READY"
            - "${e3_encumbered} == 92"
            - "GET /service-commitments?plan_of_services_id=${plan_e3}&commitment_status=FULFILLED returns total_count == 2"

      - name: a_utility_account_is_discoverable_from_both_its_parcel_and_its_provider
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /utility-accounts]
          - endpoints[GET /utility-accounts]
          - endpoints[GET /utility-accounts/{utilityAccountId}]
        distinguishing_aspect: |
          UtilityAccount is the only entity in a flat topology that links two otherwise unrelated
          branches — a parcel of a case and a provider of a municipality — so the link must be
          navigable from either end: the account created on P1 against the water provider appears
          under ?parcel_id=P1 and under ?service_provider_id=WATER, and does not appear under the
          sibling parcel's filter or the sewer provider's filter.
