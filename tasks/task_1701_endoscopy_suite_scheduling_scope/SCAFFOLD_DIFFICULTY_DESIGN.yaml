            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/bookings/${b1}/cancel", payload: { reason: "patient request" }, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${se}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BOOKING_NOT_CHECKED_IN (state, priority 7) — NOT ERR_SCOPE_STORAGE_EXPIRED (business_safety, priority 8), although the scope IS expired at 2026-08-04T09:00:00Z"
            - "http status == 409"

      - name: existence_beats_business_temporal_on_booking_create
        grounds:
          - validations[priority=3]
          - validations[priority=9]
        distinguishing_aspect: |
          Error-category pair (existence, business_temporal): the create request references a
          non-existent room (priority 3) AND violates the 24h SPLIT_DOSE lead time /
          scheduled_start-in-past rule (priority 9). The 404 ERR_ROOM_NOT_FOUND must win over
          the temporal 422. Different category pair from both sibling instances.
        test_recipe:
          setup:
            - "Patient, provider DR1, COLONO type exist; logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M5101", full_name: "Pat E", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr E", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "00000000-0000-0000-0000-000000000000", scheduled_start: "2026-08-01T00:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ROOM_NOT_FOUND (existence, priority 3) — NOT ERR_SCHEDULED_START_IN_PAST (business_temporal, priority 9), although scheduled_start equals the logical clock and is therefore also a past-start violation"
            - "http status == 404"

      - name: business_temporal_beats_business_constraint_on_booking_create
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_constraint): the create request
          violates the 24h SPLIT_DOSE lead time (priority 9) AND overlaps an existing booking's
          room block (priority 10). The temporal 422 ERR_PREP_LEAD_TIME_INSUFFICIENT must win
          over the 409 ERR_ROOM_TIME_CONFLICT. Different category pair from both siblings.
        test_recipe:
          setup:
            - "Patient, provider DR1, COLONO type, room R_STD"
            - "B1 occupies R_STD at 2026-08-02T09:00:00Z (NONE anesthesia: block [09:00, 09:55)) — created at the default clock"
            - "Logical clock advanced to 2026-08-01T13:00:00Z so that a 2026-08-02T09:30:00Z start is only 20.5h ahead (< 24h lead)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M5201", full_name: "Pat T", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr T", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T13:00:00Z" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:30:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PREP_LEAD_TIME_INSUFFICIENT (business_temporal, priority 9) — NOT ERR_ROOM_TIME_CONFLICT (business_constraint, priority 10), although 09:30 falls inside B1's block [09:00, 09:55)"
            - "http status == 422"

  - rule_id: boundary_precision_check
    instances:
      - name: hld_contact_time_600_second_boundary
        grounds:
          - calculations.reprocessing_step_windows
          - state_machines.ReprocessingCycle.CLEANED_to_DISINFECTED
        distinguishing_aspect: |
          Numeric threshold with second precision: HLD contact elapsed 599 seconds is rejected
          (ERR_STEP_DURATION_TOO_SHORT), exactly 600 seconds passes (inclusive >=). A distinct
          metric (HLD contact seconds via the step-advance endpoint) from the sibling
          instances (ADR empty-denominator via quality-reports; storage-expiry instant via
          booking start).
        test_recipe:
          setup:
            - "Scope SH sent to reprocessing at 2026-08-01T08:00:00Z; cycle created 08:00; PRECLEANED at 08:00; CLEANED at 08:06:00"
          setup_api_calls:
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-HLD", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sh: $.data.id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/scopes/${sh}/send-to-reprocessing", payload: {}, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sh}" }, as: ReprocessingTechnician, as_user_id: "tech-1", captures: { cy: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:06:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:15:59Z" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-H", hld_concentration_ppm: 350 }, as: ReprocessingTechnician, captures: { err599: $.data.error_id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:16:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-H", hld_concentration_ppm: 350 }, as: ReprocessingTechnician, captures: { cy_status: $.data.status, cy_dis_at: $.data.disinfected_at } }
          assert:
            - "At 599 s elapsed: error_id == ERR_STEP_DURATION_TOO_SHORT (422) and the cycle remains CLEANED (a failed duration gate is not a QA failure — no state change)"
            - "At exactly 600 s elapsed: advance succeeds; cycle.status == DISINFECTED, disinfected_at == 2026-08-01T08:16:00Z, hld_concentration_ppm == 350"

      - name: adr_null_when_denominator_zero
        grounds:
          - calculations.adenoma_detection_rate
          - calculations.withdrawal_time_average
          - entities.QualityMetricReport.fields.adenoma_detection_rate
        distinguishing_aspect: |
          Empty-set boundary: a provider whose period contains only a COMPLETED EGD
          (adr_relevant == false, colonoscopy_family == false) yields adr_denominator == 0 and
          the rate must be null — not 0.0 and not an error. Distinct metric and endpoint
          (POST /quality-reports) from the sibling boundary instances.
        test_recipe:
          setup:
            - "Provider DRZ; EGD type (base 25, CLEAR_LIQUIDS, family/adr false, GASTROSCOPE); room RZ; gastroscope SG1; patient P"
            - "One EGD completed 2026-08-03T08:25:00Z with cecum_intubated=false, withdrawal 200, adenomas 0, prep adequate"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M6001", full_name: "Pat Z", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Zed", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { drz: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "EGD", display_name: "Upper endoscopy", base_duration_minutes: 25, prep_protocol: "CLEAR_LIQUIDS", colonoscopy_family: false, adr_relevant: false, required_scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { t_egd: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RZ", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rz: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SG-1", scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { sg1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${drz}", procedure_type_id: "${t_egd}", room_id: "${rz}", scheduled_start: "2026-08-03T08:00:00Z", indication: "DIAGNOSTIC", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sg1}" }, as: Endoscopist, as_user_id: "${drz}" }
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drz}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:25:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/complete", payload: { cecum_intubated: false, withdrawal_time_seconds: 200, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${drz}" }
          trigger:
            - { call: "POST /endoscopy/quality-reports", payload: { provider_id: "${drz}", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-03T23:59:59Z", metric_variant: "STRICT" }, as: QualityOfficer, captures: { rep: $.data.id, adr: $.data.adenoma_detection_rate, den: $.data.adr_denominator } }
          assert:
            - "Report ${rep}: adr_denominator == 0 and adenoma_detection_rate is null (empty denominator is not 0.0)"
            - "withdrawal_sample_size == 0 and withdrawal_time_avg_seconds is null (EGD is not colonoscopy_family)"
            - "cecal_intubation_rate is null (denominator 0)"
            - "prep_adequacy_rate == 100.0 (1 assessed adequate of 1 assessed)"

      - name: scope_storage_expiry_exact_instant_rejected
        grounds:
          - calculations.scope_storage_expiry
          - entities.Scope.fields.storage_expires_at
          - state_machines.ProcedureBooking.CHECKED_IN_to_IN_PROGRESS
        distinguishing_aspect: |
          Time-window boundary with strict inequality: a scope whose storage_expires_at is
          2026-08-04T08:26:00Z is rejected at exactly 2026-08-04T08:26:00Z (now >= expiry means
          expired). Distinct metric (hang-time expiry) and endpoint (booking start) from the
          siblings (HLD seconds; ADR empty set).
        test_recipe:
          setup:
            - "Patient P, provider DR1, COLONO type, room R_STD, scope SX1 whose cycle dried 2026-08-01T08:26:00Z (storage_expires_at == 2026-08-04T08:26:00Z)"
            - "Booking B1 COLONO/NONE scheduled 2026-08-04T08:26:00Z, prep confirmed, checked in at exactly 08:26:00"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M6101", full_name: "Pat X", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr X", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-X1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sx1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-04T08:26:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/scopes/${sx1}/send-to-reprocessing", payload: {}, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sx1}" }, as: ReprocessingTechnician, as_user_id: "tech-1", captures: { cy: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:06:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:16:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-X", hld_concentration_ppm: 350 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:26:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T08:26:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sx1}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCOPE_STORAGE_EXPIRED (409): at now == storage_expires_at the scope is expired (strict <), the exact-equality case is rejected"
            - "GET /endoscopy/scopes/${sx1}: status still AVAILABLE, is_storage_current == false, storage_expires_at == 2026-08-04T08:26:00Z"
            - "Booking ${b1}.status still CHECKED_IN (no usage created)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_start_requires_confirmed_anesthesia_assignment
        grounds:
          - state_machines.ProcedureBooking.CHECKED_IN_to_IN_PROGRESS
          - state_machines.AnesthesiaAssignment.ASSIGNED_to_CONFIRMED
          - errors[ERR_ANESTHESIA_NOT_CONFIRMED]
        distinguishing_aspect: |
          Entity pair (ProcedureBooking, AnesthesiaAssignment): the booking's CHECKED_IN ->
          IN_PROGRESS transition is gated by the assignment's state — absent assignment AND
          merely-ASSIGNED assignment both fail; only CONFIRMED unblocks. Sibling instances
          use different entity pairs (QuarantineCase x ScopeCultureTest; Booking x Provider).
        test_recipe:
          setup:
            - "Patient P, provider DR1, COLONO type, room R_STD, scope SC1, anesthesia provider AP1"
            - "Booking B COLONO/MAC at 2026-08-05T09:00:00Z, prep confirmed, checked in at 09:00"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M7001", full_name: "Pat A", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr A", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-A1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-providers", payload: { full_name: "Ann Esthesia" }, as: UnitAdmin, captures: { ap1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-05T09:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err_no_assignment: $.data.error_id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${b1}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { asg: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err_only_assigned: $.data.error_id } }
            - { call: "POST /endoscopy/anesthesia-assignments/${asg}/confirm", payload: {}, as: AnesthesiaProvider, as_user_id: "${ap1}" }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { b1_status: $.data.status } }
          assert:
            - "With no assignment: error_id == ERR_ANESTHESIA_NOT_CONFIRMED (409)"
            - "With assignment ${asg} merely ASSIGNED: error_id == ERR_ANESTHESIA_NOT_CONFIRMED again (ASSIGNED is not sufficient)"
            - "After confirm: start succeeds, booking.status == IN_PROGRESS, scope ${sc1} IN_USE"
            - "Assignment ${asg}.status == CONFIRMED throughout the successful start"

      - name: quarantine_release_requires_negative_reculture
        grounds:
          - state_machines.QuarantineCase
          - state_machines.Scope.QUARANTINED_to_AVAILABLE
          - state_machines.ScopeCultureTest.PENDING_to_RESULTED
          - errors[ERR_RECULTURE_NOT_NEGATIVE]
        distinguishing_aspect: |
          Entity pair (QuarantineCase, ScopeCultureTest): the release transition is gated by
          the existence of a NEGATIVE culture on the case's reculture cycle — no reculture
          cycle fails, a COMPLETE reculture cycle without a resulted culture fails, and only
          the NEGATIVE result unblocks. Different entity pair from both siblings.
        test_recipe:
          setup:
            - "Scope SQ: cycle q0 dried 2026-08-20T08:26:00Z; culture CQ0 POSITIVE at 09:00 -> QUARANTINED, case OPEN"
            - "Reculture cycle q1 by technician tech-7 completes (dried 09:56); culture CQ1 NEGATIVE at 10:15"
          setup_api_calls:
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SQ-1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sq: $.data.id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/scopes/${sq}/send-to-reprocessing", payload: {}, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sq}" }, as: ReprocessingTechnician, as_user_id: "tech-1", captures: { q0: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${q0}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:06:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${q0}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:16:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${q0}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-Q0", hld_concentration_ppm: 350 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:26:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${q0}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${q0}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/culture-tests", payload: { scope_id: "${sq}", reprocessing_cycle_id: "${q0}" }, as: InfectionControlNurse, captures: { cq0: $.data.id } }
            - { call: "POST /endoscopy/culture-tests/${cq0}/result", payload: { result: "POSITIVE", organism: "PSEUDOMONAS_AERUGINOSA", cfu_count: 80 }, as: InfectionControlNurse }
            - { call: "GET /endoscopy/quarantine-cases", payload: { scope_id: "${sq}" }, as: InfectionControlNurse, captures: { qc: "$.data[0].id", qc_status: "$.data[0].status" } }
            - { call: "GET /endoscopy/scopes/${sq}", payload: {}, as: UnitAdmin, captures: { sv_q: $.data.version } }
            - { call: "POST /endoscopy/scopes/${sq}/release-quarantine", payload: { expected_scope_version: "${sv_q}" }, as: InfectionControlNurse, as_user_id: "nurse-1", captures: { err_probe1: $.data.error_id } }
            # reculture cycle by tech-7
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:30:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sq}" }, as: ReprocessingTechnician, as_user_id: "tech-7", captures: { q1: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${q1}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:36:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${q1}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:46:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${q1}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-Q1", hld_concentration_ppm: 400 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T09:56:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${q1}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${q1}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "GET /endoscopy/scopes/${sq}", payload: {}, as: UnitAdmin, captures: { sv_r: $.data.version } }
            - { call: "POST /endoscopy/scopes/${sq}/release-quarantine", payload: { expected_scope_version: "${sv_r}" }, as: InfectionControlNurse, as_user_id: "nurse-1", captures: { err_probe2: $.data.error_id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T10:15:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/culture-tests", payload: { scope_id: "${sq}", reprocessing_cycle_id: "${q1}" }, as: InfectionControlNurse, captures: { cq1: $.data.id } }
            - { call: "POST /endoscopy/culture-tests/${cq1}/result", payload: { result: "NEGATIVE" }, as: InfectionControlNurse }
            - { call: "GET /endoscopy/scopes/${sq}", payload: {}, as: UnitAdmin, captures: { sv_n: $.data.version } }
          trigger:
            - { call: "POST /endoscopy/scopes/${sq}/release-quarantine", payload: { expected_scope_version: "${sv_n}" }, as: InfectionControlNurse, as_user_id: "nurse-1", captures: { sq_status: $.data.status } }
            - { call: "GET /endoscopy/quarantine-cases/${qc}", payload: {}, as: InfectionControlNurse, captures: { qc_status_final: $.data.status, qc_released_by: $.data.released_by } }
          assert:
            - "Probe 1 (case OPEN, no reculture cycle): error_id == ERR_RECULTURE_NOT_NEGATIVE (409) — captured as ${err_probe1}"
            - "Probe 2 (reculture cycle COMPLETE but culture not yet resulted): error_id == ERR_RECULTURE_NOT_NEGATIVE (409) — captured as ${err_probe2}"
            - "After NEGATIVE reculture result: release succeeds; scope.status == AVAILABLE"
            - "QuarantineCase ${qc}: status == RELEASED, released_by == nurse-1, reculture_cycle_id == ${q1}"
            - "Case moved OPEN -> RECULTURING when cycle ${q1} was created (system transition on cycle creation against a QUARANTINED scope)"
            - "Note for the test author: the two rejected probes must each GET the scope version first and pass it as expected_scope_version (OCC at priority 5 passes; the business precondition at priority 7 then fails)"
      - name: booking_start_blocked_when_provider_suspended
        grounds:
          - state_machines.Provider
          - state_machines.ProcedureBooking.CHECKED_IN_to_IN_PROGRESS
          - errors[ERR_PROVIDER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair (ProcedureBooking, Provider): the booking's start transition is gated by
          the provider's credential_status — SUSPENDED blocks even though the booking itself is
          in a legal from-state; reinstatement unblocks. Different entity pair from the
          siblings (assignment gate; reculture gate).
        test_recipe:
          setup:
            - "Provider DR_S, patient P, COLONO type, room R_STD, scope SC1"
            - "Booking B COLONO/NONE at 2026-08-02T09:00:00Z, prep confirmed, checked in at 09:00; DR_S suspended before start"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M7201", full_name: "Pat S", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Susp", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { drs: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-S1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${drs}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "PATCH /endoscopy/providers/${drs}", payload: { credential_status: "SUSPENDED" }, as: UnitAdmin }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${drs}", captures: { err: $.data.error_id } }
            - { call: "PATCH /endoscopy/providers/${drs}", payload: { credential_status: "ACTIVE" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${drs}", captures: { b1_status: $.data.status } }
          assert:
            - "While suspended: error_id == ERR_PROVIDER_SUSPENDED (409); booking stays CHECKED_IN, no ScopeUsage created"
            - "After reinstatement: start succeeds, booking.status == IN_PROGRESS"
            - "Check-in was NOT blocked by suspension (the gate applies to booking create and start, not check-in)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: room_conflict_half_open_with_turnover_buffer
        grounds:
          - calculations.room_block_window
          - errors[ERR_ROOM_TIME_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: half-open [scheduled_start, room_block_end) WITH a 15-minute
          turnover buffer extension — a new booking starting inside the buffer (10:05, after
          B1's scheduled_end 09:55 but before room_block_end 10:10) conflicts, while exact
          adjacency (start == 10:10) is allowed. Different interval semantics and different
          resource entity from the anesthesia closed-interval sibling.
        test_recipe:
          setup:
            - "P_OLD (1961-08-02; 65 on 2026-08-02), P_YOUNG (1990-05-05), DR1, COLONO, room R_STD (STANDARD, turnover 15)"
            - "B1: P_OLD MAC at 2026-08-02T09:00:00Z -> procedure 55, block [09:00, 10:10)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M8001", full_name: "Pat Old", date_of_birth: "1961-08-02" }, as: SchedulingCoordinator, captures: { p_old: $.data.id } }
            - { call: "POST /endoscopy/patients", payload: { mrn: "M8002", full_name: "Pat Young", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p_yng: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr R", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { b1: $.data.id, b1_rbe: $.data.room_block_end } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T10:05:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { err_buf: $.data.error_id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_yng}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T10:10:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b3: $.data.id, b3_rbe: $.data.room_block_end } }
          assert:
            - "B1 ${b1}: room_block_end == 2026-08-02T10:10:00Z (09:55 scheduled_end + 15 min turnover)"
            - "Start 10:05 (inside the turnover buffer): error_id == ERR_ROOM_TIME_CONFLICT (409) — the buffer is part of the occupied interval"
            - "Start exactly 10:10 == room_block_end: booking ${b3} created (201) — half-open adjacency is NOT a conflict"
            - "B3 block == [2026-08-02T10:10:00Z, 2026-08-02T11:05:00Z) (40 min NONE + 15 turnover)"

      - name: anesthesia_conflict_closed_interval_touching_rejected
        grounds:
          - calculations.anesthesia_minutes_ledger
          - errors[ERR_ANESTHESIA_TIME_CONFLICT]
          - state_machines.AnesthesiaAssignment
        distinguishing_aspect: |
          Interval semantics: CLOSED [scheduled_start, scheduled_end] with no buffer — a new
          assignment whose procedure starts exactly when the provider's existing one ends
          (09:50 == 09:50) CONFLICTS, while a 1-minute gap (09:51) succeeds. This adjacency-
          rejected semantics is the exact inverse of the room rule (adjacency allowed), on a
          different resource entity (AnesthesiaProvider vs Room).
        test_recipe:
          setup:
            - "P_YOUNG, DR1, COLONO, STANDARD rooms RA/RB/RC, anesthesia provider AP1"
            - "Bc: COLONO/MAC RA 2026-08-03T09:00 (procedure 50 -> window [09:00, 09:50]) with assignment Ac on AP1"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M8101", full_name: "Pat Young", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr R", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RA", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { ra: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RB", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rb: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RC", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rc: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-providers", payload: { full_name: "Ann Esthesia" }, as: UnitAdmin, captures: { ap1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ra}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { bc: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${bc}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { ac: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rb}", scheduled_start: "2026-08-03T09:50:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { bd: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rc}", scheduled_start: "2026-08-03T09:51:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { be: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${bd}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { err_touch: $.data.error_id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${be}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { ae: $.data.id } }
          assert:
            - "Bd at 09:50 touching Ac's end 09:50: error_id == ERR_ANESTHESIA_TIME_CONFLICT (409) — closed intervals treat exact adjacency as overlap"
            - "Be at 09:51 (1-minute gap): assignment ${ae} created (201)"
            - "Bd booking itself was created fine — its room RB was free; only the anesthesia resource rejected the touch"
            - "GET /endoscopy/anesthesia-providers/${ap1}.scheduled_minutes == 100 (50 for Ac + 50 for Ae; the rejected attempt contributed nothing)"

      - name: room_day_capacity_aggregate_limit
        grounds:
          - calculations.room_block_window
          - errors[ERR_ROOM_DAY_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics: no pairwise overlap exists (the 7th booking
          starts exactly at the 6th block's end, which the half-open rule permits), yet the
          sum of committed block-minutes for the date would be 490 > 480, so the aggregate
          rule rejects it. Same resource entity as the room sibling but a genuinely different
          geometric treatment (aggregate sum vs pairwise intersection).
        test_recipe:
          setup:
            - "P_OLD (65 on 2026-08-04), DR1, COLONO, room R_CAP (STANDARD)"
            - "Six bookings COLONO/MAC (55 procedure + 15 turnover = 70 block minutes each) at 08:00, 09:10, 10:20, 11:30, 12:40, 13:50 -> 420 committed minutes"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M8201", full_name: "Pat Old", date_of_birth: "1961-08-02" }, as: SchedulingCoordinator, captures: { p_old: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Cap", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-CAP", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rcap: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T08:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T09:10:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T10:20:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T11:30:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T12:40:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T13:50:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p_old}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${rcap}", scheduled_start: "2026-08-04T15:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { err_cap: $.data.error_id } }
            - { call: "GET /endoscopy/reports/room-utilization", payload: { date: "2026-08-04" }, as: QualityOfficer, captures: { cap_pct: $.data.unit_utilization_pct } }
          assert:
            - "7th booking at 15:00: error_id == ERR_ROOM_DAY_CAPACITY_EXCEEDED (409): 420 + 70 == 490 > 480 even though 15:00 is exactly the 6th block's end (pairwise rule permits)"
            - "Utilization after the rejection: R_CAP occupied_minutes == 420, utilization_pct == 87.5 — the rejected booking contributed nothing"

  - rule_id: compensating_invariant
    instances:
      - name: scope_use_count_ledger_void_compensation
        grounds:
          - calculations.scope_use_ledger
          - state_machines.ProcedureBooking.CHECKED_IN_to_IN_PROGRESS
          - entities.Scope.fields.use_count
        distinguishing_aspect: |
          Conserved quantity: scope-use ledger. Forward action (start creates ACTIVE usage,
          use_count 0 -> 1) paired with its compensation (void: usage -> VOID, scope returns
          IN_USE -> AVAILABLE, use_count 1 -> 0) leaves Scope.use_count ==
          count(non-VOID ScopeUsage) == 0. Different conserved quantity from the
          anesthesia-minutes sibling (count ledger vs minutes ledger).
        test_recipe:
          setup:
            - "Patient P, DR1, COLONO, R_STD, scope SV (fresh, use_count 0)"
            - "Booking B COLONO/NONE 2026-08-02T09:00, prep confirmed, checked in, started with SV at 09:00 (usage U ACTIVE, SV IN_USE, use_count 1)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M9001", full_name: "Pat V", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr V", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-STD", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-V1", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sv: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sv}" }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "GET /endoscopy/scope-usages", payload: { booking_id: "${b1}" }, as: UnitAdmin, captures: { u1: "$.data[0].id" } }
            - { call: "GET /endoscopy/scopes/${sv}", payload: {}, as: UnitAdmin, captures: { uses_after_start: $.data.use_count } }
          trigger:
            - { call: "POST /endoscopy/scope-usages/${u1}/void", payload: { reason: "scope documented in error" }, as: Endoscopist, as_user_id: "${dr1}", captures: { u_status: $.data.status } }
            - { call: "GET /endoscopy/scopes/${sv}", payload: {}, as: UnitAdmin, captures: { uses_after_void: $.data.use_count, sv_status: $.data.status } }
            - { call: "POST /endoscopy/bookings/${b1}/record-prep-assessment", payload: { bbps_left: 3, bbps_right: 3, bbps_transverse: 3 }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "POST /endoscopy/bookings/${b1}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 400, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${dr1}" }
            - { call: "GET /endoscopy/scopes/${sv}", payload: {}, as: UnitAdmin, captures: { sv_status_final: $.data.status } }
          assert:
            - "After start: use_count == 1 (forward action)"
            - "After void: usage ${u1}.status == VOID, use_count == 0 — invariant restored: use_count == count(ScopeUsage with status != VOID) == 0"
            - "After void: scope.status == AVAILABLE (IN_USE reversed)"
            - "After complete: booking COMPLETED and scope.status STILL == AVAILABLE (conditional cascade: no ACTIVE usage, so completion does NOT move the scope to AWAITING_REPROCESS)"

      - name: anesthesia_scheduled_minutes_ledger_compensation
        grounds:
          - calculations.anesthesia_minutes_ledger
          - state_machines.AnesthesiaAssignment
          - concurrency_rules[booking-reschedule-stale-version]
          - entities.AnesthesiaProvider.fields.scheduled_minutes
        distinguishing_aspect: |
          Conserved quantity: scheduled-minutes ledger. Create(+50, +35) and the compensating
          paths (explicit cancel; reschedule cascade) keep AnesthesiaProvider.scheduled_minutes
          == sum(minutes of ASSIGNED|CONFIRMED assignments) at every step: 85 -> 35 -> 0 -> 50.
          Different conserved quantity from the scope-use-count sibling.
        test_recipe:
          setup:
            - "P_YOUNG, DR1, COLONO + EGD types, rooms RA/RB, anesthesia provider AP1"
            - "Ba COLONO/MAC 2026-08-06T09:00 RA (50 min), Bb EGD/MAC 2026-08-06T11:00 RB (35 min)"
            - "Assignments Aa (50) and Ab (35) -> AP1.scheduled_minutes == 85"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "M9101", full_name: "Pat M", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr M", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "EGD", display_name: "Upper endoscopy", base_duration_minutes: 25, prep_protocol: "CLEAR_LIQUIDS", colonoscopy_family: false, adr_relevant: false, required_scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { t_egd: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RA", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { ra: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "RB", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { rb: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-providers", payload: { full_name: "Ann Esthesia" }, as: UnitAdmin, captures: { ap1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${ra}", scheduled_start: "2026-08-06T09:00:00Z", indication: "SCREENING", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { ba: $.data.id, ba_v: $.data.version } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_egd}", room_id: "${rb}", scheduled_start: "2026-08-06T11:00:00Z", indication: "DIAGNOSTIC", anesthesia_type: "MAC" }, as: SchedulingCoordinator, captures: { bb: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${ba}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { aa: $.data.id } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${bb}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { ab: $.data.id } }
            - { call: "GET /endoscopy/anesthesia-providers/${ap1}", payload: {}, as: UnitAdmin, captures: { min_85: $.data.scheduled_minutes } }
          trigger:
            - { call: "POST /endoscopy/bookings/${bb}/cancel", payload: { reason: "patient request" }, as: SchedulingCoordinator }
            - { call: "GET /endoscopy/anesthesia-providers/${ap1}", payload: {}, as: UnitAdmin, captures: { min_35: $.data.scheduled_minutes } }
            - { call: "POST /endoscopy/bookings/${ba}/reschedule", payload: { expected_booking_version: "${ba_v}", new_scheduled_start: "2026-08-07T09:00:00Z" }, as: SchedulingCoordinator, captures: { bc: $.data.id, bc_from: $.data.rescheduled_from_id, bc_prep: $.data.prep_status } }
            - { call: "GET /endoscopy/anesthesia-providers/${ap1}", payload: {}, as: UnitAdmin, captures: { min_0: $.data.scheduled_minutes } }
            - { call: "POST /endoscopy/anesthesia-assignments", payload: { booking_id: "${bc}", anesthesia_provider_id: "${ap1}" }, as: SchedulingCoordinator, captures: { ac2: $.data.id } }
            - { call: "GET /endoscopy/anesthesia-providers/${ap1}", payload: {}, as: UnitAdmin, captures: { min_50: $.data.scheduled_minutes } }
          assert:
            - "After both creates: scheduled_minutes == 85 (50 + 35)"
            - "After cancelling ${bb}: assignment ${ab} CANCELLED and scheduled_minutes == 35"
            - "After rescheduling ${ba}: old booking RESCHEDULED, ${aa} CANCELLED via cascade, scheduled_minutes == 0"
            - "New booking ${bc}: rescheduled_from_id == ${ba}, prep_status == PREP_PENDING (reschedule resets the prep axis)"
            - "After assigning ${ac2} on ${bc}: scheduled_minutes == 50 (snapshot of bc.procedure_minutes)"
            - "Invariant at every checkpoint: scheduled_minutes == sum(minutes over assignments in {ASSIGNED, CONFIRMED})"
