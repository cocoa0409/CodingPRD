# =============================================================================
# PRD Benchmark Scaffold — task_2351_emergency_food_assistance_commodity_allocation
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2351. Emergency Food Assistance Commodity Allocation (state Emergency Food Assistance Program):
  federal commodity entitlement receipt and warehouse allocation to agencies, agency eligibility,
  civil rights training and agreement renewal, allocation formula by service area poverty and prior
  distribution, order windows, delivery scheduling and cold storage capacity checks, inventory
  monitoring for excess or slow-moving commodities and transfers, household eligibility
  self-declaration and distribution recordkeeping, recall execution across downstream agencies,
  administrative funds allocation and reporting

domain_name: "emergency-food-assistance-allocation"
api_prefix: "/efap"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - derived_field_reconciliation
    - conditional_feature_flags

  entity_topology: flat
  # Peer collections joined by FK fields (`/efap/commodity-orders`,
  # `/efap/order-lines`, `/efap/recall-actions`), never by nested id paths.
  # Only action sub-paths (`/{id}/submit`, `/{id}/lines`) descend below a
  # collection; no resource is addressed as `/parent/{id}/child/{id}`.

  state_machine_shape: parallel
  state_machine_shape_notes: |
    Agency carries two independent axes (agreement_status × training_status) that
    evolve separately and feed one derived posture. CommodityOrder is cyclic
    (SUBMITTED→DRAFT→SUBMITTED via return-for-revision; APPROVED→HELD→APPROVED via
    recall hold/release) and branching (SUBMITTED→{APPROVED, DRAFT, CANCELLED}).
    Recall is cyclic (MONITORING→NOTIFYING via expand). AllocationCycle is compound
    (draw_posture derives from the aggregate state of its AgencyAllocation rows).

  relationship_patterns:
    - one_to_many          # AllocationCycle → AgencyAllocation, CommodityOrder → OrderLine
    - many_to_many         # RecallAction is the Recall × Agency junction
    - cross_aggregate      # OrderLine.lot_assignments pin cases against InventoryLot rows
                           # owned by the warehouse aggregate, not by the order aggregate

  role_model: segregation_of_duties
  # The ComplianceReviewer who returns an order for revision may never approve
  # that same order after resubmission (four-eyes on revised orders).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Service area (county) display name.
        constraints: 1–120 chars
      - name: county_code
        type: string
        source: input
        description: State county code; unique across all ServiceArea rows.
        constraints: "uppercase, 2–8 chars, unique"
      - name: poverty_population
        type: integer
        source: input
        description: Persons below 130% of the federal poverty guideline in this service area; the poverty numerator of the allocation formula.
        constraints: ">= 0"
      - name: urban_rural
        type: enum
        source: input
        description: Rurality classification used for reporting only.
        default: MIXED
        constraints: "URBAN | RURAL | MIXED"
      - name: eligible_agency_count
        type: integer
        source: computed
        description: Count of Agency rows in this service area whose eligibility_posture == ELIGIBLE; the divisor that splits poverty_population across co-located agencies.
        default: 0

  - name: Agency
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Eligible recipient agency (food bank / pantry) name.
        constraints: 1–120 chars
      - name: service_area_id
        type: string
        source: input
        description: FK -> ServiceArea.id; the service area whose poverty_population feeds this agency's allocation.
      - name: cold_storage_pallet_capacity
        type: integer
        source: input
        description: Frozen-pallet positions the agency can hold at one time; the aggregate ceiling for overlapping delivery appointments.
        constraints: ">= 0"
      - name: prior_period_pounds_distributed
        type: number
        source: input
        description: Pounds the agency distributed in the prior program period; the prior-distribution numerator of the allocation formula.
        default: 0.0
        constraints: ">= 0, 2 decimals"
      - name: prior_period_allocated_cases
        type: integer
        source: input
        description: Cases allocated to the agency in the prior period; base of the HOLD_HARMLESS floor.
        default: 0
        constraints: ">= 0"
      - name: agreement_status
        type: enum
        source: system
        description: Agreement axis of the eligibility state machine.
        default: PENDING
        constraints: "PENDING | ACTIVE | EXPIRED | TERMINATED"
      - name: agreement_start_date
        type: string
        source: system
        description: Inclusive first day of the current agreement term; null while PENDING.
        constraints: "ISO 8601 date (YYYY-MM-DD)"
      - name: agreement_end_date
        type: string
        source: system
        description: Inclusive last day of the current agreement term; null while PENDING.
        constraints: "ISO 8601 date (YYYY-MM-DD)"
      - name: training_status
        type: enum
        source: system
        description: Civil-rights-training axis of the eligibility state machine; independent of agreement_status.
        default: REQUIRED
        constraints: "REQUIRED | CURRENT | LAPSED"
      - name: last_training_completed_at
        type: datetime
        source: system
        description: UTC instant of the most recent recorded civil rights training; null until the first training is recorded.
      - name: training_expires_at
        type: datetime
        source: computed
        description: last_training_completed_at + TRAINING_VALID_DAYS (365); null while last_training_completed_at is null.
      - name: eligibility_posture
        type: enum
        source: computed
        description: Derived gate over the two axes; recomputed on every write to agreement_status or training_status. See calculations.agency_eligibility_posture.
        default: INELIGIBLE
        constraints: "ELIGIBLE | PROBATION | INELIGIBLE"
      - name: agency_cases_on_hand
        type: integer
        source: computed
        description: Cases physically held by the agency; credited by delivery confirmation and accepted transfers, debited by household distributions and RETURNED_TO_STATE recall dispositions.
        default: 0
      - name: delivered_cases_ytd
        type: integer
        source: computed
        description: Cumulative cases delivered to this agency across all cycles.
        default: 0
      - name: renewal_count
        type: integer
        source: computed
        description: Number of agreement renewals recorded for this agency.
        default: 0

  - name: Commodity
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: USDA commodity code; unique, and the value AllocationCycle.offered_commodity_codes matches against.
        constraints: "uppercase snake, unique"
      - name: name
        type: string
        source: input
        description: Commodity display name.
      - name: storage_class
        type: enum
        source: input
        description: Storage regime that decides which warehouse and agency capacity pool the commodity consumes.
        constraints: "DRY | COLD | FROZEN"
      - name: net_weight_lbs_per_case
        type: number
        source: input
        description: Net pounds per case; three-decimal precision, which is why per-line rounding order is observable.
        constraints: "> 0, 3 decimals"
      - name: cases_per_pallet
        type: integer
        source: input
        description: Cases per pallet position; per-line pallet ceiling divisor.
        constraints: "> 0"
      - name: entitlement_value_cents_per_case
        type: integer
        source: input
        description: Federal entitlement value charged per case.
        constraints: "> 0"
      - name: shelf_life_days
        type: integer
        source: input
        description: Nominal shelf life used for reporting; lot shelf math uses pack_date/best_by_date instead.
        constraints: "> 0"
      - name: excess_case_ceiling
        type: integer
        source: input
        description: Cases-on-hand ceiling above which a lot is flagged EXCESS by the monitor run, before any slow-moving scoring is considered.
        constraints: "> 0"

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: State warehouse name.
      - name: dock_count
        type: integer
        source: input
        description: Number of receiving docks; dock_number on an appointment must be in 1..dock_count.
        constraints: ">= 1"
      - name: dry_pallet_capacity
        type: integer
        source: input
        description: Dry pallet positions available for staging appointments.
        constraints: ">= 0"
      - name: cold_pallet_capacity
        type: integer
        source: input
        description: Refrigerated pallet positions available for staging appointments.
        constraints: ">= 0"
      - name: frozen_pallet_capacity
        type: integer
        source: input
        description: Frozen pallet positions available for staging appointments; 0 means the warehouse cannot serve FROZEN commodities at all.
        constraints: ">= 0"
      - name: monitor_policy
        type: enum
        source: input
        description: Selects which slow-moving variant the monitor run applies to this warehouse's lots (conditional feature flag).
        default: TURNOVER_BASED
        constraints: "TURNOVER_BASED | SHELF_LIFE_BASED"

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: commodity_id
        type: string
        source: input
        description: FK -> Commodity.id; the commodity received in this federal entitlement receipt.
      - name: warehouse_id
        type: string
        source: input
        description: FK -> Warehouse.id; state warehouse that received the lot and whose monitor_policy scores it.
      - name: federal_lot_code
        type: string
        source: input
        description: Federal lot code on the bill of lading; unique per warehouse.
        constraints: "1–40 chars, unique per warehouse_id"
      - name: cases_received
        type: integer
        source: input
        description: Cases on the federal entitlement receipt.
        constraints: "> 0"
      - name: cases_on_hand
        type: integer
        source: computed
        description: Cases physically present in the warehouse; initialised to cases_received on posting, debited by confirmed deliveries and accepted transfers.
        default: 0
      - name: cases_committed
        type: integer
        source: computed
        description: Cases reserved by APPROVED/HELD/SCHEDULED orders; released on order cancel and converted to shipments on delivery confirmation.
        default: 0
      - name: cases_shipped_to_date
        type: integer
        source: computed
        description: Cumulative cases that have left this lot via confirmed deliveries and accepted transfers; the turnover numerator.
        default: 0
      - name: pack_date
        type: string
        source: input
        description: Pack date; start of the shelf-life window used by the SHELF_LIFE_BASED variant.
        constraints: "ISO 8601 date (YYYY-MM-DD)"
      - name: best_by_date
        type: string
        source: input
        description: Best-by date; end of the shelf-life window. Must be strictly after pack_date.
        constraints: "ISO 8601 date (YYYY-MM-DD)"
      - name: entitlement_value_cents
        type: integer
        source: computed
        description: Total federal entitlement value charged to the state for this receipt; cases_received * Commodity.entitlement_value_cents_per_case, written at creation.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Lot lifecycle; RECEIVED until posted, WATCH when flagged by a monitor run, HOLD while a recall covers it.
        default: RECEIVED
        constraints: "RECEIVED | AVAILABLE | WATCH | HOLD | DISPOSED | DEPLETED"
      - name: monitor_flag
        type: enum
        source: computed
        description: Result of the most recent monitor run for this lot; EXCESS takes precedence over SLOW_MOVING.
        default: NONE
        constraints: "NONE | SLOW_MOVING | EXCESS"
      - name: slow_moving_index
        type: number
        source: computed
        description: Index produced by the warehouse's monitor_policy variant, 4 decimals; 0.0 until the first monitor run.
        default: 0.0
      - name: last_monitored_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent monitor run that evaluated this lot.
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant the receipt was posted to inventory (RECEIVED→AVAILABLE).
      - name: hold_recall_id
        type: string
        source: computed
        description: FK -> Recall.id; recall that placed this lot on hold; null unless status == HOLD.

  - name: AllocationCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_code
        type: string
        source: input
        description: Program period code; unique across all cycles.
        constraints: "uppercase, 3–20 chars, unique"
      - name: formula_variant
        type: enum
        source: input
        description: Selects which allocation variant compute-allocations applies (dual-variant switch).
        default: STANDARD
        constraints: "STANDARD | HOLD_HARMLESS"
      - name: allocatable_cases
        type: integer
        source: input
        description: Total case pool distributed across eligible agencies by the allocation formula.
        constraints: "> 0"
      - name: admin_funds_pool_cents
        type: integer
        source: input
        description: Administrative funds pool distributed at finalize; the conserved fiscal quantity.
        constraints: "> 0"
      - name: offered_commodity_codes
        type: array
        source: input
        description: Commodity.code values orderable in this cycle; an order line for any other commodity is rejected.
        constraints: "1–20 entries, each an existing Commodity.code"
      - name: order_window_open_at
        type: datetime
        source: input
        description: Inclusive start of the order window; submit before this instant is rejected.
      - name: order_window_close_at
        type: datetime
        source: input
        description: Exclusive end of the order window; submit at or after this instant is rejected.
        constraints: "> order_window_open_at"
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle.
        default: DRAFT
        constraints: "DRAFT | ALLOCATED | OPEN | CLOSED | RECONCILED"
      - name: draw_posture
        type: enum
        source: computed
        description: Compound posture derived from this cycle's AgencyAllocation rows; recomputed whenever any allocation's cases_committed/cases_delivered changes.
        default: NOT_STARTED
        constraints: "NOT_STARTED | PARTIAL | FULLY_DRAWN"
      - name: allocation_locked_at
        type: datetime
        source: computed
        description: Logical-clock instant compute-allocations locked the formula inputs.
      - name: total_allocated_cases
        type: integer
        source: computed
        description: Sum of allocated_cases over this cycle's AgencyAllocation rows; must equal allocatable_cases after compute-allocations.
        default: 0
      - name: eligible_agency_count
        type: integer
        source: computed
        description: Number of agencies with eligibility_posture == ELIGIBLE captured at compute-allocations time.
        default: 0
      - name: admin_funds_allocated_cents
        type: integer
        source: computed
        description: Sum of admin_funds_cents over this cycle's AgencyAllocation rows; must equal admin_funds_pool_cents after finalize.
        default: 0

  - name: AgencyAllocation
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AllocationCycle.id; cycle this entitlement belongs to.
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; agency holding this entitlement.
      - name: poverty_factor
        type: number
        source: computed
        description: ServiceArea.poverty_population divided by that area's eligible_agency_count, 4 decimals.
        default: 0.0
      - name: poverty_share
        type: number
        source: computed
        description: poverty_factor divided by the sum of poverty_factor over all included agencies, 6 decimals.
        default: 0.0
      - name: prior_share
        type: number
        source: computed
        description: Agency.prior_period_pounds_distributed divided by the sum over all included agencies, 6 decimals; 0.0 when that sum is 0.
        default: 0.0
      - name: raw_score
        type: number
        source: computed
        description: Weighted blend of poverty_share and prior_share, 6 decimals.
        default: 0.0
      - name: floor_cases
        type: integer
        source: computed
        description: HOLD_HARMLESS floor, floor(0.90 * Agency.prior_period_allocated_cases); 0 under STANDARD.
        default: 0
      - name: allocated_cases
        type: integer
        source: computed
        description: Cases entitled to this agency after rounding, floor lift and hold-harmless redistribution.
        default: 0
      - name: cases_committed
        type: integer
        source: computed
        description: Cases locked by APPROVED/HELD/SCHEDULED orders of this agency in this cycle.
        default: 0
      - name: cases_delivered
        type: integer
        source: computed
        description: Cases confirmed delivered against this entitlement.
        default: 0
      - name: cases_remaining
        type: integer
        source: computed
        description: allocated_cases - cases_committed - cases_delivered; the fiscal headroom checked at order submit.
        default: 0
      - name: distributed_pounds
        type: number
        source: computed
        description: Sum of pounds_distributed over this agency's RECORDED HouseholdDistribution rows in this cycle, 2 decimals.
        default: 0.0
      - name: distribution_record_count
        type: integer
        source: computed
        description: Count of this agency's RECORDED HouseholdDistribution rows in this cycle.
        default: 0
      - name: record_compliance_pct
        type: number
        source: computed
        description: Share of RECORDED rows carrying self_declaration_signed == true, 4 decimals; 0.0 when there are no RECORDED rows.
        default: 0.0
      - name: admin_funds_base_cents
        type: integer
        source: computed
        description: Pro-rata share of admin_funds_pool_cents by distributed_pounds, before withholding and redistribution.
        default: 0
      - name: admin_funds_withheld_cents
        type: integer
        source: computed
        description: Recordkeeping withholding applied to this agency at finalize.
        default: 0
      - name: admin_funds_cents
        type: integer
        source: computed
        description: Final administrative funds award after withholding and redistribution; sums across the cycle to admin_funds_pool_cents exactly.
        default: 0
      - name: status
        type: enum
        source: system
        description: Draw status of this entitlement.
        default: ENTITLED
        constraints: "ENTITLED | PARTIALLY_DRAWN | FULLY_DRAWN | RECONCILED"

  - name: CommodityOrder
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> AllocationCycle.id; cycle whose order window and offered commodities constrain this order.
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; ordering agency; must equal X-User-ID for AgencyCoordinator writes.
      - name: warehouse_id
        type: string
        source: input
        description: FK -> Warehouse.id; state warehouse whose lots fill this order.
      - name: status
        type: enum
        source: system
        description: Order lifecycle; cyclic through DRAFT on revision and through HELD on recall hold.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | HELD | SCHEDULED | DELIVERED | CANCELLED"
      - name: line_count
        type: integer
        source: computed
        description: Number of OrderLine rows on this order.
        default: 0
      - name: total_cases_requested
        type: integer
        source: computed
        description: Sum of cases_requested over the order's lines.
        default: 0
      - name: total_cases_approved
        type: integer
        source: computed
        description: Sum of cases_approved over the order's lines; 0 until approval.
        default: 0
      - name: total_pounds
        type: number
        source: computed
        description: Sum of per-line rounded line_pounds, 2 decimals; per-line rounding precedes summation.
        default: 0.0
      - name: total_pallets
        type: integer
        source: computed
        description: Sum of per-line line_pallets; per-line ceiling precedes summation.
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: Number of return-for-revision round trips this order has made.
        default: 0
      - name: last_returned_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceReviewer who last returned this order for revision; blocks that same reviewer from approving it.
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceReviewer who approved this order.
      - name: submitted_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent submit.
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant of approval.
      - name: cancel_reason
        type: string
        source: computed
        description: Reason captured at cancel; null otherwise.

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> CommodityOrder.id; owning order (taken from the action path, not the body).
      - name: commodity_id
        type: string
        source: input
        description: FK -> Commodity.id; ordered commodity; its code must appear in the cycle's offered_commodity_codes.
      - name: cases_requested
        type: integer
        source: input
        description: Cases requested on this line.
        constraints: "> 0"
      - name: cases_approved
        type: integer
        source: computed
        description: Cases approved on this line; set at approval from cases_requested or from the matching line_adjustments entry.
        default: 0
      - name: line_pounds
        type: number
        source: computed
        description: round_half_up(cases_approved * Commodity.net_weight_lbs_per_case, 2); recomputed at approval.
        default: 0.0
      - name: line_pallets
        type: integer
        source: computed
        description: ceil(cases_approved / Commodity.cases_per_pallet); recomputed at approval.
        default: 0
      - name: storage_class
        type: enum
        source: computed
        description: Copy of Commodity.storage_class at line creation; decides which capacity pool the line consumes.
        constraints: "DRY | COLD | FROZEN"
      - name: lot_assignments
        type: array
        source: computed
        description: FEFO lot reservations written at approval; entries of the form { lot_id, cases }.
        default: []

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: FK -> CommodityOrder.id; order being delivered.
      - name: warehouse_id
        type: string
        source: computed
        description: FK -> Warehouse.id; copied from the order at creation; must equal X-User-ID for StateWarehouseOperator writes.
      - name: agency_id
        type: string
        source: computed
        description: FK -> Agency.id; copied from the order at creation; owner of the aggregate cold-storage ceiling.
      - name: dock_number
        type: integer
        source: input
        description: Receiving dock; occupancy on a dock is exclusive with a turnaround buffer.
        constraints: ">= 1 and <= Warehouse.dock_count"
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the dock window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the dock window; must be strictly after window_start.
      - name: dry_pallets
        type: integer
        source: computed
        description: Sum of line_pallets over the order's DRY lines.
        default: 0
      - name: cold_pallets
        type: integer
        source: computed
        description: Sum of line_pallets over the order's COLD lines.
        default: 0
      - name: frozen_pallets
        type: integer
        source: computed
        description: Sum of line_pallets over the order's FROZEN lines; the quantity checked against both warehouse and agency frozen ceilings.
        default: 0
      - name: delivered_pounds
        type: number
        source: computed
        description: CommodityOrder.total_pounds captured at delivery confirmation, 2 decimals; 0.0 before.
        default: 0.0
      - name: status
        type: enum
        source: system
        description: Appointment lifecycle; BLOCKED while a recall holds one of the order's reserved lots.
        default: SCHEDULED
        constraints: "SCHEDULED | BLOCKED | DELIVERED | CANCELLED"
      - name: confirmed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateWarehouseOperator who confirmed delivery.
      - name: cancel_reason
        type: string
        source: computed
        description: Reason captured at cancel; null otherwise.

  - name: InventoryTransfer
    parent: null
    common_fields: true
    fields:
      - name: from_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; lot the cases are drawn from.
      - name: to_agency_id
        type: string
        source: input
        description: FK -> Agency.id; receiving agency, which must be ELIGIBLE to accept.
      - name: cases
        type: integer
        source: input
        description: Cases offered for transfer; bounded by the lot's uncommitted cases.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Transfer lifecycle.
        default: PROPOSED
        constraints: "PROPOSED | ACCEPTED | DECLINED"
      - name: transferred_value_cents
        type: integer
        source: computed
        description: cases * Commodity.entitlement_value_cents_per_case of the source lot's commodity, written at proposal.
        default: 0
      - name: decline_reason
        type: string
        source: computed
        description: Reason captured at decline; null otherwise.
      - name: accepted_at
        type: datetime
        source: computed
        description: Logical-clock instant of acceptance.

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - name: source_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; lot that triggered the recall.
      - name: commodity_code
        type: string
        source: computed
        description: Commodity.code of the source lot's commodity, denormalised at creation for downstream reporting.
      - name: recall_class
        type: enum
        source: input
        description: Federal recall class; CLASS_I requires acknowledgement before any held lot may be released.
        constraints: "CLASS_I | CLASS_II | CLASS_III"
      - name: hold_scope
        type: enum
        source: input
        description: LOT_ONLY holds the source lot; COMMODITY_WIDE holds every AVAILABLE/WATCH lot of the same commodity in every warehouse.
        constraints: "LOT_ONLY | COMMODITY_WIDE"
      - name: reason
        type: string
        source: input
        description: Recall narrative.
        constraints: 1–400 chars
      - name: initiated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the StateAdmin who raised the recall; that same user may not close it.
      - name: status
        type: enum
        source: system
        description: Recall lifecycle; returns to NOTIFYING when the downstream set is expanded.
        default: INITIATED
        constraints: "INITIATED | NOTIFYING | MONITORING | CLOSED"
      - name: held_lot_count
        type: integer
        source: computed
        description: Number of InventoryLot rows this recall moved to HOLD.
        default: 0
      - name: action_count
        type: integer
        source: computed
        description: Number of RecallAction rows attached to this recall.
        default: 0
      - name: acknowledged_count
        type: integer
        source: computed
        description: RecallAction rows in status ACKNOWLEDGED or DISPOSITIONED.
        default: 0
      - name: dispositioned_count
        type: integer
        source: computed
        description: RecallAction rows in status DISPOSITIONED.
        default: 0
      - name: accounted_cases
        type: integer
        source: computed
        description: Sum of cases_accounted over DISPOSITIONED actions.
        default: 0
      - name: notices_dispatched_at
        type: datetime
        source: computed
        description: Logical-clock instant notices were dispatched to downstream agencies.

  - name: RecallAction
    parent: null
    common_fields: true
    fields:
      - name: recall_id
        type: string
        source: input
        description: FK -> Recall.id; parent recall.
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; downstream agency that received cases from a held lot.
      - name: status
        type: enum
        source: system
        description: Per-agency execution state.
        default: PENDING_NOTICE
        constraints: "PENDING_NOTICE | NOTIFIED | ACKNOWLEDGED | DISPOSITIONED"
      - name: exposed_cases
        type: integer
        source: computed
        description: Cases from held lots delivered or transferred to this agency, captured when the action row is created.
        default: 0
      - name: disposition
        type: enum
        source: computed
        description: Reported outcome; null until DISPOSITIONED.
        constraints: "DESTROYED | RETURNED_TO_STATE | NOT_RECEIVED"
      - name: cases_accounted
        type: integer
        source: computed
        description: Cases the agency accounted for in its disposition report.
        default: 0
      - name: notified_at
        type: datetime
        source: computed
        description: Logical-clock instant this action was notified.
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock instant this action was acknowledged.
      - name: dispositioned_at
        type: datetime
        source: computed
        description: Logical-clock instant the disposition was reported.

  - name: HouseholdDistribution
    parent: null
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: FK -> Agency.id; distributing agency; must equal X-User-ID for AgencyCoordinator writes.
      - name: cycle_id
        type: string
        source: input
        description: FK -> AllocationCycle.id; cycle the distribution is recorded against.
      - name: commodity_id
        type: string
        source: input
        description: FK -> Commodity.id; commodity handed to the household.
      - name: household_size
        type: integer
        source: input
        description: Persons in the household as self-declared.
        constraints: ">= 1 and <= 20"
      - name: declared_monthly_income_cents
        type: integer
        source: input
        description: Self-declared gross monthly household income in cents.
        constraints: ">= 0"
      - name: participates_in_snap
        type: boolean
        source: input
        description: Self-declared SNAP participation; grants categorical eligibility regardless of declared income.
        default: false
      - name: self_declaration_signed
        type: boolean
        source: input
        description: Whether the signed self-declaration form was captured; the recordkeeping-compliance numerator.
      - name: cases_distributed
        type: integer
        source: input
        description: Cases handed to this household; debited from Agency.agency_cases_on_hand.
        constraints: "> 0"
      - name: distribution_date
        type: string
        source: input
        description: Date of distribution.
        constraints: "ISO 8601 date (YYYY-MM-DD)"
      - name: pounds_distributed
        type: number
        source: computed
        description: round_half_up(cases_distributed * Commodity.net_weight_lbs_per_case, 2).
        default: 0.0
      - name: income_limit_cents
        type: integer
        source: computed
        description: HOUSEHOLD_BASE_LIMIT_CENTS + (household_size - 1) * HOUSEHOLD_PER_PERSON_CENTS.
        default: 0
      - name: eligibility_determination
        type: enum
        source: computed
        description: ELIGIBLE when the income test passes; CATEGORICALLY_ELIGIBLE when it fails but participates_in_snap is true.
        constraints: "ELIGIBLE | CATEGORICALLY_ELIGIBLE"
      - name: status
        type: enum
        source: system
        description: Record lifecycle; VOIDED records are excluded from every aggregate.
        default: RECORDED
        constraints: "RECORDED | VOIDED"
      - name: void_reason
        type: string
        source: computed
        description: Reason captured at void; null otherwise.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Agency: axis 1 of 2 (agreement). Evolves independently of the training
  #      axis below; eligibility_posture is the derived join of the two axes.
  - entity: Agency
    state_field: agreement_status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /efap/agencies/{id}/agreement-renewals"
        actor: ComplianceReviewer
        preconditions:
          - "agency.training_status == CURRENT (else ERR_TRAINING_NOT_CURRENT)"
          - "agreement_end_date > agreement_start_date (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets agreement_start_date / agreement_end_date from the payload"
          - "renewal_count += 1"
          - "recomputes Agency.eligibility_posture per calculations.agency_eligibility_posture"
          - "recomputes ServiceArea.eligible_agency_count for Agency.service_area_id"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /efap/agencies/{id}/agreement-renewals"
        actor: ComplianceReviewer
        preconditions:
          - "agency.training_status == CURRENT (else ERR_TRAINING_NOT_CURRENT)"
          - "payload agreement_start_date > current agreement_end_date (else ERR_AGREEMENT_NOT_RENEWABLE)"
        side_effects:
          - "replaces the agreement term with the payload dates"
          - "renewal_count += 1"
        note: "Self-loop: early renewal of a still-ACTIVE agreement."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /efap/compliance-sweeps (ops-run checkpoint)"
        actor: system
        preconditions:
          - "date(current_utc) > agreement_end_date"
        side_effects:
          - "recomputes Agency.eligibility_posture -> INELIGIBLE"
          - "recomputes ServiceArea.eligible_agency_count for Agency.service_area_id"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /efap/agencies/{id}/agreement-renewals"
        actor: ComplianceReviewer
        preconditions:
          - "agency.training_status == CURRENT (else ERR_TRAINING_NOT_CURRENT)"
        side_effects:
          - "sets the new agreement term, renewal_count += 1"
          - "recomputes Agency.eligibility_posture"
          - "recomputes ServiceArea.eligible_agency_count"
        note: "Renewal cycle: ACTIVE -> EXPIRED -> ACTIVE."
      - from: EXPIRED
        to: TERMINATED
        trigger: "POST /efap/compliance-sweeps (ops-run checkpoint)"
        actor: system
        preconditions:
          - "date(current_utc) >= agreement_end_date + AGREEMENT_TERMINATION_GRACE_DAYS (90 days)"
        side_effects:
          - "every CommodityOrder of this agency in status DRAFT or SUBMITTED -> CANCELLED with cancel_reason 'AGREEMENT_TERMINATED' (conditional cascade: terminal and post-approval orders untouched)"
          - "recomputes ServiceArea.eligible_agency_count"

  # ---- Agency: axis 2 of 2 (civil rights training). Independent of the
  #      agreement axis; both axes may transition in either order.
  - entity: Agency
    state_field: training_status
    initial_state: REQUIRED
    terminal_states: []
    transitions:
      - from: REQUIRED
        to: CURRENT
        trigger: "POST /efap/agencies/{id}/civil-rights-trainings"
        actor: ComplianceReviewer
        preconditions:
          - "completed_at <= current_utc (else ERR_INVALID_REQUEST)"
          - "attendee_count >= 1 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "last_training_completed_at = completed_at"
          - "training_expires_at = completed_at + TRAINING_VALID_DAYS (365 days)"
          - "recomputes Agency.eligibility_posture"
      - from: CURRENT
        to: CURRENT
        trigger: "POST /efap/agencies/{id}/civil-rights-trainings"
        actor: ComplianceReviewer
        preconditions:
          - "completed_at > agency.last_training_completed_at (else ERR_INVALID_REQUEST)"
        side_effects:
          - "refreshes last_training_completed_at and training_expires_at"
        note: "Self-loop: re-training before expiry extends the window."
      - from: CURRENT
        to: LAPSED
        trigger: "POST /efap/compliance-sweeps (ops-run checkpoint)"
        actor: system
        preconditions:
          - "current_utc >= agency.training_expires_at (inclusive boundary: exactly at expiry lapses)"
        side_effects:
          - "recomputes Agency.eligibility_posture -> PROBATION when agreement_status == ACTIVE, else INELIGIBLE"
          - "recomputes ServiceArea.eligible_agency_count"
      - from: LAPSED
        to: CURRENT
        trigger: "POST /efap/agencies/{id}/civil-rights-trainings"
        actor: ComplianceReviewer
        preconditions:
          - "completed_at <= current_utc (else ERR_INVALID_REQUEST)"
        side_effects:
          - "refreshes last_training_completed_at / training_expires_at"
          - "recomputes Agency.eligibility_posture (PROBATION -> ELIGIBLE when agreement_status == ACTIVE)"
        note: "Training cycle: CURRENT -> LAPSED -> CURRENT."

  - entity: AllocationCycle
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: ALLOCATED
        trigger: "POST /efap/allocation-cycles/{id}/compute-allocations"
        actor: StateAdmin
        preconditions:
          - "at least one Agency has eligibility_posture == ELIGIBLE (else ERR_NO_ELIGIBLE_AGENCIES)"
          - "every entry of offered_commodity_codes resolves to a Commodity.code (else ERR_COMMODITY_NOT_FOUND)"
          - "under formula_variant == HOLD_HARMLESS, the floor lift is fundable (else ERR_ALLOCATION_INFEASIBLE)"
        side_effects:
          - "creates one AgencyAllocation row per ELIGIBLE agency with poverty_factor / poverty_share / prior_share / raw_score / floor_cases / allocated_cases per calculations.agency_case_allocation"
          - "cycle.total_allocated_cases = sum(allocated_cases) == cycle.allocatable_cases"
          - "cycle.eligible_agency_count and cycle.allocation_locked_at set"
          - "increments AllocationCycle.version by 1"
      - from: ALLOCATED
        to: OPEN
        trigger: "POST /efap/allocation-cycles/{id}/open-window"
        actor: StateAdmin
        preconditions:
          - "current_utc < cycle.order_window_close_at (else ERR_ORDER_WINDOW_CLOSED)"
        side_effects:
          - "increments AllocationCycle.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /efap/allocation-cycles/{id}/close-window"
        actor: StateAdmin
        preconditions:
          - "cycle.status == OPEN"
        side_effects:
          - "every CommodityOrder of this cycle in status DRAFT -> CANCELLED with cancel_reason 'WINDOW_CLOSED' (conditional cascade: SUBMITTED and later orders survive for review)"
          - "increments AllocationCycle.version by 1"
      - from: CLOSED
        to: RECONCILED
        trigger: "POST /efap/allocation-cycles/{id}/finalize"
        actor: StateAdmin
        preconditions:
          - "no CommodityOrder of this cycle is in SUBMITTED, APPROVED, HELD or SCHEDULED (else ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "per allocation: record_compliance_pct, admin_funds_base_cents, admin_funds_withheld_cents, admin_funds_cents per calculations.admin_funds_allocation"
          - "every AgencyAllocation of the cycle -> status RECONCILED"
          - "cycle.admin_funds_allocated_cents = sum(admin_funds_cents) == cycle.admin_funds_pool_cents"
          - "increments AllocationCycle.version by 1"

  - entity: InventoryLot
    initial_state: RECEIVED
    terminal_states: [DISPOSED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: AVAILABLE
        trigger: "POST /efap/inventory-lots/{id}/post"
        actor: StateAdmin
        preconditions:
          - "lot.status == RECEIVED (else ERR_INVALID_LOT_STATE)"
          - "no Recall in status INITIATED, NOTIFYING or MONITORING covers this lot (else ERR_RECALL_HOLD_ACTIVE)"
        side_effects:
          - "cases_on_hand = cases_received; cases_committed = 0; posted_at = current_utc"
      - from: AVAILABLE
        to: WATCH
        trigger: "POST /efap/inventory-monitor-runs (ops-run checkpoint)"
        actor: system
        preconditions:
          - "calculations.lot_monitor_flag yields EXCESS or SLOW_MOVING for this lot"
        side_effects:
          - "monitor_flag, slow_moving_index, last_monitored_at written"
      - from: WATCH
        to: AVAILABLE
        trigger: "POST /efap/inventory-monitor-runs (ops-run checkpoint)"
        actor: system
        preconditions:
          - "calculations.lot_monitor_flag yields NONE for this lot"
        side_effects:
          - "monitor_flag = NONE; slow_moving_index and last_monitored_at refreshed"
      - from: AVAILABLE
        to: HOLD
        trigger: "POST /efap/recalls (LOT_ONLY or COMMODITY_WIDE scope)"
        actor: system
        preconditions:
          - "lot is the recall's source_lot_id, or hold_scope == COMMODITY_WIDE and lot.commodity_id matches the source lot's commodity_id"
        side_effects:
          - "hold_recall_id = recall.id; recall.held_lot_count += 1"
          - "cascade link 2: every DeliveryAppointment in status SCHEDULED whose order reserves cases from this lot (OrderLine.lot_assignments contains lot.id) -> BLOCKED"
      - from: WATCH
        to: HOLD
        trigger: "POST /efap/recalls (LOT_ONLY or COMMODITY_WIDE scope)"
        actor: system
        preconditions:
          - "same coverage test as AVAILABLE -> HOLD"
        side_effects:
          - "hold_recall_id = recall.id; recall.held_lot_count += 1; monitor_flag preserved"
          - "cascade link 2: SCHEDULED DeliveryAppointments drawing on this lot -> BLOCKED"
      - from: HOLD
        to: AVAILABLE
        trigger: "POST /efap/recalls/{id}/close"
        actor: system
        preconditions:
          - "recall.dispositioned_count == recall.action_count"
          - "no DISPOSITIONED action of the recall reported disposition == DESTROYED"
        side_effects:
          - "hold_recall_id = null"
          - "every DeliveryAppointment in status BLOCKED that was blocked by this lot -> SCHEDULED"
          - "every CommodityOrder in status HELD whose lot_assignments reference this lot -> APPROVED"
      - from: HOLD
        to: DISPOSED
        trigger: "POST /efap/recalls/{id}/close"
        actor: system
        preconditions:
          - "recall.dispositioned_count == recall.action_count"
          - "at least one DISPOSITIONED action of the recall reported disposition == DESTROYED"
        side_effects:
          - "cases_on_hand = 0; cases_committed = 0"
          - "every DeliveryAppointment in status BLOCKED or SCHEDULED drawing on this lot -> CANCELLED with cancel_reason 'LOT_DISPOSED'"
          - "every CommodityOrder in status HELD or APPROVED whose lot_assignments reference this lot -> CANCELLED; the release path of calculations.commitment_ledger runs for each"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "POST /efap/delivery-appointments/{id}/confirm-delivery or POST /efap/inventory-transfers/{id}/accept"
        actor: system
        preconditions:
          - "cases_on_hand reaches 0 after the debit"
        side_effects:
          - "monitor_flag = NONE"
      - from: WATCH
        to: DEPLETED
        trigger: "POST /efap/delivery-appointments/{id}/confirm-delivery or POST /efap/inventory-transfers/{id}/accept"
        actor: system
        preconditions:
          - "cases_on_hand reaches 0 after the debit"
        side_effects:
          - "monitor_flag = NONE"

  - entity: CommodityOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /efap/commodity-orders/{id}/submit"
        actor: AgencyCoordinator
        preconditions:
          - "cycle.status == OPEN (else ERR_ORDER_WINDOW_NOT_OPEN)"
          - "cycle.order_window_open_at <= current_utc (else ERR_ORDER_WINDOW_NOT_OPEN)"
          - "current_utc < cycle.order_window_close_at (else ERR_ORDER_WINDOW_CLOSED)"
          - "Agency.eligibility_posture == ELIGIBLE (else ERR_AGENCY_INELIGIBLE)"
          - "order.line_count >= 1 (else ERR_EMPTY_ORDER)"
          - "every line's Commodity.code is in cycle.offered_commodity_codes (else ERR_COMMODITY_NOT_OFFERED)"
          - "order.total_cases_requested <= allocation.cases_remaining (else ERR_ALLOCATION_EXCEEDED)"
        side_effects:
          - "submitted_at = current_utc"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /efap/commodity-orders/{id}/return-for-revision"
        actor: ComplianceReviewer
        preconditions:
          - "order.status == SUBMITTED (else ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "revision_count += 1; last_returned_by_user_id = X-User-ID"
        note: "Revision cycle: DRAFT -> SUBMITTED -> DRAFT -> SUBMITTED."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /efap/commodity-orders/{id}/approve"
        actor: ComplianceReviewer
        preconditions:
          - "order.revision_count == 0 or X-User-ID != order.last_returned_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "Agency.eligibility_posture == ELIGIBLE (else ERR_AGENCY_INELIGIBLE)"
          - "each line_adjustments entry names an OrderLine of this order with cases_approved in 1..cases_requested (else ERR_INVALID_REQUEST)"
          - "FEFO lots at order.warehouse_id cover every line's approved cases (else ERR_INSUFFICIENT_INVENTORY)"
          - "order.total_cases_approved <= allocation.cases_remaining (else ERR_ALLOCATION_EXCEEDED)"
        side_effects:
          - "per line: cases_approved, line_pounds, line_pallets, lot_assignments per calculations.order_line_pound_conversion and calculations.fefo_lot_reservation"
          - "order.total_cases_approved / total_pounds / total_pallets set; approved_at, approved_by_user_id set"
          - "each reserved InventoryLot.cases_committed += reserved cases"
          - "cascade: AgencyAllocation.cases_committed += total_cases_approved, cases_remaining recomputed, allocation.status -> PARTIALLY_DRAWN; AllocationCycle.draw_posture recomputed"
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /efap/delivery-appointments"
        actor: system
        preconditions:
          - "no DeliveryAppointment in SCHEDULED, BLOCKED or DELIVERED already exists for this order"
        side_effects:
          - "appointment created in SCHEDULED"
      - from: APPROVED
        to: HELD
        trigger: "POST /efap/recalls (cascade link 3)"
        actor: system
        preconditions:
          - "one of the order's lot_assignments references a lot moved to HOLD by this recall"
        side_effects:
          - "commitments stay in place; the order cannot be scheduled or delivered while HELD"
      - from: SCHEDULED
        to: HELD
        trigger: "POST /efap/recalls (cascade link 3)"
        actor: system
        preconditions:
          - "the order's DeliveryAppointment was moved to BLOCKED by cascade link 2"
        side_effects:
          - "commitments stay in place"
        note: "Cascade chain: recall -> lot HOLD -> appointment BLOCKED -> order HELD."
      - from: HELD
        to: APPROVED
        trigger: "POST /efap/recalls/{id}/close (hold release)"
        actor: system
        preconditions:
          - "every lot referenced by the order's lot_assignments has status AVAILABLE or WATCH again"
        side_effects:
          - "order returns to APPROVED; a BLOCKED appointment returns to SCHEDULED and the order returns to SCHEDULED in the same cascade"
        note: "Hold cycle: APPROVED -> HELD -> APPROVED."
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /efap/delivery-appointments/{id}/confirm-delivery (cascade link 2)"
        actor: system
        preconditions:
          - "the order's appointment transitioned SCHEDULED -> DELIVERED"
        side_effects:
          - "cascade link 3: AgencyAllocation.cases_committed -= total_cases_approved, cases_delivered += total_cases_approved, cases_remaining recomputed; allocation.status -> FULLY_DRAWN when cases_remaining == 0, else PARTIALLY_DRAWN"
          - "cascade link 4: AllocationCycle.draw_posture recomputed from all its allocations (FULLY_DRAWN only when every allocation is FULLY_DRAWN)"
          - "Agency.agency_cases_on_hand += total_cases_approved; Agency.delivered_cases_ytd += total_cases_approved"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /efap/commodity-orders/{id}/cancel, POST /efap/commodity-orders (supersede), POST /efap/allocation-cycles/{id}/close-window, or agreement termination sweep"
        actor: AgencyCoordinator
        preconditions:
          - "order.status == DRAFT"
        side_effects:
          - "cancel_reason written; no commitments exist to release"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /efap/commodity-orders/{id}/cancel"
        actor: AgencyCoordinator
        preconditions:
          - "order.status == SUBMITTED"
        side_effects:
          - "cancel_reason written; no commitments exist to release"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /efap/commodity-orders/{id}/cancel"
        actor: AgencyCoordinator
        preconditions:
          - "order.status == APPROVED"
        side_effects:
          - "compensation: each lot in lot_assignments has cases_committed -= its reserved cases (cases_on_hand untouched)"
          - "compensation: AgencyAllocation.cases_committed -= total_cases_approved, cases_remaining recomputed, allocation.status -> ENTITLED when cases_committed == 0 and cases_delivered == 0"
          - "AllocationCycle.draw_posture recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /efap/commodity-orders/{id}/cancel"
        actor: AgencyCoordinator
        preconditions:
          - "order.status == SCHEDULED"
        side_effects:
          - "the order's DeliveryAppointment in SCHEDULED or BLOCKED -> CANCELLED"
          - "same commitment compensation as APPROVED -> CANCELLED"

  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: BLOCKED
        trigger: "POST /efap/recalls (cascade link 2)"
        actor: system
        preconditions:
          - "the order's lot_assignments reference a lot this recall moved to HOLD"
        side_effects:
          - "cascade link 3: the order moves APPROVED/SCHEDULED -> HELD"
      - from: BLOCKED
        to: SCHEDULED
        trigger: "POST /efap/recalls/{id}/close (hold release)"
        actor: system
        preconditions:
          - "every lot referenced by the order's lot_assignments is AVAILABLE or WATCH"
        side_effects:
          - "the order returns HELD -> APPROVED -> SCHEDULED"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /efap/delivery-appointments/{id}/confirm-delivery"
        actor: StateWarehouseOperator
        preconditions:
          - "X-User-ID == appointment.warehouse_id (else ERR_NOT_RESOURCE_OWNER)"
          - "appointment.status == SCHEDULED (else ERR_INVALID_APPOINTMENT_STATE)"
          - "current_utc >= appointment.window_start (else ERR_APPOINTMENT_WINDOW_INVALID)"
          - "every lot in the order's lot_assignments has status AVAILABLE or WATCH (else ERR_RECALL_HOLD_ACTIVE)"
        side_effects:
          - "delivered_pounds = order.total_pounds; confirmed_by_user_id = X-User-ID"
          - "each reserved lot: cases_on_hand -= reserved cases, cases_committed -= reserved cases, cases_shipped_to_date += reserved cases; lot -> DEPLETED when cases_on_hand hits 0"
          - "cascade link 2: the order moves SCHEDULED -> DELIVERED, which drives cascade links 3 and 4 (allocation then cycle posture)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /efap/delivery-appointments/{id}/cancel"
        actor: StateAdmin
        preconditions:
          - "appointment.status == SCHEDULED"
        side_effects:
          - "the order returns SCHEDULED -> APPROVED (commitments retained, appointment slot released)"
      - from: BLOCKED
        to: CANCELLED
        trigger: "POST /efap/delivery-appointments/{id}/cancel"
        actor: StateAdmin
        preconditions:
          - "appointment.status == BLOCKED"
        side_effects:
          - "the order stays HELD; the dock window and both pallet ceilings are released"

  - entity: InventoryTransfer
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /efap/inventory-transfers/{id}/accept"
        actor: AgencyCoordinator
        preconditions:
          - "X-User-ID == transfer.to_agency_id (else ERR_NOT_RESOURCE_OWNER)"
          - "receiving Agency.eligibility_posture == ELIGIBLE (else ERR_AGENCY_INELIGIBLE)"
          - "source lot.status in {AVAILABLE, WATCH} (else ERR_RECALL_HOLD_ACTIVE when HOLD, ERR_INVALID_LOT_STATE otherwise)"
        side_effects:
          - "lot.cases_on_hand -= cases; lot.cases_committed -= cases; lot.cases_shipped_to_date += cases"
          - "receiving Agency.agency_cases_on_hand += cases"
          - "lot -> DEPLETED when cases_on_hand hits 0"
          - "accepted_at = current_utc"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /efap/inventory-transfers/{id}/decline"
        actor: AgencyCoordinator
        preconditions:
          - "X-User-ID == transfer.to_agency_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "compensation: lot.cases_committed -= cases (cases_on_hand untouched); decline_reason written"

  - entity: Recall
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: NOTIFYING
        trigger: "POST /efap/recalls/{id}/dispatch-notices"
        actor: StateAdmin
        preconditions:
          - "recall.action_count >= 1 (else ERR_INVALID_RECALL_STATE)"
        side_effects:
          - "every RecallAction in PENDING_NOTICE -> NOTIFIED with notified_at = current_utc"
          - "notices_dispatched_at = current_utc"
      - from: NOTIFYING
        to: MONITORING
        trigger: "POST /efap/recall-actions/{id}/acknowledge (bubble up)"
        actor: system
        preconditions:
          - "recall.acknowledged_count == recall.action_count"
        side_effects:
          - "no field writes beyond the recall counters"
      - from: MONITORING
        to: NOTIFYING
        trigger: "POST /efap/recalls/{id}/expand"
        actor: StateAdmin
        preconditions:
          - "recall.status == MONITORING (else ERR_INVALID_RECALL_STATE)"
          - "no RecallAction of this recall already names the agency (else ERR_INVALID_RECALL_ACTION_STATE)"
        side_effects:
          - "creates one RecallAction in PENDING_NOTICE for the named agency; action_count += 1"
        note: "Recall cycle: NOTIFYING -> MONITORING -> NOTIFYING."
      - from: MONITORING
        to: CLOSED
        trigger: "POST /efap/recalls/{id}/close"
        actor: StateAdmin
        preconditions:
          - "recall.dispositioned_count == recall.action_count (else ERR_INVALID_RECALL_STATE)"
        side_effects:
          - "every lot held by this recall -> AVAILABLE when no disposition is DESTROYED, else -> DISPOSED, with the release or disposal cascade of the InventoryLot machine"
      - from: INITIATED
        to: CLOSED
        trigger: "POST /efap/recalls/{id}/close"
        actor: StateAdmin
        preconditions:
          - "recall.action_count == 0 (a recall with at least one action must pass through NOTIFYING and MONITORING first, else ERR_INVALID_RECALL_STATE)"
        side_effects:
          - "every lot held by this recall -> AVAILABLE (no downstream exposure exists, so no disposal path applies), with the release cascade of the InventoryLot machine"
        note: "Zero-exposure escape hatch: a recall raised on a lot with no delivered or transferred cases downstream has no RecallAction to dispatch, so it closes directly from INITIATED and frees the held lots."

  - entity: RecallAction
    initial_state: PENDING_NOTICE
    terminal_states: [DISPOSITIONED]
    transitions:
      - from: PENDING_NOTICE
        to: NOTIFIED
        trigger: "POST /efap/recalls/{id}/dispatch-notices"
        actor: StateAdmin
        preconditions:
          - "parent recall.status == INITIATED or NOTIFYING"
        side_effects:
          - "notified_at = current_utc"
      - from: NOTIFIED
        to: ACKNOWLEDGED
        trigger: "POST /efap/recall-actions/{id}/acknowledge"
        actor: AgencyCoordinator
        preconditions:
          - "X-User-ID == action.agency_id (else ERR_NOT_RESOURCE_OWNER)"
          - "action.status == NOTIFIED (else ERR_INVALID_RECALL_ACTION_STATE)"
        side_effects:
          - "acknowledged_at = current_utc; recall.acknowledged_count += 1"
          - "bubble up: recall NOTIFYING -> MONITORING when acknowledged_count == action_count"
      - from: ACKNOWLEDGED
        to: DISPOSITIONED
        trigger: "POST /efap/recall-actions/{id}/report-disposition"
        actor: AgencyCoordinator
        preconditions:
          - "X-User-ID == action.agency_id (else ERR_NOT_RESOURCE_OWNER)"
          - "cases_accounted <= action.exposed_cases (else ERR_INVALID_REQUEST)"
          - "for disposition == RETURNED_TO_STATE: cases_accounted <= Agency.agency_cases_on_hand (else ERR_AGENCY_INVENTORY_INSUFFICIENT)"
        side_effects:
          - "disposition, cases_accounted, dispositioned_at written; recall.dispositioned_count += 1; recall.accounted_cases += cases_accounted"
          - "for RETURNED_TO_STATE: Agency.agency_cases_on_hand -= cases_accounted and the source lot's cases_on_hand += cases_accounted"

  - entity: HouseholdDistribution
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /efap/household-distributions/{id}/void"
        actor: AgencyCoordinator
        preconditions:
          - "X-User-ID == distribution.agency_id (else ERR_NOT_RESOURCE_OWNER)"
          - "distribution.status == RECORDED (else ERR_INVALID_DISTRIBUTION_STATE)"
          - "cycle.status != RECONCILED (else ERR_INVALID_CYCLE_STATE)"
        side_effects:
          - "compensation: AgencyAllocation.distributed_pounds -= pounds_distributed, distribution_record_count -= 1, record_compliance_pct recomputed over the remaining RECORDED rows"
          - "compensation: Agency.agency_cases_on_hand += cases_distributed"
          - "void_reason written"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-allocation
    parent_entity: AgencyAllocation
    write_endpoint: "POST /efap/commodity-orders"
    occ_field: "expected_agency_allocation_version"
    description: |
      Creating a CommodityOrder against an AgencyAllocation whose version has
      advanced since the client last read it is rejected. This captures the case
      where a prior DRAFT order for the same agency and cycle was already
      superseded and cancelled by another writer (the supersede path is a
      legitimate product behaviour, so a second sequential create would itself
      succeed under natural semantics), and the current writer's view of the
      entitlement headroom is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /efap/inventory-transfers"
    occ_field: "expected_inventory_lot_version"
    description: |
      Proposing an InventoryTransfer against an InventoryLot whose version has
      advanced since the client last read it is rejected. Multiple transfers may
      legitimately be proposed from one lot, so a second sequential proposal
      against unchanged state would succeed; the stale-version check is what
      stops a proposal written against an outdated view of the lot's
      uncommitted cases.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: agency_eligibility_posture
    trigger: "Any write to Agency.agreement_status or Agency.training_status (agreement renewal, civil rights training record, compliance sweep)"
    algorithm: constraint_propagation
    formula: |
      posture(agency):
        if agency.agreement_status == ACTIVE and agency.training_status == CURRENT: ELIGIBLE
        elif agency.agreement_status == ACTIVE and agency.training_status == LAPSED: PROBATION
        else: INELIGIBLE
      # Gates that read the posture:
      #   ELIGIBLE only  -> included by compute-allocations, order submit, order approve,
      #                     inventory transfer accept
      #   ELIGIBLE or PROBATION -> household distribution recording, delivery confirmation
      #                     of an already-approved order
      #   INELIGIBLE -> none of the above
      # After every posture write, ServiceArea.eligible_agency_count of
      # agency.service_area_id is recomputed as the count of agencies in that area
      # whose posture == ELIGIBLE.
    input_set: "One agency at a time; both axes read from the same row after the triggering write is applied"
    constants:
      TRAINING_VALID_DAYS: 365
      AGREEMENT_TERMINATION_GRACE_DAYS: 90
    precision: "enum result; no rounding"

  - name: agency_case_allocation
    trigger: "POST /efap/allocation-cycles/{id}/compute-allocations (DRAFT -> ALLOCATED); writes AgencyAllocation.poverty_factor / poverty_share / prior_share / raw_score / floor_cases / allocated_cases and AllocationCycle.total_allocated_cases"
    algorithm: waterfall_allocation
    formula: |
      INCLUDED SET = every Agency whose eligibility_posture == ELIGIBLE at the instant the
      endpoint runs. PROBATION and INELIGIBLE agencies get no AgencyAllocation row at all.
      If the included set is empty -> ERR_NO_ELIGIBLE_AGENCIES (422).

      step 1  poverty_factor(a) = round_half_up(
                 ServiceArea(a.service_area_id).poverty_population
                 / ServiceArea(a.service_area_id).eligible_agency_count, 4)
              # co-located eligible agencies split their area's poverty count evenly
      step 2  sum_poverty = SUM over INCLUDED of poverty_factor
              poverty_share(a) = round_half_up(poverty_factor(a) / sum_poverty, 6)
      step 3  sum_prior = SUM over INCLUDED of Agency.prior_period_pounds_distributed
              if sum_prior == 0:
                  prior_share(a) = 0.000000
                  raw_score(a)   = poverty_share(a)      # weights collapse onto poverty
              else:
                  prior_share(a) = round_half_up(a.prior_period_pounds_distributed / sum_prior, 6)
                  raw_score(a)   = round_half_up(POVERTY_WEIGHT * poverty_share(a)
                                                 + PRIOR_WEIGHT * prior_share(a), 6)
      step 4  exact(a) = cycle.allocatable_cases * raw_score(a)
              base(a)  = floor(exact(a))
      step 5  remainder = cycle.allocatable_cases - SUM(base)
              rank INCLUDED by frac(a) = exact(a) - base(a) DESC,
                   tie-break poverty_factor(a) DESC, then AgencyAllocation.created_at ASC
              give +1 case to each of the first `remainder` agencies in that rank
              -> provisional(a)
      step 6  VARIANT SWITCH on cycle.formula_variant:
              STANDARD:      floor_cases(a) = 0
                             allocated_cases(a) = provisional(a)
              HOLD_HARMLESS: floor_cases(a) = floor(HOLD_HARMLESS_FLOOR_PCT
                                                    * a.prior_period_allocated_cases)
                shortfall_total = SUM over a of max(0, floor_cases(a) - provisional(a))
                donors = { a : provisional(a) > floor_cases(a) }, ranked by
                         excess(d) = provisional(d) - floor_cases(d) DESC,
                         tie-break Agency.prior_period_allocated_cases DESC,
                         then AgencyAllocation.created_at ASC
                excess_total = SUM over donors of excess(d)
                if shortfall_total > excess_total -> ERR_ALLOCATION_INFEASIBLE (422)
                for every donor EXCEPT the last in rank order:
                    reduction(d) = floor(shortfall_total * excess(d) / excess_total)
                last donor in rank order absorbs
                    shortfall_total - SUM(previous reductions)
                allocated_cases(a) = max(provisional(a), floor_cases(a)) - reduction(a)
      step 7  MINIMUM LIFT (single pass, both variants): every agency with
              allocated_cases < MIN_ALLOCATION_CASES is lifted to MIN_ALLOCATION_CASES.
              The lift is funded one case at a time from the agency with the largest
              allocated_cases (tie-break AgencyAllocation.created_at ASC), never taking an
              agency below max(MIN_ALLOCATION_CASES, floor_cases). If the lift cannot be
              fully funded -> ERR_ALLOCATION_INFEASIBLE (422). The lift never re-runs
              against its own output.
      step 8  INVARIANT: SUM(allocated_cases) == cycle.allocatable_cases, and
              cycle.total_allocated_cases is written from that sum.

      Each row starts with cases_committed = 0, cases_delivered = 0,
      cases_remaining = allocated_cases, status = ENTITLED.
    input_set: "Agencies with eligibility_posture == ELIGIBLE only; the ServiceArea poverty figures and Agency prior-period figures are read at run time and frozen into the AgencyAllocation row"
    constants:
      POVERTY_WEIGHT: 0.60
      PRIOR_WEIGHT: 0.40
      HOLD_HARMLESS_FLOOR_PCT: 0.90
      MIN_ALLOCATION_CASES: 5
    precision: "shares 6 decimals round_half_up; cases integer; remainder by largest fractional part, never by id"
    variants:
      - name: STANDARD
        when: "cycle.formula_variant == STANDARD"
        difference: "Pure poverty/prior blend with largest-remainder rounding; floor_cases stays 0 and no agency is protected against a decline versus its prior allocation."
      - name: HOLD_HARMLESS
        when: "cycle.formula_variant == HOLD_HARMLESS"
        difference: "Each agency is floored at 90% of its prior_period_allocated_cases; the shortfall is clawed back from donors pro-rata to their excess above their own floor, so identical poverty and prior-distribution inputs yield different allocated_cases than STANDARD."

  - name: order_line_pound_conversion
    trigger: "POST /efap/commodity-orders/{id}/approve (SUBMITTED -> APPROVED); writes OrderLine.line_pounds / line_pallets and CommodityOrder.total_pounds / total_pallets, and is read again when a DeliveryAppointment computes its per-class pallet counts"
    algorithm: aggregation
    formula: |
      per line:
        line_pounds(l)  = round_half_up(l.cases_approved
                                        * Commodity(l.commodity_id).net_weight_lbs_per_case, 2)
        line_pallets(l) = ceil(l.cases_approved / Commodity(l.commodity_id).cases_per_pallet)

      ROUNDING ORDER IS PINNED — round/ceil EACH LINE FIRST, THEN SUM:
        order.total_pounds  = SUM over lines of line_pounds(l)
        order.total_pallets = SUM over lines of line_pallets(l)

      appointment.dry_pallets    = SUM of line_pallets over lines with storage_class == DRY
      appointment.cold_pallets   = SUM of line_pallets over lines with storage_class == COLD
      appointment.frozen_pallets = SUM of line_pallets over lines with storage_class == FROZEN

      REJECTED ALTERNATIVES (they produce different numbers and are NOT the contract):
        - round_half_up(SUM(cases_approved * net_weight_lbs_per_case), 2)  [sum then round]
        - ceil(SUM(cases_approved) / cases_per_pallet)                     [sum then ceil]
      Worked contrast with net_weight_lbs_per_case = 24.375 / 20.000 / 30.125 and
      cases_per_pallet = 60 / 50 / 45: lines of 10 and 15 cases of CANNED_PEACHES plus
      23 cases of FROZEN_CHICKEN give total_pounds 1302.26 and total_pallets 3 under the
      pinned order, versus 1302.25 and 2 under the rejected alternatives.
    input_set: "Only OrderLine rows of the order being approved, with cases_approved as set by that approval (lines are never partially skipped)"
    constants: {}
    precision: "pounds 2 decimals round_half_up per line; pallets integer ceiling per line"

  - name: fefo_lot_reservation
    trigger: "POST /efap/commodity-orders/{id}/approve; writes OrderLine.lot_assignments and InventoryLot.cases_committed"
    algorithm: chronological
    formula: |
      For each OrderLine l of the order, in OrderLine.created_at ASC order:
        candidates = InventoryLot rows where
            warehouse_id == order.warehouse_id
            AND commodity_id == l.commodity_id
            AND status IN {AVAILABLE, WATCH}
            AND (cases_on_hand - cases_committed) > 0
        rank candidates by best_by_date ASC, then created_at ASC   # first-expired-first-out
        walk the ranked list, taking min(remaining_need,
              candidate.cases_on_hand - candidate.cases_committed) from each
        if the ranked list is exhausted while remaining_need > 0
              -> ERR_INSUFFICIENT_INVENTORY (409) and the WHOLE approval fails:
                 no line is partially reserved, no lot's cases_committed changes,
                 the order stays SUBMITTED
        else write l.lot_assignments = [ { lot_id, cases }, ... ] in fill order and
             add each taken amount to that lot's cases_committed
      Ranking never reads InventoryLot.id; created_at ASC is the only tie-break.
    input_set: "Lots at the order's warehouse only; RECEIVED, HOLD, DISPOSED and DEPLETED lots are invisible to the selector"
    constants: {}
    precision: "integer cases"

  - name: commitment_ledger
    trigger: "POST /efap/commodity-orders/{id}/approve, POST /efap/commodity-orders/{id}/cancel, POST /efap/delivery-appointments/{id}/confirm-delivery, POST /efap/inventory-transfers (propose), POST /efap/inventory-transfers/{id}/accept, POST /efap/inventory-transfers/{id}/decline"
    algorithm: aggregation
    formula: |
      Per-lot definition:
        AVAILABLE_CASES(lot) = lot.cases_on_hand - lot.cases_committed
      Named global quantity (conserved, physical cases):
        PROGRAM_CASE_TOTAL = SUM over InventoryLot with status IN {AVAILABLE, WATCH, HOLD}
                                 of cases_on_hand
                           + SUM over Agency of agency_cases_on_hand
      Per-allocation identity, true after every mutation:
        allocation.cases_remaining == allocation.allocated_cases
                                      - allocation.cases_committed
                                      - allocation.cases_delivered

      Forward / compensating pairs:
        approve  : lot.cases_committed += reserved ; allocation.cases_committed += approved
        cancel   : lot.cases_committed -= reserved ; allocation.cases_committed -= approved
                   => PROGRAM_CASE_TOTAL unchanged; every touched lot.cases_committed and
                      the allocation's cases_committed / cases_remaining return to their
                      exact pre-approve values (no drift).
        propose  : lot.cases_committed += cases
        decline  : lot.cases_committed -= cases
                   => PROGRAM_CASE_TOTAL unchanged; lot.cases_on_hand never moved.
        deliver  : lot.cases_on_hand -= reserved, lot.cases_committed -= reserved,
                   lot.cases_shipped_to_date += reserved,
                   Agency.agency_cases_on_hand += approved
                   => PROGRAM_CASE_TOTAL unchanged (cases move between two of its terms).
    input_set: "All lots referenced by the order's or transfer's reservations, plus the agency's on-hand counter"
    constants: {}
    precision: "integer cases; no rounding anywhere in the ledger"

  - name: lot_monitor_flag
    trigger: "POST /efap/inventory-monitor-runs (ops-run checkpoint); writes InventoryLot.slow_moving_index / monitor_flag / last_monitored_at and drives AVAILABLE <-> WATCH"
    algorithm: weighted_scoring
    formula: |
      INPUT SET: InventoryLot rows with status IN {AVAILABLE, WATCH}; when the payload
      supplies warehouse_id, only that warehouse's lots. RECEIVED, HOLD, DISPOSED and
      DEPLETED lots are skipped entirely and keep their previous monitor_flag.

      days_on_hand        = floor((current_utc - lot.posted_at) / 86400 seconds)
      turnover_ratio      = 0.0000 if lot.cases_received == 0
                            else round_half_up(lot.cases_shipped_to_date
                                               / lot.cases_received, 4)
      shelf_span_days     = (lot.best_by_date - lot.pack_date) in days
      shelf_remaining_pct = round_half_up(max(0, (lot.best_by_date - date(current_utc))
                                               in days) / shelf_span_days, 4)

      VARIANT SWITCH on Warehouse(lot.warehouse_id).monitor_policy:
        TURNOVER_BASED   : slow_moving_index = round_half_up(
                              0.70 * (1 - turnover_ratio)
                            + 0.30 * min(1.0, days_on_hand / 90), 4)
        SHELF_LIFE_BASED : slow_moving_index = round_half_up(
                              0.50 * (1 - shelf_remaining_pct)
                            + 0.50 * (1 - turnover_ratio), 4)

      FLAG PRECEDENCE IS PINNED (excess before staleness):
        if lot.cases_on_hand > Commodity(lot.commodity_id).excess_case_ceiling -> EXCESS
        elif slow_moving_index >= SLOW_INDEX_THRESHOLD                         -> SLOW_MOVING
        else                                                                    -> NONE
      Status follows the flag: EXCESS or SLOW_MOVING moves AVAILABLE -> WATCH;
      NONE moves WATCH -> AVAILABLE; a lot already in the right status only has its
      index and last_monitored_at refreshed.
      The threshold test is inclusive: an index of exactly 0.6000 is SLOW_MOVING.
    input_set: "AVAILABLE and WATCH lots only, optionally narrowed to one warehouse"
    constants:
      SLOW_INDEX_THRESHOLD: 0.60
      TURNOVER_WEIGHT: 0.70
      AGE_WEIGHT: 0.30
      AGE_SATURATION_DAYS: 90
      SHELF_WEIGHT: 0.50
    precision: "index 4 decimals round_half_up; threshold comparison on the rounded index"
    variants:
      - name: TURNOVER_BASED
        when: "Warehouse.monitor_policy == TURNOVER_BASED"
        difference: "Scores unsold share plus age saturation against a 90-day horizon; ignores the shelf-life window entirely."
      - name: SHELF_LIFE_BASED
        when: "Warehouse.monitor_policy == SHELF_LIFE_BASED"
        difference: "Scores consumed shelf life plus unsold share; the same lot with the same shipments can score above 0.60 under TURNOVER_BASED and below 0.60 under SHELF_LIFE_BASED, so the two policies flag different lots from identical data."

  - name: appointment_capacity_occupancy
    trigger: "POST /efap/delivery-appointments (creation); read-only checks that gate the appointment"
    algorithm: interval_merge
    formula: |
      new = the appointment being created (windows are UTC instants).

      A. DOCK EXCLUSIVITY — resource: Warehouse dock. Half-open windows PLUS a
         turnaround buffer applied on BOTH sides of every existing window:
         peers_A = appointments with warehouse_id == new.warehouse_id
                   AND dock_number == new.dock_number
                   AND status IN {SCHEDULED, BLOCKED, DELIVERED}
         conflict iff  new.window_start < (X.window_end + DOCK_TURNAROUND_MINUTES)
                   AND X.window_start < (new.window_end + DOCK_TURNAROUND_MINUTES)
         -> ERR_DOCK_WINDOW_CONFLICT (409)
         A new window starting exactly at X.window_end + 30 minutes is accepted;
         starting one minute earlier is rejected.

      B. WAREHOUSE STAGING CAPACITY — resource: Warehouse. Aggregate over HALF-OPEN
         overlap, so windows that merely touch do NOT interact:
         peers_B = appointments with warehouse_id == new.warehouse_id
                   AND status IN {SCHEDULED, BLOCKED}
                   AND X.window_start < new.window_end
                   AND new.window_start < X.window_end
         for class in {DRY, COLD, FROZEN}:
           if new.<class>_pallets + SUM over peers_B of <class>_pallets
              > warehouse.<class>_pallet_capacity
              -> ERR_WAREHOUSE_COLD_CAPACITY_EXCEEDED (409)

      C. AGENCY COLD STORAGE CEILING — resource: Agency. Aggregate over CLOSED
         overlap across ALL warehouses, so windows that touch at an endpoint DO
         interact:
         peers_C = appointments with agency_id == new.agency_id
                   AND status IN {SCHEDULED, BLOCKED}
                   AND X.window_start <= new.window_end
                   AND new.window_start <= X.window_end
         if new.frozen_pallets + SUM over peers_C of frozen_pallets
            > agency.cold_storage_pallet_capacity
            -> ERR_AGENCY_COLD_STORAGE_EXCEEDED (409)

      The three tests use three different geometries on purpose: buffered half-open
      exclusivity (A), plain half-open aggregation (B), closed-interval aggregation
      across warehouses (C). A pair of windows that touch at one instant is a
      conflict under A, harmless under B, and a capacity interaction under C.
    input_set: "SCHEDULED and BLOCKED appointments for B and C; DELIVERED appointments still occupy their dock under A but no longer consume staging or agency capacity"
    constants:
      DOCK_TURNAROUND_MINUTES: 30
    precision: "instant comparison at minute resolution; pallet sums are integers"

  - name: admin_funds_allocation
    trigger: "POST /efap/allocation-cycles/{id}/finalize (CLOSED -> RECONCILED); writes AgencyAllocation.admin_funds_base_cents / admin_funds_withheld_cents / admin_funds_cents and AllocationCycle.admin_funds_allocated_cents"
    algorithm: waterfall_allocation
    formula: |
      INPUT SET: every AgencyAllocation row of the cycle. distributed_pounds and
      record_compliance_pct are read as maintained by
      calculations.distribution_recordkeeping_rollup (VOIDED records already excluded).

      EVALUATION ORDER IS PINNED. Steps run exactly ONCE each, in this order — the
      dependency looks circular (each final award depends on a redistribution pool that
      itself depends on the base awards) and is resolved by forbidding any second pass:

      step 1  total_pounds = SUM over allocations of distributed_pounds
              if total_pounds == 0: substitute weight_a = allocated_cases and
                 total_weight = cycle.total_allocated_cases for step 2, so the pool is
                 still fully distributed and the invariant in step 6 holds.
              else weight_a = distributed_pounds(a), total_weight = total_pounds.
      step 2  exact_base(a) = cycle.admin_funds_pool_cents * weight_a / total_weight
              base(a) = floor(exact_base(a))
              residual = cycle.admin_funds_pool_cents - SUM(base)
              rank allocations by frac(a) = exact_base(a) - base(a) DESC,
                   tie-break weight_a DESC, then AgencyAllocation.created_at ASC
              give +1 cent to each of the first `residual` allocations
              -> admin_funds_base_cents(a)
      step 3  admin_funds_withheld_cents(a) =
                 floor(admin_funds_base_cents(a) * RECORDKEEPING_WITHHOLD_PCT)
                 when record_compliance_pct(a) < RECORDKEEPING_COMPLIANCE_MIN, else 0
              The test reads ONLY step-2 figures. It is never re-evaluated against the
              post-redistribution award of step 5.
      step 4  withheld_pool = SUM(admin_funds_withheld_cents)
              compliant = { a : admin_funds_withheld_cents(a) == 0 }
              if compliant is empty, `compliant` falls back to ALL allocations
              recipient_base_total = SUM over compliant of admin_funds_base_cents
              exact_redist(a) = withheld_pool * admin_funds_base_cents(a)
                                / recipient_base_total   (0 when recipient_base_total == 0)
              redist(a) = floor(exact_redist(a)) for a in compliant, else 0
              residual_r = withheld_pool - SUM(redist)
              rank compliant by frac DESC, tie-break admin_funds_base_cents DESC,
                   then AgencyAllocation.created_at ASC; give +1 cent each to the first
                   `residual_r` of them
      step 5  admin_funds_cents(a) = admin_funds_base_cents(a)
                                     - admin_funds_withheld_cents(a) + redist(a)
      step 6  INVARIANT (conserved fiscal quantity, cents):
              SUM(admin_funds_cents) == cycle.admin_funds_pool_cents exactly, and
              cycle.admin_funds_allocated_cents is written from that sum.
    input_set: "All AgencyAllocation rows of the cycle; only RECORDED HouseholdDistribution rows contribute pounds and compliance"
    constants:
      RECORDKEEPING_WITHHOLD_PCT: 0.10
      RECORDKEEPING_COMPLIANCE_MIN: 0.9500
    precision: "integer cents; every division floored then reconciled by largest fractional part, tie-break on weight then created_at, never on id"

  - name: distribution_recordkeeping_rollup
    trigger: "POST /efap/household-distributions and POST /efap/household-distributions/{id}/void; writes AgencyAllocation.distributed_pounds / distribution_record_count / record_compliance_pct and Agency.agency_cases_on_hand"
    algorithm: aggregation
    formula: |
      INPUT SET: HouseholdDistribution rows with agency_id == allocation.agency_id
      AND cycle_id == allocation.cycle_id AND status == RECORDED (VOIDED excluded).
        distribution_record_count  = COUNT(input set)
        distributed_pounds         = round_half_up(SUM of pounds_distributed, 2)
        record_compliance_pct      = 0.0000 when distribution_record_count == 0
                                     else round_half_up(
                                        COUNT(rows with self_declaration_signed == true)
                                        / distribution_record_count, 4)
      Agency.agency_cases_on_hand -= cases_distributed on record,
                                  += cases_distributed on void.
      Recording then voiding the same row therefore restores distributed_pounds,
      distribution_record_count, record_compliance_pct and agency_cases_on_hand to
      their exact pre-record values.
    input_set: "RECORDED rows only, scoped to one agency and one cycle"
    constants: {}
    precision: "pounds 2 decimals round_half_up; compliance 4 decimals round_half_up"

  - name: household_income_eligibility
    trigger: "POST /efap/household-distributions; writes HouseholdDistribution.income_limit_cents / eligibility_determination / pounds_distributed"
    algorithm: threshold
    formula: |
      income_limit_cents = HOUSEHOLD_BASE_LIMIT_CENTS
                         + (household_size - 1) * HOUSEHOLD_PER_PERSON_CENTS
      if declared_monthly_income_cents <= income_limit_cents:
          eligibility_determination = ELIGIBLE            # inclusive boundary
      elif participates_in_snap == true:
          eligibility_determination = CATEGORICALLY_ELIGIBLE
      else:
          reject with ERR_HOUSEHOLD_INELIGIBLE (422); no row is persisted and no
          rollup or on-hand counter moves
      pounds_distributed = round_half_up(cases_distributed
                                         * Commodity(commodity_id).net_weight_lbs_per_case, 2)
      Worked boundary at household_size == 3: income_limit_cents == 331000.
      331000 -> ELIGIBLE; 331001 -> ERR_HOUSEHOLD_INELIGIBLE;
      331001 with participates_in_snap == true -> CATEGORICALLY_ELIGIBLE.
    input_set: "The single self-declaration in the request; no history is consulted"
    constants:
      HOUSEHOLD_BASE_LIMIT_CENTS: 195000
      HOUSEHOLD_PER_PERSON_CENTS: 68000
    precision: "integer cents; pounds 2 decimals round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority; the
#      first violated rule decides the response and no later rule is consulted)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and non-empty on every endpoint except GET /efap/_clock/current"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The X-User-Role value is one of the four §1.7 roles and that role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the request path resolves to a stored row, validated left-to-right (e.g. /efap/agencies/{agency_id}/... resolves the agency before anything else)"
    error_id: ERR_AGENCY_NOT_FOUND | ERR_SERVICE_AREA_NOT_FOUND | ERR_COMMODITY_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_RECALL_NOT_FOUND | ERR_RECALL_ACTION_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: business_constraint
    check: "Request payload well-formedness: every required field present, types match §1.1, enum values inside their constraint list, integer ranges honoured (cases_requested > 0, cases > 0, cases_distributed > 0, 1 <= household_size <= 20, declared_monthly_income_cents >= 0, allocatable_cases > 0, admin_funds_pool_cents >= 0, 1 <= dock_number <= Warehouse.dock_count, window_end strictly after window_start, order_window_close_at strictly after order_window_open_at, agreement_end_date strictly after agreement_start_date, completed_at <= current_utc, attendee_count >= 1, reason 1-400 chars, pagination limit 1..100 and offset >= 0), and each line_adjustments entry names an OrderLine of the addressed order with cases_approved in 1..cases_requested"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints and any list endpoint taking pagination"

  - priority: 5
    category: existence
    check: "Every FK supplied in the request body resolves to a stored row (service_area_id, agency_id, cycle_id, commodity_id, warehouse_id, from_lot_id, source_lot_id, to_agency_id, order_id, agency_allocation_id)"
    error_id: ERR_AGENCY_NOT_FOUND | ERR_SERVICE_AREA_NOT_FOUND | ERR_COMMODITY_NOT_FOUND | ERR_WAREHOUSE_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying FKs in the body"

  - priority: 6
    category: auth
    check: "Resource ownership: for AgencyCoordinator writes X-User-ID must equal the addressed row's agency_id (order.agency_id, transfer.to_agency_id, action.agency_id, distribution.agency_id); for StateWarehouseOperator writes X-User-ID must equal the addressed appointment's warehouse_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /efap/commodity-orders, POST /efap/commodity-orders/{order_id}/lines, POST /efap/commodity-orders/{order_id}/submit, POST /efap/commodity-orders/{order_id}/cancel, POST /efap/inventory-transfers/{transfer_id}/accept, POST /efap/inventory-transfers/{transfer_id}/decline, POST /efap/recall-actions/{recall_action_id}/acknowledge, POST /efap/recall-actions/{recall_action_id}/report-disposition, POST /efap/household-distributions, POST /efap/household-distributions/{distribution_id}/void, POST /efap/delivery-appointments/{appointment_id}/confirm-delivery"

  - priority: 7
    category: state
    check: "Optimistic concurrency: the supplied expected_<parent>_version equals the current parent version (§1.2.1: expected_agency_allocation_version against AgencyAllocation.version, expected_inventory_lot_version against InventoryLot.version)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /efap/commodity-orders, POST /efap/inventory-transfers"

  - priority: 8
    category: state
    check: "The addressed row is in a state that admits the requested transition, per the §1.2 machine that owns it (order status, cycle status, lot status, appointment status, transfer status, recall status, recall action status, distribution status, and agreement renewability)"
    error_id: ERR_INVALID_ORDER_STATE | ERR_INVALID_CYCLE_STATE | ERR_INVALID_LOT_STATE | ERR_INVALID_APPOINTMENT_STATE | ERR_INVALID_TRANSFER_STATE | ERR_INVALID_RECALL_STATE | ERR_INVALID_RECALL_ACTION_STATE | ERR_INVALID_DISTRIBUTION_STATE | ERR_AGREEMENT_NOT_RENEWABLE
    http_status: 409
    applies_to: "every action endpoint driving a §1.2 transition"

  - priority: 9
    category: state
    check: "Cross-entity state dependency: the order's parent cycle is in the state the operation requires (lines may only be added while cycle.status is ALLOCATED or OPEN; approval requires cycle.status OPEN or CLOSED; a distribution may not be recorded or voided against a RECONCILED cycle)"
    error_id: ERR_INVALID_CYCLE_STATE
    http_status: 409
    applies_to: "POST /efap/commodity-orders, POST /efap/commodity-orders/{order_id}/lines, POST /efap/commodity-orders/{order_id}/approve, POST /efap/household-distributions, POST /efap/household-distributions/{distribution_id}/void"

  - priority: 10
    category: business_safety
    check: "Recall hold: no lot the operation touches is in status HOLD and no open Recall (INITIATED, NOTIFYING or MONITORING) covers it — posting a lot, confirming a delivery whose reservations include a held lot, accepting a transfer from a held lot, or scheduling an appointment for a HELD order are all refused"
    error_id: ERR_RECALL_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /efap/inventory-lots/{inventory_lot_id}/post, POST /efap/delivery-appointments, POST /efap/delivery-appointments/{appointment_id}/confirm-delivery, POST /efap/inventory-transfers, POST /efap/inventory-transfers/{transfer_id}/accept"

  - priority: 11
    category: business_safety
    check: "Full case accounting on a CLASS_I recall: every DISPOSITIONED action must report cases_accounted == exposed_cases before the recall may be closed; CLASS_II and CLASS_III recalls may close with partial accounting"
    error_id: ERR_RECALL_CASES_UNACCOUNTED
    http_status: 409
    applies_to: "POST /efap/recalls/{recall_id}/close"

  - priority: 12
    category: business_safety
    check: "Cold-chain feasibility: the receiving warehouse must have a non-zero capacity pool for the line's storage_class (Warehouse.<class>_pallet_capacity > 0), and a FROZEN line requires the ordering agency to have cold_storage_pallet_capacity > 0"
    error_id: ERR_STORAGE_CLASS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/lines"

  - priority: 13
    category: business_safety
    check: "Civil rights training currency: an agreement may only be approved or renewed while training_status == CURRENT"
    error_id: ERR_TRAINING_NOT_CURRENT
    http_status: 422
    applies_to: "POST /efap/agencies/{agency_id}/agreement-renewals"

  - priority: 14
    category: business_safety
    check: "Agency eligibility posture: eligibility_posture must be ELIGIBLE to submit an order, to have an order approved and to accept a transfer; ELIGIBLE or PROBATION suffices to record a household distribution or confirm a delivery; INELIGIBLE blocks all of them"
    error_id: ERR_AGENCY_INELIGIBLE
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/submit, POST /efap/commodity-orders/{order_id}/approve, POST /efap/inventory-transfers/{transfer_id}/accept, POST /efap/household-distributions, POST /efap/delivery-appointments/{appointment_id}/confirm-delivery"

  - priority: 15
    category: business_safety
    check: "Household self-declaration income test per calculations.household_income_eligibility: declared_monthly_income_cents above income_limit_cents with participates_in_snap == false is refused and nothing is persisted"
    error_id: ERR_HOUSEHOLD_INELIGIBLE
    http_status: 422
    applies_to: "POST /efap/household-distributions"

  - priority: 16
    category: business_safety
    check: "Segregation of duties: the ComplianceReviewer whose X-User-ID equals order.last_returned_by_user_id may not approve that order; the StateAdmin who initiated a recall may not close it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /efap/commodity-orders/{order_id}/approve, POST /efap/recalls/{recall_id}/close"

  - priority: 17
    category: business_referential
    check: "Every ordered line's Commodity.code appears in the cycle's offered_commodity_codes, and a recorded distribution's commodity_id likewise resolves to an offered commodity of that cycle"
    error_id: ERR_COMMODITY_NOT_OFFERED
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/lines, POST /efap/commodity-orders/{order_id}/submit, POST /efap/household-distributions"

  - priority: 18
    category: business_referential
    check: "Referential coherence across parents: the order's agency must own an AgencyAllocation in the order's cycle; a transfer's source lot and the proposing warehouse must agree; an appointment's dock_number must belong to the order's warehouse; a distribution's agency must hold an AgencyAllocation in the named cycle"
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /efap/commodity-orders, POST /efap/delivery-appointments, POST /efap/household-distributions"

  - priority: 19
    category: business_referential
    check: "At most one live DeliveryAppointment (SCHEDULED, BLOCKED or DELIVERED) may exist per order; a second creation is refused even if its window is free"
    error_id: ERR_APPOINTMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /efap/delivery-appointments"

  - priority: 20
    category: business_temporal
    check: "Order window open: submit requires cycle.status == OPEN and cycle.order_window_open_at <= current_utc"
    error_id: ERR_ORDER_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/submit"

  - priority: 21
    category: business_temporal
    check: "Order window not yet closed: submit requires current_utc < cycle.order_window_close_at (strict: exactly at the close instant the window is closed), and opening a window requires current_utc < order_window_close_at"
    error_id: ERR_ORDER_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/submit, POST /efap/allocation-cycles/{cycle_id}/open-window"

  - priority: 22
    category: business_temporal
    check: "Appointment window sanity: window_start >= current_utc at creation, and confirm-delivery requires current_utc >= appointment.window_start"
    error_id: ERR_APPOINTMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /efap/delivery-appointments, POST /efap/delivery-appointments/{appointment_id}/confirm-delivery"

  - priority: 23
    category: business_temporal
    check: "Dock exclusivity with turnaround buffer per calculations.appointment_capacity_occupancy test A: the requested window, widened by DOCK_TURNAROUND_MINUTES on both sides, must not overlap any SCHEDULED, BLOCKED or DELIVERED appointment on the same warehouse dock"
    error_id: ERR_DOCK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /efap/delivery-appointments"

  - priority: 24
    category: business_constraint
    check: "Uniqueness: Commodity.code, Warehouse.name, ServiceArea.county_code, AllocationCycle.cycle_code and InventoryLot.federal_lot_code are each unique program-wide; at most one open Recall (INITIATED, NOTIFYING or MONITORING) exists per source lot; at most one RecallAction exists per (recall_id, agency_id)"
    error_id: ERR_DUPLICATE_CODE | ERR_RECALL_ALREADY_OPEN | ERR_DUPLICATE_RECALL_ACTION
    http_status: 409
    applies_to: "POST /efap/commodities, POST /efap/warehouses, POST /efap/service-areas, POST /efap/allocation-cycles, POST /efap/inventory-lots, POST /efap/recalls, POST /efap/recalls/{recall_id}/expand"

  - priority: 25
    category: business_constraint
    check: "An order must carry at least one OrderLine to be submitted"
    error_id: ERR_EMPTY_ORDER
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/submit"

  - priority: 26
    category: business_constraint
    check: "compute-allocations requires a non-empty included set: at least one Agency has eligibility_posture == ELIGIBLE at run time"
    error_id: ERR_NO_ELIGIBLE_AGENCIES
    http_status: 422
    applies_to: "POST /efap/allocation-cycles/{cycle_id}/compute-allocations"

  - priority: 27
    category: business_constraint
    check: "The allocation is arithmetically feasible: under HOLD_HARMLESS the donors' excess covers the hold-harmless shortfall, and under either variant the MIN_ALLOCATION_CASES lift is fundable without pushing any agency below its own floor"
    error_id: ERR_ALLOCATION_INFEASIBLE
    http_status: 422
    applies_to: "POST /efap/allocation-cycles/{cycle_id}/compute-allocations"

  - priority: 28
    category: business_constraint
    check: "Warehouse staging capacity per calculations.appointment_capacity_occupancy test B: for each of DRY, COLD and FROZEN, the new appointment's pallets plus the pallets of half-open-overlapping SCHEDULED or BLOCKED appointments at that warehouse must not exceed the matching Warehouse capacity"
    error_id: ERR_WAREHOUSE_COLD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /efap/delivery-appointments"

  - priority: 29
    category: business_constraint
    check: "Agency cold-storage ceiling per calculations.appointment_capacity_occupancy test C: the new appointment's frozen_pallets plus the frozen_pallets of closed-interval-overlapping SCHEDULED or BLOCKED appointments of the same agency at any warehouse must not exceed Agency.cold_storage_pallet_capacity"
    error_id: ERR_AGENCY_COLD_STORAGE_EXCEEDED
    http_status: 409
    applies_to: "POST /efap/delivery-appointments"

  - priority: 30
    category: business_constraint
    check: "A recall may only be raised against a lot that is in status RECEIVED, AVAILABLE or WATCH; DISPOSED and DEPLETED lots cannot be recalled"
    error_id: ERR_INVALID_LOT_STATE
    http_status: 409
    applies_to: "POST /efap/recalls"

  - priority: 31
    category: business_fiscal
    check: "FEFO coverage per calculations.fefo_lot_reservation: the uncommitted cases of AVAILABLE and WATCH lots of the line's commodity at the order's warehouse cover every approved line; otherwise the whole approval is refused with no partial reservation"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /efap/commodity-orders/{order_id}/approve"

  - priority: 32
    category: business_fiscal
    check: "Entitlement headroom: total_cases_requested at submit and total_cases_approved at approval must each be <= AgencyAllocation.cases_remaining"
    error_id: ERR_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /efap/commodity-orders/{order_id}/submit, POST /efap/commodity-orders/{order_id}/approve"

  - priority: 33
    category: business_fiscal
    check: "Transfer volume: the proposed cases must not exceed (source lot.cases_on_hand - lot.cases_committed) at proposal time"
    error_id: ERR_LOT_CASES_UNAVAILABLE
    http_status: 409
    applies_to: "POST /efap/inventory-transfers"

  - priority: 34
    category: business_fiscal
    check: "Agency on-hand sufficiency: cases_distributed must not exceed Agency.agency_cases_on_hand, and a RETURNED_TO_STATE disposition's cases_accounted must not exceed it either"
    error_id: ERR_AGENCY_INVENTORY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /efap/household-distributions, POST /efap/recall-actions/{recall_action_id}/report-disposition"

  - priority: 35
    category: business_fiscal
    check: "A cycle may only be finalized when no CommodityOrder of that cycle is still in SUBMITTED, APPROVED, HELD or SCHEDULED, so the administrative funds pool is computed over settled distributions only"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /efap/allocation-cycles/{cycle_id}/finalize"

# ---- Worked priority conflicts (each pair uses a different error-category pair)
# 1. state (8) vs business_fiscal (32): submitting an order that is already SUBMITTED
#    and also requests more cases than cases_remaining -> ERR_INVALID_ORDER_STATE.
# 2. business_safety (14) vs business_referential (17): submitting an order for an
#    agency whose training has lapsed (posture PROBATION) whose line names a commodity
#    absent from offered_commodity_codes -> ERR_AGENCY_INELIGIBLE.
# 3. business_temporal (23) vs business_constraint (28): creating an appointment that
#    both collides with a dock window inside the turnaround buffer and exceeds the
#    warehouse frozen capacity -> ERR_DOCK_WINDOW_CONFLICT.

# =============================================================================
# §1.5 API Endpoint Table
#   All business paths sit under api_prefix /efap. Reads are open to all four
#   roles; every write names its authorised roles explicitly.
# =============================================================================
endpoints:

  # ---- Logical clock (test-driving namespace) -------------------------------
  - method: POST
    path: "/efap/_clock/set_current_utc"
    description: "Sets the logical clock used by every deadline, expiry, order-window, dock-window and age rule. The server starts at the fixed default 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time before this endpoint is called."
    roles: [StateAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no entity writes; later reads of current_utc use this instant"]

  - method: GET
    path: "/efap/_clock/current"
    description: "Reads the logical clock; returns 2026-08-01T00:00:00Z until set_current_utc is called."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ---- ServiceArea ---------------------------------------------------------
  - method: POST
    path: "/efap/service-areas"
    description: "Registers a service area with its poverty population, the numerator of the allocation formula's poverty factor."
    roles: [StateAdmin]
    code: 201
    input: [name, county_code, poverty_population, "urban_rural?"]
    output: ServiceArea
    side_effects: ["eligible_agency_count starts at 0"]

  - method: GET
    path: "/efap/service-areas"
    description: "Lists service areas."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["county_code?", "urban_rural?", "limit?", "offset?"]
    output: ServiceArea[]
    side_effects: []

  - method: GET
    path: "/efap/service-areas/{service_area_id}"
    description: "Reads one service area, including its live eligible_agency_count."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: ServiceArea
    side_effects: []

  - method: PATCH
    path: "/efap/service-areas/{service_area_id}"
    description: "Revises the poverty population or urban/rural designation of a service area; changes only affect allocation cycles computed after the change."
    roles: [StateAdmin]
    code: 200
    input: ["poverty_population?", "urban_rural?"]
    output: ServiceArea
    side_effects: ["increments ServiceArea.version by 1"]

  # ---- Agency --------------------------------------------------------------
  - method: POST
    path: "/efap/agencies"
    description: "Registers an emergency feeding organization. X-User-ID of an AgencyCoordinator equals the returned Agency.id for all later ownership checks."
    roles: [StateAdmin]
    code: 201
    input: [name, service_area_id, cold_storage_pallet_capacity, "prior_period_pounds_distributed?", "prior_period_allocated_cases?"]
    output: Agency
    side_effects: ["agreement_status = PENDING, training_status = REQUIRED, eligibility_posture = INELIGIBLE", "ServiceArea.eligible_agency_count unchanged (a PENDING agency is not eligible)"]

  - method: GET
    path: "/efap/agencies"
    description: "Lists agencies, filterable by service area and by either state axis or the derived posture."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: ["service_area_id?", "agreement_status?", "training_status?", "eligibility_posture?", "limit?", "offset?"]
    output: Agency[]
    side_effects: []

  - method: GET
    path: "/efap/agencies/{agency_id}"
    description: "Reads one agency, including both state axes and the derived eligibility_posture."
    roles: [StateAdmin, ComplianceReviewer, AgencyCoordinator, StateWarehouseOperator]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: PATCH
    path: "/efap/agencies/{agency_id}"
    description: "Revises an agency's cold storage capacity and prior-period baselines used by the allocation formula."
    roles: [StateAdmin]
    code: 200
    input: ["cold_storage_pallet_capacity?", "prior_period_pounds_distributed?", "prior_period_allocated_cases?"]
    output: Agency
    side_effects: ["increments Agency.version by 1"]

  - method: POST
    path: "/efap/agencies/{agency_id}/agreement-renewals"
    description: "Approves or renews the agency agreement: PENDING -> ACTIVE, ACTIVE -> ACTIVE (early renewal), EXPIRED -> ACTIVE."
    roles: [ComplianceReviewer]
    code: 201
    input: [agreement_start_date, agreement_end_date]
    output: Agency
    side_effects: ["agreement_status per §1.2", "renewal_count += 1", "recomputes eligibility_posture and ServiceArea.eligible_agency_count", "increments Agency.version by 1"]

  - method: POST
    path: "/efap/agencies/{agency_id}/civil-rights-trainings"
