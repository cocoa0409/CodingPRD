              as_user_id: "sch-1"
              captures: {ready: $.data.staffing_status}
          trigger:
            - call: "POST /crew-assignments/${ca_id}/release"
              payload: {release_reason: "Volunteer unavailable that evening"}
              as: Producer
              as_user_id: "${v_id}"
              captures: {rel_status: $.data.status, rel_reason: $.data.release_reason, rel_hours: $.data.credited_hours_tenths}
            - call: "GET /playback-slots/${slot_id}"
              payload: {}
