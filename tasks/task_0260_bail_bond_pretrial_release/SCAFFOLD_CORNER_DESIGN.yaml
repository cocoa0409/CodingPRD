scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_defendant_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Defendant, endpoints]
        distinguishing_aspect: "POST /defendants with all required fields -> 201; response carries full_name, risk_tier, computed total_active_exposure_cents == 0 and status == ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /defendants"
              payload: { full_name: "Ann Ze", date_of_birth: "1990-01-01", phone_e164: "+15551110000", risk_tier: "LOW" }
              as: BondsAgent
              captures: { def_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Defendant.${def_id}.total_active_exposure_cents == 0"
            - "Defendant.${def_id}.status == ACTIVE"

      - name: get_defendant_not_found
        claim_type: Not Found
        grounds: [entities.Defendant, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /defendants/{id} with an unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /defendants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BondsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_bail_order_missing_required_field
        claim_type: Required Fields
        grounds: [entities.BailOrder, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST bail-order without bail_amount_cents -> ERR_INVALID_REQUEST (400); required-field check fires."
        test_recipe:
          setup: ["A registered defendant."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Bob Yu", date_of_birth: "1991-02-02", phone_e164: "+15551110001" }
              as: BondsAgent
              captures: { def_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X1", bond_type_allowed: "SURETY" }
              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: defendant_default_risk_tier_applied
        claim_type: Defaults
        grounds: [entities.Defendant.fields.risk_tier]
        distinguishing_aspect: "Omitting risk_tier on create -> default MEDIUM applied in the stored entity."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /defendants"
              payload: { full_name: "Cy Xa", date_of_birth: "1992-03-03", phone_e164: "+15551110002" }
              as: BondsAgent
              captures: { def_id: $.data.id, tier: $.data.risk_tier }
          assert:
            - "Defendant.${def_id}.risk_tier == MEDIUM"

      - name: bond_invalid_enum_bond_type
        claim_type: Type Constraints
        grounds: [entities.Bond.fields.bond_type, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST bond with bond_type outside {CASH,SURETY,PR} -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A defendant with an ANY-allowed bail order."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Dee Wb", date_of_birth: "1993-04-04", phone_e164: "+15551110003" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X2", bail_amount_cents: 500000, bond_type_allowed: "ANY" }
              as: Court
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "BAILEY" }
              as: BondsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: notification_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Notification]
        distinguishing_aspect: "Notification has common_fields:false — it is append-only with only id/created_at; no update endpoint and no version field exist."
        test_recipe:
          setup: ["A court date that has been notified (Notification exists)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Ed Vc", date_of_birth: "1994-05-05", phone_e164: "+15551110004" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X3", bail_amount_cents: 500000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/court-dates"
              payload: { scheduled_utc: "2026-07-10T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_id: $.data.id }
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/notify"
              payload: { channel: "SMS" }
              as: Court
          trigger:
            - call: "GET /court-dates/${cd_id}/notifications"
              payload: {}
              as: Court
              captures: { dest: "$.data[0].destination" }
          assert:
            - "GET /court-dates/${cd_id}/notifications returns exactly 1 Notification"
            - "Notification.destination == +15551110004 (copied from defendant.phone_e164)"

  # =========================================================================
  - section: state_machines
    instances:
      - name: revoke_already_active_bond_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Bond.DRAFT_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoke is only defined from DRAFT; revoking an ACTIVE bond -> ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["An ACTIVE SURETY bond."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Fi Ud", date_of_birth: "1980-06-06", phone_e164: "+15551110005" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X4", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Gg Te", phone_e164: "+15551110006", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/revoke"
              payload: {}
              as: BondsAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_appeared_court_date_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CourtDate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "APPEARED is terminal for CourtDate; recording FTA on an APPEARED date -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE bond with a court date already recorded as APPEARED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Ha Sf", date_of_birth: "1981-07-07", phone_e164: "+15551110007" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X5", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Ig Rg", phone_e164: "+15551110008", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/court-dates"
              payload: { scheduled_utc: "2026-07-10T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_id: $.data.id }
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/record-appearance"
              payload: {}
              as: Court
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/record-fta"
              payload: {}
              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: notify_side_effect_creates_notification_with_lead
        claim_type: Side Effect Execution
        grounds: [state_machines.CourtDate.SCHEDULED_to_NOTIFIED, calculations.notification_lead, entities.Notification.fields.lead_hours]
        distinguishing_aspect: "Notify sets notified_at and creates a Notification whose lead_hours == floor((scheduled - now)/3600) == 12 for a 12-hour gap."
        test_recipe:
          setup: ["An ACTIVE bond's SCHEDULED court date 12 hours in the future."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Jo Qh", date_of_birth: "1982-08-08", phone_e164: "+15551110009" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X6", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/court-dates"
              payload: { scheduled_utc: "2026-07-01T12:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/notify"
              payload: { channel: "SMS" }
              as: Court
              captures: { cd_status: $.data.status }
            - call: "GET /court-dates/${cd_id}/notifications"
              payload: {}
              as: Court
              captures: { lead: "$.data[0].lead_hours" }
          assert:
            - "CourtDate.${cd_id}.status == NOTIFIED"
            - "Notification.lead_hours == 12"

      - name: idempotent_appearance_second_call_invalid
        claim_type: Idempotency
        grounds: [state_machines.CourtDate.NOTIFIED_to_APPEARED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording appearance twice: second call from terminal APPEARED -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE bond court date recorded APPEARED once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Ka Pi", date_of_birth: "1983-09-09", phone_e164: "+15551110010" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X7", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/court-dates"
              payload: { scheduled_utc: "2026-07-10T09:00:00Z", duration_minutes: 60 }
              as: Court
              captures: { cd_id: $.data.id }
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/record-appearance"
              payload: {}
              as: Court
          trigger:
            - call: "POST /defendants/${def_id}/court-dates/${cd_id}/record-appearance"
              payload: {}
              as: Court
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: revoke_cascades_discharge_and_release
        claim_type: Cross-entity
        grounds: [state_machines.Bond.DRAFT_to_REVOKED, state_machines.IndemnityAgreement, state_machines.CollateralItem.HELD_to_RELEASED]
        distinguishing_aspect: "Revoking a DRAFT bond transitions its PENDING agreement -> DISCHARGED and its HELD collateral -> RELEASED, with NO ledger entry (nothing was earned)."
        test_recipe:
          setup: ["A DRAFT SURETY bond with one PENDING agreement and one HELD collateral item."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Lo Oj", date_of_birth: "1984-10-10", phone_e164: "+15551110011" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X8", bail_amount_cents: 1000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Mm Nk", phone_e164: "+15551110012", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 1000000 }
              as: BondsAgent
              captures: { ia_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 250000 }
              as: BondsAgent
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/revoke"
              payload: {}
              as: BondsAgent
              captures: { cov: $.data.coverage_status }
          assert:
            - "Bond.${bond_id}.coverage_status == REVOKED"
            - "GET /bonds/${bond_id}/indemnity-agreements shows the agreement status == DISCHARGED"
            - "GET /bonds/${bond_id}/collateral shows the item status == RELEASED"
            - "GET /bonds/${bond_id}/ledger is empty (no COLLATERAL_REFUND, no PREMIUM_COLLECTED)"

      - name: fta_cascade_to_forfeited
        claim_type: Valid Transition
        grounds: [state_machines.CourtDate.SCHEDULED_to_FAILED_TO_APPEAR, state_machines.Bond.ACTIVE_to_FORFEITED]
        excluded_because:
          difficulty_instance: transitive_cascade / fta_forfeit_proceeding_exposure_cascade_depth4
          rationale: "The FTA -> FORFEITED -> proceeding cascade is asserted by the named §1.8 depth-4 instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: required_collateral_high_risk_surcharge
        claim_type: Constants Applied
        grounds: [calculations.required_collateral, entities.Bond.fields.required_collateral_cents]
        distinguishing_aspect: "A SURETY bond of 2,000,000c for a HIGH-risk defendant uses COVERAGE_PCT.HIGH = 0.50 -> required_collateral_cents == 1,000,000."
        test_recipe:
          setup: ["A HIGH-risk defendant with a SURETY bail order of 2,000,000c; bond posted."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Ni Ml", date_of_birth: "1985-11-11", phone_e164: "+15551110013", risk_tier: "HIGH" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X9", bail_amount_cents: 2000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { req: $.data.required_collateral_cents }
          assert:
            - "Bond.required_collateral_cents == 1000000"

      - name: surety_premium_minimum_floor
        claim_type: Correct Result
        grounds: [calculations.surety_premium, entities.Bond.fields.premium_cents]
        distinguishing_aspect: "A tiny SURETY bond of 50,000c at 1000 bps computes raw 5,000c but is floored to MIN_PREMIUM_CENTS == 10,000 at activation."
        test_recipe:
          setup: ["A MEDIUM defendant with a SURETY bail order of 50,000c, fully indemnified and collateralized, activated."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Op Lk", date_of_birth: "1986-12-12", phone_e164: "+15551110014", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X10", bail_amount_cents: 50000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "Pq Kj", phone_e164: "+15551110015", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 50000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 12500 }
              as: BondsAgent
          trigger:
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
              payload: {}
              as: BondsAgent
              captures: { prem: $.data.premium_cents }
          assert:
            - "Bond.${bond_id}.premium_cents == 10000"

      - name: cash_bond_full_collateral_zero_premium
        claim_type: Correct Result
        grounds: [calculations.required_collateral, calculations.surety_premium, entities.Bond.fields.premium_cents]
        distinguishing_aspect: "A CASH bond of 800,000c requires required_collateral_cents == full 800,000 and premium_cents == 0 (premium only applies to SURETY)."
        test_recipe:
          setup: ["A defendant with a CASH-allowed bail order of 800,000c; CASH bond posted."]
          setup_api_calls:
            - call: "POST /defendants"
              payload: { full_name: "Qr Ji", date_of_birth: "1987-01-13", phone_e164: "+15551110016", risk_tier: "LOW" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X11", bail_amount_cents: 800000, bond_type_allowed: "CASH" }
              as: Court
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "CASH" }
              as: BondsAgent
              captures: { req: $.data.required_collateral_cents, prem: $.data.premium_cents }
          assert:
            - "Bond.required_collateral_cents == 800000"
            - "Bond.premium_cents == 0"

      - name: remission_credit_percentage
        claim_type: Correct Result
        grounds: [calculations.remission_credit, state_machines.ForfeitureProceeding.JUDGMENT_to_REMITTED]
        distinguishing_aspect: "Remitting 25% of a 1,500,000c judgment writes a REMISSION_CREDIT ledger entry of -375,000."
        test_recipe:
          setup: ["A proceeding in JUDGMENT with judgment_amount_cents == 1,500,000 (SURETY 2,000,000c face, 500,000c collateral liquidated, no recovery)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /defendants"
              payload: { full_name: "Rs Ih", date_of_birth: "1988-02-14", phone_e164: "+15551110017", risk_tier: "MEDIUM" }
              as: BondsAgent
              captures: { def_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders"
              payload: { case_number: "CR-X12", bail_amount_cents: 2000000, bond_type_allowed: "SURETY" }
              as: Court
              captures: { order_id: $.data.id }
            - call: "POST /defendants/${def_id}/bail-orders/${order_id}/bonds"
              payload: { bond_type: "SURETY", premium_rate_bps: 1000 }
              as: BondsAgent
              captures: { bond_id: $.data.id }
            - call: "POST /indemnitors"
              payload: { full_name: "St Hg", phone_e164: "+15551110018", credit_limit_cents: 5000000 }
              as: BondsAgent
              captures: { ind_id: $.data.id }
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/indemnity-agreements"
              payload: { indemnitor_id: "${ind_id}", liability_share_cents: 2000000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/collateral"
              payload: { kind: "CASH", pledged_value_cents: 500000 }
              as: BondsAgent
            - call: "POST /defendants/${def_id}/bonds/${bond_id}/activate"
