        distinguishing_aspect: "Two strictly sequential adjustments against version 1: first succeeds (total 77400 -> 78900), second carrying version 1 is rejected 412 ERR_STALE_INVOICE_VERSION."
        test_recipe:
          setup: ["CONFIRMED booking; FREIGHT invoice DRAFT (total 77400, version 1)"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME OCC3", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
            - { call: "POST /freight/tariffs", payload: { tariff_code: "T-LCL-1", origin_port: "CNSHA", destination_port: "USLAX", commodity_type: "GENERAL", mode: "LCL", rate_per_unit_cents: 9500, minimum_charge_cents: 20000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "co_1", captures: { t: $.data.id } }
