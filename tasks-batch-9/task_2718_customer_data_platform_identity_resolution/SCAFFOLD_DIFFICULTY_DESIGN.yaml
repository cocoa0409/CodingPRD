                p4_id: "$.data[3].id"
            - call: "POST /cdp/match-rules"
              payload:
                code: "PROB_BOUND"
                rule_kind: "PROBABILISTIC"
                deterministic_key: null
                missing_identifier_policy: "STRICT_ZERO"
                auto_merge_threshold: 0.92
                review_floor: 0.65
                min_precision: 0.40
              as: DataPlatformAdmin
