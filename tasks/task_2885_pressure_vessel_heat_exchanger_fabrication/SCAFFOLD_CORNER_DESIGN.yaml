            - "VesselJob.${job_id}.status is still DRAFT with governing_joint_efficiency == null and design_release_at == null"

      - name: state_machine_second_qualify_on_same_wps_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.WPS.transitions[DRAFT->QUALIFIED].preconditions
          - validations[priority=50]
          - errors[ERR_INVALID_WPS_STATE]
        distinguishing_aspect: "Qualification is not idempotent: the second POST to qualify the same procedure must be refused with ERR_INVALID_WPS_STATE 409 and must not increment version a second time, so a WPS cannot accumulate phantom qualification events."
        test_recipe:
          setup:
