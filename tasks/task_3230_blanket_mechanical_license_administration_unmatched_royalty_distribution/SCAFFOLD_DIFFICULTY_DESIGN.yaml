  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: acceptance_match_sweep_accrual_cascade
        grounds:
          - state_machines.UsageReport.SUBMITTED_to_ACCEPTED
          - state_machines.UsageLine.PENDING_MATCH_to_UNMATCHED
          - state_machines.RoyaltyAccrual.transitions
        distinguishing_aspect: |
          Depth-3 chain originating from report acceptance: accept(Report)
          mutates UsageLine (PENDING_MATCH -> UNMATCHED); the line mutation
          itself spawns a HELD RoyaltyAccrual; the accrual's creation stamps
          hold_expires_at from the report's reporting month (a third-hop
          derived field) — each hop caused by the previous, not by the accept.
        test_recipe:
          setup:
            - "Clock 2026-09-01; schedule ACTIVE; DSP ACTIVE; report 2026-06 SUBMITTED with one unmatchable line 'Petrel' (1000 plays, 100s, 131000 cents)"
          setup_api_calls:
            - call: "POST /mlc/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
              as: MLCAdministrator
              captures: { rs_id: $.data.id }
            - call: "POST /mlc/rate-schedules/${rs_id}/activate"
              payload: {}
              as: MLCAdministrator
            - call: "POST /mlc/service-providers"
