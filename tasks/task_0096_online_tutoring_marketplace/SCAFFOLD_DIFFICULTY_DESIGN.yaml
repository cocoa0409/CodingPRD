      # --- Instance 2 (depth >=2): credential expiry -> tutor SUSPENDED -> tags REVOKED ---
      - name: credential_expiry_suspends_tutor_revokes_tags
        grounds:
          - state_machines.Credential.VERIFIED_to_EXPIRED
