              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, allows_member_rate: true }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/rate-plans/${bar_id}/promotions"
              payload: { code: "MEMBER10", promo_kind: "MEMBER_RATE", discount_kind: "PERCENT", discount_bp: 1000, start_date: "2026-09-01", end_date: "2026-09-30" }
              as: RevenueManager
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /distribution/promotions/${promo_id}/load"
              payload: {}
              as: ChannelOpsEngineer
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "PROMOTION" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /distribution/promotions/${promo_id}/submit"
              payload: {}
              as: RevenueManager
              as_user_id: "rm-1"
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/promotions/${promo_id}/approve"
              payload: {}
              as: RevenueDirector
              as_user_id: "rd-1"
          assert:
            - "After load: Promotion.${promo_id}.distribution_status == LOADING and Promotion.${promo_id}.approval_status == DRAFT (the approval axis is not consulted by the load)"
            - "After load: DistributionBatch.${batch_id}.payload_kind == PROMOTION, source_ref_kind == PROMOTION, source_ref_id == ${promo_id}, batch_state == QUEUED, total_jobs == 1"
            - "After submit: Promotion.${promo_id}.approval_status == SUBMITTED, submitted_by_user_id == rm-1, distribution_status still LOADING (unchanged by the approval axis)"
            - "After dispatch: DistributionBatch.${batch_id}.batch_state == APPLIED, applied_jobs == 1, and Promotion.${promo_id}.distribution_status == LOADED while approval_status is still SUBMITTED"
            - "After approve: Promotion.${promo_id}.approval_status == APPROVED, approved_by_user_id == rd-1, distribution_status still LOADED (unchanged by the distribution axis)"
            - "Observed combined states in order: (DRAFT, LOADING), (SUBMITTED, LOADING), (SUBMITTED, LOADED), (APPROVED, LOADED)"

      - name: batch_forks_two_jobs_settles_partially_applied_then_joins_to_applied
        grounds:
          - state_machines.DistributionBatch.DISPATCHING_to_PARTIALLY_APPLIED
          - state_machines.DistributionBatch.PARTIALLY_APPLIED_to_DISPATCHING
          - state_machines.DistributionBatch.DISPATCHING_to_APPLIED
          - state_machines.RateDistributionJob.REJECTED_to_QUEUED
          - calculations.batch_state_rollup
          - calculations.job_dispatch_resolution
        distinguishing_aspect: |
          Compound fork-join shape: one batch forks into 2 jobs on different channels, the join point
          settles to PARTIALLY_APPLIED (applied_jobs 1, rejected_jobs 1) rather than APPLIED, and only
          after the rejected child is repaired and re-queued does a second dispatch drive the parent
          to APPLIED - the parent state is re-derived from the children at every step and never set
          directly.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING, two channels OTA1 (commission_bp 1750) and BRAND (DIRECT_BRAND, commission_bp 0), each with a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000; two mappings, OTA1 created first then BRAND, both VERIFIED and IN_PARITY (hash kingv1, 5 images)."
            - "Promotion MEMBER10 on BAR is loaded while both mappings are IN_PARITY, so the batch forks into 2 QUEUED jobs (sequence_index 0 = OTA1, 1 = BRAND)."
            - "Only after the fan-out is the BRAND mapping's image count dropped to 4, making it OUT_OF_PARITY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
