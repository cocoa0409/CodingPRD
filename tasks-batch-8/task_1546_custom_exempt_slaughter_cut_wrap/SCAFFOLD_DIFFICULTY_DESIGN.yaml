  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: finalize_requires_animal_hanging
        grounds:
          - state_machines.CarcassShare.PENDING_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair CarcassShare x Animal: split finalize is gated on the
          ANIMAL being HANGING (hanging weight recorded); while the animal is
          SLAUGHTERED the finalize is rejected, after weigh it succeeds.
        test_recipe:
          setup:
            - "Clock default; c1 ACTIVE; CapacityDay 2026-08-20 cap 1; confirmed HOG appointment; animal SLAUGHTERED (not yet weighed); one share 1.0 PENDING"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "GET /locker/shares/${s1}", payload: {}, as: PlantOperator, captures: { sh_st: $.data.status, sh_w: $.data.share_hanging_weight_lbs } }
          assert:
            - "first finalize rejected with ERR_INVALID_STATE (animal not HANGING)"
            - "after weigh, finalize succeeds: CarcassShare.status == CONFIRMED"
            - "CarcassShare.share_hanging_weight_lbs == 200.0"

      - name: start_fab_requires_all_cut_sheets_submitted
        grounds:
          - state_machines.Animal.HANGING_to_CUTTING
          - state_machines.CutSheet.SUBMITTED_to_LOCKED
          - errors[ERR_CUT_SHEET_MISSING]
        distinguishing_aspect: |
          Entity pair Animal x CutSheet: the animal's HANGING -> CUTTING
          transition is gated on every CONFIRMED share's CutSheet being
          SUBMITTED; one DRAFT sheet blocks it. Different pair than
          CarcassShare x Animal.
        test_recipe:
          setup:
            - "Clock default; c1, c2 ACTIVE; CapacityDay 2026-08-20 cap 1; confirmed BEEF appointment; animal HANGING at 700.0 lb, weighed 2026-08-01; shares 0.5/0.5 finalized"
