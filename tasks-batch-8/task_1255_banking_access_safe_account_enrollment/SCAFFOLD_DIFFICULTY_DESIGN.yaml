# =============================================================================
# Task 1255: Banking Access & Safe Account Enrollment — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances each. Every recipe replays from empty-DB.
# Logical clock startup default: 2026-05-01T00:00:00Z (see §1.5 clock endpoint).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: retention_rate_provisional_vs_final
        grounds:
          - calculations.retention_rate
          - calculations.claim_computation
          - entities.PartnerReport.fields.evaluation_mode
          - entities.RetentionCheckpoint.fields.status
        distinguishing_aspect: |
          Same checkpoint data (one EVALUATED_RETAINED M6, one PENDING M6): PROVISIONAL counts
          PENDING as retained (rate 1.0000, bonus 5000) while FINAL counts only
          EVALUATED_RETAINED (rate 0.5000, bonus 0) — entity domain RetentionCheckpoint/PartnerReport.
        test_recipe:
          setup:
            - "CERTIFIED institution under a STANDARD_RUBRIC standard (requires_financial_education=false)"
            - "Account A1 OPENED at clock 2026-05-01 (M6 due 2026-10-31); account A2 OPENED at clock 2026-05-15 (M6 due 2026-11-14)"
            - "Clock advanced to 2026-11-10 and ops/evaluate-due run: A1.M6 -> EVALUATED_RETAINED; A2.M6 stays PENDING"
            - "Two ACTIVE grants; two DRAFT reports over period 2026-01-01..2026-11-30, one PROVISIONAL one FINAL"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p1_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r1_id: $.data.id } }
            - { call: "POST /api/referrals/${r1_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p1_id}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r1_id}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /api/account-applications/${a1_id}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: CoalitionAdmin }
            - { call: "POST /api/participants", payload: { full_name: "Ben Okafor", date_of_birth: "1985-11-02", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2_id: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p2_id}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r2_id: $.data.id } }
            - { call: "POST /api/referrals/${r2_id}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p2_id}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r2_id}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a2_id: $.data.id } }
            - { call: "POST /api/account-applications/${a2_id}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-10T00:00:00Z" }, as: CoalitionAdmin }
            - { call: "POST /api/ops/evaluate-due", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g1_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g1_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g1_v: $.data.version } }
            - { call: "POST /api/funding-grants", payload: { funder_name: "United Fund", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g2_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g2_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g2_v: $.data.version } }
          trigger:
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g1_id}", period_start: "2026-01-01", period_end: "2026-11-30", evaluation_mode: "PROVISIONAL", expected_grant_version: "${g1_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep_p_id: $.data.id, rate_p: $.data.retention_rate_m6, claim_p: $.data.claim_total_cents } }
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g2_id}", period_start: "2026-01-01", period_end: "2026-11-30", evaluation_mode: "FINAL", expected_grant_version: "${g2_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep_f_id: $.data.id, rate_f: $.data.retention_rate_m6, claim_f: $.data.claim_total_cents } }
          assert:
            - "PartnerReport.${rep_p_id}.retention_rate_m6 == 1.0 (PROVISIONAL counts A1 EVALUATED_RETAINED + A2 PENDING as retained: 2/2)"
            - "PartnerReport.${rep_f_id}.retention_rate_m6 == 0.5 (FINAL counts EVALUATED_RETAINED only: 1/2)"
            - "PartnerReport.${rep_p_id}.retention_bonus_cents == 5000 (rate 1.0000 >= 0.80 -> 2500 x 2 retained)"
            - "PartnerReport.${rep_f_id}.retention_bonus_cents == 0 (rate 0.5000 < 0.60 -> no tier)"
            - "PartnerReport.${rep_p_id}.claim_total_cents == 14926 and PartnerReport.${rep_f_id}.claim_total_cents == 9926; both have opening_claim_cents == 9926 (2 x round(5000*0.9925)=2x4963)"

      - name: certification_rubric_variant_divergence
        grounds:
          - calculations.certification_score
          - entities.AccountStandard.fields.rubric_mode
          - state_machines.CertificationReview.SCORED_to_FINALIZED_PASS
        distinguishing_aspect: |
          Identical ratings (weighted_score 85.00) yield CONDITIONAL under STANDARD_RUBRIC
          (PASS floor 90.00) but PASS under REMEDIATION_RUBRIC (PASS floor 85.00) — entity
          domain CertificationReview/AccountStandard, distinct from the retention domain.
        test_recipe:
          setup:
            - "Standard S (STANDARD_RUBRIC) EFFECTIVE; institution I1 certified via a review scored 85.00 -> CONDITIONAL"
            - "Standard R (REMEDIATION_RUBRIC) then activated (S auto-SUPERSEDED); institution I2 reviewed under R with identical ratings"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026-S", name: "Bank On Standard", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_s: $.data.id } }
            - { call: "POST /api/account-standards/${std_s}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst1: $.data.id, inst1_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst1}", standard_id: "${std_s}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst1_v}" }, as: CoalitionAdmin, captures: { rev1: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev1}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 1 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer", captures: { score1: $.data.weighted_score } }
            - { call: "POST /api/certification-reviews/${rev1}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/account-standards", payload: { code: "BO-2026-R", name: "Bank On Remediation", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "REMEDIATION_RUBRIC" }, as: CoalitionAdmin, captures: { std_r: $.data.id } }
            - { call: "POST /api/account-standards/${std_r}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Metro Bank", charter_type: "BANK" }, as: CoalitionAdmin, captures: { inst2: $.data.id, inst2_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst2}", standard_id: "${std_r}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst2_v}" }, as: CoalitionAdmin, captures: { rev2: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev2}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 1 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer", captures: { score2: $.data.weighted_score } }
          trigger:
            - { call: "POST /api/certification-reviews/${rev2}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
          assert:
            - "CertificationReview.${rev1}.weighted_score == 85.0 and CertificationReview.${rev2}.weighted_score == 85.0 (identical ratings, identical arithmetic)"
            - "CertificationReview.${rev1}.status == FINALIZED_CONDITIONAL (STANDARD_RUBRIC: 85.00 < 90.00 PASS floor)"
            - "CertificationReview.${rev2}.status == FINALIZED_PASS (REMEDIATION_RUBRIC: 85.00 >= 85.00 PASS floor)"
            - "AccountStandard.${std_s}.status == SUPERSEDED after R activation"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two different modes: (a) and (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: certification_score_mandatory_floor_branch
        grounds:
          - calculations.certification_score
          - entities.CertificationReview.fields.mandatory_floor_failed
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — 5 weighted ratings, tiered
          thresholds, AND a conditional branch: CHEX_POLICY rating 1 forces outcome FAIL even
          though the weighted score 85.00 sits inside the CONDITIONAL band [75.00, 90.00).
        test_recipe:
          setup:
            - "EFFECTIVE STANDARD_RUBRIC standard; institution APPLIED with a DRAFT review"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 1 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
          trigger:
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer", captures: { out_status: $.data.status } }
          assert:
            - "CertificationReview.${rev_id}.weighted_score == 85.0 (1.0+0.8+0.6+0.2+0.8 = 3.4 -> 100*3.4/4)"
            - "CertificationReview.${rev_id}.mandatory_floor_failed == true (CHEX_POLICY rating 1 <= floor 1)"
            - "CertificationReview.${rev_id}.status == FINALIZED_FAIL despite 85.00 >= 75.00 CONDITIONAL floor"
            - "PartnerInstitution.${inst_id}.certification_status == DECERTIFIED"

      - name: claim_rounding_per_account_then_sum
        grounds:
          - calculations.claim_computation
          - entities.PartnerReport.fields.opening_claim_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — 3 accounts x round_half_up(5000 x 0.9925) = 3 x 4963
          = 14889, whereas summing gross first then rounding yields 14888; the scaffold pins
          per-account-then-sum, so 14889 is the only correct answer.
        test_recipe:
          setup:
            - "CERTIFIED institution; three participants each with an OPENED account on 2026-05-01"
            - "ACTIVE grant; report period 2026-01-01..2026-05-31 FINAL (no checkpoint due <= period_end)"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /api/certification-reviews/${rev_id}/score", payload: { criteria_ratings: [ { criterion: "FEE_COMPLIANCE", rating: 4 }, { criterion: "ACCESS", rating: 4 }, { criterion: "ALT_ID", rating: 4 }, { criterion: "CHEX_POLICY", rating: 4 }, { criterion: "EDUCATION_SUPPORT", rating: 4 } ] }, as: CoalitionAdmin, as_user_id: "admin-scorer" }
            - { call: "POST /api/certification-reviews/${rev_id}/finalize", payload: {}, as: CoalitionAdmin, as_user_id: "admin-finalizer" }
            - { call: "POST /api/participants", payload: { full_name: "Ana Ruiz", date_of_birth: "1990-04-12", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p1: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p1}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r1: $.data.id } }
            - { call: "POST /api/referrals/${r1}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p1}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r1}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a1: $.data.id } }
            - { call: "POST /api/account-applications/${a1}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/participants", payload: { full_name: "Ben Okafor", date_of_birth: "1985-11-02", contact_zip: "90001", prior_banking_record: "CLEAN", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-1", captures: { p2: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p2}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-1", captures: { r2: $.data.id } }
            - { call: "POST /api/referrals/${r2}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-1" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p2}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r2}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a2: $.data.id } }
            - { call: "POST /api/account-applications/${a2}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/participants", payload: { full_name: "Cy Lin", date_of_birth: "1978-06-30", contact_zip: "90002", prior_banking_record: "NONE", id_documents: [ { doc_type: "MATRICULA_CONSULAR", status: "VERIFIED" }, { doc_type: "PROOF_OF_ADDRESS", status: "VERIFIED" } ] }, as: AgencyNavigator, as_user_id: "nav-2", captures: { p3: $.data.id } }
            - { call: "POST /api/referrals", payload: { participant_id: "${p3}", created_via: "NAVIGATOR" }, as: AgencyNavigator, as_user_id: "nav-2", captures: { r3: $.data.id } }
            - { call: "POST /api/referrals/${r3}/docs-complete", payload: {}, as: AgencyNavigator, as_user_id: "nav-2" }
            - { call: "POST /api/account-applications", payload: { participant_id: "${p3}", institution_id: "${inst_id}", id_type_presented: "MATRICULA_CONSULAR", referral_id: "${r3}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { a3: $.data.id } }
            - { call: "POST /api/account-applications/${a3}/decision", payload: { outcome: "APPROVE" }, as: InstitutionOfficer, as_user_id: "${inst_id}" }
            - { call: "POST /api/funding-grants", payload: { funder_name: "City Foundation", program_year: 2026, total_cents: 500000, per_report_cap_cents: 200000 }, as: CoalitionAdmin, captures: { g_id: $.data.id } }
            - { call: "POST /api/funding-grants/${g_id}/activate", payload: {}, as: CoalitionAdmin, captures: { g_v: $.data.version } }
          trigger:
            - { call: "POST /api/partner-reports", payload: { institution_id: "${inst_id}", grant_id: "${g_id}", period_start: "2026-01-01", period_end: "2026-05-31", evaluation_mode: "FINAL", expected_grant_version: "${g_v}" }, as: InstitutionOfficer, as_user_id: "${inst_id}", captures: { rep_id: $.data.id } }
          assert:
            - "PartnerReport.${rep_id}.opened_count == 3"
            - "PartnerReport.${rep_id}.opening_claim_cents == 14889 (3 x round_half_up(5000 x 0.9925) = 3 x 4963; sum-then-round would give 14888)"
            - "PartnerReport.${rep_id}.retention_rate_m6 == null and retention_bonus_cents == 0 (no checkpoint due <= 2026-05-31)"
            - "PartnerReport.${rep_id}.education_stipend_cents == 0 (standard does not require education)"
            - "PartnerReport.${rep_id}.claim_total_cents == 14889"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (two different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: barrier_case_negotiation_cycle
        grounds:
          - state_machines.BarrierCase.PLAN_PROPOSED_to_COUNTERED
          - state_machines.BarrierCase.COUNTERED_to_PLAN_PROPOSED
          - state_machines.BarrierCase.PLAN_PROPOSED_to_RESOLVED
          - state_machines.AccountApplication.DECLINED_CHEX_to_REINSTATED
        distinguishing_aspect: |
          Cyclic machine on BarrierCase: PLAN_PROPOSED -> COUNTERED -> PLAN_PROPOSED -> RESOLVED
          with a monotonic negotiation_rounds counter; entity distinct from the PartnerInstitution
          recertification cycle.
        test_recipe:
          setup:
            - "CERTIFIED institution; flagged participant applied and was DECLINED with reason CHEX"
            - "BarrierCase exists in OPEN linked to the application"
          setup_api_calls:
            - { call: "POST /api/account-standards", payload: { code: "BO-2026", name: "Bank On 2026", effective_from: "2026-01-01", monthly_fee_cap_cents: 500, overdraft_fee_allowed: false, min_opening_deposit_cap_cents: 2500, accepted_alt_id_types: ["MATRICULA_CONSULAR"], chex_second_look_required: true, requires_financial_education: false, rubric_mode: "STANDARD_RUBRIC" }, as: CoalitionAdmin, captures: { std_id: $.data.id } }
            - { call: "POST /api/account-standards/${std_id}/activate", payload: {}, as: CoalitionAdmin }
            - { call: "POST /api/partner-institutions", payload: { legal_name: "Harbor CU", charter_type: "CREDIT_UNION" }, as: CoalitionAdmin, captures: { inst_id: $.data.id, inst_v: $.data.version } }
            - { call: "POST /api/certification-reviews", payload: { institution_id: "${inst_id}", standard_id: "${std_id}", period_start: "2026-02-01", period_end: "2026-02-28", expected_institution_version: "${inst_v}" }, as: CoalitionAdmin, captures: { rev_id: $.data.id } }
