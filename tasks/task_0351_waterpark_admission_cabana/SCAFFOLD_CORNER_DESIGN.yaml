  - section: consistency_model
    instances:
      - name: immediate_visibility_of_subtotal_in_pay_response
        claim_type: immediate
        grounds: [calculations.quote_order, "endpoints.POST_/orders/{id}/pay"]
        distinguishing_aspect: "The pay response itself carries the computed subtotal_cents/total_cents in the same request (immediate consistency, no re-read needed)."
        test_recipe:
          setup: ["a PENDING order, active policy base 5000 no discount party 2"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Imm Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000, group_threshold: 99 }
              as: ParkManager
            - call: "POST /guests"
              payload: { full_name: "Gim", email: "gim@x.com", zip_code: "00000", height_cm: 150 }
              as: Guest
              captures: { guest_id: $.data.id }
            - call: "POST /orders"
              payload: { park_id: "${park_id}", guest_id: "${guest_id}", product_type: "DAY_TICKET", party_size: 2 }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/pay"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
              captures: { sub: $.data.subtotal_cents, total: $.data.total_cents }
          assert:
            - "pay response data.subtotal_cents == 10000 and data.total_cents == 10000 in the same response"
