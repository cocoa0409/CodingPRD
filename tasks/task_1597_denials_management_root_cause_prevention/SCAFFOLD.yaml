# =============================================================================
# Denials Management & Root-Cause Prevention — scaffold (§1.0–§1.7)
# Hospital revenue-cycle denials team: intake by remittance code, prioritized
# work queue, multi-level payer appeals with timely-filing tracking, overturn
# analytics, upstream fix routing, write-off approval hierarchy, and
# department prevention scorecards.
# =============================================================================

scenario: |
  Denials Management & Root-Cause Prevention (hospital revenue cycle denials team):
  denial intake by remittance code & categorization, work queue prioritization by
  dollar & appeal deadline, appeal letter generation with clinical attachments,
  payer-specific appeal levels & timely-filing tracking, overturn rate analytics
  by reason/payer, upstream fix routing (registration/authorization/coding),
  write-off approval hierarchy, prevention scorecard by department

domain_name: denials-management
api_prefix: /rcm

complexity_profile:
  primary_archetype: compliance_audit        # timely-filing gates, write-off SoD, append-only event log
  secondary_archetype: workflow_orchestration # payer-specific multi-level appeal pipeline with branching
  complexity_layers:
    - optimistic_concurrency        # OCC on DenialCase.version for assign / intake-correction writes
    - cascading_side_effects        # outcome recording and clock sweeps propagate across 3+ entities
    - derived_field_reconciliation  # priority score, open balance, scorecard counters, trailing payer rate
    - rate_threshold_triggers       # write-off approval tiers, queue buckets, payer overturn-rate floor
  entity_topology: flat             # peer collections joined by foreign keys; no nested URL paths
  state_machine_shape: branching    # fork/join with revert loops (appeal revise, write-off revise, task reopen)
  relationship_patterns:
    - one_to_many                   # DenialCase->Appeals, Appeal->Attachments, DenialCase->Events
    - self_referential              # Appeal.previous_appeal_id, RootCauseTask.recurrence_of_task_id
    - cross_aggregate               # DenialCase->Payer, RootCauseTask->Department scorecards
  role_model: segregation_of_duties # write-off requester != approver; fix implementer != verifier
  consistency_model: immediate      # every mutation visible in the same request's response and subsequent reads

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FK annotations canonical)
# =============================================================================
entities:
  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Payer display name" }
      - { name: plan_type, type: enum, source: input, description: "COMMERCIAL | MEDICARE | MEDICAID | MANAGED_CARE" }
      - { name: default_timely_filing_days, type: integer, source: input, description: "Fallback filing window (days) used when no effective PayerAppealPolicy exists for level 1; must be > 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; toggled via PATCH /rcm/payers/{id}" }
      - { name: appeal_policy_review_required, type: boolean, source: computed, default: false, description: "True while trailing overturn rate for this payer is below OVERTURN_RATE_FLOOR with a sufficient resolved-appeal sample (see calculations.payer_trailing_overturn_rate)" }

  - name: PayerAppealPolicy
    parent: null
    common_fields: true
    fields:
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; policy owner" }
      - { name: level_number, type: integer, source: input, description: "Appeal level 1..3 (MAX_APPEAL_LEVEL = 3)" }
      - { name: timely_filing_days, type: integer, source: input, description: "Days allowed to submit an appeal at this level; must be > 0" }
      - { name: response_window_days, type: integer, source: input, default: 30, description: "Days payer has to respond; drives Appeal.response_due_date" }
      - { name: required_attachment_types, type: array, source: input, default: [], description: "List of AppealAttachment.document_type values that must be attached (status ACTIVE) before submit at this level" }
      - { name: effective_from, type: string, source: input, description: "ISO date; policy effective window start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date; window end (exclusive); omitted = open-ended", constraints: "Window is half-open [effective_from, effective_to); per (payer_id, level_number) windows MUST NOT overlap; adjacency (prior.effective_to == next.effective_from) is allowed" }

  - name: RemittanceCode
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Remittance adjustment code (e.g. CO-16); unique", constraints: "unique across RemittanceCode" }
      - { name: category, type: enum, source: input, description: "REGISTRATION | AUTHORIZATION | CODING | CLINICAL_DOCUMENTATION | BILLING | CONTRACTUAL" }
      - { name: default_department, type: enum, source: input, description: "REGISTRATION | AUTHORIZATION | CODING; default upstream owner department for this code" }
      - { name: appealable, type: boolean, source: input, default: true, description: "When false, denials carry this code for analytics but appeals are rejected with ERR_CODE_NOT_APPEALABLE" }
      - { name: description, type: string, source: input, description: "Optional free-text description", default: "" }

  - name: DenialCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_number, type: string, source: input, description: "Payer claim number; unique", constraints: "unique across DenialCase -> ERR_DUPLICATE_CLAIM_NUMBER" }
      - { name: patient_account_number, type: string, source: input, description: "Hospital account number" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; payer that denied the claim" }
      - { name: remittance_code_id, type: string, source: input, description: "FK -> RemittanceCode.id; primary adjustment code on the remittance" }
      - { name: category, type: enum, source: computed, description: "Copied from RemittanceCode.category at intake and frozen thereafter (later catalog edits do not retroactively change it)" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Total billed charges; must be > 0" }
      - { name: denied_amount_cents, type: integer, source: input, description: "Denied portion; must be > 0 and <= billed_amount_cents" }
      - { name: service_date, type: string, source: input, description: "ISO date of service" }
      - { name: remittance_received_date, type: string, source: input, description: "ISO date the remittance (835) was received; anchor for the level-1 filing deadline" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | TRIAGED | QUEUED | IN_APPEAL | RESOLVED_PAID | RESOLVED_WRITTEN_OFF | CLOSED_EXHAUSTED | CLOSED_EXPIRED" }
      - { name: root_cause_department, type: enum, source: computed, description: "REGISTRATION | AUTHORIZATION | CODING; set at triage to input override or RemittanceCode.default_department" }
      - { name: preventable_flag, type: boolean, source: input, default: false, description: "Set at triage; true auto-routes an upstream RootCauseTask" }
      - { name: current_appeal_level, type: integer, source: computed, default: 0, description: "Highest level_number among non-WITHDRAWN appeals; 0 when none" }
      - { name: assigned_specialist_id, type: string, source: system, description: "Opaque user id of the assigned DenialsSpecialist; null until assigned" }
      - { name: recovered_amount_cents, type: integer, source: computed, default: 0, description: "Sum of outcome_amount_cents across appeals currently in OVERTURNED or PARTIALLY_OVERTURNED" }
      - { name: written_off_cents, type: integer, source: computed, default: 0, description: "Sum of approved (non-rescinded) write-off amounts" }
      - { name: open_balance_cents, type: integer, source: computed, description: "= denied_amount_cents - recovered_amount_cents - written_off_cents; invariant pinned in calculations.denial_dollar_conservation" }
      - { name: next_appeal_deadline, type: string, source: computed, description: "ISO date by which the next appeal level must be submitted; null once no further appeal is possible" }
      - { name: priority_score, type: number, source: computed, description: "Work-queue priority per calculations.queue_priority_score; 2 decimal places" }
      - { name: queue_bucket, type: enum, source: computed, description: "CRITICAL | HIGH | MEDIUM | LOW derived from priority_score thresholds (>= boundaries)" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: denial_case_id, type: string, source: input, description: "FK -> DenialCase.id; denial being appealed" }
      - { name: previous_appeal_id, type: string, source: system, description: "FK -> Appeal.id; the appeal at level_number-1 for the same denial; null on level 1" }
      - { name: level_number, type: integer, source: system, description: "= denial.current_appeal_level + 1 at creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LETTER_GENERATED | SUBMITTED | OVERTURNED | PARTIALLY_OVERTURNED | UPHELD | WITHDRAWN" }
      - { name: letter_body, type: string, source: computed, description: "Deterministic appeal letter: claim number, category, level, denied amount, and manifest of ACTIVE attachments sorted by document_type; null until generated and cleared on revise" }
      - { name: generated_at, type: datetime, source: system, description: "Logical-clock timestamp of letter generation; null in DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission; null until SUBMITTED" }
      - { name: response_due_date, type: string, source: computed, description: "submitted date + effective policy.response_window_days; null until SUBMITTED" }
      - { name: outcome_recorded_at, type: datetime, source: system, description: "Logical-clock timestamp when outcome recorded; null until an outcome state" }
      - { name: outcome_amount_cents, type: integer, source: system, default: 0, description: "Recovered dollars recorded at outcome; 0 for UPHELD" }
      - { name: payer_response_code, type: string, source: input, default: "", description: "Optional payer response/remark code recorded with the outcome" }
      - { name: reversal_reason, type: string, source: system, default: "", description: "Reason captured on the most recent reverse-outcome" }

  - name: AppealAttachment
    parent: null
    common_fields: true
    fields:
      - { name: appeal_id, type: string, source: input, description: "FK -> Appeal.id; owning appeal" }
      - { name: document_type, type: enum, source: input, description: "CLINICAL_NOTES | PHYSICIAN_LETTER | LAB_RESULTS | AUTH_RECORD | ITEMIZED_BILL | REMITTANCE_COPY" }
      - { name: file_reference, type: string, source: input, description: "Opaque handle to the stored clinical document" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | VOIDED; only ACTIVE attachments satisfy submission requirements" }
      - { name: voided_reason, type: string, source: system, default: "", description: "Reason recorded when voided" }

  - name: RootCauseTask
    parent: null
    common_fields: true
    fields:
      - { name: denial_case_id, type: string, source: system, description: "FK -> DenialCase.id; originating denial (set from input on manual create, from parent on auto-create)" }
      - { name: department, type: enum, source: system, description: "REGISTRATION | AUTHORIZATION | CODING; copied from denial.root_cause_department" }
      - { name: task_type, type: enum, source: input, description: "PROCESS_FIX | TRAINING | SYSTEM_CONFIG | DATA_QUALITY; auto-created tasks use PROCESS_FIX" }
      - { name: description, type: string, source: input, description: "What the upstream department must change" }
      - { name: due_date, type: string, source: input, description: "ISO date the fix is due; auto-created tasks use triage date + 14 days" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | ACKNOWLEDGED | FIX_IMPLEMENTED | VERIFIED | REOPENED | CLOSED" }
      - { name: implemented_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the UpstreamOwner who implemented the fix" }
      - { name: fix_summary, type: string, source: system, default: "", description: "Summary recorded at implement-fix" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verification" }
      - { name: monitoring_until_date, type: string, source: computed, description: "verified date + MONITORING_DAYS (90); recurrence matching is active while today <= this date" }
      - { name: recurrence_of_task_id, type: string, source: input, description: "FK -> RootCauseTask.id; optional link to a prior VERIFIED task in the same department that this task recurs" }
      - { name: reopened_count, type: integer, source: computed, default: 0, description: "Number of times this task has transitioned VERIFIED -> REOPENED" }

  - name: WriteOffRequest
    parent: null
    common_fields: true
    fields:
      - { name: denial_case_id, type: string, source: input, description: "FK -> DenialCase.id; denial whose open balance is requested for write-off" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested; must be > 0, <= current open balance, <= WRITE_OFF_CEILING_CENTS (10000000)" }
      - { name: reason_code, type: enum, source: input, description: "TIMELY_FILING_EXPIRED | SMALL_BALANCE | APPEALS_EXHAUSTED | CONTRACTUAL_ADJUSTMENT | OTHER" }
      - { name: requested_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the creator (the literal string 'system' for sweep-created requests)" }
      - { name: status, type: enum, source: system, description: "PENDING_MANAGER | ESCALATED_DIRECTOR | APPROVED | REJECTED | RESCINDED; initial status derived from approval_tier" }
      - { name: approval_tier, type: enum, source: computed, description: "STANDARD when requested_amount_cents <= MANAGER_APPROVAL_LIMIT_CENTS (2500000) else ESCALATED; recomputed on revise" }
      - { name: projected_recovery_cents, type: integer, source: computed, description: "Per calculations.writeoff_net_exposure (tier multiplier applied after tier selection)" }
      - { name: recommended_writeoff_cents, type: integer, source: computed, description: "= requested_amount_cents - projected_recovery_cents" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the approver/rejecter; 'system' for sweep auto-rejections" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest decision" }
      - { name: denial_status_before, type: enum, source: system, description: "DenialCase.status snapshot taken at approval; restored by rescind" }
      - { name: decision_reason, type: string, source: system, default: "", description: "Reject/rescind reason text" }

  - name: DepartmentScorecard
    parent: null
    common_fields: true
    fields:
      - { name: department, type: enum, source: input, description: "REGISTRATION | AUTHORIZATION | CODING" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; inclusive period start" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; exclusive period end; must be > period_start_date", constraints: "unique per (department, period_start_date) -> ERR_DUPLICATE_SCORECARD_PERIOD" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | FINALIZED; counters mutate only while OPEN and only for events whose logical date falls in [period_start_date, period_end_date)" }
      - { name: denial_count, type: integer, source: computed, default: 0, description: "Denials triaged into this department within the period" }
      - { name: preventable_denial_count, type: integer, source: computed, default: 0, description: "Subset of denial_count with preventable_flag = true" }
      - { name: denied_cents, type: integer, source: computed, default: 0, description: "Sum of denied_amount_cents over counted denials" }
      - { name: preventable_denied_cents, type: integer, source: computed, default: 0, description: "Sum of denied_amount_cents over preventable denials" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Net recovered dollars from outcomes recorded within the period (reversals subtract)" }
      - { name: written_off_cents, type: integer, source: computed, default: 0, description: "Net approved write-off dollars within the period (rescinds subtract)" }
      - { name: expired_denial_count, type: integer, source: computed, default: 0, description: "Denials of this department expired by the clock sweep within the period" }
      - { name: auto_writeoff_request_count, type: integer, source: computed, default: 0, description: "Write-off requests auto-created by the expiry sweep within the period" }
      - { name: verified_fix_count, type: integer, source: computed, default: 0, description: "Tasks verified within the period minus those reopened within the period" }
      - { name: recurrence_count, type: integer, source: computed, default: 0, description: "Recurrence reopen events within the period" }
      - { name: verified_linked_denied_cents, type: integer, source: computed, default: 0, description: "denied_amount_cents of denials whose tasks are counted in verified_fix_count" }
      - { name: recurrence_linked_denied_cents, type: integer, source: computed, default: 0, description: "denied_amount_cents of the intake denials that triggered recurrences" }
      - { name: open_task_count, type: integer, source: computed, default: 0, description: "Tasks of this department currently in OPEN, ACKNOWLEDGED, FIX_IMPLEMENTED, or REOPENED" }
      - { name: prevention_score_incidence, type: number, source: computed, description: "Per calculations.prevention_scorecard_score (incidence variant); null until FINALIZED" }
      - { name: prevention_score_financial, type: number, source: computed, description: "Per calculations.prevention_scorecard_score (financial variant); null until FINALIZED" }
      - { name: score_tier, type: enum, source: computed, description: "EXCELLENT | GOOD | WATCH | CRITICAL from prevention_score_incidence (>= boundaries); null until FINALIZED" }

  - name: PreventionProgram
    parent: null
    common_fields: true
    fields:
      - { name: department, type: enum, source: input, description: "REGISTRATION | AUTHORIZATION | CODING" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: start_date, type: string, source: input, description: "ISO date; inclusive program window start" }
      - { name: end_date, type: string, source: input, description: "ISO date; inclusive program window end; must be >= start_date", constraints: "Window is CLOSED [start_date, end_date]; per department, windows MUST NOT overlap and touching endpoints DO conflict (prior.end_date == next.start_date is a conflict)" }
      - { name: target_reduction_pct, type: number, source: input, description: "Target denial-rate reduction percent (0..100)" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | ACTIVE | COMPLETED" }

  - name: DenialEvent
    parent: null
    common_fields: false
    fields:
      - { name: denial_case_id, type: string, source: system, description: "FK -> DenialCase.id; denial this audit event belongs to" }
      - { name: event_type, type: enum, source: system, description: "INTAKE | TRIAGED | ASSIGNED | INTAKE_CORRECTED | APPEAL_CREATED | LETTER_GENERATED | APPEAL_SUBMITTED | OUTCOME_RECORDED | OUTCOME_REVERSED | APPEAL_WITHDRAWN | WRITE_OFF_REQUESTED | WRITE_OFF_APPROVED | WRITE_OFF_REJECTED | WRITE_OFF_REVISED | WRITE_OFF_RESCINDED | EXPIRED | TASK_AUTO_CREATED | TASK_CREATED | TASK_VERIFIED | TASK_REOPENED" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor; 'system' for sweeps and cascades" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for sweeps and cascades" }
      - { name: detail, type: string, source: system, description: "Deterministic summary including key amounts/statuses (e.g. recovered_amount_cents)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DenialCase
    initial_state: RECEIVED
    terminal_states: [RESOLVED_PAID]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: POST /rcm/denial-cases/{id}/triage
        actor: DenialsSpecialist
        preconditions:
          - "status == RECEIVED (ERR_DENIAL_INVALID_STATE)"
        side_effects:
          - "root_cause_department = triage override if provided else RemittanceCode.default_department; preventable_flag set from input"
          - "OPEN DepartmentScorecard matching (root_cause_department, today's logical date in [period_start, period_end)): denial_count += 1, denied_cents += denied_amount_cents; if preventable_flag then preventable_denial_count += 1 and preventable_denied_cents += denied_amount_cents"
          - "If preventable_flag: auto-create RootCauseTask (status OPEN, task_type PROCESS_FIX, department = root_cause_department, due_date = today + 14 days) + emit TASK_AUTO_CREATED event; scorecard open_task_count += 1"
          - "Recurrence sweep: among RootCauseTasks with status VERIFIED, department == this denial's root_cause_department, task's denial category == this denial's category, and monitoring_until_date >= today, the single task with earliest verified_at (tie: created_at ASC) transitions VERIFIED -> REOPENED (see RootCauseTask machine for its side effects)"
          - "Emit TRIAGED event; recompute priority_score/queue_bucket"

      - from: TRIAGED
        to: QUEUED
        trigger: POST /rcm/denial-cases/{id}/assign
        actor: DenialsManager
        preconditions:
          - "status in {TRIAGED, QUEUED} (ERR_DENIAL_INVALID_STATE)"
          - "expected_denial_case_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_specialist_id = input specialist_id; status -> QUEUED when previously TRIAGED (stays QUEUED on reassignment)"
          - "Emit ASSIGNED event; increments DenialCase.version by 1"

      - from: QUEUED
        to: QUEUED
        trigger: POST /rcm/denial-cases/{id}/assign
        actor: DenialsManager
        preconditions:
          - "status in {TRIAGED, QUEUED} (ERR_DENIAL_INVALID_STATE)"
          - "expected_denial_case_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_specialist_id = input specialist_id (reassignment)"
          - "Emit ASSIGNED event; increments DenialCase.version by 1"

      - from: QUEUED
        to: IN_APPEAL
        trigger: POST /rcm/appeals (first appeal for this denial)
        actor: DenialsSpecialist
        preconditions:
          - "status in {QUEUED, IN_APPEAL} (ERR_DENIAL_INVALID_STATE)"
        side_effects:
          - "current_appeal_level = 1; next_appeal_deadline unchanged (already the level-1 deadline)"
          - "Emit APPEAL_CREATED event; recompute priority_score (level boost applies)"

      - from: IN_APPEAL
        to: IN_APPEAL
        trigger: POST /rcm/appeals (next-level appeal after UPHELD or PARTIALLY_OVERTURNED with balance remaining)
        actor: DenialsSpecialist
        preconditions:
          - "status in {QUEUED, IN_APPEAL} (ERR_DENIAL_INVALID_STATE)"
        side_effects:
          - "current_appeal_level += 1"
          - "Emit APPEAL_CREATED event; recompute priority_score"

      - from: IN_APPEAL
        to: QUEUED
        trigger: POST /rcm/appeals/{id}/withdraw when no non-WITHDRAWN appeals remain
        actor: DenialsSpecialist
        preconditions:
          - "recomputed current_appeal_level == 0 after withdrawal"
        side_effects:
          - "current_appeal_level = 0; next_appeal_deadline unchanged (level-1 deadline still governs)"
          - "Recompute priority_score"

      - from: IN_APPEAL
        to: RESOLVED_PAID
        trigger: POST /rcm/appeals/{id}/record-outcome when open_balance_cents reaches 0 and written_off_cents == 0
        actor: DenialsSpecialist
        preconditions: []
        side_effects:
          - "recovered_amount_cents += outcome_amount_cents; next_appeal_deadline = null"
          - "Cascade hop 2: OPEN DepartmentScorecard for (root_cause_department, outcome date in period): recovered_cents += outcome_amount_cents"
          - "Cascade hop 3 (via hop 2 aggregate): payer trailing overturn rate recomputed; if resolved sample >= 3 and rate < 0.30 then Payer.appeal_policy_review_required = true (>= 0.30 resets to false)"
          - "Emit OUTCOME_RECORDED event"

      - from: IN_APPEAL
        to: CLOSED_EXHAUSTED
        trigger: POST /rcm/appeals/{id}/record-outcome with UPHELD or PARTIALLY_OVERTURNED at level_number == MAX_APPEAL_LEVEL (3) while open_balance_cents > 0
        actor: DenialsSpecialist
        preconditions: []
        side_effects:
          - "recovered_amount_cents += outcome_amount_cents; next_appeal_deadline = null"
          - "Cascade: scorecard recovered_cents += outcome_amount_cents; payer trailing rate recompute + review flag"
          - "Emit OUTCOME_RECORDED event"

      - from: QUEUED
        to: CLOSED_EXPIRED
        trigger: "system: POST /rcm/_clock/set_current_utc sweep when today > next_appeal_deadline (processed in created_at ASC order)"
        actor: system
        preconditions:
          - "status == QUEUED and today > next_appeal_deadline"
        side_effects:
          - "Cascade hop 1: status -> CLOSED_EXPIRED; next_appeal_deadline = null; emit EXPIRED event"
          - "Cascade hop 2: auto-create WriteOffRequest (requested_amount_cents = open_balance_cents, reason_code TIMELY_FILING_EXPIRED, requested_by_user_id 'system'; tier/status per calculations.writeoff_net_exposure); emit WRITE_OFF_REQUESTED event"
          - "Cascade hop 3: OPEN DepartmentScorecard for (root_cause_department, new clock date in period): expired_denial_count += 1 and auto_writeoff_request_count += 1"

      - from: IN_APPEAL
        to: CLOSED_EXPIRED
        trigger: "system: POST /rcm/_clock/set_current_utc sweep when today > next_appeal_deadline and no appeal is in DRAFT, LETTER_GENERATED, or SUBMITTED"
        actor: system
        preconditions:
          - "status == IN_APPEAL and today > next_appeal_deadline and zero appeals in {DRAFT, LETTER_GENERATED, SUBMITTED}"
        side_effects:
          - "Same cascade as QUEUED -> CLOSED_EXPIRED (write-off auto-creation + scorecard counters)"

      - from: QUEUED
        to: RESOLVED_WRITTEN_OFF
        trigger: POST /rcm/write-off-requests/{id}/approve when open_balance_cents reaches 0
        actor: DenialsManager | RevenueCycleDirector
        preconditions: []
        side_effects:
          - "written_off_cents += approved amount; next_appeal_deadline = null; emit WRITE_OFF_APPROVED event"
          - "Scorecard written_off_cents += amount"

      - from: IN_APPEAL
        to: RESOLVED_WRITTEN_OFF
        trigger: POST /rcm/write-off-requests/{id}/approve when open_balance_cents reaches 0
        actor: DenialsManager | RevenueCycleDirector
        preconditions: []
        side_effects:
          - "written_off_cents += approved amount; next_appeal_deadline = null; emit WRITE_OFF_APPROVED event"
          - "Scorecard written_off_cents += amount"

      - from: CLOSED_EXHAUSTED
        to: RESOLVED_WRITTEN_OFF
        trigger: POST /rcm/write-off-requests/{id}/approve when open_balance_cents reaches 0
        actor: DenialsManager | RevenueCycleDirector
        preconditions: []
        side_effects:
          - "written_off_cents += approved amount; emit WRITE_OFF_APPROVED event"
          - "Scorecard written_off_cents += amount"

      - from: CLOSED_EXPIRED
        to: RESOLVED_WRITTEN_OFF
        trigger: POST /rcm/write-off-requests/{id}/approve when open_balance_cents reaches 0
        actor: DenialsManager | RevenueCycleDirector
        preconditions: []
        side_effects:
          - "written_off_cents += approved amount; emit WRITE_OFF_APPROVED event"
          - "Scorecard written_off_cents += amount"

      - from: RESOLVED_WRITTEN_OFF
        to: CLOSED_EXHAUSTED
        trigger: POST /rcm/write-off-requests/{id}/rescind
        actor: RevenueCycleDirector
        preconditions:
          - "WriteOffRequest.denial_status_before == CLOSED_EXHAUSTED"
        side_effects:
          - "written_off_cents -= rescinded amount; open_balance_cents recomputed"
          - "Scorecard written_off_cents -= amount; emit WRITE_OFF_RESCINDED event"

      - from: RESOLVED_WRITTEN_OFF
        to: CLOSED_EXPIRED
        trigger: POST /rcm/write-off-requests/{id}/rescind
        actor: RevenueCycleDirector
        preconditions:
          - "WriteOffRequest.denial_status_before == CLOSED_EXPIRED"
        side_effects:
          - "written_off_cents -= rescinded amount; open_balance_cents recomputed"
          - "Scorecard written_off_cents -= amount; emit WRITE_OFF_RESCINDED event"

      - from: RESOLVED_WRITTEN_OFF
        to: QUEUED
        trigger: POST /rcm/write-off-requests/{id}/rescind
        actor: RevenueCycleDirector
        preconditions:
          - "WriteOffRequest.denial_status_before == QUEUED"
        side_effects:
          - "written_off_cents -= rescinded amount; next_appeal_deadline restored to level-1 deadline; recompute priority_score"
          - "Scorecard written_off_cents -= amount; emit WRITE_OFF_RESCINDED event"

      - from: RESOLVED_WRITTEN_OFF
        to: IN_APPEAL
        trigger: POST /rcm/write-off-requests/{id}/rescind
        actor: RevenueCycleDirector
        preconditions:
          - "WriteOffRequest.denial_status_before == IN_APPEAL"
        side_effects:
          - "written_off_cents -= rescinded amount; next_appeal_deadline restored per calculations.appeal_deadline_schedule using the latest outcome date; recompute priority_score"
          - "Scorecard written_off_cents -= amount; emit WRITE_OFF_RESCINDED event"

  - entity: Appeal
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: LETTER_GENERATED
        trigger: POST /rcm/appeals/{id}/generate-letter
        actor: DenialsSpecialist
        preconditions:
          - "status == DRAFT (ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "letter_body = deterministic template (claim_number, category, level_number, denied_amount_cents, manifest of ACTIVE attachments sorted by document_type); generated_at = logical clock"
          - "Emit LETTER_GENERATED event"

      - from: LETTER_GENERATED
        to: DRAFT
        trigger: POST /rcm/appeals/{id}/revise
        actor: DenialsSpecialist
        preconditions:
          - "status == LETTER_GENERATED (ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "letter_body = null; generated_at = null"

      - from: LETTER_GENERATED
        to: SUBMITTED
        trigger: POST /rcm/appeals/{id}/submit
        actor: DenialsSpecialist
        preconditions:
          - "status == LETTER_GENERATED (ERR_APPEAL_INVALID_STATE)"
          - "today <= denial.next_appeal_deadline, date granularity (ERR_TIMELY_FILING_EXPIRED)"
          - "required_attachment_types of the effective policy (window contains submission date) are a subset of this appeal's ACTIVE attachment document_types (ERR_ATTACHMENT_REQUIREMENT_UNMET)"
        side_effects:
          - "submitted_at = logical clock; response_due_date = submission date + policy.response_window_days (fallback 30)"
          - "Emit APPEAL_SUBMITTED event; increments parent DenialCase.version by 1"

      - from: SUBMITTED
        to: OVERTURNED
        trigger: POST /rcm/appeals/{id}/record-outcome
        actor: DenialsSpecialist
        preconditions:
          - "status == SUBMITTED (ERR_APPEAL_INVALID_STATE)"
          - "outcome == OVERTURNED requires recovered_amount_cents == denial.open_balance_cents (ERR_OUTCOME_AMOUNT_INCONSISTENT)"
        side_effects:
          - "outcome_amount_cents = recovered_amount_cents; outcome_recorded_at = logical clock; payer_response_code stored"
          - "DenialCase cascade per DenialCase machine (recovered += amount; RESOLVED_PAID since open balance reaches 0)"
          - "Emit OUTCOME_RECORDED event"

      - from: SUBMITTED
        to: PARTIALLY_OVERTURNED
        trigger: POST /rcm/appeals/{id}/record-outcome
        actor: DenialsSpecialist
        preconditions:
          - "status == SUBMITTED (ERR_APPEAL_INVALID_STATE)"
          - "outcome == PARTIALLY_OVERTURNED requires 0 < recovered_amount_cents < denial.open_balance_cents (ERR_OUTCOME_AMOUNT_INCONSISTENT)"
        side_effects:
          - "outcome fields stored; denial.recovered_amount_cents += amount"
          - "If level_number < MAX_APPEAL_LEVEL and an effective PayerAppealPolicy exists for level_number+1: next_appeal_deadline = outcome date + that policy's timely_filing_days; denial stays IN_APPEAL"
          - "Else (no next level): denial -> CLOSED_EXHAUSTED with next_appeal_deadline = null"
          - "Scorecard recovered_cents += amount; payer trailing rate recompute; emit OUTCOME_RECORDED event"

      - from: SUBMITTED
        to: UPHELD
        trigger: POST /rcm/appeals/{id}/record-outcome
        actor: DenialsSpecialist
        preconditions:
          - "status == SUBMITTED (ERR_APPEAL_INVALID_STATE)"
          - "outcome == UPHELD requires recovered_amount_cents == 0 (ERR_OUTCOME_AMOUNT_INCONSISTENT)"
        side_effects:
          - "outcome fields stored (outcome_amount_cents = 0)"
          - "If level_number < MAX_APPEAL_LEVEL and an effective PayerAppealPolicy exists for level_number+1: next_appeal_deadline = outcome date + next-level timely_filing_days; denial stays IN_APPEAL"
          - "Else: denial -> CLOSED_EXHAUSTED, next_appeal_deadline = null"
          - "Payer trailing rate recompute; emit OUTCOME_RECORDED event"

      - from: OVERTURNED
        to: SUBMITTED
        trigger: POST /rcm/appeals/{id}/reverse-outcome
        actor: ComplianceAuditor
        preconditions:
          - "status in {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD} (ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "DenialCase.recovered_amount_cents -= outcome_amount_cents; outcome_amount_cents = 0; reversal_reason stored; outcome_recorded_at = null"
          - "If DenialCase was RESOLVED_PAID: status -> IN_APPEAL and next_appeal_deadline = today + effective next-level policy timely_filing_days (fallback payer.default_timely_filing_days)"
          - "If DenialCase was CLOSED_EXHAUSTED and a next-level policy exists: status -> IN_APPEAL with recomputed deadline"
          - "Scorecard recovered_cents -= reversed amount; payer trailing rate recompute; emit OUTCOME_REVERSED event"

      - from: PARTIALLY_OVERTURNED
        to: SUBMITTED
        trigger: POST /rcm/appeals/{id}/reverse-outcome
        actor: ComplianceAuditor
        preconditions:
          - "status in {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD} (ERR_APPEAL_INVALID_STATE)"
        side_effects: ["Same reversal semantics as OVERTURNED -> SUBMITTED"]

      - from: UPHELD
        to: SUBMITTED
        trigger: POST /rcm/appeals/{id}/reverse-outcome
        actor: ComplianceAuditor
        preconditions:
          - "status in {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD} (ERR_APPEAL_INVALID_STATE)"
        side_effects: ["Same reversal semantics as OVERTURNED -> SUBMITTED (amount reversed is 0)"]

      - from: DRAFT
        to: WITHDRAWN
        trigger: POST /rcm/appeals/{id}/withdraw
        actor: DenialsSpecialist
        preconditions:
          - "status in {DRAFT, LETTER_GENERATED} (ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "DenialCase.current_appeal_level recomputed as max level_number among non-WITHDRAWN appeals (0 when none)"
          - "If recomputed level == 0: DenialCase IN_APPEAL -> QUEUED; next_appeal_deadline unchanged"
          - "Emit APPEAL_WITHDRAWN event"

      - from: LETTER_GENERATED
        to: WITHDRAWN
        trigger: POST /rcm/appeals/{id}/withdraw
        actor: DenialsSpecialist
        preconditions:
          - "status in {DRAFT, LETTER_GENERATED} (ERR_APPEAL_INVALID_STATE)"
        side_effects: ["Same withdrawal semantics as DRAFT -> WITHDRAWN"]

  - entity: RootCauseTask
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: POST /rcm/root-cause-tasks/{id}/acknowledge
        actor: UpstreamOwner
        preconditions:
          - "status in {OPEN, REOPENED} (ERR_TASK_INVALID_STATE)"
        side_effects: []

      - from: REOPENED
        to: ACKNOWLEDGED
        trigger: POST /rcm/root-cause-tasks/{id}/acknowledge
        actor: UpstreamOwner
        preconditions:
          - "status in {OPEN, REOPENED} (ERR_TASK_INVALID_STATE)"
        side_effects: []

      - from: ACKNOWLEDGED
        to: FIX_IMPLEMENTED
        trigger: POST /rcm/root-cause-tasks/{id}/implement-fix
        actor: UpstreamOwner
        preconditions:
          - "status == ACKNOWLEDGED (ERR_TASK_INVALID_STATE)"
        side_effects:
          - "implemented_by_user_id = X-User-ID; fix_summary stored"

      - from: FIX_IMPLEMENTED
        to: VERIFIED
        trigger: POST /rcm/root-cause-tasks/{id}/verify
        actor: DenialsManager
        preconditions:
          - "status == FIX_IMPLEMENTED (ERR_TASK_INVALID_STATE)"
          - "X-User-ID != implemented_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_at = logical clock; monitoring_until_date = verified date + 90 days"
          - "OPEN DepartmentScorecard for (department, verify date in period): verified_fix_count += 1, verified_linked_denied_cents += linked denial's denied_amount_cents, open_task_count -= 1"
          - "Emit TASK_VERIFIED event on the linked denial"

      - from: VERIFIED
        to: REOPENED
        trigger: "system: recurrence sweep during POST /rcm/denial-cases/{id}/triage (single best-matching task: earliest verified_at, tie created_at ASC)"
        actor: system
        preconditions:
          - "status == VERIFIED and monitoring_until_date >= today and department == new denial's root_cause_department and linked denial's category == new denial's category"
        side_effects:
          - "reopened_count += 1; verified_at = null; monitoring_until_date = null"
          - "Scorecard: verified_fix_count -= 1, verified_linked_denied_cents -= this task's denial's denied_amount_cents, recurrence_count += 1, recurrence_linked_denied_cents += the NEW denial's denied_amount_cents, open_task_count += 1"
          - "Emit TASK_REOPENED event on the NEW denial"

      - from: VERIFIED
        to: CLOSED
        trigger: POST /rcm/root-cause-tasks/{id}/close
        actor: DenialsManager
        preconditions:
          - "status == VERIFIED (ERR_TASK_INVALID_STATE)"
          - "today > monitoring_until_date (ERR_MONITORING_WINDOW_ACTIVE)"
        side_effects: []

  - entity: WriteOffRequest
    initial_state: PENDING_MANAGER
    terminal_states: [RESCINDED]
    transitions:
      - from: PENDING_MANAGER
        to: APPROVED
        trigger: POST /rcm/write-off-requests/{id}/approve
        actor: DenialsManager | RevenueCycleDirector
        preconditions:
          - "status in {PENDING_MANAGER, ESCALATED_DIRECTOR} (ERR_WRITE_OFF_NOT_PENDING)"
          - "X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "approval_tier == STANDARD, or actor is RevenueCycleDirector (ERR_APPROVAL_LIMIT_EXCEEDED)"
          - "DenialCase.status in {QUEUED, IN_APPEAL, CLOSED_EXHAUSTED, CLOSED_EXPIRED} (ERR_DENIAL_INVALID_STATE)"
          - "requested_amount_cents <= denial.open_balance_cents (ERR_AMOUNT_EXCEEDS_OPEN_BALANCE)"
        side_effects:
          - "denial_status_before = denial.status; decided_by_user_id/decided_at stored"
          - "DenialCase.written_off_cents += requested_amount_cents; if open_balance_cents reaches 0 then denial -> RESOLVED_WRITTEN_OFF"
          - "Scorecard written_off_cents += amount; emit WRITE_OFF_APPROVED event"

      - from: ESCALATED_DIRECTOR
        to: APPROVED
        trigger: POST /rcm/write-off-requests/{id}/approve
        actor: RevenueCycleDirector
        preconditions:
          - "status in {PENDING_MANAGER, ESCALATED_DIRECTOR} (ERR_WRITE_OFF_NOT_PENDING)"
          - "X-User-ID != requested_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "actor is RevenueCycleDirector when approval_tier == ESCALATED (ERR_APPROVAL_LIMIT_EXCEEDED)"
          - "DenialCase.status in {QUEUED, IN_APPEAL, CLOSED_EXHAUSTED, CLOSED_EXPIRED} (ERR_DENIAL_INVALID_STATE)"
          - "requested_amount_cents <= denial.open_balance_cents (ERR_AMOUNT_EXCEEDS_OPEN_BALANCE)"
        side_effects: ["Same approval side effects as PENDING_MANAGER -> APPROVED"]

      - from: PENDING_MANAGER
        to: REJECTED
        trigger: POST /rcm/write-off-requests/{id}/reject
        actor: DenialsManager | RevenueCycleDirector
        preconditions:
          - "status in {PENDING_MANAGER, ESCALATED_DIRECTOR} (ERR_WRITE_OFF_NOT_PENDING)"
        side_effects: ["decision_reason stored; decided_by_user_id/decided_at stored; emit WRITE_OFF_REJECTED event"]

      - from: ESCALATED_DIRECTOR
        to: REJECTED
        trigger: POST /rcm/write-off-requests/{id}/reject
        actor: DenialsManager | RevenueCycleDirector
        preconditions:
          - "status in {PENDING_MANAGER, ESCALATED_DIRECTOR} (ERR_WRITE_OFF_NOT_PENDING)"
        side_effects: ["decision_reason stored; decided_by_user_id/decided_at stored; emit WRITE_OFF_REJECTED event"]

      - from: REJECTED
        to: PENDING_MANAGER
        trigger: POST /rcm/write-off-requests/{id}/revise
        actor: DenialsSpecialist
        preconditions:
          - "status == REJECTED (ERR_WRITE_OFF_NOT_PENDING)"
          - "X-User-ID == requested_by_user_id (ERR_NOT_REQUEST_OWNER)"
          - "new requested_amount_cents <= denial.open_balance_cents and <= WRITE_OFF_CEILING_CENTS"
        side_effects:
          - "requested_amount_cents updated; approval_tier, projected_recovery_cents, recommended_writeoff_cents recomputed (calculations.writeoff_net_exposure); status = PENDING_MANAGER when tier STANDARD"
          - "Emit WRITE_OFF_REVISED event"

      - from: REJECTED
        to: ESCALATED_DIRECTOR
        trigger: POST /rcm/write-off-requests/{id}/revise
        actor: DenialsSpecialist
        preconditions:
          - "status == REJECTED (ERR_WRITE_OFF_NOT_PENDING)"
          - "X-User-ID == requested_by_user_id (ERR_NOT_REQUEST_OWNER)"
          - "new requested_amount_cents <= denial.open_balance_cents and <= WRITE_OFF_CEILING_CENTS"
        side_effects:
          - "Same as revise to PENDING_MANAGER but recomputed tier == ESCALATED so status = ESCALATED_DIRECTOR"
          - "Emit WRITE_OFF_REVISED event"

      - from: APPROVED
        to: RESCINDED
        trigger: POST /rcm/write-off-requests/{id}/rescind
        actor: RevenueCycleDirector
        preconditions:
          - "status == APPROVED (ERR_WRITE_OFF_NOT_PENDING)"
        side_effects:
          - "DenialCase.written_off_cents -= requested_amount_cents; denial status restored from denial_status_before"
          - "Scorecard written_off_cents -= amount; emit WRITE_OFF_RESCINDED event"

  - entity: Payer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: PATCH /rcm/payers/{id} with status = INACTIVE
        actor: RevenueCycleDirector
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: ["New denial intake for this payer is rejected with ERR_PAYER_INACTIVE; existing denials are unaffected"]
      - from: INACTIVE
        to: ACTIVE
        trigger: PATCH /rcm/payers/{id} with status = ACTIVE
        actor: RevenueCycleDirector
        preconditions:
          - "status == INACTIVE (ERR_INVALID_STATE)"
        side_effects: ["Intake re-enabled"]

  - entity: AppealAttachment
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: POST /rcm/appeal-attachments/{id}/void
        actor: DenialsSpecialist
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
          - "parent appeal status in {DRAFT, LETTER_GENERATED} (ERR_APPEAL_INVALID_STATE)"
        side_effects: ["voided_reason stored; parent appeal letter_body (if any) is stale until regenerated"]

  - entity: DepartmentScorecard
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: POST /rcm/department-scorecards/{id}/finalize
        actor: RevenueCycleDirector
        preconditions:
          - "status == OPEN (ERR_SCORECARD_NOT_OPEN)"
        side_effects:
          - "prevention_score_incidence, prevention_score_financial, score_tier computed per calculations.prevention_scorecard_score using logical clock for overdue determination; counters frozen"

  - entity: PreventionProgram
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: POST /rcm/prevention-programs/{id}/activate
        actor: RevenueCycleDirector
        preconditions:
          - "status == PLANNED (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: POST /rcm/prevention-programs/{id}/complete
        actor: RevenueCycleDirector
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; sequential-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: denial-assign-stale-version
    parent_entity: DenialCase
    write_endpoint: "POST /rcm/denial-cases/{id}/assign"
    occ_field: expected_denial_case_version
    description: |
      Assigning or reassigning a DenialCase with an expected_denial_case_version
      that no longer matches the denial's current version is rejected. This
      captures the case where another writer has just mutated the denial (a
      prior assignment, triage, or cascaded update) since the client last
      observed it, making the client's view of the queue entry stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: denial-correction-stale-version
    parent_entity: DenialCase
    write_endpoint: "PATCH /rcm/denial-cases/{id}"
    occ_field: expected_denial_case_version
    description: |
      Correcting intake fields (amounts or remittance date) on a DenialCase with
      an expected_denial_case_version that no longer matches the denial's current
      version is rejected, because a legitimate prior write (triage, assignment,
      or an earlier correction) has advanced the version since the client last
      observed the denial.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: appeal_deadline_schedule
    trigger: "denial intake (level 1); appeal outcome recorded (next level); outcome reversal; write-off rescind restoring IN_APPEAL"
    algorithm: chronological
    formula: |
      Level 1: next_appeal_deadline = remittance_received_date + effective_policy(payer, 1).timely_filing_days,
      where effective_policy(payer, N) is the PayerAppealPolicy for (payer_id, N) whose half-open
      window [effective_from, effective_to) contains the anchor date; open-ended (effective_to null)
      covers every anchor >= effective_from. Fallback when no such policy exists for level 1:
      payer.default_timely_filing_days.
      Level N >= 2 (after an outcome at level N-1): anchor date = date(outcome_recorded_at);
      next_appeal_deadline = anchor + effective_policy(payer, N).timely_filing_days.
      When no policy covers level N at the anchor date, no further appeal level exists:
      next_appeal_deadline = null (intake-side gate ERR_APPEAL_LEVEL_EXHAUSTED applies instead).
      Timeliness comparison is DATE-granular: submission is timely iff date(submitted_at) <= next_appeal_deadline.
    input_set: "DenialCase in non-terminal status; PayerAppealPolicy rows of the denial's payer"
    constants:
      MAX_APPEAL_LEVEL: 3
    precision: "date granularity (ISO dates, no time component)"

  - name: queue_priority_score
    trigger: "intake, triage, assign, intake correction, appeal create, outcome recorded/reversed, withdrawal, clock set (sweep), write-off approve/rescind"
    algorithm: weighted_scoring
    formula: |
      Applies only to DenialCase with status in {QUEUED, IN_APPEAL}; all other statuses have
      priority_score = 0.00 and queue_bucket = LOW (they never appear in the work queue).
      days_remaining = (next_appeal_deadline - today).days, clamped below at 0.
      dollar_component    = min(open_balance_cents / 10000, 50)
      deadline_component  = 0 if days_remaining > 30 else max(0, 45 - 1.5 * days_remaining)
      level_boost         = 5 * min(current_appeal_level, 2)
      priority_score      = dollar_component + deadline_component + level_boost
      queue_bucket        = CRITICAL if score >= 70.00, HIGH if >= 50.00, MEDIUM if >= 25.00, else LOW
    input_set: "DenialCase.status in {QUEUED, IN_APPEAL}"
    constants:
      DOLLAR_POINT_DIVISOR_CENTS: 10000
      DOLLAR_COMPONENT_CAP: 50
      DEADLINE_HORIZON_DAYS: 30
      DEADLINE_COMPONENT_CAP: 45
      DEADLINE_DAILY_STEP: 1.5
      LEVEL_BOOST_PER_LEVEL: 5
      LEVEL_BOOST_CAP_LEVELS: 2
      BUCKET_CRITICAL: 70.00
      BUCKET_HIGH: 50.00
      BUCKET_MEDIUM: 25.00
    precision: "2 decimal places, round_half_up"

  - name: expected_recovery_value
    trigger: "GET /rcm/denial-cases/{id}/recovery-projection (variant=gross|net, default gross)"
    algorithm: forward_looking
    formula: |
      rate(payer, level): trailing overturn rate among this payer's appeals at that level whose
      status is in {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD}:
        rate = (count(OVERTURNED) + 0.5 * count(PARTIALLY_OVERTURNED)) / resolved_count
      Fallback ladder (deterministic): if level-resolved_count == 0 use the payer-wide rate across
      all levels; if payer-wide resolved_count == 0 use DEFAULT_OVERTURN_RATE (0.50).
      remaining_levels = MAX_APPEAL_LEVEL - denial.current_appeal_level
      gross: expected_recovery_cents = round_half_up(open_balance_cents * rate(payer, next_level), 0)
             where next_level = current_appeal_level + 1
      net:   expected_recovery_cents = round_half_up(open_balance_cents * rate(payer, next_level), 0)
                                      - APPEAL_COST_CENTS * remaining_levels
             floored at 0
    input_set: "DenialCase any non-terminal status; appeals of the denial's payer for rate"
    constants:
      DEFAULT_OVERTURN_RATE: 0.50
      APPEAL_COST_CENTS: 5000
      MAX_APPEAL_LEVEL: 3
    precision: "integer cents, round_half_up"
    variants:
      - name: gross
        when: "variant=gross (default): raw recovery expectation without appeal cost"
        difference: "Does not subtract appeal processing cost; always >= net for identical data"
      - name: net
        when: "variant=net: recovery expectation net of remaining appeal cost"
        difference: "Subtracts APPEAL_COST_CENTS * remaining_levels; produces a strictly smaller value whenever remaining_levels > 0"

  - name: overturn_rate_report
    trigger: "GET /rcm/analytics/overturn-rates?group_by=payer|category[&from_date][&to_date]"
    algorithm: aggregation
    formula: |
      Row set: appeals with status in {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD} and
      outcome_recorded_at date within [from_date, to_date] (inclusive both ends; absent bounds =
      unbounded), grouped by the denial's payer (group_by=payer) or the denial's category
      (group_by=category). One row per group that has >= 1 resolved appeal... plus groups that
      have denials but zero resolved appeals in the window are included with resolved_count = 0
      and overturn_rate_pct = null (never 0, never an error).
      Cell: resolved_count = group size; overturned_count = count(OVERTURNED);
            partial_count = count(PARTIALLY_OVERTURNED);
            overturn_rate_pct = round_half_up(100 * (overturned_count + 0.5 * partial_count)
                                              / resolved_count, 2)
      Totals row (ROUNDING ORDER PINNED): computed from UNROUNDED aggregate counts pooled across
      all rows — totals.overturn_rate_pct = round_half_up(100 * (sum(overturned) +
      0.5 * sum(partial)) / sum(resolved), 2). It is NEVER the sum or average of the rounded
      per-row percentages; summing rounded cells is a different (incorrect) number.
    input_set: "Appeals in outcome states {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD} within the date window; groups keyed on DenialCase.payer_id or DenialCase.category"
    constants: {}
    precision: "2 decimal places, round_half_up; totals from raw counts, single rounding"

  - name: prevention_scorecard_score
    trigger: "POST /rcm/department-scorecards/{id}/finalize (both variants computed and frozen)"
    algorithm: weighted_scoring
    formula: |
      All rates use zero-denominator -> 0.0. 'today' is the logical clock at finalize.
      overdue tasks = department tasks in {OPEN, ACKNOWLEDGED, FIX_IMPLEMENTED, REOPENED} with
      due_date < today; open tasks = same status set regardless of due_date.
      INCIDENCE variant (count-weighted):
        recurrence_rate  = recurrence_count / (verified_fix_count + recurrence_count)
        preventable_rate = preventable_denial_count / denial_count
        overdue_rate     = overdue_task_count / open_task_count
      FINANCIAL variant (dollar-weighted):
        recurrence_rate  = recurrence_linked_denied_cents / (verified_linked_denied_cents + recurrence_linked_denied_cents)
        preventable_rate = preventable_denied_cents / denied_cents
        overdue_rate     = (sum denied_amount_cents of denials linked to overdue tasks)
                           / (sum denied_amount_cents of denials linked to open tasks)
      score = 100 - (50 * recurrence_rate + 30 * preventable_rate + 20 * overdue_rate),
      clamped to [0, 100], rounded 2 dp round_half_up.
      score_tier (from the INCIDENCE score): EXCELLENT >= 90.00, GOOD >= 75.00, WATCH >= 60.00,
      else CRITICAL.
    input_set: "DepartmentScorecard counters (events within [period_start, period_end) while OPEN) plus live task overdue/open evaluation at finalize"
    constants:
      W_RECURRENCE: 50
      W_PREVENTABLE: 30
      W_OVERDUE: 20
      TIER_EXCELLENT: 90.00
      TIER_GOOD: 75.00
      TIER_WATCH: 60.00
    precision: "2 decimal places, round_half_up; final score rounded once (rates not pre-rounded)"
    variants:
      - name: incidence
        when: "count-weighted rates over denials and tasks"
        difference: "Each denial/task weighs equally regardless of dollars"
      - name: financial
        when: "dollar-weighted rates over denied amounts"
        difference: "High-dollar denials dominate; for skewed amounts the score diverges from incidence"

  - name: writeoff_net_exposure
    trigger: "POST /rcm/write-off-requests create and revise"
    algorithm: tiered_pricing
    formula: |
      EVALUATION ORDER PINNED (breaks the apparent tier<->recovery cycle):
      1. gross_exposure_cents = requested_amount_cents (already validated <= open balance and
         <= WRITE_OFF_CEILING_CENTS)
      2. approval_tier = STANDARD if gross_exposure_cents <= MANAGER_APPROVAL_LIMIT_CENTS
         else ESCALATED   (tier is keyed on gross, never on the recommended amount)
      3. tier_multiplier = 1.0 for STANDARD, 0.75 for ESCALATED
         rate = rate(payer, next_level) from calculations.expected_recovery_value
                (same fallback ladder; next_level = current_appeal_level + 1)
      4. projected_recovery_cents = round_half_up(gross_exposure_cents * rate * tier_multiplier, 0)
      5. recommended_writeoff_cents = gross_exposure_cents - projected_recovery_cents
      Initial status: PENDING_MANAGER when tier STANDARD, ESCALATED_DIRECTOR when ESCALATED.
    input_set: "WriteOffRequest being created or revised; its DenialCase and payer appeal stats"
    constants:
      MANAGER_APPROVAL_LIMIT_CENTS: 2500000
      WRITE_OFF_CEILING_CENTS: 10000000
      STANDARD_TIER_MULTIPLIER: 1.0
      ESCALATED_TIER_MULTIPLIER: 0.75
    precision: "integer cents, round_half_up"

  - name: payer_trailing_overturn_rate
    trigger: "every record-outcome and reverse-outcome"
    algorithm: threshold
    formula: |
      resolved = this payer's appeals in {OVERTURNED, PARTIALLY_OVERTURNED, UPHELD} (all-time)
      rate = (count(OVERTURNED) + 0.5 * count(PARTIALLY_OVERTURNED)) / count(resolved)
      When count(resolved) >= MIN_SAMPLE (3):
        payer.appeal_policy_review_required = (rate < OVERTURN_RATE_FLOOR)   # strict <, 0.30 exactly is NOT flagged
      Below MIN_SAMPLE the flag is left unchanged from its current value.
      Recomputed and rewritten on every outcome record/reversal for that payer.
    input_set: "All outcome-state appeals of the payer"
    constants:
      OVERTURN_RATE_FLOOR: 0.30
      MIN_SAMPLE: 3
    precision: "rate unrounded for the comparison"

  - name: denial_dollar_conservation
    trigger: "invariant checked after every mutation touching recovered/written-off amounts"
    algorithm: aggregation
    formula: |
      INVARIANT (money conservation on a DenialCase):
        open_balance_cents + recovered_amount_cents + written_off_cents == denied_amount_cents
      at all times. record-outcome paired with reverse-outcome, and approve paired with rescind,
      are compensating action pairs: each pair MUST leave recovered_amount_cents (respectively
      written_off_cents) and open_balance_cents identical to their pre-pair values. A cascade
      that runs end-to-end but leaves drift in these fields violates the invariant.
    input_set: "single DenialCase"
    constants: {}
    precision: "integer cents, exact equality"

  - name: verified_fix_conservation
    trigger: "invariant checked after every verify / recurrence-reopen pair"
    algorithm: aggregation
    formula: |
      INVARIANT (count conservation on a DepartmentScorecard):
        verified_fix_count == number of RootCauseTasks of this department whose status is
        currently VERIFIED and whose verify event date falls in [period_start, period_end).
      verify (+1, and verified_linked_denied_cents += the task's denial's denied_amount_cents)
      paired with a recurrence reopen (-1, and the same cents subtracted) are compensating
      actions: the pair MUST leave verified_fix_count and verified_linked_denied_cents
      identical to their pre-pair values (recurrence_count and recurrence_linked_denied_cents
      accumulate separately and are NOT part of the conserved quantity).
    input_set: "single DepartmentScorecard and its department's RootCauseTasks"
    constants: {}
    precision: "integer count, exact equality"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules — the FIRST matching error is returned)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role in X-User-Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Request schema: required fields present, types/enum members valid, dates ISO format; billed_amount_cents >= denied_amount_cents > 0; level_number in 1..3; scorecard period_end_date > period_start_date; program end_date >= start_date"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 4
    category: existence
    check: "Path ids resolve left-to-right; body FK references (payer_id, remittance_code_id, denial_case_id, appeal_id, recurrence_of_task_id) resolve"
    error_id: "ERR_PAYER_NOT_FOUND / ERR_DENIAL_NOT_FOUND / ERR_APPEAL_NOT_FOUND / ERR_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 5
    category: state
    check: "OCC: expected_denial_case_version (when required by the endpoint) equals the denial's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rcm/denial-cases/{id}/assign, PATCH /rcm/denial-cases/{id}"

  - priority: 6
    category: state
    check: "State-machine from-state preconditions of the target resource (denial workable status, appeal/task/write-off/scorecard/program current state)"
    error_id: "ERR_DENIAL_INVALID_STATE / ERR_APPEAL_INVALID_STATE / ERR_TASK_INVALID_STATE / ERR_WRITE_OFF_NOT_PENDING / ERR_SCORECARD_NOT_OPEN / ERR_INVALID_STATE"
    http_status: 409
    applies_to: "all action endpoints and PATCH /rcm/payers/{id}, PATCH /rcm/denial-cases/{id}"

  - priority: 7
    category: business_temporal
    check: "Timely filing: appeal submit requires today <= next_appeal_deadline (date granularity); policy windows per (payer, level) must not overlap (half-open); program windows per department must not overlap (closed, touching conflicts); task close requires today > monitoring_until_date"
    error_id: "ERR_TIMELY_FILING_EXPIRED / ERR_POLICY_WINDOW_OVERLAP / ERR_PROGRAM_WINDOW_OVERLAP / ERR_MONITORING_WINDOW_ACTIVE"
    http_status: 422
    applies_to: "POST /rcm/appeals/{id}/submit (422), POST /rcm/payer-appeal-policies (409), POST /rcm/prevention-programs (409), POST /rcm/root-cause-tasks/{id}/close (409)"

  - priority: 8
    category: business_referential
    check: "Referenced-entity state: intake requires Payer.status == ACTIVE; appeal creation requires the denial's remittance code appealable == true; recurrence_of_task_id must reference a VERIFIED task in the same department (and never the task itself)"
    error_id: "ERR_PAYER_INACTIVE / ERR_CODE_NOT_APPEALABLE / ERR_INVALID_RECURRENCE_LINK"
    http_status: 409
    applies_to: "POST /rcm/denial-cases (409), POST /rcm/appeals (422), POST /rcm/root-cause-tasks (422)"

  - priority: 9
    category: business_safety
    check: "Segregation of duties and ownership: write-off approver must differ from requested_by_user_id; task verifier must differ from implemented_by_user_id; write-off revise allowed only to the original requester"
    error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_NOT_REQUEST_OWNER"
    http_status: 403
    applies_to: "POST /rcm/write-off-requests/{id}/approve, POST /rcm/root-cause-tasks/{id}/verify, POST /rcm/write-off-requests/{id}/revise"

  - priority: 10
    category: business_constraint
    check: "Uniqueness and progression: claim_number unique; at most one non-terminal appeal per denial; next appeal level must have an effective policy (else exhausted); required attachments subset satisfied at submit; outcome amount shape matches outcome kind; at most one pending write-off per denial; scorecard (department, period_start) unique"
    error_id: "ERR_DUPLICATE_CLAIM_NUMBER / ERR_APPEAL_ALREADY_ACTIVE / ERR_APPEAL_LEVEL_EXHAUSTED / ERR_ATTACHMENT_REQUIREMENT_UNMET / ERR_OUTCOME_AMOUNT_INCONSISTENT / ERR_WRITE_OFF_ALREADY_PENDING / ERR_DUPLICATE_SCORECARD_PERIOD"
    http_status: 409
    applies_to: "POST /rcm/denial-cases (409), POST /rcm/appeals (409/422), POST /rcm/appeals/{id}/submit (422), POST /rcm/appeals/{id}/record-outcome (422), POST /rcm/write-off-requests (409), POST /rcm/department-scorecards (409)"

  - priority: 11
    category: business_fiscal
    check: "Fiscal gates, evaluated in this sub-order: (a) requested_amount_cents <= WRITE_OFF_CEILING_CENTS; (b) requested_amount_cents <= denial.open_balance_cents (re-checked at approve); (c) manager-tier authority: approval_tier ESCALATED requires RevenueCycleDirector"
    error_id: "ERR_WRITE_OFF_EXCEEDS_CEILING / ERR_AMOUNT_EXCEEDS_OPEN_BALANCE / ERR_APPROVAL_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /rcm/write-off-requests (422 ceiling/balance), POST /rcm/write-off-requests/{id}/revise (422), POST /rcm/write-off-requests/{id}/approve (422 balance, 403 tier)"

# =============================================================================
# §1.5 API Endpoint Table (flat collections under /rcm)
# =============================================================================
endpoints:
  # --- Logical clock (test-driving; deterministic default) ---
  - method: POST
    path: "/rcm/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock triggers the timely-filing expiry sweep over DenialCases in created_at ASC order."
    roles: [RevenueCycleDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_denial_ids: array }
    side_effects: ["expiry sweep (QUEUED -> CLOSED_EXPIRED; IN_APPEAL with no appeal in {DRAFT, LETTER_GENERATED, SUBMITTED} -> CLOSED_EXPIRED)", "auto WriteOffRequest per expired denial", "scorecard expired_denial_count / auto_writeoff_request_count", "priority_score recompute for remaining workable denials"]

  # --- Payers ---
  - method: POST
    path: "/rcm/payers"
    description: "Create a payer"
    roles: [RevenueCycleDirector]
    code: 201
    input: [name, plan_type, default_timely_filing_days]
    output: Payer
    side_effects: ["status = ACTIVE; appeal_policy_review_required = false"]

  - method: GET
    path: "/rcm/payers"
    description: "List payers with optional filters"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["status?", "plan_type?", "limit?", "offset?"]
    output: "Payer[]"
    side_effects: []

  - method: GET
    path: "/rcm/payers/{id}"
    description: "Get a payer by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: Payer
    side_effects: []

  - method: PATCH
    path: "/rcm/payers/{id}"
    description: "Update payer default filing window or toggle status ACTIVE <-> INACTIVE"
    roles: [RevenueCycleDirector]
    code: 200
    input: ["default_timely_filing_days?", "status?"]
    output: Payer
    side_effects: ["status toggle drives the Payer state machine; increments Payer.version by 1"]

  # --- Payer appeal policies ---
  - method: POST
    path: "/rcm/payer-appeal-policies"
    description: "Create a payer appeal policy for (payer_id, level_number); half-open effective window must not overlap a same-(payer, level) window (adjacency allowed)"
    roles: [RevenueCycleDirector]
    code: 201
    input: [payer_id, level_number, timely_filing_days, "response_window_days?", "required_attachment_types?", effective_from, "effective_to?"]
    output: PayerAppealPolicy
    side_effects: []

  - method: GET
    path: "/rcm/payer-appeal-policies"
    description: "List policies; payer_id filter is the FK reverse lookup"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["payer_id?", "level_number?", "limit?", "offset?"]
    output: "PayerAppealPolicy[]"
    side_effects: []

  - method: GET
    path: "/rcm/payer-appeal-policies/{id}"
    description: "Get a policy by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: PayerAppealPolicy
    side_effects: []

  # --- Remittance codes ---
  - method: POST
    path: "/rcm/remittance-codes"
    description: "Register a remittance adjustment code"
    roles: [RevenueCycleDirector]
    code: 201
    input: [code, category, default_department, "appealable?", "description?"]
    output: RemittanceCode
    side_effects: []

  - method: GET
    path: "/rcm/remittance-codes"
    description: "List remittance codes"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["category?", "appealable?", "limit?", "offset?"]
    output: "RemittanceCode[]"
    side_effects: []

  # --- Denial cases ---
  - method: POST
    path: "/rcm/denial-cases"
    description: "Denial intake: record a remittance denial; category and level-1 deadline derived"
    roles: [DenialsSpecialist]
    code: 201
    input: [claim_number, patient_account_number, payer_id, remittance_code_id, billed_amount_cents, denied_amount_cents, service_date, remittance_received_date]
    output: DenialCase
    side_effects: ["status = RECEIVED; category copied from RemittanceCode; next_appeal_deadline per calculations.appeal_deadline_schedule level 1", "emit INTAKE event", "priority_score/queue_bucket computed (0.00/LOW while RECEIVED)"]

  - method: GET
    path: "/rcm/denial-cases"
    description: "List denials with filters (FK reverse lookups for payer_id and remittance_code_id)"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["payer_id?", "remittance_code_id?", "status?", "category?", "queue_bucket?", "assigned_specialist_id?", "root_cause_department?", "limit?", "offset?"]
    output: "DenialCase[]"
    side_effects: []

  - method: GET
    path: "/rcm/denial-cases/{id}"
    description: "Get a denial by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: DenialCase
    side_effects: []

  - method: PATCH
    path: "/rcm/denial-cases/{id}"
    description: "Correct intake fields while the denial is in RECEIVED or TRIAGED; OCC-guarded"
    roles: [DenialsManager]
    code: 200
    input: ["billed_amount_cents?", "denied_amount_cents?", "remittance_received_date?", expected_denial_case_version]
    output: DenialCase
    side_effects: ["open_balance_cents recomputed", "next_appeal_deadline recomputed when remittance_received_date changes", "priority_score recomputed", "emit INTAKE_CORRECTED event", "increments DenialCase.version by 1"]

  - method: POST
    path: "/rcm/denial-cases/{id}/triage"
    description: "Triage a RECEIVED denial: assign root-cause department, set preventable flag, auto-route upstream task, run recurrence sweep"
    roles: [DenialsSpecialist]
    code: 200
    input: [preventable_flag, "root_cause_department?"]
    output: DenialCase
    side_effects: ["RECEIVED -> TRIAGED", "scorecard denial/preventable counters", "auto RootCauseTask when preventable", "recurrence sweep (VERIFIED -> REOPENED on best-matching task)", "emit TRIAGED event", "increments DenialCase.version by 1"]

  - method: POST
    path: "/rcm/denial-cases/{id}/assign"
    description: "Assign (or reassign) a triaged denial to a specialist; moves TRIAGED -> QUEUED; OCC-guarded"
    roles: [DenialsManager]
    code: 200
    input: [specialist_id, expected_denial_case_version]
    output: DenialCase
    side_effects: ["TRIAGED -> QUEUED (first assignment); assigned_specialist_id set", "emit ASSIGNED event", "increments DenialCase.version by 1"]

  - method: GET
    path: "/rcm/denial-cases/{id}/recovery-projection"
    description: "Computed read: expected recovery under the gross or net variant (calculations.expected_recovery_value)"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["variant?"]
    output: { variant: string, expected_recovery_cents: integer, rate_applied: number, remaining_levels: integer }
    side_effects: []

  - method: GET
    path: "/rcm/work-queue"
    description: "Ranked work queue: DenialCases in QUEUED or IN_APPEAL, ordered priority_score DESC, then next_appeal_deadline ASC, then created_at ASC (deterministic; ids never used for ranking)"
    roles: [DenialsSpecialist, DenialsManager]
    code: 200
    input: ["assigned_specialist_id?", "queue_bucket?", "limit?", "offset?"]
    output: "DenialCase[]"
    side_effects: []

  # --- Appeals ---
  - method: POST
    path: "/rcm/appeals"
    description: "Open the next appeal level for a denial (level = current_appeal_level + 1)"
    roles: [DenialsSpecialist]
    code: 201
    input: [denial_case_id]
    output: Appeal
    side_effects: ["denial QUEUED -> IN_APPEAL on first appeal; current_appeal_level = level_number", "previous_appeal_id linked to the level-1..N-1 appeal", "emit APPEAL_CREATED event", "denial priority recomputed"]

  - method: GET
    path: "/rcm/appeals"
    description: "List appeals; denial_case_id and previous_appeal_id filters are FK reverse lookups"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["denial_case_id?", "previous_appeal_id?", "status?", "level_number?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/rcm/appeals/{id}"
    description: "Get an appeal by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/rcm/appeals/{id}/generate-letter"
    description: "Generate the appeal letter (DRAFT -> LETTER_GENERATED) including the ACTIVE attachment manifest"
    roles: [DenialsSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["letter_body composed; generated_at set", "emit LETTER_GENERATED event"]

  - method: POST
    path: "/rcm/appeals/{id}/revise"
    description: "Return a generated appeal to DRAFT for rework (clears letter_body)"
    roles: [DenialsSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["letter_body = null; generated_at = null"]

  - method: POST
    path: "/rcm/appeals/{id}/submit"
    description: "Submit the appeal to the payer; enforces timely filing and required clinical attachments"
    roles: [DenialsSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["LETTER_GENERATED -> SUBMITTED; submitted_at/response_due_date set", "emit APPEAL_SUBMITTED event", "increments parent DenialCase.version by 1"]

  - method: POST
    path: "/rcm/appeals/{id}/record-outcome"
    description: "Record the payer's decision (OVERTURNED | PARTIALLY_OVERTURNED | UPHELD) with recovered dollars"
    roles: [DenialsSpecialist]
    code: 200
    input: [outcome, recovered_amount_cents, "payer_response_code?"]
    output: Appeal
    side_effects: ["denial recovered_amount_cents / status / next_appeal_deadline cascade", "scorecard recovered_cents", "payer trailing overturn rate + review flag", "emit OUTCOME_RECORDED event"]

  - method: POST
    path: "/rcm/appeals/{id}/reverse-outcome"
    description: "Compliance correction: reverse a recorded outcome (compensating action restoring denial dollars)"
    roles: [ComplianceAuditor]
    code: 200
    input: [reason]
    output: Appeal
    side_effects: ["denial recovered_amount_cents -= outcome_amount_cents; status reverted per machine", "scorecard recovered_cents -= amount", "payer trailing rate recompute", "emit OUTCOME_REVERSED event"]

  - method: POST
    path: "/rcm/appeals/{id}/withdraw"
    description: "Withdraw a draft/generated appeal; recomputes denial current_appeal_level and may revert IN_APPEAL -> QUEUED"
    roles: [DenialsSpecialist]
    code: 200
    input: []
    output: Appeal
    side_effects: ["denial level/status recompute", "emit APPEAL_WITHDRAWN event"]

  # --- Appeal attachments ---
  - method: POST
    path: "/rcm/appeal-attachments"
    description: "Attach a clinical document to an appeal (appeal must be DRAFT or LETTER_GENERATED)"
    roles: [DenialsSpecialist]
    code: 201
    input: [appeal_id, document_type, file_reference]
    output: AppealAttachment
    side_effects: []

  - method: GET
    path: "/rcm/appeal-attachments"
    description: "List attachments; appeal_id filter is the FK reverse lookup"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["appeal_id?", "document_type?", "status?", "limit?", "offset?"]
    output: "AppealAttachment[]"
    side_effects: []

  - method: GET
    path: "/rcm/appeal-attachments/{id}"
    description: "Get an attachment by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: AppealAttachment
    side_effects: []

  - method: POST
    path: "/rcm/appeal-attachments/{id}/void"
    description: "Void an attachment (soft delete; excluded from submission requirements)"
    roles: [DenialsSpecialist]
    code: 200
    input: [reason]
    output: AppealAttachment
    side_effects: ["ACTIVE -> VOIDED; voided_reason stored"]

  # --- Root-cause tasks ---
  - method: POST
    path: "/rcm/root-cause-tasks"
    description: "Manually route an upstream fix task for a denial (auto-created tasks also exist via triage)"
    roles: [DenialsManager]
    code: 201
    input: [denial_case_id, task_type, description, due_date, "recurrence_of_task_id?"]
    output: RootCauseTask
    side_effects: ["department copied from denial.root_cause_department", "scorecard open_task_count += 1", "emit TASK_CREATED event"]

  - method: GET
    path: "/rcm/root-cause-tasks"
    description: "List tasks; denial_case_id and recurrence_of_task_id filters are FK reverse lookups"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["denial_case_id?", "department?", "status?", "recurrence_of_task_id?", "limit?", "offset?"]
    output: "RootCauseTask[]"
    side_effects: []

  - method: GET
    path: "/rcm/root-cause-tasks/{id}"
    description: "Get a task by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: RootCauseTask
    side_effects: []

  - method: POST
    path: "/rcm/root-cause-tasks/{id}/acknowledge"
    description: "Upstream department acknowledges the task (OPEN or REOPENED -> ACKNOWLEDGED)"
    roles: [UpstreamOwner]
    code: 200
    input: []
    output: RootCauseTask
    side_effects: []

  - method: POST
    path: "/rcm/root-cause-tasks/{id}/implement-fix"
    description: "Mark the upstream fix implemented (ACKNOWLEDGED -> FIX_IMPLEMENTED)"
    roles: [UpstreamOwner]
    code: 200
    input: [fix_summary]
    output: RootCauseTask
    side_effects: ["implemented_by_user_id = X-User-ID; fix_summary stored"]

  - method: POST
    path: "/rcm/root-cause-tasks/{id}/verify"
    description: "Denials manager verifies the fix (FIX_IMPLEMENTED -> VERIFIED); verifier must differ from implementer"
    roles: [DenialsManager]
    code: 200
    input: []
    output: RootCauseTask
    side_effects: ["verified_at set; monitoring_until_date = verified date + 90 days", "scorecard verified_fix_count/verified_linked_denied_cents/open_task_count", "emit TASK_VERIFIED event"]

  - method: POST
    path: "/rcm/root-cause-tasks/{id}/close"
    description: "Close a verified task after its monitoring window has fully elapsed"
    roles: [DenialsManager]
    code: 200
    input: []
    output: RootCauseTask
    side_effects: []

  # --- Write-off requests ---
  - method: POST
    path: "/rcm/write-off-requests"
    description: "Request a write-off against a denial's open balance; tier/status derived per calculations.writeoff_net_exposure"
    roles: [DenialsSpecialist]
    code: 201
    input: [denial_case_id, requested_amount_cents, reason_code]
    output: WriteOffRequest
    side_effects: ["approval_tier + projected_recovery_cents + recommended_writeoff_cents computed", "status = PENDING_MANAGER or ESCALATED_DIRECTOR", "emit WRITE_OFF_REQUESTED event"]

  - method: GET
    path: "/rcm/write-off-requests"
    description: "List write-off requests; denial_case_id filter is the FK reverse lookup"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["denial_case_id?", "status?", "limit?", "offset?"]
    output: "WriteOffRequest[]"
    side_effects: []

  - method: GET
    path: "/rcm/write-off-requests/{id}"
    description: "Get a write-off request by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: WriteOffRequest
    side_effects: []

  - method: POST
    path: "/rcm/write-off-requests/{id}/approve"
    description: "Approve a pending request (manager tier or director for escalated); segregation of duties enforced"
    roles: [DenialsManager, RevenueCycleDirector]
    code: 200
    input: []
    output: WriteOffRequest
    side_effects: ["denial.written_off_cents += amount; denial may transition to RESOLVED_WRITTEN_OFF", "scorecard written_off_cents += amount", "emit WRITE_OFF_APPROVED event"]

  - method: POST
    path: "/rcm/write-off-requests/{id}/reject"
    description: "Reject a pending request with a reason"
    roles: [DenialsManager, RevenueCycleDirector]
    code: 200
    input: [reason]
    output: WriteOffRequest
    side_effects: ["emit WRITE_OFF_REJECTED event"]

  - method: POST
    path: "/rcm/write-off-requests/{id}/revise"
    description: "Requester revises a rejected request with a new amount (re-enters the approval pipeline, tier recomputed)"
    roles: [DenialsSpecialist]
    code: 200
    input: [requested_amount_cents]
    output: WriteOffRequest
    side_effects: ["tier/projection recomputed; status PENDING_MANAGER or ESCALATED_DIRECTOR", "emit WRITE_OFF_REVISED event"]

  - method: POST
    path: "/rcm/write-off-requests/{id}/rescind"
    description: "Director rescinds an approved write-off (compensating action restoring denial balance and prior status)"
    roles: [RevenueCycleDirector]
    code: 200
    input: [reason]
    output: WriteOffRequest
    side_effects: ["denial.written_off_cents -= amount; denial status restored from denial_status_before", "scorecard written_off_cents -= amount", "emit WRITE_OFF_RESCINDED event"]

  # --- Department scorecards ---
  - method: POST
    path: "/rcm/department-scorecards"
    description: "Open a prevention scorecard for a department and period; counters accumulate while OPEN"
    roles: [RevenueCycleDirector]
    code: 201
    input: [department, period_start_date, period_end_date]
    output: DepartmentScorecard
    side_effects: []

  - method: GET
    path: "/rcm/department-scorecards"
    description: "List scorecards"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["department?", "status?", "limit?", "offset?"]
    output: "DepartmentScorecard[]"
    side_effects: []

  - method: GET
    path: "/rcm/department-scorecards/{id}"
    description: "Get a scorecard by id (OPEN scorecards return live counters with null scores)"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: DepartmentScorecard
    side_effects: []

  - method: POST
    path: "/rcm/department-scorecards/{id}/finalize"
    description: "Freeze the period and compute both prevention-score variants and the tier"
    roles: [RevenueCycleDirector]
    code: 200
    input: []
    output: DepartmentScorecard
    side_effects: ["prevention_score_incidence/prevention_score_financial/score_tier computed; counters frozen"]

  # --- Prevention programs ---
  - method: POST
    path: "/rcm/prevention-programs"
    description: "Create a prevention program for a department; closed windows must not overlap (touching endpoints conflict)"
    roles: [RevenueCycleDirector]
    code: 201
    input: [department, name, start_date, end_date, target_reduction_pct]
    output: PreventionProgram
    side_effects: []

  - method: GET
    path: "/rcm/prevention-programs"
    description: "List prevention programs"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["department?", "status?", "limit?", "offset?"]
    output: "PreventionProgram[]"
    side_effects: []

  - method: GET
    path: "/rcm/prevention-programs/{id}"
    description: "Get a prevention program by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: PreventionProgram
    side_effects: []

  - method: POST
    path: "/rcm/prevention-programs/{id}/activate"
    description: "Activate a planned program (PLANNED -> ACTIVE)"
    roles: [RevenueCycleDirector]
    code: 200
    input: []
    output: PreventionProgram
    side_effects: []

  - method: POST
    path: "/rcm/prevention-programs/{id}/complete"
    description: "Complete an active program (ACTIVE -> COMPLETED)"
    roles: [RevenueCycleDirector]
    code: 200
    input: []
    output: PreventionProgram
    side_effects: []

  # --- Analytics ---
  - method: GET
    path: "/rcm/analytics/overturn-rates"
    description: "Overturn-rate analytics grouped by payer or category; totals row pooled from raw counts (rounding order pinned in calculations.overturn_rate_report)"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: [group_by, "from_date?", "to_date?", "limit?", "offset?"]
    output: { group_by: string, rows: array, totals: object }
    side_effects: []

  # --- Audit events ---
  - method: GET
    path: "/rcm/denial-events"
    description: "List audit events; denial_case_id filter is the FK reverse lookup"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: ["denial_case_id?", "event_type?", "limit?", "offset?"]
    output: "DenialEvent[]"
    side_effects: []

  - method: GET
    path: "/rcm/denial-events/{id}"
    description: "Get a single audit event by id"
    roles: [DenialsSpecialist, DenialsManager, RevenueCycleDirector, UpstreamOwner, ComplianceAuditor]
    code: 200
    input: []
    output: DenialEvent
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing, or role not one of the five declared roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid type/enum/date format, denied > billed, level_number outside 1..3, or inverted date range" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist (policy, remittance code, attachment, task, write-off, scorecard, program, event)" }
  - { id: ERR_PAYER_NOT_FOUND, http: 404, condition: "Referenced payer id does not exist" }
  - { id: ERR_DENIAL_NOT_FOUND, http: 404, condition: "Referenced denial id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Referenced appeal id does not exist" }
  - { id: ERR_DENIAL_INVALID_STATE, http: 409, condition: "DenialCase not in a from-state allowed for the attempted transition (incl. approve against a RESOLVED_PAID denial)" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Appeal not in a from-state allowed for the attempted transition (incl. void of an attachment on a submitted appeal)" }
  - { id: ERR_TASK_INVALID_STATE, http: 409, condition: "RootCauseTask not in a from-state allowed for the attempted transition" }
  - { id: ERR_WRITE_OFF_NOT_PENDING, http: 409, condition: "WriteOffRequest not in PENDING_MANAGER/ESCALATED_DIRECTOR for decide actions, not REJECTED for revise, not APPROVED for rescind" }
  - { id: ERR_SCORECARD_NOT_OPEN, http: 409, condition: "DepartmentScorecard already FINALIZED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Payer toggle or PreventionProgram transition attempted from a disallowed state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_denial_case_version does not match the denial's current version (OCC)" }
  - { id: ERR_TIMELY_FILING_EXPIRED, http: 422, condition: "Appeal submission date is after the denial's next_appeal_deadline (date granularity)" }
  - { id: ERR_POLICY_WINDOW_OVERLAP, http: 409, condition: "New policy's half-open [effective_from, effective_to) window overlaps an existing window for the same (payer_id, level_number); adjacency is allowed" }
  - { id: ERR_PROGRAM_WINDOW_OVERLAP, http: 409, condition: "New program's closed [start_date, end_date] window overlaps or touches an existing window for the same department" }
  - { id: ERR_MONITORING_WINDOW_ACTIVE, http: 409, condition: "Task close attempted while today <= monitoring_until_date" }
  - { id: ERR_PAYER_INACTIVE, http: 409, condition: "Denial intake references a payer with status INACTIVE" }
  - { id: ERR_CODE_NOT_APPEALABLE, http: 422, condition: "Appeal creation for a denial whose remittance code has appealable = false" }
  - { id: ERR_INVALID_RECURRENCE_LINK, http: 422, condition: "recurrence_of_task_id missing, self-referential, not VERIFIED, or in a different department" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver equals requested_by_user_id (write-off) or verifier equals implemented_by_user_id (task)" }
  - { id: ERR_NOT_REQUEST_OWNER, http: 403, condition: "Write-off revise attempted by a user other than requested_by_user_id" }
  - { id: ERR_DUPLICATE_CLAIM_NUMBER, http: 409, condition: "claim_number already exists" }
  - { id: ERR_APPEAL_ALREADY_ACTIVE, http: 409, condition: "Denial already has an appeal in DRAFT, LETTER_GENERATED, or SUBMITTED" }
  - { id: ERR_APPEAL_LEVEL_EXHAUSTED, http: 422, condition: "No effective PayerAppealPolicy covers the next level (or next level > MAX_APPEAL_LEVEL 3) for this payer" }
  - { id: ERR_ATTACHMENT_REQUIREMENT_UNMET, http: 422, condition: "Effective policy's required_attachment_types not a subset of the appeal's ACTIVE attachment types at submit" }
  - { id: ERR_OUTCOME_AMOUNT_INCONSISTENT, http: 422, condition: "UPHELD requires recovered 0; PARTIALLY_OVERTURNED requires 0 < recovered < open balance; OVERTURNED requires recovered == open balance" }
  - { id: ERR_WRITE_OFF_ALREADY_PENDING, http: 409, condition: "Denial already has a WriteOffRequest in PENDING_MANAGER or ESCALATED_DIRECTOR" }
  - { id: ERR_DUPLICATE_SCORECARD_PERIOD, http: 409, condition: "A scorecard already exists for (department, period_start_date)" }
  - { id: ERR_WRITE_OFF_EXCEEDS_CEILING, http: 422, condition: "requested_amount_cents > WRITE_OFF_CEILING_CENTS (10000000); checked before the open-balance gate" }
  - { id: ERR_AMOUNT_EXCEEDS_OPEN_BALANCE, http: 422, condition: "requested_amount_cents > denial.open_balance_cents at create, revise, or approve time" }
  - { id: ERR_APPROVAL_LIMIT_EXCEEDED, http: 403, condition: "Manager-tier actor approving an ESCALATED-tier request (requested_amount_cents > 2500000); directors may approve any tier" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque: X-User-ID is an operator identifier,
# never required to equal any entity id; SoD compares user-id strings)
# =============================================================================
roles:
  - name: DenialsSpecialist
    description: "Works the denial queue: intake, triage, appeals, attachments, outcomes, write-off requests"
    identity: "opaque"
    exclusive_operations:
      - "POST /rcm/denial-cases"
      - "POST /rcm/denial-cases/{id}/triage"
      - "POST /rcm/appeals* (create, generate-letter, revise, submit, record-outcome, withdraw)"
      - "POST /rcm/appeal-attachments* (create, void)"
      - "POST /rcm/write-off-requests (create, revise)"
    shared_operations:
      - "All GET endpoints"

  - name: DenialsManager
    description: "Queue assignment, intake correction, task verification, first-tier write-off decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /rcm/denial-cases/{id}/assign"
      - "PATCH /rcm/denial-cases/{id}"
      - "POST /rcm/root-cause-tasks (create, verify, close)"
    shared_operations:
      - "POST /rcm/write-off-requests/{id}/approve and /reject (STANDARD tier shared with RevenueCycleDirector)"
      - "GET /rcm/work-queue (shared with DenialsSpecialist)"
      - "All GET endpoints"

  - name: RevenueCycleDirector
    description: "Payer/policy/catalog administration, scorecard governance, escalated write-off authority, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST/PATCH /rcm/payers*"
      - "POST /rcm/payer-appeal-policies"
      - "POST /rcm/remittance-codes"
      - "POST /rcm/department-scorecards (create, finalize)"
      - "POST /rcm/prevention-programs (create, activate, complete)"
      - "POST /rcm/write-off-requests/{id}/rescind"
      - "POST /rcm/_clock/set_current_utc"
    shared_operations:
      - "POST /rcm/write-off-requests/{id}/approve and /reject (any tier; ESCALATED tier is director-only)"
      - "All GET endpoints"

  - name: UpstreamOwner
    description: "Upstream department fix owner (registration/authorization/coding): acknowledges and implements root-cause fixes"
    identity: "opaque"
    exclusive_operations:
      - "POST /rcm/root-cause-tasks/{id}/acknowledge"
      - "POST /rcm/root-cause-tasks/{id}/implement-fix"
    shared_operations:
      - "All GET endpoints"

  - name: ComplianceAuditor
    description: "Independent assurance: reverses mis-recorded appeal outcomes; otherwise read-only"
    identity: "opaque"
    exclusive_operations:
      - "POST /rcm/appeals/{id}/reverse-outcome"
    shared_operations:
      - "All GET endpoints"

