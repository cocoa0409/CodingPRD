              as: InventoryManager
              captures: { p_oil: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 1000, harvest_date: "2026-01-01T00:00:00Z" }
              as: InventoryManager
              captures: { fa_id: $.data.id }
            - call: "POST /api/fusti"
              payload: { product_id: "${p_oil}", capacity_ml: 10000, initial_volume_ml: 10000, reorder_point_ml: 1000, harvest_date: "2026-06-01T00:00:00Z" }
              as: InventoryManager
              captures: { fb_id: $.data.id }
            - call: "POST /api/orders"
              payload: { lines: [ { line_type: "REFILL", product_id: "${p_oil}", quantity: 1, volume_ml: 500 } ] }
              as: Customer
              as_user_id: "${m_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${o_id}/pay"
              payload: { expected_order_version: "${o_v}" }
              as: Customer
              as_user_id: "${m_id}"
          assert:
            - "Fusti.${fa_id}.reserved_volume_ml == 500"
            - "Fusti.${fb_id}.reserved_volume_ml == 0"

  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_reflects_state
        claim_type: immediate
        grounds: [entities.Product.sku]
        distinguishing_aspect: "A product read immediately after creation reflects the written sku and product_type in the same session (immediate consistency)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "COR-IMM", name: "Immediate", product_type: "ACCESSORY", unit_price_cents: 700 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /api/products/${p_id}"
              payload: {}
              as: Customer
              as_user_id: "any"
              captures: { sku_read: $.data.sku }
          assert:
            - "Product.${p_id}.sku == COR-IMM"
            - "Product.${p_id}.product_type == ACCESSORY"
