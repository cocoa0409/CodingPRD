            - call: "GET /eis-alerts/${alert_id}"
              payload: {}
              as: IACommander
              as_user_id: "${sup_id}"
              captures: { alert_v2: $.data.version, alert_status_escalated: $.data.status }
          trigger:
            - call: "POST /eis-alerts/${alert_id}/intervention-plans"
              payload: { expected_alert_version: "${alert_v2}", supervisor_officer_id: "${sup_id}", required_checkin_count: 3, duration_days: 60, interventions: ["PEER_REVIEW", "EAP_REFERRAL"] }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { plan2_id: $.data.id, plan2_status: $.data.status }
          assert:
            - "${alert_status_initial} == PLAN_REQUIRED"
            - "${alert_score} == 63.75"
            - "${ci1_on_time} == true"
            - "${missed_count} == 1"
            - "${plan1_score} == 50.00"
            - "${plan1_status} == ESCALATED"
            - "${alert_status_escalated} == ESCALATED"
            - "${plan2_status} == DRAFT"
            - "EarlyInterventionAlert.${alert_id}.status == PLAN_REQUIRED"
            - "EarlyInterventionAlert.${alert_id}.plan_count == 2"
            - "Officer.${subj_id}.intervention_escalation_count == 1"
            - "Officer.${subj_id}.eis_alert_level == CRITICAL (ALERT raised one band by the escalation)"
            - "Officer.${subj_id}.open_alert_count == 1 (the escalation and the re-plan neither closed nor duplicated the alert)"
            - "MonitoringCheckIn.${ci2_id}.status == MISSED and MonitoringCheckIn.${ci2_id}.on_time is null"
            - "InterventionPlan.${plan1_id}.on_time_checkin_count == 1 and InterventionPlan.${plan1_id}.completed_checkin_count == 1"

      - name: officer_employment_and_risk_dimensions_advance_independently
        grounds:
          - state_machines.Officer.ACTIVE_to_RELIEVED_OF_DUTY
          - entities.Officer.fields.employment_status
          - entities.Officer.fields.eis_alert_level
          - entities.Officer.fields.eis_score
          - endpoints["POST /eis-runs"]
        distinguishing_aspect: |
          The Officer carries two independent state dimensions: relieving the officer of duty
          leaves the risk dimension untouched at CRITICAL, a later event ingest still rescores the
          relieved officer to 83.75, and a department-wide EIS run then skips that officer
          entirely because the sweep only visits ACTIVE officers, reporting
          evaluated_officer_count 1.
        test_recipe:
          setup:
            - "A single PATROL_DIVISION unit holds two officers: Officer Kerr (the subject) and Officer Nash, both initially ACTIVE."
            - "Officer Kerr has six in-window events - USE_OF_FORCE LEVEL_2 2026-06-01, LEVEL_1 2026-06-15, LEVEL_3 2026-07-01, LEVEL_3 2026-07-25, PURSUIT 2026-07-10 and PURSUIT 2026-07-20 - giving weighted_total 23.5 and composite_score 78.75, band CRITICAL."
            - "Officer Nash has no events at all."
            - "Officer Kerr is then relieved of duty on the employment dimension."
            - "The logical clock stands at 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Patrol East", unit_role: "PATROL_DIVISION", command_code: "PE", peer_group_code: "PG_EAST", sworn_headcount: 25, intake_enabled: true }
              as: SystemAdmin
              captures: { east_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${east_unit_id}", badge_number: "PE-401", full_name: "Officer Kerr", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_B", hire_date: "2018-04-02T00:00:00Z" }
              as: SystemAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${east_unit_id}", badge_number: "PE-402", full_name: "Officer Nash", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9000000, demographic_code: "DG_A", hire_date: "2018-04-02T00:00:00Z" }
              as: SystemAdmin
              captures: { other_id: $.data.id }
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-06-01T00:00:00Z", source_reference: "K-1" }
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-06-15T00:00:00Z", source_reference: "K-2" }
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T00:00:00Z", source_reference: "K-3" }
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-10T00:00:00Z", source_reference: "K-4" }
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-20T00:00:00Z", source_reference: "K-5" }
              as: SystemAdmin
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-25T00:00:00Z", source_reference: "K-6" }
              as: SystemAdmin
              captures: { last_event_id: $.data.id }
            - call: "GET /officers/${subj_id}"
              payload: {}
              as: SystemAdmin
              captures: { score_before_relief: $.data.eis_score, level_before_relief: $.data.eis_alert_level }
          trigger:
            - call: "POST /officers/${subj_id}/employment-status"
              payload: { employment_status: "RELIEVED_OF_DUTY", reason: "Pending administrative review." }
              as: SystemAdmin
              captures: { status_after_relief: $.data.employment_status, score_after_relief: $.data.eis_score, level_after_relief: $.data.eis_alert_level }
            - call: "POST /officers/${subj_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-28T00:00:00Z", source_reference: "K-7" }
              as: SystemAdmin
            - call: "POST /eis-runs"
              payload: {}
              as: SystemAdmin
              captures: { evaluated: $.data.evaluated_officer_count }
          assert:
            - "${score_before_relief} == 78.75"
            - "${level_before_relief} == CRITICAL"
            - "${status_after_relief} == RELIEVED_OF_DUTY"
            - "${score_after_relief} == 78.75 (the employment transition does not disturb the risk dimension)"
            - "${level_after_relief} == CRITICAL"
            - "Officer.${subj_id}.eis_score == 83.75 after the seventh event, because a direct ingest rescores the officer regardless of employment_status"
            - "Officer.${subj_id}.eis_alert_level == CRITICAL"
            - "${evaluated} == 1 (only Officer Nash is ACTIVE, so the department-wide run skips the relieved officer)"
            - "Officer.${subj_id}.employment_status == RELIEVED_OF_DUTY after the EIS run"
            - "Officer.${subj_id}.suspension_end_date is null and Officer.${subj_id}.imposed_suspension_days_total == 0"
            - "Officer.${other_id}.eis_score == 0.00 and Officer.${other_id}.eis_alert_level == NONE"

  - rule_id: transitive_cascade
    instances:
      - name: untruthfulness_sustained_fires_five_link_cascade
        grounds:
          - state_machines.Allegation.PENDING_to_SUSTAINED
          - calculations.discipline_matrix
          - calculations.eis_composite_score
          - calculations.retention_expiry_evaluation
          - entities.CredibilityDisclosure.fields.permanent_retention
          - entities.Officer.fields.credibility_disclosure_active
          - entities.EarlyInterventionAlert.fields.trigger_source
        distinguishing_aspect: |
          One SUSTAINED disposition of an UNTRUTHFULNESS allegation propagates through five
          entities in a single request - a PROPOSED Discipline with presumptive_days 30, the
          complaint's sustained_allegation_count, a COMPLAINT_SUSTAINED activity event that
          rescores the officer from 28.75 to 38.75 and thereby crosses into WATCH, an
          EarlyInterventionAlert with trigger_source DISPOSITION_CASCADE, and an ACTIVE
          CredibilityDisclosure with permanent_retention true - and a NOT_SUSTAINED disposition on
          the same fixture fires none of them.
        test_recipe:
          setup:
            - "Officer Vance already carries two in-window events: USE_OF_FORCE LEVEL_3 on 2026-07-01 and USE_OF_FORCE LEVEL_2 on 2026-07-05, a weighted total of 10.5 and a score of 26.25 in band NONE, so no alert exists yet."
            - "A CLASS_I complaint received at 2026-08-01T00:00:00Z carries one offense_class A UNTRUTHFULNESS allegation against him; attaching the allegation appended a COMPLAINT_INTAKE event and lifted the score to 28.75, still in band NONE."
            - "The investigation is assigned, one interview has been held and findings give evidence_weight_for 60 against 40, so preponderance_met is true."
            - "The logical clock stands at 2026-08-05T09:00:00Z when the disposition is entered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 14000000, demographic_code: "DG_A", hire_date: "2008-03-01T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 11000000, demographic_code: "DG_B", hire_date: "2014-05-12T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 3 }
              as: SystemAdmin
