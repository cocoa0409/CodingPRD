              as: HrAdmin
              captures: { ev1_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Noor Haddad" }
              as: HrAdmin
              captures: { ev2_id: $.data.id }
            - call: "POST /calibration-reviews"
              payload: { evaluator_id: "${ev1_id}", anchor_lesson_code: "ANCH-1", anchor_score: 3.00, evaluator_score: 3.10 }
              as: HrAdmin
              captures: { cal1_id: $.data.id }
