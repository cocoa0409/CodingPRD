      - name: field_boundary_overlap_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_FIELD_BOUNDARY_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / field_boundary_rectangles_touch_versus_intrude
          rationale: "The named §1.8 instance contrasts edge-touching and corner-touching acceptances against a one-unit interior intrusion refusal."

      - name: commitment_period_overlap_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_COMMITMENT_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / commitment_period_half_open_interval_adjacency
          rationale: "The named §1.8 instance asserts the half-open interval semantics at the exact adjacency year and one year inside it."

      - name: additionality_ceiling_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_ADDITIONALITY_FAILED]
          - errors[ERR_INSUFFICIENT_PRACTICE_HISTORY]
        excluded_because:
          difficulty_instance: boundary_precision_check / additionality_ceiling_inclusive_at_20_00_and_rejected_at_20_10
          rationale: "The named §1.8 instance asserts the inclusive ceiling at 20.00 and the refusal at 20.10, and its sibling instance covers the history-gate cascade order."

      - name: qc_pass_threshold_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_QC_SCORE_BELOW_THRESHOLD]
        excluded_because:
          difficulty_instance: boundary_precision_check / qc_pass_threshold_inclusive_at_70_00_and_refused_at_69_50
          rationale: "The named §1.8 instance asserts the inclusive PASS at exactly 70.00 and the refusal at 69.50."

      - name: duplicate_enrollment_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors[ERR_DUPLICATE_ENROLLMENT]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / run_creation_gated_on_baseline_status_and_ownership
          rationale: "The named §1.8 instance already drives the non-terminal (field_id, practice_code) uniqueness refusal while composing its ownership axis."

      - name: practice_cooldown_violation
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_PRACTICE_COOLDOWN_ACTIVE]
        excluded_because:
          difficulty_instance: compensating_invariant / termination_conserves_acres_and_cents_across_void_and_exit_fee
          rationale: "The named §1.8 instance terminates an enrollment and then asserts the two-crop-year cooldown on re-enrolling the same field in the same practice."

      - name: verification_body_accreditation_and_suspension_violations
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - validations[priority=20]
