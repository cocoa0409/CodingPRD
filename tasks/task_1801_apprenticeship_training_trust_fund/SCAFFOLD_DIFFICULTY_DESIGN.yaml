              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /contribution-reports/${rep1_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
