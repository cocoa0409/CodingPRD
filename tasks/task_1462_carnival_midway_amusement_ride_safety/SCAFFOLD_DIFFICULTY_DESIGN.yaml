            - { call: "POST /midway/staff", payload: { fair_id: "${fair_id}", full_name: "Crew S", functions: ["CREW"] }, as: FairManager, as_user_id: "${sup_id}", captures: { crew_id: "$.data.id", crew_v: "$.data.version" } }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp S1", license_number: "LIC-I1-1" }, as: StateProgramAdmin }
            - { call: "POST /midway/inspectors", payload: { full_name: "Insp S2", license_number: "LIC-I1-2" }, as: StateProgramAdmin, captures: { insp2_id: "$.data.id" } }
            - { call: "POST /midway/rides", payload: { fair_id: "${fair_id}", name: "Coaster", manufacturer: "MFG", model: "X1", serial_number: "SN-I1-1", ride_class: "THRILL", capacity_per_cycle: 4, min_rider_height_in: 48, max_rider_height_in: 80, wind_limit_mph: 30, cycle_inspection_interval: 5, annual_cert_expires_on: "2026-12-31" }, as: FairManager, as_user_id: "${sup_id}", captures: { ride_id: "$.data.id" } }
            - { call: "POST /midway/crew-shifts", payload: { staff_id: "${crew_id}", work_date: "2026-08-01", start_hour: 6, end_hour: 10, shift_role: "SETUP", expected_staff_version: "${crew_v}" }, as: FairManager, as_user_id: "${sup_id}" }
            - { call: "POST /midway/rides/${ride_id}/verify-assembly", payload: {}, as: CrewMember, as_user_id: "${crew_id}" }
            - { call: "POST /midway/fairs/${fair_id}/request-permit", payload: {}, as: FairManager, as_user_id: "${sup_id}", captures: { permit_id: "$.data.id" } }
            - { call: "POST /midway/inspection-appointments", payload: { fair_id: "${fair_id}", scope: "FAIR_WIDE", scheduled_date: "2026-08-02", start_hour: 9, duration_hours: 2 }, as: FairManager, as_user_id: "${sup_id}", captures: { appt_id: "$.data.id", appt_insp: "$.data.inspector_id" } }
