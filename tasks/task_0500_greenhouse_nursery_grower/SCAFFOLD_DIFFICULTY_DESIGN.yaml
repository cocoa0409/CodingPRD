  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # --- Instance 1: zone fill_state free_units boundary on transplant -----
      - name: zone_fill_tight_boundary_free_units_equals_threshold
        grounds:
          - calculations.zone_fill_state
          - state_machines.PropagationBatch.PLANNED_to_GROWING
          - entities.Zone.fields.fill_state
        distinguishing_aspect: |
          Metric = zone.free_units threshold (endpoint: transplant). capacity=2000,
          floor(2000*0.15)=300. A transplant leaving free_units exactly 300 yields
          fill_state == TIGHT (<=, not <); leaving 301 yields OPEN. This pins the
          inclusive boundary at the threshold value.
        test_recipe:
          setup:
            - "Zone capacity=2000, footprint=1. Batch sourced=1700, transplant started=1700 leaves free 2000-1700=300 -> TIGHT (boundary)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Begonia L", cultivar_code: "BEGL1", propagation_form: "PLUG", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.50, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH6 A", climate_class: "MIXED", capacity_units: 2000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 1700 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
          trigger:
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 1700, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { fs: $.data.fill_state, fu: $.data.free_units }
          assert:
            - "Zone.${zone_id}.free_units == 300 after transplant (2000 - 1700)"
            - "Zone.${zone_id}.fill_state == TIGHT (free_units == floor(2000*0.15) == 300 is inclusive TIGHT, <=)"
            - "Zone.${zone_id}.occupied_units == 1700 and reserved_units == 0"

      # --- Instance 2: auto-cull shrink_pct >= 0.50 boundary on input-logs ---
      - name: scouting_autocull_boundary_shrink_pct_equals_half
        grounds:
          - calculations.scouting_shrink
          - state_machines.PropagationBatch.GROWING_to_CULLED
          - entities.PropagationBatch.fields.cull_count
        distinguishing_aspect: |
          Metric = cumulative shrink fraction (endpoint: input-logs), a DIFFERENT
          metric and endpoint than the zone free_units boundary. started=1000,
          cumulative dead reaching exactly 500 makes shrink_pct == 0.50 which
          triggers auto-cull (>=, inclusive); a run that only reaches 499 (0.499)
          does NOT auto-cull.
        test_recipe:
          setup:
            - "GROWING batch started=1000, footprint=1. Prior SCOUTING dead 300 (live 700). A second SCOUTING dead 200 brings cumulative cull to 500 == 0.50 -> auto-cull."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
