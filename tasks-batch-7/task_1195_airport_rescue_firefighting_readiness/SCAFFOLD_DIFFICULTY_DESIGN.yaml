  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # (state x business_safety vs business_temporal x business_constraint)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pp_respond_state_beats_index_safety
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - state_machines.AlertIncident.REPORTED_to_RESPONDING
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the incident is CONTROLLED (state
          precondition violated) AND effective_index A is below the ALERT_3 requirement C
          (safety gate violated); the state error ERR_INCIDENT_NOT_OPEN (priority 4) must
          win over ERR_INDEX_INSUFFICIENT_FOR_ALERT (priority 5).
        test_recipe:
          setup:
            - "Compliant index-C airport; ALERT_3 incident responded (C >= C) then controlled"
            - "RED-1 placed out of service so effective_index drops to A (below the ALERT_3 requirement of C)"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
