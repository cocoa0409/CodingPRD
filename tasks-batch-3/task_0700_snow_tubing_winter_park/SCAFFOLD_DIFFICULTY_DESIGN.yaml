            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /equipment-rentals"
              payload: { ticket_id: "${ticket_id}", equipment_type: "TUBE", tube_size: "MEDIUM" }
              as: SafetyMarshal
            - call: "POST /tickets/${ticket_id}/gear-up"
              payload: {}
              as: SafetyMarshal
            - call: "POST /lanes/${lane1_id}/groom"
              payload: {}
              as: ParkOperator
          trigger:
            - call: "POST /tickets/${ticket_id}/board"
              payload: { lane_id: "${lane1_id}", boarded_at: "2026-03-15T10:40:00Z" }
              as: SafetyMarshal
              captures: { err: $.data.error_id }
          assert:
            - "Lane.${lane1_id}.status == GROOMING"
            - "response error_id == ERR_INVALID_STATE"
            - "SessionTicket.${ticket_id}.checkin_state == GEARED_UP"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: conveyor_turn_overlap_rejected_half_open_on_lane
        grounds:
          - validations[priority=11]
          - calculations.turn_clearance_time
          - entities.ConveyorTurn.fields.cleared_at
        distinguishing_aspect: "Half-open point-interval overlap on a Lane (ConveyorTurn): a second board whose boarded_at falls strictly inside [boarded_at, cleared_at) of an existing BOARDED turn (10:30:15 inside [10:30:00,10:30:30)) is rejected with ERR_LANE_TURN_OVERLAP."
        test_recipe:
          setup:
            - "OPEN park, one OPEN lane cap 5 cycle 30s, ACTIVE block, two GEARED_UP tickets with TUBEs; first boarded at 10:30:00 (clears 10:30:30)."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Overlap", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-16T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Ova", zip_code: "40001", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Lap", zip_code: "40002", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { p2_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-16T10:00:00Z", ends_at: "2026-03-16T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${p1_id}", park_id: "${park_id}", signed_at: "2026-03-16T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${p1_id}"
            - call: "POST /waivers"
              payload: { patron_id: "${p2_id}", park_id: "${park_id}", signed_at: "2026-03-16T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${p2_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${p1_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${p1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${p2_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${p2_id}"
              captures: { t2_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${p1_id}"
              captures: { tb_v0: $.data.version }
            - call: "POST /tickets/${t1_id}/confirm"
              payload: { expected_time_block_version: "${tb_v0}" }
              as: GuestPatron
              as_user_id: "${p1_id}"
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${p2_id}"
              captures: { tb_v1: $.data.version }
            - call: "POST /tickets/${t2_id}/confirm"
              payload: { expected_time_block_version: "${tb_v1}" }
              as: GuestPatron
              as_user_id: "${p2_id}"
            - call: "POST /equipment-rentals"
              payload: { ticket_id: "${t1_id}", equipment_type: "TUBE", tube_size: "MEDIUM" }
              as: SafetyMarshal
            - call: "POST /equipment-rentals"
              payload: { ticket_id: "${t2_id}", equipment_type: "TUBE", tube_size: "MEDIUM" }
              as: SafetyMarshal
            - call: "POST /tickets/${t1_id}/gear-up"
              payload: {}
              as: SafetyMarshal
            - call: "POST /tickets/${t2_id}/gear-up"
              payload: {}
              as: SafetyMarshal
            - call: "POST /tickets/${t1_id}/board"
              payload: { lane_id: "${lane_id}", boarded_at: "2026-03-16T10:30:00Z" }
              as: SafetyMarshal
          trigger:
            - call: "POST /tickets/${t2_id}/board"
              payload: { lane_id: "${lane_id}", boarded_at: "2026-03-16T10:30:15Z" }
              as: SafetyMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_LANE_TURN_OVERLAP"
            - "response status == 409"
            - "SessionTicket.${t2_id}.checkin_state == GEARED_UP"

      - name: exclusive_lane_whole_block_occupation_conflict
        grounds:
          - validations[priority=13]
          - state_machines.GroupReservation.DRAFT_to_HELD
          - entities.Lane.fields.closure_reason
        distinguishing_aspect: "Whole-block exclusive occupation on a Lane (GroupReservation), different interval semantics from instance 1's point-interval: a second EXCLUSIVE_LANE hold on a lane already CLOSED with closure_reason=GROUP_RENTAL for the same block is rejected with ERR_LANE_UNAVAILABLE — the entire block, not a sub-interval, is occupied."
        test_recipe:
          setup:
            - "OPEN park, two OPEN lanes (cap 8), SCHEDULED block; one group already HOLDing lane1 exclusively (lane1 CLOSED/GROUP_RENTAL); a second group drafted against the SAME lane1 and block."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Exclusive", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 8, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane1_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L2", rider_capacity_per_block: 8, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Host One", zip_code: "50001", birthdate: "1980-01-01T00:00:00Z" }
              as: Anonymous
              captures: { h1_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Host Two", zip_code: "50002", birthdate: "1980-01-01T00:00:00Z" }
              as: Anonymous
              captures: { h2_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-17T10:00:00Z", ends_at: "2026-03-17T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${h1_id}", time_block_id: "${tb_id}", rental_type: "EXCLUSIVE_LANE", party_size: 4, lane_id: "${lane1_id}" }
              as: GroupHost
              as_user_id: "${h1_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${h2_id}", time_block_id: "${tb_id}", rental_type: "EXCLUSIVE_LANE", party_size: 4, lane_id: "${lane1_id}" }
              as: GroupHost
              as_user_id: "${h2_id}"
              captures: { res2_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${h1_id}"
              captures: { tb_v0: $.data.version }
            - call: "POST /group-reservations/${res1_id}/hold"
              payload: { expected_time_block_version: "${tb_v0}" }
              as: GroupHost
              as_user_id: "${h1_id}"
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${h2_id}"
              captures: { tb_v1: $.data.version }
          trigger:
            - call: "POST /group-reservations/${res2_id}/hold"
              payload: { expected_time_block_version: "${tb_v1}" }
              as: GroupHost
              as_user_id: "${h2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Lane.${lane1_id}.status == CLOSED"
            - "Lane.${lane1_id}.closure_reason == GROUP_RENTAL"
            - "response error_id == ERR_LANE_UNAVAILABLE"
            - "GroupReservation.${res2_id}.state == DRAFT"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: confirm_then_refund_conserves_committed_rider_count
        grounds:
          - state_machines.SessionTicket.RESERVED_to_CONFIRMED
          - state_machines.SessionTicket.CONFIRMED_to_REFUNDED
          - entities.TimeBlock.fields.committed_rider_count
        distinguishing_aspect: "Conserved quantity = TimeBlock.committed_rider_count: confirm (+1) then refund (-1) MUST leave committed_rider_count exactly equal to its pre-confirm value (0); pinned as committed_rider_count_after == committed_rider_count_before."
        test_recipe:
          setup:
            - "OPEN park, one OPEN lane cap 5, ACTIVE block at committed_rider_count=0, waivered patron with RESERVED ticket."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Conserve", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-18T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Cal Cancel", zip_code: "60001", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-18T10:00:00Z", ends_at: "2026-03-18T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${patron_id}", park_id: "${park_id}", signed_at: "2026-03-18T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /tickets/${ticket_id}/refund"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
          assert:
            - "TimeBlock.${tb_id}.committed_rider_count == 0"
            - "SessionTicket.${ticket_id}.lifecycle_state == REFUNDED"
            - "GET /refund-entries?ticket_id=${ticket_id} returns one RefundEntry reason == PATRON_CANCEL amount_cents == 3500"

      - name: exclusive_hold_then_revise_conserves_open_lane_count
        grounds:
          - state_machines.GroupReservation.DRAFT_to_HELD
          - state_machines.GroupReservation.HELD_to_DRAFT
          - entities.Park.fields.open_lane_count
        distinguishing_aspect: "Different conserved quantity = Park.open_lane_count: an EXCLUSIVE_LANE hold closes a lane (open_lane_count -1) and revise reopens it (+1), so open_lane_count_after == open_lane_count_before (2); a different conserved aggregate than instance 1's committed_rider_count."
        test_recipe:
          setup:
            - "OPEN park with two OPEN lanes (open_lane_count=2), SCHEDULED block, GroupHost with an EXCLUSIVE_LANE reservation on lane1."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "LaneConserve", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 8, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane1_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L2", rider_capacity_per_block: 8, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Helen Host", zip_code: "60002", birthdate: "1980-01-01T00:00:00Z" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-19T10:00:00Z", ends_at: "2026-03-19T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${host_id}", time_block_id: "${tb_id}", rental_type: "EXCLUSIVE_LANE", party_size: 4, lane_id: "${lane1_id}" }
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { res_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /group-reservations/${res_id}/hold"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GroupHost
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /group-reservations/${res_id}/revise"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
          assert:
            - "Park.${park_id}.open_lane_count == 2"
            - "Lane.${lane1_id}.status == OPEN"
            - "Lane.${lane1_id}.closure_reason == null"
            - "GroupReservation.${res_id}.state == DRAFT"
