            - { call: "POST /jurors", payload: { display_name: "Iris Vega", email: "iris@example.org", expertise_categories: ["PAINTING", "PHOTOGRAPHY"], honorarium_cents: 50000 }, as: JuryChair, captures: { j1_id: $.data.id } }
            - { call: "POST /jurors/${j1_id}/confirm", payload: {}, as: Juror, as_user_id: "${j1_id}" }
            - { call: "POST /jury-rounds", payload: { exhibition_id: "${ex_id}", round_number: 1, round_type: "BLIND_SCORING", opens_at: "2026-10-05T00:00:00Z", closes_at: "2026-10-12T00:00:00Z", quorum_required: 1 }, as: JuryChair, captures: { r1_id: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /jury-rounds/${r1_id}/assignments", payload: { juror_id: "${j1_id}", session_start_at: "2026-10-06T09:00:00Z", session_end_at: "2026-10-06T13:00:00Z", expected_jury_round_version: "${r1_v1}" }, as: JuryChair }
            - { call: "POST /jury-rounds/${r1_id}/status", payload: { target_status: "OPEN" }, as: JuryChair }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-06T10:00:00Z" }, as: CallManager }
            - { call: "POST /jury-rounds/${r1_id}/scores", payload: { artwork_id: "${aw_a_id}", technique: 8, originality: 8, relevance: 8 }, as: Juror, as_user_id: "${j1_id}" }
