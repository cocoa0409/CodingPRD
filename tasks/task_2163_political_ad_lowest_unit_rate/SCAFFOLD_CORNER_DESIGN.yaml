        distinguishing_aspect: "The complaint cycle runs OPEN -> RESPONDED (PENDING_CURE) -> REOPENED at cure_due_at -> RESPONDED (CURED) -> CLOSED, and Station.open_complaint_count tracks it as 1, 0, 1, 0, 0 with compliance_posture RESTRICTED, OPEN, RESTRICTED, OPEN, OPEN."
