# =============================================================================
# Task 1564 — Global Mobility & Assignment Tax Equalization
# Scaffold seed tables (§1.0–§1.7). Difficulty: Expert+ (max depth).
# =============================================================================

scenario: |
  Global Mobility & Assignment Tax Equalization (expatriate assignment program): assignment letter & compensation package construction, host/home payroll split & shadow payroll, hypothetical tax withholding & tax equalization settlement, tax return preparation vendor coordination, social security totalization & certificate of coverage, per-diem/housing allowance policy, assignment extension/repatriation, cost projection & business unit chargeback

domain_name: global-mobility-assignment-tax
api_prefix: /mobility

# Step 0 — Complexity profile
complexity_profile:
  primary_archetype: ledger_reconciliation      # hypothetical tax withheld vs final hypothetical tax on filed actuals; provisional vs actualized cost
  secondary_archetype: compliance_audit          # certificate-of-coverage gating, segregation of duties, vendor-filed return gates settlement
  complexity_layers:
    - optimistic_concurrency                     # OCC on Assignment.version for supersede-creates and repatriation
    - dual_variant_calculation                   # hypothetical tax PROVISIONAL vs FINAL; cost projection PROVISIONAL vs ACTUALIZED
    - cascading_side_effects                     # record post -> chargeback -> ytd recompute -> posture flip -> extension gate
    - rate_threshold_triggers                    # per-diem annual day cap; cost overrun threshold at strictly-greater 110%
  entity_topology: flat                          # peer collections under /mobility, FK links in bodies
  state_machine_shape: cyclic                    # VendorEngagement review loop; PayrollSplit ACTIVE<->SUSPENDED; Settlement DISPUTED->CALCULATED; Assignment approve/reject revert
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties              # creator cannot approve own package/settlement; BU approver != Mobility approver
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MobilityProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: home_country_code, type: string, source: input, description: "Home country ISO code governing hypothetical tax" }
      - { name: functional_currency, type: string, source: input, default: "USD", description: "Currency all *_cents amounts are expressed in" }
      - { name: cost_overrun_threshold_pct, type: integer, source: input, default: 110, description: "Posture flips to OVERRUN when ytd_chargeback strictly exceeds CURRENT projection monthly cost x posted months x this pct / 100" }
      - { name: max_assignment_duration_days, type: integer, source: input, default: 1825, description: "Hard cap: planned_end_date must be <= start_date + this many days" }
      - { name: per_diem_annual_day_cap, type: integer, source: input, default: 365, description: "Max cumulative per_diem_days across POSTED records per assignment per tax_year (inclusive cap)" }
      - { name: status, type: enum, source: system, description: "ACTIVE (v1 exposes no archival transition)" }
      - { name: total_posted_chargeback_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all ChargebackEntry rows in POSTED status for assignments of this program; signed" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_ref, type: string, source: input, description: "External HR reference; unique across all employees" }
      - { name: full_name, type: string, source: input, description: "Employee legal name" }
      - { name: home_country_code, type: string, source: input, description: "Home country ISO code" }
      - { name: family_size, type: integer, source: input, default: 1, description: "Tax household size; drives personal exemption = family_size x 200000 cents", constraints: ">= 1" }
      - { name: annual_base_salary_cents, type: integer, source: input, description: "Home-country gross annual base salary used by cost projection", constraints: ">= 0" }

  - name: AllowancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_name, type: string, source: input, description: "Policy display name" }
      - { name: host_country_code, type: string, source: input, description: "Host country this policy covers" }
      - { name: effective_from, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date; half-open window end (exclusive). Must be > effective_from" }
      - { name: per_diem_daily_cents, type: integer, source: input, description: "Base per-diem per day before COLA", constraints: ">= 0" }
      - { name: housing_monthly_cap_cents, type: integer, source: input, description: "Monthly housing allowance ceiling; receipts above cap are clamped", constraints: ">= 0" }
      - { name: cola_pct, type: integer, source: input, default: 0, description: "Cost-of-living adjustment percent applied to the per-diem daily rate", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (v1 exposes no archival transition)" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> MobilityProgram.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id" }
      - { name: policy_id, type: string, source: input, description: "FK -> AllowancePolicy.id" }
      - { name: host_country_code, type: string, source: input, description: "Host country ISO code" }
      - { name: host_business_unit, type: string, source: input, description: "Business unit charged via chargeback entries" }
      - { name: assignment_type, type: enum, source: input, description: "SHORT_TERM | LONG_TERM" }
      - { name: totalization_applies, type: boolean, source: input, description: "When true, activation and extension require a valid CertificateOfCoverage" }
      - { name: start_date, type: string, source: input, description: "ISO date; closed-interval assignment window start (inclusive)" }
      - { name: planned_end_date, type: string, source: input, description: "ISO date; closed-interval window end (inclusive); moved forward by approved extensions" }
      - { name: actual_end_date, type: string, source: system, default: null, description: "ISO date stamped at complete-repatriation" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PENDING_BU_APPROVAL | PENDING_MOBILITY_APPROVAL | ACTIVE | REPATRIATION_PENDING | REPATRIATED | CLOSED | CANCELLED" }
      - { name: cost_posture, type: enum, source: computed, default: "NORMAL", description: "NORMAL | OVERRUN; derived by overrun_posture_check after every ytd_chargeback_cents change" }
      - { name: ytd_gross_cents, type: integer, source: computed, default: 0, description: "Sum of total_gross_cents over POSTED ShadowPayrollRecord rows of this assignment" }
      - { name: ytd_hypo_withheld_cents, type: integer, source: computed, default: 0, description: "Sum of hypothetical_tax_cents over POSTED ShadowPayrollRecord rows of this assignment" }
      - { name: ytd_per_diem_days, type: integer, source: computed, default: 0, description: "Sum of per_diem_days over POSTED ShadowPayrollRecord rows of this assignment" }
      - { name: ytd_chargeback_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over ChargebackEntry rows of this assignment with status ACCRUED or POSTED (VOIDED excluded); signed" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID that submitted for approval; feeds segregation-of-duties" }
      - { name: bu_approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of business-unit approver; mobility approver must differ" }

  - name: CompensationPackage
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; at most one package per assignment with status DRAFT, SUBMITTED, or APPROVED" }
      - { name: letter_title, type: string, source: input, description: "Assignment letter title" }
      - { name: home_base_annual_cents, type: integer, source: input, description: "Home base annual salary carried on the letter", constraints: ">= 0" }
      - { name: goods_services_differential_pct, type: integer, source: input, default: 0, description: "Goods & services differential percent", constraints: ">= 0" }
      - { name: relocation_lump_sum_cents, type: integer, source: input, default: 0, description: "One-time relocation allowance", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED" }
      - { name: revision_number, type: integer, source: system, default: 0, description: "Increments each time revise returns the package to DRAFT" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of MobilityApprover who approved" }

  - name: PayrollSplit
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; at most one PayrollSplit per assignment with status DRAFT, ACTIVE, or SUSPENDED" }
      - { name: home_payroll_pct, type: integer, source: input, description: "Percent of gross paid through home payroll", constraints: "0..100; home_payroll_pct + host_payroll_pct must equal 100" }
      - { name: host_payroll_pct, type: integer, source: input, description: "Percent of gross paid through host payroll", constraints: "0..100" }
      - { name: shadow_payroll_host, type: boolean, source: input, default: true, description: "Whether a host shadow payroll is run" }
      - { name: coc_exempt, type: boolean, source: computed, default: false, description: "True while a CertificateOfCoverage for this assignment is ISSUED and unexpired; zeroes employer_socsec_cents on new/amended DRAFT records" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED" }

  - name: ShadowPayrollRecord
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: tax_year, type: integer, source: input, description: "Calendar tax year of the period" }
      - { name: period_month, type: integer, source: input, description: "Calendar month 1-12; at most one record per (assignment_id, tax_year, period_month) with status DRAFT or POSTED" }
      - { name: total_gross_cents, type: integer, source: input, description: "Total gross compensation for the period before split", constraints: ">= 0" }
      - { name: per_diem_days, type: integer, source: input, description: "Per-diem days claimed this period", constraints: ">= 0 and <= days in period month" }
      - { name: housing_receipts_cents, type: integer, source: input, description: "Actual housing receipts submitted for the month", constraints: ">= 0" }
      - { name: home_gross_cents, type: integer, source: computed, description: "round_half_up(total_gross_cents x home_payroll_pct / 100)" }
      - { name: host_gross_cents, type: integer, source: computed, description: "total_gross_cents - home_gross_cents (residual always assigned to host)" }
      - { name: per_diem_cents, type: integer, source: computed, description: "allowance_accrual: round_half_up(per_diem_daily_cents x (100+cola_pct)/100) x per_diem_days" }
      - { name: housing_cents, type: integer, source: computed, description: "min(housing_monthly_cap_cents, housing_receipts_cents)" }
      - { name: hypothetical_tax_cents, type: integer, source: computed, description: "hypothetical_tax PROVISIONAL variant for this period" }
      - { name: employer_host_tax_cents, type: integer, source: computed, description: "employer_tax_gross_up fixed point on host_gross_cents at 40%" }
      - { name: employer_socsec_cents, type: integer, source: computed, description: "0 when payroll split coc_exempt is true, else round_half_up(host_gross_cents x 0.0765)" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | POSTED | VOIDED" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: tax_year, type: integer, source: input, description: "Tax year being equalized; at most one Settlement per (assignment_id, tax_year) with status CALCULATED, PENDING_REVIEW, APPROVED, or DISPUTED" }
      - { name: vendor_engagement_id, type: string, source: system, description: "FK -> VendorEngagement.id; the FILED engagement whose filed_total_gross_cents fed the FINAL hypothetical tax" }
      - { name: total_hypo_withheld_cents, type: integer, source: computed, description: "Sum of hypothetical_tax_cents over POSTED ShadowPayrollRecord rows of this assignment for tax_year" }
      - { name: final_hypo_tax_cents, type: integer, source: computed, description: "hypothetical_tax FINAL variant on filed_total_gross_cents" }
      - { name: settlement_amount_cents, type: integer, source: computed, description: "total_hypo_withheld_cents - final_hypo_tax_cents; positive = company owes employee" }
      - { name: direction, type: enum, source: computed, description: "EMPLOYEE_CREDIT when amount > 0 | EMPLOYEE_DEBIT when amount < 0 | ZERO when amount == 0" }
      - { name: status, type: enum, source: system, default: "CALCULATED", description: "CALCULATED | PENDING_REVIEW | APPROVED | DISPUTED | SETTLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; settlement approver must differ (segregation of duties)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of FinanceController who approved" }
      - { name: dispute_reason, type: string, source: system, default: null, description: "Reason recorded when the assignee disputes" }

  - name: VendorEngagement
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: tax_year, type: integer, source: input, description: "Tax year under preparation; at most one engagement per (assignment_id, tax_year) whose status is not CLOSED" }
      - { name: scope, type: enum, source: input, description: "HOME_ONLY | HOST_ONLY | DUAL" }
      - { name: vendor_name, type: string, source: input, description: "Tax preparation vendor name" }
      - { name: fee_cents, type: integer, source: input, description: "Agreed vendor fee", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ENGAGED", description: "ENGAGED | DATA_SENT | DRAFT_RETURNED | UNDER_REVIEW | REVISION_REQUESTED | ACCEPTED | FILED | CLOSED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each request-revision -> return-draft cycle" }
      - { name: filed_total_gross_cents, type: integer, source: system, default: null, description: "Total gross per filed return; input at mark-filed; feeds hypothetical_tax FINAL" }
      - { name: filed_home_tax_cents, type: integer, source: system, default: null, description: "Actual home tax per filed return; input at mark-filed" }

  - name: CertificateOfCoverage
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; at most one certificate per assignment with status REQUESTED, SUBMITTED, or ISSUED" }
      - { name: application_ref, type: string, source: input, description: "External totalization application reference" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | SUBMITTED | ISSUED | REJECTED | EXPIRED" }
      - { name: valid_from, type: string, source: system, default: null, description: "ISO date coverage start; input at mark-issued" }
      - { name: valid_until, type: string, source: system, default: null, description: "ISO date coverage end (inclusive); input at mark-issued; expiry sweeps when clock passes this date" }

  - name: CostProjection
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: variant, type: enum, source: computed, description: "PROVISIONAL when the assignment has no POSTED ShadowPayrollRecord, else ACTUALIZED" }
      - { name: projected_months, type: integer, source: computed, description: "Calendar months touched by [start_date, planned_end_date], both inclusive" }
      - { name: monthly_cost_cents, type: integer, source: computed, description: "Provisional monthly cost per cost_projection_total" }
      - { name: total_projected_cents, type: integer, source: computed, description: "PROVISIONAL: projected_months x monthly_cost_cents; ACTUALIZED: posted chargeback sum + remaining months x monthly_cost_cents" }
      - { name: status, type: enum, source: system, default: "CURRENT", description: "CURRENT | SUPERSEDED; creating a new projection supersedes the prior CURRENT one" }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id" }
      - { name: requested_new_end_date, type: string, source: input, description: "ISO date; must be strictly after current planned_end_date and within max_assignment_duration_days of start_date" }
      - { name: reason, type: string, source: input, default: null, description: "Free-text business reason" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | DECLINED | SUPERSEDED; creating a new request supersedes the prior PENDING one" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of BusinessUnitApprover who approved or declined" }

  - name: ChargebackEntry
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id" }
      - { name: business_unit, type: string, source: system, description: "Copied from Assignment.host_business_unit at creation" }
      - { name: entry_type, type: enum, source: system, description: "PERIOD_COST (created when a ShadowPayrollRecord posts) | SETTLEMENT (created when a Settlement settles)" }
      - { name: source_record_id, type: string, source: system, default: null, description: "FK -> ShadowPayrollRecord.id for PERIOD_COST entries" }
      - { name: source_settlement_id, type: string, source: system, default: null, description: "FK -> Settlement.id for SETTLEMENT entries" }
      - { name: amount_cents, type: integer, source: computed, description: "PERIOD_COST: host_gross + employer_host_tax + employer_socsec + per_diem + housing of the source record; SETTLEMENT: settlement_amount_cents (signed)" }
      - { name: status, type: enum, source: system, default: "ACCRUED", description: "ACCRUED | POSTED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MobilityProgram
    initial_state: ACTIVE
    terminal_states: []
    transitions: []
    note: "Programs are created ACTIVE and stay ACTIVE in v1 (no lifecycle transitions exposed). total_posted_chargeback_cents is a computed aggregate, not a state axis."

  - entity: Assignment
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_BU_APPROVAL
        trigger: "POST /mobility/assignments/{id}/submit"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id = X-User-ID of the submitter"
      - from: PENDING_BU_APPROVAL
        to: PENDING_MOBILITY_APPROVAL
        trigger: "POST /mobility/assignments/{id}/approve-bu"
        actor: BusinessUnitApprover
        preconditions:
          - "Assignment.status == PENDING_BU_APPROVAL (else ERR_INVALID_STATE)"
        side_effects:
          - "bu_approved_by_user_id = X-User-ID of the approver"
      - from: PENDING_BU_APPROVAL
        to: DRAFT
        trigger: "POST /mobility/assignments/{id}/reject-bu"
        actor: BusinessUnitApprover
        preconditions:
          - "Assignment.status == PENDING_BU_APPROVAL (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id reset to null (revert)"
      - from: PENDING_MOBILITY_APPROVAL
        to: ACTIVE
        trigger: "POST /mobility/assignments/{id}/approve-mobility"
        actor: MobilityApprover
        preconditions:
          - "Assignment.status == PENDING_MOBILITY_APPROVAL (else ERR_INVALID_STATE)"
          - "X-User-ID != bu_approved_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "A CompensationPackage for this assignment is APPROVED (else ERR_PACKAGE_NOT_APPROVED)"
          - "A PayrollSplit for this assignment is ACTIVE (else ERR_SPLIT_NOT_ACTIVE)"
          - "If totalization_applies: a CertificateOfCoverage for this assignment is ISSUED (else ERR_COC_REQUIRED)"
        side_effects: []
      - from: PENDING_MOBILITY_APPROVAL
        to: DRAFT
        trigger: "POST /mobility/assignments/{id}/reject-mobility"
        actor: MobilityApprover
        preconditions:
          - "Assignment.status == PENDING_MOBILITY_APPROVAL (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_by_user_id and bu_approved_by_user_id reset to null (revert)"
      - from: ACTIVE
        to: REPATRIATION_PENDING
        trigger: "POST /mobility/assignments/{id}/initiate-repatriation"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status == ACTIVE (else ERR_INVALID_STATE)"
          - "OCC: expected_assignment_version == Assignment.version (else ERR_STALE_ASSIGNMENT_VERSION, 412)"
        side_effects:
          - "increments Assignment.version by 1"
          - "Cascade hop 1: the ACTIVE PayrollSplit for this assignment transitions to SUSPENDED"
          - "Cascade hop 2 (from hop 1's mutation): every DRAFT ShadowPayrollRecord of this assignment transitions to VOIDED"
      - from: REPATRIATION_PENDING
        to: REPATRIATED
        trigger: "POST /mobility/assignments/{id}/complete-repatriation"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status == REPATRIATION_PENDING (else ERR_INVALID_STATE)"
          - "Every VendorEngagement for this assignment is FILED or CLOSED (else ERR_ENGAGEMENT_NOT_FINAL)"
        side_effects:
          - "actual_end_date = current clock date"
          - "the SUSPENDED PayrollSplit for this assignment transitions to TERMINATED"
      - from: REPATRIATED
        to: CLOSED
        trigger: "POST /mobility/assignments/{id}/close"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status == REPATRIATED (else ERR_INVALID_STATE)"
          - "Every Settlement for this assignment is SETTLED (else ERR_UNSETTLED_LEDGER)"
          - "Every ChargebackEntry for this assignment is POSTED or VOIDED (else ERR_UNSETTLED_LEDGER)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /mobility/assignments/{id}/cancel"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status in {DRAFT, PENDING_BU_APPROVAL, PENDING_MOBILITY_APPROVAL} (else ERR_INVALID_STATE)"
        side_effects:
          - "Cancellation frees the employee's date window: CANCELLED rows no longer participate in ERR_ASSIGNMENT_OVERLAP"
      - from: PENDING_BU_APPROVAL
        to: CANCELLED
        trigger: "POST /mobility/assignments/{id}/cancel"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status in {DRAFT, PENDING_BU_APPROVAL, PENDING_MOBILITY_APPROVAL} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING_MOBILITY_APPROVAL
        to: CANCELLED
        trigger: "POST /mobility/assignments/{id}/cancel"
        actor: MobilityAdmin
        preconditions:
          - "Assignment.status in {DRAFT, PENDING_BU_APPROVAL, PENDING_MOBILITY_APPROVAL} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: CompensationPackage
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mobility/compensation-packages/{id}/submit"
        actor: PayrollSpecialist
        preconditions:
          - "CompensationPackage.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mobility/compensation-packages/{id}/approve"
        actor: MobilityApprover
        preconditions:
          - "CompensationPackage.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id = X-User-ID of the approver"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /mobility/compensation-packages/{id}/revise"
        actor: PayrollSpecialist
        preconditions:
          - "CompensationPackage.status in {SUBMITTED, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "revision_number += 1"
          - "approved_by_user_id reset to null"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /mobility/compensation-packages/{id}/revise"
        actor: PayrollSpecialist
        preconditions:
          - "CompensationPackage.status in {SUBMITTED, APPROVED} (else ERR_INVALID_STATE)"
          - "The linked Assignment is still in DRAFT (revising the package of an ACTIVE or later assignment is forbidden: ERR_INVALID_STATE)"
        side_effects:
          - "revision_number += 1"
          - "approved_by_user_id reset to null"

  - entity: PayrollSplit
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mobility/payroll-splits/{id}/activate"
        actor: PayrollSpecialist
        preconditions:
          - "PayrollSplit.status == DRAFT (else ERR_INVALID_STATE)"
          - "home_payroll_pct + host_payroll_pct == 100 (validated at create; re-checked here, else ERR_SPLIT_SUM_INVALID)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mobility/payroll-splits/{id}/suspend OR cascade from Assignment initiate-repatriation"
        actor: PayrollSpecialist | system
        preconditions:
          - "PayrollSplit.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "When triggered by repatriation cascade: every DRAFT ShadowPayrollRecord of the assignment transitions to VOIDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mobility/payroll-splits/{id}/resume"
        actor: PayrollSpecialist
        preconditions:
          - "PayrollSplit.status == SUSPENDED (else ERR_INVALID_STATE)"
          - "The linked Assignment.status == ACTIVE (resuming under a REPATRIATION_PENDING or REPATRIATED assignment is forbidden: ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mobility/payroll-splits/{id}/terminate OR cascade from Assignment complete-repatriation"
        actor: PayrollSpecialist | system
        preconditions:
          - "PayrollSplit.status in {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mobility/payroll-splits/{id}/terminate OR cascade from Assignment complete-repatriation"
        actor: PayrollSpecialist | system
        preconditions:
          - "PayrollSplit.status in {ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: ShadowPayrollRecord
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /mobility/shadow-payroll-records/{id}/post"
        actor: PayrollSpecialist
        preconditions:
          - "ShadowPayrollRecord.status == DRAFT (else ERR_INVALID_STATE)"
          - "PayrollSplit for the assignment is ACTIVE (else ERR_SPLIT_NOT_ACTIVE)"
          - "Per-diem annual cap: sum of per_diem_days over POSTED records of this assignment for this tax_year + this record's per_diem_days <= MobilityProgram.per_diem_annual_day_cap (else ERR_PER_DIEM_ANNUAL_CAP_EXCEEDED)"
        side_effects:
          - "Computed money fields freeze at post time"
          - "Cascade hop 1: create ChargebackEntry entry_type=PERIOD_COST status=ACCRUED amount_cents = host_gross_cents + employer_host_tax_cents + employer_socsec_cents + per_diem_cents + housing_cents, business_unit copied from Assignment"
          - "Cascade hop 2 (from hop 1's insert): Assignment.ytd_chargeback_cents += amount_cents; Assignment.ytd_gross_cents += total_gross_cents; ytd_hypo_withheld_cents += hypothetical_tax_cents; ytd_per_diem_days += per_diem_days; Assignment.updated_at refreshed"
          - "Cascade hop 3 (from hop 2's mutation): overrun_posture_check runs; Assignment.cost_posture flips NORMAL -> OVERRUN when ytd_chargeback_cents strictly exceeds the pro-rata threshold"
          - "Gate: while cost_posture == OVERRUN, extension-request approve is rejected with ERR_COST_OVERRUN_BLOCKED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /mobility/shadow-payroll-records/{id}/void OR cascade from repatriation initiation"
        actor: PayrollSpecialist | system
        preconditions:
          - "ShadowPayrollRecord.status in {DRAFT, POSTED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: POSTED
        to: VOIDED
        trigger: "POST /mobility/shadow-payroll-records/{id}/void"
        actor: PayrollSpecialist
        preconditions:
          - "ShadowPayrollRecord.status in {DRAFT, POSTED} (else ERR_INVALID_STATE)"
          - "No Settlement in CALCULATED, PENDING_REVIEW, APPROVED, or DISPUTED exists for the record's (assignment_id, tax_year) (else ERR_INVALID_STATE: posted source records under an open settlement are frozen)"
        side_effects:
          - "Compensation: the PERIOD_COST ChargebackEntry whose source_record_id is this record transitions to VOIDED"
          - "Assignment.ytd_gross_cents, ytd_hypo_withheld_cents, ytd_per_diem_days, ytd_chargeback_cents are decremented by the record's frozen amounts"
          - "overrun_posture_check re-runs; cost_posture may flip OVERRUN -> NORMAL"

  - entity: Settlement
    initial_state: CALCULATED
    terminal_states: [SETTLED]
    transitions:
      - from: CALCULATED
        to: PENDING_REVIEW
        trigger: "POST /mobility/settlements/{id}/submit"
        actor: PayrollSpecialist
        preconditions:
          - "Settlement.status == CALCULATED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /mobility/settlements/{id}/approve"
        actor: FinanceController
        preconditions:
          - "Settlement.status == PENDING_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID != created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "When settlement_amount_cents == 0 (direction ZERO): skips APPROVED and transitions directly to SETTLED with NO ChargebackEntry created (zero-amount boundary)"
          - "Otherwise approved_by_user_id = X-User-ID"
        note: "ZERO-amount settlements auto-settle on approval; nonzero settlements wait in APPROVED for the explicit settle action."
      - from: PENDING_REVIEW
        to: DISPUTED
        trigger: "POST /mobility/settlements/{id}/dispute"
        actor: Assignee
        preconditions:
          - "Settlement.status == PENDING_REVIEW (else ERR_INVALID_STATE)"
          - "X-User-ID == Assignment.employee_id of the settlement's assignment (ownership; else ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "dispute_reason = request reason"
      - from: DISPUTED
        to: CALCULATED
        trigger: "POST /mobility/settlements/{id}/recalculate"
        actor: PayrollSpecialist
        preconditions:
          - "Settlement.status == DISPUTED (else ERR_INVALID_STATE)"
          - "The linked VendorEngagement is still FILED or CLOSED (else ERR_VENDOR_NOT_FILED)"
        side_effects:
          - "Recomputes total_hypo_withheld_cents, final_hypo_tax_cents, settlement_amount_cents, direction from current POSTED records and the filed engagement (cyclic revision loop)"
          - "dispute_reason reset to null"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /mobility/settlements/{id}/settle"
        actor: FinanceController
        preconditions:
          - "Settlement.status == APPROVED (else ERR_INVALID_STATE)"
          - "settlement_amount_cents != 0 (zero amounts already SETTLED at approve; else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade hop 1: create ChargebackEntry entry_type=SETTLEMENT status=ACCRUED amount_cents = settlement_amount_cents (signed; EMPLOYEE_DEBIT yields a negative entry), business_unit copied from Assignment"
          - "Cascade hop 2 (from hop 1's insert): Assignment.ytd_chargeback_cents += settlement_amount_cents"
          - "Cascade hop 3 (from hop 2's mutation): overrun_posture_check runs and may flip cost_posture"

  - entity: VendorEngagement
    initial_state: ENGAGED
    terminal_states: [CLOSED]
    transitions:
      - from: ENGAGED
        to: DATA_SENT
        trigger: "POST /mobility/vendor-engagements/{id}/send-data"
        actor: VendorCoordinator
        preconditions:
          - "VendorEngagement.status == ENGAGED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DATA_SENT
        to: DRAFT_RETURNED
        trigger: "POST /mobility/vendor-engagements/{id}/return-draft"
        actor: TaxVendor
        preconditions:
          - "VendorEngagement.status in {DATA_SENT, REVISION_REQUESTED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: DRAFT_RETURNED
        trigger: "POST /mobility/vendor-engagements/{id}/return-draft"
        actor: TaxVendor
        preconditions:
          - "VendorEngagement.status in {DATA_SENT, REVISION_REQUESTED} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: DRAFT_RETURNED
        to: UNDER_REVIEW
        trigger: "POST /mobility/vendor-engagements/{id}/start-review"
        actor: VendorCoordinator
        preconditions:
          - "VendorEngagement.status == DRAFT_RETURNED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /mobility/vendor-engagements/{id}/request-revision"
        actor: VendorCoordinator
        preconditions:
          - "VendorEngagement.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "revision_count += 1 (cyclic review loop)"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /mobility/vendor-engagements/{id}/accept"
        actor: VendorCoordinator
        preconditions:
          - "VendorEngagement.status == UNDER_REVIEW (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ACCEPTED
        to: FILED
        trigger: "POST /mobility/vendor-engagements/{id}/mark-filed"
        actor: VendorCoordinator
        preconditions:
          - "VendorEngagement.status == ACCEPTED (else ERR_INVALID_STATE)"
        side_effects:
          - "filed_total_gross_cents and filed_home_tax_cents recorded from request body"
          - "Unlocks Settlement creation for this (assignment_id, tax_year)"
      - from: FILED
        to: CLOSED
        trigger: "POST /mobility/vendor-engagements/{id}/close"
        actor: VendorCoordinator
        preconditions:
          - "VendorEngagement.status == FILED (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: CertificateOfCoverage
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: SUBMITTED
        trigger: "POST /mobility/certificates-of-coverage/{id}/submit"
        actor: VendorCoordinator
        preconditions:
          - "CertificateOfCoverage.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /mobility/certificates-of-coverage/{id}/mark-issued"
        actor: VendorCoordinator
        preconditions:
          - "CertificateOfCoverage.status in {SUBMITTED, REJECTED} (else ERR_INVALID_STATE)"
          - "valid_until > valid_from (else ERR_INVALID_REQUEST)"
        side_effects:
          - "valid_from / valid_until recorded from request body"
          - "PayrollSplit.coc_exempt for the assignment becomes true"
      - from: REJECTED
        to: ISSUED
        trigger: "POST /mobility/certificates-of-coverage/{id}/mark-issued (re-application after rejection)"
        actor: VendorCoordinator
        preconditions:
          - "CertificateOfCoverage.status in {SUBMITTED, REJECTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "PayrollSplit.coc_exempt for the assignment becomes true"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mobility/certificates-of-coverage/{id}/mark-rejected"
        actor: VendorCoordinator
        preconditions:
          - "CertificateOfCoverage.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (evaluated during POST /_clock/set_current_utc when the new clock date is after valid_until)"
        actor: system
        preconditions:
          - "CertificateOfCoverage.status == ISSUED and clock date > valid_until"
        side_effects:
          - "Cascade hop 1: PayrollSplit.coc_exempt for the assignment becomes false"
          - "Cascade hop 2 (from hop 1's mutation): every DRAFT ShadowPayrollRecord of the assignment recomputes employer_socsec_cents with coc_exempt=false; POSTED records stay frozen"

  - entity: CostProjection
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (side effect of POST /mobility/cost-projections creating a successor for the same assignment)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (side effect of POST /mobility/extension-requests creating a successor PENDING request for the same assignment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: APPROVED
        trigger: "POST /mobility/extension-requests/{id}/approve"
        actor: BusinessUnitApprover
        preconditions:
          - "ExtensionRequest.status == PENDING (else ERR_INVALID_STATE)"
          - "Assignment.status == ACTIVE (else ERR_INVALID_STATE)"
          - "Assignment.cost_posture == NORMAL (else ERR_COST_OVERRUN_BLOCKED)"
          - "If Assignment.totalization_applies: a CertificateOfCoverage for the assignment is ISSUED and valid_until >= requested_new_end_date (else ERR_COC_COVERAGE_GAP)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "Assignment.planned_end_date = requested_new_end_date; Assignment.updated_at refreshed; Assignment.version incremented by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /mobility/extension-requests/{id}/decline"
        actor: BusinessUnitApprover
        preconditions:
          - "ExtensionRequest.status == PENDING (else ERR_INVALID_STATE)"
          - "Assignment.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "decided_by_user_id = X-User-ID"

  - entity: ChargebackEntry
    initial_state: ACCRUED
    terminal_states: [POSTED, VOIDED]
    transitions:
      - from: ACCRUED
        to: POSTED
        trigger: "POST /mobility/chargeback-entries/{id}/post"
        actor: FinanceController
        preconditions:
          - "ChargebackEntry.status == ACCRUED (else ERR_INVALID_STATE)"
        side_effects:
          - "MobilityProgram.total_posted_chargeback_cents += amount_cents"
      - from: ACCRUED
        to: VOIDED
        trigger: "POST /mobility/chargeback-entries/{id}/void OR cascade from ShadowPayrollRecord void"
        actor: FinanceController | system
        preconditions:
          - "ChargebackEntry.status == ACCRUED (manual void) or cascade from a POSTED record void"
        side_effects:
          - "Assignment.ytd_chargeback_cents -= amount_cents; overrun_posture_check re-runs"
      - from: POSTED
        to: VOIDED
        trigger: "POST /mobility/chargeback-entries/{id}/void"
        actor: FinanceController
        preconditions:
          - "ChargebackEntry.status in {ACCRUED, POSTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "Compensation: MobilityProgram.total_posted_chargeback_cents -= amount_cents; Assignment.ytd_chargeback_cents -= amount_cents; overrun_posture_check re-runs"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: cost-projection-create-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /mobility/cost-projections"
    occ_field: "expected_assignment_version"
    description: |
      Creating a CostProjection against an Assignment whose version has advanced
      since the client last observed it is rejected. A successful creation
      legitimately supersedes the prior CURRENT projection (CostProjection state
      machine), so a second create carrying a stale expected_assignment_version
      would otherwise silently supersede a projection it never saw.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
  - rule_id: extension-request-create-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /mobility/extension-requests"
    occ_field: "expected_assignment_version"
    description: |
      Creating an ExtensionRequest against an Assignment whose version has
      advanced since the client last observed it is rejected. A successful
      creation legitimately supersedes the prior PENDING request, so a second
      create carrying a stale expected_assignment_version would otherwise
      silently supersede a request it never saw.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
  - rule_id: repatriation-initiate-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /mobility/assignments/{id}/initiate-repatriation"
    occ_field: "expected_assignment_version"
    description: |
      Initiating repatriation against an Assignment whose version has advanced
      since the client last observed it (for example an extension approval or a
      cost-projection creation landed in between) is rejected. The Assignment is
      still ACTIVE and the transition would otherwise legitimately succeed, so
      the stale view is rejected with 412 instead of proceeding on outdated
      terms.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hypothetical_tax
    trigger: "ShadowPayrollRecord creation / DRAFT recompute (PROVISIONAL); Settlement creation and recalculate (FINAL)"
    algorithm: tiered_pricing
    formula: |
      exemption_cents = Employee.family_size * 200000
      annual_tax(G):
        taxable = max(0, G - exemption_cents)
        tax = 0.10 * min(taxable, 5000000)
            + 0.20 * min(max(taxable - 5000000, 0), 5000000)
            + 0.30 * max(taxable - 10000000, 0)
        return round_half_up(tax)            # all inputs integer cents; result integral
      PROVISIONAL (per ShadowPayrollRecord):
        projected_annual = record.total_gross_cents * 12
        record.hypothetical_tax_cents = round_half_up(annual_tax(projected_annual) / 12)
      FINAL (per Settlement):
        settlement.final_hypo_tax_cents = annual_tax(filed_total_gross_cents)
        where filed_total_gross_cents comes from the FILED VendorEngagement
    input_set: "PROVISIONAL: the record being computed + its Employee. FINAL: POSTED ShadowPayrollRecord rows are NOT used for FINAL itself; FINAL reads VendorEngagement.filed_total_gross_cents of the FILED engagement for (assignment_id, tax_year)."
    constants:
      BRACKET1_TOP_CENTS: 5000000      # 10% up to $50,000 taxable
      BRACKET2_TOP_CENTS: 10000000     # 20% marginal $50,000-$100,000
      BRACKET1_RATE: 0.10
      BRACKET2_RATE: 0.20
      BRACKET3_RATE: 0.30
      EXEMPTION_PER_FAMILY_MEMBER_CENTS: 200000
    precision: "integer cents, round_half_up at each explicit rounding point (annual tax, then monthly division)"
    variants:
      - name: PROVISIONAL
        when: "Payroll withholding during the year (ShadowPayrollRecord.hypothetical_tax_cents)"
        difference: "Annualizes the period gross (x12), applies brackets, divides by 12 — a forward-looking estimate"
      - name: FINAL
        when: "Year-end settlement after the vendor files (Settlement.final_hypo_tax_cents)"
        difference: "Applies brackets once to the filed annual gross; identical payroll data with filed gross != 12 x monthly gross yields a different number"

  - name: employer_tax_gross_up
    trigger: "ShadowPayrollRecord creation / DRAFT recompute"
    algorithm: constraint_propagation
    formula: |
      # Circular by definition: the employer-paid host tax is itself a taxable
      # benefit. Evaluation order is PINNED as a fixed-point iteration:
      t_0 = round_half_up(HOST_TAX_RATE * host_gross_cents)
      repeat:
        t_{n+1} = round_half_up(HOST_TAX_RATE * (host_gross_cents + t_n))
      until t_{n+1} == t_n, at most MAX_ITERATIONS rounds
      record.employer_host_tax_cents = t_final
      # Closed form would be rate*base/(1-rate); the pinned iteration converges to
      # the same cent and MUST be used (per-iteration rounding is observable).
    input_set: "The record's computed host_gross_cents"
    constants:
      HOST_TAX_RATE: 0.40
      MAX_ITERATIONS: 50
    precision: "integer cents, round_half_up per iteration"

  - name: employer_social_security
    trigger: "ShadowPayrollRecord creation / DRAFT recompute; CoC expiry cascade recompute of DRAFT records"
    algorithm: threshold
    formula: |
      if PayrollSplit.coc_exempt == true: record.employer_socsec_cents = 0
      else: record.employer_socsec_cents = round_half_up(host_gross_cents * SOCSEC_RATE)
    input_set: "The record's computed host_gross_cents and the assignment's PayrollSplit.coc_exempt"
    constants:
      SOCSEC_RATE: 0.0765
    precision: "integer cents, round_half_up"

  - name: shadow_split_math
    trigger: "ShadowPayrollRecord creation / DRAFT recompute"
    algorithm: aggregation
    formula: |
      home_gross_cents = round_half_up(total_gross_cents * home_payroll_pct / 100)
      host_gross_cents = total_gross_cents - home_gross_cents
      # Pinned order: home is rounded, host takes the residual, so
      # home_gross_cents + host_gross_cents == total_gross_cents ALWAYS holds
      # (split conservation invariant). Boundary: home_payroll_pct == 0 gives
      # home 0 and host == total; home_payroll_pct == 100 gives host 0.
    input_set: "The record's total_gross_cents and the ACTIVE PayrollSplit percentages"
    precision: "integer cents, round_half_up on the home share only"

  - name: allowance_accrual
    trigger: "ShadowPayrollRecord creation / DRAFT recompute"
    algorithm: aggregation
    formula: |
      # Nested rounding, order PINNED: round the daily rate FIRST, then multiply.
      daily_rate_cents = round_half_up(AllowancePolicy.per_diem_daily_cents * (100 + cola_pct) / 100)
      record.per_diem_cents = daily_rate_cents * record.per_diem_days      # no second rounding
      record.housing_cents = min(AllowancePolicy.housing_monthly_cap_cents, record.housing_receipts_cents)
      # The alternative order (multiply then round the monthly product) is
      # FORBIDDEN: it diverges by cents whenever the daily rate is non-integral.
    input_set: "The assignment's AllowancePolicy (via Assignment.policy_id) and the record's per_diem_days / housing_receipts_cents"
    precision: "integer cents; round_half_up exactly once, at the daily-rate step"

  - name: chargeback_period_cost
    trigger: "ShadowPayrollRecord DRAFT -> POSTED"
    algorithm: aggregation
    formula: |
      ChargebackEntry(PERIOD_COST).amount_cents =
          host_gross_cents + employer_host_tax_cents + employer_socsec_cents
        + per_diem_cents + housing_cents      # all frozen fields of the posting record
    input_set: "The posting record's five frozen money fields"
    precision: "integer cents (pure sum, no rounding)"

  - name: cost_projection_total
    trigger: "POST /mobility/cost-projections (both variants computed at creation; variant field selects which total is stored)"
    algorithm: forward_looking
    formula: |
      months = (end.year - start.year) * 12 + (end.month - start.month) + 1
        # months TOUCHED by [start_date, planned_end_date], both inclusive
      host_share_annual = round_half_up(CompensationPackage.home_base_annual_cents * host_payroll_pct / 100)
      host_monthly      = round_half_up(host_share_annual / 12)
      monthly_cost_cents = host_monthly
        + employer_tax_gross_up(host_monthly)            # fixed-point per that rule
        + employer_social_security(host_monthly, coc_exempt)
        + round_half_up(per_diem_daily_cents * (100 + cola_pct) / 100) * 30
        + housing_monthly_cap_cents
      PROVISIONAL (variant when assignment has ZERO POSTED records):
        total_projected_cents = months * monthly_cost_cents
      ACTUALIZED (variant when >= 1 POSTED record exists):
        posted_sum   = sum of amount_cents over PERIOD_COST ChargebackEntry rows of
                       this assignment with status ACCRUED or POSTED (VOIDED excluded)
        posted_count = count of ShadowPayrollRecord rows with status POSTED
        total_projected_cents = posted_sum + (months - posted_count) * monthly_cost_cents
      # Same assignment data, two valid totals: PROVISIONAL is forward-looking
      # from plan, ACTUALIZED reconciles posted actuals chronologically.
    input_set: "Assignment dates; the APPROVED CompensationPackage; the ACTIVE PayrollSplit; the AllowancePolicy; PERIOD_COST chargeback entries and POSTED records for ACTUALIZED"
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: PROVISIONAL
        when: "No POSTED ShadowPayrollRecord exists for the assignment"
        difference: "Pure plan-based projection: months x monthly_cost_cents"
      - name: ACTUALIZED
        when: "At least one POSTED ShadowPayrollRecord exists"
        difference: "Posted actual chargebacks replace plan for elapsed months; remaining months stay at plan"

  - name: settlement_reconciliation
    trigger: "POST /mobility/settlements and POST /mobility/settlements/{id}/recalculate"
    algorithm: chronological
    formula: |
      total_hypo_withheld_cents = sum of hypothetical_tax_cents over
        ShadowPayrollRecord rows of this assignment with status == POSTED and
        tax_year == settlement.tax_year (VOIDED and DRAFT excluded)
      final_hypo_tax_cents      = hypothetical_tax FINAL on the FILED
        VendorEngagement.filed_total_gross_cents for (assignment_id, tax_year)
      settlement_amount_cents   = total_hypo_withheld_cents - final_hypo_tax_cents
      direction: > 0 EMPLOYEE_CREDIT (company pays employee)
                 < 0 EMPLOYEE_DEBIT  (employee pays company)
                 = 0 ZERO            (auto-settles at approve; no chargeback entry)
    input_set: "POSTED records only, scoped to (assignment_id, tax_year); the filed VendorEngagement selected deterministically: eligibility = engagements of (assignment_id, tax_year) with status FILED or CLOSED and filed_total_gross_cents not null; rank status=FILED first, then updated_at DESC, then created_at DESC; empty set -> ERR_VENDOR_NOT_FILED"
    precision: "integer cents (sum of integers)"

  - name: overrun_posture_check
    trigger: "After every mutation of Assignment.ytd_chargeback_cents (record post, record void, settlement settle, chargeback void)"
    algorithm: threshold
    formula: |
      let P = the CostProjection of this assignment with status CURRENT (if none exists, posture stays NORMAL)
      posted_months = count of ShadowPayrollRecord rows with status POSTED
      pro_rata_threshold = P.monthly_cost_cents * posted_months * MobilityProgram.cost_overrun_threshold_pct / 100
      if posted_months == 0: cost_posture = NORMAL
      elif ytd_chargeback_cents > pro_rata_threshold: cost_posture = OVERRUN   # STRICTLY greater
      else: cost_posture = NORMAL
      # Boundary: ytd_chargeback_cents == pro_rata_threshold exactly => NORMAL.
    input_set: "Assignment.ytd_chargeback_cents; CURRENT CostProjection; POSTED record count; MobilityProgram.cost_overrun_threshold_pct"
    precision: "compare in cents x pct / 100 as exact rational; no rounding before comparison"

  - name: per_diem_annual_cap
    trigger: "ShadowPayrollRecord DRAFT -> POSTED"
    algorithm: threshold
    formula: |
      used = sum of per_diem_days over POSTED records of this assignment with
             tax_year == record.tax_year
      if used + record.per_diem_days > MobilityProgram.per_diem_annual_day_cap:
        reject ERR_PER_DIEM_ANNUAL_CAP_EXCEEDED
      # Inclusive cap: used + new == cap is ACCEPTED; == cap + 1 is rejected.
    input_set: "POSTED records only, scoped to (assignment_id, tax_year)"
    constants:
      DEFAULT_CAP_DAYS: 365
    precision: "integer day count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role must be listed in the endpoint's roles; for Assignee-only endpoints X-User-ID must also equal the target assignment's employee_id"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Every path id must exist, validated left-to-right; body FK fields (program_id, employee_id, policy_id, assignment_id) must reference existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 4
    category: existence
    check: "Request shape: required fields present; enums in their declared sets; integers within field constraints (e.g., percentages 0..100, amounts >= 0, period_month 1..12); effective_to > effective_from; valid_until > valid_from; start_date <= planned_end_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: state
    check: "Target resource must be in a from-state of the invoked transition; terminal states accept no further transitions; ShadowPayrollRecord create requires Assignment ACTIVE; Settlement create requires Assignment ACTIVE, REPATRIATION_PENDING, or REPATRIATED; ExtensionRequest create requires Assignment ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition and state-gated creation endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_assignment_version must equal the Assignment's current version on the three OCC-guarded endpoints"
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
    applies_to: "POST /mobility/cost-projections; POST /mobility/extension-requests; POST /mobility/assignments/{id}/initiate-repatriation"
  - priority: 7
    category: business_safety
    check: "Segregation of duties: package approver != package creator; settlement approver != settlement creator; mobility approver != bu_approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /mobility/compensation-packages/{id}/approve; POST /mobility/settlements/{id}/approve; POST /mobility/assignments/{id}/approve-mobility"
  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: approve-mobility requires APPROVED package (ERR_PACKAGE_NOT_APPROVED), ACTIVE split (ERR_SPLIT_NOT_ACTIVE), and ISSUED CoC when totalization_applies (ERR_COC_REQUIRED); settlement create requires a FILED VendorEngagement for the tax year (ERR_VENDOR_NOT_FILED); record create/post requires ACTIVE split (ERR_SPLIT_NOT_ACTIVE)"
    error_id: "ERR_PACKAGE_NOT_APPROVED | ERR_SPLIT_NOT_ACTIVE | ERR_COC_REQUIRED | ERR_VENDOR_NOT_FILED"
    http_status: 409
    applies_to: "approve-mobility; settlements create; shadow-payroll-records create/post; cost-projections create"
  - priority: 9
    category: business_temporal
    check: "Date-window rules: same-employee closed-interval assignment overlap (ERR_ASSIGNMENT_OVERLAP); same-country half-open policy window overlap (ERR_POLICY_WINDOW_OVERLAP); record period must intersect [start_date, planned_end_date] (ERR_PERIOD_OUTSIDE_ASSIGNMENT); extension date must be strictly forward (ERR_EXTENSION_NOT_FORWARD) and within max_assignment_duration_days (ERR_MAX_DURATION_EXCEEDED)"
    error_id: "ERR_ASSIGNMENT_OVERLAP | ERR_POLICY_WINDOW_OVERLAP | ERR_PERIOD_OUTSIDE_ASSIGNMENT | ERR_EXTENSION_NOT_FORWARD | ERR_MAX_DURATION_EXCEEDED"
    http_status: "409 | 409 | 422 | 422 | 422"
    applies_to: "assignments create; allowance-policies create; shadow-payroll-records create; extension-requests create"
    note: "Within this row, checks evaluate in the order listed in the check text (e.g., on assignment create the duration cap is evaluated before the overlap sweep; on record create the period-window check precedes others)."
  - priority: 10
    category: business_constraint
    check: "Uniqueness and quantity constraints: one open CompensationPackage (ERR_DUPLICATE_PACKAGE), one open PayrollSplit (ERR_DUPLICATE_SPLIT), one open VendorEngagement per year (ERR_DUPLICATE_ENGAGEMENT), one open CertificateOfCoverage (ERR_COC_ALREADY_OPEN), one open Settlement per year (ERR_DUPLICATE_SETTLEMENT), one DRAFT-or-POSTED record per period (ERR_DUPLICATE_PAYROLL_PERIOD); per_diem_days <= days in month (ERR_PER_DIEM_DAYS_INVALID); split percentages sum to exactly 100 (ERR_SPLIT_SUM_INVALID)"
    error_id: "ERR_DUPLICATE_PACKAGE | ERR_DUPLICATE_SPLIT | ERR_DUPLICATE_ENGAGEMENT | ERR_COC_ALREADY_OPEN | ERR_DUPLICATE_SETTLEMENT | ERR_DUPLICATE_PAYROLL_PERIOD | ERR_PER_DIEM_DAYS_INVALID | ERR_SPLIT_SUM_INVALID"
    http_status: "409 | 409 | 409 | 409 | 409 | 409 | 422 | 422"
    applies_to: "entity creation endpoints; shadow-payroll-records create"
    note: "Within this row, checks evaluate in the order the error ids are listed in error_id above."
  - priority: 11
    category: business_temporal
    check: "Cumulative temporal cap: per-diem annual day cap across POSTED records of the tax year (inclusive boundary)"
    error_id: ERR_PER_DIEM_ANNUAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /mobility/shadow-payroll-records/{id}/post"
  - priority: 12
    category: business_referential
    check: "Extension approval coverage gate: when totalization_applies, an ISSUED CertificateOfCoverage with valid_until >= requested_new_end_date must exist"
    error_id: ERR_COC_COVERAGE_GAP
    http_status: 409
    applies_to: "POST /mobility/extension-requests/{id}/approve"
  - priority: 13
    category: business_fiscal
    check: "Cost posture gate: extension approve blocked while Assignment.cost_posture == OVERRUN"
    error_id: ERR_COST_OVERRUN_BLOCKED
    http_status: 409
    applies_to: "POST /mobility/extension-requests/{id}/approve"
  - priority: 14
    category: business_referential
    check: "Repatriation/closure ledger gates: complete-repatriation requires every VendorEngagement FILED or CLOSED (ERR_ENGAGEMENT_NOT_FINAL); close requires every Settlement SETTLED and every ChargebackEntry POSTED or VOIDED (ERR_UNSETTLED_LEDGER)"
    error_id: "ERR_ENGAGEMENT_NOT_FINAL | ERR_UNSETTLED_LEDGER"
    http_status: 409
    applies_to: "POST /mobility/assignments/{id}/complete-repatriation; POST /mobility/assignments/{id}/close"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; default time 2026-08-01T00:00:00Z before first set) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Advancing past a CertificateOfCoverage valid_until sweeps ISSUED -> EXPIRED with its cascade."
    roles: [MobilityAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["CertificateOfCoverage expiry sweep with payroll-split/record cascade"]

  # --- MobilityProgram ---
  - method: POST
    path: "/mobility/programs"
    description: "Create a mobility program"
