            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup_rz_id}", failure_mode_id: "${fm_rz_id}", asserted_amount_cents: 4000000 }
              as: WarrantyAnalyst
              captures: { rec_rz1_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup_rz_id}", failure_mode_id: "${fm_rz_id}", asserted_amount_cents: 1000000 }
              as: WarrantyAnalyst
              captures: { rec_rz2_id: $.data.id }
            - call: "POST /warranty/supplier-recoveries/${rec_rz1_id}/assert"
