              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Subrecipient
              as_user_id: "${np_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: ProgramOfficer
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 80 }
              as: Panelist
              as_user_id: "pan-1"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 85 }
              as: Panelist
              as_user_id: "pan-2"
            - call: "POST /applications/${app_id}/reviews"
              payload: { score: 90 }
              as: Panelist
              as_user_id: "pan-3"
            - call: "POST /applications/${app_id}/award"
              payload: {}
              as: ProgramOfficer
            - call: "GET /subawards"
              payload: { application_id: "${app_id}" }
              as: ProgramOfficer
              captures: { sub_id: "$.data[0].id" }
            - call: "POST /subawards/${sub_id}/budget-lines"
              payload: { category: "PERSONNEL", amount_cents: 10000000, federal_share_pct: 1.0 }
              as: ProgramOfficer
            - call: "POST /subawards/${sub_id}/activate"
              payload: {}
              as: ProgramOfficer
              captures: { sub_v0: $.data.version }
            - call: "POST /subawards/${sub_id}/risk-assessments"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
            - call: "POST /subawards/${sub_id}/drawdowns"
              payload: { requested_amount_cents: 5000000, period_covered_start: "2026-06-01T00:00:00Z", period_covered_end: "2026-06-30T00:00:00Z", expected_subaward_version: "${sub_v0}" }
              as: Subrecipient
              as_user_id: "${np_id}"
              captures: { dd_id: $.data.id }
          trigger:
            - call: "POST /drawdowns/${dd_id}/approve"
              payload: {}
              as: GrantsManager
              as_user_id: "gm-1"
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_SOD_CONFLICT"]

      - name: sod_ok_when_different_manager_approves
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=6]", state_machines.Drawdown.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "A different GrantsManager gm-2 (not the risk-assessor gm-1) approves the drawdown successfully -> status APPROVED."
        test_recipe:
          setup: ["An ACTIVE subaward with a RiskAssessment by gm-1 and one SUBMITTED drawdown of 5000000."]
