              as: CheckpointManager
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - *c_referral_raise
            - call: "POST /screening-referrals/${ref_id}/begin"
              payload: { resolving_officer_id: "${res_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { sod_ref_state: $.data.state, sod_detecting: $.data.detecting_officer_id }
          trigger:
            - call: "POST /staffing-plans/${plan_id}/decision"
              payload: { decision: "APPROVE" }
              as: DutyManager
              as_user_id: planner-1
              expect_status: 403
              captures: { sod_plan_error: $.data.error_id }
            - call: "GET /staffing-plans/${plan_id}"
              payload: {}
              as: DutyManager
              captures: { sod_plan_state: $.data.state, sod_approved_by: $.data.approved_by_user_id }
            - call: "POST /screening-referrals/${ref_id}/resolve"
              payload: { outcome: "CLEARED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              expect_status: 403
              captures: { sod_ref_error: $.data.error_id }
            - call: "POST /staffing-plans/${plan_id}/decision"
              payload: { decision: "APPROVE" }
              as: DutyManager
              as_user_id: duty-1
              captures: { sod_approved: $.data.state, sod_approved_by2: $.data.approved_by_user_id }
            - call: "POST /screening-referrals/${ref_id}/resolve"
              payload: { outcome: "CLEARED" }
              as: ScreeningOfficer
              as_user_id: "${res_id}"
              captures: { sod_ref_cleared: $.data.state }
          assert:
            - "${sod_ref_state} == IN_PROGRESS with ${sod_detecting} == ${sup_id}"
            - "${sod_plan_error} == ERR_SEGREGATION_OF_DUTIES (403) — the acting id equals StaffingPlan.prepared_by_user_id even though the ROLE is correct"
            - "${sod_plan_state} == SUBMITTED and ${sod_approved_by} is null after the refusal"
            - "${sod_ref_error} == ERR_SEGREGATION_OF_DUTIES (403) — the supervisor who detected the referral cannot resolve it, and this outranks nothing else here because outcome CLEARED needs no certification"
            - "${sod_approved} == APPROVED with ${sod_approved_by2} == duty-1"
            - "${sod_ref_cleared} == CLEARED, resolved by the OTHER officer"

      - name: supervisor_certification_gates_lane_open_and_private_screening
        claim_type: role_enforcement
        grounds:
          - validations[priority 18]
          - errors[ERR_SUPERVISOR_CERTIFICATION_REQUIRED]
        distinguishing_aspect: "The gate reads the acting Officer ROW, not the header role: the same SupervisoryOfficer role passes or fails on whether that Officer holds SUPERVISOR. The opaque CheckpointManager performing the identical lane open is never subject to the check, which is the asymmetry an implementation is most likely to miss."
        test_recipe:
          setup: ["an equipped CLOSED lane, one supervisor WITHOUT the SUPERVISOR certification and one with it"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
