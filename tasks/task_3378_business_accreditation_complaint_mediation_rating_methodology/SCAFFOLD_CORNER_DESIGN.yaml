              payload: { legal_name: "Pay Test Micro LLC", home_state_code: "IA", employee_count: 2, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - *k_app_prepaid
            - *k_app_submit
            - *k_app_approve
          trigger:
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 40376 }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 40375 }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { inv_status: $.data.status }
          assert:
            - "payment of 40376 returns 422 ERR_PAYMENT_EXCEEDS_BALANCE and nothing is posted"
            - "payment of 40375 (== balance_cents) succeeds: invoice PAID, balance_cents == 0"
            - "AccreditationApplication.${app_id}.status == ACCREDITED (cascade)"

      - name: refund_exceeding_paid_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors.ERR_REFUND_EXCEEDS_PAID
        distinguishing_aspect: "A REFUND greater than paid_cents - refunded_cents is a 422 ERR_REFUND_EXCEEDS_PAID; refunding the exact net paid amount flips PAID -> REFUNDED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE fee 0; MICRO business founded 2020-01-01; invoice 40375 fully PAID."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - call: "POST /businesses"
              payload: { legal_name: "Refund Test Micro LLC", home_state_code: "IA", employee_count: 2, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - *k_app_prepaid
            - *k_app_submit
            - *k_app_approve
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 40375 }
              as: BusinessRep
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "REFUND", amount_cents: 40376 }
              as: BureauAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "REFUND", amount_cents: 40375 }
              as: BureauAdmin
              captures: { inv_status: $.data.status }
          assert:
            - "refund of 40376 returns 422 ERR_REFUND_EXCEEDS_PAID (net paid is 40375)"
            - "refund of 40375 succeeds: invoice REFUNDED, balance_cents == 40375, refunded_cents == 40375"

      - name: approve_blocked_by_adverse_complaint_history
        claim_type: Violation → Error
        grounds:
          - validations[priority=8]
          - errors.ERR_ADVERSE_COMPLAINT_HISTORY
        distinguishing_aspect: "APPROVE on a business with one UNRESOLVED complaint fails 422 ERR_ADVERSE_COMPLAINT_HISTORY even with clean advertising and no dues issues — complaint history is a hard accreditation gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Bureau IA/NE; consumer; LARGE business founded 2018-01-01; c1 UNRESOLVED (answered then rejected); application SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_bureau
            - *k_consumer
            - *k_biz_large
            - *k_c1_file
            - *k_c1_forward
            - *k_c1_respond
            - *k_c1_reject
            - *k_app_prepaid
            - *k_app_submit
          trigger:
            - call: "POST /accreditation-applications/${app_id}/decision"
