            - call: "POST /credits/${k1_id}/issue"
              payload: { issue_note: "K1 issued - drives the facility over the restrict threshold" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { allocated_peak: $.data.allocated_cents }
            - call: "GET /credits/${k1_id}/allocations"
              payload: { status: "OPEN" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { alloc_id: "$.data[0].id" }
          trigger:
            - call: "POST /credits/${k1_id}/cancel"
              payload: { reason: "Applicant withdrew the underlying purchase order", beneficiary_consent_reference: "BEN-CONSENT-KR-4417" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { allocated_after: $.data.allocated_cents }
          assert:
            - "${allocated_before} == 0"
            - "${allocated_peak} == 95066500"
            - "DocumentaryCredit.${k1_id}.committed_allocation_cents == 95000000"
            - "DocumentaryCredit.${k1_id}.base_commission_cents == 66500"
            - "DocumentaryCredit.${k1_id}.chargeable_utilisation_cents == 95066500"
            - "DocumentaryCredit.${k2_id}.status == ON_HOLD"
            - "DocumentaryCredit.${k3_id}.status == ON_HOLD"
            - "trigger call 1 returns HTTP 200"
            - "DocumentaryCredit.${k1_id}.status == CANCELLED"
            - "FacilityAllocation.${alloc_id}.status == RELEASED"
            - "FacilityAllocation.${alloc_id}.released_cents == 95066500"
            - "FacilityAllocation.${alloc_id}.released_at IS NOT null"
            - "${allocated_after} == 0"
            - "${allocated_after} == ${allocated_before}"
            - "CreditFacility.${fac_id}.available_cents == 100000000"
            - "CreditFacility.${fac_id}.restrict_threshold_cents == 95000000"
            - "CreditFacility.${fac_id}.utilisation_posture == OPEN"
            - "CreditFacility.${fac_id}.status == ACTIVE"
            - "CreditFacility.${fac_id}.suspended_reason IS null"
            - "DocumentaryCredit.${k2_id}.status == APPROVED"
            - "DocumentaryCredit.${k3_id}.status == APPROVED"

      - name: credit_available_cents_conserved_across_two_presentations_and_refusals
        grounds:
          - calculations.credit_drawable_ledger
          - entities.DocumentaryCredit.fields.available_cents
          - entities.DocumentaryCredit.fields.reserved_cents
          - entities.DocumentaryCredit.fields.drawn_settled_cents
          - entities.Presentation.fields.drawn_amount_cents
          - state_machines.Presentation.UNDER_EXAMINATION_to_DISCREPANT
          - state_machines.Presentation.DISCREPANT_to_REFUSED
          - state_machines.Presentation.UNSETTLED_to_VOID
        distinguishing_aspect: |
          The conserved quantity is DocumentaryCredit.available_cents (a CREDIT-level
          drawable ledger), NOT the facility ledger of the sibling instance. Two
          presentations reserve 2000000 and 3000000 in turn and both refusals unwind them
          in the opposite order, so available_cents traces 10000000 -> 8000000 -> 5000000
          -> 7000000 -> 10000000 and lands exactly on its pre-presentation value, while
          CreditFacility.allocated_cents stays pinned at 10025000 throughout - a refusal
          releases the drawing reservation without ever touching facility exposure.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000, collateral_required_pct 0."
            - "One ISSUED SIGHT_PAYMENT credit of amount_cents 10000000, tolerance_pct 0, expiry_date 2026-11-30, latest_shipment_date 2026-10-31, presentation_period_days 21, so max_drawable_cents is 10000000 and chargeable_utilisation_cents is 10025000 (2 quarters at 10 bps gives 20000, floored to the 25000 minimum)."
            - "Clock then moved to Monday 2026-09-14T09:00:00Z."
            - "Presentation P1 carries a single COMMERCIAL_INVOICE of 2000000 and P2 a single COMMERCIAL_INVOICE of 3000000; each also carries the required BILL_OF_LADING."
            - "Both are submitted, examined with one MATERIAL GOODS_DESCRIPTION_MISMATCH discrepancy each, concluded as DISCREPANT and then refused inside the examination period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_id: $.data.id }
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/submit-for-approval"
              payload: { submission_note: "conservation case" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${credit_id}/issue"
              payload: { issue_note: "issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "GET /credits/${credit_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { avail_t0: $.data.available_cents }
            - call: "POST /presentations"
              payload: { credit_id: "${credit_id}", presenting_bank_id: "${bank_id}", cover_letter_reference: "CL-P1" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /presentations/${p1_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-09-08", shipment_date: "2026-09-09", invoice_amount_cents: 2000000, goods_description: "Kiln dried spruce boards", hs_code: "440710", consignee_country: "NO", transit_country_codes: [], issuer_name: "Riga Sawmill SIA" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${p1_id}/documents"
              payload: { doc_type: "BILL_OF_LADING", originals_presented: 1, copies_presented: 1, issue_date: "2026-09-09", shipment_date: "2026-09-09", goods_description: "Kiln dried spruce boards", consignee_country: "NO", transit_country_codes: [], issuer_name: "Baltic Liner Services" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations"
              payload: { credit_id: "${credit_id}", presenting_bank_id: "${bank_id}", cover_letter_reference: "CL-P2" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /presentations/${p2_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-09-10", shipment_date: "2026-09-11", invoice_amount_cents: 3000000, goods_description: "Kiln dried spruce boards", hs_code: "440710", consignee_country: "NO", transit_country_codes: [], issuer_name: "Riga Sawmill SIA" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${p2_id}/documents"
              payload: { doc_type: "BILL_OF_LADING", originals_presented: 1, copies_presented: 1, issue_date: "2026-09-11", shipment_date: "2026-09-11", goods_description: "Kiln dried spruce boards", consignee_country: "NO", transit_country_codes: [], issuer_name: "Baltic Liner Services" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
          trigger:
            - call: "POST /presentations/${p1_id}/submit"
              payload: { submission_note: "P1 to the counters" }
