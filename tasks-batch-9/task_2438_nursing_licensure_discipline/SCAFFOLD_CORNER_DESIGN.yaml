              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
          trigger:
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id, issued_on: $.data.issued_on, expires_on: $.data.expires_on, priv: $.data.multistate_privilege_status, basis: $.data.privilege_basis_state, enc: $.data.encumbrance_status, st: $.data.license_status }
            - call: "GET /license-applications/${app_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { app_state: $.data.status }
            - call: "GET /licenses/${lic_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { re_priv: $.data.multistate_privilege_status, re_expires: $.data.expires_on }
          assert:
            - "the create response already carries ${st} == ACTIVE, ${enc} == CLEAR, ${priv} == MULTISTATE and ${basis} == OH"
            - "${issued_on} == 2026-08-01T00:00:00.000Z and ${expires_on} == 2028-08-01T00:00:00.000Z, twenty-four renewal months later"
            - "${app_state} == ISSUED in the very next read — the parent transition was not deferred"
            - "${re_priv} == ${priv} and ${re_expires} == ${expires_on} — re-reading changes nothing, so no field settles late"
