  # =========================================================================
  # 5. priority_pair_validation_conflict — three instances over three DISJOINT
  #    category pairs: existence vs concurrency, auth vs shape, state vs capacity.
  #    Each instance also fires the losing rule alone as a control step so the
  #    suppression is falsifiable.
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_beats_stale_version_on_vote
        grounds:
          - validations[priority=20]
          - validations[priority=58]
          - concurrency_rules.vote-create-stale-request
          - errors.ERR_REQUEST_NOT_FOUND
          - errors.ERR_STALE_REQUEST_VERSION
        distinguishing_aspect: >-
          Category pair = existence (V03, priority 20) vs concurrency (V21, priority 58) on
          POST /capital/requests/{id}/votes: one call carries BOTH a path id that matches no row
          AND a genuinely stale expected_request_version, and the 404 must win over the 412 — the
          control step proves the same version really is stale by sending it to the real request.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1, asset A1 (adjusted RULS 30.00)."
            - "Cycle C1 plan_year 2027 taken all the way to ALLOCATED so ballots are legal."
            - "Members M1 CHAIR weight 3 and M2 FINANCE weight 2, both system-wide."
            - "Request R1 SCORED; its version is captured BEFORE M1 casts a ballot, and M1's ballot then bumps the version, so the captured value is stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-16", install_date: "2020-08-02T00:00:00Z", expected_life_years: 10, acquisition_cost_cents: 240000000, oem_support_end_date: "2029-01-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_a1_id: $.data.id }
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-05-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/assets/${asset_a1_id}/service-events"
              payload: { event_date: "2026-06-01T00:00:00Z", category: "CORRECTIVE", downtime_hours: 4.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.10, facility_contingency_pct: 0.05 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_id: $.data.id }
            - call: "POST /capital/cycles/${c1_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/committee-members"
              payload: { full_name: "Dana Whitfield", seat: "CHAIR", voting_weight: 3 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { m1_id: $.data.id }
            - call: "POST /capital/committee-members"
              payload: { full_name: "Roy Adeyemi", seat: "FINANCE", voting_weight: 2 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { m2_id: $.data.id }
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c1_id}", department_id: "${dept_a1_id}", asset_id: "${asset_a1_id}", clinical_justification: "CT-16 scanner at end of service life; replacement restores stroke protocol throughput.", current_annual_volume: 1200, projected_annual_volume: 1801, estimated_capital_cents: 250000001, annual_service_contract_cents: 12345678, disposable_unit_cents: 1230, facility_modification_cents: 60000000, regulatory_mandate_flag: true, mandate_deadline: "2027-06-30T00:00:00Z" }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /capital/requests/${r1_id}/submit"
              payload: {}
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
            - call: "POST /capital/requests/${r1_id}/screen"
              payload: { decision: "ACCEPT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c1_id}/close-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/cycles/${c1_id}/score"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/cycles/${c1_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c1_v: $.data.version }
            - call: "POST /capital/cycles/${c1_id}/allocate"
              payload: { allocation_method: "PRO_RATA", expected_cycle_version: "${c1_v}" }
              as: CapitalPlanner
              as_user_id: "planner-alloc"
            - call: "GET /capital/requests/${r1_id}"
              as: CommitteeMember
              as_user_id: "${m1_id}"
              captures: { r1_v_stale: $.data.version }
            - call: "POST /capital/requests/${r1_id}/votes"
              payload: { vote: "APPROVE", expected_request_version: "${r1_v_stale}" }
              as: CommitteeMember
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /capital/requests/00000000-0000-4000-8000-000000000000/votes"
              payload: { vote: "APPROVE", expected_request_version: "${r1_v_stale}" }
              as: CommitteeMember
              as_user_id: "${m2_id}"
              captures: { err_missing: $.data.error_id }
            - call: "POST /capital/requests/${r1_id}/votes"
              payload: { vote: "APPROVE", expected_request_version: "${r1_v_stale}" }
              as: CommitteeMember
              as_user_id: "${m2_id}"
              captures: { err_stale: $.data.error_id }
          assert:
            - "Trigger step 1 returns HTTP 404 with error_id == ERR_REQUEST_NOT_FOUND, NOT 412 / ERR_STALE_REQUEST_VERSION"
            - "Trigger step 2 (same payload, real id) returns HTTP 412 with error_id == ERR_STALE_REQUEST_VERSION, proving the version was genuinely stale"
            - "ReplacementRequest.${r1_id}.status == IN_COMMITTEE (only M1's ballot landed)"
            - "GET /capital/requests/${r1_id}/votes returns exactly one row, with member_id == ${m1_id}, vote == APPROVE, counted_weight == 3, superseded == false"

      - name: auth_beats_shape_on_screen
        grounds:
          - validations[priority=12]
          - validations[priority=40]
          - roles.ClinicalRequester
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_VALIDATION
        distinguishing_aspect: >-
          Category pair = auth (V02, priority 12) vs shape (V07, priority 40) on
          POST /capital/requests/{id}/screen: a ClinicalRequester sends decision "MAYBE", which is
          both a role violation and an out-of-set enum, and the 403 must win over the 422 — a
          different pair and a different endpoint from the existence/concurrency instance.
