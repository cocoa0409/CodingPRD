          - state_machines.Unit.OUT_OF_SERVICE_to_AVAILABLE
        distinguishing_aspect: "AVAILABLE -> OUT_OF_SERVICE -> AVAILABLE round trip recomputes property counters each hop; a second PLACE_OUT_OF_SERVICE while already OUT_OF_SERVICE is rejected (invalid from-state)."
        test_recipe:
          setup: ["property with one AVAILABLE unit"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple Court", address_line: "1 Main St", city: "Springfield", state_code: "IL" }
