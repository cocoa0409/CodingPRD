              payload: { variant: "STRICT_AGENCY" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /support-statements"
              payload: { investigator_id: "${inv_id}", project_id: "${p_id}", agency_code: "NIH", document_type: "BIOSKETCH", declared_person_months: 2.00, declared_appointment_count: 1, declared_support_count: 0 }
