              captures: { offer_id: $.data.id }
            - { call: "POST /pre-award/negotiation-offers/${offer_id}/accept", payload: {}, as: OSPDirector }
            - { call: "POST /pre-award/compliance-reviews/${rev_coi}/disapprove", payload: { reason: "unmanaged conflict" }, as: ComplianceOfficer }
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: OSPSystemAdmin }
            - { call: "GET /pre-award/proposals/${prop_id}/compliance-reviews", payload: {}, as: OSPDirector }
            - { call: "GET /pre-award/proposals/${prop_id}/award-handoffs", payload: {}, as: OSPDirector, captures: { handoff_id: "$.data[0].id" } }
          trigger:
