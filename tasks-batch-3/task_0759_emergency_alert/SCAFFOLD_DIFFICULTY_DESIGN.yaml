            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
