      - name: corner_calc_match_score_rounds_half_up_at_the_fourth_decimal
        claim_type: Precision
        grounds:
          - calculations.cleaner_match_score.precision
          - entities.Assignment.fields.match_score
        distinguishing_aspect: |
          The weighted sum for quality 87.65, home zone and skill 3 against min_skill_level 2 is
          0.5 * 0.8765 + 0.3 * 1.0 + 0.2 * 0.5 == 0.43825 + 0.30000 + 0.10000 == 0.83825,
          whose fifth decimal is exactly 5. round_half_up to 4 places therefore yields 0.8383;
          truncation or banker's rounding would yield 0.8382.
        test_recipe:
          setup:
            - "Property P6 'AUS-106' ZONE_A ONE_BR, 1 bathroom, 1 bed, local_utc_offset_minutes 0, min_skill_level 2 -> required_minutes 140."
            - "Cleaner P (home ZONE_A, skill_level 3, initial_quality_score 87.65) is ACTIVE."
