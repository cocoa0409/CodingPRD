# =============================================================================
# SCAFFOLD.yaml — Election Night Vote Count Collection & Race Calling
# §1.0–§1.7 seed tables (difficulty and corner designs live in sibling files)
# =============================================================================

scenario: |
  Election Night Vote Count Collection & Race Calling (Associated Press): stringer network deployment to county election offices for direct result collection alongside electronic feeds, vote tabulation entry with quality checks against expected precinct counts and historical patterns, race calling decision desk analysis using reported results, outstanding vote estimates by geography and survey data, calling standards requiring certainty that a trailing candidate cannot catch up rather than projections at poll close, recount and contested outcome handling with call retraction procedures, delivery of results to media customers through data feeds with licensing terms, candidate and contest data preparation ahead of election day across thousands of races, primary and special election coverage decisions with resource allocation

domain_name: election-night-race-calling
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - selector_policy
    - pagination_with_filtering
  entity_topology: graph        # ContestCounty many-to-many junction + cross-aggregate FKs
  state_machine_shape: compound # cyclic posture reopen + dual independent dimensions on Contest
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # call proposer may never publish their own call
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ElectionEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_name, type: string, source: input, description: "Human-readable event name, e.g. '2026 General Election'" }
      - { name: event_date, type: string, source: input, description: "Election day as ISO date YYYY-MM-DD; any valid date accepted (may be in the past for historical rehearsals)" }
      - { name: event_type, type: enum, source: input, description: "GENERAL | PRIMARY | SPECIAL | RUNOFF" }
      - { name: total_stringer_hour_budget, type: integer, source: input, description: "Total deployable stringer-hours across all approved coverage decisions for this event; must be >= 1" }
      - { name: stringer_selection_mode, type: enum, source: input, default: "CAREER", description: "CAREER | RECENT_FORM — which reliability variant the assignment auto-selector ranks by" }
      - { name: posture, type: enum, source: system, description: "SETUP | CANDIDATES_LOCKED | LIVE | TABULATION | CERTIFICATION | ARCHIVED — gates every operation below it" }

  - name: County
    parent: ElectionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> ElectionEvent.id; owning event (from path)" }
      - { name: county_fips, type: string, source: input, description: "5-digit FIPS code; unique within the event" }
      - { name: county_name, type: string, source: input, description: "County name" }
      - { name: state_code, type: string, source: input, description: "2-letter USPS state code" }
      - { name: expected_precincts, type: integer, source: input, description: "Total precincts expected to report; must be >= 1" }
      - { name: expected_vote_total, type: integer, source: input, description: "Expected total ballots across all precincts (historical turnout basis); must be >= 1" }
      - { name: survey_turnout_estimate, type: integer, source: input, default: null, description: "Survey-based turnout estimate for election night; nullable" }
      - { name: historical_dem_share, type: number, source: input, default: null, description: "Historical two-party DEM share 0..1 for the swing quality check; nullable (swing check skipped when null)" }
      - { name: reported_precincts, type: integer, source: computed, description: "Sum of precincts_reporting over the latest ACCEPTED VoteReport per linked contest-independent view: maintained per contest in rollup; on the county it reflects the max precincts_reporting among latest ACCEPTED reports naming this county; 0 when none" }
      - { name: status, type: enum, source: computed, description: "PENDING | REPORTING | COMPLETE — PENDING before any ACCEPTED report names this county, REPORTING after, COMPLETE when a linked contest's latest ACCEPTED report for this county has precincts_reporting == expected_precincts" }

  - name: Contest
    parent: ElectionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> ElectionEvent.id; owning event (from path)" }
      - { name: office_name, type: string, source: input, description: "Office on the ballot, e.g. 'US Senator', 'Governor'" }
      - { name: state_code, type: string, source: input, description: "2-letter state this contest is decided in; every linked county must share it" }
      - { name: contest_type, type: enum, source: input, description: "FEDERAL_EXEC | FEDERAL_SENATE | FEDERAL_HOUSE | STATE | BALLOT_MEASURE" }
      - { name: seats, type: integer, source: input, default: 1, description: "Number of winners the contest elects; >= 1" }
      - { name: tabulation_status, type: enum, source: system, description: "AWAITING | REPORTING | COMPLETE — independent state dimension; see state_machines" }
      - { name: call_status, type: enum, source: system, description: "UNCALLED | CALLED — independent state dimension; CALLED means exactly one PUBLISHED RaceCall exists" }
      - { name: called_candidate_id, type: string, source: system, description: "Candidate.id of the called winner while call_status == CALLED; null otherwise" }
      - { name: reported_precincts, type: integer, source: computed, description: "Sum of precincts_reporting over the latest ACCEPTED VoteReport of each linked county; 0 when none" }
      - { name: total_votes, type: integer, source: computed, description: "Sum over candidates of candidate totals from tabulation_rollup; 0 when none" }
      - { name: margin_pct, type: number, source: computed, description: "(top_votes - runner_up_votes) / max(total_votes, 1), 6 decimal places round_half_up; 0.0 when fewer than 2 candidates have votes" }
      - { name: outstanding_estimate, type: integer, source: computed, description: "Sum over linked counties of max(historical_est, survey_est) per outstanding_vote_estimate; recomputed on every report acceptance or void" }

  - name: ContestCounty
    parent: Contest
    common_fields: false
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id; linked contest (from path)" }
      - { name: county_id, type: string, source: input, description: "FK -> County.id; linked county (must belong to the same event as the contest)" }

  - name: Candidate
    parent: Contest
    common_fields: false
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id; owning contest (from path)" }
      - { name: candidate_name, type: string, source: input, description: "Ballot name; unique within the contest" }
      - { name: party, type: enum, source: input, description: "DEM | REP | IND | LIB | GRN | OTHER" }
      - { name: is_incumbent, type: boolean, source: input, default: false, description: "Incumbency flag for desk notes" }

  - name: FeedSource
    parent: ElectionEvent
    common_fields: false
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> ElectionEvent.id; owning event (from path)" }
      - { name: feed_name, type: string, source: input, description: "Electronic feed identifier; unique within the event" }
      - { name: state_codes, type: array, source: input, description: "Array of 2-letter state codes this feed is authorized to report for; non-empty" }
      - { name: priority_tier, type: enum, source: input, default: "SECONDARY", description: "PRIMARY | SECONDARY — desk priority label only" }

  - name: Stringer
    parent: null
    common_fields: true
    fields:
      - { name: stringer_name, type: string, source: input, description: "Full name of the field stringer" }
      - { name: home_state, type: string, source: input, description: "2-letter home state code" }
      - { name: no_show_count, type: integer, source: computed, description: "Lifetime count of assignments transitioned to NO_SHOW; 0 initially" }
      - { name: accepted_report_count, type: integer, source: computed, description: "Lifetime count of authored VoteReports reaching ACCEPTED; 0 initially" }
      - { name: voided_report_count, type: integer, source: computed, description: "Lifetime count of authored VoteReports reaching VOIDED; 0 initially" }
      - { name: reliability_career, type: integer, source: computed, description: "CAREER variant of stringer_reliability_score over all events; 100 initially" }
      - { name: reliability_recent_form, type: integer, source: computed, description: "RECENT_FORM variant of stringer_reliability_score over events dated within 365 days before the evaluated event; 100 initially" }

  - name: StringerAssignment
    parent: ElectionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> ElectionEvent.id; owning event (from path)" }
      - { name: county_id, type: string, source: input, description: "FK -> County.id; county office the stringer is deployed to (same event)" }
      - { name: stringer_id, type: string, source: input, default: null, description: "FK -> Stringer.id; when omitted the server auto-selects per stringer_reliability_score and stringer_selection_mode" }
      - { name: window_start, type: datetime, source: input, description: "Deployment window start (ISO 8601 UTC); must be strictly before window_end" }
      - { name: window_end, type: datetime, source: input, description: "Deployment window end (ISO 8601 UTC); half-open interval [window_start, window_end)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | RELEASED | NO_SHOW" }
      - { name: auto_selected, type: boolean, source: computed, description: "true when stringer_id was chosen by the selector, false when supplied" }

  - name: VoteReport
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id; contest this tabulation entry belongs to (from path)" }
      - { name: county_id, type: string, source: input, description: "FK -> County.id; reporting county (must be linked to the contest via ContestCounty)" }
      - { name: source, type: enum, source: input, description: "STRINGER | FEED — direct stringer collection vs electronic feed" }
      - { name: submitted_by_stringer_id, type: string, source: system, description: "FK -> Stringer.id; set from X-User-ID when source == STRINGER; null for FEED" }
      - { name: precincts_reporting, type: integer, source: input, description: "Precincts included in this entry; 1 <= precincts_reporting <= county.expected_precincts" }
      - { name: candidate_votes, type: array, source: input, description: "Array of { candidate_id, votes } with votes a non-negative integer; every candidate_id must belong to the contest; non-empty" }
      - { name: reported_total, type: integer, source: computed, description: "Sum of votes over candidate_votes" }
      - { name: deviation_ratio, type: number, source: computed, description: "|reported_total - county.expected_vote_total| / county.expected_vote_total, 6 decimal places round_half_up" }
      - { name: swing_deviation, type: number, source: computed, description: "|reported_dem_share - county.historical_dem_share|, 6 decimal places round_half_up; null when county.historical_dem_share is null or the contest has no DEM candidate; reported_dem_share = DEM votes / max(reported_total, 1)" }
      - { name: status, type: enum, source: system, description: "RECEIVED | FLAGGED | ACCEPTED | REJECTED | VOIDED" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock timestamp of the ACCEPT transition; null until accepted; reset to null on VOID" }

  - name: RaceCall
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id; contest being called (from path)" }
      - { name: winner_candidate_id, type: string, source: input, description: "Candidate.id the desk intends to call as winner; validated for membership in the contest at proposal time" }
      - { name: proposed_by, type: string, source: system, description: "X-User-ID of the proposing DecisionAnalyst (opaque operator id)" }
      - { name: published_by, type: string, source: system, description: "X-User-ID of the publishing DecisionDeskChief; null until published" }
      - { name: status, type: enum, source: system, description: "PROPOSED | PUBLISHED | RETRACTED" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publish; null until published" }
      - { name: retract_reason, type: string, source: system, description: "Reason recorded at retraction; null until retracted" }

  - name: RecountCase
    parent: Contest
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id; contested contest (from path)" }
      - { name: status, type: enum, source: system, description: "FILED | ACTIVE | DISMISSED | RESOLVED_CONFIRMED | RESOLVED_OVERTURNED" }
      - { name: filed_margin_pct, type: number, source: computed, description: "Snapshot of Contest.margin_pct at filing time, 6 decimal places round_half_up" }
      - { name: resolution_note, type: string, source: system, description: "Free-text note supplied at RESOLVE; null otherwise" }

  - name: CoverageDecision
    parent: ElectionEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> ElectionEvent.id; owning event (from path)" }
      - { name: contest_id, type: string, source: input, description: "FK -> Contest.id; contest whose coverage is being decided (same event)" }
      - { name: allocated_stringer_hours, type: integer, source: input, description: "Stringer-hours requested for this contest's coverage; >= 1" }
      - { name: coverage_start, type: string, source: input, description: "First coverage day, ISO date; closed interval lower bound" }
      - { name: coverage_end, type: string, source: input, description: "Last coverage day, ISO date; closed interval upper bound; must be >= coverage_start" }
      - { name: rationale, type: string, source: input, default: null, description: "Planner note for the desk" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | DECLINED | FUNDED" }

  - name: MediaCustomer
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Media outlet name" }
      - { name: license_tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM — BASIC receives VOTE_UPDATE content only; CALL and CALL_CREDIT content requires STANDARD or PREMIUM" }
      - { name: licensed_states, type: array, source: input, description: "Array of 2-letter state codes this customer is licensed to receive results for; non-empty" }

  - name: ResultDelivery
    parent: MediaCustomer
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> MediaCustomer.id; recipient customer" }
      - { name: contest_id, type: string, source: system, description: "FK -> Contest.id; contest the content concerns" }
      - { name: content_type, type: enum, source: system, description: "VOTE_UPDATE | CALL | CALL_CREDIT" }
      - { name: fee_cents, type: integer, source: computed, description: "Per-delivery fee computed and rounded at creation per media_invoice_total: round_half_up(base_fee_cents * tier_multiplier); CALL_CREDIT carries the negated fee of the CALL delivery it compensates" }
      - { name: status, type: enum, source: system, description: "SENT | STALE — CALL deliveries flip to STALE when their call is retracted" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }

  - name: MediaInvoice
    parent: MediaCustomer
    common_fields: false
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> MediaCustomer.id; billed customer (from path)" }
      - { name: period, type: string, source: input, description: "Billing month as YYYY-MM; unique per customer" }
      - { name: delivery_count, type: integer, source: computed, description: "Count of the customer's ResultDelivery rows whose delivered_at falls inside the period month (both SENT and STALE rows are billed; CALL_CREDIT rows count)" }
      - { name: total_fee_cents, type: integer, source: computed, description: "Plain sum of fee_cents over those deliveries — no re-rounding at invoice time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ElectionEvent
    initial_state: SETUP
    terminal_states: [ARCHIVED]
    note: "Posture gate for the whole graph. CERTIFICATION -> TABULATION is an automatic reopen cycle driven by recount activation, so the posture machine is cyclic."
    transitions:
      - from: SETUP
        to: CANDIDATES_LOCKED
        trigger: "POST /election-events/{id}/posture-transitions { target_posture: CANDIDATES_LOCKED }"
        actor: ElectionOpsAdmin
        preconditions:
          - "At least one Contest exists in the event"
          - "Every Contest in the event has >= 2 Candidates and >= 1 ContestCounty link"
          - "For event_type PRIMARY or SPECIAL: every Contest has >= 1 CoverageDecision in status APPROVED or FUNDED (GENERAL and RUNOFF events are exempt)"
        side_effects: []
      - from: CANDIDATES_LOCKED
        to: LIVE
        trigger: "POST /election-events/{id}/posture-transitions { target_posture: LIVE }"
        actor: ElectionOpsAdmin
        preconditions:
          - "Logical clock is within the election day: event_dateT00:00:00Z <= current_utc < (event_date + 1 day)T00:00:00Z"
        side_effects: []
      - from: LIVE
        to: TABULATION
        trigger: "POST /election-events/{id}/posture-transitions { target_posture: TABULATION }"
        actor: ElectionOpsAdmin
        preconditions:
          - "At least one VoteReport exists in the event with status in {RECEIVED, FLAGGED, ACCEPTED}"
        side_effects: []
      - from: TABULATION
        to: CERTIFICATION
        trigger: "POST /election-events/{id}/posture-transitions { target_posture: CERTIFICATION }"
        actor: ElectionOpsAdmin
        preconditions:
          - "Every Contest in the event has tabulation_status == COMPLETE"
        side_effects: []
      - from: CERTIFICATION
        to: ARCHIVED
        trigger: "POST /election-events/{id}/posture-transitions { target_posture: ARCHIVED }"
        actor: ElectionOpsAdmin
        preconditions:
          - "No RecountCase in status FILED or ACTIVE exists for any Contest of the event"
        side_effects: []
      - from: CERTIFICATION
        to: TABULATION
        trigger: "system: automatic when a RecountCase of a contest of this event transitions FILED -> ACTIVE while posture is CERTIFICATION"
        actor: system
        preconditions:
          - "The activating RecountCase exists and moves to ACTIVE"
        side_effects:
          - "Every Contest with an ACTIVE RecountCase: tabulation_status COMPLETE -> REPORTING (reopens the contest for corrected reports)"
        note: "This is the posture reopen cycle: CERTIFICATION -> TABULATION -> CERTIFICATION may repeat as recounts activate and resolve."

  - entity: Contest
    initial_state: "tabulation_status=AWAITING, call_status=UNCALLED"
    terminal_states: []
    note: "Two independent state dimensions on one entity. tabulation_status: AWAITING -> REPORTING -> COMPLETE with COMPLETE -> REPORTING reopens. call_status: UNCALLED -> CALLED -> UNCALLED cycle via publish/retract. The dimensions evolve independently: retracting a call never changes tabulation_status."
    transitions:
      - from: "tabulation_status=AWAITING"
        to: "tabulation_status=REPORTING"
        trigger: "system: first VoteReport created for this contest (any resulting status)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "tabulation_status=REPORTING"
        to: "tabulation_status=COMPLETE"
        trigger: "system: after tabulation_rollup recompute (on VoteReport ACCEPT) when every linked ContestCounty county has a latest ACCEPTED report with precincts_reporting == county.expected_precincts"
        actor: system
        preconditions:
          - "All linked counties complete per tabulation_rollup"
        side_effects:
          - "Contest.reported_precincts / total_votes / margin_pct / outstanding_estimate recomputed (outstanding_estimate becomes 0 for fully-reported counties)"
      - from: "tabulation_status=COMPLETE"
        to: "tabulation_status=REPORTING"
        trigger: "system: (a) a VoteReport of a linked county transitions ACCEPTED -> VOIDED leaving that county without a complete latest ACCEPTED report; (b) the event's CERTIFICATION -> TABULATION reopen touches this contest"
        actor: system
        preconditions: []
        side_effects:
          - "Contest computed fields recomputed from tabulation_rollup"
      - from: "call_status=UNCALLED"
        to: "call_status=CALLED"
        trigger: "POST /calls/{id}/decisions { action: PUBLISH } on a PROPOSED RaceCall of this contest"
        actor: DecisionDeskChief
        preconditions:
          - "Event posture == TABULATION"
          - "tabulation_status in {REPORTING, COMPLETE}"
          - "call_status == UNCALLED (else ERR_CALL_ALREADY_PUBLISHED)"
          - "No RecountCase of this contest in status ACTIVE (else ERR_RECOUNT_ACTIVE_BLOCKS_CALL)"
          - "publisher X-User-ID != RaceCall.proposed_by (else ERR_SEGREGATION_OF_DUTIES)"
          - "call_certainty_evaluation passes for winner_candidate_id (else ERR_CERTAINTY_NOT_MET)"
        side_effects:
          - "Contest.called_candidate_id := RaceCall.winner_candidate_id"
          - "Create one CALL ResultDelivery per MediaCustomer with contest.state_code in licensed_states and license_tier in {STANDARD, PREMIUM}; fee per media_invoice_total pricing"
          - "RaceCall.published_at := current_utc; published_by := publisher X-User-ID"
      - from: "call_status=CALLED"
        to: "call_status=UNCALLED"
        trigger: "POST /calls/{id}/decisions { action: RETRACT } on the PUBLISHED RaceCall, or system: RecountCase resolve OVERTURNED"
        actor: "DecisionDeskChief | system"
        preconditions: []
        side_effects:
          - "Contest.called_candidate_id := null"
          - "Every ResultDelivery of this contest with content_type CALL and status SENT -> STALE"
          - "Create one CALL_CREDIT ResultDelivery per customer that received such a CALL delivery, fee_cents := negation of the original CALL delivery's fee_cents, status SENT"

  - entity: VoteReport
    initial_state: "RECEIVED or FLAGGED (qc_deviation_check runs at creation; FLAGGED when it fails)"
    terminal_states: [VOIDED]
    note: "REJECTED -> RECEIVED|FLAGGED via resubmit makes this machine cyclic. Only ACCEPTED reports feed tabulation_rollup."
    transitions:
      - from: "(creation)"
        to: "RECEIVED | FLAGGED"
        trigger: "POST /contests/{id}/vote-reports"
        actor: "Stringer | FeedOperator"
        preconditions:
          - "Event posture in {LIVE, TABULATION} (else ERR_POSTURE_FORBIDS)"
          - "contest.tabulation_status in {AWAITING, REPORTING, COMPLETE}"
          - "source == STRINGER requires an ACTIVE StringerAssignment for (X-User-ID stringer, county_id, event) (else ERR_STRINGER_NOT_DEPLOYED)"
          - "source == FEED requires a FeedSource of the event whose state_codes contains the county's state_code (else ERR_FEED_COVERAGE_MISSING)"
          - "precincts_reporting <= county.expected_precincts (else ERR_PRECINCTS_EXCEED_EXPECTED)"
          - "every candidate_votes entry references a Candidate of this contest (else ERR_CANDIDATE_NOT_IN_CONTEST)"
          - "expected_contest_version matches Contest.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Contest.version increments by 1"
          - "If contest.tabulation_status was AWAITING: AWAITING -> REPORTING"
          - "qc_deviation_check computes deviation_ratio and swing_deviation; status := FLAGGED when deviation_ratio > QC_VOTE_DEVIATION_PCT or swing_deviation > QC_SWING_PCT, else RECEIVED"
      - from: "RECEIVED | FLAGGED"
        to: ACCEPTED
        trigger: "POST /vote-reports/{id}/review-decisions { decision: ACCEPT }"
        actor: TabulationClerk
        preconditions:
          - "Event posture in {LIVE, TABULATION, CERTIFICATION}"
        side_effects:
          - "accepted_at := current_utc"
          - "tabulation_rollup recompute for the contest (may drive tabulation_status REPORTING -> COMPLETE)"
          - "Create one VOTE_UPDATE ResultDelivery per MediaCustomer with county.state_code in licensed_states (all tiers)"
          - "If source == STRINGER: author Stringer.accepted_report_count += 1 and stringer_reliability_score recompute"
      - from: "RECEIVED | FLAGGED"
        to: REJECTED
        trigger: "POST /vote-reports/{id}/review-decisions { decision: REJECT }"
        actor: TabulationClerk
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: "RECEIVED | FLAGGED"
        trigger: "POST /vote-reports/{id}/resubmit with corrected precincts_reporting and candidate_votes"
        actor: "Stringer | FeedOperator"
        preconditions:
          - "Event posture in {LIVE, TABULATION}"
          - "source == STRINGER requires the original author stringer (X-User-ID == submitted_by_stringer_id); source == FEED any FeedOperator"
          - "Same precincts and candidate membership bounds as creation"
        side_effects:
          - "qc_deviation_check re-runs; status := FLAGGED or RECEIVED by the same rule as creation"
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /vote-reports/{id}/review-decisions { decision: VOID }"
        actor: TabulationClerk
        preconditions: []
        side_effects:
          - "accepted_at := null"
          - "tabulation_rollup recompute for the contest; if a linked county loses its complete latest ACCEPTED report, contest tabulation_status COMPLETE -> REPORTING"
          - "If source == STRINGER: author Stringer.voided_report_count += 1 and stringer_reliability_score recompute"
        note: "VOID compensates ACCEPT exactly: tabulation_rollup ignores VOIDED reports, so contest totals return to their pre-acceptance values."

  - entity: StringerAssignment
    initial_state: SCHEDULED
    terminal_states: [NO_SHOW]
    note: "RELEASED -> ACTIVE redeploy makes this machine cyclic; NO_SHOW is absorbing."
    transitions:
      - from: "(creation)"
        to: SCHEDULED
        trigger: "POST /election-events/{id}/assignments"
        actor: StringerCoordinator
        preconditions:
          - "Event posture in {SETUP, CANDIDATES_LOCKED} (else ERR_POSTURE_FORBIDS)"
          - "county belongs to the same event (else ERR_CROSS_EVENT_REFERENCE)"
          - "window_start < window_end (else ERR_INVALID_REQUEST)"
          - "No other assignment of the same stringer in status {SCHEDULED, ACTIVE} whose half-open window [window_start, window_end) overlaps the requested one; touching endpoints are allowed (else ERR_ASSIGNMENT_WINDOW_OVERLAP)"
          - "When stringer_id omitted: auto-select among Stringers with no overlapping {SCHEDULED, ACTIVE} assignment, ranked by the event's stringer_selection_mode reliability variant DESC, tie-break Stringer.created_at ASC; empty pool -> ERR_NO_ELIGIBLE_STRINGER"
        side_effects:
          - "auto_selected := true when the selector ran"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /assignments/{id}/check-in"
        actor: Stringer
        preconditions:
          - "X-User-ID == assignment.stringer_id (else ERR_UNAUTHORIZED_ROLE)"
          - "Event posture in {LIVE, TABULATION} (else ERR_POSTURE_FORBIDS)"
          - "window_start <= current_utc < window_end (else ERR_OUTSIDE_ASSIGNMENT_WINDOW)"
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /assignments/{id}/status-actions { action: RELEASE }"
        actor: StringerCoordinator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /assignments/{id}/status-actions { action: NO_SHOW }"
        actor: StringerCoordinator
        preconditions:
          - "current_utc >= window_end (else ERR_OUTSIDE_ASSIGNMENT_WINDOW)"
        side_effects:
          - "Stringer.no_show_count += 1 and stringer_reliability_score recompute"
      - from: RELEASED
        to: ACTIVE
        trigger: "POST /assignments/{id}/status-actions { action: REDEPLOY }"
        actor: StringerCoordinator
        preconditions:
          - "current_utc < window_end (else ERR_OUTSIDE_ASSIGNMENT_WINDOW)"
        side_effects: []

  - entity: RaceCall
    initial_state: PROPOSED
    terminal_states: [RETRACTED]
    transitions:
      - from: "(creation)"
        to: PROPOSED
        trigger: "POST /contests/{id}/calls"
        actor: DecisionAnalyst
        preconditions:
          - "Event posture == TABULATION (else ERR_POSTURE_FORBIDS)"
          - "winner_candidate_id belongs to the contest (else ERR_CANDIDATE_NOT_IN_CONTEST)"
          - "expected_contest_version matches Contest.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Contest.version increments by 1"
          - "proposed_by := X-User-ID"
      - from: PROPOSED
        to: PUBLISHED
        trigger: "POST /calls/{id}/decisions { action: PUBLISH }"
        actor: DecisionDeskChief
        preconditions: ["See Contest call_status UNCALLED -> CALLED transition — all its preconditions apply"]
        side_effects: ["Drives Contest UNCALLED -> CALLED with all its side_effects"]
      - from: PROPOSED
        to: RETRACTED
        trigger: "POST /calls/{id}/decisions { action: RETRACT, reason }"
        actor: DecisionDeskChief
        preconditions: []
        side_effects:
          - "retract_reason := reason (no delivery fan-out: nothing was published)"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /calls/{id}/decisions { action: RETRACT, reason } or system: RecountCase RESOLVE with outcome OVERTURNED"
        actor: "DecisionDeskChief | system"
        preconditions: []
        side_effects:
          - "retract_reason := reason (or 'RECOUNT_OVERTURNED' when system-driven)"
          - "Drives Contest CALLED -> UNCALLED with all its side_effects"

  - entity: RecountCase
    initial_state: FILED
    terminal_states: [DISMISSED, RESOLVED_CONFIRMED, RESOLVED_OVERTURNED]
    transitions:
      - from: "(creation)"
        to: FILED
        trigger: "POST /contests/{id}/recount-cases"
        actor: RecountOfficer
        preconditions:
          - "Event posture in {TABULATION, CERTIFICATION} (else ERR_POSTURE_FORBIDS)"
          - "contest.tabulation_status == COMPLETE (else ERR_INVALID_STATE)"
          - "contest.margin_pct <= RECOUNT_MARGIN_THRESHOLD (else ERR_RECOUNT_MARGIN_EXCEEDED)"
        side_effects:
          - "filed_margin_pct := contest.margin_pct snapshot"
      - from: FILED
        to: ACTIVE
        trigger: "POST /recount-cases/{id}/decisions { action: ACTIVATE }"
        actor: RecountOfficer
        preconditions: []
        side_effects:
          - "If event posture == CERTIFICATION: event CERTIFICATION -> TABULATION and contest tabulation_status COMPLETE -> REPORTING"
      - from: FILED
        to: DISMISSED
        trigger: "POST /recount-cases/{id}/decisions { action: DISMISS, note? }"
        actor: RecountOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RESOLVED_CONFIRMED
        trigger: "POST /recount-cases/{id}/decisions { action: RESOLVE, outcome: CONFIRMED, note? }"
        actor: RecountOfficer
        preconditions: []
        side_effects:
          - "resolution_note := note"
      - from: ACTIVE
        to: RESOLVED_OVERTURNED
        trigger: "POST /recount-cases/{id}/decisions { action: RESOLVE, outcome: OVERTURNED, note? }"
        actor: RecountOfficer
        preconditions: []
        side_effects:
          - "resolution_note := note"
          - "Cascade hop 1: the contest's PUBLISHED RaceCall (if any) -> RETRACTED with retract_reason 'RECOUNT_OVERTURNED'"
          - "Cascade hop 2 (from hop 1): Contest call_status CALLED -> UNCALLED, called_candidate_id := null"
          - "Cascade hop 3 (from hop 2): CALL deliveries of the contest -> STALE and compensating CALL_CREDIT deliveries created"

  - entity: CoverageDecision
    initial_state: PROPOSED
    terminal_states: [FUNDED]
    note: "DECLINED -> PROPOSED revise loop makes this machine cyclic."
    transitions:
      - from: "(creation)"
        to: PROPOSED
        trigger: "POST /election-events/{id}/coverage-decisions"
        actor: CoveragePlanner
        preconditions:
          - "Event posture in {SETUP, CANDIDATES_LOCKED} (else ERR_POSTURE_FORBIDS)"
          - "contest belongs to the same event (else ERR_CROSS_EVENT_REFERENCE)"
          - "coverage_start <= coverage_end (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /coverage-decisions/{id}/review { decision: APPROVE }"
        actor: ElectionOpsAdmin
        preconditions:
          - "Aggregate budget: sum of allocated_stringer_hours over the event's CoverageDecisions in {APPROVED, FUNDED} whose closed interval [coverage_start, coverage_end] intersects this decision's closed interval, plus this decision's hours, <= event.total_stringer_hour_budget (else ERR_COVERAGE_BUDGET_EXCEEDED)"
        side_effects: []
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /coverage-decisions/{id}/review { decision: DECLINE }"
        actor: ElectionOpsAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: FUNDED
        trigger: "POST /coverage-decisions/{id}/review { decision: FUND }"
        actor: ElectionOpsAdmin
        preconditions:
          - "Aggregate budget check re-run as in PROPOSED -> APPROVED"
        side_effects: []
      - from: DECLINED
        to: PROPOSED
        trigger: "POST /coverage-decisions/{id}/revise with new hours and/or coverage dates"
        actor: CoveragePlanner
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: vote-report-stale-contest
    parent_entity: Contest
    write_endpoint: "POST /contests/{id}/vote-reports"
    occ_field: expected_contest_version
    description: |
      Submitting a VoteReport against a Contest whose version has advanced
      since the client last observed it is rejected. A prior accepted
      submission (or a call proposal) legitimately advanced the Contest's
      rollups and version, so the current writer's view of the contest is
      stale and must be re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: call-propose-stale-contest
    parent_entity: Contest
    write_endpoint: "POST /contests/{id}/calls"
    occ_field: expected_contest_version
    description: |
      Proposing a RaceCall against a Contest whose version has advanced
      since the analyst last observed it is rejected. The desk's certainty
      reasoning is only valid against the rollup state the analyst read;
      an intervening vote report or proposal advanced that state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tabulation_rollup
    trigger: "On VoteReport ACCEPT (forward) and VOID (compensation); also recomputed whenever read via GET /contests/{id}/tabulation"
    algorithm: aggregation
    formula: |
      For contest C with linked counties K = ContestCounty.county_id set:
        for each county k in K:
          latest[k] = ACCEPTED VoteReport of (C, k) with the greatest accepted_at;
                      tie-break: greatest created_at (never id).
          If no ACCEPTED report exists for (C, k): latest[k] = none.
        candidate_total[c] = sum over k of latest[k].candidate_votes[c] (missing entries count 0)
        reported_precincts = sum over k of latest[k].precincts_reporting (none counts 0)
        total_votes = sum over c of candidate_total[c]
        rank candidates by candidate_total DESC, tie-break Candidate.created_at ASC
        margin_pct = (top - second) / max(total_votes, 1) when >= 2 candidates have votes else 0.0
        county_complete[k] = latest[k] exists and latest[k].precincts_reporting == k.expected_precincts
        contest COMPLETE iff county_complete[k] for every k in K (and K non-empty)
      Only status == ACCEPTED reports ever enter; RECEIVED / FLAGGED / REJECTED / VOIDED excluded.
    input_set: "VoteReports of the contest with status ACCEPTED only, latest per county by accepted_at DESC then created_at DESC"
    constants: {}
    precision: "margin_pct 6 decimal places, round_half_up; vote fields are integers"

  - name: outstanding_vote_estimate
    trigger: "Recomputed on every tabulation_rollup run and on tabulation read"
    algorithm: forward_looking
    formula: |
      For each linked county k with latest ACCEPTED report r (or none):
        precincts_reported_k = r.precincts_reporting when r exists else 0
        votes_reported_k = r.reported_total when r exists else 0
        historical_est_k = floor( expected_vote_total_k * (expected_precincts_k - precincts_reported_k) / expected_precincts_k )
        survey_est_k = max( survey_turnout_estimate_k - votes_reported_k, 0 ) when survey_turnout_estimate_k is not null,
                       else historical_est_k
        outstanding_est_k = max( historical_est_k, survey_est_k )
      contest.outstanding_estimate = sum over k of outstanding_est_k
    input_set: "Latest ACCEPTED VoteReport per linked county (same selection as tabulation_rollup)"
    constants: {}
    precision: "integer votes; historical_est uses floor on the product ratio"
    variants:
      - name: historical
        when: "Geographic-historical basis: remaining precinct share of expected_vote_total"
        difference: "historical_est_k = expected_vote_total * remaining_precinct_share — scales with precincts, ignores survey"
      - name: survey
        when: "Survey basis: survey turnout minus votes already reported"
        difference: "survey_est_k = survey_turnout_estimate - votes_reported (floor 0) — independent of expected_precincts; falls back to historical when survey is null; the two variants produce different values for identical reported data whenever survey_turnout_estimate != expected_vote_total * reported_share, and the desk standard consumes max() of the two"

  - name: call_certainty_evaluation
    trigger: "Evaluated at POST /calls/{id}/decisions { action: PUBLISH } time, never at proposal"
    algorithm: threshold
    formula: |
      Let W = winner_candidate_id of the RaceCall, s = contest.seats.
      Compute candidate_total[.] and the ranking from tabulation_rollup.
      outstanding = contest.outstanding_estimate (max of the two estimate variants per county).
      Single-seat (s == 1):
        callable(W) iff for EVERY other candidate T: candidate_total[W] > candidate_total[T] + outstanding
        (strict >: exact equality means the trailing candidate could still tie, and a tie is not certainty)
      Multi-seat (s > 1):
        let V_next = candidate_total of the candidate ranked (s+1)-th; if fewer than s+1 candidates
        have any votes, callable(W) iff candidate_total[W] > 0.
        Otherwise callable(W) iff candidate_total[W] > V_next + outstanding AND rank(W) <= s.
      BALLOT_MEASURE branch: candidates are the YES/NO options; apply the single-seat rule
        regardless of seats.
      Any failure -> ERR_CERTAINTY_NOT_MET; the standard is certainty that no trailing
      candidate can catch up on the outstanding vote, never a projection from poll-close timing.
    input_set: "Contest rollup fields plus outstanding_estimate"
    constants: {}
    precision: "integer vote arithmetic; strict inequality"

  - name: qc_deviation_check
    trigger: "On VoteReport creation and on resubmit"
    algorithm: threshold
    formula: |
      deviation_ratio = |reported_total - county.expected_vote_total| / county.expected_vote_total
      swing_deviation = |reported_dem_share - county.historical_dem_share|
        where reported_dem_share = (votes of the contest's DEM candidate) / max(reported_total, 1);
        computed only when county.historical_dem_share is not null AND a DEM candidate exists in
        the contest AND reported_total > 0, else null.
      FLAGGED iff deviation_ratio > QC_VOTE_DEVIATION_PCT
              OR (swing_deviation is not null AND swing_deviation > QC_SWING_PCT)
      Both thresholds are strict: deviation_ratio == 0.400000 exactly does NOT flag.
      Hard rejections at intake (not flags): precincts_reporting > expected_precincts,
      unknown candidate_id, negative votes.
    input_set: "The single incoming VoteReport plus its County configuration"
    constants:
      QC_VOTE_DEVIATION_PCT: 0.40
      QC_SWING_PCT: 0.25
    precision: "6 decimal places, round_half_up"

  - name: stringer_reliability_score
    trigger: "On Stringer creation (both scores := 100) and on every assignment NO_SHOW / report ACCEPT / report VOID touching the stringer"
    algorithm: decay_function
    formula: |
      Let events_considered(variant) be:
        CAREER: every ElectionEvent in which the stringer holds or held any assignment
        RECENT_FORM: those events whose event_date > (current event's event_date - 365 days),
                     where 'current event' is the event the score is being evaluated for
                     (assignment selection or read); a bare GET /stringers/{id} evaluates
                     against the greatest event_date among the stringer's assignments,
                     or wall-clock-free default 2026-09-01 when the stringer has none.
      score = clamp(100 - 25 * no_shows - 10 * voided_reports + 2 * accepted_reports, 0, 100)
      where each count is taken over events_considered(variant).
    input_set: "StringerAssignment NO_SHOW marks and authored VoteReport ACCEPT/VOID outcomes, filtered per variant window"
    constants:
      NO_SHOW_PENALTY: 25
      VOIDED_PENALTY: 10
      ACCEPTED_CREDIT: 2
      SCORE_FLOOR: 0
      SCORE_CAP: 100
      RECENT_WINDOW_DAYS: 365
    precision: "integer"
    variants:
      - name: CAREER
        when: "All-time record"
        difference: "Includes every event; the default ranking variant"
      - name: RECENT_FORM
        when: "Only events dated within 365 days before the evaluated event's event_date"
        difference: "Old NO_SHOWs age out; a stringer with a no-show 2 years ago and clean recent record scores 100 RECENT_FORM but 75 CAREER"

  - name: media_invoice_total
    trigger: "Per-delivery fee fixed at ResultDelivery creation; invoice aggregated on POST /media-customers/{id}/invoices"
    algorithm: aggregation
    formula: |
      At ResultDelivery creation (per-delivery rounding, pinned order — round THEN sum):
        base = VOTE_UPDATE_BASE_FEE_CENTS when content_type == VOTE_UPDATE
             | CALL_BASE_FEE_CENTS when content_type == CALL
        fee_cents = round_half_up(base * tier_multiplier(customer.license_tier))
        CALL_CREDIT: fee_cents = -(fee_cents of the CALL delivery it compensates), exact negation.
      At invoice generation for (customer, period YYYY-MM):
        deliveries = the customer's ResultDelivery rows with delivered_at inside that calendar month
          (UTC), regardless of SENT/STALE status
        delivery_count = count(deliveries)
        total_fee_cents = sum of fee_cents over deliveries — a plain integer sum of already
          rounded per-delivery fees. Summing unrounded products and rounding once at the end
          is FORBIDDEN: e.g. 3 BASIC VOTE_UPDATEs bill 3 * round(999 * 0.35) = 3 * 350 = 1050,
          not round(3 * 999 * 0.35) = round(1048.95) = 1049.
      period uniqueness: at most one MediaInvoice per (customer_id, period); second POST
        for the same pair -> ERR_DUPLICATE_INVOICE.
    input_set: "ResultDelivery rows of the customer filtered by delivered_at month == period"
    constants:
      VOTE_UPDATE_BASE_FEE_CENTS: 999
      CALL_BASE_FEE_CENTS: 4999
      TIER_MULT_PREMIUM: 1.0
      TIER_MULT_STANDARD: 0.6
      TIER_MULT_BASIC: 0.35
    precision: "per-delivery round_half_up to whole cents; invoice total is an integer sum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-blank"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is among the endpoint's declared roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: a Stringer acting on a StringerAssignment must satisfy X-User-ID == assignment.stringer_id; a MediaCustomer reading /media-customers/{id}/... must satisfy X-User-ID == that customer's id"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "POST /assignments/{id}/check-in, POST /vote-reports/{id}/resubmit, GET /media-customers/{id}, GET /media-customers/{id}/deliveries, POST /media-customers/{id}/invoices, GET /media-customers/{id}/invoices"
  - priority: 4
    category: existence
    check: "Path template ids resolve left to right: event -> contest/county -> child resources; every referenced id must exist"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "all (the specific ERR_*_NOT_FOUND matches the first unresolved segment: ERR_CONTEST_NOT_FOUND, ERR_COUNTY_NOT_FOUND, ERR_STRINGER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_CALL_NOT_FOUND, ERR_RECOUNT_NOT_FOUND, ERR_DECISION_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND)"
  - priority: 5
    category: state
    check: "Endpoint posture gate: county/contest/candidate/county-link/feed creation and PATCH /contests/{id} require SETUP; assignment & coverage-decision creation require SETUP or CANDIDATES_LOCKED; check-in and vote-report submission/resubmit require LIVE or TABULATION; call proposal/publish require TABULATION; recount filing requires TABULATION or CERTIFICATION"
    error_id: ERR_POSTURE_FORBIDS
    http_status: 409
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "Entity state preconditions: transition's from-state must hold (ERR_INVALID_STATE); publish into an already-CALLED contest (ERR_CALL_ALREADY_PUBLISHED); publish while a RecountCase of the contest is ACTIVE (ERR_RECOUNT_ACTIVE_BLOCKS_CALL)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (sub-order within this priority: ERR_RECOUNT_ACTIVE_BLOCKS_CALL and ERR_CALL_ALREADY_PUBLISHED before generic ERR_INVALID_STATE)"
  - priority: 7
    category: state
    check: "OCC: expected_contest_version must equal the Contest's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /contests/{id}/vote-reports, POST /contests/{id}/calls"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: publisher X-User-ID must differ from RaceCall.proposed_by"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /calls/{id}/decisions with action PUBLISH"
  - priority: 9
    category: business_safety
    check: "Calling standard: call_certainty_evaluation must pass for winner_candidate_id at publish time"
    error_id: ERR_CERTAINTY_NOT_MET
    http_status: 422
    applies_to: "POST /calls/{id}/decisions with action PUBLISH"
  - priority: 10
    category: business_referential
    check: "Cross-event reference: county_id / contest_id supplied to a nested creation must belong to the path's event"
    error_id: ERR_CROSS_EVENT_REFERENCE
    http_status: 422
    applies_to: "POST /election-events/{id}/assignments, POST /election-events/{id}/coverage-decisions, POST /contests/{id}/county-links"
  - priority: 11
    category: business_referential
    check: "Membership: winner_candidate_id / candidate_votes entries must belong to the contest; vote-report county_id must be linked to the contest via ContestCounty"
    error_id: ERR_CANDIDATE_NOT_IN_CONTEST
    http_status: 422
    applies_to: "POST /contests/{id}/calls, POST /contests/{id}/vote-reports, POST /vote-reports/{id}/resubmit (ERR_COUNTY_NOT_IN_CONTEST for the county-link case)"
  - priority: 12
    category: business_referential
    check: "Collection authority: source STRINGER requires an ACTIVE assignment covering (stringer, county, event); source FEED requires a FeedSource covering the county's state"
    error_id: ERR_STRINGER_NOT_DEPLOYED
    http_status: 422
    applies_to: "POST /contests/{id}/vote-reports (ERR_FEED_COVERAGE_MISSING for the feed case)"
  - priority: 13
    category: business_temporal
    check: "Interval well-formedness: window_start < window_end; coverage_start <= coverage_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /election-events/{id}/assignments, POST /election-events/{id}/coverage-decisions, POST /coverage-decisions/{id}/revise"
  - priority: 14
    category: business_temporal
    check: "Stringer window overlap: no second {SCHEDULED, ACTIVE} assignment for the same stringer with overlapping half-open [window_start, window_end); touching endpoints do not overlap"
    error_id: ERR_ASSIGNMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /election-events/{id}/assignments"
  - priority: 15
    category: business_temporal
    check: "Clock vs window: check-in requires window_start <= current_utc < window_end; NO_SHOW requires current_utc >= window_end; REDEPLOY requires current_utc < window_end"
    error_id: ERR_OUTSIDE_ASSIGNMENT_WINDOW
    http_status: 409
    applies_to: "POST /assignments/{id}/check-in, POST /assignments/{id}/status-actions"
  - priority: 16
    category: business_constraint
    check: "Payload shape: required fields present, enum values in range, integers in range (expected_precincts >= 1, votes >= 0, allocated_stringer_hours >= 1, candidate_votes non-empty, state_codes / licensed_states non-empty)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 17
    category: business_constraint
    check: "Uniqueness: county_fips per event; feed_name per event; candidate_name per contest; (contest_id, county_id) link; (customer_id, period) invoice"
    error_id: ERR_DUPLICATE_COUNTY
    http_status: 409
    applies_to: "creation endpoints (ERR_DUPLICATE_FEED, ERR_DUPLICATE_CANDIDATE, ERR_DUPLICATE_COUNTY_LINK, ERR_DUPLICATE_INVOICE respectively)"
  - priority: 18
    category: business_constraint
    check: "Bounds and selector: precincts_reporting <= expected_precincts (ERR_PRECINCTS_EXCEED_EXPECTED); assignment auto-select with an empty eligible pool (ERR_NO_ELIGIBLE_STRINGER)"
    error_id: ERR_PRECINCTS_EXCEED_EXPECTED
    http_status: 422
    applies_to: "POST /contests/{id}/vote-reports, POST /vote-reports/{id}/resubmit, POST /election-events/{id}/assignments"
  - priority: 19
    category: business_fiscal
    check: "Coverage budget: aggregate allocated_stringer_hours over intersecting closed intervals in {APPROVED, FUNDED} plus this decision must be <= event.total_stringer_hour_budget"
    error_id: ERR_COVERAGE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /coverage-decisions/{id}/review with decision APPROVE or FUND"
  - priority: 20
    category: business_fiscal
    check: "License gating: a BASIC-tier MediaCustomer may not query content_type CALL or CALL_CREDIT on the deliveries feed"
    error_id: ERR_LICENSE_TIER_FORBIDS
    http_status: 403
    applies_to: "GET /media-customers/{id}/deliveries"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server clock to the given ISO 8601 UTC instant (any direction). At server startup, before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ElectionOpsAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["All 'current_utc' reads below use this value"]

  - method: POST
    path: "/election-events"
    description: "Create an election event in posture SETUP"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [event_name, event_date, event_type, total_stringer_hour_budget, "stringer_selection_mode?"]
    output: ElectionEvent
    side_effects: []

  - method: GET
    path: "/election-events/{id}"
    description: "Read one election event including posture"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: []
    output: ElectionEvent
    side_effects: []

  - method: POST
    path: "/election-events/{id}/posture-transitions"
    description: "Advance the event posture; target must be the declared next state per the ElectionEvent machine (CERTIFICATION -> TABULATION is system-only and rejected here)"
    roles: [ElectionOpsAdmin]
    code: 200
    input: [target_posture]
    output: ElectionEvent
    side_effects: ["Posture transition per state_machines.ElectionEvent; increments ElectionEvent.version by 1"]

  - method: POST
    path: "/election-events/{id}/counties"
    description: "Register a reporting county with expected precinct/vote baselines (SETUP only)"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [county_fips, county_name, state_code, expected_precincts, expected_vote_total, "survey_turnout_estimate?", "historical_dem_share?"]
    output: County
    side_effects: []

  - method: GET
    path: "/election-events/{id}/counties"
    description: "List counties of the event (FK reverse reachability for County.event_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: County[]
    side_effects: []

  - method: GET
    path: "/counties/{id}"
    description: "Read one county including computed reported_precincts and status"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: []
    output: County
    side_effects: []

  - method: POST
    path: "/election-events/{id}/contests"
    description: "Create a contest (race) in the event (SETUP only); starts AWAITING / UNCALLED with zeroed computed fields"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [office_name, state_code, contest_type, "seats?"]
    output: Contest
    side_effects: []

  - method: GET
    path: "/election-events/{id}/contests"
    description: "List contests of the event, filterable by the two state dimensions (FK reverse for Contest.event_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?", "tabulation_status?", "call_status?"]
    output: Contest[]
    side_effects: []

  - method: GET
    path: "/contests/{id}"
    description: "Read one contest including rollup computed fields and version (OCC read)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: []
    output: Contest
    side_effects: []

  - method: PATCH
    path: "/contests/{id}"
    description: "Edit contest configuration (office_name, seats) before candidate lock; SETUP only"
    roles: [ElectionOpsAdmin]
    code: 200
    input: ["office_name?", "seats?"]
    output: Contest
    side_effects: ["increments Contest.version by 1"]

  - method: POST
    path: "/contests/{id}/county-links"
    description: "Link a county of the same event into the contest's reporting geography (SETUP only)"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [county_id]
    output: ContestCounty
    side_effects: []

  - method: GET
    path: "/contests/{id}/county-links"
    description: "List county links of a contest (FK reverse for ContestCounty.contest_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ContestCounty[]
    side_effects: []

  - method: GET
    path: "/counties/{id}/county-links"
    description: "List county links touching a county (FK reverse for ContestCounty.county_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ContestCounty[]
    side_effects: []

  - method: POST
    path: "/contests/{id}/candidates"
    description: "Add a candidate to a contest (SETUP only)"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [candidate_name, party, "is_incumbent?"]
    output: Candidate
    side_effects: []

  - method: GET
    path: "/contests/{id}/candidates"
    description: "List candidates of a contest (FK reverse for Candidate.contest_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Candidate[]
    side_effects: []

  - method: POST
    path: "/election-events/{id}/feed-sources"
    description: "Register an electronic feed with the states it is authorized to report (SETUP only)"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [feed_name, state_codes, "priority_tier?"]
    output: FeedSource
    side_effects: []

  - method: GET
    path: "/election-events/{id}/feed-sources"
    description: "List feed sources of the event (FK reverse for FeedSource.event_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedSource[]
    side_effects: []

  - method: POST
    path: "/stringers"
    description: "Register a stringer on the network roster; both reliability scores start at 100"
    roles: [StringerCoordinator]
    code: 201
    input: [stringer_name, home_state]
    output: Stringer
    side_effects: []

  - method: GET
    path: "/stringers/{id}"
    description: "Read one stringer including computed reliability_career and reliability_recent_form"
    roles: [StringerCoordinator, ElectionOpsAdmin]
    code: 200
    input: []
    output: Stringer
    side_effects: []

  - method: POST
    path: "/election-events/{id}/assignments"
    description: "Deploy a stringer to a county office for a half-open window; omit stringer_id to auto-select by the event's reliability ranking mode"
    roles: [StringerCoordinator]
    code: 201
    input: [county_id, window_start, window_end, "stringer_id?"]
    output: StringerAssignment
    side_effects: ["auto-select per StringerAssignment creation preconditions when stringer_id omitted"]

  - method: GET
    path: "/election-events/{id}/assignments"
    description: "List assignments of the event (FK reverse for StringerAssignment.event_id)"
    roles: [StringerCoordinator, ElectionOpsAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: StringerAssignment[]
    side_effects: []

  - method: GET
    path: "/stringers/{id}/assignments"
    description: "List assignments of one stringer (FK reverse for StringerAssignment.stringer_id)"
    roles: [StringerCoordinator, ElectionOpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: StringerAssignment[]
    side_effects: []

  - method: GET
    path: "/counties/{id}/assignments"
    description: "List deployments covering one county (FK reverse for StringerAssignment.county_id)"
    roles: [StringerCoordinator, ElectionOpsAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: StringerAssignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/check-in"
    description: "Stringer checks in at the county office; SCHEDULED -> ACTIVE, self-service only"
    roles: [Stringer]
    code: 200
    input: []
    output: StringerAssignment
    side_effects: []

  - method: POST
    path: "/assignments/{id}/status-actions"
    description: "Coordinator lifecycle action: RELEASE (ACTIVE -> RELEASED), NO_SHOW (SCHEDULED -> NO_SHOW), REDEPLOY (RELEASED -> ACTIVE)"
    roles: [StringerCoordinator]
    code: 200
    input: [action]
    output: StringerAssignment
    side_effects: ["NO_SHOW increments Stringer.no_show_count and recomputes stringer_reliability_score"]

  - method: POST
    path: "/contests/{id}/vote-reports"
    description: "Submit a tabulation entry from a stringer (STRINGER) or electronic feed (FEED); QC runs at intake; OCC on Contest.version"
    roles: [Stringer, FeedOperator]
    code: 201
    input: [county_id, source, precincts_reporting, candidate_votes, expected_contest_version]
    output: VoteReport
    side_effects:
      - "increments Contest.version by 1"
      - "Contest tabulation_status AWAITING -> REPORTING when this is the contest's first report"
      - "qc_deviation_check sets status RECEIVED or FLAGGED"
  - method: GET
    path: "/contests/{id}/vote-reports"
    description: "List vote reports of a contest (FK reverse for VoteReport.contest_id), filterable by status and county_id"
    roles: [ElectionOpsAdmin, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "county_id?"]
    output: VoteReport[]
    side_effects: []

  - method: GET
    path: "/counties/{id}/vote-reports"
    description: "List vote reports naming a county (FK reverse for VoteReport.county_id)"
    roles: [ElectionOpsAdmin, StringerCoordinator, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: VoteReport[]
    side_effects: []

  - method: GET
    path: "/stringers/{id}/vote-reports"
    description: "List vote reports authored by one stringer (FK reverse for VoteReport.submitted_by_stringer_id)"
    roles: [StringerCoordinator, ElectionOpsAdmin, TabulationClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: VoteReport[]
    side_effects: []

  - method: POST
    path: "/vote-reports/{id}/review-decisions"
    description: "Tabulation desk review: ACCEPT (RECEIVED|FLAGGED -> ACCEPTED), REJECT (RECEIVED|FLAGGED -> REJECTED), VOID (ACCEPTED -> VOIDED, compensates the rollup)"
    roles: [TabulationClerk]
    code: 200
    input: [decision]
    output: VoteReport
    side_effects:
      - "ACCEPT: tabulation_rollup recompute (mutates Contest computed fields, so increments Contest.version by 1), VOTE_UPDATE deliveries fan out, author reliability credit"
      - "VOID: tabulation_rollup recompute with compensating subtraction (increments Contest.version by 1), contest may reopen COMPLETE -> REPORTING, author reliability penalty"

  - method: POST
    path: "/vote-reports/{id}/resubmit"
    description: "Correct and resubmit a REJECTED report; QC re-runs and lands it in RECEIVED or FLAGGED"
    roles: [Stringer, FeedOperator]
    code: 200
    input: [precincts_reporting, candidate_votes]
    output: VoteReport
    side_effects: ["qc_deviation_check re-runs"]

  - method: GET
    path: "/contests/{id}/tabulation"
    description: "Computed tabulation board: rollup totals, per-candidate votes, outstanding estimates per variant, margin, callable evaluation inputs"
    roles: [ElectionOpsAdmin, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer, StringerCoordinator]
    code: 200
    input: []
    output: { contest_id: string, tabulation_status: string, call_status: string, reported_precincts: integer, expected_precincts_total: integer, candidate_totals: array, total_votes: integer, margin_pct: number, outstanding_estimate: integer, outstanding_detail: array }
    side_effects: []

  - method: POST
    path: "/contests/{id}/calls"
    description: "Decision desk analyst proposes a winner call for the contest (TABULATION only); OCC on Contest.version; certainty is NOT evaluated at proposal"
    roles: [DecisionAnalyst]
    code: 201
    input: [winner_candidate_id, expected_contest_version]
    output: RaceCall
    side_effects: ["increments Contest.version by 1", "RaceCall.proposed_by := X-User-ID"]

  - method: GET
    path: "/contests/{id}/calls"
    description: "List race calls of a contest (FK reverse for RaceCall.contest_id)"
    roles: [ElectionOpsAdmin, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: RaceCall[]
    side_effects: []

  - method: POST
    path: "/calls/{id}/decisions"
    description: "Desk chief decision on a call: PUBLISH (PROPOSED -> PUBLISHED, evaluates certainty standard, drives Contest UNCALLED -> CALLED and CALL delivery fan-out) or RETRACT (PROPOSED|PUBLISHED -> RETRACTED, retracts and compensates deliveries)"
    roles: [DecisionDeskChief]
    code: 200
    input: [action, "reason?"]
    output: RaceCall
    side_effects:
      - "PUBLISH: Contest CALLED + called_candidate_id (increments Contest.version by 1), CALL ResultDelivery fan-out to STANDARD/PREMIUM customers licensed for the contest state"
      - "RETRACT from PUBLISHED: Contest UNCALLED (increments Contest.version by 1), CALL deliveries -> STALE, CALL_CREDIT deliveries created"

  - method: POST
    path: "/contests/{id}/recount-cases"
    description: "File a recount case for a completed contest; requires margin_pct <= RECOUNT_MARGIN_THRESHOLD (0.005, inclusive)"
    roles: [RecountOfficer]
    code: 201
    input: ["note?"]
    output: RecountCase
    side_effects: ["filed_margin_pct snapshot"]

  - method: GET
    path: "/contests/{id}/recount-cases"
    description: "List recount cases of a contest (FK reverse for RecountCase.contest_id)"
    roles: [ElectionOpsAdmin, TabulationClerk, DecisionAnalyst, DecisionDeskChief, RecountOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RecountCase[]
    side_effects: []

  - method: POST
    path: "/recount-cases/{id}/decisions"
    description: "Recount progression: ACTIVATE (FILED -> ACTIVE, reopens CERTIFICATION posture to TABULATION), DISMISS (FILED -> DISMISSED), RESOLVE (ACTIVE -> RESOLVED_CONFIRMED | RESOLVED_OVERTURNED with outcome; OVERTURNED cascades to call retraction)"
    roles: [RecountOfficer]
    code: 200
    input: [action, "outcome?", "note?"]
    output: RecountCase
    side_effects:
      - "ACTIVATE from CERTIFICATION posture: event CERTIFICATION -> TABULATION, contest COMPLETE -> REPORTING"
      - "RESOLVE OVERTURNED: PUBLISHED call -> RETRACTED -> contest UNCALLED -> CALL deliveries STALE + CALL_CREDIT fan-out"

  - method: POST
    path: "/election-events/{id}/coverage-decisions"
    description: "Planner proposes coverage of a contest (primary/special elections need an APPROVED or FUNDED decision per contest before candidate lock)"
    roles: [CoveragePlanner]
    code: 201
    input: [contest_id, allocated_stringer_hours, coverage_start, coverage_end, "rationale?"]
    output: CoverageDecision
    side_effects: []

  - method: GET
    path: "/election-events/{id}/coverage-decisions"
    description: "List coverage decisions of the event (FK reverse for CoverageDecision.event_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: CoverageDecision[]
    side_effects: []

  - method: GET
    path: "/contests/{id}/coverage-decisions"
    description: "List coverage decisions for a contest (FK reverse for CoverageDecision.contest_id)"
    roles: [ElectionOpsAdmin, CoveragePlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: CoverageDecision[]
    side_effects: []

  - method: POST
    path: "/coverage-decisions/{id}/review"
    description: "Admin review: APPROVE / DECLINE from PROPOSED, FUND from APPROVED; APPROVE and FUND enforce the closed-interval aggregate stringer-hour budget"
    roles: [ElectionOpsAdmin]
    code: 200
    input: [decision]
    output: CoverageDecision
    side_effects: []

  - method: POST
    path: "/coverage-decisions/{id}/revise"
    description: "Planner revises a DECLINED decision back to PROPOSED with updated hours/dates"
    roles: [CoveragePlanner]
    code: 200
    input: ["allocated_stringer_hours?", "coverage_start?", "coverage_end?"]
    output: CoverageDecision
    side_effects: []

  - method: POST
    path: "/media-customers"
    description: "Register a media customer with license tier and licensed states"
    roles: [ElectionOpsAdmin]
    code: 201
    input: [customer_name, license_tier, licensed_states]
    output: MediaCustomer
    side_effects: []

  - method: GET
    path: "/media-customers/{id}"
    description: "Read one media customer (admin, or the customer themself)"
    roles: [ElectionOpsAdmin, MediaCustomer]
    code: 200
    input: []
    output: MediaCustomer
    side_effects: []

  - method: GET
    path: "/media-customers/{id}/deliveries"
    description: "Customer's result feed (FK reverse for ResultDelivery.customer_id); BASIC tier may not filter content_type CALL or CALL_CREDIT (ERR_LICENSE_TIER_FORBIDS)"
    roles: [ElectionOpsAdmin, MediaCustomer]
    code: 200
    input: ["limit?", "offset?", "content_type?", "status?"]
    output: ResultDelivery[]
    side_effects: []

  - method: GET
    path: "/contests/{id}/deliveries"
    description: "Delivery audit view per contest (FK reverse for ResultDelivery.contest_id)"
    roles: [ElectionOpsAdmin, TabulationClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: ResultDelivery[]
    side_effects: []

  - method: POST
    path: "/media-customers/{id}/invoices"
    description: "Generate the monthly invoice aggregating per-delivery rounded fees (admin, or the customer themself); one invoice per (customer, period)"
    roles: [ElectionOpsAdmin, MediaCustomer]
    code: 201
    input: [period]
    output: MediaInvoice
    side_effects: ["media_invoice_total aggregation over the period's deliveries"]

  - method: GET
    path: "/media-customers/{id}/invoices"
    description: "List invoices of a customer (FK reverse for MediaInvoice.customer_id)"
    roles: [ElectionOpsAdmin, MediaCustomer]
    code: 200
    input: ["limit?", "offset?"]
    output: MediaInvoice[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing or blank" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed (stringer acting on another stringer's assignment; customer reading another customer's resources)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum out of range, integer bound violated, malformed array, or window_start >= window_end / coverage_start > coverage_end" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "ElectionEvent id does not resolve" }
  - { id: ERR_CONTEST_NOT_FOUND, http: 404, condition: "Contest id does not resolve" }
  - { id: ERR_COUNTY_NOT_FOUND, http: 404, condition: "County id does not resolve" }
  - { id: ERR_STRINGER_NOT_FOUND, http: 404, condition: "Stringer id does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "StringerAssignment id does not resolve" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "VoteReport id does not resolve" }
  - { id: ERR_CALL_NOT_FOUND, http: 404, condition: "RaceCall id does not resolve" }
  - { id: ERR_RECOUNT_NOT_FOUND, http: 404, condition: "RecountCase id does not resolve" }
  - { id: ERR_DECISION_NOT_FOUND, http: 404, condition: "CoverageDecision id does not resolve" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "MediaCustomer id does not resolve" }
  - { id: ERR_POSTURE_FORBIDS, http: 409, condition: "The event's current posture does not admit this operation (e.g. county creation after CANDIDATES_LOCKED, call proposal outside TABULATION)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in a from-state that admits this transition (also: posture-transition target not a declared next state or its preconditions unmet)" }
  - { id: ERR_CALL_ALREADY_PUBLISHED, http: 409, condition: "Publish attempted while contest.call_status == CALLED" }
  - { id: ERR_RECOUNT_ACTIVE_BLOCKS_CALL, http: 409, condition: "Publish attempted while a RecountCase of the contest is ACTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_contest_version does not match the Contest's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Publisher X-User-ID equals RaceCall.proposed_by — the analyst who proposed a call may not publish it" }
  - { id: ERR_CERTAINTY_NOT_MET, http: 422, condition: "call_certainty_evaluation fails: a trailing candidate could still catch up on the outstanding vote estimate" }
  - { id: ERR_CROSS_EVENT_REFERENCE, http: 422, condition: "A referenced county/contest belongs to a different ElectionEvent than the path's event" }
  - { id: ERR_CANDIDATE_NOT_IN_CONTEST, http: 422, condition: "winner_candidate_id or a candidate_votes entry references a Candidate of another contest" }
  - { id: ERR_COUNTY_NOT_IN_CONTEST, http: 422, condition: "vote-report county_id is not linked to the contest via ContestCounty" }
  - { id: ERR_STRINGER_NOT_DEPLOYED, http: 422, condition: "source STRINGER but no ACTIVE StringerAssignment covers (stringer, county, event)" }
  - { id: ERR_FEED_COVERAGE_MISSING, http: 422, condition: "source FEED but no FeedSource of the event covers the county's state_code" }
  - { id: ERR_NO_ELIGIBLE_STRINGER, http: 422, condition: "Assignment auto-select found no stringer without an overlapping SCHEDULED/ACTIVE assignment" }
  - { id: ERR_ASSIGNMENT_WINDOW_OVERLAP, http: 409, condition: "Requested window overlaps an existing SCHEDULED/ACTIVE assignment of the same stringer (half-open semantics; touching endpoints allowed)" }
  - { id: ERR_OUTSIDE_ASSIGNMENT_WINDOW, http: 409, condition: "Clock outside the window required for check-in / NO_SHOW / REDEPLOY" }
  - { id: ERR_PRECINCTS_EXCEED_EXPECTED, http: 422, condition: "precincts_reporting exceeds the county's expected_precincts" }
  - { id: ERR_RECOUNT_MARGIN_EXCEEDED, http: 422, condition: "Recount filed for a contest whose margin_pct exceeds 0.005" }
  - { id: ERR_COVERAGE_BUDGET_EXCEEDED, http: 422, condition: "Approving/funding would push intersecting closed-interval allocated hours above total_stringer_hour_budget" }
  - { id: ERR_DUPLICATE_COUNTY, http: 409, condition: "county_fips already registered in this event" }
  - { id: ERR_DUPLICATE_FEED, http: 409, condition: "feed_name already registered in this event" }
  - { id: ERR_DUPLICATE_CANDIDATE, http: 409, condition: "candidate_name already on this contest" }
  - { id: ERR_DUPLICATE_COUNTY_LINK, http: 409, condition: "County already linked to this contest" }
  - { id: ERR_DUPLICATE_INVOICE, http: 409, condition: "An invoice already exists for (customer_id, period)" }
  - { id: ERR_LICENSE_TIER_FORBIDS, http: 403, condition: "BASIC-tier customer queried content_type CALL or CALL_CREDIT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ElectionOpsAdmin
    description: "Election operations administrator: prepares events, contests, candidates, counties, feeds; advances posture; reviews coverage; registers media customers"
    identity: opaque
    exclusive_operations: ["POST /election-events", "POST /election-events/{id}/posture-transitions", "POST /election-events/{id}/counties", "POST /election-events/{id}/contests", "PATCH /contests/{id}", "POST /contests/{id}/county-links", "POST /contests/{id}/candidates", "POST /election-events/{id}/feed-sources", "POST /coverage-decisions/{id}/review", "POST /media-customers", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads across the graph", "POST /media-customers/{id}/invoices"]
  - name: CoveragePlanner
    description: "Plans primary/special election coverage and stringer-hour allocation"
    identity: opaque
    exclusive_operations: ["POST /election-events/{id}/coverage-decisions", "POST /coverage-decisions/{id}/revise"]
    shared_operations: ["GET reads across the graph"]
  - name: StringerCoordinator
    description: "Deploys and manages the stringer network"
    identity: opaque
    exclusive_operations: ["POST /stringers", "POST /election-events/{id}/assignments", "POST /assignments/{id}/status-actions"]
    shared_operations: ["GET reads across the graph"]
  - name: Stringer
    description: "Field stringer at a county election office; X-User-ID equals their Stringer.id"
    identity: "entity_backed:Stringer"
    exclusive_operations: ["POST /assignments/{id}/check-in"]
    shared_operations: ["POST /contests/{id}/vote-reports (source STRINGER)", "POST /vote-reports/{id}/resubmit (own reports)"]
  - name: FeedOperator
    description: "Operates electronic result feeds"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["POST /contests/{id}/vote-reports (source FEED)", "POST /vote-reports/{id}/resubmit (feed reports)"]
  - name: TabulationClerk
    description: "Quality-control desk for tabulation entries"
    identity: opaque
