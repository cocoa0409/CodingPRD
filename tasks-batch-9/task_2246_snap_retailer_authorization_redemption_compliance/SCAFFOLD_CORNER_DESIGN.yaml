            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION"

      - name: decayed_evidence_sum_rounds_once_to_fifty_eight_and_misses_the_sixty_gate
        claim_type: Precision
        grounds:
          - calculations.trafficking_confidence_score
          - calculations.trafficking_confidence_score.constants.SUBSTANTIATION_MIN_SCORE
        distinguishing_aspect: "Three items land in three different decay tiers: UNDERCOVER_BUY at 212 days (0.75 -> 30), INVENTORY_PURCHASE_MISMATCH at 426 days (0.50 -> 12.5) and INFORMANT_STATEMENT at 31 days (1.00 -> 15). The exact sum 57.5 is rounded ONCE half-up to 58, which is below the 60 substantiation gate; rounding each term first would give 30 + 13 + 15 == 58 too, but truncating would give 57, and the gate outcome is identical only because the assertion pins the stored 58."
        test_recipe:
          setup:
            - "A store with an EVIDENCE_REVIEW investigation holding the three items above, clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_inv_open
            - call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "UNDERCOVER_BUY", observed_at: "2026-01-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "INVENTORY_PURCHASE_MISMATCH", observed_at: "2025-06-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
            - call: "POST /investigations/${inv_id}/evidence"
              payload: { evidence_type: "INFORMANT_STATEMENT", observed_at: "2026-07-01T00:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
          trigger:
            - call: "POST /investigations/${inv_id}/conclude"
              payload: { substantiated_violation: "TRAFFICKING" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-2"
              captures: { under_sixty_error_id: $.data.error_id }
          assert:
            - "Investigation.${inv_id}.trafficking_confidence_score == 58"
            - "the response is 422 and ${under_sixty_error_id} == ERR_INSUFFICIENT_EVIDENCE"
            - "Investigation.${inv_id}.status == EVIDENCE_REVIEW"
            - "concluding INELIGIBLE_ITEM_SALES on the same investigation instead succeeds, because a live item exists and no score gate applies"

      - name: farmers_market_weights_and_the_minimum_size_expectation_floor
        claim_type: Constants Applied
        grounds:
          - calculations.redemption_anomaly_score.constants.WEIGHTS_FARMERS_MARKET
          - calculations.redemption_anomaly_score.constants.MIN_EXPECTATION_CENTS
        distinguishing_aspect: "A one-lane farmers market with 0 staple shelf feet and 600,000c annual sales has size_from_footprint 400,000 and size_from_sales 50,000; the min is 50,000 which is lifted to the 100,000 floor. FARMERS_MARKET then uses the even-dollar-heavy weight set (20/30/50): 20 * 1 + 30 * 0.4 + 50 * 0.625 == 63.25 -> 63, a FLAG_L2 that the default weights would have scored 50 * 1 + 30 * 0.4 + 20 * 0.625 == 74.5 -> 75, i.e. FLAG_L3."
