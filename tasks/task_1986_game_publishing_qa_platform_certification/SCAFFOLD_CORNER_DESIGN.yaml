              captures: { cv: $.data.version }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/waive", payload: { requirement_code: "TRC-PS-02", justification: "devkit-only audio dropout", expected_checklist_version: "${cv}" }, as: CertificationLead, as_user_id: "u-7" }
          trigger:
