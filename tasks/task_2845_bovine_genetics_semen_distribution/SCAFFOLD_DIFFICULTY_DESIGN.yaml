    instances:
      - name: lot_state_outranks_tank_ownership_on_transfer_create
        grounds:
          - validations.priority_13_ERR_LOT_NOT_RELEASED
          - validations.priority_29_ERR_TANK_NOT_OWNED_BY_DISTRIBUTOR
        distinguishing_aspect: |
          Category pair is state (13) versus business_referential (29) on POST
          /genetics/straw-lots/{id}/consignment-transfers. A single request violates both; only the
          lower-numbered state rule may answer, and the referential error is proved reachable by
