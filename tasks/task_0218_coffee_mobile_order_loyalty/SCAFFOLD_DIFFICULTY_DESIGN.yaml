        grounds:
          - calculations.slot_reserved_count
          - validations[priority=11]
          - entities.PickupSlot.fields.reserved_count
          - errors[ERR_SLOT_FULL]
        distinguishing_aspect: >
          Count-edge boundary on PickupSlot capacity via POST place: with slot_capacity 1 the first place
          succeeds (reserved_count 0 < 1) and the second fails ERR_SLOT_FULL (1 < 1 false) — a strict-less-than
          count edge, distinct metric/endpoint from instance 2's star threshold.
