        triggered_by: "POST /esa/providers/{id}/sanctions (a different write from the adjudication used by the sibling instance)"
        distinguishing_aspect: |
          Depth-3 chain reached from the provider side instead of the case side: DELIST (1) sets
          Provider.status DELISTED with a sanction_reason, (2) voids only that provider's open
