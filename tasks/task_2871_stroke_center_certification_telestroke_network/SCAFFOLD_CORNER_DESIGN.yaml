    excluded_because:
      difficulty_instance: center_suspension_cascades_agreement_consult_and_neurologist_release
      rationale: The §1.8 transitive-cascade instance already walks all four hops of this endpoint's side effects — agreement suspension, consult cancellation, neurologist release and posture recomputation — and asserts the untouched control rows. Duplicating it here would add no new endpoint claim.
  - name: declining_a_consult_reroutes_it_and_conserves_the_agreement_load
    claim_type: action_endpoint
    grounds:
    - endpoints.POST /stroke-network/consults/{id}/decline
    - state_machines.TelestrokeConsult ASSIGNED -> REQUESTED
    excluded_because:
      difficulty_instance: consult_load_conserved_across_decline_reroute_and_completion
      rationale: The §1.8 compensating-invariant instance drives decline, reroute, exclusion-list growth and completion while reconciling active_consult_count on both the agreement and each neurologist, which subsumes any endpoint-level side-effect check for decline.
- section: errors
  instances:
  - name: each_collection_answers_a_path_id_that_names_nothing_with_its_own_not_found_error
    claim_type: error_triggerable
    grounds:
    - errors.ERR_CENTER_NOT_FOUND / ERR_AGREEMENT_NOT_FOUND / ERR_NEUROLOGIST_NOT_FOUND / ERR_CASE_NOT_FOUND / ERR_CONSULT_NOT_FOUND / ERR_CHECKLIST_NOT_FOUND / ERR_TRANSFER_NOT_FOUND / ERR_DEVIATION_NOT_FOUND / ERR_ABSTRACTION_NOT_FOUND / ERR_REPORT_NOT_FOUND
    - validations.priority 15
    distinguishing_aspect: 'Ten collections, ten distinct 404 identifiers: the cheap implementation shares one generic ERR_NOT_FOUND, and the next-cheapest keys the identifier off the URL''s first segment, which gets /consults/{id} and /checklists/{id} right but mislabels every nested resource. Every single call here is a well-formed UUID that simply names nothing, so nothing but the collection can select the identifier.'
    test_recipe:
      setup:
      - Clock set to 2026-09-01T08:00:00Z. Empty database — no rows of any kind exist.
      - Every id used is the syntactically valid UUID 11111111-1111-4111-8111-111111111111.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      trigger:
      - call: GET /stroke-network/stroke-centers/11111111-1111-4111-8111-111111111111
        as: ProgramCoordinator
