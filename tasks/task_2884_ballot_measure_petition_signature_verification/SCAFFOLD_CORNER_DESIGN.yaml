              as_user_id: "admin-1"
            - call: "POST /petitions"
              payload: { standard_id: "${std_id}", proponent_name: "List Two", submitted_title: "List Measure Two", measure_subject_codes: ["ENV"] }
              as: Proponent
              as_user_id: "prop-2"
              captures: { p2_id: $.data.id }
            - call: "POST /petitions/${p2_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-2"
            - call: "POST /petitions/${p2_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
