            - call: "POST /funds/allocation-runs/${run}/lock"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/tax-years/${ty}/submit-review"
              payload: {}
              as: TaxPreparer
            - call: "POST /funds/tax-years/${ty}/approve"
              payload: {}
              as: TaxReviewer
            - call: "POST /funds/k1-generation"
              payload: { tax_year_id: "${ty}" }
              as: TaxPreparer
              captures: { k1: "$.data[0].id" }
            - call: "POST /funds/k1-packages/${k1}/submit-review"
              payload: {}
              as: TaxPreparer
              as_user_id: prep_1
            - call: "POST /funds/k1-packages/${k1}/approve"
              payload: {}
              as: TaxReviewer
              as_user_id: rev_1
            - call: "POST /funds/k1-packages/${k1}/deliver"
              payload: { delivery_method: PORTAL }
              as: InvestorServicesRep
