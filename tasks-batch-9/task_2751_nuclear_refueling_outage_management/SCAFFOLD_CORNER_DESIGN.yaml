# ===========================================================================
# §1.9 Scaffold Corner Design — Nuclear Refueling Outage Management
# Breadth walk of references/claim-extraction-guide.md against §1.1-§1.7.
# Sections and claim_type values are taken verbatim from that guide.
# Corners already carried by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs citing the covering §1.8 instance by name.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: create_outage_persists_every_declared_input_field
        claim_type: creation
        grounds: ["entities.Outage", "endpoints.POST_/outages"]
        distinguishing_aspect: "POST /outages with every input field supplied returns 201 and echoes station_unit, designation, duration_target_hours, dose_budget_total_mrem, cost_budget_usd, scope_freeze_at, required_training_modules and required_badged_workers unchanged."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z", required_training_modules: 6, required_badged_workers: 2 }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          assert:
            - "HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "Outage.${o_id}.station_unit == UNIT_1, designation == \"1R24\", duration_target_hours == 720, dose_budget_total_mrem == 5000, cost_budget_usd == 40000000"
            - "Outage.${o_id}.required_training_modules == 6 and required_badged_workers == 2"
            - "Outage.${o_id}.status == PLANNING, schedule_posture == ON_TRACK, alara_posture == NORMAL"
            - "Outage.${o_id}.dose_committed_mrem == 0.00, dose_budget_remaining_mrem == 5000.00, approved_scope_cost_usd == 0.00, badged_worker_count == 0"
            - "Outage.${o_id}.critical_path_activity_id == null and actual_duration_hours == null"

      - name: get_outage_returns_the_stored_entity
        claim_type: retrieval
        grounds: ["entities.Outage", "endpoints.GET_/outages/{id}"]
        distinguishing_aspect: "GET /outages/{id} returns the same field values that the create call persisted, with no recomputation drift."
        test_recipe:
          setup:
            - "One outage exists, created with duration_target_hours 720 and dose_budget_total_mrem 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
          trigger:
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
          assert:
            - "HTTP 200 and the returned id equals ${o_id}"
            - "duration_target_hours == 720, dose_budget_total_mrem == 5000, status == PLANNING"
            - "version == ${o_v1} — a read never bumps the version"

      - name: list_work_orders_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints.GET_/work-orders", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three work orders on one outage, GET /work-orders?outage_id=..&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One outage owns exactly three SCOPED work orders, created in a known order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO one", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo1_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO two", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo2_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO three", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo3_id: "$.data.id" }
          trigger:
            - call: "GET /work-orders"
              payload: { outage_id: "${o_id}", limit: 2, offset: 0 }
              as: OutagePlanner
            - call: "GET /work-orders"
              payload: { outage_id: "${o_id}", limit: 2, offset: 2 }
              as: OutagePlanner
          assert:
            - "The first page returns response_type array with 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "The second page returns 1 row, total_count == 3, has_more == false, offset == 2"
            - "The union of the two pages is exactly {${wo1_id}, ${wo2_id}, ${wo3_id}} with no row repeated"
            - "Omitting limit and offset entirely returns all 3 rows with the declared defaults limit 10 and offset 0"

      - name: get_outage_with_unknown_id_returns_outage_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_OUTAGE_NOT_FOUND]"]
        distinguishing_aspect: "GET /outages/{id} with a syntactically valid but unknown id returns 404 ERR_OUTAGE_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "Exactly one outage exists; the id used in the trigger belongs to no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "GET /outages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OutageDirector
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${err_id} == ERR_OUTAGE_NOT_FOUND and response_type error"
            - "The response carries a message field alongside error_id"
            - "GET /outages/${o_id} still returns 200 — the stored row is untouched"

      - name: create_work_order_without_estimated_hours_rejected
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", "entities.WorkOrder.fields.estimated_hours"]
        distinguishing_aspect: "estimated_hours has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and persists no work order."
        test_recipe:
          setup:
            - "One outage in PLANNING with no work orders."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Missing hours", estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400 with ${err_id} == ERR_INVALID_REQUEST"
            - "GET /work-orders?outage_id=${o_id} returns 0 rows and total_count == 0"
            - "Outage.${o_id}.approved_scope_cost_usd == 0.00"

      - name: outage_optional_fields_take_declared_defaults_when_omitted
        claim_type: defaults
        grounds: ["entities.Outage.fields.required_training_modules", "entities.Outage.fields.required_badged_workers"]
        distinguishing_aspect: "Omitting required_training_modules and required_badged_workers yields 4 and 0 respectively — the declared defaults, not null and not zero for both."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          assert:
            - "Outage.${o_id}.required_training_modules == 4"
            - "Outage.${o_id}.required_badged_workers == 0"
            - "Outage.${o_id}.status == PLANNING and version == 1"

      - name: work_order_priority_score_and_band_are_computed_at_creation
        claim_type: computed_fields
        grounds: ["calculations.work_order_priority_score", "entities.WorkOrder.fields.priority_score", "entities.WorkOrder.fields.priority"]
        distinguishing_aspect: "priority_score and priority carry source computed: an INSPECTION of 240 hours and 200 mrem on a 720-hour target scores 30 + 0 + 0 + 30 - 2 == 58.00 and lands in HIGH, with no client input able to set either field."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 with duration_target_hours 720."
            - "The work order is an INSPECTION with estimated_hours 240 and estimated_dose_mrem 200, no regulatory commitment and no safety function: raw duration pressure 240 / 720 * 300 == 100.00 which the 30 cap truncates, and the dose penalty is floor(200 / 100) == 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Reactor vessel internals inspection", estimated_hours: 240, estimated_cost_usd: 500000, estimated_dose_mrem: 200, regulatory_commitment: false, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
          assert:
            - "WorkOrder.${wo_id}.priority_score == 58.00"
            - "WorkOrder.${wo_id}.priority == HIGH — 58.00 is at or above PRIORITY_HIGH_MIN 45 and below PRIORITY_CRITICAL_MIN 75"
            - "WorkOrder.${wo_id}.status == SCOPED and origin == PLANNED_SCOPE"
            - "WorkOrder.${wo_id}.safety_function_id == null and deferral_reason == null"

      - name: system_fields_are_server_generated_on_create
        claim_type: system_fields
        grounds: ["entities.SpentFuelPool", "entities.RadArea"]
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server: a freshly created spent fuel pool has version 1 and created_at equal to the pinned logical-clock instant 2026-08-01T00:00:00Z."
        test_recipe:
          setup:
            - "The logical clock is pinned to 2026-08-01T00:00:00Z before the create."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
          assert:
            - "${pool_v} == 1 and the response carries a non-null id, created_at and updated_at"
            - "created_at == \"2026-08-01T00:00:00Z\" — the logical clock, never wall-clock time"
            - "SpentFuelPool.${pool_id}.cells_occupied == 900, cells_reserved == 0, cells_available == 300, protected_cells_available == 107 — all four are computed, none supplied"

      - name: dose_transaction_rows_are_immutable_and_versionless
        claim_type: immutability
        grounds: ["entities.DoseTransaction", "endpoints.GET_/rwps/{id}/dose-transactions"]
        distinguishing_aspect: "DoseTransaction declares common_fields false: §1.5 exposes no update, delete or create endpoint for it, the rows appear only as the append-only output of GET /rwps/{id}/dose-transactions, and no row carries a version field."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in SCOPE_LOCKED with an APPROVED work order and one APPROVED permit whose committed_dose_mrem is 180.00, so exactly one COMMIT row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "CTMT-EL471", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Cavity survey", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 0, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp_id: "$.data.id" }
            - call: "POST /outages/${o_id}/lock-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /rwps/${rwp_id}/approve"
              payload: {}
              as: RadProtectionManager
          trigger:
            - call: "GET /rwps/${rwp_id}/dose-transactions"
              payload: {}
              as: RadProtectionManager
          assert:
            - "Exactly 1 row is returned, with rwp_id == ${rwp_id}, direction COMMIT, amount_mrem 180.00 and reason RWP_APPROVED"
            - "No returned row carries a version field — DoseTransaction declares common_fields false"
            - "§1.5 declares no POST, PATCH or DELETE endpoint whose output is DoseTransaction; the only way to append a row is a permit transition"
            - "Re-reading the same endpoint returns the identical row set — reads never mutate the ledger"

      - name: invalid_enum_and_out_of_range_values_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]", "entities.PoolCellReservation.fields.purpose", "entities.RadiologicalWorkPermit.fields.shielding_factor"]
        distinguishing_aspect: "Three independent bound violations each return 400 ERR_INVALID_REQUEST: purpose outside its declared enum, shielding_factor at the excluded upper bound 1, and worker_count 0 below its minimum of 1."
        test_recipe:
          setup:
            - "Spent fuel pool UNIT_1, rad area CTMT-EL471, outage UNIT_1 / 1R24 in PLANNING and one SCOPED work order to hang a permit from."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /spent-fuel-pools"
              payload: { station_unit: "UNIT_1", cells_total: 1200, cells_baseline_occupied: 900, full_core_offload_reserve_cells: 193 }
              as: StationAdmin
              captures: { pool_id: "$.data.id", pool_v1: "$.data.version" }
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "CTMT-EL471", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Cavity survey", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
          trigger:
            - call: "POST /pool-cell-reservations"
              payload: { outage_id: "${o_id}", spent_fuel_pool_id: "${pool_id}", cells_requested: 5, purpose: "SOMETHING_ELSE", expected_spent_fuel_pool_version: "${pool_v1}" }
              as: ReactorEngineer
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 1, planned_start_offset_hours: 0, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { err_shield: "$.data.error_id" }
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 0, shielding_factor: 0.5, planned_start_offset_hours: 0, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { err_crew: "$.data.error_id" }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400 — purpose must be one of {DISCHARGE, FRESH_STAGING, CONTINGENCY}"
            - "${err_shield} == ERR_INVALID_REQUEST — shielding_factor is bounded to [0, 1) so 1 is excluded"
            - "${err_crew} == ERR_INVALID_REQUEST — worker_count must be at least 1"
            - "SpentFuelPool.${pool_id}.cells_reserved == 0 and its version is still ${pool_v1}"
            - "GET /rwps?work_order_id=${wo_id} returns 0 rows"

      - name: work_order_creation_requires_an_existing_parent_outage
        claim_type: parent_relationships
        grounds: ["validations[priority=3]", "errors[ERR_OUTAGE_NOT_FOUND]", "entities.WorkOrder.fields.outage_id"]
        distinguishing_aspect: "The nested route POST /outages/{id}/work-orders resolves its path parent before the body: an unknown outage id returns 404 ERR_OUTAGE_NOT_FOUND even when the body is entirely valid."
        test_recipe:
          setup:
            - "One outage exists so the endpoint is otherwise usable; the path id in the trigger belongs to no row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /outages/00000000-0000-4000-8000-000000000000/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Orphan work order", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${err_id} == ERR_OUTAGE_NOT_FOUND"
            - "GET /work-orders?outage_id=${o_id} returns 0 rows — nothing leaked onto the real outage"

      - name: permit_creation_links_work_order_and_rad_area_across_aggregates
        claim_type: graph
        grounds: ["entities.RadiologicalWorkPermit.fields.outage_id", "entities.RadiologicalWorkPermit.fields.work_order_id", "entities.RadiologicalWorkPermit.fields.rad_area_id", "complexity_profile.entity_topology"]
        distinguishing_aspect: "The graph topology's cross-aggregate junction: one permit row carries references to a WorkOrder, a RadArea and the Outage copied from that work order, and all three are reachable back through the declared filtered-list GETs."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING, rad area CTMT-EL471 and one SCOPED work order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "CTMT-EL471", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Cavity survey", estimated_hours: 60, estimated_cost_usd: 100000, estimated_dose_mrem: 100, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
          trigger:
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 0, planned_duration_hours: 6 }
              as: RadProtectionPlanner
              captures: { rwp_id: "$.data.id" }
          assert:
            - "RadiologicalWorkPermit.${rwp_id}.work_order_id == ${wo_id} and rad_area_id == ${ra_id}"
            - "RadiologicalWorkPermit.${rwp_id}.outage_id == ${o_id} — copied from the work order, never supplied by the client"
