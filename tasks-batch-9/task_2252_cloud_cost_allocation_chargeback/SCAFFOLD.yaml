scenario: "2252. Cloud Cost Allocation & Chargeback (enterprise cloud financial management): tagging policy with mandatory dimensions for team, environment and application enforced at provisioning, untagged and shared cost allocation methodologies with proportional and even-split rules, showback and chargeback reporting to business units with dispute handling, commitment purchasing across reserved capacity and savings plans with coverage and utilization targets, rightsizing and idle resource identification with owner notification and automated remediation windows, anomaly detection on spend spikes with alert routing and root cause attribution, budget setting, forecast accuracy tracking and variance explanation, unit economics reporting linking cloud cost to business volume drivers"
domain_name: "cloud-cost-allocation-chargeback"
api_prefix: "/finops"

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Multi-party negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "above Expert (15 entities, 9 state machines, 9 calculations, 83 endpoints, 60 errors, 38 ordered validations, 3 optimistic-concurrency rules)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: BusinessUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: business unit display name
      - name: parent_business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; nullable self-referential parent for the BU rollup tree"
        default: null
      - name: cost_center_code
        type: string
        source: input
        description: finance cost center code used on chargeback invoices
      - name: chargeback_enabled
        type: boolean
        source: input
        description: when false the BU may only receive showback runs, never chargeback invoices
        default: false
      - name: headcount
        type: integer
        source: input
        description: headcount used as a proportional basis for shared cost pools
        default: 0
      - name: revenue_cents
        type: integer
        source: input
        description: attributed revenue in cents used as a proportional basis for shared cost pools
        default: 0
      - name: status
        type: enum
        source: input
        description: lifecycle flag gating new provisioning and allocation participation
        default: ACTIVE
        constraints: "one of ACTIVE | SUSPENDED | ARCHIVED"
      - name: resource_count
        type: integer
        source: computed
        description: count of CloudResource rows with business_unit_id = this BU and lifecycle_state != TERMINATED
      - name: tracked_run_rate_cents
        type: integer
        source: computed
        description: sum of monthly_run_rate_cents over this BU's CloudResource rows with lifecycle_state != TERMINATED
      - name: direct_spend_cents
        type: integer
        source: computed
        description: sum of effective_cost_cents over CostRecord rows with business_unit_id = this BU and allocation_state != REVERSED
      - name: showback_total_cents
        type: integer
        source: computed
        description: sum of AllocationLine.allocated_cents for this BU across AllocationRun rows with mode = SHOWBACK and status in {PUBLISHED, CLOSED}
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: sum of ChargebackInvoice.net_due_cents for this BU over invoices with settlement_status not in {VOIDED, WRITTEN_OFF}

  - name: TaggingPolicy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: policy name
      - name: mandatory_dimensions
        type: array
        source: input
        description: ordered list of mandatory tag dimension keys; must be a subset of ["team", "environment", "application"] and non-empty
      - name: enforcement_mode
        type: enum
        source: input
        description: BLOCKING rejects non-compliant provisioning, ADVISORY records the gap and proceeds
        default: ADVISORY
        constraints: "one of ADVISORY | BLOCKING"
      - name: status
        type: enum
        source: system
        description: policy lifecycle state
        default: DRAFT
        constraints: "one of DRAFT | ACTIVE | RETIRED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinOpsAnalyst who drafted the policy
      - name: activated_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinOpsController who activated the policy; null while DRAFT
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: count of ProvisioningRequest rows referencing this policy whose status is TAG_REJECTED
        default: 0

  - name: ProvisioningRequest
    parent: null
    common_fields: true
    fields:
      - name: tagging_policy_id
        type: string
        source: input
        description: "FK -> TaggingPolicy.id; the policy evaluated at submission"
      - name: business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; owning business unit for the resource being provisioned"
      - name: resource_kind
        type: enum
        source: input
        description: kind of resource requested
        constraints: "one of COMPUTE | DATABASE | STORAGE"
      - name: requested_tags
        type: object
        source: input
        description: submitted tag map; keys are dimension names, values are non-empty strings
      - name: monthly_run_rate_cents
        type: integer
        source: input
        description: projected monthly run rate in cents for the resource being provisioned
        constraints: "integer >= 0"
      - name: owner_user_id
        type: string
        source: input
        description: opaque ResourceOwner user id notified for remediation on the provisioned resource
      - name: status
        type: enum
        source: system
        description: request lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED | TAG_REJECTED | APPROVED | PROVISIONED | TERMINATED"
      - name: missing_dimensions
        type: array
        source: computed
        description: mandatory dimensions of the referenced policy absent or blank in requested_tags, in policy order
      - name: compliance_score
        type: number
        source: computed
        description: weighted tag compliance score per calculation tag_compliance_evaluation, 2dp
      - name: projected_tag_state
        type: enum
        source: computed
        description: tag state the provisioned CloudResource will carry (TAGGED | PARTIAL | UNTAGGED)
      - name: retag_count
        type: integer
        source: computed
        description: number of successful retag submissions on this request
        default: 0

  - name: CloudResource
    parent: null
    common_fields: true
    fields:
      - name: provisioning_request_id
        type: string
        source: system
        description: "FK -> ProvisioningRequest.id; the request that provisioned this resource"
      - name: business_unit_id
        type: string
        source: system
        description: "FK -> BusinessUnit.id; copied from the provisioning request at provision time"
      - name: resource_kind
        type: enum
        source: system
        description: copied from the provisioning request
        constraints: "one of COMPUTE | DATABASE | STORAGE"
      - name: environment
        type: string
        source: system
        description: value of the environment tag at provision time, or the literal "untagged" when absent
      - name: applied_tags
        type: object
        source: system
        description: tag map frozen at provision time from the request's requested_tags
      - name: tag_state
        type: enum
        source: system
        description: tag completeness at provision time
        constraints: "one of TAGGED | PARTIAL | UNTAGGED"
      - name: lifecycle_state
        type: enum
        source: system
        description: operational lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE | FLAGGED_IDLE | RIGHTSIZE_PENDING | RESIZED | TERMINATED"
      - name: owner_user_id
        type: string
        source: system
        description: opaque ResourceOwner user id copied from the provisioning request
      - name: utilization_pct
        type: number
        source: input
        description: latest observed utilization percentage, 2dp, updated by telemetry PATCH
        default: 100.00
        constraints: "0.00 <= utilization_pct <= 100.00"
      - name: monthly_run_rate_cents
        type: integer
        source: input
        description: current monthly run rate in cents; set to 0 when the resource is TERMINATED
        constraints: "integer >= 0"

  - name: CostRecord
    parent: null
    common_fields: true
    fields:
      - name: cloud_resource_id
        type: string
        source: input
        description: "FK -> CloudResource.id; nullable, null for records that belong to a shared cost pool"
        default: null
      - name: shared_cost_pool_id
        type: string
        source: input
        description: "FK -> SharedCostPool.id; nullable, set when the record is absorbed into a shared pool"
        default: null
      - name: business_unit_id
        type: string
        source: computed
        description: "FK -> BusinessUnit.id; nullable, derived from the cloud resource at creation and null for untagged or pooled records"
        default: null
      - name: applied_commitment_id
        type: string
        source: computed
        description: "FK -> Commitment.id; nullable, set by the commitment application waterfall"
        default: null
      - name: allocated_by_run_id
        type: string
        source: computed
        description: "FK -> AllocationRun.id; nullable, set when a run publishes lines covering this record"
        default: null
      - name: billing_period_start
        type: datetime
        source: input
        description: inclusive UTC start of the billing period this record covers
      - name: billing_period_end
        type: datetime
        source: input
        description: exclusive UTC end of the billing period this record covers
      - name: resource_kind
        type: enum
        source: input
        description: kind of spend this record represents
        constraints: "one of COMPUTE | DATABASE | STORAGE"
      - name: list_cost_cents
        type: integer
        source: input
        description: undiscounted list cost in cents
        constraints: "integer >= 0"
      - name: effective_cost_cents
        type: integer
        source: computed
        description: cost after commitment discount; equals list_cost_cents until a commitment is applied
      - name: allocation_state
        type: enum
        source: system
        description: allocation lifecycle of this record
        default: UNALLOCATED
        constraints: "one of UNALLOCATED | ALLOCATED | DISPUTED_HOLD | REVERSED"
  - name: SharedCostPool
    parent: AllocationRun
    common_fields: true
    fields:
      - name: allocation_run_id
        type: string
        source: system
        description: "FK -> AllocationRun.id; the run this pool is scoped to"
      - name: name
        type: string
        source: input
        description: pool label, e.g. "shared-networking" or "untagged-absorption"
      - name: methodology
        type: enum
        source: input
        description: allocation methodology applied to the pooled amount
        constraints: "one of PROPORTIONAL | EVEN_SPLIT"
      - name: proportional_basis
        type: enum
        source: input
        description: basis used when methodology = PROPORTIONAL; ignored for EVEN_SPLIT
        default: SPEND
        constraints: "one of SPEND | HEADCOUNT | REVENUE"
      - name: participant_business_unit_ids
        type: array
        source: input
        description: ordered list of BusinessUnit ids that share this pool; every id must exist and be ACTIVE
      - name: status
        type: enum
        source: system
        description: pool lifecycle state
        default: OPEN
        constraints: "one of OPEN | SEALED"
      - name: pooled_cost_cents
        type: integer
        source: computed
        description: sum of effective_cost_cents over CostRecord rows whose shared_cost_pool_id = this pool
      - name: absorbed_record_count
        type: integer
        source: computed
        description: count of CostRecord rows whose shared_cost_pool_id = this pool
        default: 0

  - name: AllocationRun
    parent: null
    common_fields: true
    fields:
      - name: mode
        type: enum
        source: input
        description: SHOWBACK produces informational lines only, CHARGEBACK produces invoices on publish
        constraints: "one of SHOWBACK | CHARGEBACK"
      - name: scope_business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; nullable, when set the run only allocates records under that BU subtree"
        default: null
      - name: period_start
        type: datetime
        source: input
        description: inclusive UTC start of the allocation period
      - name: period_end
        type: datetime
        source: input
        description: exclusive UTC end of the allocation period; must be strictly after period_start
      - name: status
        type: enum
        source: system
        description: run lifecycle state
        default: DRAFT
        constraints: "one of DRAFT | COMPUTED_PROVISIONAL | COMPUTED_FINAL | PUBLISHED | REOPENED | CLOSED"
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the user who created the run
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinOpsController who published the run; null before publish
        default: null
      - name: variant_applied
        type: enum
        source: computed
        description: which allocation_run_totals variant produced the current totals
        default: null
        constraints: "one of PROVISIONAL | FINAL, or null before the first compute"
      - name: scoped_effective_cost_cents
        type: integer
        source: computed
        description: sum of effective_cost_cents over the run's in-scope CostRecord input set per calculation allocation_run_totals
        default: 0
      - name: total_allocated_cents
        type: integer
        source: computed
        description: sum of AllocationLine.allocated_cents over lines of this run with line_kind in {DIRECT, SHARED}
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: count of AllocationLine rows belonging to this run
        default: 0
      - name: reopen_count
        type: integer
        source: computed
        description: number of times this run has been reopened after publication
        default: 0

  - name: AllocationLine
    parent: AllocationRun
    common_fields: false
    fields:
      - name: allocation_run_id
        type: string
        source: system
        description: "FK -> AllocationRun.id; the run that produced this line"
      - name: business_unit_id
        type: string
        source: system
        description: "FK -> BusinessUnit.id; the business unit charged or shown this line"
      - name: shared_cost_pool_id
        type: string
        source: system
        description: "FK -> SharedCostPool.id; nullable, set only for SHARED lines"
        default: null
      - name: line_kind
        type: enum
        source: system
        description: origin of the line
        constraints: "one of DIRECT | SHARED | MANUAL_ADJUSTMENT"
      - name: method_applied
        type: enum
        source: system
        description: allocation method that produced allocated_cents
        constraints: "one of LIST_BASIS | EFFECTIVE_BASIS | PROPORTIONAL | EVEN_SPLIT | MANUAL"
      - name: allocated_cents
        type: integer
        source: system
        description: amount allocated to the business unit on this line; may be negative only for MANUAL_ADJUSTMENT
      - name: basis_value
        type: number
        source: system
        description: the numeric basis used for a PROPORTIONAL share, 2dp; 0.00 for other methods
        default: 0.00
      - name: rounding_remainder_cents
        type: integer
        source: system
        description: extra cent(s) granted to this line by the largest-fractional-part remainder rule
        default: 0
      - name: memo
        type: string
        source: system
        description: human readable explanation; carries the adjustment reason for MANUAL_ADJUSTMENT lines
        default: null

  - name: ChargebackInvoice
    parent: null
    common_fields: true
    fields:
      - name: allocation_run_id
        type: string
        source: system
        description: "FK -> AllocationRun.id; the CHARGEBACK run that issued this invoice"
      - name: business_unit_id
        type: string
        source: system
        description: "FK -> BusinessUnit.id; the billed business unit"
      - name: settlement_status
        type: enum
        source: system
        description: first parallel state dimension, tracks money movement
        default: UNBILLED
        constraints: "one of UNBILLED | ISSUED | PARTIALLY_CREDITED | SETTLED | WRITTEN_OFF | VOIDED"
      - name: dispute_status
        type: enum
        source: system
        description: second parallel state dimension, evolves independently of settlement_status
        default: NONE
        constraints: "one of NONE | DISPUTED | DISPUTE_RESOLVED"
      - name: gross_amount_cents
        type: integer
        source: system
        description: sum of AllocationLine.allocated_cents for this BU on the issuing run at publish time
      - name: credited_amount_cents
        type: integer
        source: computed
        description: total credits applied by resolved disputes on this invoice
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: total settled payments recorded against this invoice
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: gross_amount_cents - credited_amount_cents - paid_amount_cents per calculation invoice_settlement_ledger
      - name: dispute_window_ends_at
        type: datetime
        source: system
        description: instant after which no new Dispute may be filed; issue_at + DISPUTE_WINDOW_HOURS
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant when the invoice moved to ISSUED
        default: null

  - name: Dispute
    parent: ChargebackInvoice
    common_fields: true
    fields:
      - name: chargeback_invoice_id
        type: string
        source: input
        description: "FK -> ChargebackInvoice.id; the disputed invoice"
      - name: filed_by_business_unit_id
        type: string
        source: computed
        description: "FK -> BusinessUnit.id; copied from the disputed invoice at filing time"
      - name: reason_code
        type: enum
        source: input
        description: dispute reason
        constraints: "one of WRONG_OWNER | SHARED_METHODOLOGY | UNTAGGED_ABSORPTION | DOUBLE_CHARGE"
      - name: claimed_credit_cents
        type: integer
        source: input
        description: credit amount claimed by the business unit
        constraints: "integer > 0"
      - name: narrative
        type: string
        source: input
        description: free-text justification supplied by the filing business unit
      - name: status
        type: enum
        source: system
        description: dispute lifecycle state
        default: OPEN
        constraints: "one of OPEN | UNDER_REVIEW | INFO_REQUESTED | RESOLVED_ADJUSTED | RESOLVED_UPHELD | WITHDRAWN"
      - name: review_round
        type: integer
        source: computed
        description: number of times review has been started on this dispute; capped by MAX_DISPUTE_ROUNDS
        default: 0
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the BusinessUnitOwner who filed the dispute
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinOpsController who resolved the dispute; null until resolution
        default: null
      - name: outcome
        type: enum
        source: system
        description: resolution outcome
        default: null
        constraints: "one of ADJUSTED | UPHELD, or null while unresolved"
      - name: granted_credit_cents
        type: integer
        source: system
        description: credit actually applied to the invoice on an ADJUSTED resolution; 0 when UPHELD
        default: 0
  - name: Commitment
    parent: null
    common_fields: true
    fields:
      - name: commitment_type
        type: enum
        source: input
        description: RESERVED_INSTANCE covers a single resource kind, SAVINGS_PLAN covers compute and database spend
        constraints: "one of RESERVED_INSTANCE | SAVINGS_PLAN"
      - name: region
        type: string
        source: input
        description: cloud region the commitment is purchased in; aggregate hourly capacity is capped per region
      - name: covered_resource_kind
        type: enum
        source: input
        description: resource kind covered when commitment_type = RESERVED_INSTANCE; must be null for SAVINGS_PLAN
        default: null
        constraints: "one of COMPUTE | DATABASE | STORAGE, or null"
      - name: term_start
        type: datetime
        source: input
        description: inclusive UTC start of the commitment term
      - name: term_end
        type: datetime
        source: input
        description: inclusive UTC end of the commitment term; closed interval, must be strictly after term_start
      - name: hourly_commit_cents
        type: integer
        source: input
        description: hourly spend committed in cents
        constraints: "integer > 0"
      - name: coverage_target_pct
        type: number
        source: input
        description: target coverage percentage used for reporting, 2dp
        default: 80.00
      - name: utilization_target_pct
        type: number
        source: input
        description: utilization percentage below which the commitment is flagged UNDER_UTILIZED, 2dp
        default: 85.00
      - name: status
        type: enum
        source: system
        description: commitment lifecycle state
        default: PENDING
        constraints: "one of PENDING | ACTIVE | UNDER_UTILIZED | EXPIRED"
      - name: committed_capacity_cents
        type: integer
        source: computed
        description: hourly_commit_cents * HOURS_PER_PERIOD; the conserved capacity envelope
      - name: covered_spend_cents
        type: integer
        source: computed
        description: sum of list_cost_cents over CostRecord rows whose applied_commitment_id = this commitment and allocation_state != REVERSED
      - name: total_discount_cents
        type: integer
        source: computed
        description: sum of per-record discounts granted by this commitment per calculation commitment_application_waterfall
        default: 0
      - name: waste_cents
        type: integer
        source: computed
        description: committed_capacity_cents - covered_spend_cents, floored at 0
        default: 0
      - name: coverage_pct
        type: number
        source: computed
        description: covered_spend_cents / total in-scope list spend * 100, 2dp
        default: 0.00
      - name: utilization_pct
        type: number
        source: computed
        description: covered_spend_cents / committed_capacity_cents * 100, 2dp
        default: 0.00

  - name: RemediationTask
    parent: CloudResource
    common_fields: true
    fields:
      - name: cloud_resource_id
        type: string
        source: system
        description: "FK -> CloudResource.id; the resource to be remediated"
      - name: kind
        type: enum
        source: system
        description: remediation action proposed by the idle and rightsizing scan
        constraints: "one of RIGHTSIZE | IDLE_TERMINATE"
      - name: status
        type: enum
        source: system
        description: remediation lifecycle state
        default: PROPOSED
        constraints: "one of PROPOSED | OWNER_NOTIFIED | OWNER_SNOOZED | APPROVED | EXECUTED | AUTO_EXECUTED | CANCELLED"
      - name: observed_utilization_pct
        type: number
        source: system
        description: utilization_pct read from the resource at scan time, 2dp
      - name: waste_score
        type: number
        source: system
        description: composite waste score per calculation idle_and_rightsizing_evaluation, 2dp
      - name: projected_savings_cents
        type: integer
        source: system
        description: projected monthly savings if the remediation executes
      - name: realized_savings_cents
        type: integer
        source: computed
        description: savings actually booked when the task reaches EXECUTED or AUTO_EXECUTED; 0 otherwise
        default: 0
      - name: auto_remediation_eligible
        type: boolean
        source: system
        description: true when the waste score and environment permit unattended execution at window expiry
        default: false
      - name: remediation_window_starts_at
        type: datetime
        source: system
        description: inclusive UTC instant the owner notification window opens; set when the owner is notified
        default: null
      - name: remediation_window_ends_at
        type: datetime
        source: system
        description: inclusive UTC instant the owner notification window closes; closed interval on both ends
        default: null
      - name: snooze_count
        type: integer
        source: computed
        description: number of times the owner has snoozed this task
        default: 0

  - name: AnomalyAlert
    parent: null
    common_fields: true
    fields:
      - name: business_unit_id
        type: string
        source: system
        description: "FK -> BusinessUnit.id; the business unit whose spend spiked"
      - name: root_cause_cloud_resource_id
        type: string
        source: computed
        description: "FK -> CloudResource.id; nullable, set when the alert is attributed to a specific resource"
        default: null
      - name: detected_at
        type: datetime
        source: system
        description: logical-clock instant the anomaly scan emitted this alert
      - name: baseline_cents
        type: integer
        source: system
        description: mean of the BU's three most recent prior CostRecord effective costs, truncated to whole cents
      - name: observed_cents
        type: integer
        source: system
        description: effective cost of the newest in-scope CostRecord for the BU
      - name: delta_cents
        type: integer
        source: system
        description: observed_cents - baseline_cents
      - name: spike_ratio
        type: number
        source: system
        description: observed_cents / baseline_cents, 4dp
      - name: severity_score
        type: number
        source: system
        description: non-linear composite score per calculation anomaly_spike_detection, 2dp
      - name: severity
        type: enum
        source: system
        description: severity band derived from severity_score
        constraints: "one of LOW | MEDIUM | HIGH | CRITICAL"
      - name: routed_queue
        type: enum
        source: system
        description: routing destination derived from severity
        default: null
        constraints: "one of CONTROLLER_PAGER | BU_OWNER_INBOX | WEEKLY_DIGEST, or null before routing"
      - name: status
        type: enum
        source: system
        description: alert lifecycle state
        default: DETECTED
        constraints: "one of DETECTED | ROUTED | ACKNOWLEDGED | ATTRIBUTED | CLOSED_EXPLAINED | CLOSED_FALSE_POSITIVE"
      - name: root_cause_kind
        type: enum
        source: system
        description: attributed root cause category
        default: null
        constraints: "one of NEW_RESOURCE | UTILIZATION_SPIKE | COMMITMENT_EXPIRY | UNTAGGED_ABSORPTION, or null before attribution"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: X-User-ID of the user who acknowledged the alert
        default: null

  - name: Budget
    parent: null
    common_fields: true
    fields:
      - name: business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; the business unit the budget governs"
      - name: period_start
        type: datetime
        source: input
        description: inclusive UTC start of the budget period
      - name: period_end
        type: datetime
        source: input
        description: exclusive UTC end of the budget period; must be strictly after period_start
      - name: amount_cents
        type: integer
        source: input
        description: budgeted amount in cents
        constraints: "integer > 0"
      - name: forecast_cents
        type: integer
        source: input
        description: current period-end spend forecast in cents
        constraints: "integer >= 0"
      - name: accuracy_basis
        type: enum
        source: input
        description: which forecast_accuracy_and_variance variant to apply when the budget is evaluated
        default: MAPE_BASIS
        constraints: "one of MAPE_BASIS | PERIOD_END_BASIS"
      - name: forecast_history
        type: array
        source: system
        description: ordered list of prior forecast_cents values, appended on every revision; the MAPE variant reads this list
        default: []
      - name: status
        type: enum
        source: system
        description: budget lifecycle state
        default: DRAFT
        constraints: "one of DRAFT | ACTIVE | BREACHED | CLOSED"
      - name: actual_spend_cents
        type: integer
        source: computed
        description: invoiced component (non-voided invoice gross less credits, for runs whose period sits inside the budget period) plus uninvoiced component (still-UNALLOCATED cost records in the period), per calculation forecast_accuracy_and_variance
        default: 0
      - name: variance_cents
        type: integer
        source: computed
        description: actual_spend_cents - amount_cents
        default: 0
      - name: variance_pct
        type: number
        source: computed
        description: variance_cents / amount_cents * 100, 2dp
        default: 0.00
      - name: forecast_accuracy_pct
        type: number
        source: computed
        description: forecast accuracy percentage produced by the applied variant, 2dp
        default: 0.00
      - name: accuracy_basis_applied
        type: enum
        source: computed
        description: variant actually used on the most recent evaluation
        default: null
        constraints: "one of MAPE_BASIS | PERIOD_END_BASIS, or null before the first evaluation"
      - name: warning_flag
        type: boolean
        source: computed
        description: true when variance_pct is at or above WARN_THRESHOLD_PCT but below BREACH_THRESHOLD_PCT
        default: false
      - name: variance_explanation_text
        type: string
        source: system
        description: mandatory narrative recorded after a breach; null until supplied
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: number of successful forecast revisions on this budget
        default: 0

  - name: UnitEconomicsDriver
    parent: null
    common_fields: true
    fields:
      - name: business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; the business unit whose unit economics are reported"
      - name: allocation_run_id
        type: string
        source: input
        description: "FK -> AllocationRun.id; the published or closed run supplying allocated cost"
      - name: driver_name
        type: enum
        source: input
        description: business volume driver linked to cloud cost
        constraints: "one of ORDERS | ACTIVE_USERS | API_CALLS | SHIPMENTS"
      - name: driver_volume
        type: integer
        source: input
        description: business volume observed for the run period
        constraints: "integer > 0"
      - name: base_allocated_cents
        type: integer
        source: computed
        description: sum of AllocationLine.allocated_cents for this BU on the referenced run across all line kinds
        default: 0
      - name: provisional_cost_per_unit_cents
        type: number
        source: computed
        description: base_allocated_cents / driver_volume, 2dp; the value the efficiency tier is pinned from
        default: 0.00
      - name: efficiency_tier
        type: enum
        source: computed
        description: tier selected from provisional_cost_per_unit_cents
        default: null
        constraints: "one of EFFICIENT | STANDARD | INEFFICIENT, or null before compute"
      - name: platform_overhead_cents
        type: integer
        source: computed
        description: base_allocated_cents * OVERHEAD_RATE for the pinned tier, rounded half up to whole cents
        default: 0
      - name: final_cost_per_unit_cents
        type: number
        source: computed
        description: (base_allocated_cents + platform_overhead_cents) / driver_volume, 2dp
        default: 0.00

state_machines:
  - entity: ProvisioningRequest
    initial_state: SUBMITTED
    terminal_states: [TERMINATED]
    transitions:
      - from: SUBMITTED
        to: TAG_REJECTED
        trigger: "POST /finops/provisioning-requests (system evaluation at creation)"
        actor: system
        preconditions:
          - "referenced TaggingPolicy.status == ACTIVE"
          - "referenced TaggingPolicy.enforcement_mode == BLOCKING"
          - "missing_dimensions is non-empty"
        side_effects:
          - "sets missing_dimensions, compliance_score and projected_tag_state per calculation tag_compliance_evaluation"
          - "increments TaggingPolicy.rejection_count by 1"
        note: "Under BLOCKING enforcement the request is persisted in TAG_REJECTED rather than erroring, so the tagging gap is auditable; the mandatory-tag error is raised only on approve."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /finops/provisioning-requests/{id}/approve"
        actor: FinOpsAnalyst
        preconditions:
          - "referenced TaggingPolicy.status == ACTIVE"
          - "referenced BusinessUnit.status == ACTIVE"
          - "if TaggingPolicy.enforcement_mode == BLOCKING then missing_dimensions is empty"
          - "if the BU has a Budget in status BREACHED overlapping the current logical clock then that Budget.variance_explanation_text is non-null"
        side_effects: []
      - from: TAG_REJECTED
        to: SUBMITTED
        trigger: "POST /finops/provisioning-requests/{id}/retag"
        actor: FinOpsAnalyst
        preconditions:
          - "referenced TaggingPolicy.status == ACTIVE"
        side_effects:
          - "replaces requested_tags with the submitted map"
          - "recomputes missing_dimensions, compliance_score and projected_tag_state"
          - "increments retag_count by 1"
          - "decrements TaggingPolicy.rejection_count by 1"
        note: "Cycle: a request may be rejected, retagged and re-evaluated any number of times."
      - from: SUBMITTED
        to: TAG_REJECTED
        trigger: "POST /finops/provisioning-requests/{id}/retag (re-evaluation still non-compliant under BLOCKING)"
        actor: FinOpsAnalyst
        preconditions:
          - "referenced TaggingPolicy.status == ACTIVE"
          - "referenced TaggingPolicy.enforcement_mode == BLOCKING"
          - "recomputed missing_dimensions is non-empty"
        side_effects:
          - "increments retag_count by 1"
          - "increments TaggingPolicy.rejection_count by 1"
      - from: APPROVED
        to: PROVISIONED
        trigger: "POST /finops/provisioning-requests/{id}/provision"
        actor: FinOpsAnalyst
        preconditions:
          - "referenced BusinessUnit.status == ACTIVE"
        side_effects:
          - "creates a CloudResource in lifecycle_state ACTIVE carrying applied_tags, tag_state = projected_tag_state, environment, owner_user_id and monthly_run_rate_cents copied from the request"
          - "recomputes BusinessUnit.resource_count and BusinessUnit.tracked_run_rate_cents"
      - from: PROVISIONED
        to: TERMINATED
        trigger: "system cascade when the provisioned CloudResource reaches TERMINATED"
        actor: system
        preconditions:
          - "the CloudResource created by this request has lifecycle_state == TERMINATED"
        side_effects: []
        note: "Bubble-up: the request mirrors its resource's terminal state so no further provisioning action is possible."

  - entity: CloudResource
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: FLAGGED_IDLE
        trigger: "POST /finops/scans/idle-detection"
        actor: system
        preconditions:
          - "utilization_pct <= IDLE_UTILIZATION_MAX_PCT"
          - "monthly_run_rate_cents >= MIN_RUN_RATE_CENTS"
        side_effects:
          - "creates a RemediationTask with kind = IDLE_TERMINATE in status PROPOSED per calculation idle_and_rightsizing_evaluation"
      - from: ACTIVE
        to: RIGHTSIZE_PENDING
        trigger: "POST /finops/scans/idle-detection"
        actor: system
        preconditions:
          - "utilization_pct > IDLE_UTILIZATION_MAX_PCT"
          - "utilization_pct <= RIGHTSIZE_UTILIZATION_MAX_PCT"
          - "monthly_run_rate_cents >= MIN_RUN_RATE_CENTS"
        side_effects:
          - "creates a RemediationTask with kind = RIGHTSIZE in status PROPOSED per calculation idle_and_rightsizing_evaluation"
      - from: RIGHTSIZE_PENDING
        to: RESIZED
        trigger: "system cascade when the resource's RemediationTask of kind RIGHTSIZE reaches EXECUTED or AUTO_EXECUTED"
        actor: system
        preconditions:
          - "the task's kind == RIGHTSIZE"
        side_effects:
          - "reduces monthly_run_rate_cents by the task's projected_savings_cents"
          - "recomputes BusinessUnit.tracked_run_rate_cents"
      - from: RESIZED
        to: ACTIVE
        trigger: "PATCH /finops/cloud-resources/{id}/telemetry"
        actor: PlatformAdmin
        preconditions:
          - "submitted utilization_pct > RIGHTSIZE_UTILIZATION_MAX_PCT"
        side_effects:
          - "updates utilization_pct"
        note: "Cycle: a resized resource returning to healthy utilization becomes ACTIVE again and may be re-flagged by a later scan."
      - from: FLAGGED_IDLE
        to: ACTIVE
        trigger: "system cascade when the resource's RemediationTask reaches CANCELLED"
        actor: system
        preconditions:
          - "no other RemediationTask on this resource is in a non-terminal status"
        side_effects: []
      - from: RIGHTSIZE_PENDING
        to: ACTIVE
        trigger: "system cascade when the resource's RemediationTask reaches CANCELLED"
        actor: system
        preconditions:
          - "no other RemediationTask on this resource is in a non-terminal status"
        side_effects: []
      - from: FLAGGED_IDLE
        to: TERMINATED
        trigger: "system cascade when the resource's RemediationTask of kind IDLE_TERMINATE reaches EXECUTED or AUTO_EXECUTED"
        actor: system
        preconditions:
          - "the task's kind == IDLE_TERMINATE"
        side_effects:
          - "sets monthly_run_rate_cents to 0"
          - "sets every CostRecord with cloud_resource_id = this resource and allocation_state in {UNALLOCATED, ALLOCATED} to REVERSED"
          - "each reversed record that carries an applied_commitment_id drops out of that Commitment's covered_spend_cents, which recomputes the Commitment's utilization_pct and waste_cents and may move the Commitment to UNDER_UTILIZED"
          - "cascades the owning ProvisioningRequest to TERMINATED"
          - "recomputes BusinessUnit.resource_count, BusinessUnit.tracked_run_rate_cents and BusinessUnit.direct_spend_cents"

  - entity: AllocationRun
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: COMPUTED_PROVISIONAL
        trigger: "POST /finops/allocation-runs/{id}/compute with variant = PROVISIONAL"
        actor: FinOpsAnalyst
        preconditions:
          - "every SharedCostPool of this run has at least one eligible participant"
        side_effects:
          - "deletes all existing AllocationLine rows of this run"
          - "creates DIRECT and SHARED lines per calculation allocation_run_totals using the PROVISIONAL variant"
          - "sets variant_applied = PROVISIONAL, scoped_effective_cost_cents, total_allocated_cents and line_count"
      - from: DRAFT
        to: COMPUTED_FINAL
        trigger: "POST /finops/allocation-runs/{id}/compute with variant = FINAL"
        actor: FinOpsAnalyst
        preconditions:
          - "every SharedCostPool of this run has at least one eligible participant"
        side_effects:
          - "deletes all existing AllocationLine rows of this run"
          - "creates DIRECT and SHARED lines per calculation allocation_run_totals using the FINAL variant"
          - "sets variant_applied = FINAL, scoped_effective_cost_cents, total_allocated_cents and line_count"
      - from: COMPUTED_PROVISIONAL
        to: COMPUTED_FINAL
        trigger: "POST /finops/allocation-runs/{id}/compute with variant = FINAL"
        actor: FinOpsAnalyst
        preconditions:
          - "every SharedCostPool of this run has at least one eligible participant"
        side_effects:
          - "deletes all existing AllocationLine rows of this run and recomputes them on the FINAL variant"
          - "sets variant_applied = FINAL and replaces total_allocated_cents with the FINAL total"
        note: "Reconciliation: the delta between the PROVISIONAL and FINAL totals equals the commitment discount recognised on the run's records."
      - from: COMPUTED_FINAL
        to: PUBLISHED
        trigger: "POST /finops/allocation-runs/{id}/publish"
        actor: FinOpsController
        preconditions:
          - "variant_applied == FINAL"
          - "publishing user id != created_by_user_id (segregation of duties)"
          - "every SharedCostPool of this run has status == SEALED"
          - "if mode == CHARGEBACK then every business unit appearing on a line has chargeback_enabled == true"
        side_effects:
          - "sets published_by_user_id"
          - "sets every CostRecord referenced by the run's DIRECT and SHARED lines to allocation_state ALLOCATED and allocated_by_run_id = this run"
          - "if mode == CHARGEBACK creates one ChargebackInvoice per business unit on the run in settlement_status UNBILLED and dispute_status NONE with gross_amount_cents = that BU's line total"
          - "recomputes BusinessUnit.showback_total_cents for SHOWBACK runs and BusinessUnit.chargeback_balance_cents for CHARGEBACK runs"
      - from: PUBLISHED
        to: REOPENED
        trigger: "POST /finops/allocation-runs/{id}/reopen"
        actor: FinOpsController
        preconditions:
          - "no ChargebackInvoice of this run has settlement_status == SETTLED"
          - "reopen_count < MAX_RUN_REOPENS"
        side_effects:
          - "increments reopen_count by 1"
          - "sets every CostRecord with allocated_by_run_id = this run back to allocation_state UNALLOCATED and clears allocated_by_run_id"
          - "sets every ChargebackInvoice of this run to settlement_status VOIDED"
          - "deletes all AllocationLine rows of this run and resets total_allocated_cents and line_count to 0"
          - "recomputes BusinessUnit.chargeback_balance_cents and BusinessUnit.showback_total_cents"
        note: "Cycle: REOPENED runs re-enter compute and can be published again; the compensating invariant total_allocated_cents == scoped_effective_cost_cents must hold after every recompute."
      - from: REOPENED
        to: COMPUTED_FINAL
        trigger: "POST /finops/allocation-runs/{id}/compute with variant = FINAL"
        actor: FinOpsAnalyst
        preconditions:
          - "every SharedCostPool of this run has at least one eligible participant"
        side_effects:
          - "recreates DIRECT and SHARED lines on the FINAL variant and resets total_allocated_cents, scoped_effective_cost_cents and line_count"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /finops/allocation-runs/{id}/close"
        actor: FinOpsController
        preconditions:
          - "mode == SHOWBACK, or every ChargebackInvoice of this run has settlement_status in {SETTLED, WRITTEN_OFF}"
          - "no Dispute on any invoice of this run is in status OPEN, UNDER_REVIEW or INFO_REQUESTED"
        side_effects:
          - "freezes the run; no further compute, publish, reopen or manual adjustment is permitted"
        note: "Compound gate: the run's closability is derived from the aggregate state of its invoices and their disputes."

  - entity: ChargebackInvoice
    initial_state: UNBILLED
    terminal_states: [SETTLED, WRITTEN_OFF, VOIDED]
    transitions:
      - from: UNBILLED
        to: ISSUED
        trigger: "POST /finops/chargeback-invoices/{id}/issue"
        actor: FinOpsController
        preconditions:
          - "the issuing AllocationRun.status == PUBLISHED"
          - "the billed BusinessUnit.chargeback_enabled == true"
          - "the billed BusinessUnit.status == ACTIVE"
        side_effects:
          - "sets issued_at to the current logical clock and dispute_window_ends_at = issued_at + DISPUTE_WINDOW_HOURS"
          - "recomputes net_due_cents and BusinessUnit.chargeback_balance_cents"
        note: "settlement_status dimension only; dispute_status is untouched."
      - from: ISSUED
        to: PARTIALLY_CREDITED
        trigger: "system cascade when a Dispute on this invoice resolves as RESOLVED_ADJUSTED with granted_credit_cents < gross_amount_cents"
        actor: system
        preconditions:
          - "granted_credit_cents > 0"
          - "granted_credit_cents + credited_amount_cents + paid_amount_cents < gross_amount_cents"
        side_effects:
          - "increases credited_amount_cents by granted_credit_cents and recomputes net_due_cents"
          - "recomputes BusinessUnit.chargeback_balance_cents, which re-evaluates any ACTIVE or BREACHED Budget on that BU"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /finops/chargeback-invoices/{id}/settle"
        actor: BusinessUnitOwner
        preconditions:
          - "the acting BusinessUnitOwner id equals business_unit_id"
          - "paid_amount_cents + submitted payment_cents == gross_amount_cents - credited_amount_cents"
          - "dispute_status != DISPUTED"
        side_effects:
          - "increases paid_amount_cents and recomputes net_due_cents to 0"
          - "recomputes BusinessUnit.chargeback_balance_cents"
      - from: PARTIALLY_CREDITED
        to: SETTLED
        trigger: "POST /finops/chargeback-invoices/{id}/settle"
        actor: BusinessUnitOwner
        preconditions:
          - "the acting BusinessUnitOwner id equals business_unit_id"
          - "paid_amount_cents + submitted payment_cents == gross_amount_cents - credited_amount_cents"
          - "dispute_status != DISPUTED"
        side_effects:
          - "increases paid_amount_cents and recomputes net_due_cents to 0"
          - "recomputes BusinessUnit.chargeback_balance_cents"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /finops/chargeback-invoices/{id}/write-off"
        actor: FinOpsController
        preconditions:
          - "dispute_status != DISPUTED"
        side_effects:
          - "records the write-off memo and recomputes net_due_cents to 0"
          - "recomputes BusinessUnit.chargeback_balance_cents; the invoice drops out of the balance identity"
      - from: PARTIALLY_CREDITED
        to: WRITTEN_OFF
        trigger: "POST /finops/chargeback-invoices/{id}/write-off"
        actor: FinOpsController
        preconditions:
          - "dispute_status != DISPUTED"
        side_effects:
          - "records the write-off memo and recomputes net_due_cents to 0"
          - "recomputes BusinessUnit.chargeback_balance_cents"
      - from: ISSUED
        to: VOIDED
        trigger: "system cascade when the issuing AllocationRun is reopened"
        actor: system
        preconditions:
          - "settlement_status != SETTLED"
        side_effects:
          - "recomputes net_due_cents to 0 and BusinessUnit.chargeback_balance_cents"
      - from: NONE
        to: DISPUTED
        trigger: "POST /finops/disputes"
        actor: BusinessUnitOwner
        preconditions:
          - "settlement_status in {ISSUED, PARTIALLY_CREDITED}"
          - "current logical clock <= dispute_window_ends_at"
          - "claimed_credit_cents <= gross_amount_cents - credited_amount_cents"
        side_effects:
          - "sets every CostRecord referenced by this invoice's lines to allocation_state DISPUTED_HOLD"
        note: "dispute_status dimension; the invoice's settlement_status is unchanged, so the two dimensions evolve independently on the same row."
      - from: DISPUTED
        to: DISPUTE_RESOLVED
        trigger: "POST /finops/disputes/{id}/resolve"
        actor: FinOpsController
        preconditions:
          - "the Dispute reaches RESOLVED_ADJUSTED or RESOLVED_UPHELD"
        side_effects:
          - "returns every CostRecord on this invoice's lines from DISPUTED_HOLD to ALLOCATED"
      - from: DISPUTED
        to: NONE
        trigger: "POST /finops/disputes/{id}/withdraw"
        actor: BusinessUnitOwner
        preconditions:
          - "no other Dispute on this invoice is in status OPEN, UNDER_REVIEW or INFO_REQUESTED"
        side_effects:
          - "returns every CostRecord on this invoice's lines from DISPUTED_HOLD to ALLOCATED"
        note: "Cycle on the dispute_status dimension: a withdrawn dispute returns the invoice to NONE so a new dispute may be filed while the window is open."
  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_ADJUSTED, RESOLVED_UPHELD, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /finops/disputes/{id}/start-review"
        actor: FinOpsController
        preconditions:
          - "review_round < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "increments review_round by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /finops/disputes/{id}/request-info"
        actor: FinOpsController
        preconditions:
          - "review_round <= MAX_DISPUTE_ROUNDS"
        side_effects:
          - "records the information request question"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /finops/disputes/{id}/respond"
        actor: BusinessUnitOwner
        preconditions:
          - "the acting BusinessUnitOwner id equals filed_by_business_unit_id"
          - "review_round < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "appends the response to narrative"
          - "increments review_round by 1"
        note: "Cycle: review and information requests may alternate until review_round reaches MAX_DISPUTE_ROUNDS, after which respond is rejected with ERR_DISPUTE_ROUND_LIMIT."
      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /finops/disputes/{id}/resolve with outcome = ADJUSTED"
        actor: FinOpsController
        preconditions:
          - "the invoice's settlement_status in {ISSUED, PARTIALLY_CREDITED}"
          - "submitted granted_credit_cents <= invoice.gross_amount_cents - invoice.credited_amount_cents - invoice.paid_amount_cents"
        side_effects:
          - "sets outcome = ADJUSTED, granted_credit_cents and resolved_by_user_id"
          - "increases the invoice's credited_amount_cents, which moves the invoice's settlement dimension to PARTIALLY_CREDITED and lowers net_due_cents"
          - "the invoice change recomputes BusinessUnit.chargeback_balance_cents"
          - "the BU balance change re-evaluates the BU's ACTIVE or BREACHED Budget, which may move a BREACHED budget back to ACTIVE"
          - "moves the invoice's dispute dimension to DISPUTE_RESOLVED and returns held CostRecords to ALLOCATED"
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /finops/disputes/{id}/resolve with outcome = UPHELD"
        actor: FinOpsController
        preconditions:
          - "the invoice's settlement_status in {ISSUED, PARTIALLY_CREDITED}"
        side_effects:
          - "sets outcome = UPHELD, granted_credit_cents = 0 and resolved_by_user_id"
          - "moves the invoice's dispute dimension to DISPUTE_RESOLVED and returns held CostRecords to ALLOCATED"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /finops/disputes/{id}/withdraw"
        actor: BusinessUnitOwner
        preconditions:
          - "the acting BusinessUnitOwner id equals filed_by_business_unit_id"
        side_effects:
          - "moves the invoice's dispute dimension back to NONE and returns held CostRecords to ALLOCATED"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /finops/disputes/{id}/withdraw"
        actor: BusinessUnitOwner
        preconditions:
          - "the acting BusinessUnitOwner id equals filed_by_business_unit_id"
        side_effects:
          - "moves the invoice's dispute dimension back to NONE and returns held CostRecords to ALLOCATED"

  - entity: Commitment
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /finops/commitments/{id}/activate"
        actor: FinOpsController
        preconditions:
          - "current logical clock <= term_end"
        side_effects:
          - "sets committed_capacity_cents = hourly_commit_cents * HOURS_PER_PERIOD"
          - "runs calculation commitment_application_waterfall over eligible UNALLOCATED CostRecords, setting each covered record's applied_commitment_id and effective_cost_cents"
          - "sets covered_spend_cents, total_discount_cents, waste_cents, coverage_pct and utilization_pct"
          - "recomputes BusinessUnit.direct_spend_cents for every business unit owning a covered record"
      - from: ACTIVE
        to: UNDER_UTILIZED
        trigger: "POST /finops/commitments/{id}/evaluate, or system cascade when a covered CostRecord is reversed"
        actor: FinOpsController
        preconditions:
          - "utilization_pct < utilization_target_pct"
        side_effects:
          - "recomputes covered_spend_cents, waste_cents and utilization_pct"
      - from: UNDER_UTILIZED
        to: ACTIVE
        trigger: "POST /finops/commitments/{id}/evaluate"
        actor: FinOpsController
        preconditions:
          - "utilization_pct >= utilization_target_pct"
        side_effects:
          - "recomputes covered_spend_cents, waste_cents and utilization_pct"
        note: "Cycle: coverage may recover after new cost records are absorbed, so a commitment oscillates between ACTIVE and UNDER_UTILIZED."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /finops/commitments/{id}/evaluate"
        actor: FinOpsController
        preconditions:
          - "current logical clock > term_end"
        side_effects:
          - "freezes coverage; no further CostRecord may be covered by this commitment"
      - from: UNDER_UTILIZED
        to: EXPIRED
        trigger: "POST /finops/commitments/{id}/evaluate"
        actor: FinOpsController
        preconditions:
          - "current logical clock > term_end"
        side_effects:
          - "freezes coverage; no further CostRecord may be covered by this commitment"

  - entity: RemediationTask
    initial_state: PROPOSED
    terminal_states: [EXECUTED, AUTO_EXECUTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: OWNER_NOTIFIED
        trigger: "POST /finops/remediation-tasks/{id}/notify-owner"
        actor: FinOpsAnalyst
        preconditions:
          - "the resource's lifecycle_state in {FLAGGED_IDLE, RIGHTSIZE_PENDING}"
          - "no other RemediationTask on the same CloudResource has an open notification window overlapping the new window"
        side_effects:
          - "sets remediation_window_starts_at to the current logical clock and remediation_window_ends_at = start + REMEDIATION_WINDOW_HOURS"
      - from: OWNER_NOTIFIED
        to: OWNER_SNOOZED
        trigger: "POST /finops/remediation-tasks/{id}/snooze"
        actor: ResourceOwner
        preconditions:
          - "the acting ResourceOwner id equals the resource's owner_user_id"
          - "current logical clock <= remediation_window_ends_at"
          - "snooze_count < MAX_SNOOZES"
        side_effects:
          - "extends remediation_window_ends_at by REMEDIATION_WINDOW_HOURS"
          - "increments snooze_count by 1"
      - from: OWNER_SNOOZED
        to: OWNER_NOTIFIED
        trigger: "POST /finops/remediation-tasks/{id}/notify-owner"
        actor: FinOpsAnalyst
        preconditions:
          - "current logical clock <= remediation_window_ends_at"
        side_effects:
          - "records a fresh notification without moving remediation_window_ends_at"
        note: "Cycle: notify and snooze alternate while the window is open, up to MAX_SNOOZES."
      - from: OWNER_NOTIFIED
        to: APPROVED
        trigger: "POST /finops/remediation-tasks/{id}/approve"
        actor: ResourceOwner
        preconditions:
          - "the acting ResourceOwner id equals the resource's owner_user_id"
          - "current logical clock <= remediation_window_ends_at"
        side_effects: []
      - from: OWNER_SNOOZED
        to: APPROVED
        trigger: "POST /finops/remediation-tasks/{id}/approve"
        actor: ResourceOwner
        preconditions:
          - "the acting ResourceOwner id equals the resource's owner_user_id"
          - "current logical clock <= remediation_window_ends_at"
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /finops/scans/remediation-window-sweep"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "sets realized_savings_cents = projected_savings_cents"
          - "for kind RIGHTSIZE cascades the CloudResource to RESIZED and lowers its monthly_run_rate_cents by realized_savings_cents"
          - "for kind IDLE_TERMINATE cascades the CloudResource to TERMINATED, which reverses its CostRecords, which in turn recomputes coverage on any Commitment those records were applied to"
      - from: OWNER_NOTIFIED
        to: AUTO_EXECUTED
        trigger: "POST /finops/scans/remediation-window-sweep"
        actor: system
        preconditions:
          - "current logical clock > remediation_window_ends_at"
          - "auto_remediation_eligible == true"
        side_effects:
          - "sets realized_savings_cents = projected_savings_cents"
          - "for kind IDLE_TERMINATE cascades the CloudResource to TERMINATED, which reverses its CostRecords, which in turn recomputes the applied Commitment's covered_spend_cents, waste_cents and utilization_pct and may move that Commitment to UNDER_UTILIZED"
          - "for kind RIGHTSIZE cascades the CloudResource to RESIZED and lowers its monthly_run_rate_cents"
      - from: OWNER_NOTIFIED
        to: CANCELLED
        trigger: "POST /finops/remediation-tasks/{id}/cancel"
        actor: ResourceOwner
        preconditions:
          - "the acting ResourceOwner id equals the resource's owner_user_id"
        side_effects:
          - "cascades the CloudResource back to ACTIVE when no other non-terminal task remains on it"
      - from: OWNER_SNOOZED
        to: CANCELLED
        trigger: "POST /finops/remediation-tasks/{id}/cancel"
        actor: ResourceOwner
        preconditions:
          - "the acting ResourceOwner id equals the resource's owner_user_id"
        side_effects:
          - "cascades the CloudResource back to ACTIVE when no other non-terminal task remains on it"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /finops/remediation-tasks/{id}/cancel"
        actor: FinOpsAnalyst
        preconditions: []
        side_effects:
          - "cascades the CloudResource back to ACTIVE when no other non-terminal task remains on it"
      - from: OWNER_NOTIFIED
        to: CANCELLED
        trigger: "POST /finops/scans/remediation-window-sweep"
        actor: system
        preconditions:
          - "current logical clock > remediation_window_ends_at"
          - "auto_remediation_eligible == false"
        side_effects:
          - "cascades the CloudResource back to ACTIVE when no other non-terminal task remains on it"
        note: "Branching fork: the same sweep drives AUTO_EXECUTED or CANCELLED depending on auto_remediation_eligible, with completely different side-effect sets."

  - entity: AnomalyAlert
    initial_state: DETECTED
    terminal_states: [CLOSED_EXPLAINED, CLOSED_FALSE_POSITIVE]
    transitions:
      - from: DETECTED
        to: ROUTED
        trigger: "POST /finops/anomaly-scans (routing step of the same scan)"
        actor: system
        preconditions:
          - "severity is set"
        side_effects:
          - "sets routed_queue = CONTROLLER_PAGER when severity in {HIGH, CRITICAL}, BU_OWNER_INBOX when severity == MEDIUM, WEEKLY_DIGEST when severity == LOW"
      - from: ROUTED
        to: ACKNOWLEDGED
        trigger: "POST /finops/anomaly-alerts/{id}/acknowledge"
        actor: FinOpsAnalyst
        preconditions: []
        side_effects:
          - "sets acknowledged_by_user_id"
      - from: ACKNOWLEDGED
        to: ATTRIBUTED
        trigger: "POST /finops/anomaly-alerts/{id}/attribute"
        actor: FinOpsAnalyst
        preconditions:
          - "the submitted root_cause_cloud_resource_id belongs to the alert's business_unit_id"
          - "the submitted resource's lifecycle_state != TERMINATED"
        side_effects:
          - "sets root_cause_cloud_resource_id and root_cause_kind"
      - from: ATTRIBUTED
        to: CLOSED_EXPLAINED
        trigger: "POST /finops/anomaly-alerts/{id}/close with resolution = EXPLAINED"
        actor: FinOpsController
        preconditions:
          - "root_cause_kind is non-null"
        side_effects: []
      - from: ACKNOWLEDGED
        to: CLOSED_FALSE_POSITIVE
        trigger: "POST /finops/anomaly-alerts/{id}/close with resolution = FALSE_POSITIVE"
        actor: FinOpsController
        preconditions: []
        side_effects:
          - "clears root_cause_cloud_resource_id and root_cause_kind"

  - entity: Budget
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /finops/budgets/{id}/activate"
        actor: FinOpsController
        preconditions:
          - "the governed BusinessUnit.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /finops/budgets/{id}/evaluate"
        actor: FinOpsController
        preconditions:
          - "variance_pct >= BREACH_THRESHOLD_PCT after running calculation forecast_accuracy_and_variance"
        side_effects:
          - "sets actual_spend_cents, variance_cents, variance_pct, forecast_accuracy_pct, accuracy_basis_applied and warning_flag"
          - "gates approval of further provisioning requests for the business unit until variance_explanation_text is recorded"
      - from: BREACHED
        to: ACTIVE
        trigger: "POST /finops/budgets/{id}/evaluate, or system cascade when a dispute credit lowers the business unit's invoiced spend"
        actor: FinOpsController
        preconditions:
          - "variance_pct < BREACH_THRESHOLD_PCT after running calculation forecast_accuracy_and_variance"
        side_effects:
          - "recomputes actual_spend_cents, variance_cents, variance_pct and warning_flag"
          - "releases the provisioning gate on the business unit"
        note: "Cycle: a budget oscillates between ACTIVE and BREACHED as spend and credits move."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /finops/budgets/{id}/close"
        actor: FinOpsController
        preconditions: []
        side_effects: []
      - from: BREACHED
        to: CLOSED
        trigger: "POST /finops/budgets/{id}/close"
        actor: FinOpsController
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: allocation-adjustment-stale-run
    parent_entity: AllocationRun
    write_endpoint: "POST /finops/allocation-runs/{id}/manual-adjustments"
    occ_field: "expected_allocation_run_version"
    description: |
      Posting a manual adjustment line against an AllocationRun whose version has
      advanced since the client last read it is rejected with a stale-version error.
      This captures the case where a recompute has already replaced the run's line
      set, so the adjustment the client derived from the older line set no longer
      describes the run it would be appended to.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: budget-revise-stale-budget
    parent_entity: Budget
    write_endpoint: "POST /finops/budgets/{id}/revise"
    occ_field: "expected_budget_version"
    description: |
      Revising a Budget's forecast while carrying a version older than the Budget's
      current version is rejected. A prior revision or evaluation has already
      appended to forecast_history, so the accuracy basis the client computed its
      new forecast against is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: tagging-policy-amend-stale-policy
    parent_entity: TaggingPolicy
    write_endpoint: "PUT /finops/tagging-policies/{id}"
    occ_field: "expected_tagging_policy_version"
    description: |
      Amending a TaggingPolicy's mandatory dimensions or enforcement mode with a
      version older than the policy's current version is rejected, because the
      amendment was authored against a dimension set that has since been replaced.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: tag_compliance_evaluation
    trigger: "on POST /finops/provisioning-requests and on every POST /finops/provisioning-requests/{id}/retag"
    algorithm: weighted_scoring
    formula: |
      mandatory = policy.mandatory_dimensions            # ordered subset of [team, environment, application]
      missing_dimensions = [d for d in mandatory
                            if requested_tags[d] is absent or trim(requested_tags[d]) == ""]
      satisfied_weight = SUM(DIMENSION_WEIGHT[d] for d in mandatory if d not in missing_dimensions)
      mandatory_weight = SUM(DIMENSION_WEIGHT[d] for d in mandatory)
      compliance_score = round_half_up(satisfied_weight / mandatory_weight * 100, 2)
      projected_tag_state = TAGGED   if compliance_score == 100.00
                            UNTAGGED if compliance_score == 0.00
                            PARTIAL  otherwise
    input_set: "the single ProvisioningRequest being created or retagged, evaluated against its referenced TaggingPolicy whose status must be ACTIVE"
    constants:
      DIMENSION_WEIGHT: { team: 40, environment: 35, application: 25 }
    precision: "2 decimal places, round_half_up"

  - name: commitment_application_waterfall
    trigger: "on POST /finops/commitments/{id}/activate"
    algorithm: waterfall_allocation
    formula: |
      committed_capacity_cents = hourly_commit_cents * HOURS_PER_PERIOD
      coverable = COVERABLE_KINDS[commitment_type]      # RESERVED_INSTANCE -> [covered_resource_kind]
                                                       # SAVINGS_PLAN      -> [COMPUTE, DATABASE]
      candidates = CostRecord rows where allocation_state == UNALLOCATED
                     and applied_commitment_id is null
                     and resource_kind in coverable
                     and billing_period_start >= commitment.term_start
                     and billing_period_end   <= commitment.term_end
      # PINNED PROCESSING ORDER (no random id may participate):
      order candidates by KIND_RANK[resource_kind] ASC,
                          billing_period_start ASC,
                          created_at ASC
      remaining = committed_capacity_cents
      total_discount_cents = 0
      for record in candidates:                        # all-or-nothing per record, no partial coverage
          if record.list_cost_cents <= remaining:
              # PINNED ROUNDING ORDER: round the discount PER RECORD, then sum the rounded values.
              # Summing list costs first and rounding once at the end is WRONG and yields a
              # different total (see difficulty instance commitment_discount_round_per_record_then_sum).
              discount = round_half_up(record.list_cost_cents * DISCOUNT_RATE[commitment_type], 0)
              record.effective_cost_cents = record.list_cost_cents - discount
              record.applied_commitment_id = commitment.id
              total_discount_cents += discount
              remaining -= record.list_cost_cents
      covered_spend_cents = SUM(list_cost_cents of records whose applied_commitment_id == commitment.id
                                and allocation_state != REVERSED)
      waste_cents          = max(0, committed_capacity_cents - covered_spend_cents)
      utilization_pct      = round_half_up(covered_spend_cents / committed_capacity_cents * 100, 2)
      in_scope_list_total  = SUM(list_cost_cents of candidates evaluated in this pass)
      coverage_pct         = round_half_up(covered_spend_cents / in_scope_list_total * 100, 2)
    input_set: "CostRecord rows in allocation_state UNALLOCATED with no commitment yet applied, whose resource_kind is coverable by the commitment type and whose billing period sits inside the commitment's closed term"
    constants:
      HOURS_PER_PERIOD: 720
      KIND_RANK: { COMPUTE: 1, DATABASE: 2, STORAGE: 3 }
      COVERABLE_KINDS: { RESERVED_INSTANCE: "[covered_resource_kind]", SAVINGS_PLAN: "[COMPUTE, DATABASE]" }
      DISCOUNT_RATE: { RESERVED_INSTANCE: 0.40, SAVINGS_PLAN: 0.275 }
      COMMITMENT_BUFFER_HOURS: 24
      REGION_MAX_HOURLY_COMMIT_CENTS: 500
    precision: "whole cents for money, round_half_up per record; 2 decimal places for percentages"

  - name: shared_pool_allocation
    trigger: "during POST /finops/allocation-runs/{id}/compute, once per SharedCostPool attached to the run"
    algorithm: aggregation
    formula: |
      pooled = pool.pooled_cost_cents
      participants = pool.participant_business_unit_ids filtered to BusinessUnit.status == ACTIVE
      if participants is empty: reject with ERR_NO_ELIGIBLE_PARTICIPANTS
      if pool.methodology == PROPORTIONAL:
          basis(bu) = bu.direct_spend_cents  when proportional_basis == SPEND
                      bu.headcount           when proportional_basis == HEADCOUNT
                      bu.revenue_cents       when proportional_basis == REVENUE
          basis_total = SUM(basis(bu) for bu in participants)
          if basis_total == 0: reject with ERR_PROPORTIONAL_BASIS_ZERO
          exact(bu)  = pooled * basis(bu) / basis_total
          method_applied = PROPORTIONAL
      else:                                            # EVEN_SPLIT
          exact(bu)  = pooled / count(participants)
          method_applied = EVEN_SPLIT
      allocated(bu) = floor(exact(bu))                 # floor, never round, so the sum never overshoots
      remainder = pooled - SUM(allocated(bu))
      # PINNED REMAINDER RULE: hand out the remaining cents one at a time, to the largest
      # fractional part of exact(bu) first; ties break on BusinessUnit.created_at ASC.
      # UUID id values MUST NOT participate in this ordering.
      for bu in participants ordered by frac(exact(bu)) DESC, BusinessUnit.created_at ASC:
          if remainder == 0: break
          allocated(bu) += 1
          rounding_remainder_cents(bu) = 1
          remainder -= 1
      emit one AllocationLine per participant with line_kind = SHARED, method_applied,
        allocated_cents = allocated(bu), basis_value = round_half_up(basis(bu), 2)
    input_set: "the pool's participant BusinessUnits restricted to status ACTIVE; pooled_cost_cents is the sum of effective_cost_cents over CostRecord rows whose shared_cost_pool_id is this pool"
    constants: {}
    precision: "whole cents; floor plus largest-fractional-part remainder so SUM(SHARED lines) == pooled_cost_cents exactly"

  - name: allocation_run_totals
    trigger: "on POST /finops/allocation-runs/{id}/compute"
    algorithm: chronological
    formula: |
      in_scope = CostRecord rows where
                   billing_period_start >= run.period_start
                   and billing_period_end <= run.period_end
                   and allocation_state in {UNALLOCATED, DISPUTED_HOLD}
                   and (run.scope_business_unit_id is null
                        or the record's business_unit_id is that BU or one of its descendants
                           in the parent_business_unit_id tree)
      direct_records = in_scope where shared_cost_pool_id is null and business_unit_id is not null
      # one DIRECT line per business unit, records aggregated in created_at ASC order
      for bu in distinct business_unit_id of direct_records ordered by BusinessUnit.created_at ASC:
          allocated_cents = SUM(basis_amount(r) for r in direct_records of bu)
          emit AllocationLine(line_kind = DIRECT, method_applied = LIST_BASIS or EFFECTIVE_BASIS,
                              allocated_cents = allocated_cents)
      for pool in run's SharedCostPools ordered by SharedCostPool.created_at ASC:
          emit the SHARED lines produced by calculation shared_pool_allocation
      scoped_effective_cost_cents = SUM(effective_cost_cents of in_scope)
      total_allocated_cents = SUM(allocated_cents of this run's lines with line_kind in {DIRECT, SHARED})
      line_count = COUNT(all AllocationLine rows of this run, MANUAL_ADJUSTMENT included)
    input_set: "CostRecord rows fully inside the run period, in allocation_state UNALLOCATED or DISPUTED_HOLD, restricted to the scope BU subtree when scope_business_unit_id is set; records already ALLOCATED by another run or REVERSED are excluded"
    constants: {}
    precision: "whole cents"
    variants:
      - name: PROVISIONAL
        when: "POST /finops/allocation-runs/{id}/compute is called with variant = PROVISIONAL; produces informational pre-invoice numbers"
        difference: "basis_amount(r) = r.list_cost_cents, i.e. DIRECT lines are struck at undiscounted list cost with method_applied = LIST_BASIS. Commitment discounts are deliberately NOT recognised, so total_allocated_cents exceeds scoped_effective_cost_cents by exactly the commitment discount on the run's records."
      - name: FINAL
        when: "POST /finops/allocation-runs/{id}/compute is called with variant = FINAL; the only variant publishable"
        difference: "basis_amount(r) = r.effective_cost_cents, i.e. DIRECT lines are struck net of commitment discount with method_applied = EFFECTIVE_BASIS. total_allocated_cents then satisfies the compensating invariant total_allocated_cents == scoped_effective_cost_cents."

  - name: invoice_settlement_ledger
    trigger: "on invoice issue, dispute resolution with a credit, settle, write-off and run reopen"
    algorithm: aggregation
    formula: |
      credited_amount_cents = SUM(granted_credit_cents of Disputes on this invoice with status == RESOLVED_ADJUSTED)
      paid_amount_cents     = SUM(payment_cents recorded by settle calls on this invoice)
      net_due_cents         = 0 if settlement_status in {SETTLED, WRITTEN_OFF, VOIDED}
                              else gross_amount_cents - credited_amount_cents - paid_amount_cents
      BusinessUnit.chargeback_balance_cents =
        SUM(net_due_cents of the BU's ChargebackInvoices whose settlement_status
            is not in {VOIDED, WRITTEN_OFF})
    input_set: "all ChargebackInvoice rows of the business unit excluding voided and written-off invoices"
    constants:
      DISPUTE_WINDOW_HOURS: 168
      MAX_RUN_REOPENS: 2
      MAX_DISPUTE_ROUNDS: 3
    precision: "whole cents"

  - name: forecast_accuracy_and_variance
    trigger: "on POST /finops/budgets/{id}/evaluate and as a cascade whenever an invoice credit changes the BU's invoiced spend"
    algorithm: threshold
    formula: |
      invoiced_component =
        SUM(i.gross_amount_cents - i.credited_amount_cents
            for ChargebackInvoice i of this BU where i.settlement_status != VOIDED
            and the issuing AllocationRun.period_start >= budget.period_start
            and the issuing AllocationRun.period_end   <= budget.period_end)
      uninvoiced_component =
        SUM(r.effective_cost_cents for CostRecord r of this BU where r.allocation_state == UNALLOCATED
            and r.billing_period_start >= budget.period_start
            and r.billing_period_end   <= budget.period_end)
      actual_spend_cents = invoiced_component + uninvoiced_component
      variance_cents = actual_spend_cents - amount_cents
      variance_pct   = round_half_up(variance_cents / amount_cents * 100, 2)
      forecast_accuracy_pct = per the applied variant below
      status        = BREACHED if variance_pct >= BREACH_THRESHOLD_PCT
                      else ACTIVE (a BREACHED budget returns to ACTIVE when variance_pct falls back below the threshold)
      warning_flag  = true if WARN_THRESHOLD_PCT <= variance_pct < BREACH_THRESHOLD_PCT else false
    input_set: "the BU's non-voided invoices issued from runs whose period sits inside the budget period, plus the BU's still-unallocated cost records inside the budget period"
    constants:
      BREACH_THRESHOLD_PCT: 10.00
      WARN_THRESHOLD_PCT: 5.00
    precision: "2 decimal places, round_half_up; whole cents for money"
    variants:
      - name: MAPE_BASIS
        when: "budget.accuracy_basis == MAPE_BASIS; the default, scores the whole revision trail"
        difference: "forecast_accuracy_pct = round_half_up(100 - mean(abs(h - actual_spend_cents) / actual_spend_cents) * 100, 2) over every historical forecast h in forecast_history; the current forecast_cents is deliberately excluded."
      - name: PERIOD_END_BASIS
        when: "budget.accuracy_basis == PERIOD_END_BASIS; scores only the latest standing forecast"
        difference: "forecast_accuracy_pct = round_half_up(100 - abs(forecast_cents - actual_spend_cents) / actual_spend_cents * 100, 2); forecast_history is deliberately ignored."

  - name: anomaly_spike_detection
    trigger: "on POST /finops/anomaly-scans"
    algorithm: threshold
    formula: |
      for each BusinessUnit with status == ACTIVE:
        records = the BU's CostRecord rows with allocation_state != REVERSED,
                  ordered by billing_period_start DESC, created_at DESC
        if count(records) < 4: skip this BU
        observed_cents = records[0].effective_cost_cents
        baseline_cents = floor(mean(effective_cost_cents of records[1], records[2], records[3]))
        if baseline_cents == 0: skip this BU
        delta_cents = observed_cents - baseline_cents
        spike_ratio = round_half_up(observed_cents / baseline_cents, 4)
        # EMISSION GATE: both conditions must hold, each inclusive at its boundary
        if not (spike_ratio >= SPIKE_RATIO_MIN and delta_cents >= SPIKE_DELTA_MIN_CENTS): skip
        ratio_component     = min(50, max(0, (spike_ratio - SPIKE_RATIO_MIN) * RATIO_MULTIPLIER))
        magnitude_component = min(30, delta_cents / MAGNITUDE_DIVISOR)
        budget_component    = 20 if the BU has a Budget with status == BREACHED covering the observed record
                              else 12 if that Budget's actual_spend_cents / amount_cents * 100 >= BUDGET_PRESSURE_PCT
                              else 0
        severity_score = round_half_up(ratio_component + magnitude_component + budget_component, 2)
        severity = CRITICAL if severity_score >= 70
                   HIGH     if severity_score >= 45
                   MEDIUM   if severity_score >= 25
                   LOW      otherwise
        routed_queue = CONTROLLER_PAGER if severity in {HIGH, CRITICAL}
                       BU_OWNER_INBOX   if severity == MEDIUM
                       WEEKLY_DIGEST    if severity == LOW
        emit AnomalyAlert(status = ROUTED after the routing step, detected_at = current logical clock)
    input_set: "per ACTIVE BusinessUnit, its four most recent non-reversed CostRecord rows: the newest is the observation, the next three form the baseline"
    constants:
      SPIKE_RATIO_MIN: 1.20
      SPIKE_DELTA_MIN_CENTS: 50000
      RATIO_MULTIPLIER: 25
      MAGNITUDE_DIVISOR: 100000
      BUDGET_PRESSURE_PCT: 80.00
    precision: "spike_ratio 4 decimal places, severity_score 2 decimal places, both round_half_up; baseline_cents floored to whole cents"

  - name: idle_and_rightsizing_evaluation
    trigger: "on POST /finops/scans/idle-detection"
    algorithm: threshold
    formula: |
      for each CloudResource with lifecycle_state == ACTIVE,
          ordered by monthly_run_rate_cents DESC, created_at ASC:
        if monthly_run_rate_cents < MIN_RUN_RATE_CENTS: skip
        if utilization_pct <= IDLE_UTILIZATION_MAX_PCT:
            kind = IDLE_TERMINATE
            projected_savings_cents = round_half_up(monthly_run_rate_cents * IDLE_SAVINGS_FRACTION, 0)
        else if utilization_pct <= RIGHTSIZE_UTILIZATION_MAX_PCT:
            kind = RIGHTSIZE
            projected_savings_cents = round_half_up(monthly_run_rate_cents * RIGHTSIZE_SAVINGS_FRACTION, 0)
        else:
            skip
        waste_score = round_half_up(
            min(100, (100 - utilization_pct) * UTILIZATION_WEIGHT
                     + min(40, monthly_run_rate_cents / RUN_RATE_DIVISOR)), 2)
        auto_remediation_eligible = (waste_score >= AUTO_REMEDIATION_SCORE_MIN
                                     and resource.environment != "prod")
        emit RemediationTask(status = PROPOSED, observed_utilization_pct = resource.utilization_pct)
        move the resource to FLAGGED_IDLE for IDLE_TERMINATE, RIGHTSIZE_PENDING for RIGHTSIZE
    input_set: "CloudResource rows in lifecycle_state ACTIVE whose monthly_run_rate_cents is at or above MIN_RUN_RATE_CENTS; resources already carrying a non-terminal RemediationTask are skipped"
    constants:
      IDLE_UTILIZATION_MAX_PCT: 5.00
      RIGHTSIZE_UTILIZATION_MAX_PCT: 30.00
      MIN_RUN_RATE_CENTS: 20000
      IDLE_SAVINGS_FRACTION: 1.00
      RIGHTSIZE_SAVINGS_FRACTION: 0.50
      UTILIZATION_WEIGHT: 0.6
      RUN_RATE_DIVISOR: 25000
      AUTO_REMEDIATION_SCORE_MIN: 60.00
      REMEDIATION_WINDOW_HOURS: 72
      MAX_SNOOZES: 2
    precision: "2 decimal places for waste_score, round_half_up; whole cents for savings"

  - name: unit_economics_cost_per_unit
    trigger: "on POST /finops/unit-economics-drivers/{id}/compute"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER. The dependency LOOKS circular: the overhead rate depends on the
      # cost-per-unit tier, and the final cost per unit depends on the overhead. It is resolved by
      # pinning the tier to the PROVISIONAL figure and NEVER re-deriving it from the final figure,
      # even when the final figure lands in a different tier band.
      # step 1
      base_allocated_cents = SUM(AllocationLine.allocated_cents for lines of the referenced run
                                 whose business_unit_id == driver.business_unit_id,
                                 across all line_kind values including MANUAL_ADJUSTMENT)
      # step 2
      provisional_cost_per_unit_cents = round_half_up(base_allocated_cents / driver_volume, 2)
      # step 3 - tier pinned here, from the PROVISIONAL value only
      efficiency_tier = EFFICIENT   if provisional_cost_per_unit_cents <= EFFICIENT_MAX_CPU
                        STANDARD    if provisional_cost_per_unit_cents <= STANDARD_MAX_CPU
                        INEFFICIENT otherwise
      # step 4
      platform_overhead_cents = round_half_up(base_allocated_cents * OVERHEAD_RATE[efficiency_tier], 0)
      # step 5 - the tier is NOT recomputed from this value
      final_cost_per_unit_cents = round_half_up(
          (base_allocated_cents + platform_overhead_cents) / driver_volume, 2)
    input_set: "AllocationLine rows of the referenced AllocationRun for the driver's business unit; the run must be in status PUBLISHED or CLOSED"
    constants:
      EFFICIENT_MAX_CPU: 50.00
      STANDARD_MAX_CPU: 250.00
      OVERHEAD_RATE: { EFFICIENT: 0.03, STANDARD: 0.07, INEFFICIENT: 0.12 }
    precision: "2 decimal places for cost per unit, round_half_up; whole cents for platform_overhead_cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is a known role and is listed in the target endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "when X-User-Role is BusinessUnitOwner, X-User-ID equals the business_unit_id of the invoice, dispute or budget being acted on"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /finops/chargeback-invoices/{id}/settle, POST /finops/disputes, POST /finops/disputes/{id}/respond, POST /finops/disputes/{id}/withdraw, POST /finops/budgets/{id}/variance-explanation"
  - priority: 4
    category: auth
    check: "when X-User-Role is ResourceOwner, X-User-ID equals the owner_user_id of the CloudResource behind the RemediationTask"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /finops/remediation-tasks/{id}/snooze, POST /finops/remediation-tasks/{id}/approve, POST /finops/remediation-tasks/{id}/cancel"
  - priority: 10
    category: existence
    check: "every id in the request path exists, validated left-to-right"
    error_id: "the matching domain 404 (ERR_BUSINESS_UNIT_NOT_FOUND, ERR_TAGGING_POLICY_NOT_FOUND, ERR_PROVISIONING_REQUEST_NOT_FOUND, ERR_CLOUD_RESOURCE_NOT_FOUND, ERR_COST_RECORD_NOT_FOUND, ERR_SHARED_COST_POOL_NOT_FOUND, ERR_ALLOCATION_RUN_NOT_FOUND, ERR_ALLOCATION_LINE_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_REMEDIATION_TASK_NOT_FOUND, ERR_ANOMALY_ALERT_NOT_FOUND, ERR_BUDGET_NOT_FOUND, ERR_DRIVER_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 11
    category: existence
    check: "every foreign key supplied in the request body references an existing row"
    error_id: "the matching domain 404 for the referenced entity"
    http_status: 404
    applies_to: "POST /finops/business-units, POST /finops/provisioning-requests, POST /finops/cost-records, POST /finops/allocation-runs, POST /finops/allocation-runs/{id}/shared-cost-pools, POST /finops/allocation-runs/{id}/manual-adjustments, POST /finops/disputes, POST /finops/budgets, POST /finops/unit-economics-drivers, POST /finops/anomaly-alerts/{id}/attribute"
  - priority: 20
    category: business_constraint
    check: "request body shape is valid: required fields present, enum values in range, integers non-negative where constrained, period_end strictly after period_start, mandatory_dimensions a non-empty subset of [team, environment, application], covered_resource_kind present exactly when commitment_type is RESERVED_INSTANCE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 30
    category: state
    check: "expected_<parent>_version equals the parent's current version (§1.2.1 optimistic concurrency)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /finops/allocation-runs/{id}/manual-adjustments, POST /finops/budgets/{id}/revise, PUT /finops/tagging-policies/{id}"
  - priority: 40
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: "the matching state error (ERR_REQUEST_STATE_INVALID, ERR_RESOURCE_STATE_INVALID, ERR_RUN_STATE_INVALID, ERR_POOL_STATE_INVALID, ERR_INVOICE_STATE_INVALID, ERR_DISPUTE_STATE_INVALID, ERR_COMMITMENT_STATE_INVALID, ERR_REMEDIATION_STATE_INVALID, ERR_ALERT_STATE_INVALID, ERR_BUDGET_STATE_INVALID, ERR_POLICY_STATE_INVALID)"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 41
    category: state
    check: "a Dispute may only be filed against an invoice whose settlement_status is ISSUED or PARTIALLY_CREDITED and whose dispute_status is NONE"
    error_id: ERR_INVOICE_NOT_DISPUTABLE
    http_status: 409
    applies_to: "POST /finops/disputes"
  - priority: 45
    category: state
    check: "the BusinessUnit involved has status ACTIVE"
    error_id: ERR_BU_SUSPENDED
    http_status: 409
    applies_to: "POST /finops/provisioning-requests/{id}/approve, POST /finops/provisioning-requests/{id}/provision, POST /finops/chargeback-invoices/{id}/issue, POST /finops/budgets/{id}/activate"
  - priority: 50
    category: business_safety
    check: "segregation of duties: the publishing user id differs from the run's created_by_user_id, the activating user id differs from the policy's created_by_user_id, and the resolving user id differs from the dispute's filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /finops/allocation-runs/{id}/publish, POST /finops/tagging-policies/{id}/activate, POST /finops/disputes/{id}/resolve"
  - priority: 52
    category: business_safety
    check: "under BLOCKING enforcement a provisioning request may not be approved while missing_dimensions is non-empty"
    error_id: ERR_MANDATORY_TAG_MISSING
    http_status: 422
    applies_to: "POST /finops/provisioning-requests/{id}/approve"
  - priority: 54
    category: business_referential
    check: "the referenced TaggingPolicy has status ACTIVE"
    error_id: ERR_POLICY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /finops/provisioning-requests, POST /finops/provisioning-requests/{id}/retag, POST /finops/provisioning-requests/{id}/approve"
  - priority: 56
    category: business_safety
    check: "when the target BusinessUnit has a Budget in status BREACHED covering the current logical clock, that budget's variance_explanation_text must be non-null before new spend is provisioned"
    error_id: ERR_VARIANCE_EXPLANATION_REQUIRED
    http_status: 422
    applies_to: "POST /finops/provisioning-requests/{id}/approve"
  - priority: 60
    category: business_referential
    check: "every participant_business_unit_id of a shared cost pool exists and, when the run has a scope_business_unit_id, sits inside that BU's subtree"
    error_id: ERR_PARTICIPANT_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /finops/allocation-runs/{id}/shared-cost-pools"
  - priority: 62
    category: business_referential
    check: "a CHARGEBACK run may only be published when every business unit on its lines has chargeback_enabled == true"
    error_id: ERR_BU_NOT_CHARGEBACK_ENABLED
    http_status: 422
    applies_to: "POST /finops/allocation-runs/{id}/publish, POST /finops/chargeback-invoices/{id}/issue"
  - priority: 65
    category: business_referential
    check: "every SharedCostPool attached to the run has status SEALED before the run may be published"
    error_id: ERR_POOL_NOT_SEALED
    http_status: 409
    applies_to: "POST /finops/allocation-runs/{id}/publish"
  - priority: 66
    category: business_referential
    check: "the CloudResource behind a remediation task is in lifecycle_state FLAGGED_IDLE or RIGHTSIZE_PENDING"
    error_id: ERR_RESOURCE_NOT_REMEDIABLE
    http_status: 409
    applies_to: "POST /finops/remediation-tasks, POST /finops/remediation-tasks/{id}/notify-owner, POST /finops/remediation-tasks/{id}/approve"
  - priority: 67
    category: business_referential
    check: "a CHARGEBACK run may only be closed when every one of its invoices is SETTLED or WRITTEN_OFF and no dispute on them is still open, under review or awaiting information"
    error_id: ERR_RUN_NOT_FULLY_SETTLED
    http_status: 409
    applies_to: "POST /finops/allocation-runs/{id}/close"
  - priority: 68
    category: business_referential
    check: "a run may not be reopened when any of its invoices is SETTLED, or when reopen_count has already reached MAX_RUN_REOPENS (2)"
    error_id: ERR_RUN_REOPEN_BLOCKED
    http_status: 409
    applies_to: "POST /finops/allocation-runs/{id}/reopen"
  - priority: 70
    category: business_temporal
    check: "half-open interval semantics [period_start, period_end): a new AllocationRun with the same mode and the same scope_business_unit_id may not overlap an existing non-CLOSED run's period; abutting periods where one run's period_end equals the next run's period_start are allowed"
    error_id: ERR_ALLOCATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /finops/allocation-runs"
  - priority: 71
    category: business_temporal
    check: "closed interval semantics [term_start, term_end] with a COMMITMENT_BUFFER_HOURS (24) cool-off pad on both ends: a new Commitment in the same region and of the same commitment_type may not sit within 24 hours of an existing PENDING, ACTIVE or UNDER_UTILIZED commitment's term; unlike the allocation-run rule, abutting terms are rejected because the buffer is applied before comparison"
    error_id: ERR_COMMITMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /finops/commitments"
  - priority: 72
    category: business_temporal
    check: "closed interval semantics on both ends [remediation_window_starts_at, remediation_window_ends_at]: two remediation windows on the same CloudResource may not share even a single instant, so touching endpoints collide"
    error_id: ERR_REMEDIATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /finops/remediation-tasks/{id}/notify-owner"
  - priority: 73
    category: business_temporal
    check: "the current logical clock is at or before the invoice's dispute_window_ends_at (inclusive)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /finops/disputes"
  - priority: 74
    category: business_temporal
    check: "the current logical clock is at or before remediation_window_ends_at (inclusive)"
    error_id: ERR_REMEDIATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /finops/remediation-tasks/{id}/snooze, POST /finops/remediation-tasks/{id}/approve"
  - priority: 75
    category: business_constraint
    check: "review_round is strictly below MAX_DISPUTE_ROUNDS (3) before another review round is started or another information response is accepted"
    error_id: ERR_DISPUTE_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /finops/disputes/{id}/start-review, POST /finops/disputes/{id}/respond"
  - priority: 76
    category: business_constraint
    check: "snooze_count is strictly below MAX_SNOOZES (2)"
    error_id: ERR_SNOOZE_LIMIT
    http_status: 409
    applies_to: "POST /finops/remediation-tasks/{id}/snooze"
  - priority: 77
    category: business_constraint
    check: "driver_volume is a strictly positive integer, so cost per unit is always well defined"
    error_id: ERR_DRIVER_VOLUME_INVALID
    http_status: 422
    applies_to: "POST /finops/unit-economics-drivers"
  - priority: 78
    category: business_constraint
    check: "absorbing untagged spend into a pool requires at least one matching UNALLOCATED CostRecord with a null business_unit_id inside the run period"
    error_id: ERR_UNTAGGED_ABSORB_EMPTY
    http_status: 422
    applies_to: "POST /finops/shared-cost-pools/{id}/absorb-untagged"
  - priority: 79
    category: business_constraint
    check: "every SharedCostPool of the run has at least one participant business unit whose status is ACTIVE (empty eligible set edge case)"
    error_id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http_status: 422
    applies_to: "POST /finops/allocation-runs/{id}/compute"
  - priority: 80
    category: business_constraint
    check: "a PROPORTIONAL pool's basis total across eligible participants is greater than zero"
    error_id: ERR_PROPORTIONAL_BASIS_ZERO
    http_status: 422
    applies_to: "POST /finops/allocation-runs/{id}/compute"
  - priority: 81
    category: business_referential
    check: "a CostRecord may not be absorbed into a pool or re-allocated once its allocation_state is ALLOCATED or REVERSED"
    error_id: ERR_COST_RECORD_ALREADY_ALLOCATED
    http_status: 409
    applies_to: "POST /finops/shared-cost-pools/{id}/absorb-untagged"
  - priority: 82
    category: business_fiscal
    check: "aggregate capacity semantics: the sum of hourly_commit_cents across all PENDING, ACTIVE and UNDER_UTILIZED commitments in the same region, including the new one, may not exceed REGION_MAX_HOURLY_COMMIT_CENTS (500)"
    error_id: ERR_COMMITMENT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /finops/commitments"
  - priority: 83
    category: business_fiscal
    check: "granted or claimed credit may not exceed gross_amount_cents - credited_amount_cents - paid_amount_cents on the invoice"
    error_id: ERR_CREDIT_EXCEEDS_INVOICE
    http_status: 422
    applies_to: "POST /finops/disputes, POST /finops/disputes/{id}/resolve"
  - priority: 84
    category: business_fiscal
    check: "a settlement payment must exactly clear the invoice: paid_amount_cents + payment_cents == gross_amount_cents - credited_amount_cents"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /finops/chargeback-invoices/{id}/settle"
  - priority: 85
    category: business_fiscal
    check: "a business unit may not have two non-CLOSED budgets whose periods overlap"
    error_id: ERR_BUDGET_PERIOD_DUPLICATE
    http_status: 409
    applies_to: "POST /finops/budgets"
  - priority: 86
    category: business_fiscal
    check: "a manual adjustment may not drive the affected business unit's line total on the run below zero"
    error_id: ERR_ADJUSTMENT_WOULD_GO_NEGATIVE
    http_status: 422
    applies_to: "POST /finops/allocation-runs/{id}/manual-adjustments"

endpoints:
  # ---- test-driving surface (last resort per §1.5 priority ladder) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every window, term, dispute deadline and remediation sweep reads. The server starts at the fixed default 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time before this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["advances or rewinds the logical clock used by every temporal rule"]

  # ---- business units ----
  - method: POST
    path: "/finops/business-units"
    description: "Creates a business unit, optionally under a parent business unit in the rollup tree."
    roles: [PlatformAdmin]
    code: 201
    input: [name, cost_center_code, "parent_business_unit_id?", "chargeback_enabled?", "headcount?", "revenue_cents?", "status?"]
    output: BusinessUnit
    side_effects: ["initialises resource_count, tracked_run_rate_cents, direct_spend_cents, showback_total_cents and chargeback_balance_cents to 0"]
  - method: GET
    path: "/finops/business-units"
    description: "Lists business units, optionally filtered to the direct children of one parent."
    roles: [PlatformAdmin, FinOpsAnalyst, FinOpsController, BusinessUnitOwner]
    code: 200
    input: ["parent_business_unit_id?", "status?", "limit?", "offset?"]
    output: BusinessUnit[]
    side_effects: []
  - method: GET
    path: "/finops/business-units/{id}"
    description: "Returns one business unit with its recomputed derived spend and balance fields."
    roles: [PlatformAdmin, FinOpsAnalyst, FinOpsController, BusinessUnitOwner]
    code: 200
    input: []
    output: BusinessUnit
    side_effects: []
  - method: PATCH
    path: "/finops/business-units/{id}"
    description: "Updates a business unit's allocation bases, chargeback flag or lifecycle status."
    roles: [PlatformAdmin]
    code: 200
    input: ["chargeback_enabled?", "headcount?", "revenue_cents?", "status?"]
    output: BusinessUnit
    side_effects: ["increments BusinessUnit.version by 1"]

  # ---- tagging policies ----
  - method: POST
    path: "/finops/tagging-policies"
    description: "Drafts a tagging policy declaring the mandatory tag dimensions and the enforcement mode."
    roles: [FinOpsAnalyst, FinOpsController]
    code: 201
    input: [name, mandatory_dimensions, "enforcement_mode?"]
    output: TaggingPolicy
    side_effects: ["stores the caller's X-User-ID as created_by_user_id", "sets status to DRAFT"]
  - method: GET
    path: "/finops/tagging-policies"
    description: "Lists tagging policies."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TaggingPolicy[]
    side_effects: []
  - method: GET
    path: "/finops/tagging-policies/{id}"
    description: "Returns one tagging policy including its rejection_count."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: []
    output: TaggingPolicy
    side_effects: []
  - method: PUT
    path: "/finops/tagging-policies/{id}"
    description: "Amends a DRAFT policy's mandatory dimensions or enforcement mode under optimistic concurrency control."
    roles: [FinOpsAnalyst, FinOpsController]
    code: 200
    input: [expected_tagging_policy_version, mandatory_dimensions, enforcement_mode]
    output: TaggingPolicy
    side_effects: ["increments TaggingPolicy.version by 1", "replaces mandatory_dimensions and enforcement_mode"]
  - method: POST
    path: "/finops/tagging-policies/{id}/activate"
    description: "Activates a DRAFT policy so provisioning requests may reference it; the activating user must differ from the drafting user."
    roles: [FinOpsController]
    code: 200
    input: []
    output: TaggingPolicy
    side_effects: ["sets status to ACTIVE", "stores the caller's X-User-ID as activated_by_user_id", "increments TaggingPolicy.version by 1"]
  - method: POST
    path: "/finops/tagging-policies/{id}/retire"
    description: "Retires an ACTIVE policy so it can no longer gate new provisioning requests."
    roles: [FinOpsController]
    code: 200
    input: []
    output: TaggingPolicy
    side_effects: ["sets status to RETIRED", "increments TaggingPolicy.version by 1"]

  # ---- provisioning requests ----
  - method: POST
    path: "/finops/provisioning-requests"
    description: "Submits a provisioning request; the referenced ACTIVE policy is evaluated immediately, and under BLOCKING enforcement a non-compliant request is persisted as TAG_REJECTED."
    roles: [FinOpsAnalyst, PlatformAdmin]
    code: 201
    input: [tagging_policy_id, business_unit_id, resource_kind, requested_tags, monthly_run_rate_cents, owner_user_id]
    output: ProvisioningRequest
    side_effects: ["runs calculation tag_compliance_evaluation to set missing_dimensions, compliance_score and projected_tag_state", "sets status to SUBMITTED, or TAG_REJECTED under BLOCKING enforcement with gaps", "increments TaggingPolicy.rejection_count when the request lands in TAG_REJECTED"]
  - method: GET
    path: "/finops/provisioning-requests"
    description: "Lists provisioning requests, filterable by policy, business unit and status."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: ["tagging_policy_id?", "business_unit_id?", "status?", "limit?", "offset?"]
    output: ProvisioningRequest[]
    side_effects: []
  - method: GET
    path: "/finops/provisioning-requests/{id}"
    description: "Returns one provisioning request with its tag compliance evaluation."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: []
  - method: POST
    path: "/finops/provisioning-requests/{id}/retag"
    description: "Resubmits the tag map on a TAG_REJECTED request and re-evaluates compliance, possibly rejecting it again."
    roles: [FinOpsAnalyst]
    code: 200
    input: [requested_tags]
    output: ProvisioningRequest
    side_effects: ["replaces requested_tags", "re-runs calculation tag_compliance_evaluation", "increments retag_count by 1", "decrements TaggingPolicy.rejection_count when leaving TAG_REJECTED and increments it again when the re-evaluation still fails under BLOCKING enforcement"]
  - method: POST
    path: "/finops/provisioning-requests/{id}/approve"
    description: "Approves a SUBMITTED request; blocked by missing mandatory tags under BLOCKING enforcement and by an unexplained breached budget on the owning business unit."
    roles: [FinOpsAnalyst]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: ["sets status to APPROVED"]
  - method: POST
    path: "/finops/provisioning-requests/{id}/provision"
    description: "Provisions the approved request, creating the CloudResource with the tags frozen at provision time."
    roles: [FinOpsAnalyst]
    code: 200
    input: []
    output: ProvisioningRequest
    side_effects: ["sets status to PROVISIONED", "creates a CloudResource in lifecycle_state ACTIVE with tag_state = projected_tag_state and utilization_pct defaulted to 100.00", "recomputes BusinessUnit.resource_count and BusinessUnit.tracked_run_rate_cents"]

  # ---- cloud resources ----
  - method: GET
    path: "/finops/cloud-resources"
    description: "Lists cloud resources, filterable by originating provisioning request, business unit, tag state and lifecycle state. This is the discovery channel for resources created as a cascade of provisioning."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, ResourceOwner]
    code: 200
    input: ["provisioning_request_id?", "business_unit_id?", "tag_state?", "lifecycle_state?", "limit?", "offset?"]
    output: CloudResource[]
    side_effects: []
  - method: GET
    path: "/finops/cloud-resources/{id}"
    description: "Returns one cloud resource with its latest telemetry."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, ResourceOwner]
    code: 200
    input: []
    output: CloudResource
    side_effects: []
  - method: PATCH
    path: "/finops/cloud-resources/{id}/telemetry"
    description: "Records observed utilization and the current run rate for a resource; a RESIZED resource whose utilization recovers above the rightsizing ceiling returns to ACTIVE."
    roles: [PlatformAdmin]
    code: 200
    input: [utilization_pct, "monthly_run_rate_cents?"]
    output: CloudResource
    side_effects: ["updates utilization_pct and monthly_run_rate_cents", "moves a RESIZED resource back to ACTIVE when utilization_pct exceeds RIGHTSIZE_UTILIZATION_MAX_PCT", "recomputes BusinessUnit.tracked_run_rate_cents", "increments CloudResource.version by 1"]

  # ---- cost records ----
  - method: POST
    path: "/finops/cost-records"
    description: "Ingests a billing line for a period, either attached to a cloud resource or left resource-less as untagged spend."
    roles: [PlatformAdmin, FinOpsAnalyst]
    code: 201
    input: [billing_period_start, billing_period_end, resource_kind, list_cost_cents, "cloud_resource_id?"]
    output: CostRecord
    side_effects: ["derives business_unit_id from the referenced cloud resource, leaving it null for untagged spend", "sets effective_cost_cents equal to list_cost_cents", "sets allocation_state to UNALLOCATED", "recomputes BusinessUnit.direct_spend_cents when a business unit was derived"]
  - method: GET
    path: "/finops/cost-records"
    description: "Lists cost records, filterable by resource, pool, business unit, applied commitment, allocating run and allocation state."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: ["cloud_resource_id?", "shared_cost_pool_id?", "business_unit_id?", "applied_commitment_id?", "allocated_by_run_id?", "allocation_state?", "limit?", "offset?"]
    output: CostRecord[]
    side_effects: []
  - method: GET
    path: "/finops/cost-records/{id}"
    description: "Returns one cost record with its effective cost and allocation state."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: []
    output: CostRecord
    side_effects: []

  # ---- allocation runs ----
  - method: POST
    path: "/finops/allocation-runs"
    description: "Opens a DRAFT allocation run for a period, in showback or chargeback mode, optionally scoped to one business unit subtree."
    roles: [FinOpsAnalyst, FinOpsController]
    code: 201
    input: [mode, period_start, period_end, "scope_business_unit_id?"]
    output: AllocationRun
    side_effects: ["stores the caller's X-User-ID as created_by_user_id", "sets status to DRAFT and reopen_count to 0"]
  - method: GET
    path: "/finops/allocation-runs"
    description: "Lists allocation runs, filterable by mode, scope business unit and status."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["mode?", "scope_business_unit_id?", "status?", "limit?", "offset?"]
    output: AllocationRun[]
    side_effects: []
  - method: GET
    path: "/finops/allocation-runs/{id}"
    description: "Returns one allocation run with its applied variant and totals."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: AllocationRun
    side_effects: []
  - method: POST
    path: "/finops/allocation-runs/{id}/shared-cost-pools"
    description: "Attaches a shared cost pool to a DRAFT or REOPENED run, declaring the methodology and the participating business units."
    roles: [FinOpsAnalyst]
    code: 201
    input: [name, methodology, participant_business_unit_ids, "proportional_basis?"]
    output: SharedCostPool
    side_effects: ["creates the pool in status OPEN with pooled_cost_cents 0 and absorbed_record_count 0"]
  - method: GET
    path: "/finops/allocation-runs/{id}/shared-cost-pools"
    description: "Lists the shared cost pools attached to a run."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SharedCostPool[]
    side_effects: []
  - method: POST
    path: "/finops/allocation-runs/{id}/compute"
    description: "Computes the run's allocation lines under the requested variant; PROVISIONAL strikes direct lines at list cost, FINAL strikes them net of commitment discount."
    roles: [FinOpsAnalyst]
    code: 200
    input: [variant]
    output: AllocationRun
    side_effects: ["deletes every existing AllocationLine of the run", "runs calculation allocation_run_totals and calculation shared_pool_allocation", "sets variant_applied, scoped_effective_cost_cents, total_allocated_cents and line_count", "moves the run to COMPUTED_PROVISIONAL or COMPUTED_FINAL", "increments AllocationRun.version by 1"]
  - method: POST
    path: "/finops/allocation-runs/{id}/manual-adjustments"
    description: "Appends a manual adjustment line to a computed run under optimistic concurrency control on the run's version."
    roles: [FinOpsController]
    code: 201
    input: [expected_allocation_run_version, business_unit_id, allocated_cents, memo]
    output: AllocationLine
    side_effects: ["increments AllocationRun.version by 1", "creates an AllocationLine with line_kind MANUAL_ADJUSTMENT and method_applied MANUAL", "increments AllocationRun.line_count by 1 while leaving total_allocated_cents unchanged, since that total covers only DIRECT and SHARED lines"]
  - method: POST
    path: "/finops/allocation-runs/{id}/publish"
    description: "Publishes a run computed on the FINAL variant; the publishing user must differ from the run's creator and every attached pool must be sealed."
    roles: [FinOpsController]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["sets status to PUBLISHED and published_by_user_id", "marks every allocated CostRecord as ALLOCATED with allocated_by_run_id set", "creates one ChargebackInvoice per business unit for CHARGEBACK runs", "recomputes BusinessUnit.showback_total_cents or BusinessUnit.chargeback_balance_cents", "increments AllocationRun.version by 1"]
  - method: POST
    path: "/finops/allocation-runs/{id}/reopen"
    description: "Reopens a published run for recomputation, voiding its invoices and releasing its cost records."
    roles: [FinOpsController]
    code: 200
    input: [reason]
    output: AllocationRun
    side_effects: ["sets status to REOPENED and increments reopen_count by 1", "returns every allocated CostRecord to UNALLOCATED and clears allocated_by_run_id", "sets every invoice of the run to VOIDED", "deletes every AllocationLine of the run and resets total_allocated_cents and line_count to 0", "recomputes BusinessUnit.chargeback_balance_cents and BusinessUnit.showback_total_cents", "increments AllocationRun.version by 1"]
  - method: POST
    path: "/finops/allocation-runs/{id}/close"
    description: "Closes a published run once every invoice is settled or written off and no dispute remains open."
    roles: [FinOpsController]
    code: 200
    input: []
    output: AllocationRun
    side_effects: ["sets status to CLOSED, freezing the run against further compute, publish, reopen or adjustment", "increments AllocationRun.version by 1"]

  # ---- shared cost pools ----
  - method: GET
    path: "/finops/shared-cost-pools/{id}"
    description: "Returns one shared cost pool with its pooled amount and absorbed record count."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin]
    code: 200
    input: []
    output: SharedCostPool
    side_effects: []
  - method: POST
    path: "/finops/shared-cost-pools/{id}/absorb-untagged"
    description: "Absorbs untagged or explicitly listed cost records into an OPEN pool so they can be redistributed by the pool methodology."
    roles: [FinOpsAnalyst]
    code: 200
    input: [cost_record_ids]
    output: SharedCostPool
    side_effects: ["sets shared_cost_pool_id on each absorbed CostRecord", "recomputes pooled_cost_cents and absorbed_record_count", "increments SharedCostPool.version by 1"]
  - method: POST
    path: "/finops/shared-cost-pools/{id}/seal"
    description: "Seals an OPEN pool so no further records may be absorbed; every pool must be sealed before its run can be published."
    roles: [FinOpsAnalyst]
    code: 200
    input: []
    output: SharedCostPool
    side_effects: ["sets status to SEALED", "increments SharedCostPool.version by 1"]

  # ---- allocation lines ----
  - method: GET
    path: "/finops/allocation-lines"
    description: "Lists allocation lines, filterable by run, business unit and shared cost pool. This is the discovery channel for lines synthesised by a compute call."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["allocation_run_id?", "business_unit_id?", "shared_cost_pool_id?", "line_kind?", "limit?", "offset?"]
    output: AllocationLine[]
    side_effects: []
  - method: GET
    path: "/finops/allocation-lines/{id}"
    description: "Returns one allocation line including its method_applied, basis_value and rounding_remainder_cents."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  # ---- chargeback invoices ----
  - method: GET
    path: "/finops/chargeback-invoices"
    description: "Lists chargeback invoices, filterable by issuing run, business unit and either state dimension. This is the discovery channel for invoices synthesised at publish time."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["allocation_run_id?", "business_unit_id?", "settlement_status?", "dispute_status?", "limit?", "offset?"]
    output: ChargebackInvoice[]
    side_effects: []
  - method: GET
    path: "/finops/chargeback-invoices/{id}"
    description: "Returns one invoice with both parallel state dimensions and its settlement ledger."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: ChargebackInvoice
    side_effects: []
  - method: POST
    path: "/finops/chargeback-invoices/{id}/issue"
    description: "Issues an unbilled invoice to a chargeback-enabled business unit and opens its dispute window."
    roles: [FinOpsController]
    code: 200
    input: []
    output: ChargebackInvoice
    side_effects: ["sets settlement_status to ISSUED", "sets issued_at to the logical clock and dispute_window_ends_at = issued_at + DISPUTE_WINDOW_HOURS", "recomputes net_due_cents and BusinessUnit.chargeback_balance_cents", "increments ChargebackInvoice.version by 1"]
  - method: POST
    path: "/finops/chargeback-invoices/{id}/settle"
    description: "Records a business unit's payment; the payment must exactly clear the invoice's outstanding amount after credits."
    roles: [BusinessUnitOwner]
    code: 200
    input: [payment_cents]
    output: ChargebackInvoice
    side_effects: ["increases paid_amount_cents and sets settlement_status to SETTLED", "recomputes net_due_cents to 0 and BusinessUnit.chargeback_balance_cents", "increments ChargebackInvoice.version by 1"]
  - method: POST
    path: "/finops/chargeback-invoices/{id}/write-off"
    description: "Writes off an undisputed invoice; the invoice leaves the business unit's chargeback balance entirely."
    roles: [FinOpsController]
    code: 200
    input: [memo]
    output: ChargebackInvoice
    side_effects: ["sets settlement_status to WRITTEN_OFF", "recomputes net_due_cents to 0 and BusinessUnit.chargeback_balance_cents", "increments ChargebackInvoice.version by 1"]

  # ---- disputes ----
  - method: POST
    path: "/finops/disputes"
    description: "Files a dispute against an issued invoice inside its dispute window; the invoice's dispute dimension moves to DISPUTED while its settlement dimension is untouched."
    roles: [BusinessUnitOwner]
    code: 201
    input: [chargeback_invoice_id, reason_code, claimed_credit_cents, narrative]
    output: Dispute
    side_effects: ["copies filed_by_business_unit_id from the invoice and stores the caller's X-User-ID as filed_by_user_id", "sets the invoice's dispute_status to DISPUTED", "sets every CostRecord on the invoice's lines to DISPUTED_HOLD", "increments ChargebackInvoice.version by 1"]
  - method: GET
    path: "/finops/disputes"
    description: "Lists disputes, filterable by invoice, filing business unit and status."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["chargeback_invoice_id?", "filed_by_business_unit_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/finops/disputes/{id}"
    description: "Returns one dispute with its review round and outcome."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/finops/disputes/{id}/start-review"
    description: "Starts a review round on an open dispute."
    roles: [FinOpsController]
    code: 200
    input: []
    output: Dispute
    side_effects: ["sets status to UNDER_REVIEW", "increments review_round by 1", "increments Dispute.version by 1"]
  - method: POST
    path: "/finops/disputes/{id}/request-info"
    description: "Asks the filing business unit for more information, pausing the review."
    roles: [FinOpsController]
    code: 200
    input: [question]
    output: Dispute
    side_effects: ["sets status to INFO_REQUESTED", "increments Dispute.version by 1"]
  - method: POST
    path: "/finops/disputes/{id}/respond"
    description: "Supplies the requested information and returns the dispute to review; rejected once the round cap is reached."
    roles: [BusinessUnitOwner]
    code: 200
    input: [response_text]
    output: Dispute
    side_effects: ["appends the response to narrative", "sets status to UNDER_REVIEW", "increments review_round by 1", "increments Dispute.version by 1"]
  - method: POST
    path: "/finops/disputes/{id}/resolve"
    description: "Resolves a dispute under review, either granting a credit or upholding the charge; the resolving user must differ from the filing user."
    roles: [FinOpsController]
    code: 200
    input: [outcome, "granted_credit_cents?"]
    output: Dispute
    side_effects: ["sets status to RESOLVED_ADJUSTED or RESOLVED_UPHELD, outcome, granted_credit_cents and resolved_by_user_id", "on ADJUSTED increases the invoice's credited_amount_cents and moves it to PARTIALLY_CREDITED, lowering net_due_cents", "recomputes BusinessUnit.chargeback_balance_cents, which re-evaluates the business unit's Budget and may return a BREACHED budget to ACTIVE", "sets the invoice's dispute_status to DISPUTE_RESOLVED and returns held CostRecords to ALLOCATED", "increments ChargebackInvoice.version and Dispute.version by 1"]
  - method: POST
    path: "/finops/disputes/{id}/withdraw"
    description: "Withdraws a dispute the filing business unit no longer wishes to pursue, returning the invoice's dispute dimension to NONE."
    roles: [BusinessUnitOwner]
    code: 200
    input: []
    output: Dispute
    side_effects: ["sets status to WITHDRAWN", "sets the invoice's dispute_status back to NONE", "returns held CostRecords to ALLOCATED", "increments ChargebackInvoice.version and Dispute.version by 1"]

  # ---- commitments ----
  - method: POST
    path: "/finops/commitments"
    description: "Purchases a reserved-capacity or savings-plan commitment for a region and term, subject to the region's aggregate hourly capacity cap and the 24-hour buffer against other commitments of the same type."
    roles: [FinOpsController]
    code: 201
    input: [commitment_type, region, term_start, term_end, hourly_commit_cents, "covered_resource_kind?", "coverage_target_pct?", "utilization_target_pct?"]
    output: Commitment
    side_effects: ["sets status to PENDING and committed_capacity_cents to hourly_commit_cents * HOURS_PER_PERIOD"]
  - method: GET
    path: "/finops/commitments"
    description: "Lists commitments, filterable by type, region and status."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin]
    code: 200
    input: ["commitment_type?", "region?", "status?", "limit?", "offset?"]
    output: Commitment[]
    side_effects: []
  - method: GET
    path: "/finops/commitments/{id}"
    description: "Returns one commitment with its coverage, utilization and waste figures."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Commitment
    side_effects: []
  - method: POST
    path: "/finops/commitments/{id}/activate"
    description: "Activates a pending commitment and runs the coverage waterfall over eligible unallocated cost records, discounting each covered record."
    roles: [FinOpsController]
    code: 200
    input: []
    output: Commitment
    side_effects: ["sets status to ACTIVE", "runs calculation commitment_application_waterfall, setting applied_commitment_id and effective_cost_cents on every covered CostRecord", "sets covered_spend_cents, total_discount_cents, waste_cents, coverage_pct and utilization_pct", "recomputes BusinessUnit.direct_spend_cents for every affected business unit", "increments Commitment.version by 1"]
  - method: POST
    path: "/finops/commitments/{id}/evaluate"
    description: "Re-evaluates coverage and utilization against the targets, moving the commitment between ACTIVE and UNDER_UTILIZED or to EXPIRED once the term has passed."
    roles: [FinOpsController]
    code: 200
    input: []
    output: Commitment
    side_effects: ["recomputes covered_spend_cents, waste_cents, coverage_pct and utilization_pct", "moves the commitment to UNDER_UTILIZED, back to ACTIVE, or to EXPIRED", "increments Commitment.version by 1"]

  # ---- idle detection and remediation ----
  - method: POST
    path: "/finops/scans/idle-detection"
    description: "Scans active cloud resources for idle and rightsizing candidates, flagging each resource and proposing a remediation task."
    roles: [FinOpsAnalyst]
    code: 200
    input: ["business_unit_id?"]
    output: RemediationTask[]
    side_effects: ["runs calculation idle_and_rightsizing_evaluation", "moves qualifying resources to FLAGGED_IDLE or RIGHTSIZE_PENDING", "creates one PROPOSED RemediationTask per flagged resource with its waste_score, projected_savings_cents and auto_remediation_eligible flag"]
  - method: POST
    path: "/finops/remediation-tasks"
    description: "Raises a remediation task by hand on a resource that a scan has already flagged, for cases the automated scan proposes with the wrong kind."
    roles: [FinOpsAnalyst]
    code: 201
    input: [cloud_resource_id, kind]
    output: RemediationTask
    side_effects: ["creates the task in status PROPOSED", "computes waste_score, projected_savings_cents and auto_remediation_eligible from the resource's current telemetry per calculation idle_and_rightsizing_evaluation"]
  - method: GET
    path: "/finops/remediation-tasks"
    description: "Lists remediation tasks, filterable by resource, kind and status. This is the discovery channel for tasks synthesised by the idle-detection scan."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, ResourceOwner]
    code: 200
    input: ["cloud_resource_id?", "kind?", "status?", "limit?", "offset?"]
    output: RemediationTask[]
    side_effects: []
  - method: GET
    path: "/finops/remediation-tasks/{id}"
    description: "Returns one remediation task with its window and savings figures."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, ResourceOwner]
    code: 200
    input: []
    output: RemediationTask
    side_effects: []
  - method: POST
    path: "/finops/remediation-tasks/{id}/notify-owner"
    description: "Notifies the resource owner and opens the remediation window; a second window on the same resource may not touch an existing one."
    roles: [FinOpsAnalyst]
    code: 200
    input: []
    output: RemediationTask
    side_effects: ["sets status to OWNER_NOTIFIED", "sets remediation_window_starts_at to the logical clock and remediation_window_ends_at = start + REMEDIATION_WINDOW_HOURS", "increments RemediationTask.version by 1"]
  - method: POST
    path: "/finops/remediation-tasks/{id}/snooze"
    description: "Lets the resource owner extend the remediation window by one more window length, up to the snooze cap."
    roles: [ResourceOwner]
    code: 200
    input: []
    output: RemediationTask
    side_effects: ["sets status to OWNER_SNOOZED", "extends remediation_window_ends_at by REMEDIATION_WINDOW_HOURS", "increments snooze_count and RemediationTask.version by 1"]
  - method: POST
    path: "/finops/remediation-tasks/{id}/approve"
    description: "Lets the resource owner approve the remediation so the next sweep executes it."
    roles: [ResourceOwner]
    code: 200
    input: []
    output: RemediationTask
    side_effects: ["sets status to APPROVED", "increments RemediationTask.version by 1"]
  - method: POST
    path: "/finops/remediation-tasks/{id}/cancel"
    description: "Cancels a remediation task and returns the resource to ACTIVE when no other task remains open on it."
    roles: [ResourceOwner, FinOpsAnalyst]
    code: 200
    input: [reason]
    output: RemediationTask
    side_effects: ["sets status to CANCELLED", "returns the CloudResource to ACTIVE when it has no other non-terminal task", "increments RemediationTask.version by 1"]
  - method: POST
    path: "/finops/scans/remediation-window-sweep"
    description: "Sweeps remediation tasks: approved tasks execute, expired windows either auto-execute or cancel depending on eligibility."
    roles: [FinOpsAnalyst]
    code: 200
    input: []
    output: RemediationTask[]
    side_effects: ["executes APPROVED tasks and auto-executes eligible expired tasks, cancelling ineligible expired ones", "sets realized_savings_cents on executed tasks", "cascades RIGHTSIZE tasks to a RESIZED resource with a reduced monthly_run_rate_cents", "cascades IDLE_TERMINATE tasks to a TERMINATED resource, which reverses its CostRecords, which in turn recomputes coverage, waste and utilization on the applied Commitment and may move it to UNDER_UTILIZED", "recomputes BusinessUnit.resource_count, tracked_run_rate_cents and direct_spend_cents"]

  # ---- anomaly detection ----
  - method: POST
    path: "/finops/anomaly-scans"
    description: "Runs spend-spike detection per business unit, emitting and routing alerts for every observation that clears both the ratio and the delta gate."
    roles: [FinOpsAnalyst]
    code: 200
    input: ["business_unit_id?"]
    output: AnomalyAlert[]
    side_effects: ["runs calculation anomaly_spike_detection", "creates AnomalyAlert rows with baseline, observed, delta, spike_ratio, severity_score and severity", "routes each alert, setting routed_queue and moving it to ROUTED"]
  - method: GET
    path: "/finops/anomaly-alerts"
    description: "Lists anomaly alerts, filterable by business unit, attributed root cause resource, severity and status. This is the discovery channel for alerts synthesised by a scan."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["business_unit_id?", "root_cause_cloud_resource_id?", "severity?", "status?", "limit?", "offset?"]
    output: AnomalyAlert[]
    side_effects: []
  - method: GET
    path: "/finops/anomaly-alerts/{id}"
    description: "Returns one anomaly alert with its scoring breakdown and routing."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: AnomalyAlert
    side_effects: []
  - method: POST
    path: "/finops/anomaly-alerts/{id}/acknowledge"
    description: "Acknowledges a routed alert."
    roles: [FinOpsAnalyst]
    code: 200
    input: []
    output: AnomalyAlert
    side_effects: ["sets status to ACKNOWLEDGED and acknowledged_by_user_id", "increments AnomalyAlert.version by 1"]
  - method: POST
    path: "/finops/anomaly-alerts/{id}/attribute"
    description: "Attributes an acknowledged alert to a specific non-terminated resource in the same business unit."
    roles: [FinOpsAnalyst]
    code: 200
    input: [root_cause_cloud_resource_id, root_cause_kind]
    output: AnomalyAlert
    side_effects: ["sets status to ATTRIBUTED, root_cause_cloud_resource_id and root_cause_kind", "increments AnomalyAlert.version by 1"]
  - method: POST
    path: "/finops/anomaly-alerts/{id}/close"
    description: "Closes an alert as explained once attributed, or as a false positive directly from acknowledgement."
    roles: [FinOpsController]
    code: 200
    input: [resolution]
    output: AnomalyAlert
    side_effects: ["sets status to CLOSED_EXPLAINED or CLOSED_FALSE_POSITIVE", "clears root_cause_cloud_resource_id and root_cause_kind on a false positive", "increments AnomalyAlert.version by 1"]

  # ---- budgets ----
  - method: POST
    path: "/finops/budgets"
    description: "Creates a draft budget for a business unit and period with an initial forecast and the accuracy basis to score it by."
    roles: [FinOpsController, FinOpsAnalyst]
    code: 201
    input: [business_unit_id, period_start, period_end, amount_cents, forecast_cents, "accuracy_basis?"]
    output: Budget
    side_effects: ["sets status to DRAFT with an empty forecast_history and revision_count 0"]
  - method: GET
    path: "/finops/budgets"
    description: "Lists budgets, filterable by business unit and status."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["business_unit_id?", "status?", "limit?", "offset?"]
    output: Budget[]
    side_effects: []
  - method: GET
    path: "/finops/budgets/{id}"
    description: "Returns one budget with its variance, accuracy and warning flag."
    roles: [FinOpsController, FinOpsAnalyst, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: Budget
    side_effects: []
  - method: POST
    path: "/finops/budgets/{id}/activate"
    description: "Activates a draft budget so it gates provisioning and feeds anomaly scoring."
    roles: [FinOpsController]
    code: 200
    input: []
    output: Budget
    side_effects: ["sets status to ACTIVE", "increments Budget.version by 1"]
  - method: POST
    path: "/finops/budgets/{id}/revise"
    description: "Revises the standing forecast under optimistic concurrency control, pushing the previous forecast onto the revision trail the MAPE variant scores."
    roles: [FinOpsController, FinOpsAnalyst]
    code: 200
    input: [expected_budget_version, forecast_cents]
    output: Budget
    side_effects: ["appends the previous forecast_cents to forecast_history", "replaces forecast_cents", "increments revision_count and Budget.version by 1"]
  - method: POST
    path: "/finops/budgets/{id}/evaluate"
    description: "Recomputes actual spend, variance and forecast accuracy under the budget's accuracy basis, breaching or un-breaching the budget."
    roles: [FinOpsController, FinOpsAnalyst]
    code: 200
    input: []
    output: Budget
    side_effects: ["runs calculation forecast_accuracy_and_variance", "sets actual_spend_cents, variance_cents, variance_pct, forecast_accuracy_pct, accuracy_basis_applied and warning_flag", "moves the budget to BREACHED or back to ACTIVE", "increments Budget.version by 1"]
  - method: POST
    path: "/finops/budgets/{id}/variance-explanation"
    description: "Records the mandatory variance narrative on a breached budget, unblocking further provisioning for the business unit."
    roles: [BusinessUnitOwner, FinOpsController]
    code: 200
    input: [variance_explanation_text]
    output: Budget
    side_effects: ["sets variance_explanation_text", "increments Budget.version by 1"]
  - method: POST
    path: "/finops/budgets/{id}/close"
    description: "Closes a budget at period end so it no longer gates provisioning."
    roles: [FinOpsController]
    code: 200
    input: []
    output: Budget
    side_effects: ["sets status to CLOSED", "increments Budget.version by 1"]

  # ---- unit economics ----
  - method: POST
    path: "/finops/unit-economics-drivers"
    description: "Registers a business volume driver against a published or closed allocation run for unit economics reporting."
    roles: [FinOpsAnalyst, FinOpsController]
    code: 201
    input: [business_unit_id, allocation_run_id, driver_name, driver_volume]
    output: UnitEconomicsDriver
    side_effects: ["stores the driver with all computed cost-per-unit fields still unset"]
  - method: GET
    path: "/finops/unit-economics-drivers"
    description: "Lists unit economics drivers, filterable by business unit and allocation run."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: ["business_unit_id?", "allocation_run_id?", "driver_name?", "limit?", "offset?"]
    output: UnitEconomicsDriver[]
    side_effects: []
  - method: GET
    path: "/finops/unit-economics-drivers/{id}"
    description: "Returns one unit economics driver with its provisional and final cost per unit."
    roles: [FinOpsAnalyst, FinOpsController, PlatformAdmin, BusinessUnitOwner]
    code: 200
    input: []
    output: UnitEconomicsDriver
    side_effects: []
  - method: POST
    path: "/finops/unit-economics-drivers/{id}/compute"
    description: "Computes cost per unit, pinning the efficiency tier from the provisional figure before applying platform overhead."
    roles: [FinOpsAnalyst, FinOpsController]
    code: 200
    input: []
    output: UnitEconomicsDriver
    side_effects: ["runs calculation unit_economics_cost_per_unit", "sets base_allocated_cents, provisional_cost_per_unit_cents, efficiency_tier, platform_overhead_cents and final_cost_per_unit_cents", "increments UnitEconomicsDriver.version by 1"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a BusinessUnitOwner acts on another business unit's invoice, dispute or budget, or a ResourceOwner acts on a remediation task for a resource they do not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same user id attempts both halves of a separated duty: creating and publishing a run, drafting and activating a policy, or filing and resolving a dispute"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum value, negative amount where a non-negative integer is required, period_end not strictly after period_start, mandatory_dimensions empty or outside [team, environment, application], or covered_resource_kind supplied for a SAVINGS_PLAN"
  - id: ERR_BUSINESS_UNIT_NOT_FOUND
    http: 404
    condition: "referenced business unit does not exist"
  - id: ERR_TAGGING_POLICY_NOT_FOUND
    http: 404
    condition: "referenced tagging policy does not exist"
  - id: ERR_PROVISIONING_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced provisioning request does not exist"
  - id: ERR_CLOUD_RESOURCE_NOT_FOUND
    http: 404
    condition: "referenced cloud resource does not exist"
  - id: ERR_COST_RECORD_NOT_FOUND
    http: 404
    condition: "referenced cost record does not exist"
  - id: ERR_SHARED_COST_POOL_NOT_FOUND
    http: 404
    condition: "referenced shared cost pool does not exist"
  - id: ERR_ALLOCATION_RUN_NOT_FOUND
    http: 404
    condition: "referenced allocation run does not exist"
  - id: ERR_ALLOCATION_LINE_NOT_FOUND
    http: 404
    condition: "referenced allocation line does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "referenced chargeback invoice does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "referenced dispute does not exist"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "referenced commitment does not exist"
  - id: ERR_REMEDIATION_TASK_NOT_FOUND
    http: 404
    condition: "referenced remediation task does not exist"
  - id: ERR_ANOMALY_ALERT_NOT_FOUND
    http: 404
    condition: "referenced anomaly alert does not exist"
  - id: ERR_BUDGET_NOT_FOUND
    http: 404
    condition: "referenced budget does not exist"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "referenced unit economics driver does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version on a manual adjustment, budget revision or tagging policy amendment"
  - id: ERR_POLICY_STATE_INVALID
    http: 409
    condition: "policy activation, retirement or amendment attempted from a status that does not declare that transition"
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "retag, approve or provision attempted from a provisioning request status that does not declare that transition"
  - id: ERR_RESOURCE_STATE_INVALID
    http: 409
    condition: "telemetry or remediation attempted on a resource whose lifecycle_state does not declare that transition, including any action on a TERMINATED resource"
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "compute, publish, reopen, close, pool attachment or manual adjustment attempted from an allocation run status that does not declare that transition, including publishing a run whose variant_applied is PROVISIONAL"
  - id: ERR_POOL_STATE_INVALID
    http: 409
    condition: "absorb or seal attempted on a pool that is already SEALED"
  - id: ERR_INVOICE_STATE_INVALID
    http: 409
    condition: "issue, settle or write-off attempted from an invoice settlement_status that does not declare that transition"
  - id: ERR_DISPUTE_STATE_INVALID
    http: 409
    condition: "start-review, request-info, respond, resolve or withdraw attempted from a dispute status that does not declare that transition"
  - id: ERR_COMMITMENT_STATE_INVALID
    http: 409
    condition: "activate or evaluate attempted from a commitment status that does not declare that transition, including activating an EXPIRED commitment"
  - id: ERR_REMEDIATION_STATE_INVALID
    http: 409
    condition: "notify, snooze, approve or cancel attempted from a remediation task status that does not declare that transition"
  - id: ERR_ALERT_STATE_INVALID
    http: 409
    condition: "acknowledge, attribute or close attempted from an anomaly alert status that does not declare that transition, including closing as EXPLAINED before attribution"
  - id: ERR_BUDGET_STATE_INVALID
    http: 409
    condition: "activate, revise, evaluate, explain or close attempted from a budget status that does not declare that transition"
  - id: ERR_INVOICE_NOT_DISPUTABLE
    http: 409
    condition: "a dispute is filed against an invoice that is not ISSUED or PARTIALLY_CREDITED, or that already carries dispute_status DISPUTED"
  - id: ERR_BU_SUSPENDED
    http: 409
    condition: "the business unit involved is SUSPENDED or ARCHIVED"
  - id: ERR_MANDATORY_TAG_MISSING
    http: 422
    condition: "a provisioning request is approved while mandatory tag dimensions are missing under BLOCKING enforcement"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "a provisioning request references a tagging policy whose status is DRAFT or RETIRED"
  - id: ERR_VARIANCE_EXPLANATION_REQUIRED
    http: 422
    condition: "provisioning is approved for a business unit whose covering budget is BREACHED and whose variance_explanation_text is still null"
  - id: ERR_PARTICIPANT_OUT_OF_SCOPE
    http: 422
    condition: "a shared cost pool participant sits outside the run's scope business unit subtree"
  - id: ERR_BU_NOT_CHARGEBACK_ENABLED
    http: 422
    condition: "a chargeback run is published or an invoice issued for a business unit whose chargeback_enabled is false"
  - id: ERR_POOL_NOT_SEALED
    http: 409
    condition: "a run is published while one of its shared cost pools is still OPEN"
  - id: ERR_RESOURCE_NOT_REMEDIABLE
    http: 409
    condition: "remediation is driven on a resource that is not FLAGGED_IDLE or RIGHTSIZE_PENDING"
  - id: ERR_RUN_NOT_FULLY_SETTLED
    http: 409
    condition: "a chargeback run is closed while an invoice is unsettled or a dispute is still open, under review or awaiting information"
  - id: ERR_RUN_REOPEN_BLOCKED
    http: 409
    condition: "a run is reopened while one of its invoices is SETTLED, or after reopen_count has reached MAX_RUN_REOPENS"
  - id: ERR_ALLOCATION_PERIOD_OVERLAP
    http: 409
    condition: "a new allocation run's half-open period overlaps a non-closed run of the same mode and scope; exactly abutting periods are accepted"
  - id: ERR_COMMITMENT_WINDOW_CONFLICT
    http: 409
    condition: "a new commitment's closed term falls within the 24-hour buffer around an existing commitment of the same type in the same region; abutting terms are rejected"
  - id: ERR_REMEDIATION_WINDOW_OVERLAP
    http: 409
    condition: "a new remediation window on the same cloud resource shares at least one instant with an existing window, touching endpoints included"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 422
    condition: "a dispute is filed after the invoice's dispute_window_ends_at"
  - id: ERR_REMEDIATION_WINDOW_EXPIRED
    http: 409
    condition: "snooze or approve is attempted after remediation_window_ends_at"
  - id: ERR_DISPUTE_ROUND_LIMIT
    http: 409
    condition: "another review round or information response is attempted once review_round has reached MAX_DISPUTE_ROUNDS"
  - id: ERR_SNOOZE_LIMIT
    http: 409
    condition: "snooze is attempted once snooze_count has reached MAX_SNOOZES"
  - id: ERR_DRIVER_VOLUME_INVALID
    http: 422
    condition: "driver_volume is zero or negative, so cost per unit would be undefined"
  - id: ERR_UNTAGGED_ABSORB_EMPTY
    http: 422
    condition: "absorb-untagged is called with an empty cost record set or with records that match no unallocated spend"
  - id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http: 422
    condition: "a shared cost pool's participant set contains no ACTIVE business unit at compute time"
  - id: ERR_PROPORTIONAL_BASIS_ZERO
    http: 422
    condition: "a PROPORTIONAL pool's basis total across eligible participants is zero"
  - id: ERR_COST_RECORD_ALREADY_ALLOCATED
    http: 409
    condition: "a cost record already ALLOCATED or REVERSED is absorbed into a shared cost pool"
  - id: ERR_COMMITMENT_CAPACITY_EXCEEDED
    http: 422
    condition: "the region's aggregate hourly commit across live commitments would exceed REGION_MAX_HOURLY_COMMIT_CENTS"
  - id: ERR_CREDIT_EXCEEDS_INVOICE
    http: 422
    condition: "a claimed or granted credit exceeds the invoice's outstanding amount after existing credits and payments"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "a settlement payment does not exactly clear the invoice's outstanding amount after credits"
  - id: ERR_BUDGET_PERIOD_DUPLICATE
    http: 409
    condition: "a business unit already has a non-closed budget whose period overlaps the requested period"
  - id: ERR_ADJUSTMENT_WOULD_GO_NEGATIVE
    http: 422
    condition: "a manual adjustment would drive the business unit's line total on the run below zero"

roles:
  - name: FinOpsAnalyst
    description: "Prepares the cost model: drafts tagging policies, drives provisioning, builds allocation runs and pools, runs the idle, sweep and anomaly scans, and triages alerts. Cannot publish a run they created."
    identity: "opaque"
    exclusive_operations:
      - "retag a provisioning request"
      - "approve and provision a provisioning request"
      - "attach and seal shared cost pools"
      - "absorb untagged spend into a pool"
      - "compute an allocation run"
      - "run the idle-detection scan, the remediation-window sweep and the anomaly scan"
      - "notify a resource owner of a remediation task"
      - "acknowledge and attribute anomaly alerts"
    shared_operations:
      - "draft a tagging policy (with FinOpsController)"
      - "create an allocation run (with FinOpsController)"
      - "ingest cost records (with PlatformAdmin)"
      - "create a provisioning request (with PlatformAdmin)"
      - "create and revise budgets, evaluate budgets (with FinOpsController)"
      - "register and compute unit economics drivers (with FinOpsController)"
      - "cancel a remediation task (with ResourceOwner)"
      - "read every finops resource"
  - name: FinOpsController
    description: "Owns the money: activates policies and commitments, publishes, reopens and closes runs, issues and writes off invoices, resolves disputes, closes alerts. Cannot publish a run they created."
    identity: "opaque"
    exclusive_operations:
      - "activate and retire a tagging policy"
      - "publish, reopen and close an allocation run"
      - "append manual adjustment lines to a run"
      - "issue and write off chargeback invoices"
      - "start review, request information and resolve disputes"
      - "purchase, activate and evaluate commitments"
      - "close anomaly alerts"
      - "activate and close budgets"
    shared_operations:
      - "draft a tagging policy (with FinOpsAnalyst)"
      - "create an allocation run (with FinOpsAnalyst)"
      - "create, revise and evaluate budgets (with FinOpsAnalyst)"
      - "record a variance explanation (with BusinessUnitOwner)"
      - "register and compute unit economics drivers (with FinOpsAnalyst)"
      - "read every finops resource"
  - name: BusinessUnitOwner
    description: "Acts as one business unit. Receives showback and chargeback, settles invoices, files, answers and withdraws disputes, and explains budget variances for its own unit only."
    identity: "entity_backed:BusinessUnit"
    exclusive_operations:
      - "settle a chargeback invoice"
      - "file a dispute"
      - "respond to an information request on a dispute"
      - "withdraw a dispute"
    shared_operations:
      - "record a variance explanation on its own budget (with FinOpsController)"
      - "read its own business unit, allocation runs, lines, invoices, disputes, budgets, alerts and unit economics"
  - name: ResourceOwner
    description: "Opaque engineering owner recorded on a cloud resource. Reacts to remediation notifications inside the window for resources they own."
    identity: "opaque"
    exclusive_operations:
      - "snooze a remediation task"
      - "approve a remediation task"
    shared_operations:
      - "cancel a remediation task (with FinOpsAnalyst)"
      - "read cloud resources and remediation tasks"
  - name: PlatformAdmin
    description: "Platform operator. Maintains the business unit tree, pushes resource telemetry, ingests billing data and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "create and update business units"
      - "push cloud resource telemetry"
      - "set the logical clock"
    shared_operations:
      - "ingest cost records (with FinOpsAnalyst)"
      - "create a provisioning request (with FinOpsAnalyst)"
      - "read every finops resource"

