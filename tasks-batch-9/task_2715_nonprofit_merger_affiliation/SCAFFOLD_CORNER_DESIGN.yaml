          A transferred fund carries three foreign keys at once - org_id (the original
          holder), transferred_to_org_id (the recipient) and transfer_restructuring_id (the
          deal) - and every one of them must be reverse-reachable. The deal sub-resource
          must return the fund even though the deal is not its org_id, the recipient filter
          must return it even though the recipient never created it, and the org_id filter
