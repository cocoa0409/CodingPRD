    - state_machines.ClinicSlot.BOOKED_to_USED
    - state_machines.Voucher.COMMITTED_to_REDEEMED
    distinguishing_aspect: 'Depth-4 chain triggered by POST /tnr/surgery-records: record ->

      appointment COMPLETED -> slot USED (which decrements

      clinic_day.booked_count) -> voucher REDEEMED -> colony

