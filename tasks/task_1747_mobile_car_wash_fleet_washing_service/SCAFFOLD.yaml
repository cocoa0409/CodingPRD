    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/fleet-wash/routes"
    description: "List routes with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["van_id?", "lead_technician_id?", "route_date?", "status?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/routes/{id}/events"
    description: "Route lifecycle events: PUBLISH, UNPUBLISH, LOCK, COMPLETE, CANCEL {cancel_reason?}"
    roles: [Dispatcher]
    code: 200
    input: [event_type, "cancel_reason?"]
    output: Route
    side_effects: ["CANCEL cascades to stops (water released) and orders (manual -> SCHEDULED); increments Route.version by 1"]
  - method: POST
    path: "/fleet-wash/routes/{id}/stops"
    description: "Append a stop for a SCHEDULED wash order (OCC-guarded); computes planned window, water reservation, and runs compliance checks"
    roles: [Dispatcher]
    code: 201
    input: [wash_order_id, expected_route_version]
    output: RouteStop
    side_effects: ["order SCHEDULED -> ASSIGNED; sequence appended; planned window computed via stop_planning; van water reserved; increments Route.version by 1"]
  - method: GET
    path: "/fleet-wash/routes/{id}/stops"
    description: "List a route's stops in sequence order"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/routes/{id}/stops/{stop_id}/events"
    description: "Stop events: ARRIVE (route lead), SKIP (route lead or Dispatcher), REMOVE (Dispatcher, route DRAFT/PUBLISHED only)"
    roles: [Dispatcher, Technician]
    code: 200
    input: [event_type]
    output: RouteStop
    side_effects: ["ARRIVE: PLANNED -> ARRIVED; SKIP: order -> CANCELLED (NO_SHOW); REMOVE: order ASSIGNED -> SCHEDULED; water released on SKIP/REMOVE; Route counters recomputed"]

  # --- vans ---
  - method: POST
    path: "/fleet-wash/vans"
    description: "Create an equipment van"
    roles: [PlatformAdmin]
    code: 201
    input: [name, tank_capacity_gal, reclaim_system]
    output: Van
    side_effects: ["status AVAILABLE; water counters zeroed"]
  - method: GET
    path: "/fleet-wash/vans/{id}"
    description: "Get a van"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Van
    side_effects: []
  - method: POST
    path: "/fleet-wash/vans/{id}/events"
    description: "Van events: LOAD_WATER {gallons}, MAINTENANCE_START, MAINTENANCE_END"
    roles: [Dispatcher]
    code: 200
    input: [event_type, "gallons?"]
    output: Van
    side_effects: ["LOAD_WATER sets water_loaded_gal and zeroes used/reserved; increments Van.version by 1"]

  # --- technicians ---
  - method: POST
    path: "/fleet-wash/technicians"
    description: "Create a technician"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "water_reclaim_certified?"]
    output: Technician
    side_effects: ["status ACTIVE"]
  - method: GET
    path: "/fleet-wash/technicians/{id}"
    description: "Get a technician"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/fleet-wash/technicians/{id}/events"
    description: "Technician events: DEACTIVATE, REACTIVATE, CERTIFY_RECLAIM"
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]
    output: Technician
    side_effects: ["increments Technician.version by 1"]

  # --- inspection reports ---
  - method: POST
    path: "/fleet-wash/inspection-reports"
    description: "File a pre-wash inspection report (DRAFT) for a wash order; technician_id taken from X-User-ID"
    roles: [Technician]
    code: 201
    input: [wash_order_id, areas]
    output: InspectionReport
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/fleet-wash/inspection-reports/{id}"
    description: "Get an inspection report"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: InspectionReport
    side_effects: []
  - method: GET
    path: "/fleet-wash/inspection-reports"
    description: "List inspection reports with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["wash_order_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: InspectionReport[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/inspection-reports/{id}/events"
    description: "Report events: SUBMIT (only the filing technician; freezes the report)"
    roles: [Technician]
    code: 200
    input: [event_type]
    output: InspectionReport
    side_effects: ["DRAFT -> SUBMITTED; immutable thereafter"]

  # --- damage claims ---
  - method: POST
    path: "/fleet-wash/damage-claims"
    description: "File a damage claim against a COMPLETED wash order within 72 hours (owning Customer)"
    roles: [Customer]
    code: 201
    input: [wash_order_id, area, claimed_amount_cents, description]
    output: DamageClaim
    side_effects: ["status FILED; filed_at = logical clock; customer_id copied from order"]
  - method: GET
    path: "/fleet-wash/damage-claims/{id}"
    description: "Get a damage claim"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/fleet-wash/damage-claims"
    description: "List damage claims with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["wash_order_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/damage-claims/{id}/events"
    description: "Claim events: START_REVIEW, APPROVE {approved_amount_cents?}, DENY {deny_reason}, MARK_PAID (approver cannot pay)"
    roles: [QualityAuditor]
    code: 200
    input: [event_type, "approved_amount_cents?", "deny_reason?"]
    output: DamageClaim
    side_effects: ["APPROVE sets approved_amount_cents and reviewed_by; MARK_PAID enforces segregation of duties and sets paid_by"]

  # --- quality audits ---
  - method: POST
    path: "/fleet-wash/quality-audits"
    description: "Record a quality audit for a COMPLETED wash order; FAIL auto-creates a guarantee rewash"
    roles: [QualityAuditor]
    code: 201
    input: [wash_order_id, exterior_score, wheels_score, glass_score, trim_score, water_spotting_score]
    output: QualityAudit
    side_effects: ["total_score and result computed; FAIL creates rewash order (WAIVED) and moves audited order -> REWASH_PENDING"]
  - method: GET
    path: "/fleet-wash/quality-audits/{id}"
    description: "Get a quality audit"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: QualityAudit
    side_effects: []
  - method: GET
    path: "/fleet-wash/quality-audits"
    description: "List quality audits with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["wash_order_id?", "limit?", "offset?"]
    output: QualityAudit[]
    side_effects: []

  # --- compliance incidents ---
  - method: POST
    path: "/fleet-wash/compliance-incidents"
    description: "Report a water-compliance incident at a site"
    roles: [ComplianceOfficer]
    code: 201
    input: [site_id, incident_type, notes, "wash_order_id?"]
    output: ComplianceIncident
    side_effects: ["status REPORTED"]
  - method: GET
    path: "/fleet-wash/compliance-incidents/{id}"
    description: "Get a compliance incident"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceIncident
    side_effects: []
  - method: GET
    path: "/fleet-wash/compliance-incidents"
    description: "List compliance incidents with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["site_id?", "wash_order_id?", "status?", "limit?", "offset?"]
    output: ComplianceIncident[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/compliance-incidents/{id}/events"
    description: "Incident events: START_REVIEW, CONFIRM, DISMISS, RESOLVE"
    roles: [ComplianceOfficer]
    code: 200
    input: [event_type]
    output: ComplianceIncident
    side_effects: ["CONFIRM suspends the site with full order/stop/route/van cascade; RESOLVE reinstates the site when no other CONFIRMED incident remains"]

  # --- invoices ---
  - method: POST
    path: "/fleet-wash/invoices/generate"
    description: "Generate an invoice for a contract and period; variant PROJECTION yields PREVIEW, FINAL yields DRAFT"
    roles: [PlatformAdmin, Dispatcher]
    code: 201
    input: [fleet_contract_id, period_month, variant]
    output: Invoice
    side_effects: ["fleet_invoice_billing + claim_credit_cap computed; generating FINAL voids existing PREVIEW rows for the same contract+period"]
  - method: GET
    path: "/fleet-wash/invoices/{id}"
    description: "Get an invoice"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/fleet-wash/invoices"
    description: "List invoices with optional filters"
    roles: [PlatformAdmin, Dispatcher, Customer, Technician, QualityAuditor, ComplianceOfficer]
    code: 200
    input: ["fleet_contract_id?", "period_month?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/fleet-wash/invoices/{id}/events"
    description: "Invoice events: ISSUE, MARK_PAID (Dispatcher); DISPUTE (Dispatcher or the contract's Customer); VOID (Dispatcher, from DISPUTED)"
    roles: [Dispatcher, Customer]
    code: 200
    input: [event_type]
    output: Invoice
    side_effects: ["ISSUE flips included orders UNBILLED -> INVOICED; MARK_PAID flips INVOICED -> PAID; VOID flips INVOICED -> UNBILLED; increments Invoice.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, unknown enum member, bad range (window_end <= window_start, gallons <= 0, score outside 0..20)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or ownership check failed (Customer acting on another customer's resource; Technician not the route lead / report filer)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a valid from-state for the requested transition (includes terminal-state lockdown and ISSUE on a PREVIEW invoice)" }
  - { id: ERR_ROUTE_LOCKED, http: 409, condition: "Route is LOCKED/COMPLETED/CANCELLED (or DRAFT for ARRIVE) and rejects the stop mutation" }
  - { id: ERR_CONTAINMENT_REQUIRED, http: 422, condition: "Water reclamation required but containment inadequate: CONFIRM with reclaim_required site of containment_type NONE; stop add with van recovery < 0.60 at a reclaim-required site" }
  - { id: ERR_DISCHARGE_CAP_EXCEEDED, http: 422, condition: "Projected discharge gallons strictly greater than site.max_discharge_gal" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "Route on an ADVANCED-reclaim van with an uncertified lead technician" }
  - { id: ERR_SITE_WINDOW_CONFLICT, http: 409, condition: "Half-open service-window overlap with another order at the same site in {SCHEDULED, ASSIGNED, IN_PROGRESS}; touching endpoints allowed" }
  - { id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http: 409, condition: "Cross-route gap for the same lead technician below 30 minutes (exactly 30 allowed)" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "Damage claim filed more than 72 hours after order completion" }
  - { id: ERR_REWASH_WINDOW_EXPIRED, http: 422, condition: "Rewash requested more than 72 hours after order completion" }
  - { id: ERR_RESCHEDULE_WINDOW_EXPIRED, http: 422, condition: "WEATHER_HELD order rescheduled after held_at date + 14 days" }
  - { id: ERR_ROUTE_WATER_CAPACITY_EXCEEDED, http: 409, condition: "Van free gallons (loaded - used - reserved) below the candidate stop's projected net draw" }
  - { id: ERR_ROUTE_VEHICLE_CAPACITY_EXCEEDED, http: 409, condition: "Route assigned_vehicle_count would exceed 40 vehicles" }
  - { id: ERR_VAN_ROUTE_CONFLICT, http: 409, condition: "Van already has a route on the same date in {DRAFT, PUBLISHED, LOCKED}, or LOAD_WATER/MAINTENANCE_START attempted while a route is PUBLISHED/LOCKED (any non-terminal for MAINTENANCE_START)" }
  - { id: ERR_TECHNICIAN_NOT_ACTIVE, http: 409, condition: "Route creation with an INACTIVE lead technician" }
  - { id: ERR_DUPLICATE_SUBSCRIPTION, http: 409, condition: "Vehicle already has a subscription in {ACTIVE, PAUSED}" }
  - { id: ERR_PAUSE_LIMIT_EXCEEDED, http: 422, condition: "PAUSE rejected: pause_count_365d >= 2 or pause_days < 7" }
  - { id: ERR_PAUSE_DURATION_EXCEEDED, http: 422, condition: "PAUSE rejected: paused_days_365d + pause_days > 90" }
  - { id: ERR_PRE_EXISTING_CONDITION_DOCUMENTED, http: 409, condition: "APPROVE blocked: a SUBMITTED InspectionReport flags the claimed area as pre-existing damage" }
  - { id: ERR_INSPECTION_REQUIRED, http: 409, condition: "START attempted on an order with requires_inspection == true and no SUBMITTED InspectionReport" }
  - { id: ERR_REWASH_IN_PROGRESS, http: 409, condition: "Another rewash of the same order is still open" }
  - { id: ERR_CUSTOMER_SUSPENDED, http: 409, condition: "Customer not ACTIVE for new wash order / subscription / CONFIRM" }
  - { id: ERR_SITE_SUSPENDED, http: 409, condition: "Site not ACTIVE for CONFIRM or START" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Subscription-billed order confirmed while the subscription is PAUSED or CANCELLED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Fleet order confirmed, or invoice generated, without an ACTIVE FleetContract" }
  - { id: ERR_INVOICE_EXISTS, http: 409, condition: "A FINAL invoice for the same contract+period already exists in {DRAFT, ISSUED, DISPUTED, PAID}" }
  - { id: ERR_CLAIM_CAP_EXCEEDED, http: 422, condition: "Explicit approved_amount_cents above min(claimed_amount_cents, class cap)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "MARK_PAID attempted by the same QualityAuditor user recorded in reviewed_by" }
  - { id: ERR_OPEN_COMPLIANCE_INCIDENT, http: 409, condition: "Site REINSTATE attempted while a ComplianceIncident at the site is CONFIRMED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator back office; manages customers, vans, technicians, fleet contracts, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /fleet-wash/_clock/set_current_utc"
      - "POST /fleet-wash/customers; POST /fleet-wash/customers/{id}/events"
      - "POST /fleet-wash/vans; POST /fleet-wash/technicians; POST /fleet-wash/technicians/{id}/events"
      - "POST /fleet-wash/fleet-contracts; PUT /fleet-wash/fleet-contracts/{id}; POST /fleet-wash/fleet-contracts/{id}/events"
    shared_operations:
      - "All GET endpoints"
      - "POST /fleet-wash/sites; POST /fleet-wash/vehicles; POST /fleet-wash/subscriptions; POST /fleet-wash/subscriptions/{id}/events"
      - "POST /fleet-wash/wash-orders; POST /fleet-wash/wash-orders/{id}/events; POST /fleet-wash/wash-orders/{id}/reschedule"
      - "POST /fleet-wash/invoices/generate"
  - name: Dispatcher
    description: "Routing desk; builds routes, manages stops, evaluates weather, runs the daily sweep, issues invoices"
    identity: opaque
    exclusive_operations:
      - "POST /fleet-wash/ops/run-daily; POST /fleet-wash/weather/evaluations"
      - "POST /fleet-wash/routes; POST /fleet-wash/routes/{id}/events; POST /fleet-wash/routes/{id}/stops"
      - "POST /fleet-wash/vans/{id}/events"
      - "POST /fleet-wash/invoices/{id}/events (ISSUE, MARK_PAID, VOID)"
    shared_operations:
      - "All GET endpoints"
      - "POST /fleet-wash/sites"
      - "POST /fleet-wash/wash-orders; POST /fleet-wash/wash-orders/{id}/events (CONFIRM, CANCEL, WEATHER_HOLD); POST /fleet-wash/wash-orders/{id}/reschedule"
      - "POST /fleet-wash/routes/{id}/stops/{stop_id}/events (REMOVE, SKIP)"
      - "POST /fleet-wash/invoices/generate; POST /fleet-wash/invoices/{id}/events (DISPUTE)"
  - name: Customer
    description: "Retail or fleet account holder; books and manages own washes, subscriptions, vehicles, rewash requests, damage claims, invoice disputes"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /fleet-wash/wash-orders/{id}/rewash"
      - "POST /fleet-wash/damage-claims"
    shared_operations:
      - "All GET endpoints (ownership-scoped in practice)"
      - "POST /fleet-wash/vehicles (own customer_id)"
      - "POST /fleet-wash/subscriptions; POST /fleet-wash/subscriptions/{id}/events (own)"
      - "POST /fleet-wash/wash-orders; POST /fleet-wash/wash-orders/{id}/events (CONFIRM, CANCEL own); POST /fleet-wash/wash-orders/{id}/reschedule (own)"
      - "POST /fleet-wash/invoices/{id}/events (DISPUTE on own contract's invoice)"
  - name: Technician
    description: "Field crew; files inspection reports, arrives at stops, starts and completes washes as the route's lead technician"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /fleet-wash/inspection-reports; POST /fleet-wash/inspection-reports/{id}/events (SUBMIT, own reports only)"
      - "POST /fleet-wash/wash-orders/{id}/events (START, COMPLETE — only as lead of the route holding the order's stop)"
    shared_operations:
      - "All GET endpoints"
      - "POST /fleet-wash/routes/{id}/stops/{stop_id}/events (ARRIVE, SKIP — as route lead)"
  - name: QualityAuditor
    description: "Independent quality function; records audits and adjudicates damage claims (approver may not pay the same claim)"
    identity: opaque
    exclusive_operations:
      - "POST /fleet-wash/quality-audits"
      - "POST /fleet-wash/damage-claims/{id}/events (START_REVIEW, APPROVE, DENY, MARK_PAID)"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Environmental compliance function; manages incidents and site suspension/reinstatement"
    identity: opaque
    exclusive_operations:
      - "POST /fleet-wash/compliance-incidents; POST /fleet-wash/compliance-incidents/{id}/events"
      - "POST /fleet-wash/sites/{id}/events"
    shared_operations:
      - "All GET endpoints"
