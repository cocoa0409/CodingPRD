        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-delivery-stale-version]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "OCC on DeliveryContract.version: after lot 1 is booked (version 1 -> 2), booking lot 2 with the stale expected_contract_version 1 fails with 412 ERR_STALE_CONTRACT_VERSION; re-reading and retrying succeeds."
        test_recipe:
          setup: ["season INTAKE_OPEN; grower; contract 400.00 cwt OPEN at version 1"]
          setup_api_calls:
            - call: "POST /mill/seasons"
              payload: { name: "2026 Fall", intake_start_date: "2026-08-01", intake_end_date: "2026-10-31", spot_daily_cap: 2 }
