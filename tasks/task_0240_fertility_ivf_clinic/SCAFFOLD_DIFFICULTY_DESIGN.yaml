              as: Embryologist
              captures: { err: $.data.error_id }
          assert:
            - "CryoSpecimen.${sp1_id}.status == STORED"
            - "response.data.error_id == ERR_TANK_AT_CAPACITY"
            - "response.http_status == 409"
            - "CryoTank.${tank_id}.reserved_slots == 1"

      - name: utilization_rate_zero_denominator_edge
        grounds:
          - calculations.embryo_utilization_rate
          - entities.OutcomeReport.fields.utilization_rate
          - entities.TreatmentCycle.fields.oocytes_retrieved
        distinguishing_aspect: |
          Zero-count / empty-set boundary on a different metric and endpoint: a cycle with
          oocytes_retrieved == 0 yields utilization_rate exactly 0.0 (no division-by-zero) when the
          OutcomeReport is created — distinct from the capacity threshold boundary.
        test_recipe:
          setup:
            - "Cycle taken to RETRIEVAL with oocytes_retrieved 0, then to FERTILIZATION with embryos_fertilized 0, fresh transfer skipped via freeze-all is impossible with 0 embryos; record outcome on a freeze branch is impossible. Use: stay in RETRIEVAL? Outcome can be recorded any time on the cycle."
            - "Outcome recorded directly on a cycle whose oocytes_retrieved is 0."
          setup_api_calls:
