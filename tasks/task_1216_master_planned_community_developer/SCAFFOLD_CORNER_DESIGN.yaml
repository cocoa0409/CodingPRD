  # ============================ cross_cutting_complexity_layers ====
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_agreement_amendment_stale_and_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-amendment-stale-version]
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "The amendment writer holding version N-1 is rejected 412 ERR_STALE_VERSION; the writer holding the current version supersedes: old tranche CANCELLED, replacement SCHEDULED, agreement version incremented."
        test_recipe:
          setup: ["ACTIVE community/phase; builder; agreement EXECUTED (committed 2, tranche T1 due 2026-06-30); agreement version observed via GET"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "OCC Oaks", total_planned_units: 20 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 10 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "OCC Builders", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { b_id: $.data.id }
            - call: "POST /mpc/agreements"
              payload: { community_id: "${c_id}", builder_id: "${b_id}", phase_id: "${p1_id}", base_price_per_lot_cents: 5000000, annual_escalation_pct: 6.0, penalty_per_lot_per_day_cents: 1000, earnest_money_cents: 1000000, total_lots_committed: 2 }
              as: DeclarantController
              captures: { ag_id: $.data.id }
            - call: "POST /mpc/tranches"
              payload: { agreement_id: "${ag_id}", tranche_no: 1, due_date: "2026-06-30T00:00:00Z", lot_count_due: 2 }
              as: DeclarantController
              captures: { t1_id: $.data.id }
            - call: "POST /mpc/agreements/${ag_id}/execute"
              payload: {}
              as: DeclarantExecutive
            - call: "GET /mpc/agreements/${ag_id}"
              as: DeclarantController
              captures: { ag_v: $.data.version }
          trigger:
            - call: "POST /mpc/agreements/${ag_id}/amendments"
              payload: { expected_agreement_version: "${ag_v} - 1", replacement_tranches: [{ tranche_no: 2, due_date: "2026-09-30T00:00:00Z", lot_count_due: 2 }] }
              as: DeclarantController
              captures: { err: $.data.error_id }
            - call: "POST /mpc/agreements/${ag_id}/amendments"
              payload: { expected_agreement_version: "${ag_v}", replacement_tranches: [{ tranche_no: 2, due_date: "2026-09-30T00:00:00Z", lot_count_due: 2 }] }
              as: DeclarantController
              captures: { ag_v2: $.data.version }
            - call: "GET /mpc/tranches/${t1_id}"
              as: DeclarantController
              captures: { t1_status: $.data.status }
            - call: "GET /mpc/tranches"
              payload: { agreement_id: "${ag_id}" }
              as: DeclarantController
              captures: { new_status: "$.data[1].status" }
          assert:
            - "stale expected version (${ag_v} - 1) -> ${err} == ERR_STALE_VERSION (http 412); nothing is superseded"
            - "current version -> 201, ${ag_v2} == ${ag_v} + 1, old tranche ${t1_status} == CANCELLED, replacement tranche ${new_status} == SCHEDULED"

      - name: occ_budget_amendment_stale_and_rate_cascade
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[budget-amendment-stale-version]
          - "errors[ERR_STALE_VERSION]"
          - state_machines.AssociationBudget.ADOPTED_to_SUPERSEDED
          - state_machines.AssessmentRate.CALCULATED_to_SUPERSEDED
        distinguishing_aspect: "Budget amendment OCC: stale expected_budget_version -> 412; fresh -> successor DRAFT with amendment_of_id and copied line items, predecessor SUPERSEDED, and the linked CALCULATED rate cascade-superseeded."
        test_recipe:
          setup: ["ACTIVE community; FY2027 budget ADOPTED (one 100,000c line); FY2027 rate CALCULATED; budget version observed via GET"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Amendment Acres", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/budgets"
              payload: { community_id: "${c_id}", fiscal_year: 2027 }
              as: DeclarantController
              captures: { bud_id: $.data.id }
            - call: "POST /mpc/line-items"
              payload: { budget_id: "${bud_id}", category: "MANAGEMENT", amount_cents: 100000 }
              as: DeclarantController
            - call: "POST /mpc/budgets/${bud_id}/propose"
              payload: {}
              as: DeclarantController
            - call: "POST /mpc/notices"
              payload: { community_id: "${c_id}", notice_type: "BUDGET_ADOPTION", subject: "b", body: "adopt", send_at: "2026-05-02T00:00:00Z", budget_id: "${bud_id}" }
              as: LifestyleCoordinator
              captures: { n_id: $.data.id }
            - call: "POST /mpc/notices/${n_id}/schedule"
              payload: {}
              as: LifestyleCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mpc/budgets/${bud_id}/adopt"
              payload: {}
              as: AssociationDirector
            - call: "POST /mpc/assessment-rates"
              payload: { community_id: "${c_id}", budget_id: "${bud_id}", fiscal_year: 2027 }
              as: DeclarantController
              captures: { rate_id: $.data.id }
            - call: "GET /mpc/budgets/${bud_id}"
              as: DeclarantController
              captures: { bud_v: $.data.version }
          trigger:
            - call: "POST /mpc/budgets/${bud_id}/amendments"
              payload: { expected_budget_version: "${bud_v} - 1" }
              as: DeclarantController
              captures: { err: $.data.error_id }
            - call: "POST /mpc/budgets/${bud_id}/amendments"
              payload: { expected_budget_version: "${bud_v}" }
              as: DeclarantController
              captures: { succ_id: $.data.id, succ_of: $.data.amendment_of_id, succ_total: $.data.total_expense_cents, succ_status: $.data.status }
            - call: "GET /mpc/budgets/${bud_id}"
              as: DeclarantController
              captures: { old_status: $.data.status }
            - call: "GET /mpc/assessment-rates/${rate_id}"
              as: DeclarantController
              captures: { rate_status: $.data.status }
          assert:
            - "stale -> ${err} == ERR_STALE_VERSION (412)"
            - "fresh -> 201: ${succ_status} == DRAFT, ${succ_of} == ${bud_id}, copied lines give ${succ_total} == 100000"
            - "predecessor ${old_status} == SUPERSEDED; linked CALCULATED rate cascades: ${rate_status} == SUPERSEDED"

      - name: clock_default_epoch_fixed
        claim_type: scheduled_actions
        grounds:
          - endpoints
        distinguishing_aspect: "With no set_current_utc call, the logical clock is the fixed default 2026-05-01T00:00:00Z — server-minted created_at equals that instant (ISO 8601 UTC, three fractional digits), never wall-clock time."
        test_recipe:
          setup: ["empty database; no clock call issued"]
          setup_api_calls: []
          trigger:
            - call: "POST /mpc/communities"
              payload: { community_name: "Epoch Edge", total_planned_units: 5 }
              as: DeclarantExecutive
              captures: { created: $.data.created_at }
          assert:
            - "${created} == 2026-05-01T00:00:00.000Z (fixed logical epoch, three fractional digits)"

      - name: notice_send_sweep_and_cancellation
        claim_type: scheduled_actions
        grounds:
          - state_machines.ResidentNotice
        distinguishing_aspect: "Deferred delivery: a SCHEDULED notice is still SCHEDULED one day before send_at, SENT with sent_at == send_at once the clock reaches it; a notice cancelled before send_at stays CANCELLED through the same sweep."
        test_recipe:
          setup: ["ACTIVE community; notices N1 and N2 both SCHEDULED with send_at 2026-05-10"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Sweep Shores", total_planned_units: 10 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
