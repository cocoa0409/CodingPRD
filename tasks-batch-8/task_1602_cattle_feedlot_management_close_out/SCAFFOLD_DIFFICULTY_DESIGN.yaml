  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pen_assignment_aggregate_capacity_with_zero_gap_adjacency
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - entities.PenAssignment.fields.end_date
        distinguishing_aspect: |
          Resource Pen with AGGREGATE-CAPACITY interval semantics: compatible
          lots may share the pen over an overlapping window as long as summed
          head <= capacity (6+4 == 10 allowed), incompatible lots are rejected
          on overlap, and half-open adjacency (one assignment ending 08-10,
          another starting 08-10) is NOT an overlap.
        test_recipe:
          setup:
            - "Pen H-01 capacity 10; lots L-1010 (6 steers), L-1011 (4 steers), L-1012 (1 steer, commingle_allowed false), L-1013 (6 steers); commingle lots all on ration R-H step 1 [2026-08-01, 2026-09-01)"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-1010", billing_email: "o1010@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "H-01", capacity_head: 10 }
              as: FeedyardManager
              captures: { p_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-H", step_level: 1, cost_per_ton_cents: 20000 }
              as: FeedManager
              captures: { r_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1010", sex_class: "STEER", head_count_in: 6, in_weight_total_lbs: 4200, purchase_cost_cents: 840000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { la: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1011", sex_class: "STEER", head_count_in: 4, in_weight_total_lbs: 2800, purchase_cost_cents: 560000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { lb: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1012", sex_class: "STEER", head_count_in: 1, in_weight_total_lbs: 700, purchase_cost_cents: 140000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { lc: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1013", sex_class: "STEER", head_count_in: 6, in_weight_total_lbs: 4200, purchase_cost_cents: 840000, arrival_date: "2026-08-01", commingle_allowed: true }
              as: FeedyardManager
              captures: { ld: $.data.id }
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${la}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${lb}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: FeedManager
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${ld}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: FeedManager
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${la}", head_count: 6, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { aA: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${lb}", head_count: 4, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { aB: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${lc}", head_count: 1, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { err1: $.data.error_id }
            - call: "POST /feedlot/assignments/${aA}/end"
              payload: { end_date: "2026-08-10" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p_id}", lot_id: "${ld}", head_count: 6, start_date: "2026-08-10" }
              as: FeedyardManager
              captures: { aD: $.data.id }
            - call: "GET /feedlot/pens/${p_id}"
              as: Any
              captures: { occ: $.data.current_occupancy_head }
          assert:
            - "aA and aB created: compatible lots overlap in [2026-08-01, ...) with summed head 6+4 == 10 <= capacity"
            - "err1 == ERR_COMMINGLE_RULE_VIOLATION (L-1012 has commingle_allowed false: overlap rejected on compatibility, not capacity)"
            - "aD created: L-1010's assignment ended 2026-08-10 and L-1013 starts 2026-08-10 — zero-gap adjacency is not an overlap; concurrent load is 4+6 == 10"
            - "occ == 10 (ended assignments contribute 0)"

      - name: ration_window_exclusive_disjoint
        grounds:
          - validations[priority=10]
          - entities.RationAssignment.fields.end_date
        distinguishing_aspect: |
          Resource Lot (its ration timeline) with EXCLUSIVE interval semantics
          — different resource entity and different semantics than the Pen's
          aggregate-capacity rule: ANY overlap between a lot's ration windows
          is rejected regardless of head counts, while zero-gap adjacency
          (start == previous end) is allowed.
        test_recipe:
          setup:
            - "Lot L-1014: 10 steers, arrival 2026-08-01; rations R-S1 (step 1) and R-S2 (step 2) formulated"
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-1014", billing_email: "o1014@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-S1", step_level: 1, cost_per_ton_cents: 20000 }
              as: FeedManager
              captures: { r1: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-S2", step_level: 2, cost_per_ton_cents: 22000 }
              as: FeedManager
              captures: { r2: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1014", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l_id}", ration_id: "${r1}", start_date: "2026-08-01", end_date: "2026-08-15" }
              as: FeedManager
              captures: { ra1: $.data.id }
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l_id}", ration_id: "${r2}", start_date: "2026-08-10", end_date: "2026-08-20" }
              as: FeedManager
              captures: { err: $.data.error_id }
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l_id}", ration_id: "${r2}", start_date: "2026-08-15", end_date: "2026-08-25" }
              as: FeedManager
              captures: { ra2_status: $.data.status }
          assert:
            - "ra1 created for [2026-08-01, 2026-08-15) step 1"
            - "err == ERR_RATION_WINDOW_OVERLAP ([2026-08-10, 2026-08-20) intersects [2026-08-01, 2026-08-15))"
            - "ra2_status == ACTIVE ([2026-08-15, 2026-08-25) starts exactly at the prior end: adjacent windows are disjoint; step 2 == 1+1 satisfied)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: death_loss_void_restores_head_conservation
        grounds:
          - state_machines.DeathLoss.RECORDED_to_VOIDED
          - entities.Lot.fields.head_count_current
        distinguishing_aspect: |
          Conserved quantity: head count. Invariant pinned as
          head_count_in == head_count_current + total_deaths + head_shipped.
          The forward action (death loss of 7) and its compensation (void)
          restore the exact assignment-level allocation, leaving the invariant
          and every derived counter unchanged.
        test_recipe:
          setup:
            - "Lot L-1101: 10 steers, purchase 1400000c, arrival 2026-08-01; split 6 head in pen I-01 (assignment created first) and 4 head in I-02; health event 5000c on 2026-08-01; clock 2026-08-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-1101", billing_email: "o1101@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "I-01", capacity_head: 50 }
              as: FeedyardManager
              captures: { pa: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "I-02", capacity_head: 50 }
              as: FeedyardManager
              captures: { pb: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1101", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${pa}", lot_id: "${l_id}", head_count: 6, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${pb}", lot_id: "${l_id}", head_count: 4, start_date: "2026-08-01" }
              as: FeedyardManager
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "DRAXXIN", withdrawal_days: 0, head_treated: 2, treatment_cost_cents: 5000 }
              as: CattleHealthTech
          trigger:
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 7, cause: "RESPIRATORY", insured: false }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { cur1: $.data.head_count_current, dth1: $.data.total_deaths, shp1: $.data.head_shipped }
            - call: "POST /feedlot/death-losses/${d_id}/void"
              as: CattleHealthTech
              captures: { d_status: $.data.status }
            - call: "GET /feedlot/lots/${l_id}"
              as: Any
              captures: { cur2: $.data.head_count_current, dth2: $.data.total_deaths, shp2: $.data.head_shipped, dlc2: $.data.total_death_loss_cents }
            - call: "GET /feedlot/lots/${l_id}/assignments"
              as: Any
              captures: { a1h: "$.data[0].head_count", a2h: "$.data[1].head_count" }
            - call: "GET /feedlot/pens/${pa}"
              as: Any
              captures: { pa_status: $.data.status, pa_occ: $.data.current_occupancy_head }
          assert:
            - "after forward action: 10 == cur1 + dth1 + shp1 with cur1 == 3, dth1 == 7, shp1 == 0"
            - "d_status == VOIDED"
            - "after compensation: 10 == cur2 + dth2 + shp2 with cur2 == 10, dth2 == 0, shp2 == 0 (no drift)"
            - "dlc2 == 0 (death-loss value fully reversed out of the cost pool)"
            - "a1h == 6 and a2h == 4 (allocations restored to the SAME assignments they were deducted from)"
            - "pa_status == OCCUPIED and pa_occ == 6 (pen I-01 flipped back from EMPTY)"

      - name: invoice_void_restores_owner_balance
        grounds:
          - state_machines.Invoice.OPEN_to_VOID
          - entities.Owner.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (different quantity than head count).
          Invariant: owner.outstanding_balance_cents before close-out confirm
          == balance after the generated invoice is voided. Forward action
          (confirm -> invoice -> balance += total) paired with compensation
          (void -> balance -= unpaid remainder) leaves the balance unchanged.
        test_recipe:
          setup:
            - "Lot L-1102: 2 heifers, 1400 lbs, purchase 280000c, arrival 2026-08-01; clock 2026-08-02; marketed, shipped 2026-08-02 at 1500 lbs; close-out PER_CARCASS base 18537 confirmed with 2 carcass records -> OPEN invoice of 90c (yardage only: 2 head x 1 day x 45c); owner balance 90"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-1102", billing_email: "o1102@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-1102", sex_class: "HEIFER", head_count_in: 2, in_weight_total_lbs: 1400, purchase_cost_cents: 280000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-02", out_weight_total_lbs: 1500 }
              as: FeedyardManager
              captures: { lot_v: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 18537, expected_lot_version: "${lot_v}" }
              as: RiskManager
              captures: { co_id: $.data.id }
            - call: "POST /feedlot/close-outs/${co_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 763, quality_grade: "CHOICE", yield_grade: 2 }
                  - { hot_carcass_weight_lbs: 812, quality_grade: "SELECT", yield_grade: 4 }
              as: RiskManager
            - call: "GET /feedlot/lots/${l_id}/invoices"
              as: Any
              captures: { inv_id: "$.data[0].id", inv_total: "$.data[0].total_cents" }
            - call: "GET /feedlot/owners/${o_id}"
              as: Any
              captures: { bal1: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /feedlot/invoices/${inv_id}/void"
              payload: { reason: "REBILL" }
              as: BillingClerk
              captures: { v_status: $.data.status }
            - call: "GET /feedlot/owners/${o_id}"
              as: Any
              captures: { bal2: $.data.outstanding_balance_cents }
          assert:
            - "inv_total == 90 and bal1 == 90 (balance == open invoice total after confirm)"
            - "v_status == VOID"
            - "bal2 == 0 (compensation restores the pre-confirm balance exactly; no drift in the conserved money quantity)"
