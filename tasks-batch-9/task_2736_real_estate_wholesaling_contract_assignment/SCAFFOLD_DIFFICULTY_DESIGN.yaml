          - entities.MarketingCampaign.fields.suspension_count
          - entities.SellerLead.fields.lead_gen_blocked
          - validations[priority=23]
        distinguishing_aspect: |
          A depth-4 cascade triggered by the ComplianceReview OPENED -> ADJUDICATED_ADVERSE
          transition — a different triggering transition from the contract-cancel cascade:
          the second adverse finding increments adverse_finding_count to the threshold 2,
          that increment flips Wholesaler.compliance_hold to true, that flip suspends every
          PUBLISHED campaign, and that suspension sets lead_gen_blocked on the campaign's
          seller leads.
