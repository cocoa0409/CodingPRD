  # ===========================================================================
  # Section 4 — Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_registration_same_employer_beneficiary_year_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_DUPLICATE_REGISTRATION]
          - endpoints.POST /h1b-registrations
        distinguishing_aspect: "A second registration for the same (employer_id, beneficiary_id, fiscal_year) → ERR_DUPLICATE_REGISTRATION (409)."
        test_recipe:
          setup:
            - "CapProgram FY2027 exists; one registration (emp, ben, 2027) already created."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "400000001", legal_name: "Dup Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "Dup Ben", passport_number: "P-CORNER-9" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { ben_id: $.data.id }
            - call: "POST /cap-programs"
              payload: { fiscal_year: 2027, selection_quota: 5 }
              as: USCISOfficer
              captures: { cap_id: $.data.id }
            - call: "POST /h1b-registrations"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", fiscal_year: 2027 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /h1b-registrations"
              payload: { employer_id: "${emp_id}", beneficiary_id: "${ben_id}", fiscal_year: 2027 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_REGISTRATION"
            - "response status == 409"

      - name: perm_recruiting_requires_issued_pwd
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - errors[ERR_PWD_NOT_ISSUED]
          - state_machines.PermCase.DRAFT_to_RECRUITING
        distinguishing_aspect: "DRAFT->RECRUITING while the referenced PWD is still PENDING → ERR_PWD_NOT_ISSUED (409)."
        test_recipe:
          setup:
            - "A PermCase references a PENDING (never issued) PWD."
          setup_api_calls:
            - call: "POST /employers"
              payload: { fein: "400000002", legal_name: "PwdGate Co", employee_count: 10 }
              as: EmployerAgent
              captures: { emp_id: $.data.id }
            - call: "POST /prevailing-wage-determinations"
              payload: { employer_id: "${emp_id}", soc_code: "15-1252", job_title: "SWE", area_code: "AREA_A", wage_level: "LEVEL_II", wage_source: "OES", oes_wage_cents: 10000000, validity_start: "2026-05-01T00:00:00Z", validity_end: "2027-05-01T00:00:00Z" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pwd_id: $.data.id }
            - call: "POST /perm-cases"
              payload: { employer_id: "${emp_id}", pwd_id: "${pwd_id}", job_title: "SWE", offered_wage_cents: 12000000 }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { pc_id: $.data.id }
          trigger:
            - call: "POST /perm-cases/${pc_id}/transitions"
              payload: { to_status: "RECRUITING" }
              as: EmployerAgent
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PWD_NOT_ISSUED"
            - "PermCase.${pc_id}.status == DRAFT (unchanged)"

      - name: petition_submit_requires_selected_registration
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - errors[ERR_REGISTRATION_NOT_SELECTED]
          - state_machines.H1BPetition.DRAFT_to_SUBMITTED
        distinguishing_aspect: "LCA CERTIFIED but the registration is still SUBMITTED (lottery not run) → petition submit fails ERR_REGISTRATION_NOT_SELECTED (registration is the failing gate, not the LCA)."
        test_recipe:
          setup:
            - "LCA CERTIFIED; registration SUBMITTED (no lottery run); a DRAFT petition referencing them; worksite AREA_A covered."
          setup_api_calls:
