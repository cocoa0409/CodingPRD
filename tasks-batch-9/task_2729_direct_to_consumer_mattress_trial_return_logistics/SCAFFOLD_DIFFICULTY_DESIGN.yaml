  - rule_id: compensating_invariant
    instances:
      - name: refund_release_then_void_conserves_the_paid_amount_ledger_identity
        grounds:
          - state_machines.RefundAuthorization.status.AUTHORIZED_to_RELEASED
          - state_machines.RefundAuthorization.status.RELEASED_to_VOIDED
          - entities.TrialOrder.fields.refunded_total_cents
          - entities.TrialOrder.fields.outstanding_refundable_cents
          - entities.TrialOrder.fields.retained_amount_cents
          - state_machines.ReturnCase.financial_status.RELEASED_to_VOID
          - validations[priority=16]
        distinguishing_aspect: |
          Money conservation: TrialOrder.paid_amount_cents == refunded_total_cents +
          outstanding_refundable_cents + retained_amount_cents must hold at all four observable
          instants (120000 = 0 + 120000 + 0 before release, = 114000 + 0 + 6000 after release,
          = 0 + 120000 + 0 after the void). The void is a true compensation, not a delete: the
          RefundAuthorization row survives in VOIDED with net_refund_cents still 114000, and the
          6000 of retained proration is handed back rather than stranded.
