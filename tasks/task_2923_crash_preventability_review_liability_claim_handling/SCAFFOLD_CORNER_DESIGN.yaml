          - endpoints[POST /review-cases/{id}/appeal]
        distinguishing_aspect: "The two segregation rules key on different facts — decide looks at live ballots by the acting user, appeal looks only at decided_by_user_id — so the manager who voted is barred from deciding but free to grant the appeal, and the manager who decided is barred only from the appeal."
