# =============================================================================
# 1.9 Scaffold Corner Design — breadth probe over §1.1-§1.7 of SCAFFOLD.yaml
# Sections and claim_type values are taken from
# references/claim-extraction-guide.md; corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: household_creation_returns_declared_fields_and_derives_family_type
        claim_type: creation
        grounds:
          - entities.Household
          - calculations.family_type_derivation
          - endpoints[POST /households]
        distinguishing_aspect: |
          A single adult with a youngest child of 30 months derives
          SINGLE_PARENT_CHILD_UNDER_6 (not SINGLE_PARENT), and every clock rollup
          starts at 0 rather than null, in the 201 response body itself.
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Creation Household", county_code: "ADA", household_size: 4, adult_count: 1, youngest_child_age_months: 30, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == \"object\""
            - "Household.${hh_id}.family_type == SINGLE_PARENT_CHILD_UNDER_6"
            - "Household.${hh_id}.household_size == 4"
            - "Household.${hh_id}.prior_state_clock_months == 0"
            - "Household.${hh_id}.prior_federal_clock_months == 0"
            - "Household.${hh_id}.state_clock_months_used == 0"
            - "Household.${hh_id}.federal_clock_months_used == 0"
            - "Household.${hh_id}.extension_months_used == 0"
            - "Household.${hh_id}.issued_countable_months == 0"
            - "Household.${hh_id}.diversion_ineligible_through_month == null"
            - "Household.${hh_id}.version == 1"

      - name: household_retrieval_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints[GET /households/{id}]
          - entities.Household
        distinguishing_aspect: |
          A follow-up GET by a role other than the creating Caseworker returns the
          same computed family_type and the same version as the create response,
          proving the row was persisted rather than derived per request.
        test_recipe:
          setup:
            - "One household of size 2 with two adults and no subsidized child care exists."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Retrieval Household", county_code: "CANYON", household_size: 2, adult_count: 2, youngest_child_age_months: 40, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "GET /households/${hh_id}"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
          assert:
            - "HTTP status == 200"
            - "Household.${hh_id}.head_of_household_name == \"Corner Retrieval Household\""
            - "Household.${hh_id}.county_code == \"CANYON\""
            - "Household.${hh_id}.family_type == TWO_PARENT_NO_SUBSIDIZED_CHILD_CARE"
            - "Household.${hh_id}.version == 1"

      - name: application_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /households/{id}/applications]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three applications and limit 2 the first page reports
          total_count 3 and has_more true, and offset 2 returns the single
          remaining row with has_more false — total_count is the unpaginated
          count, not the page length.
        test_recipe:
          setup:
            - "One household has three RECEIVED applications for 2026-06, 2026-07 and 2026-08."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Listing Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-06", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-07", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "GET /households/${hh_id}/applications?limit=2&offset=0"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "GET /households/${hh_id}/applications?limit=2&offset=2"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "the first trigger call returns HTTP 200 with response_type == \"array\""
            - "the first trigger response has total_count 3, limit 2, offset 0, has_more true and 2 rows in data"
            - "the second trigger response has total_count 3, limit 2, offset 2, has_more false and 1 row in data"

      - name: get_case_with_unknown_path_id_returns_case_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors.ERR_CASE_NOT_FOUND
          - endpoints[GET /cases/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown case id yields the resource-specific
          ERR_CASE_NOT_FOUND with HTTP 404, not a generic not-found id and not 400.
        test_recipe:
          setup:
            - "The database contains no AssistanceCase rows."
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_CASE_NOT_FOUND"
            - "response_type == \"error\""

      - name: application_create_missing_required_household_id_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /applications]
        distinguishing_aspect: |
          household_id has no default, so omitting it fails the priority-5 body
          check with HTTP 400 before any foreign-key lookup at priority 4 can run.
        test_recipe:
          setup:
            - "One household exists but is not referenced by the request body."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Required Field Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications"
              payload: { application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE" }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "no Application row was created"

      - name: resource_item_omitted_encumbrance_defaults_to_zero
        claim_type: defaults
        grounds:
          - entities.ResourceItem.fields.encumbrance_cents
          - calculations.countable_resource_determination
          - endpoints[POST /applications/{id}/resource-items]
        distinguishing_aspect: |
          Omitting the optional encumbrance_cents stores 0 rather than null, so
          countable_value_cents equals the gross value 150000 exactly; a null
          encumbrance would make the subtraction undefined.
        test_recipe:
          setup:
            - "One household has a RECEIVED 2026-08 application."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Default Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/resource-items"
              payload: { item_type: "LIQUID_ASSET", gross_value_cents: 150000, exclusion_type: "NONE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { res_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ResourceItem.${res_id}.encumbrance_cents == 0"
            - "ResourceItem.${res_id}.countable_value_cents == 150000"

      - name: case_hour_requirements_are_computed_at_approve_from_family_type
        claim_type: computed_fields
        grounds:
          - calculations.required_hours_by_family_type
          - entities.AssistanceCase.fields.required_core_monthly_hours
          - endpoints[POST /applications/{id}/approve]
        distinguishing_aspect: |
          A two-parent household WITH subsidized child care gets 55 / 50 weekly
          and 220 / 200 monthly hours — the highest tier — and the case's
          household_size and family_type are snapshotted onto the case rather than
          read live from the household.
        test_recipe:
          setup:
            - "A two-parent household of size 4 with subsidized child care has a DETERMINED 2026-08 application with no income, so countable_income_cents is 0 and determined_benefit_cents is 50150."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Computed Household", county_code: "ADA", household_size: 4, adult_count: 2, youngest_child_age_months: 40, has_subsidized_child_care: true }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Application.${app_id}.countable_income_cents == 0"
            - "Application.${app_id}.determined_benefit_cents == 50150"
            - "AssistanceCase.${case_id}.family_type == TWO_PARENT_WITH_SUBSIDIZED_CHILD_CARE"
            - "AssistanceCase.${case_id}.household_size == 4"
            - "AssistanceCase.${case_id}.required_weekly_hours == 55"
            - "AssistanceCase.${case_id}.required_core_weekly_hours == 50"
            - "AssistanceCase.${case_id}.required_monthly_hours == 220"
            - "AssistanceCase.${case_id}.required_core_monthly_hours == 200"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 50150"
            - "AssistanceCase.${case_id}.sanction_level == 0"
            - "AssistanceCase.${case_id}.compliance_status == ASSIGNED"

      - name: household_create_ignores_client_supplied_system_extra_field
        claim_type: system_fields
        grounds:
          - entities.Household
          - validations[priority=5]
          - response_envelope.success
        distinguishing_aspect: |
          Unknown and system-owned fields in the body are ignored rather than
          rejected: the request still returns 201, the server-generated id differs
          from the supplied one and version is 1 rather than the supplied 99.
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner System Field Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false, id: "00000000-0000-0000-0000-00000000abcd", version: 99, family_type: "CHILD_ONLY" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Household.${hh_id}.id != \"00000000-0000-0000-0000-00000000abcd\""
            - "Household.${hh_id}.version == 1"
            - "Household.${hh_id}.family_type == SINGLE_PARENT"
            - "Household.${hh_id}.created_at and Household.${hh_id}.updated_at are server-generated ISO-8601 timestamps"

      - name: application_create_invalid_enum_budgeting_method_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - entities.Application.fields.budgeting_method
        distinguishing_aspect: |
          budgeting_method is a closed enum, so MONTHLY_AVERAGE is refused with
          HTTP 400 at priority 5 even though household_id resolves — an
          out-of-domain enum is a body error, not a not-found.
        test_recipe:
          setup:
            - "One household exists."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Enum Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "MONTHLY_AVERAGE" }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /households/${hh_id}/applications returns total_count 0"

      - name: income_source_under_unknown_parent_application_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors.ERR_APPLICATION_NOT_FOUND
          - endpoints[POST /applications/{id}/income-sources]
        distinguishing_aspect: |
          The parent path segment is resolved before the body is validated, so an
          unknown application id yields ERR_APPLICATION_NOT_FOUND (404) rather than
          ERR_INVALID_REQUEST, even though the body is well formed.
        test_recipe:
          setup:
            - "The database contains no Application rows."
          setup_api_calls: []
          trigger:
            - call: "POST /applications/00000000-0000-0000-0000-0000000000aa/income-sources"
              payload: { source_type: "EARNED", gross_monthly_cents: 40000, month_1_cents: 40000, month_2_cents: 40000, month_3_cents: 40000, is_recurring: true }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_APPLICATION_NOT_FOUND"

      - name: overpayment_body_foreign_key_to_unknown_case_not_found
        claim_type: flat
        grounds:
          - validations[priority=4]
          - errors.ERR_CASE_NOT_FOUND
          - endpoints[POST /overpayments]
        distinguishing_aspect: |
          In this flat topology the case link is a body field rather than a path
          segment, and it is checked at priority 4 in input-declaration order, so
          an unknown case_id returns ERR_CASE_NOT_FOUND (404) before the
          months_covered business check at priority 56.
        test_recipe:
          setup:
            - "The database contains no AssistanceCase rows."
          setup_api_calls: []
          trigger:
            - call: "POST /overpayments"
              payload: { case_id: "00000000-0000-0000-0000-0000000000bb", claim_type: "CLIENT_ERROR", months_covered: ["2026-08"], gross_amount_cents: 30000, computation_method: "GROSS" }
              as: FiscalOfficer
              as_user_id: "fo-1"
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_CASE_NOT_FOUND"
            - "no Overpayment row was created"

  - section: state_machines
    instances:
      - name: newly_created_application_starts_in_received
        claim_type: initial_state
        grounds:
          - state_machines.Application.status
          - entities.Application.fields.status
        distinguishing_aspect: |
          The create response itself shows status RECEIVED with every determination
          output still null, so no implicit determination runs at create time.
        test_recipe:
          setup:
            - "One household exists."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Initial State Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "RETROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Application.${app_id}.status == RECEIVED"
            - "Application.${app_id}.budgeting_method == RETROSPECTIVE"
            - "Application.${app_id}.countable_income_cents == null"
            - "Application.${app_id}.determined_benefit_cents == null"
            - "Application.${app_id}.determined_by_user_id == null"
            - "Application.${app_id}.denial_reason == NONE"

      - name: withdrawn_application_cannot_be_determined
        claim_type: invalid_transitions
        grounds:
          - state_machines.Application.status
          - validations[priority=20]
          - errors.ERR_INVALID_APPLICATION_STATE
        distinguishing_aspect: |
          WITHDRAWN is not a declared source state for the determine transition, so
          the call fails with ERR_INVALID_APPLICATION_STATE (409) and no
          determination fields are written — distinct from the 404 an unknown id
          would give.
        test_recipe:
          setup:
            - "One household has a WITHDRAWN 2026-08 application."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Withdrawn Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/withdraw"
              payload: { withdrawal_reason: "MOVED_OUT_OF_STATE" }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_APPLICATION_STATE"
            - "Application.${app_id}.status == WITHDRAWN"
            - "Application.${app_id}.countable_income_cents == null"

      - name: denied_application_is_terminal_and_rejects_approve
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Application.status
          - errors.ERR_INVALID_APPLICATION_STATE
          - endpoints[POST /applications/{id}/deny]
        distinguishing_aspect: |
          DENIED is terminal: no declared transition leaves it, so a subsequent
          approve returns ERR_INVALID_APPLICATION_STATE and creates no
          AssistanceCase, and denial_reason keeps the recorded value.
        test_recipe:
          setup:
            - "A household of size 3 has a DETERMINED 2026-08 application with no income."
            - "The application has been DENIED by sup-1 with denial_reason FAILURE_TO_COOPERATE."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Denied Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/deny"
              payload: { denial_reason: "FAILURE_TO_COOPERATE" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-2"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_APPLICATION_STATE"
            - "Application.${app_id}.status == DENIED"
            - "Application.${app_id}.denial_reason == FAILURE_TO_COOPERATE"
            - "Application.${app_id}.decided_by_user_id == \"sup-1\""
            - "GET /cases?application_id=${app_id} returns total_count 0"

      - name: duplicate_issuance_for_the_same_benefit_month_is_refused
        claim_type: idempotency
        grounds:
          - validations[priority=44]
          - errors.ERR_DUPLICATE_ISSUANCE_MONTH
          - state_machines.AssistanceCase.benefit_status
        distinguishing_aspect: |
          Re-posting the same benefit_month is refused with 409 rather than being
          silently idempotent, and the clock rollups stay at 1 month — a duplicate
          must not double-count the state or federal clock.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued, so state_clock_months_used is 1."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Duplicate Issuance Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { tlm_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_ISSUANCE_MONTH"
            - "GET /cases/${case_id}/time-limit-months returns total_count 1"
            - "TimeLimitMonth.${tlm_id}.assistance_issued == true"
            - "Household.${hh_id}.state_clock_months_used == 1"
            - "Household.${hh_id}.federal_clock_months_used == 1"
            - "Household.${hh_id}.issued_countable_months == 1"
            - "AssistanceCase.${case_id}.benefit_status == ACTIVE"

      - name: good_cause_grant_before_conciliation_starts_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ComplianceEpisode.status
          - errors.ERR_INVALID_EPISODE_STATE
          - endpoints[POST /compliance-episodes/{id}/grant-good-cause]
        distinguishing_aspect: |
          grant-good-cause is declared only from CONCILIATION, so an ALLEGED
          episode is refused with ERR_INVALID_EPISODE_STATE, good_cause_reason
          stays NONE and the case remains CONCILIATION_PENDING rather than moving
          to EXEMPT.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued."
            - "A caseworker-referred ComplianceEpisode for REFUSED_ASSIGNMENT is in ALLEGED and the case is in CONCILIATION_PENDING."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Good Cause Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { case_v1: $.data.version }
            - call: "POST /compliance-episodes"
              payload: { case_id: "${case_id}", allegation_reason: "REFUSED_ASSIGNMENT", expected_case_version: "${case_v1}" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { ep_id: $.data.id }
          trigger:
            - call: "POST /compliance-episodes/${ep_id}/grant-good-cause"
              payload: { good_cause_reason: "ILLNESS" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_EPISODE_STATE"
            - "ComplianceEpisode.${ep_id}.status == ALLEGED"
            - "ComplianceEpisode.${ep_id}.origin == CASEWORKER_REFERRAL"
            - "ComplianceEpisode.${ep_id}.good_cause_reason == NONE"
            - "ComplianceEpisode.${ep_id}.sanction_level == 0"
            - "AssistanceCase.${case_id}.compliance_status == CONCILIATION_PENDING"

      - name: rejecting_a_participation_report_leaves_cumulative_hours_unchanged
        claim_type: side_effect_execution
        grounds:
          - state_machines.ParticipationReport.status
          - endpoints[POST /participation-reports/{id}/reject]
          - entities.WorkAssignment.fields.cumulative_verified_hours
        distinguishing_aspect: |
          Rejection is the non-crediting branch of the report machine: the row
          reaches REJECTED with verified_hours still null, the assignment's
          cumulative_verified_hours stays 0 and no ComplianceEpisode is created,
          which is what separates reject from verifying 0 hours.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued and has an ACTIVE COMMUNITY_SERVICE assignment of 20 scheduled weekly hours for 2026-08-01..2026-12-01."
            - "That assignment has one SUBMITTED 2026-08 report of 100 hours with verification_source SELF_REPORT."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Reject Report Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
