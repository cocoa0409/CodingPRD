              payload: { affected_zone_id: "${z1}", severity: "MAJOR", window_start: "2026-02-15T00:00:00Z", window_end: "2026-04-15T00:00:00Z" }
              as: ForestryAdmin
              captures: { st: $.data.id }
            - call: "POST /forestry/contractors"
              payload: { name: "Acme Tree", license_number: "L-1", license_expiry: "2027-01-01T00:00:00Z", is_certified_arborist: true, status: "ACTIVE" }
              as: ForestryAdmin
              captures: { c1: $.data.id }
            - call: "POST /forestry/work-orders"
              payload: { tree_id: "${t20}", contractor_id: "${c1}", work_type: "EMERGENCY_REMOVAL", scheduled_start: "2026-03-01T08:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: ForestryStaff
              captures: { wo1: $.data.id }
          trigger:
            - call: "POST /forestry/work-orders"
              payload: { tree_id: "${t20}", contractor_id: "${c1}", work_type: "EMERGENCY_REMOVAL", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T11:00:00Z" }
