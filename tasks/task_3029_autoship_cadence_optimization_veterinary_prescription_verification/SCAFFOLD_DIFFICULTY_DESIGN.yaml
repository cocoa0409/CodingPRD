            - call: "POST /v1/pets"
              payload: { pet_name: "Odette", species: "CAT", breed: "Birman", weight_kg: 4.1, owner_state: "CA" }
              as: Customer
              captures: { pet_i1b: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_i1}", blackout_start_date: "2026-09-30T00:00:00Z", blackout_end_date: "2026-10-06T00:00:00Z" }
              as: Customer
              as_user_id: "${pet_i1}"
              captures: { plan_i1: "$.data.id" }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_i1b}", blackout_start_date: "2026-09-29T00:00:00Z", blackout_end_date: "2026-10-06T00:00:00Z" }
              as: Customer
              as_user_id: "${pet_i1b}"
              captures: { plan_i1b: "$.data.id" }
            - call: "POST /v1/autoship-plans/${plan_i1}/items"
              payload: { product_id: "${prod_i1}", cadence_days: 14, default_quantity: 1 }
