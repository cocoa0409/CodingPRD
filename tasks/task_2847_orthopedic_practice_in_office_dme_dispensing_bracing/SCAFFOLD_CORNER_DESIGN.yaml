      - name: corner_dispense_freshness_gates_and_their_priority_order_rejected
        claim_type: Priority Ordering
        grounds:
          - validations[priority=35]
          - validations[priority=41]
          - validations[priority=43]
          - errors[ERR_MEDICAL_NECESSITY_MISSING]
          - errors[ERR_COVERAGE_VERIFICATION_EXPIRED]
          - errors[ERR_PRIOR_AUTH_REQUIRED]
          - endpoints[POST /dme/encounters/{id}/dispense]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Three time- and paperwork-sensitive dispense gates on two encounters
          that were both perfectly dispensable on 2026-08-01, plus the
          ordering between two of them. The authorization gate (priority 43)
          fires with no clock movement at all: the product requires prior
          authorization and none was ever requested, so financial_status is
          the ordinary VERIFIED and only the product flag distinguishes it.
          Ten days later the 5-day verification on the other encounter has
          lapsed (priority 41). Ninety-two days later BOTH the note (priority
          35, MN_NOTE_VALIDITY_DAYS 90) and the verification are stale, and
          the response is ERR_MEDICAL_NECESSITY_MISSING -- the lower priority
          number wins, so a caller who re-verifies coverage first would still
          be blocked and learns nothing.
        test_recipe:
          setup:
