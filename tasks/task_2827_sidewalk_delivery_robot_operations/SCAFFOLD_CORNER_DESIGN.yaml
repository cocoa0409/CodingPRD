            - call: "POST /delivery-missions/${mi}/load"
              payload: { actual_payload_liters: 22.0, lid_seal_confirmed: true }
              as: MerchantOperator
              as_user_id: "${m}"
              captures: { mi_v: $.data.version, lid: $.data.lid_access_code }
            - call: "POST /route-plans"
              payload: { mission_id: "${mi}", segment_sequence: ["${s1}", "${s2}", "${s3}", "${s5}"], expected_delivery_mission_version: "${mi_v}" }
              as: FleetDispatcher
              captures: { p: $.data.id }
            - call: "POST /route-plans/${p}/transitions"
              payload: { action: "VALIDATE" }
              as: FleetDispatcher
            - call: "POST /route-plans/${p}/transitions"
              payload: { action: "ACTIVATE" }
              as: FleetDispatcher
            - call: "POST /delivery-missions/${mi}/transitions"
              payload: { action: "DEPART" }
              as: FleetDispatcher
          trigger:
            - call: "POST /delivery-missions/${mi}/transitions"
              payload: { action: "ARRIVE" }
              as: FleetDispatcher
            - call: "GET /delivery-missions/${mi}"
              as: MerchantOperator
              as_user_id: "${m}"
            - call: "GET /delivery-missions?mission_state=HANDOFF_READY"
              as: FleetDispatcher
            - call: "GET /delivery-missions?mission_state=EN_ROUTE"
              as: FleetDispatcher
            - call: "GET /delivery-missions/${mi}"
              as: FleetDispatcher
          assert:
            - "the ARRIVE returns 200 with data.mission_state == HANDOFF_READY and data.version == 5"
            - "the single read immediately after reports mission_state == HANDOFF_READY and version == 5"
            - "the HANDOFF_READY listing returns exactly 1 row whose id is ${mi} and total_count == 1"
            - "the EN_ROUTE listing returns 0 rows and total_count == 0"
            - "the repeated single read still reports version == 5, so neither read mutated the row"
            - "GET /delivery-missions?robot_id=${r} returns the same row with the same version"
      - name: a_rejected_write_advances_no_version_anywhere
        claim_type: atomicity
        grounds:
          - "validations[priority=53]"
          - "errors.ERR_ROBOT_NOT_AVAILABLE"
          - "common_fields_contract.version_semantics"
          - "state_machines.Robot.AVAILABLE_to_ON_MISSION"
        distinguishing_aspect: >-
          A refused write is a no-op across every row it would have touched, not a partial one: dispatching
          an OFFLINE robot is 409 ERR_ROBOT_NOT_AVAILABLE, and afterwards the order version, the robot
          version and the zone version are all exactly what they were before the call, no mission row
          exists, and the zone's on_mission_robot_count is still 0 - then the same dispatch with the
          AVAILABLE robot moves all three at once.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with on_mission_robot_count 0, its version captured into zv"
            - "Robot R1 is AVAILABLE and NOMINAL; Robot RBT-OFF was created but never staged, so it is OFFLINE and NOMINAL, with its version captured into roff_v"
            - "order O1 is RECEIVED at version 1, captured into o_v"
            - "no DeliveryMission exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 3.0, sightline_m: 40.0, pedestrian_flow_per_min: 6.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S2", segment_type: "CROSSING", crossing_control: "SIGNALIZED", length_m: 14.0, measured_clearance_cm: 150.0, surface_grade_pct: 1.5, sightline_m: 35.0, pedestrian_flow_per_min: 10.0, curb_ramp_present: true, connected_segment_ids: ["${s1}"] }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S3", segment_type: "WALKWAY", length_m: 260.0, measured_clearance_cm: 104.0, surface_grade_pct: 4.0, sightline_m: 25.0, pedestrian_flow_per_min: 12.0, curb_ramp_present: false, connected_segment_ids: ["${s2}"] }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S5", segment_type: "WALKWAY", length_m: 180.0, measured_clearance_cm: 92.0, surface_grade_pct: 6.5, sightline_m: 30.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true, connected_segment_ids: ["${s3}"] }
              as: PlatformAdmin
              captures: { s5: $.data.id }
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s5}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /merchants"
              payload: { zone_id: "${z}", name: "Corner Bakery", handoff_sla_seconds: 300, merchant_grade: "PREFERRED" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /merchants/${m}/integration-transitions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
