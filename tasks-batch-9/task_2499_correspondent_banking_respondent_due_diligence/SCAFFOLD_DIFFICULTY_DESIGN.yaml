      - name: interval_overlap_constraint_error_outranks_the_aggregate_ceiling_fiscal_error
        grounds:
          - validations[priority=37]
          - validations[priority=42]
          - calculations.monitoring_threshold_calibration
          - concurrency_rules[monitoring-profile-create-stale-respondent]
          - state_machines.TransactionMonitoringProfile.PROVISIONAL_to_CALIBRATED
        distinguishing_aspect: |
          PRECEDENCE PAIR P3 on a different category pair from P1 - business_constraint at priority
          37 (409) against business_fiscal at priority 42 (422). One payload carries both defects:
          an interval that merely touches an existing profile's effective_to (adjacency IS overlap
          under CLOSED semantics) and corridor totals that will blow the aggregate ceiling. The
          create must answer 409 ERR_MONITORING_INTERVAL_OVERLAP and persist nothing, and only
          after the interval is moved clear does the fiscal error surface - at calibration, not at
          creation - even though each corridor threshold was individually clamped to the 500000000.00
          per-corridor ceiling first.
        test_recipe:
          setup: >
            Logical clock stays at 2026-08-01T00:00:00Z. JurisdictionProfile DE with
            corridor_risk_weight 0.50 (basel 4.0 -> jurisdiction_risk_points 8.00, PERMITTED,
            max_permitted_risk_rating HIGH). One respondent home DE with
            expected_monthly_volume_usd 200000000.00 and expected_monthly_count 5000,
            nested_activity_permitted false, licensed ACTIVE/GOOD_STANDING, one VERIFIED non-PEP
            natural-person owner at 80.00% in DE, eight self_rating=4 rows -> control_score 80.00,
            control_credit 0.3375; inherent_risk_score is 8.00 + 0 + 0 + min(16, 14) = 22.00 and
            residual_risk_score round(round(22.00*0.6625,2)+0.00,2) = round(14.575 -> 14.58, 2) =
            14.58, so the rating is LOW and rating_factor is 1.30. One monitoring profile already
            exists over the CLOSED interval [2026-01-01, 2026-06-30] with a single small DE corridor
            at 1000000.00 / 100 and tolerance_pct 0.10, CALIBRATED to usd_threshold
            1000000.00*1.10*1.30/0.50 = 2860000.00, count_threshold ceil(286.0) = 286,
            aggregate_usd_threshold 3146000.00 and hold_threshold_usd 314600.00. The respondent's
            current version is captured last so the same value can be replayed by both create
            attempts.
          setup_api_calls:
            - { call: "POST /correspondent-banking/jurisdiction-profiles", payload: { jurisdiction_code: "DE", name: "Germany", basel_aml_index: 4.0, corridor_risk_weight: 0.50, sanctions_status: "PERMITTED", fatf_listing: "NONE", secrecy_flag: false, max_permitted_risk_rating: "HIGH" }, as: PlatformAdmin }
            - { call: "POST /correspondent-banking/respondents", payload: { legal_name: "Nordsee Clearing AG", swift_bic: "NRDSDEFFXXX", home_jurisdiction_code: "DE", relationship_manager_user_id: "user-rm-01", expected_monthly_volume_usd: 200000000.00, expected_monthly_count: 5000, nested_activity_permitted: false }, as: FIGRelationshipManager, as_user_id: "user-rm-01", captures: { e_id: $.data.id } }
            - { call: "POST /correspondent-banking/respondents/${e_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${e_id}/beneficial-owners", payload: { owner_name: "Ulrich Sand", owner_type: "NATURAL_PERSON", ownership_pct: 80.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { e_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${e_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${e_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { ev0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${e_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${ev0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${e_id}", captures: { eq_id: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 4 }, as: RespondentContact, as_user_id: "${e_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 4 }, as: RespondentContact, as_user_id: "${e_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/control-assessments", payload: { control_domain: "TRANSACTION_MONITORING", self_rating: 4 }, as: RespondentContact, as_user_id: "${e_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${eq_id}/control-assessments", payload: { control_domain: "SANCTIONS_SCREENING", self_rating: 4 }, as: RespondentContact, as_user_id: "${e_id}" }
