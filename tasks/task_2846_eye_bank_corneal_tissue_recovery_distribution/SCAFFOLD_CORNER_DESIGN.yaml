            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "NEXT_OF_KIN", consent_scope: "TRANSPLANT_ONLY", authorizing_party_name: "Aunt Mirela" }
              as: EyeBankCoordinator
              captures: { v_after_consent: $.data.version, obtained: $.data.consent_obtained_at }
          trigger:
            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "FIRST_PERSON", consent_scope: "TRANSPLANT_AND_RESEARCH", authorizing_party_name: "Donor Registry" }
              as: EyeBankCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "${err} == \"ERR_DONOR_STATE_INVALID\""
            - "${v_after_consent} == 3 and ${obtained} == \"2026-08-03T06:00:00.000Z\""
            - "Donor.${donor_id}.consent_type == \"NEXT_OF_KIN\" and Donor.${donor_id}.consent_scope == \"TRANSPLANT_ONLY\" and Donor.${donor_id}.authorizing_party_name == \"Aunt Mirela\" and Donor.${donor_id}.version == 3"

      - name: approve_recovery_on_a_ruled_out_donor_yields_err_donor_state_invalid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Donor.terminal_states
          - state_machines.Donor.CONSENT_OBTAINED_to_RULED_OUT
