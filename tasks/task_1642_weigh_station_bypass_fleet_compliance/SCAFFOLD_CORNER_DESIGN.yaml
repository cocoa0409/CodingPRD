          assert:
            - "POST /api/vehicles 201 response carries the full stored row (id, service_status IN_SERVICE, created_at, version 1)"
            - "immediate GET /api/vehicles?carrier_id returns exactly 1 row with vin == VIN-0001 and id == ${veh_id}"

  - section: errors
    instances:
      - name: err_override_window_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_OVERRIDE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: override_windows_half_open_adjacency
          rationale: "Asserted as the rejection path (o3) of the named Rule-8 instance."
      - name: err_subscription_window_overlap_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SUBSCRIPTION_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: subscription_windows_closed_interval_adjacency
          rationale: "Asserted as the adjacency-rejection path of the named Rule-8 instance, and again as the winning error in subscription_create_temporal_vs_fiscal_rejected."
      - name: err_segregation_of_duties_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=19]
        excluded_because:
          difficulty_instance: dispute_appeal_cycle_with_sod
          rationale: "Asserted as the same-officer appeal rejection inside the named Rule-3 instance."
      - name: err_carrier_ineligible_for_approval_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CARRIER_INELIGIBLE_FOR_APPROVAL]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: iss_score_74_vs_75_posture_boundary
          rationale: "Asserted as carrier B's failed approval at iss == 75 in the named Rule-6 instance."
      - name: err_carrier_not_bypass_eligible_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CARRIER_NOT_BYPASS_ELIGIBLE]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: credential_activation_safety_vs_fiscal_rejected
          rationale: "Asserted as the winning safety error in the named Rule-5 priority-pair instance."
      - name: err_vehicle_not_in_service_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VEHICLE_NOT_IN_SERVICE]
          - validations[priority=11]
        excluded_because:
          difficulty_instance: credential_activation_depends_on_vehicle_service
          rationale: "Asserted as the failed-activation error in the named Rule-7 instance."
      - name: err_invalid_state_transition_credential_covered
        claim_type: invalid_transition
        grounds:
          - errors[ERR_INVALID_STATE_TRANSITION]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: credential_transition_state_vs_safety_rejected
          rationale: "Asserted as the winning state error (double-activate) in the named Rule-5 instance."
      - name: decision_reason_no_active_credential_covered
        claim_type: violation_to_error
        grounds:
          - calculations.bypass_decision_evaluation
        excluded_because:
          difficulty_instance: decision_engine_branch_precedence_order
          rationale: "NO_ACTIVE_CREDENTIAL is asserted as event e3's reason in the named Rule-2 instance."
      - name: decision_reason_rate_cap_exceeded_covered
        claim_type: violation_to_error
        grounds:
          - calculations.bypass_rate_cap_check
        excluded_because:
          difficulty_instance: rate_cap_self_referential_counter_order
          rationale: "RATE_CAP_EXCEEDED asserted on approaches 1 and 3 in the named Rule-2 instance."
      - name: occ_version_progression_covered
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Carrier.fields.version
        excluded_because:
          difficulty_instance: carrier_suspend_reinstate_cycle
          rationale: "Carrier.version progression to exactly 7 across transitions is asserted in the named Rule-3 instance; stale-version rejection is covered by the three §1.9 OCC instances."
