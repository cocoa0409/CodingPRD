scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trip_provisional_vs_final_fare_diverge
        grounds:
          - calculations.trip_provisional_fare
          - calculations.trip_final_fare
          - entities.Trip.fields.estimated_fare_cents
          - entities.Trip.fields.final_fare_cents
        distinguishing_aspect: |
          On the Trip entity domain, the forward-looking provisional fare (unlock + 15 projected
          minutes, no pauses) differs from the chronological final fare replayed from actual RIDE
          segments: STANDARD provisional = 550 cents, final for a 390s-ride trip = 310 cents.
        test_recipe:
          setup:
            - "STANDARD plan (unlock 100, per_min 30, cap 0, slow_disc 0.50) exists"
            - "RIDE_OK zone exists; one SCOOTER at battery 100 parked in it"
            - "an ACTIVE rider on STANDARD with a funded wallet"
            - "clock at 2026-06-01T00:00:00Z when the trip starts"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Downtown", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-A1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "r1@x.com", full_name: "Rider One", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id, est: $.data.estimated_fare_cents }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:05:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/pause"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:07:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/resume"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:08:30Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { final_fare: $.data.final_fare_cents, bmin: $.data.billable_minutes }
          assert:
            - "Trip.${trip_id}.estimated_fare_cents == 550"
            - "Trip.${trip_id}.billable_minutes == 7"
            - "Trip.${trip_id}.final_fare_cents == 310"
            - "Trip.${trip_id}.estimated_fare_cents != Trip.${trip_id}.final_fare_cents"

      - name: fine_standard_vs_low_income_amount_diverge
        grounds:
          - calculations.fine_amount
          - entities.Fine.fields.amount_cents
          - entities.Plan.fields.code
        distinguishing_aspect: |
          On the Fine entity domain (penalty scoring, distinct from Trip cost accounting), a NO_PARK
          fine is 2500 cents for a STANDARD rider but 1500 cents for a LOW_INCOME rider — same event,
          different conserved amount keyed off the rider's plan.
        test_recipe:
          setup:
            - "STANDARD and LOW_INCOME plans exist; a RIDE_OK zone and a NO_PARK zone exist"
            - "two vehicles parked in the RIDE_OK zone"
            - "rider A on STANDARD; rider B switched to LOW_INCOME via an APPROVED application"
            - "both wallets funded; clock fixed so trips have a few billable minutes"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/plans"
              payload: { code: "LOW_INCOME", unlock_fee_cents: 50, per_minute_cents: 15, daily_cap_cents: 500, slow_zone_discount_pct: 0.50 }
              as: PlatformAdmin
              captures: { li_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Plaza", zone_type: "NO_PARK", priority: 3 }
              as: PlatformAdmin
              captures: { zone_nopark_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-B1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_a_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-B2", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_b_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "a@x.com", full_name: "Rider A", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_a_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "b@x.com", full_name: "Rider B", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_b_id: $.data.id, rider_b_v: $.data.version }
            - call: "POST /api/riders/${rider_a_id}/topup"
              payload: { amount_cents: 10000 }
              as: Rider
              as_user_id: "${rider_a_id}"
            - call: "POST /api/riders/${rider_b_id}/topup"
              payload: { amount_cents: 10000 }
              as: Rider
              as_user_id: "${rider_b_id}"
              captures: { rider_b_v2: $.data.version }
            - call: "POST /api/low-income-applications"
              payload: { rider_id: "${rider_b_id}", household_size: 2, annual_income_cents: 4000000 }
              as: Rider
              as_user_id: "${rider_b_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /api/low-income-applications/${app_b_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/riders/${rider_b_id}/change-plan"
              payload: { plan_id: "${li_plan_id}", expected_rider_version: "${rider_b_v2}" }
              as: Rider
              as_user_id: "${rider_b_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_a_id}", vehicle_id: "${veh_a_id}" }
              as: Rider
              as_user_id: "${rider_a_id}"
              captures: { trip_a_id: $.data.id }
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_b_id}", vehicle_id: "${veh_b_id}" }
              as: Rider
              as_user_id: "${rider_b_id}"
              captures: { trip_b_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T01:02:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_a_id}/end"
              payload: { end_zone_id: "${zone_nopark_id}" }
              as: Rider
              as_user_id: "${rider_a_id}"
            - call: "POST /api/trips/${trip_b_id}/end"
              payload: { end_zone_id: "${zone_nopark_id}" }
              as: Rider
              as_user_id: "${rider_b_id}"
            - call: "GET /api/fines?rider_id=${rider_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { fine_a_amount: "$.data[0].amount_cents" }
            - call: "GET /api/fines?rider_id=${rider_b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { fine_b_amount: "$.data[0].amount_cents" }
          assert:
            - "Fine for rider A (STANDARD) amount_cents == 2500"
            - "Fine for rider B (LOW_INCOME) amount_cents == 1500"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: final_fare_tiered_with_cap_and_slow_branch
        grounds:
          - calculations.trip_final_fare
          - entities.Plan.fields.daily_cap_cents
          - entities.Plan.fields.slow_zone_discount_pct
          - entities.TripSegment.fields.zone_id
        distinguishing_aspect: |
          Mode (a): >=3 inputs (unlock_fee, per_minute, billable_minutes, slow share, daily_cap) with a
          conditional branch on SLOW-zone segments and a nested min() against the daily cap. A wholly-SLOW
          6-minute STANDARD trip = unlock 100 + round(6*30*0.5)=90 => 190, NOT the 280 a non-slow trip costs.
        test_recipe:
          setup:
            - "STANDARD plan with slow_zone_discount_pct 0.50, cap 0"
            - "a SLOW zone exists; one vehicle parked in the SLOW zone"
            - "rider on STANDARD with funded wallet; clock fixed for a 360s ride"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0.50 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Slow Park", zone_type: "SLOW", priority: 4, max_speed_kph: 10 }
              as: PlatformAdmin
              captures: { zone_slow_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "OK", zone_type: "RIDE_OK", priority: 6 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-C1", battery_pct: 100, current_zone_id: "${zone_slow_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "c@x.com", full_name: "Rider C", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:06:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { final_fare: $.data.final_fare_cents, bmin: $.data.billable_minutes }
          assert:
            - "Trip.${trip_id}.billable_minutes == 6"
            - "Trip.${trip_id}.final_fare_cents == 190"

      - name: billable_minutes_sum_seconds_then_ceil_rounding_order
        grounds:
          - calculations.trip_billable_minutes
          - entities.TripSegment.fields.duration_seconds
          - entities.Trip.fields.billable_minutes
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Two RIDE segments of 70s and 70s. The PINNED order
          sum-seconds-then-ceil gives ceil((70+70)/60) = ceil(140/60) = 3 billable minutes, whereas the
          rejected ceil-each-then-sum order would give ceil(70/60)+ceil(70/60) = 2+2 = 4 — the two orders
          disagree, so the scaffold's choice is observable. Fare = 100 + 3*30 = 190.
        test_recipe:
          setup:
            - "STANDARD plan (unlock 100, per_min 30) exists; RIDE_OK zone; vehicle parked there"
            - "rider on STANDARD with funded wallet"
            - "trip ridden 70s, paused, resumed, ridden 70s more (two RIDE segments of 70s each)"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core2", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-D1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "d@x.com", full_name: "Rider D", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:01:10Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/pause"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:03:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/resume"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:04:10Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_ok_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { bmin: $.data.billable_minutes, final_fare: $.data.final_fare_cents }
          assert:
            - "Trip.${trip_id}.billable_minutes == 3"
            - "Trip.${trip_id}.final_fare_cents == 190"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: trip_active_paused_cycle_repeats
        grounds:
          - state_machines.Trip.ACTIVE_to_PAUSED
          - state_machines.Trip.PAUSED_to_ACTIVE
          - entities.Trip.fields.status
        distinguishing_aspect: |
          On the Trip entity, ACTIVE<->PAUSED is a true cycle: pause then resume then pause again all
          succeed, and the trip ends back ACTIVE before completion — a linear pipeline could not revisit
          ACTIVE after PAUSED.
        test_recipe:
          setup:
            - "STANDARD plan, RIDE_OK zone, vehicle, funded ACTIVE rider; an ACTIVE trip"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core3", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-E1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "e@x.com", full_name: "Rider E", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:02:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/pause"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:03:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/resume"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:04:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/trips/${trip_id}/pause"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { status_after_2nd_pause: $.data.status }
          assert:
            - "Trip.${trip_id}.status == PAUSED after the second pause"

      - name: fine_disputed_branches_to_waived_or_pending
        grounds:
          - state_machines.Fine.PENDING_to_DISPUTED
          - state_machines.Fine.DISPUTED_to_PENDING
          - state_machines.Fine.DISPUTED_to_WAIVED
          - entities.Fine.fields.settlement_status
        distinguishing_aspect: |
          On the Fine entity (different entity than Trip), DISPUTED branches to two states with divergent
          side effects — reject-dispute returns it to PENDING with no wallet change, whereas waive moves it
          to WAIVED and issues a FINE_REFUND; PENDING<->DISPUTED is also a cycle.
        test_recipe:
          setup:
            - "a rider with a PENDING NO_PARK fine of 2500 cents already disputed once and rejected back to PENDING, then disputed again"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { std_plan_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "Core4", zone_type: "RIDE_OK", priority: 5 }
              as: PlatformAdmin
              captures: { zone_ok_id: $.data.id }
            - call: "POST /api/zones"
              payload: { name: "NoPark4", zone_type: "NO_PARK", priority: 3 }
              as: PlatformAdmin
              captures: { zone_nopark_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-F1", battery_pct: 100, current_zone_id: "${zone_ok_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /api/riders"
              payload: { email: "f@x.com", full_name: "Rider F", plan_id: "${std_plan_id}" }
              as: Anonymous
              captures: { rider_id: $.data.id }
            - call: "POST /api/riders/${rider_id}/topup"
              payload: { amount_cents: 5000 }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/trips"
              payload: { rider_id: "${rider_id}", vehicle_id: "${veh_id}" }
              as: Rider
              as_user_id: "${rider_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:01:30Z" }
              as: PlatformAdmin
            - call: "POST /api/trips/${trip_id}/end"
              payload: { end_zone_id: "${zone_nopark_id}" }
              as: Rider
              as_user_id: "${rider_id}"
            - call: "GET /api/fines?rider_id=${rider_id}"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
              captures: { fine_id: "$.data[0].id" }
            - call: "POST /api/fines/${fine_id}/dispute"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
            - call: "POST /api/fines/${fine_id}/reject-dispute"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/fines/${fine_id}/dispute"
              payload: {}
              as: Rider
              as_user_id: "${rider_id}"
          trigger:
            - call: "POST /api/fines/${fine_id}/waive"
              payload: {}
              as: PlatformAdmin
              captures: { final_status: $.data.settlement_status }
          assert:
            - "Fine.${fine_id}.settlement_status == WAIVED"
            - "Rider.${rider_id}.outstanding_fine_cents == 0 after waive"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trip_end_in_no_park_charges_then_fines_then_debits_wallet
        grounds:
          - state_machines.Trip.ACTIVE_to_COMPLETED
          - entities.Fine.fields.amount_cents
          - entities.WalletTransaction.fields.txn_type
          - entities.Rider.fields.wallet_balance_cents
          - entities.Rider.fields.outstanding_fine_cents
        distinguishing_aspect: |
          Depth-3 chain originating from POST /trips/{id}/end in a NO_PARK zone: end -> Trip COMPLETED and
          TRIP_CHARGE debit (link1) -> link2 creates the Fine because the end zone is NO_PARK -> link3 the
          Fine's creation issues a FINE_CHARGE debit and raises outstanding_fine_cents. Each link is caused
          by the prior link, not directly by the end call.
        test_recipe:
          setup:
            - "STANDARD plan; RIDE_OK and NO_PARK zones; vehicle; rider with wallet 5000"
            - "an ACTIVE trip ridden 90s (2 billable minutes -> fare 100 + 2*30 = 160)"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
