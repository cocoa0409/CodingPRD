            - "The re-finalize does NOT reopen ${case1}: GET /escalation-cases?prior_case_id=${case1} returns exactly 1 row, a NEW case whose stage == 'WRITTEN_WARNING', opened_pressure == 4.00 and prior_case_id == ${case1}"
