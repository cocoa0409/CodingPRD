          - calculations.deposit_refund
          - entities.PermitApplication.fields.deposit_held_cents
          - entities.PermitApplication.fields.deposit_refund_cents
          - entities.LedgerEntry.fields.direction
          - state_machines.PermitApplication.WRAP_REQUESTED_to_WRAPPED
        distinguishing_aspect: "Monetary conserved quantity: deposit_held_cents == sum(DEPOSIT DEBIT) - sum(REFUND CREDIT). Paying 8240 then refunding 6240 leaves 2000 held, exactly the retained damage+penalty — no drift."
        test_recipe:
