      - name: corner_readiness_assessment_is_idempotent_across_two_runs
        claim_type: input_set_filtering
        grounds: ["calculations.readiness_assessment_gap_synthesis", "entities.Gap.fields.source", "calculations.gap_debt_points"]
        distinguishing_aspect: "The idempotence guard skips a control or criterion that already carries a non-settled READINESS_ASSESSMENT gap, so running the assessment twice leaves exactly 2 gaps (one control-anchored HIGH, one criterion-anchored HIGH) and gap_debt_points at 18.40 rather than doubling to 36.80."
        test_recipe:
          setup:
            - "Engagement 'Twice' is in READINESS with criterion CC1.1 in scope and control U-01 carrying no mappings, so primary_mapping_count is 0 and CC1.1 is uncovered."
          setup_api_calls:
            - call: "POST /soc/trust-criteria"
