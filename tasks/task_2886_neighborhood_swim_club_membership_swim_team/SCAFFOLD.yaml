  # --- PartyReservation -------------------------------------------------------
  - method: POST
    path: "/swim-club/party-reservations"
    description: "Request a private party in a facility zone. Prices the booking per calculations.party_reservation_charge and books the charge on the household immediately."
    roles: [Member, PoolManager]
    code: 201
    input: [membership_id, zone, start_iso, end_iso, guest_count, host_party_size]
    output: PartyReservation
    side_effects: ["status := REQUESTED", "projected_bather_load, duration_hours_ceil, required_guard_count, base_facility_fee_cents, guest_overage_fee_cents, lifeguard_surcharge_cents, subtotal_cents, member_discount_cents and total_charge_cents all set by the nine pinned steps", "refunded_cents := 0", "household.party_charges_owed_cents += total_charge_cents", "household.version += 1"]

  - method: POST
    path: "/swim-club/party-reservations/{id}/transitions"
    description: "Move a reservation to CONFIRMED, REJECTED, COMPLETED or CANCELLED_BY_HOST. Confirmation re-checks the guard ratio for the whole window."
    roles: [PoolManager, Member]
    code: 200
    input: [to_status]
    output: PartyReservation
    side_effects: ["status := to_status when the edge is declared in §1.2", "REJECTED refunds in full; CANCELLED_BY_HOST refunds in full only when the cancellation is at least CANCEL_FULL_REFUND_DAYS (7) days ahead of start_iso, otherwise half", "every refund lowers household.party_charges_owed_cents and raises household.account_credit_cents, then the account-credit auto-apply rule may settle an open membership balance", "household.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/party-reservations/{id}"
    description: "Read one party reservation, including its full price breakdown."
    roles: [PoolManager, Treasurer, BoardPresident, Member]
    code: 200
    input: []
    output: PartyReservation
    side_effects: []

  - method: GET
    path: "/swim-club/party-reservations"
    description: "List party reservations, filterable by membership, zone and status."
    roles: [PoolManager, Treasurer, BoardPresident, Member]
    code: 200
    input: ["membership_id?", "zone?", "status?", "limit?", "offset?"]
    output: PartyReservation[]
    side_effects: []

  # --- InspectionFinding ------------------------------------------------------
  - method: POST
    path: "/swim-club/inspection-findings"
    description: "Record a health-department inspection finding against a season. A CRITICAL finding closes the facility immediately and starts the closure cascade."
    roles: [HealthInspector]
    code: 201
    input: [season_id, inspected_on, inspector_name, finding_code, severity, narrative]
    output: InspectionFinding
    side_effects: ["status := OPEN", "recorded_by_user_id := X-User-ID", "reopen_count := 0", "calculations.facility_posture_derivation runs, which may set season.facility_posture := CLOSED or RESTRICTED", "a move to CLOSED cancels every future REQUESTED/CONFIRMED PartyReservation of the season as CANCELLED_BY_CLOSURE, credits each household and may auto-settle a membership balance", "season.version += 1"]

  - method: POST
    path: "/swim-club/inspection-findings/{id}/transitions"
    description: "Submit a remediation, reopen a rejected remediation, or verify and close the finding. Verification requires a different user than the recorder."
    roles: [HealthInspector, PoolManager]
    code: 200
    input: [to_status, "remediation_note?"]
    output: InspectionFinding
    side_effects: ["status := to_status when the edge is declared in §1.2", "REMEDIATION_SUBMITTED records remediation_note and remediation_submitted_at; REOPENED raises reopen_count; VERIFIED_CLOSED records verified_by_user_id", "calculations.facility_posture_derivation re-runs on every edge, and VERIFIED_CLOSED of the last CRITICAL finding reopens the facility", "season.version += 1", "version += 1"]

  - method: GET
    path: "/swim-club/inspection-findings/{id}"
    description: "Read one inspection finding, including its reopen count."
    roles: [HealthInspector, PoolManager, BoardPresident]
    code: 200
    input: []
    output: InspectionFinding
