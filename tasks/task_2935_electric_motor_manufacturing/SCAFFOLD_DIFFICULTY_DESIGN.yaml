            - "${below_unit_standard} == 152500"
            - "a strict > comparison would price the 12-unit work order at overhead 330000 / standard 1830000; that answer must not appear"

      - name: surge_insulation_margin_exactly_zero_accepted_one_hundredth_below_rejected
        grounds:
          - calculations.stator_surge_envelope
          - errors[ERR_SURGE_MARGIN_NEGATIVE]
          - endpoints[POST /stator-builds/{id}/surge-test]
          - state_machines.StatorBuild.IMPREGNATED_to_SURGE_TESTED
        distinguishing_aspect: |
          A third boundary flavour: a two-sided inclusive window at two decimal places, where the
          lower edge is itself a rounded intermediate. required_surge_kv for a 400 V class-F
          stator is round_half_up((2.0 * 400 + 1000) * 1.15 / 1000, 2) == 2.07, so an applied
          2.07 gives insulation_margin_kv exactly 0.00 and PASSES, while 2.06 gives -0.01 and
          raises ERR_SURGE_MARGIN_NEGATIVE. The margin is stored, so the accepted call must
          persist 0.00 rather than a null or a negative-zero artefact.
        test_recipe:
          setup:
            - "Design D1 RELEASED (rated_voltage_v 400, insulation_class F); order confirmed; WO1 open."
            - "StatorBuild sb1 on WO1 impregnated with VPI, 2 cycles, cure 165.0 C in OVEN-A."
