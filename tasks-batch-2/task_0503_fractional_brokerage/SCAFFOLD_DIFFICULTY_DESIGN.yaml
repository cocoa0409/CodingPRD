# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Commission-Free Fractional Brokerage (task_0503)
# 9 rule_ids, 2 instances each = 18 difficulty instances.
# Every grounds[] resolves to SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls chain
# is empty-DB executable; every formula-derived assert is a pre-computed literal.
# Clock default = 2026-01-01T00:00:00Z (POST /_clock/advance).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: cost basis FIFO vs AVERAGE (Position/Lot domain) ------
      - name: cost_basis_fifo_vs_average_divergence
        grounds:
          - calculations.cost_basis_disposal
          - entities.Position.fields.cost_basis_method
          - entities.Disposal.fields.realized_pl_cents
          - state_machines.Order.ACCEPTED_to_FILLED
        distinguishing_aspect: |
          On identical lots (2sh@5000c + 3sh@6000c) and an identical SELL of 4sh@7000c, FIFO yields
          realized_pl_cents=6000 (cost_basis 22000) while AVERAGE yields realized_pl_cents=5600
          (cost_basis 22400) — the divergence lives on the Position/Lot domain, distinct from the
          Account-domain buying_power instance below.
        test_recipe:
          setup:
            - "Security ACME (EQUITY, last_price 10000c, fractional_enabled true)."
            - "CASH account A_FIFO funded and settled with $300.00 buying power; Position on ACME with cost_basis_method=FIFO holding lots 2sh@5000c then 3sh@6000c."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "ACME", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_acme: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "fifo@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_fifo: $.data.id }
            - call: "POST /accounts/${acc_fifo}/deposits"
              payload: { amount_cents: 5000000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_fifo}"
            - call: "GET /accounts/${acc_fifo}"
              as: AccountHolder
              as_user_id: "${acc_fifo}"
              captures: { v_fifo_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_fifo}", security_id: "${sec_acme}", side: "BUY", order_type: "MARKET", quantity: 2, expected_account_version: "${v_fifo_1}" }
              as: AccountHolder
              as_user_id: "${acc_fifo}"
              captures: { ord_b1: $.data.id }
            - call: "POST /orders/${ord_b1}/fills"
              payload: { fill_quantity: 2, fill_price_cents: 5000 }
              as: ClearingSystem
            - call: "GET /accounts/${acc_fifo}"
              as: AccountHolder
              as_user_id: "${acc_fifo}"
              captures: { v_fifo_2: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_fifo}", security_id: "${sec_acme}", side: "BUY", order_type: "MARKET", quantity: 3, expected_account_version: "${v_fifo_2}" }
              as: AccountHolder
              as_user_id: "${acc_fifo}"
              captures: { ord_b2: $.data.id }
            - call: "POST /orders/${ord_b2}/fills"
              payload: { fill_quantity: 3, fill_price_cents: 6000 }
              as: ClearingSystem
            - call: "GET /accounts/${acc_fifo}"
              as: AccountHolder
              as_user_id: "${acc_fifo}"
              captures: { v_fifo_3: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_fifo}", security_id: "${sec_acme}", side: "SELL", order_type: "MARKET", quantity: 4, is_closing: true, expected_account_version: "${v_fifo_3}" }
              as: AccountHolder
              as_user_id: "${acc_fifo}"
              captures: { ord_s: $.data.id }
            - call: "POST /orders/${ord_s}/fills"
              payload: { fill_quantity: 4, fill_price_cents: 7000 }
              as: ClearingSystem
              captures: { fill_s: $.data.id }
          assert:
            - "GET /positions/{position_id} for (acc_fifo, ACME): realized_pl_cents == 6000"
            - "GET /positions/{id}/disposals total proceeds_cents == 28000 and total cost_basis_cents == 22000"
            - "First disposal lot_id is the 2sh@5000c lot (oldest acquired_at), second disposal consumes 2sh of the 3sh@6000c lot"

      # ---- Instance 2: buying power CASH vs MARGIN (Account domain) ----------
      - name: buying_power_cash_vs_margin_divergence
        grounds:
          - calculations.buying_power
          - entities.Account.fields.account_type
          - entities.Account.fields.buying_power_cents
          - state_machines.Account.trading_status
        distinguishing_aspect: |
          A CASH account funded with a $5000.00 instant deposit shows buying_power_cents=500000
          (settled_cash + instant_credit), whereas a MARGIN account with identical $5000.00 settled
          equity and no positions shows buying_power_cents=1000000 (2x leverage on maintenance excess) —
          the variant divergence is on the Account domain, distinct from the Position/Lot cost-basis instance.
        test_recipe:
          setup:
            - "CASH account A_CASH with a $5000.00 PENDING instant deposit (instant_credit_cents=500000, settled_cash=0)."
            - "MARGIN account A_MARGIN with a $5000.00 deposit SETTLED after clock advances to T+1 (settled_cash=500000), no positions."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "cash@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_cash: $.data.id }
            - call: "POST /accounts/${acc_cash}/deposits"
              payload: { amount_cents: 500000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_cash}"
            - call: "POST /accounts"
              payload: { holder_email: "margin@x.com", account_type: "MARGIN" }
              as: AccountHolder
              captures: { acc_margin: $.data.id }
            - call: "POST /accounts/${acc_margin}/deposits"
              payload: { amount_cents: 500000, instant_eligible: false }
              as: AccountHolder
              as_user_id: "${acc_margin}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ClearingSystem
          trigger:
            - call: "GET /accounts/${acc_cash}"
              as: AccountHolder
              as_user_id: "${acc_cash}"
            - call: "GET /accounts/${acc_margin}"
              as: AccountHolder
              as_user_id: "${acc_margin}"
          assert:
            - "Account.${acc_cash}.buying_power_cents == 500000 (CASH: settled_cash 0 + instant_credit 500000)"
            - "Account.${acc_margin}.buying_power_cents == 1000000 (MARGIN: 2 * (equity 500000 - maintenance 0))"
            - "Account.${acc_margin}.account_equity_cents == 500000 and Account.${acc_cash}.settled_cash_cents == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Mode (a): nonlinear multi-input — options suitability ------------
      - name: options_suitability_nonlinear_networth_gate
        grounds:
          - calculations.options_suitability
          - entities.OptionsApproval.fields.granted_level
          - state_machines.OptionsApproval.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): granted_level = min(requested, base_cap) where base_cap nests three inputs —
          experience(>=3) AND net_worth(>=10000000) for level 3, else experience tiers. exp=4 with
          net_worth=8000000 caps at 2 (the net-worth gate trips only at the level-3 boundary), so a
          requested_level=3 grants 2 — a non-linear interaction of three inputs, not a tiered single metric.
        test_recipe:
          setup:
            - "CASH account A_OPT exists. ComplianceOfficer will decide its options application."
            - "OptionsApproval requesting level 3 with stated_experience_years=4, liquid_net_worth_cents=8000000 (below the $100,000 level-3 floor)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "opt@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_opt: $.data.id }
            - call: "POST /options-approvals"
              payload: { account_id: "${acc_opt}", requested_level: 3, stated_experience_years: 4, liquid_net_worth_cents: 8000000 }
              as: AccountHolder
              as_user_id: "${acc_opt}"
              captures: { appr_opt: $.data.id }
            - call: "GET /accounts/${acc_opt}"
              as: ComplianceOfficer
              captures: { v_opt: $.data.version }
          trigger:
            - call: "POST /options-approvals/${appr_opt}/decide"
              payload: { decision: "APPROVE", expected_account_version: "${v_opt}" }
              as: ComplianceOfficer
          assert:
            - "OptionsApproval.${appr_opt}.granted_level == 2 (net-worth gate caps level 3 down to 2)"
            - "OptionsApproval.${appr_opt}.status == APPROVED"
            - "Account.${acc_opt}.options_level == 2"

      # ---- Mode (b): order-dependent rounding — DRIP reinvest residual ------
      - name: drip_reinvest_truncate_then_round_residual
        grounds:
          - calculations.drip_reinvest
          - entities.DividendEvent.fields.reinvest_quantity
          - entities.DividendEvent.fields.residual_cash_cents
          - state_machines.DividendEvent.PAID_to_REINVESTED
        distinguishing_aspect: |
          Mode (b): the pinned rounding order (round gross dividend -> truncate shares to 6dp -> round spend)
          on gross=5000c at last_price=3000000c yields reinvest_quantity=0.001666, spent=4998, and
          residual_cash_cents=2; the alternative "round shares" order would over-buy and leave a negative
          residual — order of rounding changes the cents, so this is mode (b), not mode (a).
        test_recipe:
          setup:
            - "Security HIGHCO (EQUITY, last_price 3000000c). CASH account A_DRIP holds 100 shares of HIGHCO with DRIP enabled."
            - "A cash dividend of 50c/share is ANNOUNCED then PAID for that position (gross_amount_cents=5000)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "HIGHCO", instrument_type: "EQUITY", last_price_cents: 3000000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_high: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "drip@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_drip: $.data.id }
            - call: "POST /accounts/${acc_drip}/deposits"
              payload: { amount_cents: 400000000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_drip}"
            - call: "GET /accounts/${acc_drip}"
              as: AccountHolder
              as_user_id: "${acc_drip}"
              captures: { v_drip_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_drip}", security_id: "${sec_high}", side: "BUY", order_type: "MARKET", quantity: 100, expected_account_version: "${v_drip_1}" }
              as: AccountHolder
              as_user_id: "${acc_drip}"
              captures: { ord_drip: $.data.id }
            - call: "POST /orders/${ord_drip}/fills"
              payload: { fill_quantity: 100, fill_price_cents: 3000000 }
              as: ClearingSystem
              captures: { fill_drip: $.data.id }
            - call: "GET /positions"
              payload: { account_id: "${acc_drip}" }
              as: AccountHolder
              as_user_id: "${acc_drip}"
              captures: { pos_drip: "$.data[0].id" }
            - call: "PATCH /positions/${pos_drip}/drip"
              payload: { drip_enabled: true }
              as: AccountHolder
              as_user_id: "${acc_drip}"
            - call: "POST /dividends"
              payload: { account_id: "${acc_drip}", position_id: "${pos_drip}", rate_per_share_cents: 50, ex_date: "2026-02-01T00:00:00Z" }
              as: ClearingSystem
              captures: { div_drip: $.data.id }
            - call: "POST /dividends/${div_drip}/pay"
              as: ClearingSystem
          trigger:
            - call: "POST /dividends/${div_drip}/reinvest"
              as: ClearingSystem
              captures: { div_state: $.data.status }
          assert:
            - "DividendEvent.${div_drip}.gross_amount_cents == 5000"
            - "DividendEvent.${div_drip}.reinvest_quantity == 0.001666"
            - "DividendEvent.${div_drip}.residual_cash_cents == 2"
            - "DividendEvent.${div_drip}.status == REINVESTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Account.trading_status cyclic posture ---------------------------
      - name: account_trading_status_restricted_then_back_to_active_cycle
        grounds:
          - state_machines.Account.trading_status
          - calculations.maintenance_excess
          - entities.Account.fields.trading_status
        distinguishing_aspect: |
          Account.trading_status is cyclic: a MARGIN account drops to RESTRICTED_CLOSING_ONLY when a quote
          push makes maintenance_excess negative, then returns to ACTIVE when a later quote push restores
          excess>=0 — the same entity revisits ACTIVE (A->B->A), distinct from the DividendEvent branching machine.
        test_recipe:
          setup:
            - "Security MARG (EQUITY, last 10000c, maintenance_rate 2500bps). MARGIN account A_CYC with $5000.00 settled, holding 100 shares of MARG (settled_cash=-500000, mv 1000000, excess 250000, ACTIVE)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "MARG", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: false, maintenance_rate_bps: 2500 }
              as: ClearingSystem
              captures: { sec_marg: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "cyc@x.com", account_type: "MARGIN" }
              as: AccountHolder
              captures: { acc_cyc: $.data.id }
            - call: "POST /accounts/${acc_cyc}/deposits"
              payload: { amount_cents: 500000, instant_eligible: false }
              as: AccountHolder
              as_user_id: "${acc_cyc}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_cyc}"
              as: AccountHolder
              as_user_id: "${acc_cyc}"
              captures: { v_cyc_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_cyc}", security_id: "${sec_marg}", side: "BUY", order_type: "LIMIT", quantity: 100, limit_price_cents: 10000, expected_account_version: "${v_cyc_1}" }
              as: AccountHolder
              as_user_id: "${acc_cyc}"
              captures: { ord_cyc: $.data.id }
            - call: "POST /orders/${ord_cyc}/fills"
              payload: { fill_quantity: 100, fill_price_cents: 10000 }
              as: ClearingSystem
          trigger:
            - call: "PATCH /securities/${sec_marg}/quote"
              payload: { last_price_cents: 4000 }
              as: MarketData
            - call: "GET /accounts/${acc_cyc}"
              as: AccountHolder
              as_user_id: "${acc_cyc}"
              captures: { st_low: $.data.trading_status }
            - call: "PATCH /securities/${sec_marg}/quote"
              payload: { last_price_cents: 10000 }
              as: MarketData
            - call: "GET /accounts/${acc_cyc}"
              as: AccountHolder
              as_user_id: "${acc_cyc}"
              captures: { st_back: $.data.trading_status }
          assert:
            - "After quote 4000: Account.${acc_cyc}.maintenance_excess_cents == -200000 and trading_status == RESTRICTED_CLOSING_ONLY"
            - "After quote restored to 10000: Account.${acc_cyc}.maintenance_excess_cents == 250000 and trading_status == ACTIVE (cycle returned)"

      # ---- DividendEvent branching machine ---------------------------------
      - name: dividend_branching_paid_to_reinvested_vs_reversed
        grounds:
          - state_machines.DividendEvent.PAID_to_REINVESTED
          - state_machines.DividendEvent.PAID_to_REVERSED
          - entities.DividendEvent.fields.status
        distinguishing_aspect: |
          DividendEvent forks from PAID into two terminal branches with disjoint side-effect sets:
          REINVESTED opens a Lot and debits settled_cash by (gross - residual), while REVERSED debits
          settled_cash by the full gross — a fork-join branching shape on the DividendEvent entity,
          distinct from the Account cyclic machine.
        test_recipe:
          setup:
            - "Two CASH accounts each holding 10 shares of DIVCO (last 10000c); DRIP enabled on the first position only; a 100c/share dividend is ANNOUNCED then PAID on each (gross_amount_cents=1000)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "DIVCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_div: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "divA@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_dA: $.data.id }
            - call: "POST /accounts/${acc_dA}/deposits"
              payload: { amount_cents: 200000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_dA}"
            - call: "GET /accounts/${acc_dA}"
              as: AccountHolder
              as_user_id: "${acc_dA}"
              captures: { v_dA: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_dA}", security_id: "${sec_div}", side: "BUY", order_type: "MARKET", quantity: 10, expected_account_version: "${v_dA}" }
              as: AccountHolder
              as_user_id: "${acc_dA}"
              captures: { ord_dA: $.data.id }
            - call: "POST /orders/${ord_dA}/fills"
              payload: { fill_quantity: 10, fill_price_cents: 10000 }
              as: ClearingSystem
            - call: "GET /positions"
              payload: { account_id: "${acc_dA}" }
              as: AccountHolder
              as_user_id: "${acc_dA}"
              captures: { pos_dA: "$.data[0].id" }
            - call: "PATCH /positions/${pos_dA}/drip"
              payload: { drip_enabled: true }
              as: AccountHolder
              as_user_id: "${acc_dA}"
            - call: "POST /dividends"
              payload: { account_id: "${acc_dA}", position_id: "${pos_dA}", rate_per_share_cents: 100, ex_date: "2026-03-01T00:00:00Z" }
              as: ClearingSystem
              captures: { div_A: $.data.id }
            - call: "POST /dividends/${div_A}/pay"
              as: ClearingSystem
          trigger:
            - call: "POST /dividends/${div_A}/reinvest"
              as: ClearingSystem
              captures: { st_A: $.data.status }
          assert:
            - "DividendEvent.${div_A}.gross_amount_cents == 1000 and reinvest_quantity == 0.100000 and residual_cash_cents == 0"
            - "DividendEvent.${div_A}.status == REINVESTED (REINVESTED branch reached, not REVERSED)"
            - "A new Lot of 0.1 share exists on position ${pos_dA} (REINVESTED branch side-effect)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- Depth>=3: quote -> position mv -> account maintenance -> margin call/posture
      - name: quote_drop_cascades_to_margin_call_depth3
        grounds:
          - calculations.maintenance_excess
          - entities.Security.fields.last_price_cents
          - entities.Position.fields.market_value_cents
          - entities.Account.fields.maintenance_excess_cents
          - state_machines.Account.trading_status
        distinguishing_aspect: |
          One quote push (trigger A) mutates Position.market_value_cents (link 1), which mutates
          Account.maintenance_excess_cents below zero (link 2 caused by link 1), which permits issuance of
          a MarginCall and flips Account.trading_status to MARGIN_CALL (link 3 caused by link 2) — a depth-3
          chain where each link is caused by the prior one, not by the original quote directly.
        test_recipe:
          setup:
            - "MARGIN account A_CAS holding 100 shares of CASG (last 10000c, maintenance 2500bps), settled_cash=-500000, excess 250000, ACTIVE."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "CASG", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: false, maintenance_rate_bps: 2500 }
              as: ClearingSystem
              captures: { sec_cas: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "cas@x.com", account_type: "MARGIN" }
              as: AccountHolder
              captures: { acc_cas: $.data.id }
            - call: "POST /accounts/${acc_cas}/deposits"
              payload: { amount_cents: 500000, instant_eligible: false }
              as: AccountHolder
              as_user_id: "${acc_cas}"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: ClearingSystem
            - call: "GET /accounts/${acc_cas}"
              as: AccountHolder
              as_user_id: "${acc_cas}"
              captures: { v_cas: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_cas}", security_id: "${sec_cas}", side: "BUY", order_type: "LIMIT", quantity: 100, limit_price_cents: 10000, expected_account_version: "${v_cas}" }
              as: AccountHolder
              as_user_id: "${acc_cas}"
              captures: { ord_cas: $.data.id }
            - call: "POST /orders/${ord_cas}/fills"
              payload: { fill_quantity: 100, fill_price_cents: 10000 }
              as: ClearingSystem
          trigger:
            - call: "PATCH /securities/${sec_cas}/quote"
              payload: { last_price_cents: 4000 }
              as: MarketData
            - call: "POST /accounts/${acc_cas}/margin-calls"
              as: ClearingSystem
              captures: { mc_cas: $.data.id }
            - call: "GET /accounts/${acc_cas}"
              as: AccountHolder
              as_user_id: "${acc_cas}"
              captures: { st_cas: $.data.trading_status }
          assert:
            - "Link 1: Position market_value_cents == 400000 after quote 4000"
            - "Link 2: Account.${acc_cas}.maintenance_excess_cents == -200000"
            - "Link 3: MarginCall.${mc_cas}.deficiency_cents == 200000 and Account.${acc_cas}.trading_status == MARGIN_CALL"

      # ---- Depth>=2: SELL fill -> disposal -> lot remaining -> position recompute
      - name: sell_fill_cascades_disposal_lot_position_depth3
        grounds:
          - state_machines.Order.ACCEPTED_to_FILLED
          - entities.Disposal.fields.realized_pl_cents
          - state_machines.Lot.OPEN_to_PARTIALLY_CLOSED
          - entities.Position.fields.quantity
        distinguishing_aspect: |
          A SELL fill (trigger, different from the quote trigger above) creates a Disposal (link 1); the
          Disposal reduces the consumed Lot.remaining_quantity flipping it OPEN->PARTIALLY_CLOSED (link 2
          caused by link 1); that lot change recomputes Position.quantity and realized_pl_cents (link 3
          caused by link 2) — depth-3 chain from a fill trigger.
        test_recipe:
          setup:
            - "CASH account A_SELL with a Position on SELLCO (last 10000c) holding one lot of 5 sh @ 5000c (FIFO)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "SELLCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_sell: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "sell@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_sell: $.data.id }
            - call: "POST /accounts/${acc_sell}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_sell}"
            - call: "GET /accounts/${acc_sell}"
              as: AccountHolder
              as_user_id: "${acc_sell}"
              captures: { v_sell_1: $.data.version }
            - call: "POST /orders"
              payload: { account_id: "${acc_sell}", security_id: "${sec_sell}", side: "BUY", order_type: "MARKET", quantity: 5, expected_account_version: "${v_sell_1}" }
              as: AccountHolder
              as_user_id: "${acc_sell}"
              captures: { ord_sb: $.data.id }
            - call: "POST /orders/${ord_sb}/fills"
              payload: { fill_quantity: 5, fill_price_cents: 5000 }
              as: ClearingSystem
            - call: "GET /positions"
              payload: { account_id: "${acc_sell}" }
              as: AccountHolder
              as_user_id: "${acc_sell}"
              captures: { pos_sell: "$.data[0].id" }
            - call: "GET /accounts/${acc_sell}"
              as: AccountHolder
              as_user_id: "${acc_sell}"
              captures: { v_sell_2: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_sell}", security_id: "${sec_sell}", side: "SELL", order_type: "MARKET", quantity: 2, is_closing: true, expected_account_version: "${v_sell_2}" }
              as: AccountHolder
              as_user_id: "${acc_sell}"
              captures: { ord_ss: $.data.id }
            - call: "POST /orders/${ord_ss}/fills"
              payload: { fill_quantity: 2, fill_price_cents: 10000 }
              as: ClearingSystem
          assert:
            - "Link 1: one Disposal exists with quantity 2, proceeds_cents 20000, cost_basis_cents 10000, realized_pl_cents 10000"
            - "Link 2: the consumed Lot status == PARTIALLY_CLOSED with remaining_quantity == 3"
            - "Link 3: Position.${pos_sell}.quantity == 3 and Position.${pos_sell}.realized_pl_cents == 10000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- Pair: business_referential (OCC, pri 5) vs business_safety (FROZEN, pri 7)
      - name: occ_stale_beats_frozen_block
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - errors[ERR_ACCOUNT_FROZEN]
        distinguishing_aspect: |
          A single POST /orders that is BOTH stale (expected_account_version one behind, pri 5
          business_referential) AND on a FROZEN account (pri 7 business_safety) returns
          ERR_STALE_ACCOUNT_VERSION (412), proving pri 5 wins — a business_referential vs business_safety
          pairing, distinct from the safety-vs-fiscal pairing below.
        test_recipe:
          setup:
            - "CASH account A_PR funded $1000.00 and then FROZEN by ComplianceOfficer (which bumps version). Client holds a version captured BEFORE the freeze."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "PRCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
              captures: { sec_pr: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "pr@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_pr: $.data.id }
            - call: "POST /accounts/${acc_pr}/deposits"
              payload: { amount_cents: 100000, instant_eligible: true }
              as: AccountHolder
              as_user_id: "${acc_pr}"
            - call: "GET /accounts/${acc_pr}"
              as: AccountHolder
              as_user_id: "${acc_pr}"
              captures: { v_pr_pre: $.data.version }
            - call: "PATCH /accounts/${acc_pr}/compliance-hold"
              payload: { compliance_hold: true }
              as: ComplianceOfficer
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_pr}", security_id: "${sec_pr}", side: "BUY", order_type: "MARKET", quantity: 1, expected_account_version: "${v_pr_pre}" }
              as: AccountHolder
              as_user_id: "${acc_pr}"
              captures: { err_pr: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_ACCOUNT_VERSION (pri 5 beats pri 7 FROZEN)"

      # ---- Pair: business_safety (options level, pri 9) vs business_fiscal (buying power, pri 15)
      - name: options_level_beats_buying_power
        grounds:
          - validations[priority=9]
          - validations[priority=15]
          - errors[ERR_OPTIONS_LEVEL_INSUFFICIENT]
          - errors[ERR_INSUFFICIENT_BUYING_POWER]
        distinguishing_aspect: |
          A single BUY of an OPTION the account is not approved for AND for far more cash than its buying
          power returns ERR_OPTIONS_LEVEL_INSUFFICIENT (409, pri 9) not ERR_INSUFFICIENT_BUYING_POWER (402,
          pri 15) — a business_safety vs business_fiscal pairing, a different error-category pair than the
          referential-vs-safety pairing above.
        test_recipe:
          setup:
            - "CASH account A_OF with $0.00 buying power (no deposit), options_level 0. Security OPT1 is an OPTION requiring options_level 2, last_price 50000c."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "OPT1", instrument_type: "OPTION", last_price_cents: 50000, fractional_enabled: false, required_options_level: 2 }
              as: ClearingSystem
              captures: { sec_opt: $.data.id }
            - call: "POST /accounts"
              payload: { holder_email: "of@x.com", account_type: "CASH" }
              as: AccountHolder
              captures: { acc_of: $.data.id }
            - call: "GET /accounts/${acc_of}"
              as: AccountHolder
              as_user_id: "${acc_of}"
              captures: { v_of: $.data.version }
          trigger:
            - call: "POST /orders"
              payload: { account_id: "${acc_of}", security_id: "${sec_opt}", side: "BUY", order_type: "LIMIT", quantity: 100, limit_price_cents: 50000, expected_account_version: "${v_of}" }
              as: AccountHolder
              as_user_id: "${acc_of}"
              captures: { err_of: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_OPTIONS_LEVEL_INSUFFICIENT (pri 9 beats pri 15 buying power)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      # ---- Boundary 1: PDT equity threshold (>= 2500000 clears) via fills ---
      - name: pdt_equity_exactly_25000_does_not_flag
        grounds:
          - calculations.pdt_day_trade
          - entities.Account.fields.pdt_flagged
          - entities.Account.fields.day_trade_count
          - state_machines.Order.ACCEPTED_to_FILLED
        distinguishing_aspect: |
          With exactly 4 day trades and account_equity_cents == 2500000 (exactly $25,000.00), pdt_flagged
          is FALSE because the rule is equity < PDT_MIN_EQUITY_CENTS (>= clears) — a numeric threshold
          boundary reachable through POST /orders/{id}/fills, distinct from the empty/headroom boundary below.
        test_recipe:
          setup:
            - "CASH account A_PDT funded so account_equity_cents settles to exactly 2500000; four same-day round trips on PDTCO produce day_trade_count==4."
            - "Equity held at exactly 2500000 via settled cash (no open positions after the round trips)."
          setup_api_calls:
            - call: "POST /securities"
              payload: { symbol: "PDTCO", instrument_type: "EQUITY", last_price_cents: 10000, fractional_enabled: true }
              as: ClearingSystem
