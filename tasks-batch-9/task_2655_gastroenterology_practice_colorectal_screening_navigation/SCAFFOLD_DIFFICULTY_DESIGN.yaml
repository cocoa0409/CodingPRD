              as: PracticeAdmin
              captures: { s1: $.data.id }
            - call: "POST /endoscopy-sessions/${s1}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-2", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { s2: $.data.id }
            - call: "POST /endoscopy-sessions/${s2}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-3", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { s3: $.data.id }
            - call: "POST /endoscopy-sessions/${s3}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-4", session_date: "2026-09-15", window_start_utc: "2026-09-15T21:00:00Z", window_end_utc: "2026-09-15T23:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { s4: $.data.id }
