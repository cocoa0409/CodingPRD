              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/analysis-plans/${aplan_id}/amend"
              payload: { primary_outcomes: ["employment_q4"] }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { err: $.data.error_id }
          assert:
            - "Secondary-only amend succeeds: amendment_count == 1, secondary_outcomes == [job_retention, benefit_receipt]"
            - "Amend carrying primary_outcomes: error_id == ERR_PRIMARY_OUTCOME_FROZEN; primary_outcomes remain [employment_q4, earnings_q4]; amendment_count stays 1"

      - name: irb_expiry_exact_midnight_boundary
        claim_type: temporal_windowing
        grounds: ["state_machines.IRBProtocol.APPROVED_to_EXPIRED"]
        distinguishing_aspect: "Half-open approval window: at 2027-08-31T23:59:59Z the protocol is APPROVED; at exactly approval_end 2027-09-01T00:00:00Z it is EXPIRED."
        test_recipe:
          setup: ["Study with protocol APPROVED over [2026-09-01, 2027-09-01)"]
          setup_api_calls:
            - call: "POST /evaluation/contracts"
              payload: { agency_code: "ACF-OPRE", title: "T", award_amount_cents: 90000000 }
              as: AgencyOfficer
              as_user_id: "ao-1"
              captures: { contract_id: $.data.id }
            - call: "POST /evaluation/contracts/${contract_id}/studies"
              payload: { title: "S", research_question: "Q" }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { study_id: $.data.id }
            - call: "POST /evaluation/studies/${study_id}/irb-protocols"
              payload: { title: "P1", estimated_burden_minutes: 300 }
              as: PrincipalInvestigator
              as_user_id: "pi-1"
              captures: { irb_id: $.data.id }
            - call: "POST /evaluation/irb-protocols/${irb_id}/submit"
              as: PrincipalInvestigator
              as_user_id: "pi-1"
            - call: "POST /evaluation/irb-protocols/${irb_id}/decision"
              payload: { decision: "APPROVED", approval_start: "2026-09-01T00:00:00Z", approval_end: "2027-09-01T00:00:00Z" }
              as: IRBReviewer
              as_user_id: "irb-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "At 2027-08-31T23:59:59Z: IRBProtocol.${irb_id}.status == APPROVED"
            - "At exactly approval_end 2027-09-01T00:00:00Z: status == EXPIRED"

      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.IRBProtocol.APPROVED_to_EXPIRED", "state_machines.Site.ACTIVE_to_WITHDRAWN"]
        excluded_because:
          difficulty_instance: "transitive_cascade / irb_expiry_cascade_three_levels and site_withdrawal_cascade_enrollment_quarantine"
          rationale: "Both transitive cascade chains are asserted level-by-level in the named difficulty instances."

