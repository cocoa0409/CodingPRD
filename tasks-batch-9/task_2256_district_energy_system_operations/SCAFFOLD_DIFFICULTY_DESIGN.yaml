            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_h_id}", service_date: "2026-08-07T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 0.0, cooling_degree_hours: 0.0 }
              as: DispatchOperator
