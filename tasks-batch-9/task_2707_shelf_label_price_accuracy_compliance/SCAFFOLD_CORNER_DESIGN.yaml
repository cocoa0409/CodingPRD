        grounds:
          - state_machines.PromoSignage.POSTED_to_EXPIRED_PENDING_REMOVAL
          - state_machines.PromoSignage.POSTED_to_NON_COMPLIANT
          - calculations.signage_compliance_state
          - endpoints.POST_/price-integrity/stores/{id}/signage-sweep
        distinguishing_aspect: "One sweep call applies both signage transitions in the pinned order and touches only POSTED signs: the expired sign becomes EXPIRED_PENDING_REMOVAL even though it also lacks the newly required disclosure, the still-running sign becomes NON_COMPLIANT, the DRAFT sign is swept but unchanged, and the store's posture drops to RESTRICTED on the resulting violation count."
        test_recipe:
          setup:
            - "Jurisdiction created with signage_disclosure_codes [] so both signs post cleanly, then PATCHed to require UNIT_PRICE after posting."
