            - "One VERIFIED EVIDENCE document carrying units_verified 9800, which entitles 9800 x 1.25 = 12250.00 — far more than was accrued, which is exactly what the EVIDENCE_BASED policy permits."
            - "One MATCHED deduction with claimed_amount 12500.00."
