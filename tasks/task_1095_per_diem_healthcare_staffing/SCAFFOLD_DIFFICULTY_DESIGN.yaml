              captures: { cred_id: $.data.id }
            - call: "POST /staffing/credentials/${cred_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh1: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-09T07:00:00Z", scheduled_end: "2026-06-09T15:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh2: $.data.id }
            - call: "GET /staffing/orders/${ord_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { open_before: $.data.open_count, filled_before: $.data.filled_count, status_before: $.data.status }
            - call: "POST /staffing/shifts/${sh1}/claims"
              payload: { clinician_id: "${cl_id}" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { clm1: $.data.id }
            - call: "GET /staffing/shifts/${sh1}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { v1: $.data.version }
            - call: "POST /staffing/shifts/${sh1}/award"
              payload: { expected_shift_version: "${v1}", claim_id: "${clm1}" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { asg1: $.data.id }
            - call: "GET /staffing/orders/${ord_id}"
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { open_mid: $.data.open_count, filled_mid: $.data.filled_count, status_mid: $.data.status }
          trigger:
            - call: "POST /staffing/assignments/${asg1}/cancel"
              payload: { reason: "family emergency, cancelled a week ahead" }
              as: Clinician
              as_user_id: "${cl_id}"
              captures: { asg_work: $.data.work_status, lead: $.data.cancellation_lead_hours }
          assert:
            - "${open_before} == 2 and ${filled_before} == 0 and ${status_before} == OPEN"
            - "${open_mid} == 1 and ${filled_mid} == 1 and ${status_mid} == PARTIALLY_FILLED"
            - "${asg_work} == CANCELLED_BY_CLINICIAN"
            - "${lead} == 168.00"
            - "Assignment.${asg1}.pay_status == WAIVED"
            - "Shift.${sh1}.status == OPEN"
            - "StaffingOrder.${ord_id}.status == OPEN"
            - "StaffingOrder.${ord_id}.open_count == 2 and StaffingOrder.${ord_id}.filled_count == 0 and StaffingOrder.${ord_id}.cancelled_count == 0 and StaffingOrder.${ord_id}.shift_count == 2"
            - "invariant holds: StaffingOrder.${ord_id}.shift_count == open_count + filled_count + cancelled_count, i.e. 2 == 2 + 0 + 0"
            - "GET /staffing/clinicians/${cl_id}/reliability-events returns 0 items"
            - "Clinician.${cl_id}.provisional_reliability_score == 100 and Clinician.${cl_id}.reliability_score == 100"
            - "ShiftClaim.${clm1}.status == AWARDED"

      - name: issue_then_void_restores_facility_money_counters
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Timesheet.INVOICED_to_VERIFIED
          - state_machines.Assignment.INVOICED_to_PAYABLE
          - entities.Facility.fields.outstanding_balance_cents
          - entities.Facility.fields.lifetime_billed_cents
          - entities.Facility.fields.pending_pay_cents
        distinguishing_aspect: |
          Conserved quantity #2 is MONEY, not slots, pinned as
          Facility.outstanding_balance_cents == sum of bill_total_cents over that facility's
          Invoices with status == ISSUED. Issue adds 206626 and the compensating void removes
          exactly 206626 from both outstanding_balance_cents and lifetime_billed_cents while
          returning 142500 to pending_pay_cents, leaving zero drift on all three counters.
        test_recipe:
          setup:
            - "Clock at 2026-06-09T16:00Z; facility Brookline requiring RN_LICENSE; RN rate card 7500."
            - "Clinician Quinn Marsh worked and had verified two shifts: 2026-06-08T07:00..19:00 (86250) and 2026-06-09T07:00..15:00 (56250), so pending_pay_cents == 142500."
            - "A DRAFT invoice for 2026-06-08..2026-06-15 was generated at TIER_1 (1.45) with bill_total_cents 206626, and then ISSUED."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Brookline", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
