# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Accounts Receivable & Collections (Expert)
# 9 rule_ids x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cash_forecast_expected_vs_conservative_diverge
        grounds:
          - calculations.cash_forecast
          - entities.CashForecast.fields.projected_cents
          - entities.PromiseToPay.fields.coverage_start
        distinguishing_aspect: >-
          On the CashForecast entity domain, the EXPECTED method (promise-driven,
          50000) and the CONSERVATIVE method (aging-decay-driven, 82000) yield
          different projected_cents for identical invoice/promise inputs.
        test_recipe:
          setup:
            - "Clock at 2026-04-15T00:00:00Z."
            - "Customer C (limit 1000000) with invoice A (face 60000, due 2026-04-01 -> 14 days overdue -> B1_30, prob 0.90) and invoice B (face 40000, due 2026-03-10 -> 36 days overdue -> B31_60, prob 0.70). Both are OPEN with positive dunnable, so both are forecast candidates."
            - "One ACTIVE promise for 50000 covering [2026-03-25, 2026-06-01) (coverage_end 2026-06-01 <= horizon_end 2026-06-14) which contains invoice A's due_date 2026-04-01 but not invoice B's 2026-03-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "C", currency: "USD", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-04-01T00:00:00Z", face_amount_cents: 60000 }
              as: AR_CLERK
              captures: { inv_a: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-10T00:00:00Z", face_amount_cents: 40000 }
              as: AR_CLERK
              captures: { inv_b: $.data.id }
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: COLLECTIONS_AGENT
              captures: { c_v: $.data.version }
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 50000, coverage_start: "2026-03-25T00:00:00Z", coverage_end: "2026-06-01T00:00:00Z", expected_customer_version: "${c_v}" }
              as: COLLECTIONS_AGENT
          trigger:
            - call: "GET /ar/cash-forecast"
              payload: { customer_id: "${c_id}", horizon_days: 60, method: "EXPECTED" }
              as: AR_MANAGER
              captures: { exp_proj: $.data.projected_cents }
            - call: "GET /ar/cash-forecast"
              payload: { customer_id: "${c_id}", horizon_days: 60, method: "CONSERVATIVE" }
              as: AR_MANAGER
              captures: { cons_proj: $.data.projected_cents }
          assert:
            - "CashForecast(EXPECTED).projected_cents == 50000"
            - "CashForecast(CONSERVATIVE).projected_cents == 82000"
            - "EXPECTED.projected_cents != CONSERVATIVE.projected_cents"

      - name: aging_bucket_due_vs_invoice_date_basis_diverge
        grounds:
          - calculations.aging_bucket_assignment
          - entities.Invoice.fields.aging_bucket
          - entities.Invoice.fields.invoice_date
        distinguishing_aspect: >-
          On the Invoice entity domain, the due_date_basis variant places the
          invoice in B31_60 while the invoice_date_basis variant (used by the
          statement aging report) places the same invoice in B91_PLUS at the
          same clock — different reference_date, different bucket.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z."
            - "Invoice issued 2026-01-15 (106 days ago) but due 2026-03-25 (37 days overdue)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "C2", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-15T00:00:00Z", due_date: "2026-03-25T00:00:00Z", face_amount_cents: 50000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
          trigger:
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { bucket: $.data.aging_bucket }
          assert:
            - "Invoice.${inv_id}.aging_bucket == B31_60   # due_date basis: 37 days overdue"
            - "The statement aging report for the same invoice at this clock classifies it B91_PLUS under invoice_date basis (106 days), proving the two variants diverge."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: statement_finance_charge_round_per_invoice_then_sum
        grounds:
          - calculations.statement_finance_charge
          - entities.Statement.fields.finance_charge_cents
        distinguishing_aspect: >-
          Mode (b) nested rounding: two overdue invoices each carry a half-cent
          charge (8500*0.015=127.5->128 and 17500*0.015=262.5->263); the pinned
          round-per-invoice-then-sum order yields 391, whereas sum-then-round
          yields 390 — the scaffold pins per-invoice rounding.
        test_recipe:
          setup:
            - "Clock at 2026-05-10T00:00:00Z."
            - "Customer with two OPEN invoices both overdue (due 2026-03-01): dunnable 8500 and 17500 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "FC", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-01T00:00:00Z", face_amount_cents: 8500 }
              as: AR_CLERK
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-01T00:00:00Z", face_amount_cents: 17500 }
              as: AR_CLERK
          trigger:
            - call: "POST /ar/customers/${c_id}/statements"
              payload: { period_end: "2026-05-10T00:00:00Z" }
              as: AR_MANAGER
              captures: { fc: $.data.finance_charge_cents }
          assert:
            - "Statement.finance_charge_cents == 391   # 128 + 263, NOT 390"

      - name: collection_priority_score_nonlinear_promise_penalty
        grounds:
          - calculations.collection_priority_score
          - entities.DunningNotice.fields.priority_score
          - entities.PromiseToPay.fields.coverage_end
        distinguishing_aspect: >-
          Mode (a) non-linear ≥3-input formula: the score combines a capped
          balance term (min), an aging weight, a stage weight, and a conditional
          promise penalty; an ACTIVE promise covering today subtracts W_PTP=3.0,
          dropping the emitted notice priority_score from 11.5 to 8.5.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Customer in collection_stage COLLECTIONS with one invoice dunnable 250000, aging B61_90."
            - "An ACTIVE promise covers today [2026-06-01, 2026-06-30)."
            - "A dunning sequence with a single step (min_days_overdue 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "PS", credit_limit_cents: 5000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-20T00:00:00Z", face_amount_cents: 250000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: COLLECTIONS_AGENT
              captures: { c_v: $.data.version }
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 100000, coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2026-06-30T00:00:00Z", expected_customer_version: "${c_v}" }
              as: COLLECTIONS_AGENT
            - call: "POST /ar/dunning-sequences"
              payload: { name: "S1", active: true, steps: [ { min_days_overdue: 1, channel: "EMAIL", severity: 2 } ] }
              as: AR_MANAGER
              captures: { seq_id: $.data.id }
            - call: "POST /ar/dunning-runs"
              payload: { customer_id: "${c_id}", sequence_id: "${seq_id}" }
              as: COLLECTIONS_AGENT
          trigger:
            - call: "GET /ar/invoices/${inv_id}/dunning-notices"
              payload: {}
              as: COLLECTIONS_AGENT
              captures: { score0: "$.data[0].priority_score" }
          assert:
            - "DunningNotice[0].priority_score == 8.5   # 2.5 + 6.0(B61_90 stage COLLECTIONS) - 3.0(active promise today); without the promise it would be 11.5"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_reopen_cycle_increments_reopen_count
        grounds:
          - state_machines.Dispute.RESOLVED_CREDIT_to_UNDER_REVIEW
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_CREDIT
          - entities.Dispute.fields.reopen_count
        distinguishing_aspect: >-
          The Dispute machine is cyclic: UNDER_REVIEW -> RESOLVED_CREDIT ->
          (reopen) UNDER_REVIEW, and reopen_count increments to 1 on the loop,
          a back-edge no linear pipeline has.
        test_recipe:
          setup:
            - "Customer with a 50000 OPEN invoice; a partial dispute for 20000 opened then started-review then resolved with 0 credit-cents, then reopened."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "DR", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 50000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/disputes"
              payload: { invoice_id: "${inv_id}", amount_cents: 20000, reason_code: "PRICING" }
              as: COLLECTIONS_AGENT
              captures: { d_id: $.data.id }
            - call: "POST /ar/disputes/${d_id}/start-review"
              payload: {}
              as: AR_MANAGER
            - call: "POST /ar/disputes/${d_id}/resolve"
              payload: { resolve_credit_cents: 0 }
              as: AR_MANAGER
          trigger:
            - call: "POST /ar/disputes/${d_id}/reopen"
              payload: {}
              as: AR_MANAGER
              captures: { st: $.data.status, rc: $.data.reopen_count }
          assert:
            - "Dispute.${d_id}.status == UNDER_REVIEW"
            - "Dispute.${d_id}.reopen_count == 1"

      - name: customer_parallel_credit_and_collection_dimensions_independent
        grounds:
          - state_machines.Customer
          - entities.Customer.fields.credit_status
          - entities.Customer.fields.collection_stage
        distinguishing_aspect: >-
          On the Customer entity, credit_status and collection_stage are parallel
          independent dimensions: a manual hold drives credit_status to HOLD while
          collection_stage stays CURRENT (no dunning yet), proving the two axes
          evolve independently on the same row.
        test_recipe:
          setup:
            - "Fresh customer (GOOD, CURRENT). AR_MANAGER places a manual hold."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "PAR", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /ar/customers/${c_id}/hold"
              payload: {}
              as: AR_MANAGER
              captures: { cs: $.data.credit_status, st: $.data.collection_stage }
          assert:
            - "Customer.${c_id}.credit_status == HOLD"
            - "Customer.${c_id}.collection_stage == CURRENT   # collection axis untouched by the credit-axis hold"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_full_settle_cascades_invoice_paid_then_customer_posture
        grounds:
          - state_machines.Invoice.OPEN_to_PAID
          - state_machines.Customer
          - entities.Customer.fields.credit_status
          - entities.Customer.fields.collection_stage
        distinguishing_aspect: >-
          Depth-3 cascade from a single trigger: applying a payment (action on
          PaymentApplication) zeroes Invoice.balance_cents -> Invoice PAID;
          that PAID drives Customer.exposure to 0 -> credit_status GOOD; which in
          turn (all overdue cleared) drives collection_stage to CURRENT. Each hop
          is caused by the prior hop, not by the original apply call.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer (limit 100000) with one OPEN overdue invoice (due 2026-03-01, 61 days overdue -> B61_90) balance 100000 -> exposure==limit -> credit_status HOLD; one dunning run sets collection_stage to COLLECTIONS (worst bucket B61_90)."
            - "A 100000 payment is recorded, then fully applied to the invoice, clearing all balances."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: AR_MANAGER
            - call: "POST /ar/customers"
              payload: { name: "CAS", credit_limit_cents: 100000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-15T00:00:00Z", due_date: "2026-03-01T00:00:00Z", face_amount_cents: 100000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/dunning-sequences"
              payload: { name: "S1", steps: [ { min_days_overdue: 1, channel: "EMAIL", severity: 1 } ] }
              as: AR_MANAGER
              captures: { seq_id: $.data.id }
            - call: "POST /ar/dunning-runs"
              payload: { customer_id: "${c_id}", sequence_id: "${seq_id}" }
              as: COLLECTIONS_AGENT
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 100000, received_at: "2026-05-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 100000 }
              as: AR_CLERK
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { cs: $.data.credit_status, st: $.data.collection_stage, exp: $.data.exposure_cents }
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "Customer.${c_id}.exposure_cents == 0"
            - "Customer.${c_id}.credit_status == GOOD"
            - "Customer.${c_id}.collection_stage == CURRENT"

      - name: writeoff_approval_cascades_invoice_writtenoff_then_baddebt_then_stage
        grounds:
          - state_machines.Invoice.OPEN_to_WRITTEN_OFF
          - state_machines.Customer
          - entities.Customer.fields.bad_debt_total_cents
          - entities.Customer.fields.collection_stage
        distinguishing_aspect: >-
          Depth-2+ cascade from a different trigger (write-off approval, not
          payment): approving a WriteOff sets Invoice WRITTEN_OFF, which itself
          increments Customer.bad_debt_total_cents and then advances
          collection_stage to WRITEOFF — a propagation distinct from the payment
          chain above.
        test_recipe:
          setup:
            - "Customer (limit 200000) with one OPEN invoice balance 80000 (no dispute). A pending write-off for 80000 is created by COLLECTIONS_AGENT then approved by a DIFFERENT AR_MANAGER."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "WO", credit_limit_cents: 200000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 80000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/write-offs"
              payload: { invoice_id: "${inv_id}", amount_cents: 80000, reason_code: "UNCOLLECTIBLE" }
              as: COLLECTIONS_AGENT
              as_user_id: "agent-1"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /ar/write-offs/${wo_id}/approve"
              payload: {}
              as: AR_MANAGER
              as_user_id: "manager-1"
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { bd: $.data.bad_debt_total_cents, st: $.data.collection_stage }
          assert:
            - "Invoice.${inv_id}.status == WRITTEN_OFF"
            - "Customer.${c_id}.bad_debt_total_cents == 80000"
            - "Customer.${c_id}.collection_stage == WRITEOFF"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_constraint_on_apply_to_writtenoff_invoice_overpay
        grounds:
          - validations[priority=6]
          - validations[priority=15]
        distinguishing_aspect: >-
          Error-category pair state(6, ERR_INVALID_STATE) vs business_constraint
          (15, ERR_APPLY_EXCEEDS_INVOICE): a single apply call to a WRITTEN_OFF
          invoice with an over-balance amount violates both; the higher-priority
          state check wins -> ERR_INVALID_STATE, not ERR_APPLY_EXCEEDS_INVOICE.
        test_recipe:
          setup:
            - "Customer with an invoice balance 80000 written off (approved). A fresh 99999 payment exists for the same customer."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "PV1", credit_limit_cents: 500000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 80000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/write-offs"
              payload: { invoice_id: "${inv_id}", amount_cents: 80000, reason_code: "UNCOLLECTIBLE" }
              as: COLLECTIONS_AGENT
              as_user_id: "agent-1"
              captures: { wo_id: $.data.id }
            - call: "POST /ar/write-offs/${wo_id}/approve"
              payload: {}
              as: AR_MANAGER
              as_user_id: "manager-1"
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 99999, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_id}", applied_cents: 99999 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE   # state(6) outranks business_constraint(15)"

      - name: referential_beats_constraint_on_cross_customer_overpay
        grounds:
          - validations[priority=10]
          - validations[priority=15]
        distinguishing_aspect: >-
          Error-category pair business_referential(10, ERR_CUSTOMER_MISMATCH) vs
          business_constraint(15, ERR_APPLY_EXCEEDS_INVOICE): a payment from
          customer X applied to customer Y's invoice with an over-balance amount
          violates both; the higher-priority referential check wins ->
          ERR_CUSTOMER_MISMATCH.
        test_recipe:
          setup:
            - "Customer X with a payment; customer Y with a small OPEN invoice (balance 1000)."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "X", credit_limit_cents: 500000 }
              as: AR_MANAGER
              captures: { x_id: $.data.id }
            - call: "POST /ar/customers"
              payload: { name: "Y", credit_limit_cents: 500000 }
              as: AR_MANAGER
              captures: { y_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${y_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1000 }
              as: AR_CLERK
              captures: { inv_y: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${x_id}", amount_cents: 99999, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_x: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_x}/applications"
              payload: { invoice_id: "${inv_y}", applied_cents: 5000 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CUSTOMER_MISMATCH   # referential(10) outranks business_constraint(15)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: aging_bucket_exact_30_days_inclusive_boundary
        grounds:
          - calculations.aging_bucket_assignment
          - entities.Invoice.fields.aging_bucket
        distinguishing_aspect: >-
          Numeric threshold boundary reachable through GET /ar/invoices/{id}:
          days_overdue==30 -> B1_30 (inclusive upper edge), days_overdue==31 ->
          B31_60. Metric = aging-days crossing.
        test_recipe:
          setup:
            - "Invoice due 2026-03-02; clock set to exactly due+30 days (2026-04-01)."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "AG", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-02-01T00:00:00Z", due_date: "2026-03-02T00:00:00Z", face_amount_cents: 50000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: AR_MANAGER
          trigger:
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { b: $.data.aging_bucket }
          assert:
            - "Invoice.${inv_id}.aging_bucket == B1_30   # 30 days overdue is the inclusive top of B1_30"

      - name: credit_status_exposure_equals_limit_triggers_hold
        grounds:
          - calculations.credit_status_eval
          - entities.Customer.fields.credit_status
          - validations[priority=17]
        distinguishing_aspect: >-
          A different metric (exposure-vs-limit, >=) on a different endpoint
          (POST /ar/invoices credit check): exposure exactly == credit_limit_cents
          -> credit_status HOLD (not WATCH); a second invoice is rejected
          ERR_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Customer limit 100000; one invoice of face 100000 makes exposure==limit==100000."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "CL", credit_limit_cents: 100000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 100000 }
              as: AR_CLERK
          trigger:
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { cs: $.data.credit_status, exp: $.data.exposure_cents }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "Customer.${c_id}.exposure_cents == 100000"
            - "Customer.${c_id}.credit_status == HOLD   # exposure >= limit, not WATCH"
            - "second POST /ar/invoices response.error_id == ERR_CREDIT_HOLD"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: writeoff_blocked_by_open_dispute_on_invoice
        grounds:
          - state_machines.Invoice.OPEN_to_WRITTEN_OFF
          - validations[priority=8]
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_CREDIT
        distinguishing_aspect: >-
          Entity pair Invoice<-Dispute: an Invoice's WRITTEN_OFF transition is
          gated by the state of a Dispute on it — an OPEN/UNDER_REVIEW dispute
          forces ERR_DISPUTE_BLOCKS_WRITEOFF.
        test_recipe:
          setup:
            - "Customer with an OPEN invoice balance 60000 and an OPEN partial dispute for 10000 on it."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "CE1", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 60000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/disputes"
              payload: { invoice_id: "${inv_id}", amount_cents: 10000, reason_code: "SHORTAGE" }
              as: COLLECTIONS_AGENT
          trigger:
            - call: "POST /ar/write-offs"
              payload: { invoice_id: "${inv_id}", amount_cents: 50000, reason_code: "UNCOLLECTIBLE" }
              as: COLLECTIONS_AGENT
              as_user_id: "agent-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DISPUTE_BLOCKS_WRITEOFF"

      - name: invoice_create_blocked_by_customer_credit_hold
        grounds:
          - validations[priority=17]
          - entities.Customer.fields.credit_status
          - state_machines.Invoice.OPEN_to_PARTIAL
        distinguishing_aspect: >-
          A different entity pair Invoice<-Customer: creating an Invoice is gated
          by the Customer's credit_status — a manual HOLD forces ERR_CREDIT_HOLD,
          distinct from the Invoice<-Dispute pair above.
        test_recipe:
          setup:
            - "Customer with a manual hold placed (credit_status HOLD)."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "CE2", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/customers/${c_id}/hold"
              payload: {}
              as: AR_MANAGER
          trigger:
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 1000 }
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_CREDIT_HOLD"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: promise_coverage_window_half_open_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.PromiseToPay.fields.coverage_start
          - entities.PromiseToPay.fields.coverage_end
        distinguishing_aspect: >-
          Interval semantics = half-open [start,end) on the PromiseToPay resource:
          a second ACTIVE promise window [2026-06-10, 2026-06-20) overlaps the
          existing [2026-06-01, 2026-06-15) -> ERR_PROMISE_WINDOW_OVERLAP, but an
          adjacent window starting exactly at the prior end is allowed.
        test_recipe:
          setup:
            - "Customer with one ACTIVE promise covering [2026-06-01, 2026-06-15). The same customer is NOT used for a supersede here — the overlap check fires before any supersede."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "PW", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 30000, coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2026-06-15T00:00:00Z", expected_customer_version: "${c_v0}" }
              as: COLLECTIONS_AGENT
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: COLLECTIONS_AGENT
              captures: { c_v1: $.data.version }
          trigger:
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 30000, coverage_start: "2026-06-10T00:00:00Z", coverage_end: "2026-06-20T00:00:00Z", expected_customer_version: "${c_v1}" }
              as: COLLECTIONS_AGENT
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PROMISE_WINDOW_OVERLAP   # [6/10,6/20) intersects [6/1,6/15)"

      - name: dunning_pause_window_closed_with_buffer_conflict_rejected
        grounds:
          - validations[priority=13]
          - entities.DunningPause.fields.pause_start
          - entities.DunningPause.fields.pause_end
        distinguishing_aspect: >-
          Different interval semantics on a different resource (DunningPause):
          closed [start,end] PLUS a mandatory 1-day buffer. A new pause beginning
          1 day after a prior pause's end still conflicts (within buffer) ->
          ERR_PAUSE_WINDOW_CONFLICT, unlike the half-open zero-buffer promise rule.
        test_recipe:
          setup:
            - "Customer with a SCHEDULED dunning pause [2026-07-01, 2026-07-10]. A second pause [2026-07-11, 2026-07-15] starts only 1 day after, inside the buffer."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "DP", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/dunning-pauses"
              payload: { customer_id: "${c_id}", pause_start: "2026-07-01T00:00:00Z", pause_end: "2026-07-10T00:00:00Z" }
              as: COLLECTIONS_AGENT
          trigger:
            - call: "POST /ar/dunning-pauses"
              payload: { customer_id: "${c_id}", pause_start: "2026-07-11T00:00:00Z", pause_end: "2026-07-15T00:00:00Z" }
              as: COLLECTIONS_AGENT
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PAUSE_WINDOW_CONFLICT   # 1-day gap is inside the 1-day buffer"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_apply_then_reverse_conserves_total_open_balance
        grounds:
          - state_machines.Payment.PARTIALLY_APPLIED_to_UNAPPLIED
          - state_machines.Invoice.OPEN_to_PARTIAL
          - entities.Customer.fields.total_open_balance_cents
        distinguishing_aspect: >-
          Conserved quantity = Customer.total_open_balance_cents. Applying 15000
          to a 20000 invoice (-> 25000 with a sibling 20000 invoice) and then
          reversing that application restores total_open_balance_cents to its
          pre-apply value of 40000, exactly.
        test_recipe:
          setup:
            - "Customer with two OPEN invoices balance 20000 each (total_open=40000). A 15000 payment is applied to invoice Y, then reversed."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "INV1", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 20000 }
              as: AR_CLERK
              captures: { inv_x: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 20000 }
              as: AR_CLERK
              captures: { inv_y: $.data.id }
            - call: "POST /ar/payments"
              payload: { customer_id: "${c_id}", amount_cents: 15000, received_at: "2026-03-01T00:00:00Z" }
              as: AR_CLERK
              captures: { pay_id: $.data.id }
            - call: "POST /ar/payments/${pay_id}/applications"
              payload: { invoice_id: "${inv_y}", applied_cents: 15000 }
              as: AR_CLERK
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /ar/payments/${pay_id}/applications/${app_id}/reverse"
              payload: {}
              as: AR_CLERK
            - call: "GET /ar/customers/${c_id}"
              payload: {}
              as: AR_MANAGER
              captures: { tob: $.data.total_open_balance_cents }
          assert:
            - "Customer.${c_id}.total_open_balance_cents == 40000   # restored exactly; no drift"
            - "Invoice.${inv_y}.balance_cents == 20000"

      - name: dispute_open_then_withdraw_conserves_dunnable_plus_disputed
        grounds:
          - state_machines.Dispute.OPEN_to_WITHDRAWN
          - entities.Invoice.fields.disputed_amount_cents
          - entities.Invoice.fields.balance_cents
        distinguishing_aspect: >-
          A different conserved quantity: (dunnable_balance + disputed_amount) on
          the Invoice. Opening a 10000 dispute reduces dunnable to 50000 (disputed
          10000); withdrawing restores disputed to 0 and dunnable to 60000, so the
          sum dunnable+disputed stays 60000 across both actions.
        test_recipe:
          setup:
            - "Customer with one OPEN invoice balance 60000. A 10000 partial dispute is opened then withdrawn."
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "INV2", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id }
            - call: "POST /ar/invoices"
              payload: { customer_id: "${c_id}", invoice_date: "2026-01-01T00:00:00Z", due_date: "2026-02-01T00:00:00Z", face_amount_cents: 60000 }
              as: AR_CLERK
              captures: { inv_id: $.data.id }
            - call: "POST /ar/disputes"
              payload: { invoice_id: "${inv_id}", amount_cents: 10000, reason_code: "QUALITY" }
              as: COLLECTIONS_AGENT
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /ar/disputes/${d_id}/withdraw"
              payload: {}
              as: COLLECTIONS_AGENT
            - call: "GET /ar/invoices/${inv_id}"
              payload: {}
              as: AR_MANAGER
              captures: { bal: $.data.balance_cents, disp: $.data.disputed_amount_cents }
          assert:
            - "Invoice.${inv_id}.disputed_amount_cents == 0"
            - "Invoice.${inv_id}.balance_cents == 60000   # dunnable+disputed conserved at 60000"
