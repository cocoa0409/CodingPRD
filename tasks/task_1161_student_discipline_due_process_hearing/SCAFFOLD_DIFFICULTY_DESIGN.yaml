  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth-3 chain from appeal decision; depth-2
  # chain from hearing decision. Different triggering transitions.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: appeal_reversal_cascade_case_notice_conference
        grounds:
          - state_machines.Appeal.FILED_to_REVERSED
          - state_machines.DisciplineCase.NOTICE_ISSUED_to_SANCTION_PROPOSED
          - state_machines.SuspensionNotice.ISSUED_to_VOIDED
          - state_machines.Conference.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by appeal decision: Appeal REVERSED mutates
          DisciplineCase (link 1); the case revert voids its SuspensionNotice
          (link 2); the notice void cancels the case's non-terminal Conferences
          (link 3). Trigger differs from the hearing-decision cascade.
        test_recipe:
          setup:
            - "Student NONE, guardian g3; offense DISR-01 band occ1 [1,3]; case classified (admin_adj_1, referrer admin_ref_1), sanctioned 2 days, notice issued 2026-05-04T09:00:00Z"
            - "Conference c1 NO_SHOW then rescheduled to 2026-05-06T10:00:00Z (attempt 2, status SCHEDULED)"
            - "Guardian appeal FILED at 2026-05-05T09:00:00Z (within 5-day window)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Casc", date_of_birth: "2009-07-01T00:00:00Z", grade_level: 8, demographic_group: "BLACK", guardian_id: "g3" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - call: "POST /cases/${case_id}/notices"
              payload: { delivery_method: "EMAIL" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { notice_id: $.data.id }
            - call: "POST /cases/${case_id}/conferences"
              payload: { scheduled_at: "2026-05-05T10:00:00Z" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { conf_id: $.data.id }
            - { call: "POST /conferences/${conf_id}/outcome", payload: { outcome: "NO_SHOW" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /conferences/${conf_id}/reschedule", payload: { scheduled_at: "2026-05-06T10:00:00Z" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases/${case_id}/appeals"
              payload: { grounds: "insufficient evidence" }
              as: ParentGuardian
              as_user_id: "g3"
              captures: { appeal_id: $.data.id }
          trigger:
            - { call: "POST /appeals/${appeal_id}/decision", payload: { outcome: "REVERSED" }, as: DistrictAdmin, as_user_id: "da_1" }
            - call: "GET /cases/${case_id}/notices"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { notice_status_after: "$.data[0].status" }
            - call: "GET /cases/${case_id}/conferences"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { conf_status_after: "$.data[0].status" }
          assert:
            - "Appeal.status == REVERSED (trigger link 0)"
            - "DisciplineCase.status == SANCTION_PROPOSED with proposed_sanction_days == null (link 1: appeal -> case)"
            - "SuspensionNotice.status == VOIDED (link 2: case revert -> notice void), got ${notice_status_after}"
            - "Conference.status == CANCELLED (link 3: notice void -> conference cancel), got ${conf_status_after}"

      - name: expulsion_ordered_cascade_case_student_enrollment
        grounds:
          - state_machines.ExpulsionHearing.HELD_to_EXPULSION_ORDERED
          - state_machines.DisciplineCase.EXPULSION_REFERRED_to_EXPULSION_ACTIVE
          - state_machines.Student.ENROLLED_to_ALT_ED_PENDING
        distinguishing_aspect: |
          Depth-2 chain triggered by hearing decision (different trigger than
          the appeal cascade): hearing EXPULSION_ORDERED mutates DisciplineCase
          to EXPULSION_ACTIVE (link 1); that case mutation flips
          Student.enrollment_status to ALT_ED_PENDING (link 2).
        test_recipe:
          setup:
            - "Student NONE, guardian g4; expellable offense WEAP-01 (WEAPONS, severity 4)"
