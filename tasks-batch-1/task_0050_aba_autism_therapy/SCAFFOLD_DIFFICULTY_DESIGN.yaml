            - "GET /therapy-sessions/${sess_id} shows status == SCHEDULED (renew does NOT cascade-cancel sessions)"
            - "POST /therapy-sessions/${sess_id}/deliver returns 409 ERR_AUTHORIZATION_NOT_ACTIVE (owning authorization is RENEWED, outside {ACTIVE, EXHAUSTED})"

