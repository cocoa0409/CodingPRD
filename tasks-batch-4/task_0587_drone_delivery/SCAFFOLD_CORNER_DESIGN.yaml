            - "Drone.${drone_2}.status == RESERVED"
            - "Drone.${drone_1}.status == IDLE and Drone.${drone_3}.status == IDLE"

      - name: battery_health_pct_precision
        claim_type: precision
        grounds: [entities.Battery.fields.health_pct, calculations.drone_airworthiness_risk]
        distinguishing_aspect: "health_pct = round(100 - (cycle_count / 300) * 100, 1): a pack imported at cycle_count 100 reads 66.7 (not 66.6 or 66.67)."
