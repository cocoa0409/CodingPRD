              as: Estimator
              captures: { li_big: $.data.id, big_sqft: $.data.billable_sqft, big_unit: $.data.unit_price_cents }
          assert:
            - "LineItem.${li_small}.billable_sqft == 4.0"
            - "LineItem.${li_small}.unit_price_cents == 5200"
            - "LineItem.${li_big}.billable_sqft == 5.0"
