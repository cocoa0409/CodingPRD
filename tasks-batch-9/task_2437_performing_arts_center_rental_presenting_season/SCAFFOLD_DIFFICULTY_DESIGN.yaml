                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              payload: {}
              captures: { eng_v_pre_neg: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 1200000
                offered_artist_share_pct: 0.10
                expected_engagement_version: "${eng_v_pre_neg}"
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload:
                counter_fee_cents: 1800000
                counter_artist_share_pct: 0.15
            - call: "POST /fee-negotiations/${neg_id}/revise-offer"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 1400000
                offered_artist_share_pct: 0.12
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload:
                counter_fee_cents: 1750000
                counter_artist_share_pct: 0.14
            - call: "POST /fee-negotiations/${neg_id}/revise-offer"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 1500000
                offered_artist_share_pct: 0.13
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload:
                counter_fee_cents: 1700000
                counter_artist_share_pct: 0.14
          trigger:
            - call: "POST /fee-negotiations/${neg_id}/revise-offer"
              as: ProgrammingDirector
              payload:
                offered_fee_cents: 1600000
                offered_artist_share_pct: 0.13
              captures: { err: "$.data.error_id" }
          assert:
            - "422 with error_id ERR_NEGOTIATION_ROUND_LIMIT."
            - "GET /engagements/${engagement_id}/fee-negotiations: the single round still has status COUNTERED, revision_count == 2, round_index == 1."
            - "offered_fee_cents is still 1500000 and offered_artist_share_pct still 0.13 — the refused revision left no partial write."
            - "counter_fee_cents == 1700000 and counter_artist_share_pct == 0.14 from the last accepted counter."
            - "Cycle evidence: the round occupied OFFERED at revision_count 0, 1 and 2 with three DIFFERENT offered_fee_cents values (1200000, 1400000, 1500000), and each successful revise-offer reset counter_fee_cents and counter_artist_share_pct to null before the next counter refilled them."
            - "engagement.negotiation_round_count is still 1: cycling inside a round never consumes one of the 3 rounds per engagement."
            - "GET /engagements/${engagement_id}: negotiated_fee_cents == 0 and fee_accepted_by_user_id is null — nothing is written onto the engagement until a round is ACCEPTED."

      - name: tech_rider_review_three_way_fork_and_divergent_join
        differentiation: |
          A FORK-JOIN with divergent join semantics: SUBMITTED has three mutually exclusive
          successors, two of which (CAPABLE, GAP_IDENTIFIED) reconverge on CLEARED while executing
          DIFFERENT side-effect sets, and the third (REJECTED_INFEASIBLE) is terminal so its subtree
          can never reach the join. Unlike the sibling cycle above, no state is ever revisited.
        mechanism: "state_machines TechRider: SUBMITTED -> {CAPABLE | GAP_IDENTIFIED | REJECTED_INFEASIBLE}, with CAPABLE->CLEARED and GAP_IDENTIFIED->CLEARED carrying different side effects"
        entities_involved: [PerformanceSpace, RentalClient, Engagement, TechRider, EquipmentItem, EquipmentRentalLine]
