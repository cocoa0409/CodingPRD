              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Retail Twenty", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv1: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${cabv1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /burn-in-chambers"
              payload: { name: "CH-1", slot_capacity: 4, turnaround_minutes: 60, certified_max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: $.data.id }
          trigger:
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 3, drive_pct: 80, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { run1: $.data.id }
            - call: "POST /burn-in-runs/${run1}/abort"
              payload: { reason: "Chamber humidity sensor out of calibration" }
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 3, drive_pct: 80, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
