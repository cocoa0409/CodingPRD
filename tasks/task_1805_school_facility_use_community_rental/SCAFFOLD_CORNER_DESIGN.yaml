            - "Permit: lifecycle_status == ISSUED, financial_status == DEPOSIT_PENDING, occupancy 01:00-03:00 with blocked [00:30, 03:30)"
            - "Invoice: kind == PROVISIONAL, status == ISSUED, total_cents == 28000 (rental 10000 for 2h + staffing 12000 for 3.0h blocked window x 4000 + after_hours 6000 at 0.50 uplift; subtotal 28000 < 50000 -> no discount)"
