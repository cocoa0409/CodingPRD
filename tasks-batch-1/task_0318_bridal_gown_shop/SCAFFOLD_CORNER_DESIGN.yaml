# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Walks references/claim-extraction-guide.md section-by-section.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_gown_order_returns_201_with_computed_quoted_total
        claim_type: Creation
        grounds:
          - entities.GownOrder
          - endpoints
          - entities.GownOrder.fields.quoted_total_cents
        distinguishing_aspect: "POST /gown-orders with required fields returns 201, fulfillment_status DRAFT, payment_status UNPAID, version 1, and a computed quoted_total_cents=180000 for base 180000 size 10 non-rush."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id, q: $.data.quoted_total_cents }
          assert:
            - "response.status == 201"
            - "GownOrder.${ord}.fulfillment_status == DRAFT"
            - "GownOrder.${ord}.payment_status == UNPAID"
            - "GownOrder.${ord}.quoted_total_cents == 180000"
            - "GownOrder.${ord}.version == 1"

      - name: create_gown_order_missing_base_price_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.GownOrder.fields.base_price_cents
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required base_price_cents on POST /gown-orders returns 422 ERR_INVALID_REQUEST; no order persisted."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_gown_order_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.GownOrder
          - errors[ERR_ORDER_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /gown-orders/{id} with an unknown UUID returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /gown-orders/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_ORDER_NOT_FOUND"

      - name: create_gown_order_default_is_rush_false_applied
        claim_type: Defaults
        grounds:
          - entities.GownOrder.fields.is_rush
          - calculations.gown_order_total
        distinguishing_aspect: "Omitting is_rush defaults to false: a base 180000 size 10 order has NO rush surcharge -> quoted_total_cents == 180000 (not 234000)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id, rush: $.data.is_rush, q: $.data.quoted_total_cents }
          assert:
            - "GownOrder.${ord}.is_rush == false"
            - "GownOrder.${ord}.quoted_total_cents == 180000"

      - name: system_fields_generated_on_stylist_create_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Stylist
          - entities.Stylist.fields.id
        distinguishing_aspect: "POST /stylists mints id/created_at/updated_at/version server-side; version starts at 1 regardless of any client value."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /stylists"
              payload: { full_name: "Sol", turnaround_buffer_minutes: 20 }
              as: ShopManager
              captures: { sty: $.data.id, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Stylist.${sty}.version == 1"
            - "Stylist.${sty}.turnaround_buffer_minutes == 20"

      - name: create_fitting_room_capacity_below_one_rejected
        claim_type: Type Constraints
        grounds:
          - entities.FittingRoom.fields.capacity
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /fitting-rooms with capacity 0 violates the capacity>=1 constraint -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /fitting-rooms"
              payload: { room_label: "Bad", capacity: 0 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: payment_immutable_entity_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Payment
          - endpoints
        distinguishing_aspect: "Payment has common_fields:false — its create response carries id and created_at but no version/updated_at; there is no Payment update endpoint."
        test_recipe:
          setup:
            - "GownOrder quoted 180000; plan deposit 90000 term 2."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
              captures: { pay: $.data.id, kind: $.data.kind }
          assert:
            - "response.status == 201"
            - "Payment.${pay}.kind == DEPOSIT"
            - "Payment.${pay}.settlement_status == SETTLED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: check_in_already_checked_in_returns_not_booked
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.BOOKED_to_CHECKED_IN
          - errors[ERR_APPOINTMENT_NOT_BOOKED]
        distinguishing_aspect: "Calling check-in twice: the second call sees status CHECKED_IN (not BOOKED) and is rejected ERR_APPOINTMENT_NOT_BOOKED."
        test_recipe:
          setup:
            - "Stylist with a BOOKED appointment already CHECKED_IN."
          setup_api_calls:
            - call: "POST /stylists"
              payload: { full_name: "Tao" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-08T10:00:00.000Z", end_at: "2026-07-08T11:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /appointments/${appt}/check-in"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /appointments/${appt}/check-in"
              payload: {}
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_APPOINTMENT_NOT_BOOKED"

      - name: cancel_terminal_picked_up_order_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.GownOrder.READY_to_PICKED_UP
          - state_machines.GownOrder.RECEIVED_to_CANCELLED
          - errors[ERR_ORDER_NOT_CANCELLABLE]
        distinguishing_aspect: "A PICKED_UP (terminal) order rejects cancel with ERR_ORDER_NOT_CANCELLABLE; no cascade fires."
        test_recipe:
          setup:
            - "GownOrder fully paid, RECEIVED, READY, then PICKED_UP."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv1}" }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /gown-orders/${ord}/mark-ready"
              payload: {}
              as: Seamstress
            - call: "POST /gown-orders/${ord}/pickup"
              payload: { final_steam_done: true }
              as: BridalConsultant
          trigger:
            - call: "POST /gown-orders/${ord}/cancel"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ORDER_NOT_CANCELLABLE"
            - "GownOrder.${ord}.fulfillment_status == PICKED_UP"

      - name: appointment_revert_check_in_returns_to_booked
        claim_type: Valid Transition
        grounds:
          - state_machines.Appointment.CHECKED_IN_to_BOOKED
        distinguishing_aspect: "revert-check-in moves a CHECKED_IN appointment back to BOOKED (cyclic revert), restoring cancellability."
        test_recipe:
          setup:
            - "An appointment CHECKED_IN."
          setup_api_calls:
            - call: "POST /stylists"
              payload: { full_name: "Uma" }
              as: ShopManager
              captures: { sty: $.data.id }
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-09T10:00:00.000Z", end_at: "2026-07-09T11:00:00.000Z" }
              as: BridalConsultant
              captures: { appt: $.data.id }
            - call: "POST /appointments/${appt}/check-in"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /appointments/${appt}/revert-check-in"
              payload: {}
              as: BridalConsultant
              captures: { st: $.data.status }
          assert:
            - "response.status == 200"
            - "Appointment.${appt}.status == BOOKED"

      - name: mark_ready_with_outstanding_alteration_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GownOrder.RECEIVED_to_READY
          - errors[ERR_ALTERATIONS_OUTSTANDING]
          - validations[priority=6]
        distinguishing_aspect: "mark-ready on a RECEIVED order with an AlterationJob still QUEUED is rejected ERR_ALTERATIONS_OUTSTANDING; order stays RECEIVED."
        test_recipe:
          setup:
            - "GownOrder RECEIVED with one QUEUED AlterationJob."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /alteration-jobs"
              payload: { gown_order_id: "${ord}", estimated_labor_minutes: 30 }
              as: Seamstress
              captures: { job: $.data.id }
          trigger:
            - call: "POST /gown-orders/${ord}/mark-ready"
              payload: {}
              as: Seamstress
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALTERATIONS_OUTSTANDING"
            - "GownOrder.${ord}.fulfillment_status == RECEIVED"

      - name: submit_without_payment_plan_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GownOrder.DRAFT_to_ORDERED
          - errors[ERR_PAYMENT_PLAN_REQUIRED]
          - validations[priority=6]
        distinguishing_aspect: "submit on a DRAFT order with no PaymentPlan is rejected ERR_PAYMENT_PLAN_REQUIRED; order stays DRAFT."
        test_recipe:
          setup:
            - "A DRAFT GownOrder with no PaymentPlan."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PAYMENT_PLAN_REQUIRED"
            - "GownOrder.${ord}.fulfillment_status == DRAFT"

      - name: refund_on_non_cancelled_order_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PaymentPlan.ACTIVE_to_CANCELLED
          - errors[ERR_REFUND_NOT_ALLOWED]
          - validations[priority=6]
        distinguishing_aspect: "refund on a plan whose GownOrder is still ACTIVE (not CANCELLED) is rejected ERR_REFUND_NOT_ALLOWED; ledger unchanged."
        test_recipe:
          setup:
            - "GownOrder quoted 180000 (not cancelled); deposit 90000 paid."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/refund"
              payload: { expected_plan_version: "${pv1}" }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_REFUND_NOT_ALLOWED"
            - "PaymentPlan.${plan}.amount_paid_cents == 90000"

      - name: log_labor_from_fitting_not_adjusting_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.AlterationJob.ADJUSTING_to_FITTING
          - errors[ERR_JOB_NOT_ADJUSTING]
        distinguishing_aspect: "log-labor requires ADJUSTING; calling it on a job in FITTING (no pending adjustment) is rejected ERR_JOB_NOT_ADJUSTING."
        test_recipe:
          setup:
            - "RECEIVED order; AlterationJob in FITTING (never sent to adjustment)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /alteration-jobs"
              payload: { gown_order_id: "${ord}", estimated_labor_minutes: 30 }
              as: Seamstress
              captures: { job: $.data.id }
            - call: "POST /alteration-jobs/${job}/start-fitting"
              payload: {}
              as: Seamstress
          trigger:
            - call: "POST /alteration-jobs/${job}/log-labor"
              payload: { minutes: 20 }
              as: Seamstress
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOB_NOT_ADJUSTING"

      - name: pickup_without_final_steam_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GownOrder.READY_to_PICKED_UP
          - errors[ERR_FINAL_STEAM_REQUIRED]
          - validations[priority=13]
        distinguishing_aspect: "A READY, fully-paid order with final_steam_done=false on pickup is rejected ERR_FINAL_STEAM_REQUIRED (steam check fires after the balance check passes)."
        test_recipe:
          setup:
            - "GownOrder fully paid (PAID_IN_FULL), RECEIVED->READY."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv1}" }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /gown-orders/${ord}/mark-ready"
              payload: {}
              as: Seamstress
          trigger:
            - call: "POST /gown-orders/${ord}/pickup"
              payload: { final_steam_done: false }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FINAL_STEAM_REQUIRED"
            - "GownOrder.${ord}.fulfillment_status == READY"

      - name: full_happy_path_pickup_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.GownOrder.READY_to_PICKED_UP
          - state_machines.GownOrder.UNPAID_to_PAID_IN_FULL
        distinguishing_aspect: "End-to-end: a fully-paid READY order with final_steam_done=true reaches PICKED_UP (200), payment_status PAID_IN_FULL."
        test_recipe:
          setup:
            - "GownOrder fully paid, RECEIVED->READY."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
            - call: "GET /payment-plans/${plan}"
              payload: {}
              as: FinanceClerk
              captures: { pv1: $.data.version }
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv1}" }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
            - call: "POST /gown-orders/${ord}/mark-ready"
              payload: {}
              as: Seamstress
          trigger:
            - call: "POST /gown-orders/${ord}/pickup"
              payload: { final_steam_done: true }
              as: BridalConsultant
              captures: { st: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "response.status == 200"
            - "GownOrder.${ord}.fulfillment_status == PICKED_UP"
            - "GownOrder.${ord}.payment_status == PAID_IN_FULL"

  # ===========================================================================
  - section: calculations
    instances:
      - name: deposit_coverage_flips_order_to_deposit_paid
        claim_type: Correct Result
        grounds:
          - calculations.plan_ledger
          - state_machines.GownOrder.UNPAID_to_DEPOSIT_PAID
          - state_machines.PaymentPlan.DEPOSIT_DUE_to_ACTIVE
        distinguishing_aspect: "Posting a deposit covering deposit_cells flips plan DEPOSIT_DUE->ACTIVE and order payment_status UNPAID->DEPOSIT_PAID; amount_paid_cents==90000, balance==90000."
        test_recipe:
          setup:
            - "GownOrder quoted 180000; plan deposit 90000 term 2; nothing paid yet."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
              captures: { plan: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /payment-plans/${plan}/payments"
              payload: { amount_cents: 90000, expected_plan_version: "${pv0}" }
              as: FinanceClerk
          assert:
            - "PaymentPlan.${plan}.status == ACTIVE"
            - "PaymentPlan.${plan}.amount_paid_cents == 90000"
            - "PaymentPlan.${plan}.balance_due_cents == 90000"
            - "GownOrder.${ord}.payment_status == DEPOSIT_PAID"

      - name: removed_accessory_excluded_from_final_total
        claim_type: Input Set Filtering
        grounds:
          - calculations.gown_order_total
          - entities.AccessoryAddOn.fields.status
          - state_machines.GownOrder.ORDERED_to_RECEIVED
        distinguishing_aspect: "An accessory REMOVED before receive is excluded from final_total_cents: order base 180000 (no upcharge/rush) with a removed 5000 sash -> final_total_cents == 180000."
        test_recipe:
          setup:
            - "Order base 180000 size 10 non-rush; SASH 5000 attached then REMOVED; plan exists; ORDERED."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id }
            - call: "POST /accessory-addons"
              payload: { gown_order_id: "${ord}", accessory_type: "SASH", price_cents: 5000 }
              as: BridalConsultant
              captures: { acc: $.data.id }
            - call: "POST /accessory-addons/${acc}/remove"
              payload: {}
              as: BridalConsultant
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 2, deposit_cents: 90000 }
              as: FinanceClerk
            - call: "POST /gown-orders/${ord}/submit"
              payload: {}
              as: BridalConsultant
          trigger:
            - call: "POST /gown-orders/${ord}/receive"
              payload: {}
              as: ShopManager
              captures: { fin: $.data.final_total_cents }
          assert:
            - "AccessoryAddOn.${acc}.status == REMOVED"
            - "GownOrder.${ord}.final_total_cents == 180000"

      - name: size_upcharge_applies_at_floor_boundary
        claim_type: Constants Applied
        grounds:
          - calculations.gown_order_total
          - entities.GownOrder.fields.ordered_size
        distinguishing_aspect: "Threshold boundary: ordered_size exactly 20 (== SIZE_UPCHARGE_FLOOR) applies the 15% upcharge -> quoted 180000 + ceil(180000*0.15)=27000 = 207000; size 19 would be 180000."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "PLUSFIT", ordered_size: 20, base_price_cents: 180000, standard_lead_days: 60 }
              as: BridalConsultant
              captures: { ord: $.data.id, q: $.data.quoted_total_cents }
          assert:
            - "GownOrder.${ord}.quoted_total_cents == 207000"

  # ===========================================================================
  - section: validations
    instances:
      - name: deposit_below_floor_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=10]
          - errors[ERR_DEPOSIT_BELOW_FLOOR]
          - calculations.payment_plan_schedule
        distinguishing_aspect: "A PaymentPlan with deposit_cents 144999 on a 290000 plan (floor 145000) is rejected ERR_DEPOSIT_BELOW_FLOOR; deposit==145000 would pass."
        test_recipe:
          setup:
            - "GownOrder quoted 290000 (base 200000 size 22 rush)."
          setup_api_calls:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ELEGANCE", ordered_size: 22, base_price_cents: 200000, standard_lead_days: 90, is_rush: true }
              as: BridalConsultant
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /payment-plans"
              payload: { gown_order_id: "${ord}", term_installments: 5, deposit_cents: 144999 }
              as: FinanceClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DEPOSIT_BELOW_FLOOR"

      - name: add_party_member_when_locked_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=9]
          - errors[ERR_PARTY_NOT_FORMING]
          - state_machines.GownOrder.DRAFT_to_ORDERED
        distinguishing_aspect: "Creating a GownOrder with bridal_party_id pointing at a LOCKED party is rejected ERR_PARTY_NOT_FORMING; the same call against a FORMING party succeeds."
        test_recipe:
          setup:
            - "A BridalParty locked (coordination_status LOCKED)."
          setup_api_calls:
            - call: "POST /bridal-parties"
              payload: { party_name: "Locked Wedding", event_date: "2026-09-01T00:00:00.000Z" }
              as: BridalConsultant
              captures: { party: $.data.id }
            - call: "POST /bridal-parties/${party}/lock"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /gown-orders"
              payload: { gown_style_code: "ATELIER", ordered_size: 10, base_price_cents: 180000, standard_lead_days: 60, bridal_party_id: "${party}" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PARTY_NOT_FORMING"

      - name: appointment_end_not_after_start_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Appointment.fields.end_at
        distinguishing_aspect: "POST /appointments with end_at == start_at violates 'end strictly after start' -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A stylist exists."
          setup_api_calls:
            - call: "POST /stylists"
              payload: { full_name: "Vee" }
              as: ShopManager
              captures: { sty: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { stylist_id: "${sty}", appointment_type: "CONSULTATION", start_at: "2026-07-10T10:00:00.000Z", end_at: "2026-07-10T10:00:00.000Z" }
              as: BridalConsultant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: error_overpayment_already_covered
        claim_type: Violation to Error
        grounds:
          - errors[ERR_OVERPAYMENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / overpayment_boundary_exact_vs_over
          rationale: "ERR_OVERPAYMENT is the failure path asserted by the named §1.8 boundary instance."

      - name: error_stylist_double_booked_already_covered
        claim_type: Temporal validation
        grounds:
          - errors[ERR_STYLIST_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stylist_buffered_overlap_rejected
          rationale: "ERR_STYLIST_DOUBLE_BOOKED asserted by the named §1.8 overlap instance."

      - name: error_fitting_room_overbooked_already_covered
        claim_type: Aggregate validation
        grounds:
          - errors[ERR_FITTING_ROOM_OVERBOOKED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fitting_room_aggregate_capacity_half_open
          rationale: "ERR_FITTING_ROOM_OVERBOOKED asserted by the named §1.8 aggregate-capacity instance."

