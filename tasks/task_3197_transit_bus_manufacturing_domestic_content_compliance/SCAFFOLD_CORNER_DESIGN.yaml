        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE]", entities.PartsStock]
        distinguishing_aspect: "A second PartsStock for the same (agency_id, component_id) pair is rejected with ERR_DUPLICATE."
        test_recipe:
