              captures: { wenc_id: $.data.id }
          trigger:
            - call: "POST /encounters/${wenc_id}/waivers"
              payload: { waiver_reason: "NO_INCOME" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { e_waiv: $.data.error_id }
          assert:
            - "Encounter.${wenc_id}.charge_basis == \"FULL_CHARGE_UNVERIFIED\" and patient_charge_cents == 8000"
            - "HTTP 422 and data.error_id == \"ERR_WAIVER_NOT_ELIGIBLE\""
            - "GET /encounters/${wenc_id}/waivers returns total_count == 0"
            - "Encounter.${wenc_id}.waived_amount_cents == 0"
            - "Patient.${wp_id}.patient_balance_cents == 8000"

      - name: fee_schedule_effective_start_not_before_end_rejected
