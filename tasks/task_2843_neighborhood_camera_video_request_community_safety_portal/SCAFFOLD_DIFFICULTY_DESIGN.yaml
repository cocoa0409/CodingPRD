  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_rule_16_beats_fiscal_rule_44
        grounds:
          - validations[priority=16]
          - validations[priority=44]
          - errors.ERR_JUSTIFICATION_NOT_LOGGED
          - errors.ERR_AGENCY_OPEN_REQUEST_QUOTA_EXCEEDED
          - calculations.agency_open_request_quota
          - entities.Agency.fields.open_request_count
        distinguishing_aspect: |
          Category pair (state, business_fiscal), 29 priority steps apart, on
          POST /video-requests/{id}/submit. Both rules are genuinely violated by the very same
          call — the request has never been justified AND the agency is already at
          max_open_requests 1 — and the state rule at priority 16 must win. The instance then
          repairs ONLY the state violation (logging the justification) and reissues the same
          submit, which now surfaces ERR_AGENCY_OPEN_REQUEST_QUOTA_EXCEEDED; that second call
          is what proves the fiscal rule really was violated during the first call rather than
          merely unreached.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z; one agency ONBOARDED with min_device_threshold 3, max_open_requests 1 and period_request_quota 20; officer OA with duty_role REQUESTER."
