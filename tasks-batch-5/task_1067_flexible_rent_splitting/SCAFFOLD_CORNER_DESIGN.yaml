  # =================================================================
  - section: cross_cutting
    instances:
      - name: reschedule_stale_cycle_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reschedule-stale-cycle]", "errors[ERR_STALE_CYCLE_VERSION]"]
        distinguishing_aspect: "After one successful reschedule bumps the cycle to version 2, a second reschedule still carrying the version-1 token returns ERR_STALE_CYCLE_VERSION (412)."
        test_recipe:
          setup: ["Renter ENROLLED LOW portion 100000; SPLIT n=2 cycle (version 1); one reschedule applied (version 2)."]
          setup_api_calls:
            - call: "POST /api/properties"
              payload: { landlord_name: "Ada", unit_label: "Oak #15", full_rent_cents: 120000, rent_due_day: 1, remittance_account_ref: "acct_c15", integration_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /api/renters"
              payload: { property_id: "${prop_id}", email: "c15@x.com", full_name: "C Fifteen", portion_rent_cents: 100000 }
              as: PlatformAdmin
              captures: { renter_id: $.data.id }
            - call: "POST /api/renters/${renter_id}/applications"
              payload: { reported_monthly_income_cents: 300000, requested_split_count: 2, prior_delinquency_count: 0 }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /api/applications/${app_id}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "POST /api/billing-cycles"
              payload: { renter_id: "${renter_id}", cycle_month: "2026-07", cycle_start_date: "2026-07-01T00:00:00Z", mode: "SPLIT", split_count: 2 }
              as: PlatformAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /api/billing-cycles/${cyc_id}/reschedule"
              payload: { expected_cycle_version: "${cyc_v}", mode: "SPLIT", split_count: 3 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/billing-cycles/${cyc_id}/reschedule"
              payload: { expected_cycle_version: "${cyc_v}", mode: "SPLIT", split_count: 4 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_CYCLE_VERSION"

