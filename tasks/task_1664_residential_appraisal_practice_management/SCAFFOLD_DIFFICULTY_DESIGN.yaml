      - name: turn_time_calendar_vs_business_day_variants
        grounds:
          - calculations.turn_time_scorecard
        distinguishing_aspect: |
          Entity domain: Appraiser metrics. The same delivery (accepted Saturday
          2026-08-01T00:00, delivered Wednesday 2026-08-05T12:00) yields 4.5
          calendar days but 3.0 business days — two spec-valid turn-time variants
          over one event pair, both exposed on the scorecard.
