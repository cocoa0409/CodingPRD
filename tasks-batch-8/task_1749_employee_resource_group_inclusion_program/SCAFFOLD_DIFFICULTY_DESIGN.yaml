  - rule_id: boundary_precision_check
    instances:
      - name: approve_at_exact_available_balance
        grounds:
          - calculations.matching_topup_award
          - state_machines.FundingRequest.ENDORSED_to_APPROVED
          - errors[ERR_INSUFFICIENT_GROUP_BUDGET]
        distinguishing_aspect: |
          Money boundary on POST /v1/funding-requests/{id}/dei-decision: approved_cents
