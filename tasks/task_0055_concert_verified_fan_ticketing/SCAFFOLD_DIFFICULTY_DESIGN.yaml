              as: PromoterAdmin
              captures: { tier: $.data.id }
            - call: "POST /events/${ev}/open-presale"
              payload: { expected_event_version: "${ev_v}" }
              as: PromoterAdmin
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${ev}/open-general"
              payload: { expected_event_version: "${ev_v2}" }
              as: PromoterAdmin
            - call: "POST /fans"
