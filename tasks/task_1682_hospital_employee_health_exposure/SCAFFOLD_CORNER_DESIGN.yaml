        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: titer_referential_beats_temporal
          rationale: "Dual-failure priority conflict asserted in the named §1.8 instance."

  - section: endpoints
    instances:
      - name: response_envelope_shape_object_and_error
        claim_type: crud
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "Success envelope carries meta.api_request_id, meta.api_request_timestamp, response_type 'object', data; error envelope carries response_type 'error' and data.error_id/data.message."
        test_recipe:
          setup: ["One employee registered (second create with same ref triggers the error envelope)"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-P1", full_name: "Env Elope", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
          trigger:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-P1", full_name: "Env Elope Again", job_category: "NURSE", department: "ICU", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { err: $.data.error_id }
          assert:
            - "First response: response_type == 'object', meta.api_request_id present, data.id present, http 201"
            - "Second response: response_type == 'error', data.error_id == ERR_DUPLICATE_EMPLOYEE_REF, data.message present, http 409"

      - name: exposure_case_list_filter_by_status
        claim_type: crud
        grounds: ["endpoints", "entities.ExposureCase"]
        distinguishing_aspect: "Filtered list: two cases, one advanced to EVALUATION; case_status=REPORTED returns exactly the un-advanced one."
        test_recipe:
          setup: ["Employee with two LOW cases; case2 advanced to EVALUATION"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-P2", full_name: "Fil Ter", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "SKIN_CONTACT", exposure_datetime: "2026-07-30T10:00:00Z", source_known: false, body_fluid: "NON_INFECTIOUS" }
              as: EmployeeHealthNurse
              captures: { case1: $.data.id }
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "SKIN_CONTACT", exposure_datetime: "2026-07-30T11:00:00Z", source_known: false, body_fluid: "NON_INFECTIOUS" }
              as: EmployeeHealthNurse
              captures: { case2: $.data.id }
            - call: "POST /employee-health/exposure-cases/${case2}/transition"
              payload: { to_state: "EVALUATION" }
              as: EmployeeHealthPhysician
          trigger:
            - call: "GET /employee-health/exposure-cases"
              payload: { employee_id: "${emp_id}", case_status: "REPORTED" }
              as: EmployeeHealthNurse
            - call: "GET /employee-health/exposure-cases"
              payload: { employee_id: "${emp_id}", case_status: "EVALUATION" }
              as: EmployeeHealthNurse
          assert:
            - "REPORTED filter: exactly 1 row with id ${case1}"
            - "EVALUATION filter: exactly 1 row with id ${case2}"

      - name: coverage_computed_read_endpoint
        claim_type: computed_read
        grounds: ["endpoints", "calculations.campaign_coverage_rate"]
        excluded_because:
          difficulty_instance: coverage_per_department_rounding_order
          rationale: "Computed read exercised with pinned rounding literals in the named §1.8 instance."

  - section: errors
    instances:
      - name: err_pep_window_expired_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_PEP_WINDOW_EXPIRED]", "calculations.pep_window_assessment"]
        distinguishing_aspect: "Isolated trigger for ERR_PEP_WINDOW_EXPIRED (422): regimen still RECOMMENDED and now inside the window, but started_at (2026-08-14T09:00:00Z) is past the deadline (2026-08-13T09:00:00Z) — safety check (priority 5) beats the temporal future-check (priority 7)."
        test_recipe:
          setup: ["Employee; MEDIUM case exposure 2026-08-10T09:00:00Z (deadline 2026-08-13T09:00:00Z); clock 2026-08-11T09:00:00Z so the regimen is still RECOMMENDED"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-ER1", full_name: "Late Pep", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T10:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/employees/${emp_id}/exposure-cases"
              payload: { exposure_type: "PERCUTANEOUS", exposure_datetime: "2026-08-10T09:00:00Z", source_known: false, body_fluid: "BLOOD" }
              as: EmployeeHealthNurse
              captures: { case_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /employee-health/pep-regimens"
              payload: { exposure_case_id: "${case_id}" }
              as: EmployeeHealthPhysician
              captures: { pep_id: "$.data[0].id" }
          trigger:
            - call: "POST /employee-health/pep-regimens/${pep_id}/transition"
              payload: { to_state: "STARTED", started_at: "2026-08-14T09:00:00Z" }
              as: EmployeeHealthPhysician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PEP_WINDOW_EXPIRED (422); regimen stays RECOMMENDED"

      - name: err_hold_not_active_on_double_release
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLD_NOT_ACTIVE]", "state_machines.ComplianceHold.ACTIVE_to_RELEASED"]
        distinguishing_aspect: "Releasing an already-RELEASED hold fails ERR_HOLD_NOT_ACTIVE (409) and does not decrement active_hold_count a second time."
        test_recipe:
          setup: ["ACTIVE employee; 2025 cycle OVERDUE (clock 2026-08-01T00:00:01Z) -> hold applied; TB completed (SATISFIED); hold released once"]
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-ER2", full_name: "Double Release", job_category: "NURSE", department: "MED", hire_date: "2024-06-01T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employee-health/employees/${emp_id}/pre-placement-screenings"
              payload: { expected_employee_version: "${emp_v}" }
              as: EmployeeHealthNurse
              captures: { scr_id: $.data.id }
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "PHYSICAL", completed_at: "2026-07-20T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/components/complete"
              payload: { component: "TB_BASELINE", completed_at: "2026-07-21T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "HEP_B", assay_type: "QUANTITATIVE", numeric_value: 15.0, resulted_at: "2026-07-22T09:00:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/employees/${emp_id}/titer-results"
              payload: { disease: "VARICELLA", assay_type: "QUANTITATIVE", numeric_value: 2.5, resulted_at: "2026-07-22T09:30:00Z" }
              as: EmployeeHealthNurse
            - call: "POST /employee-health/pre-placement-screenings/${scr_id}/decide"
              payload: { outcome: "CLEARED" }
              as: EmployeeHealthPhysician
            - call: "POST /employee-health/employees/${emp_id}/annual-requirement-cycles"
              payload: { cycle_year: 2025, cycle_mode: "CALENDAR_YEAR" }
              as: ComplianceOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:01Z" }
              as: ComplianceOfficer
            - call: "POST /employee-health/annual-requirement-cycles/${cyc_id}/completions"
              payload: { requirement_type: "TB_SCREENING", completed_at: "2026-08-01T00:00:01Z" }
              as: EmployeeHealthNurse
            - call: "GET /employee-health/compliance-holds"
              payload: { employee_id: "${emp_id}" }
              as: ComplianceOfficer
              captures: { hold_id: "$.data[0].id" }
            - call: "POST /employee-health/compliance-holds/${hold_id}/release"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /employee-health/compliance-holds/${hold_id}/release"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "GET /employee-health/employees/${emp_id}"
              as: ComplianceOfficer
              captures: { holds_after: $.data.active_hold_count }
          assert:
            - "error_id == ERR_HOLD_NOT_ACTIVE (409)"
            - "${holds_after} == 0 (no double decrement); hold stays RELEASED"

      - name: err_underlying_requirement_unmet
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNDERLYING_REQUIREMENT_UNMET]"]
        excluded_because:
          difficulty_instance: hold_release_requires_cycle_satisfied
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_restriction_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESTRICTION_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: clearance_decide_requires_restriction_active
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: err_work_restriction_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_WORK_RESTRICTION_OVERLAP]"]
        excluded_because:
          difficulty_instance: work_restriction_half_open_overlap
          rationale: "Asserted with half-open adjacency contrast in the named §1.8 instance."

      - name: err_campaign_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAMPAIGN_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: campaign_closed_interval_touch_conflict
          rationale: "Asserted with closed-interval touching contrast in the named §1.8 instance."

      - name: err_screening_employee_mismatch
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCREENING_EMPLOYEE_MISMATCH]"]
        excluded_because:
          difficulty_instance: titer_referential_beats_temporal
          rationale: "Asserted as the winning error of the priority conflict in the named §1.8 instance."

