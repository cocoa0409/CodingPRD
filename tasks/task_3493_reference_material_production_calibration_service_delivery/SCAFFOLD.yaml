# =============================================================================
# SCAFFOLD — Reference Material Production & Calibration Service Delivery
# (NIST-style national metrology institute operations)
# =============================================================================

scenario: |
  Reference Material Production & Calibration Service Delivery (National Institute of Standards and Technology): standard reference material development with candidate material sourcing, homogeneity testing and value assignment through multiple independent methods, uncertainty budget construction and certificate of analysis publication with expiration and recertification, inventory management for materials with limited production runs and customer allocation during shortages, calibration services for customer artifacts with measurement traceability chains and turnaround scheduling, laboratory accreditation program support with proficiency testing and measurement assurance, documentary standards and measurement guidance publication with industry engagement, interlaboratory comparison studies to establish measurement equivalence, cost recovery pricing for materials and services

domain_name: reference-material-calibration
api_prefix: /metrology

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency      # OCC on Program (pricing-update) and MaterialLot (certificate create-with-supersede)
    - cascading_side_effects      # cert expiry -> lot hold -> order block; PT evaluation -> standing -> credit hold
    - dual_variant_calculation    # WEIGHTED vs UNWEIGHTED value assignment; ORDER_DATE vs SHIP_DATE pricing
    - scheduled_actions           # logical clock drives certificate expiration sweep
  entity_topology: flat           # peer entities with FK references; no URL nesting except sub-resource reverse GETs
  state_machine_shape: cyclic     # lot retest loop, method resubmit loop, calibration hold loop, PT reopen loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # cert publisher / method acceptor must differ from method analyst
  consistency_model: immediate        # all mutations visible in the same response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ReferenceMaterialProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code; duplicate rejected with ERR_DUPLICATE_PROGRAM_CODE" }
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: material_unit_price_cents, type: integer, source: input, description: "Current base price per material unit in cents (cost-recovery price); mutated only via pricing-update" }
      - { name: discount_pct_federal, type: integer, source: input, description: "Percent discount for FEDERAL tier customers (0-100)" }
      - { name: discount_pct_accredited_lab, type: integer, source: input, description: "Percent discount for ACCREDITED_LAB tier customers (0-100)" }
      - { name: discount_pct_general, type: integer, source: input, description: "Percent discount for GENERAL tier customers (0-100)" }
      - { name: handling_fee_threshold_cents, type: integer, source: input, description: "Invoice subtotal at or above which the flat handling fee is waived" }
      - { name: handling_fee_flat_cents, type: integer, source: input, description: "Flat handling fee added when invoice subtotal < handling_fee_threshold_cents" }
      - { name: expedite_multiplier_pct, type: integer, source: input, description: "Expedited calibration fee multiplier as integer percent (e.g. 150 = 1.5x)" }
      - { name: daily_lab_capacity_minutes, type: integer, source: input, description: "Aggregate lab scheduling capacity per UTC calendar day across all calibration orders" }

  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> ReferenceMaterialProgram.id" }
      - { name: material_code, type: string, source: input, description: "Catalog code, e.g. SRM-9090" }
      - { name: matrix_description, type: string, source: input, description: "Material matrix description" }
      - { name: total_units_produced, type: integer, source: input, description: "Units produced in this limited run (>= 1); immutable" }
      - { name: qc_units_consumed, type: integer, source: computed, default: 0, description: "Units destroyed by homogeneity testing and PT sample distribution" }
      - { name: units_reserved, type: integer, source: computed, default: 0, description: "Units committed to ALLOCATED sales orders or distributed PT rounds" }
      - { name: units_shipped, type: integer, source: computed, default: 0, description: "Units shipped on FULFILLED orders" }
      - { name: units_available, type: integer, source: computed, description: "= total_units_produced - qc_units_consumed - units_reserved - units_shipped" }
      - { name: allocation_policy, type: enum, source: input, default: FIFO, description: "FIFO | PRO_RATA — shortage allocation policy for BACKORDERED orders" }
      - { name: homogeneity_f_ratio, type: number, source: computed, description: "Between-bottle variance / within-bottle variance from latest homogeneity test; null before first test; stored at 6dp round_half_up" }
      - { name: homogeneity_u_hom, type: number, source: computed, description: "Homogeneity uncertainty component from latest test; 6dp round_half_up; null before first test" }
      - { name: homogeneity_verdict, type: enum, source: computed, description: "PASS | FAIL | null — PASS iff homogeneity_f_ratio <= F_CRITICAL (3.0)" }
      - { name: hold_reason, type: enum, source: system, description: "CERTIFICATE_EXPIRED | CERTIFICATE_WITHDRAWN | null — set when entering DISTRIBUTION_HOLD" }
      - { name: status, type: enum, source: system, description: "SOURCING | HOMOGENEITY_TESTING | VALUE_ASSIGNMENT | CERTIFICATION_PENDING | CERTIFIED | IN_DISTRIBUTION | DISTRIBUTION_HOLD | DEPLETED | WITHDRAWN" }

  - name: ValueAssignmentMethod
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> MaterialLot.id" }
      - { name: method_code, type: string, source: input, description: "Analytical method identifier, e.g. ID-ICP-MS" }
      - { name: analyst_user_id, type: string, source: system, description: "X-User-ID of the submitting Metrologist" }
      - { name: method_mean, type: number, source: input, description: "Method mean value (> 0)" }
      - { name: method_std_uncertainty, type: number, source: input, description: "Method standard uncertainty (> 0)" }
      - { name: rejection_reason, type: string, source: input, description: "Reason recorded on REJECTED transition; null otherwise" }
      - { name: status, type: enum, source: system, description: "DATA_SUBMITTED | ACCEPTED | REJECTED" }

  - name: CertificateOfAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> MaterialLot.id" }
      - { name: certificate_code, type: string, source: input, description: "Certificate identifier string" }
      - { name: value_assignment_variant, type: enum, source: input, description: "WEIGHTED_MEAN | UNWEIGHTED_MEAN — value assignment algorithm selection" }
      - { name: uncertainty_components, type: array, source: input, description: "Extra Type-B budget components: [{label, std_uncertainty}], may be empty" }
      - { name: certified_value, type: number, source: computed, description: "Value assigned per variant over ACCEPTED methods of the lot; 6dp round_half_up" }
      - { name: characterization_uncertainty, type: number, source: computed, description: "u_char per variant; 6dp round_half_up" }
      - { name: combined_standard_uncertainty, type: number, source: computed, description: "u_c = sqrt(u_char^2 + u_hom^2 + sum(component^2)); rounded to 6dp half-up BEFORE doubling" }
      - { name: expanded_uncertainty, type: number, source: computed, description: "U = round_half_up(COVERAGE_K * combined_standard_uncertainty, 6dp); COVERAGE_K = 2" }
      - { name: coverage_factor, type: integer, source: system, default: 2, description: "k = 2" }
      - { name: validity_days, type: integer, source: input, description: "Validity window in days (>= 1)" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock value at publish; null while DRAFT" }
      - { name: expiration_date, type: datetime, source: computed, description: "= published_at + validity_days days; null while DRAFT" }
      - { name: publisher_user_id, type: string, source: system, description: "X-User-ID of the CertificationOfficer who published; null while DRAFT" }
      - { name: supersedes_certificate_id, type: string, source: system, description: "id of the previously PUBLISHED certificate for this lot superseded at publish; null if none" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | EXPIRED | SUPERSEDED | WITHDRAWN" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer organization name" }
      - { name: tier, type: enum, source: input, description: "FEDERAL | ACCREDITED_LAB | GENERAL — pricing discount tier and PRO_RATA weight" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit limit (>= 0); informational ceiling" }
      - { name: pt_fail_count, type: integer, source: computed, default: 0, description: "Count of FAIL evaluations across PROFICIENCY_TEST rounds; decremented on round reopen" }
      - { name: accreditation_standing, type: enum, source: computed, description: "GOOD_STANDING (fails <= 1) | PROBATION (fails == 2) | SUSPENDED (fails >= 3)" }
      - { name: credit_hold, type: boolean, source: computed, default: false, description: "true iff pt_fail_count >= 3 (SUSPENDED); blocks sales-order creation" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> MaterialLot.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; optional for Customer role (defaults to X-User-ID), required for InventoryManager" }
      - { name: quantity, type: integer, source: input, description: "Units requested (>= 1)" }
      - { name: allocated_quantity, type: integer, source: computed, default: 0, description: "Units currently reserved for this order (0..quantity)" }
      - { name: quoted_unit_price_cents, type: integer, source: computed, description: "Unit price at creation: round_half_up(material_unit_price_cents * (1 - tier_discount/100)) — ORDER_DATE variant" }
      - { name: final_unit_price_cents, type: integer, source: computed, description: "Unit price recomputed from program pricing at fulfillment — SHIP_DATE variant; null until FULFILLED" }
      - { name: invoice_subtotal_cents, type: integer, source: computed, description: "= allocated_quantity * final_unit_price_cents at fulfillment; null until FULFILLED" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "= handling_fee_flat_cents iff invoice_subtotal_cents < handling_fee_threshold_cents else 0; null until FULFILLED" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "= invoice_subtotal_cents + handling_fee_cents; null until FULFILLED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Logical clock value at fulfillment; null until FULFILLED" }
      - { name: status, type: enum, source: system, description: "PLACED | ALLOCATED | BACKORDERED | FULFILLED | CANCELLED" }

  - name: CalibrationServiceOffering
    parent: null
    common_fields: true
    fields:
      - { name: service_code, type: string, source: input, description: "Unique service code; duplicate rejected with ERR_DUPLICATE_SERVICE_CODE" }
      - { name: measurand, type: string, source: input, description: "Measured quantity, e.g. DC voltage" }
      - { name: base_fee_cents, type: integer, source: input, description: "Flat base fee (>= 0)" }
      - { name: per_point_fee_cents, type: integer, source: input, description: "Fee per measurement point (>= 0)" }
      - { name: standard_turnaround_days, type: integer, source: input, description: "Standard turnaround class in days (>= 1)" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | RETIRED — RETIRED services reject new scheduling" }

  - name: CalibrationOrder
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> CalibrationServiceOffering.id" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; optional for Customer role (defaults to X-User-ID)" }
      - { name: artifact_description, type: string, source: input, description: "Customer artifact description" }
      - { name: measurement_points, type: integer, source: input, description: "Number of measurement points (>= 1)" }
      - { name: expedite_requested, type: boolean, source: input, default: false, description: "Expedited turnaround branch flag" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "= base_fee_cents + per_point_fee_cents * measurement_points at creation" }
      - { name: final_fee_cents, type: integer, source: computed, description: "= quoted_fee_cents, or round_half_up(quoted_fee_cents * expedite_multiplier_pct / 100) when expedite_requested; set at scheduling" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled window start (ISO8601); null until SCHEDULED" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled window end (ISO8601); null until SCHEDULED" }
      - { name: duration_minutes, type: integer, source: computed, description: "= (scheduled_end - scheduled_start) in whole minutes; null until SCHEDULED" }
      - { name: resolved_traceability_link_id, type: string, source: system, description: "id of the traceability link selected at scheduling (latest calibrated_date); null until SCHEDULED" }
      - { name: result, type: enum, source: input, description: "IN_TOLERANCE | OUT_OF_TOLERANCE — recorded on completion; null until COMPLETED" }
      - { name: measured_correction, type: number, source: input, description: "Measured correction value recorded on completion; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SCHEDULED | IN_MEASUREMENT | MEASUREMENT_HOLD | COMPLETED | CANCELLED" }

  - name: TraceabilityLink
    parent: null
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> CalibrationServiceOffering.id" }
      - { name: standard_description, type: string, source: input, description: "Working/reference standard description" }
      - { name: calibrated_by_lab, type: string, source: input, description: "Lab that calibrated the standard" }
      - { name: calibrated_date, type: datetime, source: input, description: "Calibration date of the standard" }
      - { name: calibration_due_date, type: datetime, source: input, description: "Recalibration due date; chain intact iff due_date >= scheduled_end" }
      - { name: uncertainty_contribution, type: number, source: input, description: "Standard uncertainty contributed by this link (> 0)" }

  - name: PTRound
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> MaterialLot.id — the test material lot" }
      - { name: round_code, type: string, source: input, description: "Round identifier, e.g. PT-2026-04" }
      - { name: round_type, type: enum, source: input, description: "PROFICIENCY_TEST | KEY_COMPARISON — selects evaluation algorithm" }
      - { name: sample_units_reserved, type: integer, source: input, description: "Lot units reserved as test samples (>= 1); consumed at CLOSED" }
      - { name: assigned_value, type: number, source: computed, description: "PT: lot's PUBLISHED certificate certified_value; KC: inverse-variance weighted mean of SUBMITTED results; set at EVALUATION" }
      - { name: reference_uncertainty, type: number, source: computed, description: "PT: certificate expanded_uncertainty; KC: sqrt(1/sum(1/u_i^2)); set at EVALUATION" }
      - { name: chi_squared, type: number, source: computed, description: "KC only: sum(((x_i - assigned_value)/u_i)^2); 6dp; null for PT" }
      - { name: consistency_verdict, type: enum, source: computed, description: "KC only: CONSISTENT iff chi_squared <= n-1 else INCONSISTENT; null for PT" }
      - { name: evaluated_count, type: integer, source: computed, default: 0, description: "Number of participant results evaluated" }
      - { name: status, type: enum, source: system, description: "PLANNING | SAMPLE_DISTRIBUTION | ANALYSIS_OPEN | EVALUATION | CLOSED" }

  - name: PTParticipantResult
    parent: null
    common_fields: true
    fields:
      - { name: round_id, type: string, source: input, description: "FK -> PTRound.id" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id — participating laboratory; equals X-User-ID of submitting Customer" }
      - { name: lab_code, type: string, source: input, description: "Laboratory code string" }
      - { name: measured_value, type: number, source: input, description: "Reported measurement" }
      - { name: measurement_uncertainty, type: number, source: input, description: "Reported standard uncertainty (> 0)" }
      - { name: z_score, type: number, source: computed, description: "PT only: (measured_value - assigned_value) / reference_uncertainty; 3dp round_half_up; null until EVALUATION" }
      - { name: degree_of_equivalence, type: number, source: computed, description: "KC only: measured_value - assigned_value; 6dp; null until EVALUATION" }
      - { name: equivalence_uncertainty, type: number, source: computed, description: "KC only: 2 * sqrt(u_i^2 + u_ref^2); 6dp; null until EVALUATION" }
      - { name: performance_flag, type: enum, source: computed, description: "PASS | FAIL | null — PT: |z_score| <= 2.0; KC: |degree_of_equivalence| <= equivalence_uncertainty" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | EVALUATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MaterialLot
    initial_state: SOURCING
    terminal_states: [DEPLETED, WITHDRAWN]
    transitions:
      - from: SOURCING
        to: HOMOGENEITY_TESTING
        trigger: "POST /metrology/material-lots/{id}/transitions {to: HOMOGENEITY_TESTING, bottle_means, within_bottle_std, replicates_per_bottle}"
        actor: Metrologist
        preconditions:
          - "lot.status == SOURCING (ERR_INVALID_LOT_STATE)"
          - "len(bottle_means) >= 2, within_bottle_std > 0, replicates_per_bottle >= 1 (ERR_INVALID_REQUEST)"
          - "len(bottle_means) <= lot.units_available (ERR_INSUFFICIENT_UNITS)"
        side_effects:
          - "qc_units_consumed += len(bottle_means)"
          - "homogeneity stats computed (calculation homogeneity_assessment); verdict stored on lot"
          - "if verdict == PASS: status auto-advances to VALUE_ASSIGNMENT in the same request"
          - "if verdict == FAIL: status stays HOMOGENEITY_TESTING"
          - "increments MaterialLot.version by 1"
      - from: HOMOGENEITY_TESTING
        to: HOMOGENEITY_TESTING
        trigger: "POST /metrology/material-lots/{id}/transitions {to: HOMOGENEITY_TESTING, ...} (self-loop retest after FAIL)"
        actor: Metrologist
        preconditions:
          - "lot.status == HOMOGENEITY_TESTING (ERR_INVALID_LOT_STATE)"
          - "same payload and unit-availability checks as SOURCING -> HOMOGENEITY_TESTING"
        side_effects:
          - "qc_units_consumed += len(bottle_means)"
          - "homogeneity stats recomputed and overwrite prior values"
          - "if verdict == PASS: status auto-advances to VALUE_ASSIGNMENT"
          - "increments MaterialLot.version by 1"
      - from: VALUE_ASSIGNMENT
        to: HOMOGENEITY_TESTING
        trigger: "POST /metrology/material-lots/{id}/transitions {to: HOMOGENEITY_TESTING, ...} (homogeneity retest cycle)"
        actor: Metrologist
        preconditions:
          - "lot.status == VALUE_ASSIGNMENT (ERR_INVALID_LOT_STATE)"
          - "same payload and unit-availability checks"
        side_effects:
          - "qc_units_consumed += len(bottle_means); stats recomputed"
          - "if verdict == PASS: status returns to VALUE_ASSIGNMENT"
          - "increments MaterialLot.version by 1"
      - from: CERTIFIED
        to: IN_DISTRIBUTION
        trigger: "POST /metrology/material-lots/{id}/transitions {to: IN_DISTRIBUTION}"
        actor: InventoryManager
        preconditions:
          - "lot.status == CERTIFIED (ERR_INVALID_LOT_STATE)"
          - "a certificate for this lot exists with status == PUBLISHED and expiration_date > current clock (ERR_NO_PUBLISHED_CERTIFICATE)"
        side_effects:
          - "increments MaterialLot.version by 1"
      - from: IN_DISTRIBUTION
        to: DISTRIBUTION_HOLD
        trigger: "system (automatic when the lot's PUBLISHED certificate becomes EXPIRED via clock sweep, or is WITHDRAWN)"
        actor: system
        preconditions:
          - "lot.status == IN_DISTRIBUTION"
        side_effects:
          - "hold_reason set to CERTIFICATE_EXPIRED or CERTIFICATE_WITHDRAWN"
          - "increments MaterialLot.version by 1"
      - from: DISTRIBUTION_HOLD
        to: IN_DISTRIBUTION
        trigger: "system (automatic when a new certificate for the lot is PUBLISHED)"
        actor: system
        preconditions:
          - "lot.status == DISTRIBUTION_HOLD"
        side_effects:
          - "hold_reason cleared to null"
          - "allocation sweep runs over the lot's BACKORDERED orders (calculation shortage_allocation)"
          - "increments MaterialLot.version by 1"
      - from: IN_DISTRIBUTION
        to: DEPLETED
        trigger: "POST /metrology/material-lots/{id}/transitions {to: DEPLETED}"
        actor: InventoryManager
        preconditions:
          - "lot.status == IN_DISTRIBUTION (ERR_INVALID_LOT_STATE)"
          - "units_available == 0 (ERR_INVALID_LOT_STATE when units remain)"
        side_effects:
          - "increments MaterialLot.version by 1"
        note: "depletion is an explicit operator action; reaching zero availability does NOT auto-deplete — a lot with BACKORDERED orders and zero stock stays IN_DISTRIBUTION so later releases or recertification sweeps can still promote waitlisted orders"
      - from: CERTIFICATION_PENDING
        to: CERTIFIED
        trigger: "system (automatic when the DRAFT certificate is PUBLISHED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments MaterialLot.version by 1"
      - from: CERTIFICATION_PENDING
        to: VALUE_ASSIGNMENT
        trigger: "system (automatic when the lot's DRAFT certificate is WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects:
          - "increments MaterialLot.version by 1"
      - from: VALUE_ASSIGNMENT
        to: CERTIFICATION_PENDING
        trigger: "system (automatic on POST /metrology/certificates when lot was VALUE_ASSIGNMENT)"
        actor: system
        preconditions: []
        side_effects:
          - "increments MaterialLot.version by 1"
      - from: ANY_NON_TERMINAL
        to: WITHDRAWN
        trigger: "POST /metrology/material-lots/{id}/transitions {to: WITHDRAWN}"
        actor: InventoryManager
        preconditions:
          - "lot.status in {SOURCING, HOMOGENEITY_TESTING, VALUE_ASSIGNMENT, CERTIFICATION_PENDING, CERTIFIED, IN_DISTRIBUTION, DISTRIBUTION_HOLD} (ERR_INVALID_LOT_STATE)"
          - "no SalesOrder for this lot in ALLOCATED status (ERR_OPEN_ORDERS_EXIST)"
        side_effects:
          - "all BACKORDERED orders for the lot -> CANCELLED (their allocated_quantity, if any, released first)"
          - "all PLANNING/SAMPLE_DISTRIBUTION/ANALYSIS_OPEN PT rounds for the lot are unaffected (terminal lots keep PT state)"
          - "increments MaterialLot.version by 1"
        note: "ANY_NON_TERMINAL denotes the explicit set listed in preconditions; DEPLETED and WITHDRAWN reject with ERR_INVALID_LOT_STATE"

  - entity: ValueAssignmentMethod
    initial_state: DATA_SUBMITTED
    terminal_states: []
    transitions:
      - from: DATA_SUBMITTED
        to: ACCEPTED
        trigger: "POST /metrology/value-assignment-methods/{id}/transitions {to: ACCEPTED}"
        actor: CertificationOfficer
        preconditions:
          - "method.status == DATA_SUBMITTED (ERR_INVALID_METHOD_STATE)"
          - "acting user id != method.analyst_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "method's lot status in {VALUE_ASSIGNMENT, CERTIFICATION_PENDING, CERTIFIED, IN_DISTRIBUTION, DISTRIBUTION_HOLD} (ERR_INVALID_LOT_STATE)"
        side_effects: []
      - from: DATA_SUBMITTED
        to: REJECTED
        trigger: "POST /metrology/value-assignment-methods/{id}/transitions {to: REJECTED, rejection_reason}"
        actor: CertificationOfficer
        preconditions:
          - "method.status == DATA_SUBMITTED (ERR_INVALID_METHOD_STATE)"
          - "acting user id != method.analyst_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "rejection_reason stored"
      - from: REJECTED
        to: DATA_SUBMITTED
        trigger: "POST /metrology/value-assignment-methods/{id}/transitions {to: DATA_SUBMITTED, method_mean, method_std_uncertainty} (resubmit cycle)"
        actor: Metrologist
        preconditions:
          - "method.status == REJECTED (ERR_INVALID_METHOD_STATE)"
          - "acting user id == method.analyst_user_id (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "method_mean and method_std_uncertainty overwritten by payload values"
          - "rejection_reason cleared to null"

  - entity: CertificateOfAnalysis
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /metrology/certificates/{id}/transitions {to: PUBLISHED}"
        actor: CertificationOfficer
        preconditions:
          - "certificate.status == DRAFT (ERR_INVALID_CERTIFICATE_STATE)"
          - "acting user id != analyst_user_id of every ACCEPTED method on the lot (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "published_at = current logical clock; expiration_date = published_at + validity_days days; publisher_user_id = acting user"
          - "prior PUBLISHED certificate for the same lot, if any, -> SUPERSEDED; this certificate's supersedes_certificate_id set to its id"
          - "lot CERTIFICATION_PENDING -> CERTIFIED; lot DISTRIBUTION_HOLD -> IN_DISTRIBUTION (with allocation sweep); lot CERTIFIED or IN_DISTRIBUTION unchanged"
          - "increments CertificateOfAnalysis.version by 1 and MaterialLot.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /metrology/certificates/{id}/transitions {to: WITHDRAWN}"
        actor: CertificationOfficer
        preconditions:
          - "certificate.status in {DRAFT, PUBLISHED} (ERR_INVALID_CERTIFICATE_STATE)"
        side_effects:
          - "if lot.status == CERTIFICATION_PENDING: lot -> VALUE_ASSIGNMENT"
          - "increments CertificateOfAnalysis.version by 1"
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /metrology/certificates/{id}/transitions {to: WITHDRAWN}"
        actor: CertificationOfficer
        preconditions:
          - "certificate.status in {DRAFT, PUBLISHED} (ERR_INVALID_CERTIFICATE_STATE)"
        side_effects:
          - "if lot.status == IN_DISTRIBUTION: lot -> DISTRIBUTION_HOLD with hold_reason = CERTIFICATE_WITHDRAWN"
          - "increments CertificateOfAnalysis.version by 1 and (when hold fires) MaterialLot.version by 1"
      - from: PUBLISHED
        to: EXPIRED
        trigger: "system (clock sweep on POST /_clock/set_current_utc when expiration_date <= new clock value)"
        actor: system
        preconditions:
          - "certificate.status == PUBLISHED and expiration_date <= current clock"
        side_effects:
          - "if lot.status == IN_DISTRIBUTION: lot -> DISTRIBUTION_HOLD with hold_reason = CERTIFICATE_EXPIRED"
          - "increments CertificateOfAnalysis.version by 1 and (when hold fires) MaterialLot.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when a newer certificate for the same lot is PUBLISHED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments CertificateOfAnalysis.version by 1"

  - entity: SalesOrder
    initial_state: PLACED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLACED
        to: ALLOCATED
        trigger: "system (synchronous allocation sweep at creation)"
        actor: system
        preconditions:
          - "allocated_quantity == quantity after sweep"
        side_effects:
          - "lot.units_reserved += allocated_quantity"
      - from: PLACED
        to: BACKORDERED
        trigger: "system (synchronous allocation sweep at creation leaves allocated_quantity < quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.units_reserved += allocated_quantity (may be 0)"
      - from: BACKORDERED
        to: ALLOCATED
        trigger: "system (allocation sweep promoted the order: allocated_quantity == quantity)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.units_reserved increased by swept amount"
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /metrology/sales-orders/{id}/transitions {to: FULFILLED}"
        actor: InventoryManager
        preconditions:
          - "order.status == ALLOCATED (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "final_unit_price_cents recomputed from current program pricing (SHIP_DATE variant)"
          - "invoice_subtotal_cents, handling_fee_cents, invoice_total_cents computed; fulfilled_at = clock"
          - "lot.units_reserved -= allocated_quantity; lot.units_shipped += allocated_quantity"
          - "increments SalesOrder.version by 1 and MaterialLot.version by 1"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "POST /metrology/sales-orders/{id}/transitions {to: BACKORDERED} (release)"
        actor: "Customer (own order) | InventoryManager"
        preconditions:
          - "order.status == ALLOCATED (ERR_INVALID_ORDER_STATE)"
          - "if actor role == Customer: order.customer_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "lot.units_reserved -= allocated_quantity; allocated_quantity = 0"
          - "allocation sweep runs over the lot's BACKORDERED orders (including this one; may promote OTHER orders)"
          - "increments SalesOrder.version by 1 and MaterialLot.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /metrology/sales-orders/{id}/transitions {to: CANCELLED}"
        actor: "Customer (own order) | InventoryManager"
        preconditions:
          - "order.status in {PLACED, ALLOCATED, BACKORDERED} (ERR_INVALID_ORDER_STATE)"
          - "if actor role == Customer: order.customer_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "lot.units_reserved -= allocated_quantity; allocated_quantity = 0; allocation sweep runs"
          - "increments SalesOrder.version by 1 and MaterialLot.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /metrology/sales-orders/{id}/transitions {to: CANCELLED}"
        actor: "Customer (own order) | InventoryManager"
        preconditions:
          - "order.status in {PLACED, ALLOCATED, BACKORDERED} (ERR_INVALID_ORDER_STATE)"
          - "if actor role == Customer: order.customer_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "lot.units_reserved -= allocated_quantity; allocated_quantity = 0; allocation sweep runs"
          - "increments SalesOrder.version by 1 and MaterialLot.version by 1"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /metrology/sales-orders/{id}/transitions {to: CANCELLED}"
        actor: "Customer (own order) | InventoryManager"
        preconditions:
          - "order.status in {PLACED, ALLOCATED, BACKORDERED} (ERR_INVALID_ORDER_STATE)"
          - "if actor role == Customer: order.customer_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "lot.units_reserved -= allocated_quantity; allocated_quantity = 0; allocation sweep runs"
          - "increments SalesOrder.version by 1 and MaterialLot.version by 1"

  - entity: CalibrationOrder
    initial_state: RECEIVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: SCHEDULED
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: SCHEDULED, scheduled_start, scheduled_end}"
        actor: CalibrationCoordinator
        preconditions:
          - "order.status == RECEIVED (ERR_INVALID_CALIBRATION_STATE)"
          - "scheduled_start < scheduled_end and duration is a whole number of minutes (ERR_INVALID_REQUEST)"
          - "scheduled_start >= current clock (ERR_WINDOW_IN_PAST)"
          - "traceability selector: latest TraceabilityLink of the service by calibrated_date (tie: created_at DESC) with calibrated_date <= scheduled_start exists and its calibration_due_date >= scheduled_end (ERR_TRACEABILITY_CHAIN_BROKEN)"
          - "no overlapping booking on the selected link: no other CalibrationOrder with resolved_traceability_link_id == selected link and status in {SCHEDULED, IN_MEASUREMENT, MEASUREMENT_HOLD} where existing.start < new.end AND new.start < existing.end (ERR_RESOURCE_WINDOW_CONFLICT); adjacency (end == start) is allowed"
          - "aggregate daily capacity: sum of duration_minutes over orders with status in {SCHEDULED, IN_MEASUREMENT, MEASUREMENT_HOLD} whose scheduled_start UTC date equals the new start's UTC date, plus the new duration, <= program.daily_lab_capacity_minutes (ERR_CAPACITY_EXCEEDED)"
          - "service.status == ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
        side_effects:
          - "resolved_traceability_link_id set; duration_minutes stored"
          - "final_fee_cents = expedite_requested ? round_half_up(quoted_fee_cents * expedite_multiplier_pct / 100) : quoted_fee_cents"
          - "increments CalibrationOrder.version by 1"
      - from: SCHEDULED
        to: IN_MEASUREMENT
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: IN_MEASUREMENT}"
        actor: Metrologist
        preconditions:
          - "order.status in {SCHEDULED, MEASUREMENT_HOLD} (ERR_INVALID_CALIBRATION_STATE)"
        side_effects:
          - "increments CalibrationOrder.version by 1"
      - from: MEASUREMENT_HOLD
        to: IN_MEASUREMENT
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: IN_MEASUREMENT} (resume from hold cycle)"
        actor: Metrologist
        preconditions:
          - "order.status in {SCHEDULED, MEASUREMENT_HOLD} (ERR_INVALID_CALIBRATION_STATE)"
        side_effects:
          - "increments CalibrationOrder.version by 1"
      - from: IN_MEASUREMENT
        to: MEASUREMENT_HOLD
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: MEASUREMENT_HOLD}"
        actor: Metrologist
        preconditions:
          - "order.status == IN_MEASUREMENT (ERR_INVALID_CALIBRATION_STATE)"
        side_effects:
          - "increments CalibrationOrder.version by 1"
      - from: IN_MEASUREMENT
        to: COMPLETED
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: COMPLETED, result, measured_correction}"
        actor: Metrologist
        preconditions:
          - "order.status == IN_MEASUREMENT (ERR_INVALID_CALIBRATION_STATE)"
          - "result in {IN_TOLERANCE, OUT_OF_TOLERANCE} (ERR_INVALID_REQUEST)"
        side_effects:
          - "result and measured_correction stored"
          - "increments CalibrationOrder.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: CANCELLED}"
        actor: "CalibrationCoordinator | Customer (own order)"
        preconditions:
          - "order.status in {RECEIVED, SCHEDULED} (ERR_INVALID_CALIBRATION_STATE)"
          - "if actor role == Customer: order.customer_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "frees the daily-capacity contribution (CANCELLED excluded from aggregate)"
          - "increments CalibrationOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /metrology/calibration-orders/{id}/transitions {to: CANCELLED}"
        actor: "CalibrationCoordinator | Customer (own order)"
        preconditions:
          - "order.status in {RECEIVED, SCHEDULED} (ERR_INVALID_CALIBRATION_STATE)"
          - "if actor role == Customer: order.customer_id == X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "frees the daily-capacity contribution and the traceability-link booking window"
          - "increments CalibrationOrder.version by 1"

  - entity: PTRound
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: SAMPLE_DISTRIBUTION
        trigger: "POST /metrology/pt-rounds/{id}/transitions {to: SAMPLE_DISTRIBUTION}"
        actor: AccreditationOfficer
        preconditions:
          - "round.status == PLANNING (ERR_INVALID_ROUND_STATE)"
          - "lot.status == IN_DISTRIBUTION (ERR_LOT_NOT_DISTRIBUTABLE)"
          - "lot.units_available >= sample_units_reserved (ERR_INSUFFICIENT_UNITS)"
        side_effects:
          - "lot.units_reserved += sample_units_reserved"
          - "increments PTRound.version by 1 and MaterialLot.version by 1"
      - from: SAMPLE_DISTRIBUTION
        to: ANALYSIS_OPEN
        trigger: "POST /metrology/pt-rounds/{id}/transitions {to: ANALYSIS_OPEN}"
        actor: AccreditationOfficer
        preconditions:
          - "round.status == SAMPLE_DISTRIBUTION (ERR_INVALID_ROUND_STATE)"
        side_effects:
          - "increments PTRound.version by 1"
      - from: ANALYSIS_OPEN
        to: EVALUATION
        trigger: "POST /metrology/pt-rounds/{id}/transitions {to: EVALUATION}"
        actor: AccreditationOfficer
        preconditions:
          - "round.status == ANALYSIS_OPEN (ERR_INVALID_ROUND_STATE)"
          - "SUBMITTED result count >= 1 for PROFICIENCY_TEST, >= 2 for KEY_COMPARISON (ERR_INSUFFICIENT_RESULTS)"
          - "for PROFICIENCY_TEST: a PUBLISHED certificate exists for the lot (ERR_NO_REFERENCE_CERTIFICATE)"
        side_effects:
          - "evaluation runs (calculation pt_evaluation or kc_evaluation by round_type)"
          - "all SUBMITTED results -> EVALUATED with computed scores/flags; evaluated_count set"
          - "for PROFICIENCY_TEST: each FAIL result increments its customer.pt_fail_count by 1 and recomputes accreditation_standing / credit_hold"
          - "increments PTRound.version by 1"
      - from: EVALUATION
        to: ANALYSIS_OPEN
        trigger: "POST /metrology/pt-rounds/{id}/transitions {to: ANALYSIS_OPEN} (reopen cycle)"
        actor: AccreditationOfficer
        preconditions:
          - "round.status == EVALUATION (ERR_INVALID_ROUND_STATE)"
        side_effects:
          - "all EVALUATED results -> SUBMITTED; z_score / degree_of_equivalence / equivalence_uncertainty / performance_flag cleared to null"
          - "for PROFICIENCY_TEST: each previously-FAIL result decrements its customer.pt_fail_count by 1 and recomputes accreditation_standing / credit_hold (compensation)"
          - "assigned_value, reference_uncertainty, chi_squared, consistency_verdict cleared; evaluated_count reset to 0"
          - "increments PTRound.version by 1"
      - from: EVALUATION
        to: CLOSED
        trigger: "POST /metrology/pt-rounds/{id}/transitions {to: CLOSED}"
        actor: AccreditationOfficer
        preconditions:
          - "round.status == EVALUATION (ERR_INVALID_ROUND_STATE)"
        side_effects:
          - "lot.units_reserved -= sample_units_reserved; lot.qc_units_consumed += sample_units_reserved"
          - "increments PTRound.version by 1 and MaterialLot.version by 1"

  - entity: PTParticipantResult
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: EVALUATED
        trigger: "system (on round transition to EVALUATION)"
        actor: system
        preconditions: []
        side_effects:
          - "score fields computed per round_type"
      - from: EVALUATED
        to: SUBMITTED
        trigger: "system (on round reopen EVALUATION -> ANALYSIS_OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "score fields cleared to null"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — serial-observable)
# =============================================================================
concurrency_rules:
  - rule_id: pricing-update-stale-program
    parent_entity: ReferenceMaterialProgram
    write_endpoint: "POST /metrology/programs/{id}/pricing-update"
    occ_field: expected_program_version
    description: |
      A pricing-update whose expected_program_version no longer matches the
      program's current version is rejected. This captures the case where
      another writer has just applied a pricing update (which legitimately
      supersedes the prior pricing) and the current writer's view of the
      program is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: certificate-create-stale-lot
    parent_entity: MaterialLot
    write_endpoint: "POST /metrology/certificates"
    occ_field: expected_lot_version
    description: |
      Creating a certificate against a MaterialLot whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created or published a certificate (which
      legitimately supersedes the prior one) and the current writer's view of
      the lot is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: homogeneity_assessment
    trigger: "lot transition to HOMOGENEITY_TESTING (from SOURCING, HOMOGENEITY_TESTING, or VALUE_ASSIGNMENT)"
    algorithm: aggregation
    formula: |
      inputs: bottle_means[1..n] (n >= 2), within_bottle_std > 0, replicates_per_bottle >= 1
      grand_mean = sum(bottle_means) / n
      between_bottle_variance = sum((m_i - grand_mean)^2) / (n - 1)          # sample variance, ddof=1
      f_ratio = between_bottle_variance / (within_bottle_std^2)
      homogeneity_verdict = PASS iff f_ratio <= F_CRITICAL else FAIL
      u_hom = sqrt(max(0, between_bottle_variance - within_bottle_std^2 / replicates_per_bottle))
      store homogeneity_f_ratio and homogeneity_u_hom at 6 decimal places, round_half_up
    input_set: "the payload bottle_means of the current transition only; prior test values are overwritten"
    constants:
      F_CRITICAL: 3.0
    precision: "6 decimal places, round_half_up"

  - name: certified_value_assignment
    trigger: "POST /metrology/certificates (certificate creation)"
    algorithm: aggregation
    formula: |
      input set: all ValueAssignmentMethod rows for the lot with status == ACCEPTED
      variant WEIGHTED_MEAN:
        w_i = 1 / method_std_uncertainty_i^2
        certified_value = sum(method_mean_i * w_i) / sum(w_i)
        characterization_uncertainty (u_char) = sqrt(1 / sum(w_i))
      variant UNWEIGHTED_MEAN:
        certified_value = sum(method_mean_i) / n
        characterization_uncertainty = sqrt( sum((mean_i - certified_value)^2) / (n-1) ) / sqrt(n)
      store certified_value and characterization_uncertainty at 6 decimal places, round_half_up
    input_set: "ValueAssignmentMethod.status == ACCEPTED for the certificate's lot; REJECTED and DATA_SUBMITTED excluded"
    precision: "6 decimal places, round_half_up"
    variants:
      - name: WEIGHTED_MEAN
        when: "certificate created with value_assignment_variant == WEIGHTED_MEAN"
        difference: "inverse-variance weighted; lower-uncertainty methods dominate the value and u_char"
      - name: UNWEIGHTED_MEAN
        when: "certificate created with value_assignment_variant == UNWEIGHTED_MEAN"
        difference: "plain mean of method means; u_char is the standard error of the mean"

  - name: combined_uncertainty_budget
    trigger: "POST /metrology/certificates (certificate creation), after certified_value_assignment"
    algorithm: aggregation
    formula: |
      u_c = sqrt( u_char^2 + lot.homogeneity_u_hom^2 + sum(component.std_uncertainty^2) )
      ROUNDING ORDER IS PINNED: first round u_c to 6dp round_half_up and store as
      combined_standard_uncertainty; then expanded_uncertainty = round_half_up(COVERAGE_K *
      combined_standard_uncertainty, 6dp). Doubling the unrounded u_c is forbidden.
    input_set: "u_char from the chosen variant; lot.homogeneity_u_hom from the latest homogeneity test; payload uncertainty_components (may be empty)"
    constants:
      COVERAGE_K: 2
    precision: "6 decimal places, round_half_up; u_c rounded BEFORE doubling"

  - name: shortage_allocation
    trigger: "allocation sweep — runs after sales-order creation, release, cancel, and after lot DISTRIBUTION_HOLD -> IN_DISTRIBUTION"
    algorithm: waterfall_allocation
    formula: |
      GATE: the sweep allocates only when lot.status == IN_DISTRIBUTION; sweeps
      triggered while the lot is in any other state (e.g. DISTRIBUTION_HOLD)
      leave all candidates unchanged.
      EXCLUSION: a sweep triggered by an order release (ALLOCATED -> BACKORDERED)
      excludes the released order itself from candidacy in that run.
      pool = lot.units_available (computed fresh at sweep time)
      candidate set: SalesOrders of this lot with status == BACKORDERED and
        open_i = quantity - allocated_quantity > 0, minus any excluded order
      variant FIFO:
        iterate candidates ordered by created_at ASC, tie-break quantity ASC
        (two orders tied on both are interchangeable clones; tests distinguish
        candidates by creation order under the logical clock or by quantity)
        take_i = min(open_i, pool); allocated_quantity_i += take_i; lot.units_reserved += take_i; pool -= take_i
        stop when pool == 0 or candidates exhausted
      variant PRO_RATA:
        weight(tier): FEDERAL = 3, ACCREDITED_LAB = 2, GENERAL = 1
        S = sum(weight_i * open_i)
        share_i = min(open_i, floor(pool * weight_i * open_i / S))
        apply shares (allocated_quantity_i += share_i; units_reserved += share_i)
        leftover = pool - sum(share_i)
        distribute leftover one unit at a time cycling candidates ordered by
        weight DESC, then created_at ASC, then quantity ASC, skipping candidates
        with open_i == 0, until leftover == 0 or all open_i == 0
      any candidate reaching allocated_quantity == quantity transitions BACKORDERED -> ALLOCATED
    input_set: "BACKORDERED orders of the lot only; PLACED/ALLOCATED/FULFILLED/CANCELLED excluded"
    constants:
      TIER_WEIGHT_FEDERAL: 3
      TIER_WEIGHT_ACCREDITED_LAB: 2
      TIER_WEIGHT_GENERAL: 1
    precision: "integer units; floor for shares; no rounding of unit counts"

  - name: order_pricing
    trigger: "sales-order creation (quoted) and fulfillment (final)"
    algorithm: tiered_pricing
    formula: |
      unit_price(t) = round_half_up( program.material_unit_price_cents *
                                     (1 - discount_pct(tier) / 100) )   # integer cents, per-unit FIRST
      ROUNDING ORDER IS PINNED: the per-unit price is rounded to integer cents BEFORE
      multiplying by quantity; multiplying the unrounded unit price is forbidden.
      at creation (ORDER_DATE variant): quoted_unit_price_cents = unit_price(t_create)
      at fulfillment (SHIP_DATE variant): final_unit_price_cents = unit_price(t_fulfill)
      invoice_subtotal_cents = allocated_quantity * final_unit_price_cents
      handling_fee_cents = handling_fee_flat_cents iff invoice_subtotal_cents <
                           handling_fee_threshold_cents else 0
      invoice_total_cents = invoice_subtotal_cents + handling_fee_cents
    input_set: "program pricing fields current at the respective variant time; customer tier"
    precision: "integer cents, round_half_up at the per-unit step only"
    variants:
      - name: ORDER_DATE
        when: "order creation"
        difference: "uses program pricing as of creation; stored as quoted_unit_price_cents"
      - name: SHIP_DATE
        when: "order fulfillment"
        difference: "uses program pricing as of fulfillment; a pricing-update between creation and fulfillment changes the invoiced unit price"

  - name: calibration_fee
    trigger: "calibration-order creation (quoted) and scheduling (final)"
    algorithm: tiered_pricing
    formula: |
      quoted_fee_cents = service.base_fee_cents + service.per_point_fee_cents * measurement_points
      at scheduling:
        expedite branch:  final_fee_cents = round_half_up(quoted_fee_cents * program.expedite_multiplier_pct / 100)
        standard branch:  final_fee_cents = quoted_fee_cents
    input_set: "service fee fields; program.expedite_multiplier_pct at scheduling time"
    precision: "integer cents, round_half_up"

  - name: pt_evaluation
    trigger: "round transition ANALYSIS_OPEN -> EVALUATION with round_type == PROFICIENCY_TEST"
    algorithm: weighted_scoring
    formula: |
      reference = the lot's certificate with status == PUBLISHED (unique by supersede rule)
      assigned_value = reference.certified_value; reference_uncertainty = reference.expanded_uncertainty
      for each SUBMITTED result i:
        z_i = (measured_value_i - assigned_value) / reference_uncertainty
        store z_score at 3 decimal places, round_half_up
        performance_flag_i = PASS iff |z_i| <= Z_PASS_THRESHOLD else FAIL
        if FAIL: customer_i.pt_fail_count += 1; recompute accreditation_standing and credit_hold
    input_set: "results with status == SUBMITTED for this round"
    constants:
      Z_PASS_THRESHOLD: 2.0
      PT_PROBATION_FAIL_COUNT: 2
      PT_SUSPENSION_FAIL_COUNT: 3
    precision: "z_score 3 decimal places, round_half_up; comparison against threshold on the ROUNDED value"

  - name: kc_evaluation
    trigger: "round transition ANALYSIS_OPEN -> EVALUATION with round_type == KEY_COMPARISON"
    algorithm: weighted_scoring
    formula: |
      input set: results with status == SUBMITTED (n >= 2)
      w_i = 1 / measurement_uncertainty_i^2
      assigned_value (x_ref) = sum(x_i * w_i) / sum(w_i)
      reference_uncertainty (u_ref) = sqrt(1 / sum(w_i))
      chi_squared = sum( ((x_i - x_ref) / u_i)^2 )
      consistency_verdict = CONSISTENT iff chi_squared <= (n - 1) else INCONSISTENT
      per result i: degree_of_equivalence d_i = x_i - x_ref
                    equivalence_uncertainty U_i = COVERAGE_K * sqrt(u_i^2 + u_ref^2)
                    performance_flag_i = PASS iff |d_i| <= U_i else FAIL
      store assigned_value, reference_uncertainty, chi_squared, d_i, U_i at 6dp round_half_up
      KEY_COMPARISON does NOT affect customer pt_fail_count
    input_set: "results with status == SUBMITTED for this round"
    constants:
      COVERAGE_K: 2
      MIN_KC_RESULTS: 2
    precision: "6 decimal places, round_half_up; chi_squared comparison uses the ROUNDED stored value"

  - name: accreditation_standing
    trigger: "any change to customer.pt_fail_count (PT evaluation FAIL or round reopen compensation)"
    algorithm: threshold
    formula: |
      pt_fail_count <= 1  -> accreditation_standing = GOOD_STANDING, credit_hold = false
      pt_fail_count == 2  -> accreditation_standing = PROBATION,     credit_hold = false
      pt_fail_count >= 3  -> accreditation_standing = SUSPENDED,     credit_hold = true
      boundary: exactly 3 fails triggers SUSPENDED and credit_hold
    input_set: "single customer row"
    constants:
      PT_PROBATION_FAIL_COUNT: 2
      PT_SUSPENSION_FAIL_COUNT: 3
    precision: "integer count thresholds; >= semantics as written"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "X-User-Role must be one of the endpoint's declared roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: business_constraint
    check: "payload schema: required fields present; types valid; enum members valid; integer ranges (quantity >= 1, measurement_points >= 1, validity_days >= 1, total_units_produced >= 1, sample_units_reserved >= 1, positive uncertainties, percentages 0..100, len(bottle_means) >= 2, scheduled_start < scheduled_end with whole-minute duration)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 4
    category: existence
    check: "path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4.5
    category: existence
    check: "body references exist: program_id, lot_id, service_id; customer_id whether supplied explicitly or defaulted from X-User-ID (Customer role)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints with body references (incl. POST /metrology/sales-orders, POST /metrology/calibration-orders, POST /metrology/pt-rounds/{id}/participant-results)"
  - priority: 4.6
    category: auth
    check: "ownership: Customer role acting on an existing SalesOrder / CalibrationOrder must match that resource's customer_id; Metrologist resubmitting a method must match its analyst_user_id (evaluated after the resource is known to exist)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /metrology/sales-orders/{id}/transitions, POST /metrology/calibration-orders/{id}/transitions, POST /metrology/value-assignment-methods/{id}/transitions"
  - priority: 5
    category: state
    check: "OCC: expected_program_version / expected_lot_version matches current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /metrology/programs/{id}/pricing-update, POST /metrology/certificates"
  - priority: 6
    category: state
    check: "target resource state permits the requested transition (`to` must be a declared transition from the current state)"
    error_id: "ERR_INVALID_LOT_STATE | ERR_INVALID_CERTIFICATE_STATE | ERR_INVALID_METHOD_STATE | ERR_INVALID_ORDER_STATE | ERR_INVALID_CALIBRATION_STATE | ERR_INVALID_ROUND_STATE"
    http_status: 409
    applies_to: "all transitions endpoints"
  - priority: 6.5
    category: state
    check: "child-creation state gates: POST /metrology/value-assignment-methods requires lot.status == VALUE_ASSIGNMENT; POST /metrology/certificates requires lot.status in {VALUE_ASSIGNMENT, CERTIFIED, IN_DISTRIBUTION, DISTRIBUTION_HOLD}"
    error_id: ERR_INVALID_LOT_STATE
    http_status: 409
    applies_to: "POST /metrology/value-assignment-methods, POST /metrology/certificates"
  - priority: 7
    category: state
    check: "cross-resource state gate: sales-order creation requires lot.status == IN_DISTRIBUTION; PT SAMPLE_DISTRIBUTION requires lot.status == IN_DISTRIBUTION"
    error_id: ERR_LOT_NOT_DISTRIBUTABLE
    http_status: 409
    applies_to: "POST /metrology/sales-orders, POST /metrology/pt-rounds/{id}/transitions"
  - priority: 8
    category: business_safety
    check: "segregation of duties: certificate publisher != every ACCEPTED method analyst; method acceptor/rejecter != method analyst"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /metrology/certificates/{id}/transitions (to PUBLISHED), POST /metrology/value-assignment-methods/{id}/transitions (to ACCEPTED/REJECTED)"
  - priority: 8.5
    category: business_safety
    check: "traceability chain intact: selected link (latest calibrated_date <= scheduled_start) exists and calibration_due_date >= scheduled_end"
    error_id: ERR_TRACEABILITY_CHAIN_BROKEN
    http_status: 422
    applies_to: "POST /metrology/calibration-orders/{id}/transitions (to SCHEDULED)"
  - priority: 9
    category: business_constraint
    check: "uniqueness: program_code unique; service_code unique; one method per analyst per lot in {DATA_SUBMITTED, ACCEPTED}; one result per customer per round"
    error_id: "ERR_DUPLICATE_PROGRAM_CODE | ERR_DUPLICATE_SERVICE_CODE | ERR_DUPLICATE_ANALYST_METHOD | ERR_DUPLICATE_PARTICIPATION"
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 9.5
    category: business_constraint
    check: "certification gate: at least 2 ACCEPTED methods on the lot (analysts are structurally distinct because the ERR_DUPLICATE_ANALYST_METHOD gate blocks a second open method per analyst; the homogeneity verdict is structurally PASS because the lot cannot reach a certifiable state otherwise)"
    error_id: ERR_INSUFFICIENT_INDEPENDENT_METHODS
    http_status: 422
    applies_to: "POST /metrology/certificates"
  - priority: 9.6
    category: business_constraint
    check: "unit availability: len(bottle_means) <= lot.units_available at homogeneity; lot.units_available >= sample_units_reserved at PT distribution"
    error_id: ERR_INSUFFICIENT_UNITS
    http_status: 422
    applies_to: "POST /metrology/material-lots/{id}/transitions (to HOMOGENEITY_TESTING), POST /metrology/pt-rounds/{id}/transitions (to SAMPLE_DISTRIBUTION)"
  - priority: 9.7
    category: business_constraint
    check: "round evaluation gates: SUBMITTED count >= 1 (PT) / >= 2 (KC); PUBLISHED certificate exists for PT reference"
    error_id: "ERR_INSUFFICIENT_RESULTS | ERR_NO_REFERENCE_CERTIFICATE"
    http_status: 422
    applies_to: "POST /metrology/pt-rounds/{id}/transitions (to EVALUATION)"
  - priority: 9.8
    category: business_constraint
    check: "lot withdraw gate: no ALLOCATED sales orders for the lot"
    error_id: ERR_OPEN_ORDERS_EXIST
    http_status: 409
    applies_to: "POST /metrology/material-lots/{id}/transitions (to WITHDRAWN)"
  - priority: 9.9
    category: business_constraint
    check: "enter-distribution gate: a PUBLISHED, unexpired certificate exists for the lot"
    error_id: ERR_NO_PUBLISHED_CERTIFICATE
    http_status: 422
    applies_to: "POST /metrology/material-lots/{id}/transitions (to IN_DISTRIBUTION)"
  - priority: 10
    category: business_temporal
    check: "scheduled_start >= current logical clock"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /metrology/calibration-orders/{id}/transitions (to SCHEDULED)"
  - priority: 10.5
    category: business_temporal
    check: "no overlapping booking on the selected traceability link (half-open intervals; adjacency allowed)"
    error_id: ERR_RESOURCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /metrology/calibration-orders/{id}/transitions (to SCHEDULED)"
  - priority: 10.6
    category: business_temporal
    check: "aggregate daily capacity: sum of scheduled durations on the UTC calendar day + new duration <= program.daily_lab_capacity_minutes"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /metrology/calibration-orders/{id}/transitions (to SCHEDULED)"
  - priority: 11
    category: business_fiscal
    check: "customer.credit_hold == false at sales-order creation"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /metrology/sales-orders"
  - priority: 12
    category: business_referential
    check: "referenced service status == ACTIVE at scheduling"
    error_id: ERR_SERVICE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /metrology/calibration-orders/{id}/transitions (to SCHEDULED)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs & pricing (OCC) ---
  - method: POST
    path: "/metrology/programs"
    description: "Create a reference-material program with its cost-recovery pricing configuration"
    roles: [ProgramAdmin]
    code: 201
    input: [program_code, name, material_unit_price_cents, discount_pct_federal, discount_pct_accredited_lab, discount_pct_general, handling_fee_threshold_cents, handling_fee_flat_cents, expedite_multiplier_pct, daily_lab_capacity_minutes]
    output: ReferenceMaterialProgram
    side_effects: []
  - method: POST
    path: "/metrology/programs/{id}/pricing-update"
    description: "Supersede the program's pricing configuration; OCC-guarded by expected_program_version"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_program_version, "material_unit_price_cents?", "discount_pct_federal?", "discount_pct_accredited_lab?", "discount_pct_general?", "handling_fee_threshold_cents?", "handling_fee_flat_cents?", "expedite_multiplier_pct?", "daily_lab_capacity_minutes?"]
    output: ReferenceMaterialProgram
    side_effects: ["increments ReferenceMaterialProgram.version by 1", "supplied pricing fields replace current values"]

  # --- Material lots ---
  - method: POST
    path: "/metrology/material-lots"
    description: "Create a material lot (limited production run) in SOURCING"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, material_code, matrix_description, total_units_produced, "allocation_policy?"]
    output: MaterialLot
    side_effects: ["status = SOURCING; computed counters zero"]
  - method: GET
    path: "/metrology/material-lots/{id}"
    description: "Get one material lot"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: []
    output: MaterialLot
    side_effects: []
  - method: GET
    path: "/metrology/material-lots"
    description: "List material lots with optional filters"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "MaterialLot[]"
    side_effects: []
  - method: POST
    path: "/metrology/material-lots/{id}/transitions"
    description: "Drive the lot state machine; homogeneity targets carry the measurement payload and compute the verdict inline"
    roles: [Metrologist, InventoryManager]
    code: 200
    input: [to, "bottle_means?", "within_bottle_std?", "replicates_per_bottle?"]
    output: MaterialLot
    side_effects: ["state transition per state_machines.MaterialLot", "homogeneity_assessment on HOMOGENEITY_TESTING targets", "allocation sweep and auto-transitions as declared"]
  - method: GET
    path: "/metrology/material-lots/{id}/value-assignment-methods"
    description: "List value-assignment methods for a lot (reverse reachability)"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ValueAssignmentMethod[]"
    side_effects: []
  - method: GET
    path: "/metrology/material-lots/{id}/certificates"
    description: "List certificates for a lot (reverse reachability)"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "CertificateOfAnalysis[]"
    side_effects: []
  - method: GET
    path: "/metrology/material-lots/{id}/pt-rounds"
    description: "List PT rounds for a lot (reverse reachability)"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PTRound[]"
    side_effects: []

  # --- Value assignment methods ---
  - method: POST
    path: "/metrology/value-assignment-methods"
    description: "Submit an independent method result for a lot (lot must be in VALUE_ASSIGNMENT)"
    roles: [Metrologist]
    code: 201
    input: [lot_id, method_code, method_mean, method_std_uncertainty]
    output: ValueAssignmentMethod
    side_effects: ["status = DATA_SUBMITTED; analyst_user_id = X-User-ID"]
  - method: POST
    path: "/metrology/value-assignment-methods/{id}/transitions"
    description: "Accept/reject (CertificationOfficer) or resubmit (owning Metrologist) a method"
    roles: [CertificationOfficer, Metrologist]
    code: 200
    input: [to, "method_mean?", "method_std_uncertainty?", "rejection_reason?"]
    output: ValueAssignmentMethod
    side_effects: ["state transition per state_machines.ValueAssignmentMethod"]

  # --- Certificates ---
  - method: POST
    path: "/metrology/certificates"
    description: "Create a DRAFT certificate of analysis for a lot; OCC-guarded by expected_lot_version; supersedes on publish"
    roles: [CertificationOfficer]
    code: 201
    input: [lot_id, certificate_code, value_assignment_variant, uncertainty_components, validity_days, expected_lot_version]
    output: CertificateOfAnalysis
    side_effects: ["computes certified_value_assignment and combined_uncertainty_budget", "lot VALUE_ASSIGNMENT -> CERTIFICATION_PENDING; other certifiable states unchanged", "increments MaterialLot.version by 1 when state advances"]
  - method: POST
    path: "/metrology/certificates/{id}/transitions"
    description: "Publish or withdraw a certificate"
    roles: [CertificationOfficer]
    code: 200
    input: [to]
    output: CertificateOfAnalysis
    side_effects: ["state transition per state_machines.CertificateOfAnalysis including lot cascades and supersede"]
  # --- Customers & sales orders ---
  # Note: certificates are read via GET /metrology/material-lots/{id}/certificates;
  # customer state is read via the POST /metrology/customers creation response and
  # observed thereafter through sales-order acceptance/rejection behavior.
  - method: POST
    path: "/metrology/customers"
    description: "Register a customer organization"
    roles: [ProgramAdmin]
    code: 201
    input: [name, tier, credit_limit_cents]
    output: Customer
    side_effects: ["pt_fail_count = 0; accreditation_standing = GOOD_STANDING; credit_hold = false"]
  - method: POST
    path: "/metrology/sales-orders"
    description: "Place an order for lot units; synchronous allocation sweep determines ALLOCATED vs BACKORDERED"
    roles: [Customer, InventoryManager]
    code: 201
    input: [lot_id, "customer_id?", quantity]
    output: SalesOrder
    side_effects: ["quoted_unit_price_cents computed (ORDER_DATE variant)", "allocation sweep (calculation shortage_allocation)"]
  - method: POST
    path: "/metrology/sales-orders/{id}/transitions"
    description: "Fulfill (InventoryManager), release (owner/manager), or cancel (owner/manager) an order"
    roles: [InventoryManager, Customer]
    code: 200
    input: [to]
    output: SalesOrder
    side_effects: ["state transition per state_machines.SalesOrder including pricing at fulfill and release sweeps"]
  - method: GET
    path: "/metrology/sales-orders/{id}"
    description: "Get one sales order"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/metrology/sales-orders"
    description: "List sales orders with optional filters"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["lot_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []

  # --- Calibration services & orders ---
  - method: POST
    path: "/metrology/calibration-services"
    description: "Create a calibration service offering"
    roles: [ProgramAdmin]
    code: 201
    input: [service_code, measurand, base_fee_cents, per_point_fee_cents, standard_turnaround_days, "status?"]
    output: CalibrationServiceOffering
    side_effects: []
  - method: POST
    path: "/metrology/calibration-orders"
    description: "Submit a customer artifact for calibration"
    roles: [Customer]
    code: 201
    input: [service_id, "customer_id?", artifact_description, measurement_points, "expedite_requested?"]
    output: CalibrationOrder
    side_effects: ["quoted_fee_cents computed (calculation calibration_fee)"]
  - method: POST
    path: "/metrology/calibration-orders/{id}/transitions"
    description: "Schedule (coordinator, carries window payload), begin/hold/resume measurement (Metrologist), complete with result (Metrologist), or cancel (coordinator/owner)"
    roles: [CalibrationCoordinator, Metrologist, Customer]
    code: 200
    input: [to, "scheduled_start?", "scheduled_end?", "result?", "measured_correction?"]
    output: CalibrationOrder
    side_effects: ["state transition per state_machines.CalibrationOrder including traceability selection, overlap and capacity checks, expedite fee branch"]
  - method: GET
    path: "/metrology/calibration-orders/{id}"
    description: "Get one calibration order"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: []
    output: CalibrationOrder
    side_effects: []
  - method: GET
    path: "/metrology/calibration-orders"
    description: "List calibration orders with optional filters"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["service_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: "CalibrationOrder[]"
    side_effects: []

  # --- Traceability ---
  - method: POST
    path: "/metrology/traceability-links"
    description: "Register a traceability link (calibrated standard) for a service"
    roles: [Metrologist]
    code: 201
    input: [service_id, standard_description, calibrated_by_lab, calibrated_date, calibration_due_date, uncertainty_contribution]
    output: TraceabilityLink
    side_effects: []
  - method: GET
    path: "/metrology/traceability-links/{id}"
    description: "Get one traceability link"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: []
    output: TraceabilityLink
    side_effects: []
  - method: GET
    path: "/metrology/traceability-links"
    description: "List traceability links with optional service filter"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["service_id?", "limit?", "offset?"]
    output: "TraceabilityLink[]"
    side_effects: []

  # --- PT rounds / interlaboratory comparisons ---
  - method: POST
    path: "/metrology/pt-rounds"
    description: "Create a proficiency-testing round or key-comparison study on a lot"
    roles: [AccreditationOfficer]
    code: 201
    input: [lot_id, round_code, round_type, sample_units_reserved]
    output: PTRound
    side_effects: ["status = PLANNING"]
  - method: POST
    path: "/metrology/pt-rounds/{id}/transitions"
    description: "Advance the round lifecycle (SAMPLE_DISTRIBUTION, ANALYSIS_OPEN, EVALUATION, CLOSED, or reopen to ANALYSIS_OPEN)"
    roles: [AccreditationOfficer]
    code: 200
    input: [to]
    output: PTRound
    side_effects: ["state transition per state_machines.PTRound including evaluation computations, standing cascades, and unit consumption"]
  - method: POST
    path: "/metrology/pt-rounds/{id}/participant-results"
    description: "Submit a participating laboratory result while the round is ANALYSIS_OPEN"
    roles: [Customer]
    code: 201
    input: [lab_code, measured_value, measurement_uncertainty]
    output: PTParticipantResult
    side_effects: ["status = SUBMITTED; customer_id = X-User-ID"]
  - method: GET
    path: "/metrology/pt-participant-results/{id}"
    description: "Get one participant result"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: []
    output: PTParticipantResult
    side_effects: []
  - method: GET
    path: "/metrology/pt-participant-results"
    description: "List participant results with optional filters"
    roles: [ProgramAdmin, Metrologist, CertificationOfficer, InventoryManager, CalibrationCoordinator, AccreditationOfficer, Customer]
    code: 200
    input: ["round_id?", "customer_id?", "limit?", "offset?"]
    output: "PTParticipantResult[]"
    side_effects: []

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z; the clock MUST NOT fall back to wall-clock time. Fires the certificate-expiration sweep: PUBLISHED certificates with expiration_date <= the new value become EXPIRED, cascading to lot DISTRIBUTION_HOLD."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_certificate_count: integer, transitioned_lot_count: integer }
    side_effects: ["certificate expiration sweep (CertificateOfAnalysis PUBLISHED -> EXPIRED; MaterialLot IN_DISTRIBUTION -> DISTRIBUTION_HOLD)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "role not in the endpoint's declared roles, or role not permitted for the requested transition target" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Customer acting on another customer's order, or Metrologist resubmitting another analyst's method" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, bad type, invalid enum member, or range violation (quantity/points/validity >= 1, positive uncertainties, percentages 0..100, >= 2 bottle means, start < end whole minutes)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "body-referenced program/lot/service/customer id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_program_version / expected_lot_version does not match the parent's current version" }
  - { id: ERR_INVALID_LOT_STATE, http: 409, condition: "lot transition requested from a state where it is not declared" }
  - { id: ERR_INVALID_CERTIFICATE_STATE, http: 409, condition: "certificate transition requested from a state where it is not declared" }
  - { id: ERR_INVALID_METHOD_STATE, http: 409, condition: "method transition requested from a state where it is not declared" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "sales-order transition requested from a state where it is not declared" }
  - { id: ERR_INVALID_CALIBRATION_STATE, http: 409, condition: "calibration-order transition requested from a state where it is not declared" }
  - { id: ERR_INVALID_ROUND_STATE, http: 409, condition: "PT round transition or result submission requested from a state where it is not declared" }
  - { id: ERR_LOT_NOT_DISTRIBUTABLE, http: 409, condition: "sales-order creation or PT sample distribution while lot.status != IN_DISTRIBUTION" }
  - { id: ERR_NO_PUBLISHED_CERTIFICATE, http: 422, condition: "enter-distribution without a PUBLISHED, unexpired certificate for the lot" }
  - { id: ERR_NO_REFERENCE_CERTIFICATE, http: 422, condition: "PROFICIENCY_TEST evaluation without a PUBLISHED certificate for the lot" }
  - { id: ERR_INSUFFICIENT_INDEPENDENT_METHODS, http: 422, condition: "certificate creation with fewer than 2 ACCEPTED methods on the lot" }
  - { id: ERR_DUPLICATE_ANALYST_METHOD, http: 409, condition: "analyst already has a DATA_SUBMITTED or ACCEPTED method on the same lot" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "certificate publisher or method acceptor/rejecter equals a method analyst_user_id" }
  - { id: ERR_INSUFFICIENT_UNITS, http: 422, condition: "homogeneity bottle count exceeds units_available, or PT reservation exceeds units_available" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "sales-order creation while customer.credit_hold is true" }
  - { id: ERR_TRACEABILITY_CHAIN_BROKEN, http: 422, condition: "no valid traceability link for the service covers the scheduled window" }
  - { id: ERR_RESOURCE_WINDOW_CONFLICT, http: 409, condition: "scheduled window overlaps an existing booking on the selected traceability link" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "aggregate daily scheduled minutes would exceed program.daily_lab_capacity_minutes" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "scheduled_start earlier than the current logical clock" }
  - { id: ERR_SERVICE_NOT_ACTIVE, http: 409, condition: "scheduling against a RETIRED calibration service" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "lot withdrawal while ALLOCATED sales orders exist for the lot" }
  - { id: ERR_INSUFFICIENT_RESULTS, http: 422, condition: "round evaluation with fewer SUBMITTED results than the round_type minimum" }
  - { id: ERR_DUPLICATE_PARTICIPATION, http: 409, condition: "customer already has a result in the same round" }
  - { id: ERR_DUPLICATE_PROGRAM_CODE, http: 409, condition: "program_code already exists" }
  - { id: ERR_DUPLICATE_SERVICE_CODE, http: 409, condition: "service_code already exists" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Institute program administrator; owns programs, pricing, customers, service catalog, and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /metrology/programs", "POST /metrology/programs/{id}/pricing-update", "POST /metrology/customers", "POST /metrology/calibration-services", "POST /metrology/material-lots", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: Metrologist
    description: "Laboratory scientist; runs homogeneity tests, submits/resubmits method results, registers traceability links, performs measurements"
    identity: opaque
    exclusive_operations: ["POST /metrology/value-assignment-methods", "POST /metrology/traceability-links", "calibration-order transitions to IN_MEASUREMENT / MEASUREMENT_HOLD / COMPLETED", "lot transitions to HOMOGENEITY_TESTING", "method transitions to DATA_SUBMITTED (resubmit, own methods only)"]
    shared_operations: ["all GET endpoints"]
  - name: CertificationOfficer
    description: "Independent certifying officer; accepts/rejects method results and publishes/withdraws certificates; must not be a method analyst on the same lot"
    identity: opaque
    exclusive_operations: ["POST /metrology/certificates", "POST /metrology/certificates/{id}/transitions", "method transitions to ACCEPTED / REJECTED"]
    shared_operations: ["all GET endpoints"]
  - name: InventoryManager
    description: "Distribution and fulfillment operator; moves lots into distribution, withdraws lots, fulfills and releases orders"
    identity: opaque
    exclusive_operations: ["lot transitions to IN_DISTRIBUTION / WITHDRAWN", "sales-order transitions to FULFILLED"]
    shared_operations: ["all GET endpoints", "sales-order transitions to BACKORDERED / CANCELLED (shared with owning Customer)", "POST /metrology/sales-orders (shared with Customer)"]
  - name: CalibrationCoordinator
    description: "Calibration scheduler; books measurement windows and manages turnaround"
    identity: opaque
    exclusive_operations: ["calibration-order transitions to SCHEDULED"]
    shared_operations: ["all GET endpoints", "calibration-order transitions to CANCELLED (shared with owning Customer)"]
  - name: AccreditationOfficer
    description: "Accreditation program officer; runs proficiency-testing rounds and key comparisons"
    identity: opaque
    exclusive_operations: ["POST /metrology/pt-rounds", "POST /metrology/pt-rounds/{id}/transitions"]
    shared_operations: ["all GET endpoints"]
  - name: Customer
    description: "Customer organization / participating laboratory; places material orders, submits artifacts for calibration, reports PT results"
    identity: "entity_backed:Customer"
    exclusive_operations: ["POST /metrology/calibration-orders", "POST /metrology/pt-rounds/{id}/participant-results"]
    shared_operations: ["all GET endpoints", "POST /metrology/sales-orders (shared with InventoryManager)", "sales-order transitions to BACKORDERED / CANCELLED (own orders only)", "calibration-order transitions to CANCELLED (own orders only)"]
