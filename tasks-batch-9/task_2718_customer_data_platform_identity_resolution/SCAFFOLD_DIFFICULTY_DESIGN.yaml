        distinguishing_aspect: |
          Metric: zero-cardinality of the qualifying-destination collection, on
          POST /cdp/deletion-requests/{deletionRequestId}/propagate — a different metric and a
          different endpoint from the sibling instance's confidence threshold. With no
          Destination registered at all, total_vendor_task_count is 0, the request jumps
          RECEIVED -> VERIFIED inside the propagate call itself and the Profile is tombstoned
          without a single VendorDeletionTask ever existing.
        test_recipe:
          setup:
