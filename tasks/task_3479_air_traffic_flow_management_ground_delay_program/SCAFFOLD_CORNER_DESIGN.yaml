            - "exactly 2 slots ASSIGNED (slot_index 0 at 13:00 -> ${f1}, slot_index 1 at 13:10 -> ${f2})"
            - "slot_index 11 has slot_time 2026-09-15T14:50:00Z, is_ga_reserved == true, status OPEN"
            - "slot_index 2..10 are OPEN with is_ga_reserved == false"

      - name: ga_request_expires_on_cancel
        claim_type: side_effect_execution
        grounds:
          - state_machines.GAAccommodationRequest.REQUESTED_to_EXPIRED
        distinguishing_aspect: "Cancelling the TMI auto-expires its pending GA requests (REQUESTED -> EXPIRED) as a cascade side effect."
        test_recipe:
          setup:
            - "ACTIVE GDP rate 6, 13:00-15:00Z; GA operator with one REQUESTED accommodation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdministrator
            - call: "POST /atfm/facilities"
              payload: { ident: "KEWR", facility_type: "AIRPORT", base_acceptance_rate: 30 }
