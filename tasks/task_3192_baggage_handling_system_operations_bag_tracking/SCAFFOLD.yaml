# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3192_baggage_handling_system_operations_bag_tracking
# Domain: Baggage Handling System Operations & Bag Tracking (Delta Air Lines)
# Difficulty band: beyond Expert (density-first; flat topology; parallel state
# dimensions; cyclic revision loops; buffer-vs-half-open interval arithmetic)
# =============================================================================

scenario: |
  Baggage Handling System Operations & Bag Tracking (Delta Air Lines): bag acceptance with tag printing, weight and size screening and interline routing determination, in-line screening system flow with alarm resolution and manual inspection queues, sortation to make-up areas with flight bank timing and minimum connect time constraints, transfer bag handling for connecting itineraries with rush bag procedures, scan point capture at induction, load and delivery with tracking visibility to passengers, mishandled bag reporting with delivery arrangement and compensation rules, oversize, fragile and special item handling including sports equipment and mobility devices, system outage contingency with manual sortation

domain_name: "baggage-handling-operations"
api_prefix: "/baggage"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - selector_policy
    - bulk_operations

  entity_topology: flat            # peer entities joined only by foreign keys; no nested ownership tree
  state_machine_shape: parallel    # Bag evolves custody_status and screening_status on independent axes

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic               # SpecialItem.item_type reinterpretation of the same bag row

  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Station
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "IATA station code (3 letters), unique across stations", constraints: "unique; ^[A-Z]{3}$" }
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: sorter_capacity_bags, type: integer, source: input, description: "Design capacity of the in-line sortation system, in bags" }
      - { name: posture, type: enum, source: computed, default: "OPEN", description: "OPEN | CONGESTED | SUSPENDED — derived by the station_posture calculation", constraints: "enum {OPEN, CONGESTED, SUSPENDED}" }
      - { name: outage_active, type: boolean, source: system, default: false, description: "True while a sortation-system outage is declared and unresolved" }
      - { name: outage_started_utc, type: datetime, source: system, description: "UTC instant the active outage was declared; null when no outage is active" }
      - { name: active_bag_count, type: integer, source: computed, default: 0, description: "Bags physically inside the station envelope (accepted through not yet delivered or loaded out)" }
      - { name: manual_queue_depth, type: integer, source: computed, default: 0, description: "ManualInspectionTask rows in status IN {QUEUED, IN_PROGRESS} at this station" }
      - { name: open_liability_cents, type: integer, source: computed, default: 0, description: "Sum of final_liability_cents over MishandledReport rows in status IN {REPORTED, INVESTIGATING, DELIVERY_ARRANGED, REOPENED}" }
      - { name: settled_liability_cents, type: integer, source: computed, default: 0, description: "Sum of final_liability_cents over MishandledReport rows in status IN {DELIVERED, COMPENSATED, CLOSED}; open_liability_cents + settled_liability_cents is the station liability ledger" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops" }

  - name: Airline
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Two-letter carrier code, unique across airlines", constraints: "unique; ^[A-Z0-9]{2}$" }
      - { name: name, type: string, source: input, description: "Carrier display name" }
      - { name: interline_agreement_active, type: boolean, source: input, description: "Whether the interline baggage agreement with this carrier is currently in force" }
      - { name: max_excess_weight_lb, type: number, source: input, description: "Checked-bag weight at or below which no excess-weight fee applies" }
      - { name: excess_weight_fee_cents, type: integer, source: input, description: "Flat fee charged per bag once weight exceeds max_excess_weight_lb" }
      - { name: compensation_cap_cents, type: integer, source: input, description: "Per-bag cap on mishandled-bag compensation for this carrier" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; the station whose sortation system builds this flight" }
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id; operating carrier" }
      - { name: flight_number, type: string, source: input, description: "Marketing flight number, e.g. DL1423" }
      - { name: bank_code, type: string, source: input, description: "Flight bank the departure belongs to, e.g. B1" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Scheduled departure instant (UTC)" }
      - { name: sortation_open_utc, type: datetime, source: computed, description: "= scheduled_departure_utc - 120 minutes; earliest instant a bag may be inducted for this flight" }
      - { name: sortation_close_utc, type: datetime, source: computed, description: "= scheduled_departure_utc - 45 minutes; latest instant a bag may be inducted for this flight" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | SORT_OPEN | BOARDING | DEPARTED | CANCELLED", constraints: "enum {SCHEDULED, SORT_OPEN, BOARDING, DEPARTED, CANCELLED}" }
      - { name: makeup_ready, type: boolean, source: computed, default: false, description: "True when the flight has no bag whose custody_status is HELD and no open manual inspection task on any of its bags" }
      - { name: loaded_bag_count, type: integer, source: computed, default: 0, description: "Bag rows whose custody_status == LOADED and flight_id == this flight" }

  - name: MakeupArea
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: code, type: string, source: input, description: "Make-up area code, e.g. MA-3" }
      - { name: capacity_slots, type: integer, source: input, description: "Maximum number of bags that may hold concurrent sortation intervals in this area" }
      - { name: buffer_minutes, type: integer, source: input, default: 15, description: "Changeover buffer between consecutive sortation intervals in this area" }
      - { name: occupied_slots, type: integer, source: computed, default: 0, description: "Bags whose custody_status IN {SORTED, IN_MAKEUP} and makeup_area_id == this area (half-open intervals)" }
      - { name: released_slots, type: integer, source: computed, default: 0, description: "Bags that retain this makeup_area_id but whose custody_status IN {LOADED, OFFLOADED, DELIVERED, HELD}; occupied_slots + released_slots is the area slot ledger" }
      - { name: free_slots, type: integer, source: computed, description: "= capacity_slots - occupied_slots" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED", constraints: "enum {ACTIVE, CLOSED}" }

  - name: ScreeningLane
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; owning station" }
      - { name: lane_code, type: string, source: input, description: "Explosive-detection lane identifier, e.g. EDS-2" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | OFFLINE", constraints: "enum {ACTIVE, OFFLINE}" }
      - { name: last_event_end_utc, type: datetime, source: computed, description: "Latest end_utc among this lane's non-FAILED ScreeningEvent rows; null when the lane has none. Screening windows on a lane are strict half-open intervals [start_utc, end_utc) with NO changeover buffer — adjacency is legal." }

  - name: Bag
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; acceptance station" }
      - { name: flight_id, type: string, source: input, description: "FK -> Flight.id; the flight the bag is built for; null until sortation assigns one" }
      - { name: makeup_area_id, type: string, source: input, description: "FK -> MakeupArea.id; make-up area currently holding the bag; null before sortation" }
      - { name: tag_number, type: string, source: input, description: "Printed ten-digit bag tag number, unique across bags", constraints: "unique; ^[0-9]{10}$; printed by the server on acceptance" }
      - { name: passenger_name, type: string, source: input, description: "Surname and given name on the tag" }
      - { name: passenger_ref, type: string, source: input, description: "Passenger name record locator the bag is attached to" }
      - { name: itinerary_type, type: enum, source: input, description: "DOMESTIC | INTERNATIONAL | INTERLINE", constraints: "enum {DOMESTIC, INTERNATIONAL, INTERLINE}" }
      - { name: weight_lb, type: number, source: input, description: "Declared bag weight in pounds as stated at acceptance" }
      - { name: scale_weight_lb, type: number, source: system, description: "Weight measured on the in-line scale at the weigh step; null before weighing" }
      - { name: weight_variance_lb, type: number, source: computed, description: "= scale_weight_lb - weight_lb once weighed" }
      - { name: length_in, type: number, source: input, description: "Declared length in inches" }
      - { name: width_in, type: number, source: input, description: "Declared width in inches" }
      - { name: height_in, type: number, source: input, description: "Declared height in inches" }
      - { name: linear_in, type: number, source: computed, description: "= length_in + width_in + height_in; oversize screening dimension" }
      - { name: custody_status, type: enum, source: system, default: "ACCEPTED", description: "ACCEPTED | SCREENING | SORTED | IN_MAKEUP | LOADED | DELIVERED | HELD | OFFLOADED", constraints: "enum {ACCEPTED, SCREENING, SORTED, IN_MAKEUP, LOADED, DELIVERED, HELD, OFFLOADED}" }
      - { name: screening_status, type: enum, source: system, default: "PENDING", description: "PENDING | IN_LINE | CLEARED | ALARMED | IN_INSPECTION | FAILED", constraints: "enum {PENDING, IN_LINE, CLEARED, ALARMED, IN_INSPECTION, FAILED}" }
      - { name: routing_class, type: enum, source: computed, default: "STANDARD", description: "STANDARD | MANUAL | BULK_HOLD — interline routing determination produced by the weigh step", constraints: "enum {STANDARD, MANUAL, BULK_HOLD}" }
      - { name: excess_weight_fee_cents, type: integer, source: computed, default: 0, description: "Excess-weight fee applied at weighing" }
      - { name: handling_charge_cents, type: integer, source: computed, description: "Provisional handling charge while the bag is in custody; final charge once delivered" }
      - { name: priority_score, type: integer, source: computed, description: "Rush/sortation ranking score recomputed on every custody or clock change" }
      - { name: assigned_makeup_utc, type: datetime, source: system, description: "Instant the current make-up interval opened (set by assign-makeup); null before sortation" }
      - { name: loaded_utc, type: datetime, source: system, description: "Instant the bag was loaded; closes the make-up interval" }
      - { name: delivered_utc, type: datetime, source: system, description: "Instant the bag was delivered to the passenger or reclaim belt" }
      - { name: ops_run_index_at_acceptance, type: integer, source: system, default: 0, description: "station.ops_run_index stamped at acceptance; run_ops expires ACCEPTED bags once this lags the station counter by 2 or more" }
      - { name: manual_sortation_delay_minutes, type: integer, source: computed, default: 0, description: "Read-time outage delay from the outage_manual_sortation_delay calculation" }
      - { name: screen_alarm_resolution_time_minutes, type: integer, source: computed, default: 0, description: "Read-time alarm-to-resolution dwell from the screen_alarm_resolution_time calculation" }
      - { name: anomaly_note, type: string, source: input, description: "Screener note recorded by PUT /bags/{id}; its presence is what drives the two cycle edges on the bag_screening_status machine" }
      - { name: rush_declared, type: boolean, source: computed, default: false, description: "True when this bag has a Connection in status RUSH or REACCOMMODATED; exempts the bag from the outage hot-bag allowance" }
      - { name: scan_trail, type: array, source: computed, description: "Passenger-visible chain of scan-point captures, ordered by scan_utc ascending with created_at ascending as tie-break; each element is { scan_point, scan_source, scan_utc }" }
      - { name: duplicate_flag, type: boolean, source: computed, default: false, description: "True when a bag sharing this bag's passenger_ref was accepted for the same flight at an earlier created_at; a flagged bag may not be loaded (ERR_DUPLICATE_BAG_ON_FLIGHT)" }

  - name: BagScan
    parent: null
    common_fields: true
    fields:
      - { name: bag_id, type: string, source: system, description: "FK -> Bag.id; the bag this scan point capture belongs to" }
      - { name: scan_point, type: enum, source: input, description: "INDUCTION | SCREENING | SORTATION | MAKEUP | LOAD | DELIVERY", constraints: "enum {INDUCTION, SCREENING, SORTATION, MAKEUP, LOAD, DELIVERY}" }
      - { name: scan_source, type: enum, source: system, default: "AUTOMATED", description: "AUTOMATED | MANUAL — MANUAL is stamped while a station outage is active", constraints: "enum {AUTOMATED, MANUAL}" }
      - { name: scan_utc, type: datetime, source: system, description: "Instant the scan point read the license plate" }
      - { name: result, type: enum, source: system, default: "OK", description: "OK | REJECT", constraints: "enum {OK, REJECT}" }

  - name: ScreeningEvent
    parent: null
    common_fields: true
    fields:
      - { name: bag_id, type: string, source: input, description: "FK -> Bag.id; bag passing through the in-line screening system" }
      - { name: lane_id, type: string, source: input, description: "FK -> ScreeningLane.id; lane the bag was induced onto" }
      - { name: start_utc, type: datetime, source: input, description: "Instant the screening window opened" }
      - { name: end_utc, type: datetime, source: computed, description: "= start_utc + 20 minutes; instant the screening window closes. The window is the strict half-open interval [start_utc, end_utc) — a lane may host a back-to-back window starting exactly at another window's end" }
      - { name: alarm_code, type: string, source: input, description: "Explosive-detection alarm code raised by the lane; null when the bag passed clean" }
      - { name: status, type: enum, source: system, default: "IN_PROGRESS", description: "IN_PROGRESS | CLEARED | ALARMED | FAILED", constraints: "enum {IN_PROGRESS, CLEARED, ALARMED, FAILED}" }
      - { name: resolution_outcome, type: enum, source: system, description: "CLEARED | REJECTED; null until a screener resolves the alarm", constraints: "enum {CLEARED, REJECTED}" }
      - { name: resolved_by, type: string, source: system, description: "Opaque screener identity that resolved the alarm; null until resolved" }

  - name: ManualInspectionTask
    parent: null
    common_fields: true
    fields:
      - { name: screening_event_id, type: string, source: system, description: "FK -> ScreeningEvent.id; the alarmed screening event this task was opened for" }
      - { name: station_id, type: string, source: system, description: "FK -> Station.id; station whose manual inspection queue holds this task" }
      - { name: queue_position, type: integer, source: system, description: "Stable position within the station queue, assigned at creation (1 = head of queue)" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | IN_PROGRESS | RESOLVED | ESCALATED", constraints: "enum {QUEUED, IN_PROGRESS, RESOLVED, ESCALATED}" }
      - { name: assigned_to, type: string, source: input, description: "Opaque screener identity the task is assigned to; optional at creation" }
      - { name: due_utc, type: datetime, source: computed, description: "= created_at + 30 minutes; inspection deadline used by run_ops escalation" }
      - { name: resolution, type: enum, source: system, description: "CLEARED | BAG_REJECTED; null until the task is resolved", constraints: "enum {CLEARED, BAG_REJECTED}" }

  - name: Connection
    parent: null
    common_fields: true
    fields:
      - { name: bag_id, type: string, source: input, description: "FK -> Bag.id; transfer bag whose itinerary this row describes" }
      - { name: inbound_flight_id, type: string, source: input, description: "FK -> Flight.id; flight the bag arrives on" }
      - { name: onward_flight_id, type: string, source: input, description: "FK -> Flight.id; flight the bag departs on" }
      - { name: required_mct_minutes, type: integer, source: input, description: "Airport minimum connect time the itinerary was built to satisfy" }
      - { name: connect_slack_minutes, type: integer, source: computed, description: "= minutes(onward.scheduled_departure_utc - inbound.scheduled_departure_utc) - required_mct_minutes" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | CONFIRMED | RUSH | MISSED | REACCOMMODATED", constraints: "enum {PENDING, CONFIRMED, RUSH, MISSED, REACCOMMODATED}" }
      - { name: rush_declared_utc, type: datetime, source: system, description: "Instant the rush-bag procedure was declared; null unless RUSH was entered" }

  - name: SpecialItem
    parent: null
    common_fields: true
    fields:
      - { name: bag_id, type: string, source: input, description: "FK -> Bag.id; bag carrying the special item" }
      - { name: item_type, type: enum, source: input, description: "OVERSIZE | FRAGILE | SPORTS_EQUIPMENT | MOBILITY_DEVICE", constraints: "enum {OVERSIZE, FRAGILE, SPORTS_EQUIPMENT, MOBILITY_DEVICE}" }
      - { name: declared_value_cents, type: integer, source: input, description: "Passenger-declared value of the item in cents" }
      - { name: requires_manual_screening, type: boolean, source: computed, description: "True when item_type IN {MOBILITY_DEVICE, SPORTS_EQUIPMENT} or the bag linear_in exceeds 115" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "Per-item special-handling fee, rounded per item then summed (see oversize_handling_fee calculation)" }
      - { name: liability_cap_cents, type: integer, source: computed, description: "Per-item carrier liability ceiling used when the item is mishandled" }
      - { name: waived_fee_cents, type: integer, source: computed, default: 0, description: "Fee waived on this item by the waive-handling-fee action; 0 when nothing has been waived" }

  - name: MishandledReport
    parent: null
    common_fields: true
    fields:
      - { name: bag_id, type: string, source: input, description: "FK -> Bag.id; bag the report was raised for" }
      - { name: station_id, type: string, source: input, description: "FK -> Station.id; station of custody that must work the report" }
      - { name: report_type, type: enum, source: input, description: "DELAYED | DAMAGED | LOST | PILFERED", constraints: "enum {DELAYED, DAMAGED, LOST, PILFERED}" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | INVESTIGATING | DELIVERY_ARRANGED | DELIVERED | COMPENSATED | REOPENED | CLOSED", constraints: "enum {REPORTED, INVESTIGATING, DELIVERY_ARRANGED, DELIVERED, COMPENSATED, REOPENED, CLOSED}" }
      - { name: delivery_method, type: enum, source: input, description: "COURIER | PASSENGER_PICKUP | FORWARD_ON_NEXT_FLIGHT; set when delivery is arranged", constraints: "enum {COURIER, PASSENGER_PICKUP, FORWARD_ON_NEXT_FLIGHT}" }
      - { name: compensation_offer_cents, type: integer, source: computed, description: "Provisional compensation offer recomputed on every report transition" }
      - { name: claim_status, type: enum, source: system, default: "NONE", description: "NONE | FILED | APPROVED | SETTLED | DENIED", constraints: "enum {NONE, FILED, APPROVED, SETTLED, DENIED}" }
      - { name: claim_amount_cents, type: integer, source: input, default: 0, description: "Amount claimed by the passenger at file-claim; 0 until a claim is filed" }
      - { name: approved_cents, type: integer, source: system, default: 0, description: "Amount the carrier approved at decide-claim; 0 until approved" }
      - { name: compensation_settled_cents, type: integer, source: system, default: 0, description: "Amount actually paid out on this report; incremented only when a claim settles" }
      - { name: final_liability_cents, type: integer, source: computed, description: "Carrier liability recognised on this report; recomputed on every transition" }
      - { name: outage_context, type: boolean, source: system, default: false, description: "True when the report was auto-created by a station outage contingency sweep" }

  - name: Claim
    parent: null
    common_fields: true
    note: |
      Exactly one Claim row may exist per MishandledReport; a second filing is
      rejected. The claim carries the passenger's ask; the report carries the
      offer, the approval and the settled amount.
    fields:
      - { name: mishandled_report_id, type: string, source: system, description: "FK -> MishandledReport.id; the report this claim was filed against" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount the passenger asked for at filing" }
      - { name: decision, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | DENIED", constraints: "enum {PENDING, APPROVED, DENIED}" }
      - { name: decided_by, type: string, source: system, description: "Opaque agent identity that decided the claim; null while PENDING" }
      - { name: decided_utc, type: datetime, source: system, description: "Instant the decision was recorded; null while PENDING" }

  - name: Delivery
    parent: null
    common_fields: true
    note: |
      Exactly one Delivery row exists per Bag; a bag reaching HELD or OFFLOADED
      without one has it synthesized. Delivery is the distinct ledger target of
      the mishandled-compensation cascade — reports, not bags, drive its status.
    fields:
      - { name: bag_id, type: string, source: system, description: "FK -> Bag.id; the bag being delivered" }
      - { name: mishandled_report_id, type: string, source: system, description: "FK -> MishandledReport.id; the report whose delivery arrangement created this row; null for a routine delivery" }
      - { name: method, type: enum, source: input, default: "PASSENGER_PICKUP", description: "COURIER | PASSENGER_PICKUP | FORWARD_ON_NEXT_FLIGHT", constraints: "enum {COURIER, PASSENGER_PICKUP, FORWARD_ON_NEXT_FLIGHT}" }
      - { name: address_note, type: string, source: input, description: "Free-text delivery instructions; null for reclaim-belt deliveries" }
      - { name: scheduled_utc, type: datetime, source: input, description: "Promised delivery instant; must not precede the current logical clock instant (ERR_DELIVERY_IN_PAST)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | IN_TRANSIT | OUT_FOR_DELIVERY | DELIVERED | COMPENSATED", constraints: "enum {PENDING, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, COMPENSATED}" }
      - { name: delivered_utc, type: datetime, source: system, description: "Instant the bag reached the passenger; null until delivered" }
      - { name: courier_ref, type: string, source: system, description: "Courier tracking reference; null unless method == COURIER" }
      - { name: proof_required, type: boolean, source: input, default: false, description: "Whether a signed proof of delivery is required before the row may reach DELIVERED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Bag — PARALLEL state dimensions on one entity. The primary axis is
  # custody_status; the independent axis is screening_status (declared as a
  # second machine on the same entity below). A bag may not advance past
  # SCREENING while screening_status is ALARMED, FAILED or IN_INSPECTION.
  # ---------------------------------------------------------------------------
  - entity: Bag
    machine: bag_custody_status
    state_field: custody_status
    initial_state: ACCEPTED
    terminal_states: [DELIVERED]
    transitions:
      - from: ACCEPTED
        to: SCREENING
        trigger: POST /bags/{id}/weigh
        actor: AcceptanceAgent
        preconditions:
          - "bag.custody_status == ACCEPTED (ERR_INVALID_STATE)"
          - "bag.weight_lb <= airline.max_excess_weight_lb + 20 (ERR_BAG_OVERWEIGHT)"
          - "bag.linear_in <= 130 (ERR_BAG_OVERSIZE)"
        side_effects:
          - "bag.scale_weight_lb := the reading supplied in the request"
          - "bag.weight_variance_lb := scale_weight_lb - weight_lb"
          - "bag.excess_weight_fee_cents := excess_weight_fee calculation (HOLD variant while station.outage_active, CURRENT variant otherwise)"
          - "bag.handling_charge_cents := handling_charge calculation (PROVISIONAL variant)"
          - "bag.routing_class := interline_routing_class calculation"
          - "bag.screening_status → IN_LINE (bag_screening_status machine, PENDING → IN_LINE)"
          - "bag.priority_score := rush_priority_score calculation"
          - "cascade D hop 1: a BagScan row with scan_point INDUCTION is appended, scan_source MANUAL when station.outage_active else AUTOMATED"

      - from: SCREENING
        to: SORTED
        trigger: POST /screenings/{id}/resolve with outcome CLEARED
        actor: Screener
        preconditions:
          - "screening_event.status == ALARMED (ERR_SCREENING_EVENT_NOT_ALARMED)"
          - "this screening event's bag has custody_status == SCREENING (ERR_INVALID_STATE)"
          - "this screening event's bag has screening_status == CLEARED after the resolve is applied (ERR_SCREENING_NOT_CLEARED)"
        side_effects:
          - "screening_event.status → CLEARED and screening_event.resolution_outcome := CLEARED"
          - "screening_event.resolved_by := the acting screener identity"
          - "bag.screening_status → CLEARED (bag_screening_status machine, ALARMED → CLEARED)"
          - "bag.custody_status → SORTED"
          - "cascade E hop 1: the ScreeningEvent's ManualInspectionTask, when one exists, status → RESOLVED and resolution := CLEARED"
          - "cascade E hop 2: station.manual_queue_depth := station_manual_queue_depth calculation"
          - "cascade E hop 3: flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"
          - "a BagScan row with scan_point SORTATION is appended"
        note: |
          Server-side ordering is pinned: the screening axis is written FIRST
          (ALARMED → CLEARED), then the custody axis is evaluated against it.
          A bag whose screening_status is IN_INSPECTION is NOT advanced here —
          it leaves the inspection state only through
          POST /inspections/{id}/resolve, and then through a fresh weigh.

      - from: SCREENING
        to: SORTED
        trigger: "system (automatic at POST /screenings when the event is created with alarm_code null: the clean half-open window admits the bag immediately and no resolve call is required)"
        actor: system
        preconditions:
          - "screening_event.alarm_code is null"
          - "bag.screening_status == CLEARED after the event is applied"
        side_effects:
          - "bag.custody_status → SORTED"
          - "bag.screening_status → CLEARED (bag_screening_status machine, IN_LINE → CLEARED)"
          - "the ScreeningEvent's end_utc fixes the exclusive end of the lane's occupancy bucket"
        note: |
          The clean path needs no screener action: an alarm-free induction IS the
          clearance. The SCREENING → SORTED edge above (the alarmed one) is the
          mirror image, reached only through POST /screenings/{id}/resolve.

      - from: SORTED
        to: IN_MAKEUP
        trigger: POST /bags/{id}/assign-makeup
        actor: SortationAgent
        preconditions:
          - "bag.custody_status == SORTED (ERR_INVALID_STATE)"
          - "bag.screening_status == CLEARED (ERR_SCREENING_NOT_CLEARED)"
          - "bag.flight_id is set (ERR_FLIGHT_NOT_ASSIGNED)"
          - "bag.flight.status IN {SCHEDULED, SORT_OPEN} (ERR_FLIGHT_NOT_SORTING)"
          - "station.posture != SUSPENDED (ERR_STATION_SUSPENDED) — CONGESTED is advisory and does not block sortation"
          - "makeup_area.status == ACTIVE (ERR_MAKEUP_AREA_CLOSED)"
          - "the requested interval [induction_utc, induction_utc + makeup_interval_minutes) clears the area's changeover buffer and does not exceed makeup_area.capacity_slots (ERR_MAKEUP_SLOT_CONFLICT)"
        side_effects:
          - "bag.custody_status → IN_MAKEUP"
          - "bag.makeup_area_id := the requested make-up area"
          - "bag.assigned_makeup_utc := the induction instant supplied in the request"
          - "bag.priority_score := rush_priority_score calculation"
          - "makeup_area.occupied_slots and makeup_area.free_slots := makeup_area_occupancy calculation"
          - "cascade A hop 1: makeup_area.free_slots recomputed by makeup_area_occupancy from the bag's new IN_MAKEUP entry"
          - "cascade A hop 2: station.posture := station_posture calculation; with the station's active make-up areas down to one free slot or fewer the posture becomes CONGESTED"
          - "cascade A hop 3: when makeup_area.free_slots == 0, every ManualInspectionTask of the station with status QUEUED and due_utc <= the current logical clock instant is re-stamped (its queue_position is recomputed and its priority flag set), and station.manual_queue_depth := station_manual_queue_depth calculation"
          - "cascade C hop 1: when the bag's SpecialItem.requires_manual_screening == true and the bag has no ManualInspectionTask for its latest ScreeningEvent, one is created with status QUEUED and queue_position := station.manual_queue_depth + 1"
          - "cascade C hop 2: station.manual_queue_depth := station_manual_queue_depth calculation"
          - "cascade C hop 3: flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"
          - "a BagScan row with scan_point SORTATION is appended, scan_source MANUAL when station.outage_active else AUTOMATED"

      - from: IN_MAKEUP
        to: LOADED
        trigger: POST /bags/{id}/load
        actor: LoadAgent
        preconditions:
          - "bag.custody_status == IN_MAKEUP (ERR_INVALID_STATE)"
          - "bag.duplicate_flag == false (ERR_DUPLICATE_BAG_ON_FLIGHT)"
          - "the station outage hot-bag allowance is not exhausted for a non-rush bag (ERR_MAKEUP_RATE_LIMITED)"
          - "bag.screening_status == CLEARED (ERR_SCREENING_NOT_CLEARED)"
          - "the bag's Connection, when one exists, must have status IN {CONFIRMED, RUSH} (ERR_CONNECTION_MISSED)"
          - "the current logical clock instant <= bag.flight.sortation_close_utc (ERR_SORTATION_WINDOW_CLOSED)"
        side_effects:
          - "bag.custody_status → LOADED"
          - "a BagScan row with scan_point MAKEUP is appended before the LOAD scan"
          - "bag.loaded_utc := the current logical clock instant"
          - "bag.handling_charge_cents := handling_charge calculation (FINAL variant)"
          - "flight.loaded_bag_count := flight_loaded_bag_count calculation"
          - "flight.makeup_ready := flight_makeup_ready calculation"
          - "makeup_area.occupied_slots and makeup_area.free_slots := makeup_area_occupancy calculation"
          - "a BagScan row with scan_point LOAD is appended"

      - from: LOADED
        to: DELIVERED
        trigger: POST /bags/{id}/deliver
        actor: LoadAgent
        preconditions:
          - "bag.custody_status == LOADED (ERR_INVALID_STATE)"
          - "bag.flight.status == DEPARTED (ERR_FLIGHT_NOT_DEPARTED)"
        side_effects:
          - "bag.custody_status → DELIVERED"
          - "bag.delivered_utc := the current logical clock instant"
          - "bag.handling_charge_cents := handling_charge calculation (FINAL variant)"
          - "station.active_bag_count := station_active_bag_count calculation"
          - "a BagScan row with scan_point DELIVERY is appended"

      - from: LOADED
        to: OFFLOADED
        trigger: POST /bags/{id}/offload
        actor: LoadAgent
        preconditions:
          - "bag.custody_status == LOADED (ERR_INVALID_STATE)"
        side_effects:
          - "bag.custody_status → OFFLOADED"
          - "flight.loaded_bag_count := flight_loaded_bag_count calculation"
          - "bag.handling_charge_cents := handling_charge calculation (FINAL variant)"
          - "station.active_bag_count := station_active_bag_count calculation"
          - "the bag's Connection, when one exists, status → MISSED when the current logical clock instant > its onward flight.sortation_close_utc, else CONFIRMED"
          - "when the bag has no Delivery row, one is created with status PENDING and method PASSENGER_PICKUP"

      - from: ACCEPTED
        to: HELD
        trigger: "system (event-sourced: applied whenever the bag's screening_status becomes ALARMED — see the bag_screening_status machine's IN_LINE → ALARMED transition)"
        actor: system
        preconditions:
          - "bag.screening_status == ALARMED"
        side_effects:
          - "bag.custody_status → HELD"
          - "station.active_bag_count := station_active_bag_count calculation"
          - "when the bag has no Delivery row, one is created with status PENDING"
        note: "Event-sourcing edge — no endpoint invokes it directly; it fires on the screening axis' ALARMED write."

      - from: SCREENING
        to: HELD
        trigger: "system (event-sourced: applied whenever the bag's screening_status becomes ALARMED, FAILED or IN_INSPECTION — see the bag_screening_status machine)"
        actor: system
        preconditions:
          - "bag.custody_status == SCREENING (ERR_INVALID_STATE)"
          - "bag.screening_status IN {ALARMED, FAILED, IN_INSPECTION}"
        side_effects:
          - "bag.custody_status → HELD"
          - "station.active_bag_count := station_active_bag_count calculation"
          - "station.posture := station_posture calculation (the HELD bag still counts as active)"
          - "when the bag has no Delivery row, one is created with status PENDING"
        note: "Event-sourcing edge — no endpoint invokes it directly; it fires on the screening axis' ALARMED/FAILED/IN_INSPECTION write."

      - from: HELD
        to: ACCEPTED
        trigger: POST /bags/{id}/weigh
        actor: AcceptanceAgent
        preconditions:
          - "bag.custody_status == HELD (ERR_INVALID_STATE)"
          - "bag.screening_status IN {ALARMED, FAILED, IN_INSPECTION} (ERR_INVALID_STATE)"
          - "the bag has no open (QUEUED or IN_PROGRESS) ManualInspectionTask (ERR_MANUAL_INSPECTION_REQUIRED)"
          - "either station.outage_active == true, or bag.screening_status IN {ALARMED, CLEARED} (ERR_OUTAGE_NOT_ACTIVE)"
        side_effects:
          - "bag.custody_status → ACCEPTED"
          - "bag.screening_status → PENDING, then immediately IN_LINE (bag_screening_status machine, ALARMED/FAILED/IN_INSPECTION/CLEARED → PENDING → IN_LINE reset)"
          - "bag.scale_weight_lb := the reading supplied in the request"
          - "bag.weight_variance_lb := scale_weight_lb - weight_lb"
          - "bag.excess_weight_fee_cents := excess_weight_fee calculation (HOLD variant while station.outage_active, CURRENT variant otherwise)"
          - "bag.routing_class := interline_routing_class calculation"
          - "bag.handling_charge_cents := handling_charge calculation (PROVISIONAL variant)"
          - "bag.priority_score := rush_priority_score calculation"
          - "a BagScan row with scan_point INDUCTION is appended"
          - "station.active_bag_count := station_active_bag_count calculation"
          - "station.posture := station_posture calculation"
        note: |
          Manual re-induction — the declared outage contingency path for a bag
          that held at screening, and the recovery path for a bag whose alarm
          was cleared in place (a cleared alarm leaves screening_status CLEARED
          while custody_status is HELD).

  # ---------------------------------------------------------------------------
  # Bag — screening_status axis. PARALLEL dimension on the same Bag entity.
  # Cyclic: CLEARED → IN_LINE and FAILED → IN_INSPECTION both re-enter the
  # pipeline, so this machine has no terminal state.
  # ---------------------------------------------------------------------------
  - entity: Bag
    machine: bag_screening_status
    state_field: screening_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: IN_LINE
        trigger: POST /bags/{id}/weigh
        actor: AcceptanceAgent
        preconditions:
          - "bag.custody_status IN {ACCEPTED, HELD} (ERR_INVALID_STATE)"
        side_effects:
          - "bag.excess_weight_fee_cents, bag.routing_class and bag.handling_charge_cents recomputed"
          - "a BagScan row with scan_point SCREENING is appended"

      - from: IN_LINE
        to: CLEARED
        trigger: POST /screenings/{id}/resolve with outcome CLEARED
        actor: Screener
        side_effects:
          - "the bag's custody_status → SORTED when it is currently SCREENING (bag_custody_status machine, SCREENING → SORTED)"

      - from: IN_LINE
        to: ALARMED
        trigger: POST /screenings with a non-null alarm_code
        actor: Screener
        preconditions:
          - "bag.screening_status == IN_LINE (ERR_INVALID_STATE)"
        side_effects:
          - "bag.screening_status → ALARMED"
          - "the bag's custody_status → HELD when it is currently ACCEPTED or SCREENING (bag_custody_status machine)"
          - "station.active_bag_count := station_active_bag_count calculation"

      - from: ALARMED
        to: CLEARED
        trigger: POST /screenings/{id}/resolve with outcome CLEARED
        actor: Screener
        side_effects:
          - "screening_event.status → CLEARED, resolution_outcome := CLEARED"
          - "the bag's custody_status advances to SORTED only when it is still SCREENING; a bag already HELD keeps HELD"

      - from: ALARMED
        to: FAILED
        trigger: POST /screenings/{id}/resolve with outcome REJECTED
        actor: Screener
        side_effects:
          - "screening_event.status → FAILED, resolution_outcome := REJECTED"
          - "bag.screening_status → FAILED"
          - "bag.custody_status → HELD (bag_custody_status machine, SCREENING → HELD)"
          - "station.active_bag_count := station_active_bag_count calculation"

      - from: IN_INSPECTION
        to: CLEARED
        trigger: POST /inspections/{id}/resolve with resolution CLEARED
        actor: Screener
        side_effects:
          - "task.status → RESOLVED, task.resolution := CLEARED"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"
          - "flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"
          - "a HELD bag reaches ACCEPTED only through a later POST /bags/{id}/weigh"

      - from: IN_INSPECTION
        to: FAILED
        trigger: POST /inspections/{id}/resolve with resolution BAG_REJECTED
        actor: Screener
        side_effects:
          - "task.status → RESOLVED, task.resolution := BAG_REJECTED"
          - "bag.screening_status → FAILED"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"

      - from: CLEARED
        to: IN_LINE
        trigger: PUT /bags/{id} carrying anomaly_note
        actor: Screener
        preconditions:
          - "bag.screening_status == CLEARED (ERR_INVALID_STATE)"
          - "bag.custody_status IN {ACCEPTED, SCREENING, SORTED, HELD} (ERR_INVALID_STATE)"
        side_effects:
          - "bag.screening_status → IN_LINE"
          - "a BagScan row with scan_point SCREENING is appended"
        note: "Cycle edge 1 of 2 — a cleared bag is re-induced."

      - from: FAILED
        to: IN_INSPECTION
        trigger: PUT /bags/{id} carrying anomaly_note
        actor: Screener
        preconditions:
          - "bag.screening_status == FAILED (ERR_INVALID_STATE)"
        side_effects:
          - "bag.screening_status → IN_INSPECTION"
          - "bag.custody_status stays HELD while screening_status is IN_INSPECTION"
        note: "Cycle edge 2 of 2 — a failed bag is re-inspected."

  # ---------------------------------------------------------------------------
  # ScreeningEvent — in-line screening window with an alarm branch and a
  # compensating reopen action.
  # ---------------------------------------------------------------------------
  - entity: ScreeningEvent
    initial_state: IN_PROGRESS
    terminal_states: [CLEARED, FAILED]
    transitions:
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "system (automatic at creation when alarm_code is null)"
        actor: system
        side_effects:
          - "screening_event.resolution_outcome := CLEARED"
          - "the bag's screening_status → CLEARED"
          - "the bag's custody_status → SORTED (bag_custody_status machine, SCREENING → SORTED, the clean-induction edge) — no resolve call is needed"

      - from: IN_PROGRESS
        to: ALARMED
        trigger: "system (automatic at creation when alarm_code is non-null)"
        actor: system
        side_effects:
          - "screening_event.status → ALARMED"
          - "the bag's screening_status → ALARMED and its custody_status → HELD (bag_screening_status machine, IN_LINE → ALARMED)"

      - from: ALARMED
        to: CLEARED
        trigger: POST /screenings/{id}/resolve with outcome CLEARED
        actor: Screener
        preconditions:
          - "screening_event.status == ALARMED (ERR_SCREENING_EVENT_NOT_ALARMED)"
        side_effects:
          - "screening_event.resolution_outcome := CLEARED"
          - "screening_event.resolved_by := the acting screener identity"
          - "the linked ManualInspectionTask, when one exists, status → RESOLVED with resolution CLEARED"
          - "the bag's screening_status → CLEARED (bag_screening_status machine, ALARMED → CLEARED)"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"
          - "the bag's custody_status → SORTED only when it is still SCREENING; a HELD bag keeps HELD"

      - from: ALARMED
        to: FAILED
        trigger: POST /screenings/{id}/resolve with outcome REJECTED
        actor: Screener
        preconditions:
          - "screening_event.status == ALARMED (ERR_SCREENING_EVENT_NOT_ALARMED)"
        side_effects:
          - "screening_event.resolution_outcome := REJECTED"
          - "screening_event.resolved_by := the acting screener identity"
          - "the bag's screening_status → FAILED (bag_screening_status machine, ALARMED → FAILED)"
          - "the bag's custody_status → HELD (bag_custody_status machine, SCREENING → HELD)"
          - "station.active_bag_count := station_active_bag_count calculation"

      - from: CLEARED
        to: ALARMED
        trigger: POST /screenings/{id}/reopen
        actor: Screener
        preconditions:
          - "screening_event.status == CLEARED (ERR_INVALID_STATE)"
          - "screening_event.end_utc <= the current logical clock instant (ERR_SCREENING_WINDOW_CLOSED)"
        side_effects:
          - "screening_event.status → ALARMED and resolution_outcome := null"
          - "the bag's screening_status → ALARMED (bag_screening_status machine)"
          - "the bag's custody_status → HELD when it is currently ACCEPTED or SCREENING; a SORTED, IN_MAKEUP or LOADED bag keeps its custody_status and becomes unsortable (ERR_SCREENING_NOT_CLEARED on any later advance)"
          - "screening_lane.last_event_end_utc := screening_lane_last_event_end calculation"
          - "the lane's buffer gate is re-armed — the next screening window on this lane must still clear the changeover buffer"
        note: "Compensating action for the IN_PROGRESS → CLEARED transition."

  # ---------------------------------------------------------------------------
  # ManualInspectionTask — manual inspection queue with an escalation branch.
  # ---------------------------------------------------------------------------
  - entity: ManualInspectionTask
    initial_state: QUEUED
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: POST /inspections/{id}/claim
        actor: Screener
        preconditions:
          - "task.status == QUEUED (ERR_INVALID_STATE)"
          - "task.screening_event.status == ALARMED (ERR_SCREENING_EVENT_NOT_ALARMED)"
        side_effects:
          - "task.status → IN_PROGRESS"
          - "task.assigned_to := the acting screener identity"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"

      - from: QUEUED
        to: RESOLVED
        trigger: POST /inspections/{id}/resolve
        actor: Screener
        preconditions:
          - "task.status == QUEUED (ERR_INVALID_STATE)"
          - "task.screening_event.status == ALARMED (ERR_SCREENING_EVENT_NOT_ALARMED)"
        side_effects:
          - "task.status → RESOLVED and task.resolution := the supplied resolution"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"
          - "the bag's screening_status → CLEARED when resolution == CLEARED, else FAILED"
          - "flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: POST /inspections/{id}/resolve
        actor: Screener
        preconditions:
          - "task.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "task.screening_event.status == ALARMED (ERR_SCREENING_EVENT_NOT_ALARMED)"
        side_effects:
          - "task.status → RESOLVED and task.resolution := the supplied resolution"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"
          - "the bag's screening_status → CLEARED when resolution == CLEARED, else FAILED"
          - "flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"

      - from: QUEUED
        to: ESCALATED
        trigger: "system (automatic during run_ops when task.due_utc <= the current logical clock instant and station.posture IN {CONGESTED, SUSPENDED})"
        actor: system
        side_effects:
          - "task.status → ESCALATED"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"
          - "flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"

      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "system (automatic during run_ops when task.due_utc <= the current logical clock instant and station.posture IN {CONGESTED, SUSPENDED})"
        actor: system
        side_effects:
          - "task.status → ESCALATED"
          - "station.manual_queue_depth := station_manual_queue_depth calculation"
          - "flight.makeup_ready := flight_makeup_ready calculation for the bag's flight"

  # ---------------------------------------------------------------------------
  # Connection — transfer-bag itinerary machine with a REACCOMMODATED loop.
  # ---------------------------------------------------------------------------
  - entity: Connection
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: POST /connections/{id}/confirm
        actor: TransferAgent
        preconditions:
          - "connection.status == PENDING (ERR_INVALID_STATE)"
          - "connection.connect_slack_minutes >= 0 (ERR_MCT_VIOLATION)"
          - "the bag's screening_status == CLEARED (ERR_SCREENING_NOT_CLEARED)"
        side_effects:
          - "connection.status → CONFIRMED"
          - "bag.priority_score := rush_priority_score calculation"

      - from: PENDING
        to: RUSH
        trigger: POST /connections/{id}/declare-rush
        actor: TransferAgent
        preconditions:
          - "connection.status == PENDING (ERR_INVALID_STATE)"
          - "connection.connect_slack_minutes >= -15 (ERR_RUSH_WINDOW_PASSED)"
        side_effects:
          - "connection.status → RUSH and connection.rush_declared_utc := the current logical clock instant"
          - "bag.priority_score := rush_priority_score calculation"

      - from: CONFIRMED
        to: RUSH
        trigger: POST /connections/{id}/declare-rush
        actor: TransferAgent
        preconditions:
          - "connection.status == CONFIRMED (ERR_INVALID_STATE)"
          - "connection.connect_slack_minutes >= -15 (ERR_RUSH_WINDOW_PASSED)"
        side_effects:
          - "connection.status → RUSH and connection.rush_declared_utc := the current logical clock instant"
          - "bag.priority_score := rush_priority_score calculation"

      - from: CONFIRMED
        to: MISSED
        trigger: "system (automatic during run_ops when the current logical clock instant > the onward flight's sortation_close_utc and the bag's custody_status IN {LOADED, OFFLOADED, SORTED, IN_MAKEUP})"
        actor: system
        side_effects:
          - "connection.status → MISSED"
          - "bag.priority_score := rush_priority_score calculation (MISSED penalty applied)"
        note: "Connection state dependency on Flight: once the onward Flight's sortation window has closed the connection is missed."

      - from: RUSH
        to: MISSED
        trigger: "system (automatic during run_ops when the current logical clock instant > the onward flight's sortation_close_utc and the bag's custody_status IN {LOADED, OFFLOADED, SORTED, IN_MAKEUP})"
        actor: system
        side_effects:
          - "connection.status → MISSED"
          - "bag.priority_score := rush_priority_score calculation (MISSED penalty applied)"
        note: "Connection state dependency on Flight."

      - from: MISSED
        to: CONFIRMED
        trigger: "system (automatic whenever the connection's onward flight regains sortation capacity: the flight returns to SORT_OPEN, or connect_slack_minutes becomes non-negative after a reschedule)"
        actor: system
        preconditions:
          - "connection.status == MISSED"
          - "connection.connect_slack_minutes >= 0"
        side_effects:
          - "connection.status → CONFIRMED"
          - "bag.priority_score := rush_priority_score calculation"
        note: "Gives the MISSED state a non-terminal exit other than re-accommodation."

      - from: REACCOMMODATED
        to: CONFIRMED
        trigger: "system (automatic when the connection's slack recovers after a further reschedule)"
        actor: system
        preconditions:
          - "connection.status == REACCOMMODATED"
          - "connection.connect_slack_minutes >= 0"
        side_effects:
          - "connection.status → CONFIRMED"

      - from: RUSH
        to: CONFIRMED
        trigger: POST /connections/{id}/confirm
        actor: TransferAgent
        preconditions:
          - "connection.status == RUSH (ERR_INVALID_STATE)"
          - "connection.connect_slack_minutes >= 0 (ERR_MCT_VIOLATION)"
          - "the bag's screening_status == CLEARED (ERR_SCREENING_NOT_CLEARED)"
        side_effects:
          - "connection.status → CONFIRMED"
          - "bag.priority_score := rush_priority_score calculation"
        note: "The rush procedure is declared speculatively and released once slack recovers to non-negative."

      - from: MISSED
        to: REACCOMMODATED
        trigger: POST /connections/{id}/reaccommodate
        actor: TransferAgent
        preconditions:
          - "connection.status == MISSED (ERR_INVALID_STATE)"
          - "the supplied replacement onward flight differs from the current onward_flight_id (ERR_INVALID_REQUEST)"
          - "the replacement flight.status IN {SCHEDULED, SORT_OPEN} (ERR_FLIGHT_NOT_SORTING)"
        side_effects:
          - "connection.onward_flight_id := the replacement flight"
          - "connection.connect_slack_minutes := connection_slack_minutes calculation against the replacement flight"
          - "connection.status → REACCOMMODATED"
          - "bag.priority_score := rush_priority_score calculation"
        note: "Cross-entity dependency on Flight for the replacement flight's status."

      - from: REACCOMMODATED
        to: RUSH
        trigger: POST /connections/{id}/declare-rush
        actor: TransferAgent
        preconditions:
          - "connection.status == REACCOMMODATED (ERR_INVALID_STATE)"
          - "connection.connect_slack_minutes >= -15 (ERR_RUSH_WINDOW_PASSED)"
        side_effects:
          - "connection.status → RUSH and connection.rush_declared_utc := the current logical clock instant"
          - "bag.priority_score := rush_priority_score calculation"
        note: "Cycle edge 1 of 2."

      - from: REACCOMMODATED
        to: MISSED
        trigger: "system (automatic during run_ops when the replacement onward flight's sortation_close_utc has already passed and the bag's custody_status IN {LOADED, OFFLOADED, SORTED, IN_MAKEUP})"
        actor: system
        side_effects:
          - "connection.status → MISSED"
        note: "Cycle edge 2 of 2 — REACCOMMODATED → MISSED → REACCOMMODATED is a legal loop across successive re-accommodations."

  # ---------------------------------------------------------------------------
  # MishandledReport — long branch with a REOPENED loop.
  # ---------------------------------------------------------------------------
  - entity: MishandledReport
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: INVESTIGATING
        trigger: POST /reports/{id}/investigate
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == REPORTED (ERR_INVALID_STATE)"
        side_effects:
          - "report.status → INVESTIGATING"
          - "report.compensation_offer_cents := mishandled_compensation_offer calculation"
          - "report.final_liability_cents := mishandled_final_liability calculation"
          - "station.open_liability_cents := station_open_liability calculation"

      - from: INVESTIGATING
        to: DELIVERY_ARRANGED
        trigger: POST /reports/{id}/arrange-delivery
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == INVESTIGATING (ERR_INVALID_STATE)"
          - "a delivery_method is supplied (ERR_INVALID_REQUEST)"
        side_effects:
          - "report.status → DELIVERY_ARRANGED"
          - "report.delivery_method := the supplied method"
          - "report.compensation_offer_cents := mishandled_compensation_offer calculation"
          - "report.final_liability_cents := mishandled_final_liability calculation"
          - "the bag's Delivery row is updated (or created) with status IN_TRANSIT and mishandled_report_id set"
          - "station.open_liability_cents := station_open_liability calculation"

      - from: DELIVERY_ARRANGED
        to: DELIVERED
        trigger: POST /reports/{id}/mark-delivered
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == DELIVERY_ARRANGED (ERR_INVALID_STATE)"
        side_effects:
          - "report.status → DELIVERED"
          - "the bag's Delivery row, when one exists, status → DELIVERED with delivered_utc stamped; when none exists one is created directly in DELIVERED"
          - "report.final_liability_cents := mishandled_final_liability calculation (still the PROVISIONAL_HAIRCUT branch — DELIVERED is not a settled status)"
          - "station.open_liability_cents := station_open_liability calculation"

      - from: DELIVERED
        to: COMPENSATED
        trigger: POST /reports/{id}/compensate
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == DELIVERED (ERR_INVALID_STATE)"
          - "report.claim_status == APPROVED (ERR_CLAIM_NOT_APPROVED)"
        side_effects:
          - "report.status → COMPENSATED"
          - "report.claim_status → SETTLED"
          - "report.approved_cents and report.compensation_settled_cents := compensation_settlement calculation"
          - "report.compensation_settled_cents := report.approved_cents"
          - "report.final_liability_cents := mishandled_final_liability calculation (SETTLED variant)"
          - "the bag's Delivery row status → COMPENSATED (mutating the Delivery row itself, not the bag)"
          - "station.open_liability_cents := station_open_liability calculation"

      - from: COMPENSATED
        to: CLOSED
        trigger: POST /reports/{id}/close
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == COMPENSATED (ERR_INVALID_STATE)"
        side_effects:
          - "report.status → CLOSED"
          - "station.open_liability_cents := station_open_liability calculation (the report leaves the open set)"

      - from: INVESTIGATING
        to: CLOSED
        trigger: POST /reports/{id}/close
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == INVESTIGATING (ERR_INVALID_STATE)"
          - "report.claim_status IN {NONE, DENIED} (ERR_CLAIM_PENDING)"
        side_effects:
          - "report.status → CLOSED"
          - "station.open_liability_cents := station_open_liability calculation"

      - from: COMPENSATED
        to: REOPENED
        trigger: POST /reports/{id}/reopen
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == COMPENSATED (ERR_INVALID_STATE)"
        side_effects:
          - "report.status → REOPENED"
          - "report.claim_status → FILED"
          - "report.compensation_settled_cents := 0"
          - "report.approved_cents := 0"
          - "report.final_liability_cents := mishandled_final_liability calculation (PROVISIONAL_HAIRCUT variant)"
          - "the bag's Delivery row, when one exists, status → DELIVERED (the compensated credit is reversed)"
          - "station_liability_ledger recomputed"
        note: "Cycle edge 1 of 3 — the COMPENSATING ACTION for DELIVERED → COMPENSATED, and the anchor of the paid-claim liability invariant."

      - from: CLOSED
        to: REOPENED
        trigger: POST /reports/{id}/reopen
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "report.status → REOPENED"
          - "report.final_liability_cents := mishandled_final_liability calculation"
          - "station.open_liability_cents := station_open_liability calculation (the report re-enters the open set)"
        note: "Cycle edge 1 of 2."

      - from: REOPENED
        to: INVESTIGATING
        trigger: POST /reports/{id}/investigate
        actor: BaggageServiceAgent
        preconditions:
          - "report.status == REOPENED (ERR_INVALID_STATE)"
        side_effects:
          - "report.status → INVESTIGATING"
          - "report.compensation_offer_cents := mishandled_compensation_offer calculation"
          - "station.open_liability_cents := station_open_liability calculation"
        note: "Cycle edge 2 of 2 — REOPENED → INVESTIGATING → … → CLOSED → REOPENED is a legal loop."

  # ---------------------------------------------------------------------------
  # Flight — status sweep driven by makeup_ready and the logical clock.
  # ---------------------------------------------------------------------------
  - entity: Flight
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SORT_OPEN
        trigger: "system (automatic during run_ops when the current logical clock instant >= flight.sortation_open_utc)"
        actor: system
        side_effects:
          - "flight status swept; no other entity mutated"

      - from: SORT_OPEN
        to: BOARDING
        trigger: "system (automatic during run_ops when flight.makeup_ready == true and the current logical clock instant >= flight.sortation_close_utc - 15 minutes)"
        actor: system
        side_effects:
          - "flight.status → BOARDING"

      - from: BOARDING
        to: DEPARTED
        trigger: POST /flights/{id}/depart
        actor: PlatformAdmin
        preconditions:
          - "flight.status == BOARDING (ERR_INVALID_STATE)"
          - "the current logical clock instant >= flight.sortation_close_utc (ERR_SORTATION_WINDOW_OPEN)"
        side_effects:
          - "flight.status → DEPARTED"
        note: "Flight state dependency satisfied by the platform admin; DEPARTED unlocks the bag LOADED → DELIVERED transition."

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /flights/{id}/cancel
        actor: PlatformAdmin
        preconditions:
          - "flight.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "flight.status → CANCELLED"
          - "every Bag with flight_id == this flight and custody_status IN {SORTED, IN_MAKEUP} has custody_status → SORTED, flight_id cleared and makeup_area_id cleared, returning to the sortation pool"
          - "makeup_area.occupied_slots and makeup_area.free_slots := makeup_area_occupancy calculation for each affected area"
          - "station.posture := station_posture calculation"

      - from: SORT_OPEN
        to: CANCELLED
        trigger: POST /flights/{id}/cancel
        actor: PlatformAdmin
        preconditions:
          - "flight.status == SORT_OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "flight.status → CANCELLED"
          - "every Bag with flight_id == this flight and custody_status IN {SORTED, IN_MAKEUP} has custody_status → SORTED, flight_id cleared and makeup_area_id cleared"
          - "makeup_area.occupied_slots and makeup_area.free_slots := makeup_area_occupancy calculation for each affected area"
          - "station.posture := station_posture calculation"

      - from: SORT_OPEN
        to: SCHEDULED
        trigger: POST /flights/{id}/reschedule
        actor: PlatformAdmin
        preconditions:
          - "flight.status == SORT_OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "flight.scheduled_departure_utc := the supplied instant"
          - "flight.sortation_open_utc := scheduled_departure_utc - 120 minutes"
          - "flight.sortation_close_utc := scheduled_departure_utc - 45 minutes"
          - "every Connection whose onward_flight_id == this flight has connect_slack_minutes := connection_slack_minutes calculation"
          - "flight.status → SCHEDULED"
        note: "Cycle edge — a rescheduled flight returns to SCHEDULED and re-enters the sweep; the shifted departure ripples into every Connection slack on the transfer-bag axis."

  # ---------------------------------------------------------------------------
  # Delivery — downstream ledger of the mishandled-compensation cascade.
  # ---------------------------------------------------------------------------
  - entity: Delivery
    initial_state: PENDING
    terminal_states: [COMPENSATED]
    transitions:
      - from: PENDING
        to: IN_TRANSIT
        trigger: "system (automatic when the linked MishandledReport enters DELIVERY_ARRANGED, or when the bag is delivered on a routine path)"
        actor: system
        side_effects:
          - "delivery.status → IN_TRANSIT"
          - "delivery.method and delivery.scheduled_utc set from the report's arrangement"

      - from: IN_TRANSIT
        to: OUT_FOR_DELIVERY
        trigger: POST /deliveries/{id}/dispatch
        actor: BaggageServiceAgent
        preconditions:
          - "delivery.status == IN_TRANSIT (ERR_INVALID_STATE)"
          - "delivery.method == COURIER (ERR_INVALID_REQUEST)"
        side_effects:
          - "delivery.status → OUT_FOR_DELIVERY"
          - "delivery.courier_ref := the supplied reference"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: POST /deliveries/{id}/complete
        actor: BaggageServiceAgent
        preconditions:
          - "delivery.status == IN_TRANSIT (ERR_INVALID_STATE)"
          - "delivery.proof_required == false or a proof_of_delivery is supplied (ERR_PROOF_OF_DELIVERY_REQUIRED)"
        side_effects:
          - "delivery.status → DELIVERED and delivery.delivered_utc := the current logical clock instant"

      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: POST /deliveries/{id}/complete
        actor: BaggageServiceAgent
        preconditions:
          - "delivery.status == OUT_FOR_DELIVERY (ERR_INVALID_STATE)"
          - "delivery.proof_required == false or a proof_of_delivery is supplied (ERR_PROOF_OF_DELIVERY_REQUIRED)"
        side_effects:
          - "delivery.status → DELIVERED and delivery.delivered_utc := the current logical clock instant"

      - from: DELIVERED
        to: COMPENSATED
        trigger: "system (automatic when the linked MishandledReport enters COMPENSATED — the report mutates the Delivery row, not the Bag)"
        actor: system
        side_effects:
          - "delivery.status → COMPENSATED"
        note: |
          Final hop of the mishandled-compensation cascade. Ordering is pinned:
          the report's mark-delivered transition flips the Delivery row to
          DELIVERED first, and only then may compensate move it to COMPENSATED.
          The reverse is pinned too — reopening a COMPENSATED report moves the
          Delivery row back to DELIVERED, closing the four-status loop
          PENDING → IN_TRANSIT → DELIVERED → COMPENSATED → DELIVERED.

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: bag-mutation-stale-version
    parent_entity: Bag
    write_endpoint: "PUT /bags/{id}"
    occ_field: "expected_bag_version"
    description: |
      Mutating a Bag whose version has advanced since the client last observed
      it is rejected. The bag's version legitimately advances whenever its
      screening axis is written — an alarm resolution, an anomaly note, or a
      custody advance — so a client that read the bag before any of those and
      then writes back is carrying a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: makeup-assignment-stale-version
    parent_entity: Bag
    write_endpoint: "POST /bags/{id}/assign-makeup"
    occ_field: "expected_bag_version"
    description: |
      Assigning a make-up interval to a Bag whose version has advanced since
      the client last observed it is rejected. Resolution of a screening alarm
      or an anomaly note advances the bag's version between the client's read
      and this assignment, so the carried version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: report-reopen-stale-version
    parent_entity: MishandledReport
    write_endpoint: "POST /reports/{id}/reopen"
    occ_field: "expected_report_version"
    description: |
      Reopening a MishandledReport whose version has advanced since the client
      last observed it is rejected. Every report transition (investigate,
      arrange-delivery, mark-delivered, compensate, close) bumps the report's
      version, so a client carrying a version read before any of them is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Rule 1 instance 1: dual variant on the Bag ---------------------------------
  - name: excess_weight_fee
    trigger: "POST /bags/{id}/weigh (both the ACCEPTED → SCREENING and the HELD → ACCEPTED transitions)"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned: scale_weight_lb is FIRST rounded to the
      # nearest whole pound (round_half_up), THEN the ceiling division runs.
      w = round_half_up(bag.scale_weight_lb, 0)
      thr = airline.max_excess_weight_lb
      if w <= thr:
        excess_weight_fee_cents = 0
      else:
        groups = ceil((w - thr) / 5)
        excess_weight_fee_cents = groups * 7500
    input_set: "The released Bag and the Airline of the bag's flight; airline.max_excess_weight_lb is the threshold."
    constants:
      FEE_PER_5LB_GROUP_CENTS: 7500
      GROUP_SIZE_LB: 5
    precision: "0 decimal places, round_half_up; the pound rounding happens before the ceil, never after"
    variants:
      - name: CURRENT
        when: "station.outage_active == false at the instant of weighing"
        difference: "The fee is charged and bag.excess_weight_fee_cents equals groups * 7500."
      - name: HOLD
        when: "station.outage_active == true at the instant of weighing"
        difference: "bag.excess_weight_fee_cents is pinned to exactly 0 regardless of weight; the fee is deferred. The two variants therefore differ by groups * 7500 cents for identical bag data."

  # --- Rule 2 instance 1: mode (b) nested rounding ---------------------------------
  - name: handling_charge
    trigger: "POST /bags/{id}/weigh and POST /bags/{id}/load (and deliver/offload)"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned at the MIDDLE of a three-term sum:
      #   weight_lb is rounded to a whole pound FIRST, then base + special + intl
      #   are summed, then the subtotal is rounded once, then the params are added.
      w = round_half_up(bag.scale_weight_lb, 0)
      base = 700 + 25 * w
      special = 2600 * count(bag's SpecialItem rows)
      intl = 1800 if bag.itinerary_type == INTERNATIONAL else 0
      subtotal = round_half_up(base + special + intl, 0)
      params = 0
      handling_charge_cents = subtotal + params
      # variant PROVISIONAL freezes params at 0; variant FINAL sets params = 3700
      # only when the bag was ever HELD at screening (see variants below).
    input_set: "The Bag plus its SpecialItem rows (count only — every SpecialItem row on the bag is counted, regardless of item_type) and the Bag's itinerary_type."
    constants:
      BASE_CENTS: 700
      PER_LB_CENTS: 25
      PER_SPECIAL_ITEM_CENTS: 2600
      INTERNATIONAL_SURCHARGE_CENTS: 1800
      MANUAL_PARAMS_CENTS: 3700
    precision: "0 decimal places, round_half_up; the subtotal is rounded BEFORE params are added, so params are never re-rounded"
    variants:
      - name: PROVISIONAL
        when: "bag.custody_status IN {ACCEPTED, SCREENING, SORTED, IN_MAKEUP}; recomputed at every weigh"
        difference: "params = 0, so handling_charge_cents == subtotal."
      - name: FINAL
        when: "bag.custody_status IN {LOADED, DELIVERED, OFFLOADED}"
        difference: "params = 3700 when the bag was ever HELD at screening, else 0. For a 52.4 lb domestic bag with no special items the subtotal is 2000, so PROVISIONAL == 2000 and FINAL == 5700."

  # --- Rule 2 instance 2: mode (b) per-item rounding --------------------------------
  - name: oversize_handling_fee
    trigger: "POST /bags/{id}/special-items — recomputed for the bag's whole SpecialItem set"
    algorithm: aggregation
    formula: |
      # Round PER ITEM, THEN sum. Summing first and rounding once is the trap:
      # a 1.5x FRAGILE item at 6750.0 stays integral here, but at other
      # declared values the two orders differ by one cent, and the pinned
      # order is per-item.
      scale = 1 if bag.linear_in <= 62 else (2 if bag.linear_in <= 115 else 3)
      per_item_fee(item):
        raw = ITEM_BASE_FEE_CENTS[item.item_type]      # OVERSIZE 4500, FRAGILE 6725, SPORTS_EQUIPMENT 11250, MOBILITY_DEVICE 0
        if bag.linear_in >= 115:
          raw = raw * 1.25                            # = FRAGILE 8406.25 at scale 1
        return raw * scale
      oversize_handling_fee_cents = sum(round_half_up(per_item_fee(i), 0) for i in bag.SpecialItem rows)
    input_set: "Every SpecialItem row on the bag (item_type drives the multiplier); bag.linear_in drives the scale and the >= 115 surcharge."
    constants:
      ITEM_BASE_FEE_CENTS: "{OVERSIZE: 4500, FRAGILE: 6725, SPORTS_EQUIPMENT: 11250, MOBILITY_DEVICE: 0}"
      SCALE_LE_62: 1
      SCALE_LE_115: 2
      SCALE_GT_115: 3
      LONG_ITEM_SURCHARGE: 1.25
    precision: "0 decimal places, round_half_up PER ITEM before summing"
    note: |
      Worked: three FRAGILE items on a bag with linear_in 120 (scale 3, >= 115 surcharge).
      Per item raw = 6725 * 1.25 * 3 = 25218.75, rounded per item to 25219, so the
      pinned order yields 3 * 25219 = 75657. Summing first gives 75656.25, which
      rounds once to 75656 — the two orders differ by one cent, and the pinned
      order is the per-item one.
      At scale 1 with the surcharge each item is 8406.25 -> 8406, so three such
      items give 3 * 8406 = 25218 per item versus 25218.75 -> 25219 summed first
      — the same one-cent divergence in the other direction.
    variants:
      - name: NO_SPECIAL_ITEMS
        when: "the bag has no SpecialItem rows"
        difference: "oversize_handling_fee_cents == 0 and the field is not recomputed on weigh."

  - name: special_item_manual_screening_flag
    trigger: "POST /bags/{id}/special-items"
    algorithm: threshold
    formula: |
      requires_manual_screening = (item.item_type IN {MOBILITY_DEVICE, SPORTS_EQUIPMENT}) OR (bag.linear_in > 115)
      # boundary: linear_in == 115 exactly does NOT set the flag through the
      # linear test (it is > 115, not >= 115); it does set it through the
      # item_type test for the two listed types.
    input_set: "The SpecialItem row being created and its parent Bag's linear_in."
    constants:
      LINEAR_THRESHOLD_IN: 115
    precision: "n/a (boolean)"

  - name: special_item_liability_cap
    trigger: "POST /bags/{id}/special-items"
    algorithm: threshold
    formula: |
      base_cap = 200000 if item.item_type == MOBILITY_DEVICE else (50000 if item.item_type == FRAGILE else 100000)
      liability_cap_cents = min(item.declared_value_cents, base_cap)
    input_set: "The SpecialItem row's item_type and declared_value_cents."
    constants:
      CAP_MOBILITY_DEVICE_CENTS: 200000
      CAP_FRAGILE_CENTS: 50000
      CAP_OTHER_CENTS: 100000
    precision: "0 decimal places (integer cents, no rounding)"

  # --- Rule 1 instance 2: dual variant on the MishandledReport ----------------------
  - name: mishandled_compensation_offer
    trigger: "every MishandledReport transition: investigate, arrange-delivery, reopen (recomputed); close (frozen)"
    algorithm: forward_looking
    formula: |
      frac = TYPE_FRACTION[report.report_type]        # DELAYED 0.00, DAMAGED 0.50, LOST 0.75, PILFERED 0.60
      raw  = bag's max SpecialItem.declared_value_cents, or 0 when the bag has no SpecialItem rows
      offer = floor_half_up(raw * frac)
      special_cap = min(bag's SpecialItem.liability_cap_cents), or no clamp when the bag has none
      offer = min(offer, airline.compensation_cap_cents, special_cap)
      # evaluated in this order: fraction FIRST, the two caps SECOND (airline cap, then special cap — min is commutative so the caps' relative order is immaterial).
    input_set: "The report's report_type, the bag's SpecialItem rows (max declared value only), and the Airline of the bag's flight (compensation_cap_cents)."
    constants:
      FRAC_DELAYED: 0.0
      FRAC_DAMAGED: 0.50
      FRAC_LOST: 0.75
      FRAC_PILFERED: 0.60
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: PROVISIONAL
        when: "report.status IN {REPORTED, INVESTIGATING, DELIVERY_ARRANGED}; recomputed on every transition into those states"
        difference: "frac is used as declared (e.g. DAMAGED 0.50)."
      - name: FINAL
        when: "report.status IN {DELIVERED, COMPENSATED}; recomputed on transition into those states"
        difference: "frac is multiplied by 1.25 before the cap is applied (DAMAGED 0.625, LOST 0.9375, PILFERED 0.75). For a DAMAGED report on a bag with max declared value 120000 and cap 300000 the PROVISIONAL offer is 60000 and the FINAL offer is 75000 — identical inputs, different results."

  # --- Rule 2 instance 3 (bonus): mode (a) ------------------------------------------
  - name: mishandled_final_liability
    trigger: "every MishandledReport transition; recomputed into station.open_liability_cents on the station of custody"
    algorithm: weighted_scoring
    formula: |
      # Two branches only; there is NO settled-based fallback in the first, so the
      # value is a pure function of status + offer (and of the settled amount once
      # settled) — which is what makes the compensate / reverse-compensation
      # invariant hold.
      if report.status IN {REPORTED, INVESTIGATING, DELIVERY_ARRANGED, REOPENED, DELIVERED}:
        base = report.compensation_offer_cents * 0.75
      else:
        # COMPENSATED, CLOSED — the settled amount is realised in full
        base = report.compensation_settled_cents
      report.final_liability_cents = floor_half_up(base, 0)
    input_set: "The report's status, compensation_offer_cents, compensation_settled_cents, and the bag's SpecialItem liability caps (min across rows)."
    constants:
      OPEN_STATUS_HAIRCUT: 0.75
    precision: "0 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL_HAIRCUT
        when: "report.status IN {REPORTED, INVESTIGATING, DELIVERY_ARRANGED, REOPENED, DELIVERED}"
        difference: "0.75 x compensation_offer_cents. With an offer of 25000 the report records 18750."
      - name: REALISED
        when: "report.status IN {COMPENSATED, CLOSED}"
        difference: "no haircut — compensation_settled_cents is recorded in full. Conservation with the PROVISIONAL_HAIRCUT branch requires compensation_settled_cents == 0.75 x compensation_offer_cents, which compensation_settlement produces whenever the approved amount reaches the full offer."

  - name: compensation_settlement
    trigger: "POST /claims/{id}/decide and POST /reports/{id}/compensate"
    algorithm: waterfall_allocation
    formula: |
      approved_cents = min(claim.requested_amount_cents, report.compensation_offer_cents, airline.compensation_cap_cents)
      applied_cents  = min(approved_cents, report.final_liability_cents evaluated with the report in the status it held BEFORE this transition)
      report.approved_cents := approved_cents
      report.compensation_settled_cents := applied_cents
    input_set: "The filed Claim, the report's current compensation_offer_cents, the Airline's compensation_cap_cents, and the report's pre-transition final_liability_cents."
    constants: {}
    precision: "0 decimal places (integer cents, no rounding — every term is already integral)"
    variants:
      - name: CAPPED_BY_LIABILITY
        when: "approved_cents exceeds the report's pre-transition final_liability_cents"
        difference: "compensation_settled_cents is clamped to final_liability_cents while approved_cents keeps the higher figure, so the two fields legitimately disagree."

  # --- Rule 6 boundaries + Rule 4 hop 2 ----------------------------------------------
  - name: station_posture
    trigger: "any change to station.active_bag_count or to any of its make-up areas' occupancy"
    algorithm: threshold
    formula: |
      total_makeup_slots = sum(area.capacity_slots for ACTIVE areas of the station)
      free_makeup_slots  = sum(area.free_slots   for ACTIVE areas of the station)
      if active_bag_count >= sorter_capacity_bags:
        posture = SUSPENDED
      else if total_makeup_slots == 0:
        posture = OPEN          # guard: an empty make-up area set cannot be congested
      else if free_makeup_slots <= ceil(0.15 * total_makeup_slots):
        posture = CONGESTED
      else:
        posture = OPEN
    input_set: "The station's active_bag_count; its ACTIVE make-up areas' capacity_slots (total) and free_slots (sum), each from makeup_area_occupancy."
    constants:
      SUSPENDED_AT_FRACTION: 1.00
      CONGESTED_AT_FRACTION: 0.15
    precision: "integer comparison; the CONGESTED threshold is ceil(0.15 * total_makeup_slots), so 2 slots → 1 and 3 slots → 1"

  - name: station_active_bag_count
    trigger: "every Bag custody_status write"
    algorithm: aggregation
    formula: |
      active_bag_count = count(bag for bag in station where bag.custody_status IN {ACCEPTED, SCREENING, SORTED, IN_MAKEUP, LOADED, HELD})
      # DELIVERED and OFFLOADED bags are excluded.
    input_set: "All bags of the station, filtered to custody_status IN {ACCEPTED, SCREENING, SORTED, IN_MAKEUP, LOADED, HELD}."
    constants:
      COUNTED_STATES: "[ACCEPTED, SCREENING, SORTED, IN_MAKEUP, LOADED, HELD]"
    precision: "n/a (integer count)"

  - name: station_manual_queue_depth
    trigger: "every ManualInspectionTask status write"
    algorithm: aggregation
    formula: |
      manual_queue_depth = count(task for task in station where task.status IN {QUEUED, IN_PROGRESS})
    input_set: "All manual inspection tasks of the station filtered to status IN {QUEUED, IN_PROGRESS}; RESOLVED and ESCALATED are excluded."
    constants:
      COUNTED_STATUSES: "[QUEUED, IN_PROGRESS]"
    precision: "n/a (integer count)"

  - name: station_liability_ledger
    trigger: "every MishandledReport transition"
    algorithm: aggregation
    formula: |
      open_liability_cents = sum(report.final_liability_cents for report in station
                                 where report.status IN {REPORTED, INVESTIGATING, DELIVERY_ARRANGED, REOPENED})
      settled_liability_cents = sum(report.final_liability_cents for report in station
                                 where report.status IN {DELIVERED, COMPENSATED, CLOSED})
      # every report row lands in exactly one half — the two sums partition the
      # report set, so a status change moves value between the halves and never
      # creates or destroys it.
    input_set: "The station's reports, partitioned by status into the open set {REPORTED, INVESTIGATING, DELIVERY_ARRANGED, REOPENED} and the settled set {DELIVERED, COMPENSATED, CLOSED}."
    constants:
      OPEN_STATUSES: "[REPORTED, INVESTIGATING, DELIVERY_ARRANGED, REOPENED]"
      SETTLED_STATUSES: "[DELIVERED, COMPENSATED, CLOSED]"
    precision: "integer cents; the two halves must always sum to the sum of every report's final_liability_cents"

  - name: flight_makeup_ready
    trigger: "every Bag custody_status write and every ManualInspectionTask status write for a bag on this flight"
    algorithm: aggregation
    formula: |
      makeup_ready = (count(bag for bag in flight where bag.custody_status == HELD) == 0)
                     and (count(task for task in flight's bags where task.status IN {QUEUED, IN_PROGRESS}) == 0)
    input_set: "All bags of the flight and all manual inspection tasks whose bag belongs to the flight."
    constants: {}
    precision: "n/a (boolean); ESCALATED and RESOLVED tasks do not block makeup_ready"

  - name: flight_loaded_bag_count
    trigger: "every Bag custody_status write"
    algorithm: aggregation
    formula: |
      loaded_bag_count = count(bag for bag in flight where bag.custody_status == LOADED)
    input_set: "All bags of the flight filtered to custody_status == LOADED."
    constants: {}
    precision: "n/a (integer count)"

  # --- Rule 8 instance 2: capacity arithmetic as an integer bound -------------------
  - name: makeup_area_occupancy
    trigger: "every Bag custody_status write touching an area, and every Flight cancellation clearing an area"
    algorithm: aggregation
    formula: |
      occupied_slots = count(bag for bag in area where bag.custody_status IN {SORTED, IN_MAKEUP})
      # SORTED counts: a bag sitting in the sortation system already occupies a
      # make-up slot for the area it is destined to. LOADED releases the slot.
      free_slots = capacity_slots - occupied_slots
      released_slots = count(bag for bag in area where bag.custody_status IN {LOADED, OFFLOADED, DELIVERED, HELD})
    input_set: "Bags whose makeup_area_id is this area, split by custody_status: {SORTED, IN_MAKEUP} occupy a slot, {LOADED, OFFLOADED, DELIVERED, HELD} are released."
    constants: {}
    precision: "n/a (integer count); free_slots is reported as a plain integer"

  - name: sortation_release_rule
    trigger: "POST /bags/{id}/load while the station is in outage contingency"
    algorithm: threshold
    formula: |
      if station.outage_active and bag.routing_class == MANUAL:
        # MANUAL-CLASS RATE LIMIT — a cumulative rate, not an instantaneous one.
        # The strike count looks BACKWARD from station.outage_started_utc, not
        # from the present instant, so the allowance does not reset as the
        # outage drags on.
        manual_class_loaded = count(bag for bag in station
                                    where bag.loaded_utc >= station.outage_started_utc
                                      and bag.routing_class == MANUAL)
        if manual_class_loaded >= 5:
          reject with ERR_MAKEUP_RATE_LIMITED
      else:
        no rate limit applies to bags outside the MANUAL routing class, or to
        a station without an active outage
    input_set: "Bags of the station already loaded since outage_started_utc whose routing_class is MANUAL. The window is left-closed and open-ended: [outage_started_utc, now]."
    constants:
      MANUAL_CLASS_ALLOWANCE: 5
    precision: "integer count; the boundary is >= 5, so the fifth MANUAL-class bag is refused while the fourth is admitted"
    variants:
      - name: OUTAGE_ACTIVE
        when: "station.outage_active == true and bag.routing_class == MANUAL"
        difference: "the allowance is enforced against the backward window."
      - name: OUTAGE_INACTIVE
        when: "station.outage_active == false, or the bag is not MANUAL-class"
        difference: "no allowance is enforced at all."

  - name: interline_routing_class
    trigger: "POST /bags/{id}/weigh"
    algorithm: threshold
    formula: |
      # Evaluation order is pinned, top to bottom; the first matching rule wins.
      if bag.itinerary_type == INTERLINE and airline.interline_agreement_active == false:
        routing_class = MANUAL
      else if bag.itinerary_type == INTERLINE and round_half_up(bag.scale_weight_lb, 0) > airline.max_excess_weight_lb:
        routing_class = MANUAL
      else if bag.itinerary_type == INTERNATIONAL:
        routing_class = BULK_HOLD
      else:
        routing_class = STANDARD
    input_set: "The bag's itinerary_type and rounded scale_weight_lb, and the Airline of the bag's flight."
    constants: {}
    precision: "the weight comparison uses the pound-rounded scale_weight_lb, exactly as the excess-weight fee does"

  - name: rush_priority_score
    trigger: "recomputed on every Bag custody_status or screening_status write, every Connection status write, and every Flight transition"
    algorithm: weighted_scoring
    formula: |
      score = ROUTING_CLASS_POINTS[bag.routing_class] + CONNECTION_CLASS_POINTS[connection.status_or_NONE]
      if connection is null:            score += 120
      else if connection.connect_slack_minutes >= 0: score += 20
      else:                            score -= 60
      if abs(bag.weight_variance_lb) >= 10: score -= 40
      if bag.screening_status == CLEARED:   score += 30
      if current_utc >= flight.sortation_close_utc: score -= 100
      if connection.status == MISSED:       score += 200
    input_set: "The bag's routing_class, weight_variance_lb, screening_status; its Connection (any status) with connect_slack_minutes; its Flight's sortation_close_utc; and the logical clock instant."
    constants:
      ROUTING_CLASS_POINTS: "{STANDARD: 0, BULK_HOLD: 40, MANUAL: 80}"
      CONNECTION_CLASS_POINTS: "{NONE: 0, PENDING: 20, CONFIRMED: 50, RUSH: 150, REACCOMMODATED: 150, MISSED: 0}"
      NO_CONNECTION_BONUS: 120
      ON_TIME_BONUS: 20
      LATE_PENALTY: 60
      WEIGHT_VARIANCE_PENALTY: 40
      WEIGHT_VARIANCE_THRESHOLD_LB: 10
      CLEARED_BONUS: 30
      CLOSE_PASSED_PENALTY: 100
      MISSED_PENALTY: 200
    precision: "n/a (integer score)"
    note: |
      Worked values (pinned literals downstream asserts may cite):
      MANUAL + no connection + variance 0 + CLEARED + clock < close = 80 + 0 + 120 + 0 + 30 = 230.
      MANUAL + slack -8 + CLEARED + clock < close = 80 + 20 - 60 + 0 + 30 = 70.
      MANUAL + slack -8 + RUSH connection + CLEARED + clock < close = 80 + 150 - 60 + 0 + 30 = 200.
      MANUAL + slack -8 + RUSH connection + CLEARED + clock >= close = 80 + 150 - 60 + 0 + 30 - 100 = 100.
      MANUAL + slack -8 + RUSH connection + ALARMED + clock >= close = 80 + 150 - 60 + 0 + 0 - 100 = 70.
      STANDARD + slack 25 + variance 12 + CONFIRMED + CLEARED = 0 + 50 + 20 - 40 + 30 = 60.
      STANDARD + slack 25 + variance 12 + CONFIRMED + ALARMED = 0 + 50 + 20 - 40 + 0 = 30.

  - name: connection_slack_minutes
    trigger: "POST /connections, POST /connections/{id}/reaccommodate, and POST /flights/{id}/reschedule"
    algorithm: aggregation
    formula: |
      connect_slack_minutes = whole_minutes(onward_flight.scheduled_departure_utc - inbound_flight.scheduled_departure_utc) - connection.required_mct_minutes
      # whole_minutes truncates toward zero on the difference first, THEN the
      # required MCT is subtracted. Worked: onward 17:30, inbound 15:00,
      # required_mct_minutes 75 → 150 - 75 = 75.  Onward 17:30, inbound 15:00,
      # required_mct_minutes 165 → 150 - 165 = -15 (the exact RUSH boundary).
    input_set: "The inbound and onward Flight rows and the Connection's required_mct_minutes."
    constants: {}
    precision: "integer minutes; the departure difference is truncated before the MCT subtraction"

  - name: stale_request_expiry
    trigger: "POST /stations/{id}/run_ops"
    algorithm: chronological
    formula: |
      sort bags by created_at ascending, created_at as tie-break:
      for each bag with custody_status == ACCEPTED:
        if bag.ops_run_index_at_acceptance <= station.ops_run_index - 2:
          bag.custody_status = HELD, bag.screening_status = FAILED
      for each manual inspection task with status IN {QUEUED, IN_PROGRESS}:
        if task.due_utc <= current_utc and station.posture IN {CONGESTED, SUSPENDED}:
          task.status = ESCALATED
    input_set: "Bags of the station with custody_status ACCEPTED, and manual inspection tasks with status IN {QUEUED, IN_PROGRESS}. Ordering is by created_at ascending (never by id)."
    constants:
      STALE_OPS_RUNS: 2
      TASK_DUE_MINUTES: 30

    precision: "n/a (state writes); equal created_at values are broken by the lower ops_run_index_at_acceptance first, then by created_at ascending — id is never consulted"

  - name: outage_manual_sortation_delay
    trigger: "read-time derivation on every Bag GET while station.outage_active == true"
    algorithm: projection
    formula: |
      if station.outage_active == false: manual_sortation_delay_minutes = 0
      else:
        dwell = whole_minutes(current_utc - station.outage_started_utc)
        manual_sortation_delay_minutes = min(dwell, 45) + 15 * count(manual-scan BagScan rows on this bag while the outage is active)
      # the cap applies to the dwell term ONLY; the manual-scan term is uncapped.
    input_set: "The station's outage_active flag and outage_started_utc, plus the bag's BagScan rows with scan_source == MANUAL."
    constants:
      DWELL_CAP_MINUTES: 45
      MAKEUP_INTERVAL_MINUTES: 120
      PER_MANUAL_SCAN_MINUTES: 15
    precision: "integer minutes; the dwell term is truncated toward zero before the cap"

  - name: screen_alarm_resolution_time
    trigger: "read-time derivation on every Bag GET"
    algorithm: projection
    formula: |
      if the bag has no ScreeningEvent: screen_alarm_resolution_time_minutes = 0
      else:
        first = min(screening_event.created_at for the bag's events, tie-break created_at ascending)
        last  = max(screening_event.updated_at  for the bag's events, tie-break created_at ascending)
        screen_alarm_resolution_time_minutes = whole_minutes(last - first)
    input_set: "Every ScreeningEvent row of the bag; the earliest created_at and the latest updated_at."
    constants: {}
    precision: "integer minutes; truncation toward zero"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role permits this operation; an entity-backed role acting on a resource it does not own is rejected (X-User-ID must equal the resource's owning foreign key)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "A station outage is declared or cleared only through the outage endpoints; every other write against an outage-frozen station of custody while station.posture == SUSPENDED is rejected before any state check"
    error_id: ERR_STATION_SUSPENDED
    http_status: 409
    applies_to: ["POST /bags/{id}/assign-makeup", "POST /bags/{id}/load", "POST /bags/{id}/deliver"]

  - priority: 4
    category: business_safety
    check: "A bag with screening_status IN {ALARMED, FAILED, IN_INSPECTION} may not advance past the screening stage; the check runs before every custody-advance state precondition"
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 409
    applies_to: ["POST /bags/{id}/assign-makeup", "POST /bags/{id}/load", "POST /connections/{id}/confirm"]

  - priority: 5
    category: state
    check: "The target resource is in a state that admits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Weight, size and oversize envelope majeure: weight_lb must not exceed airline.max_excess_weight_lb + 20, declared linear_in must not exceed 130, and an OVERWEIGHT-size bag must not be inducted"
    error_id: "ERR_BAG_OVERWEIGHT / ERR_BAG_OVERSIZE"
    http_status: 422
    applies_to: ["POST /bags/{id}/weigh", "POST /bags"]

  - priority: 7
    category: business_temporal
    check: "Sortation scheduling curve: induction must fall inside the flight's [sortation_open_utc, sortation_close_utc] window; loading after the close is rejected"
    error_id: "ERR_SORTATION_WINDOW_CLOSED / ERR_FLIGHT_NOT_SORTING / ERR_SORTATION_WINDOW_OPEN"
    http_status: 409
    applies_to: ["POST /bags/{id}/assign-makeup", "POST /bags/{id}/load", "POST /flights/{id}/depart"]

  - priority: 8
    category: business_temporal
    check: "Make-up area interval claim: MEMBERSHIP on the occupied-interval list at the area's buffer_granularity (a 12-minute identity bucket), declared as the half-open interval [floor_to_12(assigned_makeup_utc), floor_to_12(assigned_makeup_utc) + makeup_interval_minutes); any existing occupied interval in the same identity bucket conflicts regardless of magnitude, and the area may never exceed capacity_slots distinct identity buckets"
    error_id: ERR_MAKEUP_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /bags/{id}/assign-makeup"]

  - priority: 9
    category: business_temporal
    check: "Screening lane admission: the lane's status must be ACTIVE, and the lane may host at most one non-FAILED screening window per identity bucket floor_to_20(start_utc); a window starting exactly at another window's end is legal"
    error_id: "ERR_LANE_OFFLINE / ERR_LANE_INTERVAL_CONFLICT"
    http_status: 409
    applies_to: ["POST /screenings"]

  - priority: 10
    category: business_referential
    check: "Interline integrity: itinerary_type == INTERLINE requires an Airline row whose interline_agreement_active is true; a false agreement is rejected"
    error_id: ERR_INTERLINE_AGREEMENT_INACTIVE
    http_status: 422
    applies_to: ["POST /bags"]

  - priority: 11
    category: business_constraint
    check: "Manual inspection gate: a sortation or load advance is rejected while the bag has an open (QUEUED or IN_PROGRESS) ManualInspectionTask"
    error_id: ERR_MANUAL_INSPECTION_REQUIRED
    http_status: 409
    applies_to: ["POST /bags/{id}/assign-makeup", "POST /bags/{id}/load"]

  - priority: 12
    category: business_constraint
    check: "Uniqueness within scope: Bag.tag_number is unique; Connection is unique on (bag_id, onward_flight_id); the station code and airline code are unique"
    error_id: "ERR_DUPLICATE_AIRLINE / ERR_DUPLICATE_CONNECTION"
    http_status: 409
    applies_to: ["POST /bags", "POST /connections"]

  - priority: 13
    category: business_fiscal
    check: "Claim settlement fiscal gate: a claim may be approved only for an unapproved, undecided report, and compensation paid only once per report within the airline's compensation_cap_cents"
    error_id: "ERR_CLAIM_ALREADY_DECIDED / ERR_COMPENSATION_ALREADY_PAID"
    http_status: 409
    applies_to: ["POST /claims/{id}/decide", "POST /reports/{id}/compensate"]

  - priority: 14
    category: concurrency
    check: "expected_<parent>_version in the body must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["PUT /bags/{id}", "POST /bags/{id}/assign-makeup", "POST /reports/{id}/reopen"]

  - priority: 15
    category: existence
    check: "Every referenced resource exists and is in scope (the id in each path segment, then each body foreign key)"
    error_id: "ERR_BAG_NOT_FOUND / ERR_REPORT_NOT_FOUND / ERR_FLIGHT_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Clock (test-driving, §1.5 priority-rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Set the logical clock. The server's startup default logical time is
      exactly 2026-09-01T00:00:00Z; before any call to this endpoint the clock
      reads that instant and MUST NOT fall back to real wall-clock time.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["every deadline, sortation window and outage dwell derives from this instant"]

  # --- Station ---
  - method: POST
    path: "/baggage/stations"
    description: "Open a station envelope"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, sorter_capacity_bags]
    output: Station
    side_effects: ["posture=OPEN, outage_active=false, active_bag_count=0, manual_queue_depth=0, open_liability_cents=0, ops_run_index=0"]

  - method: GET
    path: "/baggage/stations/{id}"
    description: "Get a station"
    roles: [PlatformAdmin, AcceptanceAgent, TransferAgent, BaggageServiceAgent]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: GET
    path: "/baggage/stations"
    description: "List stations"
    roles: [PlatformAdmin, BaggageServiceAgent]
    code: 200
    input: ["code?", "posture?", "limit?", "offset?"]
    output: Station[]
    side_effects: []

  - method: POST
    path: "/baggage/stations/{id}/outage"
    description: "Declare a sortation-system outage; stamps outage_started_utc from the logical clock"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Station
    side_effects: ["outage_active=true", "outage_started_utc := the current logical clock instant", "posture := SUSPENDED"]

  - method: POST
    path: "/baggage/stations/{id}/outage/clear"
    description: "Clear an active outage"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Station
    side_effects: ["outage_active=false", "posture := station_posture calculation"]

  - method: POST
    path: "/baggage/stations/{id}/run_ops"
    description: "Run the operations checkpoint: expiry sweep, task escalation, flight status sweep"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Station
    side_effects:
      - "ops_run_index += 1"
      - "ACCEPTED bags whose ops_run_index_at_acceptance <= ops_run_index - 2 → HELD with screening_status FAILED (stale acceptance expiry)"
      - "Connections whose onward flight's sortation_close_utc has passed and whose bag is LOADED, OFFLOADED, SORTED or IN_MAKEUP → MISSED"
      - "ManualInspectionTask rows with status IN {QUEUED, IN_PROGRESS} and due_utc <= the logical clock instant are escalated when the station posture is CONGESTED or SUSPENDED"
      - "manual tasks with due_utc <= clock and posture IN {CONGESTED,SUSPENDED} → ESCALATED"
      - "SCHEDULED flights with clock >= sortation_open_utc → SORT_OPEN; SORT_OPEN flights with makeup_ready and clock >= sortation_close_utc - 15m → BOARDING"
      - "station_posture, station_manual_queue_depth, flight_makeup_ready recomputed"

  # --- Airline ---
  - method: POST
    path: "/baggage/airlines"
    description: "Create an airline (carrier) record"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, interline_agreement_active, max_excess_weight_lb, excess_weight_fee_cents, compensation_cap_cents]
    output: Airline
    side_effects: []

  - method: GET
    path: "/baggage/airlines/{id}"
    description: "Get an airline"
    roles: [PlatformAdmin, AcceptanceAgent, TransferAgent, BaggageServiceAgent]
    code: 200
    input: []
    output: Airline
    side_effects: []

  - method: GET
    path: "/baggage/airlines"
    description: "List airlines"
    roles: [PlatformAdmin, BaggageServiceAgent]
    code: 200
    input: ["code?", "interline_agreement_active?", "limit?", "offset?"]
    output: Airline[]
    side_effects: []

  # --- MakeupArea ---
  - method: POST
    path: "/baggage/makeup-areas"
    description: "Create a make-up area"
    roles: [PlatformAdmin]
    code: 201
    input: [station_id, code, capacity_slots, buffer_minutes]
    output: MakeupArea
    side_effects: ["status=ACTIVE, occupied_slots=0"]

  - method: GET
    path: "/baggage/makeup-areas/{id}"
    description: "Get a make-up area"
    roles: [PlatformAdmin, SortationAgent, LoadAgent]
    code: 200
    input: []
    output: MakeupArea
    side_effects: []

  - method: GET
    path: "/baggage/makeup-areas"
    description: "List make-up areas, filterable by station"
    roles: [PlatformAdmin, SortationAgent, LoadAgent]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: MakeupArea[]
    side_effects: []

  - method: GET
    path: "/baggage/stations/{id}/makeup-areas"
    description: "List the make-up areas of a station"
    roles: [PlatformAdmin, SortationAgent, LoadAgent]
    code: 200
    input: []
    output: MakeupArea[]
    side_effects: []

  # --- ScreeningLane ---
  - method: POST
    path: "/baggage/screening-lanes"
    description: "Create an explosive-detection screening lane"
    roles: [PlatformAdmin]
    code: 201
    input: [station_id, lane_code]
    output: ScreeningLane
    side_effects: ["status=ACTIVE"]

  - method: POST
    path: "/baggage/screening-lanes/{id}/offline"
    description: "Take a screening lane out of service, for maintenance or a belt blockage"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ScreeningLane
    side_effects: ["status → OFFLINE", "no new screening window may be opened on the lane (ERR_LANE_OFFLINE)", "already-open windows on the lane are unaffected"]

  - method: POST
    path: "/baggage/screening-lanes/{id}/online"
    description: "Return a screening lane to service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ScreeningLane
    side_effects: ["status → ACTIVE"]

  - method: GET
    path: "/baggage/screening-lanes/{id}"
    description: "Get a screening lane"
    roles: [PlatformAdmin, Screener, SortationAgent]
    code: 200
    input: []
    output: ScreeningLane
    side_effects: []

  - method: GET
    path: "/baggage/screening-lanes"
    description: "List screening lanes"
    roles: [PlatformAdmin, Screener, SortationAgent]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: ScreeningLane[]
    side_effects: []

  # --- Flight ---
  - method: POST
    path: "/baggage/flights"
    description: "Create a flight"
    roles: [PlatformAdmin]
    code: 201
    input: [station_id, airline_id, flight_number, bank_code, scheduled_departure_utc]
    output: Flight
    side_effects: ["sortation_open_utc = scheduled_departure_utc - 120m", "sortation_close_utc = scheduled_departure_utc - 45m", "status=SCHEDULED, makeup_ready=true, loaded_bag_count=0"]

  - method: GET
    path: "/baggage/flights/{id}"
    description: "Get a flight"
    roles: [PlatformAdmin, AcceptanceAgent, SortationAgent, LoadAgent, TransferAgent]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: GET
    path: "/baggage/flights"
    description: "List flights, filterable by station, airline, bank or status"
    roles: [PlatformAdmin, AcceptanceAgent, SortationAgent, TransferAgent]
    code: 200
    input: ["station_id?", "airline_id?", "bank_code?", "status?", "limit?", "offset?"]
    output: Flight[]
    side_effects: []

  - method: GET
    path: "/baggage/stations/{id}/flights"
    description: "List the flights built at a station"
    roles: [PlatformAdmin, AcceptanceAgent, SortationAgent]
    code: 200
    input: []
    output: Flight[]
    side_effects: []

  - method: GET
    path: "/baggage/airlines/{id}/flights"
    description: "List the flights operated by an airline"
    roles: [PlatformAdmin, TransferAgent]
    code: 200
    input: []
    output: Flight[]
    side_effects: []

  - method: GET
    path: "/baggage/makeup-areas/{id}/flights"
    description: "List the flights built in a make-up area"
