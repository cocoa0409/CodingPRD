      - name: denied_required_permit_blocks_commissioning_until_a_replacement_is_approved
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /hail-ops/permits/{id}/decision]
          - endpoints[POST /hail-ops/facilities/{id}/commission]
          - state_machines.Permit
          - state_machines.Facility
          - errors[ERR_REQUIRED_PERMIT_MISSING]
        distinguishing_aspect: "DENY is the other half of the decision enum and must be a real terminal outcome: the DENIED permit carries no validity window, does not satisfy REQUIRED_PERMIT_TYPES coverage, and cannot be repaired in place — only a NEW ZONING_USE permit with an APPROVE decision lets commissioning through. An implementation that counts any decided permit, or that lets DENY carry valid_from/valid_to, commissions the facility one call too early."
