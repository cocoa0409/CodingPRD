            - "analyze response data.error_id == ERR_INCOMPLETE_TRIAL_MATRIX"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_start_depends_on_instrument_active
        grounds:
          - state_machines.CalibrationEvent.DRAFT_to_IN_PROGRESS
          - entities.Instrument.fields.lifecycle_status
          - validations[priority=10]
        distinguishing_aspect: |
          CalibrationEvent→Instrument pair: a CalibrationEvent's DRAFT→IN_PROGRESS
          start is rejected when the owning Instrument.lifecycle_status is
          QUARANTINED (ERR_INSTRUMENT_NOT_ACTIVE) using a fully traceable standard,
          so the failure is purely the cross-entity instrument state.
        test_recipe:
          setup:
            - "Instrument QUARANTINED by a prior FAILED event; a fresh DRAFT event with a measurement point and a traceable standard."
          setup_api_calls:
            - call: "POST /calibration-standards"
