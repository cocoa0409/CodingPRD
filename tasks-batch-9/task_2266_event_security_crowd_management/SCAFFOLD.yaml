scenario: |
  2266. Event Security & Crowd Management (event security services firm): venue risk assessment with threat,
  capacity and layout analysis to determine staffing plan, post assignment across perimeter, ingress screening,
  floor and emergency exits with supervisor spans, screening procedures, prohibited items policy and bag check
  throughput planning, crowd density monitoring, queue management and ingress surge mitigation at doors, incident
  response protocol with medical, ejection and law enforcement handoff procedures, event-specific training,
  briefing and radio communication structure, staffing sourcing across employees and subcontracted labor with
  credential verification, post-event incident reporting and after-action review

domain_name: event-security-crowd-management
api_prefix: /event-security

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: graph
  # graph: Post.reports_to_post_id is a self-referential span-of-control tree; StaffingPlan.supersedes_plan_id is
  # a self-referential revision chain; VenueZone is referenced from four different aggregates (Post, ScreeningLane,
  # DensityReading, Incident) so the FK web is not a tree.
  state_machine_shape: parallel
  # PostAssignment carries two independent state dimensions (assignment_status x duty_status). Also present:
  # cyclic (RiskAssessment revision loop, Guard re-certification loop, ScreeningLane OPEN<->HOLD, SecurityEvent
  # IN_PROGRESS<->SUSPENDED, AfterActionReview RETURNED->DRAFT), branching fork-join (Incident TRIAGED ->
  # {MEDICAL_HANDOFF | EJECTION_IN_PROGRESS | LE_HANDOFF} -> RESOLVED with divergent side-effect sets),
  # compound (Post.status derived from assignment counts, StaffingPlan.readiness_posture derived from Post states),
  # posture_driven (SecurityEvent.gate_posture gates every child mutation).
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  # 13 entities / 48 endpoints / 46 error codes / 12 calculations (5 carrying variants) / 10 state machines /
  # 38 ordered validations / 3 OCC rules. Deliberately above the Expert band per the "harder than expert"
  # instruction; density comes from the four-hop cascades and the pinned rounding/evaluation orders, not volume.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: venue trade name
        constraints: non-empty, max 120 chars
      - name: gross_capacity
        type: integer
        source: input
        description: licensed all-in occupant load for the whole venue
        constraints: ">= 1"
      - name: door_count
        type: integer
        source: input
        description: number of public ingress doors; also the floor for emergency-exit post staffing
        constraints: ">= 1"
      - name: egress_capacity_per_minute
        type: integer
        source: input
        description: persons per minute the venue can discharge in a full evacuation
        constraints: ">= 1"
      - name: perimeter_length_m
        type: integer
        source: input
        description: outer perimeter length in metres
        constraints: ">= 1"
      - name: alcohol_licensed
        type: boolean
        source: input
        description: whether the venue holds an alcohol licence
        default: false
      - name: prior_incident_rate
        type: number
        source: input
        description: historical incidents per 1000 attendees observed at this venue
        default: 0
        constraints: ">= 0, <= 25, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: venue availability
        default: ACTIVE
        constraints: "ACTIVE | UNDER_RENOVATION"

  - name: VenueZone
    parent: Venue
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; owning venue, taken from the path
      - name: zone_code
        type: string
        source: input
        description: operator-facing zone label
        constraints: unique within venue_id
      - name: zone_type
        type: enum
        source: input
        description: layout classification driving which post types may be placed here
        constraints: "PERIMETER | CONCOURSE | FLOOR | SEATED | EXIT_CORRIDOR | BACKSTAGE"
      - name: floor_area_sqm
        type: number
        source: input
        description: usable standing/seating area in square metres
        constraints: "> 0, 2 decimal places"
      - name: posted_capacity
        type: integer
        source: input
        description: placarded occupant load for the zone
        constraints: ">= 1"
      - name: exit_units
        type: integer
        source: input
        description: number of exit units (standard 22-inch egress widths) serving the zone
        constraints: ">= 1"
      - name: post_slot_capacity
        type: integer
        source: input
        description: maximum number of guard slots the zone can physically host at any single instant
        constraints: ">= 1"
      - name: is_ingress_zone
        type: boolean
        source: input
        description: whether patrons enter the venue through this zone
        default: false
      - name: max_safe_occupancy
        type: integer
        source: computed
        description: cross-entity computed occupancy ceiling; see calculations.zone_max_safe_occupancy

  - name: SecurityEvent
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; venue hosting the event
      - name: event_name
        type: string
        source: input
        description: event trade name
      - name: event_type
        type: enum
        source: input
        description: event category
        constraints: "CONCERT | SPORTING | FESTIVAL | CONVENTION | CIVIC_PROTEST"
      - name: doors_open_at
        type: datetime
        source: input
        description: scheduled public doors-open instant (ISO 8601 UTC)
      - name: event_start_at
        type: datetime
        source: input
        description: scheduled main-act / kickoff instant
        constraints: "> doors_open_at"
      - name: event_end_at
        type: datetime
        source: input
        description: scheduled end instant
        constraints: "> event_start_at"
      - name: expected_attendance
        type: integer
        source: input
        description: pre-sale attendance forecast; basis of the preliminary threat score
        constraints: ">= 1, <= venue.gross_capacity"
      - name: ticketed_attendance
        type: integer
        source: input
        description: confirmed tickets sold; null until the box office reports; basis of the final threat score
        default: null
        constraints: ">= 1, <= venue.gross_capacity when present"
      - name: alcohol_served
        type: boolean
        source: input
        description: whether alcohol is served at this event
        default: false
      - name: vip_present
        type: boolean
        source: input
        description: whether a protectee / VIP detail is present
        default: false
      - name: status
        type: enum
        source: system
        description: event operational lifecycle state
        default: PLANNING
        constraints: "PLANNING | RISK_ASSESSED | STAFFED | BRIEFED | DOORS_OPEN | IN_PROGRESS | SUSPENDED | CLOSED | DEBRIEFED"
      - name: ingress_status
        type: enum
        source: system
        description: door-flow control state used for queue management and surge mitigation
        default: NORMAL
        constraints: "NORMAL | METERED | HOLD"
      - name: gate_posture
        type: enum
        source: computed
        description: derived aggregate posture that gates child mutations; see calculations.event_gate_posture
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: open_critical_incident_count
        type: integer
        source: computed
        description: count of Incident rows on this event with severity CRITICAL and non-terminal status
        default: 0

  - name: RiskAssessment
    parent: SecurityEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SecurityEvent.id; assessed event, taken from the path
      - name: revision_number
        type: integer
        source: system
        description: increments each time a REJECTED assessment is revised back to DRAFT
        default: 1
      - name: threat_level_input
        type: enum
        source: input
        description: intelligence-derived threat level for this event
        constraints: "LOW | GUARDED | ELEVATED | HIGH | SEVERE"
      - name: protest_likelihood
        type: enum
        source: input
        description: likelihood of organised protest activity
        constraints: "NONE | POSSIBLE | LIKELY"
      - name: crowd_profile
        type: enum
        source: input
        description: expected crowd behaviour profile
        constraints: "SEATED | FAMILY | GENERAL_ADMISSION | MOSH_PIT"
      - name: ingress_door_count
        type: integer
        source: input
        description: number of doors actually opened for this event
        constraints: ">= 1"
      - name: layout_complexity_score
        type: integer
        source: input
        description: analyst rating of layout/sightline complexity
        constraints: "integer 1..5"
      - name: history_incident_rate
        type: number
        source: input
        description: incidents per 1000 attendees observed for comparable events
        constraints: ">= 0, <= 25, 2 decimal places"
      - name: attendance_basis
        type: enum
        source: computed
        description: which attendance number the current score was computed from
        default: EXPECTED
        constraints: "EXPECTED | TICKETED"
      - name: score_basis_attendance
        type: integer
        source: computed
        description: the attendance value actually fed into the score (mirrors attendance_basis)
      - name: composite_threat_score
        type: number
        source: computed
        description: weighted threat/capacity/layout score; see calculations.composite_threat_score
        constraints: "0.00 .. 100.00, 2 decimal places"
      - name: risk_tier
        type: enum
        source: computed
        description: tier derived from composite_threat_score; see calculations.risk_tier
        constraints: "T1 | T2 | T3 | T4"
      - name: required_line_guards
        type: integer
        source: computed
        description: see calculations.required_staff_matrix
      - name: required_perimeter_guards
        type: integer
        source: computed
        description: per-post-type component of required_line_guards
      - name: required_ingress_guards
        type: integer
        source: computed
        description: per-post-type component of required_line_guards
      - name: required_floor_guards
        type: integer
        source: computed
        description: per-post-type component of required_line_guards
      - name: required_exit_guards
        type: integer
        source: computed
        description: per-post-type component of required_line_guards
      - name: required_supervisors
        type: integer
        source: computed
        description: see calculations.supervisor_span_requirement
      - name: required_total_staff
        type: integer
        source: computed
        description: required_line_guards + required_supervisors
      - name: required_screening_lanes
        type: integer
        source: computed
        description: see calculations.screening_lane_requirement
      - name: minimum_staffing_cost_floor_cents
        type: integer
        source: computed
        description: see calculations.minimum_staffing_cost_floor
      - name: status
        type: enum
        source: system
        description: assessment approval state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that performed the SUBMIT action; null while DRAFT
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID that performed the APPROVE action
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: reviewer note captured on the REJECT action
        default: null

  - name: StaffingPlan
    parent: SecurityEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SecurityEvent.id; planned event, taken from the path
      - name: risk_assessment_id
        type: string
        source: input
        description: FK -> RiskAssessment.id; assessment this plan is sized from
      - name: pinned_risk_assessment_version
        type: integer
        source: system
        description: RiskAssessment.version captured at PUBLISH; the plan is sized against this snapshot
        default: null
      - name: supersedes_plan_id
        type: string
        source: system
        description: FK -> StaffingPlan.id; prior plan this revision replaced; null for the first plan
        default: null
      - name: budget_cents
        type: integer
        source: input
        description: authorised labour budget in whole cents
        constraints: ">= 1"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: see calculations.plan_cost_and_hours_ledger
        default: 0
      - name: billed_cost_cents
        type: integer
        source: computed
        description: sum of PostAssignment.billed_cost_cents over RELIEVED duty rows
        default: 0
      - name: budget_remaining_cents
        type: integer
        source: computed
        description: budget_cents - committed_cost_cents (conserved-quantity invariant)
      - name: committed_guard_hours
        type: number
        source: computed
        description: see calculations.plan_cost_and_hours_ledger
        default: 0
        constraints: 2 decimal places
      - name: required_total_staff
        type: integer
        source: computed
        description: sum of Post.required_guard_count over the plan's non-CLOSED posts
        default: 0
      - name: filled_total_staff
        type: integer
        source: computed
        description: see calculations.plan_coverage_and_posture
        default: 0
      - name: coverage_ratio
        type: number
        source: computed
        description: see calculations.plan_coverage_and_posture
        default: 0
        constraints: 2 decimal places
      - name: understaffed_post_count
        type: integer
        source: computed
        description: count of the plan's Post rows with status UNDERSTAFFED
        default: 0
      - name: readiness_posture
        type: enum
        source: computed
        description: see calculations.plan_coverage_and_posture
        default: BLOCKED
        constraints: "READY | AT_RISK | BLOCKED"
      - name: status
        type: enum
        source: system
        description: plan lifecycle state
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | ACTIVATED | LOCKED | CLOSED | SUPERSEDED"
      - name: is_current
        type: boolean
        source: computed
        description: true when status is not SUPERSEDED; exactly one current plan per event
        default: true

  - name: Post
    parent: StaffingPlan
    common_fields: true
    fields:
      - name: staffing_plan_id
        type: string
        source: input
        description: FK -> StaffingPlan.id; owning plan, taken from the path
      - name: zone_id
        type: string
        source: input
        description: FK -> VenueZone.id; zone the post stands in
      - name: reports_to_post_id
        type: string
        source: input
        description: FK -> Post.id; supervising SUPERVISOR post in the same plan; null when the post has no supervising post (always null on SUPERVISOR posts themselves)
        default: null
      - name: lane_id
        type: string
        source: input
        description: FK -> ScreeningLane.id; screening lane this post operates; only for INGRESS_SCREENING posts
        default: null
      - name: post_code
        type: string
        source: input
        description: radio-callable post label
        constraints: unique within staffing_plan_id
      - name: post_type
        type: enum
        source: input
        description: post function
        constraints: "PERIMETER | INGRESS_SCREENING | FLOOR | EMERGENCY_EXIT | SUPERVISOR"
      - name: required_guard_count
        type: integer
        source: input
        description: guard slots this post must have to be FILLED
        constraints: ">= 1"
      - name: min_credential_level
        type: integer
        source: input
        description: minimum Guard.credential_level allowed on this post
        constraints: "integer 1..4"
      - name: window_start
        type: datetime
        source: input
        description: post coverage window start (ISO 8601 UTC)
      - name: window_end
        type: datetime
        source: input
        description: post coverage window end
        constraints: "> window_start"
      - name: filled_guard_count
        type: integer
        source: computed
        description: see calculations.post_fill_and_status
        default: 0
      - name: status
        type: enum
        source: computed
        description: see calculations.post_fill_and_status
        default: OPEN
        constraints: "OPEN | PARTIALLY_STAFFED | FILLED | UNDERSTAFFED | CLOSED"

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: subcontracted labour vendor name
      - name: license_number
        type: string
        source: input
        description: state security-agency licence number
        constraints: globally unique across Subcontractor.license_number and Guard.license_number
      - name: insurance_expires_on
        type: datetime
        source: input
        description: general-liability certificate expiry instant
      - name: markup_pct
        type: number
        source: input
        description: contractual markup applied to subcontracted labour cost
        constraints: ">= 0, <= 0.60, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: vendor eligibility state
        default: PENDING
        constraints: "PENDING | APPROVED | SUSPENDED | TERMINATED"
      - name: verified_guard_count
        type: integer
        source: computed
        description: count of this vendor's Guard rows with verification_status VERIFIED
        default: 0

  - name: Guard
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: guard legal name
      - name: employment_type
        type: enum
        source: input
        description: sourcing channel
        constraints: "EMPLOYEE | SUBCONTRACTED"
      - name: subcontractor_id
        type: string
        source: input
        description: FK -> Subcontractor.id; required when employment_type is SUBCONTRACTED, must be null otherwise
        default: null
      - name: credential_level
        type: integer
        source: input
        description: guard card tier; 3 or higher is supervisor-qualified
        constraints: "integer 1..4"
      - name: license_number
        type: string
        source: input
        description: guard card number
        constraints: globally unique across Subcontractor.license_number and Guard.license_number
      - name: credential_expires_on
        type: datetime
        source: input
        description: guard card expiry instant
      - name: base_hourly_rate_cents
        type: integer
        source: input
        description: straight-time hourly rate in whole cents
        constraints: ">= 1"
      - name: verification_status
        type: enum
        source: system
        description: credential verification state
        default: UNVERIFIED
        constraints: "UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED | EXPIRED | DISQUALIFIED"
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant at which VERIFY succeeded
        default: null
      - name: is_supervisor_qualified
        type: boolean
        source: computed
        description: credential_level >= 3
        default: false

  - name: PostAssignment
    parent: null
    common_fields: true
    fields:
      - name: post_id
        type: string
        source: input
        description: FK -> Post.id; post being staffed
      - name: guard_id
        type: string
        source: input
        description: FK -> Guard.id; guard occupying the slot
      - name: window_start
        type: datetime
        source: input
        description: shift start (ISO 8601 UTC); must sit inside the post window
      - name: window_end
        type: datetime
        source: input
        description: shift end
        constraints: "> window_start"
      - name: assignment_status
        type: enum
        source: system
        description: roster dimension of the parallel state machine
        default: TENTATIVE
        constraints: "TENTATIVE | CONFIRMED | CANCELLED | VOIDED | COMPLETED"
      - name: duty_status
        type: enum
        source: system
        description: on-the-night dimension of the parallel state machine
        default: PENDING_BRIEF
        constraints: "PENDING_BRIEF | BRIEFED | ON_POST | NO_SHOW | RELIEVED"
      - name: scheduled_hours
        type: number
        source: computed
        description: see calculations.assignment_cost
        constraints: 2 decimal places
      - name: night_differential_applies
        type: boolean
        source: computed
        description: true when the UTC hour of window_start is >= 22 or < 6
        default: false
      - name: pay_basis
        type: enum
        source: computed
        description: which cost branch produced line_cost_cents
        constraints: "EMPLOYEE_STRAIGHT | EMPLOYEE_OT | SUBCONTRACT"
      - name: line_cost_cents
        type: integer
        source: computed
        description: see calculations.assignment_cost
      - name: billed_hours
        type: number
        source: computed
        description: actual hours between check_in_at and relieved_at; null until RELIEVE
        default: null
        constraints: 2 decimal places
      - name: billed_cost_cents
        type: integer
        source: computed
        description: assignment_cost recomputed on billed_hours at RELIEVE; null until RELIEVE
        default: null
      - name: radio_channel
        type: string
        source: input
        description: radio channel assigned at BRIEF
        default: null
      - name: training_module_code
        type: string
        source: input
        description: event-specific training module acknowledged at BRIEF
        default: null
      - name: briefed_at
        type: datetime
        source: system
        description: logical-clock instant of BRIEF
        default: null
      - name: check_in_at
        type: datetime
        source: system
        description: logical-clock instant of CHECK_IN
        default: null
      - name: relieved_at
        type: datetime
        source: system
        description: logical-clock instant of RELIEVE
        default: null
      - name: cancellation_reason
        type: string
        source: input
        description: note captured on CANCEL, or the system reason on VOID
        default: null

  - name: ScreeningLane
    parent: SecurityEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SecurityEvent.id; event this lane serves, taken from the path
      - name: zone_id
        type: string
        source: input
        description: FK -> VenueZone.id; ingress zone the lane sits in
      - name: lane_type
        type: enum
        source: input
        description: screening procedure run on the lane
        constraints: "WALKTHROUGH_MAG | HANDHELD_WAND | BAG_CHECK | EXPRESS_NO_BAG"
      - name: nominal_throughput_pph
        type: integer
        source: input
        description: manufacturer/procedure rated patrons per hour
        constraints: ">= 1"
      - name: operator_capacity
        type: integer
        source: input
        description: maximum concurrent operators the lane can physically host
        constraints: ">= 1"
      - name: open_from
        type: datetime
        source: input
        description: planned lane opening instant
      - name: open_to
        type: datetime
        source: input
        description: planned lane closing instant
        constraints: "> open_from"
      - name: status
        type: enum
        source: system
        description: lane operating state
        default: PLANNED
        constraints: "PLANNED | OPEN | HOLD | CLOSED"
      - name: assigned_operator_count
        type: integer
        source: computed
        description: count of ON_POST PostAssignment rows on Post rows whose lane_id is this lane
        default: 0
      - name: effective_throughput_pph
        type: integer
        source: computed
        description: see calculations.lane_effective_throughput
        default: 0

  - name: DensityReading
    parent: SecurityEvent
    common_fields: false
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SecurityEvent.id; observed event, taken from the path
      - name: zone_id
        type: string
        source: input
        description: FK -> VenueZone.id; observed zone
      - name: observed_at
        type: datetime
        source: input
        description: observation instant (ISO 8601 UTC)
      - name: observed_occupancy
        type: integer
        source: input
        description: head count observed in the zone
        constraints: ">= 0"
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporting operator
      - name: density_persons_per_sqm
        type: number
        source: computed
        description: see calculations.crowd_density_classification
        constraints: 3 decimal places
      - name: occupancy_ratio
        type: number
        source: computed
        description: observed_occupancy / zone.max_safe_occupancy
        constraints: 3 decimal places
      - name: rolling_mean_persons_per_sqm
        type: number
        source: computed
        description: mean density over the latest three readings for this (event_id, zone_id)
        constraints: 3 decimal places
      - name: instantaneous_level
        type: enum
        source: computed
        description: level from this reading alone
        constraints: "GREEN | AMBER | RED | CRITICAL"
      - name: rolling_level
        type: enum
        source: computed
        description: level from rolling_mean_persons_per_sqm
        constraints: "GREEN | AMBER | RED | CRITICAL"
      - name: effective_level
        type: enum
        source: computed
        description: the level that actually gates the event; see calculations.crowd_density_classification
        constraints: "GREEN | AMBER | RED | CRITICAL"

  - name: Incident
    parent: SecurityEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SecurityEvent.id; event the incident occurred at, taken from the path
      - name: zone_id
        type: string
        source: input
        description: FK -> VenueZone.id; zone the incident occurred in
      - name: category
        type: enum
        source: input
        description: incident category driving the permitted handoff branch
        constraints: "MEDICAL | EJECTION | LAW_ENFORCEMENT | CROWD_SURGE | PROHIBITED_ITEM"
      - name: severity
        type: enum
        source: input
        description: current severity; raised only by the ESCALATE action
        constraints: "MINOR | MODERATE | SEVERE | CRITICAL"
      - name: severity_at_report
        type: enum
        source: system
        description: severity as first reported; the SLA clock is keyed on this value, not on escalated severity
        constraints: "MINOR | MODERATE | SEVERE | CRITICAL"
      - name: description
        type: string
        source: input
        description: free-text report body
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the reporter
      - name: reported_at
        type: datetime
        source: system
        description: logical-clock instant at creation
      - name: triaged_at
        type: datetime
        source: system
        description: logical-clock instant of TRIAGE
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of RESOLVE or CLOSE_UNFOUNDED
        default: null
      - name: response_minutes
        type: number
        source: computed
        description: see calculations.incident_response_metrics
        default: null
        constraints: 2 decimal places
      - name: sla_breached
        type: boolean
        source: computed
        description: see calculations.incident_response_metrics
        default: false
      - name: handoff_agency_ref
        type: string
        source: input
        description: receiving agency reference captured on MEDICAL_HANDOFF / LE_HANDOFF
        default: null
      - name: ejection_patron_ref
        type: string
        source: input
        description: patron reference captured on EJECT
        default: null
      - name: resolution_note
        type: string
        source: input
        description: note captured on RESOLVE / CLOSE_UNFOUNDED
        default: null
      - name: status
        type: enum
        source: system
        description: incident response state
        default: REPORTED
        constraints: "REPORTED | TRIAGED | MEDICAL_HANDOFF | EJECTION_IN_PROGRESS | LE_HANDOFF | RESOLVED | CLOSED_UNFOUNDED"

  - name: AfterActionReview
    parent: SecurityEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: FK -> SecurityEvent.id; reviewed event, taken from the path
      - name: narrative
        type: string
        source: input
        description: after-action narrative body
      - name: corrective_action_count
        type: integer
        source: input
        description: number of corrective actions raised
        constraints: ">= 0"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID that created the review
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID that performed FINALIZE
        default: null
      - name: return_reason
        type: string
        source: input
        description: note captured on RETURN
        default: null
      - name: total_incident_count
        type: integer
        source: computed
        description: see calculations.after_action_metrics
        default: 0
      - name: sla_breach_count
        type: integer
        source: computed
        description: see calculations.after_action_metrics
        default: 0
      - name: peak_density_level
        type: enum
        source: computed
        description: see calculations.after_action_metrics
        default: GREEN
        constraints: "GREEN | AMBER | RED | CRITICAL"
      - name: no_show_rate
        type: number
        source: computed
        description: see calculations.after_action_metrics
        default: 0
        constraints: 4 decimal places
      - name: coverage_shortfall_minutes
        type: number
        source: computed
        description: see calculations.after_action_metrics
        default: 0
        constraints: 2 decimal places
      - name: status
        type: enum
        source: system
        description: review lifecycle state
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | RETURNED | FINALIZED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SecurityEvent
    initial_state: PLANNING
    terminal_states: [DEBRIEFED]
    transitions:
      - from: PLANNING
        to: RISK_ASSESSED
        trigger: "system, cascaded from POST /event-security/risk-assessments/{id}/decision action=APPROVE"
        actor: system
        preconditions:
          - "the approved RiskAssessment.event_id == this event"
          - "event.status == PLANNING"
        side_effects:
          - "SecurityEvent.status := RISK_ASSESSED"
          - "increments SecurityEvent.version by 1"
          - "recompute SecurityEvent.gate_posture per calculations.event_gate_posture"

      - from: RISK_ASSESSED
        to: STAFFED
        trigger: "system, cascaded from POST /event-security/staffing-plans/{id}/lifecycle action=ACTIVATE"
        actor: system
        preconditions:
          - "the activated StaffingPlan.event_id == this event AND StaffingPlan.is_current == true"
        side_effects:
          - "SecurityEvent.status := STAFFED"
          - "increments SecurityEvent.version by 1"

      - from: STAFFED
        to: BRIEFED
        trigger: "POST /event-security/security-events/{id}/lifecycle action=BRIEF"
        actor: SecurityDirector
        preconditions:
          - "the current StaffingPlan.status == ACTIVATED"
          - "the current StaffingPlan.readiness_posture == READY, else ERR_PLAN_NOT_READY (cross-entity: SecurityEvent depends on StaffingPlan)"
          - "every PostAssignment on the current plan's posts with assignment_status == CONFIRMED has duty_status != PENDING_BRIEF"
          - "event.gate_posture != FROZEN"
        side_effects:
          - "SecurityEvent.status := BRIEFED"
          - "increments SecurityEvent.version by 1"

      - from: BRIEFED
        to: DOORS_OPEN
        trigger: "POST /event-security/security-events/{id}/lifecycle action=DOORS_OPEN"
        actor: SecurityDirector
        preconditions:
          - "logical clock >= doors_open_at minus DOORS_OPEN_LEAD_MIN (60) minutes, else ERR_DOORS_OPEN_TOO_EARLY"
          - "every Post on the current plan with post_type == EMERGENCY_EXIT has filled_guard_count >= required_guard_count AND at least required_guard_count assignments with duty_status == ON_POST, else ERR_EXIT_POSTS_UNSTAFFED"
          - "count of ScreeningLane rows for this event with status == OPEN >= the pinned RiskAssessment.required_screening_lanes, else ERR_SCREENING_CAPACITY_INSUFFICIENT"
          - "event.gate_posture != FROZEN"
        side_effects:
          - "SecurityEvent.status := DOORS_OPEN"
          - "SecurityEvent.ingress_status := NORMAL"
          - "increments SecurityEvent.version by 1"

      - from: DOORS_OPEN
        to: IN_PROGRESS
        trigger: "POST /event-security/security-events/{id}/lifecycle action=START"
        actor: SecurityDirector
        preconditions:
          - "logical clock >= event_start_at"
        side_effects:
          - "SecurityEvent.status := IN_PROGRESS"
          - "increments SecurityEvent.version by 1"

      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /event-security/security-events/{id}/lifecycle action=SUSPEND"
        actor: SecurityDirector
        preconditions: []
        side_effects:
          - "SecurityEvent.status := SUSPENDED"
          - "SecurityEvent.ingress_status := HOLD"
          - "every ScreeningLane for this event with status == OPEN transitions OPEN -> HOLD"
          - "recompute SecurityEvent.gate_posture -> FROZEN (ingress_status == HOLD branch)"
          - "increments SecurityEvent.version by 1"

      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /event-security/security-events/{id}/lifecycle action=RESUME"
        actor: SecurityDirector
        preconditions:
          - "open_critical_incident_count == 0"
        side_effects:
          - "SecurityEvent.status := IN_PROGRESS"
          - "SecurityEvent.ingress_status := NORMAL"
          - "every ScreeningLane for this event with status == HOLD transitions HOLD -> OPEN"
          - "recompute SecurityEvent.gate_posture per calculations.event_gate_posture"
          - "increments SecurityEvent.version by 1"
        note: "cyclic: IN_PROGRESS <-> SUSPENDED may repeat any number of times"

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /event-security/security-events/{id}/lifecycle action=CLOSE"
        actor: SecurityDirector
        preconditions:
          - "logical clock >= event_end_at"
        side_effects:
          - "SecurityEvent.status := CLOSED"
          - "every PostAssignment on the current plan with duty_status == ON_POST transitions ON_POST -> RELIEVED (relieved_at := logical clock) and assignment_status CONFIRMED -> COMPLETED"
          - "every ScreeningLane for this event with status IN {PLANNED, OPEN, HOLD} transitions to CLOSED"
          - "the current StaffingPlan transitions LOCKED -> CLOSED (if ACTIVATED, it first transitions ACTIVATED -> LOCKED)"
          - "every Post on the current plan transitions to CLOSED"
          - "increments SecurityEvent.version by 1"

      - from: CLOSED
        to: DEBRIEFED
        trigger: "system, cascaded from POST /event-security/after-action-reviews/{id}/decision action=FINALIZE"
        actor: system
        preconditions:
          - "the finalized AfterActionReview.event_id == this event"
        side_effects:
          - "SecurityEvent.status := DEBRIEFED"
          - "increments SecurityEvent.version by 1"

  - entity: RiskAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /event-security/risk-assessments/{id}/decision action=SUBMIT"
        actor: RiskAnalyst
        preconditions:
          - "event.status IN {PLANNING, RISK_ASSESSED} (a replacement assessment may still be submitted after an earlier one was approved), else ERR_INVALID_STATE"
          - "event.gate_posture != FROZEN"
        side_effects:
          - "RiskAssessment.attendance_basis := EXPECTED and score_basis_attendance := event.expected_attendance"
          - "recompute composite_threat_score, risk_tier, required_perimeter_guards, required_ingress_guards, required_floor_guards, required_exit_guards, required_line_guards, required_supervisors, required_total_staff, required_screening_lanes, minimum_staffing_cost_floor_cents (preliminary variant)"
          - "RiskAssessment.submitted_by_user_id := X-User-ID"
          - "increments RiskAssessment.version by 1"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /event-security/risk-assessments/{id}/decision action=APPROVE"
        actor: SecurityDirector
        preconditions:
          - "X-User-ID != RiskAssessment.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "event.status IN {PLANNING, RISK_ASSESSED} (a replacement assessment may be approved while the event is RISK_ASSESSED; once a plan has been ACTIVATED the event has left both states and no further assessment may be approved), else ERR_INVALID_STATE"
        side_effects:
          - "if event.ticketed_attendance is not null then RiskAssessment.attendance_basis := TICKETED and score_basis_attendance := event.ticketed_attendance, else both keep the EXPECTED basis"
          - "recompute composite_threat_score, risk_tier, all required_* fields and minimum_staffing_cost_floor_cents (final variant)"
          - "RiskAssessment.approved_by_user_id := X-User-ID"
          - "any other RiskAssessment on the same event with status == APPROVED transitions APPROVED -> SUPERSEDED"
          - "cascade: SecurityEvent PLANNING -> RISK_ASSESSED"
          - "increments RiskAssessment.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /event-security/risk-assessments/{id}/decision action=REJECT"
        actor: SecurityDirector
        preconditions:
          - "X-User-ID != RiskAssessment.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "rejection_reason present in the request body"
        side_effects:
          - "RiskAssessment.rejection_reason := request rejection_reason"
          - "increments RiskAssessment.version by 1"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /event-security/risk-assessments/{id}/decision action=REVISE"
        actor: RiskAnalyst
        preconditions: []
        side_effects:
          - "RiskAssessment.revision_number += 1"
          - "RiskAssessment.submitted_by_user_id := null"
          - "RiskAssessment.rejection_reason := null"
          - "increments RiskAssessment.version by 1"
        note: "cyclic revision loop: DRAFT -> SUBMITTED -> REJECTED -> DRAFT may repeat any number of times"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, cascaded from another RiskAssessment on the same event reaching APPROVED"
        actor: system
        preconditions:
          - "a different RiskAssessment with the same event_id has just entered APPROVED"
        side_effects:
          - "RiskAssessment.status := SUPERSEDED"
          - "increments RiskAssessment.version by 1"

  - entity: StaffingPlan
    initial_state: DRAFT
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /event-security/staffing-plans/{id}/lifecycle action=PUBLISH"
        actor: StaffingCoordinator
        preconditions:
          - "risk_assessment.status == APPROVED, else ERR_ASSESSMENT_NOT_APPROVED (cross-entity: StaffingPlan depends on RiskAssessment)"
          - "count of Post rows on this plan with status != CLOSED >= 1, else ERR_PLAN_HAS_NO_POSTS"
          - "plan.required_total_staff >= risk_assessment.required_total_staff, else ERR_STAFFING_BELOW_ASSESSED_REQUIREMENT"
          - "budget_cents >= risk_assessment.minimum_staffing_cost_floor_cents, else ERR_PLAN_BUDGET_BELOW_FLOOR"
          - "event.gate_posture != FROZEN"
        side_effects:
          - "StaffingPlan.status := PUBLISHED"
          - "StaffingPlan.pinned_risk_assessment_version := risk_assessment.version (version pinning)"
          - "recompute required_total_staff, filled_total_staff, coverage_ratio, understaffed_post_count, readiness_posture per calculations.plan_coverage_and_posture"
          - "increments StaffingPlan.version by 1"

      - from: PUBLISHED
        to: DRAFT
        trigger: "POST /event-security/staffing-plans/{id}/lifecycle action=RECALL"
        actor: StaffingCoordinator
        preconditions:
          - "no PostAssignment on this plan's posts has assignment_status == CONFIRMED"
          - "event.gate_posture != FROZEN"
        side_effects:
          - "StaffingPlan.status := DRAFT"
          - "StaffingPlan.pinned_risk_assessment_version := null"
          - "recompute readiness_posture"
          - "increments StaffingPlan.version by 1"
        note: "cyclic: DRAFT -> PUBLISHED -> DRAFT may repeat"

      - from: PUBLISHED
        to: ACTIVATED
        trigger: "POST /event-security/staffing-plans/{id}/lifecycle action=ACTIVATE"
        actor: SecurityDirector
        preconditions:
          - "count of Post rows on this plan with status != CLOSED >= 1, else ERR_PLAN_HAS_NO_POSTS"
          - "event.status == RISK_ASSESSED"
          - "event.gate_posture != FROZEN"
        side_effects:
          - "StaffingPlan.status := ACTIVATED"
          - "recompute every Post.status on this plan per calculations.post_fill_and_status (posts below requirement become UNDERSTAFFED once the plan is ACTIVATED)"
          - "recompute coverage_ratio, understaffed_post_count, readiness_posture"
          - "cascade: SecurityEvent RISK_ASSESSED -> STAFFED"
          - "increments StaffingPlan.version by 1"

      - from: ACTIVATED
        to: LOCKED
        trigger: "POST /event-security/staffing-plans/{id}/lifecycle action=LOCK"
        actor: SecurityDirector
        preconditions:
          - "event.status IN {BRIEFED, DOORS_OPEN, IN_PROGRESS, SUSPENDED}"
        side_effects:
          - "StaffingPlan.status := LOCKED"
          - "all subsequent Post and PostAssignment roster mutations on this plan are rejected with ERR_PLAN_LOCKED"
          - "increments StaffingPlan.version by 1"

      - from: LOCKED
        to: CLOSED
        trigger: "system, cascaded from POST /event-security/security-events/{id}/lifecycle action=CLOSE"
        actor: system
        preconditions:
          - "event.status has just become CLOSED"
        side_effects:
          - "StaffingPlan.status := CLOSED"
          - "increments StaffingPlan.version by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, cascaded from POST /event-security/security-events/{id}/staffing-plans creating a newer plan"
        actor: system
        preconditions:
          - "a newer StaffingPlan for the same event_id has just been created"
        side_effects:
          - "StaffingPlan.status := SUPERSEDED and is_current := false"
          - "every PostAssignment on this plan's posts with assignment_status IN {TENTATIVE, CONFIRMED} transitions to CANCELLED with cancellation_reason 'PLAN_SUPERSEDED'"
          - "every Post on this plan transitions to CLOSED"
          - "recompute committed_cost_cents, budget_remaining_cents, committed_guard_hours, coverage_ratio, readiness_posture on this plan"
          - "increments StaffingPlan.version by 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system, cascaded from POST /event-security/security-events/{id}/staffing-plans creating a newer plan"
        actor: system
        preconditions:
          - "a newer StaffingPlan for the same event_id has just been created"
        side_effects:
          - "identical to the DRAFT -> SUPERSEDED side-effect set"

  - entity: Post
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: PARTIALLY_STAFFED
        trigger: "system, on any change to filled_guard_count"
        actor: system
        preconditions:
          - "0 < filled_guard_count < required_guard_count AND plan.status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "Post.status := PARTIALLY_STAFFED"
          - "increments Post.version by 1"

      - from: PARTIALLY_STAFFED
        to: FILLED
        trigger: "system, on any change to filled_guard_count"
        actor: system
        preconditions:
          - "filled_guard_count >= required_guard_count"
        side_effects:
          - "Post.status := FILLED"
          - "bubble up: recompute plan.filled_total_staff, coverage_ratio, understaffed_post_count, readiness_posture"
          - "increments Post.version by 1"

      - from: OPEN
        to: FILLED
        trigger: "system, on any change to filled_guard_count"
        actor: system
        preconditions:
          - "filled_guard_count >= required_guard_count"
        side_effects:
          - "Post.status := FILLED"
          - "bubble up: recompute plan.filled_total_staff, coverage_ratio, understaffed_post_count, readiness_posture"
          - "increments Post.version by 1"

      - from: FILLED
        to: UNDERSTAFFED
        trigger: "system, on any decrease of filled_guard_count while the plan is live"
        actor: system
        preconditions:
          - "filled_guard_count < required_guard_count AND plan.status IN {ACTIVATED, LOCKED}"
        side_effects:
          - "Post.status := UNDERSTAFFED"
          - "bubble up: plan.understaffed_post_count += 1; recompute plan.coverage_ratio and plan.readiness_posture"
          - "increments Post.version by 1"

      - from: OPEN
        to: UNDERSTAFFED
        trigger: "system, on POST /event-security/staffing-plans/{id}/lifecycle action=ACTIVATE"
        actor: system
        preconditions:
          - "filled_guard_count < required_guard_count AND plan.status IN {ACTIVATED, LOCKED}"
        side_effects:
          - "Post.status := UNDERSTAFFED"
          - "bubble up: plan.understaffed_post_count += 1; recompute plan.coverage_ratio and plan.readiness_posture"
          - "increments Post.version by 1"

      - from: PARTIALLY_STAFFED
        to: UNDERSTAFFED
        trigger: "system, on POST /event-security/staffing-plans/{id}/lifecycle action=ACTIVATE or on any decrease of filled_guard_count while the plan is live"
        actor: system
        preconditions:
          - "filled_guard_count < required_guard_count AND plan.status IN {ACTIVATED, LOCKED}"
        side_effects:
          - "Post.status := UNDERSTAFFED"
          - "bubble up: plan.understaffed_post_count += 1; recompute plan.coverage_ratio and plan.readiness_posture"
          - "increments Post.version by 1"

      - from: UNDERSTAFFED
        to: FILLED
        trigger: "system, on any increase of filled_guard_count"
        actor: system
        preconditions:
          - "filled_guard_count >= required_guard_count"
        side_effects:
          - "Post.status := FILLED"
          - "bubble up: plan.understaffed_post_count -= 1; recompute plan.coverage_ratio and plan.readiness_posture"
          - "increments Post.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "system, cascaded from plan SUPERSEDED or event CLOSE"
        actor: system
        preconditions:
          - "plan.status IN {SUPERSEDED, CLOSED}"
        side_effects:
          - "Post.status := CLOSED"
          - "increments Post.version by 1"

      - from: PARTIALLY_STAFFED
        to: CLOSED
        trigger: "system, cascaded from plan SUPERSEDED or event CLOSE"
        actor: system
        preconditions:
          - "plan.status IN {SUPERSEDED, CLOSED}"
        side_effects:
          - "Post.status := CLOSED"
          - "increments Post.version by 1"

      - from: FILLED
        to: CLOSED
        trigger: "system, cascaded from plan SUPERSEDED or event CLOSE"
        actor: system
        preconditions:
          - "plan.status IN {SUPERSEDED, CLOSED}"
        side_effects:
          - "Post.status := CLOSED"
          - "increments Post.version by 1"

      - from: UNDERSTAFFED
        to: CLOSED
        trigger: "system, cascaded from plan SUPERSEDED or event CLOSE"
        actor: system
        preconditions:
          - "plan.status IN {SUPERSEDED, CLOSED}"
        side_effects:
          - "Post.status := CLOSED"
          - "increments Post.version by 1"

  - entity: PostAssignment
    initial_state: TENTATIVE
    terminal_states: [CANCELLED, VOIDED, COMPLETED]
    note: |
      PARALLEL STATE DIMENSIONS. `assignment_status` (roster dimension, transitions below) and `duty_status`
      (on-the-night dimension, transitions below the divider) evolve independently on the same row. Only their
      conjunction decides whether the row counts toward Post.filled_guard_count: a row counts if and only if
      assignment_status IN {CONFIRMED, COMPLETED} AND duty_status != NO_SHOW.
    transitions:
      # ---- dimension 1: assignment_status ----
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=CONFIRM"
        actor: StaffingCoordinator
        preconditions:
          - "plan.status IN {PUBLISHED, ACTIVATED}, else ERR_INVALID_STATE; plan.status == LOCKED -> ERR_PLAN_LOCKED"
          - "plan.is_current == true, else ERR_PLAN_NOT_CURRENT"
          - "event.gate_posture != FROZEN, else ERR_EVENT_GATE_FROZEN"
          - "guard.verification_status == VERIFIED AND guard.credential_expires_on > assignment.window_end, else ERR_GUARD_CREDENTIAL_INVALID (cross-entity: PostAssignment depends on Guard)"
          - "guard.credential_level >= post.min_credential_level, else ERR_CREDENTIAL_LEVEL_INSUFFICIENT"
          - "post.post_type != SUPERVISOR OR guard.credential_level >= SUPERVISOR_MIN_CREDENTIAL_LEVEL (3), else ERR_SUPERVISOR_NOT_QUALIFIED"
          - "if guard.employment_type == SUBCONTRACTED then subcontractor.status == APPROVED AND subcontractor.insurance_expires_on > assignment.window_end, else ERR_SUBCONTRACTOR_NOT_ELIGIBLE (cross-entity: PostAssignment depends on Subcontractor)"
          - "no other PostAssignment for the same guard_id with assignment_status IN {TENTATIVE, CONFIRMED} half-open-overlaps this window, else ERR_GUARD_WINDOW_CONFLICT (overlapping TENTATIVE rows are allowed to exist; the clash is only enforced here, at confirmation)"
          - "count of PostAssignment on this post with assignment_status IN {CONFIRMED, COMPLETED} AND duty_status != NO_SHOW < post.required_guard_count, else ERR_POST_FULLY_STAFFED"
          - "line_cost_cents <= plan.budget_remaining_cents, else ERR_PLAN_BUDGET_EXCEEDED"
        side_effects:
          - "PostAssignment.assignment_status := CONFIRMED"
          - "hop 1 -> Post: post.filled_guard_count += 1 and Post.status recomputed per calculations.post_fill_and_status"
          - "hop 2 -> StaffingPlan: because Post.status changed, plan.filled_total_staff, coverage_ratio, understaffed_post_count and readiness_posture are recomputed per calculations.plan_coverage_and_posture"
          - "hop 3 -> SecurityEvent: because plan.readiness_posture changed, event.gate_posture is recomputed per calculations.event_gate_posture"
          - "ledger sync: plan.committed_cost_cents += this row's line_cost_cents; plan.committed_guard_hours += this row's scheduled_hours; plan.budget_remaining_cents := plan.budget_cents - plan.committed_cost_cents"
          - "increments PostAssignment.version by 1"

      - from: TENTATIVE
        to: CANCELLED
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=CANCEL"
        actor: StaffingCoordinator
        preconditions:
          - "plan.status != LOCKED, else ERR_PLAN_LOCKED"
          - "event.gate_posture != FROZEN, else ERR_EVENT_GATE_FROZEN"
        side_effects:
          - "PostAssignment.assignment_status := CANCELLED; cancellation_reason := request cancellation_reason"
          - "no ledger movement (a TENTATIVE row was never committed)"
          - "increments PostAssignment.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=CANCEL"
        actor: StaffingCoordinator
        preconditions:
          - "plan.status != LOCKED, else ERR_PLAN_LOCKED"
          - "duty_status IN {PENDING_BRIEF, BRIEFED}"
          - "event.gate_posture != FROZEN, else ERR_EVENT_GATE_FROZEN"
        side_effects:
          - "PostAssignment.assignment_status := CANCELLED; cancellation_reason := request cancellation_reason"
          - "hop 1 -> Post: post.filled_guard_count -= 1 and Post.status recomputed (FILLED -> UNDERSTAFFED once plan.status IN {ACTIVATED, LOCKED})"
          - "hop 2 -> StaffingPlan: because Post.status changed, plan.coverage_ratio, understaffed_post_count and readiness_posture are recomputed (READY -> BLOCKED when coverage_ratio < 0.90)"
          - "hop 3 -> SecurityEvent: because plan.readiness_posture changed, event.gate_posture is recomputed (OPEN -> RESTRICTED)"
          - "compensating ledger sync: plan.committed_cost_cents -= this row's line_cost_cents; plan.committed_guard_hours -= this row's scheduled_hours; plan.budget_remaining_cents := plan.budget_cents - plan.committed_cost_cents"
          - "increments PostAssignment.version by 1"

      - from: TENTATIVE
        to: VOIDED
        trigger: "system, cascaded from a Guard leaving VERIFIED (credential REJECT, clock-sweep EXPIRE, or vendor SUSPEND)"
        actor: system
        preconditions:
          - "guard.verification_status IN {REJECTED, EXPIRED, PENDING_REVIEW} after the triggering transition"
        side_effects:
          - "PostAssignment.assignment_status := VOIDED; cancellation_reason := 'CREDENTIAL_NOT_CURRENT'"
          - "increments PostAssignment.version by 1"

      - from: CONFIRMED
        to: VOIDED
        trigger: "system, cascaded from a Guard leaving VERIFIED (credential REJECT, clock-sweep EXPIRE, or vendor SUSPEND)"
        actor: system
        preconditions:
          - "guard.verification_status IN {REJECTED, EXPIRED, PENDING_REVIEW} after the triggering transition"
        side_effects:
          - "PostAssignment.assignment_status := VOIDED; cancellation_reason := 'CREDENTIAL_NOT_CURRENT'"
          - "hop 2 -> Post: post.filled_guard_count -= 1 and Post.status recomputed"
          - "hop 3 -> StaffingPlan: because Post.status changed, plan.coverage_ratio, understaffed_post_count and readiness_posture are recomputed"
          - "hop 4 -> SecurityEvent: because plan.readiness_posture changed, event.gate_posture is recomputed"
          - "compensating ledger sync: plan.committed_cost_cents -= line_cost_cents; plan.committed_guard_hours -= scheduled_hours; plan.budget_remaining_cents recomputed"
          - "increments PostAssignment.version by 1"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "system, cascaded from duty_status reaching RELIEVED"
        actor: system
        preconditions:
          - "duty_status == RELIEVED"
        side_effects:
          - "PostAssignment.assignment_status := COMPLETED"
          - "plan.billed_cost_cents += this row's billed_cost_cents"
          - "committed_cost_cents and committed_guard_hours are NOT changed (COMPLETED rows stay in the committed ledger)"
          - "increments PostAssignment.version by 1"

      # ---- dimension 2: duty_status ----
      - from: PENDING_BRIEF
        to: BRIEFED
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=BRIEF"
        actor: PostSupervisor
        preconditions:
          - "assignment_status == CONFIRMED, else ERR_INVALID_STATE"
          - "event.status IN {STAFFED, BRIEFED}, else ERR_INVALID_STATE"
          - "radio_channel and training_module_code present in the request body"
        side_effects:
          - "PostAssignment.duty_status := BRIEFED; radio_channel, training_module_code and briefed_at := logical clock are stored"
          - "increments PostAssignment.version by 1"

      - from: BRIEFED
        to: ON_POST
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=CHECK_IN"
        actor: PostSupervisor
        preconditions:
          - "assignment_status == CONFIRMED, else ERR_INVALID_STATE"
          - "duty_status == BRIEFED, else ERR_GUARD_NOT_BRIEFED"
          - "event.status IN {BRIEFED, DOORS_OPEN, IN_PROGRESS, SUSPENDED}"
          - "logical clock >= window_start minus CHECK_IN_LEAD_MIN (30) minutes"
        side_effects:
          - "PostAssignment.duty_status := ON_POST; check_in_at := logical clock"
          - "recompute lane.assigned_operator_count and lane.effective_throughput_pph for post.lane_id when it is not null"
          - "increments PostAssignment.version by 1"

      - from: PENDING_BRIEF
        to: NO_SHOW
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=MARK_NO_SHOW"
        actor: PostSupervisor
        preconditions:
          - "assignment_status == CONFIRMED"
          - "logical clock >= window_start plus NO_SHOW_GRACE_MIN (15) minutes"
        side_effects:
          - "PostAssignment.duty_status := NO_SHOW; assignment_status is deliberately left at CONFIRMED (parallel dimensions)"
          - "hop 1 -> Post: post.filled_guard_count recomputed (NO_SHOW rows are excluded) and Post.status recomputed"
          - "hop 2 -> StaffingPlan: coverage_ratio, understaffed_post_count and readiness_posture recomputed"
          - "hop 3 -> SecurityEvent: gate_posture recomputed"
          - "committed_cost_cents and committed_guard_hours are NOT changed (the shift is still contractually committed)"
          - "increments PostAssignment.version by 1"

      - from: BRIEFED
        to: NO_SHOW
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=MARK_NO_SHOW"
        actor: PostSupervisor
        preconditions:
          - "assignment_status == CONFIRMED"
          - "logical clock >= window_start plus NO_SHOW_GRACE_MIN (15) minutes"
        side_effects:
          - "identical to the PENDING_BRIEF -> NO_SHOW side-effect set"

      - from: ON_POST
        to: RELIEVED
        trigger: "POST /event-security/post-assignments/{id}/duty-events action=RELIEVE"
        actor: PostSupervisor
        preconditions:
          - "assignment_status == CONFIRMED"
          - "check_in_at is not null"
        side_effects:
          - "PostAssignment.duty_status := RELIEVED; relieved_at := logical clock"
          - "billed_hours and billed_cost_cents computed per calculations.assignment_cost on the actual check_in_at -> relieved_at span"
          - "cascade: assignment_status CONFIRMED -> COMPLETED"
          - "recompute lane.assigned_operator_count and lane.effective_throughput_pph for post.lane_id when it is not null"
          - "increments PostAssignment.version by 1"

  - entity: Guard
    initial_state: UNVERIFIED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /event-security/guards/{id}/credential-verification action=SUBMIT_FOR_REVIEW"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "Guard.verification_status := PENDING_REVIEW"
          - "increments Guard.version by 1"

      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /event-security/guards/{id}/credential-verification action=VERIFY"
        actor: CredentialAuditor
        preconditions:
          - "credential_expires_on > logical clock, else ERR_GUARD_CREDENTIAL_INVALID"
          - "if employment_type == SUBCONTRACTED then subcontractor.status == APPROVED AND subcontractor.insurance_expires_on > logical clock, else ERR_SUBCONTRACTOR_NOT_ELIGIBLE (cross-entity: Guard depends on Subcontractor)"
        side_effects:
          - "Guard.verification_status := VERIFIED; verified_at := logical clock"
          - "recompute subcontractor.verified_guard_count when subcontractor_id is not null"
          - "increments Guard.version by 1"
        note: "branching fast path: an auditor may verify straight from UNVERIFIED without a prior review request"

      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /event-security/guards/{id}/credential-verification action=VERIFY"
        actor: CredentialAuditor
        preconditions:
          - "credential_expires_on > logical clock, else ERR_GUARD_CREDENTIAL_INVALID"
          - "if employment_type == SUBCONTRACTED then subcontractor.status == APPROVED AND subcontractor.insurance_expires_on > logical clock, else ERR_SUBCONTRACTOR_NOT_ELIGIBLE"
        side_effects:
          - "Guard.verification_status := VERIFIED; verified_at := logical clock"
          - "recompute subcontractor.verified_guard_count when subcontractor_id is not null"
          - "increments Guard.version by 1"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /event-security/guards/{id}/credential-verification action=REJECT"
        actor: CredentialAuditor
        preconditions: []
        side_effects:
          - "Guard.verification_status := REJECTED; verified_at := null"
          - "hop 1 -> PostAssignment: every row for this guard with assignment_status IN {TENTATIVE, CONFIRMED} transitions to VOIDED"
          - "hop 2 -> Post: because those rows left the roster, each affected post's filled_guard_count and status are recomputed"
          - "hop 3 -> StaffingPlan: because those posts changed status, each affected plan's coverage_ratio, understaffed_post_count, readiness_posture, committed_cost_cents, committed_guard_hours and budget_remaining_cents are recomputed"
          - "hop 4 -> SecurityEvent: because those plans changed posture, each affected event's gate_posture is recomputed"
          - "affected rows are processed in PostAssignment.created_at ASC order (tie-break: post.created_at ASC)"
          - "increments Guard.version by 1"

      - from: VERIFIED
        to: PENDING_REVIEW
        trigger: "POST /event-security/guards/{id}/credential-verification action=SUBMIT_FOR_REVIEW"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "Guard.verification_status := PENDING_REVIEW"
          - "existing PostAssignment rows are NOT voided by a re-certification request (only REJECTED / EXPIRED void them)"
          - "increments Guard.version by 1"
        note: "cyclic re-certification loop"

      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /event-security/guards/{id}/credential-verification action=SUBMIT_FOR_REVIEW"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "Guard.verification_status := PENDING_REVIEW; credential_expires_on and credential_level are overwritten when supplied in the request body"
          - "increments Guard.version by 1"
        note: "cyclic: VERIFIED/REJECTED/EXPIRED -> PENDING_REVIEW -> VERIFIED may repeat any number of times"

      - from: VERIFIED
        to: EXPIRED
        trigger: "system, ops-run sweep inside POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "credential_expires_on <= the new logical clock value"
        side_effects:
          - "Guard.verification_status := EXPIRED; verified_at := null"
          - "hop 1 -> PostAssignment: every row for this guard with assignment_status IN {TENTATIVE, CONFIRMED} transitions to VOIDED"
          - "hop 2 -> Post: each affected post's filled_guard_count and status are recomputed"
          - "hop 3 -> StaffingPlan: each affected plan's coverage_ratio, understaffed_post_count, readiness_posture, committed_cost_cents, committed_guard_hours and budget_remaining_cents are recomputed"
          - "hop 4 -> SecurityEvent: each affected event's gate_posture is recomputed"
          - "guards are swept in Guard.created_at ASC order"
          - "increments Guard.version by 1"

      - from: EXPIRED
        to: PENDING_REVIEW
        trigger: "POST /event-security/guards/{id}/credential-verification action=SUBMIT_FOR_REVIEW"
        actor: StaffingCoordinator
        preconditions:
          - "credential_expires_on supplied in the request body and greater than the logical clock"
        side_effects:
          - "Guard.verification_status := PENDING_REVIEW; credential_expires_on := request credential_expires_on"
          - "increments Guard.version by 1"

      - from: REJECTED
        to: DISQUALIFIED
        trigger: "POST /event-security/guards/{id}/credential-verification action=DISQUALIFY"
        actor: CredentialAuditor
        preconditions: []
        side_effects:
          - "Guard.verification_status := DISQUALIFIED"
          - "increments Guard.version by 1"

  - entity: Subcontractor
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /event-security/subcontractors/{id}/decision action=APPROVE"
        actor: CredentialAuditor
        preconditions:
          - "insurance_expires_on > logical clock, else ERR_SUBCONTRACTOR_NOT_ELIGIBLE"
        side_effects:
          - "Subcontractor.status := APPROVED"
          - "increments Subcontractor.version by 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /event-security/subcontractors/{id}/decision action=SUSPEND"
        actor: CredentialAuditor
        preconditions: []
        side_effects:
          - "Subcontractor.status := SUSPENDED"
          - "hop 1 -> Guard: every Guard with this subcontractor_id and verification_status == VERIFIED transitions VERIFIED -> PENDING_REVIEW (guards swept in Guard.created_at ASC order)"
          - "hop 2 -> PostAssignment: because those guards left VERIFIED, their rows with assignment_status IN {TENTATIVE, CONFIRMED} transition to VOIDED"
          - "hop 3 -> Post: each affected post's filled_guard_count and status are recomputed"
          - "hop 4 -> StaffingPlan: each affected plan's coverage_ratio, readiness_posture and cost/hours ledger are recomputed; then each affected SecurityEvent.gate_posture is recomputed"
          - "recompute subcontractor.verified_guard_count"
          - "increments Subcontractor.version by 1"

      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /event-security/subcontractors/{id}/decision action=APPROVE"
        actor: CredentialAuditor
        preconditions:
          - "insurance_expires_on > logical clock"
        side_effects:
          - "Subcontractor.status := APPROVED"
          - "guards are NOT auto-re-verified; each must be VERIFIED again"
          - "increments Subcontractor.version by 1"
        note: "cyclic: APPROVED <-> SUSPENDED"

      - from: PENDING
        to: TERMINATED
        trigger: "POST /event-security/subcontractors/{id}/decision action=TERMINATE"
        actor: CredentialAuditor
        preconditions: []
        side_effects:
          - "Subcontractor.status := TERMINATED"
          - "increments Subcontractor.version by 1"

      - from: APPROVED
        to: TERMINATED
        trigger: "POST /event-security/subcontractors/{id}/decision action=TERMINATE"
        actor: CredentialAuditor
        preconditions: []
        side_effects:
          - "Subcontractor.status := TERMINATED"
          - "the SUSPEND cascade (hops 1-4) is applied identically before the status is written"
          - "increments Subcontractor.version by 1"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /event-security/subcontractors/{id}/decision action=TERMINATE"
        actor: CredentialAuditor
        preconditions: []
        side_effects:
          - "Subcontractor.status := TERMINATED"
          - "increments Subcontractor.version by 1"

  - entity: ScreeningLane
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /event-security/screening-lanes/{id}/status action=OPEN"
        actor: StaffingCoordinator
        preconditions:
          - "event.status IN {BRIEFED, DOORS_OPEN, IN_PROGRESS}, else ERR_INVALID_STATE"
          - "assigned_operator_count >= 1, else ERR_LANE_UNSTAFFED"
          - "event.gate_posture != FROZEN, else ERR_EVENT_GATE_FROZEN"
        side_effects:
          - "ScreeningLane.status := OPEN"
          - "recompute effective_throughput_pph per calculations.lane_effective_throughput"
          - "increments ScreeningLane.version by 1"

      - from: OPEN
        to: HOLD
        trigger: "POST /event-security/screening-lanes/{id}/status action=HOLD, or system cascade from an Incident reaching LE_HANDOFF at CRITICAL severity or from event SUSPEND"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "ScreeningLane.status := HOLD"
          - "effective_throughput_pph := 0"
          - "increments ScreeningLane.version by 1"

      - from: HOLD
        to: OPEN
        trigger: "POST /event-security/screening-lanes/{id}/status action=OPEN, or system cascade from event RESUME"
        actor: StaffingCoordinator
        preconditions:
          - "event.open_critical_incident_count == 0"
          - "assigned_operator_count >= 1, else ERR_LANE_UNSTAFFED"
        side_effects:
          - "ScreeningLane.status := OPEN"
          - "recompute effective_throughput_pph"
          - "increments ScreeningLane.version by 1"
        note: "cyclic: OPEN <-> HOLD"

      - from: PLANNED
        to: CLOSED
        trigger: "POST /event-security/screening-lanes/{id}/status action=CLOSE, or system cascade from event CLOSE"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "ScreeningLane.status := CLOSED; effective_throughput_pph := 0"
          - "increments ScreeningLane.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /event-security/screening-lanes/{id}/status action=CLOSE, or system cascade from event CLOSE"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "ScreeningLane.status := CLOSED; effective_throughput_pph := 0"
          - "increments ScreeningLane.version by 1"

      - from: HOLD
        to: CLOSED
        trigger: "POST /event-security/screening-lanes/{id}/status action=CLOSE, or system cascade from event CLOSE"
        actor: StaffingCoordinator
        preconditions: []
        side_effects:
          - "ScreeningLane.status := CLOSED; effective_throughput_pph := 0"
          - "increments ScreeningLane.version by 1"

  - entity: Incident
    initial_state: REPORTED
    terminal_states: [RESOLVED, CLOSED_UNFOUNDED]
    note: |
      BRANCHING FORK-JOIN. TRIAGED forks into three mutually exclusive handoff branches whose side-effect sets
      differ materially (only the LE_HANDOFF branch at CRITICAL severity freezes ingress), and all three join
      back into RESOLVED.
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /event-security/incidents/{id}/actions action=TRIAGE"
        actor: IncidentCommander
        preconditions:
          - "event.status IN {BRIEFED, DOORS_OPEN, IN_PROGRESS, SUSPENDED}"
        side_effects:
          - "Incident.status := TRIAGED; triaged_at := logical clock"
          - "response_minutes and sla_breached computed per calculations.incident_response_metrics"
          - "increments Incident.version by 1"

      - from: REPORTED
        to: CLOSED_UNFOUNDED
        trigger: "POST /event-security/incidents/{id}/actions action=CLOSE_UNFOUNDED"
        actor: IncidentCommander
        preconditions:
          - "resolution_note present in the request body"
        side_effects:
          - "Incident.status := CLOSED_UNFOUNDED; resolved_at := logical clock"
          - "recompute event.open_critical_incident_count and event.gate_posture"
          - "increments Incident.version by 1"

      - from: TRIAGED
        to: MEDICAL_HANDOFF
        trigger: "POST /event-security/incidents/{id}/actions action=MEDICAL_HANDOFF"
        actor: IncidentCommander
        preconditions:
          - "category == MEDICAL, else ERR_INVALID_STATE"
          - "handoff_agency_ref present in the request body"
        side_effects:
          - "Incident.status := MEDICAL_HANDOFF; handoff_agency_ref stored"
          - "branch-specific: ingress_status, lane statuses and gate_posture are NOT changed by this branch"
          - "increments Incident.version by 1"

      - from: TRIAGED
        to: EJECTION_IN_PROGRESS
        trigger: "POST /event-security/incidents/{id}/actions action=EJECT"
        actor: IncidentCommander
        preconditions:
          - "category IN {EJECTION, PROHIBITED_ITEM}, else ERR_INVALID_STATE"
          - "ejection_patron_ref present in the request body"
          - "at least one PostAssignment on the event's current plan with post.post_type == SUPERVISOR, assignment_status == CONFIRMED and duty_status == ON_POST exists, else ERR_NO_SUPERVISOR_ON_DUTY (cross-entity: Incident depends on PostAssignment)"
        side_effects:
          - "Incident.status := EJECTION_IN_PROGRESS; ejection_patron_ref stored"
          - "branch-specific: no ingress or lane side effects"
          - "increments Incident.version by 1"

      - from: TRIAGED
        to: LE_HANDOFF
        trigger: "POST /event-security/incidents/{id}/actions action=LE_HANDOFF"
        actor: IncidentCommander
        preconditions:
          - "category == LAW_ENFORCEMENT OR severity IN {SEVERE, CRITICAL}, else ERR_INVALID_STATE"
          - "handoff_agency_ref present in the request body"
          - "at least one PostAssignment on the event's current plan with post.post_type == SUPERVISOR, assignment_status == CONFIRMED and duty_status == ON_POST exists, else ERR_NO_SUPERVISOR_ON_DUTY"
        side_effects:
          - "Incident.status := LE_HANDOFF; handoff_agency_ref stored"
          - "branch-specific hop 1 -> SecurityEvent: if severity == CRITICAL then event.ingress_status := HOLD"
          - "branch-specific hop 2 -> ScreeningLane: because ingress_status became HOLD, every lane on this event with status == OPEN transitions OPEN -> HOLD (lanes swept in ScreeningLane.created_at ASC order)"
          - "branch-specific hop 3 -> SecurityEvent: because ingress_status is HOLD, event.gate_posture is recomputed to FROZEN"
          - "increments Incident.version by 1"

      - from: REPORTED
        to: REPORTED
        trigger: "POST /event-security/incidents/{id}/actions action=ESCALATE"
        actor: IncidentCommander
        preconditions:
          - "the requested severity has a strictly higher ordinal than the current severity (MINOR<MODERATE<SEVERE<CRITICAL), else ERR_SEVERITY_NOT_ESCALATING"
        side_effects:
          - "Incident.severity := request severity; severity_at_report is NOT changed"
          - "recompute event.open_critical_incident_count and event.gate_posture (a CRITICAL open incident forces FROZEN)"
          - "increments Incident.version by 1"

      - from: TRIAGED
        to: TRIAGED
        trigger: "POST /event-security/incidents/{id}/actions action=ESCALATE"
        actor: IncidentCommander
        preconditions:
          - "the requested severity has a strictly higher ordinal than the current severity, else ERR_SEVERITY_NOT_ESCALATING"
        side_effects:
          - "identical to the REPORTED -> REPORTED ESCALATE side-effect set"

      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /event-security/incidents/{id}/actions action=RESOLVE"
        actor: IncidentCommander
        preconditions:
          - "resolution_note present in the request body"
        side_effects:
          - "Incident.status := RESOLVED; resolved_at := logical clock"
          - "recompute event.open_critical_incident_count and event.gate_posture"
          - "increments Incident.version by 1"

      - from: MEDICAL_HANDOFF
        to: RESOLVED
        trigger: "POST /event-security/incidents/{id}/actions action=RESOLVE"
        actor: IncidentCommander
        preconditions:
          - "resolution_note present in the request body"
        side_effects:
          - "Incident.status := RESOLVED; resolved_at := logical clock"
          - "recompute event.open_critical_incident_count and event.gate_posture"
          - "increments Incident.version by 1"

      - from: EJECTION_IN_PROGRESS
        to: RESOLVED
        trigger: "POST /event-security/incidents/{id}/actions action=RESOLVE"
        actor: IncidentCommander
        preconditions:
          - "resolution_note present in the request body"
        side_effects:
          - "Incident.status := RESOLVED; resolved_at := logical clock"
          - "recompute event.open_critical_incident_count and event.gate_posture"
          - "increments Incident.version by 1"

      - from: LE_HANDOFF
        to: RESOLVED
        trigger: "POST /event-security/incidents/{id}/actions action=RESOLVE"
        actor: IncidentCommander
        preconditions:
          - "resolution_note present in the request body"
        side_effects:
          - "Incident.status := RESOLVED; resolved_at := logical clock"
          - "join-branch compensation: if event.open_critical_incident_count becomes 0 then event.ingress_status := NORMAL and every lane on this event with status == HOLD transitions HOLD -> OPEN when its assigned_operator_count >= 1"
          - "recompute event.gate_posture"
          - "increments Incident.version by 1"

  - entity: AfterActionReview
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /event-security/after-action-reviews/{id}/decision action=SUBMIT"
        actor: IncidentCommander
        preconditions:
          - "event.status == CLOSED, else ERR_INVALID_STATE"
          - "every Incident on the event has status IN {RESOLVED, CLOSED_UNFOUNDED}, else ERR_INVALID_STATE"
        side_effects:
          - "AfterActionReview.status := SUBMITTED"
          - "recompute total_incident_count, sla_breach_count, peak_density_level, no_show_rate and coverage_shortfall_minutes per calculations.after_action_metrics"
          - "increments AfterActionReview.version by 1"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /event-security/after-action-reviews/{id}/decision action=RETURN"
        actor: SecurityDirector
        preconditions:
          - "X-User-ID != AfterActionReview.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "return_reason present in the request body"
        side_effects:
          - "AfterActionReview.status := RETURNED; return_reason stored"
          - "increments AfterActionReview.version by 1"

      - from: RETURNED
        to: DRAFT
        trigger: "POST /event-security/after-action-reviews/{id}/decision action=REVISE"
        actor: IncidentCommander
        preconditions: []
        side_effects:
          - "AfterActionReview.status := DRAFT; return_reason := null"
          - "increments AfterActionReview.version by 1"
        note: "cyclic: DRAFT -> SUBMITTED -> RETURNED -> DRAFT may repeat"

      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /event-security/after-action-reviews/{id}/decision action=FINALIZE"
        actor: SecurityDirector
        preconditions:
          - "X-User-ID != AfterActionReview.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "AfterActionReview.status := FINALIZED; finalized_by_user_id := X-User-ID"
          - "recompute all after_action_metrics fields"
          - "cascade: SecurityEvent CLOSED -> DEBRIEFED"
          - "increments AfterActionReview.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-event
    parent_entity: SecurityEvent
    write_endpoint: "POST /event-security/security-events/{id}/staffing-plans"
    occ_field: "expected_event_version"
    description: |
      Creating a StaffingPlan against a SecurityEvent whose version has advanced since the client last observed
      it is rejected. A new plan legitimately supersedes the prior DRAFT/PUBLISHED plan for the event, so a
      writer holding a stale view of the event would silently discard planning work it never saw; the stale
      expected_event_version makes that condition observable and deterministic.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

  - rule_id: event-profile-update-stale
    parent_entity: SecurityEvent
    write_endpoint: "PATCH /event-security/security-events/{id}"
    occ_field: "expected_event_version"
    description: |
      Patching a SecurityEvent's attendance/flag profile with a stale expected_event_version is rejected. Box
      office updates to ticketed_attendance legitimately overwrite each other, so the value the client last
      observed is the only way to detect that the profile it is editing has already moved.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

  - rule_id: post-requirement-update-stale
    parent_entity: Post
    write_endpoint: "PATCH /event-security/posts/{id}"
    occ_field: "expected_post_version"
    description: |
      Re-profiling a Post (required_guard_count, min_credential_level or coverage window) with a stale
      expected_post_version is rejected. Successive re-profiles legitimately overwrite each other, and cascaded
      roster changes bump Post.version behind the client's back, so the observed version is the only safe basis.
    error_id: ERR_STALE_POST_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: zone_max_safe_occupancy
    trigger: "on POST /event-security/venues/{id}/zones (zone creation)"
    algorithm: threshold
    formula: |
      area_cap   = floor(floor_area_sqm / MIN_SQM_PER_PERSON)
      egress_cap = exit_units * PERSONS_PER_EXIT_UNIT
      max_safe_occupancy = min(posted_capacity, area_cap, egress_cap)
    input_set: "the zone's own posted_capacity, floor_area_sqm and exit_units; no cross-row aggregation"
    constants:
      MIN_SQM_PER_PERSON: 0.65
      PERSONS_PER_EXIT_UNIT: 100
    precision: "integer; floor() on the area term; all fractional arithmetic in exact decimal, never binary float"

  - name: composite_threat_score
    trigger: "on POST /event-security/risk-assessments/{id}/decision with action=SUBMIT (preliminary variant) and again with action=APPROVE (final variant)"
    algorithm: weighted_scoring
    formula: |
      basis_attendance = (attendance_basis == TICKETED) ? event.ticketed_attendance : event.expected_attendance
      load_ratio       = basis_attendance / venue.gross_capacity                     # exact decimal division
      density_pressure = min(DENSITY_PRESSURE_CAP, round(load_ratio * LOAD_POINTS_AT_FULL, 2))
      base_points      = THREAT_POINTS[threat_level_input]
                       + PROTEST_POINTS[protest_likelihood]
                       + PROFILE_POINTS[crowd_profile]
                       + LAYOUT_POINTS_PER_LEVEL * layout_complexity_score
                       + (event.alcohol_served ? ALCOHOL_POINTS : 0)
                       + (event.vip_present    ? VIP_POINTS     : 0)
                       + density_pressure
      crowd_factor     = min(CROWD_FACTOR_CAP, 1 + HISTORY_MULTIPLIER_STEP * history_incident_rate)
      composite_threat_score = min(SCORE_CEILING, round(base_points * crowd_factor, 2))
      # Evaluation order is pinned: density_pressure is rounded and capped BEFORE it enters base_points, and
      # crowd_factor is capped BEFORE the multiplication. Multiplying an uncapped factor by an unrounded
      # density_pressure and rounding once at the end is the rejected reading.
    input_set: "the assessment's own inputs plus event.alcohol_served / event.vip_present / the attendance field selected by attendance_basis, plus venue.gross_capacity"
    constants:
      THREAT_POINTS: { LOW: 0, GUARDED: 8, ELEVATED: 18, HIGH: 30, SEVERE: 44 }
      PROTEST_POINTS: { NONE: 0, POSSIBLE: 6, LIKELY: 15 }
      PROFILE_POINTS: { SEATED: 0, FAMILY: 2, GENERAL_ADMISSION: 10, MOSH_PIT: 20 }
      LAYOUT_POINTS_PER_LEVEL: 3
      ALCOHOL_POINTS: 7
      VIP_POINTS: 5
      LOAD_POINTS_AT_FULL: 30
      DENSITY_PRESSURE_CAP: 25
      HISTORY_MULTIPLIER_STEP: 0.04
      CROWD_FACTOR_CAP: 1.35
      SCORE_CEILING: 100
    precision: "2 decimal places, round_half_up; exact decimal arithmetic throughout"
    variants:
      - name: preliminary
        when: "on the SUBMIT action, and on the APPROVE action when event.ticketed_attendance is null"
        difference: "attendance_basis := EXPECTED; basis_attendance := event.expected_attendance"
      - name: final
        when: "on the APPROVE action when event.ticketed_attendance is not null"
        difference: "attendance_basis := TICKETED; basis_attendance := event.ticketed_attendance, which changes density_pressure, the score, the risk tier and therefore every required_* field"

  - name: risk_tier
    trigger: "immediately after every composite_threat_score computation (SUBMIT and APPROVE actions)"
    algorithm: threshold
    formula: |
      risk_tier = composite_threat_score >= TIER_T4_MIN ? T4
                : composite_threat_score >= TIER_T3_MIN ? T3
                : composite_threat_score >= TIER_T2_MIN ? T2
                : T1
      # Boundaries are inclusive-at-the-bottom (>=): a score of exactly 50.00 is T3, 49.99 is T2.
    input_set: "the assessment's freshly computed composite_threat_score only"
    constants:
      TIER_T2_MIN: 30
      TIER_T3_MIN: 50
      TIER_T4_MIN: 70
    precision: "comparison performed on the 2-decimal rounded score"

  - name: required_staff_matrix
    trigger: "immediately after every risk_tier computation (SUBMIT and APPROVE actions)"
    algorithm: tiered_pricing
    formula: |
      raw_line = basis_attendance / 1000 * GUARDS_PER_1000_BY_TIER[risk_tier]
      # ROUNDING ORDER IS PINNED: each post-type share is ceil()'d INDEPENDENTLY, then the four ceilings are
      # summed. Computing ceil(raw_line) first and splitting that integer across the shares is the rejected
      # reading and yields a different (smaller) total for almost every input.
      required_perimeter_guards = ceil(raw_line * PERIMETER_SHARE)
      required_ingress_guards   = ceil(raw_line * INGRESS_SHARE)
      required_floor_guards     = ceil(raw_line * FLOOR_SHARE)
      required_exit_guards      = max(ceil(raw_line * EXIT_SHARE), venue.door_count * EXIT_GUARDS_PER_DOOR)
      required_line_guards      = required_perimeter_guards + required_ingress_guards
                                + required_floor_guards + required_exit_guards
    input_set: "risk_tier and basis_attendance from this assessment, plus venue.door_count"
    constants:
      GUARDS_PER_1000_BY_TIER: { T1: 1.5, T2: 2.5, T3: 4.0, T4: 6.0 }
      PERIMETER_SHARE: 0.30
      INGRESS_SHARE: 0.25
      FLOOR_SHARE: 0.35
      EXIT_SHARE: 0.10
      EXIT_GUARDS_PER_DOOR: 1
    precision: "integer per share via ceil(); exact decimal arithmetic before each ceil()"

  - name: supervisor_span_requirement
    trigger: "immediately after every required_staff_matrix computation (SUBMIT and APPROVE actions)"
    algorithm: constraint_propagation
    formula: |
      # The dependency LOOKS circular: supervisors are staff, and staff need supervision. The evaluation order
      # is PINNED as a single downward pass over line guards only.
      first_line_supervisors  = ceil(required_line_guards / SPAN_OF_CONTROL)
      second_line_supervisors = first_line_supervisors > SUPERVISOR_SPAN_OF_CONTROL
                                ? ceil(first_line_supervisors / SUPERVISOR_SPAN_OF_CONTROL)
                                : 0
      required_supervisors    = first_line_supervisors + second_line_supervisors
      required_total_staff    = required_line_guards + required_supervisors
      # REJECTED reading (explicitly not implemented): solving the fixed point
      #   required_supervisors = ceil((required_line_guards + required_supervisors) / SPAN_OF_CONTROL)
      # which for required_line_guards = 10 yields 2 supervisors instead of 1.
      # Boundary: required_line_guards == 10 -> exactly 1 first-line supervisor (ceil is not >).
    input_set: "required_line_guards from this assessment only"
    constants:
      SPAN_OF_CONTROL: 10
      SUPERVISOR_SPAN_OF_CONTROL: 5
    precision: "integer via ceil()"

  - name: screening_lane_requirement
    trigger: "immediately after every supervisor_span_requirement computation (SUBMIT and APPROVE actions)"
    algorithm: threshold
    formula: |
      surge_patrons = ceil(basis_attendance * SURGE_FRACTION)
      bag_patrons   = ceil(surge_patrons * BAG_CARRY_RATE)
      nobag_patrons = surge_patrons - bag_patrons
      clearance_minutes = SURGE_WINDOW_MIN + MAX_QUEUE_WAIT_MIN
      # multiply FIRST, divide by 60 LAST, so the capacity is exact: 180 * 65 / 60 == 195 exactly.
      bag_lane_capacity   = BAG_CHECK_RATE_PPH * clearance_minutes / 60
      nobag_lane_capacity = NO_BAG_RATE_PPH    * clearance_minutes / 60
      # Rounding order pinned: ceil per stream, then sum the two integers.
      required_screening_lanes = ceil(bag_patrons / bag_lane_capacity) + ceil(nobag_patrons / nobag_lane_capacity)
    input_set: "basis_attendance from this assessment only"
    constants:
      SURGE_FRACTION: 0.55
      SURGE_WINDOW_MIN: 45
      MAX_QUEUE_WAIT_MIN: 20
      BAG_CARRY_RATE: 0.60
      BAG_CHECK_RATE_PPH: 180
      NO_BAG_RATE_PPH: 420
    precision: "integer via ceil(); exact decimal arithmetic (0.55 * 200 is exactly 110, never 110.00000000000001)"

  - name: minimum_staffing_cost_floor
    trigger: "immediately after every supervisor_span_requirement computation (SUBMIT and APPROVE actions); read again as a PUBLISH precondition"
    algorithm: aggregation
    formula: |
      minimum_staffing_cost_floor_cents = required_total_staff * FLOOR_HOURS_PER_STAFF * MIN_FLOOR_HOURLY_CENTS
    input_set: "required_total_staff from this assessment only"
    constants:
      FLOOR_HOURS_PER_STAFF: 4
      MIN_FLOOR_HOURLY_CENTS: 1800
    precision: "integer cents"

  - name: assignment_cost
    trigger: "on POST /event-security/post-assignments (creation, on the scheduled window) and again on POST /event-security/post-assignments/{id}/duty-events action=RELIEVE (on the actual check_in_at -> relieved_at span, written to billed_hours / billed_cost_cents)"
    algorithm: tiered_pricing
    formula: |
      hours          = round((window_end - window_start) total_minutes / 60, 2)     # scheduled_hours
      night_differential_applies = (UTC hour-of-day of window_start >= NIGHT_START_HOUR) OR
                                   (UTC hour-of-day of window_start <  NIGHT_END_HOUR)
      straight_hours = min(hours, OT_THRESHOLD_HOURS)
      ot_hours       = max(0, hours - OT_THRESHOLD_HOURS)
      # ROUNDING ORDER IS PINNED at three levels, and each level rounds to whole cents:
      #   (1) straight pay and overtime pay are rounded SEPARATELY, then added;
      #   (2) the night differential is rounded separately and added;
      #   (3) the subcontract markup is applied to the already-rounded (base + night) subtotal, rounded again,
      #       and only then is the flat admin fee added.
      base_cents  = round(guard.base_hourly_rate_cents * straight_hours)
                  + round(guard.base_hourly_rate_cents * OT_MULTIPLIER * ot_hours)
      night_cents = night_differential_applies
                    ? round(NIGHT_DIFFERENTIAL_CENTS_PER_HOUR * hours) : 0
      if guard.employment_type == SUBCONTRACTED:
          line_cost_cents = round((base_cents + night_cents) * (1 + subcontractor.markup_pct))
                          + SUBCONTRACT_ADMIN_FEE_CENTS
          pay_basis = SUBCONTRACT
      else:
          line_cost_cents = base_cents + night_cents
          pay_basis = (ot_hours > 0) ? EMPLOYEE_OT : EMPLOYEE_STRAIGHT
    input_set: "this assignment's window, guard.base_hourly_rate_cents, guard.employment_type and (when subcontracted) subcontractor.markup_pct"
    constants:
      OT_THRESHOLD_HOURS: 8
      OT_MULTIPLIER: 1.5
      NIGHT_DIFFERENTIAL_CENTS_PER_HOUR: 150
      NIGHT_START_HOUR: 22
      NIGHT_END_HOUR: 6
      SUBCONTRACT_ADMIN_FEE_CENTS: 1200
    precision: "hours to 2 decimal places round_half_up; every cents value round_half_up to a whole cent"
    variants:
      - name: scheduled
        when: "at assignment creation"
        difference: "hours := scheduled window span; result stored in scheduled_hours / line_cost_cents and used for the committed ledger"
      - name: billed
        when: "on the RELIEVE action"
        difference: "hours := round((relieved_at - check_in_at) total_minutes / 60, 2); result stored in billed_hours / billed_cost_cents and aggregated into plan.billed_cost_cents; the committed ledger is deliberately left untouched"

  - name: plan_cost_and_hours_ledger
    trigger: "on every PostAssignment assignment_status transition into or out of {CONFIRMED, COMPLETED} — i.e. as a side effect of CONFIRM, CANCEL, RELIEVE and the system VOID cascade — and on plan SUPERSEDED"
    algorithm: aggregation
    formula: |
      LEDGER_SET = { PostAssignment a : a.post.staffing_plan_id == plan.id
                                       AND a.assignment_status IN {CONFIRMED, COMPLETED} }
      # ROUNDING ORDER IS PINNED: each a.line_cost_cents is already a whole-cent value rounded at the
      # assignment level (see assignment_cost); the plan sums those ALREADY-ROUNDED integers. Summing the
      # unrounded per-assignment products and rounding once at the plan level is the rejected reading and
      # differs by up to one cent per assignment.
      committed_cost_cents   = sum of a.line_cost_cents   over LEDGER_SET
      committed_guard_hours  = round(sum of a.scheduled_hours over LEDGER_SET, 2)
      budget_remaining_cents = plan.budget_cents - committed_cost_cents
      billed_cost_cents      = sum of a.billed_cost_cents over { a in LEDGER_SET : a.duty_status == RELIEVED }
      # CONSERVED QUANTITY 1 (money): budget_remaining_cents + committed_cost_cents == budget_cents holds after
      #   every request, and CONFIRM followed by CANCEL of the same row restores budget_remaining_cents exactly.
      # CONSERVED QUANTITY 2 (labour hours): committed_guard_hours equals the sum over LEDGER_SET at all times,
      #   so CONFIRM followed by the VOID cascade restores the pre-CONFIRM committed_guard_hours exactly.
      # Aggregation order: LEDGER_SET is summed in a.created_at ASC order (tie-break: a.post.created_at ASC).
    input_set: "PostAssignment rows on the plan's posts with assignment_status IN {CONFIRMED, COMPLETED}; TENTATIVE, CANCELLED and VOIDED rows are excluded, so a pencilled-in row moves no money until it is CONFIRMED"
    constants: {}
    precision: "integer cents; hours to 2 decimal places round_half_up"

  - name: post_fill_and_status
    trigger: "on every PostAssignment transition in either dimension that changes roster membership (CONFIRM, CANCEL, VOID, MARK_NO_SHOW), on PATCH /event-security/posts/{id}, and on plan ACTIVATE / SUPERSEDED / CLOSE"
    algorithm: aggregation
    formula: |
      filled_guard_count = count of PostAssignment a where a.post_id == post.id
                           AND a.assignment_status IN {CONFIRMED, COMPLETED}
                           AND a.duty_status != NO_SHOW
      # Status is resolved by this pinned first-match ladder — the order matters because a post can satisfy
      # more than one clause:
      #   1. plan.status IN {SUPERSEDED, CLOSED}                              -> CLOSED
      #   2. filled_guard_count >= required_guard_count                       -> FILLED
      #   3. plan.status IN {ACTIVATED, LOCKED}                               -> UNDERSTAFFED
      #   4. filled_guard_count > 0                                           -> PARTIALLY_STAFFED
      #   5. otherwise                                                        -> OPEN
    input_set: "PostAssignment rows on this post with assignment_status IN {CONFIRMED, COMPLETED} and duty_status != NO_SHOW; TENTATIVE, CANCELLED, VOIDED and NO_SHOW rows are excluded"
    constants: {}
    precision: "integer counts"

  - name: plan_coverage_and_posture
    trigger: "on every Post.status change (bubble up), on plan PUBLISH / ACTIVATE / RECALL, and on every PostAssignment roster transition"
    algorithm: threshold
    formula: |
      required_total_staff = sum of p.required_guard_count over { Post p : p.staffing_plan_id == plan.id
                                                                          AND p.status != CLOSED }
      filled_total_staff   = sum of p.filled_guard_count   over the same Post set
      understaffed_post_count = count of that Post set with p.status == UNDERSTAFFED
      coverage_ratio = (required_total_staff == 0) ? 0.00
                       : round(filled_total_staff / required_total_staff, 2)
      supervisor_coverage_ok = (count of PostAssignment a where a.post.staffing_plan_id == plan.id
                                AND a.post.post_type == SUPERVISOR
                                AND a.assignment_status IN {CONFIRMED, COMPLETED}
                                AND a.duty_status != NO_SHOW)
                               >= risk_assessment.required_supervisors
      # First-match ladder, pinned:
      #   1. coverage_ratio >= COVERAGE_READY_MIN AND supervisor_coverage_ok
      #      AND understaffed_post_count == 0                                  -> READY
      #   2. coverage_ratio >= COVERAGE_AT_RISK_MIN                            -> AT_RISK
      #   3. otherwise                                                         -> BLOCKED
      # Boundary: coverage_ratio of exactly 0.90 is AT_RISK, 0.89 is BLOCKED; exactly 1.00 with a supervisor
      # gap is AT_RISK, not READY.
    input_set: "the plan's non-CLOSED Post rows and their filled_guard_count values, plus risk_assessment.required_supervisors from the plan's risk_assessment_id"
    constants:
      COVERAGE_READY_MIN: 1.00
      COVERAGE_AT_RISK_MIN: 0.90
    precision: "coverage_ratio 2 decimal places round_half_up"

  - name: event_gate_posture
    trigger: "on every SecurityEvent lifecycle transition, on every plan_coverage_and_posture recomputation, on every Incident status/severity change, and on POST /event-security/security-events/{id}/density-readings"
    algorithm: threshold
    formula: |
      # First-match ladder, pinned. Later clauses are only evaluated when every earlier clause is false.
      #   1. open_critical_incident_count > 0                                  -> FROZEN
      #   2. event.ingress_status == HOLD                                      -> FROZEN
      #   3. current plan is null OR current plan.readiness_posture IN {AT_RISK, BLOCKED}
      #                                                                        -> RESTRICTED
      #   4. a DensityReading for this event exists with effective_level == CRITICAL and
      #      observed_at >= (logical clock - DENSITY_LOOKBACK_MIN minutes)      -> RESTRICTED
      #   5. otherwise                                                         -> OPEN
      # open_critical_incident_count = count of Incident on this event with severity == CRITICAL and
      #                                status NOT IN {RESOLVED, CLOSED_UNFOUNDED}
      # "current plan" = the StaffingPlan for this event with is_current == true; before the first plan exists
      # clause 3 fires, so a PLANNING event reads RESTRICTED only once clause 3 is reachable — during PLANNING
      # and RISK_ASSESSED the posture is forced to OPEN because no plan gating applies yet (see note).
    input_set: "the event's Incident rows, ingress_status, the current StaffingPlan's readiness_posture, and the event's DensityReading rows inside the lookback window"
    constants:
      DENSITY_LOOKBACK_MIN: 15
    precision: "enum"
    variants:
      - name: pre_plan
        when: "event.status IN {PLANNING, RISK_ASSESSED} (no StaffingPlan has been ACTIVATED yet)"
        difference: "clause 3 (plan gating) is skipped because no plan is in force yet, so the posture is OPEN unless clause 1, clause 2 or clause 4 fires; this keeps planning-time writes reachable while a CRITICAL density reading still restricts the gate"
      - name: live
        when: "event.status IN {STAFFED, BRIEFED, DOORS_OPEN, IN_PROGRESS, SUSPENDED, CLOSED, DEBRIEFED}"
        difference: "the full five-clause ladder applies, so a plan that drops out of READY immediately RESTRICTS the event"

  - name: crowd_density_classification
    trigger: "on POST /event-security/security-events/{id}/density-readings"
    algorithm: decay_function
    formula: |
      density_persons_per_sqm = round(observed_occupancy / zone.floor_area_sqm, 3)
      occupancy_ratio         = round(observed_occupancy / zone.max_safe_occupancy, 3)
      WINDOW = the latest ROLLING_WINDOW_SIZE DensityReading rows for the same (event_id, zone_id),
               INCLUDING the row being created, ordered by observed_at ASC with tie-break created_at ASC,
               taking the last ROLLING_WINDOW_SIZE elements of that ordering
      rolling_mean_persons_per_sqm = round(mean of density_persons_per_sqm over WINDOW, 3)
      classify(v) = v >= LEVEL_CRITICAL_MIN ? CRITICAL
                  : v >= LEVEL_RED_MIN      ? RED
                  : v >= LEVEL_AMBER_MIN    ? AMBER
                  : GREEN
      instantaneous_level = classify(density_persons_per_sqm)
      rolling_level       = classify(rolling_mean_persons_per_sqm)
      effective_level     = (count of DensityReading rows for this (event_id, zone_id), including this one)
                            >= ROLLING_WINDOW_SIZE ? rolling_level : instantaneous_level
      # Thresholds are inclusive-at-the-bottom (>=): exactly 4.000 persons/sqm is CRITICAL, 3.999 is RED.
    input_set: "DensityReading rows for the same (event_id, zone_id) only; readings for other zones or other events never enter the window"
    constants:
      ROLLING_WINDOW_SIZE: 3
      LEVEL_AMBER_MIN: 2.000
      LEVEL_RED_MIN: 3.200
      LEVEL_CRITICAL_MIN: 4.000
    precision: "3 decimal places, round_half_up; the rolling mean is rounded once, after averaging, before classification"
    variants:
      - name: instantaneous
        when: "fewer than ROLLING_WINDOW_SIZE readings exist for the (event_id, zone_id) pair"
        difference: "effective_level := instantaneous_level, so a single spike immediately drives the event posture"
      - name: rolling
        when: "ROLLING_WINDOW_SIZE or more readings exist for the (event_id, zone_id) pair"
        difference: "effective_level := rolling_level, so the same spike observation can leave the event OPEN because two calmer prior readings average it down"

  - name: lane_effective_throughput
    trigger: "on POST /event-security/screening-lanes/{id}/status, and whenever a PostAssignment on a Post with a non-null lane_id enters or leaves duty_status ON_POST"
    algorithm: threshold
    formula: |
      assigned_operator_count = count of PostAssignment a where a.post.lane_id == lane.id
                                AND a.assignment_status IN {CONFIRMED, COMPLETED}
                                AND a.duty_status == ON_POST
      if lane.status != OPEN: effective_throughput_pph = 0
      else:
        staffing_factor = min(1, assigned_operator_count / lane.operator_capacity)
        prohibited_item_drag = 1 - PROHIBITED_ITEM_HIT_RATE * SECONDARY_SCREEN_COST_FACTOR
        effective_throughput_pph = floor(lane.nominal_throughput_pph * staffing_factor * prohibited_item_drag)
    input_set: "ON_POST PostAssignment rows on Post rows whose lane_id is this lane; all other duty states excluded"
    constants:
      PROHIBITED_ITEM_HIT_RATE: 0.04
      SECONDARY_SCREEN_COST_FACTOR: 2.5
    precision: "integer via floor(); exact decimal arithmetic"

  - name: incident_response_metrics
    trigger: "on POST /event-security/incidents/{id}/actions with action=TRIAGE"
    algorithm: chronological
    formula: |
      response_minutes = round((triaged_at - reported_at) total_seconds / 60, 2)
      sla_breached     = response_minutes > SLA_MINUTES_BY_SEVERITY[severity_at_report]
      # The SLA clock is keyed on severity_at_report, NOT on the possibly-escalated current severity: escalating
      # a MINOR incident to CRITICAL after a slow triage does not retroactively create (or clear) a breach.
      # Boundary: response_minutes exactly equal to the SLA budget is NOT a breach (strict >).
    input_set: "this incident's reported_at, triaged_at and severity_at_report only"
    constants:
      SLA_MINUTES_BY_SEVERITY: { MINOR: 15, MODERATE: 10, SEVERE: 5, CRITICAL: 3 }
    precision: "2 decimal places, round_half_up"

  - name: after_action_metrics
    trigger: "on POST /event-security/after-action-reviews/{id}/decision with action=SUBMIT and again with action=FINALIZE"
    algorithm: aggregation
    formula: |
      INCIDENTS = { Incident i : i.event_id == event.id AND i.status != CLOSED_UNFOUNDED }
      total_incident_count = count of INCIDENTS
      sla_breach_count     = count of { i in INCIDENTS : i.sla_breached == true }
      READINGS = { DensityReading d : d.event_id == event.id }
      peak_density_level = (READINGS is empty) ? GREEN
                           : max over READINGS of d.effective_level by the ordinal GREEN<AMBER<RED<CRITICAL
      PLAN = the StaffingPlan for this event with is_current == true
      ROSTER = { PostAssignment a : a.post.staffing_plan_id == PLAN.id
                                    AND a.assignment_status IN {CONFIRMED, COMPLETED} }
      no_show_rate = (count of ROSTER == 0) ? 0.0000
                     : round(count of { a in ROSTER : a.duty_status == NO_SHOW } / count of ROSTER, 4)
      coverage_shortfall_minutes =
          round(sum over { Post p : p.staffing_plan_id == PLAN.id } of
                max(0, p.required_guard_count
                       - count of { a in ROSTER : a.post_id == p.id AND a.duty_status IN {ON_POST, RELIEVED} })
                * ((p.window_end - p.window_start) total_seconds / 60), 2)
      # Posts are traversed in Post.created_at ASC order; the sum is order-independent but the order is pinned
      # so the rounding of the single final result is reproducible.
    input_set: "Incident rows excluding CLOSED_UNFOUNDED; every DensityReading for the event; PostAssignment rows on the CURRENT plan with assignment_status IN {CONFIRMED, COMPLETED} (TENTATIVE, CANCELLED and VOIDED rows are excluded from both the no-show denominator and the shortfall numerator)"
    constants: {}
    precision: "no_show_rate 4 decimal places round_half_up; coverage_shortfall_minutes 2 decimal places round_half_up"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared on the target endpoint in 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "on multi-action endpoints the body `action` value is one the acting role may perform (see roles[].exclusive_operations)"
    error_id: ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    http_status: 403
    applies_to: "POST /event-security/risk-assessments/{id}/decision, POST /event-security/staffing-plans/{id}/lifecycle, POST /event-security/post-assignments/{id}/duty-events, POST /event-security/guards/{id}/credential-verification, POST /event-security/after-action-reviews/{id}/decision"

  - priority: 4
    category: auth
    check: "a PostSupervisor acting on a PostAssignment must either be that assignment's guard (X-User-ID == assignment.guard_id) or hold a CONFIRMED assignment on a SUPERVISOR post of the same staffing plan"
    error_id: ERR_NOT_POST_SUPERVISOR
    http_status: 403
    applies_to: "POST /event-security/post-assignments/{id}/duty-events"

  - priority: 5
    category: business_constraint
    check: "body schema: required fields present, enum members valid, integers/numbers within declared ranges, window_end > window_start, event_start_at > doors_open_at, event_end_at > event_start_at, SUBCONTRACTED guards carry subcontractor_id and EMPLOYEE guards do not"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "path resources exist, validated left-to-right (venue, then zone; event, then its sub-resource)"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_EVENT_NOT_FOUND | ERR_RISK_ASSESSMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_POST_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_GUARD_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_LANE_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_READING_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 7
    category: existence
    check: "body foreign keys resolve: zone_id, guard_id, post_id, risk_assessment_id, subcontractor_id, lane_id, reports_to_post_id"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_GUARD_NOT_FOUND | ERR_POST_NOT_FOUND | ERR_RISK_ASSESSMENT_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_LANE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /event-security/security-events, POST /event-security/security-events/{id}/staffing-plans, POST /event-security/staffing-plans/{id}/posts, POST /event-security/post-assignments, POST /event-security/security-events/{id}/screening-lanes, POST /event-security/security-events/{id}/density-readings, POST /event-security/security-events/{id}/incidents, POST /event-security/guards"

  - priority: 8
    category: business_referential
    check: "referenced zone belongs to the event's venue; referenced lane belongs to the same event; reports_to_post_id names a SUPERVISOR post in the same staffing plan; risk_assessment_id belongs to the event in the path"
    error_id: ERR_ZONE_VENUE_MISMATCH
    http_status: 422
    applies_to: "POST /event-security/staffing-plans/{id}/posts, POST /event-security/security-events/{id}/screening-lanes, POST /event-security/security-events/{id}/density-readings, POST /event-security/security-events/{id}/incidents, POST /event-security/security-events/{id}/staffing-plans"

  - priority: 9
    category: state
    check: "the OCC field expected_event_version / expected_post_version equals the parent's current version"
    error_id: "ERR_STALE_EVENT_VERSION | ERR_STALE_POST_VERSION"
    http_status: 412
    applies_to: "PATCH /event-security/security-events/{id}, POST /event-security/security-events/{id}/staffing-plans, PATCH /event-security/posts/{id}"

  - priority: 10
    category: state
    check: "the owning StaffingPlan.status is not LOCKED for any Post or PostAssignment roster mutation"
    error_id: ERR_PLAN_LOCKED
    http_status: 409
    applies_to: "POST /event-security/staffing-plans/{id}/posts, PATCH /event-security/posts/{id}, POST /event-security/post-assignments, POST /event-security/post-assignments/{id}/duty-events (actions CONFIRM, CANCEL)"

  - priority: 11
    category: state
    check: "the owning StaffingPlan.is_current is true"
    error_id: ERR_PLAN_NOT_CURRENT
    http_status: 409
    applies_to: "POST /event-security/staffing-plans/{id}/posts, PATCH /event-security/posts/{id}, POST /event-security/post-assignments, POST /event-security/post-assignments/{id}/duty-events, POST /event-security/staffing-plans/{id}/lifecycle"

  - priority: 12
    category: state
    check: "the target resource's current state has an outgoing transition for the requested trigger/action in 1.2. One carve-out, narrower than this rule and therefore evaluated in its place: POST /event-security/post-assignments/{id}/duty-events action=CHECK_IN against a row whose assignment_status is CONFIRMED but whose duty_status is PENDING_BRIEF returns the more specific ERR_GUARD_NOT_BRIEFED (priority 19), not ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action and lifecycle endpoints"

  - priority: 13
    category: state
    check: "event.gate_posture != FROZEN for any child mutation on the event (posts, assignments, lanes, plan lifecycle, risk assessment SUBMIT)"
    error_id: ERR_EVENT_GATE_FROZEN
    http_status: 409
    applies_to: "POST /event-security/staffing-plans/{id}/posts, PATCH /event-security/posts/{id}, POST /event-security/post-assignments, POST /event-security/post-assignments/{id}/duty-events (actions CONFIRM, CANCEL), POST /event-security/screening-lanes/{id}/status (action OPEN), POST /event-security/staffing-plans/{id}/lifecycle, POST /event-security/risk-assessments/{id}/decision (action SUBMIT)"

  - priority: 14
    category: state
    check: "the plan's RiskAssessment.status == APPROVED before PUBLISH"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /event-security/staffing-plans/{id}/lifecycle (action PUBLISH)"

  - priority: 15
    category: auth
    check: "segregation of duties: X-User-ID performing APPROVE/REJECT differs from RiskAssessment.submitted_by_user_id; X-User-ID performing RETURN/FINALIZE differs from AfterActionReview.authored_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /event-security/risk-assessments/{id}/decision (actions APPROVE, REJECT), POST /event-security/after-action-reviews/{id}/decision (actions RETURN, FINALIZE)"

  - priority: 16
    category: business_safety
    check: "guard.verification_status == VERIFIED and guard.credential_expires_on > assignment.window_end"
    error_id: ERR_GUARD_CREDENTIAL_INVALID
    http_status: 422
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM), POST /event-security/guards/{id}/credential-verification (action VERIFY)"

  - priority: 17
    category: business_safety
    check: "guard.credential_level >= post.min_credential_level"
    error_id: ERR_CREDENTIAL_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM)"

  - priority: 18
    category: business_safety
    check: "a SUPERVISOR post requires guard.credential_level >= SUPERVISOR_MIN_CREDENTIAL_LEVEL (3)"
    error_id: ERR_SUPERVISOR_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM)"

  - priority: 19
    category: business_safety
    check: "CHECK_IN requires duty_status == BRIEFED (event-specific training and radio channel already acknowledged)"
    error_id: ERR_GUARD_NOT_BRIEFED
    http_status: 409
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CHECK_IN)"

  - priority: 20
    category: business_referential
    check: "for a SUBCONTRACTED guard, subcontractor.status == APPROVED and subcontractor.insurance_expires_on > assignment.window_end"
    error_id: ERR_SUBCONTRACTOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM), POST /event-security/guards/{id}/credential-verification (action VERIFY), POST /event-security/subcontractors/{id}/decision (action APPROVE)"

  - priority: 21
    category: business_constraint
    check: "span of control: the sum of required_guard_count over the Post rows reporting to a SUPERVISOR post must not exceed SPAN_OF_CONTROL (10)"
    error_id: ERR_SPAN_OF_CONTROL_EXCEEDED
    http_status: 422
    applies_to: "POST /event-security/staffing-plans/{id}/posts, PATCH /event-security/posts/{id}"

  - priority: 22
    category: business_temporal
    check: "assignment.window_start >= post.window_start and assignment.window_end <= post.window_end"
    error_id: ERR_ASSIGNMENT_WINDOW_OUTSIDE_POST
    http_status: 422
    applies_to: "POST /event-security/post-assignments"

  - priority: 23
    category: business_temporal
    check: "guard double-booking, checked at CONFIRMATION time only (overlapping TENTATIVE pencil-ins are permitted at creation), HALF-OPEN interval semantics [window_start, window_end): reject when another PostAssignment for the same guard_id with assignment_status IN {TENTATIVE, CONFIRMED} satisfies other.window_start < this.window_end AND this.window_start < other.window_end. Back-to-back shifts that merely touch (other.window_end == this.window_start) are ACCEPTED."
    error_id: ERR_GUARD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM)"

  - priority: 24
    category: business_temporal
    check: "zone post-slot capacity, CLOSED interval semantics with AGGREGATE capacity: for every candidate instant t in the union of window_start / window_end endpoints of the new post and of the zone's existing non-CLOSED posts on non-SUPERSEDED plans, the sum of required_guard_count over posts whose CLOSED window [window_start, window_end] contains t, including the new post, must be <= zone.post_slot_capacity. Windows that merely touch DO overlap under these semantics."
    error_id: ERR_ZONE_POST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /event-security/staffing-plans/{id}/posts, PATCH /event-security/posts/{id}"

  - priority: 25
    category: business_constraint
    check: "count of PostAssignment on the post with assignment_status IN {CONFIRMED, COMPLETED} and duty_status != NO_SHOW must be < post.required_guard_count"
    error_id: ERR_POST_FULLY_STAFFED
    http_status: 409
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM)"

  - priority: 26
    category: business_constraint
    check: "license_number is globally unique across Guard.license_number and Subcontractor.license_number"
    error_id: ERR_DUPLICATE_LICENSE_NUMBER
    http_status: 409
    applies_to: "POST /event-security/guards, POST /event-security/subcontractors"

  - priority: 27
    category: business_constraint
    check: "PUBLISH and ACTIVATE require at least one Post on the plan with status != CLOSED (empty-collection boundary)"
    error_id: ERR_PLAN_HAS_NO_POSTS
    http_status: 422
    applies_to: "POST /event-security/staffing-plans/{id}/lifecycle (actions PUBLISH, ACTIVATE)"

  - priority: 28
    category: business_constraint
    check: "PUBLISH requires plan.required_total_staff >= risk_assessment.required_total_staff"
    error_id: ERR_STAFFING_BELOW_ASSESSED_REQUIREMENT
    http_status: 422
    applies_to: "POST /event-security/staffing-plans/{id}/lifecycle (action PUBLISH)"

  - priority: 29
    category: business_safety
    check: "DOORS_OPEN requires every EMERGENCY_EXIT post on the current plan to have at least required_guard_count assignments with duty_status == ON_POST"
    error_id: ERR_EXIT_POSTS_UNSTAFFED
    http_status: 409
    applies_to: "POST /event-security/security-events/{id}/lifecycle (action DOORS_OPEN)"

  - priority: 30
    category: business_constraint
    check: "DOORS_OPEN requires count of ScreeningLane rows for the event with status == OPEN >= risk_assessment.required_screening_lanes"
    error_id: ERR_SCREENING_CAPACITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /event-security/security-events/{id}/lifecycle (action DOORS_OPEN)"

  - priority: 31
    category: business_constraint
    check: "opening a lane requires lane.assigned_operator_count >= 1"
    error_id: ERR_LANE_UNSTAFFED
    http_status: 409
    applies_to: "POST /event-security/screening-lanes/{id}/status (action OPEN)"

  - priority: 32
    category: business_constraint
    check: "ESCALATE requires the requested severity ordinal to be strictly greater than the current severity ordinal"
    error_id: ERR_SEVERITY_NOT_ESCALATING
    http_status: 422
    applies_to: "POST /event-security/incidents/{id}/actions (action ESCALATE)"

  - priority: 33
    category: business_referential
    check: "EJECT and LE_HANDOFF require at least one PostAssignment on the event's current plan with post.post_type == SUPERVISOR, assignment_status == CONFIRMED and duty_status == ON_POST"
    error_id: ERR_NO_SUPERVISOR_ON_DUTY
    http_status: 409
    applies_to: "POST /event-security/incidents/{id}/actions (actions EJECT, LE_HANDOFF)"

  - priority: 34
    category: business_temporal
    check: "density reading observed_at must lie within [event.doors_open_at - READING_WINDOW_MIN (120) minutes, event.event_end_at + READING_WINDOW_MIN minutes]"
    error_id: ERR_READING_TIMESTAMP_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /event-security/security-events/{id}/density-readings"

  - priority: 35
    category: business_temporal
    check: "DOORS_OPEN requires logical clock >= event.doors_open_at - DOORS_OPEN_LEAD_MIN (60) minutes"
    error_id: ERR_DOORS_OPEN_TOO_EARLY
    http_status: 409
    applies_to: "POST /event-security/security-events/{id}/lifecycle (action DOORS_OPEN)"

  - priority: 36
    category: business_constraint
    check: "at most one AfterActionReview per event with status != FINALIZED"
    error_id: ERR_REVIEW_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /event-security/security-events/{id}/after-action-reviews"

  - priority: 37
    category: business_fiscal
    check: "PUBLISH requires plan.budget_cents >= risk_assessment.minimum_staffing_cost_floor_cents"
    error_id: ERR_PLAN_BUDGET_BELOW_FLOOR
    http_status: 402
    applies_to: "POST /event-security/staffing-plans/{id}/lifecycle (action PUBLISH)"

  - priority: 38
    category: business_fiscal
    check: "CONFIRM requires assignment.line_cost_cents <= plan.budget_remaining_cents"
    error_id: ERR_PLAN_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /event-security/post-assignments/{id}/duty-events (action CONFIRM)"

  - priority: 39
    category: state
    check: "BRIEF requires the event's current StaffingPlan.readiness_posture == READY"
    error_id: ERR_PLAN_NOT_READY
    http_status: 409
    applies_to: "POST /event-security/security-events/{id}/lifecycle (action BRIEF)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Venue / VenueZone ----------
  - method: POST
    path: "/event-security/venues"
    description: "register a venue"
    roles: [SecurityDirector]
    code: 201
    input: [name, gross_capacity, door_count, egress_capacity_per_minute, perimeter_length_m, "alcohol_licensed?", "prior_incident_rate?"]
    output: Venue
    side_effects: []

  - method: GET
    path: "/event-security/venues/{id}"
    description: "read one venue"
    roles: [SecurityDirector, RiskAnalyst, StaffingCoordinator, CredentialAuditor, IncidentCommander, PostSupervisor, SubcontractorLiaison, SystemOperator]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/event-security/venues/{id}/zones"
    description: "declare a layout zone inside a venue"
    roles: [SecurityDirector, RiskAnalyst]
    code: 201
    input: [zone_code, zone_type, floor_area_sqm, posted_capacity, exit_units, post_slot_capacity, "is_ingress_zone?"]
    output: VenueZone
    side_effects: ["computes VenueZone.max_safe_occupancy per calculations.zone_max_safe_occupancy"]

  - method: GET
    path: "/event-security/venues/{id}/zones"
    description: "list the zones of a venue (FK reverse-reachability for VenueZone.venue_id)"
    roles: [SecurityDirector, RiskAnalyst, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: ["zone_type?", "limit?", "offset?"]
    output: VenueZone[]
    side_effects: []

  # ---------- SecurityEvent ----------
  - method: POST
    path: "/event-security/security-events"
    description: "create an event to be secured"
    roles: [SecurityDirector]
    code: 201
    input: [venue_id, event_name, event_type, doors_open_at, event_start_at, event_end_at, expected_attendance, "ticketed_attendance?", "alcohol_served?", "vip_present?"]
    output: SecurityEvent
    side_effects: ["initial status PLANNING; gate_posture computed per calculations.event_gate_posture (pre_plan variant)"]

  - method: GET
    path: "/event-security/security-events/{id}"
    description: "read one event, including status, ingress_status, gate_posture and version"
    roles: [SecurityDirector, RiskAnalyst, StaffingCoordinator, CredentialAuditor, IncidentCommander, PostSupervisor, SystemOperator]
    code: 200
    input: []
    output: SecurityEvent
    side_effects: []

  - method: GET
    path: "/event-security/security-events"
    description: "list events (FK reverse-reachability for SecurityEvent.venue_id)"
    roles: [SecurityDirector, RiskAnalyst, StaffingCoordinator, IncidentCommander]
    code: 200
    input: ["venue_id?", "status?", "gate_posture?", "limit?", "offset?"]
    output: SecurityEvent[]
    side_effects: []

  - method: PATCH
    path: "/event-security/security-events/{id}"
    description: "update the event attendance/flag profile under optimistic concurrency control"
    roles: [SecurityDirector]
    code: 200
    input: [expected_event_version, "ticketed_attendance?", "alcohol_served?", "vip_present?"]
    output: SecurityEvent
    side_effects: ["increments SecurityEvent.version by 1", "recompute gate_posture"]

  - method: POST
    path: "/event-security/security-events/{id}/lifecycle"
    description: "drive the event lifecycle: BRIEF, DOORS_OPEN, START, SUSPEND, RESUME, CLOSE"
    roles: [SecurityDirector]
    code: 200
    input: [action, "note?"]
    output: SecurityEvent
    side_effects: ["per the SecurityEvent state machine in 1.2, including the CLOSE cascade over assignments, lanes, posts and the plan", "increments SecurityEvent.version by 1"]

  # ---------- RiskAssessment ----------
  - method: POST
    path: "/event-security/security-events/{id}/risk-assessments"
    description: "author a venue risk assessment revision for the event"
    roles: [RiskAnalyst, SecurityDirector]
    code: 201
    input: [threat_level_input, protest_likelihood, crowd_profile, ingress_door_count, layout_complexity_score, history_incident_rate]
    output: RiskAssessment
    side_effects: ["initial status DRAFT; no scores computed until SUBMIT"]

  - method: GET
    path: "/event-security/security-events/{id}/risk-assessments"
    description: "list the assessment revisions of an event (FK reverse-reachability for RiskAssessment.event_id)"
    roles: [SecurityDirector, RiskAnalyst, StaffingCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RiskAssessment[]
    side_effects: []

  - method: GET
    path: "/event-security/risk-assessments/{id}"
    description: "read one assessment, including every computed staffing requirement"
    roles: [SecurityDirector, RiskAnalyst, StaffingCoordinator]
    code: 200
    input: []
    output: RiskAssessment
    side_effects: []

  - method: POST
    path: "/event-security/risk-assessments/{id}/decision"
    description: "SUBMIT (analyst), APPROVE / REJECT (director, segregation of duties), REVISE (analyst) an assessment"
    roles: [RiskAnalyst, SecurityDirector]
    code: 200
    input: [action, "rejection_reason?"]
    output: RiskAssessment
    side_effects: ["per the RiskAssessment state machine in 1.2", "on SUBMIT and APPROVE: recompute composite_threat_score, risk_tier, all required_* fields and minimum_staffing_cost_floor_cents", "on APPROVE: cascade SecurityEvent PLANNING -> RISK_ASSESSED and supersede any previously APPROVED assessment"]

  # ---------- StaffingPlan ----------
  - method: POST
    path: "/event-security/security-events/{id}/staffing-plans"
    description: "create a staffing plan revision for the event under optimistic concurrency control; the prior current plan is superseded"
    roles: [StaffingCoordinator]
    code: 201
    input: [risk_assessment_id, budget_cents, expected_event_version]
    output: StaffingPlan
    side_effects: ["increments SecurityEvent.version by 1", "any existing StaffingPlan for the event with status IN {DRAFT, PUBLISHED} transitions to SUPERSEDED with its cancel/close cascade", "new plan supersedes_plan_id := the superseded plan's id"]

  - method: GET
    path: "/event-security/staffing-plans/{id}"
    description: "read one staffing plan, including the coverage and ledger fields"
    roles: [SecurityDirector, StaffingCoordinator, RiskAnalyst, IncidentCommander]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: []

  - method: GET
    path: "/event-security/staffing-plans"
    description: "list staffing plans (FK reverse-reachability for StaffingPlan.event_id, .risk_assessment_id and the self-referential .supersedes_plan_id)"
    roles: [SecurityDirector, StaffingCoordinator, RiskAnalyst, IncidentCommander]
    code: 200
    input: ["event_id?", "risk_assessment_id?", "supersedes_plan_id?", "status?", "is_current?", "limit?", "offset?"]
    output: StaffingPlan[]
    side_effects: []

  - method: POST
    path: "/event-security/staffing-plans/{id}/lifecycle"
    description: "PUBLISH / RECALL (coordinator), ACTIVATE / LOCK (director), CLOSE (system-equivalent director action)"
    roles: [StaffingCoordinator, SecurityDirector]
    code: 200
    input: [action]
    output: StaffingPlan
    side_effects: ["per the StaffingPlan state machine in 1.2", "on PUBLISH: pin pinned_risk_assessment_version and recompute plan_coverage_and_posture", "on ACTIVATE: recompute every Post.status, recompute plan_coverage_and_posture, cascade SecurityEvent RISK_ASSESSED -> STAFFED"]

  - method: GET
    path: "/event-security/staffing-plans/{id}/coverage-summary"
    description: "computed read of the plan's coverage, posture and ledger figures"
    roles: [SecurityDirector, StaffingCoordinator, RiskAnalyst]
    code: 200
    input: []
    output: { required_total_staff: integer, filled_total_staff: integer, coverage_ratio: number, understaffed_post_count: integer, readiness_posture: string, committed_cost_cents: integer, budget_remaining_cents: integer, committed_guard_hours: number, supervisor_coverage_ok: boolean }
    side_effects: []

  # ---------- Post ----------
  - method: POST
    path: "/event-security/staffing-plans/{id}/posts"
    description: "declare a post (perimeter, ingress screening, floor, emergency exit or supervisor) on the plan"
    roles: [StaffingCoordinator]
    code: 201
    input: [zone_id, post_code, post_type, required_guard_count, min_credential_level, window_start, window_end, "reports_to_post_id?", "lane_id?"]
    output: Post
    side_effects: ["recompute plan.required_total_staff, coverage_ratio, readiness_posture", "zone post-slot aggregate capacity validated per validations priority 24"]

  - method: GET
    path: "/event-security/posts/{id}"
    description: "read one post, including filled_guard_count, status and version"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: []
    output: Post
    side_effects: []

  - method: GET
    path: "/event-security/posts"
    description: "list posts (FK reverse-reachability for Post.staffing_plan_id, .zone_id, the self-referential .reports_to_post_id and .lane_id)"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: ["staffing_plan_id?", "zone_id?", "reports_to_post_id?", "lane_id?", "post_type?", "status?", "limit?", "offset?"]
    output: Post[]
    side_effects: []

  - method: PATCH
    path: "/event-security/posts/{id}"
    description: "re-profile a post under optimistic concurrency control"
    roles: [StaffingCoordinator]
    code: 200
    input: [expected_post_version, "required_guard_count?", "min_credential_level?", "window_start?", "window_end?"]
    output: Post
    side_effects: ["increments Post.version by 1", "recompute Post.status per calculations.post_fill_and_status", "recompute plan.required_total_staff, coverage_ratio, understaffed_post_count, readiness_posture; then recompute event.gate_posture"]

  # ---------- Subcontractor ----------
  - method: POST
    path: "/event-security/subcontractors"
    description: "register a subcontracted labour vendor"
    roles: [StaffingCoordinator, CredentialAuditor]
    code: 201
    input: [company_name, license_number, insurance_expires_on, markup_pct]
    output: Subcontractor
    side_effects: ["initial status PENDING"]

  - method: GET
    path: "/event-security/subcontractors/{id}"
    description: "read one vendor"
    roles: [SecurityDirector, StaffingCoordinator, CredentialAuditor, SubcontractorLiaison]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  - method: POST
    path: "/event-security/subcontractors/{id}/decision"
    description: "APPROVE / SUSPEND / TERMINATE a vendor; SUSPEND and TERMINATE cascade to the vendor's guards and their assignments"
    roles: [CredentialAuditor]
    code: 200
    input: [action]
    output: Subcontractor
    side_effects: ["per the Subcontractor state machine in 1.2, including the four-hop SUSPEND cascade"]

  # ---------- Guard ----------
  - method: POST
    path: "/event-security/guards"
    description: "source a guard, either an employee or a subcontracted worker"
    roles: [StaffingCoordinator, SubcontractorLiaison]
    code: 201
    input: [full_name, employment_type, credential_level, license_number, credential_expires_on, base_hourly_rate_cents, "subcontractor_id?"]
    output: Guard
    side_effects: ["initial verification_status UNVERIFIED; is_supervisor_qualified computed"]

  - method: GET
    path: "/event-security/guards/{id}"
    description: "read one guard"
    roles: [SecurityDirector, StaffingCoordinator, CredentialAuditor, IncidentCommander, PostSupervisor, SubcontractorLiaison]
    code: 200
    input: []
    output: Guard
    side_effects: []

  - method: GET
    path: "/event-security/guards"
    description: "list guards (FK reverse-reachability for Guard.subcontractor_id)"
    roles: [SecurityDirector, StaffingCoordinator, CredentialAuditor, SubcontractorLiaison]
    code: 200
    input: ["subcontractor_id?", "verification_status?", "employment_type?", "limit?", "offset?"]
    output: Guard[]
    side_effects: []

  - method: POST
    path: "/event-security/guards/{id}/credential-verification"
    description: "SUBMIT_FOR_REVIEW (coordinator or vendor liaison), VERIFY / REJECT / DISQUALIFY (credential auditor)"
    roles: [StaffingCoordinator, CredentialAuditor, SubcontractorLiaison]
    code: 200
    input: [action, "credential_expires_on?", "credential_level?"]
    output: Guard
    side_effects: ["per the Guard state machine in 1.2, including the four-hop REJECT void cascade"]

  # ---------- PostAssignment ----------
  - method: POST
    path: "/event-security/post-assignments"
    description: "assign a guard to a post for a shift window; the row starts TENTATIVE / PENDING_BRIEF"
    roles: [StaffingCoordinator]
    code: 201
    input: [post_id, guard_id, window_start, window_end]
    output: PostAssignment
    side_effects: ["computes scheduled_hours, night_differential_applies, pay_basis and line_cost_cents per calculations.assignment_cost (scheduled variant)", "no ledger movement until CONFIRM"]

  - method: GET
    path: "/event-security/post-assignments/{id}"
    description: "read one assignment, including both state dimensions and its cost fields"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: []
    output: PostAssignment
    side_effects: []

  - method: GET
    path: "/event-security/post-assignments"
    description: "list assignments (FK reverse-reachability for PostAssignment.post_id and .guard_id)"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: ["post_id?", "guard_id?", "assignment_status?", "duty_status?", "limit?", "offset?"]
    output: PostAssignment[]
    side_effects: []

  - method: POST
    path: "/event-security/post-assignments/{id}/duty-events"
    description: "CONFIRM / CANCEL (coordinator) and BRIEF / CHECK_IN / MARK_NO_SHOW / RELIEVE (post supervisor)"
    roles: [StaffingCoordinator, PostSupervisor]
    code: 200
    input: [action, "radio_channel?", "training_module_code?", "cancellation_reason?"]
    output: PostAssignment
    side_effects: ["per both dimensions of the PostAssignment state machine in 1.2", "CONFIRM / CANCEL / MARK_NO_SHOW run the Post -> StaffingPlan -> SecurityEvent cascade and the plan cost/hours ledger sync", "RELIEVE computes billed_hours / billed_cost_cents and completes the roster dimension"]

  # ---------- ScreeningLane ----------
  - method: POST
    path: "/event-security/security-events/{id}/screening-lanes"
    description: "plan a screening lane (walkthrough mag, wand, bag check or express) in an ingress zone"
    roles: [StaffingCoordinator]
    code: 201
    input: [zone_id, lane_type, nominal_throughput_pph, operator_capacity, open_from, open_to]
    output: ScreeningLane
    side_effects: ["initial status PLANNED; effective_throughput_pph 0"]

  - method: GET
    path: "/event-security/screening-lanes/{id}"
    description: "read one lane"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: []
    output: ScreeningLane
    side_effects: []

  - method: GET
    path: "/event-security/screening-lanes"
    description: "list lanes (FK reverse-reachability for ScreeningLane.event_id and .zone_id)"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: ["event_id?", "zone_id?", "status?", "lane_type?", "limit?", "offset?"]
    output: ScreeningLane[]
    side_effects: []

  - method: POST
    path: "/event-security/screening-lanes/{id}/status"
    description: "OPEN / HOLD / CLOSE a lane for queue management and surge mitigation"
    roles: [StaffingCoordinator, SecurityDirector]
    code: 200
    input: [action]
    output: ScreeningLane
    side_effects: ["per the ScreeningLane state machine in 1.2", "recompute effective_throughput_pph per calculations.lane_effective_throughput"]

  # ---------- DensityReading ----------
  - method: POST
    path: "/event-security/security-events/{id}/density-readings"
    description: "record a crowd density observation for a zone"
    roles: [PostSupervisor, IncidentCommander, SecurityDirector]
    code: 201
    input: [zone_id, observed_at, observed_occupancy]
    output: DensityReading
    side_effects: ["computes density_persons_per_sqm, occupancy_ratio, rolling_mean_persons_per_sqm, instantaneous_level, rolling_level and effective_level per calculations.crowd_density_classification", "recompute event.gate_posture"]

  - method: GET
    path: "/event-security/density-readings/{id}"
    description: "read one density reading"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: []
    output: DensityReading
    side_effects: []

  - method: GET
    path: "/event-security/density-readings"
    description: "list density readings (FK reverse-reachability for DensityReading.event_id and .zone_id)"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: ["event_id?", "zone_id?", "effective_level?", "limit?", "offset?"]
    output: DensityReading[]
    side_effects: []

  # ---------- Incident ----------
  - method: POST
    path: "/event-security/security-events/{id}/incidents"
    description: "report an incident (medical, ejection, law enforcement, crowd surge, prohibited item)"
    roles: [PostSupervisor, IncidentCommander, SecurityDirector]
    code: 201
    input: [zone_id, category, severity, description]
    output: Incident
    side_effects: ["initial status REPORTED; reported_at := logical clock; severity_at_report := severity", "recompute event.open_critical_incident_count and event.gate_posture"]

  - method: GET
    path: "/event-security/incidents/{id}"
    description: "read one incident, including response_minutes and sla_breached"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/event-security/incidents"
    description: "list incidents (FK reverse-reachability for Incident.event_id and .zone_id)"
    roles: [SecurityDirector, StaffingCoordinator, IncidentCommander, PostSupervisor]
    code: 200
    input: ["event_id?", "zone_id?", "status?", "category?", "severity?", "sla_breached?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/event-security/incidents/{id}/actions"
    description: "TRIAGE, ESCALATE, MEDICAL_HANDOFF, EJECT, LE_HANDOFF, RESOLVE, CLOSE_UNFOUNDED"
    roles: [IncidentCommander, SecurityDirector]
    code: 200
    input: [action, "severity?", "handoff_agency_ref?", "ejection_patron_ref?", "resolution_note?"]
    output: Incident
    side_effects: ["per the Incident branching state machine in 1.2", "TRIAGE computes response_minutes and sla_breached", "LE_HANDOFF at CRITICAL severity runs the ingress HOLD -> lane HOLD -> gate FROZEN cascade", "RESOLVE from LE_HANDOFF runs the compensating release when no CRITICAL incident remains open"]

  # ---------- AfterActionReview ----------
  - method: POST
    path: "/event-security/security-events/{id}/after-action-reviews"
    description: "open the post-event after-action review"
    roles: [IncidentCommander, SecurityDirector]
    code: 201
    input: [narrative, corrective_action_count]
    output: AfterActionReview
    side_effects: ["initial status DRAFT; authored_by_user_id := X-User-ID"]

  - method: GET
    path: "/event-security/security-events/{id}/after-action-reviews"
    description: "list the reviews of an event (FK reverse-reachability for AfterActionReview.event_id)"
    roles: [SecurityDirector, IncidentCommander, StaffingCoordinator, RiskAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AfterActionReview[]
    side_effects: []

  - method: POST
    path: "/event-security/after-action-reviews/{id}/decision"
    description: "SUBMIT / REVISE (incident commander) and RETURN / FINALIZE (director, segregation of duties)"
    roles: [IncidentCommander, SecurityDirector]
    code: 200
    input: [action, "return_reason?"]
    output: AfterActionReview
    side_effects: ["per the AfterActionReview state machine in 1.2", "SUBMIT and FINALIZE recompute after_action_metrics", "FINALIZE cascades SecurityEvent CLOSED -> DEBRIEFED"]

  # ---------- test-driving endpoint ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Setting the clock also runs the credential-expiry ops sweep (Guard VERIFIED -> EXPIRED for every guard whose credential_expires_on <= the new value, in Guard.created_at ASC order) with its four-hop void cascade."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_guard_count: integer, voided_assignment_count: integer }
    side_effects: ["logical clock := to_iso8601", "Guard VERIFIED -> EXPIRED sweep and the resulting PostAssignment -> Post -> StaffingPlan -> SecurityEvent cascade"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed on the target endpoint"
  - id: ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    http: 403
    condition: "the requested `action` on a multi-action endpoint is not one the acting role may perform"
  - id: ERR_NOT_POST_SUPERVISOR
    http: 403
    condition: "a PostSupervisor acts on an assignment that is neither their own nor inside a plan where they hold a CONFIRMED supervisor post"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approver/finalizer X-User-ID equals the submitter/author X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, invalid enum member, out-of-range number, or inverted interval"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue id in the path does not exist"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "zone_id in the body does not exist"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "event id in the path does not exist"
  - id: ERR_RISK_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "risk assessment id in the path or risk_assessment_id in the body does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "staffing plan id in the path does not exist"
  - id: ERR_POST_NOT_FOUND
    http: 404
    condition: "post id in the path, or post_id / reports_to_post_id in the body, does not exist"
  - id: ERR_GUARD_NOT_FOUND
    http: 404
    condition: "guard id in the path or guard_id in the body does not exist; also raised when a PostSupervisor X-User-ID is not a Guard id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "post assignment id in the path does not exist"
  - id: ERR_SUBCONTRACTOR_NOT_FOUND
    http: 404
    condition: "subcontractor id in the path or subcontractor_id in the body does not exist"
  - id: ERR_LANE_NOT_FOUND
    http: 404
    condition: "screening lane id in the path or lane_id in the body does not exist"
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "density reading id in the path does not exist"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident id in the path does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "after-action review id in the path does not exist"
  - id: ERR_ZONE_VENUE_MISMATCH
    http: 422
    condition: "referenced zone belongs to a different venue than the event, referenced lane belongs to a different event, reports_to_post_id is not a SUPERVISOR post of the same plan, or risk_assessment_id belongs to a different event"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not equal SecurityEvent.version"
  - id: ERR_STALE_POST_VERSION
    http: 412
    condition: "expected_post_version does not equal Post.version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current state has no outgoing transition for the requested action"
  - id: ERR_PLAN_LOCKED
    http: 409
    condition: "a roster mutation was attempted on a LOCKED staffing plan"
  - id: ERR_PLAN_NOT_CURRENT
    http: 409
    condition: "a mutation was attempted against a SUPERSEDED staffing plan"
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "PUBLISH was attempted while the plan's risk assessment is not APPROVED"
  - id: ERR_EVENT_GATE_FROZEN
    http: 409
    condition: "a child mutation was attempted while event.gate_posture is FROZEN"
  - id: ERR_GUARD_CREDENTIAL_INVALID
    http: 422
    condition: "guard is not VERIFIED, or the guard card expires on or before the shift end / the current clock"
  - id: ERR_CREDENTIAL_LEVEL_INSUFFICIENT
    http: 422
    condition: "guard.credential_level is below post.min_credential_level"
  - id: ERR_SUPERVISOR_NOT_QUALIFIED
    http: 422
    condition: "a guard with credential_level below 3 was confirmed onto a SUPERVISOR post"
  - id: ERR_SUBCONTRACTOR_NOT_ELIGIBLE
    http: 422
    condition: "the vendor is not APPROVED, or its liability insurance expires on or before the relevant instant"
  - id: ERR_GUARD_NOT_BRIEFED
    http: 409
    condition: "CHECK_IN was attempted while duty_status is not BRIEFED"
  - id: ERR_GUARD_WINDOW_CONFLICT
    http: 409
    condition: "at CONFIRM time the guard already holds another TENTATIVE or CONFIRMED assignment that half-open-overlaps this window"
  - id: ERR_ASSIGNMENT_WINDOW_OUTSIDE_POST
    http: 422
    condition: "the assignment window is not fully contained in the post coverage window"
  - id: ERR_ZONE_POST_CAPACITY_EXCEEDED
    http: 409
    condition: "the zone's aggregate guard slots at some instant would exceed post_slot_capacity under closed-interval overlap"
  - id: ERR_SPAN_OF_CONTROL_EXCEEDED
    http: 422
    condition: "a supervisor post would exceed SPAN_OF_CONTROL guard slots across its direct reports"
  - id: ERR_POST_FULLY_STAFFED
    http: 409
    condition: "the post already holds required_guard_count effective assignments"
  - id: ERR_DUPLICATE_LICENSE_NUMBER
    http: 409
    condition: "license_number already used by another Guard or Subcontractor"
  - id: ERR_PLAN_HAS_NO_POSTS
    http: 422
    condition: "PUBLISH or ACTIVATE was attempted on a plan with zero non-CLOSED posts"
  - id: ERR_STAFFING_BELOW_ASSESSED_REQUIREMENT
    http: 422
    condition: "the plan's total required guard slots are below the assessed required_total_staff"
  - id: ERR_EXIT_POSTS_UNSTAFFED
    http: 409
    condition: "DOORS_OPEN was attempted with an emergency-exit post short of ON_POST guards"
  - id: ERR_SCREENING_CAPACITY_INSUFFICIENT
    http: 409
    condition: "DOORS_OPEN was attempted with fewer OPEN lanes than required_screening_lanes"
  - id: ERR_LANE_UNSTAFFED
    http: 409
    condition: "a lane OPEN was attempted with assigned_operator_count == 0"
  - id: ERR_SEVERITY_NOT_ESCALATING
    http: 422
    condition: "ESCALATE requested a severity that is not strictly higher than the current one"
  - id: ERR_NO_SUPERVISOR_ON_DUTY
    http: 409
    condition: "EJECT or LE_HANDOFF was attempted with no ON_POST supervisor on the event"
  - id: ERR_READING_TIMESTAMP_OUT_OF_RANGE
    http: 422
    condition: "density reading observed_at falls outside the event's observation window"
  - id: ERR_DOORS_OPEN_TOO_EARLY
    http: 409
    condition: "DOORS_OPEN was attempted more than DOORS_OPEN_LEAD_MIN minutes before the scheduled doors-open instant"
  - id: ERR_REVIEW_ALREADY_EXISTS
    http: 409
    condition: "a non-FINALIZED after-action review already exists for the event"
  - id: ERR_PLAN_BUDGET_BELOW_FLOOR
    http: 402
    condition: "PUBLISH was attempted with budget_cents below the assessed minimum staffing cost floor"
  - id: ERR_PLAN_BUDGET_EXCEEDED
    http: 402
    condition: "CONFIRM would push committed_cost_cents past budget_cents"
  - id: ERR_PLAN_NOT_READY
    http: 409
    condition: "BRIEF was attempted while the current staffing plan's readiness_posture is not READY"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SecurityDirector
    description: "accountable executive: owns venues, events, the event lifecycle, assessment approval, plan activation and review finalization"
    identity: opaque
    exclusive_operations:
      - "POST /event-security/venues"
      - "POST /event-security/security-events"
      - "PATCH /event-security/security-events/{id}"
      - "POST /event-security/security-events/{id}/lifecycle (all actions)"
      - "POST /event-security/risk-assessments/{id}/decision action=APPROVE"
      - "POST /event-security/risk-assessments/{id}/decision action=REJECT"
      - "POST /event-security/staffing-plans/{id}/lifecycle action=ACTIVATE"
      - "POST /event-security/staffing-plans/{id}/lifecycle action=LOCK"
      - "POST /event-security/staffing-plans/{id}/lifecycle action=CLOSE"
      - "POST /event-security/after-action-reviews/{id}/decision action=RETURN"
      - "POST /event-security/after-action-reviews/{id}/decision action=FINALIZE"
    shared_operations:
      - "POST /event-security/venues/{id}/zones (with RiskAnalyst)"
      - "POST /event-security/security-events/{id}/risk-assessments (with RiskAnalyst)"
      - "POST /event-security/screening-lanes/{id}/status (with StaffingCoordinator)"
      - "POST /event-security/security-events/{id}/density-readings (with PostSupervisor, IncidentCommander)"
      - "POST /event-security/security-events/{id}/incidents (with PostSupervisor, IncidentCommander)"
      - "POST /event-security/incidents/{id}/actions (with IncidentCommander)"
      - "POST /event-security/security-events/{id}/after-action-reviews (with IncidentCommander)"
      - "all GET reads"

  - name: RiskAnalyst
    description: "authors threat, capacity and layout analysis; submits and revises assessments but can never approve one"
    identity: opaque
    exclusive_operations:
      - "POST /event-security/risk-assessments/{id}/decision action=SUBMIT"
      - "POST /event-security/risk-assessments/{id}/decision action=REVISE"
    shared_operations:
      - "POST /event-security/venues/{id}/zones (with SecurityDirector)"
      - "POST /event-security/security-events/{id}/risk-assessments (with SecurityDirector)"
      - "GET reads on venues, zones, events, assessments, plans and reviews"

  - name: StaffingCoordinator
    description: "builds the staffing plan: posts, sourcing across employees and subcontracted labour, assignments, lanes"
    identity: opaque
    exclusive_operations:
      - "POST /event-security/security-events/{id}/staffing-plans"
      - "POST /event-security/staffing-plans/{id}/posts"
      - "PATCH /event-security/posts/{id}"
      - "POST /event-security/staffing-plans/{id}/lifecycle action=PUBLISH"
      - "POST /event-security/staffing-plans/{id}/lifecycle action=RECALL"
      - "POST /event-security/post-assignments"
      - "POST /event-security/post-assignments/{id}/duty-events action=CONFIRM"
      - "POST /event-security/post-assignments/{id}/duty-events action=CANCEL"
      - "POST /event-security/security-events/{id}/screening-lanes"
    shared_operations:
      - "POST /event-security/subcontractors (with CredentialAuditor)"
      - "POST /event-security/guards (with SubcontractorLiaison)"
      - "POST /event-security/guards/{id}/credential-verification action=SUBMIT_FOR_REVIEW (with SubcontractorLiaison)"
      - "POST /event-security/screening-lanes/{id}/status (with SecurityDirector)"
      - "GET reads on venues, zones, events, plans, posts, assignments, guards, vendors, lanes, readings, incidents"

  - name: CredentialAuditor
    description: "independent credential and vendor compliance function; the only role that may verify, reject or disqualify a guard card"
    identity: opaque
    exclusive_operations:
      - "POST /event-security/guards/{id}/credential-verification action=VERIFY"
      - "POST /event-security/guards/{id}/credential-verification action=REJECT"
      - "POST /event-security/guards/{id}/credential-verification action=DISQUALIFY"
      - "POST /event-security/subcontractors/{id}/decision (all actions)"
    shared_operations:
      - "POST /event-security/subcontractors (with StaffingCoordinator)"
      - "GET reads on guards, vendors, venues and events"

  - name: PostSupervisor
    description: "on-the-night supervisor working the event; X-User-ID is the supervising Guard's id"
    identity: "entity_backed:Guard"
    exclusive_operations:
      - "POST /event-security/post-assignments/{id}/duty-events action=BRIEF"
      - "POST /event-security/post-assignments/{id}/duty-events action=CHECK_IN"
      - "POST /event-security/post-assignments/{id}/duty-events action=MARK_NO_SHOW"
      - "POST /event-security/post-assignments/{id}/duty-events action=RELIEVE"
    shared_operations:
      - "POST /event-security/security-events/{id}/density-readings (with IncidentCommander, SecurityDirector)"
      - "POST /event-security/security-events/{id}/incidents (with IncidentCommander, SecurityDirector)"
      - "GET reads on venues, zones, events, posts, assignments, guards, lanes, readings, incidents"

  - name: IncidentCommander
    description: "runs the incident response protocol and authors the after-action review"
    identity: opaque
    exclusive_operations:
      - "POST /event-security/incidents/{id}/actions action=TRIAGE"
      - "POST /event-security/incidents/{id}/actions action=ESCALATE"
      - "POST /event-security/incidents/{id}/actions action=MEDICAL_HANDOFF"
      - "POST /event-security/incidents/{id}/actions action=EJECT"
      - "POST /event-security/incidents/{id}/actions action=LE_HANDOFF"
      - "POST /event-security/incidents/{id}/actions action=RESOLVE"
      - "POST /event-security/incidents/{id}/actions action=CLOSE_UNFOUNDED"
      - "POST /event-security/after-action-reviews/{id}/decision action=SUBMIT"
      - "POST /event-security/after-action-reviews/{id}/decision action=REVISE"
    shared_operations:
      - "POST /event-security/security-events/{id}/incidents (with PostSupervisor, SecurityDirector)"
      - "POST /event-security/security-events/{id}/density-readings (with PostSupervisor, SecurityDirector)"
      - "POST /event-security/security-events/{id}/after-action-reviews (with SecurityDirector)"
      - "GET reads on events, plans, posts, assignments, lanes, readings, incidents, reviews"

  - name: SubcontractorLiaison
    description: "vendor-side coordinator; X-User-ID is the Subcontractor's id and may only source and re-submit that vendor's own guards"
    identity: "entity_backed:Subcontractor"
    exclusive_operations: []
    shared_operations:
      - "POST /event-security/guards (with StaffingCoordinator; subcontractor_id must equal X-User-ID)"
      - "POST /event-security/guards/{id}/credential-verification action=SUBMIT_FOR_REVIEW (with StaffingCoordinator; only for guards whose subcontractor_id equals X-User-ID)"
      - "GET reads on own vendor record and own guards"

  - name: SystemOperator
    description: "platform operator that drives the logical clock and its ops sweep; holds no business authority"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads on venues and events"
