          - errors[ERR_INVALID_JOB_STATE]
        distinguishing_aspect: "From DRAFT the job machine declares exactly two exits — DESIGN_REVIEW by a calculation submit and CANCELLED by an explicit cancel. Every other lifecycle trigger aimed at a DRAFT job (part issue, weld-map release, NDE plan) must be refused with ERR_INVALID_JOB_STATE 409 rather than silently jumping the job forward."
        test_recipe:
          setup:
