          Publication supersedes the prior PUBLISHED schedule for the product type regardless of the
          effective dates involved, so a community can legitimately end up with a SUPERSEDED schedule
          whose effective_from (2026-09-01) is later than the PUBLISHED one (2026-08-15). The eligibility
