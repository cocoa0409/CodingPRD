              captures: { own_id: $.data.id }
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /tdr/parties"
              payload: { kind: "MUNICIPAL_BANK", legal_name: "City TDR Bank", contact_email: "bank@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { bank_id: $.data.id }
            - call: "POST /tdr/parties/${dev_id}/account-actions"
              payload: { action: "CREDIT", amount_cents: 30000000, expected_party_version: "${dev_v}" }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas"
              payload: { code: "SA-EAST", name: "East Ridge", neighborhood_code: "NB-EAST", allocation_formula_version: "V1_NET_ACRE", base_rate_units_per_acre: 0.25, gross_discount_factor: 0.80, equity_tier: "UNDERSERVED", sending_cap_units: 200 }
              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/appraisal-schedules"
              payload: { neighborhood_code: "NB-EAST", per_unit_value_cents: 1234567, equity_adjustment_bps: 250, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdministrator
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-CORE", name: "Core District", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: false }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
            - call: "POST /tdr/receiving-areas/${ra_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
              captures: { parcel_id: $.data.id }
            - call: "POST /tdr/severance-applications"
              payload: { sending_parcel_id: "${parcel_id}", applicant_party_id: "${own_id}", requested_units: 22 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { app_id: $.data.id }
            - call: "POST /tdr/severance-applications/${app_id}/screen"
              payload: {}
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: SeveranceReviewer
              as_user_id: "rev-1"
            - call: "POST /tdr/severance-applications/${app_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { cert_id: $.data.id, eas_id: $.data.conservation_easement_id }
            - call: "POST /tdr/market-transactions"
              payload: { certificate_id: "${cert_id}", seller_party_id: "${own_id}", buyer_party_id: "${dev_id}", channel: "PRIVATE", units: 22, conveyance_mode: "WHOLE", agreed_price_cents: 30000000 }
              as: Landowner
              as_user_id: "${own_id}"
              captures: { mtx_id: $.data.id }
            - call: "POST /tdr/market-transactions/${mtx_id}/settle"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${ra_id}", site_acres: 12.00, requested_bonus_units: 20 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { rsa_id: $.data.id, rsa_v: $.data.version }
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/redemptions"
              payload: { certificate_id: "${cert_id}", units: 16, expected_receiving_site_application_version: "${rsa_v}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { red_id: $.data.id }
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/finalize"
