# =============================================================================
# §1.8 Scaffold Difficulty Design — SPD benchmark (Test Targeting Index)
# Difficulty target: beyond expert band — dense cross-entity coupling,
# 21 non-stub instances across the nine Difficulty Rules.
# All chains assume empty DB and the logical clock default 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: tray_availability_confirmed_vs_pipeline
        grounds:
          - calculations.tray_availability_projection
          - entities.Tray.fields.status
          - state_machines.SterilizationLoad.LOADING_to_RUNNING
        distinguishing_aspect: |
          Same tray pool and the same window produce two different counts:
          confirmed_only counts only STERILE trays with sterility_expires_at > W (2),
          while pipeline_inclusive additionally counts IN_LOAD trays whose load's
          projected_release_at <= W (adds the 2 trays on the RUNNING load projected
          at exactly 08:00, boundary inclusive, but excludes the LOADING load
          projected next day) — variant divergence on the Tray/scheduling domain.
        test_recipe:
          setup:
            - "Template TPL (WRAPPED, SCALPEL x2); sterilizer ST-G1 (STEAM_GRAVITY, cap 4, 60min, level 1); technicians A (operator) and S (supervisor)"
            - "Trays t1,t2 STERILE via load L1 (released 2026-05-01T03:00:00Z, expiry 2026-05-31T03:00:00Z)"
            - "Trays t3,t4 IN_LOAD on load L2 (RUNNING, started 2026-05-01T04:00:00Z -> projected_release 2026-05-01T08:00:00Z)"
            - "Tray t5 IN_LOAD on load L3 (LOADING, planned 2026-05-02T04:00:00Z -> projected_release 2026-05-02T08:00:00Z)"
            - "Logical clock ends at 2026-05-01T04:00:00Z"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "ORTHO-01", name: "Ortho Major", specialty: "ORTHO", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 15 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY", "STEAM_PREVAC"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY", "STEAM_PREVAC", "LOW_TEMP_H2O2"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t1: "$.data.id" } }
            - { call: "POST /spd/trays/${t1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t2: "$.data.id" } }
            - { call: "POST /spd/trays/${t2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t2}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l1: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l1}/trays", payload: { tray_id: "${t1}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l1}/trays", payload: { tray_id: "${t2}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l1}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l1}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${l1}", as: Any, captures: { bi1: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bi1}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${l1}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T3" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t3: "$.data.id" } }
            - { call: "POST /spd/trays/${t3}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t3}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t3}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t3}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T4" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t4: "$.data.id" } }
            - { call: "POST /spd/trays/${t4}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t4}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t4}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t4}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T04:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l2: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l2}/trays", payload: { tray_id: "${t3}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l2}/trays", payload: { tray_id: "${t4}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T04:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/sterilization-loads/${l2}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T5" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t5: "$.data.id" } }
            - { call: "POST /spd/trays/${t5}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t5}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t5}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t5}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-02T04:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l3: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l3}/trays", payload: { tray_id: "${t5}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "GET /spd/tray-templates/${tpl}/availability", payload: { window_start_at: "2026-05-01T08:00:00Z" }, as: Any }
          assert:
            - "response data.confirmed_available_count == 2 (only t1, t2 are STERILE with expiry 2026-05-31T03:00:00Z > W)"
            - "response data.pipeline_available_count == 4 (t3, t4 on RUNNING L2 with projected_release_at 2026-05-01T08:00:00Z <= W inclusive; t5 on LOADING L3 projected 2026-05-02T08:00:00Z > W excluded)"
            - "pipeline_available_count != confirmed_available_count for identical inputs — variant divergence"

      - name: iuss_rate_per_completed_vs_per_scheduled
        grounds:
          - calculations.iuss_rolling_window_rate
          - entities.ORCase.fields.status
          - entities.IussException.fields.logged_at
        distinguishing_aspect: |
          Identical IUSS numerator (2 events in the trailing 168h) yields two
          different rates because the denominators differ: per_completed_case
          divides by completed_cases_30d (2 -> rate 1.0) while per_scheduled_case
          divides by scheduled_cases_30d (5, including SCHEDULED and CANCELLED
          cases -> rate 0.4) — dual-variant logic on the IussException/ORCase
          domain, distinct from the Tray availability domain.
        test_recipe:
          setup:
            - "Template, sterilizer ST-G1, technicians A (operator) and S (supervisor)"
            - "Cases C1 (completed 2026-05-08T12:00:00Z) and C2 (completed 2026-05-09T12:00:00Z) each ran with one reserved sterile tray"
            - "Cases C3, C4 remain SCHEDULED; case C5 was created then CANCELLED; all five have scheduled_start_at within (2026-04-10T12:00:00Z, 2026-05-10T12:00:00Z]"
            - "Two IUSS exceptions logged by technician A at 2026-05-10T10:00:00Z against DECONTAMINATED trays u1, u2 and cases C3, C4"
            - "Logical clock ends at 2026-05-10T12:00:00Z"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GENS-01", name: "General Set", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "S1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { s1: "$.data.id" } }
            - { call: "POST /spd/trays/${s1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${s1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${s1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${s1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l1: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l1}/trays", payload: { tray_id: "${s1}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l1}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l1}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${l1}", as: Any, captures: { bi1: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bi1}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${l1}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-1", surgeon: "Dr A", scheduled_start_at: "2026-05-08T09:00:00Z", scheduled_end_at: "2026-05-08T11:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { c1: "$.data.id", c1_v: "$.data.version" } }
            - { call: "POST /spd/or-cases/${c1}/reservations", payload: { tray_id: "${s1}", expected_or_case_version: "${c1_v}" }, as: OrScheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/or-cases/${c1}/start", as: OrScheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T12:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/or-cases/${c1}/complete", as: OrScheduler }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "S2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { s2: "$.data.id" } }
            - { call: "POST /spd/trays/${s2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${s2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${s2}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${s2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-09T06:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l2: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l2}/trays", payload: { tray_id: "${s2}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T06:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/sterilization-loads/${l2}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l2}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T09:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${l2}", as: Any, captures: { bi2: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bi2}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${l2}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-2", surgeon: "Dr B", scheduled_start_at: "2026-05-09T13:00:00Z", scheduled_end_at: "2026-05-09T15:00:00Z", priority: "URGENT" }, as: OrScheduler, captures: { c2: "$.data.id", c2_v: "$.data.version" } }
            - { call: "POST /spd/or-cases/${c2}/reservations", payload: { tray_id: "${s2}", expected_or_case_version: "${c2_v}" }, as: OrScheduler }
            - { call: "POST /spd/or-cases/${c2}/start", as: OrScheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T12:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/or-cases/${c2}/complete", as: OrScheduler }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-3", surgeon: "Dr C", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T10:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { c3: "$.data.id" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-4", surgeon: "Dr D", scheduled_start_at: "2026-05-10T13:00:00Z", scheduled_end_at: "2026-05-10T14:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { c4: "$.data.id" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-5", surgeon: "Dr E", scheduled_start_at: "2026-05-10T15:00:00Z", scheduled_end_at: "2026-05-10T16:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { c5: "$.data.id" } }
            - { call: "POST /spd/or-cases/${c5}/cancel", as: OrScheduler }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "U1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { u1: "$.data.id" } }
            - { call: "POST /spd/trays/${u1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${u1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "U2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { u2: "$.data.id" } }
            - { call: "POST /spd/trays/${u2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${u2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u1}", case_id: "${c3}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u2}", case_id: "${c4}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T12:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "GET /spd/compliance/summary", as: Any }
          assert:
            - "data.iuss_count_7d == 2 (both logged at 2026-05-10T10:00:00Z, inside (2026-05-03T12:00:00Z, 2026-05-10T12:00:00Z])"
            - "data.completed_cases_30d == 2 (C1 completed_at 2026-05-08T12:00:00Z, C2 2026-05-09T12:00:00Z)"
            - "data.scheduled_cases_30d == 5 (C1..C5 scheduled_start_at all inside the 720h window; CANCELLED C5 included)"
            - "data.iuss_rate_per_completed == 1.0 (2 / max(2, 1))"
            - "data.iuss_rate_per_scheduled == 0.4 (2 / max(5, 1)) — same numerator, different denominator variant"
            - "data.loads_recalled_30d == 0 and data.trays_quarantined_count == 0"

      - name: technician_competency_rolling_vs_lifetime
        grounds:
          - calculations.technician_competency_score
          - entities.Technician.fields.competency_score
          - entities.Technician.fields.competency_score_lifetime
        distinguishing_aspect: |
          Identical demerit history (one FAIL verification -2 and one FAILED_CYCLE
          -8, both aged 100 days) produces two different scores on the Technician
          domain: rolling_90d excludes events older than 90 days (score 100),
          lifetime counts all events at full weight (score 90) — a third
          dual-variant surface, on a different entity domain than the Tray and
          IUSS variants.
        test_recipe:
          setup:
            - "Technician B (level 2, STEAM_GRAVITY) with two demerit events recorded at 2026-05-01T00:00:00Z: one FAIL assembly verification (-2) and one FAILED_CYCLE as operator (-8)"
            - "Logical clock advanced 100 days to 2026-08-09T00:00:00Z"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "CARD-01", name: "Cardiac Set", specialty: "CARD", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 20 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech B", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-06-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_b: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G2", method: "STEAM_GRAVITY", chamber_capacity: 2, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "V1" }, as: SpdTechnician, as_user_id: "${tech_b}", captures: { v1: "$.data.id" } }
            - { call: "POST /spd/trays/${v1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_b}" }
            - { call: "POST /spd/trays/${v1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_b}" }
            - { call: "POST /spd/trays/${v1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_b}" }
