            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "CAT", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-B20", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-06-01T08:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /shot-visits/${visit_id}/release"
              payload: { released_at_iso: "2026-06-01T09:29:00Z", reaction_grade: "NONE" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "Response status 422 with data.error_id == ERR_OBSERVATION_NOT_ELAPSED (release at 29 of 30 min collides with the open observation interval)."

      - name: vial_expiry_blocks_dose_after_bud
        grounds:
          - state_machines.SerumVial.IN_USE_to_EXPIRED
          - validations[priority=9]
          - errors[ERR_VIAL_NOT_USABLE]
          - entities.SerumVial.fields.beyond_use_date_iso
        distinguishing_aspect: |
          Different interval semantics and different resource (SerumVial, not ShotVisit):
          the vial occupies a shelf-life interval [mixed_at, beyond_use_date) and a dose
          drawn when the clock has reached the closed upper bound (clock >= BUD, inclusive)
          collides with the expired boundary. RED shelf-life is 180 days.
        test_recipe:
          setup:
            - "An ACTIVE plan whose RED vial was mixed at 2026-01-01 (BUD 2026-06-30) and the clock has advanced to 2026-06-30T00:00:00Z (on the inclusive BUD), auto-expiring the vial."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Sue Pugh", date_of_birth: "1988-06-06", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Exp", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-C30", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: Nurse
              captures: { expired: $.data.expired_vial_ids }
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "SerumVial.${vial_id}.status == EXPIRED (clock 2026-06-30 >= BUD 2026-06-30, inclusive)"
            - "Response status 422 with data.error_id == ERR_VIAL_NOT_USABLE"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: vial_volume_conserved_under_draw_and_discard
        grounds:
          - entities.SerumVial.fields.remaining_volume_ml
          - entities.SerumVial.fields.prepared_volume_ml
          - state_machines.ShotVisit.ADMINISTERED_to_RELEASED
          - state_machines.SerumVial.IN_USE_to_DISCARDED
        distinguishing_aspect: |
          Conserved quantity = serum volume: at all times remaining_volume_ml ==
          prepared_volume_ml - SUM(administered_volume_ml of RELEASED/reaction-resolved
          ShotVisits on the vial). After a 0.10 mL released draw on a 5.0 mL vial,
          remaining is exactly 4.90; the discard (plan discontinue) does not alter
          remaining_volume_ml — no drift.
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan with a RED vial prepared 5.0 mL, one released shot drawing 0.10 mL (remaining 4.90)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Tom Quay", date_of_birth: "1987-07-07", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Cons", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "CAT", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-D40", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T01:00:00Z" }
              as: Nurse
            - call: "POST /shot-visits/${v1_id}/release"
              payload: { released_at_iso: "2026-01-01T01:00:00Z", reaction_grade: "NONE" }
              as: Nurse
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/discontinue"
              payload: {}
              as: Allergist
            - call: "GET /serum-vials/${vial_id}"
              payload: {}
              as: Pharmacist
              captures: { rem: $.data.remaining_volume_ml }
          assert:
            - "SerumVial.${vial_id}.remaining_volume_ml == 4.90 (prepared 5.0 - drawn 0.10; DISCARD leaves the conserved volume unchanged)"
            - "SerumVial.${vial_id}.status == DISCARDED"

      - name: billing_total_conserved_under_reversal
        grounds:
          - state_machines.BillingEntry.POSTED_to_REVERSED
          - calculations.billing_charge
          - entities.BillingEntry.fields.charge_cents
          - entities.BillingEntry.fields.status
        distinguishing_aspect: |
          Conserved quantity = patient billed_total_cents (a money quantity, distinct from
          serum volume): the billing-summary total EXCLUDES REVERSED entries, so the forward
          injection POST (+2600c) paired with its compensating REVERSAL on systemic reaction
          leaves billed_total_cents unchanged from the pre-injection baseline (0 here, no
          95165 since no vial mixed... vial IS mixed, so baseline includes the 95165).
        test_recipe:
          setup:
            - "An ACTIVE RED-start plan; RED vial mixed (prepared 5.0 -> PROVISIONAL 95165 = 5 doses, 7250c), one shot ADMINISTERED (PROVISIONAL CPT_95115 = 2600c posted). billed_total before reaction = 7250 + 2600 = 9850."
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Uma Rees", date_of_birth: "1986-08-08", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Bill", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-E50", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", injection_count: 1, expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { visit_id: $.data.id }
            - call: "GET /patients/${pat_id}/billing-summary"
              payload: {}
              as: Biller
              captures: { before_total: $.data.billed_total_cents }
          trigger:
            - call: "POST /shot-visits/${visit_id}/record-reaction"
              payload: { reaction_grade: "SYSTEMIC", epinephrine_administered: true }
              as: Nurse
            - call: "GET /patients/${pat_id}/billing-summary"
              payload: {}
              as: Biller
              captures: { after_total: $.data.billed_total_cents, reversed_total: $.data.reversed_total_cents }
          assert:
            - "Before reaction billed_total_cents == 9850 (7250 PROVISIONAL 95165 + 2600 CPT_95115)"
            - "After reaction billed_total_cents == 7250 (the 2600 injection charge is REVERSED and excluded; the 95165 prep charge is conserved)"
            - "reversed_total_cents == 2600"
