      - name: clock_endpoint_relabels_every_derived_field_in_one_call
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - calculations.recording_retention_status
          - calculations.coaching_overdue_days
        distinguishing_aspect: "The logical clock is the single lever behind three independent derived fields, so one POST /_clock/set_current_utc request relabels a license from VALID to LAPSED, a recording from RECORDED to EXPIRED and a coaching assignment from ASSIGNED to OVERDUE — and the endpoint itself writes nothing but the clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain with a license expiring 2026-12-31, a recording retained until 2033-09-29 and a manual coaching assignment due 2026-10-15."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - call: "POST /agents/${agent_id}/licenses"
              payload: { state_code: "TX", license_number: "TX-LIC-77031", issued_on: "2026-08-05T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: LicensingCoordinator
              captures: { license_id: $.data.id }
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - &cc_coaching_manual
              call: "POST /coaching-assignments"
              payload: { agent_id: "${agent_id}", coaching_type: "MARKETING_RULES" }
              as: Coach
              captures: { coaching_id: $.data.id }
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - &cc_soa_late
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_two_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_two_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_late_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the clock call returns 200 and reports current_utc == 2027-01-02T00:00:00Z"
            - "GET /agents/${agent_id}/licenses now reports AgentStateLicense.${license_id}.license_status == LAPSED"
            - "GET /coaching-assignments/${coaching_id} now reports status == OVERDUE with overdue_days == 79"
            - "GET /call-sessions/${call_id} still reports recording_status == RECORDED, because recording_retained_until 2033-09-29 has not passed"
            - "the clock endpoint declares no entity output of its own beyond current_utc, so every relabel is a read-time derivation and no entity version changed"

      - name: scope_void_is_the_only_non_terminal_scope_action
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/scope-of-appointments/{id}/void
          - entities.ScopeOfAppointment.fields.status
          - errors.ERR_SCOPE_OF_APPOINTMENT_CONSUMED
        distinguishing_aspect: "Voiding is a ComplianceOfficer-only action that moves a CAPTURED scope to VOIDED, and because the scope status is a three-value enum with no un-void edge, a voided scope can never be reused — the refusal is ERR_SCOPE_OF_APPOINTMENT_CONSUMED rather than a 409 state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_soa and a completed call, with the scout's agent ACTIVE."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
          trigger:
            - call: "POST /scope-of-appointments/${soa_id}/void"
              payload: { reason: "Beneficiary revoked the scope after the call" }
              as: ComplianceOfficer
              captures: { status_after_void: $.data.status }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the void returns 200 and status_after_void == VOIDED"
            - "the subsequent enrollment returns 422 with error_id == ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "ScopeOfAppointment.${soa_id}.consumed_by_enrollment_id is still null, so the voided scope was never consumed"
            - "the status is VOIDED and not CONSUMED, so the refusal is not ERR_SCOPE_OF_APPOINTMENT_CONSUMED"
            - "GET /scope-of-appointments?member_id=${member_id} returns exactly 1 row with status VOIDED"

  # ===========================================================================
  - section: errors
    instances:

      - name: recording_expired_error_is_declared_but_not_raised_by_any_endpoint
        claim_type: violation_to_error
        grounds:
          - errors.ERR_RECORDING_EXPIRED
          - calculations.recording_retention_status
          - entities.CallSession.fields.recording_status
        distinguishing_aspect: "ERR_RECORDING_EXPIRED is declared at 410 for a retention window lapsing while an open review still references the call, yet the only observable behaviour of an expired recording today is the read-time recording_status EXPIRED; the declared 410 therefore has no reachable trigger and the read-time label is what a test can assert."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain with a connected call whose recording_retained_until is 2033-09-29."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
          trigger:
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { recording_status_now: $.data.recording_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2033-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { recording_status_later: $.data.recording_status }
          assert:
            - "at 2026-10-01 the recording_status is ${recording_status_now} == RECORDED, because retained_until is 2033-09-29"
            - "at 2033-10-01 the recording_status is ${recording_status_later} == EXPIRED, since the clock has passed recording_retained_until"
            - "GET /call-sessions?recording_status=EXPIRED returns exactly 1 row"
            - "no endpoint raises ERR_RECORDING_EXPIRED at 410 in this chain, so the declared code is an unreachable branch and the read-time label is the assertable behaviour"
            - "CallSession.${call_id}.recording_id is still REC-1001 and the row's version never changed"

      - name: live_call_limit_error_is_declared_but_unreachable_under_the_overlap_rule
        claim_type: violation_to_error
        grounds:
          - errors.ERR_LIVE_CALL_LIMIT_EXCEEDED
          - errors.ERR_AGENT_HAS_ACTIVE_CALL
          - entities.Agency.fields.max_live_calls_per_agent
        distinguishing_aspect: "ERR_LIVE_CALL_LIMIT_EXCEEDED is declared as the max_live_calls_per_agent breach, but with max_live_calls_per_agent 1 the overlap rule's ERR_AGENT_HAS_ACTIVE_CALL fires first for every colliding request, so the limit code is shadowed and only the overlap code is observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain plus two scopes, with a live call of the agent occupying [09:00, 10:00)."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_soa2
            - &cc_call_live
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T10:00:00Z", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_live_id: $.data.id }
            - call: "POST /call-sessions/${call_live_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_two_id}", started_at: "2026-10-01T09:30:00Z", scheduled_end_at: "2026-10-01T10:30:00Z", recording_id: "REC-1002", disclaimer_script_code: "CMS-DISC-2026", disclaimer_delivered: true, marketing_rule_set_version: "MKT-2026-V3" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the colliding submission returns 409 with error_id == ERR_AGENT_HAS_ACTIVE_CALL"
            - "error_id != ERR_LIVE_CALL_LIMIT_EXCEEDED, so the limit code is shadowed by the overlap rule under the default max_live_calls_per_agent of 1"
            - "GET /agents/${agent_id}/call-sessions returns exactly 1 row"
            - "Agent.${agent_id}.live_call_count == 1, the value the limit would have compared against"
            - "GET /agencies/${agency_id} reports max_live_calls_per_agent == 1, the configuration that makes the limit unreachable"

      - name: stale_version_on_a_sequential_enrollment_resubmission
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STALE_VERSION
          - concurrency_rules[enrollment-create-stale-call-session]
          - endpoints.POST_/enrollments
        distinguishing_aspect: "The OCC guard is observable with two strictly sequential requests: after the first enrollment advances the call session's version, a second submission still carrying the pre-advance value is refused with 412 ERR_STALE_VERSION even though the call session's status is perfectly valid for another submission."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_complete, so CallSession.${call_id}.version is captured as ${call_v1}."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
          trigger:
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-02T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the first submission advanced CallSession.${call_id}.version to ${call_v1} + 1, so the captured value is now stale"
            - "the second submission returns 412 and error_id == ERR_STALE_VERSION"
            - "the status is 412 and not 409, distinguishing an OCC refusal from a state refusal"
            - "GET /enrollments?call_session_id=${call_id} returns exactly 1 row, so the stale request persisted nothing"
            - "the second submission would have succeeded on state grounds alone, since the call session is COMPLETED and the scope still has usable plan types"

      - name: amount_variant_mismatch_is_declared_but_the_finalize_edge_always_derives
        claim_type: violation_to_error
        grounds:
          - errors.ERR_AMOUNT_VARIANT_MISMATCH
          - state_machines.CommissionLedgerEntry.transitions.PROVISIONAL_to_FINALIZED
          - calculations.commission_ledger_entry
        distinguishing_aspect: "ERR_AMOUNT_VARIANT_MISMATCH is declared for a finalize whose stored amount disagrees with the FINAL variant, but the finalize edge now derives the amount at the moment of finalization and declares no stored-value precondition, so the code has no reachable trigger and the observable contract is that the amount is recomputed."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through effectuation, so an INITIAL entry of 3600.00 sits PROVISIONAL."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
            - *cc_effect
            - call: "GET /commission-ledger-entries"
              payload: { enrollment_id: "${enrollment_id}" }
              as: DirectorOfSales
              captures: { entry_initial_id: "$.data[0].id", amount_before: "$.data[0].amount_cents" }
          trigger:
            - call: "GET /carriers/${carrier_a_id}"
              payload: {}
              as: PlatformAdmin
              captures: { carrier_v_now: $.data.version }
            - call: "PUT /carriers/${carrier_a_id}"
              payload: { initial_commission_rate_pct: 0.25, expected_carrier_version: "${carrier_v_now}" }
              as: PlatformAdmin
            - call: "POST /commission-ledger-entries/${entry_initial_id}/finalize"
              payload: {}
              as: DirectorOfSales
          assert:
            - "before the finalize the INITIAL entry stores amount_before == 3600.00"
            - "the finalize returns 200 with no ERR_AMOUNT_VARIANT_MISMATCH, because the edge declares no stored-amount precondition"
            - "after the finalize CommissionLedgerEntry.${entry_initial_id}.amount_cents == 4500.00, the INITIAL figure recomputed at the new 0.25 rate"
            - "amount_cents != 3600.00, so the finalize derived rather than compared"
            - "no reachable chain in this scaffold raises ERR_AMOUNT_VARIANT_MISMATCH, so it is a declared-but-unreachable branch"

  # ===========================================================================
  - section: rbac
    instances:

      - name: licensed_agent_cannot_file_a_complaint_against_itself
        claim_type: role_denial
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - roles.LicensedAgent.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The complaint surface is exclusive to ComplianceOfficer and CarrierIntegration, so LicensedAgent — the role that owns the call and the enrollment — is refused with 403 on POST /complaints even when it targets its own agent id, and the same body sent as ComplianceOfficer succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain with an ACTIVE agent, so only the role is wrong."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
          trigger:
            - call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "MISREPRESENTATION", source: "BENEFICIARY", severity: "LOW", filed_on: "2026-09-28T00:00:00Z" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the request returns 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /complaints?agent_id=${agent_id} returns 0 rows"
            - "Agency.${agency_id}.open_complaint_count == 0, so the refusal ran no side effect"
            - "the identical body as ComplianceOfficer returns 201 with status OPEN"
            - "the denial is role-based, not ownership-based: the caller named its own agent id and was still refused"

      - name: director_of_sales_cannot_substantiate_a_complaint
        claim_type: role_denial
        grounds:
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Adjudication is exclusive to ComplianceOfficer: DirectorOfSales, who owns the money desk and may open and close reconciliation periods, is refused with 403 on POST /complaints/{id}/substantiate and the complaint stays UNDER_REVIEW, so the coaching assignment that substantiation would synthesize is never created."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain plus a complaint moved into review by the compliance officer."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_complaint
            - call: "POST /complaints/${complaint_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /complaints/${complaint_id}/substantiate"
              payload: {}
              as: DirectorOfSales
              captures: { error_id: $.data.error_id }
          assert:
            - "the substantiation returns 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /complaints/${complaint_id} still reports status == UNDER_REVIEW"
            - "Agent.${agent_id}.substantiated_complaint_count == 0 and open_coaching_count == 0"
            - "GET /complaints/${complaint_id} reports finding_code null and substantiated_on null"
            - "the same request as ComplianceOfficer returns 200 and then sets finding_code == MARKETING_VIOLATION"

      - name: coach_cannot_create_or_close_a_coaching_assignment
        claim_type: role_denial
        grounds:
          - roles.Coach.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Coach owns only the start and complete edges of a coaching assignment, so the same role is refused on the creation endpoint — which belongs to Coach-or-ComplianceOfficer — when the request also names a complaint, and is refused on complaint closure; the work edge and the case-management edge are separable."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain plus a substantiated complaint, so its coaching assignment exists and the complaint sits SUBSTANTIATED."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_complaint
            - call: "POST /complaints/${complaint_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
              captures: { coaching_id: $.data.id }
          trigger:
            - call: "GET /coaching-assignments/${coaching_id}"
              payload: {}
              as: Coach
              captures: { coaching_status: $.data.status }
            - call: "POST /complaints/${complaint_id}/close"
              payload: {}
              as: Coach
              captures: { error_id_close: $.data.error_id }
          assert:
            - "Coach may read the assignment: the GET returns 200 with coaching_status == ASSIGNED"
            - "the close attempt returns 403 and error_id_close == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /complaints/${complaint_id} still reports status == SUBSTANTIATED and Agency.${agency_id}.open_complaint_count == 1"
            - "GET /coaching-assignments/${coaching_id} still reports status == ASSIGNED with completed_on null"
            - "POST /coaching-assignments/${coaching_id}/start as Coach returns 200 and moves it to IN_PROGRESS"

      - name: platform_admin_cannot_connect_an_agent_call
        claim_type: role_denial
        grounds:
          - roles.PlatformAdmin.identity
          - roles.PlatformAdmin.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: "PlatformAdmin is an opaque operator identity with no entity backing and no business write surface beyond configuration, so it is refused with 403 on POST /call-sessions/{id}/connect — an operation reserved to LicensedAgent — while its own configuration endpoints succeed with no X-User-ID matching any entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain through *cc_call, so a RINGING call exists."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
          trigger:
            - call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: true, plan_type_discussed: "MAPD", recording_id: "REC-1001", disclaimer_script_code: "CMS-DISC-2026", marketing_rule_set_version: "MKT-2026-V3" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the connect returns 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /call-sessions/${call_id} still reports status == RINGING and version 1"
            - "the same call as LicensedAgent with as_user_id ${agent_id} returns 200"
            - "the refusal is not a header error: POST /plans as PlatformAdmin succeeds without any X-User-ID bound to an entity, confirming the opaque identity"
            - "Agent.${agent_id}.live_call_count == 0 after the refusal"

      - name: licensing_coordinator_cannot_touch_plans_or_money
        claim_type: role_denial
        grounds:
          - roles.LicensingCoordinator.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "LicensingCoordinator owns exactly three endpoints — licenses, certifications and appointments — so it is refused with 403 on plan creation (PlatformAdmin) and on ledger finalization (DirectorOfSales), which keeps the staffing pipeline from touching either the benefit design or the money."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through effectuation."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
            - *cc_effect
            - call: "GET /commission-ledger-entries"
              payload: { enrollment_id: "${enrollment_id}" }
              as: LicensingCoordinator
              captures: { entry_initial_id: "$.data[0].id" }
          trigger:
            - call: "POST /plans"
              payload: { carrier_id: "${carrier_a_id}", plan_id_code: "MER-H0021-002", plan_type: "MAPD", state_code: "TX", county_code: "TX-201", monthly_premium_cents: 1500, annual_drug_deductible_cents: 20000, star_rating: 4.5, formulary_id: "FORM-2026-V1", pharmacy_network_id: "PHARM-2026-V1", provider_directory_id: "PROV-2026-V1" }
              as: LicensingCoordinator
              captures: { error_plan: $.data.error_id }
            - call: "POST /commission-ledger-entries/${entry_initial_id}/finalize"
              payload: {}
              as: LicensingCoordinator
              captures: { error_ledger: $.data.error_id }
          assert:
            - "the plan creation returns 403 and error_plan == ERR_INSUFFICIENT_PERMISSIONS"
            - "the ledger finalize returns 403 and error_ledger == ERR_INSUFFICIENT_PERMISSIONS"
            - "LicensingCoordinator may still read the ledger: the GET returns 200 with exactly 1 row"
            - "GET /plans?carrier_id=${carrier_a_id} still returns exactly 1 plan, so the refused creation persisted nothing"
            - "CommissionLedgerEntry.${entry_initial_id}.status is still PROVISIONAL"

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: stale_member_version_on_a_second_scope_of_appointment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[soa-capture-stale-member]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/scope-of-appointments
        distinguishing_aspect: "Capturing a second scope legitimately supersedes the first, so a sequential second capture is not a business error — it is refused with 412 ERR_STALE_VERSION only because the caller still carries the member version observed before the first capture advanced it."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_member, so Member.${member_id}.version is captured as ${member_v1}."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
          trigger:
            - call: "POST /scope-of-appointments"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", capture_channel: "ELECTRONIC", plan_types_authorized: ["PDP"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /members/${member_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { member_v_now: $.data.version }
            - call: "POST /scope-of-appointments"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", capture_channel: "ELECTRONIC", plan_types_authorized: ["PDP"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_v_now}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_second_id: $.data.id }
          assert:
            - "the first capture advanced Member.${member_id}.version to ${member_v1} + 1, so the second request's carried value is stale"
            - "the second capture returns 412 and error_id == ERR_STALE_VERSION"
            - "error_id is not ERR_SCOPE_OF_APPOINTMENT_MISSING, since the member and agent are both valid"
            - "GET /members/${member_id}/scope-of-appointments returns exactly 1 row after the stale refusal"
            - "a third capture re-reading the member version first returns 201 and the list then reports 2 rows"

      - name: durable_scope_is_excluded_from_a_default_list_but_returned_on_filter
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ScopeOfAppointment.fields.status
          - endpoints.GET_/scope-of-appointments
          - calculations.soa_validity_window
        distinguishing_aspect: "A scope's usability is a read-time derivation from the clock while its status enum is stored, so after the window closes the row still reads CAPTURED and still appears in a status filter, yet the enrollment path refuses it — the stored enum and the derived usability diverge by design."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_soa with soa_max_age_days 30, then the clock moved well past the window."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /scope-of-appointments"
              payload: { member_id: "${member_id}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_status: "$.data[0].status", soa_expires: "$.data[0].expires_on" }
            - call: "GET /scope-of-appointments"
              payload: { member_id: "${member_id}", status: "CAPTURED" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "the unfiltered list returns exactly 1 row with soa_status == CAPTURED and expires_on == 2026-10-31T00:00:00Z"
            - "the status-filtered list also returns exactly 1 row, so a lapsed scope is still discoverable by its stored status"
            - "the stored enum did not move: status is CAPTURED even though the clock is at 2026-12-01, past expires_on"
            - "an enrollment using this scope at 2026-12-01 returns 422 ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "the row is retained: ScopeOfAppointment.${soa_id}.retained_until == 2036-09-28T00:00:00Z, so the record outlives its usability"

      - name: compliance_posture_reflects_children_and_gates_them_in_return
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Agency.fields.compliance_posture
          - state_machines.Agency.transitions.OPEN_to_RESTRICTED
          - state_machines.Agency.transitions.RESTRICTED_to_FROZEN
        distinguishing_aspect: "The posture is a bubble-up aggregate over the agency's children and a cascade-down gate over the same children, so one substantiation both raises the posture to RESTRICTED and, through that same posture, suspends the agent whose complaint caused it."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain with a connected call, and four separate HIGH complaints on file."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - &cc_c1
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "MISREPRESENTATION", source: "CMS", severity: "HIGH", filed_on: "2026-09-20T00:00:00Z" }
              as: ComplianceOfficer
              captures: { complaint_1_id: $.data.id }
            - &cc_c2
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "DISCLAIMER_MISSING", source: "CMS", severity: "HIGH", filed_on: "2026-09-21T00:00:00Z" }
              as: ComplianceOfficer
              captures: { complaint_2_id: $.data.id }
            - &cc_c3
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "RECORDING_MISSING", source: "CMS", severity: "HIGH", filed_on: "2026-09-22T00:00:00Z" }
              as: ComplianceOfficer
              captures: { complaint_3_id: $.data.id }
            - &cc_c4
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "UNAPPROVED_MARKETING", source: "CMS", severity: "HIGH", filed_on: "2026-09-23T00:00:00Z" }
              as: ComplianceOfficer
              captures: { complaint_4_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_4_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_4_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "GET /agencies/${agency_id} reports open_complaint_count == 4 before the trigger and 3 after, the other three still being OPEN"
            - "the substantiation raises the posture to RESTRICTED, the bubble-up half of the aggregate"
            - "the RESTRICTED cascade then suspends the agent: Agent.${agent_id}.status == SUSPENDED and live_call_count == 0"
            - "GET /call-sessions/${call_id} reports status == DROPPED, the cascade-down half"
            - "with five strikes the posture is FROZEN and every child mutation returns 403 ERR_AGENCY_FROZEN"

      - name: idempotent_acknowledgment_is_refused_rather_than_replayed
        claim_type: idempotency
        grounds:
          - state_machines.Enrollment.transitions.SUBMITTED_to_ACKNOWLEDGED
          - errors.ERR_ENROLLMENT_NOT_SUBMITTED
        distinguishing_aspect: "There is no idempotency-key surface on the enrollment submission path; a repeated acknowledgment is refused with 409 ERR_ENROLLMENT_NOT_SUBMITTED rather than answered with the same 200 body, so the caller must treat a replay as an error and not a no-op."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll, then acknowledged once."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
          trigger:
            - call: "POST /enrollments/${enrollment_id}/acknowledge"
              payload: { carrier_id: "${carrier_a_id}" }
              as: CarrierIntegration
              captures: { error_id: $.data.error_id }
          assert:
            - "the repeated acknowledgment returns 409 and error_id == ERR_ENROLLMENT_NOT_SUBMITTED"
            - "no ledger entry is posted by the refusal: GET /commission-ledger-entries?enrollment_id=${enrollment_id} still returns exactly 2 rows"
            - "Enrollment.${enrollment_id}.acknowledged_on is unchanged by the replay"
            - "Enrollment.${enrollment_id}.version is unchanged, so the replay is a true no-op on state"
            - "Agency.${agency_id}.commission_balance_cents == 5400.00 across the whole trigger"

      - name: no_flag_or_configuration_input_changes_the_disclaimer_obligation
        claim_type: conditional_feature_flags
        grounds:
          - entities.Agency.fields.compliance_posture
          - validations[priority=9]
          - entities.ScopeOfAppointment.fields.capture_channel
        distinguishing_aspect: "There is no entity-level boolean that switches the disclaimer rule off: the only latitude the scaffold grants is the WRITTEN capture channel, and that latitude is a property of the scope rather than a configuration flag, so no agency setting can exempt a telephonic call."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain plus a second agency with every retention and capacity setting different, and a member of that second agency with a TELEPHONIC_RECORDED scope handled by the first agency's agent."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: false }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the connect returns 422 and error_id == ERR_DISCLAIMER_NOT_DELIVERED"
            - "no field on Agency can turn this into a success: the agency is OPEN and the refusal still stands"
            - "the only exempting condition observed anywhere in the scaffold is ScopeOfAppointment.capture_channel == WRITTEN"
            - "GET /agencies/${agency_id} exposes no boolean disclaimer flag field"
            - "GET /call-sessions/${call_id} still reports status == RINGING with version 1"

