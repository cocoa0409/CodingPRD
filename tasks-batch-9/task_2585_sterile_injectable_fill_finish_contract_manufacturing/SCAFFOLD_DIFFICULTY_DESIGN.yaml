# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2585 — Sterile Injectable Fill-Finish Contract Manufacturing
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every literal in every `assert:` was computed by executing the §1.3 formula.
# Logical clock: the server default is 2026-08-01T00:00:00Z; every chain below
# pins it explicitly with POST /_clock/set_current_utc.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: batch_provisional_vs_final_releasable_units_diverge
        grounds:
          - calculations.batch_releasable_units
          - entities.BatchOrder.fields.provisional_releasable_units
          - entities.BatchOrder.fields.final_releasable_units
          - entities.ClientProject.fields.historical_reject_rate_ppm
          - entities.InProcessCheck.fields.destructive_sample_units
          - state_machines.BatchOrder.production_status.FILLING_to_FILLED
          - state_machines.BatchOrder.quality_status.BR_REVIEW_to_QP_REVIEW
        distinguishing_aspect: |
          The two variants live on the BatchOrder unit ledger: PROVISIONAL_AT_FILL projects
          rejects from the sponsor's historical_reject_rate_ppm (2500 ppm -> ceil 22 units) and
          ignores quarantined_unit_count, while FINAL_AT_QP_REVIEW replays the recorded
          VISUAL_INSPECTION reject_unit_count (166) — so for one identical stored batch
          provisional_releasable_units == 8418 and final_releasable_units == 8274, a 144-unit
          delta, and the provisional figure is never overwritten.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-1, grade B, changeover 60/240 minutes, max_committed_minutes 20000, cleaning_validation_status VALIDATED for MOL-A, aseptic_qualification_status QUALIFIED with media_fill_valid_until 2027-03-03T00:00:00Z, two QUALIFIED operators (OP-A, OP-B), posture OPEN."
            - "ClientProject 'Sponsor A' for MOL-A, dosage_form VIAL, target_fill_weight_mg 1000, historical_reject_rate_ppm 2500, reserved_unit_budget 30000, status ACTIVE."
            - "Two RELEASED ComponentLots of 30000 units each (VIAL VL-1, STOPPER ST-1)."
            - "BatchOrder B-001 in FS-1 for [2026-09-10T08:00Z, 2026-09-10T16:00Z), target_fill_units 10000, component_demand_units 21560, changeover_minutes_applied 60."
            - "10560 VIAL units and 11000 STOPPER units RESERVED against the batch."
            - "Three InProcessChecks recorded during the fill: FILL_WEIGHT (destructive 40, PASS), CCI (destructive 20, PASS), VISUAL_INSPECTION (sample_size 8500, reject_unit_count 166, PASS)."
            - "filled_unit_count 8500, production_status FILLED, BatchRecordReview CLOSED with 0 findings, quality_status QP_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-B", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_b_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_b_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /filling-suites/${suite_id}/cleaning-validation"
              payload: { molecule_name: "MOL-A", residue_ug_per_swab: 12 }
              as: MicrobiologyAnalyst
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "ENGINEERING_RUN", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "COMPLETE", analytical_method_transfer_status: "VALIDATED" }
              as: ProgramManager
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_vial_id: $.data.id }
            - call: "POST /component-lots/${lot_vial_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "STOPPER", lot_code: "ST-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_stop_id: $.data.id }
            - call: "POST /component-lots/${lot_stop_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { suite_v1: $.data.version }
            - call: "POST /batch-orders"
              payload: { client_project_id: "${proj_id}", suite_id: "${suite_id}", lead_operator_qualification_id: "${pq_a_id}", batch_number: "B-001", planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-10T16:00:00Z", target_fill_units: 10000, expected_suite_version: "${suite_v1}" }
              as: ProgramManager
              captures: { batch_id: $.data.id }
            - call: "GET /component-lots/${lot_vial_id}"
              as: ProgramManager
              captures: { lot_vial_v1: $.data.version }
            - call: "POST /component-reservations"
              payload: { batch_order_id: "${batch_id}", component_lot_id: "${lot_vial_id}", quantity_reserved: 10560, expected_component_lot_version: "${lot_vial_v1}" }
              as: ProgramManager
            - call: "GET /component-lots/${lot_stop_id}"
              as: ProgramManager
              captures: { lot_stop_v1: $.data.version }
            - call: "POST /component-reservations"
              payload: { batch_order_id: "${batch_id}", component_lot_id: "${lot_stop_id}", quantity_reserved: 11000, expected_component_lot_version: "${lot_stop_v1}" }
              as: ProgramManager
            - call: "POST /batch-orders/${batch_id}/setup"
              as: ProductionSupervisor
            - call: "POST /batch-orders/${batch_id}/start-fill"
              as: ProductionSupervisor
            - call: "POST /in-process-checks"
              payload: { batch_order_id: "${batch_id}", check_type: "FILL_WEIGHT", sample_size: 40, reject_unit_count: 0, destructive_sample_units: 40, measured_fill_weights_mg: [1000, 1020, 985, 1028, 1012] }
              as: ProductionSupervisor
            - call: "POST /in-process-checks"
              payload: { batch_order_id: "${batch_id}", check_type: "CCI", sample_size: 20, reject_unit_count: 0, destructive_sample_units: 20 }
              as: ProductionSupervisor
            - call: "POST /in-process-checks"
              payload: { batch_order_id: "${batch_id}", check_type: "VISUAL_INSPECTION", sample_size: 8500, reject_unit_count: 166, destructive_sample_units: 0 }
              as: ProductionSupervisor
            - call: "POST /batch-orders/${batch_id}/complete-fill"
              payload: { filled_unit_count: 8500 }
              as: ProductionSupervisor
            - call: "POST /batch-record-reviews"
              payload: { batch_order_id: "${batch_id}" }
              as: QaReviewer
              as_user_id: "qa-001"
              captures: { br_id: $.data.id }
            - call: "POST /batch-record-reviews/${br_id}/close"
              as: QaReviewer
              as_user_id: "qa-001"
          trigger:
            - call: "GET /batch-orders/${batch_id}/unit-accounting"
              as: QaReviewer
              as_user_id: "qa-001"
          assert:
            - "BatchOrder.${batch_id}.provisional_releasable_units == 8418"
            - "BatchOrder.${batch_id}.final_releasable_units == 8274"
            - "GET /batch-orders/${batch_id}/unit-accounting -> data.expected_reject_units == 22"
            - "GET /batch-orders/${batch_id}/unit-accounting -> data.actual_visual_reject_units == 166"
            - "GET /batch-orders/${batch_id}/unit-accounting -> data.destructive_total_units == 60"
            - "GET /batch-orders/${batch_id}/unit-accounting -> data.variant_delta_units == 144"
            - "BatchOrder.${batch_id}.provisional_releasable_units != BatchOrder.${batch_id}.final_releasable_units"
            - "BatchOrder.${batch_id}.production_status == FILLED and BatchOrder.${batch_id}.quality_status == QP_REVIEW"

      - name: project_readiness_intake_forecast_vs_gmp_audit_diverge
        grounds:
          - calculations.project_readiness_score
          - entities.ClientProject.fields.tech_transfer_stage
          - entities.ClientProject.fields.analytical_method_transfer_status
          - entities.FillingSuite.fields.media_fill_valid_until
          - entities.PersonnelQualification.fields.expires_on
          - state_machines.PersonnelQualification.status.QUALIFIED_to_LAPSED
        distinguishing_aspect: |
          A different entity domain from the unit-ledger instance: this dual variant lives on
          ClientProject readiness scoring, not on BatchOrder units, and its divergence is driven
          by clock-effectiveness rather than by projected-vs-actual reject counts —
          INTAKE_FORECAST grants full credit for in-flight artifacts and counts PENDING/LAPSED
          operators (30+25+25+20 == 100) while GMP_AUDIT applies the partial-credit stage table,
          scores an expired aseptic qualification at 10, and counts only the single operator whose
          status is QUALIFIED and whose expires_on >= the clock (15+12+10+10 == 47).
        test_recipe:
          setup:
            - "Clock initially 2026-09-01T00:00:00Z, then advanced to 2027-04-01T00:00:00Z."
            - "FillingSuite FS-1 grade B with a PASSED media fill read at 2026-09-01T00:00:00Z, so aseptic_qualification_status QUALIFIED and media_fill_valid_until 2027-03-03T00:00:00Z — already in the past once the clock moves to 2027-04-01."
            - "Three PersonnelQualifications in FS-1: OP-A QUALIFIED with expires_on 2027-12-01 (still effective), OP-B QUALIFIED with expires_on 2027-03-15 (auto-LAPSED by the clock advance), OP-C left PENDING."
            - "ClientProject 'Sponsor B' with primary_suite_id FS-1, tech_transfer_stage ENGINEERING_RUN, analytical_method_transfer_status IN_TRANSFER, status still INTAKE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B", "OP-C"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-12-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-B", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-03-15T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_b_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_b_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-C", suite_id: "${suite_id}", qualification_type: "GOWNING", expires_on: "2027-12-01T00:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { pq_c_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor B", molecule_name: "MOL-B", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "ENGINEERING_RUN", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /client-projects/${proj_id}/readiness-assessment"
              payload: { variant: "INTAKE_FORECAST" }
              as: ProgramManager
            - call: "GET /client-projects/${proj_id}/readiness-assessment"
              payload: { variant: "GMP_AUDIT" }
              as: QualifiedPerson
          assert:
            - "GET /client-projects/${proj_id}/readiness-assessment?variant=INTAKE_FORECAST -> data.readiness_score == 100"
            - "GET /client-projects/${proj_id}/readiness-assessment?variant=INTAKE_FORECAST -> data.tech_points == 30 and data.analytical_points == 25 and data.aseptic_points == 25 and data.operator_points == 20"
            - "GET /client-projects/${proj_id}/readiness-assessment?variant=INTAKE_FORECAST -> data.counted_operator_count == 3"
            - "GET /client-projects/${proj_id}/readiness-assessment?variant=GMP_AUDIT -> data.readiness_score == 47"
            - "GET /client-projects/${proj_id}/readiness-assessment?variant=GMP_AUDIT -> data.tech_points == 15 and data.analytical_points == 12 and data.aseptic_points == 10 and data.operator_points == 10"
            - "GET /client-projects/${proj_id}/readiness-assessment?variant=GMP_AUDIT -> data.counted_operator_count == 1"
            - "PersonnelQualification.${pq_b_id}.status == LAPSED"
            - "PersonnelQualification.${pq_a_id}.status == QUALIFIED"
            - "PersonnelQualification.${pq_c_id}.status == PENDING"
            - "FillingSuite.${suite_id}.media_fill_valid_until == 2027-03-03T00:00:00Z"

  - rule_id: combinatorial_formula
    instances:

      - name: em_excursion_risk_index_four_factor_interaction
        grounds:
          - calculations.em_excursion_risk_index
          - calculations.em_sample_limits
          - calculations.em_sample_classification
          - entities.EmSample.fields.risk_index
          - entities.FillingSuite.fields.grade
          - entities.BatchOrder.fields.production_status
        distinguishing_aspect: |
          Combinatorial mode (a): four independent inputs interact non-linearly inside nested
          min/max — the cfu/action_limit ratio, the grade multiplier, the sample-type surcharge and
          the state-conditional batch-exposure term — and the core term is capped at 100 and
          round-half-up'ed to an integer BEFORE the surcharges are added, so the total can exceed
          100. Three samples in the same grade-B suite with the same cfu_count of 20 yield 100
          (VIABLE_AIR, batch FILLING), 110 (SURFACE, core saturated at the cap then +10) and, at
          cfu 5, 65 (PERSONNEL_GLOVE, no batch link) — no single factor explains the spread.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-1 grade B, QUALIFIED with media_fill_valid_until 2027-03-03T00:00:00Z, cleaning validated for MOL-A, two QUALIFIED operators, posture OPEN."
            - "ClientProject 'Sponsor A' ACTIVE for MOL-A, dosage_form VIAL, reserved_unit_budget 30000."
            - "BatchOrder B-001 in FS-1 with production_status FILLING (components fully reserved, fill started)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-B", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_b_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_b_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /filling-suites/${suite_id}/cleaning-validation"
              payload: { molecule_name: "MOL-A", residue_ug_per_swab: 12 }
              as: MicrobiologyAnalyst
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "ENGINEERING_RUN", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "COMPLETE", analytical_method_transfer_status: "VALIDATED" }
              as: ProgramManager
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_vial_id: $.data.id }
            - call: "POST /component-lots/${lot_vial_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "STOPPER", lot_code: "ST-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_stop_id: $.data.id }
            - call: "POST /component-lots/${lot_stop_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { suite_v1: $.data.version }
            - call: "POST /batch-orders"
              payload: { client_project_id: "${proj_id}", suite_id: "${suite_id}", lead_operator_qualification_id: "${pq_a_id}", batch_number: "B-001", planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-10T16:00:00Z", target_fill_units: 10000, expected_suite_version: "${suite_v1}" }
              as: ProgramManager
              captures: { batch_id: $.data.id }
            - call: "GET /component-lots/${lot_vial_id}"
              as: ProgramManager
              captures: { lot_vial_v1: $.data.version }
            - call: "POST /component-reservations"
              payload: { batch_order_id: "${batch_id}", component_lot_id: "${lot_vial_id}", quantity_reserved: 10560, expected_component_lot_version: "${lot_vial_v1}" }
              as: ProgramManager
            - call: "GET /component-lots/${lot_stop_id}"
              as: ProgramManager
              captures: { lot_stop_v1: $.data.version }
            - call: "POST /component-reservations"
              payload: { batch_order_id: "${batch_id}", component_lot_id: "${lot_stop_id}", quantity_reserved: 11000, expected_component_lot_version: "${lot_stop_v1}" }
              as: ProgramManager
            - call: "POST /batch-orders/${batch_id}/setup"
              as: ProductionSupervisor
            - call: "POST /batch-orders/${batch_id}/start-fill"
              as: ProductionSupervisor
          trigger:
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_id}", sample_type: "VIABLE_AIR", cfu_count: 20, batch_order_id: "${batch_id}" }
              as: MicrobiologyAnalyst
              captures: { em_air_id: $.data.id }
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_id}", sample_type: "SURFACE", cfu_count: 20 }
              as: MicrobiologyAnalyst
              captures: { em_surf_id: $.data.id }
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_id}", sample_type: "PERSONNEL_GLOVE", cfu_count: 5 }
              as: MicrobiologyAnalyst
              captures: { em_glove_id: $.data.id }
          assert:
            - "EmSample.${em_air_id}.alert_limit == 5 and EmSample.${em_air_id}.action_limit == 10"
            - "EmSample.${em_air_id}.classification == ACTION"
            - "EmSample.${em_air_id}.risk_index == 100"
            - "EmSample.${em_surf_id}.alert_limit == 3 and EmSample.${em_surf_id}.action_limit == 5"
            - "EmSample.${em_surf_id}.risk_index == 110"
            - "EmSample.${em_glove_id}.alert_limit == 1 and EmSample.${em_glove_id}.action_limit == 5"
