              as: DistributorAdmin
              captures: { part_sd: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_sd}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_sd: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust SD", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_sd: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_sd}", lines: [ { part_id: "${part_sd}", quantity: 60, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_sd: $.data.id }
