          - state_machines.RemediationProject.APPROVED_to_CANCELLED
          - entities.GrantFund.fields.reserved_cents
        distinguishing_aspect: |
          Depth-3 chain from case withdraw: Case->WITHDRAWN voids the order
          (link1); the order VOID itself cancels the APPROVED project (link2);
          the project CANCELLED itself releases the grant reservation (link3).
          Each link is caused by the previous mutation, not by the withdraw call.
