              captures: { err_id: $.data.error_id }
          assert:
            - "status_code == 422"
            - "${err_id} == \"ERR_ADDRESS_PARITY_MISMATCH\"   # NOT ERR_ADDRESS_OUTSIDE_RANGE"
            - "201 would also be a valid RIGHT-side address, so the error is genuinely side-scoped"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 50 and assignable_slot_count_right == 50"

      - name: duplicate_address_check_skips_retired_points
        claim_type: conditional_validation
        grounds:
          - validations[priority=20]
          - errors.ERR_DUPLICATE_ADDRESS
        distinguishing_aspect: "The uniqueness key is only enforced against statuses IN {PENDING, ACTIVE}: re-creating 100 LEFT while the first point is PENDING is refused 409 ERR_DUPLICATE_ADDRESS, but after that point is RETIRED the very same address is accepted 201 — historical retention and address re-issue coexist."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a DRAFT centerline, LEFT [100,198] EVEN."
            - "One PARCEL point at 100 LEFT (PENDING)."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { dup_err: $.data.error_id }
            - call: "POST /gis/address-points/${p1_id}/retire"
              payload: { retire_reason: "Structure demolished" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "POSTAL", postal_city: "FORT COLLINS", cell_id: "${cell_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { p2_id: $.data.id }
          assert:
            - "the first re-create returns status_code 409 with ${dup_err} == \"ERR_DUPLICATE_ADDRESS\""
            - "AddressPoint.${p1_id}.status == \"RETIRED\" after the retire, retired_at == \"2026-08-01T00:00:00.000Z\""
            - "the post-retirement re-create returns status_code 201"
            - "AddressPoint.${p2_id}.house_number == 100 and side == \"LEFT\" and status == \"PENDING\""
            - "AddressPoint.${p2_id}.id != \"${p1_id}\"   # a new record, the old one is kept for records research"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 49   # 50 -> 49 -> 50 -> 49"
            - "GET /gis/address-points with road_centerline_id ${road_id} and include_retired true returns meta.total_count == 2"

      - name: subaddress_shape_inconsistencies_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=12]
          - errors.ERR_SUBADDRESS_PARENT_INVALID
        distinguishing_aspect: "Every arm of the subaddress shape rule answers the same 422 ERR_SUBADDRESS_PARENT_INVALID: a unit whose house_number differs from its parent's, a unit whose side differs from its parent's, and a unit whose parent is itself a unit (no nesting) — all while a correctly shaped unit under the same parent succeeds."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a DRAFT centerline, LEFT [100,198] EVEN, RIGHT [101,199] ODD."
            - "Base point B at 100 LEFT, and one valid unit U1 under B."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
