      - name: triage_call_reassessment_cycle_returns_dispositioned_to_assessing_twice
        grounds:
          - state_machines.TriageCall.DISPOSITIONED_to_ASSESSING
          - entities.ProtocolAssessment.fields.status
          - state_machines.Disposition.AUTHORIZED_to_VOIDED
          - state_machines.CallbackTask.PENDING_to_CANCELLED
          - endpoints[POST /triage-calls/{id}/assessments]
        distinguishing_aspect: "The call re-enters ASSESSING from DISPOSITIONED twice on the same aggregate, and each re-entry must supersede the previous assessment, void the previous disposition and cancel its callback — so after three assessments exactly one assessment is ACTIVE, one disposition is AUTHORIZED, one callback is PENDING, and the practice's open_callback_count is 1 rather than 3."
