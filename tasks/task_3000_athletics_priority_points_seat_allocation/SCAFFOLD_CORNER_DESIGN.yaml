              payload: { new_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 409 with error.code == \"ERR_INVALID_STATE\""
            - "Gift.${pg_id}.gift_status == \"REFUNDED\" and Gift.${pg_id}.version == 2"
            - "Gift.${pg_id}.settled_at == null (the PLEDGED -> REFUNDED edge never settled the gift)"
