# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_2302
# All money literals below were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: imputed_taxable_method_pinned_per_record_diverges_by_2000
        grounds:
          - calculations.imputed_income_accrual
          - entities.ImputedIncomeRecord.fields.method
          - entities.Employee.fields.tax_treatment_flag
          - state_machines.Order.CONFIRMED_to_DELIVERED
        distinguishing_aspect: |
          The variant lives in the TAX domain on ImputedIncomeRecord/Employee: two employees of the
          same program, identical 2500-cent employer shares, produce taxable_cents 500 under the
          DE_MINIMIS_EXCLUSION record and 2500 under the FULL_INCLUSION record, because the method
          is pinned at record creation and the program was switched between the two deliveries.
        test_recipe:
          setup:
            - "Program with taxable_benefit_method DE_MINIMIS_EXCLUSION, cuisines THAI/SALAD/PIZZA, radius 8.0."
            - "Engineering group with an ACTIVE rule: cap 2500, allocation 50000, weekdays 1-5, window 660-840, PERSONAL_CARD, EMPLOYEE_PAYS_TIP."
            - "Ada and Ben both enrolled with a personal card and an OPEN 2026-08 period of 50000 allocated cents."
            - "Ada's order (3 x 1000 cents, tip 200) is delivered while the program is still DE_MINIMIS_EXCLUSION."
            - "The program is then switched to FULL_INCLUSION before Ben's identical order is delivered."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0, taxable_benefit_method: "DE_MINIMIS_EXCLUSION", rollover_policy: "CAPPED_PCT", rollover_cap_pct: 0.25, forecast_basis: "COMMITMENT" }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "PATCH /meal-programs/${prog_id}", payload: { taxable_benefit_method: "FULL_INCLUSION" }, as: PlatformAdmin }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ben Lovelace", email: "ben@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ben_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ben_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ben_id: $.data.id, per_ben_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ben_id}", benefit_period_id: "${per_ben_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-04T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ben_id}", captures: { ord2_id: $.data.id } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_ben_v}" }, as: Employee, as_user_id: "${emp_ben_id}" }
            - { call: "POST /orders/${ord2_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
          trigger:
            - { call: "POST /orders/${ord2_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "GET /employees/${emp_ada_id}/imputed-income-records", as: BenefitsController }
            - { call: "GET /employees/${emp_ben_id}/imputed-income-records", as: BenefitsController }
          assert:
            - "Order.${ord1_id}.employer_covered_cents == 2500 and Order.${ord2_id}.employer_covered_cents == 2500"
            - "Ada's ImputedIncomeRecord for 2026-08 has method == DE_MINIMIS_EXCLUSION, gross_employer_paid_cents == 2500, taxable_cents == 500"
            - "Ben's ImputedIncomeRecord for 2026-08 has method == FULL_INCLUSION, gross_employer_paid_cents == 2500, taxable_cents == 2500"
            - "the two taxable_cents values differ by exactly 2000 on identical order inputs"
            - "Employee.${emp_ada_id}.ytd_imputed_cents == 500 and tax_treatment_flag == NONE"
            - "Employee.${emp_ben_id}.ytd_imputed_cents == 2500 and tax_treatment_flag == W2_IMPUTED"

      - name: forecast_basis_commitment_vs_run_rate_diverges_82500_to_8750
        grounds:
          - calculations.program_cost_forecast
          - entities.MealProgram.fields.forecast_basis
          - entities.EmployeeGroup.fields.headcount_planned
          - entities.BudgetRule.fields.eligible_weekdays
        distinguishing_aspect: |
          The variant lives in the PROGRAM FORECAST domain on MealProgram, not in the tax domain:
          with the clock on 2026-08-10 and 2500 cents already spent, COMMITMENT returns
          forecast_total_cents 82500 while RUN_RATE returns 8750 from the same stored data.
        test_recipe:
          setup:
            - "Same program / Engineering group / Ada fixture as the previous instance, forecast_basis COMMITMENT."
            - "Ada's 3 x 1000 order is delivered, so MealProgram.program_spent_cents == 2500 and mtd_employer_captured_cents == 2500."
            - "The logical clock is then advanced to 2026-08-10T00:00:00Z: 16 remaining and 6 elapsed Mon-Fri days, 21 in the month."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0, taxable_benefit_method: "DE_MINIMIS_EXCLUSION", rollover_policy: "CAPPED_PCT", rollover_cap_pct: 0.25, forecast_basis: "COMMITMENT" }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /meal-programs/${prog_id}/forecast", as: BenefitsController }
            - { call: "PATCH /meal-programs/${prog_id}", payload: { forecast_basis: "RUN_RATE" }, as: PlatformAdmin }
            - { call: "GET /meal-programs/${prog_id}/forecast", as: BenefitsController }
          assert:
            - "first forecast response has forecast_basis == COMMITMENT, remaining_eligible_days == 16, elapsed_eligible_days == 6, total_eligible_days == 21, active_rule_group_count == 1"
            - "first forecast response has forecast_total_cents == 82500 and forecast_admin_fee_cents == 4125"
            - "second forecast response has forecast_basis == RUN_RATE, forecast_total_cents == 8750 and forecast_admin_fee_cents == 438"
            - "the two forecast_total_cents values differ (82500 != 8750) from identical stored data"
            - "MealProgram.${prog_id}.program_spent_cents == 2500 in both responses' underlying state"

      - name: refund_routing_employee_first_vs_proportional_1000_vs_427
        grounds:
          - calculations.refund_routing_waterfall
          - entities.CreditClaim.fields.routing_basis
          - state_machines.CreditClaim.SUBMITTED_to_ROUTED_EMPLOYEE_FIRST
          - state_machines.CreditClaim.SUBMITTED_to_ROUTED_PROPORTIONAL
        distinguishing_aspect: |
          The variant lives in the REFUND-ROUTING domain on CreditClaim: on two identical delivered
          orders (employee_card 1863, employer_covered 2500, gross 4363) an approved 1000-cent credit
          routes 1000/0 under EMPLOYEE_FIRST and 427/573 under PROPORTIONAL.
        test_recipe:
          setup:
            - "Program / Engineering group / HQ dock / Thai Garden as in the first instance."
            - "Ada and Ben each have a delivered 3 x 1000 order with tip 200: subtotal 3000, tax 264, delivery 599, service 300, covered_base 4163, employer_covered 2500, employee_card 1863, gross_total 4363."
            - "Each employee raises a MISSING_ITEM claim for line index 0 claiming 1000 cents (line base 1000 + line tax 88 = 1088, so within the line ceiling)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0, taxable_benefit_method: "DE_MINIMIS_EXCLUSION", rollover_policy: "CAPPED_PCT", rollover_cap_pct: 0.25, forecast_basis: "COMMITMENT" }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ben Lovelace", email: "ben@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ben_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ben_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ben_id: $.data.id, per_ben_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord1_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord1_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}", captures: { ord1_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ben_id}", benefit_period_id: "${per_ben_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ben_id}", captures: { ord2_id: $.data.id } }
            - { call: "POST /orders/${ord2_id}/place", payload: { expected_benefit_period_version: "${per_ben_v}" }, as: Employee, as_user_id: "${emp_ben_id}" }
            - { call: "POST /orders/${ord2_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders/${ord2_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}", captures: { ord2_v: $.data.version } }
            - { call: "POST /credit-claims", payload: { order_id: "${ord1_id}", claim_type: "MISSING_ITEM", claimed_cents: 1000, line_index: 0 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { clm1_id: $.data.id } }
            - { call: "POST /credit-claims", payload: { order_id: "${ord2_id}", claim_type: "MISSING_ITEM", claimed_cents: 1000, line_index: 0 }, as: Employee, as_user_id: "${emp_ben_id}", captures: { clm2_id: $.data.id } }
          trigger:
            - { call: "POST /credit-claims/${clm1_id}/resolve", payload: { decision: "APPROVE", approved_cents: 1000, routing_basis: "EMPLOYEE_FIRST", expected_order_version: "${ord1_v}" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
            - { call: "POST /credit-claims/${clm2_id}/resolve", payload: { decision: "APPROVE", approved_cents: 1000, routing_basis: "PROPORTIONAL", expected_order_version: "${ord2_v}" }, as: BenefitsController, as_user_id: "ctrl-resolver" }
          assert:
            - "CreditClaim.${clm1_id}.status == ROUTED_EMPLOYEE_FIRST, employee_refund_cents == 1000, employer_credit_cents == 0"
            - "CreditClaim.${clm2_id}.status == ROUTED_PROPORTIONAL, employee_refund_cents == 427, employer_credit_cents == 573"
            - "employee_refund_cents + employer_credit_cents == 1000 for both claims"
            - "the two employee_refund_cents values differ (1000 != 427) on identical order inputs"
            - "no RefundLedgerEntry exists yet for either order because resolve does not move money"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: per_line_tax_rounding_then_sum_yields_264_not_263
        grounds:
          - calculations.order_line_tax_subtotal
          - entities.Order.fields.lines
          - entities.Order.fields.tax_cents
        distinguishing_aspect: |
          Pinned EVALUATION ORDER: three 1000-cent lines each round to 88 and sum to tax_cents 264,
          whereas rounding the 3000-cent aggregate once would give 263, so the order of rounding and
          summation is directly observable.
        test_recipe:
          setup:
            - "Program / Engineering group / HQ dock / Thai Garden / Ada with an OPEN 2026-08 period."
            - "A DRAFT order with exactly three lines of unit_price_cents 1000, quantity 1, tip 200."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord1_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${ord1_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
          assert:
            - "Order.${ord1_id}.subtotal_cents == 3000"
            - "Order.${ord1_id}.tax_cents == 264"
            - "Order.${ord1_id}.tax_cents != 263 (the sum-then-round result is rejected)"
            - "Order.${ord1_id}.delivery_fee_cents == 599 because subtotal 3000 < FREE_DELIVERY_THRESHOLD_CENTS 3500"
