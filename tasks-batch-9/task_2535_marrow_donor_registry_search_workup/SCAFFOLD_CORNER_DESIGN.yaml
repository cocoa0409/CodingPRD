          The DEFER branch is refused twice before it is accepted - once for the wrong deferral_type and
          once for a deferral_until that is not in the future - and only the accepted call performs the
          whole action: candidate DEFERRED, donor TEMPORARILY_DEFERRED, and an ACTIVE DEFERRAL window
          spanning the CURRENT logical date through deferral_until, whose closed inclusive day_count is 46.
          A rejected action must leave the donor AVAILABLE with an empty calendar.
