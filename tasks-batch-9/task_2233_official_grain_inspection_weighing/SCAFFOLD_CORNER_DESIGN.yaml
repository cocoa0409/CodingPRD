              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Export Elevators", account_code: "EXP-114", contact_email: "ops@export.example" }
              captures: { app: "$.data.id" }
