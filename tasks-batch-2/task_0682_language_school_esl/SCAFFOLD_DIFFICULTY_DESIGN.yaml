scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_chronological_schedule_differs_from_prorata_on_enrollment
        grounds:
          - calculations.withdrawal_refund
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.Enrollment.fields.refund_cents
        distinguishing_aspect: "On the Enrollment domain, the AUTHORITATIVE chronological tiered schedule yields refund_cents=135000 (week2,0.50) while the rejected forward-looking prorata variant (which would prorate by remaining sessions) computes a different cents value for the same withdrawal — the authoritative refund depends only on calendar weeks_elapsed, never on sessions."
        test_recipe:
          setup:
            - "A GOLD corporate contract sponsors a student; student placed B1/GENERAL, confirmed ENROLLED into a B1/GENERAL cohort base_tuition 300000 with a PRIVATE_TUTORING add-on (units 5, fee 30000) -> tuition_invoice_cents 270000."
            - "term_start 2026-05-04; clock advanced to 2026-05-19 (weeks_elapsed = 2 since term_start, schedule_pct 0.50)."
          setup_api_calls:
            - call: "POST /corporate-contracts"
              payload: { company_name: "Acme", contracted_seats: 5, discount_tier: "GOLD" }
              as: Registrar
              captures: { contract_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S One", email: "s1@x.com", track: "GENERAL", corporate_contract_id: "${contract_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-Gen", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 300000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /add-ons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", add_on_type: "PRIVATE_TUTORING", units: 5 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
              captures: { inv: $.data.tuition_invoice_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-19T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: Registrar
              captures: { refund: $.data.refund_cents }
          assert:
            - "Enrollment.${enr_id}.tuition_invoice_cents == 270000"
            - "Enrollment.${enr_id}.refund_cents == 135000   # chronological week-2 schedule 0.50 * 270000"
            - "Enrollment.${enr_id}.status == WITHDRAWN"

      - name: certification_provisional_vs_certified_rollup_on_student
        grounds:
          - calculations.certification_rollup
          - state_machines.Enrollment.ENROLLED_to_COMPLETED
          - entities.Student.fields.certification_status
          - entities.Student.fields.final_progress_score
        distinguishing_aspect: "On the Student domain (different from refund's Enrollment domain), one COMPLETED enrollment yields certification_status PROVISIONAL (final_progress_score 87), while the SAME data plus a second qualifying completion flips to CERTIFIED with final_progress_score 83 — provisional and certified are two algorithms over the same completed set."
        test_recipe:
          setup:
            - "Self-pay student placed B1/GENERAL; two cohorts (terms already ended via clock advance), each with >=1 progress report and full attendance, completed in sequence."
            - "First completion alone -> PROVISIONAL (count 1); after second completion -> CERTIFIED (count 2, mean 79 >= 70)."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "S Cert", email: "scert@x.com", track: "GENERAL" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-A", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-04-01T00:00:00Z", term_end: "2026-04-10T00:00:00Z", total_sessions: 10, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_a: $.data.id, cohort_a_v: $.data.version }
            - call: "POST /cohorts"
              payload: { name: "B1-B", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 9, term_start: "2026-04-01T00:00:00Z", term_end: "2026-04-10T00:00:00Z", total_sessions: 10, base_tuition_cents: 100000, schedule_block: "AFTERNOON" }
              as: Registrar
              captures: { cohort_b: $.data.id, cohort_b_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_a}" }
              as: Registrar
              captures: { enr_a: $.data.id }
            - call: "POST /enrollments/${enr_a}/confirm"
              payload: { expected_cohort_version: "${cohort_a_v}", require_seat: true }
              as: Registrar
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_b}" }
              as: Registrar
              captures: { enr_b: $.data.id }
            - call: "POST /enrollments/${enr_b}/confirm"
              payload: { expected_cohort_version: "${cohort_b_v}", require_seat: true }
              as: Registrar
            - call: "POST /attendance"
              payload: { enrollment_id: "${enr_a}", session_index: 1, status: "PRESENT" }
              as: Instructor
            - call: "POST /attendance"
              payload: { enrollment_id: "${enr_b}", session_index: 1, status: "PRESENT" }
              as: Instructor
            - call: "POST /progress-reports"
              payload: { enrollment_id: "${enr_a}", speaking: 80, listening: 82, reading: 78, writing: 84 }
              as: Instructor
            - call: "POST /progress-reports"
              payload: { enrollment_id: "${enr_b}", speaking: 70, listening: 70, reading: 70, writing: 70 }
              as: Instructor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: Registrar
            - call: "POST /enrollments/${enr_a}/complete"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_b}/complete"
              payload: {}
              as: Registrar
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { cert: $.data.certification_status, fps: $.data.final_progress_score }
          assert:
            - "Student.${stu_id}.certification_status == CERTIFIED"
            - "Student.${stu_id}.final_progress_score == 83   # mean of completion_score 87 and 79 -> rhu(83.0)=83"
            - "Enrollment.${enr_a}.completion_score == 87   # skills avg 81 (0.7) + attendance 100 (0.3) -> round(86.7)"
            - "Enrollment.${enr_b}.completion_score == 79   # skills avg 70 (0.7) + attendance 100 (0.3) -> round(79.0)"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tuition_invoice_pinned_evaluation_order_mode_c
        grounds:
          - calculations.tuition_invoice
          - calculations.addon_fee
          - state_machines.Enrollment.PLACEMENT_PENDING_to_ENROLLED
          - entities.Enrollment.fields.tuition_invoice_cents
        distinguishing_aspect: "MODE (c): discount is keyed off the base-tuition tier but the net total also folds in non-discounted add-ons; pinning discount=rhu(base*0.20) on base ALONE (Step 4) before subtracting from gross yields 270000, whereas discounting the gross would give 264000 — evaluation order is load-bearing."
        test_recipe:
          setup:
            - "GOLD contract; student B1/GENERAL confirmed ENROLLED into a base_tuition 300000 cohort with a PRIVATE_TUTORING add-on units 5 (fee 30000)."
          setup_api_calls:
            - call: "POST /corporate-contracts"
              payload: { company_name: "Acme2", contracted_seats: 3, discount_tier: "GOLD" }
              as: Registrar
              captures: { contract_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S G", email: "sg@x.com", track: "GENERAL", corporate_contract_id: "${contract_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-G", level: "B1", track: "GENERAL", capacity: 3, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 300000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /add-ons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", add_on_type: "PRIVATE_TUTORING", units: 5 }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
              captures: { inv: $.data.tuition_invoice_cents }
          assert:
            - "Enrollment.${enr_id}.tuition_invoice_cents == 270000   # gross 330000 - rhu(300000*0.20)=60000"
            - "Enrollment.${enr_id}.tuition_invoice_cents != 264000   # discounting the gross is the wrong order"

      - name: immersion_addon_fee_nonlinear_surcharge_mode_a
        grounds:
          - calculations.addon_fee
          - state_machines.AddOnSubscription.transitions
          - entities.AddOnSubscription.fields.fee_cents
        distinguishing_aspect: "MODE (a): addon_fee has 3 inputs (type, units, the units>2 surcharge branch) with non-linear interaction — IMMERSION_ABROAD units 4 = 160000 base + rhu(40000*2*0.15)=12000 surcharge = 172000, not the linear 160000."
        test_recipe:
          setup:
            - "Self-pay student B1/GENERAL with a PLACEMENT_PENDING enrollment; subscribes IMMERSION_ABROAD add-on units 4 bundled on it."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "S Imm", email: "simm@x.com", track: "GENERAL" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-I", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 300000, schedule_block: "EVENING" }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /add-ons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", add_on_type: "IMMERSION_ABROAD", units: 4 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { fee: $.data.fee_cents }
          assert:
            - "AddOnSubscription.fee_cents == 172000   # 160000 base + 12000 surcharge"
            - "AddOnSubscription.fee_cents != 160000   # linear (no-surcharge) result rejected"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_confirm_forks_enrolled_vs_waitlisted
        grounds:
          - state_machines.Enrollment.PLACEMENT_PENDING_to_ENROLLED
          - state_machines.Enrollment.PLACEMENT_PENDING_to_WAITLISTED
          - entities.Cohort.fields.seats_taken
        distinguishing_aspect: "Branching fork-join on Enrollment: confirm from PLACEMENT_PENDING diverges to ENROLLED (seat consumed, tuition computed) when capacity remains, vs WAITLISTED (no seat, no tuition) when full — divergent side-effect sets per branch."
        test_recipe:
          setup:
            - "A capacity-1 B1/GENERAL cohort; first student confirmed ENROLLED filling the seat; a second B1/GENERAL student's confirm must fork to WAITLISTED."
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "B1-Cap1", level: "B1", track: "GENERAL", capacity: 1, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v0: $.data.version }
            - call: "POST /students"
              payload: { full_name: "S A", email: "sa@x.com", track: "GENERAL" }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_a}" }
              as: Registrar
              captures: { pt_a: $.data.id }
            - call: "POST /placement-tests/${pt_a}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${stu_a}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_a: $.data.id }
            - call: "POST /enrollments/${enr_a}/confirm"
              payload: { expected_cohort_version: "${cohort_v0}", require_seat: true }
              as: Registrar
            - call: "GET /cohorts/${cohort_id}"
              payload: {}
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students"
              payload: { full_name: "S B", email: "sb@x.com", track: "GENERAL" }
              as: Registrar
              captures: { stu_b: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_b}" }
              as: Registrar
              captures: { pt_b: $.data.id }
            - call: "POST /placement-tests/${pt_b}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${stu_b}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_b: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_b}/confirm"
              payload: { expected_cohort_version: "${cohort_v1}" }
              as: Registrar
              captures: { st_b: $.data.status }
          assert:
            - "Enrollment.${enr_a}.status == ENROLLED"
            - "Enrollment.${enr_b}.status == WAITLISTED"
            - "Enrollment.${enr_b}.tuition_invoice_cents == 0   # no tuition on waitlist branch"
            - "Cohort.${cohort_id}.seats_taken == 1"

      - name: student_visa_status_active_probation_active_cycle
        grounds:
          - state_machines.Student.ACTIVE_to_PROBATION
          - state_machines.Student.PROBATION_to_ACTIVE
          - entities.Student.fields.visa_status
        distinguishing_aspect: "Revision cycle on the Student entity: visa_status ACTIVE -> PROBATION -> ACTIVE returns to a prior state (a true cycle), distinct from Enrollment's fork — proving non-linear shape on a second entity."
        test_recipe:
          setup:
            - "International student with I-20 issued and ACTIVE status (full course load via a single 18h ENROLLED cohort), then placed on probation and cleared back to ACTIVE."
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Intl Cyc", email: "icyc@x.com", track: "GENERAL", is_international: true }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /students/${stu_id}/issue-i20"
              payload: { reason: "admitted" }
              as: DSO
            - call: "POST /cohorts"
              payload: { name: "B1-18h", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
            - call: "POST /students/${stu_id}/activate-status"
              payload: { reason: "full course met" }
              as: DSO
            - call: "POST /students/${stu_id}/place-probation"
              payload: { reason: "low engagement" }
              as: DSO
          trigger:
            - call: "POST /students/${stu_id}/clear-probation"
              payload: { reason: "remediated" }
              as: DSO
              captures: { vs: $.data.visa_status }
          assert:
            - "Student.${stu_id}.visa_status == ACTIVE   # returned to ACTIVE after the cycle"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: contract_close_cascade_depth3_terminate_release_void
        grounds:
          - state_machines.CorporateContract.ACTIVE_to_CLOSED
          - state_machines.Enrollment.ENROLLED_to_TERMINATED
          - entities.Cohort.fields.seats_taken
          - entities.CorporateContract.fields.seats_consumed
        distinguishing_aspect: "Depth>=3 from contract.close: close -> terminate sponsored Enrollment (CONTRACT_REVOKED) -> that termination releases Cohort.seats_taken AND draws down CorporateContract.seats_consumed; each link is caused by the previous, not by close directly."
        test_recipe:
          setup:
            - "ACTIVE contract (2 seats) sponsoring one student confirmed ENROLLED into a B1/GENERAL cohort (seats_taken 1, contract seats_consumed 1)."
          setup_api_calls:
            - call: "POST /corporate-contracts"
              payload: { company_name: "Casc", contracted_seats: 2, discount_tier: "BRONZE" }
              as: Registrar
              captures: { contract_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "S Casc", email: "scasc@x.com", track: "GENERAL", corporate_contract_id: "${contract_id}" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_id}" }
              as: Registrar
              captures: { pt_id: $.data.id }
            - call: "POST /placement-tests/${pt_id}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /cohorts"
              payload: { name: "B1-Casc", level: "B1", track: "GENERAL", capacity: 5, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/confirm"
              payload: { expected_cohort_version: "${cohort_v}", require_seat: true }
              as: Registrar
            - call: "GET /corporate-contracts/${contract_id}"
              payload: {}
              as: Registrar
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /corporate-contracts/${contract_id}/close"
              payload: { expected_contract_version: "${contract_v}" }
              as: Registrar
          assert:
            - "CorporateContract.${contract_id}.status == CLOSED"
            - "Enrollment.${enr_id}.status == TERMINATED"
            - "Enrollment.${enr_id}.termination_reason == CONTRACT_REVOKED"
            - "Cohort.${cohort_id}.seats_taken == 0   # released by the cascaded termination"
            - "CorporateContract.${contract_id}.seats_consumed == 0   # drawn down by the cascaded termination"

      - name: withdraw_cascade_depth2_seat_release_promotes_waitlist
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - state_machines.Enrollment.WAITLISTED_to_ENROLLED
          - entities.Enrollment.fields.enrolled_at
        distinguishing_aspect: "Depth>=2 from a DIFFERENT trigger (withdraw): withdraw of the seat-holder -> frees the Cohort seat -> that freeing promotes the earliest WAITLISTED enrollment to ENROLLED (its enrolled_at gets stamped); the promotion is caused by the seat-release link, not by withdraw directly."
        test_recipe:
          setup:
            - "Capacity-1 B1/GENERAL cohort: student A ENROLLED (seat filled), student B WAITLISTED behind."
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "B1-Promo", level: "B1", track: "GENERAL", capacity: 1, weekly_hours: 18, term_start: "2026-05-04T00:00:00Z", term_end: "2026-08-01T00:00:00Z", total_sessions: 40, base_tuition_cents: 100000, schedule_block: "MORNING" }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v0: $.data.version }
            - call: "POST /students"
              payload: { full_name: "S PA", email: "spa@x.com", track: "GENERAL" }
              as: Registrar
              captures: { stu_a: $.data.id }
            - call: "POST /placement-tests"
              payload: { student_id: "${stu_a}" }
              as: Registrar
              captures: { pt_a: $.data.id }
            - call: "POST /placement-tests/${pt_a}/score"
              payload: { raw_score: 50 }
              as: Instructor
            - call: "POST /enrollments"
              payload: { student_id: "${stu_a}", cohort_id: "${cohort_id}" }
              as: Registrar
              captures: { enr_a: $.data.id }
            - call: "POST /enrollments/${enr_a}/confirm"
              payload: { expected_cohort_version: "${cohort_v0}", require_seat: true }
              as: Registrar
            - call: "GET /cohorts/${cohort_id}"
              payload: {}
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students"
