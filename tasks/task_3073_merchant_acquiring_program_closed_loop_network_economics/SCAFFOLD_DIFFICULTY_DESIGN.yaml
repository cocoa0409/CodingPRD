              as: NetworkSettlementOps
              captures: { s_d1: $.data.id }
            - call: "POST /network/merchants/${m_d3}/mark-dormant"
              payload: {}
              as: NetworkAcquirer
          trigger:
            - call: "POST /network/merchants/${m_d3}/funding/batches/1/finalize"
              payload: {}
              as: NetworkSettlementOps
              captures: { err_dep3: $.data.error_id }
          assert:
            - "the finalize call is rejected with ERR_INVALID_STATE because the merchant is DORMANT, not ACTIVE"
            - "Settlement.${s_d1}.settlement_status == CAPTURED — the settlement was not funded"
            - "Settlement.${s_d1}.final_discount_fee_cents == 0 and finalized_at_batch_seq == 0"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics/entities)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: acceptance_gap_windows_merge_on_partial_overlap
        grounds:
          - calculations.acceptance_gap_window
          - endpoints.POST_/network/acceptance-gaps/rollup
          - entities.AcceptanceGap.fields.window_days
        distinguishing_aspect: "Interval semantics = partial-overlap MERGE on AcceptanceGap: a 30-day window beginning 11 days into a prior 30-day window merges into it, while one beginning exactly 30 days after merges not (strictly-before boundary)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One MEDIUM USD category in region US-NE."
            - "A 30-day gap window 2026-08-01..2026-08-31 already rolled up."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_ovl: $.data.id }
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_ovl}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-31T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
              captures: { gap_ovl1: $.data.id }
          trigger:
            - call: "POST /network/acceptance-gaps/rollup"
              payload: { region_code: "US-NE", industry_category_id: "${ic_ovl}", window_start: "2026-08-12T00:00:00Z", window_end: "2026-09-11T00:00:00Z", window_days: 30 }
              as: NetworkAcquirer
          assert:
            - "the partially-overlapping second window merges into the first: GET /network/acceptance-gaps?region_code=US-NE returns exactly one row"
            - "the surviving window spans window_start 2026-08-01T00:00:00Z and window_end 2026-09-11T00:00:00Z"
            - "a window starting exactly 30 days after (2026-08-31T00:00:00Z) would NOT merge and would appear as a second row"

      - name: offer_live_windows_reject_on_buffer_overlap
        grounds:
          - entities.Offer.fields.live_start_utc
          - entities.Offer.fields.live_end_utc
          - validations[priority=11]
        distinguishing_aspect: "Interval semantics = BUFFERED REJECTION on Offer: a second live window funded by the same merchant is rejected when it comes within one day of an existing live window (a buffer rule), rather than merged — a different interval treatment on a different resource."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant, an active card member with trailing spend 100000, and one offer already LIVE for 2026-09-10..2026-09-20."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_ovl2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_ovl2}", merchant_name: "Overlap Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_ovl: $.data.id, m_ovl_v: $.data.version }
            - call: "POST /network/merchants/${m_ovl}/accept"
              payload: { expected_merchant_version: "${m_ovl_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_ovl}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Overlap", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_ovl: $.data.id }
            - call: "POST /network/cardmembers/${cm_ovl}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/cardmembers/${cm_ovl}/set-monthly-spend"
              payload: { trailing_lowest_month_spend_cents: 100000 }
              as: NetworkIssuer
            - call: "POST /network/offers"
              payload: { merchant_id: "${m_ovl}", audience_segment: "HIGH_SPEND", min_segment_spend_cents: 10000, reward_bps: 1000 }
              as: NetworkDataSteward
              captures: { off_ovl1: $.data.id, off_ovl1_v: $.data.version }
            - call: "POST /network/offers/${off_ovl1}/submit-review"
              payload: {}
              as: NetworkDataSteward
            - call: "POST /network/offers/${off_ovl1}/request-consent"
              payload: {}
              as: NetworkDataSteward
              captures: { off_ovl1_v2: $.data.version }
            - call: "POST /network/offers/${off_ovl1}/consent"
              payload: { expected_offer_version: "${off_ovl1_v2}", live_start_utc: "2026-09-10T00:00:00Z", live_end_utc: "2026-09-20T00:00:00Z" }
              as: Merchant
              as_user_id: "${m_ovl}"
            - call: "POST /network/offers"
              payload: { merchant_id: "${m_ovl}", audience_segment: "HIGH_SPEND", min_segment_spend_cents: 10000, reward_bps: 1000 }
              as: NetworkDataSteward
              captures: { off_ovl2: $.data.id, off_ovl2_v: $.data.version }
            - call: "POST /network/offers/${off_ovl2}/submit-review"
              payload: {}
              as: NetworkDataSteward
            - call: "POST /network/offers/${off_ovl2}/request-consent"
              payload: {}
              as: NetworkDataSteward
              captures: { off_ovl2_v2: $.data.version }
          trigger:
            - call: "POST /network/offers/${off_ovl2}/consent"
              payload: { expected_offer_version: "${off_ovl2_v2}", live_start_utc: "2026-09-21T00:00:00Z", live_end_utc: "2026-09-30T00:00:00Z" }
              as: Merchant
              as_user_id: "${m_ovl}"
              captures: { err_ovl: $.data.error_id }
          assert:
            - "the response is rejected with ERR_TEMPORAL_OVERLAP because 2026-09-21 is within one day of the existing live window's 2026-09-20 end (buffer rule)"
            - "Offer.${off_ovl2}.privacy_state == MERCHANT_CONSENT — the buffered offer did not go LIVE"
            - "a start of 2026-09-22T00:00:00Z (two days clear) would succeed and set privacy_state == LIVE"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: offer_redemption_pool_balance_invariant
        grounds:
          - calculations.offer_acceptance_payout
          - entities.OfferRedemptionPool.fields.consumed_total_cents
          - endpoints.POST_/network/offer-acceptances/{acceptance_id}/reverse
        distinguishing_aspect: "Conserved quantity = the funded offer-redemption pool balance: an approve followed by a full reverse restores consumed_total_cents and balance_cents exactly, so an accept/approve/reverse cycle leaves pool drift at zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An ACTIVE merchant, a LIVE offer with reward_bps 1000, an active card member with trailing spend 100000, and a funded pool of 500000 cents."
            - "One acceptance accepted and approved; the pool has been debited."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "MEDIUM", base_discount_rate_bps: 250, high_risk_flag: false }
              as: NetworkAcquirer
              captures: { ic_cmp: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_cmp}", merchant_name: "Compensation Merchant", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_cmp: $.data.id, m_cmp_v: $.data.version }
            - call: "POST /network/merchants/${m_cmp}/accept"
              payload: { expected_merchant_version: "${m_cmp_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_cmp}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Compensation", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_cmp: $.data.id }
            - call: "POST /network/cardmembers/${cm_cmp}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/cardmembers/${cm_cmp}/set-monthly-spend"
              payload: { trailing_lowest_month_spend_cents: 100000 }
              as: NetworkIssuer
            - call: "POST /network/offers"
              payload: { merchant_id: "${m_cmp}", audience_segment: "HIGH_SPEND", min_segment_spend_cents: 10000, reward_bps: 1000 }
              as: NetworkDataSteward
              captures: { off_cmp: $.data.id, off_cmp_v: $.data.version }
            - call: "POST /network/offers/${off_cmp}/redemption-pool"
              payload: { funder: "MERCHANT", initial_funded_cents: 500000 }
              as: NetworkDataSteward
            - call: "POST /network/offers/${off_cmp}/submit-review"
              payload: {}
              as: NetworkDataSteward
            - call: "POST /network/offers/${off_cmp}/request-consent"
              payload: {}
              as: NetworkDataSteward
              captures: { off_cmp_v2: $.data.version }
            - call: "POST /network/offers/${off_cmp}/consent"
              payload: { expected_offer_version: "${off_cmp_v2}" }
              as: Merchant
              as_user_id: "${m_cmp}"
            - call: "POST /network/offers/${off_cmp}/accept"
              payload: { cardmember_id: "${cm_cmp}", trigger_amount_cents: 100000 }
              as: CardMember
              as_user_id: "${cm_cmp}"
              captures: { acc_cmp: $.data.id }
            - call: "POST /network/offer-acceptances/${acc_cmp}/approve"
              payload: {}
              as: NetworkDataSteward
          trigger:
            - call: "POST /network/offer-acceptances/${acc_cmp}/reverse"
              payload: {}
              as: NetworkDataSteward
          assert:
            - "OfferAcceptance.${acc_cmp}.acceptance_status == REVERSED"
            - "OfferRedemptionPool for offer ${off_cmp}: consumed_total_cents == 0 (restored) and balance_cents == 500000 (restored)"
            - "the reversed backing equals the approved backing, so the pool's consumed_total_cents is unchanged from before the approval"

      - name: value_fund_ledger_invariant
        grounds:
          - calculations.premium_value_funding
          - entities.ValueFundLedgerEntry.fields.amount_cents
          - endpoints.POST_/network/annual-fee-statements/{statement_id}/void
        distinguishing_aspect: "Conserved quantity = the value-fund ledger sum: assessing then voiding a statement leaves the fund's net allocation at zero because the FEE_ALLOCATION_REVERSAL entry exactly negates the FEE_ALLOCATION entry."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One active card member and one DRAFT annual fee statement with principal 1000000 cents and 2 authorised users at 50000 cents."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/cardmembers"
              payload: { member_name: "Member Fund", card_product: "PLATINUM" }
              as: NetworkIssuer
              captures: { cm_fund: $.data.id }
            - call: "POST /network/cardmembers/${cm_fund}/activate"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/annual-fee-statements"
              payload: { cardmember_id: "${cm_fund}", statement_year: 2026, principal_fee_cents: 1000000, authorised_user_count: 2, per_user_fee_cents: 50000 }
              as: NetworkIssuer
              captures: { stmt_cmp: $.data.id }
            - call: "POST /network/annual-fee-statements/${stmt_cmp}/assess"
              payload: {}
              as: NetworkIssuer
            - call: "POST /network/annual-fee-statements/${stmt_cmp}/disburse"
              payload: {}
              as: NetworkIssuer
          trigger:
            - call: "POST /network/annual-fee-statements/${stmt_cmp}/void"
              payload: {}
              as: NetworkIssuer
          assert:
            - "AnnualFeeStatement.${stmt_cmp}.statement_status == VOIDED"
            - "GET /network/value-fund/ledger?source_statement_id=${stmt_cmp} returns exactly two entries: a FEE_ALLOCATION of 40000 and a FEE_ALLOCATION_REVERSAL of -40000"
            - "the sum of amount_cents over those two entries == 0"
            - "the entries replay in created_seq order, not id order"