              captures: { reg_v3: "$.data.version", reg_tier_3: "$.data.cooperation_tier", reg_hours_3: "$.data.ct_response_deadline_hours" }
          assert:
            - "the registry is created with version 1 and donor_count 0, and reads back donor_count 2 after the two donors are registered"
            - "the first PATCH returns 200 with ct_response_deadline_hours 240 and version 2; cooperation_tier is still 1"
            - "everything not named in the PATCH body is untouched: code \"NMDP-US\", name \"National Marrow Donor Program\", currency_code \"USD\", fx_rate_to_usd 1.0000, is_domestic true, cooperation_status \"ACTIVE\""
            - "the typing request raised AFTER the patch gets deadline_at \"2026-08-11T00:00:00Z\" (240 h from 2026-08-01T00:00:00Z)"
            - "the typing request raised BEFORE the patch still reads deadline_at \"2026-08-08T00:00:00Z\" - a stored deadline is never recomputed from the registry's current hours"
            - "the second PATCH returns version 3 with cooperation_tier 2 AND ct_response_deadline_hours still 240: successive partial updates accumulate instead of resetting omitted fields"

      - name: the_screening_action_defers_the_donor_and_enforces_its_outcome_pairing
        claim_type: Action endpoint
        grounds:
