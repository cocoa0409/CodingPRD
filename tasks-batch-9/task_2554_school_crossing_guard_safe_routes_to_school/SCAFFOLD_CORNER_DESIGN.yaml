      - name: corner_missing_role_header_returns_unauthenticated
        claim_type: unauthorized_operation
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_10.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          401 and 403 are distinct and ordered. A request with no X-User-Role header, and a
          request naming a role that §1.7 does not declare, both fail the priority-10 gate
          with ERR_UNAUTHENTICATED (401) — never the priority-12 ERR_UNAUTHORIZED (403),
          which is reserved for a declared role that this endpoint does not list. A blank
          X-User-ID with a valid role is also 401, so authentication is judged on both
          headers before any authorization decision.
        test_recipe:
          setup:
            - "One school on file; no other state required."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Maple St & 3rd Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2 }
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "adm-1"
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Birch St & 4th Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2 }
              as: "CrossingCaptain"
              as_user_id: "adm-1"
            - call: "POST /srts/intersections"
              payload: { school_id: "${school_id}", cross_streets: "Cedar St & 5th Ave", control_type: "UNCONTROLLED", speed_limit_mph: 30, lanes_crossed: 2 }
              as: ProgramAdmin
              as_user_id: ""
          assert:
            - "trigger call 1 returns ERR_UNAUTHENTICATED with HTTP 401 (NOT ERR_UNAUTHORIZED 403)"
            - "trigger call 2 returns ERR_UNAUTHENTICATED with HTTP 401 — an undeclared role name is an authentication failure, not an authorization failure"
            - "trigger call 3 returns ERR_UNAUTHENTICATED with HTTP 401 for the blank X-User-ID"
            - "GET /srts/schools/${school_id}/intersections as ProgramAdmin returns 0 rows"

  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_intersection_version_rejects_study_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.study-create-stale-intersection
          - errors.ERR_STALE_INTERSECTION_VERSION
          - validations.priority_42
        distinguishing_aspect: |
          Every crash-record write bumps Intersection.version, so a client that read the
          intersection before the second crash landing holds version ${isx_v} - 1. Opening a
          study with that value is ERR_STALE_INTERSECTION_VERSION (412) and creates nothing;
          replaying the identical request with the current ${isx_v} returns 201 and bumps the
          intersection to ${isx_v} + 1. This is the study-create-stale-intersection rule of
          §1.2.1, keyed on expected_intersection_version.
        test_recipe:
          setup:
            - "One intersection under Maple Grove Elementary with two pedestrian crash records, so its version has advanced twice since creation and crash_severity_points is 23."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
