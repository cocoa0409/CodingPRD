              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_name: "BO Freightliner", region: "SE", hourly_labor_rate_cents: 18500 }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { dealer_id: $.data.id }
            - call: "POST /dealers/${dealer_id}/bays"
              payload: { bay_code: "B1" }
              as: DealerAdvisor
              as_user_id: "${dealer_id}"
              captures: { bay_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3216_FMI4" }
              as: UptimeCoordinator
              captures: { case_a_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_a_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_v_a: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_a_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T13:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v_a}" }
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_a_id}/work-orders"
              payload: {}
              as: UptimeCoordinator
              captures: { wo_a_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_a_id}/work-orders/${wo_a_id}/authorize"
              payload: { diagnostic_minutes_authorized: 30 }
              as: UptimeCoordinator
            # Case A is cancelled so the bay releases for case B and C tests
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_a_id}/cancel"
              payload: {}
              as: UptimeCoordinator
            # now schedule Case B at 13:00-17:00 successfully
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases"
              payload: { fault_code: "SPN3226_FMI4" }
              as: UptimeCoordinator
              captures: { case_b_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_b_id}/triage"
              payload: {}
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}"
              payload: {}
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_v_b: $.data.version }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_b_id}/schedule"
              payload: { dealer_id: "${dealer_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-01T13:00:00Z", scheduled_end_at: "2026-09-01T17:00:00Z", expected_truck_version: "${truck_v_b}" }
              as: UptimeCoordinator
            - call: "GET /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_b_id}/work-orders"
              payload: {}
              as: UptimeCoordinator
              captures: { wo_b_id: "$.data[0].id" }
            - call: "POST /fleets/${fleet_id}/trucks/${truck_id}/cases/${case_b_id}/work-orders/${wo_b_id}/authorize"
