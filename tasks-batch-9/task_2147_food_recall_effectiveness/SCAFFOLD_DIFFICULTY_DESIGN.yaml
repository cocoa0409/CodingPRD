  - rule_id: priority_pair_validation_conflict
    instances:
      - name: publish_unsubmitted_warning_on_class3_recall_returns_state_error_not_safety_error
        grounds:
          - validations[priority=13]
          - validations[priority=21]
          - errors[ERR_INVALID_WARNING_STATE]
          - errors[ERR_PUBLIC_WARNING_NOT_WARRANTED]
        distinguishing_aspect: |
          Error-category pair `state` (priority 13) versus `business_safety` (priority 21): a
          DRAFT PublicWarning of type PRESS_RELEASE on a CLASS_III recall violates both rows at
          once and the response MUST be ERR_INVALID_WARNING_STATE (409), never
          ERR_PUBLIC_WARNING_NOT_WARRANTED (422).
        test_recipe:
          setup:
            - "FDA Recall classified CLASS_III."
            - "One PublicWarning of warning_type PRESS_RELEASE still in status DRAFT (never submitted, never approved)."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "LOW", severity_tier: 1, exposure_population: 0, vulnerable_population: false, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_III" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/public-warnings"
              payload: { warning_type: "PRESS_RELEASE", headline: "Voluntary recall of frozen spinach", body: "Consumers should not eat lot L-88A." }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { pw_id: $.data.id }
          trigger:
            - call: "POST /public-warnings/${pw_id}/publish"
              payload: {}
              as: RecallCoordinator
              as_user_id: "coord-2"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_INVALID_WARNING_STATE"
            - "${err} != ERR_PUBLIC_WARNING_NOT_WARRANTED"
            - "PublicWarning.${pw_id}.status == DRAFT and PublicWarning.${pw_id}.published_at == null"

      - name: receipt_for_unlisted_consignee_over_quantity_returns_referential_error_not_fiscal_error
        grounds:
          - validations[priority=23]
          - validations[priority=30]
          - errors[ERR_CONSIGNEE_NOT_ON_DISTRIBUTION_LIST]
          - errors[ERR_QUANTITY_EXCEEDS_SHIPPED]
        distinguishing_aspect: |
          A different error-category pair from the first instance: `business_referential`
          (priority 23) versus `business_fiscal` (priority 30). A consignee whose only
          distribution record is DISPUTED has neither a CONFIRMED/CORRECTED line (referential
          violation) nor any reconciled units (so any positive quantity is a fiscal violation);
          the response MUST be ERR_CONSIGNEE_NOT_ON_DISTRIBUTION_LIST, never
          ERR_QUANTITY_EXCEEDS_SHIPPED.
        test_recipe:
          setup:
            - "FDA Recall classified CLASS_I, in NOTIFICATION_IN_PROGRESS."
