      - name: cure_submitted_exactly_at_the_deadline_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=11]"]
        distinguishing_aspect: "'at or before cure_deadline_at' is inclusive: a submission at exactly 2026-08-30T00:00:00Z cures the violation, and the CURED transition leaves the 3 assessed points on the ledger."
        test_recipe:
          setup: ["Violation V1 NOTICED at clock 2026-08-20 with cure_deadline_at 2026-08-30; clock advanced to exactly 2026-08-30."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *CLK0820
            - *OBS14000
            - *OBSEVAL
            - *GETRESV
            - *NOTICE1
            - &CLK0830
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /violations/${vio}/cure-submission"
              payload: { cure_evidence_url: "https://acme.example/proof/ontime", corrected_price_cents: 15000, evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: Reseller
              as_user_id: "${res}"
          assert:
