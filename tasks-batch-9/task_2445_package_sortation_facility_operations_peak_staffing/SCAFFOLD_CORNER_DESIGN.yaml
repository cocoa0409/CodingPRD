              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: FacilityAdmin
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: InboundCoordinator
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: SortSupervisor
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
