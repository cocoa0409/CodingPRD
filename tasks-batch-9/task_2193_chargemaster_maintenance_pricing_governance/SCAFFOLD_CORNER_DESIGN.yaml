      - name: facility_derived_counters_reconcile_after_create_after_reprice_and_after_source_retirement
        claim_type: derived_field_reconciliation
        grounds:
          - cross_cutting_complexity_layers[derived_field_reconciliation]
          - entities.Facility
          - endpoints[GET /chargemaster/facilities/{facility_id}]
          - state_machines[ChargeItem]
        distinguishing_aspect: "Walks one facility's derived block through all three reconciliation events on the same objects: after CREATE the DRAFT items contribute nothing (count 0, aggregate 0) even though they exist and are priced; after UPDATE the aggregate follows the repriced gross (240000 + 480000 = 720000) with no double counting; and after the source is retired by DEACTIVATE the counters fall back to exactly the surviving item (1 / 480000) rather than to zero or to a stale 720000. The INACTIVE item is the discriminator — it is still stored, still priced, and still readable, yet contributes to no counter."
