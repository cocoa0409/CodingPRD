      - name: empty_candidate_pool_suggest_aircraft
        grounds:
          - calculations.interchange_adjustment
          - errors[ERR_NO_AIRCRAFT_AVAILABLE]
          - endpoints: "GET /bookings/{id}/suggest-aircraft"
        distinguishing_aspect: |
          Empty-set boundary on the SELECTOR metric (count of candidate tails),
          reached via a different endpoint: all tails IN_MAINTENANCE → candidate
          pool size exactly 0 → ERR_NO_AIRCRAFT_AVAILABLE (not an empty 200
          list). Distinct metric (collection cardinality) from the hours
          threshold.
        test_recipe:
          setup:
            - "Owner with ACTIVE 1/8 MID share; one MID tail placed IN_MAINTENANCE via started maintenance event; CONFIRMED unassigned booking exists"
          setup_api_calls:
