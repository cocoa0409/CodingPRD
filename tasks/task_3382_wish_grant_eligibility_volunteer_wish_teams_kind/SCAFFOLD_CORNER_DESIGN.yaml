      - name: referral_age_trap_at_determination
        claim_type: correct_result
        grounds: ["calculations.age_months", "validations[priority=21]", "state_machines.Referral.CERTIFIED_to_DENIED"]
        distinguishing_aspect: "A child referred at 215 months (dob 2008-09-20, clock 2026-09-01) ages out before determination: at clock 2026-10-01 the APPROVED determination fails with ERR_CHILD_AGE_OUT_OF_RANGE, but a DENIED determination is never age-blocked."
        test_recipe:
          setup: ["Chapter; referral created at 215 months and certified; clock then advanced to 2026-10-01 (child now exactly 216 months)."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Borderline Teen", child_date_of_birth: "2008-09-20", child_zip_code: "90012", parent_email: "teen@example.org", diagnosis_summary: "neuroblastoma", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id, ref_age: $.data.age_months_at_intake }
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "NEUROLOGIC" }
              as: MedicalProvider
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: NationalAdmin
          trigger:
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { err: $.data.error_id }
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "DENIED", denial_reason: "aged out" }
              as: EligibilityReviewer
          assert:
            - "ref_age == 215 at intake (eligible then)"
            - "APPROVED at 216 months fails with err == ERR_CHILD_AGE_OUT_OF_RANGE"
            - "DENIED afterwards succeeds (200): Referral.${ref_id}.status == DENIED, denial_reason == 'aged out', wish_id null"

      - name: intake_age_30_months_lower_boundary
        claim_type: correct_result
        grounds: ["calculations.age_months", "validations[priority=21]"]
        distinguishing_aspect: "Lower bound inclusive: dob 2024-03-01 at clock 2026-09-01 is exactly 30 months -> accepted; dob 2024-03-02 is 29 months -> ERR_CHILD_AGE_OUT_OF_RANGE."
