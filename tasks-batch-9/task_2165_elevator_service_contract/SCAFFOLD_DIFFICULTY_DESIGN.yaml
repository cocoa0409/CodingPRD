  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: inspection_fail_red_tags_car_then_pulls_it_from_service_then_alerts_contract
        grounds:
          - state_machines.StateInspection.status.SCHEDULED_to_COMPLETED
          - state_machines.ElevatorCar.compliance_state.INSPECTION_DUE_to_RED_TAGGED
          - state_machines.ElevatorCar.availability_state.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ServiceContract.status.ACTIVE_to_SERVICE_ALERT
          - calculations.contract_escalation_counter
          - endpoints[POST /elevator-program/inspections/{inspectionId}/record-result]
        distinguishing_aspect: |
          Depth-4 chain from the record-result trigger: (1) the inspection row moves to COMPLETED
          with result FAIL, (2) which drives ElevatorCar.compliance_state to RED_TAGGED, (3) which by
          itself forces the SAME car's availability_state to OUT_OF_SERVICE, (4) which raises
          cars_out_of_service_count to 2 and therefore flips ServiceContract ACTIVE -> SERVICE_ALERT.
          Each link is caused by the previous link, not directly by the API call.
        test_recipe:
          setup:
            - "One ACTIVE contract with two cars C1 and C2."
            - "C2 already has an open (REPORTED) out-of-service callback, so cars_out_of_service_count == 1 and the contract is still ACTIVE."
            - "C1 has a SCHEDULED PERIODIC inspection and compliance_state INSPECTION_DUE."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Iota Center", building_address: "9 Iota Sq", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-i", contractor_user_id: "sc-i", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 400000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2027-12-31" }
