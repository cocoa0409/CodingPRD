            - "trigger call 2: HTTP 200; Investigation.status == \"FINDINGS_LOCKED\" and the SubjectResponseRequest is now \"NOTICE_ELIGIBLE\" with attempt_count 0 and notice_sent_at null"
            - "trigger call 3: HTTP 409 with error_id ERR_SUBJECT_NOTICE_PENDING - notice_sent_at is null, so gate 165 answers before either of the later notice gates"
