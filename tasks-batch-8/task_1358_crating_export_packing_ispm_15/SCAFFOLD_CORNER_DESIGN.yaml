      - name: duplicate_site_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Customer.site_code is unique; a second customer with the same site_code -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one customer with site_code DUP-01"]
          setup_api_calls:
