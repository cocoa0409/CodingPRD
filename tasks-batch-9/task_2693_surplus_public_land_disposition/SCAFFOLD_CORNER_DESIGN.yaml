              as: SystemAdministrator
              captures: { appraiser_1_id: "$.data.id" }
            - call: "POST /appraisers"
              payload: { name: "Marcus Vane MAI", license_number: "AG-44273", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_2_id: "$.data.id" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_1_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v}" }
              as: RealPropertyOfficer
              captures: { appraisal_id: "$.data.id" }
          trigger:
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 61000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Drive-by opinion prepared without the engagement." }
              as: Appraiser
              as_user_id: "${appraiser_2_id}"
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 100000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Sales comparison of four infill sales." }
