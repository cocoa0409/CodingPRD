            - { call: "POST /api/brokers", payload: { name: "Bay Brokers", license_number: "LIC-B1", coverage_states: ["CA"] }, as: OREOAdmin, captures: { b_id: $.data.id } }
            - { call: "PATCH /api/brokers/${b_id}", payload: { status: "SUSPENDED" }, as: OREOAdmin }
          trigger:
            - { call: "POST /api/listing-agreements", payload: { property_id: "${p_id}", broker_id: "${b_id}", start_date: "2026-06-05", end_date: "2026-12-05", listing_price: 450000.00 }, as: PropertyManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BROKER_NOT_ELIGIBLE (HTTP 422)"

      - name: appraisal_revision_loop_covered
        claim_type: valid_transition
        grounds: [state_machines.Appraisal.SUBMITTED_to_DRAFT]
        excluded_because:
          difficulty_instance: appraisal_rejection_revision_loop
          rationale: "The reject->DRAFT->submit->SUBMITTED->certify loop, including rejection_reason persistence, is asserted end-to-end by the named rule-3 instance."

      - name: chargeoff_cascade_covered
        claim_type: side_effect_execution
        grounds: [state_machines.OREOProperty.MARKETED_to_CHARGED_OFF]
        excluded_because:
          difficulty_instance: clock_crossing_deadline_chargeoff_cascade
          rationale: "Charge-off auto-transition, auto POSTED write-down, CHARGE_OFF ledger entry, listing termination, and offer rejection are all asserted by the named rule-4 instance."

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: appraisal_status_ages_through_thresholds
        claim_type: boundary_edge
        grounds: [calculations.appraisal_currency, entities.OREOProperty.fields.appraisal_status]
        distinguishing_aspect: "CURRENT/DUE_SOON/OVERDUE boundaries are pinned: clock <= E+335 CURRENT; E+335 < clock <= E+365 DUE_SOON; clock > E+365 OVERDUE, for E = 2026-06-01."
        test_recipe:
          setup: ["Property with a CERTIFIED appraisal effective 2026-06-01"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id, p_v: $.data.version } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "POST /api/appraisers", payload: { name: "Apex Valuations", license_number: "LIC-A1", coverage_states: ["CA"], fee_flat: 750.00 }, as: OREOAdmin, captures: { ap_id: $.data.id } }
            - { call: "POST /api/appraisals", payload: { property_id: "${p_id}", appraiser_id: "${ap_id}", effective_date: "2026-06-01", appraised_value: 400000.00, expected_property_version: "${p_v}" }, as: Appraiser, as_user_id: "${ap_id}", captures: { a_id: $.data.id } }
            - { call: "POST /api/appraisals/${a_id}/submit", payload: {}, as: Appraiser, as_user_id: "${ap_id}" }
            - { call: "POST /api/appraisals/${a_id}/certify", payload: {}, as: ChiefAppraiser, as_user_id: "chief-appraiser-1" }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-05-02T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { s1: $.data.appraisal_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-05-03T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { s2: $.data.appraisal_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-06-01T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { s3: $.data.appraisal_status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2027-06-02T00:00:00Z" }, as: OREOAdmin }
            - { call: "GET /api/oreo-properties/${p_id}", payload: {}, as: OREOAdmin, captures: { s4: $.data.appraisal_status } }
          assert:
            - "s1 == CURRENT (clock == E+335 exactly)"
            - "s2 == DUE_SOON (E+335 < clock <= E+365)"
            - "s3 == DUE_SOON (clock == E+365 exactly, inclusive upper bound)"
            - "s4 == OVERDUE (clock > E+365, strict)"

      - name: carrying_cost_capitalized_vs_expensed_accounting
        claim_type: correct_result
        grounds: [calculations.carrying_value_reconciliation, entities.CarryingCost.fields.amount]
        distinguishing_aspect: "Only CAPITAL_IMPROVEMENT enters carrying_value; expensed types accumulate separately; per-entry rounding (2500.456 -> 2500.46) is pinned at posting."
        test_recipe:
          setup: ["Property HELD, carrying 368000.00"]
          setup_api_calls:
            - { call: "POST /api/oreo-properties", payload: { address: "1420 Maple St", state_code: "CA", county: "Alameda", property_type: "RESIDENTIAL", acquisition_date: "2026-05-10", bpo_value: 400000.00, foreclosure_debt: 410000.00 }, as: OREOAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/carrying-costs", payload: { property_id: "${p_id}", cost_type: "CAPITAL_IMPROVEMENT", amount: 10000.00, incurred_date: "2026-07-01", description: "Roof replacement" }, as: PropertyManager, captures: { cc1: $.data.amount } }
            - { call: "POST /api/carrying-costs", payload: { property_id: "${p_id}", cost_type: "TAXES", amount: 2500.456, incurred_date: "2026-07-15" }, as: PropertyManager, captures: { cc2: $.data.amount } }
            - { call: "GET /api/oreo-properties/${p_id}/summary", payload: {}, as: OREOAdmin }
          assert:
            - "cc1 == 10000.00 and cc2 == 2500.46 (per-entry half-up rounding at posting)"
            - "Summary: capitalized_cost_total == 10000.00, expensed_cost_total == 2500.46"
            - "Summary: carrying_value == 378000.00 (368000.00 + 10000.00; taxes excluded)"

      - name: cash_sale_below_carrying_recognizes_loss
