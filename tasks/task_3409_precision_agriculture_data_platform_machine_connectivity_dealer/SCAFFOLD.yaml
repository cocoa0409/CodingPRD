    actor: system
    preconditions: []
    side_effects:
    - Recompute Machine.active_license_count
- entity: WarrantyClaim
  initial_state: DRAFT
  terminal_states:
  - DENIED
  - SETTLED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /agdata/warranty-claims/{id}/submit
    actor: DealerTechnician
    preconditions:
    - warranty_data_coverage(machine) >= WARRANTY_MIN_COVERAGE_PCT (ERR_INSUFFICIENT_DATA_COVERAGE)
    side_effects:
