            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2026-06-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { c1: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "GAPPING", affected_square_feet: 100, installation_date: "2026-06-16", subfloor_moisture_pct_at_install: 9.5, ambient_rh_pct_at_install: 40 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { c2: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2026-06-17", subfloor_moisture_pct_at_install: 11.0, ambient_rh_pct_at_install: 65 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { c3: "$.data.id" } }
            - { call: "POST /mill/warranty-claims/${c3}/request_info", payload: { info_request_note: "Send the installer moisture log." }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          trigger:
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "GAPPING", affected_square_feet: 50, installation_date: "2026-06-18", subfloor_moisture_pct_at_install: 8.0, ambient_rh_pct_at_install: 35 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
            - { call: "POST /mill/warranty-claims/${c2}/adjudicate", payload: { decision: "DENIED", adjudicated_affected_sf: 100, adjudicated_subfloor_moisture_pct: 9.5, adjudicated_ambient_rh_pct: 40, denial_reason: "Installed over an unacclimated slab." }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "GAPPING", affected_square_feet: 50, installation_date: "2026-06-18", subfloor_moisture_pct_at_install: 8.0, ambient_rh_pct_at_install: 35 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
          assert:
            - "First fourth-claim attempt: status 409 with data.error_id == \"ERR_TOO_MANY_OPEN_CLAIMS\" - the INFO_REQUESTED claim counted toward the three."
            - "GET /mill/warranty-claims?product_line_id={line_id} returns total_count 3 after the rejection."
            - "The denial returns 200 with data.adjudication_status == \"DENIED\" and data.adjudicated_liability_cents == 0; the line still shows warranty_committed_cents == 0."
            - "Second fourth-claim attempt: status 201 with data.adjudication_status == \"SUBMITTED\"; GET /mill/warranty-claims?product_line_id={line_id} now returns total_count 4."

