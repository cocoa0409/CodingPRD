              captures: { vt_tt_id: $.data.id }
            - call: "POST /offers/${vt_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${vt_of_id}/accept"
              payload: {}
              as: ArtistRep
