              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T09:00:00Z", scheduled_end: "2026-06-10T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_a: $.data.id } }
          trigger:
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T10:00:00Z", scheduled_end: "2026-06-10T11:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_b: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-10T09:30:00Z", scheduled_end: "2026-06-10T10:30:00Z", location: "Room 2" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "Adjacent meeting 10:00-11:00 is created (201) — half-open adjacency allowed"
            - "Overlapping meeting 09:30-10:30 is rejected with ERR_MEETING_OVERLAP"
            - "GET /safety/committee-meetings?program_id shows exactly 2 meetings"

      - name: certification_renewal_window_suppression
        grounds:
          - calculations.certification_window
          - validations[priority=12]
          - errors[ERR_CERTIFICATION_ACTIVE]
        distinguishing_aspect: |
          Interval semantics: suppression window with renewal grace on the
          employee-x-course certification resource — a new assignment is blocked while
          remaining validity STRICTLY exceeds renewal_window_days, and allowed exactly at
          30 days remaining. Different geometry (grace-window containment) and different
          resource than the meeting half-open collision rule.
        test_recipe:
          setup:
            - "Course HAZCOM validity_months 2, renewal_window_days 30; employee E completed it 2026-06-01 -> cert_valid_until 2026-08-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/training-courses", payload: { title: "HAZCOM", hazard_class: "LOW", validity_months: 2, renewal_window_days: 30 }, as: EHSAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Eli E", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-06-20T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { ta_id: $.data.id } }
            - { call: "POST /safety/training-assignments/${ta_id}/complete", payload: { completed_at: "2026-06-01T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { cert_until: $.data.cert_valid_until } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-07-15T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-02T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/training-assignments", payload: { employee_id: "${e_id}", course_id: "${course_id}", due_date: "2026-07-20T00:00:00Z" }, as: Supervisor, as_user_id: "${e_id}", captures: { ta2_id: $.data.id } }
          assert:
            - "cert_valid_until == 2026-08-01T00:00:00Z"
            - "On 2026-07-01 (31 days remaining): ERR_CERTIFICATION_ACTIVE (strict > blocks)"
            - "On 2026-07-02 (exactly 30 days remaining == renewal_window_days): creation succeeds (201)"

  - rule_id: compensating_invariant
    instances:
      - name: incentive_budget_approve_void_conservation
        grounds:
          - state_machines.IncentiveAward.CALCULATED_to_APPROVED
          - state_machines.IncentiveAward.APPROVED_to_VOIDED
          - entities.SafetyProgram.fields.remaining_budget_cents
        distinguishing_aspect: |
          Conserved quantity: program.remaining_budget_cents + SUM(payout_cents of
          APPROVED|PAID awards) == incentive_budget_cents. Approve debits 6000, void of
          an APPROVED award is the compensating action that credits 6000 back — no drift.
        test_recipe:
          setup:
            - "CLOSED LEADING_ONLY program, budget 9000; employee X earned 40 points -> award payout 6000 (control verified LATE on 2026-06-15, same fixture shape as award_approve_state_beats_fiscal)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 9000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Xavier X", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { x_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/hazards", payload: { program_id: "${p_id}", location: "Yard", description: "Oil sheen", identified_by: "${x_id}" }, as: SafetyManager, as_user_id: "${m_id}", captures: { h_id: $.data.id } }
            - { call: "POST /safety/hazards/${h_id}/assess", payload: { severity: 3, probability: 2 }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/hazards/${h_id}/controls", payload: { description: "Absorbent pads", implementer_id: "${x_id}", due_date: "2026-06-10T00:00:00Z" }, as: SafetyManager, as_user_id: "${m_id}", captures: { c_id: $.data.id } }
            - { call: "POST /safety/observations", payload: { program_id: "${p_id}", reporter_id: "${x_id}", kind: "OBSERVATION", description: "Slippery patch", occurred_at: "2026-05-30T00:00:00Z" }, as: Employee, as_user_id: "${x_id}", captures: { o_id: $.data.id } }
            - { call: "POST /safety/observations/${o_id}/triage", payload: { action: "LINK_EXISTING", hazard_id: "${h_id}" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/controls/${c_id}/implement", payload: {}, as: Supervisor, as_user_id: "${x_id}" }
            - { call: "POST /safety/controls/${c_id}/verify", payload: { outcome: "PASS" }, as: SafetyManager, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt_id: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt_id}/hold", payload: { attendee_ids: ["${x_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt_id}/action-items", payload: { assignee_id: "${x_id}", description: "Post spill kit sign", due_date: "2026-06-20T00:00:00Z" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { ai_id: $.data.id } }
            - { call: "POST /safety/action-items/${ai_id}/complete", payload: {}, as: Supervisor, as_user_id: "${x_id}" }
            - { call: "POST /safety/action-items/${ai_id}/verify", payload: { outcome: "PASS" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt_id}/publish-minutes", payload: { minutes_text: "Spill review" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/programs/${p_id}/close", payload: {}, as: EHSAdmin }
            - { call: "GET /safety/incentive-awards", payload: { program_id: "${p_id}", employee_id: "${x_id}" }, as: EHSAdmin, captures: { aw_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /safety/incentive-awards/${aw_id}/approve", payload: {}, as: EHSAdmin }
            - { call: "GET /safety/programs/${p_id}", payload: {}, as: EHSAdmin, captures: { rem1: $.data.remaining_budget_cents } }
            - { call: "POST /safety/incentive-awards/${aw_id}/void", payload: { void_reason: "duplicate award" }, as: EHSAdmin }
            - { call: "GET /safety/programs/${p_id}", payload: {}, as: EHSAdmin, captures: { rem2: $.data.remaining_budget_cents } }
            - { call: "POST /safety/incentive-awards/${aw_id}/approve", payload: {}, as: EHSAdmin, captures: { err3: $.data.error_id } }
          assert:
            - "Before approve: remaining_budget_cents == 9000 and invariant 9000 + 0 == 9000"
            - "After approve: remaining_budget_cents == 3000 and invariant 3000 + 6000 == 9000"
            - "After void (compensation): remaining_budget_cents == 9000 and invariant restored (9000 + 0 == 9000)"
            - "Third call (approve of a VOIDED award) fails with ERR_INVALID_STATE — VOIDED is terminal"

      - name: action_item_carryover_count_conservation
        grounds:
          - state_machines.ActionItem.ASSIGNED_to_ESCALATED
          - state_machines.ActionItem.ESCALATED_to_ASSIGNED
          - entities.CommitteeMeeting.fields.open_action_count
        distinguishing_aspect: |
          Conserved quantity: SUM over meetings of open_action_count == global count of
          ActionItems in ASSIGNED|COMPLETED|ESCALATED. Escalation keeps the item open;
          reassign with meeting carry-over decrements the source meeting and increments
          the target meeting — the global open count never changes. Different conserved
          quantity (item count, not money) than the budget invariant.
        test_recipe:
          setup:
            - "ACTIVE program (quorum_min 1); chair M; committee member A"
            - "Meetings mt1 and mt2 both HELD + MINUTES_PUBLISHED; one action item in mt1 assigned to A due 2026-06-10"
            - "Clock advanced to 2026-06-15 and swept: item is ESCALATED, mt1.open_action_count == 1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: EHSAdmin }
            - call: "POST /safety/programs"
              payload: { program_year: 2026, scoring_variant: "LEADING_ONLY", incentive_budget_cents: 1000000, observation_target_rate: 5.0, exposure_hours: 100000, payroll_by_class: [{ hazard_class: "LOW", payroll_cents: 10000000 }, { hazard_class: "MODERATE", payroll_cents: 10000000 }, { hazard_class: "HIGH", payroll_cents: 10000000 }], elr_by_class: [{ hazard_class: "LOW", elr: 1.0 }, { hazard_class: "MODERATE", elr: 1.0 }, { hazard_class: "HIGH", elr: 1.0 }], quorum_min: 1 }
              as: EHSAdmin
              captures: { p_id: $.data.id }
            - { call: "POST /safety/programs/${p_id}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /safety/job-roles", payload: { title: "Laborer", hazard_class: "LOW" }, as: EHSAdmin, captures: { jr_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Ann A", job_role_id: "${jr_id}", hired_on: "2026-01-05", committee_member: true }, as: EHSAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /safety/employees", payload: { full_name: "Marta M", job_role_id: "${jr_id}", hired_on: "2026-01-05" }, as: EHSAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-08T09:00:00Z", scheduled_end: "2026-06-08T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt1: $.data.id } }
            - { call: "POST /safety/committee-meetings", payload: { program_id: "${p_id}", scheduled_start: "2026-06-09T09:00:00Z", scheduled_end: "2026-06-09T10:00:00Z", location: "Room 1" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt2: $.data.id } }
            - { call: "POST /safety/committee-meetings/${mt1}/hold", payload: { attendee_ids: ["${a_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt1}/publish-minutes", payload: { minutes_text: "Week 1" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt2}/hold", payload: { attendee_ids: ["${a_id}"] }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt2}/publish-minutes", payload: { minutes_text: "Week 2" }, as: CommitteeChair, as_user_id: "${m_id}" }
            - { call: "POST /safety/committee-meetings/${mt1}/action-items", payload: { assignee_id: "${a_id}", description: "Inspect eyewash station", due_date: "2026-06-10T00:00:00Z" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { ai_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: EHSAdmin }
            - { call: "POST /safety/programs/${p_id}/sweep", payload: {}, as: EHSAdmin, captures: { esc: $.data.escalated_actions } }
          trigger:
            - { call: "POST /safety/action-items/${ai_id}/reassign", payload: { due_date: "2026-06-25T00:00:00Z", meeting_id: "${mt2}" }, as: CommitteeChair, as_user_id: "${m_id}", captures: { ai_status: $.data.status, ai_meeting: $.data.meeting_id } }
            - { call: "GET /safety/committee-meetings/${mt1}", payload: {}, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt1_open: $.data.open_action_count } }
            - { call: "GET /safety/committee-meetings/${mt2}", payload: {}, as: CommitteeChair, as_user_id: "${m_id}", captures: { mt2_open: $.data.open_action_count } }
          assert:
            - "sweep escalated_actions == 1 (ASSIGNED past due -> ESCALATED, still open)"
            - "After carry-over reassign: action item status == ASSIGNED and meeting_id == ${mt2}"
            - "mt1.open_action_count == 0 and mt2.open_action_count == 1"
            - "Global open count conserved: 1 before reassign, 1 after (0 + 1 == 1)"
