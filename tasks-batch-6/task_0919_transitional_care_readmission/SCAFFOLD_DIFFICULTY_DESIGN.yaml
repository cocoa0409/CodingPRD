  - rule_id: resource_temporal_overlap
    instances:
      - name: navigator_calendar_trailing_buffer_boundary
        grounds:
          - calculations.visit_slot_conflict_detection
          - validations[priority=19]
          - errors[ERR_SCHEDULE_CONFLICT]
          - entities.TcmVisit.fields.navigator_id
        distinguishing_aspect: |
          Interval semantics here are a HALF-OPEN interval with an ASYMMETRIC
          20-minute buffer appended only to an existing visit's end on the
          Navigator calendar resource - a new slot starting at end plus 19
          minutes collides, at end plus exactly 20 minutes it does not, and a
          slot ending exactly at an existing visit's start is always admissible
          because there is no leading buffer.
