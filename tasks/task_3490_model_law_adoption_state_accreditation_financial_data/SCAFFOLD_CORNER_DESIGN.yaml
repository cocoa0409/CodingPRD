          assert:
            - "State.version was 1 at creation and == 2 after the finalize cascade mutation"
  - section: errors
    instances:
      - name: standard_activate_twice_rejected
        claim_type: violation_to_error
        grounds:
          - state_machines.ValuationStandard
          - errors[ERR_STANDARD_NOT_DRAFT]
        distinguishing_aspect: "Activating an already ACTIVE standard fails with ERR_STANDARD_NOT_DRAFT; only DRAFT can activate."
        test_recipe:
          setup: ["Standard VM-89 v1 created and activated"]
          setup_api_calls:
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-89", version_label: "v1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-3", captures: { err: $.data.error_id } }
          assert:
            - "first activation succeeds: status == ACTIVE"
            - "second activation -> ERR_STANDARD_NOT_DRAFT (409)"
      - name: standard_self_activation_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=19]"
          - errors[ERR_SELF_ACTIVATION_FORBIDDEN]
        distinguishing_aspect: "The authoring actuary (X-User-ID stored as author_user_id) may not activate their own draft; a different actuary can."
        test_recipe:
          setup: ["Standard VM-90 v1 DRAFT authored by actuary-1"]
          setup_api_calls:
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-90", version_label: "v1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
          trigger:
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-1", captures: { err: $.data.error_id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2", captures: { st: $.data.status } }
          assert:
            - "author activation -> ERR_SELF_ACTIVATION_FORBIDDEN (422)"
            - "different actuary activation succeeds: status == ACTIVE"
      - name: error_act_not_published_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ACT_NOT_PUBLISHED]
        excluded_because:
          difficulty_instance: adoption_requires_published_act
          rationale: "Asserted as the failure path of the named difficulty instance (adoption create against an ADOPTED act)."
      - name: error_state_suspended_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STATE_SUSPENDED]
        excluded_because:
          difficulty_instance: license_issue_blocked_when_state_suspended
          rationale: "Asserted as the failure path of the named difficulty instance (license issue against a SUSPENDED state)."
      - name: error_rotation_priority_covered
        claim_type: priority_ordering
        grounds:
          - errors[ERR_REVIEWER_ROTATION_REQUIRED]
        excluded_because:
          difficulty_instance: review_create_rotation_beats_temporal_overlap
          rationale: "Rotation error asserted as the priority winner in the named difficulty instance."
      - name: error_exposure_overlap_covered
        claim_type: temporal_validation
        grounds:
          - errors[ERR_EXPOSURE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: exposure_window_half_open_adjacency
          rationale: "Overlap rejection asserted in the named difficulty instance."
      - name: error_review_gap_covered
        claim_type: temporal_validation
        grounds:
          - errors[ERR_REVIEW_GAP_TOO_SHORT]
          - errors[ERR_REVIEW_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: review_period_closed_interval_min_gap
          rationale: "Both review temporal errors asserted in the named difficulty instance."
      - name: error_act_state_priority_covered
        claim_type: priority_ordering
        grounds:
          - errors[ERR_ACT_NOT_OPEN_FOR_EXPOSURE]
          - errors[ERR_COMMENT_WINDOW_TOO_SHORT]
        excluded_because:
          difficulty_instance: draft_create_state_beats_window_constraint
          rationale: "Both error ids asserted (winner and suppressed) in the named difficulty instance."
  - section: consistency_model
    instances:
      - name: immediate_read_after_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "immediate consistency: a create followed by a read in the next request returns every stored field with no lag."
        test_recipe:
