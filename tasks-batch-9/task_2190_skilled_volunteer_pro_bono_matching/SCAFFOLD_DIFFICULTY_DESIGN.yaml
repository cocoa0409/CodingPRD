  - rule_id: boundary_precision
    instances:
      - name: reliability_floor_strict_at_0_4000
        grounds:
          - calculations.volunteer_reliability_score
          - calculations.volunteer_reliability_score.constants.RELIABILITY_FLOOR
          - calculations.match_score
        distinguishing_aspect: |
          The ONLY strict (<) threshold among the five families: the auto-pause fires on
          reliability_score < 0.4000, so a score of exactly 0.4000 must leave the volunteer
          ACTIVE and matchable. Every other instance in this rule tests an INCLUSIVE (>=)
          band floor. This instance is also the only one whose boundary value is not
          directly injectable - it must be manufactured out of the DECAY_WEIGHTED history,
          which makes the reachable lattice of scores coarse and the exact hit non-obvious.

          Arithmetic (DECAY_LAMBDA 0.85, DECAY_WINDOW_N 8, MISSED_CHECKIN_PENALTY 0.10):
            weights w(i) = round(0.85 ** i, 6) = 1.000000, 0.850000, 0.722500, 0.614125
            sum(w) = 3.186625 for the four terminal engagements below.
          Points, in terminal_at DESC order (i = 0 is the most recent):
            i=0  H1 TERMINATED / SCOPE_BREACH, 0 missed    -> max(0, 0.25 - 0.00) = 0.2500
            i=1  H2 HANDED_OFF / CONDITIONAL, 1 missed     -> max(0, 0.70 - 0.10) = 0.6000
            i=2  H3 TERMINATED / AGREEMENT_VOIDED, 1 missed-> max(0, 0.60 - 0.10) = 0.5000
            i=3  H4 TERMINATED / SCOPE_BREACH, 0 missed    -> max(0, 0.25 - 0.00) = 0.2500
          ARM A (exactly on the floor):
            num = 1.000000*0.2500 + 0.850000*0.6000 + 0.722500*0.5000 + 0.614125*0.2500
                = 0.25 + 0.51 + 0.36125 + 0.15353125 = 1.27478125
            reliability_score = round(1.27478125 / 3.186625, 4) = round(0.40004147..., 4) = 0.4000
            0.4000 < 0.4000 is FALSE -> no pause, status stays ACTIVE, volunteer stays a
            match candidate. LIFETIME_AVERAGE = round(1.60 / 4, 4) = 0.4000 (both variants
            agree here, which is why the pair is a clean probe).
          ARM B (just below, single-action delta): the oldest engagement H4 records one
          missed check-in, so its points fall 0.2500 -> max(0, 0.25 - 0.10) = 0.1500:
            num = 0.25 + 0.51 + 0.36125 + 0.614125*0.1500 = 1.21336875
            reliability_score = round(1.21336875 / 3.186625, 4) = round(0.38077..., 4) = 0.3808
            0.3808 < 0.4000 -> Volunteer.status ACTIVE -> PAUSED, pause_reason RELIABILITY_FLOOR,
            so the next match round has an empty candidate set (v.status != ACTIVE).
            LIFETIME_AVERAGE = round(1.50 / 4, 4) = 0.3750.
          ARM C (just above): H3 holds its check-in instead of missing it, points 0.5000 ->
          0.6000: num = 0.25 + 0.51 + 0.722500*0.6000 + 0.15353125 = 1.34703125
            reliability_score = round(1.34703125 / 3.186625, 4) = round(0.42272..., 4) = 0.4227
            -> ACTIVE, matchable. LIFETIME_AVERAGE = round(1.70 / 4, 4) = 0.4250.
          Note on reachability, which is itself part of the boundary difficulty: because
          MISSED_CHECKIN_LIMIT is 2 (the second miss terminates the engagement as ADMIN) and
          the MISSED transition requires work_status == IN_PROGRESS, single-engagement points
          are confined to {1.00, 0.90, 0.70, 0.60, 0.50, 0.25, 0.15, 0.05, 0.00}. Exhausting
          that lattice shows 0.4000 is UNREACHABLE with one, two or three terminal
          engagements (the tightest two-engagement straddle is 0.3932 / 0.4014 and the
          tightest three-engagement straddle is 0.3998 / 0.4006). Four terminal engagements
          with the points above are the minimum needed to sit exactly on 0.4000, so an
          implementation that rounds the ratio to fewer than 4 decimals, or that uses <=
          instead of <, is caught only by this construction.
        test_recipe:
          setup:
            - "Canonical world: cycle 2026-Q1 [2026-01-01, 2026-04-01) with capacity_slot_total 10; LARGE partner (annual_budget_usd 12000000.00 -> max_concurrent_engagements 6); SENIOR volunteer at 150.00/h vetted with LEGAL_CONTRACTS proficiency 4 verified; one HARD availability window [2026-01-05, 2026-03-01) offering 300.00 hours; logical clock set to 2026-01-10T00:00:00Z before the first ProjectRequest is created."
            - "Four terminal engagements H4, H3, H2, H1 for that one volunteer, created and closed in that chronological order (so terminal_at DESC yields H1, H2, H3, H4). Each is built by replaying the canonical request -> submit-for-scoping -> scope-definition -> deliverable(weight_pct 100.00) -> approve -> match -> accept -> agreement send/execute/execute -> start chain shown below for H1, each on its own ProjectRequest of 40.00 estimated hours x complexity_factor 1.00 (committed_hours 40.00, well inside the 300.00-hour window)."
            - "Terminal outcomes and missed check-ins are the only thing that varies: H4 TERMINATED with termination_reason SCOPE_BREACH and 0 missed check-ins; H3 TERMINATED with termination_reason AGREEMENT_VOIDED and exactly 1 missed check-in; H2 HANDED_OFF with quality_gate CONDITIONAL and exactly 1 missed check-in; H1 TERMINATED with termination_reason SCOPE_BREACH and 0 missed check-ins."
            - "A missed check-in is produced by scheduling a Milestone, never holding it, advancing the clock past due_at + CHECKIN_GRACE_HOURS (24) while work_status == IN_PROGRESS, then running POST /program-cycles/{id}/recalculate; milestone due_at values are kept >= 72h apart (CHECKIN_BUFFER_HOURS) and at most 2 SCHEDULED milestones fall in any +/-7 day window (CHECKIN_SATURATION_LIMIT)."
