            - call: "POST /contract-types"
              payload: { code: "MSA18", display_name: "MSA", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "Rho", jurisdiction: "US-CT", risk_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "Inv2Playbook" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: ["a_fb"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "MEDIUM" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { clause_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
          trigger:
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "altA_v1", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_v1: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "altA_v2", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_v2: $.data.id }
          assert:
            - "Deviation.${dev_v1}.status == SUPERSEDED"
            - "Deviation.${dev_v2}.status == OPEN"
            - "Negotiation.${neg_id}.open_deviation_count == 1"
            - "Negotiation.${neg_id}.blocking_deviation_count == 1"
