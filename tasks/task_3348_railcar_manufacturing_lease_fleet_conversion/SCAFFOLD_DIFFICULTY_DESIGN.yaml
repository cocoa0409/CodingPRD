          lease_contract_id: ${lc_life_id}
          lessee_id: ${lessee_life_id}
          start_date: '2026-09-05'
          end_date: '2026-10-05'
          mileage_allowance: 1000
        as: LeaseAdministrator
        captures:
          asg_life_id: $.data.id
      - call: POST /api/v1/_clock/set_current_utc
        payload:
