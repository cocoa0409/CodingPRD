        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_TALENT_REGION_MISMATCH]"]
        distinguishing_aspect: "Conditional validation on entity config: an EU talent with cross_region == false cannot be booked onto a NA tournament (ERR_TALENT_REGION_MISMATCH); the same booking with cross_region == true succeeds."
