          assert:
            - "error_id == ERR_EVALUATION_NOT_OWN (HTTP 403)"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_correct_version_succeeds
        claim_type: layer_optimistic_concurrency
        grounds: []
        excluded_because:
          difficulty_instance: "occ_stale_plan_version_rejected / occ_stale_coverage_plan_version_rejected (corner, above); happy-path version match is exercised by every §1.8 recipe that creates assignments or absences"
          rationale: "Both OCC rules' stale-paths have dedicated corner instances above; the success path is embedded in all assignment/absence setups."

      - name: derived_fields_reconciled_immediately
        claim_type: layer_derived_field_reconciliation
        grounds: [entities.StaffingPlan.fields.committed_cost_cents, entities.StaffingPlan.fields.cost_balance_cents]
        excluded_because:
          difficulty_instance: "committed_cost_round_trip_no_drift"
          rationale: "The cents invariant instance asserts committed/balance reconciliation across create and end."

      - name: default_clock_is_fixed_epoch
        claim_type: layer_scheduled_actions
        grounds: []
        excluded_because:
          difficulty_instance: "qualification_expired_at_default_clock (corner, validations section)"
          rationale: "That instance never calls set_current_utc yet deterministically observes 2026-05-01 expiry semantics, proving the default."

  # ===========================================================================
  # Section: consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: same_request_response_shows_computed_fields
        claim_type: immediate_consistency
        grounds: [entities.Assignment.fields.daily_cost_cents]
        distinguishing_aspect: "Immediate consistency: the POST /assignments 201 response already carries computed daily_cost_cents/projected_weekly_cost_cents — no re-read lag."
        test_recipe:
          setup: ["plan ACTIVE, B1, P1, S1 ACTIVE_IEP (ONE_TO_ONE/NONE)"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "ONE_TO_ONE", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
          trigger:
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id, d: $.data.daily_cost_cents, w: $.data.projected_weekly_cost_cents }
          assert:
            - "create response itself carries daily_cost_cents == 10500 (300/60 * 2100 incl. ONE_TO_ONE stipend 100)"
            - "create response carries projected_weekly_cost_cents == 52500 and weekly_minutes == 1500"
