# =============================================================================
# task_2315 — Warehouse Receipt & Commodity Collateral Administration
# Seed tables §1.0 – §1.7 (difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2315. Warehouse Receipt & Commodity Collateral Administration (licensed grain warehouse):
  warehouse licensing with capacity, bonding and financial requirements by state or federal
  program, storage agreement terms with charges, quality maintenance obligations and delivery
  rights, receipt issuance with negotiable and non-negotiable forms and electronic receipt
  registry participation, position reporting reconciling stored obligations against physical
  inventory with examination requirements, lender interest perfection through receipt possession
  or electronic control with collateral valuation, commingling rules, grade maintenance and
  out-of-condition grain handling, receipt cancellation on delivery with quality adjustment
  settlement, insolvency, indemnity fund claims and depositor protection

domain_name: grain-receipt-collateral
# Flat topology: every entity is a root collection; `api_prefix` is deliberately empty so
# that all resources sit at the URL root (`/warehouses`, `/receipts`, `/collateral-liens`, ...)
# with no parent nesting in paths. Action sub-paths (`/receipts/{receipt_id}/void`) and one
# computed read (`/warehouses/{warehouse_id}/position-summary`) are the only multi-segment paths.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  state_machine_shape: parallel
  # Warehouse carries two independent state dimensions (license_state × insolvency_state);
  # WarehouseReceipt carries two more (receipt_state × encumbrance_state, the latter cyclic
  # UNENCUMBERED→PLEDGED→RELEASED→PLEDGED); PositionReport is cyclic
  # (REJECTED→UNDER_EXAMINATION→REJECTED); DeliveryOrder branches at settlement
  # (LOADED→{SETTLED_FULL, SETTLED_PARTIAL}) with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Warehouse→Bin, Warehouse→StorageAgreement, StorageAgreement→DepositTicket
    - cross_aggregate      # CollateralLien→WarehouseReceipt→Bin; IndemnityClaim→WarehouseReceipt
    - polymorphic          # Party fills depositor / lender / holder / claimant slots, gated by party_kind

  role_model: segregation_of_duties
  # The StateRegulator user (opaque X-User-ID) recorded in Warehouse.licensed_by_user_id may not
  # record that warehouse's examination result — examination independence is enforced by
  # ERR_SEGREGATION_OF_DUTIES. Beyond that, roles are peer-scoped: the operator runs the
  # facility, the depositor and lender act on their own Party rows, the registry administrator
  # owns electronic control transfers.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Warehouse
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Licensed facility name" }
      - { name: operator_name, type: string, source: input, description: "Legal name of the warehouse operator" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of the physical facility" }
      - { name: license_program, type: enum, source: input, description: "STATE | FEDERAL — selects the bonding/net-worth constant set in calculations.license_bond_and_net_worth_requirement", constraints: "STATE | FEDERAL" }
      - { name: licensed_capacity_bushels, type: integer, source: input, description: "Capacity applied for, in whole bushels; caps outstanding receipted obligation", constraints: ">= 1" }
      - { name: bond_amount_cents, type: integer, source: input, description: "Face amount of the posted warehouse bond; also the bond proceeds pool in insolvency allocation", constraints: ">= 0" }
      - { name: net_worth_cents, type: integer, source: input, description: "Audited net worth submitted with the license application", constraints: ">= 0" }
      - { name: loadout_lane_count, type: integer, source: input, description: "Number of parallel loadout lanes; aggregate capacity for overlapping delivery appointments", constraints: ">= 1" }
      - { name: registry_participant, type: boolean, source: input, description: "True when the warehouse participates in the electronic receipt registry (required for ELECTRONIC receipts and ELECTRONIC_CONTROL perfection)" }
      - { name: license_state, type: enum, source: system, description: "Licensing dimension: APPLIED | LICENSED | SUSPENDED | REVOKED | DENIED", default: "APPLIED", constraints: "APPLIED | LICENSED | SUSPENDED | REVOKED | DENIED" }
      - { name: insolvency_state, type: enum, source: system, description: "Insolvency dimension, independent of license_state: SOLVENT | DECLARED | CLAIMS_OPEN | ALLOCATED | CLOSED", default: "SOLVENT", constraints: "SOLVENT | DECLARED | CLAIMS_OPEN | ALLOCATED | CLOSED" }
      - { name: licensed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the StateRegulator who issued the license; null until ISSUE. Compared against the examiner's X-User-ID for segregation of duties" }
      - { name: license_effective_date, type: string, source: system, description: "ISO date the license takes effect; set on ISSUE" }
      - { name: license_expiry_date, type: string, source: system, description: "ISO date the license lapses; set on ISSUE" }
      - { name: required_net_worth_cents, type: integer, source: computed, description: "max(MIN_NET_WORTH[program], licensed_capacity_bushels * NET_WORTH_CENTS_PER_BUSHEL[program])" }
      - { name: net_worth_shortfall_cents, type: integer, source: computed, description: "max(0, required_net_worth_cents - net_worth_cents)" }
      - { name: net_worth_tolerance_cents, type: integer, source: computed, description: "round_half_up(required_net_worth_cents * NET_WORTH_SHORTFALL_TOLERANCE_BPS / 10000)" }
      - { name: required_bond_cents, type: integer, source: computed, description: "base bond for the capacity band plus 1.5x the net-worth shortfall; see calculations.license_bond_and_net_worth_requirement" }
      - { name: bond_deficiency_cents, type: integer, source: computed, description: "max(0, required_bond_cents - bond_amount_cents); must be exactly 0 to issue a license" }
      - { name: obligation_bushels, type: integer, source: computed, description: "Total stored obligation: sum of WarehouseReceipt.quantity_bushels where receipt_state == ISSUED plus sum of DepositTicket.net_bushels where ticket_state == ACCEPTED" }
      - { name: receipted_obligation_bushels, type: integer, source: computed, description: "Sum of WarehouseReceipt.quantity_bushels where receipt_state == ISSUED only; compared against licensed_capacity_bushels at issuance" }
      - { name: system_physical_bushels, type: integer, source: computed, description: "Sum of Bin.stored_bushels over all bins of this warehouse, every condition_state included" }
      - { name: sound_physical_bushels, type: integer, source: computed, description: "Sum of Bin.stored_bushels over bins whose condition_state IN {SOUND, WATCH}; excludes OUT_OF_CONDITION bins" }
      - { name: position_variance_bushels, type: integer, source: computed, description: "sound_physical_bushels - obligation_bushels; negative means shortage" }
      - { name: examination_tolerance_bushels, type: integer, source: computed, description: "max(EXAM_MIN_TOLERANCE_BUSHELS, round_half_up(obligation_bushels * EXAM_TOLERANCE_BPS / 10000))" }
      - { name: operational_posture, type: enum, source: computed, description: "OPEN | RESTRICTED | CLOSED — derived gate; see calculations.operational_posture_derivation", constraints: "OPEN | RESTRICTED | CLOSED" }
      - { name: insolvency_declared_at, type: datetime, source: system, description: "Logical-clock instant of the DECLARE action; the as-of instant for provisional warehouseman lien inside claim entitlement" }
      - { name: insolvency_price_cents_per_bushel, type: integer, source: system, description: "Posted commodity price fixed at DECLARE; used for every claim entitlement in this proceeding" }
      - { name: allowed_claim_total_cents, type: integer, source: computed, description: "Sum of IndemnityClaim.allowed_cents where claim_state IN {ALLOWED, SETTLED} for this warehouse" }
      - { name: bond_allocated_cents, type: integer, source: computed, description: "Sum of IndemnityClaim.bond_share_cents after the ALLOCATE run; 0 before it" }
      - { name: fund_allocated_cents, type: integer, source: computed, description: "Sum of IndemnityClaim.fund_share_cents after the ALLOCATE run; 0 before it" }
      - { name: allocated_total_cents, type: integer, source: computed, description: "bond_allocated_cents + fund_allocated_cents" }
      - { name: unpaid_claim_total_cents, type: integer, source: computed, description: "Sum of IndemnityClaim.unpaid_cents after the ALLOCATE run" }

  - name: Party
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the depositor or lender" }
      - { name: party_kind, type: enum, source: input, description: "PRODUCER_DEPOSITOR | COMMERCIAL_DEPOSITOR | LENDER — gates which foreign-key slots this party may fill; only PRODUCER_DEPOSITOR is indemnity-fund eligible", constraints: "PRODUCER_DEPOSITOR | COMMERCIAL_DEPOSITOR | LENDER" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of record" }
      - { name: credit_line_cents, type: integer, source: input, description: "Committed advance capacity; meaningful for LENDER parties only", default: 0, constraints: ">= 0" }
      - { name: committed_advance_cents, type: integer, source: computed, description: "Sum of CollateralLien.advance_limit_cents over liens where lender_party_id == this party AND lien_state == PERFECTED" }
      - { name: available_credit_cents, type: integer, source: computed, description: "credit_line_cents - committed_advance_cents; conserved quantity of the lien perfect/release compensating pair" }
      - { name: settlement_balance_cents, type: integer, source: computed, description: "Sum of DeliveryOrder.net_settlement_cents over settled orders whose requester_party_id == this party; negative means the depositor owes the warehouse" }

  - name: StorageAgreement
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; the licensed facility holding the grain" }
      - { name: depositor_party_id, type: string, source: input, description: "FK -> Party.id; party_kind MUST be PRODUCER_DEPOSITOR or COMMERCIAL_DEPOSITOR" }
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEANS | WHEAT — must match the bin commodity on every deposit", constraints: "CORN | SOYBEANS | WHEAT" }
      - { name: storage_kind, type: enum, source: input, description: "COMMINGLED | IDENTITY_PRESERVED — selects the net-bushel variant in calculations.deposit_grade_and_net_bushels and the bin eligibility rule", constraints: "COMMINGLED | IDENTITY_PRESERVED" }
      - { name: min_grade, type: enum, source: input, description: "Worst grade the warehouse will accept under this agreement", constraints: "US_NO_1 | US_NO_2 | US_NO_3 | SAMPLE_GRADE" }
      - { name: max_moisture_pct, type: number, source: input, description: "Contract moisture ceiling, one decimal place; excess drives shrink under the COMMINGLED variant" }
      - { name: storage_rate_millicents_per_bushel_day, type: integer, source: input, description: "Base storage rate in millicents (1/1000 cent) per bushel per day", constraints: ">= 0" }
      - { name: receiving_charge_cents_per_bushel, type: integer, source: input, description: "One-time receiving charge per bushel, frozen onto the receipt at issuance", constraints: ">= 0" }
      - { name: loadout_charge_cents_per_bushel, type: integer, source: input, description: "Loadout charge per delivered bushel, applied at settlement", constraints: ">= 0" }
      - { name: free_storage_days, type: integer, source: input, description: "Free days deducted by the FINAL storage variant only; the PROVISIONAL variant ignores them", constraints: ">= 0" }
      - { name: declared_value_cents_per_bushel, type: integer, source: input, description: "Declared value per bushel; copied onto the receipt as face_price_cents_per_bushel and used by the FACE_ADVANCE valuation variant", constraints: ">= 1" }
      - { name: agreement_state, type: enum, source: system, description: "ACTIVE | TERMINATED", default: "ACTIVE", constraints: "ACTIVE | TERMINATED" }
      - { name: termination_reason, type: string, source: system, description: "Free text recorded on TERMINATE; null while ACTIVE" }

  - name: Bin
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; owning facility" }
      - { name: bin_code, type: string, source: input, description: "Operator-assigned bin label; unique per warehouse_id" }
      - { name: capacity_bushels, type: integer, source: input, description: "Physical bin capacity in whole bushels", constraints: ">= 1" }
      - { name: commodity, type: enum, source: input, description: "CORN | SOYBEANS | WHEAT — deposits of any other commodity are refused", constraints: "CORN | SOYBEANS | WHEAT" }
      - { name: commingling_allowed, type: boolean, source: input, description: "True for common-mass bins; IDENTITY_PRESERVED deposits require false" }
      - { name: dedicated_agreement_id, type: string, source: system, description: "FK -> StorageAgreement.id; set to the first IDENTITY_PRESERVED agreement accepted into this bin, null for common-mass bins" }
      - { name: stored_bushels, type: integer, source: computed, description: "Physical inventory on hand: sum of accepted DepositTicket.net_bushels less delivered bushels less cumulative_shrink_bushels", default: 0 }
      - { name: held_bushels, type: integer, source: computed, description: "Sum of DeliveryOrder.requested_bushels for orders on receipts drawn from this bin whose delivery_state IN {REQUESTED, LOADED}" }
      - { name: available_bushels, type: integer, source: computed, description: "stored_bushels - held_bushels" }
      - { name: scheduled_inbound_bushels, type: integer, source: computed, description: "Sum of DepositTicket.net_bushels for tickets on this bin whose ticket_state == WEIGHED" }
      - { name: condition_state, type: enum, source: system, description: "SOUND | WATCH | OUT_OF_CONDITION — set by calculations.bin_condition_assessment", default: "SOUND", constraints: "SOUND | WATCH | OUT_OF_CONDITION" }
      - { name: last_moisture_pct, type: number, source: system, description: "Moisture reading of the most recent condition assessment; null before the first assessment" }
      - { name: last_temperature_f, type: number, source: system, description: "Temperature reading of the most recent condition assessment; null before the first assessment" }
      - { name: last_treatment_action, type: enum, source: system, description: "NONE | AERATE | TURN | BLEND_OUT — action recorded by the most recent assessment", constraints: "NONE | AERATE | TURN | BLEND_OUT" }
      - { name: last_assessed_at, type: datetime, source: system, description: "Logical-clock instant of the most recent condition assessment" }
      - { name: cumulative_shrink_bushels, type: integer, source: computed, description: "Running total of bushels removed by BLEND_OUT treatments; the documented drift term in the bushel-conservation invariant", default: 0 }
      - { name: blended_grade, type: enum, source: computed, description: "Worst assigned_grade among ACCEPTED DepositTickets in this bin by grade rank; null while the bin is empty", constraints: "US_NO_1 | US_NO_2 | US_NO_3 | SAMPLE_GRADE" }

  - name: DepositTicket
    parent: null
    common_fields: true
    fields:
      - { name: storage_agreement_id, type: string, source: input, description: "FK -> StorageAgreement.id; agreement_state MUST be ACTIVE at weigh-in" }
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; must belong to the agreement's warehouse and carry the agreement's commodity" }
      - { name: gross_bushels, type: integer, source: input, description: "Scale-ticket gross bushels before dockage and shrink", constraints: ">= 1" }
      - { name: test_weight_lbs, type: number, source: input, description: "Test weight in pounds per bushel, one decimal place; grade factor" }
      - { name: moisture_pct, type: number, source: input, description: "Moisture percentage, one decimal place; excess over agreement.max_moisture_pct drives shrink" }
      - { name: damage_pct, type: number, source: input, description: "Total damaged kernels percentage, one decimal place; grade factor" }
      - { name: foreign_material_pct, type: number, source: input, description: "Foreign material percentage, one decimal place; grade factor" }
      - { name: dockage_pct, type: number, source: input, description: "Dockage percentage removed before any moisture shrink, one decimal place" }
      - { name: fill_start_at, type: datetime, source: input, description: "Start of the bin fill window this ticket occupies" }
      - { name: fill_end_at, type: datetime, source: input, description: "End of the bin fill window; must be strictly after fill_start_at" }
      - { name: assigned_grade, type: enum, source: computed, description: "US_NO_1 | US_NO_2 | US_NO_3 | SAMPLE_GRADE from the grade factor table", constraints: "US_NO_1 | US_NO_2 | US_NO_3 | SAMPLE_GRADE" }
      - { name: dockage_bushels, type: integer, source: computed, description: "round_half_up(gross_bushels * dockage_pct / 100) — first rounding step" }
      - { name: clean_bushels, type: integer, source: computed, description: "gross_bushels - dockage_bushels — base for the shrink step" }
      - { name: shrink_bushels, type: integer, source: computed, description: "round_half_up(clean_bushels * excess_moisture_pct * MOISTURE_SHRINK_BPS_PER_POINT / 10000) under COMMINGLED; exactly 0 under IDENTITY_PRESERVED" }
      - { name: net_bushels, type: integer, source: computed, description: "clean_bushels - shrink_bushels; the receipted quantity and the stored obligation increment" }
      - { name: settlement_variant, type: enum, source: computed, description: "COMMINGLED | IDENTITY_PRESERVED copied from the agreement's storage_kind at weigh-in", constraints: "COMMINGLED | IDENTITY_PRESERVED" }
      - { name: ticket_state, type: enum, source: system, description: "WEIGHED | ACCEPTED | RECEIPTED | REJECTED", default: "WEIGHED", constraints: "WEIGHED | ACCEPTED | RECEIPTED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Why the ticket was rejected: OPERATOR_REJECTED | LICENSE_SUSPENDED | INSOLVENCY_DECLARED; null otherwise" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant the ticket was accepted into the bin; null while WEIGHED" }

  - name: WarehouseReceipt
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: system, description: "FK -> Warehouse.id; copied from the ticket's agreement at issuance" }
      - { name: deposit_ticket_id, type: string, source: input, description: "FK -> DepositTicket.id; ticket_state MUST be ACCEPTED" }
      - { name: storage_agreement_id, type: string, source: system, description: "FK -> StorageAgreement.id; copied from the ticket at issuance" }
      - { name: bin_id, type: string, source: system, description: "FK -> Bin.id; copied from the ticket, and the bin whose condition_state drives quality_flag" }
      - { name: holder_party_id, type: string, source: input, description: "FK -> Party.id; current holder of the receipt. Possession-perfected liens move this to the lender" }
      - { name: registry_control_party_id, type: string, source: system, description: "FK -> Party.id; electronic control holder in the registry, null unless an ELECTRONIC_CONTROL lien is perfected" }
      - { name: receipt_number, type: string, source: input, description: "Operator-assigned receipt number; unique per warehouse_id across every receipt_state" }
      - { name: form, type: enum, source: input, description: "NEGOTIABLE | NON_NEGOTIABLE — only NEGOTIABLE receipts may be transferred or pledged", constraints: "NEGOTIABLE | NON_NEGOTIABLE" }
      - { name: medium, type: enum, source: input, description: "PAPER | ELECTRONIC — ELECTRONIC requires Warehouse.registry_participant == true", constraints: "PAPER | ELECTRONIC" }
      - { name: quantity_bushels, type: integer, source: computed, description: "Outstanding receipted quantity; initialised to the ticket's net_bushels and reduced by partial delivery settlements" }
      - { name: grade, type: enum, source: computed, description: "Grade certified on the receipt, copied from DepositTicket.assigned_grade at issuance", constraints: "US_NO_1 | US_NO_2 | US_NO_3 | SAMPLE_GRADE" }
      - { name: moisture_pct, type: number, source: computed, description: "Moisture disclosed on the receipt, copied from the ticket at issuance" }
      - { name: face_price_cents_per_bushel, type: integer, source: computed, description: "Declared value per bushel pinned from StorageAgreement.declared_value_cents_per_bushel at issuance; later agreement edits do not change it" }
      - { name: receiving_charge_cents, type: integer, source: computed, description: "round_half_up(quantity_bushels_at_issuance * agreement.receiving_charge_cents_per_bushel); a fixed component of the warehouseman lien" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance; day zero of storage accrual and the start of the void window" }
      - { name: receipt_state, type: enum, source: system, description: "Lifecycle dimension: ISSUED | CANCELLED | VOIDED", default: "ISSUED", constraints: "ISSUED | CANCELLED | VOIDED" }
      - { name: encumbrance_state, type: enum, source: system, description: "Collateral dimension, independent of receipt_state and cyclic: UNENCUMBERED | PLEDGED | RELEASED", default: "UNENCUMBERED", constraints: "UNENCUMBERED | PLEDGED | RELEASED" }
      - { name: quality_flag, type: enum, source: computed, description: "IMPAIRED when Bin(bin_id).condition_state == OUT_OF_CONDITION, else SOUND; drives the impairment discount in collateral valuation", constraints: "SOUND | IMPAIRED" }
      - { name: provisional_storage_charge_cents, type: integer, source: computed, description: "PROVISIONAL variant of calculations.storage_charge_accrual evaluated at the current logical clock" }
      - { name: transfer_log, type: array, source: system, description: "Append-only list of { transfer_channel, from_party_id, to_party_id, effective_at } objects, one per accepted transfer, in chronological order" }

  - name: CollateralLien
    parent: null
    common_fields: true
    fields:
      - { name: receipt_id, type: string, source: input, description: "FK -> WarehouseReceipt.id; must be ISSUED, NEGOTIABLE and not currently PLEDGED" }
      - { name: lender_party_id, type: string, source: input, description: "FK -> Party.id; party_kind MUST be LENDER and MUST equal the caller's X-User-ID" }
      - { name: pledgor_party_id, type: string, source: system, description: "FK -> Party.id; the receipt's holder_party_id captured at pledge time so release can restore possession" }
      - { name: principal_cents, type: integer, source: input, description: "Advance the lender intends to carry against this receipt", constraints: ">= 1" }
      - { name: valuation_basis, type: enum, source: input, description: "MARK_TO_MARKET | FACE_ADVANCE — selects the valuation variant", constraints: "MARK_TO_MARKET | FACE_ADVANCE" }
      - { name: mark_price_cents_per_bushel, type: integer, source: input, description: "Lender's marked commodity price; used by MARK_TO_MARKET and ignored by FACE_ADVANCE", constraints: ">= 1" }
      - { name: perfection_method, type: enum, source: input, description: "POSSESSION (PAPER receipts only) | ELECTRONIC_CONTROL (ELECTRONIC receipts at registry-participating warehouses only)", constraints: "POSSESSION | ELECTRONIC_CONTROL" }
      - { name: gross_value_cents, type: integer, source: computed, description: "quantity_bushels * mark_price_cents_per_bushel (MARK_TO_MARKET) or quantity_bushels * receipt.face_price_cents_per_bushel (FACE_ADVANCE)" }
      - { name: grade_discount_bps, type: integer, source: computed, description: "GRADE_DISCOUNT_BPS[receipt.grade] plus IMPAIRED_DISCOUNT_BPS when receipt.quality_flag == IMPAIRED; always 0 under FACE_ADVANCE" }
      - { name: eligible_value_cents, type: integer, source: computed, description: "round_half_up(gross_value_cents * (10000 - grade_discount_bps) / 10000)" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "round_half_up(eligible_value_cents * LIEN_ADMIN_FEE_BPS / 10000) under MARK_TO_MARKET, keyed on the PRE-lien eligible value; 0 under FACE_ADVANCE" }
      - { name: warehouseman_lien_cents, type: integer, source: computed, description: "receipt.provisional_storage_charge_cents + receipt.receiving_charge_cents + admin_fee_cents — the prior claim that outranks the lender" }
      - { name: net_collateral_cents, type: integer, source: computed, description: "max(0, eligible_value_cents - warehouseman_lien_cents)" }
      - { name: advance_rate_bps, type: integer, source: computed, description: "ADVANCE_RATE_HIGH_BPS when net_collateral_cents >= ADVANCE_RATE_TIER_THRESHOLD_CENTS, else ADVANCE_RATE_LOW_BPS — the tier is keyed on the POST-lien net value" }
      - { name: advance_limit_cents, type: integer, source: computed, description: "round_half_up(net_collateral_cents * advance_rate_bps / 10000); the amount charged against the lender's credit line while PERFECTED" }
      - { name: margin_deficiency_cents, type: integer, source: computed, description: "max(0, principal_cents - advance_limit_cents)" }
      - { name: margin_status, type: enum, source: computed, description: "SUFFICIENT when margin_deficiency_cents == 0, else DEFICIENT", constraints: "SUFFICIENT | DEFICIENT" }
      - { name: lien_state, type: enum, source: system, description: "REQUESTED | PERFECTED | RELEASED", default: "REQUESTED", constraints: "REQUESTED | PERFECTED | RELEASED" }
      - { name: perfected_at, type: datetime, source: system, description: "Logical-clock instant perfection completed; null while REQUESTED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant of release; null until RELEASED" }
      - { name: payoff_received_cents, type: integer, source: system, description: "Payoff amount recorded at release; null until RELEASED" }

  - name: PositionReport
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; the reporting facility" }
      - { name: period_start_date, type: string, source: input, description: "ISO date, inclusive start of the reporting period" }
      - { name: period_end_date, type: string, source: input, description: "ISO date, inclusive end of the reporting period; must be >= period_start_date" }
      - { name: as_of_date, type: string, source: input, description: "ISO date the physical count was taken; must fall inside [period_start_date, period_end_date]" }
      - { name: reported_physical_bushels, type: integer, source: input, description: "Operator's declared physical count, supplied at submit; null while DRAFT", constraints: ">= 0" }
      - { name: reported_obligation_bushels, type: integer, source: input, description: "Operator's declared stored obligation, supplied at submit; null while DRAFT", constraints: ">= 0" }
      - { name: obligation_bushels, type: integer, source: computed, description: "Snapshot of Warehouse.obligation_bushels taken at submit" }
      - { name: system_physical_bushels, type: integer, source: computed, description: "Snapshot of Warehouse.system_physical_bushels taken at submit" }
      - { name: sound_physical_bushels, type: integer, source: computed, description: "Snapshot of Warehouse.sound_physical_bushels taken at submit" }
      - { name: position_variance_bushels, type: integer, source: computed, description: "sound_physical_bushels - obligation_bushels at submit" }
      - { name: count_discrepancy_bushels, type: integer, source: computed, description: "reported_physical_bushels - system_physical_bushels at submit" }
      - { name: obligation_misstatement_bushels, type: integer, source: computed, description: "reported_obligation_bushels - obligation_bushels at submit" }
      - { name: examination_tolerance_bushels, type: integer, source: computed, description: "max(EXAM_MIN_TOLERANCE_BUSHELS, round_half_up(obligation_bushels * EXAM_TOLERANCE_BPS / 10000)) at submit" }
      - { name: examination_required, type: boolean, source: computed, description: "True when any of the three deltas exceeds examination_tolerance_bushels in absolute value, strictly greater" }
      - { name: report_state, type: enum, source: system, description: "DRAFT | UNDER_EXAMINATION | ACCEPTED | REJECTED; REJECTED can be re-submitted, forming the revision cycle", default: "DRAFT", constraints: "DRAFT | UNDER_EXAMINATION | ACCEPTED | REJECTED" }
      - { name: revision_count, type: integer, source: system, description: "Number of submissions after the first; incremented on every re-submit out of REJECTED", default: 0 }
      - { name: examination_result, type: enum, source: system, description: "PASS | DEFICIENT | CRITICAL recorded by the examiner; null until examined", constraints: "PASS | DEFICIENT | CRITICAL" }
      - { name: examined_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the examining StateRegulator; must differ from Warehouse.licensed_by_user_id" }
      - { name: findings_note, type: string, source: system, description: "Examiner narrative; null until examined" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of the most recent submission; null while DRAFT" }

  - name: DeliveryOrder
    parent: null
    common_fields: true
    fields:
      - { name: receipt_id, type: string, source: input, description: "FK -> WarehouseReceipt.id; the receipt whose delivery right is being exercised" }
      - { name: requester_party_id, type: string, source: system, description: "FK -> Party.id; the receipt's holder_party_id at request time, taken from the caller's X-User-ID" }
      - { name: requested_bushels, type: integer, source: input, description: "Bushels demanded out of store; holds this quantity on the bin until settled or cancelled", constraints: ">= 1" }
      - { name: appointment_start_at, type: datetime, source: input, description: "Inclusive start of the half-open loadout appointment window" }
      - { name: appointment_end_at, type: datetime, source: input, description: "Exclusive end of the half-open loadout appointment window; must be strictly after appointment_start_at" }
      - { name: lane_index, type: integer, source: computed, description: "Lowest integer in [0, Warehouse.loadout_lane_count) not occupied by any overlapping order in delivery_state IN {REQUESTED, LOADED}" }
      - { name: delivered_bushels, type: integer, source: input, description: "Bushels actually loaded out, supplied at load; null while REQUESTED", constraints: ">= 1" }
      - { name: delivered_test_weight_lbs, type: number, source: input, description: "Test weight measured at loadout, supplied at load" }
      - { name: delivered_moisture_pct, type: number, source: input, description: "Moisture measured at loadout, supplied at load" }
      - { name: delivered_damage_pct, type: number, source: input, description: "Damage measured at loadout, supplied at load" }
      - { name: delivered_foreign_material_pct, type: number, source: input, description: "Foreign material measured at loadout, supplied at load" }
      - { name: delivered_grade, type: enum, source: computed, description: "Grade of the loaded grain from the same grade factor table used at weigh-in; null until loaded", constraints: "US_NO_1 | US_NO_2 | US_NO_3 | SAMPLE_GRADE" }
      - { name: grade_delta_bps, type: integer, source: computed, description: "max(0, GRADE_DISCOUNT_BPS[delivered_grade] - GRADE_DISCOUNT_BPS[receipt.grade]); asymmetric — better-than-receipt grade yields 0" }
      - { name: settlement_price_cents_per_bushel, type: integer, source: input, description: "Posted price used for the quality adjustment, supplied at settle; null until settled", constraints: ">= 1" }
      - { name: quality_adjustment_cents, type: integer, source: computed, description: "round_half_up(delivered_bushels * settlement_price_cents_per_bushel * grade_delta_bps / 10000); credit owed to the depositor" }
      - { name: storage_charge_cents, type: integer, source: computed, description: "FINAL variant of calculations.storage_charge_accrual on receipt.quantity_bushels as of load time" }
      - { name: loadout_charge_cents, type: integer, source: computed, description: "round_half_up(delivered_bushels * agreement.loadout_charge_cents_per_bushel)" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "quality_adjustment_cents - storage_charge_cents - loadout_charge_cents; negative means the depositor owes the warehouse" }
      - { name: delivery_state, type: enum, source: system, description: "REQUESTED | LOADED | SETTLED_FULL | SETTLED_PARTIAL | CANCELLED", default: "REQUESTED", constraints: "REQUESTED | LOADED | SETTLED_FULL | SETTLED_PARTIAL | CANCELLED" }
      - { name: loaded_at, type: datetime, source: system, description: "Logical-clock instant of loadout; null until LOADED" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock instant of settlement; null until settled" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical-clock instant of cancellation; null unless CANCELLED" }
      - { name: cancellation_reason, type: string, source: system, description: "Free text or INSOLVENCY_DECLARED for system cancellations; null unless CANCELLED" }

  - name: IndemnityClaim
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; insolvency_state MUST be CLAIMS_OPEN at filing" }
      - { name: receipt_id, type: string, source: input, description: "FK -> WarehouseReceipt.id; the receipt the claim is founded on, receipt_state MUST be ISSUED" }
      - { name: claimant_party_id, type: string, source: input, description: "FK -> Party.id; MUST equal the caller's X-User-ID and be the receipt's holder_party_id or registry_control_party_id" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount the claimant asserts", constraints: ">= 1" }
      - { name: entitlement_cents, type: integer, source: computed, description: "Receipt value at the insolvency price net of the warehouseman lien; computed at adjudication" }
      - { name: allowed_cents, type: integer, source: computed, description: "min(claimed_cents, entitlement_cents) on ALLOW; 0 on DISALLOW" }
      - { name: fund_eligible, type: boolean, source: computed, description: "True only when the claimant's party_kind is PRODUCER_DEPOSITOR — the depositor-protection restriction on the indemnity fund" }
      - { name: bond_share_cents, type: integer, source: computed, description: "Tier-1 pro-rata share of the bond proceeds assigned by the ALLOCATE run; 0 before it", default: 0 }
      - { name: fund_share_cents, type: integer, source: computed, description: "Tier-2 indemnity fund share assigned by the ALLOCATE run; 0 before it and 0 for fund-ineligible claimants", default: 0 }
      - { name: unpaid_cents, type: integer, source: computed, description: "allowed_cents - bond_share_cents - fund_share_cents after the ALLOCATE run", default: 0 }
      - { name: claim_state, type: enum, source: system, description: "FILED | ALLOWED | DISALLOWED | SETTLED", default: "FILED", constraints: "FILED | ALLOWED | DISALLOWED | SETTLED" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the adjudicating StateRegulator; null while FILED" }
      - { name: adjudication_note, type: string, source: system, description: "Adjudicator narrative; null while FILED" }

# =============================================================================
# §1.2 State Machine Table
#   Warehouse and WarehouseReceipt each carry TWO independent dimensions; each
#   dimension is declared as its own block over the same entity.
# =============================================================================
state_machines:

  # --- Warehouse, dimension 1 of 2: licensing -------------------------------
  - entity: Warehouse
    initial_state: APPLIED           # field: license_state
    terminal_states: [REVOKED, DENIED]
    transitions:
      - from: APPLIED
        to: LICENSED
        trigger: "POST /warehouses/{warehouse_id}/license-decision with decision=ISSUE"
        actor: StateRegulator
        preconditions:
          - "license_state == APPLIED"
          - "net_worth_shortfall_cents <= net_worth_tolerance_cents"
          - "bond_deficiency_cents == 0"
        side_effects:
          - "sets licensed_by_user_id to the deciding regulator's X-User-ID"
          - "sets license_effective_date and license_expiry_date from the request"
          - "recomputes operational_posture (reaches OPEN when insolvency_state == SOLVENT and the position variance is inside tolerance)"
      - from: APPLIED
        to: DENIED
        trigger: "POST /warehouses/{warehouse_id}/license-decision with decision=DENY"
        actor: StateRegulator
        preconditions: ["license_state == APPLIED"]
        side_effects:
          - "sets licensed_by_user_id to the deciding regulator's X-User-ID"
          - "operational_posture stays CLOSED permanently"
        note: "Terminal. A denied application cannot be revived; a new Warehouse row must be created."
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /warehouses/{warehouse_id}/license-decision with decision=SUSPEND, or system cascade from a CRITICAL examination result"
        actor: StateRegulator | system
        preconditions: ["license_state == LICENSED"]
        side_effects:
          - "operational_posture becomes CLOSED"
          - "every DepositTicket of this warehouse in ticket_state WEIGHED moves to REJECTED with rejection_reason LICENSE_SUSPENDED"
          - "DepositTickets already ACCEPTED and receipts already ISSUED are untouched — the stored obligation survives suspension"
      - from: SUSPENDED
        to: LICENSED
        trigger: "POST /warehouses/{warehouse_id}/license-decision with decision=REINSTATE"
        actor: StateRegulator
        preconditions:
          - "license_state == SUSPENDED"
          - "net_worth_shortfall_cents <= net_worth_tolerance_cents"
          - "bond_deficiency_cents == 0"
          - "no PositionReport of this warehouse is in report_state UNDER_EXAMINATION"
        side_effects:
          - "recomputes operational_posture; it returns to OPEN only if the position variance is inside tolerance and the latest submitted report is not REJECTED"
        note: "Revert edge — the licensing dimension is branching-with-revert, not linear."
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /warehouses/{warehouse_id}/license-decision with decision=REVOKE"
        actor: StateRegulator
        preconditions: ["license_state == SUSPENDED"]
        side_effects:
          - "operational_posture becomes CLOSED permanently"
          - "every DepositTicket in ticket_state WEIGHED moves to REJECTED with rejection_reason LICENSE_SUSPENDED"
      - from: LICENSED
        to: REVOKED
        trigger: "POST /warehouses/{warehouse_id}/license-decision with decision=REVOKE"
        actor: StateRegulator
        preconditions: ["license_state == LICENSED"]
        side_effects:
          - "operational_posture becomes CLOSED permanently"
          - "every DepositTicket in ticket_state WEIGHED moves to REJECTED with rejection_reason LICENSE_SUSPENDED"
        note: "Revocation may skip SUSPENDED — the licensing dimension is non-linear."

  # --- Warehouse, dimension 2 of 2: insolvency ------------------------------
  - entity: Warehouse
    initial_state: SOLVENT           # field: insolvency_state
    terminal_states: [CLOSED]
    transitions:
      - from: SOLVENT
        to: DECLARED
        trigger: "POST /warehouses/{warehouse_id}/insolvency with action=DECLARE"
        actor: StateRegulator
        preconditions:
          - "insolvency_state == SOLVENT"
          - "license_state != DENIED"
        side_effects:
          - "sets insolvency_declared_at to the current logical clock and insolvency_price_cents_per_bushel from the request"
          - "operational_posture becomes CLOSED regardless of license_state"
          - "every DeliveryOrder in delivery_state REQUESTED moves to CANCELLED with cancellation_reason INSOLVENCY_DECLARED, releasing its held bushels"
          - "every DepositTicket in ticket_state WEIGHED moves to REJECTED with rejection_reason INSOLVENCY_DECLARED"
        note: "Independent of the licensing dimension: a LICENSED warehouse can be DECLARED, and a SUSPENDED warehouse can stay SOLVENT."
      - from: DECLARED
        to: CLAIMS_OPEN
        trigger: "POST /warehouses/{warehouse_id}/insolvency with action=OPEN_CLAIMS"
        actor: StateRegulator
        preconditions: ["insolvency_state == DECLARED"]
        side_effects: ["IndemnityClaim filing becomes permitted for this warehouse"]
      - from: CLAIMS_OPEN
        to: ALLOCATED
        trigger: "POST /warehouses/{warehouse_id}/insolvency with action=ALLOCATE"
        actor: StateRegulator
        preconditions:
          - "insolvency_state == CLAIMS_OPEN"
          - "no IndemnityClaim of this warehouse remains in claim_state FILED"
        side_effects:
          - "runs calculations.indemnity_waterfall_allocation over every ALLOWED claim"
          - "writes bond_share_cents, fund_share_cents and unpaid_cents on each ALLOWED claim and moves it to SETTLED"
          - "sets Warehouse.allowed_claim_total_cents, bond_allocated_cents, fund_allocated_cents, allocated_total_cents and unpaid_claim_total_cents"
        note: "Further claim filing is refused once ALLOCATED — the allocation basis is frozen."
      - from: ALLOCATED
        to: CLOSED
        trigger: "POST /warehouses/{warehouse_id}/insolvency with action=CLOSE"
        actor: StateRegulator
        preconditions: ["insolvency_state == ALLOCATED"]
        side_effects: ["proceeding is terminal; no further insolvency action is accepted"]

  # --- StorageAgreement -----------------------------------------------------
  - entity: StorageAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /storage-agreements/{agreement_id}/terminate"
        actor: WarehouseOperator
        preconditions:
          - "agreement_state == ACTIVE"
          - "no WarehouseReceipt under this agreement is in receipt_state ISSUED"
          - "no DepositTicket under this agreement is in ticket_state WEIGHED or ACCEPTED"
        side_effects:
          - "sets termination_reason from the request"
          - "releases any Bin.dedicated_agreement_id pointing at this agreement"

  # --- Bin condition (grade maintenance / out-of-condition handling) --------
  - entity: Bin
    initial_state: SOUND             # field: condition_state
    terminal_states: []
    transitions:
      - from: SOUND
        to: WATCH
        trigger: "POST /bins/{bin_id}/condition-assessment whose readings derive WATCH"
        actor: WarehouseOperator
        preconditions: ["assessment readings derive target WATCH per calculations.bin_condition_assessment"]
        side_effects:
          - "stores last_moisture_pct, last_temperature_f, last_treatment_action and last_assessed_at"
      - from: WATCH
        to: OUT_OF_CONDITION
        trigger: "POST /bins/{bin_id}/condition-assessment whose readings derive OUT_OF_CONDITION"
        actor: WarehouseOperator
        preconditions: ["assessment readings derive target OUT_OF_CONDITION per calculations.bin_condition_assessment"]
        side_effects:
          - "every ISSUED WarehouseReceipt on this bin recomputes quality_flag to IMPAIRED"
          - "every PERFECTED CollateralLien on those receipts is revalued (grade_discount_bps gains IMPAIRED_DISCOUNT_BPS), lowering advance_limit_cents and possibly flipping margin_status to DEFICIENT"
          - "each affected lender Party's committed_advance_cents and available_credit_cents are recomputed from the new advance limits"
          - "Warehouse.sound_physical_bushels drops by this bin's stored_bushels, moving position_variance_bushels and possibly operational_posture to RESTRICTED"
        note: "Three-hop cascade: Bin → WarehouseReceipt → CollateralLien → Party, plus the warehouse-level position effect."
      - from: SOUND
        to: OUT_OF_CONDITION
        trigger: "POST /bins/{bin_id}/condition-assessment whose readings derive OUT_OF_CONDITION"
        actor: WarehouseOperator
        preconditions: ["assessment readings derive target OUT_OF_CONDITION per calculations.bin_condition_assessment"]
        side_effects:
          - "identical cascade to the WATCH → OUT_OF_CONDITION edge"
        note: "WATCH may be skipped entirely — the condition dimension is non-linear."
      - from: OUT_OF_CONDITION
        to: WATCH
        trigger: "POST /bins/{bin_id}/condition-assessment with treatment_action in {AERATE, TURN, DRY, BLEND} whose post-treatment readings derive WATCH"
        actor: WarehouseOperator
        preconditions: ["assessment readings derive target WATCH per calculations.bin_condition_assessment"]
        side_effects:
          - "every ISSUED receipt on this bin recomputes quality_flag to SOUND"
          - "PERFECTED liens on those receipts are revalued upward and lender credit is restored"
          - "Warehouse.sound_physical_bushels regains this bin's stored_bushels"
          - "when treatment_action == BLEND, stored_bushels is reduced by round_half_up(stored_bushels * BLEND_SHRINK_BPS / 10000) and cumulative_shrink_bushels grows by the same amount"
        note: "Compensating edge — reverses the impairment cascade."
      - from: WATCH
        to: SOUND
        trigger: "POST /bins/{bin_id}/condition-assessment whose readings derive SOUND"
        actor: WarehouseOperator
        preconditions: ["assessment readings derive target SOUND per calculations.bin_condition_assessment"]
        side_effects: ["stores the readings; no receipt or lien effect since quality_flag was already SOUND"]
      - from: OUT_OF_CONDITION
        to: SOUND
        trigger: "POST /bins/{bin_id}/condition-assessment whose readings derive SOUND"
        actor: WarehouseOperator
        preconditions: ["assessment readings derive target SOUND per calculations.bin_condition_assessment"]
        side_effects: ["identical de-impairment cascade to the OUT_OF_CONDITION → WATCH edge"]

  # --- DepositTicket --------------------------------------------------------
  - entity: DepositTicket
    initial_state: WEIGHED
    terminal_states: [RECEIPTED, REJECTED]
    transitions:
      - from: WEIGHED
        to: ACCEPTED
        trigger: "POST /deposit-tickets/{ticket_id}/accept (carries expected_bin_version)"
        actor: WarehouseOperator
        preconditions:
          - "ticket_state == WEIGHED"
          - "expected_bin_version matches Bin.version"
          - "Warehouse.license_state == LICENSED and insolvency_state == SOLVENT"
          - "Bin.condition_state != OUT_OF_CONDITION"
          - "assigned_grade rank is at least the agreement's min_grade"
          - "Bin.available_bushels >= net_bushels"
        side_effects:
          - "sets accepted_at from the logical clock"
          - "increments Bin.version by 1 and raises Bin.stored_bushels by net_bushels"
          - "raises Bin.cumulative_shrink_bushels by shrink_bushels"
          - "recomputes Bin.blended_grade and Warehouse.obligation_bushels / system_physical_bushels"
      - from: ACCEPTED
        to: RECEIPTED
        trigger: "POST /receipts (system effect of issuing a receipt against this ticket)"
        actor: system
        preconditions: ["ticket_state == ACCEPTED", "no WarehouseReceipt already references this ticket"]
        side_effects:
          - "the ticket's net_bushels shifts from the unreceipted to the receipted side of Warehouse.obligation_bushels"
      - from: WEIGHED
        to: REJECTED
        trigger: "POST /deposit-tickets/{ticket_id}/reject, or system cascade from license SUSPEND/REVOKE, insolvency DECLARE, or a CRITICAL examination result"
        actor: WarehouseOperator | system
        preconditions: ["ticket_state == WEIGHED"]
        side_effects:
          - "sets rejection_reason (OPERATOR_REJECTED | LICENSE_SUSPENDED | INSOLVENCY_DECLARED)"
          - "frees the ticket's bin fill window for other tickets"
        note: "Only WEIGHED tickets are rejectable — an ACCEPTED ticket has already entered the commingled mass."

  # --- WarehouseReceipt, dimension 1 of 2: lifecycle ------------------------
  - entity: WarehouseReceipt
    initial_state: ISSUED            # field: receipt_state
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /delivery-orders/{order_id}/settle where delivered_bushels equals the receipt's outstanding quantity_bushels"
        actor: WarehouseOperator
        preconditions:
          - "receipt_state == ISSUED"
          - "encumbrance_state != PLEDGED"
          - "the delivery order is in delivery_state LOADED"
        side_effects:
          - "quantity_bushels drops to 0 and the receipt leaves Warehouse.obligation_bushels entirely"
          - "Bin.stored_bushels drops by delivered_bushels and the delivery hold is released"
          - "the delivery order moves to SETTLED_FULL"
        note: "Cancellation on delivery. A partial settlement instead leaves the receipt ISSUED with a reduced quantity_bushels."
      - from: ISSUED
        to: VOIDED
        trigger: "POST /receipts/{receipt_id}/void"
        actor: WarehouseOperator
        preconditions:
          - "receipt_state == ISSUED"
          - "encumbrance_state != PLEDGED"
          - "no DeliveryOrder on this receipt is in delivery_state REQUESTED or LOADED"
          - "current logical clock is within RECEIPT_VOID_WINDOW_HOURS of issued_at"
        side_effects:
          - "the receipt's quantity_bushels leaves Warehouse.receipted_obligation_bushels"
          - "the source DepositTicket returns from RECEIPTED to ACCEPTED, so the same bushels re-enter obligation_bushels as unreceipted stock — the total obligation is conserved"
          - "Bin.stored_bushels is unchanged: voiding a receipt does not move grain"
        note: "Compensating transition — pairs with issuance to conserve Warehouse.obligation_bushels."

  # --- WarehouseReceipt, dimension 2 of 2: encumbrance ----------------------
  - entity: WarehouseReceipt
    initial_state: UNENCUMBERED      # field: encumbrance_state
    terminal_states: []
    transitions:
      - from: UNENCUMBERED
        to: PLEDGED
        trigger: "POST /collateral-liens/{lien_id}/perfect"
        actor: Lender
        preconditions:
          - "receipt_state == ISSUED"
          - "form == NEGOTIABLE"
          - "encumbrance_state != PLEDGED"
          - "perfection_method matches the receipt medium (POSSESSION↔PAPER, ELECTRONIC_CONTROL↔ELECTRONIC at a registry participant)"
          - "the lender's available_credit_cents >= the lien's advance_limit_cents"
        side_effects:
          - "POSSESSION perfection moves holder_party_id to the lender; ELECTRONIC_CONTROL sets registry_control_party_id instead and leaves holder_party_id alone"
          - "the lien moves to PERFECTED and its advance_limit_cents is committed against the lender's credit line"
      - from: PLEDGED
        to: RELEASED
        trigger: "POST /collateral-liens/{lien_id}/release"
        actor: Lender
        preconditions: ["the referenced lien is in lien_state PERFECTED"]
        side_effects:
          - "restores holder_party_id to the lien's pledgor_party_id and clears registry_control_party_id"
          - "frees the lien's currently committed advance_limit_cents from the lender's committed_advance_cents"
      - from: RELEASED
        to: PLEDGED
        trigger: "POST /collateral-liens/{lien_id}/perfect for a later lien on the same receipt"
        actor: Lender
        preconditions:
          - "receipt_state == ISSUED"
          - "form == NEGOTIABLE"
          - "no other lien on this receipt is in lien_state PERFECTED"
        side_effects: ["identical to the UNENCUMBERED → PLEDGED edge"]
        note: "Cycle: a receipt can be re-pledged after release, so the encumbrance dimension has no terminal state and is independent of receipt_state."

  # --- CollateralLien -------------------------------------------------------
  - entity: CollateralLien
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUESTED
        to: PERFECTED
        trigger: "POST /collateral-liens/{lien_id}/perfect"
        actor: Lender
        preconditions:
          - "lien_state == REQUESTED"
          - "the receipt's encumbrance_state != PLEDGED"
          - "Warehouse.operational_posture != CLOSED"
          - "lender_party_id equals the caller's X-User-ID"
          - "Party(lender_party_id).available_credit_cents >= advance_limit_cents"
        side_effects:
          - "sets perfected_at from the logical clock"
          - "drives the receipt's encumbrance dimension to PLEDGED"
          - "raises Party(lender_party_id).committed_advance_cents by advance_limit_cents"
      - from: PERFECTED
        to: RELEASED
        trigger: "POST /collateral-liens/{lien_id}/release"
        actor: Lender
        preconditions: ["lien_state == PERFECTED", "lender_party_id equals the caller's X-User-ID"]
        side_effects:
          - "sets released_at and payoff_received_cents"
          - "drives the receipt's encumbrance dimension to RELEASED"
          - "lowers Party(lender_party_id).committed_advance_cents by the lien's currently committed advance_limit_cents, so the lender's available_credit_cents returns to its pre-perfection value"
        note: "Compensating transition — the credit-line ledger returns to its pre-perfection value even if POST /collateral-liens/{lien_id}/revalue moved the committed amount in between."
      - from: REQUESTED
        to: RELEASED
        trigger: "POST /collateral-liens/{lien_id}/release on a lien that was never perfected"
        actor: Lender
        preconditions: ["lien_state == REQUESTED", "lender_party_id equals the caller's X-User-ID"]
        side_effects:
          - "sets released_at with payoff_received_cents 0"
          - "no credit-line effect and no receipt encumbrance effect, because nothing was ever committed"
        note: "Withdrawal of an unperfected request; PERFECTED may be skipped."

  # --- PositionReport -------------------------------------------------------
  - entity: PositionReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: UNDER_EXAMINATION
        trigger: "POST /position-reports/{report_id}/submit where the computed examination_required is true"
        actor: WarehouseOperator
        preconditions: ["report_state == DRAFT", "no other PositionReport of this warehouse is in report_state UNDER_EXAMINATION"]
        side_effects:
          - "snapshots obligation_bushels, system_physical_bushels, sound_physical_bushels, the three deltas and examination_tolerance_bushels"
          - "sets submitted_at from the logical clock"
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /position-reports/{report_id}/submit where the computed examination_required is false"
        actor: WarehouseOperator
        preconditions: ["report_state == DRAFT"]
        side_effects:
          - "snapshots the same fields and sets examination_result PASS with examined_by_user_id null"
          - "clears any RESTRICTED posture caused by a previously REJECTED report"
        note: "Branch point: the same trigger reaches two different states purely from the computed tolerance test."
      - from: UNDER_EXAMINATION
        to: ACCEPTED
        trigger: "POST /position-reports/{report_id}/examine with result=PASS"
        actor: StateRegulator
        preconditions:
          - "report_state == UNDER_EXAMINATION"
          - "the examiner's X-User-ID differs from Warehouse.licensed_by_user_id"
        side_effects: ["records examination_result, examined_by_user_id and findings_note"]
      - from: UNDER_EXAMINATION
        to: REJECTED
        trigger: "POST /position-reports/{report_id}/examine with result=DEFICIENT or result=CRITICAL"
        actor: StateRegulator
        preconditions:
          - "report_state == UNDER_EXAMINATION"
          - "the examiner's X-User-ID differs from Warehouse.licensed_by_user_id"
        side_effects:
          - "records examination_result, examined_by_user_id and findings_note"
          - "Warehouse.operational_posture becomes RESTRICTED (DEFICIENT)"
          - "on CRITICAL only: Warehouse.license_state moves LICENSED → SUSPENDED, operational_posture becomes CLOSED, and every DepositTicket in ticket_state WEIGHED moves to REJECTED"
        note: "Conditional cascade — the DEFICIENT and CRITICAL branches share a state target but not a side-effect set."
      - from: REJECTED
        to: UNDER_EXAMINATION
        trigger: "POST /position-reports/{report_id}/submit with corrected figures where examination_required is true"
        actor: WarehouseOperator
        preconditions: ["report_state == REJECTED", "no other PositionReport of this warehouse is in report_state UNDER_EXAMINATION"]
        side_effects:
          - "increments revision_count by 1, clears examination_result / examined_by_user_id / findings_note, and re-snapshots every derived figure"
        note: "Cycle: REJECTED → UNDER_EXAMINATION → REJECTED can repeat; revision_count is the loop counter."
      - from: REJECTED
        to: ACCEPTED
        trigger: "POST /position-reports/{report_id}/submit with corrected figures where examination_required is false"
        actor: WarehouseOperator
        preconditions: ["report_state == REJECTED"]
        side_effects:
          - "increments revision_count by 1, sets examination_result PASS, and clears the RESTRICTED posture attributable to this report"

  # --- DeliveryOrder --------------------------------------------------------
  - entity: DeliveryOrder
    initial_state: REQUESTED
    terminal_states: [SETTLED_FULL, SETTLED_PARTIAL, CANCELLED]
    transitions:
      - from: REQUESTED
        to: LOADED
        trigger: "POST /delivery-orders/{order_id}/load"
        actor: WarehouseOperator
        preconditions:
          - "delivery_state == REQUESTED"
          - "Warehouse.operational_posture != CLOSED"
          - "Bin.condition_state != OUT_OF_CONDITION"
          - "delivered_bushels <= requested_bushels"
        side_effects:
          - "grades the loaded grain, sets delivered_grade and grade_delta_bps, and sets loaded_at"
          - "computes storage_charge_cents with the FINAL storage variant and loadout_charge_cents"
      - from: LOADED
        to: SETTLED_FULL
        trigger: "POST /delivery-orders/{order_id}/settle where delivered_bushels == receipt.quantity_bushels"
        actor: WarehouseOperator
        preconditions: ["delivery_state == LOADED", "receipt.encumbrance_state != PLEDGED"]
        side_effects:
          - "computes quality_adjustment_cents and net_settlement_cents"
          - "moves the receipt to CANCELLED and zeroes its quantity_bushels"
          - "lowers Bin.stored_bushels by delivered_bushels and releases the hold"
          - "adjusts Party(requester).settlement_balance_cents by net_settlement_cents"
      - from: LOADED
        to: SETTLED_PARTIAL
        trigger: "POST /delivery-orders/{order_id}/settle where delivered_bushels < receipt.quantity_bushels"
        actor: WarehouseOperator
        preconditions: ["delivery_state == LOADED", "receipt.encumbrance_state != PLEDGED"]
        side_effects:
          - "computes quality_adjustment_cents and net_settlement_cents on the delivered quantity only"
          - "leaves the receipt in receipt_state ISSUED with quantity_bushels reduced by delivered_bushels"
          - "lowers Bin.stored_bushels by delivered_bushels and releases the hold"
          - "adjusts Party(requester).settlement_balance_cents by net_settlement_cents"
        note: "Branch: the same trigger reaches two states with different receipt-side effects, decided by a quantity comparison."
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /delivery-orders/{order_id}/cancel, or system cascade from insolvency DECLARE"
        actor: Depositor | system
        preconditions: ["delivery_state == REQUESTED"]
        side_effects:
          - "releases the held bushels back to Bin.available_bushels and frees the loadout lane"
          - "sets cancelled_at and cancellation_reason"

  # --- IndemnityClaim -------------------------------------------------------
  - entity: IndemnityClaim
    initial_state: FILED
    terminal_states: [DISALLOWED, SETTLED]
    transitions:
      - from: FILED
        to: ALLOWED
        trigger: "POST /indemnity-claims/{claim_id}/adjudicate with decision=ALLOW"
        actor: StateRegulator
        preconditions:
          - "claim_state == FILED"
          - "Warehouse.insolvency_state == CLAIMS_OPEN"
        side_effects:
          - "computes entitlement_cents at the insolvency price net of the warehouseman lien, then allowed_cents = min(claimed_cents, entitlement_cents)"
          - "sets fund_eligible from the claimant's party_kind and records adjudicated_by_user_id"
      - from: FILED
        to: DISALLOWED
        trigger: "POST /indemnity-claims/{claim_id}/adjudicate with decision=DISALLOW"
        actor: StateRegulator
        preconditions: ["claim_state == FILED", "Warehouse.insolvency_state == CLAIMS_OPEN"]
        side_effects: ["allowed_cents stays 0 so the claim draws nothing from either tier of the waterfall"]
      - from: ALLOWED
        to: SETTLED
        trigger: "POST /warehouses/{warehouse_id}/insolvency with action=ALLOCATE (system effect on each allowed claim)"
        actor: system
        preconditions: ["claim_state == ALLOWED"]
        side_effects:
          - "writes bond_share_cents, fund_share_cents and unpaid_cents from calculations.indemnity_waterfall_allocation"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC only
# =============================================================================
concurrency_rules:
  - rule_id: receipt-issue-stale-warehouse
    parent_entity: Warehouse
    write_endpoint: "POST /receipts"
    occ_field: "expected_warehouse_version"
    description: |
      Issuing a WarehouseReceipt against a Warehouse whose version has advanced
      since the operator last read it is rejected. Receipt issuance is admitted
      against licensed_capacity_bushels using the warehouse's receipted
      obligation, so a second issuance for a different ACCEPTED ticket would
      itself legitimately succeed under the natural semantics; the stale
      expected_warehouse_version is what identifies an operator working from an
      outdated view of the remaining capacity.
    error_id: ERR_STALE_WAREHOUSE_VERSION
    http_status: 412

  - rule_id: deposit-accept-stale-bin
    parent_entity: Bin
    write_endpoint: "POST /deposit-tickets/{ticket_id}/accept"
    occ_field: "expected_bin_version"
    description: |
      Accepting a DepositTicket into a Bin whose version has advanced since the
      operator last read it is rejected. Accepting a second, different WEIGHED
      ticket into the same bin is a legitimate operation that would otherwise
      succeed, so the only deterministic guard against admitting grain on a
      stale reading of Bin.available_bushels is the version check.
    error_id: ERR_STALE_BIN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#   All money is integer cents; all quantities are integer bushels.
#   round_half_up means: round to the nearest integer, ties away from zero.
# =============================================================================
calculations:

  - name: license_bond_and_net_worth_requirement
    trigger: "On POST /warehouses, on PATCH /warehouses/{warehouse_id}/financials, and re-evaluated as a precondition of every license ISSUE or REINSTATE decision"
    algorithm: threshold
    formula: |
      required_net_worth_cents =
          max(MIN_NET_WORTH_CENTS[license_program],
              licensed_capacity_bushels * NET_WORTH_CENTS_PER_BUSHEL[license_program])

      net_worth_shortfall_cents = max(0, required_net_worth_cents - net_worth_cents)
      net_worth_tolerance_cents = round_half_up(
          required_net_worth_cents * NET_WORTH_SHORTFALL_TOLERANCE_BPS / 10000)

      # A shortfall is forgiven up to the tolerance, but it is ALWAYS surcharged
      # onto the bond even when forgiven.
      base_bond_cents = max(BOND_MIN_CENTS[license_program],
                            licensed_capacity_bushels * BOND_CENTS_PER_BUSHEL[license_program])
      required_bond_cents = base_bond_cents + round_half_up(
          net_worth_shortfall_cents * BOND_SHORTFALL_MULTIPLIER_BPS / 10000)

      bond_deficiency_cents = max(0, required_bond_cents - bond_amount_cents)

      license_eligible = (net_worth_shortfall_cents <= net_worth_tolerance_cents)
                         and (bond_deficiency_cents == 0)
    input_set: "The Warehouse row alone; no child entities participate"
    constants:
      MIN_NET_WORTH_CENTS: { STATE: 5000000, FEDERAL: 10000000 }
      NET_WORTH_CENTS_PER_BUSHEL: { STATE: 4, FEDERAL: 8 }
      BOND_MIN_CENTS: { STATE: 2500000, FEDERAL: 6000000 }
      BOND_CENTS_PER_BUSHEL: { STATE: 5, FEDERAL: 3 }
      NET_WORTH_SHORTFALL_TOLERANCE_BPS: 2500
      BOND_SHORTFALL_MULTIPLIER_BPS: 15000
    precision: "Integer cents, round_half_up on the shortfall surcharge and on the tolerance"

  - name: deposit_grade_and_net_bushels
    trigger: "On POST /deposit-tickets (weigh-in), and again on POST /delivery-orders/{order_id}/load for the delivered-grain factors"
    algorithm: threshold
    formula: |
      # Grade: the assigned grade is the LOWEST grade whose every factor limit is
      # satisfied by all three factors at once (worst factor governs).
      assigned_grade =
          US_NO_1 if test_weight_lbs >= 56.0 and damage_pct <= 3.0 and foreign_material_pct <= 2.0
          else US_NO_2 if test_weight_lbs >= 54.0 and damage_pct <= 5.0 and foreign_material_pct <= 3.0
          else US_NO_3 if test_weight_lbs >= 52.0 and damage_pct <= 7.0 and foreign_material_pct <= 4.0
          else SAMPLE_GRADE

      # Quantity: two SEQUENTIAL rounded steps. Dockage is removed and rounded
      # FIRST; the moisture shrink is then applied to the already-rounded clean
      # bushels. Collapsing the two factors into one multiplication is wrong.
      dockage_bushels = round_half_up(gross_bushels * dockage_pct / 100)
      clean_bushels   = gross_bushels - dockage_bushels
      excess_moisture_pct = max(0, moisture_pct - agreement.max_moisture_pct)
      shrink_bushels  = round_half_up(
          clean_bushels * excess_moisture_pct * MOISTURE_SHRINK_BPS_PER_POINT / 10000)
      net_bushels     = clean_bushels - shrink_bushels
    input_set: "The single DepositTicket being weighed, plus max_moisture_pct and storage_kind from its StorageAgreement"
    constants:
      MOISTURE_SHRINK_BPS_PER_POINT: 118
      GRADE_RANK: { US_NO_1: 1, US_NO_2: 2, US_NO_3: 3, SAMPLE_GRADE: 4 }
    precision: "Integer bushels; round_half_up applied independently at each of the two steps, never once on a combined factor"
    variants:
      - name: COMMINGLED
        when: "StorageAgreement.storage_kind == COMMINGLED — grain joins the fungible mass in the bin"
        difference: "Moisture shrink is assessed as written; the depositor bears the drying loss, so net_bushels < clean_bushels whenever moisture exceeds the agreement maximum"
      - name: IDENTITY_PRESERVED
        when: "StorageAgreement.storage_kind == IDENTITY_PRESERVED — the lot is stored separately and returned in kind"
        difference: "shrink_bushels is forced to exactly 0 regardless of moisture, so net_bushels == clean_bushels; the dockage step is unchanged"

  - name: storage_charge_accrual
    trigger: "PROVISIONAL on every read of a WarehouseReceipt and on collateral valuation; FINAL on POST /delivery-orders/{order_id}/load and on indemnity entitlement"
    algorithm: tiered_pricing
    formula: |
      day_count = (as_of_date - date(receipt.issued_at)).days + 1     # inclusive of both endpoints

      chargeable_days = day_count                                      # PROVISIONAL
      # chargeable_days = max(0, day_count - agreement.free_storage_days)   # FINAL

      base_days      = min(chargeable_days, BASE_TIER_DAYS)
      surcharge_days = max(0, chargeable_days - BASE_TIER_DAYS)
      rate = agreement.storage_rate_millicents_per_bushel_day

      # Each tier is rounded to cents on its own, then summed.
      base_cents = round_half_up(quantity_bushels * rate * base_days / 1000)
      surcharge_cents = round_half_up(
          quantity_bushels * rate * surcharge_days * SURCHARGE_MULTIPLIER_BPS / 10000000)

      raw = base_cents + surcharge_cents
      charge_cents = 0 if raw == 0 else max(MIN_STORAGE_CHARGE_CENTS, raw)
    input_set: "One WarehouseReceipt's outstanding quantity_bushels as of the evaluation instant, with terms from its StorageAgreement"
    constants:
      BASE_TIER_DAYS: 90
      SURCHARGE_MULTIPLIER_BPS: 12500
      MIN_STORAGE_CHARGE_CENTS: 500
    precision: "Integer cents; round_half_up per tier before summing, never on the combined day count"
    variants:
      - name: PROVISIONAL
        when: "Any read-time accrual: WarehouseReceipt.provisional_storage_charge_cents, the warehouseman lien inside collateral valuation, and indemnity entitlement"
        difference: "The agreement's free_storage_days allowance is NOT applied — chargeable_days == day_count. The provisional figure is deliberately conservative so a lender never over-advances against grain whose free period may still be revoked"
      - name: FINAL
        when: "Settlement-time accrual: DeliveryOrder.storage_charge_cents"
        difference: "chargeable_days = max(0, day_count - free_storage_days), so the same receipt on the same date yields a strictly smaller charge whenever day_count > 0"

  - name: position_reconciliation
    trigger: "On POST /position-reports/{report_id}/submit, on GET /warehouses/{warehouse_id}/position-summary, and whenever a bin condition change moves sound_physical_bushels"
    algorithm: aggregation
    formula: |
      obligation_bushels =
            sum(WarehouseReceipt.quantity_bushels where receipt_state == ISSUED)
          + sum(DepositTicket.net_bushels where ticket_state == ACCEPTED)
      receipted_obligation_bushels =
            sum(WarehouseReceipt.quantity_bushels where receipt_state == ISSUED)

      system_physical_bushels = sum(Bin.stored_bushels for every Bin of the warehouse)
      sound_physical_bushels  = sum(Bin.stored_bushels where Bin.condition_state != OUT_OF_CONDITION)

      position_variance_bushels        = sound_physical_bushels - obligation_bushels
      count_discrepancy_bushels        = reported_physical_bushels - system_physical_bushels
      obligation_misstatement_bushels  = reported_obligation_bushels - obligation_bushels

      examination_tolerance_bushels = max(
          EXAM_MIN_TOLERANCE_BUSHELS,
          round_half_up(obligation_bushels * EXAM_TOLERANCE_BPS / 10000))

      examination_required =
             abs(position_variance_bushels)       > examination_tolerance_bushels
          or abs(count_discrepancy_bushels)       > examination_tolerance_bushels
          or abs(obligation_misstatement_bushels) > examination_tolerance_bushels
    input_set: "ISSUED receipts and ACCEPTED deposit tickets of the warehouse (WEIGHED, RECEIPTED, REJECTED tickets and CANCELLED/VOIDED receipts are excluded), plus every Bin of the warehouse"
    constants:
      EXAM_TOLERANCE_BPS: 50
      EXAM_MIN_TOLERANCE_BUSHELS: 500
    precision: "Integer bushels; the tolerance comparison is STRICTLY greater than, so a delta exactly equal to the tolerance does not require examination"

  - name: collateral_valuation_and_advance_limit
    trigger: "On POST /collateral-liens, re-run on POST /collateral-liens/{lien_id}/perfect, and re-run on every cascade that changes the receipt's quality_flag or quantity_bushels"
    algorithm: threshold
    formula: |
      # STEP ORDER IS NORMATIVE. Steps 1-7 in exactly this sequence.
      # 1. gross value
      gross_value_cents = quantity_bushels * price
          # price = mark_price_cents_per_bushel (MARK_TO_MARKET)
          #       = receipt.face_price_cents_per_bushel (FACE_ADVANCE)
      # 2. quality/grade discount
      grade_discount_bps = GRADE_DISCOUNT_BPS[receipt.grade]
                         + (IMPAIRED_DISCOUNT_BPS if receipt.quality_flag == IMPAIRED else 0)
      # 3. eligible value
      eligible_value_cents = round_half_up(gross_value_cents * (10000 - grade_discount_bps) / 10000)
      # 4. administration fee — keyed on the PRE-lien eligible value, NOT on the
      #    post-lien net value and NOT on the gross value.
      admin_fee_cents = round_half_up(eligible_value_cents * LIEN_ADMIN_FEE_BPS / 10000)
      # 5. the warehouseman's prior lien outranks the lender's interest
      warehouseman_lien_cents = receipt.provisional_storage_charge_cents
                              + receipt.receiving_charge_cents
                              + admin_fee_cents
      net_collateral_cents = max(0, eligible_value_cents - warehouseman_lien_cents)
      # 6. advance-rate tier — keyed on the POST-lien net collateral value.
      advance_rate_bps = ADVANCE_RATE_HIGH_BPS
                         if net_collateral_cents >= ADVANCE_RATE_TIER_THRESHOLD_CENTS
                         else ADVANCE_RATE_LOW_BPS
      # 7. limit and margin
      advance_limit_cents     = round_half_up(net_collateral_cents * advance_rate_bps / 10000)
      margin_deficiency_cents = max(0, principal_cents - advance_limit_cents)
      margin_status           = SUFFICIENT if margin_deficiency_cents == 0 else DEFICIENT
    input_set: "One WarehouseReceipt in receipt_state ISSUED, its Bin's condition_state (via quality_flag), and its StorageAgreement's charge terms"
    constants:
      GRADE_DISCOUNT_BPS: { US_NO_1: 0, US_NO_2: 150, US_NO_3: 400, SAMPLE_GRADE: 1200 }
      IMPAIRED_DISCOUNT_BPS: 2500
      LIEN_ADMIN_FEE_BPS: 25
      ADVANCE_RATE_TIER_THRESHOLD_CENTS: 10000000
      ADVANCE_RATE_HIGH_BPS: 8000
      ADVANCE_RATE_LOW_BPS: 7000
    precision: "Integer cents, round_half_up at steps 3, 4 and 7 only; the tier test at step 6 is >= on the value produced by step 5"
    variants:
      - name: MARK_TO_MARKET
        when: "valuation_basis == MARK_TO_MARKET — the lender supplies a current commodity price"
        difference: "price is mark_price_cents_per_bushel, the grade and impairment discounts of step 2 apply in full, and the step-4 administration fee is charged"
      - name: FACE_ADVANCE
        when: "valuation_basis == FACE_ADVANCE — the lender advances against the receipt's pinned declared value"
        difference: "price is receipt.face_price_cents_per_bushel, grade_discount_bps is forced to 0 (the face value already embeds the grade), and admin_fee_cents is 0 — so the warehouseman lien is smaller too and the two variants diverge on both the numerator and the deduction"

  - name: delivery_settlement
    trigger: "On POST /delivery-orders/{order_id}/settle"
    algorithm: threshold
    formula: |
      # The quality adjustment is ASYMMETRIC: the warehouse compensates the
      # depositor when the grain delivered is worse than the grade certified on
      # the receipt, but keeps no credit when it is better.
      grade_delta_bps = max(0, GRADE_DISCOUNT_BPS[delivered_grade]
                             - GRADE_DISCOUNT_BPS[receipt.grade])
      quality_adjustment_cents = round_half_up(
          delivered_bushels * settlement_price_cents_per_bushel * grade_delta_bps / 10000)

      # Storage is charged on the receipt's outstanding quantity as of loadout —
      # NOT on delivered_bushels — because the whole lot occupied the bin.
      storage_charge_cents = storage_charge_accrual(FINAL, receipt.quantity_bushels, date(loaded_at))
      loadout_charge_cents = round_half_up(
          delivered_bushels * agreement.loadout_charge_cents_per_bushel)

      net_settlement_cents = quality_adjustment_cents
                           - storage_charge_cents
                           - loadout_charge_cents      # may be negative
    input_set: "One LOADED DeliveryOrder, its WarehouseReceipt and that receipt's StorageAgreement"
    constants:
      GRADE_DISCOUNT_BPS: { US_NO_1: 0, US_NO_2: 150, US_NO_3: 400, SAMPLE_GRADE: 1200 }
    precision: "Integer cents, round_half_up on the quality adjustment and the loadout charge independently"

  - name: indemnity_waterfall_allocation
    trigger: "On POST /warehouses/{warehouse_id}/insolvency with action=ALLOCATE"
    algorithm: waterfall_allocation
    formula: |
      # entitlement is fixed at adjudication time, not at allocation time
      entitlement_cents = max(0,
            receipt.quantity_bushels * warehouse.insolvency_price_cents_per_bushel
          - (storage_charge_accrual(PROVISIONAL, receipt.quantity_bushels,
                                    date(warehouse.insolvency_declared_at))
             + receipt.receiving_charge_cents))
      allowed_cents = min(claimed_cents, entitlement_cents)      # 0 when DISALLOWED
      fund_eligible = (Party(claimant_party_id).party_kind == PRODUCER_DEPOSITOR)

      claims = every IndemnityClaim of this warehouse in claim_state ALLOWED
      total_allowed = sum(c.allowed_cents for c in claims)

      # ---- TIER 1: the warehouse bond, shared by EVERY allowed claimant ----
      bond_pool = warehouse.bond_amount_cents
      if total_allowed <= bond_pool:
          c.bond_share_cents = c.allowed_cents for every claim        # no pro-rata needed
      else:
          c.bond_share_cents = floor(bond_pool * c.allowed_cents / total_allowed)
          remainder = bond_pool - sum(c.bond_share_cents)
          # distribute the remainder one cent at a time, ordered by
          # allowed_cents DESC then created_at ASC (never by id)
          for c in sorted(claims, key=(-c.allowed_cents, c.created_at))[:remainder]:
              c.bond_share_cents += 1

      # ---- TIER 2: the indemnity fund, PRODUCER depositors only ----
      fund_remaining = FUND_AGGREGATE_CAP_CENTS
      for c in sorted(claims, key=(-c.allowed_cents, c.created_at)):
          residual = c.allowed_cents - c.bond_share_cents
          if not c.fund_eligible or fund_remaining == 0:
              c.fund_share_cents = 0
          else:
              c.fund_share_cents = min(residual, FUND_PER_CLAIMANT_CAP_CENTS, fund_remaining)
              fund_remaining -= c.fund_share_cents

      c.unpaid_cents = c.allowed_cents - c.bond_share_cents - c.fund_share_cents
    input_set: "IndemnityClaims of the warehouse in claim_state ALLOWED only; FILED claims block the ALLOCATE trigger and DISALLOWED claims are excluded from total_allowed"
    constants:
      FUND_AGGREGATE_CAP_CENTS: 100000000
      FUND_PER_CLAIMANT_CAP_CENTS: 30000000
    precision: "Integer cents. Tier 1 uses FLOOR pro-rata plus one-cent remainder distribution so the shares sum to the pool exactly; tier 2 is sequential, so ordering is observable when the aggregate cap binds"

  - name: operational_posture_derivation
    trigger: "Recomputed on every write that touches license_state, insolvency_state, bin condition, receipt issuance/void, deposit acceptance, or position-report examination"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top-down; the first matching clause wins.
      if license_state != LICENSED or insolvency_state != SOLVENT:
          operational_posture = CLOSED
      elif abs(position_variance_bushels) > examination_tolerance_bushels
           or the most recently submitted PositionReport of this warehouse
              is in report_state REJECTED:
          operational_posture = RESTRICTED
      else:
          operational_posture = OPEN
    input_set: "The Warehouse's two state dimensions, its derived position figures, and the report_state of its most recently submitted PositionReport (by submitted_at, ties broken by created_at ASC)"
    constants: {}
    precision: "Enumerated result; the variance test is STRICTLY greater than the tolerance"
    note: "Bin condition never sets RESTRICTED directly — it reaches posture only through sound_physical_bushels and therefore through position_variance_bushels."

  - name: bin_condition_assessment
    trigger: "On POST /bins/{bin_id}/condition-assessment"
    algorithm: threshold
    formula: |
      if moisture_pct >= OOC_MOISTURE_PCT
         or temperature_f > OOC_TEMPERATURE_F
         or (moisture_pct >= WATCH_MOISTURE_PCT and temperature_f > WATCH_TEMPERATURE_F):
          target = OUT_OF_CONDITION
      elif moisture_pct >= WATCH_MOISTURE_PCT or temperature_f > WATCH_TEMPERATURE_F:
          target = WATCH
      else:
          target = SOUND

      # A BLEND treatment physically mixes the bin and loses volume.
      if treatment_action == BLEND:
          blend_loss = round_half_up(bin.stored_bushels * BLEND_SHRINK_BPS / 10000)
          bin.stored_bushels -= blend_loss
          bin.cumulative_shrink_bushels += blend_loss
    input_set: "The single Bin being assessed and the readings supplied in the request"
    constants:
      WATCH_MOISTURE_PCT: 14.0
      OOC_MOISTURE_PCT: 15.5
      WATCH_TEMPERATURE_F: 85
      OOC_TEMPERATURE_F: 95
      BLEND_SHRINK_BPS: 150
    precision: "Moisture comparisons use >= at one decimal place; temperature comparisons use strict >. Integer bushels for the blend loss, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending priority; the FIRST
#   violated rule determines the response. Regulatory/state gates (60-62)
#   deliberately outrank safety (65), constraint (70) and fiscal (80-86) checks:
#   an unlicensed or insolvent warehouse is not permitted to explain itself with
#   a capacity or bond error.
# =============================================================================
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 20
    category: auth
    check: "The caller's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 25
    category: auth
    check: "Entity-backed callers act only on their own rows: a WarehouseOperator's X-User-ID must equal the target Warehouse.id (reached through bin/agreement/ticket/receipt/report/order as applicable); a Depositor's must equal the StorageAgreement.depositor_party_id or the receipt's holder_party_id; a Lender's must equal CollateralLien.lender_party_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every write and every single-resource read below /warehouses, /bins, /storage-agreements, /deposit-tickets, /receipts, /collateral-liens, /position-reports, /delivery-orders"

  - priority: 27
    category: auth
    check: "The examining regulator's X-User-ID differs from Warehouse.licensed_by_user_id — the regulator who licensed a facility may not record its examination result"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /position-reports/{report_id}/examine"

  - priority: 28
    category: auth
    check: "Transfer channel matches the receipt medium and the caller's role: a PAPER receipt is transferred by its holder (Depositor or Lender) with transfer_channel ENDORSEMENT; an ELECTRONIC receipt is transferred only by the RegistryAdministrator with transfer_channel REGISTRY"
    error_id: ERR_TRANSFER_CHANNEL_INVALID
    http_status: 403
    applies_to: "POST /receipts/{receipt_id}/transfer"

  - priority: 30
    category: existence
    check: "Request body parses, all required fields for the endpoint are present, enum values are members of their declared set, integers are within their declared bounds, dates and datetimes are ISO-8601, and end instants are strictly after start instants"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"

  - priority: 40
    category: existence
    check: "Every id in the path and body resolves to an existing row, validated left-to-right: warehouse, then bin/agreement, then ticket/receipt/report/order/lien/claim, then party"
    error_id: "ERR_WAREHOUSE_NOT_FOUND | ERR_BIN_NOT_FOUND | ERR_PARTY_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_RECEIPT_NOT_FOUND | ERR_LIEN_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_DELIVERY_ORDER_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or an FK in the body"

  - priority: 45
    category: business_referential
    check: "Referenced rows are mutually consistent and party_kind fits the slot: an agreement's depositor Party must be PRODUCER_DEPOSITOR or COMMERCIAL_DEPOSITOR; a lien's lender Party must be LENDER; a ticket's Bin must belong to the agreement's Warehouse (ERR_PARTY_KIND_INVALID) and must carry the agreement's commodity (ERR_COMMODITY_MISMATCH)"
    error_id: "ERR_PARTY_KIND_INVALID | ERR_COMMODITY_MISMATCH"
    http_status: 422
    applies_to: "POST /storage-agreements, POST /deposit-tickets, POST /collateral-liens, POST /indemnity-claims, POST /receipts/{receipt_id}/transfer"

  - priority: 50
    category: state
    check: "expected_warehouse_version on POST /receipts matches Warehouse.version, and expected_bin_version on POST /deposit-tickets/{ticket_id}/accept matches Bin.version"
    error_id: "ERR_STALE_WAREHOUSE_VERSION | ERR_STALE_BIN_VERSION"
    http_status: 412
    applies_to: "POST /receipts, POST /deposit-tickets/{ticket_id}/accept"

  - priority: 55
    category: state
    check: "The target row is in a state that admits this transition per §1.2 (license_state, insolvency_state, agreement_state, ticket_state, receipt_state, encumbrance_state, lien_state, report_state, delivery_state, claim_state), including the 'no other report UNDER_EXAMINATION' and 'no FILED claim remains' guards"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 60
    category: business_safety
    check: "The warehouse's license_state is LICENSED for any operation that takes in, receipts, pledges or delivers grain"
    error_id: ERR_WAREHOUSE_NOT_LICENSED
    http_status: 422
    applies_to: "POST /deposit-tickets, POST /deposit-tickets/{ticket_id}/accept, POST /receipts, POST /collateral-liens/{lien_id}/perfect, POST /delivery-orders, POST /delivery-orders/{order_id}/load"

  - priority: 61
    category: business_safety
    check: "The warehouse's insolvency_state is SOLVENT for any operation that takes in, receipts, pledges or delivers grain"
    error_id: ERR_WAREHOUSE_INSOLVENT
    http_status: 422
    applies_to: "POST /deposit-tickets, POST /deposit-tickets/{ticket_id}/accept, POST /receipts, POST /collateral-liens/{lien_id}/perfect, POST /delivery-orders, POST /delivery-orders/{order_id}/load"

  - priority: 62
    category: business_safety
    check: "operational_posture is not RESTRICTED for receipt issuance, deposit acceptance and lien perfection — a facility whose position is out of tolerance may not grow its obligation or encumber more stock"
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 422
    applies_to: "POST /deposit-tickets/{ticket_id}/accept, POST /receipts, POST /collateral-liens/{lien_id}/perfect"

  - priority: 65
    category: business_safety
    check: "The target Bin's condition_state is not OUT_OF_CONDITION — out-of-condition grain may not be added to, receipted out of, or loaded out of the bin until it has been conditioned"
    error_id: ERR_BIN_OUT_OF_CONDITION
    http_status: 422
    applies_to: "POST /deposit-tickets, POST /deposit-tickets/{ticket_id}/accept, POST /receipts, POST /delivery-orders, POST /delivery-orders/{order_id}/load"

  - priority: 66
    category: business_safety
    check: "assigned_grade rank is at or above the agreement's min_grade rank"
    error_id: ERR_GRADE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /deposit-tickets/{ticket_id}/accept"

  - priority: 67
    category: business_safety
    check: "Commingling rules: an IDENTITY_PRESERVED agreement may only use a Bin whose commingling_allowed is false and whose dedicated_agreement_id is null or equal to this agreement; a COMMINGLED agreement may only use a Bin whose commingling_allowed is true"
    error_id: ERR_COMMINGLING_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /deposit-tickets"

  - priority: 68
    category: business_safety
    check: "Receipt form and medium are honoured: only a NEGOTIABLE receipt may be transferred or pledged; an ELECTRONIC receipt requires Warehouse.registry_participant == true; perfection_method POSSESSION requires medium PAPER and ELECTRONIC_CONTROL requires medium ELECTRONIC at a registry participant"
    error_id: "ERR_RECEIPT_NOT_NEGOTIABLE | ERR_REGISTRY_NOT_PARTICIPANT | ERR_PERFECTION_METHOD_MISMATCH"
    http_status: 422
    applies_to: "POST /receipts, POST /receipts/{receipt_id}/transfer, POST /collateral-liens, POST /collateral-liens/{lien_id}/perfect"

  - priority: 69
    category: business_safety
    check: "A receipt carrying an outstanding lien (encumbrance_state == PLEDGED) may not be voided, transferred by its pledgor, or settled out of store"
    error_id: ERR_RECEIPT_ENCUMBERED
    http_status: 409
    applies_to: "POST /receipts/{receipt_id}/void, POST /receipts/{receipt_id}/transfer, POST /delivery-orders/{order_id}/settle"

  - priority: 70
    category: business_temporal
    check: "A void request falls inside RECEIPT_VOID_WINDOW_HOURS (72) of the receipt's issued_at, measured on the logical clock"
    error_id: ERR_VOID_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /receipts/{receipt_id}/void"

  - priority: 71
    category: business_temporal
    check: "The requested bin fill window does not conflict with another DepositTicket on the same Bin in ticket_state WEIGHED or ACCEPTED. Windows are CLOSED intervals with a trailing BIN_REST_BUFFER_MINUTES (240) settling buffer: conflict iff new.fill_start_at <= existing.fill_end_at + 240min AND existing.fill_start_at <= new.fill_end_at + 240min"
    error_id: ERR_BIN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /deposit-tickets"

  - priority: 72
    category: business_temporal
    check: "A loadout lane is free for the requested appointment. Appointments are HALF-OPEN [start, end) intervals; overlap iff new.start < existing.end AND existing.start < new.end over orders in delivery_state REQUESTED or LOADED. lane_index is the lowest free integer in [0, loadout_lane_count); if every lane is occupied the request is refused"
    error_id: ERR_LOADOUT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /delivery-orders"

  - priority: 73
    category: business_constraint
    check: "The report period [period_start_date, period_end_date] does not overlap another PositionReport of the same warehouse in report_state DRAFT, UNDER_EXAMINATION or ACCEPTED; overlap is on closed date intervals"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /position-reports"

  - priority: 74
    category: business_constraint
    check: "receipt_number is unique within the warehouse across every receipt_state, including VOIDED and CANCELLED receipts"
    error_id: ERR_RECEIPT_NUMBER_DUPLICATE
    http_status: 409
    applies_to: "POST /receipts"

  - priority: 75
    category: business_constraint
    check: "A claimant may file at most one IndemnityClaim per WarehouseReceipt, counting FILED, ALLOWED and SETTLED claims (a DISALLOWED claim may be re-filed)"
    error_id: ERR_CLAIM_DUPLICATE
    http_status: 409
    applies_to: "POST /indemnity-claims"

  - priority: 80
    category: business_fiscal
    check: "net_worth_shortfall_cents does not exceed net_worth_tolerance_cents"
    error_id: ERR_NET_WORTH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /warehouses/{warehouse_id}/license-decision with decision ISSUE or REINSTATE"

  - priority: 82
    category: business_fiscal
    check: "bond_deficiency_cents is exactly 0"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: "POST /warehouses/{warehouse_id}/license-decision with decision ISSUE or REINSTATE"

  - priority: 84
    category: business_fiscal
    check: "receipted_obligation_bushels + the ticket's net_bushels does not exceed licensed_capacity_bushels"
    error_id: ERR_LICENSED_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /receipts"

  - priority: 85
    category: business_constraint
    check: "The bin's remaining headroom (capacity_bushels minus stored_bushels minus held_bushels minus scheduled_inbound_bushels) is at least the ticket's net_bushels"
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /deposit-tickets, POST /deposit-tickets/{ticket_id}/accept"

  - priority: 86
    category: business_fiscal
    check: "The lender's available_credit_cents (credit_line_cents minus committed_advance_cents) is at least the lien's advance_limit_cents"
    error_id: ERR_CREDIT_LINE_EXCEEDED
    http_status: 422
    applies_to: "POST /collateral-liens/{lien_id}/perfect"

  - priority: 87
    category: business_constraint
    check: "requested_bushels does not exceed the receipt's outstanding quantity_bushels, and delivered_bushels does not exceed requested_bushels"
    error_id: ERR_DELIVERY_EXCEEDS_RECEIPT
    http_status: 422
    applies_to: "POST /delivery-orders, POST /delivery-orders/{order_id}/load"

  - priority: 88
    category: business_fiscal
    check: "claimed_cents is at least 1 and the receipt underlying an indemnity claim is in receipt_state ISSUED so that an entitlement exists"
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /indemnity-claims"

# =============================================================================
# §1.5 API Endpoint Table — api_prefix is "", so every path below is absolute.
#   Trailing `?` marks an optional input field.
# =============================================================================
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Every server-side timestamp (accepted_at, issued_at, perfected_at, loaded_at, submitted_at, insolvency_declared_at, created_at, updated_at) and every window/expiry comparison reads this clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time."
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender, RegistryAdministrator]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["subsequent reads of provisional_storage_charge_cents and every temporal validation use the new instant"]

  # --- Warehouse ------------------------------------------------------------
  - method: POST
    path: "/warehouses"
    description: "Registers a warehouse licence application in license_state APPLIED and insolvency_state SOLVENT. The regulator files the application, so the operator identity (X-User-ID == Warehouse.id) exists only after this call returns."
    roles: [StateRegulator]
    code: 201
    input: [name, operator_name, state_code, license_program, licensed_capacity_bushels, bond_amount_cents, net_worth_cents, loadout_lane_count, registry_participant]
    output: Warehouse
    side_effects: ["runs calculations.license_bond_and_net_worth_requirement", "operational_posture is CLOSED while license_state is APPLIED"]

  - method: GET
    path: "/warehouses"
    description: "Lists warehouses with optional filters"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: ["state_code?", "license_program?", "license_state?", "insolvency_state?", "limit?", "offset?"]
    output: "Warehouse[]"
    side_effects: []

  - method: GET
    path: "/warehouses/{warehouse_id}"
    description: "Reads one warehouse with every derived licensing, position and insolvency figure"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  - method: PATCH
    path: "/warehouses/{warehouse_id}/financials"
    description: "Restates the applied capacity, posted bond or audited net worth"
    roles: [StateRegulator, WarehouseOperator]
    code: 200
    input: ["licensed_capacity_bushels?", "bond_amount_cents?", "net_worth_cents?"]
    output: Warehouse
    side_effects: ["re-runs calculations.license_bond_and_net_worth_requirement", "increments Warehouse.version by 1"]

  - method: POST
    path: "/warehouses/{warehouse_id}/license-decision"
    description: "Drives the licensing dimension: ISSUE, DENY, SUSPEND, REINSTATE or REVOKE"
    roles: [StateRegulator]
    code: 200
    input: [decision, "license_effective_date?", "license_expiry_date?", "note?"]
    output: Warehouse
    side_effects: ["moves license_state per §1.2", "sets licensed_by_user_id on ISSUE and DENY", "recomputes operational_posture", "cascades WEIGHED DepositTickets to REJECTED on SUSPEND and REVOKE", "increments Warehouse.version by 1"]

  - method: POST
    path: "/warehouses/{warehouse_id}/insolvency"
    description: "Drives the insolvency dimension: DECLARE, OPEN_CLAIMS, ALLOCATE or CLOSE"
    roles: [StateRegulator]
    code: 200
    input: [action, "insolvency_price_cents_per_bushel?", "note?"]
    output: Warehouse
    side_effects: ["moves insolvency_state per §1.2", "DECLARE sets insolvency_declared_at and the insolvency price, cancels REQUESTED DeliveryOrders and rejects WEIGHED DepositTickets", "ALLOCATE runs calculations.indemnity_waterfall_allocation and settles every ALLOWED claim", "recomputes operational_posture", "increments Warehouse.version by 1"]

  - method: GET
    path: "/warehouses/{warehouse_id}/position-summary"
    description: "Computed read: obligation, receipted obligation, system and sound physical bushels, position variance, examination tolerance and operational posture recomputed at the current logical clock"
    roles: [StateRegulator, WarehouseOperator]
    code: 200
    input: []
    output: Warehouse
    side_effects: []

  # --- Party ----------------------------------------------------------------
  - method: POST
    path: "/parties"
    description: "Registers a depositor or lender counterparty"
    roles: [StateRegulator, RegistryAdministrator]
    code: 201
    input: [name, party_kind, state_code, "credit_line_cents?"]
    output: Party
    side_effects: ["committed_advance_cents starts at 0 and available_credit_cents equals credit_line_cents"]

  - method: GET
    path: "/parties"
    description: "Lists parties with optional filters"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: ["party_kind?", "state_code?", "limit?", "offset?"]
    output: "Party[]"
    side_effects: []

  - method: GET
    path: "/parties/{party_id}"
    description: "Reads one party with its committed advance, available credit and settlement balance"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: []
    output: Party
    side_effects: []

  - method: PATCH
    path: "/parties/{party_id}/credit-line"
    description: "Restates a lender's credit line"
    roles: [StateRegulator]
    code: 200
    input: [credit_line_cents]
    output: Party
    side_effects: ["recomputes available_credit_cents", "increments Party.version by 1"]

  # --- StorageAgreement -----------------------------------------------------
  - method: POST
    path: "/storage-agreements"
    description: "Opens a storage agreement between the warehouse and a depositor"
    roles: [WarehouseOperator]
    code: 201
    input: [warehouse_id, depositor_party_id, commodity, storage_kind, min_grade, max_moisture_pct, storage_rate_millicents_per_bushel_day, receiving_charge_cents_per_bushel, loadout_charge_cents_per_bushel, free_storage_days, declared_value_cents_per_bushel]
    output: StorageAgreement
    side_effects: ["agreement_state starts ACTIVE"]

  - method: GET
    path: "/storage-agreements"
    description: "Lists storage agreements, filterable by warehouse or depositor"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: ["warehouse_id?", "depositor_party_id?", "agreement_state?", "storage_kind?", "limit?", "offset?"]
    output: "StorageAgreement[]"
    side_effects: []

  - method: GET
    path: "/storage-agreements/{agreement_id}"
    description: "Reads one storage agreement"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: []
    output: StorageAgreement
    side_effects: []

  - method: POST
    path: "/storage-agreements/{agreement_id}/terminate"
    description: "Terminates an agreement once nothing is stored or receipted under it"
    roles: [WarehouseOperator]
    code: 200
    input: [termination_reason]
    output: StorageAgreement
    side_effects: ["moves agreement_state to TERMINATED", "clears Bin.dedicated_agreement_id on any bin dedicated to this agreement"]

  # --- Bin ------------------------------------------------------------------
  - method: POST
    path: "/bins"
    description: "Adds a storage bin to the warehouse in condition_state SOUND"
    roles: [WarehouseOperator]
    code: 201
    input: [warehouse_id, bin_code, capacity_bushels, commodity, commingling_allowed, "dedicated_agreement_id?"]
    output: Bin
    side_effects: ["stored_bushels, held_bushels, scheduled_inbound_bushels and cumulative_shrink_bushels start at 0", "blended_grade starts null"]

  - method: GET
    path: "/bins"
    description: "Lists bins, filterable by warehouse or dedicated agreement"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: ["warehouse_id?", "dedicated_agreement_id?", "condition_state?", "commodity?", "limit?", "offset?"]
    output: "Bin[]"
    side_effects: []

  - method: GET
    path: "/bins/{bin_id}"
    description: "Reads one bin including version, stored/held/available bushels and condition state"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: []
    output: Bin
    side_effects: []

  - method: POST
    path: "/bins/{bin_id}/condition-assessment"
    description: "Records a moisture/temperature reading with an optional treatment action and re-derives condition_state per calculations.bin_condition_assessment"
    roles: [WarehouseOperator]
    code: 200
    input: [moisture_pct, temperature_f, "treatment_action?"]
    output: Bin
    side_effects: ["moves condition_state per §1.2", "on entry to OUT_OF_CONDITION flips quality_flag to IMPAIRED on every ISSUED receipt of this bin, revalues their PERFECTED liens, recomputes each lender's committed advance and available credit, and lowers Warehouse.sound_physical_bushels", "on exit from OUT_OF_CONDITION reverses that cascade", "treatment_action BLEND reduces stored_bushels by BLEND_SHRINK_BPS", "increments Bin.version by 1"]

  # --- DepositTicket --------------------------------------------------------
  - method: POST
    path: "/deposit-tickets"
    description: "Weighs an inbound load, grades it and computes dockage, shrink and net bushels; reserves a fill window on the bin"
    roles: [WarehouseOperator]
    code: 201
    input: [storage_agreement_id, bin_id, gross_bushels, test_weight_lbs, moisture_pct, damage_pct, foreign_material_pct, dockage_pct, fill_start_at, fill_end_at]
    output: DepositTicket
    side_effects: ["runs calculations.deposit_grade_and_net_bushels", "raises Bin.scheduled_inbound_bushels by net_bushels", "ticket_state starts WEIGHED"]

  - method: GET
    path: "/deposit-tickets"
    description: "Lists deposit tickets, filterable by agreement or bin"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: ["storage_agreement_id?", "bin_id?", "ticket_state?", "limit?", "offset?"]
    output: "DepositTicket[]"
    side_effects: []

  - method: GET
    path: "/deposit-tickets/{ticket_id}"
    description: "Reads one deposit ticket with its grade and quantity breakdown"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: []
    output: DepositTicket
    side_effects: []

  - method: POST
    path: "/deposit-tickets/{ticket_id}/accept"
    description: "Accepts the weighed load into the bin under optimistic concurrency on the bin"
    roles: [WarehouseOperator]
    code: 200
    input: [expected_bin_version]
    output: DepositTicket
    side_effects: ["moves ticket_state to ACCEPTED and sets accepted_at", "raises Bin.stored_bushels and cumulative_shrink_bushels, clears the scheduled inbound reservation, recomputes blended_grade", "increments Bin.version by 1", "raises Warehouse.obligation_bushels and system_physical_bushels and recomputes operational_posture"]

  - method: POST
    path: "/deposit-tickets/{ticket_id}/reject"
    description: "Rejects a weighed load before it enters the bin"
    roles: [WarehouseOperator]
    code: 200
    input: ["rejection_reason?"]
    output: DepositTicket
    side_effects: ["moves ticket_state to REJECTED", "releases Bin.scheduled_inbound_bushels and frees the fill window"]

  # --- WarehouseReceipt -----------------------------------------------------
  - method: POST
    path: "/receipts"
    description: "Issues a warehouse receipt against an accepted deposit ticket, under optimistic concurrency on the warehouse"
    roles: [WarehouseOperator]
    code: 201
    input: [deposit_ticket_id, holder_party_id, receipt_number, form, medium, expected_warehouse_version]
    output: WarehouseReceipt
    side_effects: ["copies warehouse_id, storage_agreement_id, bin_id, grade, moisture and quantity from the ticket, pins face_price_cents_per_bushel and receiving_charge_cents, sets issued_at", "moves the DepositTicket to RECEIPTED", "raises Warehouse.receipted_obligation_bushels", "increments Warehouse.version by 1", "receipt_state starts ISSUED and encumbrance_state starts UNENCUMBERED"]

  - method: GET
    path: "/receipts"
    description: "Lists warehouse receipts with FK and state filters"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: ["warehouse_id?", "deposit_ticket_id?", "storage_agreement_id?", "bin_id?", "holder_party_id?", "registry_control_party_id?", "receipt_state?", "encumbrance_state?", "form?", "medium?", "limit?", "offset?"]
    output: "WarehouseReceipt[]"
    side_effects: []

  - method: GET
    path: "/receipts/{receipt_id}"
    description: "Reads one receipt with its quality flag, provisional storage charge and transfer log"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: []
    output: WarehouseReceipt
    side_effects: []

  - method: POST
    path: "/receipts/{receipt_id}/transfer"
    description: "Transfers a negotiable receipt by endorsement (paper, by the holder) or by registry entry (electronic, by the registry administrator)"
    roles: [Depositor, Lender, RegistryAdministrator]
    code: 200
    input: [to_party_id, transfer_channel]
    output: WarehouseReceipt
    side_effects: ["moves holder_party_id to to_party_id", "appends a { transfer_channel, from_party_id, to_party_id, effective_at } record to transfer_log"]

  - method: POST
    path: "/receipts/{receipt_id}/void"
    description: "Voids a receipt issued in error inside the void window, returning its bushels to unreceipted stored stock"
    roles: [WarehouseOperator]
    code: 200
    input: ["void_reason?"]
    output: WarehouseReceipt
    side_effects: ["moves receipt_state to VOIDED and zeroes quantity_bushels", "returns the source DepositTicket from RECEIPTED to ACCEPTED so Warehouse.obligation_bushels is conserved", "lowers Warehouse.receipted_obligation_bushels", "Bin.stored_bushels is unchanged"]

  # --- CollateralLien -------------------------------------------------------
  - method: POST
    path: "/collateral-liens"
    description: "Records a lender's advance request against a negotiable receipt and values the collateral"
    roles: [Lender]
    code: 201
    input: [receipt_id, lender_party_id, principal_cents, valuation_basis, mark_price_cents_per_bushel, perfection_method]
    output: CollateralLien
    side_effects: ["runs calculations.collateral_valuation_and_advance_limit", "captures pledgor_party_id from the receipt's current holder", "lien_state starts REQUESTED; no credit is committed yet"]

  - method: GET
    path: "/collateral-liens"
    description: "Lists collateral liens, filterable by receipt, lender or pledgor"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: ["receipt_id?", "lender_party_id?", "pledgor_party_id?", "lien_state?", "valuation_basis?", "margin_status?", "limit?", "offset?"]
    output: "CollateralLien[]"
    side_effects: []

  - method: GET
    path: "/collateral-liens/{lien_id}"
    description: "Reads one lien with its full seven-step valuation breakdown"
    roles: [StateRegulator, WarehouseOperator, RegistryAdministrator, Depositor, Lender]
    code: 200
    input: []
    output: CollateralLien
    side_effects: []

  - method: POST
    path: "/collateral-liens/{lien_id}/perfect"
    description: "Perfects the lender's interest by taking possession of the paper receipt or by taking control in the electronic registry"
    roles: [Lender]
    code: 200
    input: ["attestation_note?"]
    output: CollateralLien
    side_effects: ["re-runs the valuation at the current logical clock", "moves lien_state to PERFECTED and sets perfected_at", "drives the receipt's encumbrance_state to PLEDGED and moves holder_party_id or sets registry_control_party_id per perfection_method", "raises Party(lender).committed_advance_cents by advance_limit_cents"]

  - method: POST
    path: "/collateral-liens/{lien_id}/release"
    description: "Releases the lien on payoff, returning possession or registry control to the pledgor"
    roles: [Lender]
    code: 200
    input: [payoff_received_cents]
    output: CollateralLien
    side_effects: ["moves lien_state to RELEASED and sets released_at", "drives the receipt's encumbrance_state to RELEASED and restores holder_party_id to pledgor_party_id", "lowers Party(lender).committed_advance_cents by the amount currently committed for this lien, including any revaluation delta"]

  - method: POST
    path: "/collateral-liens/{lien_id}/revalue"
    description: "Re-marks the collateral at a new price and recomputes the advance limit and margin status"
    roles: [Lender]
    code: 200
    input: [mark_price_cents_per_bushel]
    output: CollateralLien
    side_effects: ["re-runs calculations.collateral_valuation_and_advance_limit", "on a PERFECTED lien, adjusts Party(lender).committed_advance_cents by the delta in advance_limit_cents"]

  # --- PositionReport -------------------------------------------------------
  - method: POST
    path: "/position-reports"
    description: "Opens a draft position report for a reporting period"
    roles: [WarehouseOperator]
    code: 201
    input: [warehouse_id, period_start_date, period_end_date, as_of_date]
    output: PositionReport
    side_effects: ["report_state starts DRAFT with revision_count 0 and every snapshot field null"]

  - method: GET
    path: "/position-reports"
    description: "Lists position reports for a warehouse"
    roles: [StateRegulator, WarehouseOperator]
    code: 200
    input: ["warehouse_id?", "report_state?", "examination_result?", "limit?", "offset?"]
    output: "PositionReport[]"
    side_effects: []

  - method: GET
    path: "/position-reports/{report_id}"
    description: "Reads one position report with its three reconciliation deltas and tolerance"
    roles: [StateRegulator, WarehouseOperator]
    code: 200
    input: []
    output: PositionReport
    side_effects: []

  - method: POST
    path: "/position-reports/{report_id}/submit"
    description: "Submits declared physical and obligation figures; the computed tolerance test decides whether the report is auto-accepted or referred for examination"
    roles: [WarehouseOperator]
    code: 200
    input: [reported_physical_bushels, reported_obligation_bushels]
    output: PositionReport
    side_effects: ["runs calculations.position_reconciliation and snapshots every derived figure", "moves report_state to ACCEPTED or UNDER_EXAMINATION per examination_required", "increments revision_count when re-submitted out of REJECTED", "recomputes Warehouse.operational_posture"]

  - method: POST
    path: "/position-reports/{report_id}/examine"
    description: "Records the examination result; the examiner may not be the regulator who licensed the facility"
    roles: [StateRegulator]
    code: 200
    input: [result, "findings_note?"]
    output: PositionReport
    side_effects: ["moves report_state to ACCEPTED on PASS or REJECTED on DEFICIENT/CRITICAL", "DEFICIENT sets Warehouse.operational_posture RESTRICTED", "CRITICAL additionally suspends the licence, sets posture CLOSED and rejects every WEIGHED DepositTicket", "increments Warehouse.version by 1 when the warehouse is touched"]

  # --- DeliveryOrder --------------------------------------------------------
  - method: POST
    path: "/delivery-orders"
    description: "Exercises the delivery right on a receipt and books a loadout appointment lane"
    roles: [Depositor, Lender]
    code: 201
    input: [receipt_id, requested_bushels, appointment_start_at, appointment_end_at]
    output: DeliveryOrder
    side_effects: ["assigns lane_index", "raises Bin.held_bushels by requested_bushels", "delivery_state starts REQUESTED"]

  - method: GET
    path: "/delivery-orders"
    description: "Lists delivery orders, filterable by receipt or requester"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: ["receipt_id?", "requester_party_id?", "delivery_state?", "limit?", "offset?"]
    output: "DeliveryOrder[]"
    side_effects: []

  - method: GET
    path: "/delivery-orders/{order_id}"
    description: "Reads one delivery order with its loadout grading and settlement figures"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: []
    output: DeliveryOrder
    side_effects: []

  - method: POST
    path: "/delivery-orders/{order_id}/load"
    description: "Records the loadout weights and grade factors and computes the final storage and loadout charges"
    roles: [WarehouseOperator]
    code: 200
    input: [delivered_bushels, delivered_test_weight_lbs, delivered_moisture_pct, delivered_damage_pct, delivered_foreign_material_pct]
    output: DeliveryOrder
    side_effects: ["grades the loaded grain and sets delivered_grade and grade_delta_bps", "computes storage_charge_cents with the FINAL variant on the receipt's outstanding quantity and loadout_charge_cents on delivered_bushels", "moves delivery_state to LOADED and sets loaded_at"]

  - method: POST
    path: "/delivery-orders/{order_id}/settle"
    description: "Settles the delivery: applies the asymmetric quality adjustment, cancels or reduces the receipt and moves the grain out of the bin"
    roles: [WarehouseOperator]
    code: 200
    input: [settlement_price_cents_per_bushel]
    output: DeliveryOrder
    side_effects: ["runs calculations.delivery_settlement", "moves delivery_state to SETTLED_FULL (receipt CANCELLED) or SETTLED_PARTIAL (receipt stays ISSUED with a reduced quantity)", "lowers Bin.stored_bushels and Bin.held_bushels", "adjusts Party(requester).settlement_balance_cents by net_settlement_cents", "recomputes Warehouse.obligation_bushels and operational_posture"]

  - method: POST
    path: "/delivery-orders/{order_id}/cancel"
    description: "Cancels an unloaded delivery order and frees its lane and hold"
    roles: [Depositor, Lender]
    code: 200
    input: ["cancellation_reason?"]
    output: DeliveryOrder
    side_effects: ["moves delivery_state to CANCELLED", "lowers Bin.held_bushels by requested_bushels and frees lane_index"]

  # --- IndemnityClaim -------------------------------------------------------
  - method: POST
    path: "/indemnity-claims"
    description: "Files a depositor-protection claim against an insolvent warehouse's bond and the indemnity fund"
    roles: [Depositor, Lender]
    code: 201
    input: [warehouse_id, receipt_id, claimant_party_id, claimed_cents]
    output: IndemnityClaim
    side_effects: ["claim_state starts FILED with every allocation field 0"]

  - method: GET
    path: "/indemnity-claims"
    description: "Lists indemnity claims, filterable by warehouse, receipt or claimant"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: ["warehouse_id?", "receipt_id?", "claimant_party_id?", "claim_state?", "limit?", "offset?"]
    output: "IndemnityClaim[]"
    side_effects: []

  - method: GET
    path: "/indemnity-claims/{claim_id}"
    description: "Reads one claim with its entitlement, allowed amount and two-tier allocation shares"
    roles: [StateRegulator, WarehouseOperator, Depositor, Lender]
    code: 200
    input: []
    output: IndemnityClaim
    side_effects: []

  - method: POST
    path: "/indemnity-claims/{claim_id}/adjudicate"
    description: "Allows or disallows a filed claim, fixing its entitlement at the insolvency price"
    roles: [StateRegulator]
    code: 200
    input: [decision, "adjudication_note?"]
    output: IndemnityClaim
    side_effects: ["computes entitlement_cents, allowed_cents and fund_eligible", "moves claim_state to ALLOWED or DISALLOWED and records adjudicated_by_user_id"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication / authorization ---------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The caller's role is not listed on the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An entity-backed caller addressed a row that does not belong to it: operator vs Warehouse.id, depositor vs agreement depositor or receipt holder, lender vs CollateralLien.lender_party_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The examining regulator's X-User-ID equals Warehouse.licensed_by_user_id" }
  - { id: ERR_TRANSFER_CHANNEL_INVALID, http: 403, condition: "transfer_channel does not match the receipt medium and the caller's role — ENDORSEMENT by the holder for PAPER, REGISTRY by the RegistryAdministrator for ELECTRONIC" }

  # --- request shape --------------------------------------------------------
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, unknown enum member, out-of-range integer, malformed date/datetime, or an end instant not strictly after its start instant" }

  # --- existence ------------------------------------------------------------
  - { id: ERR_WAREHOUSE_NOT_FOUND, http: 404, condition: "warehouse_id does not resolve" }
  - { id: ERR_PARTY_NOT_FOUND, http: 404, condition: "A party id in the path or body does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "storage_agreement_id or dedicated_agreement_id does not resolve" }
  - { id: ERR_BIN_NOT_FOUND, http: 404, condition: "bin_id does not resolve" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "deposit_ticket_id or ticket_id does not resolve" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "receipt_id does not resolve" }
  - { id: ERR_LIEN_NOT_FOUND, http: 404, condition: "lien_id does not resolve" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "report_id does not resolve" }
  - { id: ERR_DELIVERY_ORDER_NOT_FOUND, http: 404, condition: "order_id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim_id does not resolve" }

  # --- referential ----------------------------------------------------------
  - { id: ERR_PARTY_KIND_INVALID, http: 422, condition: "A Party's party_kind does not fit the slot it was supplied for, or a Bin does not belong to the referenced agreement's Warehouse" }
  - { id: ERR_COMMODITY_MISMATCH, http: 422, condition: "The Bin's commodity differs from the StorageAgreement's commodity" }

  # --- optimistic concurrency ----------------------------------------------
  - { id: ERR_STALE_WAREHOUSE_VERSION, http: 412, condition: "expected_warehouse_version on POST /receipts does not match the warehouse's current version" }
  - { id: ERR_STALE_BIN_VERSION, http: 412, condition: "expected_bin_version on POST /deposit-tickets/{ticket_id}/accept does not match the bin's current version" }

  # --- state ----------------------------------------------------------------
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target row is not in a state that admits the requested transition, including re-triggering a transition already taken, acting on a terminal row, submitting a report while another is UNDER_EXAMINATION, or allocating while a claim is still FILED" }

  # --- regulatory gates -----------------------------------------------------
  - { id: ERR_WAREHOUSE_NOT_LICENSED, http: 422, condition: "The warehouse's license_state is not LICENSED for an operation that takes in, receipts, pledges or delivers grain" }
  - { id: ERR_WAREHOUSE_INSOLVENT, http: 422, condition: "The warehouse's insolvency_state is not SOLVENT for an operation that takes in, receipts, pledges or delivers grain" }
  - { id: ERR_POSTURE_RESTRICTED, http: 422, condition: "operational_posture is RESTRICTED — the position is outside the examination tolerance or the latest submitted report was REJECTED — so the obligation may not grow and stock may not be newly encumbered" }

  # --- safety / compliance --------------------------------------------------
  - { id: ERR_BIN_OUT_OF_CONDITION, http: 422, condition: "The bin's condition_state is OUT_OF_CONDITION" }
  - { id: ERR_GRADE_BELOW_MINIMUM, http: 422, condition: "The ticket's assigned_grade ranks below the agreement's min_grade" }
  - { id: ERR_COMMINGLING_NOT_PERMITTED, http: 422, condition: "An IDENTITY_PRESERVED lot was directed into a commingling bin, a COMMINGLED lot into a non-commingling bin, or a bin dedicated to a different agreement was used" }
  - { id: ERR_RECEIPT_NOT_NEGOTIABLE, http: 422, condition: "A NON_NEGOTIABLE receipt was transferred or pledged" }
  - { id: ERR_REGISTRY_NOT_PARTICIPANT, http: 422, condition: "An ELECTRONIC receipt was requested, or a REGISTRY transfer attempted, at a warehouse whose registry_participant is false" }
  - { id: ERR_PERFECTION_METHOD_MISMATCH, http: 422, condition: "perfection_method POSSESSION on an ELECTRONIC receipt, or ELECTRONIC_CONTROL on a PAPER receipt" }
  - { id: ERR_RECEIPT_ENCUMBERED, http: 409, condition: "The receipt's encumbrance_state is PLEDGED, so it may not be voided, transferred by its pledgor, or settled out of store" }

  # --- temporal / constraint ------------------------------------------------
  - { id: ERR_VOID_WINDOW_EXPIRED, http: 422, condition: "The void request arrived more than RECEIPT_VOID_WINDOW_HOURS (72) after issued_at on the logical clock" }
  - { id: ERR_BIN_WINDOW_CONFLICT, http: 409, condition: "The requested bin fill window collides with another WEIGHED or ACCEPTED ticket's window inflated by the 240-minute rest buffer" }
  - { id: ERR_LOADOUT_CAPACITY_EXCEEDED, http: 409, condition: "Every loadout lane in [0, loadout_lane_count) is already occupied by an overlapping REQUESTED or LOADED order" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "The reporting period overlaps another DRAFT, UNDER_EXAMINATION or ACCEPTED report of the same warehouse" }
  - { id: ERR_RECEIPT_NUMBER_DUPLICATE, http: 409, condition: "receipt_number is already used at this warehouse, including by a VOIDED or CANCELLED receipt" }
  - { id: ERR_CLAIM_DUPLICATE, http: 409, condition: "The claimant already has a FILED, ALLOWED or SETTLED claim on this receipt" }

  # --- fiscal / capacity ----------------------------------------------------
  - { id: ERR_NET_WORTH_INSUFFICIENT, http: 422, condition: "net_worth_shortfall_cents exceeds net_worth_tolerance_cents at an ISSUE or REINSTATE decision" }
  - { id: ERR_BOND_INSUFFICIENT, http: 422, condition: "bond_deficiency_cents is greater than 0 at an ISSUE or REINSTATE decision" }
  - { id: ERR_LICENSED_CAPACITY_EXCEEDED, http: 422, condition: "Issuing the receipt would push receipted_obligation_bushels past licensed_capacity_bushels" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED, http: 422, condition: "The bin's available_bushels is less than the ticket's net_bushels" }
  - { id: ERR_CREDIT_LINE_EXCEEDED, http: 422, condition: "The lender's available_credit_cents is less than the lien's advance_limit_cents at perfection" }
  - { id: ERR_DELIVERY_EXCEEDS_RECEIPT, http: 422, condition: "requested_bushels exceeds the receipt's outstanding quantity_bushels, or delivered_bushels exceeds requested_bushels" }
  - { id: ERR_CLAIM_NOT_ELIGIBLE, http: 422, condition: "claimed_cents is below 1, or the receipt underlying the claim is not in receipt_state ISSUED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateRegulator
    description: "State or federal grain warehouse regulator: registers licence applications, decides licensing, examines position reports, declares insolvency, adjudicates claims and runs the indemnity allocation"
    identity: "opaque"
    exclusive_operations:
      - "POST /warehouses"
      - "POST /warehouses/{warehouse_id}/license-decision"
      - "POST /warehouses/{warehouse_id}/insolvency"
      - "POST /position-reports/{report_id}/examine"
      - "POST /indemnity-claims/{claim_id}/adjudicate"
      - "PATCH /parties/{party_id}/credit-line"
    shared_operations:
      - "POST /parties (shared with RegistryAdministrator)"
      - "PATCH /warehouses/{warehouse_id}/financials (shared with WarehouseOperator)"
      - "GET /warehouses/{warehouse_id}/position-summary (shared with WarehouseOperator)"
      - "every GET list and single-resource read"
      - "POST /_clock/set_current_utc"
    note: "The regulator recorded in Warehouse.licensed_by_user_id is barred from examining that warehouse's reports (ERR_SEGREGATION_OF_DUTIES); a second regulator X-User-ID must do it."

  - name: WarehouseOperator
    description: "Licensed warehouseman: opens storage agreements and bins, weighs and accepts grain, issues and voids receipts, assesses bin condition, files position reports and loads and settles deliveries"
    identity: "entity_backed:Warehouse"
    exclusive_operations:
      - "POST /storage-agreements"
      - "POST /storage-agreements/{agreement_id}/terminate"
      - "POST /bins"
      - "POST /bins/{bin_id}/condition-assessment"
      - "POST /deposit-tickets"
      - "POST /deposit-tickets/{ticket_id}/accept"
      - "POST /deposit-tickets/{ticket_id}/reject"
      - "POST /receipts"
      - "POST /receipts/{receipt_id}/void"
      - "POST /position-reports"
      - "POST /position-reports/{report_id}/submit"
      - "POST /delivery-orders/{order_id}/load"
      - "POST /delivery-orders/{order_id}/settle"
    shared_operations:
      - "PATCH /warehouses/{warehouse_id}/financials (shared with StateRegulator)"
      - "GET /warehouses/{warehouse_id}/position-summary (shared with StateRegulator)"
      - "every GET list and single-resource read for its own warehouse"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID equals the id of the Warehouse the operator runs; every write is scoped to rows reachable from that warehouse."

  - name: Depositor
    description: "Producer or commercial depositor: holds receipts, transfers paper receipts by endorsement, exercises delivery rights and files indemnity claims"
    identity: "entity_backed:Party"
    exclusive_operations: []
    shared_operations:
      - "POST /receipts/{receipt_id}/transfer (shared with Lender and RegistryAdministrator)"
      - "POST /delivery-orders (shared with Lender)"
      - "POST /delivery-orders/{order_id}/cancel (shared with Lender)"
      - "POST /indemnity-claims (shared with Lender)"
      - "GET reads of its own agreements, tickets, receipts, delivery orders and claims"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID equals a Party.id whose party_kind is PRODUCER_DEPOSITOR or COMMERCIAL_DEPOSITOR. Only PRODUCER_DEPOSITOR claimants are indemnity-fund eligible."

  - name: Lender
    description: "Secured lender: records advances against negotiable receipts, perfects by possession or electronic control, re-marks collateral and releases liens on payoff"
    identity: "entity_backed:Party"
    exclusive_operations:
      - "POST /collateral-liens"
      - "POST /collateral-liens/{lien_id}/perfect"
      - "POST /collateral-liens/{lien_id}/release"
      - "POST /collateral-liens/{lien_id}/revalue"
    shared_operations:
      - "POST /receipts/{receipt_id}/transfer (shared with Depositor and RegistryAdministrator)"
      - "POST /delivery-orders (shared with Depositor)"
      - "POST /delivery-orders/{order_id}/cancel (shared with Depositor)"
      - "POST /indemnity-claims (shared with Depositor)"
      - "GET reads of its own liens and the receipts it holds or controls"
      - "POST /_clock/set_current_utc"
    note: "X-User-ID equals a Party.id whose party_kind is LENDER; every lien write requires lender_party_id to equal it."

  - name: RegistryAdministrator
    description: "Operator of the electronic warehouse receipt registry: registers counterparties and effects registry transfers of electronic receipts"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /parties (shared with StateRegulator)"
      - "POST /receipts/{receipt_id}/transfer with transfer_channel REGISTRY (the only role permitted this channel)"
      - "GET reads of warehouses, parties, receipts and liens"
      - "POST /_clock/set_current_utc"
    note: "Opaque identity: X-User-ID is a registry operator id and is never compared to any entity id. A REGISTRY transfer requires the warehouse's registry_participant to be true."
