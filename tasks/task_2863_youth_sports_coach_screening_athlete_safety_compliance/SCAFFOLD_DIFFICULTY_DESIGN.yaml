# ============================================================================
# 1.8  Scaffold Difficulty Design (Test Targeting Index)
# Task 2863 - Youth Sports Coach Screening & Athlete Safety Compliance
# 9 rule_ids / 21 instances. Every grounds ref resolves into SCAFFOLD.yaml
# §1.1-§1.7; every setup_api_calls chain drives empty-DB into its setup state
# using only endpoints declared in §1.5; the logical clock starts at
# 2026-08-01T00:00:00Z and is repositioned only through
# POST /safesport/_clock/set_current_utc.
# ============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: eligibility_projection_audit_snapshot_vs_renewal_forward
        grounds:
          - calculations.member_eligibility_projection
          - entities.Member.fields.eligible_through
          - entities.TrainingAssignment.fields.status
          - state_machines.TrainingAssignment.ASSIGNED_to_IN_PROGRESS
          - state_machines.Member.SCREENING_ORDERED_to_CLEARED
        distinguishing_aspect: |
          The two variants of member_eligibility_projection differ only in the candidate
          status set fed to per_course_expiry: AUDIT_SNAPSHOT admits {COMPLETED} and
          therefore returns null for a TIER_2 member whose SS201 assignment is merely
          IN_PROGRESS, while RENEWAL_FORWARD admits {COMPLETED, IN_PROGRESS} and projects
          SS201 to complete at its due_at, yielding a non-null 2027-08-01T00:00:00.000Z
          from exactly the same rows.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one club 'Alpha Aquatics' with escrow_balance_cents 500000"
            - "two published courses: SS101 (365-day validity, required for TIER_1/2/3) and SS201 (730-day validity, required for TIER_2/3)"
            - "member m_dv is an ASSISTANT_COACH with minor-athlete contact and a single jurisdiction, so risk_points 55 and required_tier TIER_2"
            - "m_dv has an ADJUDICATED screening with disposition CLEAR and expires_at 2028-07-31T00:00:00.000Z, so screening_status CLEARED"
            - "m_dv's SS101 assignment is COMPLETED at 2026-08-01T00:00:00Z with expires_at 2027-08-01T00:00:00.000Z"
            - "m_dv's SS201 assignment is IN_PROGRESS with due_at 2026-10-01T00:00:00Z and no completed_at"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/training-courses"
              payload: { code: "SS201", title: "Mandatory Reporting", validity_days: 730, delivery_mode: "ONLINE", required_for_tiers: ["TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Dana Reyes", email: "dana.reyes@alpha.test", role_type: "ASSISTANT_COACH", has_minor_athlete_contact: true, date_of_birth: "1985-04-11", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_dv_id: $.data.id }
            - call: "POST /safesport/members/${m_dv_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_dv_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_dv_id}/result"
              payload: { vendor_disposition: "NO_RECORD" }
              as: ScreeningVendor
            - call: "POST /safesport/screening-orders/${so_dv_id}/adjudicate"
              payload: { disposition: "CLEAR", rationale: "registry return carried no records" }
              as: SafeSportOfficer
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_dv_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta101_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta101_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/training-assignments/${ta101_id}/complete"
              payload: { score: 90 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_dv_id}", course_code: "SS201", due_at: "2026-10-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta201_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta201_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
          trigger:
            - call: "GET /safesport/members/${m_dv_id}/eligibility-projection"
              payload: { variant: "AUDIT_SNAPSHOT" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { snap_through: $.data.projected_eligible_through, snap_train: $.data.training_expiry, snap_screen: $.data.screening_expiry }
            - call: "GET /safesport/members/${m_dv_id}/eligibility-projection"
              payload: { variant: "RENEWAL_FORWARD" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { fwd_through: $.data.projected_eligible_through, fwd_train: $.data.training_expiry, fwd_screen: $.data.screening_expiry }
          assert:
            - "${snap_train} == null"
            - "${snap_through} == null"
            - "${fwd_train} == 2027-08-01T00:00:00.000Z"
            - "${fwd_through} == 2027-08-01T00:00:00.000Z"
            - "${snap_screen} == 2028-07-31T00:00:00.000Z"
            - "${fwd_screen} == 2028-07-31T00:00:00.000Z"
            - "${snap_through} != ${fwd_through}"
            - "Member.${m_dv_id}.eligible_through == null"
            - "Member.${m_dv_id}.required_tier == TIER_2"
            - "Member.${m_dv_id}.risk_points == 55"
      - name: compliance_score_self_attested_vs_registry_verified
        grounds:
          - calculations.club_compliance_score
          - entities.Club.fields.roster_size_attested
          - entities.ClubAudit.fields.score_variant
          - entities.CoachAssignment.fields.status
          - state_machines.ClubAudit.SAMPLED_to_FINDINGS_ISSUED
        distinguishing_aspect: |
          Two ClubAudit rows over the identical sampled_member_ids [m_c1, m_c2, m_c3] with
          the identical compliant_member_count of 1 finalize to 33.33 under SELF_ATTESTED
          (denominator = Club.roster_size_attested = 3) and to 100.00 under
          REGISTRY_VERIFIED (denominator = the single PENDING CoachAssignment at the club),
          so the variant alone moves the score by 66.67 points.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with roster_size_attested 3 and escrow_balance_cents 500000"
            - "course SS101 published, 365-day validity, required for TIER_1"
            - "member m_c1 is a VOLUNTEER with no minor-athlete contact and one jurisdiction, so risk_points 10 and required_tier TIER_1"
            - "m_c1 is fully compliant: screening_status CLEARED, training_status CURRENT, membership_status ACTIVE, no interim measure"
            - "members m_c2 and m_c3 exist but are UNSCREENED, training_status NEVER and membership_status PENDING"
            - "exactly one CoachAssignment exists at the club, for m_c1, in status PENDING"
            - "two audits over the same period sample the same three members, one per score_variant"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Corey Vance", email: "corey.vance@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-02-02", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_c1_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Blair Nunez", email: "blair.nunez@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1991-03-03", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_c2_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Rowan Pike", email: "rowan.pike@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1992-04-04", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_c3_id: $.data.id }
            - call: "POST /safesport/members/${m_c1_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_c1_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_c1_id}/result"
              payload: { vendor_disposition: "NO_RECORD" }
              as: ScreeningVendor
            - call: "POST /safesport/screening-orders/${so_c1_id}/adjudicate"
              payload: { disposition: "CLEAR", rationale: "registry return carried no records" }
              as: SafeSportOfficer
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_c1_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta_c1_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta_c1_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/training-assignments/${ta_c1_id}/complete"
              payload: { score: 95 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/coach-assignments"
              payload: { member_id: "${m_c1_id}", club_id: "${club_a_id}", team_name: "Senior Squad", season_start: "2026-09-01T00:00:00Z", season_end: "2027-06-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ca_c1_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-08-01T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_c1_id}", "${m_c2_id}", "${m_c3_id}"] }
              as: ComplianceAuditor
              captures: { audit_sa_id: $.data.id }
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-08-01T00:00:00Z", score_variant: "REGISTRY_VERIFIED", sampled_member_ids: ["${m_c1_id}", "${m_c2_id}", "${m_c3_id}"] }
              as: ComplianceAuditor
              captures: { audit_rv_id: $.data.id }
          trigger:
            - call: "POST /safesport/club-audits/${audit_sa_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { sa_score: $.data.compliance_score, sa_denom: $.data.denominator_count, sa_num: $.data.compliant_member_count }
            - call: "POST /safesport/club-audits/${audit_rv_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { rv_score: $.data.compliance_score, rv_denom: $.data.denominator_count, rv_num: $.data.compliant_member_count }
          assert:
            - "${sa_num} == 1"
            - "${rv_num} == 1"
            - "${sa_denom} == 3"
            - "${rv_denom} == 1"
            - "${sa_score} == 33.33"
            - "${rv_score} == 100.00"
            - "ClubAudit.${audit_sa_id}.sampled_member_count == 3"
            - "ClubAudit.${audit_rv_id}.sampled_member_count == 3"
            - "ClubAudit.${audit_sa_id}.status == FINDINGS_ISSUED"
            - "Club.${club_a_id}.compliance_score == 100.00"

  - rule_id: combinatorial_formula
    instances:
      - name: screening_charge_discount_keyed_on_pre_discount_gross
        grounds:
          - calculations.screening_order_charge
          - entities.ScreeningOrder.fields.gross_subtotal_cents
          - entities.ScreeningOrder.fields.discount_cents
          - entities.ScreeningOrder.fields.expedite_cents
          - entities.ScreeningOrder.fields.charged_cents
          - state_machines.Member.UNSCREENED_to_SCREENING_ORDERED
        distinguishing_aspect: |
          This instance pins combinatorial mode (c): the volume-discount band is selected from
          the PRE-discount gross_subtotal of 11400 (which lands in the 5% band, not the 10%
          band), while the 35% expedite fee is taken on the POST-discount net of 10830, so
          charged_cents is exactly 14621 - keying the band on the post-expedite total or
          applying the expedite percentage to the gross both produce a different number of cents.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000 and total_funded_cents 500000"
            - "member m_ch is a HEAD_COACH with minor-athlete contact and three jurisdiction codes, so risk_points 75 and required_tier TIER_3"
            - "no screening order exists for m_ch yet"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Harper Diaz", email: "harper.diaz@alpha.test", role_type: "HEAD_COACH", has_minor_athlete_contact: true, date_of_birth: "1980-05-05", jurisdiction_codes: ["CA", "NV", "OR"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_ch_id: $.data.id }
          trigger:
            - call: "POST /safesport/members/${m_ch_id}/screening-orders"
              payload: { expedited: true, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_ch_id: $.data.id, gross: $.data.gross_subtotal_cents, disc: $.data.discount_cents, exp: $.data.expedite_cents, charged: $.data.charged_cents, so_tier: $.data.tier, so_jc: $.data.jurisdiction_count }
          assert:
            - "${so_tier} == TIER_3"
            - "${so_jc} == 3"
            - "${gross} == 11400"
            - "${disc} == 570"
            - "${exp} == 3791"
            - "${charged} == 14621"
            - "ScreeningOrder.${so_ch_id}.status == ORDERED"
            - "Club.${club_a_id}.escrow_balance_cents == 485379"
            - "Club.${club_a_id}.total_funded_cents == 500000"
            - "Member.${m_ch_id}.screening_status == SCREENING_ORDERED"
      - name: sanction_fine_rounds_per_finding_before_sum
        grounds:
          - calculations.audit_sanction_fine
          - calculations.club_compliance_score
          - entities.AuditFinding.fields.fine_cents
          - entities.ClubAudit.fields.sanction_fine_cents
          - state_machines.ClubAudit.FINDINGS_ISSUED_to_CLOSED_SANCTIONED
        distinguishing_aspect: |
          This instance pins combinatorial mode (b): with compliance_score 33.33 the
          shortfall_factor is 1.68004 and each of the three MINOR repeat findings has a raw
          fine of 11550.275 cents, so rounding per finding first gives 11550 each and a total
          of exactly 34650, whereas summing the raw amounts to 34650.825 and rounding once
          gives 34651 - a one-cent divergence that only the pinned order reproduces.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with roster_size_attested 3 and escrow_balance_cents 500000"
            - "course SS101 published, required for TIER_1"
            - "member m_s1 is fully compliant (CLEARED / CURRENT / ACTIVE); members m_s2 and m_s3 are UNSCREENED"
            - "audit audit_s over the three sampled members with score_variant SELF_ATTESTED, still in status SAMPLED"
            - "three findings on audit_s, each finding_code RECORDS_INCOMPLETE, severity MINOR, is_repeat true, all in status OPEN"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"], pass_score: 80 }
              as: NgbAdmin
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Sasha Long", email: "sasha.long@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-02-02", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_s1_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Nico Bell", email: "nico.bell@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1991-03-03", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_s2_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Wren Ortiz", email: "wren.ortiz@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1992-04-04", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_s3_id: $.data.id }
            - call: "POST /safesport/members/${m_s1_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_s1_id: $.data.id }
            - call: "POST /safesport/screening-orders/${so_s1_id}/result"
              payload: { vendor_disposition: "NO_RECORD" }
              as: ScreeningVendor
            - call: "POST /safesport/screening-orders/${so_s1_id}/adjudicate"
              payload: { disposition: "CLEAR", rationale: "registry return carried no records" }
              as: SafeSportOfficer
            - call: "POST /safesport/training-assignments"
              payload: { member_id: "${m_s1_id}", course_code: "SS101", due_at: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { ta_s1_id: $.data.id }
            - call: "POST /safesport/training-assignments/${ta_s1_id}/start"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/training-assignments/${ta_s1_id}/complete"
              payload: { score: 95 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "POST /safesport/club-audits"
              payload: { club_id: "${club_a_id}", audit_period_start: "2026-01-01T00:00:00Z", audit_period_end: "2026-08-01T00:00:00Z", score_variant: "SELF_ATTESTED", sampled_member_ids: ["${m_s1_id}", "${m_s2_id}", "${m_s3_id}"] }
              as: ComplianceAuditor
              captures: { audit_s_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_s_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", is_repeat: true }
              as: ComplianceAuditor
              captures: { f1_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_s_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", is_repeat: true }
              as: ComplianceAuditor
              captures: { f2_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_s_id}/findings"
              payload: { finding_code: "RECORDS_INCOMPLETE", severity: "MINOR", is_repeat: true }
              as: ComplianceAuditor
              captures: { f3_id: $.data.id }
            - call: "POST /safesport/club-audits/${audit_s_id}/finalize"
              payload: {}
              as: ComplianceAuditor
              captures: { s_score: $.data.compliance_score }
          trigger:
            - call: "POST /safesport/club-audits/${audit_s_id}/close"
              payload: { resolution: "SANCTION" }
              as: ComplianceAuditor
              captures: { total_fine: $.data.sanction_fine_cents, close_status: $.data.status }
          assert:
            - "${s_score} == 33.33"
            - "AuditFinding.${f1_id}.fine_cents == 11550"
            - "AuditFinding.${f2_id}.fine_cents == 11550"
            - "AuditFinding.${f3_id}.fine_cents == 11550"
            - "${total_fine} == 34650"
            - "${total_fine} != 34651"
            - "${close_status} == CLOSED_SANCTIONED"
            - "Club.${club_a_id}.sanction_status == SUSPENDED"
            - "Club.${club_a_id}.compliance_posture == FROZEN"
      - name: screening_tier_nested_caps_with_role_branch
        grounds:
          - calculations.screening_tier_assignment
          - entities.Member.fields.risk_points
          - entities.Member.fields.required_tier
          - entities.Member.fields.jurisdiction_codes
          - state_machines.Member.FLAGGED_to_CLEARED
