        grounds:
          - "calculations.grace_deadline_projection"
          - "state_machines.LicensePool.IN_GRACE_to_OUT_OF_COMPLIANCE"
        distinguishing_aspect: "Numeric threshold boundary: at exactly grace_deadline the pool remains IN_GRACE (breach requires strictly greater); one second later it flips to OUT_OF_COMPLIANCE — tested via the clock endpoint, not a formula duplicate."
        test_recipe:
          setup:
            - "Pool purchased 1, assignment 2 -> overage detected at 2026-09-01T00:00:00Z; grace_deadline = 2026-11-30T00:00:00Z (90 days)"
