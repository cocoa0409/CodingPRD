            - { call: "POST /petting-zoo/bookings/${bk_a}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk_a}/payments", payload: { amount_cents: 5322, method: "CARD" }, as: Customer, as_user_id: "${c12}" }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v12}", start_time: "2026-06-18T14:00:00Z", end_time: "2026-06-18T16:00:00Z", guest_count: 40, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 2 }, as: Customer, as_user_id: "${c12}", captures: { bk_b: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk_b}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba_b: $.data.id } }
