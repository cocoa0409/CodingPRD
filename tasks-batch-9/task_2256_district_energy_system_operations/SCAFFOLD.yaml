    roles: [BillingAnalyst]
    code: 200
    input: ["reason?"]
    output: Invoice
    side_effects: ["sets invoice_state = VOID", "recomputes ConnectionAgreement.balance_due", "cascades billing_state IN_ARREARS to CURRENT when balance_due falls to or below ARREARS_THRESHOLD_AMOUNT", "increments ConnectionAgreement.version by 1"]

