      - name: investigation_closed_interval_collides_on_touch_and_releases_on_clear
        resource: Investigation windows (a per-creator resource, scoped by creator_id)
        interval_semantics: "fully closed [violation_window_start, violation_window_end]: collision iff a.start <= b.end AND b.start <= a.end, so mere touching collides"
        grounds:
          - validations.priority_70
          - errors.ERR_INVESTIGATION_WINDOW_OVERLAP
          - entities.Investigation.fields.violation_window_start
          - entities.Investigation.fields.violation_window_end
          - entities.Investigation.fields.state
          - "endpoints.POST /monetization/investigations"
          - "state_machines.Investigation.transitions[OPEN -> CLEARED]"
          - validations.priority_44
        distinguishing_aspect: |
          A different resource with STRICTLY DIFFERENT interval semantics:
          Investigation violation windows are FULLY CLOSED, so unlike
          EarningsPeriod the shared endpoint belongs to BOTH intervals and mere
          touching is a collision - a second window starting at exactly the
          first window's end instant is rejected 409
          ERR_INVESTIGATION_WINDOW_OVERLAP, and it only becomes legal one second
          later. The resource is also per-creator and occupancy is
          state-scoped: only OPEN investigations reserve the window, so
          clearing the first investigation releases its window and the very
          same previously-rejected payload is then accepted.
        test_recipe:
          setup:
            - "Two GB Creators c1 and c2 (follower_count 10000, watch_time_minutes_365d 240000), both evaluated to ELIGIBLE, no accruals, no periods needed."
            - "PolicyReviewer reviewer-r1 has one OPEN Investigation I1 on c1 over the closed window [2026-07-01T00:00:00Z, 2026-07-31T00:00:00Z], hold_payouts false (so no HOLD interference)."
