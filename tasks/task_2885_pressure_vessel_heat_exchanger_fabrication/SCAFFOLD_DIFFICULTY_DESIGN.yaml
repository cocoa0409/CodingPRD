            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-003", joint_category: "B", joint_type: "BUTT", thickness_in: 1.5010, wps_id: "${wps_id}", part_a_id: "${sh01_id}", part_b_id: "${hd01_id}" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
              captures: { w3_id: $.data.id, w3_pct: $.data.required_volumetric_pct, w3_method: $.data.volumetric_method }
            - call: "POST /vessel-jobs/${job_id}/production-welds"
              payload: { weld_number: "W-004", joint_category: "B", joint_type: "BUTT", thickness_in: 1.9990, wps_id: "${wps_id}", part_a_id: "${sh01_id}", part_b_id: "${hd01_id}" }
              as: WeldingEngineer
              as_user_id: "${we1_id}"
