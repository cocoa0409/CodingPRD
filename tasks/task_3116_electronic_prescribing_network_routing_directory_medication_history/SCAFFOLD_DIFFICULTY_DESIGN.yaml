            - "the rx_b cancel returns 409 with error_id == ERR_INVALID_STATE, not ERR_CRITICAL_ORDER_DELIVERY_REQUIRED, because rx_b's routing_status is ROUTE_FAILED which the state band rejects two bands earlier"
            - "the two error_ids differ even though both rows are CRITICAL SCHEDULE_II orders — the priority bands, not the significance, decide"
            - "Prescription.${rx_a_id}.clinical_status == ROUTED and Prescription.${rx_b_id}.clinical_status == SIGNED after both rejections"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: medication_history_batch_cost_cap_boundary_at_forty_records
        grounds:
          - calculations.medication_history_batch_cost
          - calculations.medication_history_batch_cost.variants.capped_charge
          - entities.MedicationHistoryBatch.fields.batch_cost_cents
          - entities.MedicationHistoryBatch.fields.subscription_generation
          - state_machines.MedicationHistoryBatch.transitions.COMPLETE_to_AGGREGATING
        distinguishing_aspect: "The record-cap boundary is inclusive at 40: a batch whose source_record_count is exactly 40 costs 425, and so does 41, while 39 costs 415 — the > versus >= distinction sits on the count, and the same boundary is reachable a second time by re-aggregating the batch."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One patient with an ACTIVE MEDICATION_HISTORY-scope consent of 365 days, holding 41 live history records from a CERTIFIED pharmacy participant: 40 sharing one dedupe_key and one with a different NDC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Riverbend Pharmacy", participant_type: "PHARMACY", npi: "2222222222", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0200" }
              as: NetworkOperator
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /network/participants/${ph_id}/endpoints"
              payload: { service_set: "MED_HISTORY", endpoint_role: "RECEIVER", service_level: "ELIGIBLE_A", sla_response_minutes: 60, message_standard: "NCPDP_SCRIPT_2022011", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
              captures: { ep_hist_id: $.data.id }
            - call: "POST /network/participants/${ph_id}/certification/start"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "CONNECTIVITY", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certification/tests"
              payload: { test_code: "SCRIPT_NEW_RX", outcome: "PASS" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/participants/${ph_id}/certify"
              payload: { expected_participant_version: "${ph_v}" }
              as: ParticipantAdmin
              as_user_id: "${ph_id}"
            - call: "POST /network/patients"
              payload: { full_name: "Perla Vance", date_of_birth: "1958-07-19T00:00:00Z", home_state: "MA" }
              as: PatientService
              captures: { pa_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/consents"
              payload: { scope: "MEDICATION_HISTORY", duration_days: 365 }
              as: PatientService
              captures: { cns_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PHARMACY_FILL", source_participant_id: "${ph_id}", drug_ndc: "00093314905", fill_date: "2026-06-01T00:00:00Z", days_supply: 30, quantity: 60 }
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { rec_a_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PHARMACY_FILL", source_participant_id: "${ph_id}", drug_ndc: "00093314905", fill_date: "2026-06-01T00:00:00Z", days_supply: 30, quantity: 30 }
              as: Pharmacy
              as_user_id: "${ph_id}"
              captures: { rec_b_id: $.data.id }
            - call: "POST /network/patients/${pa_id}/history-records"
              payload: { source_type: "PAYER_CLAIM", source_participant_id: "${ph_id}", drug_ndc: "00093314906", fill_date: "2026-07-01T00:00:00Z", days_supply: 90, quantity: 90 }
              as: HubOperator
              captures: { rec_c_id: $.data.id }
            - call: "POST /network/medication-history/batches"
              payload: { patient_id: "${pa_id}", trigger_reason: "PRESCRIBER_QUERY" }
              as: Prescriber
              as_user_id: "${ph_id}"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /network/medication-history/batches/${batch_id}/aggregate"
              payload: {}
              as: HubOperator
              captures: { src_count: $.data.source_record_count, rec_count: $.data.record_count, cost: $.data.batch_cost_cents, gen: $.data.subscription_generation }
            - call: "POST /network/medication-history/batches/${batch_id}/aggregate"
              payload: {}
              as: HubOperator
              captures: { gen2: $.data.subscription_generation }
          assert:
            - "the settled batch reports source_record_count == 3, record_count == 2 and superseded_count == 1"
            - "batch_cost_cents == 55, because 3 source records is below the record cap: 25 + 10 * 3"
            - "the cap boundary is inclusive at 40: a batch with source_record_count == 40 costs 25 + 10 * 40 == 425 and a batch with 41 costs the same 425, while 39 costs 25 + 10 * 39 == 415"
            - "MedicationHistoryRecord.${rec_b_id}.is_superseded == true because ${rec_a_id} wins the shared dedupe_key on quantity 60 > 30"
            - "MedicationHistoryRecord.${rec_c_id}.is_superseded == false — a distinct dedupe_key always wins its own partition"
            - "subscription_generation == 1 after the first settlement and == 2 after the re-aggregation, so the cyclic refresh advanced the round counter twice"

      - name: monthly_chargeable_ceiling_boundary_at_seven_thousand_five_hundred
        grounds:
          - calculations.transaction_fee_settlement
          - entities.TransactionFeeEntry.fields.fee_cents
          - constants.MONTHLY_CHARGEABLE_CEILING
          - validations[priority=9]
        distinguishing_aspect: "The monthly chargeable ceiling is applied with min() before tiering, so 7499 and 7500 settle at different amounts (60093 vs 60100) while 7500 and 7501 settle at the same 60100 — the run crosses the boundary exactly once and the top tier is absorbed above it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Northside Family Clinic is a MONTHLY sender with no prior fee rows for 2026-09."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkOperator
            - call: "POST /network/participants"
              payload: { name: "Northside Family Clinic", participant_type: "PRESCRIBER_CLINIC", npi: "1111111111", volume_billing_mode: "MONTHLY", fallback_channel: "FAX", fax_number: "+1-555-0100" }
              as: NetworkOperator
              captures: { cl_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "NEW_RX", direction: "SENT", transaction_count: 7499 }
              as: NetworkOperator
              captures: { e_below_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "REFILL_RESPONSE", direction: "SENT", transaction_count: 7500 }
              as: NetworkOperator
              captures: { e_at_id: $.data.id }
            - call: "POST /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09", transaction_type: "CHANGE_RESPONSE", direction: "SENT", transaction_count: 7501 }
              as: NetworkOperator
              captures: { e_above_id: $.data.id }
          trigger:
            - call: "GET /network/transaction-fees"
              payload: { participant_id: "${cl_id}", month_key: "2026-09" }
              as: NetworkOperator
              captures: { below_fee: "$.data[0].fee_cents", at_fee: "$.data[1].fee_cents", above_fee: "$.data[2].fee_cents", below_tier: "$.data[0].fee_tier" }
          assert:
            - "TransactionFeeEntry.${e_below_id}.fee_cents == 60093 (5499*12 + 2000*7) and fee_tier == VOLUME"
            - "TransactionFeeEntry.${e_at_id}.fee_cents == 60100 (5500*12 + 2000*7) — 7500 sits exactly on the ceiling and is charged in full"
            - "TransactionFeeEntry.${e_above_id}.fee_cents == 60100 — 7501 is clamped down to 7500 before tiering, so it costs the same as the ceiling row rather than 60107"
            - "the unclamped schedule for 7501 would have been 5500*12 + 2001*7 == 60107, the value this scaffold must NOT produce"
            - "the three cells are independent: below_fee != at_fee and at_fee == above_fee"
            - "TransactionFeeEntry.${cl_id}.period_net_total_cents == 180293, the sum across all three cells for 2026-09"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: controlled_sign_requires_pharmacy_endpoint_active
        grounds:
          - state_machines.Prescription.transitions.DRAFT_to_SIGNED
          - state_machines.DirectoryEndpoint.transitions.PENDING_CERT_to_ACTIVE
          - errors[ERR_PHARMACY_NOT_CERTIFIED_FOR_CONTROLLED]
          - validations[priority=5]
        distinguishing_aspect: "The Prescription→DirectoryEndpoint pair: a controlled order's DRAFT→SIGNED move depends on the receiving pharmacy holding an ACTIVE NEW_RX endpoint, so flipping only DirectoryEndpoint.status from ACTIVE to PENDING_CERT — with nothing else changed — flips the sign result from success to ERR_PHARMACY_NOT_CERTIFIED_FOR_CONTROLLED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Riverbend Pharmacy holds exactly one NEW_RX endpoint and is in certification_status IN_CERTIFICATION, so the endpoint sits at PENDING_CERT. The prescriber's identity proofing and two-factor authentication have both passed on an OPEN session for a SCHEDULE_II order."
