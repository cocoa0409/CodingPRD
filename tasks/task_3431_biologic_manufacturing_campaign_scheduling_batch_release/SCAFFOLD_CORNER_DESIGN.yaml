# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3431_biologic_manufacturing_campaign_scheduling_batch_release
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: site_create_returns_posture_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.ManufacturingSite
          - endpoints.POST_/sites
          - response_envelope
        distinguishing_aspect: "A site created with the five required fields returns 201 with release_posture CLEAR, both open counts 0, version 1, system id and timestamps, and the fixed success envelope with meta.api_request_id."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_site
              call: "POST /sites"
              payload: { name: "Providence Biologics", region: "US-RI", monthly_capacity_hours: 5000, cold_storage_capacity_units: 10000000, licensed_authorities: ["FDA", "EMA"] }
              as: PlatformAdmin
              captures: { site_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id plus meta.api_request_timestamp are present"
            - "ManufacturingSite.${site_id}.release_posture == CLEAR"
            - "ManufacturingSite.${site_id}.open_critical_deviation_count == 0 and open_critical_finding_count == 0"
            - "version == 1 and id, created_at, updated_at are non-null"

      - name: campaign_create_computes_allocated_hours_and_starts_proposed
        claim_type: Computed Fields
        grounds:
          - entities.Campaign.fields.allocated_hours
          - entities.Campaign.fields.status
          - calculations.allocated_hours
        distinguishing_aspect: "The first campaign on a train computes allocated_hours with a zero changeover component: ceil(20/8)*8 + ceil(30/24)*24 + 0 == 72, and lands in PROPOSED regardless of any client-supplied status."
        test_recipe:
          setup:
            - "Site, product MAB-001, and train TR-1 exist."
          setup_api_calls:
            - *k_clock
            - *k_site
            - &k_product
              call: "POST /products"
              payload: { product_code: "MAB-001", molecule_type: "MONOCLONAL_ANTIBODY", market_scope: "BOTH", requires_cold_chain: true, min_storage_temp_c: 2.0, max_storage_temp_c: 8.0, shelf_life_hours: 2160, changeover_hours: 14, same_product_turnaround_hours: 6, required_materials: [] }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - &k_train
              call: "POST /sites/${site_id}/trains"
              payload: { train_code: "TR-1", capacity_liters: 2000, supported_molecule_types: ["MONOCLONAL_ANTIBODY"] }
              as: PlatformAdmin
              captures: { train_id: $.data.id }
          trigger:
            - &k_campaign
              call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { camp_id: $.data.id, camp_hours: $.data.allocated_hours }
          assert:
            - "the response status is 201"
            - "Campaign.${camp_id}.status == PROPOSED"
            - "${camp_hours} == 72 (24 upstream + 48 downstream + 0 changeover; first campaign on the train)"
            - "Campaign.${camp_id}.version == 1"

      - name: product_create_missing_shelf_life_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Product.fields.shelf_life_hours
          - errors.ERR_INVALID_REQUEST
          - validations[priority=3.2]
        distinguishing_aspect: "shelf_life_hours is a required input with no default; omitting it yields 400 ERR_INVALID_REQUEST before any state or business rule runs."
        test_recipe:
          setup:
            - "Empty database; clock at default."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /products"
              payload: { product_code: "MAB-002", molecule_type: "MONOCLONAL_ANTIBODY", market_scope: "BOTH", requires_cold_chain: true, min_storage_temp_c: 2.0, max_storage_temp_c: 8.0, changeover_hours: 14, same_product_turnaround_hours: 6, required_materials: [] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST"

      - name: campaign_create_with_unknown_demand_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Campaign.fields.demand_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "demand_type is a closed enum {CLINICAL, COMMERCIAL}; the value ORPHAN is rejected 400 at field validation, before window or market-scope checks."
        test_recipe:
          setup:
            - "Site, product, and train exist."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
          trigger:
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "ORPHAN", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-20T00:00:00Z", upstream_hours: 20, downstream_hours: 30 }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST"

      - name: campaign_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/campaigns/{id}
          - errors.ERR_CAMPAIGN_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A well-formed but unallocated campaign id produces 404 ERR_CAMPAIGN_NOT_FOUND with the error envelope (response_type error; data.error_id and data.message present), not a generic 500 or 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /campaigns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and ${err} == ERR_CAMPAIGN_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: campaigns_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/campaigns
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three campaigns on one train, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the demand_type filter selects the single CLINICAL campaign."
        test_recipe:
          setup:
            - "One train with three campaigns: A COMMERCIAL 10-01..10-05, B COMMERCIAL 10-05T06:00..10-10 (6-hour turnaround exactly), C CLINICAL 10-20..10-25."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-01T00:00:00Z", planned_end_utc: "2026-10-05T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { pg_a: $.data.id }
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "COMMERCIAL", planned_start_utc: "2026-10-05T06:00:00Z", planned_end_utc: "2026-10-10T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { pg_b: $.data.id }
            - call: "POST /trains/${train_id}/campaigns"
              payload: { product_id: "${prod_id}", demand_type: "CLINICAL", planned_start_utc: "2026-10-20T00:00:00Z", planned_end_utc: "2026-10-25T00:00:00Z", upstream_hours: 8, downstream_hours: 24 }
              as: ProcessEngineer
              captures: { pg_c: $.data.id }
          trigger:
            - call: "GET /campaigns"
              payload: { train_id: "${train_id}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /campaigns?train_id=${train_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /campaigns?train_id=${train_id}&demand_type=CLINICAL returns exactly 1 row: ${pg_c}"
            - "GET /campaigns with no parameters uses limit 10 and offset 0"

      - name: batch_create_initializes_parallel_dimensions_and_provisional_yield
        claim_type: Creation
        grounds:
          - entities.BatchLot
          - calculations.batch_yield
          - endpoints.POST_/campaigns/{id}/batches
        distinguishing_aspect: "A freshly created batch carries process_status UPSTREAM and quality_status IN_TESTING simultaneously, provisional yield 400000 on a 2000 L train, available_to_ship_units equal to quantity_units (no shipments yet), manufactured_by_user_id stamped from the header, and final_yield_units null."
        test_recipe:
          setup:
            - "Commercial campaign in PRODUCTION_IN_PROGRESS (seed train of one stage completed within the inoculation window)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - &k_alloc
              call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "ALLOCATED" }
              as: ProcessEngineer
            - &k_seed
              call: "POST /campaigns/${camp_id}/seed-stages"
              payload: { stage_index: 1, planned_duration_hours: 10 }
              as: ProcessEngineer
              captures: { ss1: $.data.id }
            - &k_seed_start
              call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "SEED_IN_PROGRESS" }
              as: ProcessEngineer
            - &k_seed_run
              call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
            - &k_clock10
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T10:00:00Z" }
              as: PlatformAdmin
            - &k_seed_done
              call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
            - &k_prod
              call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "PRODUCTION_IN_PROGRESS" }
              as: ProcessEngineer
          trigger:
            - &k_batch
              call: "POST /campaigns/${camp_id}/batches"
              payload: { lot_number: "LOT-0001" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id, bat_v: $.data.version }
          assert:
            - "the response status is 201"
            - "BatchLot.${batch_id}.process_status == UPSTREAM and quality_status == IN_TESTING"
            - "provisional_yield_units == 400000 and quantity_units == 400000 and available_to_ship_units == 400000"
            - "final_yield_units is null and expiry_utc is null and process_completed_at is null"
            - "manufactured_by_user_id == op-1"

      - name: site_create_with_client_supplied_id_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ManufacturingSite
          - endpoints.POST_/sites
        distinguishing_aspect: "id is server-minted: a client-supplied id in the create body is ignored, and the returned id is a different server-generated UUID."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /sites"
              payload: { name: "Juncos Fill-Finish", region: "PR-JUN", monthly_capacity_hours: 4000, cold_storage_capacity_units: 5000000, licensed_authorities: ["FDA"], id: "00000000-0000-4000-8000-000000000000" }
              as: PlatformAdmin
              captures: { new_site_id: $.data.id }
          assert:
            - "the response status is 201"
            - "${new_site_id} != 00000000-0000-4000-8000-000000000000 (server-minted identity wins)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: campaign_advance_skip_proposed_to_seed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Campaign
          - errors.ERR_INVALID_CAMPAIGN_STATE
        distinguishing_aspect: "PROPOSED -> SEED_IN_PROGRESS skips ALLOCATED and is not in the transition table; rejected with ERR_INVALID_CAMPAIGN_STATE and no side effects."
        test_recipe:
          setup:
            - "One PROPOSED campaign."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
          trigger:
            - call: "POST /campaigns/${camp_id}/advance"
              payload: { to_status: "SEED_IN_PROGRESS" }
              as: ProcessEngineer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_INVALID_CAMPAIGN_STATE"
            - "Campaign.${camp_id}.status remains PROPOSED"

      - name: batch_advance_skip_upstream_to_complete_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.BatchLot
          - errors.ERR_INVALID_BATCH_STATE
        distinguishing_aspect: "UPSTREAM -> PROCESS_COMPLETE is not a declared hop (DOWNSTREAM is required between them); rejected with ERR_INVALID_BATCH_STATE even though the batch is otherwise healthy."
        test_recipe:
          setup:
            - "Batch freshly created (process UPSTREAM)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
          trigger:
            - call: "POST /batches/${batch_id}/advance"
              payload: { to_status: "PROCESS_COMPLETE" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_INVALID_BATCH_STATE"
            - "BatchLot.${batch_id}.process_status remains UPSTREAM"

      - name: verify_already_verified_test_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.InProcessTest.RECORDED_to_VERIFIED
          - errors.ERR_TEST_NOT_RECORDED
        distinguishing_aspect: "Verifying the same test twice: the second verify finds status VERIFIED (not RECORDED) and fails with ERR_TEST_NOT_RECORDED; verified_by_user_id is unchanged."
        test_recipe:
          setup:
            - "Batch in UPSTREAM with one VERIFIED viability test."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - &k_test_up
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "CELL_VIABILITY", phase: "UPSTREAM", measured_value: 85.0, unit: "PCT", spec_min: 80.0, spec_max: 100.0, expected_batch_version: "${bat_v}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_up: $.data.id }
            - &k_verify_up
              call: "POST /tests/${t_up}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
          trigger:
            - call: "POST /tests/${t_up}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-2"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_TEST_NOT_RECORDED"
            - "InProcessTest.${t_up}.status stays VERIFIED with verified_by_user_id == qc-1"

      - name: disposition_on_released_batch_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BatchLot
          - errors.ERR_INVALID_BATCH_STATE
        distinguishing_aspect: "RELEASED is terminal for the quality dimension: a second disposition attempt on an already-RELEASED batch fails with ERR_INVALID_BATCH_STATE and leaves the batch untouched."
        test_recipe:
          setup:
            - "Commercial batch fully RELEASED."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - *k_test_up
            - *k_verify_up
            - &k_adv_down
              call: "POST /batches/${batch_id}/advance"
              payload: { to_status: "DOWNSTREAM" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - &k_getb
              call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v2: $.data.version }
            - &k_test_t1
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.4, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_v2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_t1: $.data.id }
            - &k_verify_t1
              call: "POST /tests/${t_t1}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - &k_getb3
              call: "GET /batches/${batch_id}"
              payload: {}
              as: Any
              captures: { bat_v3: $.data.version }
            - &k_test_t2
              call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "TITER", phase: "DOWNSTREAM", measured_value: 2.6, unit: "G/L", spec_min: 2.0, spec_max: 4.0, expected_batch_version: "${bat_v3}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_t2: $.data.id }
            - &k_verify_t2
              call: "POST /tests/${t_t2}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - &k_adv_pc
              call: "POST /batches/${batch_id}/advance"
              payload: { to_status: "PROCESS_COMPLETE" }
              as: ManufacturingOperator
              as_user_id: "op-1"
            - &k_submit
              call: "POST /batches/${batch_id}/submit-for-review"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
            - &k_release
              call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "RELEASED", rationale: "All specifications met" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-1"
          trigger:
            - call: "POST /batches/${batch_id}/disposition"
              payload: { decision: "REJECTED", rationale: "Second disposition attempt on a released batch" }
              as: QualityAssuranceReviewer
              as_user_id: "qa-2"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_INVALID_BATCH_STATE"
            - "BatchLot.${batch_id}.quality_status remains RELEASED"

      - name: deliver_quarantined_shipment_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Shipment
          - errors.ERR_INVALID_SHIPMENT_STATE
        distinguishing_aspect: "A shipment pushed to QUARANTINED by an UNACCEPTABLE MKT evaluation (single 14.0 degree C spike exceeds the 9.0 limit) cannot subsequently be DELIVERED."
        test_recipe:
          setup:
            - "RELEASED commercial batch; shipment IN_TRANSIT that logged a single 14.0 degree C spike (13.0 spike guard exceeded) and was evaluated UNACCEPTABLE."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - *k_test_up
            - *k_verify_up
            - *k_adv_down
            - *k_getb
            - *k_test_t1
            - *k_verify_t1
            - *k_getb3
            - *k_test_t2
            - *k_verify_t2
            - *k_adv_pc
            - *k_submit
            - *k_release
            - &k_ship1
              call: "POST /batches/${batch_id}/shipments"
              payload: { destination_region: "IE-DUB", market_type: "COMMERCIAL", quantity_units: 1000 }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { ship1: $.data.id }
            - &k_ship1_go
              call: "POST /shipments/${ship1}/action"
              payload: { action: "SHIP" }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship1}/readings"
              payload: { recorded_at: "2026-10-02T01:00:00Z", temperature_c: 14.0 }
              as: SupplyPlanner
              as_user_id: "sp-1"
            - call: "POST /shipments/${ship1}/evaluate-excursion"
              payload: {}
              as: QualityAssuranceReviewer
              as_user_id: "qa-2"
          trigger:
            - call: "POST /shipments/${ship1}/action"
              payload: { action: "DELIVER" }
              as: SupplyPlanner
              as_user_id: "sp-1"
              captures: { err: $.data.error_id }
          assert:
            - "after the 14.0 reading the shipment was EXCURSION_HOLD with excursion_evaluation PENDING; after evaluation it is QUARANTINED with excursion_evaluation == UNACCEPTABLE"
            - "the DELIVER attempt is rejected 409 with ${err} == ERR_INVALID_SHIPMENT_STATE"
            - "Shipment.${ship1}.status remains QUARANTINED and delivered_at stays null"

      - name: seed_stage_failed_retry_cycle_succeeds
        claim_type: valid_transition
        grounds:
          - state_machines.SeedTrainStage.FAILED_to_RUNNING
          - state_machines.SeedTrainStage.RUNNING_to_COMPLETED
        distinguishing_aspect: "The seed-stage machine is cyclic for recovery: RUNNING -> FAILED -> RUNNING -> COMPLETED, with started_at refreshed by the retry."
        test_recipe:
          setup:
            - "Campaign in SEED_IN_PROGRESS with stage 1 defined."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "FAILED" }
              as: ProcessEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T02:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "RUNNING" }
              as: ProcessEngineer
              captures: { restarted_at: $.data.started_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seed-stages/${ss1}/advance"
              payload: { to_status: "COMPLETED" }
              as: ProcessEngineer
          assert:
            - "the FAILED -> RUNNING retry is accepted and ${restarted_at} == 2026-10-01T02:00:00Z (started_at refreshed)"
            - "SeedTrainStage.${ss1}.status == COMPLETED after the retry completes"

      - name: study_not_comparable_rework_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.ComparabilityStudy.NOT_COMPARABLE_to_PROTOCOL_APPROVED
          - calculations.comparability_equivalence
        distinguishing_aspect: "The study machine loops: a candidate value of 90.0 falls outside [95.06, 100.94] (baseline [98.0, 98.2, 97.8], margin 2.94), yielding NOT_COMPARABLE, and APPROVE_PROTOCOL from NOT_COMPARABLE re-enters PROTOCOL_APPROVED for rework."
        test_recipe:
          setup:
            - "Batch at PROCESS_COMPLETE whose only VERIFIED DOWNSTREAM test is PURITY 90.0 (spec 85.0-95.0); study created with baseline [98.0, 98.2, 97.8] and this candidate."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_product
            - *k_train
            - *k_campaign
            - *k_alloc
            - *k_seed
            - *k_seed_start
            - *k_seed_run
            - *k_clock10
            - *k_seed_done
            - *k_prod
            - *k_batch
            - *k_test_up
            - *k_verify_up
            - *k_adv_down
            - *k_getb
            - call: "POST /batches/${batch_id}/tests"
              payload: { test_type: "PURITY", phase: "DOWNSTREAM", measured_value: 90.0, unit: "PCT", spec_min: 85.0, spec_max: 95.0, expected_batch_version: "${bat_v2}" }
              as: ManufacturingOperator
              as_user_id: "op-1"
              captures: { t_p90: $.data.id }
            - call: "POST /tests/${t_p90}/verify"
              payload: {}
              as: QualityControlAnalyst
              as_user_id: "qc-1"
            - *k_adv_pc
            - call: "POST /products/${prod_id}/comparability-studies"
              payload: { change_type: "SITE_TRANSFER", baseline_attribute_values: [98.0, 98.2, 97.8], candidate_batch_ids: ["${batch_id}"] }
              as: RegulatoryAffairsSpecialist
              captures: { study_nc: $.data.id }
            - call: "POST /comparability-studies/${study_nc}/action"
              payload: { action: "APPROVE_PROTOCOL" }
              as: RegulatoryAffairsSpecialist
          trigger:
            - call: "POST /comparability-studies/${study_nc}/action"
              payload: { action: "RECORD_ASSESSMENT" }
              as: RegulatoryAffairsSpecialist
              captures: { study_status1: $.data.status, study_margin: $.data.equivalence_margin }
            - call: "POST /comparability-studies/${study_nc}/action"
              payload: { action: "APPROVE_PROTOCOL" }
              as: RegulatoryAffairsSpecialist
          assert:
            - "${study_status1} == NOT_COMPARABLE (candidate 90.0 outside [95.06, 100.94])"
            - "${study_margin} == 2.94 (max(1.5, 0.03 x 98.0), 4-decimal rounding)"
            - "after the rework APPROVE_PROTOCOL: ComparabilityStudy.${study_nc}.status == PROTOCOL_APPROVED"

