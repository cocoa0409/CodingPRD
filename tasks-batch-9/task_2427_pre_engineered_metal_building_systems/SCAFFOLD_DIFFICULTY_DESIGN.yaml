  - rule_id: compensating_invariant
    instances:
      - name: load_cancel_restores_shippable_pounds_ledger
        grounds:
          - calculations.order_shippable_weight_ledger
          - entities.Order.fields.assigned_weight_lbs
          - entities.Order.fields.unassigned_weight_lbs
          - state_machines.ShipmentLoad.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: pounds. The invariant assigned_weight_lbs + unassigned_weight_lbs ==
          total_shippable_weight_lbs must hold at every observable instant, and cancelling loads in the
          reverse order of creation must walk the pair back through exactly the values it passed on the way
          up — 5248.67 then 8635.07 then 48869.67 unassigned — with no rounding drift, because CANCELLED
          loads leave the input set entirely.
        test_recipe:
          setup:
            - "CHAIN-CORE with the full ten-component design d1 APPROVED, package dp1 SEALED and order o1 released, so total_shippable_weight_lbs is 48869.67 (47323.92 of steel and panels plus 1545.75 of accessory kits)."
