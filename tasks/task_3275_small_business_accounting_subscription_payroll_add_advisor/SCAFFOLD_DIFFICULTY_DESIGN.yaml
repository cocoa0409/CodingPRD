  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: recon_window_closed_interval_overlap_and_adjacency
        grounds:
          - validations.priority_10_business_referential
          - errors.ERR_STATEMENT_WINDOW_OVERLAP
          - entities.Reconciliation.fields.statement_period_start
        distinguishing_aspect: |
          Semantics: CLOSED interval on both ends — [start, end]. Adjacency
          where other's end == this start IS an overlap; only end+1day is a
          true adjacency. Resource: BankConnection (one recon at a time per
          connection).
        test_recipe:
          setup:
            - "Company R with BankConnection. Existing COMPLETED recon [2026-08-01, 2026-08-31]."
          setup_api_calls:
            - *k_clock
            - *k_plan_plus
            - &k_company_r
              call: "POST /api/companies"
              payload: { legal_name: "Sigma Corp", admin_email: "r@r.example", home_country: "US", data_region: "US", plan_id: "${plan_plus_id}" }
              as: PlatformAdmin
              captures: { company_r_id: $.data.id }
            - &k_company_r_admin
              call: "POST /api/companies/${company_r_id}/users"
              payload: { company_id: "${company_r_id}", email: "admin@r.example", display_name: "R Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { company_r_admin_id: $.data.id }
            - call: "POST /api/companies/${company_r_id}/users/${company_r_admin_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
            - call: "POST /api/companies/${company_r_id}/subscription/activate"
              payload: { payment_method_token: "pm_card_visa" }
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
            - &k_bc_r
              call: "POST /api/companies/${company_r_id}/bank_connections"
              payload: { company_id: "${company_r_id}", institution_name: "Chase", external_account_mask: "2222", consent_expires_at: "2027-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
              captures: { bc_r_id: $.data.id }
            - call: "POST /api/companies/${company_r_id}/bank_connections/${bc_r_id}/authorize"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
            - &k_recon_r1
              call: "POST /api/companies/${company_r_id}/reconciliations"
              payload: { company_id: "${company_r_id}", bank_connection_id: "${bc_r_id}", statement_period_start: "2026-08-01T00:00:00Z", statement_period_end: "2026-08-31T00:00:00Z", statement_ending_balance_cents: 0 }
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
              captures: { recon_r1_id: $.data.id }
            - call: "POST /api/companies/${company_r_id}/reconciliations/${recon_r1_id}/start"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
            - call: "POST /api/companies/${company_r_id}/reconciliations/${recon_r1_id}/complete"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
          trigger:
            # Boundary adjacency: new recon starts 2026-08-31 (same day as existing end)
            - call: "POST /api/companies/${company_r_id}/reconciliations"
              payload: { company_id: "${company_r_id}", bank_connection_id: "${bc_r_id}", statement_period_start: "2026-08-31T00:00:00Z", statement_period_end: "2026-09-30T00:00:00Z", statement_ending_balance_cents: 0 }
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
              captures: { recon_r2_id: $.data.id }
            - call: "POST /api/companies/${company_r_id}/reconciliations/${recon_r2_id}/start"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
              captures: { err_overlap: $.data.error_id }
            # True adjacency: start 2026-09-01 (day after existing end) — should succeed
            - call: "POST /api/companies/${company_r_id}/reconciliations"
              payload: { company_id: "${company_r_id}", bank_connection_id: "${bc_r_id}", statement_period_start: "2026-09-01T00:00:00Z", statement_period_end: "2026-09-30T00:00:00Z", statement_ending_balance_cents: 0 }
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
              captures: { recon_r3_id: $.data.id }
            - call: "POST /api/companies/${company_r_id}/reconciliations/${recon_r3_id}/start"
              payload: {}
              as: CompanyUser
              as_user_id: "${company_r_admin_id}"
              captures: { recon_r3_status: $.data.recon_status }
          assert:
            - "err_overlap == ERR_STATEMENT_WINDOW_OVERLAP (closed interval: 2026-08-31 is in both windows)"
            - "recon_r3_status == IN_PROGRESS (true adjacency at end+1day succeeds)"
            - "Proves the closed-interval semantics: end == start is OVERLAP, end+1 is OK"

      - name: migration_in_flight_lifetime_window_overlap
        grounds:
          - validations.priority_11_business_referential
          - errors.ERR_MIGRATION_ALREADY_IN_FLIGHT
          - entities.MigrationJob.fields.migration_status
        distinguishing_aspect: |
          Different interval semantics: not a numeric range but a lifetime
          window — a MigrationJob occupies the company from creation until
          terminal status. Any second job created during that lifetime
          conflicts. Resource: ClientCompany (one in-flight migration).
          Different interval semantics (state-machine lifetime vs numeric
          range) and different resource (Company vs BankConnection).
        test_recipe:
          setup:
            - "Company S with a MigrationJob in QUEUED."
          setup_api_calls:
            - *k_clock
