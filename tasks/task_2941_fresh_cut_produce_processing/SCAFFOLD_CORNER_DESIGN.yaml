              as: PlantAdmin
          trigger:
            - call: "POST /process-runs/${run_d}/close"
              payload: { actual_dwell_seconds: 130, spin_rpm: 700, spin_seconds: 40, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 5000.00, cases_produced: 120 }
              as: LineOperator
              captures: { days: "$.data.provisional_shelf_life_days", code: "$.data.provisional_code_date", yld: "$.data.yield_pct", outlb: "$.data.output_lb", inlb: "$.data.input_lb", exc: "$.data.antimicrobial_excursion_count", disp: "$.data.disposition_status" }
            - call: "GET /process-runs/${run_d}/finished-cases"
              payload: { limit: 1, offset: 0 }
              as: QAManager
              captures: { c1_id: "$.data[0].id", c1_code: "$.data[0].code_date", c1_label: "$.data[0].code_date_label", c1_status: "$.data[0].status" }
            - call: "POST /finished-cases/${c1_id}/ship"
              as: ShippingClerk
              captures: { e_ship: "$.data.error_id" }
          assert:
            - "${grade_o} == OUT_OF_SPEC with ${ded_o} == 2 and ${acc_o} == 6000.00: the override let the load in but the deduction is still carried"
            - "${dwell_frozen} == 90, so the close gate is max(product 120, frozen 90) == 120 and the reported 130 clears it"
            - "${inlb} == 5000.00, ${outlb} == 3000.00 == 120 x 25.0 and ${yld} == 60.00, exactly the product minimum, which passes because the comparison is strict <"
            - "${exc} == 0: the in-window reading of 25.0 equals the product minimum and the excursion comparison is strict <"
            - "${days} == 3: base min(12, 14) == 12, temp penalty 2, harvest penalty max(0, floor(335/24) - 1) == 12, spin penalty 1 because 700 < 800, micro 0 - the raw arithmetic is -3 and the floor is applied last as a max"
            - "${code} == 2026-08-06 == date(started_at 2026-08-03) + 3 days, and ${c1_code} == 2026-08-06 with ${c1_label} == 2026218 (day-of-year 218, zero-padded JULIAN)"
            - "${disp} == UNRESTRICTED and ${c1_status} == IN_INVENTORY, because P_CELERY has hold_and_release_required false"
            - "${e_ship} == ERR_INSUFFICIENT_REMAINING_SHELF_LIFE: 2026-08-06 minus the 2026-08-03 ship date is 3 whole days, under the spec's 5, so the floored shelf life has real downstream teeth"

      - name: corner_excursion_uses_only_readings_inside_the_run_window
        claim_type: Input Set Filtering
        grounds:
          - calculations.antimicrobial_compliance_check.input_set
          - state_machines[ProcessRun].dimension=run_status.transitions[RUNNING->CLOSED]
        distinguishing_aspect: "The pre-start reading of 24.0 is excluded from the window even though it belongs to the same wash system and the same change-out window, so min_ppm_observed is the in-window 19.5 and the single excursion opens a second hold plus a MAJOR corrective action that leaves the line RESTRICTED."
        test_recipe:
          setup: ["execute BASE steps 1-19, so RUN1 on L1 is RUNNING since 2026-08-03T07:00:00Z with 30000.00 lb consumed, and W1 carries one reading of 24.0 at 06:30 (before started_at)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T09:00:00Z", free_chlorine_ppm: 19.5, ph: 6.6, orp_mv: 640, turbidity_ntu: 3.0 }
              as: LineOperator
              captures: { low_id: "$.data.id", low_below: "$.data.below_target", low_target: "$.data.target_free_chlorine_ppm_at_reading" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { minppm: "$.data.min_ppm_observed", exc: "$.data.antimicrobial_excursion_count", disp: "$.data.disposition_status", onhold: "$.data.cases_on_hold" }
            - call: "GET /process-runs/${run_id}/hold-records"
              payload: { limit: 10, offset: 0 }
              as: QATechnician
              captures: { h1_reason: "$.data[0].reason", h2_reason: "$.data[1].reason", h1_cases: "$.data[0].cases_held_count", h2_cases: "$.data[1].cases_held_count" }
            - call: "GET /lines/${line_id}/corrective-actions"
              payload: { limit: 10, offset: 0 }
              as: QAManager
              captures: { ca_src: "$.data[0].source_type", ca_sev: "$.data[0].severity", ca_ref: "$.data[0].source_ref_id", ca_st: "$.data[0].status" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture: "$.data.posture", ca_count: "$.data.open_corrective_action_count" }
          assert:
            - "${low_target} == 35.0 and ${low_below} == true: after 30000 LEAFY pounds the index is 0.750 and the tier target is 35.0, so this reading is below target as well as below the product minimum"
            - "${minppm} == 19.5, not 24.0: the 06:30 reading sits before started_at and is excluded from [started_at, closed_at]"
            - "${exc} == 1, counting only the in-window reading below the product's 20.0 minimum"
            - "${disp} == HELD with ${onhold} == 900, and the two holds are HOLD_AND_RELEASE_TESTING and ANTIMICROBIAL_EXCURSION - ${h1_reason} and ${h2_reason} together cover both, with ${h1_cases} + ${h2_cases} showing that only the first hold moved 900 cases and the second found them already ON_HOLD"
            - "${ca_src} == ANTIMICROBIAL_EXCURSION, ${ca_sev} == MAJOR, ${ca_st} == OPEN and ${ca_ref} == ${low_id}, the lowest in-window reading"
            - "${posture} == RESTRICTED with ${ca_count} == 1: the excursion corrective action blocks later starts on L1 even though the close itself succeeded"

      - name: corner_prior_reject_penalty_is_capped_before_subtraction
        claim_type: Constants Applied
        grounds:
          - calculations.grower_lot_risk_score.constants.PRIOR_REJECT_PENALTY_CAP
          - calculations.grower_lot_risk_score.notes
        distinguishing_aspect: "Four prior rejected loads and forty prior rejected loads both cost exactly 20 points, because the cap is applied to the product before it is subtracted; neither lot is suspended, since 80 is above the strict threshold."
        test_recipe:
          setup: ["the clock is 2026-08-02T05:00:00Z and two otherwise identical WELL-water lots differ only in prior_rejected_receipt_count (4 versus 40)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-A04", ranch_block: "B1", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE", prior_rejected_receipt_count: 4 }
              as: QATechnician
              captures: { lot_a: "$.data.id" }
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-A40", ranch_block: "B1", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE", prior_rejected_receipt_count: 40 }
              as: QATechnician
              captures: { lot_b: "$.data.id" }
          trigger:
            - call: "POST /grower-lots/${lot_a}/approve"
              as: QAManager
              captures: { a_pre: "$.data.preharvest_risk_score", a_trail: "$.data.trailing_risk_score", a_st: "$.data.status" }
            - call: "POST /grower-lots/${lot_b}/approve"
              as: QAManager
              captures: { b_pre: "$.data.preharvest_risk_score", b_trail: "$.data.trailing_risk_score", b_st: "$.data.status" }
          assert:
            - "${a_pre} == 80 == 100 - min(20, 5 x 4) and ${b_pre} == 80 == 100 - min(20, 5 x 40): the cap saturates at 20 points"
            - "${a_pre} == ${b_pre} even though the evidence counts differ tenfold; an uncapped per-load penalty would have driven the second lot to 0"
            - "${a_trail} == ${b_trail} == 80 and ${a_st} == ${b_st} == APPROVED, because 80 is not below RISK_SUSPEND_THRESHOLD 50"

      - name: corner_spec_cap_and_calendar_label_and_case_code_format
        claim_type: Correct Result
        grounds:
          - calculations.run_shelf_life_and_code_date.formula
          - entities.FinishedCase.fields.case_code
          - entities.CustomerSpec.fields.spec_revision
          - entities.Product.fields.active_spec_count
        distinguishing_aspect: "A RETAIL spec offering 17 days cannot lift a 16-day product, so base_days is the product's 16; the same run renders its code date in CALENDAR form and mints case codes from the line code, the pack date and the four-digit sequence."
        test_recipe:
          setup:
            - "execute BASE steps 1-13, so P_ROMAINE (base 16), the FOODSERVICE spec S_FS, L1 with a VALIDATED clean, W1 and R1 with 36000.00 lb available exist"
            - "a second ACTIVE spec S_RT on the same product covers the RETAIL channel with 12.5 lb cases and CALENDAR dates"
          setup_api_calls:
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              captures: { pv2: "$.data.version", specs1: "$.data.active_spec_count" }
            - call: "POST /products/${prod_id}/customer-specs"
              payload: { customer_code: "RTL-WEST", channel: "RETAIL", max_shelf_life_days_offered: 17, min_remaining_shelf_life_days_at_ship: 8, atmosphere_required: "AIR", case_net_weight_lb: 12.5, code_date_format: "CALENDAR", expected_product_version: "${pv2}" }
              as: PlantAdmin
              captures: { spec_rt: "$.data.id", rt_rev: "$.data.spec_revision", rt_status: "$.data.status" }
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              captures: { specs2: "$.data.active_spec_count" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_rt}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_e: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:30:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T06:30:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.2 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_e}/start"
              as: LineOperator
              captures: { ve: "$.data.version" }
            - call: "POST /process-runs/${run_e}/lot-consumptions"
              payload: { raw_receipt_id: "${rcpt_id}", consumed_lb: 30000.00, expected_process_run_version: "${ve}" }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T09:00:00Z", free_chlorine_ppm: 36.0, ph: 6.7, orp_mv: 700, turbidity_ntu: 2.4 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /process-runs/${run_e}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "AIR", water_gal_used: 12000.00, cases_produced: 1440 }
              as: LineOperator
              captures: { days: "$.data.provisional_shelf_life_days", code: "$.data.provisional_code_date", yld: "$.data.yield_pct", outlb: "$.data.output_lb" }
            - call: "GET /process-runs/${run_e}/finished-cases"
              payload: { limit: 2, offset: 0 }
              as: QAManager
              captures: { c1_code: "$.data[0].case_code", c1_seq: "$.data[0].case_sequence", c1_label: "$.data[0].code_date_label", c1_net: "$.data[0].net_weight_lb", c2_code: "$.data[1].case_code" }
          assert:
            - "${specs1} == 1 and ${specs2} == 2 with ${rt_rev} == 1 and ${rt_status} == ACTIVE: spec_revision counts prior specs for the same product AND channel, so the first RETAIL spec is revision 1 even though a FOODSERVICE spec already exists"
            - "${outlb} == 18000.00 == 1440 x 12.5 and ${yld} == 60.00"
            - "${days} == 16 == min(product 16, offered 17): a generous customer offer cannot extend a product's own window"
            - "${code} == 2026-08-19 == 2026-08-03 + 16 days, and ${c1_label} == 2026-08-19 rendered in the spec's CALENDAR format rather than the JULIAN form the other spec would have used"
            - "${c1_seq} == 1 with ${c1_code} == L1-20260803-0001 and ${c2_code} == L1-20260803-0002: line code, the pack date of the closing instant as YYYYMMDD, and the sequence zero-padded to four digits"
            - "${c1_net} == 12.5, taken from the spec that the run actually names"

      - name: corner_cost_allocation_conserves_every_cent
        claim_type: Correct Result
        grounds:
          - calculations.run_cost_allocation_per_case
        excluded_because:
          difficulty_instance: run_cost_allocation_rounding_order_and_remainder_waterfall
          rationale: "That instance pins both rounding orders at once: the four components rounded independently to 4568 + 337 + 83520 + 567 == 88992 cents, the floor to 98 cents per case, the 792-cent remainder distributed to case_sequence 1..792, and the naive round-half-up alternative that would have inflated the allocated total to 89100. Correct Result, Constants Applied and Precision for this rule are all already covered there."

      - name: corner_dwell_requirement_derives_from_the_selected_tier
        claim_type: Correct Result
        grounds:
          - calculations.wash_water_load_and_target_ppm.formula
        excluded_because:
          difficulty_instance: wash_target_ppm_then_dwell_evaluation_order_pinned
          rationale: "That instance walks the four pinned steps end to end - index 0.750, tier 35.0, dwell max(90, ceil(90 x 35 / 21)) == 150 - and shows the close being refused at 149 seconds and accepted at 150, which is a strictly stronger statement about the step ordering than a breadth probe could make."

      - name: corner_yield_at_the_product_minimum_passes
        claim_type: Correct Result
        grounds:
          - calculations.run_mass_balance_and_yield.notes
        excluded_because:
          difficulty_instance: yield_at_exact_product_minimum_passes
          rationale: "That instance sits on both sides of the boundary with 824 cases giving 54.93 and a rejection, then 825 cases giving exactly 55.00 and a successful close, which is the sharpest available form of the strict-less-than tolerance claim."

      - name: corner_receipt_temperature_grade_boundaries
        claim_type: Correct Result
        grounds:
          - calculations.receipt_temperature_grade_and_accepted_weight.notes
        excluded_because:
          difficulty_instance: receipt_pulp_temp_at_exact_max_is_marginal
          rationale: "That instance covers all four boundary positions (3.3 IN_SPEC, 3.4 MARGINAL, 4.4 MARGINAL, 4.5 OUT_OF_SPEC) together with the override path and the trailing-risk recompute, so both strict-greater breakpoints are already pinned."

      - name: corner_shelf_life_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.run_shelf_life_and_code_date.variants
        excluded_because:
          difficulty_instance: run_shelf_life_provisional_vs_final_diverges
          rationale: "That instance is the dual-variant case for this rule: 14 provisional days against 11 final days from two independent causes, with the FINAL code date restamped onto every non-shipped case. Variant Selection and Reconciliation are covered by the same walkthrough."

      - name: corner_risk_score_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.grower_lot_risk_score.variants
        excluded_because:
          difficulty_instance: grower_lot_preharvest_vs_trailing_risk_diverges
          rationale: "That instance shows one GET carrying a frozen preharvest 70 beside a trailing 60 derived from it, which is exactly the Variant Divergence and Variant Selection pair for this rule."

  - section: validations
    instances:

      - name: corner_missing_or_blank_auth_headers_are_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 treats an empty-string header exactly like an absent one, and it fires before the path-id lookup, so an unauthenticated call against a non-existent id still returns 401 rather than 404."
        test_recipe:
          setup: ["execute BASE steps 1-5, so product ${prod_id} and line ${line_id} exist"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/${prod_id}"
              as: ""
              captures: { e_no_role: "$.data.error_id" }
            - call: "GET /products/${prod_id}"
              as: QAManager
              as_user_id: ""
              captures: { e_no_user: "$.data.error_id" }
            - call: "GET /products/11111111-1111-4111-8111-111111111111"
              as: ""
              captures: { e_before_404: "$.data.error_id" }
            - call: "POST /products"
              payload: { code: "X", name: "X", commodity_class: "BOGUS", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: true }
              as: ""
              captures: { e_before_400: "$.data.error_id" }
          assert:
            - "${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401 when X-User-Role is an empty string"
            - "${e_no_user} == ERR_UNAUTHENTICATED when X-User-ID is an empty string but the role header is valid"
            - "${e_before_404} == ERR_UNAUTHENTICATED, not ERR_PRODUCT_NOT_FOUND: priority 1 precedes every lookup"
            - "${e_before_400} == ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST, even though commodity_class BOGUS is also invalid"

      - name: corner_override_permission_is_checked_before_the_payload
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_OVERRIDE_NOT_PERMITTED]
        distinguishing_aspect: "A QATechnician supplying override_justification together with an undeclared decision value gets ERR_OVERRIDE_NOT_PERMITTED (priority 3) rather than ERR_INVALID_REQUEST (priority 4), and the same body from a QAManager reaches the payload check instead."
        test_recipe:
          setup: ["execute BASE steps 1-8, so receipt R1 is PENDING_INSPECTION with temp_grade IN_SPEC"]
          setup_api_calls: []
          trigger:
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "MAYBE", trim_loss_lb: 4000.00, override_justification: "Chilled on arrival" }
              as: QATechnician
              captures: { e_override: "$.data.error_id" }
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "MAYBE", trim_loss_lb: 4000.00, override_justification: "Chilled on arrival" }
              as: QAManager
              captures: { e_payload: "$.data.error_id" }
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 4000.00, override_justification: "Chilled on arrival" }
              as: QAManager
              captures: { st: "$.data.status", just: "$.data.override_justification", acc: "$.data.accepted_lb" }
          assert:
            - "${e_override} == ERR_OVERRIDE_NOT_PERMITTED with HTTP 403: the role check on the override field runs before the body is validated at all"
            - "${e_payload} == ERR_INVALID_REQUEST with HTTP 400 for the identical body sent by the permitted role"
            - "${st} == ACCEPTED with ${acc} == 36000.00 and ${just} recorded, even though this IN_SPEC load did not need an override: supplying one is permitted for a QAManager and simply stored"

      - name: corner_path_ids_resolve_before_body_ids_in_declared_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=18]
          - validations[priority=19]
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=23]
        distinguishing_aspect: "With every foreign key wrong at once the response names the line, because body FKs are checked in the declared order line, product, spec, wash system, rework source; and a bad path id outranks a bad body id on the consumption endpoint."
        test_recipe:
          setup: ["execute BASE steps 1-14, so a SETUP run, a product, a spec, a line, a wash system and an ACCEPTED receipt all exist; 11111111-1111-4111-8111-111111111111 names nothing"]
          setup_api_calls:
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { run_v_any: "$.data.version" }
          trigger:
            - call: "POST /process-runs"
              payload: { line_id: "11111111-1111-4111-8111-111111111111", product_id: "11111111-1111-4111-8111-111111111111", customer_spec_id: "11111111-1111-4111-8111-111111111111", wash_system_id: "11111111-1111-4111-8111-111111111111", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_all: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "11111111-1111-4111-8111-111111111111", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_prod: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "11111111-1111-4111-8111-111111111111", wash_system_id: "${ws_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_spec: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "11111111-1111-4111-8111-111111111111", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_wash: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", rework_source_run_id: "11111111-1111-4111-8111-111111111111", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_rework: "$.data.error_id" }
            - call: "POST /process-runs/11111111-1111-4111-8111-111111111111/lot-consumptions"
              payload: { raw_receipt_id: "11111111-1111-4111-8111-111111111111", consumed_lb: 100.00, expected_process_run_version: "${run_v_any}" }
              as: LineOperator
              captures: { e_path_first: "$.data.error_id" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "11111111-1111-4111-8111-111111111111", received_at: "2026-08-02T05:10:00Z", pulp_temp_c: 3.1, gross_weight_lb: 42000.00, tare_weight_lb: 2000.00 }
              as: ReceivingClerk
              captures: { e_lot_body: "$.data.error_id" }
          assert:
            - "${e_all} == ERR_LINE_NOT_FOUND: priority 18 is the lowest-numbered body FK rule on this endpoint, so the line wins over the product, spec, wash system and rework source"
            - "${e_prod} == ERR_PRODUCT_NOT_FOUND, ${e_spec} == ERR_CUSTOMER_SPEC_NOT_FOUND, ${e_wash} == ERR_WASH_SYSTEM_NOT_FOUND and ${e_rework} == ERR_PROCESS_RUN_NOT_FOUND when only that one key is wrong"
            - "${e_path_first} == ERR_PROCESS_RUN_NOT_FOUND (priority 10), not ERR_RAW_RECEIPT_NOT_FOUND (priority 23), and not the version error"
            - "${e_lot_body} == ERR_GROWER_LOT_NOT_FOUND at priority 17 for a body FK on a create endpoint with no path id at all"

      - name: corner_spec_must_belong_to_the_product_and_still_be_active
        claim_type: Violation → Error
        grounds:
          - validations[priority=49]
          - validations[priority=50]
          - entities.CustomerSpec.fields.superseded_at
        distinguishing_aspect: "Creating a second FOODSERVICE spec supersedes the first, so a run naming the old spec fails ERR_SPEC_NOT_ACTIVE; a spec belonging to another product fails ERR_SPEC_PRODUCT_MISMATCH first even when it is also superseded, and active_spec_count tracks only ACTIVE rows."
        test_recipe:
          setup:
            - "execute BASE steps 1-13, so P_ROMAINE carries the ACTIVE FOODSERVICE spec S_FS (revision 1) and L1, W1 exist"
            - "a second product P_OTHER carries its own ACTIVE FOODSERVICE spec S_OTHER"
          setup_api_calls:
            - call: "GET /products/${prod_id}"
              as: PlantAdmin
              captures: { pv: "$.data.version" }
            - call: "POST /products/${prod_id}/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 13, min_remaining_shelf_life_days_at_ship: 9, atmosphere_required: "MAP_LOW_O2", case_net_weight_lb: 20.0, code_date_format: "JULIAN", expected_product_version: "${pv}" }
              as: PlantAdmin
              captures: { spec_v2: "$.data.id", rev2: "$.data.spec_revision" }
            - call: "POST /products"
              payload: { code: "SLAW-MIX", name: "Slaw Mix", commodity_class: "LEAFY", allergen_group: "SULFITE", min_dwell_seconds: 100, min_spin_rpm: 850, min_antimicrobial_ppm: 22.0, base_shelf_life_days: 14, min_yield_pct: 58.00, hold_and_release_required: false }
              as: PlantAdmin
              captures: { p_other: "$.data.id", p_other_v: "$.data.version" }
            - call: "POST /products/${p_other}/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 12, min_remaining_shelf_life_days_at_ship: 8, atmosphere_required: "AIR", case_net_weight_lb: 15.0, code_date_format: "CALENDAR", expected_product_version: "${p_other_v}" }
              as: PlantAdmin
              captures: { spec_other: "$.data.id" }
          trigger:
            - call: "GET /products/${prod_id}/customer-specs"
              payload: { limit: 10, offset: 0 }
              as: QAManager
              captures: { old_status: "$.data[0].status", old_superseded: "$.data[0].superseded_at", new_status: "$.data[1].status" }
            - call: "GET /products/${prod_id}"
              as: QAManager
              captures: { active_count: "$.data.active_spec_count" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_inactive: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_other}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_mismatch: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_v2}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { ok_run: "$.data.id", ok_status: "$.data.run_status" }
          assert:
            - "${rev2} == 2 == 1 + the count of earlier specs for the same product and channel"
            - "${old_status} == SUPERSEDED with ${old_superseded} non-null, ${new_status} == ACTIVE, and ${active_count} == 1 rather than 2"
            - "${e_inactive} == ERR_SPEC_NOT_ACTIVE with HTTP 422 at priority 50"
            - "${e_mismatch} == ERR_SPEC_PRODUCT_MISMATCH with HTTP 422 at priority 49, which is evaluated before the activity check"
            - "${ok_run} exists with ${ok_status} == SETUP once the current spec is named"

      - name: corner_close_rejects_a_mismatched_packaging_atmosphere
        claim_type: Violation → Error
        grounds:
          - validations[priority=52]
          - validations[priority=48]
          - entities.CustomerSpec.fields.atmosphere_required
        distinguishing_aspect: "The atmosphere check is a close-time comparison against the spec the run names, it is evaluated after the dwell gate, and a refused close leaves the run RUNNING with no cases minted."
        test_recipe:
          setup: ["execute BASE steps 1-21, so RUN1 is RUNNING with 30000.00 lb consumed and two readings on W1, one of them inside the window"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T11:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "AIR", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { e_atm: "$.data.error_id" }
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 60, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "AIR", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { e_dwell_first: "$.data.error_id" }
            - call: "GET /process-runs/${run_id}"
              as: LineOperator
              captures: { st: "$.data.run_status", cases: "$.data.cases_produced", closed: "$.data.closed_at" }
            - call: "GET /process-runs/${run_id}/finished-cases"
              payload: { limit: 10, offset: 0 }
              as: QAManager
            - call: "POST /process-runs/${run_id}/close"
              payload: { actual_dwell_seconds: 95, spin_rpm: 900, spin_seconds: 45, atmosphere_actual: "MAP_LOW_O2", water_gal_used: 12345.00, cases_produced: 900 }
              as: LineOperator
              captures: { ok_st: "$.data.run_status", ok_atm: "$.data.atmosphere_actual" }
          assert:
            - "${e_atm} == ERR_ATMOSPHERE_MISMATCH with HTTP 422: the spec requires MAP_LOW_O2"
            - "${e_dwell_first} == ERR_DWELL_TIME_INSUFFICIENT: with both the dwell and the atmosphere wrong the lower-numbered priority 48 wins over priority 52"
            - "${st} == RUNNING with ${cases} null and ${closed} null after both refusals, and the finished-cases list returns total_count 0: a refused close mints nothing"
            - "${ok_st} == CLOSED with ${ok_atm} == MAP_LOW_O2 once the reported atmosphere matches"

      - name: corner_rework_source_must_be_a_rejected_run
        claim_type: Violation → Error
        grounds:
          - validations[priority=53]
          - validations[priority=22]
          - entities.ProcessRun.fields.rework_source_run_id
        distinguishing_aspect: "A run that is merely HELD cannot be named as a rework source; only a REJECTED disposition qualifies, and the not-found check on the same field is evaluated first."
        test_recipe:
          setup: ["execute the BASE chain, so RUN1 is CLOSED with disposition_status HELD and hold ${hold_id} is HELD"]
          setup_api_calls: []
          trigger:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", rework_source_run_id: "${run_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 4 }
              as: LineOperator
              captures: { e_held: "$.data.error_id" }
            - call: "POST /hold-records/${hold_id}/submit-sample"
              payload: { latest_test_type: "APC" }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/record-result"
              payload: { latest_test_result: "POSITIVE", latest_apc_cfu_g: 5000000 }
              as: QATechnician
              as_user_id: "qat-2"
            - call: "POST /hold-records/${hold_id}/reject"
              as: QAManager
              as_user_id: "qam-1"
              captures: { hold_st: "$.data.status" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", rework_source_run_id: "${run_id}", planned_start_at: "2026-08-05T07:00:00Z", planned_end_at: "2026-08-05T12:00:00Z", crew_size: 4 }
              as: LineOperator
              captures: { ok_id: "$.data.id", ok_src: "$.data.rework_source_run_id" }
          assert:
            - "${e_held} == ERR_REWORK_SOURCE_NOT_REJECTED with HTTP 422 while RUN1's disposition is only HELD"
            - "${hold_st} == REJECTED, which drives the run's disposition dimension to REJECTED and destroys its 900 cases"
            - "${ok_id} exists with ${ok_src} == ${run_id}: rework eligibility is created by the rejection, so the same payload succeeds only afterwards"

      - name: corner_trim_loss_at_exactly_net_weight_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=60]
          - calculations.receipt_temperature_grade_and_accepted_weight.formula
        distinguishing_aspect: "One cent of a pound over the net weight is refused, while a trim loss exactly equal to the net weight is accepted and yields accepted_lb 0.00 rather than an error, because the comparison is <= and the subtraction is allowed to reach zero."
        test_recipe:
          setup: ["execute BASE steps 1-8, so receipt R1 is PENDING_INSPECTION with net_weight_lb 40000.00"]
          setup_api_calls: []
          trigger:
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 40000.01 }
              as: QATechnician
              captures: { e_trim: "$.data.error_id" }
            - call: "GET /raw-receipts/${rcpt_id}"
              as: QATechnician
              captures: { st_mid: "$.data.status" }
            - call: "POST /raw-receipts/${rcpt_id}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 40000.00 }
              as: QATechnician
              captures: { st: "$.data.status", acc: "$.data.accepted_lb", rem: "$.data.remaining_lb", trim: "$.data.trim_loss_lb" }
          assert:
            - "${e_trim} == ERR_TRIM_LOSS_EXCEEDS_NET with HTTP 422 for 40000.01 against a net of 40000.00"
            - "${st_mid} == PENDING_INSPECTION: the refused disposition left the receipt dispositionable"
            - "${st} == ACCEPTED with ${trim} == 40000.00, ${acc} == 0.00 and ${rem} == 0.00: a total-loss load is a legal accept with no consumable pounds"

      - name: corner_sanitation_state_gate_precedes_the_disassembly_count
        claim_type: Priority Ordering
        grounds:
          - validations[priority=31]
          - validations[priority=47]
        distinguishing_aspect: "A submit against a SCHEDULED event returns the state error even though its component count is also short, and once the event is IN_PROGRESS the count boundary is exact: 11 of 12 fails and 12 passes."
        test_recipe:
          setup: ["execute BASE steps 1-5, so line L1 requires 12 disassembled components and has max_atp_rlu 200"]
          setup_api_calls:
