              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { err_body: "$.data.error_id" }
          assert:
            - "first trigger is sent with NO X-User-ID and NO X-User-Role header"
            - "after first trigger: http status == 401"
            - "after first trigger: ${err_headers} == \"ERR_MISSING_AUTH_HEADERS\""
            - "after second trigger: http status == 403"
            - "after second trigger: ${err_role} == \"ERR_ROLE_NOT_PERMITTED\""
            - "after third trigger: http status == 422"
            - "after third trigger: ${err_body} == \"ERR_INVALID_REQUEST\""
            - "GET /conversion-projects returns total_count == 1 and its single element id is \"${proj_id}\""
