      - name: accepting_the_last_as_built_bubbles_the_project_to_closed_out_and_archives_the_seal
        claim_type: bubble_up
        grounds:
          - state_machines.AcceptanceTest.AS_BUILT_SUBMITTED_to_AS_BUILT_ACCEPTED
          - state_machines.AcceptanceTest.SCHEDULED_to_WITNESSED_PASS
          - state_machines.Project.ACCEPTANCE_to_CLOSED_OUT
          - state_machines.FirePump.SIZED_to_ACCEPTED
          - calculations.acceptance_thresholds
          - calculations.project_design_posture
          - errors.ERR_PROJECT_POSTURE_FROZEN
