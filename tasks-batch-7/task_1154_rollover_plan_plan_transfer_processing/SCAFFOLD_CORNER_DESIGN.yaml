            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", requested_amount_cents: 500000, withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { ok_id: "$.data.id" } }
          assert:
