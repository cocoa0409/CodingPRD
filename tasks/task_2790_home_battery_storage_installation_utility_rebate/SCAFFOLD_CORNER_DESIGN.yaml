            - call: "POST /byod-enrollments"
              payload: { battery_system_id: "${sys_id}", pledged_kw: 5.0, reserve_soc_pct: 20, season: "SUMMER_2026" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /byod-enrollments/${enr_id}/consent"
              payload: {}
              as: Homeowner
              as_user_id: "${site_id}"
            - call: "POST /dispatch-events"
              payload: { territory_code: "TER_WEST", window_start: "2026-09-15T17:00:00Z", window_end: "2026-09-15T19:00:00Z", event_type: "ECONOMIC", target_kw: 500, payment_rate_cents_per_kw: 850 }
              as: UtilityInterconnectionReviewer
              as_user_id: "utility-rev-1"
              captures: { ev1: $.data.id, ev1_v: $.data.version }
            - call: "POST /dispatch-events/${ev1}/participations"
              payload: { byod_enrollment_id: "${enr_id}", expected_dispatch_event_version: "${ev1_v}" }
              as: UtilityInterconnectionReviewer
              as_user_id: "utility-rev-1"
              captures: { perf1_id: $.data.id }
            - call: "GET /battery-systems/${sys_id}"
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_v1: $.data.version }
          trigger:
