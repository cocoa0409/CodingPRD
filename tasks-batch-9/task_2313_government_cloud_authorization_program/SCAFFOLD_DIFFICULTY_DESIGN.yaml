  - name: impact_determination_needs_one_confirmed_category_at_the_empty_set_boundary
    grounds:
    - validations[priority=18]
    - calculations.impact_level_determination
    - state_machines.DataCategory.DECLARED_to_CONFIRMED
    - state_machines.CloudServiceOffering.DRAFT_to_CATEGORIZED
    distinguishing_aspect: The `final` variant's input set at size 0 raises ERR_NO_CONFIRMED_DATA_CATEGORY even though the
      `preliminary` variant already reports MODERATE from the DECLARED row; at size 1 the same call succeeds — a set-cardinality
      boundary rather than a timestamp or money boundary.
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; MODERATE baseline effective 2026-01-01T00:00:00Z, not retired.
      - Offering in DRAFT with external_dependency_impact_level LOW.
      - Exactly one DataCategory PII (MODERATE/MODERATE/LOW) in status DECLARED; the CONFIRMED set is empty.
      - preliminary_impact_level is already MODERATE from that DECLARED row.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-01T00:00:00Z'
        as: ProgramBoardReviewer
        as_user_id: board-1
