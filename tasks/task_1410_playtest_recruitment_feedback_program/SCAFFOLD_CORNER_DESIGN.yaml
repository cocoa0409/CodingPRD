# =============================================================================
# Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — section 1.9
# Task: task_1410_playtest_recruitment_feedback_program
# Breadth walk over the claim-extraction-guide taxonomy. Claims already
# exercised by section 1.8 are emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: participant_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Participant]
        distinguishing_aspect: "POST with all required fields returns 201 with server defaults applied: status REGISTERED, no_show_strikes 0, risk_score 0, verified_platform_tags [], version 1."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
          trigger:
            - call: "POST /playtests/participants"
              payload: { email: "cr1@x.com", full_name: "Create One", age_years: 30, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { st: "$.data.status", strikes: "$.data.no_show_strikes", risk: "$.data.risk_score", vpt: "$.data.verified_platform_tags", ver: "$.data.version"}
          assert:
            - "st == REGISTERED"
            - "strikes == 0"
            - "risk == 0"
            - "vpt == []"
            - "ver == 1"
      - name: participant_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Participant.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field email from participant creation returns 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /playtests/participants"
              payload: { full_name: "No Email", age_years: 30, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /playtests/participants afterwards returns total_count 0"
      - name: participant_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /playtests/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ResearchOpsAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_NOT_FOUND with HTTP 404"
      - name: participant_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Participant]
        distinguishing_aspect: "Client-supplied id/version/created_at in the create payload are ignored: the server mints its own id, stamps created_at from the logical clock, and starts version at 1."
        test_recipe:
          setup: ["clock pinned at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
          trigger:
            - call: "POST /playtests/participants"
              payload: { id: "client-supplied-id", version: 99, created_at: "1999-01-01T00:00:00Z", email: "sys1@x.com", full_name: "Sys Fields", age_years: 30, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { rid: "$.data.id", ver: "$.data.version", cat: "$.data.created_at"}
          assert:
            - "rid != client-supplied-id (server-minted UUID)"
            - "ver == 1"
            - "cat == 2026-08-01T00:00:00.000Z (logical clock, not the client value)"
      - name: session_create_rejects_invalid_mode_enum
        claim_type: type_constraints
        grounds: [entities.PlaytestSession.fields.mode, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "mode is an enum {REMOTE, IN_LAB}; the value HYBRID is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["study S exists"]
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "Enum Study", code: "EN1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
          trigger:
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "HYBRID", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"
      - name: session_create_rejects_inverted_window
        claim_type: type_constraints
        grounds: [entities.PlaytestSession.fields.ends_at, "errors[ERR_WINDOW_VIOLATION]"]
        distinguishing_aspect: "ends_at <= starts_at violates the window shape rule and returns 422 ERR_WINDOW_VIOLATION (distinct from generic 400 request errors)."
        test_recipe:
          setup: ["study S exists"]
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "Window Study", code: "WN1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
          trigger:
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "REMOTE", starts_at: "2026-08-10T11:00:00Z", ends_at: "2026-08-10T10:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_WINDOW_VIOLATION with HTTP 422"
      - name: exposure_record_immutability_no_version
        claim_type: immutability
        grounds: [entities.ExposureRecord]
        distinguishing_aspect: "ExposureRecord declares common_fields: false — records carry id and created_at but no version or updated_at, and no mutation endpoint exists; the log is append-only."
        test_recipe:
          setup:
            - "Participant P ENROLLED in study S (NDA SIGNED); build RELEASED; one key issued to P (writes a KEY_ISSUED ExposureRecord)"
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "im1-p@x.com", full_name: "IM One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "IM1 Study", code: "IM1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
            - call: "GET /playtests/nda-signatures?participant_id=${p_id}&status=PENDING"
              as: ResearchOpsAdmin
              captures: { sig_id: "$.data[0].id"}
            - call: "POST /playtests/nda-signatures/${sig_id}/sign"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
            - call: "POST /playtests/builds"
              payload: { study_id: "${s_id}", build_label: "9.9.9", max_keys: 5, key_ttl_hours: 72 }
              as: ResearchOpsAdmin
              captures: { bld_id: "$.data.id"}
            - call: "POST /playtests/builds/${bld_id}/release"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/access-keys"
              payload: { build_id: "${bld_id}", participant_id: "${p_id}" }
              as: ResearchOpsAdmin
          trigger:
            - call: "GET /playtests/exposure-records?participant_id=${p_id}&build_id=${bld_id}"
              as: ResearchOpsAdmin
              captures: { rec_type: "$.data[0].event_type", rec_study: "$.data[0].study_id"}
          assert:
            - "rec_type == KEY_ISSUED"
            - "rec_study == ${s_id}  # denormalized from the build"
            - "the record object contains id and created_at keys and contains NO version or updated_at keys"
      - name: session_seats_taken_computed_not_client_set
        claim_type: computed_fields
        grounds: [entities.PlaytestSession.fields.seats_taken]
        excluded_because:
          difficulty_instance: boundary_precision_check / seat_capacity_exact_fill_flips_to_waitlist
          rationale: "seats_taken is asserted as a computed counter (0, then 1, pinned at capacity) in the named section-1.8 instance."

  # ===========================================================================
  # Section: state_machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: build_initial_state_staged
        claim_type: initial_state
        grounds: [state_machines.GameBuild]
        distinguishing_aspect: "A newly registered build starts in STAGED with keys_active_count 0 and released_at null."
        test_recipe:
          setup: ["study S exists"]
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "IS Study", code: "IS1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
          trigger:
            - call: "POST /playtests/builds"
              payload: { study_id: "${s_id}", build_label: "0.1.0", max_keys: 3 }
              as: ResearchOpsAdmin
              captures: { st: "$.data.status", cnt: "$.data.keys_active_count", rel: "$.data.released_at", ttl: "$.data.key_ttl_hours"}
          assert:
            - "st == STAGED"
            - "cnt == 0"
            - "rel == null"
            - "ttl == 72  # default applied when key_ttl_hours omitted"
      - name: complete_cancelled_session_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PlaytestSession, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From CANCELLED no transition exists: completing a cancelled session fails with 409 ERR_INVALID_STATE and fires no side effects."
        test_recipe:
          setup: ["study S RECRUITING; session with assigned moderator; session cancelled"]
          setup_api_calls:
            - call: "POST /playtests/studies"
              payload: { title: "IV1 Study", code: "IV1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/moderators"
              payload: { display_name: "Mod IV1", email: "iv1-m@x.com" }
              as: ResearchOpsAdmin
              captures: { m_id: "$.data.id"}
            - call: "POST /playtests/sessions"
              payload: { study_id: "${s_id}", mode: "REMOTE", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z", seat_capacity: 4 }
              as: Researcher
              captures: { sess_id: "$.data.id"}
            - call: "POST /playtests/sessions/${sess_id}/assign-moderator"
              payload: { moderator_id: "${m_id}" }
              as: Researcher
            - call: "POST /playtests/sessions/${sess_id}/cancel"
              payload: {}
              as: Researcher
          trigger:
            - call: "POST /playtests/sessions/${sess_id}/complete"
              payload: {}
              as: Moderator
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "GET /playtests/sessions/${sess_id}: status remains CANCELLED"
      - name: banned_participant_reinstate_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Participant, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "BANNED is terminal: reinstate on a BANNED participant fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["participant P ACTIVE, then banned by LegalCounsel"]
          setup_api_calls:
            - call: "POST /playtests/participants"
              payload: { email: "tl1-p@x.com", full_name: "TL One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants/${p_id}/ban"
              payload: {}
              as: LegalCounsel
              captures: { st: "$.data.status"}
          trigger:
            - call: "POST /playtests/participants/${p_id}/reinstate"
              payload: {}
              as: ResearchOpsAdmin
              captures: { err: "$.data.error_id"}
          assert:
            - "st == BANNED"
            - "err == ERR_INVALID_STATE with HTTP 409"
      - name: approve_withdrawn_application_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ScreeningApplication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal for the review track: approving a withdrawn application fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["participant P ACTIVE; study S RECRUITING; application SUBMITTED then WITHDRAWN by its owner"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "iv2-p@x.com", full_name: "IV Two", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "IV2 Study", code: "IV2", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/withdraw"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
              captures: { err: "$.data.error_id"}
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409"
      - name: sign_signature_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.NdaSignature, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the sign trigger on an already-SIGNED signature is rejected with 409 ERR_INVALID_STATE; the signature remains SIGNED and no duplicate enrollment occurs."
        test_recipe:
          setup: ["participant P ENROLLED in study S: signature signed once already"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "id1-p@x.com", full_name: "ID One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "ID1 Study", code: "ID1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
            - call: "GET /playtests/nda-signatures?participant_id=${p_id}&status=PENDING"
              as: ResearchOpsAdmin
              captures: { sig_id: "$.data[0].id"}
            - call: "POST /playtests/nda-signatures/${sig_id}/sign"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { st1: "$.data.status"}
          trigger:
            - call: "POST /playtests/nda-signatures/${sig_id}/sign"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { err: "$.data.error_id"}
            - call: "GET /playtests/studies/${s_id}"
              as: ResearchOpsAdmin
              captures: { enrolled: "$.data.enrolled_count"}
          assert:
            - "st1 == SIGNED"
            - "err == ERR_INVALID_STATE with HTTP 409"
            - "enrolled == 1  # the bubble-up fired exactly once"
      - name: approve_creates_pending_signature_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.ScreeningApplication.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "Approval's side effects are all observable: exactly one PENDING signature pinned to the published agreement and linked to the application, and the application's pinned_nda_agreement_id matches."
        test_recipe:
          setup: ["participant P ACTIVE; study S RECRUITING; NDA v1 PUBLISHED; application UNDER_REVIEW"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "se1-p@x.com", full_name: "SE One", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "SE1 Study", code: "SE1", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
          trigger:
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
              captures: { pin: "$.data.pinned_nda_agreement_id"}
            - call: "GET /playtests/nda-signatures?participant_id=${p_id}&status=PENDING"
              as: ResearchOpsAdmin
              captures: { sigs: "$.data"}
          assert:
            - "pin == ${nda_id}"
            - "sigs is a length-1 array with [0].agreement_id == ${nda_id}, [0].application_id == ${app_id}, [0].status == PENDING"
            - "sigs[0].expires_at == 2026-08-08T00:00:00.000Z  # created_at + 7 days"
      - name: sign_bubbles_application_to_enrolled
        claim_type: side_effect_execution
        grounds: [state_machines.ScreeningApplication.APPROVED_to_ENROLLED, state_machines.NdaSignature.PENDING_to_SIGNED]
        distinguishing_aspect: "The bubble-up side effect of signing flips the parent application APPROVED -> ENROLLED and increments study.enrolled_count in the same request sequence."
        test_recipe:
          setup: ["participant P APPROVED in study S with a PENDING signature"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "se2-p@x.com", full_name: "SE Two", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "SE2 Study", code: "SE2", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
