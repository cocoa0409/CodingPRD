# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 2 instances = 18 instances. Every numeric literal in assert: was
# computed by executing the §1.3 formulas against the pinned fixture inputs.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1: dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_executed_rent_policy_drift
        grounds:
          - calculations.proposed_rent_cents
          - calculations.effective_cap_bps
          - entities.RenewalOffer.fields.executed_rent_cents
          - entities.RenewalDocument.fields.executed_rent_cents
          - state_machines.RenewalDocument.RESIDENT_SIGNED_to_COUNTERSIGNED
        distinguishing_aspect: |
          Pricing domain (RenewalOffer/RenewalDocument): the provisional variant clamps to the
          creation-time cap_bps_snapshot (550 bps -> 211000 cents), while the final variant at
          countersign recomputes against the THEN-current policy (cpi_adjustment_bps patched
          150 -> 50, so effective cap 450 bps -> 209000 cents) for identical lease terms.
        test_recipe:
          setup:
            - "Policy CA-OAK: base 400 + cpi 150, ceiling 900 -> effective_cap_bps 550; threshold 500; notice low 60 / high 90; non-renewal lead 60"
            - "Property band [12,12]; unit market rent 240000; lease rent 200000, term 2026-06-01 + 12mo -> end 2027-06-01"
            - "Offer AGGRESSIVE: gap 2000 bps -> strategy 2000, term discount 0, capped at 550 -> proposed 211000 (increase 550 > 500 -> 90-day tier, latest_issue 2027-03-03; clock default 2026-05-01 is in window)"
            - "Offer ISSUED, resident ACCEPTED, document RESIDENT_SIGNED; policy cpi then patched to 50 (cap becomes 450) before countersign"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cypress Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "101", bedrooms: 2, current_market_rent_cents: 240000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Rin Aoki", email: "rin.aoki@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "AGGRESSIVE", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: "$.data.id", prop_rent: "$.data.proposed_rent_cents", cap_snap: "$.data.cap_bps_snapshot" }
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "ACCEPT" }
              as: Resident
              as_user_id: "${res}"
            - call: "GET /renewal-documents"
              payload: { offer_id: "${offer}" }
              as: PropertyManager
              captures: { doc: "$.data[0].id" }
            - call: "POST /renewal-documents/${doc}/sign-resident"
              payload: {}
              as: Resident
              as_user_id: "${res}"
            - call: "PATCH /rent-cap-policies/${pol}"
              payload: { cpi_adjustment_bps: 50 }
              as: PlatformAdmin
              captures: { cap_after: "$.data.effective_cap_bps" }
          trigger:
            - call: "POST /renewal-documents/${doc}/countersign"
              payload: {}
              as: PropertyManager
              captures: { exec_rent: "$.data.executed_rent_cents", doc_status: "$.data.status" }
            - call: "GET /renewal-offers/${offer}"
              as: PropertyManager
              captures: { offer_status: "$.data.status", offer_exec: "$.data.executed_rent_cents" }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { lease_rent: "$.data.monthly_rent_cents", lease_status: "$.data.status", lease_end: "$.data.term_end_date" }
          assert:
            - "provisional variant: captured prop_rent == 211000 and cap_snap == 550"
            - "policy drift applied: captured cap_after == 450"
            - "final variant diverges: exec_rent == 209000 (not 211000)"
            - "RenewalDocument.${doc}.status == COUNTERSIGNED"
            - "RenewalOffer.${offer}.status == EXECUTED and offer_exec == 209000"
            - "Lease.${lease}: lease_rent == 209000, lease_status == ACTIVE, lease_end == 2028-06-01"

      - name: retention_trailing_vs_pipeline_cohort
        grounds:
          - calculations.retention_rate_bps
          - state_machines.Lease.NON_RENEWAL_NOTICED_to_ENDED
          - state_machines.RenewalDocument.RESIDENT_SIGNED_to_COUNTERSIGNED
        distinguishing_aspect: |
          Reporting domain (Property cohort), distinct from the pricing domain of the sibling
          instance: the same 4-lease cohort yields retention_rate_bps 5000 under TRAILING (only
          countersigned renewals count) but 7500 under PIPELINE (adds the MTM conversion), proving
          the two variants diverge on identical underlying data.
        test_recipe:
          setup:
            - "Policy CA-OAK as in sibling instance; property band [12,12]; 4 units (market 210000), 4 residents, 4 leases each 2026-06-01 + 12mo -> end 2027-06-01, rent 200000"
            - "L1, L2: full renewal loop (CONSERVATIVE offer 203000 -> issued -> accepted -> signed -> countersigned at clock 2026-05-01); executed renewal anchors the cohort via document prior_term_end_date 2027-06-01"
            - "L3: non-renewal notice OWNER_OCCUPANCY effective 2027-06-01 served 2026-05-01; CONFIRMED after cure lapse at 2026-05-12; ENFORCED at 2027-06-01 -> lease ENDED"
            - "L4: untouched; clock at 2027-06-01 converts it to MTM (rent 242650)"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Retention Gardens", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "201", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u1: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "202", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u2: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "203", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u3: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "204", bedrooms: 1, current_market_rent_cents: 210000 }
              as: PlatformAdmin
              captures: { u4: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Res One", email: "res1@x.com" }
              as: PlatformAdmin
              captures: { r1: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Res Two", email: "res2@x.com" }
              as: PlatformAdmin
              captures: { r2: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Res Three", email: "res3@x.com" }
              as: PlatformAdmin
              captures: { r3: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Res Four", email: "res4@x.com" }
              as: PlatformAdmin
              captures: { r4: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${u1}", resident_id: "${r1}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { l1: "$.data.id", l1_v: "$.data.version" }
            - call: "POST /leases"
              payload: { unit_id: "${u2}", resident_id: "${r2}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { l2: "$.data.id", l2_v: "$.data.version" }
            - call: "POST /leases"
              payload: { unit_id: "${u3}", resident_id: "${r3}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { l3: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${u4}", resident_id: "${r4}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { l4: "$.data.id" }
            - call: "POST /leases/${l1}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${l1_v}" }
              as: LeasingAgent
              captures: { o1: "$.data.id" }
            - call: "POST /renewal-offers/${o1}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${o1}/respond"
              payload: { response_type: "ACCEPT" }
              as: Resident
              as_user_id: "${r1}"
            - call: "GET /renewal-documents"
              payload: { offer_id: "${o1}" }
              as: PropertyManager
              captures: { d1: "$.data[0].id" }
            - call: "POST /renewal-documents/${d1}/sign-resident"
              payload: {}
              as: Resident
              as_user_id: "${r1}"
            - call: "POST /renewal-documents/${d1}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leases/${l2}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${l2_v}" }
              as: LeasingAgent
              captures: { o2: "$.data.id" }
            - call: "POST /renewal-offers/${o2}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${o2}/respond"
              payload: { response_type: "ACCEPT" }
              as: Resident
              as_user_id: "${r2}"
            - call: "GET /renewal-documents"
              payload: { offer_id: "${o2}" }
              as: PropertyManager
              captures: { d2: "$.data[0].id" }
            - call: "POST /renewal-documents/${d2}/sign-resident"
              payload: {}
              as: Resident
              as_user_id: "${r2}"
            - call: "POST /renewal-documents/${d2}/countersign"
              payload: {}
              as: PropertyManager
            - call: "POST /leases/${l3}/non-renewal-notices"
              payload: { cause_type: "OWNER_OCCUPANCY", effective_date: "2027-06-01" }
              as: LeasingAgent
              as_user_id: "user_la_1"
              captures: { n3: "$.data.id" }
            - call: "POST /non-renewal-notices/${n3}/serve"
              payload: {}
              as: PropertyManager
              as_user_id: "user_pm_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /properties/${prop}/retention-metrics"
              payload: { cohort_start: "2027-06-01", cohort_end: "2027-06-30", variant: "TRAILING" }
              as: PropertyManager
              captures: { t_size: "$.data.cohort_size", t_retained: "$.data.retained_count", t_mtm: "$.data.mtm_count", t_lost: "$.data.lost_count", t_rate: "$.data.retention_rate_bps" }
            - call: "GET /properties/${prop}/retention-metrics"
              payload: { cohort_start: "2027-06-01", cohort_end: "2027-06-30", variant: "PIPELINE" }
              as: PropertyManager
              captures: { p_size: "$.data.cohort_size", p_retained: "$.data.retained_count", p_rate: "$.data.retention_rate_bps" }
          assert:
            - "TRAILING: t_size == 4, t_retained == 2, t_mtm == 1, t_lost == 1, t_rate == 5000"
            - "PIPELINE diverges on identical data: p_size == 4, p_retained == 3, p_rate == 7500"
            - "variant delta: p_rate - t_rate == 2500 (the single MTM conversion counted only by PIPELINE)"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: proposed_rent_multi_input_clamps
        grounds:
          - calculations.proposed_rent_cents
          - calculations.notice_days_required
          - calculations.effective_cap_bps
        distinguishing_aspect: |
          Mode (a) — a formula with >= 3 inputs and non-linear interaction: market gap (1000 bps)
          x strategy factor (0.6) nested inside a term-discount subtraction (60 bps) nested inside
          a statutory cap clamp (min with 550), plus a conditional branch on the increase tier that
          flips the notice period to 90 days; changing any one input changes the output non-linearly.
        test_recipe:
          setup:
            - "Policy CA-OAK (cap 550, threshold 500, notice 60/90); property band [18,18] forces offered_term_months 18"
            - "Unit market 220000; lease rent 200000, 2026-06-01 + 12mo -> end 2027-06-01"
            - "Hand computation: gap = round_half_up(20000/200000*10000) = 1000 bps; strategy = 600; term discount = min(60, 180) = 60; uncapped 540; cap min(540, 550) = 540; rent = round_half_up(200000*1.054) = 210800; 540 > 500 -> high tier 90 days; latest_issue = 2027-06-01 - 90d = 2027-03-03"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Band-18 Court", rent_cap_policy_id: "${pol}", min_term_months: 18, max_term_months: 18 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "301", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Mina Cho", email: "mina.cho@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id", lease_v: "$.data.version" }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: "$.data.id", proposed: "$.data.proposed_rent_cents", term: "$.data.offered_term_months", notice_days: "$.data.notice_days_required", incr: "$.data.proposed_increase_bps", cap_snap: "$.data.cap_bps_snapshot", latest: "$.data.latest_issue_date" }
          assert:
            - "RenewalOffer.${offer}.proposed_rent_cents == 210800"
            - "offered_term_months == 18 (band [18,18] forces it)"
            - "proposed_increase_bps == 540 and cap_bps_snapshot == 550"
            - "notice_days_required == 90 and latest_issue_date == 2027-03-03 (540 bps > 500 threshold)"

      - name: mtm_rent_nested_rounding_order
        grounds:
          - calculations.mtm_rent_cents
          - state_machines.Lease.ACTIVE_to_MTM
          - entities.Lease.fields.mtm_converted_on
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters, distinct from sibling mode (a): with
          current rent 199990 and no issued offer, round(base)=round_half_up(199990*1.055)=210989
          then round(premium)=round_half_up(210989*1.15)=242637; the forbidden single-rounding
          variant round_half_up(199990*1.055*1.15)=242638 differs by one cent, so the pinned
          round-twice order is observable.
        test_recipe:
          setup:
            - "Policy CA-OAK (effective cap 550); property band [12,12]; unit market 220000"
            - "Lease rent 199990 (adversarial odd value), 2026-06-01 + 12mo -> end 2027-06-01; NO offer is ever created, so the MTM base falls back to round_half_up(rent * (1 + 550/10000)) = 210989"
            - "Clock advanced to exactly term_end_date 2027-06-01 (half-open end: conversion fires at >= term_end)"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Rounding Court", rent_cap_policy_id: "${pol}", min_term_months: 12, max_term_months: 12 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "401", bedrooms: 1, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Omar Ruiz", email: "omar.ruiz@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 199990 }
              as: PropertyManager
              captures: { lease: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { status: "$.data.status", rent: "$.data.monthly_rent_cents", mtm_on: "$.data.mtm_converted_on" }
          assert:
            - "Lease.${lease}.status == MTM and mtm_converted_on == 2027-06-01"
            - "monthly_rent_cents == 242637 (round base 210989 first, then premium); the single-rounding variant 242638 is the wrong answer"

  # ---------------------------------------------------------------------------
  # Rule 3: non-linear state machines on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle_rounds
        grounds:
          - state_machines.RenewalOffer.ISSUED_to_COUNTERED
          - state_machines.RenewalOffer.COUNTERED_to_ISSUED
          - errors[ERR_MAX_NEGOTIATION_ROUNDS]
        distinguishing_aspect: |
          RenewalOffer is cyclic: ISSUED -> COUNTERED -> ISSUED loops with offer_round incrementing
          per cycle; the loop terminates at the hard cap — a COUNTER attempted at offer_round 3 is
          rejected with ERR_MAX_NEGOTIATION_ROUNDS while rounds 1 and 2 succeed.
        test_recipe:
          setup:
            - "Policy CA-OAK (cap 550, threshold 500, notice 60/90); property band [18,18]; unit market 220000; lease rent 200000, 2026-06-01 + 12mo"
            - "Offer BALANCED -> proposed 210800 (540 bps); issued at default clock 2026-05-01 (latest_issue 2027-03-03)"
            - "Counters of 211000 keep revised rent >= proposed so no concession approval is required; 211000 = 550 bps <= cap 550"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: "$.data.id" }
            - call: "POST /properties"
              payload: { name: "Cycle Court", rent_cap_policy_id: "${pol}", min_term_months: 18, max_term_months: 18 }
              as: PlatformAdmin
              captures: { prop: "$.data.id" }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "501", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: "$.data.id" }
            - call: "POST /residents"
              payload: { full_name: "Nia Patel", email: "nia.patel@x.com" }
              as: PlatformAdmin
              captures: { res: "$.data.id" }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: "$.data.id", round1: "$.data.offer_round" }
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "COUNTER", counter_rent_cents: 211000 }
              as: Resident
              as_user_id: "${res}"
              captures: { st_c1: "$.data.status" }
            - call: "POST /renewal-offers/${offer}/revise"
              payload: {}
              as: LeasingAgent
              captures: { round2: "$.data.offer_round", st_i2: "$.data.status" }
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "COUNTER", counter_rent_cents: 211000 }
              as: Resident
              as_user_id: "${res}"
            - call: "POST /renewal-offers/${offer}/revise"
              payload: {}
              as: LeasingAgent
              captures: { round3: "$.data.offer_round", st_i3: "$.data.status" }
          trigger:
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "COUNTER", counter_rent_cents: 211000 }
              as: Resident
              as_user_id: "${res}"
              captures: { err: "$.data.error_id" }
          assert:
            - "round1 == 1 at creation; after first revise round2 == 2 and st_i2 == ISSUED; after second revise round3 == 3 and st_i3 == ISSUED"
            - "cycle looped ISSUED -> COUNTERED -> ISSUED twice on the same entity"
            - "fourth counter at offer_round 3: err == ERR_MAX_NEGOTIATION_ROUNDS (http 409)"

      - name: lease_renewal_cycle_status_loops
        grounds:
          - state_machines.Lease.ACTIVE_to_RENEWAL_PENDING
          - state_machines.Lease.RENEWAL_PENDING_to_ACTIVE
          - state_machines.Lease.ACTIVE_to_MTM
          - state_machines.Lease.RENEWAL_PENDING_to_MTM
        distinguishing_aspect: |
          Lease is cyclic on a different entity than the sibling offer loop: ACTIVE ->
          RENEWAL_PENDING -> ACTIVE (decline revert and execution return), and the MTM variant of
          the same loop MTM -> RENEWAL_PENDING -> MTM (withdraw revert) — four distinct cycle arcs
          on one status field, each with an observable status_before_offer restore.
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [12,12]; unit market 210000; lease rent 200000, 2026-06-01 + 12mo -> end 2027-06-01"
            - "Offer 1 CONSERVATIVE (proposed 203000, 150 bps, 60-day tier, latest_issue 2027-04-02): issued then DECLINED -> lease reverts to ACTIVE"
