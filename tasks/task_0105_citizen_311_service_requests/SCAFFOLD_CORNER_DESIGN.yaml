      - name: derived_member_count_reconciled_on_attach
        claim_type: derived_field_reconciliation
        grounds: [calculations, entities.DuplicateCluster.fields.member_count]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_request_branching_submitted_fork
          rationale: "member_count == 1 after a single attach is asserted by the branching-fork difficulty instance."

      - name: cascade_complete_chain_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED, state_machines.ServiceRequest.IN_PROGRESS_to_RESOLVED]
        excluded_because:
          difficulty_instance: transitive_cascade / complete_cascade_request_resolved_survey_and_escalation
          rationale: "The depth-3 complete cascade (WorkOrder->request->survey+escalation) is the named difficulty instance."

