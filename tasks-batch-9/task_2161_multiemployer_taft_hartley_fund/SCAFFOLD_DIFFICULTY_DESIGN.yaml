      - name: withdrawn_employer_safety_beats_duplicate_period_constraint
        grounds:
          - validations[priority=50]
          - validations[priority=60]
          - errors[ERR_EMPLOYER_WITHDRAWN]
          - errors[ERR_DUPLICATE_WORK_PERIOD]
