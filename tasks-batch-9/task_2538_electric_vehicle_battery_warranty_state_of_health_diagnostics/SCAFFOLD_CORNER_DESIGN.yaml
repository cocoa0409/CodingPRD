              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C341", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S1", detected_at: "2026-07-25T00:00:00Z", source: "TELEMATICS", affected_module_positions: [5] }
              as: TelematicsGateway
              captures: { evt_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/thermal-events/${evt_id}/regulatory-notification"
              payload: { reporting_service_center_id: "${center_id}", regulator_reference: "REG-S1-1" }
              as: RegulatoryLiaison
              as_user_id: "liaison-001"
            - call: "GET /battery-warranty/thermal-events/${evt_id}"
              payload: {}
              as: RegulatoryLiaison
              as_user_id: "liaison-001"
            - call: "GET /battery-warranty/service-centers/${center_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the filing returns 409 ERR_NOTIFICATION_NOT_REQUIRED"
            - "the event still reads notification_status NOT_REQUIRED, notification_deadline_at null, notification_filed_at null, regulator_reference null and reporting_service_center_id null"
            - "containment_status is DETECTED with containment_steps_completed 0 and event_status OPEN - the containment dimension is untouched by the refusal"
            - "the center reads late_notification_count 0 and compliance_score 100"
            - "the vehicle is still ACTIVE with warranty_hold false and the pack IN_SERVICE with damaged_defective false - an S1 event quarantines nothing at creation"

      - name: duplicate_active_consent_for_the_same_campaign_vehicle_pair_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=64]
          - entities.RemediationConsent.fields.superseded_consent_id
          - errors[ERR_DUPLICATE_ACTIVE_CONSENT]
        distinguishing_aspect: |
          The uniqueness key is (campaign_id, vehicle_id) restricted to the OPEN statuses, and the
          same rule polices the supersession pointer: naming a still-PENDING predecessor is the same
          violation as filing a bare duplicate. The cascade-created first-round record is what makes
          the pair active, so no manual solicitation is needed to arm the conflict.
        test_recipe:
          setup:
            - "One program, one MX-90 vehicle in US-WEST with an installed NEW pack."
            - "One CHARGING campaign released FIELD, which mints exactly one PENDING consent for that vehicle."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000551", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C351", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns"
              payload: { campaign_code: "CMP-DUPC-01", target_defect: "CHARGING", software_version: "bms-4.2.1", applies_to_pack_type: "ANY", applies_to_model_code: "MX-90" }
              as: ProgramAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns/${camp_id}/release"
              payload: { release_scope: "FIELD" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}" }
              as: ProgramAdmin
              captures: { consent_id: "$.data[0].id" }
            - call: "GET /battery-warranty/remediation-campaigns/${camp_id}"
              payload: {}
              as: ProgramAdmin
              captures: { camp_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh_id}", expected_campaign_version: "${camp_ver}" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${veh_id}", expected_campaign_version: "${camp_ver}", superseded_consent_id: "${consent_id}" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/remediation-campaigns/${camp_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the bare duplicate returns 409 ERR_DUPLICATE_ACTIVE_CONSENT"
            - "the re-solicitation naming the PENDING predecessor also returns 409 ERR_DUPLICATE_ACTIVE_CONSENT - a predecessor must be DECLINED or EXPIRED"
            - "the consent listing still has total_count 1, that row is solicitation_round 1 with superseded_consent_id null, consent_status PENDING and expires_at 2026-08-15T00:00:00Z"
            - "the campaign still reads solicited_consent_count 1, open_consent_count 1, applied_count 0, status FIELD_RELEASE and version ${camp_ver} - two refusals bumped nothing"

  - section: rbac
    instances:
      - name: request_with_absent_or_unknown_role_returns_unauthenticated
        claim_type: exclusive_operations
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 outranks EVERYTHING, so a missing or non-member X-User-Role must yield 401
          before path existence (a bogus id still answers 401, not 404) and before payload
          validation (a structurally invalid body still answers 401). A role name that merely looks
          plausible - "Adjudicator" instead of "WarrantyAdjudicator" - is not a member of the
          declared set.
        test_recipe:
          setup:
            - "One program exists, but no row is needed for the probe."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /battery-warranty/warranty-programs/${prog_id}"
              payload: {}
              as: NONE
            - call: "GET /battery-warranty/warranty-programs/${prog_id}"
              payload: {}
              as: Adjudicator
            - call: "GET /battery-warranty/battery-packs/pack_missing"
              payload: {}
              as: NONE
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: 12345 }
              as: NONE
          assert:
            - "the header-less read returns 401 ERR_UNAUTHENTICATED"
            - "the unknown role name Adjudicator returns 401 ERR_UNAUTHENTICATED, not 403"
            - "the header-less read of a nonexistent pack returns 401 ERR_UNAUTHENTICATED, not 404 - priority 1 precedes priority 6"
            - "the header-less create with a malformed vin returns 401 ERR_UNAUTHENTICATED, not 400, and no vehicle is created"

      - name: cross_role_writes_are_unauthorized_for_every_write_family
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - endpoints[POST /battery-warranty/soh-assessments]
          - endpoints[POST /battery-warranty/vehicles/{id}/telematics-snapshots]
        distinguishing_aspect: |
          Each write family is single-role, and the probe crosses them PAIRWISE: the technician
          cannot ingest telematics, the gateway cannot author an assessment, the adjudicator cannot
          register a vehicle and the owner cannot adjudicate. A blanket "any authenticated writer"
          shortcut passes none of the four, and read access must remain unaffected.
        test_recipe:
          setup:
            - "One program, one center with a technician, one vehicle with an installed pack."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000561", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C361", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 56.000 }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_ver}" }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000562", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: WarrantyAdjudicator
              as_user_id: "adj-001"
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S2", detected_at: "2026-07-30T00:00:00Z", source: "TELEMATICS" }
              as: VehicleOwner
