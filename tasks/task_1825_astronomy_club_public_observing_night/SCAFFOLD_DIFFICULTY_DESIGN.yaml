              payload: {}
              as: EventCoordinator
            - call: "POST /club/event-operator-assignments"
              payload: { event_id: "${event_id}", member_id: "${op_id}", telescope_id: "${scope_id}" }
              as: EventCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /club/event-operator-assignments/${asg_id}/accept"
