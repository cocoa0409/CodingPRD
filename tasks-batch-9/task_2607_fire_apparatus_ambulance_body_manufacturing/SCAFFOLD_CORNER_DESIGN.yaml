  - section: validations
    instances:

      - name: auth_and_role_gates_rejected_before_existence_is_checked
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
          - errors.ERR_MISSING_AUTH_HEADERS
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: |
          The ladder is walked strictly: an unknown program id under a missing
          header is 401, under a wrong role is 403, and only under the right role
          does it become 404 — so a server that resolves the path id first would
          leak 404 in all three cases.
        test_recipe:
          setup:
            - "one ApparatusProgram in DRAFT"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Ladder program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/00000000-0000-4000-8000-000000000000/activate"
              as: NONE
              as_user_id: NONE
              captures: { e_no_headers: $.data.error_id }
            - call: "POST /programs/00000000-0000-4000-8000-000000000000/activate"
              as: ProgramAdmin
              as_user_id: NONE
              captures: { e_no_user: $.data.error_id }
            - call: "POST /programs/00000000-0000-4000-8000-000000000000/activate"
              as: FleetMechanic
              as_user_id: "mech-1"
              captures: { e_bad_role_value: $.data.error_id }
            - call: "POST /programs/00000000-0000-4000-8000-000000000000/activate"
              as: PurchasingOfficer
              as_user_id: "po-1"
              captures: { e_role: $.data.error_id }
            - call: "POST /programs/00000000-0000-4000-8000-000000000000/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_not_found: $.data.error_id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "${e_no_headers} == ERR_MISSING_AUTH_HEADERS with HTTP 401 (both headers absent)"
            - "${e_no_user} == ERR_MISSING_AUTH_HEADERS with HTTP 401 — a present X-User-Role does not excuse a missing X-User-ID"
            - "${e_bad_role_value} == ERR_MISSING_AUTH_HEADERS with HTTP 401 — a syntactically present but unknown role name fails the header check, it is not a 403"
            - "${e_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 — priority 2 beats the priority 4 existence check even though the path id is a fabricated UUID"
            - "${e_not_found} == ERR_PROGRAM_NOT_FOUND with HTTP 404 once the role is permitted"
            - "the final call is 200 with ApparatusProgram.${prog_id}.status == \"ACTIVE\" and version == 2; every response carries meta.api_request_id and meta.api_request_timestamp, and the four failures carry response_type == \"error\""

      - name: request_shape_check_rejects_before_foreign_keys_resolve
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - validations[priority=10]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          A body that is both malformed and points at a fabricated specification is
          400 ERR_INVALID_REQUEST, never 404 ERR_SPECIFICATION_NOT_FOUND — and the
          same malformed enum on a pagination query (limit=101) is also 400, so the
          shape gate covers list endpoints too.
        test_recipe:
          setup:
            - "one BidSpecification in DRAFT with one clause, so a well-formed entry would otherwise succeed"
          setup_api_calls:
            - call: "POST /programs"
