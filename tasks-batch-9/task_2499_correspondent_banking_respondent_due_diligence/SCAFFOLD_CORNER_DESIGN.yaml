            - "first response.status == 422 with error_id ERR_AGGREGATE_THRESHOLD_EXCEEDED - raw 400000000.00 * 1.15 * 1.30 / 1.00 = 598000000.00 clamps to 500000000.00 and 500000000.00 * 1.10 = 550000000.00 exceeds the ceiling"
