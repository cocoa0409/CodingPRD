      - name: consent_response_on_a_never_notified_lien_returns_422
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LIEN_NOT_NOTIFIED]
          - validations[priority=11]
          - entities.MortgageLien.fields.consent_response
        distinguishing_aspect: |
          A lien only becomes answerable once an underwrite PROCEED notifies it, so a consent response
          filed against a lien whose consent_application_id is null must be refused with 422 rather than
          silently recording a consent that no application asked for. The lien's system fields must be
          exactly as created (consent_response NOT_NOTIFIED, notified_at / consent_deadline_at null)
          after the rejection, and NOT_NOTIFIED must not be confused with PENDING.
        test_recipe:
          setup:
            - "Clock 2026-08-12; parcel P1 with one ACTIVE first-position lien of 25000000 and an application that is still in DRAFT, so no underwrite has run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/products"
              payload: { product_code: "SOLAR_PV_ROOF", category: "SOLAR_PV", useful_life_years: 25, max_annual_savings_cents: 300000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { prod_solar: $.data.id }
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id, resp_at_create: $.data.consent_response }
            - call: "POST /pace/applications"
              payload: { property_id: "${p1}", contractor_id: "${c1}", requested_term_years: 20 }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /pace/applications/${a1}/measures"
              payload: { product_id: "${prod_solar}", installed_cost_cents: 3000000, estimated_annual_savings_cents: 220000, expected_application_version: "${a1_v0}" }
              as: PropertyOwner
              as_user_id: "${p1}"
          trigger:
            - call: "POST /pace/mortgage-liens/${l1}/consent-response"
              payload: { response: "CONSENT", note: "holder called in" }
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { err_notified: $.data.error_id }
            - call: "GET /pace/mortgage-liens/${l1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_comp_1"
              captures: { resp_after: $.data.consent_response, deadline_after: $.data.consent_deadline_at }
          assert:
            - "resp_at_create == 'NOT_NOTIFIED' — the creation default, distinct from PENDING"
            - "422 err_notified == 'ERR_LIEN_NOT_NOTIFIED' because consent_application_id is null"
            - "The rejection is a pure no-op: resp_after == 'NOT_NOTIFIED', deadline_after is null, and notified_at / consent_responded_at are both null"
            - "Application.${a1}.status is still 'DRAFT' with consent_posture 'NOT_STARTED' and notified_lien_count 0"
            - "GET /pace/mortgage-liens?consent_application_id=${a1} returns total_count == 0"

