      - name: unauthorized_outranks_not_found
        grounds:
          - validations[priority=12, ERR_UNAUTHORIZED]
          - validations[priority=20, ERR_<ENTITY>_NOT_FOUND]
          - roles.WorkplaceProgramOffice.exclusive_operations
        priority_pair: [12, 20]
        expected_error: ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The RBAC band is checked before any lookup, so a caller with the wrong
          role addressing an id that does not exist learns nothing about existence:
          the answer is 403 ERR_UNAUTHORIZED, not 404. The same URL with the correct
          role returns 404 ERR_POLICY_CYCLE_NOT_FOUND, which is exactly the
          information leak the ordering prevents.
        test_recipe:
          setup:
            - "One OPEN cycle exists, but the id used by the trigger is a well-formed UUID that matches nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-PP4", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /policy-cycles/00000000-0000-4000-8000-000000000000/posture"
              payload: { target_posture: "LOCKED" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /policy-cycles/00000000-0000-4000-8000-000000000000/posture"
              payload: { target_posture: "LOCKED" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "LOCKED" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
          assert:
            - "Call 1 (wrong role, missing id) returns HTTP 403 with error id ERR_UNAUTHORIZED - NOT 404 ERR_POLICY_CYCLE_NOT_FOUND"
            - "Call 2 (correct role, missing id) returns HTTP 404 with error id ERR_POLICY_CYCLE_NOT_FOUND, proving the id genuinely does not resolve"
            - "Call 3 (wrong role, existing id) returns HTTP 403 with error id ERR_UNAUTHORIZED and PolicyCycle.${cyc_id}.posture is still OPEN"
            - "Neither 403 response body carries any field naming a PolicyCycle"

  - rule_id: boundary_precision_check
    instances:

      - name: pressure_exactly_two_and_exactly_four_are_inclusive
        grounds:
          - calculations.pressure_derived_stage.constants.STAGE_COACHING
          - calculations.pressure_derived_stage.constants.STAGE_WRITTEN_WARNING
          - calculations.credited_office_days.constants.MIN_PRESENCE_MINUTES
          - entities.Employee.fields.compliance_state
        distinguishing_aspect: |
          Three inclusive boundaries are crossed by one-unit changes in the same
          fixture: a pressure of exactly 2.00 is BREACH and opens the ladder at
          COACHING (not AT_RISK, not CURED), 1.00 falls back below the same
          boundary and cures the case, and a pressure of exactly 4.00 is
          WRITTEN_WARNING rather than COACHING. Nested inside, a BADGE signal of
          exactly 240 minutes counts as presence while 239 does not.
        test_recipe:
          setup:
            - "One OPEN cycle, team T2-HYB with expected_days_in_office_per_week 3 and corroboration off, one ACTIVE employee E-2001 holding an APPROVED HYBRID classification so required_days is 3 and SEVERITY_MULTIPLIER is 1.0."
