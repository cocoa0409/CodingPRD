      - name: group_size_and_refund_bounds_covered_by_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_GROUP_SIZE_BELOW_MINIMUM]", "errors[ERR_REFUND_EXCEEDS_PAID]", "errors[ERR_RAIN_CHECK_EXPIRED]", "errors[ERR_SEASON_NOT_READY]", "errors[ERR_SEASON_POSTURE_BLOCKED]", "errors[ERR_FOOD_PERMIT_NOT_ISSUED]", "errors[ERR_REHEARSAL_OVERLAP]", "errors[ERR_BOOTH_OVERLAP]"]
        excluded_because:
