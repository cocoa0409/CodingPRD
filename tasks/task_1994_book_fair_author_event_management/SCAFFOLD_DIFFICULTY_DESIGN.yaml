  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_slot_buffered_half_open_overlap
        grounds:
          - validations[priority=11]
          - errors[ERR_VENUE_CONFLICT]
          - entities.VenueSlot.fields.setup_buffer_minutes
        distinguishing_aspect: |
          Interval semantics A (VenueSlot): buffered HALF-OPEN intervals —
          [start_at - setup_buffer, end_at + teardown_buffer). Adjacency at the
          effective boundary is NOT a conflict (slot2 succeeds), any strict interior
          intersection is (slot3), and buffers extend occupancy (slot4 conflicts
          purely because of its own setup buffer).
        test_recipe:
          setup:
            - "Fair exists with venue_key GYM; slot1 HELD 10:00-12:00 with buffers 30/30 -> effective [09:30, 12:30)"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 20, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T12:00:00Z", setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: Organizer, captures: { slot1_id: "$.data.id" } }
          trigger:
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: AUTHOR_EVENT, start_at: "2026-08-10T12:30:00Z", end_at: "2026-08-10T14:00:00Z", setup_buffer_minutes: 0, teardown_buffer_minutes: 0 }, as: Organizer, captures: { slot2_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: AUTHOR_EVENT, start_at: "2026-08-10T12:15:00Z", end_at: "2026-08-10T13:00:00Z", setup_buffer_minutes: 0, teardown_buffer_minutes: 0 }, as: Organizer, captures: { err3: "$.data.error_id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: SETUP, start_at: "2026-08-10T12:30:00Z", end_at: "2026-08-10T13:30:00Z", setup_buffer_minutes: 15, teardown_buffer_minutes: 0 }, as: Organizer, captures: { err4: "$.data.error_id" } }
          assert:
            - "Slot2 (effective [12:30, 14:00)) is created HELD — half-open adjacency at 12:30 is not a conflict"
            - "Slot3 (effective [12:15, 13:00)) is rejected with ERR_VENUE_CONFLICT — strict interior intersection with [09:30, 12:30)"
            - "Slot4 is rejected with ERR_VENUE_CONFLICT — its own 15-minute setup buffer extends occupancy to [12:15, 13:30), intersecting slot1"
            - "VenueSlot.${slot1_id}.status remains HELD (rejections do not disturb existing slots)"

      - name: signing_session_closed_interval_aggregate_capacity
        grounds:
          - validations[priority=12]
          - errors[ERR_SIGNING_FLOOR_CAPACITY_EXCEEDED]
          - entities.SigningSession.fields.line_space_units
        distinguishing_aspect: |
          Interval semantics B (SigningSession, different resource entity):
          CLOSED-interval aggregate capacity — windows touching at a single endpoint
          (11:00) DO count as overlapping, and the summed line_space_units of all
          overlapping non-CANCELLED sessions must be <= fair capacity. This is the
          opposite adjacency treatment from venue slots, and an aggregate (not
          pairwise) rule: 6 + 5 = 11 > 10 rejects, 6 + 4 = 10 <= 10 admits.
        test_recipe:
          setup:
            - "Fair OPEN with signing_floor_capacity_units 10; booking TRAVEL_BOOKED; session1 SCHEDULED 10:00-11:00 with line_space_units 6"
          setup_api_calls:
            - { call: "POST /parties", payload: { kind: SCHOOL, name: "Ridgeview Elementary", contact_email: "pta@ridgeview.example" }, as: Organizer, captures: { school_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: PUBLISHER, name: "Maple Press", contact_email: "rep@maple.example" }, as: Organizer, captures: { pub_id: "$.data.id" } }
            - { call: "POST /parties", payload: { kind: AUTHOR, name: "Jane Writer", contact_email: "agent@jane.example" }, as: Organizer, captures: { author_id: "$.data.id" } }
            - { call: "POST /fairs", payload: { school_party_id: "${school_id}", title: "Fall Fair", venue_key: "GYM", planned_start_date: "2026-08-10", planned_end_date: "2026-08-14", signing_floor_capacity_units: 10, promo_budget_cents: 0 }, as: Organizer, captures: { fair_id: "$.data.id" } }
            - { call: "POST /venue-slots", payload: { fair_id: "${fair_id}", venue_key: "GYM", purpose: FAIR_DAY, start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-14T18:00:00Z", setup_buffer_minutes: 60, teardown_buffer_minutes: 60 }, as: Organizer, captures: { slot_id: "$.data.id" } }
            - { call: "POST /venue-slots/${slot_id}/confirm", payload: {}, as: SchoolCoordinator, as_user_id: "${school_id}" }
            - { call: "POST /consignment-agreements", payload: { fair_id: "${fair_id}", publisher_party_id: "${pub_id}", discount_pct: 0.40, return_cap_pct: 0.25, restocking_fee_pct: 0.10, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72 }, as: Organizer, captures: { agr_id: "$.data.id" } }
            - { call: "POST /consignment-agreements/${agr_id}/accept", payload: {}, as: PublisherRep, as_user_id: "${pub_id}" }
            - { call: "POST /fairs/${fair_id}/schedule", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open-stocking", payload: {}, as: Organizer }
            - { call: "POST /fairs/${fair_id}/open", payload: {}, as: Organizer }
            - { call: "POST /author-bookings", payload: { fair_id: "${fair_id}", author_party_id: "${author_id}", base_honorarium_cents: 10000, travel_cap_cents: 2000, bonus_threshold_attendees: 3, bonus_base_cents: 1000, bonus_per_attendee_cents: 100, offer_expiry_hours: 72 }, as: Organizer, captures: { booking_id: "$.data.id" } }
            - { call: "POST /author-bookings/${booking_id}/accept", payload: {}, as: AuthorRep, as_user_id: "${author_id}" }
            - { call: "POST /author-bookings/${booking_id}/book-travel", payload: { travel_actual_cents: 1500 }, as: Organizer }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: TICKETED, start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", line_space_units: 6, capacity_seats: 10, admit_concurrent_cap: 5 }, as: Organizer, captures: { session1_id: "$.data.id" } }
          trigger:
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: FREE, start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T12:00:00Z", line_space_units: 5, capacity_seats: 20, admit_concurrent_cap: 10 }, as: Organizer, captures: { err2: "$.data.error_id" } }
            - { call: "POST /signing-sessions", payload: { booking_id: "${booking_id}", fair_id: "${fair_id}", mode: FREE, start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T12:00:00Z", line_space_units: 4, capacity_seats: 20, admit_concurrent_cap: 10 }, as: Organizer, captures: { session3_id: "$.data.id" } }
          assert:
            - "Session with 5 units touching at 11:00 is rejected with ERR_SIGNING_FLOOR_CAPACITY_EXCEEDED (6 + 5 = 11 > 10; closed-interval touching counts as overlap)"
            - "Session with 4 units at the same window is created SCHEDULED (6 + 4 = 10 <= 10; equality admitted)"
            - "SigningSession.${session1_id}.status remains SCHEDULED"

  - rule_id: compensating_invariant
    instances:
      - name: sale_tender_void_copy_conservation
        grounds:
          - calculations.stock_qty_available
          - state_machines.SaleTransaction.DRAFT_to_TENDERED
          - state_machines.SaleTransaction.DRAFT_or_TENDERED_to_VOIDED
          - entities.Fair.fields.gross_sales_cents
        distinguishing_aspect: |
          Conserved quantity: PHYSICAL COPIES (and derived gross cents). Invariant
          qty_delivered == qty_held_preorder + qty_sold + qty_damaged +
          qty_returned_shipped + qty_available_for_sale holds before tender
          (10 == 0+0+0+0+10), after tender (10 == 0+3+0+0+7), and is exactly
          restored after the compensating void; Fair.gross_sales_cents returns
          from 3000 to 0 with zero drift.
