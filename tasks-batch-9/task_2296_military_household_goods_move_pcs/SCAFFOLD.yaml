# =============================================================================
# PRD Benchmark Seed Tables — task_2296_military_household_goods_move_pcs
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2296. Military Household Goods Move & PCS Entitlement (DoD Global Household Goods Contract):
  orders-based entitlement weight allowance calculation by rank and dependents, pre-move survey
  and estimated vs actual weight reconciliation, professional-gear (pro-gear) weight exclusion
  documentation, packing, storage-in-transit and delivery spread date management, short-notice
  and peak-season capacity allocation, loss/damage claim filing windows and full-replacement-value
  settlement, personally procured move reimbursement calculation, counseling appointments and
  shipment status notification obligations

domain_name: military-hhg-pcs-move
api_prefix: /hhg

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is addressable as a peer collection under /hhg/<collection>; parenthood is
  # expressed only through FK fields plus reverse-lookup sub-resource GETs, never through
  # identity-bearing nested paths (no /hhg/orders/{id}/shipments/{shipment_id}).

  state_machine_shape: parallel
  # Shipment carries two independent state dimensions (movement_status × weight_recon_status).
  # LossDamageClaim is cyclic (UNDER_REVIEW <-> INFO_REQUESTED) and branching (SETTLED | DENIED).
  # ProGearDeclaration is branching with a revision loop (REJECTED -> SUBMITTED).
  # EntitlementAuthorization is cyclic (AUTHORIZED <-> SUSPENDED).

  relationship_patterns:
    - one_to_many          # PcsOrder -> Shipment, LossDamageClaim -> ClaimItem
    - self_referential     # Shipment.superseded_shipment_id -> Shipment.id
    - cross_aggregate      # Shipment -> CapacityBlock (TSP aggregate) and -> EntitlementAuthorization

  role_model: segregation_of_duties
  # A ClaimsExaminer who recorded the inspection cannot settle the same claim; a ProgramAdmin
  # cannot waive excess cost on an entitlement they themselves authorized.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: ServiceMember
    parent: null
    common_fields: true
    fields:
      - name: dod_id
        type: string
        source: input
        description: 10-digit DoD ID number of the member
        constraints: "exactly 10 digits; unique across ServiceMember"
      - name: full_name
        type: string
        source: input
        description: member full name as printed on orders
        constraints: "1..120 chars"
      - name: rank_code
        type: enum
        source: input
        description: pay-grade code driving the entitlement weight table
        constraints: "one of E1,E2,E3,E4,E5,E6,E7,E8,E9,W1,W2,W3,W4,W5,O1,O2,O3,O4,O5,O6"
      - name: branch
        type: enum
        source: input
        description: uniformed service branch
        constraints: "one of ARMY,NAVY,AIR_FORCE,MARINE_CORPS,SPACE_FORCE,COAST_GUARD"
      - name: dependents_count
        type: integer
        source: input
        description: number of authorized dependents on record
        default: 0
        constraints: ">= 0 and <= 12"
      - name: spouse_present
        type: boolean
        source: input
        description: whether an authorized spouse is part of the household (gates spouse pro-gear)
        default: false
      - name: email
        type: string
        source: input
        description: notification email address
        constraints: "must contain '@'"
      - name: active_shipment_count
        type: integer
        source: computed
        description: >-
          count of Shipment rows whose order_id belongs to this member and whose movement_status
          NOT IN {DELIVERED, CANCELLED}
        default: 0

  - name: PcsOrder
    parent: null
    common_fields: true
    fields:
      - name: service_member_id
        type: string
        source: input
        description: "FK -> ServiceMember.id; the member the orders were issued to"
      - name: order_number
        type: string
        source: input
        description: printed order number
        constraints: "unique across PcsOrder; 4..32 chars"
      - name: move_type
        type: enum
        source: input
        description: category of the move, selects allowance modifiers
        constraints: "one of PCS_CONUS,PCS_OCONUS,SEPARATION,RETIREMENT,LOCAL"
      - name: issue_date
        type: datetime
        source: input
        description: date the orders were issued (ISO 8601 UTC)
      - name: report_no_later_than_date
        type: datetime
        source: input
        description: date the member must report to the destination duty station
        constraints: "must be strictly after issue_date"
      - name: origin_duty_station
        type: string
        source: input
        description: losing duty station name
      - name: destination_duty_station
        type: string
        source: input
        description: gaining duty station name
      - name: origin_market_code
        type: string
        source: input
        description: capacity market code of the origin installation (e.g. MKT-ATL)
        constraints: "matches ^MKT-[A-Z]{3}$"
      - name: distance_miles
        type: integer
        source: input
        description: authorized origin-to-destination mileage, drives transit days and PPM cost
        constraints: "> 0 and <= 12000"
      - name: is_dependent_restricted
        type: boolean
        source: input
        description: >-
          true for dependent-restricted OCONUS tours; forces WITHOUT_DEPENDENTS entitlement even
          when dependents_count >= 1
        default: false
      - name: dependents_count_at_issue
        type: integer
        source: computed
        description: >-
          snapshot of ServiceMember.dependents_count taken at order creation; overwritten by
          POST /hhg/orders/{id}/amend when dependents_count_override is supplied
      - name: status
        type: enum
        source: system
        description: >-
          order lifecycle state; CLOSED is set by the system when the owning EntitlementAuthorization
          reaches CLOSED, after which no further amendment is accepted
        default: ISSUED
        constraints: "one of ISSUED,AMENDED,CLOSED"
      - name: amendment_count
        type: integer
        source: system
        description: number of accepted amendments
        default: 0
        constraints: "<= 3"
      - name: last_amendment_reason
        type: string
        source: system
        description: reason text of the most recent amendment; null before first amendment

  - name: CounselingSession
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> PcsOrder.id; orders being counseled"
      - name: session_type
        type: enum
        source: input
        description: counseling delivery channel
        constraints: "one of SELF_SERVICE,VIRTUAL,IN_PERSON"
      - name: scheduled_at
        type: datetime
        source: input
        description: appointment start instant (ISO 8601 UTC)
      - name: counselor_user_id
        type: string
        source: system
        description: X-User-ID of the MoveCounselor that completed the session; null while SCHEDULED
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant at which the session was completed; null while SCHEDULED
      - name: entitlement_briefed
        type: boolean
        source: input
        description: counselor attestation that entitlement and excess-cost liability were briefed
        default: false
      - name: counseling_deadline_at
        type: datetime
        source: computed
        description: PcsOrder.report_no_later_than_date minus COUNSELING_LEAD_DAYS (14) days
      - name: is_late_counseling
        type: boolean
        source: computed
        description: completed_at > counseling_deadline_at (strict)
        default: false
      - name: status
        type: enum
        source: system
        description: session lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED,COMPLETED"

  - name: EntitlementAuthorization
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> PcsOrder.id; orders the entitlement derives from; copied from the counseling session"
      - name: counseling_session_id
        type: string
        source: system
        description: "FK -> CounselingSession.id; session whose completion created this row"
      - name: rank_code_at_authorization
        type: string
        source: computed
        description: snapshot of ServiceMember.rank_code at entitlement creation
      - name: dependent_status_effective
        type: enum
        source: computed
        description: >-
          WITH_DEPENDENTS when PcsOrder.dependents_count_at_issue >= 1 AND
          PcsOrder.is_dependent_restricted == false; otherwise WITHOUT_DEPENDENTS
        constraints: "one of WITH_DEPENDENTS,WITHOUT_DEPENDENTS"
      - name: base_weight_allowance_lbs
        type: integer
        source: computed
        description: output of calculations.entitlement_weight_allowance (table + move_type modifier)
      - name: pro_gear_member_allowance_lbs
        type: integer
        source: computed
        description: member pro-gear exclusion cap (PRO_GEAR_MEMBER_CAP_LBS = 2000)
        default: 2000
      - name: pro_gear_spouse_allowance_lbs
        type: integer
        source: computed
        description: >-
          500 when dependent_status_effective == WITH_DEPENDENTS AND ServiceMember.spouse_present
          == true, else 0
        default: 0
      - name: admin_weight_bump_lbs
        type: integer
        source: input
        description: administrative allowance increase granted at authorization
        default: 0
        constraints: ">= 0 and <= 2000"
      - name: total_billable_cap_lbs
        type: integer
        source: computed
        description: base_weight_allowance_lbs + admin_weight_bump_lbs
      - name: charged_billable_weight_lbs
        type: integer
        source: computed
        description: >-
          ledger sum of Shipment.billable_weight_lbs over shipments with entitlement_id == this.id,
          weight_recon_status IN {ESTIMATED, ACTUAL_RECORDED, DISPUTED, RECONCILED} and
          movement_status != CANCELLED
        default: 0
      - name: pro_gear_excluded_total_lbs
        type: integer
        source: computed
        description: sum of Shipment.pro_gear_excluded_lbs over the same shipment set
        default: 0
      - name: excess_weight_lbs
        type: integer
        source: computed
        description: max(0, charged_billable_weight_lbs - total_billable_cap_lbs)
        default: 0
      - name: gross_excess_cost_usd
        type: number
        source: computed
        description: excess transportation cost before waivers (calculations.entitlement_excess_weight_and_cost)
        default: 0
        constraints: "2 decimal places"
      - name: excess_cost_waived_usd
        type: number
        source: computed
        description: cumulative amount waived by ProgramAdmin; reset to 0 by revoke-waiver
        default: 0
        constraints: "2 decimal places; <= gross_excess_cost_usd"
      - name: excess_cost_due_usd
        type: number
        source: computed
        description: max(0, gross_excess_cost_usd - excess_cost_waived_usd)
        default: 0
        constraints: "2 decimal places"
      - name: authorized_by_user_id
        type: string
        source: system
        description: X-User-ID of the MoveCounselor that authorized this entitlement
      - name: waiver_reason
        type: string
        source: system
        description: reason recorded on the most recent excess-cost waiver; null when none
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded when status moved to SUSPENDED; null otherwise
      - name: status
        type: enum
        source: system
        description: entitlement lifecycle state; gates shipment creation and packing
        default: DRAFT
        constraints: "one of DRAFT,AUTHORIZED,SUSPENDED,CLOSED"

  - name: MovingCompany
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: transportation service provider (TSP) legal name
      - name: scac_code
        type: string
        source: input
        description: standard carrier alpha code
        constraints: "exactly 4 uppercase letters; unique across MovingCompany"
      - name: markets
        type: array
        source: input
        description: list of market codes this TSP is qualified to serve (e.g. ["MKT-ATL","MKT-DFW"])
        constraints: "non-empty; each element matches ^MKT-[A-Z]{3}$"
      - name: settled_claim_count
        type: integer
        source: computed
        description: number of LossDamageClaim rows in status SETTLED against this TSP's shipments
        default: 0
      - name: claim_settlement_total_usd
        type: number
        source: computed
        description: sum of LossDamageClaim.settlement_total_usd for SETTLED claims on this TSP
        default: 0
        constraints: "2 decimal places"
      - name: performance_score
        type: number
        source: computed
        description: output of calculations.tsp_performance_score
        default: 100
        constraints: "0.00 .. 100.00, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: TSP standing; PROBATION and SUSPENDED restrict capacity awards
        default: ACTIVE
        constraints: "one of ACTIVE,PROBATION,SUSPENDED"

  - name: CapacityBlock
    parent: null
    common_fields: true
    fields:
      - name: tsp_id
        type: string
        source: input
        description: "FK -> MovingCompany.id; TSP that owns this weekly capacity"
      - name: market_code
        type: string
        source: input
        description: market this block supplies
        constraints: "matches ^MKT-[A-Z]{3}$"
      - name: week_start_date
        type: datetime
        source: input
        description: inclusive start of the capacity week (must be a Monday, 00:00:00Z)
      - name: week_end_date
        type: datetime
        source: computed
        description: >-
          exclusive end of the capacity week; must equal week_start_date + 7 days
          (half-open interval [week_start_date, week_end_date))
      - name: total_capacity_lbs
        type: integer
        source: input
        description: total poundage the TSP can move out of this market during the week
        constraints: "> 0"
      - name: short_notice_reserve_pct
        type: number
        source: input
        description: fraction of total_capacity_lbs reserved for short-notice shipments
        default: 0.15
        constraints: ">= 0 and <= 0.5"
      - name: effective_reserve_pct
        type: number
        source: computed
        description: >-
          max(short_notice_reserve_pct, PEAK_MIN_RESERVE_PCT=0.25) when peak_season is true,
          else short_notice_reserve_pct
      - name: general_pool_lbs
        type: integer
        source: computed
        description: floor(total_capacity_lbs * (1 - effective_reserve_pct))
      - name: short_notice_pool_lbs
        type: integer
        source: computed
        description: total_capacity_lbs - general_pool_lbs
      - name: committed_general_lbs
        type: integer
        source: computed
        description: >-
          sum of Shipment.billable_weight_lbs for awarded shipments with is_short_notice == false,
          capacity_block_id == this.id and movement_status != CANCELLED
        default: 0
      - name: committed_short_notice_lbs
        type: integer
        source: computed
        description: same sum restricted to awarded shipments with is_short_notice == true
        default: 0
      - name: committed_lbs
        type: integer
        source: computed
        description: committed_general_lbs + committed_short_notice_lbs
        default: 0
      - name: peak_season
        type: boolean
        source: computed
        description: >-
          true when week_start_date falls inside the peak window
          [May 15, Sep 30] of its calendar year (inclusive both ends)
        default: false
      - name: status
        type: enum
        source: system
        description: >-
          OPEN while committed_lbs < 90% of total_capacity_lbs and owning TSP is ACTIVE;
          RESTRICTED when utilisation >= 90% or owning TSP is PROBATION; CLOSED when
          committed_lbs >= total_capacity_lbs or owning TSP is SUSPENDED
        default: OPEN
        constraints: "one of OPEN,RESTRICTED,CLOSED"
  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> PcsOrder.id; orders authorising this shipment"
      - name: entitlement_id
        type: string
        source: input
        description: "FK -> EntitlementAuthorization.id; ledger this shipment charges weight against"
      - name: tsp_id
        type: string
        source: input
        description: "FK -> MovingCompany.id; assigned transportation service provider"
      - name: capacity_block_id
        type: string
        source: system
        description: >-
          FK -> CapacityBlock.id; set by POST /hhg/capacity-blocks/{id}/awards, cleared by
          release-award; null while unawarded
      - name: superseded_shipment_id
        type: string
        source: input
        description: >-
          FK -> Shipment.id; the CANCELLED shipment this one replaces; null for original shipments
      - name: shipment_code
        type: string
        source: input
        description: TSP-visible shipment reference
        constraints: "unique across Shipment; 4..24 chars"
      - name: shipment_method
        type: enum
        source: input
        description: transportation method
        constraints: "one of HHG,UB,NTS,PPM"
      - name: origin_market_code
        type: string
        source: input
        description: market the shipment originates from; must be present in MovingCompany.markets
        constraints: "matches ^MKT-[A-Z]{3}$"
      - name: requested_pack_date
        type: datetime
        source: input
        description: member-requested pack date
      - name: requested_pickup_date
        type: datetime
        source: input
        description: member-requested pickup date; anchors the spread window
        constraints: "must be >= requested_pack_date"
      - name: requested_delivery_date
        type: datetime
        source: input
        description: member-requested delivery date at destination
        constraints: "must be > requested_pickup_date"
      - name: booked_at
        type: datetime
        source: system
        description: logical-clock instant at shipment creation
      - name: is_short_notice
        type: boolean
        source: computed
        description: >-
          true when (requested_pickup_date - booked_at) < SHORT_NOTICE_DAYS (5) whole days
        default: false
      - name: peak_season
        type: boolean
        source: computed
        description: true when requested_pickup_date falls inside [May 15, Sep 30] inclusive
        default: false
      - name: spread_start_date
        type: datetime
        source: computed
        description: earliest permitted actual pickup date (calculations.spread_window_and_transit)
      - name: spread_end_date
        type: datetime
        source: computed
        description: latest permitted actual pickup date (inclusive)
      - name: transit_days_allowed
        type: integer
        source: computed
        description: allowed transit days from actual pickup to required delivery
      - name: required_delivery_by
        type: datetime
        source: computed
        description: actual_pickup_date + transit_days_allowed days; null before pickup
      - name: survey_date
        type: datetime
        source: system
        description: date the pre-move survey was performed; null before survey
      - name: estimate_method
        type: enum
        source: input
        description: >-
          survey estimating method supplied to POST /hhg/shipments/{id}/survey; null before survey
        constraints: "one of CUBE_X7,INVENTORY_TABLE"
      - name: room_estimates
        type: array
        source: input
        description: >-
          survey line items, each { room_name: string, cube_feet: number }; ordered as submitted
        constraints: "non-empty at survey; cube_feet > 0 for every element"
      - name: estimated_gross_lbs
        type: integer
        source: computed
        description: output of calculations.survey_estimated_gross_weight; null before survey
      - name: actual_gross_lbs
        type: integer
        source: input
        description: certified loaded-scale weight; null until record-actual-weight
        constraints: "> 0"
      - name: actual_tare_lbs
        type: integer
        source: input
        description: certified empty-scale weight; null until record-actual-weight
        constraints: ">= 0 and < actual_gross_lbs"
      - name: net_actual_lbs
        type: integer
        source: computed
        description: actual_gross_lbs - actual_tare_lbs; null before actual weights recorded
      - name: pro_gear_excluded_lbs
        type: integer
        source: computed
        description: >-
          capped verified pro-gear weight excluded from billable weight
          (calculations.shipment_billable_weight step 1)
        default: 0
      - name: billable_weight_lbs
        type: integer
        source: computed
        description: output of calculations.shipment_billable_weight for the current basis
        default: 0
      - name: billable_basis
        type: enum
        source: computed
        description: which variant produced billable_weight_lbs
        default: NONE
        constraints: "one of NONE,ESTIMATED,ACTUAL"
      - name: reweigh_required
        type: boolean
        source: computed
        description: >-
          true when net_actual_lbs > estimated_gross_lbs * REWEIGH_TRIGGER_RATIO (1.10)
        default: false
      - name: weigh_date
        type: datetime
        source: system
        description: date of the most recently recorded certified weighing; null before weighing
      - name: pack_date
        type: datetime
        source: system
        description: actual pack date; null before pack
      - name: actual_pickup_date
        type: datetime
        source: system
        description: actual pickup date; null before pickup
      - name: delivery_date
        type: datetime
        source: system
        description: actual delivery date; null before delivery
      - name: movement_status
        type: enum
        source: system
        description: physical movement dimension of the shipment state
        default: AWARDED
        constraints: "one of AWARDED,ON_HOLD,SURVEYED,PACKED,PICKED_UP,IN_SIT,DELIVERED,CANCELLED"
      - name: weight_recon_status
        type: enum
        source: system
        description: weight reconciliation dimension, evolving independently of movement_status
        default: PENDING
        constraints: "one of PENDING,ESTIMATED,ACTUAL_RECORDED,DISPUTED,RECONCILED"
      - name: hold_reason
        type: string
        source: system
        description: reason recorded when movement_status moved to ON_HOLD; null otherwise
      - name: cancel_reason
        type: string
        source: system
        description: reason recorded at cancellation; null otherwise

  - name: ProGearDeclaration
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; shipment the professional gear travels in"
      - name: owner
        type: enum
        source: input
        description: whose professional gear this is
        constraints: "one of MEMBER,SPOUSE"
      - name: item_description
        type: string
        source: input
        description: description of the professional items
      - name: claimed_weight_lbs
        type: integer
        source: input
        description: weight the member claims as pro-gear
        constraints: "> 0 and <= 2500"
      - name: documentation_type
        type: enum
        source: input
        description: supporting documentation submitted with the declaration
        constraints: "one of ITEMIZED_INVENTORY,EMPLOYER_LETTER,ORDERS_EXTRACT,NONE"
      - name: verified_weight_lbs
        type: integer
        source: computed
        description: >-
          weight accepted by the counselor at verification; 0 while SUBMITTED or REJECTED
        default: 0
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the MoveCounselor that verified or rejected the declaration
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded at rejection; null otherwise
      - name: resubmission_count
        type: integer
        source: system
        description: number of times the member resubmitted after a rejection
        default: 0
        constraints: "<= 2"
      - name: status
        type: enum
        source: system
        description: declaration lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED,VERIFIED,PARTIALLY_VERIFIED,REJECTED"

  - name: SitAuthorization
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; shipment placed into storage in transit"
      - name: sit_type
        type: enum
        source: input
        description: whether storage occurs at origin or destination
        constraints: "one of ORIGIN,DESTINATION"
      - name: entry_date
        type: datetime
        source: input
        description: first day of storage (inclusive calendar day)
      - name: requested_days
        type: integer
        source: input
        description: days of storage the TSP requests
        constraints: "> 0 and <= 90"
      - name: authorized_days
        type: integer
        source: system
        description: days granted by the counselor; 0 while REQUESTED
        default: 0
      - name: extension_days
        type: integer
        source: system
        description: cumulative extra days granted by extensions
        default: 0
      - name: total_authorized_days
        type: integer
        source: computed
        description: authorized_days + extension_days
        default: 0
        constraints: "<= SIT_MAX_TOTAL_DAYS (90)"
      - name: release_date
        type: datetime
        source: system
        description: day the lot left storage; null while REQUESTED or AUTHORIZED
      - name: days_used
        type: integer
        source: computed
        description: max(1, whole days between entry_date and release_date); 0 before release
        default: 0
      - name: excess_days
        type: integer
        source: computed
        description: max(0, days_used - total_authorized_days)
        default: 0
      - name: sit_base_cost_usd
        type: number
        source: computed
        description: handling plus daily storage charges before fuel surcharge
        default: 0
        constraints: "2 decimal places"
      - name: fuel_surcharge_pct
        type: number
        source: computed
        description: surcharge tier selected from sit_base_cost_usd (pinned evaluation order)
        default: 0
      - name: fuel_surcharge_usd
        type: number
        source: computed
        description: round_half_up(sit_base_cost_usd * fuel_surcharge_pct, 2)
        default: 0
        constraints: "2 decimal places"
      - name: sit_total_cost_usd
        type: number
        source: computed
        description: sit_base_cost_usd + fuel_surcharge_usd
        default: 0
        constraints: "2 decimal places"
      - name: member_liability_usd
        type: number
        source: computed
        description: portion of sit_total_cost_usd attributable to excess_days, billed to the member
        default: 0
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: system
        description: storage authorization lifecycle state
        default: REQUESTED
        constraints: "one of REQUESTED,AUTHORIZED,RELEASED"

  - name: LossDamageClaim
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; delivered shipment the loss or damage occurred on"
      - name: claim_type
        type: enum
        source: input
        description: nature of the claim
        constraints: "one of LOSS,DAMAGE,BOTH"
      - name: notice_date
        type: datetime
        source: input
        description: date the member gave notice of loss or damage to the TSP
      - name: incident_description
        type: string
        source: input
        description: narrative of the loss or damage
      - name: filed_date
        type: datetime
        source: system
        description: logical-clock instant at submit; null while DRAFT
      - name: filing_window_days
        type: integer
        source: computed
        description: whole days between Shipment.delivery_date and filed_date; null while DRAFT
      - name: settlement_basis
        type: enum
        source: computed
        description: >-
          FULL_REPLACEMENT_VALUE when filing_window_days <= FRV_WINDOW_DAYS (270),
          DEPRECIATED_VALUE when 270 < filing_window_days <= CLAIM_WINDOW_DAYS (730)
        default: UNDETERMINED
        constraints: "one of UNDETERMINED,FULL_REPLACEMENT_VALUE,DEPRECIATED_VALUE"
      - name: claimed_total_usd
        type: number
        source: computed
        description: sum of ClaimItem.replacement_cost_usd over all items of this claim
        default: 0
        constraints: "2 decimal places"
      - name: settlement_total_usd
        type: number
        source: computed
        description: output of calculations.claim_settlement_valuation; 0 until settled
        default: 0
        constraints: "2 decimal places"
      - name: item_count
        type: integer
        source: computed
        description: count of ClaimItem rows with claim_id == this.id
        default: 0
      - name: info_request_count
        type: integer
        source: system
        description: number of information requests issued by the examiner
        default: 0
        constraints: "<= CLAIM_INFO_REQUEST_LIMIT (3)"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ClaimsExaminer that recorded the inspection
      - name: settled_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the ClaimsExaminer that settled the claim; must differ from
          reviewed_by_user_id (segregation of duties)
      - name: denial_reason
        type: string
        source: system
        description: reason recorded at denial; null otherwise
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: DRAFT
        constraints: "one of DRAFT,SUBMITTED,UNDER_REVIEW,INFO_REQUESTED,SETTLED,DENIED"

  - name: ClaimItem
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> LossDamageClaim.id; parent claim"
      - name: item_description
        type: string
        source: input
        description: description of the lost or damaged item
      - name: inventory_item_number
        type: string
        source: input
        description: inventory tag number from the packing inventory
      - name: category
        type: enum
        source: input
        description: item category, selects the depreciation rate
        constraints: "one of ELECTRONICS,FURNITURE,APPLIANCE,CLOTHING,OTHER"
      - name: replacement_cost_usd
        type: number
        source: input
        description: current replacement cost claimed by the member
        constraints: "> 0; 2 decimal places"
      - name: age_years
        type: number
        source: input
        description: age of the item in years at delivery
        constraints: ">= 0 and <= 60; 1 decimal place"
      - name: high_value_inventory_documented
        type: boolean
        source: input
        description: >-
          whether the item appears on the high-value inventory sheet; required for items with
          replacement_cost_usd >= HIGH_VALUE_THRESHOLD_USD (5000)
        default: false
      - name: depreciation_rate_pct_per_year
        type: number
        source: computed
        description: per-year depreciation fraction selected from category
      - name: item_settlement_usd
        type: number
        source: computed
        description: per-item settlement under the claim's settlement_basis; 0 until settled
        default: 0
        constraints: "2 decimal places"
      - name: adjudication_note
        type: string
        source: system
        description: examiner note recorded with the disposition; null while PENDING
      - name: disposition
        type: enum
        source: system
        description: examiner decision on this item
        default: PENDING
        constraints: "one of PENDING,ALLOWED,DENIED"

  - name: PpmSubmission
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; shipment with shipment_method == PPM"
      - name: trip_tickets
        type: array
        source: input
        description: >-
          certified weight tickets, each { trip_number: integer, full_lbs: integer,
          empty_lbs: integer, ticket_source: string, certified: boolean }; processed in
          trip_number ascending order
        constraints: "non-empty; trip_number unique within the array"
      - name: moved_weight_lbs
        type: integer
        source: computed
        description: sum over trips of (full_lbs - empty_lbs)
        default: 0
      - name: allowable_weight_lbs
        type: integer
        source: computed
        description: >-
          min(moved_weight_lbs, remaining entitlement room =
          max(0, EntitlementAuthorization.total_billable_cap_lbs -
          charged_billable_weight_lbs_excluding_this_shipment))
        default: 0
      - name: gcc_usd
        type: number
        source: computed
        description: government constructed cost for allowable_weight_lbs over PcsOrder.distance_miles
        default: 0
        constraints: "2 decimal places"
      - name: incentive_usd
        type: number
        source: computed
        description: round_half_up(gcc_usd * PPM_INCENTIVE_PCT (0.95), 2)
        default: 0
        constraints: "2 decimal places"
      - name: documented_expenses_usd
        type: number
        source: input
        description: receipted actual moving expenses submitted by the member
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: advance_paid_usd
        type: number
        source: input
        description: advance operating allowance already disbursed to the member
        default: 0
        constraints: ">= 0; 2 decimal places"
      - name: elected_basis
        type: enum
        source: input
        description: member election; AUTO lets the server apply the greater-of rule
        default: AUTO
        constraints: "one of AUTO,INCENTIVE_BASIS,ACTUAL_EXPENSE_BASIS"
      - name: applied_basis
        type: enum
        source: computed
        description: basis actually used to compute reimbursement_usd at approval
        default: UNDETERMINED
        constraints: "one of UNDETERMINED,INCENTIVE_BASIS,ACTUAL_EXPENSE_BASIS"
      - name: reimbursement_usd
        type: number
        source: computed
        description: gross reimbursement under applied_basis
        default: 0
        constraints: "2 decimal places"
      - name: net_payable_usd
        type: number
        source: computed
        description: max(0, reimbursement_usd - advance_paid_usd)
        default: 0
        constraints: "2 decimal places"
      - name: debt_owed_usd
        type: number
        source: computed
        description: max(0, advance_paid_usd - reimbursement_usd)
        default: 0
        constraints: "2 decimal places"
      - name: taxable_amount_usd
        type: number
        source: computed
        description: >-
          taxable portion under INCENTIVE_BASIS = max(0, reimbursement_usd -
          documented_expenses_usd); 0 under ACTUAL_EXPENSE_BASIS
        default: 0
        constraints: "2 decimal places"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the MoveCounselor that approved the submission
      - name: status
        type: enum
        source: system
        description: PPM submission lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED,APPROVED"

  - name: Notification
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: system
        description: "FK -> Shipment.id; shipment the status obligation belongs to; set by the transition that created the obligation"
      - name: notification_type
        type: enum
        source: system
        description: obligation kind, set by the transition that created the row
        constraints: >-
          one of PACK_DATE_CONFIRMED,PICKUP_CONFIRMED,SIT_ENTRY,WEIGHT_RECON_COMPLETE,CLAIM_ACK
      - name: trigger_event_at
        type: datetime
        source: system
        description: logical-clock instant of the transition that created the obligation
      - name: sla_hours
        type: integer
        source: computed
        description: notification service level in hours, selected by notification_type
      - name: due_by
        type: datetime
        source: computed
        description: trigger_event_at + sla_hours hours
      - name: channel
        type: enum
        source: input
        description: channel used at dispatch; null while PENDING
        constraints: "one of EMAIL,SMS,PORTAL"
      - name: sent_at
        type: datetime
        source: system
        description: logical-clock instant of dispatch; null while PENDING
      - name: hours_late
        type: number
        source: computed
        description: max(0, hours between due_by and sent_at); 0 when dispatched at or before due_by
        default: 0
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: system
        description: obligation state; LATE when dispatched strictly after due_by
        default: PENDING
        constraints: "one of PENDING,SENT,LATE"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  - entity: PcsOrder
    initial_state: ISSUED
    terminal_states: [CLOSED]
    transitions:
      - from: ISSUED
        to: AMENDED
        trigger: "POST /hhg/orders/{id}/amend"
        actor: MoveCounselor
        preconditions:
          - "PcsOrder.status IN {ISSUED, AMENDED} (a CLOSED order is rejected with ERR_INVALID_ORDER_STATE)"
          - "PcsOrder.amendment_count < 3"
          - "at least one of dependents_count_override / report_no_later_than_date_override / move_type_override is present"
        side_effects:
          - "amendment_count incremented by 1; last_amendment_reason set to amendment_reason"
          - "when dependents_count_override present: dependents_count_at_issue set to that value"
          - "cascade link 1: for the EntitlementAuthorization with order_id == this order and status IN {DRAFT, AUTHORIZED, SUSPENDED}, dependent_status_effective and base_weight_allowance_lbs and total_billable_cap_lbs recomputed via calculations.entitlement_weight_allowance"
          - "cascade link 2 (caused by link 1): the same entitlement's excess_weight_lbs, gross_excess_cost_usd and excess_cost_due_usd recomputed via calculations.entitlement_excess_weight_and_cost"
          - "cascade link 3 (caused by link 2): when excess_cost_due_usd > 2500.00 and status == AUTHORIZED, entitlement status moves AUTHORIZED -> SUSPENDED with suspension_reason 'EXCESS_COST_UNPAID'"
          - "cascade link 4 (caused by link 3): every Shipment with entitlement_id == that entitlement and movement_status == AWARDED moves AWARDED -> ON_HOLD with hold_reason 'ENTITLEMENT_SUSPENDED'"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /hhg/orders/{id}/amend (repeat amendment)"
        actor: MoveCounselor
        preconditions:
          - "PcsOrder.status == AMENDED"
          - "PcsOrder.amendment_count < 3"
        side_effects:
          - "same side-effect chain as ISSUED -> AMENDED"
        note: "Self-loop; the 4th amendment attempt is rejected with ERR_ORDER_AMENDMENT_LIMIT."
      - from: ISSUED
        to: CLOSED
        trigger: "system: bubble-up when the owning EntitlementAuthorization moves AUTHORIZED -> CLOSED on POST /hhg/shipments/{id}/reconcile-weight"
        actor: system
        preconditions:
          - "the EntitlementAuthorization with order_id == this.id moved to CLOSED"
        side_effects:
          - "no further amendment is accepted (ERR_INVALID_ORDER_STATE); the weight ledger is frozen"
        note: "dimension: status; also valid from AMENDED with identical side effects. Terminal."
      - from: AMENDED
        to: CLOSED
        trigger: "system: bubble-up when the owning EntitlementAuthorization moves AUTHORIZED -> CLOSED on POST /hhg/shipments/{id}/reconcile-weight"
        actor: system
        preconditions:
          - "the EntitlementAuthorization with order_id == this.id moved to CLOSED"
        side_effects:
          - "identical to ISSUED -> CLOSED"

  - entity: CounselingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /hhg/counseling-sessions/{id}/complete"
        actor: MoveCounselor
        preconditions:
          - "entitlement_briefed == true in the request body"
          - "no EntitlementAuthorization already exists with order_id == CounselingSession.order_id"
        side_effects:
          - "completed_at set to the logical clock; counselor_user_id set to X-User-ID"
          - "is_late_counseling recomputed as completed_at > counseling_deadline_at"
          - "creates one EntitlementAuthorization in status DRAFT with order_id and counseling_session_id set, admin_weight_bump_lbs = 0, and base_weight_allowance_lbs / pro_gear_member_allowance_lbs / pro_gear_spouse_allowance_lbs / total_billable_cap_lbs computed via calculations.entitlement_weight_allowance"

  - entity: EntitlementAuthorization
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "POST /hhg/entitlements/{id}/authorize"
        actor: MoveCounselor
        preconditions:
          - "admin_weight_bump_lbs in request body is between 0 and 2000 inclusive"
        side_effects:
          - "admin_weight_bump_lbs stored; total_billable_cap_lbs recomputed"
          - "authorized_by_user_id set to X-User-ID"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system: excess_cost_due_usd > 2500.00 after any ledger recompute (record-actual-weight, reweigh, pro-gear verify, order amend, shipment create)"
        actor: system
        preconditions:
          - "status == AUTHORIZED"
          - "excess_cost_due_usd > EXCESS_SUSPEND_THRESHOLD_USD (2500.00)"
        side_effects:
          - "suspension_reason set to 'EXCESS_COST_UNPAID'"
          - "every Shipment with entitlement_id == this.id and movement_status == AWARDED moves AWARDED -> ON_HOLD with hold_reason 'ENTITLEMENT_SUSPENDED'"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /hhg/entitlements/{id}/resume"
        actor: MoveCounselor | ProgramAdmin
        preconditions:
          - "status == SUSPENDED"
          - "excess_cost_due_usd == 0"
        side_effects:
          - "suspension_reason cleared to null"
          - "every Shipment with entitlement_id == this.id and movement_status == ON_HOLD moves ON_HOLD -> AWARDED with hold_reason cleared to null"
        note: "Cycle AUTHORIZED -> SUSPENDED -> AUTHORIZED; a waiver covering the full due amount is the usual way to reach excess_cost_due_usd == 0."
      - from: AUTHORIZED
        to: CLOSED
        trigger: "system: bubble-up on POST /hhg/shipments/{id}/reconcile-weight"
        actor: system
        preconditions:
          - "every Shipment with entitlement_id == this.id has weight_recon_status == RECONCILED or movement_status == CANCELLED"
          - "at least one Shipment with entitlement_id == this.id and movement_status != CANCELLED exists"
          - "excess_cost_due_usd == 0"
        side_effects:
          - "no further shipments may be created against this entitlement (ERR_ENTITLEMENT_NOT_AUTHORIZED)"
          - "bubble-up: the owning PcsOrder moves ISSUED|AMENDED -> CLOSED, so no further amendment is accepted (ERR_INVALID_ORDER_STATE)"

  - entity: MovingCompany
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: performance_score recompute after POST /hhg/claims/{id}/settle"
        actor: system
        preconditions:
          - "performance_score < TSP_PROBATION_SCORE (70.00) and performance_score >= TSP_SUSPENSION_SCORE (50.00)"
        side_effects:
          - "every CapacityBlock with tsp_id == this.id and status == OPEN moves OPEN -> RESTRICTED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: performance_score recompute after POST /hhg/claims/{id}/settle"
        actor: system
        preconditions:
          - "performance_score < TSP_SUSPENSION_SCORE (50.00)"
        side_effects:
          - "every CapacityBlock with tsp_id == this.id and status IN {OPEN, RESTRICTED} moves to CLOSED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: performance_score recompute after POST /hhg/claims/{id}/settle drops the score below 50.00 in one step"
        actor: system
        preconditions:
          - "performance_score < TSP_SUSPENSION_SCORE (50.00)"
        side_effects:
          - "every CapacityBlock with tsp_id == this.id and status IN {OPEN, RESTRICTED} moves to CLOSED"

  - entity: CapacityBlock
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: recompute after POST /hhg/capacity-blocks/{id}/awards or owning TSP entering PROBATION"
        actor: system
        preconditions:
          - "committed_lbs >= floor(total_capacity_lbs * 0.90) and committed_lbs < total_capacity_lbs, OR owning MovingCompany.status == PROBATION"
        side_effects:
          - "awards of shipments with is_short_notice == false are rejected with ERR_CAPACITY_BLOCK_NOT_OPEN while RESTRICTED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: recompute after POST /hhg/capacity-blocks/{id}/release-award or POST /hhg/shipments/{id}/cancel"
        actor: system
        preconditions:
          - "committed_lbs < floor(total_capacity_lbs * 0.90) and owning MovingCompany.status == ACTIVE"
        side_effects:
          - "general-pool awards accepted again"
      - from: RESTRICTED
        to: CLOSED
        trigger: "system: recompute after POST /hhg/capacity-blocks/{id}/awards or owning TSP entering SUSPENDED"
        actor: system
        preconditions:
          - "committed_lbs >= total_capacity_lbs OR owning MovingCompany.status == SUSPENDED"
        side_effects:
          - "all awards rejected with ERR_CAPACITY_BLOCK_NOT_OPEN"
      - from: CLOSED
        to: RESTRICTED
        trigger: "system: recompute after POST /hhg/capacity-blocks/{id}/release-award or POST /hhg/shipments/{id}/cancel"
        actor: system
        preconditions:
          - "committed_lbs < total_capacity_lbs and committed_lbs >= floor(total_capacity_lbs * 0.90) and owning MovingCompany.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "short-notice awards accepted again"

  - entity: Shipment
    initial_state: AWARDED
    terminal_states: [DELIVERED, CANCELLED, RECONCILED]
    transitions:
      # ---- dimension 1: movement_status ----
      - from: AWARDED
        to: ON_HOLD
        trigger: "system: owning EntitlementAuthorization moved AUTHORIZED -> SUSPENDED"
        actor: system
        preconditions:
          - "movement_status == AWARDED"
        side_effects:
          - "hold_reason set to 'ENTITLEMENT_SUSPENDED'"
        note: "dimension: movement_status"
      - from: ON_HOLD
        to: AWARDED
        trigger: "system: owning EntitlementAuthorization moved SUSPENDED -> AUTHORIZED"
        actor: system
        preconditions:
          - "movement_status == ON_HOLD"
        side_effects:
          - "hold_reason cleared to null"
        note: "dimension: movement_status"
      - from: AWARDED
        to: SURVEYED
        trigger: "POST /hhg/shipments/{id}/survey"
        actor: TspCoordinator
        preconditions:
          - "movement_status == AWARDED"
          - "weight_recon_status == PENDING"
          - "EntitlementAuthorization.status == AUTHORIZED"
          - "room_estimates array in the request body is non-empty"
        side_effects:
          - "survey_date, estimate_method, room_estimates stored"
          - "estimated_gross_lbs computed via calculations.survey_estimated_gross_weight"
          - "weight_recon_status moves PENDING -> ESTIMATED (parallel dimension)"
          - "billable_weight_lbs computed via calculations.shipment_billable_weight variant PROVISIONAL_ESTIMATED; billable_basis set to ESTIMATED"
          - "owning EntitlementAuthorization charged_billable_weight_lbs / excess_weight_lbs / gross_excess_cost_usd / excess_cost_due_usd recomputed"
        note: "dimension: movement_status (also advances the weight_recon dimension)"
      - from: SURVEYED
        to: PACKED
        trigger: "POST /hhg/shipments/{id}/pack"
        actor: TspCoordinator
        preconditions:
          - "movement_status == SURVEYED"
          - "EntitlementAuthorization.status == AUTHORIZED"
          - "capacity_block_id IS NOT NULL"
          - "pack_date in the request body is >= spread_start_date minus 1 day"
        side_effects:
          - "pack_date stored"
          - "creates one Notification with notification_type PACK_DATE_CONFIRMED, shipment_id == this.id, trigger_event_at == logical clock, status PENDING"
        note: "dimension: movement_status"
      - from: PACKED
        to: PICKED_UP
        trigger: "POST /hhg/shipments/{id}/pickup"
        actor: TspCoordinator
        preconditions:
          - "movement_status == PACKED"
          - "actual_pickup_date >= spread_start_date and actual_pickup_date <= spread_end_date (both inclusive)"
        side_effects:
          - "actual_pickup_date stored; required_delivery_by computed as actual_pickup_date + transit_days_allowed days"
          - "creates one Notification with notification_type PICKUP_CONFIRMED, status PENDING"
        note: "dimension: movement_status"
      - from: PICKED_UP
        to: IN_SIT
        trigger: "POST /hhg/sit-authorizations/{id}/authorize"
        actor: MoveCounselor
        preconditions:
          - "movement_status == PICKED_UP"
          - "the SitAuthorization being authorized has shipment_id == this.id and status == REQUESTED"
        side_effects:
          - "creates one Notification with notification_type SIT_ENTRY, status PENDING"
        note: "dimension: movement_status"
      - from: IN_SIT
        to: PICKED_UP
        trigger: "POST /hhg/sit-authorizations/{id}/release"
        actor: TspCoordinator
        preconditions:
          - "movement_status == IN_SIT"
          - "no other SitAuthorization with shipment_id == this.id has status == AUTHORIZED after this release"
        side_effects:
          - "SitAuthorization cost fields computed via calculations.sit_cost_assessment"
        note: "dimension: movement_status; cycle PICKED_UP -> IN_SIT -> PICKED_UP"
      - from: PICKED_UP
        to: DELIVERED
        trigger: "POST /hhg/shipments/{id}/deliver"
        actor: TspCoordinator
        preconditions:
          - "movement_status == PICKED_UP"
          - "weight_recon_status IN {ACTUAL_RECORDED, DISPUTED, RECONCILED}"
          - "delivery_date >= actual_pickup_date"
        side_effects:
          - "delivery_date stored"
        note: "dimension: movement_status; terminal for the movement dimension"
      - from: AWARDED
        to: CANCELLED
        trigger: "POST /hhg/shipments/{id}/cancel"
        actor: MoveCounselor | ServiceMember | ProgramAdmin
        preconditions:
          - "movement_status IN {AWARDED, ON_HOLD, SURVEYED, PACKED}"
        side_effects:
          - "cancel_reason stored"
          - "cascade link 1: owning EntitlementAuthorization charged_billable_weight_lbs / pro_gear_excluded_total_lbs / excess_weight_lbs / gross_excess_cost_usd / excess_cost_due_usd recomputed with this shipment excluded"
          - "cascade link 2 (caused by link 1 dropping this shipment from the capacity sums): when capacity_block_id IS NOT NULL, that CapacityBlock's committed_general_lbs / committed_short_notice_lbs / committed_lbs recomputed"
          - "cascade link 3 (caused by link 2): the CapacityBlock re-evaluates status — RESTRICTED -> OPEN when committed_lbs < floor(total_capacity_lbs * 0.90) and owning TSP is ACTIVE, CLOSED -> RESTRICTED when committed_lbs < total_capacity_lbs"
        note: "dimension: movement_status; also valid from ON_HOLD, SURVEYED and PACKED with identical side effects"
      # ---- dimension 2: weight_recon_status ----
      - from: PENDING
        to: ESTIMATED
        trigger: "POST /hhg/shipments/{id}/survey"
        actor: TspCoordinator
        preconditions:
          - "weight_recon_status == PENDING"
          - "movement_status == AWARDED"
        side_effects:
          - "billable_basis set to ESTIMATED and billable_weight_lbs set from the PROVISIONAL_ESTIMATED variant"
        note: "dimension: weight_recon_status"
      - from: ESTIMATED
        to: ACTUAL_RECORDED
        trigger: "POST /hhg/shipments/{id}/record-actual-weight"
        actor: TspCoordinator
        preconditions:
          - "weight_recon_status == ESTIMATED"
          - "movement_status IN {SURVEYED, PACKED, PICKED_UP, IN_SIT}"
          - "actual_tare_lbs < actual_gross_lbs"
        side_effects:
          - "actual_gross_lbs / actual_tare_lbs / weigh_date stored; net_actual_lbs and reweigh_required recomputed"
          - "cascade link 1: billable_weight_lbs recomputed via calculations.shipment_billable_weight variant FINAL_ACTUAL; billable_basis set to ACTUAL"
          - "cascade link 2 (caused by link 1): owning EntitlementAuthorization charged_billable_weight_lbs, excess_weight_lbs, gross_excess_cost_usd and excess_cost_due_usd recomputed"
          - "cascade link 3 (caused by link 2): when excess_cost_due_usd > 2500.00 and entitlement status == AUTHORIZED, entitlement moves AUTHORIZED -> SUSPENDED with suspension_reason 'EXCESS_COST_UNPAID'"
          - "cascade link 4 (caused by link 3): every sibling Shipment sharing that entitlement_id with movement_status == AWARDED moves AWARDED -> ON_HOLD with hold_reason 'ENTITLEMENT_SUSPENDED'"
          - "creates one Notification with notification_type WEIGHT_RECON_COMPLETE, status PENDING"
        note: "dimension: weight_recon_status; depth-4 cascade"
      - from: ACTUAL_RECORDED
        to: DISPUTED
        trigger: "POST /hhg/shipments/{id}/dispute-weight"
        actor: ServiceMember
        preconditions:
          - "weight_recon_status == ACTUAL_RECORDED"
          - "logical clock <= weigh_date + WEIGHT_DISPUTE_WINDOW_DAYS (45) days"
        side_effects:
          - "reweigh_required forced to true"
          - "no ledger change: charged_billable_weight_lbs still includes this shipment (DISPUTED is inside the ledger inclusion set)"
        note: "dimension: weight_recon_status"
      - from: DISPUTED
        to: ACTUAL_RECORDED
        trigger: "POST /hhg/shipments/{id}/reweigh"
        actor: TspCoordinator
        preconditions:
          - "weight_recon_status == DISPUTED"
        side_effects:
          - "actual_gross_lbs / actual_tare_lbs / weigh_date replaced with the reweigh values; net_actual_lbs recomputed"
          - "billable_weight_lbs recomputed via variant FINAL_ACTUAL"
          - "owning EntitlementAuthorization ledger fields recomputed; entitlement may move AUTHORIZED -> SUSPENDED or stay AUTHORIZED"
        note: "dimension: weight_recon_status; cycle ACTUAL_RECORDED -> DISPUTED -> ACTUAL_RECORDED"
      - from: ACTUAL_RECORDED
        to: RECONCILED
        trigger: "POST /hhg/shipments/{id}/reconcile-weight"
        actor: MoveCounselor
        preconditions:
          - "weight_recon_status == ACTUAL_RECORDED"
          - "movement_status == DELIVERED"
          - "owning EntitlementAuthorization.excess_cost_due_usd == 0"
        side_effects:
          - "ledger frozen for this shipment"
          - "bubble-up: when every Shipment of the entitlement is RECONCILED or CANCELLED and excess_cost_due_usd == 0, entitlement moves AUTHORIZED -> CLOSED"
        note: "dimension: weight_recon_status; terminal for the weight dimension"

  - entity: ProGearDeclaration
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, PARTIALLY_VERIFIED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /hhg/pro-gear-declarations/{id}/verify with verified_weight_lbs == claimed_weight_lbs"
        actor: MoveCounselor
        preconditions:
          - "status == SUBMITTED"
          - "documentation_type != NONE"
          - "verified_weight_lbs == claimed_weight_lbs"
          - "sum of verified_weight_lbs for the same shipment_id and owner (including this one) <= the owner's cap (MEMBER 2000, SPOUSE EntitlementAuthorization.pro_gear_spouse_allowance_lbs)"
        side_effects:
          - "verified_weight_lbs and verified_by_user_id stored"
          - "Shipment.pro_gear_excluded_lbs and billable_weight_lbs recomputed under the shipment's current billable_basis"
          - "owning EntitlementAuthorization charged_billable_weight_lbs / pro_gear_excluded_total_lbs / excess_weight_lbs / gross_excess_cost_usd / excess_cost_due_usd recomputed"
      - from: SUBMITTED
        to: PARTIALLY_VERIFIED
        trigger: "POST /hhg/pro-gear-declarations/{id}/verify with verified_weight_lbs < claimed_weight_lbs"
        actor: MoveCounselor
        preconditions:
          - "status == SUBMITTED"
          - "documentation_type != NONE"
          - "0 < verified_weight_lbs < claimed_weight_lbs"
        side_effects:
          - "identical recompute chain to SUBMITTED -> VERIFIED, using the reduced verified_weight_lbs"
        note: "Branch of the same trigger; the two branches differ only in the verified_weight_lbs comparison."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /hhg/pro-gear-declarations/{id}/reject"
        actor: MoveCounselor
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "rejection_reason and verified_by_user_id stored; verified_weight_lbs stays 0"
          - "Shipment.pro_gear_excluded_lbs and billable_weight_lbs recomputed (declaration contributes 0)"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /hhg/pro-gear-declarations/{id}/resubmit"
        actor: ServiceMember
        preconditions:
          - "status == REJECTED"
          - "resubmission_count < 2"
        side_effects:
          - "documentation_type and claimed_weight_lbs replaced with the resubmitted values"
          - "resubmission_count incremented by 1; rejection_reason cleared to null"
        note: "Revision loop SUBMITTED -> REJECTED -> SUBMITTED."

  - entity: SitAuthorization
    initial_state: REQUESTED
    terminal_states: [RELEASED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /hhg/sit-authorizations/{id}/authorize"
        actor: MoveCounselor
        preconditions:
          - "status == REQUESTED"
          - "Shipment.movement_status == PICKED_UP"
          - "authorized_days > 0 and authorized_days <= 90"
        side_effects:
          - "authorized_days stored; total_authorized_days recomputed"
          - "Shipment.movement_status moves PICKED_UP -> IN_SIT"
          - "creates one Notification with notification_type SIT_ENTRY, status PENDING"
      - from: AUTHORIZED
        to: AUTHORIZED
        trigger: "POST /hhg/sit-authorizations/{id}/extend"
        actor: MoveCounselor
        preconditions:
          - "status == AUTHORIZED"
          - "authorized_days + extension_days + extension_days_requested <= SIT_MAX_TOTAL_DAYS (90)"
        side_effects:
          - "extension_days increased by extension_days_requested; total_authorized_days recomputed"
        note: "Self-loop; the extension that would push total_authorized_days above 90 is rejected with ERR_SIT_MAX_DAYS_EXCEEDED."
      - from: AUTHORIZED
        to: RELEASED
        trigger: "POST /hhg/sit-authorizations/{id}/release"
        actor: TspCoordinator
        preconditions:
          - "status == AUTHORIZED"
          - "release_date > entry_date"
        side_effects:
          - "release_date stored; days_used and excess_days computed"
          - "sit_base_cost_usd, fuel_surcharge_pct, fuel_surcharge_usd, sit_total_cost_usd and member_liability_usd computed via calculations.sit_cost_assessment"
          - "Shipment.movement_status moves IN_SIT -> PICKED_UP"

  - entity: LossDamageClaim
    initial_state: DRAFT
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hhg/claims/{id}/submit"
        actor: ServiceMember
        preconditions:
          - "status == DRAFT"
          - "Shipment.movement_status == DELIVERED"
          - "item_count >= 1"
          - "notice_date <= Shipment.delivery_date + LOSS_NOTICE_WINDOW_DAYS (180) days"
          - "logical clock (filed_date) <= Shipment.delivery_date + CLAIM_WINDOW_DAYS (730) days"
        side_effects:
          - "filed_date set to the logical clock; filing_window_days computed"
          - "settlement_basis set to FULL_REPLACEMENT_VALUE when filing_window_days <= 270, otherwise DEPRECIATED_VALUE"
          - "claimed_total_usd recomputed as the sum of ClaimItem.replacement_cost_usd"
          - "creates one Notification with notification_type CLAIM_ACK, status PENDING"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /hhg/claims/{id}/review"
        actor: ClaimsExaminer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id set to X-User-ID"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /hhg/claims/{id}/request-info"
        actor: ClaimsExaminer
        preconditions:
          - "status == UNDER_REVIEW"
          - "info_request_count < CLAIM_INFO_REQUEST_LIMIT (3)"
        side_effects:
          - "info_request_count incremented by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /hhg/claims/{id}/provide-info"
        actor: ServiceMember
        preconditions:
          - "status == INFO_REQUESTED"
        side_effects:
          - "no counter change; the claim returns to examiner queue"
        note: "Cycle UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, bounded by info_request_count <= 3."
      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "POST /hhg/claims/{id}/settle"
        actor: ClaimsExaminer
        preconditions:
          - "status == UNDER_REVIEW"
          - "every ClaimItem of this claim has disposition != PENDING"
          - "X-User-ID != reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "settled_by_user_id set to X-User-ID"
          - "cascade link 1: ClaimItem.item_settlement_usd computed per item and settlement_total_usd computed via calculations.claim_settlement_valuation under settlement_basis"
          - "cascade link 2 (caused by link 1): the Shipment's MovingCompany settled_claim_count incremented, claim_settlement_total_usd increased by settlement_total_usd and performance_score recomputed via calculations.tsp_performance_score"
          - "cascade link 3 (caused by link 2): when performance_score < 70.00, MovingCompany.status moves ACTIVE -> PROBATION (or -> SUSPENDED when < 50.00)"
          - "cascade link 4 (caused by link 3): every CapacityBlock with tsp_id == that TSP and status == OPEN moves OPEN -> RESTRICTED (or -> CLOSED when the TSP became SUSPENDED)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /hhg/claims/{id}/deny"
        actor: ClaimsExaminer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "denial_reason stored; settlement_total_usd stays 0"
          - "no MovingCompany performance recompute (denied claims never touch performance_score)"
        note: "Branch: SETTLED and DENIED leave UNDER_REVIEW with disjoint side-effect sets."

  - entity: PpmSubmission
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /hhg/ppm-submissions/{id}/approve"
        actor: MoveCounselor
        preconditions:
          - "status == SUBMITTED"
          - "Shipment.movement_status == DELIVERED"
          - "every element of trip_tickets has certified == true and ticket_source == 'CERTIFIED_SCALE'"
        side_effects:
          - "approved_by_user_id set to X-User-ID"
          - "moved_weight_lbs, allowable_weight_lbs, gcc_usd, incentive_usd computed via calculations.ppm_reimbursement"
          - "applied_basis, reimbursement_usd, net_payable_usd, debt_owed_usd and taxable_amount_usd computed"
          - "owning EntitlementAuthorization charged_billable_weight_lbs increased by allowable_weight_lbs (the PPM shipment's billable_weight_lbs is set to allowable_weight_lbs, billable_basis ACTUAL, weight_recon_status ESTIMATED -> ACTUAL_RECORDED) and excess fields recomputed"

  - entity: Notification
    initial_state: PENDING
    terminal_states: [SENT, LATE]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /hhg/notifications/{id}/dispatch with logical clock <= due_by"
        actor: TspCoordinator | ProgramAdmin
        preconditions:
          - "status == PENDING"
          - "logical clock <= due_by (inclusive)"
        side_effects:
          - "sent_at set to the logical clock; channel stored; hours_late stays 0"
      - from: PENDING
        to: LATE
        trigger: "POST /hhg/notifications/{id}/dispatch with logical clock > due_by"
        actor: TspCoordinator | ProgramAdmin
        preconditions:
          - "status == PENDING"
          - "logical clock > due_by (strict)"
        side_effects:
          - "sent_at set to the logical clock; channel stored; hours_late computed as (sent_at - due_by) in hours rounded to 2 decimals"
        note: "Branch on a boundary: dispatch exactly at due_by yields SENT, one second later yields LATE."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version only)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: shipment-create-stale-entitlement
    parent_entity: EntitlementAuthorization
    write_endpoint: "POST /hhg/shipments"
    occ_field: "expected_entitlement_version"
    description: |
      Creating a Shipment against an EntitlementAuthorization whose version has advanced since the
      client last read it is rejected. A member may legitimately hold several shipments against one
      entitlement, so a second create is not blocked by any state precondition; the stale-version
      check is what forces the client to re-read the ledger (charged_billable_weight_lbs and
      excess_cost_due_usd move on every shipment create) before committing more weight.
    error_id: ERR_STALE_ENTITLEMENT_VERSION
    http_status: 412

  - rule_id: award-stale-capacity-block
    parent_entity: CapacityBlock
    write_endpoint: "POST /hhg/capacity-blocks/{id}/awards"
    occ_field: "expected_capacity_block_version"
    description: |
      Awarding a Shipment to a CapacityBlock whose version has advanced since the client last read
      it is rejected. Multiple shipments may legitimately be awarded to the same weekly block, so
      the second award is not blocked by a state precondition; the stale-version check forces the
      coordinator to re-read committed_general_lbs / committed_short_notice_lbs before consuming
      more of the pool.
    error_id: ERR_STALE_CAPACITY_BLOCK_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:
  - name: entitlement_weight_allowance
    trigger: >-
      on POST /hhg/counseling-sessions/{id}/complete (entitlement creation), on
      POST /hhg/entitlements/{id}/authorize (admin bump applied), and on POST /hhg/orders/{id}/amend
      (dependents / move_type change)
    algorithm: threshold
    formula: |
      # inputs: ServiceMember.rank_code, PcsOrder.dependents_count_at_issue,
      #         PcsOrder.is_dependent_restricted, PcsOrder.move_type,
      #         EntitlementAuthorization.admin_weight_bump_lbs
      tier = RANK_TIER_MAP[ServiceMember.rank_code]
      dep_effective = (PcsOrder.dependents_count_at_issue >= 1) and (PcsOrder.is_dependent_restricted == false)
      dependent_status_effective = "WITH_DEPENDENTS" if dep_effective else "WITHOUT_DEPENDENTS"
      raw = RANK_WEIGHT_TABLE[tier]["with" if dep_effective else "without"]

      # move_type modifier — evaluated AFTER the table lookup, in this exact order:
      if PcsOrder.move_type == "LOCAL":
          raw = floor(raw * LOCAL_MOVE_FACTOR)                     # 0.50
      elif PcsOrder.move_type in {"SEPARATION", "RETIREMENT"}:
          raw = min(raw, SEPARATION_CAP_LBS)                       # 13000
      # PCS_CONUS and PCS_OCONUS leave raw unchanged

      base_weight_allowance_lbs = raw
      pro_gear_member_allowance_lbs = PRO_GEAR_MEMBER_CAP_LBS      # 2000
      pro_gear_spouse_allowance_lbs = PRO_GEAR_SPOUSE_CAP_LBS if (dep_effective and ServiceMember.spouse_present) else 0
      total_billable_cap_lbs = base_weight_allowance_lbs + admin_weight_bump_lbs
    input_set: >-
      exactly one ServiceMember (via PcsOrder.service_member_id) and one PcsOrder; no shipment data
      participates. dependents_count_at_issue is the snapshot on PcsOrder, never the live
      ServiceMember.dependents_count.
    constants:
      RANK_TIER_MAP: "E1..E4->E1_E4; E5->E5; E6->E6; E7->E7; E8->E8; E9->E9; W1,O1->W1_O1; W2,O2->W2_O2; W3,O3->W3_O3; W4,O4->W4_O4; W5,O5->W5_O5; O6->O6"
      RANK_WEIGHT_TABLE: "E1_E4:{without:5000,with:8000}; E5:{without:7000,with:9000}; E6:{without:8000,with:11000}; E7:{without:11000,with:13000}; E8:{without:12000,with:14000}; E9:{without:13000,with:15000}; W1_O1:{without:10000,with:12000}; W2_O2:{without:12500,with:13500}; W3_O3:{without:13000,with:14500}; W4_O4:{without:14000,with:17000}; W5_O5:{without:16000,with:17500}; O6:{without:18000,with:18000}"
      LOCAL_MOVE_FACTOR: 0.50
      SEPARATION_CAP_LBS: 13000
      PRO_GEAR_MEMBER_CAP_LBS: 2000
      PRO_GEAR_SPOUSE_CAP_LBS: 500
    precision: "whole pounds; floor() used for the LOCAL modifier"

  - name: survey_estimated_gross_weight
    trigger: "on POST /hhg/shipments/{id}/survey"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER: convert-and-round EACH room line first, then sum, then uplift.
      # (Summing cube_feet first and multiplying once yields a different integer and is WRONG.)
      per_room_lbs[i] = round_half_up(room_estimates[i].cube_feet * LBS_PER_CUBIC_FOOT)   # 0 decimals
      raw_sum_lbs    = sum(per_room_lbs)                       # rooms processed in submitted array order
      uplift_lbs     = round_half_up(raw_sum_lbs * ACCESSORIAL_UPLIFT_PCT) if estimate_method == "CUBE_X7" else 0
      estimated_gross_lbs = raw_sum_lbs + uplift_lbs
    input_set: >-
      every element of the submitted room_estimates array; the array must be non-empty
      (ERR_SURVEY_ROOM_ESTIMATES_EMPTY). No previously stored survey data is reused — a survey may
      only be performed once per shipment (movement_status must be AWARDED).
    constants:
      LBS_PER_CUBIC_FOOT: 7
      ACCESSORIAL_UPLIFT_PCT: 0.05
    precision: "whole pounds, round_half_up at each of the two rounding points"

  - name: shipment_billable_weight
    trigger: >-
      on POST /hhg/shipments/{id}/survey, POST /hhg/shipments/{id}/record-actual-weight,
      POST /hhg/shipments/{id}/reweigh, POST /hhg/pro-gear-declarations/{id}/verify and
      POST /hhg/pro-gear-declarations/{id}/reject
    algorithm: threshold
    formula: |
      # step 1 — pro-gear exclusion, capped per owner
      member_verified = sum(ProGearDeclaration.verified_weight_lbs
                            where shipment_id == Shipment.id and owner == "MEMBER"
                            and status IN {VERIFIED, PARTIALLY_VERIFIED})
      spouse_verified = sum(... owner == "SPOUSE" ... same status filter)
      pro_gear_excluded_lbs = min(member_verified, EntitlementAuthorization.pro_gear_member_allowance_lbs)
                            + min(spouse_verified, EntitlementAuthorization.pro_gear_spouse_allowance_lbs)

      # step 2 — basis selection (the two variants below)
      if weight_recon_status == "ESTIMATED":
          billable_weight_lbs = max(0, estimated_gross_lbs - pro_gear_excluded_lbs); billable_basis = "ESTIMATED"
      elif weight_recon_status IN {"ACTUAL_RECORDED", "DISPUTED", "RECONCILED"}:
          net_actual_lbs      = actual_gross_lbs - actual_tare_lbs
          billable_weight_lbs = max(0, net_actual_lbs - pro_gear_excluded_lbs); billable_basis = "ACTUAL"
      else:
          billable_weight_lbs = 0; billable_basis = "NONE"

      reweigh_required = (net_actual_lbs > estimated_gross_lbs * REWEIGH_TRIGGER_RATIO)   # strict >
    input_set: >-
      all ProGearDeclaration rows of this shipment in status VERIFIED or PARTIALLY_VERIFIED
      (SUBMITTED and REJECTED contribute 0); the shipment's own estimated or actual weights.
    constants:
      REWEIGH_TRIGGER_RATIO: 1.10
    precision: "whole pounds; no rounding needed (all operands integral)"
    variants:
      - name: PROVISIONAL_ESTIMATED
        when: "weight_recon_status == ESTIMATED (survey done, certified scale weights not yet in)"
        difference: >-
          uses estimated_gross_lbs (survey cube x 7 plus 5% uplift) as the gross figure; the same
          household therefore charges a different number of pounds to the entitlement ledger than
          the ACTUAL basis produces.
      - name: FINAL_ACTUAL
        when: "weight_recon_status IN {ACTUAL_RECORDED, DISPUTED, RECONCILED}"
        difference: >-
          uses net_actual_lbs = actual_gross_lbs - actual_tare_lbs; replaces (never adds to) the
          provisional charge, so the entitlement ledger must be recomputed rather than incremented.

  - name: entitlement_excess_weight_and_cost
    trigger: >-
      on every ledger-touching event — POST /hhg/shipments (create), survey, record-actual-weight,
      reweigh, pro-gear verify/reject, shipment cancel, PPM approve, order amend, entitlement
      authorize, excess-cost-waivers and revoke-waiver
    algorithm: tiered_pricing
    formula: |
      # step 1 — ledger roll-up (order-insensitive sum; state filter is what matters)
      charged_billable_weight_lbs = sum(Shipment.billable_weight_lbs
            where entitlement_id == this.id
              and weight_recon_status IN {ESTIMATED, ACTUAL_RECORDED, DISPUTED, RECONCILED}
              and movement_status != "CANCELLED")
      pro_gear_excluded_total_lbs = sum(Shipment.pro_gear_excluded_lbs over the same set)

      # step 2 — excess pounds
      excess_weight_lbs = max(0, charged_billable_weight_lbs - total_billable_cap_lbs)

      # step 3 — tier selection on the RATIO (not on the pound count)
      pct_over = excess_weight_lbs / total_billable_cap_lbs        # unrounded float
      if   pct_over <= EXCESS_TIER_1_MAX_PCT:  rate = EXCESS_RATE_TIER_1   # <= 0.10 -> 62.50
      elif pct_over <= EXCESS_TIER_2_MAX_PCT:  rate = EXCESS_RATE_TIER_2   # <= 0.25 -> 78.00
      else:                                    rate = EXCESS_RATE_TIER_3   #         -> 94.50

      # step 4 — transport charge, then the administrative fee keyed on the TRANSPORT charge
      gross_transport_usd = round_half_up(excess_weight_lbs / 100 * rate, 2)
      admin_fee_usd = 0.00 if gross_transport_usd < ADMIN_FEE_THRESHOLD_USD \
                      else round_half_up(gross_transport_usd * ADMIN_FEE_PCT, 2)
      gross_excess_cost_usd = round_half_up(gross_transport_usd + admin_fee_usd, 2)

      # step 5 — waiver ledger (INVARIANT: due + waived == gross, always)
      excess_cost_due_usd = max(0.00, round_half_up(gross_excess_cost_usd - excess_cost_waived_usd, 2))
    input_set: >-
      shipments of this entitlement in weight_recon_status ESTIMATED, ACTUAL_RECORDED, DISPUTED or
      RECONCILED whose movement_status is not CANCELLED. Shipments in weight_recon_status PENDING
      and any CANCELLED shipment (regardless of weight status) are excluded. When the set is empty
      charged_billable_weight_lbs = 0, excess_weight_lbs = 0 and gross_excess_cost_usd = 0.00.
    constants:
      EXCESS_TIER_1_MAX_PCT: 0.10
      EXCESS_TIER_2_MAX_PCT: 0.25
      EXCESS_RATE_TIER_1: 62.50
      EXCESS_RATE_TIER_2: 78.00
      EXCESS_RATE_TIER_3: 94.50
      ADMIN_FEE_THRESHOLD_USD: 500.00
      ADMIN_FEE_PCT: 0.06
      EXCESS_SUSPEND_THRESHOLD_USD: 2500.00
    precision: "USD 2 decimal places, round_half_up; pounds are whole"

  - name: capacity_pool_allocation
    trigger: "on POST /hhg/capacity-blocks/{id}/awards and on POST /hhg/capacity-blocks/{id}/release-award"
    algorithm: waterfall_allocation
    formula: |
      effective_reserve_pct = max(short_notice_reserve_pct, PEAK_MIN_RESERVE_PCT) if peak_season
                              else short_notice_reserve_pct
      general_pool_lbs      = floor(total_capacity_lbs * (1 - effective_reserve_pct))
      short_notice_pool_lbs = total_capacity_lbs - general_pool_lbs

      w = Shipment.billable_weight_lbs                       # award requires billable_basis != NONE
      if Shipment.is_short_notice:
          # short-notice waterfall: reserve first, then spill into whatever the general pool has left
          remaining_total = total_capacity_lbs - committed_lbs
          reject ERR_CAPACITY_EXCEEDED when w > remaining_total          # strict >: w == remaining_total is ACCEPTED
          committed_short_notice_lbs += w
      else:
          remaining_general = general_pool_lbs - committed_general_lbs
          if w > remaining_general:                                       # strict >
              reject ERR_SHORT_NOTICE_RESERVE_PROTECTED when w <= (total_capacity_lbs - committed_lbs)
              reject ERR_CAPACITY_EXCEEDED otherwise
          committed_general_lbs += w
      committed_lbs = committed_general_lbs + committed_short_notice_lbs

      # status re-derivation, evaluated after every award / release / shipment cancel
      if   committed_lbs >= total_capacity_lbs or MovingCompany.status == "SUSPENDED": status = "CLOSED"
      elif committed_lbs >= floor(total_capacity_lbs * RESTRICT_UTILISATION_PCT) \
           or MovingCompany.status == "PROBATION":                                     status = "RESTRICTED"
      else:                                                                            status = "OPEN"

      # INVARIANT (capacity conservation): committed_lbs == sum(Shipment.billable_weight_lbs
      #   where capacity_block_id == block.id and movement_status != "CANCELLED")
    input_set: >-
      shipments with capacity_block_id == this block and movement_status != CANCELLED, partitioned by
      is_short_notice. Releasing an award (or cancelling the shipment) removes its weight from the
      same partition it was added to.
    constants:
      PEAK_MIN_RESERVE_PCT: 0.25
      RESTRICT_UTILISATION_PCT: 0.90
    precision: "whole pounds; floor() on both pool derivations"

  - name: spread_window_and_transit
    trigger: "on POST /hhg/shipments (create) for the window, on POST /hhg/shipments/{id}/pickup for required_delivery_by"
    algorithm: interval_merge
    formula: |
      days_to_pickup = floor((requested_pickup_date - booked_at) / 1 day)      # whole days, truncated
      is_short_notice = days_to_pickup < SHORT_NOTICE_DAYS                     # strict <
      peak_season     = requested_pickup_date is within [May 15, Sep 30] of its year (both inclusive)

      # PINNED PRECEDENCE: short notice wins over peak season when both hold
      if   is_short_notice: (before_days, after_days) = SPREAD_SHORT_NOTICE     # (0, 2)
      elif peak_season:     (before_days, after_days) = SPREAD_PEAK             # (2, 7)
      else:                 (before_days, after_days) = SPREAD_STANDARD         # (1, 4)

      spread_start_date = requested_pickup_date - before_days days
      spread_end_date   = requested_pickup_date + after_days days               # inclusive endpoint
      transit_days_allowed = max(MIN_TRANSIT_DAYS, ceil(PcsOrder.distance_miles / MILES_PER_TRANSIT_DAY)
                                                   + (PEAK_TRANSIT_ADD_DAYS if peak_season else 0))
      required_delivery_by = actual_pickup_date + transit_days_allowed days
    input_set: "one Shipment plus its PcsOrder.distance_miles; the logical clock supplies booked_at"
    constants:
      SHORT_NOTICE_DAYS: 5
      SPREAD_SHORT_NOTICE: "(0, 2)"
      SPREAD_PEAK: "(2, 7)"
      SPREAD_STANDARD: "(1, 4)"
      MILES_PER_TRANSIT_DAY: 300
      PEAK_TRANSIT_ADD_DAYS: 2
      MIN_TRANSIT_DAYS: 5
    precision: "whole days; pickup validity uses closed interval [spread_start_date, spread_end_date]"

  - name: sit_cost_assessment
    trigger: "on POST /hhg/sit-authorizations/{id}/release"
    algorithm: tiered_pricing
    formula: |
      days_used   = max(1, floor((release_date - entry_date) / 1 day))
      excess_days = max(0, days_used - total_authorized_days)
      first_tier_days = min(days_used, SIT_TIER_1_DAYS)          # 30
      extra_days      = max(0, days_used - SIT_TIER_1_DAYS)
      cwt = Shipment.billable_weight_lbs / 100                    # NOT rounded

      # EVALUATION ORDER IS PINNED (steps 1..4). The fuel surcharge tier is keyed on
      # sit_base_cost_usd (the pre-surcharge figure), NOT on sit_total_cost_usd — otherwise the
      # definition would be circular (total = base + surcharge(total)).
      handling_usd    = round_half_up(cwt * SIT_HANDLING_RATE_PER_CWT, 2)          # step 1
      daily_1_30_usd  = round_half_up(cwt * SIT_DAILY_RATE_FIRST_30 * first_tier_days, 2)
      daily_31p_usd   = round_half_up(cwt * SIT_DAILY_RATE_AFTER_30 * extra_days, 2)
      sit_base_cost_usd = round_half_up(handling_usd + daily_1_30_usd + daily_31p_usd, 2)   # step 2

      if   sit_base_cost_usd <  FUEL_TIER_1_MAX_USD: fuel_surcharge_pct = FUEL_PCT_TIER_1  # < 1000 -> 0.045
      elif sit_base_cost_usd <  FUEL_TIER_2_MAX_USD: fuel_surcharge_pct = FUEL_PCT_TIER_2  # < 5000 -> 0.062
      else:                                          fuel_surcharge_pct = FUEL_PCT_TIER_3  # >= 5000 -> 0.071
      fuel_surcharge_usd = round_half_up(sit_base_cost_usd * fuel_surcharge_pct, 2)         # step 3
      sit_total_cost_usd = round_half_up(sit_base_cost_usd + fuel_surcharge_usd, 2)         # step 4

      member_liability_usd = 0.00 if excess_days == 0 \
                             else round_half_up(sit_total_cost_usd * excess_days / days_used, 2)
    input_set: >-
      exactly one SitAuthorization in status AUTHORIZED plus its Shipment's current
      billable_weight_lbs (whatever basis is in force at release time).
    constants:
      SIT_TIER_1_DAYS: 30
      SIT_HANDLING_RATE_PER_CWT: 68.40
      SIT_DAILY_RATE_FIRST_30: 1.05
      SIT_DAILY_RATE_AFTER_30: 1.62
      FUEL_TIER_1_MAX_USD: 1000.00
      FUEL_TIER_2_MAX_USD: 5000.00
      FUEL_PCT_TIER_1: 0.045
      FUEL_PCT_TIER_2: 0.062
      FUEL_PCT_TIER_3: 0.071
    precision: "USD 2 decimal places, round_half_up at every step listed above"

  - name: claim_settlement_valuation
    trigger: "on POST /hhg/claims/{id}/settle"
    algorithm: weighted_scoring
    formula: |
      # PINNED ROUNDING ORDER: round EACH item to cents, then sum, then apply the per-claim cap.
      for each ClaimItem of the claim, processed in created_at ASC order:
          if disposition == "DENIED": item_settlement_usd = 0.00; continue
          eff_cost = replacement_cost_usd
          if replacement_cost_usd >= HIGH_VALUE_THRESHOLD_USD and high_value_inventory_documented == false:
              eff_cost = HIGH_VALUE_UNDOCUMENTED_CAP_USD                    # 5000.00
          if claim.settlement_basis == "FULL_REPLACEMENT_VALUE":
              item_settlement_usd = round_half_up(eff_cost, 2)
          else:   # DEPRECIATED_VALUE
              depreciation_rate_pct_per_year = CATEGORY_DEPRECIATION_PCT[category]
              factor = max(1 - depreciation_rate_pct_per_year * age_years, MIN_RESIDUAL_FACTOR)
              item_settlement_usd = round_half_up(eff_cost * factor, 2)
      settlement_total_usd = min(round_half_up(sum(item_settlement_usd), 2), MAX_CLAIM_PAYOUT_USD)
    input_set: >-
      every ClaimItem with claim_id == this claim; items with disposition DENIED settle at 0.00 but
      still count in item_count. Settlement may only run when no item is still PENDING.
    constants:
      CATEGORY_DEPRECIATION_PCT: "ELECTRONICS:0.10; FURNITURE:0.05; APPLIANCE:0.07; CLOTHING:0.20; OTHER:0.06"
      MIN_RESIDUAL_FACTOR: 0.20
      HIGH_VALUE_THRESHOLD_USD: 5000.00
      HIGH_VALUE_UNDOCUMENTED_CAP_USD: 5000.00
      MAX_CLAIM_PAYOUT_USD: 100000.00
      FRV_WINDOW_DAYS: 270
      CLAIM_WINDOW_DAYS: 730
    precision: "USD 2 decimal places, round_half_up; per-item rounding precedes summation"
    variants:
      - name: FULL_REPLACEMENT_VALUE
        when: "filing_window_days <= 270 (filed within 9 months of delivery, boundary inclusive)"
        difference: >-
          pays the full replacement cost of each allowed item with no age depreciation; identical
          items therefore settle strictly higher than under DEPRECIATED_VALUE whenever age_years > 0.
      - name: DEPRECIATED_VALUE
        when: "270 < filing_window_days <= 730"
        difference: >-
          multiplies each allowed item by max(1 - category_rate * age_years, 0.20) before rounding,
          so the same item set produces a different total from the same stored data.

  - name: ppm_reimbursement
    trigger: "on POST /hhg/ppm-submissions/{id}/approve"
    algorithm: forward_looking
    formula: |
      # step 1 — weight from certified ticket pairs, trips processed in trip_number ASC order
      for each ticket in trip_tickets ordered by trip_number ASC:
          net_i = ticket.full_lbs - ticket.empty_lbs
          reject ERR_WEIGHT_TICKET_PAIR_INCOMPLETE when net_i <= 0
      moved_weight_lbs = sum(net_i)

      # step 2 — entitlement room left for this shipment (this shipment's own charge excluded)
      other_charged = sum(Shipment.billable_weight_lbs where entitlement_id == e.id
                          and id != this.shipment_id
                          and weight_recon_status IN {ESTIMATED, ACTUAL_RECORDED, DISPUTED, RECONCILED}
                          and movement_status != "CANCELLED")
      allowable_weight_lbs = min(moved_weight_lbs, max(0, e.total_billable_cap_lbs - other_charged))

      # step 3 — government constructed cost and the two reimbursement bases
      gcc_usd = round_half_up(allowable_weight_lbs / 100
                              * (GCC_BASE_RATE_PER_CWT + GCC_RATE_PER_CWT_PER_100MI
                                 * (PcsOrder.distance_miles / 100)), 2)
      incentive_amount = round_half_up(gcc_usd * PPM_INCENTIVE_PCT, 2)          # 0.95
      expense_amount   = min(documented_expenses_usd, gcc_usd)                  # receipts reimbursed up to 100% GCC

      # step 4 — basis selection; AUTO takes the greater amount, tie goes to INCENTIVE_BASIS
      if elected_basis == "AUTO":
          applied_basis = "INCENTIVE_BASIS" if incentive_amount >= expense_amount else "ACTUAL_EXPENSE_BASIS"
      else:
          applied_basis = elected_basis
      reimbursement_usd = incentive_amount if applied_basis == "INCENTIVE_BASIS" else expense_amount

      # step 5 — settlement against the advance (INVARIANT: net_payable - debt == reimbursement - advance)
      net_payable_usd = max(0.00, round_half_up(reimbursement_usd - advance_paid_usd, 2))
      debt_owed_usd   = max(0.00, round_half_up(advance_paid_usd - reimbursement_usd, 2))
      taxable_amount_usd = max(0.00, round_half_up(reimbursement_usd - documented_expenses_usd, 2)) \
                           if applied_basis == "INCENTIVE_BASIS" else 0.00
    input_set: >-
      the submission's own trip_tickets array, the owning entitlement's cap minus the charge of every
      OTHER non-cancelled shipment in the ledger inclusion set, and PcsOrder.distance_miles.
    constants:
      GCC_BASE_RATE_PER_CWT: 42.75
      GCC_RATE_PER_CWT_PER_100MI: 3.85
      PPM_INCENTIVE_PCT: 0.95
    precision: "USD 2 decimal places, round_half_up; pounds whole"
    variants:
      - name: INCENTIVE_BASIS
        when: "elected_basis == INCENTIVE_BASIS, or AUTO with incentive_amount >= expense_amount"
        difference: >-
          pays 95% of the government constructed cost regardless of receipts and makes the excess of
          reimbursement over documented expenses taxable.
      - name: ACTUAL_EXPENSE_BASIS
        when: "elected_basis == ACTUAL_EXPENSE_BASIS, or AUTO with expense_amount > incentive_amount"
        difference: >-
          pays documented receipts capped at 100% of the government constructed cost and produces
          taxable_amount_usd == 0.00 — the same submission therefore yields a different payable.

  - name: notification_sla_due
    trigger: "on Notification creation (system) and on POST /hhg/notifications/{id}/dispatch"
    algorithm: threshold
    formula: |
      sla_hours = NOTIFICATION_SLA_HOURS[notification_type]
      due_by    = trigger_event_at + sla_hours hours
      # at dispatch:
      status      = "SENT" if logical_clock <= due_by else "LATE"        # boundary inclusive -> SENT
      hours_late  = 0.00 if logical_clock <= due_by
                    else round_half_up((logical_clock - due_by) / 3600 seconds, 2)
    input_set: "one Notification row; the logical clock supplies sent_at"
    constants:
      NOTIFICATION_SLA_HOURS: "PACK_DATE_CONFIRMED:72; PICKUP_CONFIRMED:24; SIT_ENTRY:24; WEIGHT_RECON_COMPLETE:168; CLAIM_ACK:120"
    precision: "hours_late 2 decimal places, round_half_up"

  - name: tsp_performance_score
    trigger: "on POST /hhg/claims/{id}/settle (cascade link 2)"
    algorithm: decay_function
    formula: |
      settled_claim_count       = count(LossDamageClaim where status == "SETTLED"
                                        and Shipment.tsp_id == this MovingCompany.id)
      claim_settlement_total_usd = sum(LossDamageClaim.settlement_total_usd over the same set)
      performance_score = max(0.00, round_half_up(100.00
                                    - settled_claim_count * CLAIM_COUNT_PENALTY
                                    - claim_settlement_total_usd / SETTLEMENT_PENALTY_DIVISOR, 2))
      # status thresholds re-derived immediately after the score:
      #   score <  50.00 -> SUSPENDED ; 50.00 <= score < 70.00 -> PROBATION ; else ACTIVE
    input_set: >-
      claims in status SETTLED only; DENIED, DRAFT, SUBMITTED, UNDER_REVIEW and INFO_REQUESTED claims
      never affect the score.
    constants:
      CLAIM_COUNT_PENALTY: 5.00
      SETTLEMENT_PENALTY_DIVISOR: 500.00
      TSP_PROBATION_SCORE: 70.00
      TSP_SUSPENSION_SCORE: 50.00
    precision: "2 decimal places, round_half_up, floored at 0.00"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared §1.7 role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: >-
      request body parses, no unknown enum value, no negative weight/money/day field, required
      fields present, arrays well formed (room_estimates entries carry room_name + cube_feet,
      trip_tickets entries carry trip_number + full_lbs + empty_lbs + ticket_source + certified)
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every {id} path segment resolves, left to right"
    error_id: "ERR_SERVICE_MEMBER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_COUNSELING_SESSION_NOT_FOUND | ERR_ENTITLEMENT_NOT_FOUND | ERR_TSP_NOT_FOUND | ERR_CAPACITY_BLOCK_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_PRO_GEAR_DECLARATION_NOT_FOUND | ERR_SIT_AUTHORIZATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CLAIM_ITEM_NOT_FOUND | ERR_PPM_SUBMISSION_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: >-
      every foreign key in the request body resolves, checked in declared field order
      (service_member_id, order_id, entitlement_id, tsp_id, shipment_id, superseded_shipment_id)
    error_id: "ERR_SERVICE_MEMBER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ENTITLEMENT_NOT_FOUND | ERR_TSP_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /hhg/orders, POST /hhg/counseling-sessions, POST /hhg/capacity-blocks, POST /hhg/shipments, POST /hhg/capacity-blocks/{id}/awards, POST /hhg/capacity-blocks/{id}/release-award"
  - priority: 6
    category: auth
    check: >-
      when X-User-Role == ServiceMember, X-User-ID equals the ServiceMember.id reachable from the
      target resource (shipment -> order -> service_member_id, claim -> shipment -> order -> ...)
    error_id: ERR_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "every ServiceMember-permitted endpoint"
  - priority: 7
    category: auth
    check: "X-User-ID on POST /hhg/claims/{id}/settle differs from LossDamageClaim.reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hhg/claims/{id}/settle"
  - priority: 8
    category: auth
    check: "X-User-ID on POST /hhg/entitlements/{id}/excess-cost-waivers differs from EntitlementAuthorization.authorized_by_user_id"
    error_id: ERR_WAIVER_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /hhg/entitlements/{id}/excess-cost-waivers"
  - priority: 9
    category: state
    check: "PcsOrder.status IN {ISSUED, AMENDED} — a CLOSED order (its entitlement reconciled and closed) can no longer be amended"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /hhg/orders/{id}/amend"
  - priority: 10
    category: state
    check: "CounselingSession.status == SCHEDULED"
    error_id: ERR_INVALID_COUNSELING_STATE
    http_status: 409
    applies_to: "POST /hhg/counseling-sessions/{id}/complete"
  - priority: 11
    category: state
    check: >-
      EntitlementAuthorization.status matches the transition source (authorize needs DRAFT,
      resume needs SUSPENDED, waiver / revoke-waiver need AUTHORIZED or SUSPENDED)
    error_id: ERR_INVALID_ENTITLEMENT_STATE
    http_status: 409
    applies_to: "POST /hhg/entitlements/{id}/authorize, POST /hhg/entitlements/{id}/resume, POST /hhg/entitlements/{id}/excess-cost-waivers, POST /hhg/entitlements/{id}/revoke-waiver"
  - priority: 12
    category: state
    check: >-
      Shipment.movement_status matches the transition source (survey needs AWARDED, pack needs
      SURVEYED, pickup needs PACKED, deliver needs PICKED_UP, cancel needs one of
      AWARDED/ON_HOLD/SURVEYED/PACKED, awards needs one of AWARDED/SURVEYED — capacity is booked
      either side of the pre-move survey but never after packing)
    error_id: ERR_INVALID_SHIPMENT_MOVEMENT_STATE
    http_status: 409
    applies_to: "POST /hhg/shipments/{id}/survey, /pack, /pickup, /deliver, /cancel, POST /hhg/capacity-blocks/{id}/awards"
  - priority: 13
    category: state
    check: >-
      Shipment.weight_recon_status matches the transition source (record-actual-weight needs
      ESTIMATED, dispute-weight needs ACTUAL_RECORDED, reweigh needs DISPUTED, reconcile-weight
      needs ACTUAL_RECORDED)
    error_id: ERR_INVALID_WEIGHT_RECON_STATE
    http_status: 409
    applies_to: "POST /hhg/shipments/{id}/record-actual-weight, /dispute-weight, /reweigh, /reconcile-weight"
  - priority: 14
    category: state
    check: "ProGearDeclaration.status == SUBMITTED for verify/reject, == REJECTED for resubmit"
    error_id: ERR_INVALID_PRO_GEAR_STATE
    http_status: 409
    applies_to: "POST /hhg/pro-gear-declarations/{id}/verify, /reject, /resubmit"
  - priority: 15
    category: state
    check: "SitAuthorization.status == REQUESTED for authorize, == AUTHORIZED for extend and release"
    error_id: ERR_INVALID_SIT_STATE
    http_status: 409
    applies_to: "POST /hhg/sit-authorizations/{id}/authorize, /extend, /release"
  - priority: 16
    category: state
    check: >-
      LossDamageClaim.status matches the transition source (claim-items and submit need DRAFT,
      review needs SUBMITTED, request-info / settle / deny need UNDER_REVIEW, provide-info needs
      INFO_REQUESTED, claim-item disposition needs the parent claim in UNDER_REVIEW)
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /hhg/claims/{id}/claim-items, /submit, /review, /request-info, /provide-info, /settle, /deny, POST /hhg/claim-items/{id}/disposition"
  - priority: 17
    category: state
    check: "PpmSubmission.status == SUBMITTED"
    error_id: ERR_INVALID_PPM_STATE
    http_status: 409
    applies_to: "POST /hhg/ppm-submissions/{id}/approve"
  - priority: 18
    category: state
    check: "Notification.status == PENDING"
    error_id: ERR_INVALID_NOTIFICATION_STATE
    http_status: 409
    applies_to: "POST /hhg/notifications/{id}/dispatch"
  - priority: 20
    category: state
    check: >-
      EntitlementAuthorization.status is neither DRAFT nor CLOSED — a ledger that was never
      authorized, or already closed, cannot take shipment work (status SUSPENDED is owned by
      priority 21 below, so exactly one of the two errors can fire)
    error_id: ERR_ENTITLEMENT_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /hhg/shipments, POST /hhg/shipments/{id}/survey, POST /hhg/shipments/{id}/pack"
  - priority: 21
    category: state
    check: "EntitlementAuthorization.status != SUSPENDED (a suspended ledger blocks new commitments)"
    error_id: ERR_ENTITLEMENT_SUSPENDED
    http_status: 409
    applies_to: "POST /hhg/shipments, POST /hhg/capacity-blocks/{id}/awards"
  - priority: 22
    category: state
    check: "Shipment.movement_status == DELIVERED before any loss/damage claim may be filed"
    error_id: ERR_SHIPMENT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /hhg/shipments/{id}/claims, POST /hhg/claims/{id}/submit"
  - priority: 23
    category: state
    check: "Shipment.capacity_block_id IS NOT NULL (the shipment holds a weekly capacity slot)"
    error_id: ERR_CAPACITY_BLOCK_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /hhg/shipments/{id}/pack"
  - priority: 24
    category: business_constraint
    check: "expected_entitlement_version equals the current EntitlementAuthorization.version"
    error_id: ERR_STALE_ENTITLEMENT_VERSION
    http_status: 412
    applies_to: "POST /hhg/shipments"
  - priority: 25
    category: business_constraint
    check: "expected_capacity_block_version equals the current CapacityBlock.version"
    error_id: ERR_STALE_CAPACITY_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /hhg/capacity-blocks/{id}/awards"
  - priority: 26
    category: business_referential
    check: "MovingCompany.status == ACTIVE or PROBATION (a SUSPENDED TSP takes no new work)"
    error_id: ERR_TSP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /hhg/shipments, POST /hhg/capacity-blocks/{id}/awards"
  - priority: 27
    category: business_referential
    check: >-
      the shipment's origin_market_code appears in the TSP's markets array and equals the
      CapacityBlock.market_code
    error_id: ERR_MARKET_NOT_SERVED
    http_status: 409
    applies_to: "POST /hhg/shipments, POST /hhg/capacity-blocks, POST /hhg/capacity-blocks/{id}/awards"
  - priority: 28
    category: business_referential
    check: "the awarded Shipment.tsp_id equals the CapacityBlock.tsp_id"
    error_id: ERR_SHIPMENT_TSP_MISMATCH
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks/{id}/awards, POST /hhg/capacity-blocks/{id}/release-award"
  - priority: 29
    category: business_safety
    check: "ProGearDeclaration.documentation_type != NONE before any weight may be verified"
    error_id: ERR_PRO_GEAR_DOCUMENTATION_REQUIRED
    http_status: 422
    applies_to: "POST /hhg/pro-gear-declarations/{id}/verify"
  - priority: 30
    category: business_safety
    check: >-
      verified_weight_lbs <= claimed_weight_lbs, and the owner's running verified total stays within
      the entitlement's pro-gear allowance for that owner (2000 member / 500 spouse)
    error_id: ERR_PRO_GEAR_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /hhg/pro-gear-declarations/{id}/verify"
  - priority: 31
    category: business_safety
    check: "scale_certified == true on any weight-of-record submission"
    error_id: ERR_UNCERTIFIED_SCALE
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/record-actual-weight, POST /hhg/shipments/{id}/reweigh"
  - priority: 32
    category: business_temporal
    check: "notice_date <= Shipment.delivery_date + 180 days (loss/damage notice window)"
    error_id: ERR_LOSS_NOTICE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/claims"
  - priority: 33
    category: business_temporal
    check: "logical clock <= Shipment.delivery_date + 730 days at filing time"
    error_id: ERR_CLAIM_FILING_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /hhg/claims/{id}/submit"
  - priority: 34
    category: business_temporal
    check: "logical clock <= Shipment.weigh_date + 45 days"
    error_id: ERR_WEIGHT_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/dispute-weight"
  - priority: 35
    category: business_temporal
    check: "spread_start_date <= actual_pickup_date <= spread_end_date (both endpoints inclusive)"
    error_id: ERR_PICKUP_OUTSIDE_SPREAD
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/pickup"
  - priority: 36
    category: business_temporal
    check: "pack_date >= spread_start_date - 1 day"
    error_id: ERR_PACK_BEFORE_SPREAD
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/pack"
  - priority: 37
    category: business_temporal
    check: "SitAuthorization.entry_date >= Shipment.actual_pickup_date"
    error_id: ERR_SIT_ENTRY_BEFORE_PICKUP
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/sit-authorizations"
  - priority: 38
    category: business_temporal
    check: "delivery_date >= Shipment.actual_pickup_date"
    error_id: ERR_DELIVERY_BEFORE_PICKUP
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/deliver"
  - priority: 39
    category: business_temporal
    check: "release_date >= SitAuthorization.entry_date"
    error_id: ERR_RELEASE_BEFORE_ENTRY
    http_status: 422
    applies_to: "POST /hhg/sit-authorizations/{id}/release"
  - priority: 40
    category: business_temporal
    check: >-
      the requested SIT day range [entry_date, entry_date + requested_days] must not overlap and
      must not touch any existing non-RELEASED SitAuthorization range of the same shipment — the
      ranges are INCLUSIVE on both ends and a mandatory one-day gap is required between periods
    error_id: ERR_SIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /hhg/shipments/{id}/sit-authorizations"
  - priority: 41
    category: business_constraint
    check: >-
      the new CapacityBlock week [week_start_date, week_start_date + 7 days) must not overlap any
      existing block of the same tsp_id + market_code — intervals are HALF-OPEN, so a block starting
      exactly on another's week_end_date is legal
    error_id: ERR_CAPACITY_BLOCK_OVERLAP
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks"
  - priority: 42
    category: business_constraint
    check: "authorized_days + extension_days <= 90 (total storage-in-transit entitlement)"
    error_id: ERR_SIT_MAX_DAYS_EXCEEDED
    http_status: 422
    applies_to: "POST /hhg/sit-authorizations/{id}/authorize, POST /hhg/sit-authorizations/{id}/extend"
  - priority: 43
    category: business_constraint
    check: "the claim has at least one ClaimItem before submission"
    error_id: ERR_CLAIM_ITEM_REQUIRED
    http_status: 422
    applies_to: "POST /hhg/claims/{id}/submit"
  - priority: 44
    category: business_constraint
    check: "no ClaimItem of the claim is still in disposition PENDING"
    error_id: ERR_CLAIM_ITEM_PENDING
    http_status: 409
    applies_to: "POST /hhg/claims/{id}/settle"
  - priority: 45
    category: business_constraint
    check: "room_estimates array is non-empty"
    error_id: ERR_SURVEY_ROOM_ESTIMATES_EMPTY
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/survey"
  - priority: 46
    category: business_constraint
    check: "LossDamageClaim.info_request_count < 3"
    error_id: ERR_CLAIM_INFO_REQUEST_LIMIT
    http_status: 409
    applies_to: "POST /hhg/claims/{id}/request-info"
  - priority: 47
    category: business_constraint
    check: "PcsOrder.amendment_count < 3"
    error_id: ERR_ORDER_AMENDMENT_LIMIT
    http_status: 409
    applies_to: "POST /hhg/orders/{id}/amend"
  - priority: 48
    category: business_constraint
    check: "ProGearDeclaration.resubmission_count < 2"
    error_id: ERR_PRO_GEAR_RESUBMISSION_LIMIT
    http_status: 409
    applies_to: "POST /hhg/pro-gear-declarations/{id}/resubmit"
  - priority: 49
    category: business_constraint
    check: "dod_id is unique across ServiceMember"
    error_id: ERR_DUPLICATE_DOD_ID
    http_status: 409
    applies_to: "POST /hhg/service-members"
  - priority: 50
    category: business_constraint
    check: "order_number is unique across PcsOrder"
    error_id: ERR_DUPLICATE_ORDER_NUMBER
    http_status: 409
    applies_to: "POST /hhg/orders"
  - priority: 51
    category: business_constraint
    check: "at most one EntitlementAuthorization per PcsOrder"
    error_id: ERR_DUPLICATE_ENTITLEMENT
    http_status: 409
    applies_to: "POST /hhg/counseling-sessions/{id}/complete"
  - priority: 52
    category: business_constraint
    check: "Shipment.shipment_method == PPM before a personally procured move submission is accepted"
    error_id: ERR_PPM_METHOD_REQUIRED
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/ppm-submissions"
  - priority: 53
    category: business_constraint
    check: >-
      every trip ticket has full_lbs > empty_lbs, certified == true and a non-empty ticket_source;
      the trip_tickets array is non-empty
    error_id: ERR_WEIGHT_TICKET_PAIR_INCOMPLETE
    http_status: 422
    applies_to: "POST /hhg/shipments/{id}/ppm-submissions, POST /hhg/ppm-submissions/{id}/approve"
  - priority: 54
    category: business_constraint
    check: >-
      CapacityBlock.status == OPEN, or status == RESTRICTED with an is_short_notice shipment;
      CLOSED accepts nothing
    error_id: ERR_CAPACITY_BLOCK_NOT_OPEN
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks/{id}/awards"
  - priority: 55
    category: business_constraint
    check: "Shipment.billable_basis != NONE (a surveyed or weighed shipment is required to award capacity)"
    error_id: ERR_WEIGHT_BASIS_MISSING
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks/{id}/awards"
  - priority: 56
    category: business_constraint
    check: >-
      a non-short-notice shipment's billable_weight_lbs fits in the general pool remainder; when it
      would only fit by eating into the short-notice reserve the award is refused
    error_id: ERR_SHORT_NOTICE_RESERVE_PROTECTED
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks/{id}/awards"
  - priority: 57
    category: business_constraint
    check: "the shipment currently holds an award on this CapacityBlock"
    error_id: ERR_AWARD_NOT_FOUND
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks/{id}/release-award"
  - priority: 58
    category: business_fiscal
    check: >-
      billable_weight_lbs <= remaining capacity of the applicable pool (strict > is the rejection
      condition, so an award that exactly fills the pool is accepted)
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /hhg/capacity-blocks/{id}/awards"
  - priority: 59
    category: business_fiscal
    check: "EntitlementAuthorization.excess_cost_due_usd == 0.00"
    error_id: ERR_EXCESS_COST_UNPAID
    http_status: 409
    applies_to: "POST /hhg/shipments/{id}/reconcile-weight, POST /hhg/entitlements/{id}/resume"
  - priority: 60
    category: business_fiscal
    check: "waived_amount_usd <= excess_cost_due_usd"
    error_id: ERR_WAIVER_EXCEEDS_DUE
    http_status: 422
    applies_to: "POST /hhg/entitlements/{id}/excess-cost-waivers"
  - priority: 61
    category: business_fiscal
    check: "excess_cost_waived_usd > 0.00"
    error_id: ERR_NO_WAIVER_TO_REVOKE
    http_status: 409
    applies_to: "POST /hhg/entitlements/{id}/revoke-waiver"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:
  # ---- ServiceMember ----
  - method: POST
    path: "/hhg/service-members"
    description: "Register a service member eligible for a household goods move."
    roles: [MoveCounselor, ProgramAdmin]
    code: 201
    input: [dod_id, full_name, rank_code, branch, email, "dependents_count?", "spouse_present?"]
    output: ServiceMember
    side_effects: ["active_shipment_count initialised to 0"]
  - method: GET
    path: "/hhg/service-members/{id}"
    description: "Read one service member."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: []
    output: ServiceMember
    side_effects: []
  - method: GET
    path: "/hhg/service-members/{id}/orders"
    description: "List the PCS orders issued to a member (FK reverse-reachability for PcsOrder.service_member_id)."
    roles: [ServiceMember, MoveCounselor, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: ["move_type?", "status?"]
    output: PcsOrder[]
    side_effects: []

  # ---- PcsOrder ----
  - method: POST
    path: "/hhg/orders"
    description: "Issue PCS orders for a member."
    roles: [MoveCounselor, ProgramAdmin]
    code: 201
    input: [service_member_id, order_number, move_type, issue_date, report_no_later_than_date, origin_duty_station, destination_duty_station, origin_market_code, distance_miles, "is_dependent_restricted?"]
    output: PcsOrder
    side_effects: ["dependents_count_at_issue snapshotted from ServiceMember.dependents_count", "status set to ISSUED"]
  - method: GET
    path: "/hhg/orders/{id}"
    description: "Read one PCS order."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: []
    output: PcsOrder
    side_effects: []
  - method: POST
    path: "/hhg/orders/{id}/amend"
    description: "Amend issued orders (dependents, report date or move type); drives the depth-4 entitlement cascade."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: [amendment_reason, "dependents_count_override?", "report_no_later_than_date_override?", "move_type_override?"]
    output: PcsOrder
    side_effects: ["status -> AMENDED; amendment_count incremented", "entitlement allowance and excess cost recomputed", "entitlement may suspend and place AWARDED shipments ON_HOLD"]
  - method: GET
    path: "/hhg/orders/{id}/counseling-sessions"
    description: "List counseling sessions of an order (FK reverse-reachability for CounselingSession.order_id)."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: ["status?"]
    output: CounselingSession[]
    side_effects: []
  - method: GET
    path: "/hhg/orders/{id}/entitlements"
    description: "List entitlement authorizations of an order (FK reverse-reachability for EntitlementAuthorization.order_id)."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: ["status?"]
    output: EntitlementAuthorization[]
    side_effects: []
  - method: GET
    path: "/hhg/orders/{id}/shipments"
    description: "List shipments of an order (FK reverse-reachability for Shipment.order_id)."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["movement_status?"]
    output: Shipment[]
    side_effects: []

  # ---- CounselingSession ----
  - method: POST
    path: "/hhg/counseling-sessions"
    description: "Book a counseling appointment against orders; counseling_deadline_at is derived from the report date."
    roles: [MoveCounselor, ProgramAdmin]
    code: 201
    input: [order_id, session_type, scheduled_at]
    output: CounselingSession
    side_effects: ["counseling_deadline_at computed as report_no_later_than_date - 14 days"]
  - method: GET
    path: "/hhg/counseling-sessions/{id}"
    description: "Read one counseling session."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: []
    output: CounselingSession
    side_effects: []
  - method: POST
    path: "/hhg/counseling-sessions/{id}/complete"
    description: "Complete counseling; creates the DRAFT entitlement with the rank/dependents weight allowance."
    roles: [MoveCounselor]
    code: 200
    input: [entitlement_briefed]
    output: CounselingSession
    side_effects: ["status -> COMPLETED; completed_at and counselor_user_id stamped", "is_late_counseling derived", "one EntitlementAuthorization created in DRAFT via calculations.entitlement_weight_allowance"]
  - method: GET
    path: "/hhg/counseling-sessions/{id}/entitlements"
    description: "List entitlements created by this session (FK reverse-reachability for EntitlementAuthorization.counseling_session_id)."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: []
    output: EntitlementAuthorization[]
    side_effects: []

  # ---- EntitlementAuthorization ----
  - method: GET
    path: "/hhg/entitlements/{id}"
    description: "Read one entitlement authorization including the weight and excess-cost ledger fields."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: EntitlementAuthorization
    side_effects: []
  - method: POST
    path: "/hhg/entitlements/{id}/authorize"
    description: "Authorize the entitlement, optionally adding an administrative weight bump."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: ["admin_weight_bump_lbs?"]
    output: EntitlementAuthorization
    side_effects: ["status -> AUTHORIZED", "total_billable_cap_lbs recomputed with the bump", "authorized_by_user_id stamped from X-User-ID"]
  - method: POST
    path: "/hhg/entitlements/{id}/excess-cost-waivers"
    description: "Waive part or all of the excess-weight cost due; conserves gross_excess_cost_usd."
    roles: [ProgramAdmin]
    code: 200
    input: [waived_amount_usd, waiver_reason]
    output: EntitlementAuthorization
    side_effects: ["excess_cost_waived_usd increased; excess_cost_due_usd reduced by the same amount", "gross_excess_cost_usd unchanged (compensating invariant)"]
  - method: POST
    path: "/hhg/entitlements/{id}/revoke-waiver"
    description: "Revoke every excess-cost waiver, restoring the amount due (compensating action)."
    roles: [ProgramAdmin]
    code: 200
    input: [revocation_reason]
    output: EntitlementAuthorization
    side_effects: ["excess_cost_waived_usd reset to 0.00; excess_cost_due_usd restored to gross_excess_cost_usd", "may re-suspend the entitlement and place AWARDED shipments ON_HOLD"]
  - method: POST
    path: "/hhg/entitlements/{id}/resume"
    description: "Return a SUSPENDED entitlement to AUTHORIZED once nothing is due; releases held shipments."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: ["resume_note?"]
    output: EntitlementAuthorization
    side_effects: ["status -> AUTHORIZED; suspension_reason cleared", "every ON_HOLD shipment of the entitlement moves ON_HOLD -> AWARDED"]
  - method: GET
    path: "/hhg/entitlements/{id}/shipments"
    description: "List shipments charging this entitlement (FK reverse-reachability for Shipment.entitlement_id)."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["weight_recon_status?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/hhg/entitlements/{id}/weight-ledger"
    description: "Computed read: the entitlement's weight and excess-cost ledger with the rate tier actually applied."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: []
    output: "{ entitlement_id: string, total_billable_cap_lbs: integer, charged_billable_weight_lbs: integer, pro_gear_excluded_total_lbs: integer, excess_weight_lbs: integer, excess_pct_over: number, excess_rate_per_cwt: number, admin_fee_usd: number, gross_excess_cost_usd: number, excess_cost_waived_usd: number, excess_cost_due_usd: number, contributing_shipment_count: integer }"
    side_effects: []

  # ---- MovingCompany (TSP) ----
  - method: POST
    path: "/hhg/tsps"
    description: "Onboard a transportation service provider with the markets it serves."
    roles: [ProgramAdmin]
    code: 201
    input: [name, scac_code, markets]
    output: MovingCompany
    side_effects: ["performance_score initialised to 100.00; status ACTIVE"]
  - method: GET
    path: "/hhg/tsps/{id}"
    description: "Read one transportation service provider."
    roles: [MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: []
    output: MovingCompany
    side_effects: []
  - method: GET
    path: "/hhg/tsps/{id}/capacity-blocks"
    description: "List a TSP's weekly capacity blocks (FK reverse-reachability for CapacityBlock.tsp_id)."
    roles: [MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["market_code?", "status?"]
    output: CapacityBlock[]
    side_effects: []
  - method: GET
    path: "/hhg/tsps/{id}/shipments"
    description: "List shipments assigned to a TSP (FK reverse-reachability for Shipment.tsp_id)."
    roles: [MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["movement_status?"]
    output: Shipment[]
    side_effects: []

  # ---- CapacityBlock ----
  - method: POST
    path: "/hhg/capacity-blocks"
    description: "Publish a weekly capacity block for a TSP/market; the week is the half-open interval [week_start_date, week_start_date + 7 days)."
    roles: [TspCoordinator, ProgramAdmin]
    code: 201
    input: [tsp_id, market_code, week_start_date, total_capacity_lbs, "short_notice_reserve_pct?"]
    output: CapacityBlock
    side_effects: ["week_end_date, peak_season, effective_reserve_pct, general_pool_lbs and short_notice_pool_lbs computed", "status set to OPEN (RESTRICTED when the owning TSP is on PROBATION)"]
  - method: GET
    path: "/hhg/capacity-blocks/{id}"
    description: "Read one capacity block including both committed pools."
    roles: [MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: CapacityBlock
    side_effects: []
  - method: POST
    path: "/hhg/capacity-blocks/{id}/awards"
    description: "Award a surveyed shipment into this week's capacity, consuming the general or short-notice pool."
    roles: [TspCoordinator, ProgramAdmin]
    code: 200
    input: [shipment_id, expected_capacity_block_version]
    output: Shipment
    side_effects: ["Shipment.capacity_block_id set", "committed_general_lbs or committed_short_notice_lbs and committed_lbs increased by billable_weight_lbs", "block status re-derived (OPEN -> RESTRICTED -> CLOSED)"]
  - method: POST
    path: "/hhg/capacity-blocks/{id}/release-award"
    description: "Release a shipment's award, returning its pounds to the pool it consumed (compensating action)."
    roles: [TspCoordinator, ProgramAdmin]
    code: 200
    input: [shipment_id, release_reason]
    output: Shipment
    side_effects: ["Shipment.capacity_block_id cleared", "the same pool counter and committed_lbs decreased by billable_weight_lbs", "block status re-derived (CLOSED -> RESTRICTED -> OPEN)"]
  - method: GET
    path: "/hhg/capacity-blocks/{id}/shipments"
    description: "List shipments awarded to a block (FK reverse-reachability for Shipment.capacity_block_id)."
    roles: [MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["is_short_notice?"]
    output: Shipment[]
    side_effects: []

  # ---- Shipment ----
  - method: POST
    path: "/hhg/shipments"
    description: "Book a shipment against an authorized entitlement; derives the spread window, short-notice and peak-season flags."
    roles: [MoveCounselor, ProgramAdmin]
    code: 201
    input: [order_id, entitlement_id, tsp_id, shipment_code, shipment_method, origin_market_code, requested_pack_date, requested_pickup_date, requested_delivery_date, expected_entitlement_version, "superseded_shipment_id?"]
    output: Shipment
    side_effects: ["booked_at stamped from the logical clock", "is_short_notice, peak_season, spread_start_date, spread_end_date and transit_days_allowed computed", "ServiceMember.active_shipment_count incremented", "EntitlementAuthorization.version bumped"]
  - method: GET
    path: "/hhg/shipments/{id}"
    description: "Read one shipment with both status dimensions and every weight field."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/hhg/shipments"
    description: "Paginated, filterable shipment list."
    roles: [MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: ["order_id?", "entitlement_id?", "tsp_id?", "capacity_block_id?", "movement_status?", "weight_recon_status?", "is_short_notice?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []
  - method: GET
    path: "/hhg/shipments/{id}/superseding-shipments"
    description: "List shipments that supersede this one (FK reverse-reachability for the self-FK Shipment.superseded_shipment_id)."
    roles: [MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []
  - method: POST
    path: "/hhg/shipments/{id}/survey"
    description: "Record the pre-move survey; converts room cube to the estimated gross weight and sets the provisional billable weight."
    roles: [TspCoordinator]
    code: 200
    input: [estimate_method, room_estimates]
    output: Shipment
    side_effects: ["movement_status AWARDED -> SURVEYED and weight_recon_status PENDING -> ESTIMATED", "estimated_gross_lbs via calculations.survey_estimated_gross_weight", "billable_weight_lbs via variant PROVISIONAL_ESTIMATED", "entitlement ledger recomputed"]
  - method: POST
    path: "/hhg/shipments/{id}/pack"
    description: "Confirm the packing date; raises the PACK_DATE_CONFIRMED notification obligation."
    roles: [TspCoordinator]
    code: 200
    input: [pack_date]
    output: Shipment
    side_effects: ["movement_status SURVEYED -> PACKED", "one PENDING Notification of type PACK_DATE_CONFIRMED created"]
  - method: POST
    path: "/hhg/shipments/{id}/pickup"
    description: "Record pickup inside the spread window; fixes required_delivery_by."
    roles: [TspCoordinator]
    code: 200
    input: [actual_pickup_date]
    output: Shipment
    side_effects: ["movement_status PACKED -> PICKED_UP", "required_delivery_by computed", "one PENDING Notification of type PICKUP_CONFIRMED created"]
  - method: POST
    path: "/hhg/shipments/{id}/record-actual-weight"
    description: "Record the certified scale weights; switches the billable basis to FINAL_ACTUAL and drives the depth-4 ledger cascade."
    roles: [TspCoordinator]
    code: 200
    input: [actual_gross_lbs, actual_tare_lbs, weigh_date, scale_certified]
    output: Shipment
    side_effects: ["weight_recon_status ESTIMATED -> ACTUAL_RECORDED", "net_actual_lbs, reweigh_required, billable_weight_lbs (FINAL_ACTUAL) recomputed", "entitlement ledger recomputed; may suspend the entitlement", "sibling AWARDED shipments may move to ON_HOLD", "one PENDING Notification of type WEIGHT_RECON_COMPLETE created"]
  - method: POST
    path: "/hhg/shipments/{id}/dispute-weight"
    description: "Member disputes the weight of record inside the 45-day window."
    roles: [ServiceMember, MoveCounselor]
    code: 200
    input: [dispute_reason]
    output: Shipment
    side_effects: ["weight_recon_status ACTUAL_RECORDED -> DISPUTED", "reweigh_required forced true", "ledger unchanged"]
  - method: POST
    path: "/hhg/shipments/{id}/reweigh"
    description: "Replace the weight of record after a dispute with a fresh certified weighing."
    roles: [TspCoordinator]
    code: 200
    input: [actual_gross_lbs, actual_tare_lbs, weigh_date, scale_certified]
    output: Shipment
    side_effects: ["weight_recon_status DISPUTED -> ACTUAL_RECORDED", "billable_weight_lbs recomputed (FINAL_ACTUAL)", "entitlement ledger recomputed"]
  - method: POST
    path: "/hhg/shipments/{id}/reconcile-weight"
    description: "Freeze the shipment's weight ledger after delivery; bubbles the entitlement to CLOSED when all shipments are final."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: ["reconcile_note?"]
    output: Shipment
    side_effects: ["weight_recon_status ACTUAL_RECORDED -> RECONCILED", "entitlement may move AUTHORIZED -> CLOSED", "when the entitlement closes, its PcsOrder moves ISSUED|AMENDED -> CLOSED"]
  - method: POST
    path: "/hhg/shipments/{id}/deliver"
    description: "Record delivery at destination; opens the loss/damage claim windows."
    roles: [TspCoordinator]
    code: 200
    input: [delivery_date]
    output: Shipment
    side_effects: ["movement_status PICKED_UP -> DELIVERED", "delivery_date stored (claim notice and filing windows start here)"]
  - method: POST
    path: "/hhg/shipments/{id}/cancel"
    description: "Cancel a shipment before pickup; releases its weight from the entitlement ledger and its pounds from the capacity block."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: [cancel_reason]
    output: Shipment
    side_effects: ["movement_status -> CANCELLED", "entitlement ledger recomputed with this shipment excluded", "capacity block counters and status re-derived", "ServiceMember.active_shipment_count decremented"]

  # ---- ProGearDeclaration ----
  - method: POST
    path: "/hhg/shipments/{id}/pro-gear-declarations"
    description: "Declare professional gear for weight exclusion."
    roles: [ServiceMember, MoveCounselor]
    code: 201
    input: [owner, item_description, claimed_weight_lbs, documentation_type]
    output: ProGearDeclaration
    side_effects: ["status SUBMITTED; verified_weight_lbs 0 (no ledger effect until verified)"]
  - method: GET
    path: "/hhg/shipments/{id}/pro-gear-declarations"
    description: "List a shipment's pro-gear declarations (FK reverse-reachability for ProGearDeclaration.shipment_id)."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["owner?", "status?"]
    output: ProGearDeclaration[]
    side_effects: []
  - method: GET
    path: "/hhg/pro-gear-declarations/{id}"
    description: "Read one pro-gear declaration."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: ProGearDeclaration
    side_effects: []
  - method: POST
    path: "/hhg/pro-gear-declarations/{id}/verify"
    description: "Verify declared professional gear in full or in part; excludes the verified pounds from billable weight."
    roles: [MoveCounselor]
    code: 200
    input: [verified_weight_lbs]
    output: ProGearDeclaration
    side_effects: ["status -> VERIFIED or PARTIALLY_VERIFIED", "Shipment.pro_gear_excluded_lbs and billable_weight_lbs recomputed", "entitlement ledger recomputed"]
  - method: POST
    path: "/hhg/pro-gear-declarations/{id}/reject"
    description: "Reject a pro-gear declaration for want of documentation."
    roles: [MoveCounselor]
    code: 200
    input: [rejection_reason]
    output: ProGearDeclaration
    side_effects: ["status -> REJECTED; verified_weight_lbs forced to 0", "Shipment.pro_gear_excluded_lbs and billable_weight_lbs recomputed", "entitlement ledger recomputed"]
  - method: POST
    path: "/hhg/pro-gear-declarations/{id}/resubmit"
    description: "Resubmit a rejected declaration with better documentation (at most twice)."
    roles: [ServiceMember, MoveCounselor]
    code: 200
    input: [claimed_weight_lbs, documentation_type]
    output: ProGearDeclaration
    side_effects: ["status REJECTED -> SUBMITTED; resubmission_count incremented", "rejection_reason cleared"]

  # ---- SitAuthorization ----
  - method: POST
    path: "/hhg/shipments/{id}/sit-authorizations"
    description: "Request storage in transit for a picked-up shipment."
    roles: [TspCoordinator, MoveCounselor]
    code: 201
    input: [sit_type, entry_date, requested_days]
    output: SitAuthorization
    side_effects: ["status REQUESTED"]
  - method: GET
    path: "/hhg/shipments/{id}/sit-authorizations"
    description: "List a shipment's SIT authorizations (FK reverse-reachability for SitAuthorization.shipment_id)."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["sit_type?", "status?"]
    output: SitAuthorization[]
    side_effects: []
  - method: GET
    path: "/hhg/sit-authorizations/{id}"
    description: "Read one SIT authorization including its cost breakdown."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: SitAuthorization
    side_effects: []
  - method: POST
    path: "/hhg/sit-authorizations/{id}/authorize"
    description: "Authorize storage in transit; moves the shipment into IN_SIT."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: [authorized_days]
    output: SitAuthorization
    side_effects: ["status REQUESTED -> AUTHORIZED; total_authorized_days set", "Shipment.movement_status PICKED_UP -> IN_SIT", "one PENDING Notification of type SIT_ENTRY created"]
  - method: POST
    path: "/hhg/sit-authorizations/{id}/extend"
    description: "Extend an authorized SIT period (self-loop, 90-day ceiling)."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: [extension_days, extension_reason]
    output: SitAuthorization
    side_effects: ["extension_days accumulated; total_authorized_days recomputed"]
  - method: POST
    path: "/hhg/sit-authorizations/{id}/release"
    description: "Release goods from storage in transit and price the stay."
    roles: [TspCoordinator]
    code: 200
    input: [release_date]
    output: SitAuthorization
    side_effects: ["status AUTHORIZED -> RELEASED", "days_used, excess_days and every cost field via calculations.sit_cost_assessment", "Shipment.movement_status IN_SIT -> PICKED_UP"]

  # ---- LossDamageClaim / ClaimItem ----
  - method: POST
    path: "/hhg/shipments/{id}/claims"
    description: "Open a loss/damage claim on a delivered shipment; notice must be inside 180 days."
    roles: [ServiceMember, MoveCounselor]
    code: 201
    input: [claim_type, notice_date, incident_description]
    output: LossDamageClaim
    side_effects: ["status DRAFT; settlement_basis UNDETERMINED"]
  - method: GET
    path: "/hhg/shipments/{id}/claims"
    description: "List a shipment's claims (FK reverse-reachability for LossDamageClaim.shipment_id)."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: ["status?"]
    output: LossDamageClaim[]
    side_effects: []
  - method: GET
    path: "/hhg/claims/{id}"
    description: "Read one loss/damage claim."
    roles: [ServiceMember, MoveCounselor, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: []
    output: LossDamageClaim
    side_effects: []
  - method: POST
    path: "/hhg/claims/{id}/claim-items"
    description: "Add an item to a draft claim."
    roles: [ServiceMember, MoveCounselor]
    code: 201
    input: [item_description, inventory_item_number, category, replacement_cost_usd, age_years, "high_value_inventory_documented?"]
    output: ClaimItem
    side_effects: ["depreciation_rate_pct_per_year set from the category table", "claim item_count and claimed_total_usd recomputed"]
  - method: GET
    path: "/hhg/claims/{id}/claim-items"
    description: "List a claim's items (FK reverse-reachability for ClaimItem.claim_id)."
    roles: [ServiceMember, MoveCounselor, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: ["disposition?"]
    output: ClaimItem[]
    side_effects: []
  - method: GET
    path: "/hhg/claim-items/{id}"
    description: "Read one claim item including its settlement figure."
    roles: [ServiceMember, MoveCounselor, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: []
    output: ClaimItem
    side_effects: []
  - method: POST
    path: "/hhg/claims/{id}/submit"
    description: "File the claim; the filing date fixes the full-replacement-value versus depreciated-value basis."
    roles: [ServiceMember, MoveCounselor]
    code: 200
    input: ["filing_note?"]
    output: LossDamageClaim
    side_effects: ["status DRAFT -> SUBMITTED; filed_date stamped", "filing_window_days computed from delivery_date", "settlement_basis set to FULL_REPLACEMENT_VALUE (<= 270 days) or DEPRECIATED_VALUE", "one PENDING Notification of type CLAIM_ACK created"]
  - method: POST
    path: "/hhg/claims/{id}/review"
    description: "Take the claim under review; stamps the reviewing examiner for segregation of duties."
    roles: [ClaimsExaminer]
    code: 200
    input: ["review_note?"]
    output: LossDamageClaim
    side_effects: ["status SUBMITTED -> UNDER_REVIEW; reviewed_by_user_id stamped from X-User-ID"]
  - method: POST
    path: "/hhg/claims/{id}/request-info"
    description: "Request further information from the member (at most three times)."
    roles: [ClaimsExaminer]
    code: 200
    input: [info_request_note]
    output: LossDamageClaim
    side_effects: ["status UNDER_REVIEW -> INFO_REQUESTED; info_request_count incremented"]
  - method: POST
    path: "/hhg/claims/{id}/provide-info"
    description: "Member answers an information request, returning the claim to review."
    roles: [ServiceMember, MoveCounselor]
    code: 200
    input: [response_note]
    output: LossDamageClaim
    side_effects: ["status INFO_REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/hhg/claim-items/{id}/disposition"
    description: "Allow or deny an individual claim item."
    roles: [ClaimsExaminer]
    code: 200
    input: [disposition, "adjudication_note?"]
    output: ClaimItem
    side_effects: ["disposition set to ALLOWED or DENIED"]
  - method: POST
    path: "/hhg/claims/{id}/settle"
    description: "Settle the claim on the basis fixed at filing; drives the depth-4 TSP performance cascade."
    roles: [ClaimsExaminer, ProgramAdmin]
    code: 200
    input: ["settlement_note?"]
    output: LossDamageClaim
    side_effects: ["status UNDER_REVIEW -> SETTLED; settled_by_user_id stamped", "per-item and total settlement via calculations.claim_settlement_valuation", "TSP settled_claim_count, claim_settlement_total_usd and performance_score recomputed", "TSP may move ACTIVE -> PROBATION -> SUSPENDED", "the TSP's capacity blocks may move OPEN -> RESTRICTED -> CLOSED"]
  - method: POST
    path: "/hhg/claims/{id}/deny"
    description: "Deny the claim in full."
    roles: [ClaimsExaminer]
    code: 200
    input: [denial_reason]
    output: LossDamageClaim
    side_effects: ["status UNDER_REVIEW -> DENIED; settlement_total_usd stays 0.00", "no TSP performance effect"]

  # ---- PpmSubmission ----
  - method: POST
    path: "/hhg/shipments/{id}/ppm-submissions"
    description: "Submit a personally procured move packet with certified weight tickets."
    roles: [ServiceMember, MoveCounselor]
    code: 201
    input: [trip_tickets, "documented_expenses_usd?", "advance_paid_usd?", "elected_basis?"]
    output: PpmSubmission
    side_effects: ["status SUBMITTED; moved_weight_lbs computed from the ticket pairs"]
  - method: GET
    path: "/hhg/shipments/{id}/ppm-submissions"
    description: "List a shipment's PPM submissions (FK reverse-reachability for PpmSubmission.shipment_id)."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: ["status?"]
    output: PpmSubmission[]
    side_effects: []
  - method: GET
    path: "/hhg/ppm-submissions/{id}"
    description: "Read one PPM submission with its reimbursement breakdown."
    roles: [ServiceMember, MoveCounselor, ProgramAdmin]
    code: 200
    input: []
    output: PpmSubmission
    side_effects: []
  - method: POST
    path: "/hhg/ppm-submissions/{id}/approve"
    description: "Approve the PPM packet and compute the reimbursement on the applied basis."
    roles: [MoveCounselor, ProgramAdmin]
    code: 200
    input: ["approval_note?"]
    output: PpmSubmission
    side_effects: ["status SUBMITTED -> APPROVED; approved_by_user_id stamped", "allowable_weight_lbs, gcc_usd, incentive_usd, applied_basis, reimbursement_usd, net_payable_usd, debt_owed_usd and taxable_amount_usd via calculations.ppm_reimbursement", "Shipment weight fields set from the allowable weight and the entitlement ledger recomputed"]

  # ---- Notification ----
  - method: GET
    path: "/hhg/shipments/{id}/notifications"
    description: "List a shipment's notification obligations (FK reverse-reachability for Notification.shipment_id)."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: ["notification_type?", "status?"]
    output: Notification[]
    side_effects: []
  - method: GET
    path: "/hhg/notifications/{id}"
    description: "Read one notification obligation with its service-level deadline."
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: Notification
    side_effects: []
  - method: POST
    path: "/hhg/notifications/{id}/dispatch"
    description: "Dispatch a pending notification; on-time at exactly due_by, LATE strictly after."
    roles: [MoveCounselor, TspCoordinator, ProgramAdmin]
    code: 200
    input: [channel]
    output: Notification
    side_effects: ["sent_at stamped from the logical clock", "status -> SENT or LATE; hours_late computed"]

  # ---- test-driving endpoint (last resort per §1.5 priority ladder) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Set the server's logical clock, which every deadline, spread window, SIT day count, claim
      window and notification SLA in this scaffold reads. Before the first call the clock reads
      exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.
    roles: [ServiceMember, MoveCounselor, TspCoordinator, ClaimsExaminer, ProgramAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set; no entity is mutated and no scheduled work fires"]

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not a declared §1.7 role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's §1.5 roles"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, unknown enum value, missing required field, negative weight/money/day, or malformed room_estimates / trip_tickets element"
  - id: ERR_SERVICE_MEMBER_NOT_FOUND
    http: 404
    condition: "service member id in the path or body does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "PCS order id in the path or body does not exist"
  - id: ERR_COUNSELING_SESSION_NOT_FOUND
    http: 404
    condition: "counseling session id does not exist"
  - id: ERR_ENTITLEMENT_NOT_FOUND
    http: 404
    condition: "entitlement authorization id does not exist"
  - id: ERR_TSP_NOT_FOUND
    http: 404
    condition: "transportation service provider id does not exist"
  - id: ERR_CAPACITY_BLOCK_NOT_FOUND
    http: 404
    condition: "capacity block id does not exist"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment id in the path or body (including superseded_shipment_id) does not exist"
  - id: ERR_PRO_GEAR_DECLARATION_NOT_FOUND
    http: 404
    condition: "pro-gear declaration id does not exist"
  - id: ERR_SIT_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "SIT authorization id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "loss/damage claim id does not exist"
  - id: ERR_CLAIM_ITEM_NOT_FOUND
    http: 404
    condition: "claim item id does not exist"
  - id: ERR_PPM_SUBMISSION_NOT_FOUND
    http: 404
    condition: "PPM submission id does not exist"
  - id: ERR_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "notification id does not exist"
  - id: ERR_OWNERSHIP_REQUIRED
    http: 403
    condition: "a ServiceMember acts on a resource that does not trace back to their own ServiceMember.id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the examiner who reviewed a claim attempts to settle it"
  - id: ERR_WAIVER_SELF_APPROVAL
    http: 403
    condition: "the user who authorized an entitlement attempts to waive its excess cost"
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the PCS order is not in a state that permits the requested operation"
  - id: ERR_INVALID_COUNSELING_STATE
    http: 409
    condition: "the counseling session is not SCHEDULED"
  - id: ERR_INVALID_ENTITLEMENT_STATE
    http: 409
    condition: "the entitlement is not in the source state the requested transition needs"
  - id: ERR_INVALID_SHIPMENT_MOVEMENT_STATE
    http: 409
    condition: "the shipment's movement_status is not the source state of the requested transition"
  - id: ERR_INVALID_WEIGHT_RECON_STATE
    http: 409
    condition: "the shipment's weight_recon_status is not the source state of the requested transition"
  - id: ERR_INVALID_PRO_GEAR_STATE
    http: 409
    condition: "the pro-gear declaration is not in the source state the requested transition needs"
  - id: ERR_INVALID_SIT_STATE
    http: 409
    condition: "the SIT authorization is not in the source state the requested transition needs"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the claim is not in the source state the requested transition needs"
  - id: ERR_INVALID_PPM_STATE
    http: 409
    condition: "the PPM submission is not SUBMITTED"
  - id: ERR_INVALID_NOTIFICATION_STATE
    http: 409
    condition: "the notification is not PENDING (already SENT or LATE)"
  - id: ERR_ENTITLEMENT_NOT_AUTHORIZED
    http: 409
    condition: "the entitlement is still DRAFT or already CLOSED when shipment work is attempted"
  - id: ERR_ENTITLEMENT_SUSPENDED
    http: 409
    condition: "the entitlement is SUSPENDED for unpaid excess cost"
  - id: ERR_SHIPMENT_NOT_DELIVERED
    http: 409
    condition: "a loss/damage claim is opened or filed against a shipment that has not been delivered"
  - id: ERR_CAPACITY_BLOCK_NOT_ASSIGNED
    http: 409
    condition: "packing is attempted before the shipment holds a weekly capacity award"
  - id: ERR_STALE_ENTITLEMENT_VERSION
    http: 412
    condition: "expected_entitlement_version does not match the entitlement's current version"
  - id: ERR_STALE_CAPACITY_BLOCK_VERSION
    http: 412
    condition: "expected_capacity_block_version does not match the capacity block's current version"
  - id: ERR_TSP_NOT_ACTIVE
    http: 409
    condition: "the transportation service provider is SUSPENDED"
  - id: ERR_MARKET_NOT_SERVED
    http: 409
    condition: "the origin market is not in the TSP's markets array or does not match the block's market_code"
  - id: ERR_SHIPMENT_TSP_MISMATCH
    http: 409
    condition: "the shipment's TSP differs from the capacity block's TSP"
  - id: ERR_PRO_GEAR_DOCUMENTATION_REQUIRED
    http: 422
    condition: "verification attempted on a declaration whose documentation_type is NONE"
  - id: ERR_PRO_GEAR_CAP_EXCEEDED
    http: 422
    condition: "verified_weight_lbs exceeds the claimed weight or the owner's pro-gear allowance"
  - id: ERR_UNCERTIFIED_SCALE
    http: 422
    condition: "a weight of record is submitted with scale_certified false"
  - id: ERR_LOSS_NOTICE_WINDOW_EXPIRED
    http: 422
    condition: "notice_date is more than 180 days after delivery"
  - id: ERR_CLAIM_FILING_WINDOW_EXPIRED
    http: 422
    condition: "the claim is filed more than 730 days after delivery"
  - id: ERR_WEIGHT_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "the weight of record is disputed more than 45 days after the weigh date"
  - id: ERR_PICKUP_OUTSIDE_SPREAD
    http: 422
    condition: "actual_pickup_date falls outside [spread_start_date, spread_end_date]"
  - id: ERR_PACK_BEFORE_SPREAD
    http: 422
    condition: "pack_date is earlier than spread_start_date minus one day"
  - id: ERR_SIT_ENTRY_BEFORE_PICKUP
    http: 422
    condition: "SIT entry_date precedes the shipment's actual pickup date"
  - id: ERR_DELIVERY_BEFORE_PICKUP
    http: 422
    condition: "delivery_date precedes actual_pickup_date"
  - id: ERR_RELEASE_BEFORE_ENTRY
    http: 422
    condition: "SIT release_date precedes entry_date"
  - id: ERR_SIT_PERIOD_OVERLAP
    http: 409
    condition: "the requested inclusive SIT day range overlaps or touches another non-released SIT period of the same shipment"
  - id: ERR_CAPACITY_BLOCK_OVERLAP
    http: 409
    condition: "the new half-open capacity week overlaps an existing block for the same TSP and market"
  - id: ERR_SIT_MAX_DAYS_EXCEEDED
    http: 422
    condition: "authorized plus extension days would exceed the 90-day storage-in-transit ceiling"
  - id: ERR_CLAIM_ITEM_REQUIRED
    http: 422
    condition: "a claim with no items is filed"
  - id: ERR_CLAIM_ITEM_PENDING
    http: 409
    condition: "settlement is attempted while at least one item is still in disposition PENDING"
  - id: ERR_SURVEY_ROOM_ESTIMATES_EMPTY
    http: 422
    condition: "a survey is recorded with an empty room_estimates array"
  - id: ERR_CLAIM_INFO_REQUEST_LIMIT
    http: 409
    condition: "a fourth information request is attempted on one claim"
  - id: ERR_ORDER_AMENDMENT_LIMIT
    http: 409
    condition: "a fourth amendment is attempted on one set of orders"
  - id: ERR_PRO_GEAR_RESUBMISSION_LIMIT
    http: 409
    condition: "a third resubmission is attempted on one pro-gear declaration"
  - id: ERR_DUPLICATE_DOD_ID
    http: 409
    condition: "dod_id already registered"
  - id: ERR_DUPLICATE_ORDER_NUMBER
    http: 409
    condition: "order_number already issued"
  - id: ERR_DUPLICATE_ENTITLEMENT
    http: 409
    condition: "a second counseling session tries to create a second entitlement for the same orders"
  - id: ERR_PPM_METHOD_REQUIRED
    http: 422
    condition: "a PPM packet is submitted against a shipment whose method is not PPM"
  - id: ERR_WEIGHT_TICKET_PAIR_INCOMPLETE
    http: 422
    condition: "a trip ticket lacks a certified full/empty pair or full_lbs is not greater than empty_lbs"
  - id: ERR_CAPACITY_BLOCK_NOT_OPEN
    http: 409
    condition: "the capacity block is CLOSED, or RESTRICTED and the shipment is not short notice"
  - id: ERR_WEIGHT_BASIS_MISSING
    http: 409
    condition: "capacity is awarded to a shipment with no survey or weight of record (billable_basis NONE)"
  - id: ERR_SHORT_NOTICE_RESERVE_PROTECTED
    http: 409
    condition: "a general shipment would only fit by consuming the short-notice reserve"
  - id: ERR_AWARD_NOT_FOUND
    http: 409
    condition: "release-award is called for a shipment that holds no award on that block"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "the shipment's billable weight exceeds the remaining capacity of the applicable pool"
  - id: ERR_EXCESS_COST_UNPAID
    http: 409
    condition: "reconciliation or resumption is attempted while excess_cost_due_usd is above zero"
  - id: ERR_WAIVER_EXCEEDS_DUE
    http: 422
    condition: "the waiver amount exceeds the excess cost currently due"
  - id: ERR_NO_WAIVER_TO_REVOKE
    http: 409
    condition: "waiver revocation is attempted when nothing has been waived"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: ServiceMember
    description: "The relocating member; owns their orders, shipments, pro-gear declarations, claims and PPM packets."
    identity: "entity_backed:ServiceMember"
    exclusive_operations:
      - "POST /hhg/shipments/{id}/dispute-weight (the member is the disputing party; counselors may act on their behalf)"
      - "POST /hhg/claims/{id}/provide-info"
    shared_operations:
      - "GET of any resource tracing back to their own ServiceMember.id"
      - "POST /hhg/shipments/{id}/pro-gear-declarations, POST /hhg/pro-gear-declarations/{id}/resubmit"
      - "POST /hhg/shipments/{id}/claims, POST /hhg/claims/{id}/claim-items, POST /hhg/claims/{id}/submit"
      - "POST /hhg/shipments/{id}/ppm-submissions"
      - "POST /hhg/shipments/{id}/cancel"
  - name: MoveCounselor
    description: "Personal property counselor: books counseling, authorizes entitlements, verifies pro-gear, reconciles weight."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhg/counseling-sessions/{id}/complete"
      - "POST /hhg/pro-gear-declarations/{id}/verify"
      - "POST /hhg/pro-gear-declarations/{id}/reject"
    shared_operations:
      - "POST /hhg/service-members, POST /hhg/orders, POST /hhg/orders/{id}/amend, POST /hhg/counseling-sessions"
      - "POST /hhg/entitlements/{id}/authorize, POST /hhg/entitlements/{id}/resume"
      - "POST /hhg/shipments, POST /hhg/shipments/{id}/reconcile-weight, POST /hhg/shipments/{id}/cancel"
      - "POST /hhg/sit-authorizations/{id}/authorize, /extend"
      - "POST /hhg/ppm-submissions/{id}/approve, POST /hhg/notifications/{id}/dispatch"
  - name: TspCoordinator
    description: "Transportation service provider coordinator: surveys, packs, picks up, weighs, stores and delivers."
    identity: "entity_backed:MovingCompany"
    exclusive_operations:
      - "POST /hhg/shipments/{id}/survey"
      - "POST /hhg/shipments/{id}/pack"
      - "POST /hhg/shipments/{id}/pickup"
      - "POST /hhg/shipments/{id}/record-actual-weight"
      - "POST /hhg/shipments/{id}/reweigh"
      - "POST /hhg/shipments/{id}/deliver"
      - "POST /hhg/sit-authorizations/{id}/release"
    shared_operations:
      - "POST /hhg/capacity-blocks, POST /hhg/capacity-blocks/{id}/awards, /release-award"
      - "POST /hhg/shipments/{id}/sit-authorizations"
      - "POST /hhg/notifications/{id}/dispatch"
      - "GET of shipments, capacity blocks and claims for their own TSP"
  - name: ClaimsExaminer
    description: "Adjudicates loss and damage claims; segregation of duties separates review from settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhg/claims/{id}/review"
      - "POST /hhg/claims/{id}/request-info"
      - "POST /hhg/claim-items/{id}/disposition"
      - "POST /hhg/claims/{id}/deny"
    shared_operations:
      - "POST /hhg/claims/{id}/settle (shared with ProgramAdmin; never by the reviewing examiner)"
      - "GET of claims, claim items, shipments and service members"
  - name: ProgramAdmin
    description: "Program office: onboards providers, grants and revokes excess-cost waivers, overrides operational steps."
    identity: "opaque"
    exclusive_operations:
      - "POST /hhg/tsps"
      - "POST /hhg/entitlements/{id}/excess-cost-waivers"
      - "POST /hhg/entitlements/{id}/revoke-waiver"
    shared_operations:
      - "POST /hhg/service-members, POST /hhg/orders, POST /hhg/orders/{id}/amend, POST /hhg/counseling-sessions"
      - "POST /hhg/entitlements/{id}/authorize, /resume"
      - "POST /hhg/capacity-blocks, /awards, /release-award"
      - "POST /hhg/shipments, POST /hhg/shipments/{id}/reconcile-weight, /cancel"
      - "POST /hhg/sit-authorizations/{id}/authorize, /extend"
      - "POST /hhg/claims/{id}/settle, POST /hhg/ppm-submissions/{id}/approve, POST /hhg/notifications/{id}/dispatch"
