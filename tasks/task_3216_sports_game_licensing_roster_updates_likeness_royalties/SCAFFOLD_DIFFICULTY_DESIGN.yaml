            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 80 }
              as: RosterOperator
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${batch_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/content-drops"
              payload: { season_id: "${season_id}", drop_kind: "VANITY", drop_label: "Emote Pack", price_vc: 300, scheduled_start_at: "2026-08-15T00:00:00Z", scheduled_end_at: "2026-12-15T00:00:00Z" }
              as: LiveOpsManager
              captures: { drop_id: $.data.id }
            - call: "POST /licensing/content-drops/${drop_id}/release"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "spender" }
              as: LiveOpsManager
              captures: { w_id: $.data.id }
            - call: "POST /licensing/wallets/${w_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 1000, reason_code: "GRANT" }
              as: LiveOpsManager
          trigger:
            - call: "POST /licensing/content-drops/${drop_id}/purchase"
              payload: { wallet_id: "${w_id}" }
              as: LiveOpsManager
              captures: { spend_entry: $.data.id }
            - call: "GET /licensing/wallets/${w_id}"
              payload: {}
              as: LiveOpsManager
              captures: { bal_mid: $.data.vc_balance }
            - call: "POST /licensing/wallets/${w_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 300, reason_code: "REFUND", reference_id: "${drop_id}" }
              as: FinanceController
            - call: "GET /licensing/wallets/${w_id}"
              payload: {}
              as: LiveOpsManager
              captures: { bal_end: $.data.vc_balance }
          assert:
            - "After SPEND_DROP: vc_balance == 700 (1000 - 300)"
            - "After compensating REFUND of 300: vc_balance == 1000 (exactly the pre-pair value)"
            - "Ledger has 3 POSTED entries: GRANT +1000, SPEND_DROP -300, REFUND +300; no entry is mutated or deleted (append-only)"

      - name: statement_finalize_then_pay_leaves_outstanding_conserved
        grounds:
          - calculations.outstanding_royalty_reconciliation
          - state_machines.RoyaltyStatement.FINALIZED_to_PAID
        distinguishing_aspect: |
          Conserved quantity = LicenseAgreement.outstanding_royalty_cents
          (currency cents, a different quantity than virtual currency units):
          finalize(+X) followed by pay(-X) of the same statement returns the
          agreement's outstanding balance to its pre-finalize value, with zero drift.
        test_recipe:
          setup:
            - "Agreement ACTIVE PERCENT_OF_NET mg_recoupable=false; statement S gross=500000, returns=0, pending=0 finalized at clock past period end"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "L", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "GET /licensing/agreements/${agr_id}"
              payload: {}
              as: FinanceController
              captures: { out0: $.data.outstanding_royalty_cents }
            - call: "POST /licensing/royalty-statements"
              payload: { agreement_id: "${agr_id}", period_start_on: "2026-08-01", period_end_on: "2026-08-31", gross_sales_cents: 500000, returns_cents: 0, pending_sales_cents: 0 }
              as: FinanceController
              captures: { stmt_id: $.data.id }
            - call: "POST /licensing/royalty-statements/${stmt_id}/compute-provisional"
              payload: {}
              as: FinanceController
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements/${stmt_id}/finalize"
              payload: {}
              as: FinanceController
            - call: "GET /licensing/agreements/${agr_id}"
              payload: {}
              as: FinanceController
              captures: { out1: $.data.outstanding_royalty_cents }
          trigger:
            - call: "POST /licensing/royalty-statements/${stmt_id}/pay"
              payload: {}
              as: FinanceController
            - call: "GET /licensing/agreements/${agr_id}"
              payload: {}
              as: FinanceController
              captures: { out2: $.data.outstanding_royalty_cents }
          assert:
            - "Before finalize: outstanding_royalty_cents == 0"
            - "After finalize: outstanding_royalty_cents == 50000 (accrued 500000*1000/10000, held 0, paid 0)"
            - "After pay: outstanding_royalty_cents == 0 — finalize(+50000) then pay(-50000) conserves the pre-sequence value exactly"
            - "RoyaltyStatement.${stmt_id}.paid_royalty_cents == 50000 and statement_status == PAID"
