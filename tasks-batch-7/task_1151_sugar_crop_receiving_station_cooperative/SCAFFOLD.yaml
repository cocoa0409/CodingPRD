# =============================================================================
# PRD Benchmark Seed Tables — Sugar Crop Receiving Station & Cooperative Payment
# =============================================================================

scenario: |
  Sugar Crop Receiving Station & Cooperative Payment (American Crystal Sugar co-op):
  load ticket & tare/net weight, quality sampling (sugar content) & payment factor,
  harvest scheduling & piling ground capacity, deduction for dirt/leaf trash,
  cooperative member share & pool payment installments, transport allowance & haul
  distance, deterioration in storage & loss allocation, final pool settlement

domain_name: sugar-coop-receiving
api_prefix: /api

complexity_profile:
  primary_archetype: ledger_reconciliation        # pool advances vs final settlement reconciliation
  secondary_archetype: quota_allocation           # station booking capacity, pile capacity
  complexity_layers:
    - optimistic_concurrency                      # OCC on PaymentPool.version and SettlementStatement.version
    - cascading_side_effects                      # loss-allocate and booking-cancel propagate 3 levels deep
    - dual_variant_calculation                    # provisional vs final payment factor; table-rate vs resurvey loss
    - derived_field_reconciliation                # station booked/received/stored tons, member ledger net
  entity_topology: flat                           # peer resources under /api, FK references in bodies
  state_machine_shape: cyclic                     # ticket reweigh loop, sample invalidate loop, settlement dispute loop, member suspend loop
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties               # sample recorder != sample verifier
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign display name" }
      - { name: window_start, type: datetime, source: input, description: "Harvest window start (inclusive); booking slots must start at or after this" }
      - { name: window_end, type: datetime, source: input, description: "Harvest window end (inclusive); booking slots must end at or before this" }
      - { name: base_price_cents_per_ton, type: integer, source: input, description: "Provisional base price per adjusted net ton, used for provisional value and installment entitlement" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SETTLING | SETTLED", default: OPEN, constraints: "initial OPEN; SETTLING entered when its PaymentPool closes; SETTLED when all SettlementStatements are PAID" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower display name" }
      - { name: member_code, type: string, source: input, description: "Unique cooperative member code, e.g. M-1001", constraints: "unique across members" }
      - { name: haul_distance_miles, type: number, source: input, description: "One-way haul distance farm to assigned station; selects transport rate band", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE, constraints: "initial ACTIVE; ACTIVE<->SUSPENDED cycle allowed" }
      - { name: net_ledger_cents, type: integer, source: computed, description: "Sum of amount_cents over all of member's PaymentLedgerEntry rows (ADVANCE_CREDIT + FINAL_SETTLEMENT + TRANSPORT_CREDIT + REVERSAL)", default: 0 }
      - { name: deterioration_loss_lbs, type: number, source: computed, description: "Sum of loss pounds allocated to this member across all ALLOCATED StorageLossEvents", default: 0 }

  - name: ReceivingStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: booking_capacity_tons, type: number, source: input, description: "Maximum total estimated tons that may be CONFIRMED-booked at this station", constraints: "> 0" }
      - { name: booked_tons, type: number, source: computed, description: "Sum of estimated_tons over bookings at this station with status CONFIRMED", default: 0 }
      - { name: received_tons, type: number, source: computed, description: "Sum of adjusted_net_tons_final over LoadTickets at this station with status ACCEPTED or CREDITED", default: 0 }
      - { name: stored_tons, type: number, source: computed, description: "Sum of stored_lbs over all StoragePiles at this station, divided by 2000, 4 decimal places round_half_up", default: 0 }

  - name: StoragePile
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> ReceivingStation.id; station that owns this piling ground" }
      - { name: capacity_tons, type: number, source: input, description: "Maximum adjusted net tons the pile can hold", constraints: "> 0" }
      - { name: fill_status, type: enum, source: system, description: "FILLING | SEALED | RECLAIMING | EMPTY", default: FILLING }
      - { name: condition_status, type: enum, source: system, description: "SOUND | DETERIORATING | LOSS_DECLARED", default: SOUND }
      - { name: stored_lbs, type: number, source: computed, description: "Sum of remaining_lbs over this pile's PileAllocations with status ACTIVE", default: 0 }
      - { name: sealed_stored_lbs, type: number, source: system, description: "Snapshot of stored_lbs at the moment of seal; basis for TABLE_RATE loss and RESURVEY validation", default: 0 }
      - { name: sealed_at, type: datetime, source: system, description: "Logical clock timestamp when the pile was sealed; null until sealed", default: null }
      - { name: reclaim_started_at, type: datetime, source: system, description: "Logical clock timestamp when reclaim began; null until begin-reclaim", default: null }

  - name: HarvestBooking
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; set from the caller's X-User-ID (MEMBER role) at creation" }
      - { name: station_id, type: string, source: input, description: "FK -> ReceivingStation.id" }
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id" }
      - { name: slot_start, type: datetime, source: input, description: "Delivery slot start; half-open interval [slot_start, slot_end)" }
      - { name: slot_end, type: datetime, source: input, description: "Delivery slot end (exclusive for overlap purposes); must be after slot_start" }
      - { name: estimated_tons, type: number, source: input, description: "Estimated net tons this booking will deliver", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | WAITLISTED | IN_USE | COMPLETED | CANCELLED", default: REQUESTED }

  - name: LoadTicket
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> HarvestBooking.id; booking this delivery fulfills" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; copied from booking.member_id at creation" }
      - { name: station_id, type: string, source: system, description: "FK -> ReceivingStation.id; copied from booking.station_id at creation" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Scale weight of loaded truck; null until weighed", default: null }
      - { name: tare_weight_lbs, type: number, source: input, description: "Scale weight of empty truck; null until weighed", default: null }
      - { name: net_weight_lbs, type: number, source: computed, description: "gross_weight_lbs - tare_weight_lbs; null while CREATED or REWEIGHING", default: null }
      - { name: status, type: enum, source: system, description: "CREATED | WEIGHED | REWEIGHING | SAMPLED | ACCEPTED | CREDITED | REJECTED | VOIDED", default: CREATED }
      - { name: provisional_trash_pct, type: number, source: computed, description: "trash_pct of the first RESULT_RECORDED sample (the SAMPLED trigger sample); null before SAMPLED", default: null }
      - { name: provisional_sugar_pct, type: number, source: computed, description: "sugar_pct of the first RESULT_RECORDED sample; null before SAMPLED", default: null }
      - { name: provisional_factor, type: number, source: computed, description: "Provisional payment factor per calculation payment_factor variant PROVISIONAL", default: null }
      - { name: provisional_adjusted_net_tons, type: number, source: computed, description: "Adjusted net tons computed with provisional_trash_pct", default: null }
      - { name: provisional_value_cents, type: integer, source: computed, description: "provisional_adjusted_net_tons x campaign.base_price_cents_per_ton x provisional_factor, round_half_up to integer cents", default: null }
      - { name: final_trash_pct, type: number, source: computed, description: "trash_pct of the latest VERIFIED LAB_VERIFY sample (by created_at); set at accept", default: null }
      - { name: final_sugar_pct, type: number, source: computed, description: "sugar_pct of the latest VERIFIED LAB_VERIFY sample; set at accept", default: null }
      - { name: final_factor, type: number, source: computed, description: "Final payment factor per calculation payment_factor variant FINAL; set at accept", default: null }
      - { name: adjusted_net_tons_final, type: number, source: computed, description: "Adjusted net tons computed with final_trash_pct; set at accept", default: null }
      - { name: adjusted_net_lbs_final, type: number, source: computed, description: "adjusted_net_tons_final x 2000; set at accept", default: null }

  - name: QualitySample
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: input, description: "FK -> LoadTicket.id" }
      - { name: sample_type, type: enum, source: input, description: "STATION_QUICK | LAB_VERIFY" }
      - { name: sugar_pct, type: number, source: input, description: "Measured sugar content percent; null until result recorded", default: null, constraints: "0 < sugar_pct <= 30" }
      - { name: trash_pct, type: number, source: input, description: "Measured dirt/leaf trash percent; null until result recorded", default: null, constraints: "0 <= trash_pct <= 100" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the QUALITY_TECH who recorded the result; used for segregation-of-duties on verify", default: null }
      - { name: status, type: enum, source: system, description: "COLLECTED | RESULT_RECORDED | VERIFIED", default: COLLECTED }

  - name: PileAllocation
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: system, description: "FK -> LoadTicket.id; set at accept" }
      - { name: pile_id, type: string, source: system, description: "FK -> StoragePile.id; the pile receiving the load" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; copied from ticket.member_id" }
      - { name: allocated_lbs, type: number, source: system, description: "ticket.adjusted_net_lbs_final at accept time" }
      - { name: remaining_lbs, type: number, source: computed, description: "allocated_lbs minus all loss pounds allocated to this allocation by ALLOCATED StorageLossEvents; survives reclaim (represents loss-adjusted creditable weight)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED", default: ACTIVE, constraints: "DEPLETED when owning pile completes reclaim" }

  - name: StorageLossEvent
    parent: null
    common_fields: true
    fields:
      - { name: pile_id, type: string, source: input, description: "FK -> StoragePile.id" }
      - { name: method, type: enum, source: input, description: "TABLE_RATE | RESURVEY; selects deterioration_loss variant" }
      - { name: survey_at, type: datetime, source: input, description: "Survey timestamp; TABLE_RATE day count = floor((survey_at - pile.sealed_at) / 86400)" }
      - { name: window_start, type: datetime, source: input, description: "Survey blackout window start (inclusive); blocks pile begin-reclaim while event is DRAFT or CONFIRMED" }
      - { name: window_end, type: datetime, source: input, description: "Survey blackout window end (inclusive; clock == window_end still blocks)" }
      - { name: measured_remaining_lbs, type: number, source: input, description: "Measured remaining pile mass; required when method=RESURVEY, ignored for TABLE_RATE", default: null }
      - { name: loss_lbs, type: number, source: computed, description: "Computed at confirm per deterioration_loss variants; null until CONFIRMED", default: null }
      - { name: unallocated_lbs, type: number, source: computed, description: "Portion of loss_lbs not allocated because total remaining_lbs was zero; set at allocate", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | ALLOCATED", default: DRAFT }

  - name: PaymentPool
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; exactly one pool per campaign, auto-created with the campaign" }
      - { name: status, type: enum, source: system, description: "OPEN | ACCRUING | CLOSED | SETTLED", default: OPEN }
      - { name: estimated_pool_value_cents, type: integer, source: input, description: "Estimated final pool value declared at open-accrual; basis for installment targets and the 110% accrual cap", default: null }
      - { name: gross_pool_value_cents, type: integer, source: input, description: "Actual pool proceeds declared at pool close; basis for final price", default: null }
      - { name: accrued_provisional_cents, type: integer, source: computed, description: "Sum of provisional_value_cents over CREDITED tickets of this campaign", default: 0 }
      - { name: final_price_cents_per_lb, type: number, source: computed, description: "Computed at close per calculation final_pool_price; null until CLOSED", default: null }

  - name: PoolInstallment
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> PaymentPool.id" }
      - { name: pct_of_estimated, type: number, source: input, description: "Percent of estimated_pool_value_cents to distribute as advances", constraints: "0 < pct_of_estimated <= 100" }
      - { name: target_amount_cents, type: integer, source: computed, description: "round_half_up(pct_of_estimated/100 x estimated_pool_value_cents, 0)" }
      - { name: distributed_amount_cents, type: integer, source: computed, description: "Sum of ADVANCE_CREDIT entries created at issue; <= target when caps bind", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ISSUED", default: SCHEDULED }

  - name: PaymentLedgerEntry
    parent: null
    common_fields: false   # append-only event log: id + created_at only; compensation via REVERSAL entries
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: pool_id, type: string, source: system, description: "FK -> PaymentPool.id" }
      - { name: installment_id, type: string, source: system, description: "FK -> PoolInstallment.id; set for ADVANCE_CREDIT entries, null otherwise", default: null }
      - { name: settlement_id, type: string, source: system, description: "FK -> SettlementStatement.id; set for FINAL_SETTLEMENT and TRANSPORT_CREDIT entries, null otherwise", default: null }
      - { name: kind, type: enum, source: system, description: "ADVANCE_CREDIT | FINAL_SETTLEMENT | TRANSPORT_CREDIT | REVERSAL" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents; REVERSAL entries carry the negation of the reversed entry" }
      - { name: reversal_of_id, type: string, source: system, description: "FK -> PaymentLedgerEntry.id; set on REVERSAL entries only, references the reversed entry", default: null }

  - name: SettlementStatement
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: system, description: "FK -> Member.id" }
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id" }
      - { name: pool_id, type: string, source: system, description: "FK -> PaymentPool.id" }
      - { name: sugar_lbs, type: number, source: computed, description: "Member's post-loss sugar pounds per calculation final_pool_settlement; set at generate" }
      - { name: price_cents_per_lb, type: number, source: computed, description: "Snapshot of pool.final_price_cents_per_lb at generate" }
      - { name: gross_entitlement_cents, type: integer, source: computed, description: "round_half_up(sugar_lbs x price_cents_per_lb, 0), with the pool rounding delta assigned to the largest-entitlement member" }
      - { name: advances_posted_cents, type: integer, source: computed, description: "Member's net ADVANCE_CREDIT (including REVERSALs) at issue time" }
      - { name: transport_credit_cents, type: integer, source: computed, description: "Sum of per-ticket transport allowances per calculation transport_allowance" }
      - { name: final_payment_cents, type: integer, source: computed, description: "gross_entitlement_cents - advances_posted_cents" }
      - { name: total_payment_cents, type: integer, source: computed, description: "final_payment_cents + transport_credit_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | ACKNOWLEDGED | PAID", default: DRAFT }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/campaigns/{campaign_id}/close"
        actor: COOP_ADMIN
        preconditions:
          - "No HarvestBooking for this campaign in CONFIRMED or IN_USE (ERR_INVALID_STATE)"
        side_effects:
          - "Each booking for this campaign in REQUESTED or WAITLISTED transitions to CANCELLED (conditional cascade: COMPLETED bookings untouched)"
          - "increments Campaign.version by 1"
      - from: CLOSED
        to: SETTLING
        trigger: "system (its PaymentPool transitions to CLOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Campaign.version by 1"
      - from: SETTLING
        to: SETTLED
        trigger: "system (all SettlementStatements of this campaign reach PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Campaign.version by 1"

  - entity: Member
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/members/{member_id}/suspend"
        actor: COOP_ADMIN
        preconditions: []
        side_effects:
          - "Each of the member's bookings in REQUESTED, WAITLISTED, or CONFIRMED transitions to CANCELLED; each CONFIRMED cancellation releases station booked_tons and triggers waitlist promotion scan (calculation waitlist_promotion)"
          - "increments Member.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/members/{member_id}/reinstate"
        actor: COOP_ADMIN
        preconditions: []
        side_effects:
          - "increments Member.version by 1"

  - entity: HarvestBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/bookings/{booking_id}/confirm"
        actor: SCHEDULER
        preconditions:
          - "Booking's campaign.status == OPEN (ERR_CAMPAIGN_NOT_OPEN)"
          - "Booking's member.status == ACTIVE (ERR_MEMBER_SUSPENDED)"
          - "Slot fully inside campaign window: window_start <= slot_start AND slot_end <= window_end (ERR_SLOT_OUTSIDE_WINDOW)"
          - "No half-open overlap with another CONFIRMED booking at the same station: overlap iff slot_start < other.slot_end AND other.slot_start < slot_end; adjacency (slot_start == other.slot_end) is NOT overlap (ERR_SLOT_OVERLAP)"
          - "station.booked_tons + estimated_tons <= station.booking_capacity_tons, equality allowed; on violation the booking transitions to WAITLISTED instead of CONFIRMED (no error)"
        side_effects:
          - "station.booked_tons += estimated_tons"
          - "increments HarvestBooking.version by 1 and ReceivingStation.version by 1"
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /api/bookings/{booking_id}/confirm when capacity check fails but overlap check passes"
        actor: SCHEDULER
        preconditions:
          - "campaign OPEN, member ACTIVE, slot inside window, no overlap (as above)"
          - "station.booked_tons + estimated_tons > station.booking_capacity_tons (capacity overflow routes to WAITLISTED instead of an error)"
        side_effects:
          - "increments HarvestBooking.version by 1"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist promotion scan after a same-station CONFIRMED booking is cancelled)"
        actor: system
        preconditions:
          - "Selected per calculation waitlist_promotion (eligibility, ranking, tie-break)"
        side_effects:
          - "station.booked_tons += estimated_tons"
          - "increments HarvestBooking.version by 1 and ReceivingStation.version by 1"
      - from: CONFIRMED
        to: REQUESTED
        trigger: "POST /api/bookings/{booking_id}/reschedule"
        actor: MEMBER
        preconditions:
          - "Caller owns the booking (booking.member_id == X-User-ID) (ERR_FORBIDDEN)"
          - "New slot fully inside campaign window (ERR_SLOT_OUTSIDE_WINDOW)"
        side_effects:
          - "station.booked_tons -= estimated_tons (capacity released; re-validated at next confirm)"
          - "slot_start/slot_end replaced with new values"
          - "increments HarvestBooking.version by 1 and ReceivingStation.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/bookings/{booking_id}/cancel"
        actor: MEMBER | SCHEDULER
        preconditions: []
        side_effects:
          - "increments HarvestBooking.version by 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /api/bookings/{booking_id}/cancel"
        actor: MEMBER | SCHEDULER
        preconditions: []
        side_effects:
          - "increments HarvestBooking.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/bookings/{booking_id}/cancel"
        actor: MEMBER | SCHEDULER
        preconditions: []
        side_effects:
          - "station.booked_tons -= estimated_tons"
          - "waitlist promotion scan runs for the station (calculation waitlist_promotion)"
          - "increments HarvestBooking.version by 1 and ReceivingStation.version by 1"
      - from: CONFIRMED
        to: IN_USE
        trigger: "system (first LoadTicket for this booking is weighed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments HarvestBooking.version by 1"
      - from: IN_USE
        to: COMPLETED
        trigger: "system (a LoadTicket for this booking is accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "station.booked_tons -= estimated_tons (slot considered consumed)"
          - "increments HarvestBooking.version by 1 and ReceivingStation.version by 1"

  - entity: LoadTicket
    initial_state: CREATED
    terminal_states: [CREDITED, REJECTED, VOIDED]
    transitions:
      - from: CREATED
        to: WEIGHED
        trigger: "POST /api/tickets/{ticket_id}/weigh"
        actor: STATION_OPERATOR
        preconditions:
          - "tare_weight_lbs > 0 AND gross_weight_lbs > tare_weight_lbs (ERR_INVALID_WEIGHTS)"
          - "logical clock within [booking.slot_start - 1800s, booking.slot_end + 3600s] (ERR_WEIGH_WINDOW_CLOSED)"
        side_effects:
          - "net_weight_lbs = gross - tare (calculation net_weight_and_trash_deduction step 1)"
          - "booking CONFIRMED -> IN_USE"
          - "increments LoadTicket.version by 1"
      - from: WEIGHED
        to: REWEIGHING
        trigger: "POST /api/tickets/{ticket_id}/reweigh"
        actor: STATION_OPERATOR
        preconditions:
          - "logical clock within the booking weigh window (ERR_WEIGH_WINDOW_CLOSED)"
        side_effects:
          - "gross_weight_lbs, tare_weight_lbs, net_weight_lbs cleared to null"
          - "increments LoadTicket.version by 1"
      - from: REWEIGHING
        to: WEIGHED
        trigger: "POST /api/tickets/{ticket_id}/weigh"
        actor: STATION_OPERATOR
        preconditions:
          - "tare_weight_lbs > 0 AND gross_weight_lbs > tare_weight_lbs (ERR_INVALID_WEIGHTS)"
          - "logical clock within the booking weigh window (ERR_WEIGH_WINDOW_CLOSED)"
        side_effects:
          - "net_weight_lbs recomputed from new weights"
          - "increments LoadTicket.version by 1"
      - from: WEIGHED
        to: SAMPLED
        trigger: "system (first QualitySample for this ticket reaches RESULT_RECORDED)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_trash_pct / provisional_sugar_pct copied from that sample"
          - "provisional_factor, provisional_adjusted_net_tons, provisional_value_cents computed (calculations net_weight_and_trash_deduction, payment_factor variant PROVISIONAL, provisional_value)"
          - "increments LoadTicket.version by 1"
      - from: SAMPLED
        to: WEIGHED
        trigger: "system (the sample that triggered SAMPLED is invalidated and no other RESULT_RECORDED or VERIFIED sample remains)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_* fields cleared to null"
          - "increments LoadTicket.version by 1"
      - from: SAMPLED
        to: ACCEPTED
        trigger: "POST /api/tickets/{ticket_id}/accept"
        actor: STATION_OPERATOR
        preconditions:
          - "At least one VERIFIED sample with sample_type == LAB_VERIFY exists for the ticket (ERR_LAB_SAMPLE_REQUIRED)"
          - "final_trash_pct <= 20.00 exactly (boundary: 20.00 allowed, 20.01 rejected) (ERR_TRASH_LIMIT_EXCEEDED)"
          - "Target pile fill_status == FILLING (ERR_PILE_NOT_FILLING)"
          - "pile.station_id == ticket.station_id (ERR_PILE_STATION_MISMATCH)"
          - "pile.stored_lbs + adjusted_net_lbs_final <= pile.capacity_tons x 2000; equality allowed (ERR_PILE_CAPACITY_EXCEEDED)"
        side_effects:
          - "final_trash_pct / final_sugar_pct copied from the latest VERIFIED LAB_VERIFY sample (by created_at)"
          - "final_factor, adjusted_net_tons_final, adjusted_net_lbs_final computed (calculations net_weight_and_trash_deduction, payment_factor variant FINAL)"
          - "PileAllocation created (allocated_lbs = adjusted_net_lbs_final, remaining_lbs = allocated_lbs, status ACTIVE)"
          - "pile.stored_lbs += adjusted_net_lbs_final; station.received_tons and station.stored_tons recomputed"
          - "booking IN_USE -> COMPLETED; station.booked_tons -= booking.estimated_tons"
          - "increments LoadTicket.version by 1"
      - from: SAMPLED
        to: REJECTED
        trigger: "POST /api/tickets/{ticket_id}/reject"
        actor: STATION_OPERATOR
        preconditions:
          - "provisional_trash_pct > 20.00 (ERR_INVALID_STATE when load is within the trash limit)"
        side_effects:
          - "booking remains IN_USE (member may deliver a replacement load on the same booking)"
          - "increments LoadTicket.version by 1"
      - from: CREATED
        to: VOIDED
        trigger: "POST /api/tickets/{ticket_id}/void"
        actor: STATION_OPERATOR
        preconditions: []
        side_effects:
          - "increments LoadTicket.version by 1"
      - from: WEIGHED
        to: VOIDED
        trigger: "POST /api/tickets/{ticket_id}/void"
        actor: STATION_OPERATOR
        preconditions: []
        side_effects:
          - "increments LoadTicket.version by 1"
      - from: SAMPLED
        to: VOIDED
        trigger: "POST /api/tickets/{ticket_id}/void"
        actor: STATION_OPERATOR
        preconditions: []
        side_effects:
          - "increments LoadTicket.version by 1"
      - from: ACCEPTED
        to: CREDITED
        trigger: "POST /api/tickets/{ticket_id}/credit"
        actor: POOL_ACCOUNTANT
        preconditions:
          - "pool of the ticket's campaign has status ACCRUING (ERR_POOL_NOT_ACCRUING)"
          - "pool.accrued_provisional_cents + ticket.provisional_value_cents <= pool.estimated_pool_value_cents x 1.10 (ERR_POOL_ACCRUAL_CAP_EXCEEDED)"
        side_effects:
          - "pool.accrued_provisional_cents += provisional_value_cents"
          - "increments LoadTicket.version by 1 and PaymentPool.version by 1"

  - entity: QualitySample
    initial_state: COLLECTED
    terminal_states: [VERIFIED]
    transitions:
      - from: COLLECTED
        to: RESULT_RECORDED
        trigger: "POST /api/samples/{sample_id}/record-result"
        actor: QUALITY_TECH
        preconditions:
          - "ticket.status in {WEIGHED, SAMPLED} (ERR_INVALID_STATE)"
        side_effects:
          - "sugar_pct, trash_pct stored; recorded_by_user_id = X-User-ID"
          - "if ticket was WEIGHED: ticket -> SAMPLED with provisional recomputation"
          - "increments QualitySample.version by 1"
      - from: RESULT_RECORDED
        to: VERIFIED
        trigger: "POST /api/samples/{sample_id}/verify"
        actor: QUALITY_TECH
        preconditions:
          - "sample_type == LAB_VERIFY (ERR_INVALID_STATE for STATION_QUICK)"
          - "X-User-ID != recorded_by_user_id (segregation of duties) (ERR_SOD_VIOLATION)"
        side_effects:
          - "increments QualitySample.version by 1"
      - from: RESULT_RECORDED
        to: COLLECTED
        trigger: "POST /api/samples/{sample_id}/invalidate"
        actor: QUALITY_TECH
        preconditions: []
        side_effects:
          - "sugar_pct, trash_pct, recorded_by_user_id cleared to null"
          - "if this sample was the ticket's SAMPLED trigger and no other RESULT_RECORDED/VERIFIED sample remains: ticket SAMPLED -> WEIGHED with provisional_* cleared"
          - "increments QualitySample.version by 1"

  - entity: StoragePile
    field: fill_status
    initial_state: FILLING
    terminal_states: [EMPTY]
    transitions:
      - from: FILLING
        to: SEALED
        trigger: "POST /api/piles/{pile_id}/seal"
        actor: STATION_OPERATOR
        preconditions: []
        side_effects:
          - "sealed_stored_lbs = current stored_lbs snapshot; sealed_at = logical clock"
          - "increments StoragePile.version by 1"
      - from: SEALED
        to: RECLAIMING
        trigger: "POST /api/piles/{pile_id}/begin-reclaim"
        actor: STATION_OPERATOR
        preconditions:
          - "No StorageLossEvent for this pile in DRAFT or CONFIRMED whose blackout window contains the logical clock with INCLUSIVE bounds: window_start <= now <= window_end (ERR_SURVEY_BLACKOUT)"
        side_effects:
          - "reclaim_started_at = logical clock"
          - "increments StoragePile.version by 1"
      - from: RECLAIMING
        to: EMPTY
        trigger: "POST /api/piles/{pile_id}/complete-reclaim"
        actor: STATION_OPERATOR
        preconditions:
          - "shipped_lbs == sum of remaining_lbs over the pile's ACTIVE allocations (ERR_SHIPPED_WEIGHT_MISMATCH)"
        side_effects:
          - "All of the pile's PileAllocations -> DEPLETED (remaining_lbs preserved as loss-adjusted creditable weight)"
          - "pile.stored_lbs recomputed (becomes 0); station.stored_tons recomputed"
          - "increments StoragePile.version by 1"

  - entity: StoragePile
    field: condition_status
    initial_state: SOUND
    terminal_states: [LOSS_DECLARED]
    transitions:
      - from: SOUND
        to: DETERIORATING
        trigger: "system (a StorageLossEvent for this pile is confirmed with loss_lbs > 0 and cumulative confirmed loss <= 5.00% of sealed_stored_lbs)"
        actor: system
        preconditions: []
        side_effects:
          - "increments StoragePile.version by 1"
      - from: SOUND
        to: LOSS_DECLARED
        trigger: "system (a StorageLossEvent is confirmed with cumulative confirmed loss > 5.00% of sealed_stored_lbs)"
        actor: system
        preconditions: []
        side_effects:
          - "increments StoragePile.version by 1"
      - from: DETERIORATING
        to: LOSS_DECLARED
        trigger: "system (a StorageLossEvent is confirmed pushing cumulative confirmed loss over 5.00% of sealed_stored_lbs)"
        actor: system
        preconditions: []
        side_effects:
          - "increments StoragePile.version by 1"

  - entity: StorageLossEvent
    initial_state: DRAFT
    terminal_states: [ALLOCATED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /api/loss-events/{loss_event_id}/confirm"
        actor: STATION_OPERATOR
        preconditions:
          - "pile.fill_status == SEALED (ERR_INVALID_STATE otherwise; also enforced at loss-event creation)"
          - "method RESURVEY requires measured_remaining_lbs present, >= 0, and loss formula result >= 0 (ERR_MEASURED_WEIGHT_INVALID)"
        side_effects:
          - "loss_lbs computed per deterioration_loss variant selected by method"
          - "pile condition_status recomputed (SOUND -> DETERIORATING / LOSS_DECLARED)"
          - "increments StorageLossEvent.version by 1"
      - from: CONFIRMED
        to: ALLOCATED
        trigger: "POST /api/loss-events/{loss_event_id}/allocate"
        actor: POOL_ACCOUNTANT
        preconditions: []
        side_effects:
          - "loss_lbs distributed across the pile's ACTIVE allocations per calculation loss_allocation (link 1)"
          - "each reduced allocation triggers pile.stored_lbs recompute (link 2)"
          - "pile recompute triggers station.stored_tons recompute (link 3)"
          - "each member's deterioration_loss_lbs incremented by the sum allocated to their allocations"
          - "unallocated_lbs = loss_lbs - total distributed (0 unless total remaining was 0)"
          - "increments StorageLossEvent.version by 1"

  - entity: PaymentPool
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: ACCRUING
        trigger: "POST /api/pools/{pool_id}/open-accrual"
        actor: POOL_ACCOUNTANT
        preconditions:
          - "campaign.status == OPEN (ERR_CAMPAIGN_NOT_OPEN)"
          - "estimated_pool_value_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "increments PaymentPool.version by 1"
      - from: ACCRUING
        to: CLOSED
        trigger: "POST /api/pools/{pool_id}/close"
        actor: POOL_ACCOUNTANT
        preconditions:
          - "campaign.status == CLOSED (ERR_INVALID_STATE)"
          - "no LoadTicket for this campaign in CREATED, WEIGHED, REWEIGHING, SAMPLED, or ACCEPTED (ERR_INVALID_STATE)"
          - "every StoragePile holding allocations from this campaign's tickets is EMPTY (ERR_INVALID_STATE)"
          - "total post-loss sugar pounds over CREDITED tickets > 0 (ERR_POOL_NO_SUGAR)"
        side_effects:
          - "final_price_cents_per_lb computed (calculation final_pool_price)"
          - "campaign CLOSED -> SETTLING"
          - "increments PaymentPool.version by 1"
      - from: CLOSED
        to: SETTLED
        trigger: "system (all SettlementStatements of this pool reach PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "increments PaymentPool.version by 1"

  - entity: PoolInstallment
    initial_state: SCHEDULED
    terminal_states: [ISSUED]
    transitions:
      - from: SCHEDULED
        to: ISSUED
        trigger: "POST /api/installments/{installment_id}/issue"
        actor: POOL_ACCOUNTANT
        preconditions:
          - "pool.status == ACCRUING (ERR_POOL_NOT_ACCRUING)"
        side_effects:
          - "Per-member advances computed per calculation installment_waterfall"
          - "One ADVANCE_CREDIT PaymentLedgerEntry created per member with advance > 0 (member_id, pool_id, installment_id set)"
          - "member.net_ledger_cents recomputed for each paid member"
          - "distributed_amount_cents = sum of created advances"
          - "increments PoolInstallment.version by 1"

  - entity: SettlementStatement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/settlements/{settlement_id}/issue"
        actor: POOL_ACCOUNTANT
        preconditions:
          - "pool.status == CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "advances_posted_cents, final_payment_cents, total_payment_cents computed (calculation final_pool_settlement)"
          - "increments SettlementStatement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /api/settlements/{settlement_id}/dispute"
        actor: MEMBER
        preconditions:
          - "Caller owns the statement (settlement.member_id == X-User-ID) (ERR_FORBIDDEN)"
        side_effects:
          - "increments SettlementStatement.version by 1"
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /api/settlements/{settlement_id}/revise"
        actor: POOL_ACCOUNTANT
        preconditions:
          - "expected_settlement_version == settlement.version (ERR_STALE_VERSION)"
        side_effects:
          - "increments SettlementStatement.version by 1"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /api/settlements/{settlement_id}/acknowledge"
        actor: MEMBER
        preconditions:
          - "Caller owns the statement (settlement.member_id == X-User-ID) (ERR_FORBIDDEN)"
        side_effects:
          - "increments SettlementStatement.version by 1"
      - from: ACKNOWLEDGED
        to: PAID
        trigger: "POST /api/settlements/{settlement_id}/mark-paid"
        actor: POOL_ACCOUNTANT
        preconditions: []
        side_effects:
          - "FINAL_SETTLEMENT PaymentLedgerEntry created (amount = final_payment_cents; settlement_id set)"
          - "TRANSPORT_CREDIT PaymentLedgerEntry created when transport_credit_cents > 0 (amount = transport_credit_cents; settlement_id set)"
          - "member.net_ledger_cents recomputed"
          - "if all settlements of the pool are PAID: pool CLOSED -> SETTLED and campaign SETTLING -> SETTLED"
          - "increments SettlementStatement.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: installment-create-stale-pool
    parent_entity: PaymentPool
    write_endpoint: "POST /api/pools/{pool_id}/installments"
    occ_field: expected_pool_version
    description: |
      Creating a PoolInstallment against a PaymentPool whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created an installment (or otherwise mutated the
      pool) and the current writer's view of the pool is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-revise-stale-version
    parent_entity: SettlementStatement
    write_endpoint: "POST /api/settlements/{settlement_id}/revise"
    occ_field: expected_settlement_version
    description: |
      Revising a disputed SettlementStatement whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just revised the statement and the current writer's
      view of the statement is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: net_weight_and_trash_deduction
    trigger: "ticket weigh (net), ticket transition to SAMPLED (provisional adjusted), ticket accept (final adjusted)"
    algorithm: tiered_pricing
    formula: |
      step 1 (net): net_weight_lbs = gross_weight_lbs - tare_weight_lbs
      step 2 (deduction), parameterized by a trash_pct value t:
        deductible_pct = max(0, t - FREE_TRASH_PCT)
        multiplier = HEAVY_MULTIPLIER if t >= HEAVY_TRASH_PCT else 1.0
        deducted_pct = min(deductible_pct * multiplier, t)
      step 3 (adjusted): adjusted_net_tons = round_half_up(net_weight_lbs / LBS_PER_TON * (1 - deducted_pct/100), 4)
      Provisional basis uses provisional_trash_pct; final basis (accept) uses final_trash_pct.
      adjusted_net_lbs_final = adjusted_net_tons_final * LBS_PER_TON (exact, 4dp tons x 2000).
    input_set: "the ticket being weighed/sampled/accepted"
    constants:
      LBS_PER_TON: 2000
      FREE_TRASH_PCT: 3.00
      HEAVY_TRASH_PCT: 10.00
      HEAVY_MULTIPLIER: 1.5
      REJECT_TRASH_PCT: 20.00
    precision: "tons 4 decimal places round_half_up; percents 2 decimal places"

  - name: payment_factor
    trigger: "ticket transition to SAMPLED (PROVISIONAL), ticket accept (FINAL)"
    algorithm: threshold
    formula: |
      base(s) = 1.00 + (s - REF_SUGAR_PCT) * FACTOR_SLOPE
      PROVISIONAL: clamp(base(provisional_sugar_pct), 0.70, 1.30), round_half_up 4dp
      FINAL: f = base(final_sugar_pct); if final_sugar_pct < LOW_SUGAR_PCT then f = f - LOW_SUGAR_PENALTY; round_half_up(f, 4)
    input_set: "PROVISIONAL: the sample that triggered SAMPLED. FINAL: the latest VERIFIED LAB_VERIFY sample by created_at"
    constants:
      REF_SUGAR_PCT: 16.00
      FACTOR_SLOPE: 0.04
      PROV_CLAMP_MIN: 0.70
      PROV_CLAMP_MAX: 1.30
      LOW_SUGAR_PCT: 13.00
      LOW_SUGAR_PENALTY: 0.05
    precision: "4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "ticket enters SAMPLED (first RESULT_RECORDED sample, any type)"
        difference: "uses that sample's sugar_pct and clamps to [0.70, 1.30]; no low-sugar penalty"
      - name: FINAL
        when: "ticket accepted (latest VERIFIED LAB_VERIFY sample)"
        difference: "unclamped, but applies a 0.05 penalty when sugar < 13.00; typically uses a different sample than PROVISIONAL, so the two values diverge for the same load"

  - name: provisional_value
    trigger: "ticket transition to SAMPLED"
    algorithm: aggregation
    formula: |
      provisional_value_cents = round_half_up(provisional_adjusted_net_tons * campaign.base_price_cents_per_ton * provisional_factor, 0)
    input_set: "the ticket entering SAMPLED and its campaign"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: transport_allowance
    trigger: "settlement generate (per member, per CREDITED ticket)"
    algorithm: tiered_pricing
    formula: |
      rate(member.haul_distance_miles): [0,15) -> 120; [15,40) -> 180; [40,80) -> 240; >= 80 -> 300 (cents per adjusted net ton; bands left-closed, right-open)
      per-ticket allowance_cents = round_half_up(ticket.adjusted_net_tons_final * rate, 0)
      statement transport_credit_cents = SUM of the per-ticket ROUNDED allowances
      ROUNDING ORDER PINNED: round each ticket first, then sum. (Sum-then-round is a different, non-conformant algorithm.)
    input_set: "the member's CREDITED LoadTickets for the campaign"
    constants:
      BAND_1_MAX_MI: 15
      BAND_1_RATE: 120
      BAND_2_MAX_MI: 40
      BAND_2_RATE: 180
      BAND_3_MAX_MI: 80
      BAND_3_RATE: 240
      BAND_4_RATE: 300
    precision: "integer cents per ticket, round_half_up, then summed"

  - name: deterioration_loss
    trigger: "loss-event confirm"
    algorithm: decay_function
    formula: |
      days = floor((survey_at - pile.sealed_at) / 86400)
      TABLE_RATE: loss_lbs = round_half_up(pile.sealed_stored_lbs * DAILY_LOSS_PCT * days, 2)
      RESURVEY: loss_lbs = pile.sealed_stored_lbs - (sum of loss_lbs over this pile's prior CONFIRMED/ALLOCATED events) - measured_remaining_lbs; must be >= 0 (ERR_MEASURED_WEIGHT_INVALID)
    input_set: "the pile and its prior confirmed loss events"
    constants:
      DAILY_LOSS_PCT: 0.0008
      LOSS_DECLARED_PCT: 5.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: TABLE_RATE
        when: "loss event created with method=TABLE_RATE"
        difference: "projects loss from sealed mass and elapsed whole days; independent of any measurement"
      - name: RESURVEY
        when: "loss event created with method=RESURVEY"
        difference: "derives loss from a measured remaining mass; for the same pile state the two variants generally produce different loss_lbs"

  - name: loss_allocation
    trigger: "loss-event allocate"
    algorithm: waterfall_allocation
    formula: |
      candidates = the pile's PileAllocations with status ACTIVE
      total_remaining = sum(remaining_lbs over candidates)
      if total_remaining == 0: distribute nothing; unallocated_lbs = loss_lbs (zero-quantity guard, no division)
      else:
        per allocation a: share_a = floor(loss_lbs * a.remaining_lbs / total_remaining)  (2dp-floor toward zero per pound-cent precision: floor to 2 decimal places)
        remainder = loss_lbs - sum(share_a)
        distribute remainder in 0.01-lb units to allocations ordered by remaining_lbs DESC, tie-break allocation created_at ASC, one unit per pass, largest first
        a.remaining_lbs -= share_a (plus remainder units received)
      Events on the same pile are processed in chronological order of survey_at (tie-break event created_at ASC); each event's allocation reduces remaining_lbs, which is the basis of the next event — evaluation order is pinned and observable.
    input_set: "the CONFIRMED loss event and its pile's ACTIVE allocations"
    constants: {}
    precision: "2 decimal places; shares floored to 2dp; remainder assigned by the pinned order"

  - name: waitlist_promotion
    trigger: "booking CONFIRMED -> CANCELLED, booking IN_USE -> COMPLETED, member suspend cascade"
    algorithm: selector
    formula: |
      eligibility: bookings with status WAITLISTED at the same station whose estimated_tons <= station.booking_capacity_tons - station.booked_tons
      ranking: created_at ASC; tie-break member.member_code ASC
      promote the top-ranked eligible booking to CONFIRMED (booked_tons += estimated_tons), then re-evaluate eligibility with the updated booked_tons; repeat until no eligible booking fits
      fallback: if no eligible booking fits, nothing is promoted (no error)
    input_set: "WAITLISTED bookings at the station whose capacity was just released"
    constants: {}
    precision: "n/a (selection rule)"

  - name: installment_waterfall
    trigger: "installment issue"
    algorithm: waterfall_allocation
    formula: |
      E_m = sum of provisional_value_cents over member m's CREDITED tickets for this campaign (members with E_m == 0 are excluded)
      target = round_half_up(pct_of_estimated/100 * pool.estimated_pool_value_cents, 0)
      raw_m = target * E_m / sum(E)
      floor_m = floor(raw_m)
      remainder_cents = target - sum(floor_m)
      distribute remainder_cents one cent at a time to members ordered by E_m DESC, tie-break member_code ASC
      advance_m = min(floor_m + remainder_received_m, E_m - already_advanced_m)   (already_advanced_m = member's net ADVANCE_CREDIT for this pool)
      any undistributable residual (caps binding) stays in the pool undistributed
    input_set: "members with at least one CREDITED ticket for the campaign at issue time"
    constants: {}
    precision: "integer cents; floors first, remainder by pinned order, caps last"

  - name: final_pool_price
    trigger: "pool close"
    algorithm: aggregation
    formula: |
      per CREDITED ticket t: t.remaining_lbs_total = sum of remaining_lbs over t's PileAllocations
      t.sugar_lbs = round_half_up(t.remaining_lbs_total * t.final_sugar_pct / 100, 2)
      total_sugar_lbs = sum over CREDITED tickets of t.sugar_lbs   (REJECTED, VOIDED, ACCEPTED-not-CREDITED tickets excluded)
      final_price_cents_per_lb = round_half_up(gross_pool_value_cents / total_sugar_lbs, 4)
      total_sugar_lbs == 0 -> ERR_POOL_NO_SUGAR
    input_set: "campaign's LoadTickets with status CREDITED only"
    constants: {}
    precision: "sugar pounds 2dp round_half_up; price 4dp round_half_up"

  - name: final_pool_settlement
    trigger: "settlement generate and issue"
    algorithm: waterfall_allocation
    formula: |
      At generate (per member with >= 1 CREDITED ticket):
        sugar_lbs_m = sum of t.sugar_lbs over the member's CREDITED tickets (same per-ticket computation as final_pool_price)
        raw_gross_m = round_half_up(sugar_lbs_m * pool.final_price_cents_per_lb, 0)
        delta = gross_pool_value_cents - sum(raw_gross_m)
        the member with the largest raw_gross_m (tie-break member_code ASC) absorbs delta: gross_entitlement_cents = raw_gross_m + delta; all others keep raw_gross_m
        transport_credit_cents per calculation transport_allowance
      At issue:
        advances_posted_cents = member's net ADVANCE_CREDIT (ADVANCE_CREDIT + REVERSAL amounts) for this pool
        final_payment_cents = gross_entitlement_cents - advances_posted_cents (may be negative: clawback)
        total_payment_cents = final_payment_cents + transport_credit_cents
      CONSERVATION (pinned): sum over members of advances_posted + final_payment == gross_pool_value_cents exactly.
    input_set: "members with >= 1 CREDITED ticket for the campaign"
    constants: {}
    precision: "integer cents, round_half_up; rounding delta assigned to largest entitlement"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: MEMBER role may only read/act on resources whose member_id equals X-User-ID (member self-GET, own bookings, own tickets, own settlements); SoD: sample verify requires X-User-ID != recorded_by_user_id"
    error_id: ERR_FORBIDDEN | ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "member-scoped reads, booking reschedule/cancel, settlement dispute/acknowledge, sample verify"
  - priority: 4
    category: existence
    check: "Path ids and body foreign-key ids (booking_id, pile_id, ticket_id, campaign_id, station_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with ids"
  - priority: 5
    category: state
    check: "Target resource state allows the operation (state machine from-state; ticket creditable only from ACCEPTED; ticket create requires booking CONFIRMED or IN_USE; pool operations require pool/campaign in the required state; pile FILLING for accept; request body well-formed with valid enums and required fields present)"
    error_id: "ERR_INVALID_STATE | ERR_INVALID_REQUEST | ERR_TICKET_NOT_CREDITABLE | ERR_BOOKING_NOT_CONFIRMED | ERR_CAMPAIGN_NOT_OPEN | ERR_POOL_NOT_ACCRUING | ERR_PILE_NOT_FILLING | ERR_LAB_SAMPLE_REQUIRED"
    http_status: "409 | 400"
    applies_to: "all state-transition and create endpoints"
  - priority: 6
    category: business_temporal
    check: "OCC: expected_<parent>_version matches the parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/pools/{pool_id}/installments, POST /api/settlements/{settlement_id}/revise"
  - priority: 7
    category: business_safety
    check: "Member compliance: booking create and ticket create require member.status == ACTIVE"
    error_id: ERR_MEMBER_SUSPENDED
    http_status: 409
    applies_to: "POST /api/bookings, POST /api/tickets, POST /api/bookings/{id}/confirm"
  - priority: 8
    category: business_temporal
    check: "Temporal windows: booking slot inside campaign window (ERR_SLOT_OUTSIDE_WINDOW); weigh within slot window +/- grace (ERR_WEIGH_WINDOW_CLOSED); station slot half-open overlap (ERR_SLOT_OVERLAP); pile survey blackout inclusive containment (ERR_SURVEY_BLACKOUT)"
    error_id: "ERR_SLOT_OUTSIDE_WINDOW | ERR_WEIGH_WINDOW_CLOSED | ERR_SLOT_OVERLAP | ERR_SURVEY_BLACKOUT"
    http_status: "422 | 409"
    applies_to: "booking create/reschedule/confirm, ticket weigh/reweigh, pile begin-reclaim"
  - priority: 9
    category: business_constraint
    check: "Capacity/referential/arithmetic: station booking capacity overflow routes the booking to WAITLISTED (no error); pile capacity (ERR_PILE_CAPACITY_EXCEEDED); pile station matches ticket station (ERR_PILE_STATION_MISMATCH); weights sane (ERR_INVALID_WEIGHTS); trash limit (ERR_TRASH_LIMIT_EXCEEDED); shipped == remaining (ERR_SHIPPED_WEIGHT_MISMATCH); measured remaining sane (ERR_MEASURED_WEIGHT_INVALID)"
    error_id: "ERR_PILE_CAPACITY_EXCEEDED | ERR_PILE_STATION_MISMATCH | ERR_INVALID_WEIGHTS | ERR_TRASH_LIMIT_EXCEEDED | ERR_SHIPPED_WEIGHT_MISMATCH | ERR_MEASURED_WEIGHT_INVALID"
    http_status: "409 | 422"
    applies_to: "booking confirm, ticket weigh/accept, pile complete-reclaim, loss-event confirm"
  - priority: 10
    category: business_fiscal
    check: "Fiscal: pool accrual cap at credit (ERR_POOL_ACCRUAL_CAP_EXCEEDED); installment pct in (0,100] (ERR_INSTALLMENT_PCT_INVALID); pool close requires positive sugar total (ERR_POOL_NO_SUGAR); reversal only of unreversed ADVANCE_CREDIT while pool ACCRUING (ERR_REVERSAL_NOT_ALLOWED)"
    error_id: "ERR_POOL_ACCRUAL_CAP_EXCEEDED | ERR_INSTALLMENT_PCT_INVALID | ERR_POOL_NO_SUGAR | ERR_REVERSAL_NOT_ALLOWED"
    http_status: "409 | 422"
    applies_to: "ticket credit, installment create, pool close, ledger reverse"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (60 endpoints)
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [COOP_ADMIN]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Campaign ---
  - method: POST
    path: "/api/campaigns"
    description: "Create a campaign (starts OPEN); auto-creates its PaymentPool in OPEN"
    roles: [COOP_ADMIN]
    code: 201
    input: [name, window_start, window_end, base_price_cents_per_ton]
    output: Campaign
    side_effects: ["PaymentPool created (status OPEN, campaign_id set)"]
  - method: GET
    path: "/api/campaigns/{campaign_id}"
    description: "Get a campaign"
    roles: [COOP_ADMIN, STATION_OPERATOR, QUALITY_TECH, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/api/campaigns/{campaign_id}/close"
    description: "Close a campaign (OPEN -> CLOSED); cancels REQUESTED/WAITLISTED bookings"
    roles: [COOP_ADMIN]
    code: 200
    input: []
    output: Campaign
    side_effects: ["booking cascade per Campaign state machine", "increments Campaign.version by 1"]
  - method: GET
    path: "/api/campaigns/{id}/pools"
    description: "List the campaign's pools (0 or 1 element)"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: PaymentPool[]
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/api/members"
    description: "Register a cooperative member (starts ACTIVE)"
    roles: [COOP_ADMIN]
    code: 201
    input: [name, member_code, haul_distance_miles]
    output: Member
    side_effects: []
  - method: GET
    path: "/api/members/{member_id}"
    description: "Get a member; MEMBER role may only read its own id"
    roles: [COOP_ADMIN, STATION_OPERATOR, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: "/api/members/{member_id}/suspend"
    description: "Suspend a member (ACTIVE -> SUSPENDED); cascades booking cancellations and waitlist promotion"
    roles: [COOP_ADMIN]
    code: 200
    input: []
    output: Member
    side_effects: ["member bookings in REQUESTED/WAITLISTED/CONFIRMED -> CANCELLED; CONFIRMED cancellations release booked_tons and trigger waitlist_promotion", "increments Member.version by 1"]
  - method: POST
    path: "/api/members/{member_id}/reinstate"
    description: "Reinstate a suspended member (SUSPENDED -> ACTIVE)"
    roles: [COOP_ADMIN]
    code: 200
    input: []
    output: Member
    side_effects: ["increments Member.version by 1"]

  # --- Station ---
  - method: POST
    path: "/api/stations"
    description: "Create a receiving station"
    roles: [COOP_ADMIN]
    code: 201
    input: [name, booking_capacity_tons]
    output: ReceivingStation
    side_effects: []
  - method: GET
    path: "/api/stations/{station_id}"
    description: "Get a station with computed booked/received/stored tons"
    roles: [COOP_ADMIN, STATION_OPERATOR, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: ReceivingStation
    side_effects: []
  - method: GET
    path: "/api/stations/{id}/piles"
    description: "List piles at a station"
    roles: [COOP_ADMIN, STATION_OPERATOR, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: StoragePile[]
    side_effects: []

  # --- Pile ---
  - method: POST
    path: "/api/piles"
    description: "Create a storage pile (FILLING / SOUND)"
    roles: [STATION_OPERATOR]
    code: 201
    input: [station_id, capacity_tons]
    output: StoragePile
    side_effects: []
  - method: GET
    path: "/api/piles/{pile_id}"
    description: "Get a pile"
    roles: [COOP_ADMIN, STATION_OPERATOR, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: StoragePile
    side_effects: []
  - method: POST
    path: "/api/piles/{pile_id}/seal"
    description: "Seal a pile (FILLING -> SEALED); snapshots sealed_stored_lbs and sealed_at"
    roles: [STATION_OPERATOR]
    code: 200
    input: []
    output: StoragePile
    side_effects: ["sealed_stored_lbs = stored_lbs; sealed_at = logical clock", "increments StoragePile.version by 1"]
  - method: POST
    path: "/api/piles/{pile_id}/begin-reclaim"
    description: "Begin reclaim (SEALED -> RECLAIMING); blocked by inclusive survey blackout windows"
    roles: [STATION_OPERATOR]
    code: 200
    input: []
    output: StoragePile
    side_effects: ["reclaim_started_at = logical clock", "increments StoragePile.version by 1"]
  - method: POST
    path: "/api/piles/{pile_id}/complete-reclaim"
    description: "Complete reclaim (RECLAIMING -> EMPTY); shipped_lbs must equal remaining allocation mass"
    roles: [STATION_OPERATOR]
    code: 200
    input: [shipped_lbs]
    output: StoragePile
    side_effects: ["allocations -> DEPLETED", "stored_lbs recomputed", "increments StoragePile.version by 1"]
  - method: GET
    path: "/api/piles/{id}/loss-events"
    description: "List loss events for a pile"
    roles: [COOP_ADMIN, STATION_OPERATOR, POOL_ACCOUNTANT]
    code: 200
    input: []
    output: StorageLossEvent[]
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/api/bookings"
    description: "Member creates a harvest booking (REQUESTED); member_id derived from X-User-ID"
    roles: [MEMBER]
    code: 201
    input: [campaign_id, station_id, slot_start, slot_end, estimated_tons]
    output: HarvestBooking
    side_effects: []
  - method: GET
    path: "/api/bookings/{booking_id}"
    description: "Get a booking; MEMBER role only for own bookings"
    roles: [COOP_ADMIN, STATION_OPERATOR, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: HarvestBooking
    side_effects: []
  - method: GET
    path: "/api/bookings"
    description: "List bookings with filters"
    roles: [COOP_ADMIN, STATION_OPERATOR, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: ["member_id?", "station_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: HarvestBooking[]
    side_effects: []
  - method: POST
    path: "/api/bookings/{booking_id}/confirm"
    description: "Confirm a REQUESTED booking; capacity overflow routes to WAITLISTED"
    roles: [SCHEDULER]
    code: 200
    input: []
    output: HarvestBooking
    side_effects: ["station.booked_tons += estimated_tons on CONFIRMED", "increments HarvestBooking.version by 1"]
  - method: POST
    path: "/api/bookings/{booking_id}/reschedule"
    description: "Owning member moves a CONFIRMED booking back to REQUESTED with a new slot"
    roles: [MEMBER]
    code: 200
    input: [slot_start, slot_end]
    output: HarvestBooking
    side_effects: ["station.booked_tons -= estimated_tons", "increments HarvestBooking.version by 1"]
  - method: POST
    path: "/api/bookings/{booking_id}/cancel"
    description: "Cancel a booking from REQUESTED, WAITLISTED, or CONFIRMED"
    roles: [MEMBER, SCHEDULER]
    code: 200
    input: []
    output: HarvestBooking
    side_effects: ["CONFIRMED cancel releases booked_tons and triggers waitlist_promotion", "increments HarvestBooking.version by 1"]

  # --- Ticket ---
  - method: POST
    path: "/api/tickets"
    description: "Create a load ticket against a CONFIRMED or IN_USE booking"
    roles: [STATION_OPERATOR]
    code: 201
    input: [booking_id]
    output: LoadTicket
    side_effects: ["member_id/station_id copied from booking"]
  - method: GET
    path: "/api/tickets/{ticket_id}"
    description: "Get a ticket; MEMBER role only for own tickets"
    roles: [COOP_ADMIN, STATION_OPERATOR, QUALITY_TECH, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: LoadTicket
    side_effects: []
  - method: GET
    path: "/api/tickets"
    description: "List tickets with filters and pagination"
    roles: [COOP_ADMIN, STATION_OPERATOR, QUALITY_TECH, SCHEDULER, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: ["booking_id?", "member_id?", "station_id?", "status?", "limit?", "offset?"]
    output: LoadTicket[]
    side_effects: []
  - method: POST
    path: "/api/tickets/{ticket_id}/weigh"
    description: "Weigh a ticket (CREATED->WEIGHED or REWEIGHING->WEIGHED)"
    roles: [STATION_OPERATOR]
    code: 200
    input: [gross_weight_lbs, tare_weight_lbs]
    output: LoadTicket
    side_effects: ["net_weight_lbs computed", "booking CONFIRMED -> IN_USE on first weigh", "increments LoadTicket.version by 1"]
  - method: POST
    path: "/api/tickets/{ticket_id}/reweigh"
    description: "Flag scale error (WEIGHED -> REWEIGHING); clears weights"
    roles: [STATION_OPERATOR]
    code: 200
    input: []
    output: LoadTicket
    side_effects: ["weights and net cleared to null", "increments LoadTicket.version by 1"]
  - method: POST
    path: "/api/tickets/{ticket_id}/accept"
    description: "Accept a SAMPLED ticket into a pile; computes final factor and creates the PileAllocation"
    roles: [STATION_OPERATOR]
    code: 200
    input: [pile_id]
    output: LoadTicket
    side_effects: ["final_* computed from latest VERIFIED LAB_VERIFY sample", "PileAllocation created", "pile.stored_lbs updated", "station.received_tons/stored_tons recomputed", "booking IN_USE -> COMPLETED", "increments LoadTicket.version by 1"]
  - method: POST
    path: "/api/tickets/{ticket_id}/reject"
    description: "Reject a SAMPLED ticket whose provisional trash exceeds 20.00"
    roles: [STATION_OPERATOR]
    code: 200
    input: ["reason?"]
    output: LoadTicket
    side_effects: ["increments LoadTicket.version by 1"]
  - method: POST
    path: "/api/tickets/{ticket_id}/void"
    description: "Void a ticket from CREATED, WEIGHED, or SAMPLED"
    roles: [STATION_OPERATOR]
    code: 200
    input: ["reason?"]
    output: LoadTicket
    side_effects: ["increments LoadTicket.version by 1"]
  - method: POST
    path: "/api/tickets/{ticket_id}/credit"
    description: "Credit an ACCEPTED ticket to the pool (ACCEPTED -> CREDITED)"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: []
    output: LoadTicket
    side_effects: ["pool.accrued_provisional_cents += provisional_value_cents", "increments LoadTicket.version by 1 and PaymentPool.version by 1"]

  # --- Sample ---
  - method: POST
    path: "/api/samples"
    description: "Collect a quality sample for a ticket"
    roles: [QUALITY_TECH]
    code: 201
    input: [ticket_id, sample_type]
    output: QualitySample
    side_effects: []
  - method: POST
    path: "/api/samples/{sample_id}/record-result"
    description: "Record sugar/trash results (COLLECTED -> RESULT_RECORDED); may drive ticket WEIGHED -> SAMPLED"
    roles: [QUALITY_TECH]
    code: 200
    input: [sugar_pct, trash_pct]
    output: QualitySample
    side_effects: ["recorded_by_user_id = X-User-ID", "ticket SAMPLED transition + provisional computation when first recorded sample", "increments QualitySample.version by 1"]
  - method: POST
    path: "/api/samples/{sample_id}/verify"
    description: "Verify a LAB_VERIFY sample (RESULT_RECORDED -> VERIFIED); verifier must differ from recorder"
    roles: [QUALITY_TECH]
    code: 200
    input: []
    output: QualitySample
    side_effects: ["increments QualitySample.version by 1"]
  - method: POST
    path: "/api/samples/{sample_id}/invalidate"
    description: "Invalidate a recorded result (RESULT_RECORDED -> COLLECTED)"
    roles: [QUALITY_TECH]
    code: 200
    input: []
    output: QualitySample
    side_effects: ["result fields cleared", "ticket may revert SAMPLED -> WEIGHED", "increments QualitySample.version by 1"]
  - method: GET
    path: "/api/tickets/{id}/samples"
    description: "List samples for a ticket"
    roles: [COOP_ADMIN, STATION_OPERATOR, QUALITY_TECH, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: QualitySample[]
    side_effects: []

  # --- Pool ---
  - method: GET
    path: "/api/pools/{pool_id}"
    description: "Get a pool (includes version for OCC)"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: PaymentPool
    side_effects: []
  - method: POST
    path: "/api/pools/{pool_id}/open-accrual"
    description: "Open accrual (OPEN -> ACCRUING) declaring the estimated pool value"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: [estimated_pool_value_cents]
    output: PaymentPool
    side_effects: ["increments PaymentPool.version by 1"]
  - method: POST
    path: "/api/pools/{pool_id}/close"
    description: "Close the pool (ACCRUING -> CLOSED) declaring gross value; computes final price"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: [gross_pool_value_cents]
    output: PaymentPool
    side_effects: ["final_price_cents_per_lb computed", "campaign CLOSED -> SETTLING", "increments PaymentPool.version by 1"]
  - method: POST
    path: "/api/pools/{id}/installments"
    description: "Create a pool installment (OCC-guarded by expected_pool_version)"
    roles: [POOL_ACCOUNTANT]
    code: 201
    input: [pct_of_estimated, expected_pool_version]
    output: PoolInstallment
    side_effects: ["target_amount_cents computed", "increments PaymentPool.version by 1"]
  - method: GET
    path: "/api/pools/{id}/installments"
    description: "List installments of a pool"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: PoolInstallment[]
    side_effects: []

  # --- Installment ---
  - method: POST
    path: "/api/installments/{installment_id}/issue"
    description: "Issue a SCHEDULED installment; creates ADVANCE_CREDIT ledger entries per installment_waterfall"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: []
    output: PoolInstallment
    side_effects: ["ADVANCE_CREDIT entries created", "member.net_ledger_cents recomputed", "distributed_amount_cents set", "increments PoolInstallment.version by 1"]

  # --- Loss events ---
  - method: POST
    path: "/api/loss-events"
    description: "Create a loss event on a pile (DRAFT); pile must be SEALED"
    roles: [STATION_OPERATOR]
    code: 201
    input: [pile_id, method, survey_at, window_start, window_end, "measured_remaining_lbs?"]
    output: StorageLossEvent
    side_effects: []
  - method: POST
    path: "/api/loss-events/{loss_event_id}/confirm"
    description: "Confirm a loss event (DRAFT -> CONFIRMED); computes loss_lbs per method variant; updates pile condition"
    roles: [STATION_OPERATOR]
    code: 200
    input: []
    output: StorageLossEvent
    side_effects: ["loss_lbs computed", "pile condition_status recomputed", "increments StorageLossEvent.version by 1"]
  - method: POST
    path: "/api/loss-events/{loss_event_id}/allocate"
    description: "Allocate a confirmed loss across pile allocations (CONFIRMED -> ALLOCATED); cascades to pile, station, members"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: []
    output: StorageLossEvent
    side_effects: ["allocation.remaining_lbs reduced per loss_allocation", "pile.stored_lbs recomputed", "station.stored_tons recomputed", "member.deterioration_loss_lbs incremented", "increments StorageLossEvent.version by 1"]

  # --- Pile allocations ---
  - method: GET
    path: "/api/pile-allocations/{allocation_id}"
    description: "Get a pile allocation"
    roles: [COOP_ADMIN, STATION_OPERATOR, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: PileAllocation
    side_effects: []
  - method: GET
    path: "/api/pile-allocations"
    description: "List pile allocations with filters"
    roles: [COOP_ADMIN, STATION_OPERATOR, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: ["ticket_id?", "pile_id?", "member_id?", "limit?", "offset?"]
    output: PileAllocation[]
    side_effects: []

  # --- Ledger ---
  - method: GET
    path: "/api/ledger-entries/{entry_id}"
    description: "Get a ledger entry"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: PaymentLedgerEntry
    side_effects: []
  - method: GET
    path: "/api/ledger-entries"
    description: "List ledger entries with filters"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: ["member_id?", "pool_id?", "installment_id?", "settlement_id?", "kind?", "reversal_of_id?", "limit?", "offset?"]
    output: PaymentLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/api/ledger-entries/{entry_id}/reverse"
    description: "Reverse an unreversed ADVANCE_CREDIT entry while its pool is ACCRUING; creates a REVERSAL entry"
    roles: [POOL_ACCOUNTANT]
    code: 201
    input: []
    output: PaymentLedgerEntry
    side_effects: ["REVERSAL entry created with amount = -original.amount_cents and reversal_of_id = original.id", "member.net_ledger_cents recomputed"]

  # --- Settlements ---
  - method: POST
    path: "/api/settlements/generate"
    description: "Generate DRAFT settlement statements for all members with CREDITED tickets in the campaign"
    roles: [POOL_ACCOUNTANT]
    code: 201
    input: [campaign_id]
    output: SettlementStatement[]
    side_effects: ["sugar_lbs/price/gross_entitlement/transport computed per final_pool_settlement and transport_allowance"]
  - method: GET
    path: "/api/settlements/{settlement_id}"
    description: "Get a settlement statement; MEMBER role only for own statements"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: []
  - method: GET
    path: "/api/settlements"
    description: "List settlement statements with filters"
    roles: [COOP_ADMIN, POOL_ACCOUNTANT, MEMBER]
    code: 200
    input: ["member_id?", "campaign_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: SettlementStatement[]
    side_effects: []
  - method: POST
    path: "/api/settlements/{settlement_id}/issue"
    description: "Issue a DRAFT statement (computes advances_posted and final_payment)"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["advances_posted_cents/final_payment_cents/total_payment_cents computed", "increments SettlementStatement.version by 1"]
  - method: POST
    path: "/api/settlements/{settlement_id}/dispute"
    description: "Owning member disputes an ISSUED statement"
    roles: [MEMBER]
    code: 200
    input: ["reason?"]
    output: SettlementStatement
    side_effects: ["increments SettlementStatement.version by 1"]
  - method: POST
    path: "/api/settlements/{settlement_id}/revise"
    description: "Pull a DISPUTED statement back to DRAFT (OCC-guarded by expected_settlement_version)"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: [expected_settlement_version, "note?"]
    output: SettlementStatement
    side_effects: ["increments SettlementStatement.version by 1"]
  - method: POST
    path: "/api/settlements/{settlement_id}/acknowledge"
    description: "Owning member acknowledges an ISSUED statement"
    roles: [MEMBER]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["increments SettlementStatement.version by 1"]
  - method: POST
    path: "/api/settlements/{settlement_id}/mark-paid"
    description: "Mark an ACKNOWLEDGED statement paid; posts FINAL_SETTLEMENT and TRANSPORT_CREDIT ledger entries"
    roles: [POOL_ACCOUNTANT]
    code: 200
    input: []
    output: SettlementStatement
    side_effects: ["FINAL_SETTLEMENT and TRANSPORT_CREDIT entries created", "member.net_ledger_cents recomputed", "pool/campaign compound transition to SETTLED when all statements PAID", "increments SettlementStatement.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog (29 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or MEMBER acting on a resource whose member_id differs from X-User-ID" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Sample verify attempted by the same X-User-ID that recorded the result" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced body id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed value, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation: trigger not available from current state, terminal-state lockdown, pool/campaign/pile/booking in wrong state where no domain error applies" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version on an OCC-guarded write" }
  - { id: ERR_CAMPAIGN_NOT_OPEN, http: 409, condition: "Operation requires campaign.status == OPEN (booking create/confirm, pool open-accrual)" }
  - { id: ERR_BOOKING_NOT_CONFIRMED, http: 409, condition: "Ticket create requires booking status CONFIRMED or IN_USE" }
  - { id: ERR_TICKET_NOT_CREDITABLE, http: 409, condition: "Credit attempted on a ticket not in ACCEPTED state" }
  - { id: ERR_POOL_NOT_ACCRUING, http: 409, condition: "Operation requires pool.status == ACCRUING (ticket credit, installment issue)" }
  - { id: ERR_PILE_NOT_FILLING, http: 409, condition: "Ticket accept requires pile fill_status == FILLING" }
  - { id: ERR_LAB_SAMPLE_REQUIRED, http: 409, condition: "Ticket accept requires at least one VERIFIED LAB_VERIFY sample" }
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "Member is SUSPENDED; booking create/confirm and ticket create forbidden" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 422, condition: "Booking slot not fully inside the campaign harvest window" }
  - { id: ERR_WEIGH_WINDOW_CLOSED, http: 409, condition: "Logical clock outside [slot_start - 1800s, slot_end + 3600s] at weigh/reweigh" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open slot overlap with another CONFIRMED booking at the same station; adjacency allowed" }
  - { id: ERR_SURVEY_BLACKOUT, http: 409, condition: "begin-reclaim while a DRAFT/CONFIRMED loss event's inclusive blackout window contains the logical clock" }
  - { id: ERR_PILE_CAPACITY_EXCEEDED, http: 409, condition: "Accept would push pile.stored_lbs above capacity_tons x 2000; equality allowed" }
  - { id: ERR_INVALID_WEIGHTS, http: 422, condition: "tare_weight_lbs <= 0 or gross_weight_lbs <= tare_weight_lbs" }
  - { id: ERR_TRASH_LIMIT_EXCEEDED, http: 422, condition: "Accept attempted with final_trash_pct > 20.00 (20.00 exactly is allowed)" }
  - { id: ERR_PILE_STATION_MISMATCH, http: 422, condition: "pile.station_id != ticket.station_id at accept" }
  - { id: ERR_SHIPPED_WEIGHT_MISMATCH, http: 422, condition: "complete-reclaim shipped_lbs != sum of remaining_lbs over the pile's ACTIVE allocations" }
  - { id: ERR_MEASURED_WEIGHT_INVALID, http: 422, condition: "RESURVEY event missing measured_remaining_lbs, or computed loss would be negative" }
  - { id: ERR_POOL_ACCRUAL_CAP_EXCEEDED, http: 409, condition: "Credit would push accrued_provisional_cents above 110% of estimated_pool_value_cents" }
  - { id: ERR_INSTALLMENT_PCT_INVALID, http: 422, condition: "pct_of_estimated <= 0 or > 100" }
  - { id: ERR_POOL_NO_SUGAR, http: 422, condition: "Pool close with zero total post-loss sugar pounds over CREDITED tickets" }
  - { id: ERR_REVERSAL_NOT_ALLOWED, http: 409, condition: "Reverse attempted on a non-ADVANCE_CREDIT entry, an already-reversed entry, or while pool is not ACCRUING" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: COOP_ADMIN
    description: "Cooperative administrator; manages campaigns, members, stations, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/campaigns, POST /api/campaigns/{id}/close"
      - "POST /api/members, POST /api/members/{id}/suspend, POST /api/members/{id}/reinstate"
      - "POST /api/stations"
      - "POST /api/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: SCHEDULER
    description: "Member-services scheduler; confirms bookings and manages slots"
    identity: opaque
    exclusive_operations:
      - "POST /api/bookings/{id}/confirm"
    shared_operations: ["POST /api/bookings/{id}/cancel", "all GET endpoints"]
  - name: MEMBER
    description: "Cooperative grower; books own harvest slots, disputes/acknowledges own settlements"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /api/bookings"
      - "POST /api/bookings/{id}/reschedule"
      - "POST /api/settlements/{id}/dispute"
      - "POST /api/settlements/{id}/acknowledge"
    shared_operations: ["POST /api/bookings/{id}/cancel (own only)", "GET endpoints (own resources only)"]
  - name: STATION_OPERATOR
    description: "Weighbridge and piling-ground operator; runs tickets and piles"
    identity: opaque
    exclusive_operations:
      - "POST /api/piles, POST /api/piles/{id}/seal, POST /api/piles/{id}/begin-reclaim, POST /api/piles/{id}/complete-reclaim"
      - "POST /api/tickets, POST /api/tickets/{id}/weigh, POST /api/tickets/{id}/reweigh, POST /api/tickets/{id}/accept, POST /api/tickets/{id}/reject, POST /api/tickets/{id}/void"
      - "POST /api/loss-events, POST /api/loss-events/{id}/confirm"
    shared_operations: ["all GET endpoints"]
  - name: QUALITY_TECH
    description: "Quality laboratory technician; records and verifies samples (recorder may not verify own result)"
    identity: opaque
    exclusive_operations:
      - "POST /api/samples, POST /api/samples/{id}/record-result, POST /api/samples/{id}/verify, POST /api/samples/{id}/invalidate"
    shared_operations: ["all GET endpoints"]
  - name: POOL_ACCOUNTANT
    description: "Cooperative pool accountant; manages pool accrual, installments, loss allocation, ledger reversals, settlements"
    identity: opaque
    exclusive_operations:
      - "POST /api/tickets/{id}/credit"
      - "POST /api/pools/{id}/open-accrual, POST /api/pools/{id}/close, POST /api/pools/{id}/installments"
      - "POST /api/installments/{id}/issue"
      - "POST /api/loss-events/{id}/allocate"
      - "POST /api/ledger-entries/{id}/reverse"
      - "POST /api/settlements/generate, POST /api/settlements/{id}/issue, POST /api/settlements/{id}/revise, POST /api/settlements/{id}/mark-paid"
    shared_operations: ["all GET endpoints"]
