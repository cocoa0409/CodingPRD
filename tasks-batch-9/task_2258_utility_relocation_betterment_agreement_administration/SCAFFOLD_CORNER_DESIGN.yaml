        claim_type: Idempotency
        grounds: ["state_machines.UtilityConflict", "validations[priority=8]"]
        distinguishing_aspect: "certify-cleared is not idempotent: the second call on an already CLEARED conflict must fail with ERR_INVALID_STATE_TRANSITION and must NOT re-run its side effects - so Project.version, Project.open_conflict_count and the determination's FINAL lock are untouched by the rejected replay."
