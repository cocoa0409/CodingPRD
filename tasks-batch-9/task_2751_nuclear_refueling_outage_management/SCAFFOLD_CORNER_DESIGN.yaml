            - call: "POST /work-orders/${wo_x}/rwps"
              payload: { rad_area_id: "${ra_x}", worker_count: 4, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 3 }
              as: RadProtectionPlanner
              captures: { x_flag: "$.data.alara_review_required", x_collective: "$.data.collective_dose_mrem", x_committed: "$.data.committed_dose_mrem" }
            - call: "POST /work-orders/${wo_y}/rwps"
              payload: { rad_area_id: "${ra_y}", worker_count: 4, shielding_factor: 0, planned_start_offset_hours: 0, planned_duration_hours: 2.99 }
              as: RadProtectionPlanner
              captures: { y_flag: "$.data.alara_review_required", y_collective: "$.data.collective_dose_mrem", y_committed: "$.data.committed_dose_mrem" }
          assert:
            - "${x_collective} == 300.00 and ${x_flag} == true — the comparison is inclusive at the constant"
            - "${y_collective} == 299.00 and ${y_flag} == false"
            - "${x_committed} == 360.00 and ${y_committed} == 358.80 — the contingency uplift is applied to both regardless of the flag"
            - "Both permits are DRAFT; the flag is a creation-time property, not an approval-time one"

      - name: emergent_approval_cascade_runs_six_hops_end_to_end
        claim_type: cascading_side_effects
        grounds: ["complexity_profile.complexity_layers", "state_machines.EmergentWorkItem.transitions[REPORTED->APPROVED].side_effects"]
        excluded_because:
          difficulty_instance: emergent_approval_cascade_defers_discretionary_and_voids_permit
          rationale: "That §1.8 transitive_cascade instance walks the whole eight-step dispose cascade — minted work order, minted activity, recomputed projection, posture flip, discretionary deferral, activity cancellation, permit void and dose release — and pins the ordering rule that schedule_posture is not re-evaluated after step 7."

      - name: both_calculation_variants_answer_from_the_same_state
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile.complexity_layers", "calculations.outage_performance_review.variants", "calculations.pool_cell_admission.variants"]
        excluded_because:
          difficulty_instance: performance_index_gross_versus_emergent_adjusted_diverge
          rationale: "That §1.8 dual-variant instance computes both performance indices from one outage's closing state and asserts the delta between them, which is precisely the layer's divergence claim."

      - name: alara_ratio_threshold_is_evaluated_inclusively
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers", "calculations.outage_alara_posture.constants.ALARA_RESTRICTED_RATIO"]
        excluded_because:
          difficulty_instance: alara_ratio_exactly_one_quarter_is_restricted
          rationale: "That §1.8 boundary instance lands the remaining-to-total ratio exactly on 0.25 and asserts RESTRICTED, covering the cumulative threshold boundary for this layer."

      - name: a_release_transaction_resets_the_posture_curve
        claim_type: rate_threshold_triggers
        grounds: ["complexity_profile.complexity_layers", "state_machines.RadiologicalWorkPermit.transitions[APPROVED->VOIDED]"]
        excluded_because:
          difficulty_instance: permit_void_restores_outage_dose_ledger_exactly
          rationale: "That §1.8 compensating-invariant instance voids an approved permit, appends the reversing RELEASE row and shows the posture returning to NORMAL with the held permits released — the layer's reset claim."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: the_post_outage_review_response_already_carries_its_computed_indices
        claim_type: immediate_visibility
