              as: RegistryManager
          assert:
            - "HTTP 200 and data.employment_status == SUSPENDED_FROM_ABSTRACTING and data.assigned_open_case_count == 0"
            - "TumorCase.${case_id}.case_state == IDENTIFIED and assigned_abstractor_id == null"
            - "Abstraction.${abst_id}.abstraction_state == REJECTED (terminal)"
            - "CancerProgram.${prog_id}.open_backlog_count == 1 and identified_case_count == 1 and registry_posture == OPEN"
            - "workload_conservation holds: sum(assigned_open_case_count) == 0 == count(cases with a non-null assigned_abstractor_id)"

      - name: credit_with_no_credit_disposition_leaves_frequency_numerator_untouched
        claim_type: Valid Transition
        grounds:
          - state_machines[ConferenceSession].HELD->NOT_CREDITED
          - calculations.conference_compliance
          - endpoints[POST /cancer-registry/conference-sessions/{sessionId}/credit]
        distinguishing_aspect: |
          The NO_CREDIT fork reaches a terminal state without incrementing anything: credited_on
          stays null and credited_sessions_12mo stays 0, which is exactly what distinguishes it
          from the CREDIT fork on an otherwise identical quorum-passing session.
        test_recipe:
          setup:
            - "One program with a past session held with quorum (10 presented, 8 prospective, three disciplines at 45 minutes)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions"
              payload: { program_id: "${prog_id}", start_at: "2026-07-15T13:00:00Z", end_at: "2026-07-15T14:30:00Z", required_disciplines: ["SURGERY", "MEDICAL_ONCOLOGY", "RADIATION_ONCOLOGY"] }
              as: AccreditationCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-SURG-1", discipline: "SURGERY", attended_minutes: 45, is_required_coordinator: true }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-MEDONC-1", discipline: "MEDICAL_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/attendances"
              payload: { attendee_ref: "DR-RADONC-1", discipline: "RADIATION_ONCOLOGY", attended_minutes: 45 }
              as: AccreditationCoordinator
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/hold"
              payload: { cases_presented_count: 10, prospective_case_count: 8 }
              as: AccreditationCoordinator
          trigger:
            - call: "POST /cancer-registry/conference-sessions/${sess_id}/credit"
              payload: { disposition: "NO_CREDIT", credit_note: "no pathology representation present" }
              as: AccreditationCoordinator
          assert:
            - "HTTP 200 and data.session_state == NOT_CREDITED and data.credited_on == null"
            - "data.quorum_met is still true - NO_CREDIT is an administrative decision, not a quorum failure"
            - "CancerProgram.${prog_id}.credited_sessions_12mo == 0 and required_sessions_12mo == 12"
            - "CancerProgram.${prog_id}.conference_frequency_compliant == false and coordinator_attendance_compliant == false"
            - "a second credit call on the same session fails with ERR_SESSION_NOT_HELD (NOT_CREDITED is terminal)"

      - name: qa_approval_ledger_syncs_program_backlog_and_abstractor_productivity
        claim_type: Side Effect Execution
        grounds:
          - state_machines[TumorCase.case_state].QA_PENDING->COMPLETED
          - calculations.abstractor_productivity
          - calculations.registry_posture
          - entities.CancerProgram.fields.open_backlog_count
        distinguishing_aspect: |
          One qa-decision must reconcile four ledgers in the same response: case COMPLETED with
          completed_on 2026-08-01 and ON_TIME, abstractor workload back to 0 with
          productivity_rate_per_day round(1/21, 2) == 0.05, program open_backlog_count 0 with
          identified_case_count still 1, and posture OPEN.
        test_recipe:
          setup:
            - "One program, author abstractor (target 2 cases/day) and QA reviewer; one case submitted for QA."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Priya Raman", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_q_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], diagnostic_confirmation_code: "POSITIVE_HISTOLOGY", outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
          trigger:
            - call: "POST /cancer-registry/abstractions/${abst_id}/qa-decision"
              payload: { verdict: "APPROVED", reviewer_note: "stage and treatment verified" }
              as: QaReviewer
              as_user_id: "${abs_q_id}"
          assert:
            - "HTTP 200, data.abstraction_state == APPROVED, data.qa_reviewer_user_id == ${abs_q_id}"
            - "TumorCase.${case_id}.case_state == COMPLETED, completed_on == 2026-08-01, timeliness_status == ON_TIME, days_to_due == 153"
            - "Abstractor.${abs_a_id}.assigned_open_case_count == 0, completed_cases_30d == 1, productivity_rate_per_day == 0.05, productivity_status == BELOW"
            - "CancerProgram.${prog_id}.open_backlog_count == 0, overdue_backlog_count == 0, identified_case_count == 1, registry_posture == OPEN"
            - "TumorCase.${case_id}.submission_state is still NOT_SUBMITTED - the second dimension is untouched"

      - name: state_machine_cyclic_rework_loop_cap
        claim_type: Cyclic Loop Termination
        excluded_because:
          difficulty_instance: abstraction_rework_cycle_reenters_draft_twice_then_hits_round_cap
          rationale: |
            The guide's `cyclic` row (loop back plus loop-count termination) is exactly the
            Abstraction DRAFT -> SUBMITTED_FOR_QA -> REWORK_REQUIRED -> DRAFT cycle with
            REWORK_ROUND_MAX 2; the §1.8 instance already drives two full rounds and asserts
            ERR_REWORK_LIMIT_EXCEEDED on the third, so a second corner test would be a copy.

      - name: state_machine_parallel_dimensions_independence
        claim_type: Parallel Dimension Independence
        excluded_because:
          difficulty_instance: case_abstraction_and_submission_dimensions_advance_independently
          rationale: |
            The guide's `parallel` row (independent dimensions change independently, combined
            state correct) maps to the two TumorCase state machines on one row; the §1.8
            instance already holds submission_state SUBMITTED while case_state regresses to
            REWORK_PENDING and asserts both dimensions field by field.

      - name: state_machine_guarded_cross_entity_transition
        claim_type: Guarded Transition
        excluded_because:
          difficulty_instance: case_assignment_gated_by_critical_deficiency_state_on_another_entity
          rationale: |
            The guide's guarded-transition row ("A->B only if entity C is in state X") is the
            assign precondition on registry_posture, which is itself derived from Deficiency
            state; the §1.8 instance already blocks assign with ERR_REGISTRY_FROZEN while a
            CRITICAL deficiency is CITED and unblocks it after the deficiency RESOLVES.

      - name: state_machine_compensation_reverses_side_effects
        claim_type: Compensation
        excluded_because:
          difficulty_instance: discrepancy_points_and_rework_cascade_fully_reversed_by_audit_void
          rationale: |
            The guide's compensation row ("undo transition -> all original side effects reversed,
            no drift") is the CLOSED_FAIL -> VOIDED edge; the §1.8 instance already asserts that
            lifetime_discrepancy_points, audit_fail_streak, assigned_open_case_count, case_state
            and completed_on all return to their exact pre-audit values.

      - name: state_machine_bubble_up_program_posture_from_children
        claim_type: Bubble Up
        excluded_because:
          difficulty_instance: qa_approval_unfreezes_registry_and_releases_held_submission_depth4
          rationale: |
            The guide's bubble-up row (children terminal -> parent auto-transitions) is realised
            as registry_posture re-derivation from child TumorCase/Deficiency aggregates; the
            §1.8 depth-4 cascade instance already asserts the parent posture flip and the
            downstream RegistrySubmission HOLD -> DRAFT restoration in one request.

  # =========================================================================
  # Guide section 3 - From Table 3 (Calculations)  [24 rules, 3 with variants]
  # =========================================================================
  - section: calculations
    instances:

      - name: abstraction_completeness_score_penalizes_one_missing_required_field
        claim_type: Correct Result
        grounds:
          - calculations.abstraction_completeness
          - entities.Abstraction.fields.missing_required_fields
          - entities.Abstraction.fields.completeness_score
          - errors[ERR_ABSTRACTION_INCOMPLETE]
        distinguishing_aspect: |
          On a CLASS_10 case with PATHOLOGIC staging the required set has ten members, so omitting
          diagnostic_confirmation_code alone yields exactly 100 - MISSING_FIELD_PENALTY == 88 with
          missing_required_fields == ["diagnostic_confirmation_code"]; submit-qa must still refuse
          it because the missing set is non-empty even though 88 >= COMPLETENESS_SUBMIT_MIN 85.
        test_recipe:
          setup:
            - "One program, one abstractor, one ASSIGNED CLASS_10 case; the abstraction is posted without diagnostic_confirmation_code."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/abstractors"
              payload: { program_id: "${prog_id}", name: "Dana Reyes", credential: "CTR", productivity_target_cases_per_day: 2, certification_expires_on: "2027-12-31" }
              as: RegistryManager
              captures: { abs_a_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
            - call: "POST /cancer-registry/cases/${case_id}/assign"
              payload: { abstractor_id: "${abs_a_id}" }
              as: RegistryManager
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /cancer-registry/abstractions"
              payload: { case_id: "${case_id}", abstractor_id: "${abs_a_id}", expected_case_version: "${case_v}", stage_source: "PATHOLOGIC", t_category: "T2", n_category: "N0", m_category: "M0", stage_group: "STAGE_II", first_treatment_date: "2026-07-10", treatment_modalities: ["SURGERY"], outcome_status: "ALIVE_NO_EVIDENCE", last_contact_date: "2026-07-20" }
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { abst_id: $.data.id }
            - call: "POST /cancer-registry/abstractions/${abst_id}/submit-qa"
              payload: {}
              as: RegistryAbstractor
              as_user_id: "${abs_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the create response is HTTP 201 with data.completeness_score == 88"
            - "data.missing_required_fields == [\"diagnostic_confirmation_code\"] (exactly one element)"
            - "data.abstraction_state == DRAFT and data.rework_round == 0"
            - "the submit-qa call returns HTTP 422 with data.error_id == ERR_ABSTRACTION_INCOMPLETE"
            - "TumorCase.${case_id}.case_state is still IN_ABSTRACTION (submit-qa did not advance it)"

      - name: follow_up_rate_with_empty_completed_cohort_reports_one_hundred
        claim_type: Input Set Filtering
        grounds:
          - calculations.follow_up_rate
          - endpoints[GET /cancer-registry/programs/{programId}/compliance-summary]
          - entities.CancerProgram.fields.lost_to_follow_up_pct
        distinguishing_aspect: |
          The follow-up denominator admits only COMPLETED analytic cases, so a program whose only
          case is still IDENTIFIED reports 100.0 / 100.0 / 0.0 rather than 0.0 - a backlog case is
          not yet a follow-up failure.
        test_recipe:
          setup:
            - "One program with one IDENTIFIED analytic case and no follow-up contacts."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "PATHOLOGY", expected_monthly_volume: 40 }
              as: RegistryManager
              captures: { src_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources/${src_id}/entries"
              payload: { patient_mrn: "MRN-0001", accession_date: "2026-08-03", primary_site_code: "C50.9", histology_code: "8500/3", behavior_code: "MALIGNANT_3", diagnosis_date: "2026-07-01", first_contact_date: "2026-07-05", diagnosed_at_facility: true, first_treatment_at_facility: true }
              as: RegistryManager
              captures: { entry_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-entries/${entry_id}/reportability-decision"
              payload: { decision: "REPORTABLE", decision_reason_code: "SEER_REPORTABLE_BEHAVIOR" }
              as: RegistryManager
              captures: { case_id: $.data.created_case_id }
          trigger:
            - call: "GET /cancer-registry/programs/${prog_id}/compliance-summary"
              payload: {}
              as: RegistryManager
          assert:
            - "HTTP 200 and data.follow_up_rate_coc_pct == 100.0"
            - "data.follow_up_rate_state_pct == 100.0 and data.lost_to_follow_up_pct == 0.0"
            - "data.open_backlog_count == 1, data.overdue_backlog_count == 0, data.registry_posture == OPEN"
            - "TumorCase.${case_id}.follow_up_status == CURRENT and follow_up_due_date == 2027-07-05 (anchored on first_contact_date 2026-07-05)"

      - name: casefinding_completeness_pct_clamped_at_one_hundred
        claim_type: Precision
        grounds:
          - calculations.casefinding_completeness
          - entities.CasefindingSource.fields.casefinding_completeness_pct
          - entities.CasefindingSource.fields.entries_this_month
        distinguishing_aspect: |
          With expected_monthly_volume 2, the first entry reports 50.0, the second 100.0 and the
          third still 100.0 because the ratio is clamped at 1.0 BEFORE the multiplication - the
          value never reads 150.0.
        test_recipe:
          setup:
            - "One program and one DISEASE_INDEX source expecting 2 entries per month; all accession dates land in the clock's month (August 2026)."
          setup_api_calls:
            - call: "POST /cancer-registry/programs"
              payload: { name: "Northside Cancer Center", coc_program_id: "COC-1456N", annual_analytic_caseload: 300, reference_year: 2018, timeliness_standard_days: 180 }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /cancer-registry/casefinding-sources"
              payload: { program_id: "${prog_id}", source_type: "DISEASE_INDEX", expected_monthly_volume: 2 }
              as: RegistryManager
