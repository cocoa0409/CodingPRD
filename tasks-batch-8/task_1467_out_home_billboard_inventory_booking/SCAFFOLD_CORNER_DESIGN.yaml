            - { call: "POST /api/flights/${flA}/confirm", payload: { expected_campaign_version: "${cvA}" }, as: SalesPlanner }
            - { call: "GET /api/campaigns/${camp}", payload: {}, as: SalesPlanner, captures: { cvB: $.data.version } }
