            - call: "POST /burn-in-runs"
              payload: { cabinet_id: "${cab}", burn_in_chamber_id: "${ch}", window_start: "2026-08-02T00:00:00.000Z", window_end: "2026-08-03T00:00:00.000Z", slots_required: 1, drive_pct: 80, ambient_c: 45.0 }
              as: QAEngineer
              as_user_id: "qa-1"
              captures: { run: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /burn-in-runs/${run}/complete"
              payload: { new_dead_pixel_count: 1, measured_brightness_nits: 4900, measured_uniformity_pct: 95.00 }
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /cabinets/${cab}"
              as: QAEngineer
              as_user_id: "qa-1"
          assert:
            - "trigger call 1 (empty cabinet) -> 200 with total_dead_pixel_count == 0, dead_pixel_ppm == 0.00, as_built_uniformity_score null, baseline_uniformity_score null, occupied_slot_indexes == []"
            - "trigger call 3 (one module installed) -> 200 with total_dead_pixel_count == 1, dead_pixel_ppm == 244.14 (round_half_up(1 / 4096 * 1000000, 2) = 244.140625 -> 244.14), as_built_uniformity_score STILL null because only 1 < MIN_MODULES_FOR_SCORE modules are installed, occupied_slot_indexes == [1]"
            - "after trigger call 4 -> GET /cabinets/${cab} shows as_built_uniformity_score == 97.68: mean 4925, brightness_spread_pct = round_half_up(50 / 4925 * 100, 4) = 1.0152, chroma_spread = round_half_up(0.0002 + 0.0002, 6) = 0.000400, score = round_half_up(100 - 1.5 * 1.0152 - 2000 * 0.000400, 2) = round_half_up(97.6772, 2) = 97.68; baseline_uniformity_score is still null and occupied_slot_indexes == [1, 2]"
            - "trigger call 7 -> 200 and trigger call 8 shows dead_pixel_ppm == 488.28: total_dead_pixel_count == 2 = 1 module pixel + the run's new_dead_pixel_count 1, round_half_up(2 / 4096 * 1000000, 2) = 488.28125 -> 488.28, which is <= dead_pixel_ppm_limit 500.00 so the run PASSES"
            - "trigger call 8 -> baseline_uniformity_score == 97.68 and baseline_module_ids == [${m1}, ${m2}] (created_at ASC), frozen at the PASS instant, while as_built_uniformity_score is also 97.68 — identical until something moves"
            - "trigger call 8 -> cabinet_state == BURN_IN_PASSED and the module brightness values themselves are unchanged (GET /modules/${m1} still reads 4900)"

      - name: run_abort_is_offered_only_while_the_run_is_scheduled
        claim_type: conditional_action
        grounds:
          - endpoints[POST /burn-in-runs/{burn_in_run_id}/abort]
          - state_machines.BurnInRun
          - validations[priority=21]
          - errors.ERR_INVALID_RUN_STATE
        distinguishing_aspect: |
          Abort is a compensating action with a one-state window, and this instance
          probes the pair of gates that the repeated-abort case (stubbed above
          against §1.8) does not reach: complete is refused on a run that was
          ABORTED, and abort is refused on a run that already PASSED — the two
          actions are mutually exclusive rather than ordered, and a late abort must
          not drag a passed cabinet back down the ladder. Between them the recipe
          also shows that an abort kills only the RUN: the cabinet returns to
          POPULATED and is immediately re-schedulable in the same chamber. (The
          complete-on-an-ABORTED-run refusal is also reached from the
          terminal-state-lockdown angle by complete_on_an_aborted_run_rejected; here
          it is the control that proves the two actions share one window.)
        test_recipe:
          setup:
            - "An FP10-IN cabinet ${cab} is POPULATED and run ${run1} is SCHEDULED in chamber ${ch} for [2026-08-02T00:00Z, 2026-08-03T00:00Z)."
