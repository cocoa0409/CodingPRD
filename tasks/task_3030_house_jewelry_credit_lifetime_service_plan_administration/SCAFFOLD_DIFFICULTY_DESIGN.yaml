  - rule_id: transitive_cascade
    instances:

      # --- Instance 1: depth 5 ---
      - name: default_cascade_plan_to_customer_to_application_to_registration_to_tier
        grounds:
          - state_machines.PromotionalPlan.ACCRUING_to_DEFAULTED
          - state_machines.Customer.OPEN_to_SUSPENDED
          - state_machines.ServicePlanRegistration.REMINDER_ISSUED_to_LAPSED
