scaffold_corner_design:
  - section: entities
    instances:
      - name: create_trauma_center_returns_all_system_and_computed_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /trauma-centers]
          - entities.TraumaCenter.fields.national_verification_status
          - entities.TraumaCenter.fields.readiness_posture
          - entities.TraumaCenter.fields.registry_compliance_score
        distinguishing_aspect: "A center created with the four required inputs returns 201 with every system and computed field seeded: NOT_VERIFIED / NOT_DESIGNATED / READY, registry_compliance_score 100.00 and all seven counters at 0."
        test_recipe:
          setup:
            - "an empty database with the logical clock parked at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /trauma-centers"
              payload: { name: "Northgate Trauma", state_code: "OR", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          assert:
            - "HTTP status is 201 and TraumaCenter.${c1}.name == 'Northgate Trauma' with state_code == 'OR' and designation_level == LEVEL_I"
            - "TraumaCenter.${c1}.national_verification_status == NOT_VERIFIED and state_designation_status == NOT_DESIGNATED"
            - "TraumaCenter.${c1}.readiness_posture == READY, registry_compliance_score == 100.00, under_triage_rate_pct == 0.00, over_triage_rate_pct == 0.00 and outreach_credit_hours_ytd == 0.00"
            - "TraumaCenter.${c1}.open_critical_deficiency_count, escalated_critical_deficiency_count, open_pi_event_count, closed_pi_event_count, registry_included_case_count and registry_excluded_case_count are all 0"
      - name: get_registry_case_returns_stored_and_derived_values
        claim_type: retrieval
        grounds:
          - endpoints[GET /registry-cases/{id}]
          - entities.RegistryCase.fields.effective_iss
          - entities.RegistryCase.fields.inclusion_status
        distinguishing_aspect: "A read-back of a freshly created case returns the stored inputs unchanged plus effective_iss equal to injury_severity_score, because no VALIDATED abstraction exists yet."
        test_recipe:
          setup:
            - "one trauma center with a TIER_1_FULL tier"
            - "one case created with injury_severity_score 22 and los_hours 48.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Redstone Trauma", state_code: "UT", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { tier_full: $.data.id }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_full}", mrn: "MRN-RS1", arrival_at: "2026-07-22T03:30:00Z", injury_severity_score: 22, los_hours: 48.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k1: $.data.id }
          trigger:
            - call: "GET /registry-cases/${k1}"
              payload: {}
              as: RegistryValidator
              as_user_id: "u_validator_1"
          assert:
            - "HTTP status is 200 and the returned id equals ${k1}"
            - "the response carries mrn == 'MRN-RS1', arrival_at == 2026-07-22T03:30:00Z, injury_severity_score == 22 and los_hours == 48.00"
            - "abstraction_status == PENDING, triage_review_status == UNREVIEWED, locked_at is null and transfer_out_to_center_id is null"
            - "effective_iss == 22, inclusion_status == INCLUDED and inclusion_reason == MEETS_INCLUSION_CRITERIA"
      - name: list_registry_cases_filters_by_center_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /registry-cases]
          - response_envelope.pagination_fields
          - entities.RegistryCase.fields.center_id
        distinguishing_aspect: "With three cases at one center and one at another, GET /registry-cases?center_id=<first>&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true — the filter is applied before pagination, not after."
        test_recipe:
          setup:
            - "two trauma centers, each with a TIER_1_FULL tier"
            - "three cases at the first center (MRN-P1, MRN-P2, MRN-P3) and one at the second (MRN-Q1)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Prairie Trauma", state_code: "ND", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers"
              payload: { name: "Quarry Trauma", state_code: "ND", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c2: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { t1: $.data.id }
            - call: "POST /trauma-centers/${c2}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c2}"
              captures: { t2: $.data.id }
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${t1}", mrn: "MRN-P1", arrival_at: "2026-07-01T01:00:00Z", injury_severity_score: 18, los_hours: 30.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${t1}", mrn: "MRN-P2", arrival_at: "2026-07-02T01:00:00Z", injury_severity_score: 19, los_hours: 30.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${t1}", mrn: "MRN-P3", arrival_at: "2026-07-03T01:00:00Z", injury_severity_score: 20, los_hours: 30.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
            - call: "POST /registry-cases"
              payload: { center_id: "${c2}", activation_tier_id: "${t2}", mrn: "MRN-Q1", arrival_at: "2026-07-04T01:00:00Z", injury_severity_score: 21, los_hours: 30.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
          trigger:
            - call: "GET /registry-cases?center_id=${c1}&limit=2&offset=0"
              payload: {}
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "GET /registry-cases?center_id=${c1}&limit=2&offset=2"
              payload: {}
              as: SystemAdmin
              as_user_id: "u_admin"
          assert:
            - "the first read returns exactly 2 RegistryCase rows with meta total_count == 3 and has_more == true"
            - "the second read returns exactly 1 row with total_count == 3 and has_more == false"
            - "MRN-Q1 appears in neither page, because it belongs to ${c2}"
            - "response_type == 'array' on both reads"
      - name: get_pi_event_with_unknown_id_returns_pi_event_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /pi-events/{id}]
          - validations[priority=13]
          - errors[ERR_PI_EVENT_NOT_FOUND]
        distinguishing_aspect: "A well-formed UUID that no PIEvent owns returns 404 with ERR_PI_EVENT_NOT_FOUND, not an empty 200 body."
        test_recipe:
          setup:
            - "one trauma center exists but no PI events have ever been created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Junction Trauma", state_code: "CO", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /pi-events/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_PI_EVENT_NOT_FOUND"
            - "response_type == 'error' and data.message is the declared message 'performance improvement event not found'"
            - "GET /pi-events?center_id=${c1} still returns an empty list"
      - name: create_registry_case_without_arrival_at_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /registry-cases]
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
          - entities.RegistryCase.fields.arrival_at
        distinguishing_aspect: "arrival_at has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST before any lookup or business rule runs, and no case row is created."
        test_recipe:
          setup:
            - "one trauma center with a TIER_2_MODIFIED tier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Bayside Trauma", state_code: "RI", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_2_MODIFIED", surgeon_response_limit_minutes: 30, specialty_response_limit_minutes: 60, iss_threshold: 9 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${t1}", mrn: "MRN-BS1", injury_severity_score: 14, los_hours: 20.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /registry-cases?center_id=${c1} returns an empty list with total_count == 0"
            - "TraumaCenter.${c1}.registry_included_case_count == 0"
      - name: omitted_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.RegistryCase.fields.ed_disposition
          - entities.RegistryCase.fields.transfer_in_from_center_id
          - entities.SurveyorBooking.fields.travel_buffer_hours
          - endpoints[POST /verification-cycles/{id}/surveyor-bookings]
        distinguishing_aspect: "Omitting ed_disposition yields ADMIT, omitting transfer_in_from_center_id yields null, and omitting travel_buffer_hours yields exactly 24 — the declared defaults, not null or zero."
        test_recipe:
          setup:
            - "one trauma center with a TIER_1_FULL tier and a NATIONAL_VERIFICATION cycle already SUBMITTED at readiness 82.00"
            - "no cases and no bookings yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Foxglove Trauma", state_code: "WA", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { t1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-10-01T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id }
            - call: "POST /verification-cycles/${cyc}/submit"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
          trigger:
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${t1}", mrn: "MRN-FG1", arrival_at: "2026-07-28T09:00:00Z", injury_severity_score: 17, los_hours: 40.00 }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k1: $.data.id }
            - call: "POST /verification-cycles/${cyc}/surveyor-bookings"
              payload: { surveyor_user_id: "u_surveyor_9", window_start: "2026-10-01T08:00:00Z", window_end: "2026-10-01T17:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { b1: $.data.id }
          assert:
            - "RegistryCase.${k1}.ed_disposition == ADMIT and transfer_in_from_center_id is null"
            - "RegistryCase.${k1}.abstraction_status == PENDING and inclusion_status == INCLUDED"
            - "SurveyorBooking.${b1}.travel_buffer_hours == 24"
            - "SurveyorBooking.${b1}.verification_cycle_id == ${cyc}"
      - name: verification_cycle_system_fields_are_server_minted_on_create
        claim_type: system_fields
        grounds:
          - endpoints[POST /verification-cycles]
          - entities.VerificationCycle.fields.status
          - entities.VerificationCycle.fields.decided_at
          - entities.VerificationCycle.fields.readiness_score
        distinguishing_aspect: "The create response carries a server-minted id, created_at, updated_at and version alongside status PREP, decided_at null and decision_effective_date null — none of which the client may supply, since they are absent from the endpoint's input list."
        test_recipe:
          setup:
            - "one trauma center with zero verified outreach hours, so a NATIONAL_VERIFICATION cycle scores 82.00 on creation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Silver Lake Trauma", state_code: "NV", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-12-02T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id, cyc_v: $.data.version }
          assert:
            - "HTTP status is 201, ${cyc} is a server-minted identifier and ${cyc_v} == 1"
            - "VerificationCycle.${cyc}.status == PREP with decided_at null and decision_effective_date null"
            - "VerificationCycle.${cyc}.open_type_i_count == 0, open_type_ii_count == 0 and open_type_iii_count == 0"
            - "VerificationCycle.${cyc}.readiness_score == 82.00, i.e. 100.00 minus the 18.00 national outreach penalty"
      - name: unknown_tier_code_enum_member_returns_invalid_enum_value
        claim_type: type_constraints
        grounds:
          - validations[priority=21]
          - errors[ERR_INVALID_ENUM_VALUE]
          - entities.ActivationCriteriaTier.fields.tier_code
        distinguishing_aspect: "A tier_code outside {TIER_1_FULL, TIER_2_MODIFIED, TIER_3_CONSULT} is refused with 422 ERR_INVALID_ENUM_VALUE — a different status and error than the 400 used for a missing field."
        test_recipe:
          setup:
            - "one trauma center with no activation tiers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Ironwood Trauma", state_code: "AL", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_0_ALERT", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 and data.error_id == ERR_INVALID_ENUM_VALUE"
            - "GET /trauma-centers/${c1}/activation-tiers returns an empty list"
      - name: data_dictionary_rule_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.DataDictionaryRule.common_fields
          - entities.DataDictionaryRule.fields.error_weight
          - endpoints[POST /data-dictionary-rules]
          - endpoints[GET /data-dictionary-rules]
        distinguishing_aspect: "DataDictionaryRule declares common_fields: false, so §1.5 exposes no update or delete endpoint for it and its rows carry no version field; error_weight is computed from severity as 4 for CRITICAL and 1 for MINOR."
        test_recipe:
          setup:
            - "an empty database with the logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /data-dictionary-rules"
              payload: { field_name: "gcs_arrival", rule_kind: "RANGE", severity: "CRITICAL", min_value: 3, max_value: 15 }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { r_crit: $.data.id }
            - call: "POST /data-dictionary-rules"
              payload: { field_name: "mechanism_code", rule_kind: "CONFORMANCE", severity: "MINOR", allowed_codes: ["MVC", "FALL", "GSW", "STAB", "BURN"] }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { r_minor: $.data.id }
          assert:
            - "both creates return 201 and DataDictionaryRule.${r_crit}.error_weight == 4 while DataDictionaryRule.${r_minor}.error_weight == 1"
            - "neither response body contains a version field, since the entity declares common_fields: false"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint under /data-dictionary-rules, so the rows can never be mutated after creation"
            - "GET /data-dictionary-rules?severity=CRITICAL returns exactly one row, ${r_crit}"
      - name: create_registry_case_under_unknown_center_returns_center_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_CENTER_NOT_FOUND]
          - entities.RegistryCase.parent
        distinguishing_aspect: "RegistryCase declares TraumaCenter as its parent, so a body center_id that no center owns returns 404 ERR_CENTER_NOT_FOUND — distinct from the ERR_REFERENCED_RESOURCE_NOT_FOUND used for the non-parent activation_tier_id reference."
        test_recipe:
          setup:
            - "one real trauma center with a TIER_1_FULL tier, whose tier id is valid"
            - "the center id 22222222-2222-2222-2222-222222222222 belongs to no center"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Mesa Verde Trauma", state_code: "NM", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_1_FULL", surgeon_response_limit_minutes: 15, specialty_response_limit_minutes: 30, iss_threshold: 16 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /registry-cases"
              payload: { center_id: "22222222-2222-2222-2222-222222222222", activation_tier_id: "${t1}", mrn: "MRN-MV1", arrival_at: "2026-07-19T05:00:00Z", injury_severity_score: 25, los_hours: 60.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404 and data.error_id == ERR_CENTER_NOT_FOUND"
            - "data.error_id != ERR_REFERENCED_RESOURCE_NOT_FOUND, because the parent center check at priority 10 precedes the generic reference check at priority 14"
            - "GET /registry-cases returns an empty list"
      - name: create_registry_case_with_unknown_activation_tier_returns_referenced_resource_not_found
        claim_type: graph
        grounds:
          - validations[priority=14]
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
          - entities.RegistryCase.fields.activation_tier_id
          - complexity_profile.entity_topology
        distinguishing_aspect: "The graph topology means a case points at both a parent center and a non-parent ActivationCriteriaTier; with a real center but an unknown tier id the response is 404 ERR_REFERENCED_RESOURCE_NOT_FOUND."
        test_recipe:
          setup:
            - "one real trauma center with no activation tiers at all"
            - "the tier id 33333333-3333-3333-3333-333333333333 belongs to no tier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Kettle Falls Trauma", state_code: "ID", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "33333333-3333-3333-3333-333333333333", mrn: "MRN-KF1", arrival_at: "2026-07-11T07:00:00Z", injury_severity_score: 30, los_hours: 72.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { err_id: $.data.error_id }
          assert:
