      - call: POST /licensing/organizations
        payload:
          name: SM3
          org_type: TEAM
          primary_admin_id: ${ba0}
        as: SystemAdmin
        captures:
          o: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa@o.com
          full_name: Org Admin
          admin_kind: SYSTEM_ADMIN
          org_id: ${o}
        as: SystemAdmin
        captures:
          oa: $.data.id
      - call: POST /licensing/admins
        payload:
          email: oa2@o.com
          full_name: Org Admin 2
          admin_kind: PRODUCT_ADMIN
          org_id: ${o}
        as: SystemAdmin
        captures:
          oa2: $.data.id
      - call: POST /licensing/plans
        payload:
          code: PX
          segment: TEAM
          billing_model: MONTHLY
          monthly_price_cents: 3000
          annual_monthly_price_cents: 3000
          storage_gb_per_seat: 20
          seat_limit: -1
          deployment_modes:
          - NAMED_USER
          allows_offline_activation: false
          max_devices_per_seat: 2
          cancellation_window_days: 14
          etf_rate_pct: 0
        as: SystemAdmin
        captures:
          pl: $.data.id
      - call: POST /licensing/product-versions
        payload:
          plan_id: ${pl}
          version_label: '2026.1'
          release_date: '2026-01-15T00:00:00Z'
        as: SystemAdmin
      - call: POST /licensing/subscriptions
        payload:
          org_id: ${o}
          plan_id: ${pl}
          seats_purchased: 1
        as: SystemAdmin
        captures:
          s: $.data.id
      - call: POST /licensing/subscriptions/${s}/activate
        payload: {}
        as: SystemAdmin
        captures:
          sv: $.data.version
      - call: POST /licensing/seats
        payload:
          subscription_id: ${s}
          expected_subscription_version: ${sv}
        as: SystemAdmin
        captures:
          se: $.data.id
      - call: POST /licensing/end-users
        payload:
          email: u@o.com
          full_name: User
          org_id: ${o}
        as: OrgAdmin
        as_user_id: ${oa}
        captures:
          u: $.data.id
      - call: POST /licensing/seats/${se}/assign
        payload:
          end_user_id: ${u}
        as: OrgAdmin
        as_user_id: ${oa}
        captures:
          sev: $.data.version
      - call: POST /licensing/end-users
        payload:
          email: u2@o.com
          full_name: User 2
          org_id: ${o}
        as: OrgAdmin
        as_user_id: ${oa}
        captures:
          u2: $.data.id
      - call: POST /licensing/transfer-requests
        payload:
          org_id: ${o}
          seat_id: ${se}
          to_user_id: ${u2}
          requested_by_admin_id: ${oa}
          expected_seat_version: ${sev}
        as: OrgAdmin
        as_user_id: ${oa}
        captures:
          tr: $.data.id
      - call: POST /licensing/transfer-requests/${tr}/approve
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa2}
      - call: POST /licensing/transfer-requests/${tr}/execute
        payload: {}
        as: SystemAdmin
      trigger:
      - call: POST /licensing/transfer-requests/${tr}/approve
        payload: {}
        as: OrgAdmin
        as_user_id: ${oa2}
        captures:
          e: $.data.error_id
      assert:
      - response error_id == ERR_INVALID_STATE
      - TransferRequest.${tr}.status == EXECUTED
