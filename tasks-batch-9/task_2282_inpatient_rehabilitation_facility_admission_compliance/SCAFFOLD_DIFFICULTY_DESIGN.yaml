              as: NurseCaseManager
              as_user_id: "${nurse_id}"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { fac_v1: $.data.version }
            - call: "POST /compliance-reviews"
              payload: { facility_id: "${fac_id}", expected_facility_version: "${fac_v1}", method: "PRESUMPTIVE", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rev_p_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
