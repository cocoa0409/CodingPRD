        grounds:
          - state_machines[Lease].initial_state
          - state_machines[TenantImprovementProject].initial_state
          - state_machines[Appraisal].initial_state
        distinguishing_aspect: "Three machines are checked at birth in one chain: a Lease is DRAFT with fmv_certification_status NOT_STARTED, a TenantImprovementProject is DESIGN with BOTH review dimensions NOT_SUBMITTED (not PENDING — the fork has not fired), and an Appraisal is SUBMITTED with is_controlling false."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and one physician-owned INDEPENDENT_PRACTICE tenant."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { m1_b_id: $.data.id }
