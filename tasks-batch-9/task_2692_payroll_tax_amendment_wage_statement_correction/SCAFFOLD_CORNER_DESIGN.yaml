            - "AgencyNotice.${notice_id}.waiver_pct_bps == 10000"
            - "AgencyNotice.${notice_id}.waived_penalty_cents == 200000"
            - "AgencyNotice.${notice_id}.waived_interest_cents == 0"
            - "AgencyNotice.${notice_id}.net_exposure_cents == 1050000"
            - "AgencyNotice.${notice_id}.response_status == CLOSED and abatement_status == GRANTED"
            - "AgencyNotice.${notice_id}.abatement_round == 1"
            - "Employer.${emp_id}.granted_abatement_count == 1"

      - name: dismissed_discrepancy_is_excluded_from_the_delta_rollup
        claim_type: Input Set Filtering
        grounds:
          - calculations.amended_return_delta_rollup.input_set
          - state_machines.Discrepancy.CATEGORIZED_to_DISMISSED
        distinguishing_aspect: "Only CATEGORIZED discrepancies are summed: dismissing the 250000-cent WITHHOLDING variance drops tax_delta_cents to 0 and therefore interest to 0, while the surviving TAXABLE_WAGE and DEPOSIT_SHORTFALL rows still produce a 250000 wage delta and a 250000 shortfall, so penalty falls to 18750."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-30T00:00:00Z."
