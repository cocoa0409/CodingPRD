              payload: { unit_number: "T-200", vehicle_type: "TRAILER", current_odometer_miles: 5 }
              as: DealerAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /fleet-accounts/${fleetA_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 105, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Michelin"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
              captures: { e4: $.data.error_id }
            - call: "POST /service-locations/${locA_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 45 }
              as: DealerAdmin
              captures: { e5: $.data.error_id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleetB_id}", agreement_code: "UQ-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.05, casing_credit_rate_cents: 9000, emergency_response_minutes: 120, emergency_labor_rate_cents_per_hour: 12000 }
