              payload: { gear_model_id: "${gm2_id}", owner_customer_id: "${cust_id}", serial_number: "AS2-01000", purchase_date: "2026-06-16T00:00:00Z", purchase_price_cents: 74900 }
              as: ServiceAgent
            - call: "POST /gear-service/gear-items"
