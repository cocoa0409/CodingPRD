      - name: licensing_parallel_dimensions_and_registration_dag
        grounds:
          - state_machines.Advisor.NONE_to_PENDING
          - state_machines.Advisor.PENDING_to_ACTIVE
          - state_machines.Advisor.ACTIVE_to_LAPSED
          - state_machines.Advisor.ACTIVE_to_SUSPENDED
          - entities.SecuritiesRegistration.fields.prerequisite_registration_id
