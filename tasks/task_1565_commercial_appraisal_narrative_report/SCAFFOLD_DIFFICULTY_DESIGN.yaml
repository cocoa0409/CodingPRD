              payload: {}
              as: EngagementManager
            - call: "POST /engagements/${eng_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { eng_v: $.data.version }
            - call: "POST /engagements/${eng_id}/litigation-hold"
              payload: { matter_reference: "Case 26-CV-1042" }
              as: LegalCounsel
          trigger:
