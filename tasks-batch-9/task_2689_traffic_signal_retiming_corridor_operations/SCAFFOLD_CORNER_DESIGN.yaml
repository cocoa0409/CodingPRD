      - name: component_saturation_caps_and_class_multiplier_with_the_final_min_cap
        claim_type: constants_applied
        grounds:
          - calculations.corridor_priority_score
          - entities.Corridor.fields.jurisdiction_class
          - entities.Corridor.fields.annual_volume_change_pct
        distinguishing_aspect: "Three corridors sharing one never-retimed intersection separate the two independent caps from the class multiplier: each per-component cap is min(1.0, ratio) (age 3650/1825 == 2.0 and volume 400.0/25.0 == 16.0 both clamp to 1.0), and the FINAL min(1.0, raw) cap is what keeps the ARTERIAL corridor at 100.00 even though its raw weighted product is 1.0625, while the same inputs give a COLLECTOR 80.00 and a LOCAL 64.00."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "One never-retimed READY intersection iShared is enrolled as the sole member of three corridors: cA ARTERIAL, cB COLLECTOR and cC LOCAL, all with annual_volume_change_pct 400.0."
            - "cA additionally carries five OPEN complaints (complaint component 5/20 == 0.25) so that its raw score exceeds 1.0 before the final cap; cB and cC carry none."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Shared Junction @ Main", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { ishared_id: $.data.id, ishared_age: $.data.timing_plan_age_days }
            - call: "POST /signal-ops/corridors"
              payload: { name: "A Street Corridor", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 400.0 }
              as: SignalOpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "B Street Corridor", jurisdiction_class: "COLLECTOR", annual_volume_change_pct: 400.0 }
              as: SignalOpsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "C Street Corridor", jurisdiction_class: "LOCAL", annual_volume_change_pct: 400.0 }
              as: SignalOpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /signal-ops/corridors/${ca_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cb_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cc_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Citizen", email: "ada@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${ca_id}", category: "COORDINATION", narrative: "Complaint one." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${ca_id}", category: "COORDINATION", narrative: "Complaint two." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${ca_id}", category: "PEDESTRIAN", narrative: "Complaint three." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${ca_id}", category: "DETECTION", narrative: "Complaint four." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${ca_id}", category: "TIMING_OTHER", narrative: "Complaint five." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
          trigger:
            - call: "POST /signal-ops/corridors/${ca_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { ca_score: $.data.priority_score, ca_age: $.data.avg_plan_age_days, ca_complaints: $.data.complaint_count_12mo }
            - call: "POST /signal-ops/corridors/${cb_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { cb_score: $.data.priority_score, cb_complaints: $.data.complaint_count_12mo }
            - call: "POST /signal-ops/corridors/${cc_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { cc_score: $.data.priority_score }
          assert:
            - "${ishared_age} == 3650 and ${ca_age} == 3650.00 — the mean of a single never-retimed member"
            - "${ca_complaints} == 5 and ${cb_complaints} == 0 — complaints are scoped per corridor even though the member intersection is shared"
            - "${ca_score} == 100.00 — raw is (0.45 * 1.0 + 0.35 * 1.0 + 0.20 * 0.25) * 1.25 == 1.0625, and the final min(1.0, raw) cap pins the percentage at exactly 100.00 rather than 106.25"
            - "${cb_score} == 80.00 — (0.45 + 0.35) * 1.00 == 0.80 with both components capped at 1.0, proving the age ratio 2.0 and volume ratio 16.0 were clamped and not passed through"
            - "${cc_score} == 64.00 — the same 0.80 through the LOCAL multiplier 0.80"

