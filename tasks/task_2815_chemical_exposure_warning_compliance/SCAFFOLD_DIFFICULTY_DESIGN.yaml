  # ===========================================================================
  # RULE 8 - resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: placement_closed_windows_collide_on_touching_endpoint
        grounds:
          - validations[priority=60]
          - errors[ERR_PLACEMENT_OVERLAP]
          - entities.WarningPlacement.fields.effective_to
          - endpoints[POST /warning-determinations/{determination_id}/placements]
        distinguishing_aspect: |
          The exclusive resource is one (determination, channel) display slot and its intervals are
          CLOSED: a new window starting exactly when an existing one ends collides, one starting a
          day later does not, and a null effective_to behaves as +infinity so a later window inside
          that open tail collides too.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED and Product SKU-RT1 sells only through RETAIL, so required_channels is [LABEL]."
            - "The product has a FINAL AT_OR_ABOVE assessment and an APPROVED determination."
            - "Placement A occupies the closed window [2026-06-01, 2026-07-01] on LABEL and is IMPLEMENTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-100", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_1: $.data.id }
            - call: "POST /materials/${mat_1}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 40.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_1}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-RT1", product_name: "Watering Can", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 50000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_1}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "PEER_REVIEW" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "FINALIZE" }
              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
              captures: { pv_1: $.data.version }
            - call: "POST /warning-determinations"
              payload: { product_id: "${prod_1}", assessment_id: "${asmt_1}", decision: "WARNING_REQUIRED", expected_product_version: "${pv_1}" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { det_1: $.data.id }
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "SUBMIT_FOR_APPROVAL" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/transitions"
              payload: { action: "APPROVE" }
              as: RegulatoryCounsel
              as_user_id: "rc_1"
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", placement_detail: "First run sticker" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { plc_a: $.data.id }
            - call: "POST /warning-placements/${plc_a}/transitions"
              payload: { action: "IMPLEMENT" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
          trigger:
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", placement_detail: "Touching window" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-07-02T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", placement_detail: "Disjoint window" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { plc_c: $.data.id }
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-09-01T00:00:00Z", placement_detail: "Open ended window" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
              captures: { plc_d: $.data.id }
            - call: "POST /warning-determinations/${det_1}/placements"
              payload: { channel: "LABEL", effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", placement_detail: "Inside the open tail" }
              as: LabelingSpecialist
              as_user_id: "ls_1"
          assert:
            - "WarningPlacement.${plc_a}.status == IMPLEMENTED with effective_to == 2026-07-01T00:00:00Z"
            - "first trigger call (starts exactly at A's end): HTTP 409 with error_id ERR_PLACEMENT_OVERLAP"
            - "second trigger call (starts one day after A's end): HTTP 201 and WarningPlacement.${plc_c}.status == PLANNED"
            - "third trigger call (open-ended, effective_to omitted): HTTP 201 and WarningPlacement.${plc_d}.effective_to is null"
            - "fourth trigger call (fully inside D's open tail): HTTP 409 with error_id ERR_PLACEMENT_OVERLAP"
            - "exactly three WarningPlacement rows exist for WarningDetermination.${det_1} after all four calls"

      - name: reformulation_half_open_windows_allow_touching_endpoint
        grounds:
          - validations[priority=61]
          - errors[ERR_REFORMULATION_OVERLAP]
          - entities.ReformulationProject.fields.planned_end_date
          - state_machines.ReformulationProject.PLANNED_to_ABANDONED
