    input: []
    output: Inspection
    side_effects: ["status -> AMENDING", "Inspection.version += 1"]

  - method: POST
    path: "/inspections/{inspectionId}/finalize"
    description: "Finalize an inspection; promotes score/grade/placard to establishment and fires closure/reinspection cascades (COMPLETED -> FINALIZED). OCC-guarded on expected_inspection_version."
    roles: [Inspector]
    code: 200
    input: [expected_inspection_version]
    output: Inspection
    side_effects: ["establishment current_score/current_grade/current_placard_color updated", "open_critical_count recomputed", "closure cascade if grade==CLOSED", "reinspection-pass cascade resolves violations and lifts closure", "Inspection.version += 1"]

  # ---- Violations (flat; inspection_id + fda_code_id in body) ----
  - method: POST
    path: "/violations"
    description: "Record a violation on an editable inspection"
    roles: [Inspector]
    code: 201
    input: [inspection_id, fda_code_id, "corrected_on_site?"]
    output: Violation
    side_effects: ["classification copied from code", "repeat_offense computed", "demerit_points_observed/final computed", "resolution_status = OPEN"]

  - method: GET
    path: "/violations"
    description: "List violations; filter by inspection_id or fda_code_id (FK reverse-reachability), classification or resolution_status"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["inspection_id?", "fda_code_id?", "classification?", "resolution_status?", "limit?", "offset?"]
    output: "Violation[]"
    side_effects: []

  - method: GET
    path: "/violations/{violationId}"
    description: "Get a violation"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: DELETE
    path: "/violations/{violationId}"
    description: "Remove a violation from an editable inspection"
    roles: [Inspector]
    code: 204
    input: []
    output: null
    side_effects: ["violation removed"]

  # ---- Closure Orders (flat; establishment_id + triggering_inspection_id in body) ----
  - method: POST
    path: "/closure-orders"
    description: "Issue a manual closure order (e.g. imminent health hazard); suspends establishment"
    roles: [EnforcementOfficer, HealthDirector]
    code: 201
    input: [establishment_id, triggering_inspection_id, reason_code]
    output: ClosureOrder
    side_effects: ["status = ACTIVE", "establishment PERMITTED -> SUSPENDED", "establishment.active_closure_order_id set", "next_reinspection_due_index = clock + REINSPECTION_GRACE_DAYS"]

  - method: GET
    path: "/closure-orders"
    description: "List closure orders; filter by establishment_id or triggering_inspection_id (FK reverse-reachability) or status"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["establishment_id?", "triggering_inspection_id?", "status?", "limit?", "offset?"]
    output: "ClosureOrder[]"
    side_effects: []

  - method: GET
    path: "/closure-orders/{closureOrderId}"
    description: "Get a closure order"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: ClosureOrder
    side_effects: []

  - method: POST
    path: "/closure-orders/{closureOrderId}/lift"
    description: "Manually lift an active closure order (e.g. after corrective action verified); reinstates establishment"
    roles: [EnforcementOfficer, HealthDirector]
    code: 200
    input: []
    output: ClosureOrder
    side_effects: ["status -> LIFTED", "establishment SUSPENDED -> PERMITTED", "active_closure_order_id -> null"]

  # ---- Complaints (flat; establishment_id in body) ----
  - method: POST
    path: "/complaints"
    description: "File a complaint / foodborne-illness report"
    roles: [PermitClerk, Inspector, EnforcementOfficer, HealthDirector]
    code: 201
    input: [establishment_id, complaint_type, "reported_ill_count?"]
    output: Complaint
    side_effects: ["status = RECEIVED"]

  - method: GET
    path: "/complaints"
    description: "List complaints; filter by establishment_id or linked_inspection_id (FK reverse-reachability), status or priority"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["establishment_id?", "linked_inspection_id?", "status?", "priority?", "limit?", "offset?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/complaints/{complaintId}"
    description: "Get a complaint"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/complaints/{complaintId}/triage"
    description: "Triage a complaint; computes severity_score and priority"
    roles: [PermitClerk]
    code: 200
    input: []
    output: Complaint
    side_effects: ["severity_score/priority computed (complaint_severity)", "status -> TRIAGED"]

  - method: POST
    path: "/complaints/{complaintId}/dispatch"
    description: "Dispatch a triaged complaint; spawns a COMPLAINT inspection assigned to the dispatching inspector"
    roles: [Inspector]
    code: 200
    input: [inspector_id]
    output: Complaint
    side_effects: ["COMPLAINT Inspection created (SCHEDULED)", "linked_inspection_id set", "status -> DISPATCHED"]

  - method: POST
    path: "/complaints/{complaintId}/close"
    description: "Close a complaint after its inspection is finalized"
    roles: [PermitClerk]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status -> CLOSED"]

  # ---- Enforcement Cases / Hearings (flat; establishment_id + closure_order_id in body) ----
  - method: POST
    path: "/enforcement-cases"
    description: "Open an enforcement case (optionally contesting a closure order)"
    roles: [EnforcementOfficer]
    code: 201
    input: [establishment_id, alleged_penalty_cents, "closure_order_id?"]
    output: EnforcementCase
    side_effects: ["status = OPENED"]

  - method: GET
    path: "/enforcement-cases"
    description: "List enforcement cases; filter by establishment_id or closure_order_id (FK reverse-reachability) or status"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: ["establishment_id?", "closure_order_id?", "status?", "limit?", "offset?"]
    output: "EnforcementCase[]"
    side_effects: []

  - method: GET
    path: "/enforcement-cases/{caseId}"
    description: "Get an enforcement case"
    roles: [HealthDirector, PermitClerk, Inspector, EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: []

  - method: POST
    path: "/enforcement-cases/{caseId}/schedule-hearing"
    description: "Schedule a hearing for an open case"
    roles: [EnforcementOfficer]
    code: 200
    input: [hearing_index]
    output: EnforcementCase
    side_effects: ["status -> HEARING_SCHEDULED", "hearing_index recorded"]

  - method: POST
    path: "/enforcement-cases/{caseId}/rule"
    description: "Issue a hearing ruling; computes penalty and may VACATE a contested closure"
    roles: [HealthDirector]
    code: 200
    input: [ruling]
    output: EnforcementCase
    side_effects: ["ruling recorded", "assessed_penalty_cents computed (penalty_assessment)", "DISMISSED vacates closure & reinstates establishment", "status -> HEARD"]

  - method: POST
    path: "/enforcement-cases/{caseId}/settle"
    description: "Settle an open case directly (no hearing); assesses the alleged penalty in full"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: ["assessed_penalty_cents = alleged_penalty_cents", "status -> CLOSED"]

  - method: POST
    path: "/enforcement-cases/{caseId}/close"
    description: "Close a heard case"
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: EnforcementCase
    side_effects: ["status -> CLOSED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_ASSIGNED_INSPECTOR, http: 403, condition: "Acting Inspector is not the inspection's assigned inspector_id" }

  # --- Not Found ---
  - { id: ERR_ESTABLISHMENT_NOT_FOUND, http: 404, condition: "Establishment id not found" }
  - { id: ERR_PLAN_REVIEW_NOT_FOUND, http: 404, condition: "PlanReview id not found" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Permit id not found" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id not found" }
  - { id: ERR_VIOLATION_NOT_FOUND, http: 404, condition: "Violation id not found" }
  - { id: ERR_CODE_NOT_FOUND, http: 404, condition: "FdaFoodCode id not found" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "Inspector id not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "InspectionRoute id not found" }
  - { id: ERR_CLOSURE_ORDER_NOT_FOUND, http: 404, condition: "ClosureOrder id not found" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "Complaint id not found" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "EnforcementCase id not found" }

  # --- Input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, or integer out of declared range" }
  - { id: ERR_MISSING_REJECTION_REASON, http: 400, condition: "Plan review reject called without a non-empty rejection_reason" }
  - { id: ERR_INVALID_RULING, http: 400, condition: "Hearing ruling not in {UPHELD, REDUCED, DISMISSED}" }

  # --- OCC ---
  - { id: ERR_STALE_INSPECTION_VERSION, http: 412, condition: "expected_inspection_version does not match Inspection.version at finalize" }

  # --- State: Establishment ---
  - { id: ERR_ESTABLISHMENT_NOT_PRELICENSE, http: 409, condition: "Establishment must be PRELICENSE (plan approval / permit issuance)" }
  - { id: ERR_ESTABLISHMENT_NOT_PERMITTED, http: 409, condition: "Establishment must be PERMITTED" }
  - { id: ERR_ESTABLISHMENT_NOT_SUSPENDED, http: 409, condition: "Establishment must be SUSPENDED" }
  - { id: ERR_ESTABLISHMENT_NOT_REVOCABLE, http: 409, condition: "Establishment must be PERMITTED or SUSPENDED to revoke" }
  - { id: ERR_ESTABLISHMENT_REVOKED, http: 409, condition: "Operation not allowed on a REVOKED establishment" }

  # --- State: PlanReview ---
  - { id: ERR_PLAN_REVIEW_NOT_SUBMITTED, http: 409, condition: "PlanReview must be SUBMITTED to approve/reject" }
  - { id: ERR_PLAN_REVIEW_NOT_REJECTED, http: 409, condition: "PlanReview must be REJECTED to resubmit" }
  - { id: ERR_PLAN_REVIEW_NOT_APPROVED, http: 409, condition: "Referenced PlanReview must be APPROVED to issue permit" }

  # --- State: Inspection ---
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "Inspection must be SCHEDULED to start" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "Inspection must be IN_PROGRESS to complete" }
  - { id: ERR_INSPECTION_NOT_COMPLETED, http: 409, condition: "Inspection must be COMPLETED to reopen or finalize" }
  - { id: ERR_INSPECTION_NOT_AMENDING, http: 409, condition: "Inspection must be AMENDING to re-complete" }
  - { id: ERR_INSPECTION_NOT_EDITABLE, http: 409, condition: "Violations editable only while Inspection IN_PROGRESS or AMENDING" }
  - { id: ERR_INVALID_REINSPECTION_TARGET, http: 409, condition: "REINSPECTION must reference a prior FINALIZED inspection of the same establishment" }
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "Inspector already has a non-terminal inspection on this scheduled_index" }
  - { id: ERR_CODE_RETIRED, http: 409, condition: "Cited FdaFoodCode is retired (is_active == false)" }

  # --- State: Route ---
  - { id: ERR_ROUTE_NOT_PLANNED, http: 409, condition: "Route must be PLANNED to dispatch" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Route must be DISPATCHED to close" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 409, condition: "Route planned_stop_count exceeds inspector max_daily_route_stops" }
  - { id: ERR_ROUTE_DATE_IN_PAST, http: 409, condition: "Route date index is before the current clock index at dispatch" }

  # --- State: Closure ---
  - { id: ERR_NO_ACTIVE_CLOSURE_ORDER, http: 409, condition: "No ACTIVE closure order to lift" }
  - { id: ERR_CLOSURE_ORDER_NOT_ACTIVE, http: 409, condition: "Closure order must be ACTIVE to lift" }

  # --- State: Complaint ---
  - { id: ERR_COMPLAINT_NOT_RECEIVED, http: 409, condition: "Complaint must be RECEIVED to triage" }
  - { id: ERR_COMPLAINT_NOT_TRIAGED, http: 409, condition: "Complaint must be TRIAGED to dispatch" }
  - { id: ERR_COMPLAINT_NOT_DISPATCHED, http: 409, condition: "Complaint must be DISPATCHED to close" }
  - { id: ERR_COMPLAINT_INSPECTION_OPEN, http: 409, condition: "Linked complaint inspection is not yet FINALIZED" }

  # --- State: Enforcement ---
  - { id: ERR_CASE_NOT_OPENED, http: 409, condition: "Case must be OPENED to schedule-hearing or settle" }
  - { id: ERR_CASE_NOT_SCHEDULED, http: 409, condition: "Case must be HEARING_SCHEDULED to rule" }
  - { id: ERR_CASE_NOT_HEARD, http: 409, condition: "Case must be HEARD to close" }
  - { id: ERR_HEARING_IN_PAST, http: 409, condition: "hearing_index is before the current clock index" }
  - { id: ERR_HEARING_NOT_REACHED, http: 409, condition: "Current clock index is before the scheduled hearing_index" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PermitClerk
    description: "Front-office clerk: establishments, plan reviews, permits, complaint intake/triage/close"
    identity: opaque
    exclusive_operations:
      - "POST /establishments — create establishment"
      - "PUT /establishments/{id} — update profile"
      - "POST /plan-reviews — submit plan review"
      - "POST /plan-reviews/{id}/approve|reject|resubmit — plan review lifecycle"
      - "POST /permits — issue permit"
      - "POST /complaints/{id}/triage — triage complaint"
      - "POST /complaints/{id}/close — close complaint"
    shared_operations:
      - "POST /complaints — file complaint (with Inspector, EnforcementOfficer, HealthDirector)"
      - "POST /inspection-routes — create route (with Inspector)"
      - "POST /inspections — schedule inspection (with Inspector)"
      - "GET endpoints — read all resources"

  - name: Inspector
    description: "Field inspector: routes, inspections, violations, scoring, complaint dispatch"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/start|complete|reopen|finalize — inspection lifecycle"
      - "POST /violations — record violation"
      - "DELETE /violations/{id} — remove violation"
      - "POST /inspection-routes/{id}/dispatch|close — route lifecycle"
      - "POST /complaints/{id}/dispatch — dispatch complaint to inspection"
    shared_operations:
      - "POST /complaints — file complaint"
      - "POST /inspection-routes — create route (with PermitClerk)"
      - "POST /inspections — schedule inspection (with PermitClerk)"
      - "GET endpoints — read all resources"

  - name: EnforcementOfficer
    description: "Enforcement: closure orders and enforcement cases / hearings administration"
    identity: opaque
    exclusive_operations:
      - "POST /enforcement-cases — open case"
      - "POST /enforcement-cases/{id}/schedule-hearing|settle|close — case lifecycle"
    shared_operations:
      - "POST /closure-orders — issue closure (with HealthDirector)"
      - "POST /closure-orders/{id}/lift — lift closure (with HealthDirector)"
      - "POST /complaints — file complaint"
      - "GET endpoints — read all resources"

  - name: HealthDirector
    description: "Department director: catalog/inspector administration, revocation, hearing rulings, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /fda-food-codes, POST /fda-food-codes/{id}/retire — code catalog administration"
      - "POST /inspectors — register inspector"
      - "POST /establishments/{id}/revoke — revoke permit"
      - "POST /enforcement-cases/{id}/rule — issue hearing ruling"
      - "POST /_clock/set_current_index — set logical clock"
    shared_operations:
      - "POST /closure-orders — issue closure (with EnforcementOfficer)"
      - "POST /closure-orders/{id}/lift — lift closure (with EnforcementOfficer)"
      - "POST /complaints — file complaint"
      - "GET endpoints — read all resources"

# Domain constants referenced across tables (for downstream generators):
domain_constants:
  PERMIT_TERM_DAYS: 365
  REINSPECTION_GRACE_DAYS: 14
