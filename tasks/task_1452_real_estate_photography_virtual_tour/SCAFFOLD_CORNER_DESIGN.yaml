              payload: {}
              as: ClientAgent
              as_user_id: "${agent}"
              captures: { v_confirmed: $.data.version }
          trigger:
            - call: "POST /shoot-bookings/${bk}/reschedule"
              payload: { expected_booking_version: "${v_confirmed}", kind: "CLIENT", new_start_utc: "2026-08-12T14:00:00Z", reason_code: "SELLER_DELAY" }
              as: ClientAgent
