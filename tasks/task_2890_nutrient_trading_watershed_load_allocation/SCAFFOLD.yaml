scenario: |
  2890. Nutrient Trading & Watershed Load Allocation (state water quality program): total maximum daily load development with source assessment and load allocation among point and nonpoint sources, permit limit derivation from wasteload allocations with compliance schedules, trading program rules with baseline requirements, trading ratios and geographic eligibility, credit generation through agricultural practices with verification and certification of practice implementation, credit registry with serialization, retirement and reserve pool management, permittee compliance through credit purchase with enforceability in the permit, monitoring and adaptive management to verify watershed response, stakeholder engagement and program evaluation against load reduction targets

domain_name: nutrient-trading-watershed-load-allocation
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Reach.downstream_reach_id is a self-referential edge forming a directed
  # chain toward the watershed outlet; geographic trading eligibility is a
  # traversal over that chain. Credits, permits, sources and reaches form a
  # many-to-many web rather than a containment tree.

  state_machine_shape: cyclic
  # TmdlAssessment loops PUBLIC_COMMENT -> REVISION -> PUBLIC_COMMENT;
  # PracticeProject loops CERTIFIED -> PENDING_REVERIFICATION -> CERTIFIED;
  # Watershed loops ACTIVE -> ADAPTIVE_HOLD -> ACTIVE; Permit carries two
  # independent state axes (limit_status and compliance_status) on one row.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The PracticeVerifier who recorded the BASELINE event may not record the
  # IMPLEMENTATION event for the same project, and the RegistryAdministrator
  # who certifies may not be any of that project's verifiers.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities, 49 endpoints, 40 error codes, 30 ordered validations,
  # 8 calculations (2 with divergent variants), 9 state machines across
  # 8 entities (Permit carries two independent axes), 2 OCC parent-version
  # rules, 7 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Watershed
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable watershed name.
      - name: state_code
        type: string
        source: input
        description: Two-letter state code of the administering water quality program.
        constraints: exactly 2 uppercase letters
      - name: watershed_code
        type: string
        source: input
        description: Program-assigned short code; used as the middle token of credit serial prefixes.
        constraints: unique across all Watershed rows; 2-8 uppercase alphanumerics
      - name: pollutant
        type: enum
        source: input
        description: The nutrient the program regulates.
        constraints: "TOTAL_NITROGEN | TOTAL_PHOSPHORUS"
      - name: baseline_year
        type: integer
        source: input
        description: Calendar year of the load baseline used by program evaluation.
      - name: baseline_load_lbs_yr
        type: number
        source: input
        description: Watershed-wide annual load at the baseline year, in lbs/yr; denominator of the adaptive-management reduction metric.
        constraints: "> 0; 2 decimal places"
      - name: interim_target_pct
        type: number
        source: input
        description: Percent of the baseline-to-capacity reduction the program must have achieved for an adaptive review to read ON_TRACK.
        default: 25.00
        constraints: "0.00 <= x <= 100.00; 2 decimal places"
      - name: uncertainty_ratio
        type: number
        source: input
        description: Trading uncertainty ratio; credits are divided by this factor when delivered to a permit.
        default: 2.0000
        constraints: ">= 1.0000; 4 decimal places"
      - name: retirement_ratio
        type: number
        source: input
        description: Fraction of every traded gross credit quantity retired to the watershed reserve pool instead of being delivered.
        default: 0.1000
        constraints: "0.0000 <= x <= 0.5000; 4 decimal places"
      - name: equivalence_ratio
        type: number
        source: input
        description: Pollutant-equivalence multiplier applied to wasteload allocations when deriving permit limits and to delivered credits.
        default: 1.0000
        constraints: "> 0.0000; 4 decimal places"
      - name: eligible_zone_codes
        type: array
        source: input
        description: Explicit list of Reach.trading_zone_code values in which credit-generating practices may be registered.
        constraints: non-empty array of strings
      - name: program_status
        type: enum
        source: system
        description: Program lifecycle state; gates every trading operation in the watershed.
        default: PROVISIONAL
        constraints: "PROVISIONAL | ACTIVE | ADAPTIVE_HOLD | TERMINATED"
      - name: trading_enabled
        type: boolean
        source: computed
        description: "Derived gate: true if and only if program_status == ACTIVE."
        default: false
      - name: reserve_pool_lbs
        type: number
        source: computed
        description: Reserve pool balance in lbs; accrues the allocation-run reserve set-aside, credit retirement-ratio withholdings, batch residual fractions and explicit batch retirements.
        default: 0.00
        constraints: ">= 0.00; 2 decimal places"
      - name: serial_counter
        type: integer
        source: computed
        description: Monotonic whole-lb serial cursor; the high-water mark of every credit serial number minted in this watershed.
        default: 0
      - name: allocated_wla_total_lbs_yr
        type: number
        source: computed
        description: Sum of allocated_load_lbs_yr over POINT source assessments written by the watershed's ACTIVE allocation run; 0.00 when no ACTIVE run exists.
        default: 0.00
      - name: allocated_la_total_lbs_yr
        type: number
        source: computed
        description: Sum of allocated_load_lbs_yr over NONPOINT source assessments written by the watershed's ACTIVE allocation run; 0.00 when no ACTIVE run exists.
        default: 0.00

  - name: Reach
    parent: Watershed
    common_fields: true
    fields:
      - name: watershed_id
        type: string
        source: input
        description: FK -> Watershed.id
      - name: downstream_reach_id
        type: string
        source: input
        description: "FK -> Reach.id; null for an outlet reach. Must belong to the same watershed_id. The chain of downstream_reach_id links is acyclic and is the geographic-eligibility path for trading."
        default: null
      - name: reach_code
        type: string
        source: input
        description: Program-assigned reach identifier.
        constraints: unique within watershed_id
      - name: trading_zone_code
        type: string
        source: input
        description: Trading zone this reach belongs to; checked against Watershed.eligible_zone_codes when a practice project is registered.
      - name: reach_class
        type: enum
        source: input
        description: Monitoring role of the reach. BACKGROUND reaches feed the FINAL allocation variant's background load; COMPLIANCE_POINT reaches feed adaptive-management evaluation.
        constraints: "HEADWATER | MAINSTEM | COMPLIANCE_POINT | BACKGROUND"
      - name: delivery_factor
        type: number
        source: input
        description: Fraction of a load leaving this reach that arrives at its immediate downstream reach.
        constraints: "0.0000 < x <= 1.0000; 4 decimal places"

  - name: TmdlAssessment
    parent: Watershed
    common_fields: true
    fields:
      - name: watershed_id
        type: string
        source: input
        description: FK -> Watershed.id
      - name: assessment_code
        type: string
        source: input
        description: Program-assigned TMDL document code.
        constraints: unique within watershed_id
      - name: loading_capacity_lbs_yr
        type: number
        source: input
        description: Total maximum daily load expressed as an annual loading capacity, in lbs/yr.
        constraints: "> 0; 2 decimal places"
      - name: margin_of_safety_pct
        type: number
        source: input
        description: Fraction of loading capacity withheld as margin of safety.
        constraints: "0.0000 <= x <= 0.5000; 4 decimal places"
      - name: background_load_lbs_yr
        type: number
        source: input
        description: Analyst's estimated natural background load in lbs/yr; used verbatim by the PROVISIONAL allocation variant.
        constraints: ">= 0; 2 decimal places"
      - name: period_start_date
        type: string
        source: input
        description: Inclusive first calendar date of the assessment period, ISO date (YYYY-MM-DD).
      - name: period_end_date
        type: string
        source: input
        description: Inclusive last calendar date of the assessment period, ISO date (YYYY-MM-DD).
        constraints: "must be strictly after period_start_date"
      - name: status
        type: enum
        source: system
        description: TMDL development lifecycle state.
        default: DRAFT
        constraints: "DRAFT | PUBLIC_COMMENT | REVISION | APPROVED | WITHDRAWN | SUPERSEDED"
      - name: revision_round
        type: integer
        source: computed
        description: Count of PUBLIC_COMMENT -> REVISION transitions this assessment has undergone.
        default: 0
      - name: margin_of_safety_lbs_yr
        type: number
        source: computed
        description: Margin of safety in lbs/yr written by the latest ACTIVE allocation run; 0.00 before the first run.
        default: 0.00
      - name: allocable_load_lbs_yr
        type: number
        source: computed
        description: loading_capacity_lbs_yr minus margin_of_safety_lbs_yr minus effective_background_lbs_yr, written by the latest ACTIVE allocation run.
        default: 0.00
      - name: wla_total_lbs_yr
        type: number
        source: computed
        description: Sum of per-source POINT allocations from the latest ACTIVE allocation run.
        default: 0.00
      - name: la_total_lbs_yr
        type: number
        source: computed
        description: Sum of per-source NONPOINT allocations from the latest ACTIVE allocation run.
        default: 0.00
      - name: reserve_allocation_lbs_yr
        type: number
        source: computed
        description: Reserve set-aside in lbs/yr from the latest ACTIVE allocation run, including the per-source rounding residue.
        default: 0.00
      - name: effective_background_lbs_yr
        type: number
        source: computed
        description: Background load actually used by the latest ACTIVE allocation run; null before the first run.
        default: null
      - name: allocation_variant
        type: enum
        source: computed
        description: Variant selected by the latest ACTIVE allocation run; null before the first run.
        default: null
        constraints: "PROVISIONAL | FINAL | null"
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant of the transition into APPROVED; null otherwise. ISO 8601 UTC, three fractional digits.
        default: null

  - name: SourceAssessment
    parent: TmdlAssessment
    common_fields: true
    fields:
      - name: tmdl_assessment_id
        type: string
        source: input
        description: FK -> TmdlAssessment.id
      - name: reach_id
        type: string
        source: input
        description: "FK -> Reach.id; must belong to the same watershed as the assessment."
      - name: source_name
        type: string
        source: input
        description: Name of the pollutant source inventoried by this row.
      - name: source_type
        type: enum
        source: input
        description: Point sources receive wasteload allocations; nonpoint sources receive load allocations.
        constraints: "POINT | NONPOINT"
      - name: existing_load_lbs_yr
        type: number
        source: input
        description: Current annual load attributed to this source, in lbs/yr; the pro-rata allocation weight.
        constraints: ">= 0; 2 decimal places"
      - name: controllability_index
        type: number
        source: input
        description: Share of this source's load that is technically controllable; the CONTROLLABILITY_WEIGHTED allocation weight multiplier.
        constraints: "0.0000 <= x <= 1.0000; 4 decimal places"
      - name: status
        type: enum
        source: input
        description: Inventory status. INVENTORIED and ADJUSTED rows enter allocation; EXCLUDED rows never do.
        default: INVENTORIED
        constraints: "INVENTORIED | ADJUSTED | EXCLUDED"
      - name: allocated_load_lbs_yr
        type: number
        source: computed
        description: Allocation written by the latest ACTIVE allocation run; null before the first run and after the run that wrote it is RESCINDED.
        default: null
      - name: allocation_run_id
        type: string
        source: computed
        description: "FK -> AllocationRun.id; the run that last wrote allocated_load_lbs_yr. null before the first run and after that run is RESCINDED."
        default: null

  - name: AllocationRun
    parent: TmdlAssessment
    common_fields: true
    fields:
      - name: tmdl_assessment_id
        type: string
        source: input
        description: FK -> TmdlAssessment.id
      - name: run_label
        type: string
        source: input
        description: Analyst-supplied label for this allocation run.
      - name: method
        type: enum
        source: input
        description: Weighting rule used to spread each pool across its sources.
        constraints: "PRO_RATA_BY_EXISTING_LOAD | CONTROLLABILITY_WEIGHTED"
      - name: variant
        type: enum
        source: computed
        description: PROVISIONAL when the parent assessment status is DRAFT, PUBLIC_COMMENT or REVISION at run time; FINAL when it is APPROVED.
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: system
        description: ACTIVE for the newest run on the assessment; SUPERSEDED once a newer run is created; RESCINDED once explicitly rescinded.
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED | RESCINDED"
      - name: effective_background_lbs_yr
        type: number
        source: computed
        description: Background load this run used, in lbs/yr.
      - name: margin_of_safety_lbs_yr
        type: number
        source: computed
        description: Margin of safety this run withheld, in lbs/yr.
      - name: allocable_load_lbs_yr
        type: number
        source: computed
        description: Load available for allocation after margin of safety and background, in lbs/yr.
      - name: point_pool_lbs_yr
        type: number
        source: computed
        description: Share of the distributable load reserved for POINT sources, in lbs/yr.
      - name: nonpoint_pool_lbs_yr
        type: number
        source: computed
        description: Share of the distributable load reserved for NONPOINT sources, in lbs/yr.
      - name: reserve_allocation_lbs_yr
        type: number
        source: computed
        description: Reserve set-aside plus per-source rounding residue, in lbs/yr; the balancing term of the load-conservation identity.
      - name: wla_total_lbs_yr
        type: number
        source: computed
        description: Sum of the per-source POINT allocations after each was individually rounded.
      - name: la_total_lbs_yr
        type: number
        source: computed
        description: Sum of the per-source NONPOINT allocations after each was individually rounded.
      - name: included_source_count
        type: integer
        source: computed
        description: Number of SourceAssessment rows with status IN {INVENTORIED, ADJUSTED} that this run allocated to.
      - name: allocations
        type: array
        source: computed
        description: "Ordered array of objects { source_assessment_id, source_type, existing_load_lbs_yr, weight, allocated_load_lbs_yr }, POINT rows first then NONPOINT rows, each group ordered by existing_load_lbs_yr DESC then created_at ASC."
      - name: rescinded_at
        type: datetime
        source: computed
        description: Logical-clock instant of the RESCINDED transition; null otherwise. ISO 8601 UTC, three fractional digits.
        default: null

  - name: Permit
    parent: Watershed
    common_fields: true
    fields:
      - name: watershed_id
        type: string
        source: input
        description: FK -> Watershed.id
      - name: source_assessment_id
        type: string
        source: input
        description: "FK -> SourceAssessment.id; must be a POINT row belonging to a TmdlAssessment of the same watershed. Supplies wla_lbs_yr and the receiving reach for geographic eligibility."
      - name: permit_number
        type: string
        source: input
        description: NPDES permit number.
        constraints: unique across all Permit rows
      - name: permittee_user_id
        type: string
        source: input
        description: Opaque X-User-ID value of the Permittee authorised to report and to purchase credits for this permit.
      - name: design_flow_mgd
        type: number
        source: input
        description: Design flow in million gallons per day; recorded for the permit record.
        constraints: "> 0; 4 decimal places"
      - name: effective_date
        type: string
        source: input
        description: Inclusive first calendar date the permit limits take effect, ISO date (YYYY-MM-DD); anchor of the compliance schedule.
      - name: current_annual_load_lbs
        type: number
        source: input
        description: Discharger's most recent annual load in lbs; denominator of the required-reduction percentage.
        constraints: ">= 0; 2 decimal places"
      - name: limit_status
        type: enum
        source: system
        description: First independent state axis; tracks how far the permit's numeric limits have progressed.
        default: DRAFT_LIMITS
        constraints: "DRAFT_LIMITS | INTERIM | FINAL"
      - name: compliance_status
        type: enum
        source: system
        description: Second independent state axis; tracks the reported-load-versus-limit posture. Evolves independently of limit_status on the same row.
        default: NOT_REPORTED
        constraints: "NOT_REPORTED | IN_COMPLIANCE | SHORTFALL | RESOLVED | VIOLATION"
      - name: wla_lbs_yr
        type: number
        source: computed
        description: Copy of the linked SourceAssessment.allocated_load_lbs_yr captured when limits were derived; null before derivation.
        default: null
      - name: final_limit_lbs_yr
        type: number
        source: computed
        description: Final annual effluent limit in lbs/yr; null before derivation.
        default: null
      - name: interim_limit_lbs_yr
        type: number
        source: computed
        description: Interim annual effluent limit in lbs/yr granted by the compliance schedule; null before derivation.
        default: null
      - name: required_reduction_pct
        type: number
        source: computed
        description: Percent reduction from current_annual_load_lbs to final_limit_lbs_yr; selects the compliance-schedule tier.
        default: null
      - name: schedule_tier
        type: enum
        source: computed
        description: Compliance-schedule tier selected from required_reduction_pct.
        default: null
        constraints: "TIER_A | TIER_B | TIER_C | null"
      - name: compliance_schedule_end_date
        type: string
        source: computed
        description: Inclusive last calendar date on which the interim limit applies, ISO date (YYYY-MM-DD); null before derivation.
        default: null
      - name: applicable_limit_lbs_yr
        type: number
        source: computed
        description: The limit compliance is measured against right now; null while limit_status == DRAFT_LIMITS.
        default: null
      - name: reported_annual_load_lbs
        type: number
        source: computed
        description: Discharged load from the most recent annual report; null before any report.
        default: null
      - name: reporting_period_year
        type: integer
        source: computed
        description: Calendar year of the most recent annual report; null before any report.
        default: null
      - name: credit_applied_lbs
        type: number
        source: computed
        description: Sum of applied_lbs over CreditTransaction rows for this permit with status == APPROVED.
        default: 0.00
      - name: compliance_gap_lbs
        type: number
        source: computed
        description: Unmet load in lbs after the applicable limit and applied credits; 0.00 when the permit is not short.
        default: 0.00
      - name: enforcement_flag
        type: boolean
        source: computed
        description: Set true when compliance_status becomes VIOLATION; never cleared once set.
        default: false

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the agricultural producer enrolling practices.
      - name: county_code
        type: string
        source: input
        description: County code of the producer's operation.
      - name: contact_email
        type: string
        source: input
        description: Contact email for verification scheduling.

  - name: PracticeProject
    parent: Producer
    common_fields: true
    fields:
      - name: producer_id
        type: string
        source: input
        description: FK -> Producer.id
      - name: reach_id
        type: string
        source: input
        description: "FK -> Reach.id; the reach the practice discharges to. Its trading_zone_code must appear in the watershed's eligible_zone_codes."
      - name: tract_code
        type: string
        source: input
        description: Farm tract identifier; the occupancy resource for practice-period overlap detection.
      - name: practice_type
        type: enum
        source: input
        description: Agricultural best management practice generating the reduction.
        constraints: "COVER_CROP | RIPARIAN_BUFFER | NUTRIENT_MANAGEMENT | WETLAND_RESTORATION"
      - name: enrolled_acres
        type: number
        source: input
        description: Acres enrolled under the practice.
        constraints: "> 0; 2 decimal places"
      - name: baseline_met
        type: boolean
        source: input
        description: Whether the tract already satisfies the program's regulatory baseline requirement; a project may not be baseline-verified while false.
      - name: pre_load_lbs_yr
        type: number
        source: input
        description: Modelled annual load from the tract before the practice, in lbs/yr.
        constraints: ">= 0; 2 decimal places"
      - name: post_load_lbs_yr
        type: number
        source: input
        description: Modelled annual load from the tract after the practice, in lbs/yr.
        constraints: ">= 0 and < pre_load_lbs_yr; 2 decimal places"
      - name: effective_start_date
        type: string
        source: input
        description: Inclusive first calendar date of the credit-generation period, ISO date (YYYY-MM-DD).
      - name: effective_end_date
        type: string
        source: input
        description: Exclusive last calendar date of the credit-generation period, ISO date (YYYY-MM-DD); the interval is half-open.
        constraints: "must be strictly after effective_start_date"
      - name: vintage_year
        type: integer
        source: input
        description: Credit vintage year stamped on the issued batch.
      - name: status
        type: enum
        source: system
        description: Practice lifecycle state; loops CERTIFIED -> PENDING_REVERIFICATION -> CERTIFIED.
        default: REGISTERED
        constraints: "REGISTERED | BASELINE_VERIFIED | IMPLEMENTED | CERTIFIED | PENDING_REVERIFICATION | REVOKED"
      - name: verified_acres
        type: number
        source: computed
        description: Acres confirmed by the IMPLEMENTATION verification event; null before it.
        default: null
      - name: baseline_verifier_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the PracticeVerifier who recorded the passing BASELINE event; null before it.
        default: null
      - name: implementation_verifier_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the PracticeVerifier who recorded the passing IMPLEMENTATION event; null before it.
        default: null
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant of the first transition into CERTIFIED; null before it. ISO 8601 UTC, three fractional digits.
        default: null

  - name: VerificationEvent
    parent: PracticeProject
    common_fields: false
    fields:
      - name: practice_project_id
        type: string
        source: input
        description: FK -> PracticeProject.id
      - name: event_type
        type: enum
        source: input
        description: Which verification step this event records.
        constraints: "BASELINE | IMPLEMENTATION | REVERIFICATION"
      - name: outcome
        type: enum
        source: input
        description: Inspection result driving the project's next state.
        constraints: "PASS | PARTIAL | FAIL"
      - name: verified_acres
        type: number
        source: input
        description: Acres confirmed on site; required for IMPLEMENTATION PASS and for REVERIFICATION PASS or PARTIAL, forbidden otherwise.
        default: null
        constraints: ">= 0 and <= PracticeProject.enrolled_acres; 2 decimal places"
      - name: narrative
        type: string
        source: input
        description: Inspector's written finding.
      - name: inspector_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the acting PracticeVerifier, recorded from the request header.
      - name: observed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the event was recorded. ISO 8601 UTC, three fractional digits.
      - name: resulting_project_status
        type: enum
        source: computed
        description: PracticeProject.status immediately after this event was applied.
        constraints: "REGISTERED | BASELINE_VERIFIED | IMPLEMENTED | CERTIFIED | PENDING_REVERIFICATION | REVOKED"

  - name: CreditBatch
    parent: PracticeProject
    common_fields: true
    fields:
      - name: practice_project_id
        type: string
        source: input
        description: FK -> PracticeProject.id
      - name: serial_prefix
        type: string
        source: computed
        description: "Serial prefix, formatted `<Watershed.state_code>-<Watershed.watershed_code>-<PracticeProject.vintage_year>`."
      - name: serial_start
        type: integer
        source: computed
        description: First whole-lb serial number minted for this batch (Watershed.serial_counter + 1 at certification).
      - name: serial_end
        type: integer
        source: computed
        description: Last whole-lb serial number minted for this batch (serial_start + issued_lbs - 1).
      - name: vintage_year
        type: integer
        source: computed
        description: Copy of PracticeProject.vintage_year at certification.
      - name: gross_reduction_lbs_yr
        type: number
        source: computed
        description: Verified-acre-prorated load reduction in lbs/yr before whole-lb serialization.
      - name: issued_lbs
        type: integer
        source: computed
        description: Whole lbs serialized into the registry; floor(gross_reduction_lbs_yr). The conserved total of this batch.
      - name: residual_lbs
        type: number
        source: computed
        description: Fractional lbs dropped by whole-lb serialization; credited to Watershed.reserve_pool_lbs at certification.
      - name: available_lbs
        type: number
        source: computed
        description: Unencumbered lbs still sellable from this batch.
        default: 0.00
      - name: reserved_lbs
        type: number
        source: computed
        description: Lbs held by CreditTransaction rows with status == PROPOSED against this batch.
        default: 0.00
      - name: retired_lbs
        type: number
        source: computed
        description: Lbs permanently consumed by APPROVED transactions or by explicit batch retirement.
        default: 0.00
      - name: invalidated_lbs
        type: number
        source: computed
        description: Lbs voided out of the registry because the generating project was revoked.
        default: 0.00
      - name: verified_ratio
        type: number
        source: computed
        description: Ratio of the most recent REVERIFICATION verified_acres to PracticeProject.verified_acres at certification; scales the settled gross quantity of transactions approved after a reverification.
        default: 1.0000
        constraints: "0.0000 <= x <= 1.0000; 4 decimal places"
      - name: status
        type: enum
        source: system
        description: Registry state of the batch.
        default: ISSUED
        constraints: "ISSUED | LISTED | RETIRED | INVALIDATED"

  - name: CreditTransaction
    parent: CreditBatch
    common_fields: true
    fields:
      - name: credit_batch_id
        type: string
        source: input
        description: FK -> CreditBatch.id
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; the buyer permit that will carry the credits as an enforceable compliance term."
      - name: requested_gross_lbs
        type: number
        source: input
        description: Gross lbs the permittee asks to buy from the batch before any trading ratio is applied.
        constraints: "> 0; 2 decimal places"
      - name: reporting_period_year
        type: integer
        source: input
        description: Compliance year the credits are applied to; must equal Permit.reporting_period_year.
      - name: status
        type: enum
        source: system
        description: Trade lifecycle state.
        default: PROPOSED
        constraints: "PROPOSED | APPROVED | VOIDED"
      - name: delivery_ratio
        type: number
        source: computed
        description: Product of the delivery_factor values along the downstream reach path from the generating reach to the buyer reach, exclusive of the generating reach itself; 1.0000 when both reaches are the same row.
      - name: path_reach_count
        type: integer
        source: computed
        description: Number of reaches on the eligibility path from the generating reach to the buyer reach inclusive of both ends.
      - name: retired_to_reserve_lbs
        type: number
        source: computed
        description: "Portion withheld by Watershed.retirement_ratio: computed from requested_gross_lbs while PROPOSED, recomputed from settled_gross_lbs at approval. It is credited to Watershed.reserve_pool_lbs only at approval and debited only when an APPROVED transaction is voided."
      - name: tradable_lbs
        type: number
        source: computed
        description: requested_gross_lbs minus retired_to_reserve_lbs.
      - name: proposed_delivered_lbs
        type: number
        source: computed
        description: Delivered lbs computed at proposal time from the full requested gross quantity.
      - name: permit_gap_at_proposal_lbs
        type: number
        source: computed
        description: Permit.compliance_gap_lbs observed at proposal time; the cap on applied_lbs.
      - name: settled_delivered_lbs
        type: number
        source: computed
        description: Delivered lbs recomputed at approval time from the reverification-adjusted gross quantity; null while PROPOSED.
        default: null
      - name: settled_gross_lbs
        type: number
        source: computed
        description: requested_gross_lbs scaled by CreditBatch.verified_ratio at approval time; null while PROPOSED.
        default: null
      - name: applied_lbs
        type: number
        source: computed
        description: Lbs actually credited against the buyer permit's compliance gap; null while PROPOSED, 0.00 or more once APPROVED, unchanged in value but no longer counted once VOIDED.
        default: null
      - name: void_reason
        type: enum
        source: computed
        description: Why the transaction was voided; null while not VOIDED.
        default: null
        constraints: "ADAPTIVE_HOLD | BATCH_INVALIDATED | REGISTRY_ACTION | null"
      - name: voided_at
        type: datetime
        source: computed
        description: Logical-clock instant of the VOIDED transition; null otherwise. ISO 8601 UTC, three fractional digits.
        default: null

  - name: MonitoringSample
    parent: Reach
    common_fields: false
    fields:
      - name: reach_id
        type: string
        source: input
        description: FK -> Reach.id
      - name: sample_datetime
        type: datetime
        source: input
        description: Instant the sample was collected. ISO 8601 UTC, three fractional digits.
      - name: measured_conc_mg_l
        type: number
        source: input
        description: Measured nutrient concentration in mg/L.
        constraints: ">= 0; 4 decimal places"
      - name: flow_cfs
        type: number
        source: input
        description: Stream flow at sampling, in cubic feet per second.
        constraints: ">= 0; 2 decimal places"
      - name: qa_status
        type: enum
        source: input
        description: Quality assurance state; only ACCEPTED samples enter background and adaptive-management aggregations.
        default: ACCEPTED
        constraints: "ACCEPTED | REJECTED | PROVISIONAL"
      - name: computed_load_lbs_yr
        type: number
        source: computed
        description: Annualized load implied by this sample, in lbs/yr.

  - name: AdaptiveReview
    parent: Watershed
    common_fields: true
    fields:
      - name: watershed_id
        type: string
        source: input
        description: FK -> Watershed.id
      - name: review_label
        type: string
        source: input
        description: Stakeholder-facing label for the evaluation cycle.
      - name: period_start_date
        type: string
        source: input
        description: Inclusive first calendar date of the evaluation window, ISO date (YYYY-MM-DD).
      - name: period_end_date
        type: string
        source: input
        description: Inclusive last calendar date of the evaluation window, ISO date (YYYY-MM-DD); the window is a closed interval.
        constraints: "must be strictly after period_start_date"
      - name: status
        type: enum
        source: system
        description: Review lifecycle state.
        default: OPEN
        constraints: "OPEN | FINALIZED"
      - name: sample_count
        type: integer
        source: computed
        description: Number of qualifying MonitoringSample rows found in the window; null while OPEN.
        default: null
      - name: observed_load_lbs_yr
        type: number
        source: computed
        description: Mean computed_load_lbs_yr over the qualifying samples; null when sample_count is 0 or while OPEN.
        default: null
      - name: achieved_reduction_pct
        type: number
        source: computed
        description: Percent of the baseline-to-capacity reduction achieved; null when sample_count is 0 or while OPEN.
        default: null
      - name: verdict
        type: enum
        source: computed
        description: Program evaluation outcome against the load reduction target; null while OPEN.
        default: null
        constraints: "ON_TRACK | OFF_TRACK | INDETERMINATE | null"
      - name: voided_transaction_count
        type: integer
        source: computed
        description: Number of CreditTransaction rows the OFF_TRACK cascade voided; 0 for ON_TRACK and INDETERMINATE verdicts, null while OPEN.
        default: null
      - name: finalized_at
        type: datetime
        source: computed
        description: Logical-clock instant of the FINALIZED transition; null while OPEN. ISO 8601 UTC, three fractional digits.
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Watershed
    state_field: program_status
    initial_state: PROVISIONAL
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "system: a TmdlAssessment for this watershed transitions into APPROVED"
        actor: system
        preconditions:
          - "Watershed.program_status == PROVISIONAL"
        side_effects:
          - "sets Watershed.trading_enabled = true"
          - "increments Watershed.version by 1"
      - from: ACTIVE
        to: ADAPTIVE_HOLD
        trigger: "POST /watersheds/{watershed_id}/program-status with target_status=ADAPTIVE_HOLD, or system: an AdaptiveReview finalizes with verdict OFF_TRACK"
        actor: ProgramAdministrator | system
        preconditions:
          - "Watershed.program_status == ACTIVE"
        side_effects:
          - "sets Watershed.trading_enabled = false"
          - "CASCADE link 2: because the watershed left ACTIVE, every CreditTransaction whose Permit.watershed_id == this watershed and whose status IN {PROPOSED, APPROVED} transitions to VOIDED with void_reason = ADAPTIVE_HOLD, processed in created_at ASC order"
          - "CASCADE link 3: because each of those transactions was voided, its CreditBatch buckets are restored - for a PROPOSED loser reserved_lbs decreases by requested_gross_lbs and available_lbs increases by the same amount; for an APPROVED loser retired_lbs decreases by settled_gross_lbs and available_lbs increases by the same amount; each touched CreditBatch.version increments by 1"
          - "CASCADE link 4: because the APPROVED transactions were voided, each buyer Permit.credit_applied_lbs decreases by that transaction's applied_lbs, Permit.compliance_gap_lbs is recomputed by permit_compliance_reconciliation, Permit.compliance_status moves RESOLVED -> SHORTFALL when the recomputed gap is greater than 0.00, and Permit.version increments by 1"
          - "increments Watershed.version by 1"
      - from: ADAPTIVE_HOLD
        to: ACTIVE
        trigger: "POST /watersheds/{watershed_id}/program-status with target_status=ACTIVE"
        actor: ProgramAdministrator
        preconditions:
          - "Watershed.program_status == ADAPTIVE_HOLD"
        side_effects:
          - "sets Watershed.trading_enabled = true"
          - "increments Watershed.version by 1"
        note: "Closes the adaptive-management loop; previously voided transactions are not resurrected."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /watersheds/{watershed_id}/program-status with target_status=TERMINATED"
        actor: ProgramAdministrator
        preconditions:
          - "Watershed.program_status == ACTIVE"
        side_effects:
          - "sets Watershed.trading_enabled = false"
          - "runs the same CASCADE links 2-4 described on ACTIVE -> ADAPTIVE_HOLD"
          - "increments Watershed.version by 1"
      - from: ADAPTIVE_HOLD
        to: TERMINATED
        trigger: "POST /watersheds/{watershed_id}/program-status with target_status=TERMINATED"
        actor: ProgramAdministrator
        preconditions:
          - "Watershed.program_status == ADAPTIVE_HOLD"
        side_effects:
          - "increments Watershed.version by 1"

  - entity: TmdlAssessment
    state_field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PUBLIC_COMMENT
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=PUBLIC_COMMENT"
        actor: TmdlAnalyst
        preconditions:
          - "TmdlAssessment.status == DRAFT"
          - "at least one SourceAssessment with tmdl_assessment_id == this assessment and status IN {INVENTORIED, ADJUSTED} exists"
        side_effects:
          - "increments TmdlAssessment.version by 1"
      - from: PUBLIC_COMMENT
        to: REVISION
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=REVISION"
        actor: ProgramAdministrator
        preconditions:
          - "TmdlAssessment.status == PUBLIC_COMMENT"
        side_effects:
          - "increments TmdlAssessment.revision_round by 1"
          - "increments TmdlAssessment.version by 1"
      - from: REVISION
        to: PUBLIC_COMMENT
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=PUBLIC_COMMENT"
        actor: TmdlAnalyst
        preconditions:
          - "TmdlAssessment.status == REVISION"
        side_effects:
          - "increments TmdlAssessment.version by 1"
        note: "Closes the stakeholder revision loop; revision_round is NOT reset and may grow without bound."
      - from: PUBLIC_COMMENT
        to: APPROVED
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=APPROVED"
        actor: ProgramAdministrator
        preconditions:
          - "TmdlAssessment.status == PUBLIC_COMMENT"
          - "at least one AllocationRun with tmdl_assessment_id == this assessment and status == ACTIVE exists, else ERR_WLA_NOT_ALLOCATED"
        side_effects:
          - "sets TmdlAssessment.approved_at to the logical clock instant"
          - "any other TmdlAssessment with the same watershed_id and status == APPROVED transitions to SUPERSEDED"
          - "when Watershed.program_status == PROVISIONAL it transitions to ACTIVE and trading_enabled becomes true"
          - "increments TmdlAssessment.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=WITHDRAWN"
        actor: ProgramAdministrator
        preconditions:
          - "TmdlAssessment.status == DRAFT"
        side_effects:
          - "increments TmdlAssessment.version by 1"
      - from: PUBLIC_COMMENT
        to: WITHDRAWN
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=WITHDRAWN"
        actor: ProgramAdministrator
        preconditions:
          - "TmdlAssessment.status == PUBLIC_COMMENT"
        side_effects:
          - "increments TmdlAssessment.version by 1"
      - from: REVISION
        to: WITHDRAWN
        trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/status with target_status=WITHDRAWN"
        actor: ProgramAdministrator
        preconditions:
          - "TmdlAssessment.status == REVISION"
        side_effects:
          - "increments TmdlAssessment.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: another TmdlAssessment with the same watershed_id transitions into APPROVED"
        actor: system
        preconditions:
          - "TmdlAssessment.status == APPROVED"
        side_effects:
          - "increments TmdlAssessment.version by 1"
        note: "Allocations already written onto SourceAssessment rows are left untouched."

  - entity: AllocationRun
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RESCINDED]
    shape: branching
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer AllocationRun is created on the same TmdlAssessment"
        actor: system
        preconditions:
          - "AllocationRun.status == ACTIVE"
        side_effects:
          - "increments AllocationRun.version by 1"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /allocation-runs/{allocation_run_id}/rescind"
        actor: TmdlAnalyst
        preconditions:
          - "AllocationRun.status == ACTIVE"
          - "no Permit whose source_assessment_id points at a SourceAssessment carrying allocation_run_id == this run has limit_status IN {INTERIM, FINAL}, else ERR_ALLOCATION_RUN_IN_USE"
        side_effects:
          - "for every SourceAssessment with allocation_run_id == this run, sets allocated_load_lbs_yr = null and allocation_run_id = null and increments that SourceAssessment.version by 1"
          - "restores TmdlAssessment.margin_of_safety_lbs_yr, allocable_load_lbs_yr, wla_total_lbs_yr, la_total_lbs_yr and reserve_allocation_lbs_yr to 0.00 and effective_background_lbs_yr and allocation_variant to null when no other ACTIVE run remains, and increments TmdlAssessment.version by 1"
          - "decreases Watershed.reserve_pool_lbs by this run's reserve_allocation_lbs_yr, sets Watershed.allocated_wla_total_lbs_yr and allocated_la_total_lbs_yr to 0.00, and increments Watershed.version by 1"
          - "sets AllocationRun.rescinded_at to the logical clock instant"
          - "increments AllocationRun.version by 1"
        note: "Compensating action for the load-conservation invariant."

  - entity: Permit
    state_field: limit_status
    initial_state: DRAFT_LIMITS
    terminal_states: [FINAL]
    shape: linear
    note: "First of two independent state axes on the Permit row. limit_status and compliance_status advance on separate triggers and neither constrains the other's transition set except where a precondition says so."
    transitions:
      - from: DRAFT_LIMITS
        to: INTERIM
        trigger: "POST /permits/{permit_id}/derive-limits"
        actor: PermitWriter
        preconditions:
          - "Permit.limit_status == DRAFT_LIMITS"
          - "the linked SourceAssessment.allocated_load_lbs_yr is not null, else ERR_WLA_NOT_ALLOCATED"
        side_effects:
          - "runs permit_effluent_limit_derivation and writes wla_lbs_yr, final_limit_lbs_yr, required_reduction_pct, schedule_tier, interim_limit_lbs_yr and compliance_schedule_end_date"
          - "recomputes Permit.applicable_limit_lbs_yr"
          - "increments Permit.version by 1"
      - from: INTERIM
        to: FINAL
        trigger: "POST /permits/{permit_id}/finalize-limits"
        actor: PermitWriter
        preconditions:
          - "Permit.limit_status == INTERIM"
          - "the TmdlAssessment reached through Permit.source_assessment_id -> SourceAssessment.tmdl_assessment_id has status == APPROVED, else ERR_TMDL_NOT_APPROVED"
        side_effects:
          - "sets Permit.applicable_limit_lbs_yr = Permit.final_limit_lbs_yr"
          - "recomputes Permit.compliance_gap_lbs and Permit.compliance_status by permit_compliance_reconciliation when reported_annual_load_lbs is not null"
          - "increments Permit.version by 1"

  - entity: Permit
    state_field: compliance_status
    initial_state: NOT_REPORTED
    terminal_states: []
    shape: cyclic
    note: "Second independent state axis on the same Permit row; it can reach VIOLATION while limit_status is still INTERIM, and it can cycle SHORTFALL -> RESOLVED -> SHORTFALL without limit_status moving at all."
    transitions:
      - from: NOT_REPORTED
        to: IN_COMPLIANCE
        trigger: "POST /permits/{permit_id}/annual-report"
        actor: Permittee
        preconditions:
          - "Permit.limit_status IN {INTERIM, FINAL}, else ERR_LIMITS_NOT_DERIVED"
          - "permit_compliance_reconciliation yields compliance_gap_lbs == 0.00"
        side_effects:
          - "writes reported_annual_load_lbs, reporting_period_year, applicable_limit_lbs_yr and compliance_gap_lbs = 0.00"
          - "increments Permit.version by 1"
      - from: NOT_REPORTED
        to: SHORTFALL
        trigger: "POST /permits/{permit_id}/annual-report"
        actor: Permittee
        preconditions:
          - "Permit.limit_status IN {INTERIM, FINAL}, else ERR_LIMITS_NOT_DERIVED"
          - "permit_compliance_reconciliation yields compliance_gap_lbs > 0.00"
          - "the logical clock date is on or before Permit.compliance_schedule_end_date"
        side_effects:
          - "writes reported_annual_load_lbs, reporting_period_year, applicable_limit_lbs_yr and compliance_gap_lbs"
          - "increments Permit.version by 1"
      - from: NOT_REPORTED
        to: VIOLATION
        trigger: "POST /permits/{permit_id}/annual-report"
        actor: Permittee
        preconditions:
          - "Permit.limit_status IN {INTERIM, FINAL}, else ERR_LIMITS_NOT_DERIVED"
          - "permit_compliance_reconciliation yields compliance_gap_lbs > 0.00"
          - "the logical clock date is strictly after Permit.compliance_schedule_end_date"
        side_effects:
          - "writes reported_annual_load_lbs, reporting_period_year, applicable_limit_lbs_yr and compliance_gap_lbs"
          - "sets Permit.enforcement_flag = true"
          - "increments Permit.version by 1"
      - from: IN_COMPLIANCE
        to: SHORTFALL
        trigger: "POST /permits/{permit_id}/annual-report"
        actor: Permittee
        preconditions:
          - "permit_compliance_reconciliation yields compliance_gap_lbs > 0.00"
          - "the logical clock date is on or before Permit.compliance_schedule_end_date"
        side_effects:
          - "overwrites reported_annual_load_lbs, reporting_period_year and compliance_gap_lbs"
          - "increments Permit.version by 1"
      - from: IN_COMPLIANCE
        to: SHORTFALL
        trigger: "system: POST /permits/{permit_id}/finalize-limits tightens applicable_limit_lbs_yr from the interim limit to the final limit"
        actor: system
        preconditions:
          - "Permit.compliance_status == IN_COMPLIANCE and Permit.reported_annual_load_lbs is not null"
          - "after applicable_limit_lbs_yr becomes final_limit_lbs_yr, permit_compliance_reconciliation yields compliance_gap_lbs > 0.00"
          - "the logical clock date is on or before Permit.compliance_schedule_end_date"
        side_effects:
          - "recomputes Permit.compliance_gap_lbs against the tightened applicable limit"
          - "increments Permit.version by 1 (the same increment as the limit_status transition; finalize-limits is one write)"
        note: "This is the only compliance-axis transition driven by a limit_status transition: it is how the two independent axes on the Permit row touch."
      - from: SHORTFALL
        to: IN_COMPLIANCE
        trigger: "POST /permits/{permit_id}/annual-report"
        actor: Permittee
        preconditions:
          - "permit_compliance_reconciliation yields compliance_gap_lbs == 0.00"
        side_effects:
          - "overwrites reported_annual_load_lbs, reporting_period_year and compliance_gap_lbs = 0.00"
          - "increments Permit.version by 1"
      - from: SHORTFALL
        to: RESOLVED
        trigger: "system: POST /credit-transactions/{credit_transaction_id}/approve closes the gap"
        actor: system
        preconditions:
          - "Permit.compliance_status == SHORTFALL"
          - "after adding the approved transaction's applied_lbs the recomputed compliance_gap_lbs == 0.00"
        side_effects:
          - "increases Permit.credit_applied_lbs by the transaction's applied_lbs"
          - "sets Permit.compliance_gap_lbs = 0.00"
          - "increments Permit.version by 1"
        note: "Credits become an enforceable term of the permit at this point."
      - from: RESOLVED
        to: SHORTFALL
        trigger: "system: POST /credit-transactions/{credit_transaction_id}/void, or the Watershed ACTIVE -> ADAPTIVE_HOLD cascade, releases previously applied credits"
        actor: system
        preconditions:
          - "Permit.compliance_status == RESOLVED"
          - "the voided transaction's void_reason != BATCH_INVALIDATED"
          - "after subtracting the voided transaction's applied_lbs the recomputed compliance_gap_lbs > 0.00"
        side_effects:
          - "decreases Permit.credit_applied_lbs by the transaction's applied_lbs"
          - "recomputes Permit.compliance_gap_lbs"
          - "increments Permit.version by 1"
      - from: RESOLVED
        to: VIOLATION
        trigger: "system: a CreditTransaction is voided with void_reason == BATCH_INVALIDATED because its generating PracticeProject was revoked"
        actor: system
        preconditions:
          - "Permit.compliance_status == RESOLVED"
          - "after subtracting the voided transaction's applied_lbs the recomputed compliance_gap_lbs > 0.00"
        side_effects:
          - "decreases Permit.credit_applied_lbs by the transaction's applied_lbs"
          - "recomputes Permit.compliance_gap_lbs"
          - "sets Permit.enforcement_flag = true"
          - "increments Permit.version by 1"
        note: "Terminal link of the revocation cascade; a credit that turns out never to have existed is an enforcement matter, not a mere shortfall."
      - from: SHORTFALL
        to: VIOLATION
        trigger: "system: a CreditTransaction is voided with void_reason == BATCH_INVALIDATED against a permit that is already short"
        actor: system
        preconditions:
          - "Permit.compliance_status == SHORTFALL"
        side_effects:
          - "decreases Permit.credit_applied_lbs by the transaction's applied_lbs when applied_lbs is not null"
          - "recomputes Permit.compliance_gap_lbs"
          - "sets Permit.enforcement_flag = true"
          - "increments Permit.version by 1"

  - entity: PracticeProject
    state_field: status
    initial_state: REGISTERED
    terminal_states: [REVOKED]
    shape: cyclic
    transitions:
      - from: REGISTERED
        to: BASELINE_VERIFIED
        trigger: "POST /verification-events with event_type=BASELINE, outcome=PASS"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == REGISTERED"
          - "PracticeProject.baseline_met == true, else ERR_BASELINE_NOT_MET"
        side_effects:
          - "sets PracticeProject.baseline_verifier_user_id to the acting X-User-ID"
          - "increments PracticeProject.version by 1"
      - from: BASELINE_VERIFIED
        to: IMPLEMENTED
        trigger: "POST /verification-events with event_type=IMPLEMENTATION, outcome=PASS"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == BASELINE_VERIFIED"
          - "the acting X-User-ID != PracticeProject.baseline_verifier_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "verified_acres is present and 0 < verified_acres <= PracticeProject.enrolled_acres"
        side_effects:
          - "sets PracticeProject.verified_acres to the event's verified_acres"
          - "sets PracticeProject.implementation_verifier_user_id to the acting X-User-ID"
          - "increments PracticeProject.version by 1"
      - from: IMPLEMENTED
        to: CERTIFIED
        trigger: "POST /practice-projects/{practice_project_id}/certify"
        actor: RegistryAdministrator
        preconditions:
          - "PracticeProject.status == IMPLEMENTED"
          - "the acting X-User-ID differs from both baseline_verifier_user_id and implementation_verifier_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Watershed.program_status == ACTIVE, else ERR_TRADING_SUSPENDED"
        side_effects:
          - "sets PracticeProject.certified_at to the logical clock instant"
          - "creates one CreditBatch by credit_batch_serialization with status ISSUED, verified_ratio 1.0000, available_lbs == issued_lbs, reserved_lbs 0.00, retired_lbs 0.00, invalidated_lbs 0.00"
          - "advances Watershed.serial_counter to the new batch's serial_end, increases Watershed.reserve_pool_lbs by the batch's residual_lbs, and increments Watershed.version by 1"
          - "increments PracticeProject.version by 1"
      - from: CERTIFIED
        to: PENDING_REVERIFICATION
        trigger: "POST /verification-events with event_type=REVERIFICATION, outcome=PARTIAL"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == CERTIFIED"
          - "verified_acres is present and 0 <= verified_acres < PracticeProject.verified_acres"
        side_effects:
          - "sets every CreditBatch with this practice_project_id and status IN {ISSUED, LISTED} to verified_ratio = round(event.verified_acres / PracticeProject.verified_acres, 4) and increments that CreditBatch.version by 1"
          - "increments PracticeProject.version by 1"
        note: "issued_lbs is never restated; the reduced ratio only shrinks the settled gross quantity of transactions approved from now on."
      - from: PENDING_REVERIFICATION
        to: CERTIFIED
        trigger: "POST /verification-events with event_type=REVERIFICATION, outcome=PASS"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == PENDING_REVERIFICATION"
          - "verified_acres is present and verified_acres == PracticeProject.verified_acres"
        side_effects:
          - "sets every CreditBatch with this practice_project_id and status IN {ISSUED, LISTED} to verified_ratio = 1.0000 and increments that CreditBatch.version by 1"
          - "increments PracticeProject.version by 1"
        note: "Closes the annual reverification loop; the project may cycle through PENDING_REVERIFICATION any number of times."
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /verification-events with event_type=REVERIFICATION, outcome=FAIL"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == CERTIFIED"
        side_effects:
          - "CASCADE link 2: because the project was revoked, every CreditBatch with this practice_project_id and status IN {ISSUED, LISTED} transitions to INVALIDATED, moving available_lbs and reserved_lbs into invalidated_lbs, processed in created_at ASC order"
          - "CASCADE link 3: because those batches were invalidated, every CreditTransaction against them with status IN {PROPOSED, APPROVED} transitions to VOIDED with void_reason = BATCH_INVALIDATED, and for APPROVED losers settled_gross_lbs moves from retired_lbs into invalidated_lbs"
          - "CASCADE link 4: because those transactions were voided, each buyer Permit.credit_applied_lbs decreases by the transaction's applied_lbs, compliance_gap_lbs is recomputed, compliance_status moves to VIOLATION and enforcement_flag becomes true"
          - "increments PracticeProject.version by 1"
      - from: PENDING_REVERIFICATION
        to: REVOKED
        trigger: "POST /verification-events with event_type=REVERIFICATION, outcome=FAIL"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == PENDING_REVERIFICATION"
        side_effects:
          - "runs the same CASCADE links 2-4 described on CERTIFIED -> REVOKED"
          - "increments PracticeProject.version by 1"
      - from: REGISTERED
        to: REVOKED
        trigger: "POST /verification-events with event_type=BASELINE, outcome=FAIL"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == REGISTERED"
        side_effects:
          - "increments PracticeProject.version by 1"
        note: "No batches exist yet, so no cascade fires."
      - from: BASELINE_VERIFIED
        to: REVOKED
        trigger: "POST /verification-events with event_type=IMPLEMENTATION, outcome=FAIL"
        actor: PracticeVerifier
        preconditions:
          - "PracticeProject.status == BASELINE_VERIFIED"
          - "the acting X-User-ID != PracticeProject.baseline_verifier_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "increments PracticeProject.version by 1"

  - entity: CreditBatch
    state_field: status
    initial_state: ISSUED
    terminal_states: [RETIRED, INVALIDATED]
    shape: branching
    transitions:
      - from: ISSUED
        to: LISTED
        trigger: "POST /credit-batches/{credit_batch_id}/list"
        actor: RegistryAdministrator
        preconditions:
          - "CreditBatch.status == ISSUED"
          - "the generating PracticeProject.status == CERTIFIED, else ERR_PROJECT_NOT_CERTIFIED"
          - "Watershed.program_status == ACTIVE, else ERR_TRADING_SUSPENDED"
          - "CreditBatch.available_lbs > 0.00, else ERR_CREDIT_INSUFFICIENT"
        side_effects:
          - "increments CreditBatch.version by 1"
      - from: ISSUED
        to: RETIRED
        trigger: "POST /credit-batches/{credit_batch_id}/retire"
        actor: RegistryAdministrator
        preconditions:
          - "CreditBatch.status == ISSUED"
          - "no CreditTransaction against this batch has status == PROPOSED, else ERR_BATCH_HAS_OPEN_TRANSACTIONS"
        side_effects:
          - "moves retire_lbs from available_lbs into retired_lbs"
          - "increases Watershed.reserve_pool_lbs by retire_lbs and increments Watershed.version by 1"
          - "increments CreditBatch.version by 1"
          - "the status change to RETIRED fires only when the move leaves available_lbs == 0.00; a partial retirement (retire_lbs < available_lbs) moves the buckets and bumps the version but leaves the status unchanged"
      - from: LISTED
        to: RETIRED
        trigger: "POST /credit-batches/{credit_batch_id}/retire"
        actor: RegistryAdministrator
        preconditions:
          - "CreditBatch.status == LISTED"
          - "no CreditTransaction against this batch has status == PROPOSED, else ERR_BATCH_HAS_OPEN_TRANSACTIONS"
        side_effects:
          - "moves retire_lbs from available_lbs into retired_lbs"
          - "increases Watershed.reserve_pool_lbs by retire_lbs and increments Watershed.version by 1"
          - "increments CreditBatch.version by 1"
          - "the status change to RETIRED fires only when the move leaves available_lbs == 0.00; a partial retirement (retire_lbs < available_lbs) moves the buckets and bumps the version but leaves the status unchanged"
      - from: ISSUED
        to: INVALIDATED
        trigger: "system: the generating PracticeProject transitions to REVOKED"
        actor: system
        preconditions:
          - "CreditBatch.status == ISSUED"
        side_effects:
          - "sets invalidated_lbs = round(invalidated_lbs + available_lbs + reserved_lbs, 2), available_lbs = 0.00, reserved_lbs = 0.00"
          - "increments CreditBatch.version by 1"
      - from: LISTED
        to: INVALIDATED
        trigger: "system: the generating PracticeProject transitions to REVOKED"
        actor: system
        preconditions:
          - "CreditBatch.status == LISTED"
        side_effects:
          - "sets invalidated_lbs = round(invalidated_lbs + available_lbs + reserved_lbs, 2), available_lbs = 0.00, reserved_lbs = 0.00"
          - "increments CreditBatch.version by 1"

  - entity: CreditTransaction
    state_field: status
    initial_state: PROPOSED
    terminal_states: [VOIDED]
    shape: branching
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /credit-transactions/{credit_transaction_id}/approve"
        actor: RegistryAdministrator
        preconditions:
          - "CreditTransaction.status == PROPOSED"
          - "CreditBatch.status == LISTED"
          - "the generating PracticeProject.status IN {CERTIFIED, PENDING_REVERIFICATION}"
          - "Watershed.program_status == ACTIVE, else ERR_TRADING_SUSPENDED"
          - "Permit.compliance_status == SHORTFALL, else ERR_NO_COMPLIANCE_GAP"
        side_effects:
          - "runs credit_transaction_delivery in its settled variant and writes settled_gross_lbs, settled_delivered_lbs, applied_lbs and the recomputed retired_to_reserve_lbs"
          - "increases Watershed.reserve_pool_lbs by the recomputed retired_to_reserve_lbs and increments Watershed.version by 1"
          - "on the CreditBatch: reserved_lbs decreases by requested_gross_lbs, retired_lbs increases by settled_gross_lbs, available_lbs increases by round(requested_gross_lbs - settled_gross_lbs, 2), and CreditBatch.version increments by 1"
          - "on the Permit: credit_applied_lbs increases by applied_lbs, compliance_gap_lbs is recomputed by permit_compliance_reconciliation, compliance_status moves SHORTFALL -> RESOLVED when the recomputed gap is 0.00, and Permit.version increments by 1"
          - "increments CreditTransaction.version by 1"
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /credit-transactions/{credit_transaction_id}/void, or the Watershed ACTIVE -> ADAPTIVE_HOLD / ACTIVE -> TERMINATED cascade, or the PracticeProject -> REVOKED cascade"
        actor: RegistryAdministrator | system
        preconditions:
          - "CreditTransaction.status == PROPOSED"
        side_effects:
          - "sets void_reason to REGISTRY_ACTION for the explicit endpoint, ADAPTIVE_HOLD for the watershed cascade, BATCH_INVALIDATED for the revocation cascade"
          - "sets voided_at to the logical clock instant"
          - "when void_reason != BATCH_INVALIDATED: on the CreditBatch reserved_lbs decreases by requested_gross_lbs and available_lbs increases by the same amount"
          - "when void_reason == BATCH_INVALIDATED the batch buckets were already moved into invalidated_lbs by the batch transition, so no further bucket movement occurs"
          - "Watershed.reserve_pool_lbs is NOT touched: a PROPOSED transaction never credited the reserve pool"
          - "increments CreditBatch.version by 1 when its buckets moved"
          - "increments CreditTransaction.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /credit-transactions/{credit_transaction_id}/void, or the Watershed ACTIVE -> ADAPTIVE_HOLD / ACTIVE -> TERMINATED cascade, or the PracticeProject -> REVOKED cascade"
        actor: RegistryAdministrator | system
        preconditions:
          - "CreditTransaction.status == APPROVED"
        side_effects:
          - "sets void_reason and voided_at as above"
          - "when void_reason != BATCH_INVALIDATED: on the CreditBatch retired_lbs decreases by settled_gross_lbs and available_lbs increases by the same amount"
          - "when void_reason == BATCH_INVALIDATED: on the CreditBatch retired_lbs decreases by settled_gross_lbs and invalidated_lbs increases by the same amount"
          - "decreases Watershed.reserve_pool_lbs by retired_to_reserve_lbs and increments Watershed.version by 1"
          - "on the Permit: credit_applied_lbs decreases by applied_lbs, compliance_gap_lbs is recomputed, compliance_status moves RESOLVED -> SHORTFALL (or -> VIOLATION when void_reason == BATCH_INVALIDATED), and Permit.version increments by 1"
          - "increments CreditBatch.version by 1"
          - "increments CreditTransaction.version by 1"

  - entity: AdaptiveReview
    state_field: status
    initial_state: OPEN
    terminal_states: [FINALIZED]
    shape: branching
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /adaptive-reviews/{adaptive_review_id}/finalize"
        actor: ProgramAdministrator
        preconditions:
          - "AdaptiveReview.status == OPEN"
          - "a TmdlAssessment with this watershed_id and status == APPROVED exists, else ERR_TMDL_NOT_APPROVED"
        side_effects:
          - "runs watershed_response_evaluation and writes sample_count, observed_load_lbs_yr, achieved_reduction_pct and verdict"
          - "sets finalized_at to the logical clock instant"
          - "CASCADE link 1: when verdict == OFF_TRACK and Watershed.program_status == ACTIVE, the watershed transitions ACTIVE -> ADAPTIVE_HOLD and trading_enabled becomes false"
          - "CASCADE links 2-4 then run exactly as declared on the Watershed ACTIVE -> ADAPTIVE_HOLD transition, and voided_transaction_count records how many CreditTransaction rows link 2 voided"
          - "when verdict IN {ON_TRACK, INDETERMINATE}, voided_transaction_count is 0 and the watershed is untouched"
          - "increments AdaptiveReview.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: credit-transaction-propose-stale-batch
    parent_entity: CreditBatch
    write_endpoint: "POST /credit-transactions"
    occ_field: "expected_credit_batch_version"
    description: |
      Proposing a CreditTransaction against a CreditBatch whose version has
      advanced since the permittee last read it is rejected. Partial purchases
      from one batch are legitimate product behaviour, so a second proposal
      that carries a stale batch version is not caught by any state
      precondition; the stale-version check is what stops the permittee from
      committing against a bucket layout that no longer exists.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

  - rule_id: allocation-run-create-stale-tmdl
    parent_entity: TmdlAssessment
    write_endpoint: "POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs"
    occ_field: "expected_tmdl_assessment_version"
    description: |
      Creating an AllocationRun against a TmdlAssessment whose version has
      advanced since the analyst last read it is rejected. A new run
      legitimately supersedes the prior ACTIVE run and rewrites every
      SourceAssessment allocation, so a second create is not blocked by any
      state precondition; the stale-version check stops an analyst from
      superseding a run they never saw.
    error_id: ERR_STALE_TMDL_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: monitoring_sample_load
    trigger: "POST /monitoring-samples — computes MonitoringSample.computed_load_lbs_yr on insert"
    algorithm: aggregation
    formula: |
      computed_load_lbs_yr =
          round(measured_conc_mg_l * flow_cfs * LB_PER_DAY_FACTOR * DAYS_PER_YEAR, 2)
    input_set: "The single sample being inserted; qa_status does not affect this field, only downstream aggregations."
    constants:
      LB_PER_DAY_FACTOR: 5.393
      DAYS_PER_YEAR: 365
    precision: "2 decimal places, round_half_up"

  - name: wasteload_allocation_run
    trigger: "POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs — writes every AllocationRun computed field, SourceAssessment.allocated_load_lbs_yr / allocation_run_id, the TmdlAssessment allocation roll-ups, and Watershed.reserve_pool_lbs / allocated_wla_total_lbs_yr / allocated_la_total_lbs_yr"
    algorithm: waterfall_allocation
    formula: |
      # --- step 1: background load, variant-dependent (see `variants:` below)
      BG = effective_background_lbs_yr            # per variant
      # --- step 2: withhold margin of safety, then background
      margin_of_safety_lbs_yr = round(loading_capacity_lbs_yr * margin_of_safety_pct, 2)
      allocable_load_lbs_yr   = round(loading_capacity_lbs_yr - margin_of_safety_lbs_yr - BG, 2)
      if allocable_load_lbs_yr < 0.00: reject with ERR_ALLOCABLE_LOAD_NEGATIVE
      # allocable_load_lbs_yr == 0.00 is ACCEPTED: every source is allocated 0.00
      # --- step 3: waterfall bucket 0 — program reserve set-aside
      reserve_setaside = round(allocable_load_lbs_yr * RESERVE_FRACTION, 2)
      distributable    = round(allocable_load_lbs_yr - reserve_setaside, 2)
      # --- step 4: waterfall buckets 1 and 2 — point pool then nonpoint pool
      point_pool_lbs_yr    = round(distributable * POINT_POOL_SHARE, 2)
      nonpoint_pool_lbs_yr = round(distributable - point_pool_lbs_yr, 2)
      # --- step 5: spread each pool over its included sources
      included = SourceAssessment rows with tmdl_assessment_id == this assessment
                 and status IN {INVENTORIED, ADJUSTED}          # EXCLUDED never enters
      P = included rows with source_type == POINT,
          ordered by existing_load_lbs_yr DESC, then created_at ASC
      N = included rows with source_type == NONPOINT, same ordering
      weight(s) = s.existing_load_lbs_yr                                  if method == PRO_RATA_BY_EXISTING_LOAD
                = s.existing_load_lbs_yr * s.controllability_index        if method == CONTROLLABILITY_WEIGHTED
      for group G with pool POOL:
          W = sum(weight(s) for s in G)
          for s in G (in the pinned order above):
              # ROUNDING ORDER IS PINNED: round EACH source's allocation to 2 dp
              # first, then sum the already-rounded values. Summing the exact
              # quotients and rounding once at the end is WRONG and can differ
              # by cents.
              s.allocated_load_lbs_yr = round(POOL * weight(s) / W, 2) if W > 0 else 0.00
      wla_total_lbs_yr = sum of the rounded allocated_load_lbs_yr over P
      la_total_lbs_yr  = sum of the rounded allocated_load_lbs_yr over N
      # --- step 6: the reserve absorbs the per-source rounding residue, which is
      #             what makes the load-conservation identity hold exactly
      reserve_allocation_lbs_yr =
          round(allocable_load_lbs_yr - wla_total_lbs_yr - la_total_lbs_yr, 2)
      # --- INVARIANT (load conservation), always exactly true after a run:
      #   loading_capacity_lbs_yr == margin_of_safety_lbs_yr
      #                            + effective_background_lbs_yr
      #                            + wla_total_lbs_yr
      #                            + la_total_lbs_yr
      #                            + reserve_allocation_lbs_yr
      included_source_count = count(included)
      # --- step 7: supersede the prior ACTIVE run and re-base the reserve pool
      if a prior ACTIVE run R exists on this assessment:
          R.status = SUPERSEDED
          Watershed.reserve_pool_lbs -= R.reserve_allocation_lbs_yr
      Watershed.reserve_pool_lbs += reserve_allocation_lbs_yr
      Watershed.allocated_wla_total_lbs_yr = wla_total_lbs_yr
      Watershed.allocated_la_total_lbs_yr  = la_total_lbs_yr
    input_set: "SourceAssessment rows of this TmdlAssessment with status IN {INVENTORIED, ADJUSTED}; rows with status == EXCLUDED are omitted from both the weight denominators and the allocations array. When a group is empty its pool is entirely absorbed by reserve_allocation_lbs_yr."
    constants:
      RESERVE_FRACTION: 0.0500
      POINT_POOL_SHARE: 0.6000
    precision: "2 decimal places, round_half_up, applied per source before summing"
    variants:
      - name: provisional_background
        when: "TmdlAssessment.status IN {DRAFT, PUBLIC_COMMENT, REVISION} at run time; AllocationRun.variant = PROVISIONAL"
        difference: "effective_background_lbs_yr = TmdlAssessment.background_load_lbs_yr, the analyst's estimate, used verbatim."
      - name: final_monitored_background
        when: "TmdlAssessment.status == APPROVED at run time; AllocationRun.variant = FINAL"
        difference: |
          effective_background_lbs_yr = round(mean of MonitoringSample.computed_load_lbs_yr over
          samples whose reach_id belongs to a Reach with reach_class == BACKGROUND in this
          watershed, qa_status == ACCEPTED, and sample_datetime within
          [period_start_date T00:00:00.000Z, period_end_date T23:59:59.999Z] inclusive on both
          ends, 2). When that sample set is empty the estimate
          TmdlAssessment.background_load_lbs_yr is used instead. Because the monitored background
          normally differs from the estimate, the same source rows and the same method yield a
          different allocable load and therefore different per-source allocations, a different
          wla_total_lbs_yr and a different reserve_allocation_lbs_yr.

  - name: permit_effluent_limit_derivation
    trigger: "POST /permits/{permit_id}/derive-limits — writes Permit.wla_lbs_yr, final_limit_lbs_yr, required_reduction_pct, schedule_tier, interim_limit_lbs_yr, compliance_schedule_end_date and applicable_limit_lbs_yr"
    algorithm: tiered_pricing
    formula: |
      # This formula LOOKS circular: the compliance-schedule tier grants interim
      # relief, and one might read the required reduction as being measured
      # against the interim limit the tier produces. THE EVALUATION ORDER IS
      # PINNED as steps 1..5 below: the tier is selected from the reduction
      # measured against the FINAL limit only, and relief is applied afterwards.
      # Deriving the tier from an interim value is WRONG.
      #
      # step 1 — final limit from the wasteload allocation
      wla_lbs_yr        = SourceAssessment.allocated_load_lbs_yr   # non-null, else ERR_WLA_NOT_ALLOCATED
      final_limit_lbs_yr = round(wla_lbs_yr * Watershed.equivalence_ratio, 2)
      # step 2 — required reduction measured against the FINAL limit
      C = Permit.current_annual_load_lbs
      required_reduction_pct = 0.00                                        if C <= 0
                             = round(max(0, (C - final_limit_lbs_yr) / C) * 100, 2)   otherwise
      # step 3 — tier selection from step 2's value (boundaries are inclusive on the upper edge)
      schedule_tier = TIER_A  if required_reduction_pct <= TIER_A_MAX_PCT
                    = TIER_B  if TIER_A_MAX_PCT < required_reduction_pct <= TIER_B_MAX_PCT
                    = TIER_C  otherwise
      # step 4 — relief and schedule length follow from the tier
      relief_fraction = { TIER_A: 0.00, TIER_B: 0.25, TIER_C: 0.50 }[schedule_tier]
      schedule_years  = { TIER_A: 0,    TIER_B: 3,    TIER_C: 5    }[schedule_tier]
      # step 5 — interim limit and schedule end date
      interim_limit_lbs_yr = round(final_limit_lbs_yr + (C - final_limit_lbs_yr) * relief_fraction, 2)
      compliance_schedule_end_date = Permit.effective_date plus schedule_years calendar years
                                    (same month and day; TIER_A therefore ends on effective_date)
      # applicable limit, recomputed on every read-affecting mutation
      applicable_limit_lbs_yr = null                       if limit_status == DRAFT_LIMITS
                              = final_limit_lbs_yr         if limit_status == FINAL
                              = interim_limit_lbs_yr       if limit_status == INTERIM and
                                    logical_clock_date <= compliance_schedule_end_date
                              = final_limit_lbs_yr         if limit_status == INTERIM and
                                    logical_clock_date >  compliance_schedule_end_date
    input_set: "The single Permit and its linked SourceAssessment; Watershed.equivalence_ratio is read at derivation time and not re-read afterwards."
    constants:
      TIER_A_MAX_PCT: 20.00
      TIER_B_MAX_PCT: 50.00
      TIER_A_RELIEF: 0.00
      TIER_B_RELIEF: 0.25
      TIER_C_RELIEF: 0.50
      TIER_A_YEARS: 0
      TIER_B_YEARS: 3
      TIER_C_YEARS: 5
    precision: "2 decimal places, round_half_up; required_reduction_pct also 2 decimal places"

  - name: geographic_eligibility_path
    trigger: "POST /credit-transactions — computes CreditTransaction.delivery_ratio and path_reach_count, and rejects ineligible geography"
    algorithm: topological
    formula: |
      source_reach = Reach of the CreditBatch's PracticeProject.reach_id
      buyer_reach  = Reach of the Permit's SourceAssessment.reach_id
      if source_reach.id == buyer_reach.id:
          delivery_ratio = 1.0000 ; path_reach_count = 1
      else:
          path = [source_reach] ; cursor = source_reach ; product = 1
          loop:
              if cursor.downstream_reach_id is null: reject ERR_ZONE_NOT_ELIGIBLE
              cursor = Reach(cursor.downstream_reach_id)
              path.append(cursor) ; product = product * cursor.delivery_factor
              if cursor.id == buyer_reach.id: break
              if len(path) > MAX_PATH_DEPTH: reject ERR_ZONE_NOT_ELIGIBLE
          # the generating reach's own delivery_factor is EXCLUDED; every reach
          # strictly downstream of it up to and including the buyer reach is included
          delivery_ratio  = round(product, 4)        # rounded ONCE, after the full product
          path_reach_count = len(path)
    input_set: "Reach rows of the transaction's watershed reachable by following downstream_reach_id from the generating reach. Credits can only move downstream: a buyer upstream of the generator, or on a disconnected branch, is never eligible."
    constants:
      MAX_PATH_DEPTH: 10
    precision: "4 decimal places, round_half_up, applied once to the finished product"

  - name: credit_transaction_delivery
    trigger: "POST /credit-transactions (proposed variant) and POST /credit-transactions/{credit_transaction_id}/approve (settled variant)"
    algorithm: threshold
    formula: |
      # Four interacting inputs — gross quantity, the geographic delivery ratio,
      # the program's uncertainty and retirement ratios — plus two nested caps.
      gross                  = <variant-specific gross quantity, see `variants:`>
      retired_to_reserve_lbs = round(gross * Watershed.retirement_ratio, 2)
      tradable_lbs           = round(gross - retired_to_reserve_lbs, 2)
      delivered_lbs          = round(tradable_lbs * delivery_ratio
                                     * Watershed.equivalence_ratio
                                     / Watershed.uncertainty_ratio, 2)
      # nested cap: what the permit still needs, floored at zero
      permit_gap_lbs = round(max(0.00, Permit.reported_annual_load_lbs
                                       - Permit.applicable_limit_lbs_yr
                                       - Permit.credit_applied_lbs), 2)
      applied_lbs    = round(min(delivered_lbs, permit_gap_lbs), 2)
    input_set: "The one CreditTransaction, its CreditBatch, the batch's PracticeProject and Reach, the buyer Permit and its SourceAssessment Reach, and the Watershed ratio fields read at the moment the variant runs."
    constants: {}
    precision: "2 decimal places, round_half_up at every marked step"
    variants:
      - name: proposed_delivery
        when: "POST /credit-transactions; writes proposed_delivered_lbs and permit_gap_at_proposal_lbs; applied_lbs stays null"
        difference: "gross = requested_gross_lbs, the full quantity the permittee asked for. CreditBatch.verified_ratio is ignored entirely."
      - name: settled_delivery
        when: "POST /credit-transactions/{credit_transaction_id}/approve; writes settled_gross_lbs, settled_delivered_lbs, the recomputed retired_to_reserve_lbs and applied_lbs"
        difference: |
          gross = settled_gross_lbs = round(requested_gross_lbs * CreditBatch.verified_ratio, 2).
          When a REVERIFICATION with outcome PARTIAL has lowered verified_ratio between proposal
          and approval, the settled gross is smaller, so settled_delivered_lbs is strictly less
          than proposed_delivered_lbs for identical request data, and applied_lbs is capped by
          the freshly re-read permit gap rather than permit_gap_at_proposal_lbs.

  - name: permit_compliance_reconciliation
    trigger: "POST /permits/{permit_id}/annual-report, POST /permits/{permit_id}/finalize-limits, POST /credit-transactions/{credit_transaction_id}/approve, POST /credit-transactions/{credit_transaction_id}/void, and both cascade paths that void transactions — writes Permit.compliance_gap_lbs and Permit.compliance_status"
    algorithm: constraint_propagation
    formula: |
      applicable = Permit.applicable_limit_lbs_yr        # per permit_effluent_limit_derivation
      compliance_gap_lbs = round(max(0.00, Permit.reported_annual_load_lbs
                                           - applicable
                                           - Permit.credit_applied_lbs), 2)
      if Permit.reported_annual_load_lbs is null:
          compliance_status stays NOT_REPORTED
      elif compliance_gap_lbs == 0.00:
          compliance_status = IN_COMPLIANCE   when the trigger was an annual report
                            = RESOLVED        when the trigger closed a gap with credits
      else:
          compliance_status = VIOLATION       when the trigger was a BATCH_INVALIDATED void,
                                              or an annual report dated strictly after
                                              compliance_schedule_end_date
                            = SHORTFALL       otherwise
      enforcement_flag = true once compliance_status becomes VIOLATION and is never cleared
    input_set: "The single Permit row plus the sum of applied_lbs over its APPROVED CreditTransaction rows, which is materialised as Permit.credit_applied_lbs."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: credit_batch_serialization
    trigger: "POST /practice-projects/{practice_project_id}/certify — creates the CreditBatch and advances Watershed.serial_counter"
    algorithm: aggregation
    formula: |
      gross_reduction_lbs_yr = round((PracticeProject.pre_load_lbs_yr - PracticeProject.post_load_lbs_yr)
                                     * PracticeProject.verified_acres
                                     / PracticeProject.enrolled_acres, 2)
      issued_lbs    = floor(gross_reduction_lbs_yr)          # whole-lb serialization
      residual_lbs  = round(gross_reduction_lbs_yr - issued_lbs, 2)
      serial_prefix = Watershed.state_code + "-" + Watershed.watershed_code + "-"
                      + PracticeProject.vintage_year
      serial_start  = Watershed.serial_counter + 1
      serial_end    = Watershed.serial_counter + issued_lbs
      Watershed.serial_counter = serial_end
      Watershed.reserve_pool_lbs += residual_lbs
      available_lbs = issued_lbs ; reserved_lbs = 0.00
      retired_lbs = 0.00 ; invalidated_lbs = 0.00 ; verified_ratio = 1.0000
      # --- INVARIANT (credit mass conservation), always exactly true:
      #   issued_lbs == available_lbs + reserved_lbs + retired_lbs + invalidated_lbs
    input_set: "The single PracticeProject at the instant of certification and its Watershed's serial_counter. verified_acres, not enrolled_acres, prorates the reduction."
    constants: {}
    precision: "gross_reduction_lbs_yr and residual_lbs to 2 decimal places, round_half_up; issued_lbs, serial_start and serial_end are integers"

  - name: watershed_response_evaluation
    trigger: "POST /adaptive-reviews/{adaptive_review_id}/finalize — writes AdaptiveReview.sample_count, observed_load_lbs_yr, achieved_reduction_pct, verdict and voided_transaction_count"
    algorithm: aggregation
    formula: |
      qualifying = MonitoringSample rows where
          Reach(reach_id).watershed_id == AdaptiveReview.watershed_id
          AND Reach(reach_id).reach_class == COMPLIANCE_POINT
          AND qa_status == ACCEPTED
          AND sample_datetime BETWEEN period_start_date T00:00:00.000Z
                                  AND period_end_date   T23:59:59.999Z   (both ends inclusive)
      sample_count = count(qualifying)
      if sample_count == 0:
          observed_load_lbs_yr   = null
          achieved_reduction_pct = null
          verdict                = INDETERMINATE       # empty-set edge, NOT OFF_TRACK
      else:
          observed_load_lbs_yr = round(sum(qualifying.computed_load_lbs_yr) / sample_count, 2)
          capacity = loading_capacity_lbs_yr of the watershed's APPROVED TmdlAssessment
          baseline = Watershed.baseline_load_lbs_yr
          achieved_reduction_pct = round((baseline - observed_load_lbs_yr)
                                        / (baseline - capacity) * 100, 2)
          verdict = ON_TRACK  if achieved_reduction_pct >= Watershed.interim_target_pct
                  = OFF_TRACK otherwise
    input_set: "ACCEPTED MonitoringSample rows on COMPLIANCE_POINT reaches of this watershed inside the closed review window. PROVISIONAL and REJECTED samples, and samples on HEADWATER / MAINSTEM / BACKGROUND reaches, are excluded and therefore do not rescue an otherwise empty window."
    constants: {}
    precision: "2 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the first failing rule determines the response)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, non-empty after trimming, and X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the called endpoint's §1.5 `roles:` list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-templated id resolves to an existing row, validated left-to-right along the path."
    error_id: "ERR_WATERSHED_NOT_FOUND | ERR_REACH_NOT_FOUND | ERR_TMDL_ASSESSMENT_NOT_FOUND | ERR_SOURCE_ASSESSMENT_NOT_FOUND | ERR_ALLOCATION_RUN_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_PRACTICE_PROJECT_NOT_FOUND | ERR_CREDIT_BATCH_NOT_FOUND | ERR_CREDIT_TRANSACTION_NOT_FOUND | ERR_ADAPTIVE_REVIEW_NOT_FOUND | ERR_MONITORING_SAMPLE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path-templated id"

  - priority: 4
    category: business_constraint
    check: "Request body carries every required field with the declared type, enum membership, decimal width and range; unknown fields are rejected; query parameters limit (1..100) and offset (>= 0) are within range."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every endpoint with a request body or query parameters"

  - priority: 5
    category: auth
    check: "For POST /permits/{permit_id}/annual-report and POST /credit-transactions the acting Permittee's X-User-ID equals the target Permit.permittee_user_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /permits/{permit_id}/annual-report, POST /credit-transactions"

  - priority: 6
    category: auth
    check: "For POST /practice-projects the acting Producer's X-User-ID equals the body's producer_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /practice-projects"

  - priority: 7
    category: existence
    check: "Every id referenced in the request body resolves to an existing row, validated in the field order declared in the endpoint's §1.5 `input:` list."
    error_id: "ERR_WATERSHED_NOT_FOUND | ERR_REACH_NOT_FOUND | ERR_TMDL_ASSESSMENT_NOT_FOUND | ERR_SOURCE_ASSESSMENT_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_PRODUCER_NOT_FOUND | ERR_PRACTICE_PROJECT_NOT_FOUND | ERR_CREDIT_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "POST /reaches, POST /tmdl-assessments, POST /source-assessments, POST /permits, POST /practice-projects, POST /verification-events, POST /monitoring-samples, POST /credit-transactions"

  - priority: 8
    category: business_referential
    check: "Cross-referenced rows belong to the same watershed: Reach.downstream_reach_id shares watershed_id with the new reach; SourceAssessment.reach_id shares the assessment's watershed; Permit.source_assessment_id resolves to a SourceAssessment whose assessment watershed_id equals the body's watershed_id; CreditTransaction's batch reach and buyer permit reach share one watershed."
    error_id: ERR_WATERSHED_MISMATCH
    http_status: 422
    applies_to: "POST /reaches, POST /source-assessments, POST /permits, POST /credit-transactions"

  - priority: 9
    category: business_constraint
    check: "Uniqueness holds: Watershed.watershed_code globally; Reach.reach_code and TmdlAssessment.assessment_code within watershed_id; Permit.permit_number globally."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /watersheds, POST /reaches, POST /tmdl-assessments, POST /permits"

  - priority: 10
    category: state
    check: "The OCC parent version supplied in the body equals the parent's current version."
    error_id: "ERR_STALE_BATCH_VERSION | ERR_STALE_TMDL_VERSION"
    http_status: 412
    applies_to: "POST /credit-transactions, POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs"

  - priority: 11
    category: state
    check: "The target row is in a from-state that declares the requested transition in §1.2, including the CreditBatch.status == LISTED and PracticeProject.status IN {CERTIFIED, PENDING_REVERIFICATION} preconditions on transaction approval."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 12
    category: state
    check: "Watershed.program_status == ACTIVE for every trading operation: certifying a project, listing a batch, proposing a transaction, approving a transaction."
    error_id: ERR_TRADING_SUSPENDED
    http_status: 409
    applies_to: "POST /practice-projects/{practice_project_id}/certify, POST /credit-batches/{credit_batch_id}/list, POST /credit-transactions, POST /credit-transactions/{credit_transaction_id}/approve"

  - priority: 13
    category: business_safety
    check: "A BASELINE verification event with outcome PASS requires PracticeProject.baseline_met == true; the regulatory baseline requirement cannot be traded around."
    error_id: ERR_BASELINE_NOT_MET
    http_status: 422
    applies_to: "POST /verification-events"

  - priority: 14
    category: business_safety
    check: "Segregation of duties: the IMPLEMENTATION event's inspector differs from PracticeProject.baseline_verifier_user_id, and the certifying RegistryAdministrator's X-User-ID differs from both verifier ids."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /verification-events, POST /practice-projects/{practice_project_id}/certify"

  - priority: 15
    category: business_temporal
    check: "No other PracticeProject with the same tract_code and practice_type and status IN {REGISTERED, BASELINE_VERIFIED, IMPLEMENTED, CERTIFIED, PENDING_REVERIFICATION} occupies an overlapping half-open interval [effective_start_date, effective_end_date). Touching intervals (previous end == new start) do NOT overlap and are accepted."
    error_id: ERR_PRACTICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /practice-projects"

  - priority: 16
    category: business_temporal
    check: "For the target watershed, the new AdaptiveReview's closed window [period_start_date, period_end_date] is separated from every existing review window (status IN {OPEN, FINALIZED}) by at least REVIEW_GAP_DAYS = 1 clear calendar day on both sides: reject unless new_start > existing_end + 1 day or new_end + 1 day < existing_start."
    error_id: ERR_REVIEW_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /watersheds/{watershed_id}/adaptive-reviews"

  - priority: 17
    category: business_temporal
    check: "CreditTransaction.reporting_period_year equals the buyer Permit.reporting_period_year."
    error_id: ERR_REPORTING_YEAR_MISMATCH
    http_status: 422
    applies_to: "POST /credit-transactions"

  - priority: 18
    category: business_referential
    check: "Geographic eligibility: on POST /practice-projects the reach's trading_zone_code is a member of Watershed.eligible_zone_codes; on POST /credit-transactions geographic_eligibility_path finds a downstream path from the generating reach to the buyer reach within MAX_PATH_DEPTH."
    error_id: ERR_ZONE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /practice-projects, POST /credit-transactions"

  - priority: 19
    category: business_referential
    check: "The TmdlAssessment reached from the target row has status == APPROVED."
    error_id: ERR_TMDL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /permits/{permit_id}/finalize-limits, POST /adaptive-reviews/{adaptive_review_id}/finalize"

  - priority: 20
    category: business_referential
    check: "The generating PracticeProject.status == CERTIFIED when listing its batch."
    error_id: ERR_PROJECT_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /credit-batches/{credit_batch_id}/list"

  - priority: 21
    category: business_referential
    check: "The linked SourceAssessment.allocated_load_lbs_yr is not null when deriving permit limits; at least one ACTIVE AllocationRun exists when approving a TMDL."
    error_id: ERR_WLA_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /permits/{permit_id}/derive-limits, POST /tmdl-assessments/{tmdl_assessment_id}/status"

  - priority: 22
    category: business_referential
    check: "Permit.limit_status IN {INTERIM, FINAL} before an annual report is accepted."
    error_id: ERR_LIMITS_NOT_DERIVED
    http_status: 409
    applies_to: "POST /permits/{permit_id}/annual-report"

  - priority: 23
    category: business_referential
    check: "No Permit whose source_assessment_id carries allocation_run_id == the run being rescinded has limit_status IN {INTERIM, FINAL}."
    error_id: ERR_ALLOCATION_RUN_IN_USE
    http_status: 409
    applies_to: "POST /allocation-runs/{allocation_run_id}/rescind"

  - priority: 24
    category: business_referential
    check: "No CreditTransaction against the batch has status == PROPOSED when the batch is retired."
    error_id: ERR_BATCH_HAS_OPEN_TRANSACTIONS
    http_status: 409
    applies_to: "POST /credit-batches/{credit_batch_id}/retire"

  - priority: 25
    category: business_constraint
    check: "At least one SourceAssessment with status IN {INVENTORIED, ADJUSTED} exists on the assessment before an allocation run is created."
    error_id: ERR_NO_INCLUDED_SOURCES
    http_status: 422
    applies_to: "POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs"

  - priority: 26
    category: business_constraint
    check: "Permit.source_assessment_id resolves to a SourceAssessment with source_type == POINT; nonpoint sources receive load allocations, not permits."
    error_id: ERR_SOURCE_NOT_POINT
    http_status: 422
    applies_to: "POST /permits"

  - priority: 27
    category: business_fiscal
    check: "allocable_load_lbs_yr computed by wasteload_allocation_run is >= 0.00; exactly 0.00 is accepted and allocates 0.00 to every source."
    error_id: ERR_ALLOCABLE_LOAD_NEGATIVE
    http_status: 422
    applies_to: "POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs"

  - priority: 28
    category: business_fiscal
    check: "The requested quantity does not exceed the batch's unencumbered balance: requested_gross_lbs <= CreditBatch.available_lbs on proposal, retire_lbs <= CreditBatch.available_lbs on retirement."
    error_id: ERR_CREDIT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /credit-transactions, POST /credit-batches/{credit_batch_id}/retire"

  - priority: 29
    category: business_fiscal
    check: "The buyer Permit.compliance_status == SHORTFALL and Permit.compliance_gap_lbs > 0.00 at proposal time and again at approval time."
    error_id: ERR_NO_COMPLIANCE_GAP
    http_status: 409
    applies_to: "POST /credit-transactions, POST /credit-transactions/{credit_transaction_id}/approve"

  - priority: 30
    category: business_fiscal
    check: "proposed_delivered_lbs computed by credit_transaction_delivery is strictly greater than 0.00; a request whose delivered quantity rounds down to 0.00 lbs buys nothing and is rejected."
    error_id: ERR_DELIVERY_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /credit-transactions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   44 endpoints: 25 mutations + 19 reads.
#   Every path is flat under api_prefix "/" so that FK reverse-reachability
#   resolves through single-resource GETs and filtered list GETs.
# ---------------------------------------------------------------------------
endpoints:
  # -- test-driving logical clock -------------------------------------------
  - id: clock_set
    method: POST
    path: /_clock/set_current_utc
    roles: [ProgramAdministrator, TmdlAnalyst, PermitWriter, Permittee, Producer, PracticeVerifier, RegistryAdministrator]
    input: [current_utc]
    output: "{ current_utc: string }"
    status: 200
    side_effects:
      - "Sets the server's logical clock. Every subsequent created_at, updated_at, observed_at, approved_at, certified_at, voided_at and finalized_at value, and every 'today' comparison, reads this clock."
      - "Default value before any call: 2026-08-01T00:00:00Z."

  # -- watershed program ----------------------------------------------------
  - id: watershed_create
    method: POST
    path: /watersheds
    roles: [ProgramAdministrator]
    input: [name, state_code, watershed_code, pollutant, baseline_year, baseline_load_lbs_yr, "interim_target_pct?", "uncertainty_ratio?", "retirement_ratio?", "equivalence_ratio?", eligible_zone_codes]
    output: Watershed
    status: 201
    side_effects:
      - "program_status = PROVISIONAL, trading_enabled = false, reserve_pool_lbs = 0.00, serial_counter = 0, allocated_wla_total_lbs_yr = 0.00, allocated_la_total_lbs_yr = 0.00, version = 1."

  - id: watershed_program_status
    method: POST
    path: /watersheds/{watershed_id}/program-status
    roles: [ProgramAdministrator]
    input: [target_status, "reason?"]
    output: Watershed
    status: 200
    side_effects:
      - "Applies the Watershed.program_status transition named by target_status and recomputes trading_enabled."
      - "ACTIVE -> ADAPTIVE_HOLD and ACTIVE -> TERMINATED void every PROPOSED and APPROVED CreditTransaction in this watershed with void_reason = ADAPTIVE_HOLD or PROGRAM_TERMINATED, restore the batch buckets, and reconcile every affected Permit."
      - "Increments Watershed.version by 1."

  - id: reach_create
    method: POST
    path: /reaches
    roles: [ProgramAdministrator, TmdlAnalyst]
    input: [watershed_id, reach_code, trading_zone_code, reach_class, delivery_factor, "downstream_reach_id?"]
    output: Reach
    status: 201
    side_effects:
      - "downstream_reach_id defaults to null, marking the reach as an outlet of its own branch."

  - id: monitoring_sample_create
    method: POST
    path: /monitoring-samples
    roles: [TmdlAnalyst, ProgramAdministrator]
    input: [reach_id, sample_datetime, measured_conc_mg_l, flow_cfs, "qa_status?"]
    output: MonitoringSample
    status: 201
    side_effects:
      - "Runs monitoring_sample_load and stores computed_load_lbs_yr regardless of qa_status; qa_status governs which samples downstream calculations consume."
      - "MonitoringSample is immutable: no update endpoint and no version field."

  # -- TMDL development ----------------------------------------------------
  - id: tmdl_create
    method: POST
    path: /tmdl-assessments
    roles: [TmdlAnalyst]
    input: [watershed_id, assessment_code, loading_capacity_lbs_yr, margin_of_safety_pct, background_load_lbs_yr, period_start_date, period_end_date]
    output: TmdlAssessment
    status: 201
    side_effects:
      - "status = DRAFT, revision_round = 0, allocation_variant = null, effective_background_lbs_yr = null, version = 1."

  - id: source_assessment_create
    method: POST
    path: /source-assessments
    roles: [TmdlAnalyst]
    input: [tmdl_assessment_id, reach_id, source_name, source_type, existing_load_lbs_yr, controllability_index, "status?"]
    output: SourceAssessment
    status: 201
    side_effects:
      - "status defaults to INVENTORIED; allocated_load_lbs_yr and allocation_run_id start null."

  - id: tmdl_status
    method: POST
    path: /tmdl-assessments/{tmdl_assessment_id}/status
    roles: [TmdlAnalyst, ProgramAdministrator]
    input: [target_status, "reason?"]
    output: TmdlAssessment
    status: 200
    side_effects:
      - "Applies the TmdlAssessment.status transition named by target_status; PUBLIC_COMMENT -> REVISION increments revision_round."
      - "-> APPROVED stamps approved_at, supersedes any other APPROVED assessment on the same watershed, copies the ACTIVE AllocationRun totals onto the assessment, and drives Watershed PROVISIONAL -> ACTIVE."
      - "Increments TmdlAssessment.version by 1."

  - id: allocation_run_create
    method: POST
    path: /tmdl-assessments/{tmdl_assessment_id}/allocation-runs
    roles: [TmdlAnalyst]
    input: [run_label, method, expected_tmdl_assessment_version]
    output: AllocationRun
    status: 201
    side_effects:
      - "Runs wasteload_allocation_run, selecting the provisional_background or final_monitored_background variant from the assessment's status, and stores the pool and total fields plus the per-source allocations array."
      - "Writes allocated_load_lbs_yr and allocation_run_id onto every included SourceAssessment."
      - "Supersedes the previous ACTIVE run on the same assessment and increases Watershed.reserve_pool_lbs by reserve_allocation_lbs_yr."
      - "Increments TmdlAssessment.version by 1."

  - id: allocation_run_rescind
    method: POST
    path: /allocation-runs/{allocation_run_id}/rescind
    roles: [TmdlAnalyst, ProgramAdministrator]
    input: [reason]
    output: AllocationRun
    status: 200
    side_effects:
      - "status = RESCINDED, rescinded_at stamped."
      - "Clears allocated_load_lbs_yr and allocation_run_id on every SourceAssessment the run touched."
      - "Decreases Watershed.reserve_pool_lbs by this run's reserve_allocation_lbs_yr, restoring the pre-run value, and zeroes the assessment's copied totals."

  # -- permitting ----------------------------------------------------------
  - id: permit_create
    method: POST
    path: /permits
    roles: [PermitWriter]
    input: [watershed_id, source_assessment_id, permit_number, permittee_user_id, design_flow_mgd, effective_date, current_annual_load_lbs]
    output: Permit
    status: 201
    side_effects:
      - "limit_status = DRAFT_LIMITS, compliance_status = NOT_REPORTED, credit_applied_lbs = 0.00, compliance_gap_lbs = 0.00, enforcement_flag = false, version = 1."

  - id: permit_derive_limits
    method: POST
    path: /permits/{permit_id}/derive-limits
    roles: [PermitWriter]
    input: []
    output: Permit
    status: 200
    side_effects:
      - "Runs permit_effluent_limit_derivation and writes wla_lbs_yr, final_limit_lbs_yr, required_reduction_pct, schedule_tier, interim_limit_lbs_yr, compliance_schedule_end_date and applicable_limit_lbs_yr."
      - "limit_status DRAFT_LIMITS -> INTERIM; increments Permit.version by 1."

  - id: permit_finalize_limits
    method: POST
    path: /permits/{permit_id}/finalize-limits
    roles: [PermitWriter]
    input: []
    output: Permit
    status: 200
    side_effects:
      - "limit_status INTERIM -> FINAL and applicable_limit_lbs_yr is repointed from interim_limit_lbs_yr to final_limit_lbs_yr."
      - "If a report already exists, permit_compliance_reconciliation re-runs against the tighter limit and compliance_status may move IN_COMPLIANCE -> SHORTFALL."

  - id: permit_annual_report
    method: POST
    path: /permits/{permit_id}/annual-report
    roles: [Permittee]
    input: [reported_annual_load_lbs, reporting_period_year]
    output: Permit
    status: 200
    side_effects:
      - "Stores reported_annual_load_lbs and reporting_period_year, runs permit_compliance_reconciliation, writes compliance_gap_lbs and moves compliance_status to IN_COMPLIANCE, SHORTFALL or VIOLATION."
      - "Increments Permit.version by 1."

  # -- practices and verification -----------------------------------------
  - id: producer_create
    method: POST
    path: /producers
    roles: [ProgramAdministrator, RegistryAdministrator]
    input: [legal_name, county_code, contact_email]
    output: Producer
    status: 201
    side_effects:
      - "The created Producer.id is the X-User-ID that the Producer role presents on subsequent calls."

  - id: practice_project_create
    method: POST
    path: /practice-projects
    roles: [Producer]
    input: [producer_id, reach_id, tract_code, practice_type, enrolled_acres, baseline_met, pre_load_lbs_yr, post_load_lbs_yr, effective_start_date, effective_end_date, vintage_year]
    output: PracticeProject
    status: 201
    side_effects:
      - "status = REGISTERED, verified_acres = null, both verifier user ids null, version = 1."

  - id: verification_event_create
    method: POST
    path: /verification-events
    roles: [PracticeVerifier]
    input: [practice_project_id, event_type, outcome, narrative, "verified_acres?"]
    output: VerificationEvent
    status: 201
    side_effects:
      - "inspector_user_id is taken from X-User-ID and observed_at from the logical clock; the event is immutable."
      - "Drives the PracticeProject.status transition for this event_type and outcome, records it in resulting_project_status, and stores verified_acres on the project."
      - "A REVERIFICATION with outcome PARTIAL or PASS recomputes CreditBatch.verified_ratio on every batch of the project; outcome FAIL revokes the project, invalidates its batches, voids their transactions and reconciles the affected permits."

  - id: practice_project_certify
    method: POST
    path: /practice-projects/{practice_project_id}/certify
    roles: [RegistryAdministrator]
    input: []
    output: CreditBatch
    status: 201
    side_effects:
      - "PracticeProject.status IMPLEMENTED -> CERTIFIED and certified_at stamped."
      - "Runs credit_batch_serialization: allocates a contiguous serial range from Watershed.serial_counter, sets issued_lbs, available_lbs = issued_lbs, residual_lbs and verified_ratio = 1.0000, and returns the new CreditBatch in status ISSUED."
      - "Advances Watershed.serial_counter and adds residual_lbs to Watershed.reserve_pool_lbs."

  # -- credit registry -----------------------------------------------------
  - id: credit_batch_list
    method: POST
    path: /credit-batches/{credit_batch_id}/list
    roles: [RegistryAdministrator]
    input: []
    output: CreditBatch
    status: 200
    side_effects:
      - "status ISSUED -> LISTED, making the batch eligible as a transaction source; bucket amounts are unchanged."

  - id: credit_batch_retire
    method: POST
    path: /credit-batches/{credit_batch_id}/retire
    roles: [RegistryAdministrator]
    input: [retire_lbs, reason]
    output: CreditBatch
    status: 200
    side_effects:
      - "Moves retire_lbs from available_lbs to retired_lbs and adds the same amount to Watershed.reserve_pool_lbs."
      - "status -> RETIRED once available_lbs reaches 0.00; otherwise status is unchanged."

  - id: credit_transaction_create
    method: POST
    path: /credit-transactions
    roles: [Permittee]
    input: [credit_batch_id, permit_id, requested_gross_lbs, reporting_period_year, expected_credit_batch_version]
    output: CreditTransaction
    status: 201
    side_effects:
      - "Runs geographic_eligibility_path to obtain delivery_ratio and path_reach_count, then credit_transaction_delivery in its proposed_delivery variant to write retired_to_reserve_lbs, tradable_lbs and proposed_delivered_lbs."
      - "Snapshots the buyer's current compliance_gap_lbs into permit_gap_at_proposal_lbs; status = PROPOSED."
      - "Moves requested_gross_lbs from CreditBatch.available_lbs to CreditBatch.reserved_lbs and increments CreditBatch.version by 1."

  - id: credit_transaction_approve
    method: POST
    path: /credit-transactions/{credit_transaction_id}/approve
    roles: [RegistryAdministrator]
    input: []
    output: CreditTransaction
    status: 200
    side_effects:
      - "Re-runs credit_transaction_delivery in its settled_delivery variant against the batch's current verified_ratio, writing settled_gross_lbs, settled_delivered_lbs, applied_lbs and the recomputed retired_to_reserve_lbs; status = APPROVED."
      - "Moves the settled quantity out of CreditBatch.reserved_lbs into retired_lbs, returns any unspent remainder to available_lbs, and increments CreditBatch.version by 1."
      - "Increases Permit.credit_applied_lbs by applied_lbs, reconciles compliance_gap_lbs, and may drive compliance_status SHORTFALL -> RESOLVED."
      - "Increases Watershed.reserve_pool_lbs by the recomputed retired_to_reserve_lbs."

  - id: credit_transaction_void
    method: POST
    path: /credit-transactions/{credit_transaction_id}/void
    roles: [RegistryAdministrator, ProgramAdministrator]
    input: [reason]
    output: CreditTransaction
    status: 200
    side_effects:
      - "status -> VOIDED, void_reason = REGISTRY_ACTION, voided_at stamped."
      - "Restores the batch buckets exactly: a PROPOSED transaction returns requested_gross_lbs from reserved_lbs to available_lbs; an APPROVED transaction returns the settled quantity from retired_lbs to available_lbs and debits Watershed.reserve_pool_lbs by retired_to_reserve_lbs."
      - "Decreases Permit.credit_applied_lbs by applied_lbs when the transaction was APPROVED and reconciles compliance_status."

  # -- adaptive management -------------------------------------------------
  - id: adaptive_review_create
    method: POST
    path: /watersheds/{watershed_id}/adaptive-reviews
    roles: [ProgramAdministrator]
    input: [review_label, period_start_date, period_end_date]
    output: AdaptiveReview
    status: 201
    side_effects:
      - "status = OPEN; all computed result fields start null."

  - id: adaptive_review_finalize
    method: POST
    path: /adaptive-reviews/{adaptive_review_id}/finalize
    roles: [ProgramAdministrator]
    input: []
    output: AdaptiveReview
    status: 200
    side_effects:
      - "Runs watershed_response_evaluation over the ACCEPTED MonitoringSample rows on COMPLIANCE_POINT reaches inside the window and writes sample_count, observed_load_lbs_yr, achieved_reduction_pct and verdict; status = FINALIZED."
      - "verdict OFF_TRACK drives Watershed ACTIVE -> ADAPTIVE_HOLD, whose cascade voids open transactions and reconciles permits; voided_transaction_count records how many were voided."

  # -- reads: single resource ----------------------------------------------
  - id: watershed_get
    method: GET
    path: /watersheds/{watershed_id}
    roles: [ProgramAdministrator, TmdlAnalyst, PermitWriter, Permittee, Producer, PracticeVerifier, RegistryAdministrator]
    input: []
    output: Watershed
    status: 200
    side_effects: []

  - id: reach_get
