  # ===========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: manuscript_revision_cycle_bounded_loop
        grounds:
          - state_machines.Manuscript.EVALUATED_to_REVISION_REQUESTED
          - state_machines.Manuscript.REVISION_REQUESTED_to_SUBMITTED
          - validations[priority=11]
        distinguishing_aspect: |
          Manuscript is cyclic (EVALUATED -> REVISION_REQUESTED -> SUBMITTED ->
          READER_ASSIGNED -> EVALUATED), not a linear pipeline: the loop closes
          twice (revision_round 1, 2) and the third request-revision is rejected
          with ERR_REVISION_LIMIT_REACHED, proving the loop bound is enforced on
          the same entity that cycles.
        test_recipe:
          setup:
            - "Agency; agent; author; query assigned; manuscript created via request-manuscript (SUBMITTED)"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency MC", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
