# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Specialty-Food & Gourmet DTC — 9 rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_renewal_charge_provisional_vs_final
        grounds:
          - calculations.subscription_renewal_charge
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Subscription.fields.provisional_charge_cents
        distinguishing_aspect: "Same Subscription (CLASSIC tier, home_zone Z2) yields provisional_charge_cents==5700 (current tier, no loyalty discount) but the FINAL renewal Order.total_cents==5455 (4900*0.95 rounded + 800 ship) — divergence is on the Subscription/Order $-accounting domain."
        test_recipe:
          setup:
            - "An ACTIVE SKU with a RELEASED in-date lot exists."
            - "A customer in home_zone Z2 holds an ACTIVE CLASSIC subscription on that SKU, due now."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Espresso Blend", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 4900 }, as: InventoryManager, captures: { sku_id: $.data.id } }
            - { call: "POST /skus/${sku_id}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_id}", lot_code: "L1", produced_units: 100, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
            - { call: "POST /lots/${lot_id}/release", payload: { expected_lot_version: "${lot_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_id}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "z2@x.com", full_name: "Zee", home_zone: "Z2" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", tier: "CLASSIC", cadence_days: 28 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id, prov: $.data.provisional_charge_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/renew", payload: {}, as: PlatformAdmin }
            - { call: "GET /orders?subscription_id=${sub_id}", payload: {}, as: PlatformAdmin, captures: { ren_total: "$.data[0].total_cents" } }
          assert:
            - "Subscription.${sub_id}.provisional_charge_cents == 5700 (PROVISIONAL: current CLASSIC tier 4900 + Z2 ship 800, no loyalty discount)"
            - "the renewal Order for ${sub_id} has total_cents == 5455 (FINAL: round_half_up(4900*0.95)=4655 + Z2 ship 800)"
            - "the renewal Order.total_cents (5455) != Subscription.${sub_id}.provisional_charge_cents (5700)"

      - name: dual_variant_churn_acute_vs_chronic
        grounds:
          - calculations.churn_risk_score
          - entities.Customer.fields.churn_risk_score
          - entities.Customer.fields.churn_band
        distinguishing_aspect: "Same Customer yields ACUTE churn_risk_score (windowed 90d skips/fails) different from CHRONIC (lifetime) — risk scoring on the Customer domain, structurally distinct from the renewal $-calc domain."
        test_recipe:
          setup:
            - "A customer with 2 skips occurring more than 90 days before the current clock, last order long ago."
            - "Clock advanced so those skips fall OUTSIDE the 90-day acute window but remain in the lifetime count."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Snack Mix", category: "SNACK", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_id: $.data.id } }
            - { call: "POST /skus/${sku_id}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_id}", lot_code: "L1", produced_units: 50, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
            - { call: "POST /lots/${lot_id}/release", payload: { expected_lot_version: "${lot_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_id}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "ch@x.com", full_name: "Churn", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/skip", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /subscriptions/${sub_id}/skip", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-30T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /customers/${cust_id}/risk?variant=CHRONIC", payload: {}, as: PlatformAdmin, captures: { chronic_score: $.data.churn_risk_score } }
            - { call: "GET /customers/${cust_id}/risk?variant=ACUTE", payload: {}, as: PlatformAdmin, captures: { acute_score: $.data.churn_risk_score } }
          assert:
            - "CHRONIC churn_risk_score counts 2 lifetime skips (B term 0.4) while ACUTE counts 0 skips in the trailing 90d window (B term 0.0)"
            - "ACUTE churn_risk_score < CHRONIC churn_risk_score for ${cust_id} (window excludes the old skips)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_order_total_tiered_nonlinear   # mode (a)
        grounds:
          - calculations.order_total
          - state_machines.Order.DRAFT_to_RESERVED
          - entities.Order.fields.total_cents
        distinguishing_aspect: "order_total is a >=3-input non-linear formula: tiered volume discount (state-keyed breakpoint), perishable handling AND expedited-shipping multiplier, and capped loyalty redemption (nested min over three quantities) — mode (a)."
        test_recipe:
          setup:
            - "A customer who earned 120 loyalty points by shipping a prior 8000-cent ambient order; then a second order with two AMBIENT lines totalling subtotal 9600 (5% tier), zone Z2, requesting 120 points."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Reaper Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 2000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 100, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /skus", payload: { name: "Pepper Snack", category: "SNACK", storage_class: "AMBIENT", unit_price_cents: 1800 }, as: InventoryManager, captures: { sku_b: $.data.id } }
            - { call: "POST /skus/${sku_b}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_b}", lot_code: "LB", produced_units: 100, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_b: $.data.id, lot_b_v: $.data.version } }
            - { call: "POST /lots/${lot_b}/release", payload: { expected_lot_version: "${lot_b_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_b}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "comb@x.com", full_name: "Comb", home_zone: "Z2" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            # --- prior order grants 120 loyalty points on ship (8000 ambient ext -> 120 points) ---
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { prior_id: $.data.id } }
            - { call: "POST /orders/${prior_id}/lines", payload: { sku_id: "${sku_a}", quantity: 4 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${prior_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${prior_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${prior_id}/ship", payload: {}, as: InventoryManager }
            # --- the order under test ---
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z2", requested_redeem_points: 120 }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 3 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_b}", quantity: 2 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total: $.data.total_cents } }
          assert:
            - "Customer.${cust_id}.loyalty_points_balance == 120 before reserve (from the prior shipped order)"
            - "Order.${order_id}.subtotal_cents == 9600"
            - "Order.${order_id}.discount_cents == 480"
            - "Order.${order_id}.handling_cents == 0"
            - "Order.${order_id}.shipping_cents == 800"
            - "Order.${order_id}.redeemed_points == 120"
            - "Order.${order_id}.total_cents == 9800"

      - name: combinatorial_loyalty_accrual_rounding_order   # mode (b)
        grounds:
          - calculations.loyalty_points_accrual
          - state_machines.Order.RESERVED_to_SHIPPED
          - entities.Order.fields.accrued_points
        distinguishing_aspect: "loyalty accrual pins round-PER-LINE-then-SUM: two 350-cent ambient lines accrue 5+5=10, NOT round(700*0.015)=11 — nested-rounding order (mode b), distinct from order_total's tier-selection (mode a)."
        test_recipe:
          setup:
            - "A paid RESERVED order with two AMBIENT lines each extending to 350 cents (unit 350, qty 1)."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Mini Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 350 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 10, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "ro@x.com", full_name: "Round", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager, captures: { accrued: $.data.accrued_points } }
          assert:
            - "Order.${order_id}.accrued_points == 10"
            - "Customer.${cust_id}.loyalty_points_balance == 10"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nonlinear_order_parallel_payment_fulfillment
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.DRAFT_to_RESERVED
          - entities.Order.fields.payment_status
        distinguishing_aspect: "Order has two independent state axes: payment_status (UNPAID->PAID) advances while fulfillment_status (DRAFT->RESERVED) is on a separate axis — parallel dimensions on the Order entity."
        test_recipe:
          setup:
            - "A DRAFT order with one ambient line."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Cold Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1200 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 10, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "par@x.com", full_name: "Par", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status } }
          assert:
            - "Order.${order_id}.payment_status == PAID (advanced before reservation)"
            - "Order.${order_id}.fulfillment_status == RESERVED (independent axis advanced separately)"

      - name: nonlinear_subscription_cyclic_pause_resume
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - state_machines.Subscription.ACTIVE_to_ACTIVE
        distinguishing_aspect: "Subscription is cyclic: ACTIVE->PAUSED->ACTIVE (resume) and ACTIVE->ACTIVE (skip/renew loop) — a non-linear cycle on the Subscription entity, a different entity than Order."
        test_recipe:
          setup:
            - "An ACTIVE subscription on an ACTIVE in-stock SKU."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Loop Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 10, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "cyc@x.com", full_name: "Cyc", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/pause", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/resume", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { st: $.data.status } }
          assert:
            - "Subscription.${sub_id}.status == ACTIVE after PAUSED->ACTIVE resume (cycle closed)"
            - "Subscription.${sub_id}.consecutive_skip_count == 0 after resume"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cascade_ship_lot_sku_subscription_autopause   # depth >=3
        grounds:
          - state_machines.Order.RESERVED_to_SHIPPED
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Sku.fields.available_units
        distinguishing_aspect: "Ship -> OrderLine COMMITTED decrements Lot.remaining_units (hop1) -> Sku.available_units recomputed to 0 (hop2) -> ACTIVE Subscription on that Sku auto-PAUSES (hop3); each hop caused by the prior, originating at RESERVED->SHIPPED."
        test_recipe:
          setup:
            - "A SKU with a single RELEASED lot of exactly the units a reserved order will consume, plus an ACTIVE subscription on the same SKU."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Last Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 2, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "cas@x.com", full_name: "Cas", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 2 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager }
          assert:
            - "Lot.${lot_a}.remaining_units == 0 (hop1)"
            - "Sku.${sku_a}.available_units == 0 (hop2)"
            - "Subscription.${sub_id}.status == PAUSED (hop3 auto-pause)"

      - name: cascade_recall_sku_subscription_autopause   # depth >=2, different trigger
        grounds:
          - state_machines.Lot.RELEASED_to_RECALLED
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Sku.fields.available_units
        distinguishing_aspect: "Recall sets Lot.remaining_units=0 -> Sku.available_units recomputed to 0 (hop1) -> ACTIVE Subscription on that Sku auto-PAUSES (hop2); originates at RELEASED->RECALLED, a different trigger than the ship cascade."
        test_recipe:
          setup:
            - "A SKU whose only RELEASED lot stocks all its inventory, with an ACTIVE subscription on it."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Recall Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "rc@x.com", full_name: "RC", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /lots/${lot_a}/recall", payload: {}, as: ComplianceOfficer }
          assert:
            - "Sku.${sku_a}.available_units == 0 (hop1)"
            - "Subscription.${sub_id}.status == PAUSED (hop2 auto-pause)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_fiscal_inventory_on_reserve
        grounds:
          - validations[priority=8]
          - validations[priority=17]
        distinguishing_aspect: "A reserve on an already-RESERVED order that ALSO lacks inventory returns ERR_INVALID_STATE (priority 8, state), NOT ERR_INSUFFICIENT_INVENTORY (priority 17, business_fiscal) — state vs business_fiscal pair."
        test_recipe:
          setup:
            - "An order already RESERVED (so a second reserve is an illegal from-state) whose SKU now has zero remaining availability."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Dual Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 2, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "pp@x.com", full_name: "PP", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 2 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE (priority 8 wins over priority 17)"

      - name: priority_existence_beats_state_on_ship
        grounds:
          - validations[priority=4]
          - validations[priority=8]
        distinguishing_aspect: "Shipping a non-existent order id returns ERR_NOT_FOUND (priority 4, existence), NOT ERR_INVALID_STATE (priority 8, state) — existence vs state pair, a different category pair than the first instance."
        test_recipe:
          setup:
            - "No order with the queried id exists."
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "nf@x.com", full_name: "NF", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /orders/00000000-0000-0000-0000-000000000000/ship", payload: {}, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NOT_FOUND (priority 4 wins over priority 8)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_volume_discount_tier_5000
        grounds:
          - calculations.order_total
          - state_machines.Order.DRAFT_to_RESERVED
        distinguishing_aspect: "Subtotal exactly 5000 triggers the 5% tier (>= boundary) on the order_total numeric breakpoint, reached via POST /orders/{id}/reserve."
        test_recipe:
          setup:
            - "An ambient order whose single line extends to exactly 5000 cents, zone Z1, no redemption."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Edge Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 2500 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 10, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "edge@x.com", full_name: "Edge", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 2 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { disc: $.data.discount_cents } }
          assert:
            - "Order.${order_id}.subtotal_cents == 5000"
            - "Order.${order_id}.discount_cents == 250 (5% tier applies AT 5000, the >= boundary)"
            - "Order.${order_id}.total_cents == 5250"

      - name: boundary_skip_limit_third_skip_zero_remaining
        grounds:
          - validations[priority=8]
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - entities.Subscription.fields.consecutive_skip_count
        distinguishing_aspect: "Count edge on a different metric+endpoint: the 3rd skip is allowed and brings consecutive_skip_count to exactly 3, auto-pausing the subscription; a 4th skip is then rejected ERR_INVALID_STATE — count boundary via POST /subscriptions/{id}/skip, distinct from the order_total numeric threshold."
        test_recipe:
          setup:
            - "An ACTIVE subscription with two skips already taken."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Skip Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 10, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "sk@x.com", full_name: "SK", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/skip", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /subscriptions/${sub_id}/skip", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /subscriptions/${sub_id}/skip", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { csc: $.data.consecutive_skip_count, st: $.data.status } }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/skip", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "after the 3rd skip Subscription.${sub_id}.consecutive_skip_count == 3 and status == PAUSED"
            - "the 4th skip returns error_id == ERR_INVALID_STATE (subscription is PAUSED) — skip on a PAUSED sub is rejected"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_ship_requires_order_paid
        grounds:
          - state_machines.Order.RESERVED_to_SHIPPED
          - entities.Order.fields.payment_status
        distinguishing_aspect: "Order fulfillment RESERVED->SHIPPED depends on the same Order's payment axis being PAID — Order(fulfillment)→Order(payment) cross-axis dependency; shipping an unpaid reserved order is rejected."
        test_recipe:
          setup:
            - "A RESERVED but UNPAID order."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Pay Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "up@x.com", full_name: "UP", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "ship returns error_id == ERR_INVALID_STATE (Order.payment_status != PAID)"

      - name: cross_entity_activate_requires_label_approved
        grounds:
          - state_machines.Sku.DRAFT_to_ACTIVE
          - entities.Sku.fields.label_approved
          - validations[priority=9]
        distinguishing_aspect: "Sku DRAFT->ACTIVE depends on label_approved (set by ComplianceOfficer label approval) AND a RELEASED lot — Sku→(its own compliance state set by a different role) dependency, a different entity pair than Order↔payment."
        test_recipe:
          setup:
            - "A DRAFT SKU whose label has NOT been approved, with a quarantined lot."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "NoLabel Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id } }
          trigger:
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "activate returns error_id == ERR_LABEL_NOT_APPROVED (Sku.label_approved == false)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: temporal_lot_expiry_excludes_from_fefo
        grounds:
          - state_machines.Lot.RELEASED_to_EXPIRED
          - calculations.order_total
          - entities.Lot.fields.expiry_iso
        distinguishing_aspect: "Lot occupies a [release, expiry_iso) consumable interval; once clock >= expiry_iso the lot leaves the FEFO candidate set and Sku.available_units — half-open upper-bound interval semantics on the Lot resource."
        test_recipe:
          setup:
            - "A SKU with one lot whose expiry_iso is 2026-04-01T00:00:00Z; clock advanced to exactly that instant so the lot is expired."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Exp Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-04-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "exp@x.com", full_name: "Exp", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "reserve returns error_id == ERR_INSUFFICIENT_INVENTORY (the expired lot is excluded at clock == expiry_iso; half-open upper bound)"

      - name: temporal_renewal_not_due_before_next_renewal
        grounds:
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - validations[priority=12]
          - entities.Subscription.fields.next_renewal_iso
        distinguishing_aspect: "Renewal occupies a forward window keyed on next_renewal_iso with a >= lower bound: renewing while clock < next_renewal_iso is rejected ERR_NOT_DUE — lower-bound inclusive interval on the Subscription resource, different geometry and entity than the Lot expiry upper bound."
        test_recipe:
          setup:
            - "An ACTIVE 28-day subscription created at clock default; clock NOT yet advanced to next_renewal_iso."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Due Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "due@x.com", full_name: "Due", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 28 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/renew", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "renew returns error_id == ERR_NOT_DUE (clock 2026-03-01 < next_renewal_iso 2026-03-29)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invariant_cancel_refund_wallet_conserved
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - state_machines.Order.RESERVED_to_CANCELLED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "Forward (pay -> charge total_cents) + compensating (cancel -> refund to wallet) leaves the conserved quantity wallet_credit_cents == Order.total_cents exactly; conserved quantity = store-credit money."
        test_recipe:
          setup:
            - "A PAID, RESERVED order with total_cents 1500, customer wallet starts at 0."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Ref Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "ref@x.com", full_name: "Ref", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { tot: $.data.total_cents } }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "Order.${order_id}.total_cents == 1500"
            - "Order.${order_id}.payment_status == REFUNDED"
            - "Customer.${cust_id}.wallet_credit_cents == 1500 (refund equals the charge; money conserved, no drift)"

      - name: invariant_cancel_before_ship_loyalty_conserved
        grounds:
          - state_machines.Order.RESERVED_to_CANCELLED
          - calculations.loyalty_points_accrual
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: "Forward (reserve, would-accrue on ship) + compensating (cancel before ship) leaves the conserved quantity loyalty_points_balance unchanged (accrual only fires on SHIPPED) — conserved quantity = loyalty points, a different conserved type than wallet money."
        test_recipe:
          setup:
            - "A RESERVED (unshipped) ambient order on a customer whose loyalty_points_balance is 0."
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Loy Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 2000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "loy@x.com", full_name: "Loy", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "Customer.${cust_id}.loyalty_points_balance == 0 (no points were ever credited; cancel-before-ship reverses nothing — loyalty conserved)"
            - "Order.${order_id}.fulfillment_status == CANCELLED"
