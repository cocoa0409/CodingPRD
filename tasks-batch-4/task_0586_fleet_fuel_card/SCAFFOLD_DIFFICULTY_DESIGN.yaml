              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "9999", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 1000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
