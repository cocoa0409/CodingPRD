    code: 201
    input: [teaching_artist_id, residency_id, session_ids, period_start, period_end]
    output: PaymentVoucher
    side_effects: ["status := DRAFT, both review tracks := PENDING", "session.payment_voucher_id := this voucher for every session in session_ids", "subtotals and total_cents computed per calculations.voucher_total"]

  - method: GET
    path: "/payment-vouchers/{id}"
    description: "Read a voucher with both review tracks and all money subtotals"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: []
    output: PaymentVoucher
    side_effects: []

  - method: GET
    path: "/payment-vouchers"
    description: "List vouchers (reverse-reachability for PaymentVoucher.teaching_artist_id, residency_id and session_ids)"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: ["teaching_artist_id?", "residency_id?", "session_ids?", "status?", "limit?", "offset?"]
    output: PaymentVoucher[]
    side_effects: []

  - method: POST
    path: "/payment-vouchers/{id}/submit"
    description: "Submit a voucher for the two-track review"
    roles: [TeachingArtist, RosterCoordinator]
    code: 200
    input: []
    output: PaymentVoucher
    side_effects: ["status DRAFT|REJECTED → SUBMITTED, both tracks reset to PENDING", "totals recomputed", "increments PaymentVoucher.version by 1"]

  - method: POST
    path: "/payment-vouchers/{id}/review"
    description: "Close one review track (fiscal or program); the join approves the voucher when both pass"
    roles: [FiscalOfficer, ProgramDirector]
    code: 200
    input: [review_track, decision, "note?", expected_payment_voucher_version]
    output: PaymentVoucher
    side_effects: ["the addressed track is set to PASSED or FAILED with its reviewed_by", "join: both PASSED → APPROVED, moving total_cents from Residency.encumbered_cents to disbursed_cents", "either FAILED → REJECTED, releasing session.payment_voucher_id", "increments PaymentVoucher.version by 1"]

  - method: POST
    path: "/payment-vouchers/{id}/void"
    description: "Void a voucher, reversing its disbursement"
    roles: [FiscalOfficer]
    code: 200
    input: [void_reason]
    output: PaymentVoucher
    side_effects: ["status → VOIDED", "compensating ledger move: disbursed_cents -= total_cents, encumbered_cents += total_cents, session encumbrances restored", "session.payment_voucher_id := null", "increments PaymentVoucher.version by 1 and Residency.version by 1"]

  # --- FunderReport ------------------------------------------------------
  - method: POST
    path: "/funder-reports"
    description: "Open a funder report over a set of residencies and a reporting period"
    roles: [ProgramDirector]
    code: 201
    input: [funder_name, grant_code, period_start, period_end, scope_residency_ids, headcount_basis]
    output: FunderReport
    side_effects: ["status := DRAFT, all metrics := 0"]

  - method: GET
    path: "/funder-reports/{id}"
    description: "Read a funder report with its compiled metrics"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: []
    output: FunderReport
    side_effects: []

  - method: GET
    path: "/funder-reports"
    description: "List funder reports (reverse-reachability for FunderReport.scope_residency_ids)"
    roles: [ProgramDirector, RosterCoordinator, CurriculumSpecialist, TeachingArtist, SchoolLiaison, FiscalOfficer]
    code: 200
    input: ["grant_code?", "status?", "scope_residency_ids?", "limit?", "offset?"]
    output: FunderReport[]
    side_effects: []

  - method: POST
    path: "/funder-reports/{id}/compile"
    description: "Compile the reporting snapshot: students served, demographic reach and cost per student"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: FunderReport
    side_effects: ["status → COMPILED, invalidated_reason := null, compiled_by_user_id := X-User-ID", "all metrics recomputed per calculations.funder_report_metrics", "increments FunderReport.version by 1"]

  - method: POST
    path: "/funder-reports/{id}/certify"
    description: "Certify a compiled report for submission to the funder"
    roles: [FiscalOfficer]
    code: 200
    input: [certifier_user_id, attestation_text]
    output: FunderReport
    side_effects: ["status COMPILED → CERTIFIED", "certified_by_user_id and attestation_text persisted", "increments FunderReport.version by 1"]

  # --- Test-driving endpoint (outside the public business surface) --------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every date comparison in §1.3 and §1.4 (clearance expiry, program year, reporting periods) reads this clock."
    roles: [ProgramDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances; no entity is mutated and no cascade fires"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID header missing or role not one of the six declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role is not listed for the endpoint, or the review_track does not match the acting role, or the evaluation_type does not match the acting role" }
  - { id: ERR_ACTOR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed role acted on a resource it does not own (artist not the assigned artist / author / payee; liaison not the host school)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required body field, bad type, value outside enum domain or numeric range, malformed date/time, empty or duplicate-bearing array, end before start" }
  - { id: ERR_SCHOOL_PARTNER_NOT_FOUND, http: 404, condition: "school_partner_id in path or body does not resolve" }
  - { id: ERR_TEACHING_ARTIST_NOT_FOUND, http: 404, condition: "teaching_artist_id / assigned_artist_id / substitute_artist_id does not resolve" }
  - { id: ERR_RESIDENCY_NOT_FOUND, http: 404, condition: "residency_id or a scope_residency_ids element does not resolve" }
  - { id: ERR_LESSON_PLAN_NOT_FOUND, http: 404, condition: "lesson_plan_id does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "session id in path, session_ids element, or makeup_for_session_id does not resolve" }
  - { id: ERR_VOUCHER_NOT_FOUND, http: 404, condition: "payment voucher id in path does not resolve" }
  - { id: ERR_FUNDER_REPORT_NOT_FOUND, http: 404, condition: "funder report id in path does not resolve" }
  - { id: ERR_UNKNOWN_STANDARD_CODE, http: 422, condition: "A standard_codes element does not match any ArtsStandard.code" }
  - { id: ERR_STALE_RESIDENCY_VERSION, http: 412, condition: "expected_residency_version does not equal Residency.version on POST /sessions" }
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_session_version does not equal Session.version on POST /sessions/{id}/reassign" }
  - { id: ERR_STALE_VOUCHER_VERSION, http: 412, condition: "expected_payment_voucher_version does not equal PaymentVoucher.version on POST /payment-vouchers/{id}/review" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "The requested transition is not declared from the row's current state on the addressed axis (includes terminal-state lockdown and closing an already-closed review track)" }
  - { id: ERR_ARTIST_NOT_CLEARED, http: 403, condition: "The artist's vetting_status is not CLEARED, or clearance_status is not CLEARED (missing or failed required screening type)" }
  - { id: ERR_CLEARANCE_EXPIRED, http: 409, condition: "artist.clearance_expires_on is earlier than the session_date (the expiry date itself is allowed)" }
  - { id: ERR_ARTIST_NOT_ON_ACTIVE_ROSTER, http: 409, condition: "Assignment, confirmation or reassignment attempted with an artist whose roster_status is not ACTIVE" }
  - { id: ERR_ARTIST_HAS_OPEN_SESSIONS, http: 409, condition: "Retirement attempted while the artist still holds PLANNED or CONFIRMED sessions" }
  - { id: ERR_RELIABILITY_BELOW_FLOOR, http: 409, condition: "Reinstatement from PROBATION attempted while reliability_bps_rolling < RELIABILITY_PROBATION_FLOOR_BPS" }
  - { id: ERR_PARTNERSHIP_INTAKE_SUSPENDED, http: 403, condition: "School partnership_health is INTAKE_SUSPENDED and a residency creation, approval or session creation was attempted" }
  - { id: ERR_PARTNERSHIP_HEALTH_GATE, http: 403, condition: "School partnership_health is WATCH and a REGULAR session was requested for a residency whose staffing_status is not STAFFED" }
  - { id: ERR_NO_ALIGNED_LESSON_PLAN, http: 409, condition: "Confirmation without an ALIGNED lesson_plan_id, or residency activation with no ALIGNED lesson plan" }
  - { id: ERR_STANDARDS_COVERAGE_INCOMPLETE, http: 409, condition: "Residency activation attempted while the union of covered_strands over its ALIGNED lesson plans does not include every required_strand" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 422, condition: "Artist cannot teach the residency discipline, or a standard's discipline differs from the residency discipline" }
  - { id: ERR_GRADE_BAND_MISMATCH, http: 422, condition: "Artist is not rostered for the residency grade_band, or a standard's grade_band differs from the residency grade_band" }
  - { id: ERR_LANGUAGE_CAPABILITY_MISSING, http: 422, condition: "Artist's languages do not include the residency instruction_language" }
  - { id: ERR_EVALUATION_MISSING, http: 409, condition: "A voucher session has no OBSERVATION_RUBRIC evaluation with all three rubric scores" }
  - { id: ERR_SESSION_ALREADY_VOUCHERED, http: 409, condition: "A session named on the voucher is already claimed by another voucher" }
  - { id: ERR_RESIDENCY_NOT_FINALIZED, http: 409, condition: "Certification attempted while a scope residency is not COMPLETED or CLOSED, or the compiled snapshot was invalidated" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Demonstration evaluator is also a portfolio reviewer of the artist; both voucher review tracks closed by the same operator id; report certifier equals its compiler" }
  - { id: ERR_INSUFFICIENT_PORTFOLIO_REVIEWS, http: 409, condition: "Fewer than PORTFOLIO_MIN_REVIEWS distinct reviewers scored the portfolio" }
  - { id: ERR_PORTFOLIO_THRESHOLD_NOT_MET, http: 409, condition: "portfolio_mean_composite is below PORTFOLIO_ADVANCE_THRESHOLD (3.50 itself passes)" }
  - { id: ERR_DEMO_ATTEMPT_LIMIT_REACHED, http: 409, condition: "A further teaching demonstration was scheduled after DEMO_ATTEMPT_LIMIT attempts" }
  - { id: ERR_ADAPTATION_ROUND_LIMIT, http: 409, condition: "A lesson plan review or revision was attempted at revision_round == ADAPTATION_ROUND_LIMIT" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "TeachingArtist.email already exists" }
  - { id: ERR_DUPLICATE_STANDARD_CODE, http: 409, condition: "ArtsStandard.code already exists" }
  - { id: ERR_DUPLICATE_SEQUENCE_NO, http: 409, condition: "A lesson plan with the same session_sequence_no already exists for the residency" }
  - { id: ERR_DUPLICATE_REVIEWER, http: 409, condition: "reviewer_user_id already scored this artist's portfolio" }
  - { id: ERR_MAKEUP_CREDIT_UNAVAILABLE, http: 409, condition: "MAKEUP session named a session that is not a makeup-eligible unconsumed cancellation of the same residency, or session_type MAKEUP was sent without makeup_for_session_id" }
  - { id: ERR_SESSION_UNDERDELIVERED, http: 422, condition: "minutes_delivered is below MIN_DELIVERY_FRACTION of session_length_minutes" }
  - { id: ERR_CO_PLANNING_INCOMPLETE, http: 409, condition: "CO_TEACH residency confirmed with co_planning_completed = false" }
  - { id: ERR_CANCEL_REASON_NOT_PERMITTED, http: 403, condition: "cancel_reason is not permitted for the acting role (or is the system-only RESIDENCY_DESCOPED)" }
  - { id: ERR_SESSION_OUTSIDE_RESIDENCY_TERM, http: 409, condition: "session_date is outside [term_start_date, term_end_date]" }
  - { id: ERR_VOUCHER_PERIOD_MISMATCH, http: 422, condition: "A claimed session's session_date is outside [period_start, period_end]" }
  - { id: ERR_CALENDAR_BLACKOUT, http: 409, condition: "session_date falls inside a CalendarBlackout closed interval of the school" }
  - { id: ERR_ARTIST_SCHEDULE_CONFLICT, http: 409, condition: "The artist already holds a blocking session whose half-open interval overlaps on that date" }
  - { id: ERR_TRAVEL_BUFFER_VIOLATION, http: 409, condition: "Two non-overlapping same-day sessions of one artist at different schools are less than TRAVEL_BUFFER_MINUTES apart" }
  - { id: ERR_SCHOOL_CAPACITY_EXCEEDED, http: 409, condition: "Concurrent session load at the school exceeds concurrent_session_capacity at some boundary instant" }
  - { id: ERR_SESSION_ALLOTMENT_EXHAUSTED, http: 409, condition: "No contracted allotment remains for a REGULAR session (sessions_unscheduled_count == 0)" }
  - { id: ERR_RESIDENCY_BUDGET_EXCEEDED, http: 409, condition: "Encumbrance, delivery swap or voucher submission would drive available_cents below zero" }
  - { id: ERR_RESIDENCY_HAS_OPEN_SESSIONS, http: 409, condition: "COMPLETED requested while sessions_open_count > 0" }
  - { id: ERR_RESIDENCY_HAS_OPEN_VOUCHERS, http: 409, condition: "CLOSED requested while a DRAFT/SUBMITTED voucher exists or encumbered_cents != 0" }

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Owns partnerships and the residency lifecycle; closes the PROGRAM review track on vouchers; opens and compiles funder reports. May never close the FISCAL track nor certify a report they compiled."
    identity: opaque
    exclusive_operations:
      - "POST /school-partners — register a school partner"
      - "POST /residencies/{id}/status — approve / activate / suspend / resume / complete / close / cancel"
      - "POST /teaching-artists/{id}/roster-status — probation, suspension, reinstatement, retirement"
      - "POST /funder-reports — open a funder report"
      - "POST /funder-reports/{id}/compile — compile the snapshot"
      - "POST /payment-vouchers/{id}/review with review_track = PROGRAM"
      - "POST /_clock/set_current_utc — logical clock control"
    shared_operations:
      - "POST /residencies (with RosterCoordinator)"
      - "POST /residencies/{id}/lead-artist (with RosterCoordinator)"
      - "POST /arts-standards (with CurriculumSpecialist)"
      - "all GET endpoints"

  - name: RosterCoordinator
    description: "Runs recruitment and the roster, and owns the schedule: intake, portfolio panels, demonstrations, screenings, session creation, substitute coverage, cancellations."
    identity: opaque
    exclusive_operations:
      - "POST /teaching-artists — applicant intake with capability tags"
      - "POST /teaching-artists/{id}/vetting — portfolio advance, demonstration outcome, screening request, clearance"
      - "POST /teaching-artists/{id}/screenings — record a background screening result"
      - "POST /sessions — schedule a session"
      - "POST /sessions/{id}/reassign — substitute coverage"
    shared_operations:
      - "POST /residencies, POST /residencies/{id}/lead-artist (with ProgramDirector)"
      - "POST /school-partners/{id}/calendar-blackouts (with SchoolLiaison)"
      - "POST /teaching-artists/{id}/portfolio-reviews (with CurriculumSpecialist)"
      - "POST /sessions/{id}/confirm (with SchoolLiaison)"
      - "POST /sessions/{id}/cancel (with SchoolLiaison and TeachingArtist)"
      - "POST /lesson-plans, POST /lesson-plans/{id}/revisions (with TeachingArtist)"
      - "POST /payment-vouchers, POST /payment-vouchers/{id}/submit (with TeachingArtist)"
      - "all GET endpoints"

  - name: CurriculumSpecialist
    description: "Owns curriculum alignment to state arts standards and observation-rubric evaluation."
    identity: opaque
    exclusive_operations:
      - "POST /lesson-plans/{id}/review — align a plan or request adaptation"
      - "POST /sessions/{id}/evaluations with evaluation_type = OBSERVATION_RUBRIC"
    shared_operations:
      - "POST /arts-standards (with ProgramDirector)"
      - "POST /teaching-artists/{id}/portfolio-reviews (with RosterCoordinator)"
      - "all GET endpoints"

  - name: TeachingArtist
    description: "A rostered artist acting as themselves. X-User-ID is the TeachingArtist.id, so ownership checks compare it against session.assigned_artist_id, lesson_plan.author_artist_id and voucher.teaching_artist_id."
    identity: "entity_backed:TeachingArtist"
    exclusive_operations:
      - "POST /sessions/{id}/deliver — report delivery of their own session"
    shared_operations:
      - "POST /lesson-plans, POST /lesson-plans/{id}/revisions (with RosterCoordinator)"
      - "POST /sessions/{id}/cancel with cancel_reason = ARTIST_ILLNESS on their own session"
      - "POST /payment-vouchers, POST /payment-vouchers/{id}/submit for their own payee id"
      - "all GET endpoints"

  - name: SchoolLiaison
    description: "The host school acting as itself. X-User-ID is the SchoolPartner.id, so ownership checks compare it against the residency's school_partner_id."
    identity: "entity_backed:SchoolPartner"
    exclusive_operations:
      - "POST /sessions/{id}/evaluations with evaluation_type IN {TEACHER_SURVEY, STUDENT_WORK_SAMPLE}"
    shared_operations:
      - "POST /school-partners/{id}/calendar-blackouts (with RosterCoordinator)"
      - "POST /sessions/{id}/confirm (with RosterCoordinator)"
      - "POST /sessions/{id}/cancel with cancel_reason IN {SCHOOL_CLOSURE, TESTING_CONFLICT, LOW_ENROLLMENT}"
      - "all GET endpoints"

  - name: FiscalOfficer
    description: "Fiscal control: closes the FISCAL review track, voids disbursements, certifies funder reports. May never close the PROGRAM track nor certify a report they compiled (they cannot compile at all)."
    identity: opaque
    exclusive_operations:
      - "POST /payment-vouchers/{id}/review with review_track = FISCAL"
      - "POST /payment-vouchers/{id}/void — reverse a disbursement"
      - "POST /funder-reports/{id}/certify — certify a compiled report"
    shared_operations:
      - "all GET endpoints"
