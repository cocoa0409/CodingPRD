              payload: { decision: "RESCINDED" }
              as: AuthorizedOfficer
              as_user_id: "officer-alpha"
            - call: "POST /osup/noncompliance-actions/${nca_id}/decide-appeal"
              payload: { decision: "RESCINDED" }
              as: ProgramAdministrator
              as_user_id: "officer-alpha"
            - call: "POST /osup/noncompliance-actions/${nca_id}/decide-appeal"
              payload: { decision: "UPHELD" }
              as: AuthorizedOfficer
              as_user_id: "officer-beta"
            - call: "GET /osup/permits/${p_id}"
              payload: {}
              as: PermitSpecialist
          assert:
            - "start-review by officer-alpha moves the plan SUBMITTED -> UNDER_REVIEW and stamps reviewed_by_user_id officer-alpha"
            - "approve and reject by officer-alpha each return HTTP 403 ERR_SEGREGATION_OF_DUTIES — the reviewer is barred from BOTH dispositions, not just the favourable one, and the plan stays UNDER_REVIEW"
            - "approve as ProgramAdministrator carrying the SAME X-User-ID officer-alpha is still HTTP 403 ERR_SEGREGATION_OF_DUTIES: the comparison is against reviewed_by_user_id, so changing role does not launder the duty"
            - "approve by officer-beta succeeds: status APPROVED with approved_by_user_id officer-beta and reviewed_by_user_id still officer-alpha"
            - "decide-appeal by officer-alpha, who issued the action, returns HTTP 403 ERR_SEGREGATION_OF_DUTIES under both AuthorizedOfficer and ProgramAdministrator, and the action stays APPEALED"
            - "decide-appeal UPHELD by officer-beta succeeds: status UPHELD with appeal_decided_by_user_id officer-beta"
            - "the permit reports open_noncompliance_points 2 (an UPHELD MINOR keeps its points) and compliance_status PROBATION — driven by insurance_current false on a permit with no certificate on file, not by the 2 points, which are below PROBATION_POINT_THRESHOLD 5"

  # ===========================================================================
  # §1.0 Cross-cutting complexity layers
  # [optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  #  selector_policy]
  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: award_rejects_a_stale_use_area_token_and_accepts_the_refreshed_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prospectus-award-stale-use-area]
          - errors[ERR_STALE_USE_AREA_VERSION]
          - endpoints.POST /osup/prospectuses/{id}/award
        distinguishing_aspect: |
          The token is the PARENT's version, not the prospectus's, and the write that invalidates it
          touches neither the prospectus nor its responses — screening an unrelated sibling application
          advances UseArea.version and that alone makes the award stale. The rejection is 412, must
          leave the prospectus EVALUATING with awarded_application_id null, and must not consume the
          version either: re-reading the area and replaying the same award succeeds, after which the
          area's version has advanced by exactly one more.
        test_recipe:
          setup:
            - "BRW-02 has 200 allocatable days; Alpine's 250-day application routes PROSPECTUS and responds to prospectus P, which is then closed to EVALUATING"
            - "a second Alpine application for 50 days is drafted and submitted but not yet screened"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
