# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1883: Energy Modeling & Green Building Certification
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_team_member_applies_defaults
        claim_type: defaults
        grounds: ["entities.TeamMember.fields.is_independent"]
        distinguishing_aspect: "Omitting is_independent on create applies default false; system stamps id/created_at/updated_at and version == 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /team-members", payload: { full_name: "Tim Type", email: "tim@x.com", specialty: "MODELING" }, as: ProgramAdmin, captures: { m_id: $.data.id } }
          assert:
            - "TeamMember.${m_id}.is_independent == false (default applied)"
            - "TeamMember.${m_id}.version == 1 and id/created_at/updated_at are server-stamped"

      - name: create_project_missing_required_field_invalid_request
        claim_type: required_fields
        grounds: ["entities.CertificationProject.fields.gross_floor_area_sqft", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required gross_floor_area_sqft on project creation yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A MANAGEMENT member exists"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
          trigger:
            - { call: "POST /certification-projects", payload: { project_name: "No Area Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400, captured err == ERR_INVALID_REQUEST"

      - name: create_team_member_id_input_ignored
        claim_type: system_fields
        grounds: ["entities.TeamMember"]
        distinguishing_aspect: "Client-supplied id is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /team-members", payload: { id: "11111111-1111-1111-1111-111111111111", full_name: "Ida Input", email: "ida@x.com", specialty: "DOCUMENTATION" }, as: ProgramAdmin, captures: { m_id: $.data.id } }
          assert:
            - "TeamMember.${m_id}.id != 11111111-1111-1111-1111-111111111111 (server-minted UUID, input ignored)"

      - name: credit_attempt_snapshots_entry_fields
        claim_type: system_fields
        grounds: ["entities.CreditAttempt.fields.points_possible", "entities.CreditAttempt.fields.credit_code"]
        distinguishing_aspect: "Create snapshots credit_code/points_possible/is_prerequisite from the library entry onto the attempt."
        test_recipe:
          setup: ["Library entry EAc9 with points_possible 7 exists; project and DOCUMENTATION owner exist"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }, as: ProgramAdmin, captures: { m_spec: $.data.id } }
            - { call: "POST /credit-library-entries", payload: { credit_code: "EAc9", title: "Green Power", category: "ENERGY_ATMOSPHERE", points_possible: 7, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin, captures: { e_x: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Snap Tower", rating_system: "LEED_ID_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /credit-attempts", payload: { project_id: "${p_id}", credit_library_entry_id: "${e_x}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { a_x: $.data.id } }
          assert:
            - "CreditAttempt.${a_x}.credit_code == EAc9 (snapshot)"
            - "CreditAttempt.${a_x}.points_possible == 7 (snapshot)"
            - "CreditAttempt.${a_x}.is_prerequisite == false and status == SELECTED and submission_round == 0"

      - name: list_credit_library_entries_paginates
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "With 11 entries, the default page returns 10 items with total_count 11 and has_more true."
        test_recipe:
          setup: ["Eleven credit library entries exist"]
          setup_api_calls:
            - { call: "POST /credit-library-entries", payload: { credit_code: "C01", title: "Credit 1", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C02", title: "Credit 2", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C03", title: "Credit 3", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C04", title: "Credit 4", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C05", title: "Credit 5", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C06", title: "Credit 6", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C07", title: "Credit 7", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C08", title: "Credit 8", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C09", title: "Credit 9", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C10", title: "Credit 10", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
            - { call: "POST /credit-library-entries", payload: { credit_code: "C11", title: "Credit 11", category: "WATER", points_possible: 1, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin }
          trigger:
            - { call: "GET /credit-library-entries", as: Any }
          assert:
            - "response total_count == 11, data length == 10 (default limit), has_more == true"

      - name: get_project_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent project UUID yields 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /certification-projects/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert: ["HTTP 404, captured err == ERR_PROJECT_NOT_FOUND"]

      - name: get_team_member_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TEAM_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent team-member UUID yields 404 ERR_TEAM_MEMBER_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
