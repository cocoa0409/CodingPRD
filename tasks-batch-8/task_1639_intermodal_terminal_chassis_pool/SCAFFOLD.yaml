# =============================================================================
# Task 1639: Intermodal Terminal & Chassis Pool Management
# BNSF/UP intermodal ramp domain — gate transactions, yard slots, chassis pool,
# billing, cutoffs, damage, driver turn-time.
# =============================================================================

scenario: |
  Intermodal Terminal & Chassis Pool Management (BNSF/UP intermodal ramp): gate transaction (in/out) & appointment system, container yard slot assignment & stack strategy, chassis pool membership, allocation & repositioning, chassis maintenance/roadability & flip fees, free time & per diem/storage billing, rail-to-truck cutoff & train cutoff compliance, damage inspection at gate, driver turn-time measurement

domain_name: intermodal-terminal
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: terminal_code, type: string, source: input, description: "Unique terminal identifier (e.g. BNSF-LA)" }
      - { name: rail_cutoff_minutes_before_departure, type: integer, source: input, description: "Rail cutoff: containers must be in-ground at least this many minutes before train departure" }
      - { name: gate_free_hours, type: integer, source: input, description: "Free-time window (hours) granted after container in-ground before per-diem/storage billing begins" }
      - { name: per_diem_rate_cents, type: integer, source: input, description: "Per-diem rate in cents per day, applied after free time expires" }
      - { name: storage_rate_cents, type: integer, source: input, description: "Daily storage rate in cents, applied after free time expires (parallel to per-diem)" }
      - { name: flip_fee_cents, type: integer, source: input, description: "Fee in cents charged per flip (chassis interchange)" }
      - { name: max_stack_height, type: integer, source: input, description: "Maximum allowed stack height in yard slots" }
      - { name: yard_slot_count, type: integer, source: input, description: "Total number of yard slots in this terminal" }
      - { name: yard_slots_in_use, type: integer, source: computed, description: "Count of YardSlot rows with status OCCUPIED" }
      - { name: yard_slots_free, type: integer, source: computed, description: "= yard_slot_count - yard_slots_in_use" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONGESTED | CLOSED — derived from yard_slots_free relative to yard_slot_count" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops checkpoint" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ChassisPool
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id; owning terminal" }
      - { name: pool_code, type: string, source: input, description: "Unique-per-terminal pool code (e.g. 'UP-POOL-A')" }
      - { name: total_chassis_count, type: integer, source: computed, description: "Count of Chassis rows with pool_id = this.id and status != RETIRED" }
      - { name: available_chassis_count, type: integer, source: computed, description: "Count of Chassis rows with pool_id = this.id AND status = AVAILABLE" }
      - { name: reserved_chassis_count, type: integer, source: computed, description: "Count of Chassis rows with pool_id = this.id AND status = RESERVED" }
      - { name: out_chassis_count, type: integer, source: computed, description: "Count of Chassis rows with pool_id = this.id AND status = OUT" }
      - { name: maintenance_chassis_count, type: integer, source: computed, description: "Count of Chassis rows with pool_id = this.id AND status = MAINTENANCE" }
      - { name: flip_fee_balance_cents, type: integer, source: computed, description: "Running sum of unapplied flip-fee charges owed to this pool" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Chassis
    parent: ChassisPool
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> ChassisPool.id; owning pool" }
      - { name: chassis_number, type: string, source: input, description: "Unique-per-pool chassis identifier" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | OUT | MAINTENANCE | RETIRED" }
      - { name: roadability_status, type: enum, source: system, default: "ROADABLE", description: "ROADABLE | UNROADABLE — independent axis from status" }
      - { name: last_inspection_at, type: datetime, source: system, description: "Timestamp of last roadability inspection" }
      - { name: out_gate_transaction_id, type: string, source: system, description: "FK -> GateTransaction.id; set when status=OUT, null otherwise" }
      - { name: current_container_id, type: string, source: system, description: "FK -> Container.id; chassis currently mounted under this container, null when bare" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ChassisMembership
    parent: ChassisPool
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> ChassisPool.id; pool the carrier belongs to" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; member carrier" }
      - { name: membership_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: flip_fee_credit_cents, type: integer, source: computed, default: 0, description: "Credits this carrier has accumulated via pre-paid flip-fee bundles" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: scac_code, type: string, source: input, description: "Unique SCAC code (e.g. 'CH Robinson')" }
      - { name: carrier_name, type: string, source: input, description: "Legal name of the carrier" }
      - { name: billing_credit_limit_cents, type: integer, source: input, description: "Maximum outstanding billing balance allowed before soft-block" }
      - { name: outstanding_billing_cents, type: integer, source: computed, default: 0, description: "Sum of unapplied BillingLedgerEntry rows (charge side only)" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Container
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: container_number, type: string, source: input, description: "ISO 6346 container number (e.g. BMOU1234567)" }
      - { name: iso_type, type: enum, source: input, description: "20FT | 40FT | 40HC | 45FT" }
      - { name: status, type: enum, source: system, description: "INBOUND_TRAIN | ON_GROUND | MOUNTED | OUTBOUND_TRUCK | DEPARTED | VOIDED" }
      - { name: free_time_expires_at, type: datetime, source: computed, description: "= in_ground_at + terminal.gate_free_hours" }
      - { name: in_ground_at, type: datetime, source: system, description: "Timestamp the container transitioned to ON_GROUND" }
      - { name: yard_slot_id, type: string, source: system, description: "FK -> YardSlot.id; slot when status=ON_GROUND" }
      - { name: stack_height, type: integer, source: system, default: 1, description: "Current stack tier (1 = ground)" }
      - { name: planned_train_id, type: string, source: system, description: "FK -> Train.id; the inbound train this container arrived on" }
      - { name: out_gate_transaction_id, type: string, source: system, description: "FK -> GateTransaction.id when status=OUTBOUND_TRUCK" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: YardSlot
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: slot_code, type: string, source: input, description: "Yard row/row-tier code (e.g. A-01-1)" }
      - { name: row, type: string, source: input, description: "Yard row letter" }
      - { name: tier_max, type: integer, source: input, description: "Max stack height allowed at this slot" }
      - { name: status, type: enum, source: system, description: "EMPTY | OCCUPIED | BLOCKED | RESERVED" }
      - { name: occupied_container_id, type: string, source: system, description: "FK -> Container.id; bottom-of-stack container occupying slot (null when EMPTY)" }
      - { name: current_height, type: integer, source: system, default: 0, description: "Number of containers currently stacked at this slot" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Train
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: train_symbol, type: string, source: input, description: "Train identifier (e.g. Z-ALTCHI)" }
      - { name: scheduled_departure_utc, type: datetime, source: input, description: "Scheduled departure timestamp" }
      - { name: actual_departure_utc, type: datetime, source: system, description: "Actual departure timestamp (set when status=DEPARTED)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ARRIVED | LOADING | DEPARTED | CANCELLED" }
      - { name: rail_cutoff_at, type: datetime, source: computed, description: "= scheduled_departure_utc - terminal.rail_cutoff_minutes_before_departure" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: GateAppointment
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; booking carrier" }
      - { name: container_id, type: string, source: input, description: "FK -> Container.id; subject container" }
      - { name: direction, type: enum, source: input, description: "IN | OUT" }
      - { name: window_start_utc, type: datetime, source: input, description: "Start of the appointment window" }
      - { name: window_end_utc, type: datetime, source: input, description: "End of the appointment window" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: assigned_driver_id, type: string, source: system, description: "Driver id once checked in" }
      - { name: checked_in_at, type: datetime, source: system, description: "When the driver checked in at the gate kiosk" }
      - { name: completed_at, type: datetime, source: system, description: "When the gate transaction completed" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: GateTransaction
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: appointment_id, type: string, source: system, description: "FK -> GateAppointment.id; the appointment this transaction satisfies" }
      - { name: container_id, type: string, source: system, description: "FK -> Container.id" }
      - { name: chassis_id, type: string, source: system, description: "FK -> Chassis.id when a chassis is flipped in or out" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id" }
      - { name: direction, type: enum, source: system, description: "IN | OUT — mirrored from appointment.direction" }
      - { name: driver_id, type: string, source: input, description: "Driver performing the move" }
      - { name: gate_lane, type: string, source: input, description: "Gate lane identifier" }
      - { name: processed_at, type: datetime, source: system, description: "Server clock at transaction completion" }
      - { name: driver_turn_minutes, type: integer, source: computed, description: "For OUT transactions = (processed_at - appointment.checked_in_at) in minutes, rounded up" }
      - { name: status, type: enum, source: system, description: "PENDING | COMPLETED | REJECTED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: DamageInspection
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: gate_transaction_id, type: string, source: system, description: "FK -> GateTransaction.id; the move during which damage was observed" }
      - { name: chassis_id, type: string, source: system, description: "FK -> Chassis.id; null when damage is on container" }
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; null when damage is on chassis" }
      - { name: damage_kind, type: enum, source: input, description: "TIRE | BRAKE | LIGHTS | FRAME | CONTAINER_DENT | CONTAINER_PUNCTURE" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | SAFETY_CRITICAL" }
      - { name: repair_cost_cents, type: integer, source: input, description: "Estimated repair cost" }
      - { name: status, type: enum, source: system, description: "OPEN | REPAIR_SCHEDULED | REPAIRED | WAIVED" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: BillingLedgerEntry
    parent: Terminal
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: system, description: "FK -> Terminal.id" }
      - { name: container_id, type: string, source: system, description: "FK -> Container.id; subject container (null for flip-fee rows)" }
      - { name: chassis_id, type: string, source: system, description: "FK -> Chassis.id; subject chassis for flip-fee rows (null for per-diem/storage)" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; billed party" }
      - { name: entry_kind, type: enum, source: system, description: "PER_DIEM | STORAGE | FLIP_FEE | DAMAGE_REPAIR" }
      - { name: amount_cents, type: integer, source: computed, description: "Charge amount in cents (positive)" }
      - { name: applied_cents, type: integer, source: system, default: 0, description: "Amount applied against Carrier account; full = applied_cents == amount_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_APPLIED | APPLIED | WAIVED" }
      - { name: period_start_utc, type: datetime, source: system, description: "Start of the billing period covered" }
      - { name: period_end_utc, type: datetime, source: system, description: "End of the billing period covered" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Terminal
    initial_state: OPEN
    terminal_states: []
    transitions:
      # posture is COMPUTED from yard_slots_free relative to yard_slot_count
      # CLOSED when yard_slots_free == 0; CONGESTED when yard_slots_free <= floor(yard_slot_count * 0.15); otherwise OPEN
      # posture is re-derived on every yard-slot mutation (occupy/release/block/unblock/reserve/unreserve)
      - from: OPEN
        to: CONGESTED
        trigger: "system (auto when yard_slots_free drops to <= floor(yard_slot_count * 0.15) but > 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONGESTED
        to: OPEN
        trigger: "system (auto when yard_slots_free rises above floor(yard_slot_count * 0.15))"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONGESTED
        to: CLOSED
        trigger: "system (auto when yard_slots_free == 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CLOSED
        to: CONGESTED
        trigger: "system (auto when yard_slots_free rises above 0 but stays <= floor(yard_slot_count * 0.15))"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "system (auto when yard_slots_free drops from above threshold directly to 0 — e.g., bulk block)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CLOSED
        to: OPEN
        trigger: "system (auto when yard_slots_free jumps above floor(yard_slot_count * 0.15) in one step)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Chassis
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: POST /terminals/{tid}/pools/{pid}/chassis/{cid}/reserve
        actor: GateSupervisor
        preconditions:
          - "chassis.roadability_status == ROADABLE (ERR_CHASSIS_UNROADABLE)"
          - "chassis.status == AVAILABLE (ERR_INVALID_STATE)"
          - "target GateAppointment in status=CHECKED_IN and appointment.direction == OUT (ERR_NO_CHECKED_IN_APPOINTMENT)"
        side_effects:
          - "ChassisPool.reserved_chassis_count += 1"
          - "ChassisPool.available_chassis_count -= 1"

      - from: RESERVED
        to: OUT
        trigger: "system (auto when the linked OUT GateTransaction transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "ChassisPool.reserved_chassis_count -= 1"
          - "ChassisPool.out_chassis_count += 1"
          - "chassis.out_gate_transaction_id = triggering GateTransaction.id"
          - "if chassis was mounted to a container: chassis.current_container_id = container.id, container.status -> OUTBOUND_TRUCK"

      - from: OUT
        to: AVAILABLE
        trigger: "system (auto when an IN GateTransaction carrying this chassis transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "ChassisPool.out_chassis_count -= 1"
          - "ChassisPool.available_chassis_count += 1"
          - "chassis.out_gate_transaction_id = null"
          - "chassis.current_container_id = null (container itself transitions to ON_GROUND via slot assignment)"

      - from: AVAILABLE
        to: MAINTENANCE
        trigger: POST /terminals/{tid}/pools/{pid}/chassis/{cid}/enter_maintenance
        actor: MaintenancePlanner
        preconditions:
          - "chassis.status == AVAILABLE (ERR_INVALID_STATE)"
        side_effects:
          - "ChassisPool.available_chassis_count -= 1"
          - "ChassisPool.maintenance_chassis_count += 1"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: POST /terminals/{tid}/pools/{pid}/chassis/{cid}/exit_maintenance
        actor: MaintenancePlanner
        preconditions:
          - "chassis.status == MAINTENANCE (ERR_INVALID_STATE)"
          - "chassis.roadability_status == ROADABLE (ERR_CHASSIS_UNROADABLE)"
        side_effects:
          - "ChassisPool.maintenance_chassis_count -= 1"
          - "ChassisPool.available_chassis_count += 1"

      - from: AVAILABLE
        to: RETIRED
        trigger: POST /terminals/{tid}/pools/{pid}/chassis/{cid}/retire
        actor: TerminalManager
        preconditions:
          - "chassis.status == AVAILABLE (ERR_INVALID_STATE)"
          - "No OPEN DamageInspection rows where chassis_id == this chassis"
        side_effects:
          - "ChassisPool.available_chassis_count -= 1"
          - "ChassisPool.total_chassis_count -= 1"

      # roadability axis (parallel dimension, not part of main status machine)
      - from: "*"
        to: "*(roadability_status: ROADABLE -> UNROADABLE)"
        trigger: "system (auto when DamageInspection with severity IN (MAJOR, SAFETY_CRITICAL) transitions to OPEN on this chassis)"
        actor: system
        preconditions: []
        side_effects:
          - "if chassis.status == RESERVED: transition RESERVED -> AVAILABLE and decrement reserved_chassis_count, increment available_chassis_count (reservation voided)"
        note: "parallel dimension; '*' notation means any non-terminal chassis status"

      - from: "*"
        to: "*(roadability_status: UNROADABLE -> ROADABLE)"
        trigger: "system (auto when last OPEN DamageInspection with severity IN (MAJOR, SAFETY_CRITICAL) on this chassis transitions to REPAIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "chassis.last_inspection_at = current server clock"

  - entity: ChassisMembership
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /terminals/{tid}/pools/{pid}/memberships/{mid}/suspend
        actor: PoolAdministrator
        preconditions:
          - "membership.membership_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Any RESERVED chassis held by this carrier are released (transition to AVAILABLE); reserved_chassis_count and available_chassis_count adjusted"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /terminals/{tid}/pools/{pid}/memberships/{mid}/reactivate
        actor: PoolAdministrator
        preconditions:
          - "membership.membership_status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: POST /terminals/{tid}/pools/{pid}/memberships/{mid}/terminate
        actor: PoolAdministrator
        preconditions:
          - "membership.membership_status == ACTIVE (ERR_INVALID_STATE)"
          - "No OPEN or PARTIALLY_APPLIED BillingLedgerEntry rows where carrier_id == membership.carrier_id AND entry_kind == FLIP_FEE"
        side_effects:
          - "All RESERVED chassis for this carrier are released (same cascade as SUSPEND)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /terminals/{tid}/pools/{pid}/memberships/{mid}/terminate
        actor: PoolAdministrator
        preconditions:
          - "membership.membership_status == SUSPENDED (ERR_INVALID_STATE)"
          - "No OPEN or PARTIALLY_APPLIED BillingLedgerEntry rows where carrier_id == membership.carrier_id AND entry_kind == FLIP_FEE"
        side_effects: []

  - entity: Container
    initial_state: INBOUND_TRAIN
    terminal_states: [DEPARTED, VOIDED]
    transitions:
      - from: INBOUND_TRAIN
        to: ON_GROUND
        trigger: POST /terminals/{tid}/containers/{cid}/ground
        actor: YardPlanner
        preconditions:
          - "container.status == INBOUND_TRAIN (ERR_INVALID_STATE)"
          - "train.status == ARRIVED for container.planned_train_id (ERR_TRAIN_NOT_ARRIVED)"
          - "Terminal posture != CLOSED (ERR_TERMINAL_CLOSED)"
          - "A YardSlot is available per selector (yard_slot_selector) — otherwise ERR_NO_YARD_SLOT_AVAILABLE"
        side_effects:
          - "container.in_ground_at = current server clock"
          - "container.free_time_expires_at = in_ground_at + terminal.gate_free_hours"
          - "container.yard_slot_id = selected slot; selected slot.status -> OCCUPIED, slot.occupied_container_id = container.id, slot.current_height = 1"
          - "container.stack_height = 1"
          - "Terminal.yard_slots_in_use += 1, yard_slots_free -= 1, posture recomputed"

      - from: ON_GROUND
        to: MOUNTED
        trigger: "system (auto when a RESERVED chassis linked to an OUT GateAppointment for this container flips to OUT via GateTransaction completion)"
        actor: system
        preconditions: []
        side_effects:
          - "container.yard_slot_id is released: prior slot.status -> EMPTY, slot.occupied_container_id = null, slot.current_height = 0, Terminal.yard_slots_in_use -= 1, yard_slots_free += 1, posture recomputed"
          - "container.stack_height = null (not on ground)"

      - from: MOUNTED
        to: OUTBOUND_TRUCK
        trigger: "system (auto when the OUT GateTransaction for this container completes)"
        actor: system
        preconditions: []
        side_effects:
          - "container.out_gate_transaction_id = triggering GateTransaction.id"

      - from: OUTBOUND_TRUCK
        to: DEPARTED
        trigger: "system (auto at run_ops when the linked GateTransaction.processed_at is at least 60 minutes in the past)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_GROUND
        to: VOIDED
        trigger: POST /terminals/{tid}/containers/{cid}/void
        actor: TerminalManager
        preconditions:
          - "container.status == ON_GROUND (ERR_INVALID_STATE)"
          - "No OPEN DamageInspection rows where container_id == this container (ERR_OPEN_DAMAGE_EXISTS)"
        side_effects:
          - "YardSlot released (same cascade as MOUNTED release)"
          - "Any OPEN BillingLedgerEntry rows for this container transition to WAIVED"

  - entity: YardSlot
    initial_state: EMPTY
    terminal_states: []
    transitions:
      - from: EMPTY
        to: OCCUPIED
        trigger: "system (auto when a Container grounds into this slot)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OCCUPIED
        to: EMPTY
        trigger: "system (auto when the occupying container mounts, departs, or is voided)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EMPTY
        to: BLOCKED
        trigger: POST /terminals/{tid}/slots/{sid}/block
        actor: YardPlanner
        preconditions:
          - "slot.status == EMPTY (ERR_INVALID_STATE)"
        side_effects: []

      - from: BLOCKED
        to: EMPTY
        trigger: POST /terminals/{tid}/slots/{sid}/unblock
        actor: YardPlanner
        preconditions:
          - "slot.status == BLOCKED (ERR_INVALID_STATE)"
        side_effects: []

      - from: EMPTY
        to: RESERVED
        trigger: POST /terminals/{tid}/slots/{sid}/reserve
        actor: YardPlanner
        preconditions:
          - "slot.status == EMPTY (ERR_INVALID_STATE)"
        side_effects: []

      - from: RESERVED
        to: EMPTY
        trigger: POST /terminals/{tid}/slots/{sid}/unreserve
        actor: YardPlanner
        preconditions:
          - "slot.status == RESERVED (ERR_INVALID_STATE)"
        side_effects: []

      - from: RESERVED
        to: OCCUPIED
        trigger: "system (auto when a Container grounds into this RESERVED slot via explicit selector override)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Train
    initial_state: SCHEDULED
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: POST /terminals/{tid}/trains/{trid}/mark_arrived
        actor: RailCoordinator
        preconditions:
          - "train.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects: []

      - from: ARRIVED
        to: LOADING
        trigger: POST /terminals/{tid}/trains/{trid}/begin_loading
        actor: RailCoordinator
        preconditions:
          - "train.status == ARRIVED (ERR_INVALID_STATE)"
        side_effects: []

      - from: LOADING
        to: DEPARTED
        trigger: POST /terminals/{tid}/trains/{trid}/mark_departed
        actor: RailCoordinator
        preconditions:
          - "train.status == LOADING (ERR_INVALID_STATE)"
        side_effects:
          - "train.actual_departure_utc = current server clock"
          - "Containers still in INBOUND_TRAIN on this train transition to VOIDED with no yard-slot side-effects (they never grounded)"
          - "BillingLedgerEntry rows for PER_DIEM/STORAGE on departed train containers are WAIVED (no charges accrue on departed)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /terminals/{tid}/trains/{trid}/cancel
        actor: RailCoordinator
        preconditions:
          - "train.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Containers in INBOUND_TRAIN on this train transition to VOIDED"

      - from: ARRIVED
        to: CANCELLED
        trigger: POST /terminals/{tid}/trains/{trid}/cancel
        actor: RailCoordinator
        preconditions:
          - "train.status == ARRIVED (ERR_INVALID_STATE)"
        side_effects:
          - "Containers in INBOUND_TRAIN on this train transition to VOIDED"

  - entity: GateAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: POST /terminals/{tid}/appointments/{aid}/check_in
        actor: GateClerk
        preconditions:
          - "appointment.status == BOOKED (ERR_INVALID_STATE)"
          - "current server clock is within [appointment.window_start_utc, appointment.window_end_utc] inclusive (ERR_OUTSIDE_APPOINTMENT_WINDOW)"
          - "for direction=IN: container.status must be MOUNTED or OUTBOUND_TRUCK (return trip) — for direction=OUT: container.status must be ON_GROUND (ERR_INVALID_STATE)"
          - "Carrier.membership_status == ACTIVE for the booking carrier on the chassis pool when direction=OUT (ERR_MEMBERSHIP_NOT_ACTIVE)"
        side_effects:
          - "appointment.checked_in_at = current server clock"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (auto when the linked GateTransaction transitions to COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "appointment.completed_at = GateTransaction.processed_at"

      - from: BOOKED
        to: NO_SHOW
        trigger: "system (auto at run_ops when current server clock > appointment.window_end_utc and status is still BOOKED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: BOOKED
        to: CANCELLED
        trigger: POST /terminals/{tid}/appointments/{aid}/cancel
        actor: GateClerk
        preconditions:
          - "appointment.status == BOOKED (ERR_INVALID_STATE)"
        side_effects: []

      - from: CHECKED_IN
        to: CANCELLED
        trigger: POST /terminals/{tid}/appointments/{aid}/cancel
        actor: GateClerk
        preconditions:
          - "appointment.status == CHECKED_IN (ERR_INVALID_STATE)"
          - "No GateTransaction exists where appointment_id == this appointment AND status IN (PENDING, COMPLETED) (ERR_TRANSACTION_IN_FLIGHT)"
        side_effects:
          - "If direction=OUT and a chassis was RESERVED against this appointment: chassis -> AVAILABLE, reserved/available counts adjusted"

  - entity: GateTransaction
    initial_state: PENDING
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: POST /terminals/{tid}/transactions/{txid}/complete
        actor: GateClerk
        preconditions:
          - "transaction.status == PENDING (ERR_INVALID_STATE)"
          - "appointment.status == CHECKED_IN (ERR_INVALID_STATE)"
          - "if direction=OUT: chassis.status == RESERVED (ERR_INVALID_STATE) AND chassis.roadability_status == ROADABLE (ERR_CHASSIS_UNROADABLE)"
          - "if direction=OUT: rail cutoff check — if container.planned_train_id is set and train.status != DEPARTED, current server clock must be < train.rail_cutoff_at (ERR_RAIL_CUTOFF_MISSED)"
          - "if direction=IN: terminal.posture != CLOSED (ERR_TERMINAL_CLOSED)"
        side_effects:
          - "transaction.processed_at = current server clock"
          - "appointment.status -> COMPLETED, appointment.completed_at = processed_at"
          - "if direction=OUT: chassis.status -> OUT (cascade per Chassis state machine)"
          - "if direction=OUT: container.status ON_GROUND -> MOUNTED (cascade) then MOUNTED -> OUTBOUND_TRUCK (cascade); yard slot released"
          - "if direction=OUT: driver_turn_minutes computed = ceil((processed_at - appointment.checked_in_at) / 60)"
          - "if direction=OUT: emit FLIP_FEE BillingLedgerEntry of terminal.flip_fee_cents against carrier_id"
          - "if direction=IN: chassis.status -> AVAILABLE; container.status MOUNTED -> ON_GROUND via ground-selector (new slot assigned; container.in_ground_at = processed_at, free_time_expires_at recomputed)"
          - "if direction=IN: if transaction carries chassis_id and chassis has OPEN SAFETY_CRITICAL DamageInspection — chassis.roadability_status forced UNROADABLE on completion"

      - from: PENDING
        to: REJECTED
        trigger: POST /terminals/{tid}/transactions/{txid}/reject
        actor: GateClerk
        preconditions:
          - "transaction.status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "If direction=OUT and chassis was RESERVED: chassis -> AVAILABLE, reserved/available counts adjusted"
          - "appointment.status stays CHECKED_IN (driver may retry) — no appointment transition"

  - entity: DamageInspection
    initial_state: OPEN
    terminal_states: [REPAIRED, WAIVED]
    transitions:
      - from: OPEN
        to: REPAIR_SCHEDULED
        trigger: POST /terminals/{tid}/damage/{did}/schedule_repair
        actor: MaintenancePlanner
        preconditions:
          - "damage.status == OPEN (ERR_INVALID_STATE)"
        side_effects: []

      - from: REPAIR_SCHEDULED
        to: REPAIRED
        trigger: POST /terminals/{tid}/damage/{did}/mark_repaired
        actor: MaintenancePlanner
        preconditions:
          - "damage.status == REPAIR_SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Emit DAMAGE_REPAIR BillingLedgerEntry of repair_cost_cents against carrier that caused damage (Carrier of the linked GateTransaction)"
          - "If damage.chassis_id set and no other OPEN DamageInspection with severity IN (MAJOR, SAFETY_CRITICAL) on that chassis: chassis.roadability_status -> ROADABLE"
          - "If damage.container_id set and container.status == VOIDED and no other OPEN damage on container: container remains VOIDED (no auto-restore)"

      - from: OPEN
        to: WAIVED
        trigger: POST /terminals/{tid}/damage/{did}/waive
        actor: TerminalManager
        preconditions:
          - "damage.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "If chassis_id set and no other OPEN major/safety damage on that chassis: chassis.roadability_status -> ROADABLE"

      - from: REPAIR_SCHEDULED
        to: WAIVED
        trigger: POST /terminals/{tid}/damage/{did}/waive
        actor: TerminalManager
        preconditions:
          - "damage.status == REPAIR_SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Same roadability recomputation as OPEN -> WAIVED"

  - entity: BillingLedgerEntry
    initial_state: OPEN
    terminal_states: [APPLIED, WAIVED]
    transitions:
      - from: OPEN
        to: PARTIALLY_APPLIED
        trigger: POST /terminals/{tid}/ledger/{lid}/apply
        actor: BillingClerk
        preconditions:
          - "entry.status == OPEN (ERR_INVALID_STATE)"
          - "payload.apply_cents < entry.amount_cents - entry.applied_cents (ERR_OVERPAY)"
        side_effects:
          - "entry.applied_cents += apply_cents"
          - "carrier.outstanding_billing_cents -= apply_cents"

      - from: OPEN
        to: APPLIED
        trigger: POST /terminals/{tid}/ledger/{lid}/apply
        actor: BillingClerk
        preconditions:
          - "entry.status == OPEN (ERR_INVALID_STATE)"
          - "payload.apply_cents == entry.amount_cents - entry.applied_cents"
        side_effects:
          - "entry.applied_cents = entry.amount_cents"
          - "carrier.outstanding_billing_cents -= apply_cents"

      - from: PARTIALLY_APPLIED
        to: APPLIED
        trigger: POST /terminals/{tid}/ledger/{lid}/apply
        actor: BillingClerk
        preconditions:
          - "entry.status == PARTIALLY_APPLIED (ERR_INVALID_STATE)"
          - "payload.apply_cents == entry.amount_cents - entry.applied_cents"
        side_effects:
          - "entry.applied_cents = entry.amount_cents"
          - "carrier.outstanding_billing_cents -= apply_cents"

      - from: OPEN
        to: WAIVED
        trigger: POST /terminals/{tid}/ledger/{lid}/waive
        actor: TerminalManager
        preconditions:
          - "entry.status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "carrier.outstanding_billing_cents -= (entry.amount_cents - entry.applied_cents)"

      - from: PARTIALLY_APPLIED
        to: WAIVED
        trigger: POST /terminals/{tid}/ledger/{lid}/waive
        actor: TerminalManager
        preconditions:
          - "entry.status == PARTIALLY_APPLIED (ERR_INVALID_STATE)"
        side_effects:
          - "carrier.outstanding_billing_cents -= (entry.amount_cents - entry.applied_cents)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: chassis-reserve-stale-pool
    parent_entity: ChassisPool
    write_endpoint: "POST /terminals/{tid}/pools/{pid}/chassis/{cid}/reserve"
    occ_field: "expected_pool_version"
    description: |
      Reserving a chassis against a ChassisPool whose `version` has advanced since the
      client last observed it is rejected. This captures the case where another writer
      has just reserved a chassis from the same pool (which legitimately consumed one
      unit of available capacity) and the current writer's view of available_chassis_count
      is therefore stale. OCC on ChassisPool.version prevents the two reservations from
      both observing capacity > 0 when only one unit was actually free.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ground-container-stale-terminal
    parent_entity: Terminal
    write_endpoint: "POST /terminals/{tid}/containers/{cid}/ground"
    occ_field: "expected_terminal_version"
    description: |
      Grounding a container against a Terminal whose `version` has advanced since the
      client last observed it is rejected. This captures the case where another writer
      has just grounded a container into the last free yard slot (legitimately flipping
      posture to CLOSED) and the current writer's view of yard_slots_free is therefore
      stale. OCC on Terminal.version prevents over-grounding into a full yard.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ledger-apply-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /terminals/{tid}/ledger/{lid}/apply"
    occ_field: "expected_carrier_version"
    description: |
      Applying a payment against a Carrier whose `version` has advanced since the client
      last observed it is rejected. This captures the case where another writer has just
      applied a payment to the same carrier (legitimately reducing outstanding_billing_cents)
      and the current writer's view of the carrier's outstanding balance is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: terminal_posture
    trigger: "any change to yard_slots_in_use or yard_slot_count (occupy, release, block, unblock, reserve, unreserve)"
    algorithm: threshold
    formula: |
      yard_slots_free = yard_slot_count - yard_slots_in_use
      congested_threshold = floor(yard_slot_count * 0.15)
      if yard_slots_free == 0:
        posture = CLOSED
      elif yard_slots_free <= congested_threshold:
        posture = CONGESTED
      else:
        posture = OPEN
    input_set: "YardSlot rows where terminal_id == this terminal AND status IN (OCCUPIED, BLOCKED, RESERVED) count toward yard_slots_in_use"
    constants:
      CONGESTED_RATIO: 0.15
    precision: "integer slots; floor division"

  - name: yard_slot_selector
    trigger: "POST /terminals/{tid}/containers/{cid}/ground (and GateTransaction IN completion that re-grounds a container)"
    algorithm: constraint_propagation
    formula: |
      # eligibility filter (explicit): YardSlot rows where
      #   terminal_id == container.terminal_id
      #   AND status IN (EMPTY, RESERVED)
      #   AND tier_max >= 1   (must accept at least one container)
      # ranking expression: row ASC, slot_code ASC, slot.created_at ASC
      # tie-break: not applicable — slot_code is unique per terminal
      # fallback: if candidate set is empty -> raise ERR_NO_YARD_SLOT_AVAILABLE
      # side effect: chosen slot transitions EMPTY -> OCCUPIED (or RESERVED -> OCCUPIED when reserved-override)
      candidates = YardSlot.filter(terminal_id==container.terminal_id, status IN (EMPTY, RESERVED), tier_max >= 1)
      if candidates.is_empty():
        raise ERR_NO_YARD_SLOT_AVAILABLE
      chosen = candidates.order_by(row ASC, slot_code ASC, created_at ASC).first()
      return chosen
    input_set: "YardSlot rows at this terminal filtered as above"

  - name: free_time_expiry
    trigger: "Container ON_GROUND transition (initial ground or re-ground after IN GateTransaction)"
    algorithm: forward_looking
    formula: |
      free_time_expires_at = in_ground_at + terminal.gate_free_hours hours
    input_set: "N/A — single-container computation"

  - name: per_diem_charge
    trigger: "run_ops daily sweep over Container rows where status IN (ON_GROUND, MOUNTED) AND free_time_expires_at < current server clock"
    algorithm: tiered_pricing
    formula: |
      # Provisional variant (used for accrual snapshot during run_ops):
      #   days_overdue = ceil((current_clock - free_time_expires_at) / 86400)
      #   charge = days_overdue * terminal.per_diem_rate_cents
      # Final variant (computed at OUT GateTransaction completion):
      #   days_overdue_final = ceil((transaction.processed_at - free_time_expires_at) / 86400)
      #   charge_final = days_overdue_final * terminal.per_diem_rate_cents
      # The two variants differ when run_ops snapshots accruals at clock T1
      # but the driver out-gates at T2 > T1; the final variant supersedes.
      days_overdue = ceil((evaluation_time - container.free_time_expires_at) / 86400)
      if days_overdue <= 0:
        charge = 0
      else:
        charge = days_overdue * terminal.per_diem_rate_cents
    input_set: "Containers with status IN (ON_GROUND, MOUNTED) and free_time_expires_at < evaluation_time"
    precision: "integer cents; ceil on day boundary"
    variants:
      - name: provisional
        when: "run_ops daily sweep (evaluation_time = current server clock at run_ops)"
        difference: "Snapshot accrual; ledger entry created with entry_kind=PER_DIEM and period_end_utc = evaluation_time"
      - name: final
        when: "OUT GateTransaction completion (evaluation_time = transaction.processed_at)"
        difference: "Final billing; supersedes any provisional entries with entry_kind=PER_DIEM by waiving them and creating a new entry for the full period"

  - name: storage_charge
    trigger: "run_ops daily sweep; parallel to per_diem but only for containers that remained ON_GROUND past free time"
    algorithm: tiered_pricing
    formula: |
      # Storage is charged only when container.status == ON_GROUND at evaluation.
      # Provisional variant (run_ops snapshot):
      #   days_overdue = ceil((current_clock - free_time_expires_at) / 86400)
      #   charge = days_overdue * terminal.storage_rate_cents
      # Final variant (computed at OUT GateTransaction completion):
      #   days_overdue_final = ceil((transaction.processed_at - free_time_expires_at) / 86400)
      #   charge_final = days_overdue_final * terminal.storage_rate_cents
      # Storage differs from per-diem in that per-diem accrues for both ON_GROUND and MOUNTED;
      # storage accrues ONLY while ON_GROUND. Once the container mounts onto a chassis,
      # storage stops but per-diem continues.
      if container.status != ON_GROUND:
        charge = 0
      else:
        days_overdue = ceil((evaluation_time - container.free_time_expires_at) / 86400)
        if days_overdue <= 0:
          charge = 0
        else:
          charge = days_overdue * terminal.storage_rate_cents
    input_set: "Containers with status == ON_GROUND and free_time_expires_at < evaluation_time"
    precision: "integer cents; ceil on day boundary"
    variants:
      - name: provisional
        when: "run_ops snapshot"
        difference: "Snapshot accrual"
      - name: final
        when: "OUT GateTransaction completion"
        difference: "Supersedes provisional; container.status at final evaluation is OUTBOUND_TRUCK so storage charge is computed for the period ending at the last run_ops where status was ON_GROUND"

  - name: driver_turn_minutes
    trigger: "OUT GateTransaction completion"
    algorithm: aggregation
    formula: |
      driver_turn_minutes = ceil((transaction.processed_at - appointment.checked_in_at) / 60)
      # Both timestamps are server-clock; result is whole minutes rounded UP.
      # Boundary: exactly 3600 seconds = exactly 60 minutes (not 61).
    input_set: "Single GateTransaction and its linked GateAppointment"
    precision: "integer minutes; ceil to next minute"

  - name: flip_fee_charge
    trigger: "OUT GateTransaction completion"
    algorithm: aggregation
    formula: |
      flip_fee_amount = terminal.flip_fee_cents
      # Applied as a BillingLedgerEntry with entry_kind=FLIP_FEE against appointment.carrier_id.
      # If carrier has ChassisMembership on the chassis pool with flip_fee_credit_cents >= flip_fee_amount:
      #   debit membership.flip_fee_credit_cents by flip_fee_amount; do NOT create ledger entry
      # Else:
      #   create ledger entry for the full flip_fee_amount; membership.flip_fee_credit_cents unchanged
    input_set: "Terminal.flip_fee_cents constant; membership lookup by (carrier_id, pool_id)"
    precision: "integer cents"

  - name: congested_appointment_window_cap
    trigger: "POST /terminals/{tid}/appointments (booking) when terminal.posture == CONGESTED"
    algorithm: threshold
    formula: |
      # When posture == CONGESTED, new appointment windows are capped:
      # max window length = 60 minutes (vs unlimited when OPEN).
      # window_end_utc - window_start_utc must be <= 3600 seconds.
      # Boundary: exactly 3600 seconds is allowed; 3601 is rejected.
      max_window_seconds = 3600
      if terminal.posture == CONGESTED:
        if (window_end_utc - window_start_utc) > max_window_seconds:
          reject with ERR_CONGESTED_WINDOW_CAP
    constants:
      CONGESTED_MAX_WINDOW_SECONDS: 3600
    input_set: "New GateAppointment booking requests"

  - name: rail_cutoff_check
    trigger: "OUT GateTransaction completion when container.planned_train_id is set and train.status != DEPARTED"
    algorithm: threshold
    formula: |
      # Rail cutoff: container must be OUT the gate (transaction.processed_at) BEFORE train.rail_cutoff_at.
      # Boundary: processed_at == rail_cutoff_at is REJECTED (must be strictly less).
      # processed_at < rail_cutoff_at is allowed.
      if current_clock >= train.rail_cutoff_at:
        reject with ERR_RAIL_CUTOFF_MISSED
    input_set: "Single Container -> planned Train -> rail_cutoff_at (computed as scheduled_departure_utc - terminal.rail_cutoff_minutes_before_departure)"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is authorized to invoke this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-parameter resource ids exist (terminal, pool, chassis, container, slot, train, appointment, transaction, damage, ledger) and are scoped to their parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "OCC expected_*_version fields match the parent's current version (for endpoints declared in concurrency_rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST endpoints listed in concurrency_rules"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is allowed per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Roadability enforcement: chassis.roadability_status == ROADABLE for any chassis reserve / out-gate / maintenance-exit"
    error_id: ERR_CHASSIS_UNROADABLE
    http_status: 409
    applies_to: "chassis reserve, transaction complete, chassis exit_maintenance"

  - priority: 7
    category: business_safety
    check: "Rail cutoff: current server clock < train.rail_cutoff_at for OUT GateTransaction completion when planned_train_id set"
    error_id: ERR_RAIL_CUTOFF_MISSED
    http_status: 409
    applies_to: "POST /terminals/{tid}/transactions/{txid}/complete (OUT direction)"

  - priority: 8
    category: business_temporal
    check: "Appointment window: current server clock within [window_start_utc, window_end_utc] inclusive at check_in"
    error_id: ERR_OUTSIDE_APPOINTMENT_WINDOW
    http_status: 409
    applies_to: "POST /terminals/{tid}/appointments/{aid}/check_in"

  - priority: 9
    category: business_temporal
    check: "Booking window shape: window_end_utc > window_start_utc; when posture == CONGESTED, window length <= 3600 seconds"
    error_id: ERR_CONGESTED_WINDOW_CAP
    http_status: 409
    applies_to: "POST /terminals/{tid}/appointments"

  - priority: 10
    category: business_referential
    check: "Membership active: Carrier has ChassisMembership with membership_status == ACTIVE on the chassis pool when booking OUT appointments or checking them in"
    error_id: ERR_MEMBERSHIP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /terminals/{tid}/appointments, POST /terminals/{tid}/appointments/{aid}/check_in (OUT)"

  - priority: 11
    category: business_constraint
    check: "Capacity: terminal.posture != CLOSED for ground / IN-transaction complete"
    error_id: ERR_TERMINAL_CLOSED
    http_status: 409
    applies_to: "POST /terminals/{tid}/containers/{cid}/ground, POST /terminals/{tid}/transactions/{txid}/complete (IN)"

  - priority: 12
    category: business_constraint
    check: "Yard slot availability: at least one eligible slot per yard_slot_selector (EMPTY or RESERVED with tier_max >= 1)"
    error_id: ERR_NO_YARD_SLOT_AVAILABLE
    http_status: 409
    applies_to: "POST /terminals/{tid}/containers/{cid}/ground"

  - priority: 13
    category: business_constraint
    check: "Train state for grounding: planned_train_id's train.status == ARRIVED"
    error_id: ERR_TRAIN_NOT_ARRIVED
    http_status: 409
    applies_to: "POST /terminals/{tid}/containers/{cid}/ground"

  - priority: 14
    category: business_fiscal
    check: "No over-apply on ledger: apply_cents <= (amount_cents - applied_cents)"
    error_id: ERR_OVERPAY
    http_status: 409
    applies_to: "POST /terminals/{tid}/ledger/{lid}/apply"

  - priority: 15
    category: business_fiscal
    check: "Open damage blocks container void and chassis retire"
    error_id: ERR_OPEN_DAMAGE_EXISTS
    http_status: 409
    applies_to: "POST /terminals/{tid}/containers/{cid}/void, POST /terminals/{tid}/pools/{pid}/chassis/{cid}/retire"

  - priority: 16
    category: business_constraint
    check: "In-flight transaction blocks appointment cancel"
    error_id: ERR_TRANSACTION_IN_FLIGHT
    http_status: 409
    applies_to: "POST /terminals/{tid}/appointments/{aid}/cancel"

  - priority: 17
    category: business_constraint
    check: "Check-in preconditions on container status (IN requires MOUNTED or OUTBOUND_TRUCK; OUT requires ON_GROUND)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /terminals/{tid}/appointments/{aid}/check_in"

  - priority: 18
    category: business_constraint
    check: "Payload shape: required fields present; enum values valid; datetime fields ISO8601; integer fields positive where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Clock (test-driving endpoint) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to the supplied ISO8601 timestamp. The server's startup default time is 2026-08-01T00:00:00Z — before any set_current_utc call, the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [TerminalManager, GateSupervisor, YardPlanner, RailCoordinator, PoolAdministrator, MaintenancePlanner, BillingClerk, GateClerk]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Terminal ---
  - method: POST
    path: "/terminals"
    description: "Create a Terminal"
    roles: [TerminalManager]
    code: 201
    input: [terminal_code, rail_cutoff_minutes_before_departure, gate_free_hours, per_diem_rate_cents, storage_rate_cents, flip_fee_cents, max_stack_height, yard_slot_count]
    output: Terminal
    side_effects:
      - "yard_slots_in_use = 0, yard_slots_free = yard_slot_count, posture = OPEN, ops_run_index = 0"

  - method: GET
    path: "/terminals/{tid}"
    description: "Get a Terminal"
    roles: [TerminalManager, GateSupervisor, YardPlanner, RailCoordinator, PoolAdministrator, MaintenancePlanner, BillingClerk, GateClerk]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/terminals"
    description: "List terminals (paginated)"
    roles: [TerminalManager, GateSupervisor, YardPlanner, RailCoordinator, PoolAdministrator, MaintenancePlanner, BillingClerk, GateClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  # --- ChassisPool ---
  - method: POST
    path: "/terminals/{tid}/pools"
    description: "Create a ChassisPool"
    roles: [PoolAdministrator]
    code: 201
    input: [pool_code]
    output: ChassisPool
    side_effects:
      - "counts initialized to 0; flip_fee_balance_cents = 0"

  - method: GET
    path: "/terminals/{tid}/pools/{pid}"
    description: "Get a ChassisPool"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk]
    code: 200
    input: []
    output: ChassisPool
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/pools"
    description: "List pools for a terminal"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk]
    code: 200
    input: ["limit?", "offset?", "terminal_id?"]
    output: ChassisPool[]
    side_effects: []

  # --- Chassis ---
  - method: POST
    path: "/terminals/{tid}/pools/{pid}/chassis"
    description: "Add a Chassis to a pool"
    roles: [PoolAdministrator]
    code: 201
    input: [chassis_number]
    output: Chassis
    side_effects:
      - "status = AVAILABLE, roadability_status = ROADABLE"
      - "ChassisPool.total_chassis_count += 1, available_chassis_count += 1"

  - method: GET
    path: "/terminals/{tid}/pools/{pid}/chassis/{cid}"
    description: "Get a Chassis"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk]
    code: 200
    input: []
    output: Chassis
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/pools/{pid}/chassis"
    description: "List chassis in a pool (filterable by status, roadability_status)"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk]
    code: 200
    input: ["status?", "roadability_status?", "limit?", "offset?", "pool_id?", "out_gate_transaction_id?", "current_container_id?"]
    output: Chassis[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/chassis/{cid}/reserve"
    description: "Reserve an available chassis against a CHECKED_IN OUT appointment"
    roles: [GateSupervisor]
    code: 200
    input: [appointment_id, expected_pool_version]
    output: Chassis
    side_effects:
      - "chassis.status -> RESERVED"
      - "ChassisPool.reserved_chassis_count += 1, available_chassis_count -= 1"
      - "increments ChassisPool.version by 1"

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/chassis/{cid}/enter_maintenance"
    description: "Move an AVAILABLE chassis to MAINTENANCE"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: Chassis
    side_effects:
      - "chassis.status -> MAINTENANCE; available_chassis_count -= 1, maintenance_chassis_count += 1"

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/chassis/{cid}/exit_maintenance"
    description: "Move a MAINTENANCE chassis back to AVAILABLE"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: Chassis
    side_effects:
      - "chassis.status -> AVAILABLE; maintenance_chassis_count -= 1, available_chassis_count += 1"

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/chassis/{cid}/retire"
    description: "Retire an AVAILABLE chassis (no OPEN damage allowed)"
    roles: [TerminalManager]
    code: 200
    input: []
    output: Chassis
    side_effects:
      - "chassis.status -> RETIRED; available_chassis_count -= 1, total_chassis_count -= 1"

  # --- ChassisMembership ---
  - method: POST
    path: "/terminals/{tid}/pools/{pid}/memberships"
    description: "Enroll a Carrier in the pool"
    roles: [PoolAdministrator]
    code: 201
    input: [carrier_id]
    output: ChassisMembership
    side_effects:
      - "membership_status = ACTIVE; flip_fee_credit_cents = 0"

  - method: GET
    path: "/terminals/{tid}/pools/{pid}/memberships/{mid}"
    description: "Get a ChassisMembership"
    roles: [PoolAdministrator, TerminalManager, BillingClerk]
    code: 200
    input: []
    output: ChassisMembership
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/pools/{pid}/memberships"
    description: "List memberships"
    roles: [PoolAdministrator, TerminalManager, BillingClerk]
    code: 200
    input: ["membership_status?", "limit?", "offset?", "pool_id?", "carrier_id?"]
    output: ChassisMembership[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/memberships/{mid}/suspend"
    description: "Suspend a membership"
    roles: [PoolAdministrator]
    code: 200
    input: []
    output: ChassisMembership
    side_effects:
      - "membership_status -> SUSPENDED"
      - "All RESERVED chassis held by this carrier released to AVAILABLE"

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/memberships/{mid}/reactivate"
    description: "Reactivate a suspended membership"
    roles: [PoolAdministrator]
    code: 200
    input: []
    output: ChassisMembership
    side_effects:
      - "membership_status -> ACTIVE"

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/memberships/{mid}/terminate"
    description: "Terminate a membership (ACTIVE or SUSPENDED)"
    roles: [PoolAdministrator]
    code: 200
    input: []
    output: ChassisMembership
    side_effects:
      - "membership_status -> TERMINATED; same reserved-chassis release cascade as SUSPEND"

  - method: POST
    path: "/terminals/{tid}/pools/{pid}/memberships/{mid}/load_flip_credit"
    description: "Load pre-paid flip-fee credit onto a membership"
    roles: [BillingClerk]
    code: 200
    input: [credit_cents]
    output: ChassisMembership
    side_effects:
      - "flip_fee_credit_cents += credit_cents"

  # --- Carrier ---
  - method: POST
    path: "/carriers"
    description: "Create a Carrier"
    roles: [TerminalManager]
    code: 201
    input: [scac_code, carrier_name, billing_credit_limit_cents]
    output: Carrier
    side_effects:
      - "outstanding_billing_cents = 0"

  - method: GET
    path: "/carriers/{cid}"
    description: "Get a Carrier"
    roles: [TerminalManager, PoolAdministrator, BillingClerk, GateSupervisor, GateClerk]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers"
    description: "List carriers"
    roles: [TerminalManager, PoolAdministrator, BillingClerk, GateSupervisor, GateClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  # --- Train ---
  - method: POST
    path: "/terminals/{tid}/trains"
    description: "Schedule a Train"
    roles: [RailCoordinator]
    code: 201
    input: [train_symbol, scheduled_departure_utc]
    output: Train
    side_effects:
      - "status = SCHEDULED; rail_cutoff_at computed = scheduled_departure_utc - terminal.rail_cutoff_minutes_before_departure"

  - method: GET
    path: "/terminals/{tid}/trains/{trid}"
    description: "Get a Train"
    roles: [TerminalManager, RailCoordinator, YardPlanner, GateSupervisor, GateClerk]
    code: 200
    input: []
    output: Train
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/trains"
    description: "List trains for a terminal"
    roles: [TerminalManager, RailCoordinator, YardPlanner, GateSupervisor, GateClerk]
    code: 200
    input: ["status?", "limit?", "offset?", "terminal_id?"]
    output: Train[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/trains/{trid}/mark_arrived"
    description: "Mark train arrived"
    roles: [RailCoordinator]
    code: 200
    input: []
    output: Train
    side_effects:
      - "status -> ARRIVED"

  - method: POST
    path: "/terminals/{tid}/trains/{trid}/begin_loading"
    description: "Begin loading (ARRIVED -> LOADING)"
    roles: [RailCoordinator]
    code: 200
    input: []
    output: Train
    side_effects:
      - "status -> LOADING"

  - method: POST
    path: "/terminals/{tid}/trains/{trid}/mark_departed"
    description: "Mark train departed"
    roles: [RailCoordinator]
    code: 200
    input: []
    output: Train
    side_effects:
      - "status -> DEPARTED; actual_departure_utc = current server clock"
      - "Any containers still in INBOUND_TRAIN on this train -> VOIDED"
      - "OPEN BillingLedgerEntry rows for those containers -> WAIVED"

  - method: POST
    path: "/terminals/{tid}/trains/{trid}/cancel"
    description: "Cancel a train (SCHEDULED or ARRIVED)"
    roles: [RailCoordinator]
    code: 200
    input: []
    output: Train
    side_effects:
      - "status -> CANCELLED; INBOUND_TRAIN containers -> VOIDED"

  # --- YardSlot ---
  - method: POST
    path: "/terminals/{tid}/slots"
    description: "Create a YardSlot"
    roles: [YardPlanner]
    code: 201
    input: [slot_code, row, tier_max]
    output: YardSlot
    side_effects:
      - "status = EMPTY; current_height = 0"

  - method: GET
    path: "/terminals/{tid}/slots/{sid}"
    description: "Get a YardSlot"
    roles: [TerminalManager, YardPlanner, GateSupervisor]
    code: 200
    input: []
    output: YardSlot
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/slots"
    description: "List slots for a terminal"
    roles: [TerminalManager, YardPlanner, GateSupervisor]
    code: 200
    input: ["status?", "row?", "limit?", "offset?", "terminal_id?", "occupied_container_id?"]
    output: YardSlot[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/slots/{sid}/block"
    description: "Block an EMPTY slot"
    roles: [YardPlanner]
    code: 200
    input: []
    output: YardSlot
    side_effects:
      - "status -> BLOCKED"

  - method: POST
    path: "/terminals/{tid}/slots/{sid}/unblock"
    description: "Unblock a BLOCKED slot"
    roles: [YardPlanner]
    code: 200
    input: []
    output: YardSlot
    side_effects:
      - "status -> EMPTY"

  - method: POST
    path: "/terminals/{tid}/slots/{sid}/reserve"
    description: "Reserve an EMPTY slot"
    roles: [YardPlanner]
    code: 200
    input: []
    output: YardSlot
    side_effects:
      - "status -> RESERVED"

  - method: POST
    path: "/terminals/{tid}/slots/{sid}/unreserve"
    description: "Unreserve a RESERVED slot"
    roles: [YardPlanner]
    code: 200
    input: []
    output: YardSlot
    side_effects:
      - "status -> EMPTY"

  # --- Container ---
  - method: POST
    path: "/terminals/{tid}/containers"
    description: "Register an inbound Container on a Train"
    roles: [RailCoordinator]
    code: 201
    input: [container_number, iso_type, planned_train_id]
    output: Container
    side_effects:
      - "status = INBOUND_TRAIN; in_ground_at = null; stack_height = null"

  - method: GET
    path: "/terminals/{tid}/containers/{cid}"
    description: "Get a Container"
    roles: [TerminalManager, RailCoordinator, YardPlanner, GateSupervisor, GateClerk, BillingClerk]
    code: 200
    input: []
    output: Container
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/containers"
    description: "List containers for a terminal"
    roles: [TerminalManager, RailCoordinator, YardPlanner, GateSupervisor, GateClerk, BillingClerk]
    code: 200
    input: ["status?", "planned_train_id?", "limit?", "offset?", "terminal_id?", "yard_slot_id?", "out_gate_transaction_id?"]
    output: Container[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/containers/{cid}/ground"
    description: "Ground an INBOUND_TRAIN container into a yard slot"
    roles: [YardPlanner]
    code: 200
    input: [expected_terminal_version]
    output: Container
    side_effects:
      - "container.status -> ON_GROUND; in_ground_at = current server clock"
      - "container.free_time_expires_at = in_ground_at + terminal.gate_free_hours"
      - "YardSlot selected per yard_slot_selector; slot -> OCCUPIED, occupied_container_id = container.id, current_height = 1"
      - "container.yard_slot_id = slot.id; container.stack_height = 1"
      - "Terminal.yard_slots_in_use += 1, yard_slots_free -= 1, posture recomputed"
      - "increments Terminal.version by 1"

  - method: POST
    path: "/terminals/{tid}/containers/{cid}/void"
    description: "Void an ON_GROUND container (no OPEN damage allowed)"
    roles: [TerminalManager]
    code: 200
    input: []
    output: Container
    side_effects:
      - "container.status -> VOIDED; yard slot released"
      - "OPEN BillingLedgerEntry rows for this container -> WAIVED"

  # --- GateAppointment ---
  - method: POST
    path: "/terminals/{tid}/appointments"
    description: "Book a gate appointment (IN or OUT)"
    roles: [GateSupervisor]
    code: 201
    input: [carrier_id, container_id, direction, window_start_utc, window_end_utc]
    output: GateAppointment
    side_effects:
      - "status = BOOKED"

  - method: GET
    path: "/terminals/{tid}/appointments/{aid}"
    description: "Get a GateAppointment"
    roles: [TerminalManager, GateSupervisor, GateClerk, BillingClerk]
    code: 200
    input: []
    output: GateAppointment
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/appointments"
    description: "List appointments for a terminal"
    roles: [TerminalManager, GateSupervisor, GateClerk, BillingClerk]
    code: 200
    input: ["status?", "direction?", "carrier_id?", "limit?", "offset?", "terminal_id?", "container_id?"]
    output: GateAppointment[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/appointments/{aid}/check_in"
    description: "Check in a driver for a BOOKED appointment"
    roles: [GateClerk]
    code: 200
    input: [driver_id]
    output: GateAppointment
    side_effects:
      - "status -> CHECKED_IN; checked_in_at = current server clock; assigned_driver_id = driver_id"

  - method: POST
    path: "/terminals/{tid}/appointments/{aid}/cancel"
    description: "Cancel a BOOKED or CHECKED_IN appointment (no in-flight transaction)"
    roles: [GateClerk, GateSupervisor]
    code: 200
    input: []
    output: GateAppointment
    side_effects:
      - "status -> CANCELLED; if OUT + chassis RESERVED -> chassis released to AVAILABLE"

  # --- GateTransaction ---
  - method: POST
    path: "/terminals/{tid}/transactions"
    description: "Open a GateTransaction against a CHECKED_IN appointment"
    roles: [GateClerk]
    code: 201
    input: [appointment_id, driver_id, gate_lane, "chassis_id?"]
    output: GateTransaction
    side_effects:
      - "status = PENDING; terminal_id, container_id, carrier_id, direction mirrored from appointment"
      - "if direction=OUT and chassis_id supplied: validates chassis is RESERVED for this appointment"

  - method: GET
    path: "/terminals/{tid}/transactions/{txid}"
    description: "Get a GateTransaction"
    roles: [TerminalManager, GateSupervisor, GateClerk, BillingClerk, MaintenancePlanner]
    code: 200
    input: []
    output: GateTransaction
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/transactions"
    description: "List transactions for a terminal"
    roles: [TerminalManager, GateSupervisor, GateClerk, BillingClerk, MaintenancePlanner]
    code: 200
    input: ["status?", "direction?", "carrier_id?", "limit?", "offset?", "terminal_id?", "appointment_id?", "container_id?", "chassis_id?"]
    output: GateTransaction[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/transactions/{txid}/complete"
    description: "Complete a PENDING GateTransaction"
    roles: [GateClerk]
    code: 200
    input: []
    output: GateTransaction
    side_effects:
      - "status -> COMPLETED; processed_at = current server clock"
      - "appointment.status -> COMPLETED; appointment.completed_at = processed_at"
      - "if OUT: chassis -> OUT; container ON_GROUND -> MOUNTED -> OUTBOUND_TRUCK; yard slot released"
      - "if OUT: driver_turn_minutes = ceil((processed_at - checked_in_at)/60)"
      - "if OUT: emit FLIP_FEE BillingLedgerEntry (or debit membership.flip_fee_credit_cents)"
      - "if IN: chassis -> AVAILABLE; container MOUNTED -> ON_GROUND (re-ground via yard_slot_selector)"

  - method: POST
    path: "/terminals/{tid}/transactions/{txid}/reject"
    description: "Reject a PENDING GateTransaction"
    roles: [GateClerk]
    code: 200
    input: []
    output: GateTransaction
    side_effects:
      - "status -> REJECTED; if chassis RESERVED, release to AVAILABLE"

  # --- DamageInspection ---
  - method: POST
    path: "/terminals/{tid}/damage"
    description: "Open a DamageInspection observed at the gate"
    roles: [GateClerk, MaintenancePlanner]
    code: 201
    input: [gate_transaction_id, "chassis_id?", "container_id?", damage_kind, severity, repair_cost_cents]
    output: DamageInspection
    side_effects:
      - "status = OPEN"
      - "if severity IN (MAJOR, SAFETY_CRITICAL) and chassis_id set: chassis.roadability_status -> UNROADABLE; if chassis was RESERVED -> release to AVAILABLE"
      - "exactly one of chassis_id / container_id must be set"

  - method: GET
    path: "/terminals/{tid}/damage/{did}"
    description: "Get a DamageInspection"
    roles: [TerminalManager, MaintenancePlanner, GateClerk, BillingClerk]
    code: 200
    input: []
    output: DamageInspection
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/damage"
    description: "List damage inspections"
    roles: [TerminalManager, MaintenancePlanner, GateClerk, BillingClerk]
    code: 200
    input: ["status?", "chassis_id?", "container_id?", "limit?", "offset?", "terminal_id?", "gate_transaction_id?"]
    output: DamageInspection[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/damage/{did}/schedule_repair"
    description: "Schedule repair for an OPEN inspection"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: DamageInspection
    side_effects:
      - "status -> REPAIR_SCHEDULED"

  - method: POST
    path: "/terminals/{tid}/damage/{did}/mark_repaired"
    description: "Mark a REPAIR_SCHEDULED inspection as REPAIRED"
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: DamageInspection
    side_effects:
      - "status -> REPAIRED"
      - "emit DAMAGE_REPAIR BillingLedgerEntry against carrier of linked GateTransaction"
      - "recompute chassis.roadability_status if chassis_id set and no other OPEN major/safety damage"

  - method: POST
    path: "/terminals/{tid}/damage/{did}/waive"
    description: "Waive an OPEN or REPAIR_SCHEDULED inspection"
    roles: [TerminalManager]
    code: 200
    input: []
    output: DamageInspection
    side_effects:
      - "status -> WAIVED; recompute roadability"

  # --- BillingLedgerEntry ---
  - method: GET
    path: "/terminals/{tid}/ledger/{lid}"
    description: "Get a BillingLedgerEntry"
    roles: [TerminalManager, BillingClerk]
    code: 200
    input: []
    output: BillingLedgerEntry
    side_effects: []

  - method: GET
    path: "/terminals/{tid}/ledger"
    description: "List ledger entries for a terminal"
    roles: [TerminalManager, BillingClerk]
    code: 200
    input: ["status?", "entry_kind?", "carrier_id?", "container_id?", "chassis_id?", "limit?", "offset?", "terminal_id?"]
    output: BillingLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/terminals/{tid}/ledger/{lid}/apply"
    description: "Apply a payment (full or partial) against an OPEN or PARTIALLY_APPLIED entry"
    roles: [BillingClerk]
    code: 200
    input: [apply_cents, expected_carrier_version]
    output: BillingLedgerEntry
    side_effects:
      - "entry.applied_cents += apply_cents"
      - "entry.status transitions per amount: OPEN->PARTIALLY_APPLIED if apply < remaining; OPEN->APPLIED or PARTIALLY_APPLIED->APPLIED if apply == remaining"
      - "carrier.outstanding_billing_cents -= apply_cents"
      - "increments Carrier.version by 1"

  - method: POST
    path: "/terminals/{tid}/ledger/{lid}/waive"
    description: "Waive an OPEN or PARTIALLY_APPLIED entry"
    roles: [TerminalManager]
    code: 200
    input: []
    output: BillingLedgerEntry
    side_effects:
      - "entry.status -> WAIVED; carrier.outstanding_billing_cents -= (amount_cents - applied_cents)"

  # --- run_ops checkpoint ---
  - method: POST
    path: "/terminals/{tid}/run_ops"
    description: "Run the operations checkpoint for a terminal"
    roles: [TerminalManager]
    code: 200
    input: []
    output: Terminal
    side_effects:
      - "ops_run_index += 1"
      - "BOOKED appointments with window_end_utc < current clock -> NO_SHOW"
      - "Containers in ON_GROUND or MOUNTED with free_time_expires_at < current clock: emit PER_DIEM (provisional) BillingLedgerEntry; if status == ON_GROUND also emit STORAGE (provisional)"
      - "Containers in OUTBOUND_TRUCK whose GateTransaction.processed_at is at least 60 minutes in the past -> DEPARTED"

  # ==========================================================================
  # Flat single-resource GETs — enable FK reverse-reachability (§1.5).
  # These endpoints mirror the nested forms but live at the top-level so
  # downstream consumers can resolve any FK by id without walking the tree.
  # ==========================================================================

  - method: GET
    path: "/pools/{id}"
    description: "Get a ChassisPool by id (flat)"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk, BillingClerk]
    code: 200
    input: []
    output: ChassisPool
    side_effects: []

  - method: GET
    path: "/pools"
    description: "Flat list of ChassisPools (filterable by terminal_id)"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk, BillingClerk]
    code: 200
    input: ["terminal_id?", "limit?", "offset?"]
    output: ChassisPool[]
    side_effects: []

  - method: GET
    path: "/chassis/{id}"
    description: "Get a Chassis by id (flat)"
    roles: [TerminalManager, GateSupervisor, PoolAdministrator, MaintenancePlanner, GateClerk, BillingClerk]
    code: 200
    input: []
    output: Chassis
    side_effects: []

  - method: GET
    path: "/chassis"
    description: "Flat list of Chassis (filterable by pool_id, out_gate_transaction_id, current_container_id)"
