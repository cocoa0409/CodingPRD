    side_effects: ["run compute_emissions_average"]
  - method: GET
    path: /wte/emissions-readings
    description: "List emissions readings; filterable by permit_id"
    roles: [EnvironmentalOfficer, Regulator]
    code: 200
    input: ["permit_id?", "limit?", "offset?"]
    output: EmissionsReading[]
    side_effects: []
  - method: GET
    path: /wte/emissions-readings/{id}
    description: "Get one emissions reading"
    roles: [EnvironmentalOfficer, Regulator]
    code: 200
    input: []
    output: EmissionsReading
    side_effects: []
  - method: POST
    path: /wte/settlements/put-or-pay/run
    description: "Run the put-or-pay settlement for an agreement's current period; returns computed settlement (annual or monthly variant)"
    roles: [ContractsManager]
    code: 200
    input: [agreement_id]
    output: { agreement_id: string, period_start: string, period_end: string, cadence: string, guarantee_tonnes: number, delivered_base_tonnes: number, shortfall_tonnes: number, shortfall_cents: integer, already_billed_cents: integer }
    side_effects: ["records the settlement so subsequent MONTHLY runs deduct already-billed tonnage-equivalent; a re-run for the same period supersedes the earlier record (only the latest record per period counts toward already_billed)"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role is authenticated but not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource (or referenced agreement/contract/landfill) is not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, out-of-range number, or enum outside declared set" }
  - { id: ERR_DUPLICATE_MANIFEST, http: 422, condition: "manifest_ref already used by another WasteDelivery" }
  - { id: ERR_DUPLICATE_REPORT_DATE, http: 422, condition: "report_date already used by another DailyThroughputReport" }
  - { id: ERR_DUPLICATE_PERMIT, http: 422, condition: "An ACTIVE EmissionsPermit already exists for this pollutant" }
  - { id: ERR_OUTAGE_OVERLAP, http: 422, condition: "New OutageWindow overlaps an existing SCHEDULED/ACTIVE outage for the same boiler (half-open intervals; touching endpoints allowed)" }
  - { id: ERR_HOST_AGREEMENT_OVERLAP, http: 422, condition: "New HostCommunityAgreement effective window overlaps another agreement for the same municipality (closed intervals; touching endpoints overlap)" }
  - { id: ERR_NOT_HOST_COMMUNITY, http: 422, condition: "HostCommunityAgreement references a Municipality with is_host_community = false" }
  - { id: ERR_DIVERSION_PLAN_REQUIRED, http: 422, condition: "Outage start attempted without an approved DiversionPlan for the outage" }
  - { id: ERR_NO_DIVERSION_LEGS, http: 422, condition: "DiversionPlan approval attempted with no legs (planned_diverted_tonnes == 0)" }
  - { id: ERR_PLAN_ALREADY_APPROVED, http: 422, condition: "DiversionLeg creation attempted on an approved plan" }
  - { id: ERR_DIVERSION_CAPACITY_EXCEEDED, http: 422, condition: "Divert would exceed plan.max_diversion_tpd * outage length in days, or outage not ACTIVE / no approved plan" }
  - { id: ERR_NO_BOILER_AVAILABLE, http: 422, condition: "Delivery acceptance attempted while no boiler is ONLINE or DERATED" }
  - { id: ERR_OUTAGE_IN_PROGRESS, http: 422, condition: "Boiler decommission attempted while a SCHEDULED or ACTIVE outage exists for the boiler" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "DailyThroughputReport finalization attempted while capacity_check == EXCEEDS" }
  - { id: ERR_TEST_REQUIRED, http: 422, condition: "AshShipment completion attempted with no AshTest recorded" }
  - { id: ERR_ASH_TEST_FAILED, http: 422, condition: "AshShipment completion attempted while a recorded AshTest has passed == false" }
  - { id: ERR_LANDFILL_CAPACITY, http: 422, condition: "Completion would exceed landfill remaining capacity or the daily receipt limit for shipped_on" }
  - { id: ERR_PERIOD_OUTSIDE_TERM, http: 422, condition: "EnergyDelivery period not within [ppa.term_start, ppa.term_end)" }
  - { id: ERR_MERCHANT_PRICE_REQUIRED, http: 422, condition: "MERCHANT energy delivery missing merchant_price_cents_per_mwh" }
  - { id: ERR_PRIORITY_NOT_AVAILABLE, http: 422, condition: "Daily allocation exhausted and host-community priority claimed but the HostCommunityAgreement is outside its effective window or priority disabled" }

roles:
  - name: PlantOperator
    description: "Runs the tip floor, boilers, outages, throughput reporting, and metals batch recording"
    identity: opaque
    exclusive_operations:
      - "POST /wte/waste-deliveries and delivery lifecycle actions (receive/accept/reject/divert)"
      - "Boiler management (create/derate/restore/decommission)"
      - "OutageWindow management (create/start/complete/cancel)"
      - "DiversionPlan create and leg management"
      - "DailyThroughputReport create/edit/finalize"
      - "POST /wte/metals-recovery-batches"
    shared_operations:
      - "Read access to municipalities, agreements, contracts, landfills, permits, reports"
  - name: ContractsManager
    description: "Manages municipal contracts, host community agreements, metals contracts, and put-or-pay settlements"
    identity: opaque
    exclusive_operations:
      - "Municipality and HostCommunityAgreement creation"
      - "WasteSupplyAgreement create/activate/terminate (incl. amendments)"
      - "MetalsRecoveryContract create/suspend/terminate; batch settle/dispute/resolve"
      - "DiversionPlan approval"
      - "POST /wte/settlements/put-or-pay/run"
    shared_operations:
      - "Read access to deliveries, outages, diversion plans, reports"
  - name: EnergyTrader
    description: "Manages power purchase agreements and energy settlement"
    identity: opaque
    exclusive_operations:
      - "PowerPurchaseAgreement create/activate/terminate"
      - "POST /wte/energy-deliveries"
    shared_operations:
      - "Read access to boilers and throughput reports (capacity inputs to capacity payments)"
  - name: EnvironmentalOfficer
    description: "Manages landfills, ash shipments/testing, and emissions monitoring"
    identity: opaque
    exclusive_operations:
      - "Landfill registration"
      - "AshShipment lifecycle and AshTest recording"
      - "EmissionsPermit creation and EmissionsReading recording"
    shared_operations:
      - "Read access to boilers, reports, municipalities"
  - name: Regulator
    description: "Oversight authority; read-only over the business surface plus permit suspension and the logical clock test hook"
    identity: opaque
    exclusive_operations:
      - "POST /wte/emissions-permits/{id}/suspend"
      - "POST /wte/_clock/set_current_utc"
    shared_operations:
      - "Read access to all resources"
