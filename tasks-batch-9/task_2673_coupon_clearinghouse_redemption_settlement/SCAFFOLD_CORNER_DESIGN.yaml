          - validations[priority=8][ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: |
          WITHDRAWN is the Offer machine's only terminal state: a second
          withdraw and a register from WITHDRAWN both return 409
          ERR_INVALID_STATE_TRANSITION, and neither overwrites the
          withdrawn_reason recorded by the first, successful withdraw.
        test_recipe:
          setup:
