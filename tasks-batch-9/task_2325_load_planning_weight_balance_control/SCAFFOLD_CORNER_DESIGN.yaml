      - name: headwind_credit_saturates_at_the_declared_cap
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.calculate_performance_limited_takeoff_weight
          - entities.Flight.fields.headwind_component_kt
        distinguishing_aspect: |
          The headwind credit is a rate with a ceiling: at 90 kg per knot, 10 kt
          is worth 900 kg and so is 12 kt, because the credit is capped at 900
          kg. Two flights that differ only in the reported headwind therefore
          derive the identical performance-limited takeoff weight of 74170.00
          kg and the identical allowed payload of 20180.00 kg limited by the
          zero-fuel weight, which pins the saturation point rather than the
          linear region.
        test_recipe:
          setup:
            - "AC1, R1 with the [15,30) band, STD-2026; two flights on the same airframe at 22 C on a dry runway, separated well beyond the 45-minute turnaround, one reporting 10 kt of headwind and the other 12 kt."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
          trigger:
            - call: "POST /flights"
              payload: { flight_number: "LX1620", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 10, runway_condition: "DRY" }
              as: LoadController
              captures: { f_ten: $.data.id }
            - call: "POST /flights"
              payload: { flight_number: "LX1622", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T14:00:00Z", scheduled_on_block_utc: "2026-08-15T16:00:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 12, runway_condition: "DRY" }
              as: LoadController
              captures: { f_twelve: $.data.id }
          assert:
            - "both triggers return HTTP 201"
            - "Flight.${f_ten}.performance_limited_takeoff_weight_kg == 74170.00"
            - "Flight.${f_twelve}.performance_limited_takeoff_weight_kg == 74170.00"
            - "Flight.${f_ten}.allowed_payload_kg == 20180.00 and Flight.${f_ten}.limiting_factor == \"MZFW\""
            - "Flight.${f_twelve}.allowed_payload_kg == 20180.00 and Flight.${f_twelve}.limiting_factor == \"MZFW\""
            - "Flight.${f_ten}.dry_operating_weight_kg == 42550.00 and Flight.${f_ten}.dry_operating_index == 62.53"

      - name: sheet_acceptance_cascade_releases_the_load
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LoadSheet.transitions.ISSUED_to_ACCEPTED
          - entities.Flight.fields.load_release_state
        excluded_because:
          difficulty_instance: transitive_cascade / sheet_accept_cascade_release_load_notoc
          rationale: "That §1.8 instance follows the captain's acceptance through the sheet, the plan, the flight's release posture and the NOTOC reference in one call, asserting the whole chain rather than the sheet alone."

      - name: standard_and_actual_weight_programs_price_the_same_manifest_differently
        claim_type: dual_variant_calculation
        grounds:
          - calculations.calculate_pax_line_weight
          - entities.WeightProgram.fields.program_kind
        excluded_because:
          difficulty_instance: dual_variant_calculation / pax_weight_program_standard_vs_actual_diverges
          rationale: "That §1.8 instance runs the identical head counts under a STANDARD and an ACTUAL program and asserts the divergent line weights, indices and documentation references, including the actual-weight fields being required under one program and refused under the other."

      - name: temperature_band_threshold_switches_the_performance_row
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.calculate_performance_limited_takeoff_weight
          - entities.PerformanceBand.fields.temp_lo_c
        excluded_because:
          difficulty_instance: boundary_precision_check / temperature_band_lower_inclusive_boundary
          rationale: "That §1.8 instance sits one tenth of a degree either side of a band's lower bound and asserts the inclusive-lower, exclusive-upper selection together with the resulting jump in the performance-limited takeoff weight."

  # ==========================================================================
  - section: consistency_model
    instances:

      - name: compute_response_already_carries_the_recomputed_figures
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /load-plans/{id}/compute]
          - calculations.calculate_balance_chain
        distinguishing_aspect: |
          There is no deferred settlement anywhere in this domain: the compute
          response itself carries the full recomputed balance chain, and the
          follow-up reads of the plan and of the flight - issued immediately
          afterwards, with no intervening write - return exactly the same
          figures and the already-advanced flight posture. Nothing is left for
          a later reconciliation pass to fill in.
