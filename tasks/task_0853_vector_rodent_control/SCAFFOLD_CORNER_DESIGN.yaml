          trigger:
            - call: "POST /vector-control/complaints"
              payload: { property_id: "${prop_id}", complaint_type: "MOSQUITO_BREEDING", reporter_type: "AGENCY", description: "Standing water in the rear lot", reported_severity: "ROUTINE" }
              as: IntakeClerk
              captures: { comp_id: $.data.id, ps_intake: $.data.priority_score }
            - call: "POST /vector-control/complaints/${comp_id}/triage"
              payload: { severity: "ROUTINE", triage_notes: "Standing water plus active rodent index" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { sev: $.data.severity, ps_triage: $.data.priority_score }
          assert:
            - "At intake: Complaint.${comp_id}.severity == ROUTINE and priority_score == 50.00"
            - "At intake: Complaint.${comp_id}.response_due_at == 2026-05-11T09:00:00.000Z (168 hours after created_at)"
            - "After triage: Complaint.${comp_id}.severity == HIGH (auto-escalated because Zone.posture == HOTSPOT)"
            - "After triage: Complaint.${comp_id}.priority_score == 70.00"
            - "After triage: Complaint.${comp_id}.response_due_at == 2026-05-07T09:00:00.000Z, 72 hours after created_at and not after triaged_at"
            - "Zone.${zone_id}.posture == HOTSPOT and Zone.${zone_id}.open_complaint_count == 2"

