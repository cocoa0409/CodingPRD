# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# 1099 Vendor Reporting & W-9 Collection
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: c_vendor_create_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Vendor]
        distinguishing_aspect: "A minimally-specified vendor create materializes every system/computed default in one response."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Fresh V", entity_classification: "TRUST_ESTATE", address_line1: "1 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
          assert:
            - "response 201; Vendor.${v}.status == ACTIVE"
            - "tin_match_status == NOT_SUBMITTED, b_notice_stage == NONE, backup_withholding_flag == false"
            - "mismatch_count_3yr == 0, withholding_balance_cents == 0, e_delivery_consent == false, tin == null"
            - "version == 1 and id/created_at/updated_at present (system fields; client input for them ignored)"

      - name: c_vendor_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Vendor.fields.entity_classification, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field entity_classification fails creation with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "NoClass", address_line1: "2 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400); no Vendor persisted"

      - name: c_vendor_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent vendor id yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /tax1099/vendors/00000000-0000-0000-0000-000000000000", payload: {}, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: c_w9_invalid_tin_format_returns_422
        claim_type: type_constraints
        grounds: [entities.W9Submission.fields.submitted_tin, "errors[ERR_INVALID_TIN_FORMAT]"]
        distinguishing_aspect: "A W-9 whose TIN is not exactly 9 ASCII digits is rejected before any state change."
        test_recipe:
          setup: ["Vendor V ACTIVE (no W-9 yet)"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Tin V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "3 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Tin V", submitted_tin: "12345", submitted_tin_type: "SSN", signature_name: "T" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_TIN_FORMAT (422)"
            - "Vendor.${v}.tin_match_status still == NOT_SUBMITTED"

      - name: c_payment_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Payment.fields.source_system, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum field outside its declared member set (source_system=BITCOIN) is rejected."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Enum V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "4 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Enum V", submitted_tin: "123123123", submitted_tin_type: "SSN", signature_name: "E" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "BITCOIN", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: c_payment_unknown_field_returns_invalid_request
        claim_type: type_constraints
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A request body carrying an undeclared field is rejected, not silently ignored."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Strict V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "5 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Strict V", submitted_tin: "321321321", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST when an undeclared body field (e.g. legacy_ref) is present (400)"

      - name: c_withholding_entry_immutable_shape
        claim_type: immutability
        grounds: [entities.WithholdingEntry]
        distinguishing_aspect: "WithholdingEntry is common_fields:false — entries expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED; one SERVICE payment 100000c posted"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Imm V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "6 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Imm V", submitted_tin: "456456456", submitted_tin_type: "SSN", signature_name: "I" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_3" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
          trigger:
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
          assert:
            - "response.total_count == 1 and entry amount_cents == 24000, entry_type == DEBIT_WITHHELD, status == UNREMITTED"
            - "entry carries id and created_at but NO version or updated_at member (append-only resource)"

      - name: c_tax_year_inverted_period_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.TaxYear.fields.period_end_exclusive, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "period_end_exclusive <= period_start is a structural rejection independent of overlap checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-06-01T00:00:00Z", period_end_exclusive: "2025-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: c_return_initial_state_draft_pending_copy
        claim_type: initial_state
        grounds: [state_machines.TaxReturn.federal_status, state_machines.TaxReturn.recipient_copy_status]
        distinguishing_aspect: "A generated return starts as DRAFT on the federal dimension and PENDING on the copy dimension with PROVISIONAL basis."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched; SERVICE payment 100000c"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Init V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "7 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Init V", submitted_tin: "654654654", submitted_tin_type: "SSN", signature_name: "I" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
          trigger:
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
          assert:
            - "$.data[0].federal_status == DRAFT and $.data[0].recipient_copy_status == PENDING"
            - "$.data[0].amount_basis == PROVISIONAL and $.data[0].is_correction == false and $.data[0].version == 1"

      - name: c_validate_twice_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.TaxReturn.federal_status.DRAFT_to_VALIDATED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "VALIDATED is not a from-state of validate; the second call is rejected with no side effects."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V matched; SERVICE payment 100000c; return generated"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Twice V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "8 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Twice V", submitted_tin: "789789789", submitted_tin_type: "SSN", signature_name: "T" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
          trigger:
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); return remains VALIDATED"

      - name: c_merged_vendor_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Vendor, "errors[ERR_VENDOR_NOT_ACTIVE]"]
        distinguishing_aspect: "MERGED is terminal: both OCC-conforming PATCH and new W-9 submissions against the merged source are rejected with ERR_VENDOR_NOT_ACTIVE."
        test_recipe:
          setup: ["Two ACTIVE vendors S and G, both MATCHED with identical tin 123456789; merge S->G approved (clerk-1 requests, admin-1 approves)"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Lock S", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "9 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vs: $.data.id } }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "Lock S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { ws: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${ws}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Lock G", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "10 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { vg: $.data.id } }
            - { call: "POST /tax1099/vendors/${vg}/w9-submissions", payload: { submitted_legal_name: "Lock G", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "G" }, as: APClerk, captures: { wg: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wg}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendor-merge-requests", payload: { source_vendor_id: "${vs}", target_vendor_id: "${vg}", reason: "dup" }, as: APClerk, as_user_id: "clerk-1", captures: { m: $.data.id } }
            - { call: "POST /tax1099/vendor-merge-requests/${m}/approve", payload: {}, as: TaxAdmin, as_user_id: "admin-1" }
            - { call: "GET /tax1099/vendors/${vs}", payload: {}, as: TaxAdmin, captures: { sv: $.data.version } }
          trigger:
            - { call: "PATCH /tax1099/vendors/${vs}", payload: { address_city: "Nowhere", expected_vendor_version: "${sv}" }, as: TaxAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "Lock S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { err2: $.data.error_id } }
          assert:
            - "PATCH (fresh version ${sv}) error_id == ERR_VENDOR_NOT_ACTIVE (409), NOT ERR_STALE_VERSION"
            - "W-9 submit error_id == ERR_VENDOR_NOT_ACTIVE"

      - name: c_remittance_reject_reopen_cycle
        claim_type: valid_transition
        grounds: [state_machines.Remittance]
        distinguishing_aspect: "The DRAFT->SUBMITTED->REJECTED->DRAFT->SUBMITTED->ACKNOWLEDGED cycle restores entries to UNREMITTED on rejection and re-sweeps them on resubmission."
        test_recipe:
          setup: ["TaxYear 2025 OPEN; vendor V MISMATCHED; payment 100000c on 2025-02-10 (Q1, withheld 24000c)"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Cyc R", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "11 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Cyc R", submitted_tin: "147147147", submitted_tin_type: "SSN", signature_name: "C" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-02-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { rem: $.data.id } }
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "xmtr-1" }
          trigger:
            - { call: "POST /tax1099/remittances/${rem}/record-outcome", payload: { outcome: "REJECTED" }, as: IRSSystem }
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
            - { call: "POST /tax1099/remittances/${rem}/reopen", payload: {}, as: TaxSpecialist }
            - { call: "GET /tax1099/remittances/${rem}", payload: {}, as: TaxSpecialist, captures: { amt2: $.data.amount_cents } }
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "POST /tax1099/remittances/${rem}/record-outcome", payload: { outcome: "ACKNOWLEDGED" }, as: IRSSystem }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: TaxSpecialist, captures: { bal: $.data.withholding_balance_cents } }
          assert:
            - "after REJECTED: status REJECTED and the swept entry is UNREMITTED again with remittance_id cleared"
            - "after reopen: status DRAFT and amount_cents == 24000 (recomputed)"
            - "after resubmit + ACKNOWLEDGED: status ACKNOWLEDGED (terminal)"
            - "final Vendor.${v}.withholding_balance_cents == 0"

      - name: c_transmittal_reject_reverts_members
        claim_type: side_effect_execution
        grounds: [state_machines.Transmittal, state_machines.TaxReturn.federal_status.TRANSMITTED_to_VALIDATED]
        distinguishing_aspect: "A REJECTED transmittal returns its member returns to VALIDATED with transmittal_id cleared, and after reopen the same return is seal-eligible again."
        test_recipe:
          setup: ["TaxYear 2025 OPEN (default efile threshold 10); vendor V matched; payment 100000c; return validated; transmittal sealed and submitted PAPER"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Rej V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "12 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Rej V", submitted_tin: "258258258", submitted_tin_type: "SSN", signature_name: "R" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
          trigger:
            - { call: "POST /tax1099/transmittals/${t}/record-outcome", payload: { outcome: "REJECTED" }, as: IRSSystem }
            - { call: "GET /tax1099/returns/${r}", payload: {}, as: TaxSpecialist, captures: { fst: $.data.federal_status, ftid: $.data.transmittal_id } }
            - { call: "POST /tax1099/transmittals/${t}/reopen", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { rc: $.data.return_count } }
          assert:
            - "after REJECTED: Transmittal.${t}.status == REJECTED; TaxReturn.${r}.federal_status == VALIDATED and transmittal_id == null"
            - "after reopen: Transmittal.${t}.status == OPEN with return_count == 0 and filing_channel == null"
            - "re-seal succeeds with return_count == 1 (the reverted return is eligible again)"

      - name: c_copy_delivery_deadline_boundary
        claim_type: precondition_enforcement
        grounds: [state_machines.TaxReturn.recipient_copy_status, "errors[ERR_COPY_DEADLINE_PASSED]", entities.TaxYear.fields.recipient_copy_deadline]
        distinguishing_aspect: "Deadline is inclusive: delivery at exactly 2026-01-31T00:00:00Z succeeds; one second later the identical call fails with ERR_COPY_DEADLINE_PASSED."
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN with recipient_copy_deadline 2026-01-31T00:00:00Z"
            - "Vendor V matched; payment 100000c; NEC return VALIDATED"
