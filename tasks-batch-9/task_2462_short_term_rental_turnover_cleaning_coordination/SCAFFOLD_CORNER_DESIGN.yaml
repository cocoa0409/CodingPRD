            - "${qa_by} == coord-4 and ${qa_cleaner} == ${cc} (copied from the COMPLETED assignment)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: corner_cc_occ_stale_turnover_version_refused_then_fresh_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rule_id=assign-stale-turnover]
          - errors.ERR_STALE_TURNOVER_VERSION
          - validations[priority=11]
        distinguishing_aspect: |
          The stale read is manufactured the way it happens in production rather than by inventing a
          number: the coordinator reads the turnover at version 1, an unrelated schedule change
          recomputes the window and bumps it to 2, and the offer built on the old reading is refused
          with 412. Re-reading and resending the identical body then succeeds, proving the refusal
          was purely about the version token and that the failed attempt created no assignment.
        test_recipe:
          setup:
            - "Canonical P1 turnover T1 created at version 1 with window 16:00Z-20:30Z and required_minutes 198."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", stale_v: "$.data.version" }
          trigger:
            - call: "POST /bookings/${b_out}/schedule-change"
              payload: { change_type: "LATE_CHECKOUT", new_time_at: "2026-08-08T17:00:00Z" }
              as: Coordinator
              captures: { sc_late: "$.data.late_checkout_until_at" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${stale_v}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e1: "$.data.error_id" }
            - call: "GET /assignments"
              payload: { turnover_id: "${t1}" }
              as: Coordinator
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { fresh_v: "$.data.version", fresh_min: "$.data.window_minutes" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${fresh_v}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id", a1_status: "$.data.status" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { post_v: "$.data.version" }
          assert:
            - "${stale_v} == 1 and ${sc_late} == 2026-08-08T17:00:00Z"
            - "${e1} == ERR_STALE_TURNOVER_VERSION (412) - the schedule change had already bumped the turnover to 2"
            - "GET /assignments?turnover_id=${t1} returns total_count == 0 immediately after the 412"
            - "${fresh_v} == 2 and ${fresh_min} == 210"
            - "${a1_status} == OFFERED with HTTP 201 for the identical body carrying the fresh version"
            - "${post_v} == 3 - the accepted write bumped the version again"

      - name: corner_cc_occ_stale_supply_line_version_prevents_double_counting_a_delivery
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rule_id=replenish-stale-supply-line]
          - errors.ERR_STALE_SUPPLY_LINE_VERSION
          - calculations.supply_on_hand_projection
        distinguishing_aspect: |
          Replenishment is additive, so without the version token a retried delivery would silently
          double the stock - which is exactly what the recipe attempts: the same qty is posted twice
          with the same expected_supply_line_version. The second call is 412 and, crucially,
          on_hand_qty and the movement count are re-read to prove no ledger row was appended before
          the check ran.
        test_recipe:
          setup:
            - "Property P1 with supply line LIN-SHEET-Q seeded at on_hand_qty 6, reorder_point 0, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen Sheet Set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: Coordinator
              captures: { sl1: "$.data.id", v0: "$.data.version", qty0: "$.data.on_hand_qty" }
          trigger:
            - call: "POST /supply-lines/${sl1}/replenish"
              payload: { qty: 4, expected_supply_line_version: "${v0}", note: "delivery 8891" }
              as: Coordinator
              captures: { v1: "$.data.version", qty1: "$.data.on_hand_qty" }
            - call: "POST /supply-lines/${sl1}/replenish"
              payload: { qty: 4, expected_supply_line_version: "${v0}", note: "delivery 8891 retried" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "GET /supply-lines/${sl1}"
              payload: {}
              as: Coordinator
              captures: { qty2: "$.data.on_hand_qty", v2: "$.data.version" }
            - call: "GET /stock-movements"
              payload: { supply_line_id: "${sl1}" }
              as: Coordinator
            - call: "POST /supply-lines/${sl1}/replenish"
              payload: { qty: 4, expected_supply_line_version: "${v2}", note: "delivery 8892" }
              as: Coordinator
              captures: { v3: "$.data.version", qty3: "$.data.on_hand_qty" }
          assert:
            - "${qty0} == 6 and ${v0} == 1"
            - "${qty1} == 10 and ${v1} == 2 for the first delivery"
            - "${e1} == ERR_STALE_SUPPLY_LINE_VERSION (412) for the retry built on version 1"
            - "${qty2} == 10 and ${v2} == 2 - the retry added nothing"
            - "GET /stock-movements?supply_line_id=${sl1} returns total_count == 2 (SEED, REPLENISH) - no phantom third row"
            - "${qty3} == 14 and ${v3} == 3 - a genuinely new delivery on a fresh token is accepted"

      - name: corner_cc_version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - response_envelope
          - entities.Turnover
          - state_machines.Turnover
        distinguishing_aspect: |
          The version field is the OCC token for two different endpoints, so it must advance on
          EVERY mutation of the row - including mutations triggered from a different aggregate (the
          booking checkout that recomputes the window) and including transitions requested by a
          different role - and must never advance on a read. The full trace 1 -> 2 -> 3 -> 4 -> 5 is
          pinned with an interleaved GET after each step.
        test_recipe:
          setup:
            - "Canonical P1 turnover T1 with Cleaner C eligible; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", v_create: "$.data.version", u_create: "$.data.updated_at" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { v_read1: "$.data.version" }
            - call: "GET /turnovers"
              payload: { property_id: "${p1}" }
              as: Coordinator
              captures: { v_read2: "$.data[0].version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${v_read1}", cleaner_id: "${cc}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { v_assign: "$.data.version" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { v_accept: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_out}/checkout"
              payload: {}
              as: Coordinator
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { v_checkout: "$.data.version", u_checkout: "$.data.updated_at" }
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Cleaner
              as_user_id: "${cc}"
              captures: { v_start: "$.data.version" }
          assert:
            - "${v_create} == 1 and ${u_create} == 2026-08-01T00:00:00Z"
            - "${v_read1} == 1 and ${v_read2} == 1 - two reads, no increment, in the list projection too"
            - "${v_assign} == 2 (Coordinator write), ${v_accept} == 3 (Cleaner write on a sibling aggregate)"
            - "${v_checkout} == 4 - a write to the BOOKING bumped the turnover, because it recomputed the window"
            - "${u_checkout} == 2026-08-08T16:00:00Z - updated_at tracks the same logical clock"
            - "${v_start} == 5 returned directly by the transition response, not only by a later read"

      - name: corner_cc_multi_level_cascade_runs_end_to_end_in_one_request
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / outgoing_booking_cancel_cascades_booking_to_turnover_to_assignment_to_payline_to_ledger
          rationale: "That instance drives the deepest chain in the scaffold (Booking -> Turnover -> Assignment -> PayLine -> Cleaner payout ledger) and asserts every hop plus the ordering sensitivity, which is exactly this layer's claim."

      - name: corner_cc_derived_counters_reconcile_after_create_and_after_resolution
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Property.fields.open_issue_count
        excluded_because:
          difficulty_instance: transitive_cascade / repair_completion_cascades_repair_to_issue_to_property_and_releases_guest_gate
          rationale: "That instance asserts open_issue_count decrementing as the repair resolves its issue and the gate releasing in the same response; the increment half is pinned by the §1.9 conditional-cascade instance on the owner-notification threshold."

      - name: corner_cc_both_pay_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        grounds:
          - calculations.cleaner_pay_line.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pay_variant_divergence_provisional_vs_final_linen_units
          rationale: "That instance computes both variants over one dataset and asserts the -1440 delta applied to the ledger when PROVISIONAL becomes FINAL, which is this layer's claim in full."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_consistency_every_cascade_effect_is_readable_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /assignments/{id}/accept"].side_effects
          - endpoints["POST /checklist-tasks/{id}/review"].side_effects
        distinguishing_aspect: |
          consistency_model is immediate, so no derived value is allowed to lag by a request: the
          accept response itself must already reflect a created PayLine and an updated cleaner
          payout, and the review response must already carry the recomputed parent status and
          chargeback. The recipe reads each dependent row immediately after the triggering call with
          no intervening write, so any eventual-consistency implementation fails on the first read
          rather than on a retry.
        test_recipe:
          setup:
            - "Canonical P1 turnover T1 with LINEN lines par 6 / par 8 (on hand 6 / 8), Cleaner C offered the work; clock 2026-08-08T16:00:00Z with the guest checked out."
