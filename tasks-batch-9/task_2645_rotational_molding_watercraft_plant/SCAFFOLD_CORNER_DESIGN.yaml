              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /finished-units?molding_cycle_id=${cyc}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
              captures: { fu: "$.data[0].id" }
            - call: "POST /finished-units/${fu}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu}/outfit"
              payload: { hardware_kit_serial: "HK-CVD-1" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
          assert:
            - "MoldingCycle.${cyc}.provisional_warpage_index == 0.288 — thermal term abs(308.0 - 288) / 40 = 0.500, cooling and rotation terms 0.000, base = round(0.40 * 0.500, 3) = 0.200, then 0.200 * SIZE_CLASS_WARPAGE_FACTOR[TANDEM] 1.150 * COOLING_MODE_WARPAGE_FACTOR[WATER_MIST] 1.250 = 0.287500 which quantises HALF_UP at 3 dp to 0.288"
            - "the same cycle read as MID / AMBIENT (factors 1.000 and 1.000) would store 0.200, so 0.288 proves both constant tables were applied"
            - "MoldingCycle.${cyc}.actual_cooling_minutes == 35 and status == DEMOLDED; the cooling term is 0.000 because 35 is at or above min_cooling_minutes 30"
            - "FinishedUnit.${fu}.mean_wall_thickness_mm == 6.000, wall_sd_mm == 0.065, wall_cv_pct == 1.08 and min_wall_thickness_mm == 5.90"
            - "FinishedUnit.${fu}.final_warpage_index == 0.288 — the FINAL variant adds W_DISTRIBUTION 0.50 * max(0, 1.08 - 12.00) / 10 = 0.000, so the same two factors reproduce 0.288"
            - "FinishedUnit.${fu}.inspection_verdict == PASS and build_status == SELLABLE — 0.288 is below WARPAGE_REWORK_THRESHOLD 1.200"

