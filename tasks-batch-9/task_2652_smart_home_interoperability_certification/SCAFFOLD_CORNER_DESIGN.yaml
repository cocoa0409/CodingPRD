      - name: the_security_lockout_follows_the_recorded_conformance_decider_not_the_starter
        claim_type: segregation_of_duties
        grounds:
          - rbac.role_model
          - validations[priority=24]
          - state_machines.CertificationSubmission#conformance_review_state
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: >
          The lockout is keyed on the stored conformance_reviewer_user_id, which is written by
          return-for-info and by the conformance decision - never by start-review. So the user who started
          the review twice (CONF1) may record the security decision, while the user who merely returned the
          submission for more information (CONF2) is locked out, and that lockout survives the revision
          round even though the resubmit reset conformance_review_state to PENDING.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20)."
            - "Member M1 in good standing with 1000000 cents; submission S1 SUBMITTED with 135000 escrowed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
            - call: "POST /feature-sets"
              payload: { specification_id: "${spec_id}", device_type: "LIGHTING", feature_code: "CORE_ONOFF", obligation: "MANDATORY", test_case_count: 20 }
              as: ProgramAdmin
            - call: "POST /specifications/${spec_id}/ratify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Acme Devices", contact_email: "ops@acme.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 2, scope_specification_id: "${spec_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /submissions"
              payload: { member_id: "${m1_id}", specification_id: "${spec_id}", device_model: "AL-100", device_type: "LIGHTING", declared_feature_codes: ["CORE_ONOFF"], declared_secure_boot: true, declared_firmware_update_capability: "OTA_SIGNED", attestation_key_fingerprint: "AA:00:00:01" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /submissions/${sub1_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /submissions/${sub1_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF1"
            - call: "POST /submissions/${sub1_id}/return-for-info"
              payload: { reason: "attestation fingerprint unreadable" }
              as: ConformanceReviewer
              as_user_id: "CONF2"
            - call: "POST /submissions/${sub1_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /submissions/${sub1_id}/start-review"
              payload: {}
              as: ConformanceReviewer
              as_user_id: "CONF1"
            - call: "POST /submissions/${sub1_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: true, verified_firmware_update_capability: "OTA_SIGNED" }
              as: SecurityReviewer
              as_user_id: "CONF2"
              captures: { err_segregation: $.data.error_id }
            - call: "POST /submissions/${sub1_id}/security-decision"
              payload: { decision: "APPROVE", secure_boot_verified: true, verified_firmware_update_capability: "OTA_SIGNED" }
              as: SecurityReviewer
              as_user_id: "CONF1"
            - call: "GET /submissions/${sub1_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /members/${m1_id}/credit-ledger"
              payload: { variant: "AVAILABLE" }
              as: ProgramAdmin
              captures: { m1_balance: $.data.balance_cents }
          assert:
            - "After the return-for-info the submission reads state \"RETURNED_FOR_INFO\", conformance_review_state \"RETURNED\", revision_round 1 and conformance_reviewer_user_id \"CONF2\" - the starter CONF1 is not recorded anywhere"
            - "After the resubmit and the second start-review the submission reads state \"IN_REVIEW\" and conformance_review_state \"PENDING\", while conformance_reviewer_user_id is still \"CONF2\""
            - "${err_segregation} == \"ERR_SEGREGATION_OF_DUTIES\" (409) - CONF2 acting as SecurityReviewer matches the stored conformance_reviewer_user_id even though that user's decision was reset to PENDING by the resubmit"
            - "The identical request from CONF1 returns 200 with security_review_state == \"APPROVED\" and security_reviewer_user_id == \"CONF1\" - starting a review twice never creates a lockout"
            - "The submission is still state \"IN_REVIEW\" after the security approval because conformance_review_state is \"PENDING\" - the bubble-up needs both axes APPROVED"
            - "The refused security decision wrote nothing: secure_boot_verified became true only on the accepted call, and ${m1_balance} == 865000 throughout, with fee_escrowed_cents still 135000 (the resubmit did not escrow a second time)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: a_stale_submission_version_blocks_plan_creation_while_unrelated_writes_do_not
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[test-plan-create-stale-submission]
          - endpoints[POST /test-plans]
          - errors[ERR_STALE_SUBMISSION_VERSION]
        distinguishing_aspect: >
          The guard is the parent CertificationSubmission's own version counter, not a global activity
          clock: booking a bench window writes TestSession and TestLaboratory rows without touching the
          submission, so a plan create still succeeds with the version observed before that booking, while
          replaying the version consumed by an earlier plan create is refused with 412 and creates nothing.
        test_recipe:
          setup:
            - "RATIFIED SB1 specification with LIGHTING CORE_ONOFF (MANDATORY 20); AUTHORIZED laboratory with 2 benches."
            - "Member M1 in good standing with 1000000 cents; submission S1 IN_REVIEW."
