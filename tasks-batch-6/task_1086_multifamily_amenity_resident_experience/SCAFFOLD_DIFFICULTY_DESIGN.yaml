scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: booking_provisional_vs_final_diverges
        grounds:
          - calculations.booking_charge
          - state_machines.AmenityBooking.CREATE_to_CONFIRMED
          - state_machines.AmenityBooking.CHECKED_IN_to_COMPLETED
          - entities.AmenityBooking.fields.provisional_fee_cents
          - entities.AmenityBooking.fields.final_fee_cents
        distinguishing_aspect: |
          On the AmenityBooking domain, the provisional fee (from the requested 2h peak window)
          and the final fee (from the actual 1h checked-in window) are different numbers
          (9600 vs 4800); only the final is charged to rent_balance.
        test_recipe:
          setup:
            - "Property + Unit + PREMIUM Resident; clock 2026-05-20; CLUBROOM amenity base 4000/h, deposit 10000, peak 17:00-21:00 x1.5, open 06:00 close 22:00, capacity 1."
            - "Booking 2026-06-01 18:00-20:00 created CONFIRMED; then checked in at 18:00 and checked out at 19:00."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple", address: "1 Elm St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "101", bedrooms: 2 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Ada", email: "ada@x.com", membership_tier: "PREMIUM" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Clubroom", amenity_type: "CLUBROOM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 10000, buffer_minutes: 30, open_minute: 360, close_minute: 1320, peak_start_minute: 1020, peak_end_minute: 1260, peak_multiplier: 1.5 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-01T18:00:00Z", end_at: "2026-06-01T20:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T18:00:00Z" }
              as: PropertyManager
            - call: "POST /amenity-bookings/${booking_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T19:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /amenity-bookings/${booking_id}/check-out"
              payload: {}
              as: FrontDesk
          assert:
            - "AmenityBooking.${booking_id}.provisional_fee_cents == 9600"
            - "AmenityBooking.${booking_id}.final_fee_cents == 4800"
            - "AmenityBooking.${booking_id}.status == COMPLETED"
            - "Resident.${resident_id}.rent_balance_cents == 4800"
            - "Resident.${resident_id}.hold_balance_cents == 0"

      - name: service_estimate_vs_actual_diverges
        grounds:
          - calculations.service_invoice
          - state_machines.ServiceRequest.TRIAGED_to_ASSIGNED
          - state_machines.ServiceRequest.IN_PROGRESS_to_COMPLETED
          - entities.ServiceRequest.fields.estimated_cost_cents
          - entities.ServiceRequest.fields.final_invoice_cents
        distinguishing_aspect: |
          On the ServiceRequest domain, the assignment estimate (18014, from estimated_hours + lump parts)
          and the completion actual invoice (14154, from labor_hours + per-line-taxed itemized parts) differ.
        test_recipe:
          setup:
            - "Property + Unit + Resident; PLUMBING vendor rate 8000/h; a service request triaged then assigned (estimate) then started, then completed with itemized parts (actual)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Maple", address: "1 Elm St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "102", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Ben", email: "ben@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "PlumbCo", trades: ["PLUMBING"], hourly_rate_cents: 8000, active_job_limit: 5 }
              as: PropertyManager
              captures: { vendor_id: $.data.id }
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "PLUMBING", priority: "ROUTINE", description: "Leaky sink" }
              as: PropertyManager
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/triage"
              payload: {}
              as: PropertyManager
              as_user_id: "pm_triage"
            - call: "POST /service-requests/${sr_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 2, estimated_parts_cents: 2014 }
              as: PropertyManager
              as_user_id: "pm_assign"
            - call: "POST /service-requests/${sr_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /service-requests/${sr_id}/complete"
              payload: { labor_hours: 1.5, parts: [{ name: "A", cents: 1007 }, { name: "B", cents: 1007 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
          assert:
            - "ServiceRequest.${sr_id}.estimated_cost_cents == 18014"
            - "ServiceRequest.${sr_id}.final_invoice_cents == 14154"
            - "ServiceRequest.${sr_id}.status == COMPLETED"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_charge_peak_tier_cap_mode_a
        grounds:
          - calculations.booking_charge
          - entities.Amenity.fields.peak_multiplier
          - entities.Amenity.fields.base_rate_cents_per_hour
        distinguishing_aspect: |
          Mode (a): fee = min( round(base*(offpeak + peak*multiplier)) * (1-discount), CAP ) has >=3 inputs
          (base_rate, hours, peak_multiplier) with a nested min-cap; a 6h all-peak booking computes gross 60000
          but is clamped to DAILY_FEE_CAP_CENTS 20000.
        test_recipe:
          setup:
            - "Property + Unit + STANDARD Resident; clock 2026-05-20; POOL amenity base 5000/h, peak all-day x2.0, open 00:00 close 24:00, deposit 0, capacity 1."
            - "Booking 2026-06-02 10:00-16:00 (6h all peak)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Oak", address: "2 Oak St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "201", bedrooms: 2 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Cara", email: "cara@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Pool", amenity_type: "POOL", capacity: 1, base_rate_cents_per_hour: 5000, deposit_cents: 0, buffer_minutes: 0, open_minute: 0, close_minute: 1440, peak_start_minute: 0, peak_end_minute: 1440, peak_multiplier: 2.0 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
          trigger:
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-02T10:00:00Z", end_at: "2026-06-02T16:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
          assert:
            - "AmenityBooking.${booking_id}.provisional_fee_cents == 20000"
            - "AmenityBooking.${booking_id}.status == CONFIRMED"

      - name: service_invoice_per_line_rounding_mode_b
        grounds:
          - calculations.service_invoice
          - entities.ServiceRequest.fields.final_invoice_cents
        distinguishing_aspect: |
          Mode (b): each invoice line is rounded before summation. labor 12000 + round(1007*1.07)=1077 twice
          => 14154; summing raw (12000 + 2154.98) then rounding gives 14155. The scaffold pins round-per-line.
        test_recipe:
          setup:
            - "Property + Unit + Resident; PLUMBING vendor rate 8000/h; request triaged, assigned, started."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Oak", address: "2 Oak St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "202", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Dee", email: "dee@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "PlumbCo", trades: ["PLUMBING"], hourly_rate_cents: 8000 }
              as: PropertyManager
              captures: { vendor_id: $.data.id }
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "PLUMBING", priority: "ROUTINE", description: "Faucet" }
              as: PropertyManager
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/triage"
              payload: {}
              as: PropertyManager
              as_user_id: "pm_triage"
            - call: "POST /service-requests/${sr_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 2 }
              as: PropertyManager
              as_user_id: "pm_assign"
            - call: "POST /service-requests/${sr_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /service-requests/${sr_id}/complete"
              payload: { labor_hours: 1.5, parts: [{ name: "A", cents: 1007 }, { name: "B", cents: 1007 }] }
              as: Vendor
              as_user_id: "${vendor_id}"
          assert:
            - "ServiceRequest.${sr_id}.final_invoice_cents == 14154"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_confirmed_suspended_confirmed_cycle
        grounds:
          - state_machines.AmenityBooking.CONFIRMED_to_SUSPENDED
          - state_machines.AmenityBooking.SUSPENDED_to_CONFIRMED
          - state_machines.Resident.GOOD_STANDING_to_DELINQUENT
          - state_machines.Resident.DELINQUENT_to_GOOD_STANDING
        distinguishing_aspect: |
          On AmenityBooking, a CONFIRMED booking is driven to SUSPENDED (delinquency) and back to CONFIRMED
          (payment) — a genuine cycle a linear machine cannot express.
        test_recipe:
          setup:
            - "Property + Unit + STANDARD Resident; clock 2026-05-20; GYM amenity deposit 10000, capacity 1, no peak."
            - "Future booking 2026-06-10 10:00-12:00 CONFIRMED (hold 10000)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Pine", address: "3 Pine St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "301", bedrooms: 2 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Eve", email: "eve@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 10000, buffer_minutes: 0, open_minute: 0, close_minute: 1440, peak_start_minute: 0, peak_end_minute: 0, peak_multiplier: 1.0 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T12:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /residents/${resident_id}/rent-charges"
              payload: { amount_cents: 60000, description: "June rent" }
              as: PropertyManager
            - call: "POST /payments"
              payload: { resident_id: "${resident_id}", amount_cents: 60000, method: "ACH" }
              as: PropertyManager
          assert:
            - "AmenityBooking.${booking_id}.status == CONFIRMED"
            - "Resident.${resident_id}.account_status == GOOD_STANDING"
            - "Resident.${resident_id}.hold_balance_cents == 10000"

      - name: service_triaged_assigned_triaged_cycle
        grounds:
          - state_machines.ServiceRequest.TRIAGED_to_ASSIGNED
          - state_machines.ServiceRequest.ASSIGNED_to_TRIAGED
          - entities.Vendor.fields.active_job_count
        distinguishing_aspect: |
          On ServiceRequest, assign then unassign returns to TRIAGED, then assign again — a TRIAGED<->ASSIGNED
          revision cycle; vendor.active_job_count returns to 1 after the loop.
        test_recipe:
          setup:
            - "Property + Unit + Resident + HVAC vendor; request triaged."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Pine", address: "3 Pine St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "302", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Finn", email: "finn@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "CoolCo", trades: ["HVAC"], hourly_rate_cents: 9000, active_job_limit: 5 }
              as: PropertyManager
              captures: { vendor_id: $.data.id }
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "HVAC", description: "No AC" }
              as: PropertyManager
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/triage"
              payload: {}
              as: PropertyManager
              as_user_id: "pm_triage"
            - call: "POST /service-requests/${sr_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 3 }
              as: PropertyManager
              as_user_id: "pm_assign"
            - call: "POST /service-requests/${sr_id}/unassign"
              payload: {}
              as: PropertyManager
              as_user_id: "pm_assign"
          trigger:
            - call: "POST /service-requests/${sr_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 3 }
              as: PropertyManager
              as_user_id: "pm_assign"
          assert:
            - "ServiceRequest.${sr_id}.status == ASSIGNED"
            - "Vendor.${vendor_id}.active_job_count == 1"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: delinquency_suspends_bookings_releases_holds
        grounds:
          - state_machines.Resident.GOOD_STANDING_to_DELINQUENT
          - state_machines.AmenityBooking.CONFIRMED_to_SUSPENDED
          - calculations.account_status_evaluation
          - entities.Resident.fields.hold_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from POST /rent-charges: rent charge -> Resident GOOD_STANDING->DELINQUENT (link1)
          -> future CONFIRMED booking -> SUSPENDED (link2) -> deposit hold released, hold_balance 10000->0 (link3).
        test_recipe:
          setup:
            - "Property + Unit + STANDARD Resident; clock 2026-05-20; GYM deposit 10000, capacity 1; future booking 2026-06-10 CONFIRMED (hold 10000)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Pine", address: "3 Pine St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "303", bedrooms: 2 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Gus", email: "gus@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 10000, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T12:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /residents/${resident_id}/rent-charges"
              payload: { amount_cents: 60000, description: "June rent" }
              as: PropertyManager
          assert:
            - "Resident.${resident_id}.account_status == DELINQUENT"
            - "AmenityBooking.${booking_id}.status == SUSPENDED"
            - "Resident.${resident_id}.hold_balance_cents == 0"

      - name: event_cancel_cascades_registration_refunds
        grounds:
          - state_machines.CommunityEvent.PUBLISHED_to_CANCELLED
          - state_machines.EventRegistration.RESERVED_to_CANCELLED
          - entities.Resident.fields.wallet_credit_cents
        distinguishing_aspect: |
          Chain from POST /events/{id}/cancel: event -> CANCELLED (link1) -> its RESERVED registration -> CANCELLED
          (link2) -> resident wallet_credit_cents credited the 2000 fee (link3).
        test_recipe:
          setup:
            - "Property + Unit + Resident; published event capacity 5 fee 2000; resident registered RESERVED (fee 2000 charged)."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Birch", address: "4 Birch St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "401", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Hana", email: "hana@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /events"
              payload: { property_id: "${prop_id}", title: "BBQ", start_at: "2026-06-15T18:00:00Z", end_at: "2026-06-15T20:00:00Z", capacity: 5, fee_cents: 2000 }
              as: PropertyManager
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/publish"
              payload: {}
              as: PropertyManager
            - call: "POST /events/${event_id}/register"
              payload: { resident_id: "${resident_id}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/cancel"
              payload: {}
              as: PropertyManager
          assert:
            - "CommunityEvent.${event_id}.status == CANCELLED"
            - "EventRegistration.${reg_id}.status == CANCELLED"
            - "Resident.${resident_id}.wallet_credit_cents == 2000"

  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_safety_beats_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_ACCOUNT_DELINQUENT]
          - errors[ERR_BOOKING_OVERLAP]
        distinguishing_aspect: |
          business_safety (priority 9, ERR_ACCOUNT_DELINQUENT) outranks business_temporal
          (priority 10, ERR_BOOKING_OVERLAP): a DELINQUENT resident booking a slot already held by
          another resident receives ERR_ACCOUNT_DELINQUENT, not ERR_BOOKING_OVERLAP.
        test_recipe:
          setup:
            - "Property with two units/residents A (STANDARD, made DELINQUENT) and B (good). GYM capacity 1."
            - "B holds a CONFIRMED booking 2026-06-05 10:00-12:00; A becomes DELINQUENT via a 60000 charge."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Cedar", address: "5 Cedar St", guest_parking_capacity: 5 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "501", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_a_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "502", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_b_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_a_id}", full_name: "Ann", email: "ann@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { res_a_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_b_id}", full_name: "Bob", email: "bob@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { res_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 0, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${res_b_id}", start_at: "2026-06-05T10:00:00Z", end_at: "2026-06-05T12:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${res_b_id}"
              captures: { booking_b_id: $.data.id }
            - call: "POST /residents/${res_a_id}/rent-charges"
              payload: { amount_cents: 60000, description: "arrears" }
              as: PropertyManager
            - call: "GET /amenities/${amenity_id}"
              payload: {}
              as: PropertyManager
              captures: { amenity_v2: $.data.version }
          trigger:
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${res_a_id}", start_at: "2026-06-05T10:00:00Z", end_at: "2026-06-05T12:00:00Z", expected_amenity_version: "${amenity_v2}" }
              as: Resident
              as_user_id: "${res_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_ACCOUNT_DELINQUENT"

      - name: assign_referential_beats_constraint
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_VENDOR_TRADE_MISMATCH]
          - errors[ERR_VENDOR_AT_CAPACITY]
        distinguishing_aspect: |
          business_referential (priority 8, ERR_VENDOR_TRADE_MISMATCH) outranks business_constraint
          (priority 11, ERR_VENDOR_AT_CAPACITY): assigning an at-capacity vendor that also does not service
          the trade yields ERR_VENDOR_TRADE_MISMATCH.
        test_recipe:
          setup:
            - "ELECTRICAL-only vendor with active_job_limit 1, already at 1 active job."
            - "A second PLUMBING request triaged and awaiting assignment."
          setup_api_calls:
            - call: "POST /properties"
