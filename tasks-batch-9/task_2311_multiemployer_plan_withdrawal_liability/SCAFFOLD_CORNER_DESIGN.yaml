      - name: rejecting_an_asset_sale_leaves_every_exposure_figure_untouched
        claim_type: Side Effect Execution
        grounds:
          - "state_machines.AssetSaleTransaction.transitions.SUBMITTED_to_REJECTED"
          - "calculations.controlled_group_exposure_score"
          - "errors[ERR_TRANSACTION_ALREADY_ADJUDICATED]"
        distinguishing_aspect: |
          The REJECT branch is the only disposition whose side-effect list is purely
          negative: it must set both dispositions to their 'no' values without touching
          bond_posture, contingent_exposure_cents or exposure_score, and it must NOT
          compute a substantial continuity score. It is also terminal, so a second
          adjudication cannot re-route the sale into the exemption branch.
        test_recipe:
          setup:
            - "A seller employer with contribution dollars of 20000000 for 2023, 25000000 for 2024 and 30000000 for 2025, a separate buyer controlled group, and a SUBMITTED sale closing in 2026 at a purchase price of 300000000 with a 30000000 bond posted."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
