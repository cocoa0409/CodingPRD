  # =========================================================================
  # RULE 8 - resource_temporal_overlap
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: poll_session_location_half_open_teardown
        grounds:
          - validations[priority=21]
          - errors.ERR_POLL_SESSION_LOCATION_CONFLICT
          - constants.POLL_SESSION_TEARDOWN_MINUTES
        resource: "PollSession.location_code within one ElectionRound"
        interval_semantics: "HALF-OPEN [session_start_at, session_end_at + 30 minutes): the upper endpoint is EXCLUSIVE, so a session may begin exactly 30 minutes after the previous one ends"
        distinguishing_aspect: |
          Asymmetric, one-sided padding on the END of the interval only, and the padded endpoint is
          exclusive. 09:29:59 collides with a session ending at 09:00 while 09:30:00 does not, and the
          resource is keyed by location_code so an identical window at another location is free.
        test_recipe:
          setup:
            - "petition ELECTION_SET with round 1 SCHEDULED"
            - "session A at PLANT_1_CAFETERIA from 2026-09-01T06:00:00Z to 09:00:00Z, so its blocked interval is [06:00:00, 09:30:00)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330081", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "MAINT", title: "Maintenance Mechanic", headcount: 30, avg_hourly_wage_cents: 3200, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 82, skills_overlap: 78, functional_integration: 86, interchange_rate: 61, work_conditions_overlap: 84 }
              as: LaborRelationsDirector
              captures: { cls_maint_id: $.data.id }
            - call: "POST /labor-relations/classifications/${cls_prod_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_maint_id}/score"
              payload: { scoring_standard: "TRADITIONAL" }
              as: EmploymentCounsel
            - call: "POST /labor-relations/classifications/${cls_prod_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Core production group" }
              as: BoardAgent
            - call: "POST /labor-relations/classifications/${cls_maint_id}/rule"
              payload: { ruling: "INCLUDED", ruling_rationale: "Integrated with production" }
              as: BoardAgent
            - call: "POST /labor-relations/petitions/${pet_id}/verify-showing"
              payload: { submitted_card_count: 40, duplicate_card_count: 3, undated_card_count: 2, stale_card_count: 2, nonunit_card_count: 3 }
              as: BoardAgent
            - call: "POST /labor-relations/election-agreements"
              payload: { petition_id: "${pet_id}", agreement_type: "STIPULATED", proposed_election_date: "2026-09-01", proposed_voting_method: "MANUAL" }
              as: LaborRelationsDirector
              captures: { agr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T15:00:00Z" }
              as: BoardAgent
            - call: "POST /labor-relations/election-agreements/${agr_id}/stipulate"
              payload: { approved_election_date: "2026-09-01", voting_method: "MANUAL", polls_open_at: "2026-09-01T06:00:00Z", polls_close_at: "2026-09-01T17:00:00Z" }
              as: BoardAgent
            - call: "GET /labor-relations/election-rounds"
              payload: { petition_id: "${pet_id}" }
              as: BoardAgent
              captures: { rnd_id: "$.data[0].id", rnd_ver: "$.data[0].version" }
            - call: "POST /labor-relations/poll-sessions"
              payload: { election_round_id: "${rnd_id}", location_code: "PLANT_1_CAFETERIA", session_start_at: "2026-09-01T06:00:00Z", session_end_at: "2026-09-01T09:00:00Z", method: "MANUAL", expected_election_round_version: "${rnd_ver}" }
              as: BoardAgent
              captures: { ps_a: $.data.id }
            - call: "GET /labor-relations/election-rounds/${rnd_id}"
              payload: {}
              as: BoardAgent
              captures: { rnd_ver2: $.data.version }
          trigger:
            - call: "POST /labor-relations/poll-sessions"
              payload: { election_round_id: "${rnd_id}", location_code: "PLANT_1_CAFETERIA", session_start_at: "2026-09-01T09:29:59Z", session_end_at: "2026-09-01T12:00:00Z", method: "MANUAL", expected_election_round_version: "${rnd_ver2}" }
              as: BoardAgent
            - call: "POST /labor-relations/poll-sessions"
              payload: { election_round_id: "${rnd_id}", location_code: "PLANT_1_CAFETERIA", session_start_at: "2026-09-01T09:30:00Z", session_end_at: "2026-09-01T12:00:00Z", method: "MANUAL", expected_election_round_version: "${rnd_ver2}" }
              as: BoardAgent
              captures: { ps_b: $.data.id }
            - call: "GET /labor-relations/election-rounds/${rnd_id}"
              payload: {}
              as: BoardAgent
              captures: { rnd_ver3: $.data.version }
            - call: "POST /labor-relations/poll-sessions"
              payload: { election_round_id: "${rnd_id}", location_code: "PLANT_1_ANNEX", session_start_at: "2026-09-01T06:00:00Z", session_end_at: "2026-09-01T09:00:00Z", method: "MANUAL", expected_election_round_version: "${rnd_ver3}" }
              as: BoardAgent
              captures: { ps_c: $.data.id }
          assert:
            - "first trigger call: 409 ERR_POLL_SESSION_LOCATION_CONFLICT (09:29:59 is one second inside the exclusive upper endpoint 09:30:00)"
            - "second trigger call: 201 (a start exactly at end + 30 minutes is admitted because the interval is half-open)"
            - "fourth trigger call: 201 for an identical 06:00-09:00 window at PLANT_1_ANNEX (the resource key includes location_code)"
            - "ElectionRound.${rnd_id}.scheduled_session_count == 3 (A, B and C; the rejected request wrote nothing)"
            - "PollSession.${ps_b}.session_start_at == 2026-09-01T09:30:00Z and PollSession.${ps_c}.location_code == PLANT_1_ANNEX"

      - name: presenter_calendar_closed_symmetric_buffer
        grounds:
          - validations[priority=22]
          - errors.ERR_PRESENTER_SCHEDULE_CONFLICT
          - constants.PRESENTER_TRAVEL_BUFFER_MINUTES
        resource: "Supervisor as presenter across meeting-channel CampaignCommunication rows"
        interval_semantics: "CLOSED and SYMMETRIC [planned_delivery_at - 60 minutes, planned_delivery_at + duration_minutes + 60 minutes]: BOTH endpoints are INCLUSIVE, so intervals that merely touch are in conflict"
        distinguishing_aspect: |
          The opposite endpoint convention from the poll-session rule, on a different resource: the
          padding is symmetric on both sides and the interval is closed, so a meeting whose padded
          start equals the previous padded end is REJECTED where the poll-session rule would have
          admitted it. One second later is admitted, and the check is scoped per presenter and only to
          meeting channels.
        test_recipe:
          setup:
            - "petition SCOPE_ANALYSIS with supervisors A and B, both TRAINED"
            - "message M1 presented by A at 2026-08-25T10:00:00Z for 60 minutes, so A is blocked over [09:00:00, 12:00:00] inclusive"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
