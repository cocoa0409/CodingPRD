      - name: credit_bracket_keyed_on_base_net_of_prior_applied_credits
        grounds:
          - calculations.cancellation_credit_amount
          - entities.CancellationCredit.fields.prior_applied_cents
          - entities.CancellationCredit.fields.billable_base_cents
          - entities.CancellationCredit.fields.notice_tier_pct
          - state_machines.CancellationCredit.transitions.APPROVED_to_APPLIED
          - state_machines.SampleShipment.transitions.IN_TRANSIT_to_SHORT
        distinguishing_aspect: |
          Two credits on the SAME event cross the NOTICE_BRACKET_SPLIT_CENTS
          50000 boundary in opposite directions because step 5 reads the
          output of step 3. Credit 1 (PRODUCT_SHORT) sees prior_applied_cents
          0, so billable_base_cents 52500 selects the HIGH bracket
          (GTE_72 0.25) and yields 52500 x 0.25 x 0.60 = 7875. After that
          credit is APPLIED, credit 2 (CLUB_CANCELLED) sees
          prior_applied_cents 7875, so billable_base_cents drops to 44625 and
          selects the LOW bracket (GTE_72 0.15) for 44625 x 0.15 x 1.00 =
          6694. Keeping the HIGH bracket on the net base gives 11156 and
          bracketing on the gross 52500 gives 13125 — both wrong.
        test_recipe:
          setup:
            - "Manufacturer M program_tier STANDARD; club C club_tier FLAGSHIP (multiplier 1.25); event on 2026-09-14 day_part MORNING (multiplier 1.00), event_type FOOD_SAMPLING, so the no-invoice gross base is ROUND_HALF_UP(42000 x 1.25 x 1.00) = 52500."
            - "Event CONFIRMED with requested_sample_cases 6 fully allocated; no EventInvoice ever created, so both credits fall to the ROUND_HALF_UP(base x multipliers) branch of step 2 and the first credit applies to Manufacturer.credit_note_balance_cents rather than to an invoice."
            - "Logical clock at 2026-09-10T09:00:00Z for both credits, and event_window_start_utc is 2026-09-14T09:00:00Z, so notice_hours is exactly 96 for both and the GTE_72 column is fixed — the only thing that changes between the two credits is the bracket."
            - "Shipment of 6 cases receives only 2, forking IN_TRANSIT -> SHORT and minting the PRODUCT_SHORT credit; that credit is APPROVEd by admin_controller so it reaches APPLIED before the cancellation."
