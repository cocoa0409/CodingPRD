# =============================================================================
# Charity Auction Item Procurement & Fulfillment — benchmark seed tables (v1)
# =============================================================================

scenario: |
  Charity Auction Item Procurement & Fulfillment (nonprofit gala committee): solicitation pipeline & donor tracking, item valuation & fair-market-value disclosure requirement, item packaging/bundling & minimum bid setting, catalog production & bidder registration, winning bid checkout & payment processing, certificate/experience fulfillment & expiration terms, unsold item disposition & donor acknowledgment, revenue vs contribution accounting split

domain_name: charity-auction-procurement
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # revenue vs contribution split with dual-variant rounding
  secondary_archetype: compliance_audit           # FMV disclosure tiers, SoD on valuation approval, ack thresholds
  complexity_layers:
    - optimistic_concurrency                      # OCC on GalaEvent / Item / Bundle versions
    - cascading_side_effects                      # close-bidding, refund, write-off, valuation-approve chains
    - dual_variant_calculation                    # AGGREGATE vs PRORATA split; as-of FMV variants
    - scheduled_deferred_actions                  # logical clock drives certificate expiry sweep
  entity_topology: flat                           # peer entities joined by FK references; FKs in request bodies
  state_machine_shape: parallel                   # Invoice payment_status x fulfillment_status; plus cyclic machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties               # valuation approver must differ from submitter
  consistency_model: immediate
  entity_count: 14
  endpoint_count: 58
  error_code_count: 34
  calculation_count: 8
  state_machine_count: 13
  role_count: 7

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: GalaEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Gala event name" }
      - { name: gala_date, type: string, source: input, description: "Event date ISO8601 date (YYYY-MM-DD)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SOLICITING | CATALOGING | BIDDING_OPEN | BIDDING_CLOSED | SETTLEMENT | RECONCILED", default: DRAFT }
      - { name: bidding_opens_at, type: datetime, source: input, description: "Informational bidding window open (must be < bidding_closes_at)" }
      - { name: bidding_closes_at, type: datetime, source: input, description: "Informational bidding window close" }
      - { name: min_bid_pct_bps, type: integer, source: input, description: "Minimum bid as basis points of bundle FMV (3000 = 30%)" }
      - { name: min_bid_increment_cents, type: integer, source: input, description: "Grid increment for rounding the minimum bid up" }
      - { name: min_bid_floor_cents, type: integer, source: input, description: "Absolute floor for any minimum bid" }
      - { name: bid_increment_tiers, type: array, source: input, description: "Array of {up_to_cents: integer|null, increment_cents: integer}; last tier up_to_cents null = top tier" }
      - { name: ack_threshold_cents, type: integer, source: input, description: "Minimum item FMV requiring a written donor acknowledgment" }
      - { name: solicitation_cooldown_days, type: integer, source: input, description: "Days after last sent solicitation before a donor may be solicited again for this event" }
      - { name: cert_validity_months, type: integer, source: input, description: "Certificate validity: calendar months from issue to expiry" }
      - { name: cert_grace_days, type: integer, source: input, description: "Days beyond expires_at within which a redemption's scheduled_end may fall" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Donor display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: donor_type, type: enum, source: input, description: "INDIVIDUAL | BUSINESS" }
      - { name: tax_id, type: string, source: input, description: "Optional tax identifier", constraints: "optional" }

  - name: Bidder
    parent: null
    common_fields: true
    fields:
      - { name: gala_event_id, type: string, source: input, description: "FK -> GalaEvent.id; bidder is registered to exactly one event" }
      - { name: full_name, type: string, source: input, description: "Bidder display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: paddle_no, type: integer, source: input, description: "Paddle number; unique within gala_event_id" }
      - { name: payment_method_on_file, type: boolean, source: input, description: "True when a card/check method is on file; required to place bids" }
      - { name: status, type: enum, source: system, description: "REGISTERED | SUSPENDED", default: REGISTERED }

  - name: Solicitation
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: input, description: "FK -> Donor.id" }
      - { name: gala_event_id, type: string, source: input, description: "FK -> GalaEvent.id" }
      - { name: ask_description, type: string, source: input, description: "What was requested from the donor" }
      - { name: ask_estimate_cents, type: integer, source: input, description: "Committee estimate of ask value" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | REVISED | PLEDGED | STALLED | DECLINED | WITHDRAWN | FULFILLED", default: DRAFT }
      - { name: last_sent_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent DRAFT/REVISED/STALLED -> SENT transition; null until first send" }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: solicitation_id, type: string, source: input, description: "FK -> Solicitation.id; solicitation must be PLEDGED at receipt" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; copied from solicitation at receipt" }
      - { name: gala_event_id, type: string, source: system, description: "FK -> GalaEvent.id; copied from solicitation at receipt; rewritten by rollover" }
      - { name: bundle_id, type: string, source: system, description: "FK -> Bundle.id; null until attached; nulled on detach/rollover", constraints: "nullable" }
      - { name: title, type: string, source: input, description: "Item title" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: kind, type: enum, source: input, description: "PHYSICAL | EXPERIENCE" }
      - { name: status, type: enum, source: system, description: "RECEIVED | VALUED | BUNDLED | CATALOGED | SOLD | UNSOLD | RETURNED_TO_DONOR | DISCARDED", default: RECEIVED }
      - { name: current_fmv_cents, type: integer, source: computed, description: "FMV of the latest APPROVED valuation; null until first approval", constraints: "nullable" }
      - { name: disclosure_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH from disclosure_tier calc; null until first approval", constraints: "nullable" }

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id" }
      - { name: fmv_cents, type: integer, source: input, description: "Fair market value in cents; must be >= 1" }
      - { name: fmv_source, type: enum, source: input, description: "DONOR_DECLARED | APPRAISAL | COMPARABLE_SALE" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | SUPERSEDED", default: SUBMITTED }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting ProcurementOfficer" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approver/rejecter; null until decided", constraints: "nullable" }

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - { name: gala_event_id, type: string, source: input, description: "FK -> GalaEvent.id" }
      - { name: title, type: string, source: input, description: "Catalog display title" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SOLD | UNSOLD | SETTLED | DISPOSITIONED", default: DRAFT }
      - { name: bundle_fmv_cents, type: integer, source: computed, description: "Sum of member items' current_fmv_cents; recomputed on attach/detach while DRAFT; frozen at publish" }
      - { name: min_bid_cents, type: integer, source: computed, description: "Derived by minimum_bid_cents calc at publish; may be overridden via PATCH min-bid while event <= CATALOGING", constraints: "nullable" }
      - { name: min_bid_overridden, type: boolean, source: system, description: "True once PATCH min-bid succeeds", default: false }
      - { name: current_high_bid_cents, type: integer, source: computed, description: "Amount of the current ACTIVE/WINNER bid; null when no bids", constraints: "nullable" }
      - { name: published_at, type: datetime, source: system, description: "Logical-clock timestamp of publish", constraints: "nullable" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: bundle_id, type: string, source: input, description: "FK -> Bundle.id (path)" }
      - { name: bidder_id, type: string, source: system, description: "FK -> Bidder.id; from X-User-ID of Bidder role" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount; must satisfy min_next_bid_cents" }
      - { name: placed_at, type: datetime, source: system, description: "Logical-clock timestamp of placement" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUTBID | WINNER | VOID (at most one ACTIVE per bundle: each accepted bid outbids the previous, so at close the single ACTIVE bid becomes WINNER)", default: ACTIVE }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: gala_event_id, type: string, source: system, description: "FK -> GalaEvent.id; from bundle" }
      - { name: bundle_id, type: string, source: system, description: "FK -> Bundle.id" }
      - { name: bidder_id, type: string, source: system, description: "FK -> Bidder.id; winning bidder" }
      - { name: winning_bid_cents, type: integer, source: system, description: "Winning bid amount pinned at close" }
      - { name: pinned_bundle_fmv_cents, type: integer, source: system, description: "Bundle FMV pinned at close; basis for the AGGREGATE split" }
      - { name: revenue_portion_cents, type: integer, source: computed, description: "min(winning_bid_cents, pinned_bundle_fmv_cents) — AGGREGATE variant" }
      - { name: contribution_portion_cents, type: integer, source: computed, description: "max(0, winning_bid_cents - pinned_bundle_fmv_cents) — AGGREGATE variant" }
      - { name: contribution_prorata_cents, type: integer, source: computed, description: "PRORATA variant: per-line round_half_up allocations, sum of per-line excess; disclosure estimate only" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum(SUCCEEDED payments) - Sum(REFUNDED payments) per invoice_outstanding_cents calc" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIALLY_PAID | PAID | REFUNDED | WRITTEN_OFF", default: UNPAID }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING | READY | FULFILLED | EXPIRED | VOIDED — parallel dimension, independent of payment_status", default: PENDING }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id (path)" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount; must be >= 1 and <= outstanding balance" }
      - { name: method, type: enum, source: input, description: "CARD | CHECK" }
      - { name: status, type: enum, source: system, description: "INITIATED | SUCCEEDED | FAILED | REFUNDED", default: INITIATED }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; created for bundles containing >= 1 EXPERIENCE item" }
      - { name: certificate_code, type: string, source: system, description: "Human-facing code CERT-<8 hex>, unique" }
      - { name: status, type: enum, source: system, description: "PENDING_ISSUE | ISSUED | REDEEMED | EXPIRED | VOIDED", default: PENDING_ISSUE }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time when invoice reached PAID", constraints: "nullable" }
      - { name: valid_from, type: datetime, source: system, description: "Redemption window open; equals issued_at", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + cert_validity_months calendar months; redemption allowed while now <= expires_at (closed)", constraints: "nullable" }
      - { name: grace_end_at, type: datetime, source: system, description: "expires_at + cert_grace_days; latest allowed scheduled_end", constraints: "nullable" }
      - { name: redeemed_at, type: datetime, source: system, description: "Logical-clock time of redemption", constraints: "nullable" }
      - { name: scheduled_start, type: datetime, source: system, description: "Experience window start committed at redemption", constraints: "nullable" }
      - { name: scheduled_end, type: datetime, source: system, description: "Experience window end committed at redemption", constraints: "nullable" }

  - name: BlackoutWindow
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> Item.id (path); item must be kind=EXPERIENCE" }
      - { name: starts_at, type: datetime, source: input, description: "Blackout start; half-open interval [starts_at, ends_at)" }
      - { name: ends_at, type: datetime, source: input, description: "Blackout end (exclusive); must be > starts_at" }
      - { name: label, type: string, source: input, description: "Reason label", constraints: "optional" }

  - name: Disposition
    parent: null
    common_fields: true
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> Item.id; the unsold item under disposition" }
      - { name: gala_event_id, type: string, source: system, description: "FK -> GalaEvent.id; event of origin (unchanged by rollover)" }
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; donor who must respond" }
      - { name: decision, type: enum, source: input, description: "RETURN_TO_DONOR | ROLLOVER | DISCARD; null until decided; cleared back to null on donor decline", constraints: "nullable" }
      - { name: target_gala_event_id, type: string, source: input, description: "FK -> GalaEvent.id; required iff decision=ROLLOVER", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "PROPOSED | DONOR_NOTIFIED | EXECUTED", default: PROPOSED }

  - name: DonorAcknowledgment
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id" }
      - { name: gala_event_id, type: string, source: system, description: "FK -> GalaEvent.id" }
      - { name: item_id, type: string, source: system, description: "FK -> Item.id" }
      - { name: kind, type: enum, source: system, description: "DONATION_RECEIPT", default: DONATION_RECEIPT }
      - { name: fmv_cents, type: integer, source: computed, description: "FMV as of acknowledgment issuance (latest APPROVED valuation); refreshed while PENDING, frozen at ISSUED" }
      - { name: disclosure_tier, type: enum, source: computed, description: "LOW | MEDIUM | HIGH snapshot from fmv_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | ISSUED | VOIDED", default: PENDING }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock time of issuance", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GalaEvent
    field: status
    initial_state: DRAFT
    terminal_states: [RECONCILED]
    transitions:
      - from: DRAFT
        to: SOLICITING
        trigger: "POST /gala-events/{id}/advance"
        actor: GalaAdmin
        preconditions: []
        side_effects: []
      - from: SOLICITING
        to: CATALOGING
        trigger: "POST /gala-events/{id}/advance"
        actor: GalaAdmin
        preconditions: []
        side_effects: []
      - from: CATALOGING
        to: BIDDING_OPEN
        trigger: "POST /gala-events/{id}/advance"
        actor: GalaAdmin
        preconditions:
          - "At least one Bundle with status=PUBLISHED exists for this event (ERR_NO_PUBLISHED_BUNDLES)"
        side_effects: []
      - from: BIDDING_OPEN
        to: BIDDING_CLOSED
        trigger: "POST /gala-events/{id}/advance"
        actor: GalaAdmin
        preconditions: []
        side_effects:
          - "CLOSE CASCADE hop 1: for each Bundle status=PUBLISHED of this event, in published_at ASC order (tie-break created_at ASC): if it has >= 1 Bid status=ACTIVE -> Bundle SOLD; else -> Bundle UNSOLD"
          - "Hop 2 (sold path): the single remaining ACTIVE bid -> WINNER (all earlier bids are already OUTBID because each accepted bid strictly exceeds the previous high)"
          - "Hop 3 (sold path): create Invoice for the WINNER bid (winning_bid_cents = bid amount; pinned_bundle_fmv_cents = bundle.bundle_fmv_cents; revenue/contribution split per revenue_contribution_split AGGREGATE; payment_status=UNPAID; fulfillment_status=PENDING)"
          - "Hop 4 (sold path): if the sold bundle contains >= 1 Item kind=EXPERIENCE, create Certificate status=PENDING_ISSUE for that invoice"
          - "Hop 2 (unsold path): each member Item of an UNSOLD bundle -> UNSOLD (from CATALOGED)"
          - "Hop 3 (unsold path): create one Disposition status=PROPOSED per member item (decision=null)"
      - from: BIDDING_CLOSED
        to: SETTLEMENT
        trigger: "POST /gala-events/{id}/advance"
        actor: GalaAdmin
        preconditions: []
        side_effects: []
      - from: SETTLEMENT
        to: RECONCILED
        trigger: "POST /gala-events/{id}/reconcile"
        actor: FinanceOfficer
        preconditions:
          - "Every Invoice of this event has payment_status IN {PAID, REFUNDED, WRITTEN_OFF}"
          - "Every Invoice with payment_status=PAID has fulfillment_status IN {FULFILLED, EXPIRED}"
          - "Every Disposition of this event has status=EXECUTED (ERR_RECONCILE_BLOCKED otherwise)"
        side_effects: []

  - entity: Bidder
    field: status
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /bidders/{id}/status {status: SUSPENDED}"
        actor: GalaAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /bidders/{id}/status {status: REGISTERED}"
        actor: GalaAdmin
        preconditions: []
        side_effects: []

  - entity: Solicitation
    field: status
    initial_state: DRAFT
    terminal_states: [DECLINED, WITHDRAWN, FULFILLED]
    transitions:
      - from: [DRAFT, REVISED, STALLED]
        to: SENT
        trigger: "POST /solicitations/{id}/send"
        actor: ProcurementOfficer
        preconditions:
          - "Solicitation's event status IN {SOLICITING, CATALOGING} (ERR_EVENT_PHASE_FORBIDDEN)"
          - "Donor cooldown: no other Solicitation for the same (donor_id, gala_event_id) with last_sent_at such that last_sent_at <= now < last_sent_at + solicitation_cooldown_days (ERR_SOLICITATION_COOLDOWN); a solicitation may always re-send itself"
        side_effects:
          - "last_sent_at := logical clock now"
      - from: SENT
        to: REVISED
        trigger: "POST /solicitations/{id}/revise"
        actor: ProcurementOfficer
        preconditions: []
        side_effects:
          - "ask_description / ask_estimate_cents replaced by payload values"
        note: "Revision loop: SENT -> REVISED -> SENT is a genuine cycle; each re-send refreshes last_sent_at and re-arms the donor cooldown"
      - from: SENT
        to: PLEDGED
        trigger: "POST /solicitations/{id}/record-response {outcome: PLEDGED}"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []
      - from: SENT
        to: DECLINED
        trigger: "POST /solicitations/{id}/record-response {outcome: DECLINED}"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []
      - from: SENT
        to: STALLED
        trigger: "POST /solicitations/{id}/record-response {outcome: STALLED}"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []
      - from: [DRAFT, SENT, REVISED, STALLED]
        to: WITHDRAWN
        trigger: "POST /solicitations/{id}/record-response {outcome: WITHDRAWN}"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []
      - from: PLEDGED
        to: FULFILLED
        trigger: "POST /items {solicitation_id} (item receipt)"
        actor: ProcurementOfficer
        preconditions:
          - "Solicitation's event status IN {SOLICITING, CATALOGING} (ERR_EVENT_PHASE_FORBIDDEN)"
          - "Solicitation status == PLEDGED (ERR_SOLICITATION_NOT_PLEDGED)"
        side_effects:
          - "Item created status=RECEIVED with donor_id/gala_event_id copied from the solicitation"

  - entity: Item
    field: status
    initial_state: RECEIVED
    terminal_states: [RETURNED_TO_DONOR, DISCARDED]
    transitions:
      - from: RECEIVED
        to: VALUED
        trigger: "POST /items/{id}/valuations -> POST /valuations/{vid}/approve (first APPROVED valuation)"
        actor: ValuationApprover
        preconditions:
          - "Approved valuation exists and item has no prior APPROVED valuation"
        side_effects:
          - "Item.current_fmv_cents := valuation.fmv_cents; Item.disclosure_tier := disclosure_tier calc"
          - "Create DonorAcknowledgment status=PENDING (kind=DONATION_RECEIPT, fmv_cents := current_fmv_cents, disclosure_tier snapshot)"
      - from: [VALUED, BUNDLED, CATALOGED, SOLD, UNSOLD]
        to: VALUED
        trigger: "POST /valuations/{vid}/approve (re-valuation: a later valuation is APPROVED)"
        actor: ValuationApprover
        preconditions:
          - "Item status IN {VALUED, BUNDLED, CATALOGED, SOLD, UNSOLD} (re-valuation blocked only once item is terminally dispositioned)"
        side_effects:
          - "SELF-LOOP: the item's status is unchanged (a BUNDLED item stays BUNDLED); only valuation-derived fields change"
          - "Item.current_fmv_cents := new valuation.fmv_cents; disclosure_tier recomputed"
          - "If the item's DonorAcknowledgment is PENDING: its fmv_cents/disclosure_tier refreshed to the new approval (AS_OF_ISSUE variant)"
          - "If the item's DonorAcknowledgment is ISSUED: it -> VOIDED and a new PENDING acknowledgment is created carrying the new FMV"
          - "If the item is BUNDLED in a bundle still DRAFT: that bundle's bundle_fmv_cents is recomputed; a PUBLISHED bundle's frozen bundle_fmv_cents and min_bid_cents do NOT change"
      - from: VALUED
        to: BUNDLED
        trigger: "POST /bundles/{id}/items {item_id}"
        actor: CatalogManager
        preconditions:
          - "Bundle status == DRAFT"
          - "Event status == CATALOGING (ERR_CATALOG_FROZEN if BIDDING_OPEN or later)"
          - "Item status == VALUED (ERR_ITEM_NOT_VALUED)"
          - "Item.bundle_id is null (ERR_ITEM_ALREADY_BUNDLED)"
          - "Item.gala_event_id == bundle.gala_event_id"
        side_effects:
          - "Item.bundle_id := bundle; bundle_fmv_cents recomputed as sum of member current_fmv_cents"
      - from: BUNDLED
        to: VALUED
        trigger: "DELETE /bundles/{id}/items/{item_id}"
        actor: CatalogManager
        preconditions:
          - "Bundle status == DRAFT"
          - "Event status == CATALOGING (ERR_CATALOG_FROZEN)"
        side_effects:
          - "Item.bundle_id := null; bundle_fmv_cents recomputed"
      - from: BUNDLED
        to: CATALOGED
        trigger: "POST /bundles/{id}/publish"
        actor: CatalogManager
        preconditions:
          - "Bundle has >= 1 member item (ERR_BUNDLE_EMPTY)"
          - "Event status == CATALOGING (ERR_CATALOG_FROZEN)"
        side_effects:
          - "Bundle.bundle_fmv_cents frozen; Bundle.min_bid_cents := minimum_bid_cents calc; published_at := now"
      - from: CATALOGED
        to: SOLD
        trigger: "system (event advance BIDDING_OPEN -> BIDDING_CLOSED, bundle had >= 1 ACTIVE bid)"
        actor: system
        preconditions: []
        side_effects: ["See GalaEvent close cascade (invoice + certificate creation)"]
      - from: CATALOGED
        to: UNSOLD
        trigger: "system (event advance BIDDING_OPEN -> BIDDING_CLOSED, bundle had 0 ACTIVE bids)"
        actor: system
        preconditions: []
        side_effects: ["Disposition PROPOSED created for this item"]
      - from: SOLD
        to: UNSOLD
        trigger: "system (invoice refunded or written off)"
        actor: system
        preconditions: []
        side_effects: ["Disposition PROPOSED created for this item"]
      - from: UNSOLD
        to: RETURNED_TO_DONOR
        trigger: "system (disposition EXECUTED with decision=RETURN_TO_DONOR)"
        actor: system
        preconditions: []
        side_effects:
          - "Item's DonorAcknowledgment (PENDING or ISSUED) -> VOIDED; returned items receive no gift acknowledgment"
      - from: UNSOLD
        to: VALUED
        trigger: "system (disposition EXECUTED with decision=ROLLOVER)"
        actor: system
        preconditions: []
        side_effects:
          - "Rollover cycle: item.gala_event_id := target_gala_event_id; bundle_id := null; status re-enters VALUED under the target event (path CATALOGED -> UNSOLD -> VALUED)"
          - "Original DonorAcknowledgment -> VOIDED; a new PENDING acknowledgment is created under the target event carrying current FMV"
        note: "The item row persists and remains active under the new event; the ROLLOVER outcome is recorded on the disposition (status=EXECUTED, decision=ROLLOVER)"
      - from: UNSOLD
        to: DISCARDED
        trigger: "system (disposition EXECUTED with decision=DISCARD)"
        actor: system
        preconditions: []
        side_effects:
          - "DonorAcknowledgment unchanged (gift completed; disposal noted); remains issuable"

  - entity: Valuation
    field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /valuations/{id}/approve"
        actor: ValuationApprover
        preconditions:
          - "Segregation of duties: decided_by (X-User-ID) != valuation.submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Item.current_fmv_cents / disclosure_tier updated; Item RECEIVED -> VALUED on first approval"
          - "DonorAcknowledgment create/refresh/void+recreate per Item transitions above"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /valuations/{id}/reject"
        actor: ValuationApprover
        preconditions:
          - "Segregation of duties: decided_by (X-User-ID) != valuation.submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new valuation is submitted for the same item via POST /items/{id}/valuations)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Bundle
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, DISPOSITIONED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /bundles/{id}/publish"
        actor: CatalogManager
        preconditions:
          - ">= 1 member item (ERR_BUNDLE_EMPTY)"
          - "Event status == CATALOGING (ERR_CATALOG_FROZEN)"
        side_effects:
          - "bundle_fmv_cents frozen; min_bid_cents computed (minimum_bid_cents calc); published_at := now"
          - "Member items BUNDLED -> CATALOGED"
      - from: PUBLISHED
        to: SOLD
        trigger: "system (event close cascade, >= 1 ACTIVE bid)"
        actor: system
        preconditions: []
        side_effects: ["Winner bid transition; Invoice created; Certificate created if any EXPERIENCE member"]
      - from: PUBLISHED
        to: UNSOLD
        trigger: "system (event close cascade, 0 ACTIVE bids)"
        actor: system
        preconditions: []
        side_effects: ["Member items CATALOGED -> UNSOLD; Disposition PROPOSED per item"]
      - from: SOLD
        to: UNSOLD
        trigger: "system (invoice REFUNDED or WRITTEN_OFF)"
        actor: system
        preconditions: []
        side_effects: ["Member items SOLD -> UNSOLD; Disposition PROPOSED per item"]
        note: "Compensation revert: refund/write-off re-opens the bundle for disposition"
      - from: SOLD
        to: SETTLED
        trigger: "system (invoice payment_status=PAID AND fulfillment_status IN {FULFILLED, EXPIRED})"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNSOLD
        to: DISPOSITIONED
        trigger: "system (bubble-up: every member item's latest Disposition is EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Bid
    field: status
    initial_state: ACTIVE
    terminal_states: [OUTBID, VOID]
    transitions:
      - from: ACTIVE
        to: OUTBID
        trigger: "system (a higher bid is placed on the same bundle)"
        actor: system
        preconditions: []
        side_effects: ["Bundle.current_high_bid_cents := new bid amount"]
      - from: ACTIVE
        to: WINNER
        trigger: "system (event close cascade: the bundle's single remaining ACTIVE bid)"
        actor: system
        preconditions: []
        side_effects: ["Invoice created for this bid"]
      - from: WINNER
        to: VOID
        trigger: "system (invoice refunded or written off)"
        actor: system
        preconditions: []
        side_effects: ["Bundle SOLD -> UNSOLD; member items SOLD -> UNSOLD; Dispositions created"]

  - entity: Invoice
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED, WRITTEN_OFF]
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "system (payment SUCCEEDED with amount < outstanding)"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents recomputed per invoice_outstanding_cents"]
      - from: [UNPAID, PARTIALLY_PAID]
        to: PAID
        trigger: "system (payment SUCCEEDED covering the full outstanding balance)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfillment_status PENDING -> READY"
          - "Certificate (if any) PENDING_ISSUE -> ISSUED: issued_at/valid_from := now; expires_at := now + cert_validity_months; grace_end_at := expires_at + cert_grace_days"
      - from: PAID
        to: REFUNDED
        trigger: "POST /invoices/{id}/refund"
        actor: FinanceOfficer
        preconditions:
          - "payment_status == PAID (ERR_REFUND_FORBIDDEN otherwise)"
          - "Certificate (if any) status != REDEEMED (ERR_REFUND_FORBIDDEN: redeemed experiences cannot be refunded)"
        side_effects:
          - "Every Payment status=SUCCEEDED of this invoice -> REFUNDED (amount_paid_cents recomputes to 0)"
          - "fulfillment_status -> VOIDED"
          - "Certificate (if any) ISSUED/PENDING_ISSUE -> VOIDED"
          - "WINNER bid -> VOID; Bundle SOLD -> UNSOLD; member Items SOLD -> UNSOLD; one Disposition PROPOSED created per member item"
      - from: UNPAID
        to: WRITTEN_OFF
        trigger: "POST /invoices/{id}/write-off"
        actor: FinanceOfficer
        preconditions:
          - "payment_status == UNPAID (ERR_WRITEOFF_FORBIDDEN for PARTIALLY_PAID or PAID)"
        side_effects:
          - "fulfillment_status -> VOIDED"
          - "Certificate (if any) PENDING_ISSUE -> VOIDED"
          - "WINNER bid -> VOID; Bundle SOLD -> UNSOLD; member Items SOLD -> UNSOLD; one Disposition PROPOSED created per member item"

  - entity: Invoice
    field: fulfillment_status
    initial_state: PENDING
    terminal_states: [FULFILLED, EXPIRED, VOIDED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "system (payment_status reaches PAID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: FULFILLED
        trigger: "POST /invoices/{id}/fulfill (physical bundle) OR system (certificate REDEEMED)"
        actor: GalaAdmin
        preconditions:
          - "fulfillment requires payment_status == PAID (ERR_INVALID_STATE otherwise)"
        side_effects: ["Bundle SOLD -> SETTLED (bubble-up)"]
      - from: READY
        to: EXPIRED
        trigger: "system (linked Certificate ISSUED -> EXPIRED by clock sweep)"
        actor: system
        preconditions: []
        side_effects: ["Bundle SOLD -> SETTLED (bubble-up)"]
      - from: [PENDING, READY]
        to: VOIDED
        trigger: "system (invoice REFUNDED or WRITTEN_OFF)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Payment
    field: status
    initial_state: INITIATED
    terminal_states: [FAILED, REFUNDED]
    transitions:
      - from: INITIATED
        to: SUCCEEDED
        trigger: "POST /_payments/simulate {outcome: SUCCEEDED}"
        actor: GalaAdmin
        preconditions: []
        side_effects: ["Invoice.amount_paid_cents recomputed; payment_status may advance; on PAID the fulfillment/certificate cascade fires"]
      - from: INITIATED
        to: FAILED
        trigger: "POST /_payments/simulate {outcome: FAILED}"
        actor: GalaAdmin
        preconditions: []
        side_effects: ["No invoice mutation; a new Payment may be created"]
      - from: SUCCEEDED
        to: REFUNDED
        trigger: "system (invoice refund)"
        actor: system
        preconditions: []
        side_effects: ["amount_paid_cents recomputed"]

  - entity: Certificate
    field: status
    initial_state: PENDING_ISSUE
    terminal_states: [REDEEMED, EXPIRED, VOIDED]
    transitions:
      - from: PENDING_ISSUE
        to: ISSUED
        trigger: "system (invoice reaches PAID)"
        actor: system
        preconditions: []
        side_effects: ["issued_at/valid_from/expires_at/grace_end_at populated per certificate_validity_window calc"]
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /certificates/{id}/redeem {scheduled_start, scheduled_end}"
        actor: Bidder
        preconditions:
          - "Acting bidder owns the invoice (ERR_OWNERSHIP_VIOLATION)"
          - "now <= expires_at (closed bound; post-sweep EXPIRED state rejects with ERR_CERTIFICATE_NOT_REDEEMABLE)"
          - "valid_from <= scheduled_start AND scheduled_start < scheduled_end AND scheduled_end <= grace_end_at (ERR_REDEMPTION_WINDOW_INVALID)"
          - "No overlap with any BlackoutWindow of any EXPERIENCE member item, half-open intersection (ERR_BLACKOUT_CONFLICT)"
        side_effects:
          - "redeemed_at := now; scheduled window stored"
          - "Invoice fulfillment_status READY -> FULFILLED; Bundle SOLD -> SETTLED (bubble-up)"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (POST /_clock/set_current_utc sweep: now > expires_at)"
        actor: system
        preconditions: []
        side_effects: ["Invoice fulfillment_status READY -> EXPIRED; Bundle SOLD -> SETTLED (bubble-up)"]
      - from: [PENDING_ISSUE, ISSUED]
        to: VOIDED
        trigger: "system (invoice refunded or written off)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Disposition
    field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED]
    transitions:
      - from: PROPOSED
        to: DONOR_NOTIFIED
        trigger: "POST /dispositions/{id}/decide {decision, target_gala_event_id?}"
        actor: GalaAdmin
        preconditions:
          - "decision IN {RETURN_TO_DONOR, ROLLOVER, DISCARD}"
          - "If ROLLOVER: target_gala_event_id required, != source event, and target status IN {DRAFT, SOLICITING, CATALOGING} (ERR_ROLLOVER_TARGET_INVALID)"
        side_effects: []
      - from: DONOR_NOTIFIED
        to: EXECUTED
        trigger: "POST /dispositions/{id}/donor-response {accept: true}"
        actor: Donor
        preconditions:
          - "Acting donor's X-User-ID == disposition.donor_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "Item UNSOLD -> RETURNED_TO_DONOR | VALUED (rollover into target event) | DISCARDED per decision"
          - "DonorAcknowledgment side effects per decision (void / void+recreate / unchanged) per Item transitions"
          - "Bundle bubble-up: when every member item disposition is EXECUTED, bundle UNSOLD -> DISPOSITIONED"
      - from: DONOR_NOTIFIED
        to: PROPOSED
        trigger: "POST /dispositions/{id}/donor-response {accept: false}"
        actor: Donor
        preconditions:
          - "Acting donor's X-User-ID == disposition.donor_id (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "decision := null; target_gala_event_id := null (reconsideration cycle)"

  - entity: DonorAcknowledgment
    field: status
    initial_state: PENDING
    terminal_states: [ISSUED, VOIDED]
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /acknowledgments/{id}/issue"
        actor: FinanceOfficer
        preconditions:
          - "fmv_cents >= event.ack_threshold_cents (>= semantics; ERR_ACK_THRESHOLD_NOT_MET below)"
        side_effects:
          - "fmv_cents/disclosure_tier frozen; issued_at := now"
      - from: [PENDING, ISSUED]
        to: VOIDED
        trigger: "POST /acknowledgments/{id}/void OR system (item returned / rolled over / re-valuation after issue)"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: gala-settings-stale-version
    parent_entity: GalaEvent
    write_endpoint: "PATCH /gala-events/{id}"
    occ_field: "expected_gala_event_version"
    description: |
      Updating gala settings against a GalaEvent whose version has advanced since
      the client last observed it is rejected. The second writer's view of the
      configuration is stale even though both updates would individually be valid.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: valuation-supersede-stale-item
    parent_entity: Item
    write_endpoint: "POST /items/{id}/valuations"
    occ_field: "expected_item_version"
    description: |
      Submitting a valuation supersedes any SUBMITTED valuation on the item; doing
      so against an Item whose version has advanced since the client last observed
      it is rejected, since the prior submit may itself have superseded a valuation
      the client believed was still pending.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: min-bid-override-stale-bundle
    parent_entity: Bundle
    write_endpoint: "PATCH /bundles/{id}/min-bid"
    occ_field: "expected_bundle_version"
    description: |
      Overriding the minimum bid against a Bundle whose version has advanced since
      the client last observed it is rejected (e.g., the computed minimum changed
      when the bundle was re-published after a detach).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bid-placement-stale-bundle
    parent_entity: Bundle
    write_endpoint: "POST /bundles/{id}/bids"
    occ_field: "expected_bundle_version"
    description: |
      Placing a bid against a Bundle whose version has advanced since the client
      last observed it is rejected: the client's view of current_high_bid_cents
      predates a newer accepted bid, so the amount decision was made on stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: minimum_bid_cents
    trigger: "POST /bundles/{id}/publish (locked value); GET /bundles/{id} while DRAFT shows the preview variant"
    algorithm: threshold
    formula: |
      raw_cents = round_half_up(bundle_fmv_cents * event.min_bid_pct_bps / 10000)   # step 1: bps multiply, round to cents FIRST
      floored   = max(raw_cents, event.min_bid_floor_cents)                          # step 2: apply floor AFTER rounding
      min_bid   = ceil(floored / event.min_bid_increment_cents) * event.min_bid_increment_cents   # step 3: round UP to grid LAST
      Rounding order is pinned: bps-round (half-up) -> floor -> ceil-to-grid. Any other order
      (e.g., floor before bps-round, or grid before floor) yields different cents and is WRONG.
    input_set: "Member items of the bundle with an APPROVED valuation (bundle_fmv_cents as frozen/current); event config"
    constants: {}
    precision: "integer cents; round_half_up at step 1; ceiling at step 3"
    variants:
      - name: PREVIEW
        when: "Bundle in DRAFT: computed on the fly from current member FMVs; changes as valuations are approved or items attach/detach"
        difference: "Reflects un-frozen bundle_fmv_cents"
      - name: LOCKED
        when: "At publish: computed once from the frozen bundle_fmv_cents and stored on min_bid_cents"
        difference: "Valuation changes after publish do NOT change the locked value; PREVIEW and LOCKED diverge whenever a valuation is approved between preview and publish"

  - name: min_next_bid_cents
    trigger: "POST /bundles/{id}/bids (validation of amount_cents)"
    algorithm: tiered_pricing
    formula: |
      if no Bid with status=ACTIVE exists for the bundle:
          min_next = bundle.min_bid_cents
      else:
          high = bundle.current_high_bid_cents
          tier = first element of event.bid_increment_tiers where tier.up_to_cents is null OR high < tier.up_to_cents
          min_next = high + tier.increment_cents
      Boundary semantics: tier selection uses STRICT < — a current high exactly equal to
      up_to_cents belongs to the NEXT tier (high = 100000 with tier up_to 100000 uses the
      5000-increment tier, so min_next = 105000). Acceptance uses >= : amount_cents >= min_next.
    input_set: "Bundle.min_bid_cents; current ACTIVE bid; event.bid_increment_tiers"
    constants: {}
    precision: "integer cents"

  - name: revenue_contribution_split
    trigger: "Invoice creation during the close cascade"
    algorithm: aggregation
    formula: |
      AGGREGATE variant (authoritative, stored on invoice):
        revenue_portion_cents      = min(winning_bid_cents, pinned_bundle_fmv_cents)
        contribution_portion_cents = max(0, winning_bid_cents - pinned_bundle_fmv_cents)
      Quid-pro-quo threshold: a winning bid exactly equal to FMV yields contribution 0
      (boundary: contribution exists only when winning_bid_cents > pinned_bundle_fmv_cents,
      STRICTLY greater).
      PRORATA variant (disclosure estimate, stored as contribution_prorata_cents):
        evaluation order is pinned: (1) F = pinned_bundle_fmv_cents; (2) for each member item i
        with approved fmv_i at close: alloc_i = round_half_up(winning_bid_cents * fmv_i / F);
        (3) per-line contribution_i = max(0, alloc_i - fmv_i); (4) total = sum(contribution_i).
        Per-line rounding is NOT reconciled back to the bid (sum of alloc_i may differ from
        winning_bid_cents by a cent); this is the documented donor-facing estimate.
      The two variants diverge by rounding placement: e.g. FMVs 33333/33333/33334 with
      winning bid 150000 -> AGGREGATE contribution 50000, PRORATA contribution 50001.
    input_set: "WINNER bid, bundle member items with their approved fmv_cents at close, pinned_bundle_fmv_cents"
    constants: {}
    precision: "integer cents; round_half_up per line in PRORATA"
    variants:
      - name: AGGREGATE
        when: "Revenue recognition, invoice display, payment accounting"
        difference: "Single subtraction at bundle level"
      - name: PRORATA
        when: "Per-item disclosure estimate (contribution_prorata_cents)"
        difference: "Per-line round_half_up allocation without remainder reconciliation; may differ from AGGREGATE by cents"

  - name: acknowledgment_fmv_cents
    trigger: "DonorAcknowledgment creation (first valuation approval), refresh while PENDING (re-valuation), freeze at issue"
    algorithm: chronological
    formula: |
      AS_OF_ISSUE variant (authoritative for acknowledgments):
        fmv_cents = fmv_cents of the item's latest APPROVED valuation as of the moment of issue
        (or as of now while PENDING — the PENDING value tracks re-valuations).
      PINNED_AT_SALE variant (used by invoices, shown for contrast):
        pinned_bundle_fmv_cents = bundle_fmv_cents frozen at publish and copied to the invoice at close.
      Divergence: when a re-valuation is approved after publish/close, AS_OF_ISSUE reflects the new
      FMV while PINNED_AT_SALE keeps the old one (e.g., 45000 vs 40000).
    input_set: "Item's Valuation rows with status=APPROVED, ordered by updated_at ASC (latest wins)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: AS_OF_ISSUE
        when: "DonorAcknowledgment.fmv_cents"
        difference: "Tracks latest APPROVED valuation until issue"
      - name: PINNED_AT_SALE
        when: "Invoice.pinned_bundle_fmv_cents"
        difference: "Frozen at bundle publish; immune to later re-valuation"

  - name: certificate_validity_window
    trigger: "Certificate issuance (invoice reaches PAID)"
    algorithm: threshold
    formula: |
      issued_at   = logical clock now
      valid_from  = issued_at
      expires_at  = issued_at + event.cert_validity_months calendar months (same day-of-month; time-of-day preserved)
      grace_end_at = expires_at + event.cert_grace_days days
      Redemption temporal rules:
        redeemable while now <= expires_at (CLOSED bound: at exactly expires_at redemption succeeds)
        expiry sweep (on POST /_clock/set_current_utc): ISSUED certificates with now > expires_at -> EXPIRED (STRICT >)
        scheduled window containment (CLOSED): valid_from <= scheduled_start AND scheduled_start < scheduled_end
          AND scheduled_end <= grace_end_at — a scheduled_end exactly equal to grace_end_at is allowed.
    input_set: "Certificate, event certificate config, logical clock"
    constants: {}
    precision: "datetime, second precision"

  - name: disclosure_tier
    trigger: "Valuation approval (item + acknowledgment snapshots)"
    algorithm: threshold
    formula: |
      tier = LOW    if fmv_cents < 100000
           = MEDIUM if 100000 <= fmv_cents <= 500000
           = HIGH   if fmv_cents > 500000
      Boundaries: fmv 99999 -> LOW; 100000 -> MEDIUM; 500000 -> MEDIUM; 500001 -> HIGH.
    input_set: "Approved fmv_cents"
    constants:
      TIER_MEDIUM_FLOOR_CENTS: 100000
      TIER_HIGH_FLOOR_CENTS: 500000
    precision: "integer cents"

  - name: invoice_outstanding_cents
    trigger: "Payment creation (validation), payment simulation, refund"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(p.amount_cents for p in payments where status = SUCCEEDED)
                        - sum(p.amount_cents for p in payments where status = REFUNDED)
      outstanding_cents = winning_bid_cents - amount_paid_cents
      A new payment must satisfy 1 <= amount_cents <= outstanding_cents (ERR_PAYMENT_EXCEEDS_BALANCE).
      Conserved quantity: a SUCCEEDED payment followed by its refund restores amount_paid_cents to
      its pre-payment value.
    input_set: "Payments of the invoice with status IN {SUCCEEDED, REFUNDED} (INITIATED and FAILED excluded)"
    constants: {}
    precision: "integer cents"

  - name: event_financial_summary
    trigger: "GET /gala-events/{id}/summary"
    algorithm: aggregation
    formula: |
      Over all Invoices of the event (all statuses unless stated):
        gross_winning_bids_cents       = sum(winning_bid_cents)
        collected_cents                = sum(amount_paid_cents)                       # SUCCEEDED minus REFUNDED per invoice
        outstanding_cents              = sum(winning_bid_cents - amount_paid_cents) over invoices with payment_status IN {UNPAID, PARTIALLY_PAID}
        written_off_cents              = sum(winning_bid_cents) over payment_status = WRITTEN_OFF
        refunded_cents                 = sum(winning_bid_cents) over payment_status = REFUNDED
        recognized_revenue_cents       = sum(revenue_portion_cents) over payment_status = PAID only
        recognized_contribution_cents  = sum(contribution_portion_cents) over payment_status = PAID only
        prorata_contribution_cents     = sum(contribution_prorata_cents) over payment_status = PAID only
        unsold_item_count              = count of Items of the event with status = UNSOLD
        open_disposition_count         = count of Dispositions of the event with status IN {PROPOSED, DONOR_NOTIFIED}
    input_set: "Invoices/Items/Dispositions of the event with the status filters above"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership for entity-backed roles: Bidder may act only on own bids/invoices/certificates; Donor only on own dispositions", error_id: ERR_OWNERSHIP_VIOLATION, http_status: 403, applies_to: "POST /invoices/{id}/payments, POST /certificates/{id}/redeem, POST /dispositions/{id}/donor-response" }
  - { priority: 4, category: existence, check: "Path ids and body FK references exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Request shape: required fields present, types/enum values valid, datetime ordering valid (bidding_opens_at < bidding_closes_at; blackout starts_at < ends_at; redeem scheduled_start < scheduled_end)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /gala-events/{id}, POST /items/{id}/valuations, PATCH /bundles/{id}/min-bid, POST /bundles/{id}/bids" }
  - { priority: 7, category: state, check: "Entity state machine permits the transition (generic)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Event phase permits the operation (solicitation send needs SOLICITING/CATALOGING; bids need BIDDING_OPEN; gala PATCH needs DRAFT/SOLICITING/CATALOGING)", error_id: ERR_EVENT_PHASE_FORBIDDEN, http_status: 409, applies_to: "phase-gated endpoints" }
  - { priority: 9, category: state, check: "Catalog edits (bundle create/attach/detach/publish/min-bid) allowed only while event status == CATALOGING; PATCH min-bid additionally requires bundle status == PUBLISHED (ERR_INVALID_STATE)", error_id: ERR_CATALOG_FROZEN, http_status: 409, applies_to: "bundle mutation endpoints" }
  - { priority: 10, category: state, check: "Domain state preconditions: solicitation PLEDGED for receipt (ERR_SOLICITATION_NOT_PLEDGED); valuation SUBMITTED for decide (ERR_VALUATION_ALREADY_DECIDED); invoice UNPAID/PARTIALLY_PAID for payment (ERR_INVOICE_NOT_PAYABLE); PAID & certificate not REDEEMED for refund (ERR_REFUND_FORBIDDEN); UNPAID for write-off (ERR_WRITEOFF_FORBIDDEN); certificate ISSUED for redeem (ERR_CERTIFICATE_NOT_REDEEMABLE); disposition in correct step (ERR_DISPOSITION_FORBIDDEN)", error_id: "domain state errors", http_status: 409, applies_to: "domain action endpoints" }
  - { priority: 11, category: business_safety, check: "Segregation of duties: valuation approver/rejecter != submitted_by_user_id", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /valuations/{id}/approve, POST /valuations/{id}/reject" }
  - { priority: 12, category: business_safety, check: "Donor acknowledgment issuance requires fmv_cents >= event.ack_threshold_cents (>= boundary)", error_id: ERR_ACK_THRESHOLD_NOT_MET, http_status: 422, applies_to: "POST /acknowledgments/{id}/issue" }
  - { priority: 13, category: business_temporal, check: "Donor solicitation cooldown: half-open window [last_sent_at, last_sent_at + solicitation_cooldown_days)", error_id: ERR_SOLICITATION_COOLDOWN, http_status: 409, applies_to: "POST /solicitations, POST /solicitations/{id}/send" }
  - { priority: 14, category: business_temporal, check: "Redemption window containment: valid_from <= scheduled_start < scheduled_end <= grace_end_at (closed bounds)", error_id: ERR_REDEMPTION_WINDOW_INVALID, http_status: 422, applies_to: "POST /certificates/{id}/redeem" }
  - { priority: 15, category: business_constraint, check: "Redemption window must not intersect any member EXPERIENCE item's BlackoutWindow (half-open intersection; adjacency allowed)", error_id: ERR_BLACKOUT_CONFLICT, http_status: 409, applies_to: "POST /certificates/{id}/redeem" }
  - { priority: 16, category: business_referential, check: "Cross-entity references: item VALUED and unbundled and same-event for attach (ERR_ITEM_NOT_VALUED, ERR_ITEM_ALREADY_BUNDLED); bidder belongs to bundle's event (ERR_BIDDER_EVENT_MISMATCH); >=1 published bundle to open bidding (ERR_NO_PUBLISHED_BUNDLES); rollover target valid (ERR_ROLLOVER_TARGET_INVALID); reconcile gates (ERR_RECONCILE_BLOCKED)", error_id: "domain referential errors", http_status: 409, applies_to: "cross-entity endpoints" }
  - { priority: 17, category: business_constraint, check: "Uniqueness: paddle_no unique per gala_event_id", error_id: ERR_PADDLE_TAKEN, http_status: 409, applies_to: "POST /bidders" }
  - { priority: 18, category: business_constraint, check: "Bidder eligibility: status REGISTERED (ERR_BIDDER_SUSPENDED) and payment_method_on_file (ERR_PAYMENT_METHOD_REQUIRED)", error_id: "bidder eligibility errors", http_status: 422, applies_to: "POST /bundles/{id}/bids" }
  - { priority: 19, category: business_fiscal, check: "Bid amount >= min_next_bid_cents", error_id: ERR_BID_BELOW_MINIMUM, http_status: 422, applies_to: "POST /bundles/{id}/bids" }
  - { priority: 20, category: business_fiscal, check: "Min-bid override >= event.min_bid_floor_cents", error_id: ERR_MIN_BID_BELOW_FLOOR, http_status: 422, applies_to: "PATCH /bundles/{id}/min-bid" }
  - { priority: 21, category: business_fiscal, check: "Payment amount within outstanding balance", error_id: ERR_PAYMENT_EXCEEDS_BALANCE, http_status: 422, applies_to: "POST /invoices/{id}/payments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- GalaEvent ---
  - { method: POST, path: "/gala-events", description: "Create gala event with full config", roles: [GalaAdmin], code: 201, input: [name, gala_date, bidding_opens_at, bidding_closes_at, min_bid_pct_bps, min_bid_increment_cents, min_bid_floor_cents, bid_increment_tiers, ack_threshold_cents, solicitation_cooldown_days, cert_validity_months, cert_grace_days], output: GalaEvent, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/gala-events/{id}", description: "Read gala event", roles: &read_all [GalaAdmin, ProcurementOfficer, ValuationApprover, CatalogManager, FinanceOfficer, Bidder, Donor], code: 200, input: [], output: GalaEvent, side_effects: [] }
  - { method: PATCH, path: "/gala-events/{id}", description: "Update gala config; allowed while status IN {DRAFT, SOLICITING, CATALOGING}; OCC via expected_gala_event_version", roles: [GalaAdmin], code: 200, input: [expected_gala_event_version, "min_bid_pct_bps?", "min_bid_increment_cents?", "min_bid_floor_cents?", "bid_increment_tiers?", "ack_threshold_cents?", "solicitation_cooldown_days?", "cert_validity_months?", "cert_grace_days?", "bidding_opens_at?", "bidding_closes_at?"], output: GalaEvent, side_effects: ["increments GalaEvent.version by 1"] }
  - { method: POST, path: "/gala-events/{id}/advance", description: "Advance DRAFT->SOLICITING->CATALOGING->BIDDING_OPEN->BIDDING_CLOSED->SETTLEMENT; the BIDDING_OPEN->BIDDING_CLOSED step runs the close cascade", roles: [GalaAdmin], code: 200, input: [], output: GalaEvent, side_effects: ["close cascade at BIDDING_CLOSED per state machine", "increments GalaEvent.version by 1"] }
  - { method: POST, path: "/gala-events/{id}/reconcile", description: "SETTLEMENT -> RECONCILED with aggregate gates", roles: [FinanceOfficer], code: 200, input: [], output: GalaEvent, side_effects: ["increments GalaEvent.version by 1"] }
  - { method: GET, path: "/gala-events/{id}/summary", description: "Computed financial summary per event_financial_summary calc", roles: [GalaAdmin, FinanceOfficer], code: 200, input: [], output: { gross_winning_bids_cents: integer, collected_cents: integer, outstanding_cents: integer, written_off_cents: integer, refunded_cents: integer, recognized_revenue_cents: integer, recognized_contribution_cents: integer, prorata_contribution_cents: integer, unsold_item_count: integer, open_disposition_count: integer }, side_effects: [] }

  # --- Donor / Bidder ---
  - { method: POST, path: "/donors", description: "Create donor", roles: [ProcurementOfficer], code: 201, input: [full_name, email, donor_type, "tax_id?"], output: Donor, side_effects: [] }
  - { method: GET, path: "/donors/{id}", description: "Read donor", roles: *read_all, code: 200, input: [], output: Donor, side_effects: [] }
  - { method: POST, path: "/bidders", description: "Register bidder to an event (paddle unique per event)", roles: [GalaAdmin], code: 201, input: [gala_event_id, full_name, email, paddle_no, payment_method_on_file], output: Bidder, side_effects: ["status=REGISTERED"] }
  - { method: GET, path: "/bidders/{id}", description: "Read bidder", roles: *read_all, code: 200, input: [], output: Bidder, side_effects: [] }
  - { method: POST, path: "/bidders/{id}/status", description: "Suspend or reinstate a bidder", roles: [GalaAdmin], code: 200, input: [status], output: Bidder, side_effects: ["REGISTERED <-> SUSPENDED"] }
  - { method: GET, path: "/gala-events/{id}/bidders", description: "List bidders of an event (FK reverse)", roles: *read_all, code: 200, input: [], output: "Bidder[]", side_effects: [] }

  # --- Solicitation ---
  - { method: POST, path: "/solicitations", description: "Create solicitation in DRAFT; donor cooldown applies against existing sent solicitations for the same (donor, event)", roles: [ProcurementOfficer], code: 201, input: [donor_id, gala_event_id, ask_description, ask_estimate_cents], output: Solicitation, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/solicitations/{id}", description: "Read solicitation", roles: *read_all, code: 200, input: [], output: Solicitation, side_effects: [] }
  - { method: GET, path: "/donors/{id}/solicitations", description: "List solicitations of a donor (FK reverse)", roles: *read_all, code: 200, input: [], output: "Solicitation[]", side_effects: [] }
  - { method: GET, path: "/gala-events/{id}/solicitations", description: "List solicitations of an event (FK reverse)", roles: *read_all, code: 200, input: [], output: "Solicitation[]", side_effects: [] }
  - { method: POST, path: "/solicitations/{id}/send", description: "Send (or re-send) solicitation; refreshes last_sent_at; cooldown-gated", roles: [ProcurementOfficer], code: 200, input: [], output: Solicitation, side_effects: ["-> SENT; last_sent_at := now"] }
  - { method: POST, path: "/solicitations/{id}/revise", description: "Pull a SENT solicitation back to REVISED with new ask fields (revision cycle)", roles: [ProcurementOfficer], code: 200, input: [ask_description, ask_estimate_cents], output: Solicitation, side_effects: ["SENT -> REVISED"] }
  - { method: POST, path: "/solicitations/{id}/record-response", description: "Record donor outcome PLEDGED | DECLINED | STALLED | WITHDRAWN", roles: [ProcurementOfficer], code: 200, input: [outcome], output: Solicitation, side_effects: ["SENT -> PLEDGED/DECLINED/STALLED; any non-terminal -> WITHDRAWN"] }

  # --- Item / Valuation / BlackoutWindow ---
  - { method: POST, path: "/items", description: "Receive a pledged item; solicitation must be PLEDGED; solicitation -> FULFILLED", roles: [ProcurementOfficer], code: 201, input: [solicitation_id, title, description, kind], output: Item, side_effects: ["Item RECEIVED; Solicitation PLEDGED -> FULFILLED"] }
  - { method: GET, path: "/items/{id}", description: "Read item", roles: *read_all, code: 200, input: [], output: Item, side_effects: [] }
  - { method: GET, path: "/items", description: "List items with FK filters and pagination", roles: *read_all, code: 200, input: ["solicitation_id?", "donor_id?", "gala_event_id?", "bundle_id?", "status?", "limit?", "offset?"], output: "Item[]", side_effects: [] }
  - { method: POST, path: "/items/{id}/valuations", description: "Submit valuation; supersedes any SUBMITTED valuation on the item; OCC via expected_item_version", roles: [ProcurementOfficer], code: 201, input: [fmv_cents, fmv_source, expected_item_version], output: Valuation, side_effects: ["prior SUBMITTED valuation -> SUPERSEDED", "increments Item.version by 1"] }
  - { method: GET, path: "/items/{id}/valuations", description: "List valuations of an item (FK reverse), ordered by created_at ASC", roles: *read_all, code: 200, input: [], output: "Valuation[]", side_effects: [] }
  - { method: POST, path: "/valuations/{id}/approve", description: "Approve a SUBMITTED valuation; approver must differ from submitter (SoD)", roles: [ValuationApprover], code: 200, input: [], output: Valuation, side_effects: ["Item fmv/tier update; RECEIVED -> VALUED; acknowledgment create/refresh/void+recreate"] }
  - { method: POST, path: "/valuations/{id}/reject", description: "Reject a SUBMITTED valuation; rejecter must differ from submitter (SoD)", roles: [ValuationApprover], code: 200, input: [], output: Valuation, side_effects: ["-> REJECTED"] }
  - { method: POST, path: "/items/{id}/blackout-windows", description: "Add a half-open blackout window to an EXPERIENCE item", roles: [CatalogManager], code: 201, input: [starts_at, ends_at, "label?"], output: BlackoutWindow, side_effects: [] }
  - { method: GET, path: "/items/{id}/blackout-windows", description: "List blackout windows of an item (FK reverse)", roles: *read_all, code: 200, input: [], output: "BlackoutWindow[]", side_effects: [] }

  # --- Bundle / Bid ---
  - { method: POST, path: "/bundles", description: "Create empty bundle in DRAFT", roles: [CatalogManager], code: 201, input: [gala_event_id, title], output: Bundle, side_effects: ["status=DRAFT; bundle_fmv_cents=0"] }
  - { method: GET, path: "/bundles/{id}", description: "Read bundle (fmv, min bid, current high bid)", roles: *read_all, code: 200, input: [], output: Bundle, side_effects: [] }
  - { method: GET, path: "/gala-events/{id}/bundles", description: "List bundles of an event (FK reverse)", roles: *read_all, code: 200, input: [], output: "Bundle[]", side_effects: [] }
  - { method: POST, path: "/bundles/{id}/items", description: "Attach a VALUED item to a DRAFT bundle", roles: [CatalogManager], code: 200, input: [item_id], output: Bundle, side_effects: ["Item VALUED -> BUNDLED; bundle_fmv_cents recomputed", "increments Bundle.version by 1"] }
  - { method: DELETE, path: "/bundles/{id}/items/{item_id}", description: "Detach an item from a DRAFT bundle", roles: [CatalogManager], code: 200, input: [], output: Bundle, side_effects: ["Item BUNDLED -> VALUED; bundle_fmv_cents recomputed", "increments Bundle.version by 1"] }
  - { method: POST, path: "/bundles/{id}/publish", description: "Publish bundle: freeze FMV, compute locked min_bid, items -> CATALOGED", roles: [CatalogManager], code: 200, input: [], output: Bundle, side_effects: ["DRAFT -> PUBLISHED; min_bid_cents computed per minimum_bid_cents calc", "increments Bundle.version by 1"] }
  - { method: PATCH, path: "/bundles/{id}/min-bid", description: "Override minimum bid (>= event floor); requires bundle status PUBLISHED (ERR_INVALID_STATE) and event status CATALOGING (ERR_CATALOG_FROZEN); OCC via expected_bundle_version", roles: [CatalogManager], code: 200, input: [min_bid_cents, expected_bundle_version], output: Bundle, side_effects: ["min_bid_overridden := true", "increments Bundle.version by 1"] }
  - { method: POST, path: "/bundles/{id}/bids", description: "Place bid as the authenticated bidder; OCC via expected_bundle_version; previous ACTIVE bid -> OUTBID", roles: [Bidder], code: 201, input: [amount_cents, expected_bundle_version], output: Bid, side_effects: ["prior ACTIVE bid -> OUTBID; current_high_bid_cents updated", "increments Bundle.version by 1"] }
  - { method: GET, path: "/bundles/{id}/bids", description: "List bids of a bundle (FK reverse)", roles: *read_all, code: 200, input: [], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/bidders/{id}/bids", description: "List bids of a bidder (FK reverse)", roles: *read_all, code: 200, input: [], output: "Bid[]", side_effects: [] }

  # --- Invoice / Payment / Certificate ---
  - { method: GET, path: "/invoices/{id}", description: "Read invoice (split portions, parallel statuses)", roles: *read_all, code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: GET, path: "/invoices", description: "List invoices with FK filters", roles: *read_all, code: 200, input: ["gala_event_id?", "bidder_id?", "bundle_id?", "payment_status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: POST, path: "/invoices/{id}/payments", description: "Create a payment attempt (partial allowed) as the invoice's bidder", roles: [Bidder], code: 201, input: [amount_cents, method], output: Payment, side_effects: ["Payment INITIATED"] }
  - { method: GET, path: "/invoices/{id}/payments", description: "List payments of an invoice (FK reverse)", roles: *read_all, code: 200, input: [], output: "Payment[]", side_effects: [] }
  - { method: POST, path: "/_payments/simulate", description: "Test-driving endpoint: settle an INITIATED payment as SUCCEEDED or FAILED", roles: [GalaAdmin], code: 200, input: [payment_id, outcome], output: Payment, side_effects: ["on SUCCEEDED: invoice amount_paid recompute; PAID cascade (fulfillment READY; certificate ISSUED)"] }
  - { method: POST, path: "/invoices/{id}/refund", description: "Refund a PAID invoice; full compensation cascade (payments, certificate, bid, bundle, items, dispositions)", roles: [FinanceOfficer], code: 200, input: [], output: Invoice, side_effects: ["payment_status -> REFUNDED; refund cascade per state machine"] }
  - { method: POST, path: "/invoices/{id}/write-off", description: "Write off an UNPAID invoice; re-opens bundle for disposition", roles: [FinanceOfficer], code: 200, input: [], output: Invoice, side_effects: ["payment_status -> WRITTEN_OFF; void cascade per state machine"] }
  - { method: POST, path: "/invoices/{id}/fulfill", description: "Mark fulfillment of a physical-only invoice (READY -> FULFILLED)", roles: [GalaAdmin], code: 200, input: [], output: Invoice, side_effects: ["Bundle SOLD -> SETTLED bubble-up"] }
  - { method: GET, path: "/invoices/{id}/certificates", description: "List certificates of an invoice (FK reverse; 0 or 1 elements)", roles: *read_all, code: 200, input: [], output: "Certificate[]", side_effects: [] }
  - { method: GET, path: "/certificates/{id}", description: "Read certificate", roles: *read_all, code: 200, input: [], output: Certificate, side_effects: [] }
  - { method: POST, path: "/certificates/{id}/redeem", description: "Redeem an ISSUED certificate, committing the experience window", roles: [Bidder], code: 200, input: [scheduled_start, scheduled_end], output: Certificate, side_effects: ["ISSUED -> REDEEMED; invoice fulfillment FULFILLED; bundle SETTLED bubble-up"] }

  # --- Disposition / Acknowledgment ---
  - { method: GET, path: "/dispositions/{id}", description: "Read disposition", roles: *read_all, code: 200, input: [], output: Disposition, side_effects: [] }
  - { method: GET, path: "/dispositions", description: "List dispositions with FK filters", roles: *read_all, code: 200, input: ["gala_event_id?", "item_id?", "donor_id?", "target_gala_event_id?", "status?", "limit?", "offset?"], output: "Disposition[]", side_effects: [] }
  - { method: POST, path: "/dispositions/{id}/decide", description: "Committee decision RETURN_TO_DONOR | ROLLOVER | DISCARD; ROLLOVER requires valid target_gala_event_id", roles: [GalaAdmin], code: 200, input: [decision, "target_gala_event_id?"], output: Disposition, side_effects: ["PROPOSED -> DONOR_NOTIFIED"] }
  - { method: POST, path: "/dispositions/{id}/donor-response", description: "Donor accepts (EXECUTED + item/ack cascades) or declines (back to PROPOSED)", roles: [Donor], code: 200, input: [accept], output: Disposition, side_effects: ["DONOR_NOTIFIED -> EXECUTED or -> PROPOSED (reconsideration cycle)"] }
  - { method: GET, path: "/acknowledgments/{id}", description: "Read donor acknowledgment", roles: *read_all, code: 200, input: [], output: DonorAcknowledgment, side_effects: [] }
  - { method: GET, path: "/acknowledgments", description: "List acknowledgments with FK filters", roles: *read_all, code: 200, input: ["donor_id?", "gala_event_id?", "item_id?", "status?", "limit?", "offset?"], output: "DonorAcknowledgment[]", side_effects: [] }
  - { method: POST, path: "/acknowledgments/{id}/issue", description: "Issue a PENDING acknowledgment; fmv must meet event ack threshold (>=)", roles: [FinanceOfficer], code: 200, input: [], output: DonorAcknowledgment, side_effects: ["PENDING -> ISSUED; fmv frozen; issued_at := now"] }
  - { method: POST, path: "/acknowledgments/{id}/void", description: "Void an acknowledgment (e.g., after corrected valuation)", roles: [FinanceOfficer], code: 200, input: [], output: DonorAcknowledgment, side_effects: ["PENDING/ISSUED -> VOIDED"] }

  # --- Clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock. Setting the clock runs the certificate expiry sweep (ISSUED with now > expires_at -> EXPIRED)", roles: [GalaAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["certificate expiry sweep"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed actor does not own the target resource (bidder/donor scope)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed field, invalid enum, or invalid datetime ordering" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity state machine does not permit the requested transition" }
  - { id: ERR_EVENT_PHASE_FORBIDDEN, http: 409, condition: "Operation not allowed in the event's current phase" }
  - { id: ERR_CATALOG_FROZEN, http: 409, condition: "Catalog structure edits blocked once the event has left CATALOGING" }
  - { id: ERR_SOLICITATION_COOLDOWN, http: 409, condition: "Donor has a solicitation whose last_sent_at is within the cooldown window [last_sent_at, last_sent_at + cooldown_days)" }
  - { id: ERR_SOLICITATION_NOT_PLEDGED, http: 409, condition: "Item receipt requires solicitation status PLEDGED" }
  - { id: ERR_ITEM_NOT_VALUED, http: 409, condition: "Attach requires item status VALUED (approved valuation)" }
  - { id: ERR_ITEM_ALREADY_BUNDLED, http: 409, condition: "Item already attached to a bundle" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Valuation approver/rejecter is the same user who submitted it" }
  - { id: ERR_VALUATION_ALREADY_DECIDED, http: 409, condition: "Valuation not in SUBMITTED (already APPROVED/REJECTED/SUPERSEDED)" }
  - { id: ERR_BUNDLE_EMPTY, http: 422, condition: "Publish requires at least one member item" }
  - { id: ERR_MIN_BID_BELOW_FLOOR, http: 422, condition: "Min-bid override below event min_bid_floor_cents" }
  - { id: ERR_BID_BELOW_MINIMUM, http: 422, condition: "Bid amount below min_next_bid_cents" }
  - { id: ERR_BIDDER_EVENT_MISMATCH, http: 403, condition: "Bidder is registered to a different gala event than the bundle's" }
  - { id: ERR_BIDDER_SUSPENDED, http: 403, condition: "Bidder status is SUSPENDED" }
  - { id: ERR_PAYMENT_METHOD_REQUIRED, http: 422, condition: "Bidder has no payment method on file" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice payment_status not in {UNPAID, PARTIALLY_PAID}" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Payment amount outside 1..outstanding_cents" }
  - { id: ERR_REFUND_FORBIDDEN, http: 409, condition: "Refund requires PAID and no REDEEMED certificate" }
  - { id: ERR_WRITEOFF_FORBIDDEN, http: 409, condition: "Write-off requires payment_status UNPAID" }
  - { id: ERR_CERTIFICATE_NOT_REDEEMABLE, http: 409, condition: "Certificate not in ISSUED (incl. post-sweep EXPIRED)" }
  - { id: ERR_REDEMPTION_WINDOW_INVALID, http: 422, condition: "Scheduled window outside closed containment [valid_from, grace_end_at] or start >= end" }
  - { id: ERR_BLACKOUT_CONFLICT, http: 409, condition: "Scheduled window intersects a member experience item's blackout (half-open; adjacency allowed)" }
  - { id: ERR_DISPOSITION_FORBIDDEN, http: 409, condition: "Disposition not in the required step for decide/donor-response" }
  - { id: ERR_ROLLOVER_TARGET_INVALID, http: 409, condition: "Rollover target missing, same as source, or not in {DRAFT, SOLICITING, CATALOGING}" }
  - { id: ERR_ACK_THRESHOLD_NOT_MET, http: 422, condition: "Acknowledgment fmv_cents below event ack_threshold_cents" }
  - { id: ERR_RECONCILE_BLOCKED, http: 409, condition: "Reconcile requires all invoices terminal, paid invoices fulfilled/expired, all dispositions executed" }
  - { id: ERR_NO_PUBLISHED_BUNDLES, http: 409, condition: "Opening bidding requires at least one PUBLISHED bundle" }
  - { id: ERR_PADDLE_TAKEN, http: 409, condition: "paddle_no already used within the gala event" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GalaAdmin
    description: "Gala committee chair; owns event lifecycle, bidders, dispositions, test-driving endpoints"
    identity: opaque
    exclusive_operations: ["POST /gala-events", "PATCH /gala-events/{id}", "POST /gala-events/{id}/advance", "POST /bidders", "POST /bidders/{id}/status", "POST /dispositions/{id}/decide", "POST /invoices/{id}/fulfill", "POST /_payments/simulate", "POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: ProcurementOfficer
    description: "Solicitation pipeline and item intake; submits valuations"
    identity: opaque
    exclusive_operations: ["POST /donors", "POST /solicitations", "POST /solicitations/{id}/send", "POST /solicitations/{id}/revise", "POST /solicitations/{id}/record-response", "POST /items", "POST /items/{id}/valuations"]
    shared_operations: ["all GET endpoints"]
  - name: ValuationApprover
    description: "Independent valuation reviewer; must not be the submitting officer (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /valuations/{id}/approve", "POST /valuations/{id}/reject"]
    shared_operations: ["all GET endpoints"]
  - name: CatalogManager
    description: "Builds bundles, sets minimum bids, publishes the catalog, manages blackout windows"
    identity: opaque
    exclusive_operations: ["POST /bundles", "POST /bundles/{id}/items", "DELETE /bundles/{id}/items/{item_id}", "POST /bundles/{id}/publish", "PATCH /bundles/{id}/min-bid", "POST /items/{id}/blackout-windows"]
    shared_operations: ["all GET endpoints"]
  - name: FinanceOfficer
    description: "Payments oversight: refunds, write-offs, reconciliation, donor acknowledgment issuance"
    identity: opaque
    exclusive_operations: ["POST /invoices/{id}/refund", "POST /invoices/{id}/write-off", "POST /gala-events/{id}/reconcile", "POST /acknowledgments/{id}/issue", "POST /acknowledgments/{id}/void"]
    shared_operations: ["all GET endpoints", "GET /gala-events/{id}/summary"]
  - name: Bidder
    description: "Registered gala bidder; places bids, pays invoices, redeems certificates"
    identity: "entity_backed:Bidder"
    exclusive_operations: ["POST /bundles/{id}/bids", "POST /invoices/{id}/payments", "POST /certificates/{id}/redeem"]
    shared_operations: ["all GET endpoints"]
  - name: Donor
    description: "Item donor; responds to unsold-item disposition proposals"
    identity: "entity_backed:Donor"
    exclusive_operations: ["POST /dispositions/{id}/donor-response"]
    shared_operations: ["all GET endpoints"]
