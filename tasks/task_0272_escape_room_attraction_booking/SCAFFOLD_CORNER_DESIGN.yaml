  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_slot_grab_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[slot-grab-stale-slot]
          - errors[ERR_STALE_SLOT_VERSION]
          - endpoints
        distinguishing_aspect: "Booking-create with expected_time_slot_version one behind current (slot already grabbed once and reverted, bumping version) -> ERR_STALE_SLOT_VERSION (412). OCC on TimeSlot.version."
        test_recipe:
          setup: ["Venue open all day; Room canonical; one GM; one OPEN slot whose version has advanced past 1 (grabbed then released via cancel, so version > 1)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v0: $.data.version }
            - call: "POST /customers"
              payload: { email: "x12@x.com", full_name: "X12" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v0}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk1: $.data.id, bk1_v: $.data.version }
            - call: "POST /bookings/${bk1}/cancel"
              payload: { expected_booking_version: "${bk1_v}" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v0}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_SLOT_VERSION"

      - name: occ_reschedule_stale_slot_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reschedule-stale-slot]
          - errors[ERR_STALE_SLOT_VERSION]
          - endpoints
        distinguishing_aspect: "Reschedule carrying a stale expected_time_slot_version for the current slot (one behind, via ${slot1_v_now} - 1) -> ERR_STALE_SLOT_VERSION (412)."
        test_recipe:
          setup: ["Venue open all day; Room canonical; one GM; two non-overlapping slots; booking CONFIRMED on slot1 (slot1 version advanced)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "R", min_group_size: 1, max_group_size: 4, base_price_cents: 2000, game_minutes: 60, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot1: $.data.id, slot1_v: $.data.version }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T12:00:00Z" }
              as: VenueManager
              captures: { slot2: $.data.id }
            - call: "POST /customers"
              payload: { email: "x13@x.com", full_name: "X13" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot1}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot1_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
            - call: "GET /time-slots/${slot1}"
              as: Customer
              as_user_id: "${cust}"
              captures: { slot1_v_now: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/reschedule"
              payload: { new_time_slot_id: "${slot2}", expected_time_slot_version: "${slot1_v_now} - 1", expected_booking_version: "${bk_v2}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_SLOT_VERSION"

      - name: occ_non_slot_stale_version_on_giftcard_topup
        claim_type: optimistic_concurrency
        grounds:
          - errors[ERR_STALE_VERSION]
          - entities.GiftCard.fields.version
          - endpoints
        distinguishing_aspect: "A gift-card top-up carrying a stale expected_gift_card_version (one behind current, via ${gc_v_now} - 1 after a prior top-up bumped it) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Venue; gift card balance 5000; one prior top-up applied (version advanced to 2)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
