            - "THE CHECK IS ON THE USER, NOT THE ROLE — the refused reopen and the accepted reopen are both RiskOfficer calls, and the refused approve and the accepted approve are both TourAccountant calls; only the X-User-ID differs"
            - "PAIR 2, PAY vs SIGN — ${sd_st_status_s} == ARTIST_SIGNED with ${sd_st_signedby} == ${sd_a1_id}; a TourAccountant sending that same id as X-User-ID gets ${sd_err_3} == ERR_SEGREGATION_OF_DUTIES 403 with ${sd_st_status_after3} == ARTIST_SIGNED and ${sd_st_paidat_after3} == null, and u_sd_ta2 then gets ${sd_st_status_p} == PAID with ${sd_st_paidat} == 2026-12-02T02:00:00.000Z and ${sd_st_payref} == WIRE-SD-01 — the comparison spans two different ROLES and still fires"
            - "THE RECALCULATION IS STABLE — ${sd_st_status_c2} == CALCULATED with ${sd_st_due2} == ${sd_st_due} == 100000; the money for S1 is ${sd_st_adj} == 487500 (500000 gross less the 12500 card fee), ${sd_st_allowed} == 100000 (MIN(105000 recognised deductible, 100000 expense cap)) and ${sd_st_net} == 282500 == 487500 - 100000 earnings - 105000 recognised expense"
            - "PAIR 4, SETTLE-CLAIM vs FILE-CLAIM — ${sd_ev_refund} == 20 and ${sd_ev_status_rp} == REFUNDS_PROCESSED with ${sd_ev_unrec} == 700000 (600000 recognised on the VOIDed line plus the 100000 deposit); ${sd_ev_status_cf} == CLAIM_FILED with ${sd_ev_filedby} == u_sd_risk1, u_sd_risk1's own settle-claim returns ${sd_err_4} == ERR_SEGREGATION_OF_DUTIES 403 leaving ${sd_ev_status_after4} == CLAIM_FILED and ${sd_ev_recovery_after4} == 0, and u_sd_risk2 then gets ${sd_ev_status_cs} == CLAIM_SETTLED with ${sd_ev_covered} == 700000 and ${sd_ev_recovery} == 200000 (700000 less the 500000 deductible)"
            - "FOUR PAIRS, FOUR ERRORS, ONE ID — ${sd_err_1}, ${sd_err_2}, ${sd_err_3} and ${sd_err_4} are all ERR_SEGREGATION_OF_DUTIES 403; §1.4 priority 19 lists exactly these four endpoints and no other operation in the scaffold applies a four-eyes rule"

      - name: entity_backed_roles_reach_only_their_own_act_or_room
        claim_type: peer_roles
        grounds:
          - "complexity_profile.role_model=segregation_of_duties"
          - "roles[ArtistRep].identity=entity_backed:Artist"
          - "roles[VenueOperator].identity=entity_backed:Venue"
          - "validations[priority=15]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
        distinguishing_aspect: "The two entity-backed identities are peers of each other, not of the promoter roles: an ArtistRep holds a valid role for POST /offers/{id}/accept and still cannot accept the offer on another act's show, and a VenueOperator may paper an invoice but only for a show in its own room. Every probe therefore passes the priority 2 role gate and is refused one rule later at priority 15 — the error is ERR_NOT_RESOURCE_OWNER 403 and never ERR_ROLE_FORBIDDEN 403, and the two must not be conflated. Each refusal is immediately followed by the owning identity making the identical call successfully, so the test cannot be satisfied by refusing everyone. The instance also draws the boundary of the ownership rule in two directions the implementation is likely to get wrong: it does NOT extend to reads (priority 15's applies_to lists seven write endpoints, so an ArtistRep may read a rival's show), and the release endpoint's KIND restriction is a transition precondition rather than an ownership check, so an ArtistRep releasing a PRODUCTION_HOLD on its own show is refused by priority 17 with ERR_INVALID_STATE 409 rather than by priority 15."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z. Market Peer Market limit 5000000. Two venues in it: Peer Hall One and Peer Hall Two, each capacity 500, facility fee 0, ticket tax 0. Two artists: Peer Act One and Peer Act Two, both withholding 0."
