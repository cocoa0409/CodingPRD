        excluded_because:
          difficulty_instance: dual_variant_calc / sale_price_quoted_vs_executed_diverge_when_endowment_completed
          rationale: "The two-price divergence on one sale row (surcharge cleared between quote and settlement, plus the 110% execution cap) is the named §1.8 instance."

