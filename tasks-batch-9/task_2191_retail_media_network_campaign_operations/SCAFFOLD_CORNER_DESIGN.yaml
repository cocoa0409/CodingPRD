  # ===========================================================================
  # 3) CALCULATIONS
  # ===========================================================================
  - section: calculations
    instances:
      - name: relevance_composition_applies_hero_boost_margin_and_segment_bonus
        claim_type: correct_result
        grounds:
          - calculations.relevance_score_composition
          - calculations.relevance_adjusted_bid_ranking
          - state_machines.AuctionEvent.OPEN_to_RANKED
        distinguishing_aspect: "Two candidates on the same slot see identical query tokens and identical hero/segment terms, so the only score difference is margin_avg: 0.60*1.0 + 0.25*0.40 + 0.10 + 0.03 = 0.8300 versus 0.60*1.0 + 0.25*0.20 + 0.10 + 0.03 = 0.7800, and each assignment's relevance_contribution is 0.25*margin_pct over a single-row active set."
        test_recipe:
          setup:
            - "Baseline chain with two SERVING CPC line items on SRP-A1: line item 1 bids 200 with terms [red, shoes] on a 0.40-margin hero product, line item 2 bids 150 with terms [red] on a 0.20-margin hero product. An OPEN auction on SRP-A1 carries request_context_query 'red shoes sale' and shopper_segment RETURNING (+0.03)."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - *c_prod2
            - *c_camp_read
            - *c_li2
            - *c_pa2
            - *c_li2_sub
            - *c_li2_app
            - *c_li2_act
            - *c_pa_read
            - &c_pa2_read
              call: "GET /rmn/product-assignments"
              payload: { line_item_id: "${li2_id}" }
              as: AccountManager
              as_user_id: "u_am_1"
              captures: { pa2_id: "$.data[0].id" }
            - *c_auc
          trigger:
            - *c_rank
          assert:
            - "HTTP 200"
            - "LineItem.${li_id}.relevance_score == 0.8300"
            - "LineItem.${li2_id}.relevance_score == 0.7800"
            - "ProductAssignment.${pa_id}.relevance_contribution == 0.1000"
            - "ProductAssignment.${pa2_id}.relevance_contribution == 0.0500"
            - "LineItem.${li_id}.quality_adjusted_score == 166.0000"
            - "LineItem.${li2_id}.quality_adjusted_score == 117.0000"
            - "AuctionEvent.${auc_id}.candidate_count == 2"
            - "AuctionEvent.${auc_id}.winner_score == 166.0000"
            - "AuctionEvent.${auc_id}.second_best_score == 117.0000"
            - "AuctionEvent.${auc_id}.status == RANKED"

      - name: second_price_clearing_ceils_raw_before_clamping_to_142
        claim_type: precision
        grounds:
          - calculations.second_price_clearing
          - state_machines.AuctionEvent.RANKED_to_AWARDED
          - errors[ERR_AUCTION_INVALID_STATE]
        distinguishing_aspect: "raw = second_best_score / (winner_relevance ** slot_relevance_weight * TIER_2 multiplier) + 1 = 117.0000 / 0.8300 + 1 = 141.96385..., and ceil is applied once BEFORE the max/min clamp, so clearing_price_cents is 142; clamping first and ceiling afterwards would also expose a one-cent difference on the floor boundary."
        test_recipe:
          setup:
            - "Baseline two-candidate auction on SRP-A1 already RANKED with winner_score 166.0000 and second_best_score 117.0000; the slot floor is 50 and the winner's effective_bid_cents is 200."
          setup_api_calls:
            - *c_adv
            - *c_adv_sub
            - *c_adv_kyc
            - *c_plan
            - *c_plan_sub
            - *c_plan_app
            - *c_slot
            - *c_camp
            - *c_prod
            - *c_li
            - *c_pa
            - *c_li_sub
            - *c_li_app
            - *c_camp_rev
            - *c_camp_app
            - *c_camp_act
            - *c_li_act
            - *c_prod2
            - *c_camp_read
            - *c_li2
            - *c_pa2
            - *c_li2_sub
            - *c_li2_app
            - *c_li2_act
            - *c_auc
            - *c_rank
          trigger:
            - *c_award
          assert:
            - "HTTP 200"
            - "AuctionEvent.${auc_id}.status == AWARDED"
            - "AuctionEvent.${auc_id}.clearing_price_cents == 142"
            - "AuctionEvent.${auc_id}.winning_line_item_id == ${li_id}"
            - "AuctionEvent.${auc_id}.no_fill_reason == NONE"

      - name: cpc_settlement_bills_click_events_only_and_ignores_impressions
