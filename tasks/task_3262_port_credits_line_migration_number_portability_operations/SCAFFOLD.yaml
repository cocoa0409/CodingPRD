scenario: "Port-In Credits, Line Migration & Number Portability Operations (T-Mobile): port-in request submission with account number and transfer personal identification from the losing carrier, port rejection codes with customer guidance and resubmission workflows, promotional credits for switching applied over an installment period with contingencies on line retention, prepaid to postpaid migration preserving numbers, balances and device financing, family and business account line additions with credit class determination and deposit requirements, device installment plans, upgrade eligibility and trade-in condition grading, port-out protection controls to prevent unauthorized transfers, number reservation and reclamation after cancellation"
domain_name: "number-portability-port-credit-operations"
api_prefix: "/portability"
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: account_type
        type: enum
        source: input
        description: "Account ownership class; one of FAMILY or BUSINESS"
        constraints: "enum {FAMILY, BUSINESS}"
      - name: account_status
        type: enum
        source: system
        description: "Lifecycle status of the billing account"
        default: OPEN
        constraints: "enum {OPEN, SUSPENDED, CLOSED}"
      - name: tax_id_last4
        type: string
        source: input
        description: "Last four characters of the account holder tax identifier"
        constraints: "exactly 4 characters"
      - name: credit_class
        type: enum
        source: computed
        description: "Credit class derived by calculation credit_class_determination from active_line_count, payment_history_score and existing_deposit_cents"
        constraints: "enum {CLASS_A, CLASS_B, CLASS_C, CLASS_D, BLOCKED}"
      - name: payment_history_score
        type: integer
        source: input
        description: "Underwriting score in the inclusive range 0 to 1000"
        default: 500
        constraints: "0 <= payment_history_score <= 1000"
      - name: active_line_count
        type: integer
        source: computed
        description: "Count of SubscriberLine rows whose account_id equals this account and whose service_status is ACTIVE"
        default: 0
      - name: reserved_mdn_count
        type: integer
        source: computed
        description: "Count of NumberReservation rows whose account_id equals this account and whose reservation_state is HELD"
        default: 0
      - name: deposit_required_cents
        type: integer
        source: computed
        description: "Deposit the account must satisfy before a new line is provisioned; derived from credit_class"
        default: 0
      - name: existing_deposit_cents
        type: integer
        source: input
        description: "Deposit already on file for this account"
        default: 0
      - name: promo_credited_cents
        type: integer
        source: computed
        description: "Cumulative promotional credit issued to this account across all PromoCreditSchedule rows"
        default: 0
      - name: promo_clawed_back_cents
        type: integer
        source: computed
        description: "Cumulative promotional credit reversed from this account"
        default: 0
      - name: net_promo_credit_cents
        type: integer
        source: computed
        description: "Conserved promotional ledger quantity: promo_credited_cents minus promo_clawed_back_cents"
        default: 0

  - name: SubscriberLine
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning billing account"
      - name: mdn
        type: string
        source: input
        description: "Ten-digit mobile directory number carried by this line"
        constraints: "unique across all SubscriberLine rows whose number_status is not RECLAIMED"
      - name: billing_mode
        type: enum
        source: input
        description: "Billing mode currently applied to this line"
        default: PREPAID
        constraints: "enum {PREPAID, POSTPAID}"
      - name: service_status
        type: enum
        source: system
        description: "Service activation dimension of the line; evolves independently of number_status"
        default: PROVISIONED
        constraints: "enum {PROVISIONED, ACTIVE, SUSPENDED, CANCELLED}"
      - name: number_status
        type: enum
        source: system
        description: "Directory-number dimension of the line; evolves independently of service_status"
        default: UNASSIGNED
        constraints: "enum {UNASSIGNED, RESERVED, PORTED_IN, ASSIGNED, RECLAIMED}"
      - name: port_protection_status
        type: enum
        source: computed
        description: "Derived from whether the line has a PortProtectionCase in case_state ACTIVE"
        default: UNPROTECTED
        constraints: "enum {UNPROTECTED, PROTECTED}"
      - name: line_opened_at
        type: datetime
        source: system
        description: "Instant the line entered service_status ACTIVE for the first time"
      - name: loyalty_tenure_months
        type: integer
        source: computed
        description: "Whole months between line_opened_at and the current logical clock instant"
        default: 0
      - name: retention_cycle_count
        type: integer
        source: computed
        description: "Count of completed monthly billing cycles since line_opened_at, floored"
        default: 0
      - name: promo_eligibility_state
        type: enum
        source: computed
        description: "Rollup of the line's promotional posture across its PromoCreditSchedule rows"
        default: INELIGIBLE
        constraints: "enum {INELIGIBLE, PROVISIONAL_ELIGIBLE, VESTED, CLAWED_BACK}"
      - name: cancellation_effective_at
        type: datetime
        source: system
        description: "Instant the line entered service_status CANCELLED; exclusive lower bound of the number-reclamation waiting window"

  - name: PortRequest
    parent: null
    common_fields: true
    fields:
      - name: subscriber_line_id
        type: string
        source: input
        description: "FK -> SubscriberLine.id; line being ported in"
      - name: losing_carrier_code
        type: string
        source: input
        description: "Identifier of the carrier currently serving the number"
      - name: account_number_at_losing_carrier
        type: string
        source: input
        description: "Account number the customer holds with the losing carrier"
      - name: transfer_pin
        type: string
        source: input
        description: "Transfer personal identification number issued by the losing carrier"
        constraints: "exactly 4 digits"
      - name: requested_cutover_at
        type: datetime
        source: input
        description: "Instant the customer asked the port to take effect"
      - name: request_state
        type: enum
        source: system
        description: "Port-in workflow state"
        default: DRAFT
        constraints: "enum {DRAFT, PENDING, REJECTED, RESUBMITTED, ACCEPTED_PENDING_CUTOVER, PORTED, CANCELLED}"
      - name: rejection_count
        type: integer
        source: computed
        description: "Number of entries in the PortRequest.rejections log"
        default: 0
      - name: last_rejection_code
        type: string
        source: computed
        description: "rejection_code of the newest entry in the PortRequest.rejections log"
      - name: rejections
        type: array
        source: computed
        description: "Append-only log of rejection records for this request; each entry carries rejection_code, guidance_text, resubmission_allowed, retry_after_hours and occurred_at"
      - name: last_rejection_at
        type: datetime
        source: computed
        description: "occurred_at of the newest entry in PortRequest.rejections, null when rejection_count is 0"
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant the request first entered request_state PENDING"
      - name: supersedes_port_request_id
        type: string
        source: input
        description: "Id of the prior PortRequest this request replaces when a fresh attempt supersedes the line's earlier one; null on a first attempt. Findable through the port-request list filter of the same name."
      - name: cutover_completed_at
        type: datetime
        source: system
        description: "Instant the request entered request_state PORTED"

  - name: PromoCreditSchedule
    parent: null
    common_fields: true
    fields:
      - name: subscriber_line_id
        type: string
        source: input
        description: "Identifies the SubscriberLine the promotional credit is attached to; a schedule is retrieved by its own id or listed for a line"
      - name: promo_code
        type: string
        source: input
        description: "Promotion identifier for the switch credit program"
      - name: monthly_credit_cents
        type: integer
        source: input
        description: "Credit applied to each billing cycle of the installment period"
      - name: installment_months
        type: integer
        source: input
        description: "Number of billing cycles over which the credit is applied"
      - name: retention_requirement_cycles
        type: integer
        source: input
        description: "Completed billing cycles the line must retain before the credit vests"
        default: 12
      - name: schedule_state
        type: enum
        source: system
        description: "Promotional credit lifecycle state"
        default: PROVISIONAL
        constraints: "enum {PROVISIONAL, ACTIVE, VESTED, CLAWED_BACK}"
      - name: window_start
        type: datetime
        source: input
        description: "First instant of the credit window, inclusive"
      - name: window_end
        type: datetime
        source: computed
        description: "Last instant of the credit window, computed from window_start plus installment_months billing cycles"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Forward-looking projected credit from calculation port_in_promo_credit_projection, provisional variant"
        default: 0
      - name: vested_total_cents
        type: integer
        source: computed
        description: "Chronologically accumulated credit from calculation port_in_promo_credit_projection, vested variant"
        default: 0
      - name: cycles_elapsed
        type: integer
        source: computed
        description: "Completed billing cycles inside the credit window as of the current logical clock instant"
        default: 0

  - name: DeviceInstallmentPlan
    parent: null
    common_fields: true
    fields:
      - name: subscriber_line_id
        type: string
        source: input
        description: "FK -> SubscriberLine.id; line financing the device"
      - name: device_model
        type: string
        source: input
        description: "Model identifier of the financed device"
      - name: device_price_cents
        type: integer
        source: input
        description: "Full retail price of the device"
      - name: down_payment_cents
        type: integer
        source: input
        description: "Amount paid up front, subtracted from device_price_cents before financing"
        default: 0
      - name: installment_months
        type: integer
        source: input
        description: "Number of monthly installments over which the financed balance is repaid"
      - name: monthly_installment_cents
        type: integer
        source: computed
        description: "Level monthly installment derived from the financed balance and installment_months"
        default: 0
      - name: remaining_balance_cents
        type: integer
        source: computed
        description: "Unpaid financed balance, reduced by trade_in_credit_cents when a trade-in is applied"
        default: 0
      - name: plan_state
        type: enum
        source: system
        description: "Installment plan lifecycle state"
        default: QUOTED
        constraints: "enum {QUOTED, ACTIVE, UPGRADE_ELIGIBLE, CONVERTED}"
      - name: financed_at
        type: datetime
        source: system
        description: "Instant the plan entered plan_state ACTIVE"
      - name: upgrade_eligible_at
        type: datetime
        source: computed
        description: "Instant the plan becomes eligible for upgrade per calculation device_upgrade_eligibility"
      - name: trade_in_credit_cents
        type: integer
        source: computed
        description: "Credit accepted from the graded TradeInAssessment attached to this plan"
        default: 0

  - name: TradeInAssessment
    parent: null
    common_fields: true
    fields:
      - name: installment_plan_id
        type: string
        source: input
        description: "FK -> DeviceInstallmentPlan.id; plan the traded device credit will be applied to"
      - name: parent_plan_id
        type: string
        source: computed
        description: "Mirror of installment_plan_id whose value always equals the assessment's installment_plan_id, so assessments can be listed per plan without a second join"
      - name: device_model
        type: string
        source: input
        description: "Model identifier of the device being traded in"
      - name: declared_condition
        type: enum
        source: input
        description: "Condition the customer self-reported at submission"
        constraints: "enum {FLAWLESS, GOOD, FAIR, POOR, BROKEN}"
      - name: graded_condition
        type: enum
        source: computed
        description: "Condition assigned by the receiving inspection"
        constraints: "enum {FLAWLESS, GOOD, FAIR, POOR, BROKEN}"
      - name: assessment_state
        type: enum
        source: system
        description: "Trade-in assessment lifecycle state"
        default: SUBMITTED
        constraints: "enum {SUBMITTED, GRADED}"
      - name: estimated_credit_cents
        type: integer
        source: computed
        description: "Quote credit from calculation trade_in_credit_assessment, estimated variant keyed on declared_condition"
        default: 0
      - name: final_credit_cents
        type: integer
        source: computed
        description: "Settled credit from calculation trade_in_credit_assessment, graded variant keyed on graded_condition"
        default: 0
      - name: grade_delta_cents
        type: integer
        source: computed
        description: "final_credit_cents minus estimated_credit_cents; negative when the device graded worse than declared"
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant the assessment entered assessment_state SUBMITTED"
      - name: graded_at
        type: datetime
        source: system
        description: "Instant the assessment entered assessment_state GRADED"

  - name: NumberReservation
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account holding the reserved number"
      - name: mdn
        type: string
        source: input
        description: "Ten-digit directory number being held"
      - name: pool_code
        type: string
        source: input
        description: "Number pool the directory number belongs to"
      - name: reservation_state
        type: enum
        source: system
        description: "Reservation lifecycle state"
        default: HELD
        constraints: "enum {HELD, COMMITTED, EXPIRED}"
      - name: reserved_at
        type: datetime
        source: system
        description: "Instant the reservation entered reservation_state HELD; inclusive lower bound of the hold interval"
      - name: reserved_until
        type: datetime
        source: input
        description: "Exclusive upper bound of the hold interval; computed from reserved_at plus hold_days when omitted"
      - name: hold_days
        type: integer
        source: input
        description: "Number of days the directory number is held from reserved_at"
        default: 45
      - name: committed_line_id
        type: string
        source: computed
        description: "Id of the SubscriberLine the number was committed to, null when not committed"

  - name: MigrationRequest
    parent: null
    common_fields: true
    fields:
      - name: subscriber_line_id
        type: string
        source: input
        description: "FK -> SubscriberLine.id; line being migrated from prepaid to postpaid"
      - name: source_billing_mode
        type: enum
        source: input
        description: "Billing mode the line is leaving"
        default: PREPAID
        constraints: "enum {PREPAID}"
      - name: target_billing_mode
        type: enum
        source: input
        description: "Billing mode the line is entering"
        default: POSTPAID
        constraints: "enum {POSTPAID}"
      - name: migration_state
        type: enum
        source: system
        description: "Migration workflow state"
        default: DRAFT
        constraints: "enum {DRAFT, ELIGIBILITY_CHECK, BLOCKED, APPROVED, CUTOVER_SCHEDULED, CUTOVER_COMPLETE}"
      - name: carried_mdn
        type: string
        source: computed
        description: "Directory number preserved across the migration; equals the attached SubscriberLine.mdn"
      - name: prepaid_balance_cents
        type: integer
        source: input
        description: "Remaining prepaid wallet balance to be carried onto the postpaid account"
        default: 0
      - name: device_balance_cents
        type: integer
        source: computed
        description: "Outstanding installment balance carried onto the postpaid account"
        default: 0
      - name: proration_credit_cents
        type: integer
        source: computed
        description: "Mid-cycle proration credit from calculation migration_proration_credit"
        default: 0
      - name: requested_cutover_at
        type: datetime
        source: input
        description: "Instant the customer asked the migration to take effect"
      - name: cutover_completed_at
        type: datetime
        source: system
        description: "Instant the migration entered migration_state CUTOVER_COMPLETE"

  - name: LineAdditionRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account the new lines are added to"
      - name: parent_account_id
        type: string
        source: computed
        description: "Mirror of account_id whose value always equals the request's account_id, so requests can be listed per account without a second join"
      - name: line_count
        type: integer
        source: input
        description: "Number of lines requested in this addition"
        constraints: "1 <= line_count <= 10"
      - name: requested_mdn
        type: string
        source: input
        description: "Directory number the customer asked to reserve for the first new line, null to let the system choose"
      - name: determined_credit_class
        type: enum
        source: computed
        description: "Credit class assigned by calculation credit_class_determination when the request is decided"
        constraints: "enum {CLASS_A, CLASS_B, CLASS_C, CLASS_D, BLOCKED}"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Deposit the customer must pay for this addition, derived from determined_credit_class"
        default: 0
      - name: request_state
        type: enum
        source: system
        description: "Line addition decision state"
        default: SUBMITTED
        constraints: "enum {SUBMITTED, APPROVED, DECLINED}"
      - name: decision_note
        type: string
        source: computed
        description: "Operator-facing note recorded on the decision"
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant the request entered request_state SUBMITTED"

  - name: PortProtectionCase
    parent: null
    common_fields: true
    fields:
      - name: subscriber_line_id
        type: string
        source: input
        description: "Identifies the SubscriberLine the protection applies to; a case is retrieved by its own id"
      - name: protection_type
        type: enum
        source: input
        description: "Kind of port-out protection being requested"
        constraints: "enum {ACCOUNT_PIN, PORT_FREEZE, FRAUD_HOLD}"
      - name: verified_identity
        type: boolean
        source: input
        description: "Whether the requesting party passed identity verification"
        default: false
      - name: case_state
        type: enum
        source: system
        description: "Protection case lifecycle state"
        default: REQUESTED
        constraints: "enum {REQUESTED, ACTIVE, CLEARED, DENIED}"
      - name: set_at
        type: datetime
        source: system
        description: "Instant the case entered case_state ACTIVE"
      - name: cleared_at
        type: datetime
        source: system
        description: "Instant the case entered case_state CLEARED"
      - name: reason_code
        type: string
        source: input
        description: "Operator reason for opening the protection case"

  - name: RejectionCodeCatalog
    parent: null
    common_fields: false
    fields:
      - name: rejection_code
        type: string
        source: input
        description: "Carrier-returned rejection code"
        constraints: "unique across the catalog"
      - name: description
        type: string
        source: input
        description: "Plain-language explanation of the rejection"
      - name: guidance_text
        type: string
        source: input
        description: "Customer-facing remediation guidance surfaced on the rejection event"
      - name: resubmission_allowed
        type: boolean
        source: input
        description: "Whether a port request carrying this code may be resubmitted"
        default: true
      - name: retry_after_hours
        type: integer
        source: input
        description: "Cooling-off hours that must elapse between the rejection and an allowed resubmission"
        default: 0
      - name: requires_action_by
        type: enum
        source: input
        description: "Party responsible for clearing the rejection"
        constraints: "enum {CUSTOMER, LOSING_CARRIER, GAINING_CARRIER}"

  - name: SystemConfig
    parent: null
    common_fields: true
    fields:
      - name: ops_run_epoch
        type: integer
        source: system
        description: "Ops-run epoch counter, advanced only by POST /system-config/ops-run"
        default: 1
      - name: last_ops_run_at
        type: datetime
        source: system
        description: "Instant of the most recent ops run; starts at the clock default 2026-09-01T00:00:00Z"
        default: "2026-09-01T00:00:00Z"
      - name: last_line_cancellation_deadline
        type: datetime
        source: system
        description: "Deadline opened by the most recent line cancellation; an ops run is idempotent while the clock reads at or before this instant"
        default: "2026-09-01T00:00:00Z"
      - name: line_cancellation_grace_hours
        type: integer
        source: input
        description: "Grace hours added to the cancellation instant when stamping last_line_cancellation_deadline"
        default: 24
      - name: promo_window_buffer_days
        type: integer
        source: input
        description: "Buffer days that must separate a new promotional credit window from the end of an existing one on the same line"
        default: 30
state_machines:
  - entity: PortRequest
    initial_state: DRAFT
    terminal_states: [PORTED, CANCELLED]
    shape: branching
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "POST /port-requests/{id}/submit"
        actor: CustomerService
        preconditions:
          - "PortRequest.subscriber_line_id resolves to a SubscriberLine whose number_status is UNASSIGNED or RESERVED"
          - "PortRequest.transfer_pin is exactly 4 digits"
          - "PortRequest.requested_cutover_at is at or after the current logical clock instant"
        side_effects:
          - "sets PortRequest.submitted_at to the current logical clock instant"
          - "sets SubscriberLine.number_status to RESERVED on the attached line"
      - from: PENDING
        to: REJECTED
        trigger: "POST /port-requests/{id}/rejections"
        actor: PlatformAdmin
        preconditions:
          - "PortRequest.request_state is PENDING"
          - "the submitted rejection_code exists in RejectionCodeCatalog"
        side_effects:
          - "appends an entry to PortRequest.rejections carrying rejection_code, guidance_text, resubmission_allowed and retry_after_hours copied from the matching RejectionCodeCatalog row"
          - "recomputes PortRequest.rejection_count as the number of entries in PortRequest.rejections"
          - "sets PortRequest.last_rejection_code to the supplied rejection_code"
          - "sets SubscriberLine.number_status to UNASSIGNED on the attached line, releasing the reserved number"
      - from: REJECTED
        to: RESUBMITTED
        trigger: "POST /port-requests/{id}/resubmit"
        actor: CustomerService
        preconditions:
          - "PortRequest.request_state is REJECTED"
          - "PortRequest.last_rejection_code resolves to a RejectionCodeCatalog row whose resubmission_allowed is true"
          - "the current logical clock instant is at or after PortRequest.last_rejection_at plus RejectionCodeCatalog.retry_after_hours"
          - "no SubscriberLine holds this request's mdn with number_status RESERVED as of the current logical clock instant"
        side_effects:
          - "sets PortRequest.request_state to RESUBMITTED and PortRequest.submitted_at to the current logical clock instant"
          - "sets SubscriberLine.number_status to RESERVED on the attached line"
          - "increments SubscriberLine.retention_cycle_count by 1 when the attached line's billing_mode is PREPAID"
          - "when the attached SubscriberLine.port_protection_status is PROTECTED, also sets the ACTIVE PortProtectionCase.case_state to CLEARED and sets SubscriberLine.port_protection_status to UNPROTECTED"
      - from: PENDING
        to: ACCEPTED_PENDING_CUTOVER
        trigger: "POST /port-requests/{id}/accept"
        actor: PlatformAdmin
        preconditions:
          - "PortRequest.request_state is PENDING"
          - "PortRequest.requested_cutover_at is at or after the current logical clock instant"
        side_effects:
          - "recomputes PortRequest.updated_at"
      - from: RESUBMITTED
        to: ACCEPTED_PENDING_CUTOVER
        trigger: "POST /port-requests/{id}/accept"
        actor: PlatformAdmin
        preconditions:
          - "PortRequest.request_state is RESUBMITTED"
          - "PortRequest.requested_cutover_at is at or after the current logical clock instant"
        side_effects:
          - "recomputes PortRequest.updated_at"
      - from: ACCEPTED_PENDING_CUTOVER
        to: PORTED
        trigger: "system event: the logical clock reaches PortRequest.requested_cutover_at"
        actor: system
        preconditions:
          - "PortRequest.request_state is ACCEPTED_PENDING_CUTOVER"
          - "the current logical clock instant is at or after PortRequest.requested_cutover_at"
        side_effects:
          - "hop 1: sets PortRequest.cutover_completed_at to the current logical clock instant, then sets SubscriberLine.service_status to ACTIVE and SubscriberLine.number_status to PORTED_IN on the attached line"
          - "hop 2: because SubscriberLine.service_status just became ACTIVE, sets SubscriberLine.line_opened_at to the current logical clock instant when it is null"
          - "hop 3: because SubscriberLine.line_opened_at was just stamped, recomputes SubscriberLine.loyalty_tenure_months and SubscriberLine.retention_cycle_count"
          - "hop 4: because SubscriberLine.retention_cycle_count was just recomputed, sets the attached line's PromoCreditSchedule row whose schedule_state is PROVISIONAL to schedule_state ACTIVE when retention_cycle_count is at or above its retention_requirement_cycles"
          - "sets Account.account_status to OPEN on the attached line's account"
      - from: REJECTED
        to: CANCELLED
        trigger: "POST /port-requests/{id}/cancel"
        actor: CustomerService
        preconditions:
          - "PortRequest.request_state is REJECTED"
          - "PortRequest.rejection_count is at or above 3"
        side_effects:
          - "recomputes PortRequest.updated_at"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /port-requests/{id}/cancel"
        actor: CustomerService
        preconditions:
          - "PortRequest.request_state is PENDING"
        side_effects:
          - "sets SubscriberLine.number_status to UNASSIGNED on the attached line"

  - entity: MigrationRequest
    initial_state: DRAFT
    terminal_states: [BLOCKED, CUTOVER_COMPLETE]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: ELIGIBILITY_CHECK
        trigger: "POST /migration-requests/{id}/check-eligibility"
        actor: CustomerService
        preconditions:
          - "the attached SubscriberLine.billing_mode is PREPAID"
        side_effects:
          - "recomputes MigrationRequest.updated_at"
      - from: ELIGIBILITY_CHECK
        to: BLOCKED
        trigger: "system event: the eligibility evaluation finds the line PROTECTED or carrying an open port request"
        actor: system
        preconditions:
          - "the attached SubscriberLine.port_protection_status is PROTECTED, or an open PortRequest on the attached line is in request_state PENDING or RESUBMITTED"
        side_effects:
          - "sets the attached SubscriberLine.number_status to UNASSIGNED"
          - "sets Account.account_status to SUSPENDED on the attached line's account when the attached SubscriberLine.port_protection_status is PROTECTED"
          - "recomputes MigrationRequest.updated_at"
      - from: ELIGIBILITY_CHECK
        to: APPROVED
        trigger: "system event: the eligibility evaluation finds no open obligation"
        actor: system
        preconditions:
          - "the attached SubscriberLine.port_protection_status is UNPROTECTED"
          - "no PortRequest on the attached line is in request_state PENDING or RESUBMITTED"
        side_effects:
          - "sets the attached SubscriberLine.number_status to RESERVED"
          - "recomputes MigrationRequest.updated_at"
      - from: APPROVED
        to: ELIGIBILITY_CHECK
        trigger: "POST /migration-requests/{id}/check-eligibility"
        actor: CustomerService
        preconditions:
          - "MigrationRequest.migration_state is APPROVED"
          - "the attached line's PortProtectionCase has been CLEARED since the last evaluation"
        side_effects:
          - "recomputes MigrationRequest.updated_at"
      - from: APPROVED
        to: CUTOVER_SCHEDULED
        trigger: "system event: requested_cutover_at is set to an instant at or after the current logical clock instant"
        actor: system
        preconditions:
          - "MigrationRequest.migration_state is APPROVED"
          - "MigrationRequest.requested_cutover_at is at or after the current logical clock instant"
        side_effects:
          - "recomputes MigrationRequest.updated_at"
      - from: CUTOVER_SCHEDULED
        to: CUTOVER_COMPLETE
        trigger: "system event: the logical clock reaches MigrationRequest.requested_cutover_at"
        actor: system
        preconditions:
          - "MigrationRequest.migration_state is CUTOVER_SCHEDULED"
          - "the current logical clock instant is at or after MigrationRequest.requested_cutover_at"
        side_effects:
          - "hop 1: sets MigrationRequest.cutover_completed_at to the current logical clock instant and sets SubscriberLine.billing_mode to POSTPAID with SubscriberLine.number_status ASSIGNED on the attached line"
          - "hop 2: because SubscriberLine.billing_mode just became POSTPAID, sets MigrationRequest.carried_mdn to the attached SubscriberLine.mdn and MigrationRequest.device_balance_cents to the sum of remaining_balance_cents over DeviceInstallmentPlan rows attached to that line"
          - "hop 3: because MigrationRequest.device_balance_cents was just set, computes MigrationRequest.proration_credit_cents via calculation migration_proration_credit"
          - "sets the attached DeviceInstallmentPlan.plan_state to CONVERTED"
          - "recomputes SubscriberLine.loyalty_tenure_months and SubscriberLine.retention_cycle_count"

  - entity: LineAdditionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /line-addition-requests/{id}/review with decision APPROVE"
        actor: CreditAnalyst
        preconditions:
          - "LineAdditionRequest.request_state is SUBMITTED"
          - "the computed determined_credit_class is not BLOCKED"
          - "the attached Account.existing_deposit_cents is at or above the computed required_deposit_cents"
          - "the count of SubscriberLine rows on the attached Account with service_status ACTIVE, plus LineAdditionRequest.line_count, is at or below 10"
        side_effects:
          - "sets LineAdditionRequest.determined_credit_class and LineAdditionRequest.required_deposit_cents via calculation credit_class_determination review variant"
          - "sets Account.credit_class and Account.deposit_required_cents to the determined values on the attached account"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /line-addition-requests/{id}/review with decision DECLINE"
        actor: CreditAnalyst
        preconditions:
          - "LineAdditionRequest.request_state is SUBMITTED"
        side_effects:
          - "sets LineAdditionRequest.determined_credit_class and LineAdditionRequest.required_deposit_cents via calculation credit_class_determination review variant"
          - "sets Account.credit_class to BLOCKED on the attached account when the determined class is BLOCKED"

  - entity: NumberReservation
    initial_state: HELD
    terminal_states: [COMMITTED, EXPIRED]
    shape: branching
    transitions:
      - from: HELD
        to: COMMITTED
        trigger: "POST /number-reservations/{id}/commit"
        actor: PlatformAdmin
        preconditions:
          - "NumberReservation.reservation_state is HELD"
          - "the current logical clock instant is strictly before NumberReservation.reserved_until"
          - "the named SubscriberLine.number_status is UNASSIGNED"
        side_effects:
          - "sets NumberReservation.committed_line_id to the supplied subscriber_line_id"
          - "sets SubscriberLine.number_status to ASSIGNED on the named line"
          - "sets SubscriberLine.mdn to NumberReservation.mdn on the named line"
          - "sets Account.reserved_mdn_count to the count of NumberReservation rows on the account with reservation_state HELD"
      - from: HELD
        to: EXPIRED
        trigger: "system event: the logical clock reaches NumberReservation.reserved_until"
        actor: system
        preconditions:
          - "NumberReservation.reservation_state is HELD"
          - "the current logical clock instant is at or after NumberReservation.reserved_until"
        side_effects:
          - "sets Account.reserved_mdn_count to the count of NumberReservation rows on the account with reservation_state HELD"

  - entity: PortProtectionCase
    initial_state: REQUESTED
    terminal_states: [CLEARED, DENIED]
    shape: cyclic
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /port-protection-cases/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "PortProtectionCase.case_state is REQUESTED"
          - "PortProtectionCase.verified_identity is true"
        side_effects:
          - "sets PortProtectionCase.set_at to the current logical clock instant"
          - "sets SubscriberLine.port_protection_status to PROTECTED on the attached line"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /port-protection-cases/{id}/deny"
        actor: PlatformAdmin
        preconditions:
          - "PortProtectionCase.case_state is REQUESTED"
        side_effects:
          - "recomputes PortProtectionCase.updated_at"
      - from: ACTIVE
        to: CLEARED
        trigger: "POST /port-protection-cases/{id}/clear"
        actor: PlatformAdmin
        preconditions:
          - "PortProtectionCase.case_state is ACTIVE"
        side_effects:
          - "sets PortProtectionCase.cleared_at to the current logical clock instant"
          - "sets SubscriberLine.port_protection_status to UNPROTECTED on the attached line"
  - entity: PromoCreditSchedule
    initial_state: PROVISIONAL
    terminal_states: [VESTED, CLAWED_BACK]
    shape: compound
    transitions:
      - from: PROVISIONAL
        to: ACTIVE
        trigger: "POST /promo-credit-schedules/{id}/activate"
        actor: CustomerService
        preconditions:
          - "PromoCreditSchedule.schedule_state is PROVISIONAL"
          - "the current logical clock instant is at or after PromoCreditSchedule.window_start"
        side_effects:
          - "recomputes Account.net_promo_credit_cents"
      - from: ACTIVE
        to: VESTED
        trigger: "system event: the logical clock reaches PromoCreditSchedule.window_end and the line has retained service"
        actor: system
        preconditions:
          - "PromoCreditSchedule.schedule_state is ACTIVE"
          - "the current logical clock instant is at or after PromoCreditSchedule.window_end"
        side_effects:
          - "sets PromoCreditSchedule.vested_total_cents via calculation port_in_promo_credit_projection vested variant"
          - "sets SubscriberLine.promo_eligibility_state to VESTED"
          - "recomputes Account.net_promo_credit_cents"
      - from: ACTIVE
        to: CLAWED_BACK
        trigger: "POST /promo-credit-schedules/{id}/claw-back"
        actor: PlatformAdmin
        preconditions:
          - "PromoCreditSchedule.schedule_state is ACTIVE"
        side_effects:
          - "hop 1: sets PromoCreditSchedule.schedule_state to CLAWED_BACK and PromoCreditSchedule.vested_total_cents to 0, then sets SubscriberLine.promo_eligibility_state to CLAWED_BACK on the attached line"
          - "hop 2: because SubscriberLine.promo_eligibility_state just became CLAWED_BACK, increments the attached line's DeviceInstallmentPlan.remaining_balance_cents by PromoCreditSchedule.provisional_total_cents"
          - "hop 3: because DeviceInstallmentPlan.remaining_balance_cents just increased, recomputes DeviceInstallmentPlan.monthly_installment_cents and DeviceInstallmentPlan.plan_state via calculation device_installment_balance"
          - "increments Account.promo_clawed_back_cents on the attached line's account by calculation promo_clawback_reversal output and recomputes Account.net_promo_credit_cents"
  - entity: TradeInAssessment
    initial_state: SUBMITTED
    terminal_states: [GRADED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: GRADED
        trigger: "POST /trade-in-assessments/{id}/grade"
        actor: TradeInInspector
        preconditions:
          - "TradeInAssessment.assessment_state is SUBMITTED"
        side_effects:
          - "sets TradeInAssessment.graded_condition to the supplied condition"
          - "sets TradeInAssessment.graded_at to the current logical clock instant"
          - "sets TradeInAssessment.final_credit_cents via calculation trade_in_credit_assessment final variant"
          - "sets TradeInAssessment.estimated_credit_cents via calculation trade_in_credit_assessment estimated_variant"
          - "sets TradeInAssessment.grade_delta_cents to final_credit_cents minus estimated_credit_cents"
          - "sets the attached DeviceInstallmentPlan.trade_in_credit_cents to final_credit_cents"
          - "sets DeviceInstallmentPlan.remaining_balance_cents to max(device_price_cents minus down_payment_cents minus final_credit_cents, 0) on the attached plan"
          - "recomputes DeviceInstallmentPlan.plan_state"
concurrency_rules:
  - rule_id: promo-schedule-create-stale-line
    parent_entity: SubscriberLine
    write_endpoint: "POST /promo-credit-schedules"
    occ_field: "expected_subscriber_line_version"
    description: |
      Creating a PromoCreditSchedule against a SubscriberLine whose version has
      advanced since the client last observed it is rejected, because the product
      allows a new promotional schedule to supersede the line's prior promotional
      posture and the current writer's view of the line is therefore stale
      relative to the version the server now holds.
    error_id: ERR_STALE_SUBSCRIBER_LINE_VERSION
    http_status: 412
  - rule_id: installment-plan-create-stale-line
    parent_entity: SubscriberLine
    write_endpoint: "POST /device-installment-plans"
    occ_field: "expected_subscriber_line_version"
    description: |
      Creating a DeviceInstallmentPlan quote against a SubscriberLine whose
      version has advanced since the client last observed it is rejected, because
      the product allows a new quote to supersede the line's prior QUOTED plan and
      the current writer's view of the line is therefore stale relative to the
      version the server now holds.
    error_id: ERR_STALE_SUBSCRIBER_LINE_VERSION
    http_status: 412

calculations:
  - name: port_in_promo_credit_projection
    trigger: "on POST /promo-credit-schedules (provisional_total_cents) and on the PromoCreditSchedule ACTIVE->VESTED system transition (vested_total_cents)"
    algorithm: forward_looking
    formula: |
      # two valid readings of "the credit for switching applied over an installment period"
      BASE_CREDIT_CENTS = 20000
      MONTHLY_BASE_CENTS = 1000
      billable_months = min(installment_months, retention_requirement_cycles)
      # PROVISIONAL (forward-looking): projects the full intended window, including
      # the line-retention bonus, against the retention cycle count the line will
      # reach at window_end.
      provisional_total_cents = BASE_CREDIT_CENTS + MONTHLY_BASE_CENTS * billable_months
      # VESTED (chronological): credits only cycles the line has actually completed
      # inside the window; the retention bonus is deferred until the line's
      # retention_cycle_count reaches retention_requirement_cycles.
      vested_total_cents = MONTHLY_BASE_CENTS * cycles_elapsed
      # reading 2 (FORBIDDEN as settled value): treat vested_total_cents as the
      # sentence reading the total is already fully earned.
    input_set: "only PromoCreditSchedule rows whose schedule_state is in {PROVISIONAL, ACTIVE, VESTED}; rows in CLAWED_BACK are excluded"
    constants:
      BASE_CREDIT_CENTS: 20000
      MONTHLY_BASE_CENTS: 1000
      promo_window_buffer_days: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "evaluated at POST /promo-credit-schedules, while schedule_state is PROVISIONAL"
        difference: "includes BASE_CREDIT_CENTS and credits min(installment_months, retention_requirement_cycles) months as if all were already completed"
      - name: vested
        when: "evaluated on the ACTIVE->VESTED transition, once the line has retained service"
        difference: "credits MONTHLY_BASE_CENTS * cycles_elapsed only; for identical data with cycles_elapsed < billable_months it is strictly smaller than the provisional variant"

  - name: trade_in_credit_assessment
    trigger: "on the TradeInAssessment SUBMITTED->GRADED and DISPUTED->GRADED transitions"
    algorithm: threshold
    formula: |
      GRADE_VALUE_CENTS = {FLAWLESS: 60000, GOOD: 42000, FAIR: 24000, POOR: 8000, BROKEN: 0}
      # ESTIMATED variant: keyed on the customer's self-reported declared_condition
      estimated_credit_cents = GRADE_VALUE_CENTS[declared_condition]
      # FINAL variant: keyed on the inspector's graded_condition
      final_credit_cents = GRADE_VALUE_CENTS[graded_condition]
      grade_delta_cents = final_credit_cents - estimated_credit_cents
    input_set: "evaluated per TradeInAssessment row; declared_condition and graded_condition are both read even when they are equal"
    constants:
      FLAWLESS: 60000
      GOOD: 42000
      FAIR: 24000
      POOR: 8000
      BROKEN: 0
    precision: "integer cents, round_half_up"
    variants:
      - name: estimated_variant
        when: "the assessment is quoted before inspection"
        difference: "keyed on declared_condition and written to estimated_credit_cents and to DeviceInstallmentPlan.trade_in_credit_cents until grading occurs"
      - name: final_variant
        when: "the assessment has been graded or regraded"
        difference: "keyed on graded_condition and written to final_credit_cents; grade_delta_cents is negative whenever the device graded worse than declared"

  - name: credit_class_determination
    trigger: "on POST /line-addition-requests/{id}/review (determined_credit_class, required_deposit_cents) and on POST /line-addition-requests/{id}/provision (Account.credit_class, Account.deposit_required_cents)"
    algorithm: threshold
    formula: |
      lines_after = account.active_line_count + request.line_count
      raw_class =
        BLOCKED  if payment_history_score < 300
        CLASS_D  if 300 <= payment_history_score < 500
        CLASS_C  if 500 <= payment_history_score < 650
        CLASS_B  if 650 <= payment_history_score < 800
        CLASS_A  if payment_history_score >= 800
      determined_credit_class = CLASS_C if (lines_after >= 5 and raw_class in {CLASS_A, CLASS_B}) else raw_class
      CLASS_DEPOSIT_CENTS = {CLASS_A: 0, CLASS_B: 10000, CLASS_C: 25000, CLASS_D: 50000, BLOCKED: 0}
      required_deposit_cents = CLASS_DEPOSIT_CENTS[determined_credit_class]
    input_set: "evaluated against Account.active_line_count as observed at evaluation time, plus LineAdditionRequest.line_count; SubscriberLine rows with service_status in {SUSPENDED, CANCELLED} are excluded from active_line_count"
    constants:
      SCORE_BLOCKED_CEILING: 299
      SCORE_CLASS_D_FLOOR: 300
      SCORE_CLASS_C_FLOOR: 500
      SCORE_CLASS_B_FLOOR: 650
      SCORE_CLASS_A_FLOOR: 800
      FAMILY_TIER_LINE_THRESHOLD: 5
      DEPOSIT_CLASS_B_CENTS: 10000
      DEPOSIT_CLASS_C_CENTS: 25000
      DEPOSIT_CLASS_D_CENTS: 50000
    precision: "integer cents, round_half_up"
    variants:
      - name: review_variant
        when: "evaluated at POST /line-addition-requests/{id}/review"
        difference: "returns the class and deposit on the request only; Account.credit_class is left untouched"
      - name: provision_variant
        when: "evaluated at POST /line-addition-requests/{id}/provision"
        difference: "re-evaluates with the post-addition active_line_count and also overwrites Account.credit_class and Account.deposit_required_cents"

  - name: device_installment_balance
    trigger: "on POST /device-installment-plans, on the TradeInAssessment GRADED transitions, and on the PromoCreditSchedule ACTIVE->CLAWED_BACK transition"
    algorithm: aggregation
    formula: |
      financed_balance_cents = max(device_price_cents - down_payment_cents, 0)
      # ROUNDING ORDER IS PINNED: floor the per-installment amount first, then give
      # the entire remainder to the FIRST installment. The other valid reading
      # (round(financed_balance_cents / installment_months) and multiply back out)
      # produces a different first installment and different cents.
      monthly_installment_cents = financed_balance_cents // installment_months
      first_installment_cents = financed_balance_cents - monthly_installment_cents * (installment_months - 1)
      remaining_balance_cents = financed_balance_cents - trade_in_credit_cents
      upgrade_eligible_at = financed_at + (installment_months // 2) billing cycles
    input_set: "exactly one DeviceInstallmentPlan row per SubscriberLine; DeviceInstallmentPlan rows in plan_state CONVERTED are excluded from upgrade_eligible_at evaluation"
    constants:
      UPGRADE_PORTION_NUMERATOR: 1
      UPGRADE_PORTION_DENOMINATOR: 2
      DAYS_PER_BILLING_CYCLE: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: quote_variant
        when: "evaluated at POST /device-installment-plans before a trade-in is graded"
        difference: "trade_in_credit_cents is 0, so remaining_balance_cents equals financed_balance_cents"
      - name: settled_variant
        when: "evaluated after a TradeInAssessment enters GRADED"
        difference: "remaining_balance_cents subtracts the graded trade-in credit; it floors at 0 rather than going negative"

  - name: migration_proration_credit
    trigger: "on the MigrationRequest CUTOVER_SCHEDULED->CUTOVER_COMPLETE system transition"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED (do not reorder):
      # 1. lines_after = Account.active_line_count + 1   (the migration itself adds the line)
      # 2. tier = min(lines_after, 4)
      # 3. plan_rate_cents = TIER_RATE_CENTS[tier]
      # 4. remaining_days = DAYS_IN_CYCLE - day_of_month(current logical clock instant)
      # 5. proration_component_cents = round_half_up(plan_rate_cents * remaining_days / DAYS_IN_CYCLE)
      # 6. carry_component_cents = round_half_up(CARRY_WEIGHT * (prepaid_balance_cents + device_balance_cents))
      # 7. proration_credit_cents = proration_component_cents + carry_component_cents
      TIER_RATE_CENTS = {1: 5000, 2: 4000, 3: 3000, 4: 2500}
      DAYS_IN_CYCLE = 30
      CARRY_WEIGHT = 0.50
    input_set: "reads prepaid_balance_cents from the MigrationRequest, device_balance_cents from the sum of remaining_balance_cents over DeviceInstallmentPlan rows attached to the subscriber line, and active_line_count from the account as observed BEFORE this migration's line is counted"
    constants:
      TIER_RATE_1_CENTS: 5000
      TIER_RATE_2_CENTS: 4000
      TIER_RATE_3_CENTS: 3000
      TIER_RATE_4_CENTS: 2500
      DAYS_IN_CYCLE: 30
      CARRY_WEIGHT: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: full_cycle_variant
        when: "the cutover lands on day_of_month 1"
        difference: "remaining_days is 29, so the proration component is the largest possible for the tier"
      - name: last_day_variant
        when: "the cutover lands on day_of_month 30 or 31"
        difference: "remaining_days is 0 or negative and is floored to 0, so proration_component_cents is exactly 0 and only the carry component contributes"

  - name: promo_clawback_reversal
    trigger: "on the PromoCreditSchedule ACTIVE->CLAWED_BACK transition"
    algorithm: aggregation
    formula: |
      # The reversal is the exact credited amount for the schedule, so a
      # create-then-claw-back pair nets to zero on Account.net_promo_credit_cents.
      clawback_amount_cents = schedule.provisional_total_cents
      Account.promo_clawed_back_cents += clawback_amount_cents
      Account.net_promo_credit_cents = Account.promo_credited_cents - Account.promo_clawed_back_cents
    input_set: "evaluated per PromoCreditSchedule row entering CLAWED_BACK; only the schedule's own provisional_total_cents is read, never the account's running total"
    constants:
      CLAWBACK_FRACTION_NUMERATOR: 1
      CLAWBACK_FRACTION_DENOMINATOR: 1
    precision: "integer cents, round_half_up"
    variants:
      - name: active_variant
        when: "the schedule is clawed back before its window_end"
        difference: "vested_total_cents for the schedule is set to 0 in the same transition"
      - name: vested_variant
        when: "the schedule is clawed back at or after its window_end"
        difference: "vested_total_cents is retained on the schedule row for audit while the account-level reversal stays identical"



validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the calling role is permitted for the operation per §1.7 and the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "the SubscriberLine named by the path or by subscriber_line_id exists"
    error_id: ERR_SUBSCRIBER_LINE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming a subscriber line"
  - priority: 4
    category: existence
    check: "the Account named by the path or by account_id exists"
    error_id: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints naming an account"
  - priority: 5
    category: existence
    check: "the PortRequest named by the path exists"
    error_id: ERR_PORT_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /port-requests/{id}"
  - priority: 6
    category: existence
    check: "the NumberReservation named by the path exists"
    error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints under /number-reservations/{id}"
  - priority: 7
    category: state
    check: "the target resource is in a state that permits the requested operation, per the matching §1.2 transition's from: value"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "the attached SubscriberLine.port_protection_status is UNPROTECTED at submission time"
    error_id: ERR_PORT_PROTECTION_ACTIVE
    http_status: 403
    applies_to: "POST /portability/port-requests/{id}/submit, POST /portability/port-requests/{id}/resubmit"
  - priority: 9
    category: business_safety
    check: "transfer_pin is exactly 4 digits and matches the account_number_at_losing_carrier supplied on the same request"
    error_id: ERR_TRANSFER_PIN_MISMATCH
    http_status: 422
    applies_to: "POST /portability/port-requests/{id}/submit, POST /portability/port-requests/{id}/resubmit"
  - priority: 10
    category: business_safety
    check: "the PortRequest's most recent recorded rejection_code resolves to a RejectionCodeCatalog row whose resubmission_allowed is true"
    error_id: ERR_RESUBMISSION_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /portability/port-requests/{id}/resubmit"
  - priority: 11
    category: business_temporal
    check: "the current logical clock instant is at or after PortRequest.last_rejection_at plus RejectionCodeCatalog.retry_after_hours"
    error_id: ERR_RESUBMISSION_COOLDOWN
    http_status: 409
    applies_to: "POST /portability/port-requests/{id}/resubmit"
  - priority: 12
    category: business_constraint
    check: "no SubscriberLine holds this PortRequest's mdn with number_status RESERVED as of the current logical clock instant"
    error_id: ERR_MDN_ALREADY_RESERVED
    http_status: 409
    applies_to: "POST /portability/port-requests/{id}/submit, POST /portability/port-requests/{id}/resubmit"
  - priority: 13
    category: business_constraint
    check: "SubscriberLine.mdn is not already held by another SubscriberLine row whose number_status is ASSIGNED, RESERVED or PORTED_IN"
    error_id: ERR_MDN_CONFLICT
    http_status: 409
    applies_to: "POST /portability/subscriber-lines"
  - priority: 14
    category: business_temporal
    check: "the newly requested hold interval [reserved_at, reserved_until) does not overlap an existing NumberReservation on the same pool_code whose reservation_state is HELD, with reserved_at strictly earlier than the new reserved_at"
    error_id: ERR_RESERVATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /portability/number-reservations"
  - priority: 15
    category: business_temporal
    check: "the new PromoCreditSchedule window_start is at or after every existing PromoCreditSchedule.window_end on the same subscriber line plus SystemConfig.promo_window_buffer_days, for existing schedules whose schedule_state is in {PROVISIONAL, ACTIVE}"
    error_id: ERR_PROMO_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /portability/promo-credit-schedules"
  - priority: 16
    category: business_temporal
    check: "the current logical clock instant is strictly before NumberReservation.reserved_until"
    error_id: ERR_RESERVATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /portability/number-reservations/{id}/commit"
  - priority: 17
    category: business_referential
    check: "the DeviceInstallmentPlan named by installment_plan_id exists"
    error_id: ERR_INSTALLMENT_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /portability/trade-in-assessments"
  - priority: 18
    category: business_referential
    check: "the DeviceInstallmentPlan named by installment_plan_id is in plan_state ACTIVE when a trade-in credit is settled against it"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /portability/trade-in-assessments/{id}/grade"
  - priority: 19
    category: business_constraint
    check: "the requested LineAdditionRequest.line_count is between 1 and 10 inclusive"
    error_id: ERR_LINE_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /portability/line-addition-requests"
  - priority: 20
    category: business_fiscal
    check: "the count of SubscriberLine rows on the Account with service_status ACTIVE, plus LineAdditionRequest.line_count, is at or below 10"
    error_id: ERR_LINE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /portability/line-addition-requests/{id}/review"
  - priority: 21
    category: business_fiscal
    check: "Account.existing_deposit_cents is at or above LineAdditionRequest.required_deposit_cents"
    error_id: ERR_DEPOSIT_REQUIRED
    http_status: 402
    applies_to: "POST /portability/line-addition-requests/{id}/review"
  - priority: 22
    category: business_fiscal
    check: "LineAdditionRequest.determined_credit_class is not BLOCKED"
    error_id: ERR_CREDIT_CLASS_BLOCKED
    http_status: 403
    applies_to: "POST /portability/line-addition-requests/{id}/review"
  - priority: 23
    category: business_constraint
    check: "the PortProtectionCase requesting party has verified_identity equal to true"
    error_id: ERR_IDENTITY_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /portability/port-protection-cases/{id}/resolve"
  - priority: 24
    category: business_constraint
    check: "no other PortProtectionCase on the same subscriber line already has case_state ACTIVE when an activation is requested"
    error_id: ERR_PROTECTION_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /portability/port-protection-cases/{id}/resolve"
  - priority: 25
    category: business_constraint
    check: "the attached SubscriberLine.service_status is ACTIVE when a promotional credit is clawed back"
    error_id: ERR_LINE_NOT_ACTIVE
    http_status: 403
    applies_to: "POST /portability/promo-credit-schedules/{id}/claw-back"
  - priority: 26
    category: business_constraint
    check: "the supplied expected_subscriber_line_version equals SubscriberLine.version"
    error_id: ERR_STALE_SUBSCRIBER_LINE_VERSION
    http_status: 412
    applies_to: "POST /portability/promo-credit-schedules, POST /portability/device-installment-plans, POST /portability/port-requests"
  - priority: 27
    category: state
    check: "the attached SubscriberLine does not already carry a DeviceInstallmentPlan in plan_state ACTIVE when activation_at is supplied"
    error_id: ERR_DEVICE_PLAN_STATE
    http_status: 409
    applies_to: "POST /portability/device-installment-plans"
  - priority: 28
    category: business_constraint
    check: "every required input field for the operation is present and its type matches the §1.1 declaration"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent, or X-User-Role names no role declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the calling role is not listed in the endpoint's roles per §1.7"
  - id: ERR_SUBSCRIBER_LINE_NOT_FOUND
    http: 404
    condition: "no SubscriberLine exists for the supplied id or subscriber_line_id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no Account exists for the supplied id or account_id"
  - id: ERR_PORT_REQUEST_NOT_FOUND
    http: 404
    condition: "no PortRequest exists for the supplied id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no NumberReservation exists for the supplied id"
  - id: ERR_PROTECTION_CASE_NOT_FOUND
    http: 404
    condition: "no PortProtectionCase exists for the supplied id"
  - id: ERR_MIGRATION_REQUEST_NOT_FOUND
    http: 404
    condition: "no MigrationRequest exists for the supplied id"
  - id: ERR_LINE_ADDITION_REQUEST_NOT_FOUND
    http: 404
    condition: "no LineAdditionRequest exists for the supplied id"
  - id: ERR_TRADE_IN_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "no TradeInAssessment exists for the supplied id"
  - id: ERR_INSTALLMENT_PLAN_NOT_FOUND
    http: 404
    condition: "no DeviceInstallmentPlan exists for the supplied id or installment_plan_id"
  - id: ERR_REJECTION_CODE_NOT_FOUND
    http: 404
    condition: "the supplied rejection_code matches no RejectionCodeCatalog row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's state is not the from: state of the requested §1.2 transition"
  - id: ERR_DEVICE_PLAN_STATE
    http: 409
    condition: "the DeviceInstallmentPlan is not in plan_state QUOTED when an activation is requested"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "a trade-in credit is settled against a DeviceInstallmentPlan whose plan_state is not ACTIVE"
  - id: ERR_PORT_PROTECTION_ACTIVE
    http: 403
    condition: "the attached SubscriberLine.port_protection_status is PROTECTED, which blocks port submission and resubmission"
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 403
    condition: "a port-out protection case is activated while verified_identity is false"
  - id: ERR_PROTECTION_ALREADY_ACTIVE
    http: 409
    condition: "another PortProtectionCase on the same subscriber line already has case_state ACTIVE"
  - id: ERR_CREDIT_CLASS_BLOCKED
    http: 403
    condition: "credit_class_determination returns BLOCKED, so the addition is declined rather than approved"
  - id: ERR_LINE_NOT_ACTIVE
    http: 403
    condition: "the attached SubscriberLine.service_status is not ACTIVE"
  - id: ERR_DEPOSIT_REQUIRED
    http: 402
    condition: "Account.existing_deposit_cents is strictly below LineAdditionRequest.required_deposit_cents"
  - id: ERR_LINE_LIMIT_EXCEEDED
    http: 409
    condition: "active lines plus the requested line_count would exceed 10"
  - id: ERR_LINE_COUNT_OUT_OF_RANGE
    http: 422
    condition: "LineAdditionRequest.line_count is below 1 or above 10"
  - id: ERR_TRANSFER_PIN_MISMATCH
    http: 422
    condition: "the supplied transfer_pin is not exactly 4 digits, or does not match the account_number_at_losing_carrier on the same request"
  - id: ERR_RESUBMISSION_NOT_ALLOWED
    http: 422
    condition: "the PortRequest's most recent rejection_code resolves to a RejectionCodeCatalog row whose resubmission_allowed is false"
  - id: ERR_RESUBMISSION_COOLDOWN
    http: 409
    condition: "the current logical clock instant is strictly before PortRequest.last_rejection_at plus the catalog retry_after_hours"
  - id: ERR_MDN_ALREADY_RESERVED
    http: 409
    condition: "another SubscriberLine already holds this mdn with number_status RESERVED"
  - id: ERR_MDN_CONFLICT
    http: 409
    condition: "another SubscriberLine already holds this mdn with number_status ASSIGNED, RESERVED or PORTED_IN"
  - id: ERR_RESERVATION_WINDOW_OVERLAP
    http: 409
    condition: "the requested hold interval overlaps a HELD NumberReservation on the same pool_code"
  - id: ERR_RESERVATION_WINDOW_CLOSED
    http: 409
    condition: "a commit is requested at or after NumberReservation.reserved_until"
  - id: ERR_PROMO_WINDOW_OVERLAP
    http: 409
    condition: "the requested PromoCreditSchedule window starts inside an existing schedule's window plus the configured buffer"
  - id: ERR_STALE_SUBSCRIBER_LINE_VERSION
    http: 412
    condition: "the supplied expected_subscriber_line_version does not equal SubscriberLine.version"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or its type does not match the §1.1 declaration"

roles:
  - name: PlatformAdmin
    description: "Internal platform operator who performs carrier-facing, provisioning and audit operations"
    identity: "opaque"
    exclusive_operations:
      - "POST /portability/_clock/set_current_utc"
      - "POST /portability/system-config/ops-run"
      - "POST /portability/accounts"
      - "POST /portability/subscriber-lines"
      - "POST /portability/port-requests/{id}/rejections"
      - "POST /portability/number-reservations/{id}/commit"
      - "POST /portability/port-protection-cases/{id}/resolve"
      - "POST /portability/promo-credit-schedules/{id}/claw-back"
    shared_operations:
      - "POST /portability/port-requests"
      - "POST /portability/port-requests/{id}/submit"
      - "POST /portability/port-requests/{id}/resubmit"
      - "POST /portability/migration-requests"
      - "POST /portability/migration-requests/{id}/check-eligibility"
      - "POST /portability/device-installment-plans"
      - "POST /portability/trade-in-assessments"
      - "POST /portability/number-reservations"
      - "POST /portability/line-addition-requests"
      - "POST /portability/port-protection-cases"
      - "POST /portability/promo-credit-schedules"
      - "POST /portability/subscriber-lines/{id}/cancel"
  - name: CustomerService
    description: "Retail care agent who submits and maintains customer port-in, migration and credit requests"
    identity: "opaque"
    exclusive_operations:
    shared_operations:
      - "POST /portability/port-requests"
      - "POST /portability/port-requests/{id}/submit"
      - "POST /portability/port-requests/{id}/resubmit"
      - "POST /portability/migration-requests"
      - "POST /portability/migration-requests/{id}/check-eligibility"
      - "POST /portability/device-installment-plans"
      - "POST /portability/trade-in-assessments"
      - "POST /portability/number-reservations"
      - "POST /portability/line-addition-requests"
      - "POST /portability/port-protection-cases"
      - "POST /portability/promo-credit-schedules"
      - "POST /portability/subscriber-lines/{id}/cancel"
  - name: CreditAnalyst
    description: "Underwriter who determines credit class, deposit requirements and line-addition decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /portability/line-addition-requests/{id}/review"
    shared_operations: []
  - name: TradeInInspector
    description: "Warehouse grader who inspects traded-in devices"
    identity: "opaque"
    exclusive_operations:
      - "POST /portability/trade-in-assessments/{id}/grade"
    shared_operations: []
  - name: Customer
    description: "Account holder who reads their own account, lines and requests"
    identity: "entity_backed:Account"
    exclusive_operations: []
    shared_operations:
      - "GET /portability/port-requests/{id}"
      - "GET /portability/migration-requests/{id}"
      - "GET /portability/device-installment-plans/{id}"
      - "GET /portability/trade-in-assessments"
      - "GET /portability/promo-credit-schedules/{id}"
      - "GET /portability/system-config"





endpoints:
  - {method: POST, path: "/portability/_clock/set_current_utc", description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; before any call here the clock reads that default and never falls back to real wall-clock time. Advancing the clock evaluates every scheduled transition whose deadline has been reached.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: {current_utc: string, previous_utc: string}, side_effects: ["evaluates every scheduled transition whose deadline is at or before to_iso8601, including port cutover, migration cutover, promo vesting and reservation expiry"]}
  - {method: POST, path: "/portability/system-config/ops-run", description: "Advance the ops-run epoch and reclaim long-cancelled numbers; idempotent per deadline because it compares triggered_at against last_line_cancellation_deadline.", roles: [PlatformAdmin], code: 200, input: [triggered_at], output: SystemConfig, side_effects: ["increments ops_run_epoch by 1 and sets last_ops_run_at to triggered_at when triggered_at is strictly after last_line_cancellation_deadline", "leaves ops_run_epoch unchanged and sets last_ops_run_at to triggered_at when triggered_at is at or before last_line_cancellation_deadline", "when triggered_at is strictly after last_line_cancellation_deadline, sets number_status to RECLAIMED on every SubscriberLine whose service_status is CANCELLED and whose number_status is ASSIGNED"]}
  - {method: POST, path: "/portability/rejection-code-catalog", description: "Register a carrier rejection code with its customer guidance and resubmission policy.", roles: [PlatformAdmin], code: 201, input: [rejection_code, description, guidance_text, "resubmission_allowed?", "retry_after_hours?", requires_action_by], output: RejectionCodeCatalog, side_effects: []}
  - {method: POST, path: "/portability/accounts", description: "Open a billing account; the credit class and deposit requirement are derived on creation.", roles: [PlatformAdmin], code: 201, input: [account_type, tax_id_last4, "payment_history_score?", "existing_deposit_cents?"], output: Account, side_effects: ["recomputes Account.credit_class and Account.deposit_required_cents via calculation credit_class_determination"]}
  - {method: GET, path: "/portability/accounts/{id}", description: "Read one account, including its version, active_line_count, credit_class, deposit_required_cents and conservative promotional ledger fields.", roles: [PlatformAdmin, CustomerService, Customer], code: 200, input: [], output: Account, side_effects: []}
  - {method: GET, path: "/portability/subscriber-lines/{id}/device-installment-plans", description: "List the installment plans quoted or financed against one subscriber line.", roles: [PlatformAdmin, CustomerService, TradeInInspector, Customer], code: 200, input: [], output: "DeviceInstallmentPlan[]", side_effects: []}
  - {method: GET, path: "/portability/system-config", description: "Read the single SystemConfig row, including the ops-run epoch, the cancellation grace window and the promo window buffer.", roles: [PlatformAdmin, CustomerService, Customer], code: 200, input: [], output: SystemConfig, side_effects: []}
  - {method: POST, path: "/portability/subscriber-lines", description: "Create a subscriber line on an account in service_status PROVISIONED.", roles: [PlatformAdmin], code: 201, input: [account_id, mdn, "billing_mode?"], output: SubscriberLine, side_effects: ["sets Account.active_line_count to the count of SubscriberLine rows on the account with service_status ACTIVE", "recomputes Account.credit_class and Account.deposit_required_cents via calculation credit_class_determination"]}
  - {method: GET, path: "/portability/subscriber-lines/{id}", description: "Read one subscriber line, including its current version.", roles: [PlatformAdmin, CustomerService, CreditAnalyst, Customer], code: 200, input: [], output: SubscriberLine, side_effects: []}
  - {method: GET, path: "/portability/accounts/{id}/subscriber-lines", description: "List the subscriber lines owned by one account.", roles: [PlatformAdmin, CustomerService, CreditAnalyst, Customer], code: 200, input: [], output: "SubscriberLine[]", side_effects: []}
  - {method: POST, path: "/portability/subscriber-lines/{id}/activate", description: "Activate service on a line that is still PROVISIONED.", roles: [PlatformAdmin], code: 200, input: ["activation_at?"], output: SubscriberLine, side_effects: ["sets service_status to ACTIVE, sets number_status to ASSIGNED when it is UNASSIGNED, and sets line_opened_at to the current logical clock instant when it is null", "recomputes SubscriberLine.loyalty_tenure_months and SubscriberLine.retention_cycle_count", "sets Account.active_line_count to the count of SubscriberLine rows on the account with service_status ACTIVE"]}
  - {method: POST, path: "/portability/subscriber-lines/{id}/cancel", description: "Turn off service on a line and open the directory-number reclamation window.", roles: [PlatformAdmin, CustomerService], code: 200, input: [reason_code], output: SubscriberLine, side_effects: ["sets service_status to CANCELLED and cancellation_effective_at to the current logical clock instant", "sets SystemConfig.last_line_cancellation_deadline to the current logical clock instant plus SystemConfig.line_cancellation_grace_hours", "sets Account.active_line_count to the count of SubscriberLine rows on the account with service_status ACTIVE"]}
  - {method: POST, path: "/portability/port-requests", description: "Open a port-in request for a subscriber line; a new request may supersede the line's prior request, so the client supplies the line version it last observed.", roles: [PlatformAdmin, CustomerService], code: 201, input: [subscriber_line_id, losing_carrier_code, account_number_at_losing_carrier, transfer_pin, requested_cutover_at, "supersedes_port_request_id?", expected_subscriber_line_version], output: PortRequest, side_effects: ["increments SubscriberLine.version by 1", "sets submitted_at to the current logical clock instant"]}
  - {method: GET, path: "/portability/subscriber-lines/{id}/port-requests", description: "List the port requests recorded against one subscriber line, oldest first, including their rejection logs.", roles: [PlatformAdmin, CustomerService, CreditAnalyst, Customer], code: 200, input: [], output: "PortRequest[]", side_effects: []}
  - {method: POST, path: "/portability/port-requests/{id}/submit", description: "Submit a drafted port request to the losing carrier.", roles: [PlatformAdmin, CustomerService], code: 200, input: [transfer_pin, account_number_at_losing_carrier], output: PortRequest, side_effects: ["sets SubscriberLine.number_status to RESERVED on the attached line"]}
  - {method: POST, path: "/portability/port-requests/{id}/rejections", description: "Record a carrier rejection code against a pending request, copying the catalog guidance into the request's rejection log.", roles: [PlatformAdmin], code: 201, input: [rejection_code], output: {rejection_code: string, guidance_text: string, resubmission_allowed: boolean, retry_after_hours: integer, occurred_at: datetime}, side_effects: ["appends an entry to PortRequest.rejections and sets request_state to REJECTED, last_rejection_code and last_rejection_at", "recomputes PortRequest.rejection_count", "sets SubscriberLine.number_status to UNASSIGNED on the attached line"]}
  - {method: POST, path: "/portability/port-requests/{id}/resubmit", description: "Resubmit a rejected port request once the cooling-off window has elapsed.", roles: [PlatformAdmin, CustomerService], code: 200, input: [transfer_pin, account_number_at_losing_carrier], output: PortRequest, side_effects: ["sets request_state to RESUBMITTED and submitted_at to the current logical clock instant", "sets SubscriberLine.number_status to RESERVED on the attached line", "increments SubscriberLine.retention_cycle_count by 1 when the attached line's billing_mode is PREPAID", "sets the attached line's ACTIVE PortProtectionCase.case_state to CLEARED and SubscriberLine.port_protection_status to UNPROTECTED"]}
  - {method: POST, path: "/portability/port-requests/{id}/accept", description: "Accept a pending or resubmitted port request and schedule its cutover; cutover completes when the logical clock reaches the requested instant.", roles: [PlatformAdmin], code: 200, input: [], output: PortRequest, side_effects: ["sets request_state to ACCEPTED_PENDING_CUTOVER and recomputes updated_at"]}
  - {method: POST, path: "/portability/port-requests/{id}/cancel", description: "Cancel a pending or repeatedly rejected port request.", roles: [PlatformAdmin, CustomerService], code: 200, input: [], output: PortRequest, side_effects: ["sets SubscriberLine.number_status to UNASSIGNED on the attached line when the request was PENDING"]}
  - {method: POST, path: "/portability/migration-requests", description: "Open a prepaid-to-postpaid migration for a line.", roles: [CustomerService, PlatformAdmin], code: 201, input: [subscriber_line_id, "source_billing_mode?", "target_billing_mode?", "prepaid_balance_cents?", requested_cutover_at], output: MigrationRequest, side_effects: []}
  - {method: GET, path: "/portability/subscriber-lines/{id}/migration-requests", description: "List the migration requests opened for one subscriber line.", roles: [CustomerService, PlatformAdmin, CreditAnalyst, Customer], code: 200, input: [], output: "MigrationRequest[]", side_effects: []}
  - {method: POST, path: "/portability/migration-requests/{id}/check-eligibility", description: "Run the eligibility evaluation that routes the migration to APPROVED or BLOCKED, then set the requested cutover instant; the CUTOVER_SCHEDULED step follows on the next clock advance.", roles: [CustomerService, PlatformAdmin], code: 200, input: ["changed_at?"], output: MigrationRequest, side_effects: ["sets migration_state to APPROVED with SubscriberLine.number_status RESERVED when the attached line is UNPROTECTED and carries no open port request", "sets migration_state to BLOCKED with SubscriberLine.number_status UNASSIGNED, and sets Account.account_status SUSPENDED when the attached line is PROTECTED", "sets migration_state to BLOCKED with SubscriberLine.number_status UNASSIGNED and Account.account_status left unchanged when the attached line is UNPROTECTED but carries a port request in request_state PENDING or RESUBMITTED", "sets requested_cutover_at to changed_at when changed_at is supplied"]}
  - {method: POST, path: "/portability/device-installment-plans", description: "Quote a device installment plan for a line, optionally activating it immediately; a new quote may supersede the line's prior quoted plan.", roles: [CustomerService, PlatformAdmin], code: 201, input: [subscriber_line_id, device_model, device_price_cents, "down_payment_cents?", installment_months, "activation_at?", expected_subscriber_line_version], output: DeviceInstallmentPlan, side_effects: ["increments SubscriberLine.version by 1", "sets monthly_installment_cents (floor of the financed balance over installment_months) and the first-installment remainder via calculation device_installment_balance", "when activation_at is supplied, sets financed_at to activation_at and computes upgrade_eligible_at, and sets plan_state to UPGRADE_ELIGIBLE when activation_at is at or after upgrade_eligible_at, otherwise to ACTIVE"]}
  - {method: GET, path: "/portability/device-installment-plans/{id}", description: "Read one installment plan, including its financed balance, installment amount and remaining balance.", roles: [PlatformAdmin, CustomerService, TradeInInspector, Customer], code: 200, input: [], output: DeviceInstallmentPlan, side_effects: []}
  - {method: POST, path: "/portability/trade-in-assessments", description: "Submit a device for trade-in against an installment plan.", roles: [CustomerService, PlatformAdmin], code: 201, input: [installment_plan_id, device_model, declared_condition], output: TradeInAssessment, side_effects: ["sets estimated_credit_cents via calculation trade_in_credit_assessment estimated variant"]}
  - {method: GET, path: "/portability/device-installment-plans/{id}/trade-in-assessments", description: "List the trade-in assessments submitted against one installment plan.", roles: [PlatformAdmin, CustomerService, TradeInInspector, CreditAnalyst], code: 200, input: [], output: "TradeInAssessment[]", side_effects: []}
  - {method: POST, path: "/portability/trade-in-assessments/{id}/grade", description: "Grade a submitted trade-in, settling its credit against the plan.", roles: [TradeInInspector], code: 200, input: [graded_condition], output: TradeInAssessment, side_effects: ["sets graded_condition, graded_at, final_credit_cents and estimated_credit_cents via calculation trade_in_credit_assessment", "sets grade_delta_cents to final_credit_cents minus estimated_credit_cents", "sets the attached DeviceInstallmentPlan.trade_in_credit_cents to final_credit_cents and recomputes its remaining_balance_cents and plan_state"]}
  - {method: POST, path: "/portability/number-reservations", description: "Hold a directory number for an account over an explicit half-open interval.", roles: [PlatformAdmin, CustomerService], code: 201, input: [account_id, mdn, pool_code, reserved_at, "reserved_until?", "hold_days?"], output: NumberReservation, side_effects: ["recomputes Account.reserved_mdn_count"]}
  - {method: GET, path: "/portability/accounts/{id}/number-reservations", description: "List the directory-number reservations held for one account.", roles: [PlatformAdmin, CustomerService, CreditAnalyst], code: 200, input: [], output: "NumberReservation[]", side_effects: []}
  - {method: POST, path: "/portability/number-reservations/{id}/commit", description: "Commit a held number to a subscriber line and put that line into service.", roles: [PlatformAdmin], code: 200, input: [subscriber_line_id], output: NumberReservation, side_effects: ["sets committed_line_id and sets SubscriberLine.number_status to ASSIGNED with SubscriberLine.mdn set to the reservation mdn", "sets SubscriberLine.service_status to ACTIVE and sets line_opened_at to the current logical clock instant when it is null", "recomputes Account.reserved_mdn_count and Account.active_line_count"]}
  - {method: POST, path: "/portability/line-addition-requests", description: "Request one or more additional lines on an account.", roles: [CustomerService, PlatformAdmin], code: 201, input: [account_id, line_count, "requested_mdn?"], output: LineAdditionRequest, side_effects: ["sets submitted_at to the current logical clock instant"]}
  - {method: GET, path: "/portability/migration-requests/{id}", description: "Read one migration request, including the carried number, the carried balances and the proration credit.", roles: [CustomerService, PlatformAdmin, CreditAnalyst, Customer], code: 200, input: [], output: MigrationRequest, side_effects: []}
