          - validations.v_deduction_amount_mismatch
          - errors.ERR_DEDUCTION_AMOUNT_MISMATCH
        distinguishing_aspect: "333333 cents of gross at 500 bp is exactly 16666.65 cents, so half-up rounding yields 16667 and truncation yields 16666: the 16666 line must be REFUSED and the 16667 line accepted. This is the one direction that distinguishes round-half-up from floor, and banker's rounding cannot be blamed because the discarded fraction is .65 rather than .5."
