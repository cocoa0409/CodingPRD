- section: errors
  instances:
  - name: order_create_is_refused_when_no_open_calendar_cycle_exists
    claim_type: Violation → Error
    grounds:
    - errors[ERR_CALENDAR_HAS_NO_OPEN_CYCLE]
    - validations[priority=13]
    - entities.BankingCalendar.fields.is_open
    - calculations.rail_cutoff_resolution
    distinguishing_aspect: 'Published-but-closed calendar cells are genuinely closed: with four consecutive closed
      cells and no open one inside the lookahead window, order creation returns 409 ERR_CALENDAR_HAS_NO_OPEN_CYCLE
      rather than silently falling back to the calendar week.'
    test_recipe:
      setup:
      - Logical clock 2026-09-01T00:00:00Z. The institution has published cells for 2026-09-01 through 2026-09-04,
        every one of them is_open false.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /ledgers
        payload:
          name: Closed Calendar Ledger
          currency: USD
        as: PlatformAdmin
        captures:
          c25_ledger: $.data.id
      - call: POST /legal-entities
        payload:
          legal_name: Holiday Bank
          short_code: HLB
          home_ledger_id: ${c25_ledger}
          entity_type: ORGANISATION
        as: PlatformAdmin
        captures:
          c25_entity: $.data.id
      - call: POST /counterparties
        payload:
          legal_entity_id: ${c25_entity}
          display_name: Quiet Co
          external_ref: QC-1
        as: PaymentInitiator
        captures:
          c25_cp: $.data.id
      - call: POST /bank-accounts
        payload:
          legal_entity_id: ${c25_entity}
          institution_name: Holiday Bank
          routing_number: '021000021'
          account_number_last4: '1111'
          supported_rails:
          - ACH
          available_funds_cents: 4000000
        as: LedgerController
        captures:
