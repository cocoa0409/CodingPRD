# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every testable claim in SCAFFOLD.yaml §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: site_creation_applies_declared_defaults_and_starts_at_version_one
        claim_type: Defaults
        grounds:
          - entities.Site.fields.status
          - entities.Site.fields.roster_disclosure_level
          - entities.Site.fields.active_hold_count
        distinguishing_aspect: "A Site created with only the three required fields comes back ACTIVE, SUMMARY_ONLY, active_hold_count 0 and version 1."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-05-11T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201"
            - "Site.${site_id}.status == ACTIVE"
            - "Site.${site_id}.roster_disclosure_level == SUMMARY_ONLY"
            - "Site.${site_id}.active_hold_count == 0"
            - "Site.${site_id}.facility_contact_name == null"
            - "Site.${site_id}.version == 1"
            - "Site.${site_id}.id is a bare RFC 4122 UUID with no type prefix"

      - name: patient_get_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Reading a Patient by a well-formed but unknown UUID returns HTTP 404 with ERR_NOT_FOUND, not an empty 200."
        test_recipe:
          setup:
            - "One SCHOOL site exists so the endpoint has data to be distinguished from."
          setup_api_calls:
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /mobile-dentistry/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "The trigger returns HTTP 404 with data.error_id == ERR_NOT_FOUND"
            - "The response envelope carries response_type == error"

      - name: site_visit_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
          - endpoints[POST /mobile-dentistry/site-visits]
        distinguishing_aspect: "Omitting scheduled_end_at on POST /mobile-dentistry/site-visits returns HTTP 400 ERR_VALIDATION and creates no SiteVisit row."
        test_recipe:
          setup:
            - "One OPEN ProgramPeriod, one SCHOOL site in CA, one calibrated unit and one CA dentist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ada Reyes", staff_role: "DENTIST", license_number: "D-1001", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-01" }
              as: ProgramAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units/${unit_id}/calibrate"
              payload: { calibrated_on: "2026-04-01" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mobile-dentistry/site-visits"
              payload: { site_id: "${site_id}", program_period_id: "${pp_id}", portable_unit_id: "${unit_id}", lead_staff_id: "${dentist_id}", scheduled_start_at: "2026-05-11T09:00:00Z" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The trigger returns HTTP 400 with data.error_id == ERR_VALIDATION"
            - "GET /mobile-dentistry/site-visits?site_id=${site_id} returns 0 rows"

      - name: consent_create_with_invalid_scope_tier_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - validations[priority=7]
          - errors[ERR_INVALID_ENUM]
          - entities.Consent.fields.scope_tier
        distinguishing_aspect: "scope_tier is one of the fields priority 7 enumerates, so the value 'FULL' returns ERR_INVALID_ENUM (400) rather than ERR_VALIDATION."
        test_recipe:
          setup:
            - "One OPEN ProgramPeriod, one SCHOOL site in CA and one STUDENT patient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${patient_id}", site_id: "${site_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "FULL", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Rosa Lopez", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The trigger returns HTTP 400 with data.error_id == ERR_INVALID_ENUM"
            - "GET /mobile-dentistry/consents?patient_id=${patient_id} returns 0 rows"

      - name: patients_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /mobile-dentistry/patients]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three patients on one site, limit=2 offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One SCHOOL site in CA with exactly three STUDENT patients."
          setup_api_calls:
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-002", first_name: "Noah", last_name: "Park", date_of_birth: "2015-11-20", household_size: 3 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-003", first_name: "Ivy", last_name: "Chen", date_of_birth: "2017-01-09", household_size: 5 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
          trigger:
            - call: "GET /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", limit: 2, offset: 2 }
              as: ProgramAdmin
          assert:
            - "The first trigger returns 2 items with meta pagination total_count == 3 and has_more == true"
            - "The second trigger returns 1 item with total_count == 3 and has_more == false"
            - "response_type == array on both responses"

      - name: procedure_computed_attributes_come_from_the_code_tables_and_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - calculations.procedure_static_attributes
          - entities.Procedure.fields.chair_minutes
          - entities.Procedure.fields.charge_cents
          - entities.Procedure.fields.required_tier
        distinguishing_aspect: "A D1351 created through POST /mobile-dentistry/procedures comes back with chair_minutes 12, charge_cents 6350 and required_tier SCREENING_FLUORIDE_SEALANT, none of which the client may supply."
        test_recipe:
          setup:
            - "Standard school stack at clock 2026-05-11T09:00:00Z with an ACTIVE SCREENING_FLUORIDE_SEALANT consent and an encounter that has been screened and examined."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ada Reyes", staff_role: "DENTIST", license_number: "D-1001", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Hana Ito", staff_role: "HYGIENIST", license_number: "H-2001", license_state: "CA", supervision_level: "GENERAL" }
              as: ProgramAdmin
              captures: { hyg_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ben Cruz", staff_role: "DENTAL_ASSISTANT", license_number: "A-3001", license_state: "CA", supervision_level: "DIRECT" }
              as: ProgramAdmin
              captures: { asst_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-01" }
              as: ProgramAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units/${unit_id}/calibrate"
              payload: { calibrated_on: "2026-04-01" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { patient_id: $.data.id }
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${patient_id}", site_id: "${site_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "SCREENING_FLUORIDE_SEALANT", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Rosa Lopez", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { consent_id: $.data.id }
            - call: "POST /mobile-dentistry/consents/${consent_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "POST /mobile-dentistry/site-visits"
              payload: { site_id: "${site_id}", program_period_id: "${pp_id}", portable_unit_id: "${unit_id}", lead_staff_id: "${dentist_id}", onsite_dentist_staff_id: "${dentist_id}", scheduled_start_at: "2026-05-11T09:00:00Z", scheduled_end_at: "2026-05-11T15:00:00Z", chair_count: 2 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /mobile-dentistry/sterilization-loads"
              payload: { portable_unit_id: "${unit_id}", loaded_by_staff_id: "${asst_id}", load_number: "L-1", cycle_completed_at: "2026-05-10T08:00:00Z", site_visit_id: "${visit_id}" }
              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { load1_id: $.data.id }
            - call: "POST /mobile-dentistry/sterilization-loads/${load1_id}/spore-result"
              payload: { result: "PASSED", result_recorded_by_staff_id: "${hyg_id}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/site-visits/${visit_id}/start"
              payload: {}
              as: FieldDentist
              as_user_id: "${dentist_id}"
              captures: { visit_v1: $.data.version }
            - call: "POST /mobile-dentistry/encounters"
              payload: { site_visit_id: "${visit_id}", patient_id: "${patient_id}", consent_id: "${consent_id}", expected_site_visit_version: "${visit_v1}" }
              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { enc_id: $.data.id }
            - call: "POST /mobile-dentistry/encounters/${enc_id}/screen"
              payload: { performing_staff_id: "${hyg_id}", cavitated_lesion_count: 2, pain_reported: false, abscess_or_swelling: false, untreated_decay_present: true }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/encounters/${enc_id}/exam"
              payload: { performing_staff_id: "${dentist_id}", exam_modality: "ONSITE" }
              as: FieldDentist
              as_user_id: "${dentist_id}"
              captures: { enc_v1: $.data.version }
          trigger:
            - call: "POST /mobile-dentistry/procedures"
              payload: { encounter_id: "${enc_id}", procedure_code: "D1351", tooth_number: 3, surface: "O", expected_encounter_version: "${enc_v1}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
              captures: { proc_id: $.data.id }
          assert:
            - "Procedure.${proc_id}.status == PLANNED"
            - "Procedure.${proc_id}.chair_minutes == 12"
            - "Procedure.${proc_id}.charge_cents == 6350"
            - "Procedure.${proc_id}.required_tier == SCREENING_FLUORIDE_SEALANT"
            - "Procedure.${proc_id}.performing_staff_id == null"
            - "SiteVisit.${visit_id}.booked_chair_minutes == 37"

      - name: superseded_consent_is_discoverable_through_the_superseded_by_filter
        claim_type: Parent Relationships
        grounds:
          - entities.Consent.fields.superseded_by_consent_id
          - endpoints[GET /mobile-dentistry/consents]
        distinguishing_aspect: "After a tier amendment, GET /mobile-dentistry/consents?superseded_by_consent_id=<new consent id> returns exactly the old SUPERSEDED row, proving the self-referential FK is reverse-reachable."
        test_recipe:
          setup:
            - "One OPEN ProgramPeriod, one SCHOOL site in CA, one STUDENT patient and one ACTIVE SCREENING_FLUORIDE_SEALANT consent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/patients"
              payload: { site_id: "${site_id}", patient_type: "STUDENT", external_ref: "S-001", first_name: "Mia", last_name: "Lopez", date_of_birth: "2016-03-04", household_size: 4 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { patient_id: $.data.id }
            - call: "POST /mobile-dentistry/consents"
              payload: { patient_id: "${patient_id}", site_id: "${site_id}", program_period_id: "${pp_id}", regime: "SCHOOL_GUARDIAN", scope_tier: "SCREENING_FLUORIDE_SEALANT", signed_at: "2026-05-01T00:00:00Z", guardian_name: "Rosa Lopez", guardian_relationship: "MOTHER" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { old_consent_id: $.data.id }
            - call: "POST /mobile-dentistry/consents/${old_consent_id}/verify"
              payload: {}
              as: SiteCoordinator
              as_user_id: "${site_id}"
            - call: "GET /mobile-dentistry/patients/${patient_id}"
              payload: {}
              as: ProgramAdmin
              captures: { patient_v1: $.data.version }
            - call: "POST /mobile-dentistry/consents/${old_consent_id}/amend-tier"
              payload: { new_scope_tier: "SCREENING_ONLY", expected_patient_version: "${patient_v1}" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { new_consent_id: $.data.id }
          trigger:
            - call: "GET /mobile-dentistry/consents"
              payload: { superseded_by_consent_id: "${new_consent_id}" }
              as: ProgramAdmin
          assert:
            - "The trigger returns exactly 1 item whose id == ${old_consent_id}"
            - "That item's status == SUPERSEDED"
            - "That item's superseded_by_consent_id == ${new_consent_id}"
            - "Consent.${new_consent_id}.scope_tier == SCREENING_ONLY"

  - section: state_machines
    instances:

      - name: cancelling_a_completed_site_visit_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SiteVisit.IN_PROGRESS_to_COMPLETED
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "COMPLETED is a terminal SiteVisit state with no outbound transition, so cancel returns HTTP 409 ERR_INVALID_STATE and cancelled_at stays null."
        test_recipe:
          setup:
            - "Standard school stack at clock 2026-05-11T09:00:00Z with one visit already started and completed (no encounters registered)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ada Reyes", staff_role: "DENTIST", license_number: "D-1001", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ben Cruz", staff_role: "DENTAL_ASSISTANT", license_number: "A-3001", license_state: "CA", supervision_level: "DIRECT" }
              as: ProgramAdmin
              captures: { asst_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Hana Ito", staff_role: "HYGIENIST", license_number: "H-2001", license_state: "CA", supervision_level: "GENERAL" }
              as: ProgramAdmin
              captures: { hyg_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units"
              payload: { unit_code: "PU-01" }
              as: ProgramAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /mobile-dentistry/portable-units/${unit_id}/calibrate"
              payload: { calibrated_on: "2026-04-01" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/site-visits"
              payload: { site_id: "${site_id}", program_period_id: "${pp_id}", portable_unit_id: "${unit_id}", lead_staff_id: "${dentist_id}", onsite_dentist_staff_id: "${dentist_id}", scheduled_start_at: "2026-05-11T09:00:00Z", scheduled_end_at: "2026-05-11T15:00:00Z", chair_count: 2 }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /mobile-dentistry/sterilization-loads"
              payload: { portable_unit_id: "${unit_id}", loaded_by_staff_id: "${asst_id}", load_number: "L-1", cycle_completed_at: "2026-05-10T08:00:00Z", site_visit_id: "${visit_id}" }
              as: DentalAssistant
              as_user_id: "${asst_id}"
              captures: { load1_id: $.data.id }
            - call: "POST /mobile-dentistry/sterilization-loads/${load1_id}/spore-result"
              payload: { result: "PASSED", result_recorded_by_staff_id: "${hyg_id}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/site-visits/${visit_id}/start"
              payload: {}
              as: FieldDentist
              as_user_id: "${dentist_id}"
            - call: "POST /mobile-dentistry/site-visits/${visit_id}/complete"
              payload: {}
              as: FieldDentist
              as_user_id: "${dentist_id}"
          trigger:
            - call: "POST /mobile-dentistry/site-visits/${visit_id}/cancel"
              payload: { cancel_reason: "OPERATOR_ERROR" }
              as: SiteCoordinator
              as_user_id: "${site_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The trigger returns HTTP 409 with data.error_id == ERR_INVALID_STATE"
            - "SiteVisit.${visit_id}.status == COMPLETED"
            - "SiteVisit.${visit_id}.cancelled_at == null"
            - "PortableUnit.${unit_id}.status == AVAILABLE"

      - name: reverifying_an_active_school_guardian_consent_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Consent.ACTIVE_to_ACTIVE
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The ACTIVE self-loop is declared only for SNF_RESPONSIBLE_PARTY, so re-verifying an ACTIVE SCHOOL_GUARDIAN consent returns ERR_INVALID_STATE and leaves signed_at and expires_at untouched."
        test_recipe:
          setup:
            - "Clock at 2026-05-11T09:00:00Z, one OPEN ProgramPeriod, one SCHOOL site, one STUDENT patient and one ACTIVE SCHOOL_GUARDIAN consent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
