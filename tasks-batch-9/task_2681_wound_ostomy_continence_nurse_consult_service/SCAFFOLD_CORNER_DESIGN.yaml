            - call: "POST /patients"
              payload: { mrn: "MRN-N1", unit_id: "${u1_id}", admitted_at: "2026-07-31T12:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
