  # ===========================================================================
  - section: endpoints
    instances:

      - name: donor_agreement_get_round_trips_stored_configuration
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/network/donor-agreements/{id}
          - entities.DonorAgreement.fields.meal_equivalency_factor
        distinguishing_aspect: "Every stored agreement field round-trips through the read endpoint unchanged, including the defaulted meal_equivalency_factor 1.2 and the computed status and freight_subsidy_used_cents."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR created with a 500000-cent pool and no explicit meal factor, then activated."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "GET /network/donor-agreements/${agr}"
              payload: {}
              as: NetworkAdmin
              captures: { name: $.data.donor_name, cat: $.data.product_category, st: $.data.status, fac: $.data.meal_equivalency_factor, used: $.data.freight_subsidy_used_cents, committed: $.data.committed_lbs }
          assert:
            - "DonorAgreement.${agr}.donor_name == ${name} == \"Midwest Mills Co\" and product_category == ${cat} == DRY_GOODS"
            - "DonorAgreement.${agr}.status == ${st} == ACTIVE and freight_subsidy_used_cents == ${used} == 0"
            - "the defaulted meal_equivalency_factor == ${fac} == 1.2 and committed_lbs == ${committed} == 500000"

      - name: member_cannot_withdraw_another_members_bid
        claim_type: conditional_action
        grounds:
          - roles.MemberFoodBank.identity
          - validations[priority=4]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Withdraw is conditional on ownership: member M2 acting under its own X-User-ID against M1's bid is rejected with ERR_FORBIDDEN (403) and M1's 400-share hold survives, while M1's own withdraw succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 is BIDDING; M1 (certified, 100000 shares) holds a 400-share bid and M2 (certified, 28571 shares) holds none."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_load1
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - *c_m1
            - call: "POST /network/audits"
