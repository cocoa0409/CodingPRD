            - "after two accepts: slots_filled == 2 and status == FILLED (2 == count ACCEPTED)"
            - "after rescind: slots_filled == 1 and status == OPEN (1 == count ACCEPTED: only P2)"
            - "after re-offer + accept: slots_filled == 2 and status == FILLED again (P2 + P3)"
            - "invariant slots_filled == count(ACCEPTED placements) held at every observation point"

      - name: sale_void_restores_stock_exactly
        grounds:
          - state_machines.GiftShopSale.COMPLETED_to_VOIDED
          - entities.GiftShopItem.fields.stock_on_hand
          - calculations.campaign_proceeds
        distinguishing_aspect: |
          Conserved quantity = inventory units (different quantity from slot counts):
          create(qty 3) then void leaves stock_on_hand bit-identical (10 -> 7 -> 10),
          and campaign raised_cents returns to 0 while gross_receipts_cents keeps the
          3000 audit trail.
