          assert:
            - "OfficeQualitySnapshot.${snap1}.quality_score == 80"
            - "OfficeQualitySnapshot.${snap1}.posture_after == OK"
            - "OfficeQualitySnapshot.${snap2}.quality_score == 79"
            - "OfficeQualitySnapshot.${snap2}.posture_after == WATCH"
