          - rbac.CouncilRepresentative.shared_operations
          - validations.priority_2_ERR_UNAUTHORIZED
        distinguishing_aspect: "The entity-backed CouncilRepresentative is bound to its own Resident id on both write and read, and although filing a request is exclusive to that role, disposing of one is exclusive to the ActivityDirector — so neither role can stand in for the other."
        test_recipe:
          setup:
            - "two ADMITTED residents; resident-A sits on the council and files one request, resident-B is a bystander"
            - "vote_count 6 clears the quorum of 5, so no quorum refusal can be confused with an authorization refusal"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Council Chair Cora", room_number: "711A", admission_date: "2026-07-31" }
              as: ActivityDirector
              captures: { res_a_id: $.data.id }
            - call: "POST /recreation/residents"
              payload: { full_name: "Bystander Bram", room_number: "711B", admission_date: "2026-07-31" }
              as: ActivityDirector
              captures: { res_b_id: $.data.id }
            - call: "POST /recreation/council-requests"
              payload: { resident_id: "${res_a_id}", requested_domain: "SPIRITUAL", vote_count: 6, note: "More Sunday services" }
              as: CouncilRepresentative
              as_user_id: "${res_a_id}"
              captures: { req_a_id: $.data.id }
          trigger:
            - call: "POST /recreation/council-requests"
              payload: { resident_id: "${res_b_id}", requested_domain: "CREATIVE", vote_count: 6, note: "Filed on somebody else's behalf" }
              as: CouncilRepresentative
              as_user_id: "${res_a_id}"
              captures: { foreign_file_err: $.data.error_id }
            - call: "GET /recreation/council-requests/${req_a_id}"
              as: CouncilRepresentative
              as_user_id: "${res_b_id}"
              captures: { foreign_read_err: $.data.error_id }
            - call: "POST /recreation/council-requests/${req_a_id}/review"
              payload: { decision: "ADOPTED", decision_note: "Self-approved" }
              as: CouncilRepresentative
              as_user_id: "${res_a_id}"
              captures: { self_review_err: $.data.error_id }
            - call: "POST /recreation/council-requests"
              payload: { resident_id: "${res_b_id}", requested_domain: "CREATIVE", vote_count: 6, note: "Filed by the right resident" }
              as: ActivityDirector
              captures: { director_file_err: $.data.error_id }
            - call: "GET /recreation/council-requests/${req_a_id}"
              as: CouncilRepresentative
              as_user_id: "${res_a_id}"
              captures: { own_status: $.data.status }
          assert:
            - "filing for another resident returns 403 and ${foreign_file_err} == \"ERR_UNAUTHORIZED\""
            - "reading another resident's request returns 403 and ${foreign_read_err} == \"ERR_UNAUTHORIZED\""
            - "the representative's review attempt returns 403 and ${self_review_err} == \"ERR_UNAUTHORIZED\""
            - "the director's filing attempt returns 403 and ${director_file_err} == \"ERR_UNAUTHORIZED\", the two roles being mutually exclusive on this pair of endpoints"
            - "the owner's own read returns 200 with ${own_status} == \"SUBMITTED\""
            - "exactly one ResidentCouncilRequest exists, all four refusals having written nothing"
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_resident_version_on_plan_create_returns_4XX
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.plan-create-stale-resident
          - validations.priority_19_ERR_STALE_RESIDENT_VERSION
          - errors.ERR_STALE_RESIDENT_VERSION
        distinguishing_aspect: "The §1.2.1 rule plan-create-stale-resident is exercised on its declared write_endpoint with its declared occ_field: the echoed version was correct when read and became stale because an unrelated census edit bumped Resident.version, and re-reading the version makes the identical body succeed."
        test_recipe:
          setup:
            - "one ADMITTED resident with one assessment, so Resident.version is 2 (1 at creation, +1 for the assessment mirror write)"
            - "the therapist reads version 2, then the director renumbers the room, taking Resident.version to 3"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Stale View Stan", room_number: "712A", admission_date: "2026-07-31" }
              as: ActivityDirector
              captures: { res_id: $.data.id, create_ver: $.data.version }
            - call: "POST /recreation/residents/${res_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-31" }
              as: RecreationTherapist
              captures: { asmt_id: $.data.id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { stale_ver: $.data.version }
            - call: "PATCH /recreation/residents/${res_id}"
              payload: { room_number: "712B" }
              as: ActivityDirector
              captures: { bumped_ver: $.data.version }
          trigger:
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 2, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 0 }, expected_resident_version: "${stale_ver}" }
              as: RecreationTherapist
              captures: { occ_err: $.data.error_id }
            - call: "GET /recreation/residents/${res_id}"
              as: RecreationTherapist
              captures: { fresh_ver: $.data.version }
            - call: "POST /recreation/activity-plans"
              payload: { resident_id: "${res_id}", source_assessment_id: "${asmt_id}", cycle_start_at: "2026-08-01T00:00:00Z", domain_frequency_targets: { SOCIAL: 2, COGNITIVE: 0, PHYSICAL: 0, SPIRITUAL: 0, CREATIVE: 0 }, expected_resident_version: "${fresh_ver}" }
              as: RecreationTherapist
              captures: { plan_id: $.data.id }
          assert:
            - "${create_ver} == 1 and ${stale_ver} == 2, the assessment mirror write being a version bump"
            - "${bumped_ver} == 3"
            - "the stale attempt returns 412 and ${occ_err} == \"ERR_STALE_RESIDENT_VERSION\""
            - "no ActivityPlan row exists for the resident after the refusal"
            - "${fresh_ver} == 3 and the retry returns 201 with ActivityPlan.${plan_id}.status == DRAFT"
            - "Resident.${res_id}.version is still 3 after the successful create, plan creation touching no census field"
      - name: occ_stale_vehicle_version_on_transport_booking_returns_4XX
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.transport-booking-stale-vehicle
          - validations.priority_20_ERR_STALE_VEHICLE_VERSION
          - errors.ERR_STALE_VEHICLE_VERSION
        distinguishing_aspect: "The §1.2.1 rule transport-booking-stale-vehicle fires on a booking that no state precondition would have blocked: the two outings do not overlap even after turnaround, so only the seat-pool version tells the caller their capacity view is out of date."
        test_recipe:
          setup:
            - "one vehicle with turnaround_minutes 30, so booking the 09:00-11:00 outing blocks the fleet interval through 11:30"
            - "two PLANNING outings on that vehicle: 2026-09-28T09:00:00Z..11:00:00Z and 2026-09-28T13:00:00Z..15:00:00Z, comfortably disjoint"
            - "the vehicle version is read once, before the first booking consumes escort seats"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Stale Fleet Program", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 23", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 30 }
              as: ActivityDirector
              captures: { veh_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "Morning Market", departure_at: "2026-09-28T09:00:00Z", return_at: "2026-09-28T11:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { o1_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "Afternoon Museum", departure_at: "2026-09-28T13:00:00Z", return_at: "2026-09-28T15:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { o2_id: $.data.id }
            - call: "GET /recreation/vehicles/${veh_id}"
              as: ActivityDirector
              captures: { stale_ver: $.data.version }
            - call: "POST /recreation/outings/${o1_id}/transport-booking"
              payload: { expected_vehicle_version: "${stale_ver}" }
              as: ActivityDirector
          trigger:
            - call: "POST /recreation/outings/${o2_id}/transport-booking"
              payload: { expected_vehicle_version: "${stale_ver}" }
              as: ActivityDirector
              captures: { occ_err: $.data.error_id }
            - call: "GET /recreation/vehicles/${veh_id}"
              as: ActivityDirector
              captures: { fresh_ver: $.data.version }
            - call: "POST /recreation/outings/${o2_id}/transport-booking"
              payload: { expected_vehicle_version: "${fresh_ver}" }
              as: ActivityDirector
          assert:
            - "${stale_ver} == 1 and the first booking succeeds"
            - "the second booking with the same echoed version returns 412 and ${occ_err} == \"ERR_STALE_VEHICLE_VERSION\""
            - "${occ_err} != \"ERR_VEHICLE_TIME_CONFLICT\", the two windows being disjoint even under the 30 minute turnaround"
            - "after the refusal Outing.${o2_id}.logistics_status == PLANNING and Vehicle.${veh_id}.reserved_ambulatory_seats == 1"
            - "${fresh_ver} == 2 and the retry returns 200 with Outing.${o2_id}.logistics_status == TRANSPORT_BOOKED"
            - "Vehicle.${veh_id}.version == 3 and reserved_ambulatory_seats == 2 after both bookings"
      - name: version_increments_on_every_write_including_side_effect_writes
        claim_type: optimistic_concurrency
        grounds:
          - endpoints.PATCH_/recreation/vehicles/{vehicle_id}
          - endpoints.POST_/recreation/outings/{outing_id}/transport-booking
        distinguishing_aspect: "The OCC counter advances on side-effect writes as well as on direct edits: two field edits and one booking-driven seat recompute take the same Vehicle from version 1 to version 4, so a client that only re-reads after direct edits still holds a stale token."
        test_recipe:
          setup:
            - "one vehicle created at version 1 and one PLANNING outing on it"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Version Walk Program", domain: "PHYSICAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 24", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 15 }
              as: ActivityDirector
              captures: { veh_id: $.data.id, v_create: $.data.version }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "Version Walk Park", departure_at: "2026-09-29T09:00:00Z", return_at: "2026-09-29T11:00:00Z", escort_count: 2 }
              as: ActivityDirector
              captures: { outing_id: $.data.id }
          trigger:
            - call: "PATCH /recreation/vehicles/${veh_id}"
              payload: { label: "Van 24 (relabelled)" }
