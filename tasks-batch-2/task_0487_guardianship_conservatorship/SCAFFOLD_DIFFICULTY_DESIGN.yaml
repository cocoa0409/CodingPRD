  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- Instance 1: auth(FORBIDDEN_ROLE pri2) vs state(INVALID_STATE pri9)
      - name: ppvc_forbidden_role_beats_invalid_state
        grounds:
          - validations[priority=2]
          - validations[priority=9]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A single call (Fiduciary tries to grant a petition that is in FILED, not READY_FOR_HEARING)
          violates BOTH authorization (grant is Judge-only) and state precondition; the higher-priority
          auth check wins, returning ERR_FORBIDDEN_ROLE (403), not ERR_INVALID_STATE — an auth vs state category pair.
        test_recipe:
          setup:
            - "A petition in FILED status (probable cause not yet found)"
          setup_api_calls:
            - call: "POST /gc/protected-persons"
              payload: { full_name: "Pri Ward", date_of_birth: "1944-01-01", annual_income_cents: 0, liquid_estate_cents: 100000 }
              as: CourtClerk
              captures: { person_id: $.data.id }
            - call: "POST /gc/fiduciaries"
              payload: { full_name: "Fam Fid", fiduciary_kind: "FAMILY" }
              as: CourtClerk
              captures: { fid_id: $.data.id }
            - call: "POST /gc/cases"
              payload: { protected_person_id: "${person_id}", case_type: "GUARDIANSHIP" }
              as: CourtClerk
              captures: { case_id: $.data.id }
            - call: "POST /gc/petitions"
              payload: { case_id: "${case_id}", nominated_fiduciary_id: "${fid_id}", requested_authority: "PERSON", alleged_grounds: "g" }
              as: Petitioner
              as_user_id: "pet-1"
              captures: { pet_id: $.data.id }
          trigger:
            - call: "POST /gc/petitions/${pet_id}/grant"
              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

