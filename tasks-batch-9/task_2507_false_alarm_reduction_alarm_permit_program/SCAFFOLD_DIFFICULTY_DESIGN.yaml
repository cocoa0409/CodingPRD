      - name: company_score_volume_weighted_lets_one_busy_bad_period_suspend_the_company
        grounds:
          - calculations.company_reporting_compliance_score
          - calculations.compliance_report_period_metrics
          - entities.AlarmCompany.fields.score_mode
          - state_machines.AlarmCompany.ACTIVE_to_SUSPENDED
          - state_machines.ComplianceReport.SUBMITTED_to_VARIANCE_FLAGGED
        distinguishing_aspect: >-
          For score_mode VOLUME_WEIGHTED the two accepted periods are weighted by
          system_dispatch_count, so (0.20*3 + 1.00*1) / 4 = 0.40, which is below
          company_suspension_score_threshold 0.50 and drives ACTIVE straight to SUSPENDED,
          skipping PROBATION entirely.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with company_probation_score_threshold 0.70 and company_suspension_score_threshold 0.50."
            - "One AlarmCompany with score_mode = VOLUME_WEIGHTED, status ACTIVE, monitoring one PERMITTED system."
            - "Three REFUSED DispatchRequests inside March 2026 (REFUSED still counts toward system_dispatch_count) and one REFUSED request inside April 2026."
            - "March report over-reports 6 dispatches against 3 actual with only 3 ECV attempts (period_score 0.20); April report reports 1 against 1 with 1 ECV attempt (period_score 1.00)."
            - "April is reviewed and ACCEPTED first, so the company is still ACTIVE with reporting_compliance_score 1.00 when the trigger fires."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload: {<<: *fs_base, schedule_code: "FS-2507-VW", effective_from: "2026-01-01T00:00:00Z"}
              as: ProgramAdministrator
              captures: {sched_id: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Volume Watch Inc", license_number: "AC-2507-VW", contact_email: "ops@volumewatch2507.example", contact_phone: "+15550100301", score_mode: "VOLUME_WEIGHTED"}, as: ProgramAdministrator, captures: {company_id: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-VW-44-MARKET-ST", street_address: "44 Market St", city: "Fairview", zip_code: "44011", occupancy_class: "COMMERCIAL", police_beat: "B04"}, as: PermitClerk, captures: {site_id: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Rita Chen", phone_number: "+15550100302", relationship: "MANAGER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {c1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Owen Park", phone_number: "+15550100303", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {c2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 12, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-01-02T00:00:00Z"}, as: ProgramAdministrator, captures: {sys1: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys1}/approve-registration", payload: {}, as: PermitClerk, captures: {permit1: $.data.id}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys1}", alarm_type: "BURGLARY", verification_method: "SINGLE_CALL", call_attempts: [{site_contact_id: "${c1}", attempted_at: "2026-03-05T01:01:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-03-05T01:00:00Z", idempotency_key: "vw-2507-m1"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr_m1: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_m1}/refuse", payload: {refusal_reason: "Single-call verification insufficient under the ECV ordinance."}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-12T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys1}", alarm_type: "BURGLARY", verification_method: "SINGLE_CALL", call_attempts: [{site_contact_id: "${c1}", attempted_at: "2026-03-12T01:01:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-03-12T01:00:00Z", idempotency_key: "vw-2507-m2"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr_m2: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_m2}/refuse", payload: {refusal_reason: "Single-call verification insufficient under the ECV ordinance."}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-03-20T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys1}", alarm_type: "BURGLARY", verification_method: "SINGLE_CALL", call_attempts: [{site_contact_id: "${c1}", attempted_at: "2026-03-20T01:01:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-03-20T01:00:00Z", idempotency_key: "vw-2507-m3"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr_m3: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_m3}/refuse", payload: {refusal_reason: "Single-call verification insufficient under the ECV ordinance."}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-04-10T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys1}", alarm_type: "BURGLARY", verification_method: "SINGLE_CALL", call_attempts: [{site_contact_id: "${c1}", attempted_at: "2026-04-10T01:01:00Z", outcome: "NO_ANSWER"}], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-04-10T01:00:00Z", idempotency_key: "vw-2507-a1"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr_a1: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr_a1}/refuse", payload: {refusal_reason: "Single-call verification insufficient under the ECV ordinance."}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-05-01T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/compliance-reports", payload: {monitoring_company_id: "${company_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", reported_dispatch_count: 6, reported_cancellation_count: 0, ecv_attempt_count: 3}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {rep_mar: $.data.id, mar_score: $.data.period_score}}
            - {call: "POST /false-alarm-program/compliance-reports", payload: {monitoring_company_id: "${company_id}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T23:59:59Z", reported_dispatch_count: 1, reported_cancellation_count: 0, ecv_attempt_count: 1}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {rep_apr: $.data.id, apr_score: $.data.period_score}}
            - {call: "POST /false-alarm-program/compliance-reports/${rep_apr}/review", payload: {decision: "ACCEPT"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "GET /false-alarm-program/alarm-companies/${company_id}", payload: {}, as: ProgramAdministrator}
          trigger:
            - {call: "POST /false-alarm-program/compliance-reports/${rep_mar}/review", payload: {decision: "FLAG_VARIANCE", variance_notes: "Reported 6 dispatches against 3 recorded; ECV attempts cover only half the reported volume."}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "GET /false-alarm-program/alarm-companies/${company_id}", payload: {}, as: ProgramAdministrator}
          assert:
            - "ComplianceReport.${rep_mar}.system_dispatch_count == 3"
            - "ComplianceReport.${rep_mar}.variance_count == 3 and variance_pct == 1.0000"
            - "ComplianceReport.${rep_mar}.period_accuracy == 0.0000 and period_ecv_rate == 0.5000"
            - "ComplianceReport.${rep_mar}.period_score == 0.20 and status == 'VARIANCE_FLAGGED'"
            - "ComplianceReport.${rep_apr}.system_dispatch_count == 1 and period_score == 1.00 and status == 'ACCEPTED'"
            - "AlarmCompany.${company_id}.reporting_compliance_score == 0.40"
            - "AlarmCompany.${company_id}.status == 'SUSPENDED'"
            - "AlarmCompany.${company_id}.consecutive_flagged_report_count == 1"
            - "AlarmCompany.${company_id}.probation_started_at == '2026-05-01T00:00:00Z' (the skipped-PROBATION anchor)"
            - "before the trigger the same GET showed status == 'ACTIVE' and reporting_compliance_score == 1.00"

      - name: company_score_period_equal_leaves_the_same_reports_at_probation
        grounds:
          - calculations.company_reporting_compliance_score
          - entities.AlarmCompany.fields.score_mode
          - state_machines.AlarmCompany.ACTIVE_to_PROBATION
          - entities.FeeSchedule.fields.company_probation_score_threshold
