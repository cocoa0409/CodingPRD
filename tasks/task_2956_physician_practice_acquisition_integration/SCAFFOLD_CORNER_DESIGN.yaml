            - "LiabilityItem.${lease_item_id}.escrowed_amount_cents == 2500000"
            - "LiabilityItem.${pto_item_id}.disposition == UNASSIGNED and escrowed_amount_cents == 0"
            - "Acquisition.${acq_id}.escrow_committed_cents == 2500000 and escrow_available_cents == 7500000"
            - "GET /liability-items with acquisition_id ${acq_id} and no disposition filter reports total_count == 2"

  # ===========================================================================
  # Section 2 — State Machines (§1.2)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: acquisition_starts_in_sourcing_and_pending_clearance
        claim_type: Initial State
        grounds:
          - state_machines.Acquisition.deal_status.initial_state
          - state_machines.Acquisition.compliance_clearance.initial_state
        distinguishing_aspect: |
          The Acquisition carries two independent state dimensions and both start at
          their declared initial values — deal_status SOURCING and
          compliance_clearance PENDING — with readiness_posture BLOCKED because the
          blocking checklist is still empty.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          assert:
            - "Acquisition.${acq_id}.deal_status == SOURCING"
            - "Acquisition.${acq_id}.compliance_clearance == PENDING"
            - "Acquisition.${acq_id}.readiness_posture == BLOCKED"
            - "the two dimensions move independently: POST /acquisitions/${acq_id}/compliance-clearance with target_clearance FLAGGED leaves deal_status at SOURCING"

      - name: acquisition_diligence_without_any_physician_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Acquisition.deal_status.SOURCING_to_DILIGENCE
          - validations[priority=14]
        distinguishing_aspect: |
          SOURCING -> DILIGENCE declares "at least one Physician row exists"; with an
          empty roster the transition is refused with ERR_INVALID_STATE_TRANSITION and
          deal_status stays SOURCING, and registering one physician makes the very
          same request succeed.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with no Physician rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "Acquisition.${acq_id}.deal_status == SOURCING and version is unchanged"
            - "after POST /physicians with npi 1548392017 on ${acq_id}, the identical DILIGENCE request succeeds and deal_status == DILIGENCE"

      - name: acquisition_sourcing_to_signed_is_not_a_declared_transition_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Acquisition.deal_status
          - validations[priority=14]
        distinguishing_aspect: |
          From SOURCING the only declared targets are DILIGENCE and ABANDONED, so a
          request for SIGNED, BOARD_REVIEW or CLOSED is rejected as an undeclared
          transition — the ladder cannot be skipped even when every downstream
          business precondition would eventually be satisfiable.
        test_recipe:
          setup:
            - "One Acquisition in deal_status SOURCING with one Physician registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "SIGNED" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "Acquisition.${acq_id}.deal_status == SOURCING"
            - "target_status BOARD_REVIEW and target_status CLOSED from SOURCING each also return ERR_INVALID_STATE_TRANSITION (409)"
            - "target_status SOURCING, a self-transition, is likewise undeclared and returns ERR_INVALID_STATE_TRANSITION (409)"

      - name: acquisition_abandoned_is_terminal_and_locks_status_changes
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Acquisition.deal_status.terminal_states
          - state_machines.Acquisition.deal_status.SOURCING_to_ABANDONED
        distinguishing_aspect: |
          ABANDONED is declared terminal, so once abandoned_reason is stored no
          further deal_status request of any target is accepted — including a
          re-abandonment and a return to SOURCING.
        test_recipe:
          setup:
            - "One Acquisition abandoned straight out of SOURCING with a recorded reason."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "ABANDONED", abandoned_reason: "Seller withdrew from the letter of intent." }
              as: DealLead
              as_user_id: "dl-1"
          trigger:
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "Acquisition.${acq_id}.deal_status == ABANDONED and abandoned_reason == Seller withdrew from the letter of intent."
            - "a second ABANDONED request and a SOURCING request each also return ERR_INVALID_STATE_TRANSITION (409)"
            - "Acquisition.${acq_id}.closed_at stays null — abandonment is not a close"

      - name: valuation_opinion_second_submit_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ValuationOpinion.status.DRAFT_to_SUBMITTED
          - validations[priority=14]
        distinguishing_aspect: |
          A SUBMITTED opinion has no SUBMITTED -> SUBMITTED edge, so replaying the
          submit request fails rather than silently re-stamping the row; the second
          attempt is refused with ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "One Acquisition in deal_status DILIGENCE with one Physician."
            - "One FMV ValuationOpinion prepared by va-1 and already moved to SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "GET /acquisitions/${acq_id}"
              as: ValuationAnalyst
              as_user_id: "va-1"
