              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/open"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "o1@x.com", learner_name: "O1" }
              as: SchedulingCoordinator
              captures: { regO1: $.data.id }
            - call: "POST /training/registrations/${regO1}/confirm"
              payload: {}
              as: Learner
              as_user_id: "o1@x.com"
            - call: "POST /training/cohorts/${coh_id}/registrations"
              payload: { learner_email: "o2@x.com", learner_name: "O2" }
              as: SchedulingCoordinator
              captures: { regO2: $.data.id }
            - call: "GET /training/cohorts/${coh_id}"
              payload: {}
