              as: Estimator
              as_user_id: "est-100"
            - call: "POST /repair-orders/${ro_id}/estimate/lock"
              payload: {}
              as: Estimator
              as_user_id: "est-100"
            - call: "POST /estimate-lines/${el1}/parts-lines"
              payload: { part_number: "OEM-9040A", part_description: "Mirror assembly", part_type: "OEM", list_price_cents: 10000, qty: 1, vendor_id: "${ven_id}" }
              as: PartsManager
              captures: { pl_ok: $.data.id }
            - call: "POST /estimate-lines/${el1}/parts-lines"
