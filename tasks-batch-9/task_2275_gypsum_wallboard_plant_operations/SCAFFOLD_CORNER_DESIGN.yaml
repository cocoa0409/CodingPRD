      - name: feeding_more_tons_than_the_lot_still_holds
        claim_type: error_triggerable
        grounds:
          - errors[ERR_LOT_TONS_INSUFFICIENT]
          - validations[priority 20, ERR_LOT_TONS_INSUFFICIENT]
        distinguishing_aspect: |
          The tonnage check compares tons_fed against remaining_tons, not received_tons: after 60.000 t of
          a 100.000 t lot has been drawn, a 50.000 t feed is refused with ERR_LOT_TONS_INSUFFICIENT (409)
          even though it is well under the lot's original size, and a 40.000 t feed then succeeds exactly.
        test_recipe:
          setup:
            - "Plant GYP-1 with a 100.000 t APPROVED lot and two PLANNED batches."
            - "60.000 t has already been fed into the first batch."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots"
              payload: { plant_id: "${plant_id}", source_type: "SYNTHETIC", supplier_name: "Pawnee FGD", received_tons: 100.000, declared_free_moisture_pct: 10.00, declared_purity_pct: 90.0 }
              as: MaterialsController
              captures: { lot_id: $.data.id }
            - call: "POST /plant-ops/gypsum-lots/${lot_id}/assay"
              payload: { free_moisture_pct: 10.00, purity_pct: 90.0, chloride_ppm: 100 }
              as: MaterialsController
              captures: { lot_v: $.data.version }
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 45.000, calcination_temp_f: 320.0, feed_rate_tph: 20.0, feed_window_start: "2026-08-02T08:00:00Z", feed_window_end: "2026-08-02T12:00:00Z" }
              as: MaterialsController
              captures: { bx_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bx_id}/feeds"
              payload: { lot_id: "${lot_id}", tons_fed: 60.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_v}" }
              as: MaterialsController
            - call: "GET /plant-ops/gypsum-lots/${lot_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_v2: $.data.version }
          trigger:
            - call: "POST /plant-ops/calciner-batches/${bx_id}/feeds"
              payload: { lot_id: "${lot_id}", tons_fed: 50.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_v2}" }
              as: MaterialsController
              captures: { err_id: $.data.error_id }
            - call: "POST /plant-ops/calciner-batches/${bx_id}/feeds"
              payload: { lot_id: "${lot_id}", tons_fed: 40.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_v2}" }
              as: MaterialsController
          assert:
            - "the 50.000 t feed returned status 409 with ${err_id} == ERR_LOT_TONS_INSUFFICIENT"
            - "the rejected call left GypsumLot.${lot_id} at version ${lot_v2}, so the following 40.000 t feed reuses the same expected_lot_version"
            - "the 40.000 t feed returned 201 and GypsumLot.${lot_id}.remaining_tons == 0.000 with status == DEPLETED"
            - "CalcinerBatch.${bx_id}.feed_tons_total == 100.000 and status == FEEDING"

      - name: quality_evaluation_with_no_specimens_returns_its_own_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_BOARD_TEST_SPECIMENS]
          - validations[priority 8, ERR_NO_BOARD_TEST_SPECIMENS]
        distinguishing_aspect: |
          On a COMPLETED run with specimen_count 0 the evaluation returns ERR_NO_BOARD_TEST_SPECIMENS
          (422) instead of the generic ERR_INVALID_STATE that the UNTESTED quality dimension would
          otherwise produce, and instead of the ERR_INSUFFICIENT_SPECIMENS raised at one or two specimens.
        test_recipe:
          setup:
            - "Plant GYP-1 with silo 204.530 t; run R1 scheduled, started and completed at 295.000 MSF."
            - "No board tests recorded at all, so quality_state is UNTESTED and specimen_count is 0."
