      - name: repeating_a_completed_transition_is_a_state_conflict_not_a_no_op
        claim_type: idempotency
        grounds: >-
          state_machines.RightsDeal DRAFT -> COMMITTED (precondition
          deal_status == DRAFT); state_machines.ReleaseTranche
          PENDING -> CONFIRMED; state_machines.HospitalityBuild
          PLANNED -> APPROVED; validations[priority=41]
          ERR_INVALID_DEAL_STATE, [priority=42] ERR_TRANCHE_NOT_PENDING,
          [priority=47] ERR_INVALID_BUILD_STATE, [priority=31]
          ERR_STALE_DEAL_VERSION.
        distinguishing_aspect: >-
          Three replayed action calls, each of which must be a 409 rather than a
          silent success — and the tranche replay is set up so that the OCC guard
          CANNOT be the reason: the second confirm carries the deal version
          re-read AFTER the first confirm bumped it, so priority 31 passes and
          priority 42 is what reports. Each error id is different, so a single
          catch-all "already done" error fails.
        test_recipe:
          setup: "One canonical event with a committed 40-unit deal, one fully confirmed 40-unit tranche and one approved ZONE_A build."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights, captures: { tr_st: "$.data.tranche_state" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v2: "$.data.version" } }
            - { call: "POST /hospitality-builds", payload: { event_id: "${ev_id}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb_id: "$.data.id" } }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { hb_st: "$.data.build_state" } }
          trigger:
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { e_commit: "$.data.error_id" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v2}" }, as: RightsManager, as_user_id: u_rights, captures: { e_confirm: "$.data.error_id" } }
            - { call: "POST /hospitality-builds/${hb_id}/approve", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { e_approve: "$.data.error_id" } }
          assert: >-
            Setup landed: ${tr_st} == "CONFIRMED", ${hb_st} == "APPROVED",
            ${deal_v2} == ${deal_v} + 1.
            Replayed commit: HTTP 409 with ${e_commit} ==
            "ERR_INVALID_DEAL_STATE" (the deal is FULLY_RELEASED, not DRAFT).
            Replayed confirm: HTTP 409 with ${e_confirm} ==
            "ERR_TRANCHE_NOT_PENDING" — not 412, because ${deal_v2} is the
            deal's current version.
            Replayed approve: HTTP 409 with ${e_approve} ==
            "ERR_INVALID_BUILD_STATE".
            Nothing double-counted: GET /rights-deals/${deal_id} still reports
            released_units 40, minimum_liability_cents 320000 and version
            ${deal_v2}, and GET /allocation-blocks?rights_deal_id=${deal_id}
            returns total_count 0.

      - name: complete_event_enforces_clock_and_live_booking_preconditions
        claim_type: precondition_enforcement
        grounds: >-
          state_machines.Event SCHEDULED -> COMPLETED preconditions
          (status IN {SCHEDULED, RESCHEDULED}; event_date <= logical clock;
          no Booking with fulfillment_status IN {RESERVED, REBOOK_PENDING});
          validations[priority=40] ERR_INVALID_EVENT_STATE;
          endpoints "POST /events/{id}/complete".
        distinguishing_aspect: >-
          The two non-status preconditions are failed one at a time on the same
          fixture and then repaired in place, so each rejection is attributable:
          first the clock is early (event_date in the future) with no live
          bookings at all; then the clock is late enough but a RESERVED booking
          exists; only after that booking is cancelled does the call succeed. The
          middle rejection is the interesting one — a RESERVED booking blocks
          completion while an ALLOCATED one does not, since ALLOCATED bookings are
          swept to DELIVERED by the transition itself.
        test_recipe:
          setup: "STANDARD SELLABLE FIXTURE with two 5-unit CORPORATE bookings: one left RESERVED and one moved to ALLOCATED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 20, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_res: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_alloc: "$.data.id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blk_v: "$.data.version" } }
            - { call: "POST /bookings/${bk_alloc}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${blk_v}" }, as: ClientServiceAgent, as_user_id: u_csa }
          trigger:
            - { call: "POST /events/${ev_id}/complete", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { e_early: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-02-01T15:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events/${ev_id}/complete", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { e_live: "$.data.error_id" } }
            - { call: "POST /bookings/${bk_res}/cancel", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { res_f: "$.data.fulfillment_status" } }
            - { call: "POST /events/${ev_id}/complete", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { ev_st: "$.data.status" } }
            - { call: "GET /bookings/${bk_alloc}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { alloc_f: "$.data.fulfillment_status" } }
          assert: >-
            Clock still early: HTTP 409 with ${e_early} ==
            "ERR_INVALID_EVENT_STATE".
            Clock exactly AT event_date (the `<=` boundary is inclusive, so the
            date precondition now passes) but a RESERVED booking remains: HTTP 409
            with ${e_live} == "ERR_INVALID_EVENT_STATE".
            Cancelling that booking: HTTP 200 with ${res_f} == "CANCELLED".
            Third attempt: HTTP 200 with ${ev_st} == "COMPLETED", and the
            ALLOCATED booking was swept by the transition:
            ${alloc_f} == "DELIVERED".
            GET /package-products/${pkg_id} now shows package_status "CLOSED" and
            GET /events/${ev_id} reports version 2 — the two rejected completes
            left no version churn.

      - name: cancelling_an_event_spares_children_already_in_terminal_states
        claim_type: conditional_cascade
        grounds: >-
          state_machines.Event SCHEDULED -> CANCELLED side_effects (deals NOT IN
          {SETTLED, TERMINATED} -> TERMINATED; PENDING tranches -> LAPSED;
          OPEN/EXHAUSTED blocks -> RECALLED; packages != CLOSED -> CLOSED;
          Bookings NOT IN {CANCELLED, DELIVERED} -> CANCELLED with
          cancellation_fee_cents = 0, refund_cents = paid_cents,
          payment_status = REFUNDED; PLANNED/APPROVED builds -> CANCELLED and
          READY builds -> CLOSED; ASSIGNED HostAssignments -> VOIDED with
          host counters recomputed); calculations.client_credit_exposure.
        distinguishing_aspect: >-
          The cascade's guards are tested by their exclusions rather than their
          inclusions. Every asserted row is one the sweep must NOT touch or must
          touch differently from its neighbour: the already-CANCELLED booking
          keeps its 55872 fee and its SETTLEMENT installment (the provider waiver
          applies only to bookings this call cancels), the CONFIRMED tranche is
          NOT lapsed (only PENDING ones are), the READY build goes to CLOSED
          while the PLANNED build in the other zone goes to CANCELLED, and the
          client's outstanding_cents therefore lands on 55872 rather than 0 — an
          implementation that waives every cancellation, or that lapses every
          tranche, drifts on exactly one of these numbers.
