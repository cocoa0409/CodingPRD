        - name: approval_under_an_amended_blocking_policy_fails_on_missing_tags
          claim_type: Violation → Error
          grounds: "§1.4 priority 52 ERR_MANDATORY_TAG_MISSING (422) fires only on approve; §1.2 the creation-time diversion to TAG_REJECTED requires the policy to be BLOCKING already; §1.5 PUT /finops/tagging-policies/{id} amends enforcement_mode under OCC."
          distinguishing_aspect: "Reachability of this error depends on ordering: a request filed under ADVISORY stays SUBMITTED with a non-empty missing_dimensions, and only after the policy is amended to BLOCKING does approve become the first gate that can see the gap."
