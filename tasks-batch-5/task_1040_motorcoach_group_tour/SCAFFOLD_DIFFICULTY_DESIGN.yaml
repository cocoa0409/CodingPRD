              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party M", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "M1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "M2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/bookings/${bk}/cancel"
              payload: { reason: "compensate" }
              as: SalesAgent
          assert:
            - "Departure.${dep}.confirmed_pax == 0"
            - "Coach.${coach}.status == ASSIGNED (still held by departure, seats freed)"

      - name: cash_conserved_full_refund_on_operator_cancel
        grounds:
          - calculations.cancellation_refund
          - entities.Booking.fields.amount_paid_cents
          - entities.Booking.fields.amount_refunded_cents
          - state_machines.Departure.GUARANTEED_to_CANCELLED
        distinguishing_aspect: "Conserved quantity = cash (distinct from seats): an operator-initiated departure cancel refunds the booking in full (penalty 0), so amount_paid_cents - amount_refunded_cents == 0 (257400 paid, 257400 refunded)."
        test_recipe:
          setup:
            - "Departure GUARANTEED with coach assigned; one CONFIRMED booking pax 2 paid in full (257400)."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Inv2", duration_days: 2, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
              as: OpsManager
              captures: { tp: $.data.id }
            - call: "POST /api/coaches"
              payload: { code: "C12", seat_capacity: 10, day_rate_cents: 50000 }
              as: OpsManager
              captures: { coach: $.data.id }
            - call: "POST /api/departures"
              payload: { tour_product_id: "${tp}", name: "Inv2 Dep", start_date: "2026-08-25", end_date: "2026-08-26", guaranteed_min_pax: 2, itinerary_days: [ { day_index: 1, service_date: "2026-08-25", from_city: "NYC", to_city: "DC", planned_drive_hours: 5 } ] }
              as: OpsManager
              captures: { dep: $.data.id }
            - call: "POST /api/departures/${dep}/publish"
              payload: {}
              as: OpsManager
              captures: { pv: $.data.version }
            - call: "POST /api/departures/${dep}/assign"
              payload: { resource_kind: "COACH", coach_id: "${coach}", expected_departure_version: "${pv}" }
              as: OpsManager
            - call: "POST /api/bookings"
              payload: { departure_id: "${dep}", lead_name: "Party N", pax_count: 2, rooms_requested: 0 }
              as: SalesAgent
              captures: { bk: $.data.id }
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "N1", is_lead: true }
              as: SalesAgent
            - call: "POST /api/passengers"
              payload: { booking_id: "${bk}", full_name: "N2" }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "DEPOSIT", amount_cents: 40000 }
              as: SalesAgent
            - call: "POST /api/payments"
              payload: { booking_id: "${bk}", kind: "BALANCE", amount_cents: 217400 }
              as: SalesAgent
            - call: "POST /api/bookings/${bk}/confirm"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /api/departures/${dep}/cancel"
              payload: { reason: "operator cancel full refund" }
              as: OpsManager
          assert:
            - "Booking.${bk}.amount_paid_cents == 257400"
            - "Booking.${bk}.amount_refunded_cents == 257400"
            - "Booking.${bk}.penalty_charged_cents == 0"
