  - rule_id: boundary_precision_check
    instances:
      - name: post_test_hours_exactly_forty_allowed
        metric: "Enrollment.posted_hours against MIN_POST_TEST_HOURS 40.00 (cumulative hour ledger, 0.25 increments)"
        endpoint: "POST /test-events"
        grounds:
          - calculations.post_test_eligibility
