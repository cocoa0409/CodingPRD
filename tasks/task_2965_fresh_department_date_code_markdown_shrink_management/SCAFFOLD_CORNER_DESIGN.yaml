            - call: "POST /fresh/order-recommendations/${rec_id}/issue"
              payload: {}
              as: DepartmentManager
            - call: "POST /fresh/order-recommendations/${rec_id}/issue"
              payload: {}
              as: DepartmentManager
          assert:
            - "reversed window: HTTP 422 with data.error_id == 'ERR_RECOMMENDATION_WINDOW_INVALID'"
            - "62-day window: HTTP 422 with data.error_id == 'ERR_RECOMMENDATION_WINDOW_INVALID'"
            - "empty window: HTTP 422 with data.error_id == 'ERR_INSUFFICIENT_SHRINK_HISTORY'"
            - "GET /fresh/items/${item_id} returns data.version == 1 after all three refusals"
            - "accepted call: HTTP 201 with data.status == 'DRAFT', data.method == 'CHRONOLOGICAL_ACTUAL', data.received_units == 24, data.shrink_units == 2, data.shrink_rate_pct == 8.33, data.open_units == 2, data.recommended_order_units == 9"
