            - "${err_publish} == ERR_SANDBOX_NOT_PUBLISHABLE at HTTP 422 — the condition is the shell_type, not the shell's state"
            - "${err_student} == ERR_SANDBOX_NOT_PUBLISHABLE at HTTP 422 — the same rule blocks STUDENT rows on sandbox shells"
            - "${designer_enr} is created with ${designer_state} == ACTIVE — a non-STUDENT role on the same sandbox shell is permitted"
            - "${off_state} == PUBLISHED and ${off_enr_state} == ACTIVE — neither leg fires for an OFFICIAL shell"
            - "${sbx_active} == 0 and ${sbx_state_after} == PROVISIONED — the DESIGNER row is not a seat and the failed publish left no trace"

      - name: the_seat_cap_check_reads_a_freshly_derived_effective_cap_not_the_stored_base
        claim_type: cascading_validation
        grounds:
          - validations[43]
          - calculations.waitlist_promotion_capacity
          - errors[ERR_SEAT_CAP_EXCEEDED]
        distinguishing_aspect: "The capacity check at priority 43 cannot run until waitlist_promotion_capacity has re-derived effective_seat_cap from the term's CURRENT posture, so the identical 6th enrollment must be refused at NORMAL, refused again at ELEVATED (floor(5 * 0.10) == 0 grants nothing) and accepted at CONTINUITY_MODE (floor(5 * 0.20) == 1). Checking against base_seat_cap, or caching the cap at shell creation, fails the third probe."
        test_recipe:
          setup:
            - "Term 2026FA is IN_SESSION at posture NORMAL; one PROVISIONED OFFICIAL shell with base_seat_cap 5 holds five ACTIVE STUDENT rows."
