# =============================================================================
# PRD Benchmark Scaffold — Podcast Production & Editing Service
# Difficulty tier: EXPERT (§0.4)
# =============================================================================

scenario: "Podcast Production & Editing Service: show onboarding & format, recording session & remote capture, edit/mix/master & turnaround, show-notes/transcript & publishing, distribution & hosting, sponsorship/ad-insertion coordination, per-episode vs retainer, asset/version delivery"

domain_name: podcast-production-editing
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - temporal_overlap            # studio/engineer booking windows
    - waterfall_allocation        # retainer included-episode credits

  entity_topology: flat
  # Peer entities linked by foreign keys; URL paths are flat collections
  # (/shows, /episodes, /sessions, /invoices, ...) with FK fields in the body
  # and `?<fk>` filtered-list GETs for reverse reachability.

  state_machine_shape: posture_driven
  # Episode is a cyclic+branching pipeline (revision loop on edit review);
  # Show carries a derived production_posture gating child operations;
  # AdCampaign + EngagementContract have independent lifecycles.

  relationship_patterns:
    - one_to_many        # Show -> Episodes, Episode -> Sessions/Assets/Deliverables
    - cross_aggregate    # Episode billing references EngagementContract & RetainerCycle
    - self_referential   # AssetVersion supersedes a prior AssetVersion of same Deliverable

  role_model: peer_roles
  # ProducerEng (production engineer), ShowOwner (client), AdOps (sponsorship),
  # PlatformAdmin (operator) own distinct resource surfaces.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Show
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Show display title" }
      - { name: format, type: enum, source: input, description: "Format spec", constraints: "one of {INTERVIEW, SOLO, PANEL, NARRATIVE}" }
      - { name: target_loudness_lufs, type: number, source: input, description: "Mastering target integrated loudness", default: -16.0, constraints: "between -23.0 and -12.0 inclusive" }
      - { name: billing_model, type: enum, source: input, description: "How episodes on this show are billed", constraints: "one of {PER_EPISODE, RETAINER}" }
      - { name: lifetime_billed_cents, type: integer, source: computed, description: "Running sum of finalized Invoice.total_cents for this show; snapshot drives late-fee tier (see calc late_fee)", default: 0 }
      - { name: production_posture, type: enum, source: computed, description: "Derived gate: ACTIVE | ON_HOLD | SUSPENDED. ACTIVE normally; ON_HOLD when >=1 Invoice is OVERDUE; SUSPENDED when >=1 Invoice DISPUTED or no EngagementContract is ACTIVE. Recomputed after every contract/invoice/episode mutation.", default: "SUSPENDED", constraints: "one of {ACTIVE, ON_HOLD, SUSPENDED}" }
      - { name: open_episode_count, type: integer, source: computed, description: "Count of Episodes for this show whose status NOT IN {PUBLISHED, ARCHIVED, CANCELLED}", default: 0 }

  - name: EngagementContract
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; the show this contract governs" }
      - { name: tier, type: enum, source: input, description: "Service tier; selects SLA hours, base price, overage rate", constraints: "one of {STANDARD, PRIORITY, RUSH}" }
      - { name: engagement_type, type: enum, source: input, description: "Billing engagement style", constraints: "one of {PER_EPISODE, RETAINER}" }
      - { name: monthly_included_episodes, type: integer, source: input, description: "RETAINER only: episodes covered before overage; ignored (must be 0) for PER_EPISODE", default: 0, constraints: ">= 0; > 0 only when engagement_type=RETAINER" }
      - { name: loyalty_discount_pct, type: number, source: input, description: "Per-episode invoice subtotal discount fraction, capped by DISCOUNT_CAP_CENTS", default: 0.0, constraints: "between 0.0 and 0.5 inclusive" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", constraints: "DRAFT -> ACTIVE -> {EXPIRED, TERMINATED}" }
      - { name: activated_at, type: datetime, source: system, description: "When contract moved to ACTIVE", default: null }

  - name: RetainerCycle
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> EngagementContract.id; the RETAINER contract this cycle bills" }
      - { name: cycle_start_utc, type: datetime, source: input, description: "Inclusive start of billing window" }
      - { name: cycle_end_utc, type: datetime, source: input, description: "Exclusive end of billing window (half-open [start, end))" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "OPEN -> CLOSED" }
      - { name: included_consumed, type: integer, source: computed, description: "Episodes charged against included allotment at close (waterfall)", default: 0 }
      - { name: overage_episode_count, type: integer, source: computed, description: "Episodes beyond included allotment at close", default: 0 }
      - { name: closed_at, type: datetime, source: system, description: "When cycle CLOSED", default: null }

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; owning show" }
      - { name: contract_id, type: string, source: input, description: "FK -> EngagementContract.id; the ACTIVE contract billing this episode" }
      - { name: title, type: string, source: input, description: "Episode title" }
      - { name: planned_track_count, type: integer, source: input, description: "Expected number of raw audio tracks at intake; drives provisional turnaround SLA", constraints: ">= 1" }
      - { name: raw_track_count, type: integer, source: system, description: "Actual number of raw audio tracks captured, frozen at asset-lock (POST /episodes/{id}/lock-assets); drives final turnaround SLA and invoice extra-track charge", default: 0 }
      - { name: transcript_requested, type: boolean, source: input, description: "Whether a transcript deliverable is part of scope", default: false }
      - { name: recording_ended_at, type: datetime, source: system, description: "When the recording Session for this episode COMPLETED; anchors provisional turnaround", default: null }
      - { name: assets_complete_at, type: datetime, source: system, description: "When raw assets were locked (POST /episodes/{id}/lock-assets); anchors final turnaround", default: null }
      - { name: turnaround_due_utc, type: datetime, source: computed, description: "Editing turnaround deadline; provisional at intake, finalized at asset-lock (see calc turnaround_due)", default: null }
      - { name: delivered_late, type: boolean, source: computed, description: "True iff the edit was approved after turnaround_due_utc (finalized value)", default: false }
      - { name: status, type: enum, source: system, description: "Production pipeline state", constraints: "INTAKE -> RECORDING -> EDITING -> REVIEW -> {EDITING (revision), MASTERED} -> SCHEDULED -> PUBLISHED; plus ARCHIVED, CANCELLED" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times REVIEW sent the edit back to EDITING", default: 0 }
      - { name: published_at, type: datetime, source: system, description: "When episode PUBLISHED; orders retainer waterfall consumption", default: null }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; the episode being recorded" }
      - { name: engineer_id, type: string, source: input, description: "FK -> Engineer.id; the production engineer running capture" }
      - { name: capture_mode, type: enum, source: input, description: "Recording mode", constraints: "one of {STUDIO, REMOTE}" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Booking window start (inclusive)" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Booking window end (exclusive); half-open [start, end)" }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "BOOKED -> {LIVE -> COMPLETED} | CANCELLED" }
      - { name: completed_at, type: datetime, source: system, description: "When the session COMPLETED", default: null }

  - name: Engineer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Engineer display name" }
      - { name: remote_buffer_minutes, type: integer, source: input, description: "Required idle buffer between REMOTE sessions for this engineer (gear reset/upload)", default: 30, constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether engineer accepts new bookings", default: true }

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; the episode this deliverable belongs to" }
      - { name: kind, type: enum, source: input, description: "Deliverable type", constraints: "one of {MASTER_AUDIO, SHOW_NOTES, TRANSCRIPT}" }
      - { name: current_version_no, type: integer, source: computed, description: "Highest version_no among accepted AssetVersions for this deliverable", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "PENDING -> READY (>=1 accepted version) -> DELIVERED" }

  - name: AssetVersion
    parent: null
    common_fields: true
    fields:
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id; deliverable this version realizes" }
      - { name: supersedes_version_id, type: string, source: input, description: "FK -> AssetVersion.id; the prior accepted version this one replaces (self-referential), or null for the first version", default: null }
      - { name: version_no, type: integer, source: computed, description: "1 + supersedes' version_no, or 1 when supersedes is null", default: 1 }
      - { name: integrated_loudness_lufs, type: number, source: input, description: "Measured integrated loudness of this audio version (MASTER_AUDIO only; null otherwise)", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "SUBMITTED -> {ACCEPTED, REJECTED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show being billed" }
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; the episode billed (PER_EPISODE invoices); null for RETAINER overage invoices", default: null }
      - { name: retainer_cycle_id, type: string, source: input, description: "FK -> RetainerCycle.id; the cycle billed (RETAINER overage invoices); null for PER_EPISODE invoices", default: null }
      - { name: kind, type: enum, source: input, description: "Invoice kind", constraints: "one of {PER_EPISODE, RETAINER_OVERAGE}" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Pre-discount, pre-late-fee amount (see calc invoice_total / retainer_reconciliation)", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "Applied loyalty discount, capped at DISCOUNT_CAP_CENTS", default: 0 }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late-delivery surcharge; tier keyed on show.lifetime_billed_cents snapshot (see calc late_fee)", default: 0 }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents + late_fee_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "ISSUED -> {PAID, OVERDUE, DISPUTED}; DISPUTED -> {PAID, VOID}" }

  - name: AdCampaign
    parent: null
    common_fields: true
    fields:
      - { name: show_id, type: string, source: input, description: "FK -> Show.id; show carrying the ads" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor display name" }
      - { name: platform_fee_pct, type: number, source: input, description: "Platform's cut of gross ad revenue (show keeps 1 - this)", default: 0.30, constraints: "between 0.0 and 0.5 inclusive" }
      - { name: show_payout_cents, type: integer, source: computed, description: "Show's revenue share after platform fee, rounded per slot then summed (see calc ad_revenue_split)", default: 0 }
      - { name: platform_take_cents, type: integer, source: computed, description: "Gross total minus show_payout_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle", constraints: "DRAFT -> APPROVED -> RECONCILED; DRAFT -> CANCELLED" }

  - name: AdSlot
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; campaign this slot belongs to" }
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id; episode the slot is inserted into" }
      - { name: placement, type: enum, source: input, description: "Ad position", constraints: "one of {PRE_ROLL, MID_ROLL, POST_ROLL}" }
      - { name: gross_cents, type: integer, source: input, description: "Gross revenue attributed to this slot", constraints: ">= 1" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Show.production_posture: derived gate (compound) ----
  - entity: Show
    field: production_posture
    note: "Derived gate; never transitioned directly. Recomputed after every EngagementContract, Invoice, and Episode mutation affecting this show."
    derivation: |
      Evaluate in this fixed order (first match wins):
        1. If any Invoice for this show has status == DISPUTED → SUSPENDED.
        2. Else if no EngagementContract for this show has status == ACTIVE → SUSPENDED.
        3. Else if any Invoice for this show has status == OVERDUE → ON_HOLD.
        4. Else → ACTIVE.
    gating: |
      - New Episode creation (POST /episodes) requires posture == ACTIVE.
      - Session booking (POST /sessions) requires owning show posture IN {ACTIVE}.
      - Publishing an Episode (POST /episodes/{id}/publish) requires posture IN {ACTIVE, ON_HOLD}
        (ON_HOLD allows finishing in-flight work but blocks new intake).

  # ---- EngagementContract (linear with terminal branch) ----
  - entity: EngagementContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "engagement_type == RETAINER requires monthly_included_episodes >= 1"
        side_effects:
          - "Set activated_at = clock now"
          - "Recompute owning Show.production_posture (may flip SUSPENDED -> ACTIVE)"
          - "increments EngagementContract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{id}/terminate"
        actor: PlatformAdmin
        preconditions:
          - "contract.status == ACTIVE"
          - "expected_engagementcontract_version matches current version (OCC)"
        side_effects:
          - "Recompute owning Show.production_posture (no ACTIVE contract -> SUSPENDED)"
          - "increments EngagementContract.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /contracts/{id}/expire"
        actor: PlatformAdmin
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "Recompute owning Show.production_posture"
          - "increments EngagementContract.version by 1"

  # ---- Episode (cyclic + branching pipeline) ----
  - entity: Episode
    initial_state: INTAKE
    terminal_states: [PUBLISHED, ARCHIVED, CANCELLED]
    transitions:
      - from: INTAKE
        to: RECORDING
        trigger: "POST /sessions (first BOOKED session for this episode) — system"
        actor: system
        preconditions:
          - "episode.status == INTAKE"
        side_effects:
          - "Episode left in RECORDING until session completes"
      - from: RECORDING
        to: EDITING
        trigger: "POST /sessions/{id}/complete — system bubble-up"
        actor: ProducerEng
        preconditions:
          - "episode.status == RECORDING"
          - "session.status == LIVE"
        side_effects:
          - "Set episode.recording_ended_at = session.completed_at"
          - "Compute provisional turnaround_due_utc (calc turnaround_due, provisional variant)"
      - from: EDITING
        to: REVIEW
        trigger: "POST /episodes/{id}/submit-edit"
        actor: ProducerEng
        preconditions:
          - "episode.status == EDITING"
          - "episode.assets_complete_at is set (assets locked via POST /episodes/{id}/lock-assets)"
        side_effects:
          - "No state change to assets"
      - from: REVIEW
        to: EDITING
        trigger: "POST /episodes/{id}/request-revision"
        actor: ShowOwner
        preconditions:
          - "episode.status == REVIEW"
        side_effects:
          - "increment episode.revision_count by 1 (cycle back)"
        note: "Revision loop — REVIEW -> EDITING -> REVIEW may repeat."
      - from: REVIEW
        to: MASTERED
        trigger: "POST /episodes/{id}/approve-edit"
        actor: ShowOwner
        preconditions:
          - "episode.status == REVIEW"
          - "MASTER_AUDIO Deliverable for this episode has status == READY"
          - "current accepted MASTER_AUDIO version integrated_loudness within tolerance of Show.target_loudness_lufs (see validation priority 22)"
        side_effects:
          - "Finalize turnaround_due_utc (calc turnaround_due, final variant) and set delivered_late"
          - "MASTER_AUDIO Deliverable -> DELIVERED"
      - from: MASTERED
        to: SCHEDULED
        trigger: "POST /episodes/{id}/schedule"
        actor: ProducerEng
        preconditions:
          - "episode.status == MASTERED"
          - "If transcript_requested: TRANSCRIPT Deliverable status == READY"
        side_effects: []
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /episodes/{id}/publish"
        actor: ProducerEng
        preconditions:
          - "episode.status == SCHEDULED"
          - "owning Show.production_posture IN {ACTIVE, ON_HOLD}"
        side_effects:
          - "Set published_at = clock now"
          - "PER_EPISODE contract: create + ISSUE an Invoice (calc invoice_total + late_fee); show.lifetime_billed_cents += total_cents"
          - "Recompute owning Show.open_episode_count and production_posture"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /episodes/{id}/cancel"
        actor: ShowOwner
        preconditions:
          - "episode.status IN {INTAKE, RECORDING, EDITING, REVIEW}"
        side_effects:
          - "Any BOOKED/LIVE Session for this episode -> CANCELLED"
          - "Recompute owning Show.open_episode_count"
      - from: RECORDING
        to: CANCELLED
        trigger: "POST /episodes/{id}/cancel"
        actor: ShowOwner
        preconditions:
          - "episode.status IN {INTAKE, RECORDING, EDITING, REVIEW}"
        side_effects:
          - "Any BOOKED/LIVE Session for this episode -> CANCELLED"
          - "Recompute owning Show.open_episode_count"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /episodes/{id}/archive"
        actor: PlatformAdmin
        preconditions:
          - "episode.status == PUBLISHED"
        side_effects:
          - "Recompute owning Show.open_episode_count"

  # ---- Session (branching: LIVE path vs CANCELLED) ----
  - entity: Session
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: LIVE
        trigger: "POST /sessions/{id}/start"
        actor: ProducerEng
        preconditions:
          - "session.status == BOOKED"
          - "owning Episode.status IN {INTAKE, RECORDING}"
        side_effects:
          - "Episode (if INTAKE) -> RECORDING"
      - from: LIVE
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: ProducerEng
        preconditions:
          - "session.status == LIVE"
        side_effects:
          - "Set completed_at = clock now"
          - "Episode RECORDING -> EDITING (bubble up); set Episode.recording_ended_at; compute provisional turnaround_due_utc"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: ProducerEng
        preconditions:
          - "session.status == BOOKED"
        side_effects: []

  # ---- AdCampaign (branching: approve path vs cancel) ----
  - entity: AdCampaign
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ad-campaigns/{id}/approve"
        actor: AdOps
        preconditions:
          - "campaign.status == DRAFT"
          - "campaign has >= 1 AdSlot"
        side_effects: []
      - from: APPROVED
        to: RECONCILED
        trigger: "POST /ad-campaigns/{id}/reconcile"
        actor: AdOps
        preconditions:
          - "campaign.status == APPROVED"
          - "every AdSlot's Episode.status == PUBLISHED"
        side_effects:
          - "Compute show_payout_cents (calc ad_revenue_split) and platform_take_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /ad-campaigns/{id}/cancel"
        actor: AdOps
        preconditions:
          - "campaign.status == DRAFT"
        side_effects: []

  # ---- Invoice (parallel-ish lifecycle: dispute branch) ----
  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: ShowOwner
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "Recompute owning Show.production_posture"
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /invoices/{id}/mark-overdue"
        actor: PlatformAdmin
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "Recompute owning Show.production_posture (-> ON_HOLD if no DISPUTED/inactive override)"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /invoices/{id}/dispute"
        actor: ShowOwner
        preconditions:
          - "invoice.status == ISSUED"
        side_effects:
          - "Recompute owning Show.production_posture (-> SUSPENDED)"
      - from: OVERDUE
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: ShowOwner
        preconditions:
          - "invoice.status == OVERDUE"
        side_effects:
          - "Recompute owning Show.production_posture"
      - from: DISPUTED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: ShowOwner
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "Recompute owning Show.production_posture"
      - from: DISPUTED
        to: VOID
        trigger: "POST /invoices/{id}/void"
        actor: PlatformAdmin
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "show.lifetime_billed_cents -= total_cents (reverse the original billing)"
          - "Recompute owning Show.production_posture"

  # ---- RetainerCycle (linear) ----
  - entity: RetainerCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /retainer-cycles/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "cycle.status == OPEN"
          - "owning EngagementContract.engagement_type == RETAINER"
        side_effects:
          - "Run retainer_reconciliation (final variant): set included_consumed, overage_episode_count"
          - "If overage_episode_count > 0: create + ISSUE a RETAINER_OVERAGE Invoice; show.lifetime_billed_cents += total_cents"
          - "Set closed_at; recompute owning Show.production_posture"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: contract-terminate-stale
    parent_entity: EngagementContract
    write_endpoint: "POST /contracts/{id}/terminate"
    occ_field: "expected_engagementcontract_version"
    description: |
      Terminating an EngagementContract whose version has advanced since the
      client last observed it is rejected. An activate or a posture-driven
      recompute may have bumped the contract's version after the client read
      it, so the termination is acting on a stale view and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-reconcile-stale
    parent_entity: AdCampaign
    write_endpoint: "POST /ad-campaigns/{id}/reconcile"
    occ_field: "expected_adcampaign_version"
    description: |
      Reconciling an AdCampaign whose version has advanced since the client
      last observed it is rejected. A slot addition or an approve transition
      may have bumped the campaign's version; reconciling against a stale
      version would settle revenue over a slot set the client never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: turnaround_due
    trigger: "Provisional at Session complete (RECORDING->EDITING); finalized at edit approval (REVIEW->MASTERED)"
    algorithm: forward_looking
    formula: |
      sla_hours(track_count) = TIER_SLA[contract.tier]
                               + max(0, track_count - MULTITRACK_FLOOR_TRACKS) * SURCHARGE_HOURS_PER_TRACK
      PROVISIONAL: turnaround_due_utc = episode.recording_ended_at + hours( sla_hours(episode.planned_track_count) )
      FINAL:       turnaround_due_utc = episode.assets_complete_at  + hours( sla_hours(episode.raw_track_count) )
      delivered_late (set at approval) = (approval_clock_now > FINAL turnaround_due_utc)
    input_set: "Single Episode plus its EngagementContract.tier; planned_track_count (provisional) or raw_track_count (final, frozen at lock-assets)"
    constants:
      TIER_SLA: { STANDARD: 72, PRIORITY: 48, RUSH: 24 }
      SURCHARGE_HOURS_PER_TRACK: 6
      MULTITRACK_FLOOR_TRACKS: 2
    precision: "datetime arithmetic in whole hours; no rounding"
    variants:
      - name: provisional
        when: "On RECORDING->EDITING; anchor=recording_ended_at, tracks=planned_track_count"
        difference: "Uses planned (intake estimate) track count and recording_ended_at anchor"
      - name: final
        when: "On REVIEW->MASTERED; anchor=assets_complete_at, tracks=raw_track_count (actual uploaded)"
        difference: "Uses actual locked raw_track_count and assets_complete_at anchor; may differ from provisional when actual tracks != planned or assets locked later than recording end"

  - name: invoice_total
    trigger: "On Episode SCHEDULED->PUBLISHED for a PER_EPISODE-contract episode"
    algorithm: tiered_pricing
    formula: |
      base_cents = TIER_BASE_CENTS[contract.tier]
      transcript_cents = TRANSCRIPT_CENTS if episode.transcript_requested else 0
      extra_track_cents = max(0, episode.raw_track_count - EXTRA_TRACK_FLOOR) * EXTRA_TRACK_RATE_CENTS
      subtotal_cents = base_cents + transcript_cents + extra_track_cents
      raw_discount = round_half_up(subtotal_cents * contract.loyalty_discount_pct)
      discount_cents = min(raw_discount, DISCOUNT_CAP_CENTS)
      # total_cents combines with late_fee (see calc late_fee); evaluation order pinned there.
      total_cents = subtotal_cents - discount_cents + late_fee_cents
    input_set: "Single Episode + its PER_EPISODE EngagementContract"
    constants:
      TIER_BASE_CENTS: { STANDARD: 15000, PRIORITY: 22000, RUSH: 35000 }
      TRANSCRIPT_CENTS: 4000
      EXTRA_TRACK_FLOOR: 2
      EXTRA_TRACK_RATE_CENTS: 2500
      DISCOUNT_CAP_CENTS: 5000
    precision: "integer cents; round_half_up on discount product before capping"

  - name: late_fee
    trigger: "On Episode SCHEDULED->PUBLISHED (PER_EPISODE) and on RetainerCycle close, when delivery was late"
    algorithm: threshold
    formula: |
      # Circular-looking dependency pinned by evaluation order:
      #   late_fee depends on a tier, the tier is keyed on show.lifetime_billed_cents,
      #   and show.lifetime_billed_cents is itself increased BY this invoice's total.
      #   PIN: select tier from the lifetime SNAPSHOT taken BEFORE this invoice is added,
      #   compute late_fee + total, THEN add total to lifetime_billed_cents.
      snapshot = show.lifetime_billed_cents  # value BEFORE adding this invoice
      tier = GOLD   if snapshot >= GOLD_THRESHOLD_CENTS
             else SILVER if snapshot >= SILVER_THRESHOLD_CENTS
             else BRONZE
      late_fee_cents = round_half_up( (subtotal_cents - discount_cents) * LATE_FEE_PCT[tier] ) if episode.delivered_late else 0
      # then: total_cents = subtotal_cents - discount_cents + late_fee_cents
      #       show.lifetime_billed_cents += total_cents
    input_set: "Single Invoice + owning Show.lifetime_billed_cents snapshot"
    constants:
      GOLD_THRESHOLD_CENTS: 80000
      SILVER_THRESHOLD_CENTS: 40000
      LATE_FEE_PCT: { BRONZE: 0.02, SILVER: 0.035, GOLD: 0.05 }
    precision: "integer cents; round_half_up on the percentage product"
    variants:
      - name: applied
        when: "episode.delivered_late == true"
        difference: "Adds the tier-keyed surcharge"
      - name: waived
        when: "episode.delivered_late == false"
        difference: "late_fee_cents = 0 regardless of tier"

  - name: retainer_reconciliation
    trigger: "Provisional on GET /retainer-cycles/{id}/projection; final on POST /retainer-cycles/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      # Order episodes chronologically by published_at ASC, tie-break created_at ASC.
      # Fill the included allotment first, then everything else is overage.
      eligible = episodes of contract's show whose published_at in [cycle_start_utc, cycle_end_utc)
                 AND (variant filter below)
      sorted = eligible sorted by (published_at ASC, created_at ASC)
      included_consumed = min(len(sorted), contract.monthly_included_episodes)
      overage_episode_count = max(0, len(sorted) - contract.monthly_included_episodes)
      overage_subtotal_cents = overage_episode_count * OVERAGE_RATE_CENTS[contract.tier]
    input_set: "All Episodes of the contract's show, filtered by published_at window and status per variant"
    constants:
      OVERAGE_RATE_CENTS: { STANDARD: 12000, PRIORITY: 16000, RUSH: 22000 }
    precision: "integer cents"
    variants:
      - name: provisional
        when: "GET projection — forward-looking"
        difference: "eligible includes episodes with status IN {SCHEDULED, PUBLISHED} (SCHEDULED counted by intended publish window using published_at when set, else treated as in-window); over-counts vs final"
      - name: final
        when: "POST close — chronological at cycle close"
        difference: "eligible includes ONLY status == PUBLISHED with a non-null published_at in the window; the authoritative billed count"

  - name: ad_revenue_split
    trigger: "On AdCampaign APPROVED->RECONCILED"
    algorithm: weighted_scoring
    formula: |
      # Rounding ORDER is pinned: round each slot's show share, THEN sum.
      # (round-per-slot-then-sum), NOT sum-then-round — the two differ in cents.
      keep = 1 - campaign.platform_fee_pct
      show_payout_cents = sum over slots of round_half_up(slot.gross_cents * keep)
      gross_total = sum over slots of slot.gross_cents
      platform_take_cents = gross_total - show_payout_cents
    input_set: "All AdSlot rows for the campaign (campaign_id == campaign.id)"
    constants: {}
    precision: "integer cents; round_half_up PER SLOT, then sum"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role header present and a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: auth, check: "For entity_backed role acting on owned resource, X-User-ID matches the resource's owner FK (ShowOwner==Show.id chain; ProducerEng==Engineer.id on its sessions)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "owner-scoped operations" }
  - { priority: 4,  category: existence, check: "All path/body referenced resources exist (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: existence, check: "Request body parses, required fields present, types valid", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6,  category: existence, check: "Enum field value is a declared member", error_id: ERR_INVALID_ENUM, http_status: 422, applies_to: "all writes with enum inputs" }
  - { priority: 7,  category: state, check: "Pagination limit within [1,100], offset >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "list endpoints" }
  - { priority: 10, category: state, check: "Target resource in a valid state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 11, category: state, check: "OCC: expected_<parent>_version matches current parent.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /contracts/{id}/terminate, POST /ad-campaigns/{id}/reconcile" }
  - { priority: 12, category: state, check: "Episode creation requires owning Show.production_posture == ACTIVE", error_id: ERR_SHOW_NOT_ACTIVE, http_status: 409, applies_to: "POST /episodes" }
  - { priority: 13, category: state, check: "Session booking requires owning Show.production_posture == ACTIVE", error_id: ERR_SHOW_NOT_ACTIVE, http_status: 409, applies_to: "POST /sessions" }
  - { priority: 14, category: state, check: "Episode publish requires owning Show.production_posture IN {ACTIVE, ON_HOLD}", error_id: ERR_SHOW_SUSPENDED, http_status: 409, applies_to: "POST /episodes/{id}/publish" }
  - { priority: 20, category: business_referential, check: "Episode.contract_id references an ACTIVE EngagementContract belonging to the same show", error_id: ERR_CONTRACT_NOT_ACTIVE, http_status: 409, applies_to: "POST /episodes" }
  - { priority: 21, category: business_referential, check: "AssetVersion.supersedes_version_id (when set) references an ACCEPTED AssetVersion of the SAME deliverable", error_id: ERR_INVALID_SUPERSEDE, http_status: 409, applies_to: "POST /asset-versions" }
  - { priority: 22, category: business_safety, check: "MASTER_AUDIO accepted version integrated_loudness within LOUDNESS_TOLERANCE_LUFS of Show.target_loudness_lufs at edit-approval", error_id: ERR_LOUDNESS_OUT_OF_SPEC, http_status: 409, applies_to: "POST /episodes/{id}/approve-edit" }
  - { priority: 23, category: business_safety, check: "MASTER_AUDIO AssetVersion accept requires integrated_loudness within LOUDNESS_TOLERANCE_LUFS of Show.target_loudness_lufs", error_id: ERR_LOUDNESS_OUT_OF_SPEC, http_status: 409, applies_to: "POST /asset-versions/{id}/accept" }
  - { priority: 24, category: business_temporal, check: "STUDIO session window must not overlap (half-open [start,end)) any non-CANCELLED STUDIO session for the same engineer; touching endpoints allowed", error_id: ERR_SESSION_OVERLAP, http_status: 409, applies_to: "POST /sessions (capture_mode=STUDIO)" }
  - { priority: 25, category: business_temporal, check: "REMOTE session must be separated from any non-CANCELLED REMOTE session for the same engineer by >= engineer.remote_buffer_minutes (start of later >= end of earlier + buffer); a gap exactly equal to the buffer is allowed", error_id: ERR_REMOTE_BUFFER_VIOLATION, http_status: 409, applies_to: "POST /sessions (capture_mode=REMOTE)" }
  - { priority: 26, category: business_temporal, check: "Session scheduled_end_utc strictly after scheduled_start_utc", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /sessions" }
  - { priority: 27, category: business_temporal, check: "RetainerCycle cycle_end_utc strictly after cycle_start_utc", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /retainer-cycles" }
  - { priority: 28, category: business_temporal, check: "New RetainerCycle window must not overlap (half-open [start,end)) any existing RetainerCycle (any status) of the SAME contract; touching endpoints (earlier.end == later.start) allowed; no buffer", error_id: ERR_CYCLE_OVERLAP, http_status: 409, applies_to: "POST /retainer-cycles" }
  - { priority: 29, category: business_constraint, check: "Engineer must be active==true to receive a Session booking", error_id: ERR_ENGINEER_INACTIVE, http_status: 409, applies_to: "POST /sessions" }
  - { priority: 30, category: business_constraint, check: "AdCampaign reconcile requires every AdSlot's Episode in PUBLISHED", error_id: ERR_SLOT_EPISODE_NOT_PUBLISHED, http_status: 409, applies_to: "POST /ad-campaigns/{id}/reconcile" }
  - { priority: 31, category: business_constraint, check: "Episode schedule requires TRANSCRIPT Deliverable READY when transcript_requested==true", error_id: ERR_TRANSCRIPT_NOT_READY, http_status: 409, applies_to: "POST /episodes/{id}/schedule" }
  - { priority: 32, category: business_constraint, check: "Episode approve-edit requires MASTER_AUDIO Deliverable READY", error_id: ERR_MASTER_NOT_READY, http_status: 409, applies_to: "POST /episodes/{id}/approve-edit" }
  - { priority: 33, category: business_constraint, check: "RetainerCycle close requires owning contract engagement_type==RETAINER", error_id: ERR_NOT_RETAINER, http_status: 409, applies_to: "POST /retainer-cycles/{id}/close" }
  - { priority: 34, category: business_constraint, check: "submit-edit requires assets locked (assets_complete_at set) for the episode", error_id: ERR_ASSETS_NOT_LOCKED, http_status: 409, applies_to: "POST /episodes/{id}/submit-edit" }
  - { priority: 35, category: business_constraint, check: "AdCampaign approve requires >= 1 AdSlot on the campaign", error_id: ERR_NO_SLOTS, http_status: 409, applies_to: "POST /ad-campaigns/{id}/approve" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced to the given instant"]

  # ---- Show ----
  - method: POST
    path: "/shows"
    description: "Create a Show (production_posture starts SUSPENDED until an ACTIVE contract exists)"
    roles: [PlatformAdmin, ShowOwner]
    code: 201
    input: [title, format, billing_model, "target_loudness_lufs?"]
    output: Show
    side_effects: ["production_posture=SUSPENDED, lifetime_billed_cents=0, open_episode_count=0"]
  - method: GET
    path: "/shows"
    description: "List shows (paginated)"
    roles: [PlatformAdmin, ShowOwner, ProducerEng, AdOps]
    code: 200
    input: ["limit?", "offset?", "production_posture?"]
    output: Show[]
    side_effects: []
  - method: GET
    path: "/shows/{id}"
    description: "Get a Show with computed posture/lifetime fields"
    roles: [PlatformAdmin, ShowOwner, ProducerEng, AdOps]
    code: 200
    input: []
    output: Show
    side_effects: []

  # ---- EngagementContract ----
  - method: POST
    path: "/contracts"
    description: "Create an EngagementContract (DRAFT) for a show"
    roles: [PlatformAdmin]
    code: 201
    input: [show_id, tier, engagement_type, "monthly_included_episodes?", "loyalty_discount_pct?"]
    output: EngagementContract
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/contracts"
    description: "List contracts; filter by show"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: ["show_id?", "status?", "limit?", "offset?"]
    output: EngagementContract[]
    side_effects: []
  - method: GET
    path: "/contracts/{id}"
    description: "Get a contract"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: []
    output: EngagementContract
    side_effects: []
  - method: POST
    path: "/contracts/{id}/activate"
    description: "Activate a DRAFT contract"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EngagementContract
    side_effects: ["status=ACTIVE; set activated_at; recompute Show.production_posture; increments EngagementContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/terminate"
    description: "Terminate an ACTIVE contract (OCC-guarded)"
    roles: [PlatformAdmin]
    code: 200
    input: [expected_engagementcontract_version]
    output: EngagementContract
    side_effects: ["status=TERMINATED; recompute Show.production_posture; increments EngagementContract.version by 1"]
  - method: POST
    path: "/contracts/{id}/expire"
    description: "Expire an ACTIVE contract"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: EngagementContract
    side_effects: ["status=EXPIRED; recompute Show.production_posture; increments EngagementContract.version by 1"]

  # ---- RetainerCycle ----
  - method: POST
    path: "/retainer-cycles"
    description: "Open a billing cycle for a RETAINER contract"
    roles: [PlatformAdmin]
    code: 201
    input: [contract_id, cycle_start_utc, cycle_end_utc]
    output: RetainerCycle
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/retainer-cycles"
    description: "List retainer cycles; filter by contract"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RetainerCycle[]
    side_effects: []
  - method: GET
    path: "/retainer-cycles/{id}"
    description: "Get a retainer cycle"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: []
    output: RetainerCycle
    side_effects: []
  - method: GET
    path: "/retainer-cycles/{id}/projection"
    description: "Provisional retainer reconciliation (forward-looking variant) without closing"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: []
    output: RetainerCycle
    side_effects: ["Returns projected included_consumed / overage_episode_count (provisional variant); does NOT persist"]
  - method: POST
    path: "/retainer-cycles/{id}/close"
    description: "Close a cycle; run final reconciliation and bill overage"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RetainerCycle
    side_effects: ["status=CLOSED; final retainer_reconciliation; maybe create RETAINER_OVERAGE Invoice; lifetime_billed_cents += total; recompute posture"]

  # ---- Engineer ----
  - method: POST
    path: "/engineers"
    description: "Create a production engineer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, "remote_buffer_minutes?", "active?"]
    output: Engineer
    side_effects: []
  - method: GET
    path: "/engineers"
    description: "List engineers"
    roles: [PlatformAdmin, ProducerEng]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: Engineer[]
    side_effects: []
  - method: GET
    path: "/engineers/{id}"
    description: "Get an engineer"
    roles: [PlatformAdmin, ProducerEng]
    code: 200
    input: []
    output: Engineer
    side_effects: []

  # ---- Episode ----
  - method: POST
    path: "/episodes"
    description: "Create an Episode (INTAKE); requires ACTIVE show posture and ACTIVE same-show contract"
    roles: [ShowOwner, PlatformAdmin]
    code: 201
    input: [show_id, contract_id, title, planned_track_count, "transcript_requested?"]
    output: Episode
    side_effects: ["status=INTAKE; recompute Show.open_episode_count and production_posture"]
  - method: GET
    path: "/episodes"
    description: "List episodes; filter by show or contract"
    roles: [PlatformAdmin, ShowOwner, ProducerEng, AdOps]
    code: 200
    input: ["show_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: Episode[]
    side_effects: []
  - method: GET
    path: "/episodes/{id}"
    description: "Get an episode with computed turnaround/late fields"
    roles: [PlatformAdmin, ShowOwner, ProducerEng, AdOps]
    code: 200
    input: []
    output: Episode
    side_effects: []
  - method: POST
    path: "/episodes/{id}/lock-assets"
    description: "Lock raw assets: stamp assets_complete_at and freeze raw_track_count for final turnaround"
    roles: [ProducerEng]
    code: 200
    input: [raw_track_count]
    output: Episode
    side_effects: ["Set assets_complete_at = clock now; set raw_track_count from request"]
  - method: POST
    path: "/episodes/{id}/submit-edit"
    description: "Move EDITING -> REVIEW"
    roles: [ProducerEng]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=REVIEW"]
  - method: POST
    path: "/episodes/{id}/request-revision"
    description: "Move REVIEW -> EDITING (revision loop)"
    roles: [ShowOwner]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=EDITING; increment revision_count"]
  - method: POST
    path: "/episodes/{id}/approve-edit"
    description: "Move REVIEW -> MASTERED; finalize turnaround and delivered_late"
    roles: [ShowOwner]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=MASTERED; finalize turnaround_due_utc (final variant); set delivered_late; MASTER_AUDIO Deliverable -> DELIVERED"]
  - method: POST
    path: "/episodes/{id}/schedule"
    description: "Move MASTERED -> SCHEDULED"
    roles: [ProducerEng]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=SCHEDULED"]
  - method: POST
    path: "/episodes/{id}/publish"
    description: "Move SCHEDULED -> PUBLISHED; bill PER_EPISODE invoice"
    roles: [ProducerEng]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=PUBLISHED; set published_at; PER_EPISODE: create+ISSUE Invoice (invoice_total+late_fee), lifetime_billed_cents += total; recompute open_episode_count and posture"]
  - method: POST
    path: "/episodes/{id}/cancel"
    description: "Cancel an episode (non-terminal)"
    roles: [ShowOwner]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=CANCELLED; cascade non-terminal Sessions -> CANCELLED; recompute open_episode_count"]
  - method: POST
    path: "/episodes/{id}/archive"
    description: "Archive a PUBLISHED episode"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Episode
    side_effects: ["status=ARCHIVED; recompute open_episode_count"]

  # ---- Session ----
  - method: POST
    path: "/sessions"
    description: "Book a recording session (STUDIO overlap & REMOTE buffer checks)"
    roles: [ProducerEng]
    code: 201
    input: [episode_id, engineer_id, capture_mode, scheduled_start_utc, scheduled_end_utc]
    output: Session
    side_effects: ["status=BOOKED; first session moves Episode INTAKE state context"]
  - method: GET
    path: "/sessions"
    description: "List sessions; filter by episode or engineer"
    roles: [PlatformAdmin, ProducerEng]
    code: 200
    input: ["episode_id?", "engineer_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []
  - method: GET
    path: "/sessions/{id}"
    description: "Get a session"
    roles: [PlatformAdmin, ProducerEng]
    code: 200
    input: []
    output: Session
    side_effects: []
  - method: POST
    path: "/sessions/{id}/start"
    description: "Start a BOOKED session (BOOKED -> LIVE)"
    roles: [ProducerEng]
    code: 200
    input: []
    output: Session
    side_effects: ["status=LIVE; Episode INTAKE -> RECORDING"]
  - method: POST
    path: "/sessions/{id}/complete"
    description: "Complete a LIVE session; bubble Episode RECORDING -> EDITING"
    roles: [ProducerEng]
    code: 200
    input: []
    output: Session
    side_effects: ["status=COMPLETED; set completed_at; Episode -> EDITING; set recording_ended_at; compute provisional turnaround_due_utc"]
  - method: POST
    path: "/sessions/{id}/cancel"
    description: "Cancel a BOOKED session"
    roles: [ProducerEng]
    code: 200
    input: []
    output: Session
    side_effects: ["status=CANCELLED"]

  # ---- Deliverable + AssetVersion ----
  - method: POST
    path: "/deliverables"
    description: "Create a deliverable (PENDING) for an episode"
    roles: [ProducerEng]
    code: 201
    input: [episode_id, kind]
    output: Deliverable
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/deliverables"
    description: "List deliverables; filter by episode"
    roles: [PlatformAdmin, ProducerEng, ShowOwner]
    code: 200
    input: ["episode_id?", "kind?", "status?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []
  - method: GET
    path: "/deliverables/{id}"
    description: "Get a deliverable"
    roles: [PlatformAdmin, ProducerEng, ShowOwner]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: POST
    path: "/asset-versions"
    description: "Submit an asset version (SUBMITTED) against a deliverable"
    roles: [ProducerEng]
    code: 201
    input: [deliverable_id, "supersedes_version_id?", "integrated_loudness_lufs?"]
    output: AssetVersion
    side_effects: ["status=SUBMITTED; version_no = supersedes' version_no + 1 (or 1)"]
  - method: GET
    path: "/asset-versions"
    description: "List asset versions; filter by deliverable or by the version they supersede"
    roles: [PlatformAdmin, ProducerEng, ShowOwner]
    code: 200
    input: ["deliverable_id?", "supersedes_version_id?", "status?", "limit?", "offset?"]
    output: AssetVersion[]
    side_effects: []
  - method: GET
    path: "/asset-versions/{id}"
    description: "Get a single asset version"
    roles: [PlatformAdmin, ProducerEng, ShowOwner]
    code: 200
    input: []
    output: AssetVersion
    side_effects: []
  - method: POST
    path: "/asset-versions/{id}/accept"
    description: "Accept a SUBMITTED version (loudness check for MASTER_AUDIO); deliverable -> READY"
    roles: [ShowOwner, ProducerEng]
    code: 200
    input: []
    output: AssetVersion
    side_effects: ["status=ACCEPTED; Deliverable -> READY; Deliverable.current_version_no = version_no"]
  - method: POST
    path: "/asset-versions/{id}/reject"
    description: "Reject a SUBMITTED version"
    roles: [ShowOwner]
    code: 200
    input: []
    output: AssetVersion
    side_effects: ["status=REJECTED"]

  # ---- Invoice ----
  - method: GET
    path: "/invoices"
    description: "List invoices; filter by show or episode or cycle"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: ["show_id?", "episode_id?", "retainer_cycle_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice with computed money fields"
    roles: [PlatformAdmin, ShowOwner]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an ISSUED/OVERDUE/DISPUTED invoice"
    roles: [ShowOwner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=PAID; recompute Show.production_posture"]
  - method: POST
    path: "/invoices/{id}/mark-overdue"
    description: "Mark an ISSUED invoice OVERDUE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=OVERDUE; recompute Show.production_posture (ON_HOLD)"]
  - method: POST
    path: "/invoices/{id}/dispute"
    description: "Dispute an ISSUED invoice"
    roles: [ShowOwner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=DISPUTED; recompute Show.production_posture (SUSPENDED)"]
  - method: POST
    path: "/invoices/{id}/void"
    description: "Void a DISPUTED invoice; reverse the billing"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status=VOID; lifetime_billed_cents -= total_cents; recompute posture"]

  # ---- AdCampaign + AdSlot ----
  - method: POST
    path: "/ad-campaigns"
    description: "Create an ad campaign (DRAFT)"
    roles: [AdOps]
    code: 201
    input: [show_id, sponsor_name, "platform_fee_pct?"]
    output: AdCampaign
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/ad-campaigns"
    description: "List ad campaigns; filter by show"
    roles: [PlatformAdmin, AdOps]
    code: 200
    input: ["show_id?", "status?", "limit?", "offset?"]
    output: AdCampaign[]
    side_effects: []
  - method: GET
    path: "/ad-campaigns/{id}"
    description: "Get an ad campaign with computed splits"
    roles: [PlatformAdmin, AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/ad-campaigns/{id}/approve"
    description: "Approve a DRAFT campaign (DRAFT -> APPROVED)"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status=APPROVED"]
  - method: POST
    path: "/ad-campaigns/{id}/reconcile"
    description: "Reconcile an APPROVED campaign (OCC-guarded); compute revenue split"
    roles: [AdOps]
    code: 200
    input: [expected_adcampaign_version]
    output: AdCampaign
    side_effects: ["status=RECONCILED; compute show_payout_cents / platform_take_cents; increments AdCampaign.version by 1"]
  - method: POST
    path: "/ad-campaigns/{id}/cancel"
    description: "Cancel a DRAFT campaign"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["status=CANCELLED"]
  - method: POST
    path: "/ad-slots"
    description: "Add an ad slot to a DRAFT campaign"
    roles: [AdOps]
    code: 201
    input: [campaign_id, episode_id, placement, gross_cents]
    output: AdSlot
    side_effects: ["increments AdCampaign.version by 1 (slot set changed)"]
  - method: GET
    path: "/ad-slots"
    description: "List ad slots; filter by campaign or episode"
    roles: [PlatformAdmin, AdOps]
    code: 200
    input: ["campaign_id?", "episode_id?", "limit?", "offset?"]
    output: AdSlot[]
    side_effects: []
  - method: GET
    path: "/ad-slots/{id}"
    description: "Get a single ad slot"
    roles: [PlatformAdmin, AdOps]
    code: 200
    input: []
    output: AdSlot
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing or unknown X-User-Role header" }
  - { id: ERR_FORBIDDEN_ROLE,         http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER,     http: 403, condition: "entity_backed actor is not the owner of the targeted resource" }
  - { id: ERR_NOT_FOUND,              http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST,        http: 400, condition: "Malformed body, missing required field, or type mismatch" }
  - { id: ERR_INVALID_ENUM,           http: 422, condition: "Enum field value not a declared member" }
  - { id: ERR_INVALID_PAGINATION,     http: 400, condition: "limit outside [1,100] or offset < 0" }
  - { id: ERR_INVALID_WINDOW,         http: 422, condition: "Interval end not strictly after start (Session or RetainerCycle)" }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION,          http: 412, condition: "OCC expected_<parent>_version does not match current parent.version" }
  - { id: ERR_SHOW_NOT_ACTIVE,        http: 409, condition: "Operation requires owning Show.production_posture == ACTIVE" }
  - { id: ERR_SHOW_SUSPENDED,         http: 409, condition: "Publish requires posture IN {ACTIVE, ON_HOLD}; show is SUSPENDED" }
  - { id: ERR_CONTRACT_NOT_ACTIVE,    http: 409, condition: "Referenced EngagementContract is not ACTIVE or belongs to a different show" }
  - { id: ERR_INVALID_SUPERSEDE,      http: 409, condition: "supersedes_version_id is not an ACCEPTED version of the same deliverable" }
  - { id: ERR_LOUDNESS_OUT_OF_SPEC,   http: 409, condition: "MASTER_AUDIO integrated_loudness outside tolerance of show target" }
  - { id: ERR_SESSION_OVERLAP,        http: 409, condition: "STUDIO session window overlaps another non-CANCELLED STUDIO session for the engineer" }
  - { id: ERR_REMOTE_BUFFER_VIOLATION,http: 409, condition: "REMOTE session too close to another REMOTE session for the engineer (< remote_buffer_minutes gap)" }
  - { id: ERR_ENGINEER_INACTIVE,      http: 409, condition: "Engineer.active is false; cannot receive bookings" }
  - { id: ERR_SLOT_EPISODE_NOT_PUBLISHED, http: 409, condition: "AdCampaign reconcile blocked: a slot's episode is not PUBLISHED" }
  - { id: ERR_TRANSCRIPT_NOT_READY,   http: 409, condition: "Schedule blocked: TRANSCRIPT deliverable not READY while transcript_requested" }
  - { id: ERR_MASTER_NOT_READY,       http: 409, condition: "approve-edit blocked: MASTER_AUDIO deliverable not READY" }
  - { id: ERR_NOT_RETAINER,           http: 409, condition: "RetainerCycle close on a non-RETAINER contract" }
  - { id: ERR_ASSETS_NOT_LOCKED,      http: 409, condition: "submit-edit blocked: assets not locked (assets_complete_at unset)" }
  - { id: ERR_NO_SLOTS,               http: 409, condition: "AdCampaign approve blocked: campaign has zero AdSlots" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator: manages contracts, retainer cycles, engineers, invoice ops, archival"
    identity: "opaque"
    exclusive_operations:
      - "POST /contracts — create contract"
      - "POST /contracts/{id}/activate — activate"
      - "POST /contracts/{id}/terminate — terminate (OCC)"
      - "POST /contracts/{id}/expire — expire"
      - "POST /retainer-cycles — open cycle"
      - "POST /retainer-cycles/{id}/close — close cycle"
      - "POST /engineers — create engineer"
      - "POST /invoices/{id}/mark-overdue — mark overdue"
      - "POST /invoices/{id}/void — void disputed invoice"
      - "POST /episodes/{id}/archive — archive episode"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /shows — create show (shared with ShowOwner)"
      - "GET reads across shows/contracts/episodes/invoices/etc."

  - name: ShowOwner
    description: "Client owning a Show: requests work, reviews edits, manages invoices on their show"
    identity: "entity_backed:Show"
    exclusive_operations:
      - "POST /episodes/{id}/request-revision — send back to editing"
      - "POST /episodes/{id}/approve-edit — approve edit"
      - "POST /episodes/{id}/cancel — cancel episode"
      - "POST /asset-versions/{id}/reject — reject version"
      - "POST /invoices/{id}/pay — pay invoice"
      - "POST /invoices/{id}/dispute — dispute invoice"
    shared_operations:
      - "POST /shows — create show (shared with PlatformAdmin)"
      - "POST /episodes — create episode (shared with PlatformAdmin)"
      - "POST /asset-versions/{id}/accept — accept version (shared with ProducerEng)"
      - "GET reads on owned shows/episodes/deliverables/invoices"

  - name: ProducerEng
    description: "Production engineer: recording sessions, editing, mastering deliverables, scheduling/publishing"
    identity: "entity_backed:Engineer"
    exclusive_operations:
      - "POST /sessions — book session"
      - "POST /sessions/{id}/start — start"
      - "POST /sessions/{id}/complete — complete"
      - "POST /sessions/{id}/cancel — cancel session"
      - "POST /assets — upload asset"
      - "POST /episodes/{id}/lock-assets — lock assets"
      - "POST /episodes/{id}/submit-edit — submit edit"
      - "POST /episodes/{id}/schedule — schedule"
      - "POST /episodes/{id}/publish — publish"
      - "POST /deliverables — create deliverable"
      - "POST /asset-versions — submit version"
    shared_operations:
      - "POST /asset-versions/{id}/accept — accept version (shared with ShowOwner)"
      - "GET reads on engineers/sessions/episodes/deliverables/assets"

  - name: AdOps
    description: "Sponsorship coordinator: ad campaigns, slot placement, revenue reconciliation"
    identity: "opaque"
    exclusive_operations:
      - "POST /ad-campaigns — create campaign"
      - "POST /ad-campaigns/{id}/approve — approve"
      - "POST /ad-campaigns/{id}/reconcile — reconcile (OCC)"
      - "POST /ad-campaigns/{id}/cancel — cancel"
      - "POST /ad-slots — add slot"
    shared_operations:
      - "GET reads on ad-campaigns/ad-slots/shows/episodes"
