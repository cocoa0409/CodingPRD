  # ==========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tower_occupancy_conserved_under_allocate_release
        grounds:
          - entities.Rack.fields.occupied_towers
          - state_machines.TowerAllocation
          - state_machines.Tower
        distinguishing_aspect: |
          Conserved quantity: physical tower occupancy — INVARIANT: rack.occupied_towers ==
          count(ACTIVE TowerAllocations on the rack's towers). Allocate (batch create) then
          compensate (harvest release) returns the rack to exactly its prior count with all
          towers IDLE — zero drift through the whole chain.
        test_recipe:
          setup:
            - "Rack R-01 (4 towers, WL-A), occupied_towers == 0 at baseline"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 4 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
          trigger:
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}", as: FarmManager, captures: { occ_mid: "$.data.occupied_towers" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/mark-harvest-ready", as: Grower }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T06:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/harvest", payload: { grade_a_lb: 46.0, grade_b_lb: 0.0, cull_lb: 0.0 }, as: Grower, as_user_id: "grower-7" }
            - { call: "GET /farm/racks/${rk_1}", as: FarmManager, captures: { occ_end: "$.data.occupied_towers" } }
            - { call: "GET /farm/towers/${t1}", as: FarmManager, captures: { t1_end: "$.data.tower_status" } }
          assert:
            - "baseline: occupied_towers == 0"
            - "after batch create: occupied_towers == 4 (forward action)"
            - "after harvest (compensating action): occupied_towers == 0 — exactly the baseline, no drift"
            - "Tower.${t1}.tower_status == IDLE"

