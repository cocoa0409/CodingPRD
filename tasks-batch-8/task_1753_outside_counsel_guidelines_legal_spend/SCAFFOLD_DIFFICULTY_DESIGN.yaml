              payload: {}
              as: LegalOpsReviewer
              captures: { billed_pct: $.data.partner_share_pct }
            - call: "GET /legal-departments/${dept_id}/matters/${matter_id}/staffing-ratio?basis=HEADCOUNT"
              payload: {}
              as: LegalOpsReviewer
              captures: { headcount_pct: $.data.partner_share_pct }
          assert:
            - "billed_pct == 83.3333 (50.00 / 60.00 * 100 at 4-decimal precision)"
            - "headcount_pct == 25.00 (1 partner / 4 qualified timekeepers)"
            - "billed_pct != headcount_pct"

  # =====================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rate_cap_nested_min_max
        grounds:
          - calculations.annual_rate_increase_pct
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (prior_rate_cents, tk_class,
          annual_rate_increase_cap_pct) and non-linear interaction via the
          nested min() with a tk_class-conditional sub-cap. A PARTNER and an
          ASSOCIATE with identical prior rates and identical proposed rates
          clamp to different approved_rate_cents.
        test_recipe:
          setup:
            - "LegalDepartment with annual_rate_increase_cap_pct=5.00"
            - "Firm has APPROVED 2026 card: PARTNER approved_rate_cents=100000; ASSOCIATE approved_rate_cents=50000"
            - "Firm creates 2027 card proposing PARTNER 106000 (6% over → above 5% cap) and ASSOCIATE 53000 (6% over → above the 5*0.80=4% sub-cap, ceiling=52000)"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "CapTest Dept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "CapFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_p: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "A1", tk_class: "ASSOCIATE" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_a: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_p}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_a}/qualify"
              payload: {}
              as: LegalOpsReviewer
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2026, expected_panel_firm_version: "${firm_v}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card26: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card26}/rates"
              payload: { timekeeper_id: "${tk_p}", hourly_rate_cents: 100000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card26}/rates"
              payload: { timekeeper_id: "${tk_a}", hourly_rate_cents: 50000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card26}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card26}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "GET /legal-departments/${dept_id}/panel-firms/${firm_id}"
              payload: {}
              as: LegalOpsReviewer
              captures: { firm_v_after_approve: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards"
              payload: { effective_year: 2027, expected_panel_firm_version: "${firm_v_after_approve}" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { card27: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card27}/rates"
              payload: { timekeeper_id: "${tk_p}", hourly_rate_cents: 106000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { rate27_p: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card27}/rates"
              payload: { timekeeper_id: "${tk_a}", hourly_rate_cents: 53000 }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { rate27_a: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card27}/submit"
              payload: {}
              as: PanelFirmUser
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card27}/approve"
              payload: {}
              as: LegalOpsReviewer
            - call: "GET /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card27}/rates/${rate27_p}"
              payload: {}
              as: LegalOpsReviewer
              captures: { p_approved: $.data.approved_rate_cents }
            - call: "GET /legal-departments/${dept_id}/panel-firms/${firm_id}/rate-cards/${card27}/rates/${rate27_a}"
              payload: {}
              as: LegalOpsReviewer
              captures: { a_approved: $.data.approved_rate_cents }
          assert:
            - "p_approved == 105000 (floor(100000 * 1.05))"
            - "a_approved == 52000 (floor(50000 * 1.04))"
            - "p_approved != 106000 and a_approved != 53000 — both clamped but by different ceilings"

      - name: forecast_evaluation_order_breaks_circle
        grounds:
          - calculations.matter_forecast_reconciliation
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — forecast.variance_cents
          depends on wip_estimate_cents which depends on unmatched accruals
          which are matched by invoice approval which itself updates
          billed_to_date_cents. The pinned order (billed_to_date → wip →
          variance) makes the value well-defined; evaluating in a different
          order would yield a different (incorrect) variance.
        test_recipe:
          setup:
            - "Matter ENGAGED with budget=100000000, lifecycle_estimate_cents set to 10000000 via forecast PUT"
            - "Two accruals: 2026-08 amount 2000000 (unmatched), 2026-09 amount 3000000 (unmatched)"
            - "One invoice covering period 2026-08 with one clean line of 1500000 (auto-approved) — matches the 2026-08 accrual, leaving only 2026-09 unmatched"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "Fcst Dept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
              as: LegalOpsReviewer
              captures: { dept_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms"
              payload: { firm_name: "FcstFirm" }
              as: LegalOpsReviewer
              captures: { firm_id: $.data.id, firm_v: $.data.version }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers"
              payload: { full_name: "P", tk_class: "PARTNER" }
              as: PanelFirmUser
              as_user_id: "${firm_id}"
              captures: { tk_id: $.data.id }
            - call: "POST /legal-departments/${dept_id}/panel-firms/${firm_id}/timekeepers/${tk_id}/qualify"
              payload: {}
