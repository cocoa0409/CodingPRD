        distinguishing_aspect: |
          Entity pair Inspection<->Finding (different from Building<->Project): a CONDUCTED inspection's
          CONDUCTED->CLOSED is rejected with ERR_OPEN_FINDINGS_BLOCK_CLOSE while its UPCS_FAIL Finding is
          OPEN, and succeeds once the Finding is CORRECTED.
