              as: CompensationCommittee
              as_user_id: "cc_certifier"
            - call: "POST /bonus-plans/${plan_id}/fund-pool"
              payload: {}
              as: CompensationCommittee
              as_user_id: "cc_certifier"
          assert:
            - "AccrualPeriod.${period1_id}.provisional_target_basis == PARTICIPANT_UNPRORATED"
            - "AccrualPeriod.${period1_id}.provisional_pool_cents == 2500000"
            - "AccrualPeriod.${period1_id}.elapsed_days == 181"
            - "AccrualPeriod.${period1_id}.cumulative_accrual_target_cents == 1239726"
            - "AccrualPeriod.${period1_id}.total_period_cents == 1334565"
            - "BonusPlan.${plan_id}.company_achievement_pct == 60.00"
            - "BonusPlan.${plan_id}.blended_achievement_pct == 80.00"
            - "BonusPlan.${plan_id}.funding_multiplier == 0.5000"
            - "BonusPlan.${plan_id}.total_target_cents == 4504110"
            - "BonusPlan.${plan_id}.funded_pool_cents == 2252055"
            - "AccrualPeriod.${period1_id}.provisional_pool_cents - BonusPlan.${plan_id}.funded_pool_cents == 247945"
            - "BusinessUnitPool.${pool_id}.funded_cents == 2252055"
            - "BusinessUnitPool.${pool_id}.min_utilization_cents == 2240794"

