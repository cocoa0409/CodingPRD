              payload: { account_id: "${acct_id}", jurisdiction_id: "${jur_id}", period_month: "2026-08" }
              as: BillingAdmin
              as_user_id: "billing-1"
              captures: { prov2_id: $.data.id }
          assert:
            - "the first trigger returns HTTP 409 with error_id ERR_DUPLICATE_PROVISIONAL_ASSESSMENT"
            - "FeeAssessment.${prov1_id}.amount_cents == 96 (round_half_up(175 * 17 / 31)) and after the void its status == VOIDED with voided_by_user_id 'billing-2'"
            - "the third trigger returns HTTP 201 with FeeAssessment.${prov2_id}.amount_cents == 96 and status ASSESSED"
            - "Jurisdiction.${jur_id}.pending_fee_cents == 96 and Account.${acct_id}.fee_liability_cents == 96"

      - name: a_thirty_minute_cutover_window_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_CUTOVER_WINDOW_LENGTH_INVALID
          - validations[priority=39]
        distinguishing_aspect: "A 30-minute window is below MIN_WINDOW_MINUTES 60 and is refused with ERR_CUTOVER_WINDOW_LENGTH_INVALID (422), while exactly 60 minutes is accepted - so the length check runs before any overlap search and the minimum is inclusive."
        test_recipe:
          setup:
            - "clock at 2026-08-03T09:00:00Z; one carrier with porting_buffer_minutes 30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
