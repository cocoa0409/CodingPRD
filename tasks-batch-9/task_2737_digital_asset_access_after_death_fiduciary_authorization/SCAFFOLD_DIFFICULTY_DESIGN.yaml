            - call: "POST /cancellation-orders/${co_id}/refund-claims"
              payload: { claimed_period_start: "2026-07-01", claimed_period_end: "2026-09-30", pursuit_cost_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { c3_id: $.data.id, c3_days: $.data.claimed_days, c3_cents: $.data.claimed_cents }
            - call: "POST /refund-claims/${c1_id}/transitions"
              payload: { action: "START_REVIEW" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /refund-claims/${c1_id}/transitions"
              payload: { action: "DENY", reason: "outside provider goodwill window" }
              as: PlatformCompliance
              as_user_id: "${p_stream_id}"
            - call: "POST /cancellation-orders/${co_id}/refund-claims"
              payload: { claimed_period_start: "2026-04-01", claimed_period_end: "2026-06-30", pursuit_cost_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { c4_id: $.data.id, c4_days: $.data.claimed_days, c4_cents: $.data.claimed_cents }
          assert:
            - "${c1_days} == 91"
            - "${c1_cents} == 2992"
            - "${err_touch} == ERR_CLAIM_PERIOD_OVERLAP"
            - "the touching claim returns HTTP 409"
            - "${c3_days} == 92"
            - "${c3_cents} == 3024"
            - "after the first two claims: SubscriptionTerm.${term_id}.claimed_days_total == 183"
            - "after the DENY: RefundClaim.${c1_id}.status == DENIED and denial_reason is not null"
            - "after the DENY: SubscriptionTerm.${term_id}.claimed_days_total == 92"
            - "${c4_days} == 91"
            - "${c4_cents} == 2992"
            - "RefundClaim.${c4_id}.status == FILED"
            - "after the refile: SubscriptionTerm.${term_id}.claimed_days_total == 183"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: transfer_reversal_restores_the_gross_equals_undistributed_plus_received_identity
        grounds:
          - state_machines.DispositionElection.transitions[SUBMITTED->EXECUTED]
          - state_machines.DispositionElection.transitions[EXECUTED->REVERSED]
          - entities.Estate.fields.undistributed_value_cents
          - entities.BeneficiaryDesignation.fields.received_value_cents
          - entities.DispositionElection.fields.distributed_value_cents
        distinguishing_aspect: |
          The ledger identity gross_digital_estate_cents == undistributed_value_cents +
          SUM(received_value_cents) must hold at THREE points: before the transfer (400033 = 400033 +
          0), after EXECUTE (400033 = 0 + 400033) and after REVERSE (400033 = 400033 + 0), with
          DispositionElection.distributed_value_cents returning to 0 — an implementation that credits
          the beneficiary without debiting the pool, or that forgets to zero distributed_value_cents,
          breaks the identity at one of the three points.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform CloudVault with supports_transfer true and transfer_fee_cents 0"
            - "one estate with VERIFIED death certificate and letters and a single beneficiary at share_bp 10000"
            - "one TRANSFERABLE CLOUD_STORAGE asset quoted 400033, CATALOG_DISCLOSED by an APPROVED request"
            - "one COMPUTED DATE_OF_DEATH ValuationRun, so appraised_value_cents is 400033 and planned_allocation_cents is 400033"
            - "one TRANSFER election in DRAFT naming that beneficiary"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
