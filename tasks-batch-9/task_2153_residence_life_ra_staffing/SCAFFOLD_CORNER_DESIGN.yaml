  - section: endpoints
    instances:

      - name: logical_clock_defaults_to_2026_08_01_before_any_set_call
        claim_type: Computed read
        grounds:
          - endpoints[POST /residence-life/_clock/set_current_utc]
        distinguishing_aspect: "The first set_current_utc call reports previous_utc == 2026-08-01T00:00:00.000Z, proving the server started from the fixed default rather than wall-clock time."
        test_recipe:
          setup:
            - "A hall exists; no clock call has been made yet in this run."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /residence-life/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "The response returns previous_utc == 2026-08-01T00:00:00.000Z"
            - "The response returns current_utc == 2026-09-01T00:00:00.000Z"
            - "Building.${b_id}.version == 1 - the clock endpoint mutates no entity"

      - name: vacating_a_room_returns_it_to_available_and_decrements_assigned_bed_count
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /residence-life/students/{student_id}/room-assignment]
          - state_machines.Room.OCCUPIED_to_AVAILABLE
          - entities.Building.fields.assigned_bed_count
        distinguishing_aspect: "VACATE drops Room.occupied_beds from 1 to 0, flips the room OCCUPIED -> AVAILABLE, nulls Student.current_room_id, sets housing_status UNASSIGNED and takes Building.assigned_bed_count from 1 to 0."
        test_recipe:
          setup:
            - "Kerr Hall floor 2 with room 201 (bed_capacity 2) occupied by Dee Sun."
          setup_api_calls:
            - call: "POST /residence-life/buildings"
              payload: { name: "Kerr Hall", code: "KERR", campus_zone: "NORTH" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { b_id: $.data.id }
            - call: "POST /residence-life/floors"
              payload: { building_id: "${b_id}", floor_number: 2 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { f_id: $.data.id }
            - call: "POST /residence-life/rooms"
              payload: { floor_id: "${f_id}", room_number: "201", bed_capacity: 2, last_renovation_year: 2021 }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { r201_id: $.data.id }
            - call: "POST /residence-life/students"
              payload: { full_name: "Dee Sun", email: "dee@u.edu", class_year: "JUNIOR" }
              as: ResidenceDirector
              as_user_id: "rd-1"
              captures: { s_dee_id: $.data.id }
            - call: "POST /residence-life/students/${s_dee_id}/room-assignment"
              payload: { action: "PLACE", room_id: "${r201_id}" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          trigger:
            - call: "POST /residence-life/students/${s_dee_id}/room-assignment"
              payload: { action: "VACATE" }
              as: ResidenceDirector
              as_user_id: "rd-1"
          assert:
            - "Before the trigger: Room.${r201_id}.status == OCCUPIED, occupied_beds == 1, Building.${b_id}.assigned_bed_count == 1"
            - "After the trigger: Student.${s_dee_id}.current_room_id == null and housing_status == UNASSIGNED"
            - "After the trigger: Room.${r201_id}.occupied_beds == 0 and Room.${r201_id}.status == AVAILABLE"
            - "After the trigger: Floor.${f_id}.occupied_beds == 0 and Building.${b_id}.assigned_bed_count == 0"
            - "Building.${b_id}.bed_capacity == 2 is unchanged"

