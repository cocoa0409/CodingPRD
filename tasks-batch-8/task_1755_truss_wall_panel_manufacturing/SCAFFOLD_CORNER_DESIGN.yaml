      - name: waste_length_threshold_exact_16ft
        claim_type: correct_result
        grounds: ["calculations.line_lumber_requirement"]
        distinguishing_aspect: "Length tier edge: 15.9 ft takes zero surcharge (waste 0.08, required 114.49) while exactly 16.0 ft takes the 0.02 surcharge (waste 0.10, required 117.34) — >= semantics at the tier boundary."
        test_recipe:
          setup: ["sealed SPF_NO2 design; cut list with lines EDGE-15 (L2X4 15.9 ft x10) and EDGE-16 (L2X4 16.0 ft x10)"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E2", license_number: "PE-2", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng2: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Edge Job", jobsite_address: "19 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jig-setups", payload: { setup_code: "JIG-ROOF-A", component_type_supported: "ROOF_TRUSS", plate_class: "P20", changeover_minutes_from: {} }, as: PlantManager, captures: { jig_roof: $.data.id } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-E", component_type: "ROOF_TRUSS", span_ft: 24.0, pitch_degrees: 18.43, design_load_psf: 40.0, lumber_grade: "SPF_NO2", plating: "P20", quantity_required: 1, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEAL_REQUESTED" }, as: DesignEngineer, as_user_id: "${eng1}" }
            - { call: "POST /plant/designs/${dsg}/transition", payload: { to_state: "SEALED" }, as: DesignEngineer, as_user_id: "${eng2}" }
            - { call: "POST /plant/designs/${dsg}/cut-lists", payload: { jig_setup_id: "${jig_roof}", lines: [ { member_label: "EDGE-15", dimension: "L2X4", length_ft: 15.9, qty: 10 }, { member_label: "EDGE-16", dimension: "L2X4", length_ft: 16.0, qty: 10 } ] }, as: ProductionPlanner, captures: { cl: $.data.id } }
            - { call: "GET /plant/cut-list-lines", payload: { cut_list_id: "${cl}" }, as: ProductionPlanner, captures: { e15: $.data.0.id, e16: $.data.1.id } }
          trigger:
            - { call: "GET /plant/cut-lists/${cl}", as: ProductionPlanner }
          assert:
            - "CutListLine.${e15}.waste_pct == 0.08 and required_board_feet == 114.49 (15.9 ft: no surcharge)"
            - "CutListLine.${e16}.waste_pct == 0.10 and required_board_feet == 117.34 (exactly 16.0 ft crosses the >= 16 tier)"
            - "CutList.${cl}.total_board_feet == 231.83 (114.49 + 117.34 per-line-rounded sum)"

      - name: freight_dual_variant_covered_by_difficulty
