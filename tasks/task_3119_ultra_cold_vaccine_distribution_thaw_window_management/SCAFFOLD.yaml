    roles: [LogisticsOperator]
    code: 200
    input: [expected_shipper_version]
    output: ColdChainShipper
    side_effects:
      - "packing_status = SEALED with packing_completed_at set when the dry ice, logger and packing duration all pass"
      - "the endpoint is refused with ERR_SHIPPER_HOLD when any packing precondition fails, and packing_status stays PREPARING"
      - "increments cold_chain_shipper.version by 1"
  - method: POST
    path: "/vaccine-distribution/shippers/{id}/hold"
    description: "Place a received shipper on hold"
    roles: [ColdChainReviewer]
    code: 200
    input: [hold_reason]
    output: ColdChainShipper
    side_effects: ["packing_status = HELD", "hold_reason set", "increments cold_chain_shipper.version by 1"]
  - method: POST
    path: "/vaccine-distribution/shippers/{id}/release"
    description: "Release a shipper for carton use once its excursions are adjudicated"
    roles: [ColdChainReviewer]
    code: 200
    input: []
    output: ColdChainShipper
    side_effects:
      - "packing_status = RELEASED"
      - "hold_reason cleared"
      - "destination inventory_status recomputed"
      - "increments cold_chain_shipper.version by 1"

