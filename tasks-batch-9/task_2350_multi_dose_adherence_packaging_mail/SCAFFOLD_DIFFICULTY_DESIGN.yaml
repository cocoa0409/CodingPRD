              captures: { line6: "$.data[0].id" }
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
              captures: { roll1: $.data.id, roll_pouches: $.data.pouch_count }
          assert:
            - "after the first adjudicate: insurance_status == REJECTED_TOO_SOON while packaging_status == LINES_ADJUDICATED"
            - "after the override adjudicate: insurance_status == CLEARED and packaging_status is STILL LINES_ADJUDICATED"
            - "FillCycle.${c1}.approved_vacation_extra_days == 7 and FillCycle.${c1}.vacation_exception_id == ${vac}"
            - "CycleLine.${line6}.line_status == ADJUDICATED and CycleLine.${line6}.hold_reason == null and CycleLine.${line6}.allowance_days == 35   # 28 + 0 bridge + 7 vacation"
            - "CycleLine.${line6}.copay_cents == 762 and FillCycle.${c1}.total_copay_cents == 1524"
            - "Prescription.${rx1}.refills_remaining == 2 and Prescription.${rx1}.days_dispensed_total == 28   # the already-ADJUDICATED line was NOT dispensed twice"
            - "after generate-roll: packaging_status == ROLL_GENERATED and insurance_status is STILL CLEARED"
            - "PouchRoll.${roll1}.pouch_count == 56   # 2 slots x 28 days"
            - "FillCycle.${c1}.version == 4   # create, adjudicate, override adjudicate, generate-roll"

