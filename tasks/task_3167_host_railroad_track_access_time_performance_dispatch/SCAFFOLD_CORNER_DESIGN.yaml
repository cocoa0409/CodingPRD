              captures: { m_run: "$.data[0].id" }
            - call: "GET /rail/segment-passages"
              payload: { train_run_id: "${m_run}" }
              as: PassengerOperator
              captures: { m_p0: "$.data[0].track_segment_id", m_p1: "$.data[1].track_segment_id" }
          assert:
            - "GET /rail/train-runs?timetable_id returns total_count == 1 and the run's status == SCHEDULED"
            - "GET /rail/segment-passages?train_run_id returns total_count == 2, both status PLANNED"
            - "${m_p0} == ${seg1_id} and ${m_p1} == ${seg2_id} (sequence_no ordering)"

      - name: amend_cascade_returns_in_flight_timetable_to_draft
        claim_type: Conditional action
        grounds:
          - state_machines.OperatingAgreement.ACTIVE_to_ACTIVE
          - endpoints.POST_/rail/operating-agreements/{id}/amend
        distinguishing_aspect: "A successful amend returns an in-flight UNDER_REVIEW timetable to DRAFT and bumps amendment_seq and version by exactly 1."
        test_recipe:
          setup: ["ACTIVE agreement (version ${oa_v}); timetable in UNDER_REVIEW."]
          setup_api_calls:
