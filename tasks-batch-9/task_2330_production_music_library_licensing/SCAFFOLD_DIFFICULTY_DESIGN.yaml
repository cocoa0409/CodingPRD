              as: RightsManager
              captures: { ag1: $.data.id }
            - call: "POST /music-library/composer-agreements/${ag1}/submit-for-signature"
              payload: {}
              as: RightsManager
            - call: "POST /music-library/composer-agreements/${ag1}/sign"
              payload: { signature_name: "Lucia Ferrer" }
              as: Composer
              as_user_id: "${c1}"
            - call: "POST /music-library/compositions"
              payload: { composer_id: "${c1}", agreement_id: "${ag1}", title: "Vela", duration_sec: 195, tempo_bpm: 132, genre: "ROCK", mood_tags: ["EPIC", "TENSE"], instrumentation: ["GUITAR", "PERCUSSION"] }
              as: CatalogAdmin
              captures: { comp1: $.data.id }
            - call: "POST /music-library/compositions/${comp1}/catalog"
