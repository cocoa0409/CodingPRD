              as: Volunteer
              as_user_id: "${v1}"
              captures: { o1: $.data.id }
            - call: "POST /citizen-science/observations/${o1}/photos"
              payload: { file_hash: "ph-o1-a", captured_at: "2026-08-05T06:05:00Z", exif_latitude: 44.0, exif_longitude: -70.0 }
              as: Volunteer
