            - { call: "POST /background-checks/${chk_id}/adjudicate", payload: { findings: "NONE" }, as: DistrictCoordinator }
            - { call: "POST /campuses", payload: { name: "Lincoln Elementary", campus_code: "LNC", badge_prefix: "LNC" }, as: DistrictCoordinator, captures: { camp_id: $.data.id } }
            - { call: "POST /opportunities", payload: { campus_id: "${camp_id}", title: "Week Helper", required_contact_type: "SUPERVISED", restricted_category: "NONE", capacity: 2, starts_at: "2026-08-03T08:00:00Z", ends_at: "2026-08-07T20:00:00Z" }, as: CampusAdmin, captures: { opp_id: $.data.id } }
            - { call: "POST /opportunities/${opp_id}/publish", payload: {}, as: CampusAdmin }
            - { call: "POST /placements", payload: { opportunity_id: "${opp_id}" }, as: Volunteer, as_user_id: "${v_id}", captures: { pl_id: $.data.id } }
            - { call: "POST /placements/${pl_id}/confirm", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-03", hours: 10.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he1_id: $.data.id } }
            - { call: "POST /hour-entries/${he1_id}/verify", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-04", hours: 8.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he2_id: $.data.id } }
            - { call: "POST /hour-entries/${he2_id}/verify", payload: {}, as: CampusAdmin }
            - { call: "POST /hour-entries", payload: { placement_id: "${pl_id}", worked_date: "2026-08-05", hours: 2.0, activity_category: "STANDARD" }, as: Volunteer, as_user_id: "${v_id}", captures: { he3_id: $.data.id } }
          trigger:
            - { call: "POST /hour-entries/${he3_id}/verify", payload: {}, as: CampusAdmin }
            - { call: "GET /volunteers/${v_id}", payload: {}, as: DistrictCoordinator }
            - { call: "GET /recognition-awards", payload: { volunteer_id: "${v_id}" }, as: DistrictCoordinator, captures: { award0_tier: "$.data[0].tier", award0_source: "$.data[0].source" } }
