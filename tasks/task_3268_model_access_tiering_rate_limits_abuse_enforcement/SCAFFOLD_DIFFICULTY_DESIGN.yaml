              captures: { tier_below: $.data.tier, spend_below: $.data.lifetime_spend_cents }
          assert:
            - "Organization.${org_at}.lifetime_spend_cents == 5000000 AND qualifying_payment_count == 5"
            - "Organization.${org_at}.tier == TIER_2 (inclusive >= boundary: exactly at threshold promotes)"
            - "Organization.${org_below}.lifetime_spend_cents == 4999999 AND qualifying_payment_count == 5"
            - "Organization.${org_below}.tier == TIER_1 (one cent below threshold does not promote)"

      - name: rate_limit_zero_request_edge
        grounds:
          - calculations.rate_limit_for_window
          - entities.UsageRecord.fields.requests
          - endpoints.POST_/usage-records
        distinguishing_aspect: |
          Metric = requests count; endpoint = POST /usage-records. Edge case:
          a usage record with requests == 0 is permitted (>= 0) and consumes
          no request slots but still consumes token slots; the RateLimitWindow
          for the minute is created implicitly with counters starting at 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Organization ACTIVE, TIER_1 (rpm=50, tpm=50_000). Model created. No usage yet this minute."
          setup_api_calls:
