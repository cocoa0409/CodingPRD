              captures: { stmt_id: "$.data[0].id", stmt_status: "$.data[0].status", stmt_gross: "$.data[0].gross_cents", stmt_variant: "$.data[0].variant", stmt_plan_v: "$.data[0].pay_plan_version" }
            - call: "POST /fleet/pay-statements/${stmt_id}/settle"
              payload: { settlement_reference: "PAYRUN-2026-34" }
              as: PayrollAnalyst
              captures: { settled_status: $.data.status, settled_ref: $.data.settlement_reference }
            - call: "POST /fleet/pay-statements/${stmt_id}/settle"
              payload: { settlement_reference: "PAYRUN-2026-35" }
              as: PayrollAnalyst
              captures: { second_settle_err: $.data.error_id }
            - call: "GET /fleet/pay-statements/${stmt_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { ref_after: $.data.settlement_reference }
            - call: "POST /fleet/pay-statements/${stmt_id}/reverse"
              payload: { reason_code: "OVERPAY" }
              as: PayrollAnalyst
              captures: { reversed_status: $.data.status }
            - call: "POST /fleet/pay-statements/${stmt_id}/reverse"
              payload: { reason_code: "OVERPAY" }
              as: PayrollAnalyst
              captures: { second_reverse_err: $.data.error_id }
            - call: "POST /fleet/pay-statements/${stmt_id}/settle"
              payload: { settlement_reference: "PAYRUN-2026-36" }
              as: PayrollAnalyst
              captures: { settle_after_reverse_err: $.data.error_id }
          assert:
            - "${trip_settlement} == ACCRUED and ${trip_pay} == 10000 - completion accrues the FINAL_SETTLEMENT amount onto the trip"
            - "${stmt_status} == ACCRUED, ${stmt_gross} == 10000, ${stmt_variant} == FINAL_SETTLEMENT and ${stmt_plan_v} == ${plan_v}"
            - "${settled_status} == SETTLED with ${settled_ref} == PAYRUN-2026-34"
            - "${second_settle_err} == ERR_STATEMENT_NOT_ACCRUED with HTTP 409, and ${ref_after} == PAYRUN-2026-34 - the refused call did not overwrite the reference"
            - "${reversed_status} == REVERSED - reversal is reachable from SETTLED as well as from ACCRUED"
            - "${second_reverse_err} == ERR_STATEMENT_NOT_ACCRUED and ${settle_after_reverse_err} == ERR_STATEMENT_NOT_ACCRUED - REVERSED is terminal under both triggers"

      - name: the_borrow_gate_needs_a_source_at_1_5000_and_a_target_strictly_under_1_0000
        claim_type: Cross-entity Validation
        grounds:
          - validations[priority 11]
          - calculations.domicile_balance_index
          - errors.ERR_DOMICILE_MISMATCH
        distinguishing_aspect: "The cross-domicile driver loan is gated by two balance_index readings with different strictness: source >= 1.5000 is inclusive and target < 1.0000 is strict. A target sitting exactly at 1.0000 refuses the loan, and terminating one of its drivers (3/3 -> 2/3 == 0.6667) is what opens the gate. Equipment is never borrowed at all, so a tractor from the over-staffed domicile is refused with the same code no matter what the indexes read."
        test_recipe:
          setup:
            - "DOM-V9S has a headcount target of 2 and three ACTIVE drivers, so its balance_index is 3/2 == 1.5000 exactly."
            - "DOM-V9T has a headcount target of 3 and three ACTIVE drivers, so its balance_index is 1.0000 exactly."
            - "TRIP-V9 belongs to DOM-V9T and has no stops yet; TR-V9T and TL-V9T are its own domicile's equipment, TR-V9S belongs to the source domicile."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-V9S", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 2, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { src_id: $.data.id }
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-V9T", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 3, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { tgt_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V9S1", domicile_id: "${src_id}", pay_plan_id: "${plan_id}", seniority_date: "2016-01-04" }
              as: TransportManager
              captures: { s1: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V9S2", domicile_id: "${src_id}", pay_plan_id: "${plan_id}", seniority_date: "2017-01-04" }
              as: TransportManager
              captures: { s2: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V9S3", domicile_id: "${src_id}", pay_plan_id: "${plan_id}", seniority_date: "2018-01-04" }
              as: TransportManager
              captures: { s3: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V9T1", domicile_id: "${tgt_id}", pay_plan_id: "${plan_id}", seniority_date: "2016-06-01" }
              as: TransportManager
              captures: { t1: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V9T2", domicile_id: "${tgt_id}", pay_plan_id: "${plan_id}", seniority_date: "2017-06-01" }
              as: TransportManager
              captures: { t2: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-V9T3", domicile_id: "${tgt_id}", pay_plan_id: "${plan_id}", seniority_date: "2018-06-01" }
              as: TransportManager
              captures: { t3: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-V9T", domicile_id: "${tgt_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tgt_tractor: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-V9S", domicile_id: "${src_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { src_tractor: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "TL-V9T", domicile_id: "${tgt_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { tgt_trailer: $.data.id }
