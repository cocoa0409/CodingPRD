              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/equipment-models"
              payload: { model_code: "URN-30", brewer_class: "THERMAL", cups_per_hour_capacity: 30, min_headcount: 1, max_headcount: 250, monthly_rent_cents: 4500, descale_interval_days: 90, list_value_cents: 120000 }
              as: ProgramAdmin
              captures: { model_id: "$.data.id" }
            - call: "POST /ocs/equipment-assets"
              payload: { model_id: "${model_id}", serial_number: "URN30-0001", asset_role: "PLACEMENT" }
              as: ProgramAdmin
              captures: { asset_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
              captures: { site_v: "$.data.version" }
            - call: "POST /ocs/equipment-placements"
              payload: { site_id: "${site_id}", asset_id: "${asset_id}", terms_type: "RENTAL", minimum_purchase_cents: 60000, min_term_months: 12, expected_site_version: "${site_v}" }
              as: AccountManager
              captures: { pl_id: "$.data.id" }
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/maintenance-work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "PREVENTIVE" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { pm_wo_id: "$.data.id" }
            - call: "POST /ocs/maintenance-work-orders/${pm_wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
          trigger:
            - call: "POST /ocs/maintenance-work-orders/${pm_wo_id}/advance"
              payload: { to_status: "RESOLVED", resolution_note: "Quarterly PM checklist complete" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /ocs/maintenance-work-orders"
              payload: { asset_id: "${asset_id}", wo_type: "DESCALE" }
              as: RouteTechnician
              as_user_id: "${route_id}"
              captures: { dsc_wo_id: "$.data.id" }
            - call: "POST /ocs/maintenance-work-orders/${dsc_wo_id}/advance"
              payload: { to_status: "IN_PROGRESS" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${dsc_wo_id}/advance"
              payload: { to_status: "RESOLVED", resolution_note: "Descaled with two-cycle acid rinse" }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "POST /ocs/maintenance-work-orders/${pm_wo_id}/advance"
              payload: { to_status: "RESOLVED", resolution_note: "Quarterly PM checklist complete" }
              as: RouteTechnician
              as_user_id: "${route_id}"
          assert:
            - "the first RESOLVED attempt is HTTP 422 with error_id ERR_DESCALE_OVERDUE and MaintenanceWorkOrder.${pm_wo_id}.wo_status stays IN_PROGRESS"
            - "EquipmentAsset.${asset_id}.last_descale_at is still 2026-08-03T08:00:00Z after the refused attempt"
            - "resolving the DESCALE order is HTTP 200 and sets EquipmentAsset.${asset_id}.last_descale_at := 2026-11-10T08:00:00Z"
            - "the repeated PREVENTIVE RESOLVED call is now HTTP 200 with wo_status RESOLVED and the same resolution_note"
            - "Site.${site_id}.escalation_score == 0.0 and service_posture == ACTIVE after both resolutions, because the overdue-descale term has dropped out"

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: route_technician_day_halfopen_buffered_windows_abut_at_1015_but_collide_at_1014
        grounds:
          - calculations.route_window_conflict
          - validations[priority=25]
          - errors[ERR_ROUTE_WINDOW_CONFLICT]
          - entities.Route.fields.travel_buffer_minutes
        distinguishing_aspect: |
          Resource entity: Route (the technician's day). Interval semantics: HALF-OPEN instant
          intervals with a SYMMETRIC Route.travel_buffer_minutes buffer applied to the candidate
          only. Because both ends are half-open, an exact abutment of the buffered candidate start
          against the existing visit's end is NOT an overlap: 10:15 is accepted after a visit that
          ends 09:45 with a 30-minute buffer, while 10:14 is refused by one minute.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; route MON-BUF with service_day MON, capacity_minutes 480 and travel_buffer_minutes 30"
            - "one account with two planned sites A and B on that same route"
            - "site A already holds a SCHEDULED visit on 2026-08-03 from 09:00 to 09:45"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/routes"
              payload: { name: "MON-BUF", service_day: "MON", capacity_minutes: 480, travel_buffer_minutes: 30 }
              as: ProgramAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /ocs/product-items"
              payload: { sku: "COF-HOUSE-12OZ", category: "COFFEE", base_unit_price_micros: 4500000, pack_units: 6, green_coffee_linked: true }
              as: ProgramAdmin
              captures: { p_cof_id: "$.data.id" }
            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_a_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 4", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_b_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_a_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "POST /ocs/sites/${site_b_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_a_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_a_id: "$.data.id" }
          trigger:
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_b_id}", window_start: "2026-08-03T10:14:00Z", window_end: "2026-08-03T10:59:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { err: "$.data.error_id" }
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_b_id}", window_start: "2026-08-03T10:15:00Z", window_end: "2026-08-03T11:00:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_b_id: "$.data.id" }
          assert:
            - "the 10:14 request is HTTP 409 with error_id ERR_ROUTE_WINDOW_CONFLICT: the buffered candidate [09:44, 11:29) overlaps the existing [09:00, 09:45)"
            - "the 10:15 request is HTTP 201: the buffered candidate [09:45, 11:30) abuts the existing interval exactly and half-open abutment is not an overlap"
            - "Route.${route_id}.booked_minutes_total == 90 - only the accepted visit added minutes"
            - "GET /ocs/routes/${route_id}/day-load?service_date=2026-08-03 returns booked_minutes_day == 90 and remaining_minutes == 390"
            - "the same 10:14 window on a DIFFERENT route is accepted, proving the resource is the route and not the calendar"

      - name: loaner_asset_closed_date_intervals_block_the_reconditioning_day_and_free_the_day_after
        grounds:
          - calculations.loaner_window_conflict
          - calculations.loaner_window_conflict.constants.RECONDITIONING_DAYS
          - validations[priority=26]
          - errors[ERR_LOANER_NOT_AVAILABLE]
          - entities.EquipmentAsset.fields.reconditioning_until
        distinguishing_aspect: |
          A different resource entity (a single LOANER EquipmentAsset rather than a Route) under
          deliberately different interval semantics: CLOSED, date-granular intervals with a TRAILING
          reconditioning day, so a returned loaner is held through returned_on + 1. A same-day
          handoff, which the half-open route rule would allow, IS a conflict here: 2026-08-11 is
          refused and 2026-08-12 is accepted. The clock is parked past reconditioning_until so the
          priority-21 sanitation hold cannot mask the priority-26 window rule.
        test_recipe:
          setup:
            - "clock at 2026-08-03T08:00:00Z; MON route; model URN-30; two PLACEMENT assets (site A, site B) and a single LOANER asset LNR-0001"
            - "work order WO1 on the site-A brewer held LNR-0001 from 2026-08-03 due back 2026-08-10 and it was RETURNED on 2026-08-10, so held == [2026-08-03, 2026-08-11] and EquipmentAsset.reconditioning_until == 2026-08-11T00:00:00Z"
            - "work order WO2 on the site-B brewer is IN_PROGRESS with loaner_status NONE"
            - "the clock is advanced to 2026-08-11T09:00:00Z, which is NOT before reconditioning_until, so the sanitation hold no longer applies"
          setup_api_calls:
            - call: "POST /ocs/_clock/set_current_utc"
