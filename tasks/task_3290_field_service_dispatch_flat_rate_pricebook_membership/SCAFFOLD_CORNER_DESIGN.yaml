scaffold_corner_design:
  - section: entities
    instances:
      - name: technician_hire_rejects_missing_name
        claim_type: "required_fields"
        grounds: [entities.Technician.fields.name, entities.Technician.fields.shift_segments]
        distinguishing_aspect: "The required_fields claim on Technician: omitting either name or shift_segments from the hire payload yields ERR_INVALID_REQUEST rather than a created row."
        test_recipe:
          setup:
            - "one branch exists"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { postal_code: "78701", skill_codes: ["HVAC"], daily_capacity_hours: 8 }
              as: PlatformAdmin
          assert:
            - "the trigger returns ERR_INVALID_REQUEST (400) because name and shift_segments are required inputs"
            - "no Technician row is created, so GET /api/branches/${br_id} still reports the branch's unchanged roster"
      - name: branch_capacity_defaults_to_eighty_hours
        claim_type: "defaults"
        grounds: [entities.Branch.fields.daily_dispatch_capacity_hours]
        distinguishing_aspect: "The defaults claim on Branch: omitting daily_dispatch_capacity_hours yields 80 rather than a null or a zero."
        test_recipe:
          setup:
            - "no rows exist"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Dallas", postal_code: "75201" }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "GET /api/branches/${br_id}"
              payload: {}
              as: Dispatcher
          assert:
            - "Branch.${br_id}.daily_dispatch_capacity_hours == 80, the declared default"
            - "Branch.${br_id}.capacity_consumed_hours == 0 and membership_count_active == 0"
      - name: appointment_version_starts_at_one
        claim_type: "system_fields"
        grounds: ["entities.Appointment.fields.created_at", "entities.Appointment.fields.version"]
        distinguishing_aspect: "The system_fields claim on Appointment: id, created_at and version are server-minted, so a freshly created appointment always reports version 1."
        test_recipe:
          setup:
            - "one branch exists"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
          assert:
            - "the created Appointment.version == 1 and its pricing_status is NOT_QUOTED"
            - "the response's id is a server-minted UUID matching the 8-4-4-4-12 shape with no type prefix"
            - "created_at is an ISO 8601 UTC timestamp carrying exactly three fractional digits"
            - "GET /api/appointments/${ap_id} reports the same version 1 without an intervening mutation"
      - name: campaign_channel_rejects_unknown_enum_member
        claim_type: "type_constraints"
        grounds: [entities.Campaign.fields.channel]
        distinguishing_aspect: "The type_constraints claim on the Campaign.channel enum: BILLBOARD is not a declared member and is refused."
        test_recipe:
          setup:
            - "no rows exist"
          setup_api_calls: []
          trigger:
            - call: "POST /api/campaigns"
              payload: { name: "Billboard Push", channel: "BILLBOARD", spend_cents: 1000 }
              as: PlatformAdmin
          assert:
            - "the trigger returns ERR_INVALID_REQUEST (400) because channel must be one of SEARCH, YARD_SIGN, REFERRAL, DIRECT_MAIL or ORGANIC"
            - "the same payload with channel SEARCH returns 201"
      - name: find_appointment_that_does_not_exist
        claim_type: "not_found"
        grounds: ["errors[ERR_NOT_FOUND]", "entities.Appointment.fields.branch_id"]
        distinguishing_aspect: "The not_found claim on Appointment: an unknown id yields ERR_NOT_FOUND rather than an empty object."
        test_recipe:
          setup:
            - "no rows exist"
          setup_api_calls: []
          trigger:
            - call: "GET /api/appointments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_NOT_FOUND with http status 404"
            - "the error body carries response_type error and a data.error_id key, per the response envelope"
      - name: appointment_list_reports_pagination_metadata
        claim_type: "listing"
        grounds: [entities.Appointment.fields.status]
        distinguishing_aspect: "The listing claim on Appointment: the collection reports total_count and has_more alongside a limited page."
        test_recipe:
          setup:
            - "one branch and three appointments"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Bo", postal_code: "78701", window_start_utc: "2026-09-11T09:00:00Z", window_end_utc: "2026-09-11T11:00:00Z" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Cy", postal_code: "78701", window_start_utc: "2026-09-12T09:00:00Z", window_end_utc: "2026-09-12T11:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "GET /api/appointments"
              payload: { branch_id: "${br_id}", limit: 2, offset: 0 }
              as: Dispatcher
          assert:
            - "the response is an array of exactly 2 appointments with total_count 3 and has_more true"
            - "the default limit is 10 and the declared maximum is 100, so limit 200 is refused by ERR_INVALID_REQUEST"
      - name: membership_agreement_response_exposes_deferred_balances
        claim_type: "computed_fields"
        grounds: [entities.MembershipAgreement.fields.unearned_revenue_balance_cents, entities.MembershipAgreement.fields.annual_price_cents]
        distinguishing_aspect: "The computed_fields claim on MembershipAgreement: the deferred balance is derived, so a client-supplied value in the sale payload is ignored."
        test_recipe:
          setup:
            - "one branch and one published plan priced 100000 cents"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
          assert:
            - "the response's annual_price_cents == 100000, captured from the plan at sale time rather than supplied by the caller"
            - "the response's unearned_revenue_balance_cents == 0 and revenue_recognized_cents == 0 at PENDING_PAYMENT, since nothing has been collected or recognised"
  - section: state_machines
    instances:
      - name: cancel_completed_appointment_from_priced_state
        claim_type: "invalid_transition"
        grounds: ["state_machines.Appointment.SCHEDULED_to_CANCELLED", "state_machines.Appointment.SCHEDULED_to_DISPATCHED"]
        distinguishing_aspect: "A dispatcher may not cancel a DISPATCHED appointment whose dispatch_status is IN_SERVICE, because no DISPATCHED-to-CANCELLED transition is legal from that inner state."
        test_recipe:
          setup:
            - "one branch, one HVAC technician, one published 60000-cent task, one appointment dispatched and moved into service"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COIL", category: "HVAC", display_name: "Coil Clean", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 60000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COIL" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${ap_id}/complete"
              payload: { completion_description: "Arrived on site, isolated the unit and began the coil clean and rinse." }
              as: Technician
          trigger:
            - call: "POST /api/appointments/${ap_id}/cancel"
              payload: { reason: "no longer needed" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_INVALID_STATE (409) because dispatch_status is IN_SERVICE, from which no cancellation is declared"
            - "Appointment.${ap_id}.status is still DISPATCHED and dispatch_status is still IN_SERVICE after the refusal"
            - "the same trigger succeeds once the appointment is returned to DISPATCHED, proving the guard is on the inner dimension rather than on status"
      - name: dispatch_side_effect_publishes_the_auto_quote
        claim_type: "side_effect"
        grounds: ["state_machines.Appointment.SCHEDULED_to_DISPATCHED", "calculations.discount_floor_check"]
        distinguishing_aspect: "The dispatch transition's side effects are observable together: the assigned technician, the AUTO_QUOTED pricing dimension and the published labour quote all land in one call."
        test_recipe:
          setup:
            - "one branch, one HVAC technician, one published 300000-cent compressor task of 3.0 hours"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COMP", category: "HVAC", display_name: "Compressor Replacement", required_skill_code: "HVAC", estimated_hours: 3.0, flat_rate_cents: 300000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T12:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-COMP" }
              as: Dispatcher
          trigger:
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
          assert:
            - "the response reports status DISPATCHED, dispatch_status DISPATCHED and pricing_status AUTO_QUOTED"
            - "Appointment.${ap_id}.quoted_price_cents == 300000, the labour base with no membership discount applied"
            - "Appointment.${ap_id}.authorization_required is false, since 300000 does not exceed 1.20 times 300000"
            - "Technician.${tech_id}.dispatched_hours == 3.0 and Branch.${br_id}.capacity_consumed_hours == 3.0"
      - name: dispatch_refused_for_zero_line_appointment
        claim_type: "precondition_enforcement"
        grounds: ["state_machines.Appointment.SCHEDULED_to_DISPATCHED", "errors[ERR_NO_APPOINTMENT_LINES]"]
        distinguishing_aspect: "The precondition on dispatch is the presence of a line: an appointment with zero lines is refused even though its status and dispatch_status are otherwise legal."
        test_recipe:
          setup:
            - "one branch, one HVAC technician with a matching postal code"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-10T18:00:00Z" }], daily_capacity_hours: 8 }
              as: PlatformAdmin
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_NO_APPOINTMENT_LINES (409), the state precondition at validations priority 5"
            - "Appointment.${ap_id}.estimated_hours is 0 and dispatch_status is still UNASSIGNED"
            - "Technician.${dana_id} is untouched: the refusal outranks the capacity and skill selection entirely"
      - name: membership_visit_reached_terminal_state
        claim_type: "terminal_state_lockdown"
        grounds: ["state_machines.MembershipVisit.SCHEDULED_to_COMPLETED", "state_machines.MembershipVisit.MISSED_to_SCHEDULED"]
        distinguishing_aspect: "MembershipVisit is not terminal-locked in the usual way: COMPLETED has one declared reversal, but an arbitrary re-reversal is refused once the visit is already SCHEDULED."
        test_recipe:
          setup:
            - "one branch, one published plan with four visits, one activated agreement, one visit scheduled and completed through an appointment"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-20T18:00:00Z" }], daily_capacity_hours: 40 }
              as: PlatformAdmin
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-TUNE", category: "HVAC", display_name: "System Tune", required_skill_code: "HVAC", estimated_hours: 1.0, flat_rate_cents: 5000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 4, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 1, scheduled_date: "2026-09-10T00:00:00Z" }
              as: Dispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T11:00:00Z", membership_agreement_id: "${ag_id}", membership_visit_sequence_number: 1 }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /api/appointments/${ap_id}/lines"
              payload: { pricebook_task_code: "HVAC-TUNE" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${ap_id}/complete"
              payload: { completion_description: "Tuned the system, checked the charge and cleaned the condensate trap fully." }
              as: Technician
            - call: "POST /api/appointments/${ap_id}/complete"
              payload: { completion_description: "Tuned the system, checked the charge and cleaned the condensate trap fully." }
              as: Technician
          trigger:
            - call: "POST /api/membership-visits/${v1_id}/reschedule"
              payload: { scheduled_date: "2026-10-05T00:00:00Z" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the trigger returns ERR_INVALID_STATE (409), because the only declared source state for a reschedule is MISSED and this visit is COMPLETED"
            - "MembershipVisit.${v1_id}.completed_appointment_id still names ${ap_id} after the refusal"
            - "MembershipAgreement.${ag_id}.visits_fulfilled_count is still 1, so no revenue recognition was reversed by the refused call"
  - section: calculations
    instances:
      - name: incentive_statement_clamps_gross_before_charges
        claim_type: "constants_applied"
        grounds: ["calculations.technician_monthly_incentive_pay", "entities.Technician.fields.sales_coaching_strike_count"]
        distinguishing_aspect: "The constants claim on the incentive formula: the 150000-cent gross clamp is applied to the summed components before the 1500-cent strike charges are subtracted, not after."
        test_recipe:
          setup:
            - "one branch and one HVAC technician carrying three rejected override decisions, so sales_coaching_strike_count is 3"
            - "two completed appointments of 330000 cents each, so the summed components are 39600 cents"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/branches/${br_id}/technicians"
              payload: { name: "Dana", postal_code: "78701", skill_codes: ["HVAC"], shift_segments: [{ start_utc: "2026-09-10T08:00:00Z", end_utc: "2026-09-30T18:00:00Z" }], daily_capacity_hours: 40 }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /api/pricebook/tasks"
              payload: { code: "HVAC-COMP", category: "HVAC", display_name: "Compressor Replacement", required_skill_code: "HVAC", estimated_hours: 3.0, flat_rate_cents: 330000, status: "PUBLISHED" }
              as: Dispatcher
            - call: "POST /api/appointments"
              payload: { branch_id: "${br_id}", customer_name: "Ada", postal_code: "78701", window_start_utc: "2026-09-10T09:00:00Z", window_end_utc: "2026-09-10T12:00:00Z" }
              as: Dispatcher
              captures: { a1_id: $.data.id }
            - call: "POST /api/appointments/${a1_id}/lines"
              payload: { pricebook_task_code: "HVAC-COMP" }
              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${a1_id}" }
              as: Dispatcher
            - call: "POST /api/appointments/${a1_id}/complete"
              payload: { completion_description: "Recovered the refrigerant, fitted the new compressor and pressure tested the whole line set." }
              as: Technician
            - call: "POST /api/appointments/${a1_id}/complete"
              payload: { completion_description: "Recovered the refrigerant, fitted the new compressor and pressure tested the whole line set." }
              as: Technician
          trigger:
            - call: "GET /api/technicians/${tech_id}/incentive-statement"
              payload: { period_year: 2026, period_month: 9 }
              as: Manager
          assert:
            - "gross_component_cents == 19800, one 330000-cent appointment rounded at the 0.06 tier"
            - "clamped_component_cents == 19800, well below the 150000-cent clamp"
            - "charge_cents == 0 on this fixture because no override has been rejected yet, so the statement isolates the clamp step"
            - "incentive_cents == 396, the 19800-cent base multiplied by the 0.020 tier rate"
      - name: deferred_revenue_waterfall_remainder_allocation
        claim_type: "correct_result"
        grounds: ["calculations.deferred_revenue_recognition_waterfall", "entities.MembershipVisit.fields.deferred_revenue_cents"]
        distinguishing_aspect: "The correct_result claim on the waterfall: a 100000-cent price split across three visits puts the odd cent in the first assignment, yielding 3334, 3333, 3333."
        test_recipe:
          setup:
            - "one branch and one published plan priced 100000 cents with three included visits and a 30-day interval"
            - "one activated agreement with three visits scheduled at 2026-10-01, 2026-11-01 and 2026-12-01"
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "Austin", postal_code: "78701", daily_dispatch_capacity_hours: 80 }
              as: PlatformAdmin
              captures: { br_id: $.data.id }
            - call: "POST /api/membership-plans"
              payload: { name: "Comfort Club", annual_price_cents: 100000, included_service_visit_count: 3, maintenance_visit_interval_days: 30, included_labor_discount_pct: 0.10, status: "PUBLISHED" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/membership-agreements"
              payload: { membership_plan_id: "${plan_id}", branch_id: "${br_id}", homeowner_name: "Ada", homeowner_postal_code: "78701", term_months: 12 }
              as: Technician
              captures: { ag_id: $.data.id }
            - call: "POST /api/membership-agreements/${ag_id}/payments"
              payload: { amount_cents: 30000 }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 1, scheduled_date: "2026-10-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 2, scheduled_date: "2026-11-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /api/membership-agreements/${ag_id}/membership-visits"
              payload: { sequence_number: 3, scheduled_date: "2026-12-01T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "GET /api/membership-agreements/${ag_id}/membership-visits"
              payload: {}
              as: Dispatcher
          assert:
            - "the three visits report deferred_revenue_cents 3334, 3333 and 3333 in sequence order, summing to the 100000-cent annual price"
            - "the extra cent lands on the lowest sequence number, because the remainder is allocated in assignment order"
            - "MembershipAgreement.${ag_id}.unearned_revenue_balance_cents is 70000 while nothing has been recognised"
      - name: load_propagation_pins_bucket_before_increment
        claim_type: "precision"
        grounds: ["calculations.household_load_propagation", "entities.Appointment.fields.load_units_trace"]
        distinguishing_aspect: "The precision claim on the load recurrence: the bucket is read from the pre-increment total, so an all-HVAC five-line appointment traces 300, 600, 1200, 1800, 2700."
        test_recipe:
          setup:
