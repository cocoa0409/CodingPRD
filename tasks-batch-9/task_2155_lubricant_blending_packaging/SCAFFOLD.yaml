  - method: POST
    path: "/approval-claims/{id}/lifecycle"
    description: "Applies a non-decision lifecycle action. action is REVISE (REJECTED -> DRAFT), SUSPEND (ACTIVE -> SUSPENDED) or WITHDRAW (ACTIVE or SUSPENDED -> WITHDRAWN)."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "reason?"]
    output: ApprovalClaim
    side_effects: ["on SUSPEND or WITHDRAW from ACTIVE, every ACTIVE PackageConfiguration carrying this claim_code cascades to CLAIM_BLOCKED and its OPEN order lines to HOLD", "increments ApprovalClaim.version by 1"]

