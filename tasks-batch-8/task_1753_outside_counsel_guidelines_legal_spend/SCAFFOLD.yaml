    path: "/legal-departments/{deptId}/matters/{matterId}/reopen"
    description: "Reopen a closed matter"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: Matter
    side_effects: ["state machine transition"]

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/staffing-ratio"
    description: "Advisory staffing-ratio computation; ?basis=BILLED_HOURS (default) or ?basis=HEADCOUNT"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["basis?"]
    output: "{ partner_share_pct: number, basis: string, compliant: boolean }"
    side_effects: []

  # --- RateCard ---
  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards"
    description: "Create a DRAFT rate card (OCC-guarded on PanelFirm.version)"
    roles: [PanelFirmUser]
    code: 201
    input: [effective_year, expected_panel_firm_version]
    output: RateCard
    side_effects: ["status = DRAFT", "increments PanelFirm.version by 1"]

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}"
    description: "Get a rate card"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards"
    description: "List rate cards of a firm"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "status?", "effective_year?"]
    output: "RateCard[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/submit"
    description: "Submit rate card for approval"
    roles: [PanelFirmUser]
    code: 200
    input: []
    output: RateCard
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/approve"
    description: "Approve rate card (applies cap clamping; supersedes prior APPROVED card)"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: RateCard
    side_effects: ["state machine transition with cap clamping and supersession cascade"]

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/reject"
    description: "Reject a submitted rate card"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: RateCard
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/revise"
    description: "Return a REJECTED rate card to DRAFT (revision loop)"
    roles: [PanelFirmUser]
    code: 200
    input: []
    output: RateCard
    side_effects: ["state machine transition"]

  # --- Timekeeper ---
  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/timekeepers"
    description: "Register a timekeeper under a firm"
    roles: [PanelFirmUser]
    code: 201
    input: [full_name, tk_class]
    output: Timekeeper
    side_effects: ["qualification_status = PENDING"]

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/timekeepers/{tkId}"
    description: "Get a timekeeper"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: Timekeeper
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/timekeepers"
    description: "List timekeepers of a firm"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "qualification_status?", "tk_class?"]
    output: "Timekeeper[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/timekeepers/{tkId}/qualify"
    description: "Mark timekeeper QUALIFIED"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: Timekeeper
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/timekeepers/{tkId}/disqualify"
    description: "Mark timekeeper DISQUALIFIED"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: Timekeeper
    side_effects: ["state machine transition"]

  # --- TimekeeperRate ---
  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/rates"
    description: "Add a per-timekeeper rate to a DRAFT rate card"
    roles: [PanelFirmUser]
    code: 201
    input: [timekeeper_id, hourly_rate_cents]
    output: TimekeeperRate
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/rates"
    description: "List rates on a card"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?"]
    output: "TimekeeperRate[]"
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/rates/{rateId}"
    description: "Get a specific rate row"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: TimekeeperRate
    side_effects: []

  # --- Invoice ---
  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices"
    description: "Submit an e-billing invoice (OCC-guarded on Matter.version); auto-transitions to UNDER_REVIEW and runs rule engine. Preconditions: Matter.engagement_status == ENGAGED (ERR_INVALID_STATE); PanelFirm.status == ACTIVE (ERR_FIRM_NOT_ACTIVE); acting firm's id == Matter.panel_firm_id (ERR_FIRM_MISMATCH); invoice_number unique per firm (ERR_DUPLICATE_INVOICE_NUMBER); billing_period_end > billing_period_start (ERR_INVALID_TEMPORAL); every line_item.timekeeper_id must belong to the engaged firm (ERR_REFERENTIAL_INTEGRITY)."
    roles: [PanelFirmUser]
    code: 201
    input: [invoice_number, billing_period_start, billing_period_end, expected_matter_version, line_items]
    output: Invoice
    side_effects:
      - "Invoice status SUBMITTED → UNDER_REVIEW (auto)"
      - "rule engine approves/rejects each line item"
      - "Invoice status auto-transitions to APPROVED / PARTIALLY_APPROVED / REJECTED per aggregate line state"
      - "increments Matter.version by 1"

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices"
    description: "List invoices of a matter"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/pay"
    description: "Mark invoice PAID (freezes final_payable_cents)"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/void"
    description: "Void a REJECTED invoice"
    roles: [PanelFirmUser]
    code: 200
    input: []
    output: Invoice
    side_effects: ["state machine transition"]

  # --- InvoiceLineItem ---
  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}"
    description: "Get a line item"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: InvoiceLineItem
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items"
    description: "List line items of an invoice"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "review_status?"]
    output: "InvoiceLineItem[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/approve"
    description: "Manually approve a PENDING line item"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: InvoiceLineItem
    side_effects: ["state machine transition; recompute invoice totals"]

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/adjust"
    description: "Adjust-approve a PENDING line item"
    roles: [LegalOpsReviewer]
    code: 200
    input: [adjusted_amount_cents]
    output: InvoiceLineItem
    side_effects: ["state machine transition; recompute invoice totals"]

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/reject"
    description: "Manually reject a PENDING line item with reason"
    roles: [LegalOpsReviewer]
    code: 200
    input: [rejection_reason_code]
    output: InvoiceLineItem
    side_effects: ["state machine transition; recompute invoice totals"]

  # --- Appeal ---
  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals"
    description: "Firm appeals a REJECTED line item"
    roles: [PanelFirmUser]
    code: 201
    input: [rationale]
    output: Appeal
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}"
    description: "Get an appeal"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals"
    description: "List appeals on a line item"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Appeal[]"
    side_effects: []

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}/claim"
    description: "Reviewer claims an appeal (SUBMITTED → UNDER_REVIEW)"
    roles: [LegalOpsReviewer]
    code: 200
    input: []
    output: Appeal
    side_effects: ["state machine transition"]

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}/grant"
    description: "Grant an appeal (cascades: line REINSTATED, invoice totals recomputed, matter billed_to_date credited)"
    roles: [LegalOpsReviewer]
    code: 200
    input: [resolution_note]
    output: Appeal
    side_effects: ["state machine transition with 3-hop cascade"]

  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/line-items/{lineId}/appeals/{appealId}/deny"
    description: "Deny an appeal (cascades: line UPHELD)"
    roles: [LegalOpsReviewer]
    code: 200
    input: [resolution_note]
    output: Appeal
    side_effects: ["state machine transition with 2-hop cascade"]

  # --- Accrual ---
  - method: POST
    path: "/legal-departments/{deptId}/matters/{matterId}/accruals"
    description: "Submit a monthly accrual"
    roles: [PanelFirmUser]
    code: 201
    input: [period_year, period_month, amount_cents]
    output: Accrual
    side_effects: ["Matter.accrual_outstanding_cents += amount_cents", "MatterForecast.wip_estimate_cents recomputed"]

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/accruals/{accrualId}"
    description: "Get an accrual"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: Accrual
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/accruals"
    description: "List accruals of a matter"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "period_year?", "period_month?"]
    output: "Accrual[]"
    side_effects: []

  # --- MatterForecast ---
  - method: PUT
    path: "/legal-departments/{deptId}/matters/{matterId}/forecast"
    description: "Create-or-update the matter's lifecycle forecast (1:1 with Matter)"
    roles: [LegalOpsReviewer]
    code: 200
    input: [lifecycle_estimate_cents]
    output: MatterForecast
    side_effects: ["variance_cents recomputed per calculations.matter_forecast_reconciliation"]

  - method: GET
    path: "/legal-departments/{deptId}/matters/{matterId}/forecast"
    description: "Read the matter's forecast (1:1)"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: MatterForecast
    side_effects: []

  # --- ScorecardSnapshot ---
  - method: POST
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/scorecards/recompute"
    description: "Compute and persist a ScorecardSnapshot for a given period"
    roles: [LegalOpsReviewer]
    code: 201
    input: [period_year, period_month]
    output: ScorecardSnapshot
    side_effects: ["PanelFirm.scorecard_overall_pct updated to the new snapshot's overall_pct"]

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/scorecards/{snapshotId}"
    description: "Get a scorecard snapshot"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: []
    output: ScorecardSnapshot
    side_effects: []

  - method: GET
    path: "/legal-departments/{deptId}/panel-firms/{firmId}/scorecards"
    description: "List scorecard snapshots of a firm"
    roles: [LegalOpsReviewer, PanelFirmUser]
    code: 200
    input: ["limit?", "offset?", "period_year?", "period_month?"]
    output: "ScorecardSnapshot[]"
    side_effects: []

  # --- Test-driving (logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [LegalOpsReviewer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["system clock sweep: any GuidelineAcknowledgment whose due date has passed transitions PENDING → OVERDUE"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is not permitted on this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-template resource does not exist within the expected scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not allowed from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent's current version" }
  - { id: ERR_FIRM_MISMATCH, http: 403, condition: "Acting PanelFirmUser's firm does not match the target resource's owning firm" }
  - { id: ERR_FIRM_NOT_ACTIVE, http: 409, condition: "PanelFirm.status is not ACTIVE for an operation that requires it" }
  - { id: ERR_ACK_OUTSTANDING, http: 409, condition: "Firm has not acknowledged the currently-published GuidelineVersion" }
  - { id: ERR_GUIDELINE_OVERLAP, http: 409, condition: "Another PUBLISHED GuidelineVersion has effective_date >= the one being published" }
  - { id: ERR_NOTICE_GAP_VIOLATION, http: 409, condition: "New guideline's effective_date is too close to the prior version's (less than guideline_notice_days)" }
  - { id: ERR_TIMEKEEPER_NOT_QUALIFIED, http: 422, condition: "A TimekeeperRate references a timekeeper whose qualification_status != QUALIFIED" }
  - { id: ERR_RATE_CARD_YEAR_CONFLICT, http: 409, condition: "Another SUBMITTED or APPROVED rate card already covers this effective_year for this firm" }
  - { id: ERR_DUPLICATE_INVOICE_NUMBER, http: 409, condition: "An invoice with this invoice_number already exists for the firm" }
  - { id: ERR_INVALID_TEMPORAL, http: 422, condition: "billing_period_end <= billing_period_start, guideline effective_date in the past, or accrual period in the future" }
  - { id: ERR_MATTER_HAS_OPEN_INVOICES, http: 409, condition: "Matter cannot close while invoices are SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_MATTER_HAS_OPEN_APPEALS, http: 409, condition: "Matter cannot close while appeals are SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_FIRM_HAS_OPEN_INVOICES, http: 409, condition: "Firm cannot offboard while invoices are SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_OPEN_APPEALS, http: 409, condition: "Invoice cannot be paid while any line-item appeal is SUBMITTED or UNDER_REVIEW" }
  - { id: ERR_INVALID_ADJUSTMENT, http: 422, condition: "adjusted_amount_cents out of range (must be >= 0 and < amount_cents)" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "FK reference does not resolve within scope (e.g., timekeeper not owned by the engaged firm)" }
  - { id: ERR_TIMEKEEPER_HAS_PENDING_LINES, http: 409, condition: "Timekeeper cannot be disqualified while PENDING line items reference them" }
  - { id: ERR_OVER_BUDGET, http: 422, condition: "Line-level over-budget rejection reason when approved amount would push Matter.billed_to_date_cents over budget_cents" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LegalOpsReviewer
    description: "In-house legal operations staff; administers guidelines, reviews invoices, decides appeals, manages firms and rate cards"
    identity: opaque
    exclusive_operations:
      - "POST /legal-departments — create department"
      - "POST /legal-departments/{deptId}/panel-firms — onboard firm"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/suspend|reinstate|offboard"
      - "POST /legal-departments/{deptId}/guideline-versions — create guideline"
      - "POST /legal-departments/{deptId}/guideline-versions/{gvId}/publish"
      - "POST /legal-departments/{deptId}/matters — create matter"
      - "POST /legal-departments/{deptId}/matters/{matterId}/close|reopen"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/approve|reject"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/timekeepers/{tkId}/qualify|disqualify"
      - "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/pay"
      - "POST .../line-items/{lineId}/approve|adjust|reject"
      - "POST .../appeals/{appealId}/claim|grant|deny"
      - "PUT /legal-departments/{deptId}/matters/{matterId}/forecast"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/scorecards/recompute"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: PanelFirmUser
    description: "Staff at an outside panel firm; acknowledges guidelines, submits rate cards, registers timekeepers, submits invoices and appeals, files accruals"
    identity: "entity_backed:PanelFirm"
    exclusive_operations:
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/acknowledgments/{ackId}/acknowledge"
      - "POST /legal-departments/{deptId}/matters/{matterId}/engage"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards — create rate card"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/submit|revise"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/rates — add rate rows"
      - "POST /legal-departments/{deptId}/panel-firms/{firmId}/timekeepers — register timekeeper"
      - "POST /legal-departments/{deptId}/matters/{matterId}/invoices — submit invoice"
      - "POST /legal-departments/{deptId}/matters/{matterId}/invoices/{invoiceId}/void"
      - "POST .../line-items/{lineId}/appeals — file appeal"
      - "POST /legal-departments/{deptId}/matters/{matterId}/accruals — submit accrual"
    shared_operations:
      - "All GET endpoints"
