      - name: service_site_capacity_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.ServiceSite.fields.concurrent_capacity
          - errors[ERR_SERVICE_SITE_AT_CAPACITY]
        distinguishing_aspect: "Service-site interval semantics are aggregate-capacity (count of time-overlapping sessions vs concurrent_capacity), with half-open adjacency allowed: at capacity 1, an existing session [10:00,12:00) blocks an overlapping [11:00,13:00), but an adjacent [12:00,14:00) would be allowed — different arithmetic than the courtroom buffer rule."
