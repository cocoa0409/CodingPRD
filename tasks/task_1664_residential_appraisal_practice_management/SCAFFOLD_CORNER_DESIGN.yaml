      - name: workfile_record_creation_and_null_retention_predelivery
        claim_type: creation
        grounds: [entities.WorkfileRecord, calculations.retention_expiry]
        distinguishing_aspect: "Manual workfile create on a non-terminal order -> 201 ACTIVE with retention_until null because the order has never been delivered."
        test_recipe:
          setup: ["order in ACCEPTED (ORDER_FORM auto-record exists)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
