scaffold_corner_design:
  # ======================================================================
  # Section: entities
  # ======================================================================
  - section: entities
    instances:
      - name: advertiser_creation_defaults_and_stored_fields
        claim_type: creation
        grounds: [entities.Advertiser]
        distinguishing_aspect: "POST /traffic/advertisers with only required fields returns 201, agency_name defaulted to '', version == 1, server-minted id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "Corner Ad", product_category: "RETAIL", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { adv_id: "$.data.id",  adv_agency: "$.data.agency_name",  adv_ver: "$.data.version"}
          trigger:
            - call: "GET /traffic/advertisers/${adv_id}"
              payload: {}
              as: TrafficManager
          assert:
            - "${adv_agency} == '' (default applied at creation)"
            - "${adv_ver} == 1"
            - "GET echoes name 'Corner Ad', product_category RETAIL, credit_limit_cents 100000"
      - name: advertiser_invalid_enum_product_category_rejected
        claim_type: type_constraints
        grounds: [entities.Advertiser.fields.product_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "product_category outside the declared enum set is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /traffic/advertisers"
              payload: { name: "Bad Cat", product_category: "TOBACCO", credit_limit_cents: 1000 }
              as: SalesRep
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: advertiser_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Advertiser.fields.name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "omitting required name on advertiser create yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /traffic/advertisers"
              payload: { product_category: "RETAIL", credit_limit_cents: 1000 }
              as: SalesRep
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_REQUEST"
      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /traffic/advertisers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SalesRep
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_NOT_FOUND"
      - name: program_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Program]
        distinguishing_aspect: "list endpoint honors limit/offset and returns pagination_fields total_count and has_more with defaults limit=10."
        test_recipe:
          setup: ["three programs exist"]
          setup_api_calls:
            - call: "POST /traffic/programs"
              payload: { title: "P1", daypart_code: "PRIME", airs_weekday: 1, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
            - call: "POST /traffic/programs"
              payload: { title: "P2", daypart_code: "DAYTIME", airs_weekday: 2, start_time_local: "13:00", duration_minutes: 60, rating_estimate: 2.0 }
              as: TrafficManager
            - call: "POST /traffic/programs"
              payload: { title: "P3", daypart_code: "OVERNIGHT", airs_weekday: 3, start_time_local: "02:00", duration_minutes: 60, rating_estimate: 0.5 }
              as: TrafficManager
          trigger:
            - call: "GET /traffic/programs"
              payload: { limit: 2, offset: 0 }
              as: SalesRep
          assert:
            - "response contains exactly 2 items"
            - "response includes pagination fields limit, offset, total_count == 3, has_more == true"
      - name: availunit_computed_booked_counters_start_zero
        claim_type: computed_fields
        grounds: [entities.AvailUnit.fields.booked_commercial_seconds, entities.AvailUnit.fields.booked_political_seconds]
        distinguishing_aspect: "on creation both booked counters are 0 regardless of any client-supplied value."
        test_recipe:
          setup: ["program and week exist"]
          setup_api_calls:
            - call: "POST /traffic/programs"
              payload: { title: "PX", daypart_code: "PRIME", airs_weekday: 6, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
              payload: { program_id: "${prog_id}", air_date: "2026-08-08", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { bc: "$.data.booked_commercial_seconds",  bp: "$.data.booked_political_seconds",  res: "$.data.reserved_political_seconds"}
          assert:
            - "${bc} == 0 and ${bp} == 0 (computed fields initialized by the system)"
            - "${res} == 0 (default applied when omitted)"
      - name: asrunentry_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.AsRunEntry]
        distinguishing_aspect: "AsRunEntry has common_fields false and no update/delete endpoint in §1.5 — append-only; attempts to mutate it have no declared endpoint (only creation via reconcile and list reads exist)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /traffic/log-days/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/as-run-entries"
              payload: {}
              as: BillingClerk
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_NOT_FOUND (parent log day does not exist) — the only AsRunEntry surface is create-via-reconcile and list reads; no PUT/PATCH/DELETE on AsRunEntry is declared in §1.5"

  # ======================================================================
  # Section: state_machines
  # ======================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.Order]
        distinguishing_aspect: "a newly created order starts in DRAFT with revision_no == 0 and gross_budget_cents == 0."
        test_recipe:
          setup: ["advertiser exists"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "Init", product_category: "RETAIL", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { st: "$.data.status",  rev: "$.data.revision_no",  gb: "$.data.gross_budget_cents"}
          assert:
            - "${st} == DRAFT"
            - "${rev} == 0"
            - "${gb} == 0"
      - name: order_submit_without_lines_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Order.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "submit requires >= 1 ACTIVE line; an empty order cannot leave DRAFT."
        test_recipe:
          setup: ["advertiser + empty order exist"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "Empty", product_category: "RETAIL", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
          trigger:
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Order.${order_id}.status stays DRAFT"
      - name: order_terminal_cancelled_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "from CANCELLED no further transitions exist — a submit attempt on a cancelled order fails."
        test_recipe:
          setup: ["order created then cancelled from DRAFT"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "Canc", product_category: "RETAIL", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_STATE"
      - name: copy_expire_from_received_blocked_when_referenced_by_finalized_log
        claim_type: precondition_enforcement
        grounds: [state_machines.CopyInstruction.RECEIVED_to_EXPIRED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "a RECEIVED copy referenced by a still-SCHEDULED spot on a FINALIZED log cannot be expired."
        test_recipe:
          setup:
            - "full pipeline: advertiser, program (weekday 1, Monday 2026-08-03), week, unit (2026-08-03, 120s), approved order (30s x 1, guarantee 0), copy received, spot placed, log day finalized (copy assigned to the spot)"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "CL", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Mon Day CL", daypart_code: "DAYTIME", airs_weekday: 1, start_time_local: "13:00", duration_minutes: 60, rating_estimate: 2.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
              payload: { program_id: "${prog_id}", air_date: "2026-08-03", break_position: 1, total_seconds: 120 }
              as: TrafficManager
              captures: { unit_id: "$.data.id",  unit_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 5000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week_id}/log-days"
              payload: { log_date: "2026-08-03" }
              as: TrafficManager
              captures: { log_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log_id}/finalize"
              payload: {}
              as: TrafficManager
          trigger:
            - call: "POST /traffic/copy-instructions/${copy_id}/expire"
              payload: {}
              as: CopyCoordinator
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_STATE — copy referenced by a SCHEDULED spot on a FINALIZED log is locked"
            - "CopyInstruction.${copy_id}.status stays RECEIVED"
      - name: preempt_on_finalized_log_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Spot.SCHEDULED_to_PREEMPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "preempt requires the covering LogDay to be DRAFT; after finalize the spot is locked into the log."
        test_recipe:
          setup:
            - "advertiser, program (weekday 2 = Tuesday 2026-08-04), week, unit (2026-08-04, 60s), approved order (30s x 1, guarantee 0), copy received, spot placed, log finalized"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "PF", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Tue News PF", daypart_code: "EARLY_NEWS", airs_weekday: 2, start_time_local: "18:00", duration_minutes: 30, rating_estimate: 4.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
              payload: { program_id: "${prog_id}", air_date: "2026-08-04", break_position: 1, total_seconds: 60 }
              as: TrafficManager
              captures: { unit_id: "$.data.id",  unit_v0: "$.data.version"}
            - call: "POST /traffic/orders"
              payload: { advertiser_id: "${adv_id}", flight_start_date: "2026-08-03", flight_end_date: "2026-08-09" }
              as: SalesRep
              captures: { order_id: "$.data.id"}
            - call: "POST /traffic/orders/${order_id}/lines"
              payload: { program_id: "${prog_id}", weeks_requested: 1, spots_per_week: 1, spot_length_seconds: 30, gross_rate_cents: 5000, guaranteed_rating: 0 }
              as: SalesRep
            - call: "POST /traffic/orders/${order_id}/submit"
              payload: {}
              as: SalesRep
            - call: "GET /traffic/orders/${order_id}"
              payload: {}
              as: SalesRep
              captures: { order_v: "$.data.version"}
            - call: "POST /traffic/orders/${order_id}/approve"
              payload: { expected_order_version: "${order_v}" }
              as: TrafficManager
            - call: "POST /traffic/copy-instructions"
              payload: { advertiser_id: "${adv_id}", length_seconds: 30 }
              as: CopyCoordinator
              captures: { copy_id: "$.data.id"}
            - call: "POST /traffic/copy-instructions/${copy_id}/receive"
              payload: {}
              as: CopyCoordinator
            - call: "GET /traffic/orders/${order_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot_id: "$.data[0].id"}
            - call: "POST /traffic/spots/${spot_id}/place"
              payload: { avail_unit_id: "${unit_id}", expected_avail_unit_version: "${unit_v0}" }
              as: TrafficManager
            - call: "POST /traffic/avail-weeks/${week_id}/log-days"
              payload: { log_date: "2026-08-04" }
              as: TrafficManager
              captures: { log_id: "$.data.id"}
            - call: "POST /traffic/log-days/${log_id}/finalize"
              payload: {}
              as: TrafficManager
          trigger:
            - call: "POST /traffic/spots/${spot_id}/preempt"
              payload: { preempt_reason: "NEWS_OVERRIDE" }
              as: TrafficManager
              captures: { err: "$.data.error_id"}
          assert:
            - "${err} == ERR_INVALID_STATE — the covering LogDay is FINALIZED"
            - "Spot.${spot_id}.status stays SCHEDULED"
      - name: duplicate_make_good_for_same_preempted_spot_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Spot.PREEMPTED_to_MAKE_GOOD_OFFERED, "errors[ERR_AVAIL_OVERFLOW]"]
        distinguishing_aspect: "a second offer-make-good against a spot that already has an outstanding MAKE_GOOD_OFFERED child is rejected."
        test_recipe:
          setup:
            - "advertiser, program (weekday 5 = Friday 2026-08-07), week, unit (60s), approved order (30s x 1, guarantee 0), spot placed then preempted, one make-good already offered"
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "DM", product_category: "RETAIL", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { adv_id: "$.data.id"}
            - call: "POST /traffic/programs"
              payload: { title: "Fri Prime DM", daypart_code: "PRIME", airs_weekday: 5, start_time_local: "20:00", duration_minutes: 60, rating_estimate: 5.0 }
              as: TrafficManager
              captures: { prog_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: TrafficManager
              captures: { week_id: "$.data.id"}
            - call: "POST /traffic/avail-weeks/${week_id}/avail-units"
