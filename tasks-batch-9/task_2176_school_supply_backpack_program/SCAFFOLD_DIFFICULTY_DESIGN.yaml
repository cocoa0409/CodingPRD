      - name: donation_intake_requires_collecting_drive_cycle
        grounds:
          - validations[priority=16]
          - state_machines.DriveCycle.COLLECTING_to_SORTING
          - errors[ERR_CYCLE_PHASE_INVALID]
          - entities.DonationBatch.fields.collection_site_id
        distinguishing_aspect: |
          Dependency pair #2 crosses a different pair, DonationBatch -> DriveCycle: an
          otherwise valid intake at an ACTIVE site is rejected with
          ERR_CYCLE_PHASE_INVALID purely because the governing cycle has left COLLECTING
          for SORTING.
        test_recipe:
          setup:
