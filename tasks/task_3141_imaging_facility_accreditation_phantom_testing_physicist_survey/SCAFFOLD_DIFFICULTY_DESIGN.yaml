# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3141_imaging_facility_accreditation_phantom_testing_physicist_survey
#
# One block per §0.5 Difficulty Rule, two instances each (>= 18 total).
# Every instance grounds in §1.1-§1.7 of SCAFFOLD.yaml and carries an
# executable setup_api_calls chain that drives empty-DB into the stated setup.
# =============================================================================
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: clinical_review_outcome_reviewer_variant_vs_coverage_variant
    grounds:
    - calculations.clinical_review_outcome
    - state_machines.ClinicalImageSubmission.PENDING_REVIEW_to_FAILED
    - validations[priority=4]
    - entities.ClinicalImageSubmission.fields.accepted_view_count
    distinguishing_aspect: 'Two ClinicalImageSubmission rows carrying the identical accepted_view_count 8 of required 10 produce different review outcomes purely from the review variant: the reviewer_reported_outcome variant returns FAIL with review_outcome_score 0.0 while the coverage_derived_outcome variant returns ACCEPT_WITH_DEFICIENCY with review_outcome_score 8.0.'
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z (inside the unit's open submission and testing windows).
      - Facility Northgate Imaging Center (CT) is ENROLLED, accreditation_currency PROVISIONAL, payer_participation_status ACTIVE, registry_credit_cents 500000.
      - ModalityUnit CT-1 (CT) is ENROLLED with no deadlines passed, phantom_attempt_count 0, deficiency_open_count 0.
      - EquipmentItem SN-CT-0001 is ACTIVE with performance_verdict PASS (set by the accepted survey).
      - PersonnelQualification Hana Reyes (TECHNOLOGIST) and Ira Sundaram (MEDICAL_PHYSICIST) are both VERIFIED; Facility.roster_disposition is CLEAR.
      - 'AccreditationCycle #1 is ACTIVE (cycle_started_at 2026-09-01T00:00:00Z).'
      - PhysicistSurvey svy_id is ACCEPTED with dose_deviation_pct 7.5.
      setup_api_calls:
      - call: POST /accreditation/facilities
        payload:
          name: Northgate Imaging Center
          state_code: CT
          facility_type: IMAGING_CENTER
        as: FacilityAdmin
        captures:
          fac_id: $.data.id
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Hana Reyes
          personnel_role: TECHNOLOGIST
          credential_number: TECH-1001
          ce_credit_hours: 24.0
          required_ce_hours: 24.0
          credential_expires_on: '2027-06-30T00:00:00Z'
        as: AccreditationBody
        captures:
          tq_id: $.data.id
      - call: POST /accreditation/qualifications/${tq_id}/verify
        payload:
          verified_at: '2026-09-02T00:00:00Z'
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/modality-units
        payload:
          facility_id: ${fac_id}
          modality_code: CT
          unit_label: CT-1
          expected_facility_version: ${fv}
        as: FacilityAdmin
        captures:
          unit_id: $.data.id
      - call: POST /accreditation/equipment
        payload:
          unit_id: ${unit_id}
          manufacturer: Siemens
          model_number: SOMATOM-X1
          serial_number: SN-CT-0001
          modality_code: CT
          installed_on: '2026-08-01T00:00:00Z'
        as: FacilityAdmin
        captures:
          eq_id: $.data.id
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/facilities/${fac_id}/register
        payload:
          expected_facility_version: ${fv}
        as: FacilityAdmin
      - call: POST /accreditation/cycles
        payload:
          facility_id: ${fac_id}
          cycle_index: 1
          cycle_started_at: '2026-09-01T00:00:00Z'
        as: AccreditationBody
        captures:
          cyc_id: $.data.id
      - call: POST /accreditation/cycles/${cyc_id}/activate
        payload: {}
        as: AccreditationBody
      - call: POST /accreditation/qualifications
        payload:
          facility_id: ${fac_id}
          person_name: Ira Sundaram
          personnel_role: MEDICAL_PHYSICIST
          credential_number: PHYS-2001
          ce_credit_hours: 50.0
          required_ce_hours: 50.0
          credential_expires_on: '2028-06-30T00:00:00Z'
        as: AccreditationBody
        captures:
          pq_id: $.data.id
      - call: POST /accreditation/qualifications/${pq_id}/verify
        payload:
          verified_at: '2026-09-02T00:00:00Z'
        as: AccreditationBody
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/facilities/${fac_id}/registry-credit
        payload:
          amount_cents: 500000
          expected_facility_version: ${fv}
        as: FacilityAdmin
      - call: GET /accreditation/modality-units/${unit_id}
        payload: {}
        as: Any
        captures:
          uv: $.data.version
      - call: POST /accreditation/physicist-surveys
        payload:
          facility_id: ${fac_id}
          physicist_qualification_id: ${pq_id}
          survey_type: ANNUAL
          scheduled_at: '2026-09-03T00:00:00Z'
          reference_entrance_dose_mgy: 2.0
          unit_id: ${unit_id}
        as: MedicalPhysicist
        as_user_id: ${pq_id}
        captures:
          svy_id: $.data.id
      - call: POST /accreditation/physicist-surveys/${svy_id}/submit
        payload:
          performed_at: '2026-09-10T00:00:00Z'
          measured_entrance_dose_mgy: 2.15
          shielding_verdict: PASS
        as: MedicalPhysicist
        as_user_id: ${pq_id}
      - call: GET /accreditation/facilities/${fac_id}
        payload: {}
        as: Any
        captures:
          fv: $.data.version
      - call: POST /accreditation/physicist-surveys/${svy_id}/accept
        payload: {}
        as: AccreditationBody
      - call: GET /accreditation/modality-units/${unit_id}
        payload: {}
        as: Any
        captures:
          uv: $.data.version
      - call: POST /accreditation/clinical-image-submissions
        payload:
          unit_id: ${unit_id}
          image_type: CLINICAL
          submitted_at: '2026-09-12T00:00:00Z'
          reviewer_note_code: NOTE-1
          required_view_count: 10
          accepted_view_count: 8
          expected_unit_version: ${uv}
        as: FacilityAdmin
        captures:
          cis_a: $.data.id
      - call: POST /accreditation/clinical-image-submissions/${cis_a}/review
        payload:
          review_outcome: FAIL
        as: AccreditationBody
      - call: GET /accreditation/modality-units/${unit_id}
        payload: {}
        as: Any
        captures:
          uv: $.data.version
      - call: POST /accreditation/clinical-image-submissions
        payload:
          unit_id: ${unit_id}
          image_type: CLINICAL
          submitted_at: '2026-09-12T00:00:00Z'
          reviewer_note_code: NOTE-1
          required_view_count: 10
          accepted_view_count: 8
          expected_unit_version: ${uv}
        as: FacilityAdmin
        captures:
          cis_b: $.data.id
      trigger:
      - call: POST /accreditation/clinical-image-submissions/${cis_b}/review
        payload:
          review_outcome: ACCEPT_WITH_DEFICIENCY
          reviewer_deficiency_category: POSITIONING
        as: AccreditationBody
      assert:
      - ClinicalImageSubmission.${cis_a}.review_status == FAILED and review_outcome_score == 0.0
      - ClinicalImageSubmission.${cis_a}.deficiency_code == IMAGE_QUALITY
      - ClinicalImageSubmission.${cis_a}.resubmission_round == 0
      - ClinicalImageSubmission.${cis_b}.review_status == DEFICIENCY
      - ClinicalImageSubmission.${cis_b}.review_outcome_score == 8.0
      - ClinicalImageSubmission.${cis_b}.deficiency_code == POSITIONING
      - ClinicalImageSubmission.${cis_a}.accepted_view_count == ClinicalImageSubmission.${cis_b}.accepted_view_count
