scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visa_final_action_vs_filing_date_divergence_on_case_visabulletin
        grounds:
          - calculations.visa_availability
          - calculations.visa_availability.variants.final_action
          - calculations.visa_availability.variants.filing_date
          - entities.VisaBulletinEntry
          - entities.Case.fields.priority_date
          - endpoints."GET /uscis/cases/{id}/visa-availability"
        distinguishing_aspect: |
          For the SAME (priority_date=2026-01-15, F2A, INDIA, evaluation_month=2026-06),
          visa_availability.final_action returns RETROGRESSED (cutoff_date=2024-08-15, priority_date >= cutoff)
          while visa_availability.filing_date returns CURRENT (cutoff_date='CURRENT' for filing-date chart),
          demonstrating two valid algorithms diverging on identical Case+VisaBulletin inputs.
        test_recipe:
          setup:
            - "Clock fixed at 2026-06-15T00:00:00Z."
            - "One Applicant exists with country_of_chargeability=INDIA, date_of_birth=1990-01-15."
            - "One Case in DRAFT then filed, case_type=I-130, preference_category=F2A, priority_date stamped to 2026-01-15 (clock-driven file)."
            - "Two VisaBulletinEntry rows exist for bulletin_month=2026-06, category=F2A, country=INDIA: FINAL_ACTION cutoff_date=2024-08-15, FILING_DATE cutoff_date=CURRENT."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A111111111", full_name: "Aanya R", date_of_birth: "1990-01-15", country_of_chargeability: "INDIA", email: "aanya@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "F2A" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/visa-bulletin"
              payload: { bulletin_month: "2026-06", preference_category: "F2A", country: "INDIA", chart_type: "FINAL_ACTION", cutoff_date: "2024-08-15" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/visa-bulletin"
              payload: { bulletin_month: "2026-06", preference_category: "F2A", country: "INDIA", chart_type: "FILING_DATE", cutoff_date: "CURRENT" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /uscis/cases/${case_id}/visa-availability"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "response.data.final_action == 'RETROGRESSED'"
            - "response.data.filing_date == 'CURRENT'"
            - "response.data.evaluation_month == '2026-06'"

      - name: officer_workload_weighted_vs_flat_count_divergence_on_officer_pool
        grounds:
          - calculations.officer_workload_score
          - calculations.officer_workload_score.variants.weighted_complexity
          - calculations.officer_workload_score.variants.flat_count
          - entities.Case.fields.assigned_officer_id
          - endpoints."GET /uscis/officers/{officer_id}/workload"
        distinguishing_aspect: |
          Same backlog of 2 cases (one BIOMETRICS_SCHEDULED, one UNDER_REVIEW, both file_date=2026-06-01)
          yields workload_score=6.23 (weighted_complexity) vs case_count=2 (flat_count) at clock=2026-06-15 —
          identical pool inputs, two valid aggregation algorithms producing demonstrably different numbers
          on the Officer/Case-backlog domain (distinct from the visa availability Case/VisaBulletin domain).
        test_recipe:
          setup:
            - "Clock fixed at 2026-06-15T00:00:00Z; baseline file_date for both cases is 2026-06-01."
            - "One officer (opaque id 'officer-7') has two assigned non-terminal cases: case A in BIOMETRICS_SCHEDULED (I-485), case B in UNDER_REVIEW (I-130 advanced)."
            - "All officer assignment is round-robin server-side; this scenario assumes officer-7 is assigned by the first file (pool of one officer)."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A222222221", full_name: "B One", date_of_birth: "1985-05-05", country_of_chargeability: "WORLDWIDE", email: "b1@x.com" }
              as: Anonymous
              captures: { applicant_a: $.data.id }
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A222222222", full_name: "B Two", date_of_birth: "1986-06-06", country_of_chargeability: "WORLDWIDE", email: "b2@x.com" }
              as: Anonymous
              captures: { applicant_b: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_a}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_a}"
              captures: { case_a_id: $.data.id }
            - call: "POST /uscis/cases/${case_a_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_a}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_a_id}/biometrics"
              payload: { scheduled_at: "2026-07-01T15:00:00Z", asc_location_code: "ASC-SF-01" }
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_b}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_b}"
              captures: { case_b_id: $.data.id }
            - call: "POST /uscis/cases/${case_b_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_b}"
            - call: "POST /uscis/cases/${case_b_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /uscis/officers/${officer_id}/workload"
              payload: {}
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          assert:
            - "response.data.officer_id == ${officer_id}"
            - "response.data.case_count == 2"
            - "response.data.workload_score == 6.23"

  # =========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes from {a,b,c})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: filing_fee_under14_discount_rounding_order_pinned_mode_b
        grounds:
          - calculations.filing_fee
          - calculations.filing_fee.constants.BASE_FEE_CENTS
          - calculations.filing_fee.constants.BIOMETRICS_SURCHARGE_CENTS
          - calculations.filing_fee.constants.CHILD_DISCOUNT_PCT
          - entities.Applicant.fields.is_under_14
          - entities.Case.fields.filing_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding ORDER pinned. Scaffold mandates: apply
          CHILD_DISCOUNT_PCT=0.25 to the SUBTOTAL (base+surcharge) then round_half_up,
          NOT round each component then sum. For an under-14 I-485 applicant,
          (142000+8500)*0.75 = 112875.0 -> 112875 cents under the pinned order;
          a 'round-then-sum' interpretation would compute round(142000*0.75) +
          round(8500*0.75) = 106500 + 6375 = 112875 by coincidence with these
          constants, but the contract pins the ORDER so future constant changes
          remain deterministic.
        test_recipe:
          setup:
            - "Clock fixed at 2026-06-15T00:00:00Z (so file_date stamps to 2026-06-15)."
            - "Applicant born 2020-06-15 (age 6 at file_date → is_under_14=true)."
            - "Case I-485 filed → filing_fee_cents stamped via calculations.filing_fee with under-14 discount."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A333333333", full_name: "Child Kid", date_of_birth: "2020-06-15", country_of_chargeability: "WORLDWIDE", email: "kid@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "Case.${case_id}.case_type == 'I-485'"
            - "Case.${case_id}.filing_fee_cents == 112875"
            - "Applicant.${applicant_id}.is_under_14 == true"

      - name: workload_score_weighted_age_nonlinear_three_input_mode_a
        grounds:
          - calculations.officer_workload_score
          - calculations.officer_workload_score.constants.STATUS_WEIGHTS
          - calculations.officer_workload_score.constants.MULTIPLIER_CAP
          - calculations.officer_workload_score.constants.MULTIPLIER_DAYS_PER_UNIT
          - entities.Case.fields.assigned_officer_id
          - endpoints."GET /uscis/officers/{officer_id}/workload"
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction. Score combines (1) per-case status weight,
          (2) per-case age multiplier (1 + min(age_days/365, 1.0), capped at 2x), and (3) summation
          over the eligible pool with a single final round_half_up. For 1 BIOMETRICS_SCHEDULED case
          (weight 2) and 1 UNDER_REVIEW case (weight 4), both at age=14 days (mult=1.0383...), the
          computed score is round_half_up( (2 + 4) * 1.0383561... ) = round_half_up(6.230137...) = 6.23,
          NOT 6.00 (ignoring multiplier) and NOT 12.00 (double-counting).
        test_recipe:
          setup:
            - "Clock fixed at 2026-06-15T00:00:00Z; baseline file_date 2026-06-01 (age=14 days)."
            - "Officer-7 has 1 BIOMETRICS_SCHEDULED (I-485) + 1 UNDER_REVIEW (I-130 post-advance) case assigned."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A444444441", full_name: "C One", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "c1@x.com" }
              as: Anonymous
              captures: { applicant_a: $.data.id }
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A444444442", full_name: "C Two", date_of_birth: "1991-02-02", country_of_chargeability: "WORLDWIDE", email: "c2@x.com" }
              as: Anonymous
              captures: { applicant_b: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_a}", case_type: "I-485" }
              as: Applicant
              as_user_id: "${applicant_a}"
              captures: { case_a_id: $.data.id }
            - call: "POST /uscis/cases/${case_a_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_a}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_a_id}/biometrics"
              payload: { scheduled_at: "2026-07-01T15:00:00Z", asc_location_code: "ASC-SF-01" }
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_b}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_b}"
              captures: { case_b_id: $.data.id }
            - call: "POST /uscis/cases/${case_b_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_b}"
            - call: "POST /uscis/cases/${case_b_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /uscis/officers/${officer_id}/workload"
              payload: {}
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          assert:
            - "response.data.workload_score == 6.23"
            - "response.data.case_count == 2"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances on different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_under_review_rfe_pending_under_review_revision_cycle
        grounds:
          - state_machines.Case
          - state_machines.Case.UNDER_REVIEW_to_RFE_PENDING
          - state_machines.Case.RFE_PENDING_to_UNDER_REVIEW
          - entities.Case.fields.rfe_round_count
        distinguishing_aspect: |
          Case state machine has a cycle UNDER_REVIEW -> RFE_PENDING -> UNDER_REVIEW;
          on the cycle return, Case.rfe_round_count is INCREMENTED but NOT reset, demonstrating
          the back-edge carries a measurable side effect distinguishing it from a fresh visit.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z; an I-130 case (advanced past FILED) sits in UNDER_REVIEW with rfe_round_count=0."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A555555555", full_name: "D Cycle", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "d@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["birth_certificate"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { rfe_id: $.data.id }
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v_after_rfe: $.data.version }
          trigger:
            - call: "POST /uscis/rfes/${rfe_id}/respond"
              payload: { expected_case_version: "${case_v_after_rfe}", response_summary: "Submitted birth certificate" }
              as: Applicant
              as_user_id: "${applicant_id}"
          assert:
            - "Case.${case_id}.status == 'UNDER_REVIEW'"
            - "Case.${case_id}.rfe_round_count == 1"
            - "RFE.${rfe_id}.status == 'RESPONDED'"

      - name: interview_completed_branching_approve_deny_reopen_fan_join
        grounds:
          - state_machines.Case
          - state_machines.Case.INTERVIEW_COMPLETED_to_APPROVED
          - state_machines.Case.INTERVIEW_COMPLETED_to_DENIED
          - state_machines.Case.INTERVIEW_COMPLETED_to_UNDER_REVIEW
          - entities.InterviewAppointment.fields.decision_after_interview
        distinguishing_aspect: |
          InterviewAppointment-driven branching: from INTERVIEW_COMPLETED the Case has THREE outbound
          transitions (APPROVED, DENIED, UNDER_REVIEW), gated by the latest
          InterviewAppointment.decision_after_interview value plus the decide call's `decision` argument.
          The NEEDS_REVIEW branch reopens (UNDER_REVIEW back-edge) while APPROVE/DENY terminate —
          divergent side-effect sets per branch on a different entity from Rule-3 instance #1's
          Case.UNDER_REVIEW cycle.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z; I-485 case has completed interview with decision_after_interview=NEEDS_REVIEW."
            - "Visa availability FINAL_ACTION=CURRENT for the relevant (category=F2A, country=WORLDWIDE)."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/visa-bulletin"
              payload: { bulletin_month: "2026-06", preference_category: "F2A", country: "WORLDWIDE", chart_type: "FINAL_ACTION", cutoff_date: "CURRENT" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A666666666", full_name: "E Branch", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "e@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-485", preference_category: "F2A" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/biometrics"
              payload: { scheduled_at: "2026-06-25T15:00:00Z", asc_location_code: "ASC-SF-01" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { biom_id: $.data.id }
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/biometrics/${biom_id}/complete"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/interviews"
              payload: { scheduled_at: "2026-07-10T16:00:00Z", field_office_code: "FO-SFR" }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { interview_id: $.data.id }
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-11T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/interviews/${interview_id}/complete"
              payload: { decision_after_interview: "NEEDS_REVIEW" }
              as: Officer
              as_user_id: "${officer_id}"
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /uscis/cases/${case_id}/decide"
              payload: { decision: "REOPEN", expected_case_version: "${case_v}" }
              as: Officer
              as_user_id: "${officer_id}"
          assert:
            - "Case.${case_id}.status == 'UNDER_REVIEW'"
            - "InterviewAppointment.${interview_id}.decision_after_interview == 'NEEDS_REVIEW'"

  # =========================================================================
  # Rule 4 — transitive_cascade (≥ 2 instances, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rfe_sweep_expires_rfe_cascades_case_to_abandoned_depth3
        grounds:
          - state_machines.Case.RFE_PENDING_to_ABANDONED
          - state_machines.RFE.ISSUED_to_EXPIRED
          - endpoints."POST /uscis/_ops/sweep-rfe-deadlines"
          - entities.CaseEvent
        distinguishing_aspect: |
          Depth-3 chain triggered by POST /uscis/_ops/sweep-rfe-deadlines:
          (1) sweep action mutates RFE.status ISSUED -> EXPIRED;
          (2) that RFE.status change ITSELF mutates parent Case.status RFE_PENDING -> ABANDONED;
          (3) that Case.status change ITSELF appends CaseEvent(STATUS_CHANGE, RFE_PENDING->ABANDONED)
              and CaseEvent(RFE_EXPIRED). Each link causally derives from the previous link's
              mutation, not directly from the sweep call.
        test_recipe:
          setup:
            - "Clock at 2026-06-15T00:00:00Z; I-130 case post-advance with one ISSUED RFE; response_deadline=2026-09-10."
            - "Clock advanced past deadline to 2026-09-11 to make the sweep find an expired RFE."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
            - call: "POST /uscis/applicants/register"
              payload: { alien_number: "A777777771", full_name: "F Sweep", date_of_birth: "1990-01-01", country_of_chargeability: "WORLDWIDE", email: "f@x.com" }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /uscis/cases"
              payload: { applicant_id: "${applicant_id}", case_type: "I-130", preference_category: "IR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { case_id: $.data.id }
            - call: "POST /uscis/cases/${case_id}/file"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { officer_id: $.data.assigned_officer_id }
            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["proof_of_relationship"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { rfe_id: $.data.id }
            - call: "POST /uscis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /uscis/_ops/sweep-rfe-deadlines"
              payload: {}
              as: FieldOfficeAdmin
              as_user_id: "admin-1"
          assert:
            - "response.data.expired_rfe_count == 1"
            - "response.data.abandoned_case_count == 1"
            - "RFE.${rfe_id}.status == 'EXPIRED'"
            - "Case.${case_id}.status == 'ABANDONED'"

      - name: biometrics_complete_cascades_case_advance_then_log_depth3
        grounds:
          - state_machines.BiometricsAppointment.SCHEDULED_to_COMPLETED
          - state_machines.Case.BIOMETRICS_SCHEDULED_to_BIOMETRICS_COMPLETED
          - entities.CaseEvent
          - endpoints."POST /uscis/biometrics/{id}/complete"
        distinguishing_aspect: |
          Depth-3 cascade originating from a DIFFERENT trigger (POST /uscis/biometrics/{id}/complete,
          not the ops sweep): (1) action sets BiometricsAppointment.status SCHEDULED -> COMPLETED;
          (2) THAT state change itself bubbles Case.status BIOMETRICS_SCHEDULED -> BIOMETRICS_COMPLETED;
          (3) THAT case state change itself appends a CaseEvent(STATUS_CHANGE) and a
          CaseEvent(BIOMETRICS_COMPLETED). Distinct cascade pattern (bubble-up + log) versus
          Rule-4 instance #1's terminal-abandon cascade.
        test_recipe:
          setup:
            - "I-485 case in BIOMETRICS_SCHEDULED with an active SCHEDULED appointment whose scheduled_at has passed."
          setup_api_calls:
            - call: "POST /uscis/_clock/set_current_utc"
