  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — half-open exclusive vessel windows vs
  # closed-interval aggregate dry-room capacity. Different interval semantics
  # on different resource entities.
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: vessel_half_open_window_exclusion
        grounds:
          - calculations.vessel_window_overlap
          - entities.ProductionBatch.fields.vessel_id
          - errors[ERR_VESSEL_TIME_OVERLAP]
        distinguishing_aspect: |
          Half-open [start, end) exclusive semantics on MixingVessel: a batch
          starting exactly when another ends (10:00 == 10:00) is ADMITTED
          (adjacency is not overlap), while one straddling the boundary
          (09:00-11:00) is rejected with ERR_VESSEL_TIME_OVERLAP.
        test_recipe:
          setup:
            - "One EFFECTIVE formulation and one vessel; batch A occupies [08:00, 10:00), batch B occupies [10:00, 12:00); both MIXING"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "EPX-OVL-1", name: "Epx Ovl", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-OVL-1", capacity_liters: 500 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T10:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
              captures: { bat_a: $.data.id }
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T10:00:00Z", mix_end_at: "2026-05-01T12:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
              captures: { bat_b: $.data.id }
          trigger:
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T09:00:00Z", mix_end_at: "2026-05-01T11:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
          assert:
            - "adjacency admitted: batch B ([10:00,12:00)) was created with http 201 although batch A occupies [08:00,10:00) — half-open semantics"
            - "trigger (batch C [09:00,11:00)) returns http 409 ERR_VESSEL_TIME_OVERLAP — it intersects both A and B"
            - "only two batches exist for vessel ${ves_id} after the trigger"

      - name: dry_room_closed_interval_capacity_aggregate
        grounds:
          - calculations.dry_room_capacity_check
          - entities.PackagingRun.fields.dry_room_id
          - errors[ERR_DRY_ROOM_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Closed-interval aggregate-capacity semantics on DryRoom (different
          resource, different semantics than the vessel rule): touching windows
          [08:00,10:00] and [10:00,12:00] DO count as overlapping here, yet the
          second run is admitted because the count (1) is below capacity 2; the
          third overlapping run hits count == capacity and is rejected.
        test_recipe:
          setup:
            - "Dry room with max_concurrent_runs 2; three MIXED batches on adjacent vessel windows; run1 [08:00,10:00] OPEN in the room; run2 [10:00,12:00] OPEN in the room"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "SIL-OVL-2", name: "Sil Ovl", chemistry_family: "SILICONE", moisture_sensitive: true, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 480, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-OVL-2", capacity_liters: 500 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/dry-rooms"
              payload: { room_code: "DR-OVL-2", max_concurrent_runs: 2, humidity_limit_pct: 10.0 }
              as: PlantManager
              captures: { dr_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T08:10:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat1: $.data.id }
            - call: "POST /api/batches/${bat1}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:10:00Z", mix_end_at: "2026-05-01T08:20:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat2: $.data.id }
            - call: "POST /api/batches/${bat2}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:20:00Z", mix_end_at: "2026-05-01T08:30:00Z", batch_volume_ml: 5000 }
              as: BatchOperator
              captures: { bat3: $.data.id }
            - call: "POST /api/batches/${bat3}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat1}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 5, planned_start_at: "2026-05-01T08:00:00Z", planned_end_at: "2026-05-01T10:00:00Z", dry_room_id: "${dr_id}" }
              as: BatchOperator
              captures: { run1: $.data.id }
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat2}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 5, planned_start_at: "2026-05-01T10:00:00Z", planned_end_at: "2026-05-01T12:00:00Z", dry_room_id: "${dr_id}" }
              as: BatchOperator
              captures: { run2: $.data.id }
          trigger:
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat3}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 5, planned_start_at: "2026-05-01T09:00:00Z", planned_end_at: "2026-05-01T11:00:00Z", dry_room_id: "${dr_id}" }
              as: BatchOperator
          assert:
            - "run2 ([10:00,12:00]) was created with http 201: closed-interval overlap with run1 at t=10:00 counts, but count 1 < capacity 2"
            - "trigger run3 ([09:00,11:00]) returns http 409 ERR_DRY_ROOM_CAPACITY_EXCEEDED: it overlaps run1 AND run2, count 2 >= capacity 2"
            - "contrast with vessel semantics: the same adjacency that was free for vessels counts against dry-room capacity"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — batch volume conservation vs consignment
  # unit conservation. Different conserved quantities.
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: batch_volume_conserved_across_pack_and_condemn
        grounds:
          - calculations.pack_fill_allocation
          - state_machines.PackagingRun.HOLD_to_VOID
          - entities.ProductionBatch.fields.remaining_bulk_volume_ml
          - entities.ProductionBatch.fields.written_off_volume_ml
        distinguishing_aspect: |
          Conserved quantity = batch volume in ml. Forward action (run complete:
          remaining 1000 -> 52) followed by its compensating action (hold-release
          CONDEMN: written_off 0 -> 948) leaves
          remaining + live-filled + written_off == batch_volume_ml (1000)
          exactly — condemnation must NOT restore remaining volume.
        test_recipe:
          setup:
            - "Batch of 1000 ml with one SEALED cartridge run (3 units, 948 ml filled, 52 remaining); a 60-minute exposure drove the run to HOLD (held_from SEALED)"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "EPX-INV-1", name: "Epx Inv", chemistry_family: "EPOXY", moisture_sensitive: true, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-INV-1", capacity_liters: 100 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/dry-rooms"
              payload: { room_code: "DR-INV-1", max_concurrent_runs: 2, humidity_limit_pct: 10.0 }
              as: PlantManager
              captures: { dr_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 1000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 3, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z", dry_room_id: "${dr_id}" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/packaging-runs/${run_id}/exposure-events"
              payload: { exposure_minutes: 60, occurred_at: "2026-05-01T08:50:00Z" }
              as: BatchOperator
          trigger:
            - call: "POST /api/packaging-runs/${run_id}/hold-release"
              payload: { outcome: "CONDEMN", note: "moisture ingress confirmed" }
              as: QAManager
              as_user_id: "qm-1"
          assert:
            - "PackagingRun.${run_id}.status == VOID"
            - "ProductionLot.${lot_id}: units_condemned == 3 AND units_quarantined == 0 AND hold_status == CLEAR"
            - "INVARIANT: ProductionBatch.${bat_id}.remaining_bulk_volume_ml (52) + written_off_volume_ml (948) + live filled volume (0) == batch_volume_ml (1000) — no volume created or destroyed by the compensate pair"
            - "remaining_bulk_volume_ml == 52 (CONDEMN does not restore volume)"

      - name: consignment_units_conserved_across_dispatch_report_return
        grounds:
          - entities.ConsignmentStock.fields.qty_on_hand
          - state_machines.Shipment.CONFIRMED_to_DISPATCHED
          - calculations.consignment_consumption_waterfall
        distinguishing_aspect: |
          Conserved quantity = consignment unit count (different quantity than
          batch volume). Forward action dispatch (qty_shipped += 300,
          qty_on_hand += 300), then report (consumed += 260), then the
          compensating return (returned += 10, on_hand -= 10): the identity
          qty_shipped - qty_consumed - qty_returned == qty_on_hand holds at
          every step (300 - 260 - 10 == 30).
        test_recipe:
          setup:
            - "ACTIVE agreement (threshold 0) with stock row at qty_shipped 300 / qty_on_hand 300; a submitted report has consumed 260 (on_hand 40)"
          setup_api_calls:
            - call: "POST /api/formulations"
              payload: { code: "PU-INV-2", name: "PU Inv2", chemistry_family: "POLYURETHANE", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
              as: PlantManager
              captures: { form_id: $.data.id }
            - call: "POST /api/formulations/${form_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /api/mixing-vessels"
              payload: { vessel_code: "V-INV-2", capacity_liters: 500 }
              as: PlantManager
              captures: { ves_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/batches"
              payload: { formulation_id: "${form_id}", vessel_id: "${ves_id}", mix_start_at: "2026-05-01T08:00:00Z", mix_end_at: "2026-05-01T09:00:00Z", batch_volume_ml: 200000 }
              as: BatchOperator
              captures: { bat_id: $.data.id, lot_id: $.data.production_lot_id }
            - call: "POST /api/batches/${bat_id}/complete-mix"
              payload: {}
              as: BatchOperator
            - call: "POST /api/packaging-runs"
              payload: { batch_id: "${bat_id}", pack_format: "CARTRIDGE", unit_volume_ml: 310, planned_units: 400, planned_start_at: "2026-05-01T08:10:00Z", planned_end_at: "2026-05-01T09:30:00Z" }
              as: BatchOperator
              captures: { run_id: $.data.id }
            - call: "POST /api/packaging-runs/${run_id}/complete"
              payload: {}
              as: BatchOperator
            - call: "POST /api/production-lots/${lot_id}/cure-tests"
              payload: { method: "FULL", specimens: [13.0, 12.5, 12.4, 12.3, 12.6] }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { t1: $.data.id }
            - call: "POST /api/cure-tests/${t1}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/production-lots/${lot_id}/release"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/distributors"
              payload: { name: "Dist INV", credit_limit_cents: 10000000, contact_email: "i@x.com" }
              as: CommercialManager
              captures: { dist_id: $.data.id }
            - call: "POST /api/consignment-agreements"
              payload: { distributor_id: "${dist_id}", formulation_id: "${form_id}", unit_price_cents: 2000, max_consigned_value_cents: 900000, reorder_threshold_units: 0, reorder_qty_units: 100 }
              as: CommercialManager
              captures: { ag_id: $.data.id }
            - call: "POST /api/consignment-agreements/${ag_id}/activate"
              payload: {}
              as: CommercialManager
              captures: { ag_v: $.data.version }
            - call: "POST /api/shipments"
              payload: { shipment_kind: "CONSIGNMENT", distributor_id: "${dist_id}", transport_mode: "ROAD", ship_date: "2026-06-01", agreement_id: "${ag_id}" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "POST /api/shipments/${ship_id}/lines"
              payload: { lot_id: "${lot_id}", units: 300 }
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/plan"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/confirm"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/shipments/${ship_id}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /api/consignment-agreements/${ag_id}/consumption-reports"
              payload: { period: "2026-06", consumed_units: 260, expected_agreement_version: "${ag_v}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /api/consumption-reports/${rep_id}/submit"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "GET /api/consignment-stock"
              payload: { agreement_id: "${ag_id}" }
              as: CommercialManager
              captures: { stock_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/consignment-stock/${stock_id}/return"
              payload: { units: 10, note: "damaged cartridges returned" }
              as: CommercialManager
          assert:
            - "ConsignmentStock.${stock_id}: qty_shipped == 300 AND qty_consumed == 260 AND qty_returned == 10 AND qty_on_hand == 30"
            - "INVARIANT: 300 - 260 - 10 == 30 == qty_on_hand (held after dispatch, after report submit, and after return)"
            - "ProductionLot.${lot_id}.units_shipped == 290 (300 dispatched minus 10 returned)"
