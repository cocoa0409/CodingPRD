          Project carries parallel dimensions status x work_posture: a dust
          exceedance flips WORKABLE -> STOPPED while status stays
          DEMOLITION_ACTIVE, and resume flips STOPPED -> WORKABLE — a cycle on
          the posture dimension of the Project entity, distinct from the
          EngineeringSurvey revision loop and the UtilityDisconnect dims.
