  - section: calculations
    instances:
      - name: permit_width_bracket_is_flat
        claim_type: constants_applied
        grounds: [calculations.permit_fee, entities.Permit.fields.fee_cents]
        distinguishing_aspect: "Width surcharge uses the highest applicable bracket flat (not marginal): AZ OVERSIZE at width 150 lands in the >144 bracket for exactly 2500, total 10500 - a marginal reading that stacked the >168 bracket would be wrong."
        test_recipe:
          setup: ["Load 40000 lbs, width 150 (oversize, not overweight), states [AZ], SURVEYED"]
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Bracket Co", credit_limit_cents: 50000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Wide crate", gross_weight_lbs: 40000, width_in: 150, height_in: 100, length_in: 400, origin: "X", destination: "Y" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
