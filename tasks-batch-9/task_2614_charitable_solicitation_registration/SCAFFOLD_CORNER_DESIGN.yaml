      - name: extension_request_collection_shows_the_supersede_chain
        claim_type: listing
        grounds:
          - endpoints[GET /state-registrations/{id}/extension-requests]
          - state_machines.ExtensionRequest.transitions[PENDING -> SUPERSEDED]
          - concurrency_rules[extension-supersede-stale-registration]
        distinguishing_aspect: "The collection keeps both rows rather than replacing the first: the unfiltered read returns two requests while the status filter narrows to the one still PENDING, which is only reachable by re-reading the filing's version between the two creates."
        test_recipe:
          setup:
            - "StateProfile CA allowing extensions up to 90 days; a DRAFT CA FY2026 filing; a first hardship request created at version 1 and a second IRS-basis request created at the refreshed version 2, which supersedes it."
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "CA", registration_required: true, renewal_due_rule: "FYE_PLUS_4M_15D", assurance_basis: "GROSS_REVENUE", review_threshold_cents: 20000000, audit_threshold_cents: 200000000, extension_allowed: true, extension_max_days: 90 }
