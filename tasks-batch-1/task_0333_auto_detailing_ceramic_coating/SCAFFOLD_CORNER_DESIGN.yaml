        claim_type: exclusive_op_denied
        grounds:
          - roles
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Customer calling POST /detailing/packages (Scheduler/ShopManager-only) is denied ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "A customer exists to act as the caller."
          setup_api_calls:
            - call: "POST /detailing/customers"
              payload: { email: "rb1@x.com", full_name: "Rb One" }
              as: Scheduler
              captures: { cust_id: $.data.id }
          trigger:
