# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3284_cloud_backup_retention_restore_delivery_recovery_operations
#
# Nine Difficulty Rules from SKILL.md §0.5, two instances each (18 total).
# Every `grounds:` reference resolves into SCAFFOLD.yaml §1.1-§1.6.
# Every `setup_api_calls:` chain drives empty-DB to the `setup:` state using
# only §1.5 endpoints; every `${var}` is bound by an earlier `captures:`.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: billable_egress_metered_vs_ransomware_protected
        grounds:
          - calculations.billable_egress_gb
          - calculations.ransomware_recovery_flag
          - state_machines.RestoreRequest.VALIDATING_to_IN_PROGRESS
          - entities.RestoreRequest.fields.is_ransomware_recovery
        distinguishing_aspect: "Two restore requests against the same account differ only in restore_point_in_utc relative to the single DELETE event at 2026-09-25; the pre-DELETE request flips is_ransomware_recovery to true and charges egress_gb 600.0 (protected variant), the post-DELETE request stays metered and charges 749.0 — the same 700 GB of data, two valid metering rules, two different numbers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account, PRO tier, throttle month 202609, group with a RETENTION policy (max_extended_history_days 800), agent activated, set promoted to ACTIVE."
            - "Three file versions on /home/u/archive.tar: CREATE 300 GB at 2026-09-10, MODIFY to 400 GB at 2026-09-15, DELETE (0 bytes) at 2026-09-25."
            - "A fourth file /home/u/notes.txt CREATE 100 GB at 2026-09-12."
            - "Account usage_gb is 500.0."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - &acct_p
              call: "POST /backup-provider/accounts"
              payload: { name: "Northwind Personal", account_type: "PERSONAL", region: "US_WEST", storage_tier: "PRO", encryption_key_id: "aes-256-key-personal", usage_gb: 0 }
              as: SystemOperator
              captures: { acct_p_id: $.data.id, acct_p_v: $.data.version }
            - &grp_p
              call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_p_id}", name: "Personal Laptops", tier: "STANDARD", retention_days_override: 45 }
              as: SystemOperator
              captures: { grp_p_id: $.data.id, grp_p_v: $.data.version }
            - &pol_p
              call: "POST /backup-provider/backup-groups/${grp_p_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - &agt_p
              call: "POST /backup-provider/agents"
              payload: { account_id: "${acct_p_id}", group_id: "${grp_p_id}", hostname: "nw-laptop-01", os_type: "MACOS", license_type: "PERSONAL", throttle_month: 202609 }
              as: BackupOperator
              captures: { agt_p_id: $.data.id }
            - call: "POST /backup-provider/agents/${agt_p_id}/activate"
              payload: {}
              as: BackupOperator
            - &set_p
              call: "POST /backup-provider/backup-sets"
              payload: { agent_id: "${agt_p_id}", account_id: "${acct_p_id}", durability_class: "STANDARD" }
              as: BackupOperator
              captures: { set_p_id: $.data.id }
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 1, operation: "CREATE", size_bytes: 322122547200, content_hash: "sha256-arc-v1", event_utc: "2026-09-10T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 2, operation: "MODIFY", size_bytes: 429496729600, content_hash: "sha256-arc-v2", event_utc: "2026-09-15T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/notes.txt", version_number: 1, operation: "CREATE", size_bytes: 107374182400, content_hash: "sha256-note-v1", event_utc: "2026-09-12T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 3, operation: "DELETE", size_bytes: 0, content_hash: "sha256-arc-del", event_utc: "2026-09-25T00:00:00Z" }
              as: BackupOperator
              captures: { del_fv_id: $.data.id }
            - call: "POST /backup-provider/backup-sets/${set_p_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_p_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { acct_p_v2: $.data.version }
          trigger:
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_p_id}", subject_agent_id: "${agt_p_id}", restore_point_in_utc: "2026-09-20T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 2, requested_size_gb: 700.0, restore_transaction_count: 0, requester_mfa_ticket: "mfa-ticket-001", expected_account_version: "${acct_p_v2}" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_pre_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_pre_id}/validate"
              payload: { requester_mfa_ticket: "mfa-ticket-001" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_pre_ransom: $.data.is_ransomware_recovery }
            - call: "POST /backup-provider/restore-requests/${rr_pre_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_pre_egress: $.data.egress_gb }
            - call: "GET /backup-provider/accounts/${acct_p_id}"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { acct_p_v3: $.data.version }
            - call: "POST /backup-provider/restore-requests"
              payload: { account_id: "${acct_p_id}", subject_agent_id: "${agt_p_id}", restore_point_in_utc: "2026-09-28T00:00:00Z", restore_type: "FILE_DOWNLOAD", requested_file_count: 2, requested_size_gb: 700.0, restore_transaction_count: 0, requester_mfa_ticket: "mfa-ticket-002", expected_account_version: "${acct_p_v3}" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_post_id: $.data.id }
            - call: "POST /backup-provider/restore-requests/${rr_post_id}/validate"
              payload: { requester_mfa_ticket: "mfa-ticket-002" }
              as: AccountOwner
              as_user_id: "${acct_p_id}"
            - call: "POST /backup-provider/restore-requests/${rr_post_id}/begin"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_p_id}"
              captures: { rr_post_egress: $.data.egress_gb }
          assert:
            - "RestoreRequest.${rr_pre_id}.is_ransomware_recovery == true (the restore point 2026-09-20 precedes the DELETE at 2026-09-25)"
            - "RestoreRequest.${rr_post_id}.is_ransomware_recovery == false (the restore point 2026-09-28 follows it)"
            - "${rr_pre_egress} == 600.0"
            - "${rr_post_egress} == 749.0"
            - "${rr_pre_egress} != ${rr_post_egress}"

      - name: retention_window_provisional_vs_group_override
        grounds:
          - calculations.effective_retention_days
          - entities.BackupGroup.fields.group_retention_days
          - entities.Account.fields.retention_days
          - state_machines.RetentionChangeRequest.COOLING_OFF_to_APPLIED
        distinguishing_aspect: "The same account flips only Account.has_extended_history: a non-extended account whose group overrides to 45 days reports group_retention_days 45 and Account.retention_days 45, while an extended account left at the tier default reports 365 — the provisional tier default (30 or 365) and the explicit group request are two valid bases for the same window."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group whose retention_days_override is 45 and an ACTIVE RETENTION policy with min_retention_days 10 and max_extended_history_days 800."
            - "No RetentionChangeRequest has ever been applied to either account."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_p_id}", name: "Personal Laptops", tier: "STANDARD", retention_days_override: 45 }
              as: SystemOperator
              captures: { grp_p_id: $.data.id }
            - call: "POST /backup-provider/backup-groups/${grp_p_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
            - call: "POST /backup-provider/accounts"
              payload: { name: "Northwind Enterprise", account_type: "ENTERPRISE", region: "EU_CENTRAL", storage_tier: "BASIC", encryption_key_id: "aes-256-key-ent", usage_gb: 0 }
              as: SystemOperator
              captures: { acct_e_id: $.data.id }
            - call: "POST /backup-provider/backup-groups"
              payload: { account_id: "${acct_e_id}", name: "Enterprise Fleets", tier: "STANDARD" }
              as: SystemOperator
              captures: { grp_e_id: $.data.id }
            - call: "POST /backup-provider/backup-groups/${grp_e_id}/policies"
              payload: { policy_kind: "RETENTION", min_retention_days: 10, max_extended_history_days: 800, min_restore_point_age_hours: 0, require_mfa_for_restore: true, effective_from_utc: "2026-09-01T00:00:00Z" }
              as: RetentionOfficer
          trigger:
            - call: "GET /backup-provider/backup-groups/${grp_p_id}"
              payload: {}
              as: RetentionOfficer
              captures: { grp_p_ret: $.data.group_retention_days }
            - call: "GET /backup-provider/accounts/${acct_p_id}"
              payload: {}
              as: SystemOperator
              captures: { acct_p_ret: $.data.retention_days, acct_p_ext: $.data.has_extended_history }
            - call: "GET /backup-provider/backup-groups/${grp_e_id}"
              payload: {}
              as: RetentionOfficer
              captures: { grp_e_ret: $.data.group_retention_days }
            - call: "GET /backup-provider/accounts/${acct_e_id}"
              payload: {}
              as: SystemOperator
              captures: { acct_e_ret: $.data.retention_days, acct_e_ext: $.data.has_extended_history }
          assert:
            - "BackupGroup.${grp_p_id}.group_retention_days == 45 (the explicit override wins over the 30-day PERSONAL default)"
            - "Account.${acct_p_id}.retention_days == 45 and has_extended_history == true"
            - "BackupGroup.${grp_e_id}.group_retention_days == 365 (the ENTERPRISE tier default, no override)"
            - "Account.${acct_e_id}.retention_days == 365 and has_extended_history == true"
            - "${grp_p_ret} != ${grp_e_ret}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: pod_reliability_pct_from_erasure_coding_geometry
        grounds:
          - calculations.pod_reliability_pct
          - calculations.pod_shard_geometry
          - entities.StoragePod.fields.reliability_pct
          - state_machines.StoragePod.HEALTHY_to_DEGRADED
        distinguishing_aspect: "The resilience term is the probability that MORE than parity_shards shards fail at once, so it depends non-linearly on both the parity count and a combinatorial term: a 16/12 pod scores 99.999956 and stays reconstructable at one failure, a 16/15 pod scores 98.8 at one failure and 99.999999 at zero, and is_reconstructable flips exactly when failed_shards exceeds parity_shards."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two storage pods registered; the second has had one shard failure recorded."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /backup-provider/storage-pods"
              payload: { region: "US_WEST", total_shards: 16, data_shards: 12, failed_shards: 0 }
              as: SystemOperator
              captures: { pod_a_id: $.data.id }
            - call: "POST /backup-provider/storage-pods"
              payload: { region: "US_EAST", total_shards: 16, data_shards: 15, failed_shards: 0 }
              as: SystemOperator
              captures: { pod_b_id: $.data.id }
          trigger:
            - call: "POST /backup-provider/storage-pods/${pod_b_id}/shards/fail"
              payload: { failed_shards_delta: 1 }
              as: SystemOperator
              captures: { pod_b_state: $.data.status, pod_b_rel: $.data.reliability_pct, pod_b_recon: $.data.is_reconstructable }
            - call: "GET /backup-provider/storage-pods/${pod_a_id}"
              payload: {}
              as: SystemOperator
              captures: { pod_a_rel: $.data.reliability_pct }
          assert:
            - "StoragePod.${pod_a_id}.status == HEALTHY and is_reconstructable == true"
            - "StoragePod.${pod_a_id}.reliability_pct == 99.999956"
            - "StoragePod.${pod_b_id}.status == DEGRADED"
            - "StoragePod.${pod_b_id}.reliability_pct == 98.8"
            - "StoragePod.${pod_b_id}.is_reconstructable == true and failed_shards == 1"

      - name: storage_charge_pinned_rounding_order_and_credit
        grounds:
          - calculations.storage_charge_cents
          - entities.BillingPeriod.fields.storage_fee_cents
          - entities.BillingPeriod.fields.initial_upload_credit_cents
          - entities.Account.fields.initial_full_backup_gb
        distinguishing_aspect: "Each charge term is floored to integer cents before the terms are summed, and the one-time upload credit is min(floor(initial_full_backup_gb * tier_rate), 20000) consumed only by the account's first closed period — so a PRO account whose peak-weighted average is 120 GB bills 280 cents in its first period and 480 cents in its second, never 280 minus the credit twice."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account (PRO tier) with one ACTIVE set: the initial full backup completed at 500 GB (/home/u/archive.tar 400 GB plus /home/u/notes.txt 100 GB), then a further 400 GB file pushed the live volume to 900 GB. Account.initial_full_backup_gb is 500.0, usage_gb and peak_usage_gb are 900.0."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - *grp_p
            - *pol_p
            - *agt_p
            - call: "POST /backup-provider/agents/${agt_p_id}/activate"
              payload: {}
              as: BackupOperator
            - *set_p
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 1, operation: "CREATE", size_bytes: 429496729600, content_hash: "sha256-arc-v1", event_utc: "2026-09-10T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/notes.txt", version_number: 1, operation: "CREATE", size_bytes: 107374182400, content_hash: "sha256-note-v1", event_utc: "2026-09-12T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/complete-initial"
              payload: {}
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive2.tar", version_number: 1, operation: "CREATE", size_bytes: 429496729600, content_hash: "sha256-arc2-v1", event_utc: "2026-09-15T00:00:00Z" }
              as: BackupOperator
            - call: "GET /backup-provider/accounts/${acct_p_id}"
              payload: {}
              as: SystemOperator
              captures: { acct_p_usage: $.data.usage_gb, acct_p_initgb: $.data.initial_full_backup_gb }
            - &bp_p1
              call: "POST /backup-provider/billing-periods"
              payload: { account_id: "${acct_p_id}", period_start_utc: "2026-09-01T00:00:00Z", period_end_utc: "2026-10-01T00:00:00Z", restore_active_days: 3 }
              as: SystemOperator
              captures: { bp_p1_id: $.data.id }
            - call: "POST /backup-provider/billing-periods/${bp_p1_id}/close"
              payload: {}
              as: SystemOperator
              captures: { bp_p1_eff: $.data.storage_fee_cents, bp_p1_grp: $.data.initial_upload_credit_cents }
          trigger:
            - call: "POST /backup-provider/billing-periods"
              payload: { account_id: "${acct_p_id}", period_start_utc: "2026-10-01T00:00:00Z", period_end_utc: "2026-11-01T00:00:00Z", restore_active_days: 3 }
              as: SystemOperator
              captures: { bp_p2_id: $.data.id }
            - call: "POST /backup-provider/billing-periods/${bp_p2_id}/close"
              payload: {}
              as: SystemOperator
              captures: { bp_p2_eff: $.data.storage_fee_cents, bp_p2_grp: $.data.initial_upload_credit_cents, bp_p2_cred: $.data.storage_credit_applied_cents }
          assert:
            - "Account.${acct_p_id}.initial_full_backup_gb == 500.0"
            - "BillingPeriod.${bp_p1_id}.initial_upload_credit_cents == 200 (floor(500.0 * 4), not floor(500.0 * 5))"
            - "BillingPeriod.${bp_p2_id}.initial_upload_credit_cents == 0 (the credit is consumed by the first closed period only)"
            - "BillingPeriod.${bp_p1_id}.storage_fee_cents == 520"
            - "BillingPeriod.${bp_p2_id}.storage_fee_cents == 495"
            - "BillingPeriod.${bp_p1_id}.storage_credit_applied_cents == 200 and storage_fee_cents == 520 (720 gross minus the 200-cent one-time credit)"
            - "BillingPeriod.${bp_p2_id}.storage_credit_applied_cents == 0 and storage_fee_cents == 495 (600 gross, no credit remaining)"
            - "BillingPeriod.${bp_p1_id}.total_cents == 520 and BillingPeriod.${bp_p2_id}.total_cents == 495"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: backup_set_active_self_loop_records_incrementals
        grounds:
          - state_machines.BackupSet.ACTIVE_to_ACTIVE
          - state_machines.BackupSet.PROVISIONING_to_INITIAL_RUNNING
          - state_machines.BackupSet.INITIAL_RUNNING_to_ACTIVE
          - entities.BackupSet.fields.state
        distinguishing_aspect: "BackupSet.ACTIVE_to_ACTIVE is a self-loop: the same endpoint that carries the set out of INITIAL_RUNNING keeps firing while the set stays ACTIVE, advancing version_chain_depth on each call, whereas an ACTIVE_to_SUSPENDED-to-ACTIVE cycle needs an overdue billing period and a distinct resume path — a state machine that returns to its own state rather than advancing a pipeline."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account, group with a RETENTION policy, agent activated, set promoted to ACTIVE with /home/u/archive.tar at version 1 (100 GB)."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - *grp_p
            - *pol_p
            - *agt_p
            - call: "POST /backup-provider/agents/${agt_p_id}/activate"
              payload: {}
              as: BackupOperator
            - *set_p
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 1, operation: "CREATE", size_bytes: 107374182400, content_hash: "sha256-arc-v1", event_utc: "2026-09-10T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/complete-initial"
              payload: {}
              as: BackupOperator
              captures: { set_v_after_active: $.data.version }
          trigger:
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 2, operation: "MODIFY", size_bytes: 214748364800, content_hash: "sha256-arc-v2", event_utc: "2026-09-20T00:00:00Z" }
              as: BackupOperator
            - call: "POST /backup-provider/backup-sets/${set_p_id}/file-versions"
              payload: { file_path: "/home/u/archive.tar", version_number: 3, operation: "MODIFY", size_bytes: 322122547200, content_hash: "sha256-arc-v3", event_utc: "2026-09-21T00:00:00Z" }
              as: BackupOperator
              captures: { set_after: $.data.backup_set_id }
            - call: "GET /backup-provider/backup-sets/${set_p_id}"
              payload: {}
              as: BackupOperator
              captures: { set_state: $.data.state, set_depth: $.data.version_chain_depth, set_ver: $.data.version }
          assert:
            - "BackupSet.${set_p_id}.state == ACTIVE both before and after the two self-loop calls — the set never leaves ACTIVE"
            - "BackupSet.${set_p_id}.version_chain_depth == 3"
            - "BackupSet.${set_p_id}.storage_gb == 300.0"
            - "${set_ver} == ${set_v_after_active} + 2"
            - "Agent.${agt_p_id}.last_change_sequence == 3"

      - name: retention_change_rejected_then_resubmitted_cycle
        grounds:
          - state_machines.RetentionChangeRequest.REJECTED_to_SUBMITTED
          - state_machines.RetentionChangeRequest.SUBMITTED_to_COOLING_OFF
          - state_machines.RetentionChangeRequest.COOLING_OFF_to_REJECTED
          - entities.RetentionChangeRequest.fields.state
        distinguishing_aspect: "RetentionChangeRequest cycles SUBMITTED -> COOLING_OFF -> REJECTED -> SUBMITTED -> COOLING_OFF, returning to the same state rather than advancing a pipeline, and the resubmit edge is guarded: the replacement requested_retention_days must differ from the rejected value or the cycle is refused with ERR_DUPLICATE_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PERSONAL account with a group that has an ACTIVE RETENTION policy (min_retention_days 10, max_extended_history_days 800) and a retention_days_override of 45."
          setup_api_calls:
            - call: "POST /backup-provider/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemOperator
            - *acct_p
            - *grp_p
            - *pol_p
            - call: "GET /backup-provider/backup-groups/${grp_p_id}"
              payload: {}
              as: RetentionOfficer
              captures: { grp_v0: $.data.version }
          trigger:
            - call: "POST /backup-provider/retention-change-requests"
              payload: { account_id: "${acct_p_id}", group_id: "${grp_p_id}", requested_retention_days: 900, reason_code: "UPGRADE", expected_group_version: "${grp_v0}" }
              as: RetentionOfficer
              captures: { rcr1_id: $.data.id }
            - call: "POST /backup-provider/retention-change-requests/${rcr1_id}/begin-cooling-off"
              payload: {}
              as: RetentionOfficer
              captures: { rcr1_state: $.data.state }
            - call: "POST /backup-provider/retention-change-requests/${rcr1_id}/reject"
              payload: {}
