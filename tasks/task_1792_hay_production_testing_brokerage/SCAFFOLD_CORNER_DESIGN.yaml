        claim_type: correct_result
        grounds: [calculations.baling_service_billing, state_machines.BalingServiceOrder.COMPLETED_to_INVOICED]
        distinguishing_aspect: "Marginal (not average) tier pricing plus a minimum-charge floor applied LAST: 501 dry bales -> 601050 cents (500x1200 + 1x1050), while 400 dry bales -> 600000 (floor, not 480000)."
        test_recipe:
