  # Section: endpoints
  # ==========================================================================
  - section: endpoints
    instances:
      - name: list_orders_pagination_default
        claim_type: standard_crud
        grounds: ["endpoints", "response_envelope"]
        distinguishing_aspect: "GET /orders returns paginated list with envelope fields limit/offset/total_count/has_more; default limit=10."
        test_recipe:
          setup: ["Create 12 draft orders"]
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/v1/customers"
              payload: { full_name: "Cu PG", email: "pg@x.com", phone: "1", street_address: "1 St", postal_code: "01010" }
              as: CustomerService
              captures: { cu_pg_id: $.data.id }
            - call: "POST /api/v1/products"
              payload: { sku: "PPG", product_kind: "CORD", species: "OAK", seasoned_grade: "KILN_DRIED", base_price_cents: 40000, moisture_ceiling_pct: 20.0, available_qty: 100 }
              as: OperationsManager
              captures: { p_pg_id: $.data.id }
            # Create 12 orders — condensed via single chained block; tests would loop
            - call: "POST /api/v1/orders"
