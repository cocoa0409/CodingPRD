# =============================================================================
# PRD Benchmark Seed Tables — task_2254
# In-Bond Movement & Bonded Carrier Operations (customs bonded carrier)
# §1.0–§1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2254. In-Bond Movement & Bonded Carrier Operations (customs bonded carrier): in-bond type selection across immediate transportation, transportation and exportation, and immediate exportation, electronic in-bond filing with bond obligation and port-to-port routing, seal integrity, container inspection and diversion request procedures, transit time limits with extension requests and liquidated damages for overdue movements, arrival and export reporting at the destination port with proof of exportation, cargo release, examination holds and general order timelines, bond sufficiency, single-transaction versus continuous bonds, penalty mitigation petitions for violations

domain_name: "in-bond-movement-bonded-carrier-ops"
api_prefix: "/in-bond"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - selector_policy

  entity_topology: flat
  # Peer entities joined by explicit FK fields. Only two read paths are nested
  # (append-only children discovered from their single parent); every other
  # relationship is reached through a filtered list on the child collection.

  state_machine_shape: parallel
  # InBondMovement carries two independent dimensions — `transit_status`
  # (filing/transport lifecycle) and `custody_status` (CBP custody / release /
  # general order) — that advance on different triggers. Secondary shapes:
  # cyclic (InBondMovement OVERDUE→IN_TRANSIT revival, MitigationPetition
  # SUBMITTED→SUPPLEMENT_REQUESTED→SUBMITTED, LiquidatedDamagesClaim
  # PETITIONED→ISSUED on denial, CustomsBond ACTIVE↔SATURATED) and branching
  # (AmendmentRequest decision forks with per-amendment_type side-effect sets).

  relationship_patterns:
    - one_to_many          # BondedCarrier -> CustomsBond, InBondMovement
    - self_referential     # InBondMovement.predecessor_movement_id -> InBondMovement.id
    - polymorphic          # MovementReport.report_type ∈ {ARRIVAL, EXPORT}; AmendmentRequest.amendment_type ∈ {DIVERSION, EXTENSION}
    - cross_aggregate      # BondObligationLedgerEntry references CustomsBond, InBondMovement and LiquidatedDamagesClaim

  role_model: segregation_of_duties
  # The CBPOfficer X-User-ID that issued a LiquidatedDamagesClaim may not decide
  # a MitigationPetition against that claim, even when the same operator id also
  # holds the FPFOfficer role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: BondedCarrier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the bonded carrier"
        constraints: "1..120 chars"
      - name: irs_number
        type: string
        source: input
        description: "IRS/EIN identifier of the carrier"
        constraints: "unique across BondedCarrier; pattern NN-NNNNNNN"
      - name: custodial_status
        type: enum
        source: system
        description: "Custodial bonded-carrier privilege state"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | REVOKED"
      - name: sanction_points
        type: number
        source: computed
        description: "Decayed violation score; see calculations.carrier_sanction_points"
        default: 0.0
        constraints: "0.0..12.0, one decimal, round_half_up"
      - name: overdue_movement_count
        type: integer
        source: computed
        description: "Count of InBondMovement with carrier_id == this.id AND transit_status == OVERDUE"
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        description: "Count of LiquidatedDamagesClaim whose movement.carrier_id == this.id AND status IN {ISSUED, PETITIONED, MITIGATED}"
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: "Reason recorded when custodial_status last became SUSPENDED or REVOKED; null while ACTIVE and never suspended"
        default: null

  - name: CustomsBond
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> BondedCarrier.id; the principal obligated on this bond"
      - name: bond_type
        type: enum
        source: input
        description: "Single-transaction bond (one movement window at a time) vs continuous bond"
        constraints: "SINGLE_TRANSACTION | CONTINUOUS"
      - name: limit_amount
        type: number
        source: input
        description: "Bond limit of liability in USD"
        constraints: "> 0, 2 decimal places"
      - name: obligated_amount
        type: number
        source: computed
        description: "Sum of BondObligationLedgerEntry.amount for this bond; see calculations.bond_obligation_balance"
        default: 0.00
      - name: available_amount
        type: number
        source: computed
        description: "limit_amount - obligated_amount"
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "Bond sufficiency/availability state"
        default: ACTIVE
        constraints: "ACTIVE | SATURATED | SUSPENDED | EXPIRED"
      - name: effective_date
        type: datetime
        source: input
        description: "First instant the bond covers movements (inclusive)"
      - name: expiry_date
        type: datetime
        source: input
        description: "Last instant the bond covers movements (inclusive)"
      - name: surety_code
        type: string
        source: input
        description: "Surety company code carried on the bond"
      - name: open_movement_count
        type: integer
        source: computed
        description: "Count of InBondMovement with bond_id == this.id AND transit_status IN {FILED, IN_TRANSIT, OVERDUE, ARRIVED, EXPORTED}"
        default: 0

  - name: Port
    parent: null
    common_fields: true
    fields:
      - name: port_code
        type: string
        source: input
        description: "CBP port code"
        constraints: "unique across Port; exactly 4 digits"
      - name: name
        type: string
        source: input
        description: "Port name"
      - name: region_code
        type: enum
        source: input
        description: "Customs region used for routing-leg and diversion-severity decisions"
        constraints: "NE | MW | SE | PSW | NW"
      - name: exam_capacity_slots
        type: integer
        source: input
        description: "Number of concurrent scheduled examination windows the port can host"
        constraints: ">= 0"
      - name: go_warehouse_available
        type: boolean
        source: input
        description: "Whether a general-order warehouse serves this port"
        default: true
      - name: open_hold_count
        type: integer
        source: computed
        description: "Count of ExaminationHold with port_id == this.id AND status == OPEN (all hold_type values)"
        default: 0

  - name: InBondMovement
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: "FK -> BondedCarrier.id; the bonded carrier moving the merchandise"
      - name: bond_id
        type: string
        source: input
        description: "FK -> CustomsBond.id; obligated bond. Optional on filing — when omitted the server resolves it with calculations.bond_selection_policy"
      - name: origin_port_id
        type: string
        source: input
        description: "FK -> Port.id; port where the in-bond movement originates"
      - name: destination_port_id
        type: string
        source: input
        description: "FK -> Port.id; port-to-port routing destination; mutated by an APPROVED DIVERSION amendment"
      - name: arrival_port_id
        type: string
        source: computed
        description: "FK -> Port.id; port_id of the ACCEPTED ARRIVAL MovementReport; null until arrival is reported"
        default: null
      - name: predecessor_movement_id
        type: string
        source: input
        description: "FK -> InBondMovement.id; prior leg this movement was re-manifested from; null for an origin leg"
        default: null
      - name: in_bond_type
        type: enum
        source: input
        description: "IT = immediate transportation, TE = transportation and exportation, IE = immediate exportation"
        constraints: "IT | TE | IE"
      - name: manifest_reference
        type: string
        source: input
        description: "Carrier manifest / bill reference on the electronic in-bond filing"
      - name: cargo_value
        type: number
        source: input
        description: "Declared value of the merchandise in USD"
        constraints: "> 0, 2 decimal places"
      - name: gross_weight_kg
        type: number
        source: input
        description: "Gross weight in kilograms"
        constraints: "> 0, up to 2 decimal places"
      - name: package_count
        type: integer
        source: input
        description: "Number of packages manifested"
        constraints: ">= 1"
      - name: transit_status
        type: enum
        source: system
        description: "Transport dimension of the movement lifecycle"
        default: FILED
        constraints: "FILED | IN_TRANSIT | OVERDUE | ARRIVED | EXPORTED | CLOSED | CANCELLED"
      - name: custody_status
        type: enum
        source: system
        description: "CBP custody dimension, independent of transit_status"
        default: BONDED
        constraints: "BONDED | EXAM_HOLD | RELEASED | GENERAL_ORDER"
      - name: obligation_amount
        type: number
        source: computed
        description: "Bond charge for this movement; see calculations.movement_bond_obligation"
        default: 0.00
      - name: transit_days_allowed
        type: integer
        source: computed
        description: "Allowed transit days including granted extensions; see calculations.transit_allowance_and_deadline"
      - name: deadline_anchor_utc
        type: datetime
        source: computed
        description: "Instant the transit clock is measured from; filed_at, rebased to the decision instant by an APPROVED DIVERSION"
      - name: transit_deadline_utc
        type: datetime
        source: computed
        description: "deadline_anchor_utc + transit_days_allowed days"
      - name: extension_days_granted
        type: integer
        source: computed
        description: "Cumulative granted_days across APPROVED EXTENSION amendments on this movement"
        default: 0
      - name: overdue_days
        type: integer
        source: computed
        description: "Whole days past transit_deadline_utc as of the current logical clock; 0 when not past deadline; see calculations.overdue_days_measure"
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock instant when the electronic in-bond filing was accepted"
      - name: seal_number
        type: string
        source: system
        description: "Seal number of the most recent APPLIED or REPLACED SealEvent; null before departure"
        default: null
      - name: seal_intact
        type: boolean
        source: computed
        description: "True after an APPLIED or REPLACED SealEvent, false before departure and after any BROKEN_* SealEvent"
        default: false
      - name: arrival_reported_at
        type: datetime
        source: computed
        description: "reported_at of the ACCEPTED ARRIVAL MovementReport; null until arrival"
        default: null
      - name: export_reported_at
        type: datetime
        source: computed
        description: "reported_at of the ACCEPTED EXPORT MovementReport; null until export proof is accepted"
        default: null
      - name: go_deadline_utc
        type: datetime
        source: computed
        description: "General-order deadline; see calculations.general_order_deadline. Null until arrival is reported"
        default: null
      - name: go_grace_applied
        type: boolean
        source: computed
        description: "True once the one-time examination grace has extended go_deadline_utc"
        default: false
      - name: diversion_flag
        type: boolean
        source: computed
        description: "True when arrival was accepted at a port other than destination_port_id inside the same region_code"
        default: false
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason recorded when transit_status became CANCELLED; null otherwise"
        default: null

  - name: BondObligationLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: bond_id
        type: string
        source: system
        description: "FK -> CustomsBond.id; bond whose obligation this entry moves"
      - name: movement_id
        type: string
        source: system
        description: "FK -> InBondMovement.id; movement the entry is attributed to"
      - name: claim_id
        type: string
        source: system
        description: "FK -> LiquidatedDamagesClaim.id; set on INCREASE_LD, RELEASE_LD and MITIGATE entries, null on OBLIGATE and RELEASE"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: "Ledger movement kind"
        constraints: "OBLIGATE | RELEASE | INCREASE_LD | RELEASE_LD | MITIGATE"
      - name: amount
        type: number
        source: system
        description: "Signed USD delta applied to CustomsBond.obligated_amount (positive obligates, negative releases)"
        constraints: "2 decimal places, never 0.00"
      - name: balance_after
        type: number
        source: computed
        description: "CustomsBond.obligated_amount after this entry was applied"
      - name: reason_code
        type: string
        source: system
        description: "Short machine code explaining the entry (e.g. MOVEMENT_FILED, MOVEMENT_CANCELLED, CLAIM_ISSUED, CLAIM_CANCELLED, CLAIM_PAID, PETITION_GRANTED, CARRIER_SUSPENSION_CASCADE)"
      - name: recorded_at
        type: datetime
        source: system
        description: "Logical clock instant the entry was appended"

  - name: SealEvent
    parent: null
    common_fields: false
    fields:
      - name: movement_id
        type: string
        source: input
        description: "FK -> InBondMovement.id; movement whose seal this event concerns"
      - name: seal_number
        type: string
        source: input
        description: "Seal number observed or applied"
      - name: event_type
        type: enum
        source: input
        description: "Seal integrity event. APPLIED is system-only (written by departure); the other four are client-supplied"
        constraints: "APPLIED | VERIFIED_INTACT | BROKEN_AUTHORIZED | BROKEN_UNAUTHORIZED | REPLACED"
      - name: port_code
        type: string
        source: input
        description: "Port.port_code of the location where the event was observed; must match an existing Port"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that recorded the event"
      - name: occurred_at
        type: datetime
        source: system
        description: "Logical clock instant of the event"
      - name: resulting_seal_intact
        type: boolean
        source: computed
        description: "InBondMovement.seal_intact value after this event: true for APPLIED and REPLACED, false for BROKEN_AUTHORIZED and BROKEN_UNAUTHORIZED, unchanged prior value for VERIFIED_INTACT"

  - name: ExaminationHold
    parent: null
    common_fields: true
    fields:
      - name: movement_id
        type: string
        source: input
        description: "FK -> InBondMovement.id; movement placed under hold"
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; port whose examination resources the hold consumes"
      - name: hold_type
        type: enum
        source: input
        description: "EXAM_NII and EXAM_PHYSICAL occupy a scheduled examination window; DOCUMENT and PGA do not; SEAL_DISCREPANCY is system-created only"
        constraints: "EXAM_NII | EXAM_PHYSICAL | DOCUMENT | PGA | SEAL_DISCREPANCY"
      - name: status
        type: enum
        source: system
        description: "Hold lifecycle"
        default: OPEN
        constraints: "OPEN | RELEASED"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Inclusive start of the examination window; required for EXAM_NII and EXAM_PHYSICAL, must be null otherwise"
        default: null
      - name: scheduled_end
        type: datetime
        source: input
        description: "Exclusive end of the examination window; required for EXAM_NII and EXAM_PHYSICAL, must be null otherwise"
        default: null
      - name: reason_code
        type: string
        source: input
        description: "Short machine code for why the hold was placed"
      - name: placed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the placing CBPOfficer, or the literal SYSTEM for auto-created SEAL_DISCREPANCY holds"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical clock instant the hold was released; null while OPEN"
        default: null
      - name: findings_code
        type: enum
        source: computed
        description: "Examination outcome recorded at release; null while OPEN"
        default: null
        constraints: "CLEAR | DISCREPANCY | SEAL_COMPROMISED"
      - name: discrepancy_pieces
        type: integer
        source: computed
        description: "Pieces found in discrepancy at release"
        default: 0
      - name: created_by_system
        type: boolean
        source: system
        description: "True for the SEAL_DISCREPANCY hold auto-created by a BROKEN_UNAUTHORIZED SealEvent"
        default: false

  - name: AmendmentRequest
    parent: null
    common_fields: true
    fields:
      - name: movement_id
        type: string
        source: input
        description: "FK -> InBondMovement.id; movement to be amended"
      - name: amendment_type
        type: enum
        source: input
        description: "DIVERSION changes routing (and optionally in-bond type); EXTENSION adds transit days"
        constraints: "DIVERSION | EXTENSION"
      - name: requested_destination_port_code
        type: string
        source: input
        description: "Port.port_code requested as the new destination; required for DIVERSION, must be null for EXTENSION"
        default: null
      - name: requested_in_bond_type
        type: enum
        source: input
        description: "Optional in-bond type change carried by a DIVERSION; must be null for EXTENSION"
        default: null
        constraints: "IT | TE | IE"
      - name: requested_days
        type: integer
        source: input
        description: "Additional transit days requested; required for EXTENSION (1..30), must be null for DIVERSION"
        default: null
      - name: justification_code
        type: enum
        source: input
        description: "Reason the amendment is sought"
        constraints: "CONSIGNEE_CHANGE | CARRIER_EQUIPMENT_FAILURE | PORT_CONGESTION | WEATHER_DELAY"
      - name: status
        type: enum
        source: system
        description: "Amendment lifecycle"
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED | SUPERSEDED"
      - name: granted_days
        type: integer
        source: computed
        description: "Days actually granted on an APPROVED EXTENSION (may be lower than requested_days); null otherwise"
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the deciding CBPOfficer; null while SUBMITTED"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical clock instant of the decision; null while SUBMITTED"
        default: null
      - name: decision_reason_code
        type: string
        source: computed
        description: "Short machine code recorded with the decision; null while SUBMITTED"
        default: null
      - name: resulting_deadline_utc
        type: datetime
        source: computed
        description: "InBondMovement.transit_deadline_utc as recomputed by this APPROVED amendment; null when not APPROVED"
        default: null

  - name: MovementReport
    parent: null
    common_fields: true
    fields:
      - name: movement_id
        type: string
        source: input
        description: "FK -> InBondMovement.id; reported movement"
      - name: port_id
        type: string
        source: input
        description: "FK -> Port.id; port where arrival or export was reported"
      - name: report_type
        type: enum
        source: input
        description: "ARRIVAL report at the destination port, or EXPORT report with proof of exportation"
        constraints: "ARRIVAL | EXPORT"
      - name: packages_reported
        type: integer
        source: input
        description: "Packages tendered at the reporting port"
        constraints: ">= 0"
      - name: proof_of_export_ref
        type: string
        source: input
        description: "Proof-of-exportation document reference; only meaningful for EXPORT reports"
        default: null
      - name: export_conveyance_ref
        type: string
        source: input
        description: "Outbound conveyance / vessel-flight reference on an EXPORT report"
        default: null
      - name: status
        type: enum
        source: system
        description: "ACCEPTED once complete; PENDING_PROOF for an EXPORT report filed without proof_of_export_ref; SUPERSEDED when a later report replaces it"
        default: ACCEPTED
        constraints: "ACCEPTED | PENDING_PROOF | SUPERSEDED"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical clock instant the report was filed"
      - name: package_discrepancy
        type: integer
        source: computed
        description: "InBondMovement.package_count - packages_reported at filing time"
        default: 0

  - name: LiquidatedDamagesClaim
    parent: null
    common_fields: true
    fields:
      - name: movement_id
        type: string
        source: input
        description: "FK -> InBondMovement.id; movement in violation"
      - name: bond_id
        type: string
        source: computed
        description: "FK -> CustomsBond.id; copied from the movement's bond_id at issuance"
      - name: claim_type
        type: enum
        source: input
        description: "Violation the claim is issued for"
        constraints: "LATE_ARRIVAL | NON_ARRIVAL | SEAL_VIOLATION | UNAUTHORIZED_DIVERSION | NO_PROOF_OF_EXPORT"
      - name: overdue_days_at_issue
        type: integer
        source: computed
        description: "overdue-day count used in the assessment; see calculations.liquidated_damages_assessment"
      - name: assessed_amount
        type: number
        source: computed
        description: "Liquidated damages assessed; see calculations.liquidated_damages_assessment"
      - name: mitigated_amount
        type: number
        source: computed
        description: "Amount payable after a GRANTED or PARTIALLY_GRANTED petition; null until mitigation"
        default: null
      - name: paid_amount
        type: number
        source: computed
        description: "Amount actually paid; null until PAID"
        default: null
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle"
        default: ISSUED
        constraints: "ISSUED | PETITIONED | MITIGATED | PAID | CANCELLED"
      - name: issued_by_officer_id
        type: string
        source: system
        description: "X-User-ID of the issuing CBPOfficer; drives the segregation-of-duties check on petition decisions"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical clock instant of issuance"
      - name: sanction_points_applied
        type: number
        source: computed
        description: "Undecayed severity points this claim contributes; see calculations.carrier_sanction_points"
      - name: cancellation_reason
        type: string
        source: computed
        description: "Reason recorded when the claim was CANCELLED; null otherwise"
        default: null

  - name: MitigationPetition
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> LiquidatedDamagesClaim.id; claim being petitioned"
      - name: mitigation_factors
        type: array
        source: input
        description: "Distinct mitigation factor codes asserted by the petitioner"
        constraints: "1..5 distinct members of {FIRST_VIOLATION, CARGO_SECURED_INTACT, PROMPT_ARRIVAL_REPORT, CBP_ADMIN_DELAY, EXTRAORDINARY_CIRCUMSTANCE}"
      - name: narrative_reference
        type: string
        source: input
        description: "Reference to the petition narrative document"
      - name: round
        type: integer
        source: computed
        description: "Petition round; 1 on submission, incremented by each accepted supplement"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Petition lifecycle"
        default: SUBMITTED
        constraints: "SUBMITTED | SUPPLEMENT_REQUESTED | GRANTED | PARTIALLY_GRANTED | DENIED | SUPERSEDED"
      - name: mitigation_pct
        type: number
        source: computed
        description: "Applied mitigation fraction; see calculations.mitigation_offer_amount"
      - name: net_before_fee
        type: number
        source: computed
        description: "Assessed amount after mitigation_pct, before the processing fee"
      - name: processing_fee
        type: number
        source: computed
        description: "Fee selected from the net_before_fee tier"
      - name: offer_amount
        type: number
        source: computed
        description: "Mitigation offer the petitioner would pay; see calculations.mitigation_offer_amount"
      - name: prior_violation_count
        type: integer
        source: computed
        description: "Count of other LiquidatedDamagesClaim on the same carrier with status != CANCELLED issued within 365 days before this petition"
        default: 0
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the deciding FPFOfficer; null until decided"
        default: null
      - name: decision_reason_code
        type: string
        source: computed
        description: "Short machine code recorded with the decision; null until decided"
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the filing BondedCarrier"

  - name: ComplianceSweep
    parent: null
    common_fields: false
    fields:
      - name: run_at
        type: datetime
        source: system
        description: "Logical clock instant the sweep executed"
      - name: executed_by_officer_id
        type: string
        source: system
        description: "X-User-ID of the CBPOfficer that ran the sweep"
      - name: overdue_marked_count
        type: integer
        source: computed
        description: "Movements moved IN_TRANSIT -> OVERDUE by this sweep"
        default: 0
      - name: bonds_expired_count
        type: integer
        source: computed
        description: "Bonds moved to EXPIRED by this sweep"
        default: 0
      - name: general_order_count
        type: integer
        source: computed
        description: "Movements whose custody_status became GENERAL_ORDER in this sweep"
        default: 0
      - name: overdue_movement_ids
        type: array
        source: computed
        description: "Ids of the movements marked OVERDUE, in processing order (created_at ASC)"
        default: []
      - name: note
        type: string
        source: input
        description: "Free-text operator note on the sweep run"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- InBondMovement dimension 1 of 2: transport lifecycle -----------------
  - entity: InBondMovement
    state_field: transit_status
    initial_state: FILED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: "(creation)"
        to: FILED
        trigger: "POST /in-bond/movements"
        actor: BondedCarrier
        preconditions:
          - "carrier.custodial_status == ACTIVE"
          - "resolved bond.status == ACTIVE"
          - "obligation_amount <= bond.available_amount"
          - "in_bond_type route shape holds: IE requires destination_port_id == origin_port_id; IT and TE require destination_port_id != origin_port_id"
          - "predecessor_movement_id, when supplied, references a movement with transit_status == ARRIVED and carrier_id == this carrier_id"
        side_effects:
          - "obligation_amount := calculations.movement_bond_obligation"
          - "transit_days_allowed, deadline_anchor_utc (:= filed_at), transit_deadline_utc := calculations.transit_allowance_and_deadline, variant at_filing"
          - "appends BondObligationLedgerEntry(entry_type=OBLIGATE, amount=+obligation_amount, reason_code=MOVEMENT_FILED)"
          - "recomputes CustomsBond.obligated_amount, CustomsBond.available_amount, CustomsBond.open_movement_count"
          - "CustomsBond.status := SATURATED when available_amount <= 0.00 (see CustomsBond machine)"
          - "custody_status := BONDED; seal_intact := false"
      - from: FILED
        to: IN_TRANSIT
        trigger: "POST /in-bond/movements/{id}/departure"
        actor: BondedCarrier
        preconditions:
          - "X-User-ID == movement.carrier_id"
          - "transit_status == FILED"
          - "custody_status == BONDED (no ExaminationHold with movement_id == this.id AND status == OPEN)"
          - "carrier.custodial_status == ACTIVE"
          - "bond.status == ACTIVE"
        side_effects:
          - "appends SealEvent(event_type=APPLIED, seal_number=request.seal_number, port_code=origin port's port_code)"
          - "seal_number := request.seal_number; seal_intact := true"
          - "increments InBondMovement.version by 1"
      - from: FILED
        to: CANCELLED
        trigger: "POST /in-bond/movements/{id}/cancellation"
        actor: BondedCarrier
        preconditions:
          - "X-User-ID == movement.carrier_id"
          - "transit_status == FILED"
        side_effects:
          - "cancellation_reason := request.reason_code"
          - "appends BondObligationLedgerEntry(entry_type=RELEASE, amount=-obligation_amount, reason_code=MOVEMENT_CANCELLED)"
          - "recomputes CustomsBond.obligated_amount / available_amount / open_movement_count"
          - "CustomsBond.status := ACTIVE when it was SATURATED and available_amount > 0.00"
      - from: FILED
        to: CANCELLED
        trigger: "system: BondedCarrier.custodial_status became SUSPENDED or REVOKED (carrier-suspension cascade)"
        actor: system
        preconditions:
          - "transit_status == FILED (movements already IN_TRANSIT, OVERDUE, ARRIVED or EXPORTED are untouched)"
        side_effects:
          - "cancellation_reason := CARRIER_SUSPENSION_CASCADE"
          - "appends BondObligationLedgerEntry(entry_type=RELEASE, amount=-obligation_amount, reason_code=CARRIER_SUSPENSION_CASCADE)"
          - "recomputes CustomsBond.obligated_amount / available_amount / open_movement_count; CustomsBond.status re-evaluated"
        note: "Movements are processed created_at ASC so the ledger order is deterministic."
      - from: IN_TRANSIT
        to: OVERDUE
        trigger: "POST /in-bond/compliance-sweeps"
        actor: system
        preconditions:
          - "clock.now > transit_deadline_utc"
        side_effects:
          - "overdue_days := calculations.overdue_days_measure with reference_ts = clock.now"
          - "recomputes BondedCarrier.overdue_movement_count"
          - "ComplianceSweep.overdue_marked_count += 1 and id appended to ComplianceSweep.overdue_movement_ids"
      - from: OVERDUE
        to: IN_TRANSIT
        trigger: "POST /in-bond/amendment-requests/{id}/decision with decision=APPROVE (revival)"
        actor: CBPOfficer
        preconditions:
          - "overdue_days <= LATE_EXTENSION_GRACE_DAYS (2)"
          - "recomputed transit_deadline_utc > clock.now"
        side_effects:
          - "overdue_days := 0"
          - "recomputes BondedCarrier.overdue_movement_count"
        note: "Cycle IN_TRANSIT -> OVERDUE -> IN_TRANSIT. When overdue_days > 2 or the recomputed deadline is still in the past the movement stays OVERDUE and the amendment is still APPROVED."
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "POST /in-bond/reports with report_type=ARRIVAL"
        actor: BondedCarrier
        preconditions:
          - "in_bond_type IN {IT, TE}"
          - "custody_status != GENERAL_ORDER"
          - "report port_id == destination_port_id, or report port is in the same region_code as destination port (minor deviation), or an APPROVED DIVERSION already moved destination_port_id to the report port"
        side_effects:
          - "arrival_port_id := report.port_id; arrival_reported_at := clock.now"
          - "diversion_flag := true when report.port_id != destination_port_id"
          - "go_deadline_utc := calculations.general_order_deadline"
          - "MovementReport.status := ACCEPTED; MovementReport.package_discrepancy computed"
      - from: OVERDUE
        to: ARRIVED
        trigger: "POST /in-bond/reports with report_type=ARRIVAL"
        actor: BondedCarrier
        preconditions:
          - "in_bond_type IN {IT, TE}"
          - "custody_status != GENERAL_ORDER"
        side_effects:
          - "same as IN_TRANSIT -> ARRIVED; overdue_days is retained (it is the input to a LATE_ARRIVAL claim)"
      - from: IN_TRANSIT
        to: EXPORTED
        trigger: "POST /in-bond/reports with report_type=EXPORT and proof_of_export_ref present, or POST /in-bond/reports/{id}/proof"
        actor: BondedCarrier
        preconditions:
          - "in_bond_type == IE"
          - "seal_intact == true"
        side_effects:
          - "export_reported_at := clock.now; MovementReport.status := ACCEPTED"
          - "auto-transition EXPORTED -> CLOSED when no ExaminationHold with movement_id == this.id AND status == OPEN exists"
      - from: OVERDUE
        to: EXPORTED
        trigger: "POST /in-bond/reports with report_type=EXPORT and proof_of_export_ref present, or POST /in-bond/reports/{id}/proof"
        actor: BondedCarrier
        preconditions:
          - "in_bond_type == IE"
          - "seal_intact == true"
        side_effects:
          - "export_reported_at := clock.now; overdue_days retained as the input to a NO_PROOF_OF_EXPORT or LATE_ARRIVAL claim"
          - "auto-transition EXPORTED -> CLOSED when no OPEN ExaminationHold exists"
      - from: ARRIVED
        to: EXPORTED
        trigger: "POST /in-bond/reports with report_type=EXPORT and proof_of_export_ref present, or POST /in-bond/reports/{id}/proof"
        actor: BondedCarrier
        preconditions:
          - "in_bond_type == TE"
          - "custody_status != GENERAL_ORDER"
          - "seal_intact == true"
        side_effects:
          - "export_reported_at := clock.now"
          - "auto-transition EXPORTED -> CLOSED when no OPEN ExaminationHold exists"
      - from: EXPORTED
        to: CLOSED
        trigger: "system: export proof accepted with no OPEN hold, or POST /in-bond/examination-holds/{id}/release releasing the last OPEN hold"
        actor: system
        preconditions:
          - "no ExaminationHold with movement_id == this.id AND status == OPEN"
        side_effects:
          - "appends BondObligationLedgerEntry(entry_type=RELEASE, amount=-obligation_amount, reason_code=MOVEMENT_EXPORTED)"
          - "recomputes CustomsBond.obligated_amount / available_amount / open_movement_count; CustomsBond.status := ACTIVE when it was SATURATED and available_amount > 0.00"
      - from: ARRIVED
        to: CLOSED
        trigger: "POST /in-bond/movements/{id}/release (IT only)"
        actor: CBPOfficer
        preconditions:
          - "in_bond_type == IT"
          - "custody_status becomes RELEASED in the same request"
        side_effects:
          - "appends BondObligationLedgerEntry(entry_type=RELEASE, amount=-obligation_amount, reason_code=CARGO_RELEASED)"
          - "recomputes CustomsBond.obligated_amount / available_amount / open_movement_count; CustomsBond.status re-evaluated"

  # --- InBondMovement dimension 2 of 2: CBP custody -------------------------
  - entity: InBondMovement
    state_field: custody_status
    initial_state: BONDED
    terminal_states: [RELEASED, GENERAL_ORDER]
    transitions:
      - from: "(creation)"
        to: BONDED
        trigger: "POST /in-bond/movements"
        actor: BondedCarrier
        preconditions: ["see transit_status (creation) -> FILED"]
        side_effects: ["none beyond the transit dimension"]
      - from: BONDED
        to: EXAM_HOLD
        trigger: "POST /in-bond/examination-holds"
        actor: CBPOfficer
        preconditions:
          - "transit_status NOT IN {CLOSED, CANCELLED}"
          - "custody_status != GENERAL_ORDER AND custody_status != RELEASED"
          - "for hold_type IN {EXAM_NII, EXAM_PHYSICAL}: overlapping OPEN window count at the port < Port.exam_capacity_slots (calculations.exam_window_occupancy)"
        side_effects:
          - "recomputes Port.open_hold_count"
          - "when transit_status == ARRIVED AND go_grace_applied == false: go_deadline_utc += GO_HOLD_GRACE_DAYS (5) and go_grace_applied := true"
      - from: BONDED
        to: EXAM_HOLD
        trigger: "system: POST /in-bond/seal-events with event_type=BROKEN_UNAUTHORIZED auto-creates ExaminationHold(hold_type=SEAL_DISCREPANCY, created_by_system=true)"
        actor: system
        preconditions:
          - "transit_status NOT IN {CLOSED, CANCELLED}"
          - "custody_status NOT IN {RELEASED, GENERAL_ORDER}"
        side_effects:
          - "seal_intact := false (link 1 -> link 2 of the seal cascade)"
          - "recomputes Port.open_hold_count for the Port whose port_code == SealEvent.port_code"
          - "when transit_status == ARRIVED AND go_grace_applied == false: go_deadline_utc += 5 days and go_grace_applied := true"
      - from: EXAM_HOLD
        to: EXAM_HOLD
        trigger: "POST /in-bond/examination-holds (second and later concurrent holds)"
        actor: CBPOfficer
        preconditions: ["same as BONDED -> EXAM_HOLD"]
        side_effects: ["recomputes Port.open_hold_count; go_deadline_utc is NOT extended again (go_grace_applied already true)"]
        note: "Self-loop: custody stays EXAM_HOLD while any hold remains OPEN."
      - from: EXAM_HOLD
        to: BONDED
        trigger: "POST /in-bond/examination-holds/{id}/release"
        actor: CBPOfficer
        preconditions:
          - "the released hold was the last ExaminationHold with movement_id == this.id AND status == OPEN"
        side_effects:
          - "recomputes Port.open_hold_count"
          - "when transit_status == EXPORTED: auto-transition EXPORTED -> CLOSED with its RELEASE ledger entry"
        note: "Conditional cascade — custody reverts to BONDED, never straight to RELEASED."
      - from: BONDED
        to: RELEASED
        trigger: "POST /in-bond/movements/{id}/release"
        actor: CBPOfficer
        preconditions:
          - "transit_status IN {ARRIVED, EXPORTED}"
          - "no ExaminationHold with movement_id == this.id AND status == OPEN"
          - "seal_intact == true"
        side_effects:
          - "when in_bond_type == IT AND transit_status == ARRIVED: auto-transition ARRIVED -> CLOSED with its RELEASE ledger entry"
      - from: BONDED
        to: GENERAL_ORDER
        trigger: "POST /in-bond/compliance-sweeps"
        actor: system
        preconditions:
          - "transit_status == ARRIVED"
          - "clock.now >= go_deadline_utc"
          - "Port(destination_port_id).go_warehouse_available == true"
        side_effects:
          - "ComplianceSweep.general_order_count += 1"
          - "bond obligation is NOT released — the merchandise remains under bond in general order"
      - from: EXAM_HOLD
        to: GENERAL_ORDER
        trigger: "POST /in-bond/compliance-sweeps"
        actor: system
        preconditions:
          - "transit_status == ARRIVED"
          - "clock.now >= go_deadline_utc"
          - "Port(destination_port_id).go_warehouse_available == true"
        side_effects:
          - "OPEN ExaminationHold rows stay OPEN; Port.open_hold_count unchanged"
          - "ComplianceSweep.general_order_count += 1"

  # --- CustomsBond ----------------------------------------------------------
  - entity: CustomsBond
    state_field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: "(creation)"
        to: ACTIVE
        trigger: "POST /in-bond/bonds"
        actor: CBPOfficer
        preconditions: ["carrier exists", "expiry_date > effective_date", "limit_amount > 0"]
        side_effects: ["obligated_amount := 0.00; available_amount := limit_amount"]
      - from: ACTIVE
        to: SATURATED
        trigger: "system: any BondObligationLedgerEntry append or PATCH /in-bond/bonds/{id} that leaves available_amount <= 0.00"
        actor: system
        preconditions: ["available_amount <= 0.00"]
        side_effects: ["blocks POST /in-bond/movements and departure for this bond (ERR_BOND_NOT_ACTIVE)"]
      - from: SATURATED
        to: ACTIVE
        trigger: "system: any BondObligationLedgerEntry append or PATCH /in-bond/bonds/{id} that leaves available_amount > 0.00"
        actor: system
        preconditions: ["available_amount > 0.00"]
        side_effects: ["filing and departure become possible again"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /in-bond/bonds/{id} with status=SUSPENDED"
        actor: SuretyAgent
        preconditions: ["X-User-ID == bond.id"]
        side_effects: ["blocks POST /in-bond/movements and departure for this bond (ERR_BOND_NOT_ACTIVE); open movements are untouched"]
      - from: SATURATED
        to: SUSPENDED
        trigger: "PATCH /in-bond/bonds/{id} with status=SUSPENDED"
        actor: SuretyAgent
        preconditions: ["X-User-ID == bond.id"]
        side_effects: ["as above"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /in-bond/bonds/{id} with status=ACTIVE"
        actor: SuretyAgent
        preconditions: ["X-User-ID == bond.id", "clock.now <= expiry_date"]
        side_effects: ["immediately re-evaluated to SATURATED when available_amount <= 0.00"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /in-bond/compliance-sweeps"
        actor: system
        preconditions: ["clock.now > expiry_date"]
        side_effects: ["ComplianceSweep.bonds_expired_count += 1; blocks new filings on this bond"]
      - from: SATURATED
        to: EXPIRED
        trigger: "POST /in-bond/compliance-sweeps"
        actor: system
        preconditions: ["clock.now > expiry_date"]
        side_effects: ["ComplianceSweep.bonds_expired_count += 1"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /in-bond/compliance-sweeps"
        actor: system
        preconditions: ["clock.now > expiry_date"]
        side_effects: ["ComplianceSweep.bonds_expired_count += 1"]

  # --- BondedCarrier --------------------------------------------------------
  - entity: BondedCarrier
    state_field: custodial_status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: "(creation)"
        to: ACTIVE
        trigger: "POST /in-bond/carriers"
        actor: CBPOfficer
        preconditions: ["irs_number unique"]
        side_effects: ["sanction_points := 0.0"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: sanction_points recomputation (POST /in-bond/ld-claims, POST /in-bond/ld-claims/{id}/disposition, POST /in-bond/compliance-sweeps) yields sanction_points >= 10.0"
        actor: system
        preconditions: ["sanction_points >= SANCTION_SUSPENSION_THRESHOLD (10.0)"]
        side_effects:
          - "suspension_reason := SANCTION_POINTS_THRESHOLD"
          - "cascade: every InBondMovement with carrier_id == this.id AND transit_status == FILED transitions FILED -> CANCELLED (processed created_at ASC)"
          - "each cascaded cancellation appends its own BondObligationLedgerEntry(entry_type=RELEASE, reason_code=CARRIER_SUSPENSION_CASCADE), which in turn recomputes that bond's obligated_amount / available_amount and re-evaluates CustomsBond.status"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: sanction_points recomputation after POST /in-bond/ld-claims/{id}/disposition with action=CANCEL yields sanction_points < 10.0"
        actor: system
        preconditions: ["sanction_points < 10.0"]
        side_effects:
          - "suspension_reason := null"
          - "movements cancelled by the suspension cascade are NOT reinstated"
      - from: ACTIVE
        to: REVOKED
        trigger: "PATCH /in-bond/carriers/{id} with custodial_status=REVOKED"
        actor: CBPOfficer
        preconditions: ["custodial_status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "suspension_reason := PRIVILEGE_REVOKED"
          - "same FILED -> CANCELLED cascade with its ledger releases and bond status re-evaluation"
      - from: SUSPENDED
        to: REVOKED
        trigger: "PATCH /in-bond/carriers/{id} with custodial_status=REVOKED"
        actor: CBPOfficer
        preconditions: ["custodial_status IN {ACTIVE, SUSPENDED}"]
        side_effects: ["as above"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /in-bond/carriers/{id} with custodial_status=ACTIVE"
        actor: CBPOfficer
        preconditions: ["sanction_points < 10.0"]
        side_effects: ["suspension_reason := null"]

  # --- ExaminationHold ------------------------------------------------------
  - entity: ExaminationHold
    state_field: status
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: "(creation)"
        to: OPEN
        trigger: "POST /in-bond/examination-holds, or the system-created SEAL_DISCREPANCY hold"
        actor: CBPOfficer
        preconditions:
          - "movement exists and custody_status NOT IN {RELEASED, GENERAL_ORDER}"
          - "hold_type != SEAL_DISCREPANCY on the public endpoint"
          - "EXAM_NII / EXAM_PHYSICAL: scheduled_start and scheduled_end both present, scheduled_end > scheduled_start, capacity available"
          - "DOCUMENT / PGA: scheduled_start and scheduled_end both null"
        side_effects: ["custody_status := EXAM_HOLD; Port.open_hold_count recomputed; one-time GO grace may apply"]
      - from: OPEN
        to: RELEASED
        trigger: "POST /in-bond/examination-holds/{id}/release"
        actor: CBPOfficer
        preconditions: ["status == OPEN"]
        side_effects:
          - "released_at := clock.now; findings_code := request.findings_code; discrepancy_pieces := request.discrepancy_pieces or 0"
          - "Port.open_hold_count recomputed"
          - "when this was the last OPEN hold on the movement: custody_status EXAM_HOLD -> BONDED, and when transit_status == EXPORTED the movement auto-closes with its RELEASE ledger entry"

  # --- AmendmentRequest (branching) ----------------------------------------
  - entity: AmendmentRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: "(creation)"
        to: SUBMITTED
        trigger: "POST /in-bond/amendment-requests"
        actor: BondedCarrier
        preconditions:
          - "X-User-ID == movement.carrier_id"
          - "expected_movement_version == movement.version"
          - "movement.transit_status IN {FILED, IN_TRANSIT, OVERDUE}"
          - "movement.seal_intact == true OR movement.transit_status == FILED"
          - "EXTENSION: clock.now <= transit_deadline_utc + LATE_EXTENSION_GRACE_DAYS (2) days"
          - "EXTENSION: movement.extension_days_granted + requested_days <= EXTENSION_DAYS_MAX (30)"
          - "DIVERSION: requested_destination_port_code matches an existing Port"
        side_effects:
          - "every other AmendmentRequest on this movement with status == SUBMITTED becomes SUPERSEDED"
          - "increments InBondMovement.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /in-bond/amendment-requests/{id}/decision with decision=APPROVE"
        actor: CBPOfficer
        preconditions:
          - "status == SUBMITTED"
          - "movement.transit_status IN {FILED, IN_TRANSIT, OVERDUE}"
          - "EXTENSION: granted_days present, 1 <= granted_days <= requested_days, movement.extension_days_granted + granted_days <= 30"
        side_effects:
          - "branch DIVERSION: movement.destination_port_id := Port(requested_destination_port_code).id; movement.in_bond_type := requested_in_bond_type when present; deadline_anchor_utc := decided_at (rebase); transit_days_allowed and transit_deadline_utc recomputed by calculations.transit_allowance_and_deadline variant on_diversion_rebase"
          - "branch EXTENSION: movement.extension_days_granted += granted_days; deadline_anchor_utc unchanged (still filed_at); transit_deadline_utc recomputed by variant at_filing"
          - "both branches: resulting_deadline_utc := movement.transit_deadline_utc; movement.transit_status OVERDUE -> IN_TRANSIT when the revival preconditions hold; increments InBondMovement.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /in-bond/amendment-requests/{id}/decision with decision=DENY"
        actor: CBPOfficer
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "decided_by_user_id, decided_at, decision_reason_code recorded"
          - "no field on InBondMovement changes; resulting_deadline_utc stays null; movement.version is NOT incremented"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer AmendmentRequest was created on the same movement"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["decision_reason_code := SUPERSEDED_BY_NEWER_REQUEST"]

  # --- MovementReport -------------------------------------------------------
  - entity: MovementReport
    state_field: status
    initial_state: ACCEPTED
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: "(creation)"
        to: ACCEPTED
        trigger: "POST /in-bond/reports (ARRIVAL, or EXPORT with proof_of_export_ref present)"
        actor: BondedCarrier
        preconditions:
          - "X-User-ID == movement.carrier_id"
          - "report_type allowed for in_bond_type: IT -> ARRIVAL only; TE -> ARRIVAL then EXPORT; IE -> EXPORT only"
          - "movement.custody_status != GENERAL_ORDER"
        side_effects: ["drives the InBondMovement transit_status transition for this report type"]
      - from: "(creation)"
        to: PENDING_PROOF
        trigger: "POST /in-bond/reports with report_type=EXPORT and proof_of_export_ref absent"
        actor: BondedCarrier
        preconditions: ["as above"]
        side_effects:
          - "movement.transit_status and export_reported_at are NOT changed — the export is not perfected"
          - "the movement becomes eligible for a NO_PROOF_OF_EXPORT claim once clock.now > transit_deadline_utc"
      - from: PENDING_PROOF
        to: ACCEPTED
        trigger: "POST /in-bond/reports/{id}/proof"
        actor: BondedCarrier
        preconditions: ["status == PENDING_PROOF", "X-User-ID == movement.carrier_id", "movement.seal_intact == true"]
        side_effects:
          - "proof_of_export_ref := request.proof_of_export_ref"
          - "movement transit_status -> EXPORTED (and auto CLOSED when no OPEN hold exists)"
      - from: PENDING_PROOF
        to: SUPERSEDED
        trigger: "system: a later EXPORT MovementReport is filed on the same movement"
        actor: system
        preconditions: ["status == PENDING_PROOF"]
        side_effects: ["none on InBondMovement"]

  # --- LiquidatedDamagesClaim (cyclic on denial) ---------------------------
  - entity: LiquidatedDamagesClaim
    state_field: status
    initial_state: ISSUED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: "(creation)"
        to: ISSUED
        trigger: "POST /in-bond/ld-claims"
        actor: CBPOfficer
        preconditions:
          - "the claimed violation is present on the movement (see validations priority 12, ERR_NO_VIOLATION_TO_CLAIM)"
          - "no other claim on the same movement with the same claim_type and status IN {ISSUED, PETITIONED, MITIGATED}"
        side_effects:
          - "overdue_days_at_issue and assessed_amount := calculations.liquidated_damages_assessment"
          - "appends BondObligationLedgerEntry(entry_type=INCREASE_LD, amount=+assessed_amount, reason_code=CLAIM_ISSUED)"
          - "recomputes CustomsBond.obligated_amount / available_amount; CustomsBond.status may become SATURATED"
          - "recomputes BondedCarrier.sanction_points (calculations.carrier_sanction_points); at >= 10.0 the carrier machine fires ACTIVE -> SUSPENDED, which itself cascades FILED -> CANCELLED movements and their RELEASE ledger entries"
      - from: ISSUED
        to: PETITIONED
        trigger: "POST /in-bond/petitions"
        actor: BondedCarrier
        preconditions: ["status == ISSUED", "expected_claim_version == claim.version"]
        side_effects:
          - "increments LiquidatedDamagesClaim.version by 1"
          - "any prior MitigationPetition on this claim with status IN {SUBMITTED, SUPPLEMENT_REQUESTED} becomes SUPERSEDED"
      - from: PETITIONED
        to: MITIGATED
        trigger: "POST /in-bond/petitions/{id}/decision with decision=GRANT or decision=PARTIAL_GRANT"
        actor: FPFOfficer
        preconditions:
          - "status == PETITIONED"
          - "X-User-ID != claim.issued_by_officer_id (segregation of duties)"
        side_effects:
          - "mitigated_amount := petition.offer_amount on GRANT, or round_half_up(assessed_amount - (assessed_amount - petition.offer_amount) * PARTIAL_GRANT_FACTOR (0.5), 2) on PARTIAL_GRANT"
          - "appends BondObligationLedgerEntry(entry_type=MITIGATE, amount=-(assessed_amount - mitigated_amount), reason_code=PETITION_GRANTED)"
          - "recomputes CustomsBond.obligated_amount / available_amount; CustomsBond.status re-evaluated"
          - "BondedCarrier.sanction_points is NOT changed by mitigation"
      - from: PETITIONED
        to: ISSUED
        trigger: "POST /in-bond/petitions/{id}/decision with decision=DENY"
        actor: FPFOfficer
        preconditions: ["status == PETITIONED", "X-User-ID != claim.issued_by_officer_id"]
        side_effects: ["no ledger entry; the full assessed_amount stays obligated"]
        note: "Cycle ISSUED -> PETITIONED -> ISSUED; a fresh petition may then be filed against the same claim."
      - from: ISSUED
        to: PAID
        trigger: "POST /in-bond/ld-claims/{id}/disposition with action=PAY"
        actor: BondedCarrier
        preconditions: ["status IN {ISSUED, MITIGATED}", "paid_amount == assessed_amount when status == ISSUED"]
        side_effects:
          - "paid_amount := request.paid_amount"
          - "appends BondObligationLedgerEntry(entry_type=RELEASE_LD, amount=-(assessed_amount), reason_code=CLAIM_PAID)"
          - "recomputes CustomsBond.obligated_amount / available_amount; CustomsBond.status re-evaluated"
          - "BondedCarrier.sanction_points unchanged (a paid violation still counts)"
      - from: MITIGATED
        to: PAID
        trigger: "POST /in-bond/ld-claims/{id}/disposition with action=PAY"
        actor: BondedCarrier
        preconditions: ["status == MITIGATED", "paid_amount == mitigated_amount"]
        side_effects:
          - "paid_amount := request.paid_amount"
          - "appends BondObligationLedgerEntry(entry_type=RELEASE_LD, amount=-mitigated_amount, reason_code=CLAIM_PAID)"
          - "recomputes CustomsBond.obligated_amount / available_amount; CustomsBond.status re-evaluated"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /in-bond/ld-claims/{id}/disposition with action=CANCEL"
        actor: FPFOfficer
        preconditions: ["status IN {ISSUED, PETITIONED, MITIGATED}", "X-User-ID != claim.issued_by_officer_id"]
        side_effects:
          - "cancellation_reason := request.reason_code"
          - "appends BondObligationLedgerEntry(entry_type=RELEASE_LD, amount=-(assessed_amount - coalesce(mitigated_amount_delta, 0.00)), reason_code=CLAIM_CANCELLED) so the net ledger sum for this claim_id becomes exactly 0.00"
          - "recomputes BondedCarrier.sanction_points with this claim excluded; when the result is < 10.0 the carrier machine fires SUSPENDED -> ACTIVE"
          - "any MitigationPetition on this claim with status IN {SUBMITTED, SUPPLEMENT_REQUESTED} becomes SUPERSEDED"
      - from: PETITIONED
        to: CANCELLED
        trigger: "POST /in-bond/ld-claims/{id}/disposition with action=CANCEL"
        actor: FPFOfficer
        preconditions: ["as above"]
        side_effects: ["as above"]
      - from: MITIGATED
        to: CANCELLED
        trigger: "POST /in-bond/ld-claims/{id}/disposition with action=CANCEL"
        actor: FPFOfficer
        preconditions: ["as above"]
        side_effects: ["as above; the RELEASE_LD amount is -(mitigated_amount) because the MITIGATE entry already released the difference"]

  # --- MitigationPetition (cyclic) -----------------------------------------
  - entity: MitigationPetition
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED, SUPERSEDED]
    transitions:
      - from: "(creation)"
        to: SUBMITTED
        trigger: "POST /in-bond/petitions"
        actor: BondedCarrier
        preconditions:
          - "claim.status == ISSUED"
          - "X-User-ID == claim.movement.carrier_id"
          - "expected_claim_version == claim.version"
          - "mitigation_factors is a non-empty set of distinct valid codes"
        side_effects:
          - "round := 1; prior_violation_count, mitigation_pct, net_before_fee, processing_fee, offer_amount := calculations.mitigation_offer_amount variant first_petition"
          - "claim ISSUED -> PETITIONED; increments LiquidatedDamagesClaim.version by 1"
      - from: SUBMITTED
        to: SUPPLEMENT_REQUESTED
        trigger: "POST /in-bond/petitions/{id}/decision with decision=REQUEST_SUPPLEMENT"
        actor: FPFOfficer
        preconditions: ["status == SUBMITTED", "X-User-ID != claim.issued_by_officer_id", "round < MAX_PETITION_ROUNDS (2)"]
        side_effects: ["decision_reason_code recorded; claim stays PETITIONED"]
      - from: SUPPLEMENT_REQUESTED
        to: SUBMITTED
        trigger: "POST /in-bond/petitions/{id}/supplement"
        actor: BondedCarrier
        preconditions: ["status == SUPPLEMENT_REQUESTED", "X-User-ID == claim.movement.carrier_id", "round < MAX_PETITION_ROUNDS (2)"]
        side_effects:
          - "round += 1; mitigation_factors := request.mitigation_factors; narrative_reference := request.narrative_reference"
          - "mitigation_pct, net_before_fee, processing_fee, offer_amount recomputed by calculations.mitigation_offer_amount variant supplemental_petition"
        note: "Cycle SUBMITTED -> SUPPLEMENT_REQUESTED -> SUBMITTED, capped at round 2."
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /in-bond/petitions/{id}/decision with decision=GRANT"
        actor: FPFOfficer
        preconditions: ["status == SUBMITTED", "claim.status == PETITIONED", "X-User-ID != claim.issued_by_officer_id"]
        side_effects: ["claim PETITIONED -> MITIGATED with mitigated_amount := offer_amount and its MITIGATE ledger entry"]
      - from: SUBMITTED
        to: PARTIALLY_GRANTED
        trigger: "POST /in-bond/petitions/{id}/decision with decision=PARTIAL_GRANT"
        actor: FPFOfficer
        preconditions: ["status == SUBMITTED", "claim.status == PETITIONED", "X-User-ID != claim.issued_by_officer_id"]
        side_effects: ["claim PETITIONED -> MITIGATED with mitigated_amount := round_half_up(assessed_amount - (assessed_amount - offer_amount) * 0.5, 2) and its MITIGATE ledger entry"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /in-bond/petitions/{id}/decision with decision=DENY"
        actor: FPFOfficer
        preconditions: ["status == SUBMITTED", "claim.status == PETITIONED", "X-User-ID != claim.issued_by_officer_id"]
        side_effects: ["claim PETITIONED -> ISSUED; no ledger entry"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer MitigationPetition was created on the same claim, or the claim was CANCELLED"
        actor: system
        preconditions: ["status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"]
        side_effects: ["decision_reason_code := SUPERSEDED_BY_NEWER_PETITION or CLAIM_CANCELLED"]
      - from: SUPPLEMENT_REQUESTED
        to: SUPERSEDED
        trigger: "system: a newer MitigationPetition was created on the same claim, or the claim was CANCELLED"
        actor: system
        preconditions: ["status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"]
        side_effects: ["as above"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: amendment-create-stale-movement
    parent_entity: InBondMovement
    write_endpoint: "POST /in-bond/amendment-requests"
    occ_field: "expected_movement_version"
    description: |
      Creating an AmendmentRequest against an InBondMovement whose version has
      advanced since the client last observed it is rejected. A new amendment
      legitimately supersedes any still-SUBMITTED amendment on the movement, so
      the second write would otherwise succeed and silently discard a routing or
      transit-day change the client never saw; the stale-version check forces the
      client to re-read the movement first.
    error_id: ERR_STALE_MOVEMENT_VERSION
    http_status: 412

  - rule_id: petition-create-stale-claim
    parent_entity: LiquidatedDamagesClaim
    write_endpoint: "POST /in-bond/petitions"
    occ_field: "expected_claim_version"
    description: |
      Creating a MitigationPetition against a LiquidatedDamagesClaim whose
      version has advanced since the client last observed it is rejected. A new
      petition legitimately supersedes a prior SUBMITTED or SUPPLEMENT_REQUESTED
      petition on the same claim, so the write would otherwise succeed against a
      claim whose amount or status the client has not re-read.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
#
# Global conventions:
#   * All money is DECIMAL(12,2); every rounding step is round_half_up unless the
#     formula says floor or ceil.
#   * round2(x) means round_half_up(x, 2). round1(x) means round_half_up(x, 1).
#   * "clock.now" is the logical clock (POST /_clock/set_current_utc); its default
#     value before any set call is 2026-08-01T00:00:00Z.
#   * A "day" is exactly 86400 seconds; no calendar or timezone arithmetic is used.
# =============================================================================
calculations:

  # ---------------------------------------------------------------- 1 ------
  - name: transit_allowance_and_deadline
    description: |
      Derives transit_days_allowed and transit_deadline_utc for an InBondMovement
      from the in-bond type, the port-to-port routing, the carrier's current
      sanction posture, and any granted extension days. The anchor the deadline is
      measured from differs between the two variants, which is what makes a
      diversion materially different from an extension.
    trigger: "POST /in-bond/movements (variant at_filing); POST /in-bond/amendment-requests/{id}/decision with decision=APPROVE (variant at_filing for EXTENSION, variant on_diversion_rebase for DIVERSION)"
    inputs:
      - "InBondMovement.in_bond_type"
      - "Port(origin_port_id).region_code"
      - "Port(destination_port_id).region_code"
      - "BondedCarrier.sanction_points (value as of this request, after any recomputation in the same request)"
      - "InBondMovement.extension_days_granted (after the current approval is applied)"
      - "InBondMovement.deadline_anchor_utc"
    algorithm: threshold
    formula: |
      base = BASE_TRANSIT_DAYS[in_bond_type]          # IT 30, TE 30, IE 15
      raw  = base
      if origin.region_code != destination.region_code:
          raw = raw + INTERPORT_LEG_DAYS              # 5
      # sanction throttle — a carrier at or above the throttle threshold gets half
      # the transit window, floored, but never less than MIN_TRANSIT_DAYS
      if carrier.sanction_points >= SANCTION_THROTTLE_THRESHOLD:   # 6.0
          raw = max(MIN_TRANSIT_DAYS, floor(raw * SANCTION_THROTTLE_FACTOR))  # 0.5
      # the ceiling is applied to the *earned* window only; granted extension days
      # are added AFTER the cap and can therefore push the total above MAX
      raw = min(raw, MAX_TRANSIT_DAYS)                # 60
      transit_days_allowed = raw + extension_days_granted
      transit_deadline_utc = deadline_anchor_utc + transit_days_allowed * 86400
    constants:
      BASE_TRANSIT_DAYS_IT: 30
      BASE_TRANSIT_DAYS_TE: 30
      BASE_TRANSIT_DAYS_IE: 15
      INTERPORT_LEG_DAYS: 5
      MIN_TRANSIT_DAYS: 5
      MAX_TRANSIT_DAYS: 60
      SANCTION_THROTTLE_THRESHOLD: 6.0
      SANCTION_THROTTLE_FACTOR: 0.5
      EXTENSION_DAYS_MAX: 30
      LATE_EXTENSION_GRACE_DAYS: 2
    precision: "integer days (floor on the sanction throttle); deadline is an exact UTC instant"
    variants:
      - name: at_filing
        when: "POST /in-bond/movements, and POST /in-bond/amendment-requests/{id}/decision APPROVE where amendment_type == EXTENSION"
        difference: |
          deadline_anchor_utc stays equal to InBondMovement.filed_at for the whole
          life of the movement. An approved extension therefore only lengthens
          transit_days_allowed; the clock still runs from the original filing.
      - name: on_diversion_rebase
        when: "POST /in-bond/amendment-requests/{id}/decision APPROVE where amendment_type == DIVERSION"
        difference: |
          deadline_anchor_utc is REBASED to the decision instant (clock.now) and the
          leg surcharge is re-evaluated against the NEW destination port's region,
          so the same granted-days input yields a different transit_deadline_utc
          than the extension variant would.
      - name: divergence_witness
        when: "documentation only — not selectable"
        difference: |
          M1 = IT, origin region NE, destination region MW, carrier sanction_points
          0.0, extension_days_granted 0, filed_at 2026-08-01T00:00:00Z:
            at_filing               -> 35 days, deadline 2026-09-05T00:00:00Z
          The same movement diverted at 2026-08-20T00:00:00Z to a PSW port:
            on_diversion_rebase     -> 35 days, deadline 2026-09-24T00:00:00Z
          An EXTENSION of 10 days approved at the same instant instead:
            at_filing               -> 45 days, deadline 2026-09-15T00:00:00Z

  # ---------------------------------------------------------------- 2 ------
  - name: movement_bond_obligation
    description: |
      Amount of bond coverage an in-bond movement consumes. Three independent
      components are each rounded to cents BEFORE they are summed, then a floor is
      applied. The per-component rounding is normative: summing the raw products
      and rounding once at the end produces a different answer on realistic inputs.
    trigger: "POST /in-bond/movements (stored as InBondMovement.obligation_amount and never recomputed afterwards)"
    inputs:
      - "InBondMovement.cargo_value"
      - "InBondMovement.gross_weight_kg"
      - "InBondMovement.package_count"
    algorithm: aggregation
    formula: |
      c_value  = round2(cargo_value     * VALUE_RATE)     # 0.0325
      c_weight = round2(gross_weight_kg * WEIGHT_RATE)    # 0.0125
      c_pkg    = round2(package_count   * PACKAGE_RATE)   # 0.1275
      subtotal = c_value + c_weight + c_pkg               # already-rounded addends
      obligation_amount = max(MIN_OBLIGATION, subtotal)   # 25.00
    constants:
      VALUE_RATE: 0.0325
      WEIGHT_RATE: 0.0125
      PACKAGE_RATE: 0.1275
      MIN_OBLIGATION: 25.00
    precision: |
      Each component is rounded to 2 dp with round_half_up before summation; the
      subtotal is NOT re-rounded. Worked witnesses:
        (1234.60, 100.28, 3) -> 40.12 + 1.25 + 0.38 = 41.75
            (round-then-sum = 41.75; sum-then-round would be 41.76 — divergent)
        (500.00,     50.00, 1) -> 16.25 + 0.63 + 0.13 = 17.01 -> floor -> 25.00
        (250000.00, 100.28, 3) -> 8125.00 + 1.25 + 0.38 = 8126.63
    variants: []

  # ---------------------------------------------------------------- 3 ------
  - name: bond_obligation_ledger_balance
    description: |
      CustomsBond.obligated_amount and available_amount are derived — never
      client-supplied — from the append-only BondObligationLedgerEntry stream for
      that bond, replayed in created_at ASC order (ties broken by insertion order
      within a request). Each entry also stores the running balance_after.
    trigger: "every BondObligationLedgerEntry append: movement filing, movement cancellation, movement close, claim issuance, claim mitigation, claim payment, claim cancellation"
    inputs:
      - "BondObligationLedgerEntry.amount for all entries with bond_id == this bond (signed: OBLIGATE and INCREASE_LD positive, RELEASE, RELEASE_LD and MITIGATE negative)"
      - "CustomsBond.limit_amount"
    algorithm: chronological
    formula: |
      balance = 0.00
      for e in entries(bond_id) ordered by created_at ASC:
          balance = round2(balance + e.amount)
          e.balance_after = balance
      obligated_amount = balance
      available_amount = round2(limit_amount - obligated_amount)
      open_movement_count = count(movements where bond_id == this.id
                                  and transit_status in {FILED, IN_TRANSIT, OVERDUE, ARRIVED, EXPORTED})
      status := SATURATED when available_amount <= 0.00 and status was ACTIVE
      status := ACTIVE    when available_amount >  0.00 and status was SATURATED
    constants: {}
    precision: "2 dp, round_half_up on every running step; available_amount may be negative only when a claim pushed the obligation past the limit"
    variants: []

  # ---------------------------------------------------------------- 4 ------
  - name: liquidated_damages_assessment
    description: |
      Assessed damages for a bonded-carrier violation. A per-diem base is scaled by
      a violation-type severity, floored at a statutory minimum, then capped by the
      lesser of the cargo value and the bond limit — so the cap frequently binds and
      the severity multiplier becomes invisible in the final amount.
    trigger: "POST /in-bond/ld-claims (stored as overdue_days_at_issue and assessed_amount)"
    inputs:
      - "LiquidatedDamagesClaim.claim_type"
      - "InBondMovement.transit_deadline_utc"
      - "InBondMovement.arrival_reported_at / export_reported_at / clock.now (the reference instant, see below)"
      - "InBondMovement.cargo_value"
      - "CustomsBond.limit_amount"
    algorithm: threshold
    formula: |
      # reference instant for the overdue measure
      if claim_type == LATE_ARRIVAL:        ref = movement.arrival_reported_at
      elif claim_type == NO_PROOF_OF_EXPORT: ref = clock.now
      elif claim_type == NON_ARRIVAL:       ref = clock.now
      else:                                  ref = clock.now      # SEAL_VIOLATION, UNAUTHORIZED_DIVERSION
      overdue_days_at_issue = overdue_days_measure(movement.transit_deadline_utc, ref)
      severity   = SEVERITY[claim_type]
      chargeable = max(1, overdue_days_at_issue)   # a violation with no overdue time still charges one day
      raw = max(LD_MIN_CLAIM, round2(LD_PER_DIEM * severity * chargeable))
      cap = min(movement.cargo_value, bond.limit_amount)
      assessed_amount = round2(min(raw, cap))
    constants:
      LD_PER_DIEM: 250.00
      LD_MIN_CLAIM: 1000.00
      SEVERITY_LATE_ARRIVAL: 1.0
      SEVERITY_NO_PROOF_OF_EXPORT: 2.0
      SEVERITY_SEAL_VIOLATION: 3.0
      SEVERITY_UNAUTHORIZED_DIVERSION: 3.0
      SEVERITY_NON_ARRIVAL: 4.0
    precision: |
      2 dp round_half_up. Worked witnesses (deadline 2026-09-05T00:00:00Z,
      bond limit 50000.00):
        LATE_ARRIVAL,   ref 2026-09-11T12:00:00Z, cargo 1234.60
            -> overdue 7, raw max(1000.00, 250.00*1.0*7 = 1750.00) = 1750.00,
               cap min(1234.60, 50000.00) = 1234.60, assessed 1234.60  (cap binds)
        NON_ARRIVAL,    ref 2026-09-08T00:00:00Z, cargo 250000.00
            -> overdue 3, raw 250.00*4.0*3 = 3000.00, cap 50000.00,
               assessed 3000.00
        SEAL_VIOLATION, ref 2026-09-08T00:00:00Z, cargo 250000.00
            -> overdue 3, raw 250.00*3.0*3 = 2250.00, assessed 2250.00
        SEAL_VIOLATION, ref 2026-08-05T00:00:00Z (before the deadline), cargo 250000.00
            -> overdue 0, chargeable 1, raw max(1000.00, 750.00) = 1000.00,
               assessed 1000.00  (statutory minimum binds)
    variants: []

  # ---------------------------------------------------------------- 5 ------
  - name: overdue_days_measure
    description: |
      Shared whole-day overdue measure. Any part of a day counts as a full day
      (ceil), and a reference instant at or before the deadline yields exactly 0.
    trigger: "POST /in-bond/compliance-sweeps (InBondMovement.overdue_days); POST /in-bond/ld-claims (overdue_days_at_issue)"
    inputs: ["deadline_utc", "reference_ts"]
    algorithm: threshold
    formula: |
      if reference_ts <= deadline_utc: return 0
      return ceil((reference_ts - deadline_utc) / 86400)
    constants:
      SECONDS_PER_DAY: 86400
    precision: |
      Integer days, ceil. Witnesses against deadline 2026-09-05T00:00:00Z:
        2026-09-05T00:00:00Z -> 0    (boundary, exactly at the deadline)
        2026-09-05T00:00:01Z -> 1
        2026-09-11T12:00:00Z -> 7    (6.5 days -> ceil 7)
        2026-09-12T00:00:00Z -> 7    (exactly 7 days)
    variants: []

  # ---------------------------------------------------------------- 6 ------
  - name: mitigation_offer_amount
    description: |
      The mitigation offer a petition earns. Credits for mitigating factors are
      summed, debited for prior violations, clamped by a round-dependent cap, then
      a processing fee is added back from a tier chosen on the pre-fee net ONLY.
      Every step is order-sensitive: the tier is never re-selected after the fee or
      the final clamp changes the number.
    trigger: "POST /in-bond/petitions (variant first_petition); POST /in-bond/petitions/{id}/supplement (variant supplemental_petition)"
    inputs:
      - "MitigationPetition.mitigation_factors (a set of distinct codes)"
      - "MitigationPetition.round"
      - "LiquidatedDamagesClaim.assessed_amount (the gross)"
      - "prior_violation_count = count(LiquidatedDamagesClaim rows on OTHER movements of the same carrier with status in {ISSUED, PETITIONED, MITIGATED, PAID}), snapshotted onto the petition"
    algorithm: waterfall_allocation
    formula: |
      # step 1 — credits, evaluated in this fixed order, duplicates impossible
      credit = 0.00
      for f in [FIRST_VIOLATION, CARGO_SECURED_INTACT, PROMPT_ARRIVAL_REPORT,
                CBP_ADMIN_DELAY, EXTRAORDINARY_CIRCUMSTANCE]:
          if f in mitigation_factors: credit = credit + CREDIT[f]
      # step 2 — prior-violation debit, never below zero
      credit = max(0.00, credit - prior_violation_count * PRIOR_VIOLATION_DEBIT)
      # step 3 — round-dependent cap
      cap = CAP_FIRST if round == 1 else CAP_SUPPLEMENTAL
      mitigation_pct = min(credit, cap)
      # step 4 — pre-fee net
      net_before_fee = round2(gross * (1 - mitigation_pct))
      # step 5 — fee tier selected from net_before_fee ONLY
      if   net_before_fee <  FEE_TIER1_CEILING: processing_fee = FEE_TIER1_FLAT    # net < 2000 -> 100.00
      elif net_before_fee <  FEE_TIER2_CEILING: processing_fee = FEE_TIER2_FLAT    # 2000 <= net < 10000 -> 250.00
      else:                                     processing_fee = round2(net_before_fee * FEE_TIER3_RATE)
      # step 6 — the offer can never exceed the gross
      offer_amount = round2(min(gross, net_before_fee + processing_fee))
    constants:
      CREDIT_FIRST_VIOLATION: 0.20
      CREDIT_CARGO_SECURED_INTACT: 0.15
      CREDIT_PROMPT_ARRIVAL_REPORT: 0.10
      CREDIT_CBP_ADMIN_DELAY: 0.25
      CREDIT_EXTRAORDINARY_CIRCUMSTANCE: 0.30
      PRIOR_VIOLATION_DEBIT: 0.05
      CAP_FIRST: 0.50
      CAP_SUPPLEMENTAL: 0.75
      FEE_TIER1_CEILING: 2000.00
      FEE_TIER1_FLAT: 100.00
      FEE_TIER2_CEILING: 10000.00
      FEE_TIER2_FLAT: 250.00
      FEE_TIER3_RATE: 0.025
      MAX_PETITION_ROUNDS: 2
      PARTIAL_GRANT_FACTOR: 0.5
    precision: |
      mitigation_pct carries 2 dp exactly as composed from the constants; money is
      2 dp round_half_up. Worked witnesses with gross 1234.60,
      prior_violation_count 0, factors [FIRST_VIOLATION, CARGO_SECURED_INTACT,
      CBP_ADMIN_DELAY, EXTRAORDINARY_CIRCUMSTANCE] (credit 0.90):
        round 1 -> pct min(0.90, 0.50) = 0.50, net 617.30, fee 100.00, offer 717.30
        round 2 -> pct min(0.90, 0.75) = 0.75, net 308.65, fee 100.00, offer 408.65
      A PARTIAL_GRANT on the round-1 offer yields
        mitigated_amount = round2(1234.60 - (1234.60 - 717.30) * 0.5) = 975.95
    variants:
      - name: first_petition
        when: "MitigationPetition.round == 1 (POST /in-bond/petitions)"
        difference: "cap = CAP_FIRST (0.50)"
      - name: supplemental_petition
        when: "MitigationPetition.round == 2 (POST /in-bond/petitions/{id}/supplement)"
        difference: |
          cap = CAP_SUPPLEMENTAL (0.75). Same factors and same gross therefore
          produce a strictly smaller offer than the first round whenever the raw
          credit exceeds 0.50.

  # ---------------------------------------------------------------- 7 ------
  - name: carrier_sanction_points
    description: |
      The carrier's decayed violation score. Each countable claim contributes
      type-weighted points multiplied by an age-bucket decay factor measured from
      the claim's issued_at to clock.now; the total is rounded to one decimal and
      capped. Two thresholds read off this single number: the transit throttle and
      automatic custodial suspension.
    trigger: "POST /in-bond/ld-claims; POST /in-bond/ld-claims/{id}/disposition; POST /in-bond/compliance-sweeps"
    inputs:
      - "all LiquidatedDamagesClaim rows whose movement.carrier_id == this carrier and whose status IN {ISSUED, PETITIONED, MITIGATED, PAID} (CANCELLED claims are excluded)"
      - "each claim's claim_type and issued_at"
      - "clock.now"
    algorithm: decay_function
    formula: |
      raw = 0.0
      for c in countable_claims:
          age_days = floor((clock.now - c.issued_at) / 86400)
          if   age_days <=  90: factor = DECAY_FRESH        # 1.0
          elif age_days <= 180: factor = DECAY_RECENT       # 0.75
          elif age_days <= 365: factor = DECAY_STALE        # 0.5
          else:                 factor = DECAY_EXPIRED      # 0.0
          raw = raw + POINTS[c.claim_type] * factor
      sanction_points = min(SANCTION_POINTS_CAP, round1(raw))
      # thresholds read off the same number
      #   >= SANCTION_THROTTLE_THRESHOLD  (6.0)  -> halved transit window
      #   >= SANCTION_SUSPENSION_THRESHOLD (10.0) -> custodial_status SUSPENDED
    constants:
      POINTS_LATE_ARRIVAL: 2
      POINTS_NO_PROOF_OF_EXPORT: 3
      POINTS_SEAL_VIOLATION: 4
      POINTS_UNAUTHORIZED_DIVERSION: 4
      POINTS_NON_ARRIVAL: 6
      DECAY_FRESH: 1.0
      DECAY_RECENT: 0.75
      DECAY_STALE: 0.5
      DECAY_EXPIRED: 0.0
      SANCTION_POINTS_CAP: 12.0
      SANCTION_THROTTLE_THRESHOLD: 6.0
      SANCTION_SUSPENSION_THRESHOLD: 10.0
    precision: |
      1 dp round_half_up, capped at 12.0. Witnesses at clock.now
      2026-09-12T00:00:00Z: a SEAL_VIOLATION issued 2026-09-01 (11 days, fresh)
      contributes 4.0; a NON_ARRIVAL issued 2026-09-01 contributes 6.0, so the two
      together give 10.0 -> automatic suspension. Cancelling the NON_ARRIVAL claim
      recomputes to 4.0 -> the carrier returns to ACTIVE.
    variants: []

  # ---------------------------------------------------------------- 8 ------
  - name: general_order_deadline
    description: |
      When arrived merchandise must be entered before it goes to a general-order
      warehouse. The window is measured from the arrival report, and a single
      one-time grace period is added the first time an examination hold opens while
      the movement is ARRIVED — the grace is never granted twice.
    trigger: "POST /in-bond/reports with report_type=ARRIVAL (initial value); POST /in-bond/examination-holds and the system SEAL_DISCREPANCY hold (one-time grace)"
    inputs:
      - "InBondMovement.arrival_reported_at"
      - "InBondMovement.go_grace_applied"
      - "InBondMovement.transit_status"
    algorithm: threshold
    formula: |
      # at arrival
      go_deadline_utc = arrival_reported_at + GO_DAYS * 86400
      go_grace_applied = false
      # when a hold opens while transit_status == ARRIVED
      if transit_status == ARRIVED and go_grace_applied == false:
          go_deadline_utc  = go_deadline_utc + GO_HOLD_GRACE_DAYS * 86400
          go_grace_applied = true
      # the sweep sends the movement to general order when
      #   transit_status == ARRIVED and clock.now >= go_deadline_utc
      #   and Port(destination_port_id).go_warehouse_available == true
    constants:
      GO_DAYS: 15
      GO_HOLD_GRACE_DAYS: 5
    precision: |
      Exact UTC instants. Witness: arrival 2026-08-10T00:00:00Z ->
      go_deadline_utc 2026-08-25T00:00:00Z; first hold opened while ARRIVED ->
      2026-08-30T00:00:00Z with go_grace_applied true; a second hold leaves it at
      2026-08-30T00:00:00Z.
    variants: []

  # ---------------------------------------------------------------- 9 ------
  - name: exam_window_occupancy
    description: |
      Examination-bay occupancy at a port. Scheduled examination windows are
      half-open intervals [scheduled_start, scheduled_end): two windows that merely
      touch at an endpoint do NOT conflict. A new scheduled hold is refused when the
      number of already-OPEN scheduled holds overlapping its window has reached the
      port's exam_capacity_slots.
    trigger: "POST /in-bond/examination-holds where hold_type IN {EXAM_NII, EXAM_PHYSICAL}"
    inputs:
      - "candidate scheduled_start, scheduled_end"
      - "all ExaminationHold rows with port_id == candidate.port_id, status == OPEN, hold_type IN {EXAM_NII, EXAM_PHYSICAL}"
      - "Port.exam_capacity_slots"
    algorithm: interval_merge
    formula: |
      overlap(a, b) = a.scheduled_start < b.scheduled_end
                  and b.scheduled_start < a.scheduled_end      # half-open
      occupancy = count(h in open_scheduled_holds_at_port where overlap(h, candidate))
      if occupancy >= port.exam_capacity_slots: reject ERR_EXAM_CAPACITY_EXCEEDED
      # DOCUMENT and PGA holds carry no window and are never counted
    constants: {}
    precision: |
      Instant comparison, strict inequalities on both sides. Witness at a port with
      exam_capacity_slots 1 and an OPEN window [2026-08-05T08:00:00Z,
      2026-08-05T12:00:00Z): a candidate [2026-08-05T12:00:00Z,
      2026-08-05T16:00:00Z) has occupancy 0 and is accepted, while a candidate
      [2026-08-05T11:59:59Z, 2026-08-05T16:00:00Z) has occupancy 1 and is refused.
    variants: []

  # --------------------------------------------------------------- 10 ------
  - name: bond_selection_policy
    description: |
      Deterministic selector that picks which of a carrier's bonds underwrites a new
      movement when the filing does not name one. Eligibility is filtered first, then
      the survivors are ranked; an empty candidate set is an error rather than a
      silent skip.
    trigger: "POST /in-bond/movements when bond_id is omitted"
    inputs:
      - "all CustomsBond rows with carrier_id == the filing carrier"
      - "the movement's computed obligation_amount and transit_deadline_utc"
      - "clock.now"
    algorithm: topological
    formula: |
      # eligibility filter (all must hold)
      #   status == ACTIVE
      #   effective_date <= clock.now
      #   expiry_date >= transit_deadline_utc + BOND_COVERAGE_MARGIN_DAYS * 86400
      #   available_amount >= obligation_amount
      #   bond_type == SINGLE_TRANSACTION additionally requires no closed-interval
      #     window collision with an existing open movement on that bond
      #     (same test as ERR_STB_WINDOW_CONFLICT, validations priority 13)
      # ranking of survivors, first row wins
      #   1. bond_type CONTINUOUS before SINGLE_TRANSACTION
      #   2. available_amount DESC
      #   3. created_at ASC
      # empty survivor set -> ERR_NO_ELIGIBLE_BOND (422)
    constants:
      BOND_COVERAGE_MARGIN_DAYS: 3
    precision: "exact decimal comparison on available_amount; ties are broken by created_at ASC and never by id"
    variants: []

# =============================================================================
# §1.4 Validation Rules — evaluated strictly in ascending priority order.
# The FIRST rule that fails determines the response; no later rule may mask an
# earlier one, and no rule may be evaluated out of band.
# =============================================================================
validations:

  # ---- band 1: authentication -------------------------------------------
  - priority: 1
    category: auth
    check: "X-Role header present and equal to one of BondedCarrier, CBPOfficer, FPFOfficer, SuretyAgent, and X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Checked before anything else, including path-parameter existence."

  # ---- band 2: role authorization ---------------------------------------
  - priority: 2
    category: auth
    check: "the caller's X-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role gate only; identity binding is band 3."

  # ---- band 3: ownership / identity binding -----------------------------
  - priority: 3
    category: auth
    check: "for X-Role == BondedCarrier: X-User-ID equals the carrier_id of the InBondMovement (or of the movement behind the report, amendment, claim or petition) being acted on, and equals request.carrier_id on POST /in-bond/movements"
    error_id: ERR_NOT_MOVEMENT_CARRIER
    http_status: 403
    applies_to: ["POST /in-bond/movements", "POST /in-bond/movements/{id}/departure", "POST /in-bond/movements/{id}/cancellation", "POST /in-bond/seal-events", "POST /in-bond/amendment-requests", "POST /in-bond/reports", "POST /in-bond/reports/{id}/proof", "POST /in-bond/petitions", "POST /in-bond/petitions/{id}/supplement", "POST /in-bond/ld-claims/{id}/disposition"]
    description: "A carrier can only ever touch its own movements; ordered before ERR_INVALID_REQUEST so a bad payload never leaks another carrier's data."
  - priority: 3
    category: auth
    check: "for X-Role == SuretyAgent: X-User-ID equals the CustomsBond id in the path"
    error_id: ERR_NOT_BOND_SURETY
    http_status: 403
    applies_to: ["PATCH /in-bond/bonds/{id}"]
    description: "SuretyAgent is entity_backed:CustomsBond — the user id IS the bond id it administers."

  # ---- band 4: segregation of duties ------------------------------------
  - priority: 4
    category: auth
    check: "the acting FPFOfficer's X-User-ID differs from LiquidatedDamagesClaim.issued_by_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /in-bond/petitions/{id}/decision", "POST /in-bond/ld-claims/{id}/disposition"]
    description: "The officer who issued a claim may never decide its petition, grant mitigation, or cancel it."
  - priority: 4
    category: auth
    check: "the acting CBPOfficer's X-User-ID differs from ExaminationHold.placed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /in-bond/examination-holds/{id}/release"]
    description: "The officer who placed an examination hold may not release it."

  # ---- band 5: request shape --------------------------------------------
  - priority: 5
    category: input
    check: "all required body fields present with the declared type; enum values in range; money >= 0 with at most 2 decimals; integers >= 0; datetimes ISO-8601 UTC; unknown fields ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Pure payload shape. Includes cargo_value > 0, gross_weight_kg > 0, package_count >= 1, limit_amount > 0, requested_days >= 1, port_code exactly 4 digits, irs_number non-empty."
  - priority: 5
    category: input
    check: "limit between 1 and 100 and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: ["GET /in-bond/bonds", "GET /in-bond/movements", "GET /in-bond/ledger-entries", "GET /in-bond/examination-holds", "GET /in-bond/reports", "GET /in-bond/ld-claims", "GET /in-bond/compliance-sweeps"]
    description: "Defaults limit=10, offset=0."

  # ---- band 6: existence ------------------------------------------------
  - priority: 6
    category: existence
    check: "BondedCarrier referenced by path id or body carrier_id exists"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/carriers/{id}", "PATCH /in-bond/carriers/{id}", "POST /in-bond/bonds", "POST /in-bond/movements"]
    description: ""
  - priority: 6
    category: existence
    check: "CustomsBond referenced by path id or body bond_id exists"
    error_id: ERR_BOND_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/bonds/{id}", "PATCH /in-bond/bonds/{id}", "POST /in-bond/movements"]
    description: ""
  - priority: 6
    category: existence
    check: "Port referenced by path id, body port_id, origin_port_id, destination_port_id or requested_destination_port_code exists"
    error_id: ERR_PORT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/ports/{id}", "POST /in-bond/movements", "POST /in-bond/examination-holds", "POST /in-bond/reports", "POST /in-bond/amendment-requests"]
    description: ""
  - priority: 6
    category: existence
    check: "InBondMovement referenced by path id or body movement_id exists"
    error_id: ERR_MOVEMENT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/movements/{id}", "GET /in-bond/movements/{id}/seal-events", "GET /in-bond/movements/{id}/amendment-requests", "POST /in-bond/movements/{id}/departure", "POST /in-bond/movements/{id}/cancellation", "POST /in-bond/movements/{id}/release", "POST /in-bond/seal-events", "POST /in-bond/examination-holds", "POST /in-bond/amendment-requests", "POST /in-bond/reports", "POST /in-bond/ld-claims"]
    description: "Also covers predecessor_movement_id on POST /in-bond/movements."
  - priority: 6
    category: existence
    check: "ExaminationHold referenced by path id exists"
    error_id: ERR_HOLD_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/examination-holds/{id}", "POST /in-bond/examination-holds/{id}/release"]
    description: ""
  - priority: 6
    category: existence
    check: "AmendmentRequest referenced by path id exists"
    error_id: ERR_AMENDMENT_NOT_FOUND
    http_status: 404
    applies_to: ["POST /in-bond/amendment-requests/{id}/decision"]
    description: ""
  - priority: 6
    category: existence
    check: "MovementReport referenced by path id exists"
    error_id: ERR_REPORT_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/reports/{id}", "POST /in-bond/reports/{id}/proof"]
    description: ""
  - priority: 6
    category: existence
    check: "LiquidatedDamagesClaim referenced by path id or body claim_id exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: ["GET /in-bond/ld-claims/{id}", "GET /in-bond/ld-claims/{id}/petitions", "POST /in-bond/ld-claims/{id}/disposition", "POST /in-bond/petitions"]
    description: ""
  - priority: 6
    category: existence
    check: "MitigationPetition referenced by path id exists"
    error_id: ERR_PETITION_NOT_FOUND
    http_status: 404
    applies_to: ["POST /in-bond/petitions/{id}/supplement", "POST /in-bond/petitions/{id}/decision"]
    description: ""

  # ---- band 7: uniqueness ----------------------------------------------
  - priority: 7
    category: business_safety
    check: "irs_number is not already used by another BondedCarrier"
    error_id: ERR_DUPLICATE_IRS_NUMBER
    http_status: 409
    applies_to: ["POST /in-bond/carriers"]
    description: ""
  - priority: 7
    category: business_safety
    check: "port_code is not already used by another Port"
    error_id: ERR_DUPLICATE_PORT_CODE
    http_status: 409
    applies_to: ["POST /in-bond/ports"]
    description: ""

  # ---- band 8: optimistic concurrency ----------------------------------
  - priority: 8
    category: state
    check: "expected_movement_version == InBondMovement.version"
    error_id: ERR_STALE_MOVEMENT_VERSION
    http_status: 412
    applies_to: ["POST /in-bond/amendment-requests"]
    description: "§1.2.1 rule amendment-create-stale-movement. Checked after existence, before any state check."
  - priority: 8
    category: state
    check: "expected_claim_version == LiquidatedDamagesClaim.version"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: ["POST /in-bond/petitions"]
    description: "§1.2.1 rule petition-create-stale-claim."

  # ---- band 9: the acted-on entity's own state -------------------------
  - priority: 9
    category: state
    check: "InBondMovement.transit_status / custody_status admits the requested transition"
    error_id: ERR_MOVEMENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /in-bond/movements/{id}/departure", "POST /in-bond/movements/{id}/cancellation", "POST /in-bond/movements/{id}/release", "POST /in-bond/seal-events", "POST /in-bond/amendment-requests", "POST /in-bond/reports", "POST /in-bond/examination-holds"]
    description: "Includes a second ARRIVAL report on an already-ARRIVED movement and departure of a movement that already left."
  - priority: 9
    category: state
    check: "ExaminationHold.status == OPEN"
    error_id: ERR_HOLD_INVALID_STATE
    http_status: 409
    applies_to: ["POST /in-bond/examination-holds/{id}/release"]
    description: ""
  - priority: 9
    category: state
    check: "AmendmentRequest.status == SUBMITTED"
    error_id: ERR_AMENDMENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /in-bond/amendment-requests/{id}/decision"]
    description: "A SUPERSEDED, APPROVED or DENIED amendment can never be decided again."
  - priority: 9
    category: state
    check: "MovementReport.status == PENDING_PROOF"
    error_id: ERR_REPORT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /in-bond/reports/{id}/proof"]
    description: ""
  - priority: 9
    category: state
    check: "LiquidatedDamagesClaim.status admits the requested action (PAY requires ISSUED or MITIGATED; CANCEL requires ISSUED, PETITIONED or MITIGATED; a petition requires ISSUED)"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: ["POST /in-bond/ld-claims/{id}/disposition", "POST /in-bond/petitions"]
    description: ""
  - priority: 9
    category: state
    check: "MitigationPetition.status admits the requested action (decision requires SUBMITTED; supplement requires SUPPLEMENT_REQUESTED)"
    error_id: ERR_PETITION_INVALID_STATE
    http_status: 409
    applies_to: ["POST /in-bond/petitions/{id}/decision", "POST /in-bond/petitions/{id}/supplement"]
    description: ""
  - priority: 9
    category: state
    check: "the requested CustomsBond.status transition is one of ACTIVE->SUSPENDED, SATURATED->SUSPENDED, SUSPENDED->ACTIVE; EXPIRED is terminal and SATURATED / ACTIVE are system-derived"
    error_id: ERR_BOND_INVALID_STATE
    http_status: 409
    applies_to: ["PATCH /in-bond/bonds/{id}"]
    description: ""
  - priority: 9
    category: state
    check: "the requested BondedCarrier.custodial_status transition is one of ACTIVE->REVOKED, SUSPENDED->REVOKED, SUSPENDED->ACTIVE; REVOKED is terminal"
    error_id: ERR_CARRIER_INVALID_STATE
    http_status: 409
    applies_to: ["PATCH /in-bond/carriers/{id}"]
    description: "SUSPENDED->ACTIVE additionally requires sanction_points < 10.0."

  # ---- band 10: other entities' state ----------------------------------
  - priority: 10
    category: state
    check: "BondedCarrier.custodial_status == ACTIVE"
    error_id: ERR_CARRIER_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /in-bond/movements", "POST /in-bond/movements/{id}/departure"]
    description: "A SUSPENDED or REVOKED carrier may not file or depart, but may still report arrival and petition."
  - priority: 10
    category: state
    check: "CustomsBond.status == ACTIVE"
    error_id: ERR_BOND_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /in-bond/movements", "POST /in-bond/movements/{id}/departure"]
    description: "SATURATED, SUSPENDED and EXPIRED all fail here — strictly BEFORE the ERR_BOND_INSUFFICIENT fiscal check."
  - priority: 10
    category: state
    check: "the movement named by predecessor_movement_id has transit_status == ARRIVED and belongs to the same carrier"
    error_id: ERR_PREDECESSOR_NOT_ARRIVED
    http_status: 409
    applies_to: ["POST /in-bond/movements"]
    description: "Onward IT/TE legs may only be filed against an arrived predecessor movement."
  - priority: 10
    category: state
    check: "InBondMovement.custody_status != GENERAL_ORDER"
    error_id: ERR_MOVEMENT_IN_GENERAL_ORDER
    http_status: 409
    applies_to: ["POST /in-bond/movements/{id}/release", "POST /in-bond/reports", "POST /in-bond/reports/{id}/proof", "POST /in-bond/amendment-requests"]
    description: "General order is terminal custody — nothing but a claim can be filed afterwards."

  # ---- band 11: cargo safety / seal integrity --------------------------
  - priority: 11
    category: business_safety
    check: "InBondMovement.seal_number is not null (a seal was applied at departure)"
    error_id: ERR_SEAL_NOT_APPLIED
    http_status: 409
    applies_to: ["POST /in-bond/seal-events", "POST /in-bond/reports"]
    description: "Only event_type APPLIED is allowed while seal_number is null, and only on the departure path."
  - priority: 11
    category: business_safety
    check: "InBondMovement.seal_intact == true"
    error_id: ERR_SEAL_INTEGRITY_UNRESOLVED
    http_status: 409
    applies_to: ["POST /in-bond/movements/{id}/release", "POST /in-bond/reports", "POST /in-bond/reports/{id}/proof", "POST /in-bond/amendment-requests"]
    description: "A broken seal must be resolved by a REPLACED SealEvent before the cargo can move on, be reported, be diverted or be released. Ordered ABOVE the temporal band so a compromised container is refused even when the paperwork is timely."
  - priority: 11
    category: business_safety
    check: "no ExaminationHold with movement_id == this movement and status == OPEN"
    error_id: ERR_HOLD_OPEN
    http_status: 409
    applies_to: ["POST /in-bond/movements/{id}/release"]
    description: ""
  - priority: 11
    category: business_safety
    check: "an ARRIVAL report at a port other than destination_port_id is only accepted when the reporting port is in the same region_code as the destination port, or an APPROVED DIVERSION already redirected the movement to that port"
    error_id: ERR_UNAUTHORIZED_DIVERSION
    http_status: 422
    applies_to: ["POST /in-bond/reports"]
    description: "An out-of-region arrival without an approved diversion is an unauthorized diversion, not a mere discrepancy."

  # ---- band 12: temporal ----------------------------------------------
  - priority: 12
    category: business_temporal
    check: "for amendment_type == EXTENSION: clock.now <= transit_deadline_utc + 2 days"
    error_id: ERR_TRANSIT_DEADLINE_PASSED
    http_status: 422
    applies_to: ["POST /in-bond/amendment-requests"]
    description: "The extension grace window closes 2 days after the deadline; DIVERSION requests are not subject to it."
  - priority: 12
    category: business_temporal
    check: "the selected or supplied CustomsBond's expiry_date >= transit_deadline_utc + 3 days and effective_date <= clock.now"
    error_id: ERR_BOND_COVERAGE_GAP
    http_status: 422
    applies_to: ["POST /in-bond/movements"]
    description: "A bond that lapses mid-transit cannot underwrite the movement even if it is ACTIVE and has room today."
  - priority: 12
    category: business_temporal
    check: "for hold_type IN {EXAM_NII, EXAM_PHYSICAL}: scheduled_start and scheduled_end are both present and scheduled_end > scheduled_start; for hold_type IN {DOCUMENT, PGA}: both are absent"
    error_id: ERR_EXAM_WINDOW_INVALID
    http_status: 422
    applies_to: ["POST /in-bond/examination-holds"]
    description: ""
  - priority: 12
    category: business_temporal
    check: "the requested current_utc is greater than or equal to the current logical clock value"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: ["POST /_clock/set_current_utc"]
    description: "The logical clock never runs backwards."

  # ---- band 13: business constraints ----------------------------------
  - priority: 13
    category: business_safety
    check: "route shape matches in_bond_type: IE requires destination_port_id == origin_port_id; IT and TE require destination_port_id != origin_port_id"
    error_id: ERR_ROUTE_TYPE_MISMATCH
    http_status: 422
    applies_to: ["POST /in-bond/movements", "POST /in-bond/amendment-requests"]
    description: "Also enforced against requested_in_bond_type + requested_destination_port_code on a DIVERSION request."
  - priority: 13
    category: business_safety
    check: "a SINGLE_TRANSACTION CustomsBond has no closed-interval [filed_at, transit_deadline_utc] collision with another movement on the same bond whose transit_status IN {FILED, IN_TRANSIT, OVERDUE, ARRIVED, EXPORTED}"
    error_id: ERR_STB_WINDOW_CONFLICT
    http_status: 409
    applies_to: ["POST /in-bond/movements"]
    description: "CLOSED intervals: two windows that merely touch at an endpoint DO collide, unlike the half-open examination windows."
  - priority: 13
    category: business_safety
    check: "the count of OPEN scheduled examination holds at the port overlapping the candidate window is < Port.exam_capacity_slots"
    error_id: ERR_EXAM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /in-bond/examination-holds"]
    description: "HALF-OPEN intervals [start, end): adjacent windows sharing an endpoint do not consume the same slot."
  - priority: 13
    category: business_safety
    check: "InBondMovement.extension_days_granted + requested_days (on submit) or + granted_days (on approval) <= 30"
    error_id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /in-bond/amendment-requests", "POST /in-bond/amendment-requests/{id}/decision"]
    description: ""
  - priority: 13
    category: business_safety
    check: "for decision == APPROVE on an EXTENSION: granted_days present and 1 <= granted_days <= requested_days"
    error_id: ERR_GRANTED_DAYS_INVALID
    http_status: 422
    applies_to: ["POST /in-bond/amendment-requests/{id}/decision"]
    description: "An officer may grant fewer days than requested but never more."
  - priority: 13
    category: business_safety
    check: "MitigationPetition.round < 2"
    error_id: ERR_PETITION_ROUND_LIMIT
    http_status: 422
    applies_to: ["POST /in-bond/petitions/{id}/supplement", "POST /in-bond/petitions/{id}/decision"]
    description: "REQUEST_SUPPLEMENT and supplement filing are both refused once round 2 has been reached."
  - priority: 13
    category: business_safety
    check: "hold_type != SEAL_DISCREPANCY on the public endpoint"
    error_id: ERR_HOLD_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: ["POST /in-bond/examination-holds"]
    description: "SEAL_DISCREPANCY holds are only ever created by the system from a BROKEN_UNAUTHORIZED seal event."
  - priority: 13
    category: business_safety
    check: "report_type is allowed for the movement's in_bond_type: IT -> ARRIVAL only; TE -> ARRIVAL then EXPORT; IE -> EXPORT only"
    error_id: ERR_REPORT_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: ["POST /in-bond/reports"]
    description: "An EXPORT report on an IT movement is refused here, not by the state machine."
  - priority: 13
    category: business_safety
    check: "no other LiquidatedDamagesClaim on the same movement with the same claim_type and status IN {ISSUED, PETITIONED, MITIGATED}"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: ["POST /in-bond/ld-claims"]
    description: "A PAID or CANCELLED claim of the same type does not block a new one."
  - priority: 13
    category: business_safety
    check: |
      the claimed violation actually exists on the movement:
        LATE_ARRIVAL          -> arrival_reported_at is not null and arrival_reported_at > transit_deadline_utc
        NON_ARRIVAL           -> transit_status == OVERDUE and arrival_reported_at is null
        NO_PROOF_OF_EXPORT    -> a MovementReport of type EXPORT with status == PENDING_PROOF exists and clock.now > transit_deadline_utc
        SEAL_VIOLATION        -> a SealEvent with event_type == BROKEN_UNAUTHORIZED exists
        UNAUTHORIZED_DIVERSION-> diversion_flag == true and no APPROVED DIVERSION AmendmentRequest exists on the movement
    error_id: ERR_NO_VIOLATION_TO_CLAIM
    http_status: 422
    applies_to: ["POST /in-bond/ld-claims"]
    description: "Officers cannot manufacture claims; every claim_type has a witness condition."
  - priority: 13
    category: business_safety
    check: "mitigation_factors is a non-empty array of distinct valid codes"
    error_id: ERR_MITIGATION_FACTOR_INVALID
    http_status: 422
    applies_to: ["POST /in-bond/petitions", "POST /in-bond/petitions/{id}/supplement"]
    description: "Duplicated codes are rejected rather than silently de-duplicated, so credit can never be double counted."

  # ---- band 14: fiscal -------------------------------------------------
  - priority: 14
    category: business_fiscal
    check: "computed obligation_amount <= CustomsBond.available_amount"
    error_id: ERR_BOND_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /in-bond/movements"]
    description: "Equality is allowed and drives the bond to SATURATED; the check is strictly AFTER ERR_BOND_NOT_ACTIVE."
  - priority: 14
    category: business_fiscal
    check: "when bond_id is omitted, calculations.bond_selection_policy yields at least one eligible bond"
    error_id: ERR_NO_ELIGIBLE_BOND
    http_status: 422
    applies_to: ["POST /in-bond/movements"]
    description: ""
  - priority: 14
    category: business_fiscal
    check: "paid_amount equals mitigated_amount when the claim is MITIGATED, otherwise equals assessed_amount"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /in-bond/ld-claims/{id}/disposition"]
    description: "Partial payments are not accepted."

# =============================================================================
# §1.5 API Endpoint Table
#
# `input:` lists body fields for writes and query parameters for reads; a
# trailing `?` marks an optional field. All list reads accept `limit?` and
# `offset?` and return the pagination envelope of §1.0. Every request carries
# `X-Role` and `X-User-ID`.
# =============================================================================
endpoints:

  # ---------------------------- BondedCarrier -----------------------------
  - method: POST
    path: /in-bond/carriers
    description: "Register a bonded carrier (custodian of bonded merchandise)."
    roles: [CBPOfficer]
    status: 201
    input: [name, irs_number]
    output: BondedCarrier
    side_effects:
      - "custodial_status := ACTIVE, sanction_points := 0.0, overdue_movement_count := 0, open_claim_count := 0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_IRS_NUMBER]

  - method: GET
    path: /in-bond/carriers/{id}
    description: "Read a bonded carrier including its live sanction posture."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: BondedCarrier
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CARRIER_NOT_FOUND]

  - method: PATCH
    path: /in-bond/carriers/{id}
    description: "Revoke or reinstate custodial privileges."
    roles: [CBPOfficer]
    status: 200
    input: [custodial_status, "reason_code?"]
    output: BondedCarrier
    side_effects:
      - "REVOKED: suspension_reason := PRIVILEGE_REVOKED and every FILED movement of the carrier is cancelled, each appending a RELEASE ledger entry and recomputing its bond"
      - "ACTIVE (from SUSPENDED): suspension_reason := null; previously cancelled movements are NOT reinstated"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CARRIER_NOT_FOUND, ERR_CARRIER_INVALID_STATE]

  # ------------------------------ CustomsBond -----------------------------
  - method: POST
    path: /in-bond/bonds
    description: "Underwrite a single-transaction or continuous customs bond for a carrier."
    roles: [CBPOfficer]
    status: 201
    input: [carrier_id, bond_type, limit_amount, effective_date, expiry_date, surety_code]
    output: CustomsBond
    side_effects:
      - "status := ACTIVE, obligated_amount := 0.00, available_amount := limit_amount, open_movement_count := 0"
      - "the created bond's id is also the X-User-ID of the SuretyAgent that administers it"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_CARRIER_NOT_FOUND]

  - method: GET
    path: /in-bond/bonds/{id}
    description: "Read a bond with its derived obligated_amount and available_amount."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: CustomsBond
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BOND_NOT_FOUND]

  - method: GET
    path: /in-bond/bonds
    description: "List bonds, filterable by carrier, type and status."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["carrier_id?", "bond_type?", "status?", "limit?", "offset?"]
    output: CustomsBond[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  - method: PATCH
    path: /in-bond/bonds/{id}
    description: "Surety action: suspend or reinstate the bond, or raise/lower its limit."
    roles: [SuretyAgent]
    status: 200
    input: ["status?", "limit_amount?"]
    output: CustomsBond
    side_effects:
      - "available_amount recomputed from limit_amount - obligated_amount"
      - "ACTIVE <-> SATURATED re-derived immediately from the new available_amount"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_BOND_SURETY, ERR_INVALID_REQUEST, ERR_BOND_NOT_FOUND, ERR_BOND_INVALID_STATE]

  # --------------------------------- Port ---------------------------------
  - method: POST
    path: /in-bond/ports
    description: "Register a port of entry with its examination-bay capacity."
    roles: [CBPOfficer]
    status: 201
    input: [port_code, name, region_code, exam_capacity_slots, "go_warehouse_available?"]
    output: Port
    side_effects: ["open_hold_count := 0; go_warehouse_available defaults to true"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_PORT_CODE]

  - method: GET
    path: /in-bond/ports/{id}
    description: "Read a port with its live open_hold_count."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: Port
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PORT_NOT_FOUND]

  # ----------------------------- InBondMovement ---------------------------
  - method: POST
    path: /in-bond/movements
    description: |
      File an electronic in-bond movement (IT, TE or IE). Computes the bond
      obligation, selects the underwriting bond when bond_id is omitted, and
      derives the transit window and deadline.
    roles: [BondedCarrier]
    status: 201
    input: [carrier_id, in_bond_type, origin_port_id, destination_port_id, manifest_reference, cargo_value, gross_weight_kg, package_count, "bond_id?", "predecessor_movement_id?"]
    output: InBondMovement
    side_effects:
      - "obligation_amount := calculations.movement_bond_obligation"
      - "bond_id := calculations.bond_selection_policy when omitted"
      - "transit_days_allowed / deadline_anchor_utc / transit_deadline_utc := calculations.transit_allowance_and_deadline variant at_filing"
      - "appends BondObligationLedgerEntry(OBLIGATE) and recomputes the bond's obligated_amount, available_amount, open_movement_count and status"
      - "transit_status := FILED, custody_status := BONDED, seal_intact := false, filed_at := clock.now"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_CARRIER_NOT_FOUND, ERR_BOND_NOT_FOUND, ERR_PORT_NOT_FOUND, ERR_MOVEMENT_NOT_FOUND, ERR_CARRIER_NOT_ACTIVE, ERR_BOND_NOT_ACTIVE, ERR_PREDECESSOR_NOT_ARRIVED, ERR_BOND_COVERAGE_GAP, ERR_ROUTE_TYPE_MISMATCH, ERR_STB_WINDOW_CONFLICT, ERR_BOND_INSUFFICIENT, ERR_NO_ELIGIBLE_BOND]

  - method: GET
    path: /in-bond/movements/{id}
    description: "Read a movement with both of its state dimensions and all derived deadlines."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: InBondMovement
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MOVEMENT_NOT_FOUND]

  - method: GET
    path: /in-bond/movements
    description: "List movements with filters on carrier, bond, ports, predecessor and both state dimensions."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["carrier_id?", "bond_id?", "origin_port_id?", "destination_port_id?", "arrival_port_id?", "predecessor_movement_id?", "in_bond_type?", "transit_status?", "custody_status?", "limit?", "offset?"]
    output: InBondMovement[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  - method: POST
    path: /in-bond/movements/{id}/departure
    description: "Seal the container and depart the origin port: FILED -> IN_TRANSIT."
    roles: [BondedCarrier]
    status: 200
    input: [seal_number]
    output: InBondMovement
    side_effects:
      - "appends SealEvent(APPLIED); seal_number set; seal_intact := true"
      - "increments InBondMovement.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_MOVEMENT_INVALID_STATE, ERR_CARRIER_NOT_ACTIVE, ERR_BOND_NOT_ACTIVE]

  - method: POST
    path: /in-bond/movements/{id}/cancellation
    description: "Withdraw a filed movement before departure and release its bond obligation."
    roles: [BondedCarrier]
    status: 200
    input: [reason_code]
    output: InBondMovement
    side_effects:
      - "transit_status := CANCELLED; cancellation_reason set"
      - "appends BondObligationLedgerEntry(RELEASE) and recomputes the bond (SATURATED -> ACTIVE when room reappears)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_MOVEMENT_INVALID_STATE]

  - method: POST
    path: /in-bond/movements/{id}/release
    description: "Release cargo from CBP custody at the destination port; closes an IT movement."
    roles: [CBPOfficer]
    status: 200
    input: ["reason_code?"]
    output: InBondMovement
    side_effects:
      - "custody_status := RELEASED"
      - "IT movements additionally transition ARRIVED -> CLOSED, appending BondObligationLedgerEntry(RELEASE) and recomputing the bond"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MOVEMENT_NOT_FOUND, ERR_MOVEMENT_INVALID_STATE, ERR_MOVEMENT_IN_GENERAL_ORDER, ERR_SEAL_INTEGRITY_UNRESOLVED, ERR_HOLD_OPEN]

  # ------------------------ BondObligationLedgerEntry ---------------------
  - method: GET
    path: /in-bond/ledger-entries/{id}
    description: "Read one immutable bond-obligation ledger entry."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: BondObligationLedgerEntry
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RESOURCE_NOT_FOUND]

  - method: GET
    path: /in-bond/ledger-entries
    description: "List ledger entries in created_at ASC order; the audit trail behind obligated_amount."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["bond_id?", "movement_id?", "claim_id?", "entry_type?", "limit?", "offset?"]
    output: BondObligationLedgerEntry[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  # ------------------------------- SealEvent ------------------------------
  - method: POST
    path: /in-bond/seal-events
    description: "Record a seal observation: verification, authorized or unauthorized breakage, or replacement."
    roles: [BondedCarrier, CBPOfficer]
    status: 201
    input: [movement_id, event_type, seal_number, port_code]
    output: SealEvent
    side_effects:
      - "resulting_seal_intact written onto InBondMovement.seal_intact (VERIFIED_INTACT leaves it unchanged)"
      - "BROKEN_UNAUTHORIZED additionally creates a system ExaminationHold(SEAL_DISCREPANCY), drives custody_status := EXAM_HOLD, recomputes Port.open_hold_count and may consume the one-time general-order grace"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_MOVEMENT_INVALID_STATE, ERR_SEAL_NOT_APPLIED]

  - method: GET
    path: /in-bond/movements/{id}/seal-events
    description: "Seal chain-of-custody history for a movement, occurred_at ASC."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["event_type?", "limit?", "offset?"]
    output: SealEvent[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MOVEMENT_NOT_FOUND, ERR_INVALID_PAGINATION]

  # ---------------------------- ExaminationHold ---------------------------
  - method: POST
    path: /in-bond/examination-holds
    description: "Place a container inspection or examination hold on a movement at a port."
    roles: [CBPOfficer]
    status: 201
    input: [movement_id, port_id, hold_type, reason_code, "scheduled_start?", "scheduled_end?"]
    output: ExaminationHold
    side_effects:
      - "custody_status := EXAM_HOLD; Port.open_hold_count recomputed"
      - "one-time general-order grace: when transit_status == ARRIVED and go_grace_applied == false, go_deadline_utc += 5 days and go_grace_applied := true"
      - "placed_by_user_id := X-User-ID (the officer who may not release it)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_PORT_NOT_FOUND, ERR_MOVEMENT_INVALID_STATE, ERR_EXAM_WINDOW_INVALID, ERR_EXAM_CAPACITY_EXCEEDED, ERR_HOLD_TYPE_NOT_ALLOWED]

  - method: GET
    path: /in-bond/examination-holds/{id}
    description: "Read one examination hold."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: ExaminationHold
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_HOLD_NOT_FOUND]

  - method: GET
    path: /in-bond/examination-holds
    description: "List examination holds by movement, port, type and status."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["movement_id?", "port_id?", "hold_type?", "status?", "limit?", "offset?"]
    output: ExaminationHold[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  - method: POST
    path: /in-bond/examination-holds/{id}/release
    description: "Release an examination hold with its findings."
    roles: [CBPOfficer]
    status: 200
    input: [findings_code, "discrepancy_pieces?"]
    output: ExaminationHold
    side_effects:
      - "status := RELEASED, released_at := clock.now; Port.open_hold_count recomputed"
      - "when it was the last OPEN hold: custody_status EXAM_HOLD -> BONDED, and an EXPORTED movement auto-closes with its RELEASE ledger entry"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_REQUEST, ERR_HOLD_NOT_FOUND, ERR_HOLD_INVALID_STATE]

  # ---------------------------- AmendmentRequest --------------------------
  - method: POST
    path: /in-bond/amendment-requests
    description: "Submit a diversion request or a transit-time extension request against a movement."
    roles: [BondedCarrier]
    status: 201
    input: [movement_id, amendment_type, justification_code, expected_movement_version, "requested_destination_port_code?", "requested_in_bond_type?", "requested_days?"]
    output: AmendmentRequest
    side_effects:
      - "any other SUBMITTED amendment on the movement becomes SUPERSEDED"
      - "increments InBondMovement.version"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_PORT_NOT_FOUND, ERR_STALE_MOVEMENT_VERSION, ERR_MOVEMENT_INVALID_STATE, ERR_MOVEMENT_IN_GENERAL_ORDER, ERR_SEAL_INTEGRITY_UNRESOLVED, ERR_TRANSIT_DEADLINE_PASSED, ERR_ROUTE_TYPE_MISMATCH, ERR_EXTENSION_LIMIT_EXCEEDED]

  - method: GET
    path: /in-bond/movements/{id}/amendment-requests
    description: "All diversion and extension requests filed against a movement, created_at ASC."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["amendment_type?", "status?", "limit?", "offset?"]
    output: AmendmentRequest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_MOVEMENT_NOT_FOUND, ERR_INVALID_PAGINATION]

  - method: POST
    path: /in-bond/amendment-requests/{id}/decision
    description: "Approve or deny a diversion or extension request."
    roles: [CBPOfficer]
    status: 200
    input: [decision, decision_reason_code, "granted_days?"]
    output: AmendmentRequest
    side_effects:
      - "APPROVE + DIVERSION: destination_port_id and optionally in_bond_type change; deadline_anchor_utc rebased to the decision instant and the deadline recomputed (variant on_diversion_rebase)"
      - "APPROVE + EXTENSION: extension_days_granted increased and the deadline recomputed from the original filing anchor (variant at_filing)"
      - "APPROVE may revive an OVERDUE movement back to IN_TRANSIT and increments InBondMovement.version"
      - "DENY changes nothing on the movement"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_AMENDMENT_NOT_FOUND, ERR_AMENDMENT_INVALID_STATE, ERR_MOVEMENT_INVALID_STATE, ERR_ROUTE_TYPE_MISMATCH, ERR_EXTENSION_LIMIT_EXCEEDED, ERR_GRANTED_DAYS_INVALID]

  # ----------------------------- MovementReport ---------------------------
  - method: POST
    path: /in-bond/reports
    description: "Report arrival at the destination port, or report exportation (with or without proof)."
    roles: [BondedCarrier]
    status: 201
    input: [movement_id, port_id, report_type, packages_reported, "proof_of_export_ref?", "export_conveyance_ref?"]
    output: MovementReport
    side_effects:
      - "ARRIVAL: movement -> ARRIVED, arrival_port_id and arrival_reported_at set, go_deadline_utc computed, diversion_flag set when the port differs from destination"
      - "EXPORT with proof: movement -> EXPORTED and auto CLOSED when no OPEN hold remains"
      - "EXPORT without proof: status := PENDING_PROOF and the movement does NOT advance"
      - "package_discrepancy := packages_reported != package_count"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_PORT_NOT_FOUND, ERR_MOVEMENT_INVALID_STATE, ERR_MOVEMENT_IN_GENERAL_ORDER, ERR_SEAL_NOT_APPLIED, ERR_SEAL_INTEGRITY_UNRESOLVED, ERR_UNAUTHORIZED_DIVERSION, ERR_REPORT_TYPE_NOT_ALLOWED]

  - method: POST
    path: /in-bond/reports/{id}/proof
    description: "Perfect an export report by supplying proof of exportation."
    roles: [BondedCarrier]
    status: 200
    input: [proof_of_export_ref, "export_conveyance_ref?"]
    output: MovementReport
    side_effects:
      - "status PENDING_PROOF -> ACCEPTED; movement -> EXPORTED and auto CLOSED when no OPEN hold remains"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_REPORT_NOT_FOUND, ERR_REPORT_INVALID_STATE, ERR_MOVEMENT_IN_GENERAL_ORDER, ERR_SEAL_INTEGRITY_UNRESOLVED]

  - method: GET
    path: /in-bond/reports/{id}
    description: "Read one arrival or export report."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: MovementReport
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_REPORT_NOT_FOUND]

  - method: GET
    path: /in-bond/reports
    description: "List arrival and export reports by movement, port, type and status."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["movement_id?", "port_id?", "report_type?", "status?", "limit?", "offset?"]
    output: MovementReport[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  # ------------------------ LiquidatedDamagesClaim ------------------------
  - method: POST
    path: /in-bond/ld-claims
    description: "Issue a liquidated-damages claim against a bonded carrier for a movement violation."
    roles: [CBPOfficer]
    status: 201
    input: [movement_id, claim_type, "reason_code?"]
    output: LiquidatedDamagesClaim
    side_effects:
      - "overdue_days_at_issue and assessed_amount := calculations.liquidated_damages_assessment; bond_id copied from the movement"
      - "appends BondObligationLedgerEntry(INCREASE_LD) and recomputes the bond (may become SATURATED)"
      - "recomputes BondedCarrier.sanction_points and open_claim_count; at >= 10.0 the carrier is SUSPENDED, which cancels its FILED movements and releases their obligations"
      - "issued_by_officer_id := X-User-ID (this officer is barred from deciding the petition)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_MOVEMENT_NOT_FOUND, ERR_DUPLICATE_CLAIM, ERR_NO_VIOLATION_TO_CLAIM]

  - method: GET
    path: /in-bond/ld-claims/{id}
    description: "Read a liquidated-damages claim with its assessed and mitigated amounts."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: []
    output: LiquidatedDamagesClaim
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLAIM_NOT_FOUND]

  - method: GET
    path: /in-bond/ld-claims
    description: "List claims by movement, bond, type and status."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["movement_id?", "bond_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: LiquidatedDamagesClaim[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  - method: POST
    path: /in-bond/ld-claims/{id}/disposition
    description: "Pay a claim (carrier) or cancel it (FPF officer other than the issuer)."
    roles: [BondedCarrier, FPFOfficer]
    status: 200
    input: [action, "paid_amount?", "reason_code?"]
    output: LiquidatedDamagesClaim
    side_effects:
      - "PAY: status := PAID and a RELEASE_LD ledger entry zeroes the claim's net ledger contribution"
      - "CANCEL: status := CANCELLED, a RELEASE_LD entry zeroes the claim's net ledger contribution, sanction_points are recomputed with the claim excluded (which can bring a SUSPENDED carrier back to ACTIVE), and any live petition is SUPERSEDED"
      - "both recompute the bond's obligated_amount / available_amount / status"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_CLAIM_INVALID_STATE, ERR_PAYMENT_AMOUNT_MISMATCH]

  # ---------------------------- MitigationPetition ------------------------
  - method: POST
    path: /in-bond/petitions
    description: "File a penalty mitigation petition against an issued claim."
    roles: [BondedCarrier]
    status: 201
    input: [claim_id, mitigation_factors, narrative_reference, expected_claim_version]
    output: MitigationPetition
    side_effects:
      - "round := 1; prior_violation_count snapshotted; mitigation_pct / net_before_fee / processing_fee / offer_amount := calculations.mitigation_offer_amount variant first_petition"
      - "claim ISSUED -> PETITIONED and LiquidatedDamagesClaim.version increments"
      - "any live earlier petition on the claim becomes SUPERSEDED"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_STALE_CLAIM_VERSION, ERR_CLAIM_INVALID_STATE, ERR_MITIGATION_FACTOR_INVALID]

  - method: POST
    path: /in-bond/petitions/{id}/supplement
    description: "Supplement a petition after the officer requested more information (round 2)."
    roles: [BondedCarrier]
    status: 200
    input: [mitigation_factors, narrative_reference]
    output: MitigationPetition
    side_effects:
      - "round += 1; status SUPPLEMENT_REQUESTED -> SUBMITTED"
      - "offer recomputed under variant supplemental_petition (cap 0.75)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_NOT_MOVEMENT_CARRIER, ERR_INVALID_REQUEST, ERR_PETITION_NOT_FOUND, ERR_PETITION_INVALID_STATE, ERR_PETITION_ROUND_LIMIT, ERR_MITIGATION_FACTOR_INVALID]

  - method: POST
    path: /in-bond/petitions/{id}/decision
    description: "Grant, partially grant, deny, or request a supplement to a mitigation petition."
    roles: [FPFOfficer]
    status: 200
    input: [decision, decision_reason_code]
    output: MitigationPetition
    side_effects:
      - "GRANT: claim -> MITIGATED with mitigated_amount := offer_amount and a MITIGATE ledger entry"
      - "PARTIAL_GRANT: claim -> MITIGATED with mitigated_amount := round2(assessed - (assessed - offer) * 0.5) and a MITIGATE ledger entry"
      - "DENY: claim PETITIONED -> ISSUED with no ledger movement"
      - "REQUEST_SUPPLEMENT: petition -> SUPPLEMENT_REQUESTED, claim stays PETITIONED"
      - "all bond amounts recomputed after any MITIGATE entry"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_REQUEST, ERR_PETITION_NOT_FOUND, ERR_PETITION_INVALID_STATE, ERR_CLAIM_INVALID_STATE, ERR_PETITION_ROUND_LIMIT]

  - method: GET
    path: /in-bond/ld-claims/{id}/petitions
    description: "All mitigation petitions filed against a claim, round ASC."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["status?", "limit?", "offset?"]
    output: MitigationPetition[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLAIM_NOT_FOUND, ERR_INVALID_PAGINATION]

  # ---------------------------- ComplianceSweep ---------------------------
  - method: POST
    path: /in-bond/compliance-sweeps
    description: |
      Run the deterministic compliance sweep against the current logical clock:
      marks overdue movements, expires lapsed bonds, sends arrived-but-unentered
      cargo to general order, and re-decays every carrier's sanction points.
    roles: [CBPOfficer]
    status: 201
    input: ["note?"]
    output: ComplianceSweep
    side_effects:
      - "IN_TRANSIT movements past their deadline -> OVERDUE with overdue_days computed and BondedCarrier.overdue_movement_count recomputed"
      - "bonds past expiry_date -> EXPIRED"
      - "ARRIVED movements at or past go_deadline_utc whose destination port has a general-order warehouse -> custody_status GENERAL_ORDER"
      - "BondedCarrier.sanction_points recomputed with the current decay buckets, which can cross either threshold"
      - "counts and overdue_movement_ids recorded on the sweep record"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /in-bond/compliance-sweeps
    description: "List past compliance sweeps, run_at DESC."
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: ["limit?", "offset?"]
    output: ComplianceSweep[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_PAGINATION]

  # -------------------------------- clock ---------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Test-driving endpoint: set the logical clock. Every timestamp the system
      derives (filed_at, deadlines, decay buckets, sweep results) reads this
      clock. Its default value before any call is 2026-08-01T00:00:00Z.
    roles: [CBPOfficer, FPFOfficer, SuretyAgent, BondedCarrier]
    status: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["no business state changes; the clock never moves backwards"]
    errors: [ERR_UNAUTHENTICATED, ERR_INVALID_REQUEST, ERR_CLOCK_NOT_MONOTONIC]

# =============================================================================
# §1.6 Error Catalog — every entry is reachable from at least one endpoint.
# =============================================================================
errors:

  # --- authentication / authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-Role or X-User-ID header missing, empty, or X-Role not a declared role"
    applies_to: "all"
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the caller's role is not in the endpoint's roles"
    applies_to: "all"
  - id: ERR_NOT_MOVEMENT_CARRIER
    http_status: 403
    condition: "a BondedCarrier acts on a movement (or its report, amendment, claim or petition) belonging to another carrier"
    applies_to: ["POST /in-bond/movements", "POST /in-bond/movements/{id}/departure", "POST /in-bond/movements/{id}/cancellation", "POST /in-bond/seal-events", "POST /in-bond/amendment-requests", "POST /in-bond/reports", "POST /in-bond/reports/{id}/proof", "POST /in-bond/petitions", "POST /in-bond/petitions/{id}/supplement", "POST /in-bond/ld-claims/{id}/disposition"]
  - id: ERR_NOT_BOND_SURETY
    http_status: 403
    condition: "a SuretyAgent whose X-User-ID is not the path bond id tries to administer that bond"
    applies_to: ["PATCH /in-bond/bonds/{id}"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the officer who issued a claim decides its petition or disposes of it, or the officer who placed a hold releases it"
    applies_to: ["POST /in-bond/petitions/{id}/decision", "POST /in-bond/ld-claims/{id}/disposition", "POST /in-bond/examination-holds/{id}/release"]

  # --- request shape -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "missing or mistyped body field, out-of-range enum, non-positive money/quantity, malformed datetime, port_code not 4 digits"
    applies_to: "all writes"
  - id: ERR_INVALID_PAGINATION
    http_status: 400
    condition: "limit outside 1..100 or offset < 0"
    applies_to: "all list reads"

  # --- existence ---------------------------------------------------------
  - id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    condition: "no BondedCarrier for the path id or body carrier_id"
    applies_to: ["GET /in-bond/carriers/{id}", "PATCH /in-bond/carriers/{id}", "POST /in-bond/bonds", "POST /in-bond/movements"]
  - id: ERR_BOND_NOT_FOUND
    http_status: 404
    condition: "no CustomsBond for the path id or body bond_id"
    applies_to: ["GET /in-bond/bonds/{id}", "PATCH /in-bond/bonds/{id}", "POST /in-bond/movements"]
  - id: ERR_PORT_NOT_FOUND
    http_status: 404
    condition: "no Port for the path id, body port id, or requested_destination_port_code"
    applies_to: ["GET /in-bond/ports/{id}", "POST /in-bond/movements", "POST /in-bond/examination-holds", "POST /in-bond/reports", "POST /in-bond/amendment-requests"]
  - id: ERR_MOVEMENT_NOT_FOUND
    http_status: 404
    condition: "no InBondMovement for the path id, body movement_id, or predecessor_movement_id"
    applies_to: ["GET /in-bond/movements/{id}", "GET /in-bond/movements/{id}/seal-events", "GET /in-bond/movements/{id}/amendment-requests", "POST /in-bond/movements", "POST /in-bond/movements/{id}/departure", "POST /in-bond/movements/{id}/cancellation", "POST /in-bond/movements/{id}/release", "POST /in-bond/seal-events", "POST /in-bond/examination-holds", "POST /in-bond/amendment-requests", "POST /in-bond/reports", "POST /in-bond/ld-claims"]
  - id: ERR_HOLD_NOT_FOUND
    http_status: 404
    condition: "no ExaminationHold for the path id"
    applies_to: ["GET /in-bond/examination-holds/{id}", "POST /in-bond/examination-holds/{id}/release"]
  - id: ERR_AMENDMENT_NOT_FOUND
    http_status: 404
    condition: "no AmendmentRequest for the path id"
    applies_to: ["POST /in-bond/amendment-requests/{id}/decision"]
  - id: ERR_REPORT_NOT_FOUND
    http_status: 404
    condition: "no MovementReport for the path id"
    applies_to: ["GET /in-bond/reports/{id}", "POST /in-bond/reports/{id}/proof"]
  - id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    condition: "no LiquidatedDamagesClaim for the path id or body claim_id"
    applies_to: ["GET /in-bond/ld-claims/{id}", "GET /in-bond/ld-claims/{id}/petitions", "POST /in-bond/ld-claims/{id}/disposition", "POST /in-bond/petitions"]
  - id: ERR_PETITION_NOT_FOUND
    http_status: 404
    condition: "no MitigationPetition for the path id"
    applies_to: ["POST /in-bond/petitions/{id}/supplement", "POST /in-bond/petitions/{id}/decision"]
  - id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    condition: "no BondObligationLedgerEntry (or other read-only record) for the path id"
    applies_to: ["GET /in-bond/ledger-entries/{id}"]

  # --- uniqueness --------------------------------------------------------
  - id: ERR_DUPLICATE_IRS_NUMBER
    http_status: 409
    condition: "irs_number already registered to another carrier"
    applies_to: ["POST /in-bond/carriers"]
  - id: ERR_DUPLICATE_PORT_CODE
    http_status: 409
    condition: "port_code already registered to another port"
    applies_to: ["POST /in-bond/ports"]

  # --- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_MOVEMENT_VERSION
    http_status: 412
    condition: "expected_movement_version != InBondMovement.version"
    applies_to: ["POST /in-bond/amendment-requests"]
  - id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    condition: "expected_claim_version != LiquidatedDamagesClaim.version"
    applies_to: ["POST /in-bond/petitions"]

  # --- own-entity state -------------------------------------------------
  - id: ERR_MOVEMENT_INVALID_STATE
    http_status: 409
    condition: "the movement's transit_status / custody_status does not admit the requested transition (departing twice, cancelling after departure, releasing a movement still in transit, a second ARRIVAL report, acting on a CLOSED or CANCELLED movement)"
    applies_to: ["POST /in-bond/movements/{id}/departure", "POST /in-bond/movements/{id}/cancellation", "POST /in-bond/movements/{id}/release", "POST /in-bond/seal-events", "POST /in-bond/amendment-requests", "POST /in-bond/amendment-requests/{id}/decision", "POST /in-bond/reports", "POST /in-bond/examination-holds"]
  - id: ERR_HOLD_INVALID_STATE
    http_status: 409
    condition: "the examination hold is already RELEASED"
    applies_to: ["POST /in-bond/examination-holds/{id}/release"]
  - id: ERR_AMENDMENT_INVALID_STATE
    http_status: 409
    condition: "the amendment is APPROVED, DENIED or SUPERSEDED and can no longer be decided"
    applies_to: ["POST /in-bond/amendment-requests/{id}/decision"]
  - id: ERR_REPORT_INVALID_STATE
    http_status: 409
    condition: "the report is not PENDING_PROOF"
    applies_to: ["POST /in-bond/reports/{id}/proof"]
  - id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    condition: "the claim's status does not admit the action (petitioning a non-ISSUED claim, paying a CANCELLED claim, deciding a petition whose claim is no longer PETITIONED)"
    applies_to: ["POST /in-bond/ld-claims/{id}/disposition", "POST /in-bond/petitions", "POST /in-bond/petitions/{id}/decision"]
  - id: ERR_PETITION_INVALID_STATE
    http_status: 409
    condition: "deciding a petition that is not SUBMITTED, or supplementing one that is not SUPPLEMENT_REQUESTED"
    applies_to: ["POST /in-bond/petitions/{id}/decision", "POST /in-bond/petitions/{id}/supplement"]
  - id: ERR_BOND_INVALID_STATE
    http_status: 409
    condition: "unsupported bond status transition (touching an EXPIRED bond, or setting SATURATED by hand)"
    applies_to: ["PATCH /in-bond/bonds/{id}"]
  - id: ERR_CARRIER_INVALID_STATE
    http_status: 409
    condition: "unsupported carrier transition (anything out of REVOKED, or reinstating a carrier whose sanction_points are still >= 10.0)"
    applies_to: ["PATCH /in-bond/carriers/{id}"]

  # --- cross-entity state ----------------------------------------------
  - id: ERR_CARRIER_NOT_ACTIVE
    http_status: 409
    condition: "the carrier is SUSPENDED or REVOKED"
    applies_to: ["POST /in-bond/movements", "POST /in-bond/movements/{id}/departure"]
  - id: ERR_BOND_NOT_ACTIVE
    http_status: 409
    condition: "the underwriting bond is SATURATED, SUSPENDED or EXPIRED"
    applies_to: ["POST /in-bond/movements", "POST /in-bond/movements/{id}/departure"]
  - id: ERR_PREDECESSOR_NOT_ARRIVED
    http_status: 409
    condition: "predecessor_movement_id names a movement that has not ARRIVED or belongs to another carrier"
    applies_to: ["POST /in-bond/movements"]
  - id: ERR_MOVEMENT_IN_GENERAL_ORDER
    http_status: 409
    condition: "the movement's custody_status is GENERAL_ORDER"
    applies_to: ["POST /in-bond/movements/{id}/release", "POST /in-bond/reports", "POST /in-bond/reports/{id}/proof", "POST /in-bond/amendment-requests"]

  # --- cargo safety -----------------------------------------------------
  - id: ERR_SEAL_NOT_APPLIED
    http_status: 409
    condition: "a seal event other than APPLIED, or a movement report, is attempted while seal_number is null"
    applies_to: ["POST /in-bond/seal-events", "POST /in-bond/reports"]
  - id: ERR_SEAL_INTEGRITY_UNRESOLVED
    http_status: 409
    condition: "seal_intact is false and no REPLACED seal event has restored integrity"
    applies_to: ["POST /in-bond/movements/{id}/release", "POST /in-bond/reports", "POST /in-bond/reports/{id}/proof", "POST /in-bond/amendment-requests"]
  - id: ERR_HOLD_OPEN
    http_status: 409
    condition: "cargo release attempted while an ExaminationHold is still OPEN"
    applies_to: ["POST /in-bond/movements/{id}/release"]
  - id: ERR_UNAUTHORIZED_DIVERSION
    http_status: 422
    condition: "arrival reported at an out-of-region port with no APPROVED DIVERSION on the movement"
    applies_to: ["POST /in-bond/reports"]

  # --- temporal ---------------------------------------------------------
  - id: ERR_TRANSIT_DEADLINE_PASSED
    http_status: 422
    condition: "an EXTENSION request is filed more than 2 days after the transit deadline"
    applies_to: ["POST /in-bond/amendment-requests"]
  - id: ERR_BOND_COVERAGE_GAP
    http_status: 422
    condition: "the bond's expiry_date is less than transit_deadline_utc + 3 days, or its effective_date is in the future"
    applies_to: ["POST /in-bond/movements"]
  - id: ERR_EXAM_WINDOW_INVALID
    http_status: 422
    condition: "scheduled window missing / inverted for a scheduled exam type, or supplied for DOCUMENT and PGA holds"
    applies_to: ["POST /in-bond/examination-holds"]
  - id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    condition: "the requested current_utc is earlier than the current logical clock"
    applies_to: ["POST /_clock/set_current_utc"]

  # --- business constraints --------------------------------------------
  - id: ERR_ROUTE_TYPE_MISMATCH
    http_status: 422
    condition: "IE with different origin and destination ports, or IT/TE with identical ports (also enforced on a diversion request)"
    applies_to: ["POST /in-bond/movements", "POST /in-bond/amendment-requests", "POST /in-bond/amendment-requests/{id}/decision"]
  - id: ERR_STB_WINDOW_CONFLICT
    http_status: 409
    condition: "a single-transaction bond's closed [filed_at, transit_deadline_utc] window collides with (including merely touching) another open movement on the same bond"
    applies_to: ["POST /in-bond/movements"]
  - id: ERR_EXAM_CAPACITY_EXCEEDED
    http_status: 409
    condition: "overlapping OPEN scheduled examination holds at the port have reached exam_capacity_slots"
    applies_to: ["POST /in-bond/examination-holds"]
  - id: ERR_EXTENSION_LIMIT_EXCEEDED
    http_status: 422
    condition: "cumulative extension days would exceed 30"
    applies_to: ["POST /in-bond/amendment-requests", "POST /in-bond/amendment-requests/{id}/decision"]
  - id: ERR_GRANTED_DAYS_INVALID
    http_status: 422
    condition: "granted_days missing, below 1, or above requested_days on an EXTENSION approval"
    applies_to: ["POST /in-bond/amendment-requests/{id}/decision"]
  - id: ERR_PETITION_ROUND_LIMIT
    http_status: 422
    condition: "a supplement or REQUEST_SUPPLEMENT is attempted once round 2 has been reached"
    applies_to: ["POST /in-bond/petitions/{id}/supplement", "POST /in-bond/petitions/{id}/decision"]
  - id: ERR_HOLD_TYPE_NOT_ALLOWED
    http_status: 422
    condition: "hold_type SEAL_DISCREPANCY requested on the public endpoint"
    applies_to: ["POST /in-bond/examination-holds"]
  - id: ERR_REPORT_TYPE_NOT_ALLOWED
    http_status: 422
    condition: "report_type not permitted for the movement's in_bond_type (EXPORT on an IT movement, ARRIVAL on an IE movement)"
    applies_to: ["POST /in-bond/reports"]
  - id: ERR_DUPLICATE_CLAIM
    http_status: 409
    condition: "a live claim of the same claim_type already exists on the movement"
    applies_to: ["POST /in-bond/ld-claims"]
  - id: ERR_NO_VIOLATION_TO_CLAIM
    http_status: 422
    condition: "the movement does not exhibit the witness condition for the claimed violation"
    applies_to: ["POST /in-bond/ld-claims"]
  - id: ERR_MITIGATION_FACTOR_INVALID
    http_status: 422
    condition: "mitigation_factors empty or containing duplicate codes"
    applies_to: ["POST /in-bond/petitions", "POST /in-bond/petitions/{id}/supplement"]

  # --- fiscal ------------------------------------------------------------
  - id: ERR_BOND_INSUFFICIENT
    http_status: 422
    condition: "the computed obligation exceeds the bond's available_amount"
    applies_to: ["POST /in-bond/movements"]
  - id: ERR_NO_ELIGIBLE_BOND
    http_status: 422
    condition: "bond_id omitted and no bond of the carrier survives the selection filter"
    applies_to: ["POST /in-bond/movements"]
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    condition: "paid_amount does not equal the amount currently owed (mitigated_amount when MITIGATED, otherwise assessed_amount)"
    applies_to: ["POST /in-bond/ld-claims/{id}/disposition"]

# =============================================================================
# §1.7 RBAC Permission Matrix — role_model: segregation_of_duties
#
# Every request carries X-Role and X-User-ID. `identity:` states what X-User-ID
# means for that role: `entity_backed:<Entity>` means the header value IS that
# entity's id and is checked against it; `opaque` means it is an arbitrary
# non-empty actor string that is only compared for equality against other
# recorded actor ids (segregation of duties).
# =============================================================================
roles:

  - name: BondedCarrier
    description: |
      The bonded common carrier / custodian. Files in-bond movements, seals and
      departs containers, reports arrival and exportation, requests diversions and
      extensions, petitions for mitigation, and pays claims. Sees only its own
      movements on write paths.
    identity: "entity_backed:BondedCarrier"
    exclusive_operations:
      - "POST /in-bond/movements"
      - "POST /in-bond/movements/{id}/departure"
      - "POST /in-bond/movements/{id}/cancellation"
      - "POST /in-bond/amendment-requests"
      - "POST /in-bond/reports"
      - "POST /in-bond/reports/{id}/proof"
      - "POST /in-bond/petitions"
      - "POST /in-bond/petitions/{id}/supplement"
    shared_operations:
      - "POST /in-bond/seal-events (with CBPOfficer)"
      - "POST /in-bond/ld-claims/{id}/disposition (action=PAY only; CANCEL is FPFOfficer's)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: CBPOfficer
    description: |
      Port officer. Registers carriers, bonds and ports, places and releases
      examination holds, decides diversion and extension requests, releases cargo,
      issues liquidated-damages claims, and runs the compliance sweep. A hold may
      not be released by the officer who placed it, and the officer who issues a
      claim is barred from every later decision on it.
    identity: opaque
    exclusive_operations:
      - "POST /in-bond/carriers"
      - "PATCH /in-bond/carriers/{id}"
      - "POST /in-bond/bonds"
      - "POST /in-bond/ports"
      - "POST /in-bond/movements/{id}/release"
      - "POST /in-bond/examination-holds"
      - "POST /in-bond/examination-holds/{id}/release"
      - "POST /in-bond/amendment-requests/{id}/decision"
      - "POST /in-bond/ld-claims"
      - "POST /in-bond/compliance-sweeps"
    shared_operations:
      - "POST /in-bond/seal-events (with BondedCarrier)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: FPFOfficer
    description: |
      Fines, Penalties and Forfeitures officer. Decides mitigation petitions and
      cancels claims. Never issues claims, so the issuing officer can never also
      be the deciding officer.
    identity: opaque
    exclusive_operations:
      - "POST /in-bond/petitions/{id}/decision"
    shared_operations:
      - "POST /in-bond/ld-claims/{id}/disposition (action=CANCEL only; PAY is the carrier's)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"

  - name: SuretyAgent
    description: |
      The surety that underwrites one specific bond. X-User-ID is that bond's id,
      so a surety can suspend, reinstate or re-limit exactly one bond and nothing
      else.
    identity: "entity_backed:CustomsBond"
    exclusive_operations:
      - "PATCH /in-bond/bonds/{id}"
    shared_operations:
      - "all GET reads"
      - "POST /_clock/set_current_utc"
