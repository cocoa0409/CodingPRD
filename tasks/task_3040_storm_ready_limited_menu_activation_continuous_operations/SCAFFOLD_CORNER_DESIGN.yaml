            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "GRILL_OP", home_unit_id: "${u1}", is_jump_team: true }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assets"
              payload: { kind: "GENERATOR", home_unit_id: "${u1}" }
              as: LogisticsPlanner
              captures: { g: $.data.id }
          trigger:
            - call: "GET /ops/units/${u2}/condition-reports"
              payload: {}
              as: UnitManager
            - call: "GET /ops/units/${u1}/crew-members"
              payload: {}
              as: FieldCoordinator
              captures: { members: $.data }
            - call: "GET /ops/assets/${g}/allocations"
              payload: {}
              as: LogisticsPlanner
            - call: "GET /ops/units/${u1}/lodging-bookings"
              payload: {}
              as: FieldCoordinator
          assert:
            - "GET /ops/units/${u2}/condition-reports returns 200 with total_count == 0 (empty child collection is not 404)"
            - "GET /ops/units/${u1}/crew-members returns total_count == 1 (member ${m})"
            - "GET /ops/assets/${g}/allocations returns total_count == 0"
            - "GET /ops/units/${u1}/lodging-bookings returns total_count == 0"

      - name: lodging_fund_top_up_via_patch
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/ops/units/{unitId}
        distinguishing_aspect: "PATCH /ops/units/{id} adds lodging_fund_top_up_cents to the existing fund (1000 then 2500 -> 3500) and bumps version by 1 per call — an incremental top-up, not a set."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm with unit U, fund 0."]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
          trigger:
            - call: "PATCH /ops/units/${u}"
              payload: { lodging_fund_top_up_cents: 1000 }
              as: CommandCenterAdmin
            - call: "PATCH /ops/units/${u}"
              payload: { lodging_fund_top_up_cents: 2500 }
              as: CommandCenterAdmin
              captures: { fund: $.data.lodging_fund_cents, ver: $.data.version }
          assert:
            - "Unit.${u}.lodging_fund_cents == 3500 (top-ups accumulate)"
            - "Unit.${u}.version == 3 (1 create + 2 top-ups)"

      - name: crew_member_patch_toggle_inactive
        claim_type: Conditional action
        grounds:
          - endpoints.PATCH_/ops/crew-members/{crewMemberId}
          - errors[ERR_CREW_MEMBER_INACTIVE]
        distinguishing_aspect: "PATCH to INACTIVE blocks new assignments (ERR_CREW_MEMBER_INACTIVE) and PATCH back to AVAILABLE restores assignability — the availability flag is a real gate at creation time."
        test_recipe:
          setup: ["Clock 2026-09-10T08:00:00Z. Storm WATCH; unit U; member M AVAILABLE, patched INACTIVE."]
          setup_api_calls:
