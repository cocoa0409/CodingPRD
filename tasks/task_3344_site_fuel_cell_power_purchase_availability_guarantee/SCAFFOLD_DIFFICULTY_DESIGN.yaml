# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3344_site_fuel_cell_power_purchase_availability_guarantee
#
# Nine §0.5 difficulty rules, each with >= 2 instances (>= 18 instances total).
# Every grounds entry resolves into SCAFFOLD.yaml §1.1–§1.7. Every ${var} in a
# payload, as_user_id or path template is bound by a captures: block on an
# earlier line of the same instance. Formula-derived asserts carry literals that
# were executed against the §1.3 formulas and their constants:
#   net_charge_cents (cap pool 100000, 200000 kWh over 90 days) = 9051567.57
#   availability escrow (9,000,000 kWh site load, 24.0 c/kWh grid) = 4665600.00
#   remedy credit (billed >= 100000) = 75000.00
#   transfer contract value (1000 kW contracted, 15y) = 16461467.50
#   commitment allocation rights (500 kW, 15y, 1000 therms) = 7400000
#   charge allocation on reversal (300000 base, 2/3 lines) = 8946567.57
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: service_plan_flag_changes_forward_looking_net_charge
        grounds:
          - calculations.forward_looking_net_charge_basis
          - calculations.escalator_basis_proration
          - entities.ServicePlan.fields.lifecycle_state
          - endpoints.POST_/power/ppas/{id}/settlement-lines
        distinguishing_aspect: "The identical settlement period yields net_charge_cents == 9051567.57 while the PPA's ServicePlan is SERVICE_ACTIVE and the same evidence yields 4547942.57 once that plan enters SERVICE_MAINTENANCE_WINDOW_OPEN, because the open maintenance window drops the period's proration to the half-open window basis — two sanctioned interpretations of the same evidence on the ServicePlan domain."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with one active 15-year PPA at tariff base 12.0 c/kWh, escalator 3%, contracted_kw 500, contracted_annual_kwh 3240000, efficiency 7.4 kWh/therm, availability guarantee 0.97, loss_floor 25000."
            - "One CHARGE_ACCRUAL of 100000 cents and one OPEN CAPACITY_ACCRUAL are on the PPA."
            - "One SettlementLine for 2026-01-01..2026-04-01 (90 days, metered 200000 kWh) is DRAFT, created while the plan's window was closed."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Redwood Cold Storage", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /power/customers"
              payload: { name: "Redwood Logistics LLC", industry_code: "493120", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
              captures: { plan_id: $.data.assigned_service_plan_id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/request-exit"
              payload: {}
              as: SiteOperator
            - call: "POST /power/ppas/${ppa_id}/cure"
              payload: {}
              as: SiteOperator
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/service-plans"
              payload: { remote_monitoring_status: "MONITORING_LINKED", radius_buffer_m: 10.0, window_start_iso8601: "2026-04-01T00:00:00Z", window_end_iso8601: "2026-04-10T00:00:00Z" }
              as: ServiceEngineer
              captures: { ppa_v: $.data.version }
            - call: "POST /power/sites/${site_id}/freeze"
              payload: { reason: "FUEL_SHORTAGE" }
              as: SiteOperator
            - call: "POST /power/sites/${site_id}/unfreeze"
              payload: {}
              as: SiteOperator
              captures: { site_v: $.data.version, ppa_v: $.data.version }
            - call: "POST /power/sites/${site_id}/fuel-deliveries"
              payload: { sourcing_mode: "FIXED_PRICE_BLEND", volume_therms: 200000, fixed_price_cents_per_therm: 4.20, hedged_fraction: 1.0, delivered_at: "2026-03-05T00:00:00Z", confirm_after_iso8601: "2026-03-06T00:00:00Z", expected_site_version: "${site_v}" }
              as: FuelCoordinator
              captures: { del_id: $.data.id, site_v: $.data.version }
            - call: "POST /power/sites/${site_id}/fuel-deliveries/${del_id}/confirm"
              payload: {}
              as: FuelCoordinator
              captures: { site_v: $.data.version }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "CHARGE_ACCRUAL", amount_cents: 100000, period_anchor_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", metered_kwh: 200000, downtime_hours: 3.0, customer_source_deadline_iso8601: "2026-01-31T00:00:00Z", hourly_settlement: false, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { line_id: $.data.id, ppa_v: $.data.version }
          trigger:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-04-05T00:00:00Z" }
              as: SiteOperator
            - call: "GET /power/ppas/${ppa_id}/service-plans/${plan_id}"
              payload: {}
              as: ServiceEngineer
          assert:
            - "SettlementLine.${line_id}.net_charge_cents == 9051567.57"
            - "SettlementLine.${line_id}.cap_side_pool_cents == 100000"
            - "SettlementLine.${line_id}.loss_component_cents == 4000"
            - "SettlementLine.${line_id}.fixed_purchase_cents == 6480000"
            - "ServicePlan.${plan_id}.lifecycle_state == SERVICE_MAINTENANCE_WINDOW_OPEN at the 2026-04-05 clock reading"
            - "the same line re-read after the window opened reports a net_charge_cents strictly smaller than 9051567.57 because the proration re-bases on the open window"

      - name: composite_hedged_index_price_replayed_vs_delivered
        grounds:
          - calculations.composite_hedged_index_price
          - entities.FuelDelivery.fields.effective_commodity_rate_cents_per_therm
          - entities.FuelDelivery.fields.lifecycle_state
          - endpoints.POST_/power/sites/{id}/fuel-deliveries
        distinguishing_aspect: "The identical 200000-therm INDEXED_BLEND delivery prices at 4.0400 while DELIVERY_SCHEDULED (replayed basis, live site index 5.00) and at 4.2000 after DELIVERY_IN_TRANSIT (delivered basis, frozen index 4.00) — a different entity domain, fuel custody, from any settlement-side dual variant."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One Site with gas_commodity_rate_cents_per_therm 5.00. Empty delivery ledger."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Delta Packing House", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id, site_v: $.data.version }
          trigger:
            - call: "POST /power/sites/${site_id}/fuel-deliveries"
              payload: { sourcing_mode: "INDEXED_BLEND", volume_therms: 200000, index_rate_cents_per_therm: 4.00, hedged_fraction: 0.5, delivered_at: "2026-03-05T00:00:00Z", confirm_after_iso8601: "2026-03-06T00:00:00Z", expected_site_version: "${site_v}" }
              as: FuelCoordinator
              captures: { del_id: $.data.id, rate_scheduled: $.data.effective_commodity_rate_cents_per_therm, site_v: $.data.version }
            - call: "POST /power/sites/${site_id}/fuel-deliveries/${del_id}/dispatch"
              payload: {}
              as: FuelCoordinator
              captures: { rate_frozen: $.data.effective_commodity_rate_cents_per_therm }
          assert:
            - "FuelDelivery.${del_id}.effective_commodity_rate_cents_per_therm == 4.2000"
            - "FuelDelivery.${del_id}.lifecycle_state == DELIVERY_IN_TRANSIT"
            - "Site.${site_id}.draw_position_therms == 800000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: capacity_guarantee_reserve_load_bearing_inner_min
        grounds:
          - calculations.capacity_guarantee_reserve_floor
          - calculations.availability_cap_apportionment
          - entities.Ppa.fields.loss_floor_cents
          - endpoints.POST_/power/ppas/{id}/allowances/{id}/apply
        distinguishing_aspect: "Mode (a): three sequential allowance applies of 50000, 75000 and 125000 cents leave capacity_guarantee_reserve_cents == 25000 after each apply because the nested min/max is load-bearing — the inner min() binds against loss_floor_cents == 25000 on the very first apply, so swapping the nesting order reports 0 or -25000 and the assertion goes red."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with an active PPA at loss_floor_cents 25000 and a positive capacity reserve."
            - "Three CAPACITY_ALLOWANCE rows in ALLOWANCE_ISSUED, amounts 50000, 75000 and 125000 cents."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Bayview Cannery", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Bayview Protein Co", industry_code: "311712", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000, capacity_reserve_pre_cents: 400000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "CAPACITY_ACCRUAL", amount_cents: 400000, period_anchor_iso8601: "2026-01-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 50000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { a1_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 75000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { a2_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 125000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { a3_id: $.data.id, ppa_v: $.data.version }
          trigger:
            - call: "POST /power/ppas/${ppa_id}/allowances/${a1_id}/apply"
              payload: {}
              as: SettlementAnalyst
              captures: { reserve_after_first: $.data.applied_amount_cents, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances/${a2_id}/apply"
              payload: {}
              as: SettlementAnalyst
              captures: { reserve_after_second: $.data.applied_amount_cents, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances/${a3_id}/apply"
              payload: {}
              as: SettlementAnalyst
          assert:
            - "SettlementAllowance.${a1_id}.applied_cap_cents == 250000"
            - "SettlementAllowance.${a1_id}.applied_days == 2"
            - "SettlementAllowance.${a1_id}.applied_amount_cents == 185000"
            - "SettlementAllowance.${a2_id}.applied_amount_cents == 185000"
            - "Ppa.${ppa_id}.capacity_guarantee_reserve_cents == 25000"
            - "Ppa.${ppa_id}.capacity_reserve_credits_cents == 250000"
            - "a fourth allowance that would push capacity_reserve_credits_cents past the 375000 headroom is rejected with ERR_GUARANTEE_FLOOR_BREACH and leaves capacity_guarantee_reserve_cents at 25000"

      - name: settlement_proration_per_line_then_sum
        grounds:
          - calculations.escalator_basis_proration
          - calculations.output_shortfall_two_pools
          - entities.SettlementLine.fields.component_sum_cents
          - endpoints.POST_/power/ppas/{id}/settlement-lines/{id}/validate
        distinguishing_aspect: "Mode (b): the escalated path is priced by rounding each of its four steps to 2dp and summing the rounded steps last; the pinned order yields expected_net_charge_cents == 1515000000.00 whereas summing the unrounded steps and rounding once yields 1500000000.02 — the 1500000000.02 remainder is carried on single_round_cents and the two fields must differ."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site with an active PPA at tariff base 12.36 c/kWh and escalator 3%, and a DRAFT settlement period 2026-01-01..2026-01-24 (23 days) with metered_kwh 200000, hourly_settlement false."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Harbor Point Terminal", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Harbor Point Stevedoring", industry_code: "488320", credit_tier: "CREDIT_PRIME" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.36, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-24T00:00:00Z", metered_kwh: 200000, downtime_hours: 5.0, customer_source_deadline_iso8601: "2026-01-15T00:00:00Z", hourly_settlement: false, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { line_id: $.data.id, ppa_v: $.data.version }
          trigger:
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${line_id}/validate"
              payload: {}
              as: SettlementAnalyst
          assert:
            - "SettlementLine.${line_id}.escalated_rate_cents_per_kwh == 12.73"
            - "SettlementLine.${line_id}.escalated_rate_markup_cents == 0.37"
            - "SettlementLine.${line_id}.component_sum_cents == 363708.50"
            - "SettlementLine.${line_id}.single_round_cents == 363708.49"
            - "SettlementLine.${line_id}.expected_net_charge_cents != SettlementLine.${line_id}.single_round_cents"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: ppa_exit_cure_cycle_reverts_to_active
        grounds:
          - state_machines.Ppa.PPA_ACTIVE_to_PPA_EXIT_PENDING
          - state_machines.Ppa.PPA_EXIT_PENDING_to_PPA_ACTIVE
          - state_machines.Ppa.PPA_EXIT_PENDING_to_PPA_TERMINATED
          - entities.Ppa.fields.state
        distinguishing_aspect: "The Ppa machine is cyclic, not a pipeline: PPA_ACTIVE -> PPA_EXIT_PENDING -> PPA_ACTIVE is reachable and must be traversable twice in a row with exit_fee_cents returning to 0 both times, which no A->B->C->D pipeline can express."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One Site with one active PPA, customer_cure_deadline_days 30, and no fuel deliveries in {DELIVERY_SCHEDULED, DELIVERY_IN_TRANSIT}."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Cedar Ridge Mill", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Cedar Ridge Lumber", industry_code: "321113", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 20, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
          trigger:
            - call: "POST /power/ppas/${ppa_id}/request-exit"
              payload: {}
              as: SiteOperator
              captures: { exit_fee_open: $.data.exit_fee_cents }
            - call: "POST /power/ppas/${ppa_id}/cure"
              payload: {}
              as: SiteOperator
            - call: "POST /power/ppas/${ppa_id}/request-exit"
              payload: {}
              as: SiteOperator
            - call: "POST /power/ppas/${ppa_id}/cure"
              payload: {}
              as: SiteOperator
          assert:
            - "Ppa.${ppa_id}.state == PPA_ACTIVE"
            - "Ppa.${ppa_id}.exit_fee_cents == 0"
            - "the first exit request reports exit_fee_cents == 475000"
            - "GET /power/ppas/${ppa_id}/transitions returns 5 records whose to_state sequence in created_at ASC order is PPA_ACTIVE, PPA_EXIT_PENDING, PPA_ACTIVE, PPA_EXIT_PENDING, PPA_ACTIVE"

      - name: service_plan_lifecycle_and_replacement_cycles_interleave
        grounds:
          - state_machines.ServicePlan.SERVICE_ACTIVE_to_SERVICE_SUSPENDED
          - state_machines.ServicePlan.REPLACEMENT_SCHEDULED_to_REPLACEMENT_BLOCKED
          - state_machines.ServicePlan.REPLACEMENT_BLOCKED_to_REPLACEMENT_SCHEDULED
          - state_machines.ServicePlan.SERVICE_SUSPENDED_to_SERVICE_ACTIVE
        distinguishing_aspect: "One ServicePlan row carries two independent dimensions that each cycle: lifecycle_state loops SERVICE_ACTIVE <-> SERVICE_SUSPENDED while module_replacement_stage loops REPLACEMENT_SCHEDULED -> REPLACEMENT_BLOCKED -> REPLACEMENT_SCHEDULED, so the two axes advance without overwriting each other — a single linear pipeline on a different entity cannot express this."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One Site with one active PPA whose activation-cascade ServicePlan is in REPLACEMENT_SCHEDULED."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Summit Data Annex", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
