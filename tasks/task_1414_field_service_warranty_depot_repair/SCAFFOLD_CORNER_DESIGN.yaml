            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-C", model_id: "${mdl}", condition_grade: "C", deposit_value_cents: 10000 }, captures: { lu_c: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
