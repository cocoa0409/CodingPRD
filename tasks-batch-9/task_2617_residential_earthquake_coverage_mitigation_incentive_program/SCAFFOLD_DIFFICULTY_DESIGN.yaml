  - rule_id: boundary_precision_check
    instances:
      - name: high_limit_load_attaches_exactly_at_75000000_and_rounds_half_up
        grounds:
          - calculations.hazard_base_premium.constants.HIGH_LIMIT_THRESHOLD_CENTS
          - calculations.hazard_base_premium.constants.HIGH_LIMIT_LOAD
        distinguishing_aspect: |
          HIGH_LIMIT_LOAD attaches on >= HIGH_LIMIT_THRESHOLD_CENTS, so a limit of 74,999,900
          prices at 114750 and a limit of 75,000,000 - one hundred cents higher - prices at 131963,
          a 17213-cent jump; the threshold case also lands on the exact half 131962.5 and must round
          half-up to 131963, not down to 131962.
        test_recipe:
          setup:
            - "One policyholder owning two otherwise identical TIER_1 / ROCK / WOOD_FRAME_SLAB dwellings built 1990"
            - "Dwelling BELOW has dwelling_limit_cents 74,999,900; dwelling AT has 75,000,000"
            - "Both are quoted at a 10% deductible, so the only factor that differs is high_limit_factor"
          setup_api_calls:
            - call: "POST /eqp/insurers"
              payload: { name: "Sierra Foothill Insurance", naic_code: "11012", market_share_pct: 2.5 }
              as: ProgramAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /eqp/policyholders"
              payload: { full_name: "Lena Duarte", email: "lena@example.com", county_code: "CA-PLA" }
              as: ProgramAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "1 Threshold Below Lane", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 1990, dwelling_limit_cents: 74999900 }
              as: ProgramAdmin
              captures: { dw_lo: $.data.id }
            - call: "POST /eqp/dwellings"
              payload: { policyholder_id: "${ph_id}", street_address: "2 Threshold At Lane", county_hazard_tier: "TIER_1", soil_class: "ROCK", structure_type: "WOOD_FRAME_SLAB", year_built: 1990, dwelling_limit_cents: 75000000 }
              as: ProgramAdmin
              captures: { dw_at: $.data.id }
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_lo}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_lo: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_lo}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /eqp/mandatory-offers"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", dwelling_id: "${dw_at}" }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { off_at: $.data.id }
            - call: "POST /eqp/mandatory-offers/${off_at}/respond"
              payload: { response: "ACCEPT" }
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_lo}", insurer_id: "${ins_id}", accepted_offer_id: "${off_lo}", deductible_pct: 10, contents_sublimit_cents: 10000000, loss_of_use_sublimit_cents: 5000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { base_lo: $.data.base_premium_cents, snap_lo: $.data.rated_dwelling_limit_cents }
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_at}", insurer_id: "${ins_id}", accepted_offer_id: "${off_at}", deductible_pct: 10, contents_sublimit_cents: 10000000, loss_of_use_sublimit_cents: 5000000 }
              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { base_at: $.data.base_premium_cents, snap_at: $.data.rated_dwelling_limit_cents }
          assert:
            - "${base_lo} == 114750 (unclamped 114749.847, no high-limit load)"
            - "${base_at} == 131963 (unclamped exactly 131962.500, high-limit load applied and rounded HALF-UP)"
            - "${base_at} - ${base_lo} == 17213 for a 100-cent difference in dwelling_limit_cents"
            - "${snap_lo} == 74999900 and ${snap_at} == 75000000"

      - name: payment_settles_exactly_at_payable_and_one_cent_more_is_refused
        grounds:
          - validations.ERR_PAYMENT_EXCEEDS_PAYABLE
          - state_machines.Claim.payment_status.UNPAID_to_PAID
          - entities.Claim.fields.paid_cents
        distinguishing_aspect: |
          On a payable of 18200000 the sequence 18199999 -> PARTIALLY_PAID, then exactly 1 -> PAID,
          then a further 1 -> 422 ERR_PAYMENT_EXCEEDS_PAYABLE, pins the comparison as
          paid_cents + amount_cents <= payable_cents with equality settling rather than overflowing.
        test_recipe:
          setup:
            - "A finalized claim with payable_cents 18200000: limit 50,000,000 at 15% deductible, structural 20,000,000, cosmetic 5,000,000, contents 2,500,000 (sublimit 2,500,000), loss of use 1,200,000 (sublimit 1,200,000)"
            - "The provisional adjustment is by adj-1 and the final by adj-2"
