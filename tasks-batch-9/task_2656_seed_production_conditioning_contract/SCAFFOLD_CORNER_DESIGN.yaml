        grounds: [state_machines.SeedLot.conditioning_reversal_compensation]
        excluded_because:
          difficulty_instance: compensating_invariant / bagging_reversal_preserves_lot_mass
          rationale: "Mass, bag_count and final_clean_units restoration with zero drift is asserted there."

