  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fraud_confirm_retailer_cascade
        grounds:
          - state_machines.FraudFlag.OPEN_to_CONFIRMED
          - state_machines.Retailer.VERIFIED_to_SUSPENDED
          - state_machines.CreditAccount.ACTIVE_to_FROZEN
          - state_machines.Order.PLACED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain where each link is caused by the previous link, not by
          the original action: confirming a STRAW_STOREFRONT flag suspends the
          retailer; the suspension freezes the credit account; the same
          suspension cancels each PLACED order; each cancellation issues a
          compensating Payout that credits the order's brand.
        test_recipe:
          setup:
            - "a VERIFIED retailer with an ACTIVE credit account and one PLACED order (2x10000 = 20000 subtotal) with an ACTIVE brand"
            - "an OPEN FraudFlag of type STRAW_STOREFRONT on the retailer"
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Shady Retail", store_type: "ONLINE", address: "7 Shell Ct", lat: 46.0, lng: -111.0, storefront_proof_url: "https://proof/7", resale_certificate_no: "RC-7" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /wholesale/brands"
              payload: { name: "Brand F", contact_email: "f@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 10000, qty: 2 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "STRAW_STOREFRONT", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { ff_id: $.data.id }
          trigger:
            - call: "POST /wholesale/fraud-flags/${ff_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/retailers/${r_id}"
              payload: {}
              as: PlatformAdmin
              captures: { r_status: $.data.verification_status }
            - call: "GET /wholesale/credit-accounts/${ca_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ca_status: $.data.status }
            - call: "GET /wholesale/orders/${o_id}"
              payload: {}
              as: PlatformAdmin
              captures: { o_status: $.data.status }
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: PlatformAdmin
              captures: { b_balance: $.data.payout_balance_cents }
          assert:
            - "FraudFlag.${ff_id}.status == CONFIRMED"
            - "Retailer.${r_id}.verification_status == SUSPENDED (hop 1)"
            - "CreditAccount.${ca_id}.status == FROZEN (hop 2, caused by the suspension)"
            - "Order.${o_id}.status == CANCELLED (hop 3, caused by the suspension)"
            - "a Payout exists with order_id == ${o_id}, commission_bps == 0, net_cents == 20000, status == PAID (hop 4)"
            - "Brand.${b_id}.payout_balance_cents == 20000 (compensating payout credited)"
      - name: return_receive_cascade
        grounds:
          - state_machines.ReturnAuthorization.APPROVED_to_RECEIVED
          - state_machines.Invoice.OPEN_to_PAID
          - state_machines.Order.DELIVERED_to_RETURNED
          - calculations.return_rate
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (returns receipt, not fraud):
          receiving an APPROVED authorization credits the invoice; the credit
          driving balance_cents to 0 flips the invoice OPEN -> PAID; the same
          receipt zeroes every line's net_sold_qty, flipping the order DELIVERED
          -> RETURNED and recomputing the retailer's return_rate.
        test_recipe:
          setup:
            - "a VERIFIED retailer with credit account; ACTIVE brand (case pack 1, lead time 0)"
            - "opening order 2x5000 = 10000 shipped and delivered; invoice OPEN balance 10000"
