      - name: license_attest_segregation_of_duties_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
          - "roles[name=CredentialingSpecialist]"
        distinguishing_aspect: "User-level segregation: attestation by the same X-User-ID that created the license ('spec-1') fails ERR_SEGREGATION_OF_DUTIES even under the correct role; a different verifier succeeds."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse's license created by spec-1, submitted, PSV VERIFIED by ver-1; license VERIFIED."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
