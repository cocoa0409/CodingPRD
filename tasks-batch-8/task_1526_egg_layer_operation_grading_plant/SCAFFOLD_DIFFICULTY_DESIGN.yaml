          setup:
            - "Farm (CONVENTIONAL); house; LAYING flock; production day 2026-07-31 (240 eggs); confirmed run -> LARGE A 20-dozen lot; ACTIVE MARKET_INDEX contract; lot RELEASED then ALLOCATED; one DRAFT settlement exists for period 2026-07-27..2026-08-02"
