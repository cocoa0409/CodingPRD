      - name: articulation_lifecycle_wrong_state_family_is_rejected
        claim_type: triggerable
        grounds:
          - validations[priority 15].ERR_RULE_NOT_DRAFT
          - validations[priority 15].ERR_RULE_NOT_UNDER_REVIEW
          - validations[priority 15].ERR_RULE_NOT_APPROVED
          - validations[priority 15].ERR_RULE_NOT_SUSPENDED
          - validations[priority 15].ERR_RECOMMENDATION_NOT_PUBLISHED
          - validations[priority 15].ERR_RECOMMENDATION_NOT_DRAFT
          - endpoints[POST /articulation-rules/{rule_id}/approve]
        distinguishing_aspect: |
          Approving a rule that is still DRAFT returns ERR_RULE_NOT_UNDER_REVIEW
          (409) — the from-state error names the state the endpoint DEMANDS, not the
          state the row is in — and once the rule is UNDER_REVIEW the same call
          switches to ERR_RECOMMENDATION_NOT_PUBLISHED because the parent
          recommendation gate is checked after the rule's own state.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; Course CS150 exists."
            - "CredentialRecommendation CLEP-CS created and left DRAFT (version 1, terms_version 1)."
            - "ArticulationRule CLEP-CS -> CS150 created and left DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /credential-recommendations"
              payload: { source_type: "CREDIT_BY_EXAM", credential_code: "CLEP-CS", title: "CLEP Computer Science", issuing_body: "College Board", recommended_credits: 6, recommended_level: "LOWER", effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_id: "$.data.id", rec_status: "$.data.status", rec_v: "$.data.version" }
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rule_id: "$.data.id", rule_status: "$.data.status" }
          trigger:
            - call: "POST /articulation-rules/${rule_id}/approve"
              payload: { expected_recommendation_version: "${rec_v}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
          assert:
            - "before the trigger CredentialRecommendation.${rec_id}.status == DRAFT and ArticulationRule.${rule_id}.status == DRAFT"
            - "the trigger returns status 409 with data.error_id == ERR_RULE_NOT_UNDER_REVIEW"
            - "POST /articulation-rules/${rule_id}/suspend {suspend_reason: 'Audit hold'} on the DRAFT rule returns 409 ERR_RULE_NOT_APPROVED"
            - "POST /articulation-rules/${rule_id}/reinstate on the DRAFT rule returns 409 ERR_RULE_NOT_SUSPENDED"
            - "after POST /articulation-rules/${rule_id}/submit-for-review returns 200 with status UNDER_REVIEW, a second submit-for-review returns 409 ERR_RULE_NOT_DRAFT"
            - "repeating the approve while the rule is UNDER_REVIEW but the recommendation is still DRAFT returns 409 ERR_RECOMMENDATION_NOT_PUBLISHED"
            - "after POST /credential-recommendations/${rec_id}/publish returns 200 with status PUBLISHED and version 2, a second publish returns 409 ERR_RECOMMENDATION_NOT_DRAFT"
            - "approving with expected_recommendation_version 2 as officer-approver then returns 200 with status APPROVED and pinned_recommendation_version == 1"
            - "ArticulationRule.${rule_id} never left DRAFT during any of the rejected calls and its version only advanced on the accepted ones"

