          assert:
            - "Robot.${r}.lifetime_mission_count == 2"
            - "Robot.${r}.lifetime_intervention_count == 2"
            - "Robot.${r}.lifetime_escalation_count == 0"
            - "Robot.${r}.clean_mission_count == 1"
            - "Robot.${r}.rolling_autonomy_index == 92"
            - "Robot.${r}.lifetime_autonomy_index == 90"
            - "DeliveryMission.${mi}.intervention_count == 2"
            - "DeliveryMission.${mi2}.intervention_count == 0"
            - "Robot.${r}.duty_state == AVAILABLE"
  - rule_id: combinatorial_formula
    instances:
      - name: crossing_risk_score_tiered_plus_capped_plus_hinge
        grounds:
          - "calculations.crossing_risk_score"
          - "entities.SidewalkSegment.fields.crossing_risk_score"
          - "entities.SidewalkSegment.fields.sightline_m"
          - "entities.SidewalkSegment.fields.curb_ramp_present"
        distinguishing_aspect: >-
          Mode a of the combinatorial requirement: crossing_risk_score composes a discrete
          sightline tier, a linearly-capped flow term min(1.4 * flow, 28), an enum control adjustment,
          a hinge term max(0, grade - 5.0) * 3.0, a curb-ramp credit and a 0.0..100.0 clamp in one
          expression, which is why 25.0 m sightline with 12.0 flow scores 24.8, 5.0 m sightline with
          40.0 flow on a MIDBLOCK crossing scores 80.0 through the flow cap, and a signalized
          crossing with a ramp lands on the clamp floor 0.0 from an unclamped -4.0.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 in PROVISIONED (no permit needed: scoring happens at the SURVEY transition)"
            - "segment S3 WALKWAY, sightline_m 25.0 (tier 8), pedestrian_flow_per_min 12.0 (term 16.8, below the cap), surface_grade_pct 4.0 (hinge 0), curb_ramp_present false, SURVEYED with no field overrides"
            - "segment S9 CROSSING MIDBLOCK, sightline_m 5.0 (tier 30), pedestrian_flow_per_min 40.0 (term 56.0 capped to 28), curb_ramp_present false, SURVEYED with no field overrides"
            - "segment S2 CROSSING SIGNALIZED, sightline_m 35.0 (tier 0), pedestrian_flow_per_min 10.0 (term 14.0), surface_grade_pct 1.5, curb_ramp_present true, unclamped total -4.0; it is mapped and surveyed by the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /service-zones"
              payload: { name: "Mission District", municipality_code: "SF", ordinance_min_clearance_cm: 90.0, ordinance_max_speed_cm_s: 160, operating_window_start_utc_hhmm: "0700", operating_window_end_utc_hhmm: "2100", max_concurrent_robots: 2, planning_haul_m: 800.0, planning_crossings: 2, remedy_budget_cents: 50000 }
              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S3", segment_type: "WALKWAY", length_m: 260.0, measured_clearance_cm: 104.0, surface_grade_pct: 4.0, sightline_m: 25.0, pedestrian_flow_per_min: 12.0, curb_ramp_present: false }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /sidewalk-segments/${s3}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S9", segment_type: "CROSSING", crossing_control: "MIDBLOCK", length_m: 10.0, measured_clearance_cm: 100.0, surface_grade_pct: 2.0, sightline_m: 5.0, pedestrian_flow_per_min: 40.0, curb_ramp_present: false }
              as: PlatformAdmin
              captures: { s9: $.data.id }
            - call: "POST /sidewalk-segments/${s9}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S2", segment_type: "CROSSING", crossing_control: "SIGNALIZED", length_m: 14.0, measured_clearance_cm: 150.0, surface_grade_pct: 1.5, sightline_m: 35.0, pedestrian_flow_per_min: 10.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /sidewalk-segments/${s2}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
          assert:
            - "SidewalkSegment.${s3}.crossing_risk_score == 24.8"
            - "SidewalkSegment.${s9}.crossing_risk_score == 80.0"
            - "SidewalkSegment.${s2}.crossing_risk_score == 0.0"
            - "SidewalkSegment.${s2}.status == SURVEYED"
            - "immediately after POST /sidewalk-segments and before the SURVEY call, SidewalkSegment.${s2}.crossing_risk_score == null"
      - name: remedy_waterfall_rounds_each_bucket_before_summing
        grounds:
          - "calculations.customer_remedy_amount"
          - "entities.DeliveryOrder.fields.remedy_amount_cents"
          - "entities.DeliveryOrder.fields.remedy_reason_code"
          - "entities.ServiceZone.fields.remedy_spent_cents"
          - "state_machines.DeliveryOrder.EXCEPTION_to_REFUNDED"
        distinguishing_aspect: >-
          Mode b of the combinatorial requirement: customer_remedy_amount is a three-bucket waterfall
          whose declared rounding order rounds each bucket independently and only then sums, so a
          ROBOT_FAULT remedy on a 812-cent fee basis with 9004 cents declared value must be
          284 + 5402 + 250 == 5936 and never the 5937 that summing the unrounded buckets
