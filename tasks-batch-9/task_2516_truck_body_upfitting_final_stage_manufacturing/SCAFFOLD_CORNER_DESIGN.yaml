# §1.9 Scaffold Corner Design — task_2516 Truck Body Upfitting & Final Stage Manufacturing
#
# A breadth walk of references/claim-extraction-guide.md against §1.1–§1.7 of SCAFFOLD.yaml.
# Every `section:` value is one of the guide's nine sections and every `claim_type:` is a row of
# that section's table — no invented categories. Corners that §1.8 already exercises appear as
# `excluded_because:` stubs (no test_recipe) naming the §1.8 instance that owns them.
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * logical clock is pinned to 2026-08-01T00:00:00Z as the first setup call;
#   * opaque-role user ids: adm-1 (PlantAdmin), ps-1 (ProductionScheduler), eng-1 (UpfitEngineer),
#     tech-1 (InstallTechnician), co-1 / co-2 (ComplianceOfficer), wa-1 (WarrantyAdministrator);
#     the Customer role authenticates as the Customer row's own id (${cust});
#   * catalog fixtures reused verbatim: F550-DRW-84CA (CM_A, WB 200 / CA 84 / 19500-7000-14706,
#     60 A aux ceiling, FULL PTO 18 gpm, J1939_CAN) and F450-SRW-60CA (CM_B, WB 176 / CA 60 /
#     14000-5000-9450, 40 A ceiling, FULL PTO 14 gpm, DISCRETE);
#   * every asserted arithmetic value is pre-computed to a literal (no formulas in asserts);
#   * VINs 1FDUF5HT0CC3xxxx / 1FDUF4HT0DD4xxxx, order numbers UO-5xxx and claim numbers WC-5xxx are
#     reserved for §1.9 so no fixture collides with a §1.8 chain.

scaffold_corner_design:

  # =========================================================================
  # 1. From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:

      - name: chassis_model_create_returns_every_book_field
        claim_type: Creation
        grounds:
          - entities.ChassisModel
          - endpoints.POST_/upfit/chassis-models
        distinguishing_aspect: |
          The body builder book is the root of every downstream gate, so its create must echo all
          fifteen input fields plus the four common fields. A response that drops pto_max_flow_gpm or
          silently coerces rear_gawr_lb would make the hydraulic waterfall and the GAWR gates
          untestable later.
        test_recipe:
          setup:
            - "Empty system with the logical clock pinned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
          assert:
            - "HTTP 201"
            - "ChassisModel.${cm_a}.code == \"F550-DRW-84CA\""
            - "ChassisModel.${cm_a}.gvwr_lb == 19500"
            - "ChassisModel.${cm_a}.front_gawr_lb == 7000"
            - "ChassisModel.${cm_a}.rear_gawr_lb == 14706"
            - "ChassisModel.${cm_a}.wheelbase_in == 200"
            - "ChassisModel.${cm_a}.cab_to_axle_in == 84"
            - "ChassisModel.${cm_a}.curb_front_axle_lb == 4820"
            - "ChassisModel.${cm_a}.curb_rear_axle_lb == 2680"
            - "ChassisModel.${cm_a}.max_aux_amp_draw == 60"
            - "ChassisModel.${cm_a}.electrical_bus == \"J1939_CAN\""
            - "ChassisModel.${cm_a}.pto_provision == \"FULL\""
            - "ChassisModel.${cm_a}.pto_max_flow_gpm == 18"
            - "ChassisModel.${cm_a}.body_builder_book_rev == \"BBB-2026.1\""
            - "ChassisModel.${cm_a}.incomplete_vehicle_document_rev == \"IVD-2026.1\""
            - "ChassisModel.${cm_a}.id is a non-empty string, created_at and updated_at are ISO-8601, version == 1"

      - name: body_spec_retrieval_returns_the_stored_catalog_row
        claim_type: Retrieval
        grounds:
          - entities.BodySpec
          - endpoints.GET_/upfit/body-specs/{body_spec_id}
        distinguishing_aspect: |
          Read-back of a catalog row must be byte-faithful on the two geometry fields the axle
          balance depends on (cg_from_body_front_in and cargo_cg_from_body_front_in), which are easy
          to confuse with each other because both are measured from the body's front edge.
        test_recipe:
          setup:
            - "One SERVICE body spec in the catalog."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
          trigger:
            - call: "GET /upfit/body-specs/${bs_svc}"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
          assert:
            - "HTTP 200"
            - "BodySpec.${bs_svc}.code == \"SERVICE-11FT\" and body_type == \"SERVICE\""
            - "BodySpec.${bs_svc}.weight_lb == 2100"
            - "BodySpec.${bs_svc}.cg_from_body_front_in == 62"
            - "BodySpec.${bs_svc}.cargo_cg_from_body_front_in == 66"
            - "BodySpec.${bs_svc}.required_min_ca_in == 84 and required_min_wheelbase_in == 189"
            - "BodySpec.${bs_svc}.requires_hydraulics == false"
            - "BodySpec.${bs_svc}.list_price_cents == 1450000"

      - name: equipment_spec_listing_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - entities.EquipmentSpec
          - endpoints.GET_/upfit/equipment-specs
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          total_count must describe the whole filtered set, not the page: with three specs on file
          and limit 2 the envelope has to read total_count 3 / has_more true while the data array
          holds exactly 2 rows, and the second page must flip has_more to false.
        test_recipe:
          setup:
            - "Three equipment specs on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/equipment-specs"
              payload: { code: "CRANE-6000", equipment_class: "CRANE", weight_lb: 1250, requires_pto: true, required_flow_gpm: 8, aux_amp_draw: 10, duty_priority: 1, mount_zone: "BEHIND_CAB", requires_can_gateway: false, list_price_cents: 780000 }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/equipment-specs"
              payload: { code: "LIFTGATE-2500", equipment_class: "LIFTGATE", weight_lb: 780, requires_pto: false, required_flow_gpm: 0, aux_amp_draw: 30, duty_priority: 3, mount_zone: "REAR_OVERHANG", requires_can_gateway: false, list_price_cents: 320000 }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/equipment-specs"
              payload: { code: "DUMP-HOIST-10T", equipment_class: "PTO_HOIST", weight_lb: 950, requires_pto: true, required_flow_gpm: 12, aux_amp_draw: 5, duty_priority: 2, mount_zone: "BODY_FLOOR", requires_can_gateway: false, list_price_cents: 640000 }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /upfit/equipment-specs"
              payload: { limit: 2, offset: 0 }
              as: InstallTechnician
              as_user_id: "tech-1"
          assert:
            - "HTTP 200"
            - "response_type == \"array\" and the data array holds exactly 2 EquipmentSpec rows"
            - "meta/pagination reports total_count == 3, limit == 2, offset == 0, has_more == true"
            - "a follow-up GET /upfit/equipment-specs with limit 2 and offset 2 returns 1 row with total_count == 3 and has_more == false"
            - "a follow-up GET /upfit/equipment-specs with requires_pto true and limit 10 returns 2 rows (CRANE-6000, DUMP-HOIST-10T) with total_count == 2"

      - name: chassis_get_with_unknown_id_returns_chassis_not_found
        claim_type: Not Found
        grounds:
          - entities.Chassis
          - validations.priority_16_ERR_CHASSIS_NOT_FOUND
          - errors[ERR_CHASSIS_NOT_FOUND]
        distinguishing_aspect: |
          The 404 must be the Chassis-specific code, not a generic not-found: the §1.4 ladder places
          fourteen distinct *_NOT_FOUND rows in entity order precisely so a mis-typed path parameter
          identifies which entity was missing.
        test_recipe:
          setup:
            - "One real chassis exists, so the 404 cannot be an artefact of an empty table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0CC30001", chassis_model_id: "${cm_a}", ownership: "POOL_STOCK", availability_date: "2026-08-05" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: "$.data.id" }
          trigger:
            - call: "GET /upfit/chassis/00000000-0000-4000-8000-000000000404"
              payload: {}
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == ERR_CHASSIS_NOT_FOUND"
            - "the real unit ${ch} is still readable, so the miss was scoped to the bogus id"

      - name: upfit_order_create_missing_body_mount_offset_rejected
        claim_type: Required Fields
        grounds:
          - entities.UpfitOrder.fields.body_mount_offset_from_front_axle_in
          - validations.priority_5_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          body_mount_offset_from_front_axle_in has source: input and no default — it is the single
          geometric input the shop controls, and every axle-load number is a function of it. Omitting
          it must fail at priority 5 rather than defaulting to 0, which would silently certify a body
          mounted at the front-axle centerline.
        test_recipe:
          setup:
            - "A published CUSTOM service configuration and a customer exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5001", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}" }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "no UpfitOrder row with order_number UO-5001 exists"

      - name: chassis_omitted_ownership_defaults_to_pool_stock
        claim_type: Defaults
        grounds:
          - entities.Chassis.fields.ownership
          - entities.Chassis.fields.status
          - entities.Chassis.fields.measured_front_axle_weight_lb
        distinguishing_aspect: |
          A unit arriving on the lot with no order behind it is pool stock by default, and its scale
          ticket fields must be null rather than 0 — a 0-lb measured axle would let an AS_MEASURED
          certification be computed off a truck that was never weighed.
        test_recipe:
          setup:
            - "One chassis model on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
          trigger:
            - call: "POST /upfit/chassis"
              payload: { vin: "1FDUF5HT0CC30002", chassis_model_id: "${cm_a}", availability_date: "2026-08-05" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { ch: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Chassis.${ch}.ownership == \"POOL_STOCK\""
            - "Chassis.${ch}.status == \"RECEIVED\""
            - "Chassis.${ch}.measured_front_axle_weight_lb is null and measured_rear_axle_weight_lb is null"
            - "Chassis.${ch}.allocated_upfit_order_id is null and quarantine_reason is null"
            - "Chassis.${ch}.version == 1"

      - name: upfit_order_omitted_optionals_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.UpfitOrder.fields.required_payload_lb
          - entities.UpfitOrder.fields.warranty_liability_cap_cents
          - entities.UpfitOrder.fields.requested_in_service_date
          - entities.BuildConfiguration.fields.standard_equipment_spec_ids
        distinguishing_aspect: |
          Three defaults with three different consequences must all land: required_payload_lb 0
          (so the payload gate is vacuous), warranty_liability_cap_cents 5000000 (the budget ceiling
          used at adjudication) and requested_in_service_date null (which switches the in-service
          feasibility gate off entirely rather than comparing against a null date).
        test_recipe:
          setup:
            - "A published CUSTOM service configuration created without standard_equipment_spec_ids."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "TIER_A" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5002", order_type: "POOL_STOCK", customer_id: null, build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
          assert:
            - "HTTP 201"
            - "UpfitOrder.${uo}.required_payload_lb == 0"
            - "UpfitOrder.${uo}.warranty_liability_cap_cents == 5000000"
            - "UpfitOrder.${uo}.requested_in_service_date is null"
            - "UpfitOrder.${uo}.customer_id is null (POOL_STOCK)"
            - "BuildConfiguration.${cfg}.standard_equipment_spec_ids == []"
            - "BuildConfiguration.${cfg}.published_at is the pinned clock instant 2026-08-01T00:00:00Z"

      - name: upfit_order_computed_fields_are_server_derived_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.UpfitOrder.fields.invoice_total_cents
          - entities.UpfitOrder.fields.committed_aux_amp_draw
          - entities.UpfitOrder.fields.chassis_warranty_status
          - calculations.aux_electrical_load
        distinguishing_aspect: |
          committed_aux_amp_draw is NOT zero at creation — the body's own 12 A is counted from the
          moment the order exists — while invoice_total_cents IS zero until release. A client that
          posts its own values for either must be ignored on both counts, which is a sharper test
          than "computed fields start empty".
        test_recipe:
          setup:
            - "A published CUSTOM service configuration whose body draws 12 A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5003", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120, invoice_total_cents: 999, committed_aux_amp_draw: 999, chassis_warranty_status: "VOIDED", body_spec_id: "deadbeef" }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
          assert:
            - "HTTP 201"
            - "UpfitOrder.${uo}.invoice_total_cents == 0 (the client's 999 was ignored; the invoice is stamped at release)"
            - "UpfitOrder.${uo}.committed_aux_amp_draw == 12 (BodySpec.aux_amp_draw counted from creation, not the client's 999)"
            - "UpfitOrder.${uo}.chassis_warranty_status == \"INTACT\" (no APPROVED interface exists; the client's VOIDED was ignored)"
            - "UpfitOrder.${uo}.committed_pto_flow_gpm == 0"
            - "UpfitOrder.${uo}.body_spec_id == ${bs_svc} (copied from the configuration, not from the request)"
            - "UpfitOrder.${uo}.chassis_liability_cents == 0 and upfitter_liability_cents == 0 and customer_goodwill_cents == 0"

      - name: chassis_system_fields_generated_and_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Chassis.fields.status
          - entities.Chassis.fields.allocated_upfit_order_id
          - entities.Chassis.fields.quarantine_reason
        distinguishing_aspect: |
