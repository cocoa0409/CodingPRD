            - call: "POST /lease-admin/amendments/${a}/apply"
              payload: {}
              as: PortfolioManager
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { exp_after: $.data.expiration_date }
            - call: "GET /lease-admin/critical-dates/${cd_old}"
              payload: {}
              as: PropertyManager
              captures: { cd_old_status: $.data.status }
