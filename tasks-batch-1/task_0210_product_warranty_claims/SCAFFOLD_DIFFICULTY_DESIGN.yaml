              as: WarrantyAdmin
              captures: { gold_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1r@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-INV2", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /extended-warranties"
              payload: { registration_id: "${reg_id}", coverage_tier_id: "${gold_id}", amount_paid_cents: 12000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { ew_id: $.data.id }
          trigger:
            - call: "POST /extended-warranties/${ew_id}/cancel"
              payload: {}
              as: Owner
