- section: consistency_model
  instances:
  - name: immediate_read_after_write_visibility
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: a created member is retrievable by id and appears in the nonprofit-filtered list in the same request flow; the
      election side effect (member ACTIVE) is visible on the very next GET.'
    test_recipe:
      setup:
      - Org with adopted bylaws
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-IM-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      trigger:
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: M
          email: m@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
        captures:
          m: $.data.id
      - call: GET /boardgov/board-members/${m}
        payload: {}
        as: GovernanceAdmin
        captures:
          st0: $.data.status
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${m}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: GET /boardgov/board-members/${m}
        payload: {}
        as: GovernanceAdmin
        captures:
          st1: $.data.status
      - call: GET /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          status: ACTIVE
        as: GovernanceAdmin
        captures:
          first: $.data[0].id
      assert:
      - st0 == PROPOSED at creation, st1 == ACTIVE immediately after the election (no reconcile lag)
      - first == ${m} (the ACTIVE-filtered list already contains the member)
- section: errors
  instances:
  - name: meeting_notice_and_early_call_and_duplicate_committee_name
    claim_type: violation_to_error
    grounds:
    - errors[ERR_NOTICE_INSUFFICIENT]
    - errors[ERR_MEETING_TOO_EARLY]
    - errors[ERR_DUPLICATE_COMMITTEE_NAME]
    - validations[priority=19]
    distinguishing_aspect: 'Three remaining catalog triggers: call_to_order with late notice (no waiver) fails ERR_NOTICE_INSUFFICIENT; call_to_order before scheduled_start
      fails ERR_MEETING_TOO_EARLY; a second live committee with the same name fails ERR_DUPLICATE_COMMITTEE_NAME.'
    test_recipe:
      setup:
      - Org; chair C ACTIVE; meeting M1 at 2026-08-01T00:00:00Z with notice_sent_at 2026-07-30 (2 days < 7 required, no waiver); meeting M2 at 2026-09-01T00:00:00Z
        with proper notice (waived); committee 'Audit Cttee' CHARTERED
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-MTG-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: C
          email: c@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          c: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-08-01T00:00:00Z'
          duration_minutes: 60
          notice_sent_at: '2026-07-30T00:00:00Z'
        as: GovernanceAdmin
        captures:
          m1: $.data.id
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-09-01T00:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          m2: $.data.id
      - call: POST /boardgov/committees
        payload:
          nonprofit_id: ${np}
          name: Audit Cttee
          type: AUDIT
          min_members: 1
          authorized_size: 3
        as: GovernanceAdmin
      trigger:
      - call: POST /boardgov/meetings/${m1}/call_to_order
        payload:
          attendance:
          - ${c}
        as: BoardChair
        as_user_id: ${c}
        captures:
          err_notice: $.data.error_id
      - call: POST /boardgov/meetings/${m2}/call_to_order
        payload:
          attendance:
          - ${c}
        as: BoardChair
        as_user_id: ${c}
        captures:
          err_early: $.data.error_id
      - call: POST /boardgov/committees
        payload:
          nonprofit_id: ${np}
          name: Audit Cttee
          type: FINANCE
          min_members: 1
          authorized_size: 2
        as: GovernanceAdmin
        captures:
          err_dup: $.data.error_id
      assert:
      - err_notice == ERR_NOTICE_INSUFFICIENT (2026-07-30 notice is inside the 7-day window before 2026-08-01)
      - err_early == ERR_MEETING_TOO_EARLY (default clock 2026-08-01 < scheduled 2026-09-01)
      - err_dup == ERR_DUPLICATE_COMMITTEE_NAME (name collides while the first committee is non-DISSOLVED)
