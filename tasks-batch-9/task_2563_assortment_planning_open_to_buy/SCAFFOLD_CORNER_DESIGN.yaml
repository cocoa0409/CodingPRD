              as: MerchOpsAdmin
              captures: { expired_count: $.data.expired_overlay_count }
            - call: "GET /otb/assortment-items/${item_id}"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { off_mult: $.data.effective_overlay_multiplier_bps, off_st: $.data.sell_through_bps, off_version: $.data.version }
          assert:
            - "${ov_status} == DRAFT on create and ${active_status} == ACTIVE after the director's activate; a planner authors the overlay but only a director may switch it on"
            - "${base_mult} == 10000, ${base_st} == 6325 and ${base_basis} == NEW_ITEM_BENCHMARK at adopt time: with no ACTIVE overlay the multiplier is the neutral 10000 and the forecast is round_half_up(5500 * 11500 * 10000 / 100000000)"
            - "${on_mult} == 11000 and ${on_st} == 6958 after activation: round_half_up(5500 * 11500 * 11000 / 100000000) == round_half_up(6957.5) == 6958, which is the half-away-from-zero tie landing UP"
            - "${on_version} == ${item_v3} + 1: activating the overlay bumped the item exactly once even though the request named no item"
            - "${at_end_status} == ACTIVE with the clock exactly at 2026-08-31T00:00:00Z: expiry requires strictly after effective_end, so the boundary reading does not expire the overlay"
            - "${expired_count} == 1 on the 2026-09-01 clock advance, and GET /otb/localization-overlays/${ov_id} now reports status EXPIRED"
            - "${off_mult} == 10000 and ${off_st} == 6325: expiry restores exactly the pre-activation numbers, so the overlay contribution is fully reversible"
            - "${off_version} == ${on_version} + 1 (the item's fifth version overall: create, adopt, activate, overlay activate, overlay expiry) - the values returned to their originals but the row's history did not rewind"

      - name: reject_compensation_unwind
        claim_type: compensation
        grounds:
          - state_machines.CategoryPlan.transitions.SUBMITTED_to_DRAFT
          - state_machines.PlanMonth.transitions.LOCKED_PLAN_to_DRAFT
          - state_machines.OptionPlan.transitions.SLOTTED_to_OPEN
        distinguishing_aspect: "Rejecting a SUBMITTED plan must undo every field the approve cascade wrote - month OTB and reserve fields back to 0, option-plan slot counters and target_units_per_option back to null - rather than merely flipping statuses back."
        excluded_because:
          difficulty_instance: category_plan_revision_and_reforecast_loop
          rationale: "That §1.8 instance drives the full revision loop DRAFT -> SUBMITTED -> APPROVED-then-reject -> DRAFT -> SUBMITTED and already asserts the complete unwind (months back to DRAFT with otb_planned_cents, otb_open_cents, markdown_reserve_cents, provisional_sell_through_bps and reserve_rate_bps all 0, the option plan back to OPEN with option_slots_total, option_slots_open and target_units_per_option null, and reforecast_round still 0), so a separate breadth instance would replay the same assertions."

      - name: cycle_state_bubbles_up_from_decisions
        claim_type: bubble_up
        grounds:
          - state_machines.ReforecastCycle.transitions.OPEN_to_DECIDED
          - state_machines.ReforecastCycle.transitions.DECIDED_to_OPEN
        distinguishing_aspect: "ReforecastCycle has no endpoint that sets DECIDED: the parent's state is derived from whether any child ChaseCancelDecision is still PROPOSED, so adjudicating the last child flips the parent and creating a new child flips it back."
        excluded_because:
          difficulty_instance: reforecast_cycle_decided_reopen_loop
          rationale: "That §1.8 instance is built precisely on the bubble-up edge and its reopen loop, asserting that the cycle only reaches DECIDED when the last PROPOSED decision is adjudicated and returns to OPEN when another decision is created, so the breadth claim is already fully exercised there."

      - name: freeze_lift_restores_only_carryover_items
        claim_type: conditional_cascade
        grounds:
          - state_machines.AssortmentItem.transitions.DEFERRED_to_PROPOSED
          - state_machines.ReceiptCommitment.transitions.COMMITTED_to_CANCELLED
        distinguishing_aspect: "The restore leg of the freeze cascade is filtered by lifecycle_stage: DEFERRED items with stage CARRYOVER or CORE return to PROPOSED while NEW and EXIT items stay DEFERRED, so the cascade is not symmetric with the freeze that demoted them all."
        excluded_because:
          difficulty_instance: cancel_cascade_release_to_deferred_restore
          rationale: "That §1.8 instance drives CASCADE-A end to end and its fourth link is exactly this conditional restore, asserting per-item that CARRYOVER/CORE rows return to PROPOSED while NEW/EXIT rows remain DEFERRED after the posture leaves FROZEN."

      - name: commit_and_fulfillment_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.ReceiptCommitment.commit_status
          - state_machines.ReceiptCommitment.fulfillment_status
        distinguishing_aspect: "One row carries two state fields that advance on separate endpoint families and couple at only two points (full receipt closes commit_status; zero-receipt cancellation voids fulfillment_status)."
        excluded_because:
          difficulty_instance: receipt_commitment_parallel_state_dimensions
          rationale: "That §1.8 instance is the dedicated probe for the two-dimension design, walking commit/ship/partial-receipt/full-receipt and the VOID coupling on one row, so a breadth instance would restate it."

      - name: chase_and_cancel_branch_then_join
        claim_type: branching
        grounds:
          - state_machines.AssortmentItem.transitions.IN_SEASON_to_CHASED
          - state_machines.AssortmentItem.transitions.IN_SEASON_to_CANCELLED_IN_SEASON
        distinguishing_aspect: "IN_SEASON forks on the approved decision's action into two branches with disjoint side effects (units added and commitments created versus units removed and commitments cancelled) which then rejoin on the single close edge."
        excluded_because:
          difficulty_instance: assortment_item_chase_cancel_fork_join
          rationale: "That §1.8 instance drives both branches from the same IN_SEASON item and then the shared join, asserting the disjoint side-effect sets and the identical slot release on either path."

      - name: month_ledger_stays_in_sync_with_commitments
        claim_type: ledger_sync
        grounds:
          - entities.PlanMonth.fields.otb_open_cents
          - entities.PlanMonth.fields.otb_committed_cents
          - entities.PlanMonth.fields.otb_received_cents
        distinguishing_aspect: "Every commit, receipt and cancellation must leave otb_open_cents + otb_committed_cents + otb_received_cents == otb_planned_cents on the affected month, so the month row is a ledger rather than a set of independently-written counters."
        excluded_because:
          difficulty_instance: plan_month_otb_dollar_conservation
          rationale: "That §1.8 instance is the compensating-invariant probe for exactly this identity and re-checks it after each of commit, partial receipt, full receipt and cancellation, which is strictly more than a breadth instance would assert."

  # === 3. From Table 3 (Calculations) ===
  - section: calculations
    instances:
      - name: reserve_rate_tier_boundaries_across_four_months
        claim_type: threshold
        grounds:
          - calculations.markdown_reserve
          - calculations.markdown_reserve.constants
          - entities.PlanMonth.fields.reserve_rate_bps
          - entities.PlanMonth.fields.provisional_sell_through_bps
        distinguishing_aspect: "All three tier edges are probed in a single approve cascade by four months that differ ONLY in planned_sales_cents, so every other input is held constant and the reserve rate can change for no other reason. Each edge is exercised one bps below and exactly at the boundary, which pins the comparison as strictly-less-than on the lower value: 3999 -> 900 but 4000 -> 600, and 8499 -> 350 but 8500 -> 150."
        test_recipe:
          setup:
            - "a DRAFT plan with planned_margin_bps 5000 and four months that share bom 20,000,000, markdown 2,000,000 and eom 22,000,000 and differ only in planned_sales_cents"
            - "one option plan with a balanced two-size curve so the plan is submittable"
