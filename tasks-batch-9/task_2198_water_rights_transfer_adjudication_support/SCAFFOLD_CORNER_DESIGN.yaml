            - {call: "POST /transfer-applications/${app}/resubmit", payload: {requested_af: 80.00, expected_water_right_version: "${wr_v4}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app}/publish", as: WaterRightsAnalyst}
            - {call: "POST /protests", payload: {transfer_application_id: "${app}", protestant_claimant_id: "${cl_d}", claimed_injury_af: 3.00, basis: ENLARGEMENT}, as: Claimant, as_user_id: "${cl_d}"}
          trigger:
            - {call: "POST /transfer-applications/${app}/request-revision", payload: {revision_note: "third re-scope attempt"}, as: HearingOfficer, captures: {e1: "$.data.error_id"}}
            - {call: "GET /transfer-applications/${app}", as: HearingOfficer}
          assert:
            - "409 ERR_REVISION_LIMIT_REACHED — revision_round == 2 == REVISION_ROUND_CAP, so the declared UNDER_PROTEST -> REVISION_REQUESTED edge is closed by the cap rule at priority 37."
            - "The application is still UNDER_PROTEST with requested_af 80.00, escrowed_af 80.00, revision_round 2, unresolved_protest_count 3 and an unchanged version."
            - "The two republications used the 15-day window: after the first resubmit protest_deadline was \"2026-03-16T00:00:00Z\", and after the second it was \"2026-03-16T00:00:00Z\" again (the clock never moved), never clock + 30 days."
            - "The right reads encumbered_af 80.00 and transferable_af 115.00 — each resubmit SWAPPED the escrow (100.00 -> 90.00 -> 80.00) rather than stacking it."

      - name: sm_protest_withdrawal_of_the_last_protest_finalizes_the_application
        claim_type: side_effect_execution
        grounds:
          - state_machines.Protest.FILED_to_WITHDRAWN
          - state_machines.TransferApplication.UNDER_PROTEST_to_READY_FOR_DECISION
          - state_machines.InjuryAnalysis.DRAFT_to_FINALIZED
        distinguishing_aspect: >-
          The clearance cascade is keyed on the COUNTER reaching exactly 0, not on
          any single protest closing: withdrawing the first of two protests moves
          nothing but the counter, and only the second withdrawal flips the
          application to READY_FOR_DECISION and freezes the analysis — via the
          withdrawal path, which grants no offset at all.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A (transferable_af 195.00); application for 100.00 AF published; protestants B and C have each filed one protest, so unresolved_protest_count == 2 and the application is UNDER_PROTEST."
