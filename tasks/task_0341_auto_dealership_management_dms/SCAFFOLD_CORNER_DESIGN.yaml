  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_invalid_state_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_deal_contract_requires_vehicle_on_deal
          rationale: "ERR_INVALID_STATE is exercised broadly; the state-vs-fiscal priority instance also asserts it as the winning error."
      - name: error_stale_version_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / combinatorial_finance_reserve_pinned_eval_order
          rationale: "ERR_STALE_VERSION is directly asserted by occ_finance_contract_stale_deal_version and occ_floorplan_line_stale_vehicle_version in §1.9."
      - name: error_ltv_exceeded_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_LTV_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_ltv_at_cap_vs_over_cap_on_fund
          rationale: "ERR_LTV_EXCEEDED is the over-cap branch of the LTV boundary §1.8 instance."
      - name: error_testdrive_overlap_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_TESTDRIVE_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlap_testdrive_halfopen_with_buffer
          rationale: "ERR_TESTDRIVE_OVERLAP is asserted by the half-open+buffer overlap §1.8 instance."
      - name: error_bay_overlap_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_BAY_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / overlap_repair_bay_closed_interval_no_buffer
          rationale: "ERR_BAY_OVERLAP is asserted by the closed-interval bay overlap §1.8 instance."
      - name: error_incentive_not_eligible_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_INCENTIVE_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_empty_incentive_eligible_set_on_apply
          rationale: "ERR_INCENTIVE_NOT_ELIGIBLE is the empty-set boundary §1.8 instance."
      - name: error_deal_not_funded_on_title_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEAL_NOT_FUNDED]", "validations[priority=10]"]
        distinguishing_aspect: "There is no path to a PENDING TitleRegistration without funding (it is cascade-created on fund), so the ERR_DEAL_NOT_FUNDED guard is asserted via a test-injected unfunded path is not reachable; instead assert the positive cross-entity gate."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_title_submit_requires_deal_funded
          rationale: "The Deal-FUNDED precondition on title submit is asserted positively by the §1.8 cross-entity instance; the negative branch is unreachable because PENDING title records only exist on funded deals."
