              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "PHX", metro_name: "Phoenix", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { m1: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "TUS", metro_name: "Tucson", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 2 }
              as: TourManager
              captures: { m2: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/routing-legs"
              payload: { from_market_id: "${m1}", to_market_id: "${m2}", travel_date: "2026-08-10", drive_miles: 440, leg_index: 1 }
              as: TourManager
              captures: { leg_a_min: $.data.drive_minutes, leg_a_rest: $.data.crew_rest_required }
            - call: "POST /tours/${tour_id}/routing-legs"
              payload: { from_market_id: "${m1}", to_market_id: "${m2}", travel_date: "2026-08-11", drive_miles: 441, leg_index: 2 }
              as: TourManager
              captures: { leg_b_min: $.data.drive_minutes, leg_b_rest: $.data.crew_rest_required }
          assert:
            - "leg_a_min == 480 and leg_a_rest == false (at boundary, strict >)"
            - "leg_b_min == 481 and leg_b_rest == true (481 > 480)"

  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: show_confirm_depends_on_tour_posture
        grounds:
          - state_machines.Show.HOLD_PLACED_to_CONFIRMED
          - entities.Tour.fields.posture
          - errors[ERR_POSTURE_NOT_OPEN]
        distinguishing_aspect: |
          Show→CONFIRMED requires Tour.posture==OPEN. When a CRITICAL
          ComplianceHold flips Tour.posture to FROZEN, an otherwise valid show
          confirm fails. Cross-entity pair: Show depends on Tour.
        test_recipe:
          setup:
            - "Show S in HOLD_PLACED"
            - "Tour has an ACTIVE CRITICAL ComplianceHold → posture=FROZEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TXD1", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "SF", metro_name: "San Francisco", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Chase", capacity: 1800, base_rent_cents: 400000, curfew_local_time: "23:00", available_dates: ["2026-08-05"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-05", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 9000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1500000, versus_pct: 80 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "POST /tours/${tour_id}/compliance-holds"
              payload: { hold_kind: "ADVANCE_OVERDUE", severity: "CRITICAL", reason: "manual" }
              as: TourManager
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_POSTURE_NOT_OPEN (Show confirm gated by Tour.posture)"

      - name: settlement_verify_depends_on_show_performed
        grounds:
          - state_machines.Settlement.SUBMITTED_to_VERIFIED
          - entities.Show.fields.status
          - errors[ERR_SHOW_NOT_PERFORMED]
        distinguishing_aspect: |
          Settlement→SUBMITTED requires Show.status==PERFORMED. Submitting
          against a show still in ADVANCED fails. Different entity pair from
          sibling instance: Settlement depends on Show (not Show on Tour).
        test_recipe:
          setup:
            - "Show in ADVANCED (not yet PERFORMED)"
            - "Attempt to submit settlement"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TXD2", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "POR", metro_name: "Portland", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Moda", capacity: 1900, base_rent_cents: 400000, curfew_local_time: "23:00", available_dates: ["2026-08-08"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-08", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 7500 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1200000, versus_pct: 80 }
              as: Promoter
              captures: { hold_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${show_id}/confirm"
              payload: { expected_tour_version: "${tv}" }
              as: TourManager
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/tech_rider/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr1: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/tech_rider/approve"
              payload: { expected_packet_revision: "${pr1}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/hospitality/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr2: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/hospitality/approve"
              payload: { expected_packet_revision: "${pr2}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/immigration/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr3: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/immigration/approve"
              payload: { expected_packet_revision: "${pr3}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance"
              payload: {}
              as: TourManager
          trigger:
            # Show is ADVANCED, not PERFORMED — submit must fail
            - call: "POST /tours/${tour_id}/shows/${show_id}/settlement/submit"
              payload: { box_office_gross_cents: 1500000, taxes_cents: 100000, facility_fees_cents: 50000, promoter_expenses_cents: 100000 }
              as: Promoter
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SHOW_NOT_PERFORMED (Settlement submit gated by Show.status)"

  # -------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_booked_dates_point_membership
        grounds:
          - entities.Venue.fields.booked_dates
          - errors[ERR_VENUE_UNAVAILABLE]
          - validations[priority=8]
        distinguishing_aspect: |
          Venue overlap semantics are POINT membership (exact date equality in
          booked_dates array). A second show on the same date fails; the next
          calendar day succeeds even though the dates are adjacent (no buffer).
        test_recipe:
          setup:
            - "Venue V available 2026-08-01 and 2026-08-02"
            - "Show S1 confirmed on 2026-08-01"
            - "Show S2 attempts confirm on 2026-08-01 (point collision — must fail)"
            - "Show S3 attempts confirm on 2026-08-02 (adjacent — must pass)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TOv1", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-09-01" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "MIN", metro_name: "Minneapolis", country_code: "US", radius_miles: 30, exclusivity_window_days: 7, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "FirstAve", capacity: 1500, base_rent_cents: 200000, curfew_local_time: "23:00", available_dates: ["2026-08-01", "2026-08-02"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            # S1 on 2026-08-01
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { s1: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s1}/holds"
              payload: { promoter_name: "P", guarantee_cents: 500000, versus_pct: 70 }
              as: Promoter
              captures: { h1: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s1}/holds/${h1}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${s1}/confirm"
              payload: { expected_tour_version: "${tv1}" }
              as: TourManager
            # S2 same date — must fail (point collision)
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { s2: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s2}/holds"
              payload: { promoter_name: "P", guarantee_cents: 500000, versus_pct: 70 }
              as: Promoter
              captures: { h2: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s2}/holds/${h2}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
            # S3 adjacent date — must pass (no buffer)
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-02", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 5000 }
              as: TourManager
              captures: { s3: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s3}/holds"
              payload: { promoter_name: "P", guarantee_cents: 500000, versus_pct: 70 }
              as: Promoter
              captures: { h3: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s3}/holds/${h3}/accept"
              payload: {}
              as: Promoter
          trigger:
            - call: "POST /tours/${tour_id}/shows/${s2}/confirm"
              payload: { expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { err2: $.data.error_id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv3: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${s3}/confirm"
              payload: { expected_tour_version: "${tv3}" }
              as: TourManager
              captures: { s3_status: $.data.status }
          assert:
            - "err2 == ERR_VENUE_UNAVAILABLE (same-date point collision)"
            - "s3_status == CONFIRMED (adjacent date allowed; point semantics, no buffer)"

      - name: radius_clause_half_open_window
        grounds:
          - calculations.radius_clause_check
          - errors[ERR_RADIUS_CONFLICT]
        distinguishing_aspect: |
          Radius-clause interval semantics are HALF-OPEN: |date_diff| <= window
          is a conflict; |date_diff| == window+1 is OK. Different interval
          arithmetic from venue point-membership (which uses exact equality on
          a singleton date, not a day-range window). Different resource entity
          (Market vs Venue).
        test_recipe:
          setup:
            - "Markets M1 (radius 60, window 30) and M2 (radius 60, window 30) within 100 miles"
            - "Show S1 confirmed in M1 on 2026-08-01"
            - "Show S2 attempts confirm in M2 on 2026-08-31 (diff=30 → conflict, CRITICAL severity triggers ERR_RADIUS_CONFLICT)"
            - "Show S3 attempts confirm in M2 on 2026-09-01 (diff=31 → no conflict, but venue date must exist)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TourManager
            - call: "POST /tours"
              payload: { tour_name: "TOv2", artist_name: "A", window_start_date: "2026-07-01", window_end_date: "2026-10-15" }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "BOS", metro_name: "Boston", country_code: "US", radius_miles: 60, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { m1: $.data.id }
            - call: "POST /tours/${tour_id}/markets"
              payload: { market_code: "PROV", metro_name: "Providence", country_code: "US", radius_miles: 60, exclusivity_window_days: 30, territory_rank: 2 }
              as: TourManager
              captures: { m2: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${m1}", venue_name: "TDG", capacity: 1800, base_rent_cents: 300000, curfew_local_time: "23:00", available_dates: ["2026-08-01"] }
              as: TourManager
              captures: { v1: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${m2}", venue_name: "PPAC", capacity: 1200, base_rent_cents: 200000, curfew_local_time: "23:00", available_dates: ["2026-08-31", "2026-09-01"] }
              as: TourManager
              captures: { v2: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            # S1 in M1 on 2026-08-01
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${m1}", venue_id: "${v1}", show_date: "2026-08-01", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 7000 }
              as: TourManager
              captures: { s1: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s1}/holds"
              payload: { promoter_name: "P", guarantee_cents: 800000, versus_pct: 75 }
              as: Promoter
              captures: { h1: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s1}/holds/${h1}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv1: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${s1}/confirm"
              payload: { expected_tour_version: "${tv1}" }
              as: TourManager
            # S2 at exactly +30 days → conflict
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${m2}", venue_id: "${v2}", show_date: "2026-08-31", on_sale_at: "2026-07-15T00:00:00Z", avg_ticket_price_cents: 7000 }
              as: TourManager
              captures: { s2: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s2}/holds"
              payload: { promoter_name: "P", guarantee_cents: 800000, versus_pct: 75 }
              as: Promoter
              captures: { h2: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s2}/holds/${h2}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv2: $.data.version }
            # S3 at +31 days → no conflict
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${m2}", venue_id: "${v2}", show_date: "2026-09-01", on_sale_at: "2026-07-15T00:00:00Z", avg_ticket_price_cents: 7000 }
              as: TourManager
              captures: { s3: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s3}/holds"
              payload: { promoter_name: "P", guarantee_cents: 800000, versus_pct: 75 }
              as: Promoter
              captures: { h3: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${s3}/holds/${h3}/accept"
              payload: {}
              as: Promoter
          trigger:
            - call: "POST /tours/${tour_id}/shows/${s2}/confirm"
              payload: { expected_tour_version: "${tv2}" }
              as: TourManager
              captures: { err2: $.data.error_id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tv3: $.data.version }
            - call: "POST /tours/${tour_id}/shows/${s3}/confirm"
              payload: { expected_tour_version: "${tv3}" }
              as: TourManager
              captures: { s3_status: $.data.status }
          assert:
            - "err2 == ERR_RADIUS_CONFLICT (diff=30, half-open window includes 30)"
            - "s3_status == CONFIRMED (diff=31 outside half-open window)"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: venue_booked_dates_conserved_across_confirm_cancel
        grounds:
