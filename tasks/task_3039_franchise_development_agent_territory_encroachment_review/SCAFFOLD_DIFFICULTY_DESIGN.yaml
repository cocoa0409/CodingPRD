# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3039_franchise_development_agent_territory_encroachment_review
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: impact_study_provisional_vs_final_variants_diverge
        grounds:
          - calculations.projected_sales_impact
          - entities.ImpactStudy.fields.provisional_impact_cents
          - entities.ImpactStudy.fields.final_impact_cents
        distinguishing_aspect: |
          Same study, same store, same distance bucket: the provisional variant
          prices diversion off Store.estimated_weekly_sales_cents (5,000,000 ->
          350,000 at 7%) while the final variant prices it off
          actual_avg_weekly_sales_cents (4,000,000 -> 280,000) — identical inputs,
          two valid algorithms, different cents, in the ImpactStudy domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory T (royalty 0.08) assigned to agent DA; franchisee FR1 owns OPEN store S1 at geo (40.000,-75.000) with estimated_weekly_sales_cents=5000000 and actual_avg_weekly_sales_cents=4000000."
            - "Site application A by DA for franchisee FR2 at (40.012,-75.000) submitted and in IMPACT_REVIEW with a PROVISIONAL study (radius 2.0 miles)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-NE-01", region: "North East", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "Keystone Development Partners", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "Franchisee One LLC", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Franchisee Two LLC", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-1001", territory_id: "${terr_id}", franchisee_id: "${fr1_id}", address: "1 Main St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 5000000, actual_avg_weekly_sales_cents: 4000000 }
              as: FranchisorOps
              captures: { store1_id: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2_id}", proposed_address: "9 Oak Ave", proposed_lat: 40.012, proposed_lng: -75.0, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /site-applications/${app_id}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /impact-studies/${study_id}/finalize"
              payload: {}
              as: FranchisorOps
          assert:
            - "ImpactStudy.${study_id}.affected_store_count == 1 (Manhattan distance 0.012 deg -> 7% bucket)"
            - "ImpactStudy.${study_id}.provisional_impact_cents == 350000"
            - "ImpactStudy.${study_id}.final_impact_cents == 280000"
            - "ImpactStudy.${study_id}.provisional_impact_cents != ImpactStudy.${study_id}.final_impact_cents"
            - "ImpactStudy.${study_id}.status == FINAL"

      - name: fee_statement_provisional_vs_final_variants_diverge
        grounds:
          - calculations.fee_split
          - entities.FeeStatement.fields.variant
          - entities.FeeStatement.fields.gross_fees_cents
        distinguishing_aspect: |
          Same agent, territory, and 4-week period: the provisional estimate is
          forward-looking and includes the PIPELINE store's estimated sales
          (960,000 gross) while final reconciliation is chronological over OPEN
          stores' actuals only (320,000 gross) — a dual variant in the
          FeeStatement domain, distinct from the ImpactStudy domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory T (royalty 0.08) assigned to agent DA."
            - "Store S1 OPEN with actual 1,000,000/week; store S2 PIPELINE with estimated 2,000,000/week (created via an approved site application)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-NE-02", region: "North East", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "Keystone Development Partners", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "Franchisee One LLC", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Franchisee Two LLC", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-2001", territory_id: "${terr_id}", franchisee_id: "${fr1_id}", address: "1 Main St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2_id}", proposed_address: "50 Far Rd", proposed_lat: 41.5, proposed_lng: -76.5, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /site-applications/${app_id}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { study_id: $.data.id }
            - call: "POST /impact-studies/${study_id}/finalize"
              payload: {}
              as: FranchisorOps
            - call: "POST /site-applications/${app_id}/approve"
              payload: {}
              as: FranchisorOps
              captures: { pipeline_store_id: $.data.store_id }
          trigger:
            - call: "POST /fee-statements/generate"
              payload: { development_agent_id: "${da_id}", territory_id: "${terr_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-29T00:00:00Z" }
              as: FranchisorOps
              captures: { stmt_id: $.data.id }
            - call: "POST /fee-statements/${stmt_id}/finalize"
              payload: {}
              as: FranchisorOps
          assert:
            - "before finalize, FeeStatement.${stmt_id}.gross_fees_cents == 960000 (OPEN 1,000,000 + PIPELINE 2,000,000) x 0.08 x 4 weeks"
            - "before finalize, FeeStatement.${stmt_id}.variant == PROVISIONAL_ESTIMATE"
            - "after finalize, FeeStatement.${stmt_id}.gross_fees_cents == 320000 (OPEN store only: 1,000,000 x 0.08 x 4)"
            - "after finalize, FeeStatement.${stmt_id}.variant == FINAL_RECONCILIATION"
            - "FeeStatement.${stmt_id}.da_share_cents == 128000 (tier 0.40 with 2 territory stores)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: inspection_score_per_line_rounding_order
        grounds:
          - calculations.inspection_final_score
          - entities.Inspection.fields.final_score
        distinguishing_aspect: |
          Mode (b) nested rounding: per-category weighted rounding then sum gives
          35.02 + 23.00 + 24.35 = 82.37, whereas sum-then-round would give 82.36 —
          the scaffold pins per-line rounding, and the two orders differ by exactly
          0.01 on these inputs.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory with OPEN store S1; inspection I1 SCHEDULED with inspector_ref 'insp-1'."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-NE-03", region: "North East", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Franchisee One LLC", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1_id: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-3001", territory_id: "${terr_id}", franchisee_id: "${fr1_id}", address: "1 Main St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { store1_id: $.data.id }
            - call: "POST /inspections"
              payload: { store_id: "${store1_id}", scheduled_on: "2026-09-02T00:00:00Z", inspector_ref: "insp-1" }
              as: FranchisorOps
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /inspections/${insp_id}/record-findings"
              payload: { food_safety_score: 87.55, cleanliness_score: 76.65, operations_score: 81.15, critical_violations: 0 }
              as: Inspector
              as_user_id: "insp-1"
          assert:
            - "Inspection.${insp_id}.final_score == 82.37 (87.55*0.40=35.02, 76.65*0.30=22.995->23.00, 81.15*0.30=24.345->24.35; sum 82.37)"
            - "Inspection.${insp_id}.final_score != 82.36 (the sum-then-round alternative)"
            - "Inspection.${insp_id}.status == CONDUCTED"

      - name: promotion_funding_tier_evaluation_order
        grounds:
          - calculations.promotion_funding_allocation
          - entities.Promotion.fields.store_share_cents
          - entities.Promotion.fields.total_pool_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the subsidy tier is keyed on the
          participating count N while the pool is N times the tier-discounted
          share; the pinned order (count -> tier -> share -> pool) yields
          share 180,000 and pool 1,080,000 at N=6, which no other evaluation
          order reproduces.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory with six OPEN stores (S1..S6) owned by six franchisees."
            - "Promotion P (base_cost_per_store_cents 200,000, voting window 2026-09-01..2026-09-10) in VOTING with six live FOR ballots."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-NE-04", region: "North East", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F1 LLC", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F2 LLC", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F3 LLC", contact_email: "f3@example.com" }
              as: FranchisorOps
              captures: { fr3: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F4 LLC", contact_email: "f4@example.com" }
              as: FranchisorOps
              captures: { fr4: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F5 LLC", contact_email: "f5@example.com" }
              as: FranchisorOps
              captures: { fr5: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "F6 LLC", contact_email: "f6@example.com" }
              as: FranchisorOps
              captures: { fr6: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-4001", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 A St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-4002", territory_id: "${terr_id}", franchisee_id: "${fr2}", address: "2 A St", geo_lat: 40.1, geo_lng: -75.1, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-4003", territory_id: "${terr_id}", franchisee_id: "${fr3}", address: "3 A St", geo_lat: 40.2, geo_lng: -75.2, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st3: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-4004", territory_id: "${terr_id}", franchisee_id: "${fr4}", address: "4 A St", geo_lat: 40.3, geo_lng: -75.3, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st4: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-4005", territory_id: "${terr_id}", franchisee_id: "${fr5}", address: "5 A St", geo_lat: 40.4, geo_lng: -75.4, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st5: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S-4006", territory_id: "${terr_id}", franchisee_id: "${fr6}", address: "6 A St", geo_lat: 40.5, geo_lng: -75.5, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { st6: $.data.id }
            - call: "POST /promotions"
              payload: { name: "Fall Feast", voting_open: "2026-09-01T00:00:00Z", voting_close: "2026-09-10T00:00:00Z", active_start: "2026-10-01T00:00:00Z", active_end: "2026-11-01T00:00:00Z", base_cost_per_store_cents: 200000 }
              as: FranchisorOps
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/open-voting"
              payload: {}
              as: FranchisorOps
            - call: "POST /promotions/${promo_id}/votes"
              payload: { store_id: "${st1}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr1}"
            - call: "POST /promotions/${promo_id}/votes"
              payload: { store_id: "${st2}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr2}"
            - call: "POST /promotions/${promo_id}/votes"
              payload: { store_id: "${st3}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr3}"
            - call: "POST /promotions/${promo_id}/votes"
              payload: { store_id: "${st4}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr4}"
            - call: "POST /promotions/${promo_id}/votes"
              payload: { store_id: "${st5}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr5}"
            - call: "POST /promotions/${promo_id}/votes"
              payload: { store_id: "${st6}", ballot: "FOR" }
              as: Franchisee
              as_user_id: "${fr6}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /promotions/${promo_id}/close-voting"
              payload: {}
              as: FranchisorOps
          assert:
            - "Promotion.${promo_id}.status == APPROVED"
            - "Promotion.${promo_id}.participating_store_count == 6"
            - "Promotion.${promo_id}.store_share_cents == 180000 (200,000 x (1 - 0.10) mid tier for 6 <= N <= 11)"
            - "Promotion.${promo_id}.total_pool_cents == 1080000 (6 x 180,000)"
            - "Promotion.${promo_id}.eligible_voter_count == 6"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: site_application_revision_cycle
        grounds:
          - state_machines.SiteApplication.transitions.IMPACT_REVIEW_to_REVISION_REQUESTED
          - state_machines.SiteApplication.transitions.REVISION_REQUESTED_to_SUBMITTED
          - entities.SiteApplication.fields.revision_count
        distinguishing_aspect: |
          SiteApplication runs a true cycle IMPACT_REVIEW -> REVISION_REQUESTED ->
          SUBMITTED -> IMPACT_REVIEW with revision_count incrementing per loop and
          the prior PROVISIONAL study voided on resubmission — a cyclic machine on
          the SiteApplication entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Assigned territory, DA, applicant franchisee; application submitted with a PROVISIONAL study (IMPACT_REVIEW)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-NE-05", region: "North East", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "F2 LLC", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2_id: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2_id}", proposed_address: "9 Oak Ave", proposed_lat: 40.012, proposed_lng: -75.0, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /site-applications/${app_id}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { study1_id: $.data.id }
            - call: "POST /site-applications/${app_id}/request-revision"
              payload: { revision_notes: "Traffic study insufficient" }
              as: FranchisorOps
          trigger:
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
          assert:
            - "SiteApplication.${app_id}.status == SUBMITTED after the resubmission (cycle closed)"
            - "SiteApplication.${app_id}.revision_count == 1"
            - "ImpactStudy.${study1_id}.status == VOID"
            - "a second POST /site-applications/${app_id}/impact-studies succeeds and the application returns to IMPACT_REVIEW with a fresh PROVISIONAL study"

      - name: protest_mediation_branching_divergent_outcomes
        grounds:
          - state_machines.Protest.transitions.MEDIATION_to_RESOLVED_UPHELD
          - state_machines.Protest.transitions.UNDER_REVIEW_to_RESOLVED_REJECTED
          - state_machines.SiteApplication.transitions.PROTESTED_to_REJECTED
          - state_machines.SiteApplication.transitions.PROTESTED_to_APPROVED
        distinguishing_aspect: |
          Protest is a branching fork: the UPHELD branch rejects the application
          and terminates its PIPELINE store, while the REJECTED branch restores
          the application to APPROVED with the store intact — divergent
          side-effect sets on a different entity than SiteApplication.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Two assigned territories each with an APPROVED application (A1 in T1, A2 in T2), each producing a PIPELINE store; each has an OPEN protester store owned by another franchisee."
            - "T1's protest goes UNDER_REVIEW -> MEDIATION -> outcome UPHELD; T2's protest is resolved REJECTED directly from UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-B1", region: "Branch One", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { t1: $.data.id }
            - call: "POST /territories"
              payload: { code: "T-B2", region: "Branch Two", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { t2: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${t1}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "POST /territories/${t2}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${t1}"
              payload: {}
              as: FranchisorOps
              captures: { t1_v: $.data.version }
            - call: "GET /territories/${t2}"
              payload: {}
              as: FranchisorOps
              captures: { t2_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "Protester One", contact_email: "p1@example.com" }
              as: FranchisorOps
              captures: { p1: $.data.id }
