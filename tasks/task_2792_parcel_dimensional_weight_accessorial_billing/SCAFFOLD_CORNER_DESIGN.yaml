                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-B-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pa: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-B-0002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { pb: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-B-0003", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { pc: $.data.id, pc_v: $.data.version }
            - call: "POST /shipments/${pc}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 21, scanned_weight_lbs: 30.0, expected_shipment_version: "${pc_v}" }
              as: CarrierOps
            - call: "POST /shipments/${pa}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${pc}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-08-02T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-B-0004", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
