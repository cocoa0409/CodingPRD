        distinguishing_aspect: |
          Numeric threshold metric on the confirm endpoint: a window_start at exactly 17:00 UTC sets
          after_hours=true (cutoff is >=17), so a single base-10000 flat-rate line prices at 15000
          (10000*1.5), distinct from the normal-hours 10000 — proving >= not > at the boundary hour.
        test_recipe:
          setup:
            - "Flat-rate item base 10000; job with a confirmed assignment whose window_start is exactly 2026-06-15T17:00:00Z; technician on site; estimate has the single FLAT_RATE line."
