              payload: {}
              as: OperationsCoordinator
            - call: "POST /clients/${client_1}/transactions"
              payload: {}
              as: TransactionCoordinator
              captures: { tx_1: $.data.id }
            - call: "POST /transactions/${tx_1}/coordination"
              payload: { coordination_status: "REVIEW", contract_price_cents: 70000000 }
              as: TransactionCoordinator
            - call: "POST /transactions/${tx_1}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /transactions/${tx_1}/surveys"
              payload: { agent_id: "${agent_id}" }
              as: TransactionCoordinator
              captures: { survey_1: $.data.id }
          trigger:
            - call: "POST /surveys/${survey_1}/respond"
              payload: { score: 5 }
