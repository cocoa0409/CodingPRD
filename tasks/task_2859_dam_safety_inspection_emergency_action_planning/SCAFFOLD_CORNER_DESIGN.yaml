# =============================================================================
# §1.9 Scaffold Corner Design (Breadth / Claim-Extraction Index)
# task_2859_dam_safety_inspection_emergency_action_planning
#
# One block per applicable section of references/claim-extraction-guide.md, walked
# against this scaffold's §1.1-§1.7 surface. Every instance either carries a full
# test_recipe whose setup_api_calls chain drives an empty database into the corner
# using only §1.5 endpoints, or an excluded_because stub naming the §1.8 instance
# that already exercises the corner.
#
# Shared bootstrap referenced by most recipes:
#   POST /_clock/set_current_utc  -> logical clock 2026-08-01T00:00:00Z
#   POST /owners                  -> Cascade Hydro LLC (bond 50,000,000 cents)
#   POST /engineers               -> Dana Reyes  PE-44120, certified LOW/SIGNIFICANT/HIGH
#   POST /engineers               -> Priya Nair  PE-55210, certified SIGNIFICANT/HIGH
#   POST /river-reaches           -> Little Bear Creek Reach 3, 1200 cfs
#   POST /dams                    -> Elk Hollow Dam ST00123, crest 1042.5 ft,
#                                    gross 1500 acre-ft, registered_at 2019-04-15
#
# Assessment fixtures (all on Elk Hollow Dam):
#   A1  PAR 3,   struct 2,  fac 0,  travel 200, area 50,  map IM-2019-A
#         -> screening 9.00 / SIGNIFICANT, certified 6.60 / SIGNIFICANT
#   A2  PAR 12,  struct 4,  fac 0,  travel 20,  area 300, map IM-2026-B
#         -> screening 30.00 / SIGNIFICANT, certified 45.00 / HIGH
#   A3  PAR 0,   struct 0,  fac 0,  travel 200, area 50,  map IM-2019-C
#         -> screening 0.00 / LOW, certified 0.00 / LOW
#   A4  PAR 100, struct 40, fac 10, travel 10,  area 900, map IM-2026-D
#         -> screening 95.00 / HIGH, certified 100.00 / HIGH (every component capped)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: owner_creation_populates_system_and_default_fields
        claim_type: creation
        grounds:
          - entities.Owner
          - endpoints[POST /owners]
          - endpoints[GET /owners/{id}/fee-ledger-entries]
          - calculations.owner_fee_balance_and_delinquency
        distinguishing_aspect: |
          Plain 201 creation of the fiscal aggregate root: the four input fields echo back and
          every computed/system field lands on its declared default (fee_balance_cents 0,
          delinquency_status CURRENT, registered_dam_count 0, version 1) with no ledger row.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          assert:
            - "HTTP 201 with response_type == object"
            - "Owner.${owner_id}.legal_name == Cascade Hydro LLC, owner_type == PRIVATE, contact_email == ops@cascadehydro.example"
            - "Owner.${owner_id}.financial_assurance_bond_cents == 50000000"
            - "Owner.${owner_id}.fee_balance_cents == 0 and delinquency_status == CURRENT"
            - "Owner.${owner_id}.registered_dam_count == 0"
            - "Owner.${owner_id}.id is a non-empty string, created_at == 2026-08-01T00:00:00Z, version == 1"
            - "GET /owners/${owner_id}/fee-ledger-entries returns total_count 0"

      - name: dam_retrieval_returns_stored_inputs_and_derived_program_state
        claim_type: retrieval
        grounds:
          - entities.Dam
          - endpoints[GET /dams/{id}]
          - calculations.inspection_due_schedule
          - calculations.drawdown_volume_conservation
        distinguishing_aspect: |
          A never-inspected, never-classified dam read back by an Engineer: stored inputs echo
          verbatim while the four derived program fields are computed from registered_at and the
          UNCLASSIFIED 60-month interval, so next_inspection_due_at is 2024-04-15 and the dam is
          already overdue against the 2026-08-01 clock.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner, one engineer, one reach, one dam registered 2019-04-15 with no assessments and no inspections."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
          trigger:
            - call: "GET /dams/${dam_id}"
              payload: {}
              as: Engineer
              as_user_id: "${eng_a_id}"
          assert:
            - "HTTP 200; owner_id == ${owner_id} and river_reach_id == ${reach_id}"
            - "Dam.${dam_id}.nid_code == ST00123, height_ft == 62, gross_storage_acre_ft == 1500, crest_elevation_ft == 1042.5"
            - "Dam.${dam_id}.hazard_class == UNCLASSIFIED and current_consequence_score is null"
            - "Dam.${dam_id}.safety_status == UNRATED and regulatory_status == REGISTERED"
            - "Dam.${dam_id}.next_inspection_due_at == 2024-04-15T00:00:00Z"
            - "Dam.${dam_id}.inspection_overdue == true"
            - "Dam.${dam_id}.open_deficiency_count == 0, latest_eap_status == NONE, eap_required == false"
            - "Dam.${dam_id}.committed_drawdown_acre_ft == 0.000 and available_conservation_storage_acre_ft == 1500.000"
            - "Dam.${dam_id}.version == 1"

      - name: dam_listing_is_paginated_and_ordered_by_created_at
        claim_type: listing
        grounds:
          - endpoints[GET /dams]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three dams created in a known order: limit/offset windows return them by created_at ASC
          (never by id), total_count stays 3 across pages and has_more flips false only on the
          final page. The owner_id filter narrows the same list without changing the ordering.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner, one reach, three dams created in the order ST00123, ST00124, ST00125."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam1_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Bitter Fork Dam", nid_code: "ST00124", height_ft: 40, gross_storage_acre_ft: 600, crest_elevation_ft: 980.0, normal_pool_elevation_ft: 976.0, year_completed: 1974, registered_at: "2020-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam2_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Cedar Notch Dam", nid_code: "ST00125", height_ft: 55, gross_storage_acre_ft: 5000, crest_elevation_ft: 1105.0, normal_pool_elevation_ft: 1100.0, year_completed: 1981, registered_at: "2021-03-10T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam3_id: "$.data.id" }
          trigger:
            - call: "GET /dams"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /dams"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /dams"
              payload: { owner_id: "${owner_id}", hazard_class: "UNCLASSIFIED" }
              as: ProgramAdmin
          assert:
            - "first page: response_type == array, 2 rows, data[0].id == ${dam1_id}, data[1].id == ${dam2_id}"
            - "first page: total_count == 3 and has_more == true"
            - "second page: 1 row, data[0].id == ${dam3_id}, total_count == 3, has_more == false"
            - "filtered call: 3 rows in the same created_at ASC order, total_count == 3, has_more == false"
            - "no page ever reorders by id; limit and offset are echoed as requested"

      - name: dam_fetch_with_unknown_id_returns_dam_not_found
        claim_type: not_found
        grounds:
          - validations[priority 4]
          - errors[ERR_DAM_NOT_FOUND]
          - endpoints[GET /dams/{id}]
        distinguishing_aspect: |
          A syntactically valid but unknown path id on a read endpoint resolves to the dam-specific
          404 (not a generic 404 and not ERR_INVALID_REQUEST), and the same id on the
          compliance-summary read behaves identically.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no dams exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /dams/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ProgramAdmin
            - call: "GET /dams/00000000-0000-4000-8000-0000000000ff/compliance-summary"
              payload: {}
              as: ProgramAdmin
          assert:
            - "both calls return HTTP 404 with response_type == error"
            - "data.error_id == ERR_DAM_NOT_FOUND on both calls"
            - "GET /dams still reports total_count 0"

      - name: dam_creation_missing_required_nid_code_and_invalid_enum_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /dams]
          - endpoints[POST /owners]
          - endpoints[POST /inspections]
        distinguishing_aspect: |
          Priority 3 fires ahead of every existence, state and business rule: a dam body missing
          nid_code, an owner body with an out-of-range owner_type enum and an inspection whose
          window_start is not before window_end all return 400 ERR_INVALID_REQUEST - the
          inspection case even though the target dam is UNCLASSIFIED (priority 25 never runs).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner, one engineer, one reach and one UNCLASSIFIED dam."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
          trigger:
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Nameless Dam", height_ft: 30, gross_storage_acre_ft: 200, crest_elevation_ft: 900.0, normal_pool_elevation_ft: 896.0, year_completed: 1990, registered_at: "2022-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Bad Enum Holdings", owner_type: "MUNICIPAL_UTILITY_XYZ", contact_email: "x@example.test", financial_assurance_bond_cents: 1000 }
              as: ProgramAdmin
            - call: "POST /inspections"
              payload: { dam_id: "${dam_id}", engineer_id: "${eng_a_id}", inspection_type: "PERIODIC", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ProgramAdmin
          assert:
            - "all three calls return HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the inspection call returns ERR_INVALID_REQUEST, never ERR_DAM_UNCLASSIFIED"
            - "GET /dams reports total_count 1 and GET /owners reports total_count 1"
            - "GET /inspections reports total_count 0"

      - name: optional_fee_adjustment_memo_and_source_ref_default_to_null
        claim_type: defaults
        grounds:
          - entities.FeeLedgerEntry.fields.memo
          - entities.FeeLedgerEntry.fields.source_ref
          - endpoints[POST /owners/{id}/fee-adjustments]
          - calculations.owner_fee_balance_and_delinquency
        distinguishing_aspect: |
          Only the two mandatory ledger inputs are sent: the omitted optional memo and source_ref
          come back null rather than as empty strings, while sequence_no, balance_after_cents and
          the owner rollup are still written. 5,000 cents stays under the 25,000 threshold, so the
          owner remains CURRENT.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one owner with an empty ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "ANNUAL_REGISTRATION_FEE", amount_cents: 5000 }
              as: ProgramAdmin
          assert:
            - "HTTP 201; memo is null and source_ref is null"
            - "sequence_no == 1 and balance_after_cents == 5000"
            - "Owner.${owner_id}.fee_balance_cents == 5000 and delinquency_status == CURRENT"
            - "GET /owners/${owner_id}/fee-ledger-entries returns total_count 1"

      - name: engineer_license_status_recomputes_to_expired_as_the_clock_advances
        claim_type: computed_fields
        grounds:
          - entities.Engineer.fields.license_status
          - validations[priority 20]
          - endpoints[GET /engineers/{id}]
          - endpoints[GET /engineers]
        distinguishing_aspect: |
          license_status is derived from license_expires_at against the logical clock, never
          supplied by the client, and the comparison is strict: at a clock exactly equal to
          license_expires_at the licence already reads EXPIRED and the license_status filter
          returns the engineer.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One engineer whose licence expires 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /engineers"
              payload: { full_name: "Marta Lund", license_number: "PE-66301", license_expires_at: "2026-09-01T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT"] }
              as: ProgramAdmin
              captures: { eng_x_id: "$.data.id" }
            - call: "GET /engineers/${eng_x_id}"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /engineers/${eng_x_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /engineers"
              payload: { license_status: "EXPIRED" }
              as: ProgramAdmin
          assert:
            - "at clock 2026-08-01T00:00:00Z the engineer reads license_status == ACTIVE"
            - "at clock 2026-09-01T00:00:00Z, exactly equal to license_expires_at, the engineer reads license_status == EXPIRED"
            - "the EXPIRED filter returns total_count 1 with data[0].id == ${eng_x_id}"
            - "Engineer.${eng_x_id}.open_inspection_count == 0 throughout"

      - name: fee_ledger_sequence_balance_and_poster_are_system_assigned
        claim_type: system_fields
        grounds:
          - entities.FeeLedgerEntry.fields.sequence_no
          - entities.FeeLedgerEntry.fields.balance_after_cents
          - entities.FeeLedgerEntry.fields.posted_by_user_id
          - calculations.owner_fee_balance_and_delinquency
          - endpoints[GET /owners/{id}/fee-ledger-entries]
        distinguishing_aspect: |
          Two manual adjustments in a known order: sequence_no is assigned 1 then 2 by the server,
          balance_after_cents is the running total 20000 then 30000, and posted_by_user_id records
          the acting X-User-ID. The second entry crosses the 25,000-cent threshold, so the owner
          rollup flips DELINQUENT in the same request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one owner with an empty ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "ANNUAL_REGISTRATION_FEE", amount_cents: 20000, memo: "2026 registration" }
              as: ProgramAdmin
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "PERMIT_REVIEW_FEE", amount_cents: 10000, source_ref: "manual-adj-2" }
              as: ProgramAdmin
            - call: "GET /owners/${owner_id}/fee-ledger-entries"
              payload: {}
              as: ProgramAdmin
          assert:
            - "first entry: sequence_no == 1, balance_after_cents == 20000, posted_by_user_id == the acting ProgramAdmin X-User-ID"
            - "second entry: sequence_no == 2, balance_after_cents == 30000"
            - "Owner.${owner_id}.fee_balance_cents == 30000 and delinquency_status == DELINQUENT"
            - "the ledger list returns 2 rows ordered by sequence_no ASC with total_count == 2"
            - "no ledger row carries a client-supplied sequence_no or balance_after_cents"

      - name: elevation_reading_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.ElevationReading
          - calculations.reading_freeboard_and_alert
          - endpoints[POST /high-water-events/{id}/readings]
          - endpoints[GET /high-water-events/{id}/readings]
        distinguishing_aspect: |
          ElevationReading is declared common_fields false: there is no update endpoint and no
          version field, and a later reading on the same event cannot alter the earlier row's
          computed freeboard_ft, alert_level or rising flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One owner, one reach, one dam with crest_elevation_ft 1042.5, and one MONITORING high-water event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
            - call: "POST /high-water-events"
              payload: { dam_id: "${dam_id}", declared_at: "2026-08-01T06:00:00Z", trigger_description: "Frontal system, rising inflow", declared_inflow_cfs: 300 }
              as: EmergencyCoordinator
              captures: { event_id: "$.data.id" }
          trigger:
            - call: "POST /high-water-events/${event_id}/readings"
              payload: { reading_at: "2026-08-01T07:00:00Z", pool_elevation_ft: 1040.0, observed_inflow_cfs: 320 }
              as: EmergencyCoordinator
            - call: "POST /high-water-events/${event_id}/readings"
              payload: { reading_at: "2026-08-01T08:00:00Z", pool_elevation_ft: 1039.0, observed_inflow_cfs: 300 }
              as: EmergencyCoordinator
            - call: "GET /high-water-events/${event_id}/readings"
              payload: {}
              as: ProgramAdmin
          assert:
            - "first reading: freeboard_ft == 2.50, alert_level == WATCH, rising == false"
            - "second reading: freeboard_ft == 3.50, alert_level == NORMAL, rising == false"
            - "neither reading response carries a version or updated_at field"
            - "the list returns 2 rows ordered by created_at ASC and the first row still reads freeboard_ft 2.50 / WATCH"
            - "HighWaterEvent.${event_id}.reading_count == 2, peak_pool_elevation_ft == 1040.0, status == MONITORING"
            - "no §1.5 endpoint exists that mutates or deletes an ElevationReading"

      - name: dam_creation_with_unknown_owner_id_returns_owner_not_found
        claim_type: foreign_key_validated
        grounds:
          - validations[priority 5]
          - errors[ERR_OWNER_NOT_FOUND]
          - errors[ERR_REACH_NOT_FOUND]
          - endpoints[POST /dams]
        distinguishing_aspect: |
          Flat topology means every body foreign key is validated independently: an unknown
          owner_id yields ERR_OWNER_NOT_FOUND and an unknown river_reach_id yields
          ERR_REACH_NOT_FOUND, each 404, and neither partially-created dam is persisted.
        test_recipe:
          setup:
