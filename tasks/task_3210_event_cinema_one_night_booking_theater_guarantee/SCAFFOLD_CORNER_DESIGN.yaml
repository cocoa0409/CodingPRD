          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/encore-windows
        distinguishing_aspect: "The second concurrency rule fires on a different write endpoint: an encore window created with a version captured before an intervening line add is refused 412, and only the current version is accepted."
        test_recipe:
          setup:
