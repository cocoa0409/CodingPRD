scenario: "P2P Small Business Lending (Funding Circle style): borrower scoring (Plaid data feed), tiered interest rates, investor portfolio diversification, default/Charge-off, repayment allocation, SEC compliance disclosure"
domain_name: p2p-small-business-lending
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by foreign keys: Borrower, LoanApplication, Loan,
  # Investor, Investment, Repayment, RepaymentAllocation, ComplianceDisclosure.
  # No nested-URL ownership tree; everything joins through FK ids.
  state_machine_shape: branching
  # LoanApplication forks SCORED -> {APPROVED, REJECTED}; Loan branches
  # REPAYMENT -> {PAID_OFF, DEFAULTED -> CHARGED_OFF} with divergent side effects.
  relationship_patterns:
    - one_to_many   # Loan -> Investment[], Loan -> Repayment[], Repayment -> RepaymentAllocation[]
    - cross_aggregate  # Investment references both Investor and Loan across aggregates
  role_model: segregation_of_duties
  # The Underwriter who scores an application cannot be the one who approves it
  # (SEC-style separation of duties); Borrower, Investor, Underwriter,
  # ComplianceOfficer, PlatformAdmin own distinct operations.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: legal name of the small business
      - name: ein
        type: string
        source: input
        description: employer identification number; unique across borrowers
        constraints: unique
      - name: state_code
        type: string
        source: input
        description: 2-letter US state of incorporation
      - name: status
        type: enum
        source: system
        description: lifecycle of the borrower account
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - name: borrower_id
        type: string
        source: input
        description: "FK -> Borrower.id; the applying business"
      - name: requested_principal_cents
        type: integer
        source: input
        description: requested loan amount in cents
        constraints: ">= 100000 and <= 50000000"
      - name: term_months
        type: integer
        source: input
        description: requested repayment term in months
        constraints: "one of {12, 24, 36, 60}"
      - name: plaid_avg_monthly_revenue_cents
        type: integer
        source: input
        description: average monthly revenue from the Plaid data feed snapshot
        constraints: ">= 0"
      - name: plaid_monthly_debt_payment_cents
        type: integer
        source: input
        description: existing monthly debt service from the Plaid data feed snapshot
        constraints: ">= 0"
      - name: plaid_nsf_count_90d
        type: integer
        source: input
        description: count of non-sufficient-funds events in last 90 days from Plaid
        constraints: ">= 0"
      - name: plaid_account_age_months
        type: integer
        source: input
        description: age of the primary bank account in months from Plaid
        constraints: ">= 0"
      - name: credit_score
        type: number
        source: computed
        description: weighted borrower score 0..100 from the Plaid snapshot (see score_borrower); null until SCORED
        default: null
      - name: risk_grade
        type: enum
        source: computed
        description: tier derived from credit_score; null until SCORED
        default: null
        constraints: "one of {A, B, C, D, F}"
      - name: offered_apr
        type: number
        source: computed
        description: annual interest rate set by risk_grade; null until SCORED or null when grade F
        default: null
      - name: scored_by_user_id
        type: string
        source: system
        description: X-User-ID of the Underwriter who scored the application; null until SCORED
        default: null
      - name: status
        type: enum
        source: system
        description: application lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SCORED, APPROVED, REJECTED}"

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> LoanApplication.id; the approved application this loan originates from"
      - name: borrower_id
        type: string
        source: system
        description: "FK -> Borrower.id; copied from the application at origination"
      - name: principal_cents
        type: integer
        source: system
        description: funding target in cents; copied from application.requested_principal_cents
      - name: apr
        type: number
        source: system
        description: locked annual rate; copied from application.offered_apr at origination
      - name: term_months
        type: integer
        source: system
        description: repayment term; copied from the application
      - name: committed_cents
        type: integer
        source: computed
        description: "sum of Investment.amount_cents for Investments on this Loan with status=COMMITTED; reconciled on every Investment create"
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: remaining principal owed; set to principal_cents at ACTIVE, debited by RepaymentAllocation principal+prepayment buckets
        default: 0
      - name: late_fee_outstanding_cents
        type: integer
        source: computed
        description: accrued unpaid late fees; raised by assess_late_fee, cleared by repayment late_fee bucket
        default: 0
      - name: current_period_index
        type: integer
        source: computed
        description: 1-based index of the next unpaid scheduled period; advances when a period's interest_due and principal_due are fully covered
        default: 0
      - name: missed_payment_count
        type: integer
        source: computed
        description: number of distinct scheduled periods that have been late-fee-assessed; drives the DEFAULT trigger at 3
        default: 0
      - name: last_assessed_period_index
        type: integer
        source: computed
        description: highest scheduled period index already late-fee-assessed; assess-late-fee always targets period (last_assessed_period_index + 1)
        default: 0
      - name: status
        type: enum
        source: system
        description: loan lifecycle state
        default: FUNDING
        constraints: "one of {FUNDING, ACTIVE, REPAYMENT, PAID_OFF, DEFAULTED, CHARGED_OFF}"
      - name: funded_at
        type: datetime
        source: system
        description: timestamp the loan reached fully-funded and disbursed; null until ACTIVE
        default: null

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: investor account name
      - name: capital_base_cents
        type: integer
        source: computed
        description: "deposited capital base used as the diversification-cap denominator; raised by POST /investors/{id}/deposit, written down on charge-off by the written-off investment's outstanding_principal_cents"
        default: 0
      - name: committed_capital_cents
        type: integer
        source: computed
        description: "sum of amount_cents over this Investor's Investments with status=COMMITTED across all Loans; reconciled on Investment create and zeroed-out per investment on charge-off write-off"
        default: 0
      - name: max_single_loan_pct
        type: number
        source: input
        description: diversification cap; a single loan's committed exposure may not exceed this fraction of capital_base_cents after the commit
        default: 0.25
        constraints: "> 0 and <= 1"
      - name: status
        type: enum
        source: system
        description: investor account lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Investment
    parent: null
    common_fields: true
    fields:
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the committing investor"
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan being funded"
      - name: amount_cents
        type: integer
        source: input
        description: principal this investor commits to fund
        constraints: ">= 2500"
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: investor's share of remaining principal; set to amount_cents at disburse, debited pro-rata as principal is repaid, written to 0 on charge-off
        default: 0
      - name: charged_off_basis_cents
        type: integer
        source: computed
        description: snapshot of outstanding_principal_cents captured at charge-off; the weight used by distribute_recovery; 0 until charge-off
        default: 0
      - name: status
        type: enum
        source: system
        description: investment lifecycle
        default: COMMITTED
        constraints: "one of {COMMITTED, WRITTEN_OFF}"
      - name: expected_loan_version
        type: integer
        source: input
        description: OCC token — the Loan.version the investor last observed; the create is rejected if stale
        constraints: required on POST /investments

  - name: Repayment
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan being paid down"
      - name: amount_cents
        type: integer
        source: input
        description: total cash applied in this payment
        constraints: ">= 1"
      - name: kind
        type: enum
        source: input
        description: scheduled period payment vs post-charge-off recovery
        default: SCHEDULED
        constraints: "one of {SCHEDULED, RECOVERY}"
      - name: late_fee_paid_cents
        type: integer
        source: computed
        description: portion of amount_cents allocated to outstanding late fees (waterfall bucket 1)
        default: 0
      - name: interest_paid_cents
        type: integer
        source: computed
        description: portion allocated to current-period accrued interest (waterfall bucket 2)
        default: 0
      - name: principal_paid_cents
        type: integer
        source: computed
        description: portion allocated to current-period scheduled principal plus prepayment (waterfall buckets 3+4)
        default: 0
      - name: platform_fee_cents
        type: integer
        source: computed
        description: servicing fee skimmed from the interest bucket (see compute_servicing_fee)
        default: 0

  - name: RepaymentAllocation
    parent: null
    common_fields: false
    fields:
      - name: repayment_id
        type: string
        source: system
        description: "FK -> Repayment.id; the payment that produced this distribution line"
      - name: investment_id
        type: string
        source: system
        description: "FK -> Investment.id; the investor share credited"
      - name: principal_amount_cents
        type: integer
        source: computed
        description: principal returned to this investment in this payment (pro-rata, largest-remainder)
      - name: interest_amount_cents
        type: integer
        source: computed
        description: net interest paid to this investment (after platform fee, pro-rata, largest-remainder)

  - name: ComplianceDisclosure
    parent: null
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: "FK -> Loan.id; the loan this disclosure covers"
      - name: document_type
        type: enum
        source: input
        description: SEC-style disclosure category
        constraints: "one of {SERIES_NOTE_PROSPECTUS, RISK_FACTORS, ANNUAL_REPORT}"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed it
      - name: status
        type: enum
        source: system
        description: disclosure lifecycle
        default: FILED
        constraints: "one of {FILED, SUPERSEDED}"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: LoanApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /loan-applications/{id}/score"
        actor: Underwriter
        preconditions:
          - "application.status == SUBMITTED"
          - "Borrower referenced by application.borrower_id has status == ACTIVE"
        side_effects:
          - "run score_borrower over the application's plaid_* fields; write credit_score and risk_grade"
          - "set offered_apr from risk_grade via apr_for_grade (null when risk_grade == F)"
          - "set scored_by_user_id = X-User-ID of the acting Underwriter"
        note: "F grade is allowed here; it is rejected only at the APPROVE step."
      - from: SCORED
        to: APPROVED
        trigger: "POST /loan-applications/{id}/approve"
        actor: Underwriter
        preconditions:
          - "application.status == SCORED"
          - "application.risk_grade != F"
          - "acting Underwriter X-User-ID != application.scored_by_user_id (segregation of duties)"
        side_effects:
          - "create a Loan in status FUNDING with principal_cents=requested_principal_cents, apr=offered_apr, term_months copied, outstanding_principal_cents=0, current_period_index=0"
      - from: SCORED
        to: REJECTED
        trigger: "POST /loan-applications/{id}/reject"
        actor: Underwriter
        preconditions:
          - "application.status == SCORED"
        side_effects:
          - "no Loan is created"
        note: "auto-path: scoring an F-grade application still lands in SCORED; reject is the only forward move for F."

  - entity: Loan
    initial_state: FUNDING
    terminal_states: [PAID_OFF, CHARGED_OFF]
    transitions:
      - from: FUNDING
        to: ACTIVE
        trigger: "POST /loans/{id}/disburse"
        actor: PlatformAdmin
        preconditions:
          - "loan.status == FUNDING"
          - "loan.committed_cents == loan.principal_cents (fully funded, exact)"
          - "a ComplianceDisclosure with document_type == SERIES_NOTE_PROSPECTUS and status == FILED exists for this loan_id"
        side_effects:
          - "set outstanding_principal_cents = principal_cents"
          - "set current_period_index = 1"
          - "for each Investment with status==COMMITTED on this loan, set its outstanding_principal_cents = amount_cents"
          - "set funded_at = current clock time"
          - "auto-transition Loan to REPAYMENT in the same request"
      - from: ACTIVE
        to: REPAYMENT
        trigger: "system (same request as disburse)"
        actor: system
        preconditions:
          - "loan.status == ACTIVE"
        side_effects:
          - "loan is now accepting Repayments against the amortization schedule"
        note: "ACTIVE is a transient state stamped during disburse; REPAYMENT is where scheduled payments land."
      - from: REPAYMENT
        to: REPAYMENT
        trigger: "POST /loans/{id}/repayments (kind=SCHEDULED)"
        actor: Borrower
        preconditions:
          - "loan.status == REPAYMENT"
          - "amount_cents <= total_payoff_cents (late_fee_outstanding + remaining interest_due + outstanding_principal)"
        side_effects:
          - "allocate via allocate_repayment waterfall; set late_fee_paid_cents/interest_paid_cents/principal_paid_cents and platform_fee_cents on the Repayment"
          - "debit loan.late_fee_outstanding_cents by late_fee bucket; debit loan.outstanding_principal_cents by principal bucket (scheduled principal + prepayment)"
          - "if the current period's interest_due and principal_due are both fully covered, advance loan.current_period_index by 1"
          - "distribute principal bucket and net-interest bucket to COMMITTED Investments pro-rata (distribute_pro_rata); create one RepaymentAllocation per Investment; debit each Investment.outstanding_principal_cents by its principal share"
      - from: REPAYMENT
        to: PAID_OFF
        trigger: "POST /loans/{id}/repayments (kind=SCHEDULED) that clears the balance"
        actor: Borrower
        preconditions:
          - "loan.status == REPAYMENT"
          - "after this payment's allocation, loan.outstanding_principal_cents == 0 and loan.late_fee_outstanding_cents == 0"
        side_effects:
          - "same allocation/distribution side effects as the REPAYMENT->REPAYMENT transition"
          - "set loan.status = PAID_OFF"
        note: "compensating-invariant: principal disbursed equals principal returned to investors over the loan's life."
      - from: REPAYMENT
        to: REPAYMENT
        trigger: "POST /loans/{id}/assess-late-fee (target period = last_assessed_period_index + 1; resulting missed_payment_count < 3)"
        actor: PlatformAdmin
        preconditions:
          - "loan.status == REPAYMENT"
          - "target_period = last_assessed_period_index + 1 is an unpaid period (target_period >= current_period_index)"
          - "the target period's due date (funded_at + target_period months) is strictly before the current clock time"
        side_effects:
          - "raise loan.late_fee_outstanding_cents by late_fee_amount (see compute_late_fee)"
          - "set loan.last_assessed_period_index = target_period"
          - "increment loan.missed_payment_count by 1"
        note: "self-loop while missed_payment_count stays below 3; each call advances last_assessed_period_index by exactly one, so a re-call for an already-assessed period is rejected by the unpaid-period precondition."
      - from: REPAYMENT
        to: DEFAULTED
        trigger: "POST /loans/{id}/assess-late-fee (the assessment that brings missed_payment_count to 3)"
        actor: PlatformAdmin
        preconditions:
          - "loan.status == REPAYMENT"
          - "target_period = last_assessed_period_index + 1 is an unpaid period (target_period >= current_period_index)"
          - "the target period's due date (funded_at + target_period months) is strictly before the current clock time"
          - "loan.missed_payment_count == 2 before this call"
        side_effects:
          - "raise loan.late_fee_outstanding_cents by late_fee_amount (see compute_late_fee)"
          - "set loan.last_assessed_period_index = target_period"
          - "increment loan.missed_payment_count to 3"
          - "set loan.status = DEFAULTED"
        note: "the third successful assessment escalates the loan to DEFAULTED in the same request."
      - from: DEFAULTED
        to: CHARGED_OFF
        trigger: "POST /loans/{id}/charge-off"
        actor: PlatformAdmin
        preconditions:
          - "loan.status == DEFAULTED"
        side_effects:
          - "set loan.status = CHARGED_OFF"
          - "for each COMMITTED Investment on this loan: set Investment.status = WRITTEN_OFF; set Investment.charged_off_basis_cents = Investment.outstanding_principal_cents; decrement Investor.committed_capital_cents by the Investment's amount_cents and decrement Investor.capital_base_cents by the Investment's outstanding_principal_cents (the realised loss); then set Investment.outstanding_principal_cents = 0"
          - "loan.outstanding_principal_cents is preserved as the charged-off basis for later recovery distribution"
        note: "charge-off cascade: charge-off -> Investment write-off -> Investor capital_base/committed_capital write-down (depth 3)."
      - from: CHARGED_OFF
        to: CHARGED_OFF
        trigger: "POST /loans/{id}/repayments (kind=RECOVERY)"
        actor: PlatformAdmin
        preconditions:
          - "loan.status == CHARGED_OFF"
          - "amount_cents <= loan.outstanding_principal_cents (recovery cannot exceed the charged-off basis)"
        side_effects:
          - "distribute the full recovery amount to the (now WRITTEN_OFF) Investments pro-rata by their charged-off outstanding basis (distribute_recovery); create one RepaymentAllocation per Investment with principal_amount_cents only"
          - "debit loan.outstanding_principal_cents by amount_cents"
        note: "recovery does not change Investment.status; it credits investors against a written-off loan."

  - entity: ComplianceDisclosure
    initial_state: FILED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: FILED
        to: SUPERSEDED
        trigger: "system side effect when a newer ComplianceDisclosure of the same document_type is filed for the same loan_id"
        actor: system
        preconditions:
          - "disclosure.status == FILED"
        side_effects:
          - "the prior FILED disclosure of the same (loan_id, document_type) is marked SUPERSEDED"
        note: "only the most-recently FILED prospectus counts for the disburse precondition."

concurrency_rules:
  - rule_id: investment-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /investments"
    occ_field: "expected_loan_version"
    description: |
      Committing an Investment against a Loan whose version has advanced since
      the investor last observed it is rejected on a stale version. This captures
      the case where another investor's commit has already moved the loan toward
      (or to) fully-funded — bumping loan.version and loan.committed_cents — so the
      current investor's view of remaining capacity is stale.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: score_borrower
    trigger: "POST /loan-applications/{id}/score (LoanApplication SUBMITTED->SCORED)"
    algorithm: weighted_scoring
    formula: |
      dscr = (plaid_monthly_debt_payment_cents == 0)
               ? 3.0
               : plaid_avg_monthly_revenue_cents / plaid_monthly_debt_payment_cents
      dscr_sub = min(100.0, (dscr / 2.0) * 100.0)
      stability_sub =
        plaid_avg_monthly_revenue_cents >= 5000000 ? 100.0 :
        plaid_avg_monthly_revenue_cents >= 2000000 ? 80.0  :
        plaid_avg_monthly_revenue_cents >= 1000000 ? 60.0  :
        plaid_avg_monthly_revenue_cents >=  500000 ? 40.0  : 20.0
      nsf_sub = max(0.0, 100.0 - plaid_nsf_count_90d * 15.0)
      age_sub = min(100.0, (plaid_account_age_months / 60.0) * 100.0)
      credit_score = round_half_up(
          dscr_sub*W_DSCR + stability_sub*W_STAB + nsf_sub*W_NSF + age_sub*W_AGE , 2)
      # tiering -> risk_grade (apr set by apr_for_grade)
      risk_grade =
        credit_score >= 85 ? A :
        credit_score >= 70 ? B :
        credit_score >= 55 ? C :
        credit_score >= 40 ? D : F
    input_set: "the LoanApplication's own plaid_* snapshot fields; no cross-entity inputs"
    constants:
      W_DSCR: 0.40
      W_STAB: 0.30
      W_NSF: 0.20
      W_AGE: 0.10
      DSCR_FULL_RATIO: 2.0
      NSF_PENALTY_PER_EVENT: 15.0
      AGE_FULL_MONTHS: 60
    precision: "credit_score to 2 decimals, round_half_up; grade thresholds use >= (inclusive lower bound)"

  - name: apr_for_grade
    trigger: "POST /loan-applications/{id}/score (sets offered_apr after risk_grade is known)"
    algorithm: tiered_pricing
    formula: |
      offered_apr =
        risk_grade == A ? 0.0599 :
        risk_grade == B ? 0.0899 :
        risk_grade == C ? 0.1299 :
        risk_grade == D ? 0.1799 :
        /* F */            null
    input_set: "the application's computed risk_grade only"
    constants:
      APR_A: 0.0599
      APR_B: 0.0899
      APR_C: 0.1299
      APR_D: 0.1799
    precision: "stored as a decimal fraction; F yields null offered_apr"

  - name: amortization_schedule
    trigger: "read on demand via GET /loans/{id}/schedule; also defines interest_due/principal_due used by allocate_repayment"
    algorithm: aggregation
    formula: |
      i = apr / 12
      level_payment_raw = (i == 0)
          ? principal_cents / term_months
          : principal_cents * (i * (1+i)^term_months) / ((1+i)^term_months - 1)
      level_payment_cents = round_half_up(level_payment_raw, 0)   # whole cents
      balance = principal_cents
      for m in 1..term_months:
        interest_due[m] = round_half_up(balance * i, 0)
        if m < term_months:
          principal_due[m] = level_payment_cents - interest_due[m]
          payment[m] = level_payment_cents
        else:
          principal_due[m] = balance                 # final period absorbs rounding drift
          payment[m] = principal_due[m] + interest_due[m]
        balance = balance - principal_due[m]
      # invariant: sum(principal_due) == principal_cents exactly
    input_set: "a single Loan's principal_cents, apr, term_months"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "per-period interest rounded to whole cents BEFORE deriving principal_due (round-then-subtract, not subtract-then-round); final period principal_due = residual balance"

  - name: compute_servicing_fee
    trigger: "POST /loans/{id}/repayments kind=SCHEDULED (allocate_repayment interest bucket)"
    algorithm: aggregation
    formula: |
      platform_fee_cents = round_half_up(interest_bucket_cents * SERVICING_FEE_PCT, 0)
      net_interest_to_investors_cents = interest_bucket_cents - platform_fee_cents
    input_set: "the interest bucket of a single Repayment (waterfall bucket 2)"
    constants:
      SERVICING_FEE_PCT: 0.01
    precision: "round_half_up to whole cents; fee skimmed only from interest, never from principal or late fees"

  - name: allocate_repayment
    trigger: "POST /loans/{id}/repayments kind=SCHEDULED (Loan REPAYMENT->REPAYMENT or ->PAID_OFF)"
    algorithm: waterfall_allocation
    formula: |
      rem = amount_cents
      # bucket 1: outstanding late fees
      late_fee_paid = min(rem, loan.late_fee_outstanding_cents); rem -= late_fee_paid
      # bucket 2: current-period accrued interest (from amortization_schedule[current_period_index])
      interest_paid = min(rem, interest_due[current_period_index]); rem -= interest_paid
      # bucket 3: current-period scheduled principal
      sched_principal = min(rem, principal_due[current_period_index]); rem -= sched_principal
      # bucket 4: prepayment against remaining principal beyond the current period
      prepay_cap = loan.outstanding_principal_cents - principal_due[current_period_index]
      prepay = min(rem, max(0, prepay_cap)); rem -= prepay
      principal_paid = sched_principal + prepay
      # rem must be 0 because amount_cents <= total_payoff (validated upstream)
    input_set: "a single Repayment.amount_cents against its Loan's current-period schedule and outstanding balances; buckets filled in fixed order 1->2->3->4"
    constants: {}
    precision: "all buckets in whole cents; order is fixed and non-negotiable (late_fee, interest, scheduled_principal, prepayment)"
    variants:
      - name: scheduled_allocation
        when: "Repayment.kind == SCHEDULED on a loan in REPAYMENT"
        difference: "fills all four buckets; interest bucket feeds compute_servicing_fee; advances current_period_index when the period is satisfied"
      - name: recovery_allocation
        when: "Repayment.kind == RECOVERY on a loan in CHARGED_OFF"
        difference: "no late-fee/interest/principal-due buckets and no servicing fee; the entire amount is treated as principal recovery and distributed by distribute_recovery"

  - name: distribute_pro_rata
    trigger: "POST /loans/{id}/repayments kind=SCHEDULED (Investment.outstanding debit + RepaymentAllocation create)"
    algorithm: waterfall_allocation
    formula: |
      # distribute one bucket (principal_paid, then net_interest separately) across
      # COMMITTED Investments by their share of original funded principal.
      total_funded = sum(inv.amount_cents for inv in COMMITTED investments on loan)
      for inv: raw[inv] = bucket_cents * inv.amount_cents / total_funded
      floor[inv]  = floor(raw[inv])
      allocated   = sum(floor[inv])
      remainder   = bucket_cents - allocated            # 0..N-1 leftover cents
      # assign the leftover cents one each, ranked by largest fractional part;
      # ties broken by Investment.created_at ASC (never by id)
      order = sort investments by (frac(raw[inv]) DESC, inv.created_at ASC)
      give the first `remainder` investments +1 cent
    input_set: "COMMITTED Investments on the loan, ranked for remainder by (fractional part DESC, created_at ASC)"
    constants: {}
    precision: "largest-remainder method to whole cents; tie-break created_at ASC; principal and net-interest buckets distributed independently"

  - name: distribute_recovery
    trigger: "POST /loans/{id}/repayments kind=RECOVERY (Loan CHARGED_OFF->CHARGED_OFF)"
    algorithm: waterfall_allocation
    formula: |
      # like distribute_pro_rata but weighted by each Investment's outstanding
      # principal AT CHARGE-OFF (charged_off_basis_cents), not by original amount.
      total_basis = sum(inv.charged_off_basis_cents for inv in WRITTEN_OFF investments on loan)
      for inv: raw[inv] = amount_cents * inv.charged_off_basis_cents / total_basis
      floor[inv] = floor(raw[inv]); remainder = amount_cents - sum(floor)
      order = sort by (frac(raw[inv]) DESC, inv.created_at ASC)
      first `remainder` investments get +1 cent
    input_set: "WRITTEN_OFF Investments on the charged-off loan, weighted by charged_off_basis_cents (the outstanding_principal_cents captured at charge-off)"
    constants: {}
    precision: "largest-remainder to whole cents; tie-break created_at ASC; basis is the pre-charge-off outstanding, distinct from original amount"

  - name: compute_late_fee
    trigger: "POST /loans/{id}/assess-late-fee (Loan REPAYMENT->REPAYMENT or REPAYMENT->DEFAULTED)"
    algorithm: threshold
    formula: |
      scheduled_payment = level_payment_cents (from amortization_schedule)
      late_fee_amount = max(LATE_FEE_FLOOR_CENTS,
                            round_half_up(scheduled_payment * LATE_FEE_PCT, 0))
    input_set: "the loan's level scheduled payment; one late fee per overdue target period"
    constants:
      LATE_FEE_PCT: 0.05
      LATE_FEE_FLOOR_CENTS: 2500
    precision: "round_half_up to whole cents; floor of 2500 cents applies when 5% of the payment is smaller"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /borrowers, POST /investors"
  - priority: 2
    category: auth
    check: "the X-User-Role is permitted to call this endpoint per the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path/body id references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "the target resource is in a state from which this transition is defined (e.g., score requires SUBMITTED, approve requires SCORED, disburse requires FUNDING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "an Underwriter may not approve a LoanApplication they themselves scored (segregation of duties: X-User-ID != scored_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /loan-applications/{id}/approve"
  - priority: 6
    category: business_safety
    check: "a LoanApplication with risk_grade == F may not be approved"
    error_id: ERR_GRADE_NOT_FUNDABLE
    http_status: 422
    applies_to: "POST /loan-applications/{id}/approve"
  - priority: 7
    category: business_referential
    check: "disburse requires a FILED SERIES_NOTE_PROSPECTUS ComplianceDisclosure for the loan (SEC offering disclosure)"
    error_id: ERR_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /loans/{id}/disburse"
  - priority: 8
    category: business_constraint
    check: "an Investment may only be committed while its Loan is in FUNDING and the committing Investor and the loan's Borrower are both ACTIVE"
    error_id: ERR_LOAN_NOT_FUNDING
    http_status: 409
    applies_to: "POST /investments"
  - priority: 9
    category: business_referential
    check: "OCC: expected_loan_version on an Investment create must equal the loan's current version (checked before fiscal capacity so a stale view never silently over-funds)"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /investments"
  - priority: 10
    category: business_constraint
    check: "an Investment's amount_cents may not push the loan's committed_cents above the loan's principal_cents (no over-subscription)"
    error_id: ERR_FUNDING_EXCEEDED
    http_status: 422
    applies_to: "POST /investments"
  - priority: 11
    category: business_fiscal
    check: "an Investment's amount_cents may not exceed the investor's uncommitted capital (capital_base_cents minus committed_capital_cents)"
    error_id: ERR_INSUFFICIENT_CAPITAL
    http_status: 422
    applies_to: "POST /investments"
  - priority: 12
    category: business_fiscal
    check: "the investor's resulting exposure to this single loan (sum of this investor's COMMITTED amount_cents on this loan, including this commit) may not exceed max_single_loan_pct * capital_base_cents (diversification cap)"
    error_id: ERR_DIVERSIFICATION_BREACH
    http_status: 422
    applies_to: "POST /investments"
  - priority: 13
    category: business_fiscal
    check: "a SCHEDULED repayment.amount_cents may not exceed total_payoff (late_fee_outstanding + remaining interest_due + outstanding_principal)"
    error_id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http_status: 422
    applies_to: "POST /loans/{id}/repayments (kind=SCHEDULED)"
  - priority: 14
    category: business_fiscal
    check: "a RECOVERY repayment.amount_cents may not exceed the loan's charged-off outstanding_principal_cents basis"
    error_id: ERR_RECOVERY_EXCEEDS_BASIS
    http_status: 422
    applies_to: "POST /loans/{id}/repayments (kind=RECOVERY)"
  - priority: 15
    category: business_temporal
    check: "assess-late-fee is rejected if the target period (last_assessed_period_index + 1) has its due date still in the future, or if that period has already been paid (target_period < current_period_index)"
    error_id: ERR_LATE_FEE_NOT_DUE
    http_status: 409
    applies_to: "POST /loans/{id}/assess-late-fee"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/borrowers"
    description: "register a small business borrower"
    roles: [Borrower, PlatformAdmin]
    code: 201
    input: [business_name, ein, state_code]
    output: Borrower
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/borrowers/{id}"
    description: "fetch a borrower"
    roles: [Borrower, Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: POST
    path: "/borrowers/{id}/suspend"
    description: "suspend a borrower account"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Borrower
    side_effects: ["status = SUSPENDED"]

  - method: POST
    path: "/loan-applications"
    description: "submit a loan application with a Plaid snapshot"
    roles: [Borrower]
    code: 201
    input: [borrower_id, requested_principal_cents, term_months, plaid_avg_monthly_revenue_cents, plaid_monthly_debt_payment_cents, plaid_nsf_count_90d, plaid_account_age_months]
    output: LoanApplication
    side_effects: ["status = SUBMITTED"]
  - method: GET
    path: "/loan-applications/{id}"
    description: "fetch an application"
    roles: [Borrower, Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []
  - method: GET
    path: "/loan-applications"
    description: "list applications, optionally filtered by borrower_id"
    roles: [Underwriter, PlatformAdmin]
    code: 200
    input: ["borrower_id?", "status?", "limit?", "offset?"]
    output: LoanApplication[]
    side_effects: []
  - method: POST
    path: "/loan-applications/{id}/score"
    description: "run borrower scoring; SUBMITTED->SCORED"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["compute credit_score (score_borrower)", "set risk_grade", "set offered_apr (apr_for_grade)", "set scored_by_user_id"]
  - method: POST
    path: "/loan-applications/{id}/approve"
    description: "approve a scored application; SCORED->APPROVED; originates a Loan in FUNDING"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["create Loan in FUNDING (principal/apr/term copied from application)"]
  - method: POST
    path: "/loan-applications/{id}/reject"
    description: "reject a scored application; SCORED->REJECTED"
    roles: [Underwriter]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["status = REJECTED"]

  - method: GET
    path: "/loans/{id}"
    description: "fetch a loan with reconciled committed/outstanding fields"
    roles: [Borrower, Investor, Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: GET
    path: "/loans"
    description: "list loans, optionally filtered by application_id or borrower_id"
    roles: [Investor, Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["application_id?", "borrower_id?", "status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/loans/{id}/schedule"
    description: "computed read: the amortization schedule for the loan"
    roles: [Borrower, Investor, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: "{ level_payment_cents: integer, periods: object[] }"
    side_effects: []
    # periods[] elements: { period_index: integer, interest_due_cents: integer, principal_due_cents: integer, payment_cents: integer }
  - method: POST
    path: "/loans/{id}/disburse"
    description: "disburse a fully-funded, disclosed loan; FUNDING->ACTIVE->REPAYMENT"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["set outstanding_principal_cents=principal_cents", "set current_period_index=1", "set funded_at", "set each Investment.outstanding_principal_cents=amount_cents", "auto-transition to REPAYMENT"]
  - method: POST
    path: "/loans/{id}/assess-late-fee"
    description: "assess a late fee for the next overdue period (last_assessed_period_index + 1); may trigger DEFAULT"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["raise late_fee_outstanding_cents (compute_late_fee)", "advance last_assessed_period_index by 1", "increment missed_payment_count", "set status=DEFAULTED when missed_payment_count reaches 3"]
  - method: POST
    path: "/loans/{id}/charge-off"
    description: "charge off a defaulted loan; DEFAULTED->CHARGED_OFF"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["set Investment.status=WRITTEN_OFF for each COMMITTED investment", "snapshot Investment.charged_off_basis_cents = outstanding_principal_cents", "decrement Investor.committed_capital_cents by each investment's amount_cents and Investor.capital_base_cents by its outstanding_principal_cents", "zero Investment.outstanding_principal_cents"]
  - method: POST
    path: "/loans/{id}/repayments"
    description: "record a borrower repayment (SCHEDULED) or post-charge-off recovery (RECOVERY)"
    roles: [Borrower, PlatformAdmin]
    code: 201
    input: [loan_id, amount_cents, "kind?"]
    output: Repayment
    side_effects: ["allocate_repayment waterfall", "compute_servicing_fee", "distribute_pro_rata or distribute_recovery to Investments", "create RepaymentAllocation rows", "advance current_period_index / status transitions"]
  - method: GET
    path: "/repayments/{id}"
    description: "fetch a single repayment with its computed bucket fields"
    roles: [Borrower, Investor, Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: Repayment
    side_effects: []
  - method: GET
    path: "/loans/{id}/repayments"
    description: "list repayments for a loan"
    roles: [Borrower, Investor, Underwriter, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Repayment[]
    side_effects: []
  - method: GET
    path: "/loans/{id}/investments"
    description: "reverse-reachability: investments funding this loan"
    roles: [Investor, Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Investment[]
    side_effects: []

  - method: POST
    path: "/investors"
    description: "register an investor account"
    roles: [Investor, PlatformAdmin]
    code: 201
    input: [display_name, "max_single_loan_pct?"]
    output: Investor
    side_effects: ["status = ACTIVE", "capital_base_cents = 0", "committed_capital_cents = 0", "max_single_loan_pct defaults to 0.25 when omitted"]
  - method: GET
    path: "/investors/{id}"
    description: "fetch an investor with reconciled capital_base/committed_capital fields"
    roles: [Investor, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Investor
    side_effects: []
  - method: POST
    path: "/investors/{id}/suspend"
    description: "suspend an investor account (blocks new commitments)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Investor
    side_effects: ["status = SUSPENDED"]
  - method: POST
    path: "/investors/{id}/deposit"
    description: "credit an investor's capital_base used by the diversification cap and the uncommitted-capital check"
    roles: [Investor, PlatformAdmin]
    code: 200
    input: [amount_cents]
    output: Investor
    side_effects: ["increase capital_base_cents by amount_cents (capital available to invest)"]
  - method: POST
    path: "/investments"
    description: "commit an investment to a FUNDING loan (OCC on loan.version)"
    roles: [Investor]
    code: 201
    input: [investor_id, loan_id, amount_cents, expected_loan_version]
    output: Investment
    side_effects: ["status = COMMITTED", "raise loan.committed_cents by amount_cents", "raise investor.committed_capital_cents by amount_cents", "increments Loan.version by 1"]
  - method: GET
    path: "/investments/{id}"
    description: "fetch an investment"
    roles: [Investor, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Investment
    side_effects: []
  - method: GET
    path: "/investments"
    description: "list investments, filterable by investor_id or loan_id"
    roles: [Investor, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["investor_id?", "loan_id?", "limit?", "offset?"]
    output: Investment[]
    side_effects: []
  - method: GET
    path: "/repayments/{id}/allocations"
    description: "reverse-reachability: per-investor allocation lines for a repayment"
    roles: [Investor, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: RepaymentAllocation[]
    side_effects: []
  - method: GET
    path: "/investments/{id}/allocations"
    description: "reverse-reachability: allocation lines crediting this investment"
    roles: [Investor, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: RepaymentAllocation[]
    side_effects: []

  - method: POST
    path: "/compliance-disclosures"
    description: "file an SEC-style disclosure for a loan; supersedes any prior of same type"
    roles: [ComplianceOfficer]
    code: 201
    input: [loan_id, document_type]
    output: ComplianceDisclosure
    side_effects: ["status = FILED", "set filed_by_user_id", "mark prior FILED disclosure of same (loan_id, document_type) as SUPERSEDED"]
  - method: GET
    path: "/compliance-disclosures/{id}"
    description: "fetch a disclosure"
    roles: [Investor, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceDisclosure
    side_effects: []
  - method: GET
    path: "/loans/{id}/compliance-disclosures"
    description: "reverse-reachability: disclosures filed for this loan"
    roles: [Investor, Underwriter, PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["document_type?", "status?"]
    output: ComplianceDisclosure[]
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving: set the server's current UTC clock for due-date and default timing"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock advanced to the given instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing X-User-Role or X-User-ID on an endpoint that requires them"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced borrower, application, loan, investor, investment, repayment, or disclosure does not exist"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, or value outside declared constraints"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested transition is defined"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "an Underwriter attempts to approve an application they themselves scored"
  - id: ERR_GRADE_NOT_FUNDABLE
    http: 422
    condition: "approval attempted on an application whose risk_grade is F"
  - id: ERR_DISCLOSURE_MISSING
    http: 422
    condition: "disburse attempted without a FILED SERIES_NOTE_PROSPECTUS disclosure for the loan"
  - id: ERR_LOAN_NOT_FUNDING
    http: 409
    condition: "an Investment is committed to a loan that is not in FUNDING, or the investor/borrower is SUSPENDED"
  - id: ERR_FUNDING_EXCEEDED
    http: 422
    condition: "an Investment would push committed_cents above the loan's principal_cents"
  - id: ERR_DIVERSIFICATION_BREACH
    http: 422
    condition: "an Investment would push the investor's single-loan exposure above max_single_loan_pct * capital_base_cents"
  - id: ERR_PAYMENT_EXCEEDS_PAYOFF
    http: 422
    condition: "a SCHEDULED repayment exceeds the loan's total payoff amount"
  - id: ERR_RECOVERY_EXCEEDS_BASIS
    http: 422
    condition: "a RECOVERY repayment exceeds the charged-off outstanding basis"
  - id: ERR_LATE_FEE_NOT_DUE
    http: 409
    condition: "assess-late-fee called before the target period's due date passes, or for a period already paid"
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "expected_loan_version on an Investment create does not match the loan's current version"
  - id: ERR_INSUFFICIENT_CAPITAL
    http: 422
    condition: "an Investment's amount_cents exceeds the investor's uncommitted capital (capital_base_cents minus committed_capital_cents)"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Borrower
    description: "the small business that applies for and repays a loan"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /loan-applications"
    shared_operations:
      - "POST /borrowers (self-register)"
      - "POST /loans/{id}/repayments (SCHEDULED)"
      - "GET reads on own borrower/application/loan/schedule/repayments"
  - name: Investor
    description: "a lender who commits capital to loans and receives repayment allocations"
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /investments"
    shared_operations:
      - "POST /investors (self-register)"
      - "POST /investors/{id}/deposit"
      - "GET reads on loans/investments/allocations/disclosures"
  - name: Underwriter
    description: "scores and approves/rejects applications; segregation of duties enforced between score and approve"
    identity: opaque
    exclusive_operations:
      - "POST /loan-applications/{id}/score"
      - "POST /loan-applications/{id}/approve"
      - "POST /loan-applications/{id}/reject"
    shared_operations:
      - "GET reads on applications/loans"
  - name: ComplianceOfficer
    description: "files SEC-style disclosures that gate disbursement"
    identity: opaque
    exclusive_operations:
      - "POST /compliance-disclosures"
    shared_operations:
      - "GET reads on loans/investments/disclosures"
  - name: PlatformAdmin
    description: "operates the funding/servicing lifecycle: disburse, late-fee, charge-off, recovery, clock"
    identity: opaque
    exclusive_operations:
      - "POST /loans/{id}/disburse"
      - "POST /loans/{id}/assess-late-fee"
      - "POST /loans/{id}/charge-off"
      - "POST /borrowers/{id}/suspend"
      - "POST /investors/{id}/suspend"
      - "POST /_clock/set_current_utc"
      - "POST /loans/{id}/repayments (RECOVERY)"
    shared_operations:
      - "POST /borrowers, POST /investors, POST /investors/{id}/deposit"
      - "GET reads across all resources"
