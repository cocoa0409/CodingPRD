              as: ProgramAdministrator
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /tdr/sending-parcels"
              payload: { owner_party_id: "${own_id}", sending_area_id: "${sa_id}", apn: "APN-001", gross_acres: 100.00, constrained_acres: 22.00, soil_class: "PRIME", existing_dwelling_units: 2 }
              as: ProgramAdministrator
            - call: "POST /tdr/sending-areas/${sa_id}/activate"
