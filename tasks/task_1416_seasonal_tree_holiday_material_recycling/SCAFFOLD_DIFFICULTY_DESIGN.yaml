        test_recipe:
          setup:
            - "Program ACTIVE; site OPEN; logical clock settable across the window edge"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "TreeCycle 2027", season_label: "Winter 2027", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-16T23:59:59Z" }
