  # ===========================================================================
  - section: endpoints
    instances:

      - name: clock_default_is_2026_09_01_before_any_set
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/marketplace/_clock/set_current_utc
        distinguishing_aspect: "The server's logical clock MUST read exactly 2026-09-01T00:00:00Z before any set_current_utc call — it never falls back to wall-clock time; setting the clock returns the new current_utc and the count of fired transitions."
        test_recipe:
          setup:
            - "Fresh server; no clock call has been made."
          setup_api_calls: []
          trigger:
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and data.current_utc == 2026-09-01T00:00:00Z"
            - "data.fired_transitions == 0 (setting the clock to its own default fires nothing)"

      - name: application_create_occ_stale_nurse_version_rejected
        claim_type: Cross-reference link
        grounds:
          - concurrency_rules[application-create-stale-nurse]
          - errors.ERR_STALE_NURSE_VERSION
        distinguishing_aspect: "OCC on the nurse: after a first application bumps nurse.version, a second employer's application carrying the pre-bump expected_nurse_version is rejected 412 ERR_STALE_NURSE_VERSION; re-reading the nurse and resubmitting with the fresh version succeeds."
        test_recipe:
          setup:
            - "ACTIVE nurse (version captured at creation); two employers each with an OPEN ICU requisition; the first employer's application has succeeded."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - call: "POST /marketplace/employers"
              payload: { legal_name: "Coastal General", facility_state: "CA", fee_model: "SUBSCRIPTION", subscription_tier: "PRO", sla_response_hours: 48, guarantee_days: 90, placement_fee_bps: 1500 }
              as: PlatformAdmin
              captures: { emp2_id: $.data.id }
            - call: "POST /marketplace/requisitions"
              payload: { employer_id: "${emp2_id}", specialty: "ICU", unit_name: "ICU-North", required_certs: [], facility_state: "CA", distance_from_facility_miles: 30, shift: "DAY", offered_hourly_rate_cents: 8200, openings_total: 1 }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { req2_id: $.data.id }
            - *k_app
          trigger:
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req2_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8300, proposed_shift: "DAY", expected_nurse_version: "${nurse_v}" }
              as: Employer
              as_user_id: "${emp2_id}"
              captures: { err_occ: $.data.error_id }
            - call: "GET /marketplace/nurses/${nurse_id}"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { nurse_v_fresh: $.data.version }
            - call: "POST /marketplace/applications"
              payload: { requisition_id: "${req2_id}", nurse_id: "${nurse_id}", proposed_hourly_rate_cents: 8300, proposed_shift: "DAY", expected_nurse_version: "${nurse_v_fresh}" }
              as: Employer
              as_user_id: "${emp2_id}"
          assert:
            - "err_occ == ERR_STALE_NURSE_VERSION with http 412 (nurse version advanced when the first application was created)"
            - "the resubmission with the fresh version returns 201"
            - "Nurse.${nurse_id}.active_application_count == 2"

      - name: offer_issue_occ_stale_requisition_version_rejected
        claim_type: Cross-reference link
        grounds:
          - concurrency_rules[offer-issue-stale-requisition]
          - errors.ERR_STALE_REQUISITION_VERSION
        distinguishing_aspect: "OCC on the requisition: any mutation that bumps requisition.version (here a pause) invalidates a previously observed expected_requisition_version at offer issuance — the stale issuance is rejected 412 while a fresh read fixes it."
        test_recipe:
          setup:
            - "Application INTERVIEWING with COMPLETED interview; employer captured requisition version at creation, then paused and resumed the requisition (bumping version twice)."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - *k_iv
            - *k_clock_iv
            - *k_iv_done
            - call: "POST /marketplace/requisitions/${req_id}/pause"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /marketplace/requisitions/${req_id}/resume"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /marketplace/applications/${app_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-15", expected_requisition_version: "${req_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_occ2: $.data.error_id }
            - call: "GET /marketplace/requisitions/${req_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { req_v_fresh: $.data.version }
            - call: "POST /marketplace/applications/${app_id}/offers"
              payload: { offered_hourly_rate_cents: 8500, start_date: "2026-09-15", expected_requisition_version: "${req_v_fresh}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { offer_id: $.data.id }
          assert:
            - "err_occ2 == ERR_STALE_REQUISITION_VERSION with http 412"
            - "the retry with the fresh version returns 201 and Offer.${offer_id}.status == ISSUED"

      - name: invoice_settle_applies_credit_before_cash
        claim_type: Conditional action
        grounds:
          - state_machines.Invoice.ISSUED_to_SETTLED
          - entities.Employer.fields.credit_balance_cents
        distinguishing_aspect: "Settle is conditional on credit state: an employer holding credit_balance 2652000 settling a PARTIALLY_CREDITED invoice (residual 884000 owed) draws exactly min(credit, residual) == 884000, leaving 1768000 of credit — not the whole balance."
        test_recipe:
          setup:
            - "One PER_PLACEMENT placement created and terminated 15 days into its 60-day guarantee: invoice due 3536000, credited 2652000, employer credit 2652000."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - *k_iv
            - *k_clock_iv
            - *k_iv_done
            - *k_scr
            - *k_scr_cred
            - *k_scr_bg
            - *k_doc
            - *k_doc_ok
            - *k_offer
            - call: "POST /marketplace/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { placement_id: $.data.id }
            - call: "POST /marketplace/_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/placements/${placement_id}/terminate"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
            - call: "GET /marketplace/invoices"
              payload: { placement_id: "${placement_id}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /marketplace/invoices/${inv_id}/settle"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "Invoice.${inv_id}.status == SETTLED"
            - "Employer.${emp_id}.credit_balance_cents == 1768000 (2652000 credit minus 884000 residual drawn)"
            - "Invoice.${inv_id}.amount_due_cents == 3536000 and amount_credited_cents == 2652000 (unchanged by settle)"

      - name: placements_filter_by_requisition_and_status
        claim_type: Computed read
        grounds:
          - endpoints.GET_/marketplace/placements
        distinguishing_aspect: "The filtered placement list answers the reverse-reachability contract: after one acceptance and one termination, requisition_id filter returns 1 row and status filter TERMINATED_IN_GUARANTEE returns exactly that terminated placement."
        test_recipe:
          setup:
            - "One placement created then terminated in guarantee."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_nurse
            - *k_lic
            - *k_submit
            - *k_verify
            - *k_req
            - *k_app
            - *k_review
            - *k_iv
            - *k_clock_iv
            - *k_iv_done
            - *k_scr
            - *k_scr_cred
            - *k_scr_bg
            - *k_doc
            - *k_doc_ok
