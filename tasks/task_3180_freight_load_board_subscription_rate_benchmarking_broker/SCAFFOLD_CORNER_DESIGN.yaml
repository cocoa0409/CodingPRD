              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", variant: "BLENDED" }
              as: CarrierAdmin
              as_user_id: "${cc_carrier_id}"
              captures: { err: $.data.error_id }
          assert:
            - "403 and err == ERR_ANALYTICS_DEPTH_FORBIDDEN"

  - section: endpoints
    instances:
      - name: change_plan_stale_version_rejected_and_current_version_accepted
        claim_type: Conditional action
        grounds:
          - "concurrency_rules[subscription-change-plan-stale-version\"]"
          - "errors.ERR_STALE_VERSION"
        distinguishing_aspect: "OCC: after mark-past-due bumps Subscription.version to 2, change-plan carrying expected 1 fails 412 ERR_STALE_VERSION; re-reading version and retrying with 2 succeeds and bumps version to 3."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Two plans (PRO and ENTERPRISE) and a broker subscription on PRO (version 1)."]
          setup_api_calls:
            - *cc_clock
            - *cc_plan
            - *cc_plan_full
            - *cc_broker
            - &cc_sub_occ
              call: "POST /subscriptions"
              payload: { plan_id: "${cc_plan_id}", broker_org_id: "${cc_broker_id}" }
              as: PlatformAdmin
              captures: { cc_sub_occ_id: $.data.id, sub_v1: $.data.version }
            - &cc_sub_pd
              call: "POST /subscriptions/${cc_sub_occ_id}/mark-past-due"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${cc_sub_occ_id}/change-plan"
              payload: { plan_id: "${cc_plan_full_id}", expected_subscription_version: "${sub_v1}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /subscriptions/${cc_sub_occ_id}"
              payload: {}
              as: PlatformAdmin
              captures: { sub_v2: $.data.version }
            - call: "POST /subscriptions/${cc_sub_occ_id}/change-plan"
              payload: { plan_id: "${cc_plan_full_id}", expected_subscription_version: "${sub_v2}" }
              as: PlatformAdmin
          assert:
            - "First change-plan: 412 and err == ERR_STALE_VERSION"
            - "After mark-past-due the subscription version is 2"
            - "Second change-plan with the fresh version succeeds (200) and Subscription.version == 3 and plan_id == ${cc_plan_full_id}"

