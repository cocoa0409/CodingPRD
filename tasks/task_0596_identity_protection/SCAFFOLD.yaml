    shared_operations:
      - "POST /idp/specialist-engagements"
      - "GET /idp/specialist-engagements"
      - "GET /idp/specialist-engagements/{id}"
      - "GET /idp/specialists/{id}"
      - "GET /idp/restoration-cases"
      - "GET /idp/restoration-cases/{id}"
      - "GET /idp/alerts"
      - "GET /idp/alerts/{id}"
      - "GET /idp/subscribers/{id}"
      - "GET /idp/plans/{id}"

  - name: ClaimsAdjuster
    description: "Insurance adjuster; opaque operator id. Approves or denies claims but is barred from paying anything they approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /idp/insurance-claims/{id}/approve"
      - "POST /idp/insurance-claims/{id}/deny"
    shared_operations:
      - "GET /idp/insurance-claims"
      - "GET /idp/insurance-claims/{id}"
      - "GET /idp/subscribers"
      - "GET /idp/subscribers/{id}"
      - "GET /idp/subscribers/{id}/credit-summary"
      - "GET /idp/subscribers/{id}/family-members"
      - "GET /idp/subscribers/{id}/bureau-profiles"
      - "GET /idp/bureau-profiles/{id}"
      - "GET /idp/alerts"
      - "GET /idp/alerts/{id}"
      - "GET /idp/restoration-cases"
      - "GET /idp/restoration-cases/{id}"
      - "GET /idp/specialists/{id}"
      - "GET /idp/plans/{id}"

  - name: PlatformAdmin
    description: "Operations/monitoring-feed operator; opaque id. Ingests alerts and bureau scores, assigns specialists, pays and reverses claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /idp/plans"
      - "POST /idp/specialists"
      - "POST /idp/subscribers/{id}/suspend"
      - "POST /idp/subscribers/{id}/reactivate"
      - "POST /idp/bureau-profiles/{id}/score-refresh"
