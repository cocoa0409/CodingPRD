            - { call: "POST /talent/critical-roles", payload: { role_title: "Treasurer", department: "FIN", criticality_tier: "TIER_3", assessment_method: "WEIGHTED" }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { r: $.data.id, r_v: $.data.version } }
