          - calculations.contractual_time_windows
        distinguishing_aspect: |
          Each determination is individually lawful — 60 days against a 60-day claim and 1
          day against a 1-day claim both satisfy the grant-ceiling rule — but the running
          annual total is what the cap measures, and it aggregates across claim_typeS, so a
