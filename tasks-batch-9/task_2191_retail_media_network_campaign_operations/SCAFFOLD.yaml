  - method: GET
    path: "/rmn/auction-events"
    description: "Lists auction events, filterable by slot, winning line item and status."
    roles: [NetworkAdmin, AuctionService, MeasurementAnalyst, BillingOps, AccountManager]
    code: 200
    input: ["placement_slot_id?", "winning_line_item_id?", "status?", "shopper_segment?", "limit?", "offset?"]
    output: AuctionEvent[]
    side_effects: []
  - method: GET
    path: "/rmn/auction-events/{id}"
    description: "Reads one auction event with winner_score, second_best_score and clearing_price_cents."
    roles: [NetworkAdmin, AuctionService, MeasurementAnalyst, BillingOps, AccountManager]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: []
  - method: POST
    path: "/rmn/auction-events/{id}/rank"
    description: "Runs the ordered eligibility filter chain and relevance-adjusted ranking over every candidate line item on the slot, materialising one AuctionBid row per candidate."
    roles: [NetworkAdmin, AuctionService]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: ["sets status=RANKED", "creates one AuctionBid per candidate with rank, quality_adjusted_score, outcome and the first-matching filter_reason from relevance_adjusted_bid_ranking", "sets candidate_count, winner_score and second_best_score", "leaves winning_line_item_id null until award"]
  - method: POST
    path: "/rmn/auction-events/{id}/award"
    description: "Branching award fork from RANKED: a non-empty surviving pool awards the top-ranked bid at the second-price clearing price, an empty pool records NO_FILL."
    roles: [NetworkAdmin, AuctionService]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: ["non-empty pool: sets status=AWARDED, winning_line_item_id to the rank-1 bid's line item, clearing_price_cents from second_price_clearing, and marks that AuctionBid outcome=WON with every other surviving bid outcome=LOST", "empty pool: sets status=NO_FILL with no_fill_reason set from the last filter_reason encountered and winning_line_item_id left null"]
  - method: POST
    path: "/rmn/auction-events/{id}/settle"
    description: "Settles an AWARDED or NO_FILL auction, charging the winner and running the depth-3 budget-exhaustion cascade when the plan drains."
    roles: [NetworkAdmin, AuctionService, BillingOps]
    code: 200
    input: []
    output: AuctionEvent
    side_effects: ["sets status=SETTLED and settled_spend_cents from auction_settlement_amount (0 for NO_FILL)", "adds settled_spend_cents to LineItem.spend_cents and Campaign.delivered_spend_cents and moves the same amount from BudgetPlan.reserved_cents to BudgetPlan.consumed_cents", "L1: BudgetPlan ACTIVE -> EXHAUSTED when available_cents reaches 0", "L2: every DELIVERING Campaign on that plan -> PAUSED", "L3: every SERVING LineItem on those campaigns -> MANUAL_PAUSED with pause_reason=BUDGET_EXHAUSTED, releasing reservations and slot occupancy"]
  - method: GET
    path: "/rmn/auction-bids"
    description: "Lists the materialised bid ledger, filterable by auction event and line item, exposing rank, outcome and filter_reason."
    roles: [NetworkAdmin, AuctionService, MeasurementAnalyst, AccountManager]
    code: 200
    input: ["auction_event_id?", "line_item_id?", "outcome?", "filter_reason?", "limit?", "offset?"]
    output: AuctionBid[]
    side_effects: []
  - method: GET
    path: "/rmn/auction-bids/{id}"
    description: "Reads one auction bid row with its raw bid, relevance score, quality-adjusted score and rank."
    roles: [NetworkAdmin, AuctionService, MeasurementAnalyst, AccountManager]
    code: 200
    input: []
    output: AuctionBid
    side_effects: []
