scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_clinician_creation_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Clinician.fields.tax_home_verified
          - entities.Clinician.fields.status
          - entities.Clinician.fields.active_assignment_count
          - endpoints[POST /clinicians]
        distinguishing_aspect: "POST /clinicians with tax_home_verified omitted returns 201 with tax_home_verified false, status AVAILABLE, active_assignment_count 0, both ytd counters 0, version 1, and a dash-formatted UUID id with no type prefix."
        test_recipe:
          setup:
            - "Empty database; the logical clock has never been set, so it reads 2026-05-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX" }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
          assert:
            - "Response status is 201 and response_type == object"
            - "Clinician.${clin_id}.tax_home_verified == false (default applied)"
            - "Clinician.${clin_id}.status == AVAILABLE, active_assignment_count == 0, ytd_taxable_wages_cents == 0, ytd_nontaxable_stipend_cents == 0"
            - "Clinician.${clin_id}.version == 1 and created_at == 2026-05-01T00:00:00.000Z"
            - "Clinician.${clin_id}.id matches the 8-4-4-4-12 dashed UUID form and carries no `clin_` style prefix"

      - name: corner_clinician_get_unknown_id_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /clinicians/{id}]
          - errors[ERR_CLINICIAN_NOT_FOUND]
        distinguishing_aspect: "GET /clinicians/{id} with a syntactically valid but unknown UUID returns 404 ERR_CLINICIAN_NOT_FOUND, not 200 with a null body."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /clinicians/11111111-2222-4333-8444-555555555555"
              as: Recruiter
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 404 and error_id == ERR_CLINICIAN_NOT_FOUND"
            - "response_type == error and data contains only error_id and message"

      - name: corner_clinician_create_missing_required_employment_type_rejected
        claim_type: Required Fields
        grounds:
          - entities.Clinician.fields.employment_type
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "employment_type has source input with no default, so omitting it returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", primary_residence_state: "TX" }
              as: Recruiter
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 400 and error_id == ERR_VALIDATION"
            - "No Clinician row exists afterwards"

      - name: corner_clinician_create_invalid_enum_discipline_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Clinician.fields.discipline
          - validations[priority=5]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "discipline is constrained to {RN, NP, PHYSICIAN, CRNA, THERAPIST}; the value PARAMEDIC is rejected with 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "PARAMEDIC", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX" }
              as: Recruiter
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 400 and error_id == ERR_VALIDATION"

      - name: corner_facility_optional_fields_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Facility.fields.is_compact_member
          - entities.Facility.fields.max_concurrent_travelers
          - endpoints[POST /facilities]
        distinguishing_aspect: "Omitting is_compact_member and max_concurrent_travelers yields false and 2 (DEFAULT_MAX_CONCURRENT_TRAVELERS), not null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "Mesa Regional", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@mesa.example" }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
          assert:
            - "Response status is 201"
            - "Facility.${fac_id}.is_compact_member == false and max_concurrent_travelers == 2"

      - name: corner_per_diem_locality_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.PerDiemLocality
          - endpoints[POST /per-diem-localities]
        distinguishing_aspect: "PerDiemLocality declares common_fields false, so its create response exposes id and created_at but NO version and NO updated_at, and §1.5 declares no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
              captures: { loc_id: "$.data.id" }
          assert:
            - "Response status is 201; the data object contains id and created_at"
            - "The data object contains no `version` key and no `updated_at` key"
            - "created_at == 2026-05-01T00:00:00.000Z (logical-clock default, never wall clock)"

      - name: corner_license_status_input_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.License.fields.status
          - endpoints[POST /licenses]
          - state_machines.License.initial_state
        distinguishing_aspect: "License.status has source system, so a client-supplied status of VERIFIED is ignored and the row is created in PENDING_VERIFICATION."
        test_recipe:
          setup:
            - "One clinician exists."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
          trigger:
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true, status: "VERIFIED" }
              as: Recruiter
              captures: { lic_id: "$.data.id", err_id: "$.data.error_id" }
          assert:
            - "Either the request is rejected 400 ERR_VALIDATION for the undeclared `status` key, or it succeeds 201 with License.${lic_id}.status == PENDING_VERIFICATION; in no case is the license created VERIFIED"
            - "License.${lic_id}.verified_by_user_id == null and verified_at == null"

      - name: corner_licenses_sub_resource_read_is_filtered_and_paginated
        claim_type: Listing
        grounds:
          - endpoints[GET /clinicians/{id}/licenses]
          - entities.License.fields.clinician_id
        distinguishing_aspect: "GET /clinicians/{id}/licenses returns only that clinician's licenses, honours the status filter, and reports total_count and has_more from the pagination envelope."
        test_recipe:
          setup:
            - "Clinician Ada Reyes holds three licenses: a VERIFIED compact TX RN, a PENDING_VERIFICATION AZ RN, and a PENDING_VERIFICATION NM RN."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_tx: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "AZ", license_type: "RN", license_number: "AZ-RN-55011", expires_on: "2027-06-30", is_compact: false }
              as: Recruiter
              captures: { lic_az: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "NM", license_type: "RN", license_number: "NM-RN-31002", expires_on: "2027-06-30", is_compact: false }
              as: Recruiter
              captures: { lic_nm: "$.data.id" }
            - call: "POST /licenses/${lic_tx}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
          trigger:
            - call: "GET /clinicians/${clin_id}/licenses"
              as: Recruiter
              captures: { first_id: "$.data[0].id" }
          assert:
            - "The unfiltered read returns 3 rows with total_count == 3, has_more == false, limit == 10, offset == 0"
            - "GET /clinicians/${clin_id}/licenses?status=VERIFIED returns exactly 1 row whose id == ${lic_tx}"
            - "GET /clinicians/${clin_id}/licenses?limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true"

      - name: corner_assignment_create_computes_end_date_and_hour_partition
        claim_type: Computed Fields
        grounds:
          - entities.Assignment.fields.end_date
          - entities.Assignment.fields.guaranteed_hours_total
          - entities.Assignment.fields.covering_license_id
          - calculations.assignment_margin
          - endpoints[POST /assignments]
        distinguishing_aspect: "POST /assignments derives end_date = start_date + term_weeks*7 - 1 (2026-06-07 + 90 days = 2026-09-05), guaranteed_hours_total = 36*13 = 468 with remaining 468 / consumed 0 / waived 0, pins covering_license_id, and populates all four projected_* fields."
        test_recipe:
          setup:
            - "Facility Desert Valley (AZ, compact member, PHX-AZ locality at 22900 cents/day, capacity 2) and clinician Ada Reyes with a VERIFIED compact TX RN license expiring 2027-12-31."
          setup_api_calls:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
          trigger:
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
            - call: "GET /assignments/${asg_id}/credential-packets"
              as: Recruiter
              captures: { pkt_id: "$.data[0].id" }
          assert:
            - "Response status is 201; Assignment.${asg_id}.end_date == 2026-09-05 and term_weeks == 13"
            - "Assignment.${asg_id}.staffing_status == DRAFT and compliance_status == PENDING_CREDENTIALS"
            - "Assignment.${asg_id}.guaranteed_hours_total == 468, guaranteed_hours_remaining == 468, guaranteed_hours_consumed == 0, guaranteed_hours_waived == 0"
            - "Assignment.${asg_id}.covering_license_id == ${lic_id}"
            - "Assignment.${asg_id}.projected_gross_bill_cents == 6552000, projected_pay_cost_cents == 4967716, projected_margin_cents == 1584284, projected_margin_pct == 0.2418"
            - "Assignment.${asg_id}.realized_gross_bill_cents == 0 and realized_margin_pct == 0"
            - "GET /assignments/${asg_id}/contracts returns exactly one Contract ${con_id} in status DRAFT with term_weeks 13, weekly_guaranteed_hours 36, base_pay_rate_cents_per_hour 5200, bill_rate_cents_per_hour 14000, revision_count 0"
            - "GET /assignments/${asg_id}/credential-packets returns exactly one CredentialPacket ${pkt_id} in status DRAFT with readiness_score_start_basis 0, blocking_item_count_start_basis 5, readiness_score_full_term_basis 0, blocking_item_count_full_term_basis 5"

      - name: corner_assignment_list_filter_isolates_one_clinician
        claim_type: Parent Relationships
        grounds:
          - endpoints[GET /assignments]
          - entities.Assignment.fields.clinician_id
        distinguishing_aspect: "GET /assignments?clinician_id=X returns only X's assignments even when a second clinician holds an overlapping assignment at the same facility."
        test_recipe:
          setup:
            - "Facility Desert Valley with max_concurrent_travelers 2; clinicians Ada Reyes and Ben Osei each hold a VERIFIED compact TX RN license expiring 2027-12-31."
            - "Both clinicians have a DRAFT assignment at that facility covering 2026-06-07 .. 2026-09-05 (2 concurrent travelers is within the capacity of 2)."
          setup_api_calls:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_a_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_a_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_a_id: "$.data.id" }
            - call: "POST /licenses/${lic_a_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_a_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_a_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ben Osei", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_b_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_b_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-90455", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_b_id: "$.data.id" }
            - call: "POST /licenses/${lic_b_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_b_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_b_id: "$.data.id" }
          trigger:
            - call: "GET /assignments"
              as: Recruiter
              captures: { any_id: "$.data[0].id" }
          assert:
            - "GET /assignments with no filter returns 2 rows with total_count == 2"
            - "GET /assignments?clinician_id=${clin_a_id} returns exactly 1 row whose id == ${asg_a_id} and total_count == 1"
            - "GET /assignments?clinician_id=${clin_b_id} returns exactly 1 row whose id == ${asg_b_id}"
            - "GET /assignments?facility_id=${fac_id} returns 2 rows; GET /assignments?covering_license_id=${lic_b_id} returns exactly 1 row whose id == ${asg_b_id}"

  - section: state_machines
    instances:

      - name: corner_license_starts_pending_and_verify_stamps_actor_and_clock
        claim_type: Initial State
        grounds:
          - state_machines.License.PENDING_VERIFICATION_to_VERIFIED
          - entities.License.fields.verified_by_user_id
          - entities.License.fields.verified_at
        distinguishing_aspect: "A newly filed License is PENDING_VERIFICATION; POST /licenses/{id}/transition to=VERIFIED flips it and stamps verified_by_user_id with the acting X-User-ID and verified_at from the logical clock."
        test_recipe:
          setup:
            - "Logical clock set to 2026-05-10T09:30:00Z; one clinician with one PENDING_VERIFICATION license."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
          assert:
            - "Before the trigger License.${lic_id}.status == PENDING_VERIFICATION with version 1"
            - "After the trigger License.${lic_id}.status == VERIFIED, verified_by_user_id == cs-1, verified_at == 2026-05-10T09:30:00.000Z, version == 2"

      - name: corner_license_expired_is_terminal_and_rejects_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.License.VERIFIED_to_EXPIRED
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "EXPIRED is declared terminal for License, so a subsequent transition back to VERIFIED is refused with 409 ERR_INVALID_TRANSITION and the row is unchanged."
        test_recipe:
          setup:
            - "One clinician with a license that has been VERIFIED and then EXPIRED."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2026-05-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "EXPIRED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
          trigger:
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 409 with error_id == ERR_INVALID_TRANSITION"
            - "License.${lic_id}.status is still EXPIRED"

      - name: corner_contract_cannot_jump_from_draft_to_fully_executed
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Contract.DRAFT_to_SENT_FOR_SIGNATURE
          - state_machines.Contract.SENT_FOR_SIGNATURE_to_FULLY_EXECUTED
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "FULLY_EXECUTED is only an outgoing edge of SENT_FOR_SIGNATURE, so executing straight out of DRAFT is refused 409 ERR_INVALID_TRANSITION and the assignment stays in DRAFT."
        test_recipe:
          setup:
            - "Facility, clinician with VERIFIED compact TX RN license, and an assignment whose contract is still DRAFT."
          setup_api_calls:
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
              as: PlatformAdmin
            - call: "POST /facilities"
              payload: { name: "Desert Valley Medical Center", state_code: "AZ", per_diem_locality_code: "PHX-AZ", billing_contact_email: "ap@dvmc.example", is_compact_member: true, max_concurrent_travelers: 2 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /clinicians"
              payload: { full_name: "Ada Reyes", discipline: "RN", specialty: "ICU", employment_type: "W2_EMPLOYEE", primary_residence_state: "TX", tax_home_verified: true }
              as: Recruiter
              captures: { clin_id: "$.data.id" }
            - call: "POST /licenses"
              payload: { clinician_id: "${clin_id}", state_code: "TX", license_type: "RN", license_number: "TX-RN-88120", expires_on: "2027-12-31", is_compact: true }
              as: Recruiter
              captures: { lic_id: "$.data.id" }
            - call: "POST /licenses/${lic_id}/transition"
              payload: { to: "VERIFIED" }
              as: CredentialingSpecialist
              as_user_id: "cs-1"
            - call: "POST /assignments"
              payload: { clinician_id: "${clin_id}", facility_id: "${fac_id}", specialty: "ICU", required_license_type: "RN", start_date: "2026-06-07", term_weeks: 13, weekly_guaranteed_hours: 36, base_pay_rate_cents_per_hour: 5200, bill_rate_cents_per_hour: 14000, shift: "DAY" }
              as: Recruiter
              captures: { asg_id: "$.data.id" }
            - call: "GET /assignments/${asg_id}/contracts"
              as: Recruiter
              captures: { con_id: "$.data[0].id" }
          trigger:
            - call: "POST /contracts/${con_id}/transition"
              payload: { to: "FULLY_EXECUTED" }
              as: Clinician
              as_user_id: "${clin_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response status is 409 with error_id == ERR_INVALID_TRANSITION"
            - "Contract.${con_id}.status is still DRAFT and clinician_signed_at == null"
            - "Assignment.${asg_id}.staffing_status is still DRAFT and Clinician.${clin_id}.active_assignment_count == 0"

