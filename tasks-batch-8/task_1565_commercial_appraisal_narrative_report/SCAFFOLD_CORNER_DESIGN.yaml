              as_user_id: "${aa_id}"
            - call: "POST /reports/${rep_id}/review_approve"
              payload: {}
              as: ReviewAppraiser
              as_user_id: "${rr_id}"
            - call: "POST /reports/${rep_id}/issue_to_client"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: EngagementManager
            - call: "POST /reports/${rep_id}/revision-requests"
              payload: { category: "CLARIFICATION", requested_change: "Clarify zoning paragraph" }
              as: Client
              as_user_id: "${cl_id}"
              captures: { rq1_id: $.data.id, rq1_st: $.data.status }
            - call: "POST /revision-requests/${rq1_id}/withdraw"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /reports/${rep_id}/reissue"
              payload: {}
              as: StaffAppraiser
              as_user_id: "${aa_id}"
