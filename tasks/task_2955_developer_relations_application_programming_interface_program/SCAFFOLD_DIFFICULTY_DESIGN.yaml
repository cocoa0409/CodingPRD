  - rule_id: non_linear_state_machine
    instances:
      - name: access_application_revision_cycle_capped_at_three_rounds
        grounds:
          - state_machines.AccessApplication.UNDER_REVIEW_to_CHANGES_REQUESTED
          - state_machines.AccessApplication.CHANGES_REQUESTED_to_SUBMITTED
          - entities.AccessApplication.fields.revision_round
          - validations.revision_cap
          - errors.ERR_REVISION_LIMIT_REACHED
        distinguishing_aspect: |
          Cyclic sub-graph with a bounded loop counter: UNDER_REVIEW -> CHANGES_REQUESTED ->
          SUBMITTED -> UNDER_REVIEW can be walked twice, and the third request-changes on the same
          application is refused because revision_round has reached MAX_REVISION_ROUNDS 3. The loop
          counter, not the state, is what closes the cycle, so the application is still in
          UNDER_REVIEW after the refusal and remains decidable.
        test_recipe:
          setup:
            - "Developer D1 has acknowledged docs 2 / terms 1 and holds a DRAFT application against the GA version of ApiProduct P1"
            - "DevRelManager drm-1 is the only reviewer, so it stays the recorded reviewer_user_id across the whole cycle"
