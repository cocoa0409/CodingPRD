            - call: "POST /label-approvals/${labh_id}/decide"
              payload: { decision: "APPROVE" }
              as: RegulatoryApprover
            - call: "POST /innovation-projects/${ph_id}/gate-reviews"
              payload: { gate_id: "${g2h_id}", scheduled_at: "2026-08-07T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-ph"
              captures: { grh2_id: $.data.id }
            - call: "POST /gate-reviews/${grh2_id}/open"
              payload: {}
              as: GateChair
              as_user_id: "chair-ph"
            - call: "POST /gate-reviews/${grh2_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE" }
              as: FunctionalReviewer
              as_user_id: "rev-ops"
            - call: "POST /gate-reviews/${grh2_id}/close"
              payload: {}
              as: GateChair
              as_user_id: "chair-ph"
            - call: "POST /innovation-projects/${ph_id}/deliverables"
              payload: { gate_id: "${g3h_id}", deliverable_type: "MANUFACTURING_READINESS", owner_function: "OPERATIONS" }
              as: GateChair
              as_user_id: "chair-ph"
              captures: { d_mfg_id: $.data.id }
            - call: "POST /innovation-projects/${ph_id}/deliverables"
              payload: { gate_id: "${g3h_id}", deliverable_type: "SALES_SELL_IN_PLAN", owner_function: "SALES" }
              as: GateChair
              as_user_id: "chair-ph"
              captures: { d_sales_id: $.data.id }
            - call: "POST /deliverables/${d_mfg_id}/submit"
              payload: { evidence_url: "https://npd.example/ph/mfg-readiness" }
