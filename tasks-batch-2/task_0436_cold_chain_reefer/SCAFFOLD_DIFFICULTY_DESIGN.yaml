scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: degree_minutes_provisional_vs_final_diverge_on_compartment
        grounds:
          - calculations.degree_minutes_out_of_range
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - entities.Compartment.fields.degree_minutes_out
        distinguishing_aspect: "On a Compartment domain, PROVISIONAL extends the last TEMP reading to clock-now (offset 140 -> 240 degree-minutes) while FINAL closes the series at the last reading offset 80 (-> 60 degree-minutes); same readings, different number."
        test_recipe:
          setup:
            - "FROZEN lane [-25,-15], tol 30; FOOD shipment with 1 FROZEN compartment, IN_TRANSIT."
            - "TEMP readings (offset 0,-20),(60,-12),(80,-12); logical clock at IN_TRANSIT-start + 140 min for the provisional read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Polar Freight", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-1"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-1", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-1"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-1"
              captures: { comp_id: $.data.id }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-1"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-1"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-1"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-1"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-1"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 0, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-1"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -12 }
              as: Driver
              as_user_id: "driver-op-1"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 80, temp_c: -12 }
              as: Driver
              as_user_id: "driver-op-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T02:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /compartments/${comp_id}/excursion-report"
              as: Driver
              as_user_id: "driver-op-1"
              captures: { prov: $.data.provisional_degree_minutes_out }
          assert:
            - "excursion-report.provisional_degree_minutes_out == 240"
            - "After POST /shipments/${ship_id}/deliver (DELIVERY stops closed), Compartment.${comp_id}.degree_minutes_out == 60 (FINAL), strictly less than the provisional 240."

      - name: spoilage_payout_eligible_vs_settled_diverge_on_claim
        grounds:
          - calculations.spoilage_claim_payout
          - state_machines.SpoilageClaim.UNDER_REVIEW_to_APPROVED
          - entities.SpoilageClaim.fields.claimed_value_cents
          - entities.SpoilageClaim.fields.approved_payout_cents
          - entities.Carrier.fields.liability_cap_cents
        distinguishing_aspect: "On the SpoilageClaim/Carrier domain, ELIGIBLE claimed_value_cents = 1750001 (uncapped) but SETTLED approved_payout_cents = min(1750001, carrier cap 1500000) = 1500000; the carrier cap makes the two variants diverge — a different entity domain than the Compartment dual-variant above."
        test_recipe:
          setup:
            - "Carrier liability_cap_cents = 1500000. DELIVERED FOOD shipment, 1 FROZEN compartment in TOTAL_LOSS (degree_minutes 300 > 120)."
            - "Two lots declared 1000000 and 750001; both SPOILED (factor 1.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Capped Carrier", fsma_registered: true, sanitary_training_current: true, liability_cap_cents: 1500000 }
              as: Carrier
              as_user_id: "carrier-op-2"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-2", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-2"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-2"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-2"
              captures: { comp_id: $.data.id }
            - call: "POST /compartments/${comp_id}/lots"
              payload: { sku: "BEEF-A", pallet_count: 4, declared_value_cents: 1000000 }
              as: Shipper
              as_user_id: "shipper-op-2"
            - call: "POST /compartments/${comp_id}/lots"
              payload: { sku: "BEEF-B", pallet_count: 4, declared_value_cents: 750001 }
              as: Shipper
              as_user_id: "shipper-op-2"
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-2"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-2"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-2"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-2"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-2"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 0, temp_c: -10 }
              as: Driver
              as_user_id: "driver-op-2"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-2"
            - call: "POST /shipments/${ship_id}/deliver"
              as: Driver
              as_user_id: "driver-op-2"
            - call: "POST /spoilage-claims"
              payload: { shipment_id: "${ship_id}" }
              as: Shipper
              as_user_id: "shipper-op-2"
              captures: { claim_id: $.data.id, eligible: $.data.claimed_value_cents }
            - call: "POST /spoilage-claims/${claim_id}/review"
              as: ComplianceOfficer
              as_user_id: "co-op-2"
          trigger:
            - call: "POST /spoilage-claims/${claim_id}/approve"
              as: ComplianceOfficer
              as_user_id: "co-op-2"
              captures: { settled: $.data.approved_payout_cents }
          assert:
            - "SpoilageClaim.${claim_id}.claimed_value_cents == 1750001"
            - "SpoilageClaim.${claim_id}.approved_payout_cents == 1500000"
            - "approved_payout_cents != claimed_value_cents (carrier cap bound the SETTLED variant)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: detention_fee_tiered_ceil_nonlinear_mode_a
        grounds:
          - calculations.detention_fee
          - state_machines.StopEvent.ARRIVED_to_CLOSED
          - entities.StopEvent.fields.detention_fee_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (dwell, FREE_TIME_MIN, two tier rates) with non-linear interaction — ceil-to-whole-hour then tiered-rate selection; dwell 500 -> billable 380 -> ceil 7h -> 4*5000 + 3*7500 = 42500."
        test_recipe:
          setup:
            - "IN_TRANSIT shipment with a DELIVERY stop; arrived_min 0, departed_min 500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Tier Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-3"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "CHILLED", setpoint_min_c: 0, setpoint_max_c: 4, regulated: true }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-3", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-3"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-3"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-3"
              captures: { comp_id: $.data.id }
            - call: "POST /shipments/${ship_id}/stops"
              payload: { kind: "DELIVERY", appointment_min: 0, pallets_handled: 0, compartments_touched: 1 }
              as: Shipper
              as_user_id: "shipper-op-3"
              captures: { stop_id: $.data.id }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-3"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-3"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: 2 }
              as: Carrier
              as_user_id: "carrier-op-3"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-3"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-3"
            - call: "POST /shipments/${ship_id}/stops/${stop_id}/arrive"
              payload: { arrived_min: 0 }
              as: Driver
              as_user_id: "driver-op-3"
          trigger:
            - call: "POST /shipments/${ship_id}/stops/${stop_id}/close"
              payload: { departed_min: 500, pallets_handled: 0, compartments_touched: 1 }
              as: Driver
              as_user_id: "driver-op-3"
              captures: { fee: $.data.detention_fee_cents }
          assert:
            - "StopEvent.${stop_id}.detention_fee_cents == 42500"
            - "Shipment.${ship_id}.total_detention_fee_cents == 42500"

      - name: spoilage_payout_round_per_lot_then_sum_mode_b
        grounds:
          - calculations.spoilage_claim_payout
          - entities.SpoilageClaim.fields.claimed_value_cents
          - entities.Compartment.fields.degree_minutes_out
        distinguishing_aspect: "Mode (b): nested rounding where order matters — round_half_up per lot THEN sum yields 216668 for two PARTIAL lots (333333,100001 at factor 0.5), whereas sum-then-round would give 216667; the scaffold pins round-per-lot-first."
        test_recipe:
          setup:
            - "DELIVERED FOOD shipment, 1 FROZEN compartment in PARTIAL (degree_minutes 60, between tol 30 and tol+90 120)."
            - "Two lots declared 333333 and 100001; factor 0.5 each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Round Carrier", fsma_registered: true, sanitary_training_current: true, liability_cap_cents: 100000000 }
              as: Carrier
              as_user_id: "carrier-op-4"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-4", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-4"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-4"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-4"
              captures: { comp_id: $.data.id }
            - call: "POST /compartments/${comp_id}/lots"
              payload: { sku: "LOT-X", pallet_count: 2, declared_value_cents: 333333 }
              as: Shipper
              as_user_id: "shipper-op-4"
            - call: "POST /compartments/${comp_id}/lots"
              payload: { sku: "LOT-Y", pallet_count: 2, declared_value_cents: 100001 }
              as: Shipper
              as_user_id: "shipper-op-4"
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-4"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-4"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-4"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-4"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-4"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 0, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-4"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -12 }
              as: Driver
              as_user_id: "driver-op-4"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 80, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-4"
            - call: "POST /shipments/${ship_id}/deliver"
              as: Driver
              as_user_id: "driver-op-4"
          trigger:
            - call: "POST /spoilage-claims"
              payload: { shipment_id: "${ship_id}" }
              as: Shipper
              as_user_id: "shipper-op-4"
              captures: { claim_id: $.data.id, eligible: $.data.claimed_value_cents }
          assert:
            - "Compartment.${comp_id}.degree_minutes_out == 60 (FINAL, PARTIAL)"
            - "SpoilageClaim.${claim_id}.claimed_value_cents == 216668 (round-per-lot 166667 + 50001, NOT sum-then-round 216667)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: spoilage_claim_branch_review_to_approved_or_denied
        grounds:
          - state_machines.SpoilageClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.SpoilageClaim.UNDER_REVIEW_to_DENIED
          - entities.SpoilageClaim.fields.approved_payout_cents
        distinguishing_aspect: "On SpoilageClaim, UNDER_REVIEW forks to APPROVED (sets approved_payout_cents = min(claimed,cap), stamps lot spoilage_status) OR to DENIED (approved_payout_cents stays 0, lots untouched) — divergent side-effect sets from the same source state."
        test_recipe:
          setup:
            - "Two DELIVERED impaired shipments, each with a claim moved to UNDER_REVIEW; claim A approved, claim B denied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Branch Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-5"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
              payload: { carrier_id: "${carrier_id}", asset_tag: "RU-5", compartment_count: 1, last_sanitation_at: "2026-02-28T00:00:00Z" }
              as: Carrier
              as_user_id: "carrier-op-5"
              captures: { unit_id: $.data.id }
            - call: "POST /shipments"
              payload: { carrier_id: "${carrier_id}", cargo_class: "FOOD" }
              as: Shipper
              as_user_id: "shipper-op-5"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/compartments"
              payload: { temp_lane_id: "${lane_id}", ordinal: 1 }
              as: Shipper
              as_user_id: "shipper-op-5"
              captures: { comp_id: $.data.id }
            - call: "POST /compartments/${comp_id}/lots"
              payload: { sku: "LOT-Z", pallet_count: 2, declared_value_cents: 500000 }
              as: Shipper
              as_user_id: "shipper-op-5"
              captures: { lot_id: $.data.id }
            - call: "GET /shipments/${ship_id}"
              as: Carrier
              as_user_id: "carrier-op-5"
              captures: { ship_v: $.data.version }
            - call: "POST /shipments/${ship_id}/accept"
              payload: { reefer_unit_id: "${unit_id}", expected_shipment_version: "${ship_v}" }
              as: Carrier
              as_user_id: "carrier-op-5"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "PRECOOL", offset_min: 0, temp_c: -20 }
              as: Carrier
              as_user_id: "carrier-op-5"
            - call: "POST /shipments/${ship_id}/precool-verify"
              as: Carrier
              as_user_id: "carrier-op-5"
            - call: "POST /shipments/${ship_id}/dispatch"
              as: Carrier
              as_user_id: "carrier-op-5"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 0, temp_c: -5 }
              as: Driver
              as_user_id: "driver-op-5"
            - call: "POST /compartments/${comp_id}/readings"
              payload: { kind: "TEMP", offset_min: 60, temp_c: -20 }
              as: Driver
              as_user_id: "driver-op-5"
            - call: "POST /shipments/${ship_id}/deliver"
              as: Driver
              as_user_id: "driver-op-5"
            - call: "POST /spoilage-claims"
              payload: { shipment_id: "${ship_id}" }
              as: Shipper
              as_user_id: "shipper-op-5"
              captures: { claim_id: $.data.id }
            - call: "POST /spoilage-claims/${claim_id}/review"
              as: ComplianceOfficer
              as_user_id: "co-op-5"
          trigger:
            - call: "POST /spoilage-claims/${claim_id}/deny"
              as: ComplianceOfficer
              as_user_id: "co-op-5"
              captures: { st: $.data.status, payout: $.data.approved_payout_cents }
          assert:
            - "SpoilageClaim.${claim_id}.status == DENIED"
            - "SpoilageClaim.${claim_id}.approved_payout_cents == 0"
            - "ProductLot.${lot_id}.spoilage_status == SOUND (deny branch leaves lots untouched)"

      - name: shipment_precooled_branches_to_in_transit_or_cancelled
        grounds:
          - state_machines.Shipment.PRECOOLED_to_IN_TRANSIT
          - state_machines.Shipment.PRECOOLED_to_CANCELLED
          - state_machines.ReeferUnit.ASSIGNED_to_AVAILABLE
        distinguishing_aspect: "On Shipment (a different entity than SpoilageClaim), PRECOOLED forks to IN_TRANSIT (unit ASSIGNED->IN_TRANSIT, telemetry anchored) OR to CANCELLED (unit ASSIGNED->AVAILABLE, reefer_unit_id cleared) — divergent cross-entity side effects on the ReeferUnit."
        test_recipe:
          setup:
            - "FOOD shipment in PRECOOLED with an assigned reefer unit; shipper cancels instead of dispatching."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Fork Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-6"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
              as: PlatformAdmin
              captures: { lane_id: $.data.id }
            - call: "POST /reefer-units"
