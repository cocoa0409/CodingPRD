scenario: "Product Testing Laboratory, Anonymous Purchase & Ratings Publication (Consumer Reports): product selection for testing based on market share, member interest and category refresh cycles, anonymous retail purchase of test samples to avoid manufacturer-supplied units with sourcing documentation, laboratory protocol development per category with repeatable measurement and scoring weights, reliability and satisfaction data collected from member surveys with sample size thresholds, rating publication with recommendation designations and refusal to accept advertising or allow use of ratings in marketing, safety findings escalation including recall advocacy and regulator communication, methodology transparency and manufacturer response handling, membership subscription funding and digital access management"
domain_name: product-testing-lab-ratings
api_prefix: ""
complexity_profile:
  primary_archetype: compliance / audit
  secondary_archetype: workflow orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops-run checkpoint
    - rate / threshold triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: ProductCategory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "category display name; unique" }
      - { name: refresh_cycle_months, type: integer, source: input, description: "months between mandatory retest cycles; >= 1" }
      - { name: market_share_pct, type: number, source: input, description: "0-100 inclusive; feeds selection_score" }
      - { name: member_interest_pct, type: number, source: input, description: "0-100 inclusive; feeds selection_score" }
      - { name: last_published_at, type: datetime, source: computed, description: "UTC of latest PUBLISHED non-WITHDRAWN RatingPublication in category; null if none", default: null }
      - { name: selection_score, type: number, source: computed, description: "selection_score calculation; recomputed on _cycle/run and on publish/withdraw events", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | RETIRED; RETIRED excluded from cycle recompute", default: ACTIVE, constraints: "enum ACTIVE SUSPENDED RETIRED" }
  - name: TestProgram
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> ProductCategory.id; category status must be ACTIVE" }
      - { name: fiscal_year, type: integer, source: input, description: "program year" }
      - { name: budget_cents, type: integer, source: input, description: ">= 0" }
      - { name: committed_cents, type: integer, source: computed, description: "sum of total_cents of linked PurchaseOrders with status IN {PLACED, RECEIVED, VERIFIED}; ledger-synced on PO place/cancel", default: 0 }
      - { name: proposed_by_user_id, type: string, source: system, description: "opaque LabManager X-User-ID at create" }
      - { name: approved_by_user_id, type: string, source: system, description: "opaque EditorialDirector X-User-ID at approve; SoD: must differ from proposed_by_user_id", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | SAMPLE_SOURCING | TESTING | SCORING | READY_FOR_PUBLICATION | PUBLISHED | CANCELLED", default: PROPOSED, constraints: "enum PROPOSED APPROVED SAMPLE_SOURCING TESTING SCORING READY_FOR_PUBLICATION PUBLISHED CANCELLED" }
  - name: LabProtocol
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> ProductCategory.id" }
      - { name: protocol_code, type: string, source: input, description: "unique per category among protocols with status IN {DRAFT, IN_REVIEW, ACTIVE}" }
      - { name: measurement_repeat_min, type: integer, source: input, description: ">= 1; repeats per unit per metric" }
      - { name: perf_weight_pct, type: integer, source: input, description: "1-98" }
      - { name: reliability_weight_pct, type: integer, source: input, description: "1-98; perf + reliability <= 99" }
      - { name: convenience_weight_pct, type: integer, source: computed, description: "100 - perf_weight_pct - reliability_weight_pct; must be >= 1" }
      - { name: activated_at, type: datetime, source: system, description: "UTC of ACTIVE transition", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | ACTIVE | SUPERSEDED | RETIRED", default: DRAFT, constraints: "enum DRAFT IN_REVIEW ACTIVE SUPERSEDED RETIRED" }
  - name: TestSample
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TestProgram.id" }
      - { name: model_label, type: string, source: input, description: "product model under test" }
      - { name: required_units, type: integer, source: input, description: ">= 1" }
      - { name: sourcing_mode, type: enum, source: system, description: "always ANONYMOUS_RETAIL; manufacturer-supplied units forbidden", default: ANONYMOUS_RETAIL, constraints: "enum ANONYMOUS_RETAIL" }
      - { name: sourced_units, type: integer, source: computed, description: "sum of line.qty over lines in PurchaseOrders of program with status IN {RECEIVED, VERIFIED} where line.sample_id == this sample", default: 0 }
      - { name: sourcing_complete, type: boolean, source: computed, description: "sourced_units >= required_units", default: false }
      - { name: tested_units, type: integer, source: computed, description: "count of distinct unit_index 1..required_units with >= protocol.measurement_repeat_min Measurements for this sample under the category ACTIVE protocol", default: 0 }
      - { name: testing_complete, type: boolean, source: computed, description: "tested_units >= required_units", default: false }
      - { name: lab_score, type: number, source: computed, description: "measurement_score result at program start-scoring; null until SCORING", default: null }
      - { name: status, type: enum, source: system, description: "PLANNED | SOURCING | IN_LAB | SCORED", default: PLANNED, constraints: "enum PLANNED SOURCING IN_LAB SCORED" }
  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TestProgram.id; program must be SAMPLE_SOURCING at create and place" }
      - { name: buyer_alias, type: string, source: input, description: "anonymous purchasing alias; never a manufacturer identity" }
      - { name: retailer_name, type: string, source: input, description: "retail channel; forbidden when it names a manufacturer-direct channel (suffix '-direct' or equal to brand manufacturer name)" }
      - { name: receipt_doc_ref, type: string, source: input, description: "sourcing documentation reference; required non-empty for verify" }
      - { name: lines, type: array, source: input, description: ">= 1 line objects {sample_id, unit_price_cents >= 0, qty >= 1, tax_rate_bp 0-20000}; each line.sample_id must belong to program; server adds computed line_tax_cents per line" }
      - { name: subtotal_cents, type: integer, source: computed, description: "sum of unit_price_cents * qty over lines" }
      - { name: shipping_cents, type: integer, source: input, description: ">= 0" }
      - { name: tax_cents, type: integer, source: computed, description: "po_tax: sum of per-line round_half_up(unit_price_cents * qty * tax_rate_bp / 10000)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + shipping_cents + tax_cents" }
      - { name: placed_by_user_id, type: string, source: system, description: "opaque PurchasingAgent X-User-ID at place", default: null }
      - { name: verified_by_user_id, type: string, source: system, description: "opaque ComplianceOfficer X-User-ID at verify; SoD: must differ from placed_by_user_id", default: null }
      - { name: placed_at, type: datetime, source: system, description: "logical-clock UTC at place", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | PLACED | RECEIVED | VERIFIED | CANCELLED", default: DRAFT, constraints: "enum DRAFT PLACED RECEIVED VERIFIED CANCELLED" }
  - name: Measurement
    parent: null
    common_fields: false
    fields:
      - { name: sample_id, type: string, source: input, description: "FK -> TestSample.id; sample must be IN_LAB" }
      - { name: unit_index, type: integer, source: input, description: "1..sample.required_units" }
      - { name: metric_code, type: string, source: input, description: "e.g. SUCTION_KPA" }
      - { name: value_num, type: number, source: input, description: "raw measured value" }
      - { name: recorded_at, type: datetime, source: system, description: "logical-clock UTC" }
      - { name: recorded_by_user_id, type: string, source: system, description: "opaque LabTechnician X-User-ID" }
  - name: SurveyWave
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> ProductCategory.id" }
      - { name: field_start, type: datetime, source: input, description: "window start (logical clock)" }
      - { name: field_end, type: datetime, source: input, description: "window end; must be > field_start" }
      - { name: min_responses, type: integer, source: input, description: "sample-size threshold; >= 1" }
      - { name: responses, type: array, source: input, description: "embedded response objects appended via transitions action submit_response: {response_index (system seq from 1), member_id (references Member.id), model_label, reliability_score 0-100, satisfaction_score 0-100, submitted_at (system), submitted_by_user_id (system: acting X-User-ID, must equal member_id), status COUNTED|EXCLUDED}" }
      - { name: response_count, type: integer, source: computed, description: "count of responses with status COUNTED", default: 0 }
      - { name: threshold_met, type: boolean, source: computed, description: "response_count >= min_responses; recomputed on submit_response and exclude_response", default: false }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | QUALIFIED | DISQUALIFIED", default: OPEN, constraints: "enum OPEN CLOSED QUALIFIED DISQUALIFIED" }
  - name: RatingPublication
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TestProgram.id; at most one PUBLISHED publication per program" }
      - { name: embargo_until, type: datetime, source: input, description: "invisible to Member role and unpublishable before this logical-clock instant" }
      - { name: version_note, type: string, source: input, description: "editor note", default: "" }
      - { name: rated_models, type: array, source: computed, description: "embedded objects added via transitions action add_rated_model: {sample_id, lab_score, survey_score (null without pinned wave data), overall_score, designation, price_cents}; computed at add time", default: [] }
      - { name: model_count, type: integer, source: computed, description: "len(rated_models)", default: 0 }
      - { name: protocol_id_snapshot, type: string, source: system, description: "ACTIVE LabProtocol pinned at approve", default: null }
      - { name: survey_wave_id_snapshot, type: string, source: system, description: "latest QUALIFIED SurveyWave of category (field_end DESC, tie created_at ASC) pinned at approve; null if none", default: null }
      - { name: manufacturer_responses, type: array, source: computed, description: "embedded objects via transitions action log_manufacturer_response: {response_index (system seq from 1), manufacturer_name, body_text, received_at (system clock), status RECEIVED|ACCEPTED|REJECTED}", default: [] }
      - { name: manufacturer_response_text, type: string, source: computed, description: "body_text of latest ACCEPTED manufacturer response; null if none", default: null }
      - { name: published_at, type: datetime, source: system, description: "logical-clock UTC at publish", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | PUBLISHED | WITHDRAWN", default: DRAFT, constraints: "enum DRAFT UNDER_REVIEW REVISION_REQUESTED APPROVED PUBLISHED WITHDRAWN" }
  - name: SafetyFinding
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> TestProgram.id" }
      - { name: sample_id, type: string, source: input, description: "FK -> TestSample.id; sample must belong to program" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR", constraints: "enum CRITICAL MAJOR MINOR" }
      - { name: description_text, type: string, source: input, description: "finding narrative" }
      - { name: hazard_flag, type: boolean, source: input, description: "immediate-hazard marker", default: false }
      - { name: recalled_model_count, type: integer, source: computed, description: "count of rated_models entries across non-WITHDRAWN publications of program whose sample's model_label == this finding's sample model_label and designation == NOT_RECOMMENDED; recomputed at create/escalate", default: 0 }
      - { name: escalation_tier, type: integer, source: computed, description: "safety_escalation calculation: 0 logged, 1 manufacturer notice, 2 recall advocacy, 3 regulator communication", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED | CLOSED", default: OPEN, constraints: "enum OPEN ESCALATED RESOLVED CLOSED" }
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "unique, lowercased" }
      - { name: full_name, type: string, source: input, description: "display name" }
      - { name: subscriptions, type: array, source: input, description: "embedded subscription objects, at most one with status IN {ACTIVE, GRACE}: {subscription_id (system seq string), plan_tier DIGITAL|ALL_ACCESS, term_start, term_end, grace_until (computed term_end + 14 days), status ACTIVE|GRACE|EXPIRED|CANCELLED, renewal_count (default 0)}" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | CANCELLED", default: ACTIVE, constraints: "enum ACTIVE LAPSED CANCELLED" }

state_machines:
  - entity: TestProgram
    initial_state: PROPOSED
    terminal_states: [CANCELLED]
    transitions:
      - from: PUBLISHED
        to: READY_FOR_PUBLICATION
        trigger: "system revert cascade: the program's PUBLISHED RatingPublication transitions to WITHDRAWN"
        actor: system
        preconditions: ["publication WITHDRAWN while program PUBLISHED"]
        side_effects: ["version +1"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /test-programs/{id}/transitions {action: approve} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status == PROPOSED", "actor X-User-ID != proposed_by_user_id (SoD)"]
        side_effects: ["approved_by_user_id := actor", "version +1"]
      - from: APPROVED
        to: SAMPLE_SOURCING
        trigger: "POST /test-programs/{id}/transitions {action: start_sourcing} by LabManager"
        actor: LabManager
        preconditions: ["status == APPROVED", ">= 1 TestSample for program", "an ACTIVE LabProtocol exists for program.category_id"]
        side_effects: ["every PLANNED TestSample of program -> SOURCING", "version +1"]
      - from: SAMPLE_SOURCING
        to: TESTING
        trigger: "POST /test-programs/{id}/transitions {action: start_testing} by LabManager"
        actor: LabManager
        preconditions: ["status == SAMPLE_SOURCING", "every TestSample of program has sourcing_complete == true", "no PurchaseOrder of program in status IN {DRAFT, PLACED}"]
        side_effects: ["every TestSample -> IN_LAB", "version +1"]
      - from: TESTING
        to: SCORING
        trigger: "POST /test-programs/{id}/transitions {action: start_scoring} by LabManager"
        actor: LabManager
        preconditions: ["status == TESTING", "every TestSample of program has testing_complete == true"]
        side_effects: ["per sample: lab_score := measurement_score(sample)", "version +1"]
      - from: SCORING
        to: READY_FOR_PUBLICATION
        trigger: "POST /test-programs/{id}/transitions {action: ready} by LabManager"
        actor: LabManager
        preconditions: ["status == SCORING", "no SafetyFinding of program with status IN {OPEN, ESCALATED} and escalation_tier >= 2"]
        side_effects: ["every TestSample IN_LAB -> SCORED", "version +1"]
      - from: READY_FOR_PUBLICATION
        to: PUBLISHED
        trigger: "system: bubble-up when a RatingPublication of this program transitions APPROVED -> PUBLISHED"
        actor: system
        preconditions: ["publication publish transition succeeds"]
        side_effects: ["ProductCategory.last_published_at := published_at", "ProductCategory.selection_score recomputed", "version +1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /test-programs/{id}/transitions {action: cancel} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status IN {PROPOSED, APPROVED}"]
        side_effects: ["every DRAFT PurchaseOrder of program -> CANCELLED", "version +1"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /test-programs/{id}/transitions {action: cancel} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status IN {PROPOSED, APPROVED}"]
        side_effects: ["every DRAFT PurchaseOrder of program -> CANCELLED", "version +1"]
  - entity: LabProtocol
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /lab-protocols/{id}/transitions {action: submit_review} by LabManager"
        actor: LabManager
        preconditions: ["status == DRAFT"]
        side_effects: ["version +1"]
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /lab-protocols/{id}/transitions {action: return_draft} by MethodologyOfficer"
        actor: MethodologyOfficer
        preconditions: ["status == IN_REVIEW"]
        side_effects: ["version +1"]
      - from: IN_REVIEW
        to: ACTIVE
        trigger: "POST /lab-protocols/{id}/transitions {action: activate, expected_category_version} by MethodologyOfficer"
        actor: MethodologyOfficer
        preconditions: ["status == IN_REVIEW", "expected_category_version == ProductCategory.version (OCC)"]
        side_effects: ["any other ACTIVE protocol of category -> SUPERSEDED", "activated_at := clock", "ProductCategory.version +1", "version +1"]
      - from: DRAFT
        to: RETIRED
        trigger: "POST /lab-protocols/{id}/transitions {action: retire} by MethodologyOfficer"
        actor: MethodologyOfficer
        preconditions: ["status IN {DRAFT, ACTIVE}", "if ACTIVE: no TestProgram of category in status IN {SAMPLE_SOURCING, TESTING, SCORING}"]
        side_effects: ["version +1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /lab-protocols/{id}/transitions {action: retire} by MethodologyOfficer"
        actor: MethodologyOfficer
        preconditions: ["status IN {DRAFT, ACTIVE}", "if ACTIVE: no TestProgram of category in status IN {SAMPLE_SOURCING, TESTING, SCORING}"]
        side_effects: ["version +1"]
  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PLACED
        trigger: "POST /purchase-orders/{id}/transitions {action: place} by PurchasingAgent"
        actor: PurchasingAgent
        preconditions: ["status == DRAFT", "program.status == SAMPLE_SOURCING", "total_cents <= program.budget_cents - program.committed_cents", "retailer_name not manufacturer-direct"]
        side_effects: ["placed_at := clock", "placed_by_user_id := actor", "program.committed_cents += total_cents", "program version +1", "version +1"]
      - from: PLACED
        to: RECEIVED
        trigger: "POST /purchase-orders/{id}/transitions {action: receive} by PurchasingAgent"
        actor: PurchasingAgent
        preconditions: ["status == PLACED"]
        side_effects: ["per line: sample.sourced_units += qty; sourcing_complete recompute (IN_LAB promotion deferred to program start_testing)", "version +1"]
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /purchase-orders/{id}/transitions {action: verify} by ComplianceOfficer"
        actor: ComplianceOfficer
        preconditions: ["status == RECEIVED", "receipt_doc_ref non-empty", "actor X-User-ID != placed_by_user_id (SoD)", "retailer_name not manufacturer-direct"]
        side_effects: ["verified_by_user_id := actor", "version +1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/transitions {action: cancel} by PurchasingAgent"
        actor: PurchasingAgent
        preconditions: ["status IN {DRAFT, PLACED}"]
        side_effects: ["if was PLACED: program.committed_cents -= total_cents (compensating ledger entry)", "version +1"]
      - from: PLACED
        to: CANCELLED
        trigger: "POST /purchase-orders/{id}/transitions {action: cancel} by PurchasingAgent"
        actor: PurchasingAgent
        preconditions: ["status IN {DRAFT, PLACED}"]
        side_effects: ["program.committed_cents -= total_cents (compensating ledger entry)", "version +1"]
  - entity: TestSample
    initial_state: PLANNED
    terminal_states: [SCORED]
    transitions:
      - from: PLANNED
        to: SOURCING
        trigger: "system cascade from program start_sourcing"
        actor: system
        preconditions: ["program APPROVED -> SAMPLE_SOURCING"]
        side_effects: ["version +1"]
      - from: SOURCING
        to: IN_LAB
        trigger: "system cascade from program start_testing when sourcing_complete"
        actor: system
        preconditions: ["sourcing_complete == true", "program SAMPLE_SOURCING -> TESTING"]
        side_effects: ["version +1"]
      - from: IN_LAB
        to: SCORED
        trigger: "system cascade from program ready transition"
        actor: system
        preconditions: ["testing_complete == true", "program SCORING -> READY_FOR_PUBLICATION"]
        side_effects: ["version +1"]
  - entity: SurveyWave
    initial_state: OPEN
    terminal_states: [QUALIFIED, DISQUALIFIED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /survey-waves/{id}/transitions {action: close} by SurveyDirector"
        actor: SurveyDirector
        preconditions: ["status == OPEN", "clock >= field_end"]
        side_effects: ["version +1"]
      - from: CLOSED
        to: QUALIFIED
        trigger: "POST /survey-waves/{id}/transitions {action: qualify, expected_wave_version} by SurveyDirector"
        actor: SurveyDirector
        preconditions: ["status == CLOSED", "threshold_met == true", "expected_wave_version == wave.version (OCC)"]
        side_effects: ["version +1"]
      - from: CLOSED
        to: DISQUALIFIED
        trigger: "POST /survey-waves/{id}/transitions {action: disqualify} by SurveyDirector"
        actor: SurveyDirector
        preconditions: ["status == CLOSED", "threshold_met == false"]
        side_effects: ["version +1"]
  - entity: RatingPublication
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /rating-publications/{id}/transitions {action: submit} by ContentEditor"
        actor: ContentEditor
        preconditions: ["status IN {DRAFT, REVISION_REQUESTED}", "program.status == READY_FOR_PUBLICATION", "model_count >= 1"]
        side_effects: ["version +1"]
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /rating-publications/{id}/transitions {action: submit} by ContentEditor"
        actor: ContentEditor
        preconditions: ["status IN {DRAFT, REVISION_REQUESTED}", "program.status == READY_FOR_PUBLICATION", "model_count >= 1"]
        side_effects: ["version +1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /rating-publications/{id}/transitions {action: approve, expected_program_version} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status == UNDER_REVIEW", "expected_program_version == program.version (OCC)", "no SafetyFinding of program with status IN {OPEN, ESCALATED} and escalation_tier == 3"]
        side_effects: ["protocol_id_snapshot := ACTIVE protocol of category", "survey_wave_id_snapshot := latest QUALIFIED wave of category (field_end DESC, tie created_at ASC) or null", "program version +1", "version +1"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /rating-publications/{id}/transitions {action: request_revision} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status == UNDER_REVIEW"]
        side_effects: ["version +1"]
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /rating-publications/{id}/transitions {action: publish} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status == APPROVED", "clock >= embargo_until", "no other PUBLISHED publication for same program", "no SafetyFinding of program with status IN {OPEN, ESCALATED} and escalation_tier == 3", "program.status == READY_FOR_PUBLICATION"]
        side_effects: ["published_at := clock", "TestProgram READY_FOR_PUBLICATION -> PUBLISHED (bubble-up)", "ProductCategory.last_published_at := clock", "ProductCategory.selection_score recomputed", "program version +1", "category version +1", "version +1"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /rating-publications/{id}/transitions {action: withdraw} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, PUBLISHED}"]
        side_effects: ["if was PUBLISHED: category last_published_at recomputed from remaining PUBLISHED non-WITHDRAWN publications; selection_score recomputed", "version +1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /rating-publications/{id}/transitions {action: withdraw} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, PUBLISHED}"]
        side_effects: ["version +1"]
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /rating-publications/{id}/transitions {action: withdraw} by EditorialDirector"
        actor: EditorialDirector
        preconditions: ["status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, PUBLISHED}"]
        side_effects: ["version +1"]
      - from: PUBLISHED
        to: WITHDRAWN
        trigger: "POST /rating-publications/{id}/transitions {action: withdraw} by EditorialDirector OR system cascade from tier-3 SafetyFinding escalate"
        actor: EditorialDirector
        preconditions: ["status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED, PUBLISHED}", "manual withdraw from PUBLISHED requires an ESCALATED tier-3 finding on program or non-empty version_note"]
        side_effects: ["category last_published_at recomputed from remaining PUBLISHED non-WITHDRAWN publications (null when none); selection_score recomputed", "TestProgram PUBLISHED -> READY_FOR_PUBLICATION (revert bubble-up; version +1)", "version +1"]
  - entity: SafetyFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /safety-findings/{id}/transitions {action: escalate} by SafetyOfficer"
        actor: SafetyOfficer
        preconditions: ["status == OPEN", "escalation_tier >= 1"]
        side_effects: ["tier >= 2: every rated_models entry (in non-WITHDRAWN publications of program) whose sample model_label == finding sample's model_label -> designation NOT_RECOMMENDED", "tier == 3: every PUBLISHED RatingPublication of program -> WITHDRAWN (depth-3 cascade: escalate -> designation flip -> withdrawal)", "version +1"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /safety-findings/{id}/transitions {action: resolve} by SafetyOfficer"
        actor: SafetyOfficer
        preconditions: ["status == ESCALATED", "escalation_tier <= 1 OR an ACCEPTED manufacturer response exists on the program's publication"]
        side_effects: ["version +1"]
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /safety-findings/{id}/transitions {action: close} by SafetyOfficer"
        actor: SafetyOfficer
        preconditions: ["status == RESOLVED"]
        side_effects: ["version +1"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /safety-findings/{id}/transitions {action: close} by SafetyOfficer"
        actor: SafetyOfficer
        preconditions: ["status == OPEN", "escalation_tier == 0"]
        side_effects: ["version +1"]
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system cascade: on POST /_cycle/run when the member's subscription transitions ACTIVE/GRACE -> EXPIRED (depth-2 cascade: cycle run -> subscription EXPIRED -> member LAPSED)"
        actor: system
        preconditions: ["latest subscription EXPIRED"]
        side_effects: ["version +1"]
      - from: LAPSED
        to: ACTIVE
        trigger: "system cascade from successful renew on a GRACE subscription"
        actor: system
        preconditions: ["renew transition succeeds"]
        side_effects: ["version +1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "system cascade from subscription cancel"
        actor: system
        preconditions: ["cancel transition succeeds"]
        side_effects: ["version +1"]
      - from: LAPSED
        to: CANCELLED
        trigger: "system cascade from subscription cancel"
        actor: system
        preconditions: ["cancel transition succeeds"]
        side_effects: ["version +1"]

concurrency_rules:
  - rule_id: protocol-activate-stale-category
    parent_entity: ProductCategory
    write_endpoint: "POST /lab-protocols/{id}/transitions"
    occ_field: "expected_category_version"
    description: "Activating a LabProtocol with action=activate against a ProductCategory whose version has advanced since the client last observed it is rejected; a prior activation for the same category legitimately superseded the previously ACTIVE protocol and bumped the category version, so the stale writer's view is outdated."
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: publication-approve-stale-program
    parent_entity: TestProgram
    write_endpoint: "POST /rating-publications/{id}/transitions"
    occ_field: "expected_program_version"
    description: "Approving a RatingPublication with action=approve against a TestProgram whose version has advanced since the client last observed it is rejected; an intervening mutation of the program makes the approver's readiness view stale."
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: wave-qualify-stale-wave
    parent_entity: SurveyWave
    write_endpoint: "POST /survey-waves/{id}/transitions"
    occ_field: "expected_wave_version"
    description: "Qualifying a SurveyWave with action=qualify whose version has advanced since the client last observed it is rejected; a late exclude_response recomputed threshold_met and bumped the wave version, so the qualifier's threshold view is stale."
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: selection_score
    trigger: "on POST /_cycle/run for every ProductCategory with status != RETIRED; on RatingPublication publish/withdraw events"
    algorithm: weighted_scoring
    formula: |
      months_since = if last_published_at is null then REFRESH_URGENCY_MONTHS_CAP
                     else min(REFRESH_URGENCY_MONTHS_CAP, floor(days_between(last_published_at, clock) / 30))
      urgency = min(100, round_half_up(100 * months_since / refresh_cycle_months, 2))
      selection_score = round_half_up(0.40 * market_share_pct + 0.35 * member_interest_pct + 0.25 * urgency, 2)
    input_set: "ProductCategory status != RETIRED; last_published_at from latest PUBLISHED non-WITHDRAWN publication across programs of category"
    constants:
      REFRESH_URGENCY_MONTHS_CAP: 60
    precision: "2 decimal places, round_half_up at each rounding step"
    variants:
      - name: cycle_clock_variant
        when: "computed during POST /_cycle/run"
        difference: "months_since uses the cycle-run logical clock; identical inputs at a different clock instant yield a different score"
      - name: event_clock_variant
        when: "computed synchronously on publish/withdraw"
        difference: "uses the event-moment clock; between two clock positions the same category scores differently"
  - name: po_tax
    trigger: "on POST /purchase-orders (lines embedded at create; PO is immutable after create)"
    algorithm: aggregation
    formula: |
      per line: line_tax_cents = round_half_up(unit_price_cents * qty * tax_rate_bp / 10000)
      subtotal_cents = sum(unit_price_cents * qty)
      tax_cents = sum(line_tax_cents)
      total_cents = subtotal_cents + shipping_cents + tax_cents
    input_set: "the lines array supplied at create"
    constants: {}
    precision: "integer cents; PINNED rounding order: round per line first, then sum"
    variants:
      - name: per_line_then_sum
        when: "pinned correct behavior"
        difference: "each line rounded to cents before summation"
      - name: sum_then_round
        when: "REJECTED alternative: sum raw fractional tax across lines then round once"
        difference: "differs from per_line_then_sum by up to (n_lines - 1) half-cent rounding residuals; e.g. 3 lines of 0.5-cent raw tax give 2 cents pinned vs 1 cent alternative"
  - name: measurement_score
    trigger: "on program start_scoring transition, per TestSample"
    algorithm: weighted_scoring
    formula: |
      per metric_code m: metric_mean(m) = round_half_up(mean(value_num over Measurements of sample with metric_code == m, all unit_index), 2)
      lab_score = round_half_up(mean(metric_mean over distinct metric_code), 2)
    input_set: "Measurements of the sample (protocol is the category ACTIVE protocol implicitly); two-stage mean: per-metric then across metrics"
    constants: {}
    precision: "2 decimals round_half_up at both stages"
    variants:
      - name: two_stage_mean
        when: "pinned correct behavior"
        difference: "mean of per-metric means; each metric weighs equally regardless of repeat count"
      - name: flat_mean
        when: "REJECTED alternative: single mean over all raw Measurement rows"
        difference: "metrics with more recorded repeats dominate; differs from two_stage_mean whenever repeat counts per metric are unequal"
  - name: overall_rating
    trigger: "on add_rated_model action and on safety designation cascade for the entry"
    algorithm: weighted_scoring
    formula: |
      p = protocol.perf_weight_pct; r = protocol.reliability_weight_pct (protocol := publication.protocol_id_snapshot if set else category ACTIVE protocol at add time)
      survey_score = if pinned/available QUALIFIED wave has COUNTED responses with model_label == sample.model_label
                     then round_half_up(mean(reliability_score over those responses), 2) else null
      if survey_score is not null: overall = round_half_up(lab_score * p/100 + survey_score * (r + (100 - p - r))/100, 2)
      else: overall = lab_score
    input_set: "sample.lab_score; wave responses COUNTED with matching model_label; protocol weights"
    constants: {}
    precision: "2 decimals round_half_up"
    variants:
      - name: renormalized_when_no_survey
        when: "pinned correct behavior"
        difference: "without survey data, overall = lab_score (survey weight folded away)"
      - name: fixed_three_component
        when: "REJECTED alternative: apply reliability+convenience weights even when survey_score is null (treat null as 0)"
        difference: "yields lab_score * p/100 only, strictly lower for identical lab_score; e.g. p=60, lab=90 -> 90.00 pinned vs 54.00 alternative"
  - name: designation_thresholds
    trigger: "after overall_rating for a rated_models entry; re-evaluated on safety cascade"
    algorithm: threshold
    formula: |
      evaluated in PINNED order:
      1) if any SafetyFinding of program with sample_id == entry.sample_id and status IN {OPEN, ESCALATED} and escalation_tier >= 1 -> NOT_RECOMMENDED
      2) elif overall_score >= 75 and price_cents <= BEST_BUY_PRICE_CAP_CENTS -> BEST_BUY
      3) elif overall_score >= 80 -> RECOMMENDED
      4) elif overall_score >= 50 -> STANDARD
      5) else -> NOT_RECOMMENDED
      where price_cents = median of unit_price_cents over lines of the sample's PurchaseOrders with status IN {RECEIVED, VERIFIED}; even count -> lower of the two middle values; no such lines -> null (BEST_BUY impossible)
    input_set: "entry overall_score, sample PO lines RECEIVED/VERIFIED, OPEN/ESCALATED findings tier >= 1 for the sample"
    constants:
      BEST_BUY_MIN: 75
      RECOMMENDED_MIN: 80
      STANDARD_MIN: 50
      BEST_BUY_PRICE_CAP_CENTS: 20000
    precision: "all boundaries inclusive >="
    variants:
      - name: safety_first_order
        when: "pinned correct behavior"
        difference: "safety gate evaluated before price/score tiers; a high-scoring cheap model with an OPEN tier-1 finding is NOT_RECOMMENDED"
      - name: score_first_order
        when: "REJECTED alternative: evaluate score tiers before safety"
        difference: "same inputs yield BEST_BUY/RECOMMENDED despite the open finding"
  - name: safety_escalation
    trigger: "on SafetyFinding create and re-evaluated on escalate before transition"
    algorithm: threshold
    formula: |
      tier = 0
      if severity IN {MAJOR, CRITICAL}: tier = 1
      if severity == CRITICAL and recalled_model_count >= 2: tier = 2
      if severity == CRITICAL and hazard_flag: tier = 3
      (rules cumulative: a CRITICAL hazard finding with recalled_model_count >= 2 is tier 3)
    input_set: "finding.severity, finding.hazard_flag, finding.recalled_model_count"
    constants:
      RECALL_MODEL_COUNT_MIN: 2
    precision: "integer tiers; >= boundary"
    variants:
      - name: cumulative_ladder
        when: "pinned correct behavior"
        difference: "tier 3 requires CRITICAL severity AND hazard_flag; MAJOR + hazard stays tier 1"
      - name: hazard_alone_tier3
        when: "REJECTED alternative: hazard_flag alone forces tier 3 for any severity"
        difference: "a MAJOR hazard finding would jump to tier 3 and trigger publication withdrawal; pinned keeps it at tier 1"
  - name: grace_window
    trigger: "on subscription add/renew (grace_until compute) and on POST /_cycle/run (status transitions)"
    algorithm: interval_merge
    formula: |
      grace_until = term_end + GRACE_DAYS days
      at clock t: t <= term_end -> ACTIVE; term_end < t <= grace_until -> GRACE; t > grace_until -> EXPIRED
      boundaries CLOSED at both ends: t == term_end stays ACTIVE; t == grace_until stays GRACE; first instant after grace_until is EXPIRED
    input_set: "subscription.term_end, subscription.grace_until, logical clock; subscriptions with status IN {ACTIVE, GRACE}"
    constants:
      GRACE_DAYS: 14
    precision: "second precision; closed intervals"
    variants:
      - name: closed_interval
        when: "pinned correct behavior"
        difference: "t == grace_until is still GRACE"
      - name: half_open
        when: "REJECTED alternative: [term_end, grace_until)"
        difference: "at t == grace_until the alternative flips to EXPIRED and lapses the member one instant early"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role declared", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role permitted for endpoint per §1.5 roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path-templated resources exist, left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "target in a valid from-state for the action; unknown action value", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transitions endpoints" }
  - { priority: 5, category: business_safety, check: "sourcing integrity: retailer_name must not be manufacturer-direct; buyer_alias must not equal a manufacturer name", error_id: ERR_SOURCING_INTEGRITY, http_status: 422, applies_to: "POST /purchase-orders, POST /purchase-orders/{id}/transitions (place, verify)" }
  - { priority: 6, category: business_safety, check: "segregation of duties: program approver != proposer; PO verifier != placer", error_id: ERR_SOD_VIOLATION, http_status: 422, applies_to: "POST /test-programs/{id}/transitions (approve), POST /purchase-orders/{id}/transitions (verify)" }
  - { priority: 7, category: business_safety, check: "safety gate: ready/approve/publish blocked by OPEN/ESCALATED high-tier findings (tier >= 2 for ready, tier == 3 for approve/publish)", error_id: ERR_SAFETY_GATE, http_status: 422, applies_to: "POST /test-programs/{id}/transitions (ready), POST /rating-publications/{id}/transitions (approve, publish)" }
  - { priority: 8, category: business_referential, check: "FK targets exist, belong to declared parents, and are in required states: PO line samples in program; measurement sample IN_LAB; rated-model sample SCORED in publication program; finding sample in program; publication program exists; sample creation requires program status IN {PROPOSED, APPROVED}", error_id: ERR_REFERENTIAL_INTEGRITY, http_status: 422, applies_to: "POST /purchase-orders, POST /measurements, POST /rating-publications/{id}/transitions (add_rated_model), POST /safety-findings, POST /rating-publications, POST /test-programs, POST /lab-protocols, POST /survey-waves, POST /test-samples" }
  - { priority: 9, category: business_constraint, check: "protocol weights: perf + reliability <= 99; protocol_code unique per category among DRAFT/IN_REVIEW/ACTIVE; measurement_repeat_min >= 1", error_id: ERR_PROTOCOL_WEIGHTS, http_status: 422, applies_to: "POST /lab-protocols, POST /lab-protocols/{id}/transitions (submit_review)" }
  - { priority: 10, category: business_temporal, check: "temporal windows: survey field_end > field_start; submit_response only while OPEN and clock within [field_start, field_end]; subscription term_end > term_start; close only when clock >= field_end", error_id: ERR_TEMPORAL_WINDOW, http_status: 422, applies_to: "POST /survey-waves, POST /survey-waves/{id}/transitions (submit_response, close), POST /members/{id}/transitions (add_subscription, renew)" }
  - { priority: 11, category: business_constraint, check: "survey sampling: qualify requires threshold_met; at most one COUNTED response per member_id per wave; response_index must exist for exclude_response", error_id: ERR_SAMPLE_SIZE_NOT_MET, http_status: 422, applies_to: "POST /survey-waves/{id}/transitions (qualify, submit_response, exclude_response)" }
  - { priority: 12, category: business_temporal, check: "embargo: publish requires clock >= embargo_until; Member reads of PUBLISHED publication require clock >= embargo_until", error_id: ERR_EMBARGOED, http_status: 422, applies_to: "POST /rating-publications/{id}/transitions (publish), GET /rating-publications/{id} as Member" }
  - { priority: 13, category: business_fiscal, check: "budget: place requires total_cents <= budget_cents - committed_cents", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /purchase-orders/{id}/transitions (place)" }
  - { priority: 14, category: business_constraint, check: "marketing use refused: X-Marketing-Use: true header on publication reads", error_id: ERR_MARKETING_USE_FORBIDDEN, http_status: 422, applies_to: "GET /rating-publications, GET /rating-publications/{id}" }
  - { priority: 15, category: business_constraint, check: "membership: Member actions require acting member (X-User-ID) status == ACTIVE; Member reads limited to PUBLISHED publications", error_id: ERR_MEMBERSHIP_INACTIVE, http_status: 403, applies_to: "POST /survey-waves/{id}/transitions (submit_response), POST /members/{id}/transitions, GET /rating-publications/{id} as Member" }
  - { priority: 16, category: business_constraint, check: "OCC: expected_*_version equals current parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /lab-protocols/{id}/transitions (activate), POST /rating-publications/{id}/transitions (approve), POST /survey-waves/{id}/transitions (qualify)" }
  - { priority: 17, category: business_constraint, check: "uniqueness: category name, member email; at most one ACTIVE/GRACE subscription per member; at most one PUBLISHED publication per program", error_id: ERR_DUPLICATE, http_status: 422, applies_to: "POST /product-categories, POST /members, POST /members/{id}/transitions (add_subscription), POST /rating-publications/{id}/transitions (publish)" }
  - { priority: 18, category: business_constraint, check: "required fields present, well-typed, enum values valid, numeric ranges respected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving: set logical clock; server default at startup is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock"
    roles: [LabManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/_cycle/run"
    description: "ops-run checkpoint: recompute selection_score for status != RETIRED categories; transition member subscriptions ACTIVE->GRACE / ->EXPIRED per grace_window; cascade member LAPSED"
    roles: [LabManager]
    code: 200
    input: []
    output: "{ categories_rescored: integer, subscriptions_transitioned: integer, members_lapsed: integer }"
    side_effects: ["selection_score recompute", "subscription epoch transitions", "Member cascade"]
  - method: POST
    path: "/product-categories"
    description: "create category; selection_score computed with null last_published_at"
    roles: [LabManager]
    code: 201
    input: [name, refresh_cycle_months, market_share_pct, member_interest_pct]
    output: ProductCategory
    side_effects: ["selection_score computed"]
  - method: GET
    path: "/product-categories/{id}"
    description: "read category"
    roles: [LabManager, EditorialDirector, MethodologyOfficer, SurveyDirector, SafetyOfficer, ContentEditor, ComplianceOfficer, PurchasingAgent, LabTechnician]
    code: 200
    input: []
    output: ProductCategory
    side_effects: []
  - method: POST
    path: "/test-programs"
    description: "propose program; proposed_by_user_id := actor"
    roles: [LabManager]
    code: 201
    input: [category_id, fiscal_year, budget_cents]
    output: TestProgram
