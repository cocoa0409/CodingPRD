            - { call: "POST /deice-ops/discharge-permits/${pm}/effluent-readings", payload: { measured_at: "2026-05-01T01:00:00Z", concentration_mg_l: 250, volume_liters: 10 }, as: EnvironmentalOfficer, captures: { v2: $.data.violation } }
            - { call: "GET /deice-ops/discharge-permits/${pm}", as: EnvironmentalOfficer, captures: { pst: $.data.status } }
            - { call: "GET /deice-ops/stations/${st}", as: StationAdmin, captures: { posture: $.data.posture } }
          assert:
