        claim_type: precondition_enforcement
        grounds:
          - validations.priority_23_ERR_FIELD_HISTORY_RESTRICTED
          - calculations.field_eligibility_assessment
        distinguishing_aspect: "A WHEAT 2024 history record is inside the 3-year look-back for HRW-Sable in season 2026, so the DRAFT to OFFERED gate returns 422 ERR_FIELD_HISTORY_RESTRICTED even though isolation is sufficient."
