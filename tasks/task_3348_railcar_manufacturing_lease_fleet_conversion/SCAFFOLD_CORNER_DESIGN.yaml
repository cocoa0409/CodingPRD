    distinguishing_aspect: One order created 153 days after its order_date quotes 1629700 cents while
      DRAFT (the forecast variant, with the WHEELSET and CASTING costs uplifted 10 percent) and re-quotes
      to 1614500 cents the moment it is component-reserved, so the variant is selected by the order's
      own state.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2027-02-01T00:00:00Z, which is 153 days after the order_date
        2026-09-01, past the forecast variant's 120-day lock horizon.
      - Car type BOX-200 (BOXCAR, build_hours 30, regulatory_life_years 25, line_count_family LINE-B)
        with WS-210 WHEELSET qty 4 cost 18000 lead_time 30, CS-210 CASTING qty 2 cost 40000 lead_time
        45, CT-210 COATING qty 3 cost 12500 lead_time 20; wheelset and casting stock 40 and 20 cover the
        5-car order.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: BOX-200
          car_class: BOXCAR
          build_hours: 30
          regulatory_life_years: 25
          line_count_family: LINE-B
        as: ProductionPlanner
        captures:
          ct_box_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-210
          component_class: WHEELSET
          unit_cost_cents: 18000
          lead_time_days: 30
          on_hand_qty: 40
        as: SupplyChainCoordinator
        captures:
          ws210_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CS-210
          component_class: CASTING
          unit_cost_cents: 40000
          lead_time_days: 45
          on_hand_qty: 20
        as: SupplyChainCoordinator
        captures:
          cs210_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: CT-210
          component_class: COATING
          unit_cost_cents: 12500
          lead_time_days: 20
          on_hand_qty: 100
        as: SupplyChainCoordinator
        captures:
          ct210_id: $.data.id
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${ws210_id}
          qty_per_car: 4
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${cs210_id}
          qty_per_car: 2
        as: ProductionPlanner
      - call: POST /api/v1/car-type-component-requirements
        payload:
          car_type_id: ${ct_box_id}
          component_id: ${ct210_id}
          qty_per_car: 3
        as: ProductionPlanner
      trigger:
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_box_id}
          quantity: 5
          planned_shop_days: 150
          disposition: SOLD
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2027-04-01'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          price_forecast: $.data.unit_price_cents
          status_forecast: $.data.status
      - call: POST /api/v1/production-orders/${po_id}/reserve-components
        payload: {}
        as: ProductionPlanner
        captures:
          price_committed: $.data.unit_price_cents
          status_committed: $.data.status
      assert:
      - 'The DRAFT order took the forecast variant: status == ${status_forecast} == "DRAFT" and unit_price_cents
        == ${price_forecast} == 1629700'
      - 'The forecast uplift is exactly the two lapsed classes: WS-210 cost ceil(18000 * 110 / 100) ==
        19800 giving ceil((4 * 19800 + 25000) / 100) * 100 == 104200, CS-210 cost ceil(40000 * 110 / 100)
        == 44000 giving ceil((2 * 44000 + 25000) / 100) * 100 == 113000, and CT-210 keeps 62500'
      - 'The coating rule does not fire: CT-210 is class COATING with lead_time_days 20, not greater than
        60, so the 4-percent coating uplift is skipped'
      - 'Reserving switches the variant: status == ${status_committed} == "COMPONENT_RESERVED" and unit_price_cents
        == ${price_committed} == 1614500 == (97000 + 105000 + 62500) + 1350000'
      - 'The switch delta is 1629700 - 1614500 == 15200 cents, and it is a re-quote of the same row rather
        than a second order: the ProductionOrder row count stays 1'
      - 'The committed variant is not merely the forecast minus a constant: it re-reads the contract costs,
        which is why the lapsed rows return to 18000 and 40000'
