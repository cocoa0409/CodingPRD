  - section: optimistic_concurrency
    instances:

      - name: attribution_create_with_a_stale_deal_version_rejected
        claim_type: stale_version_rejected
        grounds:
          - concurrency_rules.attribution-create-stale-deal
          - errors.ERR_STALE_DEAL_VERSION
          - validations.priority_12
          - endpoints.POST /loss-attributions
        distinguishing_aspect: "The analyst reads the deal, an admin re-points the deal to another competitor (bumping Deal.version), and the analyst then writes the attribution it had planned. Nothing about the write is otherwise illegal — the deal is INTERVIEWED, the reason is a live leaf, the weight is 1.00 — so only the version guard can stop it, and it must answer 412 ERR_STALE_DEAL_VERSION with no LossAttribution row written and the deal still UNATTRIBUTED."
