          setup:
            - "Community with an ISSUED permit on a RESIDENTIAL structure, and CrsCycle 2026 in OPEN."
            - "Two CRITICAL violations worth 12 points each (24 total, posture ON_PROBATION); the second one names the permit and the structure."
