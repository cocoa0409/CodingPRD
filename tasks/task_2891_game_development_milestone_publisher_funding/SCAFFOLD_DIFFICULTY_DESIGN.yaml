  - rule_id: transitive_cascade
    instances:
      - name: acceptance_cascade_unlocks_dependent_milestone_then_restricted_posture_resuspends_its_engagement
        grounds:
          - state_machines.Milestone.UNDER_REVIEW_to_ACCEPTED
          - state_machines.Milestone.DEFINED_to_IN_DEVELOPMENT
          - state_machines.ContractorEngagement.PROPOSED_to_ACTIVE
          - state_machines.ContractorEngagement.ACTIVE_to_SUSPENDED
          - state_machines.ContractorEngagement.PROPOSED_to_SUSPENDED
          - calculations.agreement_funding_ledger.constants.RESTRICT_TRIGGER_BPS
        distinguishing_aspect: |
          One POST /publisher-reviews propagates five levels deep and the ORDER of the levels is
          observable: M1 ACCEPTED -> MilestonePayment minted -> M2 DEFINED to IN_DEVELOPMENT ->
          M2's PROPOSED engagement promoted to ACTIVE -> funding_posture flips to RESTRICTED and
          that same engagement is immediately SUSPENDED again. An implementation that recomputes
          posture before unlocking the dependent milestone leaves E2 ACTIVE (its milestone was
          still DEFINED when the suspension pass ran), so the final state of E2 discriminates.
        test_recipe:
          setup:
            - "Agreement Aurora Drift with the canonical three milestones (M1 ALPHA 3600000, M2 BETA 5400000 depends on M1, M3 GOLD 3000000 depends on M2), advance_total_cents 12000000, ACTIVE."
            - "Engagement E2 on M2 (still DEFINED, so born PROPOSED) with vendor NET-CORAL and committed_cents 600000."
            - "Engagement E3 on M3 (still DEFINED, so born PROPOSED) with vendor CERT-LUMEN and committed_cents 400000."
            - "M1 build 1 (75.00 / 96.00 / 60.00 / 5) clears the ALPHA gate and M1 is UNDER_REVIEW."
            - "accepted_value_cents will reach exactly 3600000 == round_half_up(12000000 * 3000 / 10000), the inclusive RESTRICTED boundary."
