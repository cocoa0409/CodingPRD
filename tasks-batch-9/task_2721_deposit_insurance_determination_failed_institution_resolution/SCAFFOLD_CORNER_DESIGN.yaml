          - calculations.liquidation_baseline_cost.constants.ADMIN_COST_PER_DEPOSITOR_CENTS
        distinguishing_aspect: "The two rounding steps run in the declared order and neither is interchangeable: insured_share_bps floors 7777.777... to 7777, then the subrogation lands exactly on a half cent (3114688.5) and rounds UP to 3114689, giving a baseline of 4185311 — flooring the subrogation instead would return 4185312, and rounding the share to 7778 would return a different figure again."
        test_recipe:
