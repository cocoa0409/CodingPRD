  - rule_id: non_linear_state_machine
    instances:
      - name: candidate_cross_cycle_loop_nominated_to_deferred_back_to_screening
        grounds:
          - state_machines.Candidate.NOMINATED_to_DEFERRED
          - state_machines.Candidate.DEFERRED_to_SCREENING
          - state_machines.Candidate.SLATE_ELIGIBLE_to_NOMINATED
          - entities.Candidate.fields.deferred_cycle_year
          - entities.Candidate.fields.interview_round
          - state_machines.SlateNominee.PROPOSED_to_VOIDED
        distinguishing_aspect: |
          The candidate re-enters a state it already left: SCREENING is visited twice, reached the second
          time through the backward edge NOMINATED -> DEFERRED -> SCREENING, and the loop is guarded by a
          cross-cycle condition (ACTIVE policy.cycle_year must exceed deferred_cycle_year), so the reopen is
          only legal after a 2027 policy is adopted - a cyclic revisit, not a forward-only path.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with min_completed_interviews 1."
            - "One SEATED chair director and one SEATED interviewer director."
            - "A SHAREHOLDER_PROPOSAL candidate driven all the way to NOMINATED on a DRAFT slate for cycle 2026 (clean screen determined INDEPENDENT, one COMPLETED interview scored 4, clean reference check, clean conflict clearance, nominee added at ballot_order 1)."
            - "Logical clock left at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", min_completed_interviews: 1 }
              as: CorporateSecretary
              captures: { policy_2026_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dana Chair", email: "dana.chair@issuer.example", birth_date: "1962-03-15", appointed_on: "2019-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ivan Interviewer", email: "ivan@issuer.example", birth_date: "1966-07-07", appointed_on: "2020-05-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { intv_id: $.data.id }
            - call: "POST /governance/candidates"
              payload: { full_name: "Lena Looper", email: "lena@cand.example", birth_date: "1973-11-11", source_channel: "SHAREHOLDER_PROPOSAL", shareholder_proponent_name: "Cedar Ridge Capital" }
              as: GovernanceStaff
              captures: { cand_id: $.data.id }
            - call: "POST /governance/candidates/${cand_id}/screens"
              payload: { payments_to_company_cents: 0, recipient_gross_revenue_cents: 0, family_member_employed: false, auditor_affiliation: false, charitable_contributions_cents: 0, company_gross_revenue_cents: 0 }
              as: GovernanceStaff
              captures: { screen1_id: $.data.id }
            - call: "POST /governance/screens/${screen1_id}/submit"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/screens/${screen1_id}/determine"
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /governance/interviews"
              payload: { candidate_id: "${cand_id}", interviewer_director_id: "${intv_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T11:00:00Z", modality: "VIDEO" }
              as: GovernanceStaff
              captures: { intv_session_id: $.data.id }
            - call: "POST /governance/interviews/${intv_session_id}/complete"
              payload: { score: 4, recommendation: "ADVANCE" }
              as: GovernanceStaff
            - call: "POST /governance/candidates/${cand_id}/reference-check"
              payload: { reference_count: 3, adverse_findings: false }
              as: GovernanceStaff
            - call: "POST /governance/candidates/${cand_id}/conflict-clearance"
              payload: {}
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, candidate_id: "${cand_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom_id: $.data.id }
          trigger:
            - call: "POST /governance/slate-nominees/${nom_id}/void"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/policies"
              payload: { cycle_year: 2027, effective_from: "2027-01-01T00:00:00Z", min_completed_interviews: 1 }
              as: CorporateSecretary
              captures: { policy_2027_id: $.data.id }
            - call: "POST /governance/candidates/${cand_id}/reopen-screening"
              payload: {}
              as: GovernanceStaff
            - call: "GET /governance/candidates/${cand_id}/screens"
              payload: {}
              as: GovernanceStaff
          assert:
            - "SlateNominee.${nom_id}.status == \"VOIDED\" and voided_at is not null"
            - "Immediately after the void, Candidate.${cand_id}.status == \"DEFERRED\" and deferred_cycle_year == 2026"
            - "GovernancePolicy.${policy_2026_id}.status == \"SUPERSEDED\" and GovernancePolicy.${policy_2027_id}.status == \"ACTIVE\""
            - "After the reopen, Candidate.${cand_id}.status == \"SCREENING\" (the second visit to SCREENING)"
            - "Candidate.${cand_id}.independence_result == \"PENDING\""
            - "Candidate.${cand_id}.interview_round == 0"
            - "GET /governance/candidates/${cand_id}/screens returns exactly 2 rows"
            - "The screen created by the reopen has status == \"DRAFT\" and determination == \"PENDING\""
            - "IndependenceScreen.${screen1_id}.status == \"DETERMINED_INDEPENDENT\" (retained as history, no longer governing)"
            - "NominationSlate.${slate_id}.nominee_count == 0 and independent_nominee_pct == 0.00 and independence_shortfall == false"

      - name: director_three_parallel_dimensions_advance_without_touching_each_other
        grounds:
          - state_machines.Director.ONBOARDING_to_SEATED
          - state_machines.Director.COMPLIANT_to_OVERBOARDED
          - state_machines.Director.OVERBOARDED_to_COMPLIANT
          - state_machines.Director.NOT_STARTED_to_IN_PROGRESS
          - state_machines.Director.IN_PROGRESS_to_COMPLETE
          - calculations.director_onboarding_rollup
          - calculations.director_compliance_status
          - entities.Director.fields.service_status
          - entities.Director.fields.compliance_status
          - entities.Director.fields.onboarding_status
          - entities.Director.fields.onboarding_completion_pct
        distinguishing_aspect: |
          One Director row carries three independent state dimensions and the test moves each one while
          pinning the other two: completing onboarding items drives onboarding_status NOT_STARTED ->
          IN_PROGRESS -> COMPLETE while service_status stays ONBOARDING and compliance_status stays
          OVERBOARDED; seating moves service_status only; ending an outside board moves compliance_status
          only - a parallel/compound machine, not a single linear chain.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 (max_public_boards_sitting_ceo 2 by default)."
            - "One Director created in service_status ONBOARDING, is_sitting_ceo_elsewhere true, appointed_on 2026-07-01."
            - "Two public ExternalCompany rows with ACTIVE ExternalDirectorship rows for that director, which makes external_public_board_count 2 against a limit of 2 and drives compliance_status to OVERBOARDED."
            - "Two required OnboardingItem rows for that director (BUSINESS_ORIENTATION and DOCUMENT_ACCESS), both PENDING, so onboarding_status is NOT_STARTED."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
