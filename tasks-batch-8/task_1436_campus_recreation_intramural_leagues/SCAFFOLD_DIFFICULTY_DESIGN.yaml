      - name: equipment_return_due_boundary
        grounds:
          - calculations.equipment_late_fee_cents
          - state_machines.EquipmentCheckout.OUT_to_RETURNED
        distinguishing_aspect: |
          Boundary on the TIME metric via POST return (different metric and endpoint from the rating boundary): return at
          EXACTLY due_at yields 0 seconds late -> 0 days -> 0 cents; return 1 second later yields ceil(1/86400) = 1 day ->
          300 cents for quantity 2 at 150/day. One second flips the fee; inclusive-deadline semantics pinned.
        test_recipe:
          setup:
            - "Eligible member M with two checkouts (qty 2 each) from a pool (daily 150, replacement 900), both due 2026-10-01T17:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: RecAdmin }
            - { call: "POST /v1/members", payload: { email: "mm@x.edu", full_name: "Mem M", affiliation: "STUDENT" }, as: RecAdmin, captures: { mM_id: "$.data.id", mM_v: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/waiver-sign", payload: {}, as: Member, as_user_id: "${mM_id}", captures: { mM_v2: "$.data.version" } }
            - { call: "POST /v1/members/${mM_id}/memberships", payload: { term: "FALL_2026", expected_member_version: "${mM_v2}" }, as: Member, as_user_id: "${mM_id}" }
            - { call: "POST /v1/equipment-pools", payload: { item_type: "BASKETBALL", total_qty: 5, daily_late_fee_cents: 150, unit_replacement_cents: 900 }, as: RecAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 2, due_at: "2026-10-01T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { co1_id: "$.data.id" } }
            - { call: "POST /v1/equipment-checkouts", payload: { equipment_pool_id: "${p_id}", member_id: "${mM_id}", quantity: 2, due_at: "2026-10-01T17:00:00Z" }, as: Member, as_user_id: "${mM_id}", captures: { co2_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T17:00:00Z" }, as: RecAdmin }
          trigger:
            - { call: "POST /v1/equipment-checkouts/${co1_id}/return", payload: {}, as: FacilityManager, captures: { co1_fee: "$.data.late_fee_cents" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T17:00:01Z" }, as: RecAdmin }
            - { call: "POST /v1/equipment-checkouts/${co2_id}/return", payload: {}, as: FacilityManager, captures: { co2_fee: "$.data.late_fee_cents" } }
            - { call: "GET /v1/members/${mM_id}", payload: {}, as: FacilityManager, captures: { mM_fines: "$.data.outstanding_fines_cents" } }
          assert:
            - "co1 returned at exactly due_at: late_fee_cents == 0 (seconds_late == 0 -> 0 days; deadline is inclusive)"
            - "co2 returned 1 second late: late_fee_cents == 300 (ceil(1/86400) = 1 day * 150 * qty 2)"
            - "Member.outstanding_fines_cents == 300; pool available_qty back to 5"
