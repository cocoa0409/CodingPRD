  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: isp_amendment_cycle_returns_to_active
        grounds:
          - state_machines.ISP.ACTIVE_to_AMENDMENT_DRAFT
          - state_machines.ISP.AMENDMENT_DRAFT_to_PENDING_REVIEW
          - state_machines.ISP.APPROVED_to_ACTIVE
          - entities.ISP.fields.amendment_count
        distinguishing_aspect: |
          Cyclic machine on ISP: ACTIVE -> AMENDMENT_DRAFT -> PENDING_REVIEW ->
          APPROVED -> ACTIVE closes a revision loop back to the origin state; the
          amendment_count field proves the loop executed exactly once.
        test_recipe:
          setup:
            - "Individual ENROLLED; ISP fully activated (create v1, submit v2, approve v3, activate v4); clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
