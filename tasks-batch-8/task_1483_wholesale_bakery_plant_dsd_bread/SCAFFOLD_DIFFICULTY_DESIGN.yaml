  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_half_open_interval_adjacency
        grounds:
          - errors[ERR_LINE_SCHEDULE_OVERLAP]
          - validations[priority=8]
          - entities.Batch.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource Line with half-open semantics: [07:00,09:00) followed by
          [09:00,11:00) touches without overlap and is accepted; [08:30,10:00)
          properly intersects and is rejected.
        test_recipe:
          setup:
            - "Plant, product A (NONE), line L1, plan 2026-08-09 LOCKED"
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant Sigma", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id, pv: $.data.version } }
            - { call: "POST /bakery/products", payload: { plant_id: "${p}", sku: "SKU-A", name: "White Pan 500", allergen_class: "NONE", unit_weight_g: 500, shelf_life_hours: 48, base_price_cents: 199, flour_share_pct: 0.30, butter_share_pct: 0.10, batch_capacity_units: 240 }, as: PlantAdmin, captures: { pa: $.data.id } }
            - { call: "POST /bakery/lines", payload: { plant_id: "${p}", line_code: "L1", hourly_capacity_units: 500 }, as: PlantAdmin, captures: { ln: $.data.id } }
            - { call: "POST /bakery/production-plans", payload: { plant_id: "${p}", bake_date: "2026-08-09", expected_plant_version: "${pv}" }, as: Planner, captures: { pl: $.data.id } }
            - { call: "POST /bakery/production-plans/${pl}/lock", payload: {}, as: Planner, captures: { plv: $.data.version } }
          trigger:
            - call: "POST /bakery/batches"
              payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T07:00:00Z", scheduled_end_at: "2026-08-09T09:00:00Z", expected_production_plan_version: "${plv}" }
              as: Planner
              captures: { b1: $.data.id }
            - call: "GET /bakery/production-plans/${pl}"
              as: Any
              captures: { plv2: $.data.version }
            - call: "POST /bakery/batches"
              payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 100, scheduled_start_at: "2026-08-09T09:00:00Z", scheduled_end_at: "2026-08-09T11:00:00Z", expected_production_plan_version: "${plv2}" }
              as: Planner
              captures: { b2: $.data.id }
            - call: "GET /bakery/production-plans/${pl}"
              as: Any
              captures: { plv3: $.data.version }
            - call: "POST /bakery/batches"
              payload: { production_plan_id: "${pl}", line_id: "${ln}", product_id: "${pa}", qty_units: 50, scheduled_start_at: "2026-08-09T08:30:00Z", scheduled_end_at: "2026-08-09T10:00:00Z", expected_production_plan_version: "${plv3}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "Batch.${b1}.status == SCHEDULED"
            - "Batch.${b2}.status == SCHEDULED  # half-open adjacency at 09:00 allowed"
            - "err == ERR_LINE_SCHEDULE_OVERLAP  # [08:30,10:00) intersects both"

      - name: driver_window_rest_buffer
        grounds:
          - errors[ERR_DRIVER_WINDOW_OVERLAP]
          - validations[priority=8]
          - entities.Route.fields.window_start_at
        distinguishing_aspect: |
          Resource Driver with buffered-interval semantics (different from the
          line's half-open adjacency): a second route starting 20 minutes
          after the first ends is rejected (30-minute rest buffer), while 30
          minutes exactly is accepted.
        test_recipe:
          setup:
            - "Plant, driver; route R1 2026-08-10 window 08:00-10:00"
          setup_api_calls:
            - { call: "POST /bakery/plants", payload: { name: "Plant Tau", baseline_flour_index: 400, baseline_butter_index: 600 }, as: PlantAdmin, captures: { p: $.data.id } }
            - { call: "POST /bakery/drivers", payload: { plant_id: "${p}", name: "Driver One" }, as: PlantAdmin, captures: { drv: $.data.id } }
            - { call: "POST /bakery/routes", payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T08:00:00Z", window_end_at: "2026-08-10T10:00:00Z", truck_capacity_units: 500 }, as: Planner, captures: { r1: $.data.id } }
          trigger:
            - call: "POST /bakery/routes"
              payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T10:20:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }
              as: Planner
              captures: { err: $.data.error_id }
            - call: "POST /bakery/routes"
              payload: { plant_id: "${p}", driver_id: "${drv}", route_date: "2026-08-10", window_start_at: "2026-08-10T10:30:00Z", window_end_at: "2026-08-10T12:00:00Z", truck_capacity_units: 500 }
              as: Planner
              captures: { r3: $.data.id }
          assert:
            - "err == ERR_DRIVER_WINDOW_OVERLAP  # 20-min gap < 30-min buffer"
            - "Route.${r3}.status == PLANNED  # 30-min gap exactly: allowed (>=)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: store_credit_balance_conservation
        grounds:
          - state_machines.StaleReturn.VERIFIED_to_CREDITED
          - state_machines.StaleReturn.CREDITED_to_REVERSED
          - entities.Store.fields.credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Store.credit_balance_cents (cents). CREDITED
          adds credited_amount_cents (299) and the compensating reverse-credit
          subtracts exactly the same recorded amount, returning the balance
          to 0 — no drift across the action pair.
