          setup:
            - "WARRANTED intersection with one ACTIVE AM post in Z-NORTH; Rita assigned 2026-09-08 -> 2026-09-18 and opted out of the pool; Nia (Z-SOUTH) and Sam (Z-NORTH) both eligible substitutes."
