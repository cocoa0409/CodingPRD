          setup:
            - "Outing OPEN with field_capacity_teams 1, i.e. four sellable player slots."
            - "Registration A CONFIRMED for four players; Registration B, created later, WAITLISTED because the field is already full."
            - "Registration A also holds an UPSELL allocation on a 50000-cent hole sign, moved to COMMITTED."
