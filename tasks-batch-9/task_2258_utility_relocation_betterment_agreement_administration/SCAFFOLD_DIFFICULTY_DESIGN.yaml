# =============================================================================
# 1.8 Scaffold Difficulty Design — task_2258 Utility Relocation & Betterment
#     Agreement Administration
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every numeric assert
# below was computed by executing the referenced §1.3 formula in code against
# the literals pinned in the same instance's setup.
#
# Shared fixture literals reused across instances (each instance still drives
# empty-DB -> its own state with its own setup_api_calls):
#   Project        : row_acquisition_year 1975, construction 2027-03-01 .. 2028-06-30,
#                    contract_daily_overhead_cents 250000
#   UtilityOwner O1: ELECTRIC, is_public_agency false, indirect_cost_rate_pct 12.5
#   UtilityFacility: BURIED_ELECTRIC, depth_in 48, installed_year 1968,
#                    occupancy_basis PRIVATE_EASEMENT  -> RECORD_BASIS share 100
#   RelocationPlan : estimated 40000000, in-kind 32000000, capacity 1.25
#                    -> betterment_ratio 0.360000, betterment_amount 14400000
#   Logical clock  : default 2026-08-01T00:00:00Z unless a set_current_utc call appears
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: prior_rights_record_basis_versus_field_basis_share
        grounds:
          - calculations.prior_rights_state_share
          - entities.PriorRightsDetermination.fields.evidence_variant
          - entities.PriorRightsDetermination.fields.final_state_share_pct
          - entities.SubsurfaceInvestigation.fields.contradicts_record
          - state_machines.PriorRightsDetermination.UNDER_REVIEW_to_ISSUED
        distinguishing_aspect: |
          Two facilities carrying byte-identical prior-rights inputs (PRIVATE_EASEMENT, installed
          1968, private owner, depth_in 48) resolve to different variants because only the second
          has a QL_A investigation contradicting the record: RECORD_BASIS yields
          final_state_share_pct 100 while FIELD_BASIS yields 55, a 45-point divergence produced by
          the variant selection alone.
        test_recipe:
          setup:
            - "One project with row_acquisition_year 1975."
            - "One private ELECTRIC owner with indirect_cost_rate_pct 12.5."
            - "Two identical facilities of that owner: occupancy_basis PRIVATE_EASEMENT, installed_year 1968, depth_in 48."
            - "Facility B additionally has one QL_A subsurface investigation measuring 60 inches (12 inches off the record, above DEPTH_TOLERANCE_IN of 6), so its contradicts_record is true; facility A has no investigation at all."
            - "One conflict per facility, each with resolution_type RELOCATE and a determination in UNDER_REVIEW claiming PRIVATE_EASEMENT."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { fa: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 200.0, station_end: 240.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { fb: $.data.id } }
            - { call: "POST /uro/investigations", payload: { project_id: "${p1}", facility_id: "${fb}", quality_level: "QL_A", method: "VACUUM_TEST_HOLE", measured_depth_in: 60, station_at_investigation: 220.0 }, as: UtilityCoordinator, captures: { inv_b: $.data.id, inv_b_contradicts: $.data.contradicts_record } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fa}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { ca: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${fb}", conflict_station: 220.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { cb: $.data.id } }
            - { call: "POST /uro/conflicts/${ca}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/conflicts/${cb}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${ca}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { da: $.data.id, da_provisional: $.data.provisional_state_share_pct } }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${cb}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { db: $.data.id, db_provisional: $.data.provisional_state_share_pct } }
            - { call: "POST /uro/prior-rights/${da}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${db}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
          trigger:
            - { call: "POST /uro/prior-rights/${da}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { da_variant: $.data.evidence_variant, da_final: $.data.final_state_share_pct } }
            - { call: "POST /uro/prior-rights/${db}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { db_variant: $.data.evidence_variant, db_final: $.data.final_state_share_pct } }
          assert:
            - "SubsurfaceInvestigation.${inv_b}.contradicts_record == true"
            - "PriorRightsDetermination.${da}.evidence_variant == RECORD_BASIS"
            - "PriorRightsDetermination.${da}.final_state_share_pct == 100"
            - "PriorRightsDetermination.${db}.evidence_variant == FIELD_BASIS"
            - "PriorRightsDetermination.${db}.final_state_share_pct == 55"
            - "PriorRightsDetermination.${da}.final_state_share_pct - PriorRightsDetermination.${db}.final_state_share_pct == 45"
            - "UtilityConflict.${ca}.state_share_pct == 100"
            - "UtilityConflict.${cb}.state_share_pct == 55"
            - "UtilityConflict.${ca}.status == RESPONSIBILITY_SET"
            - "UtilityConflict.${cb}.status == RESPONSIBILITY_SET"

      - name: agreement_eligible_cost_estimate_versus_actual_basis
        grounds:
          - calculations.agreement_eligible_cost
          - calculations.agreement_state_share_settlement
          - entities.ReimbursementAgreement.fields.cost_basis
          - entities.CostDocument.fields.exclusion_reason
          - state_machines.ReimbursementAgreement.PENDING_FINAL_INVOICE_to_SETTLED
        distinguishing_aspect: |
          The same agreement reports eligible_cost_cents 40000000 on ESTIMATE_BASIS and 21222221 on
          ACTUAL_BASIS from identical stored data, because the ACTUAL_BASIS variant filters to
          ACCEPTED documents, subtracts the salvage credit, and drops the 30000000 CONTRACT line
          whole at the 45000000 ceiling; state_share_cents moves 29070000 -> 15423250.
        test_recipe:
          setup:
            - "Base chain: project (authority 100000000), private ELECTRIC owner at 12.5 percent indirect, PRIVATE_EASEMENT facility installed 1968, conflict with determination ISSUED at share 100, plan (40000000 / 32000000 / 1.25) APPROVED with betterment_ratio 0.360000."
            - "Agreement drafted at not_to_exceed_cents 45000000 on ESTIMATE_BASIS, then circulated, executed and opened for final billing."
            - "Five cost documents submitted in ascending incurred_on: LABOR 12345678, MATERIAL 9876543, EQUIPMENT 5555555, CREDIT_SALVAGE 1000000, CONTRACT 30000000."
            - "Reviews: EQUIPMENT disallowed as NOT_SUPPORTED, the other four accepted."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11, joint_trench_requested: false }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id, pl1_ratio: $.data.betterment_ratio } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: $.data.id } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT", decision_note: "Encroachment permit granted." }, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/relocation-plans/${pl1}", payload: {}, as: AgreementOfficer, captures: { pl1v: $.data.version } }
            - { call: "POST /uro/agreements", payload: { plan_id: "${pl1}", expected_plan_version: "${pl1v}", not_to_exceed_cents: 45000000 }, as: AgreementOfficer, as_user_id: "officer-1", captures: { a1: $.data.id, a1_basis: $.data.cost_basis, a1_eligible_estimate: $.data.eligible_cost_cents, a1_share_estimate: $.data.state_share_cents } }
            - { call: "POST /uro/agreements/${a1}/circulate", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/agreements/${a1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/agreements/${a1}/open-final-billing", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/cost-documents", payload: { agreement_id: "${a1}", doc_type: "LABOR", amount_cents: 12345678, incurred_on: "2027-04-02T00:00:00Z", support_reference: "PR-2027-04-A" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { cd_labor: $.data.id } }
            - { call: "POST /uro/cost-documents", payload: { agreement_id: "${a1}", doc_type: "MATERIAL", amount_cents: 9876543, incurred_on: "2027-04-10T00:00:00Z", support_reference: "INV-88213" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { cd_material: $.data.id } }
            - { call: "POST /uro/cost-documents", payload: { agreement_id: "${a1}", doc_type: "EQUIPMENT", amount_cents: 5555555, incurred_on: "2027-04-15T00:00:00Z", support_reference: "EQ-4410" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { cd_equipment: $.data.id } }
            - { call: "POST /uro/cost-documents", payload: { agreement_id: "${a1}", doc_type: "CREDIT_SALVAGE", amount_cents: 1000000, incurred_on: "2027-04-20T00:00:00Z", support_reference: "SALV-77" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { cd_salvage: $.data.id } }
            - { call: "POST /uro/cost-documents", payload: { agreement_id: "${a1}", doc_type: "CONTRACT", amount_cents: 30000000, incurred_on: "2027-05-01T00:00:00Z", support_reference: "SUB-9001" }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { cd_contract: $.data.id } }
            - { call: "POST /uro/cost-documents/${cd_labor}/review", payload: { disposition: "ACCEPT" }, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/cost-documents/${cd_material}/review", payload: { disposition: "ACCEPT" }, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/cost-documents/${cd_equipment}/review", payload: { disposition: "DISALLOW", exclusion_reason: "NOT_SUPPORTED" }, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/cost-documents/${cd_salvage}/review", payload: { disposition: "ACCEPT" }, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/cost-documents/${cd_contract}/review", payload: { disposition: "ACCEPT" }, as: AgreementOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /uro/agreements/${a1}/final-settlement", payload: { as_built_reference: "ASB-2258-0007" }, as: AgreementOfficer, as_user_id: "officer-1", captures: { a1_basis_after: $.data.cost_basis, a1_eligible_actual: $.data.eligible_cost_cents, a1_share_actual: $.data.state_share_cents } }
          assert:
            - "RelocationPlan.${pl1}.betterment_ratio == 0.360000"
            - "ESTIMATE_BASIS variant, captured before the trigger: ReimbursementAgreement.${a1}.eligible_cost_cents was 40000000 and state_share_cents was 29070000"
            - "ReimbursementAgreement.${a1}.cost_basis == ACTUAL_BASIS"
            - "ReimbursementAgreement.${a1}.eligible_cost_cents == 21222221"
            - "ReimbursementAgreement.${a1}.indirect_cost_cents == 2652778"
            - "ReimbursementAgreement.${a1}.betterment_credit_cents == 7639999"
            - "ReimbursementAgreement.${a1}.net_allowable_cents == 16235000"
            - "ReimbursementAgreement.${a1}.participation_tier_pct == 95"
            - "ReimbursementAgreement.${a1}.state_share_cents == 15423250"
            - "ReimbursementAgreement.${a1}.owner_share_cents == 811750"
            - "CostDocument.${cd_contract}.review_status == DISALLOWED"
            - "CostDocument.${cd_contract}.exclusion_reason == EXCEEDS_NOT_TO_EXCEED_CAP"
            - "CostDocument.${cd_contract}.disallowed_amount_cents == 30000000"
            - "CostDocument.${cd_labor}.review_status == ACCEPTED"
            - "CostDocument.${cd_equipment}.exclusion_reason == NOT_SUPPORTED"
            - "Project.${p1}.total_committed_reimbursement_cents == 15423250"
            - "ReimbursementAgreement.${a1}.settlement_status == SETTLED"
            - "ReimbursementAgreement.${a1}.execution_status == EXECUTED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_nine_step_chain_pinned_at_every_intermediate
        grounds:
          - calculations.agreement_state_share_settlement
          - calculations.betterment_credit
          - entities.ReimbursementAgreement.fields.participation_tier_pct
          - entities.ReimbursementAgreement.fields.net_allowable_cents
          - validations[priority=28]
        distinguishing_aspect: |
          Mode c: a nine-step chain whose every intermediate is pinned to a literal - D 40000000,
          I 5000000, G 45000000, B 14400000, N 30600000, tier 95, S_uncapped 29070000, S 29070000,
          owner residual 1530000 - so a solution that selects the tier from G (which would give 90)
          or that rounds the two percentages separately is caught at the intermediate, not the total.
        test_recipe:
          setup:
            - "Base chain to an APPROVED plan: project authority 100000000, private ELECTRIC owner at 12.5 percent indirect, PRIVATE_EASEMENT facility installed 1968 giving conflict state_share_pct 100, plan 40000000 / 32000000 / capacity 1.25."
            - "No cost documents exist, so the agreement is created and read on ESTIMATE_BASIS."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1_final: $.data.final_state_share_pct } }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11, joint_trench_requested: false }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id, pl1_ratio: $.data.betterment_ratio, pl1_betterment: $.data.betterment_amount_cents } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: $.data.id } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT" }, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "GET /uro/relocation-plans/${pl1}", payload: {}, as: AgreementOfficer, captures: { pl1v: $.data.version } }
          trigger:
            - { call: "POST /uro/agreements", payload: { plan_id: "${pl1}", expected_plan_version: "${pl1v}", not_to_exceed_cents: 45000000 }, as: AgreementOfficer, as_user_id: "officer-1", captures: { a1: $.data.id } }
          assert:
            - "RelocationPlan.${pl1}.betterment_ratio == 0.360000"
            - "RelocationPlan.${pl1}.betterment_amount_cents == 14400000"
            - "ReimbursementAgreement.${a1}.eligible_cost_cents == 40000000"
            - "ReimbursementAgreement.${a1}.indirect_cost_cents == 5000000"
            - "ReimbursementAgreement.${a1}.betterment_credit_cents == 14400000"
            - "ReimbursementAgreement.${a1}.net_allowable_cents == 30600000"
            - "ReimbursementAgreement.${a1}.participation_tier_pct == 95"
            - "ReimbursementAgreement.${a1}.state_share_cents == 29070000"
            - "ReimbursementAgreement.${a1}.owner_share_cents == 1530000"
            - "ReimbursementAgreement.${a1}.eligible_cost_cents + ReimbursementAgreement.${a1}.indirect_cost_cents - ReimbursementAgreement.${a1}.betterment_credit_cents == ReimbursementAgreement.${a1}.net_allowable_cents"
            - "ReimbursementAgreement.${a1}.state_share_cents + ReimbursementAgreement.${a1}.owner_share_cents == 30600000"
            - "ReimbursementAgreement.${a1}.cost_basis == ESTIMATE_BASIS"

      - name: betterment_credit_per_line_rounding_beats_aggregate_rounding
        grounds:
          - calculations.betterment_credit
          - calculations.agreement_eligible_cost
          - entities.ReimbursementAgreement.fields.betterment_credit_cents
          - state_machines.ReimbursementAgreement.PENDING_FINAL_INVOICE_to_SETTLED
        distinguishing_aspect: |
          Mode b: rounding order alone decides the answer - two accepted lines of 12345678 and
          9876543 at betterment_ratio 0.360000 round per line to 4444444 + 3555555 = 7999999,
          whereas rounding the 22222221 aggregate gives 8000000; the assert pins 7999999 and
          explicitly forbids 8000000.
        test_recipe:
          setup:
            - "Base chain to an executed agreement in settlement_status PENDING_FINAL_INVOICE, betterment_ratio 0.360000, not_to_exceed_cents 45000000."
            - "Exactly two cost documents, both ACCEPTED: LABOR 12345678 on 2027-04-02 and MATERIAL 9876543 on 2027-04-10; their sum 22222221 stays under the ceiling so no exclusion interferes."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
