        grounds:
          - calculations.savings_match_award
          - entities.TlpPlacement.fields.match_awarded_cents
        distinguishing_aspect: "A single 400000-cent deposit at rate 2500 bp earns a raw per-entry match of 100000 cents, but match_awarded_cents is clamped to MATCH_CAP_CENTS 50000, so the balance is 450000 and not 500000 - and the uncapped 100000 is still visible on the entry's own match_component_cents."
