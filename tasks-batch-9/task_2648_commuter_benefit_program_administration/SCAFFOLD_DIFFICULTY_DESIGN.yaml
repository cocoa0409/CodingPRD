  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: window_lock_cascades_window_to_election_to_account_to_employer_suspension
        grounds:
          - state_machines.ElectionWindow.OPEN_to_LOCKED
          - state_machines.Election.PENDING_to_FUNDED
          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - calculations.employer_pretax_commitment
          - calculations.benefit_account_conservation
          - entities.Employer.fields.total_pretax_committed_cents
          - entities.Employer.fields.program_status
        distinguishing_aspect: |
          CASCADE A, depth 4, fired by locking an election window: ElectionWindow OPEN->LOCKED
          (hop 1) -> Election PENDING->FUNDED with the funded_basis rewrite (hop 2) -> BenefitAccount
          credit plus a CONTRIBUTION LedgerEntry (hop 3) -> Employer ACTIVE->SUSPENDED because the
          recomputed total_pretax_committed_cents 30000 strictly exceeds program_cap_cents 25000
          (hop 4). Hop 4 is two entities removed from anything the request names.
        test_recipe:
          setup:
            - "Employer 'Bay Area Cap Test' is ACTIVE in US-CA-SFO with transit_group_limit_cents 30000, parking_group_limit_cents 30000, pretax_ratio_cap_pct 100, spill_policy SPILL_TO_POSTTAX and a deliberately low program_cap_cents 25000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 30000 exists, so the exclusion split itself does not clip the request."
            - "One employee holds a TRANSIT_PASS BenefitAccount with no opening balance, so the account ledger starts empty."
            - "ElectionWindow 2026-08 occupies [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) and is OPEN; the clock is at its 2026-08-01T00:00:00Z default."
            - "The employee has one PENDING election requesting pretax 30000 with no media, so nothing has yet been committed and employer.program_status is still ACTIVE."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Bay Area Cap Test", region_code: "US-CA-SFO", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, pretax_ratio_cap_pct: 100, spill_policy: "SPILL_TO_POSTTAX", program_cap_cents: 25000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { status_before: $.data.program_status, committed_before: $.data.total_pretax_committed_cents }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "SFO-CAP-1", work_region_code: "US-CA-SFO", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 30000, posttax_amount_cents: 0, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { el_id: $.data.id }
          trigger:
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
              captures: { win_status: $.data.status }
          assert:
            - "${status_before} == ACTIVE"
            - "${committed_before} == 0"
            - "${win_status} == LOCKED"
            - "ElectionWindow.${win_id}.election_count == 1"
            - "Election.${el_id}.funding_status == FUNDED"
            - "Election.${el_id}.excluded_amount_cents == 30000"
            - "Election.${el_id}.posttax_spill_cents == 0"
            - "Election.${el_id}.exclusion_basis == FUNDED_BASIS"
            - "BenefitAccount.${acct_id}.contributed_cents == 30000"
            - "BenefitAccount.${acct_id}.available_balance_cents == 30000"
            - "BenefitAccount.${acct_id}.ledger_entry_count == 1"
            - "the single LedgerEntry for account ${acct_id} has entry_type CONTRIBUTION, amount_cents 30000, balance_after_cents 30000, source_entity Election and source_id ${el_id}"
            - "Employer.${er_id}.total_pretax_committed_cents == 30000"
            - "Employer.${er_id}.program_status == SUSPENDED"

      - name: deny_substantiation_cascades_transaction_to_account_to_employee_to_pending_election_hold
        grounds:
          - state_machines.CardTransaction.PENDING_DOCS_to_INELIGIBLE
          - state_machines.Election.PENDING_to_HELD
          - entities.Employee.fields.repayment_due_cents
          - entities.Employee.fields.substantiation_hold
          - entities.LedgerEntry.fields.entry_type
          - calculations.benefit_account_conservation
        distinguishing_aspect: |
          CASCADE B, depth 4, fired by a COMPLETELY DIFFERENT trigger (a compliance denial, not a
          window lock) and ending in a DIFFERENT terminal effect: CardTransaction PENDING_DOCS->
          INELIGIBLE (hop 1) -> SPEND_REVERSAL LedgerEntry restoring the account (hop 2) ->
          Employee.repayment_due_cents 3000 with substantiation_hold true (hop 3) -> the employee's
          other, unrelated PENDING election in a second window flips PENDING->HELD (hop 4). Hop 4
          touches an Election that the denied swipe never referenced.
        test_recipe:
          setup:
            - "The clock is moved back to 2026-07-01T00:00:00Z so the July window is still inside its cutoff."
            - "Employer 'Manhattan Commute Co' is ACTIVE in US-NY-NYC with transit_group_limit_cents 30000, program_cap_cents 5000000 and one TRANSIT_PASS category at monthly_exclusion_limit_cents 30000."
            - "One employee holds a TRANSIT_PASS BenefitAccount with no opening balance."
            - "ElectionWindow W1 (benefit_month 2026-07) occupies [2026-06-01T00:00:00Z, 2026-07-20T00:00:00Z) and has been OPENed, taken a pretax 5000 election and been LOCKED, so that election is FUNDED and the account holds available_balance_cents 5000."
            - "The clock is then moved to 2026-08-01T00:00:00Z and ElectionWindow W2 (benefit_month 2026-08) occupies the adjacent [2026-07-20T00:00:00Z, 2026-08-20T00:00:00Z) and is OPEN."
            - "The employee takes a second, still PENDING pretax 4000 election in W2."
            - "A 3000-cent MCC 4111 swipe is ingested against the FUNDED July election; 3000 exceeds AUTO_SUBSTANTIATION_CEILING_CENTS 2500 so it lands in PENDING_DOCS with posted_spend_cents 3000 and the account drops to available_balance_cents 2000."
