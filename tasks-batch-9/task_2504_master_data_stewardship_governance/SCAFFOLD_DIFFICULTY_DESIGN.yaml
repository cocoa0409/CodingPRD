              as: DataSteward
              as_user_id: "${std_id}"
              captures: { f_status_planned: $.data.status, f_weight_planned: $.data.severity_weight, f_planned_by: $.data.planned_by_steward_id }
            - call: "GET /mdm/stewards/${std_id}"
              as: GovernanceAdmin
              captures: { std_load_planned: $.data.open_finding_load }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_planned: $.data.governance_posture, weight_planned: $.data.open_finding_weight }
            - call: "POST /mdm/quality-findings/${f_id}/resolve"
              payload: { verified_measured_pct: 95.00, resolution_note: "Attribute backfill verified against the certified ERP extract" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { f_status_resolved: $.data.status, f_weight_resolved: $.data.severity_weight, f_gap_resolved: $.data.gap_pct, f_measured_resolved: $.data.measured_pct, f_resolved_at: $.data.resolved_at }
            - call: "GET /mdm/stewards/${std_id}"
              as: GovernanceAdmin
              captures: { std_load_resolved: $.data.open_finding_load }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_resolved: $.data.governance_posture, weight_resolved: $.data.open_finding_weight }
          assert:
            - "${std_load_initial} == 0"
            - "${run1_mult} == 1.00 and ${f_weight_open} == 20.00 (CRITICAL base 20 x 1.00) and ${f_gap_open} == 40.00"
            - "${posture_before} == RESTRICTED and ${weight_before} == 20.00"
            - "${f_status_planned} == REMEDIATION_PLANNED and ${f_planned_by} == ${std_id}"
            - "${std_load_planned} == 1 (planning charges the assignee)"
            - "${weight_planned} == 20.00 and ${posture_planned} == RESTRICTED (planning is not a release: the finding is still open)"
            - "${f_weight_planned} == 20.00 (severity_weight is pinned at creation)"
            - "${f_status_resolved} == RESOLVED, ${f_measured_resolved} == 95.00, ${f_gap_resolved} == 0.00, ${f_resolved_at} == 2026-08-05T00:00:00Z"
            - "${f_weight_resolved} == 20.00 (still pinned - resolution never re-derives it under the current multiplier)"
            - "${std_load_resolved} == 0 (the load charge is compensated exactly once)"
            - "${weight_resolved} == 0.00 and ${posture_resolved} == OPEN"
