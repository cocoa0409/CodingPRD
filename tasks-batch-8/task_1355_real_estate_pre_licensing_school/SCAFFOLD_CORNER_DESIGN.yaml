            - { call: "GET /schools/${sch}", as: ComplianceOfficer, captures: { post: $.data.posture } }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "CE-NEW", title: "New CE", course_type: "CONTINUING_ED", required_seat_minutes: 60, tuition_cents: 10000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 3.0 }, as: SchoolDirector, captures: { crs2: $.data.id } }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-10-01", end_date: "2026-10-05", capacity: 5, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off2: $.data.id } }
