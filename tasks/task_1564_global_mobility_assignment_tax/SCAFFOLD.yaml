    side_effects: ["status -> REPATRIATED; actual_end_date stamped; PayrollSplit SUSPENDED/ACTIVE -> TERMINATED"]
  - method: POST
    path: "/mobility/assignments/{id}/close"
    description: "Close a repatriated assignment; requires all settlements SETTLED and all chargeback entries POSTED or VOIDED"
    roles: [MobilityAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/mobility/assignments/{id}/cancel"
    description: "Cancel while DRAFT or in approval; frees the employee date window"
    roles: [MobilityAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status -> CANCELLED"]

  # --- CompensationPackage ---
