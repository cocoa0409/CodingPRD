              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
            - call: "POST /robotics/safety-risk-assessments/${sra_id}/approve"
              payload: {}
              as: SafetyLead
              as_user_id: "${sl_id}"
            - call: "GET /robotics/cell-projects/${proj_id}"
              payload: {}
              as: ProjectEngineer
              as_user_id: "${eng_id}"
              captures: { v2: $.data.version }
            - call: "POST /robotics/cell-projects/${proj_id}/advance"
