              as: Member
              as_user_id: "${m1_id}"
              captures: { pC_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "GET /listings/${lstC_id}"
              payload: {}
              as: Member
