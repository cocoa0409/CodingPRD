# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Fiscal Sponsorship Administration. 9 rules x >=2 instances = 20 instances.
# All numeric asserts are pre-computed literals (exact decimal, round_half_up).
# Passing mission scorecard used in setups: 50/50/100/0 -> 70.00.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: admin_fee_model_variants_diverge
        grounds:
          - calculations.admin_fee_on_receipt
          - entities.Donation.fields.fee_cents
          - entities.SponsorshipAgreement.fields.model
        distinguishing_aspect: |
          Dual-variant fee logic in the DONATION/FUND domain: identical gross
          donation (200000 cents) yields 14000 under the COMPREHENSIVE tiered
          variant (cumulative 9,900,000 -> 100000@8% + 100000@6%) and 6000
          under the PRE_APPROVED_GRANT flat-3% variant.
        test_recipe:
          setup:
            - "COMPREHENSIVE project A ACTIVE with cumulative received 9,900,000 cents"
            - "PRE_APPROVED_GRANT project B ACTIVE with zero receipts"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Alpha", mission_statement: "arts", requested_model: "COMPREHENSIVE", budget_estimate_cents: 5000000, contact_email: "a@x.org" }, as: Applicant, as_user_id: user_app_a, captures: { app_a: $.data.id } }
            - { call: "POST /fsa/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: user_app_a }
            - { call: "POST /fsa/applications/${app_a}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_a}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_a: $.data.project_id, ag_a: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_a}/countersign", payload: {}, as: Applicant, as_user_id: user_app_a }
            - { call: "POST /fsa/projects/${p_a}/donations", payload: { amount_cents: 9900000, donor_name: "D One", donor_email: "d1@x.org", payment_method: "WIRE" }, as: Donor, as_user_id: user_donor_1, captures: { d_a1: $.data.id } }
            - { call: "POST /fsa/donations/${d_a1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/applications", payload: { project_name: "Beta", mission_statement: "rivers", requested_model: "PRE_APPROVED_GRANT", budget_estimate_cents: 5000000, contact_email: "b@x.org" }, as: Applicant, as_user_id: user_app_b, captures: { app_b: $.data.id } }
            - { call: "POST /fsa/applications/${app_b}/submit", payload: {}, as: Applicant, as_user_id: user_app_b }
            - { call: "POST /fsa/applications/${app_b}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_b}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "PRE_APPROVED_GRANT" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_b: $.data.project_id, ag_b: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_b}/countersign", payload: {}, as: Applicant, as_user_id: user_app_b }
          trigger:
            - { call: "POST /fsa/projects/${p_a}/donations", payload: { amount_cents: 200000, donor_name: "D Two", donor_email: "d2@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_a2: $.data.id } }
            - { call: "POST /fsa/donations/${d_a2}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { fee_a: $.data.fee_cents } }
            - { call: "POST /fsa/projects/${p_b}/donations", payload: { amount_cents: 200000, donor_name: "D Three", donor_email: "d3@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_b1: $.data.id } }
            - { call: "POST /fsa/donations/${d_b1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { fee_b: $.data.fee_cents } }
          assert:
            - "Donation.${d_a2}.fee_cents == 14000  (tier straddle: 8000 at 8% + 6000 at 6%)"
            - "Donation.${d_b1}.fee_cents == 6000   (flat 3%, no cumulative input)"
            - "Same amount_cents=200000 produces fee 14000 vs 6000 purely from agreement.model variant selection"

      - name: spend_basis_settled_vs_forward
        grounds:
          - calculations.available_spend_balance
          - entities.FundAccount.fields.available_cents
          - entities.FundAccount.fields.forward_available_cents
          - entities.SponsorshipAgreement.fields.spending_basis
        distinguishing_aspect: |
          Dual-variant logic in the DISBURSEMENT domain (different entity domain
          from admin_fee): with identical fund data (settled 92,000 + one PLEDGED
          50,000), the SETTLED variant rejects a 120,000 submit while the
          FORWARD_LOOKING variant (92,000 + 0.8*50,000 = 132,000) accepts it.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; one RECEIVED donation 100,000 (fee 8,000; settled available 92,000); one PLEDGED donation 50,000"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Gamma", mission_statement: "parks", requested_model: "COMPREHENSIVE", budget_estimate_cents: 5000000, contact_email: "g@x.org" }, as: Applicant, as_user_id: user_app_c, captures: { app_c: $.data.id } }
            - { call: "POST /fsa/applications/${app_c}/submit", payload: {}, as: Applicant, as_user_id: user_app_c }
            - { call: "POST /fsa/applications/${app_c}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_c}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_c: $.data.project_id, ag_c: $.data.agreement_id, f_c: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag_c}/countersign", payload: {}, as: Applicant, as_user_id: user_app_c }
            - { call: "POST /fsa/projects/${p_c}/donations", payload: { amount_cents: 100000, donor_name: "D Four", donor_email: "d4@x.org", payment_method: "ACH" }, as: Donor, as_user_id: user_donor_1, captures: { d_c1: $.data.id } }
            - { call: "POST /fsa/donations/${d_c1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_c}/donations", payload: { amount_cents: 50000, donor_name: "D Five", donor_email: "d5@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1 }
            - { call: "GET /fsa/agreements/${ag_c}", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { ag_c_v: $.data.version } }
          trigger:
            - { call: "POST /fsa/projects/${p_c}/disbursement-requests", payload: { amount_cents: 120000, purpose: "equipment", payee_type: "VENDOR", payee_name: "Acme", spend_date: "2026-06-15" }, as: ProjectLead, as_user_id: "${p_c}", captures: { dr1: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr1}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_c}", captures: { e1: $.data.error_id } }
            - { call: "POST /fsa/agreements/${ag_c}/amend", payload: { expected_agreement_version: "${ag_c_v}", spending_basis: "FORWARD_LOOKING" }, as: SponsorAdmin, as_user_id: user_sa_1 }
            - { call: "POST /fsa/projects/${p_c}/disbursement-requests", payload: { amount_cents: 120000, purpose: "equipment 2", payee_type: "VENDOR", payee_name: "Acme", spend_date: "2026-06-16" }, as: ProjectLead, as_user_id: "${p_c}", captures: { dr2: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr2}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_c}", captures: { dr2_status: $.data.status } }
            - { call: "GET /fsa/fund-accounts/${f_c}", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { avail: $.data.available_cents, fwd: $.data.forward_available_cents, comm: $.data.committed_cents } }
          assert:
            - "e1 == ERR_INSUFFICIENT_FUNDS (settled 92,000 < 120,000)"
            - "DisbursementRequest.${dr2}.status == SUBMITTED under FORWARD_LOOKING (132,000 >= 120,000)"
            - "fund.available_cents == -28000 (92,000 - 120,000 committed)"
            - "fund.forward_available_cents == 12000 (132,000 - 120,000)"
            - "fund.committed_cents == 120000"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_tier_straddle_and_min_branches
        grounds:
          - calculations.admin_fee_on_receipt
          - entities.Donation.fields.fee_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (amount, cumulative-received-before, model) with
          non-linear interaction — tier-boundary straddle (8000+6000=14000) and
          the max(MIN_FEE, tiered) branch (raw 8 -> 50) on the same formula.
        test_recipe:
          setup:
            - "COMPREHENSIVE project A with cumulative received 9,900,000 (one donation)"
            - "COMPREHENSIVE project C with zero receipts"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Delta", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 900000000, contact_email: "d@x.org" }, as: Applicant, as_user_id: user_app_d, captures: { app_d: $.data.id } }
            - { call: "POST /fsa/applications/${app_d}/submit", payload: {}, as: Applicant, as_user_id: user_app_d }
            - { call: "POST /fsa/applications/${app_d}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_d}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_d: $.data.project_id, ag_d: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_d}/countersign", payload: {}, as: Applicant, as_user_id: user_app_d }
            - { call: "POST /fsa/projects/${p_d}/donations", payload: { amount_cents: 9900000, donor_name: "D Six", donor_email: "d6@x.org", payment_method: "WIRE" }, as: Donor, as_user_id: user_donor_1, captures: { d_d1: $.data.id } }
            - { call: "POST /fsa/donations/${d_d1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/applications", payload: { project_name: "Epsilon", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "e@x.org" }, as: Applicant, as_user_id: user_app_e, captures: { app_e: $.data.id } }
            - { call: "POST /fsa/applications/${app_e}/submit", payload: {}, as: Applicant, as_user_id: user_app_e }
            - { call: "POST /fsa/applications/${app_e}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_e}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_e: $.data.project_id, ag_e: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag_e}/countersign", payload: {}, as: Applicant, as_user_id: user_app_e }
          trigger:
            - { call: "POST /fsa/projects/${p_d}/donations", payload: { amount_cents: 200000, donor_name: "D Seven", donor_email: "d7@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_d2: $.data.id } }
            - { call: "POST /fsa/donations/${d_d2}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { fee_straddle: $.data.fee_cents } }
            - { call: "POST /fsa/projects/${p_e}/donations", payload: { amount_cents: 100, donor_name: "D Eight", donor_email: "d8@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d_e1: $.data.id } }
            - { call: "POST /fsa/donations/${d_e1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1, captures: { fee_min: $.data.fee_cents } }
          assert:
            - "Donation.${d_d2}.fee_cents == 14000 (straddle: 100000*0.08 + 100000*0.06, per-segment rounding then sum)"
            - "Donation.${d_e1}.fee_cents == 50 (max(MIN_FEE_CENTS=50, raw tiered 8) — min branch wins)"

      - name: mission_score_rounding_order_pinned
        grounds:
          - calculations.mission_alignment_score
          - entities.ProjectApplication.fields.mission_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-component
          round_half_up THEN sum yields 60.39 for scorecard 73/63/61/67, while
          sum-then-round yields 60.37; the scaffold pins per-component-first.
        test_recipe:
          setup:
            - "Application in SUBMITTED with no prior score"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Zeta", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "z@x.org" }, as: Applicant, as_user_id: user_app_f, captures: { app_f: $.data.id } }
            - { call: "POST /fsa/applications/${app_f}/submit", payload: {}, as: Applicant, as_user_id: user_app_f }
          trigger:
            - { call: "POST /fsa/applications/${app_f}/mission-score", payload: { purpose_pts: 73, benefit_pts: 63, capacity_pts: 61, risk_pts: 67, action: "RETURN" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { ms: $.data.mission_score, st: $.data.status } }
          assert:
            - "mission_score == 60.39 (24.46 + 16.70 + 13.12 + 6.11; sum-first alternative 60.37 is REJECTED)"
            - "status == RETURNED (action=RETURN honored regardless of score)"

      - name: exit_waterfall_evaluation_order_pinned
        grounds:
          - calculations.exit_settlement_waterfall
          - entities.ExitPlan.fields.exit_fee_cents
          - entities.ExitPlan.fields.transfer_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — exit fee is 2% of the transfer
          base while the base excludes the fee — resolved by the pinned order
          reserve-then-fee-then-transfer; min-fee branch binds (6000 < 50000).
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; fund G = 1,000,040 (received 1,087,000, fee 86,960)"
            - "one disbursement 200,040 APPROVED_FOR_PAYMENT (committed bucket)"
            - "compliance review FINDINGS_ISSUED with 2 open findings (reserve 500,000)"
            - "exit plan APPROVED with three distinct signoffs"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Eta", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 900000000, contact_email: "h@x.org" }, as: Applicant, as_user_id: user_app_g, captures: { app_g: $.data.id } }
            - { call: "POST /fsa/applications/${app_g}/submit", payload: {}, as: Applicant, as_user_id: user_app_g }
            - { call: "POST /fsa/applications/${app_g}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_g}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p_g: $.data.project_id, ag_g: $.data.agreement_id, f_g: $.data.fund_account_id } }
            - { call: "POST /fsa/agreements/${ag_g}/countersign", payload: {}, as: Applicant, as_user_id: user_app_g }
            - { call: "POST /fsa/projects/${p_g}/donations", payload: { amount_cents: 1087000, donor_name: "D Nine", donor_email: "d9@x.org", payment_method: "WIRE" }, as: Donor, as_user_id: user_donor_1, captures: { d_g1: $.data.id } }
            - { call: "POST /fsa/donations/${d_g1}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p_g}/disbursement-requests", payload: { amount_cents: 200040, purpose: "settled obligation", payee_type: "VENDOR", payee_name: "Builders", spend_date: "2026-06-10" }, as: ProjectLead, as_user_id: "${p_g}", captures: { dr_g: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr_g}/submit", payload: {}, as: ProjectLead, as_user_id: "${p_g}" }
            - { call: "POST /fsa/disbursement-requests/${dr_g}/compliance-review", payload: { decision: "APPROVE" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/projects/${p_g}/compliance-reviews", payload: { review_type: "TRIGGERED" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { rv_g: $.data.id } }
            - { call: "POST /fsa/compliance-reviews/${rv_g}/issue-findings", payload: { findings_count: 2, severity_max: "HIGH" }, as: ComplianceOfficer, as_user_id: user_co_1 }
            - { call: "POST /fsa/projects/${p_g}/exit-plans", payload: { successor_entity_name: "Indie Corp", successor_ein: "12-3456789", reason: "spin off" }, as: ProjectLead, as_user_id: "${p_g}", captures: { ep_g: $.data.id } }
            - { call: "POST /fsa/exit-plans/${ep_g}/begin-due-diligence", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1 }
            - { call: "POST /fsa/exit-plans/${ep_g}/signoff", payload: { party: "SPONSOR_BOARD" }, as: SponsorAdmin, as_user_id: user_sa_1 }
            - { call: "POST /fsa/exit-plans/${ep_g}/signoff", payload: { party: "SUCCESSOR_REP" }, as: SponsorAdmin, as_user_id: user_sa_2 }
            - { call: "POST /fsa/exit-plans/${ep_g}/signoff", payload: { party: "PROJECT_LEAD" }, as: ProjectLead, as_user_id: "${p_g}" }
          trigger:
            - { call: "POST /fsa/exit-plans/${ep_g}/execute", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { b1: $.data.committed_payout_cents, b2: $.data.reserve_cents, b3: $.data.exit_fee_cents, b4: $.data.transfer_cents } }
            - { call: "GET /fsa/projects/${p_g}", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { p_st: $.data.status } }
            - { call: "GET /fsa/agreements/${ag_g}", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { ag_st: $.data.status } }
            - { call: "GET /fsa/disbursement-requests/${dr_g}", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { dr_st: $.data.status, dr_xs: $.data.exit_settled } }
          assert:
            - "committed_payout_cents == 200040 (bucket 1)"
            - "reserve_cents == 500000 (bucket 2: 2 findings x 250,000)"
            - "exit_fee_cents == 50000 (bucket 3: max(50000, round_half_up(0.02 x 300000)=6000) — min branch binds)"
            - "transfer_cents == 250000 (bucket 4: base 300000 - fee 50000)"
            - "bucket sum 200040 + 500000 + 50000 + 250000 == 1000040 == G (available 800000 + committed 200040)"
            - "DisbursementRequest.${dr_g}.status == PAID and exit_settled == true"
            - "Project.${p_g}.status == SPUN_OFF; Agreement.${ag_g}.status == SUPERSEDED_BY_INDEPENDENCE"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_cycle
        grounds:
          - state_machines.ProjectApplication.RETURNED_to_SUBMITTED
          - state_machines.ProjectApplication.SUBMITTED_to_RETURNED
          - entities.ProjectApplication.fields.submit_count
        distinguishing_aspect: |
          Cyclic machine on ProjectApplication: SUBMITTED -> RETURNED -> SUBMITTED
          revision loop traversed twice (once via mission-score RETURN, once via
          compliance-decision RETURN) before APPROVED; submit_count tracks iterations.
        test_recipe:
          setup:
            - "Application created in DRAFT"
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "Theta", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 100000, contact_email: "t@x.org" }, as: Applicant, as_user_id: user_app_h, captures: { app_h: $.data.id } }
          trigger:
            - { call: "POST /fsa/applications/${app_h}/submit", payload: {}, as: Applicant, as_user_id: user_app_h }
            - { call: "POST /fsa/applications/${app_h}/mission-score", payload: { purpose_pts: 40, benefit_pts: 40, capacity_pts: 40, risk_pts: 90, action: "RETURN" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { st1: $.data.status } }
            - { call: "POST /fsa/applications/${app_h}/submit", payload: {}, as: Applicant, as_user_id: user_app_h }
            - { call: "POST /fsa/applications/${app_h}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { st2: $.data.status } }
            - { call: "POST /fsa/applications/${app_h}/compliance-decision", payload: { decision: "RETURN", rationale: "budget unclear" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { st3: $.data.status } }
            - { call: "POST /fsa/applications/${app_h}/submit", payload: {}, as: Applicant, as_user_id: user_app_h }
            - { call: "POST /fsa/applications/${app_h}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app_h}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { st4: $.data.status, sc: $.data.submit_count, pid: $.data.project_id } }
          assert:
            - "st1 == RETURNED and st2 == COMPLIANCE_REVIEW and st3 == RETURNED (loop traversed twice via two different RETURN triggers)"
            - "st4 == APPROVED and submit_count == 3"
            - "project_id non-null after APPROVE (approval cascade minted Project)"

      - name: engagement_reclassification_cycle
        grounds:
          - state_machines.StaffEngagement.ACTIVE_to_CLASSIFICATION_REVIEW
          - state_machines.StaffEngagement.CLASSIFICATION_REVIEW_to_VETTED
          - entities.StaffEngagement.fields.classification_overridden
        distinguishing_aspect: |
          Cyclic machine on StaffEngagement (different entity from
          ProjectApplication): ACTIVE -> CLASSIFICATION_REVIEW -> VETTED -> ACTIVE
          reclassification loop, with engagement_type flipping CONTRACTOR ->
          EMPLOYEE via override on the second pass.
        test_recipe:
          setup:
            - "COMPREHENSIVE project ACTIVE; engagement for worker ACTIVE as CONTRACTOR"
          setup_api_calls:
