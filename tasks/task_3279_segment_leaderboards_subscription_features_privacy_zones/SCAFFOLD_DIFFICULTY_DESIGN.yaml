scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (two variants on DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: late_join_progress_divergence
        grounds:
          - calculations.challenge_progress
          - entities.ChallengeParticipation.fields.progress_value
          - state_machines.ChallengeParticipation
        distinguishing_aspect: |
          Challenge domain: the late_join_baseline variant counts only activities
          COMPLETED strictly after participation.joined_at, so identical activity
          history yields progress 0 for the late joiner versus 12000 for the early
          joiner — a participation-scoped dual variant, not a privacy one.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z (startup default)"
            - "Athletes Own (club owner) and Joiner exist"
            - "Club C (OPEN join policy) owned by Own; both Own and Joiner ACTIVE members"
            - "Challenge CH ACTIVE, DISTANCE_M goal 50000, window 2026-09-01..2026-09-07"
            - "Joiner has COMPLETED a 12000m RUN activity at 2026-09-02T10:00:00Z (uploaded at clock 2026-09-02T12:00:00Z) BEFORE joining"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "own_lj@x.com", display_name: "Own LJ", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { own_lj: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "join_lj@x.com", display_name: "Join LJ", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { join_lj: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${own_lj}", name: "Late Join Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${own_lj}"
              captures: { club_lj: $.data.id }
            - call: "POST /v1/clubs/${club_lj}/memberships"
              payload: { athlete_id: "${join_lj}" }
              as: Athlete
              as_user_id: "${join_lj}"
              captures: { mbr_lj: $.data.id }
            - call: "POST /v1/clubs/${club_lj}/challenges"
              payload: { name: "September 50k", goal_type: "DISTANCE_M", goal_target: 50000, start_date: "2026-09-01", end_date: "2026-09-07", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${own_lj}"
              captures: { ch_lj: $.data.id }
            - call: "POST /v1/clubs/${club_lj}/challenges/${ch_lj}/start"
              payload: {}
              as: Athlete
              as_user_id: "${own_lj}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/athletes/${join_lj}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-02T10:00:00Z", duration_s: 3600, distance_m: 12000, track_points: [{lat: 37.10, lng: -122.00, t_offset_s: 0}, {lat: 37.11, lng: -122.00, t_offset_s: 1800}, {lat: 37.12, lng: -122.00, t_offset_s: 3600}], start_lat: 37.10, start_lng: -122.00, end_lat: 37.12, end_lng: -122.00, idempotency_key: "lj-act-1" }
              as: Athlete
              as_user_id: "${join_lj}"
              captures: { act_lj: $.data.id }
          trigger:
            - call: "POST /v1/challenges/${ch_lj}/participations"
              payload: { athlete_id: "${join_lj}" }
              as: Athlete
              as_user_id: "${join_lj}"
              captures: { part_lj: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/athletes/${join_lj}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-04T10:00:00Z", duration_s: 3600, distance_m: 12000, track_points: [{lat: 37.10, lng: -122.00, t_offset_s: 0}, {lat: 37.11, lng: -122.00, t_offset_s: 1800}, {lat: 37.12, lng: -122.00, t_offset_s: 3600}], start_lat: 37.10, start_lng: -122.00, end_lat: 37.12, end_lng: -122.00, idempotency_key: "lj-act-2" }
              as: Athlete
              as_user_id: "${join_lj}"
            - call: "GET /v1/participations/${part_lj}"
              as: Athlete
              as_user_id: "${join_lj}"
              captures: { prog_lj: $.data.progress_value }
          assert:
            - "ChallengeParticipation.${part_lj}.progress_value == 12000 (only the post-join activity counts; the 12000m activity completed before joined_at is excluded by the late_join_baseline variant)"
            - "ChallengeParticipation.${part_lj}.status == JOINED"

      - name: obfuscation_full_vs_partial
        grounds:
          - calculations.route_obfuscation
          - entities.Activity.fields.obfuscated_track
          - entities.PrivacyZone.fields.status
        distinguishing_aspect: |
          Privacy domain: the full_swallow variant yields obfuscated_track == []
          and null obfuscated endpoints when every track point lies inside an
          ACTIVE zone, while the partial variant only trims head/tail points —
          a different entity domain (Activity route privacy) than the challenge
          progress variant.
        test_recipe:
          setup:
            - "Athlete Z with an ACTIVE PrivacyZone centered (37.000,-122.000) radius 1000m"
            - "Athlete Z uploaded activity A-IN with all 3 track points inside the zone, and activity A-OUT with all 3 track points ~11km outside the zone"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "z_obf@x.com", display_name: "Z Obf", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ath_obf: $.data.id }
            - call: "POST /v1/athletes/${ath_obf}/privacy_zones"
              payload: { center_lat: 37.000, center_lng: -122.000, radius_m: 1000 }
              as: Athlete
              as_user_id: "${ath_obf}"
              captures: { zone_obf: $.data.id }
            - call: "POST /v1/athletes/${ath_obf}/activities"
              payload: { device_source: "mobile-app", sport_type: "RUN", started_at: "2026-09-01T08:00:00Z", duration_s: 600, distance_m: 1500, track_points: [{lat: 37.001, lng: -122.001, t_offset_s: 0}, {lat: 37.002, lng: -122.000, t_offset_s: 300}, {lat: 37.001, lng: -122.002, t_offset_s: 600}], start_lat: 37.001, start_lng: -122.001, end_lat: 37.001, end_lng: -122.002, idempotency_key: "obf-in" }
              as: Athlete
              as_user_id: "${ath_obf}"
              captures: { act_in: $.data.id }
            - call: "POST /v1/athletes/${ath_obf}/activities"
              payload: { device_source: "mobile-app", sport_type: "RUN", started_at: "2026-09-01T09:00:00Z", duration_s: 600, distance_m: 1500, track_points: [{lat: 37.100, lng: -122.100, t_offset_s: 0}, {lat: 37.101, lng: -122.100, t_offset_s: 300}, {lat: 37.102, lng: -122.100, t_offset_s: 600}], start_lat: 37.100, start_lng: -122.100, end_lat: 37.102, end_lng: -122.100, idempotency_key: "obf-out" }
              as: Athlete
              as_user_id: "${ath_obf}"
              captures: { act_out: $.data.id }
          trigger:
            - call: "GET /v1/activities/${act_in}"
              as: Athlete
              as_user_id: "${ath_obf}"
              captures: { track_in: $.data.obfuscated_track }
            - call: "GET /v1/activities/${act_out}"
              as: Athlete
              as_user_id: "${ath_obf}"
              captures: { track_out: $.data.obfuscated_track }
          assert:
            - "Activity.${act_in}.obfuscated_track == [] (full_swallow variant)"
            - "Activity.${act_in}.obfuscated_start_lat == null and Activity.${act_in}.obfuscated_end_lat == null"
            - "Activity.${act_out}.obfuscated_track has length 3 (partial/base variant: no points inside the zone)"
            - "Activity.${act_out}.obfuscated_start_lat == 37.100"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (instances in DIFFERENT modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: speed_gate_mode_a
        grounds:
          - calculations.speed_and_vehicle_checks
          - entities.SegmentEffort.fields.flag_status
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (segment.distance_m, effort.elapsed_time_s,
          effective category) with non-linear interaction — tiered MAX_SPEED
          selection times an ASSIST_FACTOR multiplier and a conditional
          EBikeRide vehicle-assist branch — compared with a strict-< boundary.
        test_recipe:
          setup:
            - "Athlete R (owner/creator); athlete O (observer) exist"
            - "Segment S: RIDE, distance 500m, hazard_index 0, status ACTIVE"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "r_spd@x.com", display_name: "R Spd", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ath_spd: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "o_spd@x.com", display_name: "O Spd", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { obs_spd: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${ath_spd}", name: "Speed Gate 500", sport_type: "RIDE", start_lat: 37.50, start_lng: -122.50, end_lat: 37.505, end_lng: -122.50, distance_m: 500, city: "Speedtown" }
              as: Athlete
              as_user_id: "${ath_spd}"
              captures: { seg_spd: $.data.id }
            - call: "POST /v1/segments/${seg_spd}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ath_spd}"
          trigger:
            - call: "POST /v1/athletes/${obs_spd}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RIDE", started_at: "2026-09-01T10:00:00Z", duration_s: 17, distance_m: 500, track_points: [{lat: 37.50, lng: -122.50, t_offset_s: 0}, {lat: 37.505, lng: -122.50, t_offset_s: 17}], start_lat: 37.50, start_lng: -122.50, end_lat: 37.505, end_lng: -122.50, idempotency_key: "spd-fast", effort_hints: [{segment_id: "${seg_spd}", elapsed_time_s: 17, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${obs_spd}"
              captures: { act_fast: $.data.id }
            - call: "POST /v1/athletes/${obs_spd}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RIDE", started_at: "2026-09-01T11:00:00Z", duration_s: 18, distance_m: 500, track_points: [{lat: 37.50, lng: -122.50, t_offset_s: 0}, {lat: 37.505, lng: -122.50, t_offset_s: 18}], start_lat: 37.50, start_lng: -122.50, end_lat: 37.505, end_lng: -122.50, idempotency_key: "spd-edge", effort_hints: [{segment_id: "${seg_spd}", elapsed_time_s: 18, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${obs_spd}"
              captures: { act_edge: $.data.id }
            - call: "GET /v1/efforts?activity_id=${act_fast}"
              as: Athlete
              as_user_id: "${obs_spd}"
              captures: { fast_flag: "$.data[0].flag_status", fast_reason: "$.data[0].exclusion_reason" }
            - call: "GET /v1/efforts?activity_id=${act_edge}"
              as: Athlete
              as_user_id: "${obs_spd}"
              captures: { edge_flag: "$.data[0].flag_status", edge_speed: "$.data[0].avg_speed_kmh" }
          assert:
            - "SegmentEffort[activity ${act_fast}].flag_status == FLAGGED and exclusion_reason == SPEED_IMPOSSIBLE (17 < 500*3.6/80*0.8 == 18)"
            - "SegmentEffort[activity ${act_edge}].flag_status == ELIGIBLE (18 == expected_min boundary, strict <)"
            - "SegmentEffort[activity ${act_edge}].avg_speed_kmh == 100.0 (round_half_up(500/18*3.6, 2))"

      - name: route_load_mode_c
        grounds:
          - calculations.route_load_score
          - entities.RoutePlan.fields.estimated_load_score
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the +25 spike bonus keys on
          recent_distance_m which is itself an input to the base sum; the
          scaffold pins evaluation order (recent first, then raw, then bonus) so
          the value is well-defined. Different mode than speed_gate_mode_a (a).
        test_recipe:
          setup:
            - "Athlete L has an ACTIVE subscription (no free-tier cap)"
            - "Athlete L completed two RIDE activities of 60000m each: 2026-08-25 and 2026-08-28 (both inside the trailing 28 days before week_start 2026-09-07)"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "l_load@x.com", display_name: "L Load", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ath_load: $.data.id }
            - call: "POST /v1/athletes/${ath_load}/subscriptions"
              payload: { plan: "SUMMIT_MONTHLY", started_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z" }
              as: Athlete
              as_user_id: "${ath_load}"
            - call: "POST /v1/athletes/${ath_load}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-08-25T10:00:00Z", duration_s: 7200, distance_m: 60000, track_points: [{lat: 37.20, lng: -122.20, t_offset_s: 0}, {lat: 37.60, lng: -122.20, t_offset_s: 7200}], start_lat: 37.20, start_lng: -122.20, end_lat: 37.60, end_lng: -122.20, idempotency_key: "load-1" }
              as: Athlete
              as_user_id: "${ath_load}"
            - call: "POST /v1/athletes/${ath_load}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-08-28T10:00:00Z", duration_s: 7200, distance_m: 60000, track_points: [{lat: 37.20, lng: -122.20, t_offset_s: 0}, {lat: 37.60, lng: -122.20, t_offset_s: 7200}], start_lat: 37.20, start_lng: -122.20, end_lat: 37.60, end_lng: -122.20, idempotency_key: "load-2" }
              as: Athlete
              as_user_id: "${ath_load}"
          trigger:
            - call: "POST /v1/athletes/${ath_load}/route_plans"
              payload: { name: "Big Sunday", waypoints: [{lat: 37.20, lng: -122.20}, {lat: 38.20, lng: -122.20}], distance_m: 200000, week_start: "2026-09-07" }
              as: Athlete
              as_user_id: "${ath_load}"
              captures: { score_load: $.data.estimated_load_score }
          assert:
            - "RoutePlan.estimated_load_score == 285.0 (recent = 120000; raw = 200000/1000 + 120000/2000 = 260.0; 200000 > 120000*1.5 so +25 bonus; round_half_up(285.0, 1) == 285.0)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: activity_parallel_dimensions
        grounds:
          - state_machines.Activity
          - state_machines.Activity.flag_status
          - entities.Activity.fields.status
        distinguishing_aspect: |
          Parallel dimensions on ONE entity: Activity.status (lifecycle:
          PROCESSING -> COMPLETED) and Activity.flag_status (integrity:
          NONE -> FLAGGED -> CLEARED) evolve independently — a COMPLETED
          activity's flag axis still moves through FLAGGED and back to CLEARED
          on flag reject.
        test_recipe:
          setup:
            - "Athlete C (creator) and athlete F (flagger) exist"
            - "Segment SP: RUN, 1000m, ACTIVE"
            - "Athlete F uploaded a 100s RUN activity matching SP -> effort ELIGIBLE"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "c_par@x.com", display_name: "C Par", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ath_par: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "f_par@x.com", display_name: "F Par", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { flg_par: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${ath_par}", name: "Parallel Run 1k", sport_type: "RUN", start_lat: 37.60, start_lng: -122.60, end_lat: 37.61, end_lng: -122.60, distance_m: 1000, city: "Parville" }
              as: Athlete
              as_user_id: "${ath_par}"
              captures: { seg_par: $.data.id }
            - call: "POST /v1/segments/${seg_par}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ath_par}"
            - call: "POST /v1/athletes/${flg_par}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RUN", started_at: "2026-09-01T07:00:00Z", duration_s: 100, distance_m: 1000, track_points: [{lat: 37.60, lng: -122.60, t_offset_s: 0}, {lat: 37.61, lng: -122.60, t_offset_s: 100}], start_lat: 37.60, start_lng: -122.60, end_lat: 37.61, end_lng: -122.60, idempotency_key: "par-1", effort_hints: [{segment_id: "${seg_par}", elapsed_time_s: 100, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${flg_par}"
              captures: { act_par: $.data.id }
            - call: "GET /v1/efforts?activity_id=${act_par}"
              as: Athlete
              as_user_id: "${flg_par}"
              captures: { eff_par: "$.data[0].id" }
          trigger:
            - call: "POST /v1/efforts/${eff_par}/flags"
              payload: { reporter_id: "${ath_par}", reason: "IMPOSSIBLE_TIME" }
              as: Athlete
              as_user_id: "${ath_par}"
              captures: { flag_par: $.data.id }
            - call: "GET /v1/activities/${act_par}"
              as: Athlete
              as_user_id: "${flg_par}"
              captures: { st_par_1: $.data.status, fs_par_1: $.data.flag_status }
            - call: "POST /v1/flags/${flag_par}/reject"
              payload: {}
              as: Moderator
            - call: "GET /v1/activities/${act_par}"
              as: Athlete
              as_user_id: "${flg_par}"
              captures: { st_par_2: $.data.status, fs_par_2: $.data.flag_status }
          assert:
            - "After flag create: Activity.${act_par}.status == COMPLETED (lifecycle axis unmoved) and flag_status == FLAGGED (integrity axis moved)"
            - "After flag reject: Activity.${act_par}.status == COMPLETED and flag_status == CLEARED"
            - "SegmentEffort.${eff_par}.flag_status == ELIGIBLE after reject"

      - name: segment_cyclic_zero_effort
        grounds:
          - state_machines.Segment
          - entities.Segment.fields.effort_count
        distinguishing_aspect: |
          Cycle on a DIFFERENT entity (Segment): DRAFT -> ACTIVE -> RETIRED ->
          ACTIVE is permitted only while effort_count == 0; once an effort is
          recorded the RETIRED -> ACTIVE edge is closed forever (ERR_INVALID_STATE).
        test_recipe:
          setup:
            - "Athlete X owns segment A (never matched) and segment B (matched by one activity)"
            - "Segment A has been retired once already (cycle edge used)"
            - "Segment B is RETIRED with effort_count == 1"
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "x_cyc@x.com", display_name: "X Cyc", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ath_cyc: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "y_cyc@x.com", display_name: "Y Cyc", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rid_cyc: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${ath_cyc}", name: "Cycle A", sport_type: "RIDE", start_lat: 38.00, start_lng: -123.00, end_lat: 38.01, end_lng: -123.00, distance_m: 1000, city: "Cycville" }
              as: Athlete
              as_user_id: "${ath_cyc}"
              captures: { seg_a: $.data.id }
            - call: "POST /v1/segments/${seg_a}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ath_cyc}"
            - call: "POST /v1/segments/${seg_a}/retire"
              payload: {}
              as: Athlete
              as_user_id: "${ath_cyc}"
            - call: "POST /v1/segments"
              payload: { creator_id: "${ath_cyc}", name: "Cycle B", sport_type: "RIDE", start_lat: 38.10, start_lng: -123.10, end_lat: 38.11, end_lng: -123.10, distance_m: 1000, city: "Cycville" }
              as: Athlete
              as_user_id: "${ath_cyc}"
              captures: { seg_b: $.data.id }
            - call: "POST /v1/segments/${seg_b}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ath_cyc}"
            - call: "POST /v1/athletes/${rid_cyc}/activities"
              payload: { device_source: "wahoo-elemnt", sport_type: "RIDE", started_at: "2026-09-01T06:00:00Z", duration_s: 200, distance_m: 1000, track_points: [{lat: 38.10, lng: -123.10, t_offset_s: 0}, {lat: 38.11, lng: -123.10, t_offset_s: 200}], start_lat: 38.10, start_lng: -123.10, end_lat: 38.11, end_lng: -123.10, idempotency_key: "cyc-b1", effort_hints: [{segment_id: "${seg_b}", elapsed_time_s: 200, elevation_gain_m: 0}] }
              as: Athlete
              as_user_id: "${rid_cyc}"
            - call: "POST /v1/segments/${seg_b}/retire"
              payload: {}
              as: Athlete
              as_user_id: "${ath_cyc}"
          trigger:
            - call: "POST /v1/segments/${seg_a}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ath_cyc}"
              captures: { seg_a_state: $.data.status }
            - call: "POST /v1/segments/${seg_b}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ath_cyc}"
              captures: { err_b: $.data.error_id }
          assert:
            - "Segment.${seg_a}.status == ACTIVE (RETIRED -> ACTIVE allowed: effort_count == 0)"
            - "Segment.${seg_b} re-activate rejected with error_id == ERR_INVALID_STATE (effort_count == 1 closes the cycle)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: club_archive_three_hop_cascade
        grounds:
          - state_machines.Club
          - state_machines.Challenge
          - state_machines.ChallengeParticipation
        distinguishing_aspect: |
          Depth-3 chain from club archive: Club -> ARCHIVED mutates Challenge ->
          CANCELLED (hop 1), whose own cancellation transition withdraws every
          JOINED ChallengeParticipation -> WITHDRAWN (hop 2, caused by hop 1),
          freezing progress_value (hop 3 observable on a fourth entity).
        test_recipe:
          setup:
            - "Athlete AO owns club AC (OPEN); athlete AM is an ACTIVE member"
            - "Challenge ACH is ACTIVE (DISTANCE_M, goal 50000, window covering 2026-09-01)"
            - "AM has JOINED ACH and accumulated progress_value == 12000 from one activity"
          setup_api_calls:
