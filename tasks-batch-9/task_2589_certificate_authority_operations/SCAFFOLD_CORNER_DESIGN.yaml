              captures: { read_profile_status: $.data.status }
            - call: "GET /ca/revocation-requests"
              payload: {}
              as: VALIDATION_OFFICER
          assert:
            - "all five clock calls return HTTP 200 regardless of the calling role"
            - "the sixth trigger returns HTTP 200 with ${read_status} == ACTIVE"
            - "the seventh trigger returns HTTP 200 with ${read_profile_status} == DRAFT"
            - "the eighth trigger returns HTTP 200 with an empty list (total_count == 0) rather than 403, proving reads are not scoped by role"

      - name: the_vetting_approver_may_not_be_any_of_the_users_who_recorded_the_checks
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_VETTING_SOD_VIOLATION]
          - validations[priority=60]
          - endpoints[POST /ca/organization-vettings/{id}/approve]
        distinguishing_aspect: "The guard is by X-User-ID, not by role: the same human holding the VETTING_APPROVER role is refused when their user id appears in ANY of registry_checked_by_user_id / callback_checked_by_user_id / authority_checked_by_user_id, so both check recorders are blocked and only a third identity can approve. An implementation that compares roles instead of user ids, or that only checks the registry dimension, passes one of the two denials and fails."
        test_recipe:
          setup:
            - "One OV vetting in AWAITING_APPROVAL whose two required dimensions were recorded by two different users (u_val_1 registry, u_val_2 callback)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
