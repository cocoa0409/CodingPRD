scenario: |
  Generate task harder than expert level!

  2497. Carbon Sequestration Project Permitting (carbon capture and storage project developer): site
  characterization with geologic modeling, seal integrity assessment and plume migration simulation,
  injection well permitting with construction standards, testing and monitoring plan requirements, pore
  space acquisition through leases or unitization with landowner negotiation, area of review delineation
  with corrective action on legacy wellbores, monitoring, reporting and verification plan design with
  subsurface, surface and atmospheric methods, financial assurance for injection, post-injection site
  care and emergency remediation, tax credit qualification with secure geologic storage reporting and
  lifecycle analysis, post-injection site care duration and site closure certification

domain_name: carbon-sequestration-project-permitting
api_prefix: "/ccs"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is addressed as its own top-level collection under /ccs; parent linkage is by
  # foreign-key field in the request body, never by URL nesting. Child discovery is by sub-resource
  # GET or filtered list GET.

  state_machine_shape: parallel
  # InjectionWellPermit carries two independent state dimensions (permit_status x construction_status)
  # that advance on separate endpoints; StorageProject likewise carries status x operational_posture.
  # GeologicModel, PoreSpaceTract, MonitoringPlan and InjectionWellPermit all admit revision cycles.

  relationship_patterns:
    - one_to_many          # StorageProject -> GeologicModel / LegacyWellbore / PoreSpaceTract / ...
    - self_referential     # GeologicModel.supersedes_model_id -> GeologicModel.id
    - cross_aggregate      # TaxCreditClaim reads InjectionPeriodRecord rows that hang off a permit

  role_model: segregation_of_duties
  # The RegulatoryReviewer user id that performed a permit's technical review may not certify the same
  # project's closure; the IndependentVerifier user id that verifies a claim may not be the user id
  # that submitted it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: StorageProject
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: project name
        constraints: non-empty, max 200 chars
      - name: operator_name
        type: string
        source: input
        description: legal operator of record
        constraints: non-empty
      - name: basin_code
        type: string
        source: input
        description: geologic basin identifier
        constraints: non-empty, max 20 chars
      - name: total_project_acreage
        type: number
        source: input
        description: total pore-space acreage inside the project boundary
        constraints: "> 0"
      - name: requested_annual_injection_rate_tpy
        type: number
        source: input
        description: developer-requested annual injection rate in tonnes per year
        constraints: "> 0"
      - name: annual_monitoring_cost_usd
        type: number
        source: input
        description: baseline annual monitoring cost used by the financial-assurance calculation
        constraints: ">= 0"
      - name: required_consent_pct
        type: number
        source: input
        description: statutory pore-space consent percentage a unitization ruling must meet
        default: 60
        constraints: "0 < value <= 100"
      - name: ca_rig_slots
        type: integer
        source: input
        description: number of workover rigs available for overlapping corrective-action windows
        default: 2
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: permitting lifecycle dimension
        default: DRAFT
        constraints: "one of DRAFT, SITE_CHARACTERIZATION, PERMITTING, INJECTION_AUTHORIZED, INJECTION_ACTIVE, PISC, CLOSED"
      - name: operational_posture
        type: enum
        source: computed
        description: gating dimension derived from open remediation orders and assurance coverage
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: governing_geologic_model_id
        type: string
        source: computed
        description: >-
          Id of this project's GeologicModel whose status == ACCEPTED, or null when none exists.
          Selector: candidate set = GeologicModel rows with project_id == this project and
          status == ACCEPTED; at most one candidate ever exists because accepting a model drives the
          previously ACCEPTED model to SUPERSEDED in the same request; empty candidate set yields null.
        default: null
      - name: aor_radius_km
        type: number
        source: computed
        description: area-of-review radius copied from the governing model when its AoR is finalized
        default: 0
      - name: secured_acreage
        type: number
        source: computed
        description: net acreage held under PoreSpaceTract rows with lease_status IN {EXECUTED, UNITIZED}
        default: 0
      - name: outstanding_acreage
        type: number
        source: computed
        description: total_project_acreage minus secured_acreage
        default: 0
      - name: pore_space_consent_pct
        type: number
        source: computed
        description: 100 * secured_acreage / total_project_acreage
        default: 0
      - name: pore_space_bonus_total_usd
        type: number
        source: computed
        description: sum of per-tract rounded lease bonus settlements
        default: 0
      - name: unitization_status
        type: enum
        source: system
        description: statutory unitization petition dimension
        default: NOT_FILED
        constraints: "one of NOT_FILED, FILED, GRANTED, DENIED"
      - name: unitization_consent_pct_at_filing
        type: number
        source: system
        description: pore_space_consent_pct snapshotted when the petition was filed
        default: null
      - name: statutory_bonus_per_acre_usd
        type: number
        source: system
        description: per-acre bonus imposed on unitized tracts by a granted ruling
        default: null
      - name: corrective_action_completion_pct
        type: number
        source: computed
        description: percentage of in-AoR legacy wellbores whose corrective action is closed out
        default: 100
      - name: cumulative_stored_tonnes
        type: number
        source: computed
        description: ledger of net stored tonnes over InjectionPeriodRecord rows with status == ACCEPTED
        default: 0
      - name: pending_credit_usd
        type: number
        source: computed
        description: sum of credit_amount_usd over TaxCreditClaim rows with status IN {SUBMITTED, ALLOWED}
        default: 0
      - name: required_financial_assurance_usd
        type: number
        source: computed
        description: demonstration amount the project must have posted before injection is authorized
        default: 0
      - name: allocated_assurance_usd
        type: number
        source: computed
        description: sum of allocated bucket amounts over FinancialInstrument rows with status == ALLOCATED
        default: 0
      - name: assurance_coverage_status
        type: enum
        source: computed
        description: comparison of allocated_assurance_usd against required_financial_assurance_usd
        default: UNFUNDED
        constraints: "one of UNFUNDED, UNDERFUNDED, FUNDED"
      - name: effective_annual_monitoring_cost_usd
        type: number
        source: computed
        description: annual_monitoring_cost_usd, uplifted 15% while a MonitoringPlan of this project has status == APPROVED_WITH_CONDITIONS
        default: 0
      - name: pisc_duration_years
        type: integer
        source: computed
        description: post-injection site care duration in years
        default: 50
      - name: alternative_timeframe_years
        type: integer
        source: system
        description: developer-requested alternative post-injection site care duration, recorded at begin-pisc
        default: null
      - name: pisc_start_at
        type: datetime
        source: system
        description: logical-clock instant at which post-injection site care began
        default: null
      - name: pisc_elapsed_years
        type: number
        source: computed
        description: elapsed post-injection site care time in years, recomputed on every read of the project
        default: 0
      - name: non_endangerment_demonstrated
        type: boolean
        source: system
        description: non-endangerment attestation recorded from the certify-closure request body
        default: false
      - name: closure_status
        type: enum
        source: system
        description: site closure certification dimension
        default: NOT_REQUESTED
        constraints: "one of NOT_REQUESTED, CERTIFIED"
      - name: closure_certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that issued the closure certification
        default: null
      - name: closure_certified_at
        type: datetime
        source: system
        description: logical-clock instant of closure certification
        default: null
      - name: open_remediation_count
        type: integer
        source: computed
        description: count of RemediationOrder rows of this project with status == OPEN
        default: 0

  - name: GeologicModel
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project this site-characterization model describes
      - name: supersedes_model_id
        type: string
        source: input
        description: FK -> GeologicModel.id; the earlier model this revision replaces, null for the first model
        default: null
      - name: model_label
        type: string
        source: input
        description: developer label for this model revision
        constraints: non-empty
      - name: injection_zone_top_depth_m
        type: number
        source: input
        description: depth to top of the injection zone in metres
        constraints: "> 0"
      - name: injection_zone_thickness_m
        type: number
        source: input
        description: net thickness of the injection zone in metres
        constraints: "> 0"
      - name: seal_thickness_m
        type: number
        source: input
        description: best-estimate confining-zone thickness in metres
        constraints: "> 0"
      - name: capillary_entry_pressure_psi
        type: number
        source: input
        description: best-estimate seal capillary entry pressure in psi
        constraints: "> 0"
      - name: p10_seal_thickness_m
        type: number
        source: input
        description: conservative (P10) confining-zone thickness in metres
        constraints: "> 0"
      - name: p10_capillary_entry_pressure_psi
        type: number
        source: input
        description: conservative (P10) seal capillary entry pressure in psi
        constraints: "> 0"
      - name: reservoir_pressure_psi
        type: number
        source: input
        description: initial reservoir pressure in psi
        constraints: "> 0"
      - name: fracture_pressure_psi
        type: number
        source: input
        description: confining-zone fracture pressure in psi
        constraints: "> reservoir_pressure_psi"
      - name: permeability_md
        type: number
        source: input
        description: injection-zone permeability in millidarcy
        constraints: "> 0"
      - name: porosity_fraction
        type: number
        source: input
        description: injection-zone porosity as a fraction
        constraints: "0 < value < 1"
      - name: assessment_variant
        type: enum
        source: input
        description: which seal-integrity parameter set governs this model's classification
        default: DETERMINISTIC
        constraints: "one of DETERMINISTIC, PROBABILISTIC_P10"
      - name: seal_integrity_index
        type: number
        source: computed
        description: seal capacity divided by simulated pressure buildup under the DETERMINISTIC parameter set
        default: 0
      - name: seal_integrity_index_p10
        type: number
        source: computed
        description: same ratio under the PROBABILISTIC_P10 parameter set with its conservative safety factor
        default: 0
      - name: seal_classification
        type: enum
        source: computed
        description: banding of the index selected by assessment_variant
        default: FAIL
        constraints: "one of PASS, CONDITIONAL, FAIL"
      - name: max_injection_rate_tpy
        type: number
        source: computed
        description: largest annual rate whose pressure buildup stays inside the allowable fraction of fracture margin
        default: 0
      - name: effective_injection_rate_tpy
        type: number
        source: computed
        description: min(project.requested_annual_injection_rate_tpy, max_injection_rate_tpy)
        default: 0
      - name: injection_years
        type: integer
        source: system
        description: injection duration in years supplied to the plume simulation
        default: null
      - name: plume_radius_km
        type: number
        source: computed
        description: simulated free-phase plume radius in km
        default: 0
      - name: pressure_front_radius_km
        type: number
        source: computed
        description: simulated pressure-front radius in km
        default: 0
      - name: aor_radius_km
        type: number
        source: computed
        description: area-of-review radius derived from the two simulated radii
        default: 0
      - name: plume_status
        type: enum
        source: system
        description: plume-simulation dimension of this model
        default: NOT_RUN
        constraints: "one of NOT_RUN, SIMULATED, AOR_FINALIZED"
      - name: status
        type: enum
        source: system
        description: review lifecycle of this model revision
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVISION_REQUESTED, ACCEPTED, SUPERSEDED, REJECTED"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that last ruled on this model
        default: null
      - name: revision_round_count
        type: integer
        source: computed
        description: number of times this model has been submitted for review
        default: 0

  - name: LegacyWellbore
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project whose area of review is screened for this wellbore
      - name: api_number
        type: string
        source: input
        description: regulatory well identifier, unique inside a project
        constraints: non-empty, unique per project_id
      - name: distance_from_injector_km
        type: number
        source: input
        description: radial distance from the proposed injector in km
        constraints: ">= 0"
      - name: total_depth_m
        type: number
        source: input
        description: total wellbore depth in metres
        constraints: "> 0"
      - name: penetrates_seal
        type: boolean
        source: input
        description: whether the wellbore penetrates the confining zone
      - name: plug_condition
        type: enum
        source: input
        description: observed plugging condition
        constraints: "one of CEMENTED, PARTIALLY_PLUGGED, OPEN_HOLE, UNKNOWN"
      - name: plug_record_available
        type: boolean
        source: input
        description: whether a plugging record exists in the state archive
      - name: risk_score
        type: number
        source: computed
        description: weighted leakage-risk score in 0..100, recomputed whenever the project AoR radius changes
        default: 0
      - name: ca_cost_estimate_usd
        type: number
        source: computed
        description: corrective-action cost estimate derived from depth and risk_score
        default: 0
      - name: corrective_action_status
        type: enum
        source: system
        description: corrective-action lifecycle for this wellbore
        default: OUT_OF_AOR
        constraints: "one of OUT_OF_AOR, IDENTIFIED, CA_REQUIRED, CA_SCHEDULED, CA_COMPLETE, CA_WAIVED"
      - name: ca_window_start
        type: datetime
        source: system
        description: start of the scheduled corrective-action work window
        default: null
      - name: ca_window_end
        type: datetime
        source: system
        description: end of the scheduled corrective-action work window
        default: null
      - name: waiver_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that waived corrective action
        default: null

  - name: PoreSpaceTract
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project acquiring this tract's pore space
      - name: tract_label
        type: string
        source: input
        description: tract identifier
        constraints: non-empty, unique per project_id
      - name: acreage
        type: number
        source: input
        description: gross tract acreage
        constraints: "> 0"
      - name: ownership_pct
        type: number
        source: input
        description: undivided pore-space interest held by this landowner, in percent
        default: 100
        constraints: "0 < value <= 100"
      - name: landowner_user_id
        type: string
        source: input
        description: opaque X-User-ID of the Landowner entitled to negotiate this tract
        constraints: non-empty
      - name: lease_status
        type: enum
        source: system
        description: negotiation and acquisition lifecycle
        default: UNLEASED
        constraints: "one of UNLEASED, OFFER_SENT, COUNTERED, EXECUTED, UNITIZED, REJECTED, TERMINATED"
      - name: current_offer_bonus_per_acre_usd
        type: number
        source: system
        description: bonus per acre in the developer's outstanding offer
        default: null
      - name: current_offer_royalty_rate_pct
        type: number
        source: system
        description: royalty rate in the developer's outstanding offer
        default: null
      - name: counter_bonus_per_acre_usd
        type: number
        source: system
        description: bonus per acre in the landowner's outstanding counter
        default: null
      - name: executed_bonus_per_acre_usd
        type: number
        source: system
        description: bonus per acre locked when the lease was executed or the tract was unitized
        default: null
      - name: executed_royalty_rate_pct
        type: number
        source: system
        description: royalty rate locked when the lease was executed or the tract was unitized
        default: null
      - name: lease_term_start
        type: datetime
        source: system
        description: start of the executed lease term, half-open interval start
        default: null
      - name: lease_term_end
        type: datetime
        source: system
        description: end of the executed lease term, half-open interval end
        default: null
      - name: negotiation_round_count
        type: integer
        source: computed
        description: number of offers the developer has sent on this tract
        default: 0
      - name: bonus_settlement_usd
        type: number
        source: computed
        description: rounded per-tract bonus settlement, zero unless lease_status IN {EXECUTED, UNITIZED}
        default: 0
      - name: net_acreage
        type: number
        source: computed
        description: acreage * ownership_pct / 100
        default: 0

  - name: InjectionWellPermit
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project this Class VI injection well belongs to
      - name: geologic_model_id
        type: string
        source: input
        description: FK -> GeologicModel.id; the model revision this permit application relies on
      - name: well_name
        type: string
        source: input
        description: injector well name
        constraints: non-empty, unique per project_id
      - name: casing_program
        type: enum
        source: input
        description: declared casing and cementing program
        constraints: "one of LONG_STRING_CEMENTED_TO_SURFACE, LINER, SINGLE_STRING"
      - name: corrosion_resistant_material
        type: boolean
        source: input
        description: whether tubing and long-string casing use CO2-resistant material
      - name: tubing_packer_installed
        type: boolean
        source: input
        description: whether injection is through tubing set on a packer
        default: false
      - name: requested_injection_pressure_psi
        type: number
        source: input
        description: requested maximum surface injection pressure in psi
        constraints: "> 0"
      - name: max_injection_pressure_psi
        type: number
        source: computed
        description: 90% of the governing model's fracture pressure
        default: 0
      - name: authorized_injection_rate_tpy
        type: number
        source: computed
        description: rate authorized for this well, zero until the permit is ACTIVE
        default: 0
      - name: permit_status
        type: enum
        source: system
        description: permitting state dimension, independent of construction_status
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, TECHNICAL_REVIEW, REVISION_REQUESTED, APPROVED, ACTIVE, SUSPENDED, DENIED"
      - name: construction_status
        type: enum
        source: system
        description: construction state dimension, independent of permit_status
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, DRILLING, CASING_SET, CEMENT_LOGGED, MIT_PENDING, COMPLETED"
      - name: last_mit_type
        type: enum
        source: system
        description: test_type of the most recently recorded mechanical integrity test
        default: null
        constraints: "one of ANNULUS_PRESSURE, TEMPERATURE_LOG, CASING_INSPECTION_LOG"
      - name: last_mit_result
        type: enum
        source: computed
        description: PASS or FAIL verdict of the most recently recorded mechanical integrity test
        default: null
        constraints: "one of PASS, FAIL"
      - name: last_mit_at
        type: datetime
        source: system
        description: logical-clock instant of the most recently recorded mechanical integrity test
        default: null
      - name: mit_pass_count
        type: integer
        source: computed
        description: number of mechanical integrity tests recorded on this permit with a PASS verdict
        default: 0
      - name: technical_reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that opened technical review on this permit
        default: null
      - name: revision_round_count
        type: integer
        source: computed
        description: number of times this permit has been submitted for review
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant at which the permit became ACTIVE
        default: null

  - name: MonitoringPlan
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project this monitoring, reporting and verification plan covers
      - name: plan_label
        type: string
        source: input
        description: plan label
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: MRV plan review lifecycle with a revision cycle and a two-track review join
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVIEW_COMPLETE, REVISION_REQUESTED, APPROVED, APPROVED_WITH_CONDITIONS, REJECTED"
      - name: technical_review_complete
        type: boolean
        source: system
        description: whether the technical review track of the join has been closed
        default: false
      - name: public_comment_complete
        type: boolean
        source: system
        description: whether the public comment track of the join has been closed
        default: false
      - name: subsurface_subscore
        type: number
        source: computed
        description: capped sum of method scores over methods with domain == SUBSURFACE and status == ACTIVE
        default: 0
      - name: surface_subscore
        type: number
        source: computed
        description: capped sum of method scores over methods with domain == SURFACE and status == ACTIVE
        default: 0
      - name: atmospheric_subscore
        type: number
        source: computed
        description: capped sum of method scores over methods with domain == ATMOSPHERIC and status == ACTIVE
        default: 0
      - name: coverage_score
        type: number
        source: computed
        description: weighted MRV coverage score in 0..100
        default: 0
      - name: condition_count
        type: integer
        source: system
        description: number of conditions attached by an APPROVED_WITH_CONDITIONS ruling
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the RegulatoryReviewer that approved the plan
        default: null
      - name: revision_round_count
        type: integer
        source: computed
        description: number of times this plan has been submitted for review
        default: 0

  - name: MonitoringMethod
    parent: null
    common_fields: true
    fields:
      - name: monitoring_plan_id
        type: string
        source: input
        description: FK -> MonitoringPlan.id; the plan this method belongs to
      - name: domain
        type: enum
        source: input
        description: monitoring domain
        constraints: "one of SUBSURFACE, SURFACE, ATMOSPHERIC"
      - name: technique
        type: string
        source: input
        description: technique name, e.g. TIME_LAPSE_SEISMIC, SOIL_FLUX, EDDY_COVARIANCE
        constraints: non-empty
      - name: detection_threshold_tpy
        type: number
        source: input
        description: smallest leakage rate this method can detect, tonnes per year
        constraints: "> 0"
      - name: frequency_per_year
        type: integer
        source: input
        description: number of measurement campaigns per year
        constraints: ">= 1"
      - name: spatial_coverage_pct
        type: number
        source: input
        description: percentage of the area of review this method covers
        constraints: "0 < value <= 100"
      - name: method_score
        type: number
        source: computed
        description: per-method score in 0..1 combining coverage, frequency and detection factors
        default: 0
      - name: status
        type: enum
        source: system
        description: whether the method still contributes to the plan's subscores
        default: ACTIVE
        constraints: "one of ACTIVE, RETIRED"

  - name: FinancialInstrument
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project this financial assurance demonstration covers
      - name: instrument_type
        type: enum
        source: input
        description: instrument form
        constraints: "one of TRUST_FUND, SURETY_BOND, LETTER_OF_CREDIT, INSURANCE"
      - name: face_amount_usd
        type: number
        source: input
        description: face amount of the instrument
        constraints: "> 0"
      - name: allocated_ca_usd
        type: number
        source: computed
        description: amount allocated to the corrective-action bucket
        default: 0
      - name: allocated_plugging_usd
        type: number
        source: computed
        description: amount allocated to the injection-well plugging bucket
        default: 0
      - name: allocated_pisc_usd
        type: number
        source: computed
        description: amount allocated to the post-injection site care bucket
        default: 0
      - name: allocated_emergency_usd
        type: number
        source: computed
        description: amount allocated to the emergency remediation bucket
        default: 0
      - name: unallocated_usd
        type: number
        source: computed
        description: face_amount_usd minus the four allocated buckets
        default: 0
      - name: drawn_usd
        type: number
        source: computed
        description: amount drawn against the emergency bucket by remediation orders
        default: 0
      - name: status
        type: enum
        source: system
        description: instrument lifecycle
        default: POSTED
        constraints: "one of POSTED, ALLOCATED, DRAWN, RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant at which the instrument was released on site closure
        default: null

  - name: InjectionPeriodRecord
    parent: null
    common_fields: false
    fields:
      - name: permit_id
        type: string
        source: input
        description: FK -> InjectionWellPermit.id; the well this reporting period covers
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the reporting period, half-open interval start
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the reporting period, half-open interval end
        constraints: "> period_start"
      - name: mass_injected_tonnes
        type: number
        source: input
        description: mass injected during the period in tonnes
        constraints: ">= 0"
      - name: measured_leakage_tonnes
        type: number
        source: input
        description: leakage measured by MRV methods during the period in tonnes
        default: 0
        constraints: ">= 0 and <= mass_injected_tonnes"
      - name: net_stored_tonnes
        type: number
        source: computed
        description: mass_injected_tonnes minus measured_leakage_tonnes
        default: 0
      - name: status
        type: enum
        source: system
        description: whether this record still counts toward the secure-storage ledger
        default: ACCEPTED
        constraints: "one of ACCEPTED, VOIDED"
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant at which the record was voided
        default: null

  - name: TaxCreditClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project claiming the sequestration credit
      - name: monitoring_plan_id
        type: string
        source: input
        description: FK -> MonitoringPlan.id; the MRV plan whose approval underwrites the secure-storage report
      - name: tax_year
        type: integer
        source: input
        description: calendar tax year of the claim, unique per project
        constraints: "2020 <= value <= 2100, unique per project_id"
      - name: claim_variant
        type: enum
        source: input
        description: which tonnage basis this claim's credit amount uses
        default: REPORTED
        constraints: "one of REPORTED, VERIFIED"
      - name: lca_upstream_emissions_factor
        type: number
        source: input
        description: lifecycle-analysis upstream emissions, tonnes CO2e per tonne reported
        default: 0
        constraints: "0 <= value <= 0.5"
      - name: reported_tonnes
        type: number
        source: computed
        description: self-reported injected mass inside the tax year
        default: 0
      - name: verified_tonnes
        type: number
        source: computed
        description: reported mass net of measured leakage and the lifecycle-analysis deduction
        default: 0
      - name: credit_rate_usd_per_tonne
        type: number
        source: computed
        description: tiered credit rate selected from the project's cumulative stored tonnage
        default: 0
      - name: credit_amount_usd
        type: number
        source: computed
        description: credit dollars for the tonnage basis named by claim_variant
        default: 0
      - name: status
        type: enum
        source: system
        description: claim lifecycle, revertible to DRAFT by a permit suspension cascade
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, ALLOWED, DISALLOWED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProjectDeveloper that submitted the claim
        default: null
      - name: verifier_user_id
        type: string
        source: system
        description: X-User-ID of the IndependentVerifier that ruled on the claim
        default: null

  - name: RemediationOrder
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: FK -> StorageProject.id; the project under emergency remediation
      - name: trigger_type
        type: enum
        source: input
        description: observed condition that opened the order
        constraints: "one of SEAL_BREACH_INDICATION, WELL_INTEGRITY_LOSS, PLUME_EXCURSION, GROUNDWATER_IMPACT"
      - name: severity
        type: enum
        source: input
        description: severity band driving the posture and draw side effects
        constraints: "one of MINOR, MAJOR, CRITICAL"
      - name: narrative
        type: string
        source: input
        description: free-text description of the event
        constraints: non-empty
      - name: reserve_draw_usd
        type: number
        source: computed
        description: dollars drawn from the emergency bucket when severity == CRITICAL, else 0
        default: 0
      - name: status
        type: enum
        source: system
        description: remediation lifecycle
        default: OPEN
        constraints: "one of OPEN, RESOLVED"
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant at which the order was opened
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant at which the order was resolved
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------- project
  - entity: StorageProject
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: >-
      StorageProject carries two independent state dimensions. `status` is the permitting lifecycle
      below. `operational_posture` is a separate dimension driven only by remediation orders and
      assurance coverage; its transitions are listed as OPEN/RESTRICTED/FROZEN rows further down and
      they may fire from any `status` value without changing `status`.
    transitions:
      - from: DRAFT
        to: SITE_CHARACTERIZATION
        trigger: "system: first POST /ccs/geologic-models/{id}/submit for this project"
        actor: system
        preconditions: ["project.status == DRAFT"]
        side_effects:
          - "sets StorageProject.status = SITE_CHARACTERIZATION"
          - "increments StorageProject.version by 1"
      - from: SITE_CHARACTERIZATION
        to: PERMITTING
        trigger: "system: POST /ccs/geologic-models/{id}/review with decision == ACCEPT"
        actor: system
        preconditions: ["project.status == SITE_CHARACTERIZATION"]
        side_effects:
          - "sets StorageProject.status = PERMITTING"
          - "sets StorageProject.governing_geologic_model_id = the accepted model id"
          - "increments StorageProject.version by 1"
      - from: PERMITTING
        to: INJECTION_AUTHORIZED
        trigger: "POST /ccs/storage-projects/{id}/authorize-injection"
        actor: RegulatoryReviewer
        preconditions:
          - "project.status == PERMITTING"
          - "project.operational_posture == OPEN"
          - "project.governing_geologic_model_id is not null and that model's seal_classification IN {PASS, CONDITIONAL}"
          - "project.aor_radius_km > 0"
          - "at least one InjectionWellPermit of this project has permit_status == APPROVED"
          - "some MonitoringPlan of this project has status IN {APPROVED, APPROVED_WITH_CONDITIONS}"
          - "project.corrective_action_completion_pct == 100"
          - "project.pore_space_consent_pct >= project.required_consent_pct OR project.unitization_status == GRANTED"
          - "project.assurance_coverage_status == FUNDED"
        side_effects:
          - "sets StorageProject.status = INJECTION_AUTHORIZED"
          - "increments StorageProject.version by 1"
      - from: INJECTION_AUTHORIZED
        to: INJECTION_ACTIVE
        trigger: "system: first POST /ccs/injection-well-permits/{id}/activate for this project"
        actor: system
        preconditions: ["project.status == INJECTION_AUTHORIZED"]
        side_effects:
          - "sets StorageProject.status = INJECTION_ACTIVE"
          - "increments StorageProject.version by 1"
      - from: INJECTION_ACTIVE
        to: PISC
        trigger: "POST /ccs/storage-projects/{id}/begin-pisc"
        actor: ProjectDeveloper
        preconditions:
          - "project.status == INJECTION_ACTIVE"
          - "project.operational_posture != FROZEN"
          - "no InjectionWellPermit of this project has permit_status == ACTIVE with construction_status != COMPLETED"
        side_effects:
          - "sets StorageProject.pisc_start_at = logical clock now"
          - "records StorageProject.alternative_timeframe_years from the request body when supplied"
          - "recomputes StorageProject.pisc_duration_years per calculations.pisc_duration_years"
          - "sets StorageProject.status = PISC"
          - "sets every InjectionWellPermit of this project with permit_status == ACTIVE to permit_status = SUSPENDED and authorized_injection_rate_tpy = 0"
          - "increments StorageProject.version by 1"
      - from: PISC
        to: CLOSED
        trigger: "POST /ccs/storage-projects/{id}/certify-closure"
        actor: RegulatoryReviewer
        preconditions:
          - "project.status == PISC"
          - "no RemediationOrder of this project has status == OPEN"
          - "project.pisc_elapsed_years >= project.pisc_duration_years"
          - "request body non_endangerment_demonstrated == true"
          - "X-User-ID differs from technical_reviewer_user_id of every InjectionWellPermit of this project"
        side_effects:
          - "sets StorageProject.non_endangerment_demonstrated = true"
          - "sets StorageProject.closure_status = CERTIFIED, closure_certified_by_user_id = X-User-ID, closure_certified_at = clock now"
          - "sets StorageProject.status = CLOSED"
          - "sets every FinancialInstrument of this project with status == ALLOCATED to status = RELEASED, released_at = clock now, and zeroes its four allocated buckets back into unallocated_usd"
          - "recomputes StorageProject.allocated_assurance_usd = 0 and assurance_coverage_status = UNFUNDED"
          - "increments StorageProject.version by 1"
      # ---- operational_posture dimension (independent of status) ----
      - from: "operational_posture=OPEN"
        to: "operational_posture=FROZEN"
        trigger: "system: POST /ccs/remediation-orders with severity IN {MAJOR, CRITICAL}"
        actor: system
        preconditions: ["project.operational_posture != FROZEN"]
        side_effects:
          - "sets StorageProject.operational_posture = FROZEN"
          - "increments StorageProject.open_remediation_count by 1"
          - "cascade link 2: every InjectionWellPermit of this project with permit_status == ACTIVE goes ACTIVE -> SUSPENDED with authorized_injection_rate_tpy = 0"
          - "increments StorageProject.version by 1"
      - from: "operational_posture=FROZEN"
        to: "operational_posture=OPEN"
        trigger: "POST /ccs/remediation-orders/{id}/resolve"
        actor: RegulatoryReviewer
        preconditions:
          - "order.status == OPEN"
          - "after decrementing, project.open_remediation_count == 0"
        side_effects:
          - "sets StorageProject.operational_posture = OPEN when open_remediation_count reaches 0 and assurance_coverage_status == FUNDED, else RESTRICTED"
          - "restores every InjectionWellPermit of this project with permit_status == SUSPENDED to permit_status = ACTIVE with authorized_injection_rate_tpy = governing model effective_injection_rate_tpy"
          - "increments StorageProject.version by 1"
      - from: "operational_posture=OPEN"
        to: "operational_posture=RESTRICTED"
        trigger: "system: any recomputation of required_financial_assurance_usd that leaves assurance_coverage_status == UNDERFUNDED while project.status IN {INJECTION_AUTHORIZED, INJECTION_ACTIVE}"
        actor: system
        preconditions: ["project.operational_posture == OPEN", "project.status IN {INJECTION_AUTHORIZED, INJECTION_ACTIVE}"]
        side_effects:
          - "sets StorageProject.operational_posture = RESTRICTED"
          - "increments StorageProject.version by 1"
      - from: "operational_posture=RESTRICTED"
        to: "operational_posture=OPEN"
        trigger: "system: any recomputation that leaves assurance_coverage_status == FUNDED with open_remediation_count == 0"
        actor: system
        preconditions: ["project.operational_posture == RESTRICTED"]
        side_effects:
          - "sets StorageProject.operational_posture = OPEN"
          - "increments StorageProject.version by 1"
      # ---- unitization dimension ----
      - from: "unitization_status=NOT_FILED"
        to: "unitization_status=FILED"
        trigger: "POST /ccs/storage-projects/{id}/unitization-petition"
        actor: ProjectDeveloper
        preconditions:
          - "project.unitization_status == NOT_FILED"
          - "project.status IN {SITE_CHARACTERIZATION, PERMITTING}"
        side_effects:
          - "sets StorageProject.unitization_consent_pct_at_filing = project.pore_space_consent_pct"
          - "sets StorageProject.unitization_status = FILED"
          - "increments StorageProject.version by 1"
      - from: "unitization_status=FILED"
        to: "unitization_status=GRANTED"
        trigger: "POST /ccs/storage-projects/{id}/unitization-ruling with decision == GRANT"
        actor: RegulatoryReviewer
        preconditions:
          - "project.unitization_status == FILED"
          - "project.pore_space_consent_pct >= project.required_consent_pct"
        side_effects:
          - "sets StorageProject.statutory_bonus_per_acre_usd from the request body"
          - "sets every PoreSpaceTract of this project with lease_status IN {UNLEASED, REJECTED} to lease_status = UNITIZED with executed_bonus_per_acre_usd = statutory_bonus_per_acre_usd and executed_royalty_rate_pct = the ruling's royalty rate"
          - "recomputes each affected tract's bonus_settlement_usd and net_acreage"
          - "recomputes StorageProject.secured_acreage, outstanding_acreage, pore_space_consent_pct, pore_space_bonus_total_usd"
          - "sets StorageProject.unitization_status = GRANTED"
          - "increments StorageProject.version by 1"
      - from: "unitization_status=FILED"
        to: "unitization_status=DENIED"
        trigger: "POST /ccs/storage-projects/{id}/unitization-ruling with decision == DENY"
        actor: RegulatoryReviewer
        preconditions: ["project.unitization_status == FILED"]
        side_effects:
          - "sets StorageProject.unitization_status = DENIED"
          - "increments StorageProject.version by 1"

  # ---------------------------------------------------------- geologic model
  - entity: GeologicModel
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    note: >-
      Cyclic review: REVISION_REQUESTED returns to SUBMITTED, and revision_round_count grows by one on
      every submit. `plume_status` is a second dimension (NOT_RUN -> SIMULATED -> AOR_FINALIZED)
      advanced by its own endpoints.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ccs/geologic-models/{id}/submit"
        actor: ProjectDeveloper
        preconditions:
          - "model.status IN {DRAFT, REVISION_REQUESTED}"
          - "model.plume_status IN {SIMULATED, AOR_FINALIZED}"
          - "project.operational_posture != FROZEN"
        side_effects:
          - "increments GeologicModel.revision_round_count by 1"
          - "sets GeologicModel.status = SUBMITTED"
          - "drives StorageProject DRAFT -> SITE_CHARACTERIZATION when project.status == DRAFT"
          - "increments GeologicModel.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /ccs/geologic-models/{id}/review with decision == REQUEST_REVISION"
        actor: RegulatoryReviewer
        preconditions: ["model.status == SUBMITTED"]
        side_effects:
          - "sets GeologicModel.status = REVISION_REQUESTED, reviewer_user_id = X-User-ID"
          - "increments GeologicModel.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /ccs/geologic-models/{id}/submit"
        actor: ProjectDeveloper
        preconditions: ["model.status == REVISION_REQUESTED", "model.plume_status IN {SIMULATED, AOR_FINALIZED}"]
        side_effects:
          - "increments GeologicModel.revision_round_count by 1"
          - "sets GeologicModel.status = SUBMITTED"
          - "increments GeologicModel.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /ccs/geologic-models/{id}/review with decision == ACCEPT"
        actor: RegulatoryReviewer
        preconditions:
          - "model.status == SUBMITTED"
          - "model.seal_classification IN {PASS, CONDITIONAL}"
        side_effects:
          - "sets GeologicModel.status = ACCEPTED, reviewer_user_id = X-User-ID"
          - "sets the project's previously ACCEPTED model, if any, to status = SUPERSEDED"
          - "sets StorageProject.governing_geologic_model_id = this model id"
          - "drives StorageProject SITE_CHARACTERIZATION -> PERMITTING"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status"
          - "increments GeologicModel.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ccs/geologic-models/{id}/review with decision == REJECT"
        actor: RegulatoryReviewer
        preconditions: ["model.status == SUBMITTED"]
        side_effects:
          - "sets GeologicModel.status = REJECTED, reviewer_user_id = X-User-ID"
          - "increments GeologicModel.version by 1"
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a later model of the same project reaches ACCEPTED"
        actor: system
        preconditions: ["model.status == ACCEPTED"]
        side_effects:
          - "sets GeologicModel.status = SUPERSEDED"
          - "increments GeologicModel.version by 1"
      # ---- plume_status dimension ----
      - from: "plume_status=NOT_RUN"
        to: "plume_status=SIMULATED"
        trigger: "POST /ccs/geologic-models/{id}/run-plume-simulation"
        actor: ProjectDeveloper
        preconditions:
          - "model.status IN {DRAFT, REVISION_REQUESTED}"
          - "request body injection_years >= 1"
        side_effects:
          - "sets GeologicModel.injection_years from the request body"
          - "computes max_injection_rate_tpy, effective_injection_rate_tpy, plume_radius_km, pressure_front_radius_km, aor_radius_km per calculations.plume_and_aor_radii"
          - "computes seal_integrity_index, seal_integrity_index_p10, seal_classification per calculations.seal_integrity_index"
          - "sets GeologicModel.plume_status = SIMULATED"
          - "increments GeologicModel.version by 1"
      - from: "plume_status=SIMULATED"
        to: "plume_status=AOR_FINALIZED"
        trigger: "POST /ccs/geologic-models/{id}/finalize-aor"
        actor: ProjectDeveloper
        preconditions:
          - "model.status == ACCEPTED"
          - "model.plume_status == SIMULATED"
          - "project.operational_posture != FROZEN"
        side_effects:
          - "cascade link 1: sets StorageProject.aor_radius_km = model.aor_radius_km"
          - "cascade link 2: because aor_radius_km changed, every LegacyWellbore of the project with corrective_action_status == OUT_OF_AOR and distance_from_injector_km <= project.aor_radius_km moves OUT_OF_AOR -> IDENTIFIED, and every in-AoR wellbore's risk_score and ca_cost_estimate_usd are recomputed"
          - "cascade link 2b: each wellbore that just reached IDENTIFIED and has penetrates_seal == true OR risk_score >= 40.00 auto-advances IDENTIFIED -> CA_REQUIRED"
          - "cascade link 3: because the CA_REQUIRED population changed, StorageProject.corrective_action_completion_pct and required_financial_assurance_usd are recomputed"
          - "cascade link 4: because required_financial_assurance_usd changed, StorageProject.allocated_assurance_usd is re-compared and assurance_coverage_status is set to FUNDED or UNDERFUNDED; when the result is UNDERFUNDED and project.status IN {INJECTION_AUTHORIZED, INJECTION_ACTIVE}, operational_posture goes OPEN -> RESTRICTED"
          - "sets GeologicModel.plume_status = AOR_FINALIZED"
          - "increments GeologicModel.version by 1 and StorageProject.version by 1"

  # -------------------------------------------------------- legacy wellbore
  - entity: LegacyWellbore
    initial_state: OUT_OF_AOR
    terminal_states: [CA_COMPLETE, CA_WAIVED]
    transitions:
      - from: OUT_OF_AOR
        to: IDENTIFIED
        trigger: "system: POST /ccs/geologic-models/{id}/finalize-aor expands project.aor_radius_km to cover this wellbore"
        actor: system
        preconditions:
          - "wellbore.corrective_action_status == OUT_OF_AOR"
          - "wellbore.distance_from_injector_km <= project.aor_radius_km"
        side_effects:
          - "recomputes LegacyWellbore.risk_score and ca_cost_estimate_usd"
          - "sets LegacyWellbore.corrective_action_status = IDENTIFIED"
          - "increments LegacyWellbore.version by 1"
      - from: IDENTIFIED
        to: CA_REQUIRED
        trigger: "system: screening immediately after IDENTIFIED"
        actor: system
        preconditions: ["wellbore.penetrates_seal == true OR wellbore.risk_score >= 40.00"]
        side_effects:
          - "sets LegacyWellbore.corrective_action_status = CA_REQUIRED"
          - "recomputes StorageProject.corrective_action_completion_pct and required_financial_assurance_usd"
          - "increments LegacyWellbore.version by 1"
      - from: CA_REQUIRED
        to: CA_SCHEDULED
        trigger: "POST /ccs/legacy-wellbores/{id}/schedule-corrective-action"
        actor: ProjectDeveloper
        preconditions:
          - "wellbore.corrective_action_status == CA_REQUIRED"
          - "project.operational_posture != FROZEN"
          - "request window_end > window_start"
          - "count of sibling LegacyWellbore rows of the same project with corrective_action_status == CA_SCHEDULED whose closed window [ca_window_start, ca_window_end] intersects the requested closed window is < project.ca_rig_slots"
        side_effects:
          - "sets LegacyWellbore.ca_window_start and ca_window_end from the request body"
          - "sets LegacyWellbore.corrective_action_status = CA_SCHEDULED"
          - "increments LegacyWellbore.version by 1"
      - from: CA_SCHEDULED
        to: CA_COMPLETE
        trigger: "POST /ccs/legacy-wellbores/{id}/complete-corrective-action"
        actor: ProjectDeveloper
        preconditions:
          - "wellbore.corrective_action_status == CA_SCHEDULED"
          - "logical clock now >= wellbore.ca_window_start"
        side_effects:
          - "sets LegacyWellbore.corrective_action_status = CA_COMPLETE"
          - "recomputes StorageProject.corrective_action_completion_pct"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status"
          - "increments LegacyWellbore.version by 1 and StorageProject.version by 1"
      - from: CA_REQUIRED
        to: CA_WAIVED
        trigger: "POST /ccs/legacy-wellbores/{id}/waive-corrective-action"
        actor: RegulatoryReviewer
        preconditions:
          - "wellbore.corrective_action_status == CA_REQUIRED"
          - "wellbore.penetrates_seal == false"
          - "wellbore.risk_score <= 60.00"
        side_effects:
          - "sets LegacyWellbore.corrective_action_status = CA_WAIVED, waiver_reviewer_user_id = X-User-ID"
          - "recomputes StorageProject.corrective_action_completion_pct"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status"
          - "increments LegacyWellbore.version by 1 and StorageProject.version by 1"

  # -------------------------------------------------------- pore space tract
  - entity: PoreSpaceTract
    initial_state: UNLEASED
    terminal_states: [TERMINATED]
    note: "Cyclic negotiation: OFFER_SENT -> COUNTERED -> OFFER_SENT repeats until the landowner accepts or rejects."
    transitions:
      - from: UNLEASED
        to: OFFER_SENT
        trigger: "POST /ccs/pore-space-tracts/{id}/offers"
        actor: ProjectDeveloper
        preconditions:
          - "tract.lease_status IN {UNLEASED, COUNTERED}"
          - "request expected_tract_version == tract.version"
          - "project.operational_posture != FROZEN"
        side_effects:
          - "sets PoreSpaceTract.current_offer_bonus_per_acre_usd and current_offer_royalty_rate_pct from the request body"
          - "increments PoreSpaceTract.negotiation_round_count by 1"
          - "sets PoreSpaceTract.lease_status = OFFER_SENT"
          - "increments PoreSpaceTract.version by 1"
      - from: COUNTERED
        to: OFFER_SENT
        trigger: "POST /ccs/pore-space-tracts/{id}/offers"
        actor: ProjectDeveloper
        preconditions:
          - "tract.lease_status == COUNTERED"
          - "request expected_tract_version == tract.version"
        side_effects:
          - "clears PoreSpaceTract.counter_bonus_per_acre_usd to null"
          - "sets current_offer_bonus_per_acre_usd and current_offer_royalty_rate_pct from the request body"
          - "increments PoreSpaceTract.negotiation_round_count by 1"
          - "sets PoreSpaceTract.lease_status = OFFER_SENT"
          - "increments PoreSpaceTract.version by 1"
      - from: OFFER_SENT
        to: COUNTERED
        trigger: "POST /ccs/pore-space-tracts/{id}/respond with response == COUNTER"
        actor: Landowner
        preconditions:
          - "tract.lease_status == OFFER_SENT"
          - "X-User-ID == tract.landowner_user_id"
          - "request counter_bonus_per_acre_usd > tract.current_offer_bonus_per_acre_usd"
        side_effects:
          - "sets PoreSpaceTract.counter_bonus_per_acre_usd from the request body"
          - "sets PoreSpaceTract.lease_status = COUNTERED"
          - "increments PoreSpaceTract.version by 1"
      - from: OFFER_SENT
        to: EXECUTED
        trigger: "POST /ccs/pore-space-tracts/{id}/respond with response == ACCEPT"
        actor: Landowner
        preconditions:
          - "tract.lease_status == OFFER_SENT"
          - "X-User-ID == tract.landowner_user_id"
          - "request lease_term_end > lease_term_start"
        side_effects:
          - "sets executed_bonus_per_acre_usd = current_offer_bonus_per_acre_usd, executed_royalty_rate_pct = current_offer_royalty_rate_pct"
          - "sets lease_term_start and lease_term_end from the request body"
          - "computes PoreSpaceTract.net_acreage and bonus_settlement_usd per calculations.pore_space_bonus_settlement"
          - "sets PoreSpaceTract.lease_status = EXECUTED"
          - "recomputes StorageProject.secured_acreage, outstanding_acreage, pore_space_consent_pct, pore_space_bonus_total_usd"
          - "increments PoreSpaceTract.version by 1 and StorageProject.version by 1"
      - from: OFFER_SENT
        to: REJECTED
        trigger: "POST /ccs/pore-space-tracts/{id}/respond with response == REJECT"
        actor: Landowner
        preconditions:
          - "tract.lease_status == OFFER_SENT"
          - "X-User-ID == tract.landowner_user_id"
        side_effects:
          - "clears current_offer_bonus_per_acre_usd and current_offer_royalty_rate_pct to null"
          - "sets PoreSpaceTract.lease_status = REJECTED"
          - "increments PoreSpaceTract.version by 1"
      - from: UNLEASED
        to: UNITIZED
        trigger: "system: POST /ccs/storage-projects/{id}/unitization-ruling with decision == GRANT"
        actor: system
        preconditions: ["tract.lease_status IN {UNLEASED, REJECTED}"]
        side_effects:
          - "sets executed_bonus_per_acre_usd = project.statutory_bonus_per_acre_usd and executed_royalty_rate_pct = the ruling royalty rate"
          - "computes net_acreage and bonus_settlement_usd"
          - "sets PoreSpaceTract.lease_status = UNITIZED"
          - "increments PoreSpaceTract.version by 1"
      - from: REJECTED
        to: UNITIZED
        trigger: "system: POST /ccs/storage-projects/{id}/unitization-ruling with decision == GRANT"
        actor: system
        preconditions: ["tract.lease_status == REJECTED"]
        side_effects:
          - "sets executed_bonus_per_acre_usd = project.statutory_bonus_per_acre_usd and executed_royalty_rate_pct = the ruling royalty rate"
          - "computes net_acreage and bonus_settlement_usd"
          - "sets PoreSpaceTract.lease_status = UNITIZED"
          - "increments PoreSpaceTract.version by 1"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /ccs/pore-space-tracts/{id}/terminate-lease"
        actor: ProjectDeveloper
        preconditions:
          - "tract.lease_status == EXECUTED"
          - "project.status IN {DRAFT, SITE_CHARACTERIZATION, PERMITTING}"
        side_effects:
          - "clears executed_bonus_per_acre_usd, executed_royalty_rate_pct, lease_term_start, lease_term_end to null"
          - "sets PoreSpaceTract.bonus_settlement_usd = 0 and net_acreage = 0"
          - "sets PoreSpaceTract.lease_status = TERMINATED"
          - "recomputes StorageProject.secured_acreage, outstanding_acreage, pore_space_consent_pct, pore_space_bonus_total_usd"
          - "increments PoreSpaceTract.version by 1 and StorageProject.version by 1"

  # --------------------------------------------------- injection well permit
  - entity: InjectionWellPermit
    initial_state: DRAFT
    terminal_states: [DENIED]
    note: >-
      Two independent dimensions on one row. `permit_status` is the regulatory track with a revision
      cycle (TECHNICAL_REVIEW -> REVISION_REQUESTED -> SUBMITTED). `construction_status` is the physical
      track advanced only by advance-construction. Activation is the single point where both dimensions
      must agree.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ccs/injection-well-permits/{id}/submit"
        actor: ProjectDeveloper
        preconditions:
          - "permit.permit_status IN {DRAFT, REVISION_REQUESTED}"
          - "permit.casing_program == LONG_STRING_CEMENTED_TO_SURFACE"
          - "permit.corrosion_resistant_material == true"
          - "permit.tubing_packer_installed == true"
          - "project.aor_radius_km > 0"
          - "permit.requested_injection_pressure_psi <= permit.max_injection_pressure_psi"
        side_effects:
          - "increments InjectionWellPermit.revision_round_count by 1"
          - "sets InjectionWellPermit.permit_status = SUBMITTED"
          - "increments InjectionWellPermit.version by 1"
      - from: SUBMITTED
        to: TECHNICAL_REVIEW
        trigger: "POST /ccs/injection-well-permits/{id}/review with decision == BEGIN_TECHNICAL_REVIEW"
        actor: RegulatoryReviewer
        preconditions:
          - "permit.permit_status == SUBMITTED"
          - "the referenced GeologicModel has status == ACCEPTED"
          - "the referenced GeologicModel has seal_classification != FAIL"
        side_effects:
          - "sets InjectionWellPermit.technical_reviewer_user_id = X-User-ID"
          - "sets InjectionWellPermit.permit_status = TECHNICAL_REVIEW"
          - "increments InjectionWellPermit.version by 1"
      - from: TECHNICAL_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /ccs/injection-well-permits/{id}/review with decision == REQUEST_REVISION"
        actor: RegulatoryReviewer
        preconditions: ["permit.permit_status == TECHNICAL_REVIEW"]
        side_effects:
          - "sets InjectionWellPermit.permit_status = REVISION_REQUESTED"
          - "increments InjectionWellPermit.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /ccs/injection-well-permits/{id}/submit"
        actor: ProjectDeveloper
        preconditions: ["permit.permit_status == REVISION_REQUESTED"]
        side_effects:
          - "increments InjectionWellPermit.revision_round_count by 1"
          - "sets InjectionWellPermit.permit_status = SUBMITTED"
          - "increments InjectionWellPermit.version by 1"
      - from: TECHNICAL_REVIEW
        to: APPROVED
        trigger: "POST /ccs/injection-well-permits/{id}/review with decision == APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "permit.permit_status == TECHNICAL_REVIEW"
          - "project.corrective_action_completion_pct == 100"
        side_effects:
          - "sets InjectionWellPermit.permit_status = APPROVED"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status"
          - "increments InjectionWellPermit.version by 1 and StorageProject.version by 1"
      - from: TECHNICAL_REVIEW
        to: DENIED
        trigger: "POST /ccs/injection-well-permits/{id}/review with decision == DENY"
        actor: RegulatoryReviewer
        preconditions: ["permit.permit_status == TECHNICAL_REVIEW"]
        side_effects:
          - "sets InjectionWellPermit.permit_status = DENIED"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status"
          - "increments InjectionWellPermit.version by 1 and StorageProject.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /ccs/injection-well-permits/{id}/activate"
        actor: RegulatoryReviewer
        preconditions:
          - "permit.permit_status == APPROVED"
          - "permit.construction_status == COMPLETED"
          - "permit.last_mit_result == PASS"
          - "project.status IN {INJECTION_AUTHORIZED, INJECTION_ACTIVE}"
          - "project.operational_posture != FROZEN"
          - "project.assurance_coverage_status == FUNDED"
        side_effects:
          - "sets InjectionWellPermit.authorized_injection_rate_tpy = governing model effective_injection_rate_tpy"
          - "sets InjectionWellPermit.activated_at = clock now"
          - "sets InjectionWellPermit.permit_status = ACTIVE"
          - "drives StorageProject INJECTION_AUTHORIZED -> INJECTION_ACTIVE on the first activation"
          - "increments InjectionWellPermit.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: project.operational_posture becomes FROZEN, or POST /ccs/storage-projects/{id}/begin-pisc"
        actor: system
        preconditions: ["permit.permit_status == ACTIVE"]
        side_effects:
          - "sets InjectionWellPermit.authorized_injection_rate_tpy = 0"
          - "sets InjectionWellPermit.permit_status = SUSPENDED"
          - "cascade link 3: because this permit left ACTIVE, every TaxCreditClaim of the project with status == SUBMITTED reverts SUBMITTED -> DRAFT"
          - "increments InjectionWellPermit.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: POST /ccs/remediation-orders/{id}/resolve clears the last open order"
        actor: system
        preconditions:
          - "permit.permit_status == SUSPENDED"
          - "project.open_remediation_count == 0 after the resolve"
          - "project.status == INJECTION_ACTIVE"
        side_effects:
          - "sets InjectionWellPermit.authorized_injection_rate_tpy = governing model effective_injection_rate_tpy"
          - "sets InjectionWellPermit.permit_status = ACTIVE"
          - "increments InjectionWellPermit.version by 1"
      # ---- construction_status dimension ----
      - from: "construction_status=NOT_STARTED"
        to: "construction_status=DRILLING"
        trigger: "POST /ccs/injection-well-permits/{id}/advance-construction with to_construction_status == DRILLING"
        actor: ProjectDeveloper
        preconditions:
          - "permit.construction_status == NOT_STARTED"
          - "permit.permit_status == APPROVED"
          - "project.operational_posture != FROZEN"
        side_effects:
          - "sets InjectionWellPermit.construction_status = DRILLING"
          - "increments InjectionWellPermit.version by 1"
      - from: "construction_status=DRILLING"
        to: "construction_status=CASING_SET"
        trigger: "POST /ccs/injection-well-permits/{id}/advance-construction with to_construction_status == CASING_SET"
        actor: ProjectDeveloper
        preconditions: ["permit.construction_status == DRILLING"]
        side_effects:
          - "sets InjectionWellPermit.construction_status = CASING_SET"
          - "increments InjectionWellPermit.version by 1"
      - from: "construction_status=CASING_SET"
        to: "construction_status=CEMENT_LOGGED"
        trigger: "POST /ccs/injection-well-permits/{id}/advance-construction with to_construction_status == CEMENT_LOGGED"
        actor: ProjectDeveloper
        preconditions: ["permit.construction_status == CASING_SET"]
        side_effects:
          - "sets InjectionWellPermit.construction_status = CEMENT_LOGGED"
          - "increments InjectionWellPermit.version by 1"
      - from: "construction_status=CEMENT_LOGGED"
        to: "construction_status=MIT_PENDING"
        trigger: "POST /ccs/injection-well-permits/{id}/advance-construction with to_construction_status == MIT_PENDING"
        actor: ProjectDeveloper
        preconditions: ["permit.construction_status == CEMENT_LOGGED"]
        side_effects:
          - "sets InjectionWellPermit.construction_status = MIT_PENDING"
          - "increments InjectionWellPermit.version by 1"
      - from: "construction_status=MIT_PENDING"
        to: "construction_status=COMPLETED"
        trigger: "POST /ccs/injection-well-permits/{id}/advance-construction with to_construction_status == COMPLETED"
        actor: ProjectDeveloper
        preconditions:
          - "permit.construction_status == MIT_PENDING"
          - "permit.last_mit_result == PASS"
        side_effects:
          - "sets InjectionWellPermit.construction_status = COMPLETED"
          - "increments InjectionWellPermit.version by 1"

  # ---------------------------------------------------------- monitoring plan
  - entity: MonitoringPlan
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: >-
      Fork-join: SUBMITTED opens two review tracks whose completion flags are set independently; the
      plan auto-advances to REVIEW_COMPLETE only when both flags are true. From REVIEW_COMPLETE the
      ruling branches into APPROVED and APPROVED_WITH_CONDITIONS with different side-effect sets.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ccs/monitoring-plans/{id}/submit"
        actor: ProjectDeveloper
        preconditions:
          - "plan.status IN {DRAFT, REVISION_REQUESTED}"
          - "plan has at least one MonitoringMethod with status == ACTIVE"
        side_effects:
          - "sets technical_review_complete = false and public_comment_complete = false"
          - "increments MonitoringPlan.revision_round_count by 1"
          - "recomputes subsurface_subscore, surface_subscore, atmospheric_subscore, coverage_score"
          - "sets MonitoringPlan.status = SUBMITTED"
          - "increments MonitoringPlan.version by 1"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /ccs/monitoring-plans/{id}/review with decision == COMPLETE_TECHNICAL_REVIEW"
        actor: RegulatoryReviewer
        preconditions: ["plan.status == SUBMITTED", "plan.technical_review_complete == false"]
        side_effects:
          - "sets MonitoringPlan.technical_review_complete = true"
          - "auto-advances SUBMITTED -> REVIEW_COMPLETE when public_comment_complete is already true"
          - "increments MonitoringPlan.version by 1"
      - from: SUBMITTED
        to: REVIEW_COMPLETE
        trigger: "POST /ccs/monitoring-plans/{id}/review with decision == COMPLETE_PUBLIC_COMMENT"
        actor: RegulatoryReviewer
        preconditions: ["plan.status == SUBMITTED", "plan.public_comment_complete == false"]
        side_effects:
          - "sets MonitoringPlan.public_comment_complete = true"
          - "sets MonitoringPlan.status = REVIEW_COMPLETE only when technical_review_complete is already true, otherwise status stays SUBMITTED"
          - "increments MonitoringPlan.version by 1"
      - from: REVIEW_COMPLETE
        to: APPROVED
        trigger: "POST /ccs/monitoring-plans/{id}/review with decision == APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "plan.status == REVIEW_COMPLETE"
          - "plan.subsurface_subscore > 0 and plan.surface_subscore > 0 and plan.atmospheric_subscore > 0"
          - "plan.coverage_score >= 85.00"
        side_effects:
          - "sets MonitoringPlan.condition_count = 0, approved_by_user_id = X-User-ID"
          - "sets MonitoringPlan.status = APPROVED"
          - "leaves StorageProject.effective_annual_monitoring_cost_usd equal to annual_monitoring_cost_usd"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status"
          - "increments MonitoringPlan.version by 1 and StorageProject.version by 1"
      - from: REVIEW_COMPLETE
        to: APPROVED_WITH_CONDITIONS
        trigger: "POST /ccs/monitoring-plans/{id}/review with decision == APPROVE"
        actor: RegulatoryReviewer
        preconditions:
          - "plan.status == REVIEW_COMPLETE"
          - "plan.subsurface_subscore > 0 and plan.surface_subscore > 0 and plan.atmospheric_subscore > 0"
          - "70.00 <= plan.coverage_score < 85.00"
        side_effects:
          - "sets MonitoringPlan.condition_count = the request body condition_count, approved_by_user_id = X-User-ID"
          - "sets MonitoringPlan.status = APPROVED_WITH_CONDITIONS"
          - "sets StorageProject.effective_annual_monitoring_cost_usd = round(annual_monitoring_cost_usd * 1.15, 2)"
          - "recomputes StorageProject.required_financial_assurance_usd and assurance_coverage_status, which grows the PISC bucket"
          - "increments MonitoringPlan.version by 1 and StorageProject.version by 1"
      - from: REVIEW_COMPLETE
        to: REVISION_REQUESTED
        trigger: "POST /ccs/monitoring-plans/{id}/review with decision == REQUEST_REVISION"
        actor: RegulatoryReviewer
        preconditions: ["plan.status == REVIEW_COMPLETE"]
        side_effects:
          - "sets technical_review_complete = false and public_comment_complete = false"
          - "sets MonitoringPlan.status = REVISION_REQUESTED"
          - "increments MonitoringPlan.version by 1"
      - from: REVIEW_COMPLETE
        to: REJECTED
        trigger: "POST /ccs/monitoring-plans/{id}/review with decision == REJECT"
        actor: RegulatoryReviewer
        preconditions: ["plan.status == REVIEW_COMPLETE"]
        side_effects:
          - "sets MonitoringPlan.status = REJECTED"
          - "increments MonitoringPlan.version by 1"

  # ------------------------------------------------------ financial instrument
  - entity: FinancialInstrument
    initial_state: POSTED
    terminal_states: [RELEASED]
    transitions:
      - from: POSTED
        to: ALLOCATED
        trigger: "POST /ccs/financial-instruments/{id}/allocate"
        actor: ProjectDeveloper
        preconditions:
          - "instrument.status IN {POSTED, ALLOCATED}"
          - "request expected_instrument_version == instrument.version"
          - "project.required_financial_assurance_usd > 0"
        side_effects:
          - "computes the four allocated buckets by waterfall per calculations.assurance_waterfall_allocation"
          - "sets FinancialInstrument.unallocated_usd = face_amount_usd minus the four buckets"
          - "sets FinancialInstrument.status = ALLOCATED"
          - "recomputes StorageProject.allocated_assurance_usd and assurance_coverage_status"
          - "increments FinancialInstrument.version by 1 and StorageProject.version by 1"
      - from: ALLOCATED
        to: POSTED
        trigger: "POST /ccs/financial-instruments/{id}/deallocate"
        actor: ProjectDeveloper
        preconditions:
          - "instrument.status == ALLOCATED"
          - "project.status IN {DRAFT, SITE_CHARACTERIZATION, PERMITTING}"
        side_effects:
          - "zeroes the four allocated buckets and sets unallocated_usd = face_amount_usd"
          - "sets FinancialInstrument.status = POSTED"
          - "recomputes StorageProject.allocated_assurance_usd and assurance_coverage_status"
          - "increments FinancialInstrument.version by 1 and StorageProject.version by 1"
      - from: ALLOCATED
        to: DRAWN
        trigger: "system: POST /ccs/remediation-orders with severity == CRITICAL"
        actor: system
        preconditions: ["instrument.status == ALLOCATED", "instrument.allocated_emergency_usd > 0"]
        side_effects:
          - "sets FinancialInstrument.drawn_usd = RemediationOrder.reserve_draw_usd"
          - "reduces allocated_emergency_usd by the drawn amount"
          - "sets FinancialInstrument.status = DRAWN"
          - "recomputes StorageProject.allocated_assurance_usd and assurance_coverage_status"
          - "increments FinancialInstrument.version by 1 and StorageProject.version by 1"
      - from: ALLOCATED
        to: RELEASED
        trigger: "system: POST /ccs/storage-projects/{id}/certify-closure"
        actor: system
        preconditions: ["instrument.status == ALLOCATED", "project.status == PISC"]
        side_effects:
          - "zeroes the four allocated buckets back into unallocated_usd"
          - "sets FinancialInstrument.released_at = clock now"
          - "sets FinancialInstrument.status = RELEASED"
          - "increments FinancialInstrument.version by 1"

  # ------------------------------------------------------- injection period
  - entity: InjectionPeriodRecord
    initial_state: ACCEPTED
    terminal_states: [VOIDED]
    transitions:
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /ccs/injection-periods/{id}/void"
        actor: ProjectDeveloper
        preconditions:
          - "record.status == ACCEPTED"
          - "no TaxCreditClaim of the project covering this record's tax year has status == ALLOWED"
        side_effects:
          - "sets InjectionPeriodRecord.status = VOIDED and voided_at = clock now"
          - "recomputes StorageProject.cumulative_stored_tonnes over records with status == ACCEPTED"
          - "recomputes reported_tonnes, verified_tonnes, credit_rate_usd_per_tonne and credit_amount_usd on every TaxCreditClaim of the project with status IN {DRAFT, SUBMITTED} whose tax_year covers the voided period"
          - "recomputes StorageProject.pending_credit_usd"
          - "increments StorageProject.version by 1"

  # ---------------------------------------------------------- tax credit claim
  - entity: TaxCreditClaim
    initial_state: DRAFT
    terminal_states: [ALLOWED, DISALLOWED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /ccs/tax-credit-claims/{id}/submit"
        actor: ProjectDeveloper
        preconditions:
          - "claim.status == DRAFT"
          - "the referenced MonitoringPlan has status IN {APPROVED, APPROVED_WITH_CONDITIONS}"
          - "claim.reported_tonnes > 0"
          - "project.operational_posture != FROZEN"
        side_effects:
          - "recomputes reported_tonnes, verified_tonnes, credit_rate_usd_per_tonne and credit_amount_usd per calculations.tax_credit_amount"
          - "sets TaxCreditClaim.submitted_by_user_id = X-User-ID"
          - "sets TaxCreditClaim.status = SUBMITTED"
          - "recomputes StorageProject.pending_credit_usd"
          - "increments TaxCreditClaim.version by 1 and StorageProject.version by 1"
      - from: SUBMITTED
        to: ALLOWED
        trigger: "POST /ccs/tax-credit-claims/{id}/verify with decision == ALLOW"
        actor: IndependentVerifier
        preconditions:
          - "claim.status == SUBMITTED"
          - "X-User-ID != claim.submitted_by_user_id"
          - "claim.verified_tonnes > 0"
        side_effects:
          - "sets TaxCreditClaim.claim_variant = VERIFIED and recomputes credit_amount_usd on the verified tonnage basis"
          - "sets TaxCreditClaim.verifier_user_id = X-User-ID"
          - "sets TaxCreditClaim.status = ALLOWED"
          - "recomputes StorageProject.pending_credit_usd"
          - "increments TaxCreditClaim.version by 1 and StorageProject.version by 1"
      - from: SUBMITTED
        to: DISALLOWED
        trigger: "POST /ccs/tax-credit-claims/{id}/verify with decision == DISALLOW"
        actor: IndependentVerifier
        preconditions:
          - "claim.status == SUBMITTED"
          - "X-User-ID != claim.submitted_by_user_id"
        side_effects:
          - "sets TaxCreditClaim.verifier_user_id = X-User-ID"
          - "sets TaxCreditClaim.status = DISALLOWED"
          - "recomputes StorageProject.pending_credit_usd"
          - "increments TaxCreditClaim.version by 1 and StorageProject.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "system: an InjectionWellPermit of this project leaves ACTIVE for SUSPENDED"
        actor: system
        preconditions: ["claim.status == SUBMITTED"]
        side_effects:
          - "sets TaxCreditClaim.status = DRAFT"
          - "cascade link 4: because the claim left SUBMITTED, StorageProject.pending_credit_usd is recomputed over claims with status IN {SUBMITTED, ALLOWED}"
          - "increments TaxCreditClaim.version by 1"

  # -------------------------------------------------------- remediation order
  - entity: RemediationOrder
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /ccs/remediation-orders"
        actor: RegulatoryReviewer
        preconditions:
          - "project.status IN {INJECTION_AUTHORIZED, INJECTION_ACTIVE, PISC}"
        side_effects:
          - "sets RemediationOrder.opened_at = clock now and status = OPEN"
          - "computes reserve_draw_usd per calculations.emergency_reserve_draw"
          - "cascade link 1: increments StorageProject.open_remediation_count and, for severity IN {MAJOR, CRITICAL}, sets operational_posture = FROZEN"
          - "for severity == CRITICAL, drives the project's FinancialInstrument with status == ALLOCATED to DRAWN"
          - "increments StorageProject.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /ccs/remediation-orders/{id}/resolve"
        actor: RegulatoryReviewer
        preconditions:
          - "order.status == OPEN"
          - "request body remediation_summary is non-empty"
        side_effects:
          - "sets RemediationOrder.status = RESOLVED and resolved_at = clock now"
          - "decrements StorageProject.open_remediation_count by 1"
          - "when open_remediation_count reaches 0, restores operational_posture and reinstates SUSPENDED permits to ACTIVE"
          - "increments RemediationOrder.version by 1 and StorageProject.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: model-create-stale-project
    parent_entity: StorageProject
    write_endpoint: "POST /ccs/geologic-models"
    occ_field: "expected_project_version"
    description: |
      Creating a GeologicModel against a StorageProject whose version has advanced since the client
      last read it is rejected. A newly created model legitimately supersedes the developer's prior
      characterization once accepted, so the create itself carries no state precondition that would
      catch a writer working from a stale view of the project; the stale-version check is what pins it.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

  - rule_id: tract-offer-stale-tract
    parent_entity: PoreSpaceTract
    write_endpoint: "POST /ccs/pore-space-tracts/{id}/offers"
    occ_field: "expected_tract_version"
    description: |
      Sending a lease offer on a PoreSpaceTract whose version has advanced since the client last read
      it is rejected. A fresh offer legitimately replaces the outstanding offer under the negotiation
      cycle, so a writer holding a stale view would otherwise overwrite a landowner counter it never
      saw; the stale-version check pins the negotiation round the offer answers.
    error_id: ERR_STALE_TRACT_VERSION
    http_status: 412

  - rule_id: instrument-allocate-stale-instrument
    parent_entity: FinancialInstrument
    write_endpoint: "POST /ccs/financial-instruments/{id}/allocate"
    occ_field: "expected_instrument_version"
    description: |
      Re-running the assurance waterfall on a FinancialInstrument whose version has advanced since the
      client last read it is rejected. Allocation is idempotent-by-design and may legitimately be
      re-run after the requirement changes, so nothing in the instrument's own state would reject a
      writer working from a stale bucket picture; the stale-version check pins the requirement snapshot.
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: max_injection_rate
    trigger: "POST /ccs/geologic-models/{id}/run-plume-simulation"
    algorithm: threshold
    formula: |
      allowable_buildup_psi = round(MAX_PRESSURE_FRACTION * (fracture_pressure_psi - reservoir_pressure_psi), 2)
      max_injection_rate_tpy = floor(allowable_buildup_psi * permeability_md * porosity_fraction * 1000 / INJ_BUILDUP_COEFF)
      effective_injection_rate_tpy = min(project.requested_annual_injection_rate_tpy, max_injection_rate_tpy)
    input_set: "the model's own parameter fields plus the parent project's requested_annual_injection_rate_tpy"
    constants:
      MAX_PRESSURE_FRACTION: 0.90
      INJ_BUILDUP_COEFF: 45.0
    precision: "allowable_buildup_psi 2 decimals round_half_up; max_injection_rate_tpy floored to whole tonnes"

  - name: seal_integrity_index
    trigger: "POST /ccs/geologic-models/{id}/run-plume-simulation"
    algorithm: weighted_scoring
    formula: |
      pressure_buildup_psi = round(INJ_BUILDUP_COEFF * effective_injection_rate_tpy
                                   / (permeability_md * porosity_fraction * 1000), 2)
      # DETERMINISTIC parameter set
      seal_capacity_psi     = capillary_entry_pressure_psi * (seal_thickness_m / REF_SEAL_THICKNESS_M)
      seal_integrity_index  = round(seal_capacity_psi / (pressure_buildup_psi * SAFETY_FACTOR_DETERMINISTIC), 3)
      # PROBABILISTIC_P10 parameter set
      seal_capacity_p10_psi    = p10_capillary_entry_pressure_psi * (p10_seal_thickness_m / REF_SEAL_THICKNESS_M)
      seal_integrity_index_p10 = round(seal_capacity_p10_psi / (pressure_buildup_psi * SAFETY_FACTOR_P10), 3)
      # classification uses ONLY the index named by assessment_variant
      governing_index = seal_integrity_index if assessment_variant == DETERMINISTIC else seal_integrity_index_p10
      seal_classification = PASS        if governing_index >= 1.500
                            CONDITIONAL if 1.000 <= governing_index < 1.500
                            FAIL        if governing_index < 1.000
    input_set: "one GeologicModel row; both parameter sets are always computed and stored, only one governs the classification"
    constants:
      REF_SEAL_THICKNESS_M: 30.0
      SAFETY_FACTOR_DETERMINISTIC: 1.0
      SAFETY_FACTOR_P10: 1.25
      PASS_THRESHOLD: 1.500
      CONDITIONAL_THRESHOLD: 1.000
    precision: "pressure_buildup_psi 2 decimals; both indices 3 decimals, round_half_up"
    variants:
      - name: DETERMINISTIC
        when: "model.assessment_variant == DETERMINISTIC"
        difference: "uses seal_thickness_m and capillary_entry_pressure_psi with SAFETY_FACTOR_DETERMINISTIC = 1.0"
      - name: PROBABILISTIC_P10
        when: "model.assessment_variant == PROBABILISTIC_P10"
        difference: "uses p10_seal_thickness_m and p10_capillary_entry_pressure_psi with SAFETY_FACTOR_P10 = 1.25, so the same row can classify PASS under one variant and FAIL under the other"

  - name: plume_and_aor_radii
    trigger: "POST /ccs/geologic-models/{id}/run-plume-simulation"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned; every later step consumes the previous step's stored output.
      # 1. max_injection_rate_tpy            (calculations.max_injection_rate)
      # 2. effective_injection_rate_tpy      = min(project.requested_annual_injection_rate_tpy, step 1)
      # 3. radii below
      total_mass_tonnes = effective_injection_rate_tpy * injection_years
      pore_volume_m3    = total_mass_tonnes * 1000.0 / CO2_DENSITY_KG_PER_M3
      swept_area_m2     = pore_volume_m3 / (PI * injection_zone_thickness_m * porosity_fraction * SWEEP_EFFICIENCY)
      plume_radius_km          = round(sqrt(swept_area_m2) / 1000.0, 3)
      pressure_front_radius_km = round(plume_radius_km * PRESSURE_FRONT_MULTIPLIER, 3)
      aor_radius_km            = ceil(max(plume_radius_km, pressure_front_radius_km) * 10.0) / 10.0
    input_set: "one GeologicModel row plus the parent project's requested rate; no other project rows participate"
    constants:
      CO2_DENSITY_KG_PER_M3: 700.0
      SWEEP_EFFICIENCY: 0.35
      PRESSURE_FRONT_MULTIPLIER: 1.8
      PI: 3.141592653589793
    precision: "both radii 3 decimals round_half_up; aor_radius_km rounded UP to the next 0.1 km"

  - name: legacy_wellbore_risk_score
    trigger: "LegacyWellbore creation, and every recomputation triggered by a change to project.aor_radius_km"
    algorithm: weighted_scoring
    formula: |
      seal_factor  = 1.0 if penetrates_seal else 0.85
      plug_factor  = { OPEN_HOLE: 1.00, PARTIALLY_PLUGGED: 0.70, UNKNOWN: 0.85, CEMENTED: 0.25 }[plug_condition]
      record_factor = 0.60 if plug_record_available else 1.00
      # proximity uses the project AoR radius; an undelineated AoR (0) yields proximity_factor = 0.20
      proximity_factor = 0.20 if project.aor_radius_km <= 0
                         else max(0.20, min(1.00, 1.0 - distance_from_injector_km / project.aor_radius_km))
      risk_score = round(100.0 * seal_factor * plug_factor * record_factor
                         * (0.40 + 0.60 * proximity_factor), 2)
      ca_cost_estimate_usd = round(CA_BASE_COST_USD + CA_COST_PER_M * total_depth_m
                                   + CA_RISK_COST_USD * risk_score, 2)
    input_set: "one LegacyWellbore row plus project.aor_radius_km"
    constants:
      CA_BASE_COST_USD: 150000.0
      CA_COST_PER_M: 120.0
      CA_RISK_COST_USD: 2000.0
      CA_REQUIRED_RISK_THRESHOLD: 40.00
      CA_WAIVER_RISK_CEILING: 60.00
    precision: "risk_score and ca_cost_estimate_usd 2 decimals, round_half_up"

  - name: corrective_action_completion_pct
    trigger: "any LegacyWellbore corrective_action_status change, and POST /ccs/geologic-models/{id}/finalize-aor"
    algorithm: aggregation
    formula: |
      in_aor    = LegacyWellbore rows of the project with corrective_action_status IN
                  {IDENTIFIED, CA_REQUIRED, CA_SCHEDULED, CA_COMPLETE, CA_WAIVED}
      obligated = subset of in_aor with corrective_action_status IN {CA_REQUIRED, CA_SCHEDULED, CA_COMPLETE, CA_WAIVED}
      closed    = subset of obligated with corrective_action_status IN {CA_COMPLETE, CA_WAIVED}
      corrective_action_completion_pct = 100.00 if len(obligated) == 0
                                         else round(100.0 * len(closed) / len(obligated), 2)
    input_set: "LegacyWellbore rows of one project; OUT_OF_AOR rows are excluded from both numerator and denominator"
    constants: {}
    precision: "2 decimals, round_half_up; an empty obligated set yields exactly 100.00"

  - name: pore_space_bonus_settlement
    trigger: "PoreSpaceTract reaching EXECUTED or UNITIZED, and PoreSpaceTract leaving EXECUTED for TERMINATED"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each tract, then sum the rounded values.
      per_tract:
        net_acreage          = round(acreage * ownership_pct / 100.0, 4)
        bonus_settlement_usd = round(net_acreage * executed_bonus_per_acre_usd, 2)
      project:
        holders = PoreSpaceTract rows of the project with lease_status IN {EXECUTED, UNITIZED}
        secured_acreage           = round(sum(net_acreage of holders), 4)
        outstanding_acreage       = round(total_project_acreage - secured_acreage, 4)
        pore_space_consent_pct    = round(100.0 * secured_acreage / total_project_acreage, 2)
        pore_space_bonus_total_usd = round(sum(bonus_settlement_usd of holders), 2)
    input_set: "PoreSpaceTract rows of one project with lease_status IN {EXECUTED, UNITIZED}, ordered by created_at ASC for the sum"
    constants: {}
    precision: >-
      net_acreage 4 decimals; per-tract bonus 2 decimals round_half_up; the project total is the sum of the
      already-rounded per-tract values, NOT round(sum(net_acreage * rate)) — the two orders differ in cents
    variants: []

  - name: mrv_coverage_score
    trigger: "MonitoringMethod creation or retirement, and POST /ccs/monitoring-plans/{id}/submit"
    algorithm: weighted_scoring
    formula: |
      per method with status == ACTIVE:
        coverage_term  = min(1.00, spatial_coverage_pct / 100.0)
        frequency_term = min(1.00, frequency_per_year / REF_FREQUENCY[domain])
        detection_term = min(1.00, DETECTION_REF_TPY[domain] / detection_threshold_tpy)
        method_score   = round(coverage_term * frequency_term * detection_term, 4)
      per domain D in {SUBSURFACE, SURFACE, ATMOSPHERIC}:
        D_subscore = round(min(1.0000, sum(method_score of ACTIVE methods with domain == D)), 4)
      coverage_score = round(100.0 * (0.50 * subsurface_subscore
                                    + 0.30 * surface_subscore
                                    + 0.20 * atmospheric_subscore), 2)
    input_set: "MonitoringMethod rows of one plan with status == ACTIVE; RETIRED rows contribute 0 to their domain"
    constants:
      REF_FREQUENCY: { SUBSURFACE: 2, SURFACE: 4, ATMOSPHERIC: 12 }
      DETECTION_REF_TPY: { SUBSURFACE: 1000.0, SURFACE: 100.0, ATMOSPHERIC: 25.0 }
      WEIGHT_SUBSURFACE: 0.50
      WEIGHT_SURFACE: 0.30
      WEIGHT_ATMOSPHERIC: 0.20
      APPROVE_SCORE_THRESHOLD: 85.00
      CONDITIONS_SCORE_THRESHOLD: 70.00
    precision: "method_score and each domain subscore 4 decimals; coverage_score 2 decimals, round_half_up"

  - name: required_financial_assurance
    trigger: >-
      any change to the CA_REQUIRED/CA_SCHEDULED population, POST /ccs/geologic-models/{id}/finalize-aor,
      geologic model acceptance, permit approval or denial, MonitoringPlan approval, and begin-pisc
    algorithm: constraint_propagation
    formula: |
      # The inputs form a circular-looking dependency (assurance depends on the AoR, which depends on
      # the injection rate, which is capped by the model). Evaluation order is PINNED as follows and
      # every step reads the STORED output of the previous step, never a re-derivation:
      #   1. model.max_injection_rate_tpy        (calculations.max_injection_rate)
      #   2. model.effective_injection_rate_tpy  = min(project requested rate, step 1)
      #   3. project.aor_radius_km               (copied by finalize-aor from calculations.plume_and_aor_radii)
      #   4. in-AoR wellbore screening + per-wellbore ca_cost_estimate_usd (calculations.legacy_wellbore_risk_score)
      #   5. the five cost buckets below, in the order written
      #   6. required_financial_assurance_usd, then assurance_coverage_status
      ca_scope       = LegacyWellbore rows of the project with corrective_action_status IN
                       {IDENTIFIED, CA_REQUIRED, CA_SCHEDULED}
      ca_cost_total  = round(sum(ca_cost_estimate_usd of ca_scope), 2)          # per-wellbore values already rounded
      pisc_cost      = round(project.pisc_duration_years * project.effective_annual_monitoring_cost_usd, 2)
      plugging_cost  = PLUG_COST_PER_WELL_USD * count(InjectionWellPermit rows of the project with
                       permit_status IN {SUBMITTED, TECHNICAL_REVIEW, REVISION_REQUESTED, APPROVED, ACTIVE, SUSPENDED})
      emergency_res  = max(EMERGENCY_FLOOR_USD,
                           round(EMERGENCY_RATE_PER_KM2 * PI * project.aor_radius_km ** 2, 2))
      admin_fee      = 250000.00 if effective_injection_rate_tpy <= 500000
                       else 500000.00 if effective_injection_rate_tpy <= 1500000
                       else 900000.00
      required_financial_assurance_usd = round(ca_cost_total + pisc_cost + plugging_cost
                                               + emergency_res + admin_fee, 2)
      assurance_coverage_status = UNFUNDED    if project.allocated_assurance_usd <= 0
                                  FUNDED      if project.allocated_assurance_usd >= required_financial_assurance_usd
                                  UNDERFUNDED otherwise
    input_set: >-
      one project: its governing GeologicModel (status == ACCEPTED), its LegacyWellbore rows in the
      IDENTIFIED/CA_REQUIRED/CA_SCHEDULED scope, its InjectionWellPermit rows outside {DRAFT, DENIED},
      and its own pisc_duration_years and effective_annual_monitoring_cost_usd
    constants:
      PLUG_COST_PER_WELL_USD: 850000.0
      EMERGENCY_FLOOR_USD: 2000000.0
      EMERGENCY_RATE_PER_KM2: 500000.0
      ADMIN_FEE_TIER1_USD: 250000.0
      ADMIN_FEE_TIER2_USD: 500000.0
      ADMIN_FEE_TIER3_USD: 900000.0
      ADMIN_TIER1_RATE_CEILING_TPY: 500000
      ADMIN_TIER2_RATE_CEILING_TPY: 1500000
      PI: 3.141592653589793
    precision: "each bucket 2 decimals round_half_up; the total is the sum of the already-rounded buckets"

  - name: assurance_waterfall_allocation
    trigger: "POST /ccs/financial-instruments/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      # Buckets are filled in this FIXED order from the instrument's face amount.
      requirement = {
        CORRECTIVE_ACTION: ca_cost_total,                       # from calculations.required_financial_assurance
        PLUGGING:          plugging_cost,
        PISC:              pisc_cost,
        EMERGENCY:         emergency_res + admin_fee
      }
      remaining = face_amount_usd
      for bucket in [CORRECTIVE_ACTION, PLUGGING, PISC, EMERGENCY]:
          allocated[bucket] = round(min(remaining, requirement[bucket]), 2)
          remaining = round(remaining - allocated[bucket], 2)
      allocated_ca_usd        = allocated[CORRECTIVE_ACTION]
      allocated_plugging_usd  = allocated[PLUGGING]
      allocated_pisc_usd      = allocated[PISC]
      allocated_emergency_usd = allocated[EMERGENCY]
      unallocated_usd         = round(remaining, 2)
      # INVARIANT (conserved dollars), holds after every allocate, deallocate and emergency draw:
      #   allocated_ca_usd + allocated_plugging_usd + allocated_pisc_usd
      #     + allocated_emergency_usd + unallocated_usd + drawn_usd == face_amount_usd
      project.allocated_assurance_usd = round(sum over FinancialInstrument rows with status == ALLOCATED of
                                              (allocated_ca_usd + allocated_plugging_usd
                                               + allocated_pisc_usd + allocated_emergency_usd), 2)
    input_set: "one FinancialInstrument row and the five cost buckets of its project's current requirement"
    constants: {}
    precision: "every bucket 2 decimals round_half_up; the waterfall never allocates more than face_amount_usd"

  - name: secure_storage_ledger
    trigger: "POST /ccs/injection-well-permits/{id}/injection-periods and POST /ccs/injection-periods/{id}/void"
    algorithm: chronological
    formula: |
      per record: net_stored_tonnes = round(mass_injected_tonnes - measured_leakage_tonnes, 3)
      project.cumulative_stored_tonnes = round(
          sum(net_stored_tonnes of InjectionPeriodRecord rows whose permit belongs to this project
              and status == ACCEPTED,
              processed in order period_start ASC, tie-break created_at ASC), 3)
      # INVARIANT (conserved tonnes): after any create followed by its void, the project's
      # cumulative_stored_tonnes equals the sum over the remaining ACCEPTED records exactly.
    input_set: "InjectionPeriodRecord rows of all permits of one project with status == ACCEPTED; VOIDED rows excluded"
    constants: {}
    precision: "3 decimals, round_half_up; a zero-mass period contributes exactly 0.000"

  - name: tax_credit_amount
    trigger: "POST /ccs/tax-credit-claims/{id}/submit and POST /ccs/tax-credit-claims/{id}/verify"
    algorithm: tiered_pricing
    formula: |
      window   = records of the project's permits with status == ACCEPTED,
                 period_start >= <tax_year>-01-01T00:00:00Z and period_end <= <tax_year+1>-01-01T00:00:00Z
      reported_tonnes = round(sum(mass_injected_tonnes over window), 3)
      leakage_tonnes  = round(sum(measured_leakage_tonnes over window), 3)
      lca_deduction   = round(reported_tonnes * lca_upstream_emissions_factor, 3)
      verified_tonnes = round(reported_tonnes - leakage_tonnes - lca_deduction, 3)
      credit_rate_usd_per_tonne = RATE_TIER1 if project.cumulative_stored_tonnes <= TIER1_CEILING_TONNES
                                  RATE_TIER2 if project.cumulative_stored_tonnes <= TIER2_CEILING_TONNES
                                  RATE_TIER3 otherwise
      basis = reported_tonnes if claim_variant == REPORTED else verified_tonnes
      credit_amount_usd = round(basis * credit_rate_usd_per_tonne, 2)
    input_set: >-
      InjectionPeriodRecord rows with status == ACCEPTED fully inside the claim's tax year, plus the
      project's cumulative_stored_tonnes at the moment of the transition that triggers the calculation
    constants:
      RATE_TIER1: 85.00
      RATE_TIER2: 70.00
      RATE_TIER3: 55.00
      TIER1_CEILING_TONNES: 500000
      TIER2_CEILING_TONNES: 2000000
    precision: "tonnages 3 decimals; credit_amount_usd 2 decimals, round_half_up"
    variants:
      - name: REPORTED
        when: "claim_variant == REPORTED, which is the basis while status IN {DRAFT, SUBMITTED}"
        difference: "uses gross reported_tonnes: no leakage subtraction and no lifecycle-analysis deduction"
      - name: VERIFIED
        when: "claim_variant == VERIFIED, set by POST /ccs/tax-credit-claims/{id}/verify with decision == ALLOW"
        difference: "uses verified_tonnes = reported - measured leakage - lifecycle deduction, so the allowed credit is strictly smaller than the submitted credit whenever leakage or the LCA factor is non-zero"

  - name: pisc_duration_years
    trigger: "POST /ccs/storage-projects/{id}/begin-pisc"
    algorithm: threshold
    formula: |
      eligible_for_alternative = alternative_timeframe_years is not null
                                 and governing_model.seal_classification == PASS
                                 and best_plan_coverage_score >= ALT_TIMEFRAME_COVERAGE_MIN
      # best_plan_coverage_score = coverage_score of the project's MonitoringPlan with
      # status IN {APPROVED, APPROVED_WITH_CONDITIONS}; when several exist, the one with the highest
      # coverage_score, tie-break created_at ASC; when none exists, 0.
      pisc_duration_years = DEFAULT_PISC_YEARS if not eligible_for_alternative
                            else max(MIN_PISC_YEARS, min(DEFAULT_PISC_YEARS, alternative_timeframe_years))
      pisc_elapsed_years = round((clock_now - pisc_start_at) in days / 365.25, 3)
    input_set: "one project plus its governing GeologicModel and its approved MonitoringPlan rows"
    constants:
      DEFAULT_PISC_YEARS: 50
      MIN_PISC_YEARS: 10
      ALT_TIMEFRAME_COVERAGE_MIN: 85.00
    precision: "pisc_duration_years integer; pisc_elapsed_years 3 decimals, round_half_up"

  - name: emergency_reserve_draw
    trigger: "POST /ccs/remediation-orders"
    algorithm: threshold
    formula: |
      reserve_draw_usd = 0.00 if severity IN {MINOR, MAJOR}
                         else round(min(instrument.allocated_emergency_usd,
                                        CRITICAL_DRAW_FRACTION * project.required_financial_assurance_usd), 2)
      # instrument = the project's FinancialInstrument with status == ALLOCATED; when several exist,
      # the one with the largest allocated_emergency_usd, tie-break created_at ASC; when none exists the
      # draw is 0.00 and no instrument changes state.
    input_set: "one project's FinancialInstrument rows with status == ALLOCATED"
    constants:
      CRITICAL_DRAW_FRACTION: 0.25
    precision: "2 decimals, round_half_up"

  - name: mechanical_integrity_verdict
    trigger: "POST /ccs/injection-well-permits/{id}/record-mit"
    algorithm: threshold
    formula: |
      if test_type == ANNULUS_PRESSURE:
          result = PASS if annulus_pressure_loss_psi <= MIT_MAX_PRESSURE_LOSS_PSI else FAIL
      else:  # TEMPERATURE_LOG or CASING_INSPECTION_LOG
          result = FAIL if anomaly_detected else PASS
      permit.last_mit_type = test_type
      permit.last_mit_result = result
      permit.last_mit_at = clock now
      permit.mit_pass_count = previous count + (1 if result == PASS else 0)
    input_set: "one recorded test against one permit; only the most recent test governs activation"
    constants:
      MIT_MAX_PRESSURE_LOSS_PSI: 3.00
    precision: "comparison is on the submitted psi value at 2 decimals; exactly 3.00 psi is a PASS"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 21
    category: auth
    check: "for a Landowner acting on a tract, X-User-ID == tract.landowner_user_id"
    error_id: ERR_NOT_TRACT_LANDOWNER
    http_status: 403
    applies_to: "POST /ccs/pore-space-tracts/{id}/respond"

  - priority: 22
    category: auth
    check: >-
      segregation of duties: on certify-closure, X-User-ID must differ from technical_reviewer_user_id of
      every InjectionWellPermit of the project; on claim verify, X-User-ID must differ from
      claim.submitted_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ccs/storage-projects/{id}/certify-closure, POST /ccs/tax-credit-claims/{id}/verify"

  - priority: 30
    category: business_constraint
    check: >-
      request body shape: required fields present, enums inside their declared sets, numbers inside their
      declared ranges, ISO-8601 timestamps parseable, pagination limit in 1..100 and offset >= 0,
      annulus_pressure_loss_psi present when test_type == ANNULUS_PRESSURE and anomaly_detected present
      for the other two test types
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 40
    category: existence
    check: "path and body resources exist, validated left-to-right: project, then model, then wellbore, tract, permit, plan, method, instrument, injection period, claim, remediation order"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 41
    category: existence
    check: "referenced GeologicModel exists"
    error_id: ERR_GEOLOGIC_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "endpoints carrying a geologic model id in the path or body"

  - priority: 42
    category: existence
    check: "referenced LegacyWellbore exists"
    error_id: ERR_WELLBORE_NOT_FOUND
    http_status: 404
    applies_to: "/ccs/legacy-wellbores/{id} endpoints"

  - priority: 43
    category: existence
    check: "referenced PoreSpaceTract exists"
    error_id: ERR_TRACT_NOT_FOUND
    http_status: 404
    applies_to: "/ccs/pore-space-tracts/{id} endpoints"

  - priority: 44
    category: existence
    check: "referenced InjectionWellPermit exists"
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: "/ccs/injection-well-permits/{id} endpoints"

  - priority: 45
    category: existence
    check: "referenced MonitoringPlan exists"
    error_id: ERR_MONITORING_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "/ccs/monitoring-plans/{id} endpoints and POST /ccs/tax-credit-claims"

  - priority: 46
    category: existence
    check: "referenced MonitoringMethod exists"
    error_id: ERR_MONITORING_METHOD_NOT_FOUND
    http_status: 404
    applies_to: "POST /ccs/monitoring-methods/{id}/retire"

  - priority: 47
    category: existence
    check: "referenced FinancialInstrument exists"
    error_id: ERR_INSTRUMENT_NOT_FOUND
    http_status: 404
    applies_to: "/ccs/financial-instruments/{id} endpoints"

  - priority: 48
    category: existence
    check: "referenced InjectionPeriodRecord exists"
    error_id: ERR_INJECTION_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "POST /ccs/injection-periods/{id}/void"

  - priority: 49
    category: existence
    check: "referenced TaxCreditClaim or RemediationOrder exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "/ccs/tax-credit-claims/{id} endpoints"

  - priority: 50
    category: existence
    check: "referenced RemediationOrder exists"
    error_id: ERR_REMEDIATION_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /ccs/remediation-orders/{id}/resolve"

  - priority: 51
    category: business_referential
    check: "body foreign keys are consistent: the referenced GeologicModel / MonitoringPlan belongs to the same project as the row being created"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /ccs/injection-well-permits, POST /ccs/tax-credit-claims, POST /ccs/geologic-models"

  - priority: 55
    category: state
    check: "project.operational_posture != FROZEN for every mutation on a child of that project other than remediation-order resolve"
    error_id: ERR_PROJECT_POSTURE_FROZEN
    http_status: 409
    applies_to: "all POST endpoints under a project except POST /ccs/remediation-orders/{id}/resolve and POST /ccs/remediation-orders"

  - priority: 56
    category: state
    check: "target StorageProject is in a status the requested transition allows"
    error_id: ERR_INVALID_PROJECT_STATE
    http_status: 409
    applies_to: "/ccs/storage-projects/{id} action endpoints, POST /ccs/remediation-orders"

  - priority: 57
    category: state
    check: "target GeologicModel is in a status/plume_status the requested transition allows"
    error_id: ERR_INVALID_MODEL_STATE
    http_status: 409
    applies_to: "/ccs/geologic-models/{id} action endpoints"

  - priority: 58
    category: state
    check: "target LegacyWellbore is in a corrective_action_status the requested transition allows"
    error_id: ERR_INVALID_WELLBORE_CA_STATE
    http_status: 409
    applies_to: "/ccs/legacy-wellbores/{id} action endpoints"

  - priority: 59
    category: state
    check: "target PoreSpaceTract is in a lease_status the requested transition allows"
    error_id: ERR_INVALID_TRACT_STATE
    http_status: 409
    applies_to: "/ccs/pore-space-tracts/{id} action endpoints"

  - priority: 60
    category: state
    check: "target InjectionWellPermit is in a permit_status the requested transition allows"
    error_id: ERR_INVALID_PERMIT_STATE
    http_status: 409
    applies_to: "/ccs/injection-well-permits/{id} action endpoints, POST /ccs/injection-well-permits/{id}/injection-periods"

  - priority: 61
    category: state
    check: >-
      requested construction step is the immediate successor of the current construction_status; on
      activate, construction_status must already be COMPLETED
    error_id: ERR_INVALID_CONSTRUCTION_SEQUENCE
    http_status: 409
    applies_to: "POST /ccs/injection-well-permits/{id}/advance-construction, POST /ccs/injection-well-permits/{id}/activate"

  - priority: 62
    category: state
    check: "permit.last_mit_result == PASS where the transition requires demonstrated mechanical integrity"
    error_id: ERR_MIT_NOT_PASSED
    http_status: 409
    applies_to: "POST /ccs/injection-well-permits/{id}/advance-construction with to_construction_status == COMPLETED, POST /ccs/injection-well-permits/{id}/activate"

  - priority: 63
    category: state
    check: "target MonitoringPlan is in a status the requested decision allows, and the requested review track is not already closed"
    error_id: ERR_INVALID_PLAN_STATE
    http_status: 409
    applies_to: "/ccs/monitoring-plans/{id} action endpoints, POST /ccs/monitoring-methods/{id}/retire"

  - priority: 64
    category: state
    check: "target FinancialInstrument is in a status the requested transition allows"
    error_id: ERR_INVALID_INSTRUMENT_STATE
    http_status: 409
    applies_to: "/ccs/financial-instruments/{id} action endpoints"

  - priority: 65
    category: state
    check: "target TaxCreditClaim / InjectionPeriodRecord / RemediationOrder is in a status the requested transition allows"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "/ccs/tax-credit-claims/{id} action endpoints, POST /ccs/injection-periods/{id}/void, POST /ccs/remediation-orders/{id}/resolve"

  - priority: 66
    category: state
    check: "expected_project_version / expected_tract_version / expected_instrument_version equals the parent's stored version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /ccs/geologic-models"

  - priority: 67
    category: state
    check: "expected_tract_version equals tract.version"
    error_id: ERR_STALE_TRACT_VERSION
    http_status: 412
    applies_to: "POST /ccs/pore-space-tracts/{id}/offers"

  - priority: 68
    category: state
    check: "expected_instrument_version equals instrument.version"
    error_id: ERR_STALE_INSTRUMENT_VERSION
    http_status: 412
    applies_to: "POST /ccs/financial-instruments/{id}/allocate"

  - priority: 70
    category: business_safety
    check: "the governing GeologicModel's seal_classification is not FAIL"
    error_id: ERR_SEAL_INTEGRITY_FAIL
    http_status: 422
    applies_to: "POST /ccs/geologic-models/{id}/review with decision == ACCEPT, POST /ccs/injection-well-permits/{id}/review with decision == BEGIN_TECHNICAL_REVIEW, POST /ccs/storage-projects/{id}/authorize-injection"

  - priority: 71
    category: business_safety
    check: "requested_injection_pressure_psi <= max_injection_pressure_psi (90% of fracture pressure)"
    error_id: ERR_INJECTION_PRESSURE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /ccs/injection-well-permits/{id}/submit"

  - priority: 72
    category: business_safety
    check: "construction standards: casing_program == LONG_STRING_CEMENTED_TO_SURFACE, corrosion_resistant_material == true, tubing_packer_installed == true"
    error_id: ERR_CASING_PROGRAM_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /ccs/injection-well-permits/{id}/submit"

  - priority: 73
    category: business_safety
    check: "non_endangerment_demonstrated == true in the certify-closure request body"
    error_id: ERR_NON_ENDANGERMENT_NOT_DEMONSTRATED
    http_status: 422
    applies_to: "POST /ccs/storage-projects/{id}/certify-closure"

  - priority: 75
    category: business_referential
    check: "the claim's MonitoringPlan has status IN {APPROVED, APPROVED_WITH_CONDITIONS}"
    error_id: ERR_MRV_PLAN_NOT_APPROVED
    http_status: 422
    applies_to: "POST /ccs/tax-credit-claims/{id}/submit, POST /ccs/storage-projects/{id}/authorize-injection"

  - priority: 76
    category: business_referential
    check: "project.aor_radius_km > 0, i.e. some accepted model has plume_status == AOR_FINALIZED"
    error_id: ERR_AOR_NOT_DELINEATED
    http_status: 422
    applies_to: "POST /ccs/injection-well-permits/{id}/submit, POST /ccs/storage-projects/{id}/authorize-injection"

  - priority: 77
    category: business_referential
    check: "no RemediationOrder of the project has status == OPEN"
    error_id: ERR_OPEN_REMEDIATION_ORDER
    http_status: 409
    applies_to: "POST /ccs/storage-projects/{id}/certify-closure, POST /ccs/storage-projects/{id}/begin-pisc"

  - priority: 80
    category: business_temporal
    check: "the requested half-open reporting period [period_start, period_end) does not overlap an existing ACCEPTED period of the same permit; touching endpoints do not overlap"
    error_id: ERR_INJECTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /ccs/injection-well-permits/{id}/injection-periods"

  - priority: 81
    category: business_temporal
    check: >-
      fewer than project.ca_rig_slots sibling wellbores with corrective_action_status == CA_SCHEDULED have a
      closed window [ca_window_start, ca_window_end] intersecting the requested closed window; a shared
      endpoint counts as an intersection
    error_id: ERR_CA_RIG_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /ccs/legacy-wellbores/{id}/schedule-corrective-action"

  - priority: 82
    category: business_temporal
    check: "project.pisc_elapsed_years >= project.pisc_duration_years"
    error_id: ERR_PISC_DURATION_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /ccs/storage-projects/{id}/certify-closure"

  - priority: 85
    category: business_constraint
    check: "project.corrective_action_completion_pct == 100"
    error_id: ERR_CORRECTIVE_ACTION_INCOMPLETE
    http_status: 422
    applies_to: "POST /ccs/storage-projects/{id}/authorize-injection, POST /ccs/injection-well-permits/{id}/review with decision == APPROVE"

  - priority: 86
    category: business_constraint
    check: "waiver eligibility: wellbore.penetrates_seal == false and wellbore.risk_score <= 60.00"
    error_id: ERR_CA_WAIVER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /ccs/legacy-wellbores/{id}/waive-corrective-action"

  - priority: 87
    category: business_constraint
    check: "every one of subsurface_subscore, surface_subscore, atmospheric_subscore is > 0"
    error_id: ERR_MRV_DOMAIN_COVERAGE_MISSING
    http_status: 422
    applies_to: "POST /ccs/monitoring-plans/{id}/review with decision == APPROVE"

  - priority: 88
    category: business_constraint
    check: "plan.coverage_score >= 70.00"
    error_id: ERR_MRV_COVERAGE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /ccs/monitoring-plans/{id}/review with decision == APPROVE"

  - priority: 89
    category: business_constraint
    check: "project.pore_space_consent_pct >= project.required_consent_pct OR project.unitization_status == GRANTED"
    error_id: ERR_PORE_SPACE_CONSENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ccs/storage-projects/{id}/authorize-injection"

  - priority: 90
    category: business_constraint
    check: "a GRANT ruling requires project.pore_space_consent_pct >= project.required_consent_pct"
    error_id: ERR_UNITIZATION_CONSENT_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /ccs/storage-projects/{id}/unitization-ruling"

  - priority: 91
    category: business_constraint
    check: "no other TaxCreditClaim of this project has the same tax_year"
    error_id: ERR_DUPLICATE_TAX_YEAR_CLAIM
    http_status: 409
    applies_to: "POST /ccs/tax-credit-claims"

  - priority: 92
    category: business_constraint
    check: "no other LegacyWellbore of this project has the same api_number"
    error_id: ERR_DUPLICATE_API_NUMBER
    http_status: 409
    applies_to: "POST /ccs/legacy-wellbores"

  - priority: 95
    category: business_fiscal
    check: "project.assurance_coverage_status == FUNDED"
    error_id: ERR_ASSURANCE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /ccs/storage-projects/{id}/authorize-injection, POST /ccs/injection-well-permits/{id}/activate"

  - priority: 96
    category: business_fiscal
    check: "the waterfall's requirement snapshot is positive and the instrument's face amount is not exceeded by any single bucket assignment"
    error_id: ERR_ALLOCATION_EXCEEDS_FACE_AMOUNT
    http_status: 422
    applies_to: "POST /ccs/financial-instruments/{id}/allocate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --------------------------------------------------------------- projects
  - method: POST
    path: "/ccs/storage-projects"
    description: "create a storage project in DRAFT with OPEN posture"
    roles: [ProgramAdmin]
    code: 201
    input: [name, operator_name, basin_code, total_project_acreage, requested_annual_injection_rate_tpy, annual_monitoring_cost_usd, "required_consent_pct?", "ca_rig_slots?"]
    output: StorageProject
    side_effects:
      - "initialises status = DRAFT, operational_posture = OPEN, unitization_status = NOT_FILED, closure_status = NOT_REQUESTED"
      - "sets outstanding_acreage = total_project_acreage, effective_annual_monitoring_cost_usd = annual_monitoring_cost_usd, pisc_duration_years = 50"

  - method: GET
    path: "/ccs/storage-projects"
    description: "list storage projects with pagination and status filter"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StorageProject[]
    side_effects: []

  - method: GET
    path: "/ccs/storage-projects/{id}"
    description: "read one storage project including all recomputed derived fields and pisc_elapsed_years at the current logical clock"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier, Landowner]
    code: 200
    input: []
    output: StorageProject
    side_effects: []

  - method: POST
    path: "/ccs/storage-projects/{id}/unitization-petition"
    description: "file a statutory unitization petition, snapshotting the current pore-space consent percentage"
    roles: [ProjectDeveloper]
    code: 200
    input: ["petition_note?"]
    output: StorageProject
    side_effects:
      - "sets unitization_consent_pct_at_filing and unitization_status = FILED"
      - "increments StorageProject.version by 1"

  - method: POST
    path: "/ccs/storage-projects/{id}/unitization-ruling"
    description: "rule on a filed unitization petition; GRANT sweeps UNLEASED and REJECTED tracts into UNITIZED at the statutory bonus"
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "statutory_bonus_per_acre_usd?", "statutory_royalty_rate_pct?"]
    output: StorageProject
    side_effects:
      - "GRANT: sets statutory_bonus_per_acre_usd, sweeps tracts to UNITIZED, recomputes secured_acreage / outstanding_acreage / pore_space_consent_pct / pore_space_bonus_total_usd"
      - "DENY: sets unitization_status = DENIED and changes no tract"
      - "increments StorageProject.version by 1"

  - method: POST
    path: "/ccs/storage-projects/{id}/authorize-injection"
    description: "authorize injection for the project once every permitting, MRV, corrective-action, pore-space and assurance precondition holds"
    roles: [RegulatoryReviewer]
    code: 200
    input: ["authorization_note?"]
    output: StorageProject
    side_effects:
      - "sets status = INJECTION_AUTHORIZED"
      - "increments StorageProject.version by 1"

  - method: POST
    path: "/ccs/storage-projects/{id}/begin-pisc"
    description: "close injection and start post-injection site care, fixing pisc_start_at and pisc_duration_years"
    roles: [ProjectDeveloper]
    code: 200
    input: ["alternative_timeframe_years?"]
    output: StorageProject
    side_effects:
      - "sets pisc_start_at = clock now, records alternative_timeframe_years, recomputes pisc_duration_years"
      - "suspends every ACTIVE permit of the project and reverts its SUBMITTED claims to DRAFT"
      - "recomputes required_financial_assurance_usd and assurance_coverage_status"
      - "increments StorageProject.version by 1"

  - method: POST
    path: "/ccs/storage-projects/{id}/certify-closure"
    description: "issue the site closure certification, release allocated instruments and move the project to CLOSED"
    roles: [RegulatoryReviewer]
    code: 200
    input: [non_endangerment_demonstrated, "closure_note?"]
    output: StorageProject
    side_effects:
      - "sets closure_status = CERTIFIED, closure_certified_by_user_id, closure_certified_at, status = CLOSED"
      - "releases every ALLOCATED FinancialInstrument and resets allocated_assurance_usd to 0"
      - "increments StorageProject.version by 1"

  - method: GET
    path: "/ccs/storage-projects/{id}/legacy-wellbores"
    description: "list the legacy wellbores screened for this project's area of review"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: ["corrective_action_status?", "limit?", "offset?"]
    output: LegacyWellbore[]
    side_effects: []

  - method: GET
    path: "/ccs/storage-projects/{id}/pore-space-tracts"
    description: "list this project's pore-space tracts"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, Landowner]
    code: 200
    input: ["lease_status?", "limit?", "offset?"]
    output: PoreSpaceTract[]
    side_effects: []

  - method: GET
    path: "/ccs/storage-projects/{id}/monitoring-plans"
    description: "list this project's MRV plans"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MonitoringPlan[]
    side_effects: []

  - method: GET
    path: "/ccs/storage-projects/{id}/financial-instruments"
    description: "list this project's financial assurance instruments"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinancialInstrument[]
    side_effects: []

  - method: GET
    path: "/ccs/storage-projects/{id}/remediation-orders"
    description: "list this project's emergency remediation orders"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RemediationOrder[]
    side_effects: []

  # -------------------------------------------------------- geologic models
  - method: POST
    path: "/ccs/geologic-models"
    description: "create a site-characterization model revision in DRAFT; OCC-guarded on the parent project's version"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, expected_project_version, model_label, injection_zone_top_depth_m, injection_zone_thickness_m, seal_thickness_m, capillary_entry_pressure_psi, p10_seal_thickness_m, p10_capillary_entry_pressure_psi, reservoir_pressure_psi, fracture_pressure_psi, permeability_md, porosity_fraction, "assessment_variant?", "supersedes_model_id?"]
    output: GeologicModel
    side_effects:
      - "initialises status = DRAFT, plume_status = NOT_RUN, revision_round_count = 0"
      - "increments StorageProject.version by 1"

  - method: GET
    path: "/ccs/geologic-models"
    description: "list geologic models filtered by project, by superseded predecessor, or by review status"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: ["project_id?", "supersedes_model_id?", "status?", "limit?", "offset?"]
    output: GeologicModel[]
    side_effects: []

  - method: GET
    path: "/ccs/geologic-models/{id}"
    description: "read one geologic model with both seal-integrity indices and the simulated radii"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: []
    output: GeologicModel
    side_effects: []

  - method: POST
    path: "/ccs/geologic-models/{id}/run-plume-simulation"
    description: "run the plume migration simulation, deriving the rate cap, both seal indices, the classification and the AoR radius"
    roles: [ProjectDeveloper]
    code: 200
    input: [injection_years]
    output: GeologicModel
    side_effects:
      - "computes max_injection_rate_tpy, effective_injection_rate_tpy, plume_radius_km, pressure_front_radius_km, aor_radius_km"
      - "computes seal_integrity_index, seal_integrity_index_p10, seal_classification"
      - "sets plume_status = SIMULATED and increments GeologicModel.version by 1"

  - method: POST
    path: "/ccs/geologic-models/{id}/submit"
    description: "submit a simulated model revision for regulatory review"
    roles: [ProjectDeveloper]
    code: 200
    input: ["submission_note?"]
    output: GeologicModel
    side_effects:
      - "increments revision_round_count, sets status = SUBMITTED"
      - "drives the project DRAFT -> SITE_CHARACTERIZATION on the first submit"
      - "increments GeologicModel.version by 1"

  - method: POST
    path: "/ccs/geologic-models/{id}/review"
    description: "rule on a submitted model: ACCEPT, REQUEST_REVISION or REJECT"
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "review_note?"]
    output: GeologicModel
    side_effects:
      - "ACCEPT: status = ACCEPTED, supersedes the project's prior ACCEPTED model, sets governing_geologic_model_id, drives the project to PERMITTING, recomputes required_financial_assurance_usd"
      - "REQUEST_REVISION: status = REVISION_REQUESTED (the model may be resubmitted)"
      - "REJECT: status = REJECTED"
      - "increments GeologicModel.version by 1"

  - method: POST
    path: "/ccs/geologic-models/{id}/finalize-aor"
    description: "publish the accepted model's area of review onto the project, re-screening legacy wellbores and the assurance requirement"
    roles: [ProjectDeveloper]
    code: 200
    input: []
    output: GeologicModel
    side_effects:
      - "cascade: project.aor_radius_km -> wellbore re-screening and risk rescoring -> CA_REQUIRED auto-advance -> corrective_action_completion_pct and required_financial_assurance_usd -> assurance_coverage_status and posture"
      - "sets plume_status = AOR_FINALIZED, increments GeologicModel.version by 1 and StorageProject.version by 1"

  # ------------------------------------------------------- legacy wellbores
  - method: POST
    path: "/ccs/legacy-wellbores"
    description: "register a legacy wellbore for area-of-review screening"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, api_number, distance_from_injector_km, total_depth_m, penetrates_seal, plug_condition, plug_record_available]
    output: LegacyWellbore
    side_effects:
      - "computes risk_score and ca_cost_estimate_usd from the project's current aor_radius_km"
      - "sets corrective_action_status = OUT_OF_AOR when project.aor_radius_km == 0 or distance_from_injector_km > project.aor_radius_km, otherwise IDENTIFIED and then the CA_REQUIRED screening"
      - "recomputes StorageProject.corrective_action_completion_pct and required_financial_assurance_usd"

  - method: GET
    path: "/ccs/legacy-wellbores/{id}"
    description: "read one legacy wellbore with its risk score, cost estimate and corrective-action window"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: []
    output: LegacyWellbore
    side_effects: []

  - method: POST
    path: "/ccs/legacy-wellbores/{id}/schedule-corrective-action"
    description: "schedule the corrective-action work window against the project's rig slots"
    roles: [ProjectDeveloper]
    code: 200
    input: [window_start, window_end]
    output: LegacyWellbore
    side_effects:
      - "sets ca_window_start, ca_window_end, corrective_action_status = CA_SCHEDULED"
      - "increments LegacyWellbore.version by 1"

  - method: POST
    path: "/ccs/legacy-wellbores/{id}/complete-corrective-action"
    description: "record corrective-action completion and refresh the project's completion percentage and assurance requirement"
    roles: [ProjectDeveloper]
    code: 200
    input: ["completion_note?"]
    output: LegacyWellbore
    side_effects:
      - "sets corrective_action_status = CA_COMPLETE"
      - "recomputes StorageProject.corrective_action_completion_pct, required_financial_assurance_usd, assurance_coverage_status"
      - "increments LegacyWellbore.version by 1 and StorageProject.version by 1"

  - method: POST
    path: "/ccs/legacy-wellbores/{id}/waive-corrective-action"
    description: "waive corrective action for a low-risk wellbore that does not penetrate the confining zone"
    roles: [RegulatoryReviewer]
    code: 200
    input: [waiver_rationale]
    output: LegacyWellbore
    side_effects:
      - "sets corrective_action_status = CA_WAIVED and waiver_reviewer_user_id"
      - "recomputes StorageProject.corrective_action_completion_pct, required_financial_assurance_usd, assurance_coverage_status"
      - "increments LegacyWellbore.version by 1 and StorageProject.version by 1"

  # ------------------------------------------------------ pore space tracts
  - method: POST
    path: "/ccs/pore-space-tracts"
    description: "register a pore-space tract and its landowner"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, tract_label, acreage, landowner_user_id, "ownership_pct?"]
    output: PoreSpaceTract
    side_effects:
      - "initialises lease_status = UNLEASED, negotiation_round_count = 0, bonus_settlement_usd = 0, net_acreage = 0"

  - method: GET
    path: "/ccs/pore-space-tracts/{id}"
    description: "read one pore-space tract with its outstanding offer, counter and executed terms"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, Landowner]
    code: 200
    input: []
    output: PoreSpaceTract
    side_effects: []

  - method: POST
    path: "/ccs/pore-space-tracts/{id}/offers"
    description: "send or re-send a lease offer on a tract; OCC-guarded on the tract's version"
    roles: [ProjectDeveloper]
    code: 200
    input: [expected_tract_version, bonus_per_acre_usd, royalty_rate_pct]
    output: PoreSpaceTract
    side_effects:
      - "sets current_offer_bonus_per_acre_usd and current_offer_royalty_rate_pct, clears any counter"
      - "increments negotiation_round_count, sets lease_status = OFFER_SENT"
      - "increments PoreSpaceTract.version by 1"

  - method: POST
    path: "/ccs/pore-space-tracts/{id}/respond"
    description: "landowner response to the outstanding offer: COUNTER, ACCEPT or REJECT"
    roles: [Landowner]
    code: 200
    input: [response, "counter_bonus_per_acre_usd?", "lease_term_start?", "lease_term_end?"]
    output: PoreSpaceTract
    side_effects:
      - "COUNTER: sets counter_bonus_per_acre_usd, lease_status = COUNTERED"
      - "ACCEPT: locks executed terms and the lease term, computes net_acreage and bonus_settlement_usd, recomputes the project's acreage and consent fields"
      - "REJECT: clears the offer fields, lease_status = REJECTED"
      - "increments PoreSpaceTract.version by 1"

  - method: POST
    path: "/ccs/pore-space-tracts/{id}/terminate-lease"
    description: "terminate an executed lease, returning the tract's net acreage to the outstanding pool"
    roles: [ProjectDeveloper]
    code: 200
    input: [termination_reason]
    output: PoreSpaceTract
    side_effects:
      - "clears executed terms and the lease term, zeroes net_acreage and bonus_settlement_usd, lease_status = TERMINATED"
      - "recomputes StorageProject.secured_acreage, outstanding_acreage, pore_space_consent_pct, pore_space_bonus_total_usd"
      - "increments PoreSpaceTract.version by 1 and StorageProject.version by 1"

  # ------------------------------------------------ injection well permits
  - method: POST
    path: "/ccs/injection-well-permits"
    description: "draft a Class VI injection well permit application against an accepted model"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, geologic_model_id, well_name, casing_program, corrosion_resistant_material, requested_injection_pressure_psi, "tubing_packer_installed?"]
    output: InjectionWellPermit
    side_effects:
      - "computes max_injection_pressure_psi = round(0.90 * model.fracture_pressure_psi, 2)"
      - "initialises permit_status = DRAFT, construction_status = NOT_STARTED, authorized_injection_rate_tpy = 0"
      - "recomputes StorageProject.required_financial_assurance_usd"

  - method: GET
    path: "/ccs/injection-well-permits"
    description: "list injection well permits filtered by project, by geologic model, or by permit status"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: ["project_id?", "geologic_model_id?", "permit_status?", "limit?", "offset?"]
    output: InjectionWellPermit[]
    side_effects: []

  - method: GET
    path: "/ccs/injection-well-permits/{id}"
    description: "read one injection well permit with both state dimensions and its MIT history summary"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: []
    output: InjectionWellPermit
    side_effects: []

  - method: POST
    path: "/ccs/injection-well-permits/{id}/submit"
    description: "submit the permit application after the construction-standard and pressure checks"
    roles: [ProjectDeveloper]
    code: 200
    input: ["submission_note?"]
    output: InjectionWellPermit
    side_effects:
      - "increments revision_round_count, sets permit_status = SUBMITTED"
      - "increments InjectionWellPermit.version by 1"

  - method: POST
    path: "/ccs/injection-well-permits/{id}/review"
    description: "advance the regulatory track: BEGIN_TECHNICAL_REVIEW, APPROVE, REQUEST_REVISION or DENY"
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "review_note?"]
    output: InjectionWellPermit
    side_effects:
      - "BEGIN_TECHNICAL_REVIEW: records technical_reviewer_user_id, permit_status = TECHNICAL_REVIEW"
      - "APPROVE: permit_status = APPROVED and recomputes the project's assurance requirement"
      - "REQUEST_REVISION: permit_status = REVISION_REQUESTED"
      - "DENY: permit_status = DENIED and recomputes the project's assurance requirement"
      - "increments InjectionWellPermit.version by 1"

  - method: POST
    path: "/ccs/injection-well-permits/{id}/advance-construction"
    description: "advance the construction dimension one step along NOT_STARTED -> DRILLING -> CASING_SET -> CEMENT_LOGGED -> MIT_PENDING -> COMPLETED"
    roles: [ProjectDeveloper]
    code: 200
    input: [to_construction_status]
    output: InjectionWellPermit
    side_effects:
      - "sets construction_status to the requested successor"
      - "increments InjectionWellPermit.version by 1"

  - method: POST
    path: "/ccs/injection-well-permits/{id}/record-mit"
    description: "record a mechanical integrity test and its PASS/FAIL verdict on the permit"
    roles: [ProjectDeveloper]
    code: 200
    input: [test_type, "annulus_pressure_loss_psi?", "anomaly_detected?"]
    output: InjectionWellPermit
    side_effects:
      - "sets last_mit_type, last_mit_result, last_mit_at and updates mit_pass_count"
      - "increments InjectionWellPermit.version by 1"

  - method: POST
    path: "/ccs/injection-well-permits/{id}/activate"
    description: "activate an approved, constructed, integrity-tested well under an authorized, funded project"
    roles: [RegulatoryReviewer]
    code: 200
    input: ["activation_note?"]
    output: InjectionWellPermit
    side_effects:
      - "sets authorized_injection_rate_tpy from the governing model, activated_at, permit_status = ACTIVE"
      - "drives StorageProject INJECTION_AUTHORIZED -> INJECTION_ACTIVE on the first activation"
      - "increments InjectionWellPermit.version by 1"

  # ------------------------------------------------------ injection periods
  - method: POST
    path: "/ccs/injection-well-permits/{id}/injection-periods"
    description: "report a half-open injection period for an active well and post it to the secure-storage ledger"
    roles: [ProjectDeveloper]
    code: 201
    input: [period_start, period_end, mass_injected_tonnes, "measured_leakage_tonnes?"]
    output: InjectionPeriodRecord
    side_effects:
      - "computes net_stored_tonnes, sets status = ACCEPTED"
      - "recomputes StorageProject.cumulative_stored_tonnes"
      - "increments StorageProject.version by 1"

  - method: GET
    path: "/ccs/injection-well-permits/{id}/injection-periods"
    description: "list the reporting periods of one well"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InjectionPeriodRecord[]
    side_effects: []

  - method: POST
    path: "/ccs/injection-periods/{id}/void"
    description: "void a reported period, reversing its tonnage out of the ledger and any dependent draft or submitted claim"
    roles: [ProjectDeveloper]
    code: 200
    input: [void_reason]
    output: InjectionPeriodRecord
    side_effects:
      - "sets status = VOIDED, voided_at"
      - "recomputes StorageProject.cumulative_stored_tonnes and every dependent claim's tonnages and credit amount"
      - "increments StorageProject.version by 1"

  # ------------------------------------------------------- monitoring plans
  - method: POST
    path: "/ccs/monitoring-plans"
    description: "create an MRV plan in DRAFT"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, plan_label]
    output: MonitoringPlan
    side_effects:
      - "initialises status = DRAFT, both review flags false, all subscores 0, coverage_score 0"

  - method: GET
    path: "/ccs/monitoring-plans/{id}"
    description: "read one MRV plan with its three domain subscores and weighted coverage score"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: []
    output: MonitoringPlan
    side_effects: []

  - method: POST
    path: "/ccs/monitoring-plans/{id}/methods"
    description: "add a subsurface, surface or atmospheric monitoring method to a DRAFT or REVISION_REQUESTED plan"
    roles: [ProjectDeveloper]
    code: 201
    input: [domain, technique, detection_threshold_tpy, frequency_per_year, spatial_coverage_pct]
    output: MonitoringMethod
    side_effects:
      - "computes method_score, sets status = ACTIVE"
      - "recomputes the plan's three subscores and coverage_score"
      - "increments MonitoringPlan.version by 1"

  - method: GET
    path: "/ccs/monitoring-plans/{id}/methods"
    description: "list the monitoring methods of one plan"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: ["domain?", "status?", "limit?", "offset?"]
    output: MonitoringMethod[]
    side_effects: []

  - method: POST
    path: "/ccs/monitoring-methods/{id}/retire"
    description: "retire a monitoring method so it no longer contributes to its domain subscore"
    roles: [ProjectDeveloper]
    code: 200
    input: [retirement_reason]
    output: MonitoringMethod
    side_effects:
      - "sets status = RETIRED"
      - "recomputes the plan's three subscores and coverage_score"
      - "increments MonitoringMethod.version by 1 and MonitoringPlan.version by 1"

  - method: POST
    path: "/ccs/monitoring-plans/{id}/submit"
    description: "submit the MRV plan, opening the technical-review and public-comment tracks"
    roles: [ProjectDeveloper]
    code: 200
    input: ["submission_note?"]
    output: MonitoringPlan
    side_effects:
      - "resets both review flags to false, increments revision_round_count, recomputes all scores, sets status = SUBMITTED"
      - "increments MonitoringPlan.version by 1"

  - method: POST
    path: "/ccs/monitoring-plans/{id}/review"
    description: "close a review track or rule on the plan: COMPLETE_TECHNICAL_REVIEW, COMPLETE_PUBLIC_COMMENT, APPROVE, REQUEST_REVISION or REJECT"
    roles: [RegulatoryReviewer]
    code: 200
    input: [decision, "condition_count?", "review_note?"]
    output: MonitoringPlan
    side_effects:
      - "COMPLETE_TECHNICAL_REVIEW / COMPLETE_PUBLIC_COMMENT: sets the flag and joins to REVIEW_COMPLETE once both are true"
      - "APPROVE with coverage_score >= 85.00: status = APPROVED, condition_count = 0"
      - "APPROVE with 70.00 <= coverage_score < 85.00: status = APPROVED_WITH_CONDITIONS, condition_count from the body, uplifts the project's effective_annual_monitoring_cost_usd by 15% and recomputes the assurance requirement"
      - "REQUEST_REVISION: resets both flags, status = REVISION_REQUESTED"
      - "REJECT: status = REJECTED"
      - "increments MonitoringPlan.version by 1"

  # -------------------------------------------------- financial instruments
  - method: POST
    path: "/ccs/financial-instruments"
    description: "post a financial assurance instrument for the project"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, instrument_type, face_amount_usd]
    output: FinancialInstrument
    side_effects:
      - "initialises status = POSTED, all four buckets 0, unallocated_usd = face_amount_usd, drawn_usd = 0"

  - method: GET
    path: "/ccs/financial-instruments/{id}"
    description: "read one instrument with its four allocated buckets and unallocated remainder"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer]
    code: 200
    input: []
    output: FinancialInstrument
    side_effects: []

  - method: POST
    path: "/ccs/financial-instruments/{id}/allocate"
    description: "run the assurance waterfall over the four cost buckets; OCC-guarded on the instrument's version"
    roles: [ProjectDeveloper]
    code: 200
    input: [expected_instrument_version]
    output: FinancialInstrument
    side_effects:
      - "fills allocated_ca_usd, allocated_plugging_usd, allocated_pisc_usd, allocated_emergency_usd in that order and sets unallocated_usd"
      - "sets status = ALLOCATED, recomputes StorageProject.allocated_assurance_usd and assurance_coverage_status"
      - "increments FinancialInstrument.version by 1 and StorageProject.version by 1"

  - method: POST
    path: "/ccs/financial-instruments/{id}/deallocate"
    description: "reverse an allocation, returning every bucket to the unallocated remainder"
    roles: [ProjectDeveloper]
    code: 200
    input: [deallocation_reason]
    output: FinancialInstrument
    side_effects:
      - "zeroes the four buckets, sets unallocated_usd = face_amount_usd, status = POSTED"
      - "recomputes StorageProject.allocated_assurance_usd and assurance_coverage_status"
      - "increments FinancialInstrument.version by 1 and StorageProject.version by 1"

  # ------------------------------------------------------ tax credit claims
  - method: POST
    path: "/ccs/tax-credit-claims"
    description: "open a tax credit claim for one tax year against an MRV plan"
    roles: [ProjectDeveloper]
    code: 201
    input: [project_id, monitoring_plan_id, tax_year, "claim_variant?", "lca_upstream_emissions_factor?"]
    output: TaxCreditClaim
    side_effects:
      - "computes reported_tonnes, verified_tonnes, credit_rate_usd_per_tonne and credit_amount_usd on the current ledger"
      - "initialises status = DRAFT"

  - method: GET
    path: "/ccs/tax-credit-claims"
    description: "list tax credit claims filtered by project, by MRV plan or by tax year"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: ["project_id?", "monitoring_plan_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: TaxCreditClaim[]
    side_effects: []

  - method: GET
    path: "/ccs/tax-credit-claims/{id}"
    description: "read one claim with both tonnage bases and the tiered credit amount"
    roles: [ProgramAdmin, ProjectDeveloper, RegulatoryReviewer, IndependentVerifier]
    code: 200
    input: []
    output: TaxCreditClaim
    side_effects: []

  - method: POST
    path: "/ccs/tax-credit-claims/{id}/submit"
    description: "submit the secure-geologic-storage report and claim the credit on the reported tonnage basis"
    roles: [ProjectDeveloper]
    code: 200
    input: ["submission_note?"]
    output: TaxCreditClaim
    side_effects:
      - "recomputes both tonnage bases, the tiered rate and credit_amount_usd, sets submitted_by_user_id, status = SUBMITTED"
      - "recomputes StorageProject.pending_credit_usd"
      - "increments TaxCreditClaim.version by 1 and StorageProject.version by 1"

  - method: POST
    path: "/ccs/tax-credit-claims/{id}/verify"
    description: "independent verification of the claim: ALLOW switches the credit onto the lifecycle-verified tonnage, DISALLOW closes it out"
    roles: [IndependentVerifier]
    code: 200
    input: [decision, "verification_note?"]
    output: TaxCreditClaim
    side_effects:
      - "ALLOW: claim_variant = VERIFIED, credit_amount_usd recomputed on verified_tonnes, status = ALLOWED"
      - "DISALLOW: status = DISALLOWED"
      - "sets verifier_user_id, recomputes StorageProject.pending_credit_usd"
      - "increments TaxCreditClaim.version by 1 and StorageProject.version by 1"

  # ----------------------------------------------------- remediation orders
  - method: POST
    path: "/ccs/remediation-orders"
    description: "open an emergency remediation order, freezing the project's operational posture"
    roles: [RegulatoryReviewer]
    code: 201
    input: [project_id, trigger_type, severity, narrative]
    output: RemediationOrder
    side_effects:
      - "sets opened_at, status = OPEN, computes reserve_draw_usd"
      - "cascade: posture FROZEN -> ACTIVE permits SUSPENDED -> SUBMITTED claims reverted to DRAFT -> pending_credit_usd recomputed"
      - "CRITICAL severity additionally drives the project's ALLOCATED instrument to DRAWN"
      - "increments StorageProject.version by 1"

  - method: POST
    path: "/ccs/remediation-orders/{id}/resolve"
    description: "resolve a remediation order and, when it was the last open one, restore posture and reinstate suspended wells"
    roles: [RegulatoryReviewer]
    code: 200
    input: [remediation_summary]
    output: RemediationOrder
    side_effects:
      - "sets status = RESOLVED, resolved_at, decrements open_remediation_count"
      - "restores operational_posture and reinstates SUSPENDED permits to ACTIVE when no open order remains"
      - "increments RemediationOrder.version by 1 and StorageProject.version by 1"

  # --------------------------------------------------------- logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      set the server's logical clock, which every timestamp field and every elapsed-time calculation
      reads. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the
      logical clock reads that instant and never falls back to real wall-clock time.
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "moves the logical clock; subsequent timestamps, pisc_elapsed_years and window comparisons use the new instant"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_TRACT_LANDOWNER
    http: 403
    condition: "a Landowner responds on a tract whose landowner_user_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user id already held an incompatible duty: reviewed a permit of the project being closed, or submitted the claim being verified"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, enum outside its declared set, number outside its declared range, unparseable timestamp, or pagination limit/offset out of range"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no StorageProject with the given id, or a body foreign key names a row belonging to a different project"
  - id: ERR_GEOLOGIC_MODEL_NOT_FOUND
    http: 404
    condition: "no GeologicModel with the given id"
  - id: ERR_WELLBORE_NOT_FOUND
    http: 404
    condition: "no LegacyWellbore with the given id"
  - id: ERR_TRACT_NOT_FOUND
    http: 404
    condition: "no PoreSpaceTract with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no InjectionWellPermit with the given id"
  - id: ERR_MONITORING_PLAN_NOT_FOUND
    http: 404
    condition: "no MonitoringPlan with the given id"
  - id: ERR_MONITORING_METHOD_NOT_FOUND
    http: 404
    condition: "no MonitoringMethod with the given id"
  - id: ERR_INSTRUMENT_NOT_FOUND
    http: 404
    condition: "no FinancialInstrument with the given id"
  - id: ERR_INJECTION_PERIOD_NOT_FOUND
    http: 404
    condition: "no InjectionPeriodRecord with the given id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no TaxCreditClaim with the given id"
  - id: ERR_REMEDIATION_ORDER_NOT_FOUND
    http: 404
    condition: "no RemediationOrder with the given id"
  - id: ERR_PROJECT_POSTURE_FROZEN
    http: 409
    condition: "a child mutation is attempted while project.operational_posture == FROZEN"
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "the project's status does not admit the requested transition, including a unitization action from the wrong unitization_status"
  - id: ERR_INVALID_MODEL_STATE
    http: 409
    condition: "the model's status or plume_status does not admit the requested transition"
  - id: ERR_INVALID_WELLBORE_CA_STATE
    http: 409
    condition: "the wellbore's corrective_action_status does not admit the requested transition"
  - id: ERR_INVALID_TRACT_STATE
    http: 409
    condition: "the tract's lease_status does not admit the requested offer or response"
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "the permit's permit_status does not admit the requested review decision, activation, or period report"
  - id: ERR_INVALID_CONSTRUCTION_SEQUENCE
    http: 409
    condition: "to_construction_status is not the immediate successor of the permit's current construction_status, or activation is attempted before construction_status reaches COMPLETED"
  - id: ERR_MIT_NOT_PASSED
    http: 409
    condition: "the permit's most recent mechanical integrity test verdict is not PASS where the transition requires it"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "the MRV plan's status does not admit the requested decision, the requested review track is already closed, or a method is added to or retired from a plan outside {DRAFT, REVISION_REQUESTED}"
  - id: ERR_INVALID_INSTRUMENT_STATE
    http: 409
    condition: "the instrument's status does not admit allocation or deallocation"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the claim, injection period or remediation order is not in a status that admits the requested transition"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the project's stored version"
  - id: ERR_STALE_TRACT_VERSION
    http: 412
    condition: "expected_tract_version does not equal the tract's stored version"
  - id: ERR_STALE_INSTRUMENT_VERSION
    http: 412
    condition: "expected_instrument_version does not equal the instrument's stored version"
  - id: ERR_SEAL_INTEGRITY_FAIL
    http: 422
    condition: "the governing model's seal_classification is FAIL where the action requires PASS or CONDITIONAL"
  - id: ERR_INJECTION_PRESSURE_EXCEEDS_LIMIT
    http: 422
    condition: "requested_injection_pressure_psi exceeds max_injection_pressure_psi"
  - id: ERR_CASING_PROGRAM_NONCOMPLIANT
    http: 422
    condition: "casing program is not LONG_STRING_CEMENTED_TO_SURFACE, or corrosion-resistant material or tubing-and-packer completion is absent"
  - id: ERR_NON_ENDANGERMENT_NOT_DEMONSTRATED
    http: 422
    condition: "certify-closure is requested with non_endangerment_demonstrated == false"
  - id: ERR_MRV_PLAN_NOT_APPROVED
    http: 422
    condition: "the referenced MRV plan is not in {APPROVED, APPROVED_WITH_CONDITIONS}"
  - id: ERR_AOR_NOT_DELINEATED
    http: 422
    condition: "project.aor_radius_km is 0 because no accepted model has reached plume_status == AOR_FINALIZED"
  - id: ERR_OPEN_REMEDIATION_ORDER
    http: 409
    condition: "the project still has a RemediationOrder with status == OPEN"
  - id: ERR_INJECTION_PERIOD_OVERLAP
    http: 409
    condition: "the requested half-open period overlaps an ACCEPTED period of the same permit"
  - id: ERR_CA_RIG_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested closed corrective-action window intersects the windows of ca_rig_slots or more already-scheduled sibling wellbores"
  - id: ERR_PISC_DURATION_NOT_ELAPSED
    http: 422
    condition: "pisc_elapsed_years is below pisc_duration_years at closure certification"
  - id: ERR_CORRECTIVE_ACTION_INCOMPLETE
    http: 422
    condition: "project.corrective_action_completion_pct is below 100"
  - id: ERR_CA_WAIVER_NOT_ELIGIBLE
    http: 422
    condition: "the wellbore penetrates the seal or its risk_score exceeds 60.00"
  - id: ERR_MRV_DOMAIN_COVERAGE_MISSING
    http: 422
    condition: "one of the three monitoring domains has a zero subscore at approval"
  - id: ERR_MRV_COVERAGE_BELOW_MINIMUM
    http: 422
    condition: "plan.coverage_score is below 70.00 at approval"
  - id: ERR_PORE_SPACE_CONSENT_INSUFFICIENT
    http: 422
    condition: "pore_space_consent_pct is below required_consent_pct and unitization_status is not GRANTED"
  - id: ERR_UNITIZATION_CONSENT_BELOW_THRESHOLD
    http: 422
    condition: "a GRANT ruling is requested while pore_space_consent_pct is below required_consent_pct"
  - id: ERR_DUPLICATE_TAX_YEAR_CLAIM
    http: 409
    condition: "the project already has a TaxCreditClaim for the requested tax_year"
  - id: ERR_DUPLICATE_API_NUMBER
    http: 409
    condition: "the project already has a LegacyWellbore with the requested api_number"
  - id: ERR_ASSURANCE_INSUFFICIENT
    http: 402
    condition: "project.assurance_coverage_status is not FUNDED where the action requires full coverage"
  - id: ERR_ALLOCATION_EXCEEDS_FACE_AMOUNT
    http: 422
    condition: "the allocation is requested while the project's required_financial_assurance_usd is 0, so no bucket requirement exists to fill"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "state program administrator; opens project files and controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /ccs/storage-projects"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /ccs/storage-projects, GET /ccs/storage-projects/{id} and every list/read endpoint"

  - name: ProjectDeveloper
    description: "carbon capture and storage project developer; authors models, permits, plans, leases, ledgers and claims"
    identity: opaque
    exclusive_operations:
      - "POST /ccs/geologic-models"
      - "POST /ccs/geologic-models/{id}/run-plume-simulation"
      - "POST /ccs/geologic-models/{id}/submit"
      - "POST /ccs/geologic-models/{id}/finalize-aor"
      - "POST /ccs/legacy-wellbores"
      - "POST /ccs/legacy-wellbores/{id}/schedule-corrective-action"
      - "POST /ccs/legacy-wellbores/{id}/complete-corrective-action"
      - "POST /ccs/pore-space-tracts"
      - "POST /ccs/pore-space-tracts/{id}/offers"
      - "POST /ccs/pore-space-tracts/{id}/terminate-lease"
      - "POST /ccs/storage-projects/{id}/unitization-petition"
      - "POST /ccs/injection-well-permits"
      - "POST /ccs/injection-well-permits/{id}/submit"
      - "POST /ccs/injection-well-permits/{id}/advance-construction"
      - "POST /ccs/injection-well-permits/{id}/record-mit"
      - "POST /ccs/injection-well-permits/{id}/injection-periods"
      - "POST /ccs/injection-periods/{id}/void"
      - "POST /ccs/monitoring-plans"
      - "POST /ccs/monitoring-plans/{id}/methods"
      - "POST /ccs/monitoring-methods/{id}/retire"
      - "POST /ccs/monitoring-plans/{id}/submit"
      - "POST /ccs/financial-instruments"
      - "POST /ccs/financial-instruments/{id}/allocate"
      - "POST /ccs/financial-instruments/{id}/deallocate"
      - "POST /ccs/tax-credit-claims"
      - "POST /ccs/tax-credit-claims/{id}/submit"
      - "POST /ccs/storage-projects/{id}/begin-pisc"
    shared_operations:
      - "every list/read endpoint of the project's own resources"

  - name: RegulatoryReviewer
    description: "permitting authority reviewer; rules on models, permits and plans, authorizes injection and certifies closure"
    identity: opaque
    exclusive_operations:
      - "POST /ccs/geologic-models/{id}/review"
      - "POST /ccs/injection-well-permits/{id}/review"
      - "POST /ccs/injection-well-permits/{id}/activate"
      - "POST /ccs/monitoring-plans/{id}/review"
      - "POST /ccs/legacy-wellbores/{id}/waive-corrective-action"
      - "POST /ccs/storage-projects/{id}/unitization-ruling"
      - "POST /ccs/storage-projects/{id}/authorize-injection"
      - "POST /ccs/storage-projects/{id}/certify-closure"
      - "POST /ccs/remediation-orders"
      - "POST /ccs/remediation-orders/{id}/resolve"
    shared_operations:
      - "every list/read endpoint"

  - name: IndependentVerifier
    description: "third-party verifier of secure geologic storage reports and lifecycle-adjusted credit claims"
    identity: opaque
    exclusive_operations:
      - "POST /ccs/tax-credit-claims/{id}/verify"
    shared_operations:
      - "GET /ccs/tax-credit-claims, GET /ccs/tax-credit-claims/{id}, GET /ccs/injection-well-permits/{id}/injection-periods, GET /ccs/monitoring-plans/{id} and the other read endpoints"

  - name: Landowner
    description: "surface and pore-space owner negotiating a storage lease; identified by the opaque id stored on the tract"
    identity: opaque
    exclusive_operations:
      - "POST /ccs/pore-space-tracts/{id}/respond"
    shared_operations:
      - "GET /ccs/pore-space-tracts/{id}, GET /ccs/storage-projects/{id}, GET /ccs/storage-projects/{id}/pore-space-tracts"
