              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { err1: "$.data.error_id" }
            - call: "POST /facilities/${facility_id}/reserve-funding"
              payload: { amount_cents: 0, memo: "Zero deposit attempt" }
              as: FinanceController
              as_user_id: "u-fin-a"
              captures: { err2: "$.data.error_id" }
          assert:
            - "first call HTTP status == 422"
            - "first call error_id == ERR_RESERVE_TARGET_EXCEEDED"
            - "second call HTTP status == 422"
            - "second call error_id == ERR_RESERVE_TARGET_EXCEEDED"
