      - name: the_three_remaining_child_listings_filter_strictly_by_their_own_columns
        claim_type: standard_crud
        grounds:
          - endpoints.GET_/exhibit-projects/{id}/artifact-cases
          - endpoints.GET_/exhibit-projects/{id}/interactives
          - endpoints.GET_/punch-items
        distinguishing_aspect: |
          Three listings carry optional filters that must AND together and must never
          widen the result: the case listing filters on two independent state dimensions
          plus the zone FK, the interactive listing filters on a stored status and on a
