        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - state_machines.OrderLine.REQUESTED_to_PICKED
          - entities.CatalogItem.fields.availability
        distinguishing_aspect: |
          Dual failure pairing `state` (priority 8, batch not SHOPPING) against
          `business_constraint` (priority 12, item OUT_OF_STOCK) on POST /order-lines/{id}/pick:
          both are violated by the same call and the response MUST be ERR_BATCH_NOT_SHOPPING,
          never ERR_ITEM_OUT_OF_STOCK.
        test_recipe:
          setup:
            - "Retailer R1 (markup 0.15) with item I1 EACH in_store 400 (catalog 460)."
            - "Customer C1; Shopper S1 in SF-01 with vehicle_capacity_units 10."
            - "Order O7 with one line of I1 x1, submitted and attached to Batch B7 which S1 has CLAIMED but not started shopping."
