            - "A DIFFERENT DemandPlanner is refused identically with ${err_other} == \"ERR_UNAUTHORIZED\" — the denial is about the role, not the identity"
            - "The lead's review returns 200 with ${status_ok} == \"COMMITTED\" and DemandForecast.${fc_id}.consensus_units == 1100"
            - "Both refusals left ConsensusAdjustment.${adj_id} in PROPOSED with reviewed_by_user_id null"

