          Entity pair: Session → Facilitator. Session cannot transition
          DRAFT→SCHEDULED unless the primary_facilitator is in CERTIFIED state
          AND level >= required_facilitator_level AND supervision_required=false.
          Distinct from instance 1 (which was Enrollment→Agreement).
        test_recipe:
          setup:
            - "PeerGroup G ACTIVE, required_facilitator_level=3"
            - "Facilitator F CERTIFIED but level=2 (insufficient)"
