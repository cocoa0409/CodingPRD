          - state_machines.CafeOrder.ROUTED_to_CANCELLED
          - state_machines.CafeOrder.billing_status.UNBILLED_to_CREDITED
        distinguishing_aspect: |
          Depth-3 chain from a single route cancel: route CANCELLED mutates each
          RouteStop (hop 1); the stop's own transition mutates its CafeOrders
