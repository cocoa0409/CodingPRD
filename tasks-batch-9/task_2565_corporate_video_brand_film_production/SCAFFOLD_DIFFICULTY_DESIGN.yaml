            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv_a}", expected_deliverable_version: "${dlv_a_v1}", cut_label: "Long Haul 90 v1", aspect_ratio: "16:9", duration_seconds: 90, has_captions: false, caption_format: "NONE", file_size_gb: 12.4 }
              as: PostSupervisor
