  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: route_stop_window_pairwise_halfopen_overlap
        grounds:
          - validations[priority=9]
          - entities.RouteStop.fields.window_start_min
          - entities.RouteStop.fields.window_end_min
          - errors[ERR_STOP_WINDOW_OVERLAP]
        distinguishing_aspect: |
          RouteStop resource, pairwise half-open [start,end) geometry: a second stop on the same route at
          [500,560) overlaps an existing [480,540) and is rejected; touching at an endpoint would be
          allowed. Distinct from the WashStation aggregate-capacity rule.
        test_recipe:
          setup:
            - "A route with one stop at window [480,540); a second account to place at an overlapping window."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme O1", service_day: "MON", shortage_grace_units: 0 }
              as: ProgramAdmin
