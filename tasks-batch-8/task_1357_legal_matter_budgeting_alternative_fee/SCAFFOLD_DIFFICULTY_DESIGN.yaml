              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/advance_period"
              payload: {}
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/close_books"
              payload: {}
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/matters/${matter_id}/budget_amendments"
              payload: { phase_budget_id: "${pb_id}", delta_cents: 10000, scope_change_reason: "x" }
              as: PricingAnalyst
              captures: { amd_id: $.data.id }
          trigger:
            - call: "POST /firms/${firm_id}/budget_amendments/${amd_id}/submit"
              payload: {}
              as: PricingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERIOD_CLOSED"

  # -------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: budget_amendment_invariant_conserves_budget_consistency
        grounds:
          - calculations.matter_budget_variance
          - state_machines.BudgetAmendment
        distinguishing_aspect: |
          Conserved quantity: Matter.budget_total_cents. Invariant:
          budget_total_cents == Σ PhaseBudget.current_budget_cents for all
          non-voided phases. Approving an amendment then rejecting a
          subsequent counter-amendment then approving a superseding amendment
          must leave budget_total_cents exactly equal to the running sum of
          current_budget_cents across non-voided phases (no drift).
        test_recipe:
          setup:
            - "Matter M1 with two phase budgets PB1=100000, PB2=50000 (both ACTIVE)"
            - "budget_total_cents = 150000"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_p1: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "CL1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_p1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_id: $.data.id, matter_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 300000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr_id}/activate"
              payload: { expected_matter_version: "${matter_v0}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L110", original_budget_cents: 100000 }
              as: PricingAnalyst
              captures: { pb1_id: $.data.id }
            - call: "POST /firms/${firm_id}/matters/${matter_id}/phase_budgets"
              payload: { litigation_stage: "DISCOVERY", task_code: "L210", original_budget_cents: 50000 }
              as: PricingAnalyst
              captures: { pb2_id: $.data.id }
            - call: "POST /firms/${firm_id}/phase_budgets/${pb1_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/phase_budgets/${pb2_id}/activate"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/matters/${matter_id}/budget_amendments"
              payload: { phase_budget_id: "${pb1_id}", delta_cents: 30000, scope_change_reason: "grow" }
              as: PricingAnalyst
              captures: { amd1_id: $.data.id }
            - call: "POST /firms/${firm_id}/budget_amendments/${amd1_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "GET /firms/matters/${matter_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_v1: $.data.version }
            - call: "POST /firms/${firm_id}/budget_amendments/${amd1_id}/decide"
              payload: { decision: "APPROVE", expected_matter_version: "${matter_v1}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
            - call: "POST /firms/${firm_id}/matters/${matter_id}/budget_amendments"
              payload: { phase_budget_id: "${pb2_id}", delta_cents: -10000, scope_change_reason: "reduce" }
              as: PricingAnalyst
              captures: { amd2_id: $.data.id }
            - call: "POST /firms/${firm_id}/budget_amendments/${amd2_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "GET /firms/matters/${matter_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
              captures: { matter_v2: $.data.version }
            - call: "POST /firms/${firm_id}/budget_amendments/${amd2_id}/decide"
              payload: { decision: "APPROVE", expected_matter_version: "${matter_v2}" }
              as: BillingPartner
              as_user_id: "${tk_p1}"
          trigger:
            - call: "GET /firms/matters/${matter_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_p1}"
          assert:
            - "Matter.budget_total_cents == 170000  # 130000 + 40000"
            - "PhaseBudget.${pb1_id}.current_budget_cents == 130000"
            - "PhaseBudget.${pb2_id}.current_budget_cents == 40000"
            - "invariant: budget_total_cents == sum(non-voided PhaseBudget.current_budget_cents)"

      - name: write_down_apply_invariant_conserves_total_value
        grounds:
          - calculations.write_down_allocation
          - state_machines.WriteDownRequest
        distinguishing_aspect: |
          Conserved quantity: actual_fees_cents + write_down_total_cents ==
          pre-write-down actual_fees_cents. The forward action (write-down
          apply) and the implied compensating accounting (write_down_total
          captures the reduction) must sum back to the pre-write-down
          actuals — no value created or destroyed.
        test_recipe:
          setup:
            - "Matter M1 with one BILLED entry TE1 of 80000"
            - "Write-down request for [TE1] amount=30000, approved and applied"
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
