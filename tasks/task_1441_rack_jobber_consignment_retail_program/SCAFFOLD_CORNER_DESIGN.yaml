        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_DRIVER_NOT_ASSIGNED]", roles]
        distinguishing_aspect: "Only the route's assigned driver may check in — drv-2 on drv-1's route is a 403."
        test_recipe:
          setup: ["ACTIVE agreement; route assigned_driver_id drv-1; visit scheduled today"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "DrvCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "DrvStore", store_code: "DR1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route D", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
          trigger:
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-2", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DRIVER_NOT_ASSIGNED (http 403); visit remains SCHEDULED"

      - name: settlement_duplicate_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_SETTLEMENT_ALREADY_EXISTS]"]
        distinguishing_aspect: "One statement per (agreement, period_index) — regenerating period 0 is a 409."
        test_recipe:
          setup: ["ACTIVE agreement; statement for period 0 already generated"]
          setup_api_calls:
