# =============================================================================
# SCAFFOLD_CORNER_DESIGN: sawmill-lumber-production (§1.9 Coverage Index)
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# All chains replay from empty-DB; default logical clock 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: create_log_load_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.LogLoad.fields.purchase_cost_cents, "entities.LogLoad.fields.status]"]
        distinguishing_aspect: "Create returns 201 with status RECEIVED, degrade_pct 0, version 1; client-supplied purchase_cost_cents is ignored (stays null until scale)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1, purchase_cost_cents: 999 }, as: Scaler, captures: { st: $.data.status, cost: $.data.purchase_cost_cents, deg: $.data.degrade_pct, ver: $.data.version } }
          assert:
            - "st == RECEIVED (initial state) and ver == 1"
            - "cost == null (computed field; input value 999 ignored)"
            - "deg == 0 and days_in_deck == 0"

      - name: get_nonexistent_load_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/log-loads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Scaler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and http status 404"

      - name: create_log_load_missing_required_species
        claim_type: required_fields
        grounds: ["entities.LogLoad.fields.species", "validations[priority=4]"]
        distinguishing_aspect: "Missing required species -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", log_grade: SAWLOG_1 }, as: Scaler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_log_load_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.LogLoad.fields.species", "validations[priority=4]"]
        distinguishing_aspect: "species outside the declared enum -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: REDWOOD_X, log_grade: SAWLOG_1 }, as: Scaler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (enum constraint violation)"

      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.LogLoad, state_machines.KilnCharge, state_machines.SalesContract, "state_machines.SalesOrder]"]
        distinguishing_aspect: "Newly created LogLoad/KilnCharge/SalesContract/SalesOrder start in RECEIVED/SCHEDULED/DRAFT/PLACED respectively."
        test_recipe:
          setup: ["one GREEN package available to charge; one effective price list for the spot order"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id, load_st: $.data.status } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id, run_st: $.data.status } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id", pkg_st: "$.data[0].status" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch_st: $.data.status } }
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { c_st: $.data.status } }
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 5 }, as: SalesRep, captures: { o_st: $.data.status } }
          assert:
            - "load_st == RECEIVED at creation (before later transitions)"
            - "run_st == PLANNED and pkg_st == GREEN"
            - "ch_st == SCHEDULED and c_st == DRAFT and o_st == PLACED"

      - name: pagination_and_status_filter_on_log_loads
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /api/log-loads]"]
        distinguishing_aspect: "limit/offset/total_count/has_more obey the envelope defaults; status filter narrows the set."
        test_recipe:
          setup: ["three loads exist; two of them SCALED, one still RECEIVED"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "A", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { l1: $.data.id } }
            - { call: "POST /api/log-loads/${l1}/scale", payload: { scaled_mbf: 10, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads", payload: { supplier_name: "B", species: CEDAR, log_grade: UTILITY }, as: Scaler, captures: { l2: $.data.id } }
            - { call: "POST /api/log-loads/${l2}/scale", payload: { scaled_mbf: 10, price_per_mbf_cents: 20000 }, as: Scaler }
            - { call: "POST /api/log-loads", payload: { supplier_name: "C", species: HEMLOCK_FIR, log_grade: PEELER }, as: Scaler }
          trigger:
            - { call: "GET /api/log-loads", payload: { limit: 2 }, as: Scaler }
            - { call: "GET /api/log-loads", payload: { status: SCALED }, as: Scaler }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "filtered by status=SCALED: 2 items, total_count == 2, has_more == false"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationships
        grounds: [entities.LogLoad.fields.sawing_run_id, entities.LumberPackage.fields.sales_order_id, entities.SalesOrder.fields.contract_id, "entities.GradeInspection.fields.package_id]"]
        distinguishing_aspect: "Every FK is reverse-reachable: children findable from the parent id via filtered list or sub-resource."
        test_recipe:
          setup: ["full pipeline: one consumed load, one ALLOCATED package under a contract order"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 12.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/complete", payload: { readings: [ { package_id: "${pkg}", exit_moisture_pct: 14.0, measured_dry_mbf: 10.5 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${pkg}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { cid: $.data.id } }
            - { call: "POST /api/sales-contracts/${cid}/activate", payload: {}, as: MillManager }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Acme Builders", contract_id: "${cid}", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 10 }, as: SalesRep, captures: { oid: $.data.id } }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep }
          trigger:
            - { call: "GET /api/log-loads", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { rev_load: "$.data[0].id" } }
            - { call: "GET /api/lumber-packages", payload: { sales_order_id: "${oid}" }, as: SalesRep, captures: { rev_pkg: "$.data[0].id" } }
            - { call: "GET /api/sales-orders", payload: { contract_id: "${cid}" }, as: SalesRep, captures: { rev_ord: "$.data[0].id" } }
            - { call: "GET /api/lumber-packages/${pkg}/grade-inspections", payload: {}, as: Grader, captures: { rev_insp: "$.data[0].id" } }
          assert:
            - "rev_load == ${load_id} (FK LogLoad.sawing_run_id reverse-reachable)"
            - "rev_pkg == ${pkg} (FK LumberPackage.sales_order_id reverse-reachable)"
            - "rev_ord == ${oid} (FK SalesOrder.contract_id reverse-reachable)"
            - "grade-inspections sub-resource returns 1 row with action STAMP (FK GradeInspection.package_id reverse-reachable)"

  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: scale_decked_load_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.LogLoad.RECEIVED_to_SCALED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "scale is only valid from RECEIVED; a DECKED load rejects it."
        test_recipe:
          setup: ["one load scaled and decked"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
          trigger:
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 90, price_per_mbf_cents: 24000 }, as: Scaler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and LogLoad.${load_id}.scaled_mbf stays 100"

      - name: stamp_twice_second_returns_invalid_state
        claim_type: idempotency
        grounds: ["state_machines.LumberPackage.DRY_to_STAMPED]"]
        distinguishing_aspect: "STAMP is only valid from DRY; a second STAMP on a STAMPED package is rejected (RESTAMP is the only re-grade path)."
        test_recipe:
          setup: ["one STAMPED package"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/complete", payload: { readings: [ { package_id: "${pkg}", exit_moisture_pct: 14.0, measured_dry_mbf: 18.8 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${pkg}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
          trigger:
            - { call: "POST /api/lumber-packages/${pkg}/grade-inspections", payload: { inspector_grade: NO_3, action: STAMP }, as: Grader, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (STAMP requires DRY; package is STAMPED)"
            - "LumberPackage.${pkg}.stamped_grade stays NO_2"

      - name: ship_placed_order_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.SalesOrder.ALLOCATED_to_SHIPPED]"]
        distinguishing_aspect: "ship requires ALLOCATED; a PLACED order cannot skip allocation."
        test_recipe:
          setup: ["effective price list; one PLACED spot order"]
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 5 }, as: SalesRep, captures: { oid: $.data.id } }
          trigger:
            - { call: "POST /api/sales-orders/${oid}/ship", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and order stays PLACED"

      - name: start_charge_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.KilnCharge.SCHEDULED_to_IN_PROGRESS]"]
        distinguishing_aspect: "start requires SCHEDULED; a second start on an IN_PROGRESS charge is rejected."
        test_recipe:
          setup: ["one IN_PROGRESS charge holding one package; clock at scheduled_start"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
          trigger:
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (already IN_PROGRESS)"

      - name: cancel_shipped_order_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.SalesOrder]"]
        distinguishing_aspect: "SHIPPED is terminal: cancel is rejected and nothing rolls back."
        test_recipe:
          setup: ["one SHIPPED contract order (package allocated then shipped)"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 12.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/complete", payload: { readings: [ { package_id: "${pkg}", exit_moisture_pct: 14.0, measured_dry_mbf: 10.5 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${pkg}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 100, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { cid: $.data.id } }
            - { call: "POST /api/sales-contracts/${cid}/activate", payload: {}, as: MillManager }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Acme Builders", contract_id: "${cid}", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 10 }, as: SalesRep, captures: { oid: $.data.id } }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep }
            - { call: "POST /api/sales-orders/${oid}/ship", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/sales-orders/${oid}/cancel", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (SHIPPED is terminal)"
            - "LumberPackage.${pkg}.status stays SHIPPED"

      - name: abort_completed_charge_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.KilnCharge]"]
        distinguishing_aspect: "COMPLETED is terminal: abort is rejected."
        test_recipe:
          setup: ["one COMPLETED charge"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/complete", payload: { readings: [ { package_id: "${pkg}", exit_moisture_pct: 14.0, measured_dry_mbf: 18.8 } ] }, as: KilnOperator }
          trigger:
            - { call: "POST /api/kiln-charges/${ch}/abort", payload: {}, as: KilnOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (COMPLETED is terminal)"
            - "LumberPackage.${pkg}.status stays DRY"

      - name: undeck_attached_load_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: ["state_machines.LogLoad.DECKED_to_SCALED]"]
        distinguishing_aspect: "undeck requires sawing_run_id IS NULL; a load attached to a PLANNED run cannot leave the deck."
        test_recipe:
          setup: ["one DECKED load attached to a PLANNED run"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer }
          trigger:
            - { call: "POST /api/log-loads/${load_id}/undeck", payload: {}, as: Scaler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (attached to a PLANNED run)"

      - name: restamp_same_grade_keeps_allocation
        claim_type: conditional_cascade
        grounds: [state_machines.LumberPackage.ALLOCATED_to_STAMPED, "entities.GradeInspection.fields.action]"]
        distinguishing_aspect: "RESTAMP whose inspector_grade equals the order's grade does NOT release the package — the release cascade fires only on mismatch."
        test_recipe:
          setup: ["spot order (NO_2, len 12, volume 9) ALLOCATED against one NO_2 package of dry 10.5"]
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 12.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/complete", payload: { readings: [ { package_id: "${pkg}", exit_moisture_pct: 14.0, measured_dry_mbf: 10.5 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${pkg}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 9 }, as: SalesRep, captures: { oid: $.data.id } }
            - { call: "POST /api/sales-orders/${oid}/allocate", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/lumber-packages/${pkg}/grade-inspections", payload: { inspector_grade: NO_2, action: RESTAMP, note: "re-inspection confirms" }, as: Grader }
            - { call: "GET /api/sales-orders/${oid}", payload: {}, as: SalesRep, captures: { o_st: $.data.status, o_alloc: $.data.allocated_mbf } }
          assert:
            - "LumberPackage.${pkg}.status == ALLOCATED still (same grade — no release)"
            - "o_st == ALLOCATED and o_alloc == 10.5 unchanged"

      - name: dispute_cycle_invalid_transitions
        claim_type: invalid_transition
        grounds: ["state_machines.LogLoad.SCALED_to_DISPUTED]"]
        excluded_because:
          difficulty_instance: log_load_scale_dispute_cycle
          rationale: "The SCALED->DISPUTED->SCALED cycle, its term replacement and version bumps are asserted in the §1.8 instance; invalid-from rejections for dispute/resolve are the same ERR_INVALID_STATE mechanism exercised by scale_decked_load_returns_invalid_state."

      - name: kiln_rework_loop_coverage
        claim_type: valid_transition
        grounds: ["state_machines.LumberPackage.IN_KILN_to_GREEN]"]
        excluded_because:
          difficulty_instance: kiln_rework_cycle_green_to_dry
          rationale: "GREEN->IN_KILN->GREEN->IN_KILN->DRY loop fully asserted in §1.8."

  # ---------------------------------------------------------- calculations ---
  - section: calculations
    instances:
      - name: volume_discount_boundary_exactly_10
        claim_type: correct_result
        grounds: ["calculations.spot_unit_price]"]
        distinguishing_aspect: "Volume tier boundary: 10.0 mbf qualifies for the 2% bracket (>=), 9.999 does not."
        test_recipe:
          setup: ["effective DF NO_2 price list base 60000"]
          setup_api_calls:
            - { call: "POST /api/price-lists", payload: { species: DOUGLAS_FIR, grade: NO_2, base_price_per_mbf_cents: 60000, effective_from: "2026-07-01T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "B1", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 10 }, as: SalesRep, captures: { u10: $.data.unit_price_cents } }
            - { call: "POST /api/sales-orders", payload: { customer_name: "B2", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 9.999 }, as: SalesRep, captures: { u9999: $.data.unit_price_cents } }
          assert:
            - "u10 == 58800 (round(60000*1.00)=60000; 10 >= 10 -> 2% -> round(60000*0.98)=58800)"
            - "u9999 == 60000 (9.999 < 10 -> no discount)"

      - name: certified_recovery_waits_for_full_stamp_coverage
        claim_type: input_set_filtering
        grounds: [calculations.lumber_recovery_factor, "entities.SawingRun.fields.recovery_pct_certified]"]
        distinguishing_aspect: "recovery_pct_certified stays null while any package of the run is pre-STAMPED; it appears only once every package is in {STAMPED, ALLOCATED, SHIPPED}."
        test_recipe:
          setup: ["run completed with two DF packages (green 30 + 30 over input 100); both kiln-dried to measured 28.0 each; only p1 stamped"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 200, green_mbf: 30.0 }, { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 200, green_mbf: 30.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer, captures: { prov: $.data.recovery_pct_provisional } }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { p1: "$.data[0].id", p2: "$.data[1].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${p1}", "${p2}"], scheduled_start: "2026-08-02T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/kiln-charges/${ch}/complete", payload: { readings: [ { package_id: "${p1}", exit_moisture_pct: 14.0, measured_dry_mbf: 28.0 }, { package_id: "${p2}", exit_moisture_pct: 14.0, measured_dry_mbf: 28.0 } ] }, as: KilnOperator }
            - { call: "POST /api/lumber-packages/${p1}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
          trigger:
            - { call: "GET /api/sawing-runs/${run_id}", payload: {}, as: Sawyer, captures: { cert_half: $.data.recovery_pct_certified } }
            - { call: "POST /api/lumber-packages/${p2}/grade-inspections", payload: { inspector_grade: NO_2, action: STAMP }, as: Grader }
            - { call: "GET /api/sawing-runs/${run_id}", payload: {}, as: Sawyer, captures: { cert_full: $.data.recovery_pct_certified } }
          assert:
            - "prov == 60.0 (green 60 over input 100)"
            - "cert_half == null (p2 still DRY — input set incomplete)"
            - "cert_full == 56.0 (round(56.0/100*100, 2) over dry tallies 28.0 + 28.0)"

      - name: byproduct_on_hand_and_sale_total
        claim_type: correct_result
        grounds: [calculations.byproduct_on_hand, "entities.ByproductSale.fields.total_cents]"]
        distinguishing_aspect: "On-hand = produced minus sold per product; sale total uses integer-cent rounding."
        test_recipe:
          setup: ["one completed run recorded chip 20.0, sawdust 10.0, bark 8.0 tons"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 20, sawdust_tons: 10, bark_tons: 8 }, as: Sawyer }
          trigger:
            - { call: "POST /api/byproduct-sales", payload: { product: CHIP, volume_tons: 7, price_per_ton_cents: 9000, buyer_name: "PanelBoard Inc" }, as: SalesRep, captures: { sale_total: $.data.total_cents } }
            - { call: "GET /api/byproduct-inventory", payload: {}, as: SalesRep }
          assert:
            - "sale_total == 63000 (round(7 * 9000, 0))"
            - "GET /api/byproduct-inventory: CHIP produced 20, sold 7, on_hand 13; SAWDUST on_hand 10; BARK on_hand 8"

      - name: provisional_vs_certified_recovery_variants
        claim_type: variant_divergence
        grounds: ["calculations.lumber_recovery_factor]"]
        excluded_because:
          difficulty_instance: recovery_factor_provisional_vs_certified
          rationale: "Variant divergence and selection asserted in §1.8."

      - name: estimated_vs_actual_dry_volume_variants
        claim_type: variant_divergence
        grounds: ["calculations.dry_volume_estimate_vs_actual]"]
        excluded_because:
          difficulty_instance: dry_volume_estimated_vs_actual_reconciliation
          rationale: "Estimate-to-actual reconciliation asserted in §1.8."

      - name: deck_degrade_threshold_curve
        claim_type: correct_result
        grounds: ["calculations.deck_degrade_pct]"]
        excluded_because:
          difficulty_instance: degrade_boundary_exactly_14_days
          rationale: "Boundary day-14 vs day-21 and effective_mbf asserted in §1.8."

  # ------------------------------------------------------------ validations ---
  - section: validations
    instances:
      - name: scale_decked_load_missing_field_returns_invalid_request
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "Request-shape (priority 4) beats state (priority 5): scaling a DECKED load while missing scaled_mbf returns ERR_INVALID_REQUEST, not ERR_INVALID_STATE."
        test_recipe:
          setup: ["one DECKED load"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
          trigger:
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { price_per_mbf_cents: 24000 }, as: Scaler, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST (shape checked before state)"

      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Authorization (priority 2) beats existence (priority 3): a SalesRep scaling a nonexistent load gets ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/log-loads/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (role check precedes path-id existence)"

      - name: kiln_end_not_after_start_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_END_BEFORE_START]"]
        distinguishing_aspect: "scheduled_end equal to scheduled_start violates the strict ordering."
        test_recipe:
          setup: ["one GREEN package"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-03T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_END_BEFORE_START (end must be strictly after start)"
            - "LumberPackage.${pkg}.status stays GREEN (no charge side effects)"

      - name: start_charge_before_window_returns_schedule_in_past
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "state_machines.KilnCharge.SCHEDULED_to_IN_PROGRESS", "errors[ERR_SCHEDULE_IN_PAST]"]
        distinguishing_aspect: "Starting before scheduled_start is a temporal violation even though the charge is SCHEDULED."
        test_recipe:
          setup: ["one SCHEDULED charge with scheduled_start 2026-08-03; clock at 2026-08-02"]
          setup_api_calls:
            - { call: "POST /api/log-loads", payload: { supplier_name: "Olympic Log Co", species: DOUGLAS_FIR, log_grade: SAWLOG_1 }, as: Scaler, captures: { load_id: $.data.id } }
            - { call: "POST /api/log-loads/${load_id}/scale", payload: { scaled_mbf: 100, price_per_mbf_cents: 25000 }, as: Scaler }
            - { call: "POST /api/log-loads/${load_id}/deck", payload: {}, as: Scaler }
            - { call: "POST /api/sawing-runs", payload: { saw_line: LINE_A, scheduled_date: "2026-08-02", sawing_pattern: DIMENSION_2X4, log_load_ids: ["${load_id}"] }, as: Sawyer, captures: { run_id: $.data.id } }
            - { call: "POST /api/sawing-runs/${run_id}/complete", payload: { packages: [ { species: DOUGLAS_FIR, dimension: 2X4, length_ft: 12, pieces: 100, green_mbf: 20.0 } ], chip_tons: 5, sawdust_tons: 2, bark_tons: 2 }, as: Sawyer }
            - { call: "GET /api/lumber-packages", payload: { sawing_run_id: "${run_id}" }, as: Sawyer, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/kiln-charges", payload: { chamber: KILN_1, species: DOUGLAS_FIR, package_ids: ["${pkg}"], scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-06T00:00:00Z", target_moisture_pct: 15.0 }, as: KilnOperator, captures: { ch: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MillManager }
          trigger:
            - { call: "POST /api/kiln-charges/${ch}/start", payload: {}, as: KilnOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SCHEDULE_IN_PAST and KilnCharge.${ch}.status stays SCHEDULED"

      - name: contract_volume_exceeded_on_placement
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "calculations.contract_drawdown", "errors[ERR_CONTRACT_VOLUME_EXCEEDED]"]
        distinguishing_aspect: "Order volume 6 against committed 5 remaining -> ERR_CONTRACT_VOLUME_EXCEEDED; no reservation recorded."
        test_recipe:
          setup: ["ACTIVE contract committed 5"]
          setup_api_calls:
            - { call: "POST /api/sales-contracts", payload: { customer_name: "Acme Builders", species: DOUGLAS_FIR, grade: NO_2, committed_mbf: 5, contract_price_per_mbf_cents: 60000, start_date: "2026-08-01", end_date: "2026-09-01" }, as: MillManager, captures: { cid: $.data.id } }
            - { call: "POST /api/sales-contracts/${cid}/activate", payload: {}, as: MillManager }
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Acme Builders", contract_id: "${cid}", species: DOUGLAS_FIR, grade: NO_2, length_spec: 12, volume_mbf: 6 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONTRACT_VOLUME_EXCEEDED and SalesContract.${cid}.reserved_mbf stays 0"

      - name: spot_order_without_price_list_returns_no_price_list
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "calculations.spot_unit_price", "errors[ERR_NO_PRICE_LIST]"]
        distinguishing_aspect: "No effective PriceList row for (HEMLOCK_FIR, NO_2) at placement -> ERR_NO_PRICE_LIST."
        test_recipe:
          setup: ["empty DB (no price lists)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/sales-orders", payload: { customer_name: "Spot Buyer", species: HEMLOCK_FIR, grade: NO_2, length_spec: 12, volume_mbf: 5 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_PRICE_LIST"

      - name: duplicate_load_in_run_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_LOAD_IN_RUN]"]
        distinguishing_aspect: "The same load twice in one run, or a load already attached to another PLANNED run, is rejected identically."
        test_recipe:
          setup: ["two DECKED loads L1, L2"]
          setup_api_calls:
