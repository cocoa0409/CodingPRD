      - name: same_officer_must_not_review_and_then_approve_the_same_rule
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 20].ERR_SEGREGATION_OF_DUTIES
          - roles.ArticulationOfficer
          - endpoints[POST /articulation-rules/{rule_id}/approve]
        distinguishing_aspect: |
          Segregation of duties is enforced on X-User-ID INSIDE one role: the
          officer who submitted the rule for review is refused at approve with
          ERR_SEGREGATION_OF_DUTIES (409) at priority 20 — after the rule-state and
          recommendation-state gates pass and after the OCC version check — while a
          different officer with the identical payload succeeds.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; Course CS150 exists."
            - "PUBLISHED recommendation CLEP-CS (version 2 after publish, terms_version 1)."
            - "ArticulationRule CLEP-CS -> CS150 submitted for review by X-User-ID officer-reviewer, so the rule is UNDER_REVIEW with reviewed_by officer-reviewer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "POST /credential-recommendations"
              payload: { source_type: "CREDIT_BY_EXAM", credential_code: "CLEP-CS", title: "CLEP Computer Science", issuing_body: "College Board", recommended_credits: 6, recommended_level: "LOWER", effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_id: "$.data.id" }
            - call: "POST /credential-recommendations/${rec_id}/publish"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2026-06-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rule_id: "$.data.id" }
            - call: "POST /articulation-rules/${rule_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rule_status: "$.data.status" }
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_v2: "$.data.version" }
          trigger:
            - call: "POST /articulation-rules/${rule_id}/approve"
              payload: { expected_recommendation_version: "${rec_v2}" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { err1: "$.data.error_id" }
          assert:
            - "before the trigger ArticulationRule.${rule_id}.status == UNDER_REVIEW and CredentialRecommendation.${rec_id}.status == PUBLISHED with version 2"
            - "the trigger returns status 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "ArticulationRule.${rule_id}.status is still UNDER_REVIEW, approved_by is null and pinned_recommendation_version is null"
            - "the identical call as X-User-ID officer-approver returns 200 with status APPROVED, pinned_recommendation_version == 1 and approved_by == officer-approver"
            - "a stale expected_recommendation_version 1 as officer-approver returns 412 ERR_STALE_RECOMMENDATION_VERSION — the OCC check at priority 13 precedes the priority-20 duty check"
            - "on the appeal side, assigning a reviewer whose id appears in the appeal's prior_scorer_assessor_ids returns 409 ERR_SEGREGATION_OF_DUTIES, and an AppealReviewer deciding an appeal they scored returns 403 ERR_NOT_APPEAL_PANEL_MEMBER"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_student_version_at_award_is_refused_then_a_refreshed_read_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[award-stale-student-ledger]
          - validations[priority 12].ERR_STALE_STUDENT_VERSION
          - endpoints[POST /pla-claims/{claim_id}/award]
          - entities.Student.version
        distinguishing_aspect: |
          The declared OCC rule guards the Student ledger the cap decision reads,
          not the claim: after the coordinator reads version N a Registrar PATCH
          bumps the student to N+1, so awarding with expected_student_version N
          returns 412 ERR_STALE_STUDENT_VERSION even though the award is
          otherwise perfectly legal, and the retry with the refreshed version
          succeeds — proving the check is version identity, not cap arithmetic.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; Program BSCS (120 / residency 30 / pla_max 30 / 2500 bp -> effective cap 30); Course CS150 6 credits LOWER dept CS with OC1 8000 bp and OC2 2000 bp."
            - "Student S-1001 MATRICULATED, transfer 0, institutional 60; assessor E-9001 ACTIVE CS rank 2."
            - "PORTFOLIO claim for 6 credits carried all the way to SCORED with recommendation PASS and verified_coverage_bp 10000; invoice waived so the fee gate is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlaCoordinator
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design a program", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test a program", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id", stu_v0: "$.data.version" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Regression suite", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /fee-invoices/${inv_id}/waive"
              payload: { waive_reason: "Pilot cohort waiver" }
              as: PlaCoordinator
            - call: "POST /pla-claims/${claim_id}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
              captures: { asg_id: "$.data.id" }
            - call: "POST /assessor-assignments/${asg_id}/accept"
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc1_id}", points_awarded: 4, narrative: "Exceeds" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc2_id}", points_awarded: 4, narrative: "Exceeds" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/complete"
              payload: { recommendation: "PASS" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "GET /students/${stu_id}"
              as: PlaCoordinator
              captures: { stu_vread: "$.data.version" }
            - call: "PATCH /students/${stu_id}"
              payload: { institutional_credits_earned: 66 }
              as: Registrar
              captures: { stu_vbumped: "$.data.version" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/award"
              payload: { expected_student_version: "${stu_vread}", credits_awarded: 6 }
              as: PlaCoordinator
              captures: { err1: "$.data.error_id" }
          assert:
            - "the PATCH advanced the student: ${stu_vbumped} == ${stu_vread} + 1"
            - "the trigger returns status 412 with data.error_id == ERR_STALE_STUDENT_VERSION"
            - "the refusal is total: PlaClaim.${claim_id}.assessment_status is still SCORED, credits_awarded is null, Student.${stu_id}.pla_credits_awarded is still 0 and pla_credits_reserved is still 6"
            - "Student.${stu_id}.version is unchanged by the failed award — a 412 is not a write"
            - "a fresh GET /students/${stu_id} then awarding with that version returns 200, assessment_status AWARDED, credits_awarded 6, pla_credits_reserved 0 and pla_credits_awarded 6"
            - "the successful award bumps Student.version again, so replaying the very same award payload a second time returns 412 ERR_STALE_STUDENT_VERSION rather than 409 ERR_CLAIM_ALREADY_TERMINAL — the OCC check at priority 12 precedes the terminal check at priority 14"
            - "omitting expected_student_version entirely returns 422 ERR_INVALID_REQUEST at priority 8; expected_student_version 0 or -1 also returns 422 ERR_INVALID_REQUEST, not 412"
            - "every mutating write on the student — award, deny, transcript-posting, reversal and each PATCH — increments version by exactly 1, while GET /students/${stu_id} repeated three times leaves it flat"

      - name: articulation_approve_occ_stale_recommendation_version_is_covered_by_difficulty_design
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[articulation-approve-stale-recommendation]
          - validations[priority 13].ERR_STALE_RECOMMENDATION_VERSION
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_recommendation_version_412_beats_articulation_window_overlap_409
          rationale: |
            The second §1.2.1 concurrency rule is already exercised end to end by
            that §1.8 instance, which stales the recommendation with a sibling
            rule approval and then shows the 412 winning over the priority-29
            window-overlap 409, plus the pin taken against terms_version on the
            successful retry. A dedicated §1.9 instance would restate it.

      - name: cascading_side_effect_chains_are_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[PlaClaim.credit_status]
          - state_machines[CredentialRecommendation]
        excluded_because:
          difficulty_instance: transitive_cascade / recommendation_retire_four_hop_cascade_to_invoice_and_student_ledger
          rationale: |
            The deepest declared chain — recommendation retire -> rule suspend ->
            claim hold -> invoice recompute -> student ledger release — is
            verified hop by hop there, and the withdraw waterfall plus the
            posting-reversal ledger restoration instances cover ordering
            sensitivity and partial-application behaviour. Nothing is left for a
            separate breadth probe.

      - name: dual_variant_cap_arithmetic_is_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.program_pla_credit_capacity.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pla_capacity_reserved_inclusive_vs_posted_only_divergence
          rationale: |
            Both declared variant pairs are already pinned by §1.8: that instance
            drives reserved_inclusive and posted_only apart on identical data and
            checks the delta on the reserved -> awarded -> posted switch, and the
            coverage instance does the same for provisional vs verified. A §1.9
            restatement would add no distinct claim.

