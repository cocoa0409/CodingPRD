      - name: ep_response_envelope_shapes_for_object_array_and_error
        claim_type: standard_crud
        grounds:
          - response_envelope.success
          - response_envelope.error
          - response_envelope.pagination_defaults
          - endpoints.GET_/treatment-facilities/{facilityId}
          - endpoints.GET_/treatment-facilities
        distinguishing_aspect: "The same resource read three ways pins all three envelope shapes: response_type \"object\" for the single read, \"array\" with limit 10 / offset 0 / total_count 1 / has_more false for the unparameterised list, and \"error\" carrying error_id plus message for the unknown id."
        test_recipe:
          setup:
            - "One facility exists and nothing else. No query parameters are supplied to the list call, so the declared pagination defaults apply."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /treatment-facilities/${fac_id}"
              payload: {}
              as: PublicLiaison
            - call: "GET /treatment-facilities"
              payload: {}
              as: PublicLiaison
            - call: "GET /treatment-facilities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PublicLiaison
              captures: { err: $.data.error_id }
          assert:
            - "the first response response_type == \"object\""
            - "the first response meta.api_request_id is present and non-blank"
            - "the first response data.id == ${fac_id}"
            - "the second response response_type == \"array\""
            - "the second response total_count == 1"
            - "the second response has_more == false"
            - "the second response limit == 10 and offset == 0"
            - "the third response response_type == \"error\""
            - "the third response HTTP status == 404"
            - "${err} == \"ERR_FACILITY_NOT_FOUND\""
            - "the third response data.message is present and non-blank"

