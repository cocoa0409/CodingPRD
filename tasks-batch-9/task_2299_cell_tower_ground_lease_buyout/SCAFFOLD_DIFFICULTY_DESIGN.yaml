            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/tenancies", payload: { carrier_name: "Vantage Wireless", carrier_credit_tier: "INVESTMENT_GRADE", tenancy_type: "ANCHOR", monthly_rent_share_cents: 250000, term_end_date: "2034-06-30" }, as: AcquisitionAnalyst, captures: { t1_id: $.data.id } }
            - { call: "GET /lease-buyouts/lease-streams/${ls_id}", payload: {}, as: AcquisitionAnalyst, captures: { ls_v: $.data.version } }
            - { call: "POST /lease-buyouts/lease-streams/${ls_id}/valuations", payload: { method: "LUMP_SUM_PERPETUAL", expected_lease_stream_version: "${ls_v}" }, as: AcquisitionAnalyst, captures: { val_id: $.data.id } }
            - { call: "POST /lease-buyouts/stream-valuations/${val_id}/approve", payload: {}, as: PortfolioManager, as_user_id: "pm-alice" }
            - { call: "POST /lease-buyouts/deals", payload: { portfolio_id: "${pf_id}", lease_stream_id: "${ls_id}", valuation_id: "${val_id}", easement_type: "PERPETUAL_EASEMENT", revenue_share_bps: 2500 }, as: AcquisitionAnalyst, captures: { deal_id: $.data.id } }
            - { call: "POST /lease-buyouts/deals/${deal_id}/outreach", payload: {}, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/deals/${deal_id}/offers", payload: { offer_type: "LUMP_SUM", amount_cents: 36000000, expires_at: "2026-12-31T00:00:00Z" }, as: AcquisitionAnalyst, captures: { offer_id: $.data.id } }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "SEND" }, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "COUNTER", counter_amount_cents: 42000000 }, as: Landowner, as_user_id: "${lo_id}" }
          trigger:
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "REVISE", amount_cents: 37000000 }, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "COUNTER", counter_amount_cents: 43000000 }, as: Landowner, as_user_id: "${lo_id}" }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "REVISE", amount_cents: 38000000 }, as: AcquisitionAnalyst }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "COUNTER", counter_amount_cents: 44000000 }, as: Landowner, as_user_id: "${lo_id}" }
            - { call: "POST /lease-buyouts/offers/${offer_id}/transitions", payload: { action: "REVISE", amount_cents: 39000000 }, as: AcquisitionAnalyst, captures: { err_rounds: $.data.error_id } }
          assert:
            - "The final REVISE responds 422 with error_id ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "Deal.${deal_id}.negotiation_rounds == 3"
