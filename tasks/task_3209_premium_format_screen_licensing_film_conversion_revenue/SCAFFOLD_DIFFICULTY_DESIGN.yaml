scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1: dual_variant_calc — different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: statement_provisional_vs_final_diverge_while_days_unreported
        grounds:
          - calculations.provisional_revenue_share
          - calculations.final_revenue_share
          - entities.RevenueShareStatement.fields.provisional_total_cents
          - entities.RevenueShareStatement.fields.final_total_cents
        distinguishing_aspect: |
          RevenueShareStatement (revenue-share domain) carries two valid
          algorithms over identical reports: forward-looking provisional
          includes a forecast for unreported days; chronological final excludes
          them. With one 7-day CONFIRMED slot, one VALIDATED report of
          $100,000.00, and six unreported days, provisional != final.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-07T00:00:00Z. Market APPROVED, agreement ACTIVE with tiers 12%/15%/18%, auditorium OPERATING (capacity 200), studio ACTIVE, film (100 min, release 2026-09-05) IN_DISTRIBUTION, conversion APPROVED_FOR_RELEASE, window W37 (2026-09-07 .. 2026-09-14, pool 10_000_000 s) OPEN_FOR_BOOKING."
            - "Slot covering the whole 7-day window is CONFIRMED (committed_screen_seconds = 7*2*100*60 = 84_000 s)."
            - "One BoxOfficeReport for 2026-09-07 with gross 10_000_000 cents, admissions 1300, VALIDATED. Reports for 09-08 .. 09-13 have NOT been submitted."
            - "A DRAFT RevenueShareStatement for (agreement, window) exists."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
            - { call: "POST /v1/agreements/${agr_id}/sign", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums", payload: { agreement_id: "${agr_id}", auditorium_label: "S1", screen_geometry: { width_m: 20, height_m: 11, curvature_deg: 60 }, seating_capacity: 200, supported_formats: ["PREMIUM_2D"], sound_calibration_profile: { spl_target_db: 85, eq_curve_id: "STD", channel_count: 12 } }, as: PlatformContractManager, captures: { aud_id: $.data.id } }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-construction", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-calibration", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/certify", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/open", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/agreements/${agr_id}/activate", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/studios", payload: { studio_legal_name: "St A", contact_email: "a@st.com" }, as: StudioRelationshipManager, captures: { stu_id: $.data.id } }
            - { call: "POST /v1/studios/${stu_id}/activate", payload: {}, as: StudioRelationshipManager }
            - { call: "POST /v1/films", payload: { studio_id: "${stu_id}", title: "Film X", runtime_minutes: 100, worldwide_release_date: "2026-09-05T00:00:00Z", format_targets: ["PREMIUM_2D"] }, as: StudioRelationshipManager, captures: { film_id: $.data.id } }
            - { call: "POST /v1/conversion-orders", payload: { studio_film_id: "${film_id}", target_format: "PREMIUM_2D", scheduled_post_start_date: "2026-09-01T00:00:00Z", scheduled_post_end_date: "2026-09-03T00:00:00Z" }, as: StudioRelationshipManager, captures: { conv_id: $.data.id } }
            - { call: "POST /v1/conversion-orders/${conv_id}/begin-post", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/conversion-orders/${conv_id}/submit-for-qc", payload: {}, as: PostProductionScheduler }
            - { call: "POST /v1/conversion-orders/${conv_id}/approve-release", payload: {}, as: QualityAssuranceReviewer }
            - { call: "POST /v1/release-windows", payload: { window_label: "W37", window_start_date: "2026-09-07T00:00:00Z", window_end_date: "2026-09-14T00:00:00Z", total_premium_screen_seconds_pool: 10000000 }, as: ReleaseScheduler, captures: { win_id: $.data.id, win_v0: $.data.version } }
            - { call: "POST /v1/release-windows/${win_id}/open", payload: {}, as: ReleaseScheduler }
            - { call: "POST /v1/screen-slots", payload: { window_id: "${win_id}", auditorium_id: "${aud_id}", studio_film_id: "${film_id}", conversion_order_id: "${conv_id}", slot_start_date: "2026-09-07T00:00:00Z", slot_end_date: "2026-09-14T00:00:00Z", showings_per_day: 2, expected_window_version: "${win_v0}" }, as: ReleaseScheduler, captures: { slot_id: $.data.id } }
            - { call: "POST /v1/screen-slots/${slot_id}/confirm", payload: {}, as: ReleaseScheduler }
            - { call: "POST /v1/box-office-reports", payload: { screen_slot_id: "${slot_id}", reported_date: "2026-09-07T00:00:00Z", gross_receipts_cents: 10000000, admissions: 1300, submission_channel: "API_INGEST" }, as: BoxOfficeAnalyst, captures: { rpt_id: $.data.id } }
            - { call: "POST /v1/box-office-reports/${rpt_id}/validate", payload: {}, as: BoxOfficeAnalyst }
            - { call: "POST /v1/revenue-share-statements", payload: { agreement_id: "${agr_id}", window_id: "${win_id}" }, as: BoxOfficeAnalyst, captures: { stmt_id: $.data.id } }
          trigger:
            - { call: "GET /v1/revenue-share-statements/${stmt_id}", payload: {}, as: BoxOfficeAnalyst }
          assert:
            - "RevenueShareStatement.${stmt_id}.provisional_total_cents == 1920000"
            - "RevenueShareStatement.${stmt_id}.final_total_cents == 1200000"
            - "provisional_total_cents != final_total_cents"

      - name: auditorium_quality_score_arithmetic_vs_recency_diverge
        grounds:
          - calculations.auditorium_quality_score
          - entities.Auditorium.fields.quality_score_arithmetic
          - entities.Auditorium.fields.quality_score_recency
        distinguishing_aspect: |
          Auditorium (quality-scoring domain, a different entity domain from
          RevenueShareStatement) carries two valid severity-weighting variants:
          flat arithmetic mean vs linear recency-decay. Two WARNING alerts
          raised 10 days apart produce arithmetic 3.0000 and recency 2.6667.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01. Market APPROVED, agreement ACTIVE, auditorium OPERATING."
            - "QAAlert #1 WARNING raised at 2026-09-01; QAAlert #2 WARNING raised at 2026-09-11; logical clock advanced to 2026-09-21. Both alerts still RAISED (terminal state not required for inclusion)."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/agreements", payload: { exhibitor_legal_name: "Exh A", market_id: "${mkt_id}", agreement_type: "REVENUE_SHARE", committed_screen_count: 1, revenue_share_tier1_pct: 0.12, revenue_share_tier2_pct: 0.15, revenue_share_tier3_pct: 0.18, term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-09-01T00:00:00Z" }, as: PlatformContractManager, captures: { agr_id: $.data.id } }
            - { call: "POST /v1/agreements/${agr_id}/sign", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums", payload: { agreement_id: "${agr_id}", auditorium_label: "S1", screen_geometry: { width_m: 20, height_m: 11, curvature_deg: 60 }, seating_capacity: 200, supported_formats: ["PREMIUM_2D"], sound_calibration_profile: { spl_target_db: 85, eq_curve_id: "STD", channel_count: 12 } }, as: PlatformContractManager, captures: { aud_id: $.data.id } }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-construction", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-calibration", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/certify", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/open", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/qa-alerts", payload: { auditorium_id: "${aud_id}", alert_code: "SOUND_DRIFT", severity: "WARNING" }, as: FieldEngineer, captures: { alert_1: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/qa-alerts", payload: { auditorium_id: "${aud_id}", alert_code: "LAMP_DEGRADED", severity: "WARNING" }, as: FieldEngineer, captures: { alert_2: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-21T00:00:00Z" }, as: PlatformContractManager }
          trigger:
            - { call: "GET /v1/auditoriums/${aud_id}", payload: {}, as: FieldEngineer }
          assert:
            - "Auditorium.${aud_id}.quality_score_arithmetic == 3.0000"
            - "Auditorium.${aud_id}.quality_score_recency == 2.6667"
            - "quality_score_arithmetic != quality_score_recency"

  # ===========================================================================
  # Rule 2: combinatorial_formula — different modes (a) vs (b)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_marginal_share_splits_a_day_across_tier1_and_tier2
        grounds:
          - calculations.apply_tiered_marginal_share
          - calculations.final_revenue_share
        distinguishing_aspect: |
          Mode (a) — nested conditional / tiered-rate selection with 3 inputs
          (running_slot_gross_before, today's gross, tier rates) and non-linear
          interaction. A single day's report straddling the $100,000.00 tier-1
          cap splits into tier-1 + tier-2 marginal portions.
        test_recipe:
          setup:
            - "Logical clock 2026-09-07. Standard setup: agreement tiers 12%/15%/18%; auditorium OPERATING; film 100 min; conversion APPROVED_FOR_RELEASE; window 2026-09-07..2026-09-14 OPEN; slot CONFIRMED covering whole window with showings_per_day=2."
            - "Day 1 (2026-09-07) VALIDATED with gross 8_000_000 cents. Day 2 (2026-09-08) VALIDATED with gross 4_000_000 cents. Cumulative slot gross now 12_000_000 cents — day 2 straddles the 10_000_000 tier-1 cap."
            - "Statement in DRAFT. All reports VALIDATED."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
