            - call: "POST /retail/sales-reports/${r1_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${r2_id}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "POST /retail/sales-reports/${r2_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/audits"
