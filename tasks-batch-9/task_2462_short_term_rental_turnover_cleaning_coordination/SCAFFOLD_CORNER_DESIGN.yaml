            - "GET /bookings?property_id=${p1} returns total_count == 0 - six rejected requests wrote nothing"

  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_rbac_no_role_can_perform_another_roles_exclusive_operation
        claim_type: Exclusive Operation Denial
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.Coordinator.exclusive_operations
          - roles.Cleaner.exclusive_operations
          - roles.QualityAuditor.exclusive_operations
          - validations[priority=2]
        distinguishing_aspect: |
          role_model is segregation_of_duties, not hierarchical_override, so there is no
          super-role: PlatformAdmin is refused a Coordinator's booking write and a Cleaner's
          submit exactly as a Cleaner is refused an assign. Each denial is 403 ERR_UNAUTHORIZED
          and is raised BEFORE the body is validated, so every probe carries an otherwise-valid
          payload and the resource state is re-read afterwards to prove nothing happened.
        test_recipe:
          setup:
            - "Property P1 with bookings OUT-1 / IN-1, turnover T1 at version 1, and Cleaner C (ZONE_A, skill 4)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
          trigger:
            - call: "POST /cleaners"
              payload: { name: "Sneaky Hire", home_zone_code: "ZONE_A", skill_level: 3 }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e1: "$.data.error_id" }
            - call: "POST /cleaners/${cc}/status"
              payload: { action: "SUSPEND", reason: "not your call" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e2: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e3: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${cc}" }
              as: Cleaner
              as_user_id: "${cc}"
              captures: { e4: "$.data.error_id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "ADMIN-1", guest_name: "Admin Guest", checkin_at: "2026-10-01T21:00:00Z", checkout_at: "2026-10-03T16:00:00Z" }
              as: PlatformAdmin
              captures: { e5: "$.data.error_id" }
            - call: "POST /turnovers/${t1}/start"
              payload: {}
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e6: "$.data.error_id" }
            - call: "POST /quality-audits"
              payload: { turnover_id: "${t1}", score: 90 }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { e7: "$.data.error_id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}" }
              as: QualityAuditor
              as_user_id: "auditor-1"
              captures: { e8: "$.data.error_id" }
            - call: "POST /bookings/${b_out}/cancel"
              payload: { cancellation_reason: "owner walked in" }
              as: PropertyOwner
              as_user_id: "${p1}"
              captures: { e9: "$.data.error_id" }
            - call: "GET /turnovers/${t1}"
              payload: {}
              as: Coordinator
              captures: { t1_after: "$.data.status", t1_v_after: "$.data.version" }
            - call: "GET /cleaners/${cc}"
              payload: {}
              as: Coordinator
              captures: { cc_after: "$.data.status" }
          assert:
            - "${e1} == ERR_UNAUTHORIZED (403) - POST /cleaners is PlatformAdmin-exclusive"
            - "${e2} == ERR_UNAUTHORIZED (403) - cleaner lifecycle is PlatformAdmin-exclusive"
            - "${e3} == ERR_UNAUTHORIZED (403) - even the test-driving clock route is role-guarded"
            - "${e4} == ERR_UNAUTHORIZED (403) - a Cleaner cannot assign work to itself"
            - "${e5} == ERR_UNAUTHORIZED (403) - PlatformAdmin is NOT a superset of Coordinator"
            - "${e6} == ERR_UNAUTHORIZED (403) - starting a clean is Cleaner-exclusive"
            - "${e7} == ERR_UNAUTHORIZED (403) - sampling an audit is QualityAuditor-exclusive"
            - "${e8} == ERR_UNAUTHORIZED (403) - creating turnovers is Coordinator-exclusive"
            - "${e9} == ERR_UNAUTHORIZED (403) - PropertyOwner has an empty exclusive_operations list and only reads"
            - "${t1_after} == PENDING_ASSIGNMENT, ${t1_v_after} == 1, ${cc_after} == ACTIVE - nine denials changed nothing"
            - "GET /bookings?property_id=${p1} returns total_count == 2 - the PlatformAdmin booking attempt persisted nothing"

      - name: corner_rbac_cleaner_pay_line_reads_are_self_scoped_at_priority_four
        claim_type: Peer Role Isolation
        grounds:
          - validations[priority=4]
          - endpoints["GET /pay-lines"]
          - endpoints["GET /pay-lines/{id}"]
        distinguishing_aspect: |
          GET /pay-lines is a SHARED operation, so the Cleaner clears the priority 2 role check and
          is then stopped by the priority 4 self-scope rule, which yields ERR_UNAUTHORIZED (403)
          rather than a 404 or an empty list: omitting cleaner_id is a refusal, naming a peer is a
          refusal, and addressing a peer's pay line by id is a refusal - while a Coordinator may
          read all three views unfiltered.
        test_recipe:
          setup:
            - "Two cleaners: A accepted the offer on turnover T1 and therefore owns a PROVISIONAL pay line; B has no work at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com", bedroom_count: 2, bathroom_count: 2, bed_count: 3, min_clean_minutes: 120, min_skill_level: 2 }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner A", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { ca: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner B", home_zone_code: "ZONE_A", skill_level: 3, max_daily_turnovers: 3, initial_quality_score: 85.00 }
              as: PlatformAdmin
              captures: { cb: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b_out}", incoming_booking_id: "${b_in}" }
              as: Coordinator
              captures: { t1: "$.data.id", t1_v: "$.data.version" }
            - call: "POST /turnovers/${t1}/assign"
              payload: { expected_turnover_version: "${t1_v}", cleaner_id: "${ca}" }
              as: Coordinator
              as_user_id: "coord-1"
              captures: { a1: "$.data.id" }
            - call: "POST /assignments/${a1}/accept"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
            - call: "GET /pay-lines"
              payload: { cleaner_id: "${ca}" }
              as: Coordinator
              captures: { pl_a: "$.data[0].id", pl_a_cleaner: "$.data[0].cleaner_id" }
          trigger:
            - call: "GET /pay-lines"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
              captures: { e1: "$.data.error_id" }
            - call: "GET /pay-lines"
              payload: { cleaner_id: "${cb}" }
              as: Cleaner
              as_user_id: "${ca}"
              captures: { e2: "$.data.error_id" }
            - call: "GET /pay-lines/${pl_a}"
              payload: {}
              as: Cleaner
              as_user_id: "${cb}"
              captures: { e3: "$.data.error_id" }
            - call: "GET /pay-lines"
              payload: { cleaner_id: "${ca}" }
              as: Cleaner
              as_user_id: "${ca}"
              captures: { ok_net: "$.data[0].net_cents", ok_cleaner: "$.data[0].cleaner_id" }
            - call: "GET /pay-lines/${pl_a}"
              payload: {}
              as: Cleaner
              as_user_id: "${ca}"
              captures: { ok2_net: "$.data.net_cents", ok2_status: "$.data.status" }
            - call: "GET /pay-lines"
              payload: {}
              as: Coordinator
          assert:
            - "${pl_a_cleaner} == ${ca}"
            - "${e1} == ERR_UNAUTHORIZED (403) - a Cleaner must pass its own cleaner_id, an unfiltered read is refused"
            - "${e2} == ERR_UNAUTHORIZED (403) - naming a peer is refused, NOT answered with an empty list"
            - "${e3} == ERR_UNAUTHORIZED (403) - addressing a peer's pay line by id is refused, NOT ERR_PAY_LINE_NOT_FOUND"
            - "${ok_net} == 12554 and ${ok_cleaner} == ${ca} with HTTP 200 for the self-scoped list"
            - "${ok2_net} == 12554 and ${ok2_status} == PROVISIONAL with HTTP 200 for the self-scoped single read"
            - "GET /pay-lines unfiltered as Coordinator returns HTTP 200 with total_count == 1 - the scope rule binds only the Cleaner role"

      - name: corner_rbac_property_owner_is_confined_to_the_property_it_identifies_as
        claim_type: Peer Role Isolation
        grounds:
          - validations[priority=7]
          - errors.ERR_NOT_PROPERTY_OWNER
          - roles.PropertyOwner
        distinguishing_aspect: |
          A PropertyOwner's X-User-ID IS the property id it may touch, so the rule has two distinct
          teeth: addressing another property's resource is 403, and omitting the mandatory
          property_id filter on a list read is ALSO 403 - an owner may never see an unscoped
          collection even though the same endpoint answers a Coordinator unfiltered. Read access to
          its own property is unaffected.
        test_recipe:
          setup:
            - "Properties P1 'AUS-101' and P2 'AUS-102', each with one booking. The acting owner sends X-User-ID equal to P1's id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { code: "AUS-101", name: "Barton Loft", zone_code: "ZONE_A", size_tier: "TWO_BR", owner_contact_email: "owner1@example.com" }
              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties"
              payload: { code: "AUS-102", name: "Rainey Studio", zone_code: "ZONE_B", size_tier: "STUDIO", owner_contact_email: "owner2@example.com" }
              as: PlatformAdmin
              captures: { p2: "$.data.id" }
