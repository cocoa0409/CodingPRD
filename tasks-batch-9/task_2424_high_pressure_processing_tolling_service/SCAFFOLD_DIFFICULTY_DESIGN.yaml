# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2424_high_pressure_processing_tolling_service
# 9 rule_ids / 19 instances. YAML anchors carry the shared world-setup chain.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: tolling_fee_estimated_vs_actual_same_cycle
        grounds:
          - calculations.cycle_time_and_tolling_fee
          - entities.VesselCycle.fields.estimated_tolling_fee_cents
          - entities.VesselCycle.fields.actual_tolling_fee_cents
          - state_machines.VesselCycle.RUNNING_to_COMPLETED_CLEAN
          - state_machines.VesselCycle.COMPLETED_CLEAN_to_DISPOSITIONED
        distinguishing_aspect: |
          The ESTIMATED variant derives come-up time arithmetically from the vessel's nominal
          pump ramp rate and bills the target hold, while the ACTUAL variant bills the measured
          come-up and hold from the immutable CycleLog; on this one cycle the same scheduling
          inputs yield 472 s / 11400 cents estimated versus 491 s / 12825 cents actual, because
          the extra 19 seconds cross a whole-minute billing boundary.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z"
            - "customer VERDE, family RTE_GUAC (RTE_PRODUCE, cleanout 45 min, receipt/outbound limit 4.0 C)"
            - "vessel HPP-1: ramp 6.0 MPa/s, decompression 12 s, 4 baskets"
            - "qualification GUAC-500 REV-A QUALIFIED at 600 MPa / 180 s, POUCH, burst 660, film 90 (suitability 100.00)"
            - "contract FY26 ACTIVE with 5 committed slots"
            - "pallet PAL-001 (1000 units) in cold storage in CR-1"
            - "cycle C1 on HPP-1 scheduled 2026-08-05T09:00:00Z at 600 MPa / 180 s, one load of 2 of 4 baskets, state RUNNING"
          setup_api_calls:
            - &clock_aug03 { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-03T08:00:00Z" }, as: FacilityAdmin }
            - &mk_customer { call: "POST /customers", payload: { name: "Verde Foods", code: "VERDE", billing_email: "ap@verde.example" }, as: FacilityAdmin, captures: { cust_id: $.data.id } }
            - &mk_family { call: "POST /product-families", payload: { family_code: "RTE_GUAC", cross_contamination_group: "RTE_PRODUCE", cleanout_minutes: 45, max_receipt_temp_c: 4.0, max_outbound_temp_c: 4.0, requires_dedicated_cycle: false }, as: FacilityAdmin, captures: { fam_id: $.data.id } }
            - &mk_vessel1 { call: "POST /vessels", payload: { vessel_code: "HPP-1", chamber_volume_liters: 350, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 6.0, decompression_seconds: 12, basket_count: 4, hourly_operating_cost_cents: 90000 }, as: FacilityAdmin, captures: { vessel_id: $.data.id } }
            - &mk_room1 { call: "POST /cold-rooms", payload: { room_code: "CR-1", capacity_pallets: 2, setpoint_c: 2.0, allowed_family_groups: ["RTE_PRODUCE"] }, as: FacilityAdmin, captures: { room_id: $.data.id } }
            - &mk_qual { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "GUAC-500", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { qual_id: $.data.id } }
            - &submit_qual { call: "POST /product-qualifications/${qual_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - &vrun_pass { call: "POST /product-qualifications/${qual_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *vrun_pass
            - &qualify_qual { call: "POST /product-qualifications/${qual_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice" }
            - &mk_contract { call: "POST /capacity-contracts", payload: { customer_id: "${cust_id}", season_code: "FY26", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", committed_slots: 5, slot_take_or_pay_cents: 60000, priority_rank: 1, peak_window_start: "2026-10-01T00:00:00Z", peak_window_end: "2026-11-30T23:59:59Z", peak_multiplier: 1.25 }, as: FacilityAdmin, captures: { contract_id: $.data.id } }
            - &activate_contract { call: "POST /capacity-contracts/${contract_id}/activate", payload: {}, as: FacilityAdmin }
            - &mk_lot1 { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-001", unit_count: 1000, gross_weight_kg: 640.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lot1_id: $.data.id } }
            - &accept_lot1 { call: "POST /lots/${lot1_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - &mk_cycle1 { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cyc1_id: $.data.id, cyc1_v0: $.data.version } }
            - &load1_c1 { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { load1_id: $.data.id } }
            - &start_cycle1 { call: "POST /vessel-cycles/${cyc1_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob" }
          trigger:
            - &log_c1_clean { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 195, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob" }
            - &disposition_c1 { call: "POST /vessel-cycles/${cyc1_id}/disposition", payload: {}, as: QualityManager, as_user_id: "qm_alice" }
          assert:
            - "VesselCycle.${cyc1_id}.estimated_cycle_seconds == 472"
            - "VesselCycle.${cyc1_id}.scheduled_end == 2026-08-05T09:07:52Z"
            - "VesselCycle.${cyc1_id}.utilization_pct == 50.00"
            - "VesselCycle.${cyc1_id}.estimated_tolling_fee_cents == 11400"
            - "VesselCycle.${cyc1_id}.actual_cycle_seconds == 491"
            - "VesselCycle.${cyc1_id}.actual_tolling_fee_cents == 12825"
            - "VesselCycle.${cyc1_id}.state == DISPOSITIONED"
            - "CycleLoad.${load1_id}.allocated_fee_cents == 12825"
            - "CycleLoad.${load1_id}.disposition_state == ALLOCATED"

      - name: leaker_rate_instantaneous_load_vs_trailing_90d_customer
        grounds:
          - calculations.customer_package_failure_risk
          - calculations.load_package_chargeback_amount
          - entities.CycleLoad.fields.leaker_ppm
          - entities.Customer.fields.trailing_leaker_ppm
          - endpoints[POST /operations/day-close]
        distinguishing_aspect: |
          The INSTANTANEOUS_LOAD variant scores one load's own 3 leakers in 1000 units as
          3000 ppm and never changes, while the TRAILING_90D_CUSTOMER variant pools the same
          numbers over cycles dispositioned inside a moving 90-day window and therefore reads
          3000 at the 2026-08-03 day-close and 0 at the 2026-11-15 day-close.
        test_recipe:
          setup:
            - "the world of tolling_fee_estimated_vs_actual_same_cycle, with cycle C1 already DISPOSITIONED at 2026-08-03T08:00:00Z and load L1 carrying allocated_fee_cents 12825"
            - "load L1 still PENDING_INSPECTION; Customer VERDE trailing_leaker_ppm 0"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
            - *log_c1_clean
            - *disposition_c1
          trigger:
            - &inspect_load1_3000ppm { call: "POST /cycle-loads/${load1_id}/inspection", payload: { units_inspected: 1000, leaker_units: 3 }, as: QualityManager, as_user_id: "qm_alice" }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-11-15T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin }
          assert:
            - "after trigger step 1: CycleLoad.${load1_id}.leaker_ppm == 3000"
            - "after trigger step 1: CycleLoad.${load1_id}.chargeback_party == CUSTOMER"
            - "after trigger step 1: CycleLoad.${load1_id}.chargeback_cents == 6788"
            - "after trigger step 2 (day-close at 2026-08-03T08:00:00Z): Customer.${cust_id}.trailing_leaker_ppm == 3000"
            - "after trigger step 4 (day-close at 2026-11-15T08:00:00Z): Customer.${cust_id}.trailing_leaker_ppm == 0"
            - "after trigger step 4: CycleLoad.${load1_id}.leaker_ppm is still 3000 (the instantaneous variant never ages)"

  - rule_id: combinatorial_formula
    instances:
      - name: fee_surcharge_lifts_loyalty_tier_pinned_order
        grounds:
          - calculations.cycle_time_and_tolling_fee
          - entities.VesselCycle.fields.utilization_pct
          - entities.VesselCycle.fields.estimated_tolling_fee_cents
          - state_machines.VesselCycle.SCHEDULED_to_LOADED
        distinguishing_aspect: |
          Mode (c) instance: the underutilization surcharge is evaluated before the loyalty
          credit and the credit TIER is keyed on gross_cents (base 10000 + surcharge 2000 =
          12000, hitting the 5% tier), so the cycle's own penalty buys it the richer discount —
          keying the tier on base_cents instead yields 11640 rather than 11400.
        test_recipe:
          setup:
            - "the world of tolling_fee_estimated_vs_actual_same_cycle up to cycle C1 SCHEDULED with no loads"
            - "cycle C1: 600 MPa target on HPP-1 (ramp 6.0, decompression 12) so come-up is 100 s and the cycle is 472 s => 8 billable minutes => base 10000 cents"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
          trigger:
            - *load1_c1
          assert:
            - "VesselCycle.${cyc1_id}.baskets_used_total == 2"
            - "VesselCycle.${cyc1_id}.utilization_pct == 50.00"
            - "VesselCycle.${cyc1_id}.estimated_cycle_seconds == 472"
            - "VesselCycle.${cyc1_id}.estimated_tolling_fee_cents == 11400"
            - "VesselCycle.${cyc1_id}.estimated_tolling_fee_cents != 11640 (the value produced if the loyalty tier were keyed on base_cents)"
            - "VesselCycle.${cyc1_id}.state == LOADED"

      - name: cycle_fee_allocation_floor_then_remainder_by_baskets
        grounds:
          - calculations.cycle_fee_allocation_across_loads
          - entities.CycleLoad.fields.allocated_fee_cents
          - entities.CycleLoad.fields.baskets_used
          - state_machines.VesselCycle.COMPLETED_CLEAN_to_DISPOSITIONED
        distinguishing_aspect: |
          Mode (b) instance: a net fee of 11542 cents is split by basket weight with floor per
          share (2885 + 2885 + 5771 = 11541) and the single leftover cent handed to the load
          with the most baskets, giving 2885 / 2885 / 5772 — rounding each share half-up
          instead would total 11543 and break sum(allocated) == actual_tolling_fee_cents.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC; qualification GUAC-500 QUALIFIED; contract FY26 ACTIVE with 5 slots"
            - "vessel HPP-2: ramp 5.0 MPa/s, decompression 15 s, 6 baskets"
            - "cold room CR-2 with 5 pallet positions"
            - "three pallets PAL-101 (400 u), PAL-102 (400 u), PAL-103 (800 u) in cold storage, created in that order"
            - "cycle C2 on HPP-2 scheduled 2026-08-06T09:00:00Z at 600 MPa / 180 s with loads of 1, 1 and 2 baskets (4 of 6 => utilization 66.67), RUNNING and logged at exactly the target values (495 s => 9 billable minutes => base 11250, surcharge 900, gross 12150, credit 608, net 11542)"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - { call: "POST /vessels", payload: { vessel_code: "HPP-2", chamber_volume_liters: 525, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 5.0, decompression_seconds: 15, basket_count: 6, hourly_operating_cost_cents: 120000 }, as: FacilityAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /cold-rooms", payload: { room_code: "CR-2", capacity_pallets: 5, setpoint_c: 2.0, allowed_family_groups: ["RTE_PRODUCE"] }, as: FacilityAdmin, captures: { room2_id: $.data.id } }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room2_id}", pallet_ref: "PAL-101", unit_count: 400, gross_weight_kg: 260.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lotA_id: $.data.id } }
            - { call: "POST /lots/${lotA_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room2_id}", pallet_ref: "PAL-102", unit_count: 400, gross_weight_kg: 260.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lotB_id: $.data.id } }
            - { call: "POST /lots/${lotB_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room2_id}", pallet_ref: "PAL-103", unit_count: 800, gross_weight_kg: 520.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lotC_id: $.data.id } }
            - { call: "POST /lots/${lotC_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${v2_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-06T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cyc2_id: $.data.id, cyc2_v0: $.data.version } }
            - { call: "POST /vessel-cycles/${cyc2_id}/loads", payload: { lot_id: "${lotA_id}", contract_id: "${contract_id}", baskets_used: 1, units_loaded: 400, expected_cycle_version: "${cyc2_v0}" }, as: PlantScheduler, captures: { loadA_id: $.data.id } }
            - { call: "GET /vessel-cycles/${cyc2_id}", as: PlantScheduler, captures: { cyc2_v1: $.data.version } }
            - { call: "POST /vessel-cycles/${cyc2_id}/loads", payload: { lot_id: "${lotB_id}", contract_id: "${contract_id}", baskets_used: 1, units_loaded: 400, expected_cycle_version: "${cyc2_v1}" }, as: PlantScheduler, captures: { loadB_id: $.data.id } }
            - { call: "GET /vessel-cycles/${cyc2_id}", as: PlantScheduler, captures: { cyc2_v2: $.data.version } }
            - { call: "POST /vessel-cycles/${cyc2_id}/loads", payload: { lot_id: "${lotC_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 800, expected_cycle_version: "${cyc2_v2}" }, as: PlantScheduler, captures: { loadC_id: $.data.id } }
            - { call: "POST /vessel-cycles/${cyc2_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob" }
            - { call: "POST /vessel-cycles/${cyc2_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 180, come_up_seconds: 120, water_temp_c: 7.0 }, as: PlantOperator, as_user_id: "op_bob" }
          trigger:
            - { call: "POST /vessel-cycles/${cyc2_id}/disposition", payload: {}, as: QualityManager, as_user_id: "qm_alice" }
          assert:
            - "VesselCycle.${cyc2_id}.actual_cycle_seconds == 495"
            - "VesselCycle.${cyc2_id}.utilization_pct == 66.67"
            - "VesselCycle.${cyc2_id}.actual_tolling_fee_cents == 11542"
            - "CycleLoad.${loadA_id}.allocated_fee_cents == 2885"
            - "CycleLoad.${loadB_id}.allocated_fee_cents == 2885"
            - "CycleLoad.${loadC_id}.allocated_fee_cents == 5772"
            - "CycleLoad.${loadA_id}.allocated_fee_cents + CycleLoad.${loadB_id}.allocated_fee_cents + CycleLoad.${loadC_id}.allocated_fee_cents == 11542"

  - rule_id: non_linear_state_machine
    instances:
      - name: qualification_revision_round_cycles_back_to_submitted
        grounds:
          - state_machines.ProductQualification.UNDER_VALIDATION_to_CHANGES_REQUESTED
          - state_machines.ProductQualification.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.ProductQualification.UNDER_VALIDATION_to_QUALIFIED
          - entities.ProductQualification.fields.revision_round
          - entities.ValidationRun.fields.run_verdict
        distinguishing_aspect: |
          Cyclic shape: the qualification re-enters SUBMITTED after CHANGES_REQUESTED, so the
          same status is occupied twice in one lifetime and revision_round (not the status)
          records how many laps were run — ending QUALIFIED with revision_round == 1 and only
          the two PASS runs counted as ACCEPTABLE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC"
            - "qualification GUAC-500 REV-A SUBMITTED, then one FAIL validation run and a REQUEST_CHANGES decision, leaving status CHANGES_REQUESTED with revision_round 1"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_qual
            - *submit_qual
            - { call: "POST /product-qualifications/${qual_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 4.1, package_integrity_result: "FAIL", units_tested: 50, leaker_count: 4 }, as: QualityManager, as_user_id: "qm_alice" }
            - { call: "POST /product-qualifications/${qual_id}/decision", payload: { outcome: "REQUEST_CHANGES", decision_note: "seal integrity" }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
          assert:
            - "ProductQualification.${qual_id}.status == QUALIFIED"
            - "ProductQualification.${qual_id}.revision_round == 1"
            - "ProductQualification.${qual_id}.validation_run_acceptable_count == 2"
            - "ProductQualification.${qual_id}.package_suitability_score == 100.00"
            - "ProductQualification.${qual_id}.qualified_at == 2026-08-03T08:00:00Z"
            - "ProductQualification.${qual_id}.expires_at == 2027-08-03T08:00:00Z"
            - "GET /product-qualifications/${qual_id}/validation-runs returns 3 rows, exactly one with run_verdict == UNACCEPTABLE"

      - name: lot_custody_and_release_dimensions_advance_independently
        grounds:
          - state_machines.Lot.custody_state
          - state_machines.Lot.release_state
          - entities.Lot.fields.released_by_user_id
          - entities.Lot.fields.hold_reason
          - concurrency_rules[release-decision-stale-lot]
        distinguishing_aspect: |
          Parallel shape: the pallet sits in custody_state TREATED across three consecutive
          release_state transitions (NOT_RELEASED -> ON_HOLD_FOR_TEST -> RELEASED), and only the
          ship call moves custody to SHIPPED while release_state stays RELEASED — neither
          dimension is a function of the other.
        test_recipe:
          setup:
            - "the world of tolling_fee_estimated_vs_actual_same_cycle with cycle C1 DISPOSITIONED on the clean branch"
            - "pallet PAL-001 custody_state TREATED, release_state NOT_RELEASED, cold room CR-1 occupied_pallets 1"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
            - *log_c1_clean
            - *disposition_c1
          trigger:
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { lot1_v1: $.data.version } }
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "HOLD_FOR_TEST", expected_lot_version: "${lot1_v1}", hold_reason: "micro pending" }, as: QualityManager, as_user_id: "qm_alice" }
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_carol", captures: { lot1_v2: $.data.version } }
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${lot1_v2}" }, as: QualityManager, as_user_id: "qm_carol" }
            - &ship_lot1 { call: "POST /lots/${lot1_id}/ship", payload: { outbound_temp_c: 3.0, carrier_name: "ColdLine" }, as: PlantOperator }
          assert:
            - "after trigger step 2: Lot.${lot1_id}.release_state == ON_HOLD_FOR_TEST and Lot.${lot1_id}.custody_state == TREATED"
            - "after trigger step 2: Lot.${lot1_id}.hold_reason == micro pending"
            - "after trigger step 4: Lot.${lot1_id}.release_state == RELEASED and Lot.${lot1_id}.custody_state is still TREATED"
            - "after trigger step 4: Lot.${lot1_id}.released_by_user_id == qm_carol and Lot.${lot1_id}.hold_reason == null"
            - "after trigger step 5: Lot.${lot1_id}.custody_state == SHIPPED and Lot.${lot1_id}.release_state is still RELEASED"
            - "after trigger step 5: ColdRoom.${room_id}.occupied_pallets == 0 and ColdRoom.${room_id}.capacity_state == NORMAL"
            - "Lot.${lot1_id}.units_treated == 1000 throughout all five trigger steps"

  - rule_id: transitive_cascade
    instances:
      - name: deviation_reject_cascades_to_cold_room_posture
        grounds:
          - state_machines.Deviation.OPEN_to_ADJUDICATED_REJECT
          - state_machines.VesselCycle.COMPLETED_DEVIATED_to_DISPOSITIONED
          - state_machines.Lot.custody_state
          - state_machines.ColdRoom.AT_CAPACITY_to_NORMAL
          - calculations.ccp_verdict_and_deviation_severity
          - calculations.lot_unit_ledger
        distinguishing_aspect: |
          Six-link chain where every link is caused by the previous one: adjudicating the
          deviation REJECT (L1) dispositions the cycle with a zero fee (L2), which flips both
          loads to REJECTED with allocated_fee_cents 0 (L3), which disposes both pallets (L4),
          which drops ColdRoom CR-1 occupied_pallets from 2 to 0 (L5), which flips its derived
          capacity_state from AT_CAPACITY back to NORMAL (L6).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC; qualification GUAC-500 QUALIFIED at 600 MPa / 180 s; contract FY26 ACTIVE with 5 slots"
            - "cold room CR-1 has capacity_pallets 2 and holds PAL-001 (1000 u) and PAL-002 (800 u), so occupied_pallets == 2 and capacity_state == AT_CAPACITY"
            - "cycle C1 on HPP-1 ran both pallets (2 + 2 of 4 baskets) and its CCP record shows actual_hold_seconds 170 against a required 180, i.e. a 5.56% shortfall => CRITICAL SHORT_HOLD deviation OPEN, both pallets ON_HOLD_FOR_TEST, cycle COMPLETED_DEVIATED"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - &mk_lot2 { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-002", unit_count: 800, gross_weight_kg: 520.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lot2_id: $.data.id } }
            - &accept_lot2 { call: "POST /lots/${lot2_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.4 }, as: PlantOperator }
            - *mk_cycle1
            - *load1_c1
            - &get_cycle1_v { call: "GET /vessel-cycles/${cyc1_id}", as: PlantScheduler, captures: { cyc1_v1: $.data.version } }
            - &load2_c1 { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 800, expected_cycle_version: "${cyc1_v1}" }, as: PlantScheduler, captures: { load2_id: $.data.id } }
            - *start_cycle1
            - &log_c1_short_hold_critical { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 170, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob" }
            - &get_dev_c1 { call: "GET /deviations?cycle_id=${cyc1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { dev_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /deviations/${dev_id}/adjudicate", payload: { disposition: "REJECT", root_cause_code: "EQUIP_PUMP_FAULT" }, as: QualityManager, as_user_id: "qm_alice" }
          assert:
            - "L1: Deviation.${dev_id}.status == ADJUDICATED_REJECT and Deviation.${dev_id}.severity == CRITICAL and Deviation.${dev_id}.worst_shortfall_pct == 5.56 and Deviation.${dev_id}.chargeback_party == FACILITY"
            - "L2: VesselCycle.${cyc1_id}.state == DISPOSITIONED and VesselCycle.${cyc1_id}.actual_tolling_fee_cents == 0"
            - "L3: CycleLoad.${load1_id}.disposition_state == REJECTED and CycleLoad.${load1_id}.allocated_fee_cents == 0"
            - "L3: CycleLoad.${load2_id}.disposition_state == REJECTED and CycleLoad.${load2_id}.allocated_fee_cents == 0"
            - "L4: Lot.${lot1_id}.custody_state == DISPOSED, Lot.${lot1_id}.release_state == REJECTED, Lot.${lot1_id}.units_disposed == 1000, Lot.${lot1_id}.units_treated == 0"
            - "L4: Lot.${lot2_id}.custody_state == DISPOSED, Lot.${lot2_id}.units_disposed == 800"
            - "L5: ColdRoom.${room_id}.occupied_pallets == 0"
            - "L6: ColdRoom.${room_id}.capacity_state == NORMAL"
            - "no ChargebackLine exists for Customer.${cust_id} (root cause EQUIP_ leaves the cost with the facility)"

      - name: load_create_cascades_contract_to_exhausted
        grounds:
          - state_machines.VesselCycle.SCHEDULED_to_LOADED
          - state_machines.CapacityContract.ACTIVE_to_EXHAUSTED
          - calculations.contract_slot_ledger
          - calculations.cycle_time_and_tolling_fee
          - concurrency_rules[load-create-stale-cycle]
        distinguishing_aspect: |
          Four-link chain on the money/capacity side rather than the physical side: creating the
          load (L1) moves the cycle SCHEDULED -> LOADED and rewrites its ESTIMATED fee (L2),
          which raises CapacityContract.reserved_slots to 1 and drops available_slots to 0 (L3),
          which flips the contract's status ACTIVE -> EXHAUSTED (L4).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC; vessel HPP-1; cold room CR-1"
            - "qualification GUAC-500 QUALIFIED; pallet PAL-001 (1000 u) in cold storage"
            - "spot contract FY26-SPOT ACTIVE with committed_slots 1, so its ledger reads reserved 0 / consumed 0 / available 1"
            - "cycle C1 SCHEDULED on HPP-1 for 2026-08-05T09:00:00Z with no loads"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - &mk_contract_spot { call: "POST /capacity-contracts", payload: { customer_id: "${cust_id}", season_code: "FY26-SPOT", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", committed_slots: 1, slot_take_or_pay_cents: 60000, priority_rank: 2, peak_window_start: "2026-10-01T00:00:00Z", peak_window_end: "2026-11-30T23:59:59Z", peak_multiplier: 1.25 }, as: FacilityAdmin, captures: { spot_id: $.data.id } }
            - &activate_contract_spot { call: "POST /capacity-contracts/${spot_id}/activate", payload: {}, as: FacilityAdmin }
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
          trigger:
            - &load1_c1_spot { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${spot_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { spot_load_id: $.data.id } }
          assert:
            - "L1: CycleLoad.${spot_load_id}.disposition_state == PENDING and CycleLoad.${spot_load_id}.inspection_state == PENDING_INSPECTION"
            - "L2: VesselCycle.${cyc1_id}.state == LOADED and VesselCycle.${cyc1_id}.estimated_tolling_fee_cents == 11400"
            - "L3: CapacityContract.${spot_id}.reserved_slots == 1 and CapacityContract.${spot_id}.consumed_slots == 0 and CapacityContract.${spot_id}.available_slots == 0"
            - "L4: CapacityContract.${spot_id}.status == EXHAUSTED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cycle_state_beats_expired_qualification_on_load
        grounds:
          - validations.p8[POST /vessel-cycles/{id}/loads -> ERR_INVALID_CYCLE_STATE]
          - validations.p9[POST /vessel-cycles/{id}/loads -> ERR_QUALIFICATION_EXPIRED]
          - errors[ERR_INVALID_CYCLE_STATE]
          - errors[ERR_QUALIFICATION_EXPIRED]
        error_pair: [ERR_INVALID_CYCLE_STATE, ERR_QUALIFICATION_EXPIRED]
        error_categories: [state, business_safety]
        expected_winner: ERR_INVALID_CYCLE_STATE
        distinguishing_aspect: |
          state (priority 8) versus business_safety (priority 9): the request is doubly bad —
          the cycle is already RUNNING so no load may be added, and the pallet's qualification
          expired when the clock crossed 2027-08-03T08:00:00Z. The 409 state error must surface;
          reporting the 422 food-safety error would leak that the checks ran out of order.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC; vessel HPP-1; cold room CR-1 (2 positions)"
            - "qualification GUAC-500 QUALIFIED at 2026-08-03T08:00:00Z, so expires_at is 2027-08-03T08:00:00Z"
            - "pallets PAL-001 and PAL-002 both accepted into CR-1"
            - "cycle C1 loaded with PAL-001 and started, so state == RUNNING"
            - "clock then moved to 2027-08-04T08:00:00Z and day-close run, so the qualification is EXPIRED"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_lot2
            - *accept_lot2
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
            - { call: "GET /vessel-cycles/${cyc1_id}", as: PlantScheduler, captures: { cyc1_vr: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-08-04T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 800, expected_cycle_version: "${cyc1_vr}" }, as: PlantScheduler, captures: { err_id: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_CYCLE_STATE"
            - "data.error_id != ERR_QUALIFICATION_EXPIRED"
            - "ProductQualification.${qual_id}.status == EXPIRED (the lower-priority violation is genuinely present)"
            - "VesselCycle.${cyc1_id}.state == RUNNING and VesselCycle.${cyc1_id}.version is unchanged from ${cyc1_vr}"
            - "no CycleLoad row exists for Lot.${lot2_id}"

      - name: unit_shortage_beats_contract_exhaustion_on_load
        grounds:
          - validations.p11[POST /vessel-cycles/{id}/loads -> ERR_INSUFFICIENT_UNTREATED_UNITS]
          - validations.p14[POST /vessel-cycles/{id}/loads -> ERR_CONTRACT_CAPACITY_EXHAUSTED]
          - errors[ERR_INSUFFICIENT_UNTREATED_UNITS]
          - errors[ERR_CONTRACT_CAPACITY_EXHAUSTED]
        error_pair: [ERR_INSUFFICIENT_UNTREATED_UNITS, ERR_CONTRACT_CAPACITY_EXHAUSTED]
        error_categories: [business_constraint, business_fiscal]
        expected_winner: ERR_INSUFFICIENT_UNTREATED_UNITS
        distinguishing_aspect: |
          business_constraint (priority 11) versus business_fiscal (priority 14) — a different
          pair and a different pair of categories from the state/safety instance above: the
          physical impossibility (booking 5000 units out of a 800-unit pallet) is reported
          before the commercial one (the spot contract's single slot is already reserved).
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC; vessel HPP-1; cold room CR-1"
            - "qualification GUAC-500 QUALIFIED; pallets PAL-001 (1000 u) and PAL-002 (800 u) accepted into CR-1"
            - "spot contract FY26-SPOT ACTIVE with committed_slots 1"
            - "cycle C1 already carries PAL-001 on the spot contract, so the contract is EXHAUSTED with available_slots 0 and the cycle is LOADED with 2 of 4 baskets used"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract_spot
            - *activate_contract_spot
            - *mk_lot1
            - *accept_lot1
            - *mk_lot2
            - *accept_lot2
            - *mk_cycle1
            - *load1_c1_spot
            - { call: "GET /vessel-cycles/${cyc1_id}", as: PlantScheduler, captures: { cyc1_vl: $.data.version } }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${spot_id}", baskets_used: 2, units_loaded: 5000, expected_cycle_version: "${cyc1_vl}" }, as: PlantScheduler, captures: { err_id2: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_INSUFFICIENT_UNTREATED_UNITS"
            - "data.error_id != ERR_CONTRACT_CAPACITY_EXHAUSTED"
            - "CapacityContract.${spot_id}.status == EXHAUSTED and CapacityContract.${spot_id}.available_slots == 0 (the fiscal violation is genuinely present)"
            - "Lot.${lot2_id}.units_untreated == 800 and Lot.${lot2_id}.custody_state == IN_COLD_STORAGE"
            - "VesselCycle.${cyc1_id}.baskets_used_total == 2 and VesselCycle.${cyc1_id}.state == LOADED"

  - rule_id: boundary_precision_check
    instances:
      - name: leaker_ppm_exactly_at_chargeback_threshold
        metric: "CycleLoad.leaker_ppm against LEAKER_CHARGEBACK_PPM (3000 ppm)"
        endpoint: "POST /cycle-loads/{id}/inspection"
        grounds:
          - calculations.customer_package_failure_risk
          - calculations.load_package_chargeback_amount
          - entities.CycleLoad.fields.leaker_ppm
          - entities.ChargebackLine.fields.amount_cents
        distinguishing_aspect: |
          The comparison is >=, so 3 leakers in exactly 1000 units (3000 ppm on the nose) makes
          the customer liable and raises a PACKAGE_FAILURE_RATE deviation, while a second load
          one notch below the line (2 in 800 = 2500 ppm, inside the 1500 ppm watch band but
          under 3000) stays with the facility and creates no ChargebackLine — the same request
          shape either side of a single integer boundary.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE (trailing_leaker_ppm 0); family RTE_GUAC; vessel HPP-1 (4 baskets); cold room CR-1"
            - "qualification GUAC-500 QUALIFIED; pallets PAL-001 (1000 u) and PAL-002 (800 u) accepted"
            - "cycle C1 carries both pallets at 2 + 2 of 4 baskets (utilization 100.00), was logged clean (come-up 104, hold 195) and is DISPOSITIONED at actual_tolling_fee_cents 10912, allocated 5456 / 5456"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_lot2
            - *accept_lot2
            - *mk_cycle1
            - *load1_c1
            - *get_cycle1_v
            - *load2_c1
            - *start_cycle1
            - *log_c1_clean
            - *disposition_c1
          trigger:
            - { call: "POST /cycle-loads/${load1_id}/inspection", payload: { units_inspected: 1000, leaker_units: 3 }, as: QualityManager, as_user_id: "qm_alice" }
            - { call: "POST /cycle-loads/${load2_id}/inspection", payload: { units_inspected: 800, leaker_units: 2 }, as: QualityManager, as_user_id: "qm_alice" }
          assert:
            - "VesselCycle.${cyc1_id}.utilization_pct == 100.00 and VesselCycle.${cyc1_id}.actual_tolling_fee_cents == 10912"
            - "CycleLoad.${load1_id}.allocated_fee_cents == 5456 and CycleLoad.${load2_id}.allocated_fee_cents == 5456"
            - "at (exactly the boundary): CycleLoad.${load1_id}.leaker_ppm == 3000, chargeback_party == CUSTOMER, chargeback_cents == 3103"
            - "at: a ChargebackLine exists with basis == PACKAGE_LEAKER, amount_cents == 3103, status == PENDING, cycle_load_id == ${load1_id}"
            - "at: a Deviation exists with deviation_type == PACKAGE_FAILURE_RATE, severity == MAJOR, worst_shortfall_pct == 0.00, status == OPEN, cycle_load_id == ${load1_id}"
            - "just below (2500 ppm): CycleLoad.${load2_id}.leaker_ppm == 2500, chargeback_party == FACILITY, chargeback_cents == 0"
            - "just below: no ChargebackLine references ${load2_id} and no PACKAGE_FAILURE_RATE Deviation references ${load2_id}"
            - "Customer.${cust_id}.chargeback_balance_cents == 3103 (only the at-boundary load contributed)"
            - "Customer.${cust_id}.trailing_leaker_ppm == 0 (inspection never recomputes the trailing variant inline)"

      - name: actual_hold_exactly_equals_required_hold
        metric: "CycleLog.actual_hold_seconds against the strictest required hold_time_seconds (180 s), plus pressure and water temperature at their own limits"
        endpoint: "POST /vessel-cycles/{id}/cycle-logs"
        grounds:
          - calculations.ccp_verdict_and_deviation_severity
          - entities.CycleLog.fields.ccp_verdict
          - state_machines.VesselCycle.RUNNING_to_COMPLETED_CLEAN
          - state_machines.VesselCycle.RUNNING_to_COMPLETED_DEVIATED
        distinguishing_aspect: |
          A different metric (seconds of hold time, plus MPa and Celsius) on a different
          endpoint from the ppm instance: equality is compliant on all three CCP comparisons, so
          600.0 MPa == required, 180 s == required and 8.0 C == the limit yield WITHIN_LIMITS and
          COMPLETED_CLEAN with no Deviation at all, while one second short (179 s, a 0.56%
          shortfall) flips the sibling cycle to COMPLETED_DEVIATED with a MAJOR SHORT_HOLD
          deviation.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; customer VERDE; family RTE_GUAC; cold room CR-1"
            - "qualification GUAC-500 QUALIFIED at 600 MPa / 180 s with max_water_temp_c 8.0"
            - "vessels HPP-1 (ramp 6.0, decompression 12, 4 baskets) and HPP-2 (ramp 5.0, decompression 15, 6 baskets)"
            - "pallets PAL-001 (1000 u) and PAL-002 (800 u) accepted into CR-1"
            - "cycle C1 RUNNING on HPP-1 with PAL-001 (2 of 4 baskets); cycle C3 RUNNING on HPP-2 with PAL-002 (2 of 6 baskets)"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_lot2
            - *accept_lot2
            - { call: "POST /vessels", payload: { vessel_code: "HPP-2", chamber_volume_liters: 525, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 5.0, decompression_seconds: 15, basket_count: 6, hourly_operating_cost_cents: 120000 }, as: FacilityAdmin, captures: { v2b_id: $.data.id } }
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${v2b_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cyc3_id: $.data.id, cyc3_v0: $.data.version } }
            - { call: "POST /vessel-cycles/${cyc3_id}/loads", payload: { lot_id: "${lot2_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 800, expected_cycle_version: "${cyc3_v0}" }, as: PlantScheduler, captures: { load3_id: $.data.id } }
            - { call: "POST /vessel-cycles/${cyc3_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob" }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 180, come_up_seconds: 100, water_temp_c: 8.0 }, as: PlantOperator, as_user_id: "op_bob", captures: { log1_id: $.data.id } }
            - { call: "POST /vessel-cycles/${cyc3_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 179, come_up_seconds: 120, water_temp_c: 7.0 }, as: PlantOperator, as_user_id: "op_bob", captures: { log3_id: $.data.id } }
            - *disposition_c1
          assert:
            - "at (all three metrics exactly at their limits): CycleLog.${log1_id}.ccp_verdict == WITHIN_LIMITS"
            - "at: CycleLog.${log1_id}.pressure_shortfall_pct == 0.00, hold_shortfall_pct == 0.00, temp_excursion_pct == 0.00"
            - "at: VesselCycle.${cyc1_id}.state after trigger step 1 == COMPLETED_CLEAN and no Deviation references ${cyc1_id}"
            - "at: after trigger step 3 VesselCycle.${cyc1_id}.actual_cycle_seconds == 472 and actual_tolling_fee_cents == 11400, equal to the estimate"
            - "just outside (179 s): CycleLog.${log3_id}.ccp_verdict == DEVIATION and CycleLog.${log3_id}.hold_shortfall_pct == 0.56"
            - "just outside: VesselCycle.${cyc3_id}.state == COMPLETED_DEVIATED"
            - "just outside: a Deviation on ${cyc3_id} has deviation_type == SHORT_HOLD, severity == MAJOR, worst_shortfall_pct == 0.56, status == OPEN"
            - "Lot.${lot1_id}.units_treated == 1000 and Lot.${lot2_id}.units_treated == 800 (both branches move units)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_release_blocked_by_open_deviation_on_its_cycle
        entity_pair: [Lot, Deviation]
        grounds:
          - validations.p8[POST /lots/{id}/release-decision -> ERR_DEVIATION_UNRESOLVED]
          - errors[ERR_DEVIATION_UNRESOLVED]
          - state_machines.Deviation.OPEN_to_ADJUDICATED_ACCEPT
          - state_machines.Lot.release_state
        distinguishing_aspect: |
          The blocking state lives on a sibling aggregate reached only through
          CycleLoad -> VesselCycle -> Deviation: nothing on the Lot row itself is wrong, yet
          release is refused while any Deviation on its cycle is OPEN, and the very same request
          succeeds unchanged once the deviation is adjudicated ACCEPT.
        test_recipe:
          setup:
            - "the world of tolling_fee_estimated_vs_actual_same_cycle: cycle C1 DISPOSITIONED clean, load L1 allocated 12825, pallet PAL-001 TREATED / NOT_RELEASED"
            - "load L1 inspected at 3 leakers in 1000 units, so a PACKAGE_FAILURE_RATE Deviation (MAJOR) is OPEN on C1"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
            - *log_c1_clean
            - *disposition_c1
            - *inspect_load1_3000ppm
            - { call: "GET /deviations?cycle_load_id=${load1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { pkg_dev_id: "$.data[0].id" } }
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_carol", captures: { lot1_vd: $.data.version } }
          trigger:
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${lot1_vd}" }, as: QualityManager, as_user_id: "qm_carol", captures: { err_dev: $.data.error_id } }
            - { call: "POST /deviations/${pkg_dev_id}/adjudicate", payload: { disposition: "ACCEPT", root_cause_code: "PKG_SEAL_SUPPLIER" }, as: QualityManager, as_user_id: "qm_dave" }
            - { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_carol", captures: { lot1_vd2: $.data.version } }
            - { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${lot1_vd2}" }, as: QualityManager, as_user_id: "qm_carol" }
          assert:
            - "trigger step 1: HTTP 409 with data.error_id == ERR_DEVIATION_UNRESOLVED"
            - "trigger step 1: Lot.${lot1_id}.release_state is still NOT_RELEASED and Lot.${lot1_id}.version == ${lot1_vd}"
            - "trigger step 2: Deviation.${pkg_dev_id}.status == ADJUDICATED_ACCEPT and Deviation.${pkg_dev_id}.deviation_type == PACKAGE_FAILURE_RATE"
            - "trigger step 4: HTTP 200 and Lot.${lot1_id}.release_state == RELEASED with released_by_user_id == qm_carol"
            - "trigger step 4: Lot.${lot1_id}.custody_state == TREATED (the Deviation only ever gated the release dimension)"

      - name: cycle_start_blocked_by_vessel_maintenance_status
        entity_pair: [VesselCycle, Vessel]
        grounds:
          - validations.p9[POST /vessel-cycles/{id}/start -> ERR_VESSEL_NOT_AVAILABLE]
          - errors[ERR_VESSEL_NOT_AVAILABLE]
          - endpoints[PATCH /vessels/{id}]
          - state_machines.VesselCycle.LOADED_to_RUNNING
        distinguishing_aspect: |
          A different entity pair and a different direction of dependency: the cycle is perfectly
          well-formed and LOADED, but the equipment it is scheduled on was taken out of service
          by an unrelated FacilityAdmin PATCH, so the operator's start is refused until the
          vessel returns to AVAILABLE — and starting then flips the same vessel to IN_USE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; the standard VERDE / RTE_GUAC / HPP-1 / CR-1 world"
            - "cycle C1 LOADED with PAL-001 on the FY26 contract"
            - "vessel HPP-1 then patched to MAINTENANCE"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1
            - { call: "PATCH /vessels/${vessel_id}", payload: { status: "MAINTENANCE" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob", captures: { err_vessel: $.data.error_id } }
            - { call: "PATCH /vessels/${vessel_id}", payload: { status: "AVAILABLE" }, as: FacilityAdmin }
            - *start_cycle1
          assert:
            - "trigger step 1: HTTP 422 with data.error_id == ERR_VESSEL_NOT_AVAILABLE"
            - "trigger step 1: VesselCycle.${cyc1_id}.state is still LOADED and Lot.${lot1_id}.custody_state is still IN_COLD_STORAGE"
            - "trigger step 3: VesselCycle.${cyc1_id}.state == RUNNING and started_at == 2026-08-03T08:00:00Z"
            - "trigger step 3: Vessel.${vessel_id}.status == IN_USE"
            - "trigger step 3: Lot.${lot1_id}.custody_state == IN_VESSEL, units_in_vessel == 1000, units_untreated == 0"

  - rule_id: resource_temporal_overlap
    instances:
      - name: vessel_half_open_windows_and_cleanout_buffer
        resource_entity: Vessel
        interval_semantics: "HALF-OPEN [scheduled_start, scheduled_end); pairwise overlap uses strict inequalities so touching endpoints never collide, and the cross-group cleanout buffer passes on equality (gap >= required)"
        grounds:
          - calculations.vessel_schedule_window_and_cleanout_gap
          - validations.p13[POST /vessel-cycles -> ERR_VESSEL_WINDOW_CONFLICT]
          - validations.p13[POST /vessel-cycles -> ERR_CLEANOUT_GAP_REQUIRED]
          - entities.VesselCycle.fields.scheduled_end
        distinguishing_aspect: |
          Pairwise half-open interval arithmetic on a single machine, with two different
          boundaries one second apart: a same-family cycle starting exactly at the incumbent's
          scheduled_end (09:07:52Z) is accepted, one second earlier is a conflict; and a
          cross-group cycle is accepted at exactly predecessor_end + max(cleanout) * 60
          (09:15:44Z + 3600 s = 10:15:44Z) but rejected one second earlier.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z"
            - "family RTE_GUAC (group RTE_PRODUCE, cleanout 45 min) and family RAW_MEAT (group RAW_PROTEIN, cleanout 60 min)"
            - "vessel HPP-1: ramp 6.0 MPa/s, decompression 12 s, so a 600 MPa / 180 s cycle is 180 + 100 + 180 + 12 = 472 s long"
            - "cycle C1 SCHEDULED on HPP-1 at 2026-08-05T09:00:00Z, occupying [09:00:00Z, 09:07:52Z)"
          setup_api_calls:
            - *clock_aug03
            - *mk_family
            - *mk_vessel1
            - { call: "POST /product-families", payload: { family_code: "RAW_MEAT", cross_contamination_group: "RAW_PROTEIN", cleanout_minutes: 60, max_receipt_temp_c: 2.0, max_outbound_temp_c: 2.0, requires_dedicated_cycle: true }, as: FacilityAdmin, captures: { raw_fam_id: $.data.id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { w_c1_id: $.data.id } }
          trigger:
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:07:52Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { w_c2_id: $.data.id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:07:51Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { err_window: $.data.error_id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${raw_fam_id}", scheduled_start: "2026-08-05T10:15:43Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { err_cleanout: $.data.error_id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${raw_fam_id}", scheduled_start: "2026-08-05T10:15:44Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { w_c5_id: $.data.id } }
          assert:
            - "VesselCycle.${w_c1_id}.estimated_cycle_seconds == 472 and scheduled_end == 2026-08-05T09:07:52Z"
            - "at the boundary: trigger step 1 returns 201 and VesselCycle.${w_c2_id}.scheduled_end == 2026-08-05T09:15:44Z"
            - "one second inside: trigger step 2 returns 409 with data.error_id == ERR_VESSEL_WINDOW_CONFLICT"
            - "one second short of the cleanout buffer: trigger step 3 returns 409 with data.error_id == ERR_CLEANOUT_GAP_REQUIRED (gap 3599 s < max(60, 45) * 60 = 3600 s)"
            - "exactly at the cleanout buffer: trigger step 4 returns 201 and VesselCycle.${w_c5_id}.scheduled_end == 2026-08-05T10:23:36Z"
            - "GET /vessel-cycles?vessel_id=${vessel_id} returns exactly 3 rows"

      - name: cold_room_closed_interval_declared_occupancy
        resource_entity: ColdRoom
        interval_semantics: "CLOSED [now, ship_by] on both ends, evaluated as an AGGREGATE step function sampled at interval start points rather than pairwise; declared occupancy counts pallets still AT_DOCK"
        grounds:
          - calculations.cold_room_interval_occupancy
          - validations.p12[POST /lots -> ERR_COLD_ROOM_CAPACITY_EXCEEDED]
          - entities.ColdRoom.fields.capacity_pallets
          - entities.Lot.fields.ship_by
        distinguishing_aspect: |
          Different resource and different interval semantics from the vessel instance: closed
          intervals, an N-way count against capacity_pallets instead of a pairwise test, and
          reservations that expire on their own — the identical third pallet is refused while the
          two incumbent intervals still cover the request instant and accepted once the clock has
          moved past their ship_by, with ColdRoom.capacity_state NORMAL the whole time because
          neither incumbent was ever inspected into storage.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T08:00:00Z; customer VERDE; family RTE_GUAC; qualification GUAC-500 QUALIFIED"
            - "cold room CR-1 with capacity_pallets 2"
            - "pallets PAL-201 and PAL-202 received but NOT inspected, so both are AT_DOCK with ship_by 2026-08-10T00:00:00Z; ColdRoom.occupied_pallets is still 0 and capacity_state NORMAL"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-201", unit_count: 500, gross_weight_kg: 330.0, carrier_temp_c: 2.5, ship_by: "2026-08-10T00:00:00Z" }, as: PlantOperator, captures: { lot201_id: $.data.id } }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-202", unit_count: 500, gross_weight_kg: 330.0, carrier_temp_c: 2.5, ship_by: "2026-08-10T00:00:00Z" }, as: PlantOperator, captures: { lot202_id: $.data.id } }
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-203", unit_count: 500, gross_weight_kg: 330.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { err_room: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-12T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-203", unit_count: 500, gross_weight_kg: 330.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lot203_id: $.data.id } }
          assert:
            - "trigger step 1: HTTP 409 with data.error_id == ERR_COLD_ROOM_CAPACITY_EXCEEDED (occupancy 3 > 2 at the sampled point 2026-08-05T08:00:00Z)"
            - "trigger step 1: data.error_id != ERR_COLD_ROOM_AT_CAPACITY, because ColdRoom.${room_id}.occupied_pallets == 0 and capacity_state == NORMAL"
            - "trigger step 1: no Lot with pallet_ref PAL-203 exists yet"
            - "trigger step 3: HTTP 201 for the byte-identical payload, Lot.${lot203_id}.custody_state == AT_DOCK"
            - "trigger step 3: the two incumbents are unchanged (Lot.${lot201_id}.custody_state == AT_DOCK, Lot.${lot202_id}.custody_state == AT_DOCK) and ColdRoom.${room_id}.occupied_pallets == 0"

  - rule_id: compensating_invariant
    instances:
      - name: abort_returns_units_to_the_untreated_pool
        conserved_quantity: "Lot.unit_count == units_untreated + units_in_vessel + units_treated + units_disposed"
        grounds:
          - calculations.lot_unit_ledger
          - state_machines.VesselCycle.RUNNING_to_ABORTED
          - endpoints[POST /vessel-cycles/{id}/terminate]
          - entities.Lot.fields.units_in_vessel
        distinguishing_aspect: |
          The physical ledger: starting the cycle moved 1000 units from untreated to in_vessel,
          and aborting the RUNNING cycle is the exact inverse move — the four buckets sum to
          unit_count both before and after, no units are lost to a treated or disposed bucket,
          and the pallet is back in cold storage rather than in a terminal state.
        test_recipe:
          setup:
            - "the standard VERDE / RTE_GUAC / HPP-1 / CR-1 world with cycle C1 RUNNING and PAL-001 in the chamber"
            - "before the trigger: units_untreated 0, units_in_vessel 1000, units_treated 0, units_disposed 0"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/terminate", payload: { reason: "intensifier seal failure mid-run" }, as: PlantOperator, as_user_id: "op_bob" }
          assert:
            - "VesselCycle.${cyc1_id}.state == ABORTED"
            - "Lot.${lot1_id}.units_untreated == 1000, units_in_vessel == 0, units_treated == 0, units_disposed == 0"
            - "Lot.${lot1_id}.units_untreated + units_in_vessel + units_treated + units_disposed == Lot.${lot1_id}.unit_count == 1000"
            - "Lot.${lot1_id}.custody_state == IN_COLD_STORAGE and release_state == NOT_RELEASED"
            - "CycleLoad.${load1_id}.disposition_state == VOIDED and allocated_fee_cents == null"
            - "Vessel.${vessel_id}.status == AVAILABLE and Vessel.${vessel_id}.cycles_run_count == 0"
            - "ColdRoom.${room_id}.occupied_pallets == 1 and capacity_state == NORMAL"

      - name: cancel_returns_the_contract_slot_to_available
        conserved_quantity: "CapacityContract.committed_slots == reserved_slots + consumed_slots + available_slots"
        grounds:
          - calculations.contract_slot_ledger
          - state_machines.CapacityContract.EXHAUSTED_to_ACTIVE
          - state_machines.VesselCycle.LOADED_to_CANCELLED
          - entities.CycleLoad.fields.disposition_state
        distinguishing_aspect: |
          A different conserved quantity — commercial slots rather than physical units — and a
          different compensating action (cancelling a cycle that never started): the VOIDED load
          belongs to no bucket at all, so the single committed slot returns to available_slots
          with zero drift and the contract's derived status walks back EXHAUSTED -> ACTIVE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; the standard VERDE / RTE_GUAC / HPP-1 / CR-1 world"
            - "spot contract FY26-SPOT ACTIVE with committed_slots 1"
            - "cycle C1 LOADED with PAL-001 against FY26-SPOT, so the contract reads reserved 1 / consumed 0 / available 0 and status EXHAUSTED"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract_spot
            - *activate_contract_spot
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1_spot
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/terminate", payload: { reason: "customer pulled the shipment" }, as: PlantScheduler }
          assert:
            - "VesselCycle.${cyc1_id}.state == CANCELLED"
            - "CycleLoad.${spot_load_id}.disposition_state == VOIDED and allocated_fee_cents == null"
            - "CapacityContract.${spot_id}.reserved_slots == 0, consumed_slots == 0, available_slots == 1"
            - "CapacityContract.${spot_id}.committed_slots == CapacityContract.${spot_id}.reserved_slots + consumed_slots + available_slots == 1"
            - "CapacityContract.${spot_id}.status == ACTIVE"
            - "Lot.${lot1_id}.custody_state == IN_COLD_STORAGE and units_untreated == 1000 (the pallet never entered the chamber)"

      - name: waive_reverses_the_chargeback_balance_exactly
        conserved_quantity: "Customer.chargeback_balance_cents == sum(ChargebackLine.amount_cents where status == PENDING)"
        grounds:
          - calculations.customer_chargeback_balance
          - state_machines.ChargebackLine.PENDING_to_WAIVED
          - endpoints[POST /chargeback-lines/{id}/waive]
          - entities.ChargebackLine.fields.amount_cents
        distinguishing_aspect: |
          A third conserved quantity — money — compensated without destroying the audit trail:
          the waive lowers the balance by exactly amount_cents and leaves amount_cents itself at
          6788 on a WAIVED row, so the balance is again the sum over PENDING lines only (0) while
          the history of the 3000 ppm load is still fully readable.
        test_recipe:
          setup:
            - "the world of leaker_rate_instantaneous_load_vs_trailing_90d_customer up to the inspection: load L1 at 3000 ppm, chargeback_party CUSTOMER, chargeback_cents 6788"
            - "one ChargebackLine (basis PACKAGE_LEAKER, amount_cents 6788, status PENDING) and Customer.chargeback_balance_cents 6788"
          setup_api_calls:
            - *clock_aug03
            - *mk_customer
            - *mk_family
            - *mk_vessel1
            - *mk_room1
            - *mk_qual
            - *submit_qual
            - *vrun_pass
            - *vrun_pass
            - *qualify_qual
            - *mk_contract
            - *activate_contract
            - *mk_lot1
            - *accept_lot1
            - *mk_cycle1
            - *load1_c1
            - *start_cycle1
            - *log_c1_clean
            - *disposition_c1
            - *inspect_load1_3000ppm
            - { call: "GET /chargeback-lines?customer_id=${cust_id}", as: FacilityAdmin, captures: { cb_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /chargeback-lines/${cb_id}/waive", payload: { waive_reason: "goodwill pending supplier claim" }, as: FacilityAdmin }
          assert:
            - "before the trigger: Customer.${cust_id}.chargeback_balance_cents == 6788"
            - "ChargebackLine.${cb_id}.status == WAIVED and ChargebackLine.${cb_id}.amount_cents == 6788 (unchanged)"
            - "ChargebackLine.${cb_id}.basis == PACKAGE_LEAKER and cycle_load_id == ${load1_id}"
            - "Customer.${cust_id}.chargeback_balance_cents == 0"
            - "CycleLoad.${load1_id}.chargeback_cents == 6788 and leaker_ppm == 3000 (the load's own record is untouched)"
