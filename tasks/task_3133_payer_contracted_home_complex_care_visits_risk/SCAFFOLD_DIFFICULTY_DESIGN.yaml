            - call: "POST /medical-costs"
              payload: { payer_contract_id: "${ss_contract}", member_id: "${m_a}", period_index: 0, amount_cents: 450000, incurred_date: "2026-08-15T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /medical-costs"
              payload: { payer_contract_id: "${ss_contract}", member_id: "${m_b}", period_index: 0, amount_cents: 650000, incurred_date: "2026-08-15T00:00:00Z" }
              as: ContractAdministrator
