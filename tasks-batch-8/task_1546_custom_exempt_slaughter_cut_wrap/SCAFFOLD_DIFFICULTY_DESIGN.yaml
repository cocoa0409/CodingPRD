      - name: no_show_cascade_animals_to_capacity_release
        grounds:
          - state_machines.Appointment.CONFIRMED_to_NO_SHOW
          - state_machines.Animal.EXPECTED_to_VOIDED
          - entities.CapacityDay.fields.booked_head
        distinguishing_aspect: |
          Depth-2 chain from the staff no-show trigger: Appointment -> NO_SHOW
          voids each EXPECTED animal (link 1); each animal voiding releases one
          head on the CapacityDay (link 2). Origin trigger (staff no-show)
          differs from the run-daily abandonment sweep.
        test_recipe:
          setup:
            - "Clock default 2026-08-01; c1 ACTIVE; CapacityDay 2026-08-16 cap 3"
            - "c1 has a CONFIRMED BEEF head_count 2 appointment (deposit 30000 paid): booked_head 2, two animals EXPECTED"
            - "Clock advanced to 2026-08-16 (appointment date reached)"
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
