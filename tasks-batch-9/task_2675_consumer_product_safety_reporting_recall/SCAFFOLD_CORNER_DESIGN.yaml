      - name: fiscal_ceilings_reject_impossible_quantities_and_over_assessment_offers
        claim_type: Violation -> Error
        grounds:
          - validations[33]
          - validations[32]
          - errors.ERR_UNITS_OUTSTANDING_EXCEEDED
          - errors.ERR_OFFER_EXCEEDS_ASSESSMENT
