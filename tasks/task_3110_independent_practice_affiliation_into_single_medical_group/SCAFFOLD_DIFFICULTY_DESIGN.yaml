  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: practice_affiliation_gated_by_assigned_wave_state
        grounds:
          - state_machines.Practice.ONBOARDING_to_AFFILIATED
          - state_machines.ImplementationWave.IN_CUTOVER_to_COMPLETE
          - entities.Practice.fields.wave_id
        distinguishing_aspect: |
          Pair Practice x ImplementationWave: the practice's ONBOARDING ->
          AFFILIATED transition exists only as a cascade of its assigned wave
          reaching COMPLETE. While the wave sits IN_CUTOVER (and after a rollback
          to LOCKED) the practice remains ONBOARDING regardless of any other
          action taken on the practice itself.
        test_recipe:
          setup:
            - "Base setup through wave IN_CUTOVER; practice ONBOARDING with wave_id assigned. Wave then rolled back to LOCKED before completion."
          setup_api_calls:
            - *k_clock
            - *k_group
            - *k_group_act
            - *k_market
            - *k_wave
            - *k_wave_lock
            - *k_wave_start
            - *k_practice
            - *k_agreement
            - *k_agreement_exec
            - call: "POST /api/implementation-waves/${wave_id}/rollback"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/practices/${prac_id}/suspend"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { err_prac: $.data.error_id }
            - call: "POST /api/implementation-waves/${wave_id}/start-cutover"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/implementation-waves/${wave_id}/complete"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
          assert:
            - "err_prac == ERR_INVALID_TRANSITION — no practice-side action can force AFFILIATED while the wave is not COMPLETE"
            - "After wave rollback + restart + complete: Practice.${prac_id}.status == AFFILIATED and affiliation_effective_date == \"2026-09-01\""
            - "Practice.${prac_id}.wave_id == ${wave_id} — the rollback did not strip the assignment"

      - name: statement_finalize_gated_by_batch_settlement_states
        grounds:
          - state_machines.DistributionStatement.PROVISIONAL_ISSUED_to_FINAL_ISSUED
          - state_machines.CollectionBatch.POSTED_to_SETTLED
          - errors.ERR_UNSETTLED_BATCHES_EXIST
        distinguishing_aspect: |
          Pair DistributionStatement x CollectionBatch — a different entity pair
          than Practice x Wave. Finalize is rejected while any period batch is
          POSTED and succeeds only after every batch is SETTLED or ADJUSTED; the
          statement's own state is unchanged by the batch settle (no auto-flip).
        test_recipe:
          setup:
