scaffold_corner_design:

  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: agency_creation_persists_due_diligence_checklist
        claim_type: creation
        grounds:
          - entities.Agency
          - endpoints["POST /recruitment/agencies"]
          - entities.Agency.fields.vetting_state
          - entities.Agency.fields.compliance_posture
          - entities.Agency.fields.current_tier
        distinguishing_aspect: |
          A registration with every checklist field supplied returns 201 and echoes both
          parallel state dimensions at their initial values with all six computed
          aggregates at zero and current_tier UNRATED.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at the mandated default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Sunrise Education Consultants", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          assert:
            - 'HTTP 201 and data.id is a server-generated identifier, data.created_at and data.updated_at are populated, data.version == 1'
            - 'Agency.${ag1_id}.legal_name == "Sunrise Education Consultants" and .home_country_code == "IN"'
            - 'Agency.${ag1_id}.ownership_disclosed == true and .beneficial_owner_count == 2 and .sanctions_screen_passed == true and .reference_check_count == 3'
            - 'Agency.${ag1_id}.vetting_state == "DRAFT" and .compliance_posture == "GOOD_STANDING"'
            - 'Agency.${ag1_id}.rolling_risk_score == 0.00 and .lifetime_risk_score == 0.00 and .confirmed_incident_count == 0 and .reviewed_document_count == 0 and .confirmed_fraud_document_count == 0'
            - 'Agency.${ag1_id}.net_earned_commission_cents == 0 and .clawback_liability_cents == 0 and .current_tier == "UNRATED" and .last_posture_reason == null'

      - name: agency_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /recruitment/agencies/{id}"]
          - entities.Agency
        distinguishing_aspect: |
          A read-back of a just-created agency returns the identical stored row, including
          both risk variants and both ledger aggregates, without mutating version.
        test_recipe:
          setup:
            - "One agency exists, created at the default clock instant."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Meridian Study Abroad", home_country_code: "VN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "GET /recruitment/agencies/${ag1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'HTTP 200 and data.id == "${ag1_id}"'
            - 'data.legal_name == "Meridian Study Abroad" and data.home_country_code == "VN" and data.beneficial_owner_count == 1'
            - 'data.rolling_risk_score == 0.00 and data.lifetime_risk_score == 0.00 and data.net_earned_commission_cents == 0'
            - 'data.version == 1 (a GET never advances the version)'

      - name: agency_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints["GET /recruitment/agencies"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three agencies and one of them CLEARED, limit/offset paging reports
          total_count 3 with has_more true on the first page, while the vetting_state
          filter narrows total_count to exactly 1.
        test_recipe:
          setup:
            - "Three agencies exist; the first one has been screened and cleared, the other two are still DRAFT."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Agency Alpha", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Agency Bravo", home_country_code: "NP" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag2_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Agency Charlie", home_country_code: "NG" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag3_id: "$.data.id" }
          trigger:
            - call: "GET /recruitment/agencies"
              payload: { limit: 2, offset: 0 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "GET /recruitment/agencies"
              payload: { limit: 2, offset: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "GET /recruitment/agencies"
              payload: { vetting_state: "CLEARED" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
          assert:
            - 'first page: HTTP 200, response_type == "array", len(data) == 2, meta/pagination reports total_count == 3, limit == 2, offset == 0, has_more == true'
            - 'second page: len(data) == 1, total_count == 3, offset == 2, has_more == false'
            - 'filtered read: len(data) == 1, total_count == 1, data[0].id == "${ag1_id}" and data[0].vetting_state == "CLEARED"'

      - name: agency_lookup_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=25]
          - errors[ERR_AGENCY_NOT_FOUND]
          - endpoints["GET /recruitment/agencies/{id}"]
        distinguishing_aspect: |
          A syntactically valid but unknown agency id resolves to ERR_AGENCY_NOT_FOUND with
          HTTP 404 rather than an empty 200 body.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /recruitment/agencies/8f14e45f-ceea-467a-9c2b-0000000000ff"
              payload: {}
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_agency: "$.data.error_id" }
          assert:
            - 'HTTP 404 with response_type == "error" and data.error_id == "ERR_AGENCY_NOT_FOUND"'
            - 'data.message is a non-empty string and no Agency row was created'

      - name: program_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /recruitment/programs"]
          - entities.Program.fields.census_date
        distinguishing_aspect: |
          Omitting the required census_date on program creation is rejected with
          ERR_INVALID_REQUEST at HTTP 400 and no Program row is persisted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_req: "$.data.error_id" }
            - call: "GET /recruitment/programs/8f14e45f-ceea-467a-9c2b-0000000000aa"
              payload: {}
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_prog: "$.data.error_id" }
          assert:
            - 'first call: HTTP 400 with data.error_id == "ERR_INVALID_REQUEST"'
            - 'no Program row exists after the rejected create (the follow-up read of an arbitrary id still returns ERR_PROGRAM_NOT_FOUND, 404)'

      - name: agency_defaults_applied_when_checklist_omitted
        claim_type: defaults
        grounds:
          - entities.Agency.fields.ownership_disclosed
          - entities.Agency.fields.beneficial_owner_count
          - entities.Agency.fields.sanctions_screen_passed
          - entities.Agency.fields.reference_check_count
        distinguishing_aspect: |
          Creating an agency with only the two mandatory fields materialises the four
          declared checklist defaults (false / 0 / false / 0) instead of nulls.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Minimal Agency", home_country_code: "BD" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          assert:
            - 'HTTP 201 and Agency.${ag1_id}.ownership_disclosed == false'
            - 'Agency.${ag1_id}.beneficial_owner_count == 0'
            - 'Agency.${ag1_id}.sanctions_screen_passed == false'
            - 'Agency.${ag1_id}.reference_check_count == 0'
            - 'Agency.${ag1_id}.vetting_state == "DRAFT" and .current_tier == "UNRATED"'

      - name: application_recruitment_origin_computed_extra_field_ignored
        claim_type: computed_fields
        grounds:
          - calculations.recruitment_origin_classification
          - entities.StudentApplication.fields.recruitment_origin
          - endpoints["POST /recruitment/applications"]
        distinguishing_aspect: |
          recruitment_origin is derived from student_us_person / student_residence_country
          alone, so a client-supplied recruitment_origin of INTERNATIONAL on a US-person
          application is ignored and the stored value is DOMESTIC.
        test_recipe:
          setup:
            - "One agency (GOOD_STANDING) and one program exist; the applicant is a US person resident in India."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Origin Test Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-001", student_residence_country: "IN", student_us_person: true, recruitment_origin: "INTERNATIONAL" }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - 'HTTP 201 and StudentApplication.${a1_id}.recruitment_origin == "DOMESTIC" (the supplied INTERNATIONAL value is discarded)'
            - 'StudentApplication.${a1_id}.status == "DRAFT" and .disclosure_state == "NOT_ISSUED" and .custody_agency_id == "${ag1_id}"'
            - 'StudentApplication.${a1_id}.projected_commission_cents == 0 and .net_commission_cents == 0 and .integrity_hold == false'

      - name: contract_system_fields_generated_by_server
        claim_type: system_fields
        grounds:
          - entities.AgentContract.fields.created_by_user_id
          - entities.AgentContract.fields.disclosure_template_version
          - entities.AgentContract.fields.amendment_round
          - endpoints["POST /recruitment/contracts"]
        distinguishing_aspect: |
          Contract creation stamps created_by_user_id from the X-User-ID header and seeds
          the four system fields (status DRAFT, disclosure_template_version 1,
          amendment_round 0, both signature user ids null) without any client input.
        test_recipe:
          setup:
            - "One agency exists in vetting_state DRAFT."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Contract Fields Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-7"
              captures: { c1_id: "$.data.id" }
          assert:
            - 'HTTP 201, data.id / data.created_at / data.updated_at generated, data.version == 1'
            - 'AgentContract.${c1_id}.status == "DRAFT" and .disclosure_template_version == 1 and .amendment_round == 0'
            - 'AgentContract.${c1_id}.created_by_user_id == "officer-7" (taken from X-User-ID, not from the body)'
            - 'AgentContract.${c1_id}.agency_signed_by_user_id == null and .compliance_approved_by_user_id == null and .terminated_on == null and .termination_reason_code == null and .suspension_reason == null'

      - name: territory_assignment_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=20]
          - entities.TerritoryAssignment.fields.exclusivity
          - entities.TerritoryAssignment.fields.end_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          An out-of-range exclusivity enum and a non-increasing date interval are both
          structural failures caught at priority 20 with ERR_INVALID_REQUEST, before any
          exclusivity-geometry rule at priority 65 can run.
        test_recipe:
          setup:
            - "One agency with a DRAFT contract whose term is 2026-08-01..2027-07-31."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Enum Test Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "SEMI_EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-09-01", end_date: "2026-09-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_range: "$.data.error_id" }
          assert:
            - 'first call: HTTP 400 with data.error_id == "ERR_INVALID_REQUEST" (SEMI_EXCLUSIVE is not in the declared enum)'
            - 'second call: HTTP 400 with data.error_id == "ERR_INVALID_REQUEST" (end_date must be strictly greater than start_date)'
            - 'GET /recruitment/contracts/${c1_id}/territory-assignments returns an empty array with total_count == 0'

      - name: file_transition_is_immutable_and_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.FileTransition
          - entities.FileTransition.common_fields
          - endpoints["GET /recruitment/file-transitions"]
          - endpoints["GET /recruitment/file-transitions/{id}"]
        distinguishing_aspect: |
          FileTransition is declared common_fields false, so the row produced by a
          CONVENIENCE termination is exposed only through the two read endpoints, carries
          no version field, and has no update or delete route anywhere in the API surface.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED with an ACTIVE contract c1 and one DRAFT application in its custody."
            - "The contract is then terminated for CONVENIENCE with no successor agency, so custody falls in-house."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Transition Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id", c1_v: "$.data.version" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-08-01", effective_to: "2027-07-31", deposit_rate_bps: 400, enrollment_rate_bps: 500, census_rate_bps: 200, persistence_rate_bps: 150, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "SEND_FOR_SIGNATURE" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "AGENCY_SIGN" }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "COMPLIANCE_APPROVE" }
              as: ComplianceOfficer
              as_user_id: "compliance-2"
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c1_id}/terminate"
              payload: { reason_code: "CONVENIENCE", effective_date: "2026-08-01", transition_note: "Agency exited the market" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "GET /recruitment/file-transitions"
              payload: { application_id: "${a1_id}" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { ft1_id: "$.data[0].id" }
            - call: "GET /recruitment/file-transitions/${ft1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'the list returns exactly one row: total_count == 1'
            - 'FileTransition.${ft1_id}.application_id == "${a1_id}" and .from_agency_id == "${ag1_id}" and .to_agency_id == null and .trigger_contract_id == "${c1_id}"'
            - 'FileTransition.${ft1_id}.reason_code == "TERMINATION_CONVENIENCE" and .application_status_at_transition == "DRAFT" and .disclosure_reset == true'
            - 'the single-row response body contains no version key (common_fields false)'
            - 'the §1.5 endpoint table declares no PATCH, PUT or DELETE route under /recruitment/file-transitions, so the row cannot be mutated after creation'
            - 'StudentApplication.${a1_id}.custody_agency_id == null and .disclosure_state == "INVALIDATED"'

      - name: contract_creation_validates_agency_foreign_key
        claim_type: cross_reference_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=27]
          - errors[ERR_AGENCY_NOT_FOUND]
          - endpoints["POST /recruitment/contracts"]
        distinguishing_aspect: |
          In the flat topology the parent is named only by a body foreign key, so an
          unresolvable agency_id fails at priority 27 with ERR_AGENCY_NOT_FOUND while the
          identical request against a real agency_id succeeds.
        test_recipe:
          setup:
            - "One agency exists."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "FK Test Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "8f14e45f-ceea-467a-9c2b-0000000000bb", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_fk: "$.data.error_id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
          assert:
            - 'first call: HTTP 404 with data.error_id == "ERR_AGENCY_NOT_FOUND"'
            - 'second call: HTTP 201 with AgentContract.${c1_id}.agency_id == "${ag1_id}" (contract_ref CTR-001 was never consumed by the rejected attempt)'
            - 'GET /recruitment/contracts with agency_id == "${ag1_id}" returns total_count == 1'

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: vetting_submit_for_screening_valid_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Agency.vetting_state.DRAFT_to_SCREENING
          - endpoints["POST /recruitment/agencies/{id}/vetting"]
        distinguishing_aspect: |
          SUBMIT_FOR_SCREENING moves vetting_state DRAFT to SCREENING, bumps the version and
          leaves the independent compliance_posture dimension untouched.
        test_recipe:
          setup:
            - "One agency in vetting_state DRAFT / compliance_posture GOOD_STANDING."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Screening Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING", note: "Dossier complete" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
          assert:
            - 'HTTP 200 and Agency.${ag1_id}.vetting_state == "SCREENING"'
            - 'Agency.${ag1_id}.compliance_posture == "GOOD_STANDING" (unchanged)'
            - 'Agency.${ag1_id}.version == 2'

      - name: application_created_in_dual_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.StudentApplication.status.initial_state
          - state_machines.StudentApplication.disclosure_state.initial_state
          - endpoints["POST /recruitment/applications"]
        distinguishing_aspect: |
          A newly created application starts simultaneously in status DRAFT and
          disclosure_state NOT_ISSUED, with both disclosure pinning fields still null.
        test_recipe:
          setup:
            - "One agency and one program exist."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Initial State Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/applications"
              payload: { agency_id: "${ag1_id}", program_id: "${prog1_id}", student_ref: "STU-001", student_residence_country: "IN", student_us_person: false }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - 'HTTP 201 and StudentApplication.${a1_id}.status == "DRAFT"'
            - 'StudentApplication.${a1_id}.disclosure_state == "NOT_ISSUED"'
            - 'StudentApplication.${a1_id}.disclosure_template_version == null and .disclosure_ack_token == null and .disclosure_acknowledged_at == null'
            - 'StudentApplication.${a1_id}.submitted_on == null and .pinned_contract_id == null and .pinned_schedule_id == null and .tier_snapshot_at_submission == null'

      - name: vetting_clear_from_draft_is_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.Agency.vetting_state
          - validations[priority=40]
          - errors[ERR_INVALID_VETTING_STATE]
        distinguishing_aspect: |
          CLEAR is defined only from SCREENING, so requesting it from DRAFT returns
          ERR_INVALID_VETTING_STATE (409) even though the due-diligence checklist is
          complete and would satisfy the priority-56 precondition.
        test_recipe:
          setup:
            - "One agency in vetting_state DRAFT whose four checklist items are all satisfied."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Premature Clear Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 2, sanctions_screen_passed: true, reference_check_count: 3 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { err_state: "$.data.error_id" }
          assert:
            - 'HTTP 409 with data.error_id == "ERR_INVALID_VETTING_STATE" (state legality at priority 40 precedes the checklist rule at priority 56)'
            - 'Agency.${ag1_id}.vetting_state == "DRAFT" and .version == 1 (no write occurred)'

      - name: clear_with_incomplete_due_diligence_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Agency.vetting_state.SCREENING_to_CLEARED
          - validations[priority=56]
          - errors[ERR_DUE_DILIGENCE_INCOMPLETE]
        distinguishing_aspect: |
          With reference_check_count 1 the CLEAR precondition set fails on exactly one item
          and returns ERR_DUE_DILIGENCE_INCOMPLETE (422); raising the count to 2 through
          PATCH then makes the same CLEAR succeed.
        test_recipe:
          setup:
            - "One agency in SCREENING with ownership disclosed, sanctions passed, 1 beneficial owner but only 1 reference check."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Diligence Gap Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 1 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { err_dd: "$.data.error_id" }
            - call: "PATCH /recruitment/agencies/${ag1_id}"
              payload: { reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'first CLEAR: HTTP 422 with data.error_id == "ERR_DUE_DILIGENCE_INCOMPLETE" and Agency.${ag1_id}.vetting_state stays "SCREENING"'
            - 'after the PATCH, Agency.${ag1_id}.reference_check_count == 2'
            - 'second CLEAR: HTTP 200 and Agency.${ag1_id}.vetting_state == "CLEARED"'

      - name: vetting_reject_terminates_pending_contracts
        claim_type: side_effect_execution
        grounds:
          - state_machines.Agency.vetting_state.SCREENING_to_REJECTED
          - state_machines.AgentContract.status
          - entities.AgentContract.fields.termination_reason_code
        distinguishing_aspect: |
          REJECT does more than move the agency to a terminal vetting state: its declared
          side effect terminates the agency's DRAFT contract with termination_reason_code
          NON_RENEWAL in the same request.
        test_recipe:
          setup:
            - "One agency in SCREENING that already holds one DRAFT contract."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Reject Cascade Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "REJECT", note: "Adverse media on the beneficial owner" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'HTTP 200 and Agency.${ag1_id}.vetting_state == "REJECTED"'
            - 'AgentContract.${c1_id}.status == "TERMINATED" and .termination_reason_code == "NON_RENEWAL"'
            - 'Agency.${ag1_id}.compliance_posture == "GOOD_STANDING" (the posture dimension is not touched by a vetting rejection)'

      - name: rejected_agency_cannot_resubmit
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Agency.vetting_state.terminal_states
          - validations[priority=40]
          - errors[ERR_INVALID_VETTING_STATE]
        distinguishing_aspect: |
          REJECTED is terminal, so neither RESUBMIT nor RE_SCREEN nor SUBMIT_FOR_SCREENING
          is accepted afterwards and the agency can never re-enter the screening cycle.
        test_recipe:
          setup:
            - "One agency has been screened and rejected."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Terminal Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "REJECT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          trigger:
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "RESUBMIT" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_resubmit: "$.data.error_id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "RE_SCREEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { err_rescreen: "$.data.error_id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_submit: "$.data.error_id" }
          assert:
            - 'all three calls return HTTP 409 with data.error_id == "ERR_INVALID_VETTING_STATE"'
            - 'Agency.${ag1_id}.vetting_state == "REJECTED" throughout and the version never advances past the value it had after the rejection'

      - name: second_agency_sign_rejected_as_non_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.AgentContract.status.PENDING_AGENCY_SIGNATURE_to_PENDING_COMPLIANCE_REVIEW
          - validations[priority=41]
          - errors[ERR_INVALID_CONTRACT_STATE]
        distinguishing_aspect: |
          Replaying AGENCY_SIGN on a contract already in PENDING_COMPLIANCE_REVIEW is a
          409 ERR_INVALID_CONTRACT_STATE rather than a silent no-op, so the signature is
          not re-stamped and the version does not advance twice.
        test_recipe:
          setup:
            - "Agency ag1 is CLEARED; contract c1 carries one rate card and has been signed once, so it sits in PENDING_COMPLIANCE_REVIEW."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Double Sign Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
