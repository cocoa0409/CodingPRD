  - rule_id: boundary_precision_check
    instances:
      - name: panel_approval_threshold_inclusive_bound_and_focus_multiplier_half_cent
        grounds:
          - calculations.request_panel_composite_score
          - calculations.request_panel_composite_score.constants.PANEL_APPROVAL_THRESHOLD
          - calculations.request_panel_composite_score.constants.FOCUS_MULTIPLIER
          - state_machines.AllocationRequest.UNDER_PANEL_REVIEW_to_PANEL_APPROVED
          - state_machines.AllocationRequest.UNDER_PANEL_REVIEW_to_PANEL_DECLINED
          - endpoints.POST_fundraising_allocation_requests_id_finalize_review
        distinguishing_aspect: |
          Metric: composite_score (a dimensionless 0..100 panel score) against the inclusive lower
          bound PANEL_APPROVAL_THRESHOLD == 72.00, exercised on POST
          /fundraising/allocation-requests/{id}/finalize-review. Because the three raw panel
          inputs are integers, the smallest representable step in weighted_score is 0.05, so the
          just-below leg sits at exactly 71.95 - no larger gap is available to hide a `>` vs `>=`
          bug in. A third leg lands the FOCUS_MULTIPLIER product exactly on a half cent
          (76.50 * 1.15 == 87.9750): round_half_up gives 87.98, while IEEE-754 doubles evaluate
          76.5 * 1.15 to 87.97499999999999 and round to 87.97.
        test_recipe:
          setup:
            - "Three agencies AG_AT, AG_BELOW and AG_PREC, each driven to GOOD_STANDING by a review certified at 100.00."
            - "Three panelists P1, P2, P3, all seated on the cycle with conflict_declared == false, so every filed score is eligible and the pool size 3 stays under TRIM_MIN_COUNT (plain mean, no trim)."
            - "One OPEN cycle: focus_priority_area EDUCATION, opening_undesignated_pool 400000.00, max_award_per_agency 200000.00, request window [2026-07-01, 2026-12-31)."
            - "Three SUBMITTED requests of 40000.00 each: REQ_AT and REQ_BELOW in HEALTH (no focus match, multiplier 1.00) and REQ_PREC in EDUCATION (focus match, multiplier 1.15)."
            - "All three panelists file the same triple on each request, so the plain mean equals the single weighted_score exactly and the boundary is not blurred by averaging: (72,72,72) -> 72.00 on REQ_AT, (71,73,72) -> 71.95 on REQ_BELOW, (75,80,74) -> 76.50 on REQ_PREC."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Bayview Health Partners", ein: "110000001", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
