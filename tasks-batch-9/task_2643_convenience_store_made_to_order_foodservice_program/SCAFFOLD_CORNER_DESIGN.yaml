              captures: { seq_a: "$.data[0].sequence_position", lead_a: "$.data[0].lead_seconds", prep_a: "$.data[0].prep_seconds" }
            - call: "GET /kitchen-tickets"
              payload: { order_id: "${order_b}", station: "SANDWICH" }
              as: KitchenAssociate
              captures: { seq_b: "$.data[0].sequence_position", lead_b: "$.data[0].lead_seconds", prom_b: "$.data[0].promised_ready_at" }
          assert:
            - "${seq_a} == 1"
            - "${lead_a} == 0"
            - "${prep_a} == 180"
            - "${eta_a} == 2026-08-01T11:03:00Z"
            - "${seq_b} == 2"
            - "${lead_b} == 180"
            - "${prom_b} == 2026-08-01T11:06:00Z"
            - "${eta_b} == 2026-08-01T11:06:00Z"
            - "GET /stores/${store_id}/kitchen-queue?station=SANDWICH -> total_count == 2"

      - name: pct_per_line_cap_redistribution_shaves_the_last_eligible_line
        claim_type: tiered_pricing
        grounds:
          - calculations.promotion_discount
          - entities.PromotionRule.fields.max_discount_cents
          - entities.OrderLine.fields.line_discount_cents
        distinguishing_aspect: |
          Raw per-line discounts are 450 (hoagie 899) and 125 (coffee 249) for 575, above the 500 cap. The
          cap must be absorbed entirely by the LAST eligible line by created_at: hoagie keeps 450 and coffee
          drops to 50, so the per-line discounts still sum exactly to promo_discount_cents 500. Pro-rata
          scaling would give 391/109, and capping only the order total would leave the line columns at
          450/125 and break the sum invariant.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan for 2026-08-01"
            - "one ACTIVE LUNCH DAYPART_BUNDLE rule PCT-CAP at 5000 bp, target_station ALL, capped at 500c"
            - "one DRAFT anonymous TOUCHSCREEN order: hoagie line created first, coffee line second"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /promotion-rules"
              payload: { code: "PCT-CAP", kind: "DAYPART_BUNDLE", discount_kind: "PCT_PER_LINE", discount_bp: 5000, max_discount_cents: 500, valid_dayparts: ["LUNCH"], stacking_rank: 1, target_station: "ALL" }
              as: ChainAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { coffee_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 1 }
              as: StoreTerminal
              captures: { line_h: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${coffee_id}", qty: 1 }
              as: StoreTerminal
              captures: { line_c: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { promo: $.data.applied_promotion_id, disc: $.data.promo_discount_cents, tot: $.data.total_cents, pts: $.data.points_provisional }
          assert:
            - "${promo} == ${promo_id}"
            - "${disc} == 500"
            - "${tot} == 648"
            - "${pts} == 6"
            - "Order.${order_id}.subtotal_gross_cents == 1148"
            - "OrderLine.${line_h}.line_discount_cents == 450"
            - "OrderLine.${line_h}.line_net_cents == 449"
            - "OrderLine.${line_c}.line_discount_cents == 50"
            - "OrderLine.${line_c}.line_net_cents == 199"

      - name: promotion_selection_prefers_the_bigger_discount_over_the_lower_rank
        claim_type: weighted_scoring
        grounds:
          - calculations.promotion_selection
          - entities.PromotionRule.fields.stacking_rank
        distinguishing_aspect: |
          rank_key is (-candidate_discount, stacking_rank, created_at), so discount size dominates and
          stacking_rank is only a TIE-BREAK. BUNDLE-SMALL has the better rank 1 but only 200c; BUNDLE-BIG
          has rank 5 and 900c and must win, giving promo_discount_cents 900 and total 898. Sorting by
          stacking_rank first applies 200 and reports 1598.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan for 2026-08-01"
            - "two ACTIVE LUNCH DAYPART_BUNDLE CENTS_OFF rules: BUNDLE-SMALL 200c at stacking_rank 1, BUNDLE-BIG 900c at stacking_rank 5"
            - "one DRAFT anonymous TOUCHSCREEN order with two hoagies, subtotal 1798, so neither rule is clipped by the subtotal"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /promotion-rules"
              payload: { code: "BUNDLE-SMALL", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 200, max_discount_cents: 200, valid_dayparts: ["LUNCH"], stacking_rank: 1 }
              as: ChainAdmin
              captures: { small_id: $.data.id }
            - call: "POST /promotion-rules"
              payload: { code: "BUNDLE-BIG", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 900, max_discount_cents: 900, valid_dayparts: ["LUNCH"], stacking_rank: 5 }
              as: ChainAdmin
              captures: { big_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 2 }
              as: StoreTerminal
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { promo: $.data.applied_promotion_id, disc: $.data.promo_discount_cents, tot: $.data.total_cents }
          assert:
            - "${promo} == ${big_id}"
            - "${promo} != ${small_id}"
            - "${disc} == 900"
            - "${tot} == 898"
            - "Order.${order_id}.subtotal_gross_cents == 1798"
            - "GET /orders?applied_promotion_id=${big_id} -> total_count == 1"
            - "GET /orders?applied_promotion_id=${small_id} -> total_count == 0"

      - name: readiness_reports_ready_for_a_freshly_logged_compliant_store
        claim_type: correct_result
        grounds:
          - calculations.inspection_readiness
          - endpoints[GET /stores/{id}/readiness]
        distinguishing_aspect: |
          The all-clear branch of the readiness ladder: one unit, one in-range reading inside the 240-minute
          window, no impairment, no OPEN corrective action and no waste gives compliance 100 and
          readiness_status READY. Both waste columns must read 0 - food_cost_waste_cents_mtd is the SUM of
          waste_cost_cents_mtd and rework_waste_cents_mtd, so it is only trustworthy on a store where both
          are zero and on the cascade instances where they are not.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with a single BAKERY_CASE unit BC-1 banded 135..185 F"
            - "no batches, no orders, no waste"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /holding-units/${unit_id}/temperature-logs"
              payload: { reading_f: 160 }
              as: KitchenAssociate
              as_user_id: "assoc-1"
              captures: { log_id: $.data.id, in_range: $.data.in_range }
          trigger:
            - call: "GET /stores/${store_id}/readiness"
              payload: {}
              as: FoodSafetyLead
              captures: { pct: $.data.temp_log_compliance_pct, imp: $.data.units_impaired_count, lock: $.data.units_locked_out_count, open: $.data.open_corrective_actions_count, food: $.data.food_cost_waste_cents_mtd, retail: $.data.retail_waste_exposure_cents, st: $.data.readiness_status }
          assert:
            - "${in_range} == true"
            - "HTTP status == 200"
            - "${pct} == 100"
            - "${imp} == 0"
            - "${lock} == 0"
            - "${open} == 0"
            - "${food} == 0"
            - "${retail} == 0"
            - "${st} == READY"
            - "HoldingUnit.${unit_id}.status == OPERATIONAL"
            - "HoldingUnit.${unit_id}.consecutive_out_of_range_count == 0"
            - "HoldingUnit.${unit_id}.last_temp_log_at == 2026-08-01T06:00:00Z"

      - name: slot_occupancy_interval_adjacency_corner
        claim_type: interval_merge
        grounds:
          - calculations.slot_occupancy_conflict
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / sanitation_buffered_slot_interval_touches_legally_at_ten_forty"
          rationale: "Adjacent-at-the-boundary and one-minute-overlap are both driven there against the same 15-minute sanitation buffer."

      - name: fefo_batch_allocation_order_corner
        claim_type: waterfall_allocation
        grounds:
          - calculations.batch_selection_fefo
        excluded_because:
          difficulty_instance: "boundary_precision_check / fefo_excludes_a_batch_whose_hold_expires_exactly_at_the_clock"
          rationale: "Earliest-expiry-first ordering and the no-split remaining_qty requirement are both asserted there."

      - name: order_total_assembly_propagation_corner
        claim_type: constraint_propagation
        grounds:
          - calculations.order_total_assembly
        excluded_because:
          difficulty_instance: "combinatorial_formula / catering_service_fee_evaluated_after_discount_not_on_gross"
          rationale: "The pinned six-step propagation from line gross through discount to fee and total is exactly what that instance pins down."

      - name: loyalty_and_waste_variant_divergence_corner
        claim_type: variant_divergence
        grounds:
          - calculations.loyalty_points_accrual.variants
          - calculations.waste_valuation.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / waste_valuation_food_cost_vs_retail_diverge_on_quality_discard"
          rationale: "Both dual-variant rules have a dedicated SS1.8 instance that computes each variant and the delta between them."

      - name: provisional_variant_chosen_at_placement_corner
        claim_type: variant_selection
        grounds:
          - calculations.loyalty_points_accrual.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / loyalty_points_provisional_vs_final_diverge_on_catering_fuel_combo"
          rationale: "That instance asserts the PROVISIONAL variant at place and the FINAL variant at settle on the same order."

      - name: settlement_delta_reconciliation_corner
        claim_type: reconciliation
        grounds:
          - calculations.loyalty_points_accrual
          - entities.LoyaltyAccount.fields.points_balance
        excluded_because:
          difficulty_instance: "dual_variant_calc / loyalty_points_provisional_vs_final_diverge_on_catering_fuel_combo"
          rationale: "The +57 settlement_delta posted to the balance on the provisional-to-final switch is asserted there."

  # =========================================================================
  - section: validations
    instances:

      - name: discard_with_a_system_only_reason_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_RESERVED_DISCARD_REASON]
          - endpoints[POST /production-batches/{id}/discard]
        distinguishing_aspect: |
          UNIT_IMPAIRED and DAYPART_TRANSITION are members of the WasteLog reason enum but are reserved for
          the system sweeps, so an operator passing UNIT_IMPAIRED must get ERR_RESERVED_DISCARD_REASON (422)
          rather than a 400 enum error or a successful write. The batch ledger and the waste log must be
          untouched afterwards.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; one pretzel batch of 40 baked and pulled, HOLDING in slot 1 of BC-1"
            - "batch version is 3 after create/bake/pull"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { b_v: $.data.version }
          trigger:
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 5, reason: "UNIT_IMPAIRED", expected_batch_version: "${b_v}" }
              as: ShiftLead
              as_user_id: "lead-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_RESERVED_DISCARD_REASON"
            - "ProductionBatch.${batch_id}.status == HOLDING"
            - "ProductionBatch.${batch_id}.remaining_qty == 40"
            - "ProductionBatch.${batch_id}.discarded_qty == 0"
            - "ProductionBatch.${batch_id}.version == 3"
            - "GET /production-batches/${batch_id}/waste-logs -> total_count == 0"
            - "Store.${store_id}.waste_cost_cents_mtd == 0"

      - name: catering_order_placed_exactly_at_the_720_minute_lead_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=34]
          - validations[priority=40]
          - calculations.pickup_window_capacity.constants
          - calculations.order_total_assembly
        distinguishing_aspect: |
          The lead-time check is >=, so a catering window starting exactly 720 minutes after the clock
          (11:00:00Z to 23:00:00Z) must PASS rather than trip ERR_PREORDER_LEAD_TIME_TOO_SHORT. The subtotal
          5394 also clears the 5000 catering minimum exactly-on-the-right-side, and the fee floor bites:
          8% of 5394 is 432, below CATERING_MIN_FEE_CENTS, so service_fee_cents is 500 and total is 5894.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan for 2026-08-01 and pickup_slot_capacity 2"
            - "hoagie 899c is catering-eligible and valid in LUNCH; no promotion rules exist"
            - "one DRAFT anonymous CATERING order for the window 23:00:00Z to 23:30:00Z with six hoagies, subtotal 5394"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
