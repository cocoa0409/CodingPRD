# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Pottery & Ceramics Studio — Expert
# 9 rule_ids x 2 instances = 18 instances total
# All numeric asserts are literals computed against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_charge_provisional_vs_settled_silver
        grounds:
          - calculations.settle_visit_charge
          - state_machines.StudioVisit.OPEN_to_SETTLED
          - entities.StudioVisit.fields.provisional_total_cents
          - entities.StudioVisit.fields.settled_total_cents
        distinguishing_aspect: |
          On a SILVER member's StudioVisit (cost domain), provisional_total_cents (11000, pre-discount)
          and settled_total_cents (10500, after 5% bisque tier discount of 500) diverge by exactly the
          tier discount; the provisional variant omits the discount the settled variant applies.
        test_recipe:
          setup:
            - "A LoyaltyMember exists who is SILVER (lifetime_points_earned=550 from one enrollment in a 50000-cent, 8-session series)."
            - "An OPEN WALK_IN visit for that member, party_size=1, with two PAINTED pieces priced 6000 and 4000; no supplies."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "silver1@x.com", full_name: "Silver One", phone: "555-0001" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Wheel 101", session_count: 8, seat_capacity: 5, price_cents: 50000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 6000, firing_temp: "CONE_06" }
              as: StudioStaff
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "BOWL-8IN", name: "Bowl", bisque_price_cents: 4000, firing_temp: "CONE_06" }
              as: StudioStaff
          trigger:
            - call: "GET /studio-visits/${visit_id}"
              as: StudioStaff
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "StudioVisit.${visit_id}.provisional_total_cents == 11000"
            - "LoyaltyMember.${mem_id}.tier == SILVER"
            - "After checkout, StudioVisit.${visit_id}.settled_total_cents == 10500 and discount_cents == 500"

      - name: visit_points_estimate_vs_actual_silver
        grounds:
          - calculations.visit_points_earned
          - state_machines.StudioVisit.OPEN_to_SETTLED
          - entities.LoyaltyMember.fields.point_balance
          - endpoints
        distinguishing_aspect: |
          Loyalty-point domain (LoyaltyMember), not cost: the estimate variant on /points-preview uses
          provisional_total_cents=13000 -> 195 points, while the actual variant credited at checkout uses
          settled_total_cents=12400 -> 186 points; estimate exceeds actual by exactly the points lost to the discount.
        test_recipe:
          setup:
            - "A SILVER member (lifetime 550 via one 50000/8 enrollment)."
            - "An OPEN WALK_IN visit, party_size=1, with one piece priced 12000 that has been fired to READY; no supplies; points_redeemed=0."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "silver2@x.com", full_name: "Silver Two", phone: "555-0002" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Wheel 102", session_count: 8, seat_capacity: 5, price_cents: 50000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "VASE-L", name: "Large Vase", bisque_price_cents: 12000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "KilnP", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${bv}" }
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
            - call: "POST /kiln-batches/${batch_id}/complete-firing"
              as: StudioStaff
          trigger:
            - call: "GET /studio-visits/${visit_id}/points-preview"
              as: StudioStaff
              captures: { est: $.data.points_earned }
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 0 }
              as: StudioStaff
              captures: { actual: $.data.points_earned }
          assert:
            - "points-preview returns points_earned == 195 (estimate variant on provisional 13000)"
            - "Checkout response StudioVisit.${visit_id}.points_earned == 186 (actual variant on settled 12400)"
            - "LoyaltyMember.${mem_id}.point_balance == 736 (550 from enrollment + 186 from visit)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: settle_visit_pinned_eval_order_circular
        grounds:
          - calculations.settle_visit_charge
          - entities.StudioVisit.fields.discount_cents
          - state_machines.StudioVisit.OPEN_to_SETTLED
        distinguishing_aspect: |
          Mode (c): evaluation order is pinned — tier_discount is keyed off bisque_subtotal which also
          feeds subtotal_before_discount, and redemption is then subtracted; computing discount before
          subtotal yields a well-defined 10500, not an order-ambiguous value.
        test_recipe:
          setup:
            - "A SILVER member; OPEN WALK_IN visit party_size=1 with pieces 6000+4000=10000 bisque, no supplies, redeem 0."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "combo1@x.com", full_name: "Combo One", phone: "555-0003" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Wheel 103", session_count: 8, seat_capacity: 5, price_cents: 50000, starts_at: "2026-07-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 6000, firing_temp: "CONE_06" }
              as: StudioStaff
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "BOWL-8IN", name: "Bowl", bisque_price_cents: 4000, firing_temp: "CONE_06" }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 0 }
              as: StudioStaff
          assert:
            - "StudioVisit.${visit_id}.settled_total_cents == 10500"
            - "StudioVisit.${visit_id}.discount_cents == 500"
            - "StudioVisit.${visit_id}.bisque_subtotal_cents == 10000 and studio_fee_cents == 1000"

      - name: supplies_charge_per_line_round_then_sum
        grounds:
          - calculations.supplies_charge
          - entities.StudioVisit.fields.supplies_subtotal_cents
          - entities.PaintBarItem.fields.on_hand_qty
        distinguishing_aspect: |
          Mode (b): rounding order is pinned to round-per-line-then-sum — line qty=3 @500 rounds to 1350
          and line qty=5 @350 rounds to 1575, summing to 2925; summing raw (1500+1750)*0.9=2925 happens to
          tie here but the scaffold pins per-line rounding so mixed-rate lines stay deterministic.
        test_recipe:
          setup:
            - "Two ACTIVE PaintBarItems: GLZ-A @500 with on_hand 50, GLZ-B @350 with on_hand 50."
            - "An OPEN WALK_IN visit, party_size=1, no pieces."
          setup_api_calls:
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-A", name: "Glaze A", category: "GLAZE", unit_price_cents: 500, reorder_threshold: 5 }
              as: StudioManager
              captures: { item_a: $.data.id }
            - call: "POST /paint-bar-items/${item_a}/restock"
              payload: { qty: 50 }
              as: StudioManager
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-B", name: "Glaze B", category: "GLAZE", unit_price_cents: 350, reorder_threshold: 5 }
              as: StudioManager
              captures: { item_b: $.data.id }
            - call: "POST /paint-bar-items/${item_b}/restock"
              payload: { qty: 50 }
              as: StudioManager
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/consume"
              payload: { paint_bar_item_id: "${item_a}", qty: 3 }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/consume"
              payload: { paint_bar_item_id: "${item_b}", qty: 5 }
              as: StudioStaff
              captures: { sub: $.data.supplies_subtotal_cents }
          assert:
            - "StudioVisit.${visit_id}.supplies_subtotal_cents == 2925 (1350 + 1575)"
            - "PaintBarItem.${item_a}.on_hand_qty == 47 and PaintBarItem.${item_b}.on_hand_qty == 45"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bisque_piece_load_unload_cycle
        grounds:
          - state_machines.BisquePiece.PAINTED_to_LOADED
          - state_machines.BisquePiece.LOADED_to_PAINTED
          - entities.KilnBatch.fields.occupied_slots
        distinguishing_aspect: |
          BisquePiece has a cycle PAINTED -> LOADED -> PAINTED (revision loop): un-loading returns the piece
          to PAINTED and decrements batch.occupied_slots back to 0, proving the machine is non-linear on the piece entity.
        test_recipe:
          setup:
            - "An OPEN WALK_IN visit with one PAINTED CONE_06 piece (3000)."
            - "A LOADING CONE_06 KilnBatch capacity 4, occupied 0, version 1."
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "PLATE-10", name: "Plate", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln A", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${batch_v}" }
              as: StudioStaff
          trigger:
            - call: "POST /bisque-pieces/${piece_id}/unload"
              as: StudioStaff
          assert:
            - "BisquePiece.${piece_id}.status == PAINTED and kiln_batch_id == null"
            - "KilnBatch.${batch_id}.occupied_slots == 0 and KilnBatch.${batch_id}.version == 3"

      - name: class_series_full_to_open_reopen_cycle
        grounds:
          - state_machines.ClassSeries.OPEN_to_FULL
          - state_machines.ClassSeries.FULL_to_OPEN
          - entities.ClassSeries.fields.enrolled_count
        distinguishing_aspect: |
          ClassSeries (different entity from BisquePiece) cycles OPEN -> FULL -> OPEN: the seat fills to
          capacity (FULL) then a withdrawal reopens a seat (back to OPEN), a non-linear bubble-up cycle.
        test_recipe:
          setup:
            - "A ClassSeries seat_capacity=1, OPEN, future starts_at."
            - "Two ACTIVE members."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "cyc1@x.com", full_name: "Cyc One", phone: "555-0010" }
              as: StudioManager
              captures: { m1: $.data.id }
            - call: "POST /class-series"
              payload: { title: "Cap1", session_count: 4, seat_capacity: 1, price_cents: 12000, starts_at: "2026-07-15T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${m1}" }
              as: StudioStaff
              captures: { enr1: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr1}/withdraw"
              as: StudioStaff
          assert:
            - "Before withdraw, ClassSeries.${series_id}.status == FULL and enrolled_count == 1"
            - "After withdraw, ClassSeries.${series_id}.status == OPEN and enrolled_count == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: series_cancel_refunds_and_reverses_points_depth3
        grounds:
          - state_machines.ClassSeries.OPEN_to_CANCELLED
          - state_machines.Enrollment.ENROLLED_to_REFUNDED
          - entities.LoyaltyMember.fields.point_balance
          - entities.LoyaltyMember.fields.tier
        distinguishing_aspect: |
          Depth-3 chain: cancelling ClassSeries -> Enrollment ENROLLED->REFUNDED -> the enrollment's REVERSAL
          debits LoyaltyMember.point_balance/lifetime which -> member_tier recompute; each hop is caused by the prior.
        test_recipe:
          setup:
            - "A member SILVER from one enrollment (50000/8 series -> 550 lifetime/balance)."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "casc1@x.com", full_name: "Casc One", phone: "555-0020" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /class-series"
              payload: { title: "BigSeries", session_count: 8, seat_capacity: 5, price_cents: 50000, starts_at: "2026-07-20T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /class-series/${series_id}/cancel"
              as: StudioManager
          assert:
            - "Enrollment.${enr_id}.status == REFUNDED"
            - "LoyaltyMember.${mem_id}.point_balance == 0 and lifetime_points_earned == 0"
            - "LoyaltyMember.${mem_id}.tier == BRONZE (recomputed after lifetime dropped below 500)"

      - name: visit_void_unloads_piece_depth2
        grounds:
          - state_machines.StudioVisit.OPEN_to_VOIDED
          - state_machines.BisquePiece.PAINTED_to_VOIDED
          - entities.KilnBatch.fields.occupied_slots
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (visit void, not series cancel): voiding StudioVisit ->
          its LOADED BisquePiece -> VOIDED, and that piece's un-load -> KilnBatch.occupied_slots decremented.
        test_recipe:
          setup:
            - "An OPEN WALK_IN visit with one LOADED CONE_06 piece (5000) in a LOADING batch (cap 4, occupied 1)."
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "JAR-S", name: "Small Jar", bisque_price_cents: 5000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln B", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${batch_v}" }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/void"
              as: StudioManager
          assert:
            - "StudioVisit.${visit_id}.status == VOIDED"
            - "BisquePiece.${piece_id}.status == VOIDED and kiln_batch_id == null"
            - "KilnBatch.${batch_id}.occupied_slots == 0 and KilnBatch.${batch_id}.version == 3"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_capacity_on_load
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.BisquePiece.PAINTED_to_LOADED
        distinguishing_aspect: |
          Pair (state vs business_constraint): a load whose piece is already LOADED (state P5) into a batch
          also at capacity (P10) returns ERR_INVALID_STATE (priority 5), not ERR_KILN_AT_CAPACITY.
        test_recipe:
          setup:
            - "A LOADING CONE_06 batch capacity=1 already holding one LOADED piece (occupied 1 == capacity)."
            - "That same loaded piece is the trigger target (already LOADED)."
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "CUP-A", name: "Cup A", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln C", firing_temp: "CONE_06", capacity_slots: 1, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${batch_v}" }
              as: StudioStaff
            - call: "GET /kiln-batches/${batch_id}"
              as: StudioStaff
              captures: { batch_v2: $.data.version }
          trigger:
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${batch_v2}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409); piece already LOADED is rejected on state before capacity"
            - "KilnBatch.${batch_id}.occupied_slots == 1 (unchanged)"

      - name: pieces_not_ready_before_insufficient_points_on_checkout
        grounds:
          - validations[priority=8]
          - validations[priority=16]
          - state_machines.StudioVisit.OPEN_to_SETTLED
        distinguishing_aspect: |
          Pair (business_safety vs business_fiscal): checkout with a still-PAINTED piece (P8) AND
          points_redeemed exceeding balance (P16) returns ERR_PIECES_NOT_READY (priority 8), not ERR_INSUFFICIENT_POINTS.
        test_recipe:
          setup:
            - "A member with point_balance 0; an OPEN WALK_IN visit with one PAINTED piece (3000); checkout redeems 100 points."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "pri2@x.com", full_name: "Pri Two", phone: "555-0030" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 100 }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_PIECES_NOT_READY (HTTP 409), not ERR_INSUFFICIENT_POINTS"
            - "StudioVisit.${visit_id}.status == OPEN (unchanged) and point_balance still 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: gold_bonus_threshold_at_10000_on_checkout
        grounds:
          - calculations.visit_points_earned
          - state_machines.StudioVisit.OPEN_to_SETTLED
          - entities.StudioVisit.fields.points_earned
        distinguishing_aspect: |
          Numeric >= threshold on settled_total_cents: settled exactly 10000 triggers the 1.5x bonus (100 -> 150),
          reachable via POST /studio-visits/{id}/checkout; settled 9999 would yield 99 (no bonus).
        test_recipe:
          setup:
            - "A BRONZE member; OPEN WALK_IN visit party_size=1 with one piece priced 9000; provisional=10000; no discount (BRONZE)."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "bnd1@x.com", full_name: "Bnd One", phone: "555-0040" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /studio-visits"
              payload: { member_id: "${mem_id}", party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "VASE-M", name: "Med Vase", bisque_price_cents: 9000, firing_temp: "CONE_06" }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/checkout"
              payload: { points_redeemed: 0 }
              as: StudioStaff
          assert:
            - "StudioVisit.${visit_id}.settled_total_cents == 10000 (BRONZE, no discount)"
            - "StudioVisit.${visit_id}.points_earned == 150 (base 100 x 1.5 bonus at the >= 10000 boundary)"

      - name: fire_empty_kiln_zero_occupied_rejected
        grounds:
          - state_machines.KilnBatch.LOADING_to_FIRING
          - entities.KilnBatch.fields.occupied_slots
        distinguishing_aspect: |
          Zero-count boundary on a different metric/endpoint: starting firing on a batch with occupied_slots==0
          (empty set) via POST /kiln-batches/{id}/start-firing is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A LOADING CONE_06 batch with occupied_slots==0 (no pieces loaded)."
          setup_api_calls:
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln D", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /kiln-batches/${batch_id}/start-firing"
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409): cannot fire an empty kiln (occupied_slots==0)"
            - "KilnBatch.${batch_id}.status == LOADING (unchanged) and started_at == null"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: piece_load_requires_visit_open
        grounds:
          - state_machines.BisquePiece.PAINTED_to_LOADED
          - validations[priority=7]
          - entities.StudioVisit.fields.status
        distinguishing_aspect: |
          Pair BisquePiece->StudioVisit: a PAINTED piece may load only while its StudioVisit is OPEN; if the
          visit is VOIDED the piece is already VOIDED so the load fails (cross-entity gate on the visit's state).
        test_recipe:
          setup:
            - "An OPEN WALK_IN visit with one PAINTED CONE_06 piece (3000); a LOADING CONE_06 batch cap 4. Visit is then VOIDED (piece -> VOIDED)."
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "MUG-12OZ", name: "Mug", bisque_price_cents: 3000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece_id: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln E", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /studio-visits/${visit_id}/void"
              as: StudioManager
          trigger:
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece_id}", expected_kiln_batch_version: "${batch_v}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_INVALID_STATE (HTTP 409): piece is VOIDED (because its visit was voided)"
            - "KilnBatch.${batch_id}.occupied_slots == 0 (unchanged)"

      - name: enroll_requires_member_active
        grounds:
          - state_machines.Enrollment.ENROLLED_to_ATTENDED
          - validations[priority=17]
          - entities.LoyaltyMember.fields.status
        distinguishing_aspect: |
          Different entity pair Enrollment->LoyaltyMember: enrolling requires LoyaltyMember.status==ACTIVE;
          a SUSPENDED member's enroll is rejected with ERR_MEMBER_SUSPENDED (gate on the member's state, not the series').
        test_recipe:
          setup:
            - "A SUSPENDED member; an OPEN future ClassSeries with seats available."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "susp1@x.com", full_name: "Susp One", phone: "555-0050" }
              as: StudioManager
              captures: { mem_id: $.data.id }
            - call: "POST /loyalty-members/${mem_id}/suspend"
              as: StudioManager
            - call: "POST /class-series"
              payload: { title: "OpenSeries", session_count: 4, seat_capacity: 5, price_cents: 12000, starts_at: "2026-08-01T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${mem_id}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_MEMBER_SUSPENDED (HTTP 409)"
            - "ClassSeries.${series_id}.enrolled_count == 0 (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: kiln_capacity_aggregate_slot_overflow
        grounds:
          - validations[priority=10]
          - state_machines.BisquePiece.PAINTED_to_LOADED
          - entities.KilnBatch.fields.capacity_slots
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on KilnBatch: a batch occupies a finite slot pool; loading a
          piece when occupied_slots==capacity_slots (count overflow, no per-piece adjacency) is rejected with ERR_KILN_AT_CAPACITY.
        test_recipe:
          setup:
            - "A LOADING CONE_06 batch capacity_slots=1 already holding one LOADED piece (occupied==capacity); a second PAINTED CONE_06 piece exists."
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "P1", name: "P1", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece1: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "P2", name: "P2", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { piece2: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln F", firing_temp: "CONE_06", capacity_slots: 1, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, batch_v: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece1}", expected_kiln_batch_version: "${batch_v}" }
              as: StudioStaff
            - call: "GET /kiln-batches/${batch_id}"
              as: StudioStaff
              captures: { batch_v2: $.data.version }
          trigger:
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${piece2}", expected_kiln_batch_version: "${batch_v2}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_KILN_AT_CAPACITY (HTTP 409)"
            - "KilnBatch.${batch_id}.occupied_slots == 1 (piece2 not loaded)"

      - name: class_seat_capacity_full_overflow
        grounds:
          - validations[priority=11]
          - state_machines.ClassSeries.OPEN_to_FULL
          - entities.ClassSeries.fields.seat_capacity
        distinguishing_aspect: |
          Different resource (ClassSeries) with seat-count interval semantics: a single shared seat pool;
          enrolling when enrolled_count==seat_capacity overflows the pool and is rejected with ERR_SERIES_FULL.
        test_recipe:
          setup:
            - "A ClassSeries seat_capacity=1 already FULL (one ENROLLED member); a second ACTIVE member tries to enroll."
          setup_api_calls:
            - call: "POST /loyalty-members"
              payload: { email: "full1@x.com", full_name: "Full One", phone: "555-0060" }
              as: StudioManager
              captures: { m1: $.data.id }
            - call: "POST /loyalty-members"
              payload: { email: "full2@x.com", full_name: "Full Two", phone: "555-0061" }
              as: StudioManager
              captures: { m2: $.data.id }
            - call: "POST /class-series"
              payload: { title: "OneSeat", session_count: 4, seat_capacity: 1, price_cents: 12000, starts_at: "2026-08-05T18:00:00Z" }
              as: StudioManager
              captures: { series_id: $.data.id }
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${m1}" }
              as: StudioStaff
          trigger:
            - call: "POST /class-series/${series_id}/enroll"
              payload: { member_id: "${m2}" }
              as: StudioStaff
          assert:
            - "Response error_id == ERR_SERIES_FULL (HTTP 409)"
            - "ClassSeries.${series_id}.enrolled_count == 1 (m2 not enrolled) and status == FULL"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_conserved_on_visit_void
        grounds:
          - state_machines.StudioVisit.OPEN_to_VOIDED
          - calculations.supplies_charge
          - entities.PaintBarItem.fields.on_hand_qty
        distinguishing_aspect: |
          Conserved quantity = total PaintBarItem.on_hand_qty: consume (forward) then visit-void (compensation)
          MUST restore on_hand_qty to its pre-consume value; invariant on_hand_qty_after_void == on_hand_qty_before_consume.
        test_recipe:
          setup:
            - "An ACTIVE PaintBarItem with on_hand_qty 50; an OPEN WALK_IN visit that consumes qty 4 (on_hand -> 46)."
          setup_api_calls:
            - call: "POST /paint-bar-items"
              payload: { sku: "GLZ-C", name: "Glaze C", category: "GLAZE", unit_price_cents: 400, reorder_threshold: 5 }
              as: StudioManager
              captures: { item_id: $.data.id }
            - call: "POST /paint-bar-items/${item_id}/restock"
              payload: { qty: 50 }
              as: StudioManager
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/consume"
              payload: { paint_bar_item_id: "${item_id}", qty: 4 }
              as: StudioStaff
          trigger:
            - call: "POST /studio-visits/${visit_id}/void"
              as: StudioManager
          assert:
            - "PaintBarItem.${item_id}.on_hand_qty == 50 (restored to pre-consume value; consume -4 then void +4 nets 0)"
            - "StudioVisit.${visit_id}.status == VOIDED"

      - name: kiln_slots_conserved_on_cancel
        grounds:
          - state_machines.KilnBatch.LOADING_to_CANCELLED
          - state_machines.BisquePiece.PAINTED_to_LOADED
          - entities.KilnBatch.fields.occupied_slots
        distinguishing_aspect: |
          Different conserved quantity = KilnBatch.occupied_slots: loading two pieces then cancelling the batch
          MUST drive occupied_slots back to 0 and return both pieces to PAINTED; occupied_slots_after_cancel == 0.
        test_recipe:
          setup:
            - "A LOADING CONE_06 batch cap 4 with two LOADED CONE_06 pieces (occupied==2)."
          setup_api_calls:
            - call: "POST /studio-visits"
              payload: { party_size: 1, visit_type: "WALK_IN" }
              as: StudioStaff
              captures: { visit_id: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "Q1", name: "Q1", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { p1: $.data.id }
            - call: "POST /studio-visits/${visit_id}/pieces"
              payload: { sku: "Q2", name: "Q2", bisque_price_cents: 2000, firing_temp: "CONE_06" }
              as: StudioStaff
              captures: { p2: $.data.id }
            - call: "POST /kiln-batches"
              payload: { kiln_name: "Kiln G", firing_temp: "CONE_06", capacity_slots: 4, turnaround_hours: 48 }
              as: StudioStaff
              captures: { batch_id: $.data.id, bv0: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${p1}", expected_kiln_batch_version: "${bv0}" }
              as: StudioStaff
            - call: "GET /kiln-batches/${batch_id}"
              as: StudioStaff
              captures: { bv1: $.data.version }
            - call: "POST /kiln-batches/${batch_id}/load"
              payload: { bisque_piece_id: "${p2}", expected_kiln_batch_version: "${bv1}" }
              as: StudioStaff
          trigger:
            - call: "POST /kiln-batches/${batch_id}/cancel"
              as: StudioManager
          assert:
            - "KilnBatch.${batch_id}.occupied_slots == 0 and status == CANCELLED"
            - "BisquePiece.${p1}.status == PAINTED and BisquePiece.${p2}.status == PAINTED (both kiln_batch_id null)"
