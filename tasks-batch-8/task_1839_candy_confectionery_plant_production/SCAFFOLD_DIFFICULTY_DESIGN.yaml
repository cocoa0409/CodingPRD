            - call: "GET /seasonal-windows/${win_id}"
              payload: {}
              as: ProductionPlanner
              captures: { win_v2: $.data.version }
          trigger:
            - call: "POST /production-runs"
              payload: { window_id: "${win_id}", product_id: "${prod_id}", recipe_id: "${rec_id}", line_id: "${line_id}", run_type: "REWORK", planned_units: 360, scheduled_start: "2026-09-07T08:00:00Z", scheduled_end: "2026-09-07T16:00:00Z", source_lot_id: "${lot_src}", rework_qty: 400, expected_window_version: "${win_v2}" }
              as: ProductionPlanner
              captures: { rw_id: $.data.id }
            - call: "GET /lots/${lot_src}"
              payload: {}
              as: ProductionPlanner
              captures: { ooh_after_create: $.data.qty_on_hand, rrw_after_create: $.data.qty_reserved_rework }
            - call: "POST /production-runs/${rw_id}/cancel"
              payload: {}
