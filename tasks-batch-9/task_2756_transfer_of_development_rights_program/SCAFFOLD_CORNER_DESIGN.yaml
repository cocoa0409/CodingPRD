            - "parcel B APN-B01 (40.00 / 0.00 / LOCAL / 0) fully severed for 10 units -> easement B restricted_acres 40.00"
            - "inspection A on 2026-08-10: MAJOR_VIOLATION over 12.00 acres, 0 priors -> severity 48.60, 60-day band, cure_deadline 2026-10-09T00:00:00Z"
            - "inspection B on 2026-08-20: MAJOR_VIOLATION over 4.00 acres of 40.00, 0 priors -> severity 48.00, 60-day band, cure_deadline 2026-10-19T00:00:00Z"
          setup_api_calls:
