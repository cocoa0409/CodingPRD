      - name: tour_capacity_exact_20_allowed_21_rejected
        grounds:
          - validations[priority=13]
          - state_machines.TourBooking.REQUESTED_to_CONFIRMED
          - entities.TourBooking.fields.party_size
        distinguishing_aspect: "Empty/count boundary on party_size via POST /dsp/tour-bookings/{id}/confirm: party_size == 20 confirms (== capacity), party_size == 21 fails with ERR_TOUR_CAPACITY."
        test_recipe:
          setup:
            - "Two distilleries (isolated capacity windows); one REQUESTED tour of party 20, another REQUESTED tour of party 21."
          setup_api_calls:
