            - "PlacementTest.${pt}.status == \"CREATED\" and PlacementTest.${pt}.calibrated_cefr_band == null"
            - "PlacementTest.${pt}.placed_unit_index == null"
      - name: review_requires_decayed_node_state
        grounds:
          - state_machines.LessonNode.transitions.DECAYED_to_UNLOCKED
          - validations[priority=9]
          - entities.LessonNode.fields.state
        distinguishing_aspect: |
          The DECAYED to UNLOCKED transition depends on the LessonNode's own state, so reviewing a
          node that stands at BRONZE is refused with ERR_NODE_NOT_DECAYED rather than advancing it.
        test_recipe:
          setup:
            - "Ada holds a lesson node that has already been practiced up to BRONZE"
          setup_api_calls:
            - call: "POST /learners"
              payload: { display_name: "Ada", timezone_id: "Etc/UTC", local_date_offset_days: 0, program_tier: "FREE" }
              as: Anonymous
              captures: { ada: $.data.id }
            - call: "POST /course-units"
              payload: { unit_index: 1, title: "Unit 1", cefr_band: "A1", unlock_index: 0, total_nodes: 1 }
              as: PlatformAdmin
              captures: { unit1: $.data.id }
            - call: "POST /course-units/1/nodes"
              payload: { node_index: 1 }
              as: PlatformAdmin
              captures: { n11: $.data.id, n11_v: $.data.version }
            - call: "POST /lesson-nodes/${n11}/practice"
              payload: { learner_id: "${ada}", recorded_at: "2026-09-01T00:00:00Z", response_ms: 5000, correct: true }
              as: Learner
              as_user_id: "${ada}"
              captures: { n11_ver: $.data.id }
          trigger:
            - call: "PUT /lesson-nodes/${n11}/review"
              payload: { learner_id: "${ada}", expected_node_version: "${n11_v}" }
