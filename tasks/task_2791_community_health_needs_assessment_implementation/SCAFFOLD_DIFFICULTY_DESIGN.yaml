      - name: partnership_fork_join_requires_both_signatures_before_executed
        grounds:
          - state_machines.PartnershipAgreement.NEGOTIATING_to_PARTNER_SIGNED
          - state_machines.PartnershipAgreement.PARTNER_SIGNED_to_EXECUTED
          - entities.PartnershipAgreement.fields.signature_state
          - entities.PartnershipAgreement.fields.funding_state
          - roles.PartnerRepresentative
        distinguishing_aspect: |
          Signature is a fork-join: either side may sign first, each branch
          stamps only its own timestamp and signatory id, and the join
          (signature_state EXECUTED plus funding_state UNFUNDED -> PLEDGED)
          fires only on the second signature — so the same endpoint produces
          a different state depending on which branches have completed.
        test_recipe:
          setup:
            - "one AssessmentCycle in DRAFT (partnership agreements carry no phase gate)"
            - "one PARTNER ResponsibleParty"
            - "one PartnershipAgreement in NEGOTIATING with funding_state UNFUNDED, pledged_cents 2000000, and both signature timestamps null"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /responsible-parties"
              payload: { name: "Riverbend Community Coalition", party_type: "PARTNER", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { partner: $.data.id }
            - call: "POST /partnership-agreements"
              payload: { cycle_id: "${cyc}", party_id: "${partner}", pledged_cents: 2000000, accountability_metric: "Screenings completed in partner sites", shared_accountability_pct: 40.00, term_start: "2026-09-01", term_end: "2027-08-31" }
              as: CommunityBenefitOfficer
              captures: { agr: $.data.id }
          trigger:
            - call: "POST /partnership-agreements/${agr}/sign"
              payload: { signatory_side: "PARTNER" }
              as: PartnerRepresentative
              as_user_id: "${partner}"
            - call: "POST /partnership-agreements/${agr}/sign"
              payload: { signatory_side: "HOSPITAL" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
          assert:
            - "both calls return HTTP 200"
            - "after call 1: PartnershipAgreement.${agr}.signature_state == PARTNER_SIGNED, funding_state == UNFUNDED, partner_signed_at is NOT null, partner_signatory_user_id == ${partner}, hospital_signed_at == null, hospital_signatory_user_id == null"
            - "after call 2: PartnershipAgreement.${agr}.signature_state == EXECUTED and funding_state == PLEDGED"
            - "after call 2: hospital_signed_at is NOT null and hospital_signatory_user_id == \"u_officer_1\", while partner_signed_at is unchanged from call 1"
            - "PartnershipAgreement.${agr}.funded_cents == 0 — the join pledges but does not fund; funding follows commitment activation"

  - rule_id: transitive_cascade
    instances:
      - name: adoption_cascades_strategy_approval_objective_activation_commitment_funding
        grounds:
          - state_machines.AssessmentCycle.BOARD_REVIEW_to_ADOPTED
          - state_machines.ImplementationStrategy.SUBMITTED_to_APPROVED
          - state_machines.StrategyObjective.DRAFT_to_ACTIVE
          - state_machines.ResourceCommitment.PENDING_to_COMMITTED
          - calculations.party_committed_fte
          - entities.PartnershipAgreement.fields.funded_cents
        distinguishing_aspect: |
          One ADOPT call propagates three links deep, each link caused by the
          previous one: strategy SUBMITTED -> APPROVED (link 1) activates its
          DRAFT objectives and moves the execution axis to ON_TRACK (link 2),
          and only because active_objective_count rose from 0 does link 3 fire,
          committing the PENDING resource commitment, adding 2500 bp to the
          party and 1500000 cents to the partnership's funded_cents.
