            - "response status 200 and data.status == \"RECONCILING\""
            - "GET /inventory-integrity/shrink-periods/${sp1}/attribution returns process_error_cents 8202, damage_cents 5468, theft_cents 13670, vendor_shortage_cents 0 and unresolved_cents 0"
            - "the same read returns total_attributable_variance_cents 27340 — the three allocations plus the pre-existing 6633 sum exactly to abs(net_variance_cents), with zero rounding drift"
            - "the same read returns provisional_total_shrink_cents 27340, final_total_shrink_cents 27340, provisional_shrink_rate_bps 55 and final_shrink_rate_bps 55 (round_half_up of 54.68, not 54)"
            - "GET /inventory-integrity/adjustments?posting_state=POSTED returns total_count 2, each with reason_code \"PHYSICAL_RECONCILIATION\", approval_state \"NOT_REQUIRED\" and posting_state \"POSTED\""
            - "GET /inventory-integrity/stock-positions/${pos_tee1} reads on_hand_units 90 and GET /inventory-integrity/stock-positions/${pos_pan} reads on_hand_units 30"

      - name: physical_reconciliation_excludes_superseded_lines
        claim_type: input_set_filtering
        grounds:
          - calculations.physical_reconciliation
          - entities.PhysicalInventoryLine.fields.superseded
        distinguishing_aspect: "A corrected recount of the same item inside one pass supersedes the first line rather than adding to it: two lines exist but line_count is 1, and the pass rolls up counted 123400 against book 123400 for net_variance 0 — summing both lines would have produced 234460."
        test_recipe:
          setup:
            - "Category APPAREL, Store S100, Vendor VEND1, CounterFirm CF1, Item TEE-001 at 1234 cents."
            - "One stock position at S100 for TEE-001 with 100 units, so book value is 123400."
            - "A PhysicalInventory for (S100, CF1) 2026-08-20..2026-08-22, started."
            - "A first line counts 90 (a miscount), then a second line for the SAME item in the SAME pass counts 100."
          setup_api_calls:
            - call: "POST /inventory-integrity/counter-firms"
              payload: { code: "CF1", name: "Counter Firm One", certification_level: "TIER_1", max_lines_per_pass: 500 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cf1: "$.data.id" }
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/vendors"
              payload: { code: "VEND1", name: "Vendor One" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { vendor1: "$.data.id" }
            - call: "POST /inventory-integrity/items"
              payload: { category_id: "${cat_apparel}", primary_vendor_id: "${vendor1}", sku: "TEE-001", description: "Crew tee", unit_cost_cents: 1234, retail_price_cents: 2999, tag_encoding_scheme: "SGTIN_96" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { item_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/stock-positions"
              payload: { store_id: "${store_s100}", item_id: "${item_tee1}", baseline_on_hand_units: 100, reserved_units: 0 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { pos_tee1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories"
              payload: { store_id: "${store_s100}", counter_firm_id: "${cf1}", scheduled_start_date: "2026-08-20", scheduled_end_date: "2026-08-22" }
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi1: "$.data.id" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/start"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${cf1}"
              captures: { pi_v1: "$.data.version" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 90, expected_physical_inventory_version: "${pi_v1}" }
              as: ThirdPartyCounter
              as_user_id: "${cf1}"
              captures: { pil_first: "$.data.id" }
            - call: "GET /inventory-integrity/physical-inventories/${pi1}"
              payload: {}
              as: ShrinkController
              as_user_id: "u_ctrl_1"
              captures: { pi_v2: "$.data.version" }
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/lines"
              payload: { item_id: "${item_tee1}", counted_units: 100, expected_physical_inventory_version: "${pi_v2}" }
              as: ThirdPartyCounter
              as_user_id: "${cf1}"
              captures: { pil_second: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/physical-inventories/${pi1}/complete-pass"
              payload: {}
              as: ThirdPartyCounter
              as_user_id: "${cf1}"
          assert:
            - "GET /inventory-integrity/physical-inventory-lines/${pil_first} returns superseded true and pass_round 0"
            - "GET /inventory-integrity/physical-inventory-lines/${pil_second} returns superseded false, pass_round 0, book_units_snapshot 100 and variance_units 0"
            - "response status 200, data.status == \"FIRST_PASS_COMPLETE\" and data.line_count == 1"
            - "response data.book_value_cents == 123400, data.counted_value_cents == 123400, data.net_variance_cents == 0 and data.net_variance_bps == 0"
            - "GET /inventory-integrity/physical-inventory-lines?physical_inventory_id=${pi1} returns total_count 2 — the superseded line is retained for audit, only excluded from the aggregates"
            - "the reconcile that follows mints no adjustment at all, because no non-superseded line has variance_units != 0"

      - name: shrink_attribution_provisional_and_final_diverge_on_one_dataset
        claim_type: variant_divergence
        grounds:
          - calculations.shrink_attribution
        distinguishing_aspect: "Both variants read the same investigation set but the provisional one parks non-terminal rows in unresolved_cents, so the totals and the derived rate differ."
        excluded_because:
          difficulty_instance: "dual_variant_calc / shrink_attribution_provisional_vs_final_diverge"
          rationale: "§1.8 rule dual_variant_calc already pins both variants (theft 6633 / unresolved 32250 / total 38883 / rate 78 bps provisional versus total 6633 / rate 13 bps final) on one dataset, plus the reconciliation delta at final-close. A §1.9 restatement would duplicate that test."

      - name: stock_accuracy_unit_and_value_variants_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.stock_accuracy_pct
        distinguishing_aspect: "The unit variant divides by units and the value variant by landed-cost cents, so a mixed-cost basket scores differently under each and the promising gate keys off the value variant only."
        excluded_because:
          difficulty_instance: "dual_variant_calc / stock_accuracy_unit_vs_value_diverge"
          rationale: "§1.8 already asserts 95.00 unit versus 94.62 value on the same 123400-cent base and proves the promising gate reads the value variant. Repeating it here adds no coverage."

      - name: count_variance_valuation_rounds_per_line_before_summing
        claim_type: precision
        grounds:
          - calculations.count_variance_valuation
        distinguishing_aspect: "Rounding each line before summation yields 14696 where the forbidden sum-then-round order yields 14695."
        excluded_because:
          difficulty_instance: "combinatorial_formula / variance_valuation_round_per_line_then_sum"
          rationale: "§1.8 rule combinatorial_formula pins the 6633 + 8063 = 14696 evaluation order against the forbidden 14695 on a two-line task. A §1.9 duplicate would test the identical arithmetic."

      - name: adjustment_authority_threshold_boundary_requires_approval
        claim_type: threshold_boundary
        grounds:
          - calculations.adjustment_authority_threshold
        distinguishing_aspect: "requires_approval uses >=, so a value impact exactly equal to the derived threshold needs supervisor approval while one cent less does not."
        excluded_because:
          difficulty_instance: "combinatorial_formula / adjustment_authority_nested_threshold"
          rationale: "§1.8 already walks the nested max/min/floor chain and tests the >= boundary at threshold-1, threshold and threshold+1 for two reason codes. Restating the boundary here would be redundant."

  # ==========================================================================
  - section: validations
    instances:

      - name: count_task_window_start_exactly_on_due_date_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_90_ERR_COUNT_WINDOW_NOT_DUE
        distinguishing_aspect: "The due check is date(window_start) >= next_due_date, so a window that opens exactly on the due date satisfies it and the task is created; one day earlier is the rejected case."
        test_recipe:
          setup:
            - "Category APPAREL and Store S100 with reader_capability BOTH."
            - "An ACTIVE HANDHELD schedule for (S100, APPAREL) whose first_due_date, and therefore next_due_date, is 2026-08-01."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00, landed_cost_uplift_bps: 750 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_apparel}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 30 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { sched1: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-tasks"
              payload: { count_schedule_id: "${sched1}", reader_mode: "HANDHELD", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
          assert:
            - "response status 201 and data.status == \"SCHEDULED\""
            - "response data.store_id == the S100 id and data.category_id == the APPAREL id, both copied from the schedule rather than supplied"
            - "response data.in_scope_position_count == 0, coverage_pct == 0.00 and recount_round == 0"
            - "the same request with window_start 2026-07-31T23:59:59Z instead returns 422 ERR_COUNT_WINDOW_NOT_DUE, since date(window_start) 2026-07-31 is before the due date"

      - name: count_schedule_reader_mode_not_permitted_by_category_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_71_ERR_CATEGORY_READER_MODE_MISMATCH
          - entities.Category.fields.reader_mode_required
        distinguishing_aspect: "The category gate is conditional on Category.reader_mode_required: with OVERHEAD it rejects a HANDHELD schedule even though the store's hardware supports both, and with the default EITHER the very same request succeeds."
        test_recipe:
          setup:
            - "Category ELEC created with reader_mode_required OVERHEAD."
            - "Store S100 with reader_capability BOTH, so the priority-70 hardware check at a lower priority cannot fire and the failure is unambiguously the category gate."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "ELEC", name: "Electronics", count_cadence_days: 14, variance_tolerance_units: 0, variance_tolerance_value_cents: 1000, min_accuracy_pct: 99.00, landed_cost_uplift_bps: 250, reader_mode_required: "OVERHEAD" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_elec: "$.data.id" }
            - call: "POST /inventory-integrity/stores"
              payload: { code: "S100", name: "Store 100", reader_capability: "BOTH", overhead_reader_capacity: 2 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { store_s100: "$.data.id" }
          trigger:
            - call: "POST /inventory-integrity/count-schedules"
              payload: { store_id: "${store_s100}", category_id: "${cat_elec}", reader_mode: "HANDHELD", first_due_date: "2026-08-01", cadence_days: 14 }
              as: InventoryAnalyst
              as_user_id: "u_analyst_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status 422 and data.error_id == \"ERR_CATEGORY_READER_MODE_MISMATCH\""
            - "GET /inventory-integrity/count-schedules?category_id=${cat_elec} returns total_count 0 — nothing was persisted"
            - "the same request with reader_mode OVERHEAD returns 201 with status \"ACTIVE\" and next_due_date 2026-08-01"
            - "on a second category created without reader_mode_required at all (default EITHER) the HANDHELD request returns 201, proving the rule is conditional on the category's configuration"

      - name: physical_line_beyond_counter_firm_max_lines_per_pass_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_85_ERR_MAX_LINES_PER_PASS_EXCEEDED
          - entities.CounterFirm.fields.max_lines_per_pass
        distinguishing_aspect: "Each line is individually valid — right item, stocked at the store, fresh version — but the third line makes the pass's non-superseded line count 3 against CF2's max_lines_per_pass of 2, so the aggregate ceiling rejects it."
        test_recipe:
          setup:
            - "CounterFirm CF2 with certification_level TIER_2 and max_lines_per_pass 2."
