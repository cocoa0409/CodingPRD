    input: [advertiser_id, policy_rule_id, license_number, issuing_country_code, valid_from, valid_until]
    output: Certification
    side_effects: ["status SUBMITTED, or ACTIVE when valid_from <= clock < valid_until", "rejected with ERR_CERTIFICATION_INTERVAL_OVERLAP when the interval intersects an existing SUBMITTED/ACTIVE interval for the same (advertiser_id, policy_rule_id, issuing_country_code)"]

  - method: GET
    path: "/ad-policy/certifications/{id}"
    description: "Read one certification"
