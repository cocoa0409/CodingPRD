  - rule_id: transitive_cascade
    instances:
      - name: countersign_cascades_application_inquiry_tour
        grounds:
          - state_machines.Lease.SIGNED_BY_APPLICANT_to_EXECUTED
          - state_machines.Application.APPROVED_to_LEASED
          - state_machines.Inquiry.TOUR_SCHEDULED_to_CONVERTED
          - state_machines.Tour.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from POST countersign: Lease → EXECUTED causes Application
          → LEASED (link 1), which causes source Inquiry → CONVERTED (link 2), which
          itself cancels the inquiry's still-SCHEDULED tour (link 3) — each hop is
          caused by the previous mutation, not by the countersign directly.
        test_recipe:
          setup:
            - "Property P, agent A, floorplan F rent 200000 / 2 units"
            - "Inquiry I claimed + responded; a GUIDED tour T scheduled (I is TOUR_SCHEDULED)"
            - "Application APPROVED; lease generated and applicant-signed (SIGNED_BY_APPLICANT)"
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Cascade Arms", code: "CA1" }
              as: PropertyManager
              captures: { p_id: $.data.id }
