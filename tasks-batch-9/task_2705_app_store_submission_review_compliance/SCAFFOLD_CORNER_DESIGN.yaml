            - "Submission.${sub_id}.rejected_at == 2026-08-01T00:00:00Z"
            - "RejectionReason.${rr_id}.appeal_disposition is null"

      - name: board_review_on_a_withdrawn_appeal_is_refused_by_terminal_lockdown
        claim_type: Terminal State Lockdown
