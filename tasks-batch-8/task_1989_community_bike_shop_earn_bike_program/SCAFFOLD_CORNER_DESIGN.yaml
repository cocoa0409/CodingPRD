            - { call: "POST /bikes/${bk}/route", payload: { destination: "SCRAP" }, as: ShopCoordinator }
            - { call: "POST /bikes/${bk}/scrap-tickets", payload: { material: "STEEL", weight_kg: 2.0, recycler_name: "RecCo" }, as: ShopCoordinator, captures: { tk: $.data.id } }
