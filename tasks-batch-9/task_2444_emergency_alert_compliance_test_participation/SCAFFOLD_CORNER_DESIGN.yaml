          rationale: "The named §1.8 instance captures the PROVISIONAL score, accepts the filing and asserts the exact delta the CERTIFIED variant introduces via d5 and d6."

      - name: accessible_source_count_ignores_source_types_the_plan_does_not_require
        claim_type: input_set_filtering
        grounds:
          - "§1.3 calculations.station_compliance_score input_set 'accessible_source_count = count of DISTINCT source_type among MonitoringAssignment rows with this station_id, status == ACTIVE, and source_type IN plan.required_source_types'"
          - "§1.3 formula 'missing_source_count = max(0, plan.required_source_count - accessible_source_count)' with MISSING_SOURCE_DEDUCTION 25.00"
          - "§1.5 POST /state-plans side effect 'required_source_count = len(required_source_types)'"
        distinguishing_aspect: "An extra ACTIVE LP1 assignment does not raise accessible_source_count at all because LP1 is not in required_source_types ['PEP', 'SATELLITE'] — the station sits at 75.00 with three ACTIVE assignments and only reaches 100.00 when the missing SATELLITE source specifically is covered."
        test_recipe:
