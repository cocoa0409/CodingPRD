              payload: { account_id: "${acct_id}", bill_id: "${bill_p4_id}", total_amount_cents: 44939, down_payment_cents: 9000, installment_count: 12, expected_account_version: "${acct_v}", investigation_id: "${inv_id}" }
              as: CustomerServiceRep
              captures: { arr_id: $.data.id }
            - call: "GET /payment-arrangements?investigation_id=${inv_id}"
              as: CustomerServiceRep
            - call: "GET /payment-arrangements?bill_id=${bill_p4_id}"
