              captures: { inv: $.data.id, inv_observed: $.data.version }
            - call: "POST /camp-ops/camp-invitations/${inv}/send-letter"
              payload: {}
              as: TravelCoordinator
            - call: "GET /camp-ops/camp-invitations/${inv}"
              payload: {}
              as: TravelCoordinator
              captures: { inv_fresh: $.data.version }
          trigger:
            - call: "POST /camp-ops/camp-invitations/${inv}/travel-arrangement"
