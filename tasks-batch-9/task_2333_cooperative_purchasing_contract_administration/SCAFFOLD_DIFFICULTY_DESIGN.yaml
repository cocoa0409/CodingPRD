        grounds:
          - state_machines.ContractUsage.status.CONFIRMED_to_RETRACTED
          - calculations.report_period_sweep
          - calculations.admin_fee_assessment
          - calculations.contract_compliance_posture
          - entities.MemberAgency.fields.committed_spend_cents
          - entities.MasterContract.fields.usage_chargeable_cents_total
