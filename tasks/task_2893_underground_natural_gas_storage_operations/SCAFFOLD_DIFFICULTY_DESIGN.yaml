            - "StorageField.${f2}.working_gas_inventory_dth == 92500.000, inventory_pct == 92.50, current_pressure_psig == 2095, deliverability_tier == TIER_4"
            - "StorageField.${f2}.max_withdrawal_rate_dth_per_day == 111000 (curve 111000 at 92.50%, capped by the 120000 well)"
            - "StorageContract.${c1}.inventory_balance_dth == 91390.000 and StorageField.${f2}.retained_fuel_pool_dth == 1110.000"
            - "GasMovementTicket.${ta}.status == PENDING and GasMovementTicket.${tb}.status == PENDING (neither refusal mutated the field)"
            - "Nomination.${na}.status == CONFIRMED and Nomination.${nb}.status == CONFIRMED with confirmed_volume_dth == 91390 each"

      - name: nomination_window_temporal_priority_18_wins_over_revision_limit_priority_30
        grounds:
          - validations.priority_18_ERR_NOMINATION_WINDOW_CLOSED
          - validations.priority_30_ERR_NOMINATION_REVISION_LIMIT
          - entities.Nomination.fields.revision_round
        distinguishing_aspect: |
          The same POST /nominations/{id}/submit call on the same nomination returns two different errors
          depending only on the clock: with revision_round already at MAX_REVISION_ROUNDS and the window still
          open it is ERR_NOMINATION_REVISION_LIMIT (priority 30), and after the clock passes the
          2026-08-19T13:00Z cutoff — with the revision limit still breached — it becomes
          ERR_NOMINATION_WINDOW_CLOSED (priority 18). Two rules are violated at once in the second call and
          the temporal one must win.
        test_recipe:
          setup:
            - "Field F_STD with one well rated 300000 Dth/day (max injection 300000, interruptible ceiling 90000)."
            - "One INTERRUPTIBLE contract with a 120000 Dth daily injection right, ACTIVE."
            - "A 100000 Dth INJECTION nomination for gas day 2026-08-20 that has been submitted and confirmed three times, so it is CURTAILED at revision_round == 2 (MAX_REVISION_ROUNDS)."
            - "The clock is still 2026-08-01T00:00:00Z, i.e. well before the 2026-08-19T13:00Z cutoff."
