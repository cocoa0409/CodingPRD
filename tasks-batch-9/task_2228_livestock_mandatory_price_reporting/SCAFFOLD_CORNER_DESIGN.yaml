      - name: derived_counters_are_current_in_the_mutating_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.window_head_ledger
          - entities.ReportingWindow.fields.accepted_submission_count
        distinguishing_aspect: |
          Immediacy asserted on the mutating call's OWN response body rather than
          on a later read: the review response already carries the window's
          incremented ledger, the compute response already carries the aggregate
          over it, and the open-correction response already carries the decremented
          ledger and the re-staled report. Anything that only converged on a
          subsequent GET would satisfy an eventual model but violate this one.
        test_recipe:
          setup:
            - "Alpha Packing (ACTIVE 2026 registration) holds one SUBMITTED filing of 100 head at 280.00 / 8.00 cwt in an OPEN window with relaxed guidelines 1 / 100.00 / 1, plus a PENDING market report shell for that window."
