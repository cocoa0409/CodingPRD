    input: [new_start_utc]
    output: Booking
    side_effects: ["status->RESCHEDULED; start_utc/end_utc moved; deposit untouched"]

  - method: POST
    path: "/bookings/{id}/check-in"
    description: "Check in a CONFIRMED booking; consumes credits or charges gift card; requires CLEAN+IN_SERVICE tank"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->CHECKED_IN; CREDIT: CONSUME ledger entry; GIFT_CARD: SESSION_CHARGE payment"]

  - method: POST
    path: "/bookings/{id}/complete"
    description: "Complete a CHECKED_IN booking; settles final charge and triggers turnover cascade"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->COMPLETED; final_charge_cents computed; SanitationCycle created -> Tank IN_CYCLE -> auto-cancel conflicting RESERVED bookings; DEPOSIT_REFUND"]

  - method: POST
    path: "/bookings/{id}/no-show"
    description: "Mark a CONFIRMED booking NO_SHOW after grace; forfeits deposit, strikes member"
    roles: [Admin, FrontDesk]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->NO_SHOW; NO_SHOW_FEE payment; Member.no_show_strikes+1; suspend at threshold"]

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a RESERVED/CONFIRMED/RESCHEDULED booking; deposit refunded (timely) or forfeited (late)"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: Booking
    side_effects: ["status->CANCELLED; timely: DEPOSIT_REFUND; late: LATE_FEE"]

  - method: GET
    path: "/payments/{id}"
    description: "Get a single payment / deposit / fee ledger entry"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payment / deposit / fee ledger entries, filterable by booking or gift card"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: ["booking_id?", "gift_card_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---------- GiftCard ----------
  - method: POST
    path: "/gift-cards"
    description: "Issue a gift card"
    roles: [Admin, FrontDesk]
    code: 201
    input: [code, initial_balance_cents]
    output: GiftCard
    side_effects: ["status=ACTIVE; remaining_balance_cents=initial_balance_cents"]

  - method: GET
    path: "/gift-cards/{id}"
    description: "Get a gift card"
    roles: [Admin, FrontDesk, Member]
    code: 200
    input: []
    output: GiftCard
    side_effects: []

  - method: GET
    path: "/gift-cards"
    description: "List gift cards"
    roles: [Admin, FrontDesk]
    code: 200
    input: ["code?", "limit?", "offset?"]
    output: GiftCard[]
    side_effects: []

  - method: POST
    path: "/gift-cards/{id}/void"
    description: "Void a gift card"
    roles: [Admin]
    code: 200
    input: []
    output: GiftCard
    side_effects: ["status->VOID"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/unrecognized X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN,              http: 403, condition: "Role not permitted, or Member acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND,             http: 404, condition: "Path id or referenced FK does not resolve" }
  - { id: ERR_INVALID_REQUEST,       http: 422, condition: "Malformed body: missing required field, bad enum, end_utc<=start_utc, session_minutes not in {60,90}" }
  - { id: ERR_INVALID_STATE,         http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_TANK_KIND_MISMATCH,    http: 422, condition: "Couples booking on a SINGLE tank, or pay_source/gift_card_id/membership_id combination invalid" }
  - { id: ERR_TANK_UNAVAILABLE,      http: 409, condition: "Tank not CLEAN+IN_SERVICE at check-in (sanitation/operational gate)" }
  - { id: ERR_MEMBER_NOT_ELIGIBLE,   http: 409, condition: "Confirm blocked: orientation not completed, waiver outdated, or member SUSPENDED" }
  - { id: ERR_TANK_TIME_CONFLICT,    http: 409, condition: "Booking window (incl. turnover buffer) overlaps another active booking on the tank" }
  - { id: ERR_ATTENDANT_TIME_CONFLICT, http: 409, condition: "Orientation window overlaps another scheduled orientation on the attendant" }
  - { id: ERR_INSUFFICIENT_FUNDS,    http: 402, condition: "Check-in: not enough credits (CREDIT) or gift-card balance (GIFT_CARD)" }
  - { id: ERR_TIMING_NOT_ALLOWED,    http: 409, condition: "Action attempted outside its allowed time window (reschedule cutoff, no-show grace, sanitation ends_utc)" }
  - { id: ERR_STALE_VERSION,         http: 412, condition: "expected_membership_version does not match Membership.version on renew" }
  - { id: ERR_GIFT_CARD_INACTIVE,    http: 409, condition: "Gift card is VOID or DEPLETED when used for a booking" }
  - { id: ERR_PLAN_INACTIVE,         http: 409, condition: "Activating a membership on an inactive plan" }
  - { id: ERR_TANK_HAS_BOOKINGS,     http: 409, condition: "Retiring a tank that still has active bookings" }
  - { id: ERR_VALIDATION_RANGE,      http: 422, condition: "Numeric field out of range (negative fee, discount outside 0..1, zero/negative gift-card balance)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Self-service customer. Books, confirms, reschedules, and cancels their own sessions; cancels their own membership and orientation; reads their own resources."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings (own member_id)"
      - "POST /bookings/{id}/confirm (own booking)"
      - "POST /bookings/{id}/reschedule (own booking)"
      - "POST /bookings/{id}/cancel (own booking)"
      - "POST /memberships/{id}/cancel (own membership)"
      - "POST /orientations/{id}/cancel (own orientation)"
      - "GET own bookings/memberships/orientations/payments/credit-ledger; GET plans/tanks/gift-cards/{id}"

  - name: FrontDesk
    description: "Operations staff. Registers members, opens/activates/renews memberships, runs check-in/complete/no-show, runs sanitation cycles, schedules and completes orientations, issues gift cards."
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/check-in"
      - "POST /bookings/{id}/complete"
      - "POST /bookings/{id}/no-show"
      - "POST /memberships/{id}/activate"
      - "POST /memberships/{id}/renew"
      - "POST /memberships/{id}/mark-past-due"
      - "POST /orientations/{id}/complete"
      - "POST /sanitation-cycles, POST /sanitation-cycles/{id}/complete"
    shared_operations:
      - "POST /members, POST /memberships, POST /orientations, POST /gift-cards"
      - "POST /bookings, /confirm, /reschedule, /cancel (any member)"
      - "all GET endpoints"

  - name: Admin
    description: "Full operator superset. Manages plans, tanks, attendants; can do everything FrontDesk can plus config/override; sets the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /tanks, /tanks/{id}/maintenance, /return-to-service, /retire"
      - "POST /attendants"
      - "POST /gift-cards/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "everything FrontDesk and Member can do (hierarchical override)"
