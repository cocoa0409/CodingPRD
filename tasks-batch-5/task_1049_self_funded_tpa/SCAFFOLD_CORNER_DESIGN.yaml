# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md sections against SCAFFOLD.yaml
# §1.1-§1.7. All formula-derived asserts are pre-computed integer-cent literals.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: plan_creation_returns_201_with_echoed_fields
        claim_type: Creation
        grounds: [entities.Plan, endpoints]
        distinguishing_aspect: "POST /plans with all required fields returns 201, status ACTIVE, version 1, and echoes individual_deductible_cents 100000."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response is 201"
            - "Plan.${plan_id}.status == ACTIVE"
            - "Plan.${plan_id}.version == 1"
            - "Plan.${plan_id}.individual_deductible_cents == 100000"

      - name: get_claim_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Claim, "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "GET /claims/{unknown-uuid} returns 404 ERR_CLAIM_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 ERR_CLAIM_NOT_FOUND"

      - name: plan_create_missing_deductible_returns_validation
        claim_type: Required Fields
        grounds: [entities.Plan.fields.individual_deductible_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /plans omitting individual_deductible_cents returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 ERR_VALIDATION"

      - name: provider_default_ppo_discount_zero_applied
        claim_type: Defaults
        grounds: [entities.Provider.fields.ppo_discount_pct, calculations.claim_repricing]
        distinguishing_aspect: "In-network provider created without ppo_discount_pct defaults to 0, so an in-network billed 100000 claim reprices to allowed 100000 (no discount)."
        test_recipe:
          setup: ["Plan; in-network provider created WITHOUT ppo_discount_pct; member."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Claim.${c}.allowed_amount_cents == 100000"

      - name: claim_billed_total_computed_from_lines
        claim_type: Computed Fields
        grounds: [entities.Claim.fields.billed_total_cents, entities.Claim.fields.billed_lines]
        distinguishing_aspect: "billed_total_cents is server-computed as the sum of billed_lines (60000 + 40000 == 100000) on create."
        test_recipe:
          setup: ["Plan; in-network provider; member."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 60000 }, { billed_cents: 40000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
          assert:
            - "Claim.${c}.billed_total_cents == 100000"

      - name: list_claims_by_member_pagination_envelope
        claim_type: Listing
        grounds: [entities.Claim, endpoints, response_envelope]
        distinguishing_aspect: "GET /claims?member_id returns a response_type array whose data has 2 claims plus pagination fields total_count and has_more."
        test_recipe:
          setup: ["Plan; provider; member; two submitted claims."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-02", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
          trigger:
            - call: "GET /claims?member_id=${member_id}"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "response_type == array"
            - "data has 2 claims; meta/pagination total_count == 2 and has_more == false"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: adjudicate_denied_claim_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.SUBMITTED_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DENIED claim cannot be adjudicated: POST /claims/{id}/adjudicate returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan; provider; member; a claim denied."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/deny"
              payload: { denial_reason: "NOT_COVERED" }
              as: ClaimsExaminer
              as_user_id: "ex-1"
          trigger:
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 ERR_INVALID_STATE"

      - name: reverse_submitted_claim_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.ADJUDICATED_to_REVERSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "reverse is only valid from ADJUDICATED: reversing a SUBMITTED claim returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan; provider; member; a claim left SUBMITTED."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /claims/${c}/reverse"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 ERR_INVALID_STATE"

      - name: activate_already_active_policy_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.StopLossPolicy.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-activating an ACTIVE policy is not idempotent: the second activate returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan; an ACTIVE stop-loss policy."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2027-01-01", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol: $.data.id }
            - call: "POST /stop-loss-policies/${pol}/activate"
              payload: {}
              as: TPAAdmin
          trigger:
            - call: "POST /stop-loss-policies/${pol}/activate"
              payload: {}
              as: TPAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 ERR_INVALID_STATE"

      - name: close_plan_before_runout_elapsed_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Plan.TERMINATED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a plan while the run-out window is still open (clock 2026-05-01, terminated 2026-03-31 + 90d = 2026-06-29) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Plan terminated 2026-03-31 (run_out 90); clock at 2026-05-01 (still in run-out)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/terminate"
              payload: { termination_date: "2026-03-31" }
              as: TPAAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TPAAdmin
          trigger:
            - call: "POST /plans/${plan_id}/close"
              payload: {}
              as: TPAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 ERR_INVALID_STATE"

      - name: plan_close_after_runout_elapsed_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Plan.TERMINATED_to_CLOSED, entities.Plan.fields.status]
        distinguishing_aspect: "After the run-out window elapses (clock 2026-08-01 > 2026-06-29), close moves the plan to terminal CLOSED."
        test_recipe:
          setup: ["Plan terminated 2026-03-31; clock advanced to 2026-08-01 (past run-out)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/terminate"
              payload: { termination_date: "2026-03-31" }
              as: TPAAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TPAAdmin
          trigger:
            - call: "POST /plans/${plan_id}/close"
              payload: {}
              as: TPAAdmin
          assert:
            - "Plan.${plan_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: claim_create_provider_not_found_returns_404
        claim_type: Violation to Error
        grounds: ["validations[priority=3]", "errors[ERR_PROVIDER_NOT_FOUND]"]
        distinguishing_aspect: "POST /claims referencing an unknown provider_id returns 404 ERR_PROVIDER_NOT_FOUND."
        test_recipe:
          setup: ["Plan; member; no such provider."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "00000000-0000-4000-8000-000000000000", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "response is 404 ERR_PROVIDER_NOT_FOUND"

      - name: laser_member_from_other_plan_returns_mismatch
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "errors[ERR_LASER_MEMBER_MISMATCH]"]
        distinguishing_aspect: "Carving a laser whose member belongs to a different plan than the policy's plan returns 422 ERR_LASER_MEMBER_MISMATCH."
        test_recipe:
          setup: ["Plan A with ACTIVE policy; Plan B with a member; laser attempted linking Plan-B member under Plan-A policy."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "PlanA", sponsor_tax_id: "50-0000001", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_a: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_a}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2027-01-01", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol_a: $.data.id }
            - call: "POST /stop-loss-policies/${pol_a}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /plans"
              payload: { sponsor_name: "PlanB", sponsor_tax_id: "50-0000002", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_b: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_b}", first_name: "Bo", last_name: "B", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { mem_b: $.data.id }
          trigger:
            - call: "POST /lasers"
              payload: { stop_loss_policy_id: "${pol_a}", member_id: "${mem_b}", laser_deductible_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: TPAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response is 422 ERR_LASER_MEMBER_MISMATCH"

      - name: segregation_same_examiner_pend_then_adjudicate_returns_forbidden
        claim_type: Segregation of duties
        grounds: ["validations[priority=6]", state_machines.Claim.PENDED_to_ADJUDICATED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The examiner who pended a claim (X-User-ID ex-1) cannot adjudicate it: adjudicate as ex-1 returns 403 ERR_SEGREGATION_OF_DUTIES, while a different examiner ex-2 succeeds."
        test_recipe:
          setup: ["Plan; provider; member; a claim pended by examiner ex-1."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/pend"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          trigger:
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { err: $.data.error_id }
          assert:
            - "adjudicate as ex-1 returns 403 ERR_SEGREGATION_OF_DUTIES"
            - "Claim.${c}.status == PENDED (unchanged)"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: claims_examiner_open_fund_account_returns_unauthorized
        claim_type: Cannot perform other role exclusive op
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /fund-accounts is FundManager-exclusive; a ClaimsExaminer call returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Plan."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_id}" }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED"

      - name: claims_examiner_generate_1099_returns_unauthorized
        claim_type: Cannot perform other role exclusive op
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /form-1099s/generate is Auditor-exclusive; a ClaimsExaminer call returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Provider."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
          trigger:
            - call: "POST /form-1099s/generate"
              payload: { provider_id: "${prov}", tax_year: 2026 }
              as: ClaimsExaminer
              captures: { err: $.data.error_id }
          assert:
            - "response is 403 ERR_UNAUTHORIZED"

      - name: missing_role_header_returns_unauthenticated
        claim_type: Auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
