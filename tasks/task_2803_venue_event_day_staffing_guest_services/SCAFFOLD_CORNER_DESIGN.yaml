  # ===================================================================================
  # 7. From Table 7 (RBAC) - §1.7 role_model is segregation_of_duties over four roles,
  #    three opaque plus the entity_backed StaffMember
  # ===================================================================================
  - section: rbac
    instances:
      - name: director_exclusive_lifecycle_and_payout_permitted
        claim_type: role_exclusive_operations
        grounds:
          - roles.GuestExperienceDirector
          - endpoints[POST /events]
          - endpoints[PATCH /events/{id}]
          - endpoints[POST /events/{id}/lifecycle]
          - endpoints[POST /events/{id}/payout-run]
        distinguishing_aspect: >-
          The director's four exclusive event-ownership operations all succeed in one chain, each
          incrementing Event.version, and the payout run is a legitimate 200 even with nothing to pay -
          establishing the positive half of every denial test that follows.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z. Nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /events"
              payload: { name: "Director Chain", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000, refund_budget_total_cents: 50000, gratuity_pool_cents: 0 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "PATCH /events/${ev_id}"
              payload: { expected_attendance: 12000, refund_budget_total_cents: 60000 }
              as: GuestExperienceDirector
              captures: { ev_v2: $.data.version, patched_attendance: $.data.expected_attendance, patched_tier: $.data.attendance_tier, patched_remaining: $.data.refund_budget_remaining_cents }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v2}" }
              as: StaffingCoordinator
              captures: { ev_v3: $.data.version }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
              captures: { status_ip: $.data.status, ev_v4: $.data.version }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "CLOSED", reason: "Doors closed, house clear" }
              as: GuestExperienceDirector
              captures: { status_closed: $.data.status, ev_v5: $.data.version }
            - call: "POST /events/${ev_id}/payout-run"
              payload: { phase: "GRATUITY_ALLOCATION" }
              as: GuestExperienceDirector
              captures: { grat_count: $.meta.total_count }
            - call: "POST /events/${ev_id}/payout-run"
              payload: { phase: "PAYROLL" }
              as: GuestExperienceDirector
              captures: { payroll_count: $.meta.total_count }
          assert:
            - "${ev_v1} == 1 and status PLANNED at creation"
            - "the PATCH returns 200 with ${patched_attendance} == 12000, ${patched_tier} == 'TIER_2' and ${patched_remaining} == 60000"
            - "${ev_v2} == 2, ${ev_v3} == 3 (the activate touches the event's version through its OCC field), ${ev_v4} == 4 and ${ev_v5} == 5 - every one of these writes increments the version exactly once"
            - "${status_ip} == 'IN_PROGRESS' with StaffingPlan.${plan_id}.status == 'LOCKED', and ${status_closed} == 'CLOSED'"
            - "${grat_count} == 0 and ${payroll_count} == 0 - both phases return 200 with an empty list rather than an error when there is nothing to pay"
            - "Event.${ev_id}.gratuity_allocated_cents == 0 and refund_approved_total_cents == 0"

      - name: coordinator_and_supervisor_cannot_run_director_exclusive_operations
        claim_type: role_exclusive_operations
        grounds:
          - roles.GuestExperienceDirector
          - roles.StaffingCoordinator
          - roles.GuestServicesSupervisor
          - roles.StaffMember
          - validations[priority 2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: >-
          Every non-director role is refused each of the director's four exclusive operations with the
          same 403 ERR_ROLE_NOT_PERMITTED, and the refusals are total: the event's version never moves
          and no Event row is ever created by a non-director POST.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event created by the director at version 1, with a member id available to act as a StaffMember X-User-ID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: GuestExperienceDirector
            - call: "POST /events"
              payload: { name: "Denial Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Worker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { name: "Coordinator Event", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 1000 }
              as: StaffingCoordinator
              captures: { err_create_coord: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Supervisor Event", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 1000 }
              as: GuestServicesSupervisor
              captures: { err_create_sup: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Worker Event", event_date: "2026-09-20T00:00:00Z", doors_open_at: "2026-09-20T13:00:00Z", doors_close_at: "2026-09-20T21:00:00Z", expected_attendance: 1000 }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_create_member: $.data.error_id }
            - call: "PATCH /events/${ev_id}"
              payload: { expected_attendance: 99000 }
              as: StaffingCoordinator
              captures: { err_patch: $.data.error_id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "CANCELLED", reason: "Not my call" }
              as: StaffingCoordinator
              captures: { err_lifecycle_coord: $.data.error_id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestServicesSupervisor
              captures: { err_lifecycle_sup: $.data.error_id }
            - call: "POST /events/${ev_id}/payout-run"
              payload: { phase: "PAYROLL" }
              as: StaffingCoordinator
              captures: { err_payout: $.data.error_id }
            - call: "GET /events/${ev_id}"
              as: StaffingCoordinator
              captures: { ev_status_after: $.data.status, ev_version_after: $.data.version, ev_attendance_after: $.data.expected_attendance }
          assert:
            - "all seven refusals return HTTP 403 with error_id 'ERR_ROLE_NOT_PERMITTED': ${err_create_coord}, ${err_create_sup}, ${err_create_member}, ${err_patch}, ${err_lifecycle_coord}, ${err_lifecycle_sup} and ${err_payout}"
            - "${ev_status_after} == 'PLANNED', ${ev_version_after} == ${ev_v1} == 1 and ${ev_attendance_after} == 6000 - not one refused write left a trace"
            - "GET /events?limit=10&offset=0 returns total_count == 1 - the three refused creates made nothing"
            - "the payout refusal is a role refusal, not the ERR_PAYOUT_PHASE_INVALID the event's PLANNED status would also justify - priority 2 runs before any state check"

      - name: supervisor_exclusive_guest_issue_operations_permitted
        claim_type: role_exclusive_operations
        grounds:
          - roles.GuestServicesSupervisor
          - endpoints[POST /guest-issues/{id}/assign]
          - endpoints[POST /guest-issues/{id}/escalate]
          - endpoints[POST /guest-issues/{id}/reopen]
          - endpoints[POST /guest-issues/{id}/close]
          - endpoints[POST /guest-issues/{id}/refund-request]
          - endpoints[POST /accessibility-resources]
          - endpoints[POST /accessibility-requests]
        distinguishing_aspect: >-
          The supervisor's guest-facing exclusives all succeed for the supervisor and are refused to
          both peers: assign and refund-request work, the accessibility pool and booking are created,
          and the director - who outranks the supervisor everywhere on money - still cannot assign an
          issue or open an accessibility pool.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event (refund_budget_total_cents 100000) with an ACTIVE-then-LOCKED plan."
            - "One ACTIVE member with a VALID CODE_OF_CONDUCT certification."
            - "One MEDIUM / OTHER GuestIssue reported by 'sup-9'."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Supervisor Exclusive Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000, refund_budget_total_cents: 100000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "KIOSK", category: "OTHER", severity: "MEDIUM", description: "Kiosk complaint" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_1: $.data.id }
          trigger:
            - call: "POST /guest-issues/${gi_1}/assign"
