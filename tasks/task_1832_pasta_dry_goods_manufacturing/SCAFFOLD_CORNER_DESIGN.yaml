              captures: { job_a: "$.data[0].id" }
            - call: "POST /production-runs/${run_b}/advance"
              payload: { actual_yield_kg: 999.0 }
              as: ProductionOperator
            - call: "GET /packaging-jobs"
              payload: { run_id: "${run_b}" }
              as: ProductionOperator
              captures: { job_b: "$.data[0].id" }
          assert:
            - "PackagingJob.${job_a}: total_units 1997, full_case_count 83, remainder 5 -> partial_case_count 0, scrapped_units 5, case_count 83"
            - "PackagingJob.${job_b}: total_units 1998, full_case_count 83, remainder 6 -> partial_case_count 1, scrapped_units 0, case_count 84"
            - "Boundary: remainder 5 < 6 scraps; remainder 6 >= 6 cases"

      - name: semolina_grade_weighted_score_correctness
        claim_type: correct_result
        grounds: [calculations.semolina_grade]
        excluded_because:
          difficulty_instance: "dual_variant_calc / semolina_grade_certificate_vs_lab_divergence"
          rationale: "Both variants' exact scores (63.75 / 81.50) and grade thresholds are asserted there."

      - name: settlement_price_variants_and_tier_order
        claim_type: variant_divergence
        grounds: [calculations.contract_settlement_price]
        excluded_because:
          difficulty_instance: "combinatorial_formula / settlement_tier_evaluation_order_pre_delivery_cumulative"
          rationale: "Tier evaluation order asserted there; variant divergence asserted in settlement_price_index_lagged_vs_spot_blend_divergence; tier boundary in contract_tier_boundary_exact_20000_kg."

      - name: changeover_and_caseplan_formula_coverage
        claim_type: correct_result
        grounds: [calculations.changeover_minutes, calculations.case_plan]
        excluded_because:
          difficulty_instance: "combinatorial_formula / changeover_matrix_wear_tier_allergen_composition"
          rationale: "Composed changeover (base+wear+allergen) and the pinned rounding order of case_plan are asserted by the two rule-2 instances."

  # ============================================================ 4. Validations
  - section: validations
    instances:
      - name: quarantine_lift_recency_gate
        claim_type: temporal_validation
        grounds: [state_machines.WarehouseZone.QUARANTINED_to_CLEAR, "errors[ERR_QUARANTINE_LIFT_BLOCKED]"]
        distinguishing_aspect: "Only a VERIFIED NONE inspection with verified_at AFTER quarantined_at unlocks the lift: a NONE verified before the CRITICAL does not count; lift is blocked until a fresh NONE verifies."
        test_recipe:
          setup: ["zone Z-QRC with a NONE inspection verified BEFORE a CRITICAL quarantine"]
          setup_api_calls:
            - call: "POST /warehouse-zones"
              payload: { zone_name: "Z-QRC", zone_type: "CONVENTIONAL", capacity_pallets: 5 }
              as: PlantManager
              captures: { zone_id: $.data.id }
            - call: "POST /pest-inspections"
              payload: { zone_id: "${zone_id}", severity: "NONE", notes: "routine sweep" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { i_old: $.data.id }
            - call: "POST /pest-inspections/${i_old}/verify"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /pest-inspections"
              payload: { zone_id: "${zone_id}", severity: "CRITICAL", notes: "infestation" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { i_crit: $.data.id }
            - call: "POST /pest-inspections/${i_crit}/verify"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
          trigger:
            - call: "POST /warehouse-zones/${zone_id}/lift-quarantine"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlantManager
            - call: "POST /pest-inspections"
              payload: { zone_id: "${zone_id}", severity: "NONE", notes: "post-cleanout sweep" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { i_new: $.data.id }
            - call: "POST /pest-inspections/${i_new}/verify"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /warehouse-zones/${zone_id}/lift-quarantine"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
          assert:
            - "e1 == ERR_QUARANTINE_LIFT_BLOCKED (pre-quarantine NONE is stale)"
            - "After post-quarantine NONE verifies: lift succeeds, pest_posture == CLEAR, quarantined_at null"

      - name: stale_swab_rejected_at_verify
        claim_type: temporal_validation
        grounds: [state_machines.GlutenTest.RECORDED_to_VERIFIED, "errors[ERR_STALE_SWAB]"]
        distinguishing_aspect: "A LINE_SWAB recorded while the line was still CLEANING_IN_PROGRESS predates cleaning_completed_at; verifying it after complete-cleaning fails with ERR_STALE_SWAB and the posture stays AWAITING_SWAB."
        test_recipe:
          setup: ["line L-SSW: start-cleaning, swab recorded during CLEANING_IN_PROGRESS, then complete-cleaning"]
          setup_api_calls:
            - call: "POST /production-lines"
              payload: { line_name: "L-SSW" }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /production-lines/${line_id}/start-cleaning"
              payload: {}
              as: ProductionOperator
            - call: "POST /gluten-tests"
              payload: { test_type: "LINE_SWAB", line_id: "${line_id}", result: "PASS" }
              as: QATechnician
              as_user_id: "tech-1"
              captures: { swab: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: PlantManager
            - call: "POST /production-lines/${line_id}/complete-cleaning"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /gluten-tests/${swab}/verify"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
              captures: { e1: $.data.error_id }
          assert:
            - "e1 == ERR_STALE_SWAB (swab created_at < cleaning_completed_at)"
            - "ProductionLine.${line_id}.gluten_posture == AWAITING_SWAB (unchanged)"

      - name: receipt_window_and_contract_status_edges
        claim_type: temporal_validation
        grounds: ["errors[ERR_CONTRACT_NOT_ACTIVE]", "errors[ERR_CONTRACT_WINDOW_INVALID]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Receipt against a DRAFT contract fails (ERR_CONTRACT_NOT_ACTIVE); a lapsed window cannot be activated (ERR_INVALID_REQUEST at activate); delivery on effective_end is inclusive-allowed while the next day is rejected (ERR_CONTRACT_WINDOW_INVALID)."
        test_recipe:
          setup: ["contract C-RW1 DRAFT (2026-01-01..2026-12-31); contract C-RW2 window 2026-01-01..2026-06-30 (lapsed at default clock); contract C-RW3 ACTIVE 2026-01-01..2026-08-31"]
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-RW1", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c1: $.data.id }
            - call: "POST /ingredient-contracts"
