              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "POST /subscription-packages"
              as: BoxOfficeManager
              payload: { name: "Chamber Series", package_price_cents: 1500000, included_engagement_ids: ["${engagement_id}", "8f2a1c34-0000-4000-8000-0000000000cc"], subscription_tier_name: "ORCH", seats_per_order: 2 }
              captures: { err: "$.data.error_id" }
          assert:
            - "404 ERR_ENGAGEMENT_NOT_FOUND - every element of the FK array is resolved, not just the first."
            - "No SubscriptionPackage row is created; the junction is all-or-nothing."
            - "The surviving engagement is untouched: version still 1 and ticketing_status still TICKETING_UNSET."

      - name: subscription_package_junction_links_two_presented_engagements
        claim_type: many_to_many_junction
        excluded_because:
          difficulty_instance: price_tier_seat_conservation_across_sales_subscription_holds_and_refunds
          rationale: >-
            That §1.8 compensating_invariant instance already builds the junction
            for real - two PRESENTED engagements driven to ON_SALE, a
            SubscriptionPackage spanning both, an order sold and the per-tier
            subscription_held_qty / subscription_revenue_cents booked on each
            side - and asserts seat conservation across the link. A separate
            corner test of the happy-path association would replay the same
            ~24-call chain to assert a strict subset of the same fields.
  # ===========================================================================
  # STATE MACHINES (§1.2) - guide Table 2 + `state_machine_shape: parallel`
  # ===========================================================================
  - section: state_machines
    instances:

      - name: engagement_and_child_entities_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - "§1.2 initial states: Engagement DRAFT / UNASSESSED / TICKETING_UNSET, FeeNegotiation OFFERED, TechRider SUBMITTED, LaborCall ESTIMATED, PriceTier ACTIVE."
          - "§1.1 declares each of those as the field default on a computed status field."
        distinguishing_aspect: >-
          Sweeps the initial state of five of the seven §1.2 machines in one
          chain, which is the only way to catch an implementation that seeds a
          child in the state its first transition would produce (e.g. a rider
          created straight into CAPABLE, or a tier created CLOSED). Asserted on
          the create responses, before any transition endpoint is called.
        test_recipe:
          setup:
            - "Grand Hall exists (1200 seats, 500000/200000 rate card, 120-minute buffer, 5000 kg rigging, 400 A, 4 DMX universes, ACTIVE)."
            - "Artist 'Cadence Quartet' exists: guarantee_floor_cents 200000, historical_sell_through_pct 0.8, routing window 2026-09-01 -> 2026-12-31, min_days_between_engagements 0."
            - "UnionDepartment ELECTRICS exists: roster_size 20, straight_hourly_rate_cents 5000, all four rate-card optionals defaulted."
            - "A PRESENTED engagement exists on Grand Hall (load-in 2026-10-10T08:00Z, performance 2026-10-11T19:00Z-22:00Z, load-out 2026-10-12T02:00Z, 1 performance day, 1 load-in day); its create response is captured with version 1."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload: { department: "ELECTRICS", roster_size: 20, straight_hourly_rate_cents: 5000 }
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/tech-riders"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { submitted_rigging_kg: 1000, requested_power_amps: 200, requested_dmx_universes: 2, requires_orchestra_pit: false }
              captures: { rider_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload: { union_department_id: "${dept_id}", crew_size: 4, call_start_utc: "2026-10-10T08:00:00Z", call_end_utc: "2026-10-10T12:00:00Z" }
              captures: { call_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 400, base_price_cents: 8000, price_ceiling_cents: 10000, dynamic_pricing_enabled: false, subscription_eligible: true }
              captures: { tier_id: "$.data.id" }
          assert:
            - "The engagement create response already showed lifecycle_status DRAFT, financial_clearance UNASSESSED and ticketing_status TICKETING_UNSET simultaneously."
            - "FeeNegotiation: status == 'OFFERED', round_index == 1, revision_count == 0, counter_fee_cents null, accepted_fee_cents null, accepted_by_user_id null."
            - "TechRider: review_status == 'SUBMITTED', capability_gaps == [], additional_equipment_cost_cents == 0, reviewed_by_user_id null."
            - "LaborCall: status == 'ESTIMATED', actual_hours null, meal_break_taken null, actual_cost_cents == 0."
            - "PriceTier: status == 'ACTIVE', sold_qty 0, subscription_held_qty 0, available_qty == 400, gross_cents 0, subscription_revenue_cents 0."

      - name: new_negotiation_round_supersedes_the_open_round
        claim_type: side_effect_execution
        grounds:
          - "§1.2 FeeNegotiation OFFERED -> SUPERSEDED and COUNTERED -> SUPERSEDED, both `system, cascaded from POST /engagements/{id}/fee-negotiations (new round)`."
          - "§1.5 POST /engagements/{id}/fee-negotiations side effects: round_index assigned, prior open round superseded, engagement.negotiation_round_count incremented."
        distinguishing_aspect: >-
          Isolates the supersede cascade as the claim under test rather than the
          round ceiling that §1.8 covers: the point here is that opening round 2
          mutates a DIFFERENT row (round 1) and bumps that row's own version,
          while the engagement's round counter tracks rounds opened rather than
          rounds still live.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (guarantee_floor_cents 200000) exist, plus a DRAFT PRESENTED engagement (2026-10-11 performance) with version 1."
            - "Round 1 has been opened at 300000 / 0.10 against expected_engagement_version 1, which bumped the engagement to version 2; the round is OFFERED with round_index 1 and version 1."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg1_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}"
              as: ProgrammingDirector
              captures: { eng_v1: "$.data.version" }
          trigger:
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 350000, offered_artist_share_pct: 0.12, expected_engagement_version: "${eng_v1}" }
              captures: { neg2_id: "$.data.id" }
            - call: "GET /engagements/${engagement_id}/fee-negotiations"
              as: FinanceController
          assert:
            - "201 for round 2: status 'OFFERED', round_index == 2, offered_fee_cents 350000, offered_artist_share_pct 0.12, revision_count 0."
            - "The listing reports meta.total_count == 2, and the round-1 row now has status 'SUPERSEDED' with version 2 - the cascade wrote to a sibling row, not to the new one."
            - "Round 1 keeps its original offered_fee_cents 300000 and its accepted_* fields stay null: supersede is a status change only."
            - "engagement.negotiation_round_count == 2 (rounds ever opened) and engagement.version == ${eng_v1} + 1."
            - "engagement.negotiated_fee_cents is still 0 - no round has been accepted."

      - name: accept_from_countered_locks_the_counter_terms
        claim_type: valid_transition
        grounds:
          - "§1.2 FeeNegotiation COUNTERED -> ACCEPTED, actor ProgrammingDirector, side effects `accepted_fee_cents = counter_fee_cents; accepted_share_pct = counter_artist_share_pct`."
          - "§1.3 engagement_margin PROJECTED is recomputed when negotiated_fee_cents changes."
          - "§1.2 Engagement.financial_clearance CLEARED -> ESCALATED fires only from CLEARED."
        distinguishing_aspect: >-
          The COUNTERED branch of accept is the one that must copy the COUNTER
          terms, not the standing offer, and it is driven by a different actor
          (ProgrammingDirector) than the OFFERED branch (ArtistRepresentative).
          The instance also pins the negative case of the clearance cascade: the
          recomputed margin is negative here, yet clearance stays UNASSESSED
          because the CLEARED -> ESCALATED edge requires CLEARED as its source.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' (guarantee_floor_cents 200000, sell-through 0.8) exist."
            - "A DRAFT PRESENTED engagement (2026-10-11 performance) exists with no price tiers, so §1.3 projected_gross_cents is 0."
            - "Round 1 was opened at 300000 / 0.10 (engagement version 1 -> 2) and then countered by the artist's representative at 400000 / 0.15, which is above the 200000 guarantee floor; the round is COUNTERED with version 2 and the engagement is still at version 2."
            - "financial_clearance has never been assessed, so it is UNASSESSED (not BLOCKED), satisfying the accept precondition."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id", eng_v0: "$.data.version" }
            - call: "POST /engagements/${engagement_id}/fee-negotiations"
              as: ProgrammingDirector
              payload: { offered_fee_cents: 300000, offered_artist_share_pct: 0.1, expected_engagement_version: "${eng_v0}" }
              captures: { neg_id: "$.data.id" }
            - call: "POST /fee-negotiations/${neg_id}/counter"
              as: ArtistRepresentative
              as_user_id: "${artist_id}"
              payload: { counter_fee_cents: 400000, counter_artist_share_pct: 0.15 }
          trigger:
            - call: "POST /fee-negotiations/${neg_id}/accept"
              as: ProgrammingDirector
              as_user_id: "user-pd-1"
            - call: "GET /engagements/${engagement_id}"
              as: FinanceController
          assert:
            - "200 with status 'ACCEPTED', accepted_fee_cents == 400000 and accepted_share_pct == 0.15 - the counter terms, NOT the 300000 / 0.10 offer."
            - "accepted_by_user_id == 'user-pd-1'; offered_fee_cents is still 300000 (history preserved)."
            - "engagement.negotiated_fee_cents == 400000, artist_share_pct == 0.15, fee_accepted_by_user_id == 'user-pd-1'."
            - "engagement.projected_margin_cents == -650000 (0 projected gross - (400000 fee + 0 labor + 0 equipment + 250000 MARKETING_FLAT_CENTS))."
            - "engagement.financial_clearance is still 'UNASSESSED' and risk_tier still 'LOW': the negative margin does NOT escalate, because §1.2's CLEARED -> ESCALATED edge only fires from CLEARED."
            - "engagement.version == 3 (create 1, round 2, accept 3)."

      - name: settlement_opened_before_curtain_down_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - "§1.2 Engagement CONFIRMED -> PERFORMED is evaluated during POST /engagements/{id}/settlements and requires lifecycle CONFIRMED AND clock_current_utc >= performance_end_utc."
          - "§1.6 ERR_PERFORMANCE_NOT_COMPLETE (409)."
        distinguishing_aspect: >-
          Both conjuncts of the auto-transition guard are falsified separately in
          the same instance: first the clock is early on a DRAFT engagement, then
          the clock is moved past curtain-down while the engagement is still
          DRAFT. An implementation that only checks the clock passes the first
          probe and fails the second.
        test_recipe:
          setup:
            - "Grand Hall and rental client 'Meridian Dance Company' (credit A, outstanding 0) exist."
            - "A RENTAL engagement exists (load-in 2026-10-01T08:00Z, performance 2026-10-02T19:00Z-22:00Z, load-out 2026-10-03T02:00Z) and is still DRAFT: nothing was cleared, deposited, assessed or confirmed."
            - "The logical clock is still at its declared start, 2026-08-01T00:00:00Z, which is well before performance_end_utc."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload: { org_name: "Meridian Dance Company", contact_email: "book@meridian.example", credit_rating: "A", is_nonprofit: false }
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload: { engagement_type: "RENTAL", space_id: "${space_id}", rental_client_id: "${client_id}", title: "Early Settlement Probe", load_in_start_utc: "2026-10-01T08:00:00Z", performance_start_utc: "2026-10-02T19:00:00Z", performance_end_utc: "2026-10-02T22:00:00Z", load_out_end_utc: "2026-10-03T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              captures: { err_early: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              as: CenterAdmin
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
            - call: "POST /engagements/${engagement_id}/settlements"
              as: FinanceController
              captures: { err_draft: "$.data.error_id" }
            - call: "GET /engagements/${engagement_id}/settlements"
              as: FinanceController
          assert:
            - "First attempt: 409 ERR_PERFORMANCE_NOT_COMPLETE (clock 2026-08-01 is before the 2026-10-02T22:00Z curtain-down and the engagement is not CONFIRMED)."
            - "Clock call returns 200 with current_utc == '2026-10-03T00:00:00Z' and mutates nothing."
            - "Second attempt: still 409 ERR_PERFORMANCE_NOT_COMPLETE - the clock now qualifies but lifecycle_status is DRAFT, not CONFIRMED."
            - "The settlements listing reports meta.total_count == 0; no DRAFT Settlement row was created by either attempt."
            - "engagement.lifecycle_status is still 'DRAFT' and ticketing_status is still 'TICKETING_UNSET' - the auto-transition did not partially apply."

      - name: on_sale_before_confirmation_is_rejected
        claim_type: invalid_transitions
        grounds:
          - "§1.2 Engagement.ticketing_status TIERS_DRAFT -> ON_SALE requires lifecycle_status == CONFIRMED."
          - "§1.6 ERR_ENGAGEMENT_NOT_CONFIRMED (409); §1.4 priority 40."
        distinguishing_aspect: >-
          Attacks the transition whose two dimensions disagree: the ticketing
          dimension IS in the right source state (TIERS_DRAFT, reached by
          drafting a tier on a DRAFT engagement), so only the cross-dimension
          lifecycle precondition can reject the call. This is the trigger a
          single-dimension implementation would happily accept.
        test_recipe:
          setup:
            - "Grand Hall and artist 'Cadence Quartet' exist; a DRAFT PRESENTED engagement (2026-10-11 performance) exists at version 1."
            - "One price tier ORCH (400 seats, base 8000, ceiling 10000, dynamic off) was drafted, which moved ticketing_status TICKETING_UNSET -> TIERS_DRAFT without touching lifecycle_status or engagement.version."
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload: { name: "Grand Hall", seat_capacity: 1200, base_facility_fee_cents: 500000, load_in_day_fee_cents: 200000, changeover_buffer_minutes: 120, rigging_capacity_kg: 5000, house_power_amps: 400, dmx_universes: 4 }
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload: { legal_name: "Cadence Quartet", agency_name: "Northgate Artists", guarantee_floor_cents: 200000, historical_sell_through_pct: 0.8, routing_window_start_utc: "2026-09-01T00:00:00Z", routing_window_end_utc: "2026-12-31T00:00:00Z", min_days_between_engagements: 0 }
              captures: { artist_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload: { engagement_type: "PRESENTED", space_id: "${space_id}", artist_id: "${artist_id}", title: "Cadence Quartet Recital", load_in_start_utc: "2026-10-10T08:00:00Z", performance_start_utc: "2026-10-11T19:00:00Z", performance_end_utc: "2026-10-11T22:00:00Z", load_out_end_utc: "2026-10-12T02:00:00Z", performance_day_count: 1, load_in_day_count: 1 }
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/price-tiers"
              as: BoxOfficeManager
              payload: { tier_name: "ORCH", seats_allocated: 400, base_price_cents: 8000, price_ceiling_cents: 10000, dynamic_pricing_enabled: false, subscription_eligible: true }
              captures: { tier_id: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/on-sale"
