  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_score_gated_by_application_in_review
        grounds:
          - state_machines.ReviewAssignment.PENDING_to_SCORED
          - state_machines.Application.transitions
        distinguishing_aspect: |
          Entity pair ReviewAssignment -> Application: scoring is rejected when
          the parent application left IN_REVIEW (e.g., was returned for revision
          then withdrawn), even though the assignment itself is still PENDING.
        test_recipe:
          setup:
            - "Clock 2026-08-01; criterion CN_II active; nurse W application reaches IN_REVIEW with one PENDING assignment for reviewer V"
            - "Application returned for revision (assignment cascaded EXPIRED) — but create a second assignment in the new cycle, then withdraw from DRAFT after another return leaves assignment PENDING on a non-IN_REVIEW parent"
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
