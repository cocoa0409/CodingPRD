    path: "/observation-cycles/{id}"
    description: "Retrieve one observation cycle including both of its independent status dimensions."
    roles: [ProgramAdmin, SiteInductionLead, Mentor, NoviceTeacher, StateCredentialingOfficer]
    code: 200
