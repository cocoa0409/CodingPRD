# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2631 — Statement Composition & Print-Mail Bureau
# Nine §0.5 Difficulty Rules; every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only.
# Every numeric literal in `assert:` was computed by executing the §1.3 formula.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: postage_estimate_and_manifest_variants_diverge_on_one_batch
        grounds:
          - calculations.postage_cost
          - entities.PresortBatch.fields.estimated_postage_cents
          - entities.PresortBatch.fields.manifested_postage_cents
          - entities.PresortBatch.fields.postage_variance_cents
          - state_machines.PresortBatch.OPEN_to_SEALED
          - state_machines.PresortBatch.SEALED_to_MANIFESTED
        distinguishing_aspect: |
          This instance lives in the PresortBatch/EntryFacility postage-ledger domain: the same two
          MARKETING THREE_DIGIT pieces yield estimated_postage_cents 60 at seal (no facility, no
          discount, every non-VOID piece counted) and manifested_postage_cents 54 at manifest
          (facility discount 850 bp rounded per piece, only INDUCTED pieces counted).
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Client CL-PV with dr_readiness_required false and default control_total_tolerance_bp 5."
            - "ACTIVE template T-PV: MARKETING, sheets_per_document 1, no inserts, no variable content rules."
            - "DataFile pv-cycle-01.csv declaring 2 records / 200000 cents, matched exactly, so it reaches ACCEPTED."
            - "Two fully-hygienic records in postal_code 30301, so the waterfall lands both in THREE_DIGIT (one batch, 2 pieces, 1 tray)."
            - "PressLine PL-PV (600 sheets/hour, 9000 daily) named explicitly; EntryFacility EF-PV with discount_bp_marketing 850."
            - "Job driven to VERIFIED: scheduled, run started, all six barcode stages accepted, run completed, integrity reconciled MATCHED."
            - "Client escrow funded with 100000 cents; the deposit response is the last write to Client before the seal, so its version is the OCC token."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-PV", name: "Pinecrest Variance Mutual", dr_readiness_required: false }
              as: BureauAdmin
              captures: { pv_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${pv_client_id}", template_code: "T-PV", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "MARKETING", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { pv_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${pv_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${pv_client_id}", file_name: "pv-cycle-01.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 200000 }
              as: ClientLiaison
              captures: { pv_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${pv_file_id}", account_ref: "ACC0001", sequence_no: 1, statement_amount_cents: 100000, address_line1: "100 Market Street", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1234" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${pv_file_id}", account_ref: "ACC0002", sequence_no: 2, statement_amount_cents: 100000, address_line1: "220 Peachtree Lane", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "5678" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${pv_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${pv_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-PV", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 9000, changeover_buffer_minutes: 30 }
              as: BureauAdmin
              captures: { pv_line_id: "$.data.id" }
            - call: "POST /bureau/entry-facilities"
              payload: { facility_code: "EF-PV", facility_type: "SCF", tray_capacity_per_window: 10, discount_bp_first_class: 850, discount_bp_marketing: 850 }
              as: BureauAdmin
              captures: { pv_facility_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${pv_file_id}", template_id: "${pv_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { pv_job_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${pv_job_id}/presort"
              payload: {}
              as: CompositionOperator
            - call: "GET /bureau/mail-pieces?composition_job_id=${pv_job_id}"
              payload: {}
              as: IntegrityAuditor
              captures: { pv_p1_id: "$.data[0].id", pv_p1_bar: "$.data[0].imb_barcode", pv_p2_id: "$.data[1].id", pv_p2_bar: "$.data[1].imb_barcode" }
            - call: "GET /bureau/presort-batches?composition_job_id=${pv_job_id}"
              payload: {}
              as: PostageController
              captures: { pv_batch_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/composition-jobs/${pv_job_id}/schedule"
              payload: { window_start: "2026-08-02T09:00:00Z", press_line_id: "${pv_line_id}" }
              as: ProductionScheduler
              captures: { pv_run_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${pv_run_id}/start"
              payload: {}
              as: ProductionScheduler
            - call: "POST /bureau/mail-pieces/${pv_p1_id}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${pv_p1_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${pv_p1_id}/scans"
              payload: { stage: "INSERT", scanned_barcode: "${pv_p1_bar}", device_code: "SC-02" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${pv_p1_id}/scans"
              payload: { stage: "INDUCT", scanned_barcode: "${pv_p1_bar}", device_code: "SC-03" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${pv_p2_id}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${pv_p2_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${pv_p2_id}/scans"
              payload: { stage: "INSERT", scanned_barcode: "${pv_p2_bar}", device_code: "SC-02" }
              as: IntegrityAuditor
            - call: "POST /bureau/mail-pieces/${pv_p2_id}/scans"
              payload: { stage: "INDUCT", scanned_barcode: "${pv_p2_bar}", device_code: "SC-03" }
              as: IntegrityAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T10:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${pv_run_id}/complete"
              payload: {}
              as: ProductionScheduler
            - call: "POST /bureau/composition-jobs/${pv_job_id}/reconcile-integrity"
              payload: {}
              as: IntegrityAuditor
            - call: "POST /bureau/clients/${pv_client_id}/postage-deposits"
              payload: { amount_cents: 100000, reference: "WIRE-PV-01" }
              as: PostageController
              captures: { pv_client_v: "$.data.version" }
          trigger:
            - call: "POST /bureau/presort-batches/${pv_batch_id}/seal"
              payload: { expected_client_version: "${pv_client_v}" }
              as: PostageController
              as_user_id: "postage-1"
              captures: { pv_estimated: "$.data.estimated_postage_cents" }
            - call: "POST /bureau/presort-batches/${pv_batch_id}/manifest"
              payload: { entry_facility_id: "${pv_facility_id}", induction_window_start: "2026-08-03T08:00:00Z", induction_window_end: "2026-08-03T12:00:00Z" }
              as: PostageController
              as_user_id: "postage-2"
              captures: { pv_manifested: "$.data.manifested_postage_cents" }
          assert:
            - "PresortBatch.${pv_batch_id}.mail_class == MARKETING and presort_bucket == THREE_DIGIT and piece_count == 2 and tray_count == 1"
            - "After the seal call PresortBatch.${pv_batch_id}.status == SEALED and estimated_postage_cents == 60 (base 30 per piece, sheet_count 1 so surcharge 0, no facility discount)"
            - "After the seal call Client.${pv_client_id}.postage_committed_cents == 60 and postage_escrow_available_cents == 99940"
            - "After the manifest call PresortBatch.${pv_batch_id}.status == MANIFESTED and manifested_postage_cents == 54 (round_half_up(30 * 9150 / 10000) == 27 per piece, summed over 2 INDUCTED pieces)"
            - "PresortBatch.${pv_batch_id}.postage_variance_cents == -6"
            - "manifested_postage_cents != estimated_postage_cents (54 != 60): the two variants diverge on identical piece data"
            - "Summing gross first and rounding the batch total once would give 55, not 54 — the per-piece rounding order is observable"
            - "After the manifest call Client.${pv_client_id}.postage_committed_cents == 54 and postage_escrow_available_cents == 99946 and postage_deposited_cents == 100000"
            - "CompositionJob.${pv_job_id}.status == MANIFESTED (bubble-up: the batch was the job's only batch)"

      - name: sla_projected_and_assessed_variants_diverge_on_one_job
        grounds:
          - calculations.sla_penalty
          - entities.CompositionJob.fields.projected_penalty_cents
          - entities.CompositionJob.fields.assessed_penalty_cents
          - entities.CompositionJob.fields.sla_hold_minutes
          - state_machines.CompositionJob.PRESORTED_to_SCHEDULED
          - state_machines.CompositionJob.MANIFESTED_to_CLOSED
        distinguishing_aspect: |
          This instance lives in the CompositionJob/Client service-level domain (a different entity
          domain from the PresortBatch postage instance): the forward-looking projected variant reads
          70000 cents off run.window_end + 120 minutes at schedule time, while the chronological
          assessed variant reads 72500 cents off the real sla_completed_at minus the 60 accrued
          sla_hold_minutes at close time.
        test_recipe:
          setup:
            - "Client CL-SL: sla_turnaround_hours 96, sla_penalty_rate_cents_per_hour 2500, sla_penalty_cap_cents 500000, dr_readiness_required false."
            - "Clock at 2026-08-01T08:00:00Z when control-check runs, so DataFile.accepted_at is 2026-08-01T08:00:00Z and sla_due_at is 2026-08-05T08:00:00Z."
            - "ACTIVE template T-SL: FIRST_CLASS, sheets_per_document 1, no inserts. Two hygienic records in postal_code 30301 -> one THREE_DIGIT batch."
            - "Run window [2026-08-06T09:00:00Z, 2026-08-06T10:00:00Z] on PL-SL, so projected_completion_at is window_end + 120 minutes = 2026-08-06T12:00:00Z."
            - "Piece 2 is deliberately never INDUCT-scanned, so the first reconcile breaches and the job sits INTEGRITY_HELD from 2026-08-06T11:00:00Z."
            - "The reprint is issued at 2026-08-06T12:00:00Z, accruing exactly 60 sla_hold_minutes; the replacement is then scanned through all three stages and the job reaches VERIFIED, MANIFESTED."
            - "Clock advanced to 2026-08-06T14:00:00Z immediately before the close call."
