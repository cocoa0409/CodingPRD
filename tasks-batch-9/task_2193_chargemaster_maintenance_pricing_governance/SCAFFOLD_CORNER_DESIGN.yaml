              as: RevenueIntegrityAnalyst
              captures: { rule: $.data.id, rule_floor: $.data.min_medicare_multiple_bp, rule_cap: $.data.market_cap_multiple_bp, rule_flat: $.data.flat_fee_cents, rule_to: $.data.effective_to, rule_status: $.data.status }
            - call: "POST /chargemaster/charge-items"
