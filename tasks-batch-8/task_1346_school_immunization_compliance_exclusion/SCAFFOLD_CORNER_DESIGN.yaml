              payload: { school_code: "SCH-RB", vaccine_code: "MMR" }
              as: SchoolNurse
              captures: { err: $.data.error_id }
          assert:
            - "response 403 with error_id == ERR_FORBIDDEN"

      - name: coordinator_cannot_verify_dose_returns_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[RegistryCoordinator]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "RegistryCoordinator lacks dose verification: 403 ERR_FORBIDDEN even when the record exists."
        test_recipe:
          setup: ["student with one PENDING_VERIFICATION MMR dose"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Rbac Two", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-RB", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec_id: $.data.id }
          trigger:
