  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: section_scheduling_gated_by_term_posture
        grounds:
          - state_machines.Section.DRAFT_to_SCHEDULED
          - state_machines.AcademicTerm.TALLYING_to_BUILDING
          - "validations[priority=5]"
        distinguishing_aspect: |
          Entity pair Section -> AcademicTerm: PATCHing a section to SCHEDULED
          is legal only while the parent term posture == BUILDING; the same
          payload against the same section fails ERR_INVALID_TERM_POSTURE once
          the term advances to PUBLISHED.
        test_recipe:
          setup:
            - "Term T10 driven to BUILDING with one DRAFT section sec_g of course HIS-201; teacher t_gate qualified; room rm_g1 STANDARD."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Thirteen", max_caseload: 100 }
              as: Administrator
              captures: { c13: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2035-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term10: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "HIS-201", title: "History", credits: 1.0, subject_area: "SOCIAL_STUDIES", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k10: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "G1", full_name: "Gate One", grade_level: 10, counselor_id: "${c13}" }
              as: Administrator
              captures: { s_g1: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_g1}", course_id: "${k10}", term_id: "${term10}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_g1}"
              captures: { rq_g1: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_g1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_g1}"
            - call: "POST /scheduling/terms/${term10}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${term10}/generate-sections"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/teachers"
              payload: { full_name: "T Gate", max_sections: 5 }
              as: Administrator
              captures: { t_gate: "$.data.id" }
            - call: "POST /scheduling/teachers/${t_gate}/qualifications"
              payload: { course_id: "${k10}", qualified_at: "2026-01-01T00:00:00Z" }
              as: Administrator
            - call: "POST /scheduling/rooms"
              payload: { room_number: "G-1", capacity: 32, room_type: "STANDARD" }
              as: Administrator
              captures: { rm_g1: "$.data.id" }
          trigger:
            - call: "GET /scheduling/sections"
              as: Administrator
              captures: { sec_g: "$.data[0].id" }
            - call: "GET /scheduling/terms/${term10}"
              as: Administrator
              captures: { term10_v: "$.data.version" }
            - call: "PATCH /scheduling/sections/${sec_g}"
              payload: { teacher_id: "${t_gate}", room_id: "${rm_g1}", period: 1, capacity: 32, expected_term_version: "${term10_v}" }
              as: Administrator
              captures: { sec_g_state: "$.data.state" }
            - call: "POST /scheduling/terms/${term10}/publish"
              payload: {}
              as: Administrator
            - call: "GET /scheduling/terms/${term10}"
              as: Administrator
              captures: { term10_v2: "$.data.version" }
            - call: "PATCH /scheduling/sections/${sec_g}"
              payload: { teacher_id: "${t_gate}", room_id: "${rm_g1}", period: 2, capacity: 32, expected_term_version: "${term10_v2}" }
              as: Administrator
              captures: { posture_err: "$.data.error_id" }
          assert:
            - "first PATCH succeeds (posture BUILDING): section state == SCHEDULED"
            - "second PATCH after publish fails ERR_INVALID_TERM_POSTURE (409): the Section's legal transition set depends on the parent AcademicTerm's posture"
      - name: recovery_place_gated_by_section_state
        grounds:
          - state_machines.RecoveryPlacement.PENDING_to_PLACED
          - calculations.placement_selector
          - "errors[ERR_RECOVERY_NO_SECTION]"
        distinguishing_aspect: |
          Entity pair RecoveryPlacement -> Section (different pair from
          Section -> AcademicTerm): a PENDING placement flips to PLACED only
          when at least one PUBLISHED section of the target course passes the
          selector; with every section CANCELLED, place fails
          ERR_RECOVERY_NO_SECTION.
        test_recipe:
          setup:
            - "Term T11 in LOCKED after a rebalance run cancelled the only (empty) section of ENG-099; student s_rec (grade 12, earned 16.0) is credit-deficient per the publish-time audit; a PENDING RecoveryPlacement targets ENG-099."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Fourteen", max_caseload: 100 }
              as: Administrator
              captures: { c14: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2036-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term11: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "ENG-099", title: "English Recovery", credits: 1.0, subject_area: "ENGLISH", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k11: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "REC", full_name: "Rec Stu", grade_level: 12, counselor_id: "${c14}", earned_credits: 16.0 }
              as: Administrator
              captures: { s_rec: "$.data.id" }
            # NOTE for the test-generator: standard chain — s_rec requests
            # ENG-099 (its only demand), close, generate (1 DRAFT section),
            # schedule + publish (s_rec placed in another period... pinned so
            # s_rec is NOT in ENG-099's section; ENG-099's section stays empty),
            # open + close window (LOCKED), rebalance run cancels the empty
            # ENG-099 section.
          trigger:
            - call: "POST /scheduling/recovery-placements"
              payload: { student_id: "${s_rec}", term_id: "${term11}", target_course_id: "${k11}" }
              as: Counselor
              as_user_id: "${c14}"
              captures: { rp_rec: "$.data.id" }
            - call: "POST /scheduling/recovery-placements/${rp_rec}/place"
              payload: {}
              as: Counselor
              as_user_id: "${c14}"
              captures: { rec_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_RECOVERY_NO_SECTION (422): every section of course ${k11} is CANCELLED, so the selector's candidate set is empty"
            - "RecoveryPlacement.${rp_rec}.state remains PENDING"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: section_grid_point_slot_semantics
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_GRID_CONFLICT]"
        distinguishing_aspect: |
          Interval semantics: discrete point-slot occupation on the period grid
          — two sections collide iff they share the SAME period integer for the
          same teacher or room; ADJACENT periods (p and p+1) do NOT collide.
          Resource entities: Teacher and Room.
        test_recipe:
          setup:
            - "Term T12 in BUILDING; DRAFT sections sec_a (BIO-101) and sec_b (CHE-101); teacher t_grid qualified for both; rooms rm_grid, rm_grid2."
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Fifteen", max_caseload: 100 }
              as: Administrator
              captures: { c15: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2037-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25, singleton_section_cap: 2, change_request_max_per_student: 3 }
              as: Administrator
              captures: { term12: "$.data.id" }
