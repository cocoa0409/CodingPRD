        distinguishing_aspect: "DRAFT has no dispose edge — only file does — so disposing a DRAFT inspection answers ERR_INSPECTION_NOT_FILED at 409 and the element's next_professional_inspection_due_on stays at its original 2027-06-30."
        test_recipe:
          setup:
