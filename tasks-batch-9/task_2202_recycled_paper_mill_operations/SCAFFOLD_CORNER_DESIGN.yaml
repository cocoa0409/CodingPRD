              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po1_id: "$.data.id", po1_version: "$.data.version" }
            - call: "POST /fiber-purchase-orders/${po1_id}/price"
              payload: { expected_purchase_order_version: "${po1_version}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-purchase-orders/${po1_id}/confirm"
              payload: {}
              as: Supplier
              as_user_id: "${supplier_id}"
            - call: "POST /fiber-purchase-orders/${po1_id}/receipts"
              payload: { truck_reference: "TRK-0001", sublots: [ { sublot_no: 1, gross_tons: 30.000, tare_tons: 8.000, moisture_pct: 10.00, contamination_pct: 5.00 } ] }
              as: QualityLab
              as_user_id: "lab-a"
              captures: { receipt_1: "$.data.id" }
            - call: "POST /fiber-purchase-orders/${po1_id}/receipts"
              payload: { truck_reference: "TRK-0002", sublots: [ { sublot_no: 1, gross_tons: 30.000, tare_tons: 8.000, moisture_pct: 10.00, contamination_pct: 5.00 } ] }
              as: QualityLab
              as_user_id: "lab-a"
              captures: { receipt_2: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
