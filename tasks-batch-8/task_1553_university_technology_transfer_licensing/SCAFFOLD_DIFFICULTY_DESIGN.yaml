  - rule_id: boundary_precision_check
    instances:
      - name: tier_cap_exact_boundary
        grounds:
          - calculations.tiered_earned_royalty
        distinguishing_aspect: |
          Metric: cumulative sales cents vs TIER1_SALES_CAP_CENTS, via the
          accept endpoint. cumulative_before == cap exactly puts the ENTIRE
          next report at tier 2 (rate halves); sales landing exactly AT the
          cap still price at tier 1.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED; NON_EXCLUSIVE license ACTIVE rate 500bp minimum 0"
            - "R1 sales exactly 100000000 (== cap) accepted -> all tier 1"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
