  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_event_version_rejects_the_second_lot_add
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lot-add-stale-event]
          - validations[priority=32]
          - errors[ERR_STALE_EVENT_VERSION]
          - endpoints[POST /auction-events/{id}/lots]
        distinguishing_aspect: "Every successful lot add consumes the parent event version, so the roster builder that read the event once and adds two lots is refused on the second add with ERR_STALE_EVENT_VERSION (412); re-reading the event and replaying the same body succeeds, and the version advances by exactly one per accepted add."
        test_recipe:
          setup:
            - "One SCHEDULED CA-ALAMEDA event 17:00..19:00 at version 1 and two DISCLOSURE_READY VACANT / CLEAR listings."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "OCC Event Bank", seller_type: "BANK", contact_email: "o@occevent.example", settlement_account_ref: "ACH-OCCE" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Occevent Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_a: $.data.id }
            - call: "POST /asset-listings/${listing_a}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "2 Occevent Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_b: $.data.id }
            - call: "POST /asset-listings/${listing_b}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "OCC Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v1: $.data.version }
          trigger:
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_a}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v1}" }
              as: AuctionOps
              captures: { lot_a: $.data.id }
            - call: "GET /auction-events/${event_id}"
              payload: {}
              as: AuctionOps
              captures: { ev_v2: $.data.version, count_1: $.data.lot_count }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_b}", lot_number: 2, lot_window_start_at: "2026-09-15T18:00:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v1}" }
              as: AuctionOps
              captures: { err_id: $.data.error_id }
            - call: "GET /auction-events/${event_id}"
              payload: {}
              as: AuctionOps
              captures: { ev_v_after_reject: $.data.version, count_after_reject: $.data.lot_count }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_b}", lot_number: 2, lot_window_start_at: "2026-09-15T18:00:00Z", lot_window_end_at: "2026-09-15T19:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v2}" }
              as: AuctionOps
              captures: { lot_b: $.data.id }
            - call: "GET /auction-events/${event_id}"
              payload: {}
              as: AuctionOps
              captures: { ev_v3: $.data.version, count_2: $.data.lot_count }
          assert:
            - "${ev_v1} == 1 and ${ev_v2} == 2 with ${count_1} == 1"
            - "Third trigger: HTTP 412 and ${err_id} == ERR_STALE_EVENT_VERSION"
            - "${ev_v_after_reject} == 2 and ${count_after_reject} == 1 (a refused add neither creates a lot nor bumps the version)"
            - "AssetListing.${listing_b}.listing_status == DISCLOSURE_READY immediately after the refusal"
            - "Fifth trigger: HTTP 201 with the identical body once ${ev_v2} is supplied"
            - "${ev_v3} == 3 and ${count_2} == 2; AssetListing.${listing_b}.listing_status == LISTED"

      - name: lot_version_advances_by_one_per_accepted_reserve_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reserve-price-stale-lot]
          - validations[priority=33]
          - endpoints[PATCH /auction-lots/{id}/reserve-price]
        distinguishing_aspect: "The lot's OCC counter is monotone and single-step: two reserve writes each supplied with the freshly read version both succeed and take the version 1 -> 2 -> 3, and only the version that has been consumed is rejected — the accepted write is the one carrying the value returned by the previous response."
        test_recipe:
          setup:
            - "A SCHEDULED CA-ALAMEDA event with one bid-free lot at reserve 20000000 and version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "OCC Lot Bank", seller_type: "BANK", contact_email: "o@occlot.example", settlement_account_ref: "ACH-OCCL" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /asset-listings"
              payload: { seller_id: "${seller_id}", street_address: "1 Occlot Rd", city: "Oakland", county_code: "CA-ALAMEDA", state_code: "CA", estimated_value_cents: 26000000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /asset-listings/${listing_id}/disclosures"
              payload: { occupancy_status: "VACANT", title_condition: "CLEAR" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /auction-events"
              payload: { title: "OCC Lot Event", county_code: "CA-ALAMEDA", starts_at: "2026-09-15T17:00:00Z", ends_at: "2026-09-15T19:00:00Z" }
              as: AuctionOps
              captures: { event_id: $.data.id, ev_v: $.data.version }
            - call: "POST /auction-events/${event_id}/lots"
              payload: { asset_listing_id: "${listing_id}", lot_number: 1, lot_window_start_at: "2026-09-15T17:00:00Z", lot_window_end_at: "2026-09-15T18:00:00Z", opening_bid_cents: 20000000, reserve_price_cents: 20000000, expected_auction_event_version: "${ev_v}" }
              as: AuctionOps
              captures: { lot_id: $.data.id, lot_v1: $.data.version, dep_1: $.data.required_deposit_cents }
          trigger:
            - call: "PATCH /auction-lots/${lot_id}/reserve-price"
              payload: { reserve_price_cents: 22000000, expected_auction_lot_version: "${lot_v1}" }
              as: AuctionOps
              captures: { lot_v2: $.data.version, reserve_2: $.data.reserve_price_cents, dep_2: $.data.required_deposit_cents }
            - call: "PATCH /auction-lots/${lot_id}/reserve-price"
              payload: { reserve_price_cents: 24000000, expected_auction_lot_version: "${lot_v2}" }
              as: AuctionOps
              captures: { lot_v3: $.data.version, reserve_3: $.data.reserve_price_cents }
            - call: "PATCH /auction-lots/${lot_id}/reserve-price"
              payload: { reserve_price_cents: 25000000, expected_auction_lot_version: "${lot_v2}" }
              as: AuctionOps
              captures: { err_id: $.data.error_id }
            - call: "GET /auction-lots/${lot_id}"
              payload: {}
              as: AuctionOps
              captures: { final_v: $.data.version, final_reserve: $.data.reserve_price_cents }
          assert:
            - "${lot_v1} == 1, ${lot_v2} == 2 and ${lot_v3} == 3 (exactly one increment per accepted write)"
            - "${reserve_2} == 22000000 and ${reserve_3} == 24000000"
            - "${dep_1} == 1000000 and ${dep_2} == 1000000 (required_deposit_cents is fixed at admission from the opening bid, not re-derived from the reserve)"
            - "Third trigger: HTTP 412 and ${err_id} == ERR_STALE_LOT_VERSION"
            - "${final_v} == 3 and ${final_reserve} == 24000000"

      - name: county_postponement_propagates_through_every_dependent_row
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TrusteeSale.PENDING_to_POSTPONED
          - state_machines.AuctionEvent.LIVE_to_POSTPONED
          - state_machines.AuctionLot.OPEN_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / postponement_cascades_sale_event_lot_hold_ledger
          rationale: "The named §1.8 instance already walks the full four-hop cascade from a single county postponement call and asserts every downstream row (event, lots, bids, holds and the bidder's ledger) in the same request."

