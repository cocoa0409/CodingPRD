      - name: unknown_child_record_ids_return_the_generic_resource_not_found
        claim_type: not_found
        grounds:
          - validations[8]
          - validations[7]
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The catalog splits not-found into a specific family and a generic one: an unknown lease id answers ERR_LEASE_NOT_FOUND while unknown Appraisal, RentInvoice, ComplianceCase, SharedSpaceBooking and ParkingAllocation ids all answer the single generic ERR_RESOURCE_NOT_FOUND, and every one of them is a 404 rather than a 422."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite, so the store is non-empty and the 404s are not vacuous."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { e3_b_id: $.data.id }
            - call: "POST /buildings/${e3_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { e3_s_id: $.data.id }
          trigger:
            - call: "POST /rent-invoices/00000000-0000-4000-8000-000000000901/payments"
              payload: { payment_amount: 100.00 }
              as: PropertyManager
            - call: "POST /appraisals/00000000-0000-4000-8000-000000000902/decision"
              payload: { action: "QUALIFY", decision_reason: "Nothing to qualify" }
              as: ComplianceOfficer
            - call: "GET /shared-space-bookings/00000000-0000-4000-8000-000000000903"
              payload: {}
              as: LeasingAgent
            - call: "POST /parking-allocations/00000000-0000-4000-8000-000000000904/revoke"
              payload: { revocation_note: "Nothing to revoke" }
              as: PropertyManager
            - call: "POST /compliance-cases/00000000-0000-4000-8000-000000000905/transitions"
              payload: { action: "REMEDIATION_PLAN", remediation_summary: "Nothing to plan" }
              as: ComplianceOfficer
            - call: "GET /leases/00000000-0000-4000-8000-000000000906"
              payload: {}
              as: LeasingAgent
            - call: "GET /suites/00000000-0000-4000-8000-000000000907"
              payload: {}
              as: LeasingAgent
          assert:
            - "The payment, the appraisal decision, the booking read, the allocation revoke and the case transition all return 404 with data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "GET /leases/00000000-0000-4000-8000-000000000906 returns 404 with data.error_id == 'ERR_LEASE_NOT_FOUND', NOT the generic code"
            - "GET /suites/00000000-0000-4000-8000-000000000907 returns 404 with data.error_id == 'ERR_SUITE_NOT_FOUND'"
            - "No 422 is returned anywhere: existence at priorities 4-8 is settled before any body or state check"

      - name: ti_line_item_refused_when_the_landlord_share_would_overdraw_the_allowance
        claim_type: conditional_action
        grounds:
          - endpoints[POST /ti-projects/{id}/line-items]
          - validations[44]
          - calculations.ti_cost_share
        distinguishing_aspect: "The guard is on the LANDLORD share, not the gross cost: a 150000.00 line lands against a 100000.00 allowance because only 90000.00 is the landlord's, and the next line is refused at a 20000.00 gross cost (12000.00 landlord) yet admitted at 16000.00 (9600.00 landlord) — a gross-cost test would reject both."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and a non-physician-owned INDEPENDENT_PRACTICE tenant on a DRAFT lease."
            - "One PROCEDURE-target TI project with authorized_allowance_total 100000.00 and landlord_share_pct 0.60."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { e4_b_id: $.data.id }
            - call: "POST /buildings/${e4_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 400, medical_gas_available: true }
              as: PortfolioAdmin
              captures: { e4_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568511" }
              as: PortfolioAdmin
              captures: { e4_t_id: $.data.id }
            - call: "POST /leases"
              payload: { building_id: "${e4_b_id}", suite_id: "${e4_s_id}", tenant_id: "${e4_t_id}", lease_type: "DIRECT", term_start: "2026-11-01", term_end: "2029-10-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { e4_l_id: $.data.id }
            - call: "POST /leases/${e4_l_id}/ti-projects"
              payload: { suite_id: "${e4_s_id}", target_suite_class: "PROCEDURE", power_amps_requested: 120, medical_gas_requested: false, authorized_allowance_total: 100000.00, landlord_share_pct: 0.60 }
              as: LeasingAgent
              captures: { e4_p_id: $.data.id, e4_p_v1: $.data.version }
          trigger:
            - call: "POST /ti-projects/${e4_p_id}/line-items"
              payload: { expected_ti_project_version: "${e4_p_v1}", description: "Procedure room build-out, shell to finish", category: "FINISHES", cost_amount: 150000.00 }
              as: LeasingAgent
              captures: { e4_li1_id: $.data.id }
            - call: "GET /ti-projects/${e4_p_id}"
              payload: {}
              as: LeasingAgent
              captures: { e4_p_v2: $.data.version }
            - call: "POST /ti-projects/${e4_p_id}/line-items"
              payload: { expected_ti_project_version: "${e4_p_v2}", description: "Medical gas rough-in", category: "MEDICAL_GAS", cost_amount: 20000.00 }
              as: LeasingAgent
            - call: "POST /ti-projects/${e4_p_id}/line-items"
              payload: { expected_ti_project_version: "${e4_p_v2}", description: "Medical gas rough-in, value engineered", category: "MEDICAL_GAS", cost_amount: 16000.00 }
              as: LeasingAgent
              captures: { e4_li2_id: $.data.id }
            - call: "GET /ti-projects/${e4_p_id}/line-items"
              payload: {}
              as: LeasingAgent
          assert:
            - "The 150000.00 line returns 201 as TILineItem.${e4_li1_id} with effective_share_pct == 0.60, landlord_share_amount == 90000.00 and tenant_share_amount == 60000.00"
            - "TenantImprovementProject.${e4_p_id}.allowance_remaining == 10000.00 after the first line"
            - "The 20000.00 line returns 422 with data.error_id == 'ERR_TI_ALLOWANCE_EXCEEDED' — its 12000.00 landlord share would drive allowance_remaining to -2000.00"
            - "The 16000.00 line returns 201 as TILineItem.${e4_li2_id} with landlord_share_amount == 9600.00 and sequence_no == 2"
            - "TenantImprovementProject.${e4_p_id}: line_item_count == 2, landlord_committed_amount == 99600.00, tenant_committed_amount == 66400.00, allowance_remaining == 400.00"
            - "GET /ti-projects/${e4_p_id}/line-items returns meta.total_count == 2 — the refusal persisted nothing and did not consume a sequence_no"

