  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_offer_counter_cycle_hits_round_cap
        grounds:
          - state_machines.TransferAgreement.OFFERED_to_COUNTERED
          - state_machines.TransferAgreement.COUNTERED_to_OFFERED
          - entities.TransferAgreement.fields.round_number
          - entities.TransferAgreement.fields.last_action_institution_id
          - validations[priority=86]
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
        distinguishing_aspect: |
          TransferAgreement is genuinely cyclic: OFFERED -> COUNTERED -> OFFERED can be traversed
          repeatedly with alternating actors, and only round_number reaching
          MAX_NEGOTIATION_ROUNDS 4 terminates the loop, so the fifth term-changing action is
          refused with ERR_NEGOTIATION_ROUND_LIMIT while the agreement stays COUNTERED.
        test_recipe:
          setup:
            - "Clock left at its 2026-08-01T00:00:00Z default."
            - "Base fixture through an endorsed PEDIGREE_ONLY BREED_WITH recommendation on M1 x F1."
            - "A DRAFT agreement exists with transport_cost_share_pct 51.0 and round_number 0."
            - "Four term-changing actions are then taken, alternating sender and receiver."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
