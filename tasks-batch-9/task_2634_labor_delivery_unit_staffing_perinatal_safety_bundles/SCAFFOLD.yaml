    input: []
    input_types: {}
    output: EncounterCoverageSummary
    output_fields: { encounter_id: "string", labor_phase: "enum", staffing_state: "enum", acuity_tier: "enum", acuity_tier_reason: "string — the highest-firing clause of calc encounter_required_coverage_units step 1 (GESTATION_OR_PRESENTATION | PHASE_FLOOR | STAGE_1_BUNDLE | CATEGORY_II_UNRESOLVED | STAGE_2_OR_3_BUNDLE | MAGNESIUM | CATEGORY_III_UNRESOLVED | CESAREAN_IN_PROGRESS | BASELINE)", one_to_one_required: "boolean", required_coverage_units: "number 1dp", assigned_coverage_units: "number 1dp", deficit_units: "number 1dp — max(0, required - assigned)", magnesium_infusion_active: "boolean", review_required: "boolean", active_assignments: "array of { care_assignment_id, shift_assignment_id, staff_id, coverage_mode, acuity_units_consumed }", latest_assessment_id: "string, null when the encounter has no assessment", latest_assessment_category: "enum, null when none", latest_assessment_escalation_status: "enum, null when none", support_person_allowance: "integer — calc support_person_occupancy output", support_persons_checked_in: "integer" }
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND]

  - method: POST
    path: "/labor-encounters/{encounterId}/assign-bed"
    description: "Attaches an AVAILABLE LDR bed to a walk-in encounter (Bed AVAILABLE -> OCCUPIED, encounter.bed_id set). Required before the ANTEPARTUM -> LATENT advance; an encounter that already occupies a bed is refused."
    roles: [ChargeNurse]
    code: 200
    input: [bed_id]
    input_types: { bed_id: "string, required — FK -> Bed.id, must be bed_type LDR and status AVAILABLE" }
    output: LaborEncounter
    validation_priorities: [1, 2, 3, 4, 5, 7, 8.07, 13.3]
    transitions: ["Bed.status AVAILABLE -> OCCUPIED (current_encounter_id := encounter.id)"]
    side_effects: ["Recompute calc unit_posture_derivation (consuming the last AVAILABLE LDR bed raises DIVERT); increments encounter.version, bed.version and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_BED_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_ENCOUNTER_ALREADY_IN_BED, ERR_BED_TYPE_NOT_ELIGIBLE]

  - method: POST
    path: "/labor-encounters/{encounterId}/advance-phase"
    description: "Single trigger for every forward step of the labor_phase axis (LATENT, ACTIVE_FIRST_STAGE, SECOND_STAGE, THIRD_STAGE_DELIVERED, POSTPARTUM_RECOVERY). Each target has its own precondition set: coverage floor from the staffing_state axis, fetal-assessment freshness (30 min to ACTIVE_FIRST_STAGE, 15 min to SECOND_STAGE, both inclusive), cesarean readiness for SECOND_STAGE, and delivery-mode coherence for THIRD_STAGE_DELIVERED. The SECOND_STAGE step is the five-hop cascade (re-price -> shift over capacity -> sibling encounters breach -> posture INDUCTION_FROZEN -> CAPACITY_HELD bookings bumped and beds released); the POSTPARTUM_RECOVERY step releases the LDR bed to TURNOVER."
    roles: [ChargeNurse, ObstetricianAttending]
    code: 200
    input: [target_phase, "delivery_mode?", "episiotomy_performed?"]
    input_types: { target_phase: "enum LATENT|ACTIVE_FIRST_STAGE|SECOND_STAGE|THIRD_STAGE_DELIVERED|POSTPARTUM_RECOVERY, required", delivery_mode: "enum SPONTANEOUS_VAGINAL|OPERATIVE_VAGINAL|CESAREAN_PRIMARY|CESAREAN_REPEAT, required only when target_phase == THIRD_STAGE_DELIVERED", episiotomy_performed: "boolean, optional (default false), accepted only when target_phase == THIRD_STAGE_DELIVERED" }
    output: LaborEncounter
    validation_priorities: [1, 2, 3, 5, 8, 8.02, 8.03, 9, 11.3, 11.4, 11.7, 13.3]
    transitions:
      - "LaborEncounter.labor_phase ANTEPARTUM -> LATENT"
      - "LaborEncounter.labor_phase LATENT -> ACTIVE_FIRST_STAGE"
      - "LaborEncounter.labor_phase ACTIVE_FIRST_STAGE -> SECOND_STAGE"
      - "LaborEncounter.labor_phase SECOND_STAGE -> THIRD_STAGE_DELIVERED"
      - "LaborEncounter.labor_phase THIRD_STAGE_DELIVERED -> POSTPARTUM_RECOVERY"
      - "CASCADE: LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH on sibling encounters of an over-capacity shift, oldest CareAssignment.created_at ASC first"
      - "CASCADE: InductionBooking.status CAPACITY_HELD -> BUMPED with Bed HELD -> AVAILABLE when the posture reaches INDUCTION_FROZEN or DIVERT"
      - "Bed.status OCCUPIED -> TURNOVER on the POSTPARTUM_RECOVERY step"
      - "QualityMeasureSnapshot rows in DRAFT covering delivery_recorded_at are recomputed in place (status unchanged)"
    side_effects:
      - "calc encounter_required_coverage_units, calc care_assignment_unit_debit (re-price in place: credit old, debit new), calc unit_posture_derivation, calc support_person_occupancy re-evaluated, calc quality_measure_rates on DRAFT snapshots covering delivery_recorded_at"
      - "On THIRD_STAGE_DELIVERED: delivery_mode := payload, episiotomy_performed := payload, delivery_recorded_at := clock_now"
      - "increments encounter.version, unit.version, and the version of every re-priced assignment, breached sibling encounter, bumped booking, released bed and recomputed DRAFT snapshot"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_UNIT_POSTURE_BLOCKS_OPERATION, ERR_ENCOUNTER_COVERAGE_INSUFFICIENT, ERR_ONE_TO_ONE_COVERAGE_REQUIRED, ERR_DELIVERY_MODE_REQUIRED, ERR_FETAL_ASSESSMENT_STALE, ERR_FETAL_ESCALATION_UNRESOLVED, ERR_FETAL_CATEGORY_BLOCKS_PHASE, ERR_CESAREAN_READINESS_NOT_MET, ERR_CESAREAN_EVENT_IN_PROGRESS, ERR_CESAREAN_EVENT_NOT_DELIVERED, ERR_DELIVERY_MODE_CONFLICTS_HISTORY, ERR_EPISIOTOMY_MODE_CONFLICT, ERR_ENCOUNTER_BED_NOT_ASSIGNED]

  - method: POST
    path: "/labor-encounters/{encounterId}/discharge"
    description: "Closes a POSTPARTUM_RECOVERY encounter (labor_phase -> DISCHARGED). Blocking children are checked in exactly this order: open newborn reviews, non-terminal bundle activations, still-present support passes, then a staffing_state that is not RELEASED. A posture improvement here does NOT promote waiting bookings — promotion happens only inside the capacity sweep."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: LaborEncounter
    validation_priorities: [1, 2, 3, 8, 8.04]
    transitions:
      - "LaborEncounter.labor_phase POSTPARTUM_RECOVERY -> DISCHARGED"
      - "LaborEncounter.staffing_state {UNASSIGNED|RATIO_COVERED|ONE_TO_ONE_COVERED|COVERAGE_BREACH} -> RELEASED"
      - "Bed.status OCCUPIED -> TURNOVER when bed_id is still non-null"
    side_effects: ["required_coverage_units := 0.0; recompute calc unit_posture_derivation; increments encounter.version, unit.version and bed.version when a bed was released"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_NEWBORN_REVIEW_OPEN, ERR_BUNDLE_NOT_CLOSED, ERR_SUPPORT_PASS_STILL_PRESENT, ERR_CARE_ASSIGNMENT_STILL_ACTIVE]

  - method: POST
    path: "/labor-encounters/{encounterId}/transfer-out"
    description: "Compensating exit from ANTEPARTUM, LATENT or ACTIVE_FIRST_STAGE (labor_phase -> TRANSFERRED_OUT). Releases every ACTIVE CareAssignment with exact credit-back (invariant acuity_load_conservation), rescinds pre-stage-2 bundles and voids their PENDING items, resolves every non-terminal escalation chain, DECREMENTS unit.escalation_breach_count by 1 per TIMED_OUT_BREACH assessment (the breach follows the patient), revokes every support pass and sends the bed to TURNOVER."
    roles: [ObstetricianAttending]
    code: 200
    input: []
    input_types: {}
    output: LaborEncounter
    validation_priorities: [1, 2, 3, 8, 8.04]
    transitions:
      - "LaborEncounter.labor_phase {ANTEPARTUM|LATENT|ACTIVE_FIRST_STAGE} -> TRANSFERRED_OUT"
      - "LaborEncounter.staffing_state {UNASSIGNED|RATIO_COVERED|ONE_TO_ONE_COVERED|COVERAGE_BREACH} -> RELEASED"
      - "CareAssignment.status ACTIVE -> RELEASED (released_at := clock_now)"
      - "SafetyBundleActivation.status {ACTIVATED|STAGE_1_IN_PROGRESS} -> RESCINDED (rescind_reason := 'TRANSFER_OUT')"
      - "BundleChecklistItem.status PENDING -> NOT_APPLICABLE"
      - "FetalMonitoringAssessment.escalation_status non-terminal -> RESOLVED"
      - "SupportPersonPass.status {ISSUED|CHECKED_IN|CHECKED_OUT} -> REVOKED"
      - "Bed.status OCCUPIED -> TURNOVER"
    side_effects: ["calc care_assignment_unit_debit credit-back, calc encounter_required_coverage_units (required := 0.0), calc unit_posture_derivation; unit.escalation_breach_count -= 1 per TIMED_OUT_BREACH assessment on this encounter; increments encounter.version, unit.version, bed.version and every touched child version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_CESAREAN_EVENT_IN_PROGRESS, ERR_BUNDLE_STAGE_BLOCKS_TRANSFER]

  # -------------------------------------------------------- care assignments --
  - method: POST
    path: "/care-assignments"
    description: "Junction create joining a ShiftAssignment to a LaborEncounter and driving the staffing_state axis. RATIO_SHARED debits ACUITY_UNITS[tier] * PHASE_MULTIPLIER[phase]; ONE_TO_ONE debits the shift's whole capacity_units_effective and SUPERSEDES any prior ONE_TO_ONE row (predecessor -> SUPERSEDED with superseded_by_assignment_id, exact credit-back) while RELEASING any ACTIVE RATIO_SHARED row. Carries the OCC guard expected_encounter_version (concurrency rule care-assignment-create-stale-encounter). EDGE CONDITION: a remediating debit that leaves the encounter still short SUCCEEDS with 201 and leaves staffing_state at COVERAGE_BREACH / UNASSIGNED — no error."
    roles: [ChargeNurse]
    code: 201
    input: [encounter_id, shift_assignment_id, coverage_mode, expected_encounter_version]
    input_types: { encounter_id: "string, required — FK -> LaborEncounter.id", shift_assignment_id: "string, required — FK -> ShiftAssignment.id, must be status ACTIVE and cover clock_now", coverage_mode: "enum RATIO_SHARED|ONE_TO_ONE, required", expected_encounter_version: "integer, required — must equal encounter.version" }
    output: CareAssignment
    validation_priorities: [1, 2, 4, 5, 6, 7, 8.01, 8.08, 11.1, 11.2, 15]
    transitions:
      - "CareAssignment.status := ACTIVE (initial state); staff_id denormalized from shift.staff_id"
      - "LaborEncounter.staffing_state UNASSIGNED -> RATIO_COVERED (only once assigned >= required)"
      - "LaborEncounter.staffing_state {UNASSIGNED|RATIO_COVERED|COVERAGE_BREACH} -> ONE_TO_ONE_COVERED"
      - "LaborEncounter.staffing_state COVERAGE_BREACH -> {RATIO_COVERED|ONE_TO_ONE_COVERED} (remediation)"
      - "Predecessor CareAssignment.status ACTIVE -> SUPERSEDED (ONE_TO_ONE handoff) or ACTIVE -> RELEASED (displaced RATIO_SHARED)"
    side_effects:
      - "calc care_assignment_unit_debit -> acuity_units_consumed; shift.assigned_acuity_load_units += that amount and the superseded/released predecessor's amount is credited back first (invariant acuity_load_conservation holds at every intermediate step)"
      - "calc staff_capacity_units re-run (a new TIER_IV assignment applies TIER_IV_FOCUS_PENALTY_UNITS to the staff member's capacity_units), calc unit_posture_derivation"
      - "increments assignment.version, encounter.version, shift.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_SHIFT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_STALE_ENCOUNTER_VERSION, ERR_CROSS_UNIT_REFERENCE, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_SHIFT_NOT_ACTIVE, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_ROLE_SLOT_NOT_ELIGIBLE, ERR_MONITORING_CERT_INSUFFICIENT, ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE, ERR_ONE_TO_ONE_COVERAGE_REQUIRED, ERR_STAFF_ACUITY_CAPACITY_EXCEEDED]

  - method: GET
    path: "/care-assignments"
    description: "Filtered list providing reverse reachability for CareAssignment.encounter_id, CareAssignment.shift_assignment_id, CareAssignment.staff_id and the self-referential CareAssignment.superseded_by_assignment_id. Ordered created_at ASC — the same order the SECOND_STAGE cascade uses when breaching sibling encounters."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["encounter_id?", "shift_assignment_id?", "staff_id?", "coverage_mode?", "status?", "superseded_by_assignment_id?", "limit?", "offset?"]
    input_types: { encounter_id: "string, optional", shift_assignment_id: "string, optional", staff_id: "string, optional", coverage_mode: "enum RATIO_SHARED|ONE_TO_ONE, optional", status: "enum ACTIVE|RELEASED|SUPERSEDED, optional", superseded_by_assignment_id: "string, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: CareAssignment[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/care-assignments/{assignmentId}"
    description: "Reads one CareAssignment with its acuity_units_consumed (the re-priced value after any tier or phase change), released_at and superseded_by_assignment_id."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: CareAssignment
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CARE_ASSIGNMENT_NOT_FOUND]

  - method: POST
    path: "/care-assignments/{assignmentId}/release"
    description: "Releases an ACTIVE CareAssignment (status -> RELEASED, released_at := clock_now) and credits back exactly acuity_units_consumed. Releasing the last ACTIVE row drives the encounter to RELEASED when labor_phase IN {POSTPARTUM_RECOVERY, DISCHARGED, TRANSFERRED_OUT} and to COVERAGE_BREACH in any earlier phase — the breach is recorded and no error is raised."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: CareAssignment
    validation_priorities: [1, 2, 3, 8]
    transitions:
      - "CareAssignment.status ACTIVE -> RELEASED"
      - "LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH (earlier phases)"
      - "LaborEncounter.staffing_state {UNASSIGNED|RATIO_COVERED|ONE_TO_ONE_COVERED|COVERAGE_BREACH} -> RELEASED (post-delivery phases, last ACTIVE row)"
    side_effects: ["shift.assigned_acuity_load_units -= exactly acuity_units_consumed; calc staff_capacity_units (the TIER_IV focus penalty may lift), calc encounter_required_coverage_units, calc unit_posture_derivation; increments assignment.version, encounter.version, shift.version and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CARE_ASSIGNMENT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION]

  # ------------------------------------------------------ induction bookings --
  - method: POST
    path: "/induction-bookings"
    description: "Requests a scheduled induction (status REQUESTED, no bed, no bed-minutes committed). priority_class is derived immediately by calc induction_priority_class from indication_code and gestational_age_weeks (39-week boundary inclusive). requested_start_utc must be strictly in the future."
    roles: [PatientAccessCoordinator, ObstetricianAttending]
    code: 201
    input: [unit_id, patient_record_code, gestational_age_weeks, indication_code, requested_start_utc, "expected_labor_minutes?"]
    input_types: { unit_id: "string, required — FK -> ObstetricUnit.id, immutable", patient_record_code: "string 1..60, required", gestational_age_weeks: "integer 20..44, required", indication_code: "enum PREECLAMPSIA|POST_DATES_41W|FGR|PROM|GDM_CONTROLLED|ELECTIVE_NO_INDICATION, required", requested_start_utc: "datetime, required, must be > clock_now", expected_labor_minutes: "integer 60..2160, optional, default 720" }
    output: InductionBooking
    validation_priorities: [1, 2, 4, 5, 14.2]
    transitions: ["InductionBooking.status := REQUESTED (initial state)"]
    side_effects: ["calc induction_priority_class -> priority_class; bump_count := 0; projected_occupancy_minutes stays null until a hold freezes it; booking.version := 1"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_BOOKING_START_IN_PAST]
    note: "§1.4 GAP RESOLUTION — priority 4 (body-id existence) extends to this endpoint's unit_id, which is named in the body rather than the path."

  - method: GET
    path: "/induction-bookings"
    description: "Filtered list providing reverse reachability for InductionBooking.unit_id, InductionBooking.bed_id and InductionBooking.encounter_id. Ordered by the sweep's promotion key — PRIORITY_RANK[priority_class] ASC, then requested_start_utc ASC, then created_at ASC — so a test can read the promotion order before sweeping."
    roles: [PatientAccessCoordinator, ChargeNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["unit_id?", "bed_id?", "encounter_id?", "status?", "priority_class?", "requested_day?", "limit?", "offset?"]
    input_types: { unit_id: "string, optional", bed_id: "string, optional", encounter_id: "string, optional", status: "enum REQUESTED|CAPACITY_HELD|CONFIRMED|ADMITTED|BUMPED|CANCELLED|EXPIRED, optional", priority_class: "enum MEDICALLY_INDICATED|ELECTIVE_39_WEEK|PATIENT_REQUEST, optional", requested_day: "string YYYY-MM-DD, optional — filters on date(requested_start_utc)", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: InductionBooking[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/induction-bookings/{bookingId}"
    description: "Reads one InductionBooking with priority_class, bump_count, the frozen projected_occupancy_minutes, hold_expires_at and the bed/encounter pointers."
    roles: [PatientAccessCoordinator, ChargeNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: InductionBooking
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND]

  - method: POST
    path: "/induction-bookings/{bookingId}/hold-capacity"
    description: "Places a TTL-bounded capacity hold on a named LDR bed (REQUESTED -> CAPACITY_HELD, Bed AVAILABLE -> HELD, hold_expires_at := clock_now + HOLD_TTL_MINUTES 120). projected_occupancy_minutes is FROZEN here as expected_labor_minutes + unit.turnover_buffer_minutes and is the exact quantum later credited back on bump/cancel/expiry. Bed intervals are CLOSED with the frozen buffer on the existing side, so touching endpoints DO collide; a bed whose status is not AVAILABLE also fails with ERR_BED_TURNOVER_CONFLICT. Carries the OCC guard expected_unit_version (concurrency rule induction-hold-stale-unit)."
    roles: [PatientAccessCoordinator]
    code: 200
    input: [bed_id, expected_unit_version]
    input_types: { bed_id: "string, required — FK -> Bed.id, must be bed_type LDR", expected_unit_version: "integer, required — must equal unit.version" }
    output: InductionBooking
    validation_priorities: [1, 2, 3, 4, 5, 6, 8, 8.02, 8.07, 11.8, 13.3, 15]
    transitions:
      - "InductionBooking.status REQUESTED -> CAPACITY_HELD"
      - "Bed.status AVAILABLE -> HELD (held_booking_id := booking.id)"
    side_effects:
      - "calc induction_capacity_projection -> projected_occupancy_minutes (frozen); unit.held_bed_minutes_by_day[date(requested_start_utc)] += that value (invariant induction_bed_minute_conservation)"
      - "increments booking.version, bed.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND, ERR_BED_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_STALE_UNIT_VERSION, ERR_INVALID_STATE_TRANSITION, ERR_UNIT_POSTURE_BLOCKS_OPERATION, ERR_BED_TYPE_NOT_ELIGIBLE, ERR_BED_TURNOVER_CONFLICT, ERR_ELECTIVE_INDUCTION_GESTATIONAL_AGE, ERR_INDUCTION_CAPACITY_EXCEEDED]

  - method: POST
    path: "/induction-bookings/{bookingId}/confirm"
    description: "Converts a live hold into a committed booking (CAPACITY_HELD -> CONFIRMED): the frozen projected_occupancy_minutes moves from held_bed_minutes_by_day to committed_bed_minutes_by_day (net-zero), hold_expires_at is cleared and the Bed stays HELD. Requires a non-expired hold, cesarean readiness IN {READY, DEGRADED}, a posture IN {OPEN, RATIO_STRAINED} and, for ELECTIVE_39_WEEK, gestational_age_weeks >= 39."
    roles: [ObstetricianAttending]
    code: 200
    input: []
    input_types: {}
    output: InductionBooking
    validation_priorities: [1, 2, 3, 8, 8.02, 8.09, 11.4, 11.8, 15]
    transitions: ["InductionBooking.status CAPACITY_HELD -> CONFIRMED"]
    side_effects: ["calc induction_capacity_projection re-tested against the day budget; held_bed_minutes_by_day[date] -= projected_occupancy_minutes and committed_bed_minutes_by_day[date] += the same value; increments booking.version and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_UNIT_POSTURE_BLOCKS_OPERATION, ERR_INDUCTION_HOLD_EXPIRED, ERR_CESAREAN_READINESS_NOT_MET, ERR_ELECTIVE_INDUCTION_GESTATIONAL_AGE, ERR_INDUCTION_CAPACITY_EXCEEDED]

  - method: POST
    path: "/induction-bookings/{bookingId}/admit"
    description: "Admits a CONFIRMED booking (-> ADMITTED) and MINTS the LaborEncounter: labor_phase ANTEPARTUM, staffing_state UNASSIGNED, source_booking_id := booking.id, admitted_at := clock_now, patient_record_code and gestational_age_weeks copied from the booking. The held Bed moves HELD -> OCCUPIED. Allowed from clock_now >= requested_start_utc - ADMIT_EARLY_GRACE_MINUTES (30), inclusive."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: InductionBooking
    output_note: "The minted encounter is discoverable via booking.encounter_id, GET /labor-encounters?source_booking_id=..., or GET /beds?held_booking_id=... -> current_encounter_id"
    validation_priorities: [1, 2, 3, 8, 8.02, 8.07, 13.1, 14.2]
    transitions:
      - "InductionBooking.status CONFIRMED -> ADMITTED"
      - "Bed.status HELD -> OCCUPIED (held_booking_id := null, current_encounter_id := minted encounter id)"
      - "LaborEncounter.labor_phase := ANTEPARTUM and staffing_state := UNASSIGNED (both initial states, cascade-created)"
    side_effects:
      - "committed_bed_minutes_by_day keeps the booking's minutes (status CONFIRMED -> ADMITTED both count); held map unchanged"
      - "calc encounter_required_coverage_units on the minted encounter; calc unit_posture_derivation; increments booking.version, bed.version, unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_UNIT_POSTURE_BLOCKS_OPERATION, ERR_BED_HOLD_MISMATCH, ERR_DUPLICATE_PATIENT_RECORD_CODE, ERR_INDUCTION_ADMIT_TOO_EARLY]

  - method: POST
    path: "/induction-bookings/{bookingId}/bump"
    description: "Manual bump of a CAPACITY_HELD or CONFIRMED booking (-> BUMPED, bump_count += 1). Releases the bed (HELD -> AVAILABLE) and decrements held_bed_minutes_by_day (from CAPACITY_HELD) or committed_bed_minutes_by_day (from CONFIRMED) by exactly projected_occupancy_minutes. Refused at bump_count >= BUMP_ESCALATION_LIMIT (2) and for priority_class == MEDICALLY_INDICATED. The same edge fires automatically inside advance-phase, POST /bundle-activations, drill invalidate and the capacity sweep."
    roles: [ChargeNurse, PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: InductionBooking
    validation_priorities: [1, 2, 3, 8, 8.07, 8.09]
    transitions:
      - "InductionBooking.status {CAPACITY_HELD|CONFIRMED} -> BUMPED"
      - "Bed.status HELD -> AVAILABLE (held_booking_id := null)"
    side_effects: ["bed_id := null; hold_expires_at := null; the day's held or committed map decreases by exactly projected_occupancy_minutes (invariant induction_bed_minute_conservation); calc unit_posture_derivation; increments booking.version, bed.version and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_BED_HOLD_MISMATCH, ERR_INDUCTION_BUMP_LIMIT_REACHED, ERR_INDUCTION_NOT_BUMPABLE]

  - method: POST
    path: "/induction-bookings/{bookingId}/requeue"
    description: "Returns a BUMPED booking to REQUESTED so the next capacity sweep can promote it, re-deriving priority_class by calc induction_priority_class (bump_count >= BUMP_ESCALATION_LIMIT promotes it to MEDICALLY_INDICATED rank, which also makes it unbumpable). Refused once requested_start_utc <= clock_now; the sweep sends such bookings to EXPIRED instead."
    roles: [PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: InductionBooking
    validation_priorities: [1, 2, 3, 8, 8.09]
    transitions: ["InductionBooking.status BUMPED -> REQUESTED"]
    side_effects: ["calc induction_priority_class -> priority_class; no bed-minute movement (a BUMPED and a REQUESTED booking both contribute 0 to both maps); increments booking.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_INDUCTION_WINDOW_PASSED]

  - method: POST
    path: "/induction-bookings/{bookingId}/cancel"
    description: "Cancels a booking from REQUESTED, CAPACITY_HELD or CONFIRMED (-> CANCELLED), releasing any held bed and crediting back exactly projected_occupancy_minutes. An ADMITTED booking can never be cancelled."
    roles: [PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: InductionBooking
    validation_priorities: [1, 2, 3, 8, 8.09]
    transitions:
      - "InductionBooking.status {REQUESTED|CAPACITY_HELD|CONFIRMED} -> CANCELLED"
      - "Bed.status HELD -> AVAILABLE when a bed was held"
    side_effects: ["The day's held or committed map decreases by exactly projected_occupancy_minutes (invariant induction_bed_minute_conservation); calc unit_posture_derivation; increments booking.version, bed.version and unit.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_BOOKING_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_BED_HOLD_MISMATCH, ERR_INDUCTION_ALREADY_ADMITTED]

  # ------------------------------------------------------ safety bundles -----
  - method: POST
    path: "/bundle-activations"
    description: "Activates a perinatal safety bundle on an encounter (status ACTIVATED, activated_at := clock_now) and MINTS the full BundleChecklistItem template of calc bundle_checklist_template — items are never client-created. Objective-trigger gate: QBL_THRESHOLD needs quantitative_blood_loss_ml >= ACTIVATION_QBL_ML (1000), BP_THRESHOLD needs systolic_mmhg >= 160 OR diastolic_mmhg >= 110, CLINICIAN_JUDGMENT needs neither. At most one non-terminal activation per (encounter_id, bundle_type)."
    roles: [ObstetricianAttending, BedsideNurse]
    code: 201
    input: [encounter_id, bundle_type, activation_trigger, "quantitative_blood_loss_ml?", "systolic_mmhg?", "diastolic_mmhg?"]
    input_types: { encounter_id: "string, required — FK -> LaborEncounter.id, immutable", bundle_type: "enum OBSTETRIC_HEMORRHAGE|SEVERE_HYPERTENSION, required", activation_trigger: "enum QBL_THRESHOLD|BP_THRESHOLD|CLINICIAN_JUDGMENT, required", quantitative_blood_loss_ml: "integer >= 0, required when activation_trigger == QBL_THRESHOLD, must be null for SEVERE_HYPERTENSION", systolic_mmhg: "integer 60..300, required when activation_trigger == BP_THRESHOLD, must be null for OBSTETRIC_HEMORRHAGE", diastolic_mmhg: "integer 30..200, required when activation_trigger == BP_THRESHOLD, must be null for OBSTETRIC_HEMORRHAGE" }
    output: SafetyBundleActivation
    output_note: "The minted checklist items are returned by GET /bundle-activations/{activationId}/checklist-items — their only discovery channel"
    validation_priorities: [1, 2, 4, 5, 8.01, 8.06, 11.5]
    transitions:
      - "SafetyBundleActivation.status := ACTIVATED (initial state); unit_id denormalized from the encounter"
      - "BundleChecklistItem.status := PENDING for all four template rows (cascade-created)"
      - "CASCADE: LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH when the acuity re-price pushes the covering shift over capacity"
      - "CASCADE: InductionBooking.status CAPACITY_HELD -> BUMPED with Bed HELD -> AVAILABLE when the posture degrades to INDUCTION_FROZEN or DIVERT"
    side_effects:
      - "calc bundle_checklist_template -> step_code / step_sequence / stage_gate / required_within_minutes / due_at_activation_anchored for each item (due_at_sequence_anchored is set for step_sequence 1 only)"
      - "calc encounter_required_coverage_units, calc care_assignment_unit_debit re-price, calc unit_posture_derivation"
      - "increments encounter.version and unit.version; activation.version := 1"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_BUNDLE_ALREADY_ACTIVE, ERR_ACTIVATION_CRITERIA_NOT_MET]

  - method: GET
    path: "/bundle-activations"
    description: "Filtered list providing reverse reachability for SafetyBundleActivation.encounter_id and the denormalized unit_id. Ordered activated_at ASC, tie-break created_at ASC."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["encounter_id?", "unit_id?", "bundle_type?", "status?", "limit?", "offset?"]
    input_types: { encounter_id: "string, optional", unit_id: "string, optional", bundle_type: "enum OBSTETRIC_HEMORRHAGE|SEVERE_HYPERTENSION, optional", status: "enum ACTIVATED|STAGE_1_IN_PROGRESS|STAGE_2_ESCALATED|STAGE_3_MASSIVE_TRANSFUSION|CONTROLLED|DEBRIEF_PENDING|CLOSED|RESCINDED, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: SafetyBundleActivation[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/bundle-activations/{activationId}"
    description: "Reads one SafetyBundleActivation with highest_stage_reached, the three step counters, both scores (timeliness_score authoritative, sequence_adjusted_score advisory), rescind_reason and `version` (the value an OCC caller echoes as expected_activation_version)."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: SafetyBundleActivation
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND]

  - method: GET
    path: "/bundle-activations/{activationId}/checklist-items"
    description: "Reverse-reachability list for BundleChecklistItem.activation_id and, through the performed_by_staff_id? filter, for BundleChecklistItem.performed_by_staff_id. Ordered step_sequence ASC. Exposes BOTH due dates per item (due_at_activation_anchored authoritative, due_at_sequence_anchored advisory) plus minutes_from_activation."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["status?", "stage_gate?", "step_code?", "performed_by_staff_id?", "limit?", "offset?"]
    input_types: { status: "enum PENDING|COMPLETED|LATE_COMPLETED|MISSED|NOT_APPLICABLE, optional", stage_gate: "integer 1..3, optional", step_code: "enum QBL_MEASURE|UTEROTONIC_GIVEN|TYPE_AND_SCREEN|MTP_ACTIVATED|ANTIHYPERTENSIVE_GIVEN|MAGNESIUM_LOADED|REPEAT_BP|OB_AT_BEDSIDE, optional", performed_by_staff_id: "string, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: BundleChecklistItem[]
    validation_priorities: [1, 2, 3, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/bundle-activations/{activationId}/checklist-items/{itemId}"
    description: "Reads one BundleChecklistItem: status, completed_at, performed_by_staff_id, minutes_from_activation and both anchoring due dates — the pair that makes the dual-variant timeliness calculation observable per step."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: BundleChecklistItem
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_CHECKLIST_ITEM_NOT_FOUND]

  - method: GET
    path: "/bundle-activations/{activationId}/timeliness-report"
    description: "Computed read exposing BOTH variants of calc bundle_intervention_timeliness side by side: the authoritative activation_anchored score (the value stored in timeliness_score and the only one any gate consumes) and the advisory sequence_anchored score, with the per-item on-time/late classification under each anchoring. Both scores are null until the activation reaches CONTROLLED, and stay null forever on a RESCINDED activation."
    roles: [ChargeNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: BundleTimelinessReport
    output_fields: { activation_id: "string", bundle_type: "enum", status: "enum", highest_stage_reached: "integer", activated_at: "datetime", applicable_item_count: "integer — items with status != NOT_APPLICABLE (the denominator)", on_time_step_count: "integer — activation-anchored", late_step_count: "integer — activation-anchored", missed_step_count: "integer", timeliness_score: "number 2dp, null before CONTROLLED — variant activation_anchored (AUTHORITATIVE)", sequence_adjusted_score: "number 2dp, null before CONTROLLED — variant sequence_anchored (ADVISORY)", items: "array of { checklist_item_id, step_code, step_sequence, stage_gate, status, completed_at, minutes_from_activation, due_at_activation_anchored, due_at_sequence_anchored, on_time_activation_anchored, on_time_sequence_anchored }" }
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND]

  - method: POST
    path: "/bundle-activations/{activationId}/checklist-items/{itemId}/complete"
    description: "Documents one intervention step. The AUTHORITATIVE activation_anchored due date decides the landing state: completed_at <= due_at_activation_anchored (boundary instant counts as on time) -> COMPLETED, strictly after -> LATE_COMPLETED. The first completion on the activation also moves it ACTIVATED -> STAGE_1_IN_PROGRESS, and completing MAGNESIUM_LOADED on a SEVERE_HYPERTENSION bundle sets encounter.magnesium_infusion_active := true, forcing one-to-one coverage and its whole cascade."
    roles: [BedsideNurse, ChargeNurse, ObstetricianAttending]
    code: 200
    input: [completed_at, performed_by_staff_id]
    input_types: { completed_at: "datetime, required — must satisfy activation.activated_at <= completed_at <= clock_now", performed_by_staff_id: "string, required — FK -> StaffMember.id, must hold an ACTIVE CareAssignment on the encounter or an ACTIVE CHARGE/OR_STANDBY shift on the unit" }
    output: BundleChecklistItem
    validation_priorities: [1, 2, 3, 4, 5, 7, 8, 8.01, 8.05, 12, 14.1]
    transitions:
      - "BundleChecklistItem.status PENDING -> COMPLETED (completed_at <= due_at_activation_anchored)"
      - "BundleChecklistItem.status PENDING -> LATE_COMPLETED (completed_at > due_at_activation_anchored)"
      - "SafetyBundleActivation.status ACTIVATED -> STAGE_1_IN_PROGRESS on the first completion of a stage_gate == 1 item"
      - "CASCADE: LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH via the one-to-one re-price"
    side_effects:
      - "minutes_from_activation := floor((completed_at - activated_at)/60s); on_time_step_count or late_step_count += 1; the successor item's due_at_sequence_anchored recomputed from this completed_at (advisory only, never re-writes due_at_activation_anchored)"
      - "calc encounter_required_coverage_units (TIER_III floor on STAGE_1_IN_PROGRESS; magnesium -> one_to_one_required), calc care_assignment_unit_debit re-price, calc unit_posture_derivation"
      - "increments item.version, activation.version, encounter.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_CHECKLIST_ITEM_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_INVALID_STATE_TRANSITION, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_CHECKLIST_STAGE_NOT_REACHED, ERR_PERFORMER_NOT_ON_CASE, ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE]

  - method: POST
    path: "/bundle-activations/{activationId}/escalate-stage"
    description: "Escalates the bundle one stage: STAGE_1_IN_PROGRESS -> STAGE_2_ESCALATED (target_stage 2) or STAGE_2_ESCALATED -> STAGE_3_MASSIVE_TRANSFUSION (target_stage 3, OBSTETRIC_HEMORRHAGE only, QBL >= 2500, ACTIVE OR_STANDBY shift required). Stage 2 forces acuity TIER_IV plus mandatory one-to-one; stage 3 additionally MINTS a CATEGORY_1_CRASH EmergencyCesareanEvent and drives the unit to DIVERT, bumping every elective/patient-request hold and confirmation."
    roles: [ObstetricianAttending]
    code: 200
    input: [target_stage, "quantitative_blood_loss_ml?", "systolic_mmhg?", "diastolic_mmhg?"]
    input_types: { target_stage: "integer 2..3, required", quantitative_blood_loss_ml: "integer >= 0, required for OBSTETRIC_HEMORRHAGE (>= 1500 for stage 2, >= 2500 for stage 3)", systolic_mmhg: "integer 60..300, required for SEVERE_HYPERTENSION stage 2 unless diastolic_mmhg is supplied", diastolic_mmhg: "integer 30..200, required for SEVERE_HYPERTENSION stage 2 unless systolic_mmhg is supplied" }
    output: SafetyBundleActivation
    validation_priorities: [1, 2, 3, 5, 8, 8.05, 11.4, 11.5]
    transitions:
      - "SafetyBundleActivation.status STAGE_1_IN_PROGRESS -> STAGE_2_ESCALATED"
      - "SafetyBundleActivation.status STAGE_2_ESCALATED -> STAGE_3_MASSIVE_TRANSFUSION (branch A)"
      - "EmergencyCesareanEvent.status := DECISION_DECLARED (cascade-created on stage 3, triggering_activation_id := activation.id)"
      - "CASCADE: LaborEncounter.staffing_state -> COVERAGE_BREACH; InductionBooking.status {CAPACITY_HELD|CONFIRMED} -> BUMPED with Bed HELD -> AVAILABLE"
    side_effects:
      - "highest_stage_reached := target_stage (never decreases); stage-gated items become completable"
      - "calc encounter_required_coverage_units (TIER_IV + one_to_one_required), calc care_assignment_unit_debit re-price, calc unit_posture_derivation (INDUCTION_FROZEN at stage 2 with a deficit, DIVERT at stage 3)"
      - "increments activation.version, encounter.version, unit.version, the minted event and every bumped booking/bed version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_CHECKLIST_STAGE_INCOMPLETE, ERR_OR_STANDBY_NOT_STAFFED, ERR_BUNDLE_STAGE_CRITERIA_NOT_MET]

  - method: POST
    path: "/bundle-activations/{activationId}/resolve"
    description: "Joins both stage branches at CONTROLLED and computes the two scores (calc bundle_intervention_timeliness, both variants). From STAGE_2_ESCALATED every stage_gate <= 2 item must be terminal and hemorrhage QBL must not have increased; from STAGE_3_MASSIVE_TRANSFUSION every stage_gate <= 3 item must be terminal and the minted cesarean event must be out of the operating room. In the same request the activation moves CONTROLLED -> DEBRIEF_PENDING when missed_step_count >= 1 OR late_step_count >= 2 OR highest_stage_reached >= 2, incrementing unit.bundle_breach_count when missed_step_count >= 1."
    roles: [ObstetricianAttending]
    code: 200
    input: ["quantitative_blood_loss_ml?"]
    input_types: { quantitative_blood_loss_ml: "integer >= 0, required for OBSTETRIC_HEMORRHAGE — must not exceed the value supplied at stage 2; must be null for SEVERE_HYPERTENSION" }
    output: SafetyBundleActivation
    validation_priorities: [1, 2, 3, 5, 8, 8.05, 11.5]
    transitions:
      - "SafetyBundleActivation.status STAGE_2_ESCALATED -> CONTROLLED (branch B: no OR mobilization, no DIVERT)"
      - "SafetyBundleActivation.status STAGE_3_MASSIVE_TRANSFUSION -> CONTROLLED (join)"
      - "SafetyBundleActivation.status CONTROLLED -> DEBRIEF_PENDING (system, same request, when the breach test fires)"
      - "BundleChecklistItem.status PENDING -> NOT_APPLICABLE for stage_gate values never reached"
    side_effects:
      - "timeliness_score := calc bundle_intervention_timeliness variant activation_anchored; sequence_adjusted_score := variant sequence_anchored"
      - "unit.bundle_breach_count += 1 on the DEBRIEF_PENDING edge when missed_step_count >= 1; calc encounter_required_coverage_units, calc unit_posture_derivation (the unit can leave DIVERT here)"
      - "increments activation.version, encounter.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_CHECKLIST_STAGE_INCOMPLETE, ERR_CESAREAN_EVENT_IN_PROGRESS, ERR_BUNDLE_NOT_CONTROLLED]

  - method: POST
    path: "/bundle-activations/{activationId}/close-debrief"
    description: "Closes a CONTROLLED or DEBRIEF_PENDING activation (-> CLOSED). Segregation of duties: the acting X-User-ID must not equal any performed_by_staff_id on this activation's checklist items. A DEBRIEF_PENDING close additionally requires debrief_notes of 40..2000 chars, and any close requires a non-null timeliness_score. Closing unblocks the encounter's discharge path."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: ["debrief_notes?"]
    input_types: { debrief_notes: "string 40..2000, required when status == DEBRIEF_PENDING, optional (ignored) when status == CONTROLLED" }
    output: SafetyBundleActivation
    validation_priorities: [1, 2, 3, 5, 8, 9, 10, 11.5]
    transitions:
      - "SafetyBundleActivation.status {CONTROLLED|DEBRIEF_PENDING} -> CLOSED"
      - "BundleChecklistItem.status PENDING -> NOT_APPLICABLE for any item still open"
    side_effects: ["encounter.review_required re-derived; increments activation.version and encounter.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_DEBRIEF_NOTES_REQUIRED, ERR_SEGREGATION_OF_DUTIES_VIOLATION, ERR_BUNDLE_SCORE_NOT_COMPUTED]

  - method: POST
    path: "/bundle-activations/{activationId}/rescind"
    description: "Compensating exit available only before stage 2 (highest_stage_reached <= 1): ACTIVATED or STAGE_1_IN_PROGRESS -> RESCINDED. Voids EVERY checklist item to NOT_APPLICABLE regardless of prior status, resets all three counters to 0, leaves both scores null, clears magnesium_infusion_active and restores encounter.required_coverage_units, every affected shift's assigned_acuity_load_units and unit.coverage_deficit_units to their exact pre-activation values (invariant acuity_load_conservation). unit.bundle_breach_count is untouched. Carries the OCC guard expected_activation_version (concurrency rule bundle-rescind-stale-activation)."
    roles: [ObstetricianAttending]
    code: 200
    input: [rescind_reason, expected_activation_version]
    input_types: { rescind_reason: "string 10..500, required", expected_activation_version: "integer, required — must equal activation.version" }
    output: SafetyBundleActivation
    validation_priorities: [1, 2, 3, 5, 6, 8, 8.10, 9]
    transitions:
      - "SafetyBundleActivation.status {ACTIVATED|STAGE_1_IN_PROGRESS} -> RESCINDED"
      - "BundleChecklistItem.status ANY -> NOT_APPLICABLE"
      - "LaborEncounter.staffing_state COVERAGE_BREACH -> {RATIO_COVERED|ONE_TO_ONE_COVERED} when the restored pricing puts the encounter back within coverage"
    side_effects:
      - "calc encounter_required_coverage_units and calc care_assignment_unit_debit re-price back (credit new, debit old), calc unit_posture_derivation; variant rescinded_activation of calc bundle_intervention_timeliness keeps both scores null"
      - "increments activation.version, encounter.version, every re-priced assignment/shift version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ACTIVATION_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_STALE_ACTIVATION_VERSION, ERR_INVALID_STATE_TRANSITION, ERR_BUNDLE_STAGE_BLOCKS_RESCIND, ERR_RESCIND_REASON_REQUIRED]

  # -------------------------------------------------- fetal monitoring -------
  - method: POST
    path: "/fetal-monitoring-assessments"
    description: "Records an NICHD interpretation on an encounter. escalation_status starts NOT_REQUIRED for CATEGORY_I and ESCALATION_DUE otherwise, with escalation_due_at := assessed_at + ESCALATION_DUE_MINUTES[category] (20 for CATEGORY_II, 5 for CATEGORY_III). supersedes_assessment_id points at the immediately prior assessment on the same encounter (max assessed_at, tie-break created_at DESC). A new assessment also settles a predecessor sitting in REASSESSMENT_PENDING: CATEGORY_I inside the window RESOLVES it, CATEGORY_II/III RE-ARMS it (escalation_tier_high_water preserved)."
    roles: [BedsideNurse, ChargeNurse, ObstetricianAttending]
    code: 201
    input: [encounter_id, interpreted_by_staff_id, category, baseline_rate_bpm, variability, "recurrent_decelerations?", "assessed_at?"]
    input_types: { encounter_id: "string, required — FK -> LaborEncounter.id, immutable", interpreted_by_staff_id: "string, required — FK -> StaffMember.id, fetal_monitoring_cert_level IN {BASIC, ADVANCED} and on the case", category: "enum CATEGORY_I|CATEGORY_II|CATEGORY_III, required, immutable after creation", baseline_rate_bpm: "integer 50..220, required", variability: "enum ABSENT|MINIMAL|MODERATE|MARKED, required", recurrent_decelerations: "boolean, optional, default false", assessed_at: "datetime, optional, defaults to clock_now; when supplied must satisfy encounter.admitted_at <= assessed_at <= clock_now" }
    output: FetalMonitoringAssessment
    validation_priorities: [1, 2, 4, 5, 8.01, 11.1, 11.2, 12, 14.1]
    transitions:
      - "FetalMonitoringAssessment.escalation_status := NOT_REQUIRED (CATEGORY_I) or ESCALATION_DUE (CATEGORY_II/III) — initial state"
      - "Predecessor FetalMonitoringAssessment.escalation_status REASSESSMENT_PENDING -> RESOLVED (newer CATEGORY_I with assessed_at <= reassessment_due_at)"
      - "Predecessor FetalMonitoringAssessment.escalation_status REASSESSMENT_PENDING -> ESCALATION_DUE (newer CATEGORY_II/III inside the window; re-arm)"
    side_effects:
      - "calc escalation_deadline_derivation -> escalation_due_at; calc encounter_required_coverage_units (a CATEGORY_II unresolved chain lifts the tier floor to TIER_III, CATEGORY_III to TIER_IV); calc unit_posture_derivation"
      - "increments encounter.version, the predecessor assessment's version and unit.version; assessment.version := 1"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_MONITORING_CERT_INSUFFICIENT, ERR_PERFORMER_NOT_ON_CASE, ERR_ASSESSMENT_TIMESTAMP_OUT_OF_RANGE]

  - method: GET
    path: "/fetal-monitoring-assessments"
    description: "Filtered list providing reverse reachability for FetalMonitoringAssessment.encounter_id, .interpreted_by_staff_id and the self-referential .supersedes_assessment_id. Ordered assessed_at ASC, tie-break created_at ASC — so the caller can identify the 'latest assessment' the phase gates read (max assessed_at, tie-break created_at DESC)."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["encounter_id?", "interpreted_by_staff_id?", "supersedes_assessment_id?", "category?", "escalation_status?", "limit?", "offset?"]
    input_types: { encounter_id: "string, optional", interpreted_by_staff_id: "string, optional", supersedes_assessment_id: "string, optional", category: "enum CATEGORY_I|CATEGORY_II|CATEGORY_III, optional", escalation_status: "enum NOT_REQUIRED|ESCALATION_DUE|TIER_1_NOTIFIED|TIER_2_NOTIFIED|TIER_3_ACTIVATED|REASSESSMENT_PENDING|RESOLVED|TIMED_OUT_BREACH, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: FetalMonitoringAssessment[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/fetal-monitoring-assessments/{assessmentId}"
    description: "Reads one FetalMonitoringAssessment with escalation_status, escalation_tier_high_water (which a re-armed chain must resume above) and all three derived deadlines from calc escalation_deadline_derivation."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: FetalMonitoringAssessment
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ASSESSMENT_NOT_FOUND]

  - method: POST
    path: "/fetal-monitoring-assessments/{assessmentId}/escalate"
    description: "Advances the escalation chain exactly one tier: target_tier must equal escalation_tier_high_water + 1, so a re-armed chain resumes HIGHER than its first lap. Tier 1 notifies a CHARGE-slot nurse, tier 2 an OB_ATTENDING; tier 3 needs category == CATEGORY_III plus an ACTIVE OR_STANDBY shift and MINTS a CATEGORY_1_CRASH EmergencyCesareanEvent with its three-hop acuity cascade. The tier-1 call must arrive at clock_now <= escalation_due_at (inclusive)."
    roles: [BedsideNurse, ChargeNurse, ObstetricianAttending]
    code: 200
    input: [target_tier, "notified_staff_id?"]
    input_types: { target_tier: "integer 1..3, required", notified_staff_id: "string, required for target_tier 1 and 2 (FK -> StaffMember.id), omitted for target_tier 3" }
    output: FetalMonitoringAssessment
    validation_priorities: [1, 2, 3, 4, 5, 7, 8, 8.10, 11.2, 11.3, 11.4, 14.2]
    transitions:
      - "FetalMonitoringAssessment.escalation_status ESCALATION_DUE -> TIER_1_NOTIFIED"
      - "FetalMonitoringAssessment.escalation_status TIER_1_NOTIFIED -> TIER_2_NOTIFIED"
      - "FetalMonitoringAssessment.escalation_status TIER_2_NOTIFIED -> TIER_3_ACTIVATED"
      - "EmergencyCesareanEvent.status := DECISION_DECLARED (cascade-created on tier 3, triggering_assessment_id := assessment.id)"
      - "CASCADE: LaborEncounter.staffing_state {RATIO_COVERED|ONE_TO_ONE_COVERED} -> COVERAGE_BREACH on siblings of the over-capacity shift"
    side_effects:
      - "escalation_tier_high_water := target_tier; calc escalation_deadline_derivation -> next_tier_due_at (null at tier 3)"
      - "calc encounter_required_coverage_units (TIER_III floor at tier 2, TIER_IV plus one_to_one_required at tier 3), calc care_assignment_unit_debit re-price, calc unit_posture_derivation"
      - "increments assessment.version, encounter.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ASSESSMENT_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_INVALID_STATE_TRANSITION, ERR_ESCALATION_TIER_SKIPPED, ERR_ESCALATION_TARGET_INELIGIBLE, ERR_ESCALATION_CATEGORY_INSUFFICIENT, ERR_OR_STANDBY_NOT_STAFFED, ERR_ESCALATION_WINDOW_EXPIRED]

  - method: POST
    path: "/fetal-monitoring-assessments/{assessmentId}/resolve"
    description: "Stands the chain down into REASSESSMENT_PENDING from any notified tier, setting reassessment_due_at := clock_now + REASSESSMENT_WINDOW_MINUTES (30) and clearing next_tier_due_at. Requires escalation_tier_high_water >= 1 and no in-theatre cesarean event minted from this assessment. The pending window is settled either by a newer assessment or by the capacity sweep (re-arm)."
    roles: [ObstetricianAttending]
    code: 200
    input: []
    input_types: {}
    output: FetalMonitoringAssessment
    validation_priorities: [1, 2, 3, 8, 8.10]
    transitions: ["FetalMonitoringAssessment.escalation_status {TIER_1_NOTIFIED|TIER_2_NOTIFIED|TIER_3_ACTIVATED} -> REASSESSMENT_PENDING"]
    side_effects: ["calc escalation_deadline_derivation -> reassessment_due_at; calc encounter_required_coverage_units; increments assessment.version and encounter.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ASSESSMENT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_ESCALATION_NOT_STARTED, ERR_CESAREAN_EVENT_IN_PROGRESS]

  # ---------------------------------------------- emergency cesareans --------
  - method: POST
    path: "/emergency-cesareans"
    description: "Declares an emergency cesarean on an encounter, entering the branching machine at DECISION_DECLARED with decision_at := clock_now. §1.2 GAP RESOLUTION — the EmergencyCesareanEvent machine declares no creation edge (it is cascade-minted by fetal tier-3 escalation and by bundle stage-3 escalation), yet §1.4 priorities 4 and 8.01 name POST /emergency-cesareans; this endpoint is that clinician-declared entry, producing the identical initial row (status DECISION_DECLARED, decision_at := clock_now) with both triggering_* FKs null unless supplied. At most one event per encounter may be non-terminal."
    roles: [ObstetricianAttending]
    code: 201
    input: [encounter_id, urgency_class, "triggering_assessment_id?", "triggering_activation_id?"]
    input_types: { encounter_id: "string, required — FK -> LaborEncounter.id, immutable", urgency_class: "enum CATEGORY_1_CRASH|CATEGORY_2_URGENT, required, immutable — fixes the D2I target at 15 or 30 minutes", triggering_assessment_id: "string, optional — FK -> FetalMonitoringAssessment.id, must belong to this encounter", triggering_activation_id: "string, optional — FK -> SafetyBundleActivation.id, must belong to this encounter" }
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 4, 5, 7, 8.01]
    transitions: ["EmergencyCesareanEvent.status := DECISION_DECLARED (initial state)"]
    side_effects:
      - "decision_at := clock_now; calc encounter_required_coverage_units re-derives the acuity floor; calc unit_posture_derivation re-derives staffing_posture (a declared event counts as an in-theatre encounter)"
      - "increments encounter.version and unit.version; event.version := 1"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_ACTIVATION_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_CESAREAN_EVENT_IN_PROGRESS]

  - method: GET
    path: "/emergency-cesareans"
    description: "Filtered list giving reverse reachability for EmergencyCesareanEvent.encounter_id, .or_bed_id, .triggering_assessment_id and .triggering_activation_id — the only discovery channel for cascade-minted events, whose ids no caller ever receives in a response. Ordered decision_at DESC, tie-break created_at DESC."
    roles: [ChargeNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer]
    code: 200
    input: ["encounter_id?", "unit_id?", "or_bed_id?", "triggering_assessment_id?", "triggering_activation_id?", "status?", "urgency_class?", "limit?", "offset?"]
    input_types: { encounter_id: "string, optional", unit_id: "string, optional — resolved through the parent encounter", or_bed_id: "string, optional", triggering_assessment_id: "string, optional", triggering_activation_id: "string, optional", status: "enum DECISION_DECLARED|TEAM_MOBILIZED|INCISION_RECORDED|DELIVERED|REVIEW_PENDING|CLOSED|ABORTED_TO_VAGINAL, optional", urgency_class: "enum CATEGORY_1_CRASH|CATEGORY_2_URGENT, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: EmergencyCesareanEvent[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/emergency-cesareans/{eventId}"
    description: "Reads one EmergencyCesareanEvent with decision_at, incision_at, delivery_at, decision_to_incision_minutes and met_target from calc decision_to_incision_measurement, plus mobilized_staff_ids (the array the close-call segregation check reads)."
    roles: [ChargeNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CESAREAN_EVENT_NOT_FOUND]

  - method: POST
    path: "/emergency-cesareans/{eventId}/mobilize-team"
    description: "Takes an AVAILABLE OR bed and credits the surgical team. staff_ids must contain an ANESTHESIOLOGIST, an or_circulating_qualified SURGICAL_TECH and a NEONATAL_RESUSCITATOR, each on an ACTIVE ShiftAssignment on the unit. unit.cesarean_readiness_state != NOT_READY is required for CATEGORY_2_URGENT and BYPASSED for CATEGORY_1_CRASH. Side effect with teeth: every CHECKED_IN SupportPersonPass on the encounter is auto-CHECKED_OUT unless it is DOULA_CERTIFIED with or_credentialed == true."
    roles: [ObstetricianAttending]
    code: 200
    input: [or_bed_id, staff_ids]
    input_types: { or_bed_id: "string, required — FK -> Bed.id, bed_type == OR, status == AVAILABLE, same unit as the encounter", staff_ids: "array of string, required, 3..12 entries — FK -> StaffMember.id, preserved in payload order as mobilized_staff_ids" }
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 3, 4, 5, 7, 8, 8.01, 8.07, 8.08, 11.1, 11.4, 13.3]
    transitions:
      - "EmergencyCesareanEvent.status DECISION_DECLARED -> TEAM_MOBILIZED"
      - "Bed.status AVAILABLE -> OCCUPIED (the named OR bed)"
      - "CASCADE: SupportPersonPass.status CHECKED_IN -> CHECKED_OUT for every non-OR-credentialed pass on the encounter"
    side_effects:
      - "or_bed_id := bed.id; mobilized_staff_ids := payload order; encounter.one_to_one_required := true"
      - "calc encounter_required_coverage_units, calc care_assignment_unit_debit re-price, calc support_person_occupancy (allowance drops to 1), calc unit_posture_derivation"
      - "increments event.version, bed.version, encounter.version, unit.version and every auto-checked-out pass version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CESAREAN_EVENT_NOT_FOUND, ERR_BED_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_INVALID_STATE_TRANSITION, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_BED_TYPE_NOT_ELIGIBLE, ERR_OR_BED_UNAVAILABLE, ERR_SHIFT_NOT_ACTIVE, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_CESAREAN_TEAM_INCOMPLETE, ERR_CESAREAN_READINESS_NOT_MET]

  - method: POST
    path: "/emergency-cesareans/{eventId}/record-incision"
    description: "Measures the benchmark's headline metric: decision_to_incision_minutes := floor((incision_at - decision_at) / 60s) and met_target := minutes <= D2I_TARGET_MINUTES[urgency_class] (boundary inclusive, so exactly 15 on a CATEGORY_1_CRASH MEETS target). Recomputing calc cesarean_readiness_derivation over the last 3 measured events can drop the unit to DEGRADED or NOT_READY, and a NOT_READY drop bumps every CONFIRMED ELECTIVE_39_WEEK booking."
    roles: [ObstetricianAttending]
    code: 200
    input: [incision_at]
    input_types: { incision_at: "datetime, required — must satisfy decision_at < incision_at <= clock_now" }
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 3, 5, 8, 14.1]
    transitions:
      - "EmergencyCesareanEvent.status TEAM_MOBILIZED -> INCISION_RECORDED"
      - "CASCADE: InductionBooking.status CONFIRMED -> BUMPED for every ELECTIVE_39_WEEK booking when the readiness drop reaches NOT_READY"
      - "CASCADE: Bed.status HELD -> AVAILABLE for each bumped booking's held bed"
    side_effects:
      - "calc decision_to_incision_measurement -> decision_to_incision_minutes, met_target; calc cesarean_readiness_derivation -> unit.cesarean_readiness_state, readiness_reason, mean_d2i_minutes"
      - "each bumped booking decrements the day's committed bed-minutes by exactly its frozen projected_occupancy_minutes (calc induction_bed_minute_conservation) and increments bump_count"
      - "increments event.version, unit.version and every bumped booking/bed version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CESAREAN_EVENT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE]

  - method: POST
    path: "/emergency-cesareans/{eventId}/record-delivery"
    description: "Stamps delivery and sets encounter.delivery_mode := CESAREAN_REPEAT when encounter.prior_cesarean == true else CESAREAN_PRIMARY (so the caller never chooses it). The DELIVERED -> REVIEW_PENDING system edge is evaluated at the END of this same request: the event lands in REVIEW_PENDING when met_target == false OR urgency_class == CATEGORY_1_CRASH, otherwise it goes straight to CLOSED in one call. DRAFT QualityMeasureSnapshot rows whose window contains delivery_recorded_at are recomputed; CERTIFIED rows are never retro-mutated."
    roles: [ObstetricianAttending]
    code: 200
    input: [delivery_at]
    input_types: { delivery_at: "datetime, required — must satisfy incision_at <= delivery_at <= clock_now" }
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 3, 5, 8, 14.1]
    transitions:
      - "EmergencyCesareanEvent.status INCISION_RECORDED -> DELIVERED"
      - "EmergencyCesareanEvent.status DELIVERED -> REVIEW_PENDING (system, same request, when met_target == false OR urgency_class == CATEGORY_1_CRASH)"
      - "EmergencyCesareanEvent.status DELIVERED -> CLOSED (system, same request, when met_target == true AND urgency_class == CATEGORY_2_URGENT)"
      - "Bed.status OCCUPIED -> TURNOVER (the OR bed, turnover_clear_at := clock_now + unit.turnover_buffer_minutes)"
    side_effects:
      - "encounter.delivery_mode and encounter.delivery_recorded_at set; encounter.review_required := true on the REVIEW_PENDING branch"
      - "calc quality_measure_rates re-runs for every DRAFT snapshot covering delivery_recorded_at (both the authoritative delivery_cohort and the shadow admission_cohort variants)"
      - "increments event.version, encounter.version, bed.version and each recomputed snapshot version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CESAREAN_EVENT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE]

  - method: POST
    path: "/emergency-cesareans/{eventId}/close"
    description: "Fork-join close from DELIVERED or REVIEW_PENDING. From REVIEW_PENDING a CLOSED NewbornComplicationReview on the encounter is required first. Segregation of duties: the acting X-User-ID must not appear in mobilized_staff_ids — the surgeons who ran the case cannot sign off on it."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 3, 8, 10]
    transitions: ["EmergencyCesareanEvent.status {DELIVERED|REVIEW_PENDING} -> CLOSED"]
    side_effects:
      - "encounter.review_required re-derived (false once no other event or review is open); calc unit_posture_derivation drops this encounter from the in-theatre clause"
      - "increments event.version, encounter.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CESAREAN_EVENT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_NEWBORN_REVIEW_OPEN, ERR_SEGREGATION_OF_DUTIES_VIOLATION]

  - method: POST
    path: "/emergency-cesareans/{eventId}/abort-to-vaginal"
    description: "BRANCH B exit from DECISION_DECLARED or TEAM_MOBILIZED. Requires incision_at to be null and the latest FetalMonitoringAssessment on the encounter to be CATEGORY_I or CATEGORY_II. decision_to_incision_minutes and met_target stay permanently null, so this event is EXCLUDED from the rolling readiness mean — the contrast that makes calc cesarean_readiness_derivation's input_set observable."
    roles: [ObstetricianAttending]
    code: 200
    input: []
    input_types: {}
    output: EmergencyCesareanEvent
    validation_priorities: [1, 2, 3, 8, 8.10, 11.3]
    transitions:
      - "EmergencyCesareanEvent.status {DECISION_DECLARED|TEAM_MOBILIZED} -> ABORTED_TO_VAGINAL"
      - "Bed.status OCCUPIED -> TURNOVER (only when or_bed_id was non-null; or_bed_id := null)"
    side_effects:
      - "encounter.delivery_mode left untouched for the later advance-phase call; encounter.one_to_one_required re-derived"
      - "calc cesarean_readiness_derivation re-runs with this event excluded from the rolling window; calc unit_posture_derivation"
      - "increments event.version, bed.version, encounter.version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CESAREAN_EVENT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_CESAREAN_ALREADY_INCISED, ERR_FETAL_CATEGORY_BLOCKS_ABORT]

  # -------------------------------------------- cesarean readiness drills ----
  - method: POST
    path: "/obstetric-units/{unitId}/cesarean-readiness-drills"
    description: "Schedules a drill on the unit at status SCHEDULED. participant_staff_ids is the currency-granting roster: it must contain at least one staff_role == OB_ATTENDING and one ANESTHESIOLOGIST (checked at document time, priority 11.4) and every id must belong to this unit. scheduled_for_utc must be >= clock_now at creation."
    roles: [ChargeNurse, AnesthesiaLead]
    code: 201
    input: [drill_type, scheduled_for_utc, participant_staff_ids]
    input_types: { drill_type: "enum DECISION_TO_INCISION|HEMORRHAGE_STAGE_2|ECLAMPSIA, required, immutable", scheduled_for_utc: "datetime, required — must be >= clock_now", participant_staff_ids: "array of string, required, 2..20 entries — FK -> StaffMember.id, all on this unit" }
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3, 4, 5, 7, 11.1, 14.1]
    transitions: ["CesareanReadinessDrill.status := SCHEDULED (initial state)"]
    side_effects: ["No readiness change — an unvalidated drill grants no currency (calc cesarean_readiness_derivation only reads status == VALIDATED); increments unit.version; drill.version := 1"]
    note: "§1.4 GAP RESOLUTION — §1.1 requires scheduled_for_utc >= clock_now at creation but names no error_id; priority 14.1's ERR_DRILL_TIMESTAMP_OUT_OF_RANGE is reused for it rather than minting new vocabulary."
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_DRILL_TIMESTAMP_OUT_OF_RANGE]

  - method: GET
    path: "/obstetric-units/{unitId}/cesarean-readiness-drills"
    description: "Sub-resource list giving reverse reachability for CesareanReadinessDrill.unit_id, plus filters on the participant roster and the documenting clinician. Ordered scheduled_for_utc DESC, tie-break created_at DESC. The caller uses status=VALIDATED with expires_at to identify the current_drill_id that calc cesarean_readiness_derivation reads."
    roles: [ChargeNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer]
    code: 200
    input: ["status?", "drill_type?", "participant_staff_id?", "documented_by_staff_id?", "limit?", "offset?"]
    input_types: { status: "enum SCHEDULED|IN_PROGRESS|DOCUMENTED|VALIDATED|INVALIDATED|ABANDONED, optional", drill_type: "enum DECISION_TO_INCISION|HEMORRHAGE_STAGE_2|ECLAMPSIA, optional", participant_staff_id: "string, optional — matches drills whose participant_staff_ids array contains this id", documented_by_staff_id: "string, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: CesareanReadinessDrill[]
    validation_priorities: [1, 2, 3, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/cesarean-readiness-drills/{drillId}"
    description: "Reads one drill with measured_d2i_minutes, validated_at, expires_at (null unless status == VALIDATED — invalidate nulls it), revision_count (the DRILL_REVISION_LIMIT counter) and validated_by_user_id."
    roles: [ChargeNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_DRILL_NOT_FOUND]

  - method: POST
    path: "/cesarean-readiness-drills/{drillId}/start"
    description: "Opens the drill once clock_now >= scheduled_for_utc (inclusive). Blocked while unit.staffing_posture == DIVERT — a diverting unit does not run simulations."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3, 8, 8.02, 14.2]
    transitions: ["CesareanReadinessDrill.status SCHEDULED -> IN_PROGRESS"]
    side_effects: ["increments drill.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_DRILL_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_UNIT_POSTURE_BLOCKS_OPERATION, ERR_DRILL_NOT_DUE]

  - method: POST
    path: "/cesarean-readiness-drills/{drillId}/document"
    description: "Records the simulated timings from IN_PROGRESS or (re-documentation) from INVALIDATED, computing measured_d2i_minutes := floor((incision_at - decision_at) / 60s). The INVALIDATED entry increments revision_count and is refused once revision_count >= DRILL_REVISION_LIMIT (2). documented_by_staff_id must be listed in participant_staff_ids (priority 12) and is the id the validator must differ from."
    roles: [ChargeNurse, AnesthesiaLead]
    code: 200
    input: [decision_at, incision_at, documented_by_staff_id]
    input_types: { decision_at: "datetime, required — simulated decision instant", incision_at: "datetime, required — must satisfy decision_at < incision_at <= clock_now", documented_by_staff_id: "string, required — FK -> StaffMember.id, must appear in participant_staff_ids" }
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3, 4, 5, 7, 8, 8.10, 11.1, 11.4, 12, 14.1]
    transitions: ["CesareanReadinessDrill.status {IN_PROGRESS|INVALIDATED} -> DOCUMENTED (cycle edge from INVALIDATED)"]
    side_effects: ["measured_d2i_minutes computed; revision_count += 1 only on the INVALIDATED entry; no readiness change until validation; increments drill.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_DRILL_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_INVALID_STATE_TRANSITION, ERR_DRILL_REVISION_LIMIT_REACHED, ERR_STAFF_CREDENTIAL_EXPIRED, ERR_DRILL_PARTICIPANTS_INSUFFICIENT, ERR_PERFORMER_NOT_ON_CASE, ERR_DRILL_TIMESTAMP_OUT_OF_RANGE]

  - method: POST
    path: "/cesarean-readiness-drills/{drillId}/validate"
    description: "Grants currency: requires measured_d2i_minutes <= DRILL_PASS_MINUTES (30, boundary inclusive — exactly 30 PASSES) and X-User-ID != documented_by_staff_id. Sets validated_at := clock_now, expires_at := validated_at + DRILL_CURRENCY_DAYS (90d), stamps every participant with last_validated_drill_at := decision_at and drill_currency_state := CURRENT, then recomputes unit readiness, which can rise to READY and unblock induction confirms and SECOND_STAGE advances."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3, 8, 10, 11.4]
    transitions:
      - "CesareanReadinessDrill.status DOCUMENTED -> VALIDATED"
      - "CASCADE: StaffMember.drill_currency_state LAPSED -> CURRENT for every participant"
    side_effects:
      - "validated_at, expires_at, validated_by_user_id set; participants' last_validated_drill_at := drill.decision_at"
      - "calc cesarean_readiness_derivation -> unit.cesarean_readiness_state, readiness_reason, current_drill_id, current_drill_expires_at; OR_STANDBY eligibility (priority 11.2) becomes satisfiable"
      - "increments drill.version, each participant staff version and unit.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_DRILL_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_SEGREGATION_OF_DUTIES_VIOLATION, ERR_DRILL_PERFORMANCE_FAILED]

  - method: POST
    path: "/cesarean-readiness-drills/{drillId}/invalidate"
    description: "Revokes currency and fires the deepest cascade in the scaffold (4 hops): expires_at := null; each participant re-derives last_validated_drill_at from its REMAINING VALIDATED drills (decision_at DESC, tie-break created_at DESC) and may fall to LAPSED; losing the unit's only current drill sets cesarean_readiness_state := NOT_READY; NOT_READY bumps every CAPACITY_HELD/CONFIRMED booking with priority_class IN {ELECTIVE_39_WEEK, PATIENT_REQUEST}; each bump releases its bed and returns EXACTLY the frozen projected_occupancy_minutes to the day's budget."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: [invalidation_reason]
    input_types: { invalidation_reason: "string, required, 10..500 chars" }
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3, 5, 8, 9]
    transitions:
      - "CesareanReadinessDrill.status VALIDATED -> INVALIDATED"
      - "CASCADE hop 1: StaffMember.drill_currency_state CURRENT -> LAPSED for participants left with no other VALIDATED drill"
      - "CASCADE hop 3: InductionBooking.status {CAPACITY_HELD|CONFIRMED} -> BUMPED for ELECTIVE_39_WEEK and PATIENT_REQUEST bookings"
      - "CASCADE hop 4: Bed.status HELD -> AVAILABLE for each bumped booking"
    side_effects:
      - "hop 2 — calc cesarean_readiness_derivation -> unit.cesarean_readiness_state := NOT_READY with readiness_reason NO_CURRENT_DRILL when this was the only current drill"
      - "hop 4 — calc induction_bed_minute_conservation: each bumped booking decrements its day's held/committed bed-minutes by exactly its frozen projected_occupancy_minutes and increments bump_count; calc induction_capacity_projection re-runs"
      - "increments drill.version, participant staff versions, unit.version and every bumped booking and bed version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_DRILL_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_INVALIDATION_REASON_REQUIRED]

  - method: POST
    path: "/cesarean-readiness-drills/{drillId}/abandon"
    description: "Terminal exit from SCHEDULED or IN_PROGRESS only; a DOCUMENTED or VALIDATED drill can never be abandoned (ERR_DRILL_NOT_ABANDONABLE). No readiness change, because an abandoned drill never contributed currency."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: CesareanReadinessDrill
    validation_priorities: [1, 2, 3, 8, 8.10]
    transitions: ["CesareanReadinessDrill.status {SCHEDULED|IN_PROGRESS} -> ABANDONED"]
    side_effects: ["No calculation re-runs; increments drill.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_DRILL_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_DRILL_NOT_ABANDONABLE]

  # ------------------------------------------ newborn complication reviews ---
  - method: POST
    path: "/newborn-complication-reviews"
    description: "Opens a review on an encounter at status OPEN with opened_at := clock_now and debrief_due_at := opened_at + DEBRIEF_DUE_HOURS (72h). facilitator_staff_id must never have held a CareAssignment on this encounter in ANY status — segregation of duties enforced at creation and re-checked on schedule-debrief. An open review blocks encounter discharge (priority 8.04) and blocks closing a REVIEW_PENDING cesarean event. §1.4 GAP RESOLUTION — priority 4 (body-id existence) covers this endpoint's encounter_id, which §1.1 declares as set from the request body."
    roles: [ChargeNurse, PerinatalSafetyOfficer]
    code: 201
    input: [encounter_id, complication_code, facilitator_staff_id]
    input_types: { encounter_id: "string, required — FK -> LaborEncounter.id, immutable", complication_code: "enum UNEXPECTED_NICU_TERM|HIE_SUSPECTED|APGAR5_UNDER_7|BIRTH_INJURY|UNEXPECTED_TRANSFER, required", facilitator_staff_id: "string, required — FK -> StaffMember.id, same unit as the encounter, never a care participant" }
    output: NewbornComplicationReview
    validation_priorities: [1, 2, 4, 5, 7, 8.01, 10, 11.1]
    transitions: ["NewbornComplicationReview.status := OPEN (initial state)"]
    side_effects:
      - "opened_at := clock_now; debrief_due_at := opened_at + 72h; encounter.review_required := true"
      - "increments encounter.version; review.version := 1"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_STAFF_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_CROSS_UNIT_REFERENCE, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_SEGREGATION_OF_DUTIES_VIOLATION, ERR_STAFF_CREDENTIAL_EXPIRED]

  - method: GET
    path: "/newborn-complication-reviews"
    description: "Filtered list giving reverse reachability for NewbornComplicationReview.encounter_id and .facilitator_staff_id. Ordered opened_at DESC, tie-break created_at DESC. status=CLOSED is how a caller confirms the discharge blocker (priority 8.04) and the cesarean close precondition are cleared."
    roles: [ChargeNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["encounter_id?", "facilitator_staff_id?", "status?", "complication_code?", "limit?", "offset?"]
    input_types: { encounter_id: "string, optional", facilitator_staff_id: "string, optional", status: "enum OPEN|DEBRIEF_SCHEDULED|FINDINGS_SUBMITTED|REWORK_REQUESTED|CLOSED, optional", complication_code: "enum UNEXPECTED_NICU_TERM|HIE_SUSPECTED|APGAR5_UNDER_7|BIRTH_INJURY|UNEXPECTED_TRANSFER, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: NewbornComplicationReview[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/newborn-complication-reviews/{reviewId}"
    description: "Reads one review with debrief_due_at (the only deadline in the scaffold that MOVES — request-rework extends it to clock_now + 24h), debrief_scheduled_for_utc, debrief_held_at, rework_count (against REWORK_LIMIT 2), findings_summary, contributing_factor_codes and closed_by_user_id."
    roles: [ChargeNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: NewbornComplicationReview
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_REVIEW_NOT_FOUND]

  - method: POST
    path: "/newborn-complication-reviews/{reviewId}/schedule-debrief"
    description: "Books the debrief from OPEN or (cycle re-entry) from REWORK_REQUESTED. clock_now <= debrief_scheduled_for_utc <= debrief_due_at with BOTH boundaries inclusive; on a reworked review debrief_due_at is the EXTENDED value, so a slot rejected before rework can become legal after it. The facilitator segregation check is re-evaluated here."
    roles: [ChargeNurse]
    code: 200
    input: [debrief_scheduled_for_utc]
    input_types: { debrief_scheduled_for_utc: "datetime, required — must satisfy clock_now <= value <= debrief_due_at" }
    output: NewbornComplicationReview
    validation_priorities: [1, 2, 3, 5, 8, 10, 14.2]
    transitions: ["NewbornComplicationReview.status {OPEN|REWORK_REQUESTED} -> DEBRIEF_SCHEDULED (cycle edge from REWORK_REQUESTED)"]
    side_effects: ["debrief_scheduled_for_utc set; increments review.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_REVIEW_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_SEGREGATION_OF_DUTIES_VIOLATION, ERR_DEBRIEF_WINDOW_VIOLATION]

  - method: POST
    path: "/newborn-complication-reviews/{reviewId}/submit-findings"
    description: "Records the debrief outcome once clock_now >= debrief_scheduled_for_utc (inclusive) and every SafetyBundleActivation on the encounter is CLOSED or RESCINDED. debrief_held_at := clock_now. Note the asymmetry with the window check: findings may be submitted AFTER debrief_due_at has passed — lateness is not blocked here, only the scheduling was bounded."
    roles: [ChargeNurse]
    code: 200
    input: [findings_summary, contributing_factor_codes]
    input_types: { findings_summary: "string, required, 40..2000 chars", contributing_factor_codes: "array of string, required, non-empty, 1..10 entries" }
    output: NewbornComplicationReview
    validation_priorities: [1, 2, 3, 5, 8, 9, 14.2]
    transitions: ["NewbornComplicationReview.status DEBRIEF_SCHEDULED -> FINDINGS_SUBMITTED"]
    side_effects: ["debrief_held_at := clock_now; increments review.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_REVIEW_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_DEBRIEF_NOTES_REQUIRED, ERR_CONTRIBUTING_FACTORS_REQUIRED, ERR_BUNDLE_NOT_CLOSED, ERR_DEBRIEF_NOT_HELD]

  - method: POST
    path: "/newborn-complication-reviews/{reviewId}/request-rework"
    description: "Cycle edge: sends the review back for a fresh debrief, bounded by rework_count < REWORK_LIMIT (2). CLEARS findings_summary, contributing_factor_codes, debrief_scheduled_for_utc and debrief_held_at, and EXTENDS debrief_due_at to clock_now + REWORK_EXTENSION_HOURS (24) — the only mutation of that deadline anywhere in the system. The requester must not be facilitator_staff_id."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: [rework_reason]
    input_types: { rework_reason: "string, required, 10..500 chars" }
    output: NewbornComplicationReview
    validation_priorities: [1, 2, 3, 5, 8, 8.10, 9, 10]
    transitions: ["NewbornComplicationReview.status FINDINGS_SUBMITTED -> REWORK_REQUESTED"]
    side_effects:
      - "rework_count += 1; findings_summary, contributing_factor_codes, debrief_scheduled_for_utc and debrief_held_at cleared; debrief_due_at := clock_now + 24h"
      - "increments review.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_REVIEW_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_INVALID_STATE_TRANSITION, ERR_REVIEW_REWORK_LIMIT_REACHED, ERR_SEGREGATION_OF_DUTIES_VIOLATION]

  - method: POST
    path: "/newborn-complication-reviews/{reviewId}/close"
    description: "Terminal close from FINDINGS_SUBMITTED. The closer must be neither facilitator_staff_id nor any StaffMember.id that ever held a CareAssignment on the encounter, and contributing_factor_codes must still be non-empty. Closing unblocks the encounter's discharge (priority 8.04) and makes any REVIEW_PENDING EmergencyCesareanEvent closable."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: NewbornComplicationReview
    validation_priorities: [1, 2, 3, 8, 9, 10]
    transitions: ["NewbornComplicationReview.status FINDINGS_SUBMITTED -> CLOSED"]
    side_effects:
      - "closed_by_user_id := X-User-ID; encounter.review_required re-derived to false when this was the last non-CLOSED review and no cesarean event is in REVIEW_PENDING"
      - "increments review.version and encounter.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_REVIEW_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_CONTRIBUTING_FACTORS_REQUIRED, ERR_SEGREGATION_OF_DUTIES_VIOLATION]

  # ---------------------------------------------- support person passes ------
  - method: POST
    path: "/support-person-passes"
    description: "Issues a visitation pass at status ISSUED with valid_until := clock_now + PASS_VALID_HOURS. A DOULA_CERTIFIED pass requires doula_certification_expires_at > clock_now at issuance AND again at every check-in, and only a DOULA_CERTIFIED pass with or_credentialed == true may stay for a mobilized cesarean. §1.4 GAP RESOLUTION — priority 4 (body-id existence) covers this endpoint's encounter_id, which §1.1 describes as set from the creation path but which §1.4 reaches through the flat collection path."
    roles: [PatientAccessCoordinator, ChargeNurse]
    code: 201
    input: [encounter_id, person_name, credential_type, "doula_certification_expires_at?", "or_credentialed?"]
    input_types: { encounter_id: "string, required — FK -> LaborEncounter.id, immutable", person_name: "string, required, 1..120 chars", credential_type: "enum PARTNER|DOULA_CERTIFIED|STUDENT_OBSERVER|INTERPRETER, required, immutable", doula_certification_expires_at: "datetime, required when credential_type == DOULA_CERTIFIED and forbidden otherwise; must be > clock_now", or_credentialed: "boolean, optional, default false" }
    output: SupportPersonPass
    validation_priorities: [1, 2, 4, 5, 8.01, 11.6]
    transitions: ["SupportPersonPass.status := ISSUED (initial state)"]
    side_effects: ["valid_until := clock_now + PASS_VALID_HOURS; an ISSUED pass occupies nothing until check-in (calc support_person_occupancy counts CHECKED_IN only); increments encounter.version; pass.version := 1"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_ENCOUNTER_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_DOULA_CREDENTIAL_EXPIRED]

  - method: GET
    path: "/support-person-passes"
    description: "Filtered list giving reverse reachability for SupportPersonPass.encounter_id. Ordered created_at ASC. status=CHECKED_IN is how a caller observes the occupancy figure that calc support_person_occupancy caps, and how the auto-checkout cascade from mobilize-team and the sweep's ISSUED/CHECKED_OUT -> EXPIRED edge are witnessed."
    roles: [PatientAccessCoordinator, ChargeNurse, BedsideNurse, PerinatalSafetyOfficer]
    code: 200
    input: ["encounter_id?", "status?", "credential_type?", "limit?", "offset?"]
    input_types: { encounter_id: "string, optional", status: "enum ISSUED|CHECKED_IN|CHECKED_OUT|REVOKED|EXPIRED, optional", credential_type: "enum PARTNER|DOULA_CERTIFIED|STUDENT_OBSERVER|INTERPRETER, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: SupportPersonPass[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/support-person-passes/{passId}"
    description: "Reads one pass with valid_until, checked_in_at, checked_out_at and reentry_count (against REENTRY_LIMIT 3)."
    roles: [PatientAccessCoordinator, ChargeNurse, BedsideNurse, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: SupportPersonPass
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_PASS_NOT_FOUND]

  - method: POST
    path: "/support-person-passes/{passId}/check-in"
    description: "Admits the support person from ISSUED or (cycle re-entry) from CHECKED_OUT, the latter bounded by reentry_count < REENTRY_LIMIT (3). Requires clock_now < valid_until STRICTLY (the boundary instant is already expired), a live doula credential, no TEAM_MOBILIZED/INCISION_RECORDED cesarean event unless this is an or_credentialed DOULA_CERTIFIED pass, and room under the calc support_person_occupancy allowance (checked LAST at priority 15, inclusive)."
    roles: [PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: SupportPersonPass
    validation_priorities: [1, 2, 3, 8, 8.01, 8.10, 11.6, 15]
    transitions: ["SupportPersonPass.status {ISSUED|CHECKED_OUT} -> CHECKED_IN (cycle edge from CHECKED_OUT)"]
    side_effects:
      - "checked_in_at := clock_now; checked_out_at := null; reentry_count += 1 only on the CHECKED_OUT entry"
      - "calc support_person_occupancy re-runs (DOULA_CERTIFIED passes sit outside the base cap); increments pass.version"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_PASS_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_ENCOUNTER_PHASE_TERMINAL, ERR_SUPPORT_REENTRY_LIMIT_REACHED, ERR_SUPPORT_PASS_EXPIRED, ERR_DOULA_CREDENTIAL_EXPIRED, ERR_VISITATION_RESTRICTED_BY_PROCEDURE, ERR_SUPPORT_OCCUPANCY_EXCEEDED]

  - method: POST
    path: "/support-person-passes/{passId}/check-out"
    description: "Manual counterpart of the automatic checkout inside mobilize-team: CHECKED_IN -> CHECKED_OUT with no preconditions, freeing an occupancy slot and arming the re-entry cycle."
    roles: [PatientAccessCoordinator]
    code: 200
    input: []
    input_types: {}
    output: SupportPersonPass
    validation_priorities: [1, 2, 3, 8]
    transitions: ["SupportPersonPass.status CHECKED_IN -> CHECKED_OUT"]
    side_effects: ["checked_out_at := clock_now; calc support_person_occupancy re-runs; increments pass.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_PASS_NOT_FOUND, ERR_INVALID_STATE_TRANSITION]

  - method: POST
    path: "/support-person-passes/{passId}/revoke"
    description: "Terminal revocation from ISSUED, CHECKED_IN or CHECKED_OUT with no preconditions — the same edge the transfer-out cascade fires automatically. A REVOKED pass can never be checked in again (contrast with CHECKED_OUT) and no longer blocks discharge (priority 8.04)."
    roles: [ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: SupportPersonPass
    validation_priorities: [1, 2, 3, 8]
    transitions: ["SupportPersonPass.status {ISSUED|CHECKED_IN|CHECKED_OUT} -> REVOKED"]
    side_effects: ["calc support_person_occupancy re-runs when the pass was CHECKED_IN; increments pass.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_PASS_NOT_FOUND, ERR_INVALID_STATE_TRANSITION]

  # ------------------------------------------- quality measure snapshots -----
  - method: POST
    path: "/obstetric-units/{unitId}/quality-measure-snapshots"
    description: "Computes a reporting snapshot over the half-open window [period_start_utc, period_end_utc) at status DRAFT, running BOTH variants of calc quality_measure_rates: the authoritative DELIVERY_COHORT figures (attribution_basis is always DELIVERY_COHORT) plus shadow_ntsv_rate_pct from the ADMISSION_COHORT variant. Carries the OCC guard expected_unit_version (concurrency rule snapshot-create-stale-unit). Creating a snapshot for an IDENTICAL window SUPERSEDES every existing DRAFT or CERTIFIED row for that window, writing superseded_by_snapshot_id on each; a CERTIFIED predecessor keeps its frozen counts for audit."
    roles: [PerinatalSafetyOfficer]
    code: 201
    input: [period_start_utc, period_end_utc, expected_unit_version]
    input_types: { period_start_utc: "datetime, required — INCLUSIVE window start", period_end_utc: "datetime, required — EXCLUSIVE window end, must be > period_start_utc", expected_unit_version: "integer, required — must equal the current ObstetricUnit.version (OCC, evaluated at priority 6 before any business rule)" }
    output: QualityMeasureSnapshot
    validation_priorities: [1, 2, 3, 5, 6, 14.2]
    transitions:
      - "QualityMeasureSnapshot.status := DRAFT (initial state)"
      - "QualityMeasureSnapshot.status {DRAFT|CERTIFIED} -> SUPERSEDED for every prior row on the identical window (system edge)"
    side_effects:
      - "calc quality_measure_rates -> ntsv_cesarean_numerator/denominator/rate_pct, episiotomy_numerator/denominator/rate_pct, shadow_ntsv_rate_pct and composite_quality_index (average of the two ALREADY-4dp-rounded authoritative rates, re-rounded to 2dp)"
      - "each superseded predecessor gets superseded_by_snapshot_id := new snapshot id; CERTIFIED predecessors are never recomputed"
      - "increments unit.version and every superseded snapshot version; snapshot.version := 1"
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_INVALID_FIELD_VALUE, ERR_STALE_UNIT_VERSION, ERR_MEASURE_PERIOD_INVALID]

  - method: GET
    path: "/obstetric-units/{unitId}/quality-measure-snapshots"
    description: "Sub-resource list giving reverse reachability for QualityMeasureSnapshot.unit_id and for the self-referential superseded_by_snapshot_id chain. Ordered period_start_utc DESC, tie-break created_at DESC, so the live row for a window is the first non-SUPERSEDED entry."
    roles: [PerinatalSafetyOfficer, ChargeNurse]
    code: 200
    input: ["status?", "superseded_by_snapshot_id?", "limit?", "offset?"]
    input_types: { status: "enum DRAFT|CERTIFIED|SUPERSEDED, optional", superseded_by_snapshot_id: "string, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: QualityMeasureSnapshot[]
    validation_priorities: [1, 2, 3, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_UNIT_NOT_FOUND, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/quality-measure-snapshots/{snapshotId}"
    description: "Reads one snapshot: both authoritative rates at 4dp, shadow_ntsv_rate_pct (the ADMISSION_COHORT advisory variant that a DRAFT row keeps re-deriving), composite_quality_index at 2dp, certified_at/certified_by_user_id and superseded_by_snapshot_id. This is the read that exposes the double-rounding contrast in calc quality_measure_rates and proves a CERTIFIED row is frozen against later deliveries."
    roles: [PerinatalSafetyOfficer, ChargeNurse]
    code: 200
    input: []
    input_types: {}
    output: QualityMeasureSnapshot
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_SNAPSHOT_NOT_FOUND]

  - method: POST
    path: "/quality-measure-snapshots/{snapshotId}/certify"
    description: "Freezes a DRAFT snapshot. Requires both denominators >= 1, a closed period (period_end_utc <= clock_now, inclusive), and every SafetyBundleActivation of the delivery cohort terminal (CLOSED or RESCINDED) — checked at priority 16, after every other family. Segregation of duties: the certifier must not be the facilitator of any NewbornComplicationReview inside the reporting window. Once CERTIFIED the row is excluded from all recomputation, so a later record-delivery inside the window changes nothing here."
    roles: [PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: QualityMeasureSnapshot
    validation_priorities: [1, 2, 3, 8, 10, 16]
    transitions: ["QualityMeasureSnapshot.status DRAFT -> CERTIFIED"]
    side_effects: ["certified_at := clock_now; certified_by_user_id := X-User-ID; counts and rates frozen and permanently excluded from calc quality_measure_rates recomputation; increments snapshot.version"]
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_SNAPSHOT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_SEGREGATION_OF_DUTIES_VIOLATION, ERR_EMPTY_MEASURE_DENOMINATOR, ERR_MEASURE_PERIOD_NOT_CLOSED, ERR_BUNDLE_NOT_CLOSED]


  # --- flat reverse-reachability lists (FK discovery channel for the four
  #     children whose only list surface was a nested sub-resource) ---------
  - method: GET
    path: "/staff-members"
    description: "Filtered list providing reverse reachability for StaffMember.unit_id at the collection root (the nested /obstetric-units/{unitId}/staff-members form stays available). Ordered created_at ASC."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer]
    code: 200
    input: ["unit_id?", "staff_role?", "employment_status?", "drill_currency_state?", "or_circulating_qualified?", "limit?", "offset?"]
    input_types: { unit_id: "string, optional", staff_role: "enum RN_LABOR_DELIVERY|OB_ATTENDING|CERTIFIED_NURSE_MIDWIFE|ANESTHESIOLOGIST|SURGICAL_TECH|NEONATAL_RESUSCITATOR, optional", employment_status: "enum ACTIVE|ON_LEAVE|INACTIVE, optional", drill_currency_state: "enum CURRENT|LAPSED, optional", or_circulating_qualified: "boolean, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: StaffMember[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/bundle-checklist-items"
    description: "Filtered list providing reverse reachability for BundleChecklistItem.activation_id and BundleChecklistItem.performed_by_staff_id. The performed_by_staff_id filter is the audit channel for SOD-1: it enumerates every step a StaffMember.id documented before a close-debrief is attempted. Ordered activation_id ASC, then step_sequence ASC."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: ["activation_id?", "performed_by_staff_id?", "status?", "stage_gate?", "step_code?", "limit?", "offset?"]
    input_types: { activation_id: "string, optional", performed_by_staff_id: "string, optional", status: "enum PENDING|COMPLETED|LATE_COMPLETED|MISSED|NOT_APPLICABLE, optional", stage_gate: "integer 1..3, optional", step_code: "enum QBL_MEASURE|UTEROTONIC_GIVEN|TYPE_AND_SCREEN|MTP_ACTIVATED|ANTIHYPERTENSIVE_GIVEN|MAGNESIUM_LOADED|REPEAT_BP|OB_AT_BEDSIDE, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: BundleChecklistItem[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/bundle-checklist-items/{itemId}"
    description: "Reads one BundleChecklistItem at the collection root with both due dates (due_at_activation_anchored authoritative, due_at_sequence_anchored advisory), completed_at, minutes_from_activation and performed_by_staff_id. Same row as the nested /bundle-activations/{activationId}/checklist-items/{itemId} form."
    roles: [ChargeNurse, BedsideNurse, ObstetricianAttending, PerinatalSafetyOfficer]
    code: 200
    input: []
    input_types: {}
    output: BundleChecklistItem
    validation_priorities: [1, 2, 3]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_CHECKLIST_ITEM_NOT_FOUND]

  - method: GET
    path: "/cesarean-readiness-drills"
    description: "Filtered list providing reverse reachability for CesareanReadinessDrill.unit_id and CesareanReadinessDrill.documented_by_staff_id (the SOD-2 audit channel). Ordered scheduled_for_utc ASC, tie-break created_at ASC."
    roles: [ChargeNurse, ObstetricianAttending, AnesthesiaLead, PerinatalSafetyOfficer]
    code: 200
    input: ["unit_id?", "documented_by_staff_id?", "participant_staff_id?", "status?", "drill_type?", "limit?", "offset?"]
    input_types: { unit_id: "string, optional", documented_by_staff_id: "string, optional", participant_staff_id: "string, optional — matches drills whose participant_staff_ids array contains this id", status: "enum SCHEDULED|IN_PROGRESS|DOCUMENTED|VALIDATED|INVALIDATED|ABANDONED, optional", drill_type: "enum DECISION_TO_INCISION|HEMORRHAGE_STAGE_2|ECLAMPSIA, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: CesareanReadinessDrill[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]

  - method: GET
    path: "/quality-measure-snapshots"
    description: "Filtered list providing reverse reachability for QualityMeasureSnapshot.unit_id and the self-referential QualityMeasureSnapshot.superseded_by_snapshot_id. Ordered period_start_utc ASC, tie-break created_at ASC."
    roles: [PerinatalSafetyOfficer, ChargeNurse]
    code: 200
    input: ["unit_id?", "superseded_by_snapshot_id?", "status?", "limit?", "offset?"]
    input_types: { unit_id: "string, optional", superseded_by_snapshot_id: "string, optional", status: "enum DRAFT|CERTIFIED|SUPERSEDED, optional", limit: "integer 1..100, optional, default 10", offset: "integer >= 0, optional, default 0" }
    output: QualityMeasureSnapshot[]
    validation_priorities: [1, 2, 5]
    transitions: []
    side_effects: []
    error_ids: [ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_INSUFFICIENT_PERMISSIONS, ERR_INVALID_FIELD_VALUE]
# =============================================================================
# §1.6 Error Code Catalog  (116 ids)
# Ordering mirrors the §1.4 validation ladder so that "which error wins" is
# readable top-to-bottom: auth -> existence -> field -> OCC -> scoping ->
# state -> context-required -> SoD -> clinical safety -> referential ->
# uniqueness/interval -> temporal -> capacity -> reporting.
# Every id below is raised by at least one §1.5 endpoint (`error_ids:`) and is
# reachable from an empty DB through the §1.5 surface alone.
# HTTP distribution: 400 x6, 403 x2, 404 x15, 409 x49, 412 x3, 422 x41.
# =============================================================================
errors:

  # --- auth (priority 1-2) ---------------------------------------------------
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header absent, empty, or X-User-Role is not one of the six §1.7 roles"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting X-User-Role is not listed in the called endpoint's §1.5 roles"

  # --- existence, path ids (priority 3) and body ids (priority 4) -----------
  - id: ERR_UNIT_NOT_FOUND
    http: 404
    condition: "unitId in the path, or unit_id in the body, matches no ObstetricUnit row"
  - id: ERR_BED_NOT_FOUND
    http: 404
    condition: "bedId in the path, or bed_id in the body, matches no Bed row"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "staffId in the path, or any staff id in the body (staff_id, performed_by_staff_id, interpreted_by_staff_id, documented_by_staff_id, facilitator_staff_id, target_staff_id, participant_staff_ids, mobilized staff ids), matches no StaffMember row"
  - id: ERR_SHIFT_NOT_FOUND
    http: 404
    condition: "shiftId in the path, or shift_assignment_id / relieving_shift_id in the body, matches no ShiftAssignment row"
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: "encounterId in the path, or encounter_id in the body, matches no LaborEncounter row"
  - id: ERR_CARE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignmentId in the path matches no CareAssignment row"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "bookingId in the path, or induction_booking_id in the body, matches no InductionBooking row"
  - id: ERR_ACTIVATION_NOT_FOUND
    http: 404
    condition: "activationId in the path, or activation_id in the body, matches no SafetyBundleActivation row"
  - id: ERR_CHECKLIST_ITEM_NOT_FOUND
    http: 404
    condition: "itemId in the path matches no BundleChecklistItem row"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessmentId in the path, or supersedes_assessment_id in the body, matches no FetalMonitoringAssessment row"
  - id: ERR_CESAREAN_EVENT_NOT_FOUND
    http: 404
    condition: "eventId in the path, or emergency_cesarean_event_id in the body, matches no EmergencyCesareanEvent row"
  - id: ERR_DRILL_NOT_FOUND
    http: 404
    condition: "drillId in the path matches no CesareanReadinessDrill row"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "reviewId in the path matches no NewbornComplicationReview row"
  - id: ERR_PASS_NOT_FOUND
    http: 404
    condition: "passId in the path matches no SupportPersonPass row"
  - id: ERR_SNAPSHOT_NOT_FOUND
    http: 404
    condition: "snapshotId in the path matches no QualityMeasureSnapshot row"

  # --- field shape (priority 5) --------------------------------------------
  - id: ERR_INVALID_FIELD_VALUE
    http: 400
    condition: "A field violates its §1.1 declared type, enum membership, or numeric/string range (gestational_age_weeks 20..44, parity >= 0, fetus_count >= 1, systolic 60..300, diastolic 30..200, quantitative_blood_loss_ml >= 0, target_tier 1..3, target_stage 2..3, reason/notes length bounds, limit 1..100, offset >= 0)"

  # --- optimistic concurrency losers (priority 6) ---------------------------
  - id: ERR_STALE_ENCOUNTER_VERSION
    http: 412
    condition: "expected_encounter_version on POST /care-assignments != LaborEncounter.version at evaluation time (checked before any state or business rule)"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_unit_version on POST /induction-bookings/{bookingId}/hold-capacity or POST /obstetric-units/{unitId}/quality-measure-snapshots != ObstetricUnit.version at evaluation time"
  - id: ERR_STALE_ACTIVATION_VERSION
    http: 412
    condition: "expected_activation_version on POST /bundle-activations/{activationId}/rescind != SafetyBundleActivation.version at evaluation time"

  # --- cross-aggregate scoping (priority 7) --------------------------------
  - id: ERR_CROSS_UNIT_REFERENCE
    http: 422
    condition: "A referenced resource belongs to a different ObstetricUnit than the operation's subject (shift.unit_id != encounter.unit_id, bed.unit_id != encounter.unit_id, staff.unit_id != unit_id, item.activation_id != activationId)"

  # --- state machine: generic and encounter axes (priority 8-8.03) ---------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The subject's current status is not a declared `from:` state of the §1.2 edge this endpoint fires"
  - id: ERR_ENCOUNTER_PHASE_TERMINAL
    http: 409
    condition: "A clinical write targets a child of a LaborEncounter whose labor_phase IN {DISCHARGED, TRANSFERRED_OUT}"
  - id: ERR_UNIT_POSTURE_BLOCKS_OPERATION
    http: 409
    condition: "The unit's derived staffing_posture forbids the operation: DIVERT blocks admissions, phase advances and drill starts; INDUCTION_FROZEN or DIVERT blocks induction hold/confirm/admit; any posture other than OPEN blocks a PATIENT_REQUEST-class hold"
  - id: ERR_ENCOUNTER_COVERAGE_INSUFFICIENT
    http: 409
    condition: "Advancing labor_phase to LATENT or ACTIVE_FIRST_STAGE while staffing_state is below the phase floor (staffing_state NOT IN {RATIO_COVERED, ONE_TO_ONE_COVERED})"
  - id: ERR_ONE_TO_ONE_COVERAGE_REQUIRED
    http: 409
    condition: "Advancing labor_phase to SECOND_STAGE while staffing_state != ONE_TO_ONE_COVERED"

  # --- state machine: blocking children on exit (priority 8.04) -----------
  - id: ERR_NEWBORN_REVIEW_OPEN
    http: 409
    condition: "Discharge attempted while any NewbornComplicationReview on the encounter is not CLOSED (evaluated first in the 8.04 order)"
  - id: ERR_BUNDLE_NOT_CLOSED
    http: 409
    condition: "Discharge attempted while any SafetyBundleActivation on the encounter is NOT IN {CLOSED, RESCINDED}; also raised by snapshot certification when any activation of the delivery cohort is still in a non-terminal status"
  - id: ERR_SUPPORT_PASS_STILL_PRESENT
    http: 409
    condition: "Discharge attempted while any SupportPersonPass on the encounter is NOT IN {CHECKED_OUT, REVOKED, EXPIRED}"
  - id: ERR_CARE_ASSIGNMENT_STILL_ACTIVE
    http: 409
    condition: "Discharge attempted while the encounter's staffing_state != RELEASED (at least one ACTIVE CareAssignment remains)"
  - id: ERR_CESAREAN_EVENT_IN_PROGRESS
    http: 409
    condition: "An EmergencyCesareanEvent on the encounter is still in the operating room, per the caller's own window: advance-phase to POSTPARTUM_RECOVERY rejects status IN {DECISION_DECLARED, TEAM_MOBILIZED, INCISION_RECORDED}; transfer-out and fetal-escalation resolve reject status IN {TEAM_MOBILIZED, INCISION_RECORDED}; a stage-3 bundle resolve requires the minted event to be IN {DELIVERED, REVIEW_PENDING, CLOSED, ABORTED_TO_VAGINAL}"
  - id: ERR_BUNDLE_STAGE_BLOCKS_TRANSFER
    http: 409
    condition: "Transfer-out attempted while a SafetyBundleActivation on the encounter has status IN {STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION}"

  # --- state machine: prerequisite children and bundle uniqueness (8.05-8.06)
  - id: ERR_CHECKLIST_STAGE_INCOMPLETE
    http: 409
    condition: "Stage escalation attempted while a BundleChecklistItem of a lower stage_gate is not terminal (stage 2 requires every stage_gate == 1 item, stage 3 requires every stage_gate <= 2 item, in status IN {COMPLETED, LATE_COMPLETED, MISSED})"
  - id: ERR_CHECKLIST_STAGE_NOT_REACHED
    http: 409
    condition: "A BundleChecklistItem complete arrives before the activation has reached that item's stage_gate (item.stage_gate > activation.highest_stage_reached)"
  - id: ERR_BUNDLE_ALREADY_ACTIVE
    http: 409
    condition: "A second SafetyBundleActivation for the same (encounter_id, bundle_type) while an existing one is in a non-terminal status IN {ACTIVATED, STAGE_1_IN_PROGRESS, STAGE_2_ESCALATED, STAGE_3_MASSIVE_TRANSFUSION, CONTROLLED, DEBRIEF_PENDING}"

  # --- state machine: bed lifecycle (priority 8.07) -------------------------
  - id: ERR_OR_BED_UNAVAILABLE
    http: 409
    condition: "The Bed named by mobilize-team has bed_type == OR but status != AVAILABLE"
  - id: ERR_BED_HOLD_MISMATCH
    http: 409
    condition: "Bed.status != HELD or Bed.held_booking_id != this booking on an induction admit, or the releasing booking is not the one named by held_booking_id"
  - id: ERR_BED_NOT_RELEASABLE
    http: 409
    condition: "PATCH /beds/{bedId} to BLOCKED or AVAILABLE from a status NOT IN {AVAILABLE, BLOCKED} — a HELD, OCCUPIED or TURNOVER bed cannot be flipped by hand"
  - id: ERR_BED_HAS_FUTURE_HOLDS
    http: 409
    condition: "DELETE /beds/{bedId} (close) while any InductionBooking on that bed has status IN {CAPACITY_HELD, CONFIRMED, ADMITTED}"
  - id: ERR_ENCOUNTER_ALREADY_IN_BED
    http: 409
    condition: "POST /labor-encounters/{encounterId}/assign-bed while encounter.bed_id is already non-null"

  # --- state machine: shift and coverage lifecycle (priority 8.08) ---------
  - id: ERR_SHIFT_NOT_ACTIVE
    http: 409
    condition: "A CareAssignment names a ShiftAssignment whose status != ACTIVE, or whose window fails shift_start_utc <= clock_now < shift_end_utc"
  - id: ERR_SHIFT_HAS_ACTIVE_COVERAGE
    http: 409
    condition: "Shift cancel attempted while at least one CareAssignment on that shift has status == ACTIVE"
  - id: ERR_RELIEVING_SHIFT_INELIGIBLE
    http: 409
    condition: "relieving_shift_id is not an ACTIVE ShiftAssignment of the same unit_id and role_slot with a different staff_id than the outgoing shift"
  - id: ERR_SHIFT_WINDOW_NOT_CURRENT
    http: 409
    condition: "Shift activation attempted outside the shift's own window (clock_now < shift_start_utc or clock_now >= shift_end_utc)"

  # --- state machine: induction lifecycle (priority 8.09) ------------------
  - id: ERR_INDUCTION_HOLD_EXPIRED
    http: 409
    condition: "Confirm arrives after the capacity hold's TTL: clock_now > hold_expires_at (hold_expires_at = hold_granted_at + HOLD_TTL_MINUTES 120)"
  - id: ERR_INDUCTION_BUMP_LIMIT_REACHED
    http: 409
    condition: "Bump attempted while bump_count >= BUMP_ESCALATION_LIMIT (2)"
  - id: ERR_INDUCTION_NOT_BUMPABLE
    http: 409
    condition: "Bump attempted on a booking whose priority_class == MEDICALLY_INDICATED; the automatic sweep bump only ever selects priority_class IN {ELECTIVE_39_WEEK, PATIENT_REQUEST}"
  - id: ERR_INDUCTION_WINDOW_PASSED
    http: 409
    condition: "Requeue attempted once requested_start_utc <= clock_now — the slot is already in the past"
  - id: ERR_INDUCTION_ALREADY_ADMITTED
    http: 409
    condition: "Cancel attempted on a booking whose status == ADMITTED"

  # --- state machine: chain / loop bounds (priority 8.10) ------------------
  - id: ERR_ESCALATION_TIER_SKIPPED
    http: 409
    condition: "target_tier != assessment.escalation_tier_high_water + 1, or escalation_status is not the chain's current step for that tier — the notify chain may not be jumped"
  - id: ERR_ESCALATION_NOT_STARTED
    http: 409
    condition: "Escalation resolve attempted while escalation_tier_high_water == 0 (nothing was ever escalated)"
  - id: ERR_CESAREAN_ALREADY_INCISED
    http: 409
    condition: "abort-to-vaginal attempted once incision_at is non-null"
  - id: ERR_DRILL_NOT_ABANDONABLE
    http: 409
    condition: "Drill abandon attempted from a status NOT IN {SCHEDULED, IN_PROGRESS}"
  - id: ERR_BUNDLE_STAGE_BLOCKS_RESCIND
    http: 409
    condition: "Rescind attempted while highest_stage_reached >= 2 — a bundle that reached stage 2 or 3 is a real event and must be closed, not erased"
  - id: ERR_REVIEW_REWORK_LIMIT_REACHED
    http: 409
    condition: "request-rework attempted while rework_count >= REWORK_LIMIT (2)"
  - id: ERR_DRILL_REVISION_LIMIT_REACHED
    http: 409
    condition: "Re-documentation from INVALIDATED attempted while revision_count >= DRILL_REVISION_LIMIT (2)"
  - id: ERR_SUPPORT_REENTRY_LIMIT_REACHED
    http: 409
    condition: "check-in from CHECKED_OUT attempted while reentry_count >= REENTRY_LIMIT (3)"

  # --- context-required payload fields (priority 9) -----------------------
  - id: ERR_RESCIND_REASON_REQUIRED
    http: 422
    condition: "rescind_reason absent or outside 10..500 chars on POST /bundle-activations/{activationId}/rescind"
  - id: ERR_INVALIDATION_REASON_REQUIRED
    http: 422
    condition: "invalidation_reason absent or outside 10..500 chars on POST /cesarean-readiness-drills/{drillId}/invalidate"
  - id: ERR_DEBRIEF_NOTES_REQUIRED
    http: 422
    condition: "debrief_notes absent or outside 40..2000 chars on a DEBRIEF_PENDING close-debrief, or findings_summary absent on POST /newborn-complication-reviews/{reviewId}/submit-findings"
  - id: ERR_CONTRIBUTING_FACTORS_REQUIRED
    http: 422
    condition: "contributing_factor_codes absent or an empty array on review submit-findings or review close"
  - id: ERR_DELIVERY_MODE_REQUIRED
    http: 422
    condition: "delivery_mode absent on the advance-phase call whose target_phase == THIRD_STAGE_DELIVERED"

  # --- segregation of duties (priority 10) --------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 403
    condition: "The acting X-User-ID is a party to the work being reviewed: close-debrief by a checklist performed_by_staff_id; drill validate by documented_by_staff_id; review schedule-debrief naming a facilitator_staff_id who held a CareAssignment on the encounter, or request-rework / close by the facilitator or a care participant; emergency-cesarean close by a member of mobilized_staff_ids; snapshot certify by the facilitator of any NewbornComplicationReview inside the reporting window"

  # --- clinical safety: staff credentialing and competency (11.1-11.2) -----
  - id: ERR_STAFF_CREDENTIAL_EXPIRED
    http: 422
    condition: "A StaffMember drawn into the operation has employment_status != ACTIVE, or credential_expires_at <= clock_now (strict >, so an expiry exactly at clock_now FAILS)"
  - id: ERR_ROLE_SLOT_NOT_ELIGIBLE
    http: 422
    condition: "A ONE_TO_ONE CareAssignment references a ShiftAssignment whose role_slot NOT IN {BEDSIDE, ONE_TO_ONE_FLOAT}"
  - id: ERR_MONITORING_CERT_INSUFFICIENT
    http: 422
    condition: "StaffMember.fetal_monitoring_cert_level NOT IN {BASIC, ADVANCED} for a care assignment or a monitoring interpretation, or != ADVANCED when the encounter's acuity_tier == TIER_IV"
  - id: ERR_STAFF_NOT_EXCLUSIVELY_AVAILABLE
    http: 422
    condition: "A ONE_TO_ONE CareAssignment names a staff member who already holds an ACTIVE CareAssignment on a different encounter"
  - id: ERR_OR_STANDBY_NOT_QUALIFIED
    http: 422
    condition: "Activating a role_slot == OR_STANDBY shift whose staff member has or_circulating_qualified == false or drill_currency_state == LAPSED"
  - id: ERR_ESCALATION_TARGET_INELIGIBLE
    http: 422
    condition: "notified_staff_id does not hold the tier's required role with an ACTIVE ShiftAssignment on the encounter's unit (tier 1 requires role_slot == CHARGE; tier 2 requires staff_role == OB_ATTENDING)"

  # --- clinical safety: fetal monitoring gates (priority 11.3) -------------
  - id: ERR_FETAL_ASSESSMENT_STALE
    http: 422
    condition: "The latest FetalMonitoringAssessment on the encounter is older than the target phase's freshness window (30 minutes for ACTIVE_FIRST_STAGE, 15 for SECOND_STAGE, boundary inclusive), or none exists"
  - id: ERR_FETAL_ESCALATION_UNRESOLVED
    http: 422
    condition: "A FetalMonitoringAssessment on the encounter sits in escalation_status NOT IN {NOT_REQUIRED, RESOLVED, TIMED_OUT_BREACH} when the phase advance is attempted"
  - id: ERR_FETAL_CATEGORY_BLOCKS_PHASE
    http: 422
    condition: "Advance to SECOND_STAGE while the latest assessment category == CATEGORY_III and no EmergencyCesareanEvent has been declared on the encounter"
  - id: ERR_FETAL_CATEGORY_BLOCKS_ABORT
    http: 422
    condition: "abort-to-vaginal while the latest assessment category == CATEGORY_III — the tracing does not support abandoning the cesarean"
  - id: ERR_ESCALATION_CATEGORY_INSUFFICIENT
    http: 422
    condition: "target_tier == 3 while the assessment's category != CATEGORY_III"

  # --- clinical safety: cesarean readiness and drills (priority 11.4) -----
  - id: ERR_CESAREAN_READINESS_NOT_MET
    http: 422
    condition: "unit.cesarean_readiness_state == NOT_READY on an induction confirm or a SECOND_STAGE advance (both require IN {READY, DEGRADED}), or on a mobilize-team whose urgency_class == CATEGORY_2_URGENT; urgency_class == CATEGORY_1_CRASH bypasses this check"
  - id: ERR_CESAREAN_TEAM_INCOMPLETE
    http: 422
    condition: "staff_ids on mobilize-team lacks a staff_role == ANESTHESIOLOGIST, a SURGICAL_TECH with or_circulating_qualified == true, or a NEONATAL_RESUSCITATOR, each holding an ACTIVE ShiftAssignment on the unit"
  - id: ERR_OR_STANDBY_NOT_STAFFED
    http: 422
    condition: "Stage-3 bundle escalation or tier-3 escalation activation attempted while the unit has no ACTIVE role_slot == OR_STANDBY ShiftAssignment"
  - id: ERR_DRILL_PARTICIPANTS_INSUFFICIENT
    http: 422
    condition: "participant_staff_ids on drill document lacks at least one staff_role == OB_ATTENDING or at least one ANESTHESIOLOGIST"
  - id: ERR_DRILL_PERFORMANCE_FAILED
    http: 422
    condition: "Drill validate attempted with measured_d2i_minutes > DRILL_PASS_MINUTES (30; exactly 30 PASSES)"

  # --- clinical safety: bundle criteria (priority 11.5) -------------------
  - id: ERR_ACTIVATION_CRITERIA_NOT_MET
    http: 422
    condition: "The declared activation_trigger is not objectively satisfied: QBL_THRESHOLD with quantitative_blood_loss_ml < ACTIVATION_QBL_ML (1000), or BP_THRESHOLD with systolic_mmhg < 160 AND diastolic_mmhg < 110 (CLINICIAN_JUDGMENT requires neither)"
  - id: ERR_BUNDLE_STAGE_CRITERIA_NOT_MET
    http: 422
    condition: "The stage threshold is unmet: stage 2 needs quantitative_blood_loss_ml >= STAGE_2_QBL_ML (1500) for OBSTETRIC_HEMORRHAGE or a second severe-range reading for SEVERE_HYPERTENSION; stage 3 needs bundle_type == OBSTETRIC_HEMORRHAGE with quantitative_blood_loss_ml >= STAGE_3_QBL_ML (2500)"
  - id: ERR_BUNDLE_NOT_CONTROLLED
    http: 422
    condition: "Resolve of an OBSTETRIC_HEMORRHAGE bundle supplies a quantitative_blood_loss_ml greater than the stage-2 reading — bleeding is still increasing"
  - id: ERR_BUNDLE_SCORE_NOT_COMPUTED
    http: 422
    condition: "close-debrief attempted while timeliness_score is still null"

  # --- clinical safety: visitation (priority 11.6) ------------------------
  - id: ERR_SUPPORT_PASS_EXPIRED
    http: 422
    condition: "A check-in arrives at clock_now > pass.valid_until"
  - id: ERR_DOULA_CREDENTIAL_EXPIRED
    http: 422
    condition: "A credential_type == DOULA_CERTIFIED pass is issued or checked in while doula_certification_expires_at <= clock_now"
  - id: ERR_VISITATION_RESTRICTED_BY_PROCEDURE
    http: 422
    condition: "A check-in is attempted while an EmergencyCesareanEvent on the encounter has status IN {TEAM_MOBILIZED, INCISION_RECORDED}, and the pass is not a DOULA_CERTIFIED pass with or_credentialed == true"

  # --- clinical safety: delivery-mode coherence (priority 11.7) ----------
  - id: ERR_CESAREAN_EVENT_NOT_DELIVERED
    http: 422
    condition: "A cesarean delivery_mode is recorded without an EmergencyCesareanEvent on the encounter in status IN {DELIVERED, REVIEW_PENDING, CLOSED}"
  - id: ERR_DELIVERY_MODE_CONFLICTS_HISTORY
    http: 422
    condition: "delivery_mode == CESAREAN_PRIMARY while encounter.prior_cesarean == true — a repeat cesarean can never be primary"
  - id: ERR_EPISIOTOMY_MODE_CONFLICT
    http: 422
    condition: "episiotomy_performed == true while delivery_mode NOT IN {SPONTANEOUS_VAGINAL, OPERATIVE_VAGINAL}"

  # --- clinical safety: elective induction compliance (priority 11.8) ----
  - id: ERR_ELECTIVE_INDUCTION_GESTATIONAL_AGE
    http: 422
    condition: "A priority_class == ELECTIVE_39_WEEK booking is held or confirmed with gestational_age_weeks < 39 (boundary inclusive: exactly 39 PASSES); an indication_code == ELECTIVE_NO_INDICATION booking under 39 weeks can never leave REQUESTED"

  # --- referential: acting clinician attachment (priority 12) ------------
  - id: ERR_PERFORMER_NOT_ON_CASE
    http: 422
    condition: "The named clinician is not attached to the case: a checklist performed_by_staff_id or assessment interpreted_by_staff_id holding neither an ACTIVE CareAssignment on the encounter nor an ACTIVE role_slot IN {CHARGE, OR_STANDBY} shift on the unit, or a drill documented_by_staff_id absent from participant_staff_ids"

  # --- uniqueness and interval collisions (priority 13.1-13.3) ------------
  - id: ERR_DUPLICATE_UNIT_NAME
    http: 409
    condition: "POST /obstetric-units or PATCH /obstetric-units/{unitId} with a unit_name already held by another ObstetricUnit"
  - id: ERR_DUPLICATE_BED_LABEL
    http: 409
    condition: "A bed_label already exists on the same unit_id among Bed rows with status != CLOSED"
  - id: ERR_DUPLICATE_PATIENT_RECORD_CODE
    http: 409
    condition: "A patient_record_code already exists on the same unit_id among LaborEncounter rows whose labor_phase NOT IN {DISCHARGED, TRANSFERRED_OUT} (also raised by an induction admit that mints such an encounter)"
  - id: ERR_SHIFT_WINDOW_OVERLAP
    http: 409
    condition: "A new ShiftAssignment's [shift_start_utc, shift_end_utc) overlaps an existing shift of the same staff_id with status IN {SCHEDULED, ACTIVE}; HALF-OPEN semantics — touching endpoints (previous end == new start) do NOT overlap"
  - id: ERR_SHIFT_WINDOW_TOO_LONG
    http: 409
    condition: "shift_end_utc - shift_start_utc > MAX_SHIFT_MINUTES (720)"
  - id: ERR_BED_TURNOVER_CONFLICT
    http: 409
    condition: "The requested bed window [requested_start_utc, requested_start_utc + expected_labor_minutes] collides with an existing InductionBooking on the same bed with status IN {CAPACITY_HELD, CONFIRMED, ADMITTED} whose window is [requested_start_utc, requested_start_utc + projected_occupancy_minutes]; CLOSED semantics — windows that merely touch DO collide"
  - id: ERR_BED_TYPE_NOT_ELIGIBLE
    http: 409
    condition: "The named Bed's bed_type is not the one the operation requires (LDR for induction holds and encounter bed assignment, OR for cesarean team mobilization)"
  - id: ERR_ENCOUNTER_BED_NOT_ASSIGNED
    http: 409
    condition: "An encounter leaving PRE_ADMISSION has no bed_id, or its Bed has status != OCCUPIED or bed_type != LDR"

  # --- temporal: supplied clinical timestamps (priority 14.1) -------------
  - id: ERR_CHECKLIST_TIMESTAMP_OUT_OF_RANGE
    http: 400
    condition: "completed_at violates activation.activated_at <= completed_at <= clock_now"
  - id: ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE
    http: 400
    condition: "A cesarean event timestamp violates decision_at < incision_at <= delivery_at <= clock_now"
  - id: ERR_DRILL_TIMESTAMP_OUT_OF_RANGE
    http: 400
    condition: "Drill timings violate decision_at < incision_at <= clock_now"
  - id: ERR_ASSESSMENT_TIMESTAMP_OUT_OF_RANGE
    http: 400
    condition: "A supplied assessed_at violates encounter.admitted_at <= assessed_at <= clock_now"

  # --- temporal: windows and deadlines (priority 14.2) -------------------
  - id: ERR_ESCALATION_WINDOW_EXPIRED
    http: 422
    condition: "An escalate arrives at clock_now > assessment.escalation_due_at"
  - id: ERR_DEBRIEF_WINDOW_VIOLATION
    http: 422
    condition: "debrief_scheduled_for_utc violates clock_now <= debrief_scheduled_for_utc <= review.debrief_due_at"
  - id: ERR_DEBRIEF_NOT_HELD
    http: 422
    condition: "submit-findings arrives while clock_now < review.debrief_scheduled_for_utc"
  - id: ERR_DRILL_NOT_DUE
    http: 422
    condition: "Drill start attempted while clock_now < drill.scheduled_for_utc"
  - id: ERR_INDUCTION_ADMIT_TOO_EARLY
    http: 422
    condition: "Admit attempted while clock_now < requested_start_utc - ADMIT_EARLY_GRACE_MINUTES (30)"
  - id: ERR_BOOKING_START_IN_PAST
    http: 422
    condition: "POST /induction-bookings with requested_start_utc <= clock_now"
  - id: ERR_MEASURE_PERIOD_INVALID
    http: 422
    condition: "A snapshot window violates period_start_utc < period_end_utc"

  # --- capacity and quota, evaluated last (priority 15) ------------------
  - id: ERR_STAFF_ACUITY_CAPACITY_EXCEEDED
    http: 409
    condition: "shift.assigned_acuity_load_units + calc care_assignment_unit_debit > shift.capacity_units_effective (boundary inclusive: landing exactly on capacity PASSES)"
  - id: ERR_INDUCTION_CAPACITY_EXCEEDED
    http: 409
    condition: "The UTC day's committed + held bed-minutes + this booking's projected_occupancy_minutes > unit.max_daily_induction_bed_minutes (boundary inclusive: landing exactly on the budget PASSES)"
  - id: ERR_SUPPORT_OCCUPANCY_EXCEEDED
    http: 409
    condition: "Checked-in occupancy + 1 > the calc support_person_occupancy allowance for the encounter (a zero allowance rejects even a certified doula)"

  # --- reporting completeness (priority 16) -----------------------------
  - id: ERR_EMPTY_MEASURE_DENOMINATOR
    http: 409
    condition: "Snapshot certification attempted while ntsv_denominator < 1 or episiotomy_denominator < 1 — an empty cohort is readable as DRAFT but never certifiable"
  - id: ERR_MEASURE_PERIOD_NOT_CLOSED
    http: 409
    condition: "Snapshot certification attempted while period_end_utc > clock_now — the reporting period is still open"

# =============================================================================
# §1.7 RBAC Matrix  (6 roles, role_model: segregation_of_duties)
#
# Five of the six roles are backed by StaffMember: when X-User-Role is one of
# them, X-User-ID equals a StaffMember.id on the unit being operated on, and
# every "the acting clinician must / must not be X" rule in §1.2/§1.4 compares
# X-User-ID against a StaffMember.id field (performed_by_staff_id,
# documented_by_staff_id, facilitator_staff_id, mobilized_staff_ids,
# CareAssignment.staff_id).  PatientAccessCoordinator is the only `opaque`
# role: it books beds and issues visitor passes and is never compared to a
# StaffMember.id anywhere in the scaffold.
#
# The six mutually-exclusive duty pairs enforced by ERR_SEGREGATION_OF_DUTIES_
# VIOLATION (403, §1.4 priority 10) — in every pair the SECOND step is refused
# when X-User-ID is a party to the FIRST:
#   SOD-1  complete a BundleChecklistItem        x  close-debrief that activation
#   SOD-2  document a CesareanReadinessDrill     x  validate that drill
#   SOD-3  hold a CareAssignment on an encounter x  be facilitator_staff_id of
#                                                   a NewbornComplicationReview
#                                                   on that encounter
#   SOD-4  facilitate a review (or hold a CareAssignment on its encounter)
#                                                x  close that review
#   SOD-5  appear in mobilized_staff_ids         x  close that EmergencyCesareanEvent
#   SOD-6  facilitate any review inside a snapshot's reporting window
#                                                x  certify that snapshot
# The pairs are enforced against StaffMember.id, NOT against role names: a
# clinician who acts as PerinatalSafetyOfficer for the sign-off is still the
# same StaffMember.id that performed the step, and is still refused.
# =============================================================================
roles:

  - name: ChargeNurse
    description: "Shift-by-shift owner of the unit's coverage: builds, activates, relieves and cancels ShiftAssignments, assigns and re-labels beds, creates and releases CareAssignments, drives the labor_phase ladder to discharge, admits confirmed inductions, runs readiness drills and opens/schedules newborn-complication debriefs."
    identity: "entity_backed:StaffMember"
    exclusive_operations:            # 14 endpoints only this role may call
      - "POST /shift-assignments/{shiftId}/activate"
      - "POST /shift-assignments/{shiftId}/relieve"
      - "POST /shift-assignments/{shiftId}/cancel"
      - "PATCH /beds/{bedId}"
      - "POST /labor-encounters/{encounterId}/assign-bed"
      - "POST /labor-encounters/{encounterId}/discharge"
      - "POST /care-assignments"
      - "POST /care-assignments/{assignmentId}/release"
      - "POST /induction-bookings/{bookingId}/admit"
      - "POST /cesarean-readiness-drills/{drillId}/start"
      - "POST /cesarean-readiness-drills/{drillId}/abandon"
      - "POST /newborn-complication-reviews/{reviewId}/schedule-debrief"
      - "POST /newborn-complication-reviews/{reviewId}/submit-findings"
      - "POST /support-person-passes/{passId}/revoke"
    shared_operations:               # 58 endpoints co-held with other roles
      - "POST /_clock/set_current_utc"
      - "GET /_clock"
      - "GET /obstetric-units"
      - "GET /obstetric-units/{unitId}"
      - "GET /obstetric-units/{unitId}/capacity-summary"
      - "GET /obstetric-units/{unitId}/coverage-report"
      - "GET /obstetric-units/{unitId}/readiness-report"
      - "POST /obstetric-units/{unitId}/capacity-sweep"
      - "POST /obstetric-units/{unitId}/staff-members"
      - "GET /obstetric-units/{unitId}/staff-members"
      - "GET /staff-members/{staffId}"
      - "PATCH /staff-members/{staffId}"
      - "POST /shift-assignments"
      - "GET /shift-assignments"
      - "GET /shift-assignments/{shiftId}"
      - "POST /obstetric-units/{unitId}/beds"
      - "GET /obstetric-units/{unitId}/beds"
      - "GET /beds"
      - "GET /beds/{bedId}"
      - "POST /labor-encounters"
      - "GET /labor-encounters"
      - "GET /labor-encounters/{encounterId}"
      - "GET /labor-encounters/{encounterId}/coverage-summary"
      - "POST /labor-encounters/{encounterId}/advance-phase"
      - "GET /care-assignments"
      - "GET /care-assignments/{assignmentId}"
      - "GET /induction-bookings"
      - "GET /induction-bookings/{bookingId}"
      - "POST /induction-bookings/{bookingId}/bump"
      - "GET /bundle-activations"
      - "GET /bundle-activations/{activationId}"
      - "GET /bundle-activations/{activationId}/checklist-items"
