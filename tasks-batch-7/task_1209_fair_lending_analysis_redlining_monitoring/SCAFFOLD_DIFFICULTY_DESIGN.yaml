  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cycle on MatchedPairReview
  # (DISPUTED -> INITIAL_REVIEWED) and cycle + child-driven auto-completion on
  # CorrectiveActionPlan. Different entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: matched_pair_dispute_rereview_cycle
        grounds:
          - state_machines.MatchedPairReview.DISPUTED_to_INITIAL_REVIEWED
          - state_machines.MatchedPairReview.INITIAL_REVIEWED_to_DISPUTED
          - state_machines.MatchedPairReview.INITIAL_REVIEWED_to_CONFIRMED
        distinguishing_aspect: |
          MatchedPairReview runs a revision cycle PENDING -> INITIAL_REVIEWED
          -> DISPUTED -> INITIAL_REVIEWED -> CONFIRMED: the re-review
          transition overwrites initial_outcome/initial_reviewer_user_id,
          proving the loop is a true cycle (not a one-way pipeline). Entity:
          MatchedPairReview.
        test_recipe:
          setup:
            - "Run R COMPUTED over 2 VALIDATED apps (1 CONTROL ORIGINATED @700 credit 700; 1 PROTECTED_1 DENIED credit 720, officer O1)"
            - "Manual finding F kind=DENIAL_DISPARITY in UNDER_REVIEW"
            - "MatchedPairReview MP created (explicit control), then INITIAL_REVIEWED with outcome DIFFERENTIAL_TREATMENT"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
