        distinguishing_aspect: |
          Priority 25 (business_referential) vs priority 30 (business_fiscal) on ONE
          report-creation call: period_quarter 2028Q1 is past the term end 2027-12-31
          AND closeout_sales_cents 900000 exceeds the hard limit floor(2000000 * 4000 /
          10000) == 800000. Both fire; the expected answer is ERR_PERIOD_OUTSIDE_TERM
          (422). The authorization window deliberately extends to 2028-12-31 so the
          intervening priority 24 check passes and cannot mask the pair.
