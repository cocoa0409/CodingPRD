      - name: lease_activation_requires_an_issued_permit_and_a_reached_start_date
        claim_type: precondition_enforcement
        grounds:
          - state_machines[PopupVenue].transitions[PERMIT_ISSUED -> LEASE_ACTIVE]
          - validations[priority 105]
          - errors[ERR_VENUE_INVALID_STATE]
          - errors[ERR_LEASE_START_NOT_REACHED]
        distinguishing_aspect: |
          PERMIT_ISSUED -> LEASE_ACTIVE carries two preconditions of different categories, and they
          are checked in priority order: the own-state gate (P70, ERR_VENUE_INVALID_STATE) fires
          before the clock gate (P105, ERR_LEASE_START_NOT_REACHED). A venue whose permit is still
          under review AND whose lease_start_date has not been reached must report the state error,
          not the clock error — and the clock error must be reachable on its own once the permit
          lands. Ordering is the whole claim.
        test_recipe:
          setup:
            - "A venue whose lease starts 2026-10-01 while the clock sits at 2026-08-01, submitted for permit but not yet decided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
              payload: { city_code: "AUS", site_name: "Warehouse 12", lease_start_date: "2026-10-01", lease_end_date: "2027-04-30", base_monthly_rent_cents: 3100000, buildout_allowance_cents: 900000, buildout_cap_cents: 2000000, requested_occupancy_load: 140, egress_width_cm: 320 }
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/permit-submissions"
              payload: { package_note: "assembly occupancy package" }
              as: VenueOpsManager
              as_user_id: "vom-1"
          trigger:
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
              captures: { first_error: $.data.error_id }
            - call: "POST /venues/${venue_id}/permit-decisions"
              payload: { decision: "ISSUED", note: "occupancy 140 granted" }
              as: SafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: VenueOpsManager
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues/${venue_id}/activate-lease"
              payload: {}
              as: VenueOpsManager
              as_user_id: "vom-1"
          assert:
            - "trigger 1 responds 409 with data.error_id == ERR_VENUE_INVALID_STATE: the status gate (P70) wins over the unreached start date (P105) even though BOTH preconditions fail"
            - "trigger 3 responds 409 with data.error_id == ERR_LEASE_START_NOT_REACHED — with the permit now ISSUED only the clock gate remains"
            - "trigger 5 still responds 409 ERR_LEASE_START_NOT_REACHED at 2026-09-30T23:59:59Z: the gate compares the clock's CALENDAR DATE against lease_start_date, and 2026-09-30 < 2026-10-01"
            - "trigger 7 responds 200 with data.status == LEASE_ACTIVE at exactly 2026-10-01T00:00:00Z — the boundary is inclusive"
            - "PopupVenue.${venue_id}.version == 4 after the walk — create 1, permit-submission 2, permit-decision 3, the successful activate-lease 4; the three refused activate calls never advanced it, so the version is 4 and not 7"

      - name: agreement_activation_repeated_is_rejected_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines[LicenseAgreement].transitions[DRAFT -> ACTIVE]
          - errors[ERR_AGREEMENT_INVALID_STATE]
          - endpoints[POST /license-agreements/{agreementId}/activate]
        distinguishing_aspect: |
          §1.2 declares no ACTIVE -> ACTIVE self-loop, so activate is NOT idempotent: the second
          identical call must be refused with ERR_AGREEMENT_INVALID_STATE rather than quietly
          returning 200 with the same row. The falsifiable side of the claim is the version — an
          implementation that treats the repeat as a no-op success will still have bumped the
          version, and one that re-runs the transition will have bumped it twice.
        test_recipe:
          setup:
            - "One DRAFT agreement whose term covers the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
