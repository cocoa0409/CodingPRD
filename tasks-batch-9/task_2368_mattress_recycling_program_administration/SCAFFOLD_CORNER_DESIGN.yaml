# =============================================================================
# task_2368 — §1.9 Scaffold Corner Design (Breadth Coverage Index)
#
# Walk of references/claim-extraction-guide.md against §1.1–§1.7 of SCAFFOLD.yaml.
# Corners already probed in depth by §1.8 carry `excluded_because` stubs instead of
# a `test_recipe`, citing the §1.8 instance by name.
#
# Reusable fixture shorthands referenced in `setup:` prose (each instance still
# spells out its own setup_api_calls):
#   CHAIN-P = CA program + ACTIVE MATTRESS 1100c rate from 2026-01-01 + registrant
#             + DRAFT 2026Q2 remittance (500 mattress, 0 foundation). Filing it on the
#             startup clock (2026-08-01) is NOT early, so fee_self_assessed_cents == 550000.
#   CHAIN-S = WA program + one ENROLLED NORTH collection site.
#   CHAIN-SH = CHAIN-S + NORTH hauler + CERTIFIED recycler + accepted 2026-08 volume
#             report of 320 + 190 units (units_on_hand 510).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: state_program_creation_returns_ledger_and_recommendation_envelope
        claim_type: Creation
        grounds:
          - endpoints["POST /state-programs"]
          - entities.StateProgram
          - calculations.fee_rate_recommendation
        distinguishing_aspect: "A single POST /state-programs with all required fields returns 201 and every computed ledger field already populated, not null."
        test_recipe:
          setup:
            - "Empty system on the startup clock (2026-08-01T00:00:00Z)."
          setup_api_calls: []
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          assert:
            - "Response: HTTP 201"
            - "StateProgram.${prog_id}.state_code == CA and program_name == California Mattress Recycling Program"
            - "StateProgram.${prog_id}.fee_collected_cents == 0 and site_credit_paid_cents == 0 and hauler_payment_paid_cents == 0"
            - "StateProgram.${prog_id}.reserve_balance_cents == 5000000"
            - "StateProgram.${prog_id}.reserve_coverage_months == 1.00"
            - "StateProgram.${prog_id}.recommended_rate_cents == 1075"
            - "StateProgram.${prog_id}.enforcement_posture == NORMAL and delinquent_registrant_count == 0"
            - "StateProgram.${prog_id}.version == 1"

      - name: collection_site_retrieval_returns_stored_and_zeroed_custody_fields
        claim_type: Retrieval
        grounds:
          - endpoints["GET /collection-sites/{id}"]
          - entities.CollectionSite
        distinguishing_aspect: "GET /collection-sites/{id} echoes the four stored input fields and reports all five custody buckets plus units_reported_total at 0 for a freshly applied site."
        test_recipe:
          setup:
            - "WA program with one APPLIED site (not yet enrolled)."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /collection-sites/${site_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Response: HTTP 200 with data.state_program_id == ${prog_wa_id}"
            - "data.operator_name == Puget Transfer Station and data.site_type == TRANSFER_STATION and data.region_code == NORTH"
            - "data.enrollment_status == APPLIED"
            - "data.units_on_hand == 0, units_in_transit == 0, units_at_recycler_count == 0, units_recycled_count == 0, units_written_off_count == 0, units_reported_total == 0"
            - "data.contamination_strike_count == 0 and data.infestation_quarantine_until == null and data.suspended_at == null"

      - name: fee_rate_schedule_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /fee-rate-schedules"]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three FOUNDATION schedules stored, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "CA program with three abutting PROPOSED FOUNDATION schedules: [2026-08-01, 2026-09-01), [2026-09-01, 2026-10-01), [2026-10-01, open) all at 900c (inside band [860, 1290])."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "FOUNDATION", fee_cents_per_unit: 900, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_ca_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v2: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "FOUNDATION", fee_cents_per_unit: 900, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_state_program_version: "${v2}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_ca_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v3: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "FOUNDATION", fee_cents_per_unit: 900, effective_from: "2026-10-01T00:00:00Z", expected_state_program_version: "${v3}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&unit_class=FOUNDATION&limit=2&offset=0"
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&unit_class=FOUNDATION&limit=2&offset=2"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "First list response: len(data.items) == 2, data.meta.total_count == 3, data.meta.has_more == true, data.meta.limit == 2, data.meta.offset == 0"
            - "Second list response: len(data.items) == 1, data.meta.total_count == 3, data.meta.has_more == false, data.meta.offset == 2"

      - name: unknown_state_program_id_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints["GET /state-programs/{id}"]
          - errors[ERR_STATE_PROGRAM_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A syntactically valid but unused UUID on GET /state-programs/{id} returns 404 ERR_STATE_PROGRAM_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "One CA program exists so the collection itself is non-empty."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "GET /state-programs/00000000-0000-4000-8000-000000000999"
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Response: HTTP 404 with data.error_id == ERR_STATE_PROGRAM_NOT_FOUND"

      - name: collection_site_create_missing_required_region_code_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints["POST /collection-sites"]
          - entities.CollectionSite.fields.region_code
          - validations[priority=25]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "region_code has source: input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and creates no CollectionSite row."
        test_recipe:
          setup:
            - "WA program exists."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
          trigger:
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "Response: HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /collection-sites?state_program_id=${prog_wa_id} returns data.meta.total_count == 0"

      - name: state_program_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.StateProgram.fields.forecast_other_revenue_cents
          - entities.StateProgram.fields.delinquency_alert_threshold
          - endpoints["POST /state-programs"]
          - calculations.fee_rate_recommendation
        distinguishing_aspect: "Omitting forecast_other_revenue_cents and delinquency_alert_threshold applies defaults 0 and 1, and the 0 default flows into the recommendation (recoverable 65000000 → base 1084 → recommended 1127) instead of being treated as null or as the CA figure 1075."
        test_recipe:
          setup:
            - "Empty system; the program is created with only the mandatory inputs (cost 60000000c, 60000 units, 3-month target, opening reserve 5000000c)."
          setup_api_calls: []
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "OR", program_name: "Oregon Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_or_id: $.data.id }
          assert:
            - "StateProgram.${prog_or_id}.forecast_other_revenue_cents == 0"
            - "StateProgram.${prog_or_id}.delinquency_alert_threshold == 1"
            - "StateProgram.${prog_or_id}.recommended_rate_cents == 1127 (base_rate_cents 1084 + 4% admin surcharge 43)"
            - "StateProgram.${prog_or_id}.reserve_coverage_months == 1.00"

      - name: hauler_omitted_max_concurrent_routes_defaults_to_two
        claim_type: Defaults
        grounds:
          - entities.Hauler.fields.max_concurrent_routes
          - endpoints["POST /haulers"]
          - calculations.hauler_window_conflict
        distinguishing_aspect: "max_concurrent_routes is the only defaulted hauler field; omitting it yields 2, which is observable because two buffer-overlapping windows are accepted and the third is refused."
        test_recipe:
          setup:
            - "CHAIN-S plus a CERTIFIED recycler; the hauler is created without max_concurrent_routes."
            - "Site holds 510 on-hand units from an accepted 2026-08 volume report."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /recyclers"
              payload: { state_program_id: "${prog_wa_id}", facility_name: "Cascade Fiber Recovery", accepted_unit_classes: ["MATTRESS", "FOUNDATION"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { recycler_id: $.data.id }
            - call: "POST /recyclers/${recycler_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-08", units_mattress: 320, units_foundation: 190 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /haulers"
              payload: { state_program_id: "${prog_wa_id}", company_name: "Default Fleet Hauling", service_regions: ["NORTH"], per_unit_rate_cents: 450, per_km_rate_cents: 180, max_route_payment_cents: 200000 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { hauler_id: $.data.id }
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T09:00:00Z", pickup_window_end: "2026-08-05T10:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T10:30:00Z", pickup_window_end: "2026-08-05T11:00:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T11:15:00Z", pickup_window_end: "2026-08-05T11:45:00Z" }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
          assert:
            - "Hauler.${hauler_id}.max_concurrent_routes == 2"
            - "First two pickup-order responses: HTTP 201"
            - "Third pickup-order response: HTTP 409 with data.error_id == ERR_HAULER_WINDOW_CAPACITY_EXCEEDED"
            - "Hauler.${hauler_id}.active_route_count == 2"
            - "CollectionSite.${site_id}.units_on_hand == 310 and units_in_transit == 200"

      - name: volume_report_computed_credit_input_ignored_until_acceptance
        claim_type: Computed Fields
        grounds:
          - entities.VolumeReport.fields.credit_cents
          - entities.VolumeReport.fields.credited_units
          - endpoints["POST /collection-sites/{id}/volume-reports"]
          - calculations.site_volume_credit
        distinguishing_aspect: "credit_cents and credited_units are source: computed and only stamped at acceptance, so a submitted report reports 0 for both even though the server was handed a credit_cents value in the body."
        test_recipe:
          setup:
            - "CHAIN-S: WA program (site credit 305c/unit, bonus threshold 500) with one ENROLLED NORTH site."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Chinook Collection Site", site_type: "COLLECTION_SITE", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-08", units_mattress: 320, units_foundation: 190, credit_cents: 999999, credited_units: 12 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "After submission: VolumeReport.${vr_id}.credit_cents == 0 and credited_units == 0 and status == SUBMITTED"
            - "After acceptance: VolumeReport.${vr_id}.credited_units == 510 (not 12)"
            - "After acceptance: VolumeReport.${vr_id}.credit_cents == 163328 (not 999999)"
            - "CollectionSite.${site_id}.units_on_hand == 510"

      - name: pickup_order_system_fields_generated_and_client_values_input_ignored
        claim_type: System Fields
        grounds:
          - entities.PickupOrder.fields.fulfillment_status
          - entities.PickupOrder.fields.settlement_status
          - entities.PickupOrder.fields.hauler_auto_selected
          - response_envelope
        distinguishing_aspect: "id, created_at, updated_at, version and both status axes are server-generated on POST /pickup-orders; client-supplied fulfillment_status / settlement_status / id values in the body are ignored."
        test_recipe:
          setup:
            - "CHAIN-SH: WA program, ENROLLED NORTH site with 510 on-hand units, NORTH hauler (2 routes), CERTIFIED recycler."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /haulers"
              payload: { state_program_id: "${prog_wa_id}", company_name: "Sound Hauling Co", service_regions: ["NORTH"], per_unit_rate_cents: 450, per_km_rate_cents: 180, max_route_payment_cents: 200000, max_concurrent_routes: 2 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { hauler_id: $.data.id }
            - call: "POST /recyclers"
              payload: { state_program_id: "${prog_wa_id}", facility_name: "Cascade Fiber Recovery", accepted_unit_classes: ["MATTRESS", "FOUNDATION"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { recycler_id: $.data.id }
            - call: "POST /recyclers/${recycler_id}/certify"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /collection-sites/${site_id}/volume-reports"
              payload: { period_month: "2026-08", units_mattress: 320, units_foundation: 190 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { vr_id: $.data.id }
            - call: "POST /volume-reports/${vr_id}/accept"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /pickup-orders"
              payload: { collection_site_id: "${site_id}", recycler_id: "${recycler_id}", hauler_id: "${hauler_id}", units_manifested: 100, route_distance_km: 40.0, pickup_window_start: "2026-08-05T09:00:00Z", pickup_window_end: "2026-08-05T10:00:00Z", fulfillment_status: "CLOSED", settlement_status: "FINALIZED", version: 99 }
              as: CollectionSiteOperator
              as_user_id: "${site_id}"
              captures: { po_id: $.data.id }
          assert:
            - "Response: HTTP 201"
            - "PickupOrder.${po_id}.fulfillment_status == SCHEDULED (client CLOSED ignored)"
            - "PickupOrder.${po_id}.settlement_status == UNSETTLED (client FINALIZED ignored)"
            - "PickupOrder.${po_id}.version == 1 (client 99 ignored)"
            - "PickupOrder.${po_id}.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "PickupOrder.${po_id}.hauler_auto_selected == false and estimated_payment_cents == null and final_payment_cents == null"

      - name: load_inspection_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.LoadInspection
          - endpoints["POST /pickup-orders/{id}/inspections"]
          - endpoints["GET /pickup-orders/{id}/inspections"]
          - validations[priority=54]
        distinguishing_aspect: "LoadInspection declares common_fields: false, so its rows carry id and created_at but no version / updated_at, §1.5 exposes no PATCH or DELETE for it, and a second inspection on the same order is refused rather than overwriting the first."
        test_recipe:
          setup:
            - "CHAIN-SH with a 240-unit load delivered in full and inspected once at 12 contaminated units."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
            - call: "POST /collection-sites"
              payload: { state_program_id: "${prog_wa_id}", operator_name: "Puget Transfer Station", site_type: "TRANSFER_STATION", region_code: "NORTH" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { site_id: $.data.id }
            - call: "POST /collection-sites/${site_id}/enroll"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /haulers"
