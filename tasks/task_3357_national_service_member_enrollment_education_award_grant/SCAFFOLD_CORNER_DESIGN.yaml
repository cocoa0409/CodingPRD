        grounds: ["calculations.fundraising_cap_check", "validations[priority=29]", "errors.ERR_FUNDRAISING_CAP_EXCEEDED"]
        distinguishing_aspect: "Integer 10% gate including the pending entry: 43200 DIRECT + 4800 FUNDRAISING gives 4800 x 10 == 48000 <= 48000 (allowed); one further FUNDRAISING minute gives 4801 x 10 == 48010 > 48001 (rejected) — exact boundary at the minute."
        test_recipe:
          setup: ["Member A ACTIVE; 43200 DIRECT_SERVICE minutes certified; one PENDING FUNDRAISING entry of 4800."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_submit
            - *k_clock2
            - *k_close
            - *k_award
            - *k_mem
            - *k_chk
            - *k_clr1
            - *k_clr2
            - *k_clr3
            - *k_enr
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-16", minutes: 43200, activity_code: "DIRECT_SERVICE" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_a: $.data.id }
            - call: "POST /hour-entries/${ent_a}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-17", minutes: 4800, activity_code: "FUNDRAISING" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_f: $.data.id }
          trigger:
            - call: "POST /hour-entries/${ent_f}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2026-10-18", minutes: 1, activity_code: "FUNDRAISING" }
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { ent_f2: $.data.id }
            - call: "POST /hour-entries/${ent_f2}/certify"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the 4800-minute FUNDRAISING entry certifies (exactly 10% of 48000)"
            - "MemberEnrollment.${enr_a}.certified_minutes == 48000 and fundraising_certified_minutes == 4800"
            - "the 1-minute FUNDRAISING entry fails 422 with error_id == ERR_FUNDRAISING_CAP_EXCEEDED and stays PENDING"

  # ===========================================================================
  - section: validations
    instances:
      - name: submit_after_window_close_returns_window_closed
        claim_type: Violation -> Error
        grounds: ["validations[priority=23]", "errors.ERR_COMPETITION_WINDOW_CLOSED"]
        distinguishing_aspect: "Submitting one second after application_close_at is 422 ERR_COMPETITION_WINDOW_CLOSED — the inclusive window [open, close] has ended."
        test_recipe:
          setup: ["Application DRAFT; clock advanced past the window."]
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_comp
            - *k_app_draft
            - *k_clock2
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 422 and error_id == ERR_COMPETITION_WINDOW_CLOSED"
            - "GrantApplication.${app_id}.status == DRAFT"

      - name: competition_close_before_window_end_returns_invalid_state
        claim_type: Violation -> Error
        grounds: ["state_machines.GrantCompetition.OPEN_to_CLOSED", "errors.ERR_INVALID_STATE"]
        distinguishing_aspect: "Closing at 2026-09-15 (before application_close_at 2026-10-01) is 409 ERR_INVALID_STATE — close is only legal once current_utc > application_close_at."
        test_recipe:
          setup: ["Competition OPEN at clock 2026-09-15."]
          setup_api_calls:
            - *k_clock
            - *k_comp
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: CNCSProgramOfficer
          trigger:
            - call: "POST /competitions/${comp_id}/close"
              payload: {}
              as: CNCSProgramOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "GrantCompetition.${comp_id}.status == OPEN"

      - name: service_date_outside_period_returns_out_of_range
        claim_type: Violation -> Error
        grounds: ["validations[priority=25]", "errors.ERR_SERVICE_DATE_OUT_OF_RANGE"]
        distinguishing_aspect: "Half-open service period [2026-10-15, 2027-08-15): the day before start and the end date itself are both 422 ERR_SERVICE_DATE_OUT_OF_RANGE; the start date is accepted."
        test_recipe:
          setup: ["Member A enrolled ACTIVE, period [2026-10-15, 2027-08-15)."]
