            - { call: "POST /roadside/service-calls/${sc}/estimates", payload: { labor_hours_est: 1.0, travel_miles_est: 30, parts_estimate_cents: 80000, expected_service_call_version: "${sc_v2}" }, as: Technician, as_user_id: "${t2}", captures: { est: $.data.id, est_total: $.data.total_cents } }
