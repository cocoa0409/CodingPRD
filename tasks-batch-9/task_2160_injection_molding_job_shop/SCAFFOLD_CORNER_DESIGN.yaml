          difficulty_instance: priority_pair_validation_conflict / state_precondition_beats_material_safety_gate_on_second_start
          rationale: "Both declared priority conflicts are asserted by the two priority_pair_validation_conflict instances."

      - name: parts_balance_mismatch_rejects_the_report
