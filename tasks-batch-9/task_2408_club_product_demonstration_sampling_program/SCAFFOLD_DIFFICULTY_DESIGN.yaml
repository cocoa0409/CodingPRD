            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 3, addon_services: [] }
