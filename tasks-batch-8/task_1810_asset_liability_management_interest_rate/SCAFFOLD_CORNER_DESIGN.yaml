  - section: errors
    instances:
      - name: err_assumption_not_approved_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSUMPTION_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: run_rejected_when_pinned_set_not_approved
          rationale: "Failure path asserted there."

      - name: err_open_breaches_remain_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_BREACHES_REMAIN]"]
        excluded_because:
          difficulty_instance: report_acknowledge_blocked_by_open_breach
          rationale: "Failure path asserted there."

      - name: err_hedge_window_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_HEDGE_WINDOW_OVERLAP]"]
        excluded_because:
