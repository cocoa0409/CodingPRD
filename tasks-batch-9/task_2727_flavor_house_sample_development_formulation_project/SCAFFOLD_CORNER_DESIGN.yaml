            - "Batch B of 150 kg has had its tolerance set: material_cost_cents 337500, compounding_fee_pct 12.0, compounding_fee_cents 40500, batch_total_cents 403000, production_cost_per_kg_cents 2687, tolerance_spec band_pct 1.0000 then 0.0800."
