      - name: start_aging_requires_locker_operational
        grounds:
          - state_machines.InventoryLot.AVAILABLE_to_AGING
          - state_machines.DryAgeLocker.OPERATIONAL_to_QUARANTINED
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair InventoryLot -> DryAgeLocker (distinct from instance 1's pair): an InventoryLot may
          transition AVAILABLE -> AGING only when the target DryAgeLocker.locker_status == OPERATIONAL; into
          a QUARANTINED locker start-aging is rejected with ERR_LOCKER_QUARANTINED.
        test_recipe:
          setup:
            - "A QUARANTINED locker (made so by a prior out-of-band reading); a fresh AVAILABLE DRY_RIBEYE lot."
          setup_api_calls:
            - call: "POST /cut-types"
              payload: { code: "DRY_RIBEYE", species: "BEEF", base_price_cents_per_kg: 6000, requires_dry_age: true }
