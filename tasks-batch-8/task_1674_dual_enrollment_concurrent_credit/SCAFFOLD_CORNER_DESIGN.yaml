  - section: validations
    instances:
      - name: missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A write with no X-User-Role header fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: enrollment_body_fk_existence_student_first
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "With BOTH body FKs bogus, the student_id (declared first in the endpoint input) drives the 404 — body FKs validate in declared input order after path ids."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /dual-credit/enrollments", payload: { student_id: "00000000-0000-4000-8000-000000000001", offering_id: "00000000-0000-4000-8000-000000000002" }, as: HsCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND (HTTP 404; student_id checked first)"

      - name: offering_term_type_and_school_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_TERM_TYPE_MISMATCH]", "errors[ERR_TERM_SCHOOL_MISMATCH]"]
        distinguishing_aspect: "Two distinct referential guards on offering creation: passing the HS term as college_term_id yields ERR_TERM_TYPE_MISMATCH; passing a different school's HS term yields ERR_TERM_SCHOOL_MISMATCH."
        test_recipe:
          setup: ["schools A and B, college term, HS terms for A and for B, course, instructor"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_a: $.data.id } }
            - { call: "POST /dual-credit/high-schools", payload: { name: "Southview HS", district_code: "SV-02" }, as: DualCreditAdmin, captures: { hs_b: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_a}", name: "Fall 2026 HS-A", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_a: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: HIGH_SCHOOL, high_school_id: "${hs_b}", name: "Fall 2026 HS-B", start_date: "2026-08-20T00:00:00Z", end_date: "2026-12-20T00:00:00Z", add_deadline: "2026-09-05T00:00:00Z", drop_deadline: "2026-09-10T00:00:00Z", withdraw_deadline: "2026-10-25T00:00:00Z" }, as: DualCreditAdmin, captures: { ht_b: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "HIST210", title: "US History", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_id: $.data.id } }
            - { call: "POST /dual-credit/instructors", payload: { full_name: "Pat Quinn", high_school_id: "${hs_a}" }, as: DualCreditAdmin, captures: { ins_id: $.data.id } }
          trigger:
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ht_a}", hs_term_id: "${ht_a}", high_school_id: "${hs_a}", instructor_id: "${ins_id}", capacity: 2 }, as: DualCreditAdmin, captures: { err_type: $.data.error_id } }
            - { call: "POST /dual-credit/offerings", payload: { course_id: "${crs_id}", college_term_id: "${ct_id}", hs_term_id: "${ht_b}", high_school_id: "${hs_a}", instructor_id: "${ins_id}", capacity: 2 }, as: DualCreditAdmin, captures: { err_school: $.data.error_id } }
          assert:
            - "${err_type} == ERR_TERM_TYPE_MISMATCH (an HS term cannot anchor college_term_id)"
            - "${err_school} == ERR_TERM_SCHOOL_MISMATCH (hs_term belongs to school B, offering claims school A)"

      - name: duplicate_and_invalid_prerequisite_edges_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_SELF_PREREQUISITE]", "errors[ERR_DUPLICATE_PREREQUISITE]", "errors[ERR_PREREQUISITE_CYCLE]", calculations.prerequisite_satisfaction]
        distinguishing_aspect: "The three edge guards in their pinned sub-order: self-edge -> ERR_SELF_PREREQUISITE (400); exact duplicate -> ERR_DUPLICATE_PREREQUISITE; cycle-closing reverse edge -> ERR_PREREQUISITE_CYCLE."
        test_recipe:
          setup: ["courses MATH151 and MATH099 exist"]
          setup_api_calls:
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH151", title: "College Algebra", college_credit_hours: 3, hs_credit_units: 1.0, placement_exam_code: "MATH", min_placement_score: 70 }, as: DualCreditAdmin, captures: { crs_a: $.data.id } }
            - { call: "POST /dual-credit/courses", payload: { course_code: "MATH099", title: "Pre-Algebra", college_credit_hours: 2, hs_credit_units: 0.5, placement_exam_code: "NONE", min_placement_score: 0 }, as: DualCreditAdmin, captures: { crs_b: $.data.id } }
            - { call: "POST /dual-credit/prerequisites", payload: { course_id: "${crs_a}", requires_course_id: "${crs_b}", min_grade: C }, as: DualCreditAdmin }
          trigger:
            - { call: "POST /dual-credit/prerequisites", payload: { course_id: "${crs_a}", requires_course_id: "${crs_a}" }, as: DualCreditAdmin, captures: { err_self: $.data.error_id } }
            - { call: "POST /dual-credit/prerequisites", payload: { course_id: "${crs_a}", requires_course_id: "${crs_b}", min_grade: B }, as: DualCreditAdmin, captures: { err_dup: $.data.error_id } }
            - { call: "POST /dual-credit/prerequisites", payload: { course_id: "${crs_b}", requires_course_id: "${crs_a}" }, as: DualCreditAdmin, captures: { err_cyc: $.data.error_id } }
          assert:
            - "${err_self} == ERR_SELF_PREREQUISITE"
            - "${err_dup} == ERR_DUPLICATE_PREREQUISITE (same ordered pair, regardless of min_grade)"
            - "${err_cyc} == ERR_PREREQUISITE_CYCLE (B -> A would close the cycle A -> B)"

      - name: duplicate_funding_agreement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_FUNDING_AGREEMENT]", entities.FundingAgreement.fields.uniqueness]
        distinguishing_aspect: "Second agreement for the same (high_school_id, college_term_id) is rejected even with a different funding model."
        test_recipe:
          setup: ["school, college term, and one STATE_PROGRAM agreement exist"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
            - { call: "POST /dual-credit/terms", payload: { institution_type: COLLEGE, name: "Fall 2026 College", start_date: "2026-08-15T00:00:00Z", end_date: "2026-12-15T00:00:00Z", add_deadline: "2026-09-01T00:00:00Z", drop_deadline: "2026-09-15T00:00:00Z", withdraw_deadline: "2026-11-01T00:00:00Z" }, as: DualCreditAdmin, captures: { ct_id: $.data.id } }
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: STATE_PROGRAM, tuition_cents_per_credit: 40000, state_rate_cents_per_credit: 30000, district_cap_cents: 0 }, as: DualCreditAdmin }
          trigger:
            - { call: "POST /dual-credit/funding-agreements", payload: { high_school_id: "${hs_id}", college_term_id: "${ct_id}", funding_model: FAMILY_RESPONSIBLE, tuition_cents_per_credit: 41000 }, as: DualCreditAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_DUPLICATE_FUNDING_AGREEMENT"

      - name: duplicate_enrollment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "A second enrollment for the same (student, offering) while the first is PENDING_VERIFICATION fails ERR_DUPLICATE_ENROLLMENT."
        test_recipe:
          setup: ["standard fixture; e1 created (PENDING_VERIFICATION) for s1 on the offering"]
          setup_api_calls:
            - { call: "POST /dual-credit/high-schools", payload: { name: "Northview HS", district_code: "NV-01" }, as: DualCreditAdmin, captures: { hs_id: $.data.id } }
