# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per §1.5" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist or does not belong to the URL chain" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed required field or unknown enum value" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field value violates a declared constraint (e.g. grocery_gap_pct out of 0..100, earnest_money_cents >= base_price_cents)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Rollout is not ACTIVE; child-creating/committing operation blocked" }
  - { id: ERR_PROGRAM_HAS_ACTIVE_STORES, http: 409, condition: "Deactivation blocked: a store has advanced past PROPOSED and is not KILLED" }
  - { id: ERR_PROGRAM_CLOSE_BLOCKED, http: 409, condition: "Close blocked: a store is mid-pipeline or a capital project is undecided" }
  - { id: ERR_TRADE_AREA_NOT_QUALIFIED, http: 409, condition: "Store creation requires the trade area to be QUALIFIED" }
  - { id: ERR_NO_FEASIBLE_FORMAT, http: 422, condition: "No format meets its minimum-revenue bar for the trade area" }
  - { id: ERR_STORE_PRECONDITION, http: 409, condition: "Store-level precondition failed (format selection on non-PROPOSED store, volume_index change after PROPOSED, opening plan without EXECUTED agreement or delivery window violated)" }
  - { id: ERR_SITE_CONTROL_ACTIVE, http: 409, condition: "Kill blocked: an agreement is still open (not TERMINATED/COMPLETED)" }
  - { id: ERR_DUPLICATE_ACTIVE, http: 409, condition: "Singleton violation: store already has an open agreement / ACTIVE assignment / PLANNED or LOCKED opening plan" }
  - { id: ERR_DEVELOPER_CAPACITY_EXCEEDED, http: 409, condition: "Developer already has 3 ACTIVE agreements" }
  - { id: ERR_DC_CAPACITY_EXCEEDED, http: 409, condition: "Distribution center has no remaining store capacity" }
  - { id: ERR_FIXTURE_LEAD_TIME, http: 409, condition: "Opening-plan lock blocked: committed_delivery_date is after fixture_kit_ship_date (opening_date - 21 days)" }
  - { id: ERR_OPENING_TOO_EARLY, http: 409, condition: "Clock before opening_date - 3 days at execute, or opening_date not >= clock + 45 days at creation" }
  - { id: ERR_CANNIBALIZATION_BLOCKED, http: 409, condition: "Study recommendation is BLOCKED; finalize forbidden" }
  - { id: ERR_STUDY_NOT_FINAL, http: 409, condition: "NEW_BUILD capital submit requires a FINAL non-superseded cannibalization study" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The deciding PROGRAM_ADMIN is the FINANCE_ANALYST who submitted the project" }
  - { id: ERR_CAPITAL_BUDGET_EXCEEDED, http: 409, condition: "Effective project cost exceeds program available_capital_cents" }
  - { id: ERR_BAD_REFERENCE, http: 422, condition: "Referenced entity missing, in wrong state, or outside the program (developer, DC, overlap store, subject store)" }
  - { id: ERR_NO_ACTIVE_ASSIGNMENT, http: 409, condition: "Route planning requires an ACTIVE DCAssignment" }
  - { id: ERR_OPENING_PLAN_STATE, http: 409, condition: "Opening-plan lock requires store status SITE_CONTROL" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PROGRAM_ADMIN
    description: "Rollout program owner: programs, trade areas, store registration, developer registration, capital decisions"
    identity: "opaque"
    exclusive_operations:
      - "POST /rollouts — create program"
      - "PATCH /rollouts/{pid} — update program settings"
      - "POST /rollouts/{pid}/activate|deactivate|close — program lifecycle"
      - "POST /rollouts/{pid}/trade-areas, trade-area-updates, screen — trade-area pipeline"
      - "POST /rollouts/{pid}/stores — register stores (incl. EXISTING)"
      - "POST /rollouts/{pid}/developers — register developers"
      - "POST /rollouts/{pid}/capital-projects/{cpid}/decide — capital decisions"
      - "POST /rollouts/{pid}/_clock/set_current_utc — test clock"
    shared_operations:
      - "All GET endpoints"
  - name: REAL_ESTATE_MANAGER
    description: "Real-estate pipeline: format selection, site control agreements, store kill"
    identity: "opaque"
    exclusive_operations:
      - "POST /rollouts/{pid}/stores/{sid}/select-format"
      - "POST /rollouts/{pid}/site-agreements (+ execute/activate/deliveries/terminate)"
      - "POST /rollouts/{pid}/stores/{sid}/kill"
    shared_operations:
      - "All GET endpoints"
  - name: NETWORK_PLANNER
    description: "Supply-chain network: DCs, DC assignments, route plans, store volume index"
    identity: "opaque"
    exclusive_operations:
      - "POST /rollouts/{pid}/distribution-centers"
      - "POST /rollouts/{pid}/dc-assignments"
      - "POST /rollouts/{pid}/route-plans"
      - "PATCH /rollouts/stores/{sid} (volume_index)"
    shared_operations:
      - "All GET endpoints"
  - name: OPERATIONS_LEAD
    description: "Store openings: opening plans and grand-opening execution"
    identity: "opaque"
    exclusive_operations:
      - "POST /rollouts/{pid}/opening-plans (+ lock/unlock/execute)"
    shared_operations:
      - "All GET endpoints"
  - name: FINANCE_ANALYST
    description: "Finance: sales recording, cannibalization studies, capital project origination"
    identity: "opaque"
    exclusive_operations:
      - "POST /rollouts/{pid}/stores/{sid}/record-sales"
      - "POST /rollouts/{pid}/stores/{sid}/cannibalization-studies (+ finalize)"
      - "POST /rollouts/{pid}/capital-projects (+ submit/cancel)"
    shared_operations:
      - "All GET endpoints"
