      - name: corner_calc_deposit_hold_tiered_line_rounding
        claim_type: tiered_pricing
        grounds:
          - calculations.reservation_deposit_hold
          - constants.HOURLY_DEPOSIT_RATE_BP
        excluded_because:
          difficulty_instance: combinatorial_formula / deposit_hold_per_line_rounding_beats_combined_rate_mode_b
          rationale: "That instance walks the risk, duration and live-link lines with per-line ROUND_HALF_UP and proves the 15432-versus-15431 divergence from summing basis points first."
        
      - name: corner_calc_settlement_waterfall_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.reservation_final_settlement
          - constants.LATE_FEE_BP_PER_HOUR
        excluded_because:
          difficulty_instance: non_linear_state_machine / reservation_fork_join_clean_branch_diverges_from_damage_branch
          rationale: "The forfeit-before-refund waterfall and the uncovered-liability remainder are both asserted there against the clean branch."

      - name: corner_calc_damage_threshold_escalation
        claim_type: threshold
        grounds:
          - calculations.damage_penalty_assessment
          - constants.REPAIR_ESCALATION_CENTS
        excluded_because:
          difficulty_instance: boundary_precision_check / repair_escalation_threshold_exact_boundary_adds_one_point
          rationale: "The 49999 / 50000 pair around REPAIR_ESCALATION_CENTS and its one-extra-point consequence is the whole content of that instance."

      - name: corner_calc_impact_index_household_norm_clip
        claim_type: constants_applied
        grounds:
          - calculations.community_impact_index
          - constants.HOUSEHOLD_NORM
        excluded_because:
          difficulty_instance: boundary_precision_check / reach_component_clip_at_household_norm_boundary_on_air
          rationale: "The 999 / 1000 / 1001 sweep proving min(1, households / HOUSEHOLD_NORM) is asserted there."

      - name: corner_calc_franchise_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.franchise_fee_allocation
          - entities.FundingPeriod.fields.basis
        excluded_because:
          difficulty_instance: dual_variant_calc / franchise_allocation_accrual_vs_cash_diverges_on_funding_period
          rationale: "Both basis branches are computed on identical inputs there and the 134000-cent admin delta is asserted."

      - name: corner_calc_impact_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.community_impact_index
          - entities.ArchiveAsset.fields.impact_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / impact_index_provisional_vs_final_diverges_on_archive_asset
          rationale: "That instance asserts PROVISIONAL at air and FINAL at publish on the same asset, which is exactly the variant-selection claim."

      - name: corner_calc_impact_variant_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.community_impact_index
          - entities.ArchiveAsset.fields.community_impact_index
        excluded_because:
          difficulty_instance: dual_variant_calc / impact_index_provisional_vs_final_diverges_on_archive_asset
          rationale: "The +1.20 delta applied when the asset switches from PROVISIONAL to FINAL is asserted in that same instance."

  # ===========================================================================
  - section: validations
    instances:

      - name: corner_duplicate_enrollment_rejected_until_withdrawal_frees_it
        claim_type: violation_to_error
        grounds:
          - validations[priority=37]
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - validations[priority=24]
          - state_machines.CourseEnrollment.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: "The duplicate guard looks at status IN {ENROLLED, ATTENDED, PASSED}: a second enrollment on the same course is refused with ERR_DUPLICATE_ENROLLMENT while the first is ENROLLED, and the identical call succeeds once that enrollment is WITHDRAWN."
        test_recipe:
          setup:
            - "Producer P is ACTIVE with residency_verified true."
            - "TrainingCourse TV-101 is BASIC with seat_capacity 12, session 2026-08-05T17:00:00Z-21:00:00Z."
            - "P holds one ENROLLED enrollment on TV-101 and the clock is still 2026-08-01T00:00:00Z, before session_start_at."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR", "EDIT_SUITE"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e1_id: $.data.id}
          trigger:
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {dup_err: $.data.error_id}
            - call: "POST /course-enrollments/${e1_id}/withdraw"
              payload: {}
              as: Producer
              as_user_id: "${p_id}"
              captures: {wd_status: $.data.status}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e2_id: $.data.id, e2_status: $.data.status}
          assert:
            - "${dup_err} == ERR_DUPLICATE_ENROLLMENT (409) while the first enrollment is ENROLLED"
            - "TrainingCourse.${c_id}.enrolled_count == 1 after the refusal — no phantom row was created"
            - "${wd_status} == WITHDRAWN, and the withdrawal is accepted because the clock is before session_start_at"
            - "TrainingCourse.${c_id}.enrolled_count == 1 after the re-enrollment: the WITHDRAWN row is excluded and the new ENROLLED row counts"
            - "${e2_id} != ${e1_id} and ${e2_status} == ENROLLED"

      - name: corner_course_capacity_counts_failed_seats_but_not_withdrawn
        claim_type: aggregate_validation
        grounds:
          - validations[priority=18]
          - errors[ERR_COURSE_FULL]
          - entities.TrainingCourse.fields.enrolled_count
          - state_machines.CourseEnrollment.ENROLLED_to_FAILED
        distinguishing_aspect: "Capacity is an aggregate over statuses, not over rows: on a seat_capacity 1 course a FAILED enrollment keeps the seat occupied and still yields ERR_COURSE_FULL, whereas a WITHDRAWN enrollment releases the seat."
        test_recipe:
          setup:
            - "Producers P1 and P2 are both ACTIVE."
            - "TrainingCourse TV-101 (BASIC) has seat_capacity 1 and session 2026-08-05T17:00:00Z-21:00:00Z."
            - "TrainingCourse TV-102 (BASIC) has seat_capacity 1 and session 2026-08-10T17:00:00Z-21:00:00Z."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p1_id: $.data.id}
            - call: "POST /producers"
              payload: {legal_name: "Grace Hopper", email: "grace@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p2_id: $.data.id}
            - call: "POST /producers/${p1_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /producers/${p2_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0002"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR"], seat_capacity: 1, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c1_id: $.data.id}
            - call: "POST /training-courses"
              payload: {course_code: "TV-102", title: "Edit Suite Basics", tier: "BASIC", grants_competency_codes: ["EDIT_SUITE"], seat_capacity: 1, session_start_at: "2026-08-10T17:00:00Z", session_end_at: "2026-08-10T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c2_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p1_id}", course_id: "${c1_id}"}
              as: Producer
              as_user_id: "${p1_id}"
              captures: {e1_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p1_id}", course_id: "${c2_id}"}
              as: Producer
              as_user_id: "${p1_id}"
              captures: {e2_id: $.data.id}
          trigger:
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p2_id}", course_id: "${c1_id}"}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {full_err: $.data.error_id}
            - call: "POST /course-enrollments/${e2_id}/withdraw"
              payload: {}
              as: Producer
              as_user_id: "${p1_id}"
              captures: {wd_status: $.data.status}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p2_id}", course_id: "${c2_id}"}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {freed_id: $.data.id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-06T00:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e1_id}/attendance"
              payload: {attended: false}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {no_show: $.data.status}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p2_id}", course_id: "${c1_id}"}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {still_full_err: $.data.error_id}
          assert:
            - "${full_err} == ERR_COURSE_FULL (409) — TV-101 has one seat and it is taken by an ENROLLED row"
            - "${wd_status} == WITHDRAWN and the follow-up enrollment ${freed_id} on TV-102 succeeds, so TV-102.enrolled_count == 1"
            - "${no_show} == FAILED — recording attended false on TV-101 sends the enrollment to FAILED"
            - "${still_full_err} == ERR_COURSE_FULL — a FAILED enrollment is still counted in enrolled_count"
            - "TrainingCourse.${c1_id}.enrolled_count == 1 and passed_count == 0 at the end"

      - name: corner_license_reference_conditional_on_third_party_copyright
        claim_type: conditional_validation
        grounds:
          - validations[priority=39]
          - errors[ERR_LICENSE_REFERENCE_REQUIRED]
          - entities.Attestation.fields.license_reference
          - constants.REQUIRED_ATTESTATION_KINDS
        distinguishing_aspect: "The license requirement is conditional on two things at once — attestation_kind COPYRIGHT_CLEARANCE and third_party_material true — so the same third_party_material true on an INDEMNIFICATION attestation is accepted without any license_reference."
        test_recipe:
          setup:
            - "Producer P is ACTIVE and owns DRAFT Program PR with clearance_status INCOMPLETE."
            - "CURRENT_STATEMENT_VERSION is 2026.1."
          setup_api_calls:
            - call: "POST /producers"
