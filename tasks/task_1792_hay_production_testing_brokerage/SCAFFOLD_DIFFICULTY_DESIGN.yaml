  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_quote_beats_credit_limit
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_QUOTE_EXPIRED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the accept request violates BOTH the quote-expiry state
          guard (priority 6) and the credit-limit fiscal guard (priority 11); the state error
          ERR_QUOTE_EXPIRED must win.
        test_recipe:
          setup:
            - "Index @ 20000; lane 420mi; Buyer credit_limit 1000 (any accept would exceed it)"
            - "Quote PREMIUM 12.0t (total 439170 > 1000) ISSUED at clock 2026-08-01T00:00Z; expires 2026-08-04T00:00Z"
            - "Clock advanced to 2026-08-05T00:00:00Z -> quote swept to EXPIRED"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 420, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer Seven", region_code: "CA-NORTH", credit_limit_cents: 1000 }, as: PlatformAdmin, captures: { b7_id: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b7_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 12.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b7_id}", captures: { q7_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q7_id}/issue", payload: {}, as: Buyer, as_user_id: "${b7_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/quotes/${q7_id}", payload: {}, as: Buyer, as_user_id: "${b7_id}", captures: { q7_v_exp: "$.data.version" } }
          trigger:
            - { call: "POST /api/quotes/${q7_id}/accept", payload: { expected_quote_version: "${q7_v_exp}" }, as: Buyer, as_user_id: "${b7_id}", captures: { acc_err: "$.data.error_id" } }
          assert:
            - "accept returns error_id == ERR_QUOTE_EXPIRED (state, priority 6), not ERR_CREDIT_LIMIT_EXCEEDED (fiscal, priority 11)"
            - "Quote.${q7_id}.status == EXPIRED"
      - name: window_overlap_beats_duplicate_number
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_FIELD_WINDOW_OVERLAP]
          - errors[ERR_DUPLICATE_CUTTING_NUMBER]
        distinguishing_aspect: |
          Category pair business_temporal vs business_constraint: the create request violates BOTH the
          half-open window-overlap rule (priority 8) and the cutting-number uniqueness rule (priority 10);
          the temporal error ERR_FIELD_WINDOW_OVERLAP must win.
        test_recipe:
          setup:
            - "Grower/Field; Cutting #1 on window [2026-06-10, 2026-06-20) already exists"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Nine", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g9_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g9_id}", name: "Orchard 2", acres: 40.0, forage_type: "GRASS" }, as: Grower, as_user_id: "${g9_id}", captures: { f9_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f9_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-06-10", planned_window_end: "2026-06-20" }, as: Grower, as_user_id: "${g9_id}" }
          trigger:
            - { call: "POST /api/cuttings", payload: { field_id: "${f9_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-06-15", planned_window_end: "2026-06-25" }, as: Grower, as_user_id: "${g9_id}", captures: { cut_err: "$.data.error_id" } }
          assert:
            - "create returns error_id == ERR_FIELD_WINDOW_OVERLAP (temporal, priority 8), not ERR_DUPLICATE_CUTTING_NUMBER (constraint, priority 10)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: rfv_tier_boundary_exactly_170
        grounds:
          - calculations.quality_tier_assignment
        distinguishing_aspect: |
          Metric RFV via the forage-test path: rfv exactly 170.0 lands in PREMIUM (>= boundary), while
          169.9 falls to GOOD — one-tenth of a point flips the certified tier.
        test_recipe:
          setup:
            - "Grower/Field/Cutting CUT 2026-07-31; site; two 10.0t lots harvested 2026-08-01"
            - "Test on lot A recorded rfv 170.0 (protein 18.0, moisture 14.0), certified by second tech"
            - "Test on lot B recorded rfv 169.9 (protein 18.0, moisture 14.0), certified by second tech"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Ten", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g10_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g10_id}", name: "South 8", acres: 65.0, forage_type: "ALFALFA" }, as: Grower, as_user_id: "${g10_id}", captures: { f10_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f10_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-07-25", planned_window_end: "2026-08-10" }, as: Grower, as_user_id: "${g10_id}", captures: { c10_id: "$.data.id" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-29", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-07-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c10_id}/mark-cut", payload: { actual_cut_date: "2026-07-31" }, as: Grower, as_user_id: "${g10_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Barn H", region_code: "OR-WILLAMETTE", capacity_tons: 500.0 }, as: PlatformAdmin, captures: { s10_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c10_id}", storage_site_id: "${s10_id}", bale_type: "SMALL_SQUARE", bale_count: 100, harvested_tonnage: 10.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lotA2_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c10_id}", storage_site_id: "${s10_id}", bale_type: "SMALL_SQUARE", bale_count: 100, harvested_tonnage: 10.0, harvested_date: "2026-08-01" }, as: BrokerOps, captures: { lotB2_id: "$.data.id" } }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lotA2_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { tA2_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${tA2_id}/submit", payload: { lab_reference: "LAB-G" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tA2_id}/record-result", payload: { rfv: 170.0, protein_pct: 18.0, moisture_pct: 14.0 }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tA2_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2" }
            - { call: "POST /api/forage-tests", payload: { bale_lot_id: "${lotB2_id}", sample_date: "2026-08-01" }, as: BrokerOps, captures: { tB2_id: "$.data.id" } }
            - { call: "POST /api/forage-tests/${tB2_id}/submit", payload: { lab_reference: "LAB-H" }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tB2_id}/record-result", payload: { rfv: 169.9, protein_pct: 18.0, moisture_pct: 14.0 }, as: LabTechnician, as_user_id: "tech-1" }
            - { call: "POST /api/forage-tests/${tB2_id}/certify", payload: {}, as: LabTechnician, as_user_id: "tech-2" }
          trigger:
            - { call: "GET /api/bale-lots/${lotA2_id}", payload: {}, as: BrokerOps, captures: { tierA2: "$.data.quality_tier" } }
            - { call: "GET /api/bale-lots/${lotB2_id}", payload: {}, as: BrokerOps, captures: { tierB2: "$.data.quality_tier" } }
          assert:
            - "BaleLot.${lotA2_id}.quality_tier == PREMIUM (rfv exactly 170.0 meets the >= boundary)"
            - "BaleLot.${lotB2_id}.quality_tier == GOOD (rfv 169.9 falls below)"
      - name: wet_day_threshold_exactly_2mm
        grounds:
          - calculations.weather_window_evaluation
          - state_machines.Cutting.SCHEDULED_to_WINDOW_OPEN
        distinguishing_aspect: |
          Metric precipitation_mm via the weather-report path (different metric and endpoint than the RFV
          instance): a day at exactly 2.0mm counts DRY (rule is > 2.0), so three 2.0mm days open the
          window; a single 2.1mm day slams it shut.
        test_recipe:
          setup:
            - "Grower/Field (OR-WILLAMETTE); Cutting window 2026-06-10..2026-06-20"
          setup_api_calls:
            - { call: "POST /api/growers", payload: { name: "Grower Eleven", region_code: "OR-WILLAMETTE" }, as: PlatformAdmin, captures: { g11_id: "$.data.id" } }
            - { call: "POST /api/fields", payload: { grower_id: "${g11_id}", name: "Creek 1", acres: 30.0, forage_type: "GRASS" }, as: Grower, as_user_id: "${g11_id}", captures: { f11_id: "$.data.id" } }
            - { call: "POST /api/cuttings", payload: { field_id: "${f11_id}", cutting_number: 1, season_year: 2026, planned_window_start: "2026-06-10", planned_window_end: "2026-06-20" }, as: Grower, as_user_id: "${g11_id}", captures: { c11_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-10", precipitation_mm: 2.0, drying_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-11", precipitation_mm: 2.0, drying_index: 65 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-12", precipitation_mm: 2.0, drying_index: 65 }, as: PlatformAdmin }
            - { call: "GET /api/cuttings/${c11_id}", payload: {}, as: Grower, as_user_id: "${g11_id}", captures: { c11_open: "$.data.status" } }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-13", precipitation_mm: 2.1, drying_index: 65 }, as: PlatformAdmin }
            - { call: "GET /api/cuttings/${c11_id}", payload: {}, as: Grower, as_user_id: "${g11_id}", captures: { c11_shut: "$.data.status" } }
          assert:
            - "Cutting.${c11_id} status after three 2.0mm days == WINDOW_OPEN (2.0 is not > 2.0)"
            - "Cutting.${c11_id} status after one 2.1mm day == SCHEDULED (2.1 > 2.0 is WET)"
      - name: credit_limit_exact_equality_accepted
        grounds:
          - validations[priority=11]
          - entities.Buyer.fields.credit_limit_cents
        distinguishing_aspect: |
          Metric credit cents via the accept endpoint (third distinct metric/endpoint): credit_used + total
          exactly EQUAL to credit_limit is allowed (rule is > rejects), so a buyer with limit 439170 can
          accept a 439170-cent quote and lands at exactly 100% utilization.
        test_recipe:
          setup:
            - "Index @ 20000; lane 420mi (freight 163170); Buyer credit_limit exactly 439170"
            - "Quote PREMIUM 12.0t -> total 439170, ISSUED"
          setup_api_calls:
            - { call: "POST /api/market-indices", payload: { region_code: "OR-WILLAMETTE", forage_type: "ALFALFA", effective_date: "2026-05-01", price_per_ton_cents: 20000 }, as: PlatformAdmin }
            - { call: "POST /api/freight-lanes", payload: { origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", distance_miles: 420, rate_per_mile_cents: 350, min_charge_cents: 90000 }, as: PlatformAdmin }
            - { call: "POST /api/buyers", payload: { name: "Buyer Eight", region_code: "CA-NORTH", credit_limit_cents: 439170 }, as: PlatformAdmin, captures: { b8_id: "$.data.id" } }
            - { call: "POST /api/quotes", payload: { buyer_id: "${b8_id}", forage_type: "ALFALFA", quality_tier: "PREMIUM", tons: 12.0, origin_region_code: "OR-WILLAMETTE", dest_region_code: "CA-NORTH", requested_delivery_by: "2026-08-20" }, as: Buyer, as_user_id: "${b8_id}", captures: { q8_id: "$.data.id" } }
            - { call: "POST /api/quotes/${q8_id}/issue", payload: {}, as: Buyer, as_user_id: "${b8_id}", captures: { q8_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/quotes/${q8_id}/accept", payload: { expected_quote_version: "${q8_v}" }, as: Buyer, as_user_id: "${b8_id}", captures: { q8_st: "$.data.status" } }
            - { call: "GET /api/buyers/${b8_id}", payload: {}, as: PlatformAdmin, captures: { b8_used: "$.data.credit_used_cents" } }
          assert:
            - "Quote.${q8_id}.status == ACCEPTED (equality with credit_limit is allowed)"
            - "Buyer.${b8_id}.credit_used_cents == 439170"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bso_schedule_gated_on_cutting_state
        grounds:
          - state_machines.BalingServiceOrder.REQUESTED_to_SCHEDULED
          - state_machines.Cutting.SCHEDULED_to_WINDOW_OPEN
        distinguishing_aspect: |
          Pair BalingServiceOrder->Cutting: schedule is rejected while the referenced cutting is merely
          SCHEDULED, and succeeds only after weather reports flip the cutting to WINDOW_OPEN.
        test_recipe:
          setup:
            - "Grower/Field/Cutting window 2026-07-25..2026-08-10 (no weather yet -> SCHEDULED)"
            - "BalingServiceOrder for that cutting in REQUESTED"
          setup_api_calls:
