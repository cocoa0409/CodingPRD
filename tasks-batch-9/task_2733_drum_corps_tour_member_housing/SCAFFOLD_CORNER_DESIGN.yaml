      - name: settlement_replay_sorts_by_recorded_at_not_by_submission_order
        claim_type: chronological_order_sensitivity
        grounds:
          - calculations.show_settlement_payout
          - calculations.show_settlement_payout.precision
        distinguishing_aspect: "Each sanction cap is 15% of the net AT THAT MOMENT, so the replay must sort by recorded_at before charging: the identical amounts {250000, 200000} charged smallest-first yield sanctions 373904 and net 1042096, versus 377222 / 1038778 largest-first. Here the array is deliberately submitted in reverse chronological order, so an implementation that honours submission order gets both numbers wrong."
        test_recipe:
          setup:
            - "The canonical settlement fixture: a COMPLETED SHOW stop with appearance_fee 1200000, prize_pool 800000, projected_placement 3, drafted by bm-anna. Final placement 2 and a 40000 PRIZE_ADJUSTMENT put final_gross at 1416000 and the circuit fee at 56640 in the 5.5% tier."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /tour-stops"
              payload: { season_id: "${season_id}", stop_type: "SHOW", venue_name: "Allen Stadium", city: "Allen", state_code: "TX", arrive_at: "2027-06-20T14:00:00Z", depart_at: "2027-06-20T23:30:00Z", show_start_at: "2027-06-20T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 0, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
            - call: "POST /tour-stops/${stop_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-21T00:00:00Z" }
              as: TourManager
            - call: "POST /tour-stops/${stop_id}/complete"
              payload: {}
              as: TourManager
            - call: "POST /show-settlements"
              payload: { tour_stop_id: "${stop_id}", appearance_fee_cents: 1200000, prize_pool_cents: 800000, projected_placement: 3 }
              as: BusinessManager
              as_user_id: "bm-anna"
              captures: { settlement_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-30T00:00:00Z" }
              as: BusinessManager
          trigger:
            - call: "POST /show-settlements/${settlement_id}/finalize"
              payload: { final_placement: 2, remittance_lines: [{ kind: "PRIZE_ADJUSTMENT", amount_cents: 40000, recorded_at: "2027-06-25T09:00:00Z" }, { kind: "SANCTION_FEE", amount_cents: 250000, recorded_at: "2027-06-27T09:00:00Z" }, { kind: "SANCTION_FEE", amount_cents: 200000, recorded_at: "2027-06-26T09:00:00Z" }, { kind: "FEE_REBATE", amount_cents: 60000, recorded_at: "2027-06-28T09:00:00Z" }] }
              as: BusinessManager
              as_user_id: "bm-brett"
          assert:
            - "ShowSettlement.${settlement_id}.final_gross_cents == 1416000 and final_circuit_fee_cents == 56640 — the gross is built before the tier is read"
            - "the 200000 line is replayed first because its recorded_at is earlier: cap round_half_up(1359360*0.15) == 203904 so the whole 200000 is charged, then cap round_half_up(1159360*0.15) == 173904 caps the 250000 line"
            - "ShowSettlement.${settlement_id}.sanctions_charged_cents == 373904, not 377222"
            - "ShowSettlement.${settlement_id}.rebate_applied_cents == 56640 — the 60000 rebate is clipped to the fee actually charged"
            - "ShowSettlement.${settlement_id}.final_net_cents == 1042096 and variance_cents == -232784 against the unchanged provisional_net_cents 1274880"
            - "ShowSettlement.${settlement_id}.remittance_line_count == 4 and Season.${season_id}.tour_revenue_cents == 1042096"

      - name: settlement_input_set_requires_a_completed_show_stop
        claim_type: input_set_filtering
        grounds:
          - calculations.show_settlement_payout.input_set
          - validations.priority_25_ERR_STOP_NOT_COMPLETED
          - validations.priority_49_ERR_SETTLEMENT_ALREADY_EXISTS
        distinguishing_aspect: "The payout calculation only accepts a stop that is BOTH stop_type == SHOW and status == COMPLETED, and at most one settlement per stop: a CONFIRMED show, a COMPLETED rehearsal-only stop, and a duplicate draft must each be refused with their own error while the one legal draft computes its provisional figures."
        test_recipe:
          setup:
            - "One season holds a CONFIRMED show stop, a COMPLETED rehearsal-only stop and a COMPLETED show stop. The clock has been moved past every depart_at."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
