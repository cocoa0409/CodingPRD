  - rule_id: cross_entity_state_dependency
    instances:
      - name: demand_issuance_requires_active_participation
        grounds:
          - state_machines.Demand.null_to_ISSUED
          - errors[ERR_PARTICIPATION_INACTIVE]
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair Demand x Participation: a demand can only be issued while the issuing
          office's Participation is ACTIVE (CIA executed); an INVITED participation blocks
          issuance with ERR_PARTICIPATION_INACTIVE even though the investigation is OPEN.
        test_recipe:
          setup:
            - "Investigation OPEN with CA/TX/NY ACTIVE and leads designated; FL invited but CIA never executed (participation still INVITED)"
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "FL", population: 200, harm_measure_cents: 100, appropriation_rule: "GENERAL_FUND_ONLY" }, as: CommitteeChair, captures: { fl_off: $.data.id } }
