            - "Cart.${ct1}.status == EXPIRED with recovery_deadline_at == 2026-08-10T18:30:00Z (abandoned_at + 20 minutes) and held_item_count == 0"
            - "CartItem.${it1}.state == RELEASED and FlashOffer.${o1}.held_qty == 0, sold_qty == 0, status == EXPIRED"
            - "Show.${sh1}.abandoned_cart_count == 1, abandonment_rate_bp == 10000, margin_final_cents == 0"

  # ===========================================================================
  - section: calculations
    instances:

      - name: bundle_tier_first_threshold_at_exactly_5000_cents
        claim_type: constants_applied
        grounds:
          - calculations.cart_bundle_tier
          - calculations.flash_offer_effective_unit_price
          - calculations.order_totals
        distinguishing_aspect: "TIER1_FLOOR_CENTS is inclusive: a pre-discount subtotal of exactly 5000 takes TIER1_PCT 0.05 (effective 2375, gross 4750, tax 416, shipping 599, total 5765) while 4998 takes no discount at all (effective 2499, gross 4998, tax 437, total 6034)."
        test_recipe:
          setup:
