              payload: {}
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { wc_idx4: $.data.workload_index }
            - call: "GET /assignments/${wc_asg}/workload-logs"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_logs_first: "$.data[0].id" }
          assert:
            - "PlayerAssignment.${wc_asg}.workload_ceiling_index is the default 12.00, but the effective ceiling is the clearance's 1.00"
            - "The first 150-pitch log returns 201 and Player.${wc_p}.workload_index == 0.83"
            - "The second 150-pitch log inside the window returns 422 with error_id == ERR_WORKLOAD_CEILING_EXCEEDED and workload_index is still 0.83"
            - "At clock 2026-04-25 the window is [2026-04-12, 2026-04-25], so the 2026-04-05 log drops out and workload_index == 0.00 with no write at all"
            - "The 2026-04-25 log is then accepted (201) and workload_index == 0.83 again"
            - "GET /assignments/${wc_asg}/workload-logs returns total_count == 2 — the refused log was never persisted"

      - name: multi_level_cascade_chain_from_clearance_revocation
        claim_type: cascading_side_effects
