scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: demurrage_chronological_billed_straddles_tiers
        grounds:
          - calculations.demurrage_charge
          - state_machines.Container.GROUNDED_to_GATED_OUT
          - entities.DemurrageInvoice.fields.amount_cents
        distinguishing_aspect: |
          On a Container, the chronological_billed variant bills each chargeable day at the tier its
          day-index falls in (days 1-3 @5000, 4-7 @8000, day 8 @12000 = 59000), which differs from the
          flat_estimate average-rate variant whenever chargeable_days straddles a tier boundary.
        test_recipe:
          setup:
            - "A berth B-1 (AVAILABLE), a vessel with free_time_days=5, a SCHEDULED then BERTHED berth window berthed at 2026-02-01T00:00:00Z so free_time_expires_at = 2026-02-06T00:00:00Z."
            - "A container discharged under that window, grounded into a ground-tier slot, customs cleared."
            - "An ARRIVED gate appointment at slot 2026-02-13T12:00:00Z..13:00:00Z; clock is 2026-02-13T12:00:00Z (7d12h past free time => 8 chargeable days)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-1", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000001", name: "Maersk Alfa", loa_m: 300, draft_m: 14.0, free_time_days: 5 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-20T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "MSKU1000010", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /yard-slots"
              payload: { block: "A", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "GET /containers/${cont_id}"
              payload: {}
              as: YardPlanner
              captures: { cont_v_now: $.data.version }
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v_now}" }
              as: CustomsOfficer
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-13T12:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-001", window_start: "2026-02-13T12:00:00.000Z", window_end: "2026-02-13T13:00:00.000Z" }
              as: GateOperator
              captures: { appt_id: $.data.id }
            - call: "POST /gate-appointments/${appt_id}/check-in"
              payload: {}
              as: GateOperator
          trigger:
            - call: "POST /gate-appointments/${appt_id}/fulfill"
              payload: { condition: "SOUND" }
              as: GateOperator
              captures: { ga_id: $.data.id }
          assert:
            - "Container.${cont_id}.demurrage_due_cents == 59000"
            - "the created DemurrageInvoice.amount_cents == 59000"
            - "the created DemurrageInvoice.chargeable_days == 8"

      - name: reefer_excursion_threshold_vs_demurrage_domain
        grounds:
          - calculations.reefer_excursion_flag
          - calculations.reefer_excursion_summary
          - entities.ReeferReading.fields.is_excursion
        distinguishing_aspect: |
          The excursion variant operates on a ReeferReading (temperature domain, threshold algorithm) and
          produces a boolean/count entirely independent of the demurrage cost variant on Container/Invoice;
          a reading 2.5C off setpoint is an excursion while a 2.0C reading is not, on a different entity domain.
        test_recipe:
          setup:
            - "A reefer container (is_reefer=true, setpoint_c=-18.0) declared under a berthed window."
            - "Three readings recorded: -15.5C (dev 2.5 => excursion), -16.0C (dev 2.0 => not), -20.5C (dev 2.5 => excursion)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-2", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000002", name: "Reefer Star", loa_m: 250, draft_m: 12.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "RFRU2000020", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}", is_reefer: true, setpoint_c: -18.0 }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /containers/${cont_id}/reefer-readings"
              payload: { recorded_at: "2026-02-01T01:00:00.000Z", temperature_c: -15.5 }
              as: ReeferTechnician
            - call: "POST /containers/${cont_id}/reefer-readings"
              payload: { recorded_at: "2026-02-01T02:00:00.000Z", temperature_c: -16.0 }
              as: ReeferTechnician
            - call: "POST /containers/${cont_id}/reefer-readings"
              payload: { recorded_at: "2026-02-01T03:00:00.000Z", temperature_c: -20.5 }
              as: ReeferTechnician
          trigger:
            - call: "GET /containers/${cont_id}/reefer-summary"
              payload: {}
              as: ReeferTechnician
          assert:
            - "reefer-summary.excursion_count == 2"
            - "reefer-summary.max_deviation_c == 2.5"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: demurrage_tiered_marginal_rate_nonlinear     # mode (a): >=3 inputs, tiered-rate selection
        grounds:
          - calculations.demurrage_charge
          - entities.Container.fields.demurrage_due_cents
          - entities.Vessel.fields.free_time_days
        distinguishing_aspect: |
          Mode (a): the demurrage total is a non-linear function of (free_time_expires_at, clock, free_time_days)
          via per-day tiered-rate selection with branch on day-index; an 8-day dwell = 3*5000 + 4*8000 + 1*12000
          = 59000, not chargeable_days * any single rate.
        test_recipe:
          setup:
            - "Same as demurrage_chronological_billed_straddles_tiers up to the quote: container cleared & grounded under a window berthed 2026-02-01T00:00:00Z, free_time_days=5 (free expires 2026-02-06T00:00:00Z), clock 2026-02-13T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-3", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000003", name: "Tier Runner", loa_m: 300, draft_m: 14.0, free_time_days: 5 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-25T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "TIER3000030", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "A", bay: 3, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-13T12:00:00.000Z" }
              as: TerminalAdmin
          trigger:
            - call: "GET /containers/${cont_id}/demurrage-quote"
              payload: {}
              as: GateOperator
          assert:
            - "demurrage-quote.chargeable_days == 8"
            - "demurrage-quote.demurrage_due_cents == 59000"

      - name: dwell_time_seconds_to_hours_rounding_order     # mode (b): nested rounding order pinned
        grounds:
          - calculations.dwell_time_hours
          - state_machines.Container.ON_VESSEL_to_GROUNDED
          - state_machines.Container.GROUNDED_to_GATED_OUT
        distinguishing_aspect: |
          Mode (b): dwell pins one rounding order — convert (gate_out - gate_in) to total seconds, divide by
          3600, THEN round_half_up to 2 decimals; gate-in EIR at 2026-02-06T08:00:00Z and gate-out at
          2026-02-08T20:30:00Z => 60.5 hours exactly, not a per-segment rounded sum.
        test_recipe:
          setup:
            - "Container grounded (GATE_IN EIR) at clock 2026-02-06T08:00:00Z, cleared, and gated out (GATE_OUT EIR) at clock 2026-02-08T20:30:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-4", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000004", name: "Dwell Ship", loa_m: 300, draft_m: 14.0, free_time_days: 30 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-20T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "DWLL4000040", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /yard-slots"
              payload: { block: "A", bay: 4, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-06T08:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "GET /containers/${cont_id}"
              payload: {}
              as: YardPlanner
              captures: { cont_v_now: $.data.version }
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v_now}" }
              as: CustomsOfficer
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-08T20:30:00.000Z" }
              as: TerminalAdmin
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-040", window_start: "2026-02-08T20:00:00.000Z", window_end: "2026-02-08T21:00:00.000Z" }
              as: GateOperator
              captures: { appt_id: $.data.id }
            - call: "POST /gate-appointments/${appt_id}/check-in"
              payload: {}
              as: GateOperator
            - call: "POST /gate-appointments/${appt_id}/fulfill"
              payload: { condition: "SOUND" }
              as: GateOperator
          trigger:
            - call: "GET /containers/${cont_id}/dwell"
              payload: {}
              as: GateOperator
          assert:
            - "dwell.dwell_hours == 60.5"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: container_parallel_customs_handling_dimensions
        grounds:
          - state_machines.Container.ON_VESSEL_to_GROUNDED
          - state_machines.Container.PENDING_to_HELD
          - entities.Container.fields.customs_status
          - entities.Container.fields.handling_status
        distinguishing_aspect: |
          Container carries two parallel state dimensions that evolve independently: grounding advances
          handling_status ON_VESSEL->GROUNDED while customs_status stays PENDING, and a customs hold advances
          customs_status PENDING->HELD while handling_status stays GROUNDED.
        test_recipe:
          setup:
            - "A container grounded (handling_status=GROUNDED) under a berthed window, customs still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-5", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000005", name: "Parallel V", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "PARA5000050", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "A", bay: 5, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
          trigger:
            - call: "POST /customs-holds"
              payload: { container_id: "${cont_id}", reason: "INSPECTION" }
              as: CustomsOfficer
          assert:
            - "Container.${cont_id}.handling_status == GROUNDED"
            - "Container.${cont_id}.customs_status == HELD"

      - name: gate_appointment_noshow_reschedule_cycle
        grounds:
          - state_machines.GateAppointment.BOOKED_to_NO_SHOW
          - state_machines.GateAppointment.NO_SHOW_to_BOOKED
          - entities.GateAppointment.fields.no_show_count
        distinguishing_aspect: |
          GateAppointment is cyclic: BOOKED->NO_SHOW->BOOKED loops back to the start state while no_show_count
          increments each pass — a strictly non-linear shape on a different entity than Container.
        test_recipe:
          setup:
            - "A grounded, cleared container with a BOOKED gate appointment whose slot 2026-03-01T10:00:00Z..11:00:00Z has fully elapsed (clock 2026-03-01T11:30:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-6", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000006", name: "Cycle V", loa_m: 300, draft_m: 14.0, free_time_days: 60 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "CYCL6000060", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /yard-slots"
              payload: { block: "A", bay: 6, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "GET /containers/${cont_id}"
              payload: {}
              as: YardPlanner
              captures: { cont_v_now: $.data.version }
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v_now}" }
              as: CustomsOfficer
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-060", window_start: "2026-03-01T10:00:00.000Z", window_end: "2026-03-01T11:00:00.000Z" }
              as: GateOperator
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T11:30:00.000Z" }
              as: TerminalAdmin
            - call: "POST /gate-appointments/${appt_id}/mark-no-show"
              payload: {}
              as: GateOperator
          trigger:
            - call: "POST /gate-appointments/${appt_id}/reschedule"
              payload: { window_start: "2026-03-02T10:00:00.000Z", window_end: "2026-03-02T11:00:00.000Z" }
              as: GateOperator
          assert:
            - "GateAppointment.${appt_id}.status == BOOKED"
            - "GateAppointment.${appt_id}.no_show_count == 1"
            - "GateAppointment.${appt_id}.window_start == 2026-03-02T10:00:00.000Z"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_gateout_invoice_slot_free_cascade     # depth >= 3
        grounds:
          - state_machines.Container.GROUNDED_to_GATED_OUT
          - state_machines.GateAppointment.ARRIVED_to_FULFILLED
          - entities.YardSlot.fields.status
          - entities.DemurrageInvoice.fields.amount_cents
        distinguishing_aspect: |
          Depth-3 cascade from gate-appointment fulfill: fulfill mutates the GateAppointment (->FULFILLED),
          which drives the Container (GROUNDED->GATED_OUT and demurrage recompute), which in turn frees the
          YardSlot (OCCUPIED->EMPTY) and mints a DemurrageInvoice — each link caused by the prior link.
        test_recipe:
          setup:
            - "A cleared, grounded container occupying a slot, with an ARRIVED appointment; clock 2026-02-13T12:00:00Z (8 chargeable days, free expires 2026-02-06T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-7", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000007", name: "Cascade V", loa_m: 300, draft_m: 14.0, free_time_days: 5 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-25T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "CASC7000070", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id, cont_v: $.data.version }
            - call: "POST /yard-slots"
              payload: { block: "A", bay: 7, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "GET /containers/${cont_id}"
              payload: {}
              as: YardPlanner
              captures: { cont_v_now: $.data.version }
            - call: "POST /containers/${cont_id}/customs-clear"
              payload: { expected_container_version: "${cont_v_now}" }
              as: CustomsOfficer
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-13T12:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-070", window_start: "2026-02-13T12:00:00.000Z", window_end: "2026-02-13T13:00:00.000Z" }
              as: GateOperator
              captures: { appt_id: $.data.id }
            - call: "POST /gate-appointments/${appt_id}/check-in"
              payload: {}
              as: GateOperator
          trigger:
            - call: "POST /gate-appointments/${appt_id}/fulfill"
              payload: { condition: "SOUND" }
              as: GateOperator
          assert:
            - "Container.${cont_id}.handling_status == GATED_OUT"
            - "Container.${cont_id}.yard_slot_id == null"
            - "YardSlot.${slot_id}.status == EMPTY"
            - "YardSlot.${slot_id}.occupied_by_container_id == null"
            - "the created DemurrageInvoice.amount_cents == 59000"

      - name: berth_cascade_free_time_to_container          # depth >= 2
        grounds:
          - state_machines.BerthWindow.SCHEDULED_to_BERTHED
          - entities.Container.fields.free_time_expires_at
          - entities.BerthWindow.fields.actual_berth_at
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (berth): berthing the BerthWindow sets its actual_berth_at,
          which in turn recomputes free_time_expires_at on every discharged Container of that window
          (actual_berth_at + free_time_days), distinct from the fulfill-originated cascade above.
        test_recipe:
          setup:
            - "A SCHEDULED berth window with two discharged containers (free_time_days=5); free_time_expires_at null until berth."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-8", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000008", name: "FreeTime V", loa_m: 300, draft_m: 14.0, free_time_days: 5 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /containers"
              payload: { container_number: "FREE8000080", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /containers"
              payload: { container_number: "FREE8000081", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont2_id: $.data.id }
          trigger:
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
          assert:
            - "BerthWindow.${bw_id}.actual_berth_at == 2026-02-01T00:00:00.000Z"
            - "Container.${cont_id}.free_time_expires_at == 2026-02-06T00:00:00.000Z"
            - "Container.${cont2_id}.free_time_expires_at == 2026-02-06T00:00:00.000Z"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_stacking_on_gateout       # state (p7) vs business_safety (p9)
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - state_machines.Container.GROUNDED_to_GATED_OUT
        distinguishing_aspect: |
          When a fulfill targets an appointment still in BOOKED (state violation, p7) AND a box is stacked above
          the container (stacking violation, p9), the lower-priority-number state check wins: ERR_INVALID_STATE,
          not ERR_STACKING_VIOLATION — a state vs business_safety pair.
        test_recipe:
          setup:
            - "A cleared grounded container at tier 1 with another container stacked at tier 2 above it; a BOOKED (not ARRIVED) appointment for the bottom container in its current slot window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-9", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000009", name: "Stack V", loa_m: 300, draft_m: 14.0, free_time_days: 60 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "BTM9000090", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { bottom_id: $.data.id, bottom_v: $.data.version }
            - call: "POST /containers"
              payload: { container_number: "TOP9000091", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { top_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "B", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot1_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "B", bay: 1, row: 1, tier: 2, below_slot_id: "${slot1_id}" }
              as: YardPlanner
              captures: { slot2_id: $.data.id }
            - call: "POST /containers/${bottom_id}/ground"
              payload: { yard_slot_id: "${slot1_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /containers/${top_id}/ground"
              payload: { yard_slot_id: "${slot2_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /containers/${bottom_id}/customs-clear"
              payload: { expected_container_version: "${bottom_v}" }
              as: CustomsOfficer
            - call: "POST /gate-appointments"
              payload: { container_id: "${bottom_id}", truck_plate: "TRK-090", window_start: "2026-02-02T10:00:00.000Z", window_end: "2026-02-02T11:00:00.000Z" }
              as: GateOperator
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /gate-appointments/${appt_id}/fulfill"
              payload: { condition: "SOUND" }
              as: GateOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: cross_entity_state_beats_slot_occupied_on_ground   # business_referential (p8) vs business_constraint (p10)
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - state_machines.Container.ON_VESSEL_to_GROUNDED
        distinguishing_aspect: |
          When grounding into an OCCUPIED slot (p10 slot-occupied, business_constraint) while the discharge
          window is still SCHEDULED (p8 cross-entity-state, business_referential), the lower-priority-number
          cross-entity check wins: ERR_CROSS_ENTITY_STATE, not ERR_SLOT_OCCUPIED — a different category pair.
        test_recipe:
          setup:
            - "A SCHEDULED (not berthed) window with one container; a yard slot already OCCUPIED by another grounded container from a different berthed window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-10", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_a_id: $.data.id }
            - call: "POST /berths"
              payload: { code: "B-11", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_b_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000010", name: "Occ V1", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_a_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000011", name: "Occ V2", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_b_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_a_id}", vessel_id: "${vessel_a_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_a_id: $.data.id, bw_a_v: $.data.version }
            - call: "POST /berth-windows/${bw_a_id}/berth"
              payload: { expected_berth_window_version: "${bw_a_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "OCCA000100", vessel_id: "${vessel_a_id}", berth_window_id: "${bw_a_id}" }
              as: YardPlanner
              captures: { occupier_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "C", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${occupier_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_b_id}", vessel_id: "${vessel_b_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_b_id: $.data.id }
            - call: "POST /containers"
              payload: { container_number: "OCCB000101", vessel_id: "${vessel_b_id}", berth_window_id: "${bw_b_id}" }
              as: YardPlanner
              captures: { newcomer_id: $.data.id }
          trigger:
            - call: "POST /containers/${newcomer_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_CROSS_ENTITY_STATE"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: demurrage_zero_at_exact_free_time_expiry      # numeric threshold, demurrage-quote endpoint
        grounds:
          - calculations.demurrage_charge
          - entities.Container.fields.free_time_expires_at
        distinguishing_aspect: |
          At clock == free_time_expires_at exactly, demurrage_due_cents == 0 (boundary exclusive); one second
          later it becomes 5000 (one full chargeable day). Tested via GET /containers/{id}/demurrage-quote.
        test_recipe:
          setup:
            - "Container under a window berthed 2026-02-01T00:00:00Z, free_time_days=5 (free expires 2026-02-06T00:00:00Z); clock set exactly to 2026-02-06T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-12", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000012", name: "Boundary V", loa_m: 300, draft_m: 14.0, free_time_days: 5 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-25T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "BND12000120", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "D", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-06T00:00:00.000Z" }
              as: TerminalAdmin
          trigger:
            - call: "GET /containers/${cont_id}/demurrage-quote"
              payload: {}
              as: GateOperator
          assert:
            - "demurrage-quote.chargeable_days == 0"
            - "demurrage-quote.demurrage_due_cents == 0"

      - name: reefer_excursion_strict_band_boundary         # strict > band, reefer-readings endpoint
        grounds:
          - calculations.reefer_excursion_flag
          - entities.ReeferReading.fields.is_excursion
          - constants.EXCURSION_BAND_C
        distinguishing_aspect: |
          A reading exactly EXCURSION_BAND_C (2.0C) off setpoint is NOT an excursion (strict >, not >=);
          2.1C off IS. A distinct metric (temperature deviation) on a distinct endpoint (POST reefer-readings)
          from the demurrage boundary above.
        test_recipe:
          setup:
            - "A reefer container with setpoint_c=-18.0 declared under a berthed window."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-13", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000013", name: "Reefer Bnd", loa_m: 250, draft_m: 12.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "RBND130130", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}", is_reefer: true, setpoint_c: -18.0 }
              as: YardPlanner
              captures: { cont_id: $.data.id }
          trigger:
            - call: "POST /containers/${cont_id}/reefer-readings"
              payload: { recorded_at: "2026-02-01T01:00:00.000Z", temperature_c: -16.0 }
              as: ReeferTechnician
              captures: { reading_excursion: $.data.is_excursion }
          assert:
            - "ReeferReading.is_excursion == false"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: gateout_blocked_until_container_customs_cleared   # Container handling depends on Container customs
        grounds:
          - validations[priority=8]
          - state_machines.Container.GROUNDED_to_GATED_OUT
          - entities.Container.fields.customs_status
        distinguishing_aspect: |
          A Container's GROUNDED->GATED_OUT transition is blocked while its own customs_status is HELD; the
          fulfill is rejected with ERR_CROSS_ENTITY_STATE — the handling dimension depends on the customs
          dimension (Container<->Container parallel-dimension pairing).
        test_recipe:
          setup:
            - "A grounded container with an ACTIVE customs hold (customs_status=HELD) and an ARRIVED appointment."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-14", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000014", name: "Held V", loa_m: 300, draft_m: 14.0, free_time_days: 60 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
              captures: { bw_id: $.data.id, bw_v: $.data.version }
            - call: "POST /berth-windows/${bw_id}/berth"
              payload: { expected_berth_window_version: "${bw_v}" }
              as: BerthPlanner
            - call: "POST /containers"
              payload: { container_number: "HELD140140", vessel_id: "${vessel_id}", berth_window_id: "${bw_id}" }
              as: YardPlanner
              captures: { cont_id: $.data.id }
            - call: "POST /yard-slots"
              payload: { block: "E", bay: 1, row: 1, tier: 1 }
              as: YardPlanner
              captures: { slot_id: $.data.id }
            - call: "POST /containers/${cont_id}/ground"
              payload: { yard_slot_id: "${slot_id}", condition: "SOUND" }
              as: YardPlanner
            - call: "POST /customs-holds"
              payload: { container_id: "${cont_id}", reason: "INSPECTION" }
              as: CustomsOfficer
            - call: "POST /gate-appointments"
              payload: { container_id: "${cont_id}", truck_plate: "TRK-140", window_start: "2026-02-02T10:00:00.000Z", window_end: "2026-02-02T11:00:00.000Z" }
              as: GateOperator
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-02T10:30:00.000Z" }
              as: TerminalAdmin
            - call: "POST /gate-appointments/${appt_id}/check-in"
              payload: {}
              as: GateOperator
          trigger:
            - call: "POST /gate-appointments/${appt_id}/fulfill"
              payload: { condition: "SOUND" }
              as: GateOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_CROSS_ENTITY_STATE"
            - "Container.${cont_id}.handling_status == GROUNDED"

      - name: ground_blocked_until_berth_window_berthed         # Container handling depends on BerthWindow state
        grounds:
          - validations[priority=8]
          - state_machines.Container.ON_VESSEL_to_GROUNDED
          - state_machines.BerthWindow.SCHEDULED_to_BERTHED
        distinguishing_aspect: |
          A Container's ON_VESSEL->GROUNDED transition is blocked while its discharge BerthWindow is still
          SCHEDULED; grounding is rejected with ERR_CROSS_ENTITY_STATE — a Container<->BerthWindow pairing
          distinct from the Container<->Container pairing above.
        test_recipe:
          setup:
            - "A container discharged under a SCHEDULED (not yet berthed) window, plus an EMPTY ground slot."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: TerminalAdmin
            - call: "POST /berths"
              payload: { code: "B-15", length_m: 400, draft_m: 16.0 }
              as: TerminalAdmin
              captures: { berth_id: $.data.id }
            - call: "POST /vessels"
              payload: { imo_number: "1000015", name: "Sched V", loa_m: 300, draft_m: 14.0 }
              as: TerminalAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /berth-windows"
              payload: { berth_id: "${berth_id}", vessel_id: "${vessel_id}", eta: "2026-02-01T00:00:00.000Z", etd: "2026-02-10T00:00:00.000Z" }
              as: BerthPlanner
