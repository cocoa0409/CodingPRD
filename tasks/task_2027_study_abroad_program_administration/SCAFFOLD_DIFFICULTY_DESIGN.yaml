  - rule_id: transitive_cascade
    instances:
      - name: advisory_suspension_cascade
        grounds:
          - state_machines.Program.OPEN_to_SUSPENDED
          - state_machines.Application.COMMITTED_to_WITHDRAWN
          - state_machines.BillingStatement.PARTIALLY_PAID_to_VOID
          - state_machines.InsuranceEnrollment.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chained cascade from a travel-advisory create: advisory
          (DO_NOT_TRAVEL, window fully containing the program) -> Program
          SUSPENDED -> COMMITTED Application WITHDRAWN (SYSTEM_SUSPENSION) ->
          BillingStatement VOID with credit memo AND InsuranceEnrollment
          CANCELLED. Each link is caused by the previous link's transition,
          not by the original POST.
        test_recipe:
          setup:
            - "FR program OPEN (dates 2027-01-10..2027-05-10); one application COMMITTED with an ACTIVE insurance enrollment and a statement carrying a 200000-cent payment"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
