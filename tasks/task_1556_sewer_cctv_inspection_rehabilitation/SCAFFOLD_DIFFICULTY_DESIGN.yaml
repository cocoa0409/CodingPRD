            - call: "POST /sewer/flow-periods/${f2_id}/activate"
              payload: {}
              as: DistrictEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == 'ERR_FLOW_WINDOW_CONFLICT' (closed-interval semantics: F2.window_start == F1.window_end shares an endpoint, which COUNTS as overlap — unlike the bypass half-open rule)"
  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_commit_release_invariant_on_reopen
        grounds:
          - state_machines.RehabPlan.PROPOSED_to_APPROVED
          - state_machines.RehabPlan.APPROVED_to_DRAFT
          - entities.SewerDistrict.fields.budget_committed_cents
        distinguishing_aspect: |
          Conserved quantity: district budget commitment ledger.
          invariant: budget_committed_cents after (approve then reopen) ==
          budget_committed_cents before the pair; approve adds
          provisional_total_cents, reopen subtracts exactly the same amount.
        test_recipe:
          setup:
            - "District D budget 100000000, committed starts 0"
            - "Segment S with certified grade-3 baseline; plan P SPOT_REPAIR proposed; W line 1 @ 250000 -> provisional 400000"
            - "Clock 2026-08-10"
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-CI1", ii_reduction_target_pct: 25, budget_cents: 100000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Coder CI1", nassco_cert_number: "PACP-CCI1", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
