            - "Department CC-100 restricted to allowed_revenue_code_values ['0300'] and department CC-200 unrestricted."
            - "One COST_PLUS_MARKUP rule on 0300 and one ACTIVE item CDM-1001 priced under it."
            - "Contracts AETNA/COMMERCIAL (term 2026-01-01 .. 2026-09-30) and BCBS/COMMERCIAL (term 2026-01-01 .. 2026-12-31)."
