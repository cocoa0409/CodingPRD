# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: ASSESSMENT_SCHEDULED
        trigger: "POST /cases/{caseId}/assessments (create initial assessment)"
        actor: IntakeCoordinator
        preconditions:
          - "Case must be in INTAKE state"
        side_effects:
          - "Creates Assessment with status=SCHEDULED"

      - from: ASSESSMENT_SCHEDULED
        to: ASSESSED
        trigger: "system (when Assessment.status transitions to COMPLETED)"
        actor: system
        preconditions:
          - "All INITIAL assessments for the case are COMPLETED"
        side_effects:
          - "Recompute ada_scope_score and caps_scope_score from latest assessment"
          - "Recompute safety_risk_index"

      - from: ASSESSED
        to: QUOTE_DRAFTED
        trigger: "POST /cases/{caseId}/quotes (create quote)"
        actor: ProjectManager
        preconditions:
          - "Case must be ASSESSED"
          - "At least one COMPLETED assessment exists"
        side_effects:
          - "Creates Quote with status=DRAFT"

      - from: QUOTE_DRAFTED
        to: QUOTE_SUBMITTED
        trigger: "POST /cases/{caseId}/quotes/{quoteId}/submit"
        actor: ProjectManager
        preconditions:
          - "Quote has at least one line item"
          - "All line items have positive quantity and price"
        side_effects:
          - "Quote.status → SUBMITTED"
          - "Compute funding_gap_cents = total_cents - total_funded_cents"

      - from: QUOTE_SUBMITTED
        to: FUNDING_PENDING
        trigger: "system (when funding is sought)"
        actor: system
        preconditions:
          - "Quote is SUBMITTED"
        side_effects: []

      - from: FUNDING_PENDING
        to: FUNDING_APPROVED
        trigger: "system (when sufficient funding approved)"
        actor: system
        preconditions:
          - "sum(approved funding) >= quote.total_cents"
        side_effects:
          - "funding_posture → FULLY_FUNDED"

      - from: FUNDING_APPROVED
        to: INSTALLATION_SCHEDULED
        trigger: "POST /cases/{caseId}/installation-jobs (schedule installation)"
        actor: ProjectManager
        preconditions:
          - "Case is FUNDING_APPROVED or SELF_PAY approved"
          - "Permit status is NOT_REQUIRED or ISSUED"
        side_effects:
          - "Creates InstallationJob with status=SCHEDULED"

      - from: INSTALLATION_SCHEDULED
        to: INSTALLED
        trigger: "system (when InstallationJob.status → COMPLETED)"
        actor: system
        preconditions:
          - "InstallationJob.actual_end is set"
        side_effects:
          - "Set warranty_start_date = actual_end"
          - "warranty_months defaults to 12"
          - "Schedule POST_INSTALL reassessment for 30 days after completion"

      - from: INSTALLED
        to: INSPECTED
        trigger: "system (when final Inspection.outcome → PASSED)"
        actor: system
        preconditions:
          - "Final inspection passed"
        side_effects:
          - "InstallationJob.inspection_status → PASSED"

      - from: INSPECTED
        to: WARRANTY_ACTIVE
        trigger: "system (automatic on inspection pass)"
        actor: system
        preconditions: []
        side_effects:
          - "Case enters warranty period"

      - from: WARRANTY_ACTIVE
        to: CLOSED
        trigger: "POST /cases/{caseId}/close"
        actor: ProjectManager
        preconditions:
          - "No OPEN warranty claims"
          - "No unpaid invoices with balance > 0"
          - "All rental ramps RETURNED or CANCELLED"
        side_effects: []

      - from: [INTAKE, ASSESSMENT_SCHEDULED, ASSESSED, QUOTE_DRAFTED, QUOTE_SUBMITTED, FUNDING_PENDING, FUNDING_APPROVED, INSTALLATION_SCHEDULED]
        to: CANCELLED
        trigger: "POST /cases/{caseId}/cancel"
        actor: ProjectManager
        preconditions:
          - "No non-terminal InstallationJob"
          - "No active RentalRamp"
        side_effects:
          - "All PENDING assessments → CANCELLED"
          - "All DRAFT/SUBMITTED quotes → SUPERSEDED"
          - "All PENDING funding sources → WITHDRAWN"
          - "All SCHEDULED OT consultations → CANCELLED"

  - entity: Assessment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cases/{caseId}/assessments/{assessmentId}/start"
        actor: Assessor
        preconditions:
          - "Assessment is SCHEDULED"
          - "scheduled_date <= current date"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cases/{caseId}/assessments/{assessmentId}/complete"
        actor: Assessor
        preconditions:
          - "All required scores provided"
        side_effects:
          - "completed_date set"
          - "ada_compliance_pct computed"
          - "caps_recommendation_score computed"
          - "rental_eligible and purchase_required computed"
          - "Trigger Case status re-evaluation"

      - from: [SCHEDULED, IN_PROGRESS]
        to: CANCELLED
        trigger: "POST /cases/{caseId}/assessments/{assessmentId}/cancel"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cases/{caseId}/quotes/{quoteId}/submit"
        actor: ProjectManager
        preconditions:
          - "At least one line item exists"
          - "valid_until > current date"
        side_effects:
          - "submitted_at set"
          - "funding_gap_cents computed"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /cases/{caseId}/quotes/{quoteId}/start-review"
        actor: FundingCoordinator
        preconditions: []
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /cases/{caseId}/quotes/{quoteId}/approve"
        actor: FundingCoordinator
        preconditions:
          - "Sufficient funding allocated or self-pay approved"
        side_effects:
          - "decided_at set"
          - "All PENDING FundingAllocations → COMMITTED"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /cases/{caseId}/quotes/{quoteId}/reject"
        actor: FundingCoordinator
        preconditions: []
        side_effects:
          - "decided_at set"
          - "All PENDING FundingAllocations → RELEASED"

      - from: [DRAFT, SUBMITTED, UNDER_REVIEW]
        to: SUPERSEDED
        trigger: "system (when new quote revision created)"
        actor: system
        preconditions:
          - "New Quote with same case_id and higher revision created"
        side_effects:
          - "superseded_by_id set to new quote id"
          - "All PENDING FundingAllocations → RELEASED"

      - from: [DRAFT, SUBMITTED, UNDER_REVIEW]
        to: EXPIRED
        trigger: "system (when current date > valid_until)"
        actor: system
        preconditions: []
        side_effects:
          - "All PENDING FundingAllocations → RELEASED"

  - entity: FundingSource
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN, EXHAUSTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /cases/{caseId}/funding-sources/{sourceId}/approve"
        actor: FundingCoordinator
        preconditions:
          - "approved_cents provided and > 0"
        side_effects:
          - "decision_date set"
          - "remaining_cents = approved_cents"
          - "Case.funding_posture recomputed"

      - from: PENDING
        to: DENIED
        trigger: "POST /cases/{caseId}/funding-sources/{sourceId}/deny"
        actor: FundingCoordinator
        preconditions: []
        side_effects:
          - "decision_date set"
          - "Case.funding_posture recomputed"

      - from: [PENDING]
        to: WITHDRAWN
        trigger: "POST /cases/{caseId}/funding-sources/{sourceId}/withdraw"
        actor: FundingCoordinator
        preconditions: []
        side_effects:
          - "All PENDING allocations → RELEASED"

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (when remaining_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FundingAllocation
    initial_state: PENDING
    terminal_states: [COMMITTED, RELEASED, REVERSED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: "system (when parent Quote → APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "committed_at set"
          - "FundingSource.remaining_cents -= amount_cents"

      - from: PENDING
        to: RELEASED
        trigger: "system (when parent Quote → REJECTED/SUPERSEDED/EXPIRED or FundingSource → WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMMITTED
        to: REVERSED
        trigger: "POST /cases/{caseId}/funding-sources/{sourceId}/allocations/{allocId}/reverse"
        actor: FundingCoordinator
        preconditions:
          - "Invoice not yet paid against this allocation"
        side_effects:
          - "FundingSource.remaining_cents += amount_cents"
          - "Case.total_funded_cents recomputed"

  - entity: InstallationJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: MATERIALS_ORDERED
        trigger: "POST /cases/{caseId}/installation-jobs/{jobId}/order-materials"
        actor: ProjectManager
        preconditions: []
        side_effects: []

      - from: MATERIALS_ORDERED
        to: IN_PROGRESS
        trigger: "POST /cases/{caseId}/installation-jobs/{jobId}/start"
        actor: CrewLead
        preconditions:
          - "current date >= scheduled_start"
        side_effects:
          - "actual_start set"

      - from: IN_PROGRESS
        to: PUNCH_LIST
        trigger: "POST /cases/{caseId}/installation-jobs/{jobId}/punch-list"
        actor: CrewLead
        preconditions: []
        side_effects: []

      - from: [PUNCH_LIST, IN_PROGRESS]
        to: COMPLETED
        trigger: "POST /cases/{caseId}/installation-jobs/{jobId}/complete"
        actor: CrewLead
        preconditions:
          - "progress_pct = 100"
          - "No unresolved safety-critical punch items"
        side_effects:
          - "actual_end set"
          - "warranty_start_date = actual_end"
          - "Case → INSTALLED"
          - "Auto-create POST_INSTALL ReassessmentSchedule"

      - from: [SCHEDULED, MATERIALS_ORDERED]
        to: CANCELLED
        trigger: "POST /cases/{caseId}/installation-jobs/{jobId}/cancel"
        actor: ProjectManager
        preconditions:
          - "actual_start is null"
        side_effects:
          - "All committed funding allocations → REVERSED"

  - entity: RentalRamp
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: DELIVERED
        trigger: "POST /cases/{caseId}/rental-ramps/{rampId}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "InventoryUnit.status = RESERVED"
          - "current date >= rental_start"
        side_effects:
          - "InventoryUnit.status → DEPLOYED"

      - from: DELIVERED
        to: INSTALLED
        trigger: "POST /cases/{caseId}/rental-ramps/{rampId}/install"
        actor: CrewLead
        preconditions: []
        side_effects: []

      - from: INSTALLED
        to: IN_USE
        trigger: "system (automatic when rental period active)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [IN_USE, INSTALLED]
        to: PICKUP_SCHEDULED
        trigger: "POST /cases/{caseId}/rental-ramps/{rampId}/schedule-pickup"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

      - from: PICKUP_SCHEDULED
        to: RETURNED
        trigger: "POST /cases/{caseId}/rental-ramps/{rampId}/confirm-pickup"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "actual_pickup set"
          - "InventoryUnit.status → AVAILABLE"
          - "InventoryUnit.total_rental_days += rental duration"
          - "deposit_status → REFUNDED or FORFEITED based on condition"
          - "Final invoice generated for any unbilled period"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /cases/{caseId}/rental-ramps/{rampId}/cancel"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "InventoryUnit.status → AVAILABLE"
          - "deposit_status → REFUNDED"

  - entity: InventoryUnit
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (when RentalRamp created referencing this unit)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: DEPLOYED
        trigger: "system (when RentalRamp → DELIVERED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DEPLOYED
        to: AVAILABLE
        trigger: "system (when RentalRamp → RETURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "total_rental_days updated"

      - from: RESERVED
        to: AVAILABLE
        trigger: "system (when RentalRamp → CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [AVAILABLE, DEPLOYED]
        to: MAINTENANCE
        trigger: "POST /inventory-units/{unitId}/maintenance"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /inventory-units/{unitId}/return-to-service"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

      - from: [AVAILABLE, MAINTENANCE]
        to: RETIRED
        trigger: "POST /inventory-units/{unitId}/retire"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects: []

  - entity: Inspection
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /cases/{caseId}/inspections/{inspectionId}/pass"
        actor: Inspector
        preconditions:
          - "No safety-critical deficiencies"
        side_effects:
          - "completed_date set"
          - "ada_compliant = true"
          - "If FINAL type: InstallationJob.inspection_status → PASSED"
          - "If FINAL type: Case → INSPECTED"

      - from: PENDING
        to: FAILED
        trigger: "POST /cases/{caseId}/inspections/{inspectionId}/fail"
        actor: Inspector
        preconditions: []
        side_effects:
          - "completed_date set"
          - "reinspection_required = true"
          - "correction_deadline set"
          - "If FINAL type: InstallationJob remains IN_PROGRESS"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /cases/{caseId}/invoices/{invoiceId}/send"
        actor: BillingCoordinator
        preconditions:
          - "At least one line item"
        side_effects:
          - "issue_date set"
          - "Case.total_billed_cents += total_cents"
          - "Case.balance_due_cents recomputed"

      - from: SENT
        to: PARTIALLY_PAID
        trigger: "POST /cases/{caseId}/invoices/{invoiceId}/record-payment"
        actor: BillingCoordinator
        preconditions:
          - "payment amount > 0 and < balance_cents"
        side_effects:
          - "amount_paid_cents += payment"
          - "Case.total_paid_cents += payment"
          - "Case.balance_due_cents recomputed"

      - from: [SENT, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /cases/{caseId}/invoices/{invoiceId}/record-payment (when payment = balance)"
        actor: BillingCoordinator
        preconditions:
          - "payment amount = balance_cents"
        side_effects:
          - "paid_date set"
          - "amount_paid_cents = total_cents"
          - "Case.total_paid_cents recomputed"
          - "Case.balance_due_cents recomputed"

      - from: [SENT, PARTIALLY_PAID]
        to: OVERDUE
        trigger: "system (when current date > due_date and balance > 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [DRAFT, SENT, PARTIALLY_PAID, OVERDUE]
        to: VOID
        trigger: "POST /cases/{caseId}/invoices/{invoiceId}/void"
        actor: BillingCoordinator
        preconditions:
          - "amount_paid_cents = 0"
        side_effects:
          - "Case.total_billed_cents -= total_cents"
          - "Case.balance_due_cents recomputed"

      - from: SENT
        to: DISPUTED
        trigger: "POST /cases/{caseId}/invoices/{invoiceId}/dispute"
        actor: Client
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [RESOLVED, DENIED, CLOSED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /cases/{caseId}/warranty-claims/{claimId}/assign"
        actor: ProjectManager
        preconditions: []
        side_effects: []

      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /cases/{caseId}/warranty-claims/{claimId}/start"
        actor: CrewLead
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /cases/{caseId}/warranty-claims/{claimId}/resolve"
        actor: CrewLead
        preconditions:
          - "resolution_type provided"
          - "cost_cents provided"
        side_effects:
          - "resolved_date set"
          - "If not covered_by_warranty: create Invoice for cost"

      - from: [OPEN, ASSIGNED]
        to: DENIED
        trigger: "POST /cases/{caseId}/warranty-claims/{claimId}/deny"
        actor: ProjectManager
        preconditions: []
        side_effects: []

      - from: [OPEN, ASSIGNED, IN_PROGRESS]
        to: CLOSED
        trigger: "POST /cases/{caseId}/warranty-claims/{claimId}/close"
        actor: ProjectManager
        preconditions: []
        side_effects: []

  - entity: OTConsultation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cases/{caseId}/ot-consultations/{consultId}/complete"
        actor: Assessor
        preconditions: []
        side_effects:
          - "completed_date set"
          - "clearance_given computed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cases/{caseId}/ot-consultations/{consultId}/cancel"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (when scheduled_date passes without completion)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReassessmentSchedule
    initial_state: PENDING
    terminal_states: [COMPLETED, WAIVED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /cases/{caseId}/reassessment-schedules/{scheduleId}/schedule"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

      - from: [PENDING, SCHEDULED]
        to: COMPLETED
        trigger: "system (when linked Assessment completes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [PENDING, SCHEDULED]
        to: OVERDUE
        trigger: "system (when due_date passes)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [PENDING, SCHEDULED, OVERDUE]
        to: WAIVED
        trigger: "POST /cases/{caseId}/reassessment-schedules/{scheduleId}/waive"
        actor: ProjectManager
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{caseId}/quotes"
    occ_field: "expected_case_version"
    description: |
      Creating a Quote against a Case whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just modified the case (e.g., new assessment completed, funding
      approved) and the current writer's view of the case state is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: funding-approve-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{caseId}/funding-sources/{sourceId}/approve"
    occ_field: "expected_case_version"
    description: |
      Approving a FundingSource against a Case whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created a quote or modified allocations
      and the current writer's funding decision would be based on stale data.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-send-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{caseId}/invoices/{invoiceId}/send"
    occ_field: "expected_case_version"
    description: |
      Sending an Invoice against a Case whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just modified funding or quotes and the billing decision
      would be based on stale financial state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_total_calculation
    trigger: "quote creation, line item modification, quote submission"
    algorithm: aggregation
    formula: |
      1. For each QuoteLineItem:
         extended_price_cents = round(quantity * unit_price_cents, 0)
         tax_cents = round(extended_price_cents * tax_rate_pct / 100, 0) if is_taxable else 0
      2. labor_cost_cents = sum(extended_price_cents where line_type = LABOR)
      3. material_cost_cents = sum(extended_price_cents where line_type = MATERIAL)
      4. permit_fee_cents = sum(extended_price_cents where line_type = PERMIT)
      5. equipment_cost_cents = sum(extended_price_cents where line_type in [EQUIPMENT_RENTAL, EQUIPMENT_PURCHASE])
      6. subtotal_cents = labor + material + permit + equipment + other line types
      7. contingency_cents = round(subtotal_cents * contingency_pct / 100, 0)
      8. total_cents = subtotal_cents + contingency_cents - discount_cents
      9. total_tax_cents = sum(all tax_cents)
    constants:
      MAX_CONTINGENCY_PCT: 25.0
      DEFAULT_CONTINGENCY_PCT: 10.0
    precision: "0 decimal places (integer cents), round_half_up per line item"
    variants:
      - name: line_item_rounding
        when: "each line item computed independently"
        difference: "round each extended_price and tax_cents before summing"
      - name: aggregate_rounding
        when: "sum raw values then round at total"
        difference: "sum quantity*price first, then round subtotal and tax"

  - name: funding_gap_calculation
    trigger: "quote submission, funding approval, allocation change"
    algorithm: threshold
    formula: |
      funding_gap_cents = max(0, quote.total_cents - case.total_funded_cents)
      funding_posture:
        if total_funded_cents = 0: UNFUNDED
        elif total_funded_cents < total_quoted_cents: PARTIALLY_FUNDED
        elif total_funded_cents = total_quoted_cents: FULLY_FUNDED
        else: OVERFUNDED
    precision: "0 decimal places, integer cents"

  - name: rental_rate_calculation
    trigger: "rental ramp creation, monthly billing run"
    algorithm: tiered_pricing
    formula: |
      Base rate from InventoryUnit.monthly_rate_cents.
      Duration discount tiers:
        1-3 months: 100% of base rate
        4-6 months: 90% of base rate
        7-12 months: 80% of base rate
        13+ months: 70% of base rate
      monthly_rate_cents = round(base_rate * tier_multiplier, 0)
      deposit_cents = min(2 * monthly_rate_cents, purchase_price_cents * 0.20)
    constants:
      TIER_1_MAX_MONTHS: 3
      TIER_2_MAX_MONTHS: 6
      TIER_3_MAX_MONTHS: 12
      TIER_1_MULT: 1.00
      TIER_2_MULT: 0.90
      TIER_3_MULT: 0.80
      TIER_4_MULT: 0.70
      DEPOSIT_MONTHS: 2
      DEPOSIT_CAP_PCT: 20.0
    precision: "0 decimal places, round_half_up"

  - name: ada_compliance_score
    trigger: "assessment completion"
    algorithm: weighted_scoring
    formula: |
      Weighted factors:
        entrance_access: 25%
        interior_circulation: 20%
        bathroom_access: 25%
        kitchen_access: 15%
        bedroom_access: 15%
      Each factor scored 0-100 based on measurements.
      ada_compliance_pct = sum(factor_score * weight)
      ada_scope_score = round(ada_compliance_pct, 0)
    precision: "2 decimal places intermediate, 0 decimal places final"

  - name: safety_risk_index
    trigger: "assessment completion"
    algorithm: weighted_scoring
    formula: |
      risk = (hazard_count * 0.5) + ((100 - mobility_score) * 0.05)
      risk = min(10.0, max(0.0, risk))
      safety_risk_index = round(risk, 1)
    constants:
      HAZARD_WEIGHT: 0.5
      MOBILITY_WEIGHT: 0.05
      MAX_RISK: 10.0
    precision: "1 decimal place"

  - name: invoice_tax_calculation
    trigger: "invoice creation"
    algorithm: aggregation
    formula: |
      For each InvoiceLineItem:
        extended_price_cents = round(quantity * unit_price_cents, 0)
        tax_cents = round(extended_price_cents * tax_rate_pct / 100, 0)
        line_total_cents = extended_price_cents + tax_cents
      subtotal_cents = sum(extended_price_cents)
      tax_cents = sum(tax_cents)
      total_cents = subtotal_cents + tax_cents
    precision: "0 decimal places, round_half_up per line"

  - name: funding_allocation_waterfall
    trigger: "quote approval"
    algorithm: waterfall_allocation
    formula: |
      Sort FundingSources by priority_rank ASC, then created_at ASC.
      For each FundingSource in order:
        if remaining_cents > 0 and quote needs funding:
          allocate = min(remaining_cents, remaining_quote_need)
          create FundingAllocation(amount_cents=allocate)
          remaining_cents -= allocate
          remaining_quote_need -= allocate
      Stop when quote fully funded or no more sources.
    note: "Respects funding source restrictions (e.g., NO_RENTAL excludes rental line items)"

  - name: billing_cycle_calculation
    trigger: "monthly rental billing run"
    algorithm: chronological
    formula: |
      For each active RentalRamp:
        days_in_period = days between last_billed_date and current_date
        prorated_amount = round(monthly_rate_cents * days_in_period / days_in_month, 0)
        Create InvoiceLineItem with period_start and period_end
      Group by case, create one Invoice per case.
    precision: "0 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right: caseId, then nested IDs)"
    error_id: "ERR_CASE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_FUNDING_SOURCE_NOT_FOUND | ERR_JOB_NOT_FOUND | ERR_RAMP_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_CONSULT_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Parent Case must be in a state that allows the child operation"
    error_id: "ERR_CASE_NOT_ACTIVE | ERR_CASE_NOT_ASSESSED | ERR_CASE_NOT_FUNDED | ERR_CASE_ALREADY_CLOSED"
    http_status: 409
    applies_to: "child creation and state transition endpoints"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for the requested transition"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_QUOTE_NOT_DRAFT | ERR_ASSESSMENT_NOT_SCHEDULED | ERR_JOB_NOT_IN_PROGRESS"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6a
    category: business_constraint
    check: "Quote must have at least one line item before submission"
    error_id: ERR_QUOTE_EMPTY
    http_status: 422
    applies_to: "POST /cases/{caseId}/quotes/{quoteId}/submit"

  - priority: 6b
    category: business_constraint
    check: "Quote line items must have positive quantity and unit_price"
    error_id: ERR_INVALID_LINE_ITEM
    http_status: 422
    applies_to: "POST /cases/{caseId}/quotes/{quoteId}/line-items"

  - priority: 7
    category: business_temporal
    check: "Assessment scheduled_date must not be in the past"
    error_id: ERR_INVALID_SCHEDULE_DATE
    http_status: 422
    applies_to: "POST /cases/{caseId}/assessments"

  - priority: 8
    category: business_referential
    check: "RentalRamp cannot be created if Assessment indicates purchase_required = true"
    error_id: ERR_RENTAL_NOT_CLINICALLY_INDICATED
    http_status: 422
    applies_to: "POST /cases/{caseId}/rental-ramps"

  - priority: 9
    category: business_referential
    check: "FundingSource with restriction NO_RENTAL cannot be allocated to rental line items"
    error_id: ERR_FUNDING_RESTRICTION_VIOLATION
    http_status: 422
    applies_to: "POST /cases/{caseId}/funding-sources/{sourceId}/allocations"

  - priority: 10
    category: business_fiscal
    check: "Funding allocation must not exceed source remaining_cents"
    error_id: ERR_ALLOCATION_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /cases/{caseId}/funding-sources/{sourceId}/allocations"

  - priority: 11
    category: business_fiscal
    check: "Invoice total must not exceed case total_funded_cents for third-party billing"
    error_id: ERR_INVOICE_EXCEEDS_FUNDING
    http_status: 422
    applies_to: "POST /cases/{caseId}/invoices"

  - priority: 12
    category: business_safety
    check: "InstallationJob cannot complete if safety-critical punch items are unresolved"
    error_id: ERR_SAFETY_ITEMS_UNRESOLVED
    http_status: 422
    applies_to: "POST /cases/{caseId}/installation-jobs/{jobId}/complete"

  - priority: 13
    category: business_temporal
    check: "Rental period must not overlap with existing active rental for same inventory unit"
    error_id: ERR_UNIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /cases/{caseId}/rental-ramps"

  - priority: 14
    category: business_temporal
    check: "Inspection scheduled_date must be after InstallationJob.actual_end for FINAL type"
    error_id: ERR_INSPECTION_BEFORE_COMPLETION
    http_status: 422
    applies_to: "POST /cases/{caseId}/inspections"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Case ---
  - method: POST
    path: "/cases"
    description: "Create a new Case"
    roles: [IntakeCoordinator]
    code: 201
    input: ["client_name", "client_address", "client_phone", "referral_source?"]
    output: Case
    side_effects: ["status=INTAKE, computed fields initialized"]

  - method: GET
    path: "/cases"
    description: "List all Cases"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "funding_posture?"]
    output: "Case[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}"
    description: "Get a specific Case"
    roles: [Any]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/cancel"
    description: "Cancel a case"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Case
    side_effects: ["status → CANCELLED, cascade cancel children"]

  - method: POST
    path: "/cases/{caseId}/close"
    description: "Close a case (from WARRANTY_ACTIVE)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Case
    side_effects: ["status → CLOSED"]

  # --- Assessment ---
  - method: POST
    path: "/cases/{caseId}/assessments"
    description: "Create an assessment"
    roles: [IntakeCoordinator, Assessor]
    code: 201
    input: ["assessor_id", "assessor_role", "assessment_type", "scheduled_date", "mobility_score", "hazard_count", "recommended_modifications?", "notes?"]
    output: Assessment
    side_effects: ["status=SCHEDULED, Case → ASSESSMENT_SCHEDULED if INTAKE"]

  - method: GET
    path: "/cases/{caseId}/assessments"
    description: "List assessments for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Assessment[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/assessments/{assessmentId}"
    description: "Get a specific assessment"
    roles: [Any]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/assessments/{assessmentId}/start"
    description: "Start an assessment"
    roles: [Assessor]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/cases/{caseId}/assessments/{assessmentId}/complete"
    description: "Complete an assessment"
    roles: [Assessor]
    code: 200
    input: ["mobility_score", "hazard_count", "recommended_modifications", "notes?"]
    output: Assessment
    side_effects: ["status → COMPLETED, compute scores, trigger Case status re-evaluation"]

  - method: POST
    path: "/cases/{caseId}/assessments/{assessmentId}/cancel"
    description: "Cancel an assessment"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status → CANCELLED"]

  # --- Quote ---
  - method: POST
    path: "/cases/{caseId}/quotes"
    description: "Create a quote"
    roles: [ProjectManager]
    code: 201
    input: ["valid_until", "contingency_pct?", "expected_case_version"]
    output: Quote
    side_effects: ["status=DRAFT, revision=1 or increment, compute quote_number"]

  - method: GET
    path: "/cases/{caseId}/quotes"
    description: "List quotes for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Quote[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/quotes/{quoteId}"
    description: "Get a specific quote"
    roles: [Any]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/quotes/{quoteId}/line-items"
    description: "Add a line item to a quote"
    roles: [ProjectManager]
    code: 201
    input: ["line_type", "description", "quantity", "unit", "unit_price_cents", "is_taxable?", "tax_rate_pct?", "funding_eligible?", "sort_order"]
    output: QuoteLineItem
    side_effects: ["Recompute quote totals"]

  - method: POST
    path: "/cases/{caseId}/quotes/{quoteId}/submit"
    description: "Submit a quote for review"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["status → SUBMITTED, compute funding_gap_cents"]

  - method: POST
    path: "/cases/{caseId}/quotes/{quoteId}/start-review"
    description: "Start quote review"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status → UNDER_REVIEW"]

  - method: POST
    path: "/cases/{caseId}/quotes/{quoteId}/approve"
    description: "Approve a quote"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status → APPROVED, commit funding allocations"]

  - method: POST
    path: "/cases/{caseId}/quotes/{quoteId}/reject"
    description: "Reject a quote"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: Quote
    side_effects: ["status → REJECTED, release funding allocations"]

  # --- FundingSource ---
  - method: POST
    path: "/cases/{caseId}/funding-sources"
    description: "Create a funding source"
    roles: [FundingCoordinator]
    code: 201
    input: ["source_type", "program_name", "requested_cents", "priority_rank", "application_number?", "expiration_date?", "restrictions?"]
    output: FundingSource
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/cases/{caseId}/funding-sources"
    description: "List funding sources for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FundingSource[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/funding-sources/{sourceId}"
    description: "Get a specific funding source"
    roles: [Any]
    code: 200
    input: []
    output: FundingSource
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/funding-sources/{sourceId}/approve"
    description: "Approve a funding source"
    roles: [FundingCoordinator]
    code: 200
    input: [approved_cents, expected_case_version]
    output: FundingSource
    side_effects: ["status → APPROVED, set remaining_cents, recompute case funding_posture"]

  - method: POST
    path: "/cases/{caseId}/funding-sources/{sourceId}/deny"
    description: "Deny a funding source"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: FundingSource
    side_effects: ["status → DENIED"]

  - method: POST
    path: "/cases/{caseId}/funding-sources/{sourceId}/withdraw"
    description: "Withdraw a funding source"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: FundingSource
    side_effects: ["status → WITHDRAWN, release allocations"]

  - method: POST
    path: "/cases/{caseId}/funding-sources/{sourceId}/allocations"
    description: "Create a funding allocation"
    roles: [FundingCoordinator]
    code: 201
    input: ["quote_id", "amount_cents", "allocation_type", "quote_line_item_id?"]
    output: FundingAllocation
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/cases/{caseId}/funding-sources/{sourceId}/allocations"
    description: "List allocations for a funding source"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FundingAllocation[]"
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/funding-sources/{sourceId}/allocations/{allocId}/reverse"
    description: "Reverse a committed allocation"
    roles: [FundingCoordinator]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: ["status → REVERSED, restore remaining_cents"]

  # --- InstallationJob ---
  - method: POST
    path: "/cases/{caseId}/installation-jobs"
    description: "Create an installation job"
    roles: [ProjectManager]
    code: 201
    input: ["quote_id", "scheduled_start", "scheduled_end", "crew_lead_id", "permit_number?", "warranty_months?"]
    output: InstallationJob
    side_effects: ["status=SCHEDULED, Case → INSTALLATION_SCHEDULED"]

  - method: GET
    path: "/cases/{caseId}/installation-jobs"
    description: "List installation jobs for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "InstallationJob[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/installation-jobs/{jobId}"
    description: "Get a specific installation job"
    roles: [Any]
    code: 200
    input: []
    output: InstallationJob
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/installation-jobs/{jobId}/order-materials"
    description: "Mark materials ordered"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["status → MATERIALS_ORDERED"]

  - method: POST
    path: "/cases/{caseId}/installation-jobs/{jobId}/start"
    description: "Start installation"
    roles: [CrewLead]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["status → IN_PROGRESS, set actual_start"]

  - method: POST
    path: "/cases/{caseId}/installation-jobs/{jobId}/punch-list"
    description: "Enter punch list phase"
    roles: [CrewLead]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["status → PUNCH_LIST"]

  - method: POST
    path: "/cases/{caseId}/installation-jobs/{jobId}/complete"
    description: "Complete installation"
    roles: [CrewLead]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["status → COMPLETED, set actual_end, Case → INSTALLED, create reassessment schedule"]

  - method: POST
    path: "/cases/{caseId}/installation-jobs/{jobId}/cancel"
    description: "Cancel installation job"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallationJob
    side_effects: ["status → CANCELLED, reverse funding allocations"]

  # --- RentalRamp ---
  - method: POST
    path: "/cases/{caseId}/rental-ramps"
    description: "Create a rental ramp reservation"
    roles: [LogisticsCoordinator]
    code: 201
    input: ["inventory_unit_id", "rental_start", "rental_end", "billing_cycle_day?"]
    output: RentalRamp
    side_effects: ["status=RESERVED, compute monthly_rate and deposit"]

  - method: GET
    path: "/cases/{caseId}/rental-ramps"
    description: "List rental ramps for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RentalRamp[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/rental-ramps/{rampId}"
    description: "Get a specific rental ramp"
    roles: [Any]
    code: 200
    input: []
    output: RentalRamp
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/rental-ramps/{rampId}/deliver"
    description: "Deliver rental ramp"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: RentalRamp
    side_effects: ["status → DELIVERED, InventoryUnit → DEPLOYED"]

  - method: POST
    path: "/cases/{caseId}/rental-ramps/{rampId}/install"
    description: "Install rental ramp"
    roles: [CrewLead]
    code: 200
    input: []
    output: RentalRamp
    side_effects: ["status → INSTALLED"]

  - method: POST
    path: "/cases/{caseId}/rental-ramps/{rampId}/schedule-pickup"
    description: "Schedule rental pickup"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: RentalRamp
    side_effects: ["status → PICKUP_SCHEDULED"]

  - method: POST
    path: "/cases/{caseId}/rental-ramps/{rampId}/confirm-pickup"
    description: "Confirm rental pickup"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: RentalRamp
    side_effects: ["status → RETURNED, InventoryUnit → AVAILABLE, refund/forfeit deposit, final invoice"]

  - method: POST
    path: "/cases/{caseId}/rental-ramps/{rampId}/cancel"
    description: "Cancel rental reservation"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: RentalRamp
    side_effects: ["status → CANCELLED, InventoryUnit → AVAILABLE, refund deposit"]

  # --- InventoryUnit ---
  - method: POST
    path: "/inventory-units"
    description: "Create an inventory unit"
    roles: [LogisticsCoordinator]
    code: 201
    input: ["unit_tag", "ramp_type", "length_feet", "width_inches", "weight_capacity_lbs", "monthly_rate_cents", "purchase_price_cents", "condition_grade?"]
    output: InventoryUnit
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/inventory-units"
    description: "List inventory units"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?", "ramp_type?"]
    output: "InventoryUnit[]"
    side_effects: []

  - method: GET
    path: "/inventory-units/{unitId}"
    description: "Get a specific inventory unit"
    roles: [Any]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: []

  - method: POST
    path: "/inventory-units/{unitId}/maintenance"
    description: "Send unit to maintenance"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: ["status → MAINTENANCE"]

  - method: POST
    path: "/inventory-units/{unitId}/return-to-service"
    description: "Return unit from maintenance"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: ["status → AVAILABLE"]

  - method: POST
    path: "/inventory-units/{unitId}/retire"
    description: "Retire an inventory unit"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: ["status → RETIRED"]

  # --- Inspection ---
  - method: POST
    path: "/cases/{caseId}/inspections"
    description: "Schedule an inspection"
    roles: [Inspector, ProjectManager]
    code: 201
    input: ["inspection_type", "inspector_id", "scheduled_date", "installation_job_id?"]
    output: Inspection
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/cases/{caseId}/inspections"
    description: "List inspections for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/inspections/{inspectionId}"
    description: "Get a specific inspection"
    roles: [Any]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/inspections/{inspectionId}/pass"
    description: "Pass an inspection"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status → PASSED, set ada_compliant, trigger job/case updates"]

  - method: POST
    path: "/cases/{caseId}/inspections/{inspectionId}/fail"
    description: "Fail an inspection"
    roles: [Inspector]
    code: 200
    input: [deficiencies, correction_deadline]
    output: Inspection
    side_effects: ["status → FAILED, set reinspection_required"]

  # --- Invoice ---
  - method: POST
    path: "/cases/{caseId}/invoices"
    description: "Create an invoice"
    roles: [BillingCoordinator]
    code: 201
    input: ["invoice_type", "due_date", "funding_source_id?", "quote_id?", "rental_ramp_id?", "expected_case_version"]
    output: Invoice
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/cases/{caseId}/invoices"
    description: "List invoices for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/invoices/{invoiceId}"
    description: "Get a specific invoice"
    roles: [Any]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/invoices/{invoiceId}/line-items"
    description: "Add line item to invoice"
    roles: [BillingCoordinator]
    code: 201
    input: ["description", "quantity", "unit_price_cents", "tax_rate_pct?", "period_start?", "period_end?"]
    output: InvoiceLineItem
    side_effects: ["Recompute invoice totals"]

  - method: POST
    path: "/cases/{caseId}/invoices/{invoiceId}/send"
    description: "Send an invoice"
    roles: [BillingCoordinator]
    code: 200
    input: [expected_case_version]
    output: Invoice
    side_effects: ["status → SENT, update case billing totals"]

  - method: POST
    path: "/cases/{caseId}/invoices/{invoiceId}/record-payment"
    description: "Record a payment"
    roles: [BillingCoordinator]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["Update status to PARTIALLY_PAID or PAID, update case totals"]

  - method: POST
    path: "/cases/{caseId}/invoices/{invoiceId}/void"
    description: "Void an invoice"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → VOID, reverse case totals"]

  - method: POST
    path: "/cases/{caseId}/invoices/{invoiceId}/dispute"
    description: "Dispute an invoice"
    roles: [Client]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status → DISPUTED"]

  # --- WarrantyClaim ---
  - method: POST
    path: "/cases/{caseId}/warranty-claims"
    description: "Create a warranty claim"
    roles: [Client, ProjectManager]
    code: 201
    input: [installation_job_id, issue_description, severity]
    output: WarrantyClaim
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/cases/{caseId}/warranty-claims"
    description: "List warranty claims for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/warranty-claims/{claimId}"
    description: "Get a specific warranty claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/warranty-claims/{claimId}/assign"
    description: "Assign a warranty claim"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status → ASSIGNED"]

  - method: POST
    path: "/cases/{caseId}/warranty-claims/{claimId}/start"
    description: "Start warranty work"
    roles: [CrewLead]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/cases/{caseId}/warranty-claims/{claimId}/resolve"
    description: "Resolve a warranty claim"
    roles: [CrewLead]
    code: 200
    input: [resolution_type, cost_cents]
    output: WarrantyClaim
    side_effects: ["status → RESOLVED, create invoice if not covered"]

  - method: POST
    path: "/cases/{caseId}/warranty-claims/{claimId}/deny"
    description: "Deny a warranty claim"
    roles: [ProjectManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status → DENIED"]

  # --- OTConsultation ---
  - method: POST
    path: "/cases/{caseId}/ot-consultations"
    description: "Schedule an OT consultation"
    roles: [IntakeCoordinator, Assessor]
    code: 201
    input: [ot_provider_id, consultation_type, scheduled_date, goals]
    output: OTConsultation
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/cases/{caseId}/ot-consultations"
    description: "List OT consultations for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "OTConsultation[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/ot-consultations/{consultId}"
    description: "Get a specific OT consultation"
    roles: [Any]
    code: 200
    input: []
    output: OTConsultation
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/ot-consultations/{consultId}/complete"
    description: "Complete an OT consultation"
    roles: [Assessor]
    code: 200
    input: [recommendations]
    output: OTConsultation
    side_effects: ["status → COMPLETED, set clearance_given"]

  - method: POST
    path: "/cases/{caseId}/ot-consultations/{consultId}/cancel"
    description: "Cancel an OT consultation"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: OTConsultation
    side_effects: ["status → CANCELLED"]

  # --- ReassessmentSchedule ---
  - method: POST
    path: "/cases/{caseId}/reassessment-schedules"
    description: "Create a reassessment schedule"
    roles: [IntakeCoordinator, ProjectManager]
    code: 201
    input: ["trigger_event", "due_date", "priority?"]
    output: ReassessmentSchedule
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/cases/{caseId}/reassessment-schedules"
    description: "List reassessment schedules for a case"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReassessmentSchedule[]"
    side_effects: []

  - method: GET
    path: "/cases/{caseId}/reassessment-schedules/{scheduleId}"
    description: "Get a specific reassessment schedule"
    roles: [Any]
    code: 200
    input: []
    output: ReassessmentSchedule
    side_effects: []

  - method: POST
    path: "/cases/{caseId}/reassessment-schedules/{scheduleId}/schedule"
    description: "Schedule a reassessment"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ReassessmentSchedule
    side_effects: ["status → SCHEDULED"]

  - method: POST
    path: "/cases/{caseId}/reassessment-schedules/{scheduleId}/waive"
    description: "Waive a reassessment"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ReassessmentSchedule
    side_effects: ["status → WAIVED"]

  # --- System/Test Endpoints ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the system clock for testing. Default startup time is 2026-05-01T00:00:00Z."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets logical clock"]

