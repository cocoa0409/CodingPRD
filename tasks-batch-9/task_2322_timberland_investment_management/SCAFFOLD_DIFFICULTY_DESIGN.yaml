  - rule_id: transitive_cascade
    instances:
      - name: hazard_event_cascades_stand_block_property_and_fund
        grounds:
          - calculations.hazard_loss_reallocation
          - state_machines.Stand.INVENTORIED_to_SALVAGE_PENDING
          - state_machines.HarvestBlock.RESERVED_to_VOIDED
          - state_machines.Property.ALIGNED_to_REPLAN_REQUIRED
          - entities.Fund.fields.replan_property_count
          - entities.HazardEvent.fields.reallocation_log
        distinguishing_aspect: |
          One POST /timberland/hazard-events propagates four levels deep — HazardEvent
          writes Stand (net_merch_tons 4647.12 -> 0.00, status SALVAGE_PENDING), the
          waterfall writes HarvestBlock (planned_tons 1000.00 -> 0.00, VOIDED with
          voided_reason HAZARD_LOSS), the block cut writes Property
          (harvest_plan_status REPLAN_REQUIRED) and Property writes Fund
          (replan_property_count 0 -> 1) — all inside the single request.
