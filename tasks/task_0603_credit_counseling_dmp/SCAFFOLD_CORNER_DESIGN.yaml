# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections, grounded in
# SCAFFOLD.yaml §1.1-§1.7. §1.8-covered corners are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_agency_returns_all_fields
        claim_type: Creation
        grounds: [entities.Agency, endpoints]
        distinguishing_aspect: "POST /agencies with name + fees returns 201 with id, current_cycle_index=0, and echoed setup/monthly fees."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI", setup_fee_cents: 5000, monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Agency.${ag}.current_cycle_index == 0"
            - "Agency.${ag}.setup_fee_cents == 5000"
            - "Agency.${ag}.version == 1"

      - name: get_client_not_found
        claim_type: Not Found
        grounds: [entities.Client, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET a nonexistent clientId under a real agency returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Agency exists; no clients."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "GET /agencies/clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Counselor
              as_user_id: "u1"
          assert:
            - "Response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_client_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Client.fields.gross_monthly_income_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /clients omitting gross_monthly_income_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Agency + counselor exist."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
          trigger:
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Dan" }
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: counselor_hud_certified_default_false
        claim_type: Defaults
        grounds: [entities.Counselor.fields.hud_certified]
        distinguishing_aspect: "Omitting hud_certified on counselor create applies default false."
        test_recipe:
          setup: ["Agency exists."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
          assert:
            - "Counselor.${cn}.hud_certified == false"
            - "Counselor.${cn}.status == ACTIVE"

      - name: client_dti_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Client.fields.back_end_dti, calculations.client_dti]
        distinguishing_aspect: "front_end_dti/back_end_dti are computed; gross=500000 housing=150000 with no debts yields front_end_dti==30.0 and back_end_dti==30.0 regardless of any client-supplied value."
        test_recipe:
          setup: ["Agency + counselor; client gross=500000 housing=150000, no debt accounts."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
          trigger:
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Dan", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
          assert:
            - "Client.${cl}.front_end_dti == 30.0"
            - "Client.${cl}.back_end_dti == 30.0"
            - "Client.${cl}.status == INTAKE"

      - name: duplicate_account_ref_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_ACCOUNT_REF]"]
        distinguishing_aspect: "Second non-DROPPED DebtAccount reusing account_ref 'DUP' (valid creditor) returns ERR_DUPLICATE_ACCOUNT_REF (409)."
        test_recipe:
          setup: ["Client already has a non-DROPPED account_ref='DUP'; new create reuses 'DUP' with a VALID creditor_id."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Lee", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "DUP", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { da1: $.data.id }
          trigger:
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "DUP", original_balance_cents: 200000, original_apr: 0.1999, min_payment_cents: 4500, proposed_monthly_payment_cents: 15000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_DUPLICATE_ACCOUNT_REF"
            - "HTTP status == 409"

      - name: deposit_record_immutable_no_version
        claim_type: Immutability
        grounds: [entities.DepositRecord]
        distinguishing_aspect: "DepositRecord has common_fields:false, so the response carries id and created_at but no version field and exposes no update endpoint."
        test_recipe:
          setup: ["ACTIVE client that recorded a deposit at the current cycle."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Mo", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/clients/${cl}/deposits"
              payload: { amount_cents: 33500 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { dep: $.data.id }
          assert:
            - "DepositRecord.${dep}.cycle_index == 0"
            - "DepositRecord response has no version field"

      - name: debt_account_requires_valid_client_parent
        claim_type: Parent Relationships
        grounds: [entities.DebtAccount.fields.client_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a debt account under a nonexistent clientId path returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Agency + creditor exist; no such client."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
          trigger:
            - call: "POST /agencies/clients/00000000-0000-4000-8000-000000000000/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: complete_session_from_completed_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.CounselingSession.OPEN_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /complete on an already-COMPLETED session returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A COMPLETED BUDGET_INTAKE session (DTI passes)."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Nia", gross_monthly_income_cents: 400000, housing_payment_cents: 0 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 60000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "CounselingSession.${sess}.status == COMPLETED"

      - name: certify_budget_intake_not_certifiable
        claim_type: Invalid Transitions
        grounds: [state_machines.CounselingSession.COMPLETED_to_CERTIFIED, "errors[ERR_SESSION_NOT_CERTIFIABLE]"]
        distinguishing_aspect: "Certifying a COMPLETED BUDGET_INTAKE session returns ERR_SESSION_NOT_CERTIFIABLE (409); only bankruptcy/HUD types are certifiable."
        test_recipe:
          setup: ["A COMPLETED BUDGET_INTAKE session."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Ola", gross_monthly_income_cents: 400000, housing_payment_cents: 0 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 60000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/sessions/${sess}/certify"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_SESSION_NOT_CERTIFIABLE"
            - "CounselingSession.${sess}.status == COMPLETED"

      - name: certify_hud_session_happy_path
        claim_type: Valid Transition
        grounds: [state_machines.CounselingSession.COMPLETED_to_CERTIFIED, entities.CounselingSession.fields.certificate_number]
        distinguishing_aspect: "A COMPLETED HUD_HOUSING session conducted by a hud_certified counselor certifies to CERTIFIED and mints a non-null certificate_number."
        test_recipe:
          setup: ["A COMPLETED HUD_HOUSING session with a hud_certified counselor."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "HudCy", hud_certified: true }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Pia", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "HUD_HOUSING" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/sessions/${sess}/certify"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "CounselingSession.${sess}.status == CERTIFIED"
            - "CounselingSession.${sess}.certificate_number is non-null"

      - name: terminal_graduated_client_cannot_withdraw
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Client.ACTIVE_to_GRADUATED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing a GRADUATED (terminal) client returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A GRADUATED client (single account paid off in one cycle)."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Rae", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 30000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/clients/${cl}/deposits"
              payload: { amount_cents: 33500 }
              as: Counselor
              as_user_id: "${cn}"
            - call: "POST /agencies/agencies/${ag}/run_disbursement"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agencies/clients/${cl}/withdraw"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "Client.${cl}.status == GRADUATED"

      - name: withdraw_cascades_drop_accounts
        claim_type: Side Effect Execution
        grounds: [state_machines.Client.ACTIVE_to_WITHDRAWN, state_machines.DebtAccount.ENROLLED_to_DROPPED]
        distinguishing_aspect: "Withdrawing an ACTIVE client cascades all non-terminal DebtAccounts to DROPPED."
        test_recipe:
          setup: ["ACTIVE client with one ENROLLED account."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI", monthly_fee_cents: 3500 }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
            - call: "POST /agencies/clients"
              payload: { agency_id: "${ag}", counselor_id: "${cn}", full_name: "Sky", gross_monthly_income_cents: 500000, housing_payment_cents: 150000 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { cl: $.data.id }
            - call: "POST /agencies/clients/${cl}/sessions"
              payload: { counselor_id: "${cn}", session_type: "BUDGET_INTAKE" }
              as: Counselor
              as_user_id: "${cn}"
              captures: { sess: $.data.id }
            - call: "POST /agencies/clients/${cl}/debt-accounts"
              payload: { creditor_id: "${cr}", account_ref: "A", original_balance_cents: 300000, original_apr: 0.2499, min_payment_cents: 9000, proposed_monthly_payment_cents: 30000, requested_concession_apr: 0.0699 }
              as: Counselor
              as_user_id: "${cn}"
              captures: { daA: $.data.id, pA: $.data.proposal_id }
            - call: "POST /agencies/proposals/${pA}/accept"
              payload: {}
              as: CreditorRep
              as_user_id: "${cr}"
            - call: "POST /agencies/sessions/${sess}/complete"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
            - call: "GET /agencies/clients/${cl}"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
              captures: { clv: $.data.version }
            - call: "POST /agencies/clients/${cl}/activate"
              payload: { expected_client_version: "${clv}" }
              as: Counselor
              as_user_id: "${cn}"
          trigger:
            - call: "POST /agencies/clients/${cl}/withdraw"
              payload: {}
              as: Counselor
              as_user_id: "${cn}"
          assert:
            - "Client.${cl}.status == WITHDRAWN"
            - "DebtAccount.${daA}.status == DROPPED"

      - name: reject_proposal_drops_account
        claim_type: Side Effect Execution
        grounds: [state_machines.CreditorProposal.SUBMITTED_to_REJECTED, state_machines.DebtAccount.PROPOSED_to_DROPPED]
        distinguishing_aspect: "Creditor rejecting a SUBMITTED proposal cross-entity transitions its DebtAccount PROPOSED->DROPPED."
        test_recipe:
          setup: ["A SUBMITTED proposal on a fresh debt account."]
          setup_api_calls:
            - call: "POST /agencies/agencies"
              payload: { name: "MMI" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/counselors"
              payload: { agency_id: "${ag}", full_name: "Cy" }
              as: AgencyAdmin
              captures: { cn: $.data.id }
            - call: "POST /agencies/creditors"
              payload: { agency_id: "${ag}", name: "Cap", default_concession_apr: 0.0699 }
              as: AgencyAdmin
              captures: { cr: $.data.id }
