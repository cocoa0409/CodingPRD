          - state_machines.Asset
        distinguishing_aspect: |
          Depth-3 chain triggered by WO complete: (1) work-orders/{id}/complete
          mutates the Deficiency (TRIAGED -> CONVERTED) and (2) the Deficiency's
          terminal transition in turn re-stamps the Asset's compliance posture
          via next_due_date recomputation and (3) the Asset's operational_status
          flips OUT_OF_SERVICE -> IN_SERVICE (or DECOMMISSIONED when
          replace_asset) which itself removes the asset from the forecast input
          set — each link caused by the previous mutation, not the original call.
