  # =========================================================================
  # RULE 6 — boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: volume_tier_at_exactly_1000_sqft_undercuts_999_sqft
        grounds:
          - calculations.booth_space_fee
          - constants.VOLUME_TIER_PCT
        distinguishing_aspect: |
          Boundary metric: volume_tier_pct / space_fee_cents / min_deposit_cents at the inclusive
          VOLUME_TIER edge of 1000 net sqft, exercised on POST /space-contracts. 1000 sqft earns the
          5% tier and 999 sqft earns nothing, so the larger contract is the cheaper one; the 999 line
          also pins round_half_up on a .3 fraction.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "VenueContract MCC / HALL_A EXECUTED; Show 'National Buyers Expo' base_rate_cents_per_sqft 3275, aisle_ratio_pct 40."
            - "Two CORNER / MAIN_AISLE booths (location multiplier 1.1, zone multiplier 1.08): Q1000 is 20x50 == 1000 sqft, R999 is 27x37 == 999 sqft."
            - "Two exhibitors, because validation 45 forbids two active contracts for one exhibitor on one show."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "Q1000", width_ft: 20, depth_ft: 50, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_1000: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "R999", width_ft: 27, depth_ft: 37, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_999: $.data.id }
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "POST /exhibitors"
              payload: { legal_name: "Harbor Ceramics", contact_email: "sales@harbor.example", consecutive_years: 2 }
              as: SalesRep
              captures: { ex2: $.data.id }
          trigger:
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 1000, premium_placement_requested: true, booth_ids: ["${b_1000}"] }
              as: SalesRep
              captures: { sc_1000: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v2: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex2}", expected_show_version: "${show_v2}", requested_sqft: 999, premium_placement_requested: true, booth_ids: ["${b_999}"] }
              as: SalesRep
              captures: { sc_999: $.data.id }
          assert:
            - "Booth.${b_1000}.area_sqft == 1000 and Booth.${b_999}.area_sqft == 999"
            - "SpaceContract.${sc_1000}.volume_tier_pct == 5 (1000 >= 1000, the tier edge is inclusive)"
            - "SpaceContract.${sc_1000}.space_fee_cents == 3696165"
            - "SpaceContract.${sc_1000}.min_deposit_cents == 924041 (924041.25 rounds down under round_half_up)"
            - "SpaceContract.${sc_999}.volume_tier_pct == 0"
            - "SpaceContract.${sc_999}.space_fee_cents == 3886809 (gross 3886809.3 rounded once)"
            - "SpaceContract.${sc_999}.min_deposit_cents == 971702"
            - "The 999 sqft contract is the more expensive of the two: 3886809 > 3696165"

