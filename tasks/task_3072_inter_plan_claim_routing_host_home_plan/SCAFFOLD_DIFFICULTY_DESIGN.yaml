            - "after license activation, second activate succeeds and NationalAccount.${na_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: rate_schedule_half_open_adjacency_permitted
        grounds:
          - validations[priority=7]
          - errors.ERR_RATE_WINDOW_OVERLAP
        distinguishing_aspect: |
          Half-open interval semantics on the RateSchedule resource: a new
          window starting exactly at an existing window's exclusive end
          (adjacent, gap = 0) is PERMITTED, while a window starting one day
          earlier (overlap by one day) is rejected with
          ERR_RATE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Host plan T registered (license irrelevant for schedule publishing). Existing rate window R1: NPI 1234567890 proc 99213 [2026-01-01, 2026-09-01) at 20000."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 20000, effective_start: "2026-01-01", effective_end: "2026-09-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-09-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 25000, effective_start: "2026-08-31", effective_end: "2026-12-31" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent window [2026-09-01, 2027-01-01) is created with 201 (half-open end permits touching)"
            - "the window [2026-08-31, 2026-12-31) overlapping by one day returns ERR_RATE_WINDOW_OVERLAP with HTTP 422"

      - name: access_fee_schedule_closed_adjacency_overlaps
        grounds:
          - validations[priority=8]
          - errors.ERR_FEE_WINDOW_OVERLAP
        distinguishing_aspect: |
          Closed-interval semantics on the AccessFeeSchedule resource (different
          resource and different interval semantics from the half-open rate
          windows): a new window starting exactly on the existing window's
          INCLUSIVE end date counts as overlap and is rejected; only a window
          starting the day AFTER the inclusive end is accepted.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T registered. Existing fee schedule F1 H->T window [2026-01-01, 2026-06-30] (closed)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-01-01", effective_end: "2026-06-30" }
              as: AssociationAdmin
          trigger:
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 160, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-06-30", effective_end: "2026-12-31" }
              as: AssociationAdmin
              captures: { err: $.data.error_id }
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 160, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-07-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
          assert:
            - "the window [2026-06-30, 2026-12-31] touching the inclusive end returns ERR_FEE_WINDOW_OVERLAP with HTTP 422 (closed interval: shared endpoint IS overlap)"
            - "the window [2026-07-01, 2026-12-31] is created with 201"

