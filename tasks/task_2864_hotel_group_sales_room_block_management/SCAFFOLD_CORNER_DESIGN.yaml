  - name: counter_then_downward_revise_returns_to_proposed_and_keeps_the_hold
    claim_type: valid_transition
    grounds:
    - state_machines.RateQuote.PROPOSED_to_COUNTERED
    - state_machines.RateQuote.COUNTERED_to_PROPOSED
    - calculations.effective_net_rate
    - entities.RateQuote.fields.negotiation_round
    distinguishing_aspect: |
      The downward-revise leg (new quoted_peak_rooms <= old) is the one that returns COUNTERED -> PROPOSED without disturbing the lead or the hold, in contrast to the upward-revise leg that drops back to DRAFT. The revise must re-run effective_net_rate on the new base 22000 — 22000 - 1595 - 750 - 537 = 19118 and 19118 * 12 = 229416 — and must bump negotiation_round to 2 while held_group_rooms stays exactly 4 because the peak count did not change.
