  # =====================================================================
  # Section: cross_cutting (complexity layers)
  # =====================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_section_version_rejected_fresh_accepted
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enroll-stale-section]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Section.version: a second enrollment carrying the pre-first-enrollment version (1) is rejected 412 ERR_STALE_VERSION; re-reading (version 2) and retrying succeeds; version increments on every successful write."
        test_recipe:
          setup: ["OPEN year; G3/BEGINNER section capacity 5 created (version 1); family with two students"]
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P" }, as: SchoolAdmin, captures: { sp: $.data.id } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam OC", primary_email: "oc@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "O1", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st1: $.data.id } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "O2", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { st2: $.data.id } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${st1}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { enr1: $.data.id } }
          trigger:
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${st2}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /school/sections/${sec}", payload: {}, as: SchoolAdmin, captures: { sv_fresh: $.data.version } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${st2}", expected_section_version: "${sv_fresh}" }, as: SchoolAdmin, captures: { enr2: $.data.id } }
          assert:
            - "sv == 1 at section creation; err == ERR_STALE_VERSION (HTTP 412) when reusing it after the first enrollment bumped it"
            - "sv_fresh == 2 (version incremented exactly once per successful enrollment)"
            - "Retry with sv_fresh succeeds: Enrollment.${enr2} created, enrolled_count == 2"

      - name: occ_stale_family_version_on_invoice_issue
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[invoice-issue-stale-family]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Family.version: issuing twice with the version captured at family creation (1) — the second issue is rejected 412 because the first issue legitimately superseded the balance view and bumped Family.version to 2."
        test_recipe:
          setup: ["OPEN year; family with one enrolled student; invoice #1 issued with expected_family_version 1"]
          setup_api_calls:
