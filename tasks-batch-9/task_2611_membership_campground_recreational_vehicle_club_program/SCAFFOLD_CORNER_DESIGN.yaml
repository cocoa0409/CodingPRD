        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles[Member]
          - roles[ClubAdmin]
        distinguishing_aspect: "Five ownership probes across three resource kinds (membership, reservation, dues invoice) from a Member who legitimately holds the role but not the row, contrasted with the identical reads succeeding for ClubAdmin — the owner rule is conditioned on the acting role being Member, so it must not fire for headquarters. The invoice probe also shows ownership at priority 3 outranking the priority-47 amount rule even though the amount supplied is wrong."
