            - { call: "POST /training-sessions", payload: { topic: "T1", level: "BASIC", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z", credit_hours: 5, capacity: 10 }, as: ShopCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /training-sessions", payload: { topic: "T2", level: "BASIC", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z", credit_hours: 5, capacity: 10 }, as: ShopCoordinator, captures: { s2: $.data.id } }
