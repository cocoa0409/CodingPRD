  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_certification_cascade_depth4
        grounds:
          - state_machines.LoanCertification.SUBMITTED_to_ACCEPTED
          - state_machines.MatchAllocation.UNFUNDED_to_SCHEDULED
          - entities.FundingBatch.fields.total_allocated_cents
          - entities.PlanYear.fields.total_qslp_match_funded_cents
          - state_machines.NondiscriminationTest.PASSED_to_STALE
          - calculations.qslp_mirror_allocation
        distinguishing_aspect: |
          Cascade of depth 4 originating from the LoanCertification SUBMITTED -> ACCEPTED transition:
          accept creates a MIRROR MatchAllocation (link 1), the allocation's attachment to the PENDING
          batch mutates FundingBatch.total_allocated_cents (link 2), the changed batch total mutates
          PlanYear.total_qslp_match_funded_cents (link 3), and the changed plan-year funded total
          invalidates the already-PASSED NondiscriminationTest into STALE (link 4).
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with an EFFECTIVE PlanAmendment."
            - "One NHCE Employee with one payroll period of 1000000 cents compensation and 20000 cents deferral (deferral match 20000)."
            - "One VERIFIED LoanAccount and one SUBMITTED LoanCertification with a single 30000-cent line."
            - "One PENDING FundingBatch on the payroll period whose total_allocated_cents is 0."
            - "One NondiscriminationTest already computed to status PASSED (nhce_acp 0.0200, limit_acp 0.0400, hce group empty)."
