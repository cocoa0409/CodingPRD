              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { rp_v3: $.data.version }
            - call: "POST /rate-plans/${rp}/offers"
              payload: { travel_date: "2026-09-23", net_rate_cents: 24050, allotment_total: 1, expected_rate_plan_version: "${rp_v3}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { off_p2: $.data.id }
          assert:
            - "Offer.${off_p1}.taxes_fees_cents == 240, marketplace_margin_cents == 3600, display_total_cents == 24241, supplier_payable_cents == 20401"
            - "Offer.${off_p2}.taxes_fees_cents == 241, marketplace_margin_cents == 3608, display_total_cents == 24291, supplier_payable_cents == 20442"
            - "24241 == 20401 + 3600 + 240 and 24291 == 20442 + 3608 + 241"
            - "Offer.${off_p1}.status == PENDING and is NOT SUPERSEDED, because the two offers carry different travel_date values"

      - name: parity_severity_bands_at_the_tolerance_threshold
        claim_type: threshold
        grounds:
          - calculations.parity_breach_bps
        excluded_because:
          difficulty_instance: boundary_precision_check / parity_breach_exactly_at_tolerance_opens_a_minor_case
          rationale: "The named §1.8 instance tests 99, 100 and 101 bps against PARITY_TOLERANCE_BPS with the >= lower-bound / < upper-bound convention."

      - name: refund_band_at_the_free_cancel_cutoff
        claim_type: threshold
        grounds:
          - calculations.refund_passthrough_due
        excluded_because:
          difficulty_instance: boundary_precision_check / refund_exactly_at_free_cancel_cutoff_returns_the_full_refund
          rationale: "The named §1.8 instance cancels exactly at the cutoff hour and one hour inside it."

      - name: opaque_discount_tier_straddling
        claim_type: tiered_pricing
        grounds:
          - calculations.package_pricing_and_allocation
        excluded_because:
          difficulty_instance: boundary_precision_check / package_discount_tier_exactly_at_the_300000_threshold
          rationale: "The named §1.8 instance sits a subtotal exactly on the 300000 tier threshold and asserts the 0.09 rate is chosen."

      - name: package_discount_remainder_distribution
        claim_type: waterfall_allocation
        grounds:
          - calculations.package_pricing_and_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / package_discount_floor_then_largest_remainder_allocation
          rationale: "The named §1.8 instance forces a non-zero remainder cent and asserts which component receives it."

      - name: composite_score_weight_accumulation
        claim_type: weighted_scoring
        grounds:
          - calculations.supplier_composite_score
        excluded_because:
          difficulty_instance: dual_variant_calc / supplier_composite_score_provisional_vs_final_diverge
          rationale: "The named §1.8 instance pins both weighted composites to the cent and shows the weights do not drift between variants."

      - name: dispute_fee_evaluation_order_is_pinned
        claim_type: constraint_propagation
        grounds:
          - calculations.dispute_settlement_total
        excluded_because:
          difficulty_instance: combinatorial_formula / dispute_fee_tier_keyed_on_availability_clamped_refund_due
          rationale: "The named §1.8 instance asserts the pinned step order and rejects the circular reading that keys the tier on settlement_total_cents."

      - name: liability_variant_divergence_on_the_same_settlement
        claim_type: variant_divergence
        grounds:
          - calculations.dispute_liability_split
        excluded_because:
          difficulty_instance: dual_variant_calc / dispute_liability_preliminary_vs_binding_diverge
          rationale: "The named §1.8 instance asserts both variants on one case, including the FRAUD cap that only the binding variant applies."

  - section: validations
    instances:
      - name: booking_with_a_stale_quoted_total_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - errors[ERR_PRICE_CHANGED]
          - entities.Offer.fields.display_total_cents
        distinguishing_aspect: "quoted_total_cents 24000 does not equal the server-computed display_total_cents 24240, so POST /bookings returns HTTP 409 ERR_PRICE_CHANGED, creates no Booking and leaves allotment_held at 0."
        test_recipe:
          setup:
            - "A LIVE offer for 2026-09-20 whose display_total_cents is 24240 and allotment_remaining is 3."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
          trigger:
            - call: "POST /bookings"
              payload: { offer_id: "${off}", traveler_reference: "PNR-V1", quoted_total_cents: 24000, payment_token: "tok_live_12" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { err_pc: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_pc} == ERR_PRICE_CHANGED"
            - "GET /bookings?offer_id=${off} reports total_count == 0"
            - "Offer.${off}.allotment_remaining is still 3 and allotment_held is still 0"

      - name: booking_with_the_exact_display_total_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - state_machines.Booking
        distinguishing_aspect: "The same call with quoted_total_cents 24240 - exactly display_total_cents - passes both the price check and the allotment check, returning a booking at AUTHORIZED + RESERVED and moving one unit from allotment_remaining to allotment_held."
        test_recipe:
          setup:
            - "A LIVE offer for 2026-09-20 whose display_total_cents is 24240 and allotment_remaining is 3."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
          trigger:
            - call: "POST /bookings"
              payload: { offer_id: "${off}", traveler_reference: "PNR-V2", quoted_total_cents: 24240, payment_token: "tok_live_13" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { bk_ok: $.data.id }
          assert:
            - "HTTP 201 with Booking.${bk_ok}.charged_total_cents == 24240 and payment_status == AUTHORIZED"
            - "Offer.${off}.allotment_remaining == 2, allotment_held == 1, allotment_sold == 0"
            - "Booking.${bk_ok}.package_id == null and offer_id == ${off}"

      - name: offer_travel_date_at_the_horizon_passes_and_one_day_beyond_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_TRAVEL_DATE_OUT_OF_RANGE]
          - entities.ModelAgreement.fields.effective_to
        distinguishing_aspect: "With the clock at 2026-08-05 and MAX_HORIZON_DAYS 500, travel_date 2027-12-18 is the last accepted day and 2027-12-19 returns HTTP 422 ERR_TRAVEL_DATE_OUT_OF_RANGE; the supplier's agreement is open-ended (effective_to null, coalesced to 9999-12-31) so ERR_AGREEMENT_NOT_ACTIVE cannot mask the boundary."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Supplier Hotel Horizon CERTIFIED with an ACTIVE open-ended AGENCY agreement from 2026-08-01 with effective_to omitted."
            - "One ACTIVE FLEX plan on that supplier."
          setup_api_calls:
            - *c_clock
            - *c_market
            - call: "POST /suppliers"
              payload: { legal_name: "Hotel Horizon SA", supplier_type: "HOTEL", home_market_id: "${mkt}", contact_email: "ops@horizon.example", conversion_index: 50 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup_hz: $.data.id }
            - call: "POST /suppliers/${sup_hz}/certifications"
              payload: { content_score_claimed: 80, connectivity_protocol: "JSON_V2", sample_payload_ref: "s3://cert/horizon.json" }
              as: SupplierUser
              as_user_id: "${sup_hz}"
              captures: { cert_hz: $.data.id }
            - call: "POST /certifications/${cert_hz}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /certifications/${cert_hz}/decide"
              payload: { decision: "CERTIFY", content_score: 80, connectivity_score: 80 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /suppliers/${sup_hz}/model-agreements"
              payload: { model: "AGENCY", effective_from: "2026-08-01", base_commission_pct: 0.15, chargeback_liability_pct_marketplace: 0.60, fraud_liability_cap_cents: 50000, settlement_terms_days: 30 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma_hz: $.data.id }
            - call: "POST /model-agreements/${ma_hz}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /suppliers/${sup_hz}/rate-plans"
              payload: { market_id: "${mkt}", name: "Horizon Flex", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: true }
              as: SupplierUser
              as_user_id: "${sup_hz}"
              captures: { rp_hz: $.data.id, rp_hz_v: $.data.version }
          trigger:
            - call: "POST /rate-plans/${rp_hz}/offers"
              payload: { travel_date: "2027-12-18", net_rate_cents: 24000, allotment_total: 1, expected_rate_plan_version: "${rp_hz_v}" }
              as: SupplierUser
              as_user_id: "${sup_hz}"
              captures: { off_hz_ok: $.data.id }
            - call: "GET /rate-plans/${rp_hz}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_hz}"
              captures: { rp_hz_v3: $.data.version }
            - call: "POST /rate-plans/${rp_hz}/offers"
              payload: { travel_date: "2027-12-19", net_rate_cents: 24000, allotment_total: 1, expected_rate_plan_version: "${rp_hz_v3}" }
              as: SupplierUser
              as_user_id: "${sup_hz}"
              captures: { err_hz: $.data.error_id }
          assert:
            - "the 2027-12-18 call is HTTP 201 with Offer.${off_hz_ok}.status == PENDING and display_total_cents == 24240"
            - "the 2027-12-19 call is HTTP 422 with ${err_hz} == ERR_TRAVEL_DATE_OUT_OF_RANGE"
            - "GET /offers?rate_plan_id=${rp_hz} reports total_count == 1"
            - "RatePlan.${rp_hz}.version == ${rp_hz_v3}: the rejected ingestion bumped nothing"

      - name: parity_case_is_not_opened_when_the_plan_is_not_monitored
        claim_type: conditional_validation
        grounds:
          - calculations.parity_breach_bps
          - entities.RatePlan.fields.parity_monitored
          - entities.DirectRateObservation.fields.parity_case_id
        distinguishing_aspect: "The case-attachment step is gated on rate_plan.parity_monitored: on a plan with parity_monitored false a 100 bps observation still stores breach_bps 100 and severity MINOR, but parity_case_id stays null and the plan never goes to PARITY_HOLD."
        test_recipe:
          setup:
            - "A CERTIFIED hotel supplier with an ACTIVE AGENCY agreement."
            - "A second ACTIVE plan on that supplier with parity_monitored false, tax_fee_pct 0.01."
            - "A LIVE offer on that plan for 2026-09-25 at net 24000, so display_total_cents is 24240."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - call: "POST /suppliers/${sup}/rate-plans"
              payload: { market_id: "${mkt}", name: "Unmonitored corporate", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: false }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { rp_nm: $.data.id, rp_nm_v: $.data.version }
            - call: "POST /rate-plans/${rp_nm}/offers"
              payload: { travel_date: "2026-09-25", net_rate_cents: 24000, allotment_total: 2, expected_rate_plan_version: "${rp_nm_v}" }
              as: SupplierUser
              as_user_id: "${sup}"
              captures: { off_nm: $.data.id }
            - call: "POST /offers/${off_nm}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup}"
          trigger:
            - call: "POST /rate-plans/${rp_nm}/parity-observations"
              payload: { travel_date: "2026-09-25", channel: "META", observed_at: "2026-08-06T10:00:00Z", direct_total_cents: 24000 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_nm: $.data.id }
          assert:
            - "DirectRateObservation.${obs_nm}.breach_bps == 100, severity == MINOR, compared_offer_id == ${off_nm}"
            - "DirectRateObservation.${obs_nm}.parity_case_id == null"
            - "GET /parity-cases?rate_plan_id=${rp_nm} reports total_count == 0"
            - "RatePlan.${rp_nm}.status is still ACTIVE and parity_hold_case_id == null"

      - name: path_id_existence_is_checked_before_body_validation_returns_not_found
        claim_type: cascading_validation
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_SUPPLIER_NOT_FOUND]
        distinguishing_aspect: "A request that violates both priority 4 (unknown supplier in the path) and priority 6 (undeclared cancellation_policy_code) returns the priority 4 error ERR_SUPPLIER_NOT_FOUND with HTTP 404, proving the existence check runs before body validation."
        test_recipe:
          setup:
            - "Market EU-PAR exists; no supplier has ever been created."
          setup_api_calls:
            - *c_clock
            - *c_market
          trigger:
            - call: "POST /suppliers/33333333-3333-3333-3333-333333333333/rate-plans"
              payload: { market_id: "${mkt}", name: "Doubly invalid", currency: "EUR", cancellation_policy_code: "SUPER_FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: true }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { err_casc: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_casc} == ERR_SUPPLIER_NOT_FOUND"
            - "${err_casc} != ERR_INVALID_REQUEST, so the priority 4 check short-circuited the priority 6 check"

      - name: placement_slots_aggregate_across_overlapping_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority=15]
          - calculations.placement_slot_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / placement_half_open_windows_allow_adjacency_but_reject_day_overlap
          rationale: "The named §1.8 instance shows two individually valid agreements whose per-day aggregate exceeds Market.paid_slot_capacity."

      - name: state_priority_beats_fiscal_priority_on_booking
        claim_type: priority_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=31]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_booking_a_suppressed_offer_with_a_stale_quote
          rationale: "The named §1.8 instance violates both rows in one call and asserts the lower-numbered priority wins."

      - name: safety_priority_beats_referential_priority_on_ranking_publish
        claim_type: priority_conflict
        grounds:
          - validations[priority=11]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_referential_on_ranking_publish_missing_disclosure_with_cancelled_placement
          rationale: "The named §1.8 instance pairs a different error-category pair (business_safety versus business_referential) on a different entity."

      - name: package_price_depends_on_component_offer_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=26]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / package_price_blocked_when_a_component_offer_is_suppressed
          rationale: "The named §1.8 instance drives the component offer out of LIVE and asserts the pricing call is refused for that reason alone."

  - section: endpoints
    instances:
      - name: ranking_entry_read_exposes_the_paid_placement_boost_and_disclosure
        claim_type: computed_read
        grounds:
          - calculations.ranking_score
          - entities.RankingEntry.fields.boost_points_applied
          - entities.RankingEntry.fields.disclosure_label
          - entities.PlacementAgreement.fields.boost_points
        distinguishing_aspect: "With one LIVE offer (content 88, conversion 50, no parity cases) the organic_score is 89.50; an ACTIVE placement agreement of 6 boost_points covering 2026-09-20 lifts final_score to 95.50, sets is_paid_placement true, disclosure_label SPONSORED and paid_entry_count 1."
        test_recipe:
          setup:
            - "Market EU-PAR with paid_slot_capacity 3 and ranking_disclosure_required true."
            - "Hotel Lutetia CERTIFIED with a LIVE 2026-09-20 offer at display 24240."
            - "An ACTIVE placement agreement for that supplier: slots 2, boost_points 6, label SPONSORED, window [2026-09-01, 2026-09-21)."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - &c_plc
              call: "POST /placement-agreements"
              payload: { supplier_id: "${sup}", market_id: "${mkt}", slots: 2, boost_points: 6, fee_cents: 400000, disclosure_label: "SPONSORED", window_start: "2026-09-01", window_end: "2026-09-21" }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { plc: $.data.id }
            - &c_plc_appr
              call: "POST /placement-agreements/${plc}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - &c_run
              call: "POST /ranking-runs"
              payload: { market_id: "${mkt}", travel_date: "2026-09-20", sort_profile: "BEST_VALUE", disclosure_version: "disclosure-v1" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { run: $.data.id }
          trigger:
            - call: "GET /ranking-entries"
              payload: { ranking_run_id: "${run}", limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "exactly one entry is returned, with offer_id ${off} and placement_agreement_id ${plc}"
            - "that entry has price_competitiveness == 100.00, organic_score == 89.50, boost_points_applied == 6, final_score == 95.50, rank_position == 1"
            - "that entry has is_paid_placement == true and disclosure_label == SPONSORED"
            - "RankingRun.${run}.entry_count == 1, paid_entry_count == 1 and status == DRAFT"

      - name: ranking_run_publish_stamps_publication_metadata
        claim_type: action_endpoint
        grounds:
          - state_machines.RankingRun.DRAFT_to_PUBLISHED
          - entities.RankingRun.fields.published_at
          - validations[priority=11]
        distinguishing_aspect: "publish on a DRAFT run that carries disclosure_version 'disclosure-v1' in a market requiring disclosure moves it to PUBLISHED and stamps published_at 2026-08-05T00:00:00Z and published_by_user_id co-2, leaving the entries untouched."
        test_recipe:
          setup:
            - "The paid-placement DRAFT run above, with one entry at final_score 95.50."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - *c_plc
            - *c_plc_appr
            - *c_run
          trigger:
            - call: "POST /ranking-runs/${run}/publish"
              payload: { note: "criteria disclosure v1 attached" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "HTTP 200 with RankingRun.${run}.status == PUBLISHED"
            - "RankingRun.${run}.published_at == 2026-08-05T00:00:00Z and published_by_user_id == co-2"
            - "RankingRun.${run}.entry_count == 1 and paid_entry_count == 1 are unchanged by publication"

      - name: chargeback_simulation_moves_only_the_payment_dimension
        claim_type: conditional_action
        grounds:
          - state_machines.Booking.CAPTURED_to_CHARGEBACK
          - errors[ERR_PAYMENT_NOT_CAPTURED]
          - endpoints[POST /_payments/simulate-chargeback]
        distinguishing_aspect: "simulate-chargeback is allowed only from payment_status CAPTURED: it moves a CAPTURED booking to CHARGEBACK while fulfillment_status stays RESERVED, and the same call against an AUTHORIZED booking returns HTTP 409 ERR_PAYMENT_NOT_CAPTURED."
        test_recipe:
          setup:
            - "Two bookings on the LIVE 24240 offer: the first captured, the second left at AUTHORIZED."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - *c_bk
            - *c_bk_cap
            - call: "POST /bookings"
              payload: { offer_id: "${off}", traveler_reference: "PNR-E9", quoted_total_cents: 24240, payment_token: "tok_live_14" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { bk_auth: $.data.id }
          trigger:
            - call: "POST /_payments/simulate-chargeback"
              payload: { booking_id: "${bk}", reason_code: "FRAUDULENT_TRANSACTION" }
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /_payments/simulate-chargeback"
              payload: { booking_id: "${bk_auth}", reason_code: "FRAUDULENT_TRANSACTION" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { err_cb: $.data.error_id }
          assert:
            - "the first call returns HTTP 200 with Booking.${bk}.payment_status == CHARGEBACK and fulfillment_status still RESERVED"
            - "Booking.${bk}.charged_total_cents is still 24240 and refunded_cents is still 0"
            - "the second call returns HTTP 409 with ${err_cb} == ERR_PAYMENT_NOT_CAPTURED"
            - "Booking.${bk_auth}.payment_status is still AUTHORIZED"

      - name: booking_with_both_offer_and_package_targets_is_rejected
        claim_type: cross_reference_link
        grounds:
          - validations[priority=23]
          - errors[ERR_BOOKING_TARGET_INVALID]
          - endpoints[POST /bookings]
        distinguishing_aspect: "POST /bookings must name exactly one target: supplying offer_id and package_id together returns HTTP 422 ERR_BOOKING_TARGET_INVALID, and so does supplying neither."
        test_recipe:
          setup:
            - "A LIVE 2026-09-20 offer at display 24240 and a PUBLISHED opaque package on the same date at package_total_cents 157306."
          setup_api_calls:
            - *c_clock
            - *c_market
            - *c_sup
            - *c_cert_sub
            - *c_cert_rev
            - *c_cert_dec
            - *c_ma
            - *c_ma_act
            - *c_rp
            - *c_off
            - *c_off_pub
            - *c_sup_a
            - *c_cert_a_sub
            - *c_cert_a_rev
            - *c_cert_a_dec
            - *c_ma_a
            - *c_ma_a_act
            - *c_rp_a
            - *c_off_a
            - *c_off_a_pub
            - *c_pkg
            - *c_cmp_h
            - *c_cmp_a
            - *c_pkg_read
            - *c_pkg_price
            - call: "POST /packages/${pkg}/publish"
              payload: { reveal_supplier_names: false, note: "opaque bundle live" }
              as: CommercialManager
              as_user_id: "cm-2"
          trigger:
            - call: "POST /bookings"
              payload: { offer_id: "${off}", package_id: "${pkg}", traveler_reference: "PNR-E1", quoted_total_cents: 157306, payment_token: "tok_live_15" }
              as: BookingAgent
              as_user_id: "ba-1"
