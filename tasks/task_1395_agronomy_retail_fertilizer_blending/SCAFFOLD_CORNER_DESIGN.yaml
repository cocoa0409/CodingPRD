# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Agronomy Retail & Fertilizer Blending
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: grower_create_applies_defaults
        claim_type: creation
        grounds: [entities.GrowerAccount]
        distinguishing_aspect: "POST /agronomy/growers returns 201 with system defaults: credit_status ACTIVE, credit_used_cents 0, prepay_balance_cents 0, season_closed_tons 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Default Check Farms", credit_limit_cents: 750000 }
              as: CreditManager
              captures: { g_cs: $.data.credit_status, g_cu: $.data.credit_used_cents, g_pp: $.data.prepay_balance_cents, g_tons: $.data.season_closed_tons, g_v: $.data.version }
          assert:
            - "g_cs == ACTIVE and g_cu == 0 and g_pp == 0 and g_tons == 0 and g_v == 1"

      - name: field_create_default_watershed_zone
        claim_type: defaults
        grounds: [entities.Field.fields.watershed_zone]
        distinguishing_aspect: "Omitting watershed_zone applies the STANDARD default."
        test_recipe:
          setup: ["grower exists"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Defaults Farm", credit_limit_cents: 1000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "No Zone Field", acres: 40 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_zone: $.data.watershed_zone }
          assert:
            - "f_zone == STANDARD"

      - name: product_regulated_flag_defaults_false
        claim_type: defaults
        grounds: [entities.Product.fields.regulated_flag]
        distinguishing_aspect: "Omitting regulated_flag on product creation yields false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agronomy/products"
              payload: { name: "MOP 0-0-60", analysis_n_pct: 0, analysis_p2o5_pct: 0, analysis_k2o_pct: 60, form: "DRY" }
              as: BranchAdmin
              captures: { p_reg: $.data.regulated_flag }
          assert:
            - "p_reg == false"

      - name: grower_missing_required_legal_name_returns_400
        claim_type: required_fields
        grounds:
          - entities.GrowerAccount.fields.legal_name
          - errors[ERR_VALIDATION_FAILED]
        distinguishing_aspect: "POST /agronomy/growers without legal_name is rejected with ERR_VALIDATION_FAILED (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /agronomy/growers"
              payload: { credit_limit_cents: 100000 }
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION_FAILED"

      - name: recommendation_invalid_crop_enum_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Recommendation.fields.crop
          - errors[ERR_VALIDATION_FAILED]
        distinguishing_aspect: "crop value outside {CORN, SOYBEAN, WHEAT} rejected with ERR_VALIDATION_FAILED."
        test_recipe:
          setup: ["grower, field, RESULTED soil test"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Enum Farm", credit_limit_cents: 1000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "Enum Field", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
          trigger:
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "DURUM", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION_FAILED"

      - name: product_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - "endpoints: GET /agronomy/products/{productId}"
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown product id returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /agronomy/products/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: BranchAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RESOURCE_NOT_FOUND"

      - name: inventory_position_computed_after_receipt
        claim_type: computed_fields
        grounds:
          - calculations.inventory_position
          - "endpoints: GET /agronomy/products/{productId}/inventory-position"
        distinguishing_aspect: "After receiving one 20 t lot, the computed position read shows on_hand 20.000, reserved 0, available 20.000, shipped 0."
        test_recipe:
          setup: ["product exists; FERTILIZER_STORAGE permit ACTIVE"]
          setup_api_calls:
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "FERTILIZER_STORAGE", site_code: "SITE-1", setback_ft: 200, max_storage_tons: 1000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /agronomy/environmental-permits/${sp_id}/begin-inspection"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits/${sp_id}/activate"
              payload: { expires_at: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_urea}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 40000 }
              as: PlantOperator
            - call: "GET /agronomy/products/${p_urea}/inventory-position"
              as: PlantOperator
              captures: { pos_oh: $.data.on_hand_tons, pos_res: $.data.reserved_tons, pos_av: $.data.available_tons, pos_sh: $.data.shipped_tons }
          assert:
            - "pos_oh == 20.000 and pos_res == 0 and pos_av == 20.000 and pos_sh == 0"

      - name: credit_ledger_entry_immutable_no_version
        claim_type: immutability
        grounds: [entities.CreditLedgerEntry]
        distinguishing_aspect: "CreditLedgerEntry carries common_fields: false — ledger entries expose id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["grower with one payment rejected is not needed; grower with one prepay funding to force a ledger entry"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Ledger View Farms", credit_limit_cents: 1000000 }
              as: CreditManager
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /agronomy/products"
              payload: { name: "MOP 0-0-60", analysis_n_pct: 0, analysis_p2o5_pct: 0, analysis_k2o_pct: 60, form: "DRY" }
              as: BranchAdmin
              captures: { p_mop: $.data.id }
            - call: "POST /agronomy/products/${p_mop}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 44500, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_mop: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_mop}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/prepay-programs"
              payload: { name: "FALL-2026 PREPAY", season: "FALL", enrollment_open_on: "2026-07-01T00:00:00Z", enrollment_close_on: "2026-10-31T00:00:00Z", funding_deadline: "2026-11-15T23:59:59Z", deposit_pct: 0.30, discount_pct: 0.05, default_penalty_pct: 0.10 }
              as: BranchAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/prepay-contracts"
              payload: { prepay_program_id: "${pg_id}", product_id: "${p_mop}", committed_tons: 20, expected_grower_version: "${g_v}" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /agronomy/prepay-contracts/${pc_id}/fund"
              payload: { amount_cents: 100000 }
              as: CreditManager
          trigger:
            - call: "GET /agronomy/growers/${g_id}/credit-ledger"
              as: CreditManager
              captures: { le_type: "$.data[0].entry_type", le_amt: "$.data[0].amount_cents", le_cu: "$.data[0].resulting_credit_used_cents", le_pp: "$.data[0].resulting_prepay_balance_cents" }
          assert:
            - "le_type == PREPAY_FUNDED and le_amt == 100000 and le_cu == 0 and le_pp == 100000"
            - "ledger entry objects expose id and created_at but no version field (common_fields: false)"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: soil_test_results_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.SoilTest
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "post-results while REQUESTED (skipping SAMPLED) is rejected; REQUESTED -> RESULTED is not a declared edge."
        test_recipe:
          setup: ["grower, field, soil test in REQUESTED"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Skip State Farms", credit_limit_cents: 1000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "S1", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id, st_st: $.data.status }
          trigger:
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "st_st == REQUESTED (initial state)"
            - "err == ERR_INVALID_TRANSITION and the soil test remains REQUESTED"

      - name: recommendation_approve_from_draft_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Recommendation
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "approve requires PENDING_REVIEW; approving a DRAFT fails."
        test_recipe:
          setup: ["RESULTED soil test with a DRAFT recommendation"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Precond Farms", credit_limit_cents: 1000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "S2", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_TRANSITION and recommendation remains DRAFT"

      - name: order_book_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.BlendOrder
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "A second book on an already-BOOKED order fails; the first book's reservation is not doubled (idempotent-effect check via position read)."
        test_recipe:
          setup: ["full pipeline; urea-only order BOOKED (reserved 8.703 on the 20 t lot)"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Twice Book Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "TB Field", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/fields/${f_id}/nutrient-plans"
              payload: { crop_year: 2026, n_cap_lbs_per_acre: 300, valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }
              as: Agronomist
              captures: { nmp_id: $.data.id }
            - call: "POST /agronomy/nutrient-plans/${nmp_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/nutrient-plans/${nmp_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products/${p_urea}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 52000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_urea: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_urea}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "FERTILIZER_STORAGE", site_code: "SITE-1", setback_ft: 200, max_storage_tons: 1000 }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /agronomy/environmental-permits/${sp_id}/begin-inspection"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits/${sp_id}/activate"
              payload: { expires_at: "2027-12-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /agronomy/inventory-lots"
              payload: { product_id: "${p_urea}", warehouse_code: "WH-A", received_tons: 20, lot_cost_cents_per_ton: 40000 }
              as: PlantOperator
            - call: "POST /agronomy/growers/${g_id}/blend-orders"
              payload:
                field_id: "${f_id}"
                recommendation_id: "${rec_id}"
                acres: 50
                price_mode: "FLOATING"
                lines:
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 348.1 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_id: $.data.id }
            - call: "POST /agronomy/blend-orders/${o_id}/book"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /agronomy/blend-orders/${o_id}/book"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
            - call: "GET /agronomy/products/${p_urea}/inventory-position"
              as: PlantOperator
              captures: { pos_res: $.data.reserved_tons }
          assert:
            - "err == ERR_INVALID_TRANSITION"
            - "pos_res == 8.703 (reservation NOT doubled by the rejected second book)"

      - name: cancelled_order_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.BlendOrder
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "A CANCELLED order rejects every further transition (book shown here); terminal states admit no outgoing edges."
        test_recipe:
          setup: ["full pipeline; urea-only order QUOTED then CANCELLED"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Lockdown Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "LD Field", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { f_id: $.data.id }
            - call: "POST /agronomy/fields/${f_id}/soil-tests"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { st_id: $.data.id }
            - call: "POST /agronomy/soil-tests/${st_id}/record-sampling"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/post-results"
              payload: { p_ppm: 12, k_ppm: 90, ph: 6.1 }
              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id }
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/products"
              payload: { name: "UREA 46-0-0", analysis_n_pct: 46, analysis_p2o5_pct: 0, analysis_k2o_pct: 0, form: "DRY" }
              as: BranchAdmin
              captures: { p_urea: $.data.id }
            - call: "POST /agronomy/products/${p_urea}/price-sheets"
              payload: { season: "FALL", price_per_ton_cents: 52000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: BranchAdmin
              captures: { ps_urea: $.data.id }
            - call: "POST /agronomy/price-sheets/${ps_urea}/publish"
              payload: {}
              as: BranchAdmin
            - call: "POST /agronomy/growers/${g_id}/blend-orders"
              payload:
                field_id: "${f_id}"
                recommendation_id: "${rec_id}"
                acres: 50
                price_mode: "FLOATING"
                lines:
                  - { product_id: "${p_urea}", target_rate_lbs_per_acre: 348.1 }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_id: $.data.id }
            - call: "POST /agronomy/blend-orders/${o_id}/cancel"
              payload: { reason: "changed plans" }
              as: Grower
              as_user_id: "${g_id}"
              captures: { o_f: $.data.fulfillment_status }
          trigger:
            - call: "POST /agronomy/blend-orders/${o_id}/book"
              payload: {}
              as: Grower
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "o_f == CANCELLED"
            - "err == ERR_INVALID_TRANSITION (terminal lockdown)"

      - name: batch_void_reverts_order_fulfillment
        claim_type: side_effect_execution
        grounds: [state_machines.BlendBatch]
        excluded_because:
          difficulty_instance: blend_order_parallel_payment_fulfillment_dims
          rationale: "Void side effect (order SCHEDULED -> BOOKED, payment dim untouched) is asserted there as s4_f/s4_p."

      - name: route_dispatch_requires_at_least_one_stop
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DeliveryRoute
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "Dispatching a stop-less route is rejected."
        test_recipe:
          setup: ["truck and a PLANNED route with no stops"]
          setup_api_calls:
            - call: "POST /agronomy/trucks"
              payload: { name: "TRUCK-E", capacity_tons: 25 }
              as: LogisticsDispatcher
              captures: { t_id: $.data.id }
            - call: "POST /agronomy/delivery-routes"
              payload: { truck_id: "${t_id}", route_date: "2026-08-20" }
              as: LogisticsDispatcher
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /agronomy/delivery-routes/${r_id}/dispatch"
              payload: {}
              as: LogisticsDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_TRANSITION and route remains PLANNED"

      - name: stop_complete_before_dispatch_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DeliveryStop
          - errors[ERR_INVALID_TRANSITION]
        distinguishing_aspect: "Completing a stop while its route is still PLANNED is rejected (stop machine guarded by route state)."
        test_recipe:
          setup: ["full pipeline; order BATCHED; route PLANNED with one stop for that order (not dispatched)"]
          setup_api_calls:
            - call: "POST /agronomy/growers"
              payload: { legal_name: "Stop Guard Farms", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { g_id: $.data.id }
            - call: "POST /agronomy/growers/${g_id}/fields"
              payload: { name: "SG Field", acres: 50 }
              as: Grower
              as_user_id: "${g_id}"
