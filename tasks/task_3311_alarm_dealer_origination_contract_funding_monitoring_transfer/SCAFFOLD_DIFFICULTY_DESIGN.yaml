  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: technician_half_open_service_window_collision
        grounds:
          - state_machines.ServiceVisit.transitions.REQUESTED_to_SCHEDULED
          - validations[priority=5]
          - errors[ERR_SERVICE_WINDOW_OVERLAP]
          - entities.ServiceVisit.fields.technician_id
        distinguishing_aspect: |
          Half-open interval semantics on the technician resource: two visits whose windows
          [scheduled_at, scheduled_at + duration_minutes) intersect are rejected, while a
          visit that starts exactly when another ends is accepted — adjacency is allowed and
          only true interior overlap is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Contract K13 ACTIVE for C19 with a first visit V-A scheduled on TECH-X for 2026-09-10T00:00:00Z for 120 minutes."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Zeke Overlap", email: "zeke.overlap@example.com", phone: "+15550001019" }
              as: ChannelManager
              captures: { c19_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c19_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "160 Palm St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75013", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-1" }
              as: ChannelManager
              captures: { k13_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k13_id}" }
              as: MonitoringOperator
              captures: { ma13_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma13_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "GET /alarm-funding/installations"
              payload: { contract_id: "${k13_id}" }
              as: ServiceCoordinator
              captures: { i13_id: "$.data[0].id" }
            - call: "POST /alarm-funding/installations/${i13_id}/complete"
              payload: {}
              as: ServiceCoordinator
            - call: "GET /alarm-funding/contracts/${k13_id}"
              payload: {}
              as: FundingAnalyst
              captures: { k13_v: $.data.version }
            - call: "POST /alarm-funding/contracts/${k13_id}/fund"
              payload: { expected_contract_version: "${k13_v}" }
              as: FundingAnalyst
            - call: "POST /alarm-funding/service-visits"
              payload: { contract_id: "${k13_id}", scheduled_at: "2026-09-10T00:00:00Z", work_type: "REPAIR", technician_id: "TECH-X", duration_minutes: 120 }
              as: ServiceCoordinator
              captures: { va_id: $.data.id }
            - call: "POST /alarm-funding/service-visits/${va_id}/schedule"
              payload: { scheduled_at: "2026-09-10T00:00:00Z" }
              as: ServiceCoordinator
            - call: "POST /alarm-funding/service-visits"
              payload: { contract_id: "${k13_id}", scheduled_at: "2026-09-10T01:00:00Z", work_type: "REPAIR", technician_id: "TECH-X", duration_minutes: 60 }
              as: ServiceCoordinator
              captures: { vb_id: $.data.id }
            - call: "POST /alarm-funding/service-visits"
              payload: { contract_id: "${k13_id}", scheduled_at: "2026-09-10T02:00:00Z", work_type: "REPAIR", technician_id: "TECH-X", duration_minutes: 60 }
              as: ServiceCoordinator
              captures: { vc_id: $.data.id }
          trigger:
            - call: "POST /alarm-funding/service-visits/${vb_id}/schedule"
              payload: { scheduled_at: "2026-09-10T01:00:00Z" }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /alarm-funding/service-visits/${vc_id}/schedule"
              payload: { scheduled_at: "2026-09-10T02:00:00Z" }
              as: ServiceCoordinator
              captures: { vc_status: $.data.visit_status }
          assert:
            - "the 01:00 visit ${vb_id} is rejected with ERR_SERVICE_WINDOW_OVERLAP (HTTP 422) because [01:00,02:00) meets [00:00,02:00)"
            - "the 02:00 visit ${vc_id} reads visit_status == SCHEDULED because its window [02:00,03:00) only abuts the first"
            - "ServiceVisit.${va_id}.visit_status == SCHEDULED and is unaffected by either attempt"

      - name: installer_crew_buffer_window_collision
        grounds:
          - state_machines.Installation
          - validations[priority=5]
          - errors[ERR_SERVICE_WINDOW_OVERLAP]
          - entities.Installation.fields.installation_engineer_id
        distinguishing_aspect: |
          Buffered interval semantics on the installer-crew resource, a different resource
          entity from the technician: each installation window [scheduled_at - 30m,
          scheduled_at + duration_minutes + 30m] collides with another crew slot, so an
          installation that merely abuts under the half-open rule would still be rejected here.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Two contracts K14 and K15 for C20 and C21; installation I-A on ENG-Z for 2026-09-12T00:00:00Z for 180 minutes."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Ada First", email: "ada.first@example.com", phone: "+15550001020" }
              as: ChannelManager
              captures: { c20_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Ben Second", email: "ben.second@example.com", phone: "+15550001021" }
              as: ChannelManager
              captures: { c21_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c20_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "170 Quince St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75014", installation_scheduled_at: "2026-09-12T00:00:00Z", installation_duration_minutes: 180, installation_engineer_id: "ENG-Z" }
              as: ChannelManager
              captures: { k14_id: $.data.id }
            - call: "POST /alarm-funding/contracts"
              payload: { customer_id: "${c21_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "180 Quince St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75015" }
              as: ChannelManager
              captures: { k15_id: $.data.id }
          trigger:
            - call: "POST /alarm-funding/installations"
              payload: { contract_id: "${k15_id}", scheduled_at: "2026-09-12T00:20:00Z", installation_engineer_id: "ENG-Z", duration_minutes: 180 }
              as: ServiceCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /alarm-funding/installations"
              payload: { contract_id: "${k15_id}", scheduled_at: "2026-09-12T04:30:00Z", installation_engineer_id: "ENG-Z", duration_minutes: 180 }
              as: ServiceCoordinator
              captures: { i_ok_id: $.data.id, i_ok_status: $.data.install_status }
          assert:
            - "the 00:20 crew slot is rejected with ERR_SERVICE_WINDOW_OVERLAP because it falls inside the first slot's buffered window"
            - "the 04:30 crew slot reads install_status == SCHEDULED, clearing the buffer that ends at 2026-09-12T03:30:00Z"
            - "the two rules differ in interval semantics: the technician rule is half-open with no buffer, the crew rule carries a 30-minute buffer"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: dealer_holdback_release_reversal_conserves_account_total
        grounds:
          - calculations.dealer_standing_derivation
          - calculations.chargeback_decision
          - entities.Dealer.fields.holdback_reserve_cents
          - entities.Dealer.fields.chargeback_balance_due_cents
        distinguishing_aspect: |
          A forward holdback release paired with its compensating reversal leaves the
          conserved cents quantity dealer_account_total = holdback_reserve_cents +
          chargeback_balance_due_cents unchanged, so the dealer's cash position returns
          exactly to its pre-release value with zero drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
            - "Dealer D1 with holdback_rate 0.10 and a funded PREMIUM contract K3 (capex 24900, holdback 2490) under package P3."
            - "A chargeback of 2490 was adjudicated, moving the full holdback into the due balance."
          setup_api_calls:
            - call: "POST /alarm-funding/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alarm-funding/dealers"
              payload: { dealer_code: "D1", legal_name: "Northstar Security LLC", holdback_rate: 0.10, quality_tier: "TIER_1" }
              as: ChannelManager
              captures: { d1_id: $.data.id }
            - call: "POST /alarm-funding/customers"
              payload: { full_name: "Cleo Chargeback", email: "cleo.chargeback@example.com", phone: "+15550001022" }
              as: ChannelManager
              captures: { c22_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages"
              payload: { package_reference: "PKG-P3", dealer_id: "${d1_id}" }
              as: FundingAnalyst
              captures: { p3_id: $.data.id }
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/contracts"
              payload: { customer_id: "${c22_id}", equipment_config_code: "PREMIUM", credit_score: 700, contract_term_months: 60, monthly_monitoring_cents: 4999, financed_charge_at_apr_cents: 0, premises_address_line: "190 Rowan St", premises_city: "Dallas", premises_state_code: "TX", premises_postal_code: "75016", installation_scheduled_at: "2026-09-02T00:00:00Z", installation_engineer_id: "ENG-1" }
              as: FundingAnalyst
              captures: { k3_id: $.data.id }
            - call: "GET /alarm-funding/monitoring-accounts"
              payload: { contract_id: "${k3_id}" }
              as: MonitoringOperator
              captures: { ma3_id: "$.data[0].id" }
            - call: "POST /alarm-funding/monitoring-transfers/${ma3_id}/trigger"
              payload: {}
              as: MonitoringOperator
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${d1_id}"
            - call: "GET /alarm-funding/dealer-packages/${p3_id}"
              payload: {}
              as: FundingAnalyst
              captures: { p3_v: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/approve"
              payload: { expected_dealer_package_version: "${p3_v}" }
              as: FundingAnalyst
              captures: { p3_v2: $.data.version }
            - call: "POST /alarm-funding/dealer-packages/${p3_id}/fund"
              payload: { expected_dealer_package_version: "${p3_v2}" }
              as: FundingAnalyst
            - call: "POST /alarm-funding/contracts/${k3_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c22_id}"
            - call: "POST /alarm-funding/contracts/${k3_id}/chargeback"
              payload: {}
              as: FundingAnalyst
          trigger:
            - call: "GET /alarm-funding/dealers/${d1_id}"
              payload: {}
              as: FundingAnalyst
              captures: { hb_before: $.data.holdback_reserve_cents, due_before: $.data.chargeback_balance_due_cents }
            - call: "POST /alarm-funding/dealers/${d1_id}/holdback-releases"
              payload: { amount_cents: 500 }
              as: FundingAnalyst
              captures: { hb_mid: $.data.holdback_reserve_cents, due_mid: $.data.chargeback_balance_due_cents }
            - call: "POST /alarm-funding/dealers/${d1_id}/holdback-reversals"
              payload: { amount_cents: 500 }
              as: FundingAnalyst
              captures: { hb_after: $.data.holdback_reserve_cents, due_after: $.data.chargeback_balance_due_cents }
          assert:
            - "before the pair: holdback_reserve_cents + chargeback_balance_due_cents == dealer_account_total"
            - "after the release: holdback_reserve_cents decreased by 500 and chargeback_balance_due_cents increased by 500"
            - "after the reversal: holdback_reserve_cents == ${hb_before} and chargeback_balance_due_cents == ${due_before}"
            - "the conserved quantity dealer_account_total is unchanged by the forward+compensating pair, with zero drift"

      - name: false_alarm_legal_hold_release_conserves_verified_signal_count
        grounds:
          - calculations.false_alarm_ratio
          - endpoints.GET_/alarm-funding/monitoring-accounts/{id}/false-alarm-ratio
          - entities.AlarmEvent.fields.counted_for_false_alarm
        distinguishing_aspect: |
          A conserved-count invariant, not a conserved-cents one: placing a legal hold on one
          alarm removes exactly one signal from verified_signal_count, and releasing the hold
          restores it, leaving the count invariant identical while the ratio is unchanged.
        test_recipe:
