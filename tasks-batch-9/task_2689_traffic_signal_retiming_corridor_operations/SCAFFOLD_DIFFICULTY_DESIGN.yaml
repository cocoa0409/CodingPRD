          assert:
            - "${pb_status} == ABANDONED"
            - "REFERENTIAL cross-entity failure (pB is non-terminal and healthy, only its corridor is wrong): HTTP 422 with ${err_mismatch} == ERR_COMPLAINT_PROJECT_MISMATCH"
            - "CitizenComplaint.${xa_id}.status == TRIAGED immediately after that refusal (no partial link)"
            - "STATE cross-entity failure (right corridor, terminal project): HTTP 409 with ${err_terminal} == ERR_PROJECT_TERMINAL"
            - "CitizenComplaint.${xb_id}.status == TRIAGED and CitizenComplaint.${xb_id}.linked_project_id == null"
            - "SUCCESS (right corridor, non-terminal project): ${xa_status} == LINKED and ${xa_linked} == ${pa_id}"
            - "Corridor.${ca_id}.complaint_open_count == 0 and Corridor.${ca_id}.complaint_linked_count == 1"
            - "Corridor.${cb_id}.complaint_open_count == 1 and Corridor.${cb_id}.complaint_linked_count == 0"
            - "Requester.${r1_id}.open_complaint_count == 2 (LINKED still counts as open for the requester)"

  # =============================================================================================
  # RULE 8 — resource_temporal_overlap
  # =============================================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: timing_plan_tod_windows_half_open_zero_buffer_per_intersection
        grounds:
          - validations[priority=66]
          - errors.ERR_TOD_WINDOW_OVERLAP
          - state_machines.TimingPlan.COORDINATED_to_SUBMITTED
          - entities.TimingPlan.fields.tod_start_min
          - entities.TimingPlan.fields.tod_end_min
        distinguishing_aspect: |
          INTERVAL SEMANTICS A — HALF-OPEN [tod_start_min, tod_end_min) with ZERO buffer, on the
          Intersection resource, measured in minutes-after-midnight, and only against plans whose status
          is in {COORDINATED, SUBMITTED, CERTIFIED, DEPLOYED}. Adjacency (a.end == b.start) is
          explicitly PERMITTED, which is the exact opposite of the travel-time-run rule's treatment of
          touching endpoints. Four plans are coordinated in one pipeline run so the whole matrix is
          probed with no further state changes: on i1, A [360,540) then B [500,700) collide; on i2,
          D [360,540) then E [540,700) touch and are both accepted. E's window also overlaps B's
          window, but they sit on different intersections, so the resource key is proven to be
          intersection_id and not the corridor or the project.
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, annual_volume_change_pct 20.0) has two READY members: i1 at sequence_index 1 (distance 0) and i2 at sequence_index 2 (distance_from_prev_ft 2640)."
            - "Both intersections have a BEFORE TurningMovementCount with phase_volumes {1:350, 2:500, 4:250, 6:180}, so each recommends cycle 105 and the coordinated cycle is 105."
            - "Four DRAFT plans exist, each with two phase splits {1: split 21 / min_green 10, 2: split 21 / min_green 15} and no pedestrian phase, so every plan coordinates to effective splits {1:53, 2:52} and ped_compliance_state COMPLIANT."
            - "Plan A: i1, AM_PEAK, [360, 540). Plan B: i1, MID_DAY, [500, 700). Plan D: i2, AM_PEAK, [360, 540). Plan E: i2, PM_PEAK, [540, 700)."
            - "Every POST /signal-ops/timing-plans bumps RetimingProject.version, so the project is re-read between plan creations and each create carries the freshly observed expected_project_version."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 3rd Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i2_id}", sequence_index: 2, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Two-signal arterial pair" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/intersections/${i2_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v1: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v1}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pa_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pa_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pa_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "GET /signal-ops/retiming-projects/${p1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v2: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "MID_DAY", tod_start_min: 500, tod_end_min: 700, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v2}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pb_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pb_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pb_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "GET /signal-ops/retiming-projects/${p1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v3: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i2_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v3}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pd_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pd_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pd_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "GET /signal-ops/retiming-projects/${p1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v4: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i2_id}", tod_period: "PM_PEAK", tod_start_min: 540, tod_end_min: 700, coordination_ref: "MASTER", cycle_length_sec: 90, expected_project_version: "${p1_v4}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { pe_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${pe_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${pe_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 21, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
          trigger:
            - call: "POST /signal-ops/timing-plans/${pa_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { a_status: $.data.status, a_cycle: $.data.cycle_length_sec, a_offset: $.data.offset_sec }
            - call: "POST /signal-ops/timing-plans/${pb_id}/submit"
