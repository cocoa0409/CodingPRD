scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (>=2, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pod_throughput_current_vs_planned_diverge
        grounds:
          - calculations.pod_dose_throughput_capacity
          - state_machines.ShiftAssignment.CONFIRMED_to_CHECKED_IN
        distinguishing_aspect: |
          Staffing/throughput domain: current_throughput_capacity_per_hour (CHECKED_IN
          only) and planned_throughput_capacity_per_hour (CONFIRMED+CHECKED_IN) are
          computed from the same ShiftAssignment rows but different status filters,
          producing different numbers (80 vs 120) for the same POD in the same call.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL with staffing_capacity_lanes=10, lane_throughput_rate_per_hour=40"
            - "Countermeasure with doses_required=1; POD-scoped InventoryLot with on_hand_quantity=500"
            - "6 verified StaffMembers each with a ShiftAssignment 2026-03-02T08:00:00Z-2026-03-02T16:00:00Z, all CONFIRMED; 4 of the 6 additionally CHECKED_IN"
            - "clock at 2026-03-02T10:00:00Z (inside the shift window)"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: PANDEMIC_INFLUENZA, title: "County Flu POD Plan", jurisdiction_code: "CTY01", target_population: 50000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Central HS POD", site_type: FIXED_POD, address: "100 Main St", staffing_capacity_lanes: 10, lane_throughput_rate_per_hour: 40 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /countermeasures"
              payload: { name: "Seasonal Flu Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 1500, reorder_point_quantity: 50 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", pod_id: "${pod_id}", lot_number: "LOT-A1", on_hand_quantity: 500, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Staff One", email: "staff1@example.org", primary_role: VACCINATOR, mrc_unit: "UnitA", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /staff-members/${s1_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Staff Two", email: "staff2@example.org", primary_role: VACCINATOR, mrc_unit: "UnitA", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /staff-members/${s2_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Staff Three", email: "staff3@example.org", primary_role: VACCINATOR, mrc_unit: "UnitA", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { s3_id: $.data.id }
            - call: "POST /staff-members/${s3_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Staff Four", email: "staff4@example.org", primary_role: VACCINATOR, mrc_unit: "UnitA", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /staff-members/${s4_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Staff Five", email: "staff5@example.org", primary_role: VACCINATOR, mrc_unit: "UnitA", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { s5_id: $.data.id }
            - call: "POST /staff-members/${s5_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Staff Six", email: "staff6@example.org", primary_role: VACCINATOR, mrc_unit: "UnitA", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { s6_id: $.data.id }
            - call: "POST /staff-members/${s6_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T10:00:00Z" }
              as: PublicHealthAdmin
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${s1_id}", assigned_role: VACCINATOR, start_time: "2026-03-02T08:00:00Z", end_time: "2026-03-02T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa1_id: $.data.id }
            - call: "POST /shift-assignments/${sa1_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments/${sa1_id}/check_in"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${s2_id}", assigned_role: VACCINATOR, start_time: "2026-03-02T08:00:00Z", end_time: "2026-03-02T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa2_id: $.data.id }
            - call: "POST /shift-assignments/${sa2_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments/${sa2_id}/check_in"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${s3_id}", assigned_role: VACCINATOR, start_time: "2026-03-02T08:00:00Z", end_time: "2026-03-02T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa3_id: $.data.id }
            - call: "POST /shift-assignments/${sa3_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments/${sa3_id}/check_in"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${s4_id}", assigned_role: VACCINATOR, start_time: "2026-03-02T08:00:00Z", end_time: "2026-03-02T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa4_id: $.data.id }
            - call: "POST /shift-assignments/${sa4_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments/${sa4_id}/check_in"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${s5_id}", assigned_role: VACCINATOR, start_time: "2026-03-02T08:00:00Z", end_time: "2026-03-02T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa5_id: $.data.id }
            - call: "POST /shift-assignments/${sa5_id}/confirm"
              payload: {}
              as: ClinicalLead
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${s6_id}", assigned_role: VACCINATOR, start_time: "2026-03-02T08:00:00Z", end_time: "2026-03-02T16:00:00Z" }
              as: PublicHealthAdmin
