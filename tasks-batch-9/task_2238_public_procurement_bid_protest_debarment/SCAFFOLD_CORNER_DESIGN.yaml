        claim_type: Triggerability
        grounds:
          - errors[ERR_ACTIVE_PROCEEDING_EXISTS]
        excluded_because:
          difficulty_instance: vendor_compliance_docket_rejects_a_notice_at_exactly_the_prior_resolution_instant
          rationale: "That §1.8 resource_temporal_overlap instance rejects a notice landing exactly on the prior proceeding's resolution instant with ERR_ACTIVE_PROCEEDING_EXISTS."

