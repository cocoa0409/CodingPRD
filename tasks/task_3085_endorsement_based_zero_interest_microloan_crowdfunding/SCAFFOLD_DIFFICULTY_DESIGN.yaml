  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_contribution
        grounds:
          - validations[priority=4]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OVERFUND]
        distinguishing_aspect: |
          Pair (state, business_fiscal): a contribution that would overfund
          AND targets an application in DRAFT must return ERR_INVALID_STATE
          (priority 4), not ERR_OVERFUND (priority 16) — the state check wins
          even though the fiscal violation is independently detectable.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. DRAFT application for 250000 / 3 months (never submitted). Lender with balance 1000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { legal_name: "Luz Mara", business_name: "Mara Bakes", email: "luz@example.com", business_tenure_months: 6, prior_repaid_loans_count: 0 }
              as: Anonymous
              captures: { borrower_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 250000, term_months: 3, business_purpose: "Mixer" }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { app_id: $.data.id }
            - call: "POST /lenders"
              payload: { display_name: "Omer F", email: "of@example.com" }
              as: Anonymous
              captures: { lender_id: $.data.id }
            - call: "POST /lenders/${lender_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Lender
              as_user_id: "${lender_id}"
          trigger:
            - call: "POST /loan-applications/${app_id}/contributions"
              payload: { lender_id: "${lender_id}", amount_cents: 300000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (http 409), not ERR_OVERFUND"
            - "Lender.${lender_id}.lending_balance_cents unchanged == 1000000"

      - name: business_safety_vs_business_fiscal_on_submit
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_UNDERWRITING_ACCEPTANCE_QUOTA]
          - errors[ERR_TRUSTEE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal): a trustee-vouched submit
          that fails the acceptance quota (0 accepts) AND would breach the
          trustee's endorsement limit must return
          ERR_UNDERWRITING_ACCEPTANCE_QUOTA (priority 9), not
          ERR_TRUSTEE_LIMIT_EXCEEDED (priority 11).
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Trustee with endorsement_limit_cents 100000 (below the requested 500000)."
            - "Borrower with ZERO accepted invites and a DRAFT application for 500000 / 6 months."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trustees"
              payload: { org_name: "Tiny Trust", endorsement_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { trustee_id: $.data.id }
            - call: "POST /borrowers"
              payload: { legal_name: "Noor Paz", business_name: "Paz Prints", email: "noor@example.com", business_tenure_months: 5, prior_repaid_loans_count: 0 }
              as: Anonymous
              captures: { borrower_id: $.data.id }
            - call: "POST /loan-applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 500000, term_months: 6, business_purpose: "Press" }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /loan-applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v}", trustee_id: "${trustee_id}" }
              as: Borrower
              as_user_id: "${borrower_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_UNDERWRITING_ACCEPTANCE_QUOTA (http 409), not ERR_TRUSTEE_LIMIT_EXCEEDED"
            - "LoanApplication.${app_id}.status remains DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quorum_exactly_met_vs_one_short
        grounds:
          - calculations.endorser_quorum
          - validations[priority=13]
        distinguishing_aspect: |
          Numeric-threshold boundary on open-public (>= comparison): with
          required_endorser_count == 5, exactly 5 distinct endorsers pass,
          while 4 fail with ERR_QUORUM_NOT_MET. The trustee endorsement counts
          toward the quorum without moving money, which is what makes the
          fifth slot reachable here.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "Two trustee-vouched applications (300000 each / 4 months) from two borrowers, each with 3 accepted invites; each application has exactly 4 lender endorsements (25000 each) — app A then receives 1 trustee endorsement (5 total), app B stays at 4."
