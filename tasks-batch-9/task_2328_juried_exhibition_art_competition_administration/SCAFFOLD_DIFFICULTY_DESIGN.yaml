          - calculations.insurance_premium_assessment
          - entities.Exhibition.fields.council_retention_cents
          - state_machines.Exhibition.NOT_STARTED_to_RECONCILING
        distinguishing_aspect: |
          Mode (c) pinned multi-step evaluation order: the premium-recovery tier is selected from
          step 2's commission_total_cents (160920 -> 0.75), never from the step-5 result, so
