# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: multi-dose-adherence-mail-pharmacy   (api_prefix /pharmacy)
# 9 rule_id blocks / 25 instances. Every literal in every assert was computed
# against the §1.3 formulas and their constants before being written down.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: sync_bridge_vs_trim_day_supply_on_cycle_line
        grounds:
          - calculations.sync_alignment_days
          - entities.CycleLine.fields.days_supply_filled
          - entities.CycleLine.fields.trim_days_applied
          - entities.Patient.fields.sync_mode
          - state_machines.FillCycle.DRAFT_to_LINES_ADJUDICATED
        distinguishing_aspect: |
          This instance lives in the CycleLine / day-supply domain: two patients with
          byte-identical prescriptions and an identical 28-day cycle window produce
          days_supply_filled 28 versus 21 purely because Patient.sync_mode is
          BRIDGE_TO_START versus TRIM_TO_START, and the 191-cent copay gap is
          attributable to nothing else.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one InsurancePlan with generic rate 34 cents/day, coinsurance 20%, refill-too-soon threshold 75%"
            - "patient A synchronized on anchor day 15 with sync_mode BRIDGE_TO_START; patient B identical but TRIM_TO_START"
            - "each patient holds exactly one identical Metformin ER prescription last dispensed 2026-07-25 for 28 days (on-hand through 2026-08-22, i.e. 7 days of overlap with the 2026-08-15 cycle start)"
            - "each patient has a DRAFT FillCycle covering 2026-08-15 .. 2026-09-12 with day_supply_days 28"
            - "patient A's cycle is already adjudicated"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1957-03-11", email: "dana.reyes@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_a: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Bo Lindqvist", date_of_birth: "1955-11-02", email: "bo.lindqvist@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_b: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_a}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING", "BEDTIME"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx_a: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_b}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING", "BEDTIME"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx_b: $.data.id }
            - call: "POST /pharmacy/patients/${pt_a}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/patients/${pt_b}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "TRIM_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_a}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c_a: $.data.id }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_b}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c_b: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c_a}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
          trigger:
            - call: "POST /pharmacy/fill-cycles/${c_b}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
              captures: { c_b_total: $.data.total_copay_cents }
            - call: "GET /pharmacy/cycle-lines"
              payload: { cycle_id: "${c_a}" }
              as: PharmacyOperations
              captures: { line_a: "$.data[0].id" }
            - call: "GET /pharmacy/cycle-lines"
              payload: { cycle_id: "${c_b}" }
              as: PharmacyOperations
              captures: { line_b: "$.data[0].id" }
          assert:
            - "CycleLine.${line_a}.days_supply_filled == 28"
            - "CycleLine.${line_a}.bridge_days_applied == 0"
            - "CycleLine.${line_a}.trim_days_applied == 0"
            - "CycleLine.${line_a}.line_start_date == 2026-08-15"
            - "CycleLine.${line_a}.line_end_date == 2026-09-12"
            - "CycleLine.${line_a}.copay_cents == 762"
            - "CycleLine.${line_b}.days_supply_filled == 21"
            - "CycleLine.${line_b}.trim_days_applied == 7"
            - "CycleLine.${line_b}.line_end_date == 2026-09-05"
            - "CycleLine.${line_b}.copay_cents == 571"
            - "FillCycle.${c_a}.total_copay_cents == 762"
            - "FillCycle.${c_b}.total_copay_cents == 571"
            - "CycleLine.${line_a}.days_supply_filled - CycleLine.${line_b}.days_supply_filled == 7"
            - "Prescription.${rx_a}.last_dispensed_days_supply == 28 and Prescription.${rx_b}.last_dispensed_days_supply == 21"

      - name: adherence_rolling_window_vs_cycle_scoped_score
        grounds:
          - calculations.adherence_score_pct
          - entities.Patient.fields.adherence_score_pct
          - entities.Pouch.fields.dose_date
          - entities.AdherenceEvent.fields.event_type
          - calculations.roll_pouch_count
        distinguishing_aspect: |
          This instance lives in the Patient / adherence-percentage domain, not the
          day-supply domain: from ONE event stream (16 POUCH_TAKEN, 4 POUCH_MISSED) the
          ROLLING_28_DAY variant reports 80 because its denominator is reported events
          only (20), while the CYCLE_SCOPED variant reports 76 because its denominator is
          every elapsed pouch (21), including the one pouch that produced no event at all.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-22T00:00:00Z after the roll is built"
            - "one patient synchronized BRIDGE_TO_START on anchor day 15 holding two prescriptions covering three dose slots (MORNING+BEDTIME and EVENING)"
            - "an adjudicated cycle 2026-08-15 .. 2026-09-12 whose pouch roll holds 84 pouches (3 slots x 28 days)"
            - "21 of those pouches have a dose_date strictly before the clock date 2026-08-22"
            - "no adherence events recorded yet, so the patient's score is the vacuous 100"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 90, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1957-03-11", email: "dana.reyes@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING", "BEDTIME"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Sitagliptin", ndc: "00006-0277-31", strength: "100mg", form: "TABLET", copay_tier: "SPECIALTY", dose_times: ["EVENING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 30 }
              as: Prescriber
              captures: { rx3: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              captures: { roll1: $.data.id, roll_pouches: $.data.pouch_count }
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pharmacy/patients/${pt_id}/dose-events"
              payload:
                cycle_id: "${c1}"
                events:
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-15T08:00:00Z", dose_slot: "MORNING", pouch_index: 1 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-15T18:00:00Z", dose_slot: "EVENING", pouch_index: 2 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-15T21:00:00Z", dose_slot: "BEDTIME", pouch_index: 3 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-16T08:00:00Z", dose_slot: "MORNING", pouch_index: 4 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-16T18:00:00Z", dose_slot: "EVENING", pouch_index: 5 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-16T21:00:00Z", dose_slot: "BEDTIME", pouch_index: 6 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-17T08:00:00Z", dose_slot: "MORNING", pouch_index: 7 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-17T18:00:00Z", dose_slot: "EVENING", pouch_index: 8 }
                  - { event_type: "POUCH_MISSED", occurred_at: "2026-08-17T21:00:00Z", dose_slot: "BEDTIME", pouch_index: 9 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-18T08:00:00Z", dose_slot: "MORNING", pouch_index: 10 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-18T18:00:00Z", dose_slot: "EVENING", pouch_index: 11 }
                  - { event_type: "POUCH_MISSED", occurred_at: "2026-08-18T21:00:00Z", dose_slot: "BEDTIME", pouch_index: 12 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-19T08:00:00Z", dose_slot: "MORNING", pouch_index: 13 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-19T18:00:00Z", dose_slot: "EVENING", pouch_index: 14 }
                  - { event_type: "POUCH_MISSED", occurred_at: "2026-08-19T21:00:00Z", dose_slot: "BEDTIME", pouch_index: 15 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-20T08:00:00Z", dose_slot: "MORNING", pouch_index: 16 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-20T18:00:00Z", dose_slot: "EVENING", pouch_index: 17 }
                  - { event_type: "POUCH_MISSED", occurred_at: "2026-08-20T21:00:00Z", dose_slot: "BEDTIME", pouch_index: 18 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-21T08:00:00Z", dose_slot: "MORNING", pouch_index: 19 }
                  - { event_type: "POUCH_TAKEN",  occurred_at: "2026-08-21T18:00:00Z", dose_slot: "EVENING", pouch_index: 20 }
              as: Patient
              as_user_id: "${pt_id}"
            - call: "GET /pharmacy/patients/${pt_id}/adherence-summary"
              payload: {}
              as: PharmacyOperations
              captures: { rolling: $.data.rolling_28_day_score_pct, cycle_scoped: $.data.cycle_scoped_score_pct }
          assert:
            - "PouchRoll.${roll1}.pouch_count == 84"
            - "adherence-summary.rolling_28_day_score_pct == 80"
            - "adherence-summary.cycle_scoped_score_pct == 76"
            - "adherence-summary.taken_count == 16"
            - "adherence-summary.missed_count == 4"
            - "adherence-summary.expected_pouch_count == 21"
            - "Patient.${pt_id}.adherence_score_pct == 80"
            - "Patient.${pt_id}.autoship_status == ACTIVE"
            - "Patient.${pt_id}.pause_reason == null"
            - "the response of POST /pharmacy/patients/${pt_id}/dose-events is an array of 20 AdherenceEvent objects, each with source == PATIENT_REPORTED"

  - rule_id: combinatorial_formula
    instances:

      - name: day_supply_allowance_four_way_min_chain
        grounds:
          - calculations.day_supply_allowance_days
          - entities.CycleLine.fields.allowance_days
          - entities.Prescription.fields.is_controlled
          - entities.Prescription.fields.refrigerated
          - entities.InsurancePlan.fields.max_day_supply_days
        distinguishing_aspect: |
          Combination mode a — successive min() over FOUR independent ceilings, two of
          them flag-gated. One cycle produces four lines whose allowance is decided by a
          DIFFERENT term of the same chain: the payer ceiling (34), the prescriber's
          remaining written supply (8 x 4 = 32), the controlled-substance cap (30) and
          the cold-chain cap (30). No other instance folds terms with min().
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "an InsurancePlan whose max_day_supply_days is the deliberately tight 34 and whose refill-too-soon threshold is 75"
            - "one patient synchronized TRIM_TO_START on anchor day 15"
            - "four prescriptions all last dispensed 2026-07-31 for 20 days (on hand through 2026-08-20, so overlap_days 5 and refill_pct_used floor(100*15/20) = 75, exactly clearing)"
            - "rxA: plain TABLET, days_supply_written 40, refills_authorized 3 -> prescriber term 160"
            - "rxB: plain CAPSULE, days_supply_written 8, refills_authorized 3 -> prescriber term 32"
            - "rxC: TABLET with is_controlled true, days_supply_written 40, refills_authorized 3"
            - "rxD: INJECTION_PEN with refrigerated true, days_supply_written 40, refills_authorized 3"
            - "a DRAFT FillCycle starting 2026-08-15 with day_supply_days 35, so the window term is 35 + 0 bridge + 0 vacation days and every line fills 35 - 5 = 30 days"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Cascade Health PBM", bin_number: "004336", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, max_day_supply_days: 34, vacation_overrides_per_year: 1, coinsurance_pct: 20, allows_payer_vacation_override: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Ines Duarte", date_of_birth: "1949-06-14", email: "ines.duarte@example.com", state_code: "OR", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Atorvastatin", ndc: "00093-5058-98", strength: "20mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["BEDTIME"], quantity_per_dose: 1, days_supply_written: 40, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-31", last_dispensed_days_supply: 20 }
              as: Prescriber
              captures: { rx_a: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Gabapentin", ndc: "00093-1028-01", strength: "300mg", form: "CAPSULE", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 8, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-31", last_dispensed_days_supply: 20 }
              as: Prescriber
              captures: { rx_b: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Lorazepam", ndc: "00591-0240-01", strength: "0.5mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["EVENING"], quantity_per_dose: 1, days_supply_written: 40, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", is_controlled: true, last_dispensed_date: "2026-07-31", last_dispensed_days_supply: 20 }
              as: Prescriber
              captures: { rx_c: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Insulin glargine", ndc: "00088-2220-33", strength: "100 units/mL", form: "INJECTION_PEN", copay_tier: "SPECIALTY", dose_times: ["BEDTIME"], quantity_per_dose: 1, days_supply_written: 40, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", refrigerated: true, last_dispensed_date: "2026-07-31", last_dispensed_days_supply: 20 }
              as: Prescriber
              captures: { rx_d: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "TRIM_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 35 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
              captures: { cycle_total: $.data.total_copay_cents }
            - call: "GET /pharmacy/cycle-lines"
              payload: { cycle_id: "${c1}", prescription_id: "${rx_a}" }
              as: PharmacyOperations
              captures: { line_a: "$.data[0].id" }
            - call: "GET /pharmacy/cycle-lines"
              payload: { cycle_id: "${c1}", prescription_id: "${rx_b}" }
              as: PharmacyOperations
              captures: { line_b: "$.data[0].id" }
            - call: "GET /pharmacy/cycle-lines"
              payload: { cycle_id: "${c1}", prescription_id: "${rx_c}" }
              as: PharmacyOperations
              captures: { line_c: "$.data[0].id" }
            - call: "GET /pharmacy/cycle-lines"
              payload: { cycle_id: "${c1}", prescription_id: "${rx_d}" }
              as: PharmacyOperations
              captures: { line_d: "$.data[0].id" }
          assert:
            - "FillCycle.${c1}.cycle_end_date == 2026-09-19"
            - "CycleLine.${line_a}.days_supply_filled == 30 and CycleLine.${line_a}.trim_days_applied == 5"
            - "CycleLine.${line_a}.allowance_days == 34   # payer ceiling wins: min(34, 160, 35)"
            - "CycleLine.${line_b}.allowance_days == 32   # prescriber term wins: min(34, 32, 35)"
            - "CycleLine.${line_c}.allowance_days == 30   # controlled cap wins: min(min(34,160,35), 30)"
            - "CycleLine.${line_d}.allowance_days == 30   # cold-chain cap wins: min(min(34,160,35), 30)"
            - "every one of the four lines has line_status ADJUDICATED — 30 <= 30 is not an exceedance"
            - "CycleLine.${line_c}.packable_route == POUCH and CycleLine.${line_d}.packable_route == COLD_CHAIN"
            - "FillCycle.${c1}.insurance_status == CLEARED"
            - "FillCycle.${c1}.total_copay_cents == 3504   # 816 + 816 + 816 + 1056"

      - name: cycle_copay_tier_rate_coinsurance_and_final_rounding
        grounds:
          - calculations.cycle_copay_cents
          - entities.FillCycle.fields.final_copay_cents
          - entities.FillCycle.fields.rounding_delta_cents
          - entities.CreditMemo.fields.reason
          - state_machines.FillCycle.VERIFIED_to_SHIPPED
        distinguishing_aspect: |
          Combination mode b — a three-factor PRODUCT (tier rate x days x coinsurance
          factor) summed across four lines and then rounded a second time at a different
          moment in the lifecycle, so the same input set yields 4392 provisionally and
          4390 finally. Selection is by enum lookup and the composition is multiplicative,
          not a min() fold and not an ordered four-step waterfall.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "plan rates 34 GENERIC / 74 PREFERRED_BRAND / 44 SPECIALTY cents per day, coinsurance_pct 20, max_day_supply_days 90, threshold 75"
            - "one patient synchronized BRIDGE_TO_START on anchor day 15"
            - "the canonical four prescriptions: Metformin ER GENERIC [MORNING,BEDTIME], Rivaroxaban PREFERRED_BRAND [MORNING], Sitagliptin SPECIALTY [EVENING], Insulin glargine SPECIALTY [BEDTIME] refrigerated"
            - "each last dispensed so that refill_pct_used is 75 / 86 / 93 / 100 and every line fills the full 28 days"
            - "a DRAFT FillCycle 2026-08-15 .. 2026-09-12 with day_supply_days 28"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
