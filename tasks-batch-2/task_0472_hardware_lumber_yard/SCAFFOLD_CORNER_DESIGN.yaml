              payload: { sku: "PC-1", vendor_id: "${cv7}", sell_mode: "EACH", aisle: "PC", bin: "QC", list_price_cents: 1000, reorder_point: 0, reorder_qty: 10 }
              as: InventoryManager
              captures: { pcp: $.data.id }
