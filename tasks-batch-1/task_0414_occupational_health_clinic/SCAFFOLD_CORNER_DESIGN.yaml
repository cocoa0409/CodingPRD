  # ===========================================================================
  # SECTION 4 — VALIDATIONS (violation->error / satisfaction->pass /
  # priority ordering / cross-entity / temporal / conditional)
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_outranks_existence_missing_headers_on_missing_resource
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=3]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]
        distinguishing_aspect: "A request with missing X-User-ID/X-User-Role against a non-existent employer returns 401 ERR_MISSING_OR_INVALID_USER_CONTEXT (auth pri 1) not 404 (existence pri 3)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT"

      - name: authz_outranks_existence_wrong_role_on_missing_resource
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "A Collector (no permission for suspend) suspending a non-existent employer returns 403 ERR_INSUFFICIENT_PERMISSIONS (authz pri 2) not 404 (existence pri 3)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/employers/00000000-0000-4000-8000-000000000000/suspend"
              payload: {}
              as: Collector
              captures: { err: $.data.error_id }
