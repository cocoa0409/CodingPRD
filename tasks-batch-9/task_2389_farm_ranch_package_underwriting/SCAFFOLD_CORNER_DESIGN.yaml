  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_stale_policy_version_on_every_occ_guarded_policy_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.endorsement-create-stale-policy", "errors.ERR_STALE_POLICY_VERSION", "endpoints.POST_/farm-policies/{id}/rate", "endpoints.POST_/farm-policies/{id}/bind", "endpoints.POST_/farm-policies/{id}/cancel"]
        distinguishing_aspect: "The pre-rating version 1 is replayed against all four OCC-guarded policy writes: each one returns ERR_STALE_POLICY_VERSION (412) and each retry with the freshly read version succeeds, and the endorsement creation shows that an OCC-guarded write need not itself bump the version."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy at version 1 with an RC DWELLING at 40000000 and an all-zero labor profile"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { occ_v1: $.data.version }
          trigger:
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${occ_v1}" }
              as: Underwriter
              captures: { occ_rated: $.data.uw_status, occ_v_after_rate: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${occ_v1}", form_code: "AGRITOURISM_LIABILITY", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_occ_end: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${occ_v_after_rate}", form_code: "AGRITOURISM_LIABILITY", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { occ_end: $.data.id }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${occ_v1}" }
              as: Underwriter
              captures: { e_occ_bind: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${occ_v_after_rate}" }
              as: Underwriter
              captures: { occ_bound: $.data.uw_status, occ_v_after_bind: $.data.version }
            - call: "POST /farm-policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${occ_v1}", closure_reason: "insured withdrew" }
              as: Underwriter
              captures: { e_occ_cancel: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${occ_v_after_bind}", closure_reason: "insured withdrew" }
              as: Underwriter
              captures: { occ_cancelled: $.data.uw_status }
          assert:
            - "the rating succeeds at version 1 and returns version 2 with total_premium_cents 269200"
            - "the three replays of version 1 each return HTTP 412 ERR_STALE_POLICY_VERSION and change nothing — not the state, not a premium, not the version"
            - "the endorsement creation at version 2 succeeds and leaves the version at 2, which is exactly why the following bind at version 2 is accepted"
            - "the bind returns version 3 and the cancel at version 3 succeeds, ending at uw_status CANCELLED"
            - "the cancellation cascade releases the three COMMITTED reservations, flattens the ledger to a zero sum and zeroes every premium field"
            - "the REQUESTED endorsement is left REQUESTED — only APPROVED or SUSPENDED rows are rescinded — and is now undecidable because the policy is terminal"

      - name: corner_stale_pool_version_on_capacity_pool_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules.pool-adjust-stale-pool", "errors.ERR_STALE_POOL_VERSION", "endpoints.PATCH_/cat-capacity-pools/{id}"]
        distinguishing_aspect: "A rating silently bumps the pool version behind the administrator's back, so the version read before rating is stale: the resize returns ERR_STALE_POOL_VERSION (412) and only the re-read version is accepted."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy with an RC DWELLING at 40000000, and the HAIL pool version captured BEFORE the rating"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: PlatformAdmin
              captures: { pool_v_before: $.data.version }
            - *k_rate_get
            - *k_rate
          trigger:
            - call: "PATCH /cat-capacity-pools/${pool_hail}"
              payload: { expected_pool_version: "${pool_v_before}", total_capacity_cents: 300000000 }
              as: PlatformAdmin
              captures: { e_occ_pool: $.data.error_id }
            - call: "GET /cat-capacity-pools/${pool_hail}"
              as: PlatformAdmin
              captures: { pool_v_now: $.data.version }
            - call: "PATCH /cat-capacity-pools/${pool_hail}"
              payload: { expected_pool_version: "${pool_v_now}", total_capacity_cents: 300000000 }
              as: PlatformAdmin
              captures: { pool_resized: $.data.total_capacity_cents, pool_v_final: $.data.version }
          assert:
            - "pool_v_before is 1 and the rating raised it to 2 as part of reserving 20000000"
            - "the PATCH at version 1 returns HTTP 412 ERR_STALE_POOL_VERSION and leaves total_capacity_cents at 200000000"
            - "the PATCH at version 2 succeeds: total 300000000, reserved 20000000, available_cents 280000000 and version 3"
            - "the WIND and WILDFIRE pools are still at version 2 each — one bump from the same rating — so the version counter is per pool"

      - name: corner_compliance_reinstatement_restores_the_suspended_endorsement
        claim_type: cascading_side_effects
        grounds: ["state_machines.FarmPolicy.compliance_status[RECS_OPEN->COMPLIANT]", "state_machines.Endorsement[SUSPENDED->APPROVED]", "calculations.premium_ledger_projection"]
        distinguishing_aspect: "The cascade is exercised in the reinstating direction: accepting the remediation evidence walks compliance back to COMPLIANT, lifts the endorsement from SUSPENDED to APPROVED and writes a compensating ENDORSEMENT_ADD row, restoring the total to 419200 across five ledger rows."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING rated to 269200"
            - "an INITIAL inspection completed with no findings (hazard 10, compliance COMPLIANT), then an APPROVED POLLUTION_BUYBACK endorsement of 10000000 worth 150000, then a re-inspection completed with one MINOR finding that suspends it"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
            - *k_inspector
            - *k_inspection
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "clean survey", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { rein_h1: $.data.hazard_score }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { rein_v: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${rein_v}", form_code: "POLLUTION_BUYBACK", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { rein_end: $.data.id, rein_ri: $.data.requires_inspection }
            - call: "POST /endorsements/${rein_end}/decision"
              payload: { decision: "APPROVE", decision_note: "clean inspection, pollution buy-back granted" }
              as: Underwriter
              captures: { rein_prem: $.data.premium_cents }
            - call: "POST /inspections/${ins_id2}/reinspection"
              payload: { scheduled_for: "2026-08-17T09:00:00Z", duration_minutes: 60 }
              as: ComplianceOfficer
              captures: { rein_re: $.data.status }
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "chemical shed housekeeping", findings: [{ severity: "MINOR", description: "Bund the chemical shed floor", due_date: "2026-09-30" }] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { rein_h2: $.data.hazard_score }
            - call: "GET /inspections/${ins_id2}/recommendations"
              as: ComplianceOfficer
              captures: { rein_rec: "$.data[0].id" }
          trigger:
            - call: "POST /recommendations/${rein_rec}/evidence"
              payload: { evidence_note: "floor bunded, photos attached", completed_date: "2026-08-20" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { rein_rec_status: $.data.status }
            - call: "POST /recommendations/${rein_rec}/review"
              payload: { decision: "ACCEPT", review_note: "bunding verified" }
              as: ComplianceOfficer
              captures: { rein_verified: $.data.status }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { rein_compliance: $.data.compliance_status, rein_total: $.data.total_premium_cents }
            - call: "GET /endorsements/${rein_end}"
              as: Underwriter
              captures: { rein_end_status: $.data.status, rein_end_prem: $.data.premium_cents }
          assert:
            - "the first completion scored 10 and moved compliance NOT_INSPECTED -> COMPLIANT on an empty findings array"
            - "the approval wrote premium_cents 150000 (max(round_half_up(10000000 * 0.0150), 75000)) as ENDORSEMENT_APPROVAL, taking the total to 419200"
            - "the re-inspection completion scored 9 (RE_INSPECTION 5 + MINOR 4), moved compliance COMPLIANT -> RECS_OPEN, suspended the buy-back endorsement and wrote ENDORSEMENT_REMOVE -150000 with reason COMPLIANCE_SUSPENSION, dropping the total back to 269200"
            - "the evidence submission moves the recommendation OPEN -> SUBMITTED and changes no premium"
            - "the ACCEPT moves it to VERIFIED, and since no OPEN, SUBMITTED or OVERDUE recommendation remains, compliance goes back to COMPLIANT in the same request"
            - "that reinstatement lifts the endorsement SUSPENDED -> APPROVED with premium_cents 150000 again and writes ENDORSEMENT_ADD +150000 with reason COMPLIANCE_REINSTATEMENT"
            - "the ledger holds 5 rows — 144000, 125200, 150000, -150000, 150000 — summing to exactly the 419200 total_premium_cents"

      - name: corner_valuation_basis_switch_reprices_the_same_row
        claim_type: dual_variant_calculation
        grounds: ["calculations.scheduled_item_insured_value.variants", "endpoints.PATCH_/scheduled-items/{id}"]
        distinguishing_aspect: "The variant is a stored election, so flipping valuation_basis on one existing row re-runs the other branch in place: ACV 11040368 becomes RC 30001000 and the 18960632-cent delta shows up in the re-rated premium, not just in a second row."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy whose only item is an ACV EQUIPMENT combine (stated 30001000, age 12, grade B)"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Combine", valuation_basis: "ACV", stated_value_cents: 30001000, age_years: 12, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { dv_item: $.data.id, dv_acv: $.data.insured_value_cents }
            - *k_rate_get
            - *k_rate
          trigger:
            - call: "PATCH /scheduled-items/${dv_item}"
              payload: { valuation_basis: "RC" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { dv_rc: $.data.insured_value_cents }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { dv_status: $.data.uw_status, dv_v: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${dv_v}" }
              as: Underwriter
              captures: { dv_prop: $.data.property_premium_cents, dv_tiv: $.data.exposed_tiv_cents }
          assert:
            - "the ACV election stored 11040368: 30001000 less min(0.60, 12 * 0.070) depreciation gives 12000400, times the grade-B factor 0.92, above the 6000200 salvage floor and under the 40000000 EQUIPMENT cap"
            - "the first rating priced that as property 89427 (round_half_up(11040368 * 0.0090 * 0.90)) on an exposed_tiv of 11040368"
            - "the PATCH to RC re-values the same row to 30001000 = min(30001000, 40000000) — no depreciation, no condition factor and no salvage floor on the RC branch"
            - "the PATCH reverted the policy RATED -> DRAFT and reversed the rating ledger, so a re-rating is required"
            - "the re-rating prices property 243008 (round_half_up(30001000 * 0.0090 * 0.90)) on an exposed_tiv of 30001000 — the 18960632-cent valuation delta flows straight through"
            - "the three reservations were released on the revert and re-created on the re-rating, with the HAIL amount moving from 5520184 to 15000500"

      - name: corner_top_scarcity_tier_and_referral_trigger_in_one_rating
        claim_type: rate_threshold_triggers
        grounds: ["calculations.cat_load.constants.SCARCITY_TIERS", "calculations.referral_triggers", "state_machines.FarmPolicy.uw_status[DRAFT->REFERRED]"]
        distinguishing_aspect: "A utilization of 0.952381 sits in the top 1.60 scarcity band AND above the 0.90 referral threshold, so a single rating must both load the premium to 163600 of catastrophe charge and divert the policy to REFERRED with reason CAT_UTILIZATION_HIGH."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, zone ZN-3 with a thin HAIL pool of 21000000 (participation 0.50) plus normal 200000000 WIND and WILDFIRE pools, one DRAFT policy with an RC DWELLING at 40000000 and deductible 500000"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-3", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 21000000 }
              as: PlatformAdmin
              captures: { p3_hail: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-3", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p3_wind: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-3", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000 }
              as: PlatformAdmin
              captures: { p3_fire: $.data.id }
            - call: "POST /farm-accounts"
              payload: { legal_name: "Hailstreak Ranch", state_code: "KS", county_name: "Stafford", cat_zone_code: "ZN-3", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct3: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct3}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol3: $.data.id, pol3_v: $.data.version }
            - call: "POST /farm-policies/${pol3}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it3: $.data.id }
          trigger:
            - call: "POST /farm-policies/${pol3}/rate"
              payload: { expected_policy_version: "${pol3_v}" }
              as: Underwriter
              captures: { p3_status: $.data.uw_status, p3_reason: $.data.referral_reason_code, p3_cat: $.data.cat_load_cents, p3_total: $.data.total_premium_cents, p3_expiry: $.data.quote_expires_at }
          assert:
            - "the HAIL reservation records amount_cents 20000000 and utilization_at_rating 0.952381 = 20000000 / 21000000 rounded to six decimals"
            - "that lands in the fourth scarcity band (0.90 < u <= 1.00 -> 1.60), so load_cents == 102400 rather than the unloaded 64000"
            - "cat_load_cents == 163600 (102400 + 25200 + 36000) and total_premium_cents == 307600 on a property premium of 144000"
            - "uw_status == REFERRED with referral_reason_code CAT_UTILIZATION_HIGH, because 0.952381 exceeds the 0.90 referral threshold"
            - "quote_expires_at is null on a referral and only gets set when a second SeniorUnderwriter approves"
            - "the three reservations exist and are RESERVED — a referral still holds capacity"

  - section: consistency_model
    instances:

