              payload: { block_id: "${blk_id}" }
              as: SchedulingCoordinator
          assert:
            - "before the triggers: BlockTime.${blk_id}.block_duration_minutes == 240, committed_minutes == 0, open_minutes == 240, utilization_pct == 0.00"
            - "after trigger[0]: committed_minutes == 60, open_minutes == 180, utilization_pct == 25.00, BlockTime.version incremented"
            - "after trigger[1]: committed_minutes == 90, open_minutes == 150, utilization_pct == 37.50 (round_half_up of 100*90/240)"
            - "case ${case_c} is still DRAFT with block_id == null and its 120 minutes are absent from the aggregate"
            - "committed_minutes + released_minutes + open_minutes == 240 at every step, with released_minutes still 0"

