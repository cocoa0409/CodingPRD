              as: SalesOps
              captures: { subp_b_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_b_id}/activate"
              payload: { expected_subscriber_version: "${sub_b_v}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "C", body_word_count: 400, slug: "c1" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
