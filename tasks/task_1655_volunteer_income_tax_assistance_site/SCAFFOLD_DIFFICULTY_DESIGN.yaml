          assert:
            - "After add(A3=110000) + delete(A3): GET refund-allocations returns exactly 2 rows summing to 200000 — the forward/compensating pair leaves the allocated total unchanged"
            - "TaxReturn.${ret_id}.final_refund_cents == 310000 after submit-for-review"
            - "Transmit with sum 200000 != 310000 fails with ERR_ALLOCATION_SUM_MISMATCH (422)"
            - "After re-adding 110000 (sum == 310000), transmit succeeds: status == TRANSMITTED and submission_count == 1"

