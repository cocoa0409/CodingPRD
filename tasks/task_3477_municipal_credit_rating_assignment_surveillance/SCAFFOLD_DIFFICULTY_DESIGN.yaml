              as: LeadAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /muni/engagements/${eng2}/committee-sessions"
              payload: { start_at: "2026-12-09T10:00:00Z", end_at: "2026-12-09T12:00:00Z", voter_ids: ["voter-1", "voter-2", "voter-3", "voter-4", "voter-5"] }
              as: CommitteeChair
