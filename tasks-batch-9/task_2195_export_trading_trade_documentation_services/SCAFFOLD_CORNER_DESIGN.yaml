      - name: corner_admin_closes_escalated_dispute_and_zeroes_the_three_waterfall_buckets
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /dispute-cases/{dispute_id}/close
          - state_machines.DisputeCase.transitions.ESCALATED_to_CLOSED_NO_SETTLEMENT
          - errors[ERR_DISPUTE_STATE_INVALID]
          - validations.priority_36
        distinguishing_aspect: "Close is declared only from ESCALATED and is PlatformAdmin-exclusive: it must zero receivable_offset_usd, insurance_indemnity_usd and seller_credit_note_usd, leave settlement_amount_usd unset, and then lock the case — a second close and a further counter both fail on the state table, which is how priority 36's ERR_NEGOTIATION_ROUNDS_EXHAUSTED is shown to be dominated by priority 11."
        test_recipe:
          setup:
            - "MAX_NEGOTIATION_ROUNDS is 3, so the fourth counter forces ESCALATED instead of another COUNTERED hop"
            - "order value 25000.00; QUALITY dispute claimed 8000.00, well inside priority 35's bound"
            - "negotiation walk: offer 3000.00, counter 4000.00 (round 1), offer 3500.00, counter 4500.00 (round 2), offer 4000.00, counter 5000.00 (round 3), counter -> ESCALATED"
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Valparaiso Agro SpA", country_code: "CL", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "Port of Oakland", origin_country_code: "US", destination_country_code: "CL", destination_zone: "ZONE_2", ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "orchard irrigation valves", hs_code: "848180", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              captures: { line_id: "$.data.id" }
            - call: "POST /dispute-cases"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { export_order_id: "${order_id}", dispute_type: "QUALITY", claimed_amount_usd: 8000.00 }
              captures: { dispute_id: "$.data.id" }
            - call: "POST /dispute-cases/${dispute_id}/offers"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload: { offer_amount_usd: 3000.00 }
            - call: "POST /dispute-cases/${dispute_id}/counter"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { counter_amount_usd: 4000.00 }
            - call: "POST /dispute-cases/${dispute_id}/offers"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload: { offer_amount_usd: 3500.00 }
            - call: "POST /dispute-cases/${dispute_id}/counter"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { counter_amount_usd: 4500.00 }
            - call: "POST /dispute-cases/${dispute_id}/offers"
              as: FinanceCollectionsOfficer
              as_user_id: "u_fin_frank"
              payload: { offer_amount_usd: 4000.00 }
            - call: "POST /dispute-cases/${dispute_id}/counter"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { counter_amount_usd: 5000.00 }
            - call: "POST /dispute-cases/${dispute_id}/counter"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { counter_amount_usd: 6000.00 }
              captures: { escalated_status: "$.data.status" }
          trigger:
            - call: "POST /dispute-cases/${dispute_id}/close"
              as: PlatformAdmin
              as_user_id: "u_admin_pat"
              payload: { reason: "no commercial agreement reachable after three negotiation rounds" }
              captures: { closed_status: "$.data.status", offset_bucket: "$.data.receivable_offset_usd" }
            - call: "POST /dispute-cases/${dispute_id}/close"
              as: PlatformAdmin
              as_user_id: "u_admin_pat"
              payload: { reason: "duplicate close" }
              captures: { err_second_close: "$.data.error_id" }
            - call: "POST /dispute-cases/${dispute_id}/counter"
              as: ForeignBuyer
              as_user_id: "${buyer_id}"
              payload: { counter_amount_usd: 7000.00 }
              captures: { err_counter: "$.data.error_id" }
          assert:
            - "escalated_status == \"ESCALATED\" with negotiation_round == 3 and current_offer_usd left at 5000.00 by the escalating counter"
            - "the close returns HTTP 200 with data.status == \"CLOSED_NO_SETTLEMENT\""
            - "receivable_offset_usd == 0, insurance_indemnity_usd == 0 and seller_credit_note_usd == 0 after the close"
            - "settlement_amount_usd remains unset — closing is not settling, so no waterfall runs"
            - "ExportOrder.outstanding_receivable_usd is unchanged and settlement_status is still \"UNSECURED\""
            - "the second close returns HTTP 409 with data.error_id == \"ERR_DISPUTE_STATE_INVALID\" — CLOSED_NO_SETTLEMENT is terminal"
            - "the post-close counter also returns HTTP 409 with data.error_id == \"ERR_DISPUTE_STATE_INVALID\": priority 11 fires before priority 36, so ERR_NEGOTIATION_ROUNDS_EXHAUSTED is never the observable code on this path"
