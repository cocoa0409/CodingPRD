          rationale: "Every field of the reimbursement read is asserted with literals by that §1.8 instance."

      - name: terminate_action_releases_the_committed_counters
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /wbl/placements/{placementId}/terminate"]
        excluded_because:
          difficulty_instance: compensating_invariant / terminating_a_placement_releases_every_committed_slot_counter
          rationale: "The terminate action and each counter it decrements are asserted there."

