              as: TerminalOperator
              as_user_id: "${origin_id}"
            - call: "POST /nitrogen-ops/shipments/{id}/deliver"
              payload: { received_tons: 20 }
              as: TerminalOperator
              as_user_id: "${dest_id}"
          assert:
