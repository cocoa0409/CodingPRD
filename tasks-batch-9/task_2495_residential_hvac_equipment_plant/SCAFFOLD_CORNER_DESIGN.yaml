      - name: c_clock_set_endpoint_moves_stamp_for_subsequent_writes
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - endpoints.POST_/plant/warehouses
        distinguishing_aspect: "Every stored timestamp comes from the logical clock, never wall time: a warehouse created before any clock call is stamped at the 2026-08-01T00:00:00Z default, and one created after the clock is moved is stamped at 2026-12-24T09:15:00Z."
        test_recipe:
          setup:
            - "Empty database with the logical clock never set, so it sits at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /plant/warehouses"
              payload: { name: "WH-BEFORE", pallet_capacity: 40 }
              as: PlantAdmin
              captures: { wh_before_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-24T09:15:00Z" }
              as: PlantAdmin
            - call: "POST /plant/warehouses"
              payload: { name: "WH-AFTER", pallet_capacity: 40 }
              as: PlantAdmin
              captures: { wh_after_id: $.data.id }
          assert:
            - "Warehouse.${wh_before_id}.created_at == \"2026-08-01T00:00:00Z\" - the default clock, not the host wall clock"
            - "Warehouse.${wh_after_id}.created_at == \"2026-12-24T09:15:00Z\""
            - "Warehouse.${wh_before_id}.updated_at == \"2026-08-01T00:00:00Z\" - moving the clock does not restamp existing rows"
            - "Both warehouses report pallets_reserved_current == 0"

      - name: c_component_supply_allocation_lines_sub_resource_lists_lines
