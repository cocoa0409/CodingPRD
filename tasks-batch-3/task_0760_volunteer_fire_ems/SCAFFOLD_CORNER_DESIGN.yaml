# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across §1.1-§1.7 surface. Clock default 2026-03-01T00:00:00Z.
# Same 7-point per-instance contract as §1.8. `name`s are unique across both files.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: corner_member_create_success
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with required fields returns 201 with membership_status PROBATIONARY, points_ytd 0, response_eligible false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { full_name: "Jane Doe", email: "jane@x.com", role_class: "FIREFIGHTER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { m_id: "$.data.id" } }
          assert:
            - "HTTP 201; Member.${m_id}.membership_status == PROBATIONARY"
            - "Member.${m_id}.points_ytd == 0 AND Member.${m_id}.response_eligible == false AND Member.${m_id}.version == 1"

      - name: corner_member_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{nonexistent} returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /members/00000000-0000-4000-8000-000000000000", payload: {}, as: Chief }
          assert:
            - "HTTP 404; data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: corner_member_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Member.fields.role_class, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /members omitting role_class returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { full_name: "No Role", email: "norole@x.com", join_date: "2026-01-01T00:00:00Z" }, as: Chief }
          assert:
            - "HTTP 400; data.error_id == ERR_VALIDATION"

      - name: corner_member_bad_enum_role_class
        claim_type: Type Constraints
        grounds: [entities.Member.fields.role_class, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /members with role_class not in the enum returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { full_name: "Bad Enum", email: "bad@x.com", role_class: "CAPTAIN", join_date: "2026-01-01T00:00:00Z" }, as: Chief }
          assert:
            - "HTTP 400; data.error_id == ERR_VALIDATION"

      - name: corner_member_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "Client-supplied id/version/points_ytd on create are ignored; server mints id (UUID, no prefix), version 1, points_ytd 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { full_name: "Sys F", email: "sysf@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { m_id: "$.data.id" } }
          assert:
            - "Member.${m_id}.version == 1 AND Member.${m_id}.points_ytd == 0 (server-generated)"

      - name: corner_duty_shift_end_before_start
        claim_type: Type Constraints
        grounds: [entities.DutyShift.fields.end_at, "validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /duty-shifts with end_at <= start_at returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["a station + apparatus exist"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Z", email: "offz@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SZ" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-Z", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
          trigger:
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-06-01T18:00:00Z", end_at: "2026-06-01T06:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 400; data.error_id == ERR_VALIDATION"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: corner_cancel_shift_from_terminal_invalid
        claim_type: Terminal State Lockdown
        grounds: [state_machines.DutyShift.PUBLISHED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED DutyShift returns ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["a DRAFT shift then cancelled"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off T", email: "offt@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "ST" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-T", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-06-01T06:00:00Z", end_at: "2026-06-01T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh_id: "$.data.id" } }
            - { call: "POST /duty-shifts/${sh_id}/cancel", payload: {}, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "POST /duty-shifts/${sh_id}/cancel", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: corner_incident_arrive_from_dispatched_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Incident.response_ENROUTE_to_response_ONSCENE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /arrive while response_status==DISPATCHED (skipping ENROUTE) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a DISPATCHED incident"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off I", email: "offi@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SI" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-I", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "EMS", alarm_at: "2026-03-02T00:00:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
          trigger:
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: corner_report_before_clear_invalid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Incident.report_NONE_to_report_DRAFT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Creating an NFIRS report draft before response_status==CLEARED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["an incident at ONSCENE (not yet cleared)"]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off R", email: "offr@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SR" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-R", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "EMS", alarm_at: "2026-03-02T00:00:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "POST /incidents/${inc_id}/report", payload: { nfirs_property_use: "419", nfirs_actions_taken: "11" }, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: corner_refund_when_campaign_closed_invalid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Donation.POSTED_to_REFUNDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Refunding a donation whose campaign is CLOSED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CLOSED campaign with one POSTED donation"]
          setup_api_calls:
            - { call: "POST /campaigns", payload: { name: "Gala", goal_cents: 50000 }, as: Chief, captures: { cmp_id: "$.data.id" } }
            - { call: "POST /campaigns/${cmp_id}/open", payload: {}, as: Chief }
            - { call: "POST /campaigns/${cmp_id}/donations", payload: { donor_name: "C", amount_cents: 4000 }, as: Chief, captures: { d_id: "$.data.id" } }
            - { call: "POST /campaigns/${cmp_id}/close", payload: {}, as: Chief }
          trigger:
            - { call: "POST /donations/${d_id}/refund", payload: {}, as: Chief }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: corner_donation_when_campaign_draft_invalid
        claim_type: Precondition Enforcement
        grounds: [state_machines.FundraisingCampaign.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recording a donation on a DRAFT (never opened) campaign returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT campaign"]
          setup_api_calls:
            - { call: "POST /campaigns", payload: { name: "Draft Camp", goal_cents: 50000 }, as: Chief, captures: { cmp_id: "$.data.id" } }
          trigger:
            - { call: "POST /campaigns/${cmp_id}/donations", payload: { donor_name: "D", amount_cents: 4000 }, as: Chief }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

  # -------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: corner_duty_points_12h_shift
        claim_type: Correct Result
        grounds: [calculations.duty_points, entities.DutyAssignment.fields.duty_points]
        distinguishing_aspect: "A checked-in 12h shift verified on sweep yields duty_points = max(round_half_up(12*0.5),2) = 6."
        test_recipe:
          setup: ["Eligible EMT member checked into a 12h shift; sweep past end."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off D", email: "offd@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M Duty", email: "mduty@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c_id}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m_id}/activate", payload: {}, as: Chief }
            - { call: "POST /stations", payload: { name: "SD" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "MEDIC-D", apparatus_type: "AMBULANCE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-03-05T06:00:00Z", end_at: "2026-03-05T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh_id: "$.data.id", sh_v: "$.data.version" } }
            - { call: "POST /duty-shifts/${sh_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m_id}", expected_duty_shift_version: "${sh_v}" }, as: Officer, as_user_id: "${off_id}", captures: { a_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T06:05:00Z" }, as: Chief }
            - { call: "POST /duty-assignments/${a_id}/check-in", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T18:05:00Z" }, as: Chief }
          trigger:
            - { call: "POST /duty-shifts/sweep", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "GET /duty-assignments/${a_id}", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "DutyAssignment.${a_id}.status == VERIFIED AND DutyAssignment.${a_id}.duty_points == 6"
            - "Member.${m_id}.points_ytd == 6"

      - name: corner_apparatus_posture_reserve_on_noncritical
        claim_type: Correct Result
        grounds: [calculations.apparatus_posture, entities.Apparatus.fields.posture]
        distinguishing_aspect: "A non-critical Equipment set OUT_OF_SERVICE moves Apparatus.posture to RESERVE (not OUT_OF_SERVICE)."
        test_recipe:
          setup: ["Apparatus with one non-critical Equipment"]
          setup_api_calls:
            - { call: "POST /stations", payload: { name: "SRes" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-Res", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /apparatus/${ap_id}/equipment", payload: { name: "Spare Hose", is_critical: false }, as: Chief, captures: { eq_id: "$.data.id" } }
          trigger:
            - { call: "POST /equipment/${eq_id}/out-of-service", payload: {}, as: Chief }
            - { call: "GET /apparatus/${ap_id}", payload: {}, as: Chief }
          assert:
            - "Apparatus.${ap_id}.posture == RESERVE"

  # --------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: corner_apparatus_not_at_station_on_shift
        claim_type: Cross-entity validation
        grounds: ["validations[priority=7]", "errors[ERR_APPARATUS_NOT_AT_STATION]"]
        distinguishing_aspect: "Creating a duty shift with apparatus_id belonging to a different station returns ERR_APPARATUS_NOT_AT_STATION (409)."
        test_recipe:
          setup: ["Station A with apparatus AP; Station B empty."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Ref", email: "offref@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SA" }, as: Chief, captures: { sta: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SB" }, as: Chief, captures: { stb: "$.data.id" } }
            - { call: "POST /stations/${sta}/apparatus", payload: { unit_designation: "ENGINE-A", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
          trigger:
            - { call: "POST /duty-shifts", payload: { station_id: "${stb}", apparatus_id: "${ap_id}", start_at: "2026-06-01T06:00:00Z", end_at: "2026-06-01T18:00:00Z", max_crew: 4, min_crew: 1 }, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 409; data.error_id == ERR_APPARATUS_NOT_AT_STATION"

      - name: corner_shift_full_on_assignment
        claim_type: Aggregate validation
        grounds: ["validations[priority=9]", "errors[ERR_SHIFT_FULL]", calculations.shift_staffing]
        distinguishing_aspect: "Assigning a member to a shift already at max_crew (1) returns ERR_SHIFT_FULL (409)."
        test_recipe:
          setup: ["Two eligible members; a PUBLISHED shift with max_crew 1 already holding member1."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off Full", email: "offfull@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /members", payload: { full_name: "M One", email: "mone@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m1: "$.data.id" } }
            - { call: "POST /members/${m1}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /members/${m1}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c1}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m1}/activate", payload: {}, as: Chief }
            - { call: "POST /members", payload: { full_name: "M Two", email: "mtwo@x.com", role_class: "EMT", join_date: "2026-01-01T00:00:00Z", dues_balance_cents: 0 }, as: Chief, captures: { m2: "$.data.id" } }
            - { call: "POST /members/${m2}/certifications", payload: { cert_type: "EMT_BASIC", category: "EMS" }, as: Officer, as_user_id: "${off_id}", captures: { c2: "$.data.id" } }
            - { call: "POST /members/${m2}/training-records", payload: { category: "EMS", hours: 20, training_date: "2026-03-01T00:00:00Z" }, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /certifications/${c2}/issue", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /members/${m2}/activate", payload: {}, as: Chief }
            - { call: "POST /stations", payload: { name: "SF" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "MEDIC-F", apparatus_type: "AMBULANCE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /duty-shifts", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", start_at: "2026-06-05T06:00:00Z", end_at: "2026-06-05T18:00:00Z", max_crew: 1, min_crew: 1 }, as: Officer, as_user_id: "${off_id}", captures: { sh_id: "$.data.id", sh_v: "$.data.version" } }
            - { call: "POST /duty-shifts/${sh_id}/publish", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m1}", expected_duty_shift_version: "${sh_v}" }, as: Officer, as_user_id: "${off_id}", captures: { sh_v2: "$.data.duty_shift_id" } }
            - { call: "GET /duty-shifts/${sh_id}", payload: {}, as: Officer, as_user_id: "${off_id}", captures: { sh_vnow: "$.data.version" } }
          trigger:
            - { call: "POST /duty-shifts/${sh_id}/assignments", payload: { member_id: "${m2}", expected_duty_shift_version: "${sh_vnow}" }, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 409; data.error_id == ERR_SHIFT_FULL"

      - name: corner_nfirs_incomplete_on_lock
        claim_type: Conditional validation
        grounds: ["validations[priority=9]", "errors[ERR_NFIRS_INCOMPLETE]", state_machines.Incident.report_DRAFT_to_report_LOCKED]
        distinguishing_aspect: "Locking a report whose draft has no nfirs_property_use/nfirs_actions_taken returns ERR_NFIRS_INCOMPLETE (422)."
        test_recipe:
          setup: ["A cleared incident with a report draft missing NFIRS fields."]
          setup_api_calls:
            - { call: "POST /members", payload: { full_name: "Off N", email: "offn@x.com", role_class: "OFFICER", join_date: "2026-01-01T00:00:00Z" }, as: Chief, captures: { off_id: "$.data.id" } }
            - { call: "POST /stations", payload: { name: "SN" }, as: Chief, captures: { st_id: "$.data.id" } }
            - { call: "POST /stations/${st_id}/apparatus", payload: { unit_designation: "ENGINE-N", apparatus_type: "ENGINE", min_crew: 1 }, as: Chief, captures: { ap_id: "$.data.id" } }
            - { call: "POST /incidents", payload: { station_id: "${st_id}", apparatus_id: "${ap_id}", incident_type: "ALARM", alarm_at: "2026-03-02T00:00:00Z" }, as: Officer, as_user_id: "${off_id}", captures: { inc_id: "$.data.id" } }
            - { call: "POST /incidents/${inc_id}/enroute", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/arrive", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/clear", payload: {}, as: Officer, as_user_id: "${off_id}" }
            - { call: "POST /incidents/${inc_id}/report", payload: {}, as: Officer, as_user_id: "${off_id}" }
          trigger:
            - { call: "POST /incidents/${inc_id}/report/lock", payload: {}, as: Officer, as_user_id: "${off_id}" }
          assert:
            - "HTTP 422; data.error_id == ERR_NFIRS_INCOMPLETE"

      - name: corner_dues_overdue_isolated
        claim_type: Violation to Error
        grounds: ["validations[priority=10]", "errors[ERR_DUES_OVERDUE]"]
        distinguishing_aspect: "An otherwise-eligible ACTIVE member with dues_balance_cents=2500 is rejected on assignment with ERR_DUES_OVERDUE (402) — safety passes, fiscal fails."
        test_recipe:
          setup: ["Eligible ACTIVE member with dues_balance_cents=2500; a PUBLISHED shift."]
          setup_api_calls:
