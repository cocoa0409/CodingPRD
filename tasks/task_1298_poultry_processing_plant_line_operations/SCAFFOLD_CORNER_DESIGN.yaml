# =============================================================================
# SCAFFOLD_CORNER_DESIGN — poultry plant line operations (§1.9)
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_line_returns_201_with_stored_fields
        claim_type: creation
        grounds: ["endpoints[POST /poultry/lines]", "entities.ProcessingLine"]
        distinguishing_aspect: "Creating a line returns 201 with all input fields echoed, system id/created_at, and version 1."
        test_recipe:
          setup: ["empty database; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-9", line_type: "EVISCERATION", rated_speed_bpm: 180 }, as: PlantManager, captures: { l9: $.data.id, v9: $.data.version } }
          assert:
            - "response code 201; ProcessingLine.${l9}.line_code == 'EV-9', line_type == EVISCERATION, rated_speed_bpm == 180"
            - "${v9} == 1 and created_at == 2026-08-01T00:00:00Z (logical clock default)"

      - name: shift_create_applies_zero_staffing_defaults
        claim_type: defaults
        grounds: ["entities.ProductionShift.fields.shacklers_present", "endpoints[POST /poultry/shifts]"]
        distinguishing_aspect: "Shift creation omits staffing inputs entirely; all four staffing counts default to 0 and status defaults to SCHEDULED with suspend_reason NONE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "NIGHT", shackle_capacity_birds: 5000, labor_hours_budget: 20.0 }, as: PlantManager, captures: { s9: $.data.id } }
          assert:
            - "Shift.${s9}: shacklers_present == 0, eviscerators_present == 0, deboners_present == 0, qa_techs_present == 0"
            - "status == SCHEDULED, suspend_reason == NONE, process_water_gallons == 0, chiller_water_gallons == 0, birds_processed == 0, labor_hours_remaining == 20.0"

      - name: get_missing_order_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /poultry/orders/{id}]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND with the error envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /poultry/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: OrderPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND and http status == 404"

      - name: order_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.ProductOrder.fields.temperature_requirement", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "temperature_requirement 'LUKEWARM' is not in {FRESH, FROZEN, FLEXIBLE} and is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /poultry/orders", payload: { customer_name: "C", product_code: "WINGS", pounds_ordered: 10.0, temperature_requirement: "LUKEWARM", due_at: "2026-08-03T00:00:00Z" }, as: OrderPlanner, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST and http status == 400"

      - name: flock_create_with_extra_field_rejected
        claim_type: required_fields
        grounds: ["endpoints[POST /poultry/flock-lots]", "entities.FlockLot"]
        distinguishing_aspect: "A client-supplied 'status' key (a computed field) is not in the endpoint input schema and is rejected 400 ERR_INVALID_REQUEST — computed/system fields are not settable."
        test_recipe:
          setup: ["shift exists to reference"]
          setup_api_calls:
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-X", grower_name: "G", booked_head_count: 100, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}", status: "SETTLED" }, as: ReceivingClerk, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (unknown/computed field rejected)"

      - name: utility_reading_immutable_event_no_version
        claim_type: immutability
        grounds: ["entities.UtilityMeterReading", "endpoints[GET /poultry/shifts/{id}/utility-readings]"]
        distinguishing_aspect: "UtilityMeterReading has common_fields false: response carries id + created_at but no version/updated_at, and the record is retrievable via the shift sub-resource."
        test_recipe:
          setup: ["shift exists"]
          setup_api_calls:
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/utility-readings", payload: { shift_id: "${s1}", meter_type: "CHILLER_WATER", gallons: 250.5 }, as: QATechnician, captures: { u1: $.data.id } }
          trigger:
            - { call: "GET /poultry/shifts/${s1}/utility-readings", as: QATechnician, payload: { meter_type: "CHILLER_WATER" } }
          assert:
            - "list contains reading ${u1} with gallons == 250.5, meter_type == CHILLER_WATER, recorded_at == 2026-08-01T00:00:00Z"
            - "reading object has id and created_at but no version field (append-only event)"

  - section: state_machines
    instances:
      - name: sanitation_failed_recheck_rewash_cycle
        claim_type: valid_transition
        grounds: ["state_machines.SanitationRun.COMPLETED_to_FAILED_RECHECK", "state_machines.SanitationRun.FAILED_RECHECK_to_IN_PROGRESS"]
        distinguishing_aspect: "Cyclic sanitation shape: COMPLETED -> FAILED_RECHECK -> IN_PROGRESS -> COMPLETED -> VERIFIED, with verifier_user_id recorded at the recheck."
        test_recipe:
          setup: ["line EV-1 and shift exist; sanitation run created"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
          trigger:
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "FAILED_RECHECK" }, as: QATechnician, as_user_id: "qa-1", captures: { st_fail: $.data.status } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1", captures: { st_rewash: $.data.status } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1", captures: { st_ver: $.data.status } }
          assert:
            - "cycle traversed: ${st_fail} == FAILED_RECHECK, ${st_rewash} == IN_PROGRESS, ${st_ver} == VERIFIED (terminal)"
            - "SanitationRun.${sr1}.completer_user_id == 'san-1' and verifier_user_id == 'qa-1'"

      - name: preop_failed_correcting_pending_cycle_count
        claim_type: valid_transition
        grounds: ["state_machines.PreOpInspection.FAILED_to_CORRECTING", "state_machines.PreOpInspection.CORRECTING_to_PENDING", "entities.PreOpInspection.fields.cycle_count"]
        distinguishing_aspect: "Pre-op re-inspection cycle PENDING -> FAILED -> CORRECTING -> PENDING -> PASSED with cycle_count incremented to 1 on the return to PENDING."
        test_recipe:
          setup: ["line EV-1, shift; sanitation VERIFIED for (shift,line) so PASSED is reachable"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
          trigger:
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "FAILED", findings: "debris on shackle line" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "CORRECTING" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PENDING" }, as: QATechnician, as_user_id: "qa-2", captures: { cyc: $.data.cycle_count } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2", captures: { st_pass: $.data.status } }
          assert:
            - "cycle_count == 1 after CORRECTING -> PENDING: ${cyc} == 1"
            - "re-inspection passes: ${st_pass} == PASSED"

      - name: sanitation_advance_from_verified_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.SanitationRun", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "VERIFIED is terminal for sanitation: a further advance is rejected with ERR_INVALID_STATE_TRANSITION and no state change."
        test_recipe:
          setup: ["sanitation run fully VERIFIED"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
          trigger:
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION (terminal lockdown)"
            - "SanitationRun.${sr1}.status == VERIFIED unchanged"

      - name: flock_settle_reopen_resettle_cycle
        claim_type: valid_transition
        grounds: ["state_machines.FlockLot.CHILLED_to_SETTLED", "state_machines.FlockLot.SETTLED_to_REOPENED", "state_machines.FlockLot.REOPENED_to_SETTLED"]
        distinguishing_aspect: "Lot regrade cycle: CHILLED -> SETTLED -> REOPENED -> SETTLED; each settle recomputes certified_yield_pct and refreshes settled_at."
        test_recipe:
          setup: ["EV-1; shift RUNNING fully staffed; lot run completed 9950/36000 zero records (auto-reconciled); clock advanced +4h so lot is CHILLED"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: PlantManager }
          trigger:
            - { call: "POST /poultry/flock-lots/${f1}/advance", payload: { to_status: "SETTLED" }, as: ShiftSupervisor, captures: { st1: $.data.status, y1: $.data.certified_yield_pct } }
            - { call: "POST /poultry/flock-lots/${f1}/advance", payload: { to_status: "REOPENED" }, as: USDAInspector, as_user_id: "usda-1", captures: { st2: $.data.status } }
            - { call: "POST /poultry/flock-lots/${f1}/advance", payload: { to_status: "SETTLED" }, as: ShiftSupervisor, captures: { st3: $.data.status, y3: $.data.certified_yield_pct } }
          assert:
            - "cycle: ${st1} == SETTLED, ${st2} == REOPENED, ${st3} == SETTLED"
            - "yield at both settles identical with zero condemnations: ${y1} == 72.0 and ${y3} == 72.0"

      - name: finished_lot_ship_twice_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.FinishedLot.TRACE_LOCKED_to_SHIPPED", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "SHIPPED is terminal for shipping: advancing to SHIPPED twice fails the second time with ERR_INVALID_STATE_TRANSITION (recall remains the only exit)."
        test_recipe:
          setup: ["full production chain: lot settled (yield 72.0), FROZEN order, batch completed, finished lot TRACE_LOCKED then SHIPPED"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/lines", payload: { line_code: "DB-1", line_type: "DEBONING", rated_speed_bpm: 50 }, as: PlantManager, captures: { l2: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: PlantManager }
            - { call: "POST /poultry/orders", payload: { customer_name: "CustX", product_code: "WINGS", pounds_ordered: 500.0, temperature_requirement: "FROZEN", due_at: "2026-08-03T00:00:00Z" }, as: OrderPlanner, captures: { o1: $.data.id } }
            - { call: "POST /poultry/deboning-batches", payload: { order_id: "${o1}", flock_lot_id: "${f1}", shift_id: "${s1}", line_id: "${l2}", crew_count: 12, input_weight_lb: 1000.0 }, as: ShiftSupervisor, captures: { b1: $.data.id } }
            - { call: "POST /poultry/deboning-batches/${b1}/advance", payload: { to_status: "IN_PROGRESS" }, as: LineOperator }
            - { call: "POST /poultry/deboning-batches/${b1}/advance", payload: { to_status: "COMPLETED", actual_output_weight_lb: 980.0, actual_labor_hours: 2.0 }, as: LineOperator }
            - { call: "GET /poultry/finished-lots", as: QATechnician, captures: { fl1: "$.data[0].id" } }
            - { call: "POST /poultry/finished-lots/${fl1}/trace-lock", as: QATechnician, payload: {} }
            - { call: "POST /poultry/finished-lots/${fl1}/advance", payload: { to_status: "SHIPPED" }, as: ShiftSupervisor }
          trigger:
            - { call: "POST /poultry/finished-lots/${fl1}/advance", payload: { to_status: "SHIPPED" }, as: ShiftSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION; FinishedLot.${fl1}.status remains SHIPPED"

      - name: finished_lot_recall_after_ship
        claim_type: valid_transition
        grounds: ["state_machines.FinishedLot.SHIPPED_to_RECALLED"]
        distinguishing_aspect: "Recall remains legal from SHIPPED (terminal for shipping but not for the record): SHIPPED -> RECALLED with reason succeeds for QATechnician."
        test_recipe:
          setup: ["finished lot SHIPPED (same chain as ship-twice instance)"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/lines", payload: { line_code: "DB-1", line_type: "DEBONING", rated_speed_bpm: 50 }, as: PlantManager, captures: { l2: $.data.id } }
