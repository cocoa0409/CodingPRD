  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_slot_turnover_buffer_overlap
        grounds:
          - calculations.slot_fit_and_overlap
          - errors[ERR_VENUE_OVERLAP]
        distinguishing_aspect: |
          Venue resource with half-open intervals plus a 30-minute turnover
          buffer on BOTH neighbors: a slot starting exactly at
          prior_end + turnover (19:30 after a 17:00-19:00 slot) is legal, one
          minute earlier (19:29) conflicts; symmetric 16:00-16:30 adjacency
          before the existing slot is legal — geometric buffer semantics.
        test_recipe:
          setup:
            - "Edition SETUP (grid building is phase-free); venue 'Eccles' turnover_minutes 30; one existing OPEN slot 2027-01-22T17:00-19:00"
          setup_api_calls:
            - { call: "POST /festival/editions", payload: { year: 2027, host_country_code: "US", intake_open_at: "2026-08-01T00:00:00Z", early_deadline_at: "2026-08-15T00:00:00Z", regular_deadline_at: "2026-09-01T00:00:00Z", late_deadline_at: "2026-09-15T00:00:00Z", rsvp_window_days: 7, festival_start_at: "2027-01-21T00:00:00Z", festival_end_at: "2027-02-01T00:00:00Z", hotel_nights_pool: 10, travel_budget_cents: 400000, prize_pool_cents: 5000000 }, as: FESTIVAL_ADMIN, captures: { ed: $.data.id } }
            - { call: "POST /festival/venues", payload: { edition_id: "${ed}", name: "Eccles", seat_capacity: 500, formats_supported: [DCP_2K], turnover_minutes: 30 }, as: FESTIVAL_ADMIN, captures: { ven: $.data.id, vv1: $.data.version } }
            - { call: "POST /festival/screening-slots", payload: { venue_id: "${ven}", slot_type: PUBLIC, start_at: "2027-01-22T17:00:00Z", end_at: "2027-01-22T19:00:00Z", expected_venue_version: "${vv1}" }, as: SCHEDULING_OPS, captures: { slot1: $.data.id } }
            - { call: "GET /festival/venues/${ven}", payload: {}, as: SCHEDULING_OPS, captures: { vv2: $.data.version } }
          trigger:
            - { call: "POST /festival/screening-slots", payload: { venue_id: "${ven}", slot_type: PUBLIC, start_at: "2027-01-22T19:30:00Z", end_at: "2027-01-22T21:00:00Z", expected_venue_version: "${vv2}" }, as: SCHEDULING_OPS, captures: { slot2: $.data.id } }
            - { call: "GET /festival/venues/${ven}", payload: {}, as: SCHEDULING_OPS, captures: { vv3: $.data.version } }
            - { call: "POST /festival/screening-slots", payload: { venue_id: "${ven}", slot_type: PUBLIC, start_at: "2027-01-22T19:29:00Z", end_at: "2027-01-22T20:30:00Z", expected_venue_version: "${vv3}" }, as: SCHEDULING_OPS, captures: { err: $.data.error_id } }
            - { call: "GET /festival/venues/${ven}", payload: {}, as: SCHEDULING_OPS, captures: { vv4: $.data.version } }
            - { call: "POST /festival/screening-slots", payload: { venue_id: "${ven}", slot_type: PUBLIC, start_at: "2027-01-22T16:00:00Z", end_at: "2027-01-22T16:30:00Z", expected_venue_version: "${vv4}" }, as: SCHEDULING_OPS, captures: { slot4: $.data.id } }
          assert:
            - "19:30-21:00 accepted: 19:00 + 30min <= 19:30 (exact buffer adjacency is legal)"
            - "19:29-20:30 rejected: err == ERR_VENUE_OVERLAP (one minute inside the buffer)"
            - "16:00-16:30 accepted: 16:30 + 30min <= 17:00 (symmetric leading-edge adjacency)"
            - "rejected create leaves venue.version unchanged (still ${vv3} at the following GET)"

      - name: hotel_pool_aggregate_capacity_clamp
        grounds:
          - calculations.hotel_night_allocation
          - entities.FestivalEdition.fields.hotel_nights_remaining
        distinguishing_aspect: |
          Different resource and different interval semantics than the venue
          case: the edition hotel pool is pure aggregate capacity — approving a
          package requesting 5 nights with only 4 remaining CLAMPS allocation
          to 4 (no error, no geometry), demonstrating aggregate-capacity rather
          than interval-overlap semantics.
