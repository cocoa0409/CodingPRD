              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB140-P01", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB140-P02", frontage_feet: 400, usage_class: "SEASONAL", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p2_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB140-P03", frontage_feet: 40, usage_class: "UNDEVELOPED", trips_per_day: 1, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p3_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB140-P01", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p2_id}", owner_name: "Bo Nakamura", deed_book_page: "DB140-P02", deed_recorded_date: "2020-06-03" }
              as: AssociationSecretary
              captures: { m2_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p3_id}", owner_name: "Cyd Okonjo", deed_book_page: "DB140-P03", deed_recorded_date: "2021-02-18" }
              as: AssociationSecretary
              captures: { m3_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB140-P01" }
              as: AssociationSecretary
            - call: "POST /members/${m2_id}/verify-deed"
              payload: { verified_deed_book_page: "DB140-P02" }
              as: AssociationSecretary
            - call: "POST /members/${m3_id}/verify-deed"
              payload: { verified_deed_book_page: "DB140-P03" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 200000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
