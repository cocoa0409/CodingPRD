            - call: "POST /_intervals/seed-historic"
              payload: { leave_case_id: "${caseQB_id}", start_datetime: "2026-02-01T00:00:00.000Z", end_datetime: "2026-04-30T00:00:00.000Z", hours_taken: 479, fmla_hours_charged: 479, pfl_hours_charged: 0 }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseQB_id}", start_datetime: "2026-06-01T00:00:00.000Z", end_datetime: "2026-06-01T01:00:00.000Z", hours_taken: 1 }
