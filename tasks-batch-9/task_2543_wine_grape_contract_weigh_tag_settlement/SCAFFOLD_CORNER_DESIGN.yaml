  # ===========================================================================
  # SECTION 5 — Endpoints (claim-extraction-guide "From Table 5")
  # §1.5 declares no bulk-action endpoint, so the "Bulk action" row of the guide
  # has no instance: there is nothing in the surface to probe.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: settlement_summary_reconciles_tonnage_and_money_before_and_after_the_close
        claim_type: Computed read
        grounds:
          - endpoints[GET /grower-relations/grape-contracts/{contractId}/settlement-summary]
          - calculations.net_payable_derivation
          - entities.GrapeContract.provisional_settlement_cents
        distinguishing_aspect: |
          The summary is a pure derived read over sixteen fields and it must be correct at
          THREE different moments. The trap is provisional_settlement_cents: it is defined as
          the sum over lines with status PROVISIONAL, so the settlement close — which flips
          every line to FINAL — must drive it to 0 while final_settlement_cents takes over. An
          implementation that treats it as a historical total reports 5,400,000 forever and the
          two money columns stop reconciling. The third read proves the installment columns
          track payments, not the plan.
        test_recipe:
          setup:
            - "One clean 20.000-net-ton load on a 40.000-t TONNAGE contract at 450000 cents/ton with a 50/50 lien-protected installment plan; graded but not yet closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: GrowerRelationsManager
