# =============================================================================
# PRD Benchmark Scaffold — task_2926_officiating_development_performance_grading
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================
scenario: |
  2926. Officiating Development & Performance Grading (professional league officiating department): official recruitment pipeline from lower levels with evaluation and advancement criteria, crew assignment balancing experience, conflicts and travel with rotation across teams, play-by-play grading against rulebook standards with video review and appeal by officials, accuracy metrics feeding postseason assignment eligibility and retention decisions, training programs including rules clinics, physical standards and preseason testing, replay center operations with reviewable play categories and decision timelines, public accountability with pool reports and rules clarifications, discipline and remediation for performance or conduct issues

domain_name: "officiating-development-grading"
api_prefix: "/"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: multi_party_negotiation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Fourteen peer entities linked by explicit foreign keys. Only two child
    collections are exposed as sub-resources (FieldEvaluation under an
    AdvancementApplication, TrainingRecord under an Official) because those two
    are append-only evidence logs owned by exactly one parent; every other
    relationship is discovered through a flat filtered-list GET carrying the FK
    as a query parameter. No business resource is nested more than one level.

  state_machine_shape: parallel
  state_machine_shape_note: |
    PlayGrade carries two independent state dimensions on the same row
    (`grade_status` DRAFT/POSTED/FINAL and `appeal_state`
    NOT_APPEALED/APPEAL_PENDING/APPEAL_RESOLVED) with one cross-dimension guard.
    AdvancementApplication and DisciplineAction are cyclic (committee return
    loop; remediation reassessment loop). Game is a linear pipeline whose
    `crew_posture` is a derived gate over CrewAssignment children.

  relationship_patterns:
    - one_to_many
    - self_referential      # PoolReport.supersedes_id -> PoolReport.id
    - cross_aggregate       # PlayGrade spans Game and Official aggregates
    - polymorphic_free      # no polymorphic FK is used; every FK names one parent entity

  role_model: segregation_of_duties
  role_model_note: |
    Eight roles. The GradingSupervisor who authored a PlayGrade
    (`PlayGrade.graded_by_user_id`) may never decide the GradeAppeal against it;
    crew scheduling, grading, appeal adjudication, training certification,
    replay adjudication and public communication are each owned by a distinct
    role, and the Official role may only act on its own records.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: SeasonProgram
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: "Officiating season the program governs"
        constraints: "1900..2999; unique across SeasonProgram"
      - name: status
        type: enum
        source: system
        description: "Program lifecycle gate for every child mutation"
        default: CONFIGURING
        constraints: "CONFIGURING | OPEN | POSTSEASON_LOCKED"
      - name: accuracy_eligibility_threshold
        type: number
        source: input
        description: "Minimum accuracy_index (inclusive) for accuracy_eligible"
        default: 95.00
        constraints: "0.00..100.00, 2 decimals"
      - name: min_graded_plays_for_eligibility
        type: integer
        source: input
        description: "Minimum graded_play_count (inclusive) for accuracy_eligible"
        default: 3
        constraints: ">= 0"
      - name: appeal_credits_per_official
        type: integer
        source: input
        description: "Season quota of grade appeals granted to each Official"
        default: 3
        constraints: ">= 0"
      - name: appeal_window_hours
        type: integer
        source: input
        description: "Hours after PlayGrade.posted_at during which an appeal may be filed"
        default: 72
        constraints: "> 0"
      - name: replay_decision_limit_seconds
        type: integer
        source: input
        description: "Seconds allowed between ReplayReview.window_open_utc and a decision"
        default: 120
        constraints: "> 0"
      - name: reviewable_categories
        type: array
        source: input
        description: "ReplayReview.category values the replay center may open a review for"
        default: ["SCORING_PLAY", "TURNOVER", "PLAYER_SAFETY"]
        constraints: "non-empty subset of {SCORING_PLAY, TURNOVER, PLAYER_SAFETY, GAME_ADMIN}"
      - name: max_team_exposures_per_season
        type: integer
        source: input
        description: "Maximum non-released assignments one Official may hold against any single team code"
        default: 2
        constraints: "> 0"
      - name: min_rest_hours_between_games
        type: integer
        source: input
        description: "Rest hours appended to an assignment occupancy window after the game ends"
        default: 96
        constraints: ">= 0"
      - name: travel_lead_hours
        type: integer
        source: input
        description: "Travel hours prepended to an assignment occupancy window before kickoff"
        default: 24
        constraints: ">= 0"
      - name: crew_size_required
        type: integer
        source: input
        description: "CONFIRMED assignment count a Game needs before crew_posture becomes STAFFED"
        default: 2
        constraints: "> 0"
      - name: max_application_returns
        type: integer
        source: input
        description: "Committee returns an AdvancementApplication may absorb before auto-denial"
        default: 2
        constraints: ">= 0"
      - name: physical_test_min_score
        type: number
        source: input
        description: "Minimum PHYSICAL_TEST score (inclusive) that counts as passed"
        default: 70.00
        constraints: "0.00..100.00, 2 decimals"
      - name: exam_min_score
        type: number
        source: input
        description: "Minimum RULES_EXAM score (inclusive) that counts as passed"
        default: 80.00
        constraints: "0.00..100.00, 2 decimals"
      - name: clinic_attendance_required
        type: integer
        source: input
        description: "RULES_CLINIC records an Official needs to avoid a training deficiency"
        default: 1
        constraints: ">= 0"
      - name: eligible_official_count
        type: integer
        source: computed
        description: "Count of OfficialSeasonRecord rows with postseason_eligible true; recomputed by the postseason lock"
        default: 0

  - name: Official
    parent: null
    common_fields: true
    fields:
      - name: season_program_id
        type: string
        source: input
        description: "FK -> SeasonProgram.id; the season this official is carried under"
      - name: full_name
        type: string
        source: input
        description: "Official's display name"
        constraints: "1..120 chars, non-blank"
      - name: position
        type: enum
        source: input
        description: "On-field position the official works"
        constraints: "REFEREE | UMPIRE | DOWN_JUDGE"
      - name: tier
        type: enum
        source: input
        description: "Pipeline level; raised one step by an approved AdvancementApplication"
        default: TIER_3
        constraints: "TIER_3 | TIER_2 | TIER_1"
      - name: seasons_experience
        type: integer
        source: input
        description: "Completed seasons of officiating experience at any level"
        constraints: ">= 0"
      - name: home_market_code
        type: string
        source: input
        description: "Three-letter market the official travels from"
        constraints: "exactly 3 uppercase letters"
      - name: affiliated_team_code
        type: string
        source: input
        description: "Team the official has a declared conflict of interest with; null when none"
        default: null
        constraints: "null or exactly 3 uppercase letters"
      - name: status
        type: enum
        source: system
        description: "Employment posture gating assignment confirmation and advancement"
        default: CANDIDATE
        constraints: "CANDIDATE | ACTIVE | PROBATION | SUSPENDED | RELEASED"
      - name: preseason_cleared
        type: boolean
        source: computed
        description: "True once a passed PHYSICAL_TEST and a passed RULES_EXAM TrainingRecord both exist"
        default: false
      - name: appeal_credits_remaining
        type: integer
        source: computed
        description: "Season appeal quota left; seeded from SeasonProgram.appeal_credits_per_official at creation"
        default: 0
      - name: open_assignment_count
        type: integer
        source: computed
        description: "Count of this official's CrewAssignment rows with status IN {PROPOSED, CONFIRMED}"
        default: 0

  - name: AdvancementApplication
    parent: null
    common_fields: true
    fields:
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the applicant"
      - name: target_tier
        type: enum
        source: input
        description: "Tier the applicant is asking to be promoted into"
        constraints: "TIER_2 | TIER_1"
      - name: status
        type: enum
        source: system
        description: "Pipeline state, including the committee return loop"
        default: SUBMITTED
        constraints: "SUBMITTED | SCREENED | COMMITTEE_REVIEW | RETURNED_FOR_TAPE | APPROVED | DENIED"
      - name: return_count
        type: integer
        source: computed
        description: "Number of committee returns absorbed so far"
        default: 0
      - name: evaluation_average
        type: number
        source: computed
        description: "Mean of the rounded FieldEvaluation.composite_score values on this application; null when none exist"
        default: null
      - name: screened_at
        type: datetime
        source: system
        description: "Logical-clock instant the screening passed; ISO 8601 UTC, three fractional digits"
        default: null
      - name: decision_note
        type: string
        source: input
        description: "Note recorded by the last committee return or decision; null before either"
        default: null

  - name: FieldEvaluation
    parent: AdvancementApplication
    common_fields: false
    fields:
      - name: application_id
        type: string
        source: input
        description: "FK -> AdvancementApplication.id; the application this observation report belongs to"
      - name: evaluator_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldEvaluator who filed the report"
      - name: mechanics_score
        type: number
        source: input
        description: "Positioning and mechanics score"
        constraints: "0.00..100.00, 2 decimals"
      - name: rules_score
        type: number
        source: input
        description: "Rules application score"
        constraints: "0.00..100.00, 2 decimals"
      - name: presence_score
        type: number
        source: input
        description: "Game management and presence score"
        constraints: "0.00..100.00, 2 decimals"
      - name: composite_score
        type: number
        source: computed
        description: "Weighted composite of the three sub-scores, rounded to 2 decimals"
        default: 0.00

  - name: Game
    parent: null
    common_fields: true
    fields:
      - name: season_program_id
        type: string
        source: input
        description: "FK -> SeasonProgram.id; the season the game belongs to"
      - name: home_team_code
        type: string
        source: input
        description: "Three-letter home team code"
        constraints: "exactly 3 uppercase letters; != away_team_code"
      - name: away_team_code
        type: string
        source: input
        description: "Three-letter away team code"
        constraints: "exactly 3 uppercase letters; != home_team_code"
      - name: venue_market_code
        type: string
        source: input
        description: "Three-letter market the game is played in"
        constraints: "exactly 3 uppercase letters"
      - name: kickoff_utc
        type: datetime
        source: input
        description: "Scheduled kickoff instant; ISO 8601 UTC, three fractional digits"
      - name: status
        type: enum
        source: system
        description: "Game lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | PLAYED | FINALIZED"
      - name: crew_posture
        type: enum
        source: computed
        description: "Derived staffing gate; STAFFED only while status is SCHEDULED and confirmed_crew_count equals SeasonProgram.crew_size_required, LOCKED once status leaves SCHEDULED"
        default: UNDERSTAFFED
        constraints: "UNDERSTAFFED | STAFFED | LOCKED"
      - name: confirmed_crew_count
        type: integer
        source: computed
        description: "Count of this game's CrewAssignment rows with status == CONFIRMED"
        default: 0
      - name: crew_strength_index
        type: number
        source: computed
        description: "Experience-weighted crew strength for the variant named by crew_strength_variant, 2 decimals"
        default: 0.00
      - name: crew_strength_variant
        type: enum
        source: computed
        description: "Which crew_strength_index variant the stored value came from"
        default: PROJECTED
        constraints: "PROJECTED | REALIZED"

  - name: CrewAssignment
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; the game being staffed"
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the official being assigned"
      - name: position
        type: enum
        source: input
        description: "Crew slot filled by this assignment; unique per game across statuses PROPOSED and CONFIRMED"
        constraints: "REFEREE | UMPIRE | DOWN_JUDGE"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle"
        default: PROPOSED
        constraints: "PROPOSED | CONFIRMED | COMPLETED | WITHDRAWN | SUPERSEDED | VOIDED"
      - name: occupied_from_utc
        type: datetime
        source: computed
        description: "Start of the official's occupancy window: Game.kickoff_utc minus SeasonProgram.travel_lead_hours"
      - name: occupied_until_utc
        type: datetime
        source: computed
        description: "End of the official's occupancy window (exclusive): Game.kickoff_utc plus GAME_DURATION_HOURS plus SeasonProgram.min_rest_hours_between_games"
      - name: released_at
        type: datetime
        source: system
        description: "Logical-clock instant the assignment left PROPOSED/CONFIRMED for WITHDRAWN, SUPERSEDED or VOIDED; null otherwise"
        default: null

  - name: PlayGrade
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; the game the play occurred in"
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the official whose call is graded"
      - name: play_ref
        type: string
        source: input
        description: "League play identifier"
        constraints: "1..40 chars; unique per (game_id, official_id, play_ref)"
      - name: call_category
        type: enum
        source: input
        description: "Rulebook category the call falls under"
        constraints: "HOLDING | PASS_INTERFERENCE | ROUGHING_PASSER | FALSE_START"
      - name: grade_code
        type: enum
        source: input
        description: "Grading verdict against rulebook standards; rewritten by an OVERTURNED or MODIFIED appeal"
        constraints: "CORRECT | INCORRECT_CALL | MISSED_CALL | INADVERTENT_WHISTLE"
      - name: impact
        type: enum
        source: input
        description: "Competitive impact band of the call"
        constraints: "LOW | MEDIUM | HIGH | GAME_CRITICAL"
      - name: graded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GradingSupervisor who authored the grade; the segregation-of-duties key"
      - name: grade_status
        type: enum
        source: system
        description: "First state dimension: authoring/publication of the grade"
        default: DRAFT
        constraints: "DRAFT | POSTED | FINAL"
      - name: appeal_state
        type: enum
        source: system
        description: "Second state dimension: appeal posture, evolving independently of grade_status"
        default: NOT_APPEALED
        constraints: "NOT_APPEALED | APPEAL_PENDING | APPEAL_RESOLVED"
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock instant grade_status became POSTED; start of the appeal window"
        default: null
      - name: error_points
        type: number
        source: computed
        description: "Per-play weighted error points, rounded to 2 decimals before any summation"
        default: 0.00

  - name: GradeAppeal
    parent: null
    common_fields: true
    fields:
      - name: play_grade_id
        type: string
        source: input
        description: "FK -> PlayGrade.id; the graded play under appeal"
      - name: basis_note
        type: string
        source: input
        description: "Official's stated basis for the appeal"
        constraints: "1..500 chars, non-blank"
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle; UPHELD, OVERTURNED, MODIFIED and WITHDRAWN are terminal"
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | UPHELD | OVERTURNED | MODIFIED | WITHDRAWN"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the appeal was filed"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the GradingSupervisor who decided the appeal; null until decided"
        default: null
      - name: revised_grade_code
        type: enum
        source: input
        description: "Replacement grade_code supplied with a MODIFIED outcome; null otherwise"
        default: null
        constraints: "null | CORRECT | INCORRECT_CALL | MISSED_CALL | INADVERTENT_WHISTLE"
      - name: decision_note
        type: string
        source: input
        description: "Adjudication note recorded with the decision"
        default: null

  - name: ReplayStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: "Replay-center booth identifier"
        constraints: "1..20 chars, unique"
      - name: concurrent_capacity
        type: integer
        source: input
        description: "Number of decision windows the booth may hold open at once"
        default: 1
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Booth availability"
        default: ONLINE
        constraints: "ONLINE | OFFLINE"
      - name: active_review_count
        type: integer
        source: computed
        description: "Count of this station's ReplayReview rows with status == INITIATED"
        default: 0

  - name: ReplayReview
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; the in-progress game the review belongs to"
      - name: station_id
        type: string
        source: input
        description: "FK -> ReplayStation.id; the booth holding the decision window"
      - name: play_ref
        type: string
        source: input
        description: "League play identifier under review"
        constraints: "1..40 chars"
      - name: category
        type: enum
        source: input
        description: "Reviewable play category; must be listed in SeasonProgram.reviewable_categories"
        constraints: "SCORING_PLAY | TURNOVER | PLAYER_SAFETY | GAME_ADMIN"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle; DECIDED and EXPIRED are terminal"
        default: INITIATED
        constraints: "INITIATED | DECIDED | EXPIRED"
      - name: window_open_utc
        type: datetime
        source: computed
        description: "Logical clock at initiation; inclusive start of the booth occupancy interval"
      - name: window_close_utc
        type: datetime
        source: computed
        description: "window_open_utc plus SeasonProgram.replay_decision_limit_seconds; inclusive end of the booth occupancy interval"
      - name: decision
        type: enum
        source: input
        description: "Replay outcome; null when the review EXPIRED"
        default: null
        constraints: "null | STANDS | CONFIRMED | REVERSED"
      - name: elapsed_seconds
        type: integer
        source: computed
        description: "Whole seconds between window_open_utc and the decide call; null while INITIATED"
        default: null

  - name: TrainingRecord
    parent: Official
    common_fields: false
    fields:
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the official the record belongs to"
      - name: record_type
        type: enum
        source: input
        description: "Which preseason/training program produced the record"
        constraints: "RULES_CLINIC | PHYSICAL_TEST | RULES_EXAM"
      - name: session_code
        type: string
        source: input
        description: "Clinic or testing session identifier"
        constraints: "1..40 chars, non-blank"
      - name: score
        type: number
        source: input
        description: "Score for PHYSICAL_TEST and RULES_EXAM; must be omitted or null for RULES_CLINIC"
        default: null
        constraints: "null or 0.00..100.00, 2 decimals"
      - name: passed
        type: boolean
        source: computed
        description: "True for any RULES_CLINIC record; for PHYSICAL_TEST and RULES_EXAM, score >= the matching SeasonProgram minimum"
        default: false

  - name: OfficialSeasonRecord
    parent: null
    common_fields: true
    fields:
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the official this season record aggregates"
      - name: season_program_id
        type: string
        source: input
        description: "FK -> SeasonProgram.id; the season being aggregated"
      - name: graded_play_count
        type: integer
        source: computed
        description: "Number of PlayGrade rows in the included set for the current accuracy_variant"
        default: 0
      - name: weighted_error_points
        type: number
        source: computed
        description: "Sum of the per-play rounded PlayGrade.error_points over the included set, 2 decimals"
        default: 0.00
      - name: accuracy_index
        type: number
        source: computed
        description: "Accuracy percentage for the current accuracy_variant, 2 decimals"
        default: 100.00
      - name: accuracy_variant
        type: enum
        source: computed
        description: "Which accuracy variant produced the stored numbers"
        default: PROVISIONAL
        constraints: "PROVISIONAL | FINAL"
      - name: accuracy_eligible
        type: boolean
        source: computed
        description: "accuracy_index >= SeasonProgram.accuracy_eligibility_threshold AND graded_play_count >= SeasonProgram.min_graded_plays_for_eligibility"
        default: false
      - name: postseason_eligible
        type: boolean
        source: computed
        description: "accuracy_eligible AND Official.status == ACTIVE AND Official.preseason_cleared AND no DisciplineAction for the official in a non-terminal status"
        default: false
      - name: availability_component
        type: number
        source: computed
        description: "Share of settled assignments the official actually worked, 2 decimals"
        default: 0.00
      - name: retention_score
        type: number
        source: computed
        description: "Retention composite after the training-deficiency penalty, floored at 0.00; recomputed by the postseason lock"
        default: 0.00
      - name: retention_recommendation
        type: enum
        source: computed
        description: "Retention decision band derived from retention_score"
        default: DEVELOP
        constraints: "RETAIN | DEVELOP | RELEASE"

  - name: PoolReport
    parent: null
    common_fields: true
    fields:
      - name: game_id
        type: string
        source: input
        description: "FK -> Game.id; the game the public statement concerns"
      - name: play_grade_id
        type: string
        source: input
        description: "FK -> PlayGrade.id; the graded play the statement cites"
      - name: report_type
        type: enum
        source: input
        description: "Public accountability artifact kind"
        constraints: "POOL_REPORT | RULES_CLARIFICATION"
      - name: body
        type: string
        source: input
        description: "Published text"
        constraints: "1..2000 chars, non-blank"
      - name: supersedes_id
        type: string
        source: input
        description: "FK -> PoolReport.id; an earlier statement this one replaces on publication; null when none"
        default: null
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | SUPERSEDED"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null while DRAFT"
        default: null

  - name: DisciplineAction
    parent: null
    common_fields: true
    fields:
      - name: official_id
        type: string
        source: input
        description: "FK -> Official.id; the disciplined official"
      - name: reason_category
        type: enum
        source: input
        description: "Why the action was opened"
        constraints: "PERFORMANCE | CONDUCT | ATTENDANCE"
      - name: severity
        type: enum
        source: input
        description: "Severity determining the cascade onto Official.status"
        constraints: "WARNING | REMEDIATION | SUSPENSION"
      - name: suspension_games
        type: integer
        source: input
        description: "Games withheld for a SUSPENSION; must be null for WARNING and REMEDIATION"
        default: null
        constraints: "null or >= 1"
      - name: status
        type: enum
        source: system
        description: "Action lifecycle including the remediation reassessment loop"
        default: OPENED
        constraints: "OPENED | REMEDIATION_ASSIGNED | REASSESSED | CLEARED | ESCALATED | SUPERSEDED"
      - name: remediation_cycle_count
        type: integer
        source: computed
        description: "Number of times a remediation plan has been assigned on this action"
        default: 0
      - name: remediation_plan
        type: string
        source: input
        description: "Remediation plan text recorded when a plan is assigned; null before that"
        default: null
      - name: resolution_note
        type: string
        source: input
        description: "Note recorded with the resolving outcome; null before resolution"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: SeasonProgram
    initial_state: CONFIGURING
    terminal_states: [POSTSEASON_LOCKED]
    transitions:
      - from: CONFIGURING
        to: OPEN
        trigger: "POST /season-programs/{id}/open"
        actor: OfficiatingDirector
        preconditions:
          - "SeasonProgram.status == CONFIGURING"
        side_effects:
          - "increments SeasonProgram.version by 1"
        note: "Officials, games, assignments, grades, appeals, replay reviews, pool reports and discipline actions may only be created or mutated while status == OPEN."
      - from: OPEN
        to: POSTSEASON_LOCKED
        trigger: "POST /season-programs/{id}/lock-postseason"
        actor: OfficiatingDirector
        preconditions:
          - "SeasonProgram.status == OPEN"
          - "no Game with season_program_id == this program has status == IN_PROGRESS (else ERR_GAMES_IN_PROGRESS)"
        side_effects:
          - "for every OfficialSeasonRecord of this program, ordered by OfficialSeasonRecord.created_at ASC: recompute accuracy_index with the FINAL variant of calculations.accuracy_index, set accuracy_variant := FINAL, recompute graded_play_count and weighted_error_points over the FINAL included set"
          - "then recompute accuracy_eligible and postseason_eligible on each record"
          - "then compute availability_component, retention_score and retention_recommendation on each record via calculations.retention_score"
          - "then for every record whose retention_recommendation == RELEASE, set the linked Official.status := RELEASED and increment that Official.version by 1"
          - "sets SeasonProgram.eligible_official_count := count of this program's OfficialSeasonRecord rows with postseason_eligible == true"
          - "increments SeasonProgram.version by 1"

  - entity: Official
    initial_state: CANDIDATE
    terminal_states: [RELEASED]
    transitions:
      - from: CANDIDATE
        to: ACTIVE
        trigger: "POST /officials/{id}/training-records that stores a passed RULES_EXAM (system auto-transition — departmental membership)"
        actor: system
        preconditions:
          - "Official.status == CANDIDATE"
          - "after this record is stored, the official has at least one TrainingRecord with record_type == RULES_EXAM and passed == true"
        side_effects:
          - "re-derives Official.preseason_cleared per calculations.preseason_clearance — which stays false until a passed PHYSICAL_TEST also exists, so an ACTIVE official can still be un-cleared and therefore unassignable"
          - "increments Official.version by 1"
        note: "Roster membership (status) and field readiness (preseason_cleared) are deliberately decoupled: passing the rules exam makes an official ACTIVE, but only a passed physical test in addition sets preseason_cleared. Recording a further TrainingRecord for an already-ACTIVE official leaves status untouched and only re-derives preseason_cleared."
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /discipline-actions with severity == REMEDIATION or severity == WARNING and reason_category == PERFORMANCE"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status == ACTIVE"
        side_effects:
          - "increments Official.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /discipline-actions with severity == SUSPENSION"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "cascade hop 3: every CrewAssignment of this official with status IN {PROPOSED, CONFIRMED} whose Game.status IN {SCHEDULED, IN_PROGRESS}, ordered by CrewAssignment.created_at ASC, becomes VOIDED with released_at := logical clock"
          - "decrements Official.open_assignment_count by 1 per voided assignment"
          - "increments Official.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /discipline-actions with severity == SUSPENSION"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "same voiding cascade as ACTIVE -> SUSPENDED"
          - "increments Official.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /discipline-actions/{id}/resolve with outcome == CLEARED, or the accuracy-recovery cascade of POST /grade-appeals/{id}/decide"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status == PROBATION"
          - "after the resolving action, no DisciplineAction of this official has status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED, ESCALATED}"
        side_effects:
          - "increments Official.version by 1"
          - "recomputes the official's OfficialSeasonRecord.postseason_eligible"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /discipline-actions/{id}/resolve with outcome == CLEARED"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status == SUSPENDED"
          - "after the resolving action, no DisciplineAction of this official has status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED, ESCALATED}"
        side_effects:
          - "increments Official.version by 1"
          - "recomputes the official's OfficialSeasonRecord.postseason_eligible"
        note: "Assignments voided by the suspension are NOT restored; only future assignments may be created."
      - from: PROBATION
        to: RELEASED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == ESCALATED, or the RELEASE recommendation cascade of POST /season-programs/{id}/lock-postseason"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status IN {ACTIVE, PROBATION, SUSPENDED}"
        side_effects:
          - "every CrewAssignment of this official with status IN {PROPOSED, CONFIRMED} becomes VOIDED, ordered by CrewAssignment.created_at ASC"
          - "increments Official.version by 1"
      - from: SUSPENDED
        to: RELEASED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == ESCALATED"
        actor: OfficiatingDirector
        preconditions:
          - "Official.status IN {ACTIVE, PROBATION, SUSPENDED}"
        side_effects:
          - "every CrewAssignment of this official with status IN {PROPOSED, CONFIRMED} becomes VOIDED, ordered by CrewAssignment.created_at ASC"
          - "increments Official.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /season-programs/{id}/lock-postseason when the official's retention_recommendation == RELEASE"
        actor: system
        preconditions:
          - "OfficialSeasonRecord.retention_recommendation == RELEASE after the FINAL recompute"
        side_effects:
          - "increments Official.version by 1"

  - entity: AdvancementApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /advancement-applications/{id}/screen"
        actor: FieldEvaluator
        preconditions:
          - "AdvancementApplication.status == SUBMITTED"
          - "Official.status == ACTIVE and Official.preseason_cleared == true"
          - "Official.tier is exactly one step below target_tier (TIER_3 -> TIER_2, TIER_2 -> TIER_1)"
          - "Official.seasons_experience >= MIN_EXPERIENCE_FOR_TIER[target_tier]"
          - "the official's OfficialSeasonRecord.accuracy_index >= ADVANCEMENT_MIN_ACCURACY (else ERR_ADVANCEMENT_CRITERIA_NOT_MET)"
        side_effects:
          - "sets screened_at := logical clock"
          - "increments AdvancementApplication.version by 1"
      - from: SCREENED
        to: COMMITTEE_REVIEW
        trigger: "POST /advancement-applications/{id}/submit-to-committee"
        actor: FieldEvaluator
        preconditions:
          - "AdvancementApplication.status IN {SCREENED, RETURNED_FOR_TAPE}"
          - "count(FieldEvaluation where application_id == this id) >= MIN_EVALUATIONS + return_count"
          - "evaluation_average >= MIN_EVAL_AVERAGE (else ERR_EVALUATION_REQUIREMENTS_NOT_MET)"
        side_effects:
          - "increments AdvancementApplication.version by 1"
      - from: COMMITTEE_REVIEW
        to: RETURNED_FOR_TAPE
        trigger: "POST /advancement-applications/{id}/return-for-tape"
        actor: OfficiatingDirector
        preconditions:
          - "AdvancementApplication.status == COMMITTEE_REVIEW"
          - "return_count < SeasonProgram.max_application_returns"
        side_effects:
          - "increments return_count by 1"
          - "sets decision_note := note"
          - "increments AdvancementApplication.version by 1"
      - from: RETURNED_FOR_TAPE
        to: COMMITTEE_REVIEW
        trigger: "POST /advancement-applications/{id}/submit-to-committee"
        actor: FieldEvaluator
        preconditions:
          - "AdvancementApplication.status == RETURNED_FOR_TAPE"
          - "count(FieldEvaluation where application_id == this id) >= MIN_EVALUATIONS + return_count — i.e. at least one fresh report per return"
          - "evaluation_average >= MIN_EVAL_AVERAGE"
        side_effects:
          - "increments AdvancementApplication.version by 1"
        note: "This is the cycle edge: COMMITTEE_REVIEW -> RETURNED_FOR_TAPE -> COMMITTEE_REVIEW may repeat until return_count reaches SeasonProgram.max_application_returns."
      - from: COMMITTEE_REVIEW
        to: DENIED
        trigger: "POST /advancement-applications/{id}/return-for-tape when return_count == SeasonProgram.max_application_returns (auto-denial instead of a further return)"
        actor: OfficiatingDirector
        preconditions:
          - "AdvancementApplication.status == COMMITTEE_REVIEW"
          - "return_count == SeasonProgram.max_application_returns"
        side_effects:
          - "sets decision_note := note"
          - "increments AdvancementApplication.version by 1"
        note: "The return that would exceed the cap is not rejected; it terminates the loop with DENIED and leaves return_count unchanged."
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /advancement-applications/{id}/decide with outcome == APPROVED"
        actor: OfficiatingDirector
        preconditions:
          - "AdvancementApplication.status == COMMITTEE_REVIEW"
        side_effects:
          - "sets Official.tier := target_tier and increments Official.version by 1"
          - "sets decision_note := note when supplied"
          - "increments AdvancementApplication.version by 1"
      - from: COMMITTEE_REVIEW
        to: DENIED
        trigger: "POST /advancement-applications/{id}/decide with outcome == DENIED"
        actor: OfficiatingDirector
        preconditions:
          - "AdvancementApplication.status == COMMITTEE_REVIEW"
        side_effects:
          - "leaves Official.tier untouched"
          - "increments AdvancementApplication.version by 1"

  - entity: Game
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /games/{id}/kickoff"
        actor: OfficiatingDirector
        preconditions:
          - "Game.status == SCHEDULED"
          - "SeasonProgram.status == OPEN"
          - "Game.crew_posture == STAFFED (else ERR_CREW_NOT_STAFFED)"
        side_effects:
          - "sets Game.crew_posture := LOCKED"
          - "recomputes Game.crew_strength_index with the PROJECTED variant and sets crew_strength_variant := PROJECTED"
          - "increments Game.version by 1"
      - from: IN_PROGRESS
        to: PLAYED
        trigger: "POST /games/{id}/mark-played"
        actor: OfficiatingDirector
        preconditions:
          - "Game.status == IN_PROGRESS"
        side_effects:
          - "every CrewAssignment of this game with status == CONFIRMED becomes COMPLETED, ordered by CrewAssignment.created_at ASC"
          - "decrements each affected Official.open_assignment_count by 1"
          - "every ReplayReview of this game with status == INITIATED becomes EXPIRED with decision := null and elapsed_seconds := whole seconds from window_open_utc to the logical clock; each such station's active_review_count decrements by 1"
          - "increments Game.version by 1"
      - from: PLAYED
        to: FINALIZED
        trigger: "POST /games/{id}/finalize"
        actor: OfficiatingDirector
        preconditions:
          - "Game.status == PLAYED"
        side_effects:
          - "every PlayGrade of this game with grade_status == POSTED and appeal_state != APPEAL_PENDING becomes grade_status FINAL, ordered by PlayGrade.created_at ASC; grades with appeal_state == APPEAL_PENDING stay POSTED"
          - "recomputes Game.crew_strength_index with the REALIZED variant and sets crew_strength_variant := REALIZED"
          - "recomputes the OfficialSeasonRecord of every official graded on this game with the PROVISIONAL variant"
          - "increments Game.version by 1"

  - entity: CrewAssignment
    initial_state: PROPOSED
    terminal_states: [COMPLETED, WITHDRAWN, SUPERSEDED, VOIDED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /crew-assignments/{id}/confirm"
        actor: CrewScheduler
        preconditions:
          - "CrewAssignment.status == PROPOSED"
          - "Game.status == SCHEDULED"
          - "SeasonProgram.status == OPEN"
          - "Official.status == ACTIVE (else ERR_OFFICIAL_NOT_ACTIVE)"
          - "Official.preseason_cleared == true (else ERR_PRESEASON_NOT_CLEARED)"
        side_effects:
          - "increments Game.confirmed_crew_count by 1"
          - "recomputes Game.crew_posture: STAFFED when confirmed_crew_count == SeasonProgram.crew_size_required, else UNDERSTAFFED"
          - "recomputes Game.crew_strength_index with the PROJECTED variant"
          - "increments Game.version by 1"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /crew-assignments/{id}/withdraw"
        actor: CrewScheduler
        preconditions:
          - "CrewAssignment.status IN {PROPOSED, CONFIRMED}"
          - "Game.status == SCHEDULED"
        side_effects:
          - "sets released_at := logical clock"
          - "decrements Official.open_assignment_count by 1"
          - "recomputes Game.crew_strength_index with the PROJECTED variant"
          - "increments Game.version by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /crew-assignments/{id}/withdraw"
        actor: CrewScheduler
        preconditions:
          - "CrewAssignment.status IN {PROPOSED, CONFIRMED}"
          - "Game.status == SCHEDULED"
        side_effects:
          - "sets released_at := logical clock"
          - "decrements Official.open_assignment_count by 1"
          - "cascade hop 2: decrements Game.confirmed_crew_count by 1, which re-derives Game.crew_posture from STAFFED to UNDERSTAFFED when the count falls below SeasonProgram.crew_size_required"
          - "cascade hop 3: because crew_posture left STAFFED, Game.crew_strength_index is recomputed with the PROJECTED variant over the remaining PROPOSED/CONFIRMED assignments"
          - "increments Game.version by 1"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /crew-assignments (a new assignment for the same game and position)"
        actor: CrewScheduler
        preconditions:
          - "CrewAssignment.status == PROPOSED"
          - "the incoming request targets the same game_id and position"
        side_effects:
          - "sets released_at := logical clock"
          - "decrements Official.open_assignment_count by 1"
        note: "Only a PROPOSED assignment may be superseded; a CONFIRMED one rejects the incoming create with ERR_POSITION_ALREADY_CONFIRMED."
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /discipline-actions with severity == SUSPENSION, or an Official transition into RELEASED"
        actor: system
        preconditions:
          - "CrewAssignment.status IN {PROPOSED, CONFIRMED}"
          - "Game.status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "sets released_at := logical clock"
          - "decrements Official.open_assignment_count by 1"
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /discipline-actions with severity == SUSPENSION, or an Official transition into RELEASED"
        actor: system
        preconditions:
          - "CrewAssignment.status IN {PROPOSED, CONFIRMED}"
          - "Game.status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "sets released_at := logical clock"
          - "decrements Official.open_assignment_count by 1"
          - "cascade hop 4: decrements Game.confirmed_crew_count by 1 and recomputes Game.crew_strength_index with the PROJECTED variant; crew_posture is re-derived only while Game.status == SCHEDULED, and stays LOCKED once the game is IN_PROGRESS"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /games/{id}/mark-played"
        actor: system
        preconditions:
          - "CrewAssignment.status == CONFIRMED"
          - "Game.status == IN_PROGRESS"
        side_effects:
          - "decrements Official.open_assignment_count by 1"

  - entity: PlayGrade
    initial_state: "grade_status:DRAFT + appeal_state:NOT_APPEALED"
    terminal_states: ["grade_status:FINAL", "appeal_state:APPEAL_RESOLVED"]
    transitions:
      - from: "grade_status:DRAFT"
        to: "grade_status:POSTED"
        trigger: "POST /play-grades/{id}/post"
        actor: GradingSupervisor
        preconditions:
          - "PlayGrade.grade_status == DRAFT"
          - "Game.status IN {PLAYED, FINALIZED}"
          - "SeasonProgram.status == OPEN"
        side_effects:
          - "sets posted_at := logical clock, which opens the appeal window of SeasonProgram.appeal_window_hours"
          - "recomputes the graded official's OfficialSeasonRecord with the PROVISIONAL variant: graded_play_count, weighted_error_points, accuracy_index, accuracy_eligible, postseason_eligible"
          - "increments PlayGrade.version by 1"
      - from: "grade_status:POSTED"
        to: "grade_status:FINAL"
        trigger: "POST /games/{id}/finalize"
        actor: system
        preconditions:
          - "PlayGrade.grade_status == POSTED"
          - "PlayGrade.appeal_state != APPEAL_PENDING — the cross-dimension guard"
        side_effects:
          - "increments PlayGrade.version by 1"
        note: "This is the only coupling between the two dimensions; a POSTED grade under a pending appeal simply stays POSTED while the rest of the game finalizes."
      - from: "appeal_state:NOT_APPEALED"
        to: "appeal_state:APPEAL_PENDING"
        trigger: "POST /grade-appeals"
        actor: Official
        preconditions:
          - "PlayGrade.grade_status == POSTED"
          - "PlayGrade.appeal_state == NOT_APPEALED"
        side_effects:
          - "increments PlayGrade.version by 1"
        note: "grade_status is untouched — the two dimensions advance independently."
      - from: "appeal_state:APPEAL_PENDING"
        to: "appeal_state:NOT_APPEALED"
        trigger: "POST /grade-appeals/{id}/withdraw"
        actor: Official
        preconditions:
          - "GradeAppeal.status IN {SUBMITTED, UNDER_REVIEW}"
        side_effects:
          - "restores Official.appeal_credits_remaining by 1"
          - "increments PlayGrade.version by 1"
        note: "Cycle inside the appeal dimension: NOT_APPEALED -> APPEAL_PENDING -> NOT_APPEALED, repeatable while credits remain and the appeal window is open."
      - from: "appeal_state:APPEAL_PENDING"
        to: "appeal_state:APPEAL_RESOLVED"
        trigger: "POST /grade-appeals/{id}/decide"
        actor: GradingSupervisor
        preconditions:
          - "GradeAppeal.status == UNDER_REVIEW"
        side_effects:
          - "on OVERTURNED: sets PlayGrade.grade_code := CORRECT; on MODIFIED: sets PlayGrade.grade_code := GradeAppeal.revised_grade_code; on UPHELD: leaves grade_code untouched"
          - "recomputes PlayGrade.error_points"
          - "increments PlayGrade.version by 1"

  - entity: GradeAppeal
    initial_state: SUBMITTED
    terminal_states: [UPHELD, OVERTURNED, MODIFIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /grade-appeals/{id}/start-review"
        actor: GradingSupervisor
        preconditions:
          - "GradeAppeal.status == SUBMITTED"
          - "SeasonProgram.status == OPEN"
        side_effects:
          - "increments GradeAppeal.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /grade-appeals/{id}/withdraw"
        actor: Official
        preconditions:
          - "GradeAppeal.status IN {SUBMITTED, UNDER_REVIEW}"
          - "X-User-ID == PlayGrade.official_id (else ERR_NOT_GRADE_OWNER)"
        side_effects:
          - "sets PlayGrade.appeal_state := NOT_APPEALED"
          - "increments Official.appeal_credits_remaining by 1, restoring the conserved appeal quota"
          - "increments GradeAppeal.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /grade-appeals/{id}/withdraw"
        actor: Official
        preconditions:
          - "GradeAppeal.status IN {SUBMITTED, UNDER_REVIEW}"
          - "X-User-ID == PlayGrade.official_id"
        side_effects:
          - "sets PlayGrade.appeal_state := NOT_APPEALED"
          - "increments Official.appeal_credits_remaining by 1"
          - "increments GradeAppeal.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /grade-appeals/{id}/decide with outcome == UPHELD"
        actor: GradingSupervisor
        preconditions:
          - "GradeAppeal.status == UNDER_REVIEW"
          - "X-User-ID != PlayGrade.graded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "sets decided_by_user_id := X-User-ID and decision_note := decision_note"
          - "sets PlayGrade.appeal_state := APPEAL_RESOLVED; grade_code and error_points unchanged"
          - "recomputes the official's OfficialSeasonRecord with the PROVISIONAL variant (values unchanged)"
          - "increments GradeAppeal.version by 1"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /grade-appeals/{id}/decide with outcome == OVERTURNED"
        actor: GradingSupervisor
        preconditions:
          - "GradeAppeal.status == UNDER_REVIEW"
          - "X-User-ID != PlayGrade.graded_by_user_id"
        side_effects:
          - "cascade hop 2: sets PlayGrade.grade_code := CORRECT, appeal_state := APPEAL_RESOLVED, and recomputes PlayGrade.error_points (which becomes 0.00)"
          - "cascade hop 3: because PlayGrade.error_points changed, the graded official's OfficialSeasonRecord.weighted_error_points and accuracy_index are recomputed with the PROVISIONAL variant"
          - "cascade hop 4: because accuracy_index moved, accuracy_eligible is re-derived; when it flips false -> true, every DisciplineAction of that official with reason_category == PERFORMANCE and status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED} transitions to CLEARED, ordered by DisciplineAction.created_at ASC"
          - "cascade hop 5: because that action left the non-terminal set, Official.status PROBATION -> ACTIVE when no DisciplineAction of the official remains in {OPENED, REMEDIATION_ASSIGNED, REASSESSED, ESCALATED}, and OfficialSeasonRecord.postseason_eligible is re-derived to true"
          - "increments GradeAppeal.version by 1"
      - from: UNDER_REVIEW
        to: MODIFIED
        trigger: "POST /grade-appeals/{id}/decide with outcome == MODIFIED"
        actor: GradingSupervisor
        preconditions:
          - "GradeAppeal.status == UNDER_REVIEW"
          - "X-User-ID != PlayGrade.graded_by_user_id"
          - "revised_grade_code is present and != PlayGrade.grade_code (else ERR_INVALID_REQUEST)"
        side_effects:
          - "sets PlayGrade.grade_code := revised_grade_code, appeal_state := APPEAL_RESOLVED, and recomputes PlayGrade.error_points"
          - "recomputes the official's OfficialSeasonRecord with the PROVISIONAL variant"
          - "increments GradeAppeal.version by 1"

  - entity: ReplayReview
    initial_state: INITIATED
    terminal_states: [DECIDED, EXPIRED]
    transitions:
      - from: INITIATED
        to: DECIDED
        trigger: "POST /replay-reviews/{id}/decide"
        actor: ReplayOfficial
        preconditions:
          - "ReplayReview.status == INITIATED"
          - "elapsed_seconds <= SeasonProgram.replay_decision_limit_seconds, where elapsed_seconds is the whole seconds from window_open_utc to the logical clock"
        side_effects:
          - "sets decision := the supplied decision and elapsed_seconds"
          - "decrements ReplayStation.active_review_count by 1 and increments ReplayStation.version by 1"
          - "increments ReplayReview.version by 1"
      - from: INITIATED
        to: EXPIRED
        trigger: "POST /replay-reviews/{id}/decide submitted after the window, or POST /games/{id}/mark-played"
        actor: ReplayOfficial
        preconditions:
          - "ReplayReview.status == INITIATED"
          - "elapsed_seconds > SeasonProgram.replay_decision_limit_seconds, or the game left IN_PROGRESS"
        side_effects:
          - "sets decision := null and elapsed_seconds"
          - "decrements ReplayStation.active_review_count by 1 and increments ReplayStation.version by 1"
          - "increments ReplayReview.version by 1"
        note: "A late decide is not an error: the supplied decision is discarded and the review is recorded as EXPIRED with HTTP 200."

  - entity: PoolReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /pool-reports/{id}/publish"
        actor: CommunicationsOfficer
        preconditions:
          - "PoolReport.status == DRAFT"
          - "the cited PlayGrade.grade_status == FINAL and appeal_state != APPEAL_PENDING (else ERR_CITED_GRADE_NOT_FINAL)"
        side_effects:
          - "sets published_at := logical clock"
          - "when supersedes_id is not null, the referenced PoolReport with status IN {DRAFT, PUBLISHED} becomes SUPERSEDED and its version increments by 1"
          - "increments PoolReport.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /pool-reports/{id}/publish on a later report whose supersedes_id names this one"
        actor: system
        preconditions:
          - "PoolReport.status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "increments PoolReport.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /pool-reports/{id}/publish on a later report whose supersedes_id names this one"
        actor: system
        preconditions:
          - "PoolReport.status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "increments PoolReport.version by 1"

  - entity: DisciplineAction
    initial_state: OPENED
    terminal_states: [CLEARED, ESCALATED, SUPERSEDED]
    transitions:
      - from: OPENED
        to: REMEDIATION_ASSIGNED
        trigger: "POST /discipline-actions/{id}/assign-remediation"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status IN {OPENED, REASSESSED}"
          - "remediation_cycle_count < REMEDIATION_CYCLE_LIMIT (else ERR_REMEDIATION_CYCLE_LIMIT)"
        side_effects:
          - "increments remediation_cycle_count by 1"
          - "sets remediation_plan := remediation_plan"
          - "increments DisciplineAction.version by 1"
      - from: REASSESSED
        to: REMEDIATION_ASSIGNED
        trigger: "POST /discipline-actions/{id}/assign-remediation"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status IN {OPENED, REASSESSED}"
          - "remediation_cycle_count < REMEDIATION_CYCLE_LIMIT"
        side_effects:
          - "increments remediation_cycle_count by 1"
          - "sets remediation_plan := remediation_plan"
          - "increments DisciplineAction.version by 1"
        note: "Cycle edge: REMEDIATION_ASSIGNED -> REASSESSED -> REMEDIATION_ASSIGNED, capped at REMEDIATION_CYCLE_LIMIT assignments."
      - from: REMEDIATION_ASSIGNED
        to: REASSESSED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == REASSESSED"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status == REMEDIATION_ASSIGNED"
        side_effects:
          - "sets resolution_note := note when supplied"
          - "increments DisciplineAction.version by 1"
      - from: REMEDIATION_ASSIGNED
        to: CLEARED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == CLEARED"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "sets resolution_note := note when supplied"
          - "Official.status PROBATION -> ACTIVE or SUSPENDED -> ACTIVE when no other DisciplineAction of that official is in {OPENED, REMEDIATION_ASSIGNED, REASSESSED, ESCALATED}"
          - "recomputes the official's OfficialSeasonRecord.postseason_eligible"
          - "increments DisciplineAction.version by 1"
      - from: OPENED
        to: CLEARED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == CLEARED, or the accuracy-recovery cascade of POST /grade-appeals/{id}/decide with outcome == OVERTURNED"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "same Official.status and OfficialSeasonRecord side effects as REMEDIATION_ASSIGNED -> CLEARED"
          - "increments DisciplineAction.version by 1"
      - from: REASSESSED
        to: CLEARED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == CLEARED"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "same Official.status and OfficialSeasonRecord side effects as REMEDIATION_ASSIGNED -> CLEARED"
          - "increments DisciplineAction.version by 1"
      - from: REMEDIATION_ASSIGNED
        to: ESCALATED
        trigger: "POST /discipline-actions/{id}/resolve with outcome == ESCALATED"
        actor: OfficiatingDirector
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "sets Official.status := RELEASED and voids the official's PROPOSED/CONFIRMED assignments"
          - "increments DisciplineAction.version by 1"
      - from: OPENED
        to: SUPERSEDED
        trigger: "POST /discipline-actions (a newer action opened against the same official)"
        actor: system
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "increments DisciplineAction.version by 1"
        note: "The newer action legitimately supersedes the prior one; this is why POST /discipline-actions carries OCC on Official.version (see §1.2.1)."
      - from: REMEDIATION_ASSIGNED
        to: SUPERSEDED
        trigger: "POST /discipline-actions (a newer action opened against the same official)"
        actor: system
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "increments DisciplineAction.version by 1"
      - from: REASSESSED
        to: SUPERSEDED
        trigger: "POST /discipline-actions (a newer action opened against the same official)"
        actor: system
        preconditions:
          - "DisciplineAction.status IN {OPENED, REMEDIATION_ASSIGNED, REASSESSED}"
        side_effects:
          - "increments DisciplineAction.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: assignment-create-stale-game
    parent_entity: Game
    write_endpoint: "POST /crew-assignments"
    occ_field: "expected_game_version"
    description: |
      Creating a CrewAssignment against a Game whose version has advanced since
      the client last observed it is rejected. A create for a position that
      already holds a PROPOSED assignment legitimately supersedes that
      assignment, so the write cannot be filtered out by a state precondition;
      the stale-version check is what stops a scheduler from superseding a crew
      slot it never saw.
    error_id: ERR_STALE_GAME_VERSION
    http_status: 412

  - rule_id: discipline-create-stale-official
    parent_entity: Official
    write_endpoint: "POST /discipline-actions"
    occ_field: "expected_official_version"
    description: |
      Opening a DisciplineAction against an Official whose version has advanced
      since the client last observed it is rejected. A newly opened action
      legitimately supersedes the official's prior non-terminal action, so a
      second create would otherwise succeed on its own merits; the stale-version
      check stops a director from superseding discipline they never saw.
    error_id: ERR_STALE_OFFICIAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: play_error_points
    trigger: "on POST /play-grades (create), on POST /play-grades/{id}/post, and on POST /grade-appeals/{id}/decide whenever PlayGrade.grade_code changes"
    algorithm: weighted_scoring
    formula: |
      error_points = round_half_up(
          GRADE_BASE[grade_code] * IMPACT_MULTIPLIER[impact] * POSITION_FACTOR[Official.position],
          2)
      # The product is rounded PER PLAY, before any summation. This is the only
      # legal rounding point for this quantity.
    input_set: "the single PlayGrade row being written, joined to its Official for position"
    constants:
      GRADE_BASE_CORRECT: 0.00
      GRADE_BASE_INCORRECT_CALL: 1.00
      GRADE_BASE_MISSED_CALL: 1.50
      GRADE_BASE_INADVERTENT_WHISTLE: 2.00
      IMPACT_MULTIPLIER_LOW: 0.50
      IMPACT_MULTIPLIER_MEDIUM: 1.00
      IMPACT_MULTIPLIER_HIGH: 1.75
      IMPACT_MULTIPLIER_GAME_CRITICAL: 2.50
      POSITION_FACTOR_REFEREE: 1.20
      POSITION_FACTOR_UMPIRE: 1.00
      POSITION_FACTOR_DOWN_JUDGE: 0.90
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "MISSED_CALL + HIGH + UMPIRE: 1.50 * 1.75 * 1.00 = 2.625 -> 2.63"
      - "MISSED_CALL + HIGH + REFEREE: 1.50 * 1.75 * 1.20 = 3.15 -> 3.15"
      - "INCORRECT_CALL + MEDIUM + REFEREE: 1.00 * 1.00 * 1.20 = 1.20 -> 1.20"
      - "MISSED_CALL + LOW + UMPIRE: 1.50 * 0.50 * 1.00 = 0.75 -> 0.75"
      - "MISSED_CALL + LOW + REFEREE: 1.50 * 0.50 * 1.20 = 0.90 -> 0.90"
      - "CORRECT + GAME_CRITICAL + REFEREE: 0.00 * 2.50 * 1.20 = 0.00 -> 0.00 (a CORRECT grade never accrues points regardless of impact)"

  - name: weighted_error_points
    trigger: "on every recompute of an OfficialSeasonRecord (grade post, appeal decision, game finalize, postseason lock)"
    algorithm: chronological
    formula: |
      ordered = included_grades sorted by PlayGrade.created_at ASC
      total = 0.00
      for g in ordered:
          total = total + g.error_points        # already rounded per play by play_error_points
      weighted_error_points = total             # no further rounding is applied
      graded_play_count = count(ordered)
    input_set: "see accuracy_index.variants for the included set; ordering is ALWAYS PlayGrade.created_at ASC, never id"
    constants: {}
    precision: "2 decimal places; the sum of already-rounded per-play values (round-then-sum), never a rounded sum of raw products"
    worked_examples:
      - "Two MISSED_CALL/HIGH/UMPIRE plays: round-then-sum gives 2.63 + 2.63 = 5.26. Sum-then-round would give round(5.25) = 5.25. 5.26 is correct."
      - "Three plays CORRECT, CORRECT, MISSED_CALL/LOW/UMPIRE: 0.00 + 0.00 + 0.75 = 0.75, graded_play_count = 3."

  - name: accuracy_index
    trigger: "on POST /play-grades/{id}/post, POST /grade-appeals/{id}/decide, POST /games/{id}/finalize, POST /season-programs/{id}/lock-postseason"
    algorithm: aggregation
    formula: |
      if graded_play_count == 0:
          accuracy_index = 100.00
      else:
          accuracy_index = round_half_up(
              100.00 - (weighted_error_points / graded_play_count) * ERROR_SCALE, 2)
      accuracy_eligible = (accuracy_index >= SeasonProgram.accuracy_eligibility_threshold)
                          and (graded_play_count >= SeasonProgram.min_graded_plays_for_eligibility)
    input_set: "PlayGrade rows of one Official, filtered per the active variant below"
    constants:
      ERROR_SCALE: 20.00
      DEFAULT_ACCURACY_ELIGIBILITY_THRESHOLD: 95.00
      DEFAULT_MIN_GRADED_PLAYS_FOR_ELIGIBILITY: 3
    precision: "2 decimal places, round_half_up; a zero-play official reads exactly 100.00 and is NOT accuracy_eligible because the play-count floor fails"
    variants:
      - name: PROVISIONAL
        when: "every in-season recompute — grade post, appeal decision, game finalize; written with accuracy_variant := PROVISIONAL"
        difference: |
          Included set = PlayGrade rows with grade_status IN {POSTED, FINAL}. The
          current grade_code of each row is used, whatever an appeal did to it.
          Rows whose appeal was OVERTURNED remain in BOTH numerator and
          denominator (with error_points 0.00, which pulls the average toward
          100.00 while keeping the play counted).
      - name: FINAL
        when: "POST /season-programs/{id}/lock-postseason only; written with accuracy_variant := FINAL"
        difference: |
          Included set = PlayGrade rows with grade_status == FINAL only (POSTED
          rows on games that never finalized, and POSTED rows frozen by a pending
          appeal, drop out entirely). Rows whose GradeAppeal ended OVERTURNED are
          EXCLUDED from both numerator and denominator — they never happened for
          retention purposes. Rows whose appeal ended MODIFIED are included using
          GradeAppeal.revised_grade_code.
    worked_examples:
      - "UMPIRE with 3 FINAL plays (CORRECT, CORRECT, MISSED_CALL/LOW = 0.75) and 1 POSTED play on a non-finalized game (MISSED_CALL/HIGH = 2.63): PROVISIONAL n=4, wep=3.38, 3.38/4=0.845, *20=16.90, index=83.10. FINAL n=3, wep=0.75, 0.75/3=0.25, *20=5.00, index=95.00."
      - "95.00 sits exactly on the default threshold, so >= makes the official accuracy_eligible; a sibling REFEREE with one MISSED_CALL/LOW (0.90) over 3 plays scores 100.00 - (0.90/3)*20 = 94.00 and is NOT eligible."
      - "REFEREE with 3 plays (CORRECT, CORRECT, INCORRECT_CALL/MEDIUM = 1.20): 100.00 - (1.20/3)*20 = 92.00. After that grade is OVERTURNED, error_points becomes 0.00 and the PROVISIONAL index becomes 100.00 with n still 3."

  - name: postseason_eligibility
    trigger: "on every OfficialSeasonRecord recompute and on every Official status or discipline change"
    algorithm: threshold
    formula: |
      postseason_eligible = accuracy_eligible
                            and Official.status == 'ACTIVE'
                            and Official.preseason_cleared == true
                            and count(DisciplineAction of this official with
                                      status IN {OPENED, REMEDIATION_ASSIGNED,
                                                 REASSESSED, ESCALATED}) == 0
    input_set: "the official's OfficialSeasonRecord, its Official row, and that official's DisciplineAction rows"
    constants: {}
    precision: "boolean; all four conjuncts are re-derived on every write that can move any of them"

  - name: crew_strength_index
    trigger: "on POST /crew-assignments, /{id}/confirm, /{id}/withdraw, on the suspension void cascade, on POST /games/{id}/kickoff (PROJECTED) and POST /games/{id}/finalize (REALIZED)"
    algorithm: weighted_scoring
    formula: |
      per_assignment_points(a) = round_half_up(
          min(EXPERIENCE_CAP, a.Official.seasons_experience)
          * TIER_WEIGHT[a.Official.tier]
          * POSITION_WEIGHT[a.position], 2)

      crew_strength_index = round_half_up(
          sum(per_assignment_points(a) for a in included, ordered by a.created_at ASC)
          / SeasonProgram.crew_size_required, 2)
      # The divisor is the REQUIRED crew size, not the number of included
      # assignments: an understaffed crew scores proportionally lower rather than
      # averaging its survivors up.
    input_set: "CrewAssignment rows of one Game, filtered per the active variant below; an empty included set yields exactly 0.00"
    constants:
      EXPERIENCE_CAP: 12
      TIER_WEIGHT_TIER_1: 1.00
      TIER_WEIGHT_TIER_2: 0.80
      TIER_WEIGHT_TIER_3: 0.60
      POSITION_WEIGHT_REFEREE: 1.30
      POSITION_WEIGHT_UMPIRE: 1.00
      POSITION_WEIGHT_DOWN_JUDGE: 0.85
    precision: "2 decimal places, round_half_up, applied per assignment and again to the quotient"
    variants:
      - name: PROJECTED
        when: "any pre-game write and POST /games/{id}/kickoff; written with crew_strength_variant := PROJECTED"
        difference: "Included set = CrewAssignment rows with status IN {PROPOSED, CONFIRMED}. A merely proposed official counts at full weight — the projection assumes the slot holds."
      - name: REALIZED
        when: "POST /games/{id}/finalize; written with crew_strength_variant := REALIZED"
        difference: "Included set = CrewAssignment rows with status == COMPLETED only. Assignments that were WITHDRAWN, SUPERSEDED or VOIDED before kickoff contribute nothing, so a crew that lost a member to a suspension realises a strictly lower index than it projected."
    worked_examples:
      - "REFEREE, TIER_2, seasons_experience 14: min(12,14)=12, 12 * 0.80 * 1.30 = 12.48."
      - "UMPIRE, TIER_2, seasons_experience 6: 6 * 0.80 * 1.00 = 4.80."
      - "Both PROPOSED/CONFIRMED with crew_size_required 2: PROJECTED = (12.48 + 4.80) / 2 = 17.28 / 2 = 8.64."
      - "If the umpire is VOIDED by a suspension and only the referee reaches COMPLETED: REALIZED = 12.48 / 2 = 6.24 (not 12.48 — the required crew size stays the divisor)."
      - "A game whose every assignment was voided: included set empty -> 0.00."

  - name: field_evaluation_score
    trigger: "on POST /advancement-applications/{id}/field-evaluations"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up(
          mechanics_score * W_MECHANICS
        + rules_score    * W_RULES
        + presence_score * W_PRESENCE, 2)

      evaluation_average = round_half_up(
          sum(e.composite_score for e in FieldEvaluation of this application,
              ordered by e.created_at ASC) / count(e), 2)
      # evaluation_average averages the ALREADY-ROUNDED composites, so per-report
      # rounding propagates into the gate.
    input_set: "all FieldEvaluation rows of the application; none are ever excluded, including reports filed before a return"
    constants:
      W_MECHANICS: 0.40
      W_RULES: 0.35
      W_PRESENCE: 0.25
      MIN_EVALUATIONS: 2
      MIN_EVAL_AVERAGE: 75.00
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "(mechanics 80, rules 76, presence 70): 32.00 + 26.60 + 17.50 = 76.10."
      - "(84, 80, 80): 33.60 + 28.00 + 20.00 = 81.60."
      - "Average of 76.10 and 81.60 = 157.70 / 2 = 78.85 >= 75.00, so submit-to-committee passes."
      - "(74, 70, 68): 29.60 + 24.50 + 17.00 = 71.10. Average of 76.10 and 71.10 = 73.60 < 75.00, so submit-to-committee fails with ERR_EVALUATION_REQUIREMENTS_NOT_MET."

  - name: training_deficiency_count
    trigger: "on POST /officials/{id}/training-records and on every retention_score computation"
    algorithm: aggregation
    formula: |
      clinic_shortfall = max(0, SeasonProgram.clinic_attendance_required
                                - count(TrainingRecord where record_type == 'RULES_CLINIC'))
      physical_shortfall = 0 if exists(TrainingRecord where record_type == 'PHYSICAL_TEST'
                                       and passed == true) else 1
      training_deficiency_count = clinic_shortfall + physical_shortfall
    input_set: "all TrainingRecord rows of one Official; clinic attendance is counted regardless of score, physical tests only when passed"
    constants: {}
    precision: "integer >= 0"

  - name: preseason_clearance
    trigger: "on POST /officials/{id}/training-records"
    algorithm: threshold
    formula: |
      passed = (record_type == 'RULES_CLINIC')
               or (record_type == 'PHYSICAL_TEST' and score >= SeasonProgram.physical_test_min_score)
               or (record_type == 'RULES_EXAM'    and score >= SeasonProgram.exam_min_score)

      preseason_cleared = exists(TrainingRecord where record_type == 'PHYSICAL_TEST' and passed)
                          and exists(TrainingRecord where record_type == 'RULES_EXAM' and passed)
      # Deliberately independent of RULES_CLINIC attendance: an official can be
      # preseason_cleared and assignable while still carrying a clinic
      # deficiency that costs them retention points.
    input_set: "all TrainingRecord rows of one Official"
    constants:
      DEFAULT_PHYSICAL_TEST_MIN_SCORE: 70.00
      DEFAULT_EXAM_MIN_SCORE: 80.00
      DEFAULT_CLINIC_ATTENDANCE_REQUIRED: 1
    precision: "boolean; scores compared with >= so a score exactly equal to the minimum passes. A RULES_CLINIC record ignores score entirely and always stores passed == true."

  - name: retention_score
    trigger: "on POST /season-programs/{id}/lock-postseason, after the FINAL accuracy_index recompute"
    algorithm: weighted_scoring
    formula: |
      completed  = count(CrewAssignment of this official with status == 'COMPLETED')
      obligated  = count(CrewAssignment of this official with status IN
                         {'COMPLETED', 'VOIDED', 'WITHDRAWN'})
      availability_component = round_half_up(100.00 * completed / max(1, obligated), 2)

      raw_score = round_half_up(accuracy_index * W_ACCURACY
                              + availability_component * W_AVAILABILITY, 2)

      # Mode (c): the penalty BAND is selected from raw_score, i.e. from the
      # pre-penalty value. Selecting the band from the post-penalty composite is
      # the wrong reading and yields a different recommendation.
      if raw_score >= BAND_HIGH_FLOOR:        penalty_rate = PENALTY_HIGH
      elif raw_score >= BAND_MID_FLOOR:       penalty_rate = PENALTY_MID
      else:                                   penalty_rate = PENALTY_LOW

      retention_score = max(0.00, round_half_up(
          raw_score - penalty_rate * training_deficiency_count, 2))

      if retention_score >= RETAIN_FLOOR:     retention_recommendation = 'RETAIN'
      elif retention_score >= DEVELOP_FLOOR:  retention_recommendation = 'DEVELOP'
      else:                                   retention_recommendation = 'RELEASE'
    input_set: "one OfficialSeasonRecord after its FINAL accuracy_index is written, plus that official's CrewAssignment and TrainingRecord rows"
    constants:
      W_ACCURACY: 0.70
      W_AVAILABILITY: 0.30
      BAND_HIGH_FLOOR: 90.00
      BAND_MID_FLOOR: 80.00
      PENALTY_HIGH: 2.00
      PENALTY_MID: 5.00
      PENALTY_LOW: 9.00
      RETAIN_FLOOR: 90.00
      DEVELOP_FLOOR: 75.00
      SCORE_FLOOR: 0.00
    precision: "2 decimal places, round_half_up; the floor clamps at exactly 0.00 so a heavily deficient official never scores negative"
    worked_examples:
      - "accuracy_index 95.00, one COMPLETED and one VOIDED assignment: availability = 100.00 * 1 / 2 = 50.00. raw = 95.00*0.70 + 50.00*0.30 = 66.50 + 15.00 = 81.50."
      - "raw 81.50 falls in the 80.00..<90.00 band -> penalty_rate 5.00. With training_deficiency_count 1: retention_score = 81.50 - 5.00 = 76.50 -> DEVELOP."
      - "Reading the band off the composite instead would give 81.50 - 5.00 = 76.50, then re-band 76.50 into the <80.00 band -> 81.50 - 9.00 = 72.50 -> RELEASE. The circular reading changes both the score and the recommendation."
      - "An official with no assignments at all: obligated 0, max(1,0)=1, completed 0, availability = 0.00 (never a divide-by-zero)."

  - name: assignment_occupancy_window
    trigger: "on POST /crew-assignments, before the assignment row is written"
    algorithm: interval_merge
    formula: |
      occupied_from_utc  = Game.kickoff_utc - SeasonProgram.travel_lead_hours
      occupied_until_utc = Game.kickoff_utc + GAME_DURATION_HOURS
                                            + SeasonProgram.min_rest_hours_between_games

      # HALF-OPEN interval semantics [from, until): two windows conflict iff
      #   new.occupied_from_utc <  existing.occupied_until_utc
      #   AND existing.occupied_from_utc <  new.occupied_until_utc
      # Exact adjacency (new.from == existing.until) does NOT conflict.
      conflict = exists(CrewAssignment of the same official with
                        status IN {'PROPOSED', 'CONFIRMED', 'COMPLETED'}
                        and the half-open test above holds)
    input_set: "the acting official's CrewAssignment rows in {PROPOSED, CONFIRMED, COMPLETED}; WITHDRAWN, SUPERSEDED and VOIDED rows free the window immediately"
    constants:
      GAME_DURATION_HOURS: 4
      DEFAULT_TRAVEL_LEAD_HOURS: 24
      DEFAULT_MIN_REST_HOURS_BETWEEN_GAMES: 96
    precision: "whole seconds, UTC; comparisons are strict (<) at both ends"
    worked_examples:
      - "kickoff 2026-09-13T17:00:00Z with defaults: occupied_from 2026-09-12T17:00:00Z, occupied_until 2026-09-13T21:00:00Z + 96h = 2026-09-17T21:00:00Z."
      - "A second game at kickoff 2026-09-18T21:00:00Z has occupied_from 2026-09-17T21:00:00Z == the first window's occupied_until: half-open semantics allow it (201)."
      - "A second game at kickoff 2026-09-18T20:59:00Z has occupied_from 2026-09-17T20:59:00Z < 2026-09-17T21:00:00Z: one minute of overlap is enough for ERR_OFFICIAL_WINDOW_CONFLICT."

  - name: team_rotation_exposure
    trigger: "on POST /crew-assignments, after the occupancy check"
    algorithm: aggregation
    formula: |
      for team in {Game.home_team_code, Game.away_team_code}:
          exposures = count(CrewAssignment of the same official with
                            status IN {'PROPOSED', 'CONFIRMED', 'COMPLETED'}
                            and (Game.home_team_code == team or Game.away_team_code == team)
                            and Game.season_program_id == this game's season_program_id)
          if exposures >= SeasonProgram.max_team_exposures_per_season:
              reject with ERR_TEAM_ROTATION_LIMIT
      # The assignment under test is not yet counted; the cap is on prior
      # exposures, so max_team_exposures_per_season == 2 permits exactly two
      # games against a team and rejects the third.
    input_set: "the official's non-released assignments within the same SeasonProgram, joined to their Games"
    constants:
      DEFAULT_MAX_TEAM_EXPOSURES_PER_SEASON: 2
    precision: "integer count; both teams of the target game are tested and either one may trip the cap"

  - name: replay_station_concurrency
    trigger: "on POST /replay-reviews, before the review row is written"
    algorithm: interval_merge
    formula: |
      window_open_utc  = logical clock at creation
      window_close_utc = window_open_utc + SeasonProgram.replay_decision_limit_seconds

      # CLOSED interval [open, close] semantics, deliberately different from
      # assignment_occupancy_window: two review windows conflict iff
      #   new.window_open_utc <= existing.window_close_utc
      #   AND existing.window_open_utc <= new.window_close_utc
      # Touching endpoints DO conflict here.
      overlapping = count(ReplayReview on the same station with status == 'INITIATED'
                          and the closed test above holds)
      if overlapping >= ReplayStation.concurrent_capacity:
          reject with ERR_REPLAY_STATION_AT_CAPACITY
      # Aggregate capacity, not pairwise exclusion: a station with
      # concurrent_capacity 2 accepts a second overlapping review and rejects
      # only the third.
    input_set: "ReplayReview rows on one ReplayStation with status == INITIATED; DECIDED and EXPIRED reviews release capacity"
    constants:
      DEFAULT_REPLAY_DECISION_LIMIT_SECONDS: 120
      DEFAULT_CONCURRENT_CAPACITY: 1
    precision: "whole seconds, UTC; comparisons are inclusive (<=) at both ends"
    worked_examples:
      - "Review A opened at 2026-09-13T18:00:00Z closes at 2026-09-13T18:02:00Z. A second review on the same capacity-1 station opened at exactly 18:02:00Z touches the close instant and IS rejected with ERR_REPLAY_STATION_AT_CAPACITY."
      - "The same second review opened at 18:02:01Z does not touch the window and succeeds (201)."
      - "On a capacity-2 station, a review opened at 18:01:00Z succeeds (overlapping count 1 < 2) and a third at 18:01:30Z is rejected (overlapping count 2 >= 2)."

  - name: replay_decision_elapsed
    trigger: "on POST /replay-reviews/{id}/decide and on the mark-played expiry sweep"
    algorithm: threshold
    formula: |
      elapsed_seconds = whole seconds from ReplayReview.window_open_utc to the logical clock
      if elapsed_seconds <= SeasonProgram.replay_decision_limit_seconds:
          status = 'DECIDED';  decision = requested decision
      else:
          status = 'EXPIRED';  decision = null   # requested decision discarded, still HTTP 200
    input_set: "one ReplayReview row and the logical clock"
    constants:
      DEFAULT_REPLAY_DECISION_LIMIT_SECONDS: 120
    precision: "whole seconds; the boundary is inclusive, so exactly 120 elapsed seconds still DECIDES and 121 EXPIRES"
    worked_examples:
      - "window_open 2026-09-13T18:00:00Z, clock 2026-09-13T18:02:00Z: elapsed 120 <= 120 -> DECIDED with the requested decision and elapsed_seconds 120."
      - "clock 2026-09-13T18:02:01Z: elapsed 121 > 120 -> EXPIRED, decision null, elapsed_seconds 121."

  - name: appeal_window
    trigger: "on POST /grade-appeals"
    algorithm: threshold
    formula: |
      deadline = PlayGrade.posted_at + SeasonProgram.appeal_window_hours
      if logical clock > deadline:
          reject with ERR_APPEAL_WINDOW_CLOSED
      # Inclusive boundary: an appeal filed at exactly the deadline instant is
      # accepted. posted_at, not created_at, starts the clock — a grade can sit
      # in DRAFT indefinitely without burning appeal time.
    input_set: "one PlayGrade row and the logical clock"
    constants:
      DEFAULT_APPEAL_WINDOW_HOURS: 72
    precision: "whole seconds, UTC; comparison is strict (>) so the deadline instant itself is in-window"

  - name: appeal_credit_ledger
    trigger: "on POST /grade-appeals (debit) and POST /grade-appeals/{id}/withdraw (credit)"
    algorithm: aggregation
    formula: |
      # Conserved quantity: for every Official at all times
      #   appeal_credits_remaining
      #   + count(GradeAppeal on that official's PlayGrades with status IN
      #           {SUBMITTED, UNDER_REVIEW, UPHELD, OVERTURNED, MODIFIED})
      #   == SeasonProgram.appeal_credits_per_official
      on create:   appeal_credits_remaining -= 1   # rejected with
                                                   # ERR_APPEAL_CREDITS_EXHAUSTED when already 0
      on withdraw: appeal_credits_remaining += 1   # WITHDRAWN appeals leave the consuming set
    input_set: "all GradeAppeal rows whose PlayGrade.official_id is this official"
    constants:
      DEFAULT_APPEAL_CREDITS_PER_OFFICIAL: 3
    precision: "integer in [0, appeal_credits_per_official]; a decided appeal (UPHELD/OVERTURNED/MODIFIED) keeps consuming its credit forever — only a withdrawal refunds"

  - name: crew_posture_derivation
    trigger: "on any CrewAssignment status change while Game.status == SCHEDULED, and on POST /games/{id}/kickoff"
    algorithm: threshold
    formula: |
      if Game.status != 'SCHEDULED':
          crew_posture = 'LOCKED'      # frozen from kickoff onward
      elif confirmed_crew_count >= SeasonProgram.crew_size_required:
          crew_posture = 'STAFFED'
      else:
          crew_posture = 'UNDERSTAFFED'
      # confirmed_crew_count counts only status == CONFIRMED assignments; a
      # PROPOSED assignment contributes to crew_strength_index (PROJECTED) but
      # never to posture.
    input_set: "CrewAssignment rows of one Game with status == CONFIRMED"
    constants:
      DEFAULT_CREW_SIZE_REQUIRED: 2
    precision: "enum; the >= comparison means an over-confirmed crew stays STAFFED rather than erroring"

  - name: advancement_criteria
    trigger: "on POST /advancement-applications/{id}/screen"
    algorithm: threshold
    formula: |
      ok = Official.status == 'ACTIVE'
           and Official.preseason_cleared == true
           and TIER_ORDER[target_tier] == TIER_ORDER[Official.tier] + 1
           and Official.seasons_experience >= MIN_EXPERIENCE_FOR_TIER[target_tier]
           and OfficialSeasonRecord.accuracy_index >= ADVANCEMENT_MIN_ACCURACY
      if not ok: reject with ERR_ADVANCEMENT_CRITERIA_NOT_MET
    input_set: "the applicant Official and that official's OfficialSeasonRecord for the application's season program"
    constants:
      TIER_ORDER_TIER_3: 1
      TIER_ORDER_TIER_2: 2
      TIER_ORDER_TIER_1: 3
      MIN_EXPERIENCE_FOR_TIER_2: 5
      MIN_EXPERIENCE_FOR_TIER_1: 8
      ADVANCEMENT_MIN_ACCURACY: 90.00
    precision: "boolean; all comparisons use >= so an official sitting exactly on a floor qualifies. An official with no graded plays reads accuracy_index 100.00 and passes the accuracy gate."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority; the
# first violated rule determines the response and no later rule is evaluated)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: shape
    check: "request body has every required input field, no unknown fields are honored, every enum value is declared, every decimal is >= 0.00 and <= 100.00 where it is a score, every timestamp parses as an ISO-8601 UTC instant, integers are non-negative, and MODIFIED appeal decisions carry a revised_grade_code different from the current grade_code"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every id referenced by the path, then every id referenced by the body, resolves to a live row — checked left-to-right in path order first, then in the body field order declared by the endpoint's input list"
    error_id: "ERR_SEASON_PROGRAM_NOT_FOUND | ERR_OFFICIAL_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_GAME_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_PLAY_GRADE_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_REPLAY_STATION_NOT_FOUND | ERR_REPLAY_REVIEW_NOT_FOUND | ERR_POOL_REPORT_NOT_FOUND | ERR_DISCIPLINE_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id or an FK body field"

  - priority: 5
    category: ownership
    check: "for POST /grade-appeals and POST /grade-appeals/{id}/withdraw acting as role Official, X-User-ID equals PlayGrade.official_id of the appealed grade"
    error_id: ERR_NOT_GRADE_OWNER
    http_status: 403
    applies_to: "POST /grade-appeals, POST /grade-appeals/{id}/withdraw"

  - priority: 6
    category: business_referential
    check: "the GradingSupervisor deciding an appeal is not the supervisor who graded the play — X-User-ID != PlayGrade.graded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /grade-appeals/{id}/start-review, POST /grade-appeals/{id}/decide"

  - priority: 7
    category: state
    check: "the owning SeasonProgram.status == OPEN for every business write below the program"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 409
    applies_to: "all POSTs except POST /_clock/set_current_utc, POST /season-programs, POST /season-programs/{id}/open, POST /season-programs/{id}/lock-postseason, POST /replay-stations"

  - priority: 8
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2 (includes the SeasonProgram CONFIGURING/OPEN gate on open and lock-postseason, and the ReplayStation status gate is NOT part of this rule)"
    error_id: "ERR_GAME_STATE_INVALID | ERR_ASSIGNMENT_STATE_INVALID | ERR_APPLICATION_STATE_INVALID | ERR_GRADE_STATE_INVALID | ERR_APPEAL_STATE_INVALID | ERR_REVIEW_STATE_INVALID | ERR_DISCIPLINE_STATE_INVALID | ERR_REPORT_STATE_INVALID | ERR_SEASON_NOT_OPEN"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 9
    category: state
    check: "expected_<parent>_version in the body equals the parent's current version (§1.2.1 OCC)"
    error_id: "ERR_STALE_GAME_VERSION | ERR_STALE_OFFICIAL_VERSION"
    http_status: 412
    applies_to: "POST /crew-assignments, POST /discipline-actions"

  - priority: 10
    category: business_safety
    check: "the official's half-open occupancy window for the target game does not overlap any of that official's assignments in {PROPOSED, CONFIRMED, COMPLETED} (calculations.assignment_occupancy_window). Fatigue safety outranks every rotation, conflict-of-interest and quota rule below."
    error_id: ERR_OFFICIAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 11
    category: business_safety
    check: "the official being assigned or confirmed has status == ACTIVE"
    error_id: ERR_OFFICIAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /crew-assignments, POST /crew-assignments/{id}/confirm"

  - priority: 12
    category: business_safety
    check: "the official being assigned or confirmed has preseason_cleared == true"
    error_id: ERR_PRESEASON_NOT_CLEARED
    http_status: 409
    applies_to: "POST /crew-assignments, POST /crew-assignments/{id}/confirm"

  - priority: 13
    category: business_referential
    check: "Official.affiliated_team_code is neither Game.home_team_code nor Game.away_team_code"
    error_id: ERR_TEAM_CONFLICT_OF_INTEREST
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 14
    category: business_constraint
    check: "prior exposures to either team of the target game are below SeasonProgram.max_team_exposures_per_season (calculations.team_rotation_exposure)"
    error_id: ERR_TEAM_ROTATION_LIMIT
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 15
    category: business_constraint
    check: "no CONFIRMED assignment already occupies the requested position on the target game (a PROPOSED one is superseded instead of rejected)"
    error_id: ERR_POSITION_ALREADY_CONFIRMED
    http_status: 409
    applies_to: "POST /crew-assignments"

  - priority: 16
    category: business_constraint
    check: "no PlayGrade already exists for the same (game_id, official_id, play_ref) triple in a non-terminal or terminal state"
    error_id: ERR_DUPLICATE_PLAY_GRADE
    http_status: 409
    applies_to: "POST /play-grades"

  - priority: 17
    category: business_referential
    check: "the graded official held a CrewAssignment on the target game with status IN {CONFIRMED, COMPLETED}"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /play-grades"

  - priority: 18
    category: business_constraint
    check: "the requested ReplayReview.category appears in SeasonProgram.reviewable_categories"
    error_id: ERR_CATEGORY_NOT_REVIEWABLE
    http_status: 422
    applies_to: "POST /replay-reviews"

  - priority: 19
    category: business_constraint
    check: "the target ReplayStation.status == ONLINE"
    error_id: ERR_REPLAY_STATION_OFFLINE
    http_status: 409
    applies_to: "POST /replay-reviews"

  - priority: 20
    category: business_constraint
    check: "overlapping INITIATED reviews on the station are strictly fewer than ReplayStation.concurrent_capacity under closed-interval semantics (calculations.replay_station_concurrency)"
    error_id: ERR_REPLAY_STATION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /replay-reviews"

  - priority: 21
    category: business_constraint
    check: "Game.crew_posture == STAFFED at kickoff"
    error_id: ERR_CREW_NOT_STAFFED
    http_status: 409
    applies_to: "POST /games/{id}/kickoff"

  - priority: 22
    category: business_constraint
    check: "the applicant satisfies every advancement criterion (calculations.advancement_criteria)"
    error_id: ERR_ADVANCEMENT_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /advancement-applications/{id}/screen"

  - priority: 23
    category: business_constraint
    check: "the application carries at least MIN_EVALUATIONS + return_count FieldEvaluation reports whose evaluation_average >= MIN_EVAL_AVERAGE (calculations.field_evaluation_score)"
    error_id: ERR_EVALUATION_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /advancement-applications/{id}/submit-to-committee"

  - priority: 24
    category: business_referential
    check: "the PlayGrade cited by a pool report has grade_status == FINAL and appeal_state != APPEAL_PENDING"
    error_id: ERR_CITED_GRADE_NOT_FINAL
    http_status: 409
    applies_to: "POST /pool-reports/{id}/publish"

  - priority: 25
    category: business_constraint
    check: "DisciplineAction.remediation_cycle_count < REMEDIATION_CYCLE_LIMIT (2) before a further remediation cycle is assigned"
    error_id: ERR_REMEDIATION_CYCLE_LIMIT
    http_status: 409
    applies_to: "POST /discipline-actions/{id}/assign-remediation"

  - priority: 26
    category: business_temporal
    check: "the logical clock is at or before PlayGrade.posted_at + SeasonProgram.appeal_window_hours (calculations.appeal_window). Ranked BELOW the grade-state rule at priority 8 on purpose: a grade that was never posted reports ERR_GRADE_STATE_INVALID, not a closed window."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /grade-appeals"

  - priority: 27
    category: business_fiscal
    check: "Official.appeal_credits_remaining >= 1 (calculations.appeal_credit_ledger). Ranked BELOW the appeal window on purpose: an out-of-window appeal by a credit-less official reports the window error."
    error_id: ERR_APPEAL_CREDITS_EXHAUSTED
    http_status: 409
    applies_to: "POST /grade-appeals"

  - priority: 28
    category: business_constraint
    check: "no Game of the season program has status == IN_PROGRESS when the postseason is locked"
    error_id: ERR_GAMES_IN_PROGRESS
    http_status: 409
    applies_to: "POST /season-programs/{id}/lock-postseason"

# =============================================================================
# §1.5 API Endpoint Table (all paths are top-level; api_prefix is "/")
# =============================================================================
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to the supplied UTC instant. Every deadline, window and elapsed-time rule in this domain reads this clock and never the wall clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (server startup default); it MUST NOT fall back to real wall-clock time."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock; no entity is mutated and no expiry sweep runs on its own"

  # --- season programs ------------------------------------------------------
  - method: POST
    path: "/season-programs"
    description: "Creates a season program in CONFIGURING with every governing threshold either supplied or defaulted."
    roles: [OfficiatingDirector]
    code: 201
    input: [season_year, "accuracy_eligibility_threshold?", "min_graded_plays_for_eligibility?", "appeal_credits_per_official?", "appeal_window_hours?", "replay_decision_limit_seconds?", "reviewable_categories?", "max_team_exposures_per_season?", "min_rest_hours_between_games?", "travel_lead_hours?", "crew_size_required?", "max_application_returns?", "physical_test_min_score?", "exam_min_score?", "clinic_attendance_required?"]
    output: SeasonProgram
    side_effects:
      - "sets status := CONFIGURING and eligible_official_count := 0"

  - method: POST
    path: "/season-programs/{id}/open"
    description: "Opens the program for officiating operations (§1.2 SeasonProgram CONFIGURING -> OPEN)."
    roles: [OfficiatingDirector]
    code: 200
    input: []
    output: SeasonProgram
    side_effects:
      - "sets status := OPEN"
      - "increments SeasonProgram.version by 1"

  - method: POST
    path: "/season-programs/{id}/lock-postseason"
    description: "Closes the season: recomputes every OfficialSeasonRecord with the FINAL accuracy variant, derives retention scores and recommendations, releases RELEASE-recommended officials, and publishes the eligible count."
    roles: [OfficiatingDirector]
    code: 200
    input: []
    output: SeasonProgram
    side_effects:
      - "rejects with ERR_GAMES_IN_PROGRESS while any Game of the program is IN_PROGRESS"
      - "recomputes each OfficialSeasonRecord with calculations.accuracy_index FINAL variant and sets accuracy_variant := FINAL"
      - "recomputes accuracy_eligible and postseason_eligible on each record"
      - "computes availability_component, retention_score and retention_recommendation via calculations.retention_score"
      - "sets Official.status := RELEASED for every RELEASE recommendation and voids that official's PROPOSED/CONFIRMED assignments"
      - "sets eligible_official_count := count of records with postseason_eligible == true"
      - "sets status := POSTSEASON_LOCKED and increments SeasonProgram.version by 1"

  - method: GET
    path: "/season-programs/{id}"
    description: "Reads one season program including eligible_official_count."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: SeasonProgram
    side_effects: []

  # --- officials ------------------------------------------------------------
  - method: POST
    path: "/officials"
    description: "Registers an official in CANDIDATE status under an OPEN season program and opens that official's season record."
    roles: [OfficiatingDirector]
    code: 201
    input: [season_program_id, full_name, position, seasons_experience, home_market_code, "tier?", "affiliated_team_code?"]
    output: Official
    side_effects:
      - "sets status := CANDIDATE, preseason_cleared := false, open_assignment_count := 0"
      - "sets appeal_credits_remaining := SeasonProgram.appeal_credits_per_official"
      - "creates the official's OfficialSeasonRecord for this season program with graded_play_count 0, weighted_error_points 0.00, accuracy_index 100.00, accuracy_variant PROVISIONAL, accuracy_eligible false, postseason_eligible false, retention_recommendation DEVELOP (discoverable via GET /season-records)"

  - method: GET
    path: "/officials/{id}"
    description: "Reads one official including preseason_cleared, appeal_credits_remaining and open_assignment_count. Its `version` is the value POST /discipline-actions expects in expected_official_version."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: Official
    side_effects: []

  - method: GET
    path: "/officials"
    description: "Lists officials with filters."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["season_program_id?", "status?", "position?", "tier?", "affiliated_team_code?", "limit?", "offset?"]
    output: Official[]
    side_effects: []

  - method: POST
    path: "/officials/{id}/training-records"
    description: "Records a rules clinic, physical test or rules exam result for an official and re-derives preseason clearance."
    roles: [TrainingCoordinator]
    code: 201
    input: [record_type, session_code, "score?"]
    output: TrainingRecord
    side_effects:
      - "sets passed per calculations.preseason_clearance (RULES_CLINIC always passes and ignores score; PHYSICAL_TEST and RULES_EXAM compare score against the program minimum with >=)"
      - "re-derives Official.preseason_cleared"
      - "transitions Official CANDIDATE -> ACTIVE and increments Official.version by 1 as soon as a passed RULES_EXAM exists; preseason_cleared stays false until a passed PHYSICAL_TEST also exists, so an ACTIVE official can still be rejected with ERR_PRESEASON_NOT_CLEARED"

  - method: GET
    path: "/officials/{id}/training-records"
    description: "Lists an official's training records (the only discovery channel for this immutable child)."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["record_type?", "passed?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []

  # --- advancement pipeline -------------------------------------------------
  - method: POST
    path: "/advancement-applications"
    description: "An official applies for advancement to the next tier."
    roles: [Official]
    code: 201
    input: [official_id, target_tier]
    output: AdvancementApplication
    side_effects:
      - "sets status := SUBMITTED, return_count := 0, evaluation_average := null"

  - method: POST
    path: "/advancement-applications/{id}/screen"
    description: "Field evaluation staff screen the application against the advancement criteria (SUBMITTED -> SCREENED)."
    roles: [FieldEvaluator]
    code: 200
    input: []
    output: AdvancementApplication
    side_effects:
      - "rejects with ERR_ADVANCEMENT_CRITERIA_NOT_MET when calculations.advancement_criteria fails"
      - "sets screened_at := logical clock and status := SCREENED"
      - "increments AdvancementApplication.version by 1"

  - method: POST
    path: "/advancement-applications/{id}/field-evaluations"
    description: "Files an immutable field evaluation report against a screened or returned application."
    roles: [FieldEvaluator]
    code: 201
    input: [mechanics_score, rules_score, presence_score]
    output: FieldEvaluation
    side_effects:
      - "sets evaluator_user_id := X-User-ID"
      - "computes composite_score per calculations.field_evaluation_score"
      - "recomputes AdvancementApplication.evaluation_average over the already-rounded composites and increments AdvancementApplication.version by 1"

  - method: GET
    path: "/advancement-applications/{id}/field-evaluations"
    description: "Lists the field evaluation reports filed against an application."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: FieldEvaluation[]
    side_effects: []

  - method: POST
    path: "/advancement-applications/{id}/submit-to-committee"
    description: "Advances a screened or returned application to committee review once the evaluation floor is met."
    roles: [FieldEvaluator]
    code: 200
    input: []
    output: AdvancementApplication
    side_effects:
      - "rejects with ERR_EVALUATION_REQUIREMENTS_NOT_MET when fewer than MIN_EVALUATIONS + return_count reports exist or evaluation_average < MIN_EVAL_AVERAGE"
      - "sets status := COMMITTEE_REVIEW and increments AdvancementApplication.version by 1"

  - method: POST
    path: "/advancement-applications/{id}/return-for-tape"
    description: "Returns an application for more tape; the same call auto-denies once the return cap is already reached."
    roles: [OfficiatingDirector]
    code: 200
    input: [note]
    output: AdvancementApplication
    side_effects:
      - "when return_count < SeasonProgram.max_application_returns: increments return_count by 1 and sets status := RETURNED_FOR_TAPE"
      - "when return_count == SeasonProgram.max_application_returns: leaves return_count unchanged and sets status := DENIED"
      - "sets decision_note := note and increments AdvancementApplication.version by 1"

  - method: POST
    path: "/advancement-applications/{id}/decide"
    description: "Committee decision on an application under review."
    roles: [OfficiatingDirector]
    code: 200
    input: [outcome, "note?"]
    output: AdvancementApplication
    side_effects:
      - "outcome is one of APPROVED or DENIED; any other value is ERR_INVALID_REQUEST"
      - "on APPROVED: sets Official.tier := target_tier and increments Official.version by 1"
      - "sets decision_note := note when supplied and increments AdvancementApplication.version by 1"

  - method: GET
    path: "/advancement-applications/{id}"
    description: "Reads one advancement application including return_count and evaluation_average."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: AdvancementApplication
    side_effects: []

  - method: GET
    path: "/advancement-applications"
    description: "Lists advancement applications with filters."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["official_id?", "status?", "target_tier?", "limit?", "offset?"]
    output: AdvancementApplication[]
    side_effects: []

  # --- games ----------------------------------------------------------------
  - method: POST
    path: "/games"
    description: "Schedules a game under an OPEN season program."
    roles: [OfficiatingDirector]
    code: 201
    input: [season_program_id, home_team_code, away_team_code, venue_market_code, kickoff_utc]
    output: Game
    side_effects:
      - "sets status := SCHEDULED, crew_posture := UNDERSTAFFED, confirmed_crew_count := 0, crew_strength_index := 0.00, crew_strength_variant := PROJECTED"
      - "rejects with ERR_INVALID_REQUEST when home_team_code == away_team_code"

  - method: POST
    path: "/games/{id}/kickoff"
    description: "Starts the game; the crew must be STAFFED and the roster locks."
    roles: [OfficiatingDirector]
    code: 200
    input: []
    output: Game
    side_effects:
      - "rejects with ERR_CREW_NOT_STAFFED when crew_posture != STAFFED"
      - "sets status := IN_PROGRESS and crew_posture := LOCKED"
      - "recomputes crew_strength_index with the PROJECTED variant and sets crew_strength_variant := PROJECTED"
      - "increments Game.version by 1"

  - method: POST
    path: "/games/{id}/mark-played"
    description: "Ends play: completes the confirmed crew and expires any replay review still open."
    roles: [OfficiatingDirector]
    code: 200
    input: []
    output: Game
    side_effects:
      - "sets status := PLAYED"
      - "transitions every CONFIRMED CrewAssignment of the game to COMPLETED in created_at ASC order and decrements each official's open_assignment_count"
      - "transitions every INITIATED ReplayReview of the game to EXPIRED with decision null and elapsed_seconds set, decrementing each station's active_review_count"
      - "increments Game.version by 1"

  - method: POST
    path: "/games/{id}/finalize"
    description: "Finalizes the game: posted grades become FINAL unless frozen by a pending appeal, and the crew strength index switches to its REALIZED variant."
    roles: [OfficiatingDirector]
    code: 200
    input: []
    output: Game
    side_effects:
      - "sets status := FINALIZED"
      - "transitions every POSTED PlayGrade with appeal_state != APPEAL_PENDING to FINAL in created_at ASC order; grades under a pending appeal stay POSTED"
      - "recomputes crew_strength_index with the REALIZED variant over COMPLETED assignments and sets crew_strength_variant := REALIZED"
      - "recomputes each graded official's OfficialSeasonRecord with the PROVISIONAL accuracy variant"
      - "increments Game.version by 1"

  - method: GET
    path: "/games/{id}"
    description: "Reads one game including crew_posture, confirmed_crew_count, crew_strength_index and crew_strength_variant. Its `version` is the value POST /crew-assignments expects in expected_game_version."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: Game
    side_effects: []

  - method: GET
    path: "/games"
    description: "Lists games with filters."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["season_program_id?", "status?", "crew_posture?", "home_team_code?", "away_team_code?", "limit?", "offset?"]
    output: Game[]
    side_effects: []

  # --- crew assignments -----------------------------------------------------
  - method: POST
    path: "/crew-assignments"
    description: "Proposes an official for a position on a scheduled game. Carries OCC on the parent game because a create legitimately supersedes an existing PROPOSED assignment for the same position (§1.2.1 assignment-create-stale-game)."
    roles: [CrewScheduler]
    code: 201
    input: [game_id, official_id, position, expected_game_version]
    output: CrewAssignment
    side_effects:
      - "rejects with ERR_STALE_GAME_VERSION (412) when expected_game_version != Game.version"
      - "computes occupied_from_utc and occupied_until_utc per calculations.assignment_occupancy_window and rejects with ERR_OFFICIAL_WINDOW_CONFLICT on half-open overlap with the official's PROPOSED/CONFIRMED/COMPLETED assignments"
      - "rejects with ERR_OFFICIAL_NOT_ACTIVE, ERR_PRESEASON_NOT_CLEARED, ERR_TEAM_CONFLICT_OF_INTEREST, ERR_TEAM_ROTATION_LIMIT or ERR_POSITION_ALREADY_CONFIRMED per §1.4 priorities 11-15"
      - "supersedes an existing PROPOSED assignment for the same (game_id, position), setting it SUPERSEDED with released_at and decrementing that official's open_assignment_count"
      - "sets status := PROPOSED and increments the new official's open_assignment_count by 1"
      - "recomputes Game.crew_strength_index with the PROJECTED variant"
      - "increments Game.version by 1"

  - method: POST
    path: "/crew-assignments/{id}/confirm"
    description: "Confirms a proposed assignment, which is what makes the crew count toward posture."
    roles: [CrewScheduler]
    code: 200
    input: []
    output: CrewAssignment
    side_effects:
      - "rejects with ERR_OFFICIAL_NOT_ACTIVE or ERR_PRESEASON_NOT_CLEARED when the official is no longer assignable"
      - "sets status := CONFIRMED"
      - "increments Game.confirmed_crew_count by 1, re-derives Game.crew_posture per calculations.crew_posture_derivation and recomputes crew_strength_index (PROJECTED)"
      - "increments Game.version by 1"

  - method: POST
    path: "/crew-assignments/{id}/withdraw"
    description: "Withdraws a proposed or confirmed assignment before kickoff; a confirmed withdrawal walks the posture cascade back."
    roles: [CrewScheduler]
    code: 200
    input: ["reason?"]
    output: CrewAssignment
    side_effects:
      - "sets status := WITHDRAWN and released_at := logical clock"
      - "decrements Official.open_assignment_count by 1"
      - "when the assignment was CONFIRMED: decrements Game.confirmed_crew_count by 1 and re-derives crew_posture (STAFFED -> UNDERSTAFFED when the count falls below crew_size_required)"
      - "recomputes Game.crew_strength_index with the PROJECTED variant"
      - "increments Game.version by 1"

  - method: GET
    path: "/crew-assignments/{id}"
    description: "Reads one crew assignment including its computed occupancy window."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/crew-assignments"
    description: "Lists crew assignments with filters; the discovery channel for assignments voided or superseded by a cascade."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["game_id?", "official_id?", "status?", "position?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  # --- play grading ---------------------------------------------------------
  - method: POST
    path: "/play-grades"
    description: "Grades one play by one official against the rulebook standard; created in DRAFT so error points are not yet in the season record."
    roles: [GradingSupervisor]
    code: 201
    input: [game_id, official_id, play_ref, call_category, grade_code, impact]
    output: PlayGrade
    side_effects:
      - "sets graded_by_user_id := X-User-ID, grade_status := DRAFT, appeal_state := NOT_APPEALED, posted_at := null"
      - "computes error_points per calculations.play_error_points"
      - "rejects with ERR_DUPLICATE_PLAY_GRADE for a repeat (game_id, official_id, play_ref) and with ERR_ASSIGNMENT_STATE_INVALID when the official held no CONFIRMED/COMPLETED assignment on that game"

  - method: POST
    path: "/play-grades/{id}/post"
    description: "Posts a draft grade to the official, opening the appeal window and folding the error points into the season record."
    roles: [GradingSupervisor]
    code: 200
    input: []
    output: PlayGrade
    side_effects:
      - "sets grade_status := POSTED and posted_at := logical clock"
      - "recomputes the official's OfficialSeasonRecord (graded_play_count, weighted_error_points, accuracy_index PROVISIONAL, accuracy_eligible, postseason_eligible)"
      - "increments PlayGrade.version by 1"

  - method: GET
    path: "/play-grades/{id}"
    description: "Reads one play grade including error_points, grade_status and appeal_state."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: PlayGrade
    side_effects: []

  - method: GET
    path: "/play-grades"
    description: "Lists play grades with filters."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["game_id?", "official_id?", "grade_status?", "appeal_state?", "grade_code?", "limit?", "offset?"]
    output: PlayGrade[]
    side_effects: []

  # --- appeals --------------------------------------------------------------
  - method: POST
    path: "/grade-appeals"
    description: "The graded official appeals a posted grade, spending one appeal credit."
    roles: [Official]
    code: 201
    input: [play_grade_id, basis_note]
    output: GradeAppeal
    side_effects:
      - "rejects with ERR_NOT_GRADE_OWNER when X-User-ID != PlayGrade.official_id"
      - "rejects with ERR_GRADE_STATE_INVALID unless grade_status == POSTED and appeal_state == NOT_APPEALED"
      - "rejects with ERR_APPEAL_WINDOW_CLOSED past posted_at + appeal_window_hours, then with ERR_APPEAL_CREDITS_EXHAUSTED when appeal_credits_remaining == 0"
      - "sets status := SUBMITTED and submitted_at := logical clock"
      - "sets PlayGrade.appeal_state := APPEAL_PENDING and increments PlayGrade.version by 1"
      - "decrements Official.appeal_credits_remaining by 1 and increments Official.version by 1"

  - method: POST
    path: "/grade-appeals/{id}/start-review"
    description: "A grading supervisor other than the grader takes the appeal under review."
    roles: [GradingSupervisor]
    code: 200
    input: []
    output: GradeAppeal
    side_effects:
      - "rejects with ERR_SEGREGATION_OF_DUTIES when X-User-ID == PlayGrade.graded_by_user_id"
      - "sets status := UNDER_REVIEW and increments GradeAppeal.version by 1"

  - method: POST
    path: "/grade-appeals/{id}/decide"
    description: "Resolves an appeal under review; OVERTURNED walks the five-hop accuracy-recovery cascade."
    roles: [GradingSupervisor]
    code: 200
    input: [outcome, "revised_grade_code?", "decision_note?"]
    output: GradeAppeal
    side_effects:
      - "outcome is one of UPHELD, OVERTURNED or MODIFIED; MODIFIED requires a revised_grade_code different from the grade's current grade_code"
      - "rejects with ERR_SEGREGATION_OF_DUTIES when X-User-ID == PlayGrade.graded_by_user_id"
      - "sets decided_by_user_id := X-User-ID, decision_note := decision_note, status := the outcome"
      - "sets PlayGrade.appeal_state := APPEAL_RESOLVED; on OVERTURNED sets grade_code := CORRECT, on MODIFIED sets grade_code := revised_grade_code; recomputes error_points"
      - "recomputes the official's OfficialSeasonRecord with the PROVISIONAL accuracy variant"
      - "when accuracy_eligible flips false -> true: clears the official's PERFORMANCE DisciplineAction rows in {OPENED, REMEDIATION_ASSIGNED, REASSESSED} in created_at ASC order, then restores Official.status PROBATION -> ACTIVE when no non-terminal action remains, then re-derives postseason_eligible"
      - "increments GradeAppeal.version by 1"

  - method: POST
    path: "/grade-appeals/{id}/withdraw"
    description: "The appellant withdraws a submitted or under-review appeal, refunding the credit."
    roles: [Official]
    code: 200
    input: []
    output: GradeAppeal
    side_effects:
      - "rejects with ERR_NOT_GRADE_OWNER when X-User-ID != PlayGrade.official_id"
      - "sets status := WITHDRAWN"
      - "sets PlayGrade.appeal_state := NOT_APPEALED and increments PlayGrade.version by 1"
      - "increments Official.appeal_credits_remaining by 1 and increments Official.version by 1"

  - method: GET
    path: "/grade-appeals/{id}"
    description: "Reads one appeal including its decision fields."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: GradeAppeal
    side_effects: []

  - method: GET
    path: "/grade-appeals"
    description: "Lists appeals with filters."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["play_grade_id?", "status?", "limit?", "offset?"]
    output: GradeAppeal[]
    side_effects: []

  # --- replay center --------------------------------------------------------
  - method: POST
    path: "/replay-stations"
    description: "Registers a replay booth with its concurrent review capacity. Independent of any season program."
    roles: [OfficiatingDirector]
    code: 201
    input: [station_code, "concurrent_capacity?", "status?"]
    output: ReplayStation
    side_effects:
      - "sets active_review_count := 0; status defaults to ONLINE and concurrent_capacity to 1"

  - method: GET
    path: "/replay-stations/{id}"
    description: "Reads one replay station including active_review_count."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: ReplayStation
    side_effects: []

  - method: POST
    path: "/replay-reviews"
    description: "Opens a replay review on an in-progress game, seizing station capacity for the decision window."
    roles: [ReplayOfficial]
    code: 201
    input: [game_id, station_id, play_ref, category]
    output: ReplayReview
    side_effects:
      - "rejects with ERR_CATEGORY_NOT_REVIEWABLE when category is absent from SeasonProgram.reviewable_categories, then ERR_REPLAY_STATION_OFFLINE, then ERR_REPLAY_STATION_AT_CAPACITY per calculations.replay_station_concurrency"
      - "sets status := INITIATED, window_open_utc := logical clock, window_close_utc := window_open_utc + replay_decision_limit_seconds, decision := null"
      - "increments ReplayStation.active_review_count by 1 and increments ReplayStation.version by 1"

  - method: POST
    path: "/replay-reviews/{id}/decide"
    description: "Records the replay decision; a submission past the decision limit is recorded as EXPIRED with a null decision and still returns 200."
    roles: [ReplayOfficial]
    code: 200
    input: [decision]
    output: ReplayReview
    side_effects:
      - "decision is one of STANDS, CONFIRMED or REVERSED"
      - "sets elapsed_seconds := whole seconds from window_open_utc to the logical clock"
      - "sets status := DECIDED with the supplied decision when elapsed_seconds <= replay_decision_limit_seconds, else status := EXPIRED with decision := null"
      - "decrements ReplayStation.active_review_count by 1 and increments ReplayStation.version by 1"
      - "increments ReplayReview.version by 1"

  - method: GET
    path: "/replay-reviews/{id}"
    description: "Reads one replay review including its window and elapsed_seconds."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: ReplayReview
    side_effects: []

  - method: GET
    path: "/replay-reviews"
    description: "Lists replay reviews with filters; the discovery channel for reviews expired by mark-played."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["game_id?", "station_id?", "status?", "category?", "limit?", "offset?"]
    output: ReplayReview[]
    side_effects: []

  # --- public accountability ------------------------------------------------
  - method: POST
    path: "/pool-reports"
    description: "Drafts a pool report or rules clarification citing a graded play, optionally naming the report it will supersede."
    roles: [CommunicationsOfficer]
    code: 201
    input: [game_id, play_grade_id, report_type, body, "supersedes_id?"]
    output: PoolReport
    side_effects:
      - "sets status := DRAFT and published_at := null"
      - "rejects with ERR_INVALID_REQUEST when supersedes_id names this same report or a report on a different game"

  - method: POST
    path: "/pool-reports/{id}/publish"
    description: "Publishes a drafted report; the cited grade must be FINAL and free of a pending appeal."
    roles: [CommunicationsOfficer]
    code: 200
    input: []
    output: PoolReport
    side_effects:
      - "rejects with ERR_CITED_GRADE_NOT_FINAL when PlayGrade.grade_status != FINAL or appeal_state == APPEAL_PENDING"
      - "sets status := PUBLISHED and published_at := logical clock"
      - "when supersedes_id is set: transitions that report to SUPERSEDED and increments its version by 1"
      - "increments PoolReport.version by 1"

  - method: GET
    path: "/pool-reports/{id}"
    description: "Reads one pool report."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: PoolReport
    side_effects: []

  - method: GET
    path: "/pool-reports"
    description: "Lists pool reports with filters, including by the report they supersede."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["game_id?", "play_grade_id?", "supersedes_id?", "report_type?", "status?", "limit?", "offset?"]
    output: PoolReport[]
    side_effects: []

  # --- discipline and remediation -------------------------------------------
  - method: POST
    path: "/discipline-actions"
    description: "Opens a discipline action against an official. Carries OCC on the parent official because a create legitimately supersedes that official's existing non-terminal action (§1.2.1 discipline-create-stale-official)."
    roles: [OfficiatingDirector]
    code: 201
    input: [official_id, reason_category, severity, expected_official_version, "suspension_games?"]
    output: DisciplineAction
    side_effects:
      - "rejects with ERR_STALE_OFFICIAL_VERSION (412) when expected_official_version != Official.version"
      - "rejects with ERR_INVALID_REQUEST when severity == SUSPENSION and suspension_games is absent or < 1"
      - "supersedes the official's existing DisciplineAction in {OPENED, REMEDIATION_ASSIGNED, REASSESSED}, setting it SUPERSEDED and incrementing its version by 1"
      - "sets status := OPENED and remediation_cycle_count := 0"
      - "on severity SUSPENSION: sets Official.status := SUSPENDED and voids that official's PROPOSED/CONFIRMED assignments on SCHEDULED/IN_PROGRESS games in created_at ASC order, decrementing open_assignment_count per void and, for each affected SCHEDULED game, decrementing confirmed_crew_count, re-deriving crew_posture and recomputing crew_strength_index (PROJECTED)"
      - "on severity REMEDIATION, or WARNING with reason_category PERFORMANCE: sets Official.status := PROBATION"
      - "re-derives the official's OfficialSeasonRecord.postseason_eligible"
      - "increments Official.version by 1"

  - method: POST
    path: "/discipline-actions/{id}/assign-remediation"
    description: "Assigns (or re-assigns) a remediation plan, capped at two cycles."
    roles: [OfficiatingDirector]
    code: 200
    input: [remediation_plan]
    output: DisciplineAction
    side_effects:
      - "rejects with ERR_REMEDIATION_CYCLE_LIMIT when remediation_cycle_count is already 2"
      - "sets status := REMEDIATION_ASSIGNED, remediation_plan := remediation_plan and increments remediation_cycle_count by 1"
      - "increments DisciplineAction.version by 1"

  - method: POST
    path: "/discipline-actions/{id}/resolve"
    description: "Resolves a discipline action as cleared, reassessed for another cycle, or escalated to release."
    roles: [OfficiatingDirector]
    code: 200
    input: [outcome, "note?"]
    output: DisciplineAction
    side_effects:
      - "outcome is one of CLEARED, REASSESSED or ESCALATED; REASSESSED is legal only from REMEDIATION_ASSIGNED"
      - "sets resolution_note := note when supplied"
      - "on CLEARED: restores Official.status PROBATION/SUSPENDED -> ACTIVE when no other action of that official is in {OPENED, REMEDIATION_ASSIGNED, REASSESSED, ESCALATED}, re-derives postseason_eligible and increments Official.version by 1"
      - "on ESCALATED: sets Official.status := RELEASED, voids that official's PROPOSED/CONFIRMED assignments and increments Official.version by 1"
      - "increments DisciplineAction.version by 1"

  - method: GET
    path: "/discipline-actions/{id}"
    description: "Reads one discipline action including remediation_cycle_count."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: DisciplineAction
    side_effects: []

  - method: GET
    path: "/discipline-actions"
    description: "Lists discipline actions with filters; the discovery channel for actions cleared or superseded by a cascade."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["official_id?", "status?", "reason_category?", "severity?", "limit?", "offset?"]
    output: DisciplineAction[]
    side_effects: []

  # --- season records (accuracy, eligibility, retention) --------------------
  - method: GET
    path: "/season-records/{id}"
    description: "Reads one official season record: accuracy_index with its variant, eligibility flags, availability_component, retention_score and retention_recommendation."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: []
    output: OfficialSeasonRecord
    side_effects: []

  - method: GET
    path: "/season-records"
    description: "Lists official season records with filters; the discovery channel for the record auto-created with each official."
    roles: [OfficiatingDirector, CrewScheduler, GradingSupervisor, Official, FieldEvaluator, ReplayOfficial, TrainingCoordinator, CommunicationsOfficer]
    code: 200
    input: ["official_id?", "season_program_id?", "accuracy_variant?", "accuracy_eligible?", "postseason_eligible?", "retention_recommendation?", "limit?", "offset?"]
    output: OfficialSeasonRecord[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the target endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum value, out-of-range score, unparseable timestamp, home_team_code == away_team_code, MODIFIED appeal without a differing revised_grade_code, SUSPENSION without suspension_games >= 1, or a self-referential supersedes_id"

  - id: ERR_SEASON_PROGRAM_NOT_FOUND
    http: 404
    condition: "season_program_id does not resolve"
  - id: ERR_OFFICIAL_NOT_FOUND
    http: 404
    condition: "official_id does not resolve"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "advancement application id does not resolve"
  - id: ERR_GAME_NOT_FOUND
    http: 404
    condition: "game_id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "crew assignment id does not resolve"
  - id: ERR_PLAY_GRADE_NOT_FOUND
    http: 404
    condition: "play_grade_id does not resolve"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "grade appeal id does not resolve"
  - id: ERR_REPLAY_STATION_NOT_FOUND
    http: 404
    condition: "station_id does not resolve"
  - id: ERR_REPLAY_REVIEW_NOT_FOUND
    http: 404
    condition: "replay review id does not resolve"
  - id: ERR_POOL_REPORT_NOT_FOUND
    http: 404
    condition: "pool report id or supersedes_id does not resolve"
  - id: ERR_DISCIPLINE_ACTION_NOT_FOUND
    http: 404
    condition: "discipline action id does not resolve"

  - id: ERR_NOT_GRADE_OWNER
    http: 403
    condition: "an Official acts on an appeal for a grade whose official_id is not their X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the supervisor reviewing or deciding an appeal is the same user who graded the play"

  - id: ERR_SEASON_NOT_OPEN
    http: 409
    condition: "a business write is attempted while the owning SeasonProgram is CONFIGURING or POSTSEASON_LOCKED, or open/lock-postseason is called from the wrong program state"
  - id: ERR_GAME_STATE_INVALID
    http: 409
    condition: "kickoff, mark-played or finalize called from a state that does not declare that transition, or an assignment write on a game past SCHEDULED"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "confirm or withdraw called on an assignment outside {PROPOSED, CONFIRMED}, or a play grade filed for an official who held no CONFIRMED/COMPLETED assignment on that game"
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "screen, field-evaluation, submit-to-committee, return-for-tape or decide called from a state that does not declare that transition"
  - id: ERR_GRADE_STATE_INVALID
    http: 409
    condition: "post called on a non-DRAFT grade, or an appeal filed against a grade that is not POSTED with appeal_state NOT_APPEALED"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "start-review, decide or withdraw called on an appeal outside the transition's from-states"
  - id: ERR_REVIEW_STATE_INVALID
    http: 409
    condition: "decide called on a replay review already DECIDED or EXPIRED"
  - id: ERR_DISCIPLINE_STATE_INVALID
    http: 409
    condition: "assign-remediation or resolve called from a state that does not declare that transition"
  - id: ERR_REPORT_STATE_INVALID
    http: 409
    condition: "publish called on a pool report that is not DRAFT"

  - id: ERR_STALE_GAME_VERSION
    http: 412
    condition: "expected_game_version on POST /crew-assignments does not equal Game.version"
  - id: ERR_STALE_OFFICIAL_VERSION
    http: 412
    condition: "expected_official_version on POST /discipline-actions does not equal Official.version"

  - id: ERR_OFFICIAL_WINDOW_CONFLICT
    http: 409
    condition: "the new assignment's half-open occupancy window overlaps one of the official's PROPOSED/CONFIRMED/COMPLETED windows"
  - id: ERR_OFFICIAL_NOT_ACTIVE
    http: 409
    condition: "the official being assigned or confirmed is not ACTIVE"
  - id: ERR_PRESEASON_NOT_CLEARED
    http: 409
    condition: "the official being assigned or confirmed has preseason_cleared == false"
  - id: ERR_TEAM_CONFLICT_OF_INTEREST
    http: 409
    condition: "the official's affiliated_team_code is one of the game's two teams"
  - id: ERR_TEAM_ROTATION_LIMIT
    http: 409
    condition: "the official already holds max_team_exposures_per_season assignments against one of the game's teams this season"
  - id: ERR_POSITION_ALREADY_CONFIRMED
    http: 409
    condition: "a CONFIRMED assignment already occupies the requested position on that game"
  - id: ERR_DUPLICATE_PLAY_GRADE
    http: 409
    condition: "a play grade already exists for the same (game_id, official_id, play_ref)"
  - id: ERR_CREW_NOT_STAFFED
    http: 409
    condition: "kickoff attempted while crew_posture != STAFFED"
  - id: ERR_CATEGORY_NOT_REVIEWABLE
    http: 422
    condition: "the replay review category is absent from SeasonProgram.reviewable_categories"
  - id: ERR_REPLAY_STATION_OFFLINE
    http: 409
    condition: "the target replay station status is OFFLINE"
  - id: ERR_REPLAY_STATION_AT_CAPACITY
    http: 409
    condition: "overlapping INITIATED reviews on the station already equal concurrent_capacity under closed-interval semantics"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "the appeal is filed after posted_at + appeal_window_hours"
  - id: ERR_APPEAL_CREDITS_EXHAUSTED
    http: 409
    condition: "the appealing official has appeal_credits_remaining == 0"
  - id: ERR_ADVANCEMENT_CRITERIA_NOT_MET
    http: 422
    condition: "the applicant fails tier adjacency, experience floor, active status, preseason clearance or the accuracy floor at screening"
  - id: ERR_EVALUATION_REQUIREMENTS_NOT_MET
    http: 422
    condition: "fewer than MIN_EVALUATIONS + return_count field evaluations exist, or evaluation_average < MIN_EVAL_AVERAGE"
  - id: ERR_REMEDIATION_CYCLE_LIMIT
    http: 409
    condition: "a third remediation cycle is assigned on the same discipline action"
  - id: ERR_CITED_GRADE_NOT_FINAL
    http: 409
    condition: "the pool report cites a grade that is not FINAL or that carries a pending appeal"
  - id: ERR_GAMES_IN_PROGRESS
    http: 409
    condition: "the postseason lock is attempted while a game of the program is IN_PROGRESS"

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties: grading, appeal adjudication,
# scheduling, evaluation and discipline are held by different roles)
# =============================================================================
roles:
  - name: OfficiatingDirector
    description: "Runs the officiating department: season configuration, official registration, game scheduling, advancement committee decisions, replay station registry, and discipline."
    identity: "opaque"
    exclusive_operations:
      - "POST /season-programs"
      - "POST /season-programs/{id}/open"
      - "POST /season-programs/{id}/lock-postseason"
      - "POST /officials"
      - "POST /games"
      - "POST /games/{id}/kickoff"
      - "POST /games/{id}/mark-played"
      - "POST /games/{id}/finalize"
      - "POST /advancement-applications/{id}/return-for-tape"
      - "POST /advancement-applications/{id}/decide"
      - "POST /replay-stations"
      - "POST /discipline-actions"
      - "POST /discipline-actions/{id}/assign-remediation"
      - "POST /discipline-actions/{id}/resolve"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: CrewScheduler
    description: "Builds game crews, balancing experience, conflicts of interest, team rotation and rest windows."
    identity: "opaque"
    exclusive_operations:
      - "POST /crew-assignments"
      - "POST /crew-assignments/{id}/confirm"
      - "POST /crew-assignments/{id}/withdraw"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: GradingSupervisor
    description: "Grades plays against rulebook standards and adjudicates appeals filed by other supervisors' grades. Never decides an appeal on a grade this same user authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /play-grades"
      - "POST /play-grades/{id}/post"
      - "POST /grade-appeals/{id}/start-review"
      - "POST /grade-appeals/{id}/decide"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: Official
    description: "A working official: applies for advancement and appeals grades against their own performance. X-User-ID is the Official row's id."
    identity: "entity_backed:Official"
    exclusive_operations:
      - "POST /advancement-applications"
      - "POST /grade-appeals"
      - "POST /grade-appeals/{id}/withdraw"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: FieldEvaluator
    description: "Screens advancement applications, files field evaluation reports, and forwards qualifying applications to the committee. Cannot make the committee decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /advancement-applications/{id}/screen"
      - "POST /advancement-applications/{id}/field-evaluations"
      - "POST /advancement-applications/{id}/submit-to-committee"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: ReplayOfficial
    description: "Operates the replay center: opens reviews on reviewable play categories and records decisions inside the decision window."
    identity: "opaque"
    exclusive_operations:
      - "POST /replay-reviews"
      - "POST /replay-reviews/{id}/decide"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: TrainingCoordinator
    description: "Runs rules clinics, physical standards testing and preseason exams, and records the results that gate assignability."
    identity: "opaque"
    exclusive_operations:
      - "POST /officials/{id}/training-records"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"

  - name: CommunicationsOfficer
    description: "Publishes pool reports and rules clarifications about finalized grades."
    identity: "opaque"
    exclusive_operations:
      - "POST /pool-reports"
      - "POST /pool-reports/{id}/publish"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET endpoint"
