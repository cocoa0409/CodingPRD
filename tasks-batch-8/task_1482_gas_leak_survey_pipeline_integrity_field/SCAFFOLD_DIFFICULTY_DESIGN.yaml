              as: CalibrationTech
              as_user_id: "${ct_id}"
              captures: { instr_id: $.data.id }
            - call: "POST /instruments/${instr_id}/calibrate"
              payload: { reference_gas_ppm: 100.0, observed_ppm: 100.0 }
              as: CalibrationTech
              as_user_id: "${ct_id}"
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-L1", install_year: 2010, material: "PLASTIC_PE", diameter_inches: 4.0, length_feet: 500.0, operating_pressure_psi: 30.0, pressure_class: "SERVICE", is_high_consequence_area: false }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { seg_id: $.data.id }
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
            - call: "POST /survey-routes"
              payload: { route_code: "R-L1", survey_method: "WALKING", scheduled_window_start: "2026-07-01T00:00:00Z", scheduled_window_end: "2026-12-31T23:59:59Z" }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { route_id: $.data.id }
            - call: "POST /survey-routes/${route_id}/route-segment-assignments"
              payload: { segment_id: "${seg_id}", sequence_index: 1 }
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-routes/${route_id}/dispatch"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
            - call: "POST /survey-runs"
