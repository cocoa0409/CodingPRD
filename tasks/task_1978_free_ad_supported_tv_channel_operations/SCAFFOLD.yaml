# =============================================================================
# Task 1978 — Free Ad-Supported TV (FAST) Channel Operations — SCAFFOLD
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files and are NOT emitted here.
# =============================================================================

scenario: |
  1978. Free Ad-Supported TV Channel Operations (Pluto/Tubi style FAST channel): channel playlist scheduling & loop construction, ad break marking & server-side insertion, fill rate & unsold inventory house-ad substitution, content rights window enforcement per channel, distributor platform reporting & revenue share, ad quality/competitive separation rules, viewership measurement & channel performance, content refresh cadence

domain_name: fast-channel-ops
api_prefix: /v1

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# All server-stamped timestamps (created_at, updated_at, published_at, etc.)
# read the logical clock (see POST /v1/_clock/set-current-utc), never the
# wall clock. ids are server-minted UUIDs (no type prefix) and are identity
# only — never used in any ranking, tie-break, allocation, or selection.
# =============================================================================
entities:
  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Channel display name" }
      - { name: genre, type: string, source: input, description: "Primary genre label" }
      - { name: timezone, type: string, source: input, description: "IANA timezone for programming day boundaries" }
      - { name: loop_duration_seconds, type: integer, source: input, default: 86400, description: "Exact length every playlist loop must tile to (seconds); > 0" }
      - { name: refresh_cadence_days, type: integer, source: input, default: 7, description: "Max days between loop publishes before the channel is stale; > 0" }
      - { name: ad_separation_window_seconds, type: integer, source: input, default: 600, description: "Competitive-separation window: two breaks whose gap is <= this are adjacent for IAB-category exclusion" }
      - { name: avg_slot_impressions, type: integer, source: input, default: 1000, description: "Expected impressions per 30s slot; basis for committed cost of DIRECT fill decisions" }
      - { name: channel_status, type: enum, source: system, description: "Lifecycle dimension: DRAFT | LIVE | SUSPENDED | OFFLINE | ARCHIVED" }
      - { name: channel_posture, type: enum, source: computed, description: "Derived gating dimension: ACTIVE | GUARDED | FROZEN (see channel_posture_recompute)" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotonic ops-run checkpoint counter" }
      - { name: last_published_on, type: string, source: computed, description: "Logical date (YYYY-MM-DD) of the most recent loop publish; null until first publish" }

  - name: ContentAsset
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Content title" }
      - { name: content_type, type: enum, source: input, description: "MOVIE | EPISODE | SHORT" }
      - { name: runtime_seconds, type: integer, source: input, description: "Exact runtime in seconds; > 0" }
      - { name: rating, type: enum, source: input, description: "G | PG | PG13 | R | TVMA" }
      - { name: genre, type: string, source: input, description: "Content genre label" }
      - { name: content_status, type: enum, source: system, description: "INGESTING | AVAILABLE | PULLED | WINDOW_EXPIRED | ARCHIVED" }

  - name: RightsGrant
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel the content may air on" }
      - { name: content_id, type: string, source: input, description: "FK -> ContentAsset.id; licensed content" }
      - { name: window_start_utc, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: window_end_utc, type: datetime, source: input, description: "Half-open window end (exclusive); must be > window_start_utc" }
      - { name: max_plays, type: integer, source: input, description: "Maximum number of playlist entries this grant may cover; > 0" }
      - { name: plays_used, type: integer, source: system, default: 0, description: "Entries consumed by publishes against this grant" }
      - { name: grant_status, type: enum, source: system, description: "PENDING | ACTIVE | EXPIRED | EXHAUSTED | REVOKED" }

  - name: PlaylistLoop
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; owning channel" }
      - { name: broadcast_date, type: string, source: input, description: "Logical air date YYYY-MM-DD of this loop" }
      - { name: loop_status, type: enum, source: system, description: "DRAFT | VALIDATED | LOCKED | PUBLISHED | SUPERSEDED | ARCHIVED" }
      - { name: used_seconds, type: integer, source: computed, default: 0, description: "Sum of entry runtimes + break durations currently placed" }
      - { name: validated_at, type: datetime, source: system, description: "Logical timestamp of last successful validate; null until validated" }
      - { name: published_at, type: datetime, source: system, description: "Logical timestamp of publish; null until published" }
      - { name: supersedes_loop_id, type: string, source: system, description: "FK -> PlaylistLoop.id; nullable self-reference set at publish when this loop supersedes the previously PUBLISHED loop for the same (channel_id, broadcast_date)" }

  - name: PlaylistEntry
    parent: null
    common_fields: true
    fields:
      - { name: loop_id, type: string, source: system, description: "FK -> PlaylistLoop.id; owning loop (path-bound at creation)" }
      - { name: content_id, type: string, source: input, description: "FK -> ContentAsset.id; scheduled content" }
      - { name: sequence_index, type: integer, source: system, description: "0-based order among entries of the loop; compacted on delete" }
      - { name: start_offset_seconds, type: integer, source: computed, description: "Offset from loop start; derived by the offset walk" }
      - { name: end_offset_seconds, type: integer, source: computed, description: "start_offset_seconds + content runtime" }

  - name: AdBreak
    parent: null
    common_fields: true
    fields:
      - { name: loop_id, type: string, source: system, description: "FK -> PlaylistLoop.id; owning loop (path-bound at creation)" }
      - { name: duration_seconds, type: integer, source: input, description: "Ad pod capacity; multiple of 30, between 30 and 240 inclusive" }
      - { name: after_entry_index, type: integer, source: system, description: "Break sits after this many entries in the offset walk; clamped to [0, remaining entry count] on entry delete" }
      - { name: sequence_index, type: integer, source: system, description: "Creation order among breaks of the loop; orders breaks sharing an after_entry_index" }
      - { name: start_offset_seconds, type: integer, source: computed, description: "Offset from loop start; derived by the offset walk" }
      - { name: break_status, type: enum, source: system, description: "MARKED | DECIDED | AIRED | RECONCILED" }
      - { name: slots, type: integer, source: computed, description: "duration_seconds / 30 (SLOT_SECONDS)" }
      - { name: direct_seconds, type: integer, source: computed, default: 0, description: "Seconds filled by PROVISIONAL/COMMITTED/RECONCILED DIRECT decisions" }
      - { name: house_seconds, type: integer, source: computed, default: 0, description: "Seconds filled by non-VOIDED HOUSE decisions" }
      - { name: slate_seconds, type: integer, source: computed, description: "duration_seconds - direct_seconds - house_seconds (implicit slate; no decision rows for slate)" }

  - name: FillDecision
    parent: null
    common_fields: true
    fields:
      - { name: break_id, type: string, source: system, description: "FK -> AdBreak.id; decided break" }
      - { name: slot_index, type: integer, source: system, description: "First 30s slot occupied within the break" }
      - { name: slots_spanned, type: integer, source: system, description: "Slots occupied (duration_seconds / 30)" }
      - { name: fill_type, type: enum, source: system, description: "DIRECT | HOUSE (slate slots produce no decision row)" }
      - { name: creative_id, type: string, source: system, description: "FK -> AdCreative.id; set iff fill_type == DIRECT" }
      - { name: campaign_id, type: string, source: system, description: "FK -> AdCampaign.id; set iff fill_type == DIRECT" }
      - { name: house_ad_id, type: string, source: system, description: "FK -> HouseAd.id; set iff fill_type == HOUSE" }
      - { name: expected_impressions, type: integer, source: computed, description: "DIRECT: channel.avg_slot_impressions * slots_spanned; HOUSE: 0" }
      - { name: committed_cost_cents, type: integer, source: computed, description: "DIRECT: round_half_up(campaign.cpm_cents * expected_impressions / 1000); HOUSE: 0" }
      - { name: actual_impressions, type: integer, source: system, description: "SUM(quantity) of AD_IMPRESSION events matched at reconcile; null until RECONCILED" }
      - { name: reconciled_cost_cents, type: integer, source: system, description: "round_half_up(campaign.cpm_cents * actual_impressions / 1000) for DIRECT, 0 for HOUSE; null until RECONCILED" }
      - { name: decision_status, type: enum, source: system, description: "PROVISIONAL | COMMITTED | RECONCILED | VOIDED" }

  - name: AdCampaign
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_name, type: string, source: input, description: "Advertiser display name" }
      - { name: iab_category, type: string, source: input, description: "IAB content/category code used for competitive separation" }
      - { name: total_budget_cents, type: integer, source: input, description: "Campaign lifetime budget; > 0" }
      - { name: daily_budget_cents, type: integer, source: input, description: "Max committed cost per broadcast date; > 0 and <= total_budget_cents" }
      - { name: cpm_cents, type: integer, source: input, description: "Cost per 1000 impressions in cents; > 0" }
      - { name: flight_start_date, type: string, source: input, description: "First eligible broadcast date YYYY-MM-DD" }
      - { name: flight_end_date, type: string, source: input, description: "Last eligible broadcast date YYYY-MM-DD; >= flight_start_date" }
      - { name: priority, type: integer, source: input, default: 0, description: "Ranking tie-break tier; higher wins" }
      - { name: spent_cents, type: integer, source: system, default: 0, description: "Accrued committed cost (adjusted at reconcile); never negative" }
      - { name: campaign_status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | EXHAUSTED | COMPLETED" }

  - name: AdCreative
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> AdCampaign.id; trafficking campaign" }
      - { name: brand, type: string, source: input, description: "Advertised brand" }
      - { name: iab_category, type: string, source: input, description: "IAB category; must equal the campaign's iab_category" }
      - { name: duration_seconds, type: integer, source: input, description: "Creative length; 30 or 60 (ad-quality rule)" }
      - { name: creative_status, type: enum, source: system, description: "PENDING_REVIEW | APPROVED | REJECTED | RETIRED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating AdOps user (segregation of duties anchor)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the last reviewer; null until reviewed" }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at reject; null otherwise" }

  - name: HouseAd
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "House promo name" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; nullable — null means network-wide eligibility" }
      - { name: duration_seconds, type: integer, source: input, default: 30, description: "Must be exactly 30 (one slot)" }
      - { name: priority_weight, type: integer, source: input, description: "Waterfall rank; higher fills first" }
      - { name: daily_impression_cap, type: integer, source: input, description: "Max HOUSE placements per broadcast date; > 0" }
      - { name: house_ad_status, type: enum, source: system, description: "ACTIVE | PAUSED | RETIRED" }

  - name: DistributorPlatform
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Platform name (e.g. Roku-style OTT outlet)" }
      - { name: reporting_tier, type: enum, source: input, description: "STANDARD | PREMIUM" }
      - { name: platform_status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED" }

  - name: DistributionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; carried channel" }
      - { name: platform_id, type: string, source: input, description: "FK -> DistributorPlatform.id; carrying platform" }
      - { name: rev_share_bps_below, type: integer, source: input, description: "Platform share in basis points for gross up to tier_threshold_cents; 0..6000" }
      - { name: rev_share_bps_above, type: integer, source: input, description: "Platform share in basis points for gross above tier_threshold_cents; 0..6000" }
      - { name: tier_threshold_cents, type: integer, source: input, description: "Marginal tier split point of gross revenue; >= 0" }
      - { name: minimum_guarantee_cents, type: integer, source: input, default: 0, description: "Floor on platform_share_cents per report; >= 0" }
      - { name: effective_start_date, type: string, source: input, description: "Closed interval start YYYY-MM-DD (inclusive)" }
      - { name: effective_end_date, type: string, source: input, description: "Closed interval end YYYY-MM-DD (inclusive); >= effective_start_date" }
      - { name: agreement_status, type: enum, source: system, description: "NEGOTIATION | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: locked_rev_share_bps_below, type: integer, source: system, description: "Rate snapshot pinned at first activation; null until then" }
      - { name: locked_rev_share_bps_above, type: integer, source: system, description: "Rate snapshot pinned at first activation; null until then" }
      - { name: locked_tier_threshold_cents, type: integer, source: system, description: "Tier snapshot pinned at first activation; null until then" }
      - { name: locked_minimum_guarantee_cents, type: integer, source: system, description: "Guarantee snapshot pinned at first activation; null until then" }

  - name: RevenueReport
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; reported channel" }
      - { name: platform_id, type: string, source: input, description: "FK -> DistributorPlatform.id; reported platform" }
      - { name: agreement_id, type: string, source: system, description: "FK -> DistributionAgreement.id; covering agreement resolved at create" }
      - { name: period_month, type: string, source: input, description: "Reported calendar month YYYY-MM" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | PROVISIONAL | FINALIZED | DISPUTED | SETTLED" }
      - { name: calculation_variant, type: enum, source: system, description: "PROVISIONAL | FINAL; null until first generation" }
      - { name: gross_revenue_cents, type: integer, source: computed, description: "Attributed gross for (channel, platform, period); null until generated" }
      - { name: platform_share_cents, type: integer, source: computed, description: "Tiered share per locked agreement terms; null until generated" }
      - { name: net_revenue_cents, type: integer, source: computed, description: "gross_revenue_cents - platform_share_cents; null until generated" }
      - { name: dispute_round, type: integer, source: system, default: 0, description: "Number of completed dispute cycles; increments on refinalize" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of the FinanceAnalyst who created the report (segregation anchor)" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the last finalizing FinanceController; null until finalized" }

  - name: ViewershipEvent
    parent: null
    common_fields: false
    fields:
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; channel watched" }
      - { name: platform_id, type: string, source: input, description: "FK -> DistributorPlatform.id; delivering platform (stamped from caller identity for DistributorPartner)" }
      - { name: event_type, type: enum, source: input, description: "SESSION_START | SESSION_END | CONTENT_WATCH | AD_IMPRESSION | AD_COMPLETE" }
      - { name: break_id, type: string, source: input, description: "FK -> AdBreak.id; required for AD_IMPRESSION / AD_COMPLETE, null otherwise" }
      - { name: decision_id, type: string, source: input, description: "FK -> FillDecision.id; required for AD_IMPRESSION, null otherwise" }
      - { name: content_id, type: string, source: input, description: "FK -> ContentAsset.id; required for CONTENT_WATCH, null otherwise" }
      - { name: viewer_session_id, type: string, source: input, description: "Opaque viewer session identifier" }
      - { name: occurred_at_utc, type: datetime, source: input, description: "Event timestamp (UTC)" }
      - { name: watch_seconds, type: integer, source: input, description: "Watched seconds; required for CONTENT_WATCH, null otherwise" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Impressions this row represents; AD_IMPRESSION only; > 0. All impression counts use SUM(quantity)" }

  - name: ChannelDaySnapshot
    parent: null
    common_fields: true
    fields:
      - { name: channel_id, type: string, source: system, description: "FK -> Channel.id; measured channel (path-bound at compute)" }
      - { name: snapshot_date, type: string, source: input, description: "Measured day YYYY-MM-DD; unique per channel (upsert on recompute)" }
      - { name: watch_seconds, type: integer, source: computed, description: "Sum of CONTENT_WATCH watch_seconds in the half-open day window" }
      - { name: peak_concurrent_viewers, type: integer, source: computed, description: "Max running session count from chronological SESSION_START/END replay" }
      - { name: ad_impressions, type: integer, source: computed, description: "SUM(quantity) over AD_IMPRESSION events in window" }
      - { name: direct_sold_impressions, type: integer, source: computed, description: "SUM(quantity) over AD_IMPRESSION events whose decision fill_type == DIRECT" }
      - { name: capacity_seconds, type: integer, source: computed, description: "Sum of break durations on the date's PUBLISHED loop; 0 if none" }
      - { name: direct_seconds, type: integer, source: computed, description: "Sum of slots_spanned*30 over DIRECT decisions (status COMMITTED or RECONCILED) on that loop's breaks" }
      - { name: house_seconds, type: integer, source: computed, description: "Same over HOUSE decisions" }
      - { name: direct_fill_rate, type: number, source: computed, description: "direct_seconds / capacity_seconds, scale-4 ROUND_HALF_UP; 0.0000 when capacity is 0" }
      - { name: effective_fill_rate, type: number, source: computed, description: "(direct_seconds + house_seconds) / capacity_seconds, scale-4; 0.0000 when capacity is 0" }
      - { name: direct_revenue_cents, type: integer, source: computed, description: "Sum over DIRECT decisions on the date's loop of (reconciled_cost_cents if RECONCILED else committed_cost_cents)" }
      - { name: ecpm_cents, type: integer, source: computed, description: "round_half_up(direct_revenue_cents * 1000 / direct_sold_impressions); 0 when direct_sold_impressions == 0" }
      - { name: performance_score, type: integer, source: computed, description: "channel_performance_score result (0..100)" }
      - { name: computed_at, type: datetime, source: system, description: "Logical timestamp of computation" }

# =============================================================================
# §1.2 State Machine Table
# Channel carries TWO independent state dimensions (channel_status lifecycle x
# channel_posture derived gate) — the parallel-dimensions shape; mutations on
# one dimension never rewrite the other.
# =============================================================================
state_machines:
  - entity: Channel
    field: channel_status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /v1/channels/{channel_id}/go-live"
        actor: PlatformAdmin
        preconditions:
          - "At least one PlaylistLoop of this channel in LOCKED or PUBLISHED status with broadcast_date >= current logical date"
        side_effects:
          - "channel.version increments by 1"
      - from: LIVE
        to: SUSPENDED
        trigger: "POST /v1/channels/{channel_id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["channel.version increments by 1"]
      - from: SUSPENDED
        to: LIVE
        trigger: "POST /v1/channels/{channel_id}/resume"
        actor: PlatformAdmin
        preconditions:
          - "channel_posture != FROZEN"
        side_effects: ["channel.version increments by 1"]
      - from: [LIVE, SUSPENDED]
        to: OFFLINE
        trigger: "POST /v1/channels/{channel_id}/take-offline"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "channel.version increments by 1"
          - "Posture recompute: OFFLINE channels hold posture until archive; no loop operations permitted while OFFLINE"
      - from: OFFLINE
        to: ARCHIVED
        trigger: "POST /v1/channels/{channel_id}/archive"
        actor: PlatformAdmin
        preconditions:
          - "No PlaylistLoop of this channel in PUBLISHED status with broadcast_date >= current logical date"
        side_effects: ["channel.version increments by 1"]

  - entity: Channel
    field: channel_posture
    initial_state: ACTIVE
    terminal_states: []
    note: "Derived dimension; never set directly by a client. Recomputed on grant revoke, grant expiry (ops-run), loop publish, and POST run-ops."
    transitions:
      - from: ACTIVE
        to: GUARDED
        trigger: "system (run-ops or publish-time recompute)"
        actor: system
        preconditions:
          - "current logical date > last_published_on + refresh_cadence_days (strictly greater; equality is NOT stale), or last_published_on is null and channel_status == LIVE"
        side_effects: ["channel.updated_at refreshed"]
      - from: [ACTIVE, GUARDED]
        to: FROZEN
        trigger: "system (rights grant revoked or expired, or ops-run recompute)"
        actor: system
        preconditions:
          - "Exists a PUBLISHED PlaylistLoop of this channel containing an entry whose air window lacks a covering ACTIVE RightsGrant"
        side_effects: ["channel.updated_at refreshed"]
      - from: GUARDED
        to: ACTIVE
        trigger: "system (a loop publish sets last_published_on to current logical date)"
        actor: system
        preconditions:
          - "No FROZEN condition holds"
        side_effects: []
      - from: FROZEN
        to: ACTIVE
        trigger: "system (offending PUBLISHED loop superseded, or ops-run recompute finds no violation and no staleness)"
        actor: system
        preconditions:
          - "No PUBLISHED loop has an uncovered entry air window AND not stale"
        side_effects: []

  - entity: ContentAsset
    field: content_status
    initial_state: INGESTING
    terminal_states: [ARCHIVED]
    transitions:
      - from: INGESTING
        to: AVAILABLE
        trigger: "POST /v1/content-assets/{content_id}/mark-available"
        actor: ContentLicensing
        preconditions: ["runtime_seconds > 0"]
        side_effects: []
      - from: AVAILABLE
        to: PULLED
        trigger: "POST /v1/content-assets/{content_id}/pull"
        actor: ContentLicensing
        preconditions: []
        side_effects:
          - "Every PlaylistLoop in VALIDATED or LOCKED status containing an entry of this content reverts to DRAFT"
          - "That revert itself voids every PROVISIONAL FillDecision on the loop's breaks and flips each DECIDED break with no remaining PROVISIONAL/COMMITTED decisions back to MARKED (loop-revert cascade)"
      - from: PULLED
        to: AVAILABLE
        trigger: "POST /v1/content-assets/{content_id}/reinstate"
        actor: ContentLicensing
        preconditions:
          - "At least one RightsGrant for this content in PENDING or ACTIVE status"
        side_effects: []
      - from: AVAILABLE
        to: WINDOW_EXPIRED
        trigger: "system (a grant becomes EXHAUSTED at publish, or expires at ops-run, and no other grant for this content remains in PENDING or ACTIVE)"
        actor: system
        preconditions:
          - "No RightsGrant for this content in PENDING or ACTIVE status"
        side_effects:
          - "Every PlaylistLoop in VALIDATED or LOCKED status containing an entry of this content reverts to DRAFT (same loop-revert cascade as pull)"
      - from: PULLED
        to: ARCHIVED
        trigger: "POST /v1/content-assets/{content_id}/archive"
        actor: ContentLicensing
        preconditions:
          - "No RightsGrant for this content in PENDING or ACTIVE status"
        side_effects: []

  - entity: RightsGrant
    field: grant_status
    initial_state: PENDING
    terminal_states: [EXPIRED, EXHAUSTED, REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /v1/rights-grants/{grant_id}/activate"
        actor: ContentLicensing
        preconditions:
          - "window_start_utc <= current logical time < window_end_utc (start equality allowed)"
          - "ContentAsset.content_status == AVAILABLE"
          - "Channel.channel_status != ARCHIVED"
        side_effects: []
      - from: [PENDING, ACTIVE]
        to: EXPIRED
        trigger: "system (ops-run: current logical time >= window_end_utc)"
        actor: system
        preconditions: []
        side_effects:
          - "Content re-evaluation: if no other grant for the content is PENDING or ACTIVE, ContentAsset -> WINDOW_EXPIRED (loop-revert cascade follows)"
          - "Channel FROZEN evaluation for channels with PUBLISHED loops whose entries this grant covered"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (loop publish: plays_used reaches max_plays)"
        actor: system
        preconditions: ["plays_used >= max_plays after consumption"]
        side_effects:
          - "Content re-evaluation identical to EXPIRED transition (may drive ContentAsset -> WINDOW_EXPIRED with its loop-revert cascade)"
      - from: [PENDING, ACTIVE]
        to: REVOKED
        trigger: "POST /v1/rights-grants/{grant_id}/revoke"
        actor: ContentLicensing
        preconditions: []
        side_effects:
          - "Channel FROZEN evaluation: any channel with a PUBLISHED loop containing an entry whose air window this grant covered becomes FROZEN"
          - "Content re-evaluation identical to EXPIRED transition"

  - entity: PlaylistLoop
    field: loop_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /v1/playlist-loops/{loop_id}/validate"
        actor: ChannelProgrammer
        preconditions:
          - "channel_posture != FROZEN and channel_status not in {OFFLINE, ARCHIVED}"
          - "Tiling: used_seconds == channel.loop_duration_seconds exactly"
          - "Ad capacity: sum of break durations <= 25% of loop_duration_seconds (exact 25% allowed)"
          - "Every entry's content AVAILABLE and every entry air window covered by a PENDING or ACTIVE grant with enough remaining plays for all entries of that content in this loop"
        side_effects: ["validated_at set to logical now"]
      - from: VALIDATED
        to: DRAFT
        trigger: "POST /v1/playlist-loops/{loop_id}/revert-to-draft, or system (content pull / WINDOW_EXPIRED cascade)"
        actor: "ChannelProgrammer or system"
        preconditions: []
        side_effects:
          - "All PROVISIONAL FillDecisions on this loop's breaks -> VOIDED (no spend impact: provisional decisions were never charged)"
          - "Each break of this loop in DECIDED status with no remaining PROVISIONAL/COMMITTED decisions -> MARKED"
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /v1/playlist-loops/{loop_id}/lock"
        actor: ChannelProgrammer
        preconditions:
          - "channel_posture != FROZEN"
          - "Every AdBreak of this loop in DECIDED status"
        side_effects:
          - "Every PROVISIONAL FillDecision on this loop's breaks -> COMMITTED, processed in (break sequence_index, slot_index) order"
          - "Per committed DIRECT decision: campaign.spent_cents += committed_cost_cents; if spent_cents >= total_budget_cents the campaign -> EXHAUSTED (EXHAUSTED cascade: that campaign's remaining PROVISIONAL decisions -> VOIDED, affected breaks recompute)"
      - from: LOCKED
        to: VALIDATED
        trigger: "POST /v1/playlist-loops/{loop_id}/unlock"
        actor: ChannelProgrammer
        preconditions: []
        side_effects:
          - "Every COMMITTED FillDecision on this loop's breaks -> PROVISIONAL and campaign.spent_cents -= committed_cost_cents (compensation)"
          - "If a campaign in EXHAUSTED drops below total_budget_cents and flight_end_date >= current logical date, it -> ACTIVE"
      - from: LOCKED
        to: PUBLISHED
        trigger: "POST /v1/playlist-loops/{loop_id}/publish"
        actor: ChannelProgrammer
        preconditions:
          - "Channel.channel_status == LIVE and channel_posture != FROZEN"
          - "OCC: expected_channel_version == Channel.version"
          - "broadcast_date >= current logical date"
          - "Every entry air window covered by an ACTIVE grant with enough remaining plays for all entries of that content in this loop"
        side_effects:
          - "Any other loop of this channel with the same broadcast_date in PUBLISHED -> SUPERSEDED; this loop's supersedes_loop_id set to it"
          - "Per content: covering grant plays_used += number of entries of that content; grant -> EXHAUSTED when plays_used >= max_plays (EXHAUSTED cascade: content re-evaluation, possible WINDOW_EXPIRED with loop-revert cascade)"
          - "channel.last_published_on = current logical date; channel.version += 1; posture recompute (clears GUARDED)"
          - "published_at set to logical now"
      - from: [PUBLISHED, SUPERSEDED]
        to: ARCHIVED
        trigger: "POST /v1/playlist-loops/{loop_id}/archive"
        actor: ChannelProgrammer
        preconditions: ["broadcast_date < current logical date"]
        side_effects: []

  - entity: AdBreak
    field: break_status
    initial_state: MARKED
    terminal_states: [RECONCILED]
    transitions:
      - from: MARKED
        to: DECIDED
        trigger: "POST /v1/ad-breaks/{break_id}/decision-runs"
        actor: AdOps
        preconditions:
          - "Parent loop in VALIDATED or LOCKED status; channel_posture != FROZEN"
          - "OCC: expected_break_version == AdBreak.version"
        side_effects:
          - "Selector executes (decision_slot_allocation): DIRECT then HOUSE rows created as PROVISIONAL; slate slots produce no rows"
          - "break.version += 1; direct_seconds/house_seconds/slate_seconds recomputed"
      - from: DECIDED
        to: DECIDED
        trigger: "POST /v1/ad-breaks/{break_id}/decision-runs (re-decision)"
        actor: AdOps
        preconditions:
          - "Parent loop in VALIDATED or LOCKED status; channel_posture != FROZEN"
          - "OCC: expected_break_version == AdBreak.version"
        side_effects:
          - "Existing PROVISIONAL decisions -> VOIDED first (compensation), then selector runs fresh"
          - "break.version += 1; fill seconds recomputed"
      - from: DECIDED
        to: MARKED
        trigger: "system (all PROVISIONAL/COMMITTED decisions voided by campaign pause/complete/exhaustion, creative retire, loop revert, or manual void)"
        actor: system
        preconditions: ["No PROVISIONAL or COMMITTED decisions remain on this break"]
        side_effects: ["fill seconds recomputed to zero"]
      - from: DECIDED
        to: AIRED
        trigger: "POST /v1/ad-breaks/{break_id}/mark-aired"
        actor: ChannelProgrammer
        preconditions: ["Parent loop in PUBLISHED status"]
        side_effects: []
      - from: AIRED
        to: RECONCILED
        trigger: "POST /v1/ad-breaks/{break_id}/reconcile"
        actor: AdOps
        preconditions: []
        side_effects:
          - "Each COMMITTED DIRECT decision -> RECONCILED: actual_impressions = SUM(quantity) over AD_IMPRESSION ViewershipEvents with this decision_id; reconciled_cost_cents = round_half_up(cpm_cents * actual_impressions / 1000)"
          - "Campaign spent_cents adjusted by (reconciled_cost_cents - committed_cost_cents); if an EXHAUSTED campaign drops below budget and flight_end_date >= current logical date it -> ACTIVE"
          - "HOUSE decisions -> RECONCILED with reconciled_cost_cents = 0"

  - entity: FillDecision
    field: decision_status
    initial_state: PROVISIONAL
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: PROVISIONAL
        to: COMMITTED
        trigger: "system (parent loop lock)"
        actor: system
        preconditions: []
        side_effects: ["DIRECT: campaign.spent_cents += committed_cost_cents (may flip campaign to EXHAUSTED)"]
      - from: COMMITTED
        to: RECONCILED
        trigger: "system (break reconcile)"
        actor: system
        preconditions: []
        side_effects: ["Campaign spent_cents adjusted by reconciled delta"]
      - from: [PROVISIONAL, COMMITTED]
        to: VOIDED
        trigger: "POST /v1/fill-decisions/{decision_id}/void, or system (campaign pause/complete/exhaustion, creative retire, loop revert/unlock, break re-decision)"
        actor: "AdOps or system"
        preconditions: []
        side_effects:
          - "COMMITTED only: campaign.spent_cents -= committed_cost_cents (refund; may revive EXHAUSTED campaign to ACTIVE)"
          - "Parent break recomputes; if no PROVISIONAL/COMMITTED decisions remain, break DECIDED -> MARKED"

  - entity: AdCampaign
    field: campaign_status
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /v1/ad-campaigns/{campaign_id}/activate"
        actor: AdOps
        preconditions:
          - "At least one AdCreative of this campaign in APPROVED status"
          - "flight_end_date >= current logical date"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /v1/ad-campaigns/{campaign_id}/pause"
        actor: AdOps
        preconditions: []
        side_effects:
          - "All PROVISIONAL decisions of this campaign -> VOIDED; each affected break recomputes (DECIDED -> MARKED when emptied)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /v1/ad-campaigns/{campaign_id}/resume"
        actor: AdOps
        preconditions:
          - "spent_cents < total_budget_cents"
          - "flight_end_date >= current logical date"
        side_effects: []
      - from: [ACTIVE, PAUSED, EXHAUSTED]
        to: COMPLETED
        trigger: "POST /v1/ad-campaigns/{campaign_id}/complete"
        actor: AdOps
        preconditions: []
        side_effects: ["Same PROVISIONAL-voiding cascade as pause"]
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (spent_cents >= total_budget_cents after a commit or reconcile adjustment)"
        actor: system
        preconditions: []
        side_effects: ["Same PROVISIONAL-voiding cascade as pause"]
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (spent_cents < total_budget_cents after a void refund or reconcile down-adjustment, and flight_end_date >= current logical date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AdCreative
    field: creative_status
    initial_state: PENDING_REVIEW
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /v1/ad-creatives/{creative_id}/approve"
        actor: AdQualityReviewer
        preconditions:
          - "Segregation: reviewer X-User-ID != creative.created_by_user_id"
          - "creative.iab_category == campaign.iab_category"
          - "Ad quality: duration_seconds in {30, 60}"
        side_effects: ["reviewed_by_user_id set"]
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /v1/ad-creatives/{creative_id}/reject"
        actor: AdQualityReviewer
        preconditions:
          - "Segregation: reviewer X-User-ID != creative.created_by_user_id"
        side_effects: ["rejection_reason recorded; reviewed_by_user_id set"]
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /v1/ad-creatives/{creative_id}/resubmit"
        actor: AdOps
        preconditions: []
        side_effects: ["rejection_reason cleared"]
      - from: APPROVED
        to: RETIRED
        trigger: "POST /v1/ad-creatives/{creative_id}/retire"
        actor: AdOps
        preconditions: []
        side_effects:
          - "PROVISIONAL decisions using this creative -> VOIDED; affected breaks recompute (DECIDED -> MARKED when emptied)"
          - "COMMITTED/RECONCILED decisions are untouched (already bought)"

  - entity: HouseAd
    field: house_ad_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "PATCH /v1/house-ads/{house_ad_id} (target_status: PAUSED)"
        actor: AdOps
        preconditions: []
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "PATCH /v1/house-ads/{house_ad_id} (target_status: ACTIVE)"
        actor: AdOps
        preconditions: []
        side_effects: []
      - from: [ACTIVE, PAUSED]
        to: RETIRED
        trigger: "PATCH /v1/house-ads/{house_ad_id} (target_status: RETIRED)"
        actor: AdOps
        preconditions: []
        side_effects: []

  - entity: DistributorPlatform
    field: platform_status
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "PATCH /v1/distributor-platforms/{platform_id} (target_status: ACTIVE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /v1/distributor-platforms/{platform_id} (target_status: SUSPENDED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /v1/distributor-platforms/{platform_id} (target_status: ACTIVE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: [ONBOARDING, ACTIVE, SUSPENDED]
        to: OFFBOARDED
        trigger: "PATCH /v1/distributor-platforms/{platform_id} (target_status: OFFBOARDED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All DistributionAgreements of this platform in NEGOTIATION, ACTIVE, or SUSPENDED -> TERMINATED"

  - entity: DistributionAgreement
    field: agreement_status
    initial_state: NEGOTIATION
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATION
        to: ACTIVE
        trigger: "PATCH /v1/distribution-agreements/{agreement_id} (target_status: ACTIVE)"
        actor: PlatformAdmin
        preconditions:
          - "DistributorPlatform.platform_status == ACTIVE"
          - "Channel.channel_status != ARCHIVED"
        side_effects:
          - "Rate pinning: locked_rev_share_bps_below/above, locked_tier_threshold_cents, locked_minimum_guarantee_cents copied from current input values (version-pinning on approval)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /v1/distribution-agreements/{agreement_id} (target_status: SUSPENDED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /v1/distribution-agreements/{agreement_id} (target_status: ACTIVE)"
        actor: PlatformAdmin
        preconditions: ["DistributorPlatform.platform_status == ACTIVE"]
        side_effects: ["Locked rate snapshot is NOT refreshed — original pinned values persist"]
      - from: [NEGOTIATION, ACTIVE, SUSPENDED]
        to: TERMINATED
        trigger: "PATCH /v1/distribution-agreements/{agreement_id} (target_status: TERMINATED), or system (platform offboarded)"
        actor: "PlatformAdmin or system"
        preconditions: []
        side_effects: []

  - entity: RevenueReport
    field: report_status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: PROVISIONAL
        trigger: "POST /v1/revenue-reports/{report_id}/generate-provisional"
        actor: FinanceAnalyst
        preconditions: ["Current logical date > last day of period_month"]
        side_effects: ["Provisional variant computed (revenue_share_statement, variant=provisional); calculation_variant = PROVISIONAL"]
      - from: [DRAFT, PROVISIONAL]
        to: PROVISIONAL
        trigger: "POST /v1/revenue-reports/{report_id}/recompute"
        actor: FinanceAnalyst
        preconditions: ["OCC: expected_report_version == RevenueReport.version"]
        side_effects: ["Provisional variant recomputed; report.version += 1"]
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /v1/revenue-reports/{report_id}/finalize"
        actor: FinanceController
        preconditions:
          - "Segregation: controller X-User-ID != report.generated_by_user_id"
          - "Current logical date > last day of period_month"
        side_effects:
          - "FINAL variant computed from RECONCILED decisions only, using the agreement's locked rate snapshot; calculation_variant = FINAL; finalized_by_user_id set"
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /v1/revenue-reports/{report_id}/dispute"
        actor: DistributorPartner
        preconditions:
          - "Ownership: report.platform_id == caller's platform id"
          - "dispute_round < 3 (MAX_DISPUTE_ROUNDS)"
        side_effects: ["dispute_reason recorded"]
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /v1/revenue-reports/{report_id}/refinalize"
        actor: FinanceController
        preconditions: ["Segregation: controller X-User-ID != report.generated_by_user_id"]
        side_effects: ["FINAL variant recomputed; dispute_round += 1"]
      - from: FINALIZED
        to: SETTLED
        trigger: "POST /v1/revenue-reports/{report_id}/settle"
        actor: FinanceController
        preconditions: ["Segregation: controller X-User-ID != report.generated_by_user_id"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only — sequential-observable)
# =============================================================================
concurrency_rules:
  - rule_id: loop-publish-stale-channel
    parent_entity: Channel
    write_endpoint: "POST /v1/playlist-loops/{loop_id}/publish"
    occ_field: "expected_channel_version"
    description: |
      Publishing a loop supersedes the currently PUBLISHED loop for the same
      (channel, broadcast_date) under normal product semantics, so a writer
      whose view of the channel is stale would otherwise legitimately succeed.
      The publish is rejected when expected_channel_version does not equal the
      channel's current version (e.g. another writer has just published a loop
      for that date, which bumped Channel.version).
    error_id: ERR_STALE_CHANNEL_VERSION
    http_status: 412
  - rule_id: decision-run-stale-break
    parent_entity: AdBreak
    write_endpoint: "POST /v1/ad-breaks/{break_id}/decision-runs"
    occ_field: "expected_break_version"
    description: |
      A decision run on a break voids and replaces that break's PROVISIONAL
      decisions, so a writer holding a stale break version would otherwise
      legitimately succeed and silently discard placements created after their
      read. The run is rejected when expected_break_version does not equal the
      break's current version.
    error_id: ERR_STALE_BREAK_VERSION
    http_status: 412
  - rule_id: report-recompute-stale-report
    parent_entity: RevenueReport
    write_endpoint: "POST /v1/revenue-reports/{report_id}/recompute"
    occ_field: "expected_report_version"
    description: |
      Recomputing a report's provisional figures overwrites gross/share/net
      derived from the writer's last read; a writer whose report version is
      stale would otherwise legitimately succeed and silently discard figures
      produced after their read. Rejected when expected_report_version does
      not equal the report's current version.
    error_id: ERR_STALE_REPORT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Rounding mode is ROUND_HALF_UP everywhere. Money is integer cents; revenue
# share math uses basis points (10000 bps = 100%).
# =============================================================================
calculations:
  - name: loop_offset_walk
    trigger: "entry add, entry delete, break mark, break remove (loop in DRAFT)"
    algorithm: chronological
    formula: |
      Walk entries ascending sequence_index, carrying offset = 0.
      Before entry k, place breaks with after_entry_index == k (ascending
      break sequence_index): each break.start_offset_seconds = offset;
      offset += break.duration_seconds. Then entry k.start_offset_seconds =
      offset; offset += content.runtime_seconds. After the last entry, place
      breaks with after_entry_index == entry_count.
      Entry end_offset_seconds = start + runtime. used_seconds = final offset.
      Deleting an entry compacts entry sequence_index and clamps each break's
      after_entry_index to [0, remaining entry count].
    input_set: "Entries and non-removed breaks of the loop"
    note: "Deterministic; no id anywhere in ordering (sequence_index + creation order only)."

  - name: loop_tiling_check
    trigger: "POST /v1/playlist-loops/{loop_id}/validate"
    algorithm: threshold
    formula: |
      valid iff used_seconds == channel.loop_duration_seconds (EXACT equality;
      one second under or over fails) AND sum(break durations) <=
      floor(channel.loop_duration_seconds * 25 / 100) (exactly 25% allowed).
    constants: { AD_CAPACITY_PCT: 25 }
    input_set: "The loop being validated"

  - name: rights_play_consumption
    trigger: "POST /v1/playlist-loops/{loop_id}/publish"
    algorithm: aggregation
    formula: |
      For each entry, the covering grant is the unique ACTIVE RightsGrant for
      (content_id, loop.channel_id) whose half-open window contains the closed
      air window [broadcast_date + start_offset, broadcast_date + end_offset]
      (air_end == window_end_utc allowed; overlap validation guarantees at most
      one ACTIVE covering grant). Publish precondition: every entry has a
      covering ACTIVE grant, and per grant: plays_used + (entries it covers in
      this loop) <= max_plays (equality allowed). Side effect: each covering
      grant plays_used += covered count; grant -> EXHAUSTED when
      plays_used >= max_plays.
    input_set: "Entries of the publishing loop; ACTIVE grants of (content, channel)"

  - name: decision_slot_allocation
    trigger: "POST /v1/ad-breaks/{break_id}/decision-runs"
    algorithm: waterfall_allocation
    formula: |
      slots = break.duration_seconds / SLOT_SECONDS (30). Greedy single pass
      over free slots in ascending slot_index:
      DIRECT eligibility at broadcast date D (= parent loop's broadcast_date):
        creative.creative_status == APPROVED;
        campaign.campaign_status == ACTIVE;
        campaign.flight_start_date <= D <= campaign.flight_end_date;
        creative.duration_seconds/30 <= contiguous free slots at i;
        fiscal: campaign.spent_cents + committed_cost <= total_budget_cents AND
          (daily spend on D: sum of committed_cost_cents of this campaign's
          PROVISIONAL/COMMITTED decisions on loops with broadcast_date == D,
          including this run's reservations) + committed_cost <= daily_budget_cents;
        separation: creative.iab_category not in {categories of DIRECT decisions
          already placed in this run} and not in {categories of
          PROVISIONAL/COMMITTED DIRECT decisions on other breaks of the same
          loop whose gap to this break <= channel.ad_separation_window_seconds
          (gap = later.start_offset - earlier.end; touching counts)}.
      Ranking: campaign.cpm_cents DESC, then campaign.priority DESC, then
        creative.created_at ASC, then campaign.created_at ASC.
      HOUSE waterfall for slots with no DIRECT fit: house_ad_status == ACTIVE,
        channel_id null or == loop.channel_id, placements on D so far <
        daily_impression_cap; ranked priority_weight DESC, created_at ASC;
        each HOUSE placement occupies exactly 1 slot.
      Remaining free slots are SLATE (no decision row is created).
      committed_cost_cents (DIRECT) = round_half_up(campaign.cpm_cents *
        channel.avg_slot_impressions * slots_spanned / 1000).
    constants: { SLOT_SECONDS: 30 }
    input_set: "APPROVED creatives; ACTIVE campaigns; ACTIVE house ads; existing decisions of the same loop"
    note: "Selector pins eligibility filter, ranking, tie-break (created_at only, never id), and empty-pool fallback (slate)."

  - name: competitive_separation_gap
    trigger: "inside decision_slot_allocation"
    algorithm: constraint_propagation
    formula: |
      For breaks b1 (ends e1) and b2 (starts s2 >= e1) on the same loop:
      gap = s2 - e1. Adjacent iff gap <= channel.ad_separation_window_seconds
      (gap == window counts as adjacent). The same IAB category may not appear
      in DIRECT decisions of adjacent breaks, nor twice within one break.
    input_set: "Breaks of the same loop with PROVISIONAL/COMMITTED DIRECT decisions"

  - name: committed_vs_reconciled_cost
    trigger: "decision run (committed) / break reconcile (reconciled)"
    algorithm: aggregation
    formula: |
      committed_cost_cents = round_half_up(cpm_cents * expected_impressions / 1000)
      reconciled_cost_cents = round_half_up(cpm_cents * actual_impressions / 1000)
      Campaign spend adjusts by the delta at reconcile (may be negative).
    precision: "integer cents, ROUND_HALF_UP"

  - name: cpm_revenue_attribution
    trigger: "revenue report generation (both variants)"
    algorithm: aggregation
    formula: |
      Per (decision d, platform p): revenue_cents(d, p) =
        round_half_up(d.campaign.cpm_cents * imps(d, p) / 1000)
      where imps(d, p) = SUM(quantity) over AD_IMPRESSION events with
      decision_id == d.id and platform_id == p.id.
      PINNED ROUNDING ORDER: round per (decision, platform) pair FIRST, then
      sum the rounded integers. (Sum-then-round is the rejected alternative
      and yields different cents.)
      Platform gross for the report = sum over included decisions of
      revenue_cents(d, platform).
    precision: "integer cents, ROUND_HALF_UP per (decision, platform), then sum"
    input_set: "Decisions on breaks of loops with broadcast_date inside period_month; variant selects the status filter"

  - name: revenue_share_statement
    trigger: "generate-provisional / recompute / finalize / refinalize"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (removes the circularity between the tier test
      and the share amount):
        1. gross = cpm_revenue_attribution for the report's platform.
        2. Tier selection reads gross only: below = min(gross, T),
           above = max(0, gross - T), where T = agreement.locked_tier_threshold_cents.
        3. share_raw = below * locked_rev_share_bps_below
                     + above * locked_rev_share_bps_above  (basis points)
        4. platform_share_cents = max(round_half_up(share_raw / 10000),
                                      locked_minimum_guarantee_cents)
        5. net_revenue_cents = gross - platform_share_cents
      Share rounds ONCE at statement level — deliberately different from the
      per-(decision, platform) rounding of cpm_revenue_attribution.
    variants:
      - name: provisional
        when: "generate-provisional / recompute (report DRAFT or PROVISIONAL)"
        difference: "Includes decisions in status COMMITTED or RECONCILED; uses the agreement's current locked snapshot"
      - name: final
        when: "finalize / refinalize (report PROVISIONAL or DISPUTED)"
        difference: "Includes only RECONCILED decisions; same locked snapshot. Fewer included decisions => smaller gross whenever unreconciled decisions have impressions"
    input_set: "Decisions on breaks of loops with broadcast_date in period_month, filtered by variant"

  - name: fill_rate
    trigger: "snapshot computation; readable per break from its fill seconds"
    algorithm: aggregation
    formula: |
      direct_fill_rate    = direct_seconds / capacity_seconds
      effective_fill_rate = (direct_seconds + house_seconds) / capacity_seconds
      Scale-4 fixed point, ROUND_HALF_UP; 0.0000 when capacity_seconds == 0.
    variants:
      - name: direct_only
        when: "fill quality seen by ad-sales"
        difference: "Numerator excludes HOUSE filler; always <= effective"
      - name: effective
        when: "viewer-experience fill"
        difference: "Numerator includes HOUSE substitution; equals 1.0000 minus slate share"
    input_set: "Breaks of the PUBLISHED loop for (channel, snapshot_date); decisions in COMMITTED or RECONCILED"

  - name: channel_performance_score
    trigger: "snapshot computation"
    algorithm: weighted_scoring
    formula: |
      score = min(100,
                  round_half_up(direct_fill_rate * 80)
                + 20 * I[watch_seconds >= 60000]
                + 20 * I[ecpm_cents >= 2000])
      Three inputs (fill rate, watch seconds, ecpm) with nested min and
      threshold indicators — non-linear interaction; flat 0 below thresholds.
    constants: { WATCH_SECONDS_BONUS_THRESHOLD: 60000, ECPM_BONUS_THRESHOLD_CENTS: 2000, FILL_WEIGHT: 80 }
    input_set: "The snapshot's own computed fields"

  - name: peak_concurrent_viewers
    trigger: "snapshot computation"
    algorithm: chronological
    formula: |
      Replay SESSION_START (+1) and SESSION_END (-1) events of the channel-day
      ordered by occurred_at_utc ASC, ties by created_at ASC; running count
      floors at 0; peak = max running count.
    input_set: "SESSION_START/SESSION_END events with occurred_at_utc in the half-open day window [date 00:00:00Z, date+1 00:00:00Z)"

  - name: ecpm_calculation
    trigger: "snapshot computation"
    algorithm: aggregation
    formula: |
      ecpm_cents = round_half_up(direct_revenue_cents * 1000 / direct_sold_impressions)
      when direct_sold_impressions > 0; exactly 0 when impressions == 0
      (pinned zero-division rule — not null, not an error).
    precision: "integer cents, ROUND_HALF_UP"

  - name: channel_posture_recompute
    trigger: "grant revoke, grant expiry, loop publish, run-ops"
    algorithm: threshold
    formula: |
      FROZEN  iff exists PUBLISHED loop of the channel with an entry whose air
              window lacks a covering ACTIVE grant.
      GUARDED iff not FROZEN and (last_published_on is null with
              channel_status == LIVE, or current logical date >
              last_published_on + refresh_cadence_days — strictly greater).
      ACTIVE  otherwise.
    input_set: "Channel's PUBLISHED loops, their entries' grants, last_published_on"

  - name: refresh_staleness
    trigger: "run-ops; publish"
    algorithm: threshold
    formula: |
      stale iff current_logical_date > last_published_on + refresh_cadence_days.
      On the exact date last_published_on + cadence the channel is NOT stale
      (boundary: strict >).
    input_set: "Channel.last_published_on, refresh_cadence_days, logical clock"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Request body shape: required fields present, enum values valid, numeric ranges (e.g. rev share 0..6000 -> ERR_REV_SHARE_OUT_OF_RANGE, max_plays > 0, runtime_seconds > 0). Creative duration is NOT shape-checked here — it is an approve-time ad-quality rule (priority 10)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 3
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK targets exist"
    error_id: "ERR_NOT_FOUND (path, 404) / ERR_REFERENCE_NOT_FOUND (body, 422)"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: auth
    check: "Ownership scope: DistributorPartner may only read/dispute reports and create viewership events whose platform_id == caller's X-User-ID"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "platform-scoped endpoints called by DistributorPartner"
  - priority: 6
    category: auth
    check: "Segregation of duties: creative approve/reject reviewer != creative.created_by_user_id; report finalize/refinalize/settle controller != report.generated_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "creative approve/reject; report finalize/refinalize/settle"
  - priority: 7
    category: state
    check: "Transition valid from the resource's current state (incl. terminal lockdown); channel guards: publish requires channel_status == LIVE (ERR_CHANNEL_NOT_LIVE); loop validate/lock/publish, decision-runs blocked while channel_posture == FROZEN (ERR_CHANNEL_POSTURE_FROZEN)"
    error_id: "ERR_INVALID_STATE_TRANSITION / ERR_CHANNEL_NOT_LIVE / ERR_CHANNEL_POSTURE_FROZEN"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_<parent>_version equals the parent entity's current version"
    error_id: "ERR_STALE_CHANNEL_VERSION / ERR_STALE_BREAK_VERSION / ERR_STALE_REPORT_VERSION"
    http_status: 412
    applies_to: "publish, decision-runs, recompute"
  - priority: 9
    category: business_referential
    check: "Referenced entity usable: entry content AVAILABLE (ERR_CONTENT_NOT_AVAILABLE); creative.iab_category == campaign.iab_category (ERR_CATEGORY_MISMATCH); report create finds an agreement covering the period with a locked snapshot (ERR_NO_COVERING_AGREEMENT)"
    error_id: "ERR_CONTENT_NOT_AVAILABLE / ERR_CATEGORY_MISMATCH / ERR_NO_COVERING_AGREEMENT"
    http_status: 422
    applies_to: "entry add, creative approve, report create"
  - priority: 10
    category: business_safety
    check: "Rights & ad-quality safety: every entry air window covered with enough remaining plays (ERR_RIGHTS_WINDOW_VIOLATION / ERR_PLAYS_EXHAUSTED); creative duration in {30,60} at approve (ERR_AD_QUALITY_RULE)"
    error_id: "ERR_RIGHTS_WINDOW_VIOLATION / ERR_PLAYS_EXHAUSTED / ERR_AD_QUALITY_RULE"
    http_status: 422
    applies_to: "loop validate/publish, creative approve"
  - priority: 11
    category: business_temporal
    check: "Windows and dates: grant window_end > window_start (ERR_INVALID_WINDOW); grant half-open overlap per (content, channel) among PENDING/ACTIVE (ERR_GRANT_WINDOW_OVERLAP); agreement closed-interval overlap per (channel, platform) among NEGOTIATION/ACTIVE/SUSPENDED, adjacency counts (ERR_AGREEMENT_WINDOW_OVERLAP); broadcast_date >= today at create/publish (ERR_BROADCAST_DATE_IN_PAST); flight_end >= flight_start (ERR_INVALID_FLIGHT); report period fully elapsed (ERR_REPORT_PERIOD_NOT_ELAPSED)"
    error_id: "ERR_INVALID_WINDOW / ERR_GRANT_WINDOW_OVERLAP / ERR_AGREEMENT_WINDOW_OVERLAP / ERR_BROADCAST_DATE_IN_PAST / ERR_INVALID_FLIGHT / ERR_REPORT_PERIOD_NOT_ELAPSED"
    http_status: 422
    applies_to: "grant create, agreement create, loop create/publish, campaign create, report create/finalize"
  - priority: 12
    category: business_constraint
    check: "Uniqueness & capacity: one loop per (channel, broadcast_date) in {DRAFT,VALIDATED,LOCKED} (ERR_DUPLICATE_LOOP_DATE); exact tiling at validate (ERR_LOOP_NOT_TILED); entry/break add overflowing loop duration (ERR_LOOP_OVERFLOW); break duration multiple of 30 in [30,240] (ERR_BREAK_DURATION_INVALID); total break seconds <= 25% of loop (ERR_AD_CAPACITY_EXCEEDED); one report per (channel, platform, period) (ERR_DUPLICATE_REPORT); dispute_round < 3 (ERR_DISPUTE_ROUND_LIMIT)"
    error_id: "ERR_DUPLICATE_LOOP_DATE / ERR_LOOP_NOT_TILED / ERR_LOOP_OVERFLOW / ERR_BREAK_DURATION_INVALID / ERR_AD_CAPACITY_EXCEEDED / ERR_DUPLICATE_REPORT / ERR_DISPUTE_ROUND_LIMIT"
    http_status: 409
    applies_to: "loop create/validate, entry add, break mark, report create/dispute"
  - priority: 13
    category: business_fiscal
    check: "Budget integrity: adjust-budget new_total_budget_cents >= spent_cents (ERR_BUDGET_BELOW_SPENT); resume requires spent_cents < total_budget_cents (ERR_BUDGET_EXHAUSTED)"
    error_id: "ERR_BUDGET_BELOW_SPENT / ERR_BUDGET_EXHAUSTED"
    http_status: 422
    applies_to: "campaign adjust-budget, campaign resume"

# =============================================================================
# §1.5 API Endpoint Table
# GET list endpoints all accept pagination inputs (limit?, offset?) plus the
# filters listed. Role set ALL_ROLES expands to every role in §1.7.
# =============================================================================
endpoints:
  # --- Channel ---
  - method: POST
    path: "/v1/channels"
    description: "Create a channel (starts DRAFT / posture ACTIVE)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, genre, timezone, "loop_duration_seconds?", "refresh_cadence_days?", "ad_separation_window_seconds?", "avg_slot_impressions?"]
    output: Channel
    side_effects: ["channel_status = DRAFT, channel_posture = ACTIVE, ops_run_index = 0"]
  - method: GET
    path: "/v1/channels"
    description: "List channels"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_status?", "channel_posture?", "limit?", "offset?"]
    output: Channel[]
    side_effects: []
  - method: GET
    path: "/v1/channels/{channel_id}"
    description: "Get one channel"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: Channel
    side_effects: []
  - method: POST
    path: "/v1/channels/{channel_id}/go-live"
    description: "DRAFT -> LIVE; requires a LOCKED or PUBLISHED loop with broadcast_date >= today"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["channel.version += 1"]
  - method: POST
    path: "/v1/channels/{channel_id}/suspend"
    description: "LIVE -> SUSPENDED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["channel.version += 1"]
  - method: POST
    path: "/v1/channels/{channel_id}/resume"
    description: "SUSPENDED -> LIVE; blocked while posture FROZEN"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["channel.version += 1"]
  - method: POST
    path: "/v1/channels/{channel_id}/take-offline"
    description: "LIVE|SUSPENDED -> OFFLINE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["channel.version += 1"]
  - method: POST
    path: "/v1/channels/{channel_id}/archive"
    description: "OFFLINE -> ARCHIVED (terminal); no future-dated PUBLISHED loops allowed"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["channel.version += 1"]
  - method: POST
    path: "/v1/channels/{channel_id}/run-ops"
    description: "Ops-run checkpoint: increments ops_run_index; expires grants whose window_end_utc <= now (PENDING and ACTIVE); recomputes posture (staleness + FROZEN conditions); revives nothing else"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Channel
    side_effects: ["ops_run_index += 1", "grant expiry cascade (content re-evaluation, loop reverts)", "channel_posture recompute"]

  # --- ContentAsset ---
  - method: POST
    path: "/v1/content-assets"
    description: "Ingest a content asset (starts INGESTING)"
    roles: [ContentLicensing]
    code: 201
    input: [title, content_type, runtime_seconds, rating, genre]
    output: ContentAsset
    side_effects: []
  - method: GET
    path: "/v1/content-assets"
    description: "List content assets"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["content_status?", "genre?", "limit?", "offset?"]
    output: ContentAsset[]
    side_effects: []
  - method: GET
    path: "/v1/content-assets/{content_id}"
    description: "Get one content asset"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: ContentAsset
    side_effects: []
  - method: POST
    path: "/v1/content-assets/{content_id}/mark-available"
    description: "INGESTING -> AVAILABLE"
    roles: [ContentLicensing]
    code: 200
    input: []
    output: ContentAsset
    side_effects: []
  - method: POST
    path: "/v1/content-assets/{content_id}/pull"
    description: "AVAILABLE -> PULLED; reverts VALIDATED/LOCKED loops containing it (loop-revert cascade)"
    roles: [ContentLicensing]
    code: 200
    input: []
    output: ContentAsset
    side_effects: ["loop-revert cascade (decisions voided, breaks revert to MARKED)"]
  - method: POST
    path: "/v1/content-assets/{content_id}/reinstate"
    description: "PULLED -> AVAILABLE; requires a PENDING or ACTIVE grant"
    roles: [ContentLicensing]
    code: 200
    input: []
    output: ContentAsset
    side_effects: []
  - method: POST
    path: "/v1/content-assets/{content_id}/archive"
    description: "PULLED -> ARCHIVED (terminal); requires no PENDING/ACTIVE grants"
    roles: [ContentLicensing]
    code: 200
    input: []
    output: ContentAsset
    side_effects: []

  # --- RightsGrant ---
  - method: POST
    path: "/v1/rights-grants"
    description: "Create a rights grant (PENDING). Rejects window overlap for same (content_id, channel_id) among PENDING/ACTIVE grants — half-open semantics, adjacency allowed"
    roles: [ContentLicensing]
    code: 201
    input: [channel_id, content_id, window_start_utc, window_end_utc, max_plays]
    output: RightsGrant
    side_effects: []
  - method: GET
    path: "/v1/rights-grants"
    description: "List rights grants"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_id?", "content_id?", "grant_status?", "limit?", "offset?"]
    output: RightsGrant[]
    side_effects: []
  - method: GET
    path: "/v1/rights-grants/{grant_id}"
    description: "Get one rights grant"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: RightsGrant
    side_effects: []
  - method: POST
    path: "/v1/rights-grants/{grant_id}/activate"
    description: "PENDING -> ACTIVE; window must contain current logical time; content AVAILABLE"
    roles: [ContentLicensing]
    code: 200
    input: []
    output: RightsGrant
    side_effects: []
  - method: POST
    path: "/v1/rights-grants/{grant_id}/revoke"
    description: "PENDING|ACTIVE -> REVOKED; triggers channel FROZEN evaluation and content re-evaluation"
    roles: [ContentLicensing]
    code: 200
    input: []
    output: RightsGrant
    side_effects: ["channel FROZEN evaluation", "content re-evaluation (possible WINDOW_EXPIRED + loop-revert cascade)"]

  # --- PlaylistLoop / entries / breaks ---
  - method: POST
    path: "/v1/playlist-loops"
    description: "Create a loop (DRAFT); one loop per (channel, broadcast_date) in {DRAFT,VALIDATED,LOCKED}"
    roles: [ChannelProgrammer]
    code: 201
    input: [channel_id, broadcast_date]
    output: PlaylistLoop
    side_effects: []
  - method: GET
    path: "/v1/playlist-loops"
    description: "List loops"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_id?", "loop_status?", "broadcast_date?", "supersedes_loop_id?", "limit?", "offset?"]
    output: PlaylistLoop[]
    side_effects: []
  - method: GET
    path: "/v1/playlist-loops/{loop_id}"
    description: "Get one loop"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: PlaylistLoop
    side_effects: []
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/entries"
    description: "Append a content entry (loop must be DRAFT); server assigns sequence_index and offsets"
    roles: [ChannelProgrammer]
    code: 201
    input: [content_id]
    output: PlaylistEntry
    side_effects: ["loop_offset_walk recompute", "loop.used_seconds updated"]
  - method: GET
    path: "/v1/playlist-entries"
    description: "List playlist entries"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["loop_id?", "content_id?", "limit?", "offset?"]
    output: PlaylistEntry[]
    side_effects: []
  - method: GET
    path: "/v1/playlist-entries/{entry_id}"
    description: "Get one playlist entry"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: PlaylistEntry
    side_effects: []
  - method: DELETE
    path: "/v1/playlist-entries/{entry_id}"
    description: "Remove an entry (loop DRAFT only); offsets recomputed, break after_entry_index clamped"
    roles: [ChannelProgrammer]
    code: 204
    input: []
    output: null
    side_effects: ["loop_offset_walk recompute"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/ad-breaks"
    description: "Mark an ad break after the current last entry (loop DRAFT only); duration multiple of 30 within [30,240]"
    roles: [ChannelProgrammer]
    code: 201
    input: [duration_seconds]
    output: AdBreak
    side_effects: ["loop_offset_walk recompute", "loop.used_seconds updated"]
  - method: GET
    path: "/v1/ad-breaks"
    description: "List ad breaks"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["loop_id?", "break_status?", "limit?", "offset?"]
    output: AdBreak[]
    side_effects: []
  - method: GET
    path: "/v1/ad-breaks/{break_id}"
    description: "Get one ad break"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: AdBreak
    side_effects: []
  - method: DELETE
    path: "/v1/ad-breaks/{break_id}"
    description: "Remove a break (loop DRAFT only)"
    roles: [ChannelProgrammer]
    code: 204
    input: []
    output: null
    side_effects: ["loop_offset_walk recompute"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/validate"
    description: "DRAFT -> VALIDATED: exact tiling, ad capacity, content availability, grant coverage (PENDING or ACTIVE) with aggregate plays"
    roles: [ChannelProgrammer]
    code: 200
    input: []
    output: PlaylistLoop
    side_effects: ["validated_at set"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/revert-to-draft"
    description: "VALIDATED -> DRAFT (rework); provisional decisions voided"
    roles: [ChannelProgrammer]
    code: 200
    input: []
    output: PlaylistLoop
    side_effects: ["loop-revert cascade"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/lock"
    description: "VALIDATED -> LOCKED; requires every break DECIDED; commits PROVISIONAL decisions and accrues campaign spend"
    roles: [ChannelProgrammer]
    code: 200
    input: []
    output: PlaylistLoop
    side_effects: ["decisions -> COMMITTED in (break sequence_index, slot_index) order", "campaign spent accrual + EXHAUSTED cascade"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/unlock"
    description: "LOCKED -> VALIDATED; compensates committed decisions back to PROVISIONAL and refunds spend"
    roles: [ChannelProgrammer]
    code: 200
    input: []
    output: PlaylistLoop
    side_effects: ["decisions -> PROVISIONAL", "campaign spend refund", "possible EXHAUSTED -> ACTIVE revival"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/publish"
    description: "LOCKED -> PUBLISHED; supersedes any PUBLISHED loop for same (channel, date); consumes grant plays; OCC on Channel.version"
    roles: [ChannelProgrammer]
    code: 200
    input: [expected_channel_version]
    output: PlaylistLoop
    side_effects: ["increments Channel.version by 1", "supersedes prior PUBLISHED loop", "rights_play_consumption (EXHAUSTED cascade)", "last_published_on set", "posture recompute"]
  - method: POST
    path: "/v1/playlist-loops/{loop_id}/archive"
    description: "PUBLISHED|SUPERSEDED -> ARCHIVED; broadcast_date must be in the past"
    roles: [ChannelProgrammer]
    code: 200
    input: []
    output: PlaylistLoop
    side_effects: []

  # --- Fill decisions ---
  - method: POST
    path: "/v1/ad-breaks/{break_id}/decision-runs"
    description: "Execute server-side ad insertion selector; creates PROVISIONAL DIRECT/HOUSE decisions; OCC on AdBreak.version; re-run voids prior PROVISIONALs first"
    roles: [AdOps]
    code: 201
    input: [expected_break_version]
    output: FillDecision[]
    side_effects: ["increments AdBreak.version by 1", "prior PROVISIONAL decisions -> VOIDED", "break MARKED|DECIDED -> DECIDED", "fill seconds recomputed"]
  - method: POST
    path: "/v1/ad-breaks/{break_id}/mark-aired"
    description: "DECIDED -> AIRED; requires parent loop PUBLISHED"
    roles: [ChannelProgrammer]
    code: 200
    input: []
    output: AdBreak
    side_effects: ["increments AdBreak.version by 1"]
  - method: POST
    path: "/v1/ad-breaks/{break_id}/reconcile"
    description: "AIRED -> RECONCILED; matches AD_IMPRESSION events (SUM quantity) per decision, sets actual_impressions and reconciled_cost_cents, adjusts campaign spend (may revive EXHAUSTED campaigns)"
    roles: [AdOps]
    code: 200
    input: []
    output: AdBreak
    side_effects: ["decisions COMMITTED -> RECONCILED with reconciled costs", "campaign spent delta adjustment (possible EXHAUSTED -> ACTIVE)", "increments AdBreak.version by 1"]
  - method: GET
    path: "/v1/fill-decisions"
    description: "List fill decisions"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["break_id?", "campaign_id?", "creative_id?", "house_ad_id?", "decision_status?", "fill_type?", "limit?", "offset?"]
    output: FillDecision[]
    side_effects: []
  - method: GET
    path: "/v1/fill-decisions/{decision_id}"
    description: "Get one fill decision"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: FillDecision
    side_effects: []
  - method: POST
    path: "/v1/fill-decisions/{decision_id}/void"
    description: "PROVISIONAL|COMMITTED -> VOIDED; COMMITTED refunds campaign spend"
    roles: [AdOps]
    code: 200
    input: []
    output: FillDecision
    side_effects: ["campaign refund (possible EXHAUSTED -> ACTIVE)", "break recompute (possible DECIDED -> MARKED)"]

  # --- Ad campaigns ---
  - method: POST
    path: "/v1/ad-campaigns"
    description: "Create a campaign (DRAFT)"
    roles: [AdOps]
    code: 201
    input: [advertiser_name, iab_category, total_budget_cents, daily_budget_cents, cpm_cents, flight_start_date, flight_end_date, "priority?"]
    output: AdCampaign
    side_effects: []
  - method: GET
    path: "/v1/ad-campaigns"
    description: "List campaigns"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["campaign_status?", "iab_category?", "limit?", "offset?"]
    output: AdCampaign[]
    side_effects: []
  - method: GET
    path: "/v1/ad-campaigns/{campaign_id}"
    description: "Get one campaign"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/v1/ad-campaigns/{campaign_id}/activate"
    description: "DRAFT -> ACTIVE; requires >= 1 APPROVED creative and flight_end_date >= today"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/v1/ad-campaigns/{campaign_id}/pause"
    description: "ACTIVE -> PAUSED; voids this campaign's PROVISIONAL decisions"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["PROVISIONAL decisions -> VOIDED", "break recompute cascade"]
  - method: POST
    path: "/v1/ad-campaigns/{campaign_id}/resume"
    description: "PAUSED -> ACTIVE; requires spent < budget and flight not ended"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: []
  - method: POST
    path: "/v1/ad-campaigns/{campaign_id}/complete"
    description: "ACTIVE|PAUSED|EXHAUSTED -> COMPLETED (terminal); same voiding cascade as pause"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCampaign
    side_effects: ["PROVISIONAL decisions -> VOIDED", "break recompute cascade"]
  - method: POST
    path: "/v1/ad-campaigns/{campaign_id}/adjust-budget"
    description: "Change total_budget_cents; rejected when below spent_cents"
    roles: [AdOps]
    code: 200
    input: [new_total_budget_cents]
    output: AdCampaign
    side_effects: ["if EXHAUSTED and new total > spent_cents and flight valid -> ACTIVE"]

  # --- Ad creatives ---
  - method: POST
    path: "/v1/ad-creatives"
    description: "Traffic a creative (PENDING_REVIEW); records created_by_user_id"
    roles: [AdOps]
    code: 201
    input: [campaign_id, brand, iab_category, duration_seconds]
    output: AdCreative
    side_effects: []
  - method: GET
    path: "/v1/ad-creatives"
    description: "List creatives"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["campaign_id?", "creative_status?", "limit?", "offset?"]
    output: AdCreative[]
    side_effects: []
  - method: GET
    path: "/v1/ad-creatives/{creative_id}"
    description: "Get one creative"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: AdCreative
    side_effects: []
  - method: POST
    path: "/v1/ad-creatives/{creative_id}/approve"
    description: "PENDING_REVIEW -> APPROVED; segregation (reviewer != creator); category must match campaign; duration in {30,60}"
    roles: [AdQualityReviewer]
    code: 200
    input: []
    output: AdCreative
    side_effects: ["reviewed_by_user_id set"]
  - method: POST
    path: "/v1/ad-creatives/{creative_id}/reject"
    description: "PENDING_REVIEW -> REJECTED; segregation (reviewer != creator)"
    roles: [AdQualityReviewer]
    code: 200
    input: [reason]
    output: AdCreative
    side_effects: ["rejection_reason set"]
  - method: POST
    path: "/v1/ad-creatives/{creative_id}/resubmit"
    description: "REJECTED -> PENDING_REVIEW (cyclic rework)"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCreative
    side_effects: ["rejection_reason cleared"]
  - method: POST
    path: "/v1/ad-creatives/{creative_id}/retire"
    description: "APPROVED -> RETIRED (terminal); voids PROVISIONAL decisions using it"
    roles: [AdOps]
    code: 200
    input: []
    output: AdCreative
    side_effects: ["PROVISIONAL decisions -> VOIDED", "break recompute cascade"]

  # --- House ads ---
  - method: POST
    path: "/v1/house-ads"
    description: "Create a house ad (ACTIVE); channel_id null = network-wide"
    roles: [AdOps]
    code: 201
    input: [name, "channel_id?", "duration_seconds?", priority_weight, daily_impression_cap]
    output: HouseAd
    side_effects: []
  - method: GET
    path: "/v1/house-ads"
    description: "List house ads"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_id?", "house_ad_status?", "limit?", "offset?"]
    output: HouseAd[]
    side_effects: []
  - method: GET
    path: "/v1/house-ads/{house_ad_id}"
    description: "Get one house ad"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: HouseAd
    side_effects: []
  - method: PATCH
    path: "/v1/house-ads/{house_ad_id}"
    description: "Status change: ACTIVE<->PAUSED, -> RETIRED (terminal)"
    roles: [AdOps]
    code: 200
    input: [target_status]
    output: HouseAd
    side_effects: []

  # --- Distributor platforms ---
  - method: POST
    path: "/v1/distributor-platforms"
    description: "Create a platform (ONBOARDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, reporting_tier]
    output: DistributorPlatform
    side_effects: []
  - method: GET
    path: "/v1/distributor-platforms"
    description: "List platforms"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["platform_status?", "limit?", "offset?"]
    output: DistributorPlatform[]
    side_effects: []
  - method: GET
    path: "/v1/distributor-platforms/{platform_id}"
    description: "Get one platform"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: DistributorPlatform
    side_effects: []
  - method: PATCH
    path: "/v1/distributor-platforms/{platform_id}"
    description: "Status change: ONBOARDING->ACTIVE, ACTIVE<->SUSPENDED, any non-terminal -> OFFBOARDED (terminates agreements)"
    roles: [PlatformAdmin]
    code: 200
    input: [target_status]
    output: DistributorPlatform
    side_effects: ["OFFBOARDED: agreements -> TERMINATED"]

  # --- Distribution agreements ---
  - method: POST
    path: "/v1/distribution-agreements"
    description: "Create an agreement (NEGOTIATION); closed-window overlap per (channel, platform) rejected — adjacency counts as overlap"
    roles: [PlatformAdmin]
    code: 201
    input: [channel_id, platform_id, rev_share_bps_below, rev_share_bps_above, tier_threshold_cents, "minimum_guarantee_cents?", effective_start_date, effective_end_date]
    output: DistributionAgreement
    side_effects: []
  - method: GET
    path: "/v1/distribution-agreements"
    description: "List agreements"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_id?", "platform_id?", "agreement_status?", "limit?", "offset?"]
    output: DistributionAgreement[]
    side_effects: []
  - method: GET
    path: "/v1/distribution-agreements/{agreement_id}"
    description: "Get one agreement"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: DistributionAgreement
    side_effects: []
  - method: PATCH
    path: "/v1/distribution-agreements/{agreement_id}"
    description: "Status change: NEGOTIATION->ACTIVE (pins locked rate snapshot), ACTIVE<->SUSPENDED (re-activation keeps pinned rates), -> TERMINATED. Rate fields editable only while NEGOTIATION"
    roles: [PlatformAdmin]
    code: 200
    input: ["target_status?", "rev_share_bps_below?", "rev_share_bps_above?", "tier_threshold_cents?", "minimum_guarantee_cents?"]
    output: DistributionAgreement
    side_effects: ["first activation pins locked_* rate snapshot from current rate fields"]

  # --- Revenue reports ---
  - method: POST
    path: "/v1/revenue-reports"
    description: "Create a report (DRAFT); resolves covering agreement; period must be fully elapsed; unique per (channel, platform, period)"
    roles: [FinanceAnalyst]
    code: 201
    input: [channel_id, platform_id, period_month]
    output: RevenueReport
    side_effects: ["agreement_id resolved", "generated_by_user_id set"]
  - method: GET
    path: "/v1/revenue-reports"
    description: "List reports; DistributorPartner sees only own platform's"
    roles: [PlatformAdmin, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_id?", "platform_id?", "agreement_id?", "report_status?", "period_month?", "limit?", "offset?"]
    output: RevenueReport[]
    side_effects: []
  - method: GET
    path: "/v1/revenue-reports/{report_id}"
    description: "Get one report; DistributorPartner may only read own platform's"
    roles: [PlatformAdmin, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: RevenueReport
    side_effects: []
  - method: POST
    path: "/v1/revenue-reports/{report_id}/generate-provisional"
    description: "DRAFT -> PROVISIONAL; computes provisional variant (COMMITTED + RECONCILED decisions)"
    roles: [FinanceAnalyst]
    code: 200
    input: []
    output: RevenueReport
    side_effects: ["revenue_share_statement (provisional)", "calculation_variant = PROVISIONAL"]
  - method: POST
    path: "/v1/revenue-reports/{report_id}/recompute"
    description: "Recompute provisional figures while DRAFT|PROVISIONAL; OCC on RevenueReport.version"
    roles: [FinanceAnalyst]
    code: 200
    input: [expected_report_version]
    output: RevenueReport
    side_effects: ["increments RevenueReport.version by 1", "revenue_share_statement (provisional)"]
  - method: POST
    path: "/v1/revenue-reports/{report_id}/finalize"
    description: "PROVISIONAL -> FINALIZED; segregation vs generator; computes FINAL variant (RECONCILED only) with locked agreement rates"
    roles: [FinanceController]
    code: 200
    input: []
    output: RevenueReport
    side_effects: ["revenue_share_statement (final)", "calculation_variant = FINAL"]
  - method: POST
    path: "/v1/revenue-reports/{report_id}/dispute"
    description: "FINALIZED -> DISPUTED; DistributorPartner owning platform only; dispute_round must be < 3"
    roles: [DistributorPartner]
    code: 200
    input: [dispute_reason]
    output: RevenueReport
    side_effects: []
  - method: POST
    path: "/v1/revenue-reports/{report_id}/refinalize"
    description: "DISPUTED -> FINALIZED (rework cycle); recomputes FINAL variant; dispute_round += 1"
    roles: [FinanceController]
    code: 200
    input: []
    output: RevenueReport
    side_effects: ["revenue_share_statement (final)", "dispute_round += 1"]
  - method: POST
    path: "/v1/revenue-reports/{report_id}/settle"
    description: "FINALIZED -> SETTLED (terminal); segregation vs generator"
    roles: [FinanceController]
    code: 200
    input: []
    output: RevenueReport
    side_effects: []

  # --- Viewership events ---
  - method: POST
    path: "/v1/viewership-events"
    description: "Ingest a viewership/ad event (append-only). DistributorPartner: platform_id must equal caller's platform id (or omitted -> stamped). PlatformAdmin must pass platform_id"
    roles: [DistributorPartner, PlatformAdmin]
    code: 201
    input: [channel_id, event_type, "platform_id?", "break_id?", "decision_id?", "content_id?", viewer_session_id, occurred_at_utc, "watch_seconds?", "quantity?"]
    output: ViewershipEvent
    side_effects: []
  - method: GET
    path: "/v1/viewership-events"
    description: "List events (internal roles only — not DistributorPartner)"
    roles: [PlatformAdmin, ChannelProgrammer, AdOps, FinanceAnalyst, FinanceController]
    code: 200
    input: ["channel_id?", "platform_id?", "break_id?", "decision_id?", "content_id?", "event_type?", "limit?", "offset?"]
    output: ViewershipEvent[]
    side_effects: []
  - method: GET
    path: "/v1/viewership-events/{event_id}"
    description: "Get one event"
    roles: [PlatformAdmin, ChannelProgrammer, AdOps, FinanceAnalyst, FinanceController]
    code: 200
    input: []
    output: ViewershipEvent
    side_effects: []

  # --- Channel-day snapshots ---
  - method: POST
    path: "/v1/channels/{channel_id}/snapshot-computations"
    description: "Compute (upsert) the ChannelDaySnapshot for snapshot_date from events and the date's PUBLISHED loop"
    roles: [PlatformAdmin, ChannelProgrammer]
    code: 201
    input: [snapshot_date]
    output: ChannelDaySnapshot
    side_effects: ["snapshot fields recomputed; snapshot.version += 1 on recompute"]
  - method: GET
    path: "/v1/channel-day-snapshots"
    description: "List snapshots"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: ["channel_id?", "snapshot_date?", "limit?", "offset?"]
    output: ChannelDaySnapshot[]
    side_effects: []
  - method: GET
    path: "/v1/channel-day-snapshots/{snapshot_id}"
    description: "Get one snapshot"
    roles: [PlatformAdmin, ChannelProgrammer, ContentLicensing, AdOps, AdQualityReviewer, FinanceAnalyst, FinanceController, DistributorPartner]
    code: 200
    input: []
    output: ChannelDaySnapshot
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/v1/_clock/set-current-utc"
    description: "Set the logical clock. Startup default before any set call is exactly 2026-08-01T00:00:00Z (never falls back to wall-clock). All server-stamped timestamps and all date comparisons read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced (never moves backward; setting an earlier instant is rejected with ERR_INVALID_REQUEST)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum value invalid, numeric range violated, or clock moved backward" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (checked left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "Body FK target does not exist" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "DistributorPartner touching a resource of a different platform" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer finalized/approved their own work (creative creator or report generator)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not valid from the resource's current state, incl. terminal lockdown" }
  - { id: ERR_CHANNEL_NOT_LIVE, http: 409, condition: "Publish requires channel_status == LIVE" }
  - { id: ERR_CHANNEL_POSTURE_FROZEN, http: 409, condition: "Loop validate/lock/publish or decision-run while channel_posture == FROZEN" }
  - { id: ERR_STALE_CHANNEL_VERSION, http: 412, condition: "OCC: expected_channel_version != Channel.version at publish" }
  - { id: ERR_STALE_BREAK_VERSION, http: 412, condition: "OCC: expected_break_version != AdBreak.version at decision-run" }
  - { id: ERR_STALE_REPORT_VERSION, http: 412, condition: "OCC: expected_report_version != RevenueReport.version at recompute" }
  - { id: ERR_CONTENT_NOT_AVAILABLE, http: 422, condition: "Entry content not AVAILABLE (or grant ops on non-AVAILABLE content)" }
  - { id: ERR_CATEGORY_MISMATCH, http: 422, condition: "Creative iab_category differs from its campaign's iab_category" }
  - { id: ERR_NO_COVERING_AGREEMENT, http: 422, condition: "No agreement in {ACTIVE, SUSPENDED, TERMINATED} covers (channel, platform, period) with a locked rate snapshot" }
  - { id: ERR_RIGHTS_WINDOW_VIOLATION, http: 422, condition: "Entry air window not contained in any covering grant window (validate: PENDING|ACTIVE; publish: ACTIVE only)" }
  - { id: ERR_PLAYS_EXHAUSTED, http: 422, condition: "Aggregate plays needed by the loop exceed a covering grant's remaining plays" }
  - { id: ERR_AD_QUALITY_RULE, http: 422, condition: "Creative fails ad-quality checks at approve (duration_seconds not in {30, 60})" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end_utc <= window_start_utc" }
  - { id: ERR_GRANT_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with a PENDING/ACTIVE grant for the same (content_id, channel_id); adjacency (end == start) allowed" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Closed-interval overlap with a NEGOTIATION/ACTIVE/SUSPENDED agreement for the same (channel_id, platform_id); adjacency (end == start) counts as overlap" }
  - { id: ERR_BROADCAST_DATE_IN_PAST, http: 422, condition: "broadcast_date < current logical date at loop create or publish" }
  - { id: ERR_INVALID_FLIGHT, http: 422, condition: "flight_end_date < flight_start_date" }
  - { id: ERR_REPORT_PERIOD_NOT_ELAPSED, http: 422, condition: "Current logical date <= last day of period_month at report create/finalize" }
  - { id: ERR_DUPLICATE_LOOP_DATE, http: 409, condition: "Another loop for (channel_id, broadcast_date) exists in {DRAFT, VALIDATED, LOCKED}" }
  - { id: ERR_LOOP_NOT_TILED, http: 422, condition: "used_seconds != channel.loop_duration_seconds at validate (exact equality required)" }
  - { id: ERR_LOOP_OVERFLOW, http: 422, condition: "Adding an entry/break would push used_seconds beyond loop_duration_seconds" }
  - { id: ERR_BREAK_DURATION_INVALID, http: 422, condition: "Break duration not a multiple of 30 or outside [30, 240]" }
  - { id: ERR_AD_CAPACITY_EXCEEDED, http: 422, condition: "Total break seconds would exceed 25% of loop_duration_seconds" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A report already exists for (channel_id, platform_id, period_month)" }
  - { id: ERR_REV_SHARE_OUT_OF_RANGE, http: 422, condition: "rev_share_bps_below/above outside 0..6000" }
  - { id: ERR_DISPUTE_ROUND_LIMIT, http: 422, condition: "dispute when dispute_round == 3 (MAX_DISPUTE_ROUNDS)" }
  - { id: ERR_BUDGET_BELOW_SPENT, http: 422, condition: "adjust-budget new_total_budget_cents < spent_cents" }
  - { id: ERR_BUDGET_EXHAUSTED, http: 422, condition: "resume with spent_cents >= total_budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Network operator superuser: channels lifecycle, platforms, agreements, ops-run, logical clock, snapshot computation"
    identity: opaque
    exclusive_operations: ["POST /v1/channels", "channel lifecycle actions (go-live, suspend, resume, take-offline, archive)", "POST /v1/channels/{id}/run-ops", "POST /v1/distributor-platforms + PATCH status", "POST /v1/distribution-agreements + PATCH status", "POST /v1/_clock/set-current-utc"]
    shared_operations: ["all GET endpoints", "POST /v1/viewership-events", "POST /v1/channels/{id}/snapshot-computations"]
  - name: ChannelProgrammer
    description: "Programming operator: playlist loops, entries, ad-break marking, publish, mark-aired"
    identity: opaque
    exclusive_operations: ["POST /v1/playlist-loops and loop lifecycle (validate, revert-to-draft, lock, unlock, publish, archive)", "POST /v1/playlist-loops/{id}/entries", "DELETE /v1/playlist-entries/{id}", "POST /v1/playlist-loops/{id}/ad-breaks", "DELETE /v1/ad-breaks/{id}", "POST /v1/ad-breaks/{id}/mark-aired"]
    shared_operations: ["all GET endpoints", "POST /v1/channels/{id}/snapshot-computations"]
  - name: ContentLicensing
    description: "Rights & content operator: content assets and rights grants"
    identity: opaque
    exclusive_operations: ["POST /v1/content-assets and content lifecycle (mark-available, pull, reinstate, archive)", "POST /v1/rights-grants", "grant activate/revoke"]
    shared_operations: ["all GET endpoints"]
  - name: AdOps
    description: "Ad trafficking operator: campaigns, creatives (traffic), house ads, decision runs, reconcile, voids"
    identity: opaque
    exclusive_operations: ["POST /v1/ad-campaigns and campaign lifecycle (activate, pause, resume, complete, adjust-budget)", "POST /v1/ad-creatives", "creative resubmit/retire", "POST /v1/house-ads + PATCH status", "POST /v1/ad-breaks/{id}/decision-runs", "POST /v1/ad-breaks/{id}/reconcile", "POST /v1/fill-decisions/{id}/void"]
    shared_operations: ["all GET endpoints"]
  - name: AdQualityReviewer
    description: "Independent ad-quality reviewer; must not review creatives they trafficked (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /v1/ad-creatives/{id}/approve", "POST /v1/ad-creatives/{id}/reject"]
    shared_operations: ["all GET endpoints"]
  - name: FinanceAnalyst
    description: "Revenue analyst: creates and recomputes revenue reports (provisional variant)"
    identity: opaque
    exclusive_operations: ["POST /v1/revenue-reports", "POST /v1/revenue-reports/{id}/generate-provisional", "POST /v1/revenue-reports/{id}/recompute"]
    shared_operations: ["all GET endpoints"]
  - name: FinanceController
    description: "Revenue controller: finalizes, refinalizes, settles; must not finalize own generated reports (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /v1/revenue-reports/{id}/finalize", "POST /v1/revenue-reports/{id}/refinalize", "POST /v1/revenue-reports/{id}/settle"]
    shared_operations: ["all GET endpoints"]
  - name: DistributorPartner
    description: "External distributor platform user; X-User-ID equals the DistributorPlatform id they belong to"
    identity: "entity_backed:DistributorPlatform"
    exclusive_operations: ["POST /v1/revenue-reports/{id}/dispute (own platform's reports only)"]
    shared_operations: ["GET /v1/revenue-reports (own platform only)", "POST /v1/viewership-events (own platform only)", "GET endpoints except /v1/viewership-events*"]
