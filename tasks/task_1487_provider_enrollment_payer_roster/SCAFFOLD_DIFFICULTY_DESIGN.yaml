# =============================================================================
# Scaffold Difficulty Design (Test Targeting Index) — §1.8
# Provider Enrollment & Payer Roster Synchronization
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: effective_date_policy_divergence
        grounds:
          - calculations.enrollment_effective_date
          - entities.Payer.fields.effective_date_policy
          - entities.EnrollmentRecord.fields.effective_date
        distinguishing_aspect: |
          Same requested_effective_date (2026-08-15) and same approval timestamp
          (2026-09-01) produce different EnrollmentRecord.effective_date values
          purely because of the payer's policy variant: APPROVAL_DATE yields
          2026-09-01 while RETRO_90 yields 2026-08-15. Entity domain: enrollment
          effective dating (contrast with the claims-financial dual variant in
          gross_vs_net_recoupment_variants).
        test_recipe:
          setup:
            - "Practice group G with attested provider P"
            - "Payer A with effective_date_policy=APPROVAL_DATE; payer B with RETRO_90"
            - "One SUBMITTED application per payer, both requested_effective_date 2026-08-15"
            - "Logical clock at 2026-09-01T00:00:00Z at approval time"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PB", name: "Payer B", is_medicare: false, effective_date_policy: "RETRO_90", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_b: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-15" }
              as: EnrollmentSpecialist
              captures: { app_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_b}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-15" }
              as: EnrollmentSpecialist
              captures: { app_b: $.data.id }
            - call: "POST /api/enrollment-applications/${app_a}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app_b}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/enrollment-applications/${app_a}/approve"
              as: PayerRepresentative
            - call: "POST /api/enrollment-applications/${app_b}/approve"
              as: PayerRepresentative
          trigger:
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { eff_a: "$.data[0].effective_date" }
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_b}" }
              as: EnrollmentSpecialist
              captures: { eff_b: "$.data[0].effective_date" }
          assert:
            - "EnrollmentRecord(payer A).effective_date == '2026-09-01' (APPROVAL_DATE policy)"
            - "EnrollmentRecord(payer B).effective_date == '2026-08-15' (RETRO_90 policy: max('2026-08-15', '2026-09-01' - 90d = '2026-06-03'))"
            - "${eff_a} != ${eff_b}"

      - name: gross_vs_net_recoupment_variants
        grounds:
          - calculations.retro_recoupment
          - entities.EnrollmentRecord.fields.gross_impacted_cents
          - entities.EnrollmentRecord.fields.net_recouped_cents
        distinguishing_aspect: |
          One retro-effective termination is scored two ways from identical claim
          data: gross_impact counts principal of the denied HELD claim plus the
          recouped RELEASED claim (13000), while net_recoupment counts only the
          recouped claim's principal plus its per-claim fee (8160). Entity
          domain: claims/billing financials (contrast with the enrollment-date
          dual variant in effective_date_policy_divergence).
        test_recipe:
          setup:
            - "Provider P attested; payer with APPROVAL_DATE policy, claims hold enabled, interval 200"
            - "Claim c1 (service 2026-07-15, 5000 cents) created before approval -> HELD, stays HELD after approval because service_date < effective_date 2026-08-01"
            - "Claim c2 (service 2026-08-05, 8000 cents) created after approval -> RELEASED"
            - "Record effective 2026-08-01"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-07-15", amount_cents: 5000 }
              as: EnrollmentSpecialist
              captures: { c1: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-05", amount_cents: 8000 }
              as: EnrollmentSpecialist
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /api/enrollment-records/${rec}/terminate"
              payload: { termination_effective_date: "2026-08-03" }
              as: ComplianceOfficer
              captures: { gross: $.data.gross_impacted_cents, net: $.data.net_recouped_cents }
          assert:
            - "EnrollmentRecord.${rec}.gross_impacted_cents == 13000 (5000 denied-held principal + 8000 recouped principal)"
            - "EnrollmentRecord.${rec}.net_recouped_cents == 8160 (8000 + round_half_up(8000*0.02)=160 fee)"
            - "Claim.${c1}.status == DENIED (denial_reason ENROLLMENT_TERMINATED)"
            - "Claim.${c2}.status == RECOUPED with recoupment_fee_cents == 160"
            - "${gross} != ${net}"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: medicare_revalidation_month_end_snap
        grounds:
          - calculations.revalidation_schedule
          - entities.Payer.fields.is_medicare
          - entities.EnrollmentRecord.fields.revalidation_due_date
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (is_medicare flag,
          revalidation_interval_days, completion timestamp) with a conditional
          branch — a Medicare approval on 2026-08-10 snaps the due date to
          month-end 2031-08-31 (base 2031-08-09 + end-of-month rule), while a
          commercial payer approved the same day yields the plain sum
          2027-02-26; window starts differ accordingly (2031-07-02 vs
          2026-12-28).
        test_recipe:
          setup:
            - "Two attested providers (or one provider with two payers); Medicare payer interval 1825; commercial payer interval 200"
            - "Both applications approved at logical clock 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "MCR", name: "Medicare", is_medicare: true, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 1825 }
              as: ComplianceOfficer
              captures: { py_mcr: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "COM", name: "Commercial", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_com: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_mcr}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-10" }
              as: EnrollmentSpecialist
              captures: { app_mcr: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_com}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-10" }
              as: EnrollmentSpecialist
              captures: { app_com: $.data.id }
            - call: "POST /api/enrollment-applications/${app_mcr}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app_com}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/enrollment-applications/${app_mcr}/approve"
              as: PayerRepresentative
            - call: "POST /api/enrollment-applications/${app_com}/approve"
              as: PayerRepresentative
          trigger:
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_mcr}" }
              as: EnrollmentSpecialist
              captures: { due_mcr: "$.data[0].revalidation_due_date", win_mcr: "$.data[0].revalidation_window_start" }
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_com}" }
              as: EnrollmentSpecialist
              captures: { due_com: "$.data[0].revalidation_due_date", win_com: "$.data[0].revalidation_window_start" }
          assert:
            - "Medicare record revalidation_due_date == '2031-08-31' (base 2026-08-10 + 1825d = 2031-08-09, snapped to month end)"
            - "Medicare record revalidation_window_start == '2031-07-02'"
            - "Commercial record revalidation_due_date == '2027-02-26' (plain 2026-08-10 + 200d, no snap)"
            - "Commercial record revalidation_window_start == '2026-12-28'"

      - name: recoupment_fee_per_claim_rounding
        grounds:
          - calculations.recoupment_fee
          - entities.Claim.fields.recoupment_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-claim-then-sum.
          Two 3333-cent claims recouped together yield fees of 67 + 67 = 134 and
          net_recouped_cents = 6800; the rejected sum-then-round order would
          give round(6666 * 0.02) = 133 and 6799. One cent of divergence proves
          the pinned order.
        test_recipe:
          setup:
            - "Provider attested; APPROVAL_DATE payer, hold enabled, interval 200"
            - "Record effective 2026-08-01 (approved at default clock)"
            - "Two RELEASED claims of 3333 cents each, service 2026-08-05, created at clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-05", amount_cents: 3333 }
              as: EnrollmentSpecialist
              captures: { c1: $.data.id }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-05", amount_cents: 3333 }
              as: EnrollmentSpecialist
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /api/enrollment-records/${rec}/terminate"
              payload: { termination_effective_date: "2026-08-01" }
              as: ComplianceOfficer
              captures: { net: $.data.net_recouped_cents, gross: $.data.gross_impacted_cents }
            - call: "GET /api/claims/${c1}"
              as: ComplianceOfficer
              captures: { fee1: $.data.recoupment_fee_cents }
            - call: "GET /api/claims/${c2}"
              as: ComplianceOfficer
              captures: { fee2: $.data.recoupment_fee_cents }
          assert:
            - "Claim.${c1}.recoupment_fee_cents == 67 and Claim.${c2}.recoupment_fee_cents == 67 (round_half_up(3333 * 0.02) = 67 per claim)"
            - "EnrollmentRecord.${rec}.net_recouped_cents == 6800 (6666 principal + 134 fees)"
            - "EnrollmentRecord.${rec}.gross_impacted_cents == 6666"
            - "fee sum ${fee1} + ${fee2} == 134, not 133 (sum-then-round is rejected)"
  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_request_cycle
        grounds:
          - state_machines.EnrollmentApplication.SUBMITTED_to_PENDING_INFO
          - state_machines.EnrollmentApplication.PENDING_INFO_to_SUBMITTED
          - state_machines.EnrollmentApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          EnrollmentApplication supports a revision loop SUBMITTED ->
          PENDING_INFO -> SUBMITTED that can repeat before approval — a cycle,
          not a pipeline. The paired instance (caqh_relapse_reattest_cycle) is
          a cycle on a different entity (CAQHProfile).
        test_recipe:
          setup:
            - "Attested provider; payer; DRAFT application"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "GROUP_LINK", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
          trigger:
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
              captures: { s1: $.data.status }
            - call: "POST /api/enrollment-applications/${app}/request-info"
              payload: { reason: "need W-9" }
              as: PayerRepresentative
              captures: { s2: $.data.status }
            - call: "POST /api/enrollment-applications/${app}/resubmit"
              as: EnrollmentSpecialist
              captures: { s3: $.data.status }
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
              captures: { s4: $.data.status }
          assert:
            - "${s1} == SUBMITTED"
            - "${s2} == PENDING_INFO (fork into the info-request branch)"
            - "${s3} == SUBMITTED (cycle closes back, not a new application)"
            - "${s4} == APPROVED"
            - "EnrollmentApplication.${app}.info_request_reason == 'need W-9'"

      - name: caqh_relapse_reattest_cycle
        grounds:
          - state_machines.CAQHProfile.ATTESTED_to_LAPSED
          - state_machines.CAQHProfile.LAPSED_to_ATTESTED
          - calculations.caqh_attestation_cycle
        distinguishing_aspect: |
          CAQHProfile loops ATTESTED -> LAPSED -> ATTESTED driven by the clock
          sweep and re-attestation; the cycle restarts the 120-day window
          (due_at recomputed from the new last_attested_at). Different entity
          than the EnrollmentApplication loop.
        test_recipe:
          setup:
            - "Provider with CAQH profile attested at 2026-08-01T00:00:00Z (due_at 2026-11-29T00:00:00Z)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
              captures: { st0: $.data.status }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:01Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { st1: "$.data[0].status" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
              captures: { st2: $.data.status, due2: $.data.due_at }
          assert:
            - "${st0} == ATTESTED"
            - "${st1} == LAPSED (current clock 2026-11-30T00:00:01Z > due_at 2026-11-29T00:00:00Z)"
            - "${st2} == ATTESTED (cycle restart from LAPSED)"
            - "${due2} == '2027-03-30T00:00:01Z' (last_attested_at + 120 days)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: provider_retro_termination_cascade
        grounds:
          - state_machines.Provider.ACTIVE_to_TERMINATED
          - state_machines.EnrollmentRecord.ACTIVE_to_TERMINATED
          - state_machines.Claim.RELEASED_to_RECOUPED
          - entities.Provider.fields.recoupment_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from a single trigger (provider termination): the
          provider mutation terminates the EnrollmentRecord (hop 1); the
          record's termination itself recoups/denies claims (hop 2); each claim
          recoupment itself increments Provider.recoupment_balance_cents
          (hop 3). A DRAFT application on a second payer is also withdrawn by
          the same cascade.
        test_recipe:
          setup:
            - "Provider attested; payer A record effective 2026-08-01; claim c1 HELD (5000, service 2026-07-15); claim c2 RELEASED (8000, service 2026-08-05); payer B DRAFT application still in flight"
            - "Logical clock 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PB", name: "Payer B", is_medicare: false, effective_date_policy: "RETRO_90", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_b: $.data.id }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-07-15", amount_cents: 5000 }
              as: EnrollmentSpecialist
              captures: { c1: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app_a: $.data.id }
            - call: "POST /api/enrollment-applications/${app_a}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app_a}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-05", amount_cents: 8000 }
              as: EnrollmentSpecialist
              captures: { c2: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_b}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-10" }
              as: EnrollmentSpecialist
              captures: { app_b: $.data.id }
          trigger:
            - call: "POST /api/providers/${prov}/terminate"
              payload: { termination_effective_date: "2026-08-03", reason: "left group" }
              as: ComplianceOfficer
              captures: { bal: $.data.recoupment_balance_cents }
            - call: "GET /api/enrollment-records/${rec}"
              as: ComplianceOfficer
              captures: { rec_status: $.data.status, rec_term: $.data.termination_date, rec_gross: $.data.gross_impacted_cents }
            - call: "GET /api/claims/${c1}"
              as: ComplianceOfficer
              captures: { c1_status: $.data.status }
            - call: "GET /api/claims/${c2}"
              as: ComplianceOfficer
              captures: { c2_status: $.data.status, c2_fee: $.data.recoupment_fee_cents }
            - call: "GET /api/enrollment-applications/${app_b}"
              as: ComplianceOfficer
              captures: { app_b_status: $.data.status }
          assert:
            - "Provider.${prov}.status == TERMINATED with termination_date '2026-08-03'"
            - "${rec_status} == TERMINATED and ${rec_term} == '2026-08-03' (hop 1)"
            - "${c1_status} == DENIED and ${c2_status} == RECOUPED (hop 2, fired by the record termination)"
            - "${c2_fee} == 160"
            - "${bal} == 8160 (hop 3: recoupment balance incremented by amount + fee)"
            - "${rec_gross} == 13000"
            - "${app_b_status} == WITHDRAWN (in-flight application swept by the cascade)"

      - name: roster_add_confirm_release_cascade
        grounds:
          - state_machines.RosterLine.PENDING_to_CONFIRMED
          - state_machines.EnrollmentRecord
          - state_machines.Claim.HELD_to_RELEASED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (roster line confirmation):
          confirming an ADD line creates an ACTIVE EnrollmentRecord (hop 1);
          the record's activation itself releases the provider+payer's eligible
          HELD claims (hop 2). Originating trigger is a payer-side roster
          confirmation, not a termination.
        test_recipe:
          setup:
            - "Group G; payer D; ACTIVE delegation agreement covering G and D"
            - "Provider P (no attestation needed on the delegated path) with HELD claim (12000 cents, service 2026-08-05) created at clock 2026-08-10"
            - "Roster file submitted with one ADD line, expected_effective_date 2026-08-01"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PD", name: "Payer D", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_d: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_d}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_d}", service_date: "2026-08-05", amount_cents: 12000 }
              as: EnrollmentSpecialist
              captures: { cl: $.data.id, cl_st: $.data.status }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf: $.data.id }
            - call: "GET /api/roster-files/${rf}/lines"
              as: EnrollmentSpecialist
              captures: { ln: "$.data[0].id" }
          trigger:
            - call: "POST /api/roster-files/${rf}/lines/${ln}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
              captures: { ln_st: $.data.status }
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_d}" }
              as: EnrollmentSpecialist
              captures: { rec_st: "$.data[0].status", rec_eff: "$.data[0].effective_date", rec_src: "$.data[0].source_roster_line_id", rec_ba: "$.data[0].benefit_assignment" }
            - call: "GET /api/claims/${cl}"
              as: EnrollmentSpecialist
              captures: { cl_st2: $.data.status }
          assert:
            - "${cl_st} == HELD (pre-cascade: no covering record, hold enabled)"
            - "${ln_st} == CONFIRMED (confirmed date matches expected)"
            - "${rec_st} == ACTIVE and ${rec_eff} == '2026-08-01' and ${rec_src} == ${ln} and ${rec_ba} == GROUP (hop 1)"
            - "${cl_st2} == RELEASED (hop 2: service 2026-08-05 >= effective 2026-08-01)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_withdrawn_submit
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_PROVIDER_TERMINATED]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: submitting a WITHDRAWN
          application whose provider has since been TERMINATED violates both
          rule 7 (state) and rule 8 (safety); priority 7 wins, so the response
          is ERR_INVALID_STATE_TRANSITION, not ERR_PROVIDER_TERMINATED.
        test_recipe:
          setup:
            - "Attested provider with a DRAFT application; application withdrawn; provider then terminated (no records exist)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/withdraw"
              as: EnrollmentSpecialist
            - call: "POST /api/providers/${prov}/terminate"
              payload: { termination_effective_date: "2026-08-01", reason: "departed" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION (priority 7 state beats priority 8 business_safety ERR_PROVIDER_TERMINATED)"
            - "EnrollmentApplication.${app}.status remains WITHDRAWN"

      - name: referential_beats_temporal_on_roster_line
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_PROVIDER_GROUP_MISMATCH]
          - errors[ERR_RETRO_WINDOW_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_temporal: a
          roster line whose provider belongs to a different group AND whose
          expected_effective_date (2026-01-20, more than 90 days before the
          2026-08-01 default clock) breaches the retro window violates both
          rule 9 and rule 10; priority 9 wins, so the response is
          ERR_PROVIDER_GROUP_MISMATCH.
        test_recipe:
          setup:
            - "Groups G1 and G2; provider P belongs to G2; agreement covers (G1, payer); logical clock at default 2026-08-01"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G1", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg1: $.data.id }
            - call: "POST /api/practice-groups"
              payload: { name: "G2", tax_id: "T2", group_npi: "GNPI2" }
              as: ComplianceOfficer
              captures: { pg2: $.data.id }
            - call: "POST /api/practice-groups/${pg2}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg1}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
          trigger:
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-01-20" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROVIDER_GROUP_MISMATCH (priority 9 business_referential beats priority 10 business_temporal ERR_RETRO_WINDOW_EXCEEDED)"
            - "No RosterFile is created for the agreement"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: caqh_lapse_strictly_after_due_at
        grounds:
          - calculations.caqh_attestation_cycle
          - state_machines.CAQHProfile.DUE_to_LAPSED
          - entities.CAQHProfile.fields.due_at
        distinguishing_aspect: |
          Time-threshold boundary: lapse is strictly greater-than. At clock ==
          due_at (2026-11-29T00:00:00Z) the profile is DUE; one second later it
          is LAPSED. Metric: timestamp threshold; endpoint pair: clock set +
          profile read.
        test_recipe:
          setup:
            - "Provider attested at default clock 2026-08-01T00:00:00Z; due_at == 2026-11-29T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-29T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { st_at_due: "$.data[0].status" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-29T00:00:01Z" }
              as: ComplianceOfficer
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { st_after: "$.data[0].status" }
          assert:
            - "${st_at_due} == DUE (at exactly due_at the profile is in the warning window, not lapsed)"
            - "${st_after} == LAPSED (one second past due_at crosses the strict > boundary)"

      - name: empty_roster_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_EMPTY_ROSTER]
          - entities.RosterFile.fields.total_lines
        distinguishing_aspect: |
          Zero-count boundary on a different metric (collection cardinality, not
          a timestamp) reachable through a different endpoint
          (POST /api/roster-files): a roster with an empty lines array is
          rejected with ERR_EMPTY_ROSTER; a single-line roster succeeds.
        test_recipe:
          setup:
            - "Group G; payer; ACTIVE agreement (version captured at creation)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
          trigger:
            - call: "POST /api/roster-files"
              payload: { agreement_id: "${ag}", expected_agreement_version: "${ag_v}", lines: [] }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_EMPTY_ROSTER"
            - "GET /api/roster-files?agreement_id=${ag} returns an empty list (no file persisted)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_blocked_by_lapsed_caqh
        grounds:
          - state_machines.EnrollmentApplication.SUBMITTED_to_APPROVED
          - state_machines.CAQHProfile.ATTESTED_to_LAPSED
          - errors[ERR_CAQH_ATTESTATION_NOT_CURRENT]
        distinguishing_aspect: |
          Entity pair EnrollmentApplication <- CAQHProfile: the application's
          SUBMITTED -> APPROVED transition is gated on the provider's CAQH
          profile being in {ATTESTED, DUE} at approval time; letting the clock
          carry the profile to LAPSED after submission blocks approval.
        test_recipe:
          setup:
            - "Attested provider; application SUBMITTED at 2026-08-01; clock then advanced past due_at so the profile is LAPSED"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CAQH_ATTESTATION_NOT_CURRENT"
            - "EnrollmentApplication.${app}.status remains SUBMITTED; no EnrollmentRecord created"

      - name: roster_submit_blocked_by_terminated_agreement
        grounds:
          - state_machines.RosterFile
          - state_machines.DelegatedCredentialingAgreement.ACTIVE_to_TERMINATED
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair RosterFile <- DelegatedCredentialingAgreement: roster
          submission is only valid while the agreement is ACTIVE; terminating
          the agreement blocks subsequent submissions with
          ERR_AGREEMENT_NOT_ACTIVE even when the OCC version matches.
        test_recipe:
          setup:
            - "Group G with provider; payer; agreement created (version 1), then terminated (version advances to 2)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id }
            - call: "POST /api/delegation-agreements/${ag}/terminate"
              as: ComplianceOfficer
              captures: { ag_v2: $.data.version }
          trigger:
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v2}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_AGREEMENT_NOT_ACTIVE (agreement TERMINATED; the matching OCC version proves the rejection is the state gate, not staleness)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_interval_half_open_touch
        grounds:
          - validations[priority=11]
          - errors[ERR_ENROLLMENT_OVERLAP]
          - entities.EnrollmentRecord.fields.effective_date
          - entities.EnrollmentRecord.fields.termination_date
        distinguishing_aspect: |
          Half-open [effective_date, termination_date) semantics on the
          EnrollmentRecord resource: a new enrollment effective exactly on the
          prior record's termination_date (2026-09-01) is allowed, while one
          day earlier (2026-08-31) is rejected with ERR_ENROLLMENT_OVERLAP.
          Resource and interval semantics differ from the agreement instance.
        test_recipe:
          setup:
            - "Attested provider; RETRO_90 payer; record A approved at clock 2026-08-01 (effective 2026-08-01), terminated with termination_date 2026-09-01 at clock 2026-09-10"
            - "Application 1 (requested 2026-08-31) rejected at approval by the overlap check and withdrawn; application 2 (requested 2026-09-01) then approved"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PR", name: "Payer R", is_medicare: false, effective_date_policy: "RETRO_90", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_r: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_r}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app0: $.data.id }
            - call: "POST /api/enrollment-applications/${app0}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app0}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_r}" }
              as: EnrollmentSpecialist
              captures: { rec_a: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/enrollment-records/${rec_a}/terminate"
              payload: { termination_effective_date: "2026-09-01" }
              as: ComplianceOfficer
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_r}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-31" }
              as: EnrollmentSpecialist
              captures: { app1: $.data.id }
            - call: "POST /api/enrollment-applications/${app1}/submit"
              as: EnrollmentSpecialist
          trigger:
            - call: "POST /api/enrollment-applications/${app1}/approve"
              as: PayerRepresentative
              captures: { err: $.data.error_id }
            - call: "POST /api/enrollment-applications/${app1}/withdraw"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_r}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-09-01" }
              as: EnrollmentSpecialist
              captures: { app2: $.data.id }
            - call: "POST /api/enrollment-applications/${app2}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app2}/approve"
              as: PayerRepresentative
              captures: { st2: $.data.status }
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_r}", status: "ACTIVE" }
              as: EnrollmentSpecialist
              captures: { eff2: "$.data[0].effective_date" }
          assert:
            - "${err} == ERR_ENROLLMENT_OVERLAP (effective 2026-08-31 falls inside [2026-08-01, 2026-09-01) )"
            - "${st2} == APPROVED and ${eff2} == '2026-09-01' (touching the prior termination_date is allowed under half-open semantics)"

      - name: agreement_closed_interval_touch_rejected
        grounds:
          - validations[priority=11]
          - errors[ERR_AGREEMENT_OVERLAP]
          - entities.DelegatedCredentialingAgreement.fields.effective_date
          - entities.DelegatedCredentialingAgreement.fields.expiry_date
        distinguishing_aspect: |
          Closed-interval [effective_date, expiry_date] semantics on the
          DelegatedCredentialingAgreement resource: a successor agreement whose
          effective_date equals the incumbent's expiry_date (2026-12-31) is
          REJECTED — touching counts as overlap, the opposite geometric
          treatment from the enrollment half-open rule. Different resource,
          different interval semantics.
        test_recipe:
          setup:
            - "Group G; payer; agreement A1 [2026-01-01, 2026-12-31] ACTIVE"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: ComplianceOfficer
              captures: { ag1: $.data.id }
          trigger:
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-12-31", expiry_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2027-01-01", expiry_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { ag2: $.data.id }
          assert:
            - "${err} == ERR_AGREEMENT_OVERLAP (shared boundary date 2026-12-31 counts as overlap under closed-interval semantics)"
            - "Second creation with effective_date 2027-01-01 succeeds (201) — the day after expiry is free"
            - "Agreement.${ag2}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: roster_line_bucket_conservation
        grounds:
          - calculations.roster_line_rollup
          - state_machines.RosterLine
          - entities.RosterFile.fields.total_lines
        distinguishing_aspect: |
          Conserved quantity: line counts. Every forward/compensating line
          action (confirm, reject, discrepancy + resolve) only moves a line
          between buckets; pending+confirmed+rejected+discrepancy+superseded
          stays == total_lines (3) after every step, and the file's derived
          status tracks the buckets (SUBMITTED -> PARTIALLY_CONFIRMED).
        test_recipe:
          setup:
            - "Group G with three providers; payer; ACTIVE agreement; roster with three ADD lines (expected 2026-08-01)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { p1: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P2", full_name: "Dr Two", specialty: "PD" }
              as: EnrollmentSpecialist
              captures: { p2: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P3", full_name: "Dr Three", specialty: "OB" }
              as: EnrollmentSpecialist
              captures: { p3: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${p1}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
                  - { provider_id: "${p2}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
                  - { provider_id: "${p3}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf: $.data.id }
            - call: "GET /api/roster-files/${rf}/lines"
              as: EnrollmentSpecialist
              captures: { l0: "$.data[0].id", l1: "$.data[1].id", l2: "$.data[2].id" }
          trigger:
            - call: "POST /api/roster-files/${rf}/lines/${l0}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
            - call: "GET /api/roster-files/${rf}"
              as: EnrollmentSpecialist
              captures: { f1_pending: $.data.pending_count, f1_confirmed: $.data.confirmed_count, f1_total: $.data.total_lines, f1_status: $.data.status }
            - call: "POST /api/roster-files/${rf}/lines/${l1}/reject"
              payload: { reason: "not on panel" }
              as: PayerRepresentative
            - call: "POST /api/roster-files/${rf}/lines/${l2}/confirm"
              payload: { confirmed_effective_date: "2026-08-15" }
              as: PayerRepresentative
              captures: { l2_st: $.data.status }
            - call: "GET /api/roster-files/${rf}"
              as: EnrollmentSpecialist
              captures: { f2_pending: $.data.pending_count, f2_discrepancy: $.data.discrepancy_count, f2_status: $.data.status }
            - call: "POST /api/roster-files/${rf}/lines/${l2}/resolve"
              payload: { accept_confirmed: true }
              as: EnrollmentSpecialist
            - call: "GET /api/roster-files/${rf}"
              as: EnrollmentSpecialist
              captures: { f3_pending: $.data.pending_count, f3_confirmed: $.data.confirmed_count, f3_rejected: $.data.rejected_count, f3_discrepancy: $.data.discrepancy_count, f3_superseded: $.data.superseded_count, f3_total: $.data.total_lines, f3_status: $.data.status }
          assert:
            - "After step 1: ${f1_pending} == 2, ${f1_confirmed} == 1, ${f1_total} == 3, ${f1_status} == SUBMITTED"
            - "After mismatch confirm: ${l2_st} == DISCREPANCY, ${f2_discrepancy} == 1, ${f2_pending} == 0, ${f2_status} == PARTIALLY_CONFIRMED"
            - "Final: ${f3_confirmed} == 2, ${f3_rejected} == 1, ${f3_pending} == 0, ${f3_discrepancy} == 0, ${f3_superseded} == 0, ${f3_total} == 3"
            - "Invariant: pending + confirmed + rejected + discrepancy + superseded == total_lines at every step"

      - name: recoupment_balance_compensation
        grounds:
          - state_machines.Claim.RELEASED_to_RECOUPED
          - state_machines.Claim.RECOUPED_to_RELEASED
          - entities.Provider.fields.recoupment_balance_cents
          - calculations.recoupment_fee
        distinguishing_aspect: |
          Conserved quantity: money. The forward action (retro termination
          recouping an 8000-cent claim with a 160-cent fee) raises
          Provider.recoupment_balance_cents to 8160; the compensating action
          (reverse-recoupment) returns it to exactly its pre-pair value 0 and
          restores the claim to RELEASED with fee zeroed.
        test_recipe:
          setup:
            - "Attested provider; APPROVAL_DATE payer; record effective 2026-08-01; claim 8000 cents RELEASED (service 2026-08-05); clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-05", amount_cents: 8000 }
              as: EnrollmentSpecialist
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /api/enrollment-records/${rec}/terminate"
              payload: { termination_effective_date: "2026-08-03" }
              as: ComplianceOfficer
            - call: "GET /api/providers/${prov}"
              as: ComplianceOfficer
              captures: { bal_after_recoup: $.data.recoupment_balance_cents }
            - call: "POST /api/claims/${cl}/reverse-recoupment"
              as: ComplianceOfficer
              captures: { cl_st: $.data.status, cl_fee: $.data.recoupment_fee_cents }
            - call: "GET /api/providers/${prov}"
              as: ComplianceOfficer
              captures: { bal_after_reverse: $.data.recoupment_balance_cents }
          assert:
            - "${bal_after_recoup} == 8160 (8000 + 160 fee)"
            - "${cl_st} == RELEASED and ${cl_fee} == 0 after the compensating action"
            - "${bal_after_reverse} == 0 — forward + compensating pair leaves the conserved quantity unchanged"
