      - name: non_owner_rightsholder_submit_returns_not_owner
        claim_type: ownership_denied
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A RightsHolder (rh_2) that is not the application's applicant_user_id (rh_1) is denied submit with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
