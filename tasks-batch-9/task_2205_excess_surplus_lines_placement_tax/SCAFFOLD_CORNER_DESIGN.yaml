        distinguishing_aspect: "complete-search is NOT idempotent: the second identical call is rejected 409 ERR_INVALID_STATE rather than returning the same 200 body, because the transition's from-state is SEARCH_IN_PROGRESS only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home setup carried to a SEARCH_COMPLETE placement."
          setup_api_calls:
