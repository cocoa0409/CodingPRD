    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingRun
    side_effects: ["FINALIZED -> POSTED; 3-link cascade to customers and installations per state machine"]

# =============================================================================
# Table 6 (§1.6): Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid; or entity_backed role Driver presents an X-User-ID that is not an existing Driver id" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not listed on the endpoint, or role-scoped restriction violated (Driver completing another driver's route or cancelling any route)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed required field, XOR violation (tank_id vs installation_id; fill_lot_id vs blend_order_id), reading level outside [0, capacity], period_start > period_end, window hours out of bounds or end <= start, payment exceeding outstanding balance, replenishment quantity <= 0, unknown analyte for the lot grade" }
  - { id: ERR_INVALID_ENUM_VALUE, http: 400, condition: "Enum field carries an undeclared member (status targets, product_code, subject_type, size_code, billing_variant, disposition, return_condition, endorsement class, reading source)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path id or body FK reference does not exist; validated left-to-right" }
  - { id: ERR_PLANT_NOT_OPERATING, http: 409, condition: "start-fill / complete-fill / start-blend / complete-blend while the plant is MAINTENANCE_SHUTDOWN" }
  - { id: ERR_TANK_NOT_IN_SERVICE, http: 409, condition: "start-fill against a tank in MAINTENANCE or QUARANTINED" }
  - { id: ERR_CYLINDER_NOT_AVAILABLE, http: 409, condition: "Cylinder not in the required state: IN_STOCK for assign, FILLED for rental, IN_STOCK/QUARANTINED for retest/decommission, ON_RENT handled via rental state" }
  - { id: ERR_FILL_LOT_INVALID_STATE, http: 409, condition: "Fill-lot transition attempted from a state the machine forbids (incl. assign/start-fill/complete-fill/rework/vent/recall from wrong states)" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Customer in CREDIT_HOLD: new rentals and blend orders blocked; PAUSED installation resume blocked" }
  - { id: ERR_RENTAL_NOT_ACTIVE, http: 409, condition: "Return or settle-loss on a rental not in ACTIVE/OVERDUE/RECALL_HOLD (return) or ACTIVE/OVERDUE (settle-loss)" }
  - { id: ERR_DRIVER_NOT_QUALIFIED, http: 409, condition: "assign-driver with driver status SUSPENDED or CERT_EXPIRED" }
  - { id: ERR_ROUTE_INVALID_STATE, http: 409, condition: "Route transition from a forbidden state (assign non-PLANNED, dispatch non-DRIVER_ASSIGNED, complete non-DISPATCHED, cancel terminal)" }
  - { id: ERR_INSTALLATION_INVALID_STATE, http: 409, condition: "Installation transition from a forbidden state, or replenishment create against a non-ACTIVE installation" }
  - { id: ERR_BLEND_ORDER_INVALID_STATE, http: 409, condition: "Blend transition from a forbidden state (approve non-DRAFT, start-blend non-APPROVED/REWORK, complete-blend non-BLENDING)" }
  - { id: ERR_BILLING_RUN_INVALID_STATE, http: 409, condition: "finalize non-DRAFT run or post non-FINALIZED run" }
  - { id: ERR_ANALYSIS_INVALID_STATE, http: 409, condition: "Analysis recorded for a subject not AWAITING_ANALYSIS; override of a non-RECORDED or non-MARGINAL analysis" }
  - { id: ERR_REPLENISHMENT_INVALID_STATE, http: 409, condition: "Replenishment set-status from a non-PENDING state" }
  - { id: ERR_HYDRO_RETEST_OVERDUE, http: 422, condition: "Cylinder hydro OVERDUE (clock date strictly after hydro_due_date) at fill assign or rental checkout; due exactly today passes" }
  - { id: ERR_PRODUCT_SERVICE_MISMATCH, http: 422, condition: "Cylinder service_gas != lot product_code, or lot product_code != tank product_code" }
  - { id: ERR_HAZMAT_ENDORSEMENT_MISSING, http: 422, condition: "A route stop hazmat class has no endorsement at all on the assigned driver" }
  - { id: ERR_DRIVER_CERT_EXPIRED, http: 422, condition: "Endorsement present but expired at route_date, medical card expired at route_date/clock, dispatch revalidation failure, or reinstatement with expired certs" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Analysis recorder equals the subject's completed_by/blended_by user, or override actor equals the analysis recorder" }
  - { id: ERR_TANK_LEVEL_TOO_LOW, http: 409, condition: "current_level - reserved < draw_estimate + 100 at start-fill, or no eligible tank for a blend component" }
  - { id: ERR_LOT_HAS_NO_CYLINDERS, http: 409, condition: "start-fill with zero RESERVED cylinders in the lot" }
  - { id: ERR_DUPLICATE_CYLINDER_SERIAL, http: 409, condition: "serial_number already registered (including LOST/RETIRED cylinders)" }
  - { id: ERR_DRIVER_ROUTE_OVERLAP, http: 409, condition: "Driver already has a DRIVER_ASSIGNED/DISPATCHED route on the same date whose half-open window overlaps; touching endpoints allowed" }
  - { id: ERR_REPLENISHMENT_WINDOW_CONFLICT, http: 409, condition: "scheduled_delivery_at earlier than the installation's last DELIVERED order's delivered_at + 24h" }
  - { id: ERR_BLEND_COMPONENT_SUM_INVALID, http: 422, condition: "Fewer than two components, target_pct 2dp sum != 100.00, non-positive tolerance, or negative unit cost" }
  - { id: ERR_TELEMETRY_FUTURE_DATED, http: 422, condition: "measured_at later than the logical clock" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "outstanding + estimated rental charge strictly greater than credit_limit_cents at checkout; equality passes" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version OCC mismatch on PATCH /api/tanks/{id}, PATCH /api/customers/{id}, or POST /api/replenishment-orders" }

# =============================================================================
# Table 7 (§1.7): RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Owns plant configuration, storage tanks, bulk installations, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/plants, POST /api/plants/{id}/set-status"
      - "POST /api/tanks, PATCH /api/tanks/{id}, POST /api/tanks/{id}/set-status"
      - "POST /api/bulk-installations, POST /api/bulk-installations/{id}/set-status"
    shared_operations: ["All GET endpoints"]
  - name: ProductionOperator
    description: "Runs fill lots, cylinder registry, hydro retests, telemetry, and blending"
    identity: opaque
    exclusive_operations:
      - "POST /api/cylinders, POST /api/cylinders/{id}/hydro-retests"
      - "POST /api/fill-lots, POST /api/fill-lots/{id}/cylinders, start-fill, complete-fill, rework, vent"
      - "POST /api/blend-orders/{id}/start-blend, complete-blend"
    shared_operations: ["All GET endpoints", "POST /api/telemetry-readings (shared with LogisticsCoordinator)"]
  - name: LabAnalyst
    description: "Records purity analyses; by segregation of duties may never analyze a lot/blend whose fill they ran"
    identity: opaque
    exclusive_operations:
      - "POST /api/purity-analyses"
    shared_operations: ["All GET endpoints"]
  - name: QualityManager
    description: "Overrides marginal analyses, recalls released lots, controls quarantine and cylinder decommission, approves blends"
    identity: opaque
    exclusive_operations:
      - "POST /api/purity-analyses/{id}/override"
      - "POST /api/fill-lots/{id}/recall"
      - "POST /api/cylinders/{id}/release-quarantine, POST /api/cylinders/{id}/decommission"
      - "POST /api/blend-orders/{id}/approve"
    shared_operations: ["All GET endpoints"]
  - name: LogisticsCoordinator
    description: "Owns drivers, hazmat routes, and replenishment orders"
    identity: opaque
    exclusive_operations:
      - "POST /api/drivers, PATCH /api/drivers/{id}, POST /api/drivers/{id}/set-status"
      - "POST /api/routes, assign-driver, dispatch"
      - "POST /api/replenishment-orders, POST /api/replenishment-orders/{id}/set-status"
    shared_operations: ["All GET endpoints", "POST /api/telemetry-readings (shared with ProductionOperator)", "POST /api/routes/{id}/set-status (shared with Driver)"]
  - name: BillingClerk
    description: "Owns customers, rentals, payments, blend quotes, and billing runs"
    identity: opaque
    exclusive_operations:
      - "POST /api/customers, PATCH /api/customers/{id}, POST /api/customers/{id}/payments"
      - "POST /api/rentals, POST /api/rentals/{id}/return, POST /api/rentals/{id}/settle-loss"
      - "POST /api/blend-orders"
      - "POST /api/billing-runs, finalize, post"
    shared_operations: ["All GET endpoints"]
  - name: Driver
    description: "Entity-backed driver; may complete only own assigned routes; may never cancel"
    identity: "entity_backed:Driver"
    exclusive_operations: []
    shared_operations: ["All GET endpoints", "POST /api/routes/{id}/set-status with target_status COMPLETED where driver_id == X-User-ID"]
