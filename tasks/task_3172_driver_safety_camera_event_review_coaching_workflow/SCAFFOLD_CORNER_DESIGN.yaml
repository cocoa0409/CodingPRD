# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3172_driver_safety_camera_event_review_coaching_workflow
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
#
# Shared base anchors (defined in the first instance, aliased later):
#   clock 2026-09-01T00:00:00Z; fleet (budget 1000000c); terminal; driver
#   (E-1001, consent true); HIGH-tier vehicle; ACTIVE policy (cap 100 MB,
#   inward enabled, detections on, retention 30/180d).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: fleet_create_returns_defaults
        claim_type: Creation
        grounds:
          - entities.Fleet
          - endpoints.POST_/api/fleets
        distinguishing_aspect: "A fleet created with only name and incentive_budget_cents returns 201 with posture NORMAL, ops_run_index 0, retention_used_mb 0, version 1, and system-minted id/created_at/updated_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_fleet
              call: "POST /api/fleets"
              payload: { name: "Blue Ridge Freight", incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
          assert:
            - "HTTP 201 and response_type object"
            - "Fleet.${fleet_id}.posture == NORMAL and ops_run_index == 0 and retention_used_mb == 0"
            - "Fleet.${fleet_id}.version == 1"
            - "response data carries non-null id, created_at, updated_at; meta.api_request_id and meta.api_request_timestamp present"

      - name: terminal_get_roundtrips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Terminal
          - endpoints.GET_/api/terminals/{id}
        distinguishing_aspect: "Every stored Terminal field round-trips through GET unchanged, and safety_score_cached starts at 100.00 (empty driver set)."
        test_recipe:
          setup:
            - "Clock set; one fleet."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - &c_term
              call: "POST /api/terminals"
              payload: { fleet_id: "${fleet_id}", name: "Knoxville Depot", region_code: "TN" }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
          trigger:
            - call: "GET /api/terminals/${term_id}"
              payload: {}
              as: SafetyManager
          assert:
            - "HTTP 200; Terminal.${term_id}.name == \"Knoxville Depot\" and region_code == \"TN\""
            - "Terminal.${term_id}.fleet_id == ${fleet_id}"
            - "Terminal.${term_id}.safety_score_cached == 100.00"

      - name: events_list_paginates_total_count_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/fleets/{id}/safety-events
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three events ingested: limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; defaults are limit 10 offset 0."
        test_recipe:
          setup:
            - "Base setup; three events ingested (all DETECTED)."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - &c_drv
              call: "POST /api/drivers"
              payload: { terminal_id: "${term_id}", employee_ref: "E-1001", name: "Dana Ruiz", hire_date: "2024-03-01T00:00:00Z", inward_camera_consent: true }
              as: PlatformAdmin
              captures: { drv_id: $.data.id }
            - &c_veh
              call: "POST /api/vehicles"
              payload: { terminal_id: "${term_id}", vin: "1HGCM82633A004352", camera_unit_id: "CAM-77", bandwidth_tier: "HIGH" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id }
            - &c_pol
              call: "POST /api/camera-policies"
              payload: { fleet_id: "${fleet_id}", name: "Standard Policy", retention_days_standard: 30, retention_days_collision: 180, daily_upload_cap_mb: 100, inward_capture_enabled: true, distraction_detection_enabled: true, seatbelt_detection_enabled: true, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - &c_pol_act
              call: "POST /api/camera-policies/${pol_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "LOW", occurred_at: "2026-08-28T00:00:00Z" }
              as: TelematicsIngest
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-29T00:00:00Z" }
              as: TelematicsIngest
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "HIGH", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
          trigger:
            - call: "GET /api/fleets/${fleet_id}/safety-events"
              payload: { limit: 2, offset: 0 }
              as: SafetyManager
          assert:
            - "HTTP 200, response_type array, exactly 2 rows, total_count == 3, has_more == true"
            - "GET with limit 2 offset 2 returns exactly 1 row, total_count == 3, has_more == false"
            - "GET with no query parameters returns 3 rows (defaults limit 10, offset 0)"
            - "GET with status DETECTED returns 3 rows; GET with status CONFIRMED returns 0 rows"

      - name: driver_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/drivers/{id}
          - errors.ERR_DRIVER_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated driver id yields the resource-specific 404 ERR_DRIVER_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/drivers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SafetyManager
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 and err_nf == ERR_DRIVER_NOT_FOUND"
            - "response_type error with data.error_id and data.message"

      - name: driver_create_missing_required_employee_ref_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Driver.fields.employee_ref
          - validations[priority=3]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "employee_ref is a required input with no default; omitting it is a 400 ERR_VALIDATION before any existence or business check."
        test_recipe:
          setup:
            - "Clock set; fleet and terminal exist."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
          trigger:
            - call: "POST /api/drivers"
              payload: { terminal_id: "${term_id}", name: "No Ref", hire_date: "2024-03-01T00:00:00Z", inward_camera_consent: true }
              as: PlatformAdmin
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 400 and err_req == ERR_VALIDATION"
            - "GET /api/terminals/${term_id}/drivers returns 0 rows"

      - name: vehicle_create_defaults_status_active
        claim_type: Defaults
        grounds:
          - entities.Vehicle.fields.status
          - endpoints.POST_/api/vehicles
        distinguishing_aspect: "Vehicle.status is system-owned with default ACTIVE; the create response shows ACTIVE and version 1 without the client supplying status."
        test_recipe:
          setup:
            - "Clock set; fleet and terminal exist."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
          trigger:
            - call: "POST /api/vehicles"
              payload: { terminal_id: "${term_id}", vin: "5YJSA1E26HF122334", camera_unit_id: "CAM-12", bandwidth_tier: "LOW" }
              as: PlatformAdmin
              captures: { veh_d: $.data.id }
          assert:
            - "HTTP 201; Vehicle.${veh_d}.status == ACTIVE and version == 1"

      - name: driver_create_computed_fields_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Driver.fields.safety_score_final
          - entities.Driver.fields.confirmed_events_90d
        distinguishing_aspect: "Client-supplied values for computed fields (safety_score_final 1, confirmed_events_90d 99) are ignored: the stored driver reads 100.00 and 0."
        test_recipe:
          setup:
            - "Clock set; fleet and terminal exist."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
          trigger:
            - call: "POST /api/drivers"
              payload: { terminal_id: "${term_id}", employee_ref: "E-2002", name: "Pat Quinn", hire_date: "2024-03-01T00:00:00Z", inward_camera_consent: false, safety_score_final: 1, confirmed_events_90d: 99 }
              as: PlatformAdmin
              captures: { drv_ig: $.data.id }
          assert:
            - "HTTP 201; Driver.${drv_ig}.safety_score_final == 100.00 and safety_score_provisional == 100.00"
            - "Driver.${drv_ig}.confirmed_events_90d == 0 and incentive_tier == GOLD"
            - "Driver.${drv_ig}.status == ACTIVE"

      - name: event_create_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.SafetyEvent.fields.status
          - entities.SafetyEvent.fields.upload_priority_score
        distinguishing_aspect: "Client-supplied status CONFIRMED and upload_priority_score 999999 are ignored: the event persists DETECTED with the computed score (MEDIUM fresh HIGH-tier: 3 x 4 x 3 = 36)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; base setup."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
          trigger:
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-31T22:00:00Z", status: "CONFIRMED", upload_priority_score: 999999 }
              as: TelematicsIngest
              captures: { ev_ig: $.data.id }
          assert:
            - "HTTP 201; SafetyEvent.${ev_ig}.status == DETECTED"
            - "SafetyEvent.${ev_ig}.upload_priority_score == 36  (3 x age_step 4 x HIGH tier 3; 2 hours old)"
            - "SafetyEvent.${ev_ig}.review_count == 0 and version == 1"

      - name: event_create_invalid_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.SafetyEvent.fields.event_type
          - validations[priority=3]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "event_type is a closed enum of five members; TAILGATING is rejected at priority 3 with 400 ERR_VALIDATION rather than coerced."
        test_recipe:
          setup:
            - "Clock set; base setup."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
          trigger:
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "TAILGATING", severity: "LOW", occurred_at: "2026-08-31T00:00:00Z" }
              as: TelematicsIngest
              captures: { err_en: $.data.error_id }
          assert:
            - "HTTP 400 and err_en == ERR_VALIDATION"
            - "GET /api/fleets/${fleet_id}/safety-events returns 0 rows"

      - name: review_decisions_append_only_no_mutation
        claim_type: Immutability
        grounds:
          - entities.ReviewDecision
        distinguishing_aspect: "ReviewDecision has common_fields false (no updated_at/version) and §1.5 declares no POST/PUT/PATCH/DELETE on a review-decision resource; two review actions append exactly two rows in decided_at order."
        test_recipe:
          setup:
            - "Clock set; base setup; one MEDIUM event IN_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_im: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_im}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_im: $.data.id }
            - call: "POST /api/footage-clips/${cl_im}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_im}/upload-complete"
              payload: {}
              as: TelematicsIngest
          trigger:
            - call: "GET /api/safety-events/${ev_im}"
              payload: {}
              as: SafetyManager
              captures: { ev_im_v: $.data.version }
            - call: "POST /api/safety-events/${ev_im}/review"
              payload: { action: "RECLASSIFY", rationale: "wrong type", new_event_type: "FOLLOWING_DISTANCE", expected_event_version: "${ev_im_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { ev_im_v2: $.data.version }
            - call: "POST /api/safety-events/${ev_im}/review"
              payload: { action: "REOPEN", rationale: "requeue", expected_event_version: "${ev_im_v2}" }
              as: SafetyManager
              as_user_id: "sm-1"
          assert:
            - "GET /api/safety-events/${ev_im}/review-decisions returns exactly 2 rows"
            - "row 1: action RECLASSIFY, prior_event_type HARSH_BRAKE, new_event_type FOLLOWING_DISTANCE, reviewer_id sm-1"
            - "row 2: action REOPEN, new_event_type null, reviewer_id sm-1"
            - "no row carries updated_at or version fields (common_fields false)"

      - name: session_create_event_not_found_returns_404
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - endpoints.POST_/api/drivers/{id}/coaching-sessions
          - errors.ERR_EVENT_NOT_FOUND
        distinguishing_aspect: "The body FK event_id is checked at priority 5 after the path driver id: an unknown event_id on a real driver yields 404 ERR_EVENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Clock set; base setup."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
          trigger:
            - call: "POST /api/drivers/${drv_id}/coaching-sessions"
              payload: { event_id: "00000000-0000-4000-8000-000000000000", starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z", due_at: "2026-09-09T00:00:00Z" }
              as: SafetyManager
              captures: { err_pnf: $.data.error_id }
          assert:
            - "HTTP 404 and err_pnf == ERR_EVENT_NOT_FOUND"
            - "GET /api/drivers/${drv_id}/coaching-sessions returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: review_confirm_from_detected_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SafetyEvent
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "An event with no UPLOADED clip is still DETECTED; CONFIRM from DETECTED has no transition and fails 409 ERR_INVALID_STATE before any business rule runs."
        test_recipe:
          setup:
            - "Clock set; base setup; one event ingested, no clip registered."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "LOW", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_dt: $.data.id, ev_dt_v: $.data.version }
          trigger:
            - call: "POST /api/safety-events/${ev_dt}/review"
              payload: { action: "CONFIRM", rationale: "too early", expected_event_version: "${ev_dt_v}" }
              as: SafetyManager
              captures: { err_dt: $.data.error_id }
          assert:
            - "HTTP 409 and err_dt == ERR_INVALID_STATE"
            - "SafetyEvent.${ev_dt}.status == DETECTED and review_count == 0"

      - name: first_upload_bubbles_event_to_in_review
        claim_type: Valid Transition
        grounds:
          - state_machines.SafetyEvent.DETECTED_to_IN_REVIEW
          - state_machines.FootageClip.UPLOADING_to_UPLOADED
        distinguishing_aspect: "The first clip reaching UPLOADED bubbles the event DETECTED -> IN_REVIEW and bumps the event version; a second clip's upload-complete does not re-fire the transition."
        test_recipe:
          setup:
            - "Clock set; base setup; one event with two clips, both upload-begun."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "LOW", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_bu: $.data.id, ev_bu_v0: $.data.version }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_bu}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_bu1: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_bu}", camera_angle: "SIDE", size_mb: 5, captured_at: "2026-08-30T00:00:01Z" }
              as: TelematicsIngest
              captures: { cl_bu2: $.data.id }
            - call: "POST /api/footage-clips/${cl_bu1}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_bu2}/upload-begin"
              payload: {}
              as: TelematicsIngest
          trigger:
            - call: "POST /api/footage-clips/${cl_bu1}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_bu}"
              payload: {}
              as: SafetyManager
              captures: { ev_bu_v1: $.data.version }
            - call: "POST /api/footage-clips/${cl_bu2}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_bu}"
              payload: {}
              as: SafetyManager
              captures: { ev_bu_v2: $.data.version }
          assert:
            - "after first upload-complete: SafetyEvent.${ev_bu}.status == IN_REVIEW"
            - "ev_bu_v1 == ev_bu_v0 + 1  (the bubble bumped the event version exactly once)"
            - "after second upload-complete: status still IN_REVIEW and ev_bu_v2 == ev_bu_v1  (no re-fire)"
            - "Fleet.${fleet_id}.retention_used_mb == 10"

      - name: dismiss_then_reopen_returns_to_in_review
        claim_type: Valid Transition
        grounds:
          - state_machines.SafetyEvent.IN_REVIEW_to_DISMISSED
          - state_machines.SafetyEvent.DISMISSED_to_IN_REVIEW
        distinguishing_aspect: "The DISMISSED -> IN_REVIEW reopen branch (distinct from the RECLASSIFIED cycle in difficulty instance event_reclassify_reopen_cycle) restores reviewability and the provisional penalty."
        test_recipe:
          setup:
            - "Clock set; base setup; one MEDIUM event IN_REVIEW then DISMISSED."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_dr: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_dr}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_dr: $.data.id }
            - call: "POST /api/footage-clips/${cl_dr}/upload-begin"
              payload: {}
              as: TelematicsIngest
            - call: "POST /api/footage-clips/${cl_dr}/upload-complete"
              payload: {}
              as: TelematicsIngest
            - call: "GET /api/safety-events/${ev_dr}"
              payload: {}
              as: SafetyManager
              captures: { ev_dr_v: $.data.version }
            - call: "POST /api/safety-events/${ev_dr}/review"
              payload: { action: "DISMISS", rationale: "not actionable", expected_event_version: "${ev_dr_v}" }
              as: SafetyManager
              as_user_id: "sm-1"
              captures: { ev_dr_v2: $.data.version }
          trigger:
            - call: "POST /api/safety-events/${ev_dr}/review"
              payload: { action: "REOPEN", rationale: "driver appealed", expected_event_version: "${ev_dr_v2}" }
              as: SafetyManager
              as_user_id: "sm-1"
          assert:
            - "SafetyEvent.${ev_dr}.status == IN_REVIEW and review_count == 2"
            - "Driver.${drv_id}.safety_score_provisional == 92.50  (IN_REVIEW MEDIUM counts provisionally again)"
            - "Driver.${drv_id}.safety_score_final == 100.00"

      - name: coaching_overdue_maintenance_sweep
        claim_type: Valid Transition
        grounds:
          - state_machines.CoachingSession.ASSIGNED_to_OVERDUE
          - state_machines.CoachingSession.OVERDUE_to_ASSIGNED
          - calculations.coaching_overdue_sweep
        distinguishing_aspect: "run-maintenance flips an ASSIGNED session whose due_at is strictly past the clock to OVERDUE (a session due exactly at the clock is NOT overdue), and reassign loops it back to ASSIGNED with reassign_count 1."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; base setup; one MEDIUM event CONFIRMED; manual session window [2026-09-02T10:00, 2026-09-02T11:00] due 2026-09-03T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_fleet
            - *c_term
            - *c_drv
            - *c_veh
            - *c_pol
            - *c_pol_act
            - call: "POST /api/safety-events"
              payload: { fleet_id: "${fleet_id}", driver_id: "${drv_id}", vehicle_id: "${veh_id}", event_type: "HARSH_BRAKE", severity: "MEDIUM", occurred_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { ev_od: $.data.id }
            - call: "POST /api/footage-clips"
              payload: { event_id: "${ev_od}", camera_angle: "FORWARD", size_mb: 5, captured_at: "2026-08-30T00:00:00Z" }
              as: TelematicsIngest
              captures: { cl_od: $.data.id }
