- method: POST
  path: /_clock/set_current_utc
  description: |
    Set the injected logical clock. The server's startup default is exactly 2026-09-01T00:00:00Z and the clock never falls back to wall-clock time, so every cutoff, aging and idempotency-window rule is deterministic before the clock is ever set. The clock is monotonic: moving it backwards returns ERR_CLOCK_NOT_MONOTONIC. No business endpoint reads the host clock; every temporal rule in this scaffold reads this value.
  roles:
  - PlatformAdmin
  - LedgerController
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: datetime
    previous_utc: datetime
  side_effects: []
- method: POST
  path: /_rails/simulate_settlement
  description: |
    Drive the rail network's asynchronous settlement confirmation without waiting for wall-clock time: assigns the outbound settlement outcome the next settle pass will observe. Declared as a first-class endpoint because a bank's settlement confirmation has no client-facing business surface.
  roles:
  - PlatformAdmin
  - PaymentOpsAnalyst
  code: 200
  input:
  - payment_order_id
  - outcome
  - return_reason?
  output:
    payment_order_id: string
    outcome: string
    accepted: boolean
  side_effects: []
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 401
  condition: X-User-ID or X-User-Role header is absent, or X-User-Role names a role that is not declared in §1.7
- id: ERR_FORBIDDEN_FOR_ROLE
  http: 403
  condition: Caller role is valid but is not listed in the endpoint's roles, or the endpoint is single-role and
    the caller holds any other role
- id: ERR_SELF_APPROVAL_FORBIDDEN
  http: 403
  condition: The approver's X-User-ID equals PaymentOrder.initiator_user_id
- id: ERR_LEGAL_ENTITY_NOT_FOUND
  http: 404
  condition: The legal_entity_id in the path or body does not exist
- id: ERR_LEDGER_NOT_FOUND
  http: 404
  condition: The ledger_id in the path or body does not exist
- id: ERR_COUNTERPARTY_NOT_FOUND
  http: 404
  condition: The counterparty_id in the path or body does not exist
- id: ERR_BANK_ACCOUNT_NOT_FOUND
  http: 404
  condition: The bank_account_id in the path or body does not exist
- id: ERR_VIRTUAL_ACCOUNT_NOT_FOUND
  http: 404
  condition: The virtual_account_id in the path or body does not exist
- id: ERR_BANK_STATEMENT_NOT_FOUND
  http: 404
  condition: The bank_statement_id in the path or body does not exist
- id: ERR_PAYMENT_ORDER_NOT_FOUND
  http: 404
  condition: The payment_order_id in the path or body does not exist
- id: ERR_TRANSACTION_NOT_FOUND
  http: 404
  condition: The transaction_id in the path or body does not exist
- id: ERR_EXCEPTION_NOT_FOUND
  http: 404
  condition: The exception_id in the path does not exist
- id: ERR_RELEASE_REQUEST_NOT_FOUND
  http: 404
  condition: The release_request_id in the path does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Body is not parseable, a required field is absent, a field carries the wrong type, or the return_reason
    is not one of R01 through R10 or CHK_RETURNED
- id: ERR_INVALID_TRANSITION
  http: 409
  condition: The target resource is not in any state from which the requested transition is declared
- id: ERR_INVALID_SETTLEMENT_AXIS
  http: 409
  condition: The requested operation is legal on the lifecycle axis but illegal on the settlement axis — void requires
    UNSETTLED, reverse requires SETTLED
- id: ERR_ALREADY_TERMINAL
  http: 409
  condition: The target resource is in a terminal state and the requested transition cannot leave it
- id: ERR_COUNTERPARTY_BLOCKED
  http: 409
  condition: Counterparty.status is not ACTIVE at approval time
- id: ERR_COUNTERPARTY_NOT_SETTLED
  http: 409
  condition: A counterparty still has a live payment order and cannot be closed
- id: ERR_RELATIONSHIP_ALREADY_ACTIVE
  http: 409
  condition: An ACTIVE CounterpartyRelationship already exists for this institution pair
- id: ERR_UNATTRIBUTED_DEPOSIT_OPEN
  http: 409
  condition: An UNMATCHED_DEPOSIT exception is still open on either side of a relationship
- id: ERR_RAIL_ACCOUNT_UNSUPPORTED
  http: 422
  condition: The order's rail is absent from source_account.supported_rails, the account does not belong to the
    order's legal entity, or a CHECK order lacks payable_to_name
- id: ERR_SETTLEMENT_SPEED_UNSUPPORTED
  http: 422
  condition: settlement_speed is SAME_DAY on a rail other than ACH
- id: ERR_VELOCITY_LIMIT_EXCEEDED
  http: 409
  condition: amount_cents is zero or negative, or is greater than or equal to the effective limit from counterparty_velocity_limit
- id: ERR_CALENDAR_HAS_NO_OPEN_CYCLE
  http: 409
  condition: No open banking calendar cell for this rail exists within the lookahead window
- id: ERR_SETTLEMENT_POOL_INSUFFICIENT
  http: 409
  condition: The source settlement pool's forced_settlement_status is FAILED, or available funds are below the order
    amount plus fee
- id: ERR_LEDGER_LOCKED
  http: 409
  condition: The order's ledger status is CLOSED
- id: ERR_DUPLICATE_PAYMENT
  http: 409
  condition: The idempotency_key was already used for this legal entity on a non-cancelled order, or the duplicate_signature
    matched an order inside the logically-clocked 600-second window
- id: ERR_APPROVAL_POOL_WITHDRAWN
  http: 409
  condition: A pending ReleaseRequest's initiator has just approved the payment it was queued for, so its claim
    on the release pool is withdrawn
- id: ERR_PERIOD_CLOSED
  http: 409
  condition: The effective instant falls at or before the close instant of a closed period, or an exception from
    a closed period is being waived
- id: ERR_CLOSE_BLOCKED_BY_EXCEPTION
  http: 409
  condition: A ledger close was attempted while an exception on the ledger was still OPEN, ASSIGNED or ESCALATED
    after the aging pass
- id: ERR_LEDGER_UNBALANCED
  http: 409
  condition: A ledger recomputation could not restore the double-entry identity or the reverse-rail fee invariant
- id: ERR_BALANCE_WOULD_GO_NEGATIVE
  http: 409
  condition: A manual posting would drive posted_balance_cents below zero for a ledger whose institution has no
    overdraft facility
- id: ERR_LINE_ALREADY_MATCHED
  http: 409
  condition: The bank line being appended duplicates an existing line reference, an existing line fingerprint, an
    existing statement revision, or an existing statement for the same cycle
- id: ERR_DUPLICATE_REFERENCE_CODE
  http: 409
  condition: The reference code or external reference is already used within its uniqueness scope
- id: ERR_STATEMENT_VARIANCE_UNRESOLVED
  http: 409
  condition: A statement revision cannot be marked RECONCILED while unmatched_amount_cents is non-zero
- id: ERR_STATEMENT_ONLY_MUTABLE_BEFORE_RECONCILE
  http: 409
  condition: A line was appended to a statement that has already left the IMPORTED state
- id: ERR_EXCEPTION_NOT_ASSIGNED_TO_CALLER
  http: 409
  condition: Resolve was attempted by a caller who is not the exception's assignee, or before the exception aged
    one business day
- id: ERR_EXCEPTION_NOT_AGED
  http: 409
  condition: Escalate or waive was attempted while aging_bucket is CURRENT, or de-escalate while it is not CURRENT
- id: ERR_CLOCK_NOT_MONOTONIC
  http: 409
  condition: POST /_clock/set_current_utc was called with an instant strictly earlier than the current logical clock
- id: ERR_STALE_VERSION
  http: 412
  condition: An expected_*_version field carries a value behind the persisted version of the parent, or a statement
    revision was proposed against a superseded revision_number
roles:
- name: PlatformAdmin
  description: 'Platform operator: provisions institutions, ledgers and calendars; holds no payment-release authority
    so that release always stays with the two operations roles'
  identity: opaque
  exclusive_operations:
  - POST /legal-entities — Register an institution
  - POST /_clock/set_current_utc — Set the logical clock
  shared_operations:
  - POST /ledgers — Open a ledger
  - POST /bank-accounts — Register a bank account
  - POST /settlement-pools — Create a settlement pool
  - POST /banking-calendar — Publish a calendar cell
  - POST /counterparty-relationships — Request a relationship
  - POST /pool-memberships — Add a pool member
  - GET /ledgers/{id} — Read a ledger
- name: LedgerController
  description: 'Controller: owns the books. Opens and closes periods, recomputes balances, voids posted entries,
    and is the only role that may certify a ledger as balanced'
  identity: opaque
  exclusive_operations:
  - POST /ledgers/{id}/close-period — Advance or close the period
  - POST /transactions/{id}/void — Void a posted unsettled entry
  shared_operations:
  - POST /ledgers/{id}/recompute — Recompute derived balances
  - POST /bank-statements/{id}/reconcile — Certify a reconciliation
  - POST /bank-accounts/{id}/close — Close an account
- name: PaymentInitiator
  description: 'Operations user who drafts payments. May never release one: the release endpoints do not list this
    role at all, and the ReleaseRequest it raises is the only route to its own payment being released'
  identity: opaque
  exclusive_operations:
  - POST /payment-orders — Create a payment order
  - POST /payment-orders/{id}/cancel — Cancel an unapproved order
  shared_operations:
  - POST /counterparties — Create a counterparty
  - POST /release-requests — Raise a release request
  - GET /payment-orders/{id} — Read a payment order
  - GET /banking-calendar — Read the calendar
- name: PaymentApprover
  description: Release authority. Approves and dispatches payment orders, and maintains counterparty posture. This
    is the only role that can make money move
  identity: opaque
  exclusive_operations:
  - POST /payment-orders/{id}/approve — Release an order from PENDING_APPROVAL
  - POST /payment-orders/{id}/dispatch — Push a released order onto its rail
  - POST /counterparties/{id}/restrict — Restrict a counterparty
  - POST /counterparties/{id}/block — Block a counterparty
  - POST /counterparties/{id}/unblock — Unblock a counterparty
  - POST /counterparties/{id}/restore — Restore a counterparty
  - POST /counterparties/{id}/close — Close a counterparty
  shared_operations:
  - POST /counterparties — Create a counterparty
  - POST /release-requests — Raise a release request
  - POST /bank-accounts — Register a bank account
  - POST /banking-calendar — Publish a calendar cell
- name: PaymentOpsAnalyst
  description: 'Operations analyst: works the exceptions and the settlement pipeline. Cannot approve, dispatch,
    or close a period'
  identity: opaque
  exclusive_operations:
  - POST /payment-orders/{id}/mark_in_flight — Join a rail branch
  - POST /payment-orders/{id}/settle — Settle an in-flight order
  - POST /payment-orders/{id}/return — Return an in-flight order
  - POST /payment-orders/{id}/reverse — Reverse a settled order
  - POST /payment-orders/{id}/fail — Fail an in-flight order
  - POST /bank-statements — Import a statement
  - POST /bank-statements/{id}/lines — Append a bank line
  - POST /bank-statements/{id}/revise — Create the next statement revision
  - POST /counterparties — Create a counterparty
  shared_operations:
  - POST /ledgers/{id}/transactions — Book a manual entry
  - POST /exceptions/{id}/assign — Assign an exception
  - POST /exceptions/{id}/resolve — Resolve an exception
  - POST /virtual-accounts — Allocate a virtual account
- name: PaymentOpsApprover
  description: 'Senior operations approver: waives aged exceptions and reassigns the queue. Possesses no payment-release
    authority, so exception waivers can never be traded for a release'
  identity: opaque
  exclusive_operations:
  - POST /exceptions/{id}/waive — Waive an aged exception
  shared_operations:
  - POST /exceptions/{id}/assign — Assign an exception
  - POST /exceptions/{id}/escalate — Escalate an exception
  - POST /exceptions/{id}/deescalate — De-escalate an exception
  - POST /exceptions/{id}/unassign — Return an exception to the queue
- name: CounterpartyUser
  description: The counterparty's own operator, acting as a distinct natural person from every platform role. Reads
    its own orders and requests releases; the counterparty identity is a persisted entity, so X-User-ID must be
    an existing Counterparty id
  identity: entity_backed:Counterparty
  exclusive_operations: []
  shared_operations:
  - GET /payment-orders/{id} — Read a payment order addressed to this counterparty
  - GET /release-requests/{id} — Read a release request about this counterparty
  - GET /release-requests — List release requests concerning this counterparty
  - GET /counterparties/{id} — Read its own counterparty record
- name: Auditor
  description: 'Read-only external auditor: sees postings, exceptions, statements and the audit trail, and can read
    nothing that would let it mutate state'
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - GET /ledgers/{id}/receipts — Project postings as receipt pairs
  - GET /audit-events — Read the audit trail
  - GET /audit-events/{sequenceNumber} — Deep-link one audit event
  - GET /transactions — Read ledger entries
  - GET /exceptions — Read the exception queue
