            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-CC2-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
