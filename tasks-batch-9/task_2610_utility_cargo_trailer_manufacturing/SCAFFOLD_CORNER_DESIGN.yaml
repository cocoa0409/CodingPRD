      - name: calc_gvwr_provisional_and_certified_variants_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.gvwr_rating.variants
          - entities.TrailerModel.fields.provisional_gvwr_lbs
        excluded_because:
          difficulty_instance: dual_variant_calc / gvwr_provisional_estimate_versus_certified_final
          rationale: "That instance reads both variants off one model and pins the 7200 versus 6300 delta with the derate and the 10 lb floor."
      - name: calc_warranty_coverage_variant_is_selected_by_the_failure_date
        claim_type: Variant Selection
        grounds:
          - calculations.warranty_reimbursement.variants
          - entities.WarrantyClaim.fields.coverage_factor
        excluded_because:
          difficulty_instance: dual_variant_calc / warranty_in_warranty_full_versus_goodwill_prorated
          rationale: "That instance approves two claims on the same unit and asserts the 1.00 versus 0.75 factor and both payouts."
      - name: calc_invoice_evaluation_order_is_pinned_to_seven_steps
        claim_type: tiered_pricing
        grounds:
          - calculations.order_invoice_and_draw.formula
          - calculations.order_invoice_and_draw.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / order_invoice_pinned_seven_step_evaluation_order
          rationale: "That instance walks all seven steps with options priced in and proves freight cannot be computed before the tier."
      - name: calc_parts_markup_rounding_precision_is_per_line
        claim_type: Precision
        grounds:
          - calculations.warranty_reimbursement.precision
          - calculations.warranty_reimbursement.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / warranty_parts_markup_rounds_per_line_before_quantity
          rationale: "That instance contrasts the per-line rounding total against the round-once-at-the-end total on multi-quantity lines."
      - name: calc_jig_occupancy_is_half_open_with_a_trailing_buffer
        claim_type: interval_merge
        grounds:
          - calculations.jig_occupancy_conflict
          - entities.WeldJig.fields.changeover_buffer_min
        excluded_because:
          difficulty_instance: resource_temporal_overlap / jig_half_open_window_with_trailing_changeover_buffer
          rationale: "That instance tests the buffer-1 rejection and the exactly-buffer acceptance on the same jig."
      - name: calc_lane_capacity_counts_only_scheduled_tests
        claim_type: Input Set Filtering
        grounds:
          - calculations.lane_capacity_conflict.input_set
          - entities.TestLane.fields.max_concurrent_tests
        excluded_because:
          difficulty_instance: resource_temporal_overlap / lane_closed_intervals_with_aggregate_capacity_of_two
          rationale: "That instance fills the lane to capacity 2, is refused, then resolves one test and books successfully."
      - name: calc_frame_tolerance_comparison_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.frame_dimensional_verdict.constants.FRAME_TOL_MM
          - calculations.frame_dimensional_verdict.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / frame_deviation_tolerance_inclusive_at_three_millimetres
          rationale: "That instance pins 3.0 mm PASS against 3.1 mm FAIL on otherwise identical measurements."
      - name: calc_brake_threshold_constant_is_read_from_the_pinned_gvwr
        claim_type: Constants Applied
        grounds:
          - calculations.regulatory_equipment_requirements.constants.BRAKE_REQUIRED_GVWR_LBS
        excluded_because:
          difficulty_instance: boundary_precision_check / brake_requirement_inclusive_at_gvwr_exactly_3000
          rationale: "That instance builds a model whose certified GVWR is exactly 3000 and shows the requirement biting at the boundary."
      - name: calc_weight_aggregate_is_restored_exactly_after_a_removal
        claim_type: aggregation
        grounds:
          - calculations.unit_weight_budget
          - entities.OptionInstall.fields.status
        excluded_because:
          difficulty_instance: compensating_invariant / option_removal_restores_the_unit_weight_budget_exactly
