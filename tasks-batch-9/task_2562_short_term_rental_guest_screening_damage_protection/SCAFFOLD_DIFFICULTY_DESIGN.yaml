              captures: { p3v: $.data.version }
            - call: "POST /rentals/reservations"
              payload: { guest_id: "${g2}", property_id: "${p3}", check_in: "2026-08-10", check_out: "2026-08-13", guest_count: 2, event_declared: false, expected_property_version: "${p3v}" }
              as: Guest
              as_user_id: "${g2}"
              captures: { r2: $.data.id }
            - call: "POST /rentals/reservations/${r2}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/reservations/${r1}/check-in"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /rentals/reservations/${r2}/check-in"
              payload: {}
