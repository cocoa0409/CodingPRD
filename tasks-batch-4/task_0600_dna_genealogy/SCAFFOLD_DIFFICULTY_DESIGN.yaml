scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ethnicity_provisional_vs_final_composition_diverges
        grounds:
          - calculations.ethnicity_composition
          - entities.Report.fields.composition
          - entities.Report.fields.variant
          - state_machines.Report.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Entity domain = Report (genomics). The identical Sample.population_scores
          [AFR:100, EAS:100, EUR:100, SAS:1] yield composition AFR=33.23/EAS=33.22/
          EUR=33.22/SAS=0.33 under PROVISIONAL but AFR=33.34/EAS=33.33/EUR=33.33
          under FINAL, because FINAL prunes the sub-1.00% SAS population and
          renormalizes over raw_total=300 instead of 301.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "Customer A with a PLUS subscription (access_status=ACTIVE), a V5 kit activated, its Sample GENOTYPED via a finalized batch carrying population_scores [AFR:100, EAS:100, EUR:100, SAS:1]; Customer.dna_status = DNA_READY."
            - "Customer A holds an ACTIVE RESEARCH ConsentGrant covering the clock (required for variant=FINAL)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "a@dna.test", display_name: "Ann" }
              as: PlatformAdmin
              captures: { cA: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cA}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cA}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cA}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cA}"
              captures: { kA: $.data.id, bcA: $.data.barcode }
            - call: "POST /dna/kits/${kA}/activate"
              payload: { barcode: "${bcA}" }
              as: Customer
              as_user_id: "${cA}"
            - call: "POST /dna/kits/${kA}/receive"
              payload: {}
              as: LabTechnician
              captures: { sA: $.data.id }
            - call: "POST /dna/samples/${sA}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-1", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sA}"] }
              as: LabTechnician
              captures: { bat: $.data.id }
            - call: "POST /dna/lab-batches/${bat}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${bat}/finalize"
              payload: { sample_results: [ { sample_id: "${sA}", call_rate: 0.99, population_scores: [ { population: "AFR", raw_score: 100 }, { population: "EAS", raw_score: 100 }, { population: "EUR", raw_score: 100 }, { population: "SAS", raw_score: 1 } ], genotype_markers: [1, 2, 3] } ] }
              as: LabTechnician
            - call: "POST /dna/consent-grants"
              payload: { customer_id: "${cA}", scope: "RESEARCH", effective_from: "2026-05-01T00:00:00Z", effective_until: "2026-12-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cA}"
            - call: "GET /dna/customers/${cA}"
              payload: {}
              as: Customer
              as_user_id: "${cA}"
              captures: { cv1: $.data.version }
          trigger:
            - call: "POST /dna/customers/${cA}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${cv1}" }
              as: Customer
              as_user_id: "${cA}"
              captures: { rProv: $.data.id }
            - call: "GET /dna/customers/${cA}"
              payload: {}
              as: Customer
              as_user_id: "${cA}"
              captures: { cv2: $.data.version }
            - call: "POST /dna/customers/${cA}/reports"
              payload: { report_type: "ETHNICITY", variant: "FINAL", expected_customer_version: "${cv2}" }
              as: Customer
              as_user_id: "${cA}"
              captures: { rFinal: $.data.id }
          assert:
            - "Report.${rProv}.composition == [{population: AFR, share_pct: 33.23}, {population: EAS, share_pct: 33.22}, {population: EUR, share_pct: 33.22}, {population: SAS, share_pct: 0.33}]"
            - "Report.${rProv}.residual_population == AFR"
            - "Report.${rFinal}.composition == [{population: AFR, share_pct: 33.34}, {population: EAS, share_pct: 33.33}, {population: EUR, share_pct: 33.33}]"
            - "Report.${rFinal}.residual_population == AFR"
            - "Report.${rProv}.status == SUPERSEDED"
            - "Report.${rFinal}.status == PUBLISHED"
            - "Report.${rProv}.sample_id == ${sA} and Report.${rFinal}.sample_id == ${sA}"

      - name: subscription_close_refund_clean_vs_consumed_period
        grounds:
          - calculations.subscription_close_refund
          - entities.Subscription.fields.published_report_count
          - entities.Customer.fields.wallet_credit_cents
          - state_machines.Subscription.billing_CURRENT_to_CLOSED
        distinguishing_aspect: |
          Entity domain = Subscription (billing), NOT Report. Two PLUS subscriptions with
          identical tier, period and cancel clock (26 unused days, base refund 1733 cents)
          diverge: the customer with zero PUBLISHED reports in the period is refunded 1733
          (CLEAN_PERIOD) while the customer with one PUBLISHED report is refunded
          1733 - 300 = 1433 (CONSUMED_PERIOD).
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customers A and B each hold a PLUS subscription opened at 2026-05-01 (current_period_end = 2026-05-31T00:00:00Z), wallet_credit_cents = 0."
            - "Customer B is DNA_READY and has published exactly one ETHNICITY report (generated_at 2026-05-01, inside the period). Customer A has published none."
            - "Clock advanced to 2026-05-05T00:00:00Z, giving 26 unused days for both."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "clean@dna.test", display_name: "Clean" }
              as: PlatformAdmin
              captures: { cA: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cA}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cA}"
              captures: { subA: $.data.id }
            - call: "POST /dna/customers"
              payload: { email: "consumed@dna.test", display_name: "Consumed" }
              as: PlatformAdmin
              captures: { cB: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cB}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cB}"
              captures: { subB: $.data.id }
            - call: "POST /dna/kits"
              payload: { customer_id: "${cB}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cB}"
              captures: { kB: $.data.id, bcB: $.data.barcode }
            - call: "POST /dna/kits/${kB}/activate"
              payload: { barcode: "${bcB}" }
              as: Customer
              as_user_id: "${cB}"
            - call: "POST /dna/kits/${kB}/receive"
              payload: {}
              as: LabTechnician
              captures: { sB: $.data.id }
            - call: "POST /dna/samples/${sB}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-1", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sB}"] }
              as: LabTechnician
              captures: { bat: $.data.id }
            - call: "POST /dna/lab-batches/${bat}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${bat}/finalize"
              payload: { sample_results: [ { sample_id: "${sB}", call_rate: 0.99, population_scores: [ { population: "EUR", raw_score: 100 } ], genotype_markers: [1, 2] } ] }
              as: LabTechnician
            - call: "GET /dna/customers/${cB}"
              payload: {}
              as: Customer
              as_user_id: "${cB}"
              captures: { cvB: $.data.version }
            - call: "POST /dna/customers/${cB}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${cvB}" }
              as: Customer
              as_user_id: "${cB}"
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dna/subscriptions/${subA}/billing-event"
              payload: { event_type: "CANCEL" }
              as: PlatformAdmin
            - call: "POST /dna/subscriptions/${subB}/billing-event"
              payload: { event_type: "CANCEL" }
              as: PlatformAdmin
          assert:
            - "Customer.${cA}.wallet_credit_cents == 1733"
            - "Customer.${cB}.wallet_credit_cents == 1433"
            - "Subscription.${subA}.billing_status == CLOSED and Subscription.${subA}.access_status == CANCELLED"
            - "Subscription.${subB}.billing_status == CLOSED and Subscription.${subB}.access_status == CANCELLED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tier_change_charge_pinned_evaluation_order_mode_c
        grounds:
          - calculations.tier_change_charge
          - entities.Subscription.fields.last_change_charge_cents
          - entities.Subscription.fields.lifetime_charged_cents
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with a PINNED evaluation order. The loyalty
          discount tier is selected ONCE from prorated_cents (5200 -> 0.10), never re-selected
          from the post-fee charge_total_cents (4816, which would fall in the 0.05 tier and
          produce 5083 instead). PLUS->PRO at 26/30 remaining days gives exactly 4816 cents.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; Customer A on PLUS with current_period_end 2026-05-31T00:00:00Z; wallet_credit_cents = 10000."
            - "Clock advanced to 2026-05-05T00:00:00Z -> remaining_days = 26, BILLING_PERIOD_DAYS = 30."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "upgrade@dna.test", display_name: "Uma" }
              as: PlatformAdmin
              captures: { cA: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cA}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cA}"
              captures: { subA: $.data.id }
            - call: "POST /dna/customers/${cA}/credits"
              payload: { amount_cents: 10000 }
              as: PlatformAdmin
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /dna/subscriptions/${subA}"
              payload: {}
              as: Customer
              as_user_id: "${cA}"
              captures: { svA: $.data.version }
          trigger:
            - call: "POST /dna/subscriptions/${subA}/change-tier"
              payload: { new_tier: "PRO", expected_subscription_version: "${svA}" }
              as: Customer
              as_user_id: "${cA}"
          assert:
            - "Subscription.${subA}.tier == PRO"
            - "Subscription.${subA}.last_change_charge_cents == 4816"
            - "Subscription.${subA}.lifetime_charged_cents == 4816"
            - "Subscription.${subA}.last_change_from_tier == PLUS"
            - "Customer.${cA}.wallet_credit_cents == 5184"

      - name: ethnicity_round_then_sum_residual_to_largest_raw_score_mode_b
        grounds:
          - calculations.ethnicity_composition
          - entities.Report.fields.residual_population
          - entities.Report.fields.composition
        distinguishing_aspect: |
          MODE (b) — nested rounding whose ORDER is pinned. Rounding each of the four
          population shares to 2 dp FIRST and summing gives 99.99, so a residual of 0.01
          exists and must be handed to the largest raw_score (tie AFR/EAS/EUR at 100 ->
          alphabetically lowest = AFR -> 33.23). Summing the unrounded shares and rounding
          once would give 100.00 with no residual and AFR = 33.22.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer R is DNA_READY on a PLUS subscription; its GENOTYPED sample carries population_scores [AFR:100, EAS:100, EUR:100, SAS:1] (raw_total = 301)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "round@dna.test", display_name: "Rita" }
              as: PlatformAdmin
              captures: { cR: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cR}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cR}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cR}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cR}"
              captures: { kR: $.data.id, bcR: $.data.barcode }
            - call: "POST /dna/kits/${kR}/activate"
              payload: { barcode: "${bcR}" }
              as: Customer
              as_user_id: "${cR}"
            - call: "POST /dna/kits/${kR}/receive"
              payload: {}
              as: LabTechnician
              captures: { sR: $.data.id }
            - call: "POST /dna/samples/${sR}/extract"
              payload: { dna_yield_ng: 350.0 }
              as: LabTechnician
            - call: "POST /dna/lab-instruments"
              payload: { name: "SEQ-2", chip_version: "V5", status: "ONLINE" }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /dna/lab-batches"
              payload: { instrument_id: "${inst}", run_start_at: "2026-05-01T02:00:00Z", run_end_at: "2026-05-01T06:00:00Z", sample_ids: ["${sR}"] }
              as: LabTechnician
              captures: { bat: $.data.id }
            - call: "POST /dna/lab-batches/${bat}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /dna/lab-batches/${bat}/finalize"
              payload: { sample_results: [ { sample_id: "${sR}", call_rate: 0.99, population_scores: [ { population: "AFR", raw_score: 100 }, { population: "EAS", raw_score: 100 }, { population: "EUR", raw_score: 100 }, { population: "SAS", raw_score: 1 } ], genotype_markers: [1, 2] } ] }
              as: LabTechnician
            - call: "GET /dna/customers/${cR}"
              payload: {}
              as: Customer
              as_user_id: "${cR}"
              captures: { cvR: $.data.version }
          trigger:
            - call: "POST /dna/customers/${cR}/reports"
              payload: { report_type: "ETHNICITY", variant: "PROVISIONAL", expected_customer_version: "${cvR}" }
              as: Customer
              as_user_id: "${cR}"
              captures: { rep: $.data.id }
          assert:
            - "Report.${rep}.residual_population == AFR"
            - "Report.${rep}.composition == [{population: AFR, share_pct: 33.23}, {population: EAS, share_pct: 33.22}, {population: EUR, share_pct: 33.22}, {population: SAS, share_pct: 0.33}]"
            - "sum of Report.${rep}.composition[*].share_pct == 100.00"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: sample_qc_failure_requeue_cycle_returns_to_received
        grounds:
          - state_machines.Sample.RECEIVED_to_QC_FAILED
          - state_machines.Sample.QC_FAILED_to_RECEIVED
          - state_machines.Sample.RECEIVED_to_EXTRACTED
          - entities.Sample.fields.extraction_attempts
        distinguishing_aspect: |
          CYCLE on entity Sample: RECEIVED -> QC_FAILED -> RECEIVED -> EXTRACTED. The sample
          re-enters a state it already left, and extraction_attempts (2) survives the loop —
          it is not reset by the requeue edge.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer Q with a PLUS subscription and an activated V5 kit whose Sample is in RECEIVED with extraction_attempts = 0."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "q@dna.test", display_name: "Quinn" }
              as: PlatformAdmin
              captures: { cQ: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cQ}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cQ}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cQ}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cQ}"
              captures: { kQ: $.data.id, bcQ: $.data.barcode }
            - call: "POST /dna/kits/${kQ}/activate"
              payload: { barcode: "${bcQ}" }
              as: Customer
              as_user_id: "${cQ}"
            - call: "POST /dna/kits/${kQ}/receive"
              payload: {}
              as: LabTechnician
              captures: { sQ: $.data.id }
          trigger:
            - call: "POST /dna/samples/${sQ}/extract"
              payload: { dna_yield_ng: 100.0 }
              as: LabTechnician
              captures: { st1: $.data.status, at1: $.data.extraction_attempts }
            - call: "POST /dna/samples/${sQ}/requeue"
              payload: {}
              as: LabTechnician
              captures: { st2: $.data.status }
            - call: "POST /dna/samples/${sQ}/extract"
              payload: { dna_yield_ng: 500.0 }
              as: LabTechnician
              captures: { st3: $.data.status }
          assert:
            - "${st1} == QC_FAILED and ${at1} == 1"
            - "${st2} == RECEIVED"
            - "${st3} == EXTRACTED"
            - "Sample.${sQ}.extraction_attempts == 2"
            - "Sample.${sQ}.batch_id == null"

      - name: subscription_billing_and_access_dimensions_evolve_independently
        grounds:
          - state_machines.Subscription.billing_CURRENT_to_PAST_DUE
          - state_machines.Subscription.access_GRACE_to_LOCKED
          - state_machines.Subscription.billing_PAST_DUE_to_CURRENT
          - entities.Subscription.fields.billing_status
          - entities.Subscription.fields.access_status
        distinguishing_aspect: |
          PARALLEL STATE DIMENSIONS on entity Subscription (a different entity from the
          cyclic Sample machine): the second PAYMENT_FAILED advances access_status
          GRACE -> LOCKED while billing_status stays pinned at PAST_DUE — proving the two
          axes are independent and not a single composite state.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z. Customer P holds a PLUS subscription in (billing_status=CURRENT, access_status=ACTIVE)."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "p@dna.test", display_name: "Pia" }
              as: PlatformAdmin
              captures: { cP: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cP}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cP}"
              captures: { subP: $.data.id }
          trigger:
            - call: "POST /dna/subscriptions/${subP}/billing-event"
              payload: { event_type: "PAYMENT_FAILED" }
              as: PlatformAdmin
              captures: { b1: $.data.billing_status, a1: $.data.access_status }
            - call: "POST /dna/subscriptions/${subP}/billing-event"
              payload: { event_type: "PAYMENT_FAILED" }
              as: PlatformAdmin
              captures: { b2: $.data.billing_status, a2: $.data.access_status }
            - call: "POST /dna/subscriptions/${subP}/billing-event"
              payload: { event_type: "PAYMENT_SUCCEEDED" }
              as: PlatformAdmin
              captures: { b3: $.data.billing_status, a3: $.data.access_status }
          assert:
            - "${b1} == PAST_DUE and ${a1} == GRACE"
            - "${b2} == PAST_DUE and ${a2} == LOCKED"
            - "${b3} == CURRENT and ${a3} == ACTIVE"
            - "Subscription.${subP}.grace_until == null"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_withdraw_relative_matching_four_hop_cascade
        grounds:
          - state_machines.ConsentGrant.ACTIVE_to_WITHDRAWN
          - state_machines.RelativeMatch.ACTIVE_to_SUPPRESSED
          - state_machines.RecordHint.PENDING_to_WITHDRAWN
          - entities.Customer.fields.matching_opt_in
          - entities.Customer.fields.visible_match_count
          - entities.TreePerson.fields.hint_count
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /dna/consent-grants/{id}/withdraw: hop1 the grant
          flips Customer.matching_opt_in to false; BECAUSE that flag flipped, hop2 the
          RelativeMatch goes ACTIVE -> SUPPRESSED; BECAUSE the match left ACTIVE, hop3
          decrements visible_match_count on BOTH customers; BECAUSE the match left ACTIVE,
          hop4 withdraws its RecordHints and decrements TreePerson.hint_count. Each hop is
          caused by the previous hop, not by the withdraw call itself.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z."
            - "Customers A and B both DNA_READY (one batch, two GENOTYPED samples, genotype_markers [1,2] each), both PLUS, both holding an ACTIVE RELATIVE_MATCHING ConsentGrant covering the clock."
            - "Each owns one ACTIVE FamilyTree with exactly one ACTIVE root TreePerson (no parents)."
            - "A match recompute has produced exactly one ACTIVE RelativeMatch (shared_cm 8.00) and one PENDING DNA_TREE RecordHint on each root person; both customers have visible_match_count = 1 and each root person has hint_count = 1."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dna/customers"
              payload: { email: "casc-a@dna.test", display_name: "CascA" }
              as: PlatformAdmin
              captures: { cA: $.data.id }
            - call: "POST /dna/subscriptions"
              payload: { customer_id: "${cA}", tier: "PLUS" }
              as: Customer
              as_user_id: "${cA}"
            - call: "POST /dna/kits"
              payload: { customer_id: "${cA}", chip_version: "V5" }
              as: Customer
              as_user_id: "${cA}"
              captures: { kA: $.data.id, bcA: $.data.barcode }
            - call: "POST /dna/kits/${kA}/activate"
              payload: { barcode: "${bcA}" }
              as: Customer
              as_user_id: "${cA}"
