# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# K-12 Student Information System — Expert
# Breadth probe across claim-extraction-guide sections 1-9.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_student_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Student.fields.status, entities.Student.fields.state_student_id]
        distinguishing_aspect: "POST /students with all required fields returns 201; status defaults to PROSPECTIVE; id/created_at/updated_at/version are server-minted."
        test_recipe:
          setup: ["A school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-N1", first_name: "Ned", last_name: "New", grade_level: "4", birth_date: "2015-06-06" }
              as: Registrar
              captures: { stu: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Student.${stu}.status == PROSPECTIVE"
            - "Student.${stu}.version == 1"

      - name: create_student_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Student.fields.grade_level]
        distinguishing_aspect: "POST /students omitting grade_level (source:input, no default) -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A school exists."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
          trigger:
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-M1", first_name: "Moe", last_name: "Miss", birth_date: "2015-06-06" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "response code == 400"

      - name: get_student_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Student", "errors[ERR_STUDENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /students/{id} for an unknown UUID -> ERR_STUDENT_NOT_FOUND 404."
        test_recipe:
          setup: ["No student with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STUDENT_NOT_FOUND"
            - "response code == 404"

      - name: enrollment_default_fte_applied
        claim_type: Defaults
        grounds: [entities.Enrollment.fields.fte]
        distinguishing_aspect: "POST /enrollments without fte applies default fte=1.0."
        test_recipe:
          setup: ["A school and a student exist."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-D2", first_name: "Deb", last_name: "Def", grade_level: "1", birth_date: "2018-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id, fte: $.data.fte }
          assert:
            - "Enrollment.${enr}.fte == 1.0"
            - "Enrollment.${enr}.status == ACTIVE"

      - name: enroll_sets_student_status_enrolled_computed
        claim_type: Computed Fields
        grounds: [entities.Student.fields.status, entities.Enrollment.fields.school_id]
        distinguishing_aspect: "Creating an enrollment flips the parent Student.status PROSPECTIVE -> ENROLLED and copies school_id from the student (cross-entity computed)."
        test_recipe:
          setup: ["A school and a PROSPECTIVE student exist."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-EN", first_name: "Ena", last_name: "Roll", grade_level: "2", birth_date: "2017-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id, sid: $.data.school_id }
          assert:
            - "Enrollment.${enr}.school_id == ${sch}"
            - "Student.${stu}.status == ENROLLED"

      - name: duplicate_state_student_id_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_STATE_STUDENT_ID]", "entities.Student.fields.state_student_id"]
        distinguishing_aspect: "A second student with an existing state_student_id in the same school -> ERR_DUPLICATE_STATE_STUDENT_ID 409."
        test_recipe:
          setup: ["A school with a student using state_student_id SSID-DUP."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-DUP", first_name: "One", last_name: "Dup", grade_level: "5", birth_date: "2015-01-01" }
              as: Registrar
          trigger:
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-DUP", first_name: "Two", last_name: "Dup", grade_level: "5", birth_date: "2015-02-01" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_STATE_STUDENT_ID"

      - name: duplicate_course_code_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_COURSE_CODE]", "entities.Course.fields.course_code"]
        distinguishing_aspect: "A second course with an existing course_code in the same school -> ERR_DUPLICATE_COURSE_CODE 409."
        test_recipe:
          setup: ["A school with a course code MATH1."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "MATH1", title: "Math 1", grading_mode: "STANDARDS" }
              as: Registrar
          trigger:
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "MATH1", title: "Math 1 dup", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_COURSE_CODE"

      - name: list_students_pagination_envelope
        claim_type: Listing
        grounds: [entities.Student, endpoints]
        distinguishing_aspect: "GET /students?limit=1 returns a paginated array envelope with total_count and has_more reflecting more than one student."
        test_recipe:
          setup: ["A school with two students."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-L1", first_name: "L1", last_name: "List", grade_level: "5", birth_date: "2015-01-01" }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-L2", first_name: "L2", last_name: "List", grade_level: "5", birth_date: "2015-02-01" }
              as: Registrar
          trigger:
            - call: "GET /students"
              payload: { school_id: "${sch}", limit: 1, offset: 0 }
              as: Registrar
          assert:
            - "response_type == array; meta total_count == 2; has_more == true; data length == 1"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: withdraw_already_withdrawn_returns_not_active
        claim_type: Invalid Transitions
        grounds: ["state_machines.Enrollment.ACTIVE_to_WITHDRAWN", "errors[ERR_ENROLLMENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Withdrawing an enrollment already WITHDRAWN -> ERR_ENROLLMENT_NOT_ACTIVE 409; no second cascade fires."
        test_recipe:
          setup: ["A withdrawn enrollment (clock at day 2)."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 2 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-WW", first_name: "Wil", last_name: "Ww", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/withdraw"
              payload: { exit_day_index: 2 }
              as: Registrar
          trigger:
            - call: "POST /enrollments/${enr}/withdraw"
              payload: { exit_day_index: 2 }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ENROLLMENT_NOT_ACTIVE"

      - name: adjudicate_before_consequence_returns_no_consequence
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DisciplineIncident.UNDER_REVIEW_to_ADJUDICATED", "errors[ERR_NO_CONSEQUENCE_RECORDED]"]
        distinguishing_aspect: "Adjudicating an UNDER_REVIEW incident with no consequence attached -> ERR_NO_CONSEQUENCE_RECORDED 409."
        test_recipe:
          setup: ["An incident UNDER_REVIEW by admin-1 with no consequence."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-AJ", first_name: "Ada", last_name: "Aj", grade_level: "8", birth_date: "2011-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "DISRUPTION", severity: 2, incident_day_index: 1 }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { inc: $.data.id }
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /discipline-incidents/${inc}/adjudicate"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_CONSEQUENCE_RECORDED"
            - "DisciplineIncident.${inc}.status == UNDER_REVIEW"

      - name: begin_review_by_referrer_segregation_denied
        claim_type: guarded transitions
        grounds: ["state_machines.DisciplineIncident.REFERRED_to_UNDER_REVIEW", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "begin-review attempted by the same X-User-ID that filed the REFERRED incident -> ERR_SEGREGATION_OF_DUTIES 403."
        test_recipe:
          setup: ["A REFERRED incident filed by admin-dual."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-SG", first_name: "Sam", last_name: "Sg", grade_level: "8", birth_date: "2011-02-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "DISRUPTION", severity: 2, incident_day_index: 1 }
              as: Administrator
              as_user_id: "admin-dual"
              captures: { inc: $.data.id }
          trigger:
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "admin-dual"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "DisciplineIncident.${inc}.status == REFERRED"

      - name: adjudicate_by_non_reviewer_denied
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DisciplineIncident.UNDER_REVIEW_to_ADJUDICATED", "errors[ERR_NOT_ASSIGNED_ADJUDICATOR]"]
        distinguishing_aspect: "An admin who did NOT begin review (admin-2) attempts to adjudicate -> ERR_NOT_ASSIGNED_ADJUDICATOR 403."
        test_recipe:
          setup: ["Incident UNDER_REVIEW by admin-1 with a WARNING consequence attached by admin-1."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-NR", first_name: "Nat", last_name: "Nr", grade_level: "8", birth_date: "2011-03-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "DISRUPTION", severity: 2, incident_day_index: 1 }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { inc: $.data.id }
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
            - call: "POST /discipline-incidents/${inc}/consequences"
              payload: { type: "WARNING" }
              as: Administrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /discipline-incidents/${inc}/adjudicate"
              payload: {}
              as: Administrator
              as_user_id: "admin-2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_ASSIGNED_ADJUDICATOR"

      - name: reopen_non_finalized_report_card_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.ReportCard.FINALIZED_to_REOPENED", "errors[ERR_REPORT_CARD_NOT_FINALIZED]"]
        distinguishing_aspect: "Reopening a DRAFT (never-finalized) report card -> ERR_REPORT_CARD_NOT_FINALIZED 409."
        test_recipe:
          setup: ["A DRAFT report card."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-RO", first_name: "Rob", last_name: "Ro", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /report-cards"
              payload: { enrollment_id: "${enr}", term_label: "Q1" }
              as: Teacher
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /report-cards/${rc}/reopen"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPORT_CARD_NOT_FINALIZED"

      - name: certify_terminal_rejected_report_locked
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.AdaFundingReport.DRAFT_to_REJECTED", "errors[ERR_REPORT_NOT_DRAFT]"]
        distinguishing_aspect: "Certifying a REJECTED (terminal) ADA report -> ERR_REPORT_NOT_DRAFT 409; terminal state admits no transitions."
        test_recipe:
          setup: ["A REJECTED ADA report (drafted by registrar-d, rejected by officer-1)."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /ada-funding-reports"
              payload: { school_id: "${sch}", as_of_day_index: 0 }
              as: Registrar
              as_user_id: "registrar-d"
              captures: { rep: $.data.id, repv: $.data.version }
            - call: "POST /ada-funding-reports/${rep}/reject"
              payload: {}
              as: StateReportingOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /ada-funding-reports/${rep}/certify"
              payload: { expected_report_version: "${repv}" }
              as: StateReportingOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REPORT_NOT_DRAFT"
            - "AdaFundingReport.${rep}.status == REJECTED"

      - name: weapon_suspension_cap_exceeded_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.DisciplineConsequence.ACTIVE_to_ACTIVE", "errors[ERR_SUSPENSION_CAP_EXCEEDED]", "validations[priority=8]"]
        distinguishing_aspect: "A WEAPON-category incident OSS with duration_days=11 exceeds the 10-day cap -> ERR_SUSPENSION_CAP_EXCEEDED 422; no attendance cascade."
        test_recipe:
          setup: ["A WEAPON incident UNDER_REVIEW by admin-1 (clock advanced enough), enrollment seated in one section."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 20 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-WP", first_name: "War", last_name: "Wp", grade_level: "10", birth_date: "2009-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /discipline-incidents"
              payload: { enrollment_id: "${enr}", category: "WEAPON", severity: 5, incident_day_index: 1 }
              as: Teacher
              as_user_id: "teacher-1"
              captures: { inc: $.data.id }
            - call: "POST /discipline-incidents/${inc}/begin-review"
              payload: {}
              as: Administrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /discipline-incidents/${inc}/consequences"
              payload: { type: "OUT_OF_SCHOOL_SUSPENSION", start_day_index: 1, duration_days: 11 }
              as: Administrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SUSPENSION_CAP_EXCEEDED"

      - name: mark_no_show_with_present_record_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Enrollment.ACTIVE_to_NO_SHOW", "errors[ERR_PRESENCE_ON_RECORD]"]
        distinguishing_aspect: "mark-no-show on an enrollment that has a PRESENT attendance record -> ERR_PRESENCE_ON_RECORD 409."
        test_recipe:
          setup: ["Enrollment with one PRESENT attendance record on day 1 (clock at day 1)."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 1 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-NS", first_name: "Noa", last_name: "Ns", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 1, code: "PRESENT" }
              as: Teacher
          trigger:
            - call: "POST /enrollments/${enr}/mark-no-show"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRESENCE_ON_RECORD"
            - "Enrollment.${enr}.status == ACTIVE"

      - name: reopen_section_when_open_rejected
        claim_type: Invalid Transitions
        grounds: ["state_machines.Section.CLOSED_to_OPEN", "errors[ERR_SECTION_NOT_CLOSED]"]
        distinguishing_aspect: "Reopening an already-OPEN section -> ERR_SECTION_NOT_CLOSED 409."
        test_recipe:
          setup: ["An OPEN section."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA" }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1 }
              as: Registrar
              captures: { sec: $.data.id }
          trigger:
            - call: "POST /sections/${sec}/reopen"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SECTION_NOT_CLOSED"

      - name: attendance_correction_supersedes_prior
        claim_type: Side Effect Execution
        grounds: [endpoints, entities.AttendanceRecord.fields.status, calculations.daily_attendance_rollup]
        distinguishing_aspect: "Correcting an ABSENT_UNEXCUSED record to PRESENT supersedes the old record (status SUPERSEDED) and recomputes the day; present_days rises by 1."
        test_recipe:
          setup: ["AGGREGATE_MEMBERSHIP school clock at day 1, enrollment seated in a 240-min section, day 1 marked ABSENT_UNEXCUSED."]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "S", state_code: "CA", ada_method: "AGGREGATE_MEMBERSHIP", minimum_daily_minutes: 240 }
              as: Registrar
              captures: { sch: $.data.id }
            - call: "POST /schools/${sch}/clock/advance"
              payload: { by_days: 1 }
              as: Registrar
            - call: "POST /students"
              payload: { school_id: "${sch}", state_student_id: "SSID-CR", first_name: "Cor", last_name: "Cr", grade_level: "9", birth_date: "2010-01-01" }
              as: Registrar
              captures: { stu: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu}", entry_day_index: 1 }
              as: Registrar
              captures: { enr: $.data.id }
            - call: "POST /courses"
              payload: { school_id: "${sch}", course_code: "C1", title: "C1", grading_mode: "STANDARDS" }
              as: Registrar
              captures: { crs: $.data.id }
            - call: "POST /sections"
              payload: { course_id: "${crs}", teacher_user_id: "teacher-1", period: 1, meeting_minutes: 240 }
              as: Registrar
              captures: { sec: $.data.id }
            - call: "POST /schedule-assignments"
              payload: { enrollment_id: "${enr}", section_id: "${sec}" }
              as: Registrar
              captures: { sa: $.data.id }
            - call: "POST /attendance-records"
              payload: { schedule_assignment_id: "${sa}", day_index: 1, code: "ABSENT_UNEXCUSED" }
              as: Teacher
              captures: { rec: $.data.id }
          trigger:
            - call: "POST /attendance-records/${rec}/correct"
              payload: { code: "PRESENT" }
              as: Teacher
              captures: { newrec: $.data.id }
          assert:
            - "AttendanceRecord.${rec}.status == SUPERSEDED"
            - "new AttendanceRecord.${newrec}.status == RECORDED and code == PRESENT"
            - "Enrollment.${enr}.present_days == 1"

      - name: error_oss_suspension_cascade_present_days
        claim_type: Side Effect Execution
        grounds: [state_machines.DisciplineConsequence.ACTIVE_to_ACTIVE]
        excluded_because:
          difficulty_instance: transitive_cascade / oss_suspension_cascade_depth3_present_days
          rationale: "The OSS depth-3 attendance cascade and its present_days effect are asserted by the named §1.8 instance."

      - name: error_withdraw_drops_schedule_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Enrollment.ACTIVE_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: transitive_cascade / withdraw_cascade_depth2_section_enrolled_count
          rationale: "The withdraw -> drop -> enrolled_count cascade is asserted by the named §1.8 instance."

