# =============================================================================
# PRD Benchmark Seed Tables — Airline Interline & Codeshare Revenue Proration
# Difficulty target: beyond Expert (§0.4) — 11 entities, 47 endpoints,
# 8 state machines (2 non-linear on distinct entities), 6 calculation rules
# with 3 dual-variant pairs, a 44-step precedence-ordered validation ladder,
# and two 5-hop transitive cascades.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2177. Airline Interline & Codeshare Revenue Proration
  (airline revenue accounting): agreement terms & prorate factors, coupon-level revenue
  allocation, billing through clearinghouse & rejection memo cycle, special prorate agreements
  vs straight-rate default, currency conversion & settlement timing, sampling & audit for
  undercharge recovery, frequent-flyer mileage cost accrual to partner, dispute resolution
  & aging

domain_name: interline-codeshare-proration
api_prefix: /interline

# =============================================================================
# Table 0: Response Envelope (FIXED — verbatim per §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at /interline/<collection>/{id}; parentage is
  # expressed exclusively through FK fields, never through nested ownership URLs.
  # The only two nested paths (prorate-agreement factors, ticket proration-runs)
  # are reverse-reachability readers, not an ownership tree.

  state_machine_shape: parallel
  # Ticket carries two independent state axes (proration_status x billing_status);
  # RejectionMemo is cyclic (RAISED -> COUNTERED -> RAISED with a stage counter);
  # BillingInvoice is branching (SUBMITTED -> {CLEARED, DRAFT-by-recall} ->
  # {PARTIALLY_REJECTED, FULLY_REJECTED, SETTLED}); ProrateAgreement cycles
  # ACTIVE <-> SUSPENDED.

  relationship_patterns:
    - one_to_many        # Ticket -> Coupon, ProrateAgreement -> ProrateFactor
    - cross_aggregate    # Coupon -> BillingInvoice, RejectionMemo -> Coupon
    - polymorphic_pair   # Carrier appears on both sides of every bilateral row
                         # (issuing/partner, billing/billed, auditing/audited)

  role_model: segregation_of_duties
  # The carrier that raises a rejection memo (the billed carrier) can never
  # counter, accept or arbitrate it; the auditor that raises a recovery claim
  # can never decide it; the accountant that drafts an agreement can never
  # activate it.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: iata_code
        type: string
        source: input
        description: two-character IATA airline designator, uppercase
        constraints: "exactly 2 characters, A-Z or 0-9; not unique (see §1.4 p3 shape rule only)"
      - name: name
        type: string
        source: input
        description: carrier legal name
      - name: base_currency
        type: enum
        source: input
        description: carrier's home accounting currency
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: credit_limit_minor
        type: integer
        source: input
        description: maximum net payable position, in settlement-currency minor units
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: clearinghouse standing; SUSPENDED blocks new billing activity
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: pending_receivable_minor
        type: integer
        source: computed
        description: sum of provisional_settlement_minor over this carrier's BillingInvoice rows with status == SUBMITTED, in settlement currency
        default: 0
      - name: pending_payable_minor
        type: integer
        source: computed
        description: sum of provisional_settlement_minor over BillingInvoice rows billed to this carrier with status == SUBMITTED, in settlement currency
        default: 0
      - name: settled_receivable_minor
        type: integer
        source: computed
        description: cleared receivable balance in settlement currency; increased at period close, decreased by accepted or upheld rejection memos
        default: 0
      - name: settled_payable_minor
        type: integer
        source: computed
        description: cleared payable balance in settlement currency; increased at period close, decreased by accepted or upheld rejection memos
        default: 0
      - name: net_position_minor
        type: integer
        source: computed
        description: "(pending_receivable_minor + settled_receivable_minor) - (pending_payable_minor + settled_payable_minor); positive means the clearinghouse owes this carrier"
        default: 0
      - name: period_accrued_miles
        type: integer
        source: computed
        description: running frequent-flyer miles this carrier has accrued as operating partner since the last SettlementPeriod settle; drives the FFP tier selection
        default: 0
      - name: period_ffp_cost_estimate_minor
        type: integer
        source: computed
        description: running sum of Coupon.ffp_accrual_cost_minor booked at fly time for coupons this carrier operated
        default: 0
      - name: period_ffp_cost_trued_up_minor
        type: integer
        source: computed
        description: single-tier recomputation of the whole period's mileage cost, written at settlement-period close
        default: 0
      - name: ffp_true_up_delta_minor
        type: integer
        source: computed
        description: period_ffp_cost_trued_up_minor - (sum of estimates for the closed period's coupons); may be negative
        default: 0
      - name: open_reproration_count
        type: integer
        source: computed
        description: number of times a Ticket this carrier validated has entered proration_status REPRORATION_REQUIRED
        default: 0
      - name: audit_flag
        type: boolean
        source: computed
        description: set true once open_reproration_count reaches 3; never reset
        default: false

  - name: ProrateAgreement
    parent: null
    common_fields: true
    fields:
      - name: issuing_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the validating (ticketing) carrier side of the bilateral agreement"
      - name: partner_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the operating (partner) carrier side of the bilateral agreement"
      - name: agreement_type
        type: enum
        source: input
        description: settlement basis this agreement imposes on matching coupons
        constraints: "one of {STRAIGHT_RATE, SPA_FLAT, SPA_PERCENT}"
      - name: settlement_currency
        type: enum
        source: input
        description: currency the agreement's amounts are denominated in; must equal the ticket's sale_currency for the agreement to apply
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: effective_from
        type: string
        source: input
        description: inclusive first calendar date the agreement covers, format YYYY-MM-DD
      - name: effective_to
        type: string
        source: input
        description: inclusive last calendar date the agreement covers, format YYYY-MM-DD
        constraints: "must be >= effective_from"
      - name: status
        type: enum
        source: system
        description: lifecycle state; only ACTIVE agreements participate in proration
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: enum
        source: computed
        description: why the agreement left ACTIVE
        default: NONE
        constraints: "one of {NONE, OPERATOR_SUSPENDED, CARRIER_SUSPENDED}"
      - name: factor_count
        type: integer
        source: computed
        description: number of ProrateFactor rows whose agreement_id equals this row's id
        default: 0

  - name: ProrateFactor
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ProrateAgreement.id; the agreement this sector rate belongs to"
      - name: origin
        type: string
        source: input
        description: three-letter origin station code, or the literal "*" wildcard
        constraints: "exactly 3 uppercase letters, or \"*\""
      - name: destination
        type: string
        source: input
        description: three-letter destination station code, or the literal "*" wildcard
        constraints: "exactly 3 uppercase letters, or \"*\""
      - name: class_of_service
        type: enum
        source: input
        description: cabin this factor applies to; never wildcarded
        constraints: "one of {ECONOMY, PREMIUM, BUSINESS, FIRST}"
      - name: factor_bp
        type: integer
        source: input
        description: straight-rate weight multiplier in basis points; required when the parent agreement_type == STRAIGHT_RATE, otherwise must be omitted
        constraints: "1 .. 100000"
      - name: flat_amount_minor
        type: integer
        source: input
        description: off-the-top flat allocation in the agreement's settlement_currency minor units; required when agreement_type == SPA_FLAT, otherwise must be omitted
        constraints: "> 0"
      - name: percent_bp
        type: integer
        source: input
        description: off-the-top share of the ticket fare in basis points; required when agreement_type == SPA_PERCENT, otherwise must be omitted
        constraints: "1 .. 10000"
      - name: specificity_score
        type: integer
        source: computed
        description: "2 when neither origin nor destination is \"*\"; 1 when exactly one is \"*\"; 0 when both are \"*\" — the sole ranking key when several factors match a coupon"
        default: 0

  - name: SettlementPeriod
    parent: null
    common_fields: true
    fields:
      - name: period_code
        type: string
        source: input
        description: clearinghouse period label, e.g. "2026-08-P1"
      - name: period_start
        type: datetime
        source: input
        description: inclusive start instant of the clearance window (ISO 8601 UTC)
      - name: period_end
        type: datetime
        source: input
        description: exclusive end instant of the clearance window (ISO 8601 UTC)
        constraints: "must be strictly after period_start"
      - name: submission_deadline
        type: datetime
        source: input
        description: instant after which a submitted invoice attracts the late-submission penalty
      - name: rate_fixing_date
        type: datetime
        source: input
        description: instant used to select the fixed exchange rate applied at close
      - name: settlement_currency
        type: enum
        source: input
        description: currency in which all clearinghouse balances for this period are expressed
        default: USD
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: status
        type: enum
        source: system
        description: clearance lifecycle state
        default: OPEN
        constraints: "one of {OPEN, CLOSED, SETTLED}"
      - name: cleared_invoice_count
        type: integer
        source: computed
        description: number of BillingInvoice rows moved from SUBMITTED to CLEARED by this period's close
        default: 0
      - name: closed_at
        type: datetime
        source: computed
        description: logical-clock instant at which close ran; null while OPEN
      - name: settled_at
        type: datetime
        source: computed
        description: logical-clock instant at which settle ran; null before SETTLED

  - name: ExchangeRate
    parent: null
    common_fields: false
    fields:
      - name: from_currency
        type: enum
        source: input
        description: source currency of the quote
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: to_currency
        type: enum
        source: input
        description: target currency of the quote
        constraints: "one of {USD, EUR, GBP, JPY}; must differ from from_currency"
      - name: effective_date
        type: datetime
        source: input
        description: instant from which this quote is the prevailing rate (ISO 8601 UTC)
      - name: rate_scaled
        type: integer
        source: input
        description: rate multiplied by 1000000 and stored as an integer (1.085 -> 1085000)
        constraints: "> 0"

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - name: ticket_number
        type: string
        source: input
        description: 13-character interline ticket number, globally unique
        constraints: "unique across all Ticket rows"
      - name: validating_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier that issued the ticket and collected the fare"
      - name: sale_currency
        type: enum
        source: input
        description: currency the fare was sold in
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: total_fare_minor
        type: integer
        source: input
        description: total prorate-able fare in sale_currency minor units
        constraints: "> 0"
      - name: issue_date
        type: datetime
        source: input
        description: instant of sale (ISO 8601 UTC)
      - name: proration_status
        type: enum
        source: system
        description: first of the ticket's two independent state axes
        default: UNPRORATED
        constraints: "one of {UNPRORATED, PROVISIONAL, FINAL, REPRORATION_REQUIRED}"
      - name: billing_status
        type: enum
        source: system
        description: second, independent state axis; evolves without regard to proration_status
        default: UNBILLED
        constraints: "one of {UNBILLED, BILLED, SETTLED, DISPUTED}"
      - name: coupon_count
        type: integer
        source: computed
        description: number of Coupon rows whose ticket_id equals this row's id
        default: 0
      - name: unallocated_residual_minor
        type: integer
        source: computed
        description: "total_fare_minor minus the sum of allocated_amount_minor over every Coupon of this ticket; the conservation slack bucket"
        default: 0
      - name: last_run_type
        type: enum
        source: computed
        description: run_type of the most recent ProrationRun for this ticket
        default: NONE
        constraints: "one of {NONE, PROVISIONAL, FINAL}"

  - name: Coupon
    parent: null
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket this flight coupon belongs to"
      - name: coupon_number
        type: integer
        source: input
        description: 1-based sequence position within the ticket
        constraints: "must equal ticket.coupon_count + 1 at creation time"
      - name: origin
        type: string
        source: input
        description: three-letter origin station code
        constraints: "exactly 3 uppercase letters"
      - name: destination
        type: string
        source: input
        description: three-letter destination station code
        constraints: "exactly 3 uppercase letters"
      - name: operating_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier that actually flies this sector and will bill for it"
      - name: class_of_service
        type: enum
        source: input
        description: cabin flown
        constraints: "one of {ECONOMY, PREMIUM, BUSINESS, FIRST}"
      - name: tpm_miles
        type: integer
        source: input
        description: ticketed point mileage of the sector
        constraints: "> 0"
      - name: coupon_status
        type: enum
        source: system
        description: coupon lifecycle state
        default: OPEN
        constraints: "one of {OPEN, FLOWN, VOID, ADJUSTED}"
      - name: flown_at
        type: datetime
        source: computed
        description: logical-clock instant recorded when the coupon was flown; null while OPEN or VOID
      - name: weight_units
        type: integer
        source: computed
        description: "round_half_up(tpm_miles * CLASS_WEIGHT_BP[class_of_service] * factor_bp / 10000), where factor_bp is 10000 unless a STRAIGHT_RATE ProrateFactor matched; recomputed on every proration run"
        default: 0
      - name: allocated_amount_minor
        type: integer
        source: computed
        description: revenue allocated to this coupon by the most recent ProrationRun, in the ticket's sale_currency minor units
        default: 0
      - name: allocation_basis
        type: enum
        source: computed
        description: which rule produced allocated_amount_minor
        default: UNALLOCATED
        constraints: "one of {UNALLOCATED, STRAIGHT_RATE, SPA_FLAT, SPA_PERCENT}"
      - name: ffp_miles_awarded
        type: integer
        source: computed
        description: "round_half_up(tpm_miles * FFP_MULTIPLIER_BP[class_of_service] / 10000), stamped at fly time"
        default: 0
      - name: ffp_accrual_cost_minor
        type: integer
        source: computed
        description: ESTIMATE-variant mileage cost owed to the operating carrier, stamped at fly time in settlement currency
        default: 0
      - name: ffp_tier
        type: enum
        source: computed
        description: mileage cost tier selected at fly time from the operating carrier's period_accrued_miles BEFORE this coupon's miles were added
        default: NONE
        constraints: "one of {NONE, TIER_A, TIER_B, TIER_C}"
      - name: billing_invoice_id
        type: string
        source: computed
        description: "FK -> BillingInvoice.id; set when the coupon is attached to an invoice draft, cleared back to null on invoice recall"
      - name: adjusted_amount_minor
        type: integer
        source: computed
        description: cumulative amount stripped from allocated_amount_minor by accepted or upheld rejection memos
        default: 0

  - name: ProrationRun
    parent: null
    common_fields: false
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket this run allocated"
      - name: run_type
        type: enum
        source: input
        description: which allocation variant was executed
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: pool_minor
        type: integer
        source: computed
        description: the full ticket.total_fare_minor entering the run
        default: 0
      - name: spa_total_minor
        type: integer
        source: computed
        description: sum of off-the-top special-prorate allocations taken before the straight-rate split; always 0 for PROVISIONAL runs
        default: 0
      - name: straight_rate_pool_minor
        type: integer
        source: computed
        description: pool_minor - spa_total_minor, the amount shared by weight
        default: 0
      - name: total_weight_units
        type: integer
        source: computed
        description: sum of weight_units over the coupons that took part in the straight-rate split
        default: 0
      - name: included_coupon_count
        type: integer
        source: computed
        description: number of coupons in this run's input set
        default: 0
      - name: rounding_residual_minor
        type: integer
        source: computed
        description: straight_rate_pool_minor minus the sum of the per-coupon rounded shares, before the residual is granted to the heaviest coupon; may be negative
        default: 0
      - name: allocated_total_minor
        type: integer
        source: computed
        description: sum of allocated_amount_minor written by this run
        default: 0
      - name: unallocated_residual_minor
        type: integer
        source: computed
        description: pool_minor - allocated_total_minor, non-zero only when no straight-rate coupon existed to absorb the residual pool
        default: 0

  - name: BillingInvoice
    parent: null
    common_fields: true
    fields:
      - name: settlement_period_id
        type: string
        source: input
        description: "FK -> SettlementPeriod.id; the clearance window this invoice belongs to"
      - name: billing_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the operating carrier claiming the money"
      - name: billed_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the validating carrier that must pay"
      - name: billing_currency
        type: enum
        source: input
        description: currency the coupons are denominated in; must equal every attached ticket's sale_currency
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: status
        type: enum
        source: system
        description: clearinghouse billing lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, CLEARED, PARTIALLY_REJECTED, FULLY_REJECTED, SETTLED}"
      - name: coupon_count
        type: integer
        source: computed
        description: number of Coupon rows whose billing_invoice_id equals this row's id
        default: 0
      - name: gross_billed_minor
        type: integer
        source: computed
        description: sum of allocated_amount_minor over the attached coupons, in billing_currency
        default: 0
      - name: ich_fee_bp
        type: integer
        source: computed
        description: clearinghouse handling-fee rate in basis points, selected from gross_billed_minor before any deduction
        default: 0
      - name: ich_handling_fee_minor
        type: integer
        source: computed
        description: round_half_up(gross_billed_minor * ich_fee_bp / 10000)
        default: 0
      - name: late_submission_penalty_minor
        type: integer
        source: computed
        description: round_half_up(gross_billed_minor * 200 / 10000) when submitted after the period's submission_deadline, else 0
        default: 0
      - name: total_claim_minor
        type: integer
        source: computed
        description: gross_billed_minor - ich_handling_fee_minor - late_submission_penalty_minor, in billing_currency
        default: 0
      - name: provisional_rate_scaled
        type: integer
        source: computed
        description: scaled FX rate chosen at submit time from the invoice's submitted_at instant
        default: 0
      - name: provisional_settlement_minor
        type: integer
        source: computed
        description: round_half_up(total_claim_minor * provisional_rate_scaled / 1000000), in the period's settlement_currency
        default: 0
      - name: fixed_rate_scaled
        type: integer
        source: computed
        description: scaled FX rate chosen at period close from the period's rate_fixing_date
        default: 0
      - name: final_settlement_minor
        type: integer
        source: computed
        description: round_half_up(total_claim_minor * fixed_rate_scaled / 1000000), in the period's settlement_currency
        default: 0
      - name: fx_variance_minor
        type: integer
        source: computed
        description: final_settlement_minor - provisional_settlement_minor; may be negative
        default: 0
      - name: disputed_amount_minor
        type: integer
        source: computed
        description: sum of amount_minor over this invoice's RejectionMemo rows with status IN {RAISED, COUNTERED, ARBITRATION}
        default: 0
      - name: rejected_amount_minor
        type: integer
        source: computed
        description: sum of amount_minor over this invoice's RejectionMemo rows with status IN {ACCEPTED, RESOLVED_UPHELD}
        default: 0
      - name: net_billed_minor
        type: integer
        source: computed
        description: total_claim_minor - rejected_amount_minor, in billing_currency
        default: 0
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the submit call; null while DRAFT
      - name: cleared_at
        type: datetime
        source: computed
        description: logical-clock instant at which the period close cleared this invoice; anchors the 45-day rejection-memo window

  - name: RejectionMemo
    parent: null
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> BillingInvoice.id; the cleared invoice being rejected"
      - name: coupon_id
        type: string
        source: input
        description: "FK -> Coupon.id; the single coupon whose allocation is contested; must already be attached to invoice_id"
      - name: raised_by_carrier_id
        type: string
        source: computed
        description: "FK -> Carrier.id; copied from the invoice's billed_carrier_id at creation"
      - name: stage
        type: integer
        source: computed
        description: negotiation round, 1 on creation, incremented by each re-reject
        default: 1
        constraints: "1 .. 3"
      - name: amount_minor
        type: integer
        source: input
        description: contested amount in the invoice's billing_currency
        constraints: "> 0"
      - name: reason_code
        type: enum
        source: input
        description: IATA-style rejection reason
        constraints: "one of {PRORATE_FACTOR_DISPUTE, SPA_NOT_APPLIED, FARE_BASIS_ERROR, DUPLICATE_BILLING, CURRENCY_ERROR}"
      - name: status
        type: enum
        source: system
        description: memo lifecycle state
        default: RAISED
        constraints: "one of {RAISED, COUNTERED, ACCEPTED, WITHDRAWN, ARBITRATION, RESOLVED_UPHELD, RESOLVED_DENIED}"
      - name: counter_amount_minor
        type: integer
        source: computed
        description: amount the billing carrier concedes in its counter-billing; 0 until countered
        default: 0
      - name: counter_reason
        type: string
        source: computed
        description: free-text counter justification recorded by the billing carrier
      - name: raised_at
        type: datetime
        source: computed
        description: logical-clock instant of the original raise; the aging anchor, never reset by re-rejects
      - name: resolved_at
        type: datetime
        source: computed
        description: logical-clock instant at which the memo reached ACCEPTED, WITHDRAWN, RESOLVED_UPHELD or RESOLVED_DENIED
      - name: age_days
        type: integer
        source: computed
        description: floor((current logical clock - raised_at) / 86400 seconds) while unresolved; frozen at resolution
        default: 0
      - name: aging_bucket
        type: enum
        source: computed
        description: aging classification derived from age_days
        default: CURRENT
        constraints: "one of {CURRENT, AGED_30, AGED_60, AGED_90}"
      - name: settlement_impact_minor
        type: integer
        source: computed
        description: round_half_up(amount_minor * invoice.fixed_rate_scaled / 1000000) written when the memo is accepted or upheld
        default: 0

  - name: AuditSample
    parent: null
    common_fields: true
    fields:
      - name: auditing_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the carrier running the undercharge audit and collecting any recovery"
      - name: audited_carrier_id
        type: string
        source: input
        description: "FK -> Carrier.id; the operating carrier whose coupon allocations are sampled"
      - name: settlement_period_id
        type: string
        source: input
        description: "FK -> SettlementPeriod.id; the closed period whose flown coupons form the population"
      - name: claim_currency
        type: enum
        source: input
        description: currency of the sampled coupons and of any resulting claim
        constraints: "one of {USD, EUR, GBP, JPY}"
      - name: sample_coupon_ids
        type: array
        source: input
        description: explicit list of Coupon ids drawn into the sample; each element must be a member of the derived population
        constraints: "1 .. 50 elements, no duplicates"
      - name: status
        type: enum
        source: system
        description: audit lifecycle state
        default: DRAWN
        constraints: "one of {DRAWN, IN_REVIEW, CLOSED_IMMATERIAL, CLAIM_RAISED, CLAIM_ACCEPTED, CLAIM_DENIED}"
      - name: population_coupon_count
        type: integer
        source: computed
        description: number of coupons in the derived audit population
        default: 0
      - name: population_allocated_minor
        type: integer
        source: computed
        description: sum of allocated_amount_minor over the derived population
        default: 0
      - name: sampled_coupon_count
        type: integer
        source: computed
        description: number of coupons named in sample_coupon_ids
        default: 0
      - name: sampled_allocated_minor
        type: integer
        source: computed
        description: sum of allocated_amount_minor over the sampled coupons, captured at draw time
        default: 0
      - name: sampled_undercharge_minor
        type: integer
        source: computed
        description: running sum of per-finding undercharges recorded against the sample
        default: 0
      - name: findings_count
        type: integer
        source: computed
        description: number of record-finding calls accepted against this sample
        default: 0
      - name: undercharge_ratio_bp
        type: integer
        source: computed
        description: round_half_up(sampled_undercharge_minor * 10000 / sampled_allocated_minor), written at close
        default: 0
      - name: coverage_bp
        type: integer
        source: computed
        description: round_half_up(sampled_allocated_minor * 10000 / population_allocated_minor), written at close
        default: 0
      - name: haircut_bp
        type: integer
        source: computed
        description: confidence haircut selected from coverage_bp, written at close
        default: 0
      - name: extrapolated_gross_minor
        type: integer
        source: computed
        description: round_half_up(sampled_undercharge_minor * population_allocated_minor / sampled_allocated_minor), written at close
        default: 0
      - name: claim_amount_minor
        type: integer
        source: computed
        description: final recovery claim in claim_currency after cap and haircut; 0 when the sample closes immaterial
        default: 0
      - name: claim_settlement_minor
        type: integer
        source: computed
        description: claim_amount_minor converted into the period's settlement_currency at the audited period's rate_fixing_date rate
        default: 0
      - name: closed_at
        type: datetime
        source: computed
        description: logical-clock instant at which the sample was closed

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:

  # ------------------------------------------------------------------ Carrier
  - entity: Carrier
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /interline/carriers/{id}/suspend"
        actor: ClearinghouseOperator
        preconditions:
          - "carrier.status == ACTIVE"
        side_effects:
          - "sets status = SUSPENDED"
          - "every ProrateAgreement with status == ACTIVE naming this carrier as issuing_carrier_id or partner_carrier_id moves to SUSPENDED with suspension_reason = CARRIER_SUSPENDED"
          - "increments Carrier.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade hop 4 of POST /interline/settlement-periods/{id}/close"
        actor: system
        preconditions:
          - "carrier.status == ACTIVE"
          - "(settled_payable_minor - settled_receivable_minor) > credit_limit_minor after hop 3 moved the settled balances"
        side_effects:
          - "sets status = SUSPENDED"
          - "hop 5 follows on the carrier's ACTIVE agreements"
          - "increments Carrier.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /interline/carriers/{id}/reinstate"
        actor: ClearinghouseOperator
        preconditions:
          - "carrier.status == SUSPENDED"
        side_effects:
          - "sets status = ACTIVE"
          - "agreements suspended with suspension_reason == CARRIER_SUSPENDED are NOT reactivated; each must be activated again explicitly"
          - "increments Carrier.version by 1"
        note: "ACTIVE <-> SUSPENDED is a cycle; a carrier may be suspended and reinstated any number of times."

  # ---------------------------------------------------------------- Agreement
  - entity: ProrateAgreement
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /interline/prorate-agreements/{id}/activate"
        actor: ClearinghouseOperator
        preconditions:
          - "agreement.status == DRAFT"
          - "Carrier[issuing_carrier_id].status == ACTIVE and Carrier[partner_carrier_id].status == ACTIVE"
          - "no other ProrateAgreement with the same (issuing_carrier_id, partner_carrier_id) ordered pair and status IN {ACTIVE, SUSPENDED} has a closed-closed date overlap with [effective_from, effective_to]"
        side_effects:
          - "sets status = ACTIVE"
          - "sets suspension_reason = NONE"
          - "increments ProrateAgreement.version by 1"
        note: "Segregation of duties — the RevenueAccountant that drafted the agreement can never activate it."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /interline/prorate-agreements/{id}/suspend"
        actor: ClearinghouseOperator
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "sets status = SUSPENDED"
          - "sets suspension_reason = OPERATOR_SUSPENDED"
          - "increments ProrateAgreement.version by 1"
          - "coupons prorated after this point fall back to the STRAIGHT_RATE default because the factor selector only accepts agreements with status == ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: cascade hop 5 of POST /interline/settlement-periods/{id}/close, fired because a Carrier transitioned ACTIVE -> SUSPENDED in hop 4"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "agreement.partner_carrier_id == the Carrier that just moved to SUSPENDED, or agreement.issuing_carrier_id == that Carrier"
        side_effects:
          - "sets status = SUSPENDED"
          - "sets suspension_reason = CARRIER_SUSPENDED"
          - "increments ProrateAgreement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /interline/prorate-agreements/{id}/activate"
        actor: ClearinghouseOperator
        preconditions:
          - "agreement.status == SUSPENDED"
          - "Carrier[issuing_carrier_id].status == ACTIVE and Carrier[partner_carrier_id].status == ACTIVE"
          - "the closed-closed overlap check above still passes against the other ACTIVE/SUSPENDED agreements for the pair"
        side_effects:
          - "sets status = ACTIVE"
          - "sets suspension_reason = NONE"
          - "increments ProrateAgreement.version by 1"
        note: "ACTIVE <-> SUSPENDED is a genuine cycle: an agreement may be reinstated any number of times."

  # ------------------------------------------------------------------- Period
  - entity: SettlementPeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /interline/settlement-periods/{id}/close"
        actor: ClearinghouseOperator
        preconditions:
          - "period.status == OPEN"
        side_effects:
          - "sets status = CLOSED, closed_at = current logical clock"
          - "CASCADE HOP 2 — for every BillingInvoice with settlement_period_id == this period and status == SUBMITTED, processed in ascending created_at: selects fixed_rate_scaled per calculation `fx_rate_selection` using this period's rate_fixing_date, writes final_settlement_minor and fx_variance_minor, sets cleared_at = closed_at and status = CLEARED; increments BillingInvoice.version by 1; increments this period's cleared_invoice_count by 1"
          - "CASCADE HOP 3 — because each of those invoices became CLEARED, its billing carrier's pending_receivable_minor is reduced by provisional_settlement_minor and settled_receivable_minor increased by final_settlement_minor, and its billed carrier's pending_payable_minor is reduced by provisional_settlement_minor and settled_payable_minor increased by final_settlement_minor; net_position_minor is recomputed on both carriers; increments Carrier.version by 1 on both"
          - "CASCADE HOP 4 — because a carrier's settled balances moved, any Carrier whose (settled_payable_minor - settled_receivable_minor) is now strictly greater than its credit_limit_minor and whose status == ACTIVE transitions to SUSPENDED"
          - "CASCADE HOP 5 — because that carrier became SUSPENDED, every ProrateAgreement with status == ACTIVE naming it as issuing_carrier_id or partner_carrier_id transitions to SUSPENDED with suspension_reason = CARRIER_SUSPENDED"
          - "FFP TRUE-UP (independent of the cascade above) — for every Carrier that operated at least one Coupon with coupon_status IN {FLOWN, ADJUSTED} and flown_at in [period_start, period_end), runs calculation `ffp_mileage_cost` variant PERIOD_TRUE_UP and writes period_ffp_cost_trued_up_minor and ffp_true_up_delta_minor"
          - "increments SettlementPeriod.version by 1"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /interline/settlement-periods/{id}/settle"
        actor: ClearinghouseOperator
        preconditions:
          - "period.status == CLOSED"
        side_effects:
          - "sets status = SETTLED, settled_at = current logical clock"
          - "every BillingInvoice with settlement_period_id == this period and status IN {CLEARED, PARTIALLY_REJECTED, FULLY_REJECTED} transitions to SETTLED"
          - "every Ticket owning a Coupon on one of those invoices and whose billing_status == BILLED transitions to billing_status SETTLED; tickets whose billing_status == DISPUTED are left untouched"
          - "resets period_accrued_miles and period_ffp_cost_estimate_minor to 0 on every Carrier"
          - "increments SettlementPeriod.version by 1"

  # ------------------------------------------- Ticket, axis 1: proration_status
  - entity: Ticket
    state_field: proration_status
    initial_state: UNPRORATED
    terminal_states: []
    transitions:
      - from: UNPRORATED
        to: PROVISIONAL
        trigger: "POST /interline/tickets/{id}/prorate with run_type == PROVISIONAL"
        actor: RevenueAccountant
        preconditions:
          - "ticket.proration_status IN {UNPRORATED, PROVISIONAL, FINAL, REPRORATION_REQUIRED}"
          - "at least one Coupon of the ticket has coupon_status IN {OPEN, FLOWN}"
          - "expected_ticket_version equals ticket.version"
        side_effects:
          - "creates a ProrationRun with run_type = PROVISIONAL per calculation `coupon_revenue_allocation`"
          - "writes allocated_amount_minor, allocation_basis = STRAIGHT_RATE and weight_units on every included coupon, and 0 / UNALLOCATED on every excluded coupon"
          - "recomputes ticket.unallocated_residual_minor, sets last_run_type = PROVISIONAL"
          - "increments Ticket.version by 1"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /interline/tickets/{id}/prorate with run_type == FINAL"
        actor: RevenueAccountant
        preconditions:
          - "ticket.proration_status IN {UNPRORATED, PROVISIONAL, FINAL, REPRORATION_REQUIRED}"
          - "at least one Coupon of the ticket has coupon_status IN {FLOWN, ADJUSTED}"
          - "the sum of off-the-top special-prorate amounts does not exceed ticket.total_fare_minor"
          - "expected_ticket_version equals ticket.version"
        side_effects:
          - "creates a ProrationRun with run_type = FINAL per calculation `coupon_revenue_allocation`"
          - "writes allocated_amount_minor and allocation_basis IN {SPA_FLAT, SPA_PERCENT, STRAIGHT_RATE} on every included coupon, and 0 / UNALLOCATED on every excluded coupon"
          - "recomputes ticket.unallocated_residual_minor, sets last_run_type = FINAL"
          - "increments Ticket.version by 1"
        note: "UNPRORATED -> FINAL and REPRORATION_REQUIRED -> FINAL use the identical trigger, preconditions and side effects; a FINAL run may be repeated any number of times, each superseding the previous allocation."
      - from: FINAL
        to: REPRORATION_REQUIRED
        trigger: "system: cascade hop 4 of POST /interline/rejection-memos/{id}/accept or /arbitrate with ruling == UPHELD, fired because one of this ticket's coupons moved to coupon_status ADJUSTED in hop 3"
        actor: system
        preconditions:
          - "the adjusted coupon's ticket_id equals this ticket's id"
        side_effects:
          - "sets proration_status = REPRORATION_REQUIRED"
          - "sets billing_status = DISPUTED"
          - "CASCADE HOP 5 — because the ticket entered REPRORATION_REQUIRED, Carrier[validating_carrier_id].open_reproration_count is incremented by 1, and if the new count is >= 3 the same carrier's audit_flag is set to true"
          - "increments Ticket.version by 1"
      - from: REPRORATION_REQUIRED
        to: UNPRORATED
        trigger: "POST /interline/tickets/{id}/void-proration"
        actor: RevenueAccountant
        preconditions:
          - "ticket.proration_status IN {PROVISIONAL, FINAL, REPRORATION_REQUIRED}"
          - "expected_ticket_version equals ticket.version"
        side_effects:
          - "sets allocated_amount_minor = 0 and allocation_basis = UNALLOCATED on every Coupon of the ticket"
          - "sets ticket.unallocated_residual_minor = ticket.total_fare_minor, last_run_type = NONE, proration_status = UNPRORATED"
          - "leaves billing_status untouched — the two axes never read each other"
          - "increments Ticket.version by 1"
        note: "PROVISIONAL -> UNPRORATED and FINAL -> UNPRORATED are the same transition; this is the compensating action for calculation `coupon_revenue_allocation`."

  # --------------------------------------------- Ticket, axis 2: billing_status
  - entity: Ticket
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "system: side effect of POST /interline/billing-invoices/{id}/submit"
        actor: system
        preconditions:
          - "the ticket owns at least one Coupon whose billing_invoice_id equals the submitted invoice's id"
        side_effects:
          - "sets billing_status = BILLED"
          - "increments Ticket.version by 1"
      - from: BILLED
        to: UNBILLED
        trigger: "system: side effect of POST /interline/billing-invoices/{id}/recall"
        actor: system
        preconditions:
          - "no Coupon of this ticket remains attached to any BillingInvoice with status IN {SUBMITTED, CLEARED, PARTIALLY_REJECTED, FULLY_REJECTED, SETTLED} after the recall detached this invoice's coupons"
        side_effects:
          - "sets billing_status = UNBILLED"
          - "increments Ticket.version by 1"
      - from: BILLED
        to: SETTLED
        trigger: "system: side effect of POST /interline/settlement-periods/{id}/settle"
        actor: system
        preconditions:
          - "ticket.billing_status == BILLED"
        side_effects:
          - "sets billing_status = SETTLED"
          - "increments Ticket.version by 1"
      - from: BILLED
        to: DISPUTED
        trigger: "system: cascade hop 4 of POST /interline/rejection-memos/{id}/accept"
        actor: system
        preconditions:
          - "one of this ticket's coupons moved to coupon_status ADJUSTED in hop 3"
        side_effects:
          - "sets billing_status = DISPUTED"
          - "increments Ticket.version by 1"
        note: "The proration axis moves to REPRORATION_REQUIRED in the same hop; the two axes are written together here but are independently reachable — a ticket can be FINAL+DISPUTED, REPRORATION_REQUIRED+BILLED (memo upheld on a ticket recalled from billing) or UNPRORATED+SETTLED."

  # ------------------------------------------------------------------- Coupon
  - entity: Coupon
    state_field: coupon_status
    initial_state: OPEN
    terminal_states: [VOID]
    transitions:
      - from: OPEN
        to: FLOWN
        trigger: "POST /interline/coupons/{id}/fly"
        actor: RevenueAccountant
        preconditions:
          - "coupon.coupon_status == OPEN"
          - "Carrier[coupon.operating_carrier_id].status == ACTIVE"
          - "the acting RevenueAccountant's X-User-ID equals Ticket[coupon.ticket_id].validating_carrier_id"
        side_effects:
          - "sets coupon_status = FLOWN, flown_at = current logical clock"
          - "writes ffp_miles_awarded, ffp_tier and ffp_accrual_cost_minor per calculation `ffp_mileage_cost` variant ESTIMATE, using Carrier[operating_carrier_id].period_accrued_miles as it stands BEFORE this coupon"
          - "adds ffp_miles_awarded to Carrier[operating_carrier_id].period_accrued_miles and ffp_accrual_cost_minor to its period_ffp_cost_estimate_minor; increments Carrier.version by 1"
          - "increments Coupon.version by 1; does NOT touch Ticket.version"
      - from: OPEN
        to: VOID
        trigger: "POST /interline/coupons/{id}/void"
        actor: RevenueAccountant
        preconditions:
          - "coupon.coupon_status == OPEN"
          - "the acting RevenueAccountant's X-User-ID equals Ticket[coupon.ticket_id].validating_carrier_id"
        side_effects:
          - "sets coupon_status = VOID, allocated_amount_minor = 0, allocation_basis = UNALLOCATED"
          - "recomputes Ticket.unallocated_residual_minor and increments Ticket.version by 1"
          - "increments Coupon.version by 1"
      - from: FLOWN
        to: ADJUSTED
        trigger: "system: cascade hop 3 of POST /interline/rejection-memos/{id}/accept or /arbitrate with ruling == UPHELD"
        actor: system
        preconditions:
          - "the invoice's rejected_amount_minor increased in hop 2"
        side_effects:
          - "reduces allocated_amount_minor by memo.amount_minor and adds the same figure to adjusted_amount_minor"
          - "sets coupon_status = ADJUSTED"
          - "adds memo.amount_minor to Ticket.unallocated_residual_minor, preserving the fare-conservation identity"
          - "increments Coupon.version by 1"
          - "hop 4 follows on the owning Ticket"
      - from: ADJUSTED
        to: ADJUSTED
        trigger: "system: cascade hop 3 of a second accepted or upheld RejectionMemo on the same coupon"
        actor: system
        preconditions:
          - "coupon.coupon_status == ADJUSTED"
          - "memo.amount_minor <= coupon.allocated_amount_minor"
        side_effects:
          - "same field writes as FLOWN -> ADJUSTED; the coupon may be adjusted repeatedly until allocated_amount_minor reaches 0"

  # ------------------------------------------------------------------ Invoice
  - entity: BillingInvoice
    state_field: status
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /interline/billing-invoices/{id}/submit"
        actor: BillingAgent
        preconditions:
          - "invoice.status == DRAFT"
          - "SettlementPeriod[settlement_period_id].status == OPEN"
          - "Carrier[billing_carrier_id].status == ACTIVE"
          - "the acting BillingAgent's X-User-ID equals invoice.billing_carrier_id"
          - "an ExchangeRate is selectable for (billing_currency -> period.settlement_currency) at the current logical clock, or billing_currency == period.settlement_currency"
          - "Carrier[billed_carrier_id] would not exceed credit_limit_minor once provisional_settlement_minor is added to its payable side"
        side_effects:
          - "writes gross_billed_minor, ich_fee_bp, ich_handling_fee_minor, late_submission_penalty_minor, total_claim_minor, net_billed_minor per calculation `invoice_claim_build`"
          - "writes provisional_rate_scaled and provisional_settlement_minor per calculation `fx_rate_selection` anchored on the current logical clock"
          - "sets status = SUBMITTED, submitted_at = current logical clock"
          - "adds provisional_settlement_minor to Carrier[billing_carrier_id].pending_receivable_minor and to Carrier[billed_carrier_id].pending_payable_minor; recomputes net_position_minor on both"
          - "moves every Ticket owning an attached coupon from billing_status UNBILLED to BILLED"
          - "increments BillingInvoice.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /interline/billing-invoices/{id}/recall"
        actor: BillingAgent
        preconditions:
          - "invoice.status == SUBMITTED"
          - "SettlementPeriod[settlement_period_id].status == OPEN"
          - "the acting BillingAgent's X-User-ID equals invoice.billing_carrier_id"
        side_effects:
          - "subtracts provisional_settlement_minor from Carrier[billing_carrier_id].pending_receivable_minor and from Carrier[billed_carrier_id].pending_payable_minor; recomputes net_position_minor on both"
          - "resets gross_billed_minor, ich_fee_bp, ich_handling_fee_minor, late_submission_penalty_minor, total_claim_minor, net_billed_minor, provisional_rate_scaled, provisional_settlement_minor and submitted_at to their defaults"
          - "detaches every attached coupon by setting Coupon.billing_invoice_id = null and invoice.coupon_count = 0"
          - "moves every affected Ticket from billing_status BILLED back to UNBILLED"
          - "sets status = DRAFT; increments BillingInvoice.version by 1"
        note: "This is the compensating action for the clearinghouse zero-sum invariant."
      - from: SUBMITTED
        to: CLEARED
        trigger: "system: cascade hop 2 of POST /interline/settlement-periods/{id}/close"
        actor: system
        preconditions:
          - "invoice.status == SUBMITTED"
          - "an ExchangeRate is selectable for (billing_currency -> period.settlement_currency) at period.rate_fixing_date, or the currencies are equal"
        side_effects:
          - "writes fixed_rate_scaled, final_settlement_minor, fx_variance_minor; sets cleared_at and status = CLEARED"
          - "hop 3 follows on both carriers' balances"
          - "increments BillingInvoice.version by 1"
      - from: CLEARED
        to: PARTIALLY_REJECTED
        trigger: "system: cascade hop 2 of POST /interline/rejection-memos/{id}/accept or /arbitrate with ruling == UPHELD"
        actor: system
        preconditions:
          - "the memo reached ACCEPTED or RESOLVED_UPHELD in hop 1"
          - "rejected_amount_minor + memo.amount_minor < total_claim_minor"
        side_effects:
          - "adds memo.amount_minor to rejected_amount_minor, removes it from disputed_amount_minor, recomputes net_billed_minor"
          - "writes memo.settlement_impact_minor = round_half_up(memo.amount_minor * fixed_rate_scaled / 1000000) and subtracts it from Carrier[billing_carrier_id].settled_receivable_minor and from Carrier[billed_carrier_id].settled_payable_minor; recomputes net_position_minor on both"
          - "sets status = PARTIALLY_REJECTED; hop 3 follows on the contested Coupon"
          - "increments BillingInvoice.version by 1"
      - from: CLEARED
        to: FULLY_REJECTED
        trigger: "system: cascade hop 2 of POST /interline/rejection-memos/{id}/accept or /arbitrate with ruling == UPHELD"
        actor: system
        preconditions:
          - "the memo reached ACCEPTED or RESOLVED_UPHELD in hop 1"
          - "rejected_amount_minor + memo.amount_minor >= total_claim_minor"
        side_effects:
          - "identical field writes to the PARTIALLY_REJECTED branch, plus status = FULLY_REJECTED"
        note: "Branch point: the two outbound edges from CLEARED differ only by the >= comparison against total_claim_minor, and carry the same hop-3 continuation."
      - from: PARTIALLY_REJECTED
        to: PARTIALLY_REJECTED
        trigger: "system: cascade hop 2 of a further accepted or upheld memo on the same invoice"
        actor: system
        preconditions:
          - "rejected_amount_minor + memo.amount_minor < total_claim_minor"
        side_effects:
          - "same writes as the CLEARED -> PARTIALLY_REJECTED edge"
      - from: PARTIALLY_REJECTED
        to: FULLY_REJECTED
        trigger: "system: cascade hop 2 of a further accepted or upheld memo on the same invoice"
        actor: system
        preconditions:
          - "rejected_amount_minor + memo.amount_minor >= total_claim_minor"
        side_effects:
          - "same writes as the CLEARED -> FULLY_REJECTED edge"
      - from: CLEARED
        to: SETTLED
        trigger: "system: side effect of POST /interline/settlement-periods/{id}/settle"
        actor: system
        preconditions:
          - "invoice.status IN {CLEARED, PARTIALLY_REJECTED, FULLY_REJECTED}"
        side_effects:
          - "sets status = SETTLED; increments BillingInvoice.version by 1"
        note: "PARTIALLY_REJECTED -> SETTLED and FULLY_REJECTED -> SETTLED are the same transition; the fork rejoins here."

  # -------------------------------------------------------------------- Memo
  - entity: RejectionMemo
    state_field: status
    initial_state: RAISED
    terminal_states: [ACCEPTED, WITHDRAWN, RESOLVED_UPHELD, RESOLVED_DENIED]
    transitions:
      - from: RAISED
        to: COUNTERED
        trigger: "POST /interline/rejection-memos/{id}/counter"
        actor: BillingAgent
        preconditions:
          - "memo.status == RAISED"
          - "the acting BillingAgent's X-User-ID equals BillingInvoice[memo.invoice_id].billing_carrier_id"
          - "counter_amount_minor <= memo.amount_minor"
        side_effects:
          - "sets status = COUNTERED, counter_amount_minor and counter_reason"
          - "leaves invoice.disputed_amount_minor unchanged"
          - "increments RejectionMemo.version by 1"
      - from: COUNTERED
        to: RAISED
        trigger: "POST /interline/rejection-memos/{id}/re-reject"
        actor: BillingAgent
        preconditions:
          - "memo.status == COUNTERED"
          - "memo.stage < 3"
          - "the acting BillingAgent's X-User-ID equals BillingInvoice[memo.invoice_id].billed_carrier_id"
          - "current logical clock - BillingInvoice[memo.invoice_id].cleared_at <= 45 days"
          - "expected_invoice_version equals BillingInvoice[memo.invoice_id].version"
        side_effects:
          - "sets status = RAISED, increments stage by 1, overwrites amount_minor and reason_code, resets counter_amount_minor to 0"
          - "adjusts invoice.disputed_amount_minor by the delta between the old and new amount_minor"
          - "leaves raised_at untouched so aging keeps running from the original raise"
          - "increments RejectionMemo.version by 1 and BillingInvoice.version by 1"
        note: "RAISED -> COUNTERED -> RAISED is the negotiation cycle; stage caps the loop at 3 rounds."
      - from: RAISED
        to: ACCEPTED
        trigger: "POST /interline/rejection-memos/{id}/accept"
        actor: BillingAgent
        preconditions:
          - "memo.status == RAISED"
          - "the acting BillingAgent's X-User-ID equals BillingInvoice[memo.invoice_id].billing_carrier_id"
          - "expected_invoice_version equals BillingInvoice[memo.invoice_id].version"
        side_effects:
          - "CASCADE HOP 1 — sets status = ACCEPTED, resolved_at = current logical clock, freezes age_days and aging_bucket"
          - "CASCADE HOP 2 — because the memo became ACCEPTED, the invoice moves to PARTIALLY_REJECTED or FULLY_REJECTED and both carriers' settled balances drop by settlement_impact_minor"
          - "CASCADE HOP 3 — because the invoice's rejected_amount_minor increased, the contested Coupon loses memo.amount_minor from allocated_amount_minor and moves to coupon_status ADJUSTED"
          - "CASCADE HOP 4 — because that coupon changed, its Ticket moves to proration_status REPRORATION_REQUIRED and billing_status DISPUTED"
          - "CASCADE HOP 5 — because the ticket entered REPRORATION_REQUIRED, its validating carrier's open_reproration_count is incremented and audit_flag is set once the count reaches 3"
          - "increments RejectionMemo.version by 1"
      - from: RAISED
        to: WITHDRAWN
        trigger: "POST /interline/rejection-memos/{id}/withdraw"
        actor: BillingAgent
        preconditions:
          - "memo.status IN {RAISED, COUNTERED}"
          - "the acting BillingAgent's X-User-ID equals BillingInvoice[memo.invoice_id].billed_carrier_id"
          - "expected_invoice_version equals BillingInvoice[memo.invoice_id].version"
        side_effects:
          - "sets status = WITHDRAWN, resolved_at = current logical clock"
          - "subtracts memo.amount_minor from invoice.disputed_amount_minor; no balance, coupon or ticket effect"
          - "increments RejectionMemo.version by 1 and BillingInvoice.version by 1"
        note: "COUNTERED -> WITHDRAWN is the same transition."
      - from: RAISED
        to: ARBITRATION
        trigger: "POST /interline/rejection-memos/{id}/escalate"
        actor: BillingAgent
        preconditions:
          - "memo.status IN {RAISED, COUNTERED}"
          - "memo.stage == 3 OR memo.age_days >= 90"
          - "the acting BillingAgent's X-User-ID equals BillingInvoice[memo.invoice_id].billed_carrier_id or .billing_carrier_id"
        side_effects:
          - "sets status = ARBITRATION"
          - "increments RejectionMemo.version by 1"
        note: "COUNTERED -> ARBITRATION is the same transition."
      - from: ARBITRATION
        to: RESOLVED_UPHELD
        trigger: "POST /interline/rejection-memos/{id}/arbitrate with ruling == UPHELD"
        actor: ClearinghouseOperator
        preconditions:
          - "memo.status == ARBITRATION"
        side_effects:
          - "sets status = RESOLVED_UPHELD, resolved_at = current logical clock"
          - "fires the identical hop 2 -> hop 5 cascade described on RAISED -> ACCEPTED"
          - "increments RejectionMemo.version by 1"
      - from: ARBITRATION
        to: RESOLVED_DENIED
        trigger: "POST /interline/rejection-memos/{id}/arbitrate with ruling == DENIED"
        actor: ClearinghouseOperator
        preconditions:
          - "memo.status == ARBITRATION"
        side_effects:
          - "sets status = RESOLVED_DENIED, resolved_at = current logical clock"
          - "subtracts memo.amount_minor from invoice.disputed_amount_minor; no balance, coupon or ticket effect"
          - "increments RejectionMemo.version by 1 and BillingInvoice.version by 1"
        note: "Branch point: UPHELD carries the full five-hop cascade, DENIED carries none."

  # ------------------------------------------------------------- Audit sample
  - entity: AuditSample
    state_field: status
    initial_state: DRAWN
    terminal_states: [CLOSED_IMMATERIAL, CLAIM_ACCEPTED, CLAIM_DENIED]
    transitions:
      - from: DRAWN
        to: IN_REVIEW
        trigger: "POST /interline/audit-samples/{id}/record-finding"
        actor: InterlineAuditor
        preconditions:
          - "sample.status IN {DRAWN, IN_REVIEW}"
          - "coupon_id is a member of sample.sample_coupon_ids"
          - "the acting InterlineAuditor's X-User-ID equals sample.auditing_carrier_id"
        side_effects:
          - "adds max(0, correct_amount_minor - coupon.allocated_amount_minor) to sampled_undercharge_minor"
          - "increments findings_count by 1 and sets status = IN_REVIEW"
          - "increments AuditSample.version by 1"
        note: "IN_REVIEW -> IN_REVIEW is the same transition for the second and later findings."
      - from: IN_REVIEW
        to: CLOSED_IMMATERIAL
        trigger: "POST /interline/audit-samples/{id}/close"
        actor: InterlineAuditor
        preconditions:
          - "sample.status == IN_REVIEW"
          - "undercharge_ratio_bp < 200"
        side_effects:
          - "writes undercharge_ratio_bp, coverage_bp, haircut_bp, extrapolated_gross_minor per calculation `undercharge_extrapolation`"
          - "sets claim_amount_minor = 0, claim_settlement_minor = 0, closed_at, status = CLOSED_IMMATERIAL"
          - "increments AuditSample.version by 1"
      - from: IN_REVIEW
        to: CLAIM_RAISED
        trigger: "POST /interline/audit-samples/{id}/close"
        actor: InterlineAuditor
        preconditions:
          - "sample.status == IN_REVIEW"
          - "undercharge_ratio_bp >= 200"
        side_effects:
          - "writes undercharge_ratio_bp, coverage_bp, haircut_bp, extrapolated_gross_minor, claim_amount_minor and claim_settlement_minor per calculation `undercharge_extrapolation`"
          - "sets closed_at and status = CLAIM_RAISED"
          - "increments AuditSample.version by 1"
        note: "Branch point: the two close edges are separated only by the >= 200 basis-point materiality comparison."
      - from: CLAIM_RAISED
        to: CLAIM_ACCEPTED
        trigger: "POST /interline/audit-samples/{id}/claim-decision with decision == ACCEPT"
        actor: BillingAgent
        preconditions:
          - "sample.status == CLAIM_RAISED"
          - "the acting BillingAgent's X-User-ID equals sample.audited_carrier_id"
        side_effects:
          - "adds claim_settlement_minor to Carrier[auditing_carrier_id].settled_receivable_minor and to Carrier[audited_carrier_id].settled_payable_minor; recomputes net_position_minor on both; increments Carrier.version by 1 on both"
          - "sets status = CLAIM_ACCEPTED; increments AuditSample.version by 1"
        note: "Segregation of duties — the auditing carrier may never decide its own claim."
      - from: CLAIM_RAISED
        to: CLAIM_DENIED
        trigger: "POST /interline/audit-samples/{id}/claim-decision with decision == DENY"
        actor: BillingAgent
        preconditions:
          - "sample.status == CLAIM_RAISED"
          - "the acting BillingAgent's X-User-ID equals sample.audited_carrier_id"
        side_effects:
          - "sets status = CLAIM_DENIED; no balance movement"
          - "increments AuditSample.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on the parent's version — §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: memo-raise-stale-invoice
    parent_entity: BillingInvoice
    write_endpoint: "POST /interline/rejection-memos"
    occ_field: "expected_invoice_version"
    description: |
      Raising a RejectionMemo against a BillingInvoice whose version has advanced
      since the client last read it is rejected. A second memo on the same invoice
      is legitimate business (each memo contests a different coupon and reduces the
      remaining disputable headroom), so the later writer's request would otherwise
      succeed against a view of disputed_amount_minor that no longer holds.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

  - rule_id: prorate-run-stale-ticket
    parent_entity: Ticket
    write_endpoint: "POST /interline/tickets/{id}/prorate"
    occ_field: "expected_ticket_version"
    description: |
      Creating a ProrationRun against a Ticket whose version has advanced since the
      client last read it is rejected. A new run legitimately supersedes the previous
      allocation, so a writer holding a stale view of the coupon set (a coupon voided
      or adjusted in the meantime) would silently overwrite a newer allocation.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: prorate_factor_selection
    trigger: "runs once per candidate coupon inside every `coupon_revenue_allocation` run, before any money is moved"
    algorithm: selector_policy
    formula: |
      # Returns at most one (agreement, factor) pair for a coupon. Pure lookup; no side effects.
      # (a) ELIGIBILITY FILTER — the candidate set is every ProrateFactor f whose
      #     parent agreement a satisfies ALL of:
      #        a.issuing_carrier_id == Ticket[coupon.ticket_id].validating_carrier_id
      #        a.partner_carrier_id == coupon.operating_carrier_id
      #        a.status == ACTIVE
      #        date(coupon.flown_at) >= a.effective_from AND date(coupon.flown_at) <= a.effective_to   # closed-closed
      #     and whose own fields satisfy ALL of:
      #        f.class_of_service == coupon.class_of_service                     # never wildcarded
      #        (f.origin == coupon.origin OR f.origin == "*")
      #        (f.destination == coupon.destination OR f.destination == "*")
      # (b) RANKING EXPRESSION — sort the candidate set by f.specificity_score DESC,
      #     where specificity_score = (f.origin != "*") + (f.destination != "*").
      # (c) TIE-BREAK — when two candidates share the highest specificity_score,
      #     take the one with the smaller created_at; `id` is never consulted.
      # (d) EMPTY-SET FALLBACK — no candidate means the coupon settles on the
      #     STRAIGHT_RATE default: factor_bp = 10000, no off-the-top amount,
      #     allocation_basis = STRAIGHT_RATE. This is NOT an error.
      #
      # CURRENCY GATE — if a pair is selected and
      # agreement.settlement_currency != Ticket.sale_currency, the whole run
      # aborts with ERR_CURRENCY_MISMATCH (422); it does NOT fall back.
    input_set: "ProrateFactor rows joined to ProrateAgreement rows with status == ACTIVE only; DRAFT and SUSPENDED agreements are invisible to proration"
    constants:
      DEFAULT_FACTOR_BP: 10000
    precision: "integer basis points; no rounding occurs in this step"

  # ---------------------------------------------------------------------------
  - name: coupon_revenue_allocation
    trigger: "POST /interline/tickets/{id}/prorate — writes Coupon.allocated_amount_minor, Coupon.allocation_basis, Coupon.weight_units, Ticket.unallocated_residual_minor and the ProrationRun row"
    algorithm: waterfall_allocation
    formula: |
      pool = Ticket.total_fare_minor                       # always the FULL fare, both variants

      # ---- step 1: input set (variant-dependent, see `variants` below) ----
      included = [coupons of the ticket whose coupon_status is in the variant's status set]
      if included is empty: raise ERR_NO_PRORATABLE_COUPONS (422)

      # ---- step 2: off-the-top special prorate amounts (FINAL variant only) ----
      spa_total = 0
      for c in included ordered by coupon_number ASC:
          (agreement, factor) = prorate_factor_selection(c)      # may be none
          if variant == FINAL and agreement is not none and agreement.agreement_type == SPA_FLAT:
              c.allocated_amount_minor = factor.flat_amount_minor
              c.allocation_basis = SPA_FLAT
              spa_total += factor.flat_amount_minor
          elif variant == FINAL and agreement is not none and agreement.agreement_type == SPA_PERCENT:
              amt = round_half_up(pool * factor.percent_bp / 10000)
              c.allocated_amount_minor = amt
              c.allocation_basis = SPA_PERCENT
              spa_total += amt
      if spa_total > pool: raise ERR_SPA_OVERALLOCATION (422)

      straight_rate_pool = pool - spa_total
      rest = [c in included that took no off-the-top amount]     # STRAIGHT_RATE coupons

      # ---- step 3: weights ----
      for c in rest:
          factor_bp = factor.factor_bp if (agreement is not none and
                                           agreement.agreement_type == STRAIGHT_RATE)
                                       else DEFAULT_FACTOR_BP
          c.weight_units = round_half_up(c.tpm_miles * CLASS_WEIGHT_BP[c.class_of_service]
                                         * factor_bp / 10000)
      total_weight = sum(c.weight_units for c in rest)

      # ---- step 4: ROUND PER COUPON, THEN ALLOCATE THE RESIDUAL ----
      # PINNED ORDER: each coupon's share is rounded on its own before any summing.
      # Summing the exact rational shares and rounding once at the end is WRONG and
      # produces a different cent split.
      if rest is not empty:
          for c in rest ordered by coupon_number ASC:
              c.allocated_amount_minor = round_half_up(straight_rate_pool * c.weight_units
                                                       / total_weight)
              c.allocation_basis = STRAIGHT_RATE
          rounding_residual = straight_rate_pool - sum(c.allocated_amount_minor for c in rest)
          # residual (positive or negative) goes to ONE coupon:
          #   ranking: highest weight_units; tie-break: lowest coupon_number
          winner = max(rest, key=(weight_units DESC, coupon_number ASC))
          winner.allocated_amount_minor += rounding_residual
          unallocated_residual = 0
      else:
          rounding_residual = 0
          unallocated_residual = straight_rate_pool      # nothing left to absorb it

      # ---- step 5: excluded coupons are zeroed, never left stale ----
      for c in coupons of the ticket not in included:
          c.allocated_amount_minor = 0
          c.allocation_basis = UNALLOCATED

      Ticket.unallocated_residual_minor = pool - sum(allocated_amount_minor over ALL coupons)
    input_set: "coupons of the ticket filtered by coupon_status per the active variant; VOID coupons are excluded by both variants"
    constants:
      CLASS_WEIGHT_BP: { ECONOMY: 10000, PREMIUM: 12500, BUSINESS: 16000, FIRST: 20000 }
      DEFAULT_FACTOR_BP: 10000
    precision: "integer minor units; round_half_up at every division; per-coupon rounding precedes the residual grant"
    variants:
      - name: PROVISIONAL
        when: "run_type == PROVISIONAL — the straight-rate default settlement taken at ticketing time, before any sector is flown"
        difference: "input set is coupon_status IN {OPEN, FLOWN}; step 2 is skipped entirely so spa_total is always 0 and every included coupon settles on STRAIGHT_RATE with factor_bp = 10000 (special prorate agreements are ignored, even when ACTIVE)"
      - name: FINAL
        when: "run_type == FINAL — the settlement basis actually billed through the clearinghouse"
        difference: "input set is coupon_status IN {FLOWN, ADJUSTED} (OPEN coupons drop out, shrinking total_weight); step 2 runs, so SPA_FLAT and SPA_PERCENT coupons take money off the top and the remaining coupons share a smaller pool; STRAIGHT_RATE agreements additionally bend weight_units by factor_bp"

  # ---------------------------------------------------------------------------
  - name: ffp_mileage_cost
    trigger: "ESTIMATE runs on POST /interline/coupons/{id}/fly (writes Coupon.ffp_miles_awarded, Coupon.ffp_tier, Coupon.ffp_accrual_cost_minor, Carrier.period_accrued_miles, Carrier.period_ffp_cost_estimate_minor); PERIOD_TRUE_UP runs inside POST /interline/settlement-periods/{id}/close (writes Carrier.period_ffp_cost_trued_up_minor and Carrier.ffp_true_up_delta_minor)"
    algorithm: chronological
    formula: |
      miles = round_half_up(coupon.tpm_miles * FFP_MULTIPLIER_BP[coupon.class_of_service] / 10000)

      tier_of(cumulative_miles):
          if cumulative_miles < 10000:    return (TIER_A, 1400)
          if cumulative_miles < 40000:    return (TIER_B, 1150)
          return (TIER_C, 900)                     # >= 40000, inclusive

      # ESTIMATE (per coupon, at fly time)
      (tier, rate) = tier_of(Carrier[coupon.operating_carrier_id].period_accrued_miles)   # BEFORE adding
      coupon.ffp_tier = tier
      coupon.ffp_accrual_cost_minor = round_half_up(miles * rate / 1000)
      carrier.period_accrued_miles += miles
      carrier.period_ffp_cost_estimate_minor += coupon.ffp_accrual_cost_minor

      # PERIOD_TRUE_UP (per carrier, at period close)
      period_coupons = coupons with operating_carrier_id == carrier.id
                       AND coupon_status IN {FLOWN, ADJUSTED}
                       AND flown_at >= period.period_start AND flown_at < period.period_end
      period_miles = sum(c.ffp_miles_awarded for c in period_coupons)
      (tier, rate) = tier_of(period_miles)                       # ONE tier for the whole period
      carrier.period_ffp_cost_trued_up_minor = round_half_up(period_miles * rate / 1000)
      carrier.ffp_true_up_delta_minor = carrier.period_ffp_cost_trued_up_minor
                                        - sum(c.ffp_accrual_cost_minor for c in period_coupons)
    input_set: "ESTIMATE sees exactly one coupon and the operating carrier's running counter; PERIOD_TRUE_UP sees every coupon with coupon_status IN {FLOWN, ADJUSTED} whose flown_at falls in the half-open window [period_start, period_end)"
    constants:
      FFP_MULTIPLIER_BP: { ECONOMY: 5000, PREMIUM: 10000, BUSINESS: 15000, FIRST: 20000 }
      TIER_A_CEILING_MILES: 10000
      TIER_B_CEILING_MILES: 40000
      TIER_A_RATE_PER_1000: 1400
      TIER_B_RATE_PER_1000: 1150
      TIER_C_RATE_PER_1000: 900
    precision: "integer miles and integer minor units, round_half_up"
    variants:
      - name: ESTIMATE
        when: "at fly time, coupon by coupon"
        difference: "tier is read from the carrier's running period_accrued_miles BEFORE this coupon's miles land, so earlier coupons in the same period are costed at a strictly higher (or equal) rate than later ones"
      - name: PERIOD_TRUE_UP
        when: "at settlement-period close, carrier by carrier"
        difference: "a single tier chosen from the period's TOTAL miles is applied retroactively to every mile of the period, so the trued-up figure diverges from the sum of the per-coupon estimates whenever the cumulative total crossed a tier ceiling mid-period"

  # ---------------------------------------------------------------------------
  - name: invoice_claim_build
    trigger: "POST /interline/billing-invoices/{id}/submit — writes BillingInvoice.gross_billed_minor, ich_fee_bp, ich_handling_fee_minor, late_submission_penalty_minor, total_claim_minor and net_billed_minor"
    algorithm: tiered_pricing
    formula: |
      gross = sum(c.allocated_amount_minor for c in coupons where billing_invoice_id == invoice.id)

      # EVALUATION ORDER IS PINNED — the fee tier is keyed on the PRE-FEE gross.
      # It looks circular because total_claim is what the carrier actually claims and
      # a naive reading keys the tier on total_claim; it does not. Tier selection
      # happens first, on `gross`, and never re-runs after the deductions land.
      if   gross <  500000:  fee_bp = 75
      elif gross < 5000000:  fee_bp = 50
      else:                  fee_bp = 25                      # >= 5000000, inclusive

      handling_fee = round_half_up(gross * fee_bp / 10000)
      late_penalty = round_half_up(gross * LATE_PENALTY_BP / 10000)
                     if current_logical_clock > period.submission_deadline else 0
      total_claim  = gross - handling_fee - late_penalty
      net_billed   = total_claim - invoice.rejected_amount_minor
    input_set: "coupons whose billing_invoice_id equals this invoice's id; the set is frozen at draft creation and only cleared by a recall"
    constants:
      FEE_TIER_1_CEILING: 500000
      FEE_TIER_2_CEILING: 5000000
      FEE_BP_TIER_1: 75
      FEE_BP_TIER_2: 50
      FEE_BP_TIER_3: 25
      LATE_PENALTY_BP: 200
    precision: "integer minor units of billing_currency, round_half_up"

  # ---------------------------------------------------------------------------
  - name: fx_rate_selection
    trigger: "PROVISIONAL_ANCHOR runs inside POST /interline/billing-invoices/{id}/submit; FIXED_ANCHOR runs inside POST /interline/settlement-periods/{id}/close and inside POST /interline/audit-samples/{id}/close"
    algorithm: projection
    formula: |
      convert(amount_minor, from_ccy, to_ccy, anchor_instant):
          if from_ccy == to_ccy:
              rate_scaled = 1000000
          else:
              # (a) eligibility filter: ExchangeRate rows with from_currency == from_ccy,
              #     to_currency == to_ccy and effective_date <= anchor_instant
              # (b) ranking: effective_date DESC
              # (c) tie-break: created_at ASC   (unreachable in practice — the triple
              #     (from_currency, to_currency, effective_date) is unique)
              # (d) empty candidate set: raise ERR_NO_EXCHANGE_RATE (422)
              rate_scaled = that row's rate_scaled
          return round_half_up(amount_minor * rate_scaled / 1000000)

      # invoice submit
      provisional_rate_scaled     = selected at anchor = current logical clock
      provisional_settlement_minor = round_half_up(total_claim_minor * provisional_rate_scaled / 1000000)
      # period close
      fixed_rate_scaled           = selected at anchor = period.rate_fixing_date
      final_settlement_minor      = round_half_up(total_claim_minor * fixed_rate_scaled / 1000000)
      fx_variance_minor           = final_settlement_minor - provisional_settlement_minor
    input_set: "ExchangeRate rows for the ordered currency pair with effective_date at or before the anchor instant"
    constants:
      RATE_SCALE: 1000000
    precision: "integer minor units, round_half_up; the rate itself is never rounded"
    variants:
      - name: PROVISIONAL_ANCHOR
        when: "invoice submission — anchor is the submitting carrier's own clock position"
        difference: "picks whichever quote was prevailing on submission day; the resulting figure only ever touches the pending_* balances"
      - name: FIXED_ANCHOR
        when: "clearinghouse close and audit-claim close — anchor is the period's rate_fixing_date"
        difference: "picks the quote prevailing at the period's fixing instant, which for any invoice submitted before a later quote landed yields a different converted amount; the difference is booked as fx_variance_minor and can push a carrier over its credit limit even though the submit-time check passed"

  # ---------------------------------------------------------------------------
  - name: undercharge_extrapolation
    trigger: "POST /interline/audit-samples/{id}/close — writes AuditSample.undercharge_ratio_bp, coverage_bp, haircut_bp, extrapolated_gross_minor, claim_amount_minor and claim_settlement_minor"
    algorithm: weighted_scoring
    formula: |
      U = sample.sampled_undercharge_minor
      S = sample.sampled_allocated_minor          # frozen at draw time
      P = sample.population_allocated_minor       # frozen at draw time

      undercharge_ratio_bp = round_half_up(U * 10000 / S)
      coverage_bp          = round_half_up(S * 10000 / P)

      if undercharge_ratio_bp < MATERIALITY_BP:              # strictly less than 200
          claim_amount_minor = 0 ; claim_settlement_minor = 0 ; status = CLOSED_IMMATERIAL
          # extrapolated_gross_minor is still written, for the audit trail
      else:
          status = CLAIM_RAISED

      if   coverage_bp >= 2000: haircut_bp = 0
      elif coverage_bp >=  500: haircut_bp = 1500
      else:                     haircut_bp = 3500

      extrapolated_gross_minor = round_half_up(U * P / S)
      capped                   = min(extrapolated_gross_minor, CAP_MULTIPLE * U)
      claim_amount_minor       = round_half_up(capped * (10000 - haircut_bp) / 10000)
      claim_settlement_minor   = fx_rate_selection.convert(claim_amount_minor,
                                    sample.claim_currency,
                                    SettlementPeriod[sample.settlement_period_id].settlement_currency,
                                    anchor = SettlementPeriod[...].rate_fixing_date)
    input_set: "S and P are the frozen draw-time sums; U is the running total of record-finding results; the population itself is derived at draw time (see `audit_population_derivation`)"
    constants:
      MATERIALITY_BP: 200
      COVERAGE_TIER_HIGH_BP: 2000
      COVERAGE_TIER_MID_BP: 500
      HAIRCUT_HIGH_BP: 0
      HAIRCUT_MID_BP: 1500
      HAIRCUT_LOW_BP: 3500
      CAP_MULTIPLE: 25
    precision: "integer basis points and integer minor units, round_half_up throughout; the cap is applied BEFORE the haircut"

  # ---------------------------------------------------------------------------
  - name: audit_population_derivation
    trigger: "POST /interline/audit-samples — writes AuditSample.population_coupon_count, population_allocated_minor, sampled_coupon_count and sampled_allocated_minor"
    algorithm: aggregation
    formula: |
      population = coupons c satisfying ALL of:
          c.operating_carrier_id == sample.audited_carrier_id
          c.coupon_status IN {FLOWN, ADJUSTED}
          c.flown_at >= period.period_start AND c.flown_at < period.period_end   # half-open
          c.billing_invoice_id is not null
          Ticket[c.ticket_id].sale_currency == sample.claim_currency
      if population is empty: raise ERR_EMPTY_AUDIT_POPULATION (422)
      if any coupon in population has flown_at < current_logical_clock - 730 days:
          raise ERR_AUDIT_TIME_BARRED (409)
      population_coupon_count  = count(population)
      population_allocated_minor = sum(c.allocated_amount_minor for c in population)
      every id in sample_coupon_ids must be a member of population, else ERR_COUPON_NOT_IN_POPULATION (422)
      sampled_coupon_count    = count(sample_coupon_ids)
      sampled_allocated_minor = sum(c.allocated_amount_minor for c in sample_coupon_ids)
    input_set: "coupons of the audited carrier that were both flown inside the period window and actually invoiced; the tie-break question never arises because the aggregation is a plain sum over a fully-determined set"
    constants:
      AUDIT_TIME_BAR_DAYS: 730
    precision: "integer counts and integer minor units; no rounding"

  # ---------------------------------------------------------------------------
  - name: memo_aging
    trigger: "recomputed on every read of a RejectionMemo (GET /interline/rejection-memos and GET /interline/rejection-memos/{id}) and evaluated inside POST /interline/rejection-memos/{id}/escalate"
    algorithm: threshold
    formula: |
      anchor = memo.resolved_at if memo.status IN {ACCEPTED, WITHDRAWN, RESOLVED_UPHELD, RESOLVED_DENIED}
               else current_logical_clock
      age_days = floor((anchor - memo.raised_at) / 86400 seconds)
      if   age_days <  30: aging_bucket = CURRENT
      elif age_days <  60: aging_bucket = AGED_30
      elif age_days <  90: aging_bucket = AGED_60
      else:                aging_bucket = AGED_90          # >= 90, inclusive
      arbitration_eligible = (memo.stage == 3) OR (age_days >= 90)
    input_set: "the single memo row; raised_at is never rewritten by a re-reject, so the clock keeps running across the whole negotiation cycle"
    constants:
      BUCKET_1_DAYS: 30
      BUCKET_2_DAYS: 60
      BUCKET_3_DAYS: 90
      ARBITRATION_MIN_AGE_DAYS: 90
      MEMO_RAISE_WINDOW_DAYS: 45
    precision: "integer days, floor division on whole seconds"

  # ---------------------------------------------------------------------------
  - name: carrier_net_position
    trigger: "recomputed on every Carrier balance write — invoice submit, invoice recall, period close, memo accept, memo arbitrate with ruling UPHELD, and audit claim acceptance"
    algorithm: aggregation
    formula: |
      Carrier.net_position_minor = (pending_receivable_minor + settled_receivable_minor)
                                 - (pending_payable_minor + settled_payable_minor)

      # GLOBAL INVARIANT (clearinghouse zero-sum), asserted after every one of the
      # six triggering operations:
      #   sum over ALL Carrier rows of net_position_minor == 0
      # Every balance write above moves the same figure onto exactly one carrier's
      # receivable side and one carrier's payable side.
    input_set: "all Carrier rows, no status filter — SUSPENDED carriers still carry balances"
    constants: {}
    precision: "integer minor units of the settlement currency; no rounding at this step"

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in ascending priority;
# the FIRST failing row decides the response, and no side effect of the request
# has been applied when it does)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the four declared roles AND that role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: every required input field present; enum fields carry a declared member; integer money and mileage fields are integers within their declared constraints; ISO 8601 datetime and YYYY-MM-DD date fields parse; effective_to >= effective_from; period_end > period_start; from_currency != to_currency; limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "every id embedded in the request path resolves to a stored row, checked left to right"
    error_id: ERR_CARRIER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_COUPON_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_MEMO_NOT_FOUND | ERR_SAMPLE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to a stored row, checked in the order the fields are declared in the endpoint's input list; for coupon_ids and sample_coupon_ids arrays, in the order supplied"
    error_id: ERR_CARRIER_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_COUPON_NOT_FOUND | ERR_PERIOD_NOT_FOUND | ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /interline/prorate-agreements, POST /interline/tickets, POST /interline/tickets/{id}/coupons, POST /interline/billing-invoices, POST /interline/rejection-memos, POST /interline/audit-samples, POST /interline/audit-samples/{id}/record-finding"

  - priority: 6
    category: auth
    check: "for the entity_backed roles, X-User-ID equals the carrier id that owns the operation: RevenueAccountant -> the ticket's validating_carrier_id (or, for agreements and invoice drafts, the issuing/billing carrier named in the body); BillingAgent -> the invoice side the action belongs to (submit/recall/counter/accept -> billing_carrier_id; raise/re-reject/withdraw -> billed_carrier_id; claim-decision -> audited_carrier_id); InterlineAuditor -> the sample's auditing_carrier_id"
    error_id: ERR_CARRIER_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "all POST endpoints except POST /interline/carriers, POST /interline/settlement-periods, POST /interline/exchange-rates, the agreement activate/suspend pair, POST /interline/rejection-memos/{id}/arbitrate and POST /_clock/set_current_utc"

  - priority: 7
    category: state
    check: "SettlementPeriod[settlement_period_id].status == OPEN"
    error_id: ERR_PERIOD_NOT_OPEN
    http_status: 409
    applies_to: "POST /interline/billing-invoices, POST /interline/billing-invoices/{id}/submit, POST /interline/billing-invoices/{id}/recall, POST /interline/settlement-periods/{id}/close"

  - priority: 8
    category: state
    check: "SettlementPeriod[periodId].status == CLOSED for settle; SettlementPeriod[settlement_period_id].status IN {CLOSED, SETTLED} for audit-sample creation"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /interline/settlement-periods/{id}/settle, POST /interline/audit-samples"

  - priority: 9
    category: state
    check: "invoice.status == DRAFT for submit; invoice.status == SUBMITTED for recall"
    error_id: ERR_INVOICE_STATE_INVALID
    http_status: 409
    applies_to: "POST /interline/billing-invoices/{id}/submit, POST /interline/billing-invoices/{id}/recall"

  - priority: 10
    category: state
    check: "BillingInvoice[invoice_id].status IN {CLEARED, PARTIALLY_REJECTED}"
    error_id: ERR_INVOICE_NOT_CLEARED
    http_status: 409
    applies_to: "POST /interline/rejection-memos"

  - priority: 11
    category: state
    check: "memo.status == RAISED for counter and accept; memo.status == COUNTERED for re-reject; memo.status IN {RAISED, COUNTERED} for withdraw and escalate; memo.status == ARBITRATION for arbitrate"
    error_id: ERR_MEMO_STATE_INVALID
    http_status: 409
    applies_to: "POST /interline/rejection-memos/{id}/counter, /re-reject, /accept, /withdraw, /escalate, /arbitrate"

  - priority: 12
    category: state
    check: "coupon.coupon_status == OPEN"
    error_id: ERR_COUPON_STATE_INVALID
    http_status: 409
    applies_to: "POST /interline/coupons/{id}/fly, POST /interline/coupons/{id}/void"

  - priority: 13
    category: state
    check: "for every coupon named in coupon_ids, Ticket[coupon.ticket_id].proration_status == FINAL"
    error_id: ERR_TICKET_NOT_FINAL_PRORATED
    http_status: 409
    applies_to: "POST /interline/billing-invoices"

  - priority: 14
    category: state
    check: "agreement.status IN {DRAFT, SUSPENDED} for activate; agreement.status == ACTIVE for suspend; agreement.status == DRAFT for factor creation"
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /interline/prorate-agreements/{id}/activate, /suspend, POST /interline/prorate-agreements/{id}/factors"

  - priority: 15
    category: state
    check: "sample.status IN {DRAWN, IN_REVIEW} for record-finding; sample.status == IN_REVIEW for close; sample.status == CLAIM_RAISED for claim-decision"
    error_id: ERR_SAMPLE_STATE_INVALID
    http_status: 409
    applies_to: "POST /interline/audit-samples/{id}/record-finding, /close, /claim-decision"

  - priority: 16
    category: state
    check: "ticket.proration_status IN {PROVISIONAL, FINAL, REPRORATION_REQUIRED}"
    error_id: ERR_TICKET_NOT_PRORATED
    http_status: 409
    applies_to: "POST /interline/tickets/{id}/void-proration"

  - priority: 16.5
    category: state
    check: "carrier.status == ACTIVE for suspend; carrier.status == SUSPENDED for reinstate"
    error_id: ERR_CARRIER_STATE_INVALID
    http_status: 409
    applies_to: "POST /interline/carriers/{id}/suspend, POST /interline/carriers/{id}/reinstate"

  - priority: 17
    category: business_safety
    check: "the carrier acting for its own account has status == ACTIVE: Carrier[validating_carrier_id] on ticket creation and coupon creation; Carrier[issuing_carrier_id] on agreement creation; Carrier[billing_carrier_id] on invoice draft and submit; Carrier[billed_carrier_id] on memo raise and re-reject"
    error_id: ERR_CARRIER_SUSPENDED
    http_status: 409
    applies_to: "POST /interline/tickets, POST /interline/tickets/{id}/coupons, POST /interline/prorate-agreements, POST /interline/billing-invoices, POST /interline/billing-invoices/{id}/submit, POST /interline/rejection-memos, POST /interline/rejection-memos/{id}/re-reject"

  - priority: 18
    category: business_safety
    check: "Carrier[coupon.operating_carrier_id].status == ACTIVE"
    error_id: ERR_OPERATING_CARRIER_SUSPENDED
    http_status: 409
    applies_to: "POST /interline/coupons/{id}/fly"

  - priority: 19
    category: business_temporal
    check: "CLOSED-CLOSED interval rule — no other ProrateAgreement with the same ordered (issuing_carrier_id, partner_carrier_id) pair and status IN {ACTIVE, SUSPENDED} satisfies new.effective_from <= other.effective_to AND other.effective_from <= new.effective_to. Sharing a single endpoint date (new.effective_from == other.effective_to) IS a conflict; the two windows must be separated by at least one clear calendar day."
    error_id: ERR_AGREEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /interline/prorate-agreements/{id}/activate"

  - priority: 20
    category: business_temporal
    check: "HALF-OPEN interval rule — no other SettlementPeriod with status IN {OPEN, CLOSED} satisfies new.period_start < other.period_end AND other.period_start < new.period_end. Sharing a boundary instant (new.period_start == other.period_end) is LEGAL; back-to-back periods are the normal clearinghouse calendar."
    error_id: ERR_PERIOD_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /interline/settlement-periods"

  - priority: 21
    category: business_temporal
    check: "current logical clock minus BillingInvoice[invoice_id].cleared_at is at most 45 whole days"
    error_id: ERR_MEMO_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /interline/rejection-memos, POST /interline/rejection-memos/{id}/re-reject"

  - priority: 22
    category: business_temporal
    check: "memo.stage == 3 OR memo.age_days >= 90"
    error_id: ERR_ARBITRATION_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /interline/rejection-memos/{id}/escalate"

  - priority: 23
    category: business_temporal
    check: "no coupon in the derived audit population has flown_at earlier than the current logical clock minus 730 days"
    error_id: ERR_AUDIT_TIME_BARRED
    http_status: 409
    applies_to: "POST /interline/audit-samples"

  - priority: 24
    category: business_referential
    check: "Coupon[coupon_id].billing_invoice_id equals the invoice_id named in the request (for re-reject, the memo's own invoice)"
    error_id: ERR_COUPON_NOT_ON_INVOICE
    http_status: 422
    applies_to: "POST /interline/rejection-memos"

  - priority: 25
    category: business_referential
    check: "for every coupon in coupon_ids: coupon.operating_carrier_id == billing_carrier_id AND Ticket[coupon.ticket_id].validating_carrier_id == billed_carrier_id"
    error_id: ERR_COUPON_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /interline/billing-invoices"

  - priority: 26
    category: business_referential
    check: "currency agreement: every attached coupon's ticket sale_currency == invoice.billing_currency (invoice draft); the selected ProrateAgreement's settlement_currency == ticket.sale_currency (FINAL proration); every population coupon's ticket sale_currency == sample.claim_currency (audit draw)"
    error_id: ERR_CURRENCY_MISMATCH
    http_status: 422
    applies_to: "POST /interline/billing-invoices, POST /interline/tickets/{id}/prorate, POST /interline/audit-samples"

  - priority: 27
    category: business_referential
    check: "coupon_id is a member of sample.sample_coupon_ids"
    error_id: ERR_COUPON_NOT_IN_SAMPLE
    http_status: 422
    applies_to: "POST /interline/audit-samples/{id}/record-finding"

  - priority: 28
    category: business_constraint
    check: "ticket_number is not already used by another Ticket row"
    error_id: ERR_DUPLICATE_TICKET_NUMBER
    http_status: 409
    applies_to: "POST /interline/tickets"

  - priority: 29
    category: business_constraint
    check: "coupon_number equals Ticket.coupon_count + 1 — coupons must be added in unbroken ascending sequence"
    error_id: ERR_COUPON_SEQUENCE_INVALID
    http_status: 422
    applies_to: "POST /interline/tickets/{id}/coupons"

  - priority: 30
    category: business_constraint
    check: "no other ProrateFactor of the same agreement already carries the identical (origin, destination, class_of_service) triple"
    error_id: ERR_DUPLICATE_FACTOR_SECTOR
    http_status: 409
    applies_to: "POST /interline/prorate-agreements/{id}/factors"

  - priority: 31
    category: business_constraint
    check: "exactly the one factor field required by the parent agreement_type is supplied: factor_bp for STRAIGHT_RATE, flat_amount_minor for SPA_FLAT, percent_bp for SPA_PERCENT; the other two must be absent"
    error_id: ERR_FACTOR_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /interline/prorate-agreements/{id}/factors"

  - priority: 32
    category: business_constraint
    check: "no other ExchangeRate row already carries the identical (from_currency, to_currency, effective_date) triple"
    error_id: ERR_DUPLICATE_EXCHANGE_RATE
    http_status: 409
    applies_to: "POST /interline/exchange-rates"

  - priority: 33
    category: business_constraint
    check: "the run's input set is non-empty — coupon_status IN {OPEN, FLOWN} for PROVISIONAL, coupon_status IN {FLOWN, ADJUSTED} for FINAL"
    error_id: ERR_NO_PRORATABLE_COUPONS
    http_status: 422
    applies_to: "POST /interline/tickets/{id}/prorate"

  - priority: 34
    category: business_constraint
    check: "memo.stage < 3"
    error_id: ERR_MEMO_STAGE_EXHAUSTED
    http_status: 409
    applies_to: "POST /interline/rejection-memos/{id}/re-reject"

  - priority: 35
    category: business_constraint
    check: "every coupon in coupon_ids has billing_invoice_id == null and coupon_status IN {FLOWN, ADJUSTED}"
    error_id: ERR_COUPON_ALREADY_INVOICED
    http_status: 409
    applies_to: "POST /interline/billing-invoices"

  - priority: 36
    category: business_constraint
    check: "the derived audit population contains at least one coupon"
    error_id: ERR_EMPTY_AUDIT_POPULATION
    http_status: 422
    applies_to: "POST /interline/audit-samples"

  - priority: 37
    category: business_constraint
    check: "every id in sample_coupon_ids is a member of the derived population"
    error_id: ERR_COUPON_NOT_IN_POPULATION
    http_status: 422
    applies_to: "POST /interline/audit-samples"

  - priority: 38
    category: business_fiscal
    check: "the sum of off-the-top special-prorate amounts does not exceed ticket.total_fare_minor"
    error_id: ERR_SPA_OVERALLOCATION
    http_status: 422
    applies_to: "POST /interline/tickets/{id}/prorate"

  - priority: 39
    category: business_fiscal
    check: "amount_minor <= Coupon[coupon_id].allocated_amount_minor"
    error_id: ERR_MEMO_AMOUNT_EXCEEDS_COUPON
    http_status: 422
    applies_to: "POST /interline/rejection-memos, POST /interline/rejection-memos/{id}/re-reject"

  - priority: 40
    category: business_fiscal
    check: "invoice.disputed_amount_minor + invoice.rejected_amount_minor + amount_minor <= invoice.total_claim_minor (the memo's own previous amount is excluded on re-reject)"
    error_id: ERR_MEMO_AMOUNT_EXCEEDS_INVOICE
    http_status: 422
    applies_to: "POST /interline/rejection-memos, POST /interline/rejection-memos/{id}/re-reject"

  - priority: 40.5
    category: business_fiscal
    check: "an ExchangeRate row exists for the ordered currency pair with effective_date at or before the anchor instant, unless the two currencies are equal; this check necessarily precedes the credit-limit check below, which needs the converted figure"
    error_id: ERR_NO_EXCHANGE_RATE
    http_status: 422
    applies_to: "POST /interline/billing-invoices/{id}/submit, POST /interline/settlement-periods/{id}/close, POST /interline/audit-samples/{id}/close"

  - priority: 41
    category: business_fiscal
    check: "Carrier[billed_carrier_id].pending_payable_minor + settled_payable_minor + provisional_settlement_minor - pending_receivable_minor - settled_receivable_minor <= Carrier[billed_carrier_id].credit_limit_minor"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /interline/billing-invoices/{id}/submit"

  - priority: 43
    category: state
    check: "expected_invoice_version equals BillingInvoice.version"
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /interline/rejection-memos, POST /interline/rejection-memos/{id}/re-reject, /accept, /withdraw"

  - priority: 44
    category: state
    check: "expected_ticket_version equals Ticket.version"
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
    applies_to: "POST /interline/tickets/{id}/prorate, POST /interline/tickets/{id}/void-proration"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ Carrier
  - method: POST
    path: "/interline/carriers"
    description: "Register a partner carrier in the clearinghouse."
    roles: [ClearinghouseOperator]
    code: 201
    input: [iata_code, name, base_currency, credit_limit_minor]
    output: Carrier
    side_effects: ["status = ACTIVE; all balance, mileage and counter fields initialised to 0; audit_flag = false"]

  - method: GET
    path: "/interline/carriers/{id}"
    description: "Read one carrier including its live clearinghouse balances and mileage counters."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/interline/carriers"
    description: "List carriers, optionally filtered by clearinghouse standing."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: POST
    path: "/interline/carriers/{id}/suspend"
    description: "Suspend a defaulting or non-compliant member carrier; its ACTIVE prorate agreements follow it out of force."
    roles: [ClearinghouseOperator]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status = SUSPENDED; ACTIVE agreements naming the carrier move to SUSPENDED with suspension_reason = CARRIER_SUSPENDED; increments version by 1"]

  - method: POST
    path: "/interline/carriers/{id}/reinstate"
    description: "Return a suspended carrier to good standing; its agreements stay suspended until individually reactivated."
    roles: [ClearinghouseOperator]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status = ACTIVE; agreements untouched; increments version by 1"]

  # ---------------------------------------------------------------- Agreement
  - method: POST
    path: "/interline/prorate-agreements"
    description: "Draft a bilateral prorate agreement between an issuing and a partner carrier."
    roles: [RevenueAccountant]
    code: 201
    input: [issuing_carrier_id, partner_carrier_id, agreement_type, settlement_currency, effective_from, effective_to]
    output: ProrateAgreement
    side_effects: ["status = DRAFT; suspension_reason = NONE; factor_count = 0"]

  - method: GET
    path: "/interline/prorate-agreements/{id}"
    description: "Read one prorate agreement."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: ProrateAgreement
    side_effects: []

  - method: GET
    path: "/interline/prorate-agreements"
    description: "List prorate agreements filtered by either carrier side or by status."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["issuing_carrier_id?", "partner_carrier_id?", "status?", "limit?", "offset?"]
    output: ProrateAgreement[]
    side_effects: []

  - method: POST
    path: "/interline/prorate-agreements/{id}/factors"
    description: "Attach one sector-level prorate factor to a DRAFT agreement."
    roles: [RevenueAccountant]
    code: 201
    input: ["origin", "destination", "class_of_service", "factor_bp?", "flat_amount_minor?", "percent_bp?"]
    output: ProrateFactor
    side_effects: ["computes specificity_score; increments ProrateAgreement.factor_count and ProrateAgreement.version by 1"]

  - method: GET
    path: "/interline/prorate-agreements/{id}/factors"
    description: "List the sector factors of one agreement (reverse reachability for ProrateFactor.agreement_id)."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ProrateFactor[]
    side_effects: []

  - method: POST
    path: "/interline/prorate-agreements/{id}/activate"
    description: "Bring a DRAFT or SUSPENDED agreement into force; runs the closed-closed overlap check."
    roles: [ClearinghouseOperator]
    code: 200
    input: []
    output: ProrateAgreement
    side_effects: ["status = ACTIVE; suspension_reason = NONE; increments version by 1"]

  - method: POST
    path: "/interline/prorate-agreements/{id}/suspend"
    description: "Take an ACTIVE agreement out of force; matching coupons revert to the straight-rate default."
    roles: [ClearinghouseOperator]
    code: 200
    input: []
    output: ProrateAgreement
    side_effects: ["status = SUSPENDED; suspension_reason = OPERATOR_SUSPENDED; increments version by 1"]

  # ----------------------------------------------------------- Period and FX
  - method: POST
    path: "/interline/settlement-periods"
    description: "Open a clearinghouse settlement period; runs the half-open window overlap check."
    roles: [ClearinghouseOperator]
    code: 201
    input: ["period_code", "period_start", "period_end", "submission_deadline", "rate_fixing_date", "settlement_currency?"]
    output: SettlementPeriod
    side_effects: ["status = OPEN; cleared_invoice_count = 0"]

  - method: GET
    path: "/interline/settlement-periods/{id}"
    description: "Read one settlement period."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: []

  - method: POST
    path: "/interline/settlement-periods/{id}/close"
    description: "Close the period: fix rates, clear every SUBMITTED invoice, move settled balances, suspend over-limit carriers and their agreements, and run the frequent-flyer true-up."
    roles: [ClearinghouseOperator]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: ["five-hop cascade documented on SettlementPeriod OPEN -> CLOSED; FFP PERIOD_TRUE_UP per carrier; increments version by 1"]

  - method: POST
    path: "/interline/settlement-periods/{id}/settle"
    description: "Settle a CLOSED period: mark its invoices and their tickets settled and reset the carriers' mileage counters."
    roles: [ClearinghouseOperator]
    code: 200
    input: []
    output: SettlementPeriod
    side_effects: ["invoices to SETTLED; BILLED tickets to SETTLED; Carrier.period_accrued_miles and period_ffp_cost_estimate_minor reset to 0; increments version by 1"]

  - method: POST
    path: "/interline/exchange-rates"
    description: "Publish a clearinghouse FX quote for an ordered currency pair effective from a given instant."
    roles: [ClearinghouseOperator]
    code: 201
    input: [from_currency, to_currency, effective_date, rate_scaled]
    output: ExchangeRate
    side_effects: []

  # ------------------------------------------------------------------- Ticket
  - method: POST
    path: "/interline/tickets"
    description: "Issue an interline ticket against the validating carrier."
    roles: [RevenueAccountant]
    code: 201
    input: [ticket_number, validating_carrier_id, sale_currency, total_fare_minor, issue_date]
    output: Ticket
    side_effects: ["proration_status = UNPRORATED; billing_status = UNBILLED; coupon_count = 0; unallocated_residual_minor = total_fare_minor; last_run_type = NONE"]

  - method: GET
    path: "/interline/tickets/{id}"
    description: "Read one ticket including both state axes and the conservation slack bucket."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/interline/tickets"
    description: "List tickets filtered by validating carrier or by either state axis."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["validating_carrier_id?", "proration_status?", "billing_status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: POST
    path: "/interline/tickets/{id}/coupons"
    description: "Append the next flight coupon to a ticket."
    roles: [RevenueAccountant]
    code: 201
    input: [coupon_number, origin, destination, operating_carrier_id, class_of_service, tpm_miles]
    output: Coupon
    side_effects: ["coupon_status = OPEN; increments Ticket.coupon_count and Ticket.version by 1"]

  - method: GET
    path: "/interline/coupons/{id}"
    description: "Read one coupon including its allocation, basis and mileage accrual."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: Coupon
    side_effects: []

  - method: GET
    path: "/interline/coupons"
    description: "List coupons filtered by ticket, operating carrier, attached invoice or status."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["ticket_id?", "operating_carrier_id?", "billing_invoice_id?", "coupon_status?", "limit?", "offset?"]
    output: Coupon[]
    side_effects: []

  - method: POST
    path: "/interline/coupons/{id}/fly"
    description: "Mark a coupon flown, stamping the logical clock and booking the ESTIMATE-variant mileage accrual to the operating carrier."
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: Coupon
    side_effects: ["coupon_status = FLOWN; flown_at stamped; ffp_miles_awarded, ffp_tier, ffp_accrual_cost_minor written; operating carrier's period_accrued_miles and period_ffp_cost_estimate_minor advanced; increments Coupon.version and Carrier.version by 1; Ticket.version untouched"]

  - method: POST
    path: "/interline/coupons/{id}/void"
    description: "Void an unflown coupon; it leaves both proration input sets."
    roles: [RevenueAccountant]
    code: 200
    input: []
    output: Coupon
    side_effects: ["coupon_status = VOID; allocated_amount_minor = 0; allocation_basis = UNALLOCATED; Ticket.unallocated_residual_minor recomputed; increments Coupon.version and Ticket.version by 1"]

  - method: POST
    path: "/interline/tickets/{id}/prorate"
    description: "Run a coupon-level revenue allocation over the ticket. OCC-guarded on the ticket's version."
    roles: [RevenueAccountant]
    code: 201
    input: [run_type, expected_ticket_version]
    output: ProrationRun
    side_effects: ["writes every coupon's allocated_amount_minor, allocation_basis and weight_units; recomputes Ticket.unallocated_residual_minor; sets Ticket.proration_status and last_run_type; increments Ticket.version by 1"]

  - method: GET
    path: "/interline/tickets/{id}/proration-runs"
    description: "List the proration runs of one ticket, newest last (reverse reachability for ProrationRun.ticket_id)."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: ProrationRun[]
    side_effects: []

  - method: POST
    path: "/interline/tickets/{id}/void-proration"
    description: "Compensating action: discard the current allocation and return the whole fare to the ticket's slack bucket. OCC-guarded on the ticket's version."
    roles: [RevenueAccountant]
    code: 200
    input: [expected_ticket_version]
    output: Ticket
    side_effects: ["every coupon zeroed to UNALLOCATED; unallocated_residual_minor = total_fare_minor; proration_status = UNPRORATED; last_run_type = NONE; billing_status untouched; increments Ticket.version by 1"]

  # ------------------------------------------------------------------ Invoice
  - method: POST
    path: "/interline/billing-invoices"
    description: "Draft a clearinghouse invoice attaching a set of flown, finally-prorated coupons."
    roles: [RevenueAccountant]
    code: 201
    input: [settlement_period_id, billing_carrier_id, billed_carrier_id, billing_currency, coupon_ids]
    output: BillingInvoice
    side_effects: ["status = DRAFT; sets Coupon.billing_invoice_id on each attached coupon; coupon_count set; all money fields remain 0 until submit"]

  - method: GET
    path: "/interline/billing-invoices/{id}"
    description: "Read one invoice including both conversions, the FX variance and the dispute totals."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: BillingInvoice
    side_effects: []

  - method: GET
    path: "/interline/billing-invoices"
    description: "List invoices filtered by period, either carrier side, or status."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["settlement_period_id?", "billing_carrier_id?", "billed_carrier_id?", "status?", "limit?", "offset?"]
    output: BillingInvoice[]
    side_effects: []

  - method: POST
    path: "/interline/billing-invoices/{id}/submit"
    description: "Submit the invoice into the open period: builds the claim, converts it at the submission-day rate and moves both carriers' pending balances."
    roles: [BillingAgent]
    code: 200
    input: []
    output: BillingInvoice
    side_effects: ["calculations invoice_claim_build and fx_rate_selection/PROVISIONAL_ANCHOR; status = SUBMITTED; pending balances moved on both carriers; owning tickets to billing_status BILLED; increments version by 1"]

  - method: POST
    path: "/interline/billing-invoices/{id}/recall"
    description: "Compensating action: withdraw a submitted invoice back to DRAFT, reversing both carriers' pending balances exactly and detaching its coupons."
    roles: [BillingAgent]
    code: 200
    input: []
    output: BillingInvoice
    side_effects: ["pending balances reversed; money fields reset; coupons detached; owning tickets back to billing_status UNBILLED; status = DRAFT; increments version by 1"]

  # --------------------------------------------------------------------- Memo
  - method: POST
    path: "/interline/rejection-memos"
    description: "Raise a stage-1 rejection memo against one coupon of a cleared invoice. OCC-guarded on the invoice's version."
    roles: [BillingAgent]
    code: 201
    input: [invoice_id, coupon_id, amount_minor, reason_code, expected_invoice_version]
    output: RejectionMemo
    side_effects: ["status = RAISED; stage = 1; raised_by_carrier_id copied from the invoice's billed_carrier_id; raised_at stamped; adds amount_minor to invoice.disputed_amount_minor; increments BillingInvoice.version by 1"]

  - method: GET
    path: "/interline/rejection-memos/{id}"
    description: "Read one memo with its live age_days and aging_bucket."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: RejectionMemo
    side_effects: []

  - method: GET
    path: "/interline/rejection-memos"
    description: "List memos filtered by invoice, coupon, raising carrier, status or aging bucket."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["invoice_id?", "coupon_id?", "raised_by_carrier_id?", "status?", "aging_bucket?", "limit?", "offset?"]
    output: RejectionMemo[]
    side_effects: []

  - method: POST
    path: "/interline/rejection-memos/{id}/counter"
    description: "Billing carrier counter-bills a raised memo, conceding part of the contested amount."
    roles: [BillingAgent]
    code: 200
    input: [counter_amount_minor, counter_reason]
    output: RejectionMemo
    side_effects: ["status = COUNTERED; counter fields written; disputed_amount_minor unchanged; increments RejectionMemo.version by 1"]

  - method: POST
    path: "/interline/rejection-memos/{id}/re-reject"
    description: "Billed carrier rejects the counter and opens the next negotiation round, capped at stage 3. OCC-guarded on the invoice's version."
    roles: [BillingAgent]
    code: 200
    input: [amount_minor, reason_code, expected_invoice_version]
    output: RejectionMemo
    side_effects: ["status = RAISED; stage incremented; amount and reason overwritten; counter fields reset; disputed_amount_minor adjusted by the delta; raised_at untouched; increments RejectionMemo.version and BillingInvoice.version by 1"]

  - method: POST
    path: "/interline/rejection-memos/{id}/accept"
    description: "Billing carrier accepts the rejection, firing the five-hop cascade through invoice, coupon, ticket and carrier. OCC-guarded on the invoice's version."
    roles: [BillingAgent]
    code: 200
    input: [expected_invoice_version]
    output: RejectionMemo
    side_effects: ["hops 1-5 as documented on RejectionMemo RAISED -> ACCEPTED; increments RejectionMemo.version, BillingInvoice.version, Coupon.version, Ticket.version and both Carrier.version by 1"]

  - method: POST
    path: "/interline/rejection-memos/{id}/withdraw"
    description: "Billed carrier drops its own memo; the disputed total shrinks and nothing else moves. OCC-guarded on the invoice's version."
    roles: [BillingAgent]
    code: 200
    input: [expected_invoice_version]
    output: RejectionMemo
    side_effects: ["status = WITHDRAWN; resolved_at stamped; disputed_amount_minor reduced; increments RejectionMemo.version and BillingInvoice.version by 1"]

  - method: POST
    path: "/interline/rejection-memos/{id}/escalate"
    description: "Either side pushes an exhausted or 90-day-aged memo into clearinghouse arbitration."
    roles: [BillingAgent]
    code: 200
    input: []
    output: RejectionMemo
    side_effects: ["status = ARBITRATION; increments RejectionMemo.version by 1"]

  - method: POST
    path: "/interline/rejection-memos/{id}/arbitrate"
    description: "Clearinghouse rules on an arbitrated memo. UPHELD fires the same five-hop cascade as an acceptance; DENIED only releases the disputed amount."
    roles: [ClearinghouseOperator]
    code: 200
    input: [ruling]
    output: RejectionMemo
    side_effects: ["status = RESOLVED_UPHELD or RESOLVED_DENIED; resolved_at stamped; cascade only on UPHELD; increments RejectionMemo.version and BillingInvoice.version by 1"]

  # ------------------------------------------------------------- Audit sample
  - method: POST
    path: "/interline/audit-samples"
    description: "Draw an undercharge audit sample from a closed period's invoiced coupons of one partner carrier."
    roles: [InterlineAuditor]
    code: 201
    input: [auditing_carrier_id, audited_carrier_id, settlement_period_id, claim_currency, sample_coupon_ids]
    output: AuditSample
    side_effects: ["derives and freezes population_coupon_count, population_allocated_minor, sampled_coupon_count and sampled_allocated_minor; status = DRAWN"]

  - method: GET
    path: "/interline/audit-samples/{id}"
    description: "Read one audit sample with its extrapolation figures."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: []

  - method: GET
    path: "/interline/audit-samples"
    description: "List audit samples filtered by auditing carrier, audited carrier, period or status."
    roles: [ClearinghouseOperator, RevenueAccountant, BillingAgent, InterlineAuditor]
    code: 200
    input: ["auditing_carrier_id?", "audited_carrier_id?", "settlement_period_id?", "status?", "limit?", "offset?"]
    output: AuditSample[]
    side_effects: []

  - method: POST
    path: "/interline/audit-samples/{id}/record-finding"
    description: "Record the audited correct allocation for one sampled coupon; the shortfall accumulates on the sample."
    roles: [InterlineAuditor]
    code: 200
    input: [coupon_id, correct_amount_minor]
    output: AuditSample
    side_effects: ["sampled_undercharge_minor and findings_count advanced; status = IN_REVIEW; increments version by 1"]

  - method: POST
    path: "/interline/audit-samples/{id}/close"
    description: "Close the sample: compute the ratio, coverage, haircut, cap and the resulting recovery claim."
    roles: [InterlineAuditor]
    code: 200
    input: []
    output: AuditSample
    side_effects: ["calculation undercharge_extrapolation; status = CLOSED_IMMATERIAL or CLAIM_RAISED; closed_at stamped; increments version by 1"]

  - method: POST
    path: "/interline/audit-samples/{id}/claim-decision"
    description: "Audited carrier accepts or denies the recovery claim; acceptance moves settled balances between the two carriers."
    roles: [BillingAgent]
    code: 200
    input: [decision]
    output: AuditSample
    side_effects: ["status = CLAIM_ACCEPTED or CLAIM_DENIED; on ACCEPT both carriers' settled balances move by claim_settlement_minor; increments version by 1"]

  # ------------------------------------------------------- Test-driving clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which stamps every flown_at, submitted_at, cleared_at, raised_at, closed_at and drives every window, aging and time-bar rule. Before the first call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ClearinghouseOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances or rewinds the logical clock; no entity is mutated"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_CARRIER_OWNERSHIP_REQUIRED
    http: 403
    condition: "an entity_backed role acts on a resource belonging to a carrier other than its own X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum member, malformed date, out-of-range integer or pagination argument"

  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "a carrier id in the path or body does not resolve"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "an agreement id in the path does not resolve"
  - id: ERR_TICKET_NOT_FOUND
    http: 404
    condition: "a ticket id in the path or body does not resolve"
  - id: ERR_COUPON_NOT_FOUND
    http: 404
    condition: "a coupon id in the path or body (including coupon_ids and sample_coupon_ids members) does not resolve"
  - id: ERR_PERIOD_NOT_FOUND
    http: 404
    condition: "a settlement-period id in the path or body does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "an invoice id in the path or body does not resolve"
  - id: ERR_MEMO_NOT_FOUND
    http: 404
    condition: "a rejection-memo id in the path does not resolve"
  - id: ERR_SAMPLE_NOT_FOUND
    http: 404
    condition: "an audit-sample id in the path does not resolve"

  - id: ERR_PERIOD_NOT_OPEN
    http: 409
    condition: "an invoice draft, submit, recall or a period close is attempted while the period is not OPEN"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "settle attempted on a period that is not CLOSED, or an audit sample drawn from a period still OPEN"
  - id: ERR_INVOICE_STATE_INVALID
    http: 409
    condition: "submit on a non-DRAFT invoice, or recall on a non-SUBMITTED invoice"
  - id: ERR_INVOICE_NOT_CLEARED
    http: 409
    condition: "a rejection memo is raised against an invoice whose status is not CLEARED or PARTIALLY_REJECTED"
  - id: ERR_MEMO_STATE_INVALID
    http: 409
    condition: "a memo action is attempted from a status the transition table does not allow"
  - id: ERR_COUPON_STATE_INVALID
    http: 409
    condition: "fly or void attempted on a coupon whose coupon_status is not OPEN"
  - id: ERR_TICKET_NOT_FINAL_PRORATED
    http: 409
    condition: "an invoice draft names a coupon whose ticket proration_status is not FINAL"
  - id: ERR_AGREEMENT_STATE_INVALID
    http: 409
    condition: "activate, suspend or factor creation attempted from a disallowed agreement status"
  - id: ERR_SAMPLE_STATE_INVALID
    http: 409
    condition: "record-finding, close or claim-decision attempted from a disallowed sample status"
  - id: ERR_CARRIER_STATE_INVALID
    http: 409
    condition: "suspend attempted on an already-suspended carrier, or reinstate on an active one"
  - id: ERR_TICKET_NOT_PRORATED
    http: 409
    condition: "void-proration attempted on a ticket whose proration_status is UNPRORATED"

  - id: ERR_CARRIER_SUSPENDED
    http: 409
    condition: "the carrier acting for its own account is SUSPENDED"
  - id: ERR_OPERATING_CARRIER_SUSPENDED
    http: 409
    condition: "a coupon is flown while its operating carrier is SUSPENDED"

  - id: ERR_AGREEMENT_PERIOD_OVERLAP
    http: 409
    condition: "activating an agreement whose closed-closed effective window touches or overlaps another ACTIVE or SUSPENDED agreement for the same ordered carrier pair"
  - id: ERR_PERIOD_WINDOW_OVERLAP
    http: 409
    condition: "creating a settlement period whose half-open window properly intersects another OPEN or CLOSED period"
  - id: ERR_MEMO_WINDOW_EXPIRED
    http: 409
    condition: "a memo is raised or re-rejected more than 45 whole days after the invoice was cleared"
  - id: ERR_ARBITRATION_NOT_ELIGIBLE
    http: 409
    condition: "escalate attempted on a memo below stage 3 and younger than 90 whole days"
  - id: ERR_AUDIT_TIME_BARRED
    http: 409
    condition: "the derived audit population contains a coupon flown more than 730 days before the current logical clock"

  - id: ERR_COUPON_NOT_ON_INVOICE
    http: 422
    condition: "the contested coupon is not attached to the invoice named in the memo"
  - id: ERR_COUPON_CARRIER_MISMATCH
    http: 422
    condition: "an attached coupon's operating carrier is not the billing carrier, or its ticket's validating carrier is not the billed carrier"
  - id: ERR_CURRENCY_MISMATCH
    http: 422
    condition: "invoice billing_currency, ProrateAgreement settlement_currency or audit claim_currency disagrees with the ticket's sale_currency"
  - id: ERR_COUPON_NOT_IN_SAMPLE
    http: 422
    condition: "a finding is recorded against a coupon that was not drawn into the sample"

  - id: ERR_DUPLICATE_TICKET_NUMBER
    http: 409
    condition: "ticket_number already exists"
  - id: ERR_COUPON_SEQUENCE_INVALID
    http: 422
    condition: "coupon_number is not exactly ticket.coupon_count + 1"
  - id: ERR_DUPLICATE_FACTOR_SECTOR
    http: 409
    condition: "the agreement already carries a factor for the same (origin, destination, class_of_service) triple"
  - id: ERR_FACTOR_FIELD_MISMATCH
    http: 422
    condition: "the factor value field supplied does not match the parent agreement_type, or more than one value field is supplied"
  - id: ERR_DUPLICATE_EXCHANGE_RATE
    http: 409
    condition: "a quote already exists for the same (from_currency, to_currency, effective_date) triple"
  - id: ERR_NO_PRORATABLE_COUPONS
    http: 422
    condition: "the requested run variant's coupon input set is empty"
  - id: ERR_MEMO_STAGE_EXHAUSTED
    http: 409
    condition: "re-reject attempted on a memo already at stage 3"
  - id: ERR_COUPON_ALREADY_INVOICED
    http: 409
    condition: "an invoice draft names a coupon already attached to another invoice, or a coupon that is not FLOWN or ADJUSTED"
  - id: ERR_EMPTY_AUDIT_POPULATION
    http: 422
    condition: "the derived audit population is empty"
  - id: ERR_COUPON_NOT_IN_POPULATION
    http: 422
    condition: "a sampled coupon id is not a member of the derived population"

  - id: ERR_SPA_OVERALLOCATION
    http: 422
    condition: "the off-the-top special-prorate amounts sum to more than the ticket fare"
  - id: ERR_MEMO_AMOUNT_EXCEEDS_COUPON
    http: 422
    condition: "the contested amount is larger than the coupon's current allocation"
  - id: ERR_MEMO_AMOUNT_EXCEEDS_INVOICE
    http: 422
    condition: "the contested amount would push the invoice's disputed plus rejected total above its total claim"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "submitting the invoice would push the billed carrier's net payable position above its credit limit"
  - id: ERR_NO_EXCHANGE_RATE
    http: 422
    condition: "no FX quote exists for the ordered currency pair at or before the anchor instant"

  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version does not match the invoice's current version"
  - id: ERR_STALE_TICKET_VERSION
    http: 412
    condition: "expected_ticket_version does not match the ticket's current version"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ClearinghouseOperator
    description: "IATA-clearing-house side operator. Owns the calendar, the FX table, agreement activation and arbitration rulings; never acts for a carrier's own account."
    identity: opaque
    exclusive_operations:
      - "POST /interline/carriers"
      - "POST /interline/carriers/{id}/suspend"
      - "POST /interline/carriers/{id}/reinstate"
      - "POST /interline/settlement-periods"
      - "POST /interline/settlement-periods/{id}/close"
      - "POST /interline/settlement-periods/{id}/settle"
      - "POST /interline/exchange-rates"
      - "POST /interline/prorate-agreements/{id}/activate"
      - "POST /interline/prorate-agreements/{id}/suspend"
      - "POST /interline/rejection-memos/{id}/arbitrate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: RevenueAccountant
    description: "Revenue-accounting desk of one carrier. Issues tickets, records coupons and flights, runs prorations and drafts outbound invoices for its own carrier only."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /interline/prorate-agreements"
      - "POST /interline/prorate-agreements/{id}/factors"
      - "POST /interline/tickets"
      - "POST /interline/tickets/{id}/coupons"
      - "POST /interline/coupons/{id}/fly"
      - "POST /interline/coupons/{id}/void"
      - "POST /interline/tickets/{id}/prorate"
      - "POST /interline/tickets/{id}/void-proration"
      - "POST /interline/billing-invoices"
    shared_operations:
      - "every GET endpoint"

  - name: BillingAgent
    description: "Interline billing desk of one carrier. Submits and recalls its own invoices, and drives every side of the rejection-memo cycle it is entitled to under segregation of duties."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /interline/billing-invoices/{id}/submit"
      - "POST /interline/billing-invoices/{id}/recall"
      - "POST /interline/rejection-memos"
      - "POST /interline/rejection-memos/{id}/counter"
      - "POST /interline/rejection-memos/{id}/re-reject"
      - "POST /interline/rejection-memos/{id}/accept"
      - "POST /interline/rejection-memos/{id}/withdraw"
      - "POST /interline/rejection-memos/{id}/escalate"
      - "POST /interline/audit-samples/{id}/claim-decision"
    shared_operations:
      - "every GET endpoint"

  - name: InterlineAuditor
    description: "Revenue-audit desk of one carrier. Draws undercharge samples against partner carriers, records findings and closes them into recovery claims; can never decide a claim, not even its own."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /interline/audit-samples"
      - "POST /interline/audit-samples/{id}/record-finding"
      - "POST /interline/audit-samples/{id}/close"
    shared_operations:
      - "every GET endpoint"
