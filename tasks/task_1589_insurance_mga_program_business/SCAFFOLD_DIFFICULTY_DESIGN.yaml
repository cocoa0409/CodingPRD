            - { call: "POST /mga/programs/${prog}/audits", payload: { scope: "CLAIMS", scheduled_start: "2026-10-15T00:00:00Z", scheduled_end: "2026-10-25T00:00:00Z" }, as: CarrierAuditor, captures: { audC: $.data.id } }
          assert:
            - "audit starting 2026-10-14 (gap 29 days after A's end 2026-09-15) rejected: error_id == ERR_AUDIT_WINDOW_GAP"
            - "audit starting 2026-10-15 (gap exactly 30) created SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: capacity_conserved_under_bind_then_flat_cancel
        grounds:
          - state_machines.Policy.QUOTED_to_BOUND
          - state_machines.Policy.PENDING_CANCELLATION_to_CANCELLED
          - entities.Program.fields.consumed_aggregate_cents
          - entities.CapacityAllocation.fields.consumed_cents
        distinguishing_aspect: |
          Conserved quantity = capacity cents at BOTH levels: bind(+155000) followed by
          flat cancel(-155000, earned 0) returns tranche.consumed_cents and
          program.consumed_aggregate_cents to their pre-bind values (0 and 0).
        test_recipe:
          setup:
            - "ACTIVE program (aggregate 500000, tranche 300000); policy gross 155000 bound"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier CI1", naic_code: "NAIC-CI1", contact_email: "uw@ci1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
