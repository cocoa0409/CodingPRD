scaffold_corner_design:

  # ===================================================================
  # Section: entities
  # ===================================================================
  - section: entities
    instances:
      - name: network_creation_applies_documented_defaults
        claim_type: defaults
        grounds:
          - entities.CareNetwork.fields.max_reassignment_count
          - entities.CareNetwork.fields.auto_accept_window_hours
          - entities.CareNetwork.fields.unresolved_aging_days
          - entities.CareNetwork.fields.network_escrow_cents
        distinguishing_aspect: "Omitting all optional network fields yields max_reassignment_count=3, auto_accept_window_hours=72, unresolved_aging_days=30, network_escrow_cents=0, network_escrow_reserved_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
          trigger:
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord" }
              as: NetworkCoordinator
              captures: { net_id: $.data.id }
          assert:
            - "CareNetwork.${net_id}.max_reassignment_count == 3"
            - "CareNetwork.${net_id}.auto_accept_window_hours == 72"
            - "CareNetwork.${net_id}.unresolved_aging_days == 30"
            - "CareNetwork.${net_id}.network_escrow_cents == 0"
            - "CareNetwork.${net_id}.network_escrow_reserved_cents == 0"

      - name: organization_created_pending_review_with_zero_balance
        claim_type: creation
        grounds:
          - entities.Organization.fields.status
          - entities.Organization.fields.payable_balance_cents
        distinguishing_aspect: "A freshly registered org starts PENDING_REVIEW with payable_balance_cents 0 and version 1, before any activation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
          trigger:
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
          assert:
            - "Organization.${r_id}.status == PENDING_REVIEW"
            - "Organization.${r_id}.payable_balance_cents == 0"
            - "Organization.${r_id}.version == 1"

      - name: client_optional_fields_default
        claim_type: defaults
        grounds:
          - entities.Client.fields.annual_income_cents
          - entities.Client.fields.race
          - entities.Client.fields.ethnicity
          - entities.Client.fields.language
          - entities.Client.fields.veteran_status
          - entities.Client.fields.open_referral_count
        distinguishing_aspect: "Omitting every optional client field yields annual_income_cents null, race/ethnicity UNDISCLOSED, language 'en', veteran_status false, open_referral_count 0."
        test_recipe:
          setup: ["Sender org exists so the CaseWorker identity resolves"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "MALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
          assert:
            - "Client.${k_id}.annual_income_cents == null"
            - "Client.${k_id}.race == UNDISCLOSED"
            - "Client.${k_id}.ethnicity == UNDISCLOSED"
            - "Client.${k_id}.language == en"
            - "Client.${k_id}.veteran_status == false"
            - "Client.${k_id}.open_referral_count == 0"

      - name: referral_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but unknown referral id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
          trigger:
            - call: "GET /care-network/referrals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: NetworkCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: consent_revoked_at_null_until_revoked
        claim_type: system_fields
        grounds:
          - entities.Consent.fields.revoked_at
          - state_machines.Consent.ACTIVE_to_REVOKED
        distinguishing_aspect: "revoked_at is null on creation and becomes the server clock value exactly at revocation; status flips ACTIVE -> REVOKED."
        test_recipe:
          setup: ["Two orgs (need not be ACTIVE) and a client; consent created ACTIVE"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "MINIMUM_NECESSARY" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c_id: $.data.id }
          trigger:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T12:00:00Z" }, as: NetworkCoordinator }
            - { call: "POST /care-network/consents/${c_id}/revoke", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
          assert:
            - "Consent.${c_id}.revoked_at was null before revoke (creation response)"
            - "Consent.${c_id}.status == REVOKED"
            - "Consent.${c_id}.revoked_at == 2026-09-10T12:00:00Z (server clock at revocation, not wall clock)"

  # ===================================================================
  # Section: state_machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: accept_draft_referral_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Referral
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ACCEPT is only valid from ROUTED; calling it on a DRAFT referral returns ERR_INVALID_STATE and leaves the referral DRAFT with no capacity reservation."
        test_recipe:
          setup: ["Referral RF created in DRAFT (never routed)"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord" }
              as: NetworkCoordinator
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - { call: "POST /care-network/organizations/${s_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${r_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals", capacity_total: 5 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_sr: $.data.id }
            - { call: "POST /care-network/agreements/${agr_sr}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_id: $.data.id }
          trigger:
            - call: "POST /care-network/referrals/${rf_id}/accept"
              payload: {}
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Referral.${rf_id}.status == DRAFT"
            - "ServiceOffering.${o_id}.capacity_consumed == 0"

      - name: review_terminal_claim_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.PaymentClaim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DENIED is terminal: a claim reviewed -> denied cannot be reviewed again; the second review returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full billing pipeline: completed 10-unit referral, claim CL reviewed by rev1 and denied by rev2"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord", network_escrow_cents: 100000 }
              as: NetworkCoordinator
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Funder F", org_type: "FUNDER", funder_type: "HEALTH_PLAN", ein: "EIN-F" }
              as: NetworkCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - { call: "POST /care-network/organizations/${f_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${s_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${f_id}/rate-cards"
              payload: { category_code: "FOOD", rate_cents_per_unit: 100 }
              as: FunderAdmin
              as_user_id: "${f_id}"
            - call: "POST /care-network/organizations/${r_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals", capacity_total: 5 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_sr: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${f_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_fr: $.data.id }
            - { call: "POST /care-network/agreements/${agr_sr}/approve", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/agreements/${agr_fr}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k_id: $.data.id }
            - call: "POST /care-network/clients/${k_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/accept", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/start-service", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf_id}/confirm-outcome", payload: { outcome_code: "DELIVERED", delivered_units: 10 }, as: OrgAdmin, as_user_id: "${r_id}" }
            - call: "POST /care-network/claims"
              payload: { referral_id: "${rf_id}", funder_org_id: "${f_id}", claimed_units: 10 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { cl_id: $.data.id }
            - { call: "POST /care-network/claims/${cl_id}/review", payload: {}, as: FunderAdmin, as_user_id: "${f_id}#rev1" }
            - { call: "POST /care-network/claims/${cl_id}/deny", payload: { reason: "insufficient documentation" }, as: FunderAdmin, as_user_id: "${f_id}#rev2" }
          trigger:
            - call: "POST /care-network/claims/${cl_id}/review"
              payload: {}
              as: FunderAdmin
              as_user_id: "${f_id}#rev1"
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "PaymentClaim.${cl_id}.status == DENIED"

      - name: retire_retired_category_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ServiceTaxonomyCategory
        distinguishing_aspect: "RETIRED is terminal for a category: a second retire call returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Category FOOD created and retired once"]
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
              captures: { cat_id: $.data.id }
            - { call: "POST /care-network/taxonomy/${cat_id}/retire", payload: {}, as: NetworkCoordinator }
          trigger:
            - call: "POST /care-network/taxonomy/${cat_id}/retire"
              payload: {}
              as: NetworkCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "ServiceTaxonomyCategory.${cat_id}.status == RETIRED"

  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: claim_provisional_tier_boundary_at_min_units
        claim_type: correct_result
        grounds:
          - calculations.claim_amount_quote
        distinguishing_aspect: "Tier boundary exactness on the PROVISIONAL quote: rate 100, min_units 5, tier2 80 — a 4-unit claim quotes 400 (base rate) while a 5-unit claim quotes 400 (5*80): the >= boundary flips the unit rate exactly at min_units."
        test_recipe:
          setup:
            - "Rate card rate 100, min_units 5, tier2 80, no cap; two completed referrals with 4 and 5 delivered units"
          setup_api_calls:
            - { call: "POST /care-network/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: NetworkCoordinator }
            - call: "POST /care-network/networks"
              payload: { name: "Net", coordinator_org_name: "Coord", network_escrow_cents: 100000 }
              as: NetworkCoordinator
            - call: "POST /care-network/taxonomy"
              payload: { code: "FOOD", name: "Food" }
              as: NetworkCoordinator
            - call: "POST /care-network/organizations"
              payload: { name: "Funder F", org_type: "FUNDER", funder_type: "HEALTH_PLAN", ein: "EIN-F" }
              as: NetworkCoordinator
              captures: { f_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Sender S", org_type: "CLINIC", ein: "EIN-S" }
              as: NetworkCoordinator
              captures: { s_id: $.data.id }
            - call: "POST /care-network/organizations"
              payload: { name: "Receiver R", org_type: "CBO", ein: "EIN-R" }
              as: NetworkCoordinator
              captures: { r_id: $.data.id }
            - { call: "POST /care-network/organizations/${f_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${s_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/organizations/${f_id}/rate-cards"
              payload: { category_code: "FOOD", rate_cents_per_unit: 100, min_units: 5, tier2_rate_cents_per_unit: 80 }
              as: FunderAdmin
              as_user_id: "${f_id}"
            - call: "POST /care-network/organizations/${r_id}/offerings"
              payload: { category_code: "FOOD", description: "Meals", capacity_total: 10 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_sr: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${f_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T00:00:00Z" }
              as: NetworkCoordinator
              captures: { agr_fr: $.data.id }
            - { call: "POST /care-network/agreements/${agr_sr}/approve", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/agreements/${agr_fr}/approve", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/clients"
              payload: { full_name: "K1", date_of_birth: "1990-01-01", zip_code: "94110", gender: "FEMALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /care-network/clients/${k1_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k1_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c1_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf1_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf1_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
            - { call: "POST /care-network/referrals/${rf1_id}/accept", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf1_id}/start-service", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf1_id}/confirm-outcome", payload: { outcome_code: "DELIVERED", delivered_units: 4 }, as: OrgAdmin, as_user_id: "${r_id}" }
            - call: "POST /care-network/clients"
              payload: { full_name: "K2", date_of_birth: "1985-06-15", zip_code: "94110", gender: "MALE" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { k2_id: $.data.id }
            - call: "POST /care-network/clients/${k2_id}/consents"
              payload: { sender_org_id: "${s_id}", receiver_org_id: "${r_id}", scope: "FULL" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /care-network/referrals"
              payload: { client_id: "${k2_id}", sender_org_id: "${s_id}", receiver_org_id: "${r_id}", service_offering_id: "${o_id}", consent_id: "${c2_id}", category_code: "FOOD" }
              as: CaseWorker
              as_user_id: "${s_id}"
              captures: { rf2_id: $.data.id }
            - { call: "POST /care-network/referrals/${rf2_id}/route", payload: {}, as: CaseWorker, as_user_id: "${s_id}" }
            - { call: "POST /care-network/referrals/${rf2_id}/accept", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf2_id}/start-service", payload: {}, as: OrgAdmin, as_user_id: "${r_id}" }
            - { call: "POST /care-network/referrals/${rf2_id}/confirm-outcome", payload: { outcome_code: "DELIVERED", delivered_units: 5 }, as: OrgAdmin, as_user_id: "${r_id}" }
          trigger:
            - call: "POST /care-network/claims"
              payload: { referral_id: "${rf1_id}", funder_org_id: "${f_id}", claimed_units: 4 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { cl1_id: $.data.id }
            - call: "POST /care-network/claims"
              payload: { referral_id: "${rf2_id}", funder_org_id: "${f_id}", claimed_units: 5 }
              as: OrgAdmin
              as_user_id: "${r_id}"
              captures: { cl2_id: $.data.id }
          assert:
            - "PaymentClaim.${cl1_id}.provisional_amount_cents == 400 (4 < min_units 5: base rate 100)"
            - "PaymentClaim.${cl2_id}.provisional_amount_cents == 400 (5 >= min_units 5: tier2 rate 80; boundary is inclusive of min_units)"

      - name: closure_rate_zero_referrals_yields_zero
