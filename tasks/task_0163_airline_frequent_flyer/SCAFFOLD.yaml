# =============================================================================
# Airline Frequent Flyer & Upgrade Program — scaffold v1
# =============================================================================

scenario: |
  Airline Frequent Flyer & Upgrade: segment accrual, Status Match, Tier annual
  threshold, priority upgrade waitlist, Award pricing (dynamic/fixed), companion
  certificate, points gifting, expiration.

domain_name: airline-frequent-flyer
api_prefix: /members

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - ops_run_checkpoint
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - cascading_side_effects
  entity_topology: hybrid
  # Member is the root; FlightSegment, PointsTransaction, CompanionCertificate
  # are children; Flight is a flat configuration peer; AwardBooking and
  # UpgradeRequest reference Member + Flight across aggregate boundaries.
  state_machine_shape: cyclic
  # Member.tier is cyclic (annual rollover can promote OR demote); AwardBooking
  # and StatusMatchRequest are branching; FlightSegment is branching with revert.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (no type prefix)" }
      - { name: email, type: string, source: input, description: "Unique member email (case-insensitive)" }
      - { name: display_name, type: string, source: input, description: "Member display name" }
      - { name: home_region, type: enum, source: input, description: "DOMESTIC | INTERNATIONAL — used by Award FIXED pricing", constraints: "DOMESTIC, INTERNATIONAL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | CLOSED", constraints: "ACTIVE, FROZEN, CLOSED", default: ACTIVE }
      - { name: tier, type: enum, source: computed, description: "BASIC | SILVER | GOLD | PLATINUM — derived at annual rollover or status match", constraints: "BASIC, SILVER, GOLD, PLATINUM", default: BASIC }
      - { name: tier_source, type: enum, source: computed, description: "EARNED | STATUS_MATCH — pins how the current tier was awarded", constraints: "EARNED, STATUS_MATCH", default: EARNED }
      - { name: tier_valid_through_year, type: integer, source: computed, description: "Inclusive last membership_year for which this tier holds (after rollover, this is set to the new year)" }
      - { name: points_balance, type: integer, source: computed, description: "Sum of non-expired ACCRUAL/GIFT_IN/BONUS minus REDEMPTION/GIFT_OUT/EXPIRATION ledger deltas — never negative" }
      - { name: current_year_qualifying_segments, type: integer, source: computed, description: "Count of FlightSegment.status == FLOWN with flown_year == current_membership_year" }
      - { name: current_year_qualifying_points, type: integer, source: computed, description: "Sum of PointsTransaction.qualifying_points where flown_year == current_membership_year and kind IN {ACCRUAL}" }
      - { name: current_membership_year, type: integer, source: computed, description: "Membership year derived from clock; integer year (e.g., 2026)" }
      - { name: last_activity_at, type: datetime, source: computed, description: "Most recent ACCRUAL, REDEMPTION, GIFT_IN, GIFT_OUT timestamp; used only for audit, NOT for expiration extension" }

  - name: Flight
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: flight_number, type: string, source: input, description: "Carrier flight number, e.g., AA123" }
      - { name: origin, type: string, source: input, description: "IATA airport code, 3 letters" }
      - { name: destination, type: string, source: input, description: "IATA airport code, 3 letters" }
      - { name: distance_miles, type: integer, source: input, description: "Great-circle distance, positive integer" }
      - { name: route_region, type: enum, source: input, description: "DOMESTIC | INTERNATIONAL — used by Award FIXED pricing", constraints: "DOMESTIC, INTERNATIONAL" }
      - { name: departure_at, type: datetime, source: input, description: "Scheduled departure, ISO 8601 UTC" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DEPARTED | CANCELLED", constraints: "SCHEDULED, DEPARTED, CANCELLED", default: SCHEDULED }
      - { name: base_fare_cents, type: integer, source: input, description: "Reference cash fare in cents; drives segment accrual" }
      - { name: capacity_economy, type: integer, source: input, description: "Seats in Economy cabin", default: 100 }
      - { name: capacity_business, type: integer, source: input, description: "Seats in Business cabin", default: 16 }
      - { name: capacity_first, type: integer, source: input, description: "Seats in First cabin", default: 4 }
      - { name: upgrade_inventory_business, type: integer, source: computed, description: "Number of Business seats currently available to award via upgrade (capacity_business - confirmed_business_segments - confirmed_business_upgrades)" }
      - { name: upgrade_inventory_first, type: integer, source: computed, description: "Same for First cabin" }
      - { name: load_factor, type: number, source: computed, description: "(confirmed segments across all cabins) / (capacity_economy + capacity_business + capacity_first); 0.0–1.0, rounded to 4 decimal places when serialised" }

  - name: FlightSegment
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "Owning Member.id" }
      - { name: flight_id, type: string, source: input, description: "Flight.id" }
      - { name: booked_cabin, type: enum, source: input, description: "ECONOMY | BUSINESS | FIRST — the cabin originally paid for", constraints: "ECONOMY, BUSINESS, FIRST" }
      - { name: flown_cabin, type: enum, source: computed, description: "Same as booked_cabin unless an UpgradeRequest CONFIRMED moved it up; recorded on FLOWN" }
      - { name: status, type: enum, source: system, description: "BOOKED | FLOWN | CANCELLED | REFUNDED", constraints: "BOOKED, FLOWN, CANCELLED, REFUNDED", default: BOOKED }
      - { name: flown_year, type: integer, source: computed, description: "Membership year in which Flight.departure_at falls; recorded at FLOWN" }
      - { name: qualifying_points_earned, type: integer, source: computed, description: "Points credited to current_year_qualifying_points on FLOWN (formula: segment_accrual)" }

  - name: PointsTransaction
    parent: Member
    common_fields: false  # immutable append-only ledger entry
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "Owning Member.id" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: kind, type: enum, source: system, description: "ACCRUAL | REDEMPTION | REDEMPTION_REFUND | GIFT_OUT | GIFT_IN | GIFT_FEE | EXPIRATION | STATUS_MATCH_BONUS | ADMIN_ADJUSTMENT", constraints: "ACCRUAL, REDEMPTION, REDEMPTION_REFUND, GIFT_OUT, GIFT_IN, GIFT_FEE, EXPIRATION, STATUS_MATCH_BONUS, ADMIN_ADJUSTMENT" }
      - { name: points_delta, type: integer, source: system, description: "Signed: positive for ACCRUAL/GIFT_IN/REDEMPTION_REFUND/STATUS_MATCH_BONUS/ADMIN_ADJUSTMENT(+); negative for REDEMPTION/GIFT_OUT/GIFT_FEE/EXPIRATION/ADMIN_ADJUSTMENT(-)" }
      - { name: qualifying_points, type: integer, source: system, description: "Non-zero only for ACCRUAL on FLOWN; counts toward current_year_qualifying_points" }
      - { name: posted_at, type: datetime, source: system, description: "Effective ledger timestamp; for ACCRUAL = Flight.departure_at, otherwise = created_at" }
      - { name: expires_at, type: datetime, source: system, description: "ACCRUAL only: posted_at + 24 months; null otherwise" }
      - { name: remaining_unredeemed, type: integer, source: computed, description: "ACCRUAL only: original points_delta less amounts consumed by later REDEMPTION/GIFT_OUT/EXPIRATION in FIFO order; null otherwise" }
      - { name: related_segment_id, type: string, source: system, description: "FlightSegment.id for ACCRUAL; nullable" }
      - { name: related_booking_id, type: string, source: system, description: "AwardBooking.id for REDEMPTION/REDEMPTION_REFUND; nullable" }
      - { name: related_certificate_id, type: string, source: system, description: "CompanionCertificate.id when redemption consumed a certificate; nullable" }
      - { name: counterparty_member_id, type: string, source: system, description: "Other Member.id for GIFT_OUT/GIFT_IN pairs; nullable" }
      - { name: idempotency_key, type: string, source: system, description: "Server-recorded idempotency key from request (for GIFT and REDEMPTION endpoints)" }

  - name: StatusMatchRequest
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "Owning Member.id" }
      - { name: competitor_program, type: string, source: input, description: "Free-text program name" }
      - { name: competitor_tier, type: enum, source: input, description: "BASIC | SILVER | GOLD | PLATINUM — claimed competitor tier", constraints: "BASIC, SILVER, GOLD, PLATINUM" }
      - { name: evidence_url, type: string, source: input, description: "URL pointing to evidence document" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | ACTIVE | EXPIRED | REJECTED", constraints: "PENDING, APPROVED, ACTIVE, EXPIRED, REJECTED", default: PENDING }
      - { name: granted_tier, type: enum, source: system, description: "Tier granted at approval; min(competitor_tier, PLATINUM); nullable until APPROVED" }
      - { name: granted_at, type: datetime, source: system, description: "Set when status moves PENDING→APPROVED" }
      - { name: activated_at, type: datetime, source: system, description: "Set when status moves APPROVED→ACTIVE (this is also when Member.tier flips)" }
      - { name: expires_at, type: datetime, source: system, description: "granted_at + 12 months; permanently bars new status-match for 36 months from granted_at" }
      - { name: cooling_off_until, type: datetime, source: system, description: "granted_at + 36 months — no new StatusMatchRequest may be APPROVED before this instant" }

  - name: UpgradeRequest
    parent: FlightSegment
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "Same as parent FlightSegment.member_id" }
      - { name: flight_segment_id, type: string, source: system, description: "Parent FlightSegment.id" }
      - { name: flight_id, type: string, source: system, description: "Denormalised Flight.id for inventory lookup" }
      - { name: target_cabin, type: enum, source: input, description: "BUSINESS | FIRST — must be strictly higher than booked_cabin", constraints: "BUSINESS, FIRST" }
      - { name: points_offered, type: integer, source: input, description: "Points the member offers; deducted on CONFIRMED, refunded on DENIED/EXPIRED" }
      - { name: status, type: enum, source: system, description: "WAITLISTED | CONFIRMED | DENIED | EXPIRED | CANCELLED", constraints: "WAITLISTED, CONFIRMED, DENIED, EXPIRED, CANCELLED", default: WAITLISTED }
      - { name: waitlist_join_seq, type: integer, source: system, description: "Flight+cabin scoped monotonic sequence assigned at creation; used as tie-break (lower seq wins on equal priority)" }
      - { name: priority_score, type: number, source: computed, description: "tier_rank*10_000_000 + points_offered - waitlist_join_seq; recomputed whenever member.tier or points_offered changes" }
      - { name: held_points, type: integer, source: computed, description: "Equals points_offered while WAITLISTED/CONFIRMED-pre-departure; 0 after DENIED/EXPIRED/CANCELLED" }

  - name: AwardBooking
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "Owning Member.id" }
      - { name: flight_id, type: string, source: input, description: "Flight.id being booked" }
      - { name: cabin, type: enum, source: input, description: "ECONOMY | BUSINESS | FIRST", constraints: "ECONOMY, BUSINESS, FIRST" }
      - { name: pricing_mode, type: enum, source: input, description: "DYNAMIC | FIXED — pinned at HELD; never re-evaluated", constraints: "DYNAMIC, FIXED" }
      - { name: points_cost, type: integer, source: computed, description: "Pinned at HELD via award_price calculation; immutable while booking remains HELD or CONFIRMED" }
      - { name: cash_taxes_cents, type: integer, source: input, description: "Taxes paid in cash; informational, not part of points conservation" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | CANCELLED | REFUNDED | EXPIRED", constraints: "HELD, CONFIRMED, CANCELLED, REFUNDED, EXPIRED", default: HELD }
      - { name: held_until, type: datetime, source: system, description: "created_at + 24 hours; HELD bookings auto-EXPIRE at this instant during sweep" }
      - { name: companion_certificate_id, type: string, source: input, description: "Optional CompanionCertificate.id consumed at CONFIRMED; nullable" }
      - { name: linked_segment_id, type: string, source: system, description: "FlightSegment.id created when this booking CONFIRMS" }

  - name: CompanionCertificate
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: member_id, type: string, source: system, description: "Owning Member.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESERVED | USED | EXPIRED | REVOKED", constraints: "ACTIVE, RESERVED, USED, EXPIRED, REVOKED", default: ACTIVE }
      - { name: issued_at, type: datetime, source: system, description: "Wall-clock instant of issuance" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + 12 months; the half-open validity window is [issued_at, expires_at)" }
      - { name: reserved_for_booking_id, type: string, source: system, description: "AwardBooking.id while status == RESERVED; nullable" }
      - { name: used_on_booking_id, type: string, source: system, description: "AwardBooking.id set when status flips RESERVED→USED" }
      - { name: issued_reason, type: enum, source: system, description: "TIER_REACHED_PLATINUM | ADMIN_GRANT", constraints: "TIER_REACHED_PLATINUM, ADMIN_GRANT" }

  - name: MembershipYear
    parent: Member
    common_fields: false  # immutable annual snapshot
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "Snapshot creation timestamp" }
      - { name: member_id, type: string, source: system, description: "Owning Member.id" }
      - { name: year, type: integer, source: system, description: "Calendar year (e.g., 2026); unique per member" }
      - { name: qualifying_segments_final, type: integer, source: system, description: "Frozen count at year-end rollover" }
      - { name: qualifying_points_final, type: integer, source: system, description: "Frozen sum at year-end rollover" }
      - { name: starting_tier, type: enum, source: system, description: "Tier at the start of this year (used as bonus_multiplier reference for the whole year)", constraints: "BASIC, SILVER, GOLD, PLATINUM" }
      - { name: awarded_tier, type: enum, source: system, description: "Tier derived at year-end rollover from (qualifying_segments_final, qualifying_points_final)", constraints: "BASIC, SILVER, GOLD, PLATINUM" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    field: tier
    initial_state: BASIC
    terminal_states: []   # cyclic — every tier can revert at annual rollover
    transitions:
      - from: BASIC
        to: SILVER
        trigger: "POST /_sweep/annual-rollover (qualifying threshold crossed) OR POST /members/{memberId}/status-match-requests/{rid}/activate (granted_tier == SILVER)"
        actor: system
        preconditions:
          - "qualifying_segments_final >= 25 OR qualifying_points_final >= 25000  (for rollover)"
          - "StatusMatchRequest.granted_tier == SILVER AND cooling_off_until of every prior matched request is in the past  (for activate)"
        side_effects:
          - "tier_source set to EARNED (rollover) or STATUS_MATCH (activate)"
          - "tier_valid_through_year set to current_membership_year"
          - "All UpgradeRequest rows for this member where status == WAITLISTED recompute priority_score"
      - from: SILVER
        to: GOLD
        trigger: "POST /_sweep/annual-rollover OR status-match activate"
        actor: system
        preconditions:
          - "qualifying_segments_final >= 50 OR qualifying_points_final >= 50000  (rollover)"
        side_effects:
          - "UpgradeRequest priority_score recompute"
      - from: GOLD
        to: PLATINUM
        trigger: "POST /_sweep/annual-rollover OR status-match activate"
        actor: system
        preconditions:
          - "qualifying_segments_final >= 100 OR qualifying_points_final >= 100000  (rollover) — boundary is >= 100000, NOT > 100000"
        side_effects:
          - "Auto-issue one CompanionCertificate with issued_reason=TIER_REACHED_PLATINUM (only on EARNED rollover, NOT on status_match activation)"
          - "UpgradeRequest priority_score recompute"
      # Downward / lateral cycles ON THE SAME ENTITY — this is what makes the machine cyclic.
      - from: PLATINUM
        to: GOLD
        trigger: "POST /_sweep/annual-rollover (failed PLATINUM threshold but met GOLD)"
        actor: system
        preconditions:
          - "qualifying_points_final < 100000 AND qualifying_segments_final < 100"
          - "qualifying_segments_final >= 50 OR qualifying_points_final >= 50000"
        side_effects:
          - "UpgradeRequest priority_score recompute"
      - from: PLATINUM
        to: SILVER
        trigger: "POST /_sweep/annual-rollover"
        actor: system
        preconditions:
          - "Failed PLATINUM and GOLD thresholds, met SILVER"
        side_effects: ["UpgradeRequest priority_score recompute"]
      - from: PLATINUM
        to: BASIC
        trigger: "POST /_sweep/annual-rollover"
        actor: system
        preconditions: ["Failed all thresholds"]
        side_effects: ["UpgradeRequest priority_score recompute"]
      - from: GOLD
        to: SILVER
        trigger: "POST /_sweep/annual-rollover"
        actor: system
        preconditions: ["qualifying < GOLD thresholds, met SILVER"]
        side_effects: ["UpgradeRequest priority_score recompute"]
      - from: GOLD
        to: BASIC
        trigger: "POST /_sweep/annual-rollover"
        actor: system
        preconditions: ["Failed all thresholds"]
        side_effects: ["UpgradeRequest priority_score recompute"]
      - from: SILVER
        to: BASIC
        trigger: "POST /_sweep/annual-rollover"
        actor: system
        preconditions: ["Failed all thresholds"]
        side_effects: ["UpgradeRequest priority_score recompute"]
      # Status-match expiry path can also demote — different trigger
      - from: [SILVER, GOLD, PLATINUM]
        to: BASIC
        trigger: "POST /_sweep/expire-status-matches (status_match expires_at reached AND tier_source == STATUS_MATCH AND no EARNED tier ever recorded)"
        actor: system
        preconditions:
          - "tier_source == STATUS_MATCH"
          - "now >= StatusMatchRequest.expires_at"
        side_effects:
          - "tier_source reverts to EARNED"
          - "UpgradeRequest priority_score recompute"

  - entity: FlightSegment
    field: status
    initial_state: BOOKED
    terminal_states: [REFUNDED, CANCELLED]
    transitions:
      - from: BOOKED
        to: FLOWN
        trigger: "POST /members/{memberId}/segments/{segmentId}/mark-flown (called after Flight.status == DEPARTED)"
        actor: BookingAgent
        preconditions:
          - "Flight.status == DEPARTED"
          - "Member.status == ACTIVE"
        side_effects:
          - "flown_cabin recorded (booked_cabin or upgraded cabin if any UpgradeRequest for this segment is CONFIRMED)"
          - "flown_year recorded as year(Flight.departure_at)"
          - "Append PointsTransaction kind=ACCRUAL with points_delta = qualifying_points_earned, expires_at = posted_at + 24 months"
          - "Member.points_balance += qualifying_points_earned"
          - "Member.current_year_qualifying_segments += 1"
          - "Member.current_year_qualifying_points += qualifying_points_earned"
          - "Any UpgradeRequest for this segment still in WAITLISTED transitions to EXPIRED"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /members/{memberId}/segments/{segmentId}/cancel (before Flight.status == DEPARTED)"
        actor: "Member or BookingAgent"
        preconditions: ["Flight.status == SCHEDULED"]
        side_effects:
          - "Any UpgradeRequest for this segment in WAITLISTED transitions to CANCELLED (held_points refunded)"
      - from: FLOWN
        to: REFUNDED
        trigger: "POST /members/{memberId}/segments/{segmentId}/refund (admin only)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Append PointsTransaction kind=ACCRUAL with NEGATIVE points_delta = -qualifying_points_earned (this is the only place a NEGATIVE ACCRUAL is produced) — see calculations.qualifying_segment_reversal for the conservation contract"
          - "Member.points_balance -= qualifying_points_earned"
          - "Member.current_year_qualifying_segments -= 1"
          - "Member.current_year_qualifying_points -= qualifying_points_earned"

  - entity: StatusMatchRequest
    field: status
    initial_state: PENDING
    terminal_states: [EXPIRED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /members/{memberId}/status-match-requests/{rid}/approve"
        actor: ProgramAdmin
        preconditions:
          - "No prior StatusMatchRequest of this member has cooling_off_until > now"
          - "Member.tier_source != STATUS_MATCH (no overlapping ACTIVE match)"
        side_effects:
          - "granted_tier = min(competitor_tier, PLATINUM)"
          - "granted_at = now, expires_at = granted_at + 12 months, cooling_off_until = granted_at + 36 months"
      - from: PENDING
        to: REJECTED
        trigger: "POST /members/{memberId}/status-match-requests/{rid}/reject"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /members/{memberId}/status-match-requests/{rid}/activate"
        actor: "Member or ProgramAdmin"
        preconditions:
          - "Member.tier < granted_tier (no downgrade via status match)"
        side_effects:
          - "Member.tier := granted_tier"
          - "Member.tier_source := STATUS_MATCH"
          - "Append PointsTransaction kind=STATUS_MATCH_BONUS, points_delta = STATUS_MATCH_BONUS_POINTS = 5000 (one-time goodwill)"
          - "All this member's UpgradeRequest in WAITLISTED recompute priority_score"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_sweep/expire-status-matches (now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "If Member.tier was granted by THIS request (tier_source == STATUS_MATCH) and Member has no EARNED tier ≥ granted_tier, Member.tier reverts toward EARNED tier_history (default BASIC)"

  - entity: UpgradeRequest
    field: status
    initial_state: WAITLISTED
    terminal_states: [DENIED, EXPIRED, CANCELLED]
    transitions:
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "POST /_sweep/promote-upgrades (called T-1 hour before Flight.departure_at) OR POST /upgrades/{rid}/confirm by ProgramAdmin"
        actor: system
        preconditions:
          - "Flight.upgrade_inventory_{target_cabin} > 0  — boundary check, >0, NOT >=1 (same number but the prose MUST say > 0)"
          - "This request has the highest priority_score among WAITLISTED requests for the same Flight+target_cabin"
          - "Member.tier >= GOLD  (cross-entity dependency on Member.tier)"
        side_effects:
          - "Append PointsTransaction kind=REDEMPTION, points_delta = -points_offered"
          - "Member.points_balance -= points_offered"
          - "Flight.upgrade_inventory_{target_cabin} -= 1"
          - "Parent FlightSegment.flown_cabin (on FLOWN) will be set to target_cabin"
      - from: WAITLISTED
        to: DENIED
        trigger: "POST /_sweep/promote-upgrades (member did not win and Flight.status flipped to DEPARTED)"
        actor: system
        preconditions: ["Flight.status == DEPARTED"]
        side_effects:
          - "held_points refunded (no ledger entry — held_points was never debited from points_balance)"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /upgrades/{rid}/cancel (by Member) OR parent FlightSegment cancelled"
        actor: "Member or system"
        preconditions: []
        side_effects:
          - "held_points refunded"
      - from: WAITLISTED
        to: EXPIRED
        trigger: "Parent FlightSegment.status flipped to FLOWN with this request still WAITLISTED"
        actor: system
        preconditions: []
        side_effects:
          - "held_points refunded"

  - entity: AwardBooking
    field: status
    initial_state: HELD
    terminal_states: [REFUNDED, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /members/{memberId}/award-bookings/{bookingId}/confirm"
        actor: Member
        preconditions:
          - "Member.points_balance >= points_cost"
          - "now < held_until"
          - "If companion_certificate_id is set: CompanionCertificate.status == RESERVED AND now < CompanionCertificate.expires_at AND certificate.member_id == this.member_id"
          - "Flight.status == SCHEDULED"
        side_effects:
          - "Append PointsTransaction kind=REDEMPTION, points_delta = -points_cost"
          - "Member.points_balance -= points_cost"
          - "Create FlightSegment in BOOKED status with booked_cabin = this.cabin; linked_segment_id set"
          - "If companion_certificate_id set: CompanionCertificate.status := USED, used_on_booking_id := this.id"
      - from: HELD
        to: EXPIRED
        trigger: "POST /_sweep/expire-bookings (now >= held_until)"
        actor: system
        preconditions: []
        side_effects:
          - "If companion_certificate_id was set: CompanionCertificate.status reverts RESERVED→ACTIVE (only if certificate is still within [issued_at, expires_at))"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /members/{memberId}/award-bookings/{bookingId}/cancel  (before Flight.departure_at)"
        actor: Member
        preconditions: ["Flight.status == SCHEDULED"]
        side_effects:
          - "Append PointsTransaction kind=REDEMPTION_REFUND, points_delta = +points_cost — this is the compensating action; the points_balance MUST return to its pre-confirm value"
          - "Member.points_balance += points_cost"
          - "linked FlightSegment.status := CANCELLED (cascading)"
          - "If companion_certificate_id was set AND now < CompanionCertificate.expires_at: CompanionCertificate.status reverts USED→ACTIVE; if now >= expires_at: certificate remains USED (it expired naturally)"
      - from: CANCELLED
        to: REFUNDED
        trigger: "system (immediate, in same transaction as CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CompanionCertificate
    field: status
    initial_state: ACTIVE
    terminal_states: [USED, EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: RESERVED
        trigger: "POST /members/{memberId}/award-bookings  with companion_certificate_id set (booking enters HELD)"
        actor: Member
        preconditions:
          - "now < this.expires_at (booking moment lies inside the half-open [issued_at, expires_at) window)"
          - "AwardBooking.member_id == this.member_id"
        side_effects:
          - "reserved_for_booking_id set"
      - from: RESERVED
        to: USED
        trigger: "AwardBooking transition HELD→CONFIRMED (cascading)"
        actor: system
        preconditions: []
        side_effects:
          - "used_on_booking_id := the booking's id"
      - from: RESERVED
        to: ACTIVE
        trigger: "AwardBooking HELD→EXPIRED (cascading) AND now < this.expires_at"
        actor: system
        preconditions: []
        side_effects: ["reserved_for_booking_id cleared"]
      - from: USED
        to: ACTIVE
        trigger: "AwardBooking CONFIRMED→CANCELLED (cascading) AND now < this.expires_at"
        actor: system
        preconditions: []
        side_effects: ["used_on_booking_id cleared"]
      - from: [ACTIVE, RESERVED]
        to: EXPIRED
        trigger: "POST /_sweep/expire-certificates (now >= this.expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "If RESERVED: parent AwardBooking remains HELD but companion_certificate_id is blocked (subsequent confirm will fail ERR_CERTIFICATE_EXPIRED)"
      - from: [ACTIVE, RESERVED]
        to: REVOKED
        trigger: "POST /members/{memberId}/certificates/{cid}/revoke"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two members confirm a HELD award booking on the same flight+cabin when only one seat remains in upgrade_inventory"
    guarantee: "First-writer-wins on Flight.upgrade_inventory_{cabin} decrement; loser receives ERR_UPGRADE_INVENTORY_EXHAUSTED"
    error_id: ERR_UPGRADE_INVENTORY_EXHAUSTED
    http_status: 409
    serialization: "First-writer-wins on Flight.upgrade_inventory_{cabin} field"

  - scenario: "Member confirms an award booking concurrently with admin cancelling the underlying Flight"
    guarantee: "Exactly one operation succeeds; if Flight.status flips to CANCELLED first, the booking confirm is rejected"
    error_id: ERR_FLIGHT_NOT_BOOKABLE
    http_status: 409
    serialization: "First-writer-wins on Flight.status"

  - scenario: "Member sends a gift while ops-run /_sweep/expire-points is running and would expire enough points to leave the balance negative"
    guarantee: "Expiration and gift serialize on Member.points_balance; loser receives ERR_INSUFFICIENT_POINTS"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 402
    serialization: "Sweep advances first if started first; gift first if started first. Tie-break: created_at on the request, then request_id ascending."

  - scenario: "Two gift requests with the same idempotency_key arrive concurrently for the same sender"
    guarantee: "At most one PointsTransaction GIFT_OUT is appended; the second is rejected"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    serialization: "Unique constraint on (member_id, idempotency_key) for PointsTransaction"

  - scenario: "Status-match approval races with a second status-match approval inside the 36-month cooling-off window"
    guarantee: "Exactly one approval succeeds; the second is rejected"
    error_id: ERR_STATUS_MATCH_COOLING_OFF
    http_status: 409
    serialization: "First-writer-wins on Member.tier_source flip to STATUS_MATCH"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: segment_accrual
    trigger: "FlightSegment BOOKED→FLOWN transition"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial formula with 4 inputs and nested min/max (mode (a))
      base_dollars = floor(Flight.base_fare_cents / 100)              # integer dollars
      fare_class_mult = {ECONOMY: 5, BUSINESS: 10, FIRST: 12}[flown_cabin]
      tier_bonus_mult = {BASIC: 1.0, SILVER: 1.25, GOLD: 1.5, PLATINUM: 2.0}[Member.tier_at_departure]
      raw = base_dollars * fare_class_mult * tier_bonus_mult
      # Per-segment cap = min(raw, MAX_PER_SEGMENT); also floor minimum 100 for any FLOWN segment
      qualifying_points_earned = max(MIN_PER_SEGMENT, min(MAX_PER_SEGMENT, floor(raw)))
    constants:
      ECONOMY_MULT: 5
      BUSINESS_MULT: 10
      FIRST_MULT: 12
      BASIC_BONUS: 1.0
      SILVER_BONUS: 1.25
      GOLD_BONUS: 1.5
      PLATINUM_BONUS: 2.0
      MIN_PER_SEGMENT: 100
      MAX_PER_SEGMENT: 50000
    precision: "Compute in IEEE-754 double, floor() to integer before applying min/max caps."
    input_set: "flown_cabin = FlightSegment.flown_cabin AT TIME OF FLOWN; tier_at_departure = Member.tier AT TIME OF FLOWN (NOT current tier at the moment of recomputation)"

  - name: award_price
    trigger: "AwardBooking creation (status set to HELD)"
    algorithm: dual_variant
    formula: |
      # Two valid pricing algorithms produce different points_cost for identical inputs.
      # The chosen mode is pinned in AwardBooking.pricing_mode at HELD and NEVER re-evaluated.
      if pricing_mode == DYNAMIC:
        # Combinatorial formula, ≥3 inputs, nested rate-tier selection (mode (a))
        base_rate = 5  # points per mile
        if   Flight.load_factor <  0.50: demand = 0.8
        elif Flight.load_factor <  0.80: demand = 1.0
        elif Flight.load_factor <  0.95: demand = 1.5
        else:                            demand = 2.0
        cabin_mult = {ECONOMY: 1.0, BUSINESS: 2.0, FIRST: 3.5}[cabin]
        points_cost = floor(Flight.distance_miles * base_rate * demand * cabin_mult)
      elif pricing_mode == FIXED:
        # Pure lookup table by region × cabin
        points_cost = FIXED_AWARD_TABLE[Flight.route_region][cabin]
    constants:
      BASE_RATE_PER_MILE: 5
      DYNAMIC_DEMAND_LOW: 0.8
      DYNAMIC_DEMAND_MED: 1.0
      DYNAMIC_DEMAND_HIGH: 1.5
      DYNAMIC_DEMAND_PEAK: 2.0
      DYNAMIC_DEMAND_THRESHOLDS: [0.50, 0.80, 0.95]   # half-open lower bounds
      CABIN_MULT_ECONOMY: 1.0
      CABIN_MULT_BUSINESS: 2.0
      CABIN_MULT_FIRST: 3.5
      FIXED_AWARD_TABLE:
        DOMESTIC:      { ECONOMY: 12500, BUSINESS: 25000, FIRST: 40000 }
        INTERNATIONAL: { ECONOMY: 30000, BUSINESS: 70000, FIRST: 110000 }
    precision: "DYNAMIC: floor() after the full product; FIXED: integer lookup, no arithmetic."
    variants:
      - name: dynamic_mode
        when: "AwardBooking.pricing_mode == DYNAMIC"
        difference: "Cost varies continuously with Flight.distance_miles, Flight.load_factor and cabin; same Member, same flight, different load_factor → different points_cost"
      - name: fixed_mode
        when: "AwardBooking.pricing_mode == FIXED"
        difference: "Cost depends ONLY on (route_region, cabin); load_factor and distance_miles are ignored; same lookup row always yields the same number"

  - name: tier_evaluation
    trigger: "Read on Member.tier (PROVISIONAL_PROJECTED) OR POST /_sweep/annual-rollover (FINAL_AWARDED)"
    algorithm: threshold
    formula: |
      # Variant FINAL_AWARDED (run by the annual rollover sweep, frozen into MembershipYear)
      seg  = MembershipYear.qualifying_segments_final
      pts  = MembershipYear.qualifying_points_final
      if   pts >= 100000 OR seg >= 100: awarded_tier = PLATINUM   # boundary is >=, NOT >
      elif pts >=  50000 OR seg >=  50: awarded_tier = GOLD
      elif pts >=  25000 OR seg >=  25: awarded_tier = SILVER
      else:                              awarded_tier = BASIC

      # Variant PROVISIONAL_PROJECTED (returned by GET /members/{id} as Member.projected_tier_eoy)
      # Projects to year-end using a linear pace: scale current YTD by (365 / days_elapsed_in_year)
      days_elapsed = day_of_year(now)
      projected_pts = floor(Member.current_year_qualifying_points * 365 / days_elapsed)
      projected_seg = floor(Member.current_year_qualifying_segments * 365 / days_elapsed)
      apply the same threshold ladder to (projected_pts, projected_seg)
    constants:
      SILVER_POINTS_THRESHOLD: 25000
      GOLD_POINTS_THRESHOLD:   50000
      PLATINUM_POINTS_THRESHOLD: 100000
      SILVER_SEGMENTS_THRESHOLD: 25
      GOLD_SEGMENTS_THRESHOLD:   50
      PLATINUM_SEGMENTS_THRESHOLD: 100
    precision: "Compare integers exactly. Comparison is >= (greater-than-or-equal); 99999 points does NOT reach the PLATINUM ladder."
    variants:
      - name: final_awarded
        when: "annual_rollover_sweep"
        difference: "Uses MembershipYear.{segments_final, points_final}; frozen, deterministic, drives Member.tier reassignment"
      - name: provisional_projected
        when: "Read on Member.projected_tier_eoy"
        difference: "Uses current YTD scaled linearly to year-end; informational only; never writes to Member.tier"

  - name: gift_transfer
    trigger: "POST /members/{senderId}/gifts (BookingAgent or sender Member)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): NESTED ROUNDING — order is pinned.
      # The fee is rounded FIRST (per-fee), then subtracted; "round-then-subtract" — NOT "subtract-then-round".
      sent_points = request.amount               # positive integer
      raw_fee = sent_points * GIFT_FEE_RATE       # may have a .5 cent equivalent fractional part
      fee_points = round_half_up(raw_fee)         # ← round per-fee FIRST
      delivered_points = sent_points - fee_points # ← then subtract

      # Then check ceilings/floors
      assert sent_points >= GIFT_MIN  # 1000
      assert sent_points <= GIFT_MAX_PER_DAY_PER_SENDER  # 50000 / sender / calendar-day-UTC
      # Three ledger entries are appended atomically in this order:
      #   1. GIFT_OUT on sender:  points_delta = -sent_points
      #   2. GIFT_FEE on sender:  points_delta = 0  (informational only; sent_points already includes fee)
      #   3. GIFT_IN  on recipient: points_delta = +delivered_points
      # Conserved quantity: sender.points_balance + recipient.points_balance + house_fee_pool = unchanged
      #   where house_fee_pool grows by fee_points.
    constants:
      GIFT_FEE_RATE: 0.10
      GIFT_MIN: 1000
      GIFT_MAX_PER_DAY_PER_SENDER: 50000
      ROUNDING: round_half_up
    precision: "round_half_up at the fee step. The 'round-then-subtract' order is mandatory: sent=2505 → fee=251 (half-up of 250.5), delivered=2254. 'Subtract-then-round' would yield 2255 — IMPLEMENTATIONS MUST NOT DO THIS."
    variants: []

  - name: points_expiration
    trigger: "POST /_sweep/expire-points (now is the wall-clock instant after the most recent /_clock/advance)"
    algorithm: chronological
    formula: |
      # FIFO over ACCRUAL ledger entries by posted_at ascending, tie-break by id ascending.
      # For each ACCRUAL with expires_at <= now AND remaining_unredeemed > 0:
      #   Append PointsTransaction kind=EXPIRATION, points_delta = -remaining_unredeemed,
      #   remaining_unredeemed := 0, Member.points_balance -= that amount.
      # REDEMPTION/GIFT_OUT/GIFT_FEE consume ACCRUAL buckets FIFO by posted_at, drawing down
      # remaining_unredeemed of the oldest non-empty bucket first.
      # NOTE: there is no "rolling expiration extension" — last_activity_at does NOT push expires_at out.
    constants:
      ACCRUAL_LIFETIME_MONTHS: 24
    precision: "Compare timestamps at millisecond precision; the boundary `expires_at` is INCLUSIVE — at the exact moment expires_at == now, the bucket is treated as expired (now >= expires_at)."

  - name: upgrade_priority_score
    trigger: "UpgradeRequest creation; Member.tier change; UpgradeRequest.points_offered patch; UpgradeRequest siblings' status change"
    algorithm: weighted_scoring
    formula: |
      # Combinatorial mode (c): the formula uses tier_rank (which is derived from Member.tier),
      # waitlist_join_seq (assigned by the system at creation, monotonic per Flight+target_cabin),
      # and points_offered. Evaluation order is pinned: tier_rank is computed FIRST from
      # Member.tier AT THIS MOMENT, then multiplied by 10_000_000, then points_offered added,
      # then waitlist_join_seq subtracted. This makes the score well-defined even though
      # priority_score and the recompute trigger reference each other transitively.
      tier_rank = {BASIC: 0, SILVER: 1, GOLD: 2, PLATINUM: 3}[Member.tier]
      priority_score = tier_rank * 10_000_000 + points_offered - waitlist_join_seq
      # Ranking on a Flight+target_cabin pool: sort by priority_score DESC, break ties by
      # waitlist_join_seq ASC (lower seq wins).
    constants:
      TIER_RANK_WEIGHT: 10_000_000
    precision: "Integer arithmetic; no rounding."

  - name: qualifying_segment_reversal
    trigger: "FlightSegment FLOWN→REFUNDED transition"
    algorithm: conservation_law
    formula: |
      # Compensating-action invariant for qualifying_segments:
      # let q0 = Member.current_year_qualifying_segments BEFORE FLOWN
      # let q1 = Member.current_year_qualifying_segments AFTER FLOWN
      # let q2 = Member.current_year_qualifying_segments AFTER REFUND
      # Invariant: q2 == q0  AND  Member.points_balance AFTER REFUND == points_balance BEFORE FLOWN
      # (modulo any other unrelated activity that happened in between, which is excluded from the test scenario)
    constants: {}
    precision: "Integer; exact."

  - name: points_balance_conservation
    trigger: "Read on Member.points_balance (always)"
    algorithm: aggregation
    formula: |
      # The single source of truth for Member.points_balance is the ledger.
      # Filter: PointsTransaction.member_id == Member.id
      # Time window: posted_at <= now (inclusive); EXPIRATION buckets included
      # Tie-break on equal posted_at: order by id ASC
      # Member.points_balance =
      #     sum(t.points_delta for t in PointsTransaction
      #         where t.kind IN {ACCRUAL, REDEMPTION_REFUND, GIFT_IN, STATUS_MATCH_BONUS, ADMIN_ADJUSTMENT+}
      #            OR t.kind IN {REDEMPTION, GIFT_OUT, EXPIRATION, ADMIN_ADJUSTMENT-})
      #   = sum of all points_delta (signed)
      # This identity MUST hold after every mutation including cascades.
    constants: {}
    precision: "Integer; exact."

# =============================================================================
# 1.4 Validation Rules Table (priority-ordered; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must have permission for this operation (RBAC matrix in §1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (member first, then nested child)"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_FLIGHT_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_UPGRADE_REQUEST_NOT_FOUND | ERR_STATUS_MATCH_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Target resource state allows this operation (e.g., AwardBooking must be HELD to confirm)"
    error_id: "ERR_BOOKING_NOT_HOLDABLE | ERR_BOOKING_NOT_CANCELLABLE | ERR_SEGMENT_NOT_FLYABLE | ERR_UPGRADE_NOT_WAITLISTED | ERR_STATUS_MATCH_NOT_PENDING | ERR_CERTIFICATE_NOT_USABLE | ERR_FLIGHT_NOT_BOOKABLE"
    http_status: 409
    applies_to: state-dependent operations
    note: "STATE BEATS FISCAL — see priority 7 vs priority 4 conflict in §1.8."

  - priority: 5
    category: business_referential
    check: "Cross-entity tier/role gating (e.g., UpgradeRequest target requires Member.tier >= GOLD; CompanionCertificate redemption requires Member.tier >= PLATINUM at issuance time)"
    error_id: "ERR_MEMBER_TIER_INELIGIBLE"
    http_status: 403
    applies_to: ["POST /upgrades", "POST /members/{m}/award-bookings/{b}/confirm  (when companion_certificate_id set)"]
    note: "REFERENTIAL BEATS CONSTRAINT — tier check fires before inventory check."

  - priority: 6
    category: business_temporal
    check: "Temporal-window checks: CompanionCertificate booking moment must lie in [issued_at, expires_at); StatusMatchRequest approval blocked while any prior cooling_off_until > now"
    error_id: "ERR_CERTIFICATE_EXPIRED | ERR_STATUS_MATCH_COOLING_OFF"
    http_status: 409
    applies_to: ["POST /members/{m}/award-bookings (companion case)", "POST /members/{m}/status-match-requests/{r}/approve"]

  - priority: 7
    category: business_constraint
    check: "Capacity / inventory / uniqueness — Flight.upgrade_inventory_{cabin} > 0; one ACTIVE StatusMatchRequest per member at a time; idempotency_key uniqueness"
    error_id: "ERR_UPGRADE_INVENTORY_EXHAUSTED | ERR_STATUS_MATCH_ALREADY_ACTIVE | ERR_IDEMPOTENCY_CONFLICT"
    http_status: 409
    applies_to: ["POST /upgrades", "POST /members/{m}/status-match-requests/{r}/approve", "POST /members/{m}/gifts"]

  - priority: 8
    category: business_fiscal
    check: "Points sufficiency — Member.points_balance >= cost; for gifts: sender.points_balance >= sent_points AND daily cap not exceeded"
    error_id: "ERR_INSUFFICIENT_POINTS | ERR_GIFT_DAILY_CAP_EXCEEDED"
    http_status: 402
    applies_to: ["POST /members/{m}/award-bookings/{b}/confirm", "POST /upgrades", "POST /members/{m}/gifts"]

  - priority: 9
    category: business_safety
    check: "Member.status guard — FROZEN or CLOSED members cannot accrue, redeem, gift, or be the recipient of gifts"
    error_id: "ERR_MEMBER_FROZEN | ERR_MEMBER_CLOSED"
    http_status: 403
    applies_to: ["mutation endpoints touching Member balance"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Members ---
  - { method: POST,   path: "/members",                             description: "Create a member",                              roles: [ProgramAdmin, BookingAgent], code: 201, input: [email, display_name, home_region],                                output: Member,                  side_effects: ["status=ACTIVE, tier=BASIC, tier_source=EARNED"] }
  - { method: GET,    path: "/members",                             description: "List members (paginated, filterable by tier)", roles: [ProgramAdmin],                code: 200, input: ["tier?, status?, limit?, offset?"],                                output: "Member[]",              side_effects: [] }
  - { method: GET,    path: "/members/{memberId}",                  description: "Get member; includes projected_tier_eoy",     roles: [Member, ProgramAdmin, BookingAgent], code: 200, input: [],                                                          output: Member,                  side_effects: ["Recompute Member.points_balance via points_balance_conservation"] }
  - { method: PATCH,  path: "/members/{memberId}",                  description: "Update mutable member fields",                  roles: [Member, ProgramAdmin],         code: 200, input: ["display_name?, home_region?, version?"],                          output: Member,                  side_effects: [] }
  - { method: POST,   path: "/members/{memberId}/freeze",           description: "Freeze a member (admin)",                       roles: [ProgramAdmin],                  code: 200, input: [],                                                                 output: Member,                  side_effects: ["status := FROZEN"] }
  - { method: POST,   path: "/members/{memberId}/unfreeze",         description: "Unfreeze a member (admin)",                     roles: [ProgramAdmin],                  code: 200, input: [],                                                                 output: Member,                  side_effects: ["status := ACTIVE"] }

  # --- Flights (configuration) ---
  - { method: POST,   path: "/flights",                             description: "Create a flight (admin only)",                  roles: [ProgramAdmin],                  code: 201, input: [flight_number, origin, destination, distance_miles, route_region, departure_at, base_fare_cents, "capacity_economy?, capacity_business?, capacity_first?"], output: Flight, side_effects: ["status=SCHEDULED"] }
  - { method: GET,    path: "/flights",                             description: "List flights",                                    roles: [Any],                           code: 200, input: ["status?, route_region?, limit?, offset?"],                        output: "Flight[]",              side_effects: [] }
  - { method: GET,    path: "/flights/{flightId}",                  description: "Get a flight (incl. load_factor, upgrade inventory)", roles: [Any],                       code: 200, input: [],                                                                output: Flight,                  side_effects: ["Recompute load_factor and upgrade_inventory_*"] }
  - { method: POST,   path: "/flights/{flightId}/depart",           description: "Mark flight DEPARTED (admin)",                  roles: [ProgramAdmin],                  code: 200, input: [],                                                                 output: Flight,                  side_effects: ["status := DEPARTED; triggers POST /_sweep/promote-upgrades implicitly on this flight"] }
  - { method: POST,   path: "/flights/{flightId}/cancel",           description: "Cancel a flight (admin)",                       roles: [ProgramAdmin],                  code: 200, input: [],                                                                 output: Flight,                  side_effects: ["status := CANCELLED; all FlightSegment for this flight in BOOKED → CANCELLED with cascading refunds"] }

  # --- Segments (member-owned) ---
  - { method: POST,   path: "/members/{memberId}/segments",         description: "Book a flight segment (cash purchase path)",    roles: [Member, BookingAgent],          code: 201, input: [flight_id, booked_cabin],                                          output: FlightSegment,           side_effects: ["status=BOOKED"] }
  - { method: GET,    path: "/members/{memberId}/segments",         description: "List a member's segments",                       roles: [Member, ProgramAdmin, BookingAgent], code: 200, input: ["status?, flown_year?, limit?, offset?"],                   output: "FlightSegment[]",       side_effects: [] }
  - { method: POST,   path: "/members/{memberId}/segments/{segmentId}/mark-flown", description: "Mark segment as flown",       roles: [BookingAgent, ProgramAdmin],    code: 200, input: [],                                                                 output: FlightSegment,           side_effects: ["FlightSegment BOOKED→FLOWN cascade per §1.2"] }
  - { method: POST,   path: "/members/{memberId}/segments/{segmentId}/cancel",     description: "Cancel segment before departure", roles: [Member, BookingAgent],     code: 200, input: [],                                                                 output: FlightSegment,           side_effects: ["BOOKED→CANCELLED; any waitlisted UpgradeRequest on this segment → CANCELLED"] }
  - { method: POST,   path: "/members/{memberId}/segments/{segmentId}/refund",     description: "Refund a flown segment (admin)",  roles: [ProgramAdmin],                  code: 200, input: [],                                                                 output: FlightSegment,           side_effects: ["FLOWN→REFUNDED cascade per §1.2; qualifying_segment_reversal invariant must hold"] }

  # --- Upgrade Requests ---
  - { method: POST,   path: "/members/{memberId}/segments/{segmentId}/upgrade-requests", description: "Create an upgrade request on a booked segment", roles: [Member, BookingAgent], code: 201, input: [target_cabin, points_offered],                                     output: UpgradeRequest,          side_effects: ["status=WAITLISTED, waitlist_join_seq assigned, priority_score computed"] }
  - { method: GET,    path: "/members/{memberId}/upgrade-requests",                description: "List a member's upgrade requests",      roles: [Member, ProgramAdmin], code: 200, input: ["status?, flight_id?, limit?, offset?"],                            output: "UpgradeRequest[]",     side_effects: [] }
  - { method: PATCH,  path: "/upgrades/{upgradeRequestId}",                        description: "Increase or decrease points_offered (must be WAITLISTED)", roles: [Member], code: 200, input: [points_offered, "version?"],                                       output: UpgradeRequest,          side_effects: ["priority_score recomputed"] }
  - { method: POST,   path: "/upgrades/{upgradeRequestId}/cancel",                 description: "Cancel a waitlisted upgrade request",   roles: [Member],                code: 200, input: [],                                                                 output: UpgradeRequest,          side_effects: ["status → CANCELLED, held_points refunded"] }
  - { method: POST,   path: "/upgrades/{upgradeRequestId}/confirm",                description: "Admin override: confirm an upgrade",     roles: [ProgramAdmin],          code: 200, input: [],                                                                 output: UpgradeRequest,          side_effects: ["status → CONFIRMED, inventory decremented, points debited"] }

  # --- Award Bookings ---
  - { method: POST,   path: "/members/{memberId}/award-bookings",                  description: "Create an award booking in HELD",       roles: [Member, BookingAgent], code: 201, input: [flight_id, cabin, pricing_mode, "cash_taxes_cents?, companion_certificate_id?"], output: AwardBooking, side_effects: ["status=HELD, points_cost pinned via award_price, held_until = created_at+24h, optional certificate ACTIVE→RESERVED"] }
  - { method: GET,    path: "/members/{memberId}/award-bookings",                  description: "List a member's award bookings",        roles: [Member, ProgramAdmin, BookingAgent], code: 200, input: ["status?, flight_id?, limit?, offset?"],                   output: "AwardBooking[]",       side_effects: [] }
  - { method: GET,    path: "/members/{memberId}/award-bookings/{bookingId}",      description: "Get a single award booking",            roles: [Member, ProgramAdmin, BookingAgent], code: 200, input: [],                                                            output: AwardBooking,          side_effects: [] }
  - { method: POST,   path: "/members/{memberId}/award-bookings/{bookingId}/confirm", description: "Confirm a HELD booking",             roles: [Member],                code: 200, input: [],                                                                 output: AwardBooking,          side_effects: ["HELD→CONFIRMED cascade (segment created, points debited, certificate USED if reserved)"] }
  - { method: POST,   path: "/members/{memberId}/award-bookings/{bookingId}/cancel",  description: "Cancel a CONFIRMED booking before departure", roles: [Member],   code: 200, input: [],                                                                 output: AwardBooking,          side_effects: ["CONFIRMED→CANCELLED→REFUNDED cascade (points refunded, certificate restored if before expiry)"] }

  # --- Companion Certificates ---
  - { method: GET,    path: "/members/{memberId}/certificates",                    description: "List a member's certificates",          roles: [Member, ProgramAdmin], code: 200, input: ["status?, limit?, offset?"],                                        output: "CompanionCertificate[]", side_effects: [] }
  - { method: POST,   path: "/members/{memberId}/certificates",                    description: "Admin-grant a certificate",              roles: [ProgramAdmin],          code: 201, input: [],                                                                 output: CompanionCertificate,   side_effects: ["status=ACTIVE, issued_reason=ADMIN_GRANT, expires_at = now+12mo"] }
  - { method: POST,   path: "/members/{memberId}/certificates/{certId}/revoke",   description: "Revoke a certificate (admin)",          roles: [ProgramAdmin],          code: 200, input: [],                                                                 output: CompanionCertificate,   side_effects: ["status → REVOKED"] }

  # --- Status Match ---
  - { method: POST,   path: "/members/{memberId}/status-match-requests",           description: "Submit a status-match request",         roles: [Member],                code: 201, input: [competitor_program, competitor_tier, evidence_url],                output: StatusMatchRequest,     side_effects: ["status=PENDING"] }
  - { method: GET,    path: "/members/{memberId}/status-match-requests",           description: "List status-match requests",            roles: [Member, ProgramAdmin], code: 200, input: ["status?, limit?, offset?"],                                        output: "StatusMatchRequest[]", side_effects: [] }
  - { method: POST,   path: "/members/{memberId}/status-match-requests/{rid}/approve", description: "Approve a pending request",        roles: [ProgramAdmin],          code: 200, input: [],                                                                 output: StatusMatchRequest,     side_effects: ["status → APPROVED, granted_tier/granted_at/expires_at/cooling_off_until set"] }
  - { method: POST,   path: "/members/{memberId}/status-match-requests/{rid}/reject",  description: "Reject a pending request",        roles: [ProgramAdmin],          code: 200, input: [],                                                                 output: StatusMatchRequest,     side_effects: ["status → REJECTED"] }
  - { method: POST,   path: "/members/{memberId}/status-match-requests/{rid}/activate", description: "Activate an approved request (member-initiated tier flip)", roles: [Member, ProgramAdmin], code: 200, input: [],                                                                 output: StatusMatchRequest,     side_effects: ["APPROVED→ACTIVE, Member.tier and tier_source flipped, STATUS_MATCH_BONUS posted"] }

  # --- Points: gifting, ledger view ---
  - { method: POST,   path: "/members/{senderId}/gifts",                            description: "Gift points to another member",         roles: [Member, BookingAgent],  code: 201, input: [recipient_member_id, amount, idempotency_key],                     output: "PointsTransaction[]",  side_effects: ["Three PointsTransactions appended atomically (GIFT_OUT, GIFT_FEE, GIFT_IN) per calculations.gift_transfer"] }
  - { method: GET,    path: "/members/{memberId}/points-transactions",              description: "List a member's ledger entries",         roles: [Member, ProgramAdmin], code: 200, input: ["kind?, since?, until?, limit?, offset?"],                          output: "PointsTransaction[]",  side_effects: [] }
  - { method: POST,   path: "/members/{memberId}/points-transactions/adjustments",  description: "Admin manual adjustment",                roles: [ProgramAdmin],         code: 201, input: [points_delta, reason],                                              output: PointsTransaction,      side_effects: ["Append ADMIN_ADJUSTMENT; points_balance updated"] }

  # --- Membership Years (audit) ---
  - { method: GET,    path: "/members/{memberId}/membership-years",                 description: "List a member's annual snapshots",       roles: [Member, ProgramAdmin], code: 200, input: ["limit?, offset?"],                                                output: "MembershipYear[]",     side_effects: [] }

  # --- Test-driving endpoints (REQUIRED — see §1.5 design principle) ---
  - { method: POST,   path: "/_clock/advance",                                      description: "Advance the system clock by an interval",  roles: [ProgramAdmin],         code: 200, input: [by_seconds],                                                       output: "{ current_time: datetime }", side_effects: ["Wall-clock used by sweeps and expiration checks moves forward"] }
  - { method: POST,   path: "/_sweep/expire-points",                                description: "Run the FIFO points-expiration sweep",   roles: [ProgramAdmin],         code: 200, input: [],                                                                 output: "{ expired_count: integer }", side_effects: ["For every ACCRUAL with expires_at <= now AND remaining_unredeemed > 0: append EXPIRATION, debit balance"] }
  - { method: POST,   path: "/_sweep/expire-bookings",                              description: "Expire HELD bookings past held_until",   roles: [ProgramAdmin],         code: 200, input: [],                                                                 output: "{ expired_count: integer }", side_effects: ["HELD→EXPIRED; if certificate RESERVED → ACTIVE (if still valid)"] }
  - { method: POST,   path: "/_sweep/expire-certificates",                          description: "Expire certificates past expires_at",     roles: [ProgramAdmin],         code: 200, input: [],                                                                 output: "{ expired_count: integer }", side_effects: ["ACTIVE/RESERVED → EXPIRED for any certificate with expires_at <= now"] }
  - { method: POST,   path: "/_sweep/expire-status-matches",                        description: "Expire ACTIVE status-match grants",        roles: [ProgramAdmin],         code: 200, input: [],                                                                 output: "{ expired_count: integer }", side_effects: ["ACTIVE→EXPIRED; member tier may revert"] }
  - { method: POST,   path: "/_sweep/promote-upgrades",                             description: "Run the upgrade waitlist sweep on a flight", roles: [ProgramAdmin],     code: 200, input: ["flight_id?"],                                                     output: "{ promoted_count: integer }", side_effects: ["For each Flight+target_cabin: sort WAITLISTED by priority_score DESC then waitlist_join_seq ASC; top upgrade_inventory_{cabin} → CONFIRMED, rest → DENIED on flight depart"] }
  - { method: POST,   path: "/_sweep/annual-rollover",                              description: "Run year-end rollover for all members",   roles: [ProgramAdmin],         code: 200, input: [target_year],                                                      output: "{ rolled_count: integer }",   side_effects: ["For each Member: freeze MembershipYear; recompute Member.tier via tier_evaluation FINAL_AWARDED; PLATINUM EARNED → auto-issue CompanionCertificate; current_year_qualifying_* reset to 0"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Request shape / auth ---
  - { id: ERR_INVALID_REQUEST,                          http: 400, condition: "Malformed body, missing required field, type mismatch" }
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER,   http: 400, condition: "X-User-ID or X-User-Role header missing or unparseable" }
  - { id: ERR_FORBIDDEN,                                http: 403, condition: "Authenticated role lacks permission for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH,                       http: 403, condition: "Member role acting on a resource they do not own (member_id mismatch)" }

  # --- Existence ---
  - { id: ERR_MEMBER_NOT_FOUND,                         http: 404, condition: "Member.id in path or body does not exist" }
  - { id: ERR_FLIGHT_NOT_FOUND,                         http: 404, condition: "Flight.id does not exist" }
  - { id: ERR_SEGMENT_NOT_FOUND,                        http: 404, condition: "FlightSegment.id does not exist or not owned by the path member" }
  - { id: ERR_BOOKING_NOT_FOUND,                        http: 404, condition: "AwardBooking.id does not exist or not owned by the path member" }
  - { id: ERR_CERTIFICATE_NOT_FOUND,                    http: 404, condition: "CompanionCertificate.id does not exist or not owned by the path member" }
  - { id: ERR_UPGRADE_REQUEST_NOT_FOUND,                http: 404, condition: "UpgradeRequest.id does not exist" }
  - { id: ERR_STATUS_MATCH_REQUEST_NOT_FOUND,           http: 404, condition: "StatusMatchRequest.id does not exist or not owned by the path member" }

  # --- State conflicts ---
  - { id: ERR_BOOKING_NOT_HOLDABLE,                     http: 409, condition: "AwardBooking not in HELD state for confirm/cancel-via-confirm path" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE,                  http: 409, condition: "AwardBooking not in CONFIRMED state for cancel path, or Flight already DEPARTED" }
  - { id: ERR_SEGMENT_NOT_FLYABLE,                      http: 409, condition: "FlightSegment.status != BOOKED, or Flight.status != DEPARTED, when mark-flown is called" }
  - { id: ERR_SEGMENT_NOT_REFUNDABLE,                   http: 409, condition: "FlightSegment.status != FLOWN when refund is called" }
  - { id: ERR_UPGRADE_NOT_WAITLISTED,                   http: 409, condition: "UpgradeRequest not in WAITLISTED state for cancel/patch/confirm-by-admin" }
  - { id: ERR_STATUS_MATCH_NOT_PENDING,                 http: 409, condition: "StatusMatchRequest not in PENDING state for approve/reject" }
  - { id: ERR_STATUS_MATCH_NOT_APPROVED,                http: 409, condition: "StatusMatchRequest not in APPROVED state for activate" }
  - { id: ERR_CERTIFICATE_NOT_USABLE,                   http: 409, condition: "CompanionCertificate not in ACTIVE state when reservation attempted" }
  - { id: ERR_FLIGHT_NOT_BOOKABLE,                      http: 409, condition: "Flight.status != SCHEDULED for any booking/upgrade attempt" }
  - { id: ERR_FLIGHT_NOT_CANCELLABLE,                   http: 409, condition: "Flight.status != SCHEDULED when admin attempts /cancel" }

  # --- Cross-entity referential ---
  - { id: ERR_MEMBER_TIER_INELIGIBLE,                   http: 403, condition: "Member.tier below the minimum required by this operation (e.g., UpgradeRequest needs >= GOLD, companion redemption needs >= PLATINUM)" }
  - { id: ERR_TARGET_CABIN_NOT_UPGRADE,                 http: 409, condition: "UpgradeRequest.target_cabin not strictly above FlightSegment.booked_cabin" }
  - { id: ERR_BOOKING_FLIGHT_MISMATCH,                  http: 409, condition: "AwardBooking.flight_id references a flight in a state that disallows booking" }

  # --- Temporal-window ---
  - { id: ERR_CERTIFICATE_EXPIRED,                      http: 409, condition: "CompanionCertificate.expires_at <= now at reservation or confirm time" }
  - { id: ERR_STATUS_MATCH_COOLING_OFF,                 http: 409, condition: "Prior StatusMatchRequest.cooling_off_until > now blocks approval" }
  - { id: ERR_STATUS_MATCH_ALREADY_ACTIVE,              http: 409, condition: "Member already has an ACTIVE StatusMatchRequest" }
  - { id: ERR_HELD_UNTIL_PASSED,                        http: 409, condition: "AwardBooking.held_until <= now at confirm time" }

  # --- Constraint / inventory / uniqueness ---
  - { id: ERR_UPGRADE_INVENTORY_EXHAUSTED,              http: 409, condition: "Flight.upgrade_inventory_{target_cabin} == 0 at confirm-by-admin time" }
  - { id: ERR_IDEMPOTENCY_CONFLICT,                     http: 409, condition: "Repeated (member_id, idempotency_key) with different payload on gift" }
  - { id: ERR_EMAIL_CONFLICT,                           http: 409, condition: "Member email already in use (case-insensitive)" }
  - { id: ERR_VERSION_CONFLICT,                         http: 409, condition: "Optimistic-concurrency version mismatch on PATCH" }

  # --- Fiscal (points) ---
  - { id: ERR_INSUFFICIENT_POINTS,                      http: 402, condition: "Member.points_balance < required points_cost / points_offered / sent_points" }
  - { id: ERR_GIFT_DAILY_CAP_EXCEEDED,                  http: 402, condition: "Sender would exceed GIFT_MAX_PER_DAY_PER_SENDER if this gift were appended" }
  - { id: ERR_GIFT_BELOW_MINIMUM,                       http: 400, condition: "Gift amount < GIFT_MIN (1000)" }

  # --- Safety / status ---
  - { id: ERR_MEMBER_FROZEN,                            http: 403, condition: "Mutation attempted on FROZEN member" }
  - { id: ERR_MEMBER_CLOSED,                            http: 403, condition: "Mutation attempted on CLOSED member" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "End-user. X-User-ID is a Member.id. Can act only on their own resources."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{memberId}/status-match-requests"
      - "POST /upgrades/{upgradeRequestId}/cancel  (own request only)"
      - "POST /members/{memberId}/award-bookings/{bookingId}/confirm"
      - "POST /members/{memberId}/award-bookings/{bookingId}/cancel"
      - "PATCH /upgrades/{upgradeRequestId}  (own request only)"
    shared_operations:
      - "POST /members/{memberId}/segments  (with BookingAgent)"
      - "POST /members/{memberId}/award-bookings  (with BookingAgent)"
      - "POST /members/{memberId}/gifts  (with BookingAgent acting on member's behalf)"
      - "GET endpoints on own resources"

  - name: BookingAgent
    description: "Travel-agent operator. Opaque identity, may book on behalf of any Member."
    identity: "opaque"
    exclusive_operations:
      - "POST /members/{memberId}/segments/{segmentId}/mark-flown"
    shared_operations:
      - "POST /members  (with ProgramAdmin)"
      - "POST /members/{memberId}/segments  (with Member)"
      - "POST /members/{memberId}/award-bookings  (with Member)"
      - "POST /members/{memberId}/gifts  (with Member)"

  - name: ProgramAdmin
    description: "Loyalty-program back-office operator. Opaque identity. Can approve status-matches, run sweeps, refund segments, freeze members."
    identity: "opaque"
    exclusive_operations:
      - "POST /flights"
      - "POST /flights/{flightId}/depart"
      - "POST /flights/{flightId}/cancel"
      - "POST /members/{memberId}/segments/{segmentId}/refund"
      - "POST /upgrades/{upgradeRequestId}/confirm"
      - "POST /members/{memberId}/status-match-requests/{rid}/approve"
      - "POST /members/{memberId}/status-match-requests/{rid}/reject"
      - "POST /members/{memberId}/certificates           (admin-grant)"
      - "POST /members/{memberId}/certificates/{cid}/revoke"
      - "POST /members/{memberId}/points-transactions/adjustments"
      - "POST /members/{memberId}/freeze"
      - "POST /members/{memberId}/unfreeze"
      - "POST /_clock/advance"
      - "POST /_sweep/*"
      - "GET  /members  (cross-member listing)"
    shared_operations:
      - "POST /members  (with BookingAgent)"
      - "POST /members/{memberId}/status-match-requests/{rid}/activate  (with Member)"
      - "GET endpoints"
