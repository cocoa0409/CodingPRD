              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Rattle", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 2, retail_value_cents: 1000, replacement_value_cents: 600 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-RBAC2-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-RBAC2-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/box-items/${it_id}/report-lost"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/box-items/${it_id}/fees"
              as: Member
              as_user_id: "${m_id}"
              captures: { f_id: "$.data[0].id" }
          trigger:
            - call: "POST /toy-rental/fees/${f_id}/waive"
              payload: { reason: "ops attempting waiver" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (HTTP 403); FeeAssessment.${f_id}.status remains INVOICED; no FEE_WAIVER ledger entry appended"

      - name: member_cannot_run_allocation_runs
        claim_type: role_denial
        grounds:
          - roles.OperationsManager
          - "errors[ERR_UNAUTHORIZED_ROLE]"
        distinguishing_aspect: "OperationsManager-exclusive ops checkpoint: a Member caller is denied ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["Member M registered"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.rbac3@x.com", full_name: "Rbac3 Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/ops/allocation-runs"
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED_ROLE (HTTP 403)"

  # =====================================================================
  # Section: cross-cutting complexity layers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: occ_plan_change_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[subscription-plan-change-stale-version]
        distinguishing_aspect: "OCC on Subscription.version: a plan change carrying the pre-mutation version succeeds and bumps version; replaying the same expected version then fails ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["Plans STD and PLUS exist; member M has a subscription on STD (version 1)"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_std: $.data.id }
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "PLUS", monthly_fee_cents: 8000, toys_per_box: 4, swap_allowance_per_cycle: 3, max_holds: 4, rotation_cadence_days: 21, rental_period_days: 21, buyout_discount_pct: 0.15 }
              as: PlatformAdmin
              captures: { plan_plus: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.occ1@x.com", full_name: "Occ1 Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_std}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - call: "PATCH /toy-rental/subscriptions/${s_id}/plan"
              payload: { plan_id: "${plan_plus}", expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "PATCH /toy-rental/subscriptions/${s_id}/plan"
              payload: { plan_id: "${plan_std}", expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH: 200, plan_id == ${plan_plus}, Subscription.version incremented to 2"
            - "Second PATCH with the same captured version: err == ERR_STALE_VERSION (HTTP 412); plan_id remains ${plan_plus}"

      - name: occ_item_add_stale_box_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[box-item-add-stale-box-version]
        distinguishing_aspect: "OCC on RotationBox.version: adding an item bumps the box version; a second add replaying the pre-add version fails ERR_STALE_VERSION 412, and succeeds once the caller re-reads the box."
        test_recipe:
          setup: ["Plan STD; member M with child born 2025-01-15; item X age [12,36] with NEW copies C1, C2; PLANNED box at version 1"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.occ2@x.com", full_name: "Occ2 Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-OCC2-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-OCC2-2", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c2}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "GET /toy-rental/rotation-boxes/${b_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { b_v_now: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c2}", expected_rotation_box_version: "${b_v_now}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_2: $.data.id }
          assert:
            - "Stale add: err == ERR_STALE_VERSION (HTTP 412); box still holds exactly 1 item (C1)"
            - "After re-read, the same add with the fresh version succeeds (201): BoxItem.${it_2} created; box holds 2 items; RotationBox.version == 3"

      - name: ops_run_expires_stale_hold_and_repromotes
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.WishlistEntry.HELD_to_EXPIRED
          - state_machines.WishlistEntry.WAITING_to_HELD
          - calculations.wishlist_allocation_selector
        distinguishing_aspect: "Epoch advance: an ops run after a hold's expiry flips it to EXPIRED, releases the copy, and immediately re-promotes the next eligible WAITING entry with a fresh 72h window — all in one checkpoint."
        test_recipe:
          setup:
            - "Plan STD (max_holds 2); item X age [12,36] with one NEW copy C1"
            - "Member B (child born 2025-01-15) entry rank 1 created first; member C (child born 2025-01-15) entry rank 1 created second"
            - "Run 1 at clock 2026-05-01T00:00:00Z promotes B (hold_expires_at 2026-05-04T00:00:00Z); clock advanced to 2026-05-05T00:00:00Z (past expiry)"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-EXP-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.expb@x.com", full_name: "ExpB Member", password: "pw" }
              as: Anonymous
              captures: { m_b: $.data.id }
            - call: "POST /toy-rental/members/${m_b}/children"
              payload: { name: "KidB", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /toy-rental/members/${m_b}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /toy-rental/members/${m_b}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_b}"
              captures: { e_b: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.expc@x.com", full_name: "ExpC Member", password: "pw" }
              as: Anonymous
              captures: { m_c: $.data.id }
            - call: "POST /toy-rental/members/${m_c}/children"
              payload: { name: "KidC", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_c}"
            - call: "POST /toy-rental/members/${m_c}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_c}"
            - call: "POST /toy-rental/members/${m_c}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_c}"
              captures: { e_c: $.data.id }
            - call: "POST /toy-rental/ops/allocation-runs"
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-rental/ops/allocation-runs"
              as: OperationsManager
              captures: { expired: $.data.expired_count, promoted: $.data.promoted_count, promoted_ids: $.data.promoted_entry_ids }
          assert:
            - "expired == 1 and promoted == 1 with promoted_ids == [${e_c}]"
            - "WishlistEntry.${e_b}.status == EXPIRED; WishlistEntry.${e_c}.status == HELD with held_copy_id == ${c1} and hold_expires_at == 2026-05-08T00:00:00Z (clock 2026-05-05 + 72h)"
            - "ToyCopy.${c1}.status == RESERVED with reserved_member_id == ${m_c}"

  # =====================================================================
  # Section: consistency model (immediate)
  # =====================================================================
  - section: consistency_model
    instances:
      - name: wallet_adjustment_immediately_visible
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.wallet_balance_reconciliation
        distinguishing_aspect: "Immediate consistency: a wallet adjustment's effects are visible in the SAME response and in the very next read — no lag, no reconciliation delay."
        test_recipe:
          setup: ["Member M registered (wallet 0)"]
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.cons@x.com", full_name: "Cons Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/members/${m_id}/wallet/adjustments"
              payload: { amount_cents: 250, reason: "PROMO_CREDIT", note: "instant" }
              as: CustomerService
            - call: "GET /toy-rental/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Adjustment response (201) returns the persisted CreditLedgerEntry with amount_cents == 250, reason == PROMO_CREDIT"
            - "Immediately following GET: Member.${m_id}.wallet_credit_cents == 250 (derived field already reconciled)"

      - name: waived_fee_wallet_reflected_immediately
        claim_type: immediate_visibility
        grounds: [calculations.wallet_balance_reconciliation]
        excluded_because:
          difficulty_instance: "compensating_invariant / wallet_charge_waive_conservation"
          rationale: "Charge+waive visibility and exact ledger sum are asserted in the difficulty probe."
