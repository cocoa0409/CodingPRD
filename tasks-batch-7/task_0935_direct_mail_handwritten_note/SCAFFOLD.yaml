  - method: GET
    path: "/mail/reprint-requests/{reprint_request_id}"
    description: "Read one reprint request."
    roles: [PlatformAdmin, CampaignManager, ListOperator, ProductionOperator]
    code: 200
    input: []
    output: ReprintRequest
    side_effects: []

  - method: GET
    path: "/mail/reprint-requests"
    description: "List reprint requests filtered by record, return event or campaign."
    roles: [PlatformAdmin, CampaignManager, ListOperator, ProductionOperator]
    code: 200
    input: ["list_record_id?", "return_event_id?", "campaign_id?", "status?", "limit?", "offset?"]
    output: ReprintRequest[]
