        distinguishing_aspect: |
          PurchaseAgreement carries TWO transitions to TERMINATED — one from ACTIVE
          (refunds PENDING deposits) and one from UNDER_CONTRACT (refunds CONFIRMED deposits,
          and requires has_material_defect=true on the title). The two from-states share an
          identical trigger endpoint but invoke disjoint side-effect sets and disjoint
          precondition sets. Two terminate-branches on PurchaseAgreement — a different
          entity from instance 1's ClosingDisclosure fork.
