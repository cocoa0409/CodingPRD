        distinguishing_aspect: "Two eligible courts tie at load_ratio 0; the selector resolves the tie by created_at ASC (never by id), so the reassignment lands on the earlier-created court B rather than the later-created court C."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Source court A (goal 4) has 1 pending non-detained case (backlog-critical: 1 >= ceil(0.25*4)). Courts B and C (goal 100 each, 0 pending) are both eligible; B was created first."
