scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sla_breach_credit_base_widens_on_onsite_variant
        grounds:
          - calculations.sla_breach_credit_cents
          - calculations.sla_breach_ratio_and_tier
          - calculations.device_overage_charge_cents
          - state_machines.Ticket.sla.WITHIN_to_BREACHED_FIRST_RESPONSE
          - state_machines.Ticket.sla.CREDITED_to_BREACHED_ONSITE
          - entities.ServiceCredit.fields.uncapped_amount_cents
        distinguishing_aspect: |
          Both breaches on this one ticket land in the SAME MINOR tier at the same
          5% rate, yet the first-response variant pays 500 (base = monthly_fee_cents
          9999) and the onsite variant pays 515 (base = 9999 + the 299 of overage
          booked this cycle) — the divergence is the credit BASE, on the
          Ticket/ServiceCredit money domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan with 24x7 coverage, monthly_fee_cents 9999, included_device_count 1, overage_fee_cents_per_device 299, P2 first-response target 120 minutes and P2 onsite target 48 hours (2880 minutes)."
            - "One household in region NWA with an OWNER member and an ACTIVE subscription whose allow_overage is true; cycle 1 runs 2026-05-01T00:00:00Z -> 2026-05-31T00:00:00Z."
            - "Two HUB devices claimed; the second one is an overage device that booked exactly 299 cents of overage into overage_charges_cents_this_cycle (30 of 30 days remaining)."
            - "One P2 ticket opened at 2026-05-01T00:00:00Z with first_response_target_minutes 120 and onsite_resolution_target_minutes 2880."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 1, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Alder House", region_code: "NWA", billing_email: "alder@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Ada Alder", email: "ada@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${pro_plan_id}", allow_overage: true }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_hub_id: $.data.id }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_hub_id}", serial_number: "HBX000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_hub_id}", serial_number: "HBX000002", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /smart-home-support/tickets"
              payload: { household_id: "${h_id}", severity: "P2", summary: "Hub keeps dropping offline", device_id: "${d1_id}", opened_by_member_id: "${own_id}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { t_id: $.data.id }
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T02:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /smart-home-support/tickets/${t_id}/first-response"
              payload: { note: "Agent picked up the case." }
              as: SupportAgent
              as_user_id: "agent-1"
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/tickets/${t_id}/sla-evaluate"
              payload: {}
              as: SupportAgent
              as_user_id: "agent-1"
          assert:
            - "Subscription.${sub_id}.overage_charges_cents_this_cycle == 299"
            - "the ServiceCredit row for Ticket.${t_id} with reason == SLA_FIRST_RESPONSE_BREACH has breach_tier == MINOR and uncapped_amount_cents == 500 and amount_cents == 500"
            - "the ServiceCredit row for Ticket.${t_id} with reason == SLA_ONSITE_BREACH has breach_tier == MINOR and uncapped_amount_cents == 515 and amount_cents == 515"
            - "Subscription.${sub_id}.credits_issued_cents_this_cycle == 1015"
            - "Subscription.${sub_id}.next_invoice_credit_cents == 1015"
            - "Ticket.${t_id}.sla_status == CREDITED"

      - name: addon_proration_mode_diverges_on_days_remaining
        grounds:
          - calculations.addon_proration_cents
          - calculations.addon_bundle_pricing
          - calculations.addon_install_credit_waterfall
          - calculations.addon_order_total_cents
          - entities.AddOnOrder.fields.proration_mode
          - concurrency_rules[addon-order-stale-subscription]
        distinguishing_aspect: |
          Two households with byte-identical plans, device counts and baskets
          produce different AddOnOrder.order_total_cents purely because
          days_remaining is 11 for one (MID_CYCLE_PRORATED -> 43241) and 3 for
          the other (NEXT_CYCLE_FULL -> 43095); this is the AddOnOrder/Subscription
          billing domain, not the ticket-credit domain of the other instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PLUS plan: monthly_fee_cents 4999, included_device_count 2, overage_fee_cents_per_device 399, BUSINESS_HOURS, included_install_credits 1."
            - "Catalog: a CAMERA at 12900 cents that does not require install, and a HUB at 24900 cents that does."
            - "Two identical households (A and B) in region NWA, each with an OWNER, a BILLING_ADMIN and an ACTIVE subscription created on 2026-05-01 with allow_overage true, so both cycles end 2026-05-31T00:00:00Z and both have install_credits_remaining 1 and entitled_device_count 0."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4999, included_device_count: 2, overage_fee_cents_per_device: 399, coverage_mode: "BUSINESS_HOURS", first_response_minutes_p1: 120, first_response_minutes_p2: 240, first_response_minutes_p3: 720, onsite_resolution_hours_p1: 48, onsite_resolution_hours_p2: 72, onsite_resolution_hours_p3: 168, warranty_extension_months: 6, included_install_credits: 1, advance_replacement_eligible: false }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "CAM-A2", display_name: "Cam A2", device_class: "CAMERA", serial_prefix: "CMA", base_warranty_months: 12, requires_install: false, manufacturer_service_only: true, msrp_cents: 12900, current_firmware_version: "2.0.0" }
              as: PlatformAdmin
              captures: { cat_cam_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_hub_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "House A", region_code: "NWA", billing_email: "a@example.com" }
              as: PlatformAdmin
              captures: { ha_id: $.data.id }
            - call: "POST /smart-home-support/households/${ha_id}/members"
              payload: { full_name: "Bill A", email: "billa@example.com", member_role: "BILLING_ADMIN" }
              as: PlatformAdmin
              captures: { bill_a_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${ha_id}", plan_id: "${plus_plan_id}", allow_overage: true }
              as: PlatformAdmin
              captures: { sub_a_id: $.data.id, sub_a_v: $.data.version }
            - call: "POST /smart-home-support/households"
              payload: { name: "House B", region_code: "NWA", billing_email: "b@example.com" }
              as: PlatformAdmin
              captures: { hb_id: $.data.id }
            - call: "POST /smart-home-support/households/${hb_id}/members"
              payload: { full_name: "Bill B", email: "billb@example.com", member_role: "BILLING_ADMIN" }
              as: PlatformAdmin
              captures: { bill_b_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${hb_id}", plan_id: "${plus_plan_id}", allow_overage: true }
              as: PlatformAdmin
              captures: { sub_b_id: $.data.id, sub_b_v: $.data.version }
          trigger:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/addon-orders"
              payload: { household_id: "${ha_id}", subscription_id: "${sub_a_id}", lines: [{ catalog_entry_id: "${cat_cam_id}", quantity: 2 }, { catalog_entry_id: "${cat_hub_id}", quantity: 1 }], expected_subscription_version: "${sub_a_v}" }
              as: BillingAdmin
              as_user_id: "${bill_a_id}"
              captures: { order_a_id: $.data.id }
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/addon-orders"
              payload: { household_id: "${hb_id}", subscription_id: "${sub_b_id}", lines: [{ catalog_entry_id: "${cat_cam_id}", quantity: 2 }, { catalog_entry_id: "${cat_hub_id}", quantity: 1 }], expected_subscription_version: "${sub_b_v}" }
              as: BillingAdmin
              as_user_id: "${bill_b_id}"
              captures: { order_b_id: $.data.id }
          assert:
            - "AddOnOrder.${order_a_id}.subtotal_cents == 50700"
            - "AddOnOrder.${order_a_id}.bundle_discount_pct == 0.15"
            - "AddOnOrder.${order_a_id}.bundle_discount_cents == 7605"
            - "AddOnOrder.${order_a_id}.discounted_subtotal_cents == 43095"
            - "AddOnOrder.${order_a_id}.install_credits_applied == 1"
            - "AddOnOrder.${order_a_id}.install_charge_cents == 0"
            - "AddOnOrder.${order_a_id}.proration_mode == MID_CYCLE_PRORATED"
            - "AddOnOrder.${order_a_id}.monthly_delta_cents == 399"
            - "AddOnOrder.${order_a_id}.proration_cents == 146"
            - "AddOnOrder.${order_a_id}.order_total_cents == 43241"
            - "AddOnOrder.${order_b_id}.proration_mode == NEXT_CYCLE_FULL"
            - "AddOnOrder.${order_b_id}.monthly_delta_cents == 399"
            - "AddOnOrder.${order_b_id}.proration_cents == 0"
            - "AddOnOrder.${order_b_id}.order_total_cents == 43095"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: addon_proration_rounds_per_line_then_sums
        grounds:
          - calculations.addon_proration_cents
          - calculations.addon_order_total_cents
          - entities.AddOnOrder.fields.proration_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two order lines each carrying one overage unit
          at 399 cents with 11 of 30 days remaining give 146 + 146 = 292 when each
          line is rounded before summing, but 293 when the two lines are summed
          first and rounded once. The scaffold pins per-line rounding, so the only
          correct answer is 292.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z at setup, moved to 2026-05-20T00:00:00Z before the order (11 days remaining)."
            - "A PLUS plan with included_device_count 2, overage_fee_cents_per_device 399 and included_install_credits 1."
            - "A household with an OWNER, a BILLING_ADMIN and an ACTIVE subscription with allow_overage true."
            - "Two devices already claimed, so entitled_device_count == 2 == included_device_count and every further unit is an overage unit."
            - "Catalog holds a CAMERA at 12900 and a SENSOR at 4900, NEITHER of which requires install, so the install-credit waterfall contributes nothing."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4999, included_device_count: 2, overage_fee_cents_per_device: 399, coverage_mode: "BUSINESS_HOURS", first_response_minutes_p1: 120, first_response_minutes_p2: 240, first_response_minutes_p3: 720, onsite_resolution_hours_p1: 48, onsite_resolution_hours_p2: 72, onsite_resolution_hours_p3: 168, warranty_extension_months: 6, included_install_credits: 1, advance_replacement_eligible: false }
              as: PlatformAdmin
              captures: { plus_plan_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "CAM-A2", display_name: "Cam A2", device_class: "CAMERA", serial_prefix: "CMA", base_warranty_months: 12, requires_install: false, manufacturer_service_only: true, msrp_cents: 12900, current_firmware_version: "2.0.0" }
              as: PlatformAdmin
              captures: { cat_cam_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "SNS-B1", display_name: "Sensor B1", device_class: "SENSOR", serial_prefix: "SNB", base_warranty_months: 12, requires_install: false, manufacturer_service_only: false, msrp_cents: 4900, current_firmware_version: "1.2.0" }
              as: PlatformAdmin
              captures: { cat_sen_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Rounding House", region_code: "NWA", billing_email: "round@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Owen R", email: "owen@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Bree R", email: "bree@example.com", member_role: "BILLING_ADMIN" }
              as: PlatformAdmin
              captures: { bill_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plus_plan_id}", allow_overage: true }
              as: PlatformAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_sen_id}", serial_number: "SNB000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_sen_id}", serial_number: "SNB000002", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /smart-home-support/subscriptions/${sub_id}"
              payload: {}
              as: BillingAdmin
              as_user_id: "${bill_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /smart-home-support/addon-orders"
              payload: { household_id: "${h_id}", subscription_id: "${sub_id}", lines: [{ catalog_entry_id: "${cat_cam_id}", quantity: 1 }, { catalog_entry_id: "${cat_sen_id}", quantity: 1 }], expected_subscription_version: "${sub_v}" }
              as: BillingAdmin
              as_user_id: "${bill_id}"
              captures: { order_id: $.data.id }
          assert:
            - "AddOnOrder.${order_id}.subtotal_cents == 17800"
            - "AddOnOrder.${order_id}.bundle_discount_pct == 0"
            - "AddOnOrder.${order_id}.discounted_subtotal_cents == 17800"
            - "AddOnOrder.${order_id}.install_credits_applied == 0"
            - "AddOnOrder.${order_id}.install_charge_cents == 0"
            - "AddOnOrder.${order_id}.monthly_delta_cents == 798"
            - "AddOnOrder.${order_id}.proration_cents == 292"
            - "AddOnOrder.${order_id}.proration_cents != 293"
            - "AddOnOrder.${order_id}.order_total_cents == 18092"

      - name: bundle_discount_tier_pinned_to_subtotal_before_install_charge
        grounds:
          - calculations.addon_bundle_pricing
          - calculations.addon_install_credit_waterfall
          - calculations.addon_order_total_cents
          - entities.AddOnOrder.fields.bundle_discount_pct
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: order_total_cents (31900) sits above
          the 20000 tier-1 threshold, but the discount tier is pinned to
          subtotal_cents (19000) which sits below it, so bundle_discount_pct must be
          0 and NOT 0.10 — the evaluation order, not the arithmetic, decides.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A BASIC plan with included_device_count 1, included_install_credits 0, allow_overage left false."
            - "A THERMOSTAT catalog model at 19000 cents that requires install."
            - "A household with an OWNER, a BILLING_ADMIN, an ACTIVE subscription, install_credits_remaining 0 and entitled_device_count 0."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 1999, included_device_count: 1, overage_fee_cents_per_device: 499, coverage_mode: "BUSINESS_HOURS", first_response_minutes_p1: 240, first_response_minutes_p2: 480, first_response_minutes_p3: 1440, onsite_resolution_hours_p1: 72, onsite_resolution_hours_p2: 120, onsite_resolution_hours_p3: 240, warranty_extension_months: 0, included_install_credits: 0, advance_replacement_eligible: false }
              as: PlatformAdmin
              captures: { basic_plan_id: $.data.id }
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "THM-C1", display_name: "Thermo C1", device_class: "THERMOSTAT", serial_prefix: "TMC", base_warranty_months: 36, requires_install: true, manufacturer_service_only: false, msrp_cents: 19000, current_firmware_version: "3.0.0" }
              as: PlatformAdmin
              captures: { cat_thm_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Tier House", region_code: "NWA", billing_email: "tier@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Tia T", email: "tia@example.com", member_role: "BILLING_ADMIN" }
              as: PlatformAdmin
              captures: { bill_id: $.data.id }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${basic_plan_id}", allow_overage: false }
              as: PlatformAdmin
              captures: { sub_id: $.data.id, sub_v: $.data.version }
          trigger:
            - call: "POST /smart-home-support/addon-orders"
              payload: { household_id: "${h_id}", subscription_id: "${sub_id}", lines: [{ catalog_entry_id: "${cat_thm_id}", quantity: 1 }], expected_subscription_version: "${sub_v}" }
              as: BillingAdmin
              as_user_id: "${bill_id}"
              captures: { order_id: $.data.id }
          assert:
            - "AddOnOrder.${order_id}.subtotal_cents == 19000"
            - "AddOnOrder.${order_id}.bundle_discount_pct == 0"
            - "AddOnOrder.${order_id}.bundle_discount_cents == 0"
            - "AddOnOrder.${order_id}.discounted_subtotal_cents == 19000"
            - "AddOnOrder.${order_id}.install_credits_applied == 0"
            - "AddOnOrder.${order_id}.install_charge_cents == 12900"
            - "AddOnOrder.${order_id}.proration_cents == 0"
            - "AddOnOrder.${order_id}.order_total_cents == 31900"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_pause_resume_loop_leaves_other_two_axes_pinned
        grounds:
          - state_machines.Ticket.workflow.REMOTE_DIAG_to_AWAITING_CUSTOMER
          - state_machines.Ticket.workflow.AWAITING_CUSTOMER_to_REMOTE_DIAG
          - state_machines.Ticket.sla.WITHIN_to_PAUSED
          - state_machines.Ticket.sla.PAUSED_to_WITHIN
          - calculations.sla_clock_partition
          - entities.Ticket.fields.dispatch_status
        distinguishing_aspect: |
          The Ticket's workflow axis traverses the REMOTE_DIAG <-> AWAITING_CUSTOMER
          cycle twice and the sla axis traverses WITHIN <-> PAUSED twice, while the
          third axis (dispatch_status) never leaves NOT_REQUIRED — a cyclic AND
          parallel-dimension machine on the Ticket entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan with TWENTY_FOUR_SEVEN coverage so sla_uncovered_minutes is always 0."
            - "A household with an OWNER and an ACTIVE subscription."
            - "One P2 ticket opened at 2026-05-01T00:00:00Z, first-responded at 00:30 and moved into REMOTE_DIAG by one open remote session."
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 2, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { pro_plan_id: $.data.id }
            - call: "POST /smart-home-support/households"
              payload: { name: "Loop House", region_code: "NWA", billing_email: "loop@example.com" }
              as: PlatformAdmin
              captures: { h_id: $.data.id }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Lo Op", email: "lo@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: $.data.id }
