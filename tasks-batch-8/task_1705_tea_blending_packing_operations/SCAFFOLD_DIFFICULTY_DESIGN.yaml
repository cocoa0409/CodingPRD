  # ------------------------------------------------------------- Rule 4 ----
  - rule_id: transitive_cascade
    instances:
      - name: supplier_suspend_depth3_cascade
        grounds:
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
          - state_machines.LeafLot.RELEASED_to_ON_HOLD
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from POST /suppliers/{id}/suspend: supplier mutation
          holds its lots (link 1); each lot's hold holds batches allocated
          from it (link 2); each batch's hold cancels its SCHEDULED runs
          (link 3). Each link is caused by the previous mutation, not by the
          original request.
        test_recipe:
          setup:
            - "Supplier ACTIVE with two RELEASED BLACK lots (100.0 + 50.0 kg); batch (target 40.0, allocations 28.0 + 12.0) fully released (CONVENTIONAL, no cert); one SCHEDULED run for the batch on a TEA_BAG line (window 2026-08-05 08:00-10:00)"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Cascade Co", origin_region: "Dibrugarh" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-01-15", weight_kg: 100.0, cost_per_kg_cents: 1000, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l1: $.data.id } }
