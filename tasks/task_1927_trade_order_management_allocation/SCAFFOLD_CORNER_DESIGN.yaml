          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_security_halted_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_SECURITY_HALTED]"]
        excluded_because:
          difficulty_instance: compliance_check_requires_security_active
          rationale: "Asserted as the failure path of the named §1.8 instance (and of fill_record_safety_beats_temporal)."

      - name: error_broker_suspended_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_BROKER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: block_route_requires_broker_active
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_trade_prohibited_note
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRADE_PROHIBITED]"]
        excluded_because:
          difficulty_instance: order_compliance_recheck_and_block_membership_cycles
          rationale: "Asserted via compliance_note == ERR_TRADE_PROHIBITED in the named §1.8 instance."

  - section: endpoints
    instances:
      - name: pagination_limit_offset_and_status_filter
        claim_type: pagination_with_filtering
        grounds: ["response_envelope", "endpoints"]
        distinguishing_aspect: "Pagination envelope fields interact with status filter: 3 orders (2 APPROVED, 1 PENDING_COMPLIANCE) — limit=2 gives total_count 3 and has_more true; offset=2 gives the last page; status=APPROVED narrows to 2."
        test_recipe:
          setup: ["Account A1; security; three orders created; o1 and o2 compliance-approved; o3 left PENDING_COMPLIANCE"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 10, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 20, order_type: MARKET }, as: Trader, captures: { o2: $.data.id } }
            - { call: "POST /trading/orders/${o2}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 30, order_type: MARKET }, as: Trader }
          trigger:
            - { call: "GET /trading/orders?limit=2&offset=0", as: Auditor }
            - { call: "GET /trading/orders?limit=2&offset=2", as: Auditor }
            - { call: "GET /trading/orders?status=APPROVED", as: Auditor }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true; page 2 (offset 2): 1 item, has_more == false"
            - "status=APPROVED filter: total_count == 2, all items status APPROVED, ordered created_at ASC"

      - name: audit_trail_retention_and_filter
        claim_type: computed_read
        grounds: ["entities.AuditEvent", "endpoints"]
        distinguishing_aspect: "Every mutation appends a queryable AuditEvent: after create + compliance-check, GET /trading/audit-events?entity_type=Order&entity_id=<id> returns exactly [ORDER_CREATED, ORDER_COMPLIANCE_APPROVED] in created_at ASC order, with actor role/id stamped."
        test_recipe:
          setup: ["Account A1; security; order created and compliance-approved"]
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 10, order_type: MARKET }, as: Trader, as_user_id: "trader-9", captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer, as_user_id: "co-3" }
          trigger:
            - { call: "GET /trading/audit-events?entity_type=Order&entity_id=${o1}", as: Auditor, captures: { ev1: "$.data[0].action", ev2: "$.data[1].action", ar1: "$.data[0].actor_role" } }
          assert:
            - "Exactly 2 events for the order: [ORDER_CREATED (actor Trader/trader-9), ORDER_COMPLIANCE_APPROVED (actor ComplianceOfficer/co-3)] in created_at ASC order"
            - "Events are append-only: no update/delete endpoint exists for AuditEvent"

