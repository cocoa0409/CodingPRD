# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1844: Payroll Garnishment & Wage Order Processing
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Sections/claim_types follow
# references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: employer_creation_applies_defaults
        claim_type: creation_defaults
        grounds: [entities.Employer.fields.admin_fee_cents]
        distinguishing_aspect: "Omitting optional admin_fee_cents on employer creation stores the default 0."
        test_recipe:
          setup: ["No employer yet"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
          trigger:
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "20-2020202", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id }
          assert:
            - "Employer.${emp_id}.admin_fee_cents == 0"
            - "Employer.${emp_id}.version == 1"

      - name: paystatement_computed_fields_ignore_client_input
        claim_type: computed_field_correctness
        grounds: [entities.PayStatement.fields.disposable_earnings_cents, entities.PayStatement.fields.net_pay_cents]
        distinguishing_aspect: "Computed fields (disposable_earnings_cents) derive from gross-deductions and cannot be set by the client."
        test_recipe:
          setup: ["Employer, employee, OPEN run"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "21-2121212", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 100000, mandatory_deductions_cents: 25000 }
              as: payroll_specialist
              captures: { stmt_id: $.data.id }
          assert:
            - "PayStatement.${stmt_id}.disposable_earnings_cents == 75000"
            - "PayStatement.${stmt_id}.total_withheld_cents == 0"

      - name: statetement_tx_requires_hours_worked
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_PERIOD_OVERLAP]"]
        distinguishing_aspect: "For a TX (hourly-test) employee, a statement missing hours_worked is rejected; for CA the field is optional."
        test_recipe:
          setup: ["Employer with one TX employee, OPEN run"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "TX", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 1000, fee_deductible_from_wages: false }
              as: employer_payroll_admin
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "22-2222223", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "TX", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 2000, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 100000, mandatory_deductions_cents: 25000 }
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PERIOD_OVERLAP"

      - name: get_nonexistent_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Clock set; nothing else needed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
          trigger:
            - call: "GET /orders/00000000-0000-0000-0000-000000000000"
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NOT_FOUND"
            - "trigger HTTP status == 404"

      - name: state_rule_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.StateRule]
        distinguishing_aspect: "StateRule is configuration with common_fields=false: no PATCH/PUT endpoint exists; the table is append-only via POST /state-rules."
        test_recipe:
          setup: ["StateRule CA exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
          trigger:
            - call: "GET /state-rules/CA"
              as: compliance_auditor
          assert:
            - "GET returns the stored caps exactly as posted (min_wage_multiplier == 0.75)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.GarnishmentOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal REJECTED, every further action (validate/notify/activate/suspend/answer/terminate) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Employer, employee, one order in RECEIVED then REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "23-2323232", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-R", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/reject"
              payload: { reason: "bad paperwork" }
              as: payroll_specialist
          trigger:
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "GarnishmentOrder.${ord_id}.processing_status == REJECTED"

      - name: run_void_with_posted_events_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PayrollRun.OPEN_to_VOIDED, "errors[ERR_INVALID_STATE]", "errors[ERR_RUN_HAS_POSTED_EVENTS]"]
        distinguishing_aspect: "Void on a PAID run is a terminal-state violation (ERR_INVALID_STATE); the ERR_RUN_HAS_POSTED_EVENTS guard covers the OPEN-with-events case which is unreachable — the reachable lockdown is PAID→void."
        test_recipe:
          setup: ["Employer, employee, order, PAID run"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "24-2424242", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-V", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 100000, mandatory_deductions_cents: 20000 }
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v3: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v3}" }
              as: payroll_specialist
          trigger:
            - call: "POST /payroll-runs/${run_id}/void"
              payload: {}
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "PayrollRun.${run_id}.status == PAID"

      - name: pay_run_idempotent_second_pay_rejected
        claim_type: idempotency
        grounds: [state_machines.PayrollRun.OPEN_to_PAID]
        distinguishing_aspect: "Paying the same run twice: the second pay hits PAID (terminal) and is rejected, so withholding events post exactly once per (statement, order)."
        test_recipe:
          setup: ["Employer, employee, ACTIVE order, PAID run"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "25-2525252", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-I2", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/validate"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
            - call: "POST /orders/${ord_id}/activate"
              payload: {}
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v2: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15", expected_employer_version: "${emp_v2}" }
              as: payroll_specialist
              captures: { run_id: $.data.id }
            - call: "POST /payroll-runs/${run_id}/statements"
              payload: { employee_id: "${ee_id}", gross_earnings_cents: 100000, mandatory_deductions_cents: 20000 }
              as: payroll_specialist
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v3: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v3}" }
              as: payroll_specialist
          trigger:
            - call: "GET /employers/${emp_id}"
              as: payroll_specialist
              captures: { emp_v4: $.data.version }
            - call: "POST /payroll-runs/${run_id}/pay"
              payload: { expected_employer_version: "${emp_v4}" }
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "count of WITHHOLD events for ${ord_id} == 1"

      - name: notify_before_validate_rejected
        claim_type: invalid_transition
        grounds: [state_machines.GarnishmentOrder]
        distinguishing_aspect: "Skipping the VALIDATED state: notify on a RECEIVED order is an invalid transition."
        test_recipe:
          setup: ["Employer, employee, one RECEIVED order (not validated)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "26-2626262", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-NV", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/notify"
              payload: {}
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "GarnishmentOrder.${ord_id}.processing_status == RECEIVED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: creditor_blocked_by_support_noncompete
        claim_type: correct_result
        grounds: [calculations.withholding_waterfall]
        distinguishing_aspect: "CREDITOR non-compete: when any CHILD_SUPPORT order was awarded > 0 in the pass, all CREDITOR orders award 0 with basis BLOCKED_BY_SUPPORT even though pool remains."
        test_recipe:
          setup:
            - "CA employee; order1 CHILD_SUPPORT FIXED 10000 (received first); order2 CREDITOR FIXED 5000 (received second)"
            - "DE = 92500-30000 = 62500; floor 47126; pool 15374; CS takes 10000; pool left 5374; CREDITOR blocked -> 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /authorities"
              payload: { name: "Court", authority_type: "COURT", state_code: "CA", accepted_case_number_pattern: "^CV-" }
              as: employer_payroll_admin
              captures: { auth_ct: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "27-2727272", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-P", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 10000, total_balance_cents: 999999, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_cs: $.data.id }
            - call: "GET /employees/${ee_id}"
              as: payroll_specialist
              captures: { ee_v2: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
