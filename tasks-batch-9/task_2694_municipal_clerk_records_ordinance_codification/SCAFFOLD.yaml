scenario: |
  Generate task harder than expert level!

  2694. Municipal Clerk Records & Ordinance Codification (city clerk's office): agenda packet assembly, publication deadlines and open meeting notice compliance, motion, vote and minute recording with approval and correction process, ordinance and resolution numbering, effective date calculation and publication requirements, codification submissions with supplement cycles and conflict resolution between old and new provisions, records retention schedule application with destruction certification, public records request intake, exemption review and fee assessment, election duties including candidate filing and campaign statement receipt, oath administration and official document custody

domain_name: municipal-clerk-records-ordinance-codification
api_prefix: /clerk

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: hybrid
  # Two shallow ownership chains (Meeting -> AgendaPacket -> AgendaItem and
  # CodeTitle -> SupplementCycle -> CodificationSubmission) are cross-linked by
  # peer references that jump aggregates (Motion -> LegislativeInstrument,
  # Motion -> MinutesRecord, PublicationNotice -> LegislativeInstrument|Meeting,
  # DestructionBatch -> PublicRecordsRequest) plus one self-reference
  # (CodificationSubmission.conflict_with_submission_id).

  state_machine_shape: cyclic
  # MinutesRecord loops APPROVED -> CORRECTION_PENDING -> APPROVED; Meeting loops
  # SCHEDULED -> NOTICED -> SCHEDULED when the posted packet is withdrawn;
  # LegislativeInstrument forks ADOPTED -> {PUBLISHED | VETOED -> VETO_OVERRIDDEN
  # -> PUBLISHED}; PublicRecordsRequest carries two independent status axes.

  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities / 77 endpoints / 10 state machines / 12 calculations / 3 OCC rules / 77 errors / 7 roles.
  # Density, not volume, is the point: every calculation reads fields written by a
  # cascade from another aggregate, and both multi-hop cascades cross three
  # aggregates each.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Public name of the meeting room or chamber.
      - name: address
        type: string
        source: input
        description: Street address printed on published notices.
      - name: capacity
        type: integer
        source: input
        description: Seated occupancy published with the notice.
        constraints: ">= 1"
      - name: teardown_buffer_minutes
        type: integer
        source: input
        description: Minutes appended to the END of every meeting occupation of this venue before another body may occupy it.
        default: 30
        constraints: "0..240"
      - name: status
        type: enum
        source: input
        description: Whether the venue may accept new occupations.
        default: AVAILABLE
        constraints: "enum: AVAILABLE|CLOSED"

  - name: Meeting
    parent: null
    common_fields: true
    fields:
      - name: body_type
        type: enum
        source: input
        description: Governing body that meets; drives the notice multiplier.
        constraints: "enum: COUNCIL|PLANNING_COMMISSION|BOARD_OF_ADJUSTMENT"
      - name: meeting_type
        type: enum
        source: input
        description: Statutory meeting class; drives the base notice hours.
        constraints: "enum: REGULAR|SPECIAL|EMERGENCY|WORKSHOP"
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the venue whose occupation calendar this meeting reserves for [scheduled_start, scheduled_end) plus the venue teardown buffer.
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC start instant of the meeting.
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC end instant; must be strictly after scheduled_start.
      - name: quorum_required
        type: integer
        source: input
        description: Minimum members that must be present to convene.
        constraints: ">= 1"
      - name: present_member_count
        type: integer
        source: system
        description: Members recorded present at convene; 0 until the meeting is convened.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the meeting.
        default: SCHEDULED
        constraints: "enum: SCHEDULED|NOTICED|IN_SESSION|ADJOURNED|CANCELLED"
      - name: notice_posted_at
        type: datetime
        source: system
        description: posted_at mirrored from the AgendaPacket whose meeting_id == this Meeting.id and whose status == POSTED; null when no such packet exists.
      - name: required_notice_hours
        type: integer
        source: computed
        description: required_notice_hours mirrored from the POSTED AgendaPacket; null when no such packet exists.
      - name: notice_compliant
        type: boolean
        source: computed
        description: notice_compliant mirrored from the POSTED AgendaPacket; false when no such packet exists.
        default: false
      - name: adjourned_at
        type: datetime
        source: system
        description: Logical-clock instant at which the meeting was adjourned.
      - name: cancelled_reason
        type: string
        source: input
        description: Reason recorded on the cancellation notice; null unless status == CANCELLED.

  - name: AgendaPacket
    parent: Meeting
    common_fields: true
    fields:
      - name: meeting_id
        type: string
        source: input
        description: FK -> Meeting.id; the meeting this packet agendas.
      - name: revision_number
        type: integer
        source: computed
        description: 1 + the highest revision_number among AgendaPackets with the same meeting_id at creation time.
      - name: status
        type: enum
        source: system
        description: Packet lifecycle state.
        default: DRAFT
        constraints: "enum: DRAFT|POSTED|SUPERSEDED|WITHDRAWN"
      - name: late_addendum
        type: boolean
        source: input
        description: True when the packet carries an item added after the original notice; adds LATE_ADDENDUM_PENALTY_HOURS to the notice requirement.
        default: false
      - name: item_count
        type: integer
        source: computed
        description: Count of AgendaItems whose packet_id == this AgendaPacket.id.
        default: 0
      - name: contains_public_hearing
        type: boolean
        source: computed
        description: True when at least one AgendaItem with packet_id == this AgendaPacket.id has item_type == PUBLIC_HEARING.
        default: false
      - name: required_notice_hours
        type: integer
        source: computed
        description: Output of calculation meeting_notice_requirement for this packet.
      - name: notice_deadline_at
        type: datetime
        source: computed
        description: meeting.scheduled_start minus required_notice_hours hours.
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the packet was posted; null while status == DRAFT.
      - name: notice_compliant
        type: boolean
        source: computed
        description: Output of calculation agenda_notice_compliance; false while status == DRAFT.
        default: false

  - name: AgendaItem
    parent: AgendaPacket
    common_fields: false
    fields:
      - name: packet_id
        type: string
        source: input
        description: FK -> AgendaPacket.id; the packet this item belongs to.
      - name: sequence_number
        type: integer
        source: input
        description: Printed order of the item within the packet; unique per packet_id.
        constraints: ">= 1"
      - name: item_type
        type: enum
        source: input
        description: Item class; PUBLIC_HEARING lengthens the notice requirement.
        constraints: "enum: CONSENT|PUBLIC_HEARING|ORDINANCE_FIRST_READING|ORDINANCE_ADOPTION|RESOLUTION|MINUTES|REPORT"
      - name: title
        type: string
        source: input
        description: Caption printed on the agenda.

  - name: Motion
    parent: Meeting
    common_fields: true
    fields:
      - name: meeting_id
        type: string
        source: input
        description: FK -> Meeting.id; the meeting in session when the motion was moved.
      - name: agenda_item_id
        type: string
        source: input
        description: FK -> AgendaItem.id; the agenda item under which the motion was moved.
      - name: instrument_id
        type: string
        source: input
        description: FK -> LegislativeInstrument.id; required when motion_type IN {ORDINANCE_ADOPTION, RESOLUTION_ADOPTION, VETO_OVERRIDE}, otherwise null.
      - name: target_minutes_id
        type: string
        source: input
        description: FK -> MinutesRecord.id; required when motion_type IN {MINUTES_APPROVAL, MINUTES_CORRECTION}, otherwise null.
      - name: motion_type
        type: enum
        source: input
        description: What the motion does when it passes.
        constraints: "enum: ORDINANCE_ADOPTION|RESOLUTION_ADOPTION|MINUTES_APPROVAL|MINUTES_CORRECTION|VETO_OVERRIDE|PROCEDURAL"
      - name: majority_rule
        type: enum
        source: input
        description: Passage threshold rule applied to effective_base.
        constraints: "enum: SIMPLE|TWO_THIRDS|FOUR_FIFTHS|UNANIMOUS_CONSENT"
      - name: moved_by_member_id
        type: string
        source: input
        description: Opaque member identifier of the mover.
      - name: seconded_by_member_id
        type: string
        source: input
        description: Opaque member identifier of the seconder; required at creation.
      - name: status
        type: enum
        source: system
        description: Motion lifecycle state.
        default: SECONDED
        constraints: "enum: SECONDED|TALLIED|WITHDRAWN"
      - name: yes_count
        type: integer
        source: system
        description: Ayes recorded at tally.
        default: 0
      - name: no_count
        type: integer
        source: system
        description: Nays recorded at tally.
        default: 0
      - name: abstain_count
        type: integer
        source: system
        description: Abstentions recorded at tally; counted in effective_base but never as an aye.
        default: 0
      - name: recused_count
        type: integer
        source: system
        description: Recusals recorded at tally; removed from effective_base.
        default: 0
      - name: effective_base
        type: integer
        source: computed
        description: present_member_count minus recused_count, from calculation motion_vote_outcome.
      - name: required_yes
        type: integer
        source: computed
        description: Ayes needed for passage, from calculation motion_vote_outcome.
      - name: outcome
        type: enum
        source: computed
        description: Tally result.
        default: PENDING
        constraints: "enum: PENDING|PASSED|FAILED|TIE_BROKEN_PASSED|TIE_BROKEN_FAILED"
      - name: tie_break_used
        type: boolean
        source: computed
        description: True when the presiding officer's tie-break vote decided the outcome.
        default: false
      - name: result_official
        type: boolean
        source: system
        description: Flips to true when the MinutesRecord of this motion's meeting reaches APPROVED.
        default: false

  - name: MinutesRecord
    parent: Meeting
    common_fields: true
    fields:
      - name: meeting_id
        type: string
        source: input
        description: FK -> Meeting.id; the meeting these minutes record.
      - name: status
        type: enum
        source: system
        description: Minutes lifecycle state; cycles APPROVED -> CORRECTION_PENDING -> APPROVED.
        default: DRAFT
        constraints: "enum: DRAFT|SUBMITTED|APPROVED|CORRECTION_PENDING"
      - name: revision_number
        type: integer
        source: computed
        description: 1 at creation; incremented each time an approved correction is applied.
        default: 1
      - name: text_body
        type: string
        source: input
        description: Official narrative of the meeting.
        default: ""
      - name: pending_correction_text
        type: string
        source: system
        description: Proposed replacement narrative held while status == CORRECTION_PENDING; null otherwise.
      - name: correction_count
        type: integer
        source: computed
        description: Number of corrections opened against this record, including rejected ones.
        default: 0
      - name: approved_on
        type: date
        source: system
        description: Logical-clock date on which the record last reached APPROVED.

  - name: NumberSeries
    parent: null
    common_fields: true
    fields:
      - name: series_year
        type: integer
        source: input
        description: Calendar year the series numbers; unique together with instrument_class.
      - name: instrument_class
        type: enum
        source: input
        description: Which instrument class this series numbers.
        constraints: "enum: ORDINANCE|RESOLUTION"
      - name: prefix
        type: string
        source: input
        description: Alphabetic prefix printed in assigned numbers, e.g. ORD.
      - name: next_sequence
        type: integer
        source: computed
        description: Sequence the next minting will consume; starts at starting_sequence (default 1) and increments by 1 per mint.
        default: 1
      - name: minted_count
        type: integer
        source: computed
        description: Number of instruments that have drawn a number from this series.
        default: 0
      - name: status
        type: enum
        source: input
        description: Whether the series may back new instruments.
        default: OPEN
        constraints: "enum: OPEN|CLOSED"

  - name: LegislativeInstrument
    parent: null
    common_fields: true
    fields:
      - name: instrument_class
        type: enum
        source: input
        description: Ordinance (codified, published) or resolution (not codified).
        constraints: "enum: ORDINANCE|RESOLUTION"
      - name: ordinance_category
        type: enum
        source: input
        description: Required when instrument_class == ORDINANCE, must be null when instrument_class == RESOLUTION.
        constraints: "enum: GENERAL|ZONING|CODE_AMENDMENT|EMERGENCY"
      - name: title
        type: string
        source: input
        description: Long title as introduced.
      - name: full_text_length
        type: integer
        source: input
        description: Character length of the enacted text; drives the full-text-versus-summary publication choice in calculation publication_requirement.
        constraints: ">= 1"
      - name: number_series_id
        type: string
        source: input
        description: FK -> NumberSeries.id; the series this instrument will draw its assigned_number from.
      - name: code_title_id
        type: string
        source: input
        description: FK -> CodeTitle.id; required when ordinance_category == CODE_AMENDMENT, otherwise null.
      - name: code_section_ref
        type: string
        source: input
        description: Municipal code section this ordinance touches, e.g. "12.04.030"; required when ordinance_category == CODE_AMENDMENT.
      - name: status
        type: enum
        source: system
        description: Legislative lifecycle state.
        default: INTRODUCED
        constraints: "enum: INTRODUCED|FIRST_READING_PASSED|ADOPTED_UNOFFICIAL|ADOPTED|VETOED|VETO_OVERRIDDEN|PUBLISHED|EFFECTIVE|FAILED"
      - name: assigned_number
        type: string
        source: computed
        description: "{prefix}-{series_year}-{next_sequence zero-padded to 3} minted when the instrument reaches ADOPTED; null before that."
      - name: reading_count
        type: integer
        source: computed
        description: Number of readings advanced.
        default: 0
      - name: voted_on
        type: date
        source: system
        description: Logical-clock date on which the adoption motion was tallied (status ADOPTED_UNOFFICIAL).
      - name: adoption_date
        type: date
        source: system
        description: Logical-clock date on which minutes approval made the adoption official (status ADOPTED).
      - name: publication_completed_on
        type: date
        source: system
        description: Last publication date certified on this instrument's notice; mirrored from PublicationNotice.publication_completed_on.
      - name: requires_publication
        type: boolean
        source: computed
        description: True when instrument_class == ORDINANCE; false for RESOLUTION.
      - name: effective_date_basis
        type: enum
        source: computed
        description: Which variant of calculation instrument_effective_date applies.
        constraints: "enum: PUBLICATION_PLUS_30|ADOPTION_IMMEDIATE|SUPPLEMENT_CERTIFIED"
      - name: effective_date
        type: date
        source: computed
        description: Output of calculation instrument_effective_date; null until the basis inputs exist.
      - name: veto_reason
        type: string
        source: input
        description: Presiding officer's stated reason; null unless the instrument was vetoed.

  - name: PublicationNotice
    parent: null
    common_fields: true
    fields:
      - name: notice_type
        type: enum
        source: system
        description: What is being published; set by the cascade that creates the notice.
        constraints: "enum: ORDINANCE_FULL_TEXT|ORDINANCE_SUMMARY|MEETING_AGENDA|CANCELLATION"
      - name: instrument_id
        type: string
        source: system
        description: FK -> LegislativeInstrument.id; non-null exactly when notice_type IN {ORDINANCE_FULL_TEXT, ORDINANCE_SUMMARY}.
      - name: meeting_id
        type: string
        source: system
        description: FK -> Meeting.id; non-null exactly when notice_type IN {MEETING_AGENDA, CANCELLATION}.
      - name: status
        type: enum
        source: system
        description: Notice lifecycle state.
        default: DRAFT
        constraints: "enum: DRAFT|ORDERED|PUBLISHED|VOID"
      - name: required_publication_count
        type: integer
        source: computed
        description: Output of calculation publication_requirement; number of distinct publication dates the order must carry.
      - name: publication_deadline_on
        type: date
        source: computed
        description: Output of calculation publication_requirement; latest date any required publication may bear.
      - name: newspaper_name
        type: string
        source: input
        description: Newspaper of record named on the order; null while status == DRAFT.
      - name: column_inches
        type: number
        source: input
        description: Billed column inches per insertion; null while status == DRAFT.
        constraints: "> 0"
      - name: publication_dates
        type: array
        source: input
        description: Strictly increasing ISO dates of the ordered insertions; null while status == DRAFT.
      - name: gross_cost_cents
        type: integer
        source: computed
        description: Output of calculation publication_invoice_total (pre-discount basis).
      - name: discount_pct
        type: number
        source: computed
        description: Volume discount fraction selected from gross_cost_cents.
      - name: invoice_total_cents
        type: integer
        source: computed
        description: Output of calculation publication_invoice_total (billed amount).
      - name: publication_completed_on
        type: date
        source: system
        description: Last publication date certified by the clerk; null until status == PUBLISHED.

  - name: CodeTitle
    parent: null
    common_fields: true
    fields:
      - name: title_number
        type: integer
        source: input
        description: Municipal code title number; unique.
        constraints: ">= 1"
      - name: name
        type: string
        source: input
        description: Title caption, e.g. "Zoning".
      - name: section_refs
        type: array
        source: input
        description: Section references currently in force under this title; the referential authority for AMEND and REPEAL submissions.
        default: []
      - name: current_supplement_number
        type: integer
        source: computed
        description: supplement_number of the most recently CERTIFIED SupplementCycle under this title; 0 when none.
        default: 0
      - name: status
        type: enum
        source: input
        description: Whether the title accepts codification work.
        default: ACTIVE
        constraints: "enum: ACTIVE|RESERVED"

  - name: SupplementCycle
    parent: CodeTitle
    common_fields: true
    fields:
      - name: code_title_id
        type: string
        source: input
        description: FK -> CodeTitle.id; the title whose submission window this cycle occupies as the CLOSED date interval [window_open_on, window_close_on].
      - name: supplement_number
        type: integer
        source: input
        description: Printed supplement number; unique per code_title_id.
        constraints: ">= 1"
      - name: window_open_on
        type: date
        source: input
        description: First date on which submissions may be filed (inclusive).
      - name: window_close_on
        type: date
        source: input
        description: Last date on which submissions may be filed (inclusive); must be >= window_open_on.
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle state.
        default: OPEN
        constraints: "enum: OPEN|LOCKED|CERTIFIED"
      - name: submission_count
        type: integer
        source: computed
        description: Count of CodificationSubmissions with cycle_id == this SupplementCycle.id and status != WITHDRAWN.
        default: 0
      - name: client_submission_count
        type: integer
        source: computed
        description: Count of those submissions whose origin == CLIENT and status != WITHDRAWN; the quantity capped by MAX_CLIENT_SUBMISSIONS_PER_CYCLE.
        default: 0
      - name: conflict_count
        type: integer
        source: computed
        description: Number of unresolved conflict pairs in this cycle; equals count(submissions with status == CONFLICT_HELD) / 2.
        default: 0
      - name: certified_on
        type: date
        source: system
        description: Date the supplement was certified to the codifier; null until status == CERTIFIED.

  - name: CodificationSubmission
    parent: SupplementCycle
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: FK -> SupplementCycle.id; the supplement cycle this submission is filed into.
      - name: instrument_id
        type: string
        source: input
        description: FK -> LegislativeInstrument.id; the adopted instrument whose text is being codified.
      - name: code_section_ref
        type: string
        source: input
        description: Section reference the submission adds, amends, or repeals.
      - name: action
        type: enum
        source: input
        description: Codification action; AMEND and REPEAL require code_section_ref to already exist in CodeTitle.section_refs.
        constraints: "enum: ADD|AMEND|REPEAL"
      - name: origin
        type: enum
        source: system
        description: CLIENT when filed through POST /clerk/codification-submissions; CASCADE when auto-enrolled by publication certification.
        constraints: "enum: CLIENT|CASCADE"
      - name: status
        type: enum
        source: system
        description: Submission lifecycle state.
        default: PENDING
        constraints: "enum: PENDING|IN_REVIEW|CONFLICT_HELD|ACCEPTED|REJECTED|WITHDRAWN"
      - name: conflict_with_submission_id
        type: string
        source: system
        description: FK -> CodificationSubmission.id; the counterpart submission this one collides with; non-null exactly while status == CONFLICT_HELD.
      - name: resolution_basis
        type: enum
        source: system
        description: Rule applied when the conflict pair was resolved; null until resolution.
        constraints: "enum: LATER_ADOPTION_WINS|SPECIFIC_OVER_GENERAL|MANUAL_OVERRIDE"
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the editor who resolved this submission's conflict; null until resolution. Compared against the certifier for segregation of duties.

  - name: PublicRecordsRequest
    parent: null
    common_fields: true
    fields:
      - name: requester_name
        type: string
        source: input
        description: Name of the requester as filed.
      - name: requester_email
        type: string
        source: input
        description: Contact address for the response.
      - name: subject_description
        type: string
        source: input
        description: Records described in the request.
      - name: target_series_id
        type: string
        source: input
        description: FK -> RecordSeries.id; the retention series the request reaches into; null when the request names no series.
      - name: commercial_purpose
        type: boolean
        source: input
        description: True when the requester declares a commercial purpose; adds COMMERCIAL_SURCHARGE_PCT to the assessment.
        default: false
      - name: intake_on
        type: date
        source: system
        description: Logical-clock date of intake.
      - name: due_on
        type: date
        source: computed
        description: Output of calculation records_request_due_date.
      - name: fulfillment_status
        type: enum
        source: system
        description: Disclosure axis of the request; evolves independently of fee_status.
        default: RECEIVED
        constraints: "enum: RECEIVED|UNDER_REVIEW|EXEMPTION_REVIEW|PARTIALLY_RELEASED|RELEASED|DENIED|WITHDRAWN|CLOSED"
      - name: fee_status
        type: enum
        source: system
        description: Money axis of the request; evolves independently of fulfillment_status.
        default: NOT_ASSESSED
        constraints: "enum: NOT_ASSESSED|ASSESSED|DEPOSIT_HELD|PAID|WAIVED|REFUNDED"
      - name: fee_schedule_variant
        type: enum
        source: system
        description: Which variant of calculation records_request_fee_assessment produced total_assessed_cents; null before assessment.
        constraints: "enum: ACTUAL_COST|FLAT_SCHEDULE"
      - name: exemption_count
        type: integer
        source: computed
        description: Number of exemption claims recorded at exemption review.
        default: 0
      - name: total_assessed_cents
        type: integer
        source: computed
        description: Output of calculation records_request_fee_assessment.
        default: 0
      - name: total_waived_cents
        type: integer
        source: computed
        description: Cents forgiven by waiver or by the withdrawal compensation.
        default: 0
      - name: total_collected_cents
        type: integer
        source: computed
        description: Cumulative cents received from the requester.
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Cumulative cents returned to the requester.
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: Output of calculation records_request_fee_ledger; total_assessed_cents - total_waived_cents - (total_collected_cents - refunded_cents).
        default: 0
      - name: net_cash_cents
        type: integer
        source: computed
        description: Output of calculation records_request_fee_ledger; total_collected_cents - refunded_cents. The conserved cash position.
        default: 0
      - name: closed_on
        type: date
        source: system
        description: Logical-clock date the request reached CLOSED; the REQUEST_CLOSURE retention anchor reads this field.
      - name: denial_basis
        type: string
        source: input
        description: Statutory exemption cited when the disposition is DENIAL; null otherwise.

  - name: RecordSeries
    parent: null
    common_fields: true
    fields:
      - name: series_code
        type: string
        source: input
        description: Retention schedule item code; unique.
      - name: name
        type: string
        source: input
        description: Series caption on the retention schedule.
      - name: retention_years
        type: integer
        source: input
        description: Whole years the series must be kept past its anchor.
        constraints: "0..100"
      - name: retention_trigger
        type: enum
        source: input
        description: Which anchor date the retention period runs from.
        constraints: "enum: CREATION|FISCAL_YEAR_END|REQUEST_CLOSURE"
      - name: permanent
        type: boolean
        source: input
        description: True when the series may never be destroyed.
        default: false
      - name: legal_hold_status
        type: enum
        source: input
        description: Hold suspending destruction.
        default: NONE
        constraints: "enum: NONE|LITIGATION_HOLD|AUDIT_HOLD"
      - name: last_accessioned_on
        type: date
        source: system
        description: Latest accessioned_on recorded against the series; the CREATION and FISCAL_YEAR_END anchor input.
      - name: total_accessioned_count
        type: integer
        source: computed
        description: Cumulative items ever accessioned into custody.
        default: 0
      - name: active_item_count
        type: integer
        source: computed
        description: Items presently in custody.
        default: 0
      - name: destroyed_item_count
        type: integer
        source: computed
        description: Items destroyed under a certified batch.
        default: 0
      - name: eligible_through_on
        type: date
        source: computed
        description: Output of calculation destruction_eligibility_date; null when the anchor is unresolved.

  - name: DestructionBatch
    parent: RecordSeries
    common_fields: true
    fields:
      - name: series_id
        type: string
        source: input
        description: FK -> RecordSeries.id; the series the batch draws items from.
      - name: item_count
        type: integer
        source: input
        description: Items proposed for destruction.
        constraints: ">= 1"
      - name: cutoff_on
        type: date
        source: input
        description: Records dated on or before this date are in the batch; must be <= series.eligible_through_on.
      - name: eligible_through_on
        type: date
        source: computed
        description: Snapshot of series.eligible_through_on at creation.
      - name: status
        type: enum
        source: system
        description: Batch lifecycle state.
        default: PROPOSED
        constraints: "enum: PROPOSED|CERTIFIED|RESCINDED"
      - name: blocking_request_id
        type: string
        source: system
        description: FK -> PublicRecordsRequest.id; the earliest-created PublicRecordsRequest with target_series_id == series_id and fulfillment_status NOT IN {CLOSED, WITHDRAWN}; null when none. Recomputed on certify.
      - name: proposed_by_officer_id
        type: string
        source: system
        description: X-User-ID that created the batch; compared against the certifier for segregation of duties.
      - name: certifying_officer_id
        type: string
        source: system
        description: X-User-ID that signed the certificate of destruction; null until status == CERTIFIED.
      - name: certified_on
        type: date
        source: system
        description: Date on the certificate of destruction; null until status == CERTIFIED.
      - name: rescind_reason
        type: string
        source: input
        description: Reason the certificate was rescinded; null unless status == RESCINDED.

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:

  - entity: Meeting
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTICED
        trigger: "POST /clerk/agenda-packets/{packet_id}/post"
        actor: CityClerk
        preconditions:
          - "packet.meeting_id == meeting.id and packet.status == DRAFT"
          - "packet.item_count >= 1"
          - "meeting.status == SCHEDULED"
        side_effects:
          - "meeting.notice_posted_at = packet.posted_at (logical clock instant)"
          - "meeting.required_notice_hours = packet.required_notice_hours"
          - "meeting.notice_compliant = packet.notice_compliant"
          - "increments Meeting.version by 1"
          - "creates PublicationNotice{notice_type: MEETING_AGENDA, meeting_id: meeting.id, status: DRAFT} with required_publication_count and publication_deadline_on from calculation publication_requirement"
      - from: NOTICED
        to: SCHEDULED
        trigger: "POST /clerk/agenda-packets/{packet_id}/withdraw"
        actor: CityClerk
        preconditions:
          - "packet.status == POSTED and packet.meeting_id == meeting.id"
          - "meeting.status == NOTICED"
        side_effects:
          - "meeting.notice_posted_at = null; meeting.required_notice_hours = null; meeting.notice_compliant = false"
          - "increments Meeting.version by 1"
          - "the MEETING_AGENDA PublicationNotice with meeting_id == meeting.id and status IN {DRAFT, ORDERED} transitions to VOID"
        note: "Revision loop: the meeting returns to SCHEDULED and must be re-noticed by a later packet revision."
      - from: NOTICED
        to: IN_SESSION
        trigger: "POST /clerk/meetings/{meeting_id}/convene"
        actor: PresidingOfficer
        preconditions:
          - "meeting.status == NOTICED"
          - "meeting.notice_compliant == true"
          - "present_member_count >= meeting.quorum_required"
        side_effects:
          - "meeting.present_member_count = input present_member_count"
      - from: IN_SESSION
        to: ADJOURNED
        trigger: "POST /clerk/meetings/{meeting_id}/adjourn"
        actor: PresidingOfficer
        preconditions:
          - "meeting.status == IN_SESSION"
        side_effects:
          - "meeting.adjourned_at = logical clock instant"
          - "creates MinutesRecord{meeting_id: meeting.id, status: DRAFT, revision_number: 1, text_body: \"\"}"
          - "every Motion with meeting_id == meeting.id and status == SECONDED transitions to WITHDRAWN (conditional cascade: TALLIED motions are untouched)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clerk/meetings/{meeting_id}/cancel"
        actor: CityClerk
        preconditions:
          - "meeting.status IN {SCHEDULED, NOTICED}"
        side_effects:
          - "meeting.cancelled_reason = input cancelled_reason"
          - "every AgendaPacket with meeting_id == meeting.id and status IN {DRAFT, POSTED} transitions to WITHDRAWN"
          - "every PublicationNotice with meeting_id == meeting.id, notice_type == MEETING_AGENDA and status IN {DRAFT, ORDERED} transitions to VOID"
          - "creates PublicationNotice{notice_type: CANCELLATION, meeting_id: meeting.id, status: DRAFT}"
      - from: NOTICED
        to: CANCELLED
        trigger: "POST /clerk/meetings/{meeting_id}/cancel"
        actor: CityClerk
        preconditions:
          - "meeting.status IN {SCHEDULED, NOTICED}"
        side_effects:
          - "same side-effect set as SCHEDULED -> CANCELLED, plus meeting.notice_compliant = false and meeting.notice_posted_at = null"

  - entity: AgendaPacket
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: POSTED
        trigger: "POST /clerk/agenda-packets/{packet_id}/post"
        actor: CityClerk
        preconditions:
          - "packet.status == DRAFT"
          - "packet.item_count >= 1"
          - "meeting.status == SCHEDULED"
        side_effects:
          - "packet.posted_at = logical clock instant"
          - "packet.notice_compliant = calculation agenda_notice_compliance"
          - "cascades the Meeting SCHEDULED -> NOTICED transition"
        note: "Posting a packet that misses its deadline SUCCEEDS and records notice_compliant = false; the violation is enforced later at convene and at reschedule."
      - from: POSTED
        to: SUPERSEDED
        trigger: "POST /clerk/meetings/{meeting_id}/agenda-packets (a later revision is created)"
        actor: CityClerk
        preconditions:
          - "the new packet's meeting_id == this packet's meeting_id"
          - "this packet.status == POSTED"
        side_effects:
          - "cascades the Meeting NOTICED -> SCHEDULED transition when the superseded packet was the POSTED one"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /clerk/meetings/{meeting_id}/agenda-packets (a later revision is created)"
        actor: CityClerk
        preconditions:
          - "this packet.status == DRAFT"
        side_effects:
          - "no Meeting change (a DRAFT packet never noticed the meeting)"
      - from: POSTED
        to: WITHDRAWN
        trigger: "POST /clerk/agenda-packets/{packet_id}/withdraw"
        actor: CityClerk
        preconditions:
          - "packet.status IN {DRAFT, POSTED}"
        side_effects:
          - "cascades the Meeting NOTICED -> SCHEDULED transition"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /clerk/agenda-packets/{packet_id}/withdraw"
        actor: CityClerk
        preconditions:
          - "packet.status IN {DRAFT, POSTED}"
        side_effects:
          - "no Meeting change"

  - entity: Motion
    initial_state: SECONDED
    terminal_states: [TALLIED, WITHDRAWN]
    transitions:
      - from: SECONDED
        to: TALLIED
        trigger: "POST /clerk/motions/{motion_id}/tally"
        actor: CityClerk
        preconditions:
          - "motion.status == SECONDED"
          - "meeting.status == IN_SESSION (cross-entity guard on Motion.meeting_id)"
          - "yes_count + no_count + abstain_count + recused_count == meeting.present_member_count"
          - "meeting.present_member_count - recused_count >= 1"
        side_effects:
          - "motion.effective_base, motion.required_yes, motion.outcome, motion.tie_break_used = calculation motion_vote_outcome"
          - "when motion_type == ORDINANCE_ADOPTION and outcome IN {PASSED, TIE_BROKEN_PASSED}: instrument FIRST_READING_PASSED -> ADOPTED_UNOFFICIAL"
          - "when motion_type == ORDINANCE_ADOPTION and outcome IN {FAILED, TIE_BROKEN_FAILED}: instrument FIRST_READING_PASSED -> FAILED"
          - "when motion_type == RESOLUTION_ADOPTION and outcome IN {PASSED, TIE_BROKEN_PASSED}: instrument INTRODUCED -> ADOPTED_UNOFFICIAL"
          - "when motion_type == MINUTES_APPROVAL and outcome IN {PASSED, TIE_BROKEN_PASSED}: target MinutesRecord SUBMITTED -> APPROVED (hop 1 of cascade minutes_approval_officialization)"
          - "when motion_type == MINUTES_CORRECTION and outcome IN {PASSED, TIE_BROKEN_PASSED}: target MinutesRecord CORRECTION_PENDING -> APPROVED applying pending_correction_text"
          - "when motion_type == MINUTES_CORRECTION and outcome IN {FAILED, TIE_BROKEN_FAILED}: target MinutesRecord CORRECTION_PENDING -> APPROVED discarding pending_correction_text"
          - "when motion_type == VETO_OVERRIDE and outcome IN {PASSED, TIE_BROKEN_PASSED}: instrument VETOED -> VETO_OVERRIDDEN"
      - from: SECONDED
        to: WITHDRAWN
        trigger: "POST /clerk/meetings/{meeting_id}/adjourn (system cascade) or POST /clerk/meetings/{meeting_id}/cancel"
        actor: system
        preconditions:
          - "motion.status == SECONDED"
        side_effects:
          - "motion.outcome remains PENDING; no instrument or minutes change"

  - entity: MinutesRecord
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /clerk/minutes/{minutes_id}/submit"
        actor: CityClerk
        preconditions:
          - "minutes.status == DRAFT"
          - "minutes.text_body != \"\""
          - "the parent Meeting.status == ADJOURNED"
        side_effects:
          - "increments MinutesRecord.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /clerk/motions/{motion_id}/tally with motion_type == MINUTES_APPROVAL passing"
        actor: system
        preconditions:
          - "minutes.status == SUBMITTED"
          - "the approving Motion.target_minutes_id == minutes.id"
          - "the approving Motion.meeting_id != minutes.meeting_id (minutes are approved at a later meeting)"
        side_effects:
          - "minutes.approved_on = logical clock date"
          - "every Motion with meeting_id == minutes.meeting_id sets result_official = true (hop 2)"
          - "that result_official flip drives hop 3: each such Motion with motion_type == ORDINANCE_ADOPTION and outcome IN {PASSED, TIE_BROKEN_PASSED} moves its instrument ADOPTED_UNOFFICIAL -> ADOPTED"
      - from: APPROVED
        to: CORRECTION_PENDING
        trigger: "POST /clerk/minutes/{minutes_id}/corrections"
        actor: CityClerk
        preconditions:
          - "minutes.status == APPROVED"
          - "expected_minutes_version == minutes.version"
        side_effects:
          - "minutes.pending_correction_text = input corrected_text_body"
          - "minutes.correction_count += 1"
          - "increments MinutesRecord.version by 1"
      - from: CORRECTION_PENDING
        to: APPROVED
        trigger: "POST /clerk/motions/{motion_id}/tally with motion_type == MINUTES_CORRECTION"
        actor: system
        preconditions:
          - "minutes.status == CORRECTION_PENDING"
          - "the Motion.target_minutes_id == minutes.id"
        side_effects:
          - "on a passing tally: minutes.text_body = minutes.pending_correction_text; minutes.revision_number += 1"
          - "on a failing tally: minutes.text_body unchanged; minutes.revision_number unchanged"
          - "in both cases minutes.pending_correction_text = null, minutes.approved_on = logical clock date"
        note: "Closes the revision cycle APPROVED -> CORRECTION_PENDING -> APPROVED with divergent side-effect sets per branch."

  - entity: LegislativeInstrument
    initial_state: INTRODUCED
    terminal_states: [EFFECTIVE, FAILED]
    transitions:
      - from: INTRODUCED
        to: FIRST_READING_PASSED
        trigger: "POST /clerk/instruments/{instrument_id}/advance-reading"
        actor: CityClerk
        preconditions:
          - "instrument.status == INTRODUCED"
          - "instrument.instrument_class == ORDINANCE"
          - "the Meeting named by input meeting_id has status == IN_SESSION"
        side_effects:
          - "instrument.reading_count += 1"
      - from: FIRST_READING_PASSED
        to: ADOPTED_UNOFFICIAL
        trigger: "POST /clerk/motions/{motion_id}/tally (motion_type == ORDINANCE_ADOPTION, passing)"
        actor: system
        preconditions:
          - "instrument.status == FIRST_READING_PASSED"
          - "motion.instrument_id == instrument.id"
        side_effects:
          - "instrument.voted_on = logical clock date"
      - from: INTRODUCED
        to: ADOPTED_UNOFFICIAL
        trigger: "POST /clerk/motions/{motion_id}/tally (motion_type == RESOLUTION_ADOPTION, passing)"
        actor: system
        preconditions:
          - "instrument.status == INTRODUCED"
          - "instrument.instrument_class == RESOLUTION"
        side_effects:
          - "instrument.voted_on = logical clock date"
      - from: FIRST_READING_PASSED
        to: FAILED
        trigger: "POST /clerk/motions/{motion_id}/tally (motion_type == ORDINANCE_ADOPTION, failing)"
        actor: system
        preconditions:
          - "instrument.status == FIRST_READING_PASSED"
        side_effects:
          - "no number is minted; instrument.assigned_number stays null"
      - from: ADOPTED_UNOFFICIAL
        to: ADOPTED
        trigger: "MinutesRecord SUBMITTED -> APPROVED cascade (hop 3)"
        actor: system
        preconditions:
          - "instrument.status == ADOPTED_UNOFFICIAL"
          - "the Motion that adopted it has result_official == true"
          - "NumberSeries.next_sequence <= MAX_SEQUENCE"
        side_effects:
          - "instrument.adoption_date = logical clock date"
          - "instrument.assigned_number minted from NumberSeries (hop 3 output); series.next_sequence += 1; series.minted_count += 1"
          - "when requires_publication == true: creates PublicationNotice{instrument_id, notice_type from calculation publication_requirement, status: DRAFT} (hop 4)"
          - "when requires_publication == false (RESOLUTION): effective_date_basis = ADOPTION_IMMEDIATE, effective_date = adoption_date, and the instrument transitions ADOPTED -> EFFECTIVE in the same cascade (hop 4)"
      - from: ADOPTED
        to: VETOED
        trigger: "POST /clerk/instruments/{instrument_id}/veto"
        actor: PresidingOfficer
        preconditions:
          - "instrument.status == ADOPTED"
          - "instrument.instrument_class == ORDINANCE"
        side_effects:
          - "instrument.veto_reason = input veto_reason"
          - "the PublicationNotice with instrument_id == instrument.id and status IN {DRAFT, ORDERED} transitions to VOID"
      - from: VETOED
        to: VETO_OVERRIDDEN
        trigger: "POST /clerk/motions/{motion_id}/tally (motion_type == VETO_OVERRIDE, passing under FOUR_FIFTHS)"
        actor: system
        preconditions:
          - "instrument.status == VETOED"
          - "motion.instrument_id == instrument.id"
          - "motion.majority_rule == FOUR_FIFTHS"
        side_effects:
          - "creates a replacement PublicationNotice{instrument_id, notice_type from calculation publication_requirement, status: DRAFT}"
      - from: ADOPTED
        to: PUBLISHED
        trigger: "POST /clerk/publication-notices/{notice_id}/certify-publication (hop 2 of cascade publication_certification_codification)"
        actor: system
        preconditions:
          - "instrument.status IN {ADOPTED, VETO_OVERRIDDEN}"
          - "notice.instrument_id == instrument.id and notice.status == ORDERED"
        side_effects:
          - "instrument.publication_completed_on = notice.publication_completed_on"
          - "instrument.effective_date_basis and instrument.effective_date = calculation instrument_effective_date"
          - "when ordinance_category == CODE_AMENDMENT: hop 3 auto-enrolls a CASCADE CodificationSubmission into the selected OPEN SupplementCycle"
          - "when ordinance_category != CODE_AMENDMENT: the instrument transitions PUBLISHED -> EFFECTIVE at the same time only if effective_date <= logical clock date; otherwise it stays PUBLISHED"
      - from: VETO_OVERRIDDEN
        to: PUBLISHED
        trigger: "POST /clerk/publication-notices/{notice_id}/certify-publication"
        actor: system
        preconditions:
          - "instrument.status == VETO_OVERRIDDEN"
          - "notice.instrument_id == instrument.id and notice.status == ORDERED"
        side_effects:
          - "same side-effect set as ADOPTED -> PUBLISHED"
      - from: PUBLISHED
        to: EFFECTIVE
        trigger: "POST /clerk/supplement-cycles/{cycle_id}/certify (for CODE_AMENDMENT ordinances) or the certify-publication cascade when effective_date <= clock date"
        actor: system
        preconditions:
          - "instrument.status == PUBLISHED"
          - "for CODE_AMENDMENT: the instrument has an ACCEPTED CodificationSubmission in the certified cycle"
        side_effects:
          - "instrument.effective_date recomputed under the SUPPLEMENT_CERTIFIED variant"

  - entity: PublicationNotice
    initial_state: DRAFT
    terminal_states: [PUBLISHED, VOID]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /clerk/publication-notices/{notice_id}/order"
        actor: CityClerk
        preconditions:
          - "notice.status == DRAFT"
          - "len(publication_dates) == notice.required_publication_count"
          - "max(publication_dates) <= notice.publication_deadline_on"
          - "publication_dates strictly increasing with consecutive gaps >= PUBLICATION_MIN_GAP_DAYS"
        side_effects:
          - "notice.gross_cost_cents, notice.discount_pct, notice.invoice_total_cents = calculation publication_invoice_total"
      - from: ORDERED
        to: PUBLISHED
        trigger: "POST /clerk/publication-notices/{notice_id}/certify-publication"
        actor: CityClerk
        preconditions:
          - "notice.status == ORDERED"
          - "input publication_completed_on == max(notice.publication_dates)"
        side_effects:
          - "notice.publication_completed_on = input publication_completed_on (hop 1 of cascade publication_certification_codification)"
          - "when notice.instrument_id is non-null: cascades the instrument ADOPTED|VETO_OVERRIDDEN -> PUBLISHED transition (hop 2)"
          - "when notice.notice_type IN {MEETING_AGENDA, CANCELLATION}: no further cascade"
      - from: DRAFT
        to: VOID
        trigger: "Meeting cancel cascade, packet withdraw cascade, or instrument veto cascade"
        actor: system
        preconditions:
          - "notice.status IN {DRAFT, ORDERED}"
        side_effects:
          - "notice.publication_dates and invoice fields are retained for audit"
      - from: ORDERED
        to: VOID
        trigger: "Meeting cancel cascade, packet withdraw cascade, or instrument veto cascade"
        actor: system
        preconditions:
          - "notice.status IN {DRAFT, ORDERED}"
        side_effects:
          - "notice.publication_dates and invoice fields are retained for audit"

  - entity: SupplementCycle
    initial_state: OPEN
    terminal_states: [CERTIFIED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /clerk/supplement-cycles/{cycle_id}/lock"
        actor: CodificationEditor
        preconditions:
          - "cycle.status == OPEN"
          - "cycle.submission_count >= 1"
        side_effects:
          - "every CodificationSubmission with cycle_id == cycle.id and status == PENDING transitions to IN_REVIEW"
          - "submissions already in CONFLICT_HELD are untouched (conditional cascade)"
      - from: LOCKED
        to: CERTIFIED
        trigger: "POST /clerk/supplement-cycles/{cycle_id}/certify"
        actor: CodificationEditor
        preconditions:
          - "cycle.status == LOCKED"
          - "cycle.conflict_count == 0"
          - "no CodificationSubmission with cycle_id == cycle.id has status IN {PENDING, IN_REVIEW, CONFLICT_HELD}"
          - "X-User-ID differs from every resolved_by_user_id recorded on this cycle's submissions"
        side_effects:
          - "cycle.certified_on = input certified_on"
          - "for each ACCEPTED submission: action ADD appends code_section_ref to CodeTitle.section_refs; action REPEAL removes it; action AMEND leaves the list unchanged"
          - "CodeTitle.current_supplement_number = cycle.supplement_number; increments CodeTitle.version by 1"
          - "each ACCEPTED submission's instrument transitions PUBLISHED -> EFFECTIVE with effective_date recomputed under the SUPPLEMENT_CERTIFIED variant"

  - entity: CodificationSubmission
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /clerk/supplement-cycles/{cycle_id}/lock (system cascade)"
        actor: system
        preconditions:
          - "submission.status == PENDING"
          - "the parent SupplementCycle.status transitions OPEN -> LOCKED in this request (cross-entity guard)"
        side_effects: []
      - from: PENDING
        to: CONFLICT_HELD
        trigger: "POST /clerk/codification-submissions or the certify-publication auto-enrolment (hop 4)"
        actor: system
        preconditions:
          - "an existing submission S_old in the same cycle has status IN {PENDING, IN_REVIEW}, the same code_section_ref, and a DIFFERENT instrument_id"
        side_effects:
          - "both the new submission and S_old set status = CONFLICT_HELD and conflict_with_submission_id = each other's id"
          - "cycle.conflict_count += 1"
      - from: IN_REVIEW
        to: CONFLICT_HELD
        trigger: "POST /clerk/codification-submissions or the certify-publication auto-enrolment (hop 4)"
        actor: system
        preconditions:
          - "the incoming submission collides on code_section_ref with a DIFFERENT instrument_id"
        side_effects:
          - "same side-effect set as PENDING -> CONFLICT_HELD"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /clerk/codification-submissions (supersede: same instrument_id and same code_section_ref)"
        actor: system
        preconditions:
          - "submission.status == PENDING"
          - "the new submission has the same cycle_id, instrument_id and code_section_ref"
        side_effects:
          - "cycle.submission_count and cycle.client_submission_count are decremented for the superseded row and incremented for the new one (net zero)"
      - from: IN_REVIEW
        to: ACCEPTED
        trigger: "POST /clerk/codification-submissions/{submission_id}/decide with decision == ACCEPT"
        actor: CodificationEditor
        preconditions:
          - "submission.status == IN_REVIEW"
          - "the parent SupplementCycle.status == LOCKED"
        side_effects: []
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /clerk/codification-submissions/{submission_id}/decide with decision == REJECT"
        actor: CodificationEditor
        preconditions:
          - "submission.status == IN_REVIEW"
          - "the parent SupplementCycle.status == LOCKED"
        side_effects: []
      - from: CONFLICT_HELD
        to: ACCEPTED
        trigger: "POST /clerk/codification-submissions/{submission_id}/resolve-conflict"
        actor: CodificationEditor
        preconditions:
          - "submission.status == CONFLICT_HELD"
          - "the parent SupplementCycle.status == LOCKED"
        side_effects:
          - "the winner selected by calculation supplement_conflict_precedence becomes ACCEPTED, its counterpart becomes REJECTED"
          - "conflict_with_submission_id is cleared on both rows; resolution_basis and resolved_by_user_id are stamped on both"
          - "cycle.conflict_count -= 1"
      - from: CONFLICT_HELD
        to: REJECTED
        trigger: "POST /clerk/codification-submissions/{submission_id}/resolve-conflict"
        actor: CodificationEditor
        preconditions:
          - "submission.status == CONFLICT_HELD"
          - "the parent SupplementCycle.status == LOCKED"
        side_effects:
          - "same side-effect set as CONFLICT_HELD -> ACCEPTED, applied from the loser's perspective"

  - entity: PublicRecordsRequest
    initial_state: "fulfillment_status: RECEIVED × fee_status: NOT_ASSESSED"
    terminal_states: ["fulfillment_status: CLOSED", "fulfillment_status: WITHDRAWN"]
    transitions:
      - from: "fulfillment_status: RECEIVED"
        to: "fulfillment_status: UNDER_REVIEW"
        trigger: "POST /clerk/records-requests/{request_id}/begin-review"
        actor: CityClerk
        preconditions:
          - "request.fulfillment_status == RECEIVED"
        side_effects: []
        note: "Dimension 1 of 2. fee_status is untouched by every transition on this axis."
      - from: "fulfillment_status: UNDER_REVIEW"
        to: "fulfillment_status: EXEMPTION_REVIEW"
        trigger: "POST /clerk/records-requests/{request_id}/exemption-review"
        actor: RecordsOfficer
        preconditions:
          - "request.fulfillment_status == UNDER_REVIEW"
        side_effects:
          - "request.exemption_count = len(input exemption_claims)"
      - from: "fulfillment_status: EXEMPTION_REVIEW"
        to: "fulfillment_status: RELEASED"
        trigger: "POST /clerk/records-requests/{request_id}/disposition with disposition == FULL_RELEASE"
        actor: CityClerk
        preconditions:
          - "request.fulfillment_status IN {UNDER_REVIEW, EXEMPTION_REVIEW}"
        side_effects: []
      - from: "fulfillment_status: EXEMPTION_REVIEW"
        to: "fulfillment_status: PARTIALLY_RELEASED"
        trigger: "POST /clerk/records-requests/{request_id}/disposition with disposition == PARTIAL_RELEASE"
        actor: CityClerk
        preconditions:
          - "request.fulfillment_status IN {UNDER_REVIEW, EXEMPTION_REVIEW}"
          - "request.exemption_count >= 1"
        side_effects: []
      - from: "fulfillment_status: EXEMPTION_REVIEW"
        to: "fulfillment_status: DENIED"
        trigger: "POST /clerk/records-requests/{request_id}/disposition with disposition == DENIAL"
        actor: RecordsOfficer
        preconditions:
          - "request.fulfillment_status == EXEMPTION_REVIEW"
          - "request.exemption_count >= 1"
          - "input denial_basis is present"
        side_effects:
          - "request.denial_basis = input denial_basis"
      - from: "fulfillment_status: RELEASED"
        to: "fulfillment_status: CLOSED"
        trigger: "POST /clerk/records-requests/{request_id}/close"
        actor: CityClerk
        preconditions:
          - "request.fulfillment_status IN {RELEASED, PARTIALLY_RELEASED, DENIED}"
          - "request.fee_balance_cents == 0"
        side_effects:
          - "request.closed_on = logical clock date"
          - "for every RecordSeries with retention_trigger == REQUEST_CLOSURE and id == request.target_series_id: recompute eligible_through_on from calculation destruction_eligibility_date"
      - from: "fulfillment_status: RECEIVED"
        to: "fulfillment_status: WITHDRAWN"
        trigger: "POST /clerk/records-requests/{request_id}/withdraw"
        actor: Requester
        preconditions:
          - "request.fulfillment_status NOT IN {CLOSED, WITHDRAWN}"
          - "X-User-ID == request.id when acting as Requester"
        side_effects:
          - "compensating action: request.total_waived_cents = request.total_assessed_cents; request.refunded_cents = request.total_collected_cents"
          - "request.fee_balance_cents = 0 and request.net_cash_cents = 0 (invariant records_request_cash_conservation)"
          - "request.fee_status = REFUNDED when total_collected_cents > 0, else WAIVED when total_assessed_cents > 0, else NOT_ASSESSED"
      - from: "fee_status: NOT_ASSESSED"
        to: "fee_status: ASSESSED"
        trigger: "POST /clerk/records-requests/{request_id}/assess-fee"
        actor: CityClerk
        preconditions:
          - "request.fee_status == NOT_ASSESSED"
          - "request.fulfillment_status NOT IN {CLOSED, WITHDRAWN}"
        side_effects:
          - "request.fee_schedule_variant, request.total_assessed_cents = calculation records_request_fee_assessment"
          - "request.fee_balance_cents and request.net_cash_cents = calculation records_request_fee_ledger"
        note: "Dimension 2 of 2. fulfillment_status is untouched by every transition on this axis."
      - from: "fee_status: ASSESSED"
        to: "fee_status: DEPOSIT_HELD"
        trigger: "POST /clerk/records-requests/{request_id}/payments (partial payment)"
        actor: Requester
        preconditions:
          - "request.fee_status IN {ASSESSED, DEPOSIT_HELD}"
          - "amount_cents <= request.fee_balance_cents"
        side_effects:
          - "request.total_collected_cents += amount_cents; ledger recomputed"
      - from: "fee_status: DEPOSIT_HELD"
        to: "fee_status: PAID"
        trigger: "POST /clerk/records-requests/{request_id}/payments (final payment)"
        actor: Requester
        preconditions:
          - "request.fee_status IN {ASSESSED, DEPOSIT_HELD}"
          - "amount_cents == request.fee_balance_cents"
        side_effects:
          - "request.total_collected_cents += amount_cents; request.fee_balance_cents == 0"
      - from: "fee_status: ASSESSED"
        to: "fee_status: WAIVED"
        trigger: "POST /clerk/records-requests/{request_id}/waive-fee"
        actor: RecordsOfficer
        preconditions:
          - "request.fee_status IN {ASSESSED, DEPOSIT_HELD}"
          - "waived_cents <= request.fee_balance_cents"
        side_effects:
          - "request.total_waived_cents += waived_cents; ledger recomputed"
          - "fee_status becomes WAIVED when the resulting fee_balance_cents == 0 and net_cash_cents == 0; becomes PAID when balance == 0 and net_cash_cents > 0; otherwise unchanged"
      - from: "fee_status: PAID"
        to: "fee_status: REFUNDED"
        trigger: "POST /clerk/records-requests/{request_id}/withdraw"
        actor: Requester
        preconditions:
          - "request.fulfillment_status NOT IN {CLOSED, WITHDRAWN}"
        side_effects:
          - "see the fulfillment WITHDRAWN transition; both axes move in the same request"

  - entity: DestructionBatch
    initial_state: PROPOSED
    terminal_states: [RESCINDED]
    transitions:
      - from: PROPOSED
        to: CERTIFIED
        trigger: "POST /clerk/destruction-batches/{batch_id}/certify"
        actor: CityClerk
        preconditions:
          - "batch.status == PROPOSED"
          - "series.legal_hold_status == NONE"
          - "recomputed blocking_request_id is null (cross-entity guard on PublicRecordsRequest)"
          - "X-User-ID != batch.proposed_by_officer_id"
          - "batch.item_count <= series.active_item_count"
        side_effects:
          - "batch.certifying_officer_id = X-User-ID; batch.certified_on = input certified_on"
          - "series.active_item_count -= batch.item_count; series.destroyed_item_count += batch.item_count"
          - "invariant record_custody_conservation holds: total_accessioned_count == active_item_count + destroyed_item_count"
      - from: CERTIFIED
        to: RESCINDED
        trigger: "POST /clerk/destruction-batches/{batch_id}/rescind"
        actor: RecordsOfficer
        preconditions:
          - "batch.status == CERTIFIED"
        side_effects:
          - "compensating action: series.active_item_count += batch.item_count; series.destroyed_item_count -= batch.item_count"
          - "batch.rescind_reason = input rescind_reason; certifying_officer_id and certified_on are retained for audit"
          - "invariant record_custody_conservation holds with zero drift"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — only sanctioned mechanism)
# =====================================================================
concurrency_rules:
  - rule_id: packet-revision-create-stale-meeting
    parent_entity: Meeting
    write_endpoint: "POST /clerk/meetings/{meeting_id}/agenda-packets"
    occ_field: "expected_meeting_version"
    description: |
      Creating a new AgendaPacket revision against a Meeting whose version has
      advanced since the client last read it is rejected. A new revision
      legitimately supersedes the prior POSTED packet and returns the Meeting to
      SCHEDULED, so the operation is valid on its own terms; the stale version
      check is what keeps a writer from superseding a notice state it never saw.
    error_id: ERR_STALE_MEETING_VERSION
    http_status: 412

  - rule_id: submission-create-stale-code-title
    parent_entity: CodeTitle
    write_endpoint: "POST /clerk/codification-submissions"
    occ_field: "expected_code_title_version"
    description: |
      Filing a CodificationSubmission against a CodeTitle whose version has
      advanced since the client last read it is rejected. A submission for a
      section already carried by a PENDING submission of the same instrument
      legitimately supersedes it, and certification of any cycle rewrites
      section_refs, so a writer holding a stale view of the title would be
      superseding or amending text it never observed.
    error_id: ERR_STALE_CODE_TITLE_VERSION
    http_status: 412

  - rule_id: minutes-correction-create-stale-minutes
    parent_entity: MinutesRecord
    write_endpoint: "POST /clerk/minutes/{minutes_id}/corrections"
    occ_field: "expected_minutes_version"
    description: |
      Opening a correction against a MinutesRecord whose version has advanced
      since the client last read it is rejected. A correction legitimately
      replaces the approved narrative, so a second correction author working
      from a stale reading would overwrite a correction text or approval that
      landed after the reading.
    error_id: ERR_STALE_MINUTES_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules
# =====================================================================
calculations:

  - name: meeting_notice_requirement
    trigger: "POST /clerk/meetings/{meeting_id}/agenda-packets"
    algorithm: threshold
    input_set:
      - "Meeting.body_type and Meeting.meeting_type of the parent meeting"
      - "AgendaPacket.late_addendum"
      - "AgendaPacket.contains_public_hearing, re-derived at post time from the packet's AgendaItems"
      - "Meeting.scheduled_start"
    constants:
      BASE_NOTICE_HOURS: "{ REGULAR: 72, SPECIAL: 48, EMERGENCY: 24, WORKSHOP: 48 }"
      PUBLIC_HEARING_ADDITIONAL_HOURS: 168
      LATE_ADDENDUM_PENALTY_HOURS: 24
      BODY_MULTIPLIER: "{ COUNCIL: 1.0, PLANNING_COMMISSION: 1.5, BOARD_OF_ADJUSTMENT: 1.5 }"
    formula: |
      raw_hours = BASE_NOTICE_HOURS[meeting.meeting_type]
                + (PUBLIC_HEARING_ADDITIONAL_HOURS if packet.contains_public_hearing else 0)
                + (LATE_ADDENDUM_PENALTY_HOURS if packet.late_addendum else 0)
      required_notice_hours = ceil(raw_hours * BODY_MULTIPLIER[meeting.body_type])
      notice_deadline_at = meeting.scheduled_start - required_notice_hours hours
    output_field: "AgendaPacket.required_notice_hours, AgendaPacket.notice_deadline_at"
    precision: "required_notice_hours is an integer; the multiplication is rounded UP (ceil) before the subtraction, never after"
    example: |
      COUNCIL / REGULAR, no public hearing, no addendum, scheduled_start 2026-09-15T18:00:00Z:
        raw = 72; required = ceil(72 * 1.0) = 72; deadline = 2026-09-12T18:00:00Z
      COUNCIL / SPECIAL, public hearing, late addendum, same start:
        raw = 48 + 168 + 24 = 240; required = ceil(240 * 1.0) = 240; deadline = 2026-09-05T18:00:00Z
      PLANNING_COMMISSION / SPECIAL, public hearing, late addendum, same start:
        raw = 240; required = ceil(240 * 1.5) = 360; deadline = 2026-08-31T18:00:00Z
      PLANNING_COMMISSION / REGULAR, no hearing, no addendum, same start:
        raw = 72; required = ceil(72 * 1.5) = 108; deadline = 2026-09-11T06:00:00Z

  - name: agenda_notice_compliance
    trigger: "POST /clerk/agenda-packets/{packet_id}/post"
    algorithm: threshold
    input_set:
      - "AgendaPacket.notice_deadline_at recomputed at post time from calculation meeting_notice_requirement"
      - "the logical clock instant, stored as AgendaPacket.posted_at"
    constants:
      COMPARISON: "posted_at <= notice_deadline_at (inclusive: posting exactly at the deadline instant is compliant)"
    formula: |
      required_notice_hours and notice_deadline_at are RECOMPUTED at post time, because
      PUBLIC_HEARING items may have been added to the packet after it was created.
      notice_compliant = (posted_at <= notice_deadline_at)
    output_field: "AgendaPacket.notice_compliant, mirrored to Meeting.notice_compliant"
    precision: "instant comparison at second granularity; equality is compliant"
    example: |
      deadline 2026-09-12T18:00:00Z, clock 2026-09-12T18:00:00Z -> notice_compliant = true
      deadline 2026-09-12T18:00:00Z, clock 2026-09-12T18:00:01Z -> notice_compliant = false
      Posting still returns 201 in both cases; the false value blocks the later convene.

  - name: motion_vote_outcome
    trigger: "POST /clerk/motions/{motion_id}/tally"
    algorithm: threshold
    input_set:
      - "Meeting.present_member_count of the motion's meeting"
      - "input yes_count, no_count, abstain_count, recused_count"
      - "Motion.majority_rule"
      - "input presiding_tie_break (nullable enum YES|NO)"
    constants:
      MAJORITY_FRACTION: "{ SIMPLE: '1/2 exclusive', TWO_THIRDS: '2/3', FOUR_FIFTHS: '4/5', UNANIMOUS_CONSENT: 'all' }"
    formula: |
      effective_base = present_member_count - recused_count      # abstentions COUNT toward the base
      if effective_base == 0: raise ERR_NO_VOTING_MEMBERS
      if yes + no + abstain + recused != present_member_count: raise ERR_VOTE_TALLY_MISMATCH
      required_yes =
        SIMPLE            -> floor(effective_base / 2) + 1
        TWO_THIRDS        -> ceil(effective_base * 2 / 3)
        FOUR_FIFTHS       -> ceil(effective_base * 4 / 5)
        UNANIMOUS_CONSENT -> effective_base
      if yes >= required_yes: outcome = PASSED
      elif yes == no and majority_rule == SIMPLE and presiding_tie_break is not null:
        outcome = TIE_BROKEN_PASSED if presiding_tie_break == YES else TIE_BROKEN_FAILED
        tie_break_used = true
      else: outcome = FAILED
    output_field: "Motion.effective_base, Motion.required_yes, Motion.outcome, Motion.tie_break_used"
    precision: "integer arithmetic only; the tie-break branch is reachable ONLY for SIMPLE and only when yes == no"
    example: |
      present 7, recused 1, yes 3, no 2, abstain 1: base 6, required 4 -> FAILED
        (a majority of those actually voting, 3 of 5, would have passed - the abstention is in the base)
      present 6, recused 0, yes 3, no 3, abstain 0, tie_break YES: base 6, required 4 -> TIE_BROKEN_PASSED
      present 7, recused 0, yes 4, no 3, SIMPLE: base 7, required 4 -> PASSED
      present 7, recused 0, yes 5, no 2, TWO_THIRDS: base 7, required 5 -> PASSED
      present 7, recused 0, yes 4, no 3, TWO_THIRDS: base 7, required 5 -> FAILED
      present 5, recused 5: base 0 -> ERR_NO_VOTING_MEMBERS (422)

  - name: instrument_effective_date
    trigger: "POST /clerk/publication-notices/{notice_id}/certify-publication and POST /clerk/supplement-cycles/{cycle_id}/certify"
    algorithm: chronological
    variants:
      - name: PUBLICATION_PLUS_30
        when: "instrument_class == ORDINANCE and ordinance_category IN {GENERAL, ZONING}"
        difference: "Default for ORDINANCE with ordinance_category IN {GENERAL, ZONING}: publication_completed_on + EFFECTIVE_LAG_DAYS, then rolled forward off Saturday/Sunday."
      - name: ADOPTION_IMMEDIATE
        when: "instrument_class == RESOLUTION or ordinance_category == EMERGENCY"
        difference: "For instrument_class == RESOLUTION or ordinance_category == EMERGENCY: effective_date = adoption_date, no roll-forward."
      - name: SUPPLEMENT_CERTIFIED
        when: "ordinance_category == CODE_AMENDMENT"
        difference: "For ordinance_category == CODE_AMENDMENT: max(rolled publication_completed_on + EFFECTIVE_LAG_DAYS, the certified_on of the SupplementCycle carrying its ACCEPTED submission). Until that cycle is CERTIFIED the effective_date is null."
    input_set:
      - "LegislativeInstrument.instrument_class, ordinance_category, adoption_date, publication_completed_on"
      - "SupplementCycle.certified_on of the cycle holding the instrument's ACCEPTED CodificationSubmission"
    constants:
      EFFECTIVE_LAG_DAYS: 30
      WEEKEND_ROLL: "if the computed date falls on Saturday, add 2 days; if Sunday, add 1 day; ADOPTION_IMMEDIATE never rolls"
    formula: |
      variant selection (evaluated in this order, first match wins):
        instrument_class == RESOLUTION            -> ADOPTION_IMMEDIATE
        ordinance_category == EMERGENCY           -> ADOPTION_IMMEDIATE
        ordinance_category == CODE_AMENDMENT      -> SUPPLEMENT_CERTIFIED
        otherwise                                -> PUBLICATION_PLUS_30
      base = publication_completed_on + EFFECTIVE_LAG_DAYS days
      rolled = base + (2 if base.weekday == SAT else 1 if base.weekday == SUN else 0)
      PUBLICATION_PLUS_30  -> effective_date = rolled
      ADOPTION_IMMEDIATE   -> effective_date = adoption_date
      SUPPLEMENT_CERTIFIED -> effective_date = max(rolled, cycle.certified_on) or null if the cycle is not CERTIFIED
    output_field: "LegislativeInstrument.effective_date_basis, LegislativeInstrument.effective_date"
    precision: "calendar-date arithmetic in UTC; the weekend roll is applied AFTER the 30-day addition, never before"
    example: |
      publication_completed_on 2026-10-16 -> base 2026-11-15 (Sunday) -> effective 2026-11-16
      publication_completed_on 2026-10-05 -> base 2026-11-04 (Wednesday) -> effective 2026-11-04
      publication_completed_on 2026-08-20 -> base 2026-09-19 (Saturday) -> effective 2026-09-21
      CODE_AMENDMENT, publication_completed_on 2026-08-20, cycle certified_on 2026-10-01
        -> max(2026-09-21, 2026-10-01) = 2026-10-01
      CODE_AMENDMENT, publication_completed_on 2026-10-16, cycle certified_on 2026-10-01
        -> max(2026-11-16, 2026-10-01) = 2026-11-16

  - name: publication_requirement
    trigger: "the DRAFT PublicationNotice creation cascades (instrument adoption, packet post, meeting cancel)"
    algorithm: threshold
    input_set:
      - "PublicationNotice.notice_type"
      - "LegislativeInstrument.adoption_date and full_text_length for instrument notices"
      - "Meeting.scheduled_start for agenda and cancellation notices"
    constants:
      REQUIRED_INSERTIONS: "{ ORDINANCE_FULL_TEXT: 2, ORDINANCE_SUMMARY: 1, MEETING_AGENDA: 1, CANCELLATION: 1 }"
      SUMMARY_THRESHOLD_CHARS: 4000
      PUBLICATION_DEADLINE_DAYS: 15
      PUBLICATION_MIN_GAP_DAYS: 7
    formula: |
      notice_type selection for instrument notices:
        instrument.full_text_length > SUMMARY_THRESHOLD_CHARS -> ORDINANCE_SUMMARY
        otherwise                                            -> ORDINANCE_FULL_TEXT
      required_publication_count = REQUIRED_INSERTIONS[notice_type]
      publication_deadline_on =
        instrument notices  -> instrument.adoption_date + PUBLICATION_DEADLINE_DAYS days
        MEETING_AGENDA      -> date(meeting.scheduled_start) - 1 day
        CANCELLATION        -> date(meeting.scheduled_start)
      Ordering constraint enforced at order time: the supplied publication_dates must be
      strictly increasing and each consecutive gap must be >= PUBLICATION_MIN_GAP_DAYS.
    output_field: "PublicationNotice.notice_type, required_publication_count, publication_deadline_on"
    precision: "a long ordinance needs FEWER insertions (summary, 1) than a short one (full text, 2) - the threshold inverts the intuitive direction"
    example: |
      full_text_length 3999, adoption_date 2026-09-20 -> ORDINANCE_FULL_TEXT, count 2, deadline 2026-10-05
      full_text_length 4000, adoption_date 2026-09-20 -> ORDINANCE_FULL_TEXT, count 2, deadline 2026-10-05
      full_text_length 4001, adoption_date 2026-09-20 -> ORDINANCE_SUMMARY,   count 1, deadline 2026-10-05
      meeting scheduled_start 2026-09-15T18:00:00Z, MEETING_AGENDA -> count 1, deadline 2026-09-14

  - name: publication_invoice_total
    trigger: "POST /clerk/publication-notices/{notice_id}/order"
    algorithm: tiered_pricing
    input_set:
      - "input column_inches (decimal, 2 places)"
      - "len(input publication_dates) as insertion_count"
      - "input affidavit_required (boolean)"
    constants:
      RATE_CENTS_PER_COLUMN_INCH: 500
      AFFIDAVIT_CENTS_PER_INSERTION: 2500
      VOLUME_TIERS: "gross_cost_cents < 50000 -> 0.00; 50000 <= gross < 150000 -> 0.05; gross >= 150000 -> 0.10"
    formula: |
      per_insertion_cents = round_half_up(column_inches * RATE_CENTS_PER_COLUMN_INCH)   # rounded FIRST, per insertion
      gross_cost_cents    = per_insertion_cents * insertion_count                        # affidavit EXCLUDED from gross
      discount_pct        = tier keyed on gross_cost_cents
      discounted_cents    = round_half_up(gross_cost_cents * (1 - discount_pct))
      affidavit_cents     = AFFIDAVIT_CENTS_PER_INSERTION * insertion_count if affidavit_required else 0
      invoice_total_cents = discounted_cents + affidavit_cents                           # affidavit added AFTER the discount
    output_field: "PublicationNotice.gross_cost_cents, discount_pct, invoice_total_cents"
    precision: "integer cents; round half up at the per-insertion step and again after the discount; the tier is keyed on gross EXCLUDING the affidavit, so an affidavit never buys a better tier"
    example: |
      column_inches 12.50, 2 insertions, affidavit true:
        per_insertion 6250, gross 12500, tier 0.00, discounted 12500, affidavit 5000, total 17500
      column_inches 50.00, 2 insertions, affidavit true:
        per_insertion 25000, gross 50000, tier 0.05, discounted 47500, affidavit 5000, total 52500
      column_inches 49.99, 2 insertions, affidavit true:
        per_insertion 24995, gross 49990, tier 0.00, discounted 49990, affidavit 5000, total 54990
        (a SMALLER ad bills MORE than the 50.00 one - the tier boundary inverts the ordering)
      column_inches 60.00, 2 insertions, affidavit false:
        per_insertion 30000, gross 60000, tier 0.05, discounted 57000, affidavit 0, total 57000
      column_inches 160.00, 2 insertions, affidavit false:
        per_insertion 80000, gross 160000, tier 0.10, discounted 144000, affidavit 0, total 144000

  - name: records_request_due_date
    trigger: "POST /clerk/records-requests"
    algorithm: chronological
    input_set:
      - "the logical clock date at intake, stored as PublicRecordsRequest.intake_on"
    constants:
      RESPONSE_BUSINESS_DAYS: 5
      BUSINESS_DAYS: "Monday..Friday; Saturday and Sunday are skipped and never consume a count"
    formula: |
      cursor = intake_on
      remaining = RESPONSE_BUSINESS_DAYS
      while remaining > 0:
        cursor += 1 day
        if cursor.weekday not in {SAT, SUN}: remaining -= 1
      due_on = cursor
    output_field: "PublicRecordsRequest.due_on"
    precision: "the received day itself is never counted; the walk always lands on a weekday"
    example: |
      intake_on 2026-08-03 (Monday)    -> due_on 2026-08-10
      intake_on 2026-09-01 (Tuesday)   -> due_on 2026-09-08
      intake_on 2026-08-07 (Friday)    -> due_on 2026-08-14

  - name: records_request_fee_assessment
    trigger: "POST /clerk/records-requests/{request_id}/assess-fee"
    algorithm: aggregation
    variants:
      - name: ACTUAL_COST
        when: "input fee_schedule_variant == ACTUAL_COST at assess-fee time"
        difference: "Per-line billing: each fee line is priced on its own page count and its own staff minutes, with the free-page allowance and the free staff quarter-hours applied ONCE against the first line's own quantities and each line's minutes rounded up to quarter-hours independently."
      - name: FLAT_SCHEDULE
        when: "input fee_schedule_variant == FLAT_SCHEDULE at assess-fee time"
        difference: "Schedule billing: page counts and staff minutes are SUMMED across all lines first, the allowances are applied to the totals, the summed minutes are rounded up to quarter-hours once, and the flat per-page rate replaces the copy rate with no electronic discount."
    input_set:
      - "input fee_lines[] with { page_count, staff_minutes, delivery_medium (PAPER|ELECTRONIC) }"
      - "PublicRecordsRequest.commercial_purpose"
      - "input fee_schedule_variant (ACTUAL_COST|FLAT_SCHEDULE)"
    constants:
      COPY_RATE_CENTS_PER_PAGE: 15
      FLAT_RATE_CENTS_PER_PAGE: 25
      FREE_PAGE_ALLOWANCE: 20
      STAFF_RATE_CENTS_PER_QUARTER_HOUR: 875
      FREE_STAFF_QUARTER_HOURS: 2
      ELECTRONIC_MEDIUM_DISCOUNT: 0.50
      COMMERCIAL_SURCHARGE_PCT: 0.20
    formula: |
      ACTUAL_COST:
        allowance = FREE_PAGE_ALLOWANCE
        copy_subtotal = 0
        for line in fee_lines (input order):
          billable_pages = max(0, line.page_count - allowance)
          allowance = max(0, allowance - line.page_count)
          line_copy = billable_pages * COPY_RATE_CENTS_PER_PAGE
          if line.delivery_medium == ELECTRONIC:
            line_copy = round_half_up(line_copy * (1 - ELECTRONIC_MEDIUM_DISCOUNT))
          copy_subtotal += line_copy
        quarter_hours = sum(ceil(line.staff_minutes / 15) for line in fee_lines)   # per line, then summed
        billable_qh   = max(0, quarter_hours - FREE_STAFF_QUARTER_HOURS)
        staff_subtotal = billable_qh * STAFF_RATE_CENTS_PER_QUARTER_HOUR
      FLAT_SCHEDULE:
        total_pages   = sum(line.page_count)
        billable_pages = max(0, total_pages - FREE_PAGE_ALLOWANCE)
        copy_subtotal = billable_pages * FLAT_RATE_CENTS_PER_PAGE          # no electronic discount
        total_minutes = sum(line.staff_minutes)
        quarter_hours = ceil(total_minutes / 15)                            # summed, then rounded ONCE
        billable_qh   = max(0, quarter_hours - FREE_STAFF_QUARTER_HOURS)
        staff_subtotal = billable_qh * STAFF_RATE_CENTS_PER_QUARTER_HOUR
      subtotal = copy_subtotal + staff_subtotal
      total_assessed_cents = round_half_up(subtotal * (1 + COMMERCIAL_SURCHARGE_PCT)) if commercial_purpose else subtotal
    output_field: "PublicRecordsRequest.fee_schedule_variant, PublicRecordsRequest.total_assessed_cents"
    precision: "integer cents throughout; the two variants differ in WHERE the rounding and the allowance land, so identical fee_lines yield different totals"
    example: |
      fee_lines = [ { page_count: 30, staff_minutes: 20, delivery_medium: PAPER },
                    { page_count: 30, staff_minutes: 25, delivery_medium: ELECTRONIC } ],
      commercial_purpose false
      ACTUAL_COST:   line1 = max(0, 30-20)=10 pages * 15 = 150 (PAPER)
                     line2 = max(0, 30-0)=30 pages * 15 = 450, * 0.50 = 225
                     copy_subtotal = 375
                     quarter_hours = ceil(20/15) + ceil(25/15) = 2 + 2 = 4; billable 2 -> 1750
                     total_assessed_cents = 375 + 1750 = 2125
      FLAT_SCHEDULE: total_pages 60, billable 40 * 25 = 1000
                     total_minutes 45, quarter_hours ceil(45/15) = 3, billable 1 -> 875
                     total_assessed_cents = 1000 + 875 = 1875
      commercial_purpose true on the same lines: ACTUAL_COST 2550, FLAT_SCHEDULE 2250
      free-page boundary, single PAPER line with staff_minutes 0:
        20 pages -> 0 cents; 21 pages -> 15 cents

  - name: records_request_fee_ledger
    trigger: "assess-fee, payments, waive-fee, withdraw"
    algorithm: aggregation
    input_set:
      - "PublicRecordsRequest.total_assessed_cents, total_waived_cents, total_collected_cents, refunded_cents"
    constants:
      INVARIANT: "records_request_cash_conservation"
    formula: |
      fee_balance_cents = total_assessed_cents - total_waived_cents - (total_collected_cents - refunded_cents)
      net_cash_cents    = total_collected_cents - refunded_cents
      Both are recomputed from the four stored counters on every fee-axis write; neither is
      ever incrementally patched. fee_balance_cents must never be negative:
        a payment with amount_cents > fee_balance_cents raises ERR_PAYMENT_EXCEEDS_BALANCE
        a waiver with waived_cents  > fee_balance_cents raises ERR_WAIVER_EXCEEDS_BALANCE
    output_field: "PublicRecordsRequest.fee_balance_cents, PublicRecordsRequest.net_cash_cents"
    precision: "integer cents; the withdraw compensation sets waived = assessed and refunded = collected, driving both derived fields to exactly 0"
    example: |
      assessed 1875, collected 0, waived 0, refunded 0 -> balance 1875, net_cash 0, fee_status ASSESSED
      after a 1000 payment -> collected 1000, balance 875, net_cash 1000, fee_status DEPOSIT_HELD
      after withdraw       -> waived 1875, refunded 1000, balance 0, net_cash 0, fee_status REFUNDED

  - name: supplement_conflict_precedence
    trigger: "POST /clerk/codification-submissions/{submission_id}/resolve-conflict"
    algorithm: topological
    input_set:
      - "the CONFLICT_HELD CodificationSubmission and the submission named by its conflict_with_submission_id"
      - "each submission's LegislativeInstrument (adoption_date, ordinance_category, assigned_number)"
      - "input resolution_basis and, for MANUAL_OVERRIDE, input winning_submission_id"
    constants:
      SPECIFICITY_RANK: "{ ZONING: 3, CODE_AMENDMENT: 2, GENERAL: 1, EMERGENCY: 0 }"
    formula: |
      LATER_ADOPTION_WINS:
        rank by instrument.adoption_date DESC
        tie-break 1: instrument.assigned_number sequence component DESC
        tie-break 2: submission.created_at ASC (never the submission id)
      SPECIFIC_OVER_GENERAL:
        rank by SPECIFICITY_RANK[instrument.ordinance_category] DESC
        tie-break 1: instrument.adoption_date DESC
        tie-break 2: submission.created_at ASC
      MANUAL_OVERRIDE:
        the winner is the submission named by input winning_submission_id, which must be one of
        the two conflict partners; otherwise ERR_INVALID_REQUEST
      winner   -> ACCEPTED, loser -> REJECTED
      both rows record resolution_basis and resolved_by_user_id
    output_field: "CodificationSubmission.status, resolution_basis, resolved_by_user_id (on both partners)"
    precision: "deterministic under every basis; the two bases can select OPPOSITE winners on the same pair, which is the point of recording resolution_basis"
    example: |
      S_a: instrument ZONING,  adoption_date 2026-08-10, assigned_number ORD-2026-004, created_at earlier
      S_b: instrument GENERAL, adoption_date 2026-09-01, assigned_number ORD-2026-007, created_at later
      LATER_ADOPTION_WINS   -> S_b wins (2026-09-01 > 2026-08-10)
      SPECIFIC_OVER_GENERAL -> S_a wins (ZONING rank 3 > GENERAL rank 1)
      MANUAL_OVERRIDE with winning_submission_id = S_a.id -> S_a wins

  - name: destruction_eligibility_date
    trigger: "POST /clerk/record-series (create), POST /clerk/record-series/{series_id}/accessions, POST /clerk/records-requests/{request_id}/close, POST /clerk/destruction-batches"
    algorithm: chronological
    input_set:
      - "RecordSeries.retention_trigger, retention_years, last_accessioned_on, permanent"
      - "the closed_on dates of PublicRecordsRequests whose target_series_id == series.id and fulfillment_status == CLOSED"
    constants:
      FISCAL_YEAR_END_MONTH_DAY: "06-30 (the fiscal year ends on 30 June)"
      PERMANENT: "permanent == true means eligible_through_on is always null"
    formula: |
      anchor =
        CREATION         -> series.last_accessioned_on
        FISCAL_YEAR_END  -> the first 06-30 that is >= series.last_accessioned_on
        REQUEST_CLOSURE  -> max(closed_on) over CLOSED PublicRecordsRequests on this series;
                            if there is none the anchor is UNRESOLVED
      if series.permanent:       eligible_through_on = null
      elif anchor is UNRESOLVED: eligible_through_on = null
      else:                      eligible_through_on = anchor + series.retention_years years
      A destruction batch may only be PROPOSED when eligible_through_on is non-null and
      eligible_through_on <= the logical clock date; a null anchor under REQUEST_CLOSURE raises
      ERR_RETENTION_ANCHOR_UNRESOLVED, a future date raises ERR_RETENTION_PERIOD_NOT_ELAPSED,
      and permanent == true raises ERR_SERIES_PERMANENT_RETENTION.
    output_field: "RecordSeries.eligible_through_on"
    precision: "calendar-year addition; 29 February anchors clamp to 28 February in a non-leap target year"
    example: |
      last_accessioned_on 2019-06-15, retention_years 5, CREATION        -> 2024-06-15
      last_accessioned_on 2019-06-15, retention_years 5, FISCAL_YEAR_END -> anchor 2019-06-30 -> 2024-06-30
      last_accessioned_on 2019-07-01, retention_years 5, FISCAL_YEAR_END -> anchor 2020-06-30 -> 2025-06-30
      retention_trigger REQUEST_CLOSURE with no CLOSED request -> null (ERR_RETENTION_ANCHOR_UNRESOLVED)
      retention_trigger REQUEST_CLOSURE, closed_on 2020-03-01, retention_years 5 -> 2025-03-01
      permanent true -> null (ERR_SERIES_PERMANENT_RETENTION)

  - name: record_custody_conservation
    trigger: "POST /clerk/record-series/{series_id}/accessions, POST /clerk/destruction-batches/{batch_id}/certify, POST /clerk/destruction-batches/{batch_id}/rescind"
    algorithm: aggregation
    input_set:
      - "RecordSeries.total_accessioned_count, active_item_count, destroyed_item_count"
      - "DestructionBatch.item_count of the batch being certified or rescinded"
    constants:
      INVARIANT: "total_accessioned_count == active_item_count + destroyed_item_count, at every observable moment"
    formula: |
      accession(n):  total_accessioned_count += n; active_item_count += n
      certify(batch): active_item_count -= batch.item_count; destroyed_item_count += batch.item_count
      rescind(batch): active_item_count += batch.item_count; destroyed_item_count -= batch.item_count
      total_accessioned_count is NEVER changed by certify or rescind - destruction moves items
      between the two sub-counters without altering the custody total. A certify whose
      item_count exceeds active_item_count raises ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE rather
      than driving active_item_count negative.
    output_field: "RecordSeries.total_accessioned_count, active_item_count, destroyed_item_count"
    precision: "integer counts; certify followed by rescind restores the exact pre-certify triple with zero drift"
    example: |
      accession 100 then 50   -> total 150, active 150, destroyed 0
      certify a batch of 40   -> total 150, active 110, destroyed 40
      rescind the same batch  -> total 150, active 150, destroyed 0
      certify a batch of 200 against active 150 -> ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE (422)

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:

  # ---- 1..4 authentication and authorization -------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present on every request"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names one of the seven roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for the entity-backed Requester role, X-User-ID equals the PublicRecordsRequest.id named in the path"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /clerk/records-requests/{request_id}, POST /clerk/records-requests/{request_id}/payments, POST /clerk/records-requests/{request_id}/withdraw"

  # ---- 10..12 existence ---------------------------------------------
  - priority: 10
    category: existence
    check: "every templated id in the path resolves, validated left to right"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_MEETING_NOT_FOUND | ERR_PACKET_NOT_FOUND | ERR_AGENDA_ITEM_NOT_FOUND | ERR_MOTION_NOT_FOUND | ERR_MINUTES_NOT_FOUND | ERR_NUMBER_SERIES_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_CODE_TITLE_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_SERIES_NOT_FOUND | ERR_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a templated path segment"
  - priority: 12
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_VENUE_NOT_FOUND | ERR_MEETING_NOT_FOUND | ERR_AGENDA_ITEM_NOT_FOUND | ERR_MINUTES_NOT_FOUND | ERR_NUMBER_SERIES_NOT_FOUND | ERR_INSTRUMENT_NOT_FOUND | ERR_CODE_TITLE_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_SUBMISSION_NOT_FOUND | ERR_SERIES_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input list contains a *_id field"

  # ---- 14..16 request shape -----------------------------------------
  - priority: 14
    category: state
    check: "required input fields present, enum values inside the declared set, numeric ranges honoured, dates well formed, scheduled_end > scheduled_start, ordinance_category null exactly when instrument_class == RESOLUTION, code_title_id and code_section_ref present exactly when ordinance_category == CODE_AMENDMENT, denial_basis present when disposition == DENIAL, winning_submission_id one of the two conflict partners when resolution_basis == MANUAL_OVERRIDE"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 16
    category: state
    check: "limit within 1..100 and offset >= 0 on every list endpoint"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"

  # ---- 20 optimistic concurrency ------------------------------------
  - priority: 20
    category: state
    check: "expected_<parent>_version equals the parent entity's current version (see §1.2.1)"
    error_id: "ERR_STALE_MEETING_VERSION | ERR_STALE_CODE_TITLE_VERSION | ERR_STALE_MINUTES_VERSION"
    http_status: 412
    applies_to: "POST /clerk/meetings/{meeting_id}/agenda-packets, POST /clerk/codification-submissions, POST /clerk/minutes/{minutes_id}/corrections"

  # ---- 30..38 state preconditions -----------------------------------
  - priority: 30
    category: state
    check: "the target entity is in a state from which this transition is declared in §1.2"
    error_id: "ERR_INVALID_MEETING_STATE | ERR_INVALID_PACKET_STATE | ERR_INVALID_MOTION_STATE | ERR_INVALID_MINUTES_STATE | ERR_INVALID_INSTRUMENT_STATE | ERR_INVALID_NOTICE_STATE | ERR_INVALID_SUBMISSION_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_REQUEST_STATE"
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 32
    category: state
    check: "the Meeting named by the motion or the reading is IN_SESSION"
    error_id: ERR_MEETING_NOT_IN_SESSION
    http_status: 409
    applies_to: "POST /clerk/motions, POST /clerk/motions/{motion_id}/tally, POST /clerk/instruments/{instrument_id}/advance-reading"
  - priority: 34
    category: state
    check: "the parent SupplementCycle is OPEN for submission filing and LOCKED for decide, resolve-conflict and certify"
    error_id: "ERR_CYCLE_NOT_OPEN | ERR_CYCLE_NOT_LOCKED"
    http_status: 409
    applies_to: "POST /clerk/codification-submissions, POST /clerk/codification-submissions/{submission_id}/decide, POST /clerk/codification-submissions/{submission_id}/resolve-conflict, POST /clerk/supplement-cycles/{cycle_id}/certify"
  - priority: 36
    category: state
    check: "the NumberSeries the instrument draws from is OPEN when a number must be minted"
    error_id: ERR_NUMBER_SERIES_CLOSED
    http_status: 409
    applies_to: "POST /clerk/motions/{motion_id}/tally (MINUTES_APPROVAL cascade), POST /clerk/instruments"
  - priority: 38
    category: state
    check: "the SupplementCycle has no submission left in PENDING, IN_REVIEW or CONFLICT_HELD, and conflict_count == 0, before it may be certified"
    error_id: "ERR_CYCLE_HAS_OPEN_SUBMISSIONS | ERR_UNRESOLVED_CONFLICTS"
    http_status: 409
    applies_to: "POST /clerk/supplement-cycles/{cycle_id}/certify"

  # ---- 40 disclosure-axis closability ------------------------------
  - priority: 40
    category: state
    check: "the PublicRecordsRequest is in RELEASED, PARTIALLY_RELEASED or DENIED before it may be closed"
    error_id: ERR_REQUEST_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /clerk/records-requests/{request_id}/close"

  # ---- 45 segregation of duties ------------------------------------
  - priority: 45
    category: business_safety
    check: "the acting X-User-ID differs from the user who performed the paired earlier step: batch.proposed_by_officer_id for destruction certification, and every resolved_by_user_id on the cycle's submissions for cycle certification"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /clerk/destruction-batches/{batch_id}/certify, POST /clerk/supplement-cycles/{cycle_id}/certify"

  # ---- 50..58 safety / compliance / regulatory ----------------------
  - priority: 50
    category: business_safety
    check: "open-meeting notice compliance: a meeting may only convene when notice_compliant == true, and a reschedule must not move scheduled_start so that the already-posted packet's recomputed notice_deadline_at falls at or before the logical clock"
    error_id: ERR_NOTICE_DEADLINE_MISSED
    http_status: 409
    applies_to: "POST /clerk/meetings/{meeting_id}/convene, POST /clerk/meetings/{meeting_id}/reschedule"
  - priority: 52
    category: business_safety
    check: "the RecordSeries is not under a legal hold and is not flagged permanent when a destruction batch is proposed or certified"
    error_id: "ERR_SERIES_UNDER_LEGAL_HOLD | ERR_SERIES_PERMANENT_RETENTION"
    http_status: 409
    applies_to: "POST /clerk/destruction-batches, POST /clerk/destruction-batches/{batch_id}/certify"
  - priority: 54
    category: business_safety
    check: "no PublicRecordsRequest with target_series_id == series.id sits outside CLOSED and WITHDRAWN when a destruction batch is certified"
    error_id: ERR_SERIES_HAS_OPEN_REQUEST
    http_status: 409
    applies_to: "POST /clerk/destruction-batches/{batch_id}/certify"
  - priority: 56
    category: business_safety
    check: "present_member_count >= meeting.quorum_required at convene"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /clerk/meetings/{meeting_id}/convene"
  - priority: 58
    category: business_safety
    check: "the tally accounts for exactly present_member_count members, and at least one member remains unrecused"
    error_id: "ERR_VOTE_TALLY_MISMATCH | ERR_NO_VOTING_MEMBERS"
    http_status: 422
    applies_to: "POST /clerk/motions/{motion_id}/tally"

  # ---- 60..62 capacity and aggregate constraints --------------------
  - priority: 60
    category: business_constraint
    check: "aggregate caps and uniqueness: client-origin submissions per cycle <= MAX_CLIENT_SUBMISSIONS_PER_CYCLE (3; origin CASCADE is exempt); agenda packet revisions per meeting <= MAX_PACKET_REVISIONS (3); NumberSeries.next_sequence <= MAX_SEQUENCE (999); (series_year, instrument_class) unique across NumberSeries; (code_title_id, supplement_number) unique across SupplementCycle; (packet_id, sequence_number) unique across AgendaItem; series_code unique across RecordSeries; title_number unique across CodeTitle"
    error_id: "ERR_CYCLE_SUBMISSION_CAPACITY | ERR_PACKET_REVISION_LIMIT | ERR_NUMBER_SERIES_EXHAUSTED | ERR_DUPLICATE_NUMBER_SERIES | ERR_DUPLICATE_SUPPLEMENT_NUMBER | ERR_DUPLICATE_SEQUENCE_NUMBER | ERR_DUPLICATE_SERIES_CODE | ERR_DUPLICATE_CODE_TITLE"
    http_status: 422
    applies_to: "POST /clerk/codification-submissions, POST /clerk/meetings/{meeting_id}/agenda-packets, POST /clerk/motions/{motion_id}/tally, POST /clerk/number-series, POST /clerk/code-titles/{title_id}/supplement-cycles, POST /clerk/agenda-packets/{packet_id}/agenda-items, POST /clerk/record-series, POST /clerk/code-titles"
  - priority: 62
    category: business_constraint
    check: "a destruction batch's item_count does not exceed the series' active_item_count, keeping invariant record_custody_conservation non-negative"
    error_id: ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE
    http_status: 422
    applies_to: "POST /clerk/destruction-batches, POST /clerk/destruction-batches/{batch_id}/certify"

  # ---- 64..70 temporal constraints ---------------------------------
  - priority: 64
    category: business_temporal
    check: "the venue occupation [scheduled_start, scheduled_end) extended by Venue.teardown_buffer_minutes must not overlap another Meeting on the same venue in status SCHEDULED, NOTICED or IN_SESSION; the venue must also not be CLOSED"
    error_id: "ERR_VENUE_WINDOW_CONFLICT | ERR_VENUE_CLOSED"
    http_status: 409
    applies_to: "POST /clerk/meetings, POST /clerk/meetings/{meeting_id}/reschedule"
  - priority: 66
    category: business_temporal
    check: "a SupplementCycle's inclusive [window_open_on, window_close_on] date interval must not overlap or abut another OPEN or LOCKED cycle on the same CodeTitle, and window_close_on must be >= window_open_on"
    error_id: ERR_SUPPLEMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /clerk/code-titles/{title_id}/supplement-cycles"
  - priority: 68
    category: business_temporal
    check: "publication scheduling: len(publication_dates) == required_publication_count, max(publication_dates) <= publication_deadline_on, and every consecutive gap >= PUBLICATION_MIN_GAP_DAYS with strictly increasing dates"
    error_id: "ERR_PUBLICATION_COUNT_MISMATCH | ERR_PUBLICATION_DEADLINE_MISSED | ERR_PUBLICATION_INTERVAL_TOO_SHORT"
    http_status: 409
    applies_to: "POST /clerk/publication-notices/{notice_id}/order"
  - priority: 70
    category: business_temporal
    check: "the logical clock date falls inside the cycle's [window_open_on, window_close_on] when a client-origin submission is filed"
    error_id: ERR_OUTSIDE_SUBMISSION_WINDOW
    http_status: 409
    applies_to: "POST /clerk/codification-submissions"
  - priority: 72
    category: business_temporal
    check: "series.eligible_through_on is resolvable and has elapsed relative to the logical clock date, and batch.cutoff_on <= series.eligible_through_on"
    error_id: "ERR_RETENTION_ANCHOR_UNRESOLVED | ERR_RETENTION_PERIOD_NOT_ELAPSED"
    http_status: 409
    applies_to: "POST /clerk/destruction-batches"

  # ---- 80..84 fiscal ----------------------------------------------
  - priority: 80
    category: business_fiscal
    check: "fee_balance_cents == 0 before a PublicRecordsRequest may be closed"
    error_id: ERR_FEE_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /clerk/records-requests/{request_id}/close"
  - priority: 82
    category: business_fiscal
    check: "a payment's amount_cents does not exceed the request's current fee_balance_cents, and a fee must already be assessed"
    error_id: "ERR_PAYMENT_EXCEEDS_BALANCE | ERR_FEE_NOT_ASSESSED"
    http_status: 422
    applies_to: "POST /clerk/records-requests/{request_id}/payments"
  - priority: 84
    category: business_fiscal
    check: "a waiver's waived_cents does not exceed the request's current fee_balance_cents; a fee may be assessed only once"
    error_id: "ERR_WAIVER_EXCEEDS_BALANCE | ERR_FEE_ALREADY_ASSESSED"
    http_status: 422
    applies_to: "POST /clerk/records-requests/{request_id}/waive-fee, POST /clerk/records-requests/{request_id}/assess-fee"

  # ---- 90..94 referential / configuration --------------------------
  - priority: 90
    category: business_referential
    check: "a submission's code_section_ref matches its instrument's code_section_ref, and the instrument's code_title_id matches the cycle's code_title_id"
    error_id: ERR_CODE_SECTION_UNKNOWN
    http_status: 422
    applies_to: "POST /clerk/codification-submissions"
  - priority: 92
    category: business_referential
    check: "the NumberSeries instrument_class matches the instrument's instrument_class, and the series_year matches the year of the logical clock date at introduction"
    error_id: ERR_SERIES_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /clerk/instruments"
  - priority: 94
    category: business_referential
    check: "a MINUTES_APPROVAL or MINUTES_CORRECTION motion carries target_minutes_id naming minutes of a DIFFERENT meeting than the motion's own; an ORDINANCE_ADOPTION, RESOLUTION_ADOPTION or VETO_OVERRIDE motion carries instrument_id; a packet may not be posted with zero items; a denial requires at least one exemption claim"
    error_id: "ERR_MOTION_TARGET_INVALID | ERR_EMPTY_AGENDA_PACKET | ERR_DENIAL_WITHOUT_EXEMPTION"
    http_status: 422
    applies_to: "POST /clerk/motions, POST /clerk/agenda-packets/{packet_id}/post, POST /clerk/records-requests/{request_id}/disposition"
  - priority: 96
    category: business_referential
    check: "the certify-publication cascade must find exactly one eligible OPEN SupplementCycle for a CODE_AMENDMENT ordinance's code_title_id whose window contains the logical clock date"
    error_id: ERR_NO_OPEN_SUPPLEMENT_CYCLE
    http_status: 409
    applies_to: "POST /clerk/publication-notices/{notice_id}/certify-publication"

# =====================================================================
# §1.5 API Endpoint Table (api_prefix /clerk)
# =====================================================================
endpoints:

  # ---- test-driving surface -----------------------------------------
  - method: POST
    path: "/clerk/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time. Every deadline, notice window, retention anchor and business-day walk in this domain reads this clock."
    roles: [CityClerk, DeputyClerk, PresidingOfficer, RecordsOfficer, CodificationEditor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "no entity is mutated; subsequent requests read the new instant"

  # ---- venues -------------------------------------------------------
  - method: POST
    path: "/clerk/venues"
    description: "Registers a meeting venue and its teardown buffer."
    roles: [CityClerk]
    code: 201
