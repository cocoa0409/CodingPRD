scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: property_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Property, endpoints]
        distinguishing_aspect: "POST /properties with required fields returns 201 and echoes name/guest_parking_capacity plus server id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3, guest_window_hours: 24 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Property.${prop_id}.guest_parking_capacity == 3"
            - "Property.${prop_id}.version == 1"

      - name: resident_create_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Resident, "validations[priority=3]"]
        distinguishing_aspect: "POST /residents omitting email (a required input field) returns ERR_VALIDATION 422."
        test_recipe:
          setup: ["A property and unit exist."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A1", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "NoEmail" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_resident_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Resident, "errors[ERR_RESIDENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /residents/{unknown-uuid} returns ERR_RESIDENT_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /residents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_RESIDENT_NOT_FOUND"

      - name: retention_score_computed_correct
        claim_type: Computed Fields
        grounds: [calculations.retention_score, entities.Resident.fields.retention_score, endpoints]
        distinguishing_aspect: |
          One survey response (score 4 -> satisfaction 16), one completed booking within 90d (engagement 3),
          one open service request (penalty 5), no strikes => retention_score = 50 + 3 + 16 - 5 = 64.
        test_recipe:
          setup:
            - "Resident with 1 completed booking (base 1000/h, 1h), 1 open SUBMITTED service request, 1 survey response score 4; clock 2026-06-01."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A2", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Rita", email: "rita@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 1000, deposit_cents: 0, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: PropertyManager
            - call: "POST /amenity-bookings/${booking_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T11:00:00Z" }
              as: PropertyManager
            - call: "POST /amenity-bookings/${booking_id}/check-out"
              payload: {}
              as: FrontDesk
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "GENERAL", description: "Squeaky door" }
              as: PropertyManager
              captures: { sr_id: $.data.id }
            - call: "POST /surveys"
              payload: { property_id: "${prop_id}", title: "Q2" }
              as: PropertyManager
              captures: { survey_id: $.data.id }
            - call: "POST /surveys/${survey_id}/open"
              payload: {}
              as: PropertyManager
            - call: "POST /surveys/${survey_id}/responses"
              payload: { resident_id: "${resident_id}", satisfaction_score: 4 }
              as: Resident
              as_user_id: "${resident_id}"
          trigger:
            - call: "GET /residents/${resident_id}/retention"
              payload: {}
              as: PropertyManager
              captures: { score: $.data.retention_score }
          assert:
            - "response.data.retention_score == 64"
            - "response.data.completed_bookings_90d == 1"
            - "response.data.open_service_requests == 1"

  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_booking_returns_409
        claim_type: Invalid Transitions
        grounds: [state_machines.AmenityBooking.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second cancel on an already-CANCELLED booking returns ERR_INVALID_STATE 409; no ledger movement."
        test_recipe:
          setup: ["A CONFIRMED booking already cancelled once."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A3", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Sam", email: "sam@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 1000, deposit_cents: 0, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-09T10:00:00Z", end_at: "2026-06-09T11:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /amenity-bookings/${booking_id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${resident_id}"
          trigger:
            - call: "POST /amenity-bookings/${booking_id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: package_pickup_wrong_code_returns_422
        claim_type: Precondition Enforcement
        grounds: [state_machines.Package.NOTIFIED_to_PICKED_UP, "errors[ERR_ACCESS_CODE_MISMATCH]"]
        distinguishing_aspect: "Pickup with an access_code that does not match the package's minted code returns ERR_ACCESS_CODE_MISMATCH 422."
        test_recipe:
          setup: ["A NOTIFIED package."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A4", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Tao", email: "tao@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /packages"
              payload: { resident_id: "${resident_id}", carrier: "UPS" }
              as: FrontDesk
              captures: { pkg_id: $.data.id }
            - call: "POST /packages/${pkg_id}/notify"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /packages/${pkg_id}/pickup"
              payload: { access_code: "000000" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ACCESS_CODE_MISMATCH"

      - name: survey_respond_when_not_open_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Survey.DRAFT_to_OPEN, "errors[ERR_SURVEY_NOT_OPEN]"]
        distinguishing_aspect: "Submitting a response to a DRAFT (not OPEN) survey returns ERR_SURVEY_NOT_OPEN 409."
        test_recipe:
          setup: ["A DRAFT survey and a resident."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A5", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Uma", email: "uma@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /surveys"
              payload: { property_id: "${prop_id}", title: "Draft Survey" }
              as: PropertyManager
              captures: { survey_id: $.data.id }
          trigger:
            - call: "POST /surveys/${survey_id}/responses"
              payload: { resident_id: "${resident_id}", satisfaction_score: 3 }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SURVEY_NOT_OPEN"

      - name: duplicate_event_registration_returns_409
        claim_type: Idempotency
        grounds: [state_machines.EventRegistration.CREATE_to_RESERVED, "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "A resident with an existing non-terminal registration for an event who registers again returns ERR_DUPLICATE_REGISTRATION 409."
        test_recipe:
          setup: ["Published event; resident already RESERVED."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A6", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Vic", email: "vic@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /events"
              payload: { property_id: "${prop_id}", title: "Mixer", start_at: "2026-06-18T18:00:00Z", end_at: "2026-06-18T20:00:00Z", capacity: 5, fee_cents: 0 }
              as: PropertyManager
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/publish"
              payload: {}
              as: PropertyManager
            - call: "POST /events/${event_id}/register"
              payload: { resident_id: "${resident_id}" }
              as: Resident
              as_user_id: "${resident_id}"
          trigger:
            - call: "POST /events/${event_id}/register"
              payload: { resident_id: "${resident_id}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_REGISTRATION"

      - name: booking_check_in_outside_hours_returns_422
        claim_type: Precondition Enforcement
        grounds: [state_machines.AmenityBooking.CREATE_to_CONFIRMED, "errors[ERR_OUTSIDE_OPERATING_HOURS]"]
        distinguishing_aspect: "A booking whose window falls outside the amenity [open_minute, close_minute] is rejected at creation with ERR_OUTSIDE_OPERATING_HOURS 422."
        test_recipe:
          setup: ["Amenity open 09:00-17:00 (open_minute 540, close_minute 1020)."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A7", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Wes", email: "wes@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Pool", amenity_type: "POOL", capacity: 1, base_rate_cents_per_hour: 1000, deposit_cents: 0, buffer_minutes: 0, open_minute: 540, close_minute: 1020 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
          trigger:
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-07T18:00:00Z", end_at: "2026-06-07T19:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_OUTSIDE_OPERATING_HOURS"

  # =====================================================================
  - section: calculations
    instances:
      - name: late_cancel_penalty_applied_when_late
        claim_type: Correct Result
        grounds: [calculations.late_cancel_penalty, state_machines.AmenityBooking.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "Cancelling 8h before start (< 24h window) forfeits round(deposit 10000 * 0.5) = 5000 to rent_balance; hold released."
        test_recipe:
          setup: ["clock 2026-06-01 12:00; booking 2026-06-01 20:00-22:00 (8h out) deposit 10000, open all day."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A8", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Xan", email: "xan@x.com", membership_tier: "STANDARD" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Club", amenity_type: "CLUBROOM", capacity: 1, base_rate_cents_per_hour: 1000, deposit_cents: 10000, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-01T20:00:00Z", end_at: "2026-06-01T22:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_id: $.data.id }
          trigger:
            - call: "POST /amenity-bookings/${booking_id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${resident_id}"
          assert:
            - "AmenityBooking.${booking_id}.status == CANCELLED"
            - "Resident.${resident_id}.rent_balance_cents == 5000"
            - "Resident.${resident_id}.hold_balance_cents == 0"

      - name: payment_overflow_to_wallet
        claim_type: Correct Result
        grounds: [calculations.payment_allocation, entities.Resident.fields.wallet_credit_cents]
        distinguishing_aspect: "A 50000 payment against a 30000 rent balance fills rent to 0 then credits the 20000 overflow to wallet_credit_cents."
        test_recipe:
          setup: ["Resident with a 30000 rent charge."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "A9", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Yos", email: "yos@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rent-charges"
              payload: { amount_cents: 30000, description: "partial" }
              as: PropertyManager
          trigger:
            - call: "POST /payments"
              payload: { resident_id: "${resident_id}", amount_cents: 50000, method: "CARD" }
              as: PropertyManager
          assert:
            - "Resident.${resident_id}.rent_balance_cents == 0"
            - "Resident.${resident_id}.wallet_credit_cents == 20000"

      - name: service_emergency_trip_fee_added
        claim_type: Correct Result
        grounds: [calculations.service_invoice, entities.ServiceRequest.fields.priority]
        distinguishing_aspect: "An EMERGENCY request completed with 1h labor at 8000/h and no parts invoices 8000 + EMERGENCY_TRIP_FEE_CENTS 7500 = 15500."
        test_recipe:
          setup: ["EMERGENCY PLUMBING request assigned, started."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "B1", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Zed", email: "zed@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /vendors"
              payload: { name: "PlumbCo", trades: ["PLUMBING"], hourly_rate_cents: 8000 }
              as: PropertyManager
              captures: { vendor_id: $.data.id }
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "PLUMBING", priority: "EMERGENCY", description: "Burst pipe" }
              as: PropertyManager
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/triage"
              payload: {}
              as: PropertyManager
              as_user_id: "pm_triage"
            - call: "POST /service-requests/${sr_id}/assign"
              payload: { vendor_id: "${vendor_id}", estimated_hours: 1 }
              as: PropertyManager
              as_user_id: "pm_assign"
            - call: "POST /service-requests/${sr_id}/start"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /service-requests/${sr_id}/complete"
              payload: { labor_hours: 1 }
              as: Vendor
              as_user_id: "${vendor_id}"
          assert:
            - "ServiceRequest.${sr_id}.final_invoice_cents == 15500"

  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED 401 before any resource work."
        test_recipe:
          setup: ["A property exists."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: resident_cannot_triage_service_request_returns_403
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Resident calling POST /service-requests/{id}/triage (PropertyManager-exclusive) returns ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["A SUBMITTED service request."]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Harbor", address: "10 Dock Rd", guest_parking_capacity: 3 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", unit_number: "B2", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Al", email: "al@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /service-requests"
              payload: { unit_id: "${unit_id}", resident_id: "${resident_id}", trade: "GENERAL", description: "x" }
              as: PropertyManager
              captures: { sr_id: $.data.id }
          trigger:
            - call: "POST /service-requests/${sr_id}/triage"
              payload: {}
              as: Resident
              as_user_id: "${resident_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: resident_cannot_cancel_others_booking_returns_403
        claim_type: Violation to Error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "Resident B cancelling Resident A's booking returns ERR_NOT_RESOURCE_OWNER 403 (ownership on entity_backed Resident)."
        test_recipe:
