              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${c1_id}/investigations"
              payload: { opening_note: "Class I file opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { inv1_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Reports not filed for four shifts.", incident_datetime: "2026-07-15T20:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
