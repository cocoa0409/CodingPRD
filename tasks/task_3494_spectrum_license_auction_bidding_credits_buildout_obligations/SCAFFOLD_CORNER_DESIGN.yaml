        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "transitive_cascade / final_milestone_miss_terminates_license_cascade and transitive_cascade / disqualify_voids_bids_recomputes_demand"
          rationale: "Both declared cascades (clock-sweep termination chain, disqualify voiding chain) are asserted hop-by-hop in the named §1.8 instances."

