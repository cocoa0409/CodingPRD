  # ===========================================================================
  - section: errors
    instances:

      - name: error_envelope_shape_is_uniform_across_the_404_403_and_422_families
        claim_type: error_triggerable
        grounds:
          - response_envelope.error
          - errors[ERR_LEASE_NOT_FOUND]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_OPPORTUNITY_NOT_VIABLE]
        distinguishing_aspect: "Three failures from three different rungs of the ladder — a missing row, a role refusal and a business-rule refusal — must all come back in the same envelope: meta present, response_type == \"error\", and data holding exactly error_id and message. A handler that returns a bare string for 403, or that leaves the successful entity shape in data on a 422, breaks every downstream error assertion even though its status codes look right."
        test_recipe:
          setup:
            - "One park and one opportunity whose market analysis projects 9,000,000 in annual receipts, one cent short of nothing but a full million below the 10,000,000 viability floor, so approve-solicitation is guaranteed to fail on the business rule rather than on a reference or a role."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Bitter Creek State Park", region_code: "SE", annual_visitation: 41000, comparable_lodging_rate_cents: 9000, comparable_meal_rate_cents: 1400, comparable_activity_rate_cents: 2500 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Bitter Creek Snack Bar", service_category: "FOOD_SERVICE", required_capital_investment_cents: 1200000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 100000000, market_capture_pct: 9.00 }
              as: ConcessionSpecialist
          trigger:
            - call: "GET /leases/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
              captures: { err_404: $.data.error_id }
            - call: "POST /offerors"
              payload: { legal_name: "Bitter Creek Provisions LLC", contact_email: "hello@bittercreek.example", bond_capacity_cents: 4000000 }
              as: ConcessionSpecialist
              captures: { err_403: $.data.error_id }
            - call: "POST /concession-opportunities/${opp_id}/approve-solicitation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
              captures: { err_422: $.data.error_id }
          assert:
            - "the first call is HTTP 404 with data.error_id == ERR_LEASE_NOT_FOUND"
            - "the second call is HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "the third call is HTTP 422 with data.error_id == ERR_OPPORTUNITY_NOT_VIABLE"
            - "all three responses carry meta, response_type and data at the top level"
            - "all three carry response_type == error"
            - "in all three, data has exactly the keys error_id and message"
            - "in all three, data.message is a non-empty string and data.error_id is one of the ids declared in the catalog"
            - "no Offeror row was created"
            - "ConcessionOpportunity.${opp_id}.status == DRAFT and estimated_annual_gross_receipts_cents == 9000000"

