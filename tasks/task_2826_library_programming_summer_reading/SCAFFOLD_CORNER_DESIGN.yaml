      - name: room_occupancy_adjacency_is_legal_and_one_minute_overlap_is_not
        claim_type: interval_merge
        grounds:
          - calculations.room_occupancy_interval
          - errors[ERR_ROOM_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: room_half_open_occupancy_admits_adjacency_and_rejects_one_minute_overlap
          rationale: "That §1.8 instance already asserts both sides of the half-open room rule (touching accepted, one-minute overlap rejected with ERR_ROOM_DOUBLE_BOOKED) on the same fixture."

      - name: presenter_engagement_windows_conflict_when_they_merely_touch
        claim_type: interval_merge
        grounds:
          - calculations.presenter_engagement_window
          - errors[ERR_PRESENTER_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: presenter_closed_engagement_window_rejects_a_merely_touching_second_booking
          rationale: "The closed-interval presenter rule and its deliberate contrast with the half-open room rule are that instance's whole point; repeating it here would add no new information."

      - name: attendance_attainment_funder_and_internal_denominators_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.program_attendance_attainment.variants
        excluded_because:
          difficulty_instance: attendance_attainment_funder_vs_internal_denominator_divergence
          rationale: "Both variants are computed from one close-out payload there, with attendance_target and confirmed_room_capacity chosen so the two percentages cannot coincide."

