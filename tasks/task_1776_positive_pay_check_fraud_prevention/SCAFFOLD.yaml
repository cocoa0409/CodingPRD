# =============================================================================
# Task 1776: Positive Pay & Check Fraud Prevention — benchmark seed tables
# =============================================================================

scenario: |
  Positive Pay & Check Fraud Prevention (bank treasury fraud services): issued-check file upload & format validation, presented-item matching & exception queue, payee-name verification & mismatch handling, customer decision deadline & default pay/return rule, reverse positive pay for low-volume customers, ACH debit filter/block maintenance, exception fee & unauthorized-item liability allocation, customer training & adoption reporting

domain_name: positive-pay-fraud-prevention
api_prefix: /treasury

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - idempotency
  entity_topology: flat            # peer entities linked by FKs; no nested URL paths
  state_machine_shape: branching   # exception decision fork; cycles on Enrollment and AchDebitRule
  relationship_patterns:
    - one_to_many
    - cross_aggregate              # ExceptionItem joins PresentedItem + IssuedCheck + IssueFileUpload
  role_model: segregation_of_duties # uploader may not decision own exceptions; case assignee may not resolve large cases
  consistency_model: immediate
  difficulty_target: expert_plus

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TreasuryEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Customer company legal name" }
      - { name: tier, type: enum, source: input, description: "POSITIVE_PAY | PAYEE_POSITIVE_PAY | REVERSE_POSITIVE_PAY" }
      - { name: default_decision, type: enum, source: input, description: "PAY | RETURN — applied to undecisioned exceptions at deadline" }
      - { name: deadline_mode, type: enum, source: input, default: "SAME_DAY_CUTOFF", description: "SAME_DAY_CUTOFF | ROLLING_HOURS — selects decision_deadline variant" }
      - { name: decision_window_hours, type: integer, source: input, default: 24, description: "Hours added to presented_at when deadline_mode=ROLLING_HOURS; 1..72" }
      - { name: amount_tolerance_cents, type: integer, source: input, default: 0, description: "Match tolerance: |presented-issued| <= tolerance counts as amount match; >= 0" }
      - { name: payee_score_threshold, type: integer, source: input, default: 85, description: "payee_match_score >= threshold passes payee verification; 0..100" }
      - { name: stale_days, type: integer, source: input, default: 180, description: "REGISTERED issued check becomes STALE_DATED when age >= stale_days" }
      - { name: loss_suspension_threshold_cents, type: integer, source: input, default: null, description: "When ytd_bank_loss_cents >= this (non-null), enrollment auto-suspends; null disables" }
      - { name: status, type: enum, source: system, description: "PENDING_ACTIVATION | ACTIVE | SUSPENDED | TERMINATED" }
      - { name: open_exception_count, type: integer, source: computed, description: "Count of ExceptionItem with status OPEN for this enrollment" }
      - { name: provisional_credit_outstanding_cents, type: integer, source: computed, description: "Sum of provisional_credit_cents over LiabilityCase in UNDER_REVIEW" }
      - { name: ytd_bank_loss_cents, type: integer, source: computed, description: "Sum of bank_liability_cents over cases resolved in calendar year of resolution" }

  - name: EnrollmentUser
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> TreasuryEnrollment.id; owning enrollment" }
      - { name: display_name, type: string, source: input, description: "User display name" }
      - { name: user_role, type: enum, source: input, description: "ADMIN | MANAGER | DECISION_MAKER | VIEWER — must match claimed X-User-Role" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> TreasuryEnrollment.id; owning enrollment" }
      - { name: account_number, type: string, source: input, description: "Unique per enrollment; 6..17 digits" }
      - { name: payment_review_threshold_cents, type: integer, source: input, default: null, description: "When cumulative_paid_cents >= this (non-null), account auto-transitions to REVIEW_HOLD; null disables" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVIEW_HOLD | CLOSED" }
      - { name: cumulative_paid_cents, type: integer, source: computed, default: 0, description: "Lifetime gross paid amount; increments on every item pay event; never decrements" }
      - { name: cumulative_reversed_cents, type: integer, source: computed, default: 0, description: "Lifetime gross reversed amount; increments on every reversal; never decrements" }
      - { name: net_settled_cents, type: integer, source: computed, default: 0, description: "= cumulative_paid_cents - cumulative_reversed_cents" }

  - name: IssueFileUpload
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> TreasuryEnrollment.id; from request body" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; all rows post to this account" }
      - { name: uploaded_by_user_id, type: string, source: system, description: "FK -> EnrollmentUser.id; = X-User-ID of uploader (SoD source)" }
      - { name: file_reference, type: string, source: input, description: "Client-chosen idempotency key; unique per enrollment" }
      - { name: payload_hash, type: string, source: system, description: "SHA-256 of canonicalized rows array; replay detection" }
      - { name: row_count, type: integer, source: computed, description: "Total rows submitted" }
      - { name: accepted_row_count, type: integer, source: computed, description: "Rows that produced IssuedCheck records" }
      - { name: rejected_row_count, type: integer, source: computed, description: "Rows rejected with per-row errors" }
      - { name: row_errors, type: array, source: system, description: "Per-row rejections: [{row_index, check_number, reason}]" }
      - { name: status, type: enum, source: system, description: "ACCEPTED (all rows ok) | PARTIALLY_ACCEPTED (some ok) | REJECTED (zero rows accepted) — assigned synchronously at upload" }

  - name: IssuedCheck
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: issue_file_id, type: string, source: system, description: "FK -> IssueFileUpload.id; file that registered this check" }
      - { name: check_number, type: string, source: input, description: "1..12 digits; unique per account among non-STALE_DATED checks" }
      - { name: amount_cents, type: integer, source: input, description: "> 0" }
      - { name: payee_name, type: string, source: input, description: "1..80 chars" }
      - { name: issue_date, type: string, source: input, description: "ISO date YYYY-MM-DD; must not be after current logical date" }
      - { name: status, type: enum, source: system, description: "REGISTERED | CONSUMED | VOIDED | STALE_DATED" }
      - { name: consumed_by_item_id, type: string, source: system, description: "FK -> PresentedItem.id; set when this check paid an item; null otherwise" }

  - name: PresentedItem
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: check_number, type: string, source: input, description: "As presented" }
      - { name: amount_cents, type: integer, source: input, description: "> 0" }
      - { name: payee_name_raw, type: string, source: input, description: "Payee text as read from the presented item" }
      - { name: channel, type: enum, source: input, description: "TELLER | REMOTE_DEPOSIT | CLEARING" }
      - { name: presented_at, type: datetime, source: input, default: "current logical clock", description: "Presentment timestamp; defaults to logical clock" }
      - { name: idempotency_key, type: string, source: input, default: null, description: "Optional client key; replay with identical payload returns original item" }
      - { name: status, type: enum, source: system, description: "RECEIVED | EXCEPTION_HELD | PAID | RETURNED | DEFAULT_PAID | DEFAULT_RETURNED | REVERSED" }
      - { name: match_result, type: enum, source: system, description: "CLEAN | NO_ISSUE_RECORD | AMOUNT_MISMATCH | PAYEE_MISMATCH | VOIDED_ITEM | STALE_DATED_ITEM | DUPLICATE_PRESENTMENT | REVERSE_REVIEW | ACCOUNT_HOLD_REVIEW" }
      - { name: match_score, type: integer, source: system, default: null, description: "payee_match_score when payee verification ran; null otherwise" }
      - { name: exception_id, type: string, source: system, default: null, description: "FK -> ExceptionItem.id; set iff an exception was created for this item" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Timestamp item entered PAID (any pay path); null until paid" }

  - name: ExceptionItem
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> TreasuryEnrollment.id (denormalized from account)" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: presented_item_id, type: string, source: system, description: "FK -> PresentedItem.id" }
      - { name: issued_check_id, type: string, source: system, default: null, description: "FK -> IssuedCheck.id; null for NO_ISSUE_RECORD and REVERSE_REVIEW" }
      - { name: reason, type: enum, source: system, description: "NO_ISSUE_RECORD | AMOUNT_MISMATCH | PAYEE_MISMATCH | VOIDED_ITEM | STALE_DATED_ITEM | DUPLICATE_PRESENTMENT | REVERSE_REVIEW | ACCOUNT_HOLD_REVIEW" }
      - { name: status, type: enum, source: system, description: "OPEN | DECISIONED_PAY | DECISIONED_RETURN | DEFAULTED_PAY | DEFAULTED_RETURN" }
      - { name: default_decision_snapshot, type: enum, source: system, description: "PAY | RETURN — enrollment.default_decision pinned at exception creation; later enrollment edits do NOT retro-change this" }
      - { name: decision_deadline_at, type: datetime, source: system, description: "Computed per decision_deadline calculation from item presented_at" }
      - { name: extended_once, type: boolean, source: system, default: false, description: "True after a successful extend-deadline; extension allowed at most once" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "FK -> EnrollmentUser.id; null for defaults" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Decision timestamp; null for defaults" }
      - { name: liability_party, type: enum, source: computed, default: null, description: "CUSTOMER | NONE — derived at resolution per liability_party_derivation; null while OPEN" }
      - { name: fee_entry_id, type: string, source: system, default: null, description: "FK -> FeeLedgerEntry.id; the provisional EXCEPTION_FEE accrual created with this exception" }

  - name: AchDebitRule
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id" }
      - { name: rule_type, type: enum, source: input, description: "BLOCK (auto-return all matching debits) | FILTER (hold debits over max_amount_cents)" }
      - { name: originator_company_id, type: string, source: input, description: "ACH originator company ID scope; 1..10 chars" }
      - { name: sec_code, type: enum, source: input, description: "CCD | PPD | WEB | TEL" }
      - { name: max_amount_cents, type: integer, source: input, default: null, description: "Required iff rule_type=FILTER; forbidden for BLOCK" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date; window start (inclusive)" }
      - { name: effective_end_date, type: string, source: input, default: null, description: "ISO date; window end (exclusive); null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED | RETIRED" }

  - name: FeeLedgerEntry
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> TreasuryEnrollment.id" }
      - { name: exception_id, type: string, source: system, default: null, description: "FK -> ExceptionItem.id; null for ADJUSTMENT and MINIMUM_TOPUP" }
      - { name: period, type: string, source: system, description: "Billing period YYYY-MM of entry created_at" }
      - { name: fee_type, type: enum, source: system, description: "EXCEPTION_FEE | RETURN_FEE | ADJUSTMENT | MINIMUM_TOPUP" }
      - { name: amount_cents, type: integer, source: system, description: "Fee amount; ADJUSTMENT may be negative" }
      - { name: status, type: enum, source: system, description: "ACCRUED | BILLED | WAIVED" }
      - { name: waived_from_status, type: enum, source: system, default: null, description: "ACCRUED | BILLED — status the entry was waived from; reinstate returns here" }
      - { name: waived_by, type: string, source: system, default: null, description: "Bank user id who waived" }
      - { name: waiver_reason, type: string, source: system, default: null, description: "Free-text waiver justification" }

  - name: LiabilityCase
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> TreasuryEnrollment.id (denormalized from item account)" }
      - { name: presented_item_id, type: string, source: system, description: "FK -> PresentedItem.id; must be status PAID at filing" }
      - { name: filed_by_user_id, type: string, source: system, description: "FK -> EnrollmentUser.id; = X-User-ID of filer" }
      - { name: claim_reason, type: enum, source: input, description: "FORGED_SIGNATURE | ALTERED_AMOUNT | COUNTERFEIT | UNAUTHORIZED_PAYEE" }
      - { name: claim_amount_cents, type: integer, source: computed, description: "= presented item amount_cents at filing" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | RESOLVED_BANK_LIABLE | RESOLVED_CUSTOMER_LIABLE | RESOLVED_SHARED | WITHDRAWN" }
      - { name: assigned_bank_user_id, type: string, source: system, default: null, description: "X-User-ID of BankOps who ran start-review" }
      - { name: provisional_credit_cents, type: integer, source: computed, default: 0, description: "Posted at start-review iff claim_amount_cents <= 25000; full claim amount" }
      - { name: bank_liability_cents, type: integer, source: computed, default: null, description: "Set at resolution; SHARED: floor(claim_amount_cents/2)" }
      - { name: customer_liability_cents, type: integer, source: computed, default: null, description: "Set at resolution; SHARED: claim_amount_cents - bank_liability_cents" }
      - { name: resolved_by_bank_user_id, type: string, source: system, default: null, description: "X-User-ID of resolving BankTreasuryManager" }

  - name: TrainingSession
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> TreasuryEnrollment.id" }
      - { name: trainer_id, type: string, source: input, description: "Opaque bank trainer user id; scheduling resource" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end (UTC); must be after start" }
      - { name: attendee_user_ids, type: array, source: system, description: "EnrollmentUser ids recorded at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: OpsRun
    parent: null
    common_fields: false
    fields:
      - { name: kind, type: enum, source: input, description: "DAILY_SWEEP | MONTHLY_BILLING" }
      - { name: enrollment_id, type: string, source: input, default: null, description: "FK -> TreasuryEnrollment.id; null = all enrollments (DAILY_SWEEP only)" }
      - { name: period, type: string, source: input, default: null, description: "YYYY-MM; required for MONTHLY_BILLING, forbidden for DAILY_SWEEP" }
      - { name: status, type: enum, source: system, description: "COMPLETED (runs are synchronous)" }
      - { name: exceptions_defaulted, type: integer, source: computed, default: 0, description: "DAILY_SWEEP: exceptions defaulted this run" }
      - { name: checks_staled, type: integer, source: computed, default: 0, description: "DAILY_SWEEP: checks moved to STALE_DATED" }
      - { name: ach_rules_expired, type: integer, source: computed, default: 0, description: "DAILY_SWEEP: rules moved to EXPIRED" }
      - { name: sessions_marked_no_show, type: integer, source: computed, default: 0, description: "DAILY_SWEEP: sessions moved to NO_SHOW" }
      - { name: fees_billed, type: integer, source: computed, default: 0, description: "MONTHLY_BILLING: entries flipped ACCRUED->BILLED" }
      - { name: adjustment_cents, type: integer, source: computed, default: 0, description: "MONTHLY_BILLING: tier-reconciliation ADJUSTMENT amount (may be negative)" }
      - { name: minimum_topup_cents, type: integer, source: computed, default: 0, description: "MONTHLY_BILLING: MINIMUM_TOPUP entry amount created" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TreasuryEnrollment
    initial_state: PENDING_ACTIVATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ACTIVATION
        to: ACTIVE
        trigger: "POST /treasury/enrollments/{id}/activate"
        actor: BankTreasuryManager
        preconditions:
          - "At least one TrainingSession for this enrollment in COMPLETED status (else ERR_ENROLLMENT_NOT_ACTIVATABLE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /treasury/enrollments/{id}/suspend OR system (auto when ytd_bank_loss_cents >= loss_suspension_threshold_cents, non-null, after a liability resolution)"
        actor: BankTreasuryManager | system
        preconditions: []
        side_effects:
          - "While SUSPENDED: customer-side writes (issue-file upload, check void, exception decision, ACH rule writes, liability filing) are rejected with ERR_ENROLLMENT_NOT_ACTIVE; matching, sweeps, and defaults continue"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /treasury/enrollments/{id}/activate"
        actor: BankTreasuryManager
        preconditions: []
        side_effects: []
        note: "Re-activation does NOT re-check the training gate; the gate applies only from PENDING_ACTIVATION"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /treasury/enrollments/{id}/terminate"
        actor: BankTreasuryManager
        preconditions:
          - "Every Account of this enrollment has status CLOSED (else ERR_ENROLLMENT_NOT_SETTLED)"
          - "open_exception_count == 0 (else ERR_ENROLLMENT_NOT_SETTLED)"
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /treasury/enrollments/{id}/terminate"
        actor: BankTreasuryManager
        preconditions:
          - "Every Account of this enrollment has status CLOSED (else ERR_ENROLLMENT_NOT_SETTLED)"
          - "open_exception_count == 0 (else ERR_ENROLLMENT_NOT_SETTLED)"
        side_effects: []

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: REVIEW_HOLD
        trigger: "system (automatic after any item pay event when cumulative_paid_cents >= payment_review_threshold_cents, threshold non-null)"
        actor: system
        preconditions: []
        side_effects:
          - "While REVIEW_HOLD: presented items do not auto-match; every ingested item becomes an exception with reason ACCOUNT_HOLD_REVIEW"
      - from: REVIEW_HOLD
        to: ACTIVE
        trigger: "POST /treasury/accounts/{id}/clear-review-hold"
        actor: BankOps
        preconditions: []
        side_effects: []
        note: "Clearing the hold does NOT retro-process items already held; it only restores clean auto-matching for future items"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /treasury/accounts/{id}/close"
        actor: BankTreasuryManager
        preconditions:
          - "No ExceptionItem with this account_id in status OPEN (else ERR_ACCOUNT_HAS_OPEN_EXCEPTIONS)"
          - "Enrollment not TERMINATED (else ERR_ENROLLMENT_TERMINATED)"
        side_effects: []
      - from: REVIEW_HOLD
        to: CLOSED
        trigger: "POST /treasury/accounts/{id}/close"
        actor: BankTreasuryManager
        preconditions:
          - "No ExceptionItem with this account_id in status OPEN (else ERR_ACCOUNT_HAS_OPEN_EXCEPTIONS)"
        side_effects: []

  - entity: IssueFileUpload
    initial_state: "assigned synchronously at upload: ACCEPTED | PARTIALLY_ACCEPTED | REJECTED"
    terminal_states: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]
    transitions: []
    note: "Immutable once created; rows are validated per-row at upload (see issue_file_row_validation)"

  - entity: IssuedCheck
    initial_state: REGISTERED
    terminal_states: [CONSUMED, VOIDED, STALE_DATED]
    transitions:
      - from: REGISTERED
        to: CONSUMED
        trigger: "system (item pays: clean auto-match at ingestion, exception DECISIONED_PAY, or exception DEFAULTED_PAY)"
        actor: system
        preconditions: []
        side_effects:
          - "consumed_by_item_id := the paying PresentedItem.id"
      - from: REGISTERED
        to: VOIDED
        trigger: "POST /treasury/issued-checks/{id}/void"
        actor: CustomerAdmin | CustomerManager
        preconditions:
          - "Enrollment ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE / ERR_ENROLLMENT_TERMINATED)"
          - "Check REGISTERED (else ERR_CHECK_NOT_VOIDABLE)"
        side_effects: []
      - from: REGISTERED
        to: STALE_DATED
        trigger: "system (DAILY_SWEEP ops run when current logical date >= issue_date + enrollment.stale_days)"
        actor: system
        preconditions: []
        side_effects: []
        note: "A returned item does NOT consume its check: the check stays REGISTERED and a later re-presentment matches it again"

  - entity: PresentedItem
    initial_state: RECEIVED
    terminal_states: [RETURNED, DEFAULT_PAID, DEFAULT_RETURNED, REVERSED]
    transitions:
      - from: RECEIVED
        to: PAID
        trigger: "system (synchronous matching at ingestion returns CLEAN)"
        actor: system
        preconditions: []
        side_effects:
          - "paid_at := current logical clock"
          - "Account.cumulative_paid_cents += amount_cents; recompute net_settled_cents; evaluate payment_review_threshold (may transition Account ACTIVE->REVIEW_HOLD)"
          - "Matched IssuedCheck REGISTERED -> CONSUMED with consumed_by_item_id"
      - from: RECEIVED
        to: EXCEPTION_HELD
        trigger: "system (synchronous matching returns any non-CLEAN result, or tier is REVERSE_POSITIVE_PAY, or account is REVIEW_HOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "Create ExceptionItem OPEN: reason := match_result, decision_deadline_at per decision_deadline calc, default_decision_snapshot := enrollment.default_decision"
          - "Create FeeLedgerEntry EXCEPTION_FEE ACCRUED 200 cents (provisional) and link exception.fee_entry_id"
          - "TreasuryEnrollment.open_exception_count += 1"
      - from: EXCEPTION_HELD
        to: PAID
        trigger: "POST /treasury/exceptions/{id}/decision with decision=PAY"
        actor: CustomerManager | CustomerDecisionMaker
        preconditions: ["See ExceptionItem decision transition"]
        side_effects:
          - "paid_at := clock; Account.cumulative_paid_cents += amount_cents; recompute net_settled_cents; evaluate payment_review_threshold (may flip Account to REVIEW_HOLD)"
          - "Linked IssuedCheck (if any) REGISTERED -> CONSUMED"
      - from: EXCEPTION_HELD
        to: RETURNED
        trigger: "POST /treasury/exceptions/{id}/decision with decision=RETURN"
        actor: CustomerManager | CustomerDecisionMaker
        preconditions: ["See ExceptionItem decision transition"]
        side_effects:
          - "Create FeeLedgerEntry RETURN_FEE ACCRUED 500 cents linked to the exception"
      - from: EXCEPTION_HELD
        to: DEFAULT_PAID
        trigger: "system (DAILY_SWEEP finds exception OPEN with decision_deadline_at < clock and default_decision_snapshot = PAY)"
        actor: system
        preconditions: []
        side_effects:
          - "Same ledger effects as EXCEPTION_HELD->PAID (paid_at, cumulative_paid, threshold evaluation, check CONSUMED)"
      - from: EXCEPTION_HELD
        to: DEFAULT_RETURNED
        trigger: "system (DAILY_SWEEP finds exception OPEN with decision_deadline_at < clock and default_decision_snapshot = RETURN)"
        actor: system
        preconditions: []
        side_effects:
          - "Create FeeLedgerEntry RETURN_FEE ACCRUED 500 cents linked to the exception"
      - from: PAID
        to: REVERSED
        trigger: "POST /treasury/presented-items/{id}/reverse"
        actor: BankTreasuryManager
        preconditions:
          - "Item status PAID (else ERR_ITEM_NOT_REVERSIBLE)"
        side_effects:
          - "Account.cumulative_reversed_cents += amount_cents; recompute net_settled_cents (net returns to its pre-payment value)"

  - entity: ExceptionItem
    initial_state: OPEN
    terminal_states: [DECISIONED_PAY, DECISIONED_RETURN, DEFAULTED_PAY, DEFAULTED_RETURN]
    transitions:
      - from: OPEN
        to: DECISIONED_PAY
        trigger: "POST /treasury/exceptions/{id}/decision with decision=PAY"
        actor: CustomerManager | CustomerDecisionMaker
        preconditions:
          - "Enrollment ACTIVE (ERR_ENROLLMENT_TERMINATED if TERMINATED, else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "Exception status OPEN (else ERR_EXCEPTION_NOT_OPEN)"
          - "Current logical clock <= decision_deadline_at (else ERR_DECISION_DEADLINE_PASSED)"
          - "Segregation of duties: if issued_check_id is non-null, X-User-ID != its issue file's uploaded_by_user_id (else ERR_SOD_UPLOAD_DECISION_CONFLICT)"
        side_effects:
          - "PresentedItem EXCEPTION_HELD -> PAID (with its own side effects)"
          - "decided_by_user_id := X-User-ID; decided_at := clock"
          - "liability_party := CUSTOMER per liability_party_derivation"
          - "TreasuryEnrollment.open_exception_count -= 1"
      - from: OPEN
        to: DECISIONED_RETURN
        trigger: "POST /treasury/exceptions/{id}/decision with decision=RETURN"
        actor: CustomerManager | CustomerDecisionMaker
        preconditions: ["Same as DECISIONED_PAY"]
        side_effects:
          - "PresentedItem EXCEPTION_HELD -> RETURNED (return fee accrual)"
          - "decided_by_user_id, decided_at set"
          - "liability_party := NONE"
          - "TreasuryEnrollment.open_exception_count -= 1"
      - from: OPEN
        to: DEFAULTED_PAY
        trigger: "system (DAILY_SWEEP; decision_deadline_at < clock; snapshot PAY)"
        actor: system
        preconditions: []
        side_effects:
          - "PresentedItem EXCEPTION_HELD -> DEFAULT_PAID (ledger effects as pay)"
          - "liability_party := CUSTOMER"
          - "TreasuryEnrollment.open_exception_count -= 1"
      - from: OPEN
        to: DEFAULTED_RETURN
        trigger: "system (DAILY_SWEEP; decision_deadline_at < clock; snapshot RETURN)"
        actor: system
        preconditions: []
        side_effects:
          - "PresentedItem EXCEPTION_HELD -> DEFAULT_RETURNED (return fee accrual)"
          - "liability_party := CUSTOMER"
          - "TreasuryEnrollment.open_exception_count -= 1"

  - entity: AchDebitRule
    initial_state: ACTIVE
    terminal_states: [EXPIRED, RETIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /treasury/ach-rules/{id}/suspend"
        actor: BankOps | CustomerAdmin | CustomerManager
        preconditions:
          - "Enrollment ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE / ERR_ENROLLMENT_TERMINATED)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /treasury/ach-rules/{id}/resume"
        actor: BankOps | CustomerAdmin | CustomerManager
        preconditions:
          - "Enrollment ACTIVE"
          - "effective_end_date is null or >= current logical date (else ERR_ACH_RULE_NOT_ACTIVE)"
          - "Window overlap re-validated against other rules in {ACTIVE, SUSPENDED} with same (account_id, originator_company_id, sec_code) (else ERR_ACH_RULE_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /treasury/ach-rules/{id}/retire"
        actor: BankOps | CustomerAdmin | CustomerManager
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /treasury/ach-rules/{id}/retire"
        actor: BankOps | CustomerAdmin | CustomerManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (DAILY_SWEEP when effective_end_date non-null and < current logical date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (DAILY_SWEEP, same condition)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FeeLedgerEntry
    initial_state: ACCRUED
    terminal_states: []
    transitions:
      - from: ACCRUED
        to: BILLED
        trigger: "system (MONTHLY_BILLING ops run for the entry's enrollment+period)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCRUED
        to: WAIVED
        trigger: "POST /treasury/fee-entries/{id}/waive"
        actor: BankOps | BankTreasuryManager
        preconditions:
          - "fee_type in {EXCEPTION_FEE, RETURN_FEE, MINIMUM_TOPUP} and status in {ACCRUED, BILLED} (else ERR_FEE_ENTRY_NOT_WAIVABLE)"
          - "Waiver authority: BankOps may waive amount_cents <= 1000; larger amounts require BankTreasuryManager (else ERR_WAIVER_EXCEEDS_AUTHORITY)"
        side_effects: ["waived_from_status := ACCRUED; waived_by := X-User-ID; waiver_reason := input reason"]
      - from: BILLED
        to: WAIVED
        trigger: "POST /treasury/fee-entries/{id}/waive"
        actor: BankOps | BankTreasuryManager
        preconditions: ["Same as ACCRUED->WAIVED"]
        side_effects: ["waived_from_status := BILLED; waived_by := X-User-ID; waiver_reason := input reason"]
      - from: WAIVED
        to: ACCRUED
        trigger: "POST /treasury/fee-entries/{id}/reinstate (when waived_from_status = ACCRUED)"
        actor: BankTreasuryManager
        preconditions: ["status WAIVED (else ERR_FEE_ENTRY_NOT_WAIVABLE)"]
        side_effects: ["waived_from_status, waived_by, waiver_reason cleared to null"]
      - from: WAIVED
        to: BILLED
        trigger: "POST /treasury/fee-entries/{id}/reinstate (when waived_from_status = BILLED)"
        actor: BankTreasuryManager
        preconditions: ["status WAIVED (else ERR_FEE_ENTRY_NOT_WAIVABLE)"]
        side_effects: ["waived_from_status, waived_by, waiver_reason cleared to null"]
    note: "ADJUSTMENT and MINIMUM_TOPUP entries are created directly in BILLED status by MONTHLY_BILLING; ADJUSTMENT is never waivable, MINIMUM_TOPUP is waivable (its size usually forces the BankTreasuryManager authority path)"

  - entity: LiabilityCase
    initial_state: FILED
    terminal_states: [RESOLVED_BANK_LIABLE, RESOLVED_CUSTOMER_LIABLE, RESOLVED_SHARED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /treasury/liability-cases/{id}/start-review"
        actor: BankOps
        preconditions:
          - "Case status FILED (else ERR_CASE_NOT_OPEN)"
        side_effects:
          - "assigned_bank_user_id := X-User-ID"
          - "If claim_amount_cents <= 25000: provisional_credit_cents := claim_amount_cents and TreasuryEnrollment.provisional_credit_outstanding_cents += claim_amount_cents; else provisional_credit_cents := 0"
      - from: UNDER_REVIEW
        to: RESOLVED_BANK_LIABLE
        trigger: "POST /treasury/liability-cases/{id}/resolve with resolution=BANK_LIABLE"
        actor: BankTreasuryManager
        preconditions:
          - "Case status UNDER_REVIEW (else ERR_CASE_NOT_OPEN)"
          - "Segregation of duties: if claim_amount_cents > 25000, resolver X-User-ID != assigned_bank_user_id (else ERR_SOD_CASE_RESOLUTION_CONFLICT)"
        side_effects:
          - "bank_liability_cents := claim_amount_cents; customer_liability_cents := 0"
          - "TreasuryEnrollment.provisional_credit_outstanding_cents -= provisional_credit_cents (provisional credit becomes final)"
          - "TreasuryEnrollment.ytd_bank_loss_cents += bank_liability_cents"
          - "If loss_suspension_threshold_cents non-null and ytd_bank_loss_cents >= threshold: TreasuryEnrollment ACTIVE -> SUSPENDED (auto)"
      - from: UNDER_REVIEW
        to: RESOLVED_CUSTOMER_LIABLE
        trigger: "POST /treasury/liability-cases/{id}/resolve with resolution=CUSTOMER_LIABLE"
        actor: BankTreasuryManager
        preconditions: ["Same state + SoD preconditions as RESOLVED_BANK_LIABLE"]
        side_effects:
          - "customer_liability_cents := claim_amount_cents; bank_liability_cents := 0"
          - "TreasuryEnrollment.provisional_credit_outstanding_cents -= provisional_credit_cents (provisional credit clawed back)"
      - from: UNDER_REVIEW
        to: RESOLVED_SHARED
        trigger: "POST /treasury/liability-cases/{id}/resolve with resolution=SHARED"
        actor: BankTreasuryManager
        preconditions: ["Same state + SoD preconditions as RESOLVED_BANK_LIABLE"]
        side_effects:
          - "bank_liability_cents := floor(claim_amount_cents / 2); customer_liability_cents := claim_amount_cents - bank_liability_cents (odd cent lands on customer)"
          - "TreasuryEnrollment.provisional_credit_outstanding_cents -= provisional_credit_cents"
          - "TreasuryEnrollment.ytd_bank_loss_cents += bank_liability_cents; evaluate loss suspension threshold"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /treasury/liability-cases/{id}/withdraw"
        actor: CustomerAdmin | CustomerManager | CustomerDecisionMaker
        preconditions: ["Case status FILED or UNDER_REVIEW (else ERR_CASE_NOT_OPEN)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /treasury/liability-cases/{id}/withdraw"
        actor: CustomerAdmin | CustomerManager | CustomerDecisionMaker
        preconditions: ["Case status FILED or UNDER_REVIEW (else ERR_CASE_NOT_OPEN)"]
        side_effects:
          - "TreasuryEnrollment.provisional_credit_outstanding_cents -= provisional_credit_cents (provisional credit reversed)"

  - entity: TrainingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /treasury/training-sessions/{id}/complete"
        actor: BankOps
        preconditions:
          - "Session SCHEDULED (else ERR_SESSION_NOT_COMPLETABLE)"
          - "attendee_user_ids non-empty and every id is an EnrollmentUser of this enrollment (else ERR_INVALID_REQUEST / ERR_NOT_FOUND)"
        side_effects: ["attendee_user_ids := input list"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /treasury/training-sessions/{id}/cancel"
        actor: BankOps
        preconditions: ["Session SCHEDULED (else ERR_SESSION_NOT_COMPLETABLE)"]
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system (DAILY_SWEEP when scheduled_end < current logical clock and still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-config-patch-stale
    parent_entity: TreasuryEnrollment
    write_endpoint: "PATCH /treasury/enrollments/{id}"
    occ_field: "expected_enrollment_version"
    description: |
      A PATCH that carries an expected_enrollment_version older than the
      enrollment's current version is rejected: another accepted write (config
      patch, tier change, status transition, or cascaded counter update) has
      advanced the version since the client last observed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enrollment-tier-change-stale
    parent_entity: TreasuryEnrollment
    write_endpoint: "POST /treasury/enrollments/{id}/change-tier"
    occ_field: "expected_enrollment_version"
    description: |
      A tier change carrying a stale expected_enrollment_version is rejected;
      tier migration re-validates volume eligibility and open-exception gates
      against the current enrollment state, so the client's view must be current.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: ach-rule-patch-stale
    parent_entity: AchDebitRule
    write_endpoint: "PATCH /treasury/ach-rules/{id}"
    occ_field: "expected_ach_rule_version"
    description: |
      A PATCH to an ACH debit rule whose version has advanced since the client
      last observed it is rejected; window edits re-validate overlap against the
      current rule set, so stale writes must not interleave.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: exception_matching
    trigger: "POST /treasury/presented-items (synchronous at ingestion)"
    algorithm: ordered_rule_chain
    formula: |
      Evaluate in STRICT order; first matching rule wins:
        (0) If enrollment.tier == REVERSE_POSITIVE_PAY: match_result = REVERSE_REVIEW (stop)
        (1) If account.status == REVIEW_HOLD: match_result = ACCOUNT_HOLD_REVIEW (stop)
        (2) Find IssuedCheck where account_id = item.account_id AND check_number = item.check_number.
            If none: match_result = NO_ISSUE_RECORD (stop)
        (3) If check.status == VOIDED: VOIDED_ITEM (stop)
        (4) If check.status == STALE_DATED: STALE_DATED_ITEM (stop)
        (5) If check.status == CONSUMED: DUPLICATE_PRESENTMENT (stop)
        (6) If abs(item.amount_cents - check.amount_cents) > enrollment.amount_tolerance_cents:
            AMOUNT_MISMATCH (stop)   # equality at exactly tolerance PASSES
        (7) If enrollment.tier == PAYEE_POSITIVE_PAY:
            score = payee_match_score(check.payee_name, item.payee_name_raw)
            item.match_score = score
            If score < enrollment.payee_score_threshold: PAYEE_MISMATCH (stop)
        (8) CLEAN
      CLEAN => item PAID (see PresentedItem RECEIVED->PAID); any other result => EXCEPTION_HELD.
    input_set: "The single ingested PresentedItem; the IssuedCheck with same (account_id, check_number); the owning Account and TreasuryEnrollment"
    constants:
      RULE_ORDER: "tier, account_hold, existence, check_status, amount, payee"
    precision: "integer cents comparison; no rounding"
    variants: []

  - name: payee_match_score
    trigger: "exception_matching step (7), only when tier == PAYEE_POSITIVE_PAY"
    algorithm: weighted_scoring
    formula: |
      Tokenize both names: uppercase, split on non-alphanumeric, drop empty tokens.
      Issued tokens T = [t_1..t_n]; total_len = sum(len(t_i)).
      For each issued token t_i:
        sim_i = 100 if some presented token equals t_i exactly
                else 50 if some presented token is a prefix of t_i or t_i is a prefix of it,
                     and the shorter token has length >= 3
                else 0
        contribution_i = floor(len(t_i) * sim_i / total_len)     # per-token floor BEFORE summing
      score = sum(contribution_i)                                   # NO re-rounding of the sum
      Empty token set (either side) => score = 0.
    input_set: "issued payee_name vs presented payee_name_raw"
    constants:
      EXACT_SIM: 100
      PREFIX_SIM: 50
      MIN_PREFIX_LEN: 3
    precision: "integer score 0..100; per-token floor, sum unrounded"
    variants:
      - name: sum_then_round
        when: "FORBIDDEN alternate reading: round_half_up(sum(len_i*sim_i/total_len))"
        difference: "differs by up to (n-1) points; e.g. 'ACME INDUSTRIES' vs 'ACM INDUSTRIES': pinned order 84 (mismatch at threshold 85), alternate 85 (pass)"

  - name: decision_deadline
    trigger: "ExceptionItem creation"
    algorithm: temporal_window
    formula: |
      Base (SAME_DAY_CUTOFF): if presented_at time < 14:00:00Z then deadline = same UTC date at 20:00:00Z
                              else deadline = next UTC date at 20:00:00Z. (presented at exactly 14:00:00Z => next day)
      Deadline is INCLUSIVE for customer decisions: a decision at clock == decision_deadline_at is accepted;
      DAILY_SWEEP defaults only exceptions with decision_deadline_at STRICTLY < clock.
    input_set: "PresentedItem.presented_at; enrollment.deadline_mode, decision_window_hours"
    constants:
      CUTOFF_TIME: "14:00:00Z"
      SAME_DAY_DEADLINE_TIME: "20:00:00Z"
    precision: "second precision UTC"
    variants:
      - name: rolling_hours
        when: "enrollment.deadline_mode == ROLLING_HOURS"
        difference: "deadline = presented_at + decision_window_hours hours; e.g. presented 2026-08-03T13:00:00Z with 24h => 2026-08-04T13:00:00Z, whereas SAME_DAY_CUTOFF yields 2026-08-03T20:00:00Z for the identical presented_at"

  - name: issue_file_row_validation
    trigger: "POST /treasury/issue-files"
    algorithm: ordered_rule_chain
    formula: |
      Whole-file gates (any failure rejects the request before row processing):
        enrollment ACTIVE; tier != REVERSE_POSITIVE_PAY (ERR_TIER_FORBIDS_ISSUE_FILES);
        account belongs to enrollment and is ACTIVE (ERR_ACCOUNT_NOT_ACTIVE);
        file_reference unseen for enrollment => process; identical rows hash => replay original upload;
        same reference different hash => ERR_IDEMPOTENCY_CONFLICT.
      Per-row validation (independent; row index order preserved):
        check_number: 1..12 digits; amount_cents integer > 0; payee_name 1..80 chars;
        issue_date valid ISO date <= current logical date;
        no duplicate check_number within the file; no existing IssuedCheck on this account
        with same check_number in status {REGISTERED, CONSUMED, VOIDED} (STALE_DATED may be re-issued).
      Accepted rows create REGISTERED IssuedChecks. Status: all accepted => ACCEPTED;
      some accepted => PARTIALLY_ACCEPTED; zero accepted => REJECTED.
    input_set: "rows array of the upload; existing IssuedCheck set for the account"
    constants: {}
    precision: "n/a"
    variants: []

  - name: exception_fee_provisional
    trigger: "ExceptionItem creation (any reason, including REVERSE_REVIEW)"
    algorithm: aggregation
    formula: "Create one FeeLedgerEntry: fee_type=EXCEPTION_FEE, amount_cents=200, status=ACCRUED, period=YYYY-MM of created_at."
    input_set: "the new ExceptionItem"
    constants:
      PROVISIONAL_EXCEPTION_FEE_CENTS: 200
    precision: "integer cents"
    variants: []

  - name: return_fee
    trigger: "PresentedItem enters RETURNED or DEFAULT_RETURNED"
    algorithm: aggregation
    formula: "Create one FeeLedgerEntry: fee_type=RETURN_FEE, amount_cents=500, status=ACCRUED, linked to the exception."
    input_set: "the returning PresentedItem + its ExceptionItem"
    constants:
      RETURN_FEE_CENTS: 500
    precision: "integer cents"
    variants: []

  - name: exception_fee_tiered_final
    trigger: "MONTHLY_BILLING ops run for (enrollment, period)"
    algorithm: tiered_pricing
    formula: |
      Eligible set: EXCEPTION_FEE entries of this enrollment whose period == billing period,
      ordered by ExceptionItem.created_at ASC, tie-break by ExceptionItem.created_at fractional
      seconds then by check_number ASC (never by id).
      Marginal re-rate: items 1..10 at 200, items 11..40 at 150, items 41+ at 100.
      tiered_total = sum of re-rated fees.
      provisional_total = sum of the same entries' amount_cents (each 200).
      adjustment_cents = tiered_total - provisional_total  (negative when volume discounts apply).
      If adjustment_cents != 0: create one ADJUSTMENT entry (status BILLED) with that amount.
    input_set: "EXCEPTION_FEE FeeLedgerEntry rows for enrollment+period (any status except WAIVED excluded? NO: waived rows remain in the ordered set — waiver does not change tier positions)"
    constants:
      TIER1_LIMIT: 10
      TIER1_FEE_CENTS: 200
      TIER2_LIMIT: 40
      TIER2_FEE_CENTS: 150
      TIER3_FEE_CENTS: 100
    precision: "integer cents; exact"
    variants: []

  - name: monthly_statement
    trigger: "MONTHLY_BILLING ops run; GET /treasury/enrollments/{id}/fee-statement reads the same derivation"
    algorithm: waterfall_allocation
    formula: |
      PINNED EVALUATION ORDER (mode-c circular-looking chain):
        (1) exception_fees_provisional = sum(amount_cents of EXCEPTION_FEE entries for period, all statuses)
        (2) adjustment = exception_fee_tiered_final(period) - exception_fees_provisional
        (3) return_fees = sum(amount_cents of RETURN_FEE entries for period, all statuses)
        (4) waived_total = sum(amount_cents of entries for period with status WAIVED)
        (5) pre_minimum = (exception_fees_provisional + adjustment) + (return_fees - waived_return_fees) - waived_exception_fees
            where waived_*_fees split waived_total by fee_type
        (6) net_due = max(MONTHLY_MINIMUM_CENTS, pre_minimum)
        (7) if net_due > pre_minimum: create MINIMUM_TOPUP entry = net_due - pre_minimum (status BILLED)
        (8) all ACCRUED entries of the period -> BILLED
      Statement read: net_due_cents = sum(amount_cents over period entries with status BILLED)
      (includes ADJUSTMENT and MINIMUM_TOPUP; WAIVED entries excluded from net but shown as waived_cents).
    input_set: "all FeeLedgerEntry rows for enrollment+period"
    constants:
      MONTHLY_MINIMUM_CENTS: 5000
    precision: "integer cents; exact"
    variants:
      - name: minimum_before_waiver
        when: "FORBIDDEN alternate reading: apply the monthly minimum to gross before subtracting waivers"
        difference: "12 exceptions + 1 waived 500-cent return fee: pinned order yields pre_minimum 2300, topup 2700, net 5000; alternate yields max(5000, 2800) - 500 = 4500"

  - name: liability_party_derivation
    trigger: "ExceptionItem resolution (decision or default)"
    algorithm: constraint_propagation
    formula: |
      Inputs (>=3, non-linear interaction of reason x resolution path x tier):
        resolution_path in {DECISIONED_PAY, DECISIONED_RETURN, DEFAULTED_PAY, DEFAULTED_RETURN}
        reason in matcher reason enum
      Matrix:
        resolution_path DECISIONED_RETURN            => NONE (item unpaid; no loss to allocate)
        resolution_path in {DECISIONED_PAY}          => CUSTOMER (customer approved the exception item)
        resolution_path in {DEFAULTED_PAY, DEFAULTED_RETURN} => CUSTOMER (deadline missed; default rule governs)
      Every pay/default path assigns CUSTOMER at the exception level; bank liability arises only
      through LiabilityCase resolution on already-paid items.
    input_set: "the resolving ExceptionItem"
    constants: {}
    precision: "n/a (categorical)"
    variants: []

  - name: liability_case_split
    trigger: "LiabilityCase start-review (provisional credit) and resolve (final allocation)"
    algorithm: threshold
    formula: |
      Filing gate: clock <= item.paid_at + 30 days (inclusive), else ERR_CLAIM_WINDOW_CLOSED.
      Provisional credit at start-review: if claim_amount_cents <= 25000 then provisional = claim_amount_cents else 0.
      Resolution:
        BANK_LIABLE:     bank = claim_amount_cents; customer = 0
        CUSTOMER_LIABLE: bank = 0; customer = claim_amount_cents
        SHARED:          bank = floor(claim_amount_cents / 2); customer = claim_amount_cents - bank
                         (odd cent lands on CUSTOMER; e.g. 10001 => bank 5000, customer 5001)
    input_set: "the LiabilityCase and its PresentedItem"
    constants:
      CLAIM_WINDOW_DAYS: 30
      PROVISIONAL_CREDIT_CAP_CENTS: 25000
      SOD_CASE_THRESHOLD_CENTS: 25000
    precision: "integer cents; floor for bank share"
    variants: []

  - name: account_settlement_ledger
    trigger: "any PresentedItem pay event or reversal"
    algorithm: chronological
    formula: |
      On pay (any of PAID / DEFAULT_PAID paths): cumulative_paid_cents += item.amount_cents.
      On reverse: cumulative_reversed_cents += item.amount_cents.
      net_settled_cents = cumulative_paid_cents - cumulative_reversed_cents (derived on every mutation).
      INVARIANT: a pay event of amount X followed by its reversal leaves net_settled_cents unchanged
      (pay +X then reverse -X nets to zero), while both gross counters strictly increase.
    input_set: "the Account being mutated"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: account_review_threshold
    trigger: "after every account_settlement_ledger pay-side update"
    algorithm: threshold
    formula: |
      If payment_review_threshold_cents is non-null AND account.status == ACTIVE
      AND cumulative_paid_cents >= payment_review_threshold_cents (>= : equality triggers):
      account.status := REVIEW_HOLD.
    input_set: "the Account"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: stale_check_age
    trigger: "DAILY_SWEEP ops run"
    algorithm: threshold
    formula: |
      For each IssuedCheck REGISTERED where current_date >= issue_date + enrollment.stale_days
      (age >= stale_days; equality stales): status := STALE_DATED.
      Same sweep: AchDebitRule with effective_end_date < current_date => EXPIRED;
      TrainingSession SCHEDULED with scheduled_end < clock => NO_SHOW;
      ExceptionItem OPEN with decision_deadline_at < clock => default per default_decision_snapshot.
    input_set: "REGISTERED checks, ACTIVE/SUSPENDED ach rules, SCHEDULED sessions, OPEN exceptions (scoped to enrollment_id if provided)"
    constants: {}
    precision: "date precision (days)"
    variants: []

  - name: reverse_tier_volume_eligibility
    trigger: "POST /treasury/enrollments/{id}/change-tier with new_tier=REVERSE_POSITIVE_PAY"
    algorithm: aggregation
    formula: |
      eligible iff count(IssuedCheck rows created for this enrollment's accounts with
      created_at in [clock - 90 days, clock]) <= 75. (76th row makes the enrollment ineligible.)
      Rows count regardless of their status (REGISTERED/CONSUMED/VOIDED/STALE_DATED all count).
    input_set: "IssuedCheck set across all accounts of the enrollment in the trailing 90-day window (inclusive both ends)"
    constants:
      REVERSE_VOLUME_MAX_90D: 75
      REVERSE_WINDOW_DAYS: 90
    precision: "integer count"
    variants: []

  - name: adoption_metrics
    trigger: "GET /treasury/enrollments/{id}/adoption-report"
    algorithm: aggregation
    formula: |
      presented_total        = count(PresentedItem for enrollment's accounts)
      clean_paid_total       = count(items with match_result CLEAN)
      exceptions_total       = count(ExceptionItem for enrollment)
      decisioned_total       = count(exceptions status in {DECISIONED_PAY, DECISIONED_RETURN})
      defaulted_total        = count(exceptions status in {DEFAULTED_PAY, DEFAULTED_RETURN})
      resolved               = decisioned_total + defaulted_total
      on_time_decision_bp    = resolved == 0 ? 0 : round_half_up(10000 * decisioned_total / resolved)
      issue_file_compliance_bp = tier == REVERSE_POSITIVE_PAY ? null
                               : presented_total == 0 ? null
                               : round_half_up(10000 * clean_paid_total / presented_total)
      training_completed_count = count(TrainingSession COMPLETED for enrollment)
    input_set: "PresentedItem, ExceptionItem, TrainingSession sets for the enrollment"
    constants: {}
    precision: "basis points as integers, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role name recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Claimed role is listed on the endpoint; for Customer* roles the EnrollmentUser's user_role must match the claimed role"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership scope: for Customer* roles, X-User-ID must be an EnrollmentUser whose enrollment_id equals the target resource's enrollment chain"
    error_id: ERR_CROSS_ENROLLMENT_ACCESS
    http_status: 403
    applies_to: "all endpoints invoked with Customer* roles"
  - priority: 4
    category: existence
    check: "Request shape: required fields present, types correct, enum membership valid, amounts positive integers, row schema valid, FILTER rules carry max_amount_cents, BLOCK rules omit it, extend-deadline target within (current, current+24h]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    note: "Shape failures surface before resource lookup so a malformed body on a missing id yields ERR_INVALID_REQUEST... except path-id format errors resolve as NOT_FOUND"
  - priority: 5
    category: existence
    check: "Path and body-referenced ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /treasury/enrollments/{id}; POST /treasury/enrollments/{id}/change-tier; PATCH /treasury/ach-rules/{id}"
    note: "OCC is evaluated BEFORE state preconditions: a stale version beats every later check"
  - priority: 7
    category: state
    check: "State preconditions, outermost scope first: enrollment TERMINATED (ERR_ENROLLMENT_TERMINATED); enrollment not ACTIVE for customer writes and account/child mutations (ERR_ENROLLMENT_NOT_ACTIVE); then resource-state rules (ERR_ACCOUNT_NOT_ACTIVE, ERR_ACCOUNT_HAS_OPEN_EXCEPTIONS, ERR_ENROLLMENT_NOT_SETTLED, ERR_ENROLLMENT_NOT_ACTIVATABLE, ERR_CHECK_NOT_VOIDABLE, ERR_EXCEPTION_NOT_OPEN, ERR_ITEM_NOT_REVERSIBLE, ERR_ITEM_NOT_CLAIMABLE, ERR_CASE_NOT_OPEN, ERR_FEE_ENTRY_NOT_WAIVABLE, ERR_SESSION_NOT_COMPLETABLE, ERR_PERIOD_ALREADY_BILLED)"
    error_id: "ERR_* state family"
    http_status: 409
    applies_to: "state-transition and child-creation endpoints"
  - priority: 8
    category: business_temporal
    check: "Time-window rules: decision clock <= decision_deadline_at (ERR_DECISION_DEADLINE_PASSED); liability filing clock <= paid_at + 30 days (ERR_CLAIM_WINDOW_CLOSED); MONTHLY_BILLING period fully elapsed (ERR_PERIOD_NOT_CLOSED)"
    error_id: "ERR_* temporal family"
    http_status: 409
    applies_to: "exception decision, extend-deadline, liability case filing, MONTHLY_BILLING"
  - priority: 9
    category: business_constraint
    check: "Uniqueness / policy constraints: tier forbids issue files (ERR_TIER_FORBIDS_ISSUE_FILES); tier-change gates (ERR_TIER_CHANGE_NOT_ALLOWED); idempotent replay vs conflict (ERR_IDEMPOTENCY_CONFLICT); ACH rule window overlap (ERR_ACH_RULE_WINDOW_OVERLAP); trainer schedule conflict (ERR_TRAINING_SCHEDULE_CONFLICT); segregation of duties (ERR_SOD_UPLOAD_DECISION_CONFLICT, ERR_SOD_CASE_RESOLUTION_CONFLICT); ACH rule state for suspend/resume (ERR_ACH_RULE_NOT_ACTIVE)"
    error_id: "ERR_* constraint family"
    http_status: "409 (403 for the two SoD errors)"
    applies_to: "uploads, tier change, ACH rule writes, training scheduling, exception decision, case resolve"
  - priority: 10
    category: business_fiscal
    check: "Waiver authority caps: BankOps may waive amount_cents <= 1000; larger waivers require BankTreasuryManager"
    error_id: ERR_WAIVER_EXCEEDS_AUTHORITY
    http_status: 422
    applies_to: "POST /treasury/fee-entries/{id}/waive"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Enrollment lifecycle ---
  - method: POST
    path: "/treasury/enrollments"
    description: "Create enrollment (PENDING_ACTIVATION). Defaults: deadline_mode SAME_DAY_CUTOFF, decision_window_hours 24, amount_tolerance_cents 0, payee_score_threshold 85, stale_days 180."
    roles: [BankTreasuryManager]
    code: 201
    input: [business_name, tier, default_decision, "deadline_mode?", "decision_window_hours?", "amount_tolerance_cents?", "payee_score_threshold?", "stale_days?", "loss_suspension_threshold_cents?"]
    output: TreasuryEnrollment
    side_effects: ["status=PENDING_ACTIVATION; counters zeroed"]
  - method: GET
    path: "/treasury/enrollments/{id}"
    description: "Get enrollment"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: TreasuryEnrollment
    side_effects: []
  - method: PATCH
    path: "/treasury/enrollments/{id}"
    description: "Update mutable config. OCC: expected_enrollment_version required. Editing default_decision does NOT change default_decision_snapshot on existing OPEN exceptions. Version bumps only on direct enrollment lifecycle/config writes (PATCH, activate, suspend, terminate, change-tier, auto-suspend); recomputation of computed counters (open_exception_count, provisional_credit_outstanding_cents, ytd_bank_loss_cents) does NOT increment version."
    roles: [BankTreasuryManager, CustomerAdmin]
    code: 200
    input: [expected_enrollment_version, "default_decision?", "decision_window_hours?", "amount_tolerance_cents?", "payee_score_threshold?", "stale_days?", "loss_suspension_threshold_cents?"]
    output: TreasuryEnrollment
    side_effects: ["increments TreasuryEnrollment.version by 1"]
  - method: POST
    path: "/treasury/enrollments/{id}/activate"
    description: "PENDING_ACTIVATION->ACTIVE (requires >=1 COMPLETED TrainingSession) or SUSPENDED->ACTIVE (no training gate)"
    roles: [BankTreasuryManager]
    code: 200
    input: []
    output: TreasuryEnrollment
    side_effects: ["increments TreasuryEnrollment.version by 1"]
  - method: POST
    path: "/treasury/enrollments/{id}/suspend"
    description: "ACTIVE->SUSPENDED"
    roles: [BankTreasuryManager]
    code: 200
    input: []
    output: TreasuryEnrollment
    side_effects: ["increments TreasuryEnrollment.version by 1"]
  - method: POST
    path: "/treasury/enrollments/{id}/terminate"
    description: "ACTIVE|SUSPENDED->TERMINATED; requires all accounts CLOSED and no OPEN exceptions"
    roles: [BankTreasuryManager]
    code: 200
    input: []
    output: TreasuryEnrollment
    side_effects: ["increments TreasuryEnrollment.version by 1"]
  - method: POST
    path: "/treasury/enrollments/{id}/change-tier"
    description: "Migrate tier. Gates: open_exception_count==0; REVERSE target requires trailing-90-day issued volume <= 75. OCC required."
    roles: [BankTreasuryManager]
    code: 200
    input: [new_tier, expected_enrollment_version]
    output: TreasuryEnrollment
    side_effects: ["tier := new_tier; increments TreasuryEnrollment.version by 1"]
  - method: GET
    path: "/treasury/enrollments/{id}/adoption-report"
    description: "Computed adoption metrics (basis points; null compliance for REVERSE tier)"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerViewer]
    code: 200
    input: []
    output: { presented_total: integer, clean_paid_total: integer, exceptions_total: integer, decisioned_total: integer, defaulted_total: integer, on_time_decision_bp: integer, issue_file_compliance_bp: "integer|null", training_completed_count: integer }
    side_effects: []
  - method: GET
    path: "/treasury/enrollments/{id}/fee-statement"
    description: "Computed statement for period: sums over FeeLedgerEntry by type/status per monthly_statement"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerViewer]
    code: 200
    input: [period]
    output: { period: string, exception_fees_cents: integer, return_fees_cents: integer, adjustment_cents: integer, waived_cents: integer, minimum_topup_cents: integer, net_due_cents: integer, entry_count: integer }
    side_effects: []

  # --- Enrollment users ---
  - method: POST
    path: "/treasury/enrollment-users"
    description: "Create an EnrollmentUser. CustomerAdmin may create users only inside own enrollment."
    roles: [BankTreasuryManager, CustomerAdmin]
    code: 201
    input: [enrollment_id, display_name, user_role]
    output: EnrollmentUser
    side_effects: []
  - method: GET
    path: "/treasury/enrollment-users/{id}"
    description: "Get user"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: EnrollmentUser
    side_effects: []
  - method: GET
    path: "/treasury/enrollment-users"
    description: "List users"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "user_role?", "limit?", "offset?"]
    output: EnrollmentUser[]
    side_effects: []

  # --- Accounts ---
  - method: POST
    path: "/treasury/accounts"
    description: "Create account under an enrollment (enrollment must not be TERMINATED)"
    roles: [BankTreasuryManager]
    code: 201
    input: [enrollment_id, account_number, "payment_review_threshold_cents?"]
    output: Account
    side_effects: ["status=ACTIVE; counters zeroed"]
  - method: GET
    path: "/treasury/accounts/{id}"
    description: "Get account"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/treasury/accounts"
    description: "List accounts"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []
  - method: POST
    path: "/treasury/accounts/{id}/close"
    description: "ACTIVE|REVIEW_HOLD -> CLOSED; blocked while account has OPEN exceptions"
    roles: [BankTreasuryManager]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: POST
    path: "/treasury/accounts/{id}/clear-review-hold"
    description: "REVIEW_HOLD -> ACTIVE; does not retro-process held items"
    roles: [BankOps]
    code: 200
    input: []
    output: Account
    side_effects: []

  # --- Issue files & issued checks ---
  - method: POST
    path: "/treasury/issue-files"
    description: "Upload issued-check file. Idempotent on (enrollment_id, file_reference): identical rows replay the original upload; divergent rows with a used reference are rejected. Per-row validation; partial acceptance allowed."
    roles: [CustomerAdmin, CustomerManager]
    code: 201
    input: [enrollment_id, account_id, file_reference, rows]
    output: IssueFileUpload
    side_effects: ["accepted rows create REGISTERED IssuedCheck records; status computed per issue_file_row_validation"]
  - method: GET
    path: "/treasury/issue-files/{id}"
    description: "Get upload"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: IssueFileUpload
    side_effects: []
  - method: GET
    path: "/treasury/issue-files"
    description: "List uploads"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "account_id?", "uploaded_by_user_id?", "status?", "limit?", "offset?"]
    output: IssueFileUpload[]
    side_effects: []
  - method: GET
    path: "/treasury/issued-checks/{id}"
    description: "Get issued check"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: IssuedCheck
    side_effects: []
  - method: GET
    path: "/treasury/issued-checks"
    description: "List issued checks (filterable)"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["account_id?", "issue_file_id?", "consumed_by_item_id?", "status?", "check_number?", "limit?", "offset?"]
    output: IssuedCheck[]
    side_effects: []
  - method: POST
    path: "/treasury/issued-checks/{id}/void"
    description: "REGISTERED -> VOIDED"
    roles: [CustomerAdmin, CustomerManager]
    code: 200
    input: []
    output: IssuedCheck
    side_effects: []

  # --- Presented items ---
  - method: POST
    path: "/treasury/presented-items"
    description: "Ingest a presented check; runs exception_matching synchronously. Optional idempotency_key: identical payload replay returns the original item; same key with different payload => ERR_IDEMPOTENCY_CONFLICT. A business re-presentment (same account+check_number, different/no key) is NOT an error: it matches as DUPLICATE_PRESENTMENT."
    roles: [BankOps]
    code: 201
    input: [account_id, check_number, amount_cents, payee_name_raw, channel, "presented_at?", "idempotency_key?"]
    output: PresentedItem
    side_effects: ["exception_matching; on CLEAN: account ledger + threshold evaluation; on exception: ExceptionItem + EXCEPTION_FEE accrual + open_exception_count"]
  - method: GET
    path: "/treasury/presented-items/{id}"
    description: "Get item"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: PresentedItem
    side_effects: []
  - method: GET
    path: "/treasury/presented-items"
    description: "List items"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["account_id?", "exception_id?", "status?", "limit?", "offset?"]
    output: PresentedItem[]
    side_effects: []
  - method: POST
    path: "/treasury/presented-items/{id}/reverse"
    description: "PAID -> REVERSED (bank error correction); ledger compensation per account_settlement_ledger"
    roles: [BankTreasuryManager]
    code: 200
    input: [reason]
    output: PresentedItem
    side_effects: ["Account.cumulative_reversed_cents += amount; net_settled_cents recomputed"]

  # --- Exception queue ---
  - method: GET
    path: "/treasury/exceptions/{id}"
    description: "Get exception"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: ExceptionItem
    side_effects: []
  - method: GET
    path: "/treasury/exceptions"
    description: "Exception queue list (filterable)"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "account_id?", "presented_item_id?", "issued_check_id?", "fee_entry_id?", "decided_by_user_id?", "status?", "reason?", "limit?", "offset?"]
    output: ExceptionItem[]
    side_effects: []
  - method: POST
    path: "/treasury/exceptions/{id}/decision"
    description: "Customer pay/return decision on an OPEN exception before its deadline; SoD vs the issue-file uploader"
    roles: [CustomerManager, CustomerDecisionMaker]
    code: 200
    input: [decision]
    output: ExceptionItem
    side_effects: ["item pay/return effects; liability_party derivation; open_exception_count -= 1"]
  - method: POST
    path: "/treasury/exceptions/{id}/extend-deadline"
    description: "Bank extends decision_deadline_at once per exception; new deadline in (current, current+24h]; clock must be before current deadline"
    roles: [BankOps]
    code: 200
    input: [new_deadline_at]
    output: ExceptionItem
    side_effects: ["extended_once := true"]

  # --- ACH debit rules ---
  - method: POST
    path: "/treasury/ach-rules"
    description: "Create ACH debit BLOCK/FILTER rule. Overlap: rejected iff another rule with same (account_id, originator_company_id, sec_code) in {ACTIVE, SUSPENDED} has a half-open [start, end) window intersecting the new one; adjacency (end == start) is allowed; null end = open-ended."
    roles: [BankOps, CustomerAdmin, CustomerManager]
    code: 201
    input: [account_id, rule_type, originator_company_id, sec_code, "max_amount_cents?", effective_start_date, "effective_end_date?"]
    output: AchDebitRule
    side_effects: []
  - method: GET
    path: "/treasury/ach-rules/{id}"
    description: "Get rule"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: AchDebitRule
    side_effects: []
  - method: GET
    path: "/treasury/ach-rules"
    description: "List rules"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["account_id?", "status?", "limit?", "offset?"]
    output: AchDebitRule[]
    side_effects: []
  - method: PATCH
    path: "/treasury/ach-rules/{id}"
    description: "Edit amount cap / window; OCC required; window edits re-validate overlap (excluding self); only ACTIVE|SUSPENDED rules editable"
    roles: [BankOps, CustomerAdmin, CustomerManager]
    code: 200
    input: [expected_ach_rule_version, "max_amount_cents?", "effective_start_date?", "effective_end_date?"]
    output: AchDebitRule
    side_effects: ["increments AchDebitRule.version by 1"]
  - method: POST
    path: "/treasury/ach-rules/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [BankOps, CustomerAdmin, CustomerManager]
    code: 200
    input: []
    output: AchDebitRule
    side_effects: []
  - method: POST
    path: "/treasury/ach-rules/{id}/resume"
    description: "SUSPENDED -> ACTIVE; re-validates window not elapsed and overlap"
    roles: [BankOps, CustomerAdmin, CustomerManager]
    code: 200
    input: []
    output: AchDebitRule
    side_effects: []
  - method: POST
    path: "/treasury/ach-rules/{id}/retire"
    description: "ACTIVE|SUSPENDED -> RETIRED (terminal)"
    roles: [BankOps, CustomerAdmin, CustomerManager]
    code: 200
    input: []
    output: AchDebitRule
    side_effects: []

  # --- Liability cases ---
  - method: POST
    path: "/treasury/liability-cases"
    description: "File unauthorized-item claim on a PAID item within 30 days of paid_at"
    roles: [CustomerAdmin, CustomerManager, CustomerDecisionMaker]
    code: 201
    input: [presented_item_id, claim_reason]
    output: LiabilityCase
    side_effects: ["claim_amount_cents := item amount"]
  - method: GET
    path: "/treasury/liability-cases/{id}"
    description: "Get case"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: LiabilityCase
    side_effects: []
  - method: GET
    path: "/treasury/liability-cases"
    description: "List cases"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "presented_item_id?", "filed_by_user_id?", "status?", "limit?", "offset?"]
    output: LiabilityCase[]
    side_effects: []
  - method: POST
    path: "/treasury/liability-cases/{id}/start-review"
    description: "FILED -> UNDER_REVIEW; posts provisional credit iff claim <= 25000"
    roles: [BankOps]
    code: 200
    input: []
    output: LiabilityCase
    side_effects: ["assigned_bank_user_id := caller; provisional credit posted per liability_case_split"]
  - method: POST
    path: "/treasury/liability-cases/{id}/resolve"
    description: "UNDER_REVIEW -> RESOLVED_*; SoD: claims > 25000 require resolver != assigned_bank_user_id"
    roles: [BankTreasuryManager]
    code: 200
    input: [resolution]
    output: LiabilityCase
    side_effects: ["liability split; provisional credit finalize/clawback; ytd_bank_loss; auto-suspend evaluation"]
  - method: POST
    path: "/treasury/liability-cases/{id}/withdraw"
    description: "FILED|UNDER_REVIEW -> WITHDRAWN; reverses any outstanding provisional credit"
    roles: [CustomerAdmin, CustomerManager, CustomerDecisionMaker]
    code: 200
    input: []
    output: LiabilityCase
    side_effects: ["provisional_credit_outstanding_cents decremented"]

  # --- Fee ledger ---
  - method: GET
    path: "/treasury/fee-entries/{id}"
    description: "Get fee entry"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: FeeLedgerEntry
    side_effects: []
  - method: GET
    path: "/treasury/fee-entries"
    description: "List fee entries"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "period?", "exception_id?", "status?", "fee_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/treasury/fee-entries/{id}/waive"
    description: "ACCRUED|BILLED -> WAIVED for EXCEPTION_FEE/RETURN_FEE; BankOps cap 1000 cents, above requires BankTreasuryManager"
    roles: [BankOps, BankTreasuryManager]
    code: 200
    input: [reason]
    output: FeeLedgerEntry
    side_effects: ["records waived_from_status, waived_by, waiver_reason"]
  - method: POST
    path: "/treasury/fee-entries/{id}/reinstate"
    description: "WAIVED -> prior status (waived_from_status)"
    roles: [BankTreasuryManager]
    code: 200
    input: []
    output: FeeLedgerEntry
    side_effects: ["clears waiver fields"]

  # --- Training ---
  - method: POST
    path: "/treasury/training-sessions"
    description: "Schedule training. Per-trainer conflict rule: a new session conflicts with an existing SCHEDULED session of the same trainer when the buffered windows [start-30min, end+30min) intersect; exact adjacency of raw windows (end == start) CONFLICTS because of the buffer."
    roles: [BankOps]
    code: 201
    input: [enrollment_id, trainer_id, scheduled_start, scheduled_end]
    output: TrainingSession
    side_effects: []
  - method: GET
    path: "/treasury/training-sessions/{id}"
    description: "Get session"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []
  - method: GET
    path: "/treasury/training-sessions"
    description: "List sessions"
    roles: [BankTreasuryManager, BankOps, CustomerAdmin, CustomerManager, CustomerDecisionMaker, CustomerViewer]
    code: 200
    input: ["enrollment_id?", "trainer_id?", "status?", "limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []
  - method: POST
    path: "/treasury/training-sessions/{id}/complete"
    description: "SCHEDULED -> COMPLETED with non-empty attendee list of this enrollment's users"
    roles: [BankOps]
    code: 200
    input: [attendee_user_ids]
    output: TrainingSession
    side_effects: []
  - method: POST
    path: "/treasury/training-sessions/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [BankOps]
    code: 200
    input: []
    output: TrainingSession
    side_effects: []

  # --- Ops runs (checkpoint sweeps) ---
  - method: POST
    path: "/treasury/ops-runs"
    description: "Run a checkpoint. DAILY_SWEEP: defaults expired OPEN exceptions, stales checks, expires ACH rules, marks no-show sessions (scope: enrollment_id or all). MONTHLY_BILLING: requires enrollment_id + period (YYYY-MM); period must be fully elapsed and unbilled; applies tier reconciliation, minimum top-up, flips ACCRUED->BILLED."
    roles: [BankOps]
    code: 201
    input: [kind, "enrollment_id?", "period?"]
    output: OpsRun
    side_effects: ["per stale_check_age / monthly_statement / exception default transitions"]
  - method: GET
    path: "/treasury/ops-runs/{id}"
    description: "Get ops run"
    roles: [BankTreasuryManager, BankOps]
    code: 200
    input: []
    output: OpsRun
    side_effects: []
  - method: GET
    path: "/treasury/ops-runs"
    description: "List ops runs"
    roles: [BankTreasuryManager, BankOps]
    code: 200
    input: ["enrollment_id?", "kind?", "limit?", "offset?"]
    output: OpsRun[]
    side_effects: []

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time."
    roles: [BankOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, malformed, or role name unrecognized" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not listed on the endpoint, or Customer* caller's EnrollmentUser.user_role does not match the claimed role" }
  - { id: ERR_CROSS_ENROLLMENT_ACCESS, http: 403, condition: "Customer* caller's enrollment_id does not match the target resource's enrollment chain" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, non-positive amount, malformed row, FILTER rule without max_amount_cents, BLOCK rule with max_amount_cents, extend target outside (current, current+24h], MONTHLY_BILLING without period, scheduled_end <= scheduled_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Customer write attempted while enrollment is PENDING_ACTIVATION or SUSPENDED" }
  - { id: ERR_ENROLLMENT_TERMINATED, http: 409, condition: "Any mutation on resources of a TERMINATED enrollment" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVATABLE, http: 409, condition: "Initial activation without at least one COMPLETED TrainingSession" }
  - { id: ERR_ENROLLMENT_NOT_SETTLED, http: 409, condition: "Terminate attempted with non-CLOSED accounts or open_exception_count > 0" }
  - { id: ERR_ACCOUNT_NOT_ACTIVE, http: 409, condition: "Upload or presented-item ingestion targets a CLOSED account; also clear-review-hold on non-REVIEW_HOLD account" }
  - { id: ERR_ACCOUNT_HAS_OPEN_EXCEPTIONS, http: 409, condition: "Account close attempted while an exception with this account_id is OPEN" }
  - { id: ERR_TIER_FORBIDS_ISSUE_FILES, http: 409, condition: "Issue-file upload on a REVERSE_POSITIVE_PAY enrollment" }
  - { id: ERR_TIER_CHANGE_NOT_ALLOWED, http: 409, condition: "change-tier with open exceptions, or to REVERSE_POSITIVE_PAY with trailing-90-day issued volume > 75" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "file_reference or idempotency_key reused with a different payload hash" }
  - { id: ERR_CHECK_NOT_VOIDABLE, http: 409, condition: "Void attempted on a CONSUMED, VOIDED, or STALE_DATED check" }
  - { id: ERR_ITEM_NOT_REVERSIBLE, http: 409, condition: "Reverse attempted on an item not in PAID status" }
  - { id: ERR_ITEM_NOT_CLAIMABLE, http: 409, condition: "Liability case filed on an item not in PAID status" }
  - { id: ERR_EXCEPTION_NOT_OPEN, http: 409, condition: "Decision or extend-deadline on an exception not in OPEN status" }
  - { id: ERR_DECISION_DEADLINE_PASSED, http: 409, condition: "Decision or extension attempted when the logical clock is past decision_deadline_at (decision at exactly the deadline is allowed)" }
  - { id: ERR_EXCEPTION_ALREADY_EXTENDED, http: 409, condition: "extend-deadline attempted when extended_once is already true" }
  - { id: ERR_ACH_RULE_WINDOW_OVERLAP, http: 409, condition: "ACH rule window overlaps another rule with same (account_id, originator_company_id, sec_code) in {ACTIVE, SUSPENDED}; half-open [start, end) semantics" }
  - { id: ERR_ACH_RULE_NOT_ACTIVE, http: 409, condition: "suspend on non-ACTIVE rule; resume on non-SUSPENDED rule or whose window has elapsed; PATCH on EXPIRED|RETIRED rule" }
  - { id: ERR_TRAINING_SCHEDULE_CONFLICT, http: 409, condition: "New session's buffered window [start-30min, end+30min) intersects another SCHEDULED session of the same trainer" }
  - { id: ERR_SESSION_NOT_COMPLETABLE, http: 409, condition: "complete/cancel attempted on a session not in SCHEDULED" }
  - { id: ERR_CLAIM_WINDOW_CLOSED, http: 409, condition: "Liability case filed later than paid_at + 30 days (inclusive boundary)" }
  - { id: ERR_CASE_NOT_OPEN, http: 409, condition: "start-review on non-FILED case; resolve on non-UNDER_REVIEW case; withdraw on terminal case" }
  - { id: ERR_SOD_UPLOAD_DECISION_CONFLICT, http: 403, condition: "Decision caller is the EnrollmentUser who uploaded the issue file that registered the exception's issued check" }
  - { id: ERR_SOD_CASE_RESOLUTION_CONFLICT, http: 403, condition: "Claim > 25000 cents resolved by the same bank user id recorded as assigned_bank_user_id" }
  - { id: ERR_WAIVER_EXCEEDS_AUTHORITY, http: 422, condition: "BankOps waiver of amount_cents > 1000 (BankTreasuryManager uncapped)" }
  - { id: ERR_FEE_ENTRY_NOT_WAIVABLE, http: 409, condition: "Waive on an ADJUSTMENT entry or an already-WAIVED entry; reinstate on a non-WAIVED entry" }
  - { id: ERR_PERIOD_ALREADY_BILLED, http: 409, condition: "MONTHLY_BILLING for an enrollment+period that already has BILLED entries" }
  - { id: ERR_PERIOD_NOT_CLOSED, http: 409, condition: "MONTHLY_BILLING for a period whose last day has not fully elapsed at the logical clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BankTreasuryManager
    description: "Bank treasury manager: enrollment lifecycle, tier changes, accounts, payment reversals, liability resolution, fee reinstatement, uncapped waivers"
    identity: opaque
    exclusive_operations:
      - "POST /treasury/enrollments"
      - "POST /treasury/enrollments/{id}/activate|suspend|terminate|change-tier"
      - "POST /treasury/accounts, POST /treasury/accounts/{id}/close"
      - "POST /treasury/presented-items/{id}/reverse"
      - "POST /treasury/liability-cases/{id}/resolve"
      - "POST /treasury/fee-entries/{id}/reinstate"
    shared_operations:
      - "PATCH /treasury/enrollments/{id} (with CustomerAdmin)"
      - "POST /treasury/enrollment-users (with CustomerAdmin)"
      - "POST /treasury/fee-entries/{id}/waive (with BankOps; uncapped)"
      - "GET endpoints (with all roles)"
  - name: BankOps
    description: "Bank treasury operations: item ingestion, sweeps, ACH rule maintenance, training scheduling, exception deadline extension, case review assignment, capped waivers"
    identity: opaque
    exclusive_operations:
      - "POST /treasury/presented-items"
      - "POST /treasury/ops-runs"
      - "POST /_clock/set_current_utc"
      - "POST /treasury/accounts/{id}/clear-review-hold"
      - "POST /treasury/exceptions/{id}/extend-deadline"
      - "POST /treasury/liability-cases/{id}/start-review"
      - "POST /treasury/training-sessions (+ complete/cancel)"
    shared_operations:
      - "ACH rule create/patch/suspend/resume/retire (with CustomerAdmin, CustomerManager)"
      - "POST /treasury/fee-entries/{id}/waive (amount_cents <= 1000)"
      - "GET endpoints"
  - name: CustomerAdmin
    description: "Customer administrator (user_role ADMIN): issue files, check voids, ACH rules, own-enrollment config patch, user creation, liability filing"
    identity: "entity_backed:EnrollmentUser"
    exclusive_operations: []
    shared_operations:
      - "POST /treasury/issue-files; POST /treasury/issued-checks/{id}/void (with CustomerManager)"
      - "PATCH /treasury/enrollments/{id} (own enrollment only)"
      - "POST /treasury/enrollment-users (own enrollment only)"
      - "POST /treasury/liability-cases, .../withdraw (with CustomerManager, CustomerDecisionMaker)"
      - "ACH rule writes (with BankOps, CustomerManager)"
      - "GET endpoints"
  - name: CustomerManager
    description: "Customer treasury manager (user_role MANAGER): broad write access including BOTH issue-file upload and exception decision — subject to segregation-of-duties on own uploads"
    identity: "entity_backed:EnrollmentUser"
    exclusive_operations: []
    shared_operations:
      - "POST /treasury/issue-files; POST /treasury/issued-checks/{id}/void"
      - "POST /treasury/exceptions/{id}/decision (with CustomerDecisionMaker)"
      - "POST /treasury/liability-cases, .../withdraw"
      - "ACH rule writes"
      - "GET endpoints"
  - name: CustomerDecisionMaker
    description: "Customer exception decision-maker (user_role DECISION_MAKER): decisions and liability claims only"
    identity: "entity_backed:EnrollmentUser"
    exclusive_operations: []
    shared_operations:
      - "POST /treasury/exceptions/{id}/decision"
      - "POST /treasury/liability-cases, .../withdraw"
      - "GET endpoints"
  - name: CustomerViewer
    description: "Customer read-only auditor (user_role VIEWER)"
    identity: "entity_backed:EnrollmentUser"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints only"
