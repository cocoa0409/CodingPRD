              captures: { f_a_id: $.data.id, f_a_v0: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_v0}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_1_id: $.data.id }
            - call: "POST /flood-zone/compliance-notices"
              payload: { loan_folio_id: "${f_a_id}", determination_id: "${det_1_id}", notice_type: "MANDATORY_PURCHASE", annual_premium_rate_cents: 288000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { n1_id: $.data.id, n1_estimate: $.data.estimated_force_place_premium_cents }
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:01Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/loan-folios/${f_a_id}/force-placements"
              payload: {}
              as: Lender
