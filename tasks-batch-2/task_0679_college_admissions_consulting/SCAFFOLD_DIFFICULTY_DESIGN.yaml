              captures: { c16: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c16}", full_name: "S 16", email: "s16@x.com", grad_year: 2027, gpa: 3.6, sat_total: 1300 }
              as: Counselor
              as_user_id: "${c16}"
              captures: { s16: $.data.id }
            - call: "POST /contracts"
              payload: { student_id: "${s16}", billing_model: "HOURLY", hourly_rate_cents: 20000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2026-12-31T00:00:00Z" }
              as: Counselor
              as_user_id: "${c16}"
              captures: { k16a: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { student_id: "${s16}", billing_model: "HOURLY", hourly_rate_cents: 20000, coverage_start_utc: "2026-12-31T00:00:00Z", coverage_end_utc: "2027-06-30T00:00:00Z" }
              as: Counselor
              as_user_id: "${c16}"
              captures: { k16b: $.data.id }
          assert:
            - "response.status == 201"
            - "EngagementContract.${k16b}.status == DRAFT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: charge_then_equal_credit_conserves_retainer_balance
        grounds:
          - calculations.retainer_ledger
          - state_machines.EngagementContract.DRAFT_to_ACTIVE
          - entities.EngagementContract.fields.retainer_balance_cents
          - entities.BillingEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity = retainer_balance_cents (= credited_cents - charged_cents). Forward action:
          post a CHARGE of 30000; compensating action: post a CREDIT of 30000. The pinned invariant
          retainer_balance_cents == credited_cents - charged_cents leaves the balance back at its pre-pair
          value (200000) with zero drift.
        test_recipe:
          setup:
            - "s17 of c17 with an ACTIVE HOURLY contract, retainer deposit 200000"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C 17", email: "c17@x.com", hourly_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { c17: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c17}", full_name: "S 17", email: "s17@x.com", grad_year: 2027, gpa: 3.6, sat_total: 1300 }
              as: Counselor
              as_user_id: "${c17}"
              captures: { s17: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s17}", title: "Vol", category: "SERVICE", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${c17}"
            - call: "POST /students/${s17}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c17}"
              captures: { s17_v_onb: $.data.version }
            - call: "POST /contracts"
              payload: { student_id: "${s17}", billing_model: "HOURLY", hourly_rate_cents: 20000, retainer_deposit_cents: 200000, coverage_start_utc: "2026-04-01T00:00:00Z", coverage_end_utc: "2027-06-01T00:00:00Z" }
              as: Counselor
              as_user_id: "${c17}"
              captures: { k17: $.data.id }
            - call: "POST /contracts/${k17}/activate"
              payload: { expected_student_version: "${s17_v_onb}" }
              as: Counselor
              as_user_id: "${c17}"
            - call: "POST /billing-entries"
              payload: { contract_id: "${k17}", entry_type: "CHARGE", source_kind: "MANUAL", amount_cents: 30000, memo: "extra work" }
              as: Counselor
              as_user_id: "${c17}"
          trigger:
            - call: "POST /billing-entries"
              payload: { contract_id: "${k17}", entry_type: "CREDIT", source_kind: "MANUAL", amount_cents: 30000, memo: "refund" }
              as: Counselor
              as_user_id: "${c17}"
          assert:
            - "EngagementContract.${k17}.charged_cents == 30000"
            - "EngagementContract.${k17}.credited_cents == 230000"
            - "EngagementContract.${k17}.retainer_balance_cents == 200000"

      - name: select_then_drop_conserves_selected_count_and_lock
        grounds:
          - calculations.list_balance_lock
          - state_machines.SchoolListItem.CANDIDATE_to_SELECTED
          - entities.Student.fields.list_locked
          - entities.SchoolListItem.fields.status
        distinguishing_aspect: |
          Conserved quantity = count of SELECTED SchoolListItems (and derived Student.list_locked), a
          DIFFERENT conserved quantity from retainer cents. Forward action: select a 4th item (count 3 -> 4,
          list still locked); compensating action: drop that same item (count 4 -> 3). The pinned invariant
          n_selected and list_locked return to their pre-pair values (3 selected, list_locked true).
        test_recipe:
          setup:
            - "s18 of c18 (gpa 3.5 sat 1300, profile_strength 57.66) with 3 SELECTED items (A safety, B target, C reach), list_locked true; a 4th CANDIDATE item D exists"
          setup_api_calls:
            - call: "POST /counselors"
              payload: { full_name: "C 18", email: "c18@x.com", hourly_rate_cents: 18000 }
              as: PlatformAdmin
              captures: { c18: $.data.id }
            - call: "POST /students"
              payload: { counselor_id: "${c18}", full_name: "S 18", email: "s18@x.com", grad_year: 2027, gpa: 3.5, sat_total: 1300 }
              as: Counselor
              as_user_id: "${c18}"
              captures: { s18: $.data.id }
            - call: "POST /activities"
              payload: { student_id: "${s18}", title: "Act", category: "ARTS", hours_per_week: 2, weeks_per_year: 20, tier: 3 }
              as: Counselor
              as_user_id: "${c18}"
            - call: "POST /students/${s18}/transition"
              payload: { to_status: "ONBOARDED" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { s18_v_onb: $.data.version }
            - call: "POST /school-list-items"
              payload: { student_id: "${s18}", school_name: "Safety A", admit_rate: 0.70, median_sat: 1100, round: "RD" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { sliA: $.data.id }
            - call: "POST /school-list-items/${sliA}/select"
              payload: { expected_student_version: "${s18_v_onb}" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { s18_v1: $.data.version }
            - call: "POST /school-list-items"
              payload: { student_id: "${s18}", school_name: "Target B", admit_rate: 0.40, median_sat: 1300, round: "RD" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { sliB: $.data.id }
            - call: "POST /school-list-items/${sliB}/select"
              payload: { expected_student_version: "${s18_v1}" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { s18_v2: $.data.version }
            - call: "POST /school-list-items"
              payload: { student_id: "${s18}", school_name: "Reach C", admit_rate: 0.10, median_sat: 1550, round: "RD" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { sliC: $.data.id }
            - call: "POST /school-list-items/${sliC}/select"
              payload: { expected_student_version: "${s18_v2}" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { s18_v3: $.data.version }
            - call: "POST /school-list-items"
              payload: { student_id: "${s18}", school_name: "Extra D", admit_rate: 0.35, median_sat: 1320, round: "RD" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { sliD: $.data.id }
            - call: "POST /school-list-items/${sliD}/select"
              payload: { expected_student_version: "${s18_v3}" }
              as: Counselor
              as_user_id: "${c18}"
              captures: { s18_v4: $.data.version }
          trigger:
            - call: "POST /school-list-items/${sliD}/drop"
              payload: {}
              as: Counselor
              as_user_id: "${c18}"
          assert:
            - "SchoolListItem.${sliD}.status == DROPPED"
