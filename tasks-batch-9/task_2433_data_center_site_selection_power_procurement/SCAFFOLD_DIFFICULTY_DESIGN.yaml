          - state_machines.CandidateSite.DRAFT_to_SCREENED
        distinguishing_aspect: |
          The application's own status is a perfectly legal DRAFT; submit is blocked purely by the
          state of a DIFFERENT entity (its CandidateSite is DRAFT, not SCREENED) with
          ERR_SITE_NOT_SCREENED, and the identical call succeeds unchanged once only the site has
          moved to SCREENED.
        test_recipe:
          setup:
            - "Site Alpha created but NOT screened (status DRAFT)."
