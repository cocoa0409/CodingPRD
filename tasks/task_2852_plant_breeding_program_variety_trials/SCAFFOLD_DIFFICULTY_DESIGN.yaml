  - rule_id: cross_entity_state_dependency
    instances:
      - name: progeny_creation_requires_pollinated_block_and_dies_on_auto_close
        grounds:
          - validations[priority=17]
          - state_machines.CrossingBlock
          - entities.CrossingBlock.fields.progeny_line_count
          - endpoints["POST /crossing-blocks/{id}/progenies"]
        distinguishing_aspect: |
          Whether a BreedingLine may be created at all depends on the status of a
          different entity, the CrossingBlock, and that status is not stable: the
          window opens on POLLINATED and slams shut by itself the moment
          progeny_line_count reaches realized_cross_count, so the identical
          progeny body returns ERR_BLOCK_NOT_POLLINATED both before pollination
          and after the second progeny, with success only in between.
        test_recipe:
          setup:
            - "One program, one objective, two founder lines used as the female and male parents."
            - "One WINTER NurseryBlock and one CrossingBlock on it in status PLANNED with planned_cross_count 4."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy Crosses", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "PAR-F1", generation_number: 6, seed_inventory_g: 100000 }
              as: BreedingScientist
              captures: { fem_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "PAR-M1", generation_number: 6, seed_inventory_g: 100000 }
              as: BreedingScientist
              captures: { mal_id: $.data.id }
            - call: "POST /nursery-blocks"
              payload: { block_code: "NB-CR1", nursery_type: "WINTER", location_code: "PR_ISABELA", plot_count: 200, fallow_buffer_days: 14 }
              as: BreedingScientist
              captures: { block_id: $.data.id }
            - call: "POST /crossing-blocks"
              payload: { program_id: "${prog_id}", nursery_block_id: "${block_id}", season_code: "2026W", planned_cross_count: 4 }
              as: BreedingScientist
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /crossing-blocks/${cb_id}/progenies"
              payload: { objective_id: "${obj_id}", designation: "PRG-0001", generation_number: 2, female_parent_line_id: "${fem_id}", male_parent_line_id: "${mal_id}", seed_inventory_g: 400 }
              as: BreedingScientist
            - call: "POST /crossing-blocks/${cb_id}/pollinate"
              payload: { realized_cross_count: 2 }
              as: BreedingScientist
            - call: "POST /crossing-blocks/${cb_id}/progenies"
              payload: { objective_id: "${obj_id}", designation: "PRG-0001", generation_number: 2, female_parent_line_id: "${fem_id}", male_parent_line_id: "${mal_id}", seed_inventory_g: 400 }
              as: BreedingScientist
              captures: { prg1_id: $.data.id }
            - call: "POST /crossing-blocks/${cb_id}/progenies"
              payload: { objective_id: "${obj_id}", designation: "PRG-0002", generation_number: 2, female_parent_line_id: "${fem_id}", male_parent_line_id: "${mal_id}", seed_inventory_g: 400 }
              as: BreedingScientist
              captures: { prg2_id: $.data.id }
            - call: "POST /crossing-blocks/${cb_id}/progenies"
              payload: { objective_id: "${obj_id}", designation: "PRG-0003", generation_number: 2, female_parent_line_id: "${fem_id}", male_parent_line_id: "${mal_id}", seed_inventory_g: 400 }
              as: BreedingScientist
          assert:
            - "the pre-pollination progeny request -> 409 with data.error_id == ERR_BLOCK_NOT_POLLINATED"
            - "CrossingBlock.${cb_id}.status == POLLINATED and realized_cross_count == 2 after the pollinate call (planned_cross_count stays 4)"
            - "the first two post-pollination progeny requests -> 201; BreedingLine.${prg1_id}.origin_block_id == ${cb_id} and pipeline_stage == NURSERY"
            - "CrossingBlock.${cb_id}.progeny_line_count == 2 and status == CLOSED (auto-closed at realized_cross_count, not at planned_cross_count)"
            - "the third progeny request -> 409 with data.error_id == ERR_BLOCK_NOT_POLLINATED and no line is created"
            - "BreedingProgram.${prog_id}.active_line_count == 4 (2 founders + 2 progenies) and BreedingLine.${prg2_id}.cumulative_seed_produced_g == 400"
            - "BreedingLine.${prg1_id}.advancement_readiness == NOT_READY (generation 2 is below min_generation_number 5)"

      - name: advancement_decision_requires_analyzed_series_not_merely_complete_data
        grounds:
          - validations[priority=18]
          - state_machines.TrialSeries.DATA_COMPLETE_to_ANALYZED
          - state_machines.BreedingLine.pipeline_stage_NURSERY_to_STAGE_1
          - endpoints["POST /advancement-decisions"]
        distinguishing_aspect: |
          The gate lives on a third entity that the request body only references:
          a series that has every entry harvested is DATA_COMPLETE but not yet
          ANALYZED, and the decision must be refused with ERR_SERIES_INVALID_STATE
          even though the line itself is READY, has HARVESTED trial data and would
          clear the index bar. Running one analysis - which changes no entry and
          no line stage - is what makes the identical decision body legal.
        test_recipe:
          setup:
            - "One program, one objective (bar 85.00, min_generation_number 5), lines SX-1001 and SX-1002 at generation 6."
            - "One site, one STAGE_1 series with replication_count 4 and min_locations 1, both entries planted, observed and finalized, so the series has bubbled to DATA_COMPLETE and no analysis exists yet."
