          - entities.EDEvent.fields.is_readmission
        distinguishing_aspect: |
          Metric = inter-admission day count via POST /mih/ed-events: a second admission
          exactly READMISSION_WINDOW_DAYS (30) after the first discharge_date sets
          is_readmission=true (inclusive upper bound).
        test_recipe:
          setup:
            - "Patient with a prior INPATIENT_ADMISSION discharged 2026-03-10."
          setup_api_calls:
            - call: "POST /mih/providers"
              payload: { full_name: "Coord", provider_type: "COORDINATOR", npi: "1000000101" }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /mih/patients"
              payload: { full_name: "Pat K", date_of_birth: "1958-03-03", baseline_ed_visits_12mo: 6, chronic_conditions_count: 3 }
              as: CareCoordinator
              as_user_id: "${coord_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /mih/ed-events"
              payload: { patient_id: "${pat_id}", event_type: "INPATIENT_ADMISSION", event_date: "2026-03-01T00:00:00Z", discharge_date: "2026-03-10T00:00:00Z" }
              as: CareCoordinator
