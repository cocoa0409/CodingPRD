  - section: errors
    instances:
      - name: request_missing_x_user_role_header_unauthenticated
        claim_type: error_triggerable
        grounds: ["errors[ERR_UNAUTHENTICATED]", "errors[ERR_ROLE_NOT_PERMITTED]", "errors[ERR_RESOURCE_NOT_FOUND]", "validations[10]", response_envelope.error]
        distinguishing_aspect: "The error envelope is uniform for every failure class and the priority-10 authentication gate runs before existence: a request with NO role header against a NON-EXISTENT id returns ERR_UNAUTHENTICATED (401) rather than ERR_RESOURCE_NOT_FOUND (404), and an unrecognised role string is also 401 rather than 403."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one APPROVED depository exists (id captured)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "GET /depositories/${dep_id}"
              payload: {}
              as: NONE_NO_ROLE_HEADER
              captures: { err_noauth: $.data.error_id }
            - call: "GET /depositories/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NONE_NO_ROLE_HEADER
              captures: { err_noauth_unknown: $.data.error_id }
            - call: "GET /depositories/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NotARealRole
              captures: { err_bad_role: $.data.error_id }
            - call: "GET /depositories/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StateRegulator
              captures: { err_missing: $.data.error_id }
          assert:
            - "No X-User-Role header on an EXISTING resource: 401 with data.error_id == 'ERR_UNAUTHENTICATED' and a non-empty data.message"
            - "No header on a NON-EXISTENT id: still 401 'ERR_UNAUTHENTICATED' — priority 10 runs before priority 30, so 404 never leaks the existence of an id to an unauthenticated caller"
            - "Unrecognised role string 'NotARealRole': 401 'ERR_UNAUTHENTICATED' (the header is present but not a declared role), NOT 403 ERR_ROLE_NOT_PERMITTED, which is reserved for a valid role lacking permission"
            - "Authenticated regulator on the same unknown id: 404 with data.error_id == 'ERR_RESOURCE_NOT_FOUND'"
            - "All four responses carry response_type == 'error', meta.api_request_id and meta.api_request_timestamp, and a data object with exactly error_id and message — no stack traces, no partial entity payloads"
            - "No state changed: Depository.${dep_id}.version is unchanged and GET /depositories returns total_count 1"

  - section: RBAC
    instances:
      - name: roles_cannot_perform_each_others_exclusive_operations
        claim_type: exclusive_operation_denied
        grounds: [roles.StateRegulator.exclusive_operations, roles.BankCollateralOfficer.exclusive_operations, roles.SystemOperator, "validations[20]", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "There is no hierarchical override anywhere in this scaffold: the StateRegulator — the most powerful role in the domain — cannot register a depository, cannot move the logical clock and cannot pledge collateral, while the BankCollateralOfficer cannot decide its own qualification review; every cross-role attempt is 403 ERR_ROLE_NOT_PERMITTED at priority 20, ahead of any existence or business check."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one COUNTY unit; one DRAFT depository with a review that is ATTESTED and UNDER_REVIEW (ready to decide)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000000 }
              as: StateRegulator
              captures: { unit_id: $.data.id }
            - call: "POST /depositories"
              payload: { name: "Ridge National Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { dep_id: $.data.id }
            - call: "POST /depositories/${dep_id}/qualification-reviews"
              payload: { requested_pledge_capacity_cents: 400000000000 }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { qr_id: $.data.id }
            - call: "POST /qualification-reviews/${qr_id}/attest"
              payload: { attestation_note: "Package complete" }
              as: BankComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /qualification-reviews/${qr_id}/begin-review"
              payload: {}
              as: StateRegulator
          trigger:
            - call: "POST /depositories"
              payload: { name: "Treasurer Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: PublicUnitTreasurer
              as_user_id: "${unit_id}"
              captures: { err_treasurer_registers: $.data.error_id }
            - call: "POST /depositories"
              payload: { name: "Regulator Bank", charter_type: "STATE_CHARTERED", home_state: "OH", capital_ratio_bps: 1200 }
              as: StateRegulator
              captures: { err_regulator_registers: $.data.error_id }
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { err_officer_decides: $.data.error_id }
            - call: "POST /custodians"
              payload: { name: "Officer Custody", custodian_type: "TRUST_BANK" }
              as: BankCollateralOfficer
              as_user_id: "officer-1"
              captures: { err_officer_registers_custodian: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateRegulator
              captures: { err_regulator_moves_clock: $.data.error_id }
            - call: "POST /qualification-reviews/${qr_id}/decide"
              payload: { decision: "APPROVE" }
              as: StateRegulator
              captures: { decided_status: $.data.status }
          assert:
            - "Treasurer registering a depository: 403 with error_id 'ERR_ROLE_NOT_PERMITTED'"
            - "StateRegulator registering a depository: 403 'ERR_ROLE_NOT_PERMITTED' — POST /depositories is exclusive to BankCollateralOfficer, and the regulator's breadth elsewhere grants no override"
            - "BankCollateralOfficer deciding the review it filed: 403 'ERR_ROLE_NOT_PERMITTED' at priority 20 — this is a ROLE failure, distinct from the priority-50 ERR_SEGREGATION_OF_DUTIES that would apply to a same-user attest"
            - "BankCollateralOfficer registering a custodian: 403 'ERR_ROLE_NOT_PERMITTED'"
            - "StateRegulator moving the logical clock: 403 'ERR_ROLE_NOT_PERMITTED'; the clock is still 2026-08-01T00:00:00Z, which the final decide proves via decided_at"
            - "StateRegulator deciding the review: 200 with status 'APPROVED', decided_at == 2026-08-01T00:00:00Z, and Depository.${dep_id}.approval_status == 'APPROVED'"
            - "None of the five rejected calls created a row or bumped a version: GET /depositories returns total_count 1 and GET /custodians has no 'Officer Custody'"

      - name: entity_backed_principal_cannot_act_on_another_principals_rows
        claim_type: peer_role_isolation
        grounds: [roles.PublicUnitTreasurer.identity, roles.Custodian.identity, "validations[25]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "PublicUnitTreasurer and Custodian are entity_backed principals, so possessing the right ROLE is insufficient: treasurer B holding a valid PublicUnitTreasurer header cannot deposit into or forecast against unit A's account, and custodian B cannot issue a safekeeping receipt under an agreement held at custodian A — all 403 ERR_NOT_RESOURCE_OWNER at priority 25, ahead of every business rule."
        test_recipe:
