              as: PlantOperator
              captures: { k_cp_fo: $.data.failover_active }
          assert:
            - "Turnaround.${ta_cp}.status == COMPLETED (sweep at exactly window_end)"
            - "OnsitePlant.${p_fab}.status == OPERATING and effective_capacity_nm3h == 6000"
            - "SupplyContract.${k_fab}.failover_active == false"

      - name: certificate_double_decision_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.QualityCertificate
        distinguishing_aspect: "Certifying an already-CERTIFIED certificate is rejected 409 ERR_INVALID_STATE_TRANSITION; the decision is final."
        test_recipe:
          setup:
            - "Delivery confirmed and certificate certified CERTIFIED once."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
            - *k_rd2
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_dl: "$.data[0].id" }
            - call: "POST /gas-supply/deliveries/${d_dl}/confirm-delivery"
              payload: { delivered_quantity_liters: 30000 }
              as: PipelineDispatcher
            - call: "POST /gas-supply/deliveries/${d_dl}/quality-certificates"
              payload: { sampled_at: "2026-10-01T08:00:00Z", measured_purity_percent: 99.9995, measured_impurity_ppm: 5 }
              as: QualityAnalyst
              as_user_id: "qa-1"
              captures: { qc_dl: $.data.id }
            - call: "POST /gas-supply/quality-certificates/${qc_dl}/certify"
              payload: { decision: "CERTIFIED" }
              as: QualityCertifier
              as_user_id: "qc-9"
          trigger:
            - call: "POST /gas-supply/quality-certificates/${qc_dl}/certify"
              payload: { decision: "FAILED" }
              as: QualityCertifier
              as_user_id: "qc-9"
              captures: { err_dl: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_dl} == ERR_INVALID_STATE_TRANSITION"
            - "QualityCertificate.${qc_dl}.result remains CERTIFIED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: mode_recommendation_bulk_and_cylinder_branches
        claim_type: Correct Result
        grounds:
          - calculations.mode_recommendation
        distinguishing_aspect: "The two lower branches of the threshold ladder: avg 300 without pipeline frontage yields BULK_LIQUID (>= 200), avg 150 yields CYLINDER — complementing the §1.8 ONSITE/PIPELINE boundary."
        test_recipe:
          setup:
            - "Logical clock set. Customer Fabrikam exists."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
          trigger:
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "S-BULK", demand_avg_nm3h: 300, demand_peak_nm3h: 400, required_purity_percent: 99.9, required_product: "AR", pipeline_available: false }
              as: SupplyPlanner
              captures: { e_bulk: $.data.recommended_mode }
            - call: "POST /gas-supply/supply-mode-evaluations"
              payload: { customer_id: "${c_fab}", site_label: "S-CYL", demand_avg_nm3h: 150, demand_peak_nm3h: 220, required_purity_percent: 99.9, required_product: "AR", pipeline_available: false }
              as: SupplyPlanner
              captures: { e_cyl: $.data.recommended_mode }
          assert:
            - "${e_bulk} == BULK_LIQUID"
            - "${e_cyl} == CYLINDER"

      - name: runout_null_until_two_readings
        claim_type: Correct Result
        grounds:
          - calculations.tank_burn_rate_and_runout
        distinguishing_aspect: "With exactly one reading, both burn rates and both runout projections are null (no interval exists yet); posture still evaluates from the level."
        test_recipe:
          setup:
            - "Tank T_1R capacity 50,000, reorder 20,000, safety 5,000."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
          trigger:
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 30000 }
              as: TelemetryGateway
              captures: { t1_bi: $.data.burn_rate_instant_lph, t1_bw: $.data.burn_rate_wma_lph }
          assert:
            - "burn_rate_instant_lph is null and burn_rate_wma_lph is null"
            - "projected_runout_instant_at is null and projected_runout_wma_at is null"
            - "current_level_liters == 30000 and status == NORMAL"

      - name: telemetry_trigger_suppressed_while_delivery_open
        claim_type: Input Set Filtering
        grounds:
          - calculations.delivery_auto_trigger
        distinguishing_aspect: "Three consecutive posture-edge events (enter REORDER_DUE, stay low, enter CRITICAL) create exactly ONE delivery while the first is still open — the trigger is edge-triggered and suppressed by an open delivery."
        test_recipe:
          setup:
            - "Tank T_SP capacity 50,000, reorder 20,000, safety 5,000; baseline reading 25,000."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_tank_std
            - *k_rd1
          trigger:
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T05:00:00Z", level_liters: 20000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T06:00:00Z", level_liters: 19500 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_std}/telemetry"
              payload: { measured_at: "2026-10-01T07:00:00Z", level_liters: 4000 }
              as: TelemetryGateway
              captures: { t_sp: $.data.status }
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_std}" }
              as: PipelineDispatcher
              captures: { d_sp: "$.data[0].id", d_sp_qty: "$.data[0].quantity_liters" }
          assert:
            - "final status == CRITICAL (4000 <= safety 5000)"
            - "GET deliveries for the tank returns exactly 1 row (REORDER_DUE entry created it; the CRITICAL edge was suppressed by the open delivery)"
            - "the single Delivery has triggered_by == TELEMETRY and quantity_liters == 30000 (sized at trigger time, 50000 - 20000)"

      - name: stop_sequence_urgency_then_created_at_tiebreak
        claim_type: Correct Result
        grounds:
          - calculations.stop_sequence_ranking
        distinguishing_aspect: "Selector determinism within one route_date: the tank with a concrete WMA runout ranks first; the two null-runout tanks fall behind, ordered by tank created_at — never by random id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 (route_date for all creations). Tank T_A gets two readings 30,000 -> 20,000 over 10h (wma burn 500 L/h, runout +30h); tanks T_B and T_C each get one reading 19,000 (null runout); T_B created before T_C."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_a: $.data.id }
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_b: $.data.id }
            - call: "POST /gas-supply/storage-tanks"
              payload: { customer_id: "${c_fab}", site_label: "FAB-1", product: "N2", capacity_liters: 50000, reorder_point_liters: 20000, safety_stock_liters: 5000, required_purity_percent: 99.9, max_impurity_ppm: 50 }
              as: PlantOperator
              captures: { t_c: $.data.id }
            - call: "POST /gas-supply/storage-tanks/${t_a}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 30000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_a}/telemetry"
              payload: { measured_at: "2026-10-01T10:00:00Z", level_liters: 20000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_b}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 19000 }
              as: TelemetryGateway
            - call: "POST /gas-supply/storage-tanks/${t_c}/telemetry"
              payload: { measured_at: "2026-10-01T00:00:00Z", level_liters: 19000 }
              as: TelemetryGateway
          trigger:
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_a}" }
              as: PipelineDispatcher
              captures: { da_seq: "$.data[0].stop_sequence", da_route: "$.data[0].route_code" }
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_b}" }
              as: PipelineDispatcher
              captures: { db_seq: "$.data[0].stop_sequence" }
            - call: "GET /gas-supply/deliveries"
              payload: { tank_id: "${t_c}" }
              as: PipelineDispatcher
              captures: { dc_seq: "$.data[0].stop_sequence" }
          assert:
            - "all three deliveries share route_code \"RT-2026-09-01\" (logical clock date at creation)"
            - "Delivery on T_A: stop_sequence == 1 (earliest concrete WMA runout)"
            - "Delivery on T_B: stop_sequence == 2 and on T_C: stop_sequence == 3 (null runouts last, tie broken by tank created_at ASC)"

      - name: capital_recovery_zero_without_plant
        claim_type: Correct Result
        grounds:
          - calculations.settlement_invoice
          - entities.SettlementStatement.fields.capital_recovery_cents
        distinguishing_aspect: "The conditional capital-recovery branch evaluates to 0 when the ONSITE_PLANT contract has no non-DECOMMISSIONED plant yet, changing total_due_cents by exactly the 1,000,000-cent recovery term."
        test_recipe:
          setup:
            - "K_FAB ACTIVE; NO plant created."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2027-12", variant: "FINAL", metered_volume_nm3: 1500000, power_index_actual: 0.10 }
              as: BillingSpecialist
              captures: { s_np_cap: $.data.capital_recovery_cents, s_np_tot: $.data.total_due_cents }
          assert:
            - "SettlementStatement.capital_recovery_cents == 0 (plant branch not taken)"
            - "SettlementStatement.total_due_cents == 24527600 (24000000 + 12600 + 515000 + 0)"

      - name: makeup_grant_clipped_by_cap
        claim_type: Constants Applied
        grounds:
          - calculations.makeup_credit_ledger
        distinguishing_aspect: "With makeup_credit_cap_pct 0.01 the cap is 2,880,000 cents, so a raw 3,600,000-cent shortfall grant is clipped to exactly 2,880,000 — the overflow is discarded, never banked."
        test_recipe:
          setup:
            - "K_CAP: like K_FAB but makeup_credit_cap_pct 0.01, ACTIVE, no plant."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - call: "POST /gas-supply/supply-contracts"
              payload: { customer_id: "${c_fab}", evaluation_id: "${e_fab}", term_months: 120, start_date: "2026-10-01", min_monthly_volume_nm3: 2000000, unit_price_cents_per_nm3: 12, monthly_facility_fee_cents: 500000, facility_fee_escalation_pct_annual: 0.03, base_power_index: 0.08, power_kwh_per_nm3: 0.42, makeup_credit_cap_pct: 0.01 }
              as: SupplyPlanner
              captures: { k_cap: $.data.id }
            - call: "POST /gas-supply/supply-contracts/${k_cap}/activate"
              payload: {}
              as: SupplyPlanner
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_cap}/settlements"
              payload: { period_month: "2027-12", variant: "FINAL", metered_volume_nm3: 1500000, power_index_actual: 0.10 }
              as: BillingSpecialist
              captures: { s_cap_grant: $.data.makeup_credit_granted_cents }
            - call: "GET /gas-supply/supply-contracts/${k_cap}"
              payload: {}
              as: BillingSpecialist
              captures: { k_cap_bal: $.data.makeup_credit_balance_cents }
          assert:
            - "SettlementStatement.makeup_credit_granted_cents == 2880000 (clipped from raw 3600000 by cap 0.01 * 12 * 2000000 * 12)"
            - "SupplyContract.${k_cap}.makeup_credit_balance_cents == 2880000"

      - name: provisional_with_metered_fields_rejected
        claim_type: Conditional validation
        grounds:
          - validations[priority=9]
          - entities.SettlementStatement.fields.metered_volume_nm3
        distinguishing_aspect: "The required/forbidden field sets flip with the variant flag: sending metered_volume_nm3 on a PROVISIONAL settlement is 400 ERR_VALIDATION, and omitting projected_volume_nm3 is equally invalid."
        test_recipe:
          setup:
            - "K_FAB ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_cust_fab
            - *k_eval_fab
            - *k_accept_fab
            - *k_contract_fab
            - *k_activate_fab
          trigger:
            - call: "POST /gas-supply/supply-contracts/${k_fab}/settlements"
              payload: { period_month: "2027-12", variant: "PROVISIONAL", metered_volume_nm3: 1500000, power_index_actual: 0.10 }
              as: BillingSpecialist
              captures: { err_pv2: $.data.error_id }
          assert:
            - "the response status is 400 and ${err_pv2} == ERR_VALIDATION"
            - "GET settlements for ${k_fab} returns 0 rows (nothing persisted)"

  # ===========================================================================
  - section: validations
    instances:

      - name: activate_min_volume_exact_floor_allowed
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors[ERR_MIN_VOLUME_BELOW_FLOOR]
        distinguishing_aspect: "The ONSITE floor is inclusive: min exactly 2,000,000 activates, while 1,999,999 is rejected 422 ERR_MIN_VOLUME_BELOW_FLOOR."
        test_recipe:
          setup:
            - "Customer Fabrikam; E1 (FAB-1) accepted with K_OK at min 2,000,000; E2 (FAB-2) accepted with K_LOW at min 1,999,999. Both contracts DRAFT."
          setup_api_calls:
