              captures: { appeal_id: "$.data.id" }
          trigger:
            - call: "POST /ad-policy/appeals/${appeal_id}/decision"
              payload: { outcome: "DENIED", note: "The issuing reviewer trying to close their own appeal" }
              as: PolicyReviewer
              as_user_id: "${rev1}"
              captures: { e_sod: "$.data.error_id" }
            - call: "GET /ad-policy/appeals/${appeal_id}"
