  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_mark_funded
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - state_machines.Contract.PENDING_FUNDING_to_FUNDED
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_fiscal (priority 12): a DRAFT
          contract that is ALSO underfunded, marked funded, returns ERR_INVALID_STATE (the
          state check at priority 6 wins over the funding-shortfall check at priority 12).
        test_recipe:
          setup:
            - "AT_NEED contract still in DRAFT (not submitted) and with zero deposits (underfunded)."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /gpl-items"
              payload: { funeral_home_id: "${home_id}", code: "SVC-BASIC", name: "Basic services", category: "SERVICE", taxable: false, non_declinable: true, preneed_trustable: true, unit_price_cents: 100000 }
              as: Admin
              captures: { svc_item_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "AT_NEED_DIRECT" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id, c_v0: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/mark-funded"
              payload: { expected_contract_version: "${c_v0}" }
              as: TrustOfficer
              as_user_id: "to-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state precondition at priority 6 wins over ERR_FUNDING_SHORTFALL at priority 12)"
            - "Contract.${contract_id}.status == DRAFT (unchanged)"

      - name: disclosure_safety_beats_referential_on_issue_gfs
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - state_machines.Case.DISCLOSED_to_ARRANGED
        distinguishing_aspect: |
          Error-category pair business_safety (priority 7, disclosure gate) vs
          business_constraint empty-statement (priority 11): a Case that has NOT acknowledged
          disclosure AND has zero SELECTED lines, issuing GFS, returns ERR_DISCLOSURE_REQUIRED
          — the safety check at priority 7 fires before the empty-statement check at priority 11.
        test_recipe:
          setup:
            - "AT_NEED Case at INTAKE (disclosure not acknowledged), no statement lines, contract created via... — but contract create needs no disclosure; here we keep INTAKE."
          setup_api_calls:
            - call: "POST /funeral-homes"
              payload: { name: "Rose Hill", sales_tax_pct: 0.08, state_trust_pct: 0.90 }
              as: Admin
              captures: { home_id: $.data.id }
            - call: "POST /cases"
              payload: { funeral_home_id: "${home_id}", decedent_name: "Jane Doe", case_mode: "AT_NEED", date_of_death: "2026-06-01T00:00:00.000Z" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISCLOSURE_REQUIRED (priority 7 safety beats priority 11 empty-statement)"
            - "Case.${case_id}.arrangement_status == INTAKE (unchanged)"

