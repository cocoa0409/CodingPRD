  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: income_ratio_exactly_100pct_fpl_is_income_eligible
        grounds:
          - calculations.income_eligibility
          - entities.Application.fields.eligibility_category
          - entities.Application.fields.income_ratio
        distinguishing_aspect: |
          At income exactly equal to the household FPL (3,116,000 for hh4), income_ratio == 1.0000 and
          the inclusive `<= 1.00` boundary classifies the application as INCOME (eligible), not OVER_INCOME.
        test_recipe:
          setup:
            - "Family hh4 income 3116000, categorical NONE, not homeless; DRAFT application child dob 2022-02-20 (54mo, in PRESCHOOL_4 band)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "D", household_size: 4, annual_income_cents: 3116000, categorical_eligibility: "NONE", homeless_status: false }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "De", child_last_name: "D", child_dob: "2022-02-20" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
              captures: { elig: "$.data.eligibility_category", ratio: "$.data.income_ratio" }
          assert:
            - "${ratio} == 1.0"
            - "${elig} == \"INCOME\""

      - name: run_selection_empty_eligible_pool_returns_error
        grounds:
          - validations[priority=16]
          - errors[ERR_NO_ELIGIBLE_APPLICANTS]
          - entities.AgeCohort.fields.selection_status
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint: running selection on a cohort
          whose eligible WAITLISTED pool is empty (zero candidates) returns ERR_NO_ELIGIBLE_APPLICANTS (422).
        test_recipe:
          setup:
            - "A PRESCHOOL_4 cohort with funded_slots 2 and NO waitlisted applications."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
          trigger:
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_NO_ELIGIBLE_APPLICANTS\""

