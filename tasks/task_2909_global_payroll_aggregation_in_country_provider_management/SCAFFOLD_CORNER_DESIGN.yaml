        claim_type: variant_divergence
        grounds:
          - calculations.gross_to_net_variance.variants
        excluded_because:
          difficulty_instance: variance_basis_headcount_normalized_masks_five_pct_absolute_move
          rationale: "That §1.8 instance is the divergence test: the identical run reads 0.00 and immaterial under HEADCOUNT_NORMALIZED and 5.00 and material under ABSOLUTE_TOTAL, and it asserts the selected basis plus the resulting CLEARED status."

