scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: dual_variant_per_seat_price_rounding_order
    grounds:
    - calculations.per_seat_price
    - calculations.demand_surge_bp
    - entities.RushAllocation.fields.discount_pct
    distinguishing_aspect: per_seat_price's two variants price the same allocation differently because round_per_step rounds the discounted base before the 1500 bp surge is applied (21840 cents) while round_once_at_end rounds the fused product once (21839 cents).
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. Empty database.
      - A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance with face_value_cents 19990 and total_seat_capacity 30.
      - A SCHEDULED RUSH_PREMIUM allocation with daily_quantity 11, discount_pct 0.05, refundable true and per_order_limit 3, released for epoch 2026-09-12 so quantity_released_today is 11.
      - One decoy purchase leaves quantity_sold_today at 1 while quantity_carried_forward is 0, so released_effective is 11 and released_off_fraction is 0.909, clearing the 0.90 surcharge-B threshold; active_order_count is 1, so the surcharge-A threshold is not cleared.
      setup_api_calls:
      - &id001
        call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-12T09:00:00Z'
        as: PlatformAdmin
      - &id002
        call: POST /markets
        payload:
          market_code: NYC
          city: New York
          handoff_model: MOBILE_PUSH
        as: PlatformAdmin
        captures:
          nyc_id: $.data.id
      - &id003
        call: POST /productions
        payload:
          title: Rounding Variant Play
          producer_org: Variant Partners
          refund_window_hours: 720
          exchange_fee_cents: 300
          exchange_allowed: true
        as: OpsManager
        captures:
          prod_id: $.data.id
          prod_v: $.data.version
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Variant Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 19990
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH_PREMIUM
          daily_quantity: 11
          discount_pct: 0.05
          release_time_local: 09:00
          refundable: true
          per_order_limit: 3
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: dual_buyer@x.com
          display_name: Dual Buyer
          market_code: NYC
        as: Anonymous
        captures:
          buyer_id: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          qp_id: $.data.id
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:05:00Z'
        as: PlatformAdmin
      - call: POST /purchases
        payload:
          performance_id: ${perf_id}
          allocation_id: ${alloc_id}
          quantity: 1
          idempotency_key: decoy-1
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          decoy_id: $.data.id
          pur_v: $.data.version
      - call: POST /purchases/${decoy_id}/settlements
        payload:
          expected_purchase_version: ${pur_v}
        as: FinancialOps
        captures:
          pur_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${buyer_id}
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:10:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /purchases
        payload:
          performance_id: ${perf_id}
          allocation_id: ${alloc_id}
          quantity: 1
          idempotency_key: dual-price-2
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          pur_id: $.data.id
          pur_v: $.data.version
      assert:
      - TicketPurchase.${pur_id}.surge_multiplier_bp == 1500
      - TicketPurchase.${pur_id}.unit_price_cents == 21840
      - the round_once_at_end variant of per_seat_price over the same allocation returns 21839, so the variants differ by exactly 1 cent
      - TicketPurchase.${pur_id}.subtotal_cents == 21840
      - TicketPurchase.${pur_id}.payment_status == PENDING and logistics_status == AWAITING_HANDOFF
  - name: dual_variant_refund_amount_unit_granularity
    grounds:
    - calculations.refund_amount
    - entities.Production.fields.refund_window_hours
    - state_machines.RefundRequest.REQUESTED_to_PROCESSING
    distinguishing_aspect: refund_amount's per_purchase and per_ticket variants both price the same four-ticket purchase inside the production's refund window, but per_purchase rounds the whole subtotal once (35190 cents) while per_ticket rounds each ticket's share and lets the 2-cent remainder land on one ticket, giving 21995 cents.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with refund_window_hours 720 and an ONSALE performance starting 2026-10-05.
      - A SCHEDULED RUSH_PREMIUM allocation with daily_quantity 11, discount_pct 0.15 and per_order_limit 4, released for epoch 2026-09-12.
      - One settled four-ticket purchase whose subtotal_cents is 35190 and whose payment_status is SETTLED, so a refund may be opened against it.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Variant Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 10000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH_PREMIUM
          daily_quantity: 11
          discount_pct: 0.15
          release_time_local: 09:00
          refundable: true
          per_order_limit: 4
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: refund_variant_buyer@x.com
          display_name: Refund Buyer
          market_code: NYC
        as: Anonymous
        captures:
          buyer_id: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${buyer_id}
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:05:00Z'
        as: PlatformAdmin
      - call: POST /purchases
        payload:
          performance_id: ${perf_id}
          allocation_id: ${alloc_id}
          quantity: 4
          idempotency_key: refund-variant-1
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          pur_id: $.data.id
          pur_v: $.data.version
      - call: POST /purchases/${pur_id}/settlements
        payload:
          expected_purchase_version: ${pur_v}
        as: FinancialOps
        captures:
          pur_v: $.data.version
      trigger:
      - call: POST /purchases/${pur_id}/refund-requests
        payload:
          reason_code: PATRON_REQUEST
          expected_purchase_version: ${pur_v}
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          refund_id: $.data.id
          refund_v: $.data.version
      assert:
      - TicketPurchase.${pur_id}.subtotal_cents == 35190
      - RefundRequest.${refund_id}.refunded_amount_cents == 35190
      - the per_ticket variant of refund_amount over the same purchase returns 21995, so the variants differ by exactly 13195 cents
      - RefundRequest.${refund_id}.status == REQUESTED and RefundRequest.${refund_id}.approved_by is null
      - TicketPurchase.${pur_id}.payment_status == SETTLED, unchanged by opening the request
- rule_id: combinatorial_formula
  instances:
  - name: combinatorial_release_cap_nested_min_over_three_operands
    grounds:
    - calculations.rush_daily_release_cap
    - entities.RushAllocation.fields.daily_quantity
    - validations[priority=15]
    distinguishing_aspect: rush_daily_release_cap is a nested min over requested quantity, carry-forward remainder and the market share cap; with daily_quantity 8, quantity_carried_forward 0 and a performance of 7 seats the market term floor(4000 * 7 / 10000) == 2 is the binding operand, so the release is 2 rather than 8.
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance with total_seat_capacity 7.
      - A SCHEDULED RUSH allocation with daily_quantity 8, discount_pct 0.5, refundable true and per_order_limit 2; nothing has been released or sold yet, so quantity_carried_forward is 0.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Waterfall Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 19990
          total_seat_capacity: 7
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 8
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 2
        as: AllocationsCoordinator
        captures:
          rush_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${rush_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      trigger:
      - call: POST /allocations/${rush_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          rush_v: $.data.version
          alloc_v: $.data.version
      assert:
      - RushAllocation.${rush_id}.daily_release_cap == 2
      - RushAllocation.${rush_id}.quantity_released_today == 2
      - the market term floor(4000 * 7 / 10000) == 2 is the binding operand, so neither daily_quantity 8 nor the carry-forward term 8 is returned
      - RushAllocation.${rush_id}.status == RELEASED
      - RushAllocation.${rush_id}.version == ${rush_v}
  - name: combinatorial_line_subtotal_rounds_once_after_quantity_extension
    grounds:
    - calculations.purchase_line_subtotal
    - calculations.per_seat_price
    - validations[priority=16]
    distinguishing_aspect: "purchase_line_subtotal is a two-step cascade whose rounding order is pinned \u2014 the rounded unit price 8385 is extended to quantity 4 and the 1000 bp group discount is applied to the 33540 extension before a single round_half_up to 30186; discounting the unit first and then extending gives 30188."
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with refund_window_hours 720, and an ONSALE performance with face_value_cents 14582 and total_seat_capacity 30.
      - A SCHEDULED RUSH allocation with daily_quantity 11, discount_pct 0.5, refundable true and per_order_limit 4, released for epoch 2026-09-12.
      - quantity_sold_today is 0 and quantity_carried_forward is 0, so released_off_fraction is 1.00 and the surcharge-B term is 1500 bp; active_order_count is below 12 so the surcharge-A term is 0, and fill_fraction is 0, giving surge_multiplier_bp 1500.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Subtotal Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 14582
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: RUSH
          daily_quantity: 11
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          per_order_limit: 4
        as: AllocationsCoordinator
        captures:
          alloc_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${alloc_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: subtotal_buyer@x.com
          display_name: Subtotal Buyer
          market_code: NYC
        as: Anonymous
        captures:
          buyer_id: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/queue-positions
        payload:
          allocation_id: ${alloc_id}
        as: Patron
        as_user_id: ${buyer_id}
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:05:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /purchases
        payload:
          performance_id: ${perf_id}
          allocation_id: ${alloc_id}
          quantity: 4
          idempotency_key: subtotal-1
        as: Patron
        as_user_id: ${buyer_id}
        captures:
          pur_id: $.data.id
          pur_v: $.data.version
      assert:
      - TicketPurchase.${pur_id}.unit_price_cents == 8385
      - TicketPurchase.${pur_id}.subtotal_cents == 30186
      - the discount_before_quantity variant over the same order gives 30188, so the pinned rounding order is observable as a 2 cent difference
      - the group discount is 1000 bp because quantity 4 reaches GROUP_MIN_QUANTITY 4 exactly
      - TicketPurchase.${pur_id}.payment_status == PENDING
- rule_id: non_linear_state_machine
  instances:
  - name: non_linear_draw_waitlist_promotion_cycle_on_draw_entry
    grounds:
    - state_machines.DrawEntry.WINNER_to_FORFEITED
    - state_machines.DrawEntry.WAITLISTED_to_WINNER
    - calculations.winner_selection
    - entities.Patron.fields.draw_violation_count
    distinguishing_aspect: 'The DrawEntry machine is cyclic rather than a pipeline: a WAITLISTED entry is promoted to WINNER by a win-time forfeiture on the same allocation, so the same row returns to a state it already passed through and the patron''s violation count is drawn back down by the promotion.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production and an ONSALE performance starting 2026-10-05.
      - A SCHEDULED DRAW allocation with daily_quantity 2, discount_pct 0.5, claim_window_minutes 30, winner_basis_points 10000, waitlist_multiplier 2 and per_order_limit 1, released for epoch 2026-09-12 so daily_release_cap is 2.
      - 'Three ACTIVE patrons each hold one ENTERED entry: w_one entered first, w_two second, w_wait third, so the draw order is w_one, w_two, w_wait.'
      - 'The draw has been executed at 09:05: w_one and w_two are WINNER with claim_deadline_at 09:35, and w_wait is WAITLISTED.'
      - The logical clock has advanced to 09:45, past both winners' claim deadlines, and neither winner has claimed.
      setup_api_calls:
      - *id001
      - *id002
      - *id003
      - call: POST /productions/${prod_id}/status-transitions
        payload:
          to_status: ACTIVE
          expected_production_version: ${prod_v}
        as: OpsManager
        captures:
          prod_v: $.data.version
      - call: POST /performances
        payload:
          production_id: ${prod_id}
          market_code: NYC
          venue_name: Draw Cycle Theatre
          starts_at: '2026-10-05T19:00:00Z'
          face_value_cents: 12000
          total_seat_capacity: 30
        as: OpsManager
        captures:
          perf_id: $.data.id
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/status-transitions
        payload:
          to_status: ONSALE
          expected_performance_version: ${perf_v}
        as: OpsManager
        captures:
          perf_v: $.data.version
      - call: POST /performances/${perf_id}/allocations
        payload:
          ticket_type: DRAW
          daily_quantity: 2
          discount_pct: 0.5
          release_time_local: 09:00
          refundable: true
          claim_window_minutes: 30
          winner_basis_points: 10000
          waitlist_multiplier: 2
          per_order_limit: 1
        as: AllocationsCoordinator
        captures:
          draw_id: $.data.id
          alloc_v: $.data.version
      - call: POST /allocations/${draw_id}/scheduling
        payload:
          expected_allocation_version: ${alloc_v}
        as: AllocationsCoordinator
        captures:
          alloc_v: $.data.version
      - call: POST /allocations/${draw_id}/releases/2026-09-12
        payload:
          expected_production_version: ${prod_v}
          expected_performance_version: ${perf_v}
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          alloc_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: draw_one@x.com
          display_name: Draw One
          market_code: NYC
        as: Anonymous
        captures:
          p1_id: $.data.id
          patron_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: draw_two@x.com
          display_name: Draw Two
          market_code: NYC
        as: Anonymous
        captures:
          p2_id: $.data.id
          patron_v: $.data.version
      - call: POST /patrons/registrations
        payload:
          email: draw_wait@x.com
          display_name: Draw Wait
          market_code: NYC
        as: Anonymous
        captures:
          p3_id: $.data.id
          patron_v: $.data.version
      - call: POST /performances/${perf_id}/draw-entries
        payload:
          allocation_id: ${draw_id}
          declaration_text: I would like to attend
        as: Patron
        as_user_id: ${p1_id}
        captures:
          e1_id: $.data.id
          entry_v: $.data.version
      - call: POST /performances/${perf_id}/draw-entries
        payload:
          allocation_id: ${draw_id}
          declaration_text: I would like to attend
        as: Patron
        as_user_id: ${p2_id}
        captures:
          e2_id: $.data.id
          entry_v: $.data.version
      - call: POST /performances/${perf_id}/draw-entries
        payload:
          allocation_id: ${draw_id}
          declaration_text: I would like to attend
        as: Patron
        as_user_id: ${p3_id}
        captures:
          e3_id: $.data.id
          entry_v: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-12T09:05:00Z'
        as: PlatformAdmin
      - call: POST /allocations/${draw_id}/draw-executions
        payload:
          expected_allocation_version: ${alloc_v}
        as: OpsManager
        captures:
          wc: $.data.winner_count
          wl: $.data.waitlisted_count
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-12T09:45:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /ops-runs
        payload:
          as_of_iso8601: '2026-09-12T09:45:00Z'
        as: PlatformAdmin
        captures:
          forf: $.data.forfeited_count
          promo: $.data.waitlisted_promoted_count
      assert:
      - DrawEntry.${e1_id}.status == FORFEITED
      - DrawEntry.${e2_id}.status == FORFEITED
      - DrawEntry.${e3_id}.status == WINNER
      - Patron.${p1_id}.draw_violation_count == 1.0 and Patron.${p2_id}.draw_violation_count == 1.0
      - Patron.${p3_id}.draw_violation_count == 0.0
      - the promotion moved ${e3_id} back into WINNER, a state the allocation had already handed to two earlier entries, so the machine is cyclic rather than a forward pipeline
      - DrawEntry.${e3_id}.claim_deadline_at == 2026-09-12T10:15:00Z
      - the ops run reported ${forf} == 2 forfeits and ${promo} == 1 promotion
  - name: non_linear_ticket_purchase_parallel_state_dimensions
    grounds:
    - state_machines.TicketPurchase.PENDING_to_AUTHORIZED
    - state_machines.TicketPurchase.AWAITING_HANDOFF_to_DELIVERED
    - state_machines.TicketPurchase.SETTLED_to_REFUNDED
    - calculations.refund_amount
    distinguishing_aspect: 'TicketPurchase carries three state dimensions that advance independently: settling moves payment_status to SETTLED while logistics_status stays AWAITING_HANDOFF, delivering moves logistics_status to DELIVERED while payment_status stays SETTLED, and settling the refund moves payment_status to REFUNDED while logistics_status stays DELIVERED.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-12T09:00:00Z. A MOBILE_PUSH market, an ACTIVE production with refund_window_hours 720, and an ONSALE performance starting 2026-10-05.
