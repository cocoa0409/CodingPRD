  - section: endpoints
    instances:
      - name: equipment_list_filters_on_tool_type_and_state_together
        claim_type: filtered_list
        grounds:
          - endpoints[GET /fab/equipment]
          - state_machines.Equipment.IDLE_to_PM
        distinguishing_aspect: "The two optional filters are ANDed, not ORed: with LITHO-1 IDLE, LITHO-2 in PM and ETCH-1 IDLE, tool_type=LITHO combined with state=IDLE returns exactly one row (LITHO-1), while either filter alone would return two."
        test_recipe:
          setup:
            - "Three tools: LITHO-1 (LITHO, IDLE), LITHO-2 (LITHO, driven to PM by pm-start) and ETCH-1 (ETCH, IDLE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq1: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-2", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq2: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "ETCH-1", tool_type: "ETCH", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq3: $.data.id }
            - call: "POST /fab/equipment/${eq2}/pm-start"
              payload: { pm_reason: "Scheduled 168-hour PM" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { st2: $.data.state }
          trigger:
            - call: "GET /fab/equipment?tool_type=LITHO&state=IDLE"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { n: $.meta.total_count, first_id: "$.data[0].id" }
          assert:
            - "${st2} == PM"
            - "HTTP status == 200"
            - "${n} == 1"
            - "${first_id} == ${eq1}"
            - "GET /fab/equipment?tool_type=LITHO returns meta.total_count == 2"
            - "GET /fab/equipment?state=IDLE returns meta.total_count == 2"

      - name: lot_list_paginates_and_rejects_a_limit_above_one_hundred
        claim_type: pagination
        grounds:
          - endpoints[GET /fab/lots]
          - validations[priority=3]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "limit is bounded at 100 inclusive, so limit=100 is honoured while limit=101 is a 400 ERR_VALIDATION rather than a silent clamp; meta.total_count keeps reporting the full 3 rows regardless of the page window."
        test_recipe:
          setup:
            - "Flow FLOW-A (LOGIC_N5) RELEASED with one step seq 10 LITHO 2.0h; PLAN-A COMMITTED for 30 starts."
            - "Three PLANNED lots LOT-001, LOT-002 and LOT-003 (3 wafers each) against PLAN-A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/recipes"
              payload: { recipe_code: "LITHO-200", tool_type: "LITHO", target_value: 50.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { r_litho: $.data.id }
            - call: "POST /fab/process-flows"
              payload: { flow_code: "FLOW-A", product_family: "LOGIC_N5" }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/wafer-start-plans"
              payload: { flow_id: "${flow_a}", product_family: "LOGIC_N5", week_start_date: "2026-08-03T00:00:00Z", planned_wafer_starts: 30, capacity_budget_hours: 200.0, cycle_time_target_days: 30.0 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { plan_a: $.data.id }
            - call: "POST /fab/wafer-start-plans/${plan_a}/commit"
              payload: {}
              as: FabPlanner
              as_user_id: "u_fp_1"
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-001", wafer_count: 3 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot1: $.data.id }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-002", wafer_count: 3 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot2: $.data.id }
            - call: "POST /fab/lots"
              payload: { plan_id: "${plan_a}", flow_id: "${flow_a}", lot_number: "LOT-003", wafer_count: 3 }
              as: FabPlanner
              as_user_id: "u_fp_1"
              captures: { lot3: $.data.id }
            - call: "GET /fab/lots?plan_id=${plan_a}&limit=2&offset=1"
