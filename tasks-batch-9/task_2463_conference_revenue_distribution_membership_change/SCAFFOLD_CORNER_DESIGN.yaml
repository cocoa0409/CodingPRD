            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_conf_read
            - *c_res12
            - *c_p26
            - *c_p26_open
            - *c_p26_cb
            - *c_p26_read
            - *c_r26
            - *c_ar26
            - &c_ar26_issue
              call: "POST /audit-reports/${ar26_id}/issue"
              payload: {}
              as: Auditor
              as_user_id: "u_aud_1"
            - &c_r26_post
              call: "POST /distribution-runs/${r26_id}/post"
