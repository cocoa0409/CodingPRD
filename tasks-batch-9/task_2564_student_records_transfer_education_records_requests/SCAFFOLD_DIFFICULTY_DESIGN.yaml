# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2564 — Student Records Transfer & Education Records Requests
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. The logical clock starts at
# 2026-08-01T00:00:00Z in every chain; any instance that needs another instant sets it with
# POST /records-office/_clock/set_current_utc. Every numeric assert below was computed by
# executing the referenced calculations[].formula against its constants.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: discipline_inclusion_responding_vs_requesting_state
        grounds:
          - calculations.discipline_inclusion_set
          - entities.StateRecordsRule.fields.discipline_inclusion_mode
          - entities.StateRecordsRule.fields.include_pending_investigations
          - entities.RecordsRequest.fields.included_incident_count
          - entities.RecordsRequest.fields.receiving_state_inclusion_count
          - entities.DisciplineIncident.fields.transfer_inclusion_state
          - state_machines.RecordsRequest.ASSEMBLING_to_READY_FOR_RELEASE
        distinguishing_aspect: |
          The two variants run over the IDENTICAL five DisciplineIncident rows but read different
          StateRecordsRule rows — the responding district's CA rule (SUSPENSIONS_AND_EXPULSIONS,
          include_pending_investigations false) governs and yields included_incident_count 1, while
          the requesting district's TX rule (ALL_INCIDENTS, include_pending_investigations true) is
          advisory and yields receiving_state_inclusion_count 4; this instance's subject domain is
          discipline transfer on DisciplineIncident, not retention on RetentionSchedule.
        test_recipe:
          setup:
            - "StateRecordsRule rows exist for CA (governing: SUSPENSIONS_AND_EXPULSIONS, discipline_min_days_removed 10, include_pending_investigations false) and TX (advisory: ALL_INCIDENTS, include_pending_investigations true)."
            - "District SEND01 is in CA and responds; District RECV01 is in TX and requests."
            - "One student (has_iep false) in SEND01 whose three required components are all CERTIFIED, so the CumulativeFile is COMPLETE."
            - "Five DisciplineIncident rows: SUSPENSION 12 days SUSTAINED, SUSPENSION 3 days SUSTAINED, EXPULSION 30 days PENDING_INVESTIGATION, DETENTION 0 days SUSTAINED, SUSPENSION 20 days DISMISSED."
            - "One RecordsRequest in ASSEMBLING with includes_special_education false."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/state-rules"
              payload: { state_code: "TX", transfer_response_days: 30, discipline_inclusion_mode: "ALL_INCIDENTS", discipline_min_days_removed: 10, include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 45, destruction_min_age_years: 7, directory_optout_grace_days: 10, notification_wait_days: 3 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Receiving Unified", district_code: "RECV01", state_code: "TX" }
              as: SystemAdmin
              captures: { recv_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Ada", last_name: "Nguyen", dob: "2012-03-04", grade_level: 8, has_iep: false, guardian_user_id: "guardian-ada" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "GET /records-office/cumulative-files/${file_id}/components"
              payload: {}
              as: RecordsOfficer
              captures: { comp_academic_id: "$.data[0].id", comp_health_id: "$.data[1].id", comp_discipline_id: "$.data[2].id" }
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_academic_id}"
              payload: { status: "COLLECTED", page_count: 120, redacted_page_count: 0 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_academic_id}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_health_id}"
              payload: { status: "COLLECTED", page_count: 34, redacted_page_count: 4 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_health_id}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "COLLECTED", page_count: 18, redacted_page_count: 2 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "CERTIFIED" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-03-02", action_type: "SUSPENSION", days_removed: 12, incident_status: "SUSTAINED", adjudicated_by_court: false, description: "Long suspension, sustained" }
              as: RecordsClerk
              captures: { inc_susp12_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-03-09", action_type: "SUSPENSION", days_removed: 3, incident_status: "SUSTAINED", adjudicated_by_court: false, description: "Short suspension, sustained" }
              as: RecordsClerk
              captures: { inc_susp3_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-04-06", action_type: "EXPULSION", days_removed: 30, incident_status: "PENDING_INVESTIGATION", adjudicated_by_court: false, description: "Expulsion under investigation" }
              as: RecordsClerk
              captures: { inc_exp_pending_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-04-20", action_type: "DETENTION", days_removed: 0, incident_status: "SUSTAINED", adjudicated_by_court: false, description: "Lunch detention" }
              as: RecordsClerk
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-05-11", action_type: "SUSPENSION", days_removed: 20, incident_status: "DISMISSED", adjudicated_by_court: false, description: "Suspension later dismissed" }
              as: RecordsClerk
              captures: { inc_dismissed_id: "$.data.id" }
            - call: "POST /records-office/records-requests"
              payload: { student_id: "${student_id}", requesting_district_id: "${recv_district_id}", responding_district_id: "${send_district_id}", request_priority: "STANDARD", includes_special_education: false, sped_consent_on_file: false, authorization_reference: "ENR-2026-0001" }
              as: ReceivingRegistrar
              as_user_id: "${recv_district_id}"
              captures: { req_id: "$.data.id" }
            - call: "POST /records-office/records-requests/${req_id}/validate"
              payload: { authorization_verified: true }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "GET /records-office/cumulative-files/${file_id}"
              payload: {}
              as: RecordsOfficer
              captures: { file_version: "$.data.version" }
          trigger:
            - call: "POST /records-office/records-requests/${req_id}/mark-ready"
              payload: { expected_cumulative_file_version: "${file_version}" }
              as: RecordsOfficer
              as_user_id: "officer-1"
          assert:
            - "RecordsRequest.${req_id}.status == \"READY_FOR_RELEASE\""
            - "RecordsRequest.${req_id}.included_incident_count == 1"
            - "RecordsRequest.${req_id}.withheld_incident_count == 4"
            - "RecordsRequest.${req_id}.receiving_state_inclusion_count == 4"
            - "RecordsRequest.${req_id}.included_incident_count != RecordsRequest.${req_id}.receiving_state_inclusion_count"
            - "DisciplineIncident.${inc_susp12_id}.transfer_inclusion_state == \"INCLUDED\""
            - "DisciplineIncident.${inc_susp3_id}.transfer_inclusion_state == \"WITHHELD\""
            - "DisciplineIncident.${inc_exp_pending_id}.transfer_inclusion_state == \"WITHHELD\""
            - "DisciplineIncident.${inc_dismissed_id}.transfer_inclusion_state == \"WITHHELD\""
            - "RecordsRequest.${req_id}.packet_page_count == 166"
            - "RecordsRequest.${req_id}.packet_status == \"SNAPSHOT\""

      - name: retention_last_activity_vs_exit_anchor
        grounds:
          - calculations.retention_destruction_eligible_at
          - entities.RetentionSchedule.fields.destruction_eligible_at
          - entities.RetentionSchedule.fields.exit_anchored_eligible_at
          - entities.RetentionSchedule.fields.last_activity_at
          - entities.Student.fields.records_disposition_date
          - state_machines.Withdrawal.CLEARED_to_COMPLETED
        distinguishing_aspect: |
          On one RetentionSchedule the EXIT_ANCHORED variant freezes at 2031-08-14T00:00:00.000Z
          while the governing LAST_ACTIVITY_ANCHORED variant advances to 2031-09-10T00:00:00.000Z
          after a single directory disclosure, a 27-day divergence; the conserved subject here is
          record retention on RetentionSchedule, a different entity domain from the discipline
          transfer variant pair.
        test_recipe:
          setup:
            - "CA state rule with destruction_min_age_years 5 and directory_optout_grace_days 14."
            - "One student in the CA district, withdrawn with effective_date 2026-08-14, so a RetentionSchedule exists with exit_anchor_at 2026-08-14T00:00:00.000Z."
            - "No components collected, so no certified_at competes with the exit anchor."
            - "Clock advanced to 2026-09-10T00:00:00Z before the disclosure is logged."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Ben", last_name: "Ortiz", dob: "2011-05-20", grade_level: 9, has_iep: false, guardian_user_id: "guardian-ben" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/withdrawals"
              payload: { effective_date: "2026-08-14", destination_district_code: "OUTOFSTATE", withdrawal_reason: "MOVED" }
              as: RecordsClerk
              captures: { withdrawal_id: "$.data.id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /records-office/withdrawals/${withdrawal_id}/complete"
              payload: {}
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "GET /records-office/cumulative-files/${file_id}/retention-schedules"
              payload: {}
              as: ComplianceOfficer
              captures: { schedule_id: "$.data[0].id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /records-office/students/${student_id}/directory-disclosures"
              payload: { recipient_name: "Regional Yearbook Co", disclosed_categories: ["NAME", "HONORS"], legitimate_interest_note: "Yearbook listing" }
              as: RecordsClerk
          assert:
            - "RetentionSchedule.${schedule_id}.exit_anchor_at == \"2026-08-14T00:00:00.000Z\""
            - "RetentionSchedule.${schedule_id}.exit_anchored_eligible_at == \"2031-08-14T00:00:00.000Z\""
            - "RetentionSchedule.${schedule_id}.last_activity_at == \"2026-09-10T00:00:00.000Z\""
            - "RetentionSchedule.${schedule_id}.destruction_eligible_at == \"2031-09-10T00:00:00.000Z\""
            - "RetentionSchedule.${schedule_id}.destruction_eligible_at != RetentionSchedule.${schedule_id}.exit_anchored_eligible_at"
            - "Student.${student_id}.records_disposition_date == \"2031-09-10T00:00:00.000Z\""
            - "RetentionSchedule.${schedule_id}.status == \"ACTIVE\""

  - rule_id: combinatorial_formula
    instances:
      - name: records_request_due_at_expedited_cap_vs_sped_extension
        grounds:
          - calculations.records_request_due_at
          - calculations.records_request_due_at.constants.EXPEDITED_CAP_DAYS
          - calculations.records_request_due_at.constants.SPED_CONSENT_EXTENSION_DAYS
          - entities.RecordsRequest.fields.statutory_days_allowed
          - entities.RecordsRequest.fields.statutory_due_at
          - entities.StateRecordsRule.fields.transfer_response_days
        distinguishing_aspect: |
          Mode (a) — branch-and-nested-min on four inputs (request_priority, state
          transfer_response_days, includes_special_education, sped_requires_consent): two requests
          created in the same second against the same CA responding district get 5 versus 20
          statutory days, so the expedited branch is proven to CAP rather than EXTEND. This is a
          business-day date computation, not the per-component currency rounding of the fee
          instances.
        test_recipe:
          setup:
            - "CA rule: transfer_response_days 10, sped_requires_consent true. TX and NY rules exist so the two requesting districts can be created."
            - "SEND01 (CA) responds; RECV01 (TX) and RECV02 (NY) each file one request, satisfying the one-open-request-per-district-pair uniqueness rule."
            - "One student with has_iep true in SEND01."
            - "Clock moved to 2026-08-03T00:00:00Z (a Monday) so both received_at values are identical."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/state-rules"
              payload: { state_code: "TX", transfer_response_days: 30, discipline_inclusion_mode: "ALL_INCIDENTS", discipline_min_days_removed: 10, include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 45, destruction_min_age_years: 7, directory_optout_grace_days: 10, notification_wait_days: 3 }
              as: SystemAdmin
            - call: "POST /records-office/state-rules"
              payload: { state_code: "NY", transfer_response_days: 45, discipline_inclusion_mode: "EXPULSIONS_ONLY", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 6, directory_optout_grace_days: 30, notification_wait_days: 10 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Receiving Unified", district_code: "RECV01", state_code: "TX" }
              as: SystemAdmin
              captures: { recv_tx_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Harbor Central", district_code: "RECV02", state_code: "NY" }
              as: SystemAdmin
              captures: { recv_ny_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Cleo", last_name: "Barros", dob: "2010-11-02", grade_level: 10, has_iep: true, guardian_user_id: "guardian-cleo" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /records-office/records-requests"
              payload: { student_id: "${student_id}", requesting_district_id: "${recv_tx_district_id}", responding_district_id: "${send_district_id}", request_priority: "UNACCOMPANIED_YOUTH", includes_special_education: true, sped_consent_on_file: true, authorization_reference: "ENR-2026-0002" }
              as: ReceivingRegistrar
              as_user_id: "${recv_tx_district_id}"
              captures: { expedited_req_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/records-requests"
              payload: { student_id: "${student_id}", requesting_district_id: "${recv_ny_district_id}", responding_district_id: "${send_district_id}", request_priority: "STANDARD", includes_special_education: true, sped_consent_on_file: true, authorization_reference: "ENR-2026-0003" }
              as: ReceivingRegistrar
              as_user_id: "${recv_ny_district_id}"
              captures: { standard_req_id: "$.data.id" }
          assert:
            - "RecordsRequest.${expedited_req_id}.received_at == \"2026-08-03T00:00:00.000Z\""
            - "RecordsRequest.${expedited_req_id}.statutory_days_allowed == 5"
            - "RecordsRequest.${expedited_req_id}.statutory_due_at == \"2026-08-10T23:59:59.999Z\""
            - "RecordsRequest.${standard_req_id}.received_at == \"2026-08-03T00:00:00.000Z\""
            - "RecordsRequest.${standard_req_id}.statutory_days_allowed == 20"
            - "RecordsRequest.${standard_req_id}.statutory_due_at == \"2026-08-31T23:59:59.999Z\""
            - "RecordsRequest.${expedited_req_id}.is_overdue == false"
            - "RecordsRequest.${expedited_req_id}.status == \"RECEIVED\""

      - name: inspection_copy_fee_round_per_component
        grounds:
          - calculations.inspection_copy_fee_cents
          - calculations.inspection_copy_fee_cents.constants.PER_PAGE_CENTS
          - calculations.inspection_copy_fee_cents.constants.COPY_SURCHARGE_PCT
          - calculations.inspection_fee_assessment
          - entities.InspectionRequest.fields.base_copy_fee_cents
          - entities.InspectionRequest.fields.fee_outstanding_cents
          - entities.FileComponent.fields.redacted_page_count
        distinguishing_aspect: |
          Mode (b) — rounding-order sensitivity across four components: rounding twice per
          component and then summing yields base_copy_fee_cents 3378, whereas summing raw page
          charges and rounding once yields 3377, so a one-cent delta falsifies the wrong order.
          The subject is integer-cent currency over FileComponent page counts, not the business-day
          arithmetic of the due-date instance.
        test_recipe:
          setup:
            - "CA state rule and SEND01 (CA) exist; one student with has_iep true, so all four components (ACADEMIC, HEALTH, DISCIPLINE, SPECIAL_EDUCATION) are required."
            - "All four components moved to COLLECTED with (page_count, redacted_page_count) = (120,0), (34,4), (18,2), (260,10) → billable pages 120, 30, 16, 250."
            - "The parent requests copies of all four categories, so every component is in the priced set."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Dev", last_name: "Iyer", dob: "2013-01-09", grade_level: 7, has_iep: true, guardian_user_id: "guardian-dev" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "GET /records-office/students/${student_id}/cumulative-files"
              payload: {}
              as: RecordsOfficer
              captures: { file_id: "$.data[0].id" }
            - call: "GET /records-office/cumulative-files/${file_id}/components"
              payload: {}
              as: RecordsOfficer
              captures: { comp_academic_id: "$.data[0].id", comp_health_id: "$.data[1].id", comp_discipline_id: "$.data[2].id", comp_sped_id: "$.data[3].id" }
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_academic_id}"
              payload: { status: "COLLECTED", page_count: 120, redacted_page_count: 0 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_health_id}"
              payload: { status: "COLLECTED", page_count: 34, redacted_page_count: 4 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_discipline_id}"
              payload: { status: "COLLECTED", page_count: 18, redacted_page_count: 2 }
              as: RecordsClerk
            - call: "PATCH /records-office/cumulative-files/${file_id}/components/${comp_sped_id}"
              payload: { status: "COLLECTED", page_count: 260, redacted_page_count: 10 }
              as: RecordsClerk
          trigger:
            - call: "POST /records-office/students/${student_id}/inspection-requests"
              payload: { requested_categories: ["ACADEMIC", "HEALTH", "DISCIPLINE", "SPECIAL_EDUCATION"], copies_requested: true }
              as: Parent
              as_user_id: "guardian-dev"
              captures: { inspection_request_id: "$.data.id" }
          assert:
            - "InspectionRequest.${inspection_request_id}.base_copy_fee_cents == 3378"
            - "InspectionRequest.${inspection_request_id}.base_copy_fee_cents != 3377"
            - "InspectionRequest.${inspection_request_id}.certification_fee_cents == 500"
            - "InspectionRequest.${inspection_request_id}.fee_assessed_cents == 3878"
            - "InspectionRequest.${inspection_request_id}.fee_collected_cents == 0"
            - "InspectionRequest.${inspection_request_id}.fee_waived_cents == 0"
            - "InspectionRequest.${inspection_request_id}.fee_outstanding_cents == 3878"
            - "InspectionRequest.${inspection_request_id}.status == \"SUBMITTED\""

      - name: inspection_fee_tier_keyed_on_base_only
        grounds:
          - calculations.inspection_fee_assessment
          - calculations.inspection_fee_assessment.constants.CERT_TIER_B_FLOOR_CENTS
          - calculations.inspection_fee_assessment.constants.CERT_TIER_C_FLOOR_CENTS
          - calculations.inspection_copy_fee_cents
          - entities.InspectionRequest.fields.certification_fee_cents
          - entities.InspectionRequest.fields.fee_assessed_cents
        distinguishing_aspect: |
          Mode (c) — pinned evaluation order around a self-referential threshold: base 9800 sits
          just under CERT_TIER_C_FLOOR_CENTS, so certification is 500 and the total 10300 lands
          ABOVE that floor without ever being re-tiered; an implementation that re-evaluates the
          tier against fee_assessed_cents returns 11300. Unlike the rounding-order instance, only
          one component is priced here and the discriminator is the threshold input, not rounding.
        test_recipe:
          setup:
            - "CA state rule and SEND01 (CA) exist; one student with has_iep false."
