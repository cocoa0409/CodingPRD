            - call: "POST /fab/outside-vendors"
              payload: { name: "PX2", process: "PLATING", lead_time_days: 7, base_cost_cents_per_part: 350 }
              as: ShopManager
            - call: "POST /fab/machines"
              payload: { name: "LX2", station: "LASER", shift_minutes_per_day: 480 }
