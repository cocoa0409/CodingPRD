            - "LaborEncounter.${enc_id}.staffing_state == \"RATIO_COVERED\""
            - "LaborEncounter.${enc_id}.acuity_tier == \"TIER_II\""
            - "LaborEncounter.${enc_id}.required_coverage_units == 2.3"
            - "LaborEncounter.${enc_id}.assigned_coverage_units == 2.3"
            - "LaborEncounter.${enc_id}.one_to_one_required == false"
            - "CareAssignment.${assignment_id}.acuity_units_consumed == 2.3"
            - "ObstetricUnit.${unit_id}.staffing_posture == \"INDUCTION_FROZEN\""
            - "FetalMonitoringAssessment.${assessment_id}.escalation_status == \"NOT_REQUIRED\""

      - name: expired_credential_at_11_1_outranks_the_ineligible_one_to_one_role_slot_at_11_2
        claim_type: Priority Ordering
        grounds:
          - validations[priority=11.1]
          - validations[priority=11.2]
          - errors[ERR_STAFF_CREDENTIAL_EXPIRED]
          - errors[ERR_ROLE_SLOT_NOT_ELIGIBLE]
          - endpoints[POST /care-assignments]
          - endpoints[PATCH /staff-members/{staffId}]
          - entities.ShiftAssignment.fields.role_slot
        distinguishing_aspect: |
          11.1 and 11.2 are adjacent rungs inside the same business_safety block and both answer 422,
          so nothing in the HTTP envelope distinguishes them — only the error_id does. They are also
          the pair most likely to be implemented as one "validate the staffing side" routine whose
          internal order is incidental. The trigger drives the SAME request twice with only the staff
          member's credential date changed between the two attempts, which isolates the ordering:
          expired credential plus ineligible slot yields ERR_STAFF_CREDENTIAL_EXPIRED, and repairing
          only the credential exposes ERR_ROLE_SLOT_NOT_ELIGIBLE underneath. The encounter version is
          captured once and reused because a rejected write must not bump it.
        test_recipe:
          setup: |
            One unit with a single AVAILABLE LDR bed and one ANTEPARTUM encounter at version 1 (no bed
            attached, so nothing bumps it). One ACTIVE CHARGE shift — a slot that is NOT in the
            ONE_TO_ONE-eligible set {BEDSIDE, ONE_TO_ONE_FLOAT} — held by a staff member whose
            credential is retro-dated into the past after activation.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Rowan Perinatal Center LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Dana Alvarez RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { staff_rn: $.data.id }
            - call: POST /shift-assignments
              payload: { unit_id: "${unit_id}", staff_id: "${staff_rn}", role_slot: "CHARGE", shift_start_utc: "2026-08-01T05:00:00Z", shift_end_utc: "2026-08-01T15:00:00Z" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { shift_charge: $.data.id }
            - call: POST /shift-assignments/${shift_charge}/activate
              payload: {}
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-SLOT-1102", parity: 1, gestational_age_weeks: 39 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id, enc_v: $.data.version }
            - call: PATCH /staff-members/${staff_rn}
              payload: { credential_expires_at: "2026-07-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
          trigger:
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_id}", shift_assignment_id: "${shift_charge}", coverage_mode: "ONE_TO_ONE", expected_encounter_version: "${enc_v}" }
              as: ChargeNurse
              as_user_id: "charge-nurse-01"
              captures: { credential_err: $.data.error_id }
            - call: PATCH /staff-members/${staff_rn}
              payload: { credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /care-assignments
              payload: { encounter_id: "${enc_id}", shift_assignment_id: "${shift_charge}", coverage_mode: "ONE_TO_ONE", expected_encounter_version: "${enc_v}" }
              as: ChargeNurse
