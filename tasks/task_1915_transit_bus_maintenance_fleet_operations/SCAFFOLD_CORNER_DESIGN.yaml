            - { call: "POST /fleet/parts", payload: { sku: "P-NEW", description: "New valve", part_class: "CONSUMABLE", unit_cost_cents: 1100, reorder_point: 0, initial_on_hand: 5, warranty_eligible: false }, as: PartsClerk, captures: { pnew: $.data.id } }
            - { call: "POST /fleet/mechanics", payload: { name: "Lead", employee_ref: "Y18A" }, as: MaintenanceSupervisor, captures: { m1: $.data.id } }
            - { call: "POST /fleet/work-orders", payload: { bus_id: "${b}", wo_type: "CORRECTIVE", priority: "ROUTINE", planned_start_date: "2026-08-02", planned_end_date: "2026-08-03", estimated_labor_hours: 1, estimated_cost_cents: 2000, lead_mechanic_id: "${m1}", expected_bus_version: "${bv}" }, as: MaintenanceSupervisor, captures: { wo: $.data.id } }
