scaffold_corner_design:
  # =========================================================================
  # SECTION: entities
  # =========================================================================
  - section: entities
    instances:
      - name: child_creation_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Child, endpoints]
        distinguishing_aspect: "POST /children with all required fields returns 201 and echoes full_name, income_tier, and system id/version=1."
        test_recipe:
          setup: ["A dwelling exists to satisfy primary_dwelling_id."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/v1/children"
              payload: { full_name: "Pat Child", date_of_birth: "2022-03-01", guardian_name: "G Pat", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
          assert:
            - "HTTP 201; Child.${ch_id}.full_name == 'Pat Child' AND income_tier == LOW AND version == 1"

      - name: child_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Child, "errors[ERR_CHILD_NOT_FOUND]"]
        distinguishing_aspect: "GET /children/{id} for an unknown UUID returns ERR_CHILD_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/v1/children/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_CHILD_NOT_FOUND"

      - name: child_missing_required_income_tier_returns_validation
        claim_type: Required Fields
        grounds: [entities.Child.fields.income_tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required income_tier field on POST /children returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A dwelling exists."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/v1/children"
              payload: { full_name: "No Tier", date_of_birth: "2022-03-01", guardian_name: "G X", primary_dwelling_id: "${d_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_VALIDATION"

      - name: child_default_medicaid_enrolled_false
        claim_type: Defaults
        grounds: [entities.Child.fields.medicaid_enrolled]
        distinguishing_aspect: "Omitting medicaid_enrolled defaults it to false."
        test_recipe:
          setup: ["A dwelling exists."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/v1/children"
              payload: { full_name: "Def Child", date_of_birth: "2022-03-01", guardian_name: "G D", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
          assert:
            - "Child.${ch_id}.medicaid_enrolled == false"

      - name: dwelling_computed_pre_1978_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Dwelling.fields.pre_1978, entities.Dwelling.fields.year_built]
        distinguishing_aspect: "pre_1978 is derived from year_built < 1978 by the server; a 1950 dwelling is pre_1978 == true."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "1 Old St", year_built: 1950, owner_name: "Old LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
          assert:
            - "Dwelling.${d_id}.pre_1978 == true"

      - name: bloodleadtest_immutable_has_no_version
        claim_type: Immutability
        grounds: [entities.BloodLeadTest]
        distinguishing_aspect: "BloodLeadTest is common_fields:false — its response carries id and created_at and computed result_class but NO version field, and there is no update endpoint."
        test_recipe:
          setup: ["A child exists."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Kid", date_of_birth: "2022-03-01", guardian_name: "G K", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 48.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t_id: $.data.id }
          assert:
            - "BloodLeadTest.${t_id}.result_class == CLASS_I (48.0 >= 45); response has id and created_at but no version field"

      - name: child_invalid_enum_income_tier_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Child.fields.income_tier, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An income_tier outside {EXTREMELY_LOW,VERY_LOW,LOW,MODERATE} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["A dwelling exists."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/v1/children"
              payload: { full_name: "Bad Enum", date_of_birth: "2022-03-01", guardian_name: "G B", primary_dwelling_id: "${d_id}", income_tier: "RICH" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_VALIDATION"

  # =========================================================================
  # SECTION: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: case_initial_states_open_and_elevated
        claim_type: Initial State
        grounds: [entities.Case.fields.case_status, entities.Case.fields.medical_status]
        distinguishing_aspect: "A newly opened case starts case_status == OPEN and medical_status == ELEVATED with reference_basis == PROVISIONAL."
        test_recipe:
          setup: ["A child with a qualifying venous test of 22.0."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Ini Child", date_of_birth: "2022-03-01", guardian_name: "G I", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
          assert:
            - "Case.${case_id}.case_status == OPEN AND medical_status == ELEVATED AND reference_basis == PROVISIONAL AND priority_class == CLASS_II"

      - name: complete_already_completed_investigation_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.EnvironmentalInvestigation.SCHEDULED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing an investigation a second time (already COMPLETED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A completed investigation (1 hazard)."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Ce Child", date_of_birth: "2022-03-01", guardian_name: "G C", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "PAINT", location: "window", measurement_value: 120.0, severity: "HIGH" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: withdraw_already_withdrawn_case_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Case.OPEN_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing a case that is already WITHDRAWN (terminal) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A withdrawn case."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Wd Child", date_of_birth: "2022-03-01", guardian_name: "G W", primary_dwelling_id: "${d_id}", income_tier: "LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/cases/${case_id}/withdraw"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
          trigger:
            - call: "POST /api/v1/cases/${case_id}/withdraw"
              payload: {}
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: contractor_cycle_suspend_then_reinstate
        claim_type: cyclic
        grounds: [state_machines.Contractor.ACTIVE_to_SUSPENDED, state_machines.Contractor.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "Contractor certification cycles ACTIVE -> SUSPENDED -> ACTIVE via the certification endpoint."
        test_recipe:
          setup: ["A contractor activated with a future expiry."]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { business_name: "LeadAway Inc", rrp_certification_number: "RRP-77" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { con_id: $.data.id }
            - call: "POST /api/v1/contractors/${con_id}/certification"
              payload: { action: "ACTIVATE", expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /api/v1/contractors/${con_id}/certification"
              payload: { action: "SUSPEND" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /api/v1/contractors/${con_id}/certification"
              payload: { action: "REINSTATE" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "After SUSPEND: Contractor.${con_id}.certification_status == SUSPENDED"
            - "After REINSTATE: Contractor.${con_id}.certification_status == ACTIVE"

      - name: clearance_fail_regresses_to_in_remediation
        claim_type: cyclic
        grounds: [state_machines.HazardControlOrder.CLEARANCE_PENDING_to_IN_REMEDIATION]
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_clearance_pending_remediation_cycle
          rationale: "The clearance FAIL back edge is asserted directly within the order-cycle difficulty instance."

  # =========================================================================
  # SECTION: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: clearance_boundary_floor_exactly_at_limit_passes
        claim_type: Precision
        grounds: [calculations.clearance_evaluation, entities.ClearanceTest.fields.evaluated_result]
        distinguishing_aspect: "A floor dust-wipe of exactly 10.0 ug/ft2 (== DUST_FLOOR_LIMIT) PASSES because limits are inclusive maxima (<=)."
        test_recipe:
          setup: ["A 1-hazard order STARTED then request-clearance -> CLEARANCE_PENDING; a second inspector for clearance."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Bd Child", date_of_birth: "2022-03-01", guardian_name: "G B", primary_dwelling_id: "${d_id}", income_tier: "VERY_LOW" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Cade Clearer", certification_id_number: "RA-002" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp2_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "DUST", location: "floor", measurement_value: 60.0, severity: "MODERATE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /api/v1/hazard-control-orders"
              payload: { case_id: "${case_id}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { order_id: "$.data[0].id" }
            - call: "POST /api/v1/contractors"
              payload: { business_name: "LeadAway Inc", rrp_certification_number: "RRP-77" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { con_id: $.data.id }
            - call: "POST /api/v1/contractors/${con_id}/certification"
              payload: { action: "ACTIVATE", expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /api/v1/grant-funds"
              payload: { fund_name: "HUD LHC 2026", fiscal_year: 2026, total_budget_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { gf_id: $.data.id, gf_v: $.data.version }
            - call: "POST /api/v1/remediation-projects"
              payload: { order_id: "${order_id}", contractor_id: "${con_id}", grant_fund_id: "${gf_id}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { proj_id: $.data.id }
            - call: "POST /api/v1/remediation-projects/${proj_id}/approve"
              payload: { expected_grant_fund_version: "${gf_v}" }
              as: CaseManager
              as_user_id: "cm-1"
            - call: "POST /api/v1/remediation-projects/${proj_id}/start"
              payload: {}
              as: Contractor
              as_user_id: "${con_id}"
            - call: "POST /api/v1/hazard-control-orders/${order_id}/request-clearance"
              payload: {}
              as: Contractor
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /api/v1/clearance-tests"
              payload: { order_id: "${order_id}", floor_result_ug_ft2: 10.0, sill_result_ug_ft2: 100.0, trough_result_ug_ft2: 400.0 }
              as: Inspector
              as_user_id: "${insp2_id}"
              captures: { ct_id: $.data.id }
          assert:
            - "ClearanceTest.${ct_id}.evaluated_result == PASS (all three exactly at inclusive limits)"
            - "HazardControlOrder.${order_id}.status == CLEARED"

      - name: grant_subsidy_moderate_tier_multiplier
        claim_type: Constants Applied
        grounds: [calculations.grant_subsidy, entities.Case.fields.income_tier]
        distinguishing_aspect: "MODERATE tier multiplier 0.75 with 2 hazards gives estimated_cost_cents = round_half_up(250000*2*0.75) = 375000."
        test_recipe:
          setup: ["A 2-hazard ISSUED order for a MODERATE-income case; contractor ACTIVE; grant total 5000000."]
          setup_api_calls:
            - call: "POST /api/v1/dwellings"
              payload: { street_address: "12 Elm St", year_built: 1950, owner_name: "Acme LLC", jurisdiction: "COUNTY_A" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/v1/children"
              payload: { full_name: "Md Child", date_of_birth: "2022-03-01", guardian_name: "G M", primary_dwelling_id: "${d_id}", income_tier: "MODERATE" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/blood-lead-tests"
              payload: { child_id: "${ch_id}", bll_ug_dl: 22.0, specimen_type: "VENOUS", test_kind: "DIAGNOSTIC", collected_at: "2026-05-02T10:00:00Z" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { t1_id: $.data.id }
            - call: "POST /api/v1/cases"
              payload: { child_id: "${ch_id}", dwelling_id: "${d_id}", qualifying_test_id: "${t1_id}" }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { case_id: $.data.id }
            - call: "POST /api/v1/inspectors"
              payload: { full_name: "Ivy Inspector", certification_id_number: "RA-001" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { insp_id: $.data.id }
            - call: "POST /api/v1/investigations"
              payload: { case_id: "${case_id}", dwelling_id: "${d_id}", inspector_id: "${insp_id}", scheduled_start: "2026-05-05T09:00:00Z", scheduled_end: "2026-05-05T12:00:00Z" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { inv_id: $.data.id }
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "PAINT", location: "window", measurement_value: 120.0, severity: "HIGH" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/findings"
              payload: { hazard_type: "DUST", location: "floor", measurement_value: 80.0, severity: "MODERATE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /api/v1/investigations/${inv_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /api/v1/hazard-control-orders"
