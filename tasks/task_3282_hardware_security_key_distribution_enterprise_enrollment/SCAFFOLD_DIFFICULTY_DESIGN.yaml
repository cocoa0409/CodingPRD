      - call: POST /v1/organizations/${org9}/purchase-orders/${po9}/approve
        payload:
          expected_purchase_order_version: ${po9_v}
        as: SecurityAdmin
        as_user_id: seca1
      - call: POST /v1/organizations/${org9}/purchase-orders/${po9}/ship
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org9}/purchase-orders/${po9}/receive
        payload: {}
        as: LogisticsCoordinator
        as_user_id: logc1
      - call: POST /v1/organizations/${org9}/purchase-orders/${po9}/keys
