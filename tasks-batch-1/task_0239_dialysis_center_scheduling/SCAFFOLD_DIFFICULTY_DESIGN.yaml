  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: transport_fare_tiered_with_pinned_multiplier_order
        grounds:
          - calculations.transport_fare
          - entities.TransportTrip.fields.fare_cents
        distinguishing_aspect: "Mode (a): fare = round((800 + tiered_mileage)*shared_mult) + wheelchair + zone has ≥3 interacting inputs (miles tier, shared multiplier, two flat add-ons); for miles=12, cross_county=true, wheelchair=true, shared_ride=true the pinned order yields fare_cents=4588 (round happens BEFORE the flat add-ons)."
        test_recipe:
          setup:
            - "Clinic OPEN; a RESIDENT patient with an ACTIVE order and a BOOKED session; transport requested for that session."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "FareClinic", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "FM1", model: "Nipro", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "FC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "MON_AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "FP", full_name: "Fare Patient", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /transport-trips"
              payload: { session_id: "${sess}", direction: "INBOUND", miles: 12, cross_county: true, wheelchair: true, shared_ride: true }
              as: Scheduler
              captures: { fare: $.data.fare_cents }
          assert:
            - "TransportTrip.${...}.fare_cents == 4588"
            - "A plain trip (miles=8, no surcharges) on the same session yields fare_cents == 2650"

      - name: statement_rollup_per_session_round_then_sum
        grounds:
          - calculations.statement_rollup
          - entities.MonthlyStatement.fields.coinsurance_due_cents
          - entities.Patient.fields.coinsurance_pct
        distinguishing_aspect: "Mode (b): three COMPLETED+BILLED sessions billed 28500/29700/30900 at coinsurance_pct 0.125 give per-session-rounded coinsurance 3563+3713+3863 = 11139, whereas sum-then-round would give 11138; the scaffold pins per-session-then-sum, so coinsurance_due_cents == 11139."
        test_recipe:
          setup:
            - "Clinic OPEN; RESIDENT STANDARD patient coinsurance_pct 0.125; ACTIVE HEMODIALYSIS order; three COMPLETED then BILLED sessions in 2026-06 with epo 0/1000/2000 (billed 28500/29700/30900)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "StmtClinic", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "SM1", model: "Nipro", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "SC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "SP", full_name: "Stmt Patient", payer_class: "STANDARD", coinsurance_pct: 0.125 }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", epo_units: 0, effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${o1}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/check-in"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s1}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s1}/bill"
              payload: {}
              as: BillingClerk
            - call: "POST /orders/${o1}/open-revision"
              payload: {}
              as: Nephrologist
            - call: "POST /orders/${o1}/commit-revision"
              payload: { epo_units: 1000 }
              as: Nephrologist
            - call: "GET /patients/${pid}"
              payload: {}
              as: Scheduler
              captures: { pv1: $.data.version }
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${o1}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-03", expected_patient_version: "${pv1}" }
              as: Scheduler
              captures: { s2: $.data.id }
            - call: "POST /sessions/${s2}/check-in"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s2}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s2}/bill"
              payload: {}
              as: BillingClerk
            - call: "POST /orders/${o1}/open-revision"
              payload: {}
              as: Nephrologist
            - call: "POST /orders/${o1}/commit-revision"
              payload: { epo_units: 2000 }
              as: Nephrologist
            - call: "GET /patients/${pid}"
              payload: {}
              as: Scheduler
              captures: { pv2: $.data.version }
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${o1}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-05", expected_patient_version: "${pv2}" }
              as: Scheduler
              captures: { s3: $.data.id }
            - call: "POST /sessions/${s3}/check-in"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s3}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${s3}/bill"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /statements"
              payload: { patient_id: "${pid}", period_month: "2026-06" }
              as: BillingClerk
              captures: { due: $.data.coinsurance_due_cents }
          assert:
            - "MonthlyStatement.${...}.coinsurance_due_cents == 11139 (per-session round-then-sum; sum-then-round would be 11138)"
            - "MonthlyStatement.${...}.session_count == 3"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: session_parallel_clinical_and_billing_axes
        grounds:
          - state_machines.TreatmentSession.CHECKED_IN_to_COMPLETED
          - state_machines.TreatmentSessionBilling.UNBILLED_to_BILLED
          - entities.TreatmentSession.fields.clinical_status
          - entities.TreatmentSession.fields.billing_status
        distinguishing_aspect: "TreatmentSession carries two independent axes: clinical_status reaches COMPLETED while billing_status remains UNBILLED, then billing advances UNBILLED->BILLED->SETTLED without changing clinical_status — parallel dimensions on one entity."
        test_recipe:
          setup:
            - "A COMPLETED session whose billing_status is still UNBILLED."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "PxClinic", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "PM1", model: "Nipro", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "PC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "PX", full_name: "Px Patient", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
