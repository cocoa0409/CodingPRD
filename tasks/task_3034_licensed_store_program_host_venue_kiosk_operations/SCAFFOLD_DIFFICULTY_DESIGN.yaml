            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/promotion-campaigns", payload: { name: "A", start_date: "2026-10-01", end_date: "2026-10-10", discount_pct: 10, floor_price_cents: 100 }, as: BrandProgramAdmin, captures: { camp_a: $.data.id } }
          trigger:
            - { call: "POST /licensing/stores/${store_id}/promotion-campaigns", payload: { name: "B", start_date: "2026-10-10", end_date: "2026-10-20", discount_pct: 10, floor_price_cents: 100 }, as: BrandProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /licensing/stores/${store_id}/promotion-campaigns", payload: { name: "C", start_date: "2026-10-11", end_date: "2026-10-20", discount_pct: 10, floor_price_cents: 100 }, as: BrandProgramAdmin, captures: { camp_c: $.data.id } }
          assert:
            - "err == \"ERR_CAMPAIGN_WINDOW_CONFLICT\" with HTTP 409 (shared boundary date counts as overlap under closed semantics)"
            - "Campaign C created: HTTP 201 and PromotionCampaign.${camp_c}.status == PLANNED (gap-free adjacency on the next day is allowed)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dispute_credit_conserves_order_spend
        grounds:
          - state_machines.SupplyOrder.DISPUTED_to_CLOSED
          - entities.SupplyOrder.fields.credit_cents
          - calculations.supply_order_pricing
        distinguishing_aspect: |
          Conserved quantity is order spend in cents: a partial receipt (forward) paired with its
          compensating dispute credit satisfies total_cost_cents(5000) == received_value_cents(3000)
          + credit_cents(2000); a credit of 2001 (one cent over the shortage) is rejected.
        test_recipe:
          setup:
            - "OPERATING store; order of 10 units at 500 cents (total 5000) driven to IN_TRANSIT via approved distributor"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-18" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
            - { call: "POST /licensing/license-agreements", payload: { licensee_id: "${lic_id}", venue_id: "${ven_id}", royalty_tiers: [ { threshold_cents: 0, rate_bps: 300 } ], royalty_basis: "ACCRUAL", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }, as: BrandProgramAdmin, captures: { agr_id: $.data.id } }
            - { call: "POST /licensing/license-agreements/${agr_id}/submit", payload: {}, as: BrandProgramAdmin }
            - { call: "POST /licensing/license-agreements/${agr_id}/accept", payload: {}, as: HostVenueManager, as_user_id: "${ven_id}" }
            - { call: "POST /licensing/license-agreements/${agr_id}/stores", payload: { store_code: "ST1", equipment_footprint_units: 40 }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { store_id: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E1", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp1: $.data.id } }
            - { call: "POST /licensing/licensees/${lic_id}/employees", payload: { full_name: "E2", role_tag: "BARISTA" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { emp2: $.data.id } }
            - { call: "POST /licensing/employees/${emp1}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert1: $.data.id } }
            - { call: "POST /licensing/employees/${emp2}/certifications", payload: { program_code: "BARISTA_CORE" }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { cert2: $.data.id } }
            - { call: "POST /licensing/certifications/${cert1}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert1}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/certifications/${cert2}/record-exam", payload: { exam_score: 90, proctor_anomaly: false }, as: BrandInspector, as_user_id: "insp-P" }
            - { call: "POST /licensing/certifications/${cert2}/audit-verify", payload: {}, as: BrandInspector, as_user_id: "insp-Q" }
            - { call: "POST /licensing/stores/${store_id}/request-certification", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/stores/${store_id}/begin-operations", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/product-items", payload: { sku: "SKU-1", name: "P1", category: "FOOD", proprietary: false, venue_type_restrictions: [], unit_cost_cents: 500, case_pack_units: 1, footprint_units: 0 }, as: BrandProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /licensing/stores/${store_id}/assortment-items", payload: { product_item_id: "${p1}", par_level: 50 }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/distributors", payload: { name: "D1", lead_time_days: 2 }, as: BrandProgramAdmin, captures: { dist_id: $.data.id } }
            - { call: "PATCH /licensing/distributors/${dist_id}", payload: { approved: true }, as: BrandProgramAdmin }
            - { call: "POST /licensing/stores/${store_id}/supply-orders", payload: { distributor_id: "${dist_id}", auto_replenish: false, lines: [ { product_item_id: "${p1}", quantity: 10 } ] }, as: LicenseeManager, as_user_id: "${lic_id}", captures: { order_id: $.data.id } }
            - { call: "POST /licensing/supply-orders/${order_id}/submit", payload: {}, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/supply-orders/${order_id}/approve", payload: {}, as: DistributorAgent, as_user_id: "${dist_id}" }
            - { call: "POST /licensing/supply-orders/${order_id}/ship", payload: {}, as: DistributorAgent, as_user_id: "${dist_id}" }
            - { call: "POST /licensing/supply-orders/${order_id}/receive", payload: { received_lines: [ { product_item_id: "${p1}", quantity_received: 6 } ] }, as: LicenseeManager, as_user_id: "${lic_id}" }
            - { call: "POST /licensing/supply-orders/${order_id}/dispute", payload: { reason: "4 units damaged" }, as: LicenseeManager, as_user_id: "${lic_id}" }
          trigger:
            - { call: "POST /licensing/supply-orders/${order_id}/resolve-dispute", payload: { credit_cents: 2001 }, as: DistributorAgent, as_user_id: "${dist_id}", captures: { err: $.data.error_id } }
            - { call: "POST /licensing/supply-orders/${order_id}/resolve-dispute", payload: { credit_cents: 2000 }, as: DistributorAgent, as_user_id: "${dist_id}" }
          assert:
            - "err == \"ERR_DISPUTE_CREDIT_EXCEEDS_SHORTAGE\" (2001 > shortage 2000) and the order stayed DISPUTED after the failed resolve"
            - "SupplyOrder.${order_id}.status == CLOSED after the 2000-cent resolve"
            - "INVARIANT: SupplyOrder.${order_id}.total_cost_cents == 5000 == received_value_cents(3000) + credit_cents(2000)"

      - name: loyalty_earn_redeem_conserves_points_balance
        grounds:
          - calculations.loyalty_points_engine
          - entities.LoyaltyMember.fields.points_balance
        distinguishing_aspect: |
          Conserved quantity is loyalty points (different quantity than order cents): an EARN of
          50 points paired with a compensating REDEEM of 50 returns points_balance to exactly 0,
