              payload: {ba_narrative: "Effects analysis for 17.35 acres of occupied habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${consultation_id}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
            - call: "POST /project-actions/${action_id}/habitat-conservation-plans"
              payload: {plan_name: "Sunrise Park HCP", covered_acres: 20.00, permit_term_years: 30}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_id: "$.data.id", hcp_v1: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 45.01, expected_hcp_version: "${hcp_v1}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {commit1_id: "$.data.id"}
          trigger:
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 10.00, expected_hcp_version: "${hcp_v1}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_stale1: "$.data.error_id"}
            - call: "GET /conservation-banks/${bank_id}"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_available: "$.data.credits_available", bank_reserved: "$.data.credits_reserved", bank_transferred: "$.data.credits_transferred"}
            - call: "GET /habitat-conservation-plans/${hcp_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_v2: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/funding-assurances"
              payload: {contribution_cents: 100000, instrument_type: "IRREVOCABLE_LETTER_OF_CREDIT"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {fund_state: "$.data.funding_status"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 10.00, expected_hcp_version: "${hcp_v2}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {e_stale2: "$.data.error_id"}
            - call: "GET /habitat-conservation-plans/${hcp_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_v3: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 10.00, expected_hcp_version: "${hcp_v3}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {commit2_id: "$.data.id"}
          assert:
            - "the first trigger returns 412 ${e_stale1} == 'ERR_STALE_HCP_VERSION': ${hcp_v1} was superseded when the 45.01-unit commitment landed"
            - "nothing at all was written by the refused call — ${bank_reserved} == 45.01 (not 55.01), ${bank_available} == 454.99, and the plan's endowment_required_cents is unchanged at 3788402"
            - "the second trigger returns 412 as well, even though ${hcp_v2} was read directly from the plan: the intervening funding assurance (${fund_state} == 'PARTIALLY_ASSURED') bumped the version, so ANY plan write invalidates the token"
            - "with the freshly read ${hcp_v3} the same commitment body returns 201, so the payload was never the problem"
            - "the plan's version advances by exactly 1 per successful write and never on a refusal: creation 1, first commitment 2, funding 3, second commitment 4"
            - "expected_hcp_version is a required input, so omitting it is a 400 ERR_INVALID_REQUEST at priority 7 rather than a 412"

      - name: stale_expected_permit_version_is_412_even_after_a_cascade_bump
