      - name: second_invoice_beyond_the_credit_limit_returns_payment_required
        claim_type: Violation -> Error
        grounds:
          - validations[priority 72 ERR_LESSEE_CREDIT_LIMIT_EXCEEDED]
          - errors.ERR_LESSEE_CREDIT_LIMIT_EXCEEDED
          - calculations.lessee_outstanding_balance
          - endpoints[POST /wetlease/settlement-invoices]
        distinguishing_aspect: |
          The credit ceiling is checked at BOTH prepare and issue, and the boundary is inclusive. With
          the limit set to exactly one month's guarantee (2,400,000) the September invoice prepares
          and issues at exact equality (0 + 2,400,000 <= 2,400,000) and drives the balance to
          2,400,000; the October invoice then needs 2,400,000 + 2,400,000 = 4,800,000 and is refused
          with the domain-specific 402, not a 409 or 422. No invoice row may be created for October
          and the balance must not move.
          
