              captures: { inv_w: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_w}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
