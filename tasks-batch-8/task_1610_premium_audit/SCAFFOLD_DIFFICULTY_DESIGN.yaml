          Entity pair AuditWorkOrder x BillingTransaction: close is rejected while the result's billing is still
          ISSUED (ERR_INVALID_STATE_TRANSITION) even though the dispute window has elapsed; after the credit is fully
          applied (APPLIED) the same close succeeds and bubbles the policy up to AUDIT_FINALIZED.
