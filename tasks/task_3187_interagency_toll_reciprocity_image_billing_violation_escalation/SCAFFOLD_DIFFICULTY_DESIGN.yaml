# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3187_interagency_toll_reciprocity_image_billing_violation_escalation
#
# Depth probe: 9 Difficulty Rules x 2 instances each. Every instance grounds
# in SCAFFOLD.yaml §1.1-§1.7 and is reproducible from empty-DB via the
# structured setup_api_calls chain.
#
# Canonical fixture abbreviations used across instances:
#   agency HOME (fee 100 bps), agency AWAY (fee 150 bps)
#   schedules on AWAY are created per-instance to control charged amounts
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_fee_per_line_vs_aggregate_rounding
        grounds:
          - calculations.settlement_net
          - calculations.settlement_net.variants.per_line_rounding
          - calculations.settlement_net.variants.aggregate_rounding
          - entities.SettlementFile.fields.fee_amount_cents
        distinguishing_aspect: |
          Settlement domain: fee is pinned to per-line rounding
          (sum of round_half_up per line). Three lines charged 101, 202, 303
          cents at 150 bps produce fee 2+3+5 = 10, whereas the rejected
          aggregate variant round_half_up(606*0.015) = 9 — the two valid
          interpretations diverge by exactly 1 cent on the SAME lines.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default)."
            - "Agency HOME (fee 100 bps) and AWAY (fee 150 bps), both ACTIVE."
            - "AWAY has three CLASS_2 schedules at plaza P1 with base rates 101, 202, 303, axle 1.0, peak 1.0, non-overlapping windows."
            - "Account on HOME with a no-discount plan (discount_pct 0), balance 100000, and one ACTIVE transponder TAG-A."
            - "Three transponder trips posted against the three schedules; charged amounts exactly 101, 202, 303."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 101, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-01T06:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 202, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T06:00:00Z", effective_to: "2026-09-01T12:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 303, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T12:00:00Z", effective_to: "2026-09-01T18:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Casey Toll", holder_email: "casey@example.com", discount_plan_id: "${plan_id}", low_balance_threshold_cents: 1000, replenishment_amount_cents: 2500, opening_balance_cents: 100000 }
              as: AgencyOperations
              captures: { acct_id: "$.data.id" }
            - call: "POST /toll/accounts/${acct_id}/transponders"
              payload: { tag_number: "TAG-A", vehicle_class: "CLASS_2", plate_number: "ABC123", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-A", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T03:00:00Z", is_peak: false, idempotency_key: "trip-1" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-A", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T09:00:00Z", is_peak: false, idempotency_key: "trip-2" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-A", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T15:00:00Z", is_peak: false, idempotency_key: "trip-3" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/settlement-files/generate"
              payload: { from_agency_id: "${home_id}", to_agency_id: "${away_id}" }
              as: SettlementOfficer
              captures: { sf_id: "$.data.id" }
          assert:
            - "SettlementFile.${sf_id}.line_count == 3"
            - "SettlementFile.${sf_id}.gross_amount_cents == 606"
            - "SettlementFile.${sf_id}.fee_amount_cents == 10 (per-line rounding 2+3+5), NOT 9 (aggregate rounding)"
            - "SettlementFile.${sf_id}.net_amount_cents == 596"

      - name: misread_plate_net_credit_vs_void_and_rebill
        grounds:
          - calculations.misread_plate_rebill_credit
          - state_machines.ImageBill.BILLED_to_REBILLED
          - entities.Account.fields.balance_cents
        distinguishing_aspect: |
          Image-billing domain (different entity domain than settlement): an
          upheld MISREAD_PLATE dispute applies the pinned net_credit variant —
          the original account receives exactly ONE compensating credit equal
          to billed_amount_cents and its version advances exactly once from the
          credit; the rejected void_and_rebill variant would leave two ledger
          entries (debit reversal + separate credit) and two version bumps.
        test_recipe:
          setup:
            - "Agencies HOME and AWAY ACTIVE; AWAY schedule CLASS_2 base 800 axle 1.0 peak 1.0 image_fee 100 covering the trip day."
            - "Account A (balance 5000) on HOME with plan discount 0."
            - "Plate lookup agreement from AWAY to HOME covering NY, ACTIVE for the whole period."
            - "An image trip (unread tag) posts a TollTransaction (IMAGE) of 900 and an ImageBill in PENDING_LOOKUP; PlateLookupAgent resolves it to Account A, debiting 900 (balance 4100)."
            - "Account holder files a MISREAD_PLATE dispute on the image bill claiming plate XYZ999."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "STD", discount_pct: 0.0, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Dana Plate", holder_email: "dana@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 5000 }
              as: AgencyOperations
              captures: { acct_id: "$.data.id", acct_v0: "$.data.version" }
            - call: "POST /toll/plate-data-agreements"
              payload: { requesting_agency_id: "${away_id}", providing_agency_id: "${home_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", covers_states: ["NY"] }
              as: SettlementOfficer
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "ABC123", plate_state: "NY", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-02T10:00:00Z", is_peak: false, idempotency_key: "img-1" }
              as: AgencyOperations
              captures: { txn_id: "$.data.id" }
            - call: "GET /toll/image-bills"
              payload: { status: "PENDING_LOOKUP" }
              as: PlateLookupAgent
              captures: { bill_id: "$.data[0].id" }
            - call: "POST /toll/image-bills/${bill_id}/resolve"
              payload: { resolved_account_id: "${acct_id}" }
              as: PlateLookupAgent
            - call: "POST /toll/disputes"
              payload: { account_id: "${acct_id}", dispute_type: "MISREAD_PLATE", image_bill_id: "${bill_id}", claimed_plate_number: "XYZ999" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { disp_id: "$.data.id" }
            - call: "POST /toll/disputes/${disp_id}/begin_review"
              payload: {}
              as: ViolationsOfficer
          trigger:
            - call: "POST /toll/disputes/${disp_id}/uphold"
              payload: {}
              as: ViolationsOfficer
          assert:
            - "Account.${acct_id}.balance_cents == 5000 (exactly one net credit of 900 after the 900 debit)"
            - "ImageBill.${bill_id}.status == REBILLED and misread_flag == true"
            - "a new ImageBill exists in PENDING_LOOKUP for plate XYZ999 (GET /toll/image-bills?status=PENDING_LOOKUP returns exactly 1 row)"
            - "Account.${acct_id}.version advanced by exactly 2 relative to ${acct_v0} (one debit on resolve + one credit on uphold), NOT 3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fare_multi_input_peak_axle_discount_video (mode a)
        grounds:
          - calculations.toll_fare
          - entities.TollTransaction.fields.gross_amount_cents
          - entities.TollTransaction.fields.charged_amount_cents
        distinguishing_aspect: |
          Mode (a) multi-input non-linear: CLASS_5 peak trip composes
          base 475 x axle 2.5 (1188) x peak 1.25 (1485) with a 20% discount
          (297) -> transponder charged 1188; the SAME trip as IMAGE composes
          1485 + 100 image fee with NO discount -> gross 1585. Changing
          detection_method alone flips which sub-formula applies.
        test_recipe:
          setup:
            - "Agencies HOME/AWAY ACTIVE; AWAY schedule CLASS_5 base 475, axle_multiplier 2.5, peak_multiplier 1.25, image_fee_cents 100, covering the trip day."
            - "HOME plan: 20% discount, no daily cap (0), applies to AWAY, min_trips 0."
            - "Account on HOME, balance 100000, threshold 1000; transponder TAG-T declared CLASS_5."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P9", vehicle_class: "CLASS_5", base_rate_cents: 475, axle_multiplier: 2.5, peak_multiplier: 1.25, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "TRUCK20", discount_pct: 0.20, daily_discount_cap_cents: 0, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Erin Haul", holder_email: "erin@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 100000 }
              as: AgencyOperations
              captures: { acct_id: "$.data.id" }
            - call: "POST /toll/accounts/${acct_id}/transponders"
              payload: { tag_number: "TAG-T", vehicle_class: "CLASS_5", plate_number: "TRK500", plate_state: "NY" }
              as: AgencyOperations
            - call: "POST /toll/plate-data-agreements"
              payload: { requesting_agency_id: "${away_id}", providing_agency_id: "${home_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", covers_states: ["NY"] }
              as: SettlementOfficer
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-T", away_agency_id: "${away_id}", plaza_code: "P9", trip_timestamp: "2026-09-03T08:00:00Z", is_peak: true, idempotency_key: "t-peak" }
              as: AgencyOperations
              captures: { txn_t: "$.data.id" }
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "TRK500", plate_state: "NY", away_agency_id: "${away_id}", plaza_code: "P9", trip_timestamp: "2026-09-03T08:05:00Z", is_peak: true, idempotency_key: "i-peak" }
              as: AgencyOperations
              captures: { txn_i: "$.data.id" }
          assert:
            - "TollTransaction.${txn_t}.gross_amount_cents == 1485 and discount_amount_cents == 297 and charged_amount_cents == 1188"
            - "TollTransaction.${txn_i}.detection_method == IMAGE and gross_amount_cents == 1585 and discount_amount_cents == 0 and charged_amount_cents == 1585"

      - name: daily_cap_chronological_nested_rounding (mode b)
        grounds:
          - calculations.daily_discount_cap_allocation
          - calculations.toll_fare
          - entities.Account.fields.discount_used_today_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: each trip's raw
          discount is rounded half-up PER TRIP (575*0.2 = 115 each), then the
          300-cent daily cap is applied chronologically — trip discounts are
          115, 115, 70 (not 100 each, not 345 total). Voiding trip 1 does NOT
          restore cap, so a fourth trip still gets 0.
        test_recipe:
          setup:
            - "Agencies HOME/AWAY ACTIVE; AWAY CLASS_2 schedule base 575, axle 1.0, peak 1.0 covering the day."
            - "HOME plan: 20% discount, daily cap 300, applies to AWAY."
            - "Account balance 100000; transponder TAG-C CLASS_2."
            - "Three trips posted at 09:00, 10:00, 11:00 on the same UTC day."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P2", vehicle_class: "CLASS_2", base_rate_cents: 575, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${home_id}/discount-plans"
              payload: { plan_code: "COMMUTER", discount_pct: 0.20, daily_discount_cap_cents: 300, applies_to_agency_codes: ["AWAY"] }
              as: AgencyOperations
              captures: { plan_id: "$.data.id" }
            - call: "POST /toll/accounts"
              payload: { home_agency_id: "${home_id}", holder_name: "Fran Cap", holder_email: "fran@example.com", discount_plan_id: "${plan_id}", opening_balance_cents: 100000 }
              as: AgencyOperations
              captures: { acct_id: "$.data.id" }
            - call: "POST /toll/accounts/${acct_id}/transponders"
              payload: { tag_number: "TAG-C", vehicle_class: "CLASS_2", plate_number: "CAP300", plate_state: "NY" }
              as: AgencyOperations
          trigger:
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-C", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-04T09:00:00Z", is_peak: false, idempotency_key: "c1" }
              as: AgencyOperations
              captures: { t1: "$.data.id" }
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-C", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-04T10:00:00Z", is_peak: false, idempotency_key: "c2" }
              as: AgencyOperations
              captures: { t2: "$.data.id" }
            - call: "POST /toll/toll-transactions"
              payload: { tag_number: "TAG-C", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-04T11:00:00Z", is_peak: false, idempotency_key: "c3" }
              as: AgencyOperations
              captures: { t3: "$.data.id" }
          assert:
            - "TollTransaction.${t1}.discount_amount_cents == 115 and charged_amount_cents == 460"
            - "TollTransaction.${t2}.discount_amount_cents == 115 and charged_amount_cents == 460"
            - "TollTransaction.${t3}.discount_amount_cents == 70 and charged_amount_cents == 505"
            - "Account.${acct_id}.discount_used_today_cents == 300"
            - "Account.${acct_id}.balance_cents == 98575"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: violation_branching_fork_join
        grounds:
          - state_machines.Violation
        distinguishing_aspect: |
          Violation machine is branching fork-join: from NOTICED the flow
          forks to {PAID, ESCALATED, DISMISSED} with divergent side-effect
          sets (zero-out vs +fee accumulation vs credit-back), and ESCALATED
          itself forks to HOLD_REFERRED only when outstanding >= 10000.
        test_recipe:
          setup:
            - "Two violations exist on unregistered plates (image bills with no resolved account): V-pay (toll 800) and V-hold (toll 2000)."
            - "Each has notice_count 3 issued 30 days apart (days 0, 30, 60)."
            - "Logical epoch day is 60; both qualify for the escalation sweep."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "AWAY", name: "Away Toll Authority", home_state: "NJ", reciprocity_fee_bps: 150 }
              as: SettlementOfficer
              captures: { away_id: "$.data.id" }
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P1", vehicle_class: "CLASS_2", base_rate_cents: 800, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/agencies/${away_id}/rate-schedules"
              payload: { plaza_code: "P2", vehicle_class: "CLASS_2", base_rate_cents: 2000, axle_multiplier: 1.0, peak_multiplier: 1.0, image_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "UNREG1", plate_state: "PA", away_agency_id: "${away_id}", plaza_code: "P1", trip_timestamp: "2026-09-01T09:00:00Z", is_peak: false, idempotency_key: "u1" }
              as: AgencyOperations
            - call: "POST /toll/toll-transactions"
              payload: { plate_number: "UNREG2", plate_state: "PA", away_agency_id: "${away_id}", plaza_code: "P2", trip_timestamp: "2026-09-01T09:30:00Z", is_peak: false, idempotency_key: "u2" }
              as: AgencyOperations
            - call: "GET /toll/image-bills"
              payload: { status: "PENDING_LOOKUP" }
              as: PlateLookupAgent
              captures: { bill1: "$.data[0].id", bill2: "$.data[1].id" }
            - call: "POST /toll/image-bills/${bill1}/resolve"
              payload: {}
              as: PlateLookupAgent
            - call: "POST /toll/image-bills/${bill2}/resolve"
              payload: {}
              as: PlateLookupAgent
            - call: "GET /toll/violations"
              payload: {}
              as: ViolationsOfficer
              captures: { v1: "$.data[0].id", v2: "$.data[1].id" }
            - call: "POST /toll/violations/${v1}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/violations/${v2}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
            - call: "POST /toll/violations/${v1}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/violations/${v2}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
            - call: "POST /toll/violations/${v1}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/violations/${v2}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/_clock/advance_day"
              payload: { days: 1 }
              as: SettlementOfficer
          trigger:
            - call: "POST /toll/violations/${v1}/pay"
              payload: {}
              as: ViolationsOfficer
          assert:
            - "Violation.${v1}.status == PAID and total_outstanding_cents == 0 (took the NOTICED->PAID fork from ESCALATED->PAID after escalation)"
            - "Violation.${v2}.status == HOLD_REFERRED and registration_hold_referred == true (outstanding 2100+500+2500+5000 = 10100 >= 10000 took the HOLD_REFERRED fork)"
            - "Violation.${v2}.total_outstanding_cents == 10100"

      - name: dispute_cycle_review_reject_refire
        grounds:
          - state_machines.Dispute
          - state_machines.TollTransaction.DISPUTED_to_POSTED
        distinguishing_aspect: |
          Dispute machine cycles on the TollTransaction aggregate: a
          classification dispute moves the transaction POSTED->DISPUTED, and
          REJECTED or WITHDRAWN loops it back to POSTED, after which a NEW
          dispute can be filed on the same transaction (POSTED->DISPUTED
          again) — an A->B->A->B cycle across two entities.
        test_recipe:
          setup:
            - "Agencies HOME/AWAY ACTIVE; AWAY CLASS_5 schedule base 475 axle 2.5 peak 1.0; account with TAG-V declared CLASS_5, balance 100000, plan discount 0."
            - "One transponder trip posted at CLASS_5 (charged 1188)."
            - "Holder files a VEHICLE_CLASSIFICATION dispute claiming CLASS_2, then withdraws it; the transaction is POSTED again."
          setup_api_calls:
            - call: "POST /toll/agencies"
              payload: { agency_code: "HOME", name: "Home Toll Authority", home_state: "NY", reciprocity_fee_bps: 100 }
              as: SettlementOfficer
              captures: { home_id: "$.data.id" }
            - call: "POST /toll/agencies"
