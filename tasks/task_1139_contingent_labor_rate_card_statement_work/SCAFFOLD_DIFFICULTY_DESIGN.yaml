            - { call: "POST /v1/milestones/${m1_id}/deliver", payload: {}, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - { call: "POST /v1/milestones/${m1_id}/accept", payload: {}, as: HiringManager }
