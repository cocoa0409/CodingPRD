  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_safety_finalize_rejected_for_state_even_when_controlled_site_unauthorized
        grounds:
          - validations.priority_5_state
          - validations.priority_8_business_safety
          - errors.ERR_INVALID_STATE
          - errors.ERR_CONTROLLED_SITE_NOT_AUTHORIZED
