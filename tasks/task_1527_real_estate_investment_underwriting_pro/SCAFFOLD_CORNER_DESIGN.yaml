        grounds: [concurrency_rules.scenario-create-stale-deal, errors.ERR_STALE_VERSION]
        distinguishing_aspect: "POST /deals/{id}/scenarios with expected_deal_version equal to a previously-observed (now stale) version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Deal in UNDERWRITING; client captured deal_v2 before another call bumped version"]
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-OCC1", deal_name: "O1", strategy: "CORE", target_purchase_price_cents: 100 }
              as: Analyst
