    description: "Submit a grant application"
    roles: [VolunteerEditor]
    code: 201
    input: [project_title, requested_cents]
    output: GrantApplication
    side_effects: ["status=SUBMITTED"]

  - method: GET
    path: "/wiki/grant-applications/{applicationId}"
    description: "Get grant application"
    roles: [GrantAdministrator, GrantReviewer, VolunteerEditor]
    code: 200
    input: []
    output: GrantApplication
    side_effects: []

  - method: POST
    path: "/wiki/grant-applications/{applicationId}/start-review"
    description: "Start reviewing a grant application"
    roles: [GrantReviewer]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status=UNDER_REVIEW"]

  - method: POST
    path: "/wiki/grant-applications/{applicationId}/score"
    description: "Submit review scores"
    roles: [GrantReviewer]
    code: 200
    input: [impact_score, feasibility_score, budget_reasonableness_score, community_support_score]
    output: GrantApplication
    side_effects: ["review_score computed"]

  - method: POST
    path: "/wiki/grant-applications/{applicationId}/approve"
    description: "Approve a grant application"
    roles: [GrantReviewer]
    code: 200
    input: [awarded_cents, expected_application_version]
    output: GrantApplication
    side_effects: ["status=APPROVED, GrantProgram.allocated_cents incremented, GrantApplication.version incremented"]

  - method: POST
    path: "/wiki/grant-applications/{applicationId}/reject"
    description: "Reject a grant application"
    roles: [GrantReviewer]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/wiki/grant-applications/{applicationId}/withdraw"
    description: "Withdraw a grant application"
    roles: [VolunteerEditor]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status=WITHDRAWN"]

  # --- Legal Requests ---
  - method: POST
    path: "/wiki/legal-requests"
    description: "File a legal request"
    roles: [LegalCounsel]
    code: 201
    input: [request_type, "target_page_id?", "target_user_id?", requesting_party]
    output: LegalRequest
    side_effects: ["status=RECEIVED, received_at set"]

  - method: GET
    path: "/wiki/legal-requests/{requestId}"
    description: "Get legal request"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalRequest
    side_effects: []

  - method: POST
    path: "/wiki/legal-requests/{requestId}/start-review"
    description: "Start reviewing a legal request"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalRequest
    side_effects: ["status=UNDER_REVIEW"]

  - method: POST
    path: "/wiki/legal-requests/{requestId}/comply"
    description: "Comply with a legal request"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalRequest
    side_effects: ["status=COMPLIED, possible page lock"]

  - method: POST
    path: "/wiki/legal-requests/{requestId}/partially-comply"
    description: "Partially comply with a legal request"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalRequest
    side_effects: ["status=PARTIALLY_COMPLIED, limited page lock"]

  - method: POST
    path: "/wiki/legal-requests/{requestId}/reject"
    description: "Reject a legal request"
    roles: [LegalCounsel]
    code: 200
    input: []
    output: LegalRequest
    side_effects: ["status=REJECTED"]

  # --- Transparency Reports ---
  - method: POST
    path: "/wiki/transparency-reports"
    description: "Create a transparency report draft"
    roles: [LegalCounsel]
    code: 201
    input: [period_start, period_end]
    output: TransparencyReport
    side_effects: ["status=DRAFT, counts initialized to 0"]

  - method: GET
    path: "/wiki/transparency-reports/{reportId}"
    description: "Get transparency report"
    roles: [LegalCounsel, Anonymous]
    code: 200
    input: []
    output: TransparencyReport
    side_effects: []

  - method: POST
    path: "/wiki/transparency-reports/{reportId}/publish"
    description: "Publish a transparency report"
    roles: [LegalCounsel]
    code: 200
    input: [expected_report_version]
    output: TransparencyReport
    side_effects: ["status=PUBLISHED, counts recalculated, LegalRequest.transparency_report_id set, TransparencyReport.version incremented"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for requested transition" }
  - { id: ERR_COI_UNDISCLOSED, http: 403, condition: "Editor has undisclosed conflict of interest for this page" }
  - { id: ERR_PROTECTION_BLOCKED, http: 403, condition: "Page protection level prevents this edit" }
  - { id: ERR_ESCALATION_TOO_SOON, http: 409, condition: "Less than 72 hours since last dispute escalation" }
  - { id: ERR_GRANT_BUDGET_EXCEEDED, http: 409, condition: "Award would exceed grant program budget" }
  - { id: ERR_CAMPAIGN_INACTIVE, http: 409, condition: "Campaign or banner not ACTIVE for donation processing" }
  - { id: ERR_REFUND_WINDOW_EXPIRED, http: 409, condition: "More than 90 days since donation processed" }
  - { id: ERR_EDITOR_HAS_OPEN_ARBITRATION, http: 409, condition: "Editor has open Arbitration-level dispute as initiator" }
  - { id: ERR_LEGAL_REQUESTS_PENDING, http: 409, condition: "Legal requests in period not all terminal" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current version" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or malformed payload" }
  - { id: ERR_VANDALISM_SCORE_HIGH, http: 409, condition: "Cannot accept revision with vandalism_score >= 50 without admin override" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "Page already has an open dispute at this level" }
  - { id: ERR_INSUFFICIENT_PRIVILEGE, http: 403, condition: "Editor lacks rollback_eligible or admin status for this action" }
  - { id: ERR_BANNER_FREQUENCY_CAP, http: 409, condition: "User has exceeded daily impression cap for this banner" }
  - { id: ERR_BANNER_GEO_MISMATCH, http: 409, condition: "Banner geo_target does not cover viewer country" }
  - { id: ERR_GRANT_SCORE_TOO_LOW, http: 409, condition: "Review score below 70 threshold for approval" }
  - { id: ERR_TAKEDOWN_ARBITRATION_BLOCK, http: 409, condition: "Cannot comply with takedown while page has open Arbitration dispute" }

roles:
  - name: Anonymous
    description: "Unauthenticated visitor; can register, view public pages, and make donations"
    identity: opaque
    exclusive_operations:
      - "POST /editors"
      - "POST /campaigns/{id}/donations"
    shared_operations:
      - "GET /pages/{id}"
      - "GET /campaigns/{id}"
      - "GET /transparency-reports/{id}"

  - name: VolunteerEditor
    description: "Registered community member who edits pages, files disputes, and applies for grants"
    identity: "entity_backed:VolunteerEditor"
    exclusive_operations:
      - "POST /pages"
      - "POST /pages/{id}/revisions"
      - "POST /pages/{id}/disputes"
      - "POST /pages/{id}/protection-requests"
      - "POST /editors/{id}/disclose-coi"
      - "POST /grant-programs/{id}/applications"
      - "POST /grant-applications/{id}/withdraw"
    shared_operations:
      - "GET /pages/{id}"
      - "GET /editors/{id}"
      - "GET /revisions/{id}"
      - "GET /disputes/{id}"
      - "GET /vandalism-reports/{id}"
      - "GET /grant-programs/{id}"
      - "GET /grant-applications/{id}"
      - "POST /revisions/{id}/accept"
      - "POST /revisions/{id}/flag"
      - "POST /revisions/{id}/revert"
      - "POST /disputes/{id}/escalate"

  - name: Administrator
    description: "Senior volunteer with elevated privileges for moderation, protection, and dispute resolution"
    identity: opaque
    exclusive_operations:
      - "POST /editors/{id}/suspend"
      - "POST /editors/{id}/reinstate"
      - "POST /editors/{id}/block"
      - "POST /protection-requests/{id}/approve"
      - "POST /protection-requests/{id}/deny"
      - "POST /vandalism-reports/{id}/confirm"
      - "POST /vandalism-reports/{id}/dismiss"
      - "POST /disputes/{id}/resolve"
      - "POST /disputes/{id}/close"
    shared_operations:
      - "GET /pages/{id}"
      - "GET /editors/{id}"
      - "GET /revisions/{id}"
      - "GET /disputes/{id}"
      - "GET /vandalism-reports/{id}"
      - "POST /revisions/{id}/accept"
      - "POST /revisions/{id}/flag"
      - "POST /revisions/{id}/revert"
      - "POST /disputes/{id}/escalate"

  - name: FundraisingManager
    description: "Staff member managing donation campaigns and banners"
    identity: opaque
    exclusive_operations:
      - "POST /campaigns"
      - "POST /campaigns/{id}/activate"
      - "POST /campaigns/{id}/pause"
      - "POST /campaigns/{id}/complete"
      - "POST /campaigns/{id}/cancel"
      - "POST /campaigns/{id}/banners"
      - "GET /banners/{id}"
      - "POST /donations/{id}/refund"
    shared_operations:
      - "GET /campaigns/{id}"
      - "GET /donations/{id}"

  - name: PaymentProcessor
    description: "Automated system or staff handling payment processing"
    identity: opaque
    exclusive_operations:
      - "POST /donations/{id}/process"
      - "POST /donations/{id}/fail"
    shared_operations:
      - "GET /donations/{id}"

  - name: GrantAdministrator
    description: "Staff member managing grant programs"
    identity: opaque
    exclusive_operations:
      - "POST /grant-programs"
      - "POST /grant-programs/{id}/close"
    shared_operations:
      - "GET /grant-programs/{id}"
      - "GET /grant-applications/{id}"

  - name: GrantReviewer
    description: "Community or staff member reviewing grant applications"
    identity: opaque
    exclusive_operations:
      - "POST /grant-applications/{id}/start-review"
      - "POST /grant-applications/{id}/score"
      - "POST /grant-applications/{id}/approve"
      - "POST /grant-applications/{id}/reject"
    shared_operations:
      - "GET /grant-programs/{id}"
      - "GET /grant-applications/{id}"

  - name: LegalCounsel
    description: "Legal team handling requests and transparency reporting"
    identity: opaque
    exclusive_operations:
      - "POST /legal-requests"
      - "POST /legal-requests/{id}/start-review"
      - "POST /legal-requests/{id}/comply"
      - "POST /legal-requests/{id}/partially-comply"
      - "POST /legal-requests/{id}/reject"
      - "POST /transparency-reports"
      - "POST /transparency-reports/{id}/publish"
    shared_operations:
      - "GET /legal-requests/{id}"
      - "GET /transparency-reports/{id}"
      - "GET /pages/{id}"
      - "GET /editors/{id}"

  - name: PlatformAdmin
    description: "System administrator for test infrastructure and clock control"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []

concurrency_rules:
  - rule_id: page-revision-accept-stale
    parent_entity: WikiPage
    write_endpoint: "POST /revisions/{revisionId}/accept"
    occ_field: "expected_page_version"
    description: |
      Accepting a revision against a WikiPage whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another editor has just accepted a different revision (which legitimately
      supersedes the pending one) and the current client's view of the page is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispute-escalate-stale
    parent_entity: DisputeCase
    write_endpoint: "POST /disputes/{disputeId}/escalate"
    occ_field: "expected_dispute_version"
    description: |
      Escalating a DisputeCase whose version has advanced since the client last
      observed it is rejected. This captures the case where another party has
      just escalated or resolved the dispute, and the current client's view is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-activate-stale
    parent_entity: DonationCampaign
    write_endpoint: "POST /campaigns/{campaignId}/activate"
    occ_field: "expected_campaign_version"
    description: |
      Activating a DonationCampaign whose version has advanced since the client
      last observed it is rejected. This captures the case where another manager
      has just paused or completed the campaign, and the current client's view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: grant-approve-stale
    parent_entity: GrantApplication
    write_endpoint: "POST /grant-applications/{applicationId}/approve"
    occ_field: "expected_application_version"
    description: |
      Approving a GrantApplication whose version has advanced since the client
      last observed it is rejected. This captures the case where another reviewer
      has just scored or rejected the application, and the current client's view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: report-publish-stale
    parent_entity: TransparencyReport
    write_endpoint: "POST /transparency-reports/{reportId}/publish"
    occ_field: "expected_report_version"
    description: |
      Publishing a TransparencyReport whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      counsel has just modified the report period, and the current client's view
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
