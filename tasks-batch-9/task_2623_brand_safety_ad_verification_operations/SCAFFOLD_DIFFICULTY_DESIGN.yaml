      - name: rejected_claim_over_exhausted_cap_returns_state_error_not_fiscal_error
        grounds:
          - validations.priority_7_state
          - validations.priority_34_ERR_CREDIT_CAP_EXCEEDED
          - state_machines.RefundClaim.UNDER_REVIEW_to_REJECTED
          - errors.ERR_INVALID_CLAIM_STATE
          - errors.ERR_CREDIT_CAP_EXCEEDED
        distinguishing_aspect: |
          Category pair state (priority 7) versus business_fiscal (priority 34).
          The approve call violates both rules at once: the claim is already
          REJECTED and its 4760-cent net credit would blow the advertiser's
          100-cent cap. Only the state error may surface. The isolation check in
          the same instance approves a second, still-UNDER_REVIEW claim against
          the same exhausted cap and gets ERR_CREDIT_CAP_EXCEEDED, proving the
          fiscal rule is live and merely outranked.
        test_recipe:
          setup:
            - "Advertiser credit_cap_cents 100 (deliberately tiny) with credit_received_cents_total 0."
            - "Campaign cpm_cents 875, format DISPLAY; page classified GENERAL (SAFE)."
