      - name: pledge_lapse_cascade_flags_pledge_advance_application_for_revision
        grounds:
          - state_machines.Pledge.transitions["ACTIVE -> LAPSED"]
          - state_machines.PledgeCampaign.transitions["OPEN -> UNDERPERFORMING"]
          - state_machines.LoanApplication.transitions["UNDERWRITING -> REVISION_REQUESTED"]
