            - "payment_posture == DELINQUENT (${po}); consecutive_delinquent_reviews == 1 (first delinquent close, not yet DEFAULT)"
            - "MarginCallNotice: status ISSUED, deficiency_cents == 7000000 (${mc_st}, ${mc_def})"
            - "Borrower.${bor}.status == SUSPENDED (${bor_st})"

  # ---------------------------------------------------------------- rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_approve_state_error_beats_fiscal_error
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - state_machines.DrawRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Category pair state-vs-business_fiscal: the loan sits in
          RESTRUCTURING (state gate) AND the 99,000,000 amount exceeds
          availability -7,000,000 (fiscal gate); the state error
          ERR_LOAN_NOT_ACTIVE (priority 8) must win over
          ERR_DRAW_EXCEEDS_AVAILABILITY (priority 13).
        test_recipe:
          setup:
            - "Loan ACTIVE -> draw 19,000,000 disbursed (BB 19,000,000) -> filing terminated -> BB 12,000,000, DELINQUENT, margin open -> restructure plan created -> loan RESTRUCTURING; availability now min(50M, 12M) - 19M = -7,000,000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Sprayer", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer, captures: { fil: $.data.id } }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer }
            - { call: "POST /draw-requests", payload: { loan_account_id: "${loan}", amount_cents: 19000000, purpose: "SEED" }, as: LoanOfficer, captures: { drw: $.data.id } }
            - { call: "POST /draw-requests/${drw}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw}/disburse", as: LoanOfficer }
            - { call: "POST /ucc-filings/${fil}/terminate", as: LoanOfficer }
            - { call: "GET /loan-accounts/${loan}", as: LoanOfficer, captures: { v_pre: $.data.version } }
            - { call: "POST /restructure-plans", payload: { loan_account_id: "${loan}", plan_type: "STANDARD", amortization_style: "BALLOON", extension_months: 12, new_rate_bps: 600, capitalize_interest: true, expected_loan_version: "${v_pre}" }, as: LoanOfficer, as_user_id: "officer-1", captures: { pln: $.data.id } }
          trigger:
            - { call: "POST /draw-requests", payload: { loan_account_id: "${loan}", amount_cents: 99000000, purpose: "FUEL" }, as: LoanOfficer, captures: { drw2: $.data.id } }
            - { call: "POST /draw-requests/${drw2}/approve", as: LoanOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOAN_NOT_ACTIVE (state priority 8), NOT ERR_DRAW_EXCEEDS_AVAILABILITY (fiscal priority 13) even though amount 99,000,000 also exceeds availability -7,000,000"
            - "DrawRequest.${drw2}.status remains REQUESTED"

      - name: loan_activate_safety_error_beats_temporal_error
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - state_machines.LoanAccount.APPROVED_to_ACTIVE
        distinguishing_aspect: |
          Category pair business_safety-vs-business_temporal: activation with
          NO assigned insurance AND a maturity date already in the past must
          surface ERR_INSURANCE_NOT_ASSIGNED (priority 9), not
          ERR_MATURITY_PASSED (priority 10); fixing only the insurance leg then
          reveals the temporal error underneath.
        test_recipe:
          setup:
            - "APPROVED loan commitment 30,000,000, maturity 2026-06-01; budget APPROVED; REAL_ESTATE collateral PERFECTED; NO insurance policy; clock 2026-06-15 (past maturity)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 30000000, rate_bps: 700, season_year: 2026, maturity_date: "2026-06-01T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 30000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "REAL_ESTATE", description: "320 acres", appraised_value_cents: 40000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: System }
          trigger:
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer, captures: { asg: $.data.assignment_status } }
            - { call: "POST /loan-accounts/${loan}/activate", as: LoanOfficer, captures: { err2: $.data.error_id } }
          assert:
            - "first activate: error_id == ERR_INSURANCE_NOT_ASSIGNED (safety), NOT ERR_MATURITY_PASSED (temporal), though both hold"
            - "assign succeeds even past maturity (${asg} == ASSIGNED; assign has no maturity gate)"
            - "second activate: error_id == ERR_MATURITY_PASSED once the safety gate passes"
            - "LoanAccount.${loan}.status remains APPROVED after both failures"

  # ---------------------------------------------------------------- rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: draw_at_exact_availability_succeeds_one_cent_over_fails
        grounds:
          - calculations.draw_availability
          - errors[ERR_DRAW_EXCEEDS_AVAILABILITY]
          - state_machines.DrawRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Currency boundary on the draw-approve endpoint: amount exactly equal
          to available credit 19,000,000 approves (<= semantics); one cent
          more (19,000,001) is rejected.
        test_recipe:
          setup:
            - "ACTIVE loan commitment 50,000,000, BB 19,000,000 (crop 12,000,000 + EQUIPMENT 7,000,000); no draws yet"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: System }
            - { call: "POST /associations", payload: { name: "Blackhawk FCS", charter_number: "CH-1850" }, as: AssociationBoard, captures: { assoc: $.data.id } }
            - { call: "POST /borrowers", payload: { association_id: "${assoc}", legal_name: "Sunrise Farms LLC", tax_id: "41-0000001", county: "BLACKHAWK" }, as: LoanOfficer, captures: { bor: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bor}", requested_commitment_cents: 50000000, rate_bps: 700, season_year: 2026, maturity_date: "2027-02-28T00:00:00Z" }, as: LoanOfficer, captures: { loan: $.data.id } }
            - { call: "POST /loan-accounts/${loan}/submit", as: LoanOfficer }
            - { call: "POST /loan-accounts/${loan}/approve", payload: { approved_commitment_cents: 50000000 }, as: CreditCommittee, captures: { loan_v: $.data.version } }
            - { call: "POST /crop-budgets", payload: { loan_account_id: "${loan}", season_year: 2026, crop_type: "CORN", acres: 1000, projected_revenue_cents: 20000000, projected_expenses_cents: 12000000, expected_loan_version: "${loan_v}" }, as: Borrower, as_user_id: "${bor}", captures: { bud: $.data.id } }
            - { call: "POST /crop-budgets/${bud}/approve", as: LoanOfficer }
            - { call: "POST /collateral", payload: { loan_account_id: "${loan}", collateral_type: "EQUIPMENT", description: "Sprayer", appraised_value_cents: 10000000 }, as: LoanOfficer, captures: { col: $.data.id } }
            - { call: "POST /ucc-filings", payload: { collateral_id: "${col}", filing_number: "UCC-26-001", jurisdiction: "STATE_UCC_OFFICE", filed_date: "2026-03-05T00:00:00Z" }, as: LoanOfficer }
            - { call: "POST /insurance-policies", payload: { borrower_id: "${bor}", policy_number: "POL-001", crop_type: "CORN", county: "BLACKHAWK", coverage_start: "2026-03-01T00:00:00Z", coverage_end: "2027-03-01T00:00:00Z", coverage_amount_cents: 40000000 }, as: LoanOfficer, captures: { pol: $.data.id } }
            - { call: "POST /insurance-policies/${pol}/assign", payload: { loan_account_id: "${loan}" }, as: LoanOfficer }
