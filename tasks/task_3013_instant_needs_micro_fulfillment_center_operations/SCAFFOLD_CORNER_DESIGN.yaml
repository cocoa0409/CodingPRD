# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3013_instant_needs_micro_fulfillment_center_operations
#
# Breadth probe over the claim-extraction-guide taxonomy. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because
# stubs. Shared setup chains are declared once with YAML anchors per instance
# where needed; each instance is self-contained.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: site_create_returns_defaults_and_computed_posture
        claim_type: Creation
        grounds:
          - entities.Site
          - endpoints.POST_/sites
        distinguishing_aspect: "A site created without peak_windows defaults it to an empty list, starts OPERATING with effective_status OPERATING, version 1, and server-minted id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /mfc/sites"
              payload: { code: "SITE-Z", name: "Zed MFC", delivery_radius_miles: 3.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_z: $.data.id, site_v: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "Site.${site_z}.status == OPERATING and effective_status == OPERATING"
            - "Site.${site_z}.peak_windows == [] (default applied)"
            - "Site.${site_z}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: customer_get_returns_stored_row_and_zero_wallet
        claim_type: Retrieval
        grounds:
          - entities.Customer
          - endpoints.GET_/customers/{customerId}
        distinguishing_aspect: "A freshly registered customer round-trips through GET with wallet_credit_cents 0 and status ACTIVE; the owning customer may read the row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /mfc/customers"
              payload: { email: "ronda@example.com", full_name: "Ronda Retrieval", date_of_birth: "1995-03-03T00:00:00Z" }
              as: Customer
              captures: { cust_r: $.data.id }
          trigger:
            - call: "GET /mfc/customers/${cust_r}"
              payload: {}
              as: Customer
              as_user_id: "${cust_r}"
          assert:
            - "the response status is 200"
            - "Customer.${cust_r}.email == \"ronda@example.com\" and wallet_credit_cents == 0 and status == ACTIVE"

      - name: orders_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/orders
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three orders on file, limit=2 returns total_count 3 and has_more true; offset=2 returns 1 row with has_more false; defaults are limit 10, offset 0."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. Site SITE-A; product SKU-CHIPS 500; customer; three PLACED orders."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /mfc/orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "the filtered page-1 request (query string customer_id=${cust_id}&limit=2&offset=0) returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /orders?customer_id=${cust_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /orders with no query params returns 3 rows (defaults limit 10, offset 0)"

      - name: product_get_with_unknown_id_returns_product_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/products/{productId}
          - errors.ERR_PRODUCT_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated product id yields the entity-specific 404 ERR_PRODUCT_NOT_FOUND, not a generic not-found."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /mfc/products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SiteOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PRODUCT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: site_create_missing_fee_schedule_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Site.fields.fee_schedule
          - validations[priority=14]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "fee_schedule is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST and no site is persisted."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /mfc/sites"
              payload: { code: "SITE-N", name: "NoFee MFC", delivery_radius_miles: 3.0, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /sites returns 0 rows"

      - name: picker_create_defaults_status_active
        claim_type: Defaults
        grounds:
          - entities.Picker.fields.status
          - endpoints.POST_/pickers
        distinguishing_aspect: "Omitting the optional status field stores ACTIVE rather than null."
        test_recipe:
          setup: ["Empty database; one site."]
          setup_api_calls:
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Default Dan" }
              as: SiteOps
              captures: { picker_d: $.data.id }
          assert:
            - "the response status is 201"
            - "Picker.${picker_d}.status == ACTIVE"

      - name: product_restricted_and_perishable_flags_computed_from_class_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Product.fields.restricted
          - entities.Product.fields.perishable
          - endpoints.POST_/products
        distinguishing_aspect: "restricted and perishable are read-only mirrors of product_class: AGE_RESTRICTED -> restricted true/perishable false; PERISHABLE -> the reverse; STANDARD -> both false; client-supplied values are ignored."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /mfc/products"
              payload: { sku: "SKU-VODKA", name: "Vodka", price_cents: 1500, product_class: "AGE_RESTRICTED", restricted: false, perishable: true }
              as: SiteOps
              captures: { prod_v: $.data.id }
          assert:
            - "the response status is 201"
            - "Product.${prod_v}.restricted == true and perishable == false — supplied mirrors ignored, class drives"

      - name: order_client_supplied_status_and_totals_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Order.fields.status
          - entities.Order.fields.subtotal_cents
          - endpoints.POST_/orders
        distinguishing_aspect: "status and the computed money fields are system/computed sourced; a placement that smuggles status DELIVERED and subtotal_cents 1 still lands PLACED with the true computed subtotal."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. Site SITE-A; product SKU-CHIPS 500; customer."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 2 } ], delivery_distance_miles: 1.0, status: "DELIVERED", subtotal_cents: 1, total_cents: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_sys: $.data.id }
          assert:
            - "the response status is 201"
            - "Order.${o_sys}.status == PLACED and subtotal_cents == 1000 and total_cents == 1199"

      - name: product_create_with_out_of_enum_class_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Product.fields.product_class
          - validations[priority=14]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "product_class is a closed enum {STANDARD, AGE_RESTRICTED, PERISHABLE}; 'HAZMAT' is rejected 400 ERR_INVALID_REQUEST and nothing persists."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /mfc/products"
              payload: { sku: "SKU-X", name: "Mystery", price_cents: 100, product_class: "HAZMAT" }
              as: SiteOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /products returns 0 rows"

      - name: order_body_foreign_keys_checked_in_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - endpoints.POST_/orders
          - errors.ERR_CUSTOMER_NOT_FOUND
          - errors.ERR_SITE_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts customer_id and site_id in the body; priority 3 checks them in the declared input order — with BOTH unknown the answer is ERR_CUSTOMER_NOT_FOUND, and with only site_id unknown it is ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /mfc/orders"
              payload: { customer_id: "00000000-0000-4000-8000-000000000001", site_id: "00000000-0000-4000-8000-000000000002", lines: [ { product_id: "00000000-0000-4000-8000-000000000003", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { err_both: $.data.error_id }
            - call: "POST /mfc/customers"
              payload: { email: "solo@example.com", full_name: "Solo Check", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_solo: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_solo}", site_id: "00000000-0000-4000-8000-000000000002", lines: [ { product_id: "00000000-0000-4000-8000-000000000003", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_solo}"
              captures: { err_site: $.data.error_id }
          assert:
            - "first request: 404 and error_id == ERR_CUSTOMER_NOT_FOUND (declared order: customer before site)"
            - "second request: 404 and error_id == ERR_SITE_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: order_cancel_from_delivered_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Terminal lockdown: cancelling a DELIVERED order fails 409 ERR_INVALID_STATE with no side effects (no wallet refund)."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. Full happy path: SITE-A, SKU-CHIPS stocked, customer, Pat/Sam pickers, Dee driver, order delivered (wallet earned 67)."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Sam Sealer" }
              as: SiteOps
              captures: { picker_2: $.data.id }
            - call: "POST /mfc/drivers"
              payload: { site_id: "${site_id}", name: "Dee Driver", max_run_orders: 4 }
              as: SiteOps
              captures: { driver_1: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 4 } ], delivery_distance_miles: 2.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_done: $.data.id }
            - call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { b_done: $.data.id }
            - call: "POST /mfc/pick-batches/${b_done}/orders"
              payload: { order_id: "${o_done}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${b_done}/seal"
              payload: {}
              as: Picker
              as_user_id: "${picker_2}"
            - call: "POST /mfc/delivery-bags"
              payload: { order_id: "${o_done}" }
              as: SiteOps
              captures: { bag_done: $.data.id }
            - call: "POST /mfc/delivery-bags/${bag_done}/assign"
              payload: {}
              as: SiteOps
            - call: "POST /mfc/delivery-bags/${bag_done}/depart"
              payload: {}
              as: Driver
              as_user_id: "${driver_1}"
            - call: "POST /mfc/delivery-bags/${bag_done}/complete"
              payload: {}
              as: Driver
              as_user_id: "${driver_1}"
          trigger:
            - call: "POST /mfc/orders/${o_done}/cancel"
              payload: { reason: "CUSTOMER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_term: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Order.${o_done}.status is still DELIVERED"
            - "Customer.${cust_id}.wallet_credit_cents == 67 (no refund fired)"

      - name: batch_seal_side_effects_move_every_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.PickBatch.OPEN_to_SEALED
          - state_machines.Order.PICKING_to_AWAITING_HANDOFF
        distinguishing_aspect: "Sealing a two-order batch moves BOTH orders to AWAITING_HANDOFF in one transition and stamps sealed_at/sealed_by_id; the parent batch sits in SEALED."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A, SKU-CHIPS stocked 50, customer, Pat/Sam, two PLACED orders appended to Pat's batch."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
              payload: { sku: "SKU-CHIPS", name: "Chips", price_cents: 500, product_class: "STANDARD" }
              as: SiteOps
              captures: { prod_chips: $.data.id }
            - call: "POST /mfc/inventory-balances"
              payload: { site_id: "${site_id}", product_id: "${prod_chips}", min_par_level: 0 }
              as: SiteOps
              captures: { bal_chips: $.data.id }
            - call: "POST /mfc/inventory-balances/${bal_chips}/adjustments"
              payload: { kind: "RECEIPT", qty: 50, reason: "opening" }
              as: SiteOps
            - call: "POST /mfc/customers"
              payload: { email: "ada@example.com", full_name: "Ada Adult", date_of_birth: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Pat Picker" }
              as: SiteOps
              captures: { picker_1: $.data.id }
            - call: "POST /mfc/pickers"
              payload: { site_id: "${site_id}", name: "Sam Sealer" }
              as: SiteOps
              captures: { picker_2: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 1 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_s1: $.data.id }
            - call: "POST /mfc/orders"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", lines: [ { product_id: "${prod_chips}", qty: 2 } ], delivery_distance_miles: 1.0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o_s2: $.data.id }
            - call: "POST /mfc/pick-batches"
              payload: { site_id: "${site_id}", picker_id: "${picker_1}" }
              as: SiteOps
              captures: { b_two: $.data.id }
            - call: "POST /mfc/pick-batches/${b_two}/orders"
              payload: { order_id: "${o_s1}" }
              as: Picker
              as_user_id: "${picker_1}"
            - call: "POST /mfc/pick-batches/${b_two}/orders"
              payload: { order_id: "${o_s2}" }
              as: Picker
              as_user_id: "${picker_1}"
          trigger:
            - call: "POST /mfc/pick-batches/${b_two}/seal"
              payload: {}
              as: Picker
              as_user_id: "${picker_2}"
          assert:
            - "PickBatch.${b_two}.status == SEALED, sealed_by_id == ${picker_2}, sealed_at non-null"
            - "Order.${o_s1}.status == AWAITING_HANDOFF and Order.${o_s2}.status == AWAITING_HANDOFF"
            - "InventoryBalance.${bal_chips}.on_hand == 47 and reserved == 0"

      - name: batch_auto_closes_when_last_order_terminal
        claim_type: side_effect_execution
        grounds:
          - state_machines.PickBatch.SEALED_to_CLOSED
        distinguishing_aspect: "Compound child-state aggregate: the batch transitions SEALED -> CLOSED automatically only when its last appended order reaches DELIVERED or CANCELLED — one delivered order of two leaves it SEALED."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A, SKU-CHIPS stocked, customer, Pat/Sam, Dee driver; two orders sealed in one batch; two bags assigned to Dee."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
              payload: { code: "SITE-A", name: "Downtown MFC", delivery_radius_miles: 5.0, fee_schedule: { base_cents: 199, per_mile_cents: 99, included_miles: 1.5, peak_surcharge_cents: 150, min_fee_cents: 99, max_fee_cents: 999 }, fee_waiver_threshold_cents: 3000, batch_max_lines: 2, batch_max_items: 20, expiry_horizon_days: 2 }
              as: SiteOps
              captures: { site_id: $.data.id }
            - call: "POST /mfc/products"
