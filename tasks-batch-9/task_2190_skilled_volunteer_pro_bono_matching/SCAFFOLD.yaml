scenario: "2190. Skilled Volunteer & Pro Bono Matching (pro bono matching nonprofit): nonprofit project scoping & deliverable definition, volunteer skill profile & availability matching, engagement agreement & IP/confidentiality terms, milestone check-ins & scope creep management, quality review & handoff of deliverable, volunteer hour valuation for reporting, unsuccessful match & re-scoping, program capacity & partner satisfaction"
domain_name: "pro-bono-matching"
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: quota_allocation
  complexity_layers:
    - selector_policy
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: graph
  # Volunteer <-> ProjectRequest is many-to-many through MatchOffer; ScopeDefinition is
  # self-referential (supersedes_scope_id) forming a revision chain; Engagement is a
  # 6-way junction across PartnerOrg / ProgramCycle / Volunteer / ScopeDefinition trees.
  state_machine_shape: cyclic
  # ProjectRequest: MATCHING -> RESCOPING -> SCOPING -> SCOPED -> MATCHING (re-scoping loop).
  # EngagementAgreement: SENT -> COUNTERED -> SENT (negotiation rounds).
  # QualityReview: SCORED -> REWORK_REQUESTED -> OPEN (rework loop).
  # Engagement carries two independent dimensions (work_status x valuation_status).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # The QualityReviewer who decides a review may not be the ScopingSpecialist who
  # authored the pinned ScopeDefinition, and may never be the engaged Volunteer.
  consistency_model: saga
  # Offer acceptance opens a multi-step saga (agreement negotiation -> delivery ->
  # quality gate -> handoff -> valuation) whose compensations (terminate, restate)
  # must return the reserved capacity slot and volunteer hours exactly.
  difficulty_level: beyond_expert

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: PartnerOrg
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - {name: name, type: string, source: input, description: "Legal name of the nonprofit partner", constraints: "1-160 chars, required"}
      - {name: contact_email, type: string, source: input, description: "Primary partner contact email", constraints: "unique across PartnerOrg, required"}
      - {name: sector, type: enum, source: input, description: "Mission sector of the partner", constraints: "HEALTH | EDUCATION | HOUSING | ENVIRONMENT | ARTS | CIVIC"}
      - {name: annual_budget_usd, type: number, source: input, description: "Self-reported annual operating budget in USD", constraints: ">= 0, 2 decimals"}
      - {name: capacity_class, type: enum, source: computed, description: "Budget band derived from annual_budget_usd by calculation partner_capacity_class", constraints: "MICRO | SMALL | MID | LARGE"}
      - {name: max_concurrent_engagements, type: integer, source: computed, description: "Concurrent open-engagement ceiling implied by capacity_class", constraints: "MICRO=1, SMALL=2, MID=4, LARGE=6"}
      - {name: open_engagement_count, type: integer, source: computed, description: "Count of Engagement rows for this partner with work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}", constraints: ">= 0"}
      - {name: satisfaction_index, type: number, source: computed, description: "Recency-weighted partner satisfaction index produced by calculation partner_satisfaction_index", constraints: "0.00-100.00, 2 decimals, null when satisfaction_sample_size == 0"}
      - {name: satisfaction_sample_size, type: integer, source: computed, description: "Number of SatisfactionSurvey rows with counted_in_index == true", constraints: "0-5"}
      - {name: status, type: enum, source: system, description: "Partner program standing", default: ACTIVE, constraints: "ACTIVE | PROBATION | SUSPENDED"}
      - {name: probation_reason, type: enum, source: system, description: "Why the partner entered PROBATION; null while ACTIVE", constraints: "LOW_SATISFACTION | SCOPE_CREEP_ABUSE | MANUAL | null"}
      - {name: suspended_at, type: datetime, source: system, description: "Logical-clock instant the partner was SUSPENDED; null otherwise"}

  - name: ProgramCycle
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - {name: cycle_code, type: string, source: input, description: "Human program-cycle code such as 2026-Q4", constraints: "unique across ProgramCycle, required"}
      - {name: starts_at, type: datetime, source: input, description: "Inclusive cycle start instant (ISO 8601 UTC)"}
      - {name: ends_at, type: datetime, source: input, description: "Exclusive cycle end instant (ISO 8601 UTC)", constraints: "must be strictly after starts_at"}
      - {name: capacity_slot_total, type: integer, source: input, description: "Total engagement slots the program can staff in this cycle", constraints: ">= 1"}
      - {name: slots_committed, type: integer, source: computed, description: "Count of Engagement rows with cycle_id == this cycle and work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}", constraints: ">= 0"}
      - {name: slots_reserved, type: integer, source: computed, description: "Count of MatchOffer rows with status == OFFERED whose ProjectRequest.cycle_id == this cycle", constraints: ">= 0"}
      - {name: slots_available, type: integer, source: computed, description: "capacity_slot_total - slots_committed - slots_reserved; may go negative only via capacity_slot_total reduction, which is forbidden", constraints: ">= 0"}
      - {name: utilization_ratio, type: number, source: computed, description: "Occupancy ratio produced by calculation cycle_posture", constraints: "4 decimals, >= 0"}
      - {name: posture, type: enum, source: computed, description: "Capacity gate over all child operations, produced by calculation cycle_posture", default: OPEN, constraints: "OPEN | RESTRICTED | FROZEN"}
      - {name: last_recalculated_at, type: datetime, source: system, description: "Logical-clock instant of the most recent capacity recalculation run"}
      - {name: recalc_epoch, type: integer, source: system, description: "Monotonic counter incremented once per POST /program-cycles/{id}/recalculate", default: 0, constraints: ">= 0"}

  - name: ProjectRequest
    parent: PartnerOrg
    common_fields: true
    entity_kind: resource
    fields:
      - {name: partner_org_id, type: string, source: input, description: "FK -> PartnerOrg.id; owning nonprofit partner"}
      - {name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id; program cycle the request competes for capacity in"}
      - {name: title, type: string, source: input, description: "Short project title", constraints: "1-160 chars, required"}
      - {name: discipline, type: enum, source: input, description: "Professional discipline the work falls under", constraints: "LEGAL | ACCOUNTING | TECHNOLOGY | MARKETING | HR | STRATEGY"}
      - {name: required_skill_code, type: string, source: input, description: "Exact SkillProfile.skill_code a candidate volunteer must hold", constraints: "uppercase A-Z0-9_ , 2-32 chars"}
      - {name: min_proficiency, type: integer, source: input, description: "Minimum SkillProfile.proficiency a candidate must hold", constraints: "1-5"}
      - {name: requested_hours, type: number, source: input, description: "Hours the partner believes the work needs", constraints: "> 0, 2 decimals"}
      - {name: urgency, type: enum, source: input, description: "Partner-declared urgency; drives offer TTL and match weighting", default: ROUTINE, constraints: "ROUTINE | ELEVATED | CRITICAL"}
      - {name: status, type: enum, source: system, description: "Request lifecycle state", default: DRAFT, constraints: "DRAFT | SCOPING | SCOPED | MATCHING | RESCOPING | ENGAGED | IN_DELIVERY | CLOSED | ABANDONED"}
      - {name: active_scope_revision_no, type: integer, source: computed, description: "revision_no of the single ScopeDefinition of this request whose status == APPROVED; 0 when none", default: 0, constraints: ">= 0"}
      - {name: rescope_count, type: integer, source: system, description: "Number of times this request has entered RESCOPING", default: 0, constraints: "0-3"}
      - {name: failed_match_rounds, type: integer, source: system, description: "Count of match attempts that produced no offer or whose offer ended DECLINED/EXPIRED", default: 0, constraints: ">= 0"}
      - {name: closed_at, type: datetime, source: system, description: "Logical-clock instant status became CLOSED or ABANDONED; null otherwise"}

  - name: ScopeDefinition
    parent: ProjectRequest
    common_fields: true
    entity_kind: resource
    fields:
      - {name: project_request_id, type: string, source: input, description: "FK -> ProjectRequest.id; request this scope revision belongs to"}
      - {name: supersedes_scope_id, type: string, source: input, description: "FK -> ScopeDefinition.id; the prior revision this one replaces, null for revision_no 1"}
      - {name: revision_no, type: integer, source: computed, description: "max(revision_no) of sibling ScopeDefinition rows on the same request + 1", constraints: ">= 1"}
      - {name: authored_by_user_id, type: string, source: system, description: "X-User-ID of the ScopingSpecialist who created this revision; used by the segregation-of-duties check"}
      - {name: estimated_hours, type: number, source: input, description: "Scoped effort before complexity adjustment", constraints: "> 0, <= 400, 2 decimals"}
      - {name: complexity_factor, type: number, source: input, description: "Multiplier applied to estimated_hours when committing hours", constraints: "1.00-2.50, 2 decimals"}
      - {name: confidentiality_tier, type: enum, source: input, description: "Confidentiality regime the deliverable falls under", constraints: "STANDARD | ELEVATED | RESTRICTED"}
      - {name: ip_disposition, type: enum, source: input, description: "Intended intellectual-property disposition for produced work", constraints: "ASSIGN_TO_PARTNER | LICENSE_PERPETUAL | RETAINED_BY_VOLUNTEER"}
      - {name: deliverable_weight_total_pct, type: number, source: computed, description: "Sum of Deliverable.weight_pct over child deliverables whose review_status != WAIVED", default: 0, constraints: "2 decimals"}
      - {name: deliverable_count, type: integer, source: computed, description: "Count of child Deliverable rows", default: 0, constraints: ">= 0"}
      - {name: status, type: enum, source: system, description: "Scope revision state", default: DRAFT, constraints: "DRAFT | APPROVED | SUPERSEDED | WITHDRAWN"}
      - {name: approved_at, type: datetime, source: system, description: "Logical-clock instant status became APPROVED; null otherwise"}
      - {name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the PartnerContact who approved this revision; null while DRAFT"}

  - name: Deliverable
    parent: ScopeDefinition
    common_fields: false
    entity_kind: resource
    fields:
      - {name: scope_definition_id, type: string, source: input, description: "FK -> ScopeDefinition.id; scope revision this deliverable belongs to"}
      - {name: title, type: string, source: input, description: "Deliverable name", constraints: "1-120 chars"}
      - {name: sequence_no, type: integer, source: input, description: "Ordering index used as the primary sort key for quality scoring", constraints: ">= 1, unique within scope_definition_id"}
      - {name: weight_pct, type: number, source: input, description: "Share of the deliverable set this item represents", constraints: "0.01-100.00, 2 decimals"}
      - {name: hours_estimate, type: number, source: input, description: "Scoped hours for this item", constraints: "> 0, 2 decimals"}
      - {name: acceptance_criteria, type: string, source: input, description: "Prose acceptance bar used by the quality reviewer", constraints: "1-500 chars"}
      - {name: review_status, type: enum, source: system, description: "Per-deliverable quality outcome", default: PENDING, constraints: "PENDING | ACCEPTED | REJECTED | WAIVED"}
      - {name: review_score, type: integer, source: input, description: "Reviewer score on the 0-5 rubric; null until scored", constraints: "0-5 or null"}
      - {name: waived_reason, type: enum, source: system, description: "Why the deliverable was excluded from scoring; null unless review_status == WAIVED", constraints: "DESCOPED_BY_CHANGE | PARTNER_WITHDRAWN | null"}

  - name: Volunteer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - {name: full_name, type: string, source: input, description: "Volunteer display name", constraints: "1-120 chars"}
      - {name: email, type: string, source: input, description: "Volunteer email", constraints: "unique across Volunteer, required"}
      - {name: professional_rate_usd_per_hour, type: number, source: input, description: "Self-declared professional billing rate used by the MARKET_RATE valuation variant", constraints: "> 0, <= 2000.00, 2 decimals"}
      - {name: seniority, type: enum, source: input, description: "Career level; selects the market-rate cap and the match-score multiplier", constraints: "ASSOCIATE | SENIOR | PRINCIPAL | PARTNER"}
      - {name: weekly_hours_cap, type: integer, source: input, description: "Maximum hours per week the volunteer will accept", constraints: "1-40"}
      - {name: credential_verified_at, type: datetime, source: system, description: "Logical-clock instant vetting completed; null while unvetted"}
      - {name: reliability_score, type: number, source: computed, description: "Recency-decayed reliability produced by calculation volunteer_reliability_score variant DECAY_WEIGHTED", default: 0.7500, constraints: "0.0000-1.0000, 4 decimals"}
      - {name: reliability_score_lifetime, type: number, source: computed, description: "Unweighted reliability produced by calculation volunteer_reliability_score variant LIFETIME_AVERAGE", default: 0.7500, constraints: "0.0000-1.0000, 4 decimals"}
      - {name: terminal_engagement_count, type: integer, source: computed, description: "Count of Engagement rows for this volunteer with work_status IN {HANDED_OFF, TERMINATED}", default: 0, constraints: ">= 0"}
      - {name: open_engagement_count, type: integer, source: computed, description: "Count of Engagement rows for this volunteer with work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED}", default: 0, constraints: ">= 0"}
      - {name: lifetime_valued_usd, type: number, source: computed, description: "Reporting total defined by invariant INV_VALUATION_CONSERVATION over non-superseded INDEPENDENT_SECTOR ValuationRecord rows", default: 0, constraints: "2 decimals, >= 0"}
      - {name: status, type: enum, source: system, description: "Volunteer roster standing", default: PENDING_VETTING, constraints: "PENDING_VETTING | ACTIVE | PAUSED | DEACTIVATED"}
      - {name: pause_reason, type: enum, source: system, description: "Why the volunteer is PAUSED; null otherwise", constraints: "RELIABILITY_FLOOR | SELF_REQUESTED | ADMIN | null"}

  - name: SkillProfile
    parent: Volunteer
    common_fields: false
    entity_kind: configuration
    fields:
      - {name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; owner of this skill claim"}
      - {name: skill_code, type: string, source: input, description: "Skill identifier matched exactly against ProjectRequest.required_skill_code", constraints: "uppercase A-Z0-9_ , 2-32 chars, unique per (volunteer_id, skill_code)"}
      - {name: proficiency, type: integer, source: input, description: "Self-rated proficiency; selects the SKILL_TIER_WEIGHT row in calculation match_score", constraints: "1-5"}
      - {name: years_experience, type: number, source: input, description: "Years of hands-on experience", constraints: ">= 0, <= 60, 1 decimal"}
      - {name: verified, type: boolean, source: system, description: "True once a ProgramManager vetting run confirmed the claim; grants VERIFIED_SKILL_BONUS", default: false}
      - {name: verified_at, type: datetime, source: system, description: "Logical-clock instant verified flipped to true; null otherwise"}

  - name: AvailabilityWindow
    parent: Volunteer
    common_fields: false
    entity_kind: resource
    fields:
      - {name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; owner of this window"}
      - {name: starts_at, type: datetime, source: input, description: "Inclusive window start; window geometry is half-open [starts_at, ends_at)"}
      - {name: ends_at, type: datetime, source: input, description: "Exclusive window end", constraints: "must be strictly after starts_at"}
      - {name: window_kind, type: enum, source: input, description: "HARD windows are the volunteer's guaranteed capacity, SOFT windows are best-effort; HARD sorts ahead of SOFT in window selection", constraints: "HARD | SOFT"}
      - {name: hours_offered, type: number, source: input, description: "Hours the volunteer offers inside this window", constraints: "> 0, <= 400, 2 decimals"}
      - {name: hours_committed, type: number, source: computed, description: "Hours held against this window, governed by invariant INV_VOLUNTEER_HOUR_CONSERVATION", default: 0, constraints: ">= 0, 2 decimals"}
      - {name: hours_remaining, type: number, source: computed, description: "hours_offered - hours_committed", constraints: ">= 0, 2 decimals"}
      - {name: status, type: enum, source: computed, description: "OPEN while hours_remaining > 0 and clock < ends_at; EXHAUSTED when hours_remaining == 0; EXPIRED once clock >= ends_at", default: OPEN, constraints: "OPEN | EXHAUSTED | EXPIRED"}

  - name: MatchOffer
    parent: ProjectRequest
    common_fields: true
    entity_kind: resource
    fields:
      - {name: project_request_id, type: string, source: input, description: "FK -> ProjectRequest.id; request being staffed"}
      - {name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; volunteer chosen by the selector in calculation match_score"}
      - {name: scope_definition_id, type: string, source: system, description: "FK -> ScopeDefinition.id; the APPROVED revision pinned at offer time"}
      - {name: availability_window_id, type: string, source: system, description: "FK -> AvailabilityWindow.id; window the reserved hours are held against"}
      - {name: round_no, type: integer, source: computed, description: "Matching round on the parent request; equals ProjectRequest.failed_match_rounds + 1 at offer time", constraints: ">= 1"}
      - {name: match_score, type: number, source: computed, description: "Ranking score produced by calculation match_score for the winning candidate", constraints: "0.0000-1.2000, 4 decimals"}
      - {name: reserved_hours, type: number, source: computed, description: "round(ScopeDefinition.estimated_hours * ScopeDefinition.complexity_factor, 2) at offer time", constraints: "> 0, 2 decimals"}
      - {name: offered_at, type: datetime, source: system, description: "Logical-clock instant the offer was created"}
      - {name: expires_at, type: datetime, source: computed, description: "offered_at + OFFER_TTL_HOURS[ProjectRequest.urgency]"}
      - {name: status, type: enum, source: system, description: "Offer state", default: OFFERED, constraints: "OFFERED | ACCEPTED | DECLINED | EXPIRED | WITHDRAWN"}
      - {name: decline_reason, type: enum, source: input, description: "Volunteer's stated reason; null unless status == DECLINED", constraints: "SCOPE_TOO_LARGE | SCHEDULE_CONFLICT | OUTSIDE_EXPERTISE | IP_TERMS_UNACCEPTABLE | null"}
      - {name: withdraw_reason, type: enum, source: system, description: "System or staff reason; null unless status == WITHDRAWN", constraints: "CYCLE_FROZEN | RESCOPED | PARTNER_SUSPENDED | VOLUNTEER_PAUSED | ADMIN | null"}
      - {name: responded_at, type: datetime, source: system, description: "Logical-clock instant the offer left OFFERED; null while OFFERED"}

  - name: Engagement
    parent: ProjectRequest
    common_fields: true
    entity_kind: resource
    fields:
      - {name: match_offer_id, type: string, source: system, description: "FK -> MatchOffer.id; accepted offer that created this engagement"}
      - {name: project_request_id, type: string, source: system, description: "FK -> ProjectRequest.id; request being delivered"}
      - {name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; engaged volunteer"}
      - {name: scope_definition_id, type: string, source: system, description: "FK -> ScopeDefinition.id; scope revision pinned at acceptance and never re-pointed"}
      - {name: cycle_id, type: string, source: system, description: "FK -> ProgramCycle.id; cycle whose slot this engagement occupies"}
      - {name: availability_window_id, type: string, source: system, description: "FK -> AvailabilityWindow.id; window holding this engagement's committed hours"}
      - {name: committed_hours, type: number, source: computed, description: "Hour baseline for scope-creep math; seeded from MatchOffer.reserved_hours and increased only by an APPROVED ScopeChangeRequest", constraints: "> 0, 2 decimals"}
      - {name: approved_hours, type: number, source: computed, description: "Sum of TimeLog.hours over child logs with approved == true, all activity classes", default: 0, constraints: ">= 0, 2 decimals"}
      - {name: scope_creep_pct, type: number, source: computed, description: "Creep ratio produced by calculation scope_creep_pct", default: 0, constraints: "4 decimals, may be negative"}
      - {name: creep_escalation_level, type: enum, source: computed, description: "Threshold band of scope_creep_pct produced by calculation scope_creep_pct", default: NONE, constraints: "NONE | WATCH | ESCALATED | BREACH"}
      - {name: work_status, type: enum, source: system, description: "Delivery dimension of the engagement, independent of valuation_status", default: NOT_STARTED, constraints: "NOT_STARTED | IN_PROGRESS | SUBMITTED | ACCEPTED | HANDED_OFF | TERMINATED"}
      - {name: valuation_status, type: enum, source: system, description: "Reporting dimension of the engagement, independent of work_status", default: UNVALUED, constraints: "UNVALUED | PROVISIONAL | FINAL | RESTATED"}
      - {name: quality_gate, type: enum, source: computed, description: "Latest decided QualityReview outcome on this engagement", default: PENDING, constraints: "PENDING | PASSED | CONDITIONAL | FAILED"}
      - {name: confidentiality_attested, type: boolean, source: input, description: "True once the handoff request carried the confidentiality attestation matching the pinned scope tier", default: false}
      - {name: handoff_artifact_count, type: integer, source: input, description: "Number of artifacts transferred at handoff", default: 0, constraints: ">= 0"}
      - {name: missed_checkin_count, type: integer, source: computed, description: "Count of child Milestone rows with checkin_status == MISSED", default: 0, constraints: ">= 0"}
      - {name: handoff_at, type: datetime, source: system, description: "Logical-clock instant work_status became HANDED_OFF; null otherwise"}
      - {name: terminated_at, type: datetime, source: system, description: "Logical-clock instant work_status became TERMINATED; null otherwise"}
      - {name: termination_reason, type: enum, source: system, description: "Why the engagement was terminated; null unless work_status == TERMINATED", constraints: "QUALITY_FAILURE | SCOPE_BREACH | AGREEMENT_VOIDED | PARTNER_SUSPENDED | ADMIN | null"}

  - name: EngagementAgreement
    parent: Engagement
    common_fields: true
    entity_kind: resource
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement these terms govern"}
      - {name: ip_disposition, type: enum, source: input, description: "IP disposition on the current terms revision; seeded from the pinned ScopeDefinition.ip_disposition", constraints: "ASSIGN_TO_PARTNER | LICENSE_PERPETUAL | RETAINED_BY_VOLUNTEER"}
      - {name: confidentiality_tier, type: enum, source: input, description: "Confidentiality regime on the current terms revision; seeded from the pinned ScopeDefinition.confidentiality_tier", constraints: "STANDARD | ELEVATED | RESTRICTED"}
      - {name: indemnity_cap_usd, type: number, source: input, description: "Liability cap accepted by the volunteer", constraints: ">= 0, <= 100000.00, 2 decimals"}
      - {name: counter_round, type: integer, source: system, description: "Number of counters recorded; MAX_COUNTER_ROUNDS caps it at 3", default: 0, constraints: "0-3"}
      - {name: terms_revision_no, type: integer, source: computed, description: "counter_round + 1; the revision the signatures attach to", constraints: ">= 1"}
      - {name: last_countered_by, type: enum, source: system, description: "Party that submitted the most recent counter; null before the first counter", constraints: "VOLUNTEER | PARTNER | null"}
      - {name: volunteer_signed_at, type: datetime, source: system, description: "Logical-clock instant the volunteer executed the current terms revision; cleared to null on every counter"}
      - {name: partner_signed_at, type: datetime, source: system, description: "Logical-clock instant the partner executed the current terms revision; cleared to null on every counter"}
      - {name: status, type: enum, source: system, description: "Agreement negotiation state", default: DRAFTED, constraints: "DRAFTED | SENT | COUNTERED | EXECUTED | VOIDED"}
      - {name: void_reason, type: enum, source: system, description: "Why the agreement was voided; null unless status == VOIDED", constraints: "COUNTER_LIMIT_EXCEEDED | TERMS_REJECTED | ENGAGEMENT_TERMINATED | null"}

  - name: Milestone
    parent: Engagement
    common_fields: true
    entity_kind: resource
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement being checked in on"}
      - {name: sequence_no, type: integer, source: computed, description: "max(sequence_no) among sibling milestones + 1", constraints: ">= 1"}
      - {name: due_at, type: datetime, source: input, description: "Scheduled check-in instant; spacing is governed by CHECKIN_BUFFER_HOURS on the engagement and by the rolling saturation window on the volunteer"}
      - {name: checkin_status, type: enum, source: system, description: "Check-in outcome", default: SCHEDULED, constraints: "SCHEDULED | HELD | MISSED | WAIVED"}
      - {name: held_at, type: datetime, source: system, description: "Logical-clock instant the check-in was held; null otherwise"}
      - {name: reported_cumulative_hours, type: number, source: input, description: "Cumulative hours the volunteer reports as of this check-in; null while SCHEDULED", constraints: ">= 0, 2 decimals or null"}
      - {name: variance_hours, type: number, source: computed, description: "reported_cumulative_hours - Engagement.approved_hours measured at hold time; null while SCHEDULED", constraints: "2 decimals or null"}
      - {name: escalation_raised, type: boolean, source: computed, description: "True when the hold observed Engagement.creep_escalation_level IN {ESCALATED, BREACH}", default: false}
      - {name: waiver_reason, type: enum, source: system, description: "Why the check-in was waived; null unless checkin_status == WAIVED", constraints: "RESCOPED | ENGAGEMENT_TERMINATED | ADMIN | null"}

  - name: TimeLog
    parent: Engagement
    common_fields: false
    entity_kind: event
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement the work belongs to"}
      - {name: milestone_id, type: string, source: system, description: "FK -> Milestone.id; the milestone whose hold approved this log, null while unapproved"}
      - {name: work_date, type: datetime, source: input, description: "Instant the work was performed; must fall inside the pinned availability window"}
      - {name: hours, type: number, source: input, description: "Hours worked on this log line", constraints: "> 0, <= 12.00, 2 decimals"}
      - {name: activity_class, type: enum, source: input, description: "Work classification driving the MARKET_RATE class factor", constraints: "DELIVERY | ADMIN | TRAVEL"}
      - {name: rate_basis_usd, type: number, source: system, description: "Snapshot of Volunteer.professional_rate_usd_per_hour at log creation, used by MARKET_RATE valuation", constraints: "> 0, 2 decimals"}
      - {name: approved, type: boolean, source: system, description: "True once a Milestone hold or the submit transition approved this log", default: false}
      - {name: approved_at, type: datetime, source: system, description: "Logical-clock instant approved flipped to true; null otherwise"}
      - {name: logged_by_user_id, type: string, source: system, description: "X-User-ID of the Volunteer who submitted the log"}

  - name: ScopeChangeRequest
    parent: Engagement
    common_fields: true
    entity_kind: resource
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement whose scope is being changed"}
      - {name: requested_by, type: enum, source: system, description: "Party that raised the change, derived from the caller's role", constraints: "VOLUNTEER | PARTNER"}
      - {name: additional_hours, type: number, source: input, description: "Extra hours requested on top of Engagement.committed_hours", constraints: ">= 0, <= 200.00, 2 decimals"}
      - {name: additional_deliverable_count, type: integer, source: input, description: "Extra deliverables requested", constraints: "0-10"}
      - {name: justification, type: string, source: input, description: "Free-text rationale", constraints: "1-500 chars"}
      - {name: projected_creep_pct, type: number, source: computed, description: "Creep ratio this change would produce, from calculation scope_change_projection", constraints: "4 decimals"}
      - {name: decision_tier, type: enum, source: computed, description: "Routing band from calculation scope_change_projection", constraints: "AUTO_APPROVABLE | MANAGER_REVIEW | RESCOPE_REQUIRED"}
      - {name: status, type: enum, source: system, description: "Change-request state", default: PENDING, constraints: "PENDING | APPROVED | REJECTED | ESCALATED | VOIDED"}
      - {name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramManager who decided; null while PENDING or ESCALATED"}
      - {name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the decision; null while PENDING or ESCALATED"}
      - {name: resulting_scope_revision_no, type: integer, source: system, description: "revision_no of the ScopeDefinition created by the forced rescope this change triggered; null when no rescope followed", constraints: ">= 2 or null"}

  - name: QualityReview
    parent: Engagement
    common_fields: true
    entity_kind: resource
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement under review"}
      - {name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the QualityReviewer who opened the review; must differ from ScopeDefinition.authored_by_user_id of the pinned scope"}
      - {name: round_no, type: integer, source: computed, description: "max(round_no) among sibling reviews + 1; increments on every rework loop", constraints: ">= 1"}
      - {name: scored_deliverable_count, type: integer, source: computed, description: "Count of non-WAIVED Deliverable rows on the pinned scope carrying a non-null review_score", default: 0, constraints: ">= 0"}
      - {name: weighted_score, type: number, source: computed, description: "Rubric score produced by calculation deliverable_quality_score", constraints: "0.00-100.00, 2 decimals, null before scoring"}
      - {name: outcome, type: enum, source: computed, description: "Decision band of weighted_score", default: PENDING, constraints: "PENDING | PASS | CONDITIONAL | FAIL"}
      - {name: status, type: enum, source: system, description: "Review workflow state", default: OPEN, constraints: "OPEN | SCORED | DECIDED | REWORK_REQUESTED"}
      - {name: rework_deadline_at, type: datetime, source: computed, description: "decided_at + REWORK_WINDOW_HOURS; null unless status == REWORK_REQUESTED"}
      - {name: decided_at, type: datetime, source: system, description: "Logical-clock instant status became DECIDED or REWORK_REQUESTED; null otherwise"}

  - name: SatisfactionSurvey
    parent: Engagement
    common_fields: false
    entity_kind: event
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement being rated"}
      - {name: partner_org_id, type: string, source: system, description: "FK -> PartnerOrg.id; partner submitting the rating, copied from the engagement"}
      - {name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission; primary sort key of the satisfaction index window"}
      - {name: score_expertise, type: integer, source: input, description: "Rating of volunteer expertise", constraints: "1-5"}
      - {name: score_responsiveness, type: integer, source: input, description: "Rating of volunteer responsiveness", constraints: "1-5"}
      - {name: score_deliverable_fit, type: integer, source: input, description: "Rating of deliverable fit to the scoped need", constraints: "1-5"}
      - {name: would_recommend, type: boolean, source: input, description: "Whether the partner would take another engagement with this volunteer"}
      - {name: composite_score, type: number, source: computed, description: "Per-survey 0-100 composite produced by calculation partner_satisfaction_index step 1", constraints: "0.00-100.00, 2 decimals"}
      - {name: counted_in_index, type: boolean, source: computed, description: "True when this survey is one of the latest five surveys entering PartnerOrg.satisfaction_index", default: false}

  - name: ValuationRecord
    parent: Engagement
    common_fields: true
    entity_kind: event
    fields:
      - {name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement whose hours are valued"}
      - {name: method, type: enum, source: input, description: "Valuation variant applied", constraints: "MARKET_RATE | INDEPENDENT_SECTOR"}
      - {name: sequence_no, type: integer, source: computed, description: "max(sequence_no) among sibling records of the same method + 1", constraints: ">= 1"}
      - {name: hours_included, type: number, source: computed, description: "Hours the variant admitted; MARKET_RATE excludes TRAVEL logs, INDEPENDENT_SECTOR admits every approved log", constraints: ">= 0, 2 decimals"}
      - {name: rate_applied_usd, type: number, source: computed, description: "Effective hourly rate the variant used", constraints: ">= 0, 2 decimals"}
      - {name: base_amount_usd, type: number, source: computed, description: "Pre-overhead valuation from calculation volunteer_hour_valuation", constraints: ">= 0, 2 decimals"}
      - {name: admin_overhead_usd, type: number, source: computed, description: "Program overhead from calculation engagement_admin_overhead, keyed on base_amount_usd", constraints: ">= 0, 2 decimals"}
      - {name: total_amount_usd, type: number, source: computed, description: "base_amount_usd + admin_overhead_usd", constraints: ">= 0, 2 decimals"}
      - {name: variant_label, type: enum, source: system, description: "Reporting stage this record represents", constraints: "PROVISIONAL | FINAL | RESTATED"}
      - {name: superseded_at, type: datetime, source: system, description: "Logical-clock instant a later record of the same method replaced this one; null while current"}
      - {name: posted_at, type: datetime, source: system, description: "Logical-clock instant the record was posted"}

state_machines:
  - entity: PartnerOrg
    state_field: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system, evaluated at the end of POST /engagements/{id}/satisfaction-surveys"
        actor: system
        preconditions: ["PartnerOrg.satisfaction_sample_size >= 3", "PartnerOrg.satisfaction_index < 55.00"]
        side_effects:
          - "set probation_reason = LOW_SATISFACTION"
          - "no in-flight Engagement is disturbed; only new MatchOffer creation is blocked while PROBATION"
      - from: PROBATION
        to: ACTIVE
        trigger: "system, evaluated at the end of POST /engagements/{id}/satisfaction-surveys"
        actor: system
        preconditions: ["PartnerOrg.satisfaction_sample_size >= 3", "PartnerOrg.satisfaction_index >= 70.00"]
        side_effects: ["clear probation_reason to null"]
        note: "Recovery band deliberately differs from the entry band (55.00) so the machine cannot oscillate on a single survey."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /partner-orgs/{id}/status with to_status = SUSPENDED"
        actor: ProgramManager
        preconditions: ["caller role is ProgramManager"]
        side_effects:
          - "stamp suspended_at = logical clock"
          - "every ProjectRequest of this partner with status IN {DRAFT, SCOPING, SCOPED, MATCHING, RESCOPING} moves to ABANDONED"
          - "each ABANDONED request cascades: its MatchOffer rows with status == OFFERED move to WITHDRAWN with withdraw_reason = PARTNER_SUSPENDED"
          - "each WITHDRAWN offer cascades: AvailabilityWindow.hours_committed -= MatchOffer.reserved_hours and ProgramCycle.slots_reserved is recomputed"
          - "every Engagement of this partner with work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED} moves to TERMINATED with termination_reason = PARTNER_SUSPENDED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "PATCH /partner-orgs/{id}/status with to_status = SUSPENDED"
        actor: ProgramManager
        preconditions: ["caller role is ProgramManager"]
        side_effects: ["identical cascade to the ACTIVE -> SUSPENDED transition"]

  - entity: ProjectRequest
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, ABANDONED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SCOPING
        trigger: "POST /project-requests/{id}/submit-for-scoping"
        actor: PartnerContact
        preconditions:
          - "caller X-User-ID == ProjectRequest.partner_org_id"
          - "PartnerOrg.status == ACTIVE"
          - "logical clock < ProgramCycle.ends_at"
        side_effects: ["none beyond updated_at / version increment"]
      - from: SCOPING
        to: SCOPED
        trigger: "POST /scope-definitions/{id}/approve"
        actor: PartnerContact
        preconditions:
          - "ScopeDefinition.status == DRAFT and its project_request_id == this request"
          - "ScopeDefinition.deliverable_count >= 1"
          - "ScopeDefinition.deliverable_weight_total_pct == 100.00"
          - "PartnerOrg.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "ScopeDefinition.status DRAFT -> APPROVED, stamp approved_at and approved_by_user_id"
          - "any sibling ScopeDefinition with status == APPROVED moves to SUPERSEDED"
          - "recompute ProjectRequest.active_scope_revision_no from the newly APPROVED revision"
      - from: SCOPED
        to: MATCHING
        trigger: "POST /project-requests/{id}/match"
        actor: ScopingSpecialist
        preconditions:
          - "active_scope_revision_no >= 1"
          - "ProgramCycle.posture != FROZEN"
          - "ProgramCycle.posture == RESTRICTED implies urgency IN {ELEVATED, CRITICAL}"
          - "PartnerOrg.status == ACTIVE"
          - "PartnerOrg.open_engagement_count < PartnerOrg.max_concurrent_engagements"
          - "the selector in calculation match_score yields a non-empty candidate set"
        side_effects:
          - "create MatchOffer with status OFFERED, pinned scope_definition_id, reserved_hours, match_score, expires_at"
          - "AvailabilityWindow.hours_committed += MatchOffer.reserved_hours on the selected window"
          - "ProgramCycle.slots_reserved += 1 and calculation cycle_posture reruns, possibly moving posture OPEN -> RESTRICTED -> FROZEN"
      - from: MATCHING
        to: ENGAGED
        trigger: "POST /match-offers/{id}/accept"
        actor: Volunteer
        preconditions: ["MatchOffer.status == OFFERED", "logical clock < MatchOffer.expires_at"]
        side_effects:
          - "create Engagement (work_status NOT_STARTED, valuation_status UNVALUED) pinned to the offer's scope_definition_id"
          - "ProgramCycle.slots_reserved -= 1 and slots_committed += 1; cycle_posture reruns"
          - "sibling MatchOffer rows of the same request with status == OFFERED move to WITHDRAWN with withdraw_reason = ADMIN"
      - from: MATCHING
        to: SCOPED
        trigger: "POST /match-offers/{id}/decline, POST /match-offers/{id}/withdraw, or the expiry sweep inside POST /program-cycles/{id}/recalculate"
        actor: Volunteer | ScopingSpecialist | system
        preconditions:
          - "MatchOffer.status == OFFERED"
          - "ProjectRequest.failed_match_rounds + 1 < MAX_MATCH_ROUNDS (2)"
        side_effects:
          - "MatchOffer.status -> DECLINED | WITHDRAWN | EXPIRED with responded_at stamped"
          - "AvailabilityWindow.hours_committed -= MatchOffer.reserved_hours"
          - "ProgramCycle.slots_reserved -= 1 and cycle_posture reruns"
          - "ProjectRequest.failed_match_rounds += 1"
      - from: MATCHING
        to: RESCOPING
        trigger: "POST /match-offers/{id}/decline, POST /match-offers/{id}/withdraw, or the expiry sweep inside POST /program-cycles/{id}/recalculate"
        actor: Volunteer | ScopingSpecialist | system
        preconditions:
          - "MatchOffer.status == OFFERED"
          - "ProjectRequest.failed_match_rounds + 1 >= MAX_MATCH_ROUNDS (2)"
          - "ProjectRequest.rescope_count < MAX_RESCOPES (3)"
        side_effects:
          - "same offer-release side effects as MATCHING -> SCOPED"
          - "ProjectRequest.failed_match_rounds += 1 then reset to 0"
          - "ProjectRequest.rescope_count += 1"
          - "the currently APPROVED ScopeDefinition moves to SUPERSEDED and active_scope_revision_no resets to 0"
        note: "Unsuccessful-match path. When rescope_count has already reached MAX_RESCOPES the request goes to ABANDONED instead."
      - from: MATCHING
        to: ABANDONED
        trigger: "POST /match-offers/{id}/decline, POST /match-offers/{id}/withdraw, or the expiry sweep inside POST /program-cycles/{id}/recalculate"
        actor: Volunteer | ScopingSpecialist | system
        preconditions:
          - "ProjectRequest.failed_match_rounds + 1 >= MAX_MATCH_ROUNDS (2)"
          - "ProjectRequest.rescope_count >= MAX_RESCOPES (3)"
        side_effects:
          - "same offer-release side effects as MATCHING -> SCOPED"
          - "stamp closed_at, move the APPROVED ScopeDefinition to SUPERSEDED"
      - from: RESCOPING
        to: SCOPING
        trigger: "POST /project-requests/{id}/rescope"
        actor: ScopingSpecialist
        preconditions: ["ProjectRequest.status == RESCOPING", "ProjectRequest.rescope_count <= MAX_RESCOPES (3)"]
        side_effects: ["every Milestone with checkin_status == SCHEDULED on any live Engagement of this request moves to WAIVED with waiver_reason = RESCOPED"]
        note: "Completes the re-scoping cycle: SCOPING -> SCOPED -> MATCHING can run again on a fresh ScopeDefinition revision."
      - from: IN_DELIVERY
        to: RESCOPING
        trigger: "system, on POST /engagements/{id}/scope-change-requests whose decision_tier == RESCOPE_REQUIRED"
        actor: system
        preconditions: ["ScopeChangeRequest.decision_tier == RESCOPE_REQUIRED", "ProjectRequest.rescope_count < MAX_RESCOPES (3)"]
        side_effects:
          - "ScopeChangeRequest.status -> ESCALATED"
          - "Engagement.work_status -> TERMINATED with termination_reason = SCOPE_BREACH"
          - "that termination cascades the full Engagement termination chain (slot release, hour release, valuation restatement, reliability recompute)"
          - "ProjectRequest.rescope_count += 1"
      - from: ENGAGED
        to: IN_DELIVERY
        trigger: "POST /engagements/{id}/start"
        actor: Volunteer
        preconditions: ["Engagement.work_status == NOT_STARTED", "EngagementAgreement.status == EXECUTED"]
        side_effects: ["none beyond updated_at / version increment"]
      - from: IN_DELIVERY
        to: CLOSED
        trigger: "POST /engagements/{id}/handoff"
        actor: ProgramManager
        preconditions: ["Engagement.work_status == ACCEPTED", "Engagement.confidentiality_attested == true"]
        side_effects: ["stamp closed_at", "Engagement.work_status ACCEPTED -> HANDED_OFF"]
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /project-requests/{id}/abandon"
        actor: ProgramManager
        preconditions: ["ProjectRequest.status IN {DRAFT, SCOPING, SCOPED, MATCHING, RESCOPING}"]
        side_effects: ["stamp closed_at", "release any OFFERED MatchOffer exactly as MATCHING -> SCOPED does"]
      - from: SCOPING
        to: ABANDONED
        trigger: "POST /project-requests/{id}/abandon"
        actor: ProgramManager
        preconditions: ["ProjectRequest.status IN {DRAFT, SCOPING, SCOPED, MATCHING, RESCOPING}"]
        side_effects: ["stamp closed_at", "every ScopeDefinition with status IN {DRAFT, APPROVED} moves to WITHDRAWN"]
      - from: SCOPED
        to: ABANDONED
        trigger: "POST /project-requests/{id}/abandon"
        actor: ProgramManager
        preconditions: ["ProjectRequest.status IN {DRAFT, SCOPING, SCOPED, MATCHING, RESCOPING}"]
        side_effects: ["stamp closed_at", "every ScopeDefinition with status IN {DRAFT, APPROVED} moves to WITHDRAWN"]
      - from: RESCOPING
        to: ABANDONED
        trigger: "POST /project-requests/{id}/abandon"
        actor: ProgramManager
        preconditions: ["ProjectRequest.status IN {DRAFT, SCOPING, SCOPED, MATCHING, RESCOPING}"]
        side_effects: ["stamp closed_at"]
      - from: IN_DELIVERY
        to: ABANDONED
        trigger: "system, on Engagement.work_status -> TERMINATED with termination_reason IN {QUALITY_FAILURE, AGREEMENT_VOIDED} once ProjectRequest.rescope_count >= MAX_RESCOPES (3)"
        actor: system
        preconditions: ["no live Engagement remains on the request", "ProjectRequest.rescope_count >= MAX_RESCOPES (3)"]
        side_effects: ["stamp closed_at"]

  - entity: ScopeDefinition
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, WITHDRAWN]
    shape: branching
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /scope-definitions/{id}/approve"
        actor: PartnerContact
        preconditions:
          - "caller X-User-ID == ProjectRequest.partner_org_id of the parent request"
          - "ProjectRequest.status == SCOPING"
          - "deliverable_count >= 1 and deliverable_weight_total_pct == 100.00"
        side_effects:
          - "ProjectRequest.status SCOPING -> SCOPED"
          - "prior APPROVED sibling revision -> SUPERSEDED"
          - "ProjectRequest.active_scope_revision_no = this revision_no"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, when a newer sibling revision is approved, when the request enters RESCOPING, or when the request is ABANDONED from MATCHING"
        actor: system
        preconditions: ["a newer sibling ScopeDefinition reached APPROVED, or ProjectRequest left MATCHING for RESCOPING/ABANDONED"]
        side_effects: ["ProjectRequest.active_scope_revision_no recomputed", "Engagement rows already pinned to this revision keep pointing at it"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /project-requests/{id}/abandon, or system when a newer DRAFT revision is created on the same request"
        actor: ProgramManager | system
        preconditions: ["ScopeDefinition.status == DRAFT"]
        side_effects: ["child Deliverable rows remain readable but can no longer be scored"]
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /project-requests/{id}/abandon"
        actor: ProgramManager
        preconditions: ["ProjectRequest.status IN {SCOPING, SCOPED}"]
        side_effects: ["ProjectRequest.active_scope_revision_no resets to 0"]

  - entity: MatchOffer
    state_field: status
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
    shape: branching
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /match-offers/{id}/accept"
        actor: Volunteer
        preconditions:
          - "caller X-User-ID == MatchOffer.volunteer_id"
          - "logical clock < MatchOffer.expires_at"
          - "Volunteer.status == ACTIVE"
          - "Volunteer.open_engagement_count < VOLUNTEER_MAX_CONCURRENT (2)"
          - "ScopeDefinition pinned on the offer still has status == APPROVED"
          - "ProgramCycle.posture != FROZEN"
          - "PartnerOrg.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "CASCADE-A step 1: stamp responded_at; create Engagement (work_status NOT_STARTED, valuation_status UNVALUED, committed_hours = MatchOffer.reserved_hours) and move ProjectRequest MATCHING -> ENGAGED"
          - "CASCADE-A step 2: because ProjectRequest became ENGAGED, ProgramCycle.slots_reserved -= 1 and slots_committed += 1, then calculation cycle_posture reruns and may set posture = FROZEN"
          - "CASCADE-A step 3: because posture became FROZEN, every other MatchOffer with status == OFFERED whose ProjectRequest.cycle_id == this cycle moves to WITHDRAWN with withdraw_reason = CYCLE_FROZEN"
          - "CASCADE-A step 4: because those offers were withdrawn, each one's AvailabilityWindow.hours_committed -= that offer's reserved_hours and each affected ProjectRequest.failed_match_rounds += 1, driving requests at MAX_MATCH_ROUNDS into RESCOPING"
          - "sibling OFFERED offers on the SAME request move to WITHDRAWN with withdraw_reason = ADMIN and release their reserved hours"
          - "increments ProjectRequest.version by 1"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /match-offers/{id}/decline"
        actor: Volunteer
        preconditions: ["caller X-User-ID == MatchOffer.volunteer_id", "logical clock < MatchOffer.expires_at"]
        side_effects:
          - "stamp responded_at and decline_reason"
          - "AvailabilityWindow.hours_committed -= reserved_hours; ProgramCycle.slots_reserved -= 1; cycle_posture reruns"
          - "ProjectRequest.failed_match_rounds += 1, then the request moves to SCOPED, RESCOPING or ABANDONED per the ProjectRequest machine"
          - "when decline_reason == IP_TERMS_UNACCEPTABLE the volunteer is additionally excluded from every later matching round on this request"
        note: "Divergent branch: DECLINED alone carries the volunteer-level exclusion side effect; WITHDRAWN and EXPIRED do not."
      - from: OFFERED
        to: EXPIRED
        trigger: "system, expiry sweep inside POST /program-cycles/{id}/recalculate"
        actor: system
        preconditions: ["logical clock >= MatchOffer.expires_at"]
        side_effects:
          - "stamp responded_at = logical clock"
          - "AvailabilityWindow.hours_committed -= reserved_hours; ProgramCycle.slots_reserved -= 1"
          - "ProjectRequest.failed_match_rounds += 1 and the request advances per the ProjectRequest machine"
          - "Volunteer reliability is NOT recomputed - expiry is not attributed to the volunteer"
        note: "Divergent branch: EXPIRED is the only terminal that leaves the volunteer's reliability inputs untouched."
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /match-offers/{id}/withdraw, or system cascade from cycle FROZEN, partner SUSPENDED, volunteer PAUSED, or a sibling acceptance"
        actor: ScopingSpecialist | system
        preconditions: ["MatchOffer.status == OFFERED"]
        side_effects:
          - "stamp responded_at and withdraw_reason"
          - "AvailabilityWindow.hours_committed -= reserved_hours; ProgramCycle.slots_reserved -= 1"
          - "ProjectRequest.failed_match_rounds += 1 only when withdraw_reason != ADMIN; an ADMIN withdrawal caused by a sibling acceptance does not penalise the request"
        note: "Divergent branch: WITHDRAWN conditionally skips the failed_match_rounds increment."

  - entity: Engagement
    state_field: work_status
    dimension: 1
    initial_state: NOT_STARTED
    terminal_states: [HANDED_OFF, TERMINATED]
    shape: branching
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /engagements/{id}/start"
        actor: Volunteer
        preconditions:
          - "caller X-User-ID == Engagement.volunteer_id"
          - "EngagementAgreement of this engagement has status == EXECUTED"
          - "Volunteer.status == ACTIVE"
          - "PartnerOrg.status IN {ACTIVE, PROBATION}"
        side_effects: ["ProjectRequest.status ENGAGED -> IN_DELIVERY"]
        note: "Cross-entity gate on EngagementAgreement.status - the IP/confidentiality terms must be executed before any work may start."
      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /engagements/{id}/submit"
        actor: Volunteer
        preconditions:
          - "caller X-User-ID == Engagement.volunteer_id"
          - "at least one child Milestone has checkin_status == HELD"
          - "no child ScopeChangeRequest has status IN {PENDING, ESCALATED}"
          - "Engagement.creep_escalation_level != BREACH"
          - "every non-WAIVED Deliverable on the pinned ScopeDefinition has hours_estimate accounted for by at least one TimeLog"
        side_effects:
          - "every child TimeLog with approved == false flips to approved == true with approved_at stamped"
          - "Engagement.approved_hours and scope_creep_pct recomputed"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system, on POST /quality-reviews/{id}/decide with outcome IN {PASS, CONDITIONAL}"
        actor: system
        preconditions: ["QualityReview.status == SCORED", "QualityReview.outcome IN {PASS, CONDITIONAL}"]
        side_effects:
          - "Engagement.quality_gate = PASSED when outcome == PASS, CONDITIONAL when outcome == CONDITIONAL"
          - "every non-WAIVED Deliverable with review_score >= 3 moves to ACCEPTED, the rest to REJECTED"
      - from: ACCEPTED
        to: HANDED_OFF
        trigger: "POST /engagements/{id}/handoff"
        actor: ProgramManager
        preconditions:
          - "Engagement.confidentiality_attested payload flag is true"
          - "handoff_artifact_count >= 1"
          - "the pinned ScopeDefinition.status == APPROVED"
          - "EngagementAgreement.ip_disposition == the pinned ScopeDefinition.ip_disposition"
        side_effects:
          - "stamp handoff_at; ProjectRequest.status IN_DELIVERY -> CLOSED"
          - "ProgramCycle.slots_committed -= 1 and cycle_posture reruns"
          - "AvailabilityWindow.hours_committed -= Engagement.committed_hours"
          - "Volunteer.terminal_engagement_count += 1 and calculation volunteer_reliability_score reruns both variants"
      - from: NOT_STARTED
        to: TERMINATED
        trigger: "POST /engagements/{id}/terminate, or system cascade from agreement void / partner suspension"
        actor: ProgramManager | system
        preconditions: ["Engagement.work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}"]
        side_effects:
          - "stamp terminated_at and termination_reason"
          - "ProgramCycle.slots_committed -= 1 and cycle_posture reruns"
          - "AvailabilityWindow.hours_committed -= Engagement.committed_hours"
          - "every child Milestone with checkin_status == SCHEDULED -> WAIVED with waiver_reason = ENGAGEMENT_TERMINATED"
          - "every child ScopeChangeRequest with status IN {PENDING, ESCALATED} -> VOIDED"
          - "the EngagementAgreement, unless already EXECUTED, -> VOIDED with void_reason = ENGAGEMENT_TERMINATED"
      - from: IN_PROGRESS
        to: TERMINATED
        trigger: "POST /engagements/{id}/terminate, or system cascade from a RESCOPE_REQUIRED scope change"
        actor: ProgramManager | system
        preconditions: ["Engagement.work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}"]
        side_effects: ["identical release chain to NOT_STARTED -> TERMINATED", "Volunteer.terminal_engagement_count += 1 and reliability recomputed"]
      - from: SUBMITTED
        to: TERMINATED
        trigger: "system, on POST /quality-reviews/{id}/decide with outcome == FAIL"
        actor: system
        preconditions: ["QualityReview.status == SCORED", "QualityReview.outcome == FAIL"]
        side_effects:
          - "CASCADE-B step 1: Engagement.quality_gate = FAILED, work_status SUBMITTED -> TERMINATED with termination_reason = QUALITY_FAILURE, slot and hour releases as above"
          - "CASCADE-B step 2: because the engagement terminated while holding a ValuationRecord, valuation_status FINAL|PROVISIONAL -> RESTATED and a compensating INDEPENDENT_SECTOR ValuationRecord with variant_label RESTATED is posted while the prior record's superseded_at is stamped"
          - "CASCADE-B step 3: because a restated valuation record was posted, Volunteer.lifetime_valued_usd is recomputed from non-superseded INDEPENDENT_SECTOR records and calculation volunteer_reliability_score reruns both variants"
          - "CASCADE-B step 4: because reliability_score fell below RELIABILITY_FLOOR (0.4000), Volunteer.status ACTIVE -> PAUSED with pause_reason = RELIABILITY_FLOOR, and every MatchOffer of that volunteer with status == OFFERED moves to WITHDRAWN with withdraw_reason = VOLUNTEER_PAUSED, releasing their reserved hours and cycle slots"
      - from: ACCEPTED
        to: TERMINATED
        trigger: "POST /engagements/{id}/terminate"
        actor: ProgramManager
        preconditions: ["Engagement.work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}", "Engagement.handoff_at IS NULL"]
        side_effects: ["identical release chain to NOT_STARTED -> TERMINATED", "Volunteer.terminal_engagement_count += 1 and reliability recomputed"]

  - entity: Engagement
    state_field: valuation_status
    dimension: 2
    initial_state: UNVALUED
    terminal_states: []
    shape: parallel
    note: "Second, independent dimension on the same Engagement row. work_status and valuation_status advance on different endpoints and neither dimension's transition list constrains the other beyond the preconditions written here."
    transitions:
      - from: UNVALUED
        to: PROVISIONAL
        trigger: "POST /engagements/{id}/valuations"
        actor: ProgramManager
        preconditions:
          - "Engagement.work_status IN {IN_PROGRESS, SUBMITTED}"
          - "at least one child TimeLog has approved == true"
          - "expected_engagement_version matches Engagement.version"
        side_effects:
          - "post a ValuationRecord with variant_label = PROVISIONAL for the requested method"
          - "any prior non-superseded ValuationRecord of the SAME method gets superseded_at stamped"
          - "Volunteer.lifetime_valued_usd recomputed from non-superseded INDEPENDENT_SECTOR records"
          - "increments Engagement.version by 1"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /engagements/{id}/valuations"
        actor: ProgramManager
        preconditions: ["Engagement.work_status == HANDED_OFF", "expected_engagement_version matches Engagement.version"]
        side_effects:
          - "post a ValuationRecord with variant_label = FINAL; supersede the prior record of the same method"
          - "Volunteer.lifetime_valued_usd recomputed"
          - "increments Engagement.version by 1"
      - from: UNVALUED
        to: FINAL
        trigger: "POST /engagements/{id}/valuations"
        actor: ProgramManager
        preconditions: ["Engagement.work_status == HANDED_OFF", "no prior ValuationRecord exists for this engagement", "expected_engagement_version matches Engagement.version"]
        side_effects: ["post a ValuationRecord with variant_label = FINAL", "Volunteer.lifetime_valued_usd recomputed", "increments Engagement.version by 1"]
      - from: PROVISIONAL
        to: RESTATED
        trigger: "system, on Engagement.work_status -> TERMINATED"
        actor: system
        preconditions: ["at least one non-superseded ValuationRecord exists on this engagement"]
        side_effects: ["CASCADE-B step 2 as written on the work_status machine"]
      - from: FINAL
        to: RESTATED
        trigger: "system, on Engagement.work_status -> TERMINATED"
        actor: system
        preconditions: ["at least one non-superseded ValuationRecord exists on this engagement"]
        side_effects: ["CASCADE-B step 2 as written on the work_status machine"]

  - entity: EngagementAgreement
    state_field: status
    initial_state: DRAFTED
    terminal_states: [EXECUTED, VOIDED]
    shape: cyclic
    transitions:
      - from: DRAFTED
        to: SENT
        trigger: "POST /agreements/{id}/send"
        actor: ProgramManager
        preconditions: ["Engagement.work_status == NOT_STARTED", "the pinned ScopeDefinition.status == APPROVED"]
        side_effects: ["clear volunteer_signed_at and partner_signed_at to null"]
      - from: SENT
        to: COUNTERED
        trigger: "POST /agreements/{id}/counter"
        actor: Volunteer | PartnerContact
        preconditions:
          - "caller is either the engaged Volunteer or the owning PartnerContact"
          - "EngagementAgreement.counter_round < MAX_COUNTER_ROUNDS (3)"
          - "the countering party differs from last_countered_by"
        side_effects:
          - "counter_round += 1; terms_revision_no = counter_round + 1"
          - "overwrite ip_disposition / confidentiality_tier / indemnity_cap_usd with the countered values"
          - "clear volunteer_signed_at and partner_signed_at to null"
          - "set last_countered_by to the countering party"
      - from: COUNTERED
        to: SENT
        trigger: "POST /agreements/{id}/send"
        actor: ProgramManager
        preconditions: ["counter_round <= MAX_COUNTER_ROUNDS (3)"]
        side_effects: ["clear both signature timestamps to null"]
        note: "Closes the negotiation cycle SENT -> COUNTERED -> SENT."
      - from: SENT
        to: EXECUTED
        trigger: "POST /agreements/{id}/execute"
        actor: Volunteer | PartnerContact
        preconditions:
          - "the calling party's own signature slot is null"
          - "the OTHER party's signature slot is already stamped for the current terms_revision_no"
          - "confidentiality_tier is not weaker than the pinned ScopeDefinition.confidentiality_tier"
        side_effects: ["stamp the calling party's signature slot", "status -> EXECUTED once both slots are stamped"]
        note: "A first execute call by either party stamps that party's slot and leaves status SENT; only the countersign completes the transition."
      - from: COUNTERED
        to: VOIDED
        trigger: "POST /agreements/{id}/counter that would push counter_round past MAX_COUNTER_ROUNDS (3)"
        actor: system
        preconditions: ["counter_round == MAX_COUNTER_ROUNDS (3)"]
        side_effects:
          - "set void_reason = COUNTER_LIMIT_EXCEEDED"
          - "Engagement.work_status -> TERMINATED with termination_reason = AGREEMENT_VOIDED, running the full termination release chain"
      - from: SENT
        to: VOIDED
        trigger: "POST /agreements/{id}/void, or system cascade from engagement termination"
        actor: ProgramManager | system
        preconditions: ["EngagementAgreement.status IN {DRAFTED, SENT, COUNTERED}"]
        side_effects: ["set void_reason = TERMS_REJECTED or ENGAGEMENT_TERMINATED", "when voided directly, Engagement.work_status -> TERMINATED with termination_reason = AGREEMENT_VOIDED"]
      - from: DRAFTED
        to: VOIDED
        trigger: "POST /agreements/{id}/void, or system cascade from engagement termination"
        actor: ProgramManager | system
        preconditions: ["EngagementAgreement.status IN {DRAFTED, SENT, COUNTERED}"]
        side_effects: ["set void_reason = TERMS_REJECTED or ENGAGEMENT_TERMINATED"]

  - entity: Milestone
    state_field: checkin_status
    initial_state: SCHEDULED
    terminal_states: [HELD, MISSED, WAIVED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /milestones/{id}/hold"
        actor: ProgramManager
        preconditions:
          - "Engagement.work_status == IN_PROGRESS"
          - "logical clock >= Milestone.due_at - CHECKIN_GRACE_HOURS (24)"
          - "reported_cumulative_hours >= 0"
        side_effects:
          - "stamp held_at; every child TimeLog of the engagement with approved == false and work_date <= Milestone.due_at flips to approved == true and gets milestone_id set to this milestone"
          - "Engagement.approved_hours recomputed, then calculation scope_creep_pct reruns and may move creep_escalation_level"
          - "variance_hours = reported_cumulative_hours - Engagement.approved_hours measured after the approvals above"
          - "escalation_raised = true when the recomputed creep_escalation_level IN {ESCALATED, BREACH}"
          - "when the recomputed creep_escalation_level == BREACH, Engagement.work_status -> TERMINATED with termination_reason = SCOPE_BREACH and ProjectRequest.status IN_DELIVERY -> RESCOPING"
      - from: SCHEDULED
        to: MISSED
        trigger: "system, expiry sweep inside POST /program-cycles/{id}/recalculate"
        actor: system
        preconditions: ["logical clock > Milestone.due_at + CHECKIN_GRACE_HOURS (24)", "Engagement.work_status == IN_PROGRESS"]
        side_effects:
          - "Engagement.missed_checkin_count += 1"
          - "calculation volunteer_reliability_score reruns both variants for the engaged Volunteer"
          - "when Engagement.missed_checkin_count >= MISSED_CHECKIN_LIMIT (2), Engagement.work_status -> TERMINATED with termination_reason = ADMIN"
      - from: SCHEDULED
        to: WAIVED
        trigger: "system, on ProjectRequest RESCOPING entry or on Engagement termination"
        actor: system
        preconditions: ["Milestone.checkin_status == SCHEDULED"]
        side_effects: ["set waiver_reason = RESCOPED or ENGAGEMENT_TERMINATED", "no reliability effect"]

  - entity: ScopeChangeRequest
    state_field: status
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, VOIDED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /engagements/{id}/scope-change-requests when decision_tier == AUTO_APPROVABLE, or POST /scope-change-requests/{id}/decide with decision = APPROVE"
        actor: system | ProgramManager
        preconditions:
          - "ScopeChangeRequest.status == PENDING"
          - "Engagement.work_status == IN_PROGRESS"
          - "AvailabilityWindow.hours_remaining >= ScopeChangeRequest.additional_hours"
        side_effects:
          - "Engagement.committed_hours += additional_hours; AvailabilityWindow.hours_committed += additional_hours"
          - "calculation scope_creep_pct reruns against the NEW baseline, which normally lowers creep_escalation_level"
          - "when additional_deliverable_count >= 1, that many Deliverable rows must be added to the pinned ScopeDefinition before submit is allowed"
      - from: PENDING
        to: REJECTED
        trigger: "POST /scope-change-requests/{id}/decide with decision = REJECT"
        actor: ProgramManager
        preconditions: ["ScopeChangeRequest.status == PENDING"]
        side_effects: ["stamp decided_by_user_id and decided_at", "calculation scope_creep_pct reruns with this request no longer counted as pending hours"]
      - from: PENDING
        to: ESCALATED
        trigger: "system, at creation when decision_tier == RESCOPE_REQUIRED"
        actor: system
        preconditions: ["decision_tier == RESCOPE_REQUIRED"]
        side_effects: ["ProjectRequest.status IN_DELIVERY -> RESCOPING and the engagement is terminated with termination_reason = SCOPE_BREACH"]
      - from: ESCALATED
        to: VOIDED
        trigger: "system, on Engagement termination"
        actor: system
        preconditions: ["Engagement.work_status == TERMINATED"]
        side_effects: ["set resulting_scope_revision_no once the rescope produces a new APPROVED revision"]
      - from: PENDING
        to: VOIDED
        trigger: "system, on Engagement termination"
        actor: system
        preconditions: ["Engagement.work_status == TERMINATED"]
        side_effects: ["calculation scope_creep_pct no longer counts this request's hours"]

  - entity: QualityReview
    state_field: status
    initial_state: OPEN
    terminal_states: [DECIDED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: SCORED
        trigger: "POST /quality-reviews/{id}/score"
        actor: QualityReviewer
        preconditions:
          - "caller X-User-ID == QualityReview.reviewer_user_id"
          - "Engagement.work_status == SUBMITTED"
          - "the payload scores exactly the set of non-WAIVED Deliverable rows on the pinned ScopeDefinition"
        side_effects:
          - "write Deliverable.review_score for each scored item"
          - "calculation deliverable_quality_score computes weighted_score and outcome"
          - "scored_deliverable_count recomputed"
      - from: SCORED
        to: DECIDED
        trigger: "POST /quality-reviews/{id}/decide"
        actor: QualityReviewer
        preconditions:
          - "caller X-User-ID == QualityReview.reviewer_user_id"
          - "caller X-User-ID != ScopeDefinition.authored_by_user_id of the pinned scope"
          - "QualityReview.outcome != PENDING"
        side_effects:
          - "stamp decided_at; Engagement.quality_gate updated from outcome"
          - "outcome IN {PASS, CONDITIONAL} -> Engagement.work_status SUBMITTED -> ACCEPTED"
          - "outcome == FAIL -> CASCADE-B (engagement termination, valuation restatement, reliability recompute, volunteer pause)"
      - from: SCORED
        to: REWORK_REQUESTED
        trigger: "POST /quality-reviews/{id}/decide with request_rework = true"
        actor: QualityReviewer
        preconditions: ["QualityReview.outcome == CONDITIONAL", "QualityReview.round_no < MAX_REVIEW_ROUNDS (2)"]
        side_effects:
          - "stamp decided_at and rework_deadline_at = decided_at + REWORK_WINDOW_HOURS (168)"
          - "Engagement.work_status SUBMITTED -> IN_PROGRESS"
          - "every non-WAIVED Deliverable review_score reset to null and review_status reset to PENDING"
      - from: REWORK_REQUESTED
        to: OPEN
        trigger: "POST /engagements/{id}/quality-reviews"
        actor: QualityReviewer
        preconditions: ["Engagement.work_status == SUBMITTED", "the prior review has status == REWORK_REQUESTED"]
        side_effects: ["a new QualityReview row is created with round_no = prior round_no + 1; the prior row stays REWORK_REQUESTED"]
        note: "Closes the rework cycle OPEN -> SCORED -> REWORK_REQUESTED -> OPEN. On the second round CONDITIONAL can no longer request rework and must be DECIDED."

concurrency_rules:
  - rule_id: scope-revision-create-stale-request
    parent_entity: ProjectRequest
    write_endpoint: "POST /project-requests/{id}/scope-definitions"
    occ_field: "expected_project_request_version"
    description: |
      Creating a new ScopeDefinition revision against a ProjectRequest whose
      version has advanced since the ScopingSpecialist last observed it is
      rejected. A revision create legitimately supersedes the prior revision
      (the prior DRAFT moves to WITHDRAWN and an APPROVED prior moves to
      SUPERSEDED once the new revision is approved), so a caller working from
      a stale view of the request would silently discard a revision it never
      saw. The stale-version check makes that discard impossible.
    error_id: ERR_STALE_PROJECT_REQUEST_VERSION
    http_status: 412
  - rule_id: valuation-post-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/valuations"
    occ_field: "expected_engagement_version"
    description: |
      Posting a ValuationRecord against an Engagement whose version has
      advanced since the ProgramManager last observed it is rejected. A
      valuation post legitimately supersedes the prior non-superseded record
      of the same method (stamping its superseded_at), so a caller holding a
      stale view of the engagement's approved_hours would supersede a record
      computed from hours it never read. The stale-version check forces a
      re-read first.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
  - rule_id: agreement-reissue-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{id}/agreements"
    occ_field: "expected_engagement_version"
    description: |
      Creating an EngagementAgreement against an Engagement whose version has
      advanced since the ProgramManager last observed it is rejected. Re-issuing
      terms is legitimate and voids the prior non-executed agreement with
      void_reason = TERMS_REJECTED, so a caller working from a stale view would
      void a negotiation round (including counters recorded on it) that it never
      observed. The stale-version check pins the caller to the round it read.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

calculations:
  - name: partner_capacity_class
    trigger: "on POST /partner-orgs, and on every read that surfaces PartnerOrg.capacity_class"
    algorithm: threshold
    formula: |
      b = PartnerOrg.annual_budget_usd
      if   b <  250000.00                        -> capacity_class = MICRO, max_concurrent_engagements = 1
      elif 250000.00  <= b <  2000000.00         -> capacity_class = SMALL, max_concurrent_engagements = 2
      elif 2000000.00 <= b < 10000000.00         -> capacity_class = MID,   max_concurrent_engagements = 4
      else (b >= 10000000.00)                    -> capacity_class = LARGE, max_concurrent_engagements = 6
    input_set: "The PartnerOrg row alone; no child entities participate."
    constants:
      BAND_SMALL_FLOOR_USD: 250000.00
      BAND_MID_FLOOR_USD: 2000000.00
      BAND_LARGE_FLOOR_USD: 10000000.00
    precision: "capacity_class is an enum; max_concurrent_engagements is an integer. Band floors are inclusive (>=), ceilings exclusive (<)."

  - name: match_score
    trigger: "on POST /project-requests/{id}/match, once per candidate (volunteer, availability window) pair; the winner's score is persisted to MatchOffer.match_score"
    algorithm: weighted_scoring
    formula: |
      # ---- STEP 1: candidate set (eligibility filter, all predicates required) ----
      candidates = every (Volunteer v, SkillProfile sp) pair such that
          sp.volunteer_id == v.id
        AND sp.skill_code == ProjectRequest.required_skill_code          # exact string equality
        AND sp.proficiency >= ProjectRequest.min_proficiency
        AND v.status == ACTIVE
        AND v.credential_verified_at IS NOT NULL
        AND v.open_engagement_count < VOLUNTEER_MAX_CONCURRENT
        AND v.id NOT IN (volunteer_id of any MatchOffer on this ProjectRequest whose
                         status IN {OFFERED, DECLINED, EXPIRED, WITHDRAWN})   # retry exclusion
        AND v has at least one AvailabilityWindow w with
              w.starts_at <= CLOCK  AND  CLOCK < w.ends_at                    # half-open
              AND (w.hours_offered - w.hours_committed) > 0

      # ---- STEP 2: window selection per candidate (one window per volunteer) ----
      required_hours = round(ScopeDefinition.estimated_hours * ScopeDefinition.complexity_factor, 2)
      chosen_window(v) = the eligible window of v ordered by
          hours_remaining DESC,
          then window_kind (HARD before SOFT),
          then created_at ASC          # never id
        taking the first row.

      # ---- STEP 3: score of one candidate ----
      skill_component = min(1.00, SKILL_TIER_WEIGHT[sp.proficiency]
                                  + (VERIFIED_SKILL_BONUS if sp.verified else 0.00))
      window_remaining     = round(chosen_window.hours_offered - chosen_window.hours_committed, 2)
      availability_component = min(1.00, round(window_remaining / required_hours, 4))
      shortfall_hours      = max(0.00, round(required_hours - window_remaining, 2))
      penalty              = min(0.30, round(shortfall_hours * SHORTFALL_PENALTY_PER_HOUR, 4))
      w_avail = URGENCY_AVAILABILITY_WEIGHT[ProjectRequest.urgency]     # conditional on request state
      w_skill = round(1.00 - w_avail - RELIABILITY_WEIGHT, 4)
      raw = round(w_skill * skill_component
                  + w_avail * availability_component
                  + RELIABILITY_WEIGHT * v.reliability_score, 6)
      match_score = round(max(0.0000, raw - penalty) * SENIORITY_MULTIPLIER[v.seniority], 4)

      # ---- STEP 4: ranking, tie-break, fallback ----
      ranking   = match_score DESC
      tie_break_1 = v.reliability_score DESC
      tie_break_2 = v.created_at ASC        # never id
      empty candidate set -> no MatchOffer is created; the request stays in SCOPED,
        failed_match_rounds += 1, and the endpoint answers ERR_NO_ELIGIBLE_VOLUNTEER (422)
    input_set: "Volunteers with status == ACTIVE and a verified credential, restricted to holders of the exact required_skill_code at or above min_proficiency, excluding every volunteer already offered this request in any round. Windows are restricted to those covering the current logical clock with strictly positive remaining hours."
    constants:
      SKILL_TIER_WEIGHT: { 1: 0.20, 2: 0.45, 3: 0.70, 4: 0.88, 5: 1.00 }
      SENIORITY_MULTIPLIER: { ASSOCIATE: 0.90, SENIOR: 1.00, PRINCIPAL: 1.08, PARTNER: 1.12 }
      URGENCY_AVAILABILITY_WEIGHT: { ROUTINE: 0.20, ELEVATED: 0.30, CRITICAL: 0.45 }
      RELIABILITY_WEIGHT: 0.25
      VERIFIED_SKILL_BONUS: 0.05
      SHORTFALL_PENALTY_PER_HOUR: 0.004
      SHORTFALL_PENALTY_CAP: 0.30
      VOLUNTEER_MAX_CONCURRENT: 2
      OFFER_TTL_HOURS: { ROUTINE: 120, ELEVATED: 72, CRITICAL: 24 }
    precision: "skill/availability components 4 decimals; raw 6 decimals; match_score round_half_up to 4 decimals. Rounding happens exactly at the points marked in the formula and nowhere else."
    note: "Mode (a) combinatorial formula: five inputs interacting through nested min/max, a tiered proficiency lookup, a boolean bonus, and weights that switch on ProjectRequest.urgency."

  - name: volunteer_hour_valuation
    trigger: "on POST /engagements/{id}/valuations, producing ValuationRecord.hours_included, rate_applied_usd and base_amount_usd for the requested method"
    algorithm: aggregation
    formula: |
      logs = child TimeLog rows of the Engagement with approved == true,
             processed in work_date ASC, then created_at ASC order.
      cap  = MARKET_RATE_CAP_USD[Volunteer.seniority]

      # variant MARKET_RATE  -- per-line rounding, TRAVEL excluded, ADMIN halved
      eligible = [L for L in logs if L.activity_class IN {DELIVERY, ADMIN}]
      line(L)  = round(L.hours * min(L.rate_basis_usd, cap) * CLASS_FACTOR[L.activity_class], 2)
      base_amount_usd = round(sum(line(L) for L in eligible), 2)
      hours_included  = round(sum(L.hours for L in eligible), 2)
      rate_applied_usd = min(Volunteer.professional_rate_usd_per_hour, cap)

      # variant INDEPENDENT_SECTOR -- single-shot rounding, every class admitted
      hours_included  = round(sum(L.hours for L in logs), 2)
      rate_applied_usd = INDEPENDENT_SECTOR_RATE_USD
      base_amount_usd = round(hours_included * INDEPENDENT_SECTOR_RATE_USD, 2)
    input_set: "Only TimeLog rows with approved == true participate; unapproved logs are invisible to both variants. MARKET_RATE additionally drops every TRAVEL log from both hours_included and base_amount_usd, while INDEPENDENT_SECTOR admits DELIVERY, ADMIN and TRAVEL alike."
    constants:
      INDEPENDENT_SECTOR_RATE_USD: 34.79
      MARKET_RATE_CAP_USD: { ASSOCIATE: 180.00, SENIOR: 320.00, PRINCIPAL: 480.00, PARTNER: 650.00 }
      CLASS_FACTOR: { DELIVERY: 1.00, ADMIN: 0.50, TRAVEL: 0.00 }
    precision: "2 decimals, round_half_up. MARKET_RATE rounds per TimeLog line and then sums; it MUST NOT sum hours first and multiply once. INDEPENDENT_SECTOR sums hours first and rounds once."
    variants:
      - name: MARKET_RATE
        when: "method == MARKET_RATE on the valuation request; this is the figure used in donor-facing in-kind reporting"
        difference: "Values each approved log at the volunteer's own rate capped by seniority, halves ADMIN hours, excludes TRAVEL hours entirely, and rounds per line before summing."
      - name: INDEPENDENT_SECTOR
        when: "method == INDEPENDENT_SECTOR on the valuation request; this is the figure that feeds Volunteer.lifetime_valued_usd and the IRS-style program report"
        difference: "Values every approved hour at one flat national rate regardless of class, seniority or personal rate, and rounds only once after summing hours."

  - name: engagement_admin_overhead
    trigger: "on POST /engagements/{id}/valuations, immediately after volunteer_hour_valuation produced base_amount_usd"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER -- steps run exactly in this sequence:
      # (1) base_amount_usd comes from volunteer_hour_valuation for the requested method.
      # (2) the overhead tier is selected from base_amount_usd, NEVER from total_amount_usd.
      # (3) admin_overhead_usd = max(OVERHEAD_FLOOR_USD, round(base_amount_usd * tier_rate, 2))
      # (4) total_amount_usd  = round(base_amount_usd + admin_overhead_usd, 2)
      if   base_amount_usd <  2500.00                        -> tier_rate = 0.12
      elif 2500.00  <= base_amount_usd < 10000.00            -> tier_rate = 0.09
      else (base_amount_usd >= 10000.00)                     -> tier_rate = 0.06
      admin_overhead_usd = max(45.00, round(base_amount_usd * tier_rate, 2))
      total_amount_usd   = round(base_amount_usd + admin_overhead_usd, 2)
    input_set: "The single ValuationRecord being posted; no sibling records participate. base_amount_usd of 0.00 still yields the floor overhead of 45.00."
    constants:
      OVERHEAD_TIER_MID_FLOOR_USD: 2500.00
      OVERHEAD_TIER_HIGH_FLOOR_USD: 10000.00
      OVERHEAD_RATE_LOW: 0.12
      OVERHEAD_RATE_MID: 0.09
      OVERHEAD_RATE_HIGH: 0.06
      OVERHEAD_FLOOR_USD: 45.00
    precision: "2 decimals, round_half_up."
    note: "Mode (c) combinatorial formula: total_amount_usd = base + overhead while the overhead rate is chosen from a tier ladder that a careless reader keys off total_amount_usd. The order above resolves the apparent circularity: a base of 2380.00 takes tier_rate 0.12 (overhead 285.60, total 2665.60) even though the resulting total sits in the 0.09 band."

  - name: volunteer_reliability_score
    trigger: "on Engagement work_status -> HANDED_OFF, on Engagement work_status -> TERMINATED, and on Milestone checkin_status -> MISSED; writes both Volunteer.reliability_score and Volunteer.reliability_score_lifetime"
    algorithm: decay_function
    formula: |
      terminal = child Engagement rows of the Volunteer with
                 work_status IN {HANDED_OFF, TERMINATED}
      terminal_at(E) = coalesce(E.handoff_at, E.terminated_at)
      order    = terminal_at DESC, then E.created_at DESC        # never id
      base(E)  = 1.00 if E.work_status == HANDED_OFF and E.quality_gate == PASSED
                 0.70 if E.work_status == HANDED_OFF and E.quality_gate == CONDITIONAL
                 0.00 if E.work_status == TERMINATED and E.termination_reason == QUALITY_FAILURE
                 0.25 if E.work_status == TERMINATED and E.termination_reason IN {SCOPE_BREACH, ADMIN}
                 0.60 if E.work_status == TERMINATED and E.termination_reason IN {AGREEMENT_VOIDED, PARTNER_SUSPENDED}
      points(E) = max(0.00, round(base(E) - MISSED_CHECKIN_PENALTY * E.missed_checkin_count, 4))

      if len(terminal) == 0:
          reliability_score = reliability_score_lifetime = RELIABILITY_BASELINE
      else:
          # variant DECAY_WEIGHTED -> Volunteer.reliability_score
          recent = first min(DECAY_WINDOW_N, len(terminal)) rows of `order`
          w(i)   = round(DECAY_LAMBDA ** i, 6)            # i is the 0-based rank in `recent`
          reliability_score = round(sum(w(i) * points(recent[i])) / sum(w(i)), 4)
          # variant LIFETIME_AVERAGE -> Volunteer.reliability_score_lifetime
          reliability_score_lifetime = round(sum(points(E) for E in terminal) / len(terminal), 4)

      # threshold consequence, evaluated on reliability_score only
      if reliability_score < RELIABILITY_FLOOR and Volunteer.status == ACTIVE:
          Volunteer.status -> PAUSED, pause_reason = RELIABILITY_FLOOR
    input_set: "Only Engagement rows that reached HANDED_OFF or TERMINATED count. NOT_STARTED / IN_PROGRESS / SUBMITTED / ACCEPTED engagements are excluded from both variants, as are MatchOffer rows that merely expired."
    constants:
      DECAY_LAMBDA: 0.85
      DECAY_WINDOW_N: 8
      MISSED_CHECKIN_PENALTY: 0.10
      RELIABILITY_BASELINE: 0.7500
      RELIABILITY_FLOOR: 0.4000
    precision: "points and weights 4 and 6 decimals respectively; both scores round_half_up to 4 decimals. The floor comparison is strict: exactly 0.4000 does NOT pause the volunteer."
    variants:
      - name: DECAY_WEIGHTED
        when: "always, for the gating field Volunteer.reliability_score consumed by match_score and by the auto-pause threshold"
        difference: "Considers only the most recent 8 terminal engagements and weights rank i by 0.85^i, so an old failure is nearly invisible and a recent one dominates."
      - name: LIFETIME_AVERAGE
        when: "always, for the reporting field Volunteer.reliability_score_lifetime shown on the volunteer record"
        difference: "Considers every terminal engagement ever, unweighted, so the two fields disagree whenever the volunteer has more than one terminal engagement with differing outcomes."

  - name: deliverable_quality_score
    trigger: "on POST /quality-reviews/{id}/score; writes QualityReview.weighted_score and QualityReview.outcome"
    algorithm: weighted_scoring
    formula: |
      active = Deliverable rows of the Engagement's pinned ScopeDefinition with
               review_status != WAIVED,
               processed in sequence_no ASC, then created_at ASC order.
      active_weight_total = round(sum(D.weight_pct for D in active), 2)
      for each D in active (in the pinned order):
          norm_weight(D)  = round(D.weight_pct / active_weight_total, 6)
          contribution(D) = round(norm_weight(D) * D.review_score * SCORE_SCALE, 2)
      weighted_score = round(sum(contribution(D) for D in active), 2)
      outcome = PASS        if weighted_score >= PASS_THRESHOLD
                CONDITIONAL if CONDITIONAL_THRESHOLD <= weighted_score < PASS_THRESHOLD
                FAIL        if weighted_score <  CONDITIONAL_THRESHOLD
    input_set: "Only non-WAIVED deliverables of the pinned scope revision participate; a WAIVED deliverable is removed from both the numerator and active_weight_total, so the surviving weights are renormalised rather than shrunk."
    constants:
      SCORE_SCALE: 20
      PASS_THRESHOLD: 78.00
      CONDITIONAL_THRESHOLD: 60.00
    precision: "norm_weight 6 decimals; contribution 2 decimals per deliverable; weighted_score 2 decimals. All round_half_up."
    note: "Mode (b) combinatorial formula: the rounding order is pinned to round-per-deliverable-then-sum. Summing normalised weights first and rounding once produces a different cent figure and can flip the PASS/CONDITIONAL boundary."

  - name: scope_creep_pct
    trigger: "on POST /engagements/{id}/time-logs, on POST /milestones/{id}/hold, on POST /engagements/{id}/submit, on POST /engagements/{id}/scope-change-requests and on POST /scope-change-requests/{id}/decide; writes Engagement.scope_creep_pct and Engagement.creep_escalation_level"
    algorithm: threshold
    formula: |
      baseline = Engagement.committed_hours                     # > 0 by construction
      approved = round(sum(L.hours for child TimeLog L where L.approved == true), 2)
      pending  = round(sum(S.additional_hours for child ScopeChangeRequest S
                           where S.status IN {PENDING, ESCALATED}), 2)
      scope_creep_pct = round((approved + pending - baseline) / baseline, 4)
      creep_escalation_level =
          NONE      if scope_creep_pct <  0.1500
          WATCH     if 0.1500 <= scope_creep_pct <  0.3000
          ESCALATED if 0.3000 <= scope_creep_pct <  0.5000
          BREACH    if scope_creep_pct >= 0.5000
    input_set: "Approved TimeLog rows of every activity_class plus the additional_hours of ScopeChangeRequest rows still in {PENDING, ESCALATED}. REJECTED, VOIDED and APPROVED change requests contribute nothing here - an APPROVED change has already been folded into committed_hours."
    constants:
      WATCH_FLOOR: 0.1500
      ESCALATED_FLOOR: 0.3000
      BREACH_FLOOR: 0.5000
    precision: "4 decimals, round_half_up. Band floors are inclusive: exactly 0.1500 is WATCH, exactly 0.3000 is ESCALATED, exactly 0.5000 is BREACH."

  - name: scope_change_projection
    trigger: "on POST /engagements/{id}/scope-change-requests, before the row is persisted; writes ScopeChangeRequest.projected_creep_pct and decision_tier"
    algorithm: threshold
    formula: |
      baseline    = Engagement.committed_hours
      approved    = Engagement.approved_hours
      other_open  = round(sum(S.additional_hours for sibling ScopeChangeRequest S
                              where S.status IN {PENDING, ESCALATED}), 2)   # excludes this new row
      projected_creep_pct = round((approved + other_open + this.additional_hours - baseline) / baseline, 4)
      # tier tests run in exactly this order:
      if   projected_creep_pct >= RESCOPE_FLOOR                            -> RESCOPE_REQUIRED
      elif projected_creep_pct <  MANAGER_FLOOR
           and this.additional_deliverable_count == 0                      -> AUTO_APPROVABLE
      else                                                                 -> MANAGER_REVIEW
    input_set: "Sibling change requests still open ({PENDING, ESCALATED}) plus the incoming row. The engagement's already-approved hours enter through Engagement.approved_hours."
    constants:
      MANAGER_FLOOR: 0.1500
      RESCOPE_FLOOR: 0.5000
    precision: "4 decimals, round_half_up. A projection below 0.1500 that nevertheless adds at least one deliverable falls to MANAGER_REVIEW, not AUTO_APPROVABLE."

  - name: cycle_posture
    trigger: "on POST /project-requests/{id}/match, on MatchOffer leaving OFFERED, on Engagement work_status entering or leaving {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}, and on POST /program-cycles/{id}/recalculate; writes ProgramCycle.slots_committed, slots_reserved, slots_available, utilization_ratio and posture"
    algorithm: aggregation
    formula: |
      slots_committed = count(Engagement E where E.cycle_id == C.id
                              and E.work_status IN {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED})
      slots_reserved  = count(MatchOffer M where M.status == OFFERED
                              and M's ProjectRequest.cycle_id == C.id)
      slots_available = max(0, C.capacity_slot_total - slots_committed - slots_reserved)
      utilization_ratio = round((slots_committed + slots_reserved) / C.capacity_slot_total, 4)
      posture = OPEN       if utilization_ratio <  0.8000
                RESTRICTED if 0.8000 <= utilization_ratio < 1.0000
                FROZEN     if utilization_ratio >= 1.0000
    input_set: "Engagement rows in the four live work_status values only - HANDED_OFF and TERMINATED release their slot. MatchOffer rows in status OFFERED only; ACCEPTED, DECLINED, EXPIRED and WITHDRAWN offers hold nothing."
    constants:
      RESTRICTED_FLOOR: 0.8000
      FROZEN_FLOOR: 1.0000
    precision: "utilization_ratio 4 decimals, round_half_up. Band floors inclusive: exactly 0.8000 is RESTRICTED, exactly 1.0000 is FROZEN."
    note: "RESTRICTED blocks new offers for ROUTINE requests only; FROZEN blocks every new offer and additionally withdraws every OFFERED offer in the cycle."

  - name: partner_satisfaction_index
    trigger: "on POST /engagements/{id}/satisfaction-surveys; writes SatisfactionSurvey.composite_score, SatisfactionSurvey.counted_in_index, PartnerOrg.satisfaction_index and PartnerOrg.satisfaction_sample_size"
    algorithm: aggregation
    formula: |
      # step 1 - per survey composite
      composite_score = round((0.40 * score_expertise
                             + 0.35 * score_deliverable_fit
                             + 0.25 * score_responsiveness) * 20, 2)

      # step 2 - index window
      pool = SatisfactionSurvey rows of the PartnerOrg whose linked
             Engagement.work_status == HANDED_OFF
      order = submitted_at DESC, then created_at DESC          # never id
      used  = first min(INDEX_WINDOW_N, len(pool)) rows of `order`
      counted_in_index = true for every row in `used`, false for every other row of `pool`
      k = len(used)
      satisfaction_sample_size = k
      if k == 0:
          satisfaction_index = null
      else:
          weight_sum = round(sum(RECENCY_WEIGHTS[i] for i in 0..k-1), 4)
          w_norm(i)  = round(RECENCY_WEIGHTS[i] / weight_sum, 6)
          satisfaction_index = round(sum(round(w_norm(i) * used[i].composite_score, 4)
                                         for i in 0..k-1), 2)

      # step 3 - partner standing consequence
      if k >= PROBATION_MIN_SAMPLE and satisfaction_index <  PROBATION_CEILING
         and PartnerOrg.status == ACTIVE      -> status PROBATION, probation_reason = LOW_SATISFACTION
      if k >= PROBATION_MIN_SAMPLE and satisfaction_index >= RECOVERY_FLOOR
         and PartnerOrg.status == PROBATION   -> status ACTIVE, probation_reason = null
    input_set: "Only surveys whose linked Engagement reached work_status == HANDED_OFF enter the pool; a survey on a TERMINATED engagement is stored with counted_in_index == false and never moves the index. At most the five most recent qualifying surveys are used, ranked by submitted_at DESC with created_at DESC as the tie-break."
    constants:
      INDEX_WINDOW_N: 5
      RECENCY_WEIGHTS: [0.34, 0.26, 0.18, 0.13, 0.09]
      PROBATION_MIN_SAMPLE: 3
      PROBATION_CEILING: 55.00
      RECOVERY_FLOOR: 70.00
    precision: "composite_score 2 decimals; normalised weights 6 decimals; per-term product rounded to 4 decimals before summing; satisfaction_index 2 decimals. All round_half_up."

invariants:
  - id: INV_CYCLE_SLOT_CONSERVATION
    conserved_quantity: "ProgramCycle engagement slots"
    formula: |
      For every ProgramCycle C:
        C.slots_committed + C.slots_reserved + C.slots_available == C.capacity_slot_total
    forward_action: "POST /match-offers/{id}/accept (offer OFFERED -> ACCEPTED: slots_reserved -1, slots_committed +1)"
    compensating_action: "POST /engagements/{id}/terminate (work_status -> TERMINATED: slots_committed -1)"
    requirement: "After the forward action followed by its compensating action, slots_committed and slots_reserved MUST both read exactly their pre-forward values and slots_available MUST return to capacity_slot_total - (other live holds). No slot may be stranded by the intervening cascades (sibling withdrawals, posture recomputation, milestone waivers)."
  - id: INV_VOLUNTEER_HOUR_CONSERVATION
    conserved_quantity: "AvailabilityWindow committed hours"
    formula: |
      For every AvailabilityWindow W:
        W.hours_committed == round(
            sum(M.reserved_hours   for MatchOffer  M where M.availability_window_id == W.id
                                                     and M.status == OFFERED)
          + sum(E.committed_hours  for Engagement  E where E.availability_window_id == W.id
                                                     and E.work_status IN {NOT_STARTED, IN_PROGRESS,
                                                                           SUBMITTED, ACCEPTED}), 2)
        AND W.hours_remaining == round(W.hours_offered - W.hours_committed, 2)
    forward_action: "POST /project-requests/{id}/match (creates an OFFERED MatchOffer holding reserved_hours) followed by POST /match-offers/{id}/accept (the hold migrates to Engagement.committed_hours)"
    compensating_action: "POST /match-offers/{id}/decline, the expiry sweep in POST /program-cycles/{id}/recalculate, POST /engagements/{id}/terminate, or POST /engagements/{id}/handoff"
    requirement: "Every release path MUST subtract exactly the amount that was added, including hours added later by an APPROVED ScopeChangeRequest. A terminated engagement whose committed_hours grew from 40.00 to 52.00 via an approved change MUST release 52.00, not 40.00."
  - id: INV_VALUATION_CONSERVATION
    conserved_quantity: "Volunteer lifetime reported in-kind value"
    formula: |
      For every Volunteer V:
        V.lifetime_valued_usd == round(sum(R.total_amount_usd
            for ValuationRecord R where R.method == INDEPENDENT_SECTOR
                                    and R.superseded_at IS NULL
                                    and R's Engagement.volunteer_id == V.id), 2)
    forward_action: "POST /engagements/{id}/valuations with method = INDEPENDENT_SECTOR (posts a record and adds its total to lifetime_valued_usd)"
    compensating_action: "the restatement cascade on Engagement work_status -> TERMINATED (stamps superseded_at on the prior record and posts a RESTATED record computed from the same approved hours)"
    requirement: "After a valuation post followed by its restatement, lifetime_valued_usd MUST equal the sum over non-superseded INDEPENDENT_SECTOR records only - the superseded record's amount MUST NOT remain double-counted, and the restated record MUST NOT be omitted."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of PartnerContact, Volunteer, ScopingSpecialist, ProgramManager, QualityReviewer, and is listed in the target endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "PartnerOrg named by a path segment exists"
    error_id: ERR_PARTNER_ORG_NOT_FOUND
    http_status: 404
    applies_to: "GET /partner-orgs/{id}, GET /partner-orgs/{id}/summary, GET /partner-orgs/{id}/satisfaction-surveys, PATCH /partner-orgs/{id}/status"
  - priority: 4
    category: existence
    check: "ProgramCycle named by a path segment exists"
    error_id: ERR_PROGRAM_CYCLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /program-cycles/{id}, POST /program-cycles/{id}/recalculate"
  - priority: 5
    category: existence
    check: "ProjectRequest named by a path segment exists"
    error_id: ERR_PROJECT_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /project-requests/{id}, POST /project-requests/{id}/submit-for-scoping, POST /project-requests/{id}/scope-definitions, POST /project-requests/{id}/match, POST /project-requests/{id}/rescope, POST /project-requests/{id}/abandon"
  - priority: 6
    category: existence
    check: "ScopeDefinition named by a path segment exists"
    error_id: ERR_SCOPE_DEFINITION_NOT_FOUND
    http_status: 404
    applies_to: "GET /scope-definitions/{id}, GET /scope-definitions/{id}/deliverables, POST /scope-definitions/{id}/deliverables, POST /scope-definitions/{id}/approve"
  - priority: 7
    category: existence
    check: "Volunteer named by a path segment exists"
    error_id: ERR_VOLUNTEER_NOT_FOUND
    http_status: 404
    applies_to: "GET /volunteers/{id}, GET /volunteers/{id}/skill-profiles, GET /volunteers/{id}/availability-windows, POST /volunteers/{id}/vet, PATCH /volunteers/{id}/status, POST /volunteers/{id}/skill-profiles, POST /volunteers/{id}/availability-windows"
  - priority: 8
    category: existence
    check: "MatchOffer named by a path segment exists"
    error_id: ERR_MATCH_OFFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /match-offers/{id}, POST /match-offers/{id}/accept, POST /match-offers/{id}/decline, POST /match-offers/{id}/withdraw"
  - priority: 9
    category: existence
    check: "Engagement named by a path segment exists"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "every /engagements/{id} path and every /engagements/{id}/... sub-path"
  - priority: 10
    category: existence
    check: "EngagementAgreement named by a path segment exists"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /agreements/{id}/send, POST /agreements/{id}/counter, POST /agreements/{id}/execute, POST /agreements/{id}/void"
  - priority: 11
    category: existence
    check: "Milestone named by a path segment exists"
    error_id: ERR_MILESTONE_NOT_FOUND
    http_status: 404
    applies_to: "GET /milestones/{id}, GET /milestones/{id}/time-logs, POST /milestones/{id}/hold"
  - priority: 12
    category: existence
    check: "ScopeChangeRequest named by a path segment exists"
    error_id: ERR_SCOPE_CHANGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /scope-change-requests/{id}/decide"
  - priority: 13
    category: existence
    check: "QualityReview named by a path segment exists"
    error_id: ERR_QUALITY_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "POST /quality-reviews/{id}/score, POST /quality-reviews/{id}/decide"
  - priority: 14
    category: existence
    check: "Every foreign key supplied in the request body resolves: partner_org_id -> PartnerOrg, cycle_id -> ProgramCycle, deliverable_id inside deliverable_scores -> Deliverable of the pinned ScopeDefinition"
    error_id: ERR_PARTNER_ORG_NOT_FOUND
    http_status: 404
    applies_to: "POST /project-requests (partner_org_id, cycle_id -> ERR_PROGRAM_CYCLE_NOT_FOUND), POST /quality-reviews/{id}/score (deliverable_id -> ERR_DELIVERABLE_NOT_FOUND)"
  - priority: 15
    category: auth
    check: "For entity_backed roles the caller owns the target resource: a PartnerContact's X-User-ID equals the PartnerOrg.id reached through the resource chain, and a Volunteer's X-User-ID equals the Volunteer.id on the MatchOffer or Engagement"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /project-requests/{id}/submit-for-scoping, POST /scope-definitions/{id}/approve, POST /match-offers/{id}/accept, POST /match-offers/{id}/decline, POST /engagements/{id}/start, POST /engagements/{id}/submit, POST /engagements/{id}/time-logs, POST /engagements/{id}/scope-change-requests, POST /engagements/{id}/satisfaction-surveys, POST /agreements/{id}/counter, POST /agreements/{id}/execute, POST /volunteers/{id}/skill-profiles, POST /volunteers/{id}/availability-windows"
  - priority: 16
    category: auth
    check: "Segregation of duties: the QualityReviewer X-User-ID deciding a review differs from ScopeDefinition.authored_by_user_id of the engagement's pinned scope, and differs from the reviewer_user_id of any prior review round on the same engagement"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /engagements/{id}/quality-reviews, POST /quality-reviews/{id}/decide"
  - priority: 17
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: all required fields present, enums within their declared value sets, numbers within their declared ranges, datetimes ISO 8601 UTC"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 18
    category: business_constraint
    check: "Pagination parameters are integers with 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /project-requests, GET /scope-definitions, GET /match-offers, GET /engagements"
  - priority: 19
    category: business_constraint
    check: "Quantity fields that must be strictly positive are strictly positive: TimeLog.hours > 0, ScopeDefinition.estimated_hours > 0, AvailabilityWindow.hours_offered > 0, Deliverable.weight_pct > 0. A value of exactly 0 is rejected here, before any capacity math runs"
    error_id: ERR_ZERO_HOURS_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /engagements/{id}/time-logs, POST /project-requests/{id}/scope-definitions, POST /volunteers/{id}/availability-windows, POST /scope-definitions/{id}/deliverables"
  - priority: 20
    category: state
    check: "ProjectRequest.status is in the from-set of the requested transition"
    error_id: ERR_INVALID_REQUEST_STATE
    http_status: 409
    applies_to: "POST /project-requests/{id}/submit-for-scoping, POST /project-requests/{id}/scope-definitions, POST /project-requests/{id}/match, POST /project-requests/{id}/rescope, POST /project-requests/{id}/abandon"
  - priority: 21
    category: state
    check: "ScopeDefinition.status == DRAFT for approve and for adding deliverables"
    error_id: ERR_INVALID_SCOPE_STATE
    http_status: 409
    applies_to: "POST /scope-definitions/{id}/approve, POST /scope-definitions/{id}/deliverables"
  - priority: 22
    category: state
    check: "MatchOffer.status == OFFERED"
    error_id: ERR_OFFER_NOT_OPEN
    http_status: 409
    applies_to: "POST /match-offers/{id}/accept, POST /match-offers/{id}/decline, POST /match-offers/{id}/withdraw"
  - priority: 23
    category: state
    check: "Engagement.work_status is in the from-set of the requested transition (start requires NOT_STARTED, submit requires IN_PROGRESS, time-log and scope-change require IN_PROGRESS, quality-review requires SUBMITTED, handoff requires ACCEPTED, terminate requires a non-terminal value)"
    error_id: ERR_INVALID_WORK_STATE
    http_status: 409
    applies_to: "POST /engagements/{id}/start, POST /engagements/{id}/submit, POST /engagements/{id}/time-logs, POST /engagements/{id}/scope-change-requests, POST /engagements/{id}/quality-reviews, POST /engagements/{id}/handoff, POST /engagements/{id}/terminate, POST /engagements/{id}/satisfaction-surveys, POST /milestones/{id}/hold"
  - priority: 24
    category: state
    check: "Engagement.valuation_status permits the requested valuation stage: PROVISIONAL requires work_status IN {IN_PROGRESS, SUBMITTED}, FINAL requires work_status == HANDED_OFF, and a RESTATED engagement accepts no further posts"
    error_id: ERR_INVALID_VALUATION_STATE
    http_status: 409
    applies_to: "POST /engagements/{id}/valuations"
  - priority: 25
    category: state
    check: "EngagementAgreement.status is in the from-set of the requested transition (send requires DRAFTED or COUNTERED, counter requires SENT, execute requires SENT, void requires DRAFTED, SENT or COUNTERED)"
    error_id: ERR_INVALID_AGREEMENT_STATE
    http_status: 409
    applies_to: "POST /agreements/{id}/send, POST /agreements/{id}/counter, POST /agreements/{id}/execute, POST /agreements/{id}/void"
  - priority: 26
    category: state
    check: "Milestone.checkin_status == SCHEDULED"
    error_id: ERR_MILESTONE_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /milestones/{id}/hold"
  - priority: 27
    category: state
    check: "QualityReview.status == OPEN for scoring and == SCORED for deciding"
    error_id: ERR_REVIEW_NOT_SCORED
    http_status: 409
    applies_to: "POST /quality-reviews/{id}/score, POST /quality-reviews/{id}/decide"
  - priority: 28
    category: state
    check: "ScopeChangeRequest.status == PENDING"
    error_id: ERR_SCOPE_CHANGE_NOT_PENDING
    http_status: 409
    applies_to: "POST /scope-change-requests/{id}/decide"
  - priority: 29
    category: state
    check: "expected_project_request_version equals the current ProjectRequest.version"
    error_id: ERR_STALE_PROJECT_REQUEST_VERSION
    http_status: 412
    applies_to: "POST /project-requests/{id}/scope-definitions"
  - priority: 30
    category: state
    check: "expected_engagement_version equals the current Engagement.version"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /engagements/{id}/valuations, POST /engagements/{id}/agreements"
  - priority: 31
    category: business_safety
    check: "PartnerOrg.status != SUSPENDED for any partner-side or partner-scoped write"
    error_id: ERR_PARTNER_SUSPENDED
    http_status: 403
    applies_to: "POST /project-requests, POST /project-requests/{id}/submit-for-scoping, POST /scope-definitions/{id}/approve, POST /project-requests/{id}/match, POST /engagements/{id}/satisfaction-surveys"
  - priority: 32
    category: business_safety
    check: "Volunteer.credential_verified_at IS NOT NULL"
    error_id: ERR_CREDENTIAL_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /volunteers/{id}/availability-windows, POST /match-offers/{id}/accept"
  - priority: 33
    category: business_safety
    check: "Volunteer.status == ACTIVE"
    error_id: ERR_VOLUNTEER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /match-offers/{id}/accept, POST /engagements/{id}/start, POST /engagements/{id}/time-logs, POST /engagements/{id}/submit"
  - priority: 34
    category: business_safety
    check: "The handoff request carries confidentiality_attested == true and, when the pinned ScopeDefinition.confidentiality_tier == RESTRICTED, also carries a non-empty destruction_certificate_ref"
    error_id: ERR_CONFIDENTIALITY_ATTESTATION_MISSING
    http_status: 422
    applies_to: "POST /engagements/{id}/handoff"
  - priority: 35
    category: business_safety
    check: "EngagementAgreement.ip_disposition equals the pinned ScopeDefinition.ip_disposition, and EngagementAgreement.confidentiality_tier is not weaker than the pinned ScopeDefinition.confidentiality_tier under the ordering STANDARD < ELEVATED < RESTRICTED"
    error_id: ERR_IP_TERMS_MISMATCH
    http_status: 409
    applies_to: "POST /agreements/{id}/execute, POST /engagements/{id}/handoff"
  - priority: 36
    category: business_safety
    check: "The engagement's EngagementAgreement has status == EXECUTED"
    error_id: ERR_AGREEMENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /engagements/{id}/start, POST /engagements/{id}/time-logs"
  - priority: 37
    category: business_safety
    check: "EngagementAgreement.counter_round < MAX_COUNTER_ROUNDS (3) and the countering party differs from last_countered_by"
    error_id: ERR_COUNTER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /agreements/{id}/counter"
  - priority: 38
    category: business_temporal
    check: "The logical clock is strictly before MatchOffer.expires_at"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /match-offers/{id}/accept, POST /match-offers/{id}/decline"
  - priority: 39
    category: business_temporal
    check: "AvailabilityWindow.ends_at is strictly after starts_at and the whole half-open interval [starts_at, ends_at) lies inside some ProgramCycle's [starts_at, ends_at) interval"
    error_id: ERR_WINDOW_OUTSIDE_CYCLE
    http_status: 422
    applies_to: "POST /volunteers/{id}/availability-windows"
  - priority: 40
    category: business_temporal
    check: "Milestone.due_at lies inside the pinned AvailabilityWindow's half-open interval and strictly after Engagement.created_at"
    error_id: ERR_MILESTONE_DUE_OUTSIDE_ENGAGEMENT
    http_status: 422
    applies_to: "POST /engagements/{id}/milestones"
  - priority: 41
    category: business_temporal
    check: "TimeLog.work_date lies inside the pinned AvailabilityWindow's half-open interval [starts_at, ends_at)"
    error_id: ERR_WINDOW_OUTSIDE_CYCLE
    http_status: 422
    applies_to: "POST /engagements/{id}/time-logs"
  - priority: 42
    category: business_temporal
    check: "The requested clock instant is greater than or equal to the current logical clock"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 43
    category: business_constraint
    check: "The new AvailabilityWindow does not overlap any existing window of the same volunteer with status != EXPIRED. Overlap uses half-open geometry: reject when new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at. Exact adjacency (new.starts_at == existing.ends_at) is allowed, and no buffer or aggregate-hour cap participates"
    error_id: ERR_AVAILABILITY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /volunteers/{id}/availability-windows"
  - priority: 44
    category: business_constraint
    check: "The new Milestone.due_at is at least CHECKIN_BUFFER_HOURS (72) away from the due_at of every sibling milestone with checkin_status IN {SCHEDULED, HELD}. Buffer geometry is closed: reject when abs(new.due_at - existing.due_at) < 72h; exactly 72h apart is accepted"
    error_id: ERR_MILESTONE_SPACING_VIOLATION
    http_status: 409
    applies_to: "POST /engagements/{id}/milestones"
  - priority: 45
    category: business_constraint
    check: "Aggregate capacity on the volunteer: the count of Milestone rows with checkin_status == SCHEDULED across ALL engagements of the engaged Volunteer whose due_at falls in the closed window [new.due_at - 7 days, new.due_at + 7 days] must be at most CHECKIN_SATURATION_LIMIT (2) before the new row is added; the third such milestone is rejected"
    error_id: ERR_VOLUNTEER_CHECKIN_SATURATED
    http_status: 409
    applies_to: "POST /engagements/{id}/milestones"
  - priority: 46
    category: business_constraint
    check: "(volunteer_id, skill_code) is unique across SkillProfile"
    error_id: ERR_DUPLICATE_SKILL_PROFILE
    http_status: 409
    applies_to: "POST /volunteers/{id}/skill-profiles"
  - priority: 47
    category: business_constraint
    check: "Deliverable.sequence_no is unique within the scope revision, and at approve time ScopeDefinition.deliverable_weight_total_pct equals exactly 100.00 over non-WAIVED deliverables with deliverable_count >= 1"
    error_id: ERR_DELIVERABLE_WEIGHT_TOTAL_INVALID
    http_status: 422
    applies_to: "POST /scope-definitions/{id}/deliverables, POST /scope-definitions/{id}/approve"
  - priority: 48
    category: business_referential
    check: "The payload's deliverable_scores set is exactly the set of non-WAIVED Deliverable rows on the engagement's pinned ScopeDefinition - no extras, no omissions, and the set must be non-empty"
    error_id: ERR_DELIVERABLE_SET_MISMATCH
    http_status: 422
    applies_to: "POST /quality-reviews/{id}/score"
  - priority: 49
    category: business_referential
    check: "The ScopeDefinition pinned on the resource still has status == APPROVED; a pinned revision that has moved to SUPERSEDED or WITHDRAWN blocks the operation"
    error_id: ERR_SCOPE_VERSION_SUPERSEDED
    http_status: 409
    applies_to: "POST /match-offers/{id}/accept, POST /engagements/{id}/handoff, POST /agreements/{id}/send"
  - priority: 50
    category: business_referential
    check: "ProjectRequest.rescope_count < MAX_RESCOPES (3) when a rescope is being requested or forced"
    error_id: ERR_RESCOPE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /project-requests/{id}/rescope"
  - priority: 51
    category: business_fiscal
    check: "ProgramCycle.posture != FROZEN"
    error_id: ERR_CYCLE_CAPACITY_FROZEN
    http_status: 409
    applies_to: "POST /project-requests/{id}/match, POST /match-offers/{id}/accept"
  - priority: 52
    category: business_fiscal
    check: "When ProgramCycle.posture == RESTRICTED the request's urgency must be ELEVATED or CRITICAL"
    error_id: ERR_CYCLE_RESTRICTED_URGENCY
    http_status: 409
    applies_to: "POST /project-requests/{id}/match"
  - priority: 53
    category: business_fiscal
    check: "PartnerOrg.open_engagement_count < PartnerOrg.max_concurrent_engagements"
    error_id: ERR_PARTNER_ENGAGEMENT_LIMIT
    http_status: 409
    applies_to: "POST /project-requests/{id}/match, POST /match-offers/{id}/accept"
  - priority: 54
    category: business_fiscal
    check: "Volunteer.open_engagement_count < VOLUNTEER_MAX_CONCURRENT (2)"
    error_id: ERR_VOLUNTEER_CONCURRENCY_LIMIT
    http_status: 409
    applies_to: "POST /match-offers/{id}/accept"
  - priority: 55
    category: business_fiscal
    check: "The pinned AvailabilityWindow has hours_remaining greater than or equal to the hours being held or logged: reserved_hours at match time, additional_hours at scope-change approval, and TimeLog.hours at log time measured against hours_offered minus already-approved hours on that window"
    error_id: ERR_AVAILABILITY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /project-requests/{id}/match, POST /engagements/{id}/time-logs, POST /scope-change-requests/{id}/decide"
  - priority: 56
    category: business_fiscal
    check: "Engagement.creep_escalation_level != BREACH and no child ScopeChangeRequest has status IN {PENDING, ESCALATED}"
    error_id: ERR_SCOPE_BREACH_THRESHOLD
    http_status: 409
    applies_to: "POST /engagements/{id}/time-logs, POST /engagements/{id}/submit"
  - priority: 57
    category: business_fiscal
    check: "The match_score selector produced a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_VOLUNTEER
    http_status: 422
    applies_to: "POST /project-requests/{id}/match"

validation_priority_conflicts:
  - conflict_id: work_state_beats_availability_hours
    endpoint: "POST /engagements/{id}/time-logs"
    category_pair: "state vs business_fiscal"
    losing_check: "priority 55 ERR_AVAILABILITY_HOURS_EXCEEDED"
    winning_check: "priority 23 ERR_INVALID_WORK_STATE"
    dual_failure: "A log of 30.00 hours posted to an engagement whose work_status is already SUBMITTED fails both the state check (priority 23) and the window-hours check (priority 55). The response MUST be ERR_INVALID_WORK_STATE."
  - conflict_id: confidentiality_beats_superseded_scope
    endpoint: "POST /engagements/{id}/handoff"
    category_pair: "business_safety vs business_referential"
    losing_check: "priority 49 ERR_SCOPE_VERSION_SUPERSEDED"
    winning_check: "priority 34 ERR_CONFIDENTIALITY_ATTESTATION_MISSING"
    dual_failure: "A handoff posted with confidentiality_attested == false on an engagement whose pinned ScopeDefinition has moved to SUPERSEDED fails both the attestation check (priority 34) and the pinned-revision check (priority 49). The response MUST be ERR_CONFIDENTIALITY_ATTESTATION_MISSING."
  - conflict_id: window_temporal_beats_overlap
    endpoint: "POST /volunteers/{id}/availability-windows"
    category_pair: "business_temporal vs business_constraint"
    losing_check: "priority 43 ERR_AVAILABILITY_WINDOW_OVERLAP"
    winning_check: "priority 39 ERR_WINDOW_OUTSIDE_CYCLE"
    dual_failure: "A window that both extends past every ProgramCycle's ends_at and overlaps an existing window of the same volunteer fails the temporal containment check (priority 39) and the overlap check (priority 43). The response MUST be ERR_WINDOW_OUTSIDE_CYCLE."

endpoints:
  # ---------- partner orgs ----------
  - method: POST
    path: "/partner-orgs"
    description: "Register a nonprofit partner. capacity_class and max_concurrent_engagements are derived immediately."
    roles: [ProgramManager]
    code: 201
    input: [name, contact_email, sector, annual_budget_usd]
    output: PartnerOrg
    side_effects: ["runs calculation partner_capacity_class", "status defaults to ACTIVE, satisfaction_index null, satisfaction_sample_size 0"]
  - method: GET
    path: "/partner-orgs/{id}"
    description: "Read one partner org including derived capacity and satisfaction fields."
    roles: [ProgramManager, ScopingSpecialist, PartnerContact, QualityReviewer]
    code: 200
    input: []
    output: PartnerOrg
    side_effects: []
  - method: GET
    path: "/partner-orgs/{id}/summary"
    description: "Computed read: capacity_class, max_concurrent_engagements, open_engagement_count, satisfaction_index, satisfaction_sample_size and the per-survey composite scores that produced the index."
    roles: [ProgramManager, PartnerContact]
    code: 200
    input: []
    output: PartnerOrg
    side_effects: []
  - method: PATCH
    path: "/partner-orgs/{id}/status"
    description: "Move a partner between ACTIVE, PROBATION and SUSPENDED. SUSPENDED runs the full abandon/terminate cascade."
    roles: [ProgramManager]
    code: 200
    input: [to_status, "probation_reason?"]
    output: PartnerOrg
    side_effects: ["PartnerOrg status transition with the cascade declared on the PartnerOrg machine", "cascaded ProjectRequest -> ABANDONED, MatchOffer -> WITHDRAWN, Engagement -> TERMINATED, hour and slot releases"]
  - method: GET
    path: "/partner-orgs/{id}/satisfaction-surveys"
    description: "Every satisfaction survey attributed to this partner, newest submitted_at first, with counted_in_index flags."
    roles: [ProgramManager, PartnerContact]
    code: 200
    input: []
    output: SatisfactionSurvey[]
    side_effects: []

  # ---------- program cycles ----------
  - method: POST
    path: "/program-cycles"
    description: "Open a program cycle with a fixed slot capacity. Posture starts OPEN with zero committed and zero reserved slots."
    roles: [ProgramManager]
    code: 201
    input: [cycle_code, starts_at, ends_at, capacity_slot_total]
    output: ProgramCycle
    side_effects: ["runs calculation cycle_posture on the empty cycle: utilization_ratio 0.0000, posture OPEN, slots_available == capacity_slot_total"]
  - method: GET
    path: "/program-cycles/{id}"
    description: "Read one program cycle including slots_committed, slots_reserved, slots_available, utilization_ratio and posture."
    roles: [ProgramManager, ScopingSpecialist, PartnerContact]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: []
  - method: POST
    path: "/program-cycles/{id}/recalculate"
    description: "Ops-run checkpoint for one cycle: sweeps expired offers, marks overdue milestones MISSED, then recomputes capacity and posture. Advances recalc_epoch by one."
    roles: [ProgramManager]
    code: 200
    input: []
    output: ProgramCycle
    side_effects:
      - "every MatchOffer with status == OFFERED in this cycle whose expires_at <= logical clock moves to EXPIRED, releasing reserved hours and the reserved slot and incrementing ProjectRequest.failed_match_rounds"
      - "each such increment advances the owning ProjectRequest per the ProjectRequest machine: SCOPED, RESCOPING or ABANDONED"
      - "every Milestone with checkin_status == SCHEDULED and due_at + 24h < logical clock on a live engagement of this cycle moves to MISSED, bumping Engagement.missed_checkin_count and rerunning volunteer_reliability_score"
      - "runs calculation cycle_posture, stamps last_recalculated_at and increments recalc_epoch"
  - method: GET
    path: "/program-cycles/{id}/engagements"
    description: "Every engagement occupying a slot in this cycle, including terminal ones."
    roles: [ProgramManager, ScopingSpecialist]
    code: 200
    input: []
    output: Engagement[]
    side_effects: []

  # ---------- project requests and scoping ----------
  - method: POST
    path: "/project-requests"
    description: "Partner files a pro bono project request in DRAFT against a program cycle."
    roles: [PartnerContact]
    code: 201
    input: [partner_org_id, cycle_id, title, discipline, required_skill_code, min_proficiency, requested_hours, "urgency?"]
    output: ProjectRequest
    side_effects: ["status DRAFT, rescope_count 0, failed_match_rounds 0, active_scope_revision_no 0"]
  - method: GET
    path: "/project-requests/{id}"
    description: "Read one project request including active_scope_revision_no, rescope_count and failed_match_rounds."
    roles: [ProgramManager, ScopingSpecialist, PartnerContact]
    code: 200
    input: []
    output: ProjectRequest
    side_effects: []
  - method: GET
    path: "/project-requests"
    description: "Filtered, paginated list of project requests."
    roles: [ProgramManager, ScopingSpecialist, PartnerContact]
    code: 200
    input: ["partner_org_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: ProjectRequest[]
    side_effects: []
  - method: POST
    path: "/project-requests/{id}/submit-for-scoping"
    description: "Partner hands the request to the scoping team: DRAFT -> SCOPING."
    roles: [PartnerContact]
    code: 200
    input: []
    output: ProjectRequest
    side_effects: ["ProjectRequest.status DRAFT -> SCOPING"]
  - method: POST
    path: "/project-requests/{id}/scope-definitions"
    description: "Scoping specialist drafts a new scope revision. Optimistically concurrent on the parent request: expected_project_request_version must match, because a new revision supersedes the prior one."
    roles: [ScopingSpecialist]
    code: 201
    input: [expected_project_request_version, estimated_hours, complexity_factor, confidentiality_tier, ip_disposition, "supersedes_scope_id?"]
    output: ScopeDefinition
    side_effects:
      - "creates ScopeDefinition in DRAFT with revision_no = max(sibling revision_no) + 1 and authored_by_user_id = caller X-User-ID"
      - "any sibling revision still in DRAFT moves to WITHDRAWN"
      - "increments ProjectRequest.version by 1"
  - method: GET
    path: "/scope-definitions/{id}"
    description: "Read one scope revision including revision_no, deliverable_count, deliverable_weight_total_pct and authored_by_user_id."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact, QualityReviewer]
    code: 200
    input: []
    output: ScopeDefinition
    side_effects: []
  - method: GET
    path: "/scope-definitions"
    description: "Filtered, paginated list of scope revisions; supersedes_scope_id walks the revision chain forward from any revision."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact, QualityReviewer]
    code: 200
    input: ["project_request_id?", "supersedes_scope_id?", "status?", "limit?", "offset?"]
    output: ScopeDefinition[]
    side_effects: []
  - method: POST
    path: "/scope-definitions/{id}/deliverables"
    description: "Add a deliverable to a DRAFT scope revision. Weights must total exactly 100.00 before the revision can be approved."
    roles: [ScopingSpecialist]
    code: 201
    input: [title, sequence_no, weight_pct, hours_estimate, acceptance_criteria]
    output: Deliverable
    side_effects: ["recomputes ScopeDefinition.deliverable_count and deliverable_weight_total_pct"]
  - method: GET
    path: "/scope-definitions/{id}/deliverables"
    description: "Deliverables of one scope revision in sequence_no order, with review_status and review_score."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact, QualityReviewer]
    code: 200
    input: []
    output: Deliverable[]
    side_effects: []
  - method: POST
    path: "/scope-definitions/{id}/approve"
    description: "Partner approves a scope revision, moving the request SCOPING -> SCOPED and superseding any prior APPROVED revision."
    roles: [PartnerContact]
    code: 200
    input: []
    output: ScopeDefinition
    side_effects: ["ScopeDefinition DRAFT -> APPROVED with approved_at and approved_by_user_id", "prior APPROVED sibling -> SUPERSEDED", "ProjectRequest.status SCOPING -> SCOPED and active_scope_revision_no updated"]
  - method: POST
    path: "/project-requests/{id}/match"
    description: "Run the matching selector and create one MatchOffer for the top-ranked eligible volunteer. Request moves SCOPED -> MATCHING."
    roles: [ScopingSpecialist]
    code: 201
    input: []
    output: MatchOffer
    side_effects:
      - "runs calculation match_score over the candidate set and pins the winner, the chosen availability window, reserved_hours and expires_at"
      - "AvailabilityWindow.hours_committed += reserved_hours"
      - "ProgramCycle.slots_reserved += 1 and calculation cycle_posture reruns"
      - "ProjectRequest.status SCOPED -> MATCHING"
      - "on an empty candidate set no offer is created, failed_match_rounds += 1 and the call fails with ERR_NO_ELIGIBLE_VOLUNTEER"
  - method: POST
    path: "/project-requests/{id}/rescope"
    description: "Scoping specialist restarts scoping after an unsuccessful match or a forced scope breach: RESCOPING -> SCOPING."
    roles: [ScopingSpecialist]
    code: 200
    input: []
    output: ProjectRequest
    side_effects: ["ProjectRequest.status RESCOPING -> SCOPING", "every SCHEDULED Milestone on any live engagement of this request -> WAIVED with waiver_reason = RESCOPED"]
  - method: POST
    path: "/project-requests/{id}/abandon"
    description: "Close a request without delivery, releasing every hold it owns."
    roles: [ProgramManager]
    code: 200
    input: ["reason?"]
    output: ProjectRequest
    side_effects: ["ProjectRequest.status -> ABANDONED with closed_at stamped", "OFFERED offers -> WITHDRAWN releasing hours and slots", "DRAFT/APPROVED scope revisions -> WITHDRAWN"]

  # ---------- volunteers ----------
  - method: POST
    path: "/volunteers"
    description: "Enrol a volunteer in PENDING_VETTING. Reliability fields start at the 0.7500 baseline."
    roles: [ProgramManager]
    code: 201
    input: [full_name, email, professional_rate_usd_per_hour, seniority, weekly_hours_cap]
    output: Volunteer
    side_effects: ["status PENDING_VETTING, credential_verified_at null, reliability_score and reliability_score_lifetime 0.7500, lifetime_valued_usd 0.00"]
  - method: GET
    path: "/volunteers/{id}"
    description: "Read one volunteer including both reliability variants, open/terminal engagement counts and lifetime_valued_usd."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, QualityReviewer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []
  - method: POST
    path: "/volunteers/{id}/vet"
    description: "Complete vetting: stamps credential_verified_at, flips status PENDING_VETTING -> ACTIVE and marks the named skill claims verified."
    roles: [ProgramManager]
    code: 200
    input: ["verify_skill_codes?"]
    output: Volunteer
    side_effects: ["credential_verified_at = logical clock", "status PENDING_VETTING -> ACTIVE", "each SkillProfile whose skill_code is listed gets verified = true and verified_at stamped, which raises its match_score skill_component by VERIFIED_SKILL_BONUS"]
  - method: PATCH
    path: "/volunteers/{id}/status"
    description: "Pause, resume or deactivate a volunteer. Pausing withdraws every OFFERED offer held by that volunteer."
    roles: [ProgramManager]
    code: 200
    input: [to_status, "pause_reason?"]
    output: Volunteer
    side_effects: ["status transition among ACTIVE, PAUSED and DEACTIVATED", "on PAUSED or DEACTIVATED every MatchOffer with status == OFFERED for this volunteer moves to WITHDRAWN with withdraw_reason = VOLUNTEER_PAUSED, releasing window hours and cycle slots"]
  - method: POST
    path: "/volunteers/{id}/skill-profiles"
    description: "Volunteer declares a skill at a proficiency level. Unique per (volunteer_id, skill_code)."
    roles: [Volunteer]
    code: 201
    input: [skill_code, proficiency, years_experience]
    output: SkillProfile
    side_effects: ["verified defaults to false until a vetting run names the skill_code"]
  - method: GET
    path: "/volunteers/{id}/skill-profiles"
    description: "Skill claims of one volunteer with proficiency and verified flags."
    roles: [ProgramManager, ScopingSpecialist, Volunteer]
    code: 200
    input: []
    output: SkillProfile[]
    side_effects: []
  - method: POST
    path: "/volunteers/{id}/availability-windows"
    description: "Volunteer publishes a half-open availability window with an hour budget. Windows of one volunteer may touch but never overlap."
    roles: [Volunteer]
    code: 201
    input: [starts_at, ends_at, window_kind, hours_offered]
    output: AvailabilityWindow
    side_effects: ["hours_committed 0.00, hours_remaining == hours_offered, status OPEN"]
  - method: GET
    path: "/volunteers/{id}/availability-windows"
    description: "Availability windows of one volunteer with hours_committed and hours_remaining."
    roles: [ProgramManager, ScopingSpecialist, Volunteer]
    code: 200
    input: []
    output: AvailabilityWindow[]
    side_effects: []

  # ---------- match offers ----------
  - method: GET
    path: "/match-offers/{id}"
    description: "Read one offer including match_score, reserved_hours, expires_at and the pinned scope revision."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact]
    code: 200
    input: []
    output: MatchOffer
    side_effects: []
  - method: GET
    path: "/match-offers"
    description: "Filtered, paginated list of match offers across requests, volunteers, pinned scope revisions and availability windows."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact]
    code: 200
    input: ["project_request_id?", "volunteer_id?", "scope_definition_id?", "availability_window_id?", "status?", "limit?", "offset?"]
    output: MatchOffer[]
    side_effects: []
  - method: POST
    path: "/match-offers/{id}/accept"
    description: "Volunteer accepts an open offer, creating the Engagement and migrating the reserved hours into a committed hold."
    roles: [Volunteer]
    code: 201
    input: []
    output: Engagement
    side_effects:
      - "MatchOffer OFFERED -> ACCEPTED with responded_at stamped"
      - "creates Engagement with work_status NOT_STARTED, valuation_status UNVALUED, committed_hours = MatchOffer.reserved_hours"
      - "ProjectRequest.status MATCHING -> ENGAGED and ProjectRequest.version increments by 1"
      - "ProgramCycle.slots_reserved -= 1, slots_committed += 1, calculation cycle_posture reruns"
      - "CASCADE-A: a resulting FROZEN posture withdraws every other OFFERED offer in the cycle, which releases their window hours and increments their requests' failed_match_rounds, driving requests at MAX_MATCH_ROUNDS into RESCOPING"
      - "sibling OFFERED offers on the same request -> WITHDRAWN with withdraw_reason = ADMIN, releasing their hours without penalising the request"
  - method: POST
    path: "/match-offers/{id}/decline"
    description: "Volunteer declines an open offer, releasing the hold and returning the request to the matching pool."
    roles: [Volunteer]
    code: 200
    input: [decline_reason]
    output: MatchOffer
    side_effects: ["MatchOffer OFFERED -> DECLINED", "AvailabilityWindow.hours_committed -= reserved_hours; ProgramCycle.slots_reserved -= 1; cycle_posture reruns", "ProjectRequest.failed_match_rounds += 1 and the request advances to SCOPED, RESCOPING or ABANDONED", "decline_reason == IP_TERMS_UNACCEPTABLE additionally bars this volunteer from every later round on the request"]
  - method: POST
    path: "/match-offers/{id}/withdraw"
    description: "Scoping specialist pulls back an open offer."
    roles: [ScopingSpecialist]
    code: 200
    input: ["withdraw_reason?"]
    output: MatchOffer
    side_effects: ["MatchOffer OFFERED -> WITHDRAWN", "releases window hours and the reserved slot", "failed_match_rounds increments only when withdraw_reason != ADMIN"]

  # ---------- engagements ----------
  - method: GET
    path: "/engagements/{id}"
    description: "Read one engagement: both status dimensions, committed_hours, approved_hours, scope_creep_pct, creep_escalation_level, quality_gate and version."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact, QualityReviewer]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/engagements"
    description: "Filtered, paginated list of engagements across every reference axis."
    roles: [ProgramManager, ScopingSpecialist, Volunteer, PartnerContact, QualityReviewer]
    code: 200
    input: ["match_offer_id?", "project_request_id?", "volunteer_id?", "scope_definition_id?", "cycle_id?", "availability_window_id?", "work_status?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: POST
    path: "/engagements/{id}/agreements"
    description: "Issue the engagement agreement carrying the IP and confidentiality terms. Optimistically concurrent on the engagement, because re-issuing voids the prior non-executed agreement."
    roles: [ProgramManager]
    code: 201
    input: [expected_engagement_version, ip_disposition, confidentiality_tier, indemnity_cap_usd]
    output: EngagementAgreement
    side_effects: ["creates EngagementAgreement in DRAFTED with counter_round 0 and terms_revision_no 1", "any prior agreement on this engagement with status IN {DRAFTED, SENT, COUNTERED} moves to VOIDED with void_reason = TERMS_REJECTED", "increments Engagement.version by 1"]
  - method: GET
    path: "/engagements/{id}/agreements"
    description: "Agreement rows of one engagement, newest first; length 0 or 1 for a live engagement plus any voided predecessors."
    roles: [ProgramManager, Volunteer, PartnerContact]
    code: 200
    input: []
    output: EngagementAgreement[]
    side_effects: []
  - method: POST
    path: "/agreements/{id}/send"
    description: "Send or re-send the current terms revision for signature, clearing both signature slots."
    roles: [ProgramManager]
    code: 200
    input: []
    output: EngagementAgreement
    side_effects: ["status DRAFTED|COUNTERED -> SENT", "volunteer_signed_at and partner_signed_at cleared to null"]
  - method: POST
    path: "/agreements/{id}/counter"
    description: "Either party counters the terms, opening a new negotiation round. Round 4 is refused and voids the agreement."
    roles: [Volunteer, PartnerContact]
    code: 200
    input: [ip_disposition, confidentiality_tier, indemnity_cap_usd]
    output: EngagementAgreement
    side_effects: ["status SENT -> COUNTERED, counter_round += 1, terms_revision_no = counter_round + 1, last_countered_by set", "both signature slots cleared to null", "a counter attempted at counter_round == 3 voids the agreement with void_reason = COUNTER_LIMIT_EXCEEDED and terminates the engagement with termination_reason = AGREEMENT_VOIDED"]
  - method: POST
    path: "/agreements/{id}/execute"
    description: "Sign the current terms revision. The first call stamps one slot and leaves status SENT; the countersign by the other party completes execution."
    roles: [Volunteer, PartnerContact]
    code: 200
    input: []
    output: EngagementAgreement
    side_effects: ["stamps volunteer_signed_at or partner_signed_at for the current terms_revision_no", "status SENT -> EXECUTED once both slots carry a timestamp"]
  - method: POST
    path: "/agreements/{id}/void"
    description: "Void a non-executed agreement, terminating the engagement it governed."
    roles: [ProgramManager]
    code: 200
    input: ["void_reason?"]
    output: EngagementAgreement
    side_effects: ["status -> VOIDED with void_reason = TERMS_REJECTED", "Engagement.work_status -> TERMINATED with termination_reason = AGREEMENT_VOIDED, running the full release chain"]
  - method: POST
    path: "/engagements/{id}/start"
    description: "Volunteer begins work. Requires the agreement to be EXECUTED."
    roles: [Volunteer]
    code: 200
    input: []
    output: Engagement
    side_effects: ["Engagement.work_status NOT_STARTED -> IN_PROGRESS", "ProjectRequest.status ENGAGED -> IN_DELIVERY"]
  - method: POST
    path: "/engagements/{id}/milestones"
    description: "Schedule a milestone check-in. Spacing is guarded by a 72-hour buffer on the engagement and a rolling 14-day saturation cap on the volunteer."
    roles: [ProgramManager]
    code: 201
    input: [due_at]
    output: Milestone
    side_effects: ["creates Milestone in SCHEDULED with sequence_no = max(sibling sequence_no) + 1"]
  - method: GET
    path: "/engagements/{id}/milestones"
    description: "Milestones of one engagement in sequence_no order with check-in outcomes and variance_hours."
    roles: [ProgramManager, Volunteer, PartnerContact]
    code: 200
    input: []
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/milestones/{id}"
    description: "Read one milestone including reported_cumulative_hours, variance_hours and escalation_raised."
    roles: [ProgramManager, Volunteer, PartnerContact]
    code: 200
    input: []
    output: Milestone
    side_effects: []
  - method: POST
    path: "/milestones/{id}/hold"
    description: "Hold the check-in: approves the outstanding time logs dated at or before due_at, recomputes creep, and escalates or breaches accordingly."
    roles: [ProgramManager]
    code: 200
    input: [reported_cumulative_hours]
    output: Milestone
    side_effects:
      - "checkin_status SCHEDULED -> HELD with held_at stamped"
      - "every unapproved child TimeLog with work_date <= due_at flips approved = true and gets milestone_id set"
      - "Engagement.approved_hours recomputed, then calculation scope_creep_pct reruns"
      - "variance_hours computed against the post-approval approved_hours; escalation_raised set when creep_escalation_level IN {ESCALATED, BREACH}"
      - "a recomputed BREACH terminates the engagement with termination_reason = SCOPE_BREACH and moves ProjectRequest IN_DELIVERY -> RESCOPING"
  - method: GET
    path: "/milestones/{id}/time-logs"
    description: "Time logs approved by one milestone hold."
    roles: [ProgramManager, Volunteer]
    code: 200
    input: []
    output: TimeLog[]
    side_effects: []
  - method: POST
    path: "/engagements/{id}/time-logs"
    description: "Volunteer records hours worked. Logs stay unapproved until a milestone hold or the submit transition approves them."
    roles: [Volunteer]
    code: 201
    input: [work_date, hours, activity_class]
    output: TimeLog
    side_effects: ["creates TimeLog with approved = false and rate_basis_usd snapshotted from Volunteer.professional_rate_usd_per_hour", "runs calculation scope_creep_pct (unapproved hours do not move it yet)"]
  - method: GET
    path: "/engagements/{id}/time-logs"
    description: "Time logs of one engagement in work_date order with approval state and rate_basis_usd."
    roles: [ProgramManager, Volunteer, PartnerContact]
    code: 200
    input: []
    output: TimeLog[]
    side_effects: []
  - method: POST
    path: "/engagements/{id}/scope-change-requests"
    description: "Either party asks for more hours or more deliverables. The routing tier is computed at creation and an AUTO_APPROVABLE change is applied immediately."
    roles: [Volunteer, PartnerContact]
    code: 201
    input: [additional_hours, additional_deliverable_count, justification]
    output: ScopeChangeRequest
    side_effects:
      - "runs calculation scope_change_projection to set projected_creep_pct and decision_tier"
      - "AUTO_APPROVABLE -> status APPROVED at once: Engagement.committed_hours += additional_hours and AvailabilityWindow.hours_committed += additional_hours"
      - "MANAGER_REVIEW -> status PENDING and the pending hours immediately raise Engagement.scope_creep_pct"
      - "RESCOPE_REQUIRED -> status ESCALATED, engagement terminated with termination_reason = SCOPE_BREACH, ProjectRequest IN_DELIVERY -> RESCOPING"
  - method: GET
    path: "/engagements/{id}/scope-change-requests"
    description: "Scope change requests of one engagement with projected_creep_pct, decision_tier and status."
    roles: [ProgramManager, Volunteer, PartnerContact]
    code: 200
    input: []
    output: ScopeChangeRequest[]
    side_effects: []
  - method: POST
    path: "/scope-change-requests/{id}/decide"
    description: "Program manager approves or rejects a PENDING scope change."
    roles: [ProgramManager]
    code: 200
    input: [decision]
    output: ScopeChangeRequest
    side_effects: ["APPROVE -> status APPROVED, Engagement.committed_hours += additional_hours, AvailabilityWindow.hours_committed += additional_hours, scope_creep_pct recomputed against the new baseline", "REJECT -> status REJECTED and the pending hours leave the creep numerator"]
  - method: POST
    path: "/engagements/{id}/submit"
    description: "Volunteer submits the deliverable set for quality review, approving every outstanding time log."
    roles: [Volunteer]
    code: 200
    input: []
    output: Engagement
    side_effects: ["every unapproved child TimeLog flips approved = true", "Engagement.approved_hours and scope_creep_pct recomputed", "work_status IN_PROGRESS -> SUBMITTED"]
  - method: POST
    path: "/engagements/{id}/quality-reviews"
    description: "Quality reviewer opens a review round on a submitted engagement. Round 2 is only openable after a REWORK_REQUESTED round 1."
    roles: [QualityReviewer]
    code: 201
    input: []
    output: QualityReview
    side_effects: ["creates QualityReview in OPEN with round_no = max(sibling round_no) + 1 and reviewer_user_id = caller X-User-ID"]
  - method: GET
    path: "/engagements/{id}/quality-reviews"
    description: "Review rounds of one engagement with weighted_score, outcome and reviewer_user_id."
    roles: [ProgramManager, QualityReviewer, Volunteer, PartnerContact]
    code: 200
    input: []
    output: QualityReview[]
    side_effects: []
  - method: POST
    path: "/quality-reviews/{id}/score"
    description: "Score every non-WAIVED deliverable of the pinned scope revision. Produces weighted_score and outcome."
    roles: [QualityReviewer]
    code: 200
    input: [deliverable_scores]
    output: QualityReview
    side_effects: ["writes Deliverable.review_score for each scored item", "runs calculation deliverable_quality_score to set weighted_score and outcome", "status OPEN -> SCORED"]
  - method: POST
    path: "/quality-reviews/{id}/decide"
    description: "Commit the review outcome, or send the work back for rework. Blocked for the reviewer who authored the pinned scope."
    roles: [QualityReviewer]
    code: 200
    input: ["request_rework?"]
    output: QualityReview
    side_effects:
      - "status SCORED -> DECIDED with decided_at stamped, or SCORED -> REWORK_REQUESTED with rework_deadline_at when request_rework is true and outcome == CONDITIONAL"
      - "outcome IN {PASS, CONDITIONAL} -> Engagement.work_status SUBMITTED -> ACCEPTED, quality_gate updated, deliverables with review_score >= 3 -> ACCEPTED and the rest -> REJECTED"
      - "outcome == FAIL -> CASCADE-B: engagement TERMINATED with termination_reason = QUALITY_FAILURE, valuation_status -> RESTATED with a compensating INDEPENDENT_SECTOR record, Volunteer.lifetime_valued_usd and both reliability variants recomputed, and a volunteer whose reliability_score fell below 0.4000 moves to PAUSED, withdrawing that volunteer's other OFFERED offers"
      - "REWORK_REQUESTED -> Engagement.work_status SUBMITTED -> IN_PROGRESS and every non-WAIVED Deliverable review_score reset to null with review_status reset to PENDING"
  - method: POST
    path: "/engagements/{id}/handoff"
    description: "Program manager transfers the deliverable package to the partner, closing the request and releasing the cycle slot."
    roles: [ProgramManager]
    code: 200
    input: [confidentiality_attested, handoff_artifact_count, "destruction_certificate_ref?"]
    output: Engagement
    side_effects: ["work_status ACCEPTED -> HANDED_OFF with handoff_at stamped", "ProjectRequest.status IN_DELIVERY -> CLOSED with closed_at stamped", "ProgramCycle.slots_committed -= 1 and cycle_posture reruns", "AvailabilityWindow.hours_committed -= Engagement.committed_hours", "Volunteer.terminal_engagement_count += 1 and both reliability variants recomputed"]
  - method: POST
    path: "/engagements/{id}/terminate"
    description: "Terminate a live engagement, releasing the slot and hours and restating any posted valuation."
    roles: [ProgramManager]
    code: 200
    input: ["termination_reason?"]
    output: Engagement
    side_effects: ["work_status -> TERMINATED with terminated_at and termination_reason", "ProgramCycle.slots_committed -= 1; AvailabilityWindow.hours_committed -= committed_hours; cycle_posture reruns", "SCHEDULED milestones -> WAIVED, open scope changes -> VOIDED, non-executed agreement -> VOIDED", "valuation_status PROVISIONAL|FINAL -> RESTATED with a compensating record, then Volunteer.lifetime_valued_usd and both reliability variants recomputed"]
  - method: POST
    path: "/engagements/{id}/valuations"
    description: "Post a valuation record for one method. Optimistically concurrent on the engagement, because a post supersedes the prior record of the same method."
    roles: [ProgramManager]
    code: 201
    input: [expected_engagement_version, method]
    output: ValuationRecord
    side_effects:
      - "runs calculation volunteer_hour_valuation for the requested method, then calculation engagement_admin_overhead"
      - "creates ValuationRecord with sequence_no = max(sibling sequence_no of the same method) + 1 and variant_label PROVISIONAL or FINAL per Engagement.work_status"
      - "stamps superseded_at on the prior non-superseded record of the same method"
      - "Engagement.valuation_status advances UNVALUED -> PROVISIONAL or -> FINAL, or PROVISIONAL -> FINAL"
      - "Volunteer.lifetime_valued_usd recomputed from non-superseded INDEPENDENT_SECTOR records"
      - "increments Engagement.version by 1"
  - method: GET
    path: "/engagements/{id}/valuation-records"
    description: "Valuation records of one engagement, both methods, including superseded ones."
    roles: [ProgramManager, Volunteer, PartnerContact]
    code: 200
    input: []
    output: ValuationRecord[]
    side_effects: []
  - method: POST
    path: "/engagements/{id}/satisfaction-surveys"
    description: "Partner rates a completed engagement. Recomputes the partner satisfaction index and may move partner standing."
    roles: [PartnerContact]
    code: 201
    input: [score_expertise, score_responsiveness, score_deliverable_fit, would_recommend]
    output: SatisfactionSurvey
    side_effects: ["runs calculation partner_satisfaction_index: composite_score, counted_in_index, PartnerOrg.satisfaction_index and satisfaction_sample_size", "PartnerOrg.status may move ACTIVE -> PROBATION or PROBATION -> ACTIVE"]
  - method: GET
    path: "/engagements/{id}/satisfaction-surveys"
    description: "Satisfaction surveys filed against one engagement."
    roles: [ProgramManager, PartnerContact, Volunteer]
    code: 200
    input: []
    output: SatisfactionSurvey[]
    side_effects: []

  # ---------- test-driving surface ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every expiry, window, buffer and deadline rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. The clock may only move forward."
    roles: [ProgramManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances the logical clock; performs no sweep of its own - offer expiry and milestone misses are applied by POST /program-cycles/{id}/recalculate"]

errors:
  # ---- auth / authorization ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty on any endpoint."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed caller acts on a resource that does not resolve to its own X-User-ID: a PartnerContact on another org's request, engagement, scope approval or survey, or a Volunteer on another volunteer's skill profile, window, offer, engagement, time log or submission."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting operator is barred from the operation by duty separation: a QualityReviewer deciding a review whose pinned ScopeDefinition.authored_by_user_id equals the caller, or a QualityReviewer scoring a round whose reviewer_user_id is a different operator."
  - id: ERR_PARTNER_SUSPENDED
    http: 403
    condition: "The owning PartnerOrg.status == SUSPENDED on any write that advances a request, agreement, engagement or survey."

  # ---- not found ----
  - id: ERR_PARTNER_ORG_NOT_FOUND
    http: 404
    condition: "No PartnerOrg with the given id, or partner_org_id references a nonexistent org."
  - id: ERR_PROGRAM_CYCLE_NOT_FOUND
    http: 404
    condition: "No ProgramCycle with the given id, or cycle_id references a nonexistent cycle."
  - id: ERR_PROJECT_REQUEST_NOT_FOUND
    http: 404
    condition: "No ProjectRequest with the given id, or project_request_id references a nonexistent request."
  - id: ERR_SCOPE_DEFINITION_NOT_FOUND
    http: 404
    condition: "No ScopeDefinition with the given id, or supersedes_scope_id references a nonexistent revision."
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "A deliverable_scores entry names a deliverable id that does not belong to the review's pinned scope revision."
  - id: ERR_VOLUNTEER_NOT_FOUND
    http: 404
    condition: "No Volunteer with the given id, or volunteer_id references a nonexistent volunteer."
  - id: ERR_MATCH_OFFER_NOT_FOUND
    http: 404
    condition: "No MatchOffer with the given id."
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "No Engagement with the given id."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No EngagementAgreement with the given id."
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "No Milestone with the given id."
  - id: ERR_SCOPE_CHANGE_NOT_FOUND
    http: 404
    condition: "No ScopeChangeRequest with the given id."
  - id: ERR_QUALITY_REVIEW_NOT_FOUND
    http: 404
    condition: "No QualityReview with the given id."

  # ---- schema / envelope ----
  - id: ERR_VALIDATION
    http: 422
    condition: "A required field is missing, malformed, out of its declared range, or carries a value outside its enum."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit < 1, limit > 100, or offset < 0 on a paginated list endpoint."
  - id: ERR_ZERO_HOURS_NOT_ALLOWED
    http: 422
    condition: "hours, hours_offered, requested_hours, estimated_hours or additional_hours is submitted as exactly 0."

  # ---- state ----
  - id: ERR_INVALID_REQUEST_STATE
    http: 409
    condition: "The ProjectRequest is not in a status from which the attempted transition is declared (submit-for-scoping outside DRAFT, match outside SCOPED, rescope outside RESCOPING, abandon from CLOSED or ABANDONED)."
  - id: ERR_INVALID_SCOPE_STATE
    http: 409
    condition: "A scope revision is not in DRAFT when a deliverable is added or when approval is attempted."
  - id: ERR_OFFER_NOT_OPEN
    http: 409
    condition: "An accept, decline or withdraw targets a MatchOffer whose status is not OFFERED."
  - id: ERR_INVALID_WORK_STATE
    http: 409
    condition: "The Engagement's work_status forbids the operation (start outside NOT_STARTED, time log or scope change outside IN_PROGRESS, submit outside IN_PROGRESS, review outside SUBMITTED, handoff outside ACCEPTED, terminate from HANDED_OFF or TERMINATED)."
  - id: ERR_INVALID_VALUATION_STATE
    http: 409
    condition: "A valuation post is attempted against valuation_status == RESTATED, or a FINAL post is attempted while work_status is still IN_PROGRESS or NOT_STARTED."
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "The agreement is not in a status from which the attempted transition is declared (send outside DRAFTED|COUNTERED, counter outside SENT, sign outside SENT, void from EXECUTED or VOIDED)."
  - id: ERR_MILESTONE_NOT_SCHEDULED
    http: 409
    condition: "A hold targets a Milestone whose checkin_status is not SCHEDULED."
  - id: ERR_REVIEW_NOT_SCORED
    http: 409
    condition: "A decide targets a QualityReview whose status is not SCORED, or a score targets a review not in OPEN."
  - id: ERR_SCOPE_CHANGE_NOT_PENDING
    http: 409
    condition: "A decision targets a ScopeChangeRequest whose status is not PENDING."
  - id: ERR_VOLUNTEER_NOT_ACTIVE
    http: 409
    condition: "The acting or targeted Volunteer.status is not ACTIVE on a skill claim, window publication, offer response or delivery write."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_PROJECT_REQUEST_VERSION
    http: 412
    condition: "expected_project_request_version does not equal the stored ProjectRequest.version on POST /project-requests/{id}/scope-definitions."
  - id: ERR_STALE_ENGAGEMENT_VERSION
    http: 412
    condition: "expected_engagement_version does not equal the stored Engagement.version on POST /engagements/{id}/valuations or POST /engagements/{id}/agreements."

  # ---- business: safety and terms ----
  - id: ERR_CREDENTIAL_NOT_VERIFIED
    http: 422
    condition: "A volunteer with credential_verified_at == null is offered, accepts, or is admitted to a confidentiality_tier of RESTRICTED or PRIVILEGED."
  - id: ERR_CONFIDENTIALITY_ATTESTATION_MISSING
    http: 422
    condition: "Handoff is attempted with confidentiality_attested false, or a PRIVILEGED-tier handoff omits destruction_certificate_ref."
  - id: ERR_IP_TERMS_MISMATCH
    http: 409
    condition: "An agreement's ip_disposition or confidentiality_tier diverges from the pinned ScopeDefinition's terms at send, counter or execute."
  - id: ERR_AGREEMENT_NOT_EXECUTED
    http: 409
    condition: "Work is started, hours are logged, a milestone is scheduled, or a review is opened while the governing agreement is not EXECUTED."
  - id: ERR_COUNTER_LIMIT_EXCEEDED
    http: 409
    condition: "A counter is attempted at counter_round == 3, exhausting the three permitted negotiation rounds."
  - id: ERR_SCOPE_VERSION_SUPERSEDED
    http: 409
    condition: "A write references a ScopeDefinition whose status is SUPERSEDED or WITHDRAWN, or whose revision_no is below the request's active_scope_revision_no."
  - id: ERR_DELIVERABLE_WEIGHT_TOTAL_INVALID
    http: 422
    condition: "Approval is attempted while the revision's deliverable weight_pct values do not total exactly 100.00, or an added deliverable would push the total above 100.00."
  - id: ERR_DELIVERABLE_SET_MISMATCH
    http: 422
    condition: "A score submission does not cover exactly the non-WAIVED deliverables of the pinned revision - a missing item or a duplicate deliverable id."
  - id: ERR_NO_ELIGIBLE_VOLUNTEER
    http: 422
    condition: "The matching selector's candidate pool is empty after eligibility filtering."

  # ---- business: temporal ----
  - id: ERR_OFFER_EXPIRED
    http: 409
    condition: "An accept or decline arrives at or after MatchOffer.expires_at on the logical clock."
  - id: ERR_WINDOW_OUTSIDE_CYCLE
    http: 422
    condition: "An availability window's half-open interval is malformed (ends_at <= starts_at) or is not contained by any ProgramCycle interval."
  - id: ERR_MILESTONE_DUE_OUTSIDE_ENGAGEMENT
    http: 422
    condition: "A milestone due_at falls outside the pinned availability window's half-open interval or outside the owning cycle's interval."
  - id: ERR_CLOCK_REGRESSION
    http: 422
    condition: "POST /_clock/set_current_utc supplies an instant at or before the current logical clock."

  # ---- business: constraint ----
  - id: ERR_AVAILABILITY_WINDOW_OVERLAP
    http: 409
    condition: "A new window's half-open interval overlaps a non-EXPIRED window of the same volunteer; exact adjacency (new.starts_at == existing.ends_at) is permitted."
  - id: ERR_MILESTONE_SPACING_VIOLATION
    http: 409
    condition: "A milestone due_at falls within 72 hours of an existing non-WAIVED milestone due_at on the same engagement, inclusive at both edges."
  - id: ERR_VOLUNTEER_CHECKIN_SATURATED
    http: 409
    condition: "A milestone would give the volunteer more than 2 SCHEDULED or HELD check-ins inside any rolling 14-day span."
  - id: ERR_DUPLICATE_SKILL_PROFILE
    http: 409
    condition: "A SkillProfile already exists for the (volunteer_id, skill_code) pair."

  # ---- business: capacity and fiscal ----
  - id: ERR_CYCLE_CAPACITY_FROZEN
    http: 409
    condition: "Matching or acceptance is attempted while the ProgramCycle.posture == FROZEN."
  - id: ERR_CYCLE_RESTRICTED_URGENCY
    http: 409
    condition: "A ROUTINE-urgency request is matched while the ProgramCycle.posture == RESTRICTED, where only ELEVATED and CRITICAL requests may consume slots."
  - id: ERR_PARTNER_ENGAGEMENT_LIMIT
    http: 409
    condition: "Acceptance would push PartnerOrg.open_engagement_count above max_concurrent_engagements for the org's capacity_class."
  - id: ERR_VOLUNTEER_CONCURRENCY_LIMIT
    http: 409
    condition: "An offer or acceptance would give the volunteer more than VOLUNTEER_MAX_CONCURRENT (2) live engagements."
  - id: ERR_AVAILABILITY_HOURS_EXCEEDED
    http: 422
    condition: "Reserved, committed or logged hours would drive AvailabilityWindow.hours_remaining below 0.00, or logged hours would exceed the window's hours_offered."
  - id: ERR_RESCOPE_LIMIT_REACHED
    http: 409
    condition: "A rescope is attempted on a request whose rescope_count already equals MAX_RESCOPES (2); the request must be abandoned instead."
  - id: ERR_SCOPE_BREACH_THRESHOLD
    http: 409
    condition: "An hour-adding write would leave Engagement.scope_creep_pct at or above the 0.5000 BREACH floor, which forbids incremental change and forces a rescope."

