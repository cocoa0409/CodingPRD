            - call: "POST /mpi/merge-operations/${merge_xb_id}/unmerge"
              payload: { unmerge_reason: "Wrong survivor chosen." }
              as: IdentityStewardApprover
              as_user_id: "steward-2"
              captures: { merge_xb_state: $.data.state, merge_xb_v2: $.data.version }
