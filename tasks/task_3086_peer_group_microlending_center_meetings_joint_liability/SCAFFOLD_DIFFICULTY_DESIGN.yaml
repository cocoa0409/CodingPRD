# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3086_peer_group_microlending_center_meetings_joint_liability
#
# Depth probe: 2 instances per each of the 9 Difficulty Rules of SKILL §0.5.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 elements only.
#
# Numeric pins used below (all derived from SCAFFOLD §1.3 constants):
#   first-cycle loan 100000c: installment 4600c (= round_half_up(109600/24)),
#     savings 200c (= max(200, round_half_up(0.02*4600)=92)), floor 4600+200=4801c,
#     full payoff = savings 200 + outstanding 110600 = 110800c (overpayment rejected)
#   STANDARD cycle-2 ceiling 200000c; REHABILITATED ceiling
#     min(200000, floor(1.5*100000)) = 150000c
#   credit scores: provisional at disbursement 720 (= 600 + 5*24);
#     final payoff example 845 (= 600 + 10*24 + 2*4 - 15*1, clamped to 850)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: ladder_ceiling_standard_vs_rehabilitated_same_member_profile
        grounds:
          - calculations.next_loan_ceiling
          - state_machines.Loan.DELINQUENT_to_ACTIVE
          - state_machines.Loan.ACTIVE_to_PAID_OFF
          - validations[priority=9]
        distinguishing_aspect: |
          Two applicants who each repaid the same 100000c first-cycle loan:
          the clean payer advances to cycle_level 2 (STANDARD variant, ceiling
          200000c) while the once-cured payer stays at cycle_level 1 with
          cured_delinquency_count 1 (REHABILITATED variant, ceiling
          min(100000, floor(1.5*100000)) = 100000c — the ladder row is frozen
          AND the 1.5x cap bites). An identical 175000c request disburses for
          the clean payer and is rejected for the rehabilitated payer.
        test_recipe:
          setup:
            - "Member M1 completed cycle 1 (100000c) with zero missed installments; cycle_level == 2, cured_delinquency_count == 0, no open loan."
            - "Member M2 completed cycle 1 (100000c) but was cured once (DELINQUENT -> ACTIVE) before payoff; cycle_level stays 1 (missed installments block advancement), cured_delinquency_count == 1, no open loan."
            - "Both groups ACTIVE; both applications APPROVED via unanimous votes."
          setup_api_calls:
            # --- group 1 + member M1, clean payoff of cycle 1 ---
            - &d_clock0
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - &d_branch
              call: "POST /branches"
              payload: { name: "Delta Branch" }
              as: ProgramAdmin
              captures: { branch_id: $.data.id }
            - &d_mgr
              call: "POST /center-managers"
              payload: { branch_id: "${branch_id}", full_name: "Dora Field", hired_on: "2026-08-01" }
              as: ProgramAdmin
              captures: { mgr_id: $.data.id }
            - &d_center
              call: "POST /centers"
              payload: { branch_id: "${branch_id}", center_manager_id: "${mgr_id}", name: "Delta Center", meeting_day_of_week: 1 }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - &d_g1
              call: "POST /peer-groups"
              payload: { center_id: "${center_id}", name: "G1" }
              as: FieldOfficer
              captures: { g1_id: $.data.id }
            - &d_g2
              call: "POST /peer-groups"
              payload: { center_id: "${center_id}", name: "G2" }
              as: FieldOfficer
              captures: { g2_id: $.data.id }
            - &d_m1
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "M One", national_id: "NID-001" }
              as: FieldOfficer
              captures: { m1: $.data.id }
            - &d_p1
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "P One", national_id: "NID-011" }
              as: FieldOfficer
              captures: { p1: $.data.id }
            - &d_p2
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "P Two", national_id: "NID-012" }
              as: FieldOfficer
              captures: { p2: $.data.id }
            - &d_p3
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "P Three", national_id: "NID-013" }
              as: FieldOfficer
              captures: { p3: $.data.id }
            - &d_p4
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "P Four", national_id: "NID-014" }
              as: FieldOfficer
              captures: { p4: $.data.id }
            - &d_m2
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "M Two", national_id: "NID-002" }
              as: FieldOfficer
              captures: { m2: $.data.id }
            - &d_q1
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "Q One", national_id: "NID-021" }
              as: FieldOfficer
              captures: { q1: $.data.id }
            - &d_q2
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "Q Two", national_id: "NID-022" }
              as: FieldOfficer
              captures: { q2: $.data.id }
            - &d_q3
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "Q Three", national_id: "NID-023" }
              as: FieldOfficer
              captures: { q3: $.data.id }
            - &d_q4
              call: "POST /members"
              payload: { branch_id: "${branch_id}", full_name: "Q Four", national_id: "NID-024" }
              as: FieldOfficer
              captures: { q4: $.data.id }
            - &d_add_m1
              call: "POST /peer-groups/${g1_id}/members"
              payload: { member_id: "${m1}" }
              as: FieldOfficer
            - &d_add_p1
              call: "POST /peer-groups/${g1_id}/members"
              payload: { member_id: "${p1}" }
              as: FieldOfficer
            - &d_add_p2
              call: "POST /peer-groups/${g1_id}/members"
              payload: { member_id: "${p2}" }
              as: FieldOfficer
            - &d_add_p3
              call: "POST /peer-groups/${g1_id}/members"
              payload: { member_id: "${p3}" }
              as: FieldOfficer
            - &d_add_p4
              call: "POST /peer-groups/${g1_id}/members"
              payload: { member_id: "${p4}" }
              as: FieldOfficer
            - &d_add_m2
              call: "POST /peer-groups/${g2_id}/members"
              payload: { member_id: "${m2}" }
              as: FieldOfficer
            - &d_add_q1
              call: "POST /peer-groups/${g2_id}/members"
              payload: { member_id: "${q1}" }
              as: FieldOfficer
            - &d_add_q2
              call: "POST /peer-groups/${g2_id}/members"
              payload: { member_id: "${q2}" }
              as: FieldOfficer
            - &d_add_q3
              call: "POST /peer-groups/${g2_id}/members"
              payload: { member_id: "${q3}" }
              as: FieldOfficer
            - &d_add_q4
              call: "POST /peer-groups/${g2_id}/members"
              payload: { member_id: "${q4}" }
              as: FieldOfficer
            - &d_tr1
              call: "POST /group-training-sessions"
              payload: { peer_group_id: "${g1_id}", center_manager_id: "${mgr_id}", start_time: "2026-09-02T09:00:00Z", end_time: "2026-09-02T10:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { tr1: $.data.id }
            - &d_tr1c
              call: "POST /group-training-sessions/${tr1}/complete"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_tr2
              call: "POST /group-training-sessions"
              payload: { peer_group_id: "${g1_id}", center_manager_id: "${mgr_id}", start_time: "2026-09-03T09:00:00Z", end_time: "2026-09-03T10:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { tr2: $.data.id }
            - &d_tr2c
              call: "POST /group-training-sessions/${tr2}/complete"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_tr3
              call: "POST /group-training-sessions"
              payload: { peer_group_id: "${g2_id}", center_manager_id: "${mgr_id}", start_time: "2026-09-02T11:00:00Z", end_time: "2026-09-02T12:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { tr3: $.data.id }
            - &d_tr3c
              call: "POST /group-training-sessions/${tr3}/complete"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_tr4
              call: "POST /group-training-sessions"
              payload: { peer_group_id: "${g2_id}", center_manager_id: "${mgr_id}", start_time: "2026-09-03T11:00:00Z", end_time: "2026-09-03T12:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { tr4: $.data.id }
            - &d_tr4c
              call: "POST /group-training-sessions/${tr4}/complete"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            # --- M1 cycle-1 application, approval, disbursement ---
            - &d_app1
              call: "POST /peer-groups/${g1_id}/loan-applications"
              payload: { member_id: "${m1}", requested_amount_cents: 100000 }
              as: FieldOfficer
              captures: { app1: $.data.id }
            - &d_app1s
              call: "POST /loan-applications/${app1}/submit"
              payload: {}
              as: FieldOfficer
            - &d_app1_v1
              call: "POST /loan-applications/${app1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p1}"
            - &d_app1_v2
              call: "POST /loan-applications/${app1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p2}"
            - &d_app1_v3
              call: "POST /loan-applications/${app1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p3}"
            - &d_app1_v4
              call: "POST /loan-applications/${app1}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p4}"
            - &d_app1_disb
              call: "POST /loan-applications/${app1}/disburse"
              payload: {}
              as: BranchManager
            - &d_loan1
              call: "GET /loan-applications/${app1}/loan"
              payload: {}
              as: BranchManager
              captures: { loan1: "$.data[0].id" }
            # --- M1 pays off cleanly: savings 200 + outstanding 110600 = 110800 ---
            - &d_mt1
              call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-08T10:00:00Z", scheduled_end: "2026-09-08T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt1: $.data.id }
            - &d_mt1o
              call: "POST /center-meetings/${mt1}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_att_p1
              call: "POST /center-meetings/${mt1}/attendance"
              payload: { member_id: "${p1}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_att_p2
              call: "POST /center-meetings/${mt1}/attendance"
              payload: { member_id: "${p2}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_att_p3
              call: "POST /center-meetings/${mt1}/attendance"
              payload: { member_id: "${p3}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_att_p4
              call: "POST /center-meetings/${mt1}/attendance"
              payload: { member_id: "${p4}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_att_m1
              call: "POST /center-meetings/${mt1}/attendance"
              payload: { member_id: "${m1}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_coll_m1_full
              call: "POST /center-meetings/${mt1}/collections"
              payload: { member_id: "${m1}", loan_id: "${loan1}", amount_cents: 110800 }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_mt1c
              call: "POST /center-meetings/${mt1}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            # --- M2 cycle-1: miss first due -> delinquency -> cure -> payoff ---
            - &d_app2
              call: "POST /peer-groups/${g2_id}/loan-applications"
              payload: { member_id: "${m2}", requested_amount_cents: 100000 }
              as: FieldOfficer
              captures: { app2: $.data.id }
            - &d_app2s
              call: "POST /loan-applications/${app2}/submit"
              payload: {}
              as: FieldOfficer
            - &d_app2_v1
              call: "POST /loan-applications/${app2}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q1}"
            - &d_app2_v2
              call: "POST /loan-applications/${app2}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q2}"
            - &d_app2_v3
              call: "POST /loan-applications/${app2}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q3}"
            - &d_app2_v4
              call: "POST /loan-applications/${app2}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q4}"
            - &d_app2_disb
              call: "POST /loan-applications/${app2}/disburse"
              payload: {}
              as: BranchManager
            - &d_loan2
              call: "GET /loan-applications/${app2}/loan"
              payload: {}
              as: BranchManager
              captures: { loan2: "$.data[0].id" }
            - &d_clock_16d
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-17T00:00:00Z" }
              as: ProgramAdmin
            # --- M2 cure + full payoff in one collection (savings 200 + outstanding 110600) ---
            - &d_mt2
              call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-22T10:00:00Z", scheduled_end: "2026-09-22T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt2: $.data.id }
            - &d_mt2o
              call: "POST /center-meetings/${mt2}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_att2_m2
              call: "POST /center-meetings/${mt2}/attendance"
              payload: { member_id: "${m2}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_coll_m2_full
              call: "POST /center-meetings/${mt2}/collections"
              payload: { member_id: "${m2}", loan_id: "${loan2}", amount_cents: 110800 }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - &d_mt2c
              call: "POST /center-meetings/${mt2}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            # --- cycle-2 applications at 175000c for both ---
            - &d_app3
              call: "POST /peer-groups/${g1_id}/loan-applications"
              payload: { member_id: "${m1}", requested_amount_cents: 175000 }
              as: FieldOfficer
              captures: { app3: $.data.id }
            - &d_app3s
              call: "POST /loan-applications/${app3}/submit"
              payload: {}
              as: FieldOfficer
            - &d_app3_v1
              call: "POST /loan-applications/${app3}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p1}"
            - &d_app3_v2
              call: "POST /loan-applications/${app3}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p2}"
            - &d_app3_v3
              call: "POST /loan-applications/${app3}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p3}"
            - &d_app3_v4
              call: "POST /loan-applications/${app3}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${p4}"
            - &d_app4
              call: "POST /peer-groups/${g2_id}/loan-applications"
              payload: { member_id: "${m2}", requested_amount_cents: 175000 }
              as: FieldOfficer
              captures: { app4: $.data.id }
            - &d_app4s
              call: "POST /loan-applications/${app4}/submit"
              payload: {}
              as: FieldOfficer
            - &d_app4_v1
              call: "POST /loan-applications/${app4}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q1}"
            - &d_app4_v2
              call: "POST /loan-applications/${app4}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q2}"
            - &d_app4_v3
              call: "POST /loan-applications/${app4}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q3}"
            - &d_app4_v4
              call: "POST /loan-applications/${app4}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q4}"
          trigger:
            - call: "POST /loan-applications/${app3}/disburse"
              payload: {}
              as: BranchManager
            - call: "POST /loan-applications/${app4}/disburse"
              payload: {}
              as: BranchManager
              captures: { err_rehab: $.data.error_id }
          assert:
            - "LoanApplication.${app3}.status == DISBURSED"
            - "LoanApplication.${app3}.applied_ceiling_cents == 200000 (cycle_level 2, STANDARD)"
            - "the second trigger call returns 422 with error_id ERR_LADDER_CEILING_EXCEEDED"
            - "LoanApplication.${app4}.status == APPROVED (unchanged; failed disburse does not revert approval)"
            - "Member.${m1}.cycle_level == 2 and cured_delinquency_count == 0; Member.${m2}.cycle_level == 1 and cured_delinquency_count == 1 — identical repaid principal, different variant"
            - "Member.${m2}'s rehabilitated ceiling is min(100000, floor(1.5*100000)) == 100000c < 175000c requested"

      - name: credit_score_provisional_vs_final_same_loan
        grounds:
          - calculations.credit_score_provisional
          - calculations.credit_score_final
          - entities.CreditBureauReport.fields.score_reported
          - state_machines.Loan.ACTIVE_to_PAID_OFF
        distinguishing_aspect: |
          The same cycle-1 loan is reported to the bureau twice under two
          formulas on the Member/credit-file domain: at disbursement the
          PROVISIONAL report credits all 24 remaining installments (+5 each)
          for score 720, while at payoff the FINAL report drops projected
          credit, counts 24 on-time installments (+10 each), adds the
          attendance bonus, and deducts the strike — 845 — so the two readings
          of the same underlying loan differ by exactly 125 points.
        test_recipe:
          setup:
            - "M1's cycle-1 loan disbursed at 2026-09-01T00:00:00Z and paid off in full at the 2026-09-08 meeting where M1 was PRESENT; M1 then earns exactly one attendance strike by being auto-marked ABSENT at two consecutive later meetings (2026-09-22 and 2026-09-29) closed without an attendance row for M1."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_g2
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_m2
            - *d_q1
            - *d_q2
            - *d_q3
            - *d_q4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_add_m2
            - *d_add_q1
            - *d_add_q2
            - *d_add_q3
            - *d_add_q4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
            - *d_tr3
            - *d_tr3c
            - *d_tr4
            - *d_tr4c
            - *d_app1
            - *d_app1s
            - *d_app1_v1
            - *d_app1_v2
            - *d_app1_v3
            - *d_app1_v4
            - *d_app1_disb
            - *d_loan1
            - *d_mt1
            - *d_mt1o
            - *d_att_p1
            - *d_att_p2
            - *d_att_p3
            - *d_att_p4
            - *d_att_m1
            - *d_coll_m1_full
            # --- M1 absent at a second meeting before closing mt1 is wrong order;
            #     close mt1 first (present), then a second meeting with M1 absent. ---
            - *d_mt1c
            - *d_clock_16d
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-22T10:00:00Z", scheduled_end: "2026-09-22T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt9: $.data.id }
            - call: "POST /center-meetings/${mt9}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt9}/attendance"
              payload: { member_id: "${p1}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt9}/attendance"
              payload: { member_id: "${p2}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt9}/attendance"
              payload: { member_id: "${p3}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt9}/attendance"
              payload: { member_id: "${p4}", present: true }
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt9}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            # M1 was never marked at mt9 -> auto-ABSENT (streak 1, no strike yet)
            - call: "POST /center-meetings"
              payload: { center_id: "${center_id}", scheduled_start: "2026-09-29T10:00:00Z", scheduled_end: "2026-09-29T11:00:00Z" }
              as: CenterManager
              as_user_id: "${mgr_id}"
              captures: { mt10: $.data.id }
            - call: "POST /center-meetings/${mt10}/open"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            - call: "POST /center-meetings/${mt10}/close"
              payload: {}
              as: CenterManager
              as_user_id: "${mgr_id}"
            # M1 auto-ABSENT again -> streak 2 -> strike 1
          trigger:
            - call: "GET /members/${m1}/bureau-reports"
              payload: {}
              as: BranchManager
          assert:
            - "Member.${m1}.attendance_strikes == 1"
            - "the PROVISIONAL CreditBureauReport for loan ${loan1} has score_reported == 720 (600 + 5*24 projected installments)"
            - "the FINAL CreditBureauReport for loan ${loan1} has score_reported == 845 (600 + 10*24 + 2*1 attended meeting - 15*1 strike)"
            - "Member.${m1}.credit_score == 845 after payoff (final formula governs once no loan is open), and == 720 immediately after disbursement (provisional formula governs while the loan is ACTIVE)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: installment_split_rehab_penalty_tier_selection
        grounds:
          - calculations.installment_and_savings_split
          - entities.Loan.fields.weekly_installment_cents
          - entities.Loan.fields.savings_required_cents
        distinguishing_aspect: |
          Mode (a): four inputs (principal, term, cycle tier, cured-delinquency
          count) interact non-linearly through conditional rate branches and a
          tiered percentage with a floor. A rehabilitated borrower
          (cured_delinquency_count == 1) re-borrowing 100000c at cycle_level 1
          pays rate 0.005 (not 0.004): installment round_half_up(112000/24) =
          4667c, savings max(200, round_half_up(0.02*4667)=93) = 200c — both
          components differ from the clean-borrower 4600/200 split.
        test_recipe:
          setup:
            - "Member M2 of group G2 repaid a cycle-1 loan after one cured delinquency (cured_delinquency_count == 1, cycle_level == 1); G2 ACTIVE."
            - "M2's new application for 100000c approved unanimously."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g2
            - *d_m2
            - *d_q1
            - *d_q2
            - *d_q3
            - *d_q4
            - *d_add_m2
            - *d_add_q1
            - *d_add_q2
            - *d_add_q3
            - *d_add_q4
            - *d_tr3
            - *d_tr3c
            - *d_tr4
            - *d_tr4c
            - *d_app2
            - *d_app2s
            - *d_app2_v1
            - *d_app2_v2
            - *d_app2_v3
            - *d_app2_v4
            - *d_app2_disb
            - *d_loan2
            - *d_clock_16d
            - *d_mt2
            - *d_mt2o
            - *d_att2_m2
            - *d_coll_m2_full
            - *d_mt2c
            - call: "POST /peer-groups/${g2_id}/loan-applications"
              payload: { member_id: "${m2}", requested_amount_cents: 100000 }
              as: FieldOfficer
              captures: { app5: $.data.id }
            - call: "POST /loan-applications/${app5}/submit"
              payload: {}
              as: FieldOfficer
            - call: "POST /loan-applications/${app5}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q1}"
            - call: "POST /loan-applications/${app5}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q2}"
            - call: "POST /loan-applications/${app5}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q3}"
            - call: "POST /loan-applications/${app5}/votes"
              payload: { decision: "APPROVE" }
              as: Member
              as_user_id: "${q4}"
          trigger:
            - call: "POST /loan-applications/${app5}/disburse"
              payload: {}
              as: BranchManager
              captures: { loan3: $.data.id }
          assert:
            - "Loan.${loan3}.weekly_installment_cents == 4667 (rate 0.005 rehabilitated branch, round_half_up(112000/24))"
            - "Loan.${loan3}.savings_required_cents == 200 (floor binds: 2% of 4667 = 93 < 200)"
            - "Loan.${loan3}.principal_outstanding_cents == 112008 (4667 * 24)"
            - "Loan.${loan3}.cycle_level == 1"

      - name: expansion_feasibility_pinned_evaluation_order
        grounds:
          - calculations.expansion_feasibility
          - entities.Branch.fields.tier
          - entities.CenterManager.fields.center_cap
          - entities.CenterManager.fields.member_cap
        distinguishing_aspect: |
          Mode (c): tier depends on member count, caps depend on tier,
          feasibility depends on caps — a circular-looking dependency broken
          by the pinned evaluation order (current members -> tier -> caps ->
          feasibility). A SMALL branch (5 active members, 1 manager, 1
          center) with a plan hiring 2 managers: member capacity is
          (1+2) x 60 = 180 and center slots are (1+2) x 3 - 1 = 8. The plan
          with target_new_members 175 is feasible (required 5+175 = 180 <=
          180; 2 <= 8); the same plan with 176 is infeasible (181 > 180) —
          and the caps that decide this come from the CURRENT tier (SMALL),
          never from the projected 181-member tier.
        test_recipe:
          setup:
            - "Branch with 1 manager, 1 center, and exactly 5 active members (one fully-trained ACTIVE group of 5)."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g1
            - *d_m1
            - *d_p1
            - *d_p2
            - *d_p3
            - *d_p4
            - *d_add_m1
            - *d_add_p1
            - *d_add_p2
            - *d_add_p3
            - *d_add_p4
            - *d_tr1
            - *d_tr1c
            - *d_tr2
            - *d_tr2c
          trigger:
            - call: "POST /branches/${branch_id}/expansion-plans"
              payload: { new_centers: 2, new_managers_hired: 2, target_new_members: 175 }
              as: BranchManager
              captures: { plan_exact: $.data.id }
            - call: "POST /branches/${branch_id}/expansion-plans"
              payload: { new_centers: 2, new_managers_hired: 2, target_new_members: 176 }
              as: BranchManager
              captures: { err_over: $.data.error_id }
          assert:
            - "Branch.${branch_id}.tier == SMALL (5 active members < 200), so member_cap == 60 and center_cap == 3"
            - "the first trigger call returns 201: BranchExpansionPlan.${plan_exact}.status == SUBMITTED with feasibility.available_member_capacity == 180 (3 managers x 60) and feasibility.feasible == true (required 5+175 = 180 <= 180; centers 2 <= 3*3-1 = 8)"
            - "the second trigger call returns 409 with error_id ERR_EXPANSION_INFEASIBLE (required 5+176 = 181 > 180)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: loan_delinquency_cure_cycle_restores_active
        grounds:
          - state_machines.Loan.ACTIVE_to_DELINQUENT
          - state_machines.Loan.DELINQUENT_to_ACTIVE
          - state_machines.Member.DELINQUENT_to_ACTIVE_BORROWER
        distinguishing_aspect: |
          The Loan machine is cyclic (ACTIVE -> DELINQUENT -> ACTIVE): after
          the sweep flips the loan to DELINQUENT (16 days, first due missed),
          a single collection covering savings + the missed installment +
          current installment cures it back to ACTIVE, provable by the loan
          being collectible and non-defaulted afterwards — a revert arc a
          linear machine could not express.
        test_recipe:
          setup:
            - "Member M2 of group G2 with an ACTIVE cycle-1 loan disbursed 2026-09-01; clock advanced to 2026-09-17 so the first due (2026-09-08) is 9 days past and the loan is DELINQUENT (installments_missed == 1)."
          setup_api_calls:
            - *d_clock0
            - *d_branch
            - *d_mgr
            - *d_center
            - *d_g2
            - *d_m2
            - *d_q1
            - *d_q2
            - *d_q3
