            - "absorbed_billed_cents != absorbed_billed_flat_cents — 3010 cents apart on identical volume"
            - "SelfFundingLedgerEntry.${entry_id}.processing_costs_cents == 450 (3 x 150 ECHECK flat)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: wallet_fee_gross_up_circular_closed_form
        grounds:
          - calculations.convenience_fee
        distinguishing_aspect: |
          Mode (c) circular dependency: the WALLET fee must cover a processor
          rate charged on the gross (amount + fee), so the fee appears on both
          sides. The scaffold pins the closed form fee = ceil((180*amount +
          25*10000)/(10000-180)); a naive non-grossed reading gives 385, the
          pinned evaluation gives 393 for amount 20000.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01; the base CONVENIENCE_FEE agency/service/payer chain with a WALLET instrument."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_wallet
          trigger:
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 20000, method: "WALLET" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_w: $.data.id }
          assert:
            - "FeeQuote.${quote_w}.quoted_fee_cents == 393 (closed-form gross-up of the circular fee-on-gross definition)"
            - "FeeQuote.${quote_w}.quoted_fee_cents != 385 (the naive reading 180*20000/10000 + 25 that ignores the fee being part of the charged gross)"
            - "FeeQuote.${quote_w}.payer_total_cents == 20393"
            - "FeeQuote.${quote_w}.statutory_authorization_id == ${authz_id} and disclosure_text_version == \"D1\""

      - name: absorbed_invoice_round_per_line_then_sum
        grounds:
          - calculations.agency_absorbed_monthly_invoice
          - entities.SelfFundingLedgerEntry.fields.absorbed_billed_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: the scaffold pins round-half-up PER
          TRANSACTION LINE then integer sum. Two 333-cent payments in band 1
          (250bp+20) give 28 + 28 = 56; the alternative sum-then-round reading
          gives round_half_up(666*0.025) + 40 = 57. One cent of divergence hangs
          entirely on rounding order.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10; absorbed agency with full 2026-09 tier coverage and two captured ECHECK transactions of 333 cents each."
          setup_api_calls:
            - *k_clock
            - *b_agency
            - *b_account
            - *b_verify
            - *b_attest
            - *b_agency_on
            - *b_tier1
            - *b_tier2
            - *b_tier3
            - *b_service
            - *b_service_on
            - *k_payer
            - *k_echeck
            - *k_echeck_ok
            - *k_clock_sep10
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc2_id}", amount_cents: 333, method: "ECHECK" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { qr1: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${qr1}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { tr1: $.data.id }
            - call: "POST /portal/payment-transactions/${tr1}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-county"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc2_id}", amount_cents: 333, method: "ECHECK" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { qr2: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${qr2}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { tr2: $.data.id }
            - call: "POST /portal/payment-transactions/${tr2}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-county"
          trigger:
            - call: "POST /portal/self-funding/close-period"
              payload: { period: "2026-09" }
              as: TreasuryOfficer
              captures: { entry_id: $.data.id }
          assert:
            - "SelfFundingLedgerEntry.${entry_id}.absorbed_billed_cents == 56 (28 + 28; each line round_half_up(333*0.025)=round_half_up(8.325)=8, plus 20 per-transaction)"
            - "SelfFundingLedgerEntry.${entry_id}.absorbed_billed_cents != 57 (the sum-then-round reading of the same volume)"
            - "SelfFundingLedgerEntry.${entry_id}.pool_balance_after_cents == -244 (56 billed - 300 processing costs; a deficit carries negative, it is not an error)"

      - name: fee_floor_bucket_tier_nested_min_max
        grounds:
          - calculations.convenience_fee
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: fee =
          min(statutory cap, max(MIN_FEE, grossed rate(amount, method,
          card_cost_bucket))). For a COMMERCIAL card paying 1000 cents the
          grossed fee is 66, so the 100-cent MIN_FEE floor binds — the nested
          max() flips the output away from the rate formula entirely.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01; base CF agency/service/payer chain with a COMMERCIAL-bucket AMEX card instrument."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - call: "POST /portal/payers/${payer_id}/instruments"
              payload: { method: "CARD", card_brand: "AMEX", card_cost_bucket: "COMMERCIAL", last4: "0005" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { inst_comm: $.data.id }
          trigger:
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 1000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_small: $.data.id }
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 100000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_big: $.data.id }
          assert:
            - "FeeQuote.${quote_small}.quoted_fee_cents == 100 — the MIN_FEE floor binds over the grossed 66 (ceiling((290*1000 + 35*10000)/9710))"
            - "FeeQuote.${quote_big}.quoted_fee_cents == 3023 — QUOTED variant ignores the instrument's COMMERCIAL bucket and assumes CONSUMER_CREDIT (ceiling((220*100000 + 30*10000)/9780))"
            - "both quotes pin statutory_authorization_id == ${authz_id} and neither is clamped by the 5000 cap"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: transaction_ach_return_represent_cycle
        grounds:
          - state_machines.PaymentTransaction.SETTLED_to_RETURNED
          - state_machines.PaymentTransaction.RETURNED_to_RE_PRESENTED
          - state_machines.PaymentTransaction.RE_PRESENTED_to_SETTLED
          - calculations.value_date
        distinguishing_aspect: |
          Cyclic machine on PaymentTransaction: SETTLED -> RETURNED ->
          RE_PRESENTED -> SETTLED. The return clears current_batch_id and posts
          a -50000 debit into an auto-created batch; re-presentment recomputes
          value_date (+2 days ECHECK lag), so the transaction only re-settles in
          a later batch.
        test_recipe:
          setup:
            - "CF agency base chain; one ECHECK 50000 transaction captured at clock 2026-09-10 (value_date 2026-09-12) and settled by batch 2026-09-12."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_echeck
            - *k_echeck_ok
            - *k_clock_sep10
            - *k_quote_ech50k
            - *k_txn_ech
            - *k_cap_ech
            - &k_batch_0912
              call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-12" }
              as: PlatformAdmin
              captures: { batch1_id: $.data.id }
            - &k_close_batch1
              call: "POST /portal/settlement-batches/${batch1_id}/close"
              payload: {}
              as: PlatformAdmin
            - &k_clock_sep15
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/payment-transactions/${txn_ech}/ach-return"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/payment-transactions/${txn_ech}/re-present"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "GET /portal/agencies/${ag_id}/settlement-batches"
              payload: {}
              as: PlatformAdmin
              captures: { batch_auto: "$.data[1].id" }
            - call: "POST /portal/settlement-batches/${batch_auto}/close"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-17" }
              as: PlatformAdmin
              captures: { batch2_id: $.data.id }
            - call: "POST /portal/settlement-batches/${batch2_id}/close"
              payload: {}
              as: PlatformAdmin
          assert:
            - "after ach-return: funds_status == RETURNED, current_batch_id is null, representment_count == 0, returned_at == 2026-09-15T00:00:00Z"
            - "the return auto-created an OPEN batch with business_date 2026-09-15 and return_debits_cents == 50000 (second row of GET /portal/agencies/${ag_id}/settlement-batches, created_at ASC)"
            - "after re-present: funds_status == RE_PRESENTED, representment_count == 1, value_date == \"2026-09-17\""
            - "closing the auto-created batch sweeps nothing (value_date 2026-09-17 > business_date 2026-09-15): member_count 0 and deposit_cents == -50000 (the return debit stands alone)"
            - "after the 2026-09-17 batch closes: funds_status == SETTLED again and current_batch_id == ${batch2_id} — the full cycle completed"

      - name: chargeback_branching_contest_won_vs_accept
        grounds:
          - state_machines.ChargebackCase.OPENED_to_CONTESTED
          - state_machines.ChargebackCase.CONTESTED_to_WON
          - state_machines.ChargebackCase.OPENED_to_ACCEPTED
        distinguishing_aspect: |
          Branching fork on ChargebackCase: OPENED -> CONTESTED -> WON moves no
          money at all, while OPENED -> ACCEPTED books network_debit_cents ==
          amount_cents onto the transaction and into an auto-created OPEN batch.
          Two sibling branches from the same state with disjoint side-effect sets.
        test_recipe:
          setup:
            - "CF agency base chain; two captured CARD CONSUMER_DEBIT transactions of 100000 each (quotes consumed per transaction)."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - *k_txn_card
            - *k_cap_card
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 100000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote_b: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_b}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn_b: $.data.id }
            - call: "POST /portal/payment-transactions/${txn_b}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          trigger:
            - call: "POST /portal/chargebacks"
              payload: { transaction_id: "${txn_card}", reason_code: "FRAUD" }
              as: PlatformAdmin
              captures: { case_a: $.data.id }
            - call: "POST /portal/chargebacks/${case_a}/contest"
              payload: { evidence_note: "Signed receipt and delivery log attached" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
            - call: "POST /portal/chargebacks/${case_a}/record-outcome"
              payload: { outcome: "WON" }
              as: PlatformAdmin
            - call: "POST /portal/chargebacks"
              payload: { transaction_id: "${txn_b}", reason_code: "SERVICE_NOT_RECEIVED" }
              as: PlatformAdmin
              captures: { case_b: $.data.id }
            - call: "POST /portal/chargebacks/${case_b}/accept"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          assert:
            - "ChargebackCase.${case_a}.status == WON and PaymentTransaction.${txn_card}.charged_back_cents == 0"
            - "ChargebackCase.${case_b}.status == ACCEPTED and PaymentTransaction.${txn_b}.charged_back_cents == 100000"
            - "ChargebackCase.${case_b}.network_debit_cents == 100000 (amount minus zero refunds; the 2281 fee is never clawed back)"
            - "exactly one auto-created OPEN batch exists for the agency with chargeback_debits_cents == 100000 — the WON branch posted nothing"
            - "PaymentTransaction.${txn_b}.remaining_refundable_cents == 0 while ${txn_card}.remaining_refundable_cents == 100000"

      - name: instrument_pending_self_loop_to_deactivated
        grounds:
          - state_machines.PaymentInstrument.PENDING_VERIFICATION_to_PENDING_VERIFICATION
          - state_machines.PaymentInstrument.PENDING_VERIFICATION_to_DEACTIVATED
          - errors.ERR_INSTRUMENT_NOT_USABLE
        distinguishing_aspect: |
          Self-loop machine on PaymentInstrument: FAILURE outcomes keep an ECHECK
          instrument in PENDING_VERIFICATION while ach_verify_failures < 3, and
          the third FAILURE ejects it to DEACTIVATED — after which authorize is
          rejected with ERR_INSTRUMENT_NOT_USABLE.
        test_recipe:
          setup:
            - "CF agency base chain; one payer with an ECHECK instrument still PENDING_VERIFICATION and an OPEN ECHECK quote for 50000."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_echeck
            - *k_quote_ech50k
          trigger:
            - call: "POST /portal/instruments/${inst_ech}/verify-ach"
              payload: { outcome: "FAILURE" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /portal/instruments/${inst_ech}/verify-ach"
              payload: { outcome: "FAILURE" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /portal/instruments/${inst_ech}/verify-ach"
              payload: { outcome: "FAILURE" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_ech}", instrument_id: "${inst_ech}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "after FAILUREs 1 and 2 the instrument is still PENDING_VERIFICATION with ach_verify_failures 1 then 2 (the self-loop)"
            - "after the third FAILURE the instrument is DEACTIVATED with ach_verify_failures == 3"
            - "the authorize attempt returns 409 and err_id == ERR_INSTRUMENT_NOT_USABLE"
            - "the fourth verify-ach attempt would be rejected (DEACTIVATED is terminal) — GET /portal/payers/${payer_id}/instruments still shows DEACTIVATED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: agency_suspend_deactivates_services_voids_quotes
        grounds:
          - state_machines.Agency.ACTIVE_to_SUSPENDED
          - state_machines.ServiceCatalogItem.ACTIVE_to_DEACTIVATED
        distinguishing_aspect: |
          Depth-3 chain from POST /portal/agencies/{id}/suspend: agency ACTIVE
          -> SUSPENDED (link 1) mutates every ACTIVE service to DEACTIVATED
          (link 2), and each service deactivation itself voids that service's
          OPEN FeeQuotes (link 3). An AUTHORIZED transaction created before the
          suspend is untouched and still captures afterwards — the cascade
          propagates only down the quote branch.
        test_recipe:
          setup:
            - "CF agency base chain; quote Q1 left OPEN; a second quote authorized into transaction T2 (AUTHORIZED, not yet captured)."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 50000, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { quote2: $.data.id }
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote2}", instrument_id: "${inst_card}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { txn2: $.data.id }
          trigger:
            - call: "POST /portal/agencies/${ag_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portal/payment-transactions/${txn2}/capture"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          assert:
            - "Agency.${ag_id}.status == SUSPENDED (link 1)"
            - "ServiceCatalogItem.${svc_id}.status == DEACTIVATED (link 2, caused by link 1)"
            - "FeeQuote.${quote_id}.status == VOIDED (link 3, caused by link 2 — the quote was never authorized)"
            - "PaymentTransaction.${txn2}.funds_status == AUTHORIZED after the suspend and == CAPTURED after the post-suspend capture — in-flight funds are unaffected"
            - "a later POST /portal/agencies/${ag_id}/activate returns ACTIVE but ServiceCatalogItem.${svc_id} remains DEACTIVATED (the cascade is not symmetric)"

      - name: exception_resolution_bubbles_batch_reconciled
        grounds:
          - state_machines.SettlementBatch.CONFIRMED_to_EXCEPTION
          - state_machines.ReconciliationException.OPEN_to_RESOLVED
          - state_machines.SettlementBatch.EXCEPTION_to_RECONCILED
          - calculations.reconciliation_match
        distinguishing_aspect: |
          Depth-2 chain from POST /portal/reconciliation-exceptions/{id}/resolve:
          resolving an exception (link 1) decrements the batch's
          open_exception_count, and reaching 0 itself flips the batch EXCEPTION
          -> RECONCILED (link 2). With two OPEN exceptions the batch stays
          EXCEPTION after the first resolve and bubbles only on the last.
        test_recipe:
          setup:
            - "CF agency base chain; CARD 100000 transaction captured 2026-09-10 (value_date 2026-09-11); batch 2026-09-11 closed (deposit 100000), submitted, and confirmed with actual 99000 at clock 2026-09-13 — both an amount mismatch and a late deposit (due 09-11 + 1 grace day = 09-12 < 09-13)."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_clock_sep10
            - *k_quote_card100k
            - *k_txn_card
            - *k_cap_card
            - &k_batch_0911
              call: "POST /portal/settlement-batches"
              payload: { agency_id: "${ag_id}", business_date: "2026-09-11" }
              as: PlatformAdmin
              captures: { batch_id: $.data.id }
            - &k_close_batch
              call: "POST /portal/settlement-batches/${batch_id}/close"
              payload: {}
              as: PlatformAdmin
            - &k_submit_batch
              call: "POST /portal/settlement-batches/${batch_id}/submit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T00:00:00Z" }
              as: PlatformAdmin
            - &k_confirm_batch
              call: "POST /portal/settlement-batches/${batch_id}/confirm-deposit"
              payload: { actual_deposit_cents: 99000 }
              as: TreasuryOfficer
            - call: "POST /portal/settlement-batches/${batch_id}/reconcile"
              payload: {}
              as: PlatformAdmin
            - call: "GET /portal/settlement-batches/${batch_id}/exceptions"
              payload: {}
              as: PlatformAdmin
              captures: { ex1: "$.data[0].id", ex2: "$.data[1].id" }
          trigger:
            - call: "POST /portal/reconciliation-exceptions/${ex1}/resolve"
              payload: { resolution_note: "Bank fee deducted at source; agency acknowledged" }
              as: PlatformAdmin
            - call: "POST /portal/reconciliation-exceptions/${ex2}/resolve"
              payload: { resolution_note: "ACH rail delay documented" }
              as: PlatformAdmin
          assert:
            - "reconcile created exactly 2 exceptions: one AMOUNT_MISMATCH (expected_cents 100000, actual_cents 99000) and one DEPOSIT_LATE (actual_cents null)"
            - "after resolving ${ex1}: ReconciliationException.${ex1}.status == RESOLVED but SettlementBatch.${batch_id}.status == EXCEPTION with open_exception_count == 1 (no premature bubble)"
            - "after resolving ${ex2}: SettlementBatch.${batch_id}.status == RECONCILED (link 2 fired on the last OPEN exception)"
            - "SettlementBatch.${batch_id}.deposit_cents == 100000 and actual_deposit_cents == 99000 remain as the reconciled record"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_on_voided_state_beats_amount_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_INVALID_STATE
          - errors.ERR_REFUND_EXCEEDS_REMAINING
        distinguishing_aspect: |
          Pair (state, business_fiscal): a refund against a VOIDED transaction
          whose amount also exceeds remaining_refundable_cents must report
          ERR_INVALID_STATE (priority 5), not ERR_REFUND_EXCEEDS_REMAINING
          (priority 11) — the state check short-circuits the money check.
        test_recipe:
          setup:
            - "CF agency base chain; one AUTHORIZED CARD 100000 transaction, then voided."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - *k_attest
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_card_debit
            - *k_quote_card100k
            - *k_txn_card
            - call: "POST /portal/payment-transactions/${txn_card}/void"
              payload: {}
              as: AgencyAdmin
              as_user_id: "aa-lead"
          trigger:
            - call: "POST /portal/refunds"
              payload: { transaction_id: "${txn_card}", amount_cents: 99999999, reason: "dual failure probe" }
              as: AgencyAdmin
              as_user_id: "aa-lead"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE"
            - "err_id != ERR_REFUND_EXCEEDS_REMAINING although 99999999 > 0 remaining"
            - "GET /portal/payment-transactions/${txn_card}/refunds returns 0 rows"

      - name: authorize_expired_attestation_beats_foreign_instrument
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors.ERR_COMPLIANCE_LAPSED
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          Pair (business_safety, business_referential): authorize where the
          agency's PCI attestation expired AND the instrument belongs to a
          different payer must report ERR_COMPLIANCE_LAPSED (priority 6), not
          ERR_NOT_RESOURCE_OWNER (priority 10) — and not ERR_QUOTE_EXPIRED
          (priority 9), which the aged quote would also trigger.
        test_recipe:
          setup:
            - "CF agency whose PCI_DSS_AOC attestation expires 2026-09-15T00:00:00Z; agency activated while CURRENT; payer1 holds an OPEN quote created 2026-09-01; payer2 owns a CARD CONSUMER_DEBIT instrument; logical clock advanced to 2026-09-16 (attestation EXPIRED, quote past its 30-minute TTL)."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - call: "POST /portal/attestations"
              payload: { agency_id: "${ag_id}", attestation_type: "PCI_DSS_AOC", issued_at: "2026-08-15T00:00:00Z", expires_at: "2026-09-15T00:00:00Z" }
              as: ComplianceAuditor
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - *k_quote_card100k
            - call: "POST /portal/payers"
              payload: { full_name: "Sam Sub", email: "sam@example.com", billing_zip: "73104" }
              as: Anonymous
              captures: { payer2_id: $.data.id }
            - call: "POST /portal/payers/${payer2_id}/instruments"
              payload: { method: "CARD", card_brand: "VISA", card_cost_bucket: "CONSUMER_DEBIT", last4: "1111" }
              as: Payer
              as_user_id: "${payer2_id}"
              captures: { inst_p2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/payment-transactions"
              payload: { quote_id: "${quote_id}", instrument_id: "${inst_p2}" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_COMPLIANCE_LAPSED"
            - "err_id != ERR_NOT_RESOURCE_OWNER (the instrument IS foreign, but referential checks rank below safety)"
            - "err_id != ERR_QUOTE_EXPIRED (the quote IS past expires_at, but temporal checks rank below safety too)"
            - "no PaymentTransaction row exists for quote ${quote_id} afterwards"

      - name: quote_expired_attestation_beats_amount_range
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_COMPLIANCE_LAPSED
          - errors.ERR_AMOUNT_OUT_OF_RANGE
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal): quote create with an EXPIRED
          agency attestation AND an amount below the service minimum must report
          ERR_COMPLIANCE_LAPSED (priority 6), not ERR_AMOUNT_OUT_OF_RANGE
          (priority 11). Different category pair than the other two instances.
        test_recipe:
          setup:
            - "CF agency whose attestation expires 2026-09-15; service ACTIVE (min_amount_cents 100); logical clock 2026-09-16."
          setup_api_calls:
            - *k_clock
            - *k_agency
            - *k_account
            - *k_verify
            - call: "POST /portal/attestations"
              payload: { agency_id: "${ag_id}", attestation_type: "PCI_DSS_AOC", issued_at: "2026-08-15T00:00:00Z", expires_at: "2026-09-15T00:00:00Z" }
              as: ComplianceAuditor
            - *k_agency_on
            - *k_service
            - *k_authz
            - *k_authz_ok
            - *k_service_on
            - *k_payer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portal/fee-quotes"
              payload: { service_id: "${svc_id}", amount_cents: 50, method: "CARD" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_COMPLIANCE_LAPSED"
            - "err_id != ERR_AMOUNT_OUT_OF_RANGE although 50 < min_amount_cents 100"
            - "GET /portal/fee-quotes?service_id=${svc_id} returns 0 rows"

  # ===========================================================================
  - rule_id: boundary_precision_check
