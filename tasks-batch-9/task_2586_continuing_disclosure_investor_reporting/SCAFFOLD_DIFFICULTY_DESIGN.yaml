            - "${req1_audit} == true and ${req2_audit} == false"
            - "${item1_weight} == 3333 and ${item2_weight} == 3333 and ${item3_weight} == 3333 and ${item4_weight} == 1"
            - "${score_initial} == 0.00 — all four items NOT_STARTED at snapshot time"
            - "${item3_status} == DRAFT and ${item3_factor} == 0.5"
            - "${item4_status} == NOT_STARTED (readiness_factor 0.0)"
            - "${final_score} == 50.01"
            - "${final_score} != 50.00 — the sum-then-round order is explicitly wrong here"
            - "each 3333-bp DRAFT item contributed round_half_up(0.3333 * 0.5, 4) == 0.1667, so raw == 0.5001 and 0.5001 * 100 == 50.01"
            - "AnnualReportCycle.${cycle_id}.status == DRAFTING — scoring never moves the cycle"

      - name: risk_score_escalates_on_the_persisted_prior_tier
        grounds:
          - calculations.undertaking_disclosure_risk_score
          - entities.Undertaking.fields.remediation_tier
          - entities.Undertaking.fields.disclosure_risk_score
          - entities.Undertaking.fields.missed_event_count
          - state_machines.MaterialEventNotice.MATERIAL_to_MISSED
          - endpoints.POST_/disclosure/calendar-sweeps
        distinguishing_aspect: |
          Mode (c) — the multiplier input is the tier PERSISTED by the previous pass, not the one
          this pass derives, and the pass is explicitly not iterated to a fixed point. Three
          separate sweeps drive the chain 20.00/TIER_0 -> 40.00/TIER_1 -> 66.00/TIER_2. Reading
          the freshly derived tier instead would give 75.00/TIER_3 on the third pass, and
          collapsing the three sweeps into one would give 60.00/TIER_2 — both are excluded.
        test_recipe:
          setup:
            - "One BondIssue whose final_maturity_date is far in the future, with one Undertaking and NO DisseminationEngagement, so sweep step 4 has nothing to touch and cannot perturb the invoice."
            - "The undertaking has NO AnnualReportCycle, so delinquent_cycle_count stays 0 throughout and posture is decided by the score bands alone."
            - "Three MaterialEventNotices on that issue, all non-per-se, with occurrence dates 2026-07-20, 2026-07-22 and 2026-07-24, created while the clock stands at 2026-07-25 (all within the 30-day backdating allowance)."
            - "Their derived ten-business-day deadlines are 2026-08-03, 2026-08-05 and 2026-08-07 respectively."
            - "All three are determined MATERIAL, so all three are sweepable to MISSED."
            - "Two sweeps have already run: one at 2026-08-04 (strands notice 1 only) and one at 2026-08-06 (strands notice 2 only)."
