      - name: cleared_no_effect_action_is_locked_down
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[entity=ProjectAction].terminal_states
          - state_machines[entity=ProjectAction].transitions[SCREENING->CLEARED_NO_EFFECT]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - calculations.effect_determination_matrix
        distinguishing_aspect: >-
          CLEARED_NO_EFFECT is the ProjectAction machine's only terminal state
          and it has NO outgoing transitions at all — not even the reinitiation
          edges, which start from PERMITTED, CONSULTATION_CONCLUDED or
          HCP_DEVELOPMENT. So a cleared action can neither be re-screened nor
          carry a habitat conservation plan, and it never gained a consultation
          to reinitiate.
        test_recipe:
          setup:
            - "SP-E registered; one proponent; one NON_FEDERAL action with footprint 200.00 acres."
            - "One FIELD_SURVEY / NOT_DETECTED determination with an in-season window 2026-05-04..2026-05-08 -> ABSENT, so the candidate set is empty and the effect determination returns NO_EFFECT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
