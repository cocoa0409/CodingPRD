            - "after the trigger RecordTransferRequest.${req_id}.status == RECONCILED (terminal) and applied_transferred_credits == 5.00"
            - "after the trigger Student.${stu_new_id}.locally_accrued_credits == 0.00, transferred_credits_count == 5.00 and total_awarded_credits == 5.00"
            - "the cap came from tier 1: tier_key == 0.00 + 10.00 == 10.00 which is below 12.00, so cap_pct == 0.50 and capped == min(10.00, 5.00) == 5.00"
            - "after the trigger Student.${stu_prior_id}.transferred_credits_count is still 0.00 - only the requesting student's ledger moved"
            - "Student.${stu_new_id}.total_service_hours_ledger is still 0.00 - a credit reconciliation does not touch the hours ledger"

