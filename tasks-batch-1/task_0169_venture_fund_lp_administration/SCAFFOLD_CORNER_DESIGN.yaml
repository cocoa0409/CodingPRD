        claim_type: violation_to_error
        grounds: ["errors[ERR_RESOURCE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "POST /commitments referencing a non-existent lp_id -> ERR_RESOURCE_NOT_FOUND (404) at existence priority 4."
