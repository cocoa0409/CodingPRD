      - name: initial_state_every_state_machine_is_born_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.PremiumFinanceAgreement.status.initial_state
          - state_machines.PremiumFinanceAgreement.delinquency_stage.initial_state
          - state_machines.Installment.status.initial_state
          - state_machines.LateFeeAssessment.status.initial_state
        distinguishing_aspect: |
          §1.2 declares twelve machines and the interesting part is that they are born at four different
          moments: some at an explicit POST (License, ProducerAgent, PremiumFinanceAgreement,
          FinancedPolicy, PremiumEndorsement, Payment, CancellationNotice), six Installment rows as a
          side effect of activation, and a LateFeeAssessment as a side effect of a servicing sweep — a
          row no client ever POSTs. A machine born inside a side effect is the one implementations get
          wrong, because it is tempting to write the derived rows in whatever state the caller's
          intention implies rather than in the declared initial_state. The instance also pins that the
          initial state is structurally unreachable from input: not one of the twelve state fields
          appears in any `input:` list in §1.5, so a client can never nominate a starting state and an
          implementation that accepts one has invented an undeclared parameter. The two machines not
          reachable without the deficiency pipeline are covered where that pipeline already runs —
          CarrierCancellationRequest's REQUESTED is asserted in
          dual_variant_calculation_pro_rata_versus_short_rate_unearned_premium_return and
          AgentChargeback's PENDING in §1.8's chargeback instances.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15"
            - "the canonical TX regime is written and licensed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { is_rule: "$.data.id" }
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { is_insured: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { is_insurer: "$.data.id" }
          trigger:
            - call: "POST /state-rate-rules/${is_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { is_lic: "$.data.id", is_lic_status: "$.data.status", is_lic_eff: "$.data.is_effective" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { is_agent: "$.data.id", is_agent_status: "$.data.status" }
            - call: "POST /agreements"
              payload: { insured_id: "${is_insured}", producer_agent_id: "${is_agent}", state_rule_id: "${is_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { is_agr: "$.data.id", is_agr_status: "$.data.status", is_agr_stage: "$.data.delinquency_stage" }
            - call: "POST /agreements/${is_agr}/policies"
