    instances:
      - name: immediate_read_after_write_product
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.Product]
        distinguishing_aspect: "Immediate consistency: a product created via POST /products is returned by GET /products/{id} in the same synchronous state (registration_status REGISTERED)."
        test_recipe:
          setup: ["A manufacturer and a household with owner."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "im@x.test", display_name: "IM" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "IM-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "GET /products/${prod}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /products/${prod} returns registration_status == REGISTERED and recall_status == NONE"

  - section: endpoints
    instances:
      - name: list_members_by_household_reverse_reachability
        claim_type: listing
        grounds: [endpoints, entities.Member.fields.household_id]
        distinguishing_aspect: "GET /members?household_id returns exactly the household's members (reverse-reachability for Member.household_id), with total_count and has_more in the envelope."
        test_recipe:
          setup: ["A household with an OWNER and one ADULT member."]
          setup_api_calls:
            - call: "POST /households"
              payload: { primary_email: "l@x.test", display_name: "L" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "A", email: "a@x.test", role: "ADULT" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { adult: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { household_id: "${hh}" }
              as: PlatformAdmin
          assert:
            - "response data is a Member[] of total_count 2 containing ${owner} and ${adult}"

      - name: list_products_pagination_limit_offset
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /products?household_id&limit=1&offset=0 returns 1 product with has_more=true and total_count=2."
        test_recipe:
          setup: ["A household with owner and two REGISTERED products."]
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "M", contact_email: "m@x.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "pg@x.test", display_name: "PG" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "O", email: "o@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "PG-1", serial_number: 1, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p1: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "PG-2", serial_number: 2, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p2: $.data.id }
          trigger:
            - call: "GET /products"
              payload: { household_id: "${hh}", limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response has total_count == 2, has_more == true, and data length 1"
