        distinguishing_aspect: >
          Dual control is store-configurable: with dual_control_required false, U-CLERK-1 both arms and
          opens the safe and both prepares and seals the bag, and every call succeeds — the identical
          sequence at a default store would be refused twice with ERR_DUAL_CONTROL_VIOLATION.
        test_recipe:
          setup:
            - "Store S-1952 with dual_control_required false; MANUAL safe SAFE-A (500000); journal 2026-08-03"
            - "U-CLERK-1 arms the safe at 08:00Z and opens it alone at 08:05Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
