              captures: { model7: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${store7}", consumable_type: "STUFFING_FIBER", initial_qty: 10000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store7}", station_type: "STUFF", capacity: 4 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store7}", station_type: "SOUND", capacity: 4 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store7}", station_type: "BATHE", capacity: 4 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store7}", station_type: "DRESS", capacity: 4 }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
