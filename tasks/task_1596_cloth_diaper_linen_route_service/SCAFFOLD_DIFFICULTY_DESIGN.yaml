          trigger:
            - { call: "POST /api/route-stops/${stop_id}/complete", payload: { soiled_bags_collected: 1, clean_items_delivered: 80, expected_route_version: "${route_v_locked}" }, as: RouteDriver, captures: { err_id: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: PlatformAdmin }
