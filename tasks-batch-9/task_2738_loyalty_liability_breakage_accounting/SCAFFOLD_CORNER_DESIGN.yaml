              captures: { err_stale: $.data.error_id }
            - call: "GET /partner-agreements/${agr_id}"
              payload: {}
              as: LoyaltyAccountant
              captures: { agr_v_fresh: $.data.version }
            - call: "POST /settlement-statements"
              payload: { partner_agreement_id: "${agr_id}", period_id: "${per1_id}", expected_partner_agreement_version: "${agr_v_fresh}" }
              as: LoyaltyAccountant
              captures: { st_ok_id: $.data.id }
          assert:
            - "The second partner lot advances the agreement: ${agr_v_fresh} == ${agr_v_observed} + 1"
            - "The create carrying ${agr_v_observed} returns HTTP 412 with error_id == ERR_STALE_AGREEMENT_VERSION and no SettlementStatement row is written"
            - "It is NOT 409: per1 is OPEN and not hard-closed and the agreement is ACTIVE, so priorities 63 and 64 pass - only the version is stale"
            - "The IDENTICAL body with ${agr_v_fresh} SUCCEEDS and measures BOTH lots: SettlementStatement.${st_ok_id}.partner_issued_points == 3000"
            - "SettlementStatement.${st_ok_id}.issuance_receivable_cents == round_half_up(3000 * 900 / 1000) == 2700, settlement_basis == GROSS, net_due_cents == 2700 (>= min_invoice_cents 1000)"
            - "SettlementStatement.${st_ok_id}.due_date == '2026-10-01T00:00:00Z' (per1.end_at 2026-09-01 plus 30 days) and its state is DRAFT"
            - "Had the stale create been allowed to stand it would have billed only 1800 for 2000 points - the 412 is exactly what prevents the understatement"

      - name: ccl_version_advances_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.LoyaltyProgram.fields.version
          - entities.PointLot.fields.version
          - entities.RedemptionEvent.fields.version
          - concurrency_rules
        distinguishing_aspect: "The OCC counter is a strict per-write monotone integer starting at 1: state transitions and ledger mutations each advance it by exactly one, while any number of intervening reads - including the derived-on-read aggregates - leave it untouched."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Version Core' created DRAFT with rule TX and cohort C1 (ssp 1200, cap 5000, historical 7500 so activation seeds current_breakage_rate_bp 2500), member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01)."
            - "M1 holds one 1000-point lot, and a 400-point CATALOG redemption event has been requested but not yet allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Version Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
