              as: PlatformAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-SHEET-Q", name: "Queen sheet set", category: "LINEN", unit_cost_cents: 260, par_qty: 6, unit: "SET", initial_on_hand_qty: 6 }
              as: PlatformAdmin
              captures: { sl1: "$.data.id" }
            - call: "POST /properties/${p1}/supply-lines"
              payload: { sku: "LIN-TOWEL-B", name: "Bath towel", category: "LINEN", unit_cost_cents: 180, par_qty: 8, unit: "EACH", initial_on_hand_qty: 8 }
              as: PlatformAdmin
              captures: { sl2: "$.data.id" }
            - call: "POST /cleaners"
              payload: { name: "Cleaner C", home_zone_code: "ZONE_A", skill_level: 4, max_daily_turnovers: 3, initial_quality_score: 92.00 }
              as: PlatformAdmin
              captures: { cc: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "OUT-1", guest_name: "Guest Out", checkin_at: "2026-08-05T21:00:00Z", checkout_at: "2026-08-08T16:00:00Z" }
              as: Coordinator
              captures: { b_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p1}", external_ref: "IN-1", guest_name: "Guest In", checkin_at: "2026-08-08T21:00:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b_in: "$.data.id" }
            - call: "POST /turnovers"
