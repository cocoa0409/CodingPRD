      - name: survey_packet_amend_cycle_reopens_attested_packet
        claim_type: cyclic
        grounds:
          - state_machines.SurveyPacket.COMPILED_to_ATTESTED
          - state_machines.SurveyPacket.ATTESTED_to_AMENDED
          - state_machines.SurveyPacket.AMENDED_to_COMPILED
          - entities.SurveyPacket.fields.amendment_count
        distinguishing_aspect: "SurveyPacket has no terminal state: COMPILED -> ATTESTED -> AMENDED -> COMPILED closes the loop, and AMEND increments amendment_count to 1 while clearing attested_by_user_id back to null."
        test_recipe:
          setup:
            - "empty resident census, so the surveyed cohort is empty and every score literal is fixed: base_score 0.0, penalties 0.0, preliminary_score 0.0, deficiency_flags [\"F248_INSUFFICIENT_FREQUENCY\"], provision_score 0.0"
            - "the clock stays at its 2026-08-01T00:00:00Z default and the packet window is the single day 2026-08-01, so window_end <= the calendar date of current_utc"
            - "the packet is compiled by user compliance-A and attested by a DIFFERENT user compliance-B with a remediation_note, satisfying segregation of duties and validations priority 43"
          setup_api_calls:
            - call: "POST /recreation/survey-packets"
              payload: { window_start: "2026-08-01", window_end: "2026-08-01" }
              as: ComplianceOfficer
              as_user_id: "compliance-A"
              captures: { pkt_id: $.data.id }
            - call: "POST /recreation/survey-packets/${pkt_id}/compile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-A"
            - call: "POST /recreation/survey-packets/${pkt_id}/attestation"
              payload: { action: "ATTEST", remediation_note: "No admitted residents in window; calendar restart planned" }
              as: ComplianceOfficer
              as_user_id: "compliance-B"
          trigger:
            - call: "POST /recreation/survey-packets/${pkt_id}/attestation"
              payload: { action: "AMEND", amendment_reason: "Late plan documentation received" }
              as: ComplianceOfficer
              as_user_id: "compliance-B"
            - call: "POST /recreation/survey-packets/${pkt_id}/compile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-A"
          assert:
            - "after the AMEND call SurveyPacket.${pkt_id}.status == AMENDED, amendment_count == 1 and attested_by_user_id == null"
            - "after the re-compile SurveyPacket.${pkt_id}.status == COMPILED and compiled_by_user_id == \"compliance-A\""
            - "SurveyPacket.${pkt_id}.base_score == 0.0"
            - "SurveyPacket.${pkt_id}.preliminary_score == 0.0"
            - "SurveyPacket.${pkt_id}.deficiency_flags == [\"F248_INSUFFICIENT_FREQUENCY\"]"
            - "SurveyPacket.${pkt_id}.provision_score == 0.0"
            - "SurveyPacket.${pkt_id}.amendment_count == 1, not reset by the re-compile"
      - name: consent_denial_blocks_outing_consent_dimension
        claim_type: cross_entity
        grounds:
          - state_machines.OutingConsent.REQUESTED_to_DENIED
          - state_machines.Outing.COLLECTING_to_CONSENT_BLOCKED
          - entities.Outing.fields.manifest_count
        distinguishing_aspect: "A single DENIED child consent drives the parent Outing's consent dimension to CONSENT_BLOCKED even though a sibling consent is GRANTED, and the denied resident leaves manifest_count while the logistics dimension stays PLANNING."
        test_recipe:
          setup:
            - "two ADMITTED residents with functional_mobility INDEPENDENT"
            - "one Outing in logistics_status PLANNING with one REQUESTED consent per resident"
            - "the first consent is GRANTED, so the outing's consent dimension has reached CONSENT_COMPLETE before the trigger"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Consent Yes", room_number: "340A", admission_date: "2026-07-17" }
              as: ActivityDirector
              captures: { ry_id: $.data.id }
            - call: "POST /recreation/residents/${ry_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-17" }
              as: RecreationTherapist
            - call: "POST /recreation/residents"
              payload: { full_name: "Consent No", room_number: "340B", admission_date: "2026-07-17" }
              as: ActivityDirector
              captures: { rn_id: $.data.id }
            - call: "POST /recreation/residents/${rn_id}/assessments"
              payload: { cognitive_level: "INTACT", functional_mobility: "INDEPENDENT", interest_domains: ["SOCIAL"], preferred_group_size: "LARGE", effective_date: "2026-07-17" }
              as: RecreationTherapist
            - call: "POST /recreation/programs"
              payload: { name: "Consent Outing Program", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 12, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 9", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 30 }
              as: ActivityDirector
              captures: { veh_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "Farmers Market", departure_at: "2026-08-26T09:00:00Z", return_at: "2026-08-26T12:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { outing_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents"
              payload: { resident_id: "${ry_id}", responsible_party_name: "Yes Family", responsible_party_relation: "ADULT_CHILD" }
              as: ActivityDirector
              captures: { cy_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents"
              payload: { resident_id: "${rn_id}", responsible_party_name: "No Family", responsible_party_relation: "GUARDIAN" }
