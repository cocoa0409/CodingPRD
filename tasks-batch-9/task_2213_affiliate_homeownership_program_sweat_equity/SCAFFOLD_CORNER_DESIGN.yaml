            - { call: "POST /homeownership/construction-shifts/${sh1}/open", payload: {}, as: ConstructionManager, as_user_id: "cm-1", captures: { sh1_v: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${sh1}", expected_shift_version: "${sh1_v}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_id}" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-04T08:00:00.000Z", end_at: "2026-08-04T18:00:00.000Z", volunteer_slots: 2 }, as: ConstructionManager, as_user_id: "cm-1", captures: { sh2: $.data.id } }
