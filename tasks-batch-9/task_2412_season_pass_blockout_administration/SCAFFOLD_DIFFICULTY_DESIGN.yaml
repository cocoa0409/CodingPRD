          setup:
            - "Program in SALES_OPEN with PUBLISHED BRONZE (12000) and GOLD (30000)."
            - "Processed ACTIVE BRONZE pass on a 4-installment plan (down 3000, 2625 x 4) with installments 1 and 2 SETTLED → billed 13500, paid 8250, credited 0, outstanding 5250."
            - "An UpgradeOrder BRONZE -> GOLD is quoted with credit_mode PAID_TO_DATE → gross 18000, credit 8250, net 9750, admin fee 1000, total_due 10750."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pass-programs"
