      - name: labor_call_creation_selects_the_scheduled_estimate_variant
        claim_type: variant_selection
        grounds:
          - calculations.union_labor_charge.variants
          - calculations.union_crew_hours_committed
          - endpoints[POST /convention-center/bookings/{id}/labor-calls]
        distinguishing_aspect: |
          Creation must pick SCHEDULED_ESTIMATE even though the scheduled span starts at
          06:00, two hours outside the straight-time window. The estimate prices every
          hour at straight time, so a crew of 3 over 4.5 hours at 9533 is 128696; picking
          the ACTUALIZED variant at creation would apply the 1.5 overtime multiplier to
          those two hours and inflate the figure.
        test_recipe:
          setup:
            - "SEIU Local 3 covers CLEANING at straight_time_rate_cents 9533, min_call_hours 4, overtime_multiplier 1.5, straight-time window 08:00 to 17:00 and max_crew_hours_per_day 40"
            - "the Meeting Room 301 booking is TENTATIVE with order_posture OPEN"
          setup_api_calls:
            - call: "POST /convention-center/policy-windows"
              payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
              as: VenueAdmin
            - call: "POST /convention-center/spaces"
              payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
              as: VenueAdmin
              captures: { sp_mr_id: $.data.id }
            - call: "POST /convention-center/union-jurisdictions"
              payload: { craft_name: "SEIU Local 3", covered_category: "CLEANING", straight_time_rate_cents: 9533, max_crew_hours_per_day: 40, overtime_multiplier: 1.5, min_call_hours: 4, st_window_start_hour: 8, st_window_end_hour: 17, lockout_active: false }
              as: VenueAdmin
              captures: { uj_clean_id: $.data.id }
            - call: "POST /convention-center/clients"
              payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
              as: VenueAdmin
              captures: { cl_ssp_id: $.data.id }
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
              as: SalesManager
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings/${bk_id}/labor-calls"
              payload: { jurisdiction_id: "${uj_clean_id}", work_category: "CLEANING", work_date: "2027-03-01", scheduled_start_hour: 6.0, scheduled_end_hour: 10.5, crew_size: 3 }
              as: EventServicesManager
              captures: { lc_id: $.data.id }
          assert:
            - "the trigger returns 201"
            - "LaborCall.${lc_id}.status == SCHEDULED"
            - "LaborCall.${lc_id}.billed_hours == 13.5"
            - "LaborCall.${lc_id}.estimated_charge_cents == 128696"
            - "LaborCall.${lc_id}.actual_charge_cents == null"
            - "UnionJurisdiction.${uj_clean_id}.committed_crew_hours == 13.5"

      - name: error_space_day_ledger_input_set_excludes_released_bookings
