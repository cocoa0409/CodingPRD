      - name: monitoring_expiry_closes_final_via_daily_close
        claim_type: valid_transition
        grounds: [state_machines.EngineeringEscalation.MONITORING_to_CLOSED_FINAL]
        distinguishing_aspect: "run_daily_close past monitoring_until (2026-10-30) closes the escalation CLOSED_FINAL; before that date it stays MONITORING."
        test_recipe:
          setup: ["Escalation resolved at 2026-08-01 -> MONITORING until 2026-10-30"]
