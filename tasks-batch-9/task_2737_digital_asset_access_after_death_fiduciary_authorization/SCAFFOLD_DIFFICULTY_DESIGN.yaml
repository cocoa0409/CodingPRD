              captures: { p_lock_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-E" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_lock_id}", category: "SUBSCRIPTION", account_handle: "lv-plus-plan", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_sub_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_lock_id}", category: "CLOUD_STORAGE", account_handle: "lv-archive", quoted_value_cents: 250000 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_cloud_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_lock_id}", category: "EMAIL", account_handle: "lv-mail", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_mail_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p_lock_id}", category: "LOYALTY_PROGRAM", account_handle: "lv-points", quoted_value_cents: 90000, loyalty_points: 4500 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_loyal_id: $.data.id }
          trigger:
            - call: "PATCH /platforms/${p_lock_id}"
              payload: { license_terminates_at_death: true }
              as: EstateAdmin
            - call: "POST /digital-assets/${a_cloud_id}/transferability-reviews"
              payload: { review_note: "provider licence now terminates at death" }
