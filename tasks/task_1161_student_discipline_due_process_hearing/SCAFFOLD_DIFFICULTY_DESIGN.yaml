  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: suspension-day ledger vs occupied-seat
  # count (different conserved quantities).
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: suspension_day_ledger_confirm_then_expunge_restores_zero
        grounds:
          - calculations.cumulative_suspension_days
          - state_machines.DisciplineCase.CLOSED_to_EXPUNGED
          - state_machines.ExpungementRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity = Student.cumulative_suspension_days, pinned as
          SUM(sanction_days_final over cases with status IN {CONFIRMED,
          CLOSED}). The forward confirm sequence debits 4 + 2 = 6; the
          compensating expunge-approve moves both cases to EXPUNGED and the
          ledger returns to its pre-confirm value 0.
        test_recipe:
          setup:
            - "Student NONE, guardian g10; offense DISR-01 bands occ1 [1,3], occ2 [2,4]"
            - "Case 1: 4 days (override), confirmed 2026-05-11, closed 2026-05-15; cumulative 4"
            - "Case 2 (incident 2026-05-18): 2 days, confirmed 2026-05-25, closed 2026-05-27; cumulative 6; last_case_closed_at 2026-05-27"
            - "Clock at 2028-05-27T00:00:00Z — 731 days after the last closure (>= 730-day wait)"
            - "Expungement request filed by guardian (eligible)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 2, min_days: 2, max_days: 4 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Ledg", date_of_birth: "2009-01-01T00:00:00Z", grade_level: 10, demographic_group: "HISPANIC", guardian_id: "g10" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "case one" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /cases/${c1_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${c1_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { c1_v2: $.data.version }
            - call: "POST /cases/${c1_id}/sanction"
              payload: { sanction_days: 4, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${c1_v2}", override_justification: "aggravated" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${c1_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${c1_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${c1_id}/close", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-18T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-18T08:00:00Z", description: "case two" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /cases/${c2_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${c2_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { c2_v2: $.data.version }
            - call: "POST /cases/${c2_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${c2_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${c2_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-25T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${c2_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-27T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${c2_id}/close", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-05-27T00:00:00Z" }, as: DistrictAdmin }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { cum_before: $.data.cumulative_suspension_days }
            - call: "POST /expungement-requests"
              payload: { student_id: "${stu_id}" }
              as: ParentGuardian
              as_user_id: "g10"
              captures: { er_id: $.data.id }
          trigger:
            - { call: "POST /expungement-requests/${er_id}/decision", payload: { outcome: "APPROVED", rationale: "statutory wait satisfied" }, as: DistrictAdmin, as_user_id: "da_1" }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { cum_after: $.data.cumulative_suspension_days }
            - call: "GET /cases"
              payload: { student_id: "${stu_id}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          assert:
            - "before expungement: cumulative_suspension_days == 6 (4 + 2 debited by the two confirms), got ${cum_before}"
            - "after expungement APPROVED: both cases have status EXPUNGED (list shows 2 EXPUNGED rows)"
            - "after expungement: cumulative_suspension_days == 0, got ${cum_after} — confirm/close forward actions plus the expunge compensating action restore the ledger to its pre-confirm value, matching SUM over status IN {CONFIRMED, CLOSED} = empty set"

      - name: site_seat_ledger_placement_then_complete_restores_available
        grounds:
          - entities.AltEdSite.fields.seats_occupied
          - state_machines.AltEdPlacement.PLACED_to_ACTIVE
          - state_machines.AltEdPlacement.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = AltEdSite.seats_occupied, pinned as |placements
          of the site with status IN {PLACED, ACTIVE} covering the clock day|.
          Placement create occupies the seat; the compensating complete
          releases it — a different quantity than the suspension-day ledger.
        test_recipe:
          setup:
            - "AltEdSite S capacity 2; student expelled; placement PA [2026-05-11, 2026-05-29] PLACED, then activated at clock 2026-05-11"
