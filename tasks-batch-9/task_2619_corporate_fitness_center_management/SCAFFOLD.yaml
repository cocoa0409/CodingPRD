# =============================================================================
# PRD Benchmark Scaffold — task_2619_corporate_fitness_center_management
# Sections §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2619. Corporate Fitness Center Management (contract fitness center operator): client contract with staffing model, program scope and management fee versus cost-plus structures, facility programming across group exercise, personal training and wellness challenges with participation targets, staff hiring, certification verification and emergency response training including automated defibrillator readiness, member eligibility across employees, dependents and retirees with access control integration, participation tracking with incentive program integration and privacy boundaries around health data, equipment maintenance, facility cleanliness and inspection standards, incident reporting and liability waiver administration, utilization reporting and program evolution based on client goals

domain_name: corporate-fitness-center-management

# Flat topology: every aggregate root is its own top-level collection
# (/client-contracts, /staff-members, /facility-rooms, /facility-assets,
# /program-offerings, /program-sessions, /staff-assignments, /members,
# /participation-records, /incident-reports, /monthly-invoices) and children are
# linked by explicit foreign keys in the request body, never by URL nesting.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection; parentage is expressed only through
  # FK fields in request bodies (`contract_id`, `offering_id`, `member_id`, ...).
  # Two FKs are self-referential (ClientContract.supersedes_contract_id,
  # Member.sponsor_member_id) and one is polymorphic-by-nullability
  # (IncidentReport may point at a Member, a FacilityAsset, both, or neither).

  state_machine_shape: parallel
  # Member carries two independent state dimensions (eligibility_status ×
  # access_status). StaffCredential and MonthlyInvoice are cyclic. ClientContract
  # is cyclic (ACTIVE↔SUSPENDED plus a PENDING→DRAFT revision loop).
  # ProgramSession and IncidentReport are branching with divergent side-effect
  # sets per branch.

  relationship_patterns:
    - one_to_many          # ClientContract → StaffMember / FacilityRoom / Member / ProgramOffering / MonthlyInvoice
    - self_referential     # ClientContract.supersedes_contract_id, Member.sponsor_member_id
    - cross_aggregate      # StaffAssignment couples ProgramSession (programming) to StaffMember (workforce)
    - polymorphic          # IncidentReport.member_id / IncidentReport.asset_id are independently nullable subjects

  role_model: segregation_of_duties
  # A staff member may not verify their own credential, and the person who filed
  # an incident may not review it. Operator-side, client-side and compliance-side
  # actors hold disjoint exclusive operations on top of that.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 69 endpoints / 66 error codes / 9 calculations (2 dual-variant)
  # / 14 state-machine blocks over 13 entities (Member carries two independent
  # dimensions) / 32 ordered validation rules / 2 OCC rules / 6 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Cross-cutting constants referenced by §1.2 preconditions and §1.4 checks.
# (Calculation-local constants live under each calculations[].constants.)
# =============================================================================
constants:
  ROOM_TURNOVER_BUFFER_MIN: 15          # room intervals are CLOSED and expanded by this on the end side
  SESSION_START_GRACE_MIN: 15           # a session may be started at most this many minutes early
  SESSION_LOCK_WINDOW_HOURS: 24         # inside this window an uncovered or facility-blocked session is cancelled
  ROOM_PASS_SCORE: 85                   # cleanliness score at or above this passes inspection
  CREDENTIAL_EXPIRING_WINDOW_DAYS: 30   # VERIFIED -> EXPIRING_SOON lead time
  ACTIVATION_MIN_READINESS: 70          # mirrors calculations.staff_readiness_index
  PRIVACY_MIN_COHORT: 5                 # mirrors calculations.contract_utilization_rollup
  REQUIRED_CREDENTIALS_BY_ROLE:
    SITE_MANAGER: ["CPR_AED"]
    GROUP_EX_INSTRUCTOR: ["GROUP_EX_CERT"]
    PERSONAL_TRAINER: ["PT_CERT"]
    WELLNESS_COORDINATOR: ["FIRST_AID"]

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- contract --
  - name: ClientContract
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: "Corporate client that owns the fitness center site."
        constraints: "1–120 chars"
      - name: site_code
        type: string
        source: input
        description: "Operator's site identifier for this contract."
        constraints: "Unique across ClientContract rows whose status != WITHDRAWN"
      - name: fee_structure
        type: enum
        source: input
        description: "Commercial model used to bill the client each period."
        constraints: "MANAGEMENT_FEE | COST_PLUS; immutable after creation (amendments create a new contract)"
      - name: staffing_model
        type: enum
        source: input
        description: "Who employs the on-site team."
        constraints: "OPERATOR_EMPLOYED | CLIENT_EMPLOYED | HYBRID"
      - name: management_fee_cents
        type: integer
        source: input
        description: "Flat monthly fee; required when fee_structure == MANAGEMENT_FEE, must be null otherwise."
        default: null
        constraints: ">= 0 when present"
      - name: not_to_exceed_cents
        type: integer
        source: input
        description: "Annual cost-plus ceiling; required when fee_structure == COST_PLUS, must be null otherwise."
        default: null
        constraints: "> 0 when present"
      - name: budgeted_staff_fte
        type: number
        source: input
        description: "Contracted staffing level in full-time equivalents."
        constraints: "> 0, max 2 decimals"
      - name: participation_target_pct
        type: integer
        source: input
        description: "Client goal: share of ELIGIBLE members expected to participate in a month."
        constraints: "1–100"
      - name: term_start_on
        type: string
        source: input
        description: "First day of contract term (YYYY-MM-DD)."
      - name: term_end_on
        type: string
        source: input
        description: "Last day of contract term (YYYY-MM-DD); must be strictly after term_start_on."
      - name: supersedes_contract_id
        type: string
        source: system
        description: "FK -> ClientContract.id; set only by POST /client-contracts/{id}/amendments, null on originals."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Contract lifecycle state (see §1.2 ClientContract)."
        default: DRAFT
        constraints: "DRAFT | PENDING_CLIENT_APPROVAL | ACTIVE | SUSPENDED | TERMINATED | WITHDRAWN"
      - name: revision_round
        type: integer
        source: computed
        description: "Count of PENDING_CLIENT_APPROVAL -> DRAFT returns; increments on every client RETURN decision."
        default: 0
      - name: ytd_billed_cents
        type: integer
        source: computed
        description: "Conserved fiscal quantity: SUM(MonthlyInvoice.net_amount_cents) over invoices of this contract whose status IN {ISSUED, PAID}."
        default: 0
      - name: pending_penalty_cents
        type: integer
        source: computed
        description: "Accrued coverage-shortfall penalty for the current period (MANAGEMENT_FEE contracts only); see calculations.coverage_shortfall_penalty."
        default: 0
      - name: uncovered_session_count
        type: integer
        source: computed
        description: "Count of ProgramSession rows of this contract whose status == CANCELLED_NO_COVER in the current period."
        default: 0
      - name: eligible_member_count
        type: integer
        source: computed
        description: "Count of Member rows of this contract whose eligibility_status == ELIGIBLE."
        default: 0
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the client APPROVE decision; null before approval."
        default: null

  # ------------------------------------------------------------------- staff --
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; the site this staff member serves."
      - name: full_name
        type: string
        source: input
        description: "Staff member name."
      - name: role_type
        type: enum
        source: input
        description: "Determines the required credential set (constants.REQUIRED_CREDENTIALS_BY_ROLE)."
        constraints: "SITE_MANAGER | GROUP_EX_INSTRUCTOR | PERSONAL_TRAINER | WELLNESS_COORDINATOR"
      - name: employment_type
        type: enum
        source: input
        description: "Employer of record for this staff member."
        constraints: "OPERATOR_EMPLOYED | CLIENT_EMPLOYED"
      - name: hourly_cost_cents
        type: integer
        source: input
        description: "Fully-burdened hourly labor cost used by calculations.session_labor_cost."
        constraints: "> 0"
      - name: duty_status
        type: enum
        source: computed
        description: "Duty dimension (see §1.2 StaffMember)."
        default: ACTIVE_DUTY
        constraints: "ACTIVE_DUTY | SUSPENDED_FROM_DUTY | OFFBOARDED"
      - name: readiness_index
        type: integer
        source: computed
        description: "0–100 emergency-response readiness score from calculations.staff_readiness_index."
        default: 0
      - name: last_drill_on
        type: string
        source: computed
        description: "Date (YYYY-MM-DD) of the most recent emergency-response drill recorded via POST /staff-members/{id}/emergency-drills."
        default: null
      - name: committed_minutes_current_period
        type: integer
        source: computed
        description: "Conserved labor quantity: SUM(StaffAssignment.paid_minutes) over this member's assignments whose status IN {ASSIGNED, CONFIRMED, COMPLETED}."
        default: 0
      - name: required_credential_types
        type: array
        source: computed
        description: |
          Credential types this role must hold, derived from role_type at creation
          by the fixed map REQUIRED_CREDENTIALS_BY_ROLE:
          SITE_MANAGER -> ["CPR_AED"], GROUP_EX_INSTRUCTOR -> ["GROUP_EX_CERT"],
          PERSONAL_TRAINER -> ["PT_CERT"], WELLNESS_COORDINATOR -> ["FIRST_AID"].
          Client-supplied values are ignored.

  - name: StaffCredential
    parent: null
    common_fields: true
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; holder of the credential."
      - name: credential_type
        type: enum
        source: input
        description: "Credential class."
        constraints: "CPR_AED | FIRST_AID | GROUP_EX_CERT | PT_CERT; at most one row per (staff_member_id, credential_type) with status != REJECTED"
      - name: issuer
        type: string
        source: input
        description: "Certifying body name."
      - name: credential_number
        type: string
        source: input
        description: "Certificate number as printed on the card."
      - name: expires_on
        type: string
        source: input
        description: "Credential expiry date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: computed
        description: "Verification/expiry state (see §1.2 StaffCredential — cyclic)."
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | VERIFIED | EXPIRING_SOON | EXPIRED | REJECTED"
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of the accepted verification decision; null while unverified."
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that accepted the credential (audit only; never used in business decisions)."
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "Free text supplied with a REJECT verification decision."
        default: null
      - name: renewal_count
        type: integer
        source: computed
        description: "Number of EXPIRED -> PENDING_VERIFICATION renewal submissions on this row."
        default: 0

  # --------------------------------------------------------------- facility ---
  - name: FacilityRoom
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; site that owns the room."
      - name: room_name
        type: string
        source: input
        description: "Room label shown on schedules."
        constraints: "Unique per contract_id"
      - name: room_type
        type: enum
        source: input
        description: "Programming category of the space."
        constraints: "STUDIO | WEIGHT_FLOOR | CARDIO_FLOOR | WELLNESS_SUITE"
      - name: max_occupancy
        type: integer
        source: input
        description: "Fire-code occupancy ceiling; bounds ProgramSession.forecast_attendance and check-in capacity."
        constraints: "> 0"
      - name: room_state
        type: enum
        source: computed
        description: "Posture gating session scheduling, start and check-ins (see §1.2 FacilityRoom)."
        default: OPEN
        constraints: "OPEN | RESTRICTED | CLOSED"
      - name: last_inspection_on
        type: string
        source: computed
        description: "Date of the most recent cleanliness/safety inspection (YYYY-MM-DD)."
        default: null
      - name: last_cleanliness_score
        type: integer
        source: computed
        description: "Score 0–100 from the most recent inspection."
        default: null
      - name: open_deficiency_count
        type: integer
        source: computed
        description: "Deficiencies recorded by the most recent inspection that have not been cleared by a later passing inspection."
        default: 0

  - name: FacilityAsset
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; site that owns the asset."
      - name: room_id
        type: string
        source: input
        description: "FK -> FacilityRoom.id; room the asset is installed in; must belong to the same contract_id."
      - name: asset_type
        type: enum
        source: input
        description: "AED units carry defibrillator readiness fields; CARDIO/STRENGTH units carry maintenance/downtime fields."
        constraints: "AED | CARDIO | STRENGTH"
      - name: asset_tag
        type: string
        source: input
        description: "Operator asset tag."
        constraints: "Unique per contract_id"
      - name: status
        type: enum
        source: computed
        description: "Maintenance state (see §1.2 FacilityAsset — cyclic)."
        default: IN_SERVICE
        constraints: "IN_SERVICE | MAINTENANCE_DUE | OUT_OF_SERVICE"
      - name: readiness_status
        type: enum
        source: computed
        description: "Defibrillator readiness from calculations.aed_readiness_status; always NOT_APPLICABLE when asset_type != AED."
        default: NOT_APPLICABLE
        constraints: "READY | PADS_EXPIRING | NOT_READY | NOT_APPLICABLE"
      - name: pad_expiry_on
        type: string
        source: input
        description: "Electrode pad expiry date (YYYY-MM-DD); required when asset_type == AED, must be null otherwise."
        default: null
      - name: battery_expiry_on
        type: string
        source: input
        description: "Battery expiry date (YYYY-MM-DD); required when asset_type == AED, must be null otherwise."
        default: null
      - name: service_interval_days
        type: integer
        source: input
        description: "Preventive-maintenance interval used to flag MAINTENANCE_DUE."
        default: 90
        constraints: "1–365"
      - name: last_inspection_on
        type: string
        source: input
        description: "Date of most recent AED_INSPECTION (YYYY-MM-DD). Seeded on POST /facility-assets so an asset transferred in with a documented inspection can be READY immediately; thereafter overwritten by AED_INSPECTION service events."
        default: null
      - name: last_service_on
        type: string
        source: input
        description: "Date of most recent PREVENTIVE_SERVICE or REPAIR_COMPLETE (YYYY-MM-DD). Seeded on POST /facility-assets, thereafter overwritten by PREVENTIVE_SERVICE / REPAIR_COMPLETE service events."
        default: null
      - name: out_of_service_since
        type: datetime
        source: computed
        description: "Logical-clock instant the asset entered OUT_OF_SERVICE; null while in service."
        default: null
      - name: out_of_service_days_current_period
        type: integer
        source: computed
        description: "Whole days of the invoice period the asset has spent OUT_OF_SERVICE, per calculations.equipment_downtime_credit."
        default: 0

  # -------------------------------------------------------------- programming --
  - name: ProgramOffering
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; site the program runs at."
      - name: lead_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; lead instructor/trainer; must belong to the same contract_id."
      - name: program_type
        type: enum
        source: input
        description: "Programming pillar."
        constraints: "GROUP_EXERCISE | PERSONAL_TRAINING | WELLNESS_CHALLENGE"
      - name: title
        type: string
        source: input
        description: "Program title."
      - name: participation_target
        type: integer
        source: input
        description: "Target number of counted participations over the program's life; denominator of calculations.program_attainment."
        constraints: "> 0"
      - name: max_participants_per_session
        type: integer
        source: input
        description: "Roster cap enforced at check-in."
        constraints: "> 0"
      - name: eligible_member_classes
        type: array
        source: input
        description: "Member classes allowed to check in; subset of {EMPLOYEE, DEPENDENT, RETIREE}."
        default: ["EMPLOYEE"]
      - name: required_credential_type
        type: enum
        source: input
        description: "Credential every assigned staff member must hold in status VERIFIED or EXPIRING_SOON."
        constraints: "CPR_AED | FIRST_AID | GROUP_EX_CERT | PT_CERT"
      - name: status
        type: enum
        source: computed
        description: "Offering lifecycle (see §1.2 ProgramOffering — cyclic ACTIVE↔PAUSED)."
        default: DRAFT
        constraints: "DRAFT | ACTIVE | PAUSED | CLOSED"
      - name: provisional_attainment_pct
        type: number
        source: computed
        description: "Forward-looking attainment variant from calculations.program_attainment (one decimal)."
        default: 0
      - name: final_attainment_pct
        type: number
        source: computed
        description: "Realized attainment variant from calculations.program_attainment (one decimal)."
        default: 0
      - name: counted_participation_total
        type: integer
        source: computed
        description: "COUNT(ParticipationRecord WHERE session.offering_id == this.id AND status == COUNTED)."
        default: 0
      - name: coverage_gap_count
        type: integer
        source: computed
        description: "Number of times a session of this offering was moved to STAFFING_AT_RISK by a staffing cascade."
        default: 0

  - name: ProgramSession
    parent: null
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> ProgramOffering.id; parent program."
      - name: room_id
        type: string
        source: input
        description: "FK -> FacilityRoom.id; booked space; must belong to the offering's contract_id."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Session start (inclusive)."
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Session end (exclusive); must be strictly after scheduled_start_utc."
      - name: forecast_attendance
        type: integer
        source: input
        description: "Expected head count; numerator input of the provisional attainment variant."
        constraints: ">= 0, <= offering.max_participants_per_session"
      - name: direct_supply_cost_cents
        type: integer
        source: input
        description: "Program supplies billed through on COST_PLUS contracts."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle (see §1.2 ProgramSession — branching)."
        default: SCHEDULED
        constraints: "SCHEDULED | STAFFED | STAFFING_AT_RISK | IN_PROGRESS | COMPLETED | CANCELLED_NO_COVER | CANCELLED_CLIENT | CANCELLED_FACILITY"
      - name: scheduled_minutes
        type: integer
        source: computed
        description: "(scheduled_end_utc - scheduled_start_utc) in whole minutes."
      - name: actual_attendance
        type: integer
        source: computed
        description: "COUNT(ParticipationRecord WHERE session_id == this.id AND status == COUNTED)."
        default: 0
      - name: cancel_reason
        type: enum
        source: computed
        description: "Populated on any cancellation branch."
        default: null
        constraints: "NO_COVER | CLIENT_REQUEST | FACILITY"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the session moved to IN_PROGRESS."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant the session moved to COMPLETED."
        default: null

  - name: StaffAssignment
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ProgramSession.id; session being staffed."
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; assigned staff member; must belong to the session's contract."
      - name: role_on_session
        type: enum
        source: input
        description: "LEAD assignments satisfy the session's staffing requirement; SUPPORT assignments do not."
        default: LEAD
        constraints: "LEAD | SUPPORT"
      - name: status
        type: enum
        source: computed
        description: "Assignment lifecycle (see §1.2 StaffAssignment)."
        default: ASSIGNED
        constraints: "ASSIGNED | CONFIRMED | VACANT_NEEDS_COVER | RELEASED | COMPLETED"
      - name: paid_minutes
        type: integer
        source: computed
        description: "session.scheduled_minutes + constants.PREP_BUFFER_MIN; the conserved unit of StaffMember.committed_minutes_current_period."
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "Per-assignment labor cost from calculations.session_labor_cost; 0 until the assignment reaches COMPLETED."
        default: 0
      - name: confirmed_at
        type: datetime
        source: system
        description: "Logical-clock instant the assigned staff member confirmed."
        default: null

  # ---------------------------------------------------------------- members ---
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; sponsoring employer site."
      - name: sponsor_member_id
        type: string
        source: input
        description: "FK -> Member.id; sponsoring employee for a DEPENDENT; required when member_class == DEPENDENT, must be null otherwise."
        default: null
      - name: member_class
        type: enum
        source: input
        description: "Eligibility population."
        constraints: "EMPLOYEE | DEPENDENT | RETIREE"
      - name: full_name
        type: string
        source: input
        description: "Member name."
      - name: employee_number
        type: string
        source: input
        description: "Client HR identifier; required when member_class == EMPLOYEE, must be null otherwise."
        default: null
      - name: eligibility_status
        type: enum
        source: computed
        description: "Eligibility dimension (see §1.2 Member — parallel dimension 1)."
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | ELIGIBLE | LAPSED | TERMINATED"
      - name: access_status
        type: enum
        source: computed
        description: "Badge/turnstile dimension (see §1.2 Member — parallel dimension 2); evolves independently of eligibility_status."
        default: NO_BADGE
        constraints: "NO_BADGE | ACTIVE | REVOKED"
      - name: health_data_consent
        type: boolean
        source: input
        description: "Member's explicit consent to store health-metric notes on participation records."
        default: false
      - name: incentive_points_balance
        type: integer
        source: computed
        description: "Conserved incentive quantity: SUM(ParticipationRecord.points_awarded WHERE member_id == this.id AND status == COUNTED)."
        default: 0
      - name: current_waiver_id
        type: string
        source: computed
        description: "Id of this member's LiabilityWaiver whose status == SIGNED, or null; not a declared foreign key — discover waivers through GET /members/{id}/waivers."
        default: null
      - name: last_check_in_utc
        type: datetime
        source: computed
        description: "Logical-clock instant of the member's most recent COUNTED check-in."
        default: null

  - name: LiabilityWaiver
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; signer."
      - name: waiver_version_code
        type: string
        source: input
        description: "Version code of the waiver text the member signed (e.g. WVR-2026A)."
      - name: expires_on
        type: string
        source: input
        description: "Last date the waiver is valid (YYYY-MM-DD); must be strictly after the signing date."
      - name: acknowledged_health_disclosure
        type: boolean
        source: input
        description: "Must be true; a false value is rejected as an invalid request."
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant the waiver was recorded."
      - name: status
        type: enum
        source: computed
        description: "Waiver state (see §1.2 LiabilityWaiver)."
        default: SIGNED
        constraints: "SIGNED | EXPIRED | SUPERSEDED | REVOKED"

  - name: ParticipationRecord
    parent: null
    common_fields: false
    # Append-only participation event: carries only `id` and `created_at`; no
    # `version` field and therefore no OCC. The single permitted mutation is the
    # COUNTED -> VOIDED correction in §1.2.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; participant."
      - name: session_id
        type: string
        source: input
        description: "FK -> ProgramSession.id; session attended."
      - name: check_in_utc
        type: datetime
        source: system
        description: "Logical-clock instant of the check-in."
      - name: points_awarded
        type: integer
        source: computed
        description: "Incentive points granted by calculations.incentive_points_award (may be 0 when the weekly cap is exhausted)."
      - name: points_capped
        type: boolean
        source: computed
        description: "True when the weekly cap reduced the award below its uncapped value."
      - name: streak_bonus_applied
        type: boolean
        source: computed
        description: "True when constants.STREAK_BONUS_POINTS was included in the uncapped award."
      - name: recorded_by_role
        type: enum
        source: computed
        description: "Role that performed the check-in."
        constraints: "MEMBER | FITNESS_STAFF"
      - name: health_metrics_note
        type: string
        source: input
        description: "Optional health-metric note; accepted only when the member's health_data_consent == true, and never exposed through the aggregate utilization report."
        default: null
      - name: status
        type: enum
        source: computed
        description: "COUNTED on creation; VOIDED after a correction."
        default: COUNTED
        constraints: "COUNTED | VOIDED"
      - name: void_reason
        type: string
        source: input
        description: "Free text captured on the void correction."
        default: null

  # -------------------------------------------------------------- incidents ---
  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; site where the incident occurred."
      - name: reported_by_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; staff member who filed the report."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; injured/affected member when applicable."
        default: null
      - name: asset_id
        type: string
        source: input
        description: "FK -> FacilityAsset.id; equipment involved when applicable."
        default: null
      - name: occurred_at_utc
        type: datetime
        source: input
        description: "When the incident happened; must not be after the logical clock."
      - name: severity
        type: enum
        source: input
        description: "Triage severity."
        constraints: "MINOR | MODERATE | SERIOUS"
      - name: cause_category
        type: enum
        source: input
        description: "Cause bucket driving the equipment cascade."
        constraints: "EQUIPMENT | MEDICAL | SLIP_FALL | OTHER"
      - name: narrative
        type: string
        source: input
        description: "Factual account of the incident."
      - name: aed_deployed
        type: boolean
        source: input
        description: "Whether an AED was used during the response."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Review/claim lifecycle (see §1.2 IncidentReport — branching with a return loop)."
        default: REPORTED
        constraints: "REPORTED | UNDER_REVIEW | CLAIM_FILED | CLOSED_NO_CLAIM | CLAIM_CLOSED"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor that opened the review (audit only)."
        default: null
      - name: return_count
        type: integer
        source: computed
        description: "Number of UNDER_REVIEW -> REPORTED returns for more information."
        default: 0
      - name: claim_reference
        type: string
        source: input
        description: "Carrier claim number captured when a claim is filed."
        default: null
      - name: closure_note
        type: string
        source: input
        description: "Free text captured on closure."
        default: null

  # --------------------------------------------------------------- invoicing --
  - name: MonthlyInvoice
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ClientContract.id; billed client."
      - name: period_month
        type: string
        source: input
        description: "Billing period in YYYY-MM form."
        constraints: "At most one invoice per (contract_id, period_month) in status IN {ISSUED, DISPUTED, PAID}"
      - name: fee_structure_snapshot
        type: enum
        source: computed
        description: "contract.fee_structure pinned at draft time; the invoice keeps billing under this model even if a later amendment changes the contract."
        constraints: "MANAGEMENT_FEE | COST_PLUS"
      - name: labor_subtotal_cents
        type: integer
        source: computed
        description: "Period labor rollup from calculations.session_labor_cost."
        default: 0
      - name: program_direct_cost_cents
        type: integer
        source: computed
        description: "SUM(ProgramSession.direct_supply_cost_cents) over COMPLETED sessions of the period."
        default: 0
      - name: admin_markup_cents
        type: integer
        source: computed
        description: "Tiered administrative markup (COST_PLUS only) from calculations.cost_plus_fee_ladder."
        default: 0
      - name: volume_credit_cents
        type: integer
        source: computed
        description: "Tiered volume credit keyed on gross_amount_cents (COST_PLUS only)."
        default: 0
      - name: downtime_credit_cents
        type: integer
        source: computed
        description: "Equipment downtime credit from calculations.equipment_downtime_credit."
        default: 0
      - name: coverage_penalty_cents
        type: integer
        source: computed
        description: "Coverage-shortfall penalty from calculations.coverage_shortfall_penalty (MANAGEMENT_FEE only)."
        default: 0
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "COST_PLUS: labor_subtotal + program_direct_cost + admin_markup. MANAGEMENT_FEE: contract.management_fee_cents."
        default: 0
      - name: net_amount_cents
        type: integer
        source: computed
        description: "Final billed amount after credits, penalty and the not-to-exceed cap."
        default: 0
      - name: nte_capped
        type: boolean
        source: computed
        description: "True when the annual not-to-exceed ceiling reduced net_amount_cents."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Invoice lifecycle (see §1.2 MonthlyInvoice — cyclic DISPUTED -> DRAFT)."
        default: DRAFT
        constraints: "DRAFT | ISSUED | DISPUTED | PAID | SUPERSEDED"
      - name: dispute_reason
        type: string
        source: input
        description: "Client's stated reason captured on dispute."
        default: null
      - name: rebill_count
        type: integer
        source: computed
        description: "Number of DISPUTED -> DRAFT rebill cycles on this invoice."
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of issue; cleared to null on rebill."
        default: null
      - name: disputed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the client dispute."
        default: null
      - name: paid_at
        type: datetime
        source: system
        description: "Logical-clock instant of payment."
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # -------------------------------------------------- ClientContract (cyclic) --
  - entity: ClientContract
    initial_state: DRAFT
    terminal_states: [TERMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_CLIENT_APPROVAL
        trigger: "POST /client-contracts/{id}/submit"
        actor: OperatorAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "fee terms complete: management_fee_cents non-null when fee_structure == MANAGEMENT_FEE; not_to_exceed_cents non-null when fee_structure == COST_PLUS"
          - "contract has >= 1 StaffMember with role_type == SITE_MANAGER whose duty_status == ACTIVE_DUTY"
        side_effects:
          - "No child mutation."
      - from: PENDING_CLIENT_APPROVAL
        to: DRAFT
        trigger: "POST /client-contracts/{id}/client-decision with decision == RETURN"
        actor: ClientSponsor
        preconditions:
          - "contract.status == PENDING_CLIENT_APPROVAL"
          - "X-User-ID == contract.id (ClientSponsor identity)"
        side_effects:
          - "contract.revision_round += 1"
        note: "Revision loop — the DRAFT -> PENDING -> DRAFT cycle may repeat without bound."
      - from: PENDING_CLIENT_APPROVAL
        to: ACTIVE
        trigger: "POST /client-contracts/{id}/client-decision with decision == APPROVE"
        actor: ClientSponsor
        preconditions:
          - "contract.status == PENDING_CLIENT_APPROVAL"
          - "X-User-ID == contract.id (ClientSponsor identity)"
        side_effects:
          - "contract.approved_at = logical clock now"
          - "Every FacilityRoom of this contract whose room_state == CLOSED and open_deficiency_count == 0 moves to OPEN"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /client-contracts/{id}/service-status with action == SUSPEND"
        actor: OperatorAdmin
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "CASCADE LINK 1 — every ProgramOffering of this contract whose status == ACTIVE moves to PAUSED (ordered by ProgramOffering.created_at ASC)."
          - "CASCADE LINK 2 — caused by each offering's move to PAUSED: that offering's ProgramSession rows whose status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK} move to CANCELLED_CLIENT with cancel_reason = CLIENT_REQUEST (ordered by ProgramSession.scheduled_start_utc ASC, then created_at ASC)."
          - "CASCADE LINK 3 — caused by each session's cancellation: that session's StaffAssignment rows whose status IN {ASSIGNED, CONFIRMED} move to RELEASED."
          - "CASCADE LINK 4 — caused by each assignment's release: StaffMember.committed_minutes_current_period -= assignment.paid_minutes, and the owning offering's provisional_attainment_pct is recomputed by calculations.program_attainment."
          - "Every FacilityRoom of this contract moves to CLOSED."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /client-contracts/{id}/service-status with action == RESUME"
        actor: OperatorAdmin
        preconditions:
          - "contract.status == SUSPENDED"
        side_effects:
          - "Every ProgramOffering of this contract whose status == PAUSED moves to ACTIVE."
          - "Every FacilityRoom of this contract whose open_deficiency_count == 0 moves to OPEN; rooms with open_deficiency_count > 0 move to RESTRICTED."
          - "Sessions cancelled by the suspension are NOT restored (cancellation is terminal)."
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /client-contracts/{id}/service-status with action == TERMINATE"
        actor: OperatorAdmin
        preconditions:
          - "contract.status IN {ACTIVE, SUSPENDED}"
          - "No MonthlyInvoice of this contract has status IN {DRAFT, DISPUTED}"
        side_effects:
          - "Same cascade as the SUSPEND transition (links 1–4), plus every Member of this contract moves eligibility_status -> TERMINATED and access_status -> REVOKED, and every StaffMember of this contract moves duty_status -> OFFBOARDED."
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /client-contracts/{id}/service-status with action == TERMINATE"
        actor: OperatorAdmin
        preconditions:
          - "contract.status == SUSPENDED"
          - "No MonthlyInvoice of this contract has status IN {DRAFT, DISPUTED}"
        side_effects:
          - "Every Member of this contract moves eligibility_status -> TERMINATED and access_status -> REVOKED; every StaffMember moves duty_status -> OFFBOARDED."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /client-contracts/{id}/service-status with action == TERMINATE"
        actor: OperatorAdmin
        preconditions:
          - "contract.status == DRAFT"
        side_effects:
          - "No child mutation; site_code uniqueness is released."

  # ------------------------------------------------ StaffCredential (cyclic) ---
  - entity: StaffCredential
    initial_state: PENDING_VERIFICATION
    terminal_states: []
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /staff-credentials/{id}/verify with decision == ACCEPT"
        actor: OperatorAdmin | SiteManager
        preconditions:
          - "credential.status == PENDING_VERIFICATION"
          - "credential.expires_on > clock today"
          - "Segregation of duties: when the actor role is SiteManager, X-User-ID != credential.staff_member_id"
        side_effects:
          - "credential.verified_at = now; credential.verified_by_user_id = X-User-ID"
          - "StaffMember.readiness_index recomputed by calculations.staff_readiness_index"
          - "If the holder's duty_status == SUSPENDED_FROM_DUTY and every required credential type is now in {VERIFIED, EXPIRING_SOON}, duty_status moves to ACTIVE_DUTY"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /staff-credentials/{id}/verify with decision == REJECT"
        actor: OperatorAdmin | SiteManager
        preconditions:
          - "credential.status == PENDING_VERIFICATION"
          - "rejection_reason is present and non-empty"
          - "Segregation of duties: when the actor role is SiteManager, X-User-ID != credential.staff_member_id"
        side_effects:
          - "StaffMember.readiness_index recomputed (credential_score becomes 0 when the rejected type is required)"
          - "If the rejected type is in the holder's required_credential_types, holder's duty_status moves to SUSPENDED_FROM_DUTY and the staffing cascade of calculations/daily run applies on the next POST /operations/daily-readiness-run"
      - from: VERIFIED
        to: EXPIRING_SOON
        trigger: "POST /operations/daily-readiness-run (system, step 1)"
        actor: system
        preconditions:
          - "credential.status == VERIFIED"
          - "credential.expires_on <= clock today + constants.CREDENTIAL_EXPIRING_WINDOW_DAYS AND credential.expires_on > clock today"
        side_effects:
          - "StaffMember.readiness_index recomputed (credential_score drops to 60)"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /operations/daily-readiness-run (system, step 1)"
        actor: system
        preconditions:
          - "credential.status == VERIFIED"
          - "credential.expires_on <= clock today"
        side_effects:
          - "Same as EXPIRING_SOON -> EXPIRED below."
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "POST /operations/daily-readiness-run (system, step 1)"
        actor: system
        preconditions:
          - "credential.status == EXPIRING_SOON"
          - "credential.expires_on <= clock today"
        side_effects:
          - "CASCADE LINK 1 — when credential_type IN holder.required_credential_types, holder.duty_status moves ACTIVE_DUTY -> SUSPENDED_FROM_DUTY and holder.readiness_index recomputed to 0."
          - "CASCADE LINK 2 — caused by the holder's suspension: every StaffAssignment of that holder whose status IN {ASSIGNED, CONFIRMED} on a session whose status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK} moves to VACANT_NEEDS_COVER, and holder.committed_minutes_current_period -= assignment.paid_minutes."
          - "CASCADE LINK 3 — caused by each vacated LEAD assignment: the session moves to STAFFING_AT_RISK and its offering.coverage_gap_count += 1."
          - "CASCADE LINK 4 — caused by each STAFFING_AT_RISK session: when scheduled_start_utc <= now + constants.SESSION_LOCK_WINDOW_HOURS the session moves to CANCELLED_NO_COVER with cancel_reason = NO_COVER, contract.uncovered_session_count += 1, contract.pending_penalty_cents recomputed by calculations.coverage_shortfall_penalty, and offering.provisional_attainment_pct recomputed."
      - from: EXPIRED
        to: PENDING_VERIFICATION
        trigger: "POST /staff-credentials/{id}/renew"
        actor: OperatorAdmin | SiteManager
        preconditions:
          - "credential.status == EXPIRED"
          - "new expires_on > clock today"
        side_effects:
          - "credential.expires_on = payload expires_on; credential.credential_number = payload credential_number; credential.renewal_count += 1; verified_at = null; verified_by_user_id = null"
        note: "Closes the cycle EXPIRED -> PENDING_VERIFICATION -> VERIFIED; renewal_count records the number of laps."
      - from: REJECTED
        to: PENDING_VERIFICATION
        trigger: "POST /staff-credentials/{id}/renew"
        actor: OperatorAdmin | SiteManager
        preconditions:
          - "credential.status == REJECTED"
          - "new expires_on > clock today"
        side_effects:
          - "credential.rejection_reason = null; credential.renewal_count += 1"

  # ------------------------------------------------------ StaffMember (duty) --
  - entity: StaffMember
    initial_state: ACTIVE_DUTY
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ACTIVE_DUTY
        to: SUSPENDED_FROM_DUTY
        trigger: "System, as CASCADE LINK 1 of StaffCredential -> EXPIRED / REJECTED"
        actor: system
        preconditions:
          - "staff.duty_status == ACTIVE_DUTY"
          - "At least one credential_type in staff.required_credential_types has no row in status {VERIFIED, EXPIRING_SOON}"
        side_effects:
          - "staff.readiness_index = 0; the assignment/session cascade (links 2–4) runs."
      - from: SUSPENDED_FROM_DUTY
        to: ACTIVE_DUTY
        trigger: "POST /staff-members/{id}/duty-reinstate"
        actor: OperatorAdmin
        preconditions:
          - "staff.duty_status == SUSPENDED_FROM_DUTY"
          - "Every credential_type in staff.required_credential_types has a row in status {VERIFIED, EXPIRING_SOON}"
        side_effects:
          - "staff.readiness_index recomputed by calculations.staff_readiness_index"
        note: "Cycle ACTIVE_DUTY -> SUSPENDED_FROM_DUTY -> ACTIVE_DUTY. Vacated assignments are NOT restored."
      - from: ACTIVE_DUTY
        to: OFFBOARDED
        trigger: "System, as a side effect of ClientContract -> TERMINATED"
        actor: system
        preconditions:
          - "contract.status == TERMINATED"
        side_effects:
          - "Remaining ASSIGNED/CONFIRMED assignments move to RELEASED; committed_minutes_current_period = 0."
      - from: SUSPENDED_FROM_DUTY
        to: OFFBOARDED
        trigger: "System, as a side effect of ClientContract -> TERMINATED"
        actor: system
        preconditions:
          - "contract.status == TERMINATED"
        side_effects:
          - "committed_minutes_current_period = 0."

  # -------------------------------------------------- FacilityRoom (posture) --
  - entity: FacilityRoom
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "POST /facility-rooms/{id}/inspections with cleanliness_score < constants.ROOM_PASS_SCORE or deficiency_count > 0"
        actor: SiteManager | ComplianceAuditor
        preconditions:
          - "room.room_state == OPEN"
        side_effects:
          - "room.last_inspection_on / last_cleanliness_score / open_deficiency_count updated"
          - "Every ProgramSession of this room whose status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK} and scheduled_start_utc <= now + constants.SESSION_LOCK_WINDOW_HOURS moves to CANCELLED_FACILITY with cancel_reason = FACILITY; each such cancellation releases the session's ASSIGNED/CONFIRMED StaffAssignment rows and decrements StaffMember.committed_minutes_current_period."
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /facility-rooms/{id}/inspections with cleanliness_score >= constants.ROOM_PASS_SCORE and deficiency_count == 0"
        actor: SiteManager | ComplianceAuditor
        preconditions:
          - "room.room_state == RESTRICTED"
          - "contract.status == ACTIVE"
        side_effects:
          - "room.open_deficiency_count = 0; room.last_cleanliness_score updated."
      - from: OPEN
        to: CLOSED
        trigger: "System, as a side effect of ClientContract -> SUSPENDED / TERMINATED"
        actor: system
        preconditions:
          - "contract.status IN {SUSPENDED, TERMINATED}"
        side_effects:
          - "No further sessions may be scheduled in this room."
      - from: RESTRICTED
        to: CLOSED
        trigger: "System, as a side effect of ClientContract -> SUSPENDED / TERMINATED"
        actor: system
        preconditions:
          - "contract.status IN {SUSPENDED, TERMINATED}"
        side_effects:
          - "open_deficiency_count is preserved so RESUME can distinguish RESTRICTED from OPEN."
      - from: CLOSED
        to: OPEN
        trigger: "System, as a side effect of ClientContract -> ACTIVE (approve or resume)"
        actor: system
        preconditions:
          - "room.open_deficiency_count == 0"
        side_effects:
          - "Room is bookable again."
      - from: CLOSED
        to: RESTRICTED
        trigger: "System, as a side effect of ClientContract SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "room.open_deficiency_count > 0"
        side_effects:
          - "Room remains unbookable until a passing inspection clears the deficiencies."

  # ------------------------------------------------- FacilityAsset (cyclic) ---
  - entity: FacilityAsset
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - from: IN_SERVICE
        to: MAINTENANCE_DUE
        trigger: "POST /operations/daily-readiness-run (system, step 5)"
        actor: system
        preconditions:
          - "asset.status == IN_SERVICE"
          - "asset.asset_type != AED"
          - "asset.last_service_on is null or clock today - asset.last_service_on >= asset.service_interval_days"
        side_effects:
          - "No session impact; the asset is still usable."
      - from: MAINTENANCE_DUE
        to: IN_SERVICE
        trigger: "POST /facility-assets/{id}/service-events with event_type == PREVENTIVE_SERVICE"
        actor: SiteManager
        preconditions:
          - "asset.status == MAINTENANCE_DUE"
        side_effects:
          - "asset.last_service_on = clock today."
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /facility-assets/{id}/service-events with event_type == TAKE_OUT_OF_SERVICE, or system cascade from IncidentReport review"
        actor: SiteManager | system
        preconditions:
          - "asset.status IN {IN_SERVICE, MAINTENANCE_DUE}"
        side_effects:
          - "asset.out_of_service_since = now"
          - "When asset_type == AED, asset.readiness_status = NOT_READY and every ProgramSession of the site whose status IN {SCHEDULED, STAFFED} keeps its state but can no longer be started (§1.4 priority 12 gate)."
      - from: MAINTENANCE_DUE
        to: OUT_OF_SERVICE
        trigger: "POST /facility-assets/{id}/service-events with event_type == TAKE_OUT_OF_SERVICE"
        actor: SiteManager
        preconditions:
          - "asset.status == MAINTENANCE_DUE"
        side_effects:
          - "asset.out_of_service_since = now."
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /facility-assets/{id}/service-events with event_type == REPAIR_COMPLETE"
        actor: SiteManager
        preconditions:
          - "asset.status == OUT_OF_SERVICE"
        side_effects:
          - "asset.out_of_service_days_current_period recomputed by calculations.equipment_downtime_credit; asset.out_of_service_since = null; asset.last_service_on = clock today"
          - "When asset_type == AED, asset.readiness_status recomputed by calculations.aed_readiness_status."
        note: "Cycle IN_SERVICE -> OUT_OF_SERVICE -> IN_SERVICE; each lap adds to the period's downtime days."

  # ----------------------------------------------- ProgramOffering (cyclic) ---
  - entity: ProgramOffering
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /program-offerings/{id}/status-changes with action == ACTIVATE"
        actor: SiteManager
        preconditions:
          - "offering.status == DRAFT"
          - "contract.status == ACTIVE"
          - "lead staff duty_status == ACTIVE_DUTY"
          - "lead staff holds offering.required_credential_type in status {VERIFIED, EXPIRING_SOON}"
          - "lead staff readiness_index >= constants.ACTIVATION_MIN_READINESS"
          - "contract has >= 1 FacilityAsset with asset_type == AED and readiness_status == READY"
        side_effects:
          - "offering.provisional_attainment_pct and final_attainment_pct recomputed by calculations.program_attainment."
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /program-offerings/{id}/status-changes with action == PAUSE, or system cascade from ClientContract -> SUSPENDED"
        actor: SiteManager | system
        preconditions:
          - "offering.status == ACTIVE"
        side_effects:
          - "Every ProgramSession of this offering whose status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK} moves to CANCELLED_CLIENT with cancel_reason = CLIENT_REQUEST, which releases their ASSIGNED/CONFIRMED assignments, which decrements each StaffMember.committed_minutes_current_period."
          - "offering.provisional_attainment_pct recomputed."
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /program-offerings/{id}/status-changes with action == RESUME, or system cascade from ClientContract SUSPENDED -> ACTIVE"
        actor: SiteManager | system
        preconditions:
          - "offering.status == PAUSED"
          - "contract.status == ACTIVE"
        side_effects:
          - "New sessions may be scheduled again; cancelled sessions are not restored."
        note: "Cycle ACTIVE -> PAUSED -> ACTIVE."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /program-offerings/{id}/status-changes with action == CLOSE"
        actor: SiteManager
        preconditions:
          - "offering.status IN {ACTIVE, PAUSED}"
          - "No ProgramSession of this offering has status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK, IN_PROGRESS}"
        side_effects:
          - "offering.final_attainment_pct recomputed by calculations.program_attainment (final variant); provisional_attainment_pct is frozen at its last value."
      - from: PAUSED
        to: CLOSED
        trigger: "POST /program-offerings/{id}/status-changes with action == CLOSE"
        actor: SiteManager
        preconditions:
          - "offering.status == PAUSED"
          - "No ProgramSession of this offering has status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK, IN_PROGRESS}"
        side_effects:
          - "offering.final_attainment_pct recomputed by calculations.program_attainment (final variant)."

  # --------------------------------------------- ProgramSession (branching) ---
  - entity: ProgramSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_NO_COVER, CANCELLED_CLIENT, CANCELLED_FACILITY]
    transitions:
      - from: SCHEDULED
        to: STAFFED
        trigger: "POST /staff-assignments/{id}/confirm (system consequence when a LEAD assignment is confirmed)"
        actor: system
        preconditions:
          - "session.status == SCHEDULED"
          - "The confirmed assignment has role_on_session == LEAD"
        side_effects:
          - "offering.provisional_attainment_pct recomputed."
      - from: STAFFED
        to: STAFFING_AT_RISK
        trigger: "System, as CASCADE LINK 3 of a credential expiry, or POST /staff-assignments/{id}/release on the LEAD assignment"
        actor: system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED}"
          - "No remaining StaffAssignment with role_on_session == LEAD and status IN {ASSIGNED, CONFIRMED}"
        side_effects:
          - "offering.coverage_gap_count += 1."
      - from: STAFFING_AT_RISK
        to: STAFFED
        trigger: "POST /staff-assignments/{id}/confirm on a replacement LEAD assignment"
        actor: system
        preconditions:
          - "session.status == STAFFING_AT_RISK"
          - "The confirmed assignment has role_on_session == LEAD"
        side_effects:
          - "offering.coverage_gap_count is NOT decremented (it is a cumulative gap counter)."
        note: "Cycle STAFFED -> STAFFING_AT_RISK -> STAFFED is permitted; coverage_gap_count only grows."
      - from: STAFFED
        to: IN_PROGRESS
        trigger: "POST /program-sessions/{id}/status-changes with action == START"
        actor: SiteManager | FitnessStaff
        preconditions:
          - "session.status == STAFFED"
          - "contract.status == ACTIVE"
          - "room.room_state == OPEN"
          - "session.room's contract has >= 1 FacilityAsset with asset_type == AED and readiness_status == READY"
          - "now >= session.scheduled_start_utc - constants.SESSION_START_GRACE_MIN minutes"
        side_effects:
          - "session.started_at = now."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /program-sessions/{id}/status-changes with action == COMPLETE"
        actor: SiteManager | FitnessStaff
        preconditions:
          - "session.status == IN_PROGRESS"
        side_effects:
          - "session.completed_at = now; session.actual_attendance = COUNT of its COUNTED ParticipationRecord rows."
          - "Every StaffAssignment of this session whose status == CONFIRMED moves to COMPLETED and its labor_cost_cents is computed by calculations.session_labor_cost."
          - "offering.final_attainment_pct and provisional_attainment_pct recomputed by calculations.program_attainment."
      - from: SCHEDULED
        to: CANCELLED_CLIENT
        trigger: "POST /program-sessions/{id}/status-changes with action == CANCEL and cancel_reason == CLIENT_REQUEST"
        actor: SiteManager
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
        side_effects:
          - "BRANCH A side effects: assignments in {ASSIGNED, CONFIRMED} move to RELEASED; each release decrements StaffMember.committed_minutes_current_period by assignment.paid_minutes; offering.provisional_attainment_pct recomputed. contract.uncovered_session_count is NOT incremented and no penalty accrues."
      - from: STAFFED
        to: CANCELLED_CLIENT
        trigger: "POST /program-sessions/{id}/status-changes with action == CANCEL and cancel_reason == CLIENT_REQUEST"
        actor: SiteManager
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
        side_effects:
          - "Same BRANCH A side effects as SCHEDULED -> CANCELLED_CLIENT."
      - from: SCHEDULED
        to: CANCELLED_NO_COVER
        trigger: "POST /program-sessions/{id}/status-changes with action == CANCEL and cancel_reason == NO_COVER, or POST /operations/daily-readiness-run step 7"
        actor: SiteManager | system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
          - "No StaffAssignment of this session has role_on_session == LEAD and status IN {ASSIGNED, CONFIRMED}"
        side_effects:
          - "Same BRANCH B side effects as STAFFING_AT_RISK -> CANCELLED_NO_COVER below (uncovered_session_count += 1 and penalty recomputation)."
      - from: STAFFED
        to: CANCELLED_NO_COVER
        trigger: "POST /program-sessions/{id}/status-changes with action == CANCEL and cancel_reason == NO_COVER"
        actor: SiteManager | system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
          - "No StaffAssignment of this session has role_on_session == LEAD and status IN {ASSIGNED, CONFIRMED}"
        side_effects:
          - "Same BRANCH B side effects as STAFFING_AT_RISK -> CANCELLED_NO_COVER below."
      - from: STAFFING_AT_RISK
        to: CANCELLED_NO_COVER
        trigger: "POST /program-sessions/{id}/status-changes with action == CANCEL and cancel_reason == NO_COVER, or POST /operations/daily-readiness-run step 7"
        actor: SiteManager | system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
          - "No StaffAssignment of this session has role_on_session == LEAD and status IN {ASSIGNED, CONFIRMED}"
        side_effects:
          - "BRANCH B side effects: assignments in {ASSIGNED, CONFIRMED, VACANT_NEEDS_COVER} move to RELEASED with the same committed-minutes decrement; contract.uncovered_session_count += 1; contract.pending_penalty_cents recomputed by calculations.coverage_shortfall_penalty; offering.provisional_attainment_pct recomputed."
        note: "Branch divergence: BRANCH B accrues a coverage penalty on MANAGEMENT_FEE contracts, BRANCH A never does."
      - from: STAFFED
        to: CANCELLED_FACILITY
        trigger: "System, as a side effect of FacilityRoom OPEN -> RESTRICTED within the lock window"
        actor: system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
          - "session.scheduled_start_utc <= now + constants.SESSION_LOCK_WINDOW_HOURS"
        side_effects:
          - "Same BRANCH C side effects as SCHEDULED -> CANCELLED_FACILITY below."
      - from: STAFFING_AT_RISK
        to: CANCELLED_CLIENT
        trigger: "POST /program-sessions/{id}/status-changes with action == CANCEL and cancel_reason == CLIENT_REQUEST, or system cascade from ProgramOffering -> PAUSED"
        actor: SiteManager | system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
        side_effects:
          - "Same BRANCH A side effects as SCHEDULED -> CANCELLED_CLIENT (no penalty accrual)."
      - from: SCHEDULED
        to: CANCELLED_FACILITY
        trigger: "System, as a side effect of FacilityRoom OPEN -> RESTRICTED within the lock window"
        actor: system
        preconditions:
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
          - "session.scheduled_start_utc <= now + constants.SESSION_LOCK_WINDOW_HOURS"
        side_effects:
          - "BRANCH C side effects: assignments released with the committed-minutes decrement; cancel_reason = FACILITY; contract.uncovered_session_count is NOT incremented; offering.provisional_attainment_pct recomputed."

  # --------------------------------------------------------- StaffAssignment --
  - entity: StaffAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /staff-assignments/{id}/confirm"
        actor: FitnessStaff | SiteManager
        preconditions:
          - "assignment.status == ASSIGNED"
          - "session.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK}"
          - "staff.duty_status == ACTIVE_DUTY"
          - "When the actor role is FitnessStaff, X-User-ID == assignment.staff_member_id"
        side_effects:
          - "assignment.confirmed_at = now"
          - "When role_on_session == LEAD, the session moves SCHEDULED -> STAFFED or STAFFING_AT_RISK -> STAFFED."
      - from: ASSIGNED
        to: VACANT_NEEDS_COVER
        trigger: "System, as CASCADE LINK 2 of a credential expiry"
        actor: system
        preconditions:
          - "assignment.status IN {ASSIGNED, CONFIRMED}"
          - "staff.duty_status == SUSPENDED_FROM_DUTY"
        side_effects:
          - "StaffMember.committed_minutes_current_period -= assignment.paid_minutes; the session moves to STAFFING_AT_RISK when this was the LEAD assignment."
      - from: CONFIRMED
        to: VACANT_NEEDS_COVER
        trigger: "System, as CASCADE LINK 2 of a credential expiry"
        actor: system
        preconditions:
          - "assignment.status IN {ASSIGNED, CONFIRMED}"
          - "staff.duty_status == SUSPENDED_FROM_DUTY"
        side_effects:
          - "Same as ASSIGNED -> VACANT_NEEDS_COVER."
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /staff-assignments/{id}/release, or system cascade from a session cancellation"
        actor: SiteManager | system
        preconditions:
          - "assignment.status IN {ASSIGNED, CONFIRMED, VACANT_NEEDS_COVER}"
        side_effects:
          - "COMPENSATION — StaffMember.committed_minutes_current_period -= assignment.paid_minutes (skipped when the assignment was already VACANT_NEEDS_COVER, which already decremented it), restoring the invariant committed_minutes_current_period == SUM(paid_minutes of assignments in {ASSIGNED, CONFIRMED, COMPLETED})."
          - "When role_on_session == LEAD and the session is in {SCHEDULED, STAFFED}, the session moves to STAFFING_AT_RISK and offering.coverage_gap_count += 1."
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /staff-assignments/{id}/release, or system cascade from a session cancellation"
        actor: SiteManager | system
        preconditions:
          - "assignment.status IN {ASSIGNED, CONFIRMED, VACANT_NEEDS_COVER}"
        side_effects:
          - "Same as ASSIGNED -> RELEASED."
      - from: VACANT_NEEDS_COVER
        to: RELEASED
        trigger: "POST /staff-assignments/{id}/release, or system cascade from a session cancellation"
        actor: SiteManager | system
        preconditions:
          - "assignment.status == VACANT_NEEDS_COVER"
        side_effects:
          - "No committed-minutes change (already decremented when the assignment was vacated)."
      - from: CONFIRMED
        to: COMPLETED
        trigger: "System, as a side effect of ProgramSession IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions:
          - "assignment.status == CONFIRMED"
          - "session.status == COMPLETED"
        side_effects:
          - "assignment.labor_cost_cents computed by calculations.session_labor_cost; committed minutes stay booked (COMPLETED is inside the invariant's status set)."

  # ------------------------------------- Member — parallel dimension 1 of 2 ---
  - entity: Member
    dimension: eligibility_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ELIGIBLE
        trigger: "POST /members/{id}/eligibility-decisions with action == VERIFY"
        actor: ClientSponsor
        preconditions:
          - "member.eligibility_status == PENDING_VERIFICATION"
          - "contract.status == ACTIVE"
          - "When member_class == DEPENDENT, the sponsor Member's eligibility_status == ELIGIBLE"
        side_effects:
          - "contract.eligible_member_count += 1"
          - "access_status is NOT changed (independent dimension)."
      - from: ELIGIBLE
        to: LAPSED
        trigger: "POST /members/{id}/eligibility-decisions with action == LAPSE"
        actor: ClientSponsor
        preconditions:
          - "member.eligibility_status == ELIGIBLE"
        side_effects:
          - "contract.eligible_member_count -= 1"
          - "When access_status == ACTIVE it moves to REVOKED (cross-dimension consequence)"
          - "When member_class == EMPLOYEE, every DEPENDENT whose sponsor_member_id == this member also moves ELIGIBLE -> LAPSED with the same access consequence."
      - from: LAPSED
        to: ELIGIBLE
        trigger: "POST /members/{id}/eligibility-decisions with action == REINSTATE"
        actor: ClientSponsor
        preconditions:
          - "member.eligibility_status == LAPSED"
          - "contract.status == ACTIVE"
          - "When member_class == DEPENDENT, the sponsor Member's eligibility_status == ELIGIBLE"
        side_effects:
          - "contract.eligible_member_count += 1"
          - "access_status stays REVOKED until a badge grant is issued (dimensions do not re-couple automatically)."
        note: "Cycle ELIGIBLE -> LAPSED -> ELIGIBLE."
      - from: ELIGIBLE
        to: TERMINATED
        trigger: "POST /members/{id}/eligibility-decisions with action == TERMINATE, or system cascade from ClientContract -> TERMINATED"
        actor: ClientSponsor | system
        preconditions:
          - "member.eligibility_status IN {PENDING_VERIFICATION, ELIGIBLE, LAPSED}"
        side_effects:
          - "contract.eligible_member_count -= 1 when the prior status was ELIGIBLE"
          - "access_status moves to REVOKED; the member's SIGNED LiabilityWaiver moves to REVOKED and member.current_waiver_id = null"
          - "Every DEPENDENT sponsored by this member also moves to TERMINATED with the same consequences."
      - from: LAPSED
        to: TERMINATED
        trigger: "POST /members/{id}/eligibility-decisions with action == TERMINATE"
        actor: ClientSponsor | system
        preconditions:
          - "member.eligibility_status IN {PENDING_VERIFICATION, ELIGIBLE, LAPSED}"
        side_effects:
          - "Same as ELIGIBLE -> TERMINATED, without the eligible_member_count decrement."
      - from: PENDING_VERIFICATION
        to: TERMINATED
        trigger: "POST /members/{id}/eligibility-decisions with action == TERMINATE"
        actor: ClientSponsor | system
        preconditions:
          - "member.eligibility_status == PENDING_VERIFICATION"
        side_effects:
          - "access_status moves to REVOKED; no eligible_member_count change."

  # ------------------------------------- Member — parallel dimension 2 of 2 ---
  - entity: Member
    dimension: access_status
    initial_state: NO_BADGE
    terminal_states: []
    transitions:
      - from: NO_BADGE
        to: ACTIVE
        trigger: "POST /members/{id}/badge-access with action == GRANT"
        actor: SiteManager | OperatorAdmin
        preconditions:
          - "member.access_status IN {NO_BADGE, REVOKED}"
          - "member.eligibility_status == ELIGIBLE"
          - "member has a LiabilityWaiver with status == SIGNED and expires_on >= clock today"
        side_effects:
          - "eligibility_status unchanged (independent dimension)."
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /members/{id}/badge-access with action == GRANT"
        actor: SiteManager | OperatorAdmin
        preconditions:
          - "member.access_status IN {NO_BADGE, REVOKED}"
          - "member.eligibility_status == ELIGIBLE"
          - "member has a LiabilityWaiver with status == SIGNED and expires_on >= clock today"
        side_effects:
          - "None beyond the access dimension."
        note: "Cycle ACTIVE -> REVOKED -> ACTIVE."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /members/{id}/badge-access with action == REVOKE, or system cascade from waiver expiry / eligibility LAPSE / TERMINATE"
        actor: SiteManager | OperatorAdmin | system
        preconditions:
          - "member.access_status == ACTIVE"
        side_effects:
          - "eligibility_status unchanged when the trigger is an explicit REVOKE."

  # -------------------------------------------------------- LiabilityWaiver ---
  - entity: LiabilityWaiver
    initial_state: SIGNED
    terminal_states: [EXPIRED, SUPERSEDED, REVOKED]
    transitions:
      - from: SIGNED
        to: SUPERSEDED
        trigger: "System, on POST /members/{id}/waivers for the same member"
        actor: system
        preconditions:
          - "waiver.status == SIGNED"
          - "A newer waiver row for the same member_id was just created"
        side_effects:
          - "member.current_waiver_id = the new waiver id; member.access_status is unchanged."
      - from: SIGNED
        to: EXPIRED
        trigger: "POST /operations/daily-readiness-run (system, step 4)"
        actor: system
        preconditions:
          - "waiver.status == SIGNED"
          - "waiver.expires_on < clock today"
        side_effects:
          - "member.current_waiver_id = null; when member.access_status == ACTIVE it moves to REVOKED."
      - from: SIGNED
        to: REVOKED
        trigger: "System, as a side effect of Member -> TERMINATED"
        actor: system
        preconditions:
          - "waiver.status == SIGNED"
          - "member.eligibility_status == TERMINATED"
        side_effects:
          - "member.current_waiver_id = null."

  # ----------------------------------------------------- ParticipationRecord --
  - entity: ParticipationRecord
    initial_state: COUNTED
    terminal_states: [VOIDED]
    transitions:
      - from: COUNTED
        to: VOIDED
        trigger: "POST /participation-records/{id}/void"
        actor: SiteManager
        preconditions:
          - "record.status == COUNTED"
          - "session.status IN {IN_PROGRESS, COMPLETED, CANCELLED_NO_COVER, CANCELLED_CLIENT, CANCELLED_FACILITY}"
        side_effects:
          - "COMPENSATION — Member.incentive_points_balance -= record.points_awarded, restoring the invariant incentive_points_balance == SUM(points_awarded WHERE status == COUNTED)."
          - "session.actual_attendance -= 1; offering.counted_participation_total -= 1"
          - "offering.provisional_attainment_pct and final_attainment_pct recomputed by calculations.program_attainment"
          - "Voiding does NOT re-open the weekly incentive cap for records already written; later check-ins recompute the cap from the surviving COUNTED rows."

  # ----------------------------------------------- IncidentReport (branching) --
  - entity: IncidentReport
    initial_state: REPORTED
    terminal_states: [CLOSED_NO_CLAIM, CLAIM_CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_REVIEW
        trigger: "POST /incident-reports/{id}/review"
        actor: SiteManager | ComplianceAuditor
        preconditions:
          - "incident.status == REPORTED"
          - "Segregation of duties: X-User-ID != incident.reported_by_staff_id"
        side_effects:
          - "incident.reviewed_by_user_id = X-User-ID"
          - "CASCADE LINK 1 — when severity == SERIOUS and cause_category == EQUIPMENT and asset_id is non-null, that FacilityAsset moves to OUT_OF_SERVICE with out_of_service_since = now."
          - "CASCADE LINK 2 — caused by the asset going OUT_OF_SERVICE: the asset's FacilityRoom moves OPEN -> RESTRICTED with open_deficiency_count += 1."
          - "CASCADE LINK 3 — caused by the room becoming RESTRICTED: that room's sessions in {SCHEDULED, STAFFED, STAFFING_AT_RISK} starting within constants.SESSION_LOCK_WINDOW_HOURS move to CANCELLED_FACILITY, releasing their assignments and decrementing each StaffMember.committed_minutes_current_period."
      - from: UNDER_REVIEW
        to: REPORTED
        trigger: "POST /incident-reports/{id}/return"
        actor: SiteManager | ComplianceAuditor
        preconditions:
          - "incident.status == UNDER_REVIEW"
        side_effects:
          - "incident.return_count += 1; incident.reviewed_by_user_id = null; equipment cascade effects are NOT reversed."
        note: "Return loop UNDER_REVIEW -> REPORTED -> UNDER_REVIEW may repeat."
      - from: UNDER_REVIEW
        to: CLAIM_FILED
        trigger: "POST /incident-reports/{id}/file-claim"
        actor: ComplianceAuditor
        preconditions:
          - "incident.status == UNDER_REVIEW"
          - "claim_reference is present and non-empty"
          - "incident.member_id is non-null"
          - "The subject member has a LiabilityWaiver row (any status) — waiver administration must be on file"
        side_effects:
          - "BRANCH FILED: incident.claim_reference stored."
      - from: UNDER_REVIEW
        to: CLOSED_NO_CLAIM
        trigger: "POST /incident-reports/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "incident.status == UNDER_REVIEW"
        side_effects:
          - "BRANCH NO_CLAIM: incident.closure_note stored; claim_reference stays null."
      - from: CLAIM_FILED
        to: CLAIM_CLOSED
        trigger: "POST /incident-reports/{id}/close"
        actor: ComplianceAuditor
        preconditions:
          - "incident.status == CLAIM_FILED"
        side_effects:
          - "incident.closure_note stored."

  # ------------------------------------------------- MonthlyInvoice (cyclic) --
  - entity: MonthlyInvoice
    initial_state: DRAFT
    terminal_states: [PAID, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUPERSEDED
        trigger: "System, on POST /monthly-invoices for the same (contract_id, period_month)"
        actor: system
        preconditions:
          - "invoice.status == DRAFT"
          - "A newer DRAFT invoice for the same contract and period was just created"
        side_effects:
          - "No ytd_billed_cents change (a DRAFT was never billed)."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /monthly-invoices/{id}/issue"
        actor: OperatorAdmin
        preconditions:
          - "invoice.status == DRAFT"
          - "contract.status IN {ACTIVE, SUSPENDED}"
          - "No other invoice for the same (contract_id, period_month) has status IN {ISSUED, DISPUTED, PAID}"
        side_effects:
          - "invoice.issued_at = now; contract.ytd_billed_cents += invoice.net_amount_cents."
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /monthly-invoices/{id}/dispute"
        actor: ClientSponsor
        preconditions:
          - "invoice.status == ISSUED"
          - "dispute_reason is present and non-empty"
          - "X-User-ID == invoice.contract_id (ClientSponsor identity)"
        side_effects:
          - "COMPENSATION — contract.ytd_billed_cents -= invoice.net_amount_cents; invoice.disputed_at = now."
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /monthly-invoices/{id}/rebill"
        actor: OperatorAdmin
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "invoice.rebill_count += 1; invoice.issued_at = null; every amount field is recomputed from current period data by calculations.monthly_invoice_amounts under the pinned fee_structure_snapshot."
        note: "Cycle DRAFT -> ISSUED -> DISPUTED -> DRAFT; the fiscal invariant contract.ytd_billed_cents == SUM(net_amount_cents of ISSUED/PAID invoices) holds after every lap."
      - from: ISSUED
        to: PAID
        trigger: "POST /monthly-invoices/{id}/pay"
        actor: ClientSponsor
        preconditions:
          - "invoice.status == ISSUED"
          - "X-User-ID == invoice.contract_id (ClientSponsor identity)"
        side_effects:
          - "invoice.paid_at = now; ytd_billed_cents unchanged (ISSUED already counted it)."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: waiver-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{id}/waivers"
    occ_field: "expected_member_version"
    description: |
      Recording a LiabilityWaiver against a Member whose version has advanced
      since the client last read it is rejected. A new waiver legitimately
      supersedes the member's prior SIGNED waiver (§1.2 LiabilityWaiver
      SIGNED -> SUPERSEDED), so a second writer working from a stale view would
      otherwise silently retire a waiver it never saw; the stale-version check
      turns that into a deterministic 412.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: invoice-draft-stale-contract
    parent_entity: ClientContract
    write_endpoint: "POST /monthly-invoices"
    occ_field: "expected_contract_version"
    description: |
      Drafting a MonthlyInvoice against a ClientContract whose version has
      advanced since the client last read it is rejected. A new DRAFT
      legitimately supersedes any existing DRAFT for the same period (§1.2
      MonthlyInvoice DRAFT -> SUPERSEDED), and contract cascades (suspension,
      penalty accrual, eligibility counts) bump contract.version between the
      read and the draft, so the stale-version check is what keeps a rebill from
      being computed against retired terms.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: session_labor_cost
    description: |
      Labor cost of a completed ProgramSession. Paid minutes are booked per
      StaffAssignment (a LEAD is paid the session's scheduled minutes plus a
      setup allowance; SUPPORT is paid the scheduled minutes), each assignment's
      cost is rounded to whole cents ON ITS OWN, and only then are the
      assignment costs summed into the session total. Rounding the aggregate
      minute count once produces a different answer and is wrong.
    trigger: "StaffAssignment creation (paid_minutes) and ProgramSession IN_PROGRESS -> COMPLETED (labor_cost_cents, session total)"
    inputs:
      - "ProgramSession.scheduled_minutes"
      - "StaffAssignment.role_on_session"
      - "StaffAssignment.paid_minutes"
      - "StaffMember.hourly_cost_cents"
      - "StaffAssignment.status (only CONFIRMED at completion time, later COMPLETED, participate)"
    algorithm: aggregation
    formula: |
      # step 1 — paid minutes, booked when the assignment row is created
      paid_minutes = session.scheduled_minutes + (LEAD_SETUP_MIN if role_on_session == "LEAD" else 0)

      # step 2 — per-assignment cost, ROUNDED INDIVIDUALLY (round_half_up, whole cents)
      for a in session.assignments where a.status in {CONFIRMED, COMPLETED}:
          a.labor_cost_cents = round_half_up(staff(a).hourly_cost_cents * a.paid_minutes / 60)

      # step 3 — session total is the sum of the ALREADY ROUNDED per-assignment costs
      session_labor_cents = SUM(a.labor_cost_cents)

      # WRONG (do not implement):
      #   round_half_up(hourly_cost_cents * SUM(paid_minutes) / 60)
      # Worked example — scheduled_minutes = 55, LEAD_SETUP_MIN = 15, both staff
      # at hourly_cost_cents = 4700:
      #   LEAD    : paid 70 min -> 4700*70/60 = 5483.33 -> 5483
      #   SUPPORT : paid 55 min -> 4700*55/60 = 4308.33 -> 4308
      #   correct session_labor_cents = 5483 + 4308 = 9791
      #   naive aggregate = round_half_up(4700*125/60) = round_half_up(9791.67) = 9792  (off by 1)
    constants:
      LEAD_SETUP_MIN: 15
    precision: "whole cents, round_half_up, applied per StaffAssignment before summation"

  - name: staff_readiness_index
    description: |
      Weighted 0–100 duty-readiness score for a StaffMember, combining
      credential currency, emergency-response drill recency and current workload
      commitment. Gates ProgramOffering activation at exactly
      ACTIVATION_MIN_READINESS.
    trigger: "StaffCredential verification/rejection/expiry, POST /staff-members/{id}/drills, POST /staff-members/{id}/duty-reinstate, and any change to committed_minutes_current_period"
    inputs:
      - "StaffMember.required_credential_types"
      - "StaffCredential.status per required type"
      - "StaffMember.last_drill_on"
      - "StaffMember.committed_minutes_current_period"
      - "logical clock today"
    algorithm: weighted_scoring
    formula: |
      # component 1 — credentials (worst required type wins)
      if any required type has no row, or its newest row is EXPIRED or REJECTED:
          credential_score = 0
      elif any required type's newest row is EXPIRING_SOON:
          credential_score = 60
      else:  # every required type VERIFIED
          credential_score = 100

      # component 2 — emergency response drill recency
      age_days = (today - last_drill_on) in days   # last_drill_on null => age_days = +inf
      if age_days <= DRILL_FRESH_DAYS:      drill_score = 100
      elif age_days <= DRILL_STALE_DAYS:    drill_score = 60
      else:                                 drill_score = 0

      # component 3 — workload headroom
      if committed_minutes_current_period <= COMMIT_SOFT_CAP_MIN:
          coverage_score = 100
      else:
          excess = committed_minutes_current_period - COMMIT_SOFT_CAP_MIN
          coverage_score = max(0, 100 - 5 * ceil(excess / 60))

      readiness_index = round_half_up(0.5*credential_score + 0.3*drill_score + 0.2*coverage_score)

      # Worked examples:
      #   all required VERIFIED, last_drill_on null, committed 5400
      #     -> 0.5*100 + 0.3*0 + 0.2*100 = 70   (exactly at ACTIVATION_MIN_READINESS -> activation allowed)
      #   all required VERIFIED, last_drill_on null, committed 6030
      #     -> coverage_score = 100 - 5*ceil(30/60) = 95
      #     -> 0.5*100 + 0.3*0 + 0.2*95 = 69    (one below the gate -> activation rejected)
    constants:
      DRILL_FRESH_DAYS: 90
      DRILL_STALE_DAYS: 180
      COMMIT_SOFT_CAP_MIN: 6000
      ACTIVATION_MIN_READINESS: 70
      WEIGHT_CREDENTIAL: 0.5
      WEIGHT_DRILL: 0.3
      WEIGHT_COVERAGE: 0.2
    precision: "integer 0–100, round_half_up applied once to the weighted sum"

  - name: program_attainment
    description: |
      Participation attainment of a ProgramOffering against its participation
      target. DUAL VARIANT — the provisional figure is forward-looking (it
      credits forecast attendance of sessions that have not happened yet) while
      the final figure is retrospective (only participation actually counted on
      COMPLETED sessions). Both are stored, on different fields, and they
      legitimately disagree.
    trigger: "ParticipationRecord creation/void, ProgramSession status changes (STAFFED, COMPLETED, any CANCELLED_*), ProgramOffering ACTIVATE, ProgramOffering CLOSE"
    inputs:
      - "ProgramOffering.participation_target"
      - "ProgramSession.status"
      - "ProgramSession.forecast_attendance"
      - "ProgramSession.actual_attendance"
      - "ParticipationRecord.status (only COUNTED participates)"
    algorithm: forward_looking
    formula: |
      counted_done = COUNT(ParticipationRecord r
                           WHERE r.status == COUNTED
                             AND session(r).offering_id == offering.id
                             AND session(r).status IN {IN_PROGRESS, COMPLETED})
      forecast_open = SUM(s.forecast_attendance
                          FOR s IN offering.sessions
                          WHERE s.status IN {SCHEDULED, STAFFED, STAFFING_AT_RISK})
      counted_final = COUNT(ParticipationRecord r
                            WHERE r.status == COUNTED
                              AND session(r).status == COMPLETED)

      provisional_attainment_pct = round_half_up((counted_done + forecast_open) * 100 / participation_target)
      final_attainment_pct       = round_half_up(counted_final * 100 / participation_target)

      # Cancelled sessions (CANCELLED_NO_COVER / CANCELLED_CLIENT / CANCELLED_FACILITY)
      # contribute to NEITHER figure: their forecast leaves the provisional numerator
      # the moment they are cancelled, which is why suspension drops attainment.
      # Worked example — participation_target = 40, one COMPLETED session with 14
      # COUNTED records, two open sessions forecasting 12 and 9:
      #   provisional = round_half_up((14+21)*100/40) = round_half_up(87.5) = 88
      #   final       = round_half_up(14*100/40)      = 35
    constants: {}
    precision: "integer percent, round_half_up; may exceed 100"
    variants:
      - name: provisional
        when: "Recomputed on every participation or session event while the offering is DRAFT/ACTIVE/PAUSED; stored on provisional_attainment_pct"
        difference: "Numerator = counted participation on IN_PROGRESS/COMPLETED sessions PLUS forecast_attendance of every still-open session"
      - name: final
        when: "Recomputed on session COMPLETE and frozen on ProgramOffering -> CLOSED; stored on final_attainment_pct"
        difference: "Numerator = counted participation on COMPLETED sessions only; forecasts and open sessions are ignored entirely"

  - name: incentive_points_award
    description: |
      Wellness incentive points granted for a participation check-in, with a
      streak bonus and a per-ISO-week ceiling. The award is clipped to the
      remaining weekly headroom, and the clipping is recorded on the record.
    trigger: "POST /participation-records (check-in)"
    inputs:
      - "Member.incentive_points_balance"
      - "COUNTED ParticipationRecord rows of the member in the current ISO week"
      - "Distinct check-in days of the member in the trailing STREAK_WINDOW_DAYS"
      - "logical clock now"
    algorithm: threshold
    formula: |
      week_start = Monday 00:00:00Z of the ISO week containing now
      week_points = SUM(points_awarded FOR r IN member.participation_records
                        WHERE r.status == COUNTED AND r.check_in_utc >= week_start)
      distinct_prior_days = COUNT(DISTINCT date(r.check_in_utc)
                                  FOR r IN member.participation_records
                                  WHERE r.status == COUNTED
                                    AND r.check_in_utc >= now - STREAK_WINDOW_DAYS
                                    AND date(r.check_in_utc) != date(now))
      candidate = BASE_POINTS_PER_CHECKIN + (STREAK_BONUS_POINTS if distinct_prior_days >= STREAK_MIN_DAYS else 0)
      headroom  = max(0, WEEKLY_POINTS_CAP - week_points)
      points_awarded      = min(candidate, headroom)
      points_capped       = (candidate > headroom)
      streak_bonus_applied = (distinct_prior_days >= STREAK_MIN_DAYS)
      Member.incentive_points_balance += points_awarded

      # Worked example — member already holds 50 COUNTED points this ISO week and
      # checked in on 3 distinct prior days inside the window:
      #   candidate = 10 + 5 = 15, headroom = 60 - 50 = 10
      #   -> points_awarded = 10, points_capped = true, streak_bonus_applied = true
      # INVARIANT: Member.incentive_points_balance == SUM(points_awarded WHERE status == COUNTED)
    constants:
      BASE_POINTS_PER_CHECKIN: 10
      STREAK_BONUS_POINTS: 5
      STREAK_MIN_DAYS: 3
      STREAK_WINDOW_DAYS: 7
      WEEKLY_POINTS_CAP: 60
    precision: "integer points, no rounding"

  - name: aed_readiness_status
    description: |
      Emergency-response readiness of an automated external defibrillator.
      Non-AED assets are NOT_APPLICABLE. A site needs at least one READY AED
      before an offering can be activated or a session started.
    trigger: "POST /facility-assets (create), POST /facility-assets/{id}/service-events, POST /operations/daily-readiness-run (step 5)"
    inputs:
      - "FacilityAsset.asset_type"
      - "FacilityAsset.status"
      - "FacilityAsset.pad_expiry_on"
      - "FacilityAsset.battery_expiry_on"
      - "FacilityAsset.last_inspection_on"
      - "logical clock today"
    algorithm: threshold
    formula: |
      if asset_type != "AED":
          readiness_status = NOT_APPLICABLE
      elif status != IN_SERVICE
           or pad_expiry_on <= today
           or battery_expiry_on <= today
           or last_inspection_on is null
           or (today - last_inspection_on) > AED_INSPECTION_MAX_AGE_DAYS:
          readiness_status = NOT_READY
      elif min(pad_expiry_on, battery_expiry_on) <= today + AED_CONSUMABLE_WARN_DAYS:
          readiness_status = PADS_EXPIRING
      else:
          readiness_status = READY

      # PADS_EXPIRING still counts as an operable AED for readiness gating?  NO —
      # only readiness_status == READY satisfies the AED gate in §1.4 (priority 12).
      # Boundary: last_inspection_on exactly AED_INSPECTION_MAX_AGE_DAYS ago -> still
      # eligible for READY; one day older -> NOT_READY.
    constants:
      AED_INSPECTION_MAX_AGE_DAYS: 30
      AED_CONSUMABLE_WARN_DAYS: 30
    precision: "enum, no numeric rounding"

  - name: equipment_downtime_credit
    description: |
      Client credit for equipment that sat out of service beyond a grace period
      during the invoice period. Days are counted per asset, the grace period is
      subtracted per asset (not once globally), and the per-day rate depends on
      the asset type.
    trigger: "POST /facility-assets/{id}/service-events with event_type == REPAIR_COMPLETE (accrues days), POST /monthly-invoices and rebill (consumes)"
    inputs:
      - "FacilityAsset.out_of_service_since"
      - "FacilityAsset.out_of_service_days_current_period"
      - "FacilityAsset.asset_type"
      - "MonthlyInvoice.period_month"
    algorithm: aggregation
    formula: |
      # accrual, on REPAIR_COMPLETE:
      out_of_service_days_current_period += ceil_days(today - date(out_of_service_since))

      # consumption, when the invoice is drafted or rebilled:
      downtime_credit_cents = SUM over assets of the contract of
          max(0, asset.out_of_service_days_current_period - DOWNTIME_GRACE_DAYS)
          * (AED_DOWNTIME_RATE_CENTS if asset.asset_type == "AED" else GENERAL_DOWNTIME_RATE_CENTS)

      # Worked example — one AED out 6 days, one CARDIO out 4 days:
      #   AED    : (6-3) * 1200 = 3600
      #   CARDIO : (4-3) *  250 =  250
      #   downtime_credit_cents = 3850
      # Grace is per asset: an asset out exactly DOWNTIME_GRACE_DAYS days credits 0.
    constants:
      DOWNTIME_GRACE_DAYS: 3
      AED_DOWNTIME_RATE_CENTS: 1200
      GENERAL_DOWNTIME_RATE_CENTS: 250
    precision: "whole cents; day counts are whole days, ceiling"

  - name: coverage_shortfall_penalty
    description: |
      Service-level penalty charged to the operator when sessions are cancelled
      for lack of covered staff. Applies to MANAGEMENT_FEE contracts only; on
      COST_PLUS contracts the penalty is always 0 because the client already
      bears actual cost.
    trigger: "ProgramSession -> CANCELLED_NO_COVER (accrual), POST /monthly-invoices and rebill (consumption)"
    inputs:
      - "ClientContract.fee_structure"
      - "ClientContract.management_fee_cents"
      - "ClientContract.uncovered_session_count"
    algorithm: threshold
    formula: |
      if fee_structure != "MANAGEMENT_FEE":
          penalty_cents = 0
      else:
          chargeable = max(0, uncovered_session_count - PENALTY_FREE_SESSIONS)
          per_session = round_half_up(management_fee_cents * PENALTY_RATE_PER_SESSION)
          cap         = round_half_up(management_fee_cents * PENALTY_CAP_PCT)
          penalty_cents = min(chargeable * per_session, cap)

      # Worked example — management_fee_cents = 40000:
      #   per_session = round_half_up(600.0) = 600, cap = round_half_up(2000.0) = 2000
      #   uncovered_session_count = 4 -> chargeable 3 -> 1800  (under the cap)
      #   uncovered_session_count = 6 -> chargeable 5 -> 3000 -> capped to 2000
      # CANCELLED_CLIENT and CANCELLED_FACILITY never touch uncovered_session_count.
    constants:
      PENALTY_FREE_SESSIONS: 1
      PENALTY_RATE_PER_SESSION: 0.015
      PENALTY_CAP_PCT: 0.05
    precision: "whole cents, round_half_up on the per-session amount and on the cap, independently"

  - name: monthly_invoice_amounts
    description: |
      Every money field of a MonthlyInvoice. DUAL VARIANT on
      fee_structure_snapshot: a MANAGEMENT_FEE invoice bills a flat fee reduced
      by service credits and coverage penalties; a COST_PLUS invoice bills actual
      labor plus program direct cost, marked up on a tiered ladder and then
      reduced by a volume credit whose own tier is keyed on the MARKED-UP gross,
      not on the pre-markup base.
    trigger: "POST /monthly-invoices (draft), POST /monthly-invoices/{id}/rebill"
    inputs:
      - "ClientContract.fee_structure (pinned into fee_structure_snapshot at draft time)"
      - "ClientContract.management_fee_cents | not_to_exceed_cents"
      - "ClientContract.ytd_billed_cents"
      - "StaffAssignment.labor_cost_cents of COMPLETED assignments whose session completed inside period_month"
      - "ProgramSession.direct_supply_cost_cents of COMPLETED sessions inside period_month"
      - "calculations.equipment_downtime_credit"
      - "calculations.coverage_shortfall_penalty"
    algorithm: tiered_pricing
    formula: |
      labor_subtotal_cents     = SUM(a.labor_cost_cents FOR COMPLETED assignments in period)
      program_direct_cost_cents = SUM(s.direct_supply_cost_cents FOR COMPLETED sessions in period)
      downtime_credit_cents    = equipment_downtime_credit(contract, period)

      if fee_structure_snapshot == "MANAGEMENT_FEE":
          admin_markup_cents   = 0
          volume_credit_cents  = 0
          coverage_penalty_cents = coverage_shortfall_penalty(contract)
          gross_amount_cents   = contract.management_fee_cents
          net_amount_cents     = gross_amount_cents - coverage_penalty_cents - downtime_credit_cents
          nte_capped           = false
      else:  # COST_PLUS
          coverage_penalty_cents = 0
          base = labor_subtotal_cents + program_direct_cost_cents
          # LADDER STEP 1 — markup tier keyed on `base`
          markup_rate = 0.12 if base <= MARKUP_TIER1_MAX
                        else (0.09 if base <= MARKUP_TIER2_MAX else 0.07)
          admin_markup_cents = round_half_up(base * markup_rate)
          gross_amount_cents = base + admin_markup_cents
          # LADDER STEP 2 — volume-credit tier keyed on the MARKED-UP gross
          credit_rate = 0.03 if gross_amount_cents >= CREDIT_TIER2_MIN
                        else (0.015 if gross_amount_cents >= CREDIT_TIER1_MIN else 0)
          volume_credit_cents = round_half_up(gross_amount_cents * credit_rate)
          net_amount_cents    = gross_amount_cents - volume_credit_cents - downtime_credit_cents
          # LADDER STEP 3 — annual not-to-exceed ceiling
          remaining = max(0, contract.not_to_exceed_cents - contract.ytd_billed_cents)
          if net_amount_cents > remaining:
              net_amount_cents = remaining
              nte_capped = true
          else:
              nte_capped = false

      # Worked COST_PLUS example — labor 9791, direct 23522, downtime credit 3850,
      # not_to_exceed 5000000, ytd_billed 0:
      #   base   = 33313  -> tier 3 (>30000) -> markup = round_half_up(2331.91) = 2332
      #   gross  = 35645  -> >= 35000 -> credit = round_half_up(534.675) = 535
      #   net    = 35645 - 535 - 3850 = 31260, nte_capped = false
      #   Keying the markup tier on labor alone (0.12) would give net 32901 — wrong.
      #   Keying the credit tier on base (33313 < 35000 -> 0) would give net 31795 — wrong.
      # Worked MANAGEMENT_FEE example — fee 40000, uncovered_session_count 4,
      # same downtime credit:
      #   gross 40000, penalty 1800, downtime 3850 -> net = 34350
    constants:
      MARKUP_TIER1_MAX: 15000
      MARKUP_TIER2_MAX: 30000
      MARKUP_TIER1_RATE: 0.12
      MARKUP_TIER2_RATE: 0.09
      MARKUP_TIER3_RATE: 0.07
      CREDIT_TIER1_MIN: 35000
      CREDIT_TIER2_MIN: 70000
      CREDIT_TIER1_RATE: 0.015
      CREDIT_TIER2_RATE: 0.03
    precision: "whole cents; round_half_up applied independently to admin_markup_cents and volume_credit_cents, never to the net"
    variants:
      - name: management_fee
        when: "fee_structure_snapshot == MANAGEMENT_FEE"
        difference: "gross is the contracted flat fee; admin markup and volume credit are structurally 0; coverage_shortfall_penalty is deducted; the not-to-exceed ceiling never applies"
      - name: cost_plus
        when: "fee_structure_snapshot == COST_PLUS"
        difference: "gross is actual cost plus a base-keyed tiered markup; a gross-keyed volume credit is deducted; coverage penalty is structurally 0; the annual not-to-exceed ceiling may clip net_amount_cents and set nte_capped"

  - name: contract_utilization_rollup
    description: |
      Utilization report backing program evolution. Reports participation rate
      against the client's contracted target, plus a per-member-class breakdown
      that is suppressed for small cohorts so individual health participation
      cannot be re-identified. Health metric notes are never included in any
      response of this endpoint.
    trigger: "GET /client-contracts/{id}/utilization-report"
    inputs:
      - "ClientContract.eligible_member_count"
      - "ClientContract.participation_target_pct"
      - "COUNTED ParticipationRecord rows inside the requested period"
      - "Member.member_class"
    algorithm: aggregation
    formula: |
      distinct_participants = COUNT(DISTINCT r.member_id
                                    WHERE r.status == COUNTED AND r.check_in_utc in period)
      participation_rate_pct = 0 if eligible_member_count == 0
                               else round_half_up(distinct_participants * 100 / eligible_member_count)
      target_variance_pct    = participation_rate_pct - participation_target_pct
      # per class in [EMPLOYEE, DEPENDENT, RETIREE]:
      cohort_participants = COUNT(DISTINCT r.member_id WHERE member(r).member_class == class ...)
      if cohort_participants < PRIVACY_MIN_COHORT:
          emit { member_class: class, suppressed: true, participant_count: null, check_in_count: null }
      else:
          emit { member_class: class, suppressed: false, participant_count: n, check_in_count: m }

      # Boundary: a cohort of exactly PRIVACY_MIN_COHORT distinct participants is
      # reported with real counts; PRIVACY_MIN_COHORT - 1 is suppressed with nulls.
      # ParticipationRecord.health_metrics_note is never projected here for any role.
    constants:
      PRIVACY_MIN_COHORT: 5
    precision: "integer percent, round_half_up; target_variance_pct may be negative"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending `priority`. The FIRST
# violated rule determines the response; later violations are never reported.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID and X-Role headers are present and X-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Identity is resolved before anything else. An unknown role string is unauthenticated, not unauthorized."

  - priority: 2
    category: authz
    check: "X-Role appears in the target endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role-based gate. Evaluated before existence, so a wrong role probing a non-existent id still gets 403."

  - priority: 3
    category: authz
    check: "For entity-backed roles, X-User-ID must equal the id of the entity the operation acts on or through: SiteManager/FitnessStaff -> a StaffMember of the target contract; ClientSponsor -> the target ClientContract; Member -> the target Member"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: ["POST /client-contracts/{id}/client-decision", "POST /monthly-invoices/{id}/dispute", "POST /monthly-invoices/{id}/pay", "POST /members/{id}/eligibility-decisions", "POST /members/{id}/waivers", "POST /participation-records", "POST /staff-assignments/{id}/confirm", "GET /client-contracts/{id}/utilization-report"]
    description: "Scope gate on top of the role gate: the right role acting on somebody else's resource is forbidden."

  - priority: 4
    category: authz
    check: "X-User-ID != StaffCredential.staff_member_id (segregation of duties)"
    error_id: ERR_SELF_VERIFICATION_FORBIDDEN
    http_status: 403
    applies_to: ["POST /staff-credentials/{id}/verify"]
    description: "A staff member may never verify or reject their own certification, even when their role otherwise permits verification."

  - priority: 5
    category: authz
    check: "X-User-ID != IncidentReport.reported_by_staff_id (segregation of duties)"
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: ["POST /incident-reports/{id}/review"]
    description: "The staff member who filed an incident may not be the one who reviews it."

  - priority: 6
    category: authz
    check: "Health-data projection: ParticipationRecord.health_metrics_note may be written only when Member.health_data_consent == true, and may be read back only by ComplianceAuditor or by the Member who owns the record"
    error_id: ERR_HEALTH_DATA_FORBIDDEN
    http_status: 403
    applies_to: ["POST /participation-records", "GET /participation-records", "GET /participation-records/{id}"]
    description: "Privacy boundary around health data. SiteManager, FitnessStaff, OperatorAdmin and ClientSponsor always receive health_metrics_note as null; supplying the field for a non-consenting member is a hard 403 rather than a silent drop."

  - priority: 7
    category: existence
    check: "Every {id} in the path resolves to an existing row of the expected entity"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_PARTICIPATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "Path-level existence, entity-specific error id."

  - priority: 8
    category: validation
    check: "Request body shape: required fields present, types correct, enums in range, integers within declared bounds, dates ISO-8601, term_end_on > term_start_on, scheduled_end_utc > scheduled_start_utc, pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    description: "Structural validation. Fields with source computed/system supplied by the client are ignored, not rejected."

  - priority: 9
    category: existence
    check: "Every foreign key supplied in the body resolves to an existing row of the referenced entity"
    error_id: "ERR_CONTRACT_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_ASSET_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_MEMBER_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /staff-members", "POST /staff-credentials", "POST /facility-rooms", "POST /facility-assets", "POST /program-offerings", "POST /program-sessions", "POST /staff-assignments", "POST /members", "POST /participation-records", "POST /incident-reports", "POST /monthly-invoices"]
    description: "Body-level referential existence, checked after shape validation so a malformed id is a 400 and a well-formed unknown id is a 404."

  - priority: 10
    category: occ
    check: "expected_member_version == Member.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: ["POST /members/{id}/waivers"]
    description: "§1.2.1 rule waiver-create-stale-member. Checked before any state or business rule so a stale writer can never observe downstream errors."

  - priority: 11
    category: occ
    check: "expected_contract_version == ClientContract.version"
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: ["POST /monthly-invoices"]
    description: "§1.2.1 rule invoice-draft-stale-contract."

  - priority: 12
    category: state
    check: "The subject entity is in a state from which the requested transition exists in §1.2"
    error_id: "ERR_INVALID_STATE_TRANSITION | ERR_SESSION_NOT_STAFFED | ERR_SESSION_NOT_IN_PROGRESS | ERR_CONTRACT_NOT_ACTIVE | ERR_OFFERING_NOT_ACTIVE | ERR_CREDENTIAL_NOT_PENDING | ERR_CREDENTIAL_NOT_RENEWABLE | ERR_INCIDENT_NOT_UNDER_REVIEW | ERR_INVOICE_NOT_DRAFT | ERR_INVOICE_NOT_ISSUED | ERR_INVOICE_NOT_DISPUTED | ERR_AMENDMENT_NOT_ALLOWED | ERR_OPEN_SESSIONS | ERR_CONTRACT_NOT_PENDING"
    http_status: 409
    applies_to: "all action endpoints, plus POST /participation-records (the session must be IN_PROGRESS to accept a check-in)"
    description: |
      State gate. Deliberately ABOVE every business_safety rule: starting a
      session that is not STAFFED returns ERR_SESSION_NOT_STAFFED even when the
      site also has no READY AED (priority 15). A check-in against a session
      that is not IN_PROGRESS returns ERR_SESSION_NOT_IN_PROGRESS.

  - priority: 13
    category: state
    check: "The subject entity is not in one of its §1.2 terminal states"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "all action endpoints"
    description: "Terminal lockdown: TERMINATED/WITHDRAWN contracts, CLOSED offerings, any CANCELLED_*/COMPLETED session, RELEASED/COMPLETED assignments, TERMINATED members, PAID/SUPERSEDED invoices, VOIDED participation records and CLOSED incidents accept no further transitions."

  - priority: 14
    category: business_safety
    check: "The lead StaffMember holds ProgramOffering.required_credential_type in status VERIFIED or EXPIRING_SOON"
    error_id: ERR_CREDENTIAL_NOT_VERIFIED
    http_status: 422
    applies_to: ["POST /program-offerings/{id}/status-changes", "POST /staff-assignments"]
    description: "Certification verification gate for programming."

  - priority: 15
    category: business_safety
    check: "The contract has at least one FacilityAsset with asset_type == AED and readiness_status == READY"
    error_id: ERR_AED_NOT_READY
    http_status: 422
    applies_to: ["POST /program-offerings/{id}/status-changes", "POST /program-sessions/{id}/status-changes"]
    description: "Emergency-response readiness gate. PADS_EXPIRING does not satisfy it."

  - priority: 16
    category: business_safety
    check: "FacilityRoom.room_state == OPEN"
    error_id: ERR_ROOM_NOT_OPEN
    http_status: 422
    applies_to: ["POST /program-sessions", "POST /program-sessions/{id}/status-changes"]
    description: "Cleanliness and inspection standards gate: RESTRICTED or CLOSED rooms host nothing."

  - priority: 17
    category: business_safety
    check: "The member has a LiabilityWaiver with status == SIGNED and expires_on >= clock today"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: ["POST /participation-records", "POST /members/{id}/badge-access"]
    description: |
      Liability waiver gate. Deliberately ABOVE the capacity rule (priority 24):
      an unwaived member checking into a full session gets ERR_WAIVER_REQUIRED,
      not ERR_SESSION_CAPACITY_EXCEEDED.

  - priority: 18
    category: business_safety
    check: "StaffMember.duty_status == ACTIVE_DUTY"
    error_id: ERR_STAFF_NOT_ON_DUTY
    http_status: 422
    applies_to: ["POST /staff-assignments", "POST /staff-assignments/{id}/confirm", "POST /program-offerings"]
    description: "Suspended or offboarded staff cannot be assigned, confirmed, or made an offering lead."

  - priority: 19
    category: business_safety
    check: "StaffMember.readiness_index >= constants.ACTIVATION_MIN_READINESS for the lead of the offering being activated"
    error_id: ERR_READINESS_BELOW_THRESHOLD
    http_status: 422
    applies_to: ["POST /program-offerings/{id}/status-changes"]
    description: "Boundary rule: exactly 70 passes, 69 fails."

  - priority: 20
    category: business_referential
    check: "All entities referenced by a request belong to the same ClientContract (room, offering, staff, member, asset)"
    error_id: ERR_CROSS_CONTRACT_REFERENCE
    http_status: 422
    applies_to: ["POST /program-sessions", "POST /staff-assignments", "POST /participation-records", "POST /incident-reports", "POST /facility-assets"]
    description: "Multi-site operator: nothing may straddle two client contracts."

  - priority: 21
    category: business_referential
    check: "A DEPENDENT Member has a non-null sponsor_member_id whose Member has member_class == EMPLOYEE and eligibility_status == ELIGIBLE; EMPLOYEE and RETIREE members must have sponsor_member_id == null"
    error_id: ERR_SPONSOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /members", "POST /members/{id}/eligibility-decisions"]
    description: "Dependent eligibility derives from the sponsoring employee."

  - priority: 22
    category: business_temporal
    check: |
      Room occupancy conflict — treating each session as the CLOSED interval
      [scheduled_start_utc, scheduled_end_utc] EXPANDED by
      constants.ROOM_TURNOVER_BUFFER_MIN on the end side, no two non-cancelled
      sessions in the same FacilityRoom may intersect. Exact predicate against
      every existing session of that room whose status is not CANCELLED_*:
        conflict  <=>  new.start < existing.end + BUFFER
                       AND existing.start < new.end + BUFFER
      Consequences the implementation must reproduce: two sessions that merely
      touch on the raw endpoints (new.start == existing.end) DO conflict, because
      the buffer keeps the room occupied; a gap exactly equal to the buffer
      (new.start == existing.end + BUFFER) does NOT conflict.
    error_id: ERR_ROOM_TIME_CONFLICT
    http_status: 409
    applies_to: ["POST /program-sessions"]
    description: "Rooms need cleaning turnover between bookings, so room intervals are closed and buffered."

  - priority: 23
    category: business_temporal
    check: |
      Staff availability conflict — treating each assignment as the HALF-OPEN
      interval [session.scheduled_start_utc, session.scheduled_end_utc) with NO
      buffer, one StaffMember may not hold two assignments whose intervals
      intersect. Exact predicate against the staff member's existing assignments
      whose status IN {ASSIGNED, CONFIRMED, VACANT_NEEDS_COVER}:
        conflict  <=>  new.start < existing.end AND existing.start < new.end
      Consequence: back-to-back sessions (previous end == next start) are
      allowed, and LEAD_SETUP_MIN is NOT part of the occupied interval even
      though it is part of paid_minutes.
    error_id: ERR_STAFF_TIME_CONFLICT
    http_status: 409
    applies_to: ["POST /staff-assignments"]
    description: "Deliberately different interval semantics from the room rule: half-open and unbuffered, so adjacency is legal for people but illegal for rooms."

  - priority: 24
    category: business_temporal
    check: "scheduled_start_utc >= clock now AND the session's date range lies inside [contract.term_start_on, contract.term_end_on]"
    error_id: ERR_SESSION_OUT_OF_TERM
    http_status: 422
    applies_to: ["POST /program-sessions"]
    description: "No backdated sessions and nothing outside the contract term."

  - priority: 25
    category: business_constraint
    check: "COUNT(COUNTED ParticipationRecord of the session) < ProgramOffering.max_participants_per_session"
    error_id: ERR_SESSION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /participation-records"]
    description: "Aggregate constraint: voided records free a slot."

  - priority: 26
    category: business_constraint
    check: "Member.member_class IN ProgramOffering.eligible_member_classes"
    error_id: ERR_MEMBER_CLASS_NOT_ELIGIBLE
    http_status: 422
    applies_to: ["POST /participation-records"]
    description: "Program scope: some offerings are employee-only, some include dependents and retirees."

  - priority: 27
    category: business_constraint
    check: "Member.access_status == ACTIVE and Member.eligibility_status == ELIGIBLE at check-in time"
    error_id: ERR_ACCESS_NOT_ACTIVE
    http_status: 422
    applies_to: ["POST /participation-records"]
    description: "Access control integration: a revoked badge blocks participation even for an eligible member."

  - priority: 28
    category: business_constraint
    check: "No existing COUNTED ParticipationRecord for the same (member_id, session_id)"
    error_id: ERR_DUPLICATE_CHECK_IN
    http_status: 409
    applies_to: ["POST /participation-records"]
    description: "One counted check-in per member per session; a voided record may be replaced."

  - priority: 29
    category: business_fiscal
    check: "Fee terms match fee_structure: management_fee_cents present and not_to_exceed_cents null for MANAGEMENT_FEE; the reverse for COST_PLUS"
    error_id: ERR_FEE_TERMS_INVALID
    http_status: 422
    applies_to: ["POST /client-contracts", "POST /client-contracts/{id}/amendments", "POST /client-contracts/{id}/submit"]
    description: "Commercial model consistency."

  - priority: 30
    category: business_fiscal
    check: "No other MonthlyInvoice for the same (contract_id, period_month) is in status ISSUED, DISPUTED or PAID"
    error_id: ERR_INVOICE_PERIOD_CONFLICT
    http_status: 409
    applies_to: ["POST /monthly-invoices", "POST /monthly-invoices/{id}/issue"]
    description: "A period may hold many DRAFT/SUPERSEDED invoices but only one live billed one."

  - priority: 31
    category: business_fiscal
    check: "For COST_PLUS contracts, max(0, not_to_exceed_cents - ytd_billed_cents) > 0 when issuing"
    error_id: ERR_NTE_EXHAUSTED
    http_status: 422
    applies_to: ["POST /monthly-invoices/{id}/issue"]
    description: "The annual ceiling is exhausted: net_amount_cents would clip to zero, so issuing is refused outright."

  - priority: 32
    category: business_fiscal
    check: "No MonthlyInvoice of the contract is in status DRAFT or DISPUTED when terminating"
    error_id: ERR_OPEN_INVOICES
    http_status: 409
    applies_to: ["POST /client-contracts/{id}/service-status"]
    description: "Termination requires a clean billing position; suspension does not."

  # ---- endpoint-local integrity checks -------------------------------------
  # Priorities 33-41 are the tail of the single total order: they are evaluated
  # only after every rule above them has passed on the same request. Each row
  # below states the earlier rows it can collide with, so the winning error_id
  # is never ambiguous.
  - priority: 33
    category: business_safety
    check: "The contract has >= 1 StaffMember whose role_type == SITE_MANAGER and duty_status == ACTIVE_DUTY at submit time"
    error_id: ERR_SITE_MANAGER_REQUIRED
    http_status: 422
    applies_to: ["POST /client-contracts/{id}/submit"]
    description: "Staffing-model gate on submission. Collides with priority 12 (contract not DRAFT) and priority 29 (fee terms incomplete); both outrank it, so a DRAFT MANAGEMENT_FEE contract with neither a fee nor a site manager returns ERR_FEE_TERMS_INVALID."
  - priority: 34
    category: business_safety
    check: "file-claim requires incident.member_id non-null AND that member to have at least one LiabilityWaiver row in any status"
    error_id: ERR_CLAIM_SUBJECT_REQUIRED
    http_status: 422
    applies_to: ["POST /incident-reports/{id}/file-claim"]
    description: "Liability-waiver administration gate on claim filing. Collides with priorities 12/13 (incident not UNDER_REVIEW, terminal state); both outrank it."
  - priority: 35
    category: business_referential
    check: "site_code is not already used by a ClientContract whose status != WITHDRAWN"
    error_id: ERR_SITE_CODE_CONFLICT
    http_status: 409
    applies_to: ["POST /client-contracts"]
    description: "Site-level uniqueness. WITHDRAWN contracts release their site_code; amendments inherit the predecessor's site_code and are therefore exempt. Collides with priority 8 (shape) and priority 29 (fee terms); both outrank it."
  - priority: 36
    category: business_referential
    check: "asset_tag is not already used by another FacilityAsset of the same contract_id"
    error_id: ERR_ASSET_TAG_CONFLICT
    http_status: 409
    applies_to: ["POST /facility-assets"]
    description: "Asset-tag uniqueness is scoped per contract, so two sites may both hold AED-01. Collides with priority 9 (contract/room not found) and priority 20 (room belongs to another contract); both outrank it."
  - priority: 37
    category: business_referential
    check: "The target session has no other StaffAssignment with role_on_session == LEAD in status IN {ASSIGNED, CONFIRMED}"
    error_id: ERR_DUPLICATE_LEAD_ASSIGNMENT
    http_status: 409
    applies_to: ["POST /staff-assignments"]
    description: "Exactly one live LEAD per session; a RELEASED or VACANT_NEEDS_COVER LEAD frees the slot for a replacement. Collides with priorities 14/18 (credential, duty), 20 (cross-contract) and 23 (staff time conflict); all outrank it, so a second LEAD who is also double-booked returns ERR_STAFF_TIME_CONFLICT."
  - priority: 38
    category: business_constraint
    check: "forecast_attendance <= FacilityRoom.max_occupancy of the target room"
    error_id: ERR_ROOM_OCCUPANCY_EXCEEDED
    http_status: 422
    applies_to: ["POST /program-sessions"]
    description: "Physical room capacity at scheduling time; ProgramOffering.max_participants_per_session is enforced separately by priority 8 as a shape bound. Collides with priorities 16 (room not OPEN), 20, 22 (room time conflict) and 24 (out of term); all outrank it."
  - priority: 39
    category: business_constraint
    check: "GRANT requires Member.eligibility_status == ELIGIBLE"
    error_id: ERR_ELIGIBILITY_NOT_VERIFIED
    http_status: 422
    applies_to: ["POST /members/{id}/badge-access"]
    description: "Access-control integration gate on the badge dimension. Collides with priority 17 (ERR_WAIVER_REQUIRED), which outranks it: a PENDING_VERIFICATION member with no waiver returns ERR_WAIVER_REQUIRED."
  - priority: 40
    category: business_safety
    check: "Credential decision integrity: an ACCEPT decision requires credential.expires_on > clock today (else ERR_CREDENTIAL_EXPIRED_ON_FILE); a REJECT decision requires a non-empty rejection_reason (else ERR_REJECTION_REASON_REQUIRED); a renew requires the supplied expires_on > clock today (else ERR_RENEWAL_DATE_INVALID)"
    error_id: ERR_CREDENTIAL_EXPIRED_ON_FILE | ERR_REJECTION_REASON_REQUIRED | ERR_RENEWAL_DATE_INVALID
    http_status: 422
    applies_to: ["POST /staff-credentials/{id}/verify", "POST /staff-credentials/{id}/renew"]
    description: "Certification-verification integrity. Collides with priority 4 (self-verification) and priority 12 (ERR_CREDENTIAL_NOT_PENDING / ERR_CREDENTIAL_NOT_RENEWABLE); both outrank it."
  - priority: 41
    category: business_temporal
    check: "START requires now >= session.scheduled_start_utc - constants.SESSION_START_GRACE_MIN minutes"
    error_id: ERR_SESSION_START_TOO_EARLY
    http_status: 422
    applies_to: ["POST /program-sessions/{id}/status-changes"]
    description: "Grace-window gate on session start; applies only to action == START. Collides with priority 12 (ERR_SESSION_NOT_STAFFED), 15 (ERR_AED_NOT_READY) and 16 (ERR_ROOM_NOT_OPEN); all outrank it."

# =============================================================================
# §1.5 API Endpoint Table
#   Flat topology: every collection hangs directly off the root (api_prefix "/").
#   Two sub-resource reads exist for reverse reachability of the two children
#   that have no own collection route (StaffCredential, LiabilityWaiver).
# =============================================================================
endpoints:

  # ------------------------------------------------------------ reads: contract
  - method: GET
    path: "/client-contracts"
    description: "List client contracts, filterable by status, fee structure, client and amendment lineage."
    roles: [OperatorAdmin, ComplianceAuditor, ClientSponsor, SiteManager]
    code: 200
    input: ["status?", "fee_structure?", "client_name?", "supersedes_contract_id?", "limit?", "offset?"]
    output: ClientContract[]
    side_effects: []

  - method: GET
    path: "/client-contracts/{id}"
    description: "Fetch one client contract with its computed counters."
    roles: [OperatorAdmin, ComplianceAuditor, ClientSponsor, SiteManager]
    code: 200
    input: []
    output: ClientContract
    side_effects: []

  - method: GET
    path: "/client-contracts/{id}/utilization-report"
    description: "Utilization report for a period: participation rate vs the client's target, plus a per-member-class breakdown with small-cohort suppression. Never exposes health_metrics_note."
    roles: [OperatorAdmin, ClientSponsor, ComplianceAuditor]
    code: 200
    input: [period_month]
    output: { period_month: string, eligible_member_count: integer, distinct_participants: integer, participation_rate_pct: integer, participation_target_pct: integer, target_variance_pct: integer, class_breakdown: array, suppressed_cohort_count: integer }
    side_effects: ["Runs calculations.contract_utilization_rollup (read-only)"]

  # --------------------------------------------------------------- reads: staff
  - method: GET
    path: "/staff-members"
    description: "List staff members, filterable by contract, duty status and role."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: ["contract_id?", "duty_status?", "role_type?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: GET
    path: "/staff-members/{id}"
    description: "Fetch one staff member including readiness_index and committed_minutes_current_period."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members/{id}/credentials"
    description: "Certifications held by a staff member (reverse reachability for StaffCredential.staff_member_id)."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: ["status?", "credential_type?", "limit?", "offset?"]
    output: StaffCredential[]
    side_effects: []

  - method: GET
    path: "/staff-credentials/{id}"
    description: "Fetch one certification record with its verification trail."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: []
    output: StaffCredential
    side_effects: []

  # ------------------------------------------------------------ reads: facility
  - method: GET
    path: "/facility-rooms"
    description: "List rooms of a site with inspection posture."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor, ClientSponsor]
    code: 200
    input: ["contract_id?", "room_state?", "room_type?", "limit?", "offset?"]
    output: FacilityRoom[]
    side_effects: []

  - method: GET
    path: "/facility-rooms/{id}"
    description: "Fetch one room with its last inspection result."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor, ClientSponsor]
    code: 200
    input: []
    output: FacilityRoom
    side_effects: []

  - method: GET
    path: "/facility-assets"
    description: "List equipment and AEDs, filterable by contract, room, type, service status and readiness."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: ["contract_id?", "room_id?", "asset_type?", "status?", "readiness_status?", "limit?", "offset?"]
    output: FacilityAsset[]
    side_effects: []

  - method: GET
    path: "/facility-assets/{id}"
    description: "Fetch one asset including AED readiness and accrued downtime days."
    roles: [OperatorAdmin, SiteManager, ComplianceAuditor]
    code: 200
    input: []
    output: FacilityAsset
    side_effects: []

  # --------------------------------------------------------- reads: programming
  - method: GET
    path: "/program-offerings"
    description: "List program offerings, filterable by contract, lead staff, status and program type."
    roles: [OperatorAdmin, SiteManager, ClientSponsor, ComplianceAuditor]
    code: 200
    input: ["contract_id?", "lead_staff_id?", "status?", "program_type?", "limit?", "offset?"]
    output: ProgramOffering[]
    side_effects: []

  - method: GET
    path: "/program-offerings/{id}"
    description: "Fetch one offering with both attainment figures."
    roles: [OperatorAdmin, SiteManager, ClientSponsor, ComplianceAuditor]
    code: 200
    input: []
    output: ProgramOffering
    side_effects: []

  - method: GET
    path: "/program-offerings/{id}/attainment"
    description: "Computed read: provisional (forward-looking) and final (retrospective) attainment side by side, with the components each variant used."
    roles: [OperatorAdmin, SiteManager, ClientSponsor, ComplianceAuditor]
    code: 200
    input: []
    output: { offering_id: string, participation_target: integer, counted_done: integer, forecast_open: integer, counted_final: integer, provisional_attainment_pct: integer, final_attainment_pct: integer, coverage_gap_count: integer }
    side_effects: ["Runs calculations.program_attainment (read-only)"]

  - method: GET
    path: "/program-sessions"
    description: "List sessions, filterable by offering, room, status and scheduling window."
    roles: [OperatorAdmin, SiteManager, FitnessStaff, ClientSponsor, ComplianceAuditor]
    code: 200
    input: ["offering_id?", "room_id?", "status?", "starts_after?", "starts_before?", "limit?", "offset?"]
    output: ProgramSession[]
    side_effects: []

  - method: GET
    path: "/program-sessions/{id}"
    description: "Fetch one session with attendance and cancellation detail."
    roles: [OperatorAdmin, SiteManager, FitnessStaff, ClientSponsor, ComplianceAuditor]
    code: 200
    input: []
    output: ProgramSession
    side_effects: []

  - method: GET
    path: "/staff-assignments"
    description: "List staffing assignments, filterable by session, staff member and status."
    roles: [OperatorAdmin, SiteManager, FitnessStaff, ComplianceAuditor]
    code: 200
    input: ["session_id?", "staff_member_id?", "status?", "role_on_session?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: GET
    path: "/staff-assignments/{id}"
    description: "Fetch one assignment with paid minutes and computed labor cost."
    roles: [OperatorAdmin, SiteManager, FitnessStaff, ComplianceAuditor]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: []

  # -------------------------------------------------------------- reads: member
  - method: GET
    path: "/members"
    description: "List members, filterable by contract, sponsor, class and both state dimensions."
    roles: [OperatorAdmin, SiteManager, ClientSponsor, ComplianceAuditor]
    code: 200
    input: ["contract_id?", "sponsor_member_id?", "member_class?", "eligibility_status?", "access_status?", "limit?", "offset?"]
