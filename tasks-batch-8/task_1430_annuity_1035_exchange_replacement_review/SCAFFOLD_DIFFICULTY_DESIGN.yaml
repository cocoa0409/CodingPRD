            - { call: "POST /cases/${case_a}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_a}/approve", payload: { rationale: "approved" }, as: Principal, as_user_id: "prin-1" }
            - { call: "POST /cases/${case_a}/request_funds", payload: {}, as: OperationsDesk, captures: { t_a: $.data.id } }
            - { call: "POST /transfers/${t_a}/mark_received", payload: {}, as: OperationsDesk }
            - { call: "POST /cases/${case_a}/confirm_delivery", payload: {}, as: OperationsDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /cases/${case_a}/complete", payload: {}, as: OperationsDesk }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
