  - section: errors
    instances:
      - name: an_expulsion_recommendation_notation_can_never_be_expunged_even_after_completion
        claim_type: Violation → Error
        grounds:
          - validations[priority=45]
          - validations[priority=61]
          - errors.ERR_NOTATION_NOT_EXPUNGEABLE
          - calculations.notation_expungement_eligibility
          - calculations.case_severity_index
          - global_constants.NOTATION_MIN_RANK
        distinguishing_aspect: |
          The only route to ERR_NOTATION_NOT_EXPUNGEABLE is a rank-8 EXPULSION_RECOMMENDATION, and
          reaching rank 8 requires stacking the whole escalation machinery: CONTRACT_CHEATING (base 40)
          plus SEED-B evidence (81.50, contributing 32.60) plus two upheld priors in two DIFFERENT other
          courses (cross_course_pattern_points 10) gives provisional 82.60, which is above the
          ESCALATION_PIVOT of 50.0 and so draws 26 escalation points for a severity_index of 108.60 -
          past the >= 100 tier boundary. Because ELIGIBILITY_DAYS[8] is null the notation's
          expungement_eligible_at stays null even after the sanction is COMPLETED, and the request is
          refused by priority 61 rather than by priority 45: 45's condition is qualified to fire only
          when eligible_at is null BECAUSE the sanction is not COMPLETED, which is not the case here.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; ENGL with reporter Rita trained, chair Cora trained, five panelists pan1..pan5, ROOM-A, student Sam"
            - "two legacy CLOSED RESPONSIBLE cases backfilled on HIST-110 (decided 2025-06-01) and PHIL-220 (decided 2025-09-01), giving prior_upheld_count 2 and distinct_other_course_codes 2"
            - "a fresh CONTRACT_CHEATING report on ENGL-201 with SEED-B evidence (SIMILARITY_REPORT 45.00 over 4 pages plus a 1-page PROCTOR_LOG)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IntegrityOfficer
            - call: "POST /integrity/departments"
              payload: { code: "ENGL", name: "English", enrolled_student_count: 2000, faculty_headcount: 8 }
              as: IntegrityOfficer
