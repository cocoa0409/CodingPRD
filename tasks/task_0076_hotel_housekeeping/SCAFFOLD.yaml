# =============================================================================
# Task 0076 — Hotel Housekeeping System
# =============================================================================

scenario: |
  Hotel housekeeping system: room status management with room-status classification
  (vacant-clean/vacant-dirty/occupied-clean/occupied-dirty/out-of-order/inspected),
  real-time status synchronization with PMS, manual status correction,
  status-change history, and status-discrepancy alert; cleaning task auto-dispatch
  with task-source aggregation (check-out/stayover/scheduled), housekeeper-zone
  assignment, workload balancing, task-priority rules (VIP/early-check-in/expedited),
  task-acceptance and reassignment, and task-status tracking; inspection and
  acceptance with supervisor inspection task, inspection checklist, pass/fail
  outcome, rework dispatch on fail, random-sampling rules, and inspection-record
  archiving; minibar consumption record with item-inventory configuration,
  consumption entry by housekeeper, guest-self-report handling, charge-posting
  to folio, replenishment trigger, and discrepancy-investigation workflow;
  maintenance reporting with housekeeper-reported issue, issue-category and
  severity classification, dispatch to engineering, room-isolation (out-of-order)
  handling during repair, repair-completion verification, and re-cleaning trigger;
  linen replacement tracking with linen-type inventory, replacement-cycle rules
  (per-stay/scheduled/on-request), used-linen collection record, laundry-handover
  and return record, and loss-and-damage handling; event-driven synchronization
  with PMS, payment, engineering, and laundry systems; audit logging for status
  changes and consumption records.

domain_name: hotel-housekeeping
api_prefix: /rooms

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - selector_policy
    - dual_variant_calculation
    - compliance_audit
    - scheduled_deferred_actions

  entity_topology: hybrid
  # Room is a top-level entity with nested status events. Cleaning tasks,
  # maintenance tickets, minibar consumption, and linen movements are peer
  # entities that FK back to Room and Housekeeper. MinibarItem and LinenType
  # are catalog configurations referenced by consumption/movement records.

  state_machine_shape: branching
  # CleaningTask, MaintenanceTicket, MinibarConsumption all have fork-join /
  # cyclic shapes (rework loops, dispute branches). Room status is cyclic.

  relationship_patterns:
    - one_to_many        # Room → CleaningTask, Room → MaintenanceTicket
    - cross_aggregate    # CleaningTask references Housekeeper across aggregates
    - self_referential   # CleaningTask.parent_task_id (rework chain)

  role_model: peer_roles
  # Housekeeper, Supervisor, Engineer, FrontDesk own different resource types
  # with overlapping read access. Supervisor has elevated authority on
  # inspection + reassignment but does not subsume Engineer.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim from §1.0)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: room_number, type: string, source: input, description: "Hotel room number (e.g., 1204); unique across all Room entities", constraints: "non-empty; immutable after creation" }
      - { name: zone_code, type: string, source: input, description: "Housekeeping zone (e.g., FLOOR_12_NORTH); used by zone-based task dispatch" }
      - { name: room_type, type: enum, source: input, description: "STANDARD | SUITE | PRESIDENTIAL", constraints: "STANDARD | SUITE | PRESIDENTIAL" }
      - { name: vip_flag, type: boolean, source: input, default: false, description: "True for rooms flagged VIP by PMS; lifts cleaning task priority by VIP_PRIORITY_BONUS" }
      - { name: pms_occupancy, type: enum, source: input, description: "Last-synced PMS occupancy: VACANT | OCCUPIED | DUE_OUT | NO_SHOW", constraints: "VACANT | OCCUPIED | DUE_OUT | NO_SHOW" }
      - { name: pms_synced_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; updated on POST /_events/pms-sync" }
      - { name: status, type: enum, source: system, description: "Housekeeping status; see §1.2 Room state machine", constraints: "VACANT_CLEAN | VACANT_DIRTY | OCCUPIED_CLEAN | OCCUPIED_DIRTY | INSPECTED | OUT_OF_ORDER" }
      - { name: discrepancy_flag, type: boolean, source: computed, description: "True iff (pms_occupancy in {OCCUPIED, DUE_OUT} XOR status in {OCCUPIED_CLEAN, OCCUPIED_DIRTY, INSPECTED}); recomputed on PMS sync and on every Room.status mutation" }
      - { name: out_of_order_ticket_id, type: string, source: system, default: null, description: "Active MaintenanceTicket.id that put the room OUT_OF_ORDER, null otherwise" }
      - { name: last_cleaned_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC timestamp of last InspectionRecord with outcome PASS for this room" }

  - name: Housekeeper
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Stable employee code, unique across Housekeeper entities" }
      - { name: display_name, type: string, source: input, description: "Display name shown on rosters" }
      - { name: assigned_zone, type: string, source: input, description: "Zone_code this housekeeper is rostered for; cleaning auto-dispatch prefers same-zone housekeepers" }
      - { name: shift_status, type: enum, source: system, default: "OFF_SHIFT", description: "OFF_SHIFT | ON_SHIFT", constraints: "OFF_SHIFT | ON_SHIFT" }
      - { name: provisional_workload_minutes, type: integer, source: computed, description: "Sum over CleaningTask.estimated_minutes for tasks with assigned_housekeeper_id = this id AND status IN {ASSIGNED, ACCEPTED, IN_PROGRESS, SUBMITTED}" }
      - { name: realized_workload_minutes, type: integer, source: computed, description: "Sum over CleaningTask.actual_minutes for tasks with assigned_housekeeper_id = this id AND status = COMPLETED today (since 00:00 UTC)" }

  - name: CleaningTask
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "Room.id this task cleans; immutable after creation" }
      - { name: task_source, type: enum, source: input, description: "CHECK_OUT | STAYOVER | SCHEDULED; CHECK_OUT auto-created by PMS DUE_OUT sweep, STAYOVER by daily scheduler, SCHEDULED by manual create", constraints: "CHECK_OUT | STAYOVER | SCHEDULED" }
      - { name: expedite_flag, type: boolean, source: input, default: false, description: "True when front desk requests expedited cleaning (e.g., early arrival); contributes EXPEDITE_PRIORITY_BONUS" }
      - { name: early_check_in_at, type: datetime, source: input, default: null, description: "ISO 8601 UTC; if set and within EARLY_CHECK_IN_WINDOW_HOURS of now, contributes EARLY_CHECK_IN_PRIORITY_BONUS" }
      - { name: parent_task_id, type: string, source: system, default: null, description: "Self-reference to the failed-inspection CleaningTask that produced this rework task; null for original tasks" }
      - { name: priority_score, type: integer, source: computed, description: "Computed at create and on each PATCH that mutates a contributing input; see calculations.task_priority_score" }
      - { name: priority_tier, type: enum, source: computed, description: "URGENT | HIGH | NORMAL — threshold-banded view of priority_score; see calculations.task_priority_score" }
      - { name: estimated_minutes, type: integer, source: computed, description: "Estimated cleaning duration; depends on room_type + task_source; see calculations.task_estimated_minutes" }
      - { name: assigned_housekeeper_id, type: string, source: system, default: null, description: "Housekeeper selected by auto-dispatch; null while PENDING" }
      - { name: accepted_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC; set when housekeeper accepts the task" }
      - { name: started_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC; set when status moves to IN_PROGRESS" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC; set when housekeeper submits for inspection" }
      - { name: actual_minutes, type: integer, source: system, default: null, description: "Integer minutes between started_at and submitted_at (rounded half-up); set when status becomes SUBMITTED" }
      - { name: status, type: enum, source: system, description: "CleaningTask lifecycle; see §1.2", constraints: "PENDING | ASSIGNED | ACCEPTED | IN_PROGRESS | SUBMITTED | COMPLETED | CANCELLED" }

  - name: InspectionRecord
    parent: CleaningTask
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; immutable" }
      - { name: cleaning_task_id, type: string, source: system, description: "CleaningTask.id this record audits" }
      - { name: room_id, type: string, source: system, description: "Denormalized Room.id for archival queries" }
      - { name: supervisor_id, type: string, source: system, description: "X-User-ID of the inspecting supervisor (opaque)" }
      - { name: sampled_flag, type: boolean, source: system, description: "True iff this inspection was demanded by random-sampling rule (Housekeeper sample rate); see calculations.inspection_sample_required" }
      - { name: checklist_items, type: array, source: input, description: "Array of {item_code, passed, note?}; item_code drawn from a fixed enum set" }
      - { name: outcome, type: enum, source: input, description: "PASS | FAIL; PASS iff every checklist_items[].passed == true (server validates)", constraints: "PASS | FAIL" }
      - { name: notes, type: string, source: input, default: null, description: "Optional supervisor note" }

  - name: MinibarItem
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Stable SKU code; unique across active MinibarItem entities (status != ARCHIVED)" }
      - { name: display_name, type: string, source: input, description: "Catalog display name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Integer price in cents; immutable per active version (price changes via new MinibarItem record + ARCHIVED on the old)" }
      - { name: par_level, type: integer, source: input, description: "Target par stock per room for this SKU" }
      - { name: replenishment_threshold, type: integer, source: input, description: "When (par_level - cumulative_consumed_unreplenished) <= this value, a replenishment trigger fires" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED", constraints: "ACTIVE | ARCHIVED" }

  - name: MinibarConsumption
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "Room.id where consumption occurred" }
      - { name: cleaning_task_id, type: string, source: input, default: null, description: "Originating CleaningTask.id if entered by housekeeper; null if entered as GUEST_SELF_REPORT" }
      - { name: source_type, type: enum, source: input, description: "HOUSEKEEPER | GUEST_SELF_REPORT", constraints: "HOUSEKEEPER | GUEST_SELF_REPORT" }
      - { name: line_items, type: array, source: input, description: "Array of {minibar_item_id, quantity:int >=1}; same minibar_item_id MUST NOT appear twice in one record" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum over line items of (MinibarItem.unit_price_cents * quantity); see calculations.minibar_charge_total" }
      - { name: tax_cents, type: integer, source: computed, description: "Round-half-up(gross_amount_cents * MINIBAR_TAX_RATE) — computed on the SUM, not per line; see calculations.minibar_charge_total" }
      - { name: posted_amount_cents, type: integer, source: computed, description: "gross_amount_cents + tax_cents at the moment of posting; immutable once status moves past PENDING" }
      - { name: folio_reference, type: string, source: system, default: null, description: "Set by /_events/payment-post when status → POSTED" }
      - { name: status, type: enum, source: system, description: "Consumption lifecycle; see §1.2", constraints: "PENDING | POSTED | DISPUTED | INVESTIGATED | RESOLVED | WAIVED" }

  - name: MaintenanceTicket
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "Room.id reporting the issue" }
      - { name: reporter_housekeeper_id, type: string, source: input, description: "Housekeeper.id that filed the report" }
      - { name: category, type: enum, source: input, description: "ELECTRICAL | PLUMBING | HVAC | FURNITURE | APPLIANCE | OTHER", constraints: "ELECTRICAL | PLUMBING | HVAC | FURNITURE | APPLIANCE | OTHER" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text problem description" }
      - { name: isolates_room, type: boolean, source: computed, description: "True iff severity IN {HIGH, CRITICAL}; if true, accepting the ticket forces the parent Room into OUT_OF_ORDER" }
      - { name: engineering_assignee, type: string, source: system, default: null, description: "Opaque engineering operator id set when dispatched" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC; set when status → REPAIR_COMPLETED" }
      - { name: verified_at, type: datetime, source: system, default: null, description: "ISO 8601 UTC; set when status → VERIFIED" }
      - { name: re_clean_task_id, type: string, source: system, default: null, description: "CleaningTask.id auto-created on verification of an isolating ticket; null otherwise" }
      - { name: status, type: enum, source: system, description: "Maintenance lifecycle; see §1.2", constraints: "REPORTED | DISPATCHED | IN_REPAIR | REPAIR_COMPLETED | VERIFIED | REJECTED" }

  - name: LinenType
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Stable code (e.g., BATH_TOWEL_LG), unique across active LinenType" }
      - { name: display_name, type: string, source: input, description: "Catalog name" }
      - { name: replacement_policy, type: enum, source: input, description: "PER_STAY | SCHEDULED | ON_REQUEST", constraints: "PER_STAY | SCHEDULED | ON_REQUEST" }
      - { name: scheduled_interval_days, type: integer, source: input, default: null, description: "Required when replacement_policy = SCHEDULED; minimum days between replacements" }
      - { name: par_per_room, type: integer, source: input, description: "Target count per room" }
      - { name: replacement_cost_cents, type: integer, source: input, description: "Cost charged to guest folio on LOST_DAMAGED resolution" }

  - name: LinenMovement
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; immutable" }
      - { name: room_id, type: string, source: system, description: "Room.id involved in this movement" }
      - { name: linen_type_id, type: string, source: system, description: "LinenType.id" }
      - { name: cleaning_task_id, type: string, source: system, default: null, description: "Originating CleaningTask.id" }
      - { name: collected_quantity, type: integer, source: input, description: "Quantity collected (used linen); >=0" }
      - { name: sent_to_laundry_quantity, type: integer, source: system, default: 0, description: "Set on POST /linen-movements/{id}/handover-laundry; equals collected_quantity at handover; subsequent loss/damage debits this field" }
      - { name: returned_quantity, type: integer, source: system, default: 0, description: "Set on POST /_events/laundry-return; MUST satisfy returned_quantity + loss_quantity + damage_quantity == sent_to_laundry_quantity (invariant)" }
      - { name: loss_quantity, type: integer, source: system, default: 0, description: "Reported lost units; resolved via POST /linen-movements/{id}/resolve-loss-damage" }
      - { name: damage_quantity, type: integer, source: system, default: 0, description: "Reported damaged units; resolved via POST /linen-movements/{id}/resolve-loss-damage" }
      - { name: folio_charge_cents, type: integer, source: computed, description: "(loss_quantity + damage_quantity) * LinenType.replacement_cost_cents at moment of resolve-loss-damage; set then frozen" }
      - { name: status, type: enum, source: system, description: "COLLECTED | SENT_TO_LAUNDRY | RETURNED | LOSS_REPORTED | RESOLVED", constraints: "COLLECTED | SENT_TO_LAUNDRY | RETURNED | LOSS_REPORTED | RESOLVED" }

  - name: RoomStatusEvent
    parent: Room
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; immutable" }
      - { name: room_id, type: string, source: system, description: "Room.id whose status changed" }
      - { name: previous_status, type: enum, source: system, description: "Room.status before transition; null only for initial creation event" }
      - { name: new_status, type: enum, source: system, description: "Room.status after transition" }
      - { name: change_reason, type: enum, source: system, description: "PMS_SYNC | TASK_COMPLETED | INSPECTION_PASS | MAINTENANCE_ISOLATE | MAINTENANCE_VERIFY | MANUAL_CORRECTION | INITIAL", constraints: "PMS_SYNC | TASK_COMPLETED | INSPECTION_PASS | MAINTENANCE_ISOLATE | MAINTENANCE_VERIFY | MANUAL_CORRECTION | INITIAL" }
      - { name: actor_id, type: string, source: system, description: "Opaque actor identifier; X-User-ID for human actions, literal 'system' for cascades, 'pms' for PMS events" }
      - { name: correction_note, type: string, source: input, default: null, description: "Required when change_reason = MANUAL_CORRECTION; null otherwise" }

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; immutable" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID, or literal 'system'/'pms'/'payment'/'engineering'/'laundry' for inbound events" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role, or null for inbound-event actors" }
      - { name: action_type, type: enum, source: system, description: "ROOM_STATUS_CHANGE | MINIBAR_CONSUMPTION_POST | MINIBAR_CONSUMPTION_DISPUTE | MINIBAR_CONSUMPTION_WAIVE | MANUAL_CORRECTION | EVENT_INGESTED", constraints: "fixed enum set" }
      - { name: subject_entity, type: string, source: system, description: "Entity name (e.g., 'Room', 'MinibarConsumption')" }
      - { name: subject_id, type: string, source: system, description: "ID of the affected entity" }
      - { name: detail, type: object, source: system, description: "Free-form JSON object: {previous, next, fields_changed, event_payload}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Room
    field: status
    initial_state: VACANT_CLEAN
    terminal_states: []   # cyclic; no terminal
    transitions:
      - from: VACANT_CLEAN
        to: OCCUPIED_CLEAN
        trigger: "POST /_events/pms-sync with payload.event_type=CHECK_IN for this room"
        actor: system
        preconditions:
          - "Room.status == VACANT_CLEAN"
          - "Room.pms_occupancy transitions to OCCUPIED in the event payload"
        side_effects:
          - "Append RoomStatusEvent with change_reason=PMS_SYNC, actor_id='pms'"
          - "Append AuditLog with action_type=ROOM_STATUS_CHANGE"
          - "Recompute Room.discrepancy_flag"

      - from: OCCUPIED_CLEAN
        to: OCCUPIED_DIRTY
        trigger: "POST /cleaning-tasks (auto-create STAYOVER task) OR POST /_events/pms-sync with payload.event_type=DAILY_TURN"
        actor: system
        preconditions:
          - "Room.status == OCCUPIED_CLEAN"
        side_effects:
          - "Append RoomStatusEvent (change_reason=TASK_COMPLETED if cleaning-task originated, else PMS_SYNC)"
          - "Append AuditLog"

      - from: OCCUPIED_DIRTY
        to: VACANT_DIRTY
        trigger: "POST /_events/pms-sync with payload.event_type=CHECK_OUT"
        actor: system
        preconditions:
          - "Room.status == OCCUPIED_DIRTY"
        side_effects:
          - "Auto-create CleaningTask with task_source=CHECK_OUT, expedite_flag=false"
          - "Append RoomStatusEvent (change_reason=PMS_SYNC)"
          - "Append AuditLog"

      - from: VACANT_DIRTY
        to: INSPECTED
        trigger: "POST /cleaning-tasks/{taskId}/inspect with outcome=PASS"
        actor: Supervisor
        preconditions:
          - "Room.status == VACANT_DIRTY (or OCCUPIED_DIRTY for stayover finishing)"
          - "CleaningTask.status == SUBMITTED"
          - "InspectionRecord.outcome == PASS"
        side_effects:
          - "CleaningTask.status → COMPLETED"
          - "Room.last_cleaned_at = inspection.created_at"
          - "Append RoomStatusEvent (change_reason=INSPECTION_PASS)"
          - "Append AuditLog"

      - from: OCCUPIED_DIRTY
        to: OCCUPIED_CLEAN
        trigger: "POST /cleaning-tasks/{taskId}/inspect with outcome=PASS where CleaningTask.task_source=STAYOVER"
        actor: Supervisor
        preconditions:
          - "CleaningTask.task_source == STAYOVER"
          - "CleaningTask.status == SUBMITTED"
          - "InspectionRecord.outcome == PASS"
        side_effects:
          - "CleaningTask.status → COMPLETED"
          - "Room.last_cleaned_at = inspection.created_at"
          - "Append RoomStatusEvent (change_reason=INSPECTION_PASS)"

      - from: INSPECTED
        to: VACANT_CLEAN
        trigger: "system, at the next /_clock/advance tick where Room.status==INSPECTED for >= INSPECTED_GRACE_MINUTES"
        actor: system
        preconditions:
          - "Room.status == INSPECTED"
          - "now - last_status_change >= INSPECTED_GRACE_MINUTES (default 30)"
          - "Room.pms_occupancy == VACANT"
        side_effects:
          - "Append RoomStatusEvent (change_reason=TASK_COMPLETED)"

      - from: [VACANT_CLEAN, VACANT_DIRTY, OCCUPIED_CLEAN, OCCUPIED_DIRTY, INSPECTED]
        to: OUT_OF_ORDER
        trigger: "POST /maintenance-tickets/{ticketId}/dispatch where ticket.isolates_room==true"
        actor: Supervisor
        preconditions:
          - "MaintenanceTicket.status == REPORTED"
          - "MaintenanceTicket.severity IN {HIGH, CRITICAL}"
          - "Room.out_of_order_ticket_id is null"
        side_effects:
          - "MaintenanceTicket.status → DISPATCHED"
          - "Room.out_of_order_ticket_id = ticket.id"
          - "Cancel all CleaningTasks for this room in status IN {PENDING, ASSIGNED, ACCEPTED, IN_PROGRESS} → CANCELLED (cascade)"
          - "Append RoomStatusEvent (change_reason=MAINTENANCE_ISOLATE)"
          - "Append AuditLog"
        note: "Cascade depth ≥ 3: dispatch isolates room → room status flips → all open cleaning tasks cancelled → housekeeper provisional_workload_minutes recomputed."

      - from: OUT_OF_ORDER
        to: VACANT_DIRTY
        trigger: "POST /maintenance-tickets/{ticketId}/verify"
        actor: Supervisor
        preconditions:
          - "MaintenanceTicket.status == REPAIR_COMPLETED"
          - "Room.out_of_order_ticket_id == ticketId"
        side_effects:
          - "MaintenanceTicket.status → VERIFIED, verified_at = now"
          - "Room.out_of_order_ticket_id = null"
          - "Auto-create CleaningTask (task_source=SCHEDULED, expedite_flag=true) referencing this room — written to MaintenanceTicket.re_clean_task_id"
          - "Append RoomStatusEvent (change_reason=MAINTENANCE_VERIFY)"

      - from: [VACANT_CLEAN, VACANT_DIRTY, OCCUPIED_CLEAN, OCCUPIED_DIRTY, INSPECTED]
        to: [VACANT_CLEAN, VACANT_DIRTY, OCCUPIED_CLEAN, OCCUPIED_DIRTY, INSPECTED]
        trigger: "POST /rooms/{roomId}/correct-status with body {new_status, correction_note}"
        actor: Supervisor
        preconditions:
          - "Room.status != OUT_OF_ORDER (manual correction is not allowed to enter/exit OUT_OF_ORDER)"
          - "new_status != OUT_OF_ORDER"
          - "new_status != Room.status"
        side_effects:
          - "Append RoomStatusEvent (change_reason=MANUAL_CORRECTION, correction_note set)"
          - "Append AuditLog (action_type=MANUAL_CORRECTION)"
          - "Recompute Room.discrepancy_flag"

  - entity: CleaningTask
    field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: ASSIGNED
        trigger: "POST /cleaning-tasks/{taskId}/dispatch (auto-dispatch) OR system (immediate dispatch on create when an eligible housekeeper is on shift)"
        actor: system
        preconditions:
          - "Selector policy (see §Quality: selector_determinism) finds at least one Housekeeper with shift_status=ON_SHIFT, assigned_zone == Room.zone_code, and the lowest provisional_workload_minutes; ties broken by employee_code ASC; empty pool → remain PENDING (ERR_NO_ELIGIBLE_HOUSEKEEPER on manual dispatch)"
        side_effects:
          - "Recompute Housekeeper.provisional_workload_minutes for the assignee"

      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /cleaning-tasks/{taskId}/accept"
        actor: Housekeeper
        preconditions:
          - "Housekeeper.X-User-ID == CleaningTask.assigned_housekeeper_id"
          - "CleaningTask.status == ASSIGNED"
        side_effects:
          - "accepted_at = now"

      - from: [ASSIGNED, ACCEPTED]
        to: ASSIGNED
        trigger: "POST /cleaning-tasks/{taskId}/reassign with body {new_housekeeper_id}"
        actor: Supervisor
        preconditions:
          - "CleaningTask.status IN {ASSIGNED, ACCEPTED}"
          - "Target Housekeeper exists, is ON_SHIFT, and is not the current assignee"
        side_effects:
          - "Old assignee.provisional_workload_minutes recomputed"
          - "New assignee.provisional_workload_minutes recomputed"
          - "accepted_at reset to null"

      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /cleaning-tasks/{taskId}/start"
        actor: Housekeeper
        preconditions:
          - "X-User-ID == assigned_housekeeper_id"
        side_effects:
          - "started_at = now"

      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: "POST /cleaning-tasks/{taskId}/submit"
        actor: Housekeeper
        preconditions:
          - "X-User-ID == assigned_housekeeper_id"
          - "started_at is not null"
        side_effects:
          - "submitted_at = now"
          - "actual_minutes = round_half_up((submitted_at - started_at).total_seconds()/60)"
          - "Recompute Housekeeper.realized_workload_minutes for the assignee"

      - from: SUBMITTED
        to: COMPLETED
        trigger: "POST /cleaning-tasks/{taskId}/inspect with outcome=PASS"
        actor: Supervisor
        preconditions:
          - "InspectionRecord.outcome == PASS"
          - "Room.status transition (see Room machine) succeeds atomically with this transition"
        side_effects:
          - "InspectionRecord persisted"
          - "Append AuditLog"
          - "Recompute Housekeeper.provisional_workload_minutes"

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /cleaning-tasks/{taskId}/inspect with outcome=FAIL"
        actor: Supervisor
        preconditions:
          - "InspectionRecord.outcome == FAIL"
        side_effects:
          - "InspectionRecord persisted with outcome=FAIL"
          - "Auto-create rework CleaningTask with parent_task_id = this.id, task_source = original task_source, expedite_flag = true; auto-dispatch the rework task immediately"
          - "Recompute Housekeeper.provisional_workload_minutes for original assignee"
        note: "Cascade depth ≥ 2: inspect-fail → original task CANCELLED → rework task created → rework task auto-dispatched."

      - from: [PENDING, ASSIGNED, ACCEPTED, IN_PROGRESS]
        to: CANCELLED
        trigger: "system (cascade from Room → OUT_OF_ORDER, see Room state machine)"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute Housekeeper.provisional_workload_minutes (if previously assigned)"

  - entity: MaintenanceTicket
    field: status
    initial_state: REPORTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /maintenance-tickets/{ticketId}/dispatch with body {engineering_assignee}"
        actor: Supervisor
        preconditions:
          - "MaintenanceTicket.status == REPORTED"
          - "Room not in OUT_OF_ORDER from another ticket (Room.out_of_order_ticket_id is null or == this.id)"
        side_effects:
          - "engineering_assignee set"
          - "If isolates_room: cascade Room → OUT_OF_ORDER (see Room machine)"
          - "POST /_events/engineering-notify (outbound) — best-effort"
          - "Append AuditLog"

      - from: DISPATCHED
        to: IN_REPAIR
        trigger: "POST /_events/engineering-update with body {ticket_id, new_status: IN_REPAIR}"
        actor: system
        preconditions:
          - "MaintenanceTicket.status == DISPATCHED"
        side_effects: []

      - from: IN_REPAIR
        to: REPAIR_COMPLETED
        trigger: "POST /_events/engineering-update with body {ticket_id, new_status: REPAIR_COMPLETED}"
        actor: system
        preconditions:
          - "MaintenanceTicket.status == IN_REPAIR"
        side_effects:
          - "completed_at = now"

      - from: REPAIR_COMPLETED
        to: VERIFIED
        trigger: "POST /maintenance-tickets/{ticketId}/verify"
        actor: Supervisor
        preconditions:
          - "MaintenanceTicket.status == REPAIR_COMPLETED"
        side_effects:
          - "If isolates_room: cascade Room OUT_OF_ORDER → VACANT_DIRTY, auto-create re-clean CleaningTask (see Room machine)"
          - "verified_at = now"
          - "Append AuditLog"

      - from: REPORTED
        to: REJECTED
        trigger: "POST /maintenance-tickets/{ticketId}/reject"
        actor: Supervisor
        preconditions:
          - "MaintenanceTicket.status == REPORTED"
        side_effects:
          - "Append AuditLog"

  - entity: MinibarConsumption
    field: status
    initial_state: PENDING
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /minibar-consumptions/{id}/post"
        actor: FrontDesk
        preconditions:
          - "MinibarConsumption.status == PENDING"
          - "All line_items[].minibar_item_id reference MinibarItem.status == ACTIVE"
        side_effects:
          - "Compute gross_amount_cents, tax_cents, posted_amount_cents (see calculations.minibar_charge_total)"
          - "POST /_events/payment-post (outbound) — folio_reference returned and stored"
          - "Replenishment trigger: for each line_item, if remaining_par after this consumption <= MinibarItem.replenishment_threshold, append a replenishment record (see calculations.minibar_replenishment_trigger)"
          - "Append AuditLog (action_type=MINIBAR_CONSUMPTION_POST)"

      - from: POSTED
        to: DISPUTED
        trigger: "POST /minibar-consumptions/{id}/dispute with body {dispute_note}"
        actor: FrontDesk
        preconditions:
          - "MinibarConsumption.status == POSTED"
          - "(now - posted_at) < MINIBAR_DISPUTE_WINDOW_HOURS hours (strict less-than; half-open window [posted_at, posted_at + 72h))"
        side_effects:
          - "Append AuditLog (action_type=MINIBAR_CONSUMPTION_DISPUTE)"

      - from: DISPUTED
        to: INVESTIGATED
        trigger: "POST /minibar-consumptions/{id}/investigate with body {finding_note}"
        actor: Supervisor
        preconditions: []
        side_effects: []

      - from: INVESTIGATED
        to: RESOLVED
        trigger: "POST /minibar-consumptions/{id}/resolve with body {keep_charge:true}"
        actor: Supervisor
        preconditions: []
        side_effects:
          - "Append AuditLog"

      - from: INVESTIGATED
        to: WAIVED
        trigger: "POST /minibar-consumptions/{id}/resolve with body {keep_charge:false}"
        actor: Supervisor
        preconditions:
          - "Original posted_amount_cents > 0"
        side_effects:
          - "POST /_events/payment-reverse (outbound) — reverses folio_reference"
          - "Append AuditLog (action_type=MINIBAR_CONSUMPTION_WAIVE)"
        note: "Invariant: a posted minibar charge that is later waived must net to zero on the folio — gross_amount_cents + tax_cents posted in /post must equal the absolute reversal recorded on /resolve {keep_charge:false}."

  - entity: LinenMovement
    field: status
    initial_state: COLLECTED
    terminal_states: [RESOLVED]
    transitions:
      - from: COLLECTED
        to: SENT_TO_LAUNDRY
        trigger: "POST /linen-movements/{id}/handover-laundry"
        actor: Housekeeper
        preconditions:
          - "LinenMovement.status == COLLECTED"
          - "collected_quantity > 0"
        side_effects:
          - "sent_to_laundry_quantity = collected_quantity"

      - from: SENT_TO_LAUNDRY
        to: RETURNED
        trigger: "POST /_events/laundry-return with body {movement_id, returned_quantity, loss_quantity, damage_quantity}"
        actor: system
        preconditions:
          - "returned_quantity + loss_quantity + damage_quantity == sent_to_laundry_quantity"
        side_effects: []

      - from: RETURNED
        to: LOSS_REPORTED
        trigger: "system (automatic on /_events/laundry-return when loss_quantity + damage_quantity > 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: LOSS_REPORTED
        to: RESOLVED
        trigger: "POST /linen-movements/{id}/resolve-loss-damage"
        actor: Supervisor
        preconditions:
          - "LinenMovement.status == LOSS_REPORTED"
        side_effects:
          - "folio_charge_cents = (loss_quantity + damage_quantity) * LinenType.replacement_cost_cents"
          - "POST /_events/payment-post (outbound) for folio_charge_cents (only if folio_charge_cents > 0)"

      - from: RETURNED
        to: RESOLVED
        trigger: "system (automatic on /_events/laundry-return when loss_quantity + damage_quantity == 0)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two supervisors POST /cleaning-tasks/{id}/inspect for the same SUBMITTED task simultaneously"
    guarantee: "Exactly one inspection wins; the second is rejected after status moved past SUBMITTED"
    error_id: ERR_TASK_NOT_SUBMITTED
    http_status: 409
    serialization: "First-writer-wins on CleaningTask.status"

  - scenario: "Two POST /maintenance-tickets/{id}/dispatch operations target the same room (different tickets) where each ticket would isolate the room"
    guarantee: "Only one ticket may hold Room.out_of_order_ticket_id; the second dispatch is rejected"
    error_id: ERR_ROOM_ALREADY_ISOLATED
    http_status: 409
    serialization: "First-writer-wins on Room.out_of_order_ticket_id"

  - scenario: "Housekeeper POST /accept and Supervisor POST /reassign on the same ASSIGNED CleaningTask simultaneously"
    guarantee: "Exactly one operation succeeds; loser sees state advanced past ASSIGNED"
    error_id: ERR_TASK_NOT_ASSIGNED
    http_status: 409
    serialization: "First-writer-wins on CleaningTask.status + assigned_housekeeper_id"

  - scenario: "Two POST /minibar-consumptions/{id}/post on the same PENDING record"
    guarantee: "Only one post may occur; second rejected"
    error_id: ERR_CONSUMPTION_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on MinibarConsumption.status"

  - scenario: "Optimistic concurrency mismatch on PATCH /cleaning-tasks/{id} with stale version"
    guarantee: "Version mismatch rejected; client must re-fetch and retry"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Version field strict-equality on update"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: task_priority_score
    trigger: "CleaningTask create; PATCH /cleaning-tasks/{id} when expedite_flag, early_check_in_at, or task_source change; nightly /_clock/advance re-evaluates the early_check_in window"
    algorithm: tiered_pricing
    formula: |
      Inputs:
        base = TASK_SOURCE_BASE[task_source]          # CHECK_OUT=50, STAYOVER=30, SCHEDULED=20
        vip_bonus = VIP_PRIORITY_BONUS if Room.vip_flag else 0   # 30
        expedite_bonus = EXPEDITE_PRIORITY_BONUS if expedite_flag else 0   # 20
        early_bonus = EARLY_CHECK_IN_PRIORITY_BONUS if
                        (early_check_in_at is not null AND
                         0 <= (early_check_in_at - now).total_seconds() <= EARLY_CHECK_IN_WINDOW_HOURS * 3600)
                       else 0                          # 25
        # Combinatorial interaction: VIP + expedite stacks ADDITIVELY,
        # but when BOTH are present AND early_bonus is non-zero, apply
        # SYNERGY_MULTIPLIER on the sum of the three bonuses (not on base).
        bonus_sum = vip_bonus + expedite_bonus + early_bonus
        if vip_bonus > 0 AND expedite_bonus > 0 AND early_bonus > 0:
            bonus_sum = round_half_up(bonus_sum * SYNERGY_MULTIPLIER)
        priority_score = base + bonus_sum
        # Banding (banding boundaries are inclusive on the upper end):
        if priority_score >= URGENT_THRESHOLD:   priority_tier = URGENT
        elif priority_score >= HIGH_THRESHOLD:   priority_tier = HIGH
        else:                                    priority_tier = NORMAL
    input_set: "CleaningTask itself plus its parent Room (vip_flag); STAYOVER tasks created automatically use the same formula"
    constants:
      TASK_SOURCE_BASE:
        CHECK_OUT: 50
        STAYOVER: 30
        SCHEDULED: 20
      VIP_PRIORITY_BONUS: 30
      EXPEDITE_PRIORITY_BONUS: 20
      EARLY_CHECK_IN_PRIORITY_BONUS: 25
      EARLY_CHECK_IN_WINDOW_HOURS: 4
      SYNERGY_MULTIPLIER: 1.20
      URGENT_THRESHOLD: 100
      HIGH_THRESHOLD: 70
    precision: "integer; round_half_up on synergy multiplication"
    variants:
      - name: original
        when: "parent_task_id is null"
        difference: "Uses task_source as supplied"
      - name: rework
        when: "parent_task_id is not null (rework dispatched after FAIL inspection)"
        difference: "expedite_flag is forced to true on auto-creation; this can move priority_tier from HIGH to URGENT even when underlying inputs would not"

  - name: task_estimated_minutes
    trigger: "CleaningTask create; on PATCH that changes task_source"
    algorithm: aggregation
    formula: |
      estimated_minutes = BASE_MINUTES[room_type] + SOURCE_OVERHEAD[task_source]
    input_set: "Room.room_type + CleaningTask.task_source"
    constants:
      BASE_MINUTES:
        STANDARD: 25
        SUITE: 45
        PRESIDENTIAL: 75
      SOURCE_OVERHEAD:
        CHECK_OUT: 15
        STAYOVER: 0
        SCHEDULED: 10

  - name: housekeeper_workload_balance
    trigger: "POST /cleaning-tasks/{id}/dispatch (auto- or manual); evaluated against all Housekeepers in zone"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL workload: includes anything assigned but not yet COMPLETED,
      # ignoring whether the housekeeper has actually started:
      provisional_workload_minutes(h) =
        sum(t.estimated_minutes for t in CleaningTask
            where t.assigned_housekeeper_id == h.id
              and t.status in {ASSIGNED, ACCEPTED, IN_PROGRESS, SUBMITTED})
      # REALIZED workload: shift-to-date actual time:
      realized_workload_minutes(h) =
        sum(t.actual_minutes for t in CleaningTask
            where t.assigned_housekeeper_id == h.id
              and t.status == COMPLETED
              and t.submitted_at >= start_of_today_utc)
      # Selector: among Housekeepers with shift_status=ON_SHIFT and
      # assigned_zone == Room.zone_code, pick the housekeeper with the LOWEST
      # provisional_workload_minutes. Tie-break by employee_code ASC.
      # If the candidate set is empty, CleaningTask stays PENDING and manual
      # dispatch returns ERR_NO_ELIGIBLE_HOUSEKEEPER.
    input_set: "Housekeepers with shift_status=ON_SHIFT and assigned_zone=Room.zone_code; CleaningTasks in non-terminal states"
    constants: {}
    precision: "integer minutes"
    variants:
      - name: provisional
        when: "Auto-dispatch decision time"
        difference: "Uses estimated_minutes for tasks that have not started; produces the selector's working number"
      - name: realized
        when: "Shift-end reporting time (POST /housekeepers/{id}/workload-summary?as_of=realized)"
        difference: "Uses actual_minutes from COMPLETED tasks only; for the same housekeeper at the same instant, realized < provisional when in-flight tasks exist, and the two numbers MUST differ whenever at least one non-COMPLETED task is assigned"

  - name: minibar_charge_total
    trigger: "POST /minibar-consumptions/{id}/post"
    algorithm: tiered_pricing
    formula: |
      # ORDER OF ROUNDING IS PINNED — sum first, round once.
      gross_amount_cents = 0
      for line in line_items:
          item = MinibarItem(line.minibar_item_id)
          gross_amount_cents += item.unit_price_cents * line.quantity
      # Tax is computed on the SUMMED gross, NOT per line item.
      tax_cents = round_half_up(gross_amount_cents * MINIBAR_TAX_RATE)
      posted_amount_cents = gross_amount_cents + tax_cents
    input_set: "MinibarConsumption.line_items at the moment of POST /post"
    constants:
      MINIBAR_TAX_RATE: 0.10
    precision: "Integer cents; round_half_up on the SUMMED tax, not per line"
    variants:
      - name: sum_then_round
        when: "Always (pinned)"
        difference: "Per-line tax-then-sum would produce different totals because each line's tax would be rounded independently; this scaffold pins sum-then-round and any per-line rounding is a wrong implementation"

  - name: linen_replacement_required
    trigger: "POST /cleaning-tasks/{id}/start (housekeeper begins room cleaning); evaluated per LinenType"
    algorithm: threshold
    formula: |
      For each LinenType lt:
        last = max(LinenMovement.created_at
                   where room_id = task.room_id
                     and linen_type_id = lt.id
                     and status in {SENT_TO_LAUNDRY, RETURNED, LOSS_REPORTED, RESOLVED})
        if lt.replacement_policy == PER_STAY:
            required = (task.task_source == CHECK_OUT) OR (Room.status == OCCUPIED_DIRTY AND last is null)
        elif lt.replacement_policy == SCHEDULED:
            elapsed_days = floor((now - last).total_seconds() / 86400) if last else +infinity
            required = elapsed_days >= lt.scheduled_interval_days   # >= boundary
        elif lt.replacement_policy == ON_REQUEST:
            required = (LinenMovement exists with room_id=task.room_id and status=COLLECTED and linen_type_id=lt.id and created_at >= task.created_at)
      Returns array of LinenType.id values where required=true.
    input_set: "All LinenType (active) and the most recent LinenMovement per (room_id, linen_type_id)"
    constants: {}
    precision: "Boundary precision: elapsed_days >= scheduled_interval_days (NOT strictly >). 0 elapsed days never triggers SCHEDULED replacement."

  - name: inspection_sample_required
    trigger: "POST /cleaning-tasks/{id}/submit (when transitioning IN_PROGRESS → SUBMITTED)"
    algorithm: chronological
    formula: |
      # Determine whether THIS submission is randomly sampled for supervisor inspection
      # using a deterministic chronological rule (no actual RNG — the rule must be
      # reproducible in tests).
      h = task.assigned_housekeeper_id
      n = count(CleaningTask where assigned_housekeeper_id == h
                                 and status in {SUBMITTED, COMPLETED, CANCELLED}
                                 and submitted_at >= start_of_today_utc
                                 and submitted_at <= task.submitted_at)
      # n is the chronological sequence number of this submission today
      # (1-indexed by submitted_at ASC, tie-break by CleaningTask.id ASC).
      sampled_flag = (n % SAMPLE_EVERY_N == 0)
      # Independent of sampled_flag, FAIL on previous submission today forces this
      # one to be sampled:
      prev = previous CleaningTask by the same housekeeper (n-1) where outcome of
             its InspectionRecord == FAIL
      if prev exists: sampled_flag = true
    input_set: "All CleaningTasks for housekeeper h with submitted_at on the current UTC day, ordered by (submitted_at ASC, id ASC)"
    constants:
      SAMPLE_EVERY_N: 3
    precision: "Integer; modulo-N counts every Nth submission. Boundary: the FIRST submission of the day (n=1) is NOT sampled by the modulo rule; only by the prev-FAIL rule."

  - name: status_discrepancy_detection
    trigger: "POST /_events/pms-sync; POST /rooms/{id}/correct-status; any Room status transition"
    algorithm: projection
    formula: |
      # XOR-style logical mismatch between PMS occupancy and housekeeping status
      pms_says_occupied = pms_occupancy IN {OCCUPIED, DUE_OUT}
      hk_says_occupied  = status IN {OCCUPIED_CLEAN, OCCUPIED_DIRTY, INSPECTED}
      discrepancy_flag = (pms_says_occupied != hk_says_occupied)
      # Side effect: if discrepancy_flag flips false→true, append AuditLog
      # with action_type=EVENT_INGESTED and detail.alert='STATUS_DISCREPANCY'.
    input_set: "Room.pms_occupancy and Room.status"
    constants: {}
    precision: "Boolean"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role authorized for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-ids resolve (validated left to right: roomId, cleaningTaskId, ticketId, consumptionId, movementId, housekeeperId)"
    error_id: "ERR_ROOM_NOT_FOUND | ERR_TASK_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_CONSUMPTION_NOT_FOUND | ERR_MOVEMENT_NOT_FOUND | ERR_HOUSEKEEPER_NOT_FOUND | ERR_MINIBAR_ITEM_NOT_FOUND | ERR_LINEN_TYPE_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints that reference resources

  - priority: 4
    category: existence
    check: "Foreign-key payload ids resolve (assigned_housekeeper_id in reassign, line_items[].minibar_item_id in consumption create, room_id in maintenance/cleaning/linen create)"
    error_id: "ERR_HOUSEKEEPER_NOT_FOUND | ERR_MINIBAR_ITEM_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_LINEN_TYPE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /cleaning-tasks, POST /cleaning-tasks/{id}/reassign, POST /minibar-consumptions, POST /maintenance-tickets, POST /linen-movements"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the requested transition (see §1.2)"
    error_id: "ERR_TASK_NOT_ASSIGNED | ERR_TASK_NOT_ACCEPTED | ERR_TASK_NOT_IN_PROGRESS | ERR_TASK_NOT_SUBMITTED | ERR_TICKET_NOT_REPORTED | ERR_TICKET_NOT_DISPATCHED | ERR_TICKET_NOT_COMPLETED | ERR_CONSUMPTION_NOT_PENDING | ERR_CONSUMPTION_NOT_POSTED | ERR_CONSUMPTION_NOT_INVESTIGATED | ERR_ROOM_NOT_OUT_OF_ORDER | ERR_INVALID_ROOM_STATE"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "Manual room status correction MUST NOT enter or exit OUT_OF_ORDER (Room state machine §1.2)"
    error_id: ERR_MANUAL_CORRECTION_INVALID_TARGET
    http_status: 409
    applies_to: "POST /rooms/{id}/correct-status"

  - priority: 7
    category: business_safety
    check: "Dispatching a HIGH/CRITICAL maintenance ticket MUST NOT occur while the room is already isolated by another ticket (Room.out_of_order_ticket_id != null AND != this.id)"
    error_id: ERR_ROOM_ALREADY_ISOLATED
    http_status: 409
    applies_to: "POST /maintenance-tickets/{id}/dispatch"

  - priority: 8
    category: business_referential
    check: "Cleaning-task accept/start/submit MUST be issued by the assigned housekeeper (X-User-ID == assigned_housekeeper_id)"
    error_id: ERR_NOT_TASK_ASSIGNEE
    http_status: 403
    applies_to: "POST /cleaning-tasks/{id}/accept, /start, /submit"

  - priority: 9
    category: business_referential
    check: "Reassign target must be ON_SHIFT and NOT equal to current assignee"
    error_id: ERR_INVALID_REASSIGN_TARGET
    http_status: 409
    applies_to: "POST /cleaning-tasks/{id}/reassign"

  - priority: 10
    category: business_constraint
    check: "Minibar consumption line_items[].minibar_item_id values are unique within a single record"
    error_id: ERR_DUPLICATE_MINIBAR_LINE_ITEM
    http_status: 400
    applies_to: "POST /minibar-consumptions"

  - priority: 11
    category: business_constraint
    check: "Minibar consumption line_items[].quantity >= 1; line_items array non-empty"
    error_id: ERR_INVALID_LINE_QUANTITY
    http_status: 400
    applies_to: "POST /minibar-consumptions"

  - priority: 12
    category: business_constraint
    check: "Minibar consumption REFERENCES an ACTIVE MinibarItem (item.status != ARCHIVED)"
    error_id: ERR_MINIBAR_ITEM_ARCHIVED
    http_status: 409
    applies_to: "POST /minibar-consumptions, POST /minibar-consumptions/{id}/post"

  - priority: 13
    category: business_temporal
    check: "Minibar dispute window: POST /dispute only when (now - posted_at) is strictly less than MINIBAR_DISPUTE_WINDOW_HOURS hours (72h, half-open window — exactly 72h is rejected)"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /minibar-consumptions/{id}/dispute"

  - priority: 14
    category: business_temporal
    check: "Linen SCHEDULED replacement boundary: elapsed_days >= scheduled_interval_days (>= not >); 0 days never triggers"
    error_id: ERR_LINEN_REPLACEMENT_NOT_DUE
    http_status: 409
    applies_to: "POST /linen-movements (when policy=SCHEDULED, ON_REQUEST not required-yet)"

  - priority: 15
    category: business_referential
    check: "Laundry return invariant: returned_quantity + loss_quantity + damage_quantity == sent_to_laundry_quantity"
    error_id: ERR_LAUNDRY_RETURN_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /_events/laundry-return"

  - priority: 16
    category: business_constraint
    check: "Inspection checklist_items non-empty; outcome=PASS iff every item.passed==true"
    error_id: ERR_INVALID_INSPECTION_CHECKLIST
    http_status: 400
    applies_to: "POST /cleaning-tasks/{id}/inspect"

  - priority: 17
    category: business_constraint
    check: "Optimistic-concurrency version field on mutating endpoints (PATCH /cleaning-tasks, /minibar-items, /linen-types, /rooms) MUST match server value"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 18
    category: business_constraint
    check: "Pagination limit within [1, 100]; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Rooms ----
  - { method: POST,   path: "/rooms",                              description: "Create a Room",                                roles: [FrontDesk],            code: 201, input: [room_number, zone_code, room_type, "vip_flag?", "pms_occupancy?"], output: Room,           side_effects: ["status defaults to VACANT_CLEAN if pms_occupancy is VACANT or null; OCCUPIED_DIRTY if pms_occupancy is OCCUPIED; append RoomStatusEvent with change_reason=INITIAL"] }
  - { method: GET,    path: "/rooms",                              description: "List rooms (optional ?status=...&zone=...&discrepancy_only=true)", roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: ["limit?", "offset?", "status?", "zone?", "discrepancy_only?"], output: "Room[]", side_effects: [] }
  - { method: GET,    path: "/rooms/{roomId}",                     description: "Get a Room",                                   roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: [], output: Room, side_effects: [] }
  - { method: POST,   path: "/rooms/{roomId}/correct-status",      description: "Manual status correction",                     roles: [Supervisor],           code: 200, input: [new_status, correction_note, "version?"], output: Room, side_effects: ["See Room state machine MANUAL_CORRECTION transition"] }
  - { method: GET,    path: "/rooms/{roomId}/status-events",       description: "Status change history (chronological ASC)",    roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: ["limit?", "offset?"], output: "RoomStatusEvent[]", side_effects: [] }

  # ---- Housekeepers ----
  - { method: POST,   path: "/housekeepers",                       description: "Create housekeeper",                           roles: [Supervisor],           code: 201, input: [employee_code, display_name, assigned_zone], output: Housekeeper, side_effects: ["shift_status defaults to OFF_SHIFT"] }
  - { method: GET,    path: "/housekeepers",                       description: "List housekeepers",                            roles: [Supervisor, FrontDesk, Housekeeper, Engineer], code: 200, input: ["limit?", "offset?", "zone?", "shift_status?"], output: "Housekeeper[]", side_effects: [] }
  - { method: GET,    path: "/housekeepers/{housekeeperId}",       description: "Get housekeeper (with provisional/realized workload)", roles: [Supervisor, FrontDesk, Housekeeper, Engineer], code: 200, input: [], output: Housekeeper, side_effects: ["Recompute provisional_workload_minutes and realized_workload_minutes on read"] }
  - { method: POST,   path: "/housekeepers/{housekeeperId}/shift", description: "Toggle housekeeper on/off shift",              roles: [Supervisor, Housekeeper], code: 200, input: [shift_status], output: Housekeeper, side_effects: ["A self-toggle requires X-User-ID == this housekeeper.id; Supervisor can toggle any"] }

  # ---- Cleaning Tasks ----
  - { method: POST,   path: "/cleaning-tasks",                     description: "Create cleaning task (manual)",                roles: [FrontDesk, Supervisor], code: 201, input: [room_id, task_source, "expedite_flag?", "early_check_in_at?"], output: CleaningTask, side_effects: ["Compute estimated_minutes, priority_score, priority_tier; status=PENDING; if any eligible housekeeper ON_SHIFT in zone, immediately auto-dispatch → status=ASSIGNED"] }
  - { method: GET,    path: "/cleaning-tasks",                     description: "List cleaning tasks",                          roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: ["limit?", "offset?", "status?", "housekeeper_id?", "room_id?", "priority_tier?"], output: "CleaningTask[]", side_effects: [] }
  - { method: GET,    path: "/cleaning-tasks/{taskId}",            description: "Get a cleaning task",                          roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: [], output: CleaningTask, side_effects: [] }
  - { method: PATCH,  path: "/cleaning-tasks/{taskId}",            description: "Mutate task_source / expedite_flag / early_check_in_at; recomputes priority", roles: [Supervisor], code: 200, input: ["task_source?", "expedite_flag?", "early_check_in_at?", "version?"], output: CleaningTask, side_effects: ["Recompute estimated_minutes and priority_score"] }
  - { method: POST,   path: "/cleaning-tasks/{taskId}/dispatch",   description: "Manual auto-dispatch trigger for a PENDING task", roles: [Supervisor], code: 200, input: [], output: CleaningTask, side_effects: ["Apply selector policy; status → ASSIGNED on success, ERR_NO_ELIGIBLE_HOUSEKEEPER on empty pool"] }
  - { method: POST,   path: "/cleaning-tasks/{taskId}/accept",     description: "Housekeeper accepts assigned task",            roles: [Housekeeper],          code: 200, input: [], output: CleaningTask, side_effects: ["accepted_at set"] }
  - { method: POST,   path: "/cleaning-tasks/{taskId}/reassign",   description: "Reassign to a different housekeeper",          roles: [Supervisor],           code: 200, input: [new_housekeeper_id], output: CleaningTask, side_effects: ["See state machine"] }
  - { method: POST,   path: "/cleaning-tasks/{taskId}/start",      description: "Begin cleaning (ACCEPTED→IN_PROGRESS)",        roles: [Housekeeper],          code: 200, input: [], output: CleaningTask, side_effects: ["started_at = now"] }
  - { method: POST,   path: "/cleaning-tasks/{taskId}/submit",     description: "Submit for inspection",                        roles: [Housekeeper],          code: 200, input: [], output: CleaningTask, side_effects: ["submitted_at, actual_minutes computed; sampled_flag will be evaluated at inspect time"] }
  - { method: POST,   path: "/cleaning-tasks/{taskId}/inspect",    description: "Supervisor inspection (PASS/FAIL)",            roles: [Supervisor],           code: 201, input: [outcome, checklist_items, "notes?"], output: InspectionRecord, side_effects: ["See CleaningTask + Room state machines; on FAIL, auto-create rework"] }
  - { method: GET,    path: "/cleaning-tasks/{taskId}/inspection", description: "Get inspection record for a task",             roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: [], output: InspectionRecord, side_effects: [] }

  # ---- Maintenance Tickets ----
  - { method: POST,   path: "/maintenance-tickets",                description: "File a maintenance ticket",                    roles: [Housekeeper, Supervisor], code: 201, input: [room_id, reporter_housekeeper_id, category, severity, description], output: MaintenanceTicket, side_effects: ["isolates_room computed; status=REPORTED"] }
  - { method: GET,    path: "/maintenance-tickets",                description: "List maintenance tickets",                     roles: [FrontDesk, Supervisor, Engineer, Housekeeper], code: 200, input: ["limit?", "offset?", "status?", "room_id?", "severity?"], output: "MaintenanceTicket[]", side_effects: [] }
  - { method: GET,    path: "/maintenance-tickets/{ticketId}",     description: "Get a maintenance ticket",                     roles: [FrontDesk, Supervisor, Engineer, Housekeeper], code: 200, input: [], output: MaintenanceTicket, side_effects: [] }
  - { method: POST,   path: "/maintenance-tickets/{ticketId}/dispatch", description: "Dispatch ticket to engineering",          roles: [Supervisor], code: 200, input: [engineering_assignee], output: MaintenanceTicket, side_effects: ["See state machine; may isolate room"] }
  - { method: POST,   path: "/maintenance-tickets/{ticketId}/verify",   description: "Verify completed repair",                 roles: [Supervisor], code: 200, input: [], output: MaintenanceTicket, side_effects: ["Cascade: Room OUT_OF_ORDER→VACANT_DIRTY, auto-create re-clean CleaningTask"] }
  - { method: POST,   path: "/maintenance-tickets/{ticketId}/reject",   description: "Reject the report",                       roles: [Supervisor], code: 200, input: [], output: MaintenanceTicket, side_effects: [] }

  # ---- Minibar ----
  - { method: POST,   path: "/minibar-items",                      description: "Create catalog item",                          roles: [Supervisor],           code: 201, input: [sku_code, display_name, unit_price_cents, par_level, replenishment_threshold], output: MinibarItem, side_effects: ["status=ACTIVE"] }
  - { method: GET,    path: "/minibar-items",                      description: "List minibar items",                           roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: ["limit?", "offset?", "status?"], output: "MinibarItem[]", side_effects: [] }
  - { method: POST,   path: "/minibar-items/{itemId}/archive",     description: "Archive a minibar item",                       roles: [Supervisor],           code: 200, input: [], output: MinibarItem, side_effects: ["status=ARCHIVED"] }
  - { method: POST,   path: "/minibar-consumptions",               description: "Record consumption (housekeeper or guest)",    roles: [Housekeeper, FrontDesk], code: 201, input: [room_id, source_type, line_items, "cleaning_task_id?"], output: MinibarConsumption, side_effects: ["status=PENDING; if source_type=GUEST_SELF_REPORT then cleaning_task_id must be null"] }
  - { method: GET,    path: "/minibar-consumptions",               description: "List consumption records",                     roles: [FrontDesk, Supervisor, Housekeeper], code: 200, input: ["limit?", "offset?", "status?", "room_id?"], output: "MinibarConsumption[]", side_effects: [] }
  - { method: GET,    path: "/minibar-consumptions/{consumptionId}", description: "Get consumption record",                     roles: [FrontDesk, Supervisor, Housekeeper], code: 200, input: [], output: MinibarConsumption, side_effects: [] }
  - { method: POST,   path: "/minibar-consumptions/{consumptionId}/post",       description: "Post to folio",                  roles: [FrontDesk], code: 200, input: [], output: MinibarConsumption, side_effects: ["See state machine"] }
  - { method: POST,   path: "/minibar-consumptions/{consumptionId}/dispute",    description: "Guest dispute",                  roles: [FrontDesk], code: 200, input: [dispute_note], output: MinibarConsumption, side_effects: [] }
  - { method: POST,   path: "/minibar-consumptions/{consumptionId}/investigate", description: "Supervisor opens investigation", roles: [Supervisor], code: 200, input: [finding_note], output: MinibarConsumption, side_effects: [] }
  - { method: POST,   path: "/minibar-consumptions/{consumptionId}/resolve",    description: "Resolve disputed consumption",   roles: [Supervisor], code: 200, input: [keep_charge], output: MinibarConsumption, side_effects: ["See state machine; if !keep_charge, payment-reverse outbound event"] }

  # ---- Linen ----
  - { method: POST,   path: "/linen-types",                        description: "Create linen type",                            roles: [Supervisor], code: 201, input: [code, display_name, replacement_policy, "scheduled_interval_days?", par_per_room, replacement_cost_cents], output: LinenType, side_effects: [] }
  - { method: GET,    path: "/linen-types",                        description: "List linen types",                             roles: [FrontDesk, Supervisor, Housekeeper, Engineer], code: 200, input: ["limit?", "offset?"], output: "LinenType[]", side_effects: [] }
  - { method: POST,   path: "/linen-movements",                    description: "Record collected used linen",                  roles: [Housekeeper], code: 201, input: [room_id, linen_type_id, "cleaning_task_id?", collected_quantity], output: LinenMovement, side_effects: ["status=COLLECTED"] }
  - { method: GET,    path: "/linen-movements",                    description: "List linen movements",                         roles: [Supervisor, Housekeeper, FrontDesk], code: 200, input: ["limit?", "offset?", "status?", "room_id?"], output: "LinenMovement[]", side_effects: [] }
  - { method: POST,   path: "/linen-movements/{movementId}/handover-laundry",   description: "Hand off to laundry",            roles: [Housekeeper], code: 200, input: [], output: LinenMovement, side_effects: ["See state machine"] }
  - { method: POST,   path: "/linen-movements/{movementId}/resolve-loss-damage", description: "Resolve reported loss/damage",  roles: [Supervisor], code: 200, input: [], output: LinenMovement, side_effects: ["See state machine"] }

  # ---- Audit & Inbound Events & Clock ----
  - { method: GET,    path: "/audit-logs",                         description: "List audit log entries",                       roles: [Supervisor], code: 200, input: ["limit?", "offset?", "action_type?", "subject_id?"], output: "AuditLog[]", side_effects: [] }
  - { method: POST,   path: "/_events/pms-sync",                   description: "Inbound PMS event (CHECK_IN | CHECK_OUT | DAILY_TURN | OCCUPANCY_SYNC)", roles: [SystemIntegration], code: 200, input: [room_number, event_type, pms_occupancy], output: Room, side_effects: ["Update Room.pms_occupancy, pms_synced_at; drive Room state machine; recompute discrepancy_flag; on CHECK_OUT auto-create CleaningTask with task_source=CHECK_OUT"] }
  - { method: POST,   path: "/_events/engineering-update",         description: "Inbound engineering progress",                 roles: [SystemIntegration], code: 200, input: [ticket_id, new_status], output: MaintenanceTicket, side_effects: ["Drive MaintenanceTicket state machine"] }
  - { method: POST,   path: "/_events/laundry-return",             description: "Inbound laundry return",                       roles: [SystemIntegration], code: 200, input: [movement_id, returned_quantity, loss_quantity, damage_quantity], output: LinenMovement, side_effects: ["See state machine"] }
  - { method: POST,   path: "/_clock/advance",                     description: "Test-only clock advance (system time = system time + minutes); triggers time-gated sweeps", roles: [SystemIntegration], code: 200, input: [minutes], output: "object {now}", side_effects: ["Run INSPECTED→VACANT_CLEAN sweep for rooms past INSPECTED_GRACE_MINUTES; re-evaluate early_check_in window for PENDING/ASSIGNED tasks"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_MISSING_USER_CONTEXT,         http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,     http: 403, condition: "Role not authorized for this endpoint" }

  # Existence
  - { id: ERR_ROOM_NOT_FOUND,               http: 404, condition: "Room id does not exist" }
  - { id: ERR_TASK_NOT_FOUND,               http: 404, condition: "CleaningTask id does not exist" }
  - { id: ERR_TICKET_NOT_FOUND,             http: 404, condition: "MaintenanceTicket id does not exist" }
  - { id: ERR_CONSUMPTION_NOT_FOUND,        http: 404, condition: "MinibarConsumption id does not exist" }
  - { id: ERR_MOVEMENT_NOT_FOUND,           http: 404, condition: "LinenMovement id does not exist" }
  - { id: ERR_HOUSEKEEPER_NOT_FOUND,        http: 404, condition: "Housekeeper id does not exist" }
  - { id: ERR_MINIBAR_ITEM_NOT_FOUND,       http: 404, condition: "MinibarItem id does not exist" }
  - { id: ERR_LINEN_TYPE_NOT_FOUND,         http: 404, condition: "LinenType id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND,         http: 404, condition: "InspectionRecord does not exist for this task" }

  # State
  - { id: ERR_TASK_NOT_ASSIGNED,            http: 409, condition: "Operation requires CleaningTask.status == ASSIGNED" }
  - { id: ERR_TASK_NOT_ACCEPTED,            http: 409, condition: "Operation requires CleaningTask.status == ACCEPTED" }
  - { id: ERR_TASK_NOT_IN_PROGRESS,         http: 409, condition: "Operation requires CleaningTask.status == IN_PROGRESS" }
  - { id: ERR_TASK_NOT_SUBMITTED,           http: 409, condition: "Operation requires CleaningTask.status == SUBMITTED" }
  - { id: ERR_TASK_TERMINAL,                http: 409, condition: "Operation requires CleaningTask.status not in {COMPLETED, CANCELLED}" }
  - { id: ERR_TICKET_NOT_REPORTED,          http: 409, condition: "Operation requires MaintenanceTicket.status == REPORTED" }
  - { id: ERR_TICKET_NOT_DISPATCHED,        http: 409, condition: "Operation requires MaintenanceTicket.status == DISPATCHED or IN_REPAIR" }
  - { id: ERR_TICKET_NOT_COMPLETED,         http: 409, condition: "Operation requires MaintenanceTicket.status == REPAIR_COMPLETED" }
  - { id: ERR_CONSUMPTION_NOT_PENDING,      http: 409, condition: "Operation requires MinibarConsumption.status == PENDING" }
  - { id: ERR_CONSUMPTION_NOT_POSTED,       http: 409, condition: "Operation requires MinibarConsumption.status == POSTED" }
  - { id: ERR_CONSUMPTION_NOT_DISPUTED,     http: 409, condition: "Operation requires MinibarConsumption.status == DISPUTED" }
  - { id: ERR_CONSUMPTION_NOT_INVESTIGATED, http: 409, condition: "Operation requires MinibarConsumption.status == INVESTIGATED" }
  - { id: ERR_MOVEMENT_NOT_COLLECTED,       http: 409, condition: "Operation requires LinenMovement.status == COLLECTED" }
  - { id: ERR_MOVEMENT_NOT_LOSS_REPORTED,   http: 409, condition: "Operation requires LinenMovement.status == LOSS_REPORTED" }
  - { id: ERR_INVALID_ROOM_STATE,           http: 409, condition: "Room is in a state that does not allow this operation" }
  - { id: ERR_ROOM_NOT_OUT_OF_ORDER,        http: 409, condition: "Operation requires Room.status == OUT_OF_ORDER" }

  # Business — safety
  - { id: ERR_MANUAL_CORRECTION_INVALID_TARGET, http: 409, condition: "Manual room status correction cannot enter or exit OUT_OF_ORDER" }
  - { id: ERR_ROOM_ALREADY_ISOLATED,        http: 409, condition: "Dispatching an isolating ticket on a room that already has out_of_order_ticket_id set" }

  # Business — referential / actor identity
  - { id: ERR_NOT_TASK_ASSIGNEE,            http: 403, condition: "Housekeeper X-User-ID does not match CleaningTask.assigned_housekeeper_id for accept/start/submit" }
  - { id: ERR_INVALID_REASSIGN_TARGET,      http: 409, condition: "Reassign target housekeeper is invalid (same as current, or OFF_SHIFT)" }
  - { id: ERR_NO_ELIGIBLE_HOUSEKEEPER,      http: 409, condition: "Dispatch candidate set empty" }

  # Business — constraint
  - { id: ERR_DUPLICATE_MINIBAR_LINE_ITEM,  http: 400, condition: "Same minibar_item_id appears twice in line_items" }
  - { id: ERR_INVALID_LINE_QUANTITY,        http: 400, condition: "line_items[].quantity < 1, or line_items empty" }
  - { id: ERR_MINIBAR_ITEM_ARCHIVED,        http: 409, condition: "Consumption references a MinibarItem whose status is ARCHIVED" }
  - { id: ERR_INVALID_INSPECTION_CHECKLIST, http: 400, condition: "checklist_items empty, OR outcome=PASS but at least one item.passed==false" }
  - { id: ERR_LAUNDRY_RETURN_QUANTITY_MISMATCH, http: 422, condition: "returned+loss+damage != sent_to_laundry_quantity on /_events/laundry-return" }
  - { id: ERR_LINEN_REPLACEMENT_NOT_DUE,    http: 409, condition: "Linen movement created for SCHEDULED policy before elapsed_days >= scheduled_interval_days" }
  - { id: ERR_VERSION_CONFLICT,             http: 409, condition: "OCC version mismatch on PATCH endpoint" }
  - { id: ERR_INVALID_PAGINATION,           http: 400, condition: "limit outside [1, 100] or offset < 0" }
  - { id: ERR_INVALID_REQUEST,              http: 400, condition: "Generic malformed input (missing required field, wrong type)" }

  # Business — temporal
  - { id: ERR_DISPUTE_WINDOW_EXPIRED,       http: 409, condition: "Dispute attempted more than MINIBAR_DISPUTE_WINDOW_HOURS after POSTED transition" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Housekeeper
    description: "Frontline cleaner. Cleans, submits, reports maintenance, records consumption, collects linen."
    identity: "entity_backed:Housekeeper"
    exclusive_operations:
      - "POST /cleaning-tasks/{id}/accept (must be assignee)"
      - "POST /cleaning-tasks/{id}/start (must be assignee)"
      - "POST /cleaning-tasks/{id}/submit (must be assignee)"
      - "POST /linen-movements"
      - "POST /linen-movements/{id}/handover-laundry"
    shared_operations:
      - "POST /maintenance-tickets (with Supervisor)"
      - "POST /minibar-consumptions (with FrontDesk)"
      - "POST /housekeepers/{id}/shift (self only)"
      - "GET on resources within scope"

  - name: Supervisor
    description: "Floor supervisor. Inspects, reassigns, corrects status, runs investigations and dispatches."
    identity: "opaque"
    exclusive_operations:
      - "POST /rooms/{id}/correct-status"
      - "POST /housekeepers (create)"
      - "PATCH /cleaning-tasks/{id}"
      - "POST /cleaning-tasks/{id}/reassign"
      - "POST /cleaning-tasks/{id}/inspect"
      - "POST /cleaning-tasks/{id}/dispatch (manual)"
      - "POST /maintenance-tickets/{id}/dispatch"
      - "POST /maintenance-tickets/{id}/verify"
      - "POST /maintenance-tickets/{id}/reject"
      - "POST /minibar-items"
      - "POST /minibar-items/{id}/archive"
      - "POST /minibar-consumptions/{id}/investigate"
      - "POST /minibar-consumptions/{id}/resolve"
      - "POST /linen-types"
      - "POST /linen-movements/{id}/resolve-loss-damage"
      - "GET /audit-logs"
    shared_operations:
      - "POST /maintenance-tickets (with Housekeeper)"
      - "POST /housekeepers/{id}/shift (any housekeeper)"

  - name: FrontDesk
    description: "Front desk agent. Owns guest-facing operations: room creation, consumption posting and disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /rooms"
      - "POST /minibar-consumptions/{id}/post"
      - "POST /minibar-consumptions/{id}/dispute"
    shared_operations:
      - "POST /minibar-consumptions (with Housekeeper)"
      - "POST /cleaning-tasks (with Supervisor)"
      - "GET on resources within scope"

  - name: Engineer
    description: "Read-only role for the engineering team to monitor maintenance state. All actual mutation happens through SystemIntegration's /_events/engineering-update."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /rooms, /maintenance-tickets, /cleaning-tasks (read scope)"

  - name: SystemIntegration
    description: "Trusted inbound-event channel for PMS, Engineering, Laundry, and the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_events/pms-sync"
      - "POST /_events/engineering-update"
      - "POST /_events/laundry-return"
      - "POST /_clock/advance"
    shared_operations: []
