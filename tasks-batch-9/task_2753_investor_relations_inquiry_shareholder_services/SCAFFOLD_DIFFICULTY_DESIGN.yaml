              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { c_id: "$.data.id" }
            - call: "POST /roadshow-events"
              payload: { company_id: "${co_id}", event_type: "CONFERENCE", venue_city: "Zurich", window_start: "2026-09-01T13:00:00Z", window_end: "2026-09-01T18:00:00Z", slot_minutes: 30, capacity_slots: 5 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ev_id: "$.data.id" }
            - call: "POST /roadshow-events/${ev_id}/open-requests"
              payload: {}
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${c_id}", requested_slot_start: "2026-09-01T14:00:00Z", requested_slot_end: "2026-09-01T14:30:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { mr1_id: "$.data.id" }
          trigger:
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${c_id}", requested_slot_start: "2026-09-01T14:59:00Z", requested_slot_end: "2026-09-01T15:29:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /meeting-requests"
              payload: { event_id: "${ev_id}", contact_id: "${c_id}", requested_slot_start: "2026-09-01T15:00:00Z", requested_slot_end: "2026-09-01T15:30:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { mr2_id: "$.data.id" }
          assert:
            - "trigger step 1 responds HTTP 409 with $.data.error_id == ERR_CONTACT_DOUBLE_BOOKED"
            - "trigger step 2 responds HTTP 201 with $.data.status == REQUESTED"
            - "MeetingRequest.${mr2_id}.requested_slot_start == 2026-09-01T15:00:00.000Z"
            - "RoadshowEvent.${ev_id}.request_ledger_total == 2 (the rejected 14:59 attempt did not increment it)"
            - "MeetingRequest.${mr1_id}.status == REQUESTED and MeetingRequest.${mr2_id}.provisional_priority_score == 61.20"

      - name: dividend_cycle_closed_interval_endpoint_touch_collides
        grounds:
          - validations[priority=14]
          - errors[ERR_DIVIDEND_CYCLE_OVERLAP]
          - entities.TransferAgentInstruction.fields.record_date
          - endpoints[POST /transfer-agent-instructions]
        distinguishing_aspect: |
          Company is the occupied resource and the interval arithmetic is a CLOSED, date-inclusive
          [record_date, payable_date] cycle with no buffer: a new cycle whose record_date is exactly
          the stored cycle's payable_date (2026-08-25) collides, whereas the meeting-slot rule accepts
          an exactly-touching boundary — opposite adjacency semantics on a different resource entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer CYL with 1,000,000 shares outstanding and a 100,000-cent reserve."
            - "One INSTITUTIONAL_HOLDER contact with 1000 shares."
