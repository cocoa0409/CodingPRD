      - name: complaint_ratio_exactly_at_tier_one_upper_bound_releases_in_full
        grounds:
          - calculations.complaint_concentration_release
          - calculations.complaint_concentration_release.constants.TIER_1_MAX_RATIO_PCT
          - calculations.complaint_concentration_release.constants.REMEDIATION_CHARGE_CAP_FRACTION
          - entities.PurchaseAgreement.fields.holdback_retained_cents
          - entities.PurchaseAgreement.fields.holdback_released_cents
          - entities.PurchaseAgreement.fields.holdback_applied_cents
          - validations[priority=46]
        distinguishing_aspect: |
          A DECIMAL threshold boundary with an inclusive upper bound: one ErrorResolutionCase over
          four transferred loans is a complaint_ratio_pct of exactly 25.00, which the tier table must
          read as tier 1 (release_pct 100) and not tier 2, because the bound is <= 25.00. It also
          pins two independent rounding modes in the same response — the ratio is ROUND_HALF_UP to
          two decimals while the 40 percent remediation cap is FLOORED (floor(28320 * 0.40) = 11328,
