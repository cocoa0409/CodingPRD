      - name: rolling_fourteen_day_checkin_saturation_slides_by_candidate_due_at
        grounds:
          - validations.volunteer_checkin_saturated
          - validations.milestone_spacing_violation
          - entities.Milestone.fields.due_at
          - entities.Milestone.fields.checkin_status
        distinguishing_aspect: |
          This instance isolates the THIRD semantics: CHECKIN_SATURATION_LIMIT (2) is enforced over a
          SLIDING 14-day span anchored on the candidate row - the CLOSED window
          [new.due_at - 7 days, new.due_at + 7 days] - counted across ALL engagements of the volunteer,
          not over a fixed calendar fortnight and not over the engagement alone. Three facts pin it.
          First, with two SCHEDULED siblings inside the span the third check-in is refused even though
          the 72h buffer of the previous instance is satisfied (delta 72h exactly), so saturation is a
          COUNT rule layered after the distance rule and ERR_MILESTONE_SPACING_VIOLATION must not be
          the reported error. Second, advancing the logical clock does NOT by itself clear saturation -
          the span is a function of the candidate due_at, not of "now". Third, the span boundary is
          CLOSED: a candidate whose lower edge lands exactly on the oldest sibling (2026-01-27T00:00:00Z
          -> edge 2026-01-20T00:00:00Z == ms_a.due_at) still counts that sibling and is refused, while
          moving the candidate forward by one second (2026-01-27T00:00:01Z -> edge 2026-01-20T00:00:01Z)
          slides the span past ms_a, drops the count to 1 and is accepted. That single second is the
          exact inverse of the availability-window case, where the boundary instant is EXCLUDED.
          Trigger calls are indexed by position, so responses[0] is the first trigger call.
