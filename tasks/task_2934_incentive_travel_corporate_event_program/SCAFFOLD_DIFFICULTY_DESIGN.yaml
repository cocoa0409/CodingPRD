- rule_id: boundary_precision_check
  instances:
  - name: tier_qualification_threshold_is_inclusive_at_exact_equality
    grounds:
    - §1.3 tier_assignment_selector.formula (qualification_threshold <= actual_metric, inclusive)
    - §1.3 tier_assignment_selector.precision (threshold comparison uses <=)
    - §1.2 Qualifier PENDING_REVIEW -> QUALIFIED and PENDING_REVIEW -> DISQUALIFIED
    - §1.5 POST /qualifiers/{qualifier_id}/review
    - §1.1 AwardTier.qualification_threshold, tier_rank
    distinguishing_aspect: |-
      The tier boundary is inclusive at exactly one metric unit of resolution: actual_metric 250000000 lands on PLATINUM, 249999999 lands one unit below on GOLD, and 149999999 lands one unit below the lowest threshold and is DISQUALIFIED with assigned_tier_id null.
    test_recipe:
      setup:
      - Empty database, logical clock at its 2026-08-01T00:00:00Z default.
      - Program in DESIGN on budget 20000000 with PLATINUM (qualification_threshold 250000000) and GOLD
        (qualification_threshold 150000000); per_person_cost_basis_cents is still 0.
      - Three qualifiers with guest_count 0 sit at PENDING_REVIEW on the metric values 250000000, 249999999
        and 149999999.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Threshold Probe
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 20000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: PLATINUM
          tier_rank: 1
          qualification_threshold: 250000000
          budget_per_qualifier_cents: 2500000
          guest_allowance: 1
          air_cabin_class: BUSINESS
          upgrade_allowance_cents: 150000
          service_load_bp: 1275
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t1_id: $.data.id
      - call: POST /award-tiers
        payload:
          program_id: ${p_id}
          tier_code: GOLD
          tier_rank: 2
          qualification_threshold: 150000000
          budget_per_qualifier_cents: 1600000
          guest_allowance: 1
          air_cabin_class: PREMIUM_ECONOMY
          upgrade_allowance_cents: 40000
          service_load_bp: 800
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          t2_id: $.data.id
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-5001
          full_name: Xu Wen
          baseline_metric: 100000000
          actual_metric: 250000000
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qx_id: $.data.id
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-5002
          full_name: Yara Diop
          baseline_metric: 100000000
          actual_metric: 249999999
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qy_id: $.data.id
      - call: POST /qualifiers
        payload:
          program_id: ${p_id}
          employee_code: S-5003
          full_name: Zane Holt
          baseline_metric: 100000000
          actual_metric: 149999999
          guest_count: 0
        as: SalesOpsAnalyst
        as_user_id: so-01
        captures:
          qz_id: $.data.id
      trigger:
      - POST /qualifiers/${qx_id}/review {} as SalesOpsAnalyst so-01 — actual_metric exactly at the PLATINUM
        threshold.
      - POST /qualifiers/${qy_id}/review {} as SalesOpsAnalyst so-01 — one metric unit below it.
      - POST /qualifiers/${qz_id}/review {} as SalesOpsAnalyst so-01 — one metric unit below the GOLD
        threshold.
      assert:
      - Qualifier.${qx_id}.award_status == "QUALIFIED" and assigned_tier_id == "${t1_id}" — 250000000
        <= 250000000 clears PLATINUM.
      - Qualifier.${qx_id}.committed_cost_cents == 150000 (base 0, so only PLATINUM upgrade_allowance_cents).
      - Qualifier.${qy_id}.award_status == "QUALIFIED" and assigned_tier_id == "${t2_id}" — 249999999
        misses PLATINUM by one unit and falls to GOLD.
      - Qualifier.${qy_id}.committed_cost_cents == 40000 (GOLD upgrade_allowance_cents).
      - Qualifier.${qz_id}.award_status == "DISQUALIFIED", assigned_tier_id == null and committed_cost_cents
        == 0 — 149999999 clears no tier.
      - Program.qualified_count == 2 and committed_budget_cents == 190000 (the DISQUALIFIED row is excluded
        from the award side).
      - Program.budget_posture == "OK".
  - name: activity_admission_uses_strict_less_than_so_zero_capacity_waitlists_first_signup
