            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "resident_year_stipend_cents == 7000006 (round_half_up(7000000/13) = 538462 per block, x 13)"
