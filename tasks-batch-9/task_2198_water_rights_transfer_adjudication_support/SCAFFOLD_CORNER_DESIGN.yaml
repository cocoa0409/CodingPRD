            - {call: "POST /claimants", payload: {legal_name: "Bell Cattle Trust", contact_email: "b@bell.example", entity_type: INDIVIDUAL}, as: WaterRightsAnalyst, captures: {cl_b: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets", payload: {basin_code: "SNK", docket_number: "SNK-ADJ-01", claim_filing_deadline: "2026-04-01T00:00:00Z"}, as: BasinAdjudicator, captures: {dk: "$.data.id"}}
            - {call: "POST /adjudication-claims", payload: {decree_docket_id: "${dk}", water_right_id: "${wr}", claimed_priority_date: "1900-04-29T00:00:00Z", claimed_af: 100.00}, as: BasinAdjudicator, captures: {cm: "$.data.id"}}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-04-02T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets/${dk}/advance-phase", payload: {target_phase: EXAMINATION}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${cm}/examine", payload: {examiner_recommended_af: 87.77, examination_note: "Field survey supports 87.77 AF."}, as: BasinAdjudicator}
            - {call: "POST /adjudication-claims/${cm}/verify", payload: {verification_outcome: FIELD_VERIFIED, field_note: "Meter records reconcile."}, as: WaterRightsAnalyst}
            - {call: "POST /decree-dockets/${dk}/advance-phase", payload: {target_phase: OBJECTION_PERIOD}, as: BasinAdjudicator}
