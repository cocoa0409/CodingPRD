            - "ShipmentOrder.${order_id}.deposit_cents == 40000"
            - "ShipmentOrder.${order_id}.cod_balance_cents == 172500"

      - name: inoperable_surcharge_applied_per_vehicle
        claim_type: Correct Result
        grounds: [calculations.quote_pricing, entities.Quote.fields.inoperable_surcharge_cents]
        distinguishing_aspect: "1000mi OPEN STANDARD with one inoperable vehicle: base 85000 + inoperable 15000 = total 100000; inoperable_surcharge_cents == 15000."
        test_recipe:
          setup: ["DRAFT order 1000mi OPEN STANDARD with 1 inoperable vehicle."]
          setup_api_calls:
            - call: "POST /shippers"
              payload: { email: "c12@x.com", full_name: "C Twelve" }
              as: Admin
              captures: { shipper_id: $.data.id }
            - call: "POST /shipment-orders"
              payload: { origin_zip: "90001", dest_zip: "10001", route_miles: 1000, transport_type: "OPEN", pickup_window_start: "2026-06-01T08:00:00Z", pickup_window_end: "2026-06-05T18:00:00Z" }
