              as: Clerk
              captures: { cr1_id: $.data.id }
            - call: "POST /bills/${b2_id}/referrals"
              payload: { committee_id: "${cH_id}", hearing_window_start_utc: "2026-10-06T14:00:00Z", hearing_window_end_utc: "2026-10-06T16:00:00Z" }
              as: Clerk
              captures: { cr2_id: $.data.id }
            - call: "GET /committees/${cH_id}"
              payload: {}
              as: Clerk
              captures: { active_after_two_referrals: $.data.active_referral_count }
            - call: "GET /bills/${b1_id}"
              payload: {}
              as: Clerk
              captures: { b1_referral_count: $.data.referral_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /committee-referrals/${cr1_id}/report"
              payload: { outcome: "FAVORABLE" }
              as: Clerk
            - call: "GET /committees/${cH_id}"
              payload: {}
              as: Clerk
              captures: { active_after_one_report: $.data.active_referral_count }
            - call: "POST /bills/${b1_id}/pass"
              payload: {}
              as: Clerk
            - call: "POST /bills/${b1_id}/enroll"
              payload: {}
              as: Clerk
              captures: { eb1_id: $.data.id, ebv1: $.data.version }
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: Clerk
              captures: { enrolled_after_one: $.data.bills_enrolled_count }
            - call: "POST /enrolled-bills/${eb1_id}/technical-corrections"
              payload: { expected_enrolled_bill_version: "${ebv1}", correction_type: "CITATION_FIX", description: "Left open on purpose.", is_substantive: false }
              as: Drafter
              as_user_id: "${d1_id}"
              captures: { tc1_id: $.data.id }
            - call: "GET /enrolled-bills/${eb1_id}"
              payload: {}
              as: Clerk
              captures: { open_after_proposal: $.data.open_corrections_count }
            - call: "POST /sessions/${s_id}/adjourn"
              payload: {}
              as: Clerk
            - call: "GET /committees/${cH_id}"
              payload: {}
              as: Clerk
              captures: { active_after_adjourn: $.data.active_referral_count }
            - call: "GET /bills/${b2_id}"
              payload: {}
              as: Clerk
              captures: { b2_referral_count_after_adjourn: $.data.referral_count }
            - call: "GET /enrolled-bills/${eb1_id}"
              payload: {}
              as: Clerk
              captures: { open_after_adjourn: $.data.open_corrections_count }
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: Clerk
              captures: { intro_after_adjourn: $.data.bills_introduced_count, enrolled_after_adjourn: $.data.bills_enrolled_count }
          assert:
            - "intro_after_two == 2 and b1_referral_count == 1 — counters are correct right after the creates"
            - "active_after_two_referrals == 2 and active_after_one_report == 1 — the forward transition decremented exactly one"
            - "enrolled_after_one == 1 and open_after_proposal == 1"
            - "active_after_adjourn == 0: the fan-out moved cr2 to DIED_IN_COMMITTEE and recomputed the committee counter"
            - "b2_referral_count_after_adjourn == 1: Bill.referral_count counts referrals of ANY status, so the kill does not decrement it"
            - "open_after_adjourn == 0: the PROPOSED correction was rejected by the fan-out and the enrollment's open counter followed"
            - "intro_after_adjourn == 2 and enrolled_after_adjourn == 1 — introduced counts every status and the enrolled bill survives adjournment, so neither session counter moves"
            - "Bill.${b2_id}.legislative_status is DEAD while Bill.${b1_id}.legislative_status is still ENROLLED"

      - name: the_adoption_cascade_is_verified_end_to_end_across_four_levels
        claim_type: Cross-Cutting — cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Depth: one action mutating four levels of entity in a fixed order, with the ledger at the far end."
        excluded_because:
          difficulty_instance: amendment_adoption_cascades_four_levels_from_bill_fiscal_status_to_session_posture
          rationale: "That §1.8 instance already walks amendment adoption from the amendment row through Bill.fiscal_status and the re-opened FiscalNoteRequest to Session.certified_fiscal_total_cents and fiscal_posture, asserting each level and the ordering between them; repeating it here would only change the fixture names."

      - name: the_conflict_cascade_is_verified_end_to_end_across_three_levels
        claim_type: Cross-Cutting — cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "A second, structurally different cascade — counters on the drafting request bubbling out to a member-level hold rather than to the money ledger."
        excluded_because:
          difficulty_instance: blocking_conflict_cascades_three_levels_from_conflict_counters_to_member_intake_hold
          rationale: "That §1.8 instance drives the conflict counters, the clarification round trip and the resulting Member.intake_hold in one recipe, including the un-hold on resolution; a duplicate here would assert the same three levels."

      - name: both_fiscal_methodologies_are_shown_to_diverge_on_identical_cost_lines
        claim_type: Cross-Cutting — dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Variant divergence on the money path: the same cost lines certified under two different methodologies must land on two different totals."
        excluded_because:
          difficulty_instance: fiscal_note_incremental_cost_vs_full_absorption_diverge_on_identical_lines
          rationale: "That §1.8 instance files byte-identical cost lines against two notes that differ only in methodology and asserts both certified totals and their delta, which is exactly the divergence claim for this layer."

      - name: both_complexity_variants_are_shown_to_diverge_and_to_switch_at_the_right_moment
        claim_type: Cross-Cutting — dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Variant selection and reconciliation on the drafting path: the intake estimate is frozen while the post-research actual keeps moving, and the SLA that depends on it must follow the right one."
        excluded_because:
          difficulty_instance: drafting_complexity_intake_estimate_vs_post_research_actual_diverge
          rationale: "That §1.8 instance pins intake_complexity_estimate at filing, recomputes actual_complexity_score at complete-research and again at clarify, and asserts which of the two the SLA and the tier read — variant selection and reconciliation in one recipe."

  # ===========================================================================
  # CONSISTENCY MODEL — `immediate`. Nothing in this domain is allowed to lag:
  # the response to a write already carries every field that write recomputed,
  # and the very next read of any affected entity is authoritative. There is no
  # retry, no poll and no "eventually" anywhere in the suite.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_write_response_already_carries_the_derived_state_that_write_recomputed
        claim_type: Consistency — immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.session_certified_fiscal_ledger
        distinguishing_aspect: "The claim is about the writer's OWN response body, not about a later read: the certification response must already contain certified_total_cents, the cost-estimate response must already contain the revision_round it inherited, and the report response must already show the referral closed. Each is then confirmed by the immediately next read with no intervening call, so an implementation that recomputes derived state lazily on read would pass the second half and fail the first."
        test_recipe:
          setup:
            - "Bill b1 with appropriation_requested_cents 5000000, note n1 routed to agency a1 under INCREMENTAL_COST, and a fiscal committee referral ready to be reported."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions"
              payload: { name: "2027 Regular Session", introduction_deadline_utc: "2026-10-15T00:00:00Z", committee_report_deadline_utc: "2026-11-01T00:00:00Z", sine_die_utc: "2026-11-20T18:00:00Z", constrained_threshold_cents: 50000000, fiscal_cap_cents: 200000000, required_fiscal_years: [2027, 2028], fiscal_note_default_days: 21 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/convene"
              payload: {}
              as: Clerk
            - call: "POST /sessions/${s_id}/committees"
              payload: { chamber: "HOUSE", name: "House Appropriations", is_fiscal_committee: true, max_concurrent_referrals: 2 }
              as: Clerk
              captures: { cH_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Rep Sponsor", chamber: "HOUSE", party: "IND", priority_slots_total: 2 }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Drafter One", is_senior: false, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /drafters"
              payload: { full_name: "Counsel Senior", is_senior: true, max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { rc_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Department of Revenue", agency_code: "DOR", status: "ACTIVE", max_open_requests: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /drafting-requests"
              payload: { session_id: "${s_id}", subject: "Immediate consistency probe", summary: "Carries an appropriation.", requested_sections_count: 1, target_code_chapter: "Title 12", confidentiality: "PUBLIC", priority_flag: false, appropriation_requested_cents: 5000000 }
              as: Member
              as_user_id: "${m1_id}"
              captures: { dr1_id: $.data.id }
            - call: "POST /drafting-requests/${dr1_id}/assign"
              payload: { drafter_id: "${d1_id}", engagement_start_utc: "2026-09-01T06:00:00Z", engagement_end_utc: "2026-09-01T12:00:00Z" }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /drafting-requests/${dr1_id}/complete-research"
              payload: { affected_sections_count: 1 }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "POST /drafting-requests/${dr1_id}/certify-draft"
              payload: { style_findings_count: 0 }
              as: ReviewCounsel
              as_user_id: "${rc_id}"
            - call: "POST /bills"
              payload: { drafting_request_id: "${dr1_id}" }
              as: Clerk
              captures: { b1_id: $.data.id }
            - call: "POST /bills/${b1_id}/referrals"
              payload: { committee_id: "${cH_id}", hearing_window_start_utc: "2026-10-05T14:00:00Z", hearing_window_end_utc: "2026-10-05T16:00:00Z" }
              as: Clerk
              captures: { cr1_id: $.data.id }
            - call: "POST /bills/${b1_id}/fiscal-note-requests"
              payload: { agency_id: "${a1_id}", methodology: "INCREMENTAL_COST" }
              as: Clerk
              captures: { n1_id: $.data.id, nv1: $.data.version }
          trigger:
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${nv1}", fiscal_year: 2027, scenario: "BASELINE", personnel_cost_cents: 5000000, operating_cost_cents: 1000000, one_time_cost_cents: 0, fte_count: 1.0, revenue_impact_cents: 0, assumption_note: "Year one." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
              captures: { line1_round: $.data.revision_round, line1_included: $.data.included_in_certification }
            - call: "GET /fiscal-note-requests/${n1_id}"
              payload: {}
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
              captures: { nv2: $.data.version }
            - call: "POST /fiscal-note-requests/${n1_id}/cost-estimates"
              payload: { expected_fiscal_note_request_version: "${nv2}", fiscal_year: 2028, scenario: "BASELINE", personnel_cost_cents: 3000000, operating_cost_cents: 1000000, one_time_cost_cents: 0, fte_count: 1.0, revenue_impact_cents: 0, assumption_note: "Year two." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /fiscal-note-requests/${n1_id}/submit"
              payload: { submission_note: "Both years filed." }
              as: AgencyAnalyst
              as_user_id: "${a1_id}"
              captures: { submit_status: $.data.status }
            - call: "POST /fiscal-note-requests/${n1_id}/certify"
              payload: { certification_note: "Accepted as filed." }
              as: FiscalOfficer
              captures: { certify_total: $.data.certified_total_cents, certify_status: $.data.status }
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: FiscalOfficer
              captures: { ledger_now: $.data.certified_fiscal_total_cents, posture_now: $.data.fiscal_posture }
            - call: "GET /bills/${b1_id}"
              payload: {}
              as: FiscalOfficer
              captures: { bill_fiscal_now: $.data.fiscal_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /committee-referrals/${cr1_id}/report"
              payload: { outcome: "FAVORABLE" }
              as: Clerk
              captures: { report_status: $.data.status, report_reported_utc: $.data.reported_utc }
            - call: "GET /committees/${cH_id}"
              payload: {}
              as: Clerk
              captures: { active_now: $.data.active_referral_count }
            - call: "GET /bills/${b1_id}"
              payload: {}
              as: Clerk
              captures: { bill_legislative_now: $.data.legislative_status }
          assert:
            - "line1_round == 1 and line1_included == false in the CREATE response itself — the round is copied from the parent at write time, not filled in on a later read"
            - "submit_status == SUBMITTED in the submit response body"
            - "certify_total == 10500000 and certify_status == CERTIFIED in the certify response body: the total is present in the response that computed it"
            - "ledger_now == 10500000 in the very next read, with no retry, and posture_now == NORMAL (below the 50000000 threshold)"
            - "bill_fiscal_now == NOTE_COMPLETE on that same first read"
            - "report_status == REPORTED_FAVORABLE and report_reported_utc == 2026-10-06T00:00:00Z in the report response body — the stamp is set by the same call"
            - "active_now == 0 and bill_legislative_now == REPORTED on the first read after the report — the cross-entity effects of one action are all visible immediately"
            - "No assertion in this instance is allowed a second attempt: a value that is only correct on a later read is a failure under the immediate consistency model"

      - name: no_derived_ledger_field_ever_lags_the_write_that_moved_it
        claim_type: Consistency — immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "The boundary case of immediacy: a ledger that must flip a posture enum on the same call that crosses a threshold, where a lagging read would look correct one call later."
        excluded_because:
          difficulty_instance: certification_ledger_at_threshold_minus_one_cent_stays_normal_then_flips_constrained_at_exact_threshold
          rationale: "That §1.8 instance certifies one note a cent below the constrained threshold and a second that lands exactly on it, asserting the ledger and fiscal_posture on the read immediately following each certification; that already forbids any lag on the most sensitive derived pair in the scaffold."
