      - name: review_on_rejected_support_case_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SupportCase]
        distinguishing_aspect: "REJECTED is terminal: a second review returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["support case REJECTED"]
          setup_api_calls:
            - call: "POST /fleet/accounts"
