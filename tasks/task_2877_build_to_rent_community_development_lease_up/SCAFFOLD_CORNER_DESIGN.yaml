# §1.9 Scaffold Corner Design — breadth coverage for task 2877 (build-to-rent community
# development and lease-up). Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are emitted as excluded_because stubs rather than duplicated.
scaffold_corner_design:
  - section: entities
    instances:
      - name: community_creation_returns_201_with_the_full_declared_field_set
        claim_type: creation
        grounds:
          - entities.Community
          - endpoints.POST_/communities
          - state_machines.Community.plat.initial_state
        distinguishing_aspect: |
          A community created with only the required fields must come back with every declared field
          populated by its own source: inputs echoed, the four state dimensions at their initial values,
          every counter at 0, occupancy_ratio 0.0000 and amenity_delivery_ratio 1.0000 (no AMENITY phase
          exists yet), and posture already FROZEN because plat_status is DRAFT rather than APPROVED. A
          server that defaults posture to OPEN at creation fails here.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-02T00:00:00Z so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          trigger:
            - call: "POST /communities"
              payload: { name: "Alderway", market_code: "TX-AUS", total_planned_units: 6, product_mix: { DETACHED: 4, COTTAGE: 2, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 3000000, facility_commitment_cents: 60000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
          assert:
            - "HTTP 201 and the body is the fixed envelope with response_type object and a non-null data.id"
            - "Community.${c}: name == 'Alderway', market_code == 'TX-AUS', total_planned_units == 6, product_mix == {DETACHED: 4, COTTAGE: 2, TOWNHOME: 0}"
            - "Community.${c}: plat_status == DRAFT, plat_revision_round == 0, lifecycle_status == PLANNING, facility_status == CONSTRUCTION_DRAW, management_mode == DEVELOPER_SELF_MANAGED"
            - "Community.${c}: posture == FROZEN because plat_status is not APPROVED"
            - "Community.${c}: released_unit_count == 0, available_unit_count == 0, leased_unit_count == 0, occupancy_ratio == 0.0000, amenity_delivery_ratio == 1.0000"
            - "Community.${c}: committed_concession_cents == 0, construction_impact_credit_cents == 0, version == 1, created_at == 2026-08-02T00:00:00Z"

      - name: community_retrieval_by_id_returns_the_stored_entity_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_/communities/{id}
          - entities.Community
        distinguishing_aspect: |
          The single-resource read must return the persisted community verbatim to any operator role,
          including the derived fields, and must not mutate it: version stays 1 after two consecutive
          reads by two different roles.
        test_recipe:
          setup:
            - "One community 'Briarlyn' created with total_planned_units 3, still plat DRAFT."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Briarlyn", market_code: "TX-SAT", total_planned_units: 3, product_mix: { DETACHED: 3, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 30000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
          trigger:
            - call: "GET /communities/${c}"
              payload: {}
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: PropertyManager
              as_user_id: "u_pm_1"
          assert:
            - "Both reads return HTTP 200 with data.id == ${c}, name == 'Briarlyn', total_planned_units == 3"
            - "Both reads report version == 1 and identical created_at and updated_at values"
            - "Neither read changes posture (FROZEN) or plat_status (DRAFT)"

      - name: homesite_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/homesites
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The list read must honour limit/offset against the declared pagination defaults and report
          total_count over the whole filtered set, not the page: with three homesites in a phase,
          limit 2 offset 0 returns two rows with has_more true and total_count 3, and limit 2 offset 2
          returns the remaining row with has_more false while total_count is still 3.
        test_recipe:
          setup:
            - "Community 'Cinderhold' with plat APPROVED and one UNDER_CONSTRUCTION housing phase holding three PLANNED homesites."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Cinderhold", market_code: "TX-DFW", total_planned_units: 3, product_mix: { DETACHED: 3, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 30000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-CH-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 3, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph: $.data.id }
            - call: "POST /phases/${ph}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "C1", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs1: $.data.id }
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "C2", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs2: $.data.id }
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "C3", product_type: "DETACHED", bedrooms: 3, square_feet: 1900 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs3: $.data.id }
          trigger:
            - call: "GET /homesites"
              payload: { phase_id: "${ph}", limit: 2, offset: 0 }
              as: LeasingAgent
              as_user_id: "u_la_1"
            - call: "GET /homesites"
              payload: { phase_id: "${ph}", limit: 2, offset: 2 }
              as: LeasingAgent
              as_user_id: "u_la_1"
          assert:
            - "The first page returns HTTP 200, response_type array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "The second page returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "The union of the two pages is exactly {${hs1}, ${hs2}, ${hs3}} with no row repeated across pages"

      - name: community_get_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_30_path_id_resolves
          - errors.ERR_COMMUNITY_NOT_FOUND
        distinguishing_aspect: |
          A well-formed UUID that no community owns must produce ERR_COMMUNITY_NOT_FOUND / 404 in the
          error envelope, not an empty 200 body and not a 500, even though other communities exist.
        test_recipe:
          setup:
            - "One unrelated community exists, so the collection is non-empty."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Dunmoor", market_code: "TX-HOU", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
          trigger:
            - call: "GET /communities/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
          assert:
            - "HTTP 404 with response_type error and data.error_id == ERR_COMMUNITY_NOT_FOUND"
            - "data.message equals the catalogued message for that error_id"
            - "Community.${c} is untouched with version == 1"

      - name: community_create_missing_market_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_35_request_schema_and_enum_and_term_months
          - entities.Community.fields.market_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          market_code has source input with no default, so omitting it is a schema violation:
          ERR_INVALID_REQUEST / 400 and no Community row is created. A server that stores the community
          with a null market_code fails here.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          trigger:
            - call: "POST /communities"
              payload: { name: "Elmsgate", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, concession_budget_cents: 1000000, facility_commitment_cents: 20000000 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /communities afterwards reports total_count == 0"

      - name: community_create_omitting_the_optional_inputs_applies_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Community.fields.single_ownership_covenant
          - entities.Community.fields.maintenance_tech_headcount
          - endpoints.POST_/communities
        distinguishing_aspect: |
          single_ownership_covenant defaults to true and maintenance_tech_headcount to 2. Omitting both
          must yield exactly those values — not null, not 0 — because the covenant default decides
          whether a plat can ever be approved and the headcount default caps concurrent turn labour.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          trigger:
            - call: "POST /communities"
              payload: { name: "Fernlow", market_code: "TX-AUS", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, concession_budget_cents: 1000000, facility_commitment_cents: 20000000 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
          assert:
            - "HTTP 201 with Community.${c}.single_ownership_covenant == true"
            - "Community.${c}.maintenance_tech_headcount == 2"
            - "Community.${c}.posture == FROZEN and plat_status == DRAFT"

      - name: homesite_computed_and_system_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.Homesite.fields.status
          - entities.Homesite.fields.released_at
          - endpoints.POST_/homesites
        distinguishing_aspect: |
          Homesite.status, released_at, turn_cycle_count, id, created_at and version are computed or
          system fields; a create body that also carries status OFF_MARKET, released_at and version must
          have those extras ignored, leaving status PLANNED, released_at null, turn_cycle_count 0 and
          version 1. A server that echoes client input into computed fields fails here.
        test_recipe:
          setup:
            - "Community 'Gallowmere' with plat APPROVED and one UNDER_CONSTRUCTION housing phase."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Gallowmere", market_code: "TX-SAT", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-GM-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 2, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph: $.data.id }
            - call: "POST /phases/${ph}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
          trigger:
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "G1", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs: $.data.id }
          assert:
            - "HTTP 201 with Homesite.${hs}.status == PLANNED, released_at == null, off_market_reason == null"
            - "Homesite.${hs}.turn_cycle_count == 0, occupancy_certificate_number == null, occupancy_certificate_issued_at == null"
            - "Homesite.${hs}.id is a server-minted identifier different from any value in the request and version == 1"
            - "Community.${c}.available_unit_count is still 0 because a PLANNED homesite is not available"

      - name: homesite_create_with_an_undeclared_product_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Homesite.fields.product_type
          - validations.priority_35_request_schema_and_enum_and_term_months
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          product_type is constrained to DETACHED | COTTAGE | TOWNHOME. A body carrying DUPLEX must be
          refused at the schema tier with ERR_INVALID_REQUEST / 400 — before the product-mix count rule
          at priority 62 gets a chance to complain about an unknown mix key.
        test_recipe:
          setup:
            - "Community 'Hollowfield' with plat APPROVED and one UNDER_CONSTRUCTION housing phase whose product_mix has no DUPLEX key."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Hollowfield", market_code: "TX-DFW", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-HF-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 2, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph: $.data.id }
            - call: "POST /phases/${ph}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
          trigger:
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "H1", product_type: "DUPLEX", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST, not 409 ERR_PRODUCT_MIX_EXCEEDED"
            - "GET /homesites filtered by phase_id ${ph} reports total_count == 0"

      - name: absorption_review_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.AbsorptionReview
          - endpoints.GET_/absorption-reviews/{id}
        distinguishing_aspect: |
          AbsorptionReview declares common_fields false, so it has id and created_at but no version and
          no updated_at, and §1.5 exposes no write beyond its creation endpoint: its pacing_index,
          concession_tier and recommended_growth_bps are frozen at creation and are not re-derived when
          later leases execute inside the same window.
        test_recipe:
          setup:
            - "Community 'Inglebrook' with plat APPROVED, one released DETACHED homesite and one EXECUTED lease executed_at 2026-08-01T00:00:00Z."
            - "Logical clock advanced to 2026-08-08T00:00:00Z and one absorption review recorded over [2026-08-01, 2026-08-08) with planned_absorption_units 1."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Inglebrook", market_code: "TX-AUS", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-IB-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { cv: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${cv}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 2, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph: $.data.id }
            - call: "POST /phases/${ph}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "I1", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs: $.data.id }
            - call: "POST /homesites/${hs}/occupancy-certificates"
              payload: { occupancy_certificate_number: "CO-IB-I1", issued_at: "2026-08-01T00:00:00Z" }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /phases/${ph}/section-releases"
              payload: { homesite_ids: ["${hs}"] }
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /households"
              payload: { primary_applicant_name: "Ines Vale", email: "ines@example.com", household_size: 4, monthly_income_cents: 1200000, credit_tier: "A" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { hh: $.data.id }
            - call: "POST /leases"
              payload: { homesite_id: "${hs}", household_id: "${hh}", term_months: 12, start_date: "2026-08-01T00:00:00Z" }
              as: LeasingAgent
              as_user_id: "u_la_1"
              captures: { l: $.data.id }
            - call: "POST /leases/${l}/submissions"
              payload: {}
              as: LeasingAgent
              as_user_id: "u_la_1"
            - call: "POST /leases/${l}/signature"
              payload: { signed_by_name: "Ines Vale" }
              as: Household
              as_user_id: "${hh}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /communities/${c}/absorption-reviews"
              payload: { product_type: "DETACHED", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z", planned_absorption_units: 1 }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { ar: $.data.id }
          trigger:
            - call: "GET /absorption-reviews/${ar}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
          assert:
            - "HTTP 200 with AbsorptionReview.${ar}.actual_absorption_units == 1, available_supply_units == 0, pacing_index == 0.7500, concession_tier == AGGRESSIVE, recommended_growth_bps == -150"
            - "The response carries id and created_at but no version and no updated_at field"
            - "AbsorptionReview.${ar}.posture_at_review == OPEN and window_start/window_end echo the half-open request window"
            - "No endpoint in §1.5 accepts a write against /absorption-reviews/{id}, so the frozen values cannot be amended"

      - name: phase_create_with_an_unknown_community_id_returns_community_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_32_body_foreign_keys_resolve
          - entities.Phase.fields.community_id
          - errors.ERR_COMMUNITY_NOT_FOUND
        distinguishing_aspect: |
          The topology is flat, so a Phase reaches its parent only through the community_id body field.
          A syntactically valid but unknown community_id must produce ERR_COMMUNITY_NOT_FOUND / 404 from
          the body-FK tier, and no orphan Phase may be persisted.
        test_recipe:
          setup:
            - "One real community exists so the failure is about the referenced id, not an empty table."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Juniper Hollow", market_code: "TX-HOU", total_planned_units: 2, product_mix: { DETACHED: 2, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
          trigger:
            - call: "POST /phases"
              payload: { community_id: "00000000-0000-4000-8000-0000000000aa", sequence_index: 1, kind: "HOUSING", planned_unit_count: 2, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
          assert:
            - "HTTP 404 with data.error_id == ERR_COMMUNITY_NOT_FOUND"
            - "GET /phases filtered by community_id ${c} reports total_count == 0"

  - section: state_machines
    instances:
      - name: plat_submission_moves_the_plat_from_draft_to_submitted
        claim_type: valid_transition
        grounds:
          - state_machines.Community.plat.DRAFT_to_SUBMITTED
          - endpoints.POST_/communities/{id}/plat-submissions
        distinguishing_aspect: |
          The first declared transition must fire on its own trigger and record the submitting
          X-User-ID, because that identity is what the segregation-of-duties rule later compares the
          deciding officer against. posture must remain FROZEN: submission is not approval.
        test_recipe:
          setup:
