              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N4301RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 1 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM7301", origin: "MKE", destination: "ORD", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
