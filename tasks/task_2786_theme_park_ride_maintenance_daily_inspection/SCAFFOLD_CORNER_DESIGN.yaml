          assert:
            - "Trigger 1: DowntimeEvent.${d1}.status == \"OPEN\" (the event was not DIAGNOSED, so the cascade is skipped)"
            - "Trigger 2: DowntimeEvent.${d1}.status is still \"OPEN\"; the unlinked requisition changes no event"
            - "Trigger 3: DowntimeEvent.${d2}.status == \"AWAITING_PARTS\""
            - "Trigger 4: DowntimeEvent.${d2}.status == \"DIAGNOSED\" and PartRequisition.${r3}.status == \"CANCELLED\""
            - "Attraction.${a1}.parts_budget_committed_cents == 30000 and Attraction.${a2}.parts_budget_committed_cents == 0"
            - "Attraction.${a1}.operational_posture == \"DOWN\" and Attraction.${a2}.operational_posture == \"DOWN\""

      - name: superseding_bulletin_cancels_only_non_terminal_actions_and_recomputes_the_total
        claim_type: cascade_down
        grounds:
          - "state_machines.MaintenanceBulletin.transitions.ACKNOWLEDGED_to_SUPERSEDED"
          - "state_machines.BulletinAction.transitions.PENDING_to_CANCELLED"
