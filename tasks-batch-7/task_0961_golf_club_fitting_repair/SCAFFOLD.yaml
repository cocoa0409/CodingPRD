    output: ClubBuildSpec
    side_effects: ["ComponentOrder ALLOCATED -> CLOSED; stock_reserved -> consumed_total per line; increments ClubBuildSpec.version"]
  - method: POST
    path: /golf-shop/build-specs/{id}/deliver
    description: "READY -> DELIVERED; anchors warranty clock"
    roles: [FittingSpecialist, ShopManager]
    code: 200
    input: []
    output: ClubBuildSpec
    side_effects: ["delivered_at = now; Customer.completed_builds_count += 1; increments ClubBuildSpec.version"]
