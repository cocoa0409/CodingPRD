  - rule_id: transitive_cascade
    instances:

      - name: deed_recording_cascades_four_levels_into_project_open_space_acreage
        grounds:
          - state_machines.ClosingRecord.FUNDED_to_RECORDED
          - state_machines.Parcel.DEMOLISHED_to_OPEN_SPACE_RECORDED
          - state_machines.DeedRestriction.initial_RECORDED
          - calculations.protected_open_space_acres
          - calculations.monitoring_schedule
          - entities.MitigationProject.fields.protected_open_space_acres
          - global_constants.PROHIBITED_USE_CODES
          - global_constants.MONITORING_INTERVAL_MONTHS
        distinguishing_aspect: |
          A CONSTRUCTIVE cascade: one call to record the deed advances the ClosingRecord (L1),
          CREATES a DeedRestriction row that did not exist before with its own derived
          next_monitoring_due_date (L2), advances Parcel.acquisition_status DEMOLISHED ->
          OPEN_SPACE_RECORDED (L3) and only then recomputes MitigationProject
          protected_open_space_acres from 0.00 to 1.25 (L4). Level 4 is unreachable unless level 2's
          brand-new row is created first, because the acreage input set is filtered on the
          restriction's status.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one OWNER_OCCUPIED parcel of acreage 1.25 and protected_open_space_acres 0.00."
            - "The parcel has an ACCEPTED offer, a FUNDED ClosingRecord with settlement_cost_cents 400000, and acquisition_status DEMOLISHED after a COMPLETED demolition work order."
            - "No DeedRestriction exists on the parcel yet."
          setup_api_calls:
            - call: "POST /mitigation-projects"
              payload: { project_code: "CASCADE-UP", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: $.data.id }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-CAS", site_address: "55 River Rd", acreage: 1.25, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: $.data.id }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: $.data.id }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcels/${p1}/pre-event-value"
              payload: { parcel_id: "${p1}", pre_event_fmv_cents: 20000000, pre_event_value_basis: "ASSESSOR_ROLL" }
              as: StaffAppraiser
              as_user_id: "sa-1"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "INTERESTED" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/participation"
              payload: { parcel_id: "${p1}", participation_decision: "CONFIRM_VOLUNTARY", voluntary_acknowledgement_signed_on: "2026-08-01" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /parcels/${p1}/appraisals"
              payload: { parcel_id: "${p1}", appraisal_type: "INITIAL", valuation_basis: "PRE_EVENT", appraiser_license_no: "LIC-SA-1", effective_date: "2026-07-01", indicated_value_cents: 20000000 }
              as: StaffAppraiser
              as_user_id: "sa-1"
              captures: { ap1: $.data.id }
            - call: "POST /appraisals/${ap1}/submit"
              payload: { appraisal_id: "${ap1}" }
