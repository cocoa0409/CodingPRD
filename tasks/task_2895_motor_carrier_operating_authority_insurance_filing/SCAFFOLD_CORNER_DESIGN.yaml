        grounds:
          - calculations.filing_fee_conservation_invariant
        excluded_because:
          difficulty_instance: compensating_invariant / deny_reverses_the_filing_fee_debit_while_return_leaves_it_standing
          rationale: "That instance reconciles the append-only ledger against all four Carrier money fields after both dispositions."
      - name: returned_application_can_be_resubmitted
        claim_type: cyclic
        grounds:
          - state_machines.AuthorityApplication.RETURNED_FOR_CORRECTION_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_return_resubmit_cycle_charges_the_fee_once
          rationale: "The §1.8 instance drives the loop twice and asserts submission_count against a single fee assessment."
      - name: contract_creation_is_guarded_on_the_parent_authority_state
        claim_type: guarded transitions
        grounds:
