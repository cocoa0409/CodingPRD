            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${roleL}", segment_id: "${seg}", start_at: "2026-10-04T14:00:00Z", end_at: "2026-10-04T16:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { shSmall: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
