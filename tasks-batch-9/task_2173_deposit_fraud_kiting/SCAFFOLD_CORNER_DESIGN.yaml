              captures: { acct_dc: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_dc}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1023" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_dc: "$.data.id", md_dc: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_dc}/verification-attempts"
