  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: tollfree_gate_below_75_boundary
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_TOLLFREE_VETTING_INSUFFICIENT]
          - calculations.identity_scoring
        distinguishing_aspect: "TOLL_FREE submit with brand identity_score 70 (below the 75 gate) is rejected; the inclusive >=75 tier boundary on TEN_DLC lives in §1.8."
        test_recipe:
          setup: ["VERIFIED brand with identity_score 70 (website + PUBLIC_PROFIT, KEYWORD opt-in, invalid tax/postal formats)"]
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "A", plan_tier: "STANDARD", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Mid", tax_id: "X", business_type: "PUBLIC_PROFIT", address_line1: "1 M", city: "SF", region_code: "CA", postal_code: "X", country_code: "US", website_url: "https://m.example", opt_in_mechanism: "KEYWORD" }
              as: BrandManager
              captures: { brand: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "TRANSACTIONAL", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TOLL_FREE" }
              as: CampaignManager
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
              captures: { err: $.data.error_id }
          assert:
            - "Brand.${brand}.identity_score == 70"
            - "err == ERR_TOLLFREE_VETTING_INSUFFICIENT"
            - "http status == 409"

