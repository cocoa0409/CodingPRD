  # -------------------------------------------------------------------
  - section: validations
    instances:

      - name: odometer_reading_below_current_value_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_29_business_temporal
          - errors.ERR_ODOMETER_REGRESSION
        distinguishing_aspect: "The monotonicity check is non-strict: posting a reading one mile below the stored odometer is 422 ERR_ODOMETER_REGRESSION, while re-posting the identical reading is accepted, because cost-per-mile denominators depend on odometer deltas that must never go negative."
        test_recipe:
          setup: ["one fleet with one TRACTOR at current_odometer_miles 400000"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Odometer Commercial", location_code: "ODC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4021", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Odometer Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-120", vehicle_type: "TRACTOR", current_odometer_miles: 400000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh_id}/odometer"
              payload: { odometer_miles: 399999, reading_at: "2026-08-21T09:00:00Z" }
              as: FleetManager
              captures: { err: $.data.error_id }
            - call: "POST /vehicles/${veh_id}/odometer"
              payload: { odometer_miles: 400000, reading_at: "2026-08-21T09:05:00Z" }
              as: FleetManager
            - call: "POST /vehicles/${veh_id}/odometer"
              payload: { odometer_miles: 400001, reading_at: "2026-08-21T09:10:00Z" }
              as: FleetManager
          assert:
            - "the regressing post returns 422 with data.error_id == \"ERR_ODOMETER_REGRESSION\" and Vehicle.${veh_id}.current_odometer_miles is still 400000"
            - "the equal-value post returns 200 (the check is >=, not >) and leaves current_odometer_miles at 400000"
            - "the advancing post returns 200 and current_odometer_miles == 400001"

      - name: emergency_call_within_all_limits_passes_and_prices
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_6_business_constraint
          - calculations.road_service_response_and_pricing
          - entities.RoadServiceCall.fields.invoice_total_cents
        distinguishing_aspect: "A request that satisfies every guard must be accepted and priced, not merely not-rejected: labor_hours is a legal 0.25 multiple, the fleet is ACTIVE, the technician is AVAILABLE at the dispatching location, the surcharge lands below the cap and the SLA is met, so the computed total equals gross with no credit."
        test_recipe:
          setup:
            - "one location committed to 120 response minutes, no NationalAgreement at all"
            - "one TIA_CERTIFIED technician at that location, one TRACTOR, one EMERGENCY call reported at 2026-08-20T10:00:00Z"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Passing Commercial", location_code: "PSC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4022", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Passing Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-121", vehicle_type: "TRACTOR", current_odometer_miles: 250000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Pat S", certification_level: "TIA_CERTIFIED" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "EMERGENCY", complaint: "Blowout on steer", reported_at: "2026-08-20T10:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-20T10:05:00Z", dispatch_miles: 10, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-20T11:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /road-service-calls/${call_id}/complete"
              payload: { closed_at: "2026-08-20T12:30:00Z", labor_hours: 1.0 }
              as: TireTechnician
              as_user_id: "${tech_id}"
          assert:
            - "committed_response_minutes == 120 — with no agreement the location baseline applies and EMERGENCY gets no NORMAL grace"
            - "actual_response_minutes == 90 and sla_met == true, so sla_credit_cents == 0"
            - "gross_cents == 40863: base 9500 + labor 11000*1.0 + mileage 285*10 = 23350, surcharge round_half_up(0.75 * 23350) = 17513, and 17513 < MAX_SURCHARGE 40000 so the cap does not bind"
            - "invoice_total_cents == 40863 and dispatch_status == \"COMPLETED\", billing_status == \"UNBILLED\""
            - "the after-hours multiplier is NOT applied: dispatched_at UTC hour is 10, and even if it were, multipliers are taken with max() rather than stacked"
            - "Technician.${tech_id}.status == \"AVAILABLE\" and completed_call_count == 1, Vehicle.${veh_id}.status == \"IN_SERVICE\""

      - name: mount_with_bad_brand_and_bad_spec_reports_brand_first
        claim_type: cascading
        grounds:
          - validations.priority_20_business_referential
          - errors.ERR_BRAND_NOT_APPROVED
          - errors.ERR_CASING_SPEC_MISMATCH
        distinguishing_aspect: "Two sub-checks share one priority slot with an internal order: when brand and casing spec are BOTH wrong only ERR_BRAND_NOT_APPROVED is reported; fixing just the brand then surfaces ERR_CASING_SPEC_MISMATCH from the same slot, so the second error is unreachable without repairing the first."
        test_recipe:
          setup:
            - "a DRIVE policy with approved_brands [Bridgestone] and casing_spec_code R22.5, min_tread_depth_32nds 4"
            - "casing X spec R19.5 with asset brand Goodyear (both wrong); casing Y spec R19.5 with asset brand Bridgestone (spec wrong only)"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Cascade Commercial", location_code: "CDC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4023", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Cascade Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "R22.5" }
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-122", vehicle_type: "TRACTOR", current_odometer_miles: 100000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4023X", brand: "Goodyear", casing_spec_code: "R19.5", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casX_id: $.data.id }
            - call: "POST /tire-assets"
              payload: { fleet_account_id: "${fleet_id}", casing_id: "${casX_id}", brand: "Goodyear", cost_basis_cents: 50000 }
              as: DealerAdmin
              captures: { assetX_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4023Y", brand: "Bridgestone", casing_spec_code: "R19.5", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casY_id: $.data.id }
            - call: "POST /tire-assets"
              payload: { fleet_account_id: "${fleet_id}", casing_id: "${casY_id}", brand: "Bridgestone", cost_basis_cents: 50000 }
              as: DealerAdmin
              captures: { assetY_id: $.data.id }
          trigger:
            - call: "POST /tire-assets/${assetX_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-08-22T09:00:00Z", odometer_at_mount: 100000, tread_depth_at_mount_32nds: 24 }
              as: TireTechnician
              captures: { err: $.data.error_id }
            - call: "POST /tire-assets/${assetY_id}/mount"
              payload: { vehicle_id: "${veh_id}", position: "DRIVE", mounted_at: "2026-08-22T09:05:00Z", odometer_at_mount: 100000, tread_depth_at_mount_32nds: 24 }
              as: TireTechnician
              captures: { err2: $.data.error_id }
          assert:
            - "the doubly-wrong mount returns 422 with data.error_id == \"ERR_BRAND_NOT_APPROVED\", never ERR_CASING_SPEC_MISMATCH"
            - "the brand-correct mount returns 422 with data.error_id == \"ERR_CASING_SPEC_MISMATCH\""
            - "both assets remain IN_INVENTORY and the DRIVE position on Vehicle.${veh_id} is still unoccupied, so a later valid mount is possible"
            - "tread_depth_at_mount_32nds 24 is strictly above min 4, so priority 14 was satisfied and priority 20 really was the deciding slot"

      - name: road_service_call_naming_foreign_fleet_vehicle_rejected
        claim_type: cross-entity
        grounds:
          - validations.priority_21_business_referential
          - errors.ERR_FLEET_MISMATCH
        distinguishing_aspect: "Under a flat topology nothing structurally prevents mixing aggregates, so ownership is validated explicitly: a call that names fleet A but fleet B's vehicle is 422 ERR_FLEET_MISMATCH even though both ids resolve to existing rows."
        test_recipe:
          setup: ["one location, two fleets, one vehicle owned by fleet B"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Mismatch Commercial", location_code: "MMC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4024", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Mismatch Fleet A", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleetA_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Mismatch Fleet B", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleetB_id: $.data.id }
            - call: "POST /fleet-accounts/${fleetB_id}/vehicles"
              payload: { unit_number: "T-123", vehicle_type: "TRACTOR", current_odometer_miles: 60000 }
              as: DealerAdmin
              captures: { vehB_id: $.data.id }
          trigger:
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleetA_id}", vehicle_id: "${vehB_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Flat tire", reported_at: "2026-08-23T09:00:00Z" }
              as: DispatchCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "status 422 with data.error_id == \"ERR_FLEET_MISMATCH\" — not a 404, because both referenced rows exist"
            - "GET /road-service-calls?fleet_account_id=${fleetA_id} returns total_count == 0"
            - "Vehicle.${vehB_id}.status is unchanged at \"IN_SERVICE\""

      - name: retread_job_started_before_scheduled_window_rejected
        claim_type: temporal
        grounds:
          - validations.priority_26_business_temporal
          - errors.ERR_JOB_START_TOO_EARLY
        distinguishing_aspect: "The guard compares started_at against the job's own scheduled_start_at rather than against the logical clock, and the comparison is >=, so starting one minute early is 422 while starting exactly on the scheduled minute is accepted."
        test_recipe:
          setup:
            - "a retread plant with one AVAILABLE line, a fleet with a DRIVE policy (max_retread_count 3)"
            - "one casing collected and graded A, and a job scheduled 2026-08-25T08:00:00Z to 12:00:00Z"
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Early Plant", location_code: "ERP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4025", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "LE", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Early Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 24, casing_spec_code: "ANY" }
              as: DealerAdmin
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4025", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casing_id}", retread_line_id: "${line_id}", tread_design_code: "TD-DRIVE-1", scheduled_start_at: "2026-08-25T08:00:00Z", scheduled_end_at: "2026-08-25T12:00:00Z" }
              as: PlantScheduler
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /retread-jobs/${job_id}/start"
              payload: { started_at: "2026-08-25T07:59:00Z" }
              as: PlantScheduler
              captures: { err: $.data.error_id }
            - call: "POST /retread-jobs/${job_id}/start"
              payload: { started_at: "2026-08-25T08:00:00Z" }
              as: PlantScheduler
          assert:
            - "the early start returns 422 with data.error_id == \"ERR_JOB_START_TOO_EARLY\" and RetreadJob.${job_id}.status is still \"SCHEDULED\" with started_at null"
            - "the on-the-minute start returns 200, status == \"IN_PRODUCTION\", started_at == \"2026-08-25T08:00:00Z\""
            - "Casing.${casing_id}.status == \"IN_RETREAD\" only after the accepted start — the refused call moved no casing"
            - "the refusal did not consult the logical clock, which is still at its default 2026-08-01T00:00:00Z"

      - name: fleet_suspension_guard_applies_only_to_two_endpoints
        claim_type: conditional
        grounds:
          - validations.priority_31_business_constraint
          - errors.ERR_FLEET_SUSPENDED
        distinguishing_aspect: "The ACTIVE-fleet guard is scoped to exactly two creating endpoints. A SUSPENDED fleet must still accept inventory and odometer bookkeeping, so implementing the guard as a blanket fleet-wide freeze is wrong in both directions."
        test_recipe:
          setup: ["one fleet, one vehicle, then the fleet suspended by an explicit status post"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Suspend Commercial", location_code: "SPC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4026", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Suspend Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-124", vehicle_type: "TRACTOR", current_odometer_miles: 30000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /fleet-accounts/${fleet_id}/status"
              payload: { status: "SUSPENDED", status_reason: "Credit hold" }
              as: DealerAdmin
          trigger:
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Low pressure", reported_at: "2026-08-24T09:00:00Z" }
              as: DispatchCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-4026", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 130 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /vehicles/${veh_id}/odometer"
              payload: { odometer_miles: 31000, reading_at: "2026-08-24T09:10:00Z" }
              as: FleetManager
          assert:
            - "the new road service call returns 409 with data.error_id == \"ERR_FLEET_SUSPENDED\""
            - "POST /casings for the same suspended fleet returns 201 — that endpoint is outside the guard's applies_to list"
            - "POST /vehicles/${veh_id}/odometer returns 200 and current_odometer_miles == 31000"
            - "FleetAccount.${fleet_id}.status == \"SUSPENDED\" throughout, so the two successes are not an accidental reactivation"

      - name: validation_ladder_priority_ordering_index
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_auth
          - validations.priority_3_existence
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / auth_beats_existence_on_inspect_returns_403_not_404
          rationale: "That instance pits two simultaneously-violated rules against each other and asserts the lower-priority error is invisible, which is the ordering claim."

      - name: manifest_aggregate_capacity_validation_index
        claim_type: aggregate
        grounds:
          - validations.priority_33_business_constraint
        excluded_because:
          difficulty_instance: boundary_precision_check / manifest_capacity_exact_weight_boundary
          rationale: "That instance asserts the running SUM against hauler_capacity_lbs at exactly the capacity and at capacity plus one pound."

      - name: state_versus_temporal_priority_conflict_index
        claim_type: priority-conflict
        grounds:
          - validations.priority_9_state
          - validations.priority_24_business_temporal
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_temporal_when_scheduling_retread_rejected
          rationale: "The state error is asserted to mask the slot-conflict error when both hold at once."

  # -------------------------------------------------------------------
  - section: endpoints
    instances:

      - name: tire_policy_create_read_patch_and_list_surface
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/fleet-accounts/{fleet_account_id}/tire-policies
          - endpoints.PATCH_/tire-policies/{policy_id}
          - endpoints.GET_/tire-policies
        distinguishing_aspect: "The full conventional surface behaves conventionally: create returns 201, read returns the same row, PATCH is a partial update that touches only the named field and bumps version, and the list is filterable by position. There is no DELETE, so policies are corrected, never removed."
        test_recipe:
          setup: ["one fleet with a DRIVE policy and a TRAILER policy"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Crud Commercial", location_code: "CRD", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4027", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Crud Freight", account_type: "SINGLE_LOCATION", home_location_id: "${loc_id}", billing_mode: "DIRECT" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "DRIVE", target_pressure_psi: 100, pressure_tolerance_pct: 0.10, min_tread_depth_32nds: 4, pull_point_32nds: 6, max_retread_count: 3, approved_brands: ["Bridgestone", "Michelin"], new_tire_tread_depth_32nds: 24, casing_spec_code: "R22.5" }
              as: DealerAdmin
              captures: { policy_id: $.data.id, policy_v: $.data.version }
            - call: "POST /fleet-accounts/${fleet_id}/tire-policies"
              payload: { position: "TRAILER", target_pressure_psi: 95, pressure_tolerance_pct: 0.12, min_tread_depth_32nds: 2, pull_point_32nds: 4, max_retread_count: 2, approved_brands: ["Bridgestone"], new_tire_tread_depth_32nds: 20 }
              as: DealerAdmin
              captures: { policy2_id: $.data.id }
            - call: "GET /tire-policies/${policy_id}"
              payload: {}
              as: FleetManager
            - call: "PATCH /tire-policies/${policy_id}"
              payload: { pull_point_32nds: 8 }
              as: DealerAdmin
            - call: "GET /tire-policies"
              payload: { fleet_account_id: "${fleet_id}", position: "TRAILER" }
              as: FleetManager
          assert:
            - "the create returns 201 with version == 1 and approved_brands preserved as a two-element list in the given order"
            - "the read returns the identical row and does not change version"
            - "the PATCH returns 200 with pull_point_32nds == 8, version == 2, and every unnamed field unchanged (target_pressure_psi still 100, approved_brands still two entries, casing_spec_code still \"R22.5\")"
            - "the TRAILER-filtered list returns exactly 1 row, id == ${policy2_id}, with casing_spec_code == \"ANY\" from the default"

      - name: retread_line_status_action_endpoint_round_trip
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/retread-lines/{line_id}/status
          - state_machines.RetreadLine
        distinguishing_aspect: "The status change is an action endpoint, not a PATCH: it takes only the target status, applies the RetreadLine state machine, bumps version each way, and must preserve booked_minutes across the DOWN round trip so already-scheduled work is not silently freed."
        test_recipe:
          setup: ["one plant with one line at cure_cooldown_minutes 30"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Action Plant", location_code: "ACP", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4028", scrap_permit_expires_on: "2027-06-30", is_retread_plant: true }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "LA", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /retread-lines/${line_id}/status"
              payload: { status: "DOWN" }
              as: DealerAdmin
            - call: "GET /retread-lines"
              payload: { service_location_id: "${loc_id}", status: "DOWN" }
              as: PlantScheduler
            - call: "POST /retread-lines/${line_id}/status"
              payload: { status: "AVAILABLE" }
              as: DealerAdmin
          assert:
            - "the first action returns 200 with status == \"DOWN\" and version == 2"
            - "the DOWN-filtered list returns exactly 1 row whose id == ${line_id}"
            - "the second action returns 200 with status == \"AVAILABLE\" and version == 3 — versions increase monotonically, they do not revert"
            - "booked_minutes == 0 and cure_cooldown_minutes == 30 at every step: the status action carries no schedule side effects"

      - name: settle_invoice_with_wrong_amount_rejected
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/cross-location-invoices/{invoice_id}/settle
          - validations.priority_39_business_fiscal
          - errors.ERR_PAYMENT_AMOUNT_MISMATCH
        distinguishing_aspect: "settle is conditional on an exact-amount match: one cent short is 422 and the invoice stays SUBMITTED, and the amount that must match is total_cents AFTER discount and credit, not the subtotal."
        test_recipe:
          setup: ["the 12820-cent single-line invoice with tier_discount_pct 0.125 and no casing credit, submitted"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Settle Commercial", location_code: "STC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4029", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { name: "Settle Freight", account_type: "NATIONAL_ACCOUNT", home_location_id: "${loc_id}", billing_mode: "CROSS_LOCATION" }
              as: DealerAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "STL-2026", effective_from: "2026-07-01", effective_to: "2026-12-31", tier_discount_pct: 0.125, casing_credit_rate_cents: 15000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13000 }
              as: DealerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /national-agreements/${agr_id}/activate"
              payload: {}
              as: DealerAdmin
            - call: "POST /fleet-accounts/${fleet_id}/vehicles"
              payload: { unit_number: "T-125", vehicle_type: "TRACTOR", current_odometer_miles: 12000 }
              as: DealerAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /service-locations/${loc_id}/technicians"
              payload: { name: "Sam T", certification_level: "LEVEL_2" }
              as: DealerAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /road-service-calls"
              payload: { fleet_account_id: "${fleet_id}", vehicle_id: "${veh_id}", service_location_id: "${loc_id}", priority: "NORMAL", complaint: "Slow leak", reported_at: "2026-08-05T13:00:00Z" }
              as: DispatchCoordinator
              captures: { call_id: $.data.id }
            - call: "POST /road-service-calls/${call_id}/dispatch"
              payload: { dispatched_at: "2026-08-05T13:05:00Z", dispatch_miles: 2, technician_id: "${tech_id}" }
              as: DispatchCoordinator
            - call: "POST /road-service-calls/${call_id}/arrive"
              payload: { arrived_at: "2026-08-05T13:30:00Z" }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "POST /road-service-calls/${call_id}/complete"
              payload: { closed_at: "2026-08-05T14:00:00Z", labor_hours: 0.25 }
              as: TireTechnician
              as_user_id: "${tech_id}"
            - call: "GET /fleet-accounts/${fleet_id}"
              payload: {}
              as: BillingClerk
              captures: { fleet_v: $.data.version }
            - call: "POST /cross-location-invoices"
              payload: { fleet_account_id: "${fleet_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31", expected_fleet_account_version: "${fleet_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /cross-location-invoices/${inv_id}/submit"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /cross-location-invoices/${inv_id}/settle"
              payload: { paid_amount_cents: 12820 }
              as: BillingClerk
              captures: { err: $.data.error_id }
            - call: "POST /cross-location-invoices/${inv_id}/settle"
              payload: { paid_amount_cents: 11216 }
              as: BillingClerk
              captures: { err2: $.data.error_id }
            - call: "POST /cross-location-invoices/${inv_id}/settle"
              payload: { paid_amount_cents: 11217 }
              as: BillingClerk
          assert:
            - "paying the subtotal 12820 returns 422 ERR_PAYMENT_AMOUNT_MISMATCH — the discount is not optional"
            - "paying 11216, one cent short of total_cents, also returns 422 ERR_PAYMENT_AMOUNT_MISMATCH"
