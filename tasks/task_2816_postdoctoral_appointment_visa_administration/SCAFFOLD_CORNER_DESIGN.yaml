  - section: cross_cutting_complexity_layers
    instances:

      - name: both_declared_occ_rules_refuse_a_stale_appointment_version_and_admit_a_fresh_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.salary-exception-stale-appointment
          - concurrency_rules.lab-grant-stale-appointment
          - validations.priority_7_ERR_STALE_APPOINTMENT_VERSION
        distinguishing_aspect: "Both §1.2.1 rules pin the same parent field, Appointment.version, and both are supersede-friendly: a second salary exception and a second bench grant are legitimate operations, so the only thing that separates the accepted retry from the refused one is the version the caller carries. Each refusal leaves version untouched, so the very same stale value stays stale, and no LabAccessGrant row is written by the 412. Every accepted write moves version by exactly one."
        test_recipe:
          setup:
            - "One mentor with valid training, one US-citizen scholar needing no sponsorship, one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31) with no document requirements."
            - "One BSL1 laboratory with capacity 10 and decontamination_buffer_days 0."
            - "One DRAFT appointment 2026-10-01 to 2027-09-30 at 62000.00 whose band-0 floor is 61008.00, so an exception floor of 60000.00 and then 59000.00 are both legal."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "E. Fontaine", department: "Biochemistry", mentor_training_valid_through: "2029-12-31" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_72"
              captures: { m72_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIGMS-7200", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_72"
              captures: { f72_id: "$.data.id" }
            - call: "POST /funding-sources/${f72_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_27"
            - call: "POST /postdocs"
              payload: { full_name: "Ilan Mizrahi", email: "ilan.m@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-07-07" }
