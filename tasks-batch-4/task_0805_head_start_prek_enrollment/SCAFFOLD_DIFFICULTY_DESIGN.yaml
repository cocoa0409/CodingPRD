              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /enrollments?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr_id: "$.data[0].id" }
          trigger:
            - call: "POST /home-visits"
              payload: { enrollment_id: "${enr_id}", scheduled_date: "2026-04-02", window_start: "10:00", window_end: "11:00" }
              as: FamilyServicesWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_VISIT_DURING_SESSION\""

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: filled_slots_conserved_across_accept_then_withdraw
        grounds:
          - state_machines.Application.OFFERED_to_ENROLLED
          - state_machines.Enrollment.ACTIVE_to_WITHDRAWN
          - entities.AgeCohort.fields.filled_slots
        distinguishing_aspect: |
          Conserved quantity = committed slots: filled_slots == COUNT(Enrollment status ACTIVE). Accept
          raises filled_slots to 1; the compensating withdraw returns it to 0 and available_slots back to
          the full funded 2, leaving the committed-slot invariant unchanged.
        test_recipe:
          setup:
            - "Enrollment ACTIVE for AB in funded_slots=2 cohort; cohort.filled_slots == 1, available_slots == 1."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /enrollments?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr_id: "$.data[0].id" }
          trigger:
            - call: "POST /enrollments/${enr_id}/withdraw"
              payload: {}
              as: ProgramAdmin
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { filled: "$.data.filled_slots", avail: "$.data.available_slots" }
          assert:
            - "${filled} == 0"
            - "${avail} == 2"

      - name: reserved_slots_conserved_across_offer_then_decline
        grounds:
          - state_machines.Application.WAITLISTED_to_OFFERED
          - state_machines.Application.OFFERED_to_WAITLISTED
          - entities.AgeCohort.fields.reserved_slots
        distinguishing_aspect: |
          Conserved quantity = outstanding reservations: reserved_slots == COUNT(Offer status PENDING).
          A selection run raises reserved_slots to 1; the compensating decline returns it to 0 and
          available_slots back to 2 — a different conserved quantity than committed filled_slots.
        test_recipe:
          setup:
            - "Application AB OFFERED with a PENDING offer in funded_slots=2 cohort; cohort.reserved_slots == 1, available_slots == 1."
          setup_api_calls:
            - call: "POST /programs"
