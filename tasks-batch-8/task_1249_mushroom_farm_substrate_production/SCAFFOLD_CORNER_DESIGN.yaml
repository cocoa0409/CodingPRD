  - section: endpoints
    instances:
      - name: envelope_success_shape
        claim_type: standard_crud
        grounds: [response_envelope, "endpoints.POST /api/rooms"]
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == object."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r_id: $.data.id } }
          assert:
            - "201 response body has meta.api_request_id and meta.api_request_timestamp populated"
            - "response_type == 'object' and data carries room_code == 'R1', occupancy_status == 'IDLE', health_status == 'CLEAR', version == 1"

      - name: envelope_error_shape
        claim_type: not_found
        grounds: [response_envelope, "errors[ERR_ROOM_NOT_FOUND]"]
        distinguishing_aspect: "Every error response uses the fixed error envelope: response_type == error with data.error_id and data.message."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/rooms/66666666-6666-6666-6666-666666666666"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response_type == 'error' and data.error_id == 'ERR_ROOM_NOT_FOUND' (HTTP 404)"
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: rooms_list_pagination_defaults_and_filter
        claim_type: listing
        grounds: [response_envelope.pagination_fields, "endpoints.GET /api/rooms"]
        distinguishing_aspect: "Pagination contract: with 2 rooms, limit=1 returns total_count 2, has_more true, exactly 1 item; offset=1 returns the second page with has_more false; defaults are limit 10 / offset 0."
        test_recipe:
          setup: ["Rooms R1 and R2 exist"]
          setup_api_calls:
            - { call: "POST /api/rooms", payload: { room_code: "R1", capacity_tonnes: 50.0 }, as: FarmManager, captures: { r1_id: $.data.id } }
            - { call: "POST /api/rooms", payload: { room_code: "R2", capacity_tonnes: 60.0 }, as: FarmManager, captures: { r2_id: $.data.id } }
          trigger:
            - { call: "GET /api/rooms", payload: { limit: 1 }, as: Any }
            - { call: "GET /api/rooms", payload: { limit: 1, offset: 1 }, as: Any }
            - { call: "GET /api/rooms", payload: {}, as: Any }
          assert:
            - "Page 1 (limit=1): exactly 1 item, total_count == 2, has_more == true"
            - "Page 2 (limit=1, offset=1): exactly 1 item, total_count == 2, has_more == false, and the two pages contain distinct room ids"
            - "Default call (no params): both rooms returned, total_count == 2, has_more == false (default limit 10)"

  - section: errors
    instances:
