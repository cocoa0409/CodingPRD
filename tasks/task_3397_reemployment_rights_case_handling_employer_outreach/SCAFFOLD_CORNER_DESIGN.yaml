        distinguishing_aspect: "Two of three core modules (16 hours, exams 90/88) cannot certify: the missing DOCUMENTATION core module fails the requirement check with 422 ERR_CERTIFICATION_REQUIREMENTS_UNMET regardless of hours."
        test_recipe:
          setup:
