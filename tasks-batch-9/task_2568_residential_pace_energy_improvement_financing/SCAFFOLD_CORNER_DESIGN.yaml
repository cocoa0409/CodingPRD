  # ===========================================================================
  - section: state_machines
    instances:
      - name: contractor_enroll_moves_pending_review_to_enrolled
        claim_type: valid_transition
        grounds:
          - state_machines.Contractor.PENDING_REVIEW_to_ENROLLED
          - endpoints[POST /pace/contractors/{id}/enroll]
        distinguishing_aspect: |
          The enroll trigger is the only path out of PENDING_REVIEW, and it must clear suspension_reason
          while leaving both score variants untouched at 10000 — enrollment is an eligibility decision,
          not a score event. A second enroll attempt must then fail, proving the transition consumed the
          only legal from-state.
        test_recipe:
          setup:
            - "Clock 2026-08-12; a single PENDING_REVIEW contractor whose licence runs to 2030-06-30 and whose warranty is 10 years (>= MIN_WARRANTY_YEARS 5) serving county 06073."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/contractors"
              payload: { legal_name: "Ridgeline Retrofit LLC", license_number: "CSLB-884120", license_expires_on: "2030-06-30", workmanship_warranty_years: 10, counties_served: ["06073"] }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { status_after: $.data.enrollment_status }
            - call: "POST /pace/contractors/${c1}/enroll"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { err_second: $.data.error_id }
          assert:
            - "200 with status_after == 'ENROLLED', suspension_reason null and version == 2"
            - "Scores are untouched by enrollment: workmanship_score == 10000 and lifetime_workmanship_score == 10000"
            - "Second enroll: 409 with err_second == 'ERR_CONTRACTOR_STATE_INVALID' (priority 18) because ENROLLED is not the declared from-state"
            - "Contractor.${c1}.version is still 2 after the rejected second attempt — a refused transition performs no write"

      - name: enroll_on_expired_license_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Contractor.PENDING_REVIEW_to_ENROLLED
          - validations[priority=36]
          - errors[ERR_LICENSE_EXPIRED]
        distinguishing_aspect: |
          The licence-currency precondition is evaluated against the LOGICAL clock, not wall time, and
          the comparison is strict (license_expires_on > now). A contractor whose licence lapsed six
          weeks ago must be refused with 422 ERR_LICENSE_EXPIRED and must remain PENDING_REVIEW, so a
          later clock rewind is the only way to enrol it.
        test_recipe:
          setup:
            - "Clock 2026-08-12; the contractor's licence expired on 2026-06-30 and its warranty (10 y) and counties_served are otherwise fine, so ERR_LICENSE_EXPIRED is the only possible failure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
