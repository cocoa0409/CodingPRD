              as: ProgramManager
              captures: { assess_id: "$.data.id" }
            - call: "POST /site-change-requests"
              payload: { site_id: "${site_a_id}", request_type: "SHUTDOWN", justification: "Lease ended", assessment_id: "${assess_id}" }
              as: ProgramManager
