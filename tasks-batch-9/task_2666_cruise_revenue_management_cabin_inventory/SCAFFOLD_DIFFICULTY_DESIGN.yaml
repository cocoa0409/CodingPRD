            - "Booking.${bk_w1}.booking_status == OPTION (earliest created_at wins the freed cabin)"
            - "Booking.${bk_w1}.deposit_due_date == 2026-08-22T00:00:00Z"
            - "Booking.${bk_w1}.net_ticket_cents == 300000 (the fare pinned at creation is not recomputed on promotion)"
            - "Booking.${bk_w2}.booking_status == WAITLISTED"
            - "Sailing.${sail_w}.lower_berths_sold == 2 and occupancy_pct == 10.00"
