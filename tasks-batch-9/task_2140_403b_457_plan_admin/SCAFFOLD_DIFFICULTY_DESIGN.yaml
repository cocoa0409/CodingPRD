  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: late_deposit_correction_posture_blocks_transfer_chain
        grounds:
          - state_machines.RemittanceBatch.WITHHELD_to_DEPOSITED
          - state_machines.RemittanceBatch.LATE_to_CORRECTION_PENDING
          - entities.VendorAccount.fields.pending_lost_earnings_cents
          - entities.Plan.fields.open_correction_count
          - entities.Plan.fields.compliance_posture
          - validations[priority=12]
          - errors[ERR_PLAN_UNDER_CORRECTION]
        distinguishing_aspect: |
          Four-hop transitive chain originating from POST /plan-admin/remittance-batches/{id}/deposit:
          the deposit sets compliance_state LATE (hop 1); LATE itself creates a
          RemittanceCorrection (hop 2); creating that correction credits
          VendorAccount.pending_lost_earnings_cents and raises Plan.open_correction_count to
          1 (hop 3); the non-zero count flips Plan.compliance_posture to UNDER_CORRECTION
          (hop 4), which rejects an unrelated, already vendor-accepted contract exchange with
          ERR_PLAN_UNDER_CORRECTION. Each link is caused by the previous link, not by the deposit call.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan, reported_participant_count 250."
            - "Two providers, each with an ACTIVE, non-stale agreement with the plan."
            - "One participant with a 5000000-cent contract at provider one and a 1000000-cent contract at provider two; Plan.open_correction_count is 0 and compliance_posture is CLEAR."
            - "A WITHHELD batch for [2026-07-01, 2026-07-16) with withholding_date 2026-07-15 and one 100000-cent line item on the first contract."
            - "A CONTRACT_EXCHANGE request for 1000000 cents from contract one to contract two, already ACCEPTED_BY_VENDOR by provider two."
            - "The clock is advanced to 2026-09-30T00:00:00Z."
