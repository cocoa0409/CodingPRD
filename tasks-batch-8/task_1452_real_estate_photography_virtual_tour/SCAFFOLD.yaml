    description: "Client accepts delivery (DELIVERED -> ACCEPTED)"
    roles: [ClientAgent]
    code: 200
    input: []
    output: ShootBooking
    side_effects: ["final_invoice computed; LicenseGrant ACTIVE; VirtualTour PUBLISHED; latest AssetBundle FINALIZED"]

  - method: POST
    path: "/shoot-bookings/{id}/reschedule"
