            - "Reading p1's report: error_id == ERR_FORBIDDEN_OWNERSHIP"

      - name: partner_can_dispute_own_finalized_report
        claim_type: exclusive_operation_allowed
        grounds: ["roles", "state_machines.RevenueReport.FINALIZED_to_DISPUTED"]
        excluded_because:
          difficulty_instance: r3_report_dispute_refinalize_cycle
          rationale: "The positive dispute path (own platform, FINALIZED) is exercised there."

  # ================================================== cross-cutting layers ====
  - section: cross_cutting_layers
    instances:
      - name: agreement_activation_pins_rate_snapshot
        claim_type: version_pinning
        grounds: ["state_machines.DistributionAgreement", "entities.DistributionAgreement.fields.locked_rev_share_bps_below"]
        distinguishing_aspect: "Version-pinning on approval: rate edits land only while NEGOTIATING; activation pins the current values (3500 edited pre-activation), and a suspend/re-activate cycle does NOT re-pin."
        test_recipe:
          setup: ["Channel ch; platform p1 ACTIVE; agreement ag created with below 3000 then edited to 3500 while NEGOTIATION, then ACTIVATED"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch VP", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "PATCH /v1/distributor-platforms/${p1}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
            - { call: "POST /v1/distribution-agreements", payload: { channel_id: "${ch}", platform_id: "${p1}", rev_share_bps_below: 3000, rev_share_bps_above: 4000, tier_threshold_cents: 100000, minimum_guarantee_cents: 0, effective_start_date: "2026-01-01", effective_end_date: "2026-12-31" }, as: PlatformAdmin, captures: { ag: $.data.id } }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { rev_share_bps_below: 3500 }, as: PlatformAdmin }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
          trigger:
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "SUSPENDED" }, as: PlatformAdmin }
            - { call: "PATCH /v1/distribution-agreements/${ag}", payload: { target_status: "ACTIVE" }, as: PlatformAdmin }
          assert:
            - "After activation: locked_rev_share_bps_below == 3500 (pinned from activation-time value, not the original 3000)"
            - "After suspend + re-activate: locked_rev_share_bps_below still == 3500 (no re-pin on reinstate)"

      - name: ops_run_expires_grants_at_window_end
        claim_type: ops_run_checkpoint
        grounds: ["state_machines.RightsGrant", "calculations.channel_posture_recompute"]
        distinguishing_aspect: "Checkpoint semantics: at 2026-08-19 the grant survives the ops-run; at 2026-08-20 (== window_end_utc, half-open) the ops-run expires it, and with no other grants the content flips to WINDOW_EXPIRED."
        test_recipe:
          setup: ["Channel ch; content ct AVAILABLE; grant g [2026-08-01, 2026-08-20) ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch OP", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "M540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-08-20T00:00:00Z", max_plays: 5 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
          trigger:
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-08-19T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/channels/${ch}/run-ops", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/_clock/set-current-utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/channels/${ch}/run-ops", payload: {}, as: PlatformAdmin }
          assert:
            - "After the 2026-08-19 run: RightsGrant.${g}.grant_status == ACTIVE and Channel.${ch}.ops_run_index == 1"
            - "After the 2026-08-20 run: grant_status == EXPIRED (now >= window_end, half-open)"
            - "ContentAsset.${ct}.content_status == WINDOW_EXPIRED (no remaining PENDING/ACTIVE grants)"
            - "Channel.${ch}.ops_run_index == 2"

      - name: snapshot_recompute_reconciles_derived_fields
        claim_type: derived_field_reconciliation
        grounds: ["entities.ChannelDaySnapshot.fields.watch_seconds", "calculations.peak_concurrent_viewers"]
        distinguishing_aspect: "Derived field reconciliation: recomputing the same (channel, date) upserts in place — watch_seconds grows 100 -> 250 after three more events, and snapshot.version increments."
        test_recipe:
          setup: ["Channel ch; platform p1; one CONTENT_WATCH event of 100s on 2026-09-01; initial snapshot computed"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch DR2", genre: "movies", timezone: "UTC" }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/distributor-platforms", payload: { name: "P1", reporting_tier: "STANDARD" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "CONTENT_WATCH", viewer_session_id: "s1", occurred_at_utc: "2026-09-01T01:00:00Z", watch_seconds: 100 }, as: PlatformAdmin }
            - { call: "POST /v1/channels/${ch}/snapshot-computations", payload: { snapshot_date: "2026-09-01" }, as: ChannelProgrammer, captures: { snap: $.data.id, sv1: $.data.version } }
          trigger:
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "CONTENT_WATCH", viewer_session_id: "s2", occurred_at_utc: "2026-09-01T02:00:00Z", watch_seconds: 100 }, as: PlatformAdmin }
            - { call: "POST /v1/viewership-events", payload: { channel_id: "${ch}", platform_id: "${p1}", event_type: "CONTENT_WATCH", viewer_session_id: "s3", occurred_at_utc: "2026-09-01T03:00:00Z", watch_seconds: 50 }, as: PlatformAdmin }
            - { call: "POST /v1/channels/${ch}/snapshot-computations", payload: { snapshot_date: "2026-09-01" }, as: ChannelProgrammer }
          assert:
            - "After first compute: watch_seconds == 100"
            - "After recompute: ChannelDaySnapshot.${snap}.watch_seconds == 250 (upsert, same id)"
            - "ChannelDaySnapshot.${snap}.version == ${sv1} + 1"

      - name: reconcile_revives_exhausted_campaign_on_down_adjustment
        claim_type: cascading_side_effects
        grounds: ["state_machines.AdBreak.AIRED_to_RECONCILED", "state_machines.AdCampaign.EXHAUSTED_to_ACTIVE"]
        distinguishing_aspect: "Reconcile down-adjustment cascade: a campaign exhausted at the exact committed budget revives to ACTIVE when actual impressions (0) drop spend below budget."
        test_recipe:
          setup: ["Loop PUBLISHED with break br decided by d1 (campaign c1 cpm 500, total 500, daily 500 -> EXHAUSTED at lock); br AIRED; no impression events"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch RV", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "M570", content_type: "MOVIE", runtime_seconds: 570, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { lp: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lp}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lp}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { br: $.data.id, br_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 500, daily_budget_cents: 500, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/ad-breaks/${br}/decision-runs", payload: { expected_break_version: "${br_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d1: "$.data[0].id" } }
            - { call: "POST /v1/playlist-loops/${lp}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/channels/${ch}/go-live", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/channels/${ch}", payload: {}, as: PlatformAdmin, captures: { cv: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lp}/publish", payload: { expected_channel_version: "${cv}" }, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${br}/mark-aired", payload: {}, as: ChannelProgrammer }
          trigger:
            - { call: "POST /v1/ad-breaks/${br}/reconcile", payload: {}, as: AdOps, as_user_id: "ops-1" }
          assert:
            - "Before reconcile: AdCampaign.${c1}.campaign_status == EXHAUSTED and spent_cents == 500"
            - "After reconcile: FillDecision.${d1}.decision_status == RECONCILED with actual_impressions == 0 and reconciled_cost_cents == 0"
            - "AdCampaign.${c1}.spent_cents == 0 and campaign_status == ACTIVE (auto-revived, flight valid)"
            - "AdBreak.${br}.break_status == RECONCILED"

      - name: creative_retire_voids_provisional_but_keeps_committed
        claim_type: conditional_cascade
        grounds: ["state_machines.AdCreative.APPROVED_to_RETIRED"]
        distinguishing_aspect: "Conditional cascade: retiring a creative voids only PROVISIONAL decisions; a COMMITTED decision of the same creative survives untouched."
        test_recipe:
          setup: ["Loop la LOCKED (d_committed COMMITTED via lock of 30s break ba); loop lb VALIDATED with break bb whose run placed d_prov PROVISIONAL — both decisions use creative cr1"]
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch CC", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "M570", content_type: "MOVIE", runtime_seconds: 570, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/rights-grants", payload: { channel_id: "${ch}", content_id: "${ct}", window_start_utc: "2026-08-01T00:00:00Z", window_end_utc: "2026-10-01T00:00:00Z", max_plays: 10 }, as: ContentLicensing, captures: { g: $.data.id } }
            - { call: "POST /v1/rights-grants/${g}/activate", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/ad-campaigns", payload: { advertiser_name: "Acme", iab_category: "IAB-9", total_budget_cents: 100000, daily_budget_cents: 100000, cpm_cents: 500, flight_start_date: "2026-08-01", flight_end_date: "2026-12-31" }, as: AdOps, captures: { c1: $.data.id } }
            - { call: "POST /v1/ad-creatives", payload: { campaign_id: "${c1}", brand: "Acme Soda", iab_category: "IAB-9", duration_seconds: 30 }, as: AdOps, as_user_id: "ops-1", captures: { cr1: $.data.id } }
            - { call: "POST /v1/ad-creatives/${cr1}/approve", payload: {}, as: AdQualityReviewer, as_user_id: "rev-1" }
            - { call: "POST /v1/ad-campaigns/${c1}/activate", payload: {}, as: AdOps, as_user_id: "ops-1" }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-01" }, as: ChannelProgrammer, captures: { la: $.data.id } }
            - { call: "POST /v1/playlist-loops/${la}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${la}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { ba: $.data.id, ba_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${la}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${ba}/decision-runs", payload: { expected_break_version: "${ba_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d_committed: "$.data[0].id" } }
            - { call: "POST /v1/playlist-loops/${la}/lock", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops", payload: { channel_id: "${ch}", broadcast_date: "2026-09-02" }, as: ChannelProgrammer, captures: { lb: $.data.id } }
            - { call: "POST /v1/playlist-loops/${lb}/entries", payload: { content_id: "${ct}" }, as: ChannelProgrammer }
            - { call: "POST /v1/playlist-loops/${lb}/ad-breaks", payload: { duration_seconds: 30 }, as: ChannelProgrammer, captures: { bb: $.data.id, bb_v: $.data.version } }
            - { call: "POST /v1/playlist-loops/${lb}/validate", payload: {}, as: ChannelProgrammer }
            - { call: "POST /v1/ad-breaks/${bb}/decision-runs", payload: { expected_break_version: "${bb_v}" }, as: AdOps, as_user_id: "ops-1", captures: { d_prov: "$.data[0].id" } }
          trigger:
            - { call: "POST /v1/ad-creatives/${cr1}/retire", payload: {}, as: AdOps, as_user_id: "ops-1" }
          assert:
            - "FillDecision.${d_prov}.decision_status == VOIDED (provisional cascade)"
            - "FillDecision.${d_committed}.decision_status == COMMITTED (already bought — untouched)"
            - "AdBreak.${bb}.break_status == MARKED; AdBreak.${ba}.break_status == DECIDED"
            - "AdCreative.${cr1}.creative_status == RETIRED"

      - name: dual_variant_coverage_stub
        claim_type: dual_variant_calculation
        grounds: ["calculations.fill_rate", "calculations.revenue_share_statement"]
        excluded_because:
          difficulty_instance: r1_direct_vs_effective_fill_rate_diverge_on_house_substitution
          rationale: "Both dual-variant domains (fill on breaks, revenue on reports) are covered by the two r1 instances."

      - name: cascade_coverage_stub
        claim_type: cascading_side_effects
        grounds: ["state_machines.ContentAsset.AVAILABLE_to_WINDOW_EXPIRED"]
        excluded_because:
          difficulty_instance: r4_publish_plays_exhaustion_cascade_reverts_validated_loops
          rationale: "Depth-4 publish cascade asserted there; pause cascade in r4_campaign_pause_cascade_voids_provisionals_and_unmarks_break."

  # ====================================================== consistency model ====
  - section: consistency_model
    instances:
      - name: mutations_visible_immediately
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a created content asset is retrievable in the very next GET with the same fields, and a status mutation is visible in the following list call."
        test_recipe:
          setup: ["A platform exists (unrelated seed)"]
          setup_api_calls:
            - { call: "POST /v1/distributor-platforms", payload: { name: "Seed", reporting_tier: "STANDARD" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/content-assets", payload: { title: "Immediate", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "GET /v1/content-assets/${ct}", payload: {}, as: ContentLicensing }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
            - { call: "GET /v1/content-assets?content_status=AVAILABLE", payload: {}, as: ContentLicensing }
          assert:
            - "GET after create returns title == \"Immediate\" and runtime_seconds == 540"
            - "Filtered list after mark-available contains ${ct} (mutation visible without delay)"
