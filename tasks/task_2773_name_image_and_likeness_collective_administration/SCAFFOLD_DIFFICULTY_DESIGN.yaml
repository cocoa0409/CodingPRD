  - rule_id: boundary_precision_check
    instances:

      - name: funding_posture_restricted_at_exact_seventy_five_percent
        grounds:
          - calculations.calc_collective_funding_posture
          - global_constants.RESTRICTED_COVERAGE_PCT
          - entities.Collective.fields.funding_posture
          - entities.Collective.fields.committed_unreleased_cents
        distinguishing_aspect: |
          Metric: the integer cross-multiplied coverage ratio
          available_cents * 100 versus committed_unreleased_cents * 75, asserted on
          POST /nil/deal-contracts. With available 300000 and committed 400000 the
          two sides are exactly equal (30000000 == 30000000) and the >= comparison
          must yield RESTRICTED; adding a single further cent of commitment makes
          committed 400001 and the right side 30000075, so the very next
          recomputation must flip to FROZEN. The boundary is walked from both
          sides in one recipe with no floating point anywhere.
        test_recipe:
          setup:
            - "A collective whose only settled contribution is gross 307723 -> fee 7723 -> net exactly 300000, all UNRESTRICTED, so settled_net_funds_cents is 300000 and released_total_cents is 0, making available_cents 300000."
            - "One ENROLLED WOMENS_BASKETBALL athlete with the 5000000-cent annual cap far away."
            - "committed_unreleased_cents is 0 before the trigger, so funding_posture is OPEN and validation priority 23 admits both contract creations."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Gator Boundary Fund", institution_name: "Florida Institution B", institution_ipeds_code: "011100", home_state_code: "FL", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Gator Club", annual_dues_cents: 75000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Pia Papa", email: "pia@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 307723, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Quin Quebec", portal_user_id: "ath-quin", sport: "WOMENS_BASKETBALL", class_year: 2030 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { posture_before: $.data.funding_posture, settled_before: $.data.settled_net_funds_cents }
          trigger:
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 400000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc1_id: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { posture_at_boundary: $.data.funding_posture, committed_at_boundary: $.data.committed_unreleased_cents }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 1, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc2_id: $.data.id }
          assert:
            - "${settled_before} == 300000"
            - "${posture_before} == OPEN"
            - "Contribution.${contrib_id}.processing_fee_cents == 7723"
            - "Contribution.${contrib_id}.net_amount_cents == 300000"
            - "${committed_at_boundary} == 400000"
            - "${posture_at_boundary} == RESTRICTED"
            - "Collective.${col_id}.committed_unreleased_cents == 400001"
            - "Collective.${col_id}.funding_posture == FROZEN"
            - "Collective.${col_id}.settled_net_funds_cents == 300000"
            - "DealContract.${dc1_id}.lifecycle_status == DRAFT"
            - "DealContract.${dc2_id}.lifecycle_status == DRAFT"
            - "At the boundary 300000*100 == 400000*75 == 30000000 so >= holds and the posture is RESTRICTED; one cent more commitment gives 30000000 < 30000075 and the posture is FROZEN, so the inclusive comparison is asserted from both sides."

      - name: roster_batch_requires_nonempty_eligible_athlete_set
        grounds:
          - calculations.calc_roster_share_allocation
          - validations.priority_27_roster_allocation_nonempty_input_set
          - errors.ERR_NO_ELIGIBLE_ATHLETES
          - endpoints."POST /nil/deal-contracts/roster-allocations"
        distinguishing_aspect: |
          A different metric and a different endpoint from
          funding_posture_restricted_at_exact_seventy_five_percent: this is the
          zero-cardinality edge of calc_roster_share_allocation's input set on
          POST /nil/deal-contracts/roster-allocations, not a numeric coverage
          ratio. Two athletes exist on the collective but neither qualifies — one
          plays the wrong sport, the other has left for the portal — so the
          eligible set has size 0 and the batch must be rejected wholesale rather
          than dividing 1000000 by zero or creating an empty batch.
        test_recipe:
          setup:
            - "A collective with 1958000 cents of settled ROSTER_POOL net funds, so funding_posture is OPEN and priority 24 admits the request."
            - "Athlete R1 plays FOOTBALL but is moved to PORTAL_ENTERED, so it is not ENROLLED."
            - "Athlete R2 is ENROLLED but plays SOFTBALL, so it does not match the requested sport."
            - "The batch therefore targets sport FOOTBALL with an eligible set of exactly zero athletes."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Empty Set Collective", institution_name: "Texas Institution C", institution_ipeds_code: "012100", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Pool Club", annual_dues_cents: 120000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Ravi Romeo", email: "ravi@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 2000000, source_kind: "ONE_TIME_GIFT", designation: "ROSTER_POOL", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Rita Romeo", portal_user_id: "ath-rita", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath1_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Sam Sierra", portal_user_id: "ath-sam", sport: "SOFTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath2_id: $.data.id }
            - call: "POST /nil/athletes/${ath1_id}/eligibility-changes"
              payload: { change: "ENTER_PORTAL" }
              as: ComplianceOfficer
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { col_ver: $.data.version, posture_before: $.data.funding_posture }
          trigger:
            - call: "POST /nil/deal-contracts/roster-allocations"
              payload: { collective_id: "${col_id}", allocation_batch_code: "B9", sport: "FOOTBALL", pool_amount_cents: 1000000, allocation_mode: "EQUAL_SHARE", effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "ROSTER_POOL", expected_collective_version: "${col_ver}" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "${posture_before} == OPEN"
            - "${err_id} == ERR_NO_ELIGIBLE_ATHLETES"
            - "The HTTP status is 422."
            - "Collective.${col_id}.committed_unreleased_cents == 0"
            - "Collective.${col_id}.version == ${col_ver}"
            - "Collective.${col_id}.funding_posture == OPEN"
            - "Athlete.${ath1_id}.annual_committed_value_cents == 0"
            - "Athlete.${ath2_id}.annual_committed_value_cents == 0"
            - "The rejection is all-or-nothing: no DealContract row carries allocation_batch_code B9, and the collective's OCC version is not bumped by the failed batch."

  - rule_id: cross_entity_state_dependency
    instances:

      - name: contract_creation_requires_athlete_enrolled
        grounds:
          - validations.priority_26_athlete_enrolled_for_contracting
          - state_machines.sm_athlete_eligibility_status
          - errors.ERR_ATHLETE_NOT_ENROLLED
          - endpoints."POST /nil/deal-contracts"
        distinguishing_aspect: |
          Entity pair: DealContract depends on Athlete.eligibility_status. Creating
          a contract is refused while the athlete is INELIGIBLE and succeeds
          unchanged once the athlete is REINSTATEd to ENROLLED, with no other input
          altered between the two attempts, so the outcome is attributable purely
          to the state of the other entity.
        test_recipe:
          setup:
            - "A collective and one athlete created in the initial ENROLLED state."
            - "The compliance officer records DECLARE_INELIGIBLE, moving eligibility_status to INELIGIBLE."
            - "committed_unreleased_cents is 0, so funding_posture is OPEN and validation priority 23 does not interfere."
