              payload: { cash_collected_cents: 9800 }
              as: RouteSupervisor
            - call: "POST /dsd/route-settlements/${s2_id}/balance"
              payload: { cash_collected_cents: 9799 }
              as: RouteSupervisor
          assert:
            - "RouteSettlement.${s1_id}.variance_cents == -200 and status == BALANCED (inclusive boundary)"
            - "RouteSettlement.${s2_id}.variance_cents == -201 and status == OPEN (one cent past tolerance)"
            - "both balance calls returned 200 (out-of-tolerance is a state outcome, not an error)"

      - name: route_day_load_at_exact_capacity_vs_one_case_over
        grounds:
          - calculations.route_day_capacity
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Boundary on the case-count metric at the load endpoint (different
          metric and endpoint from the variance boundary): loading exactly
          capacity (100) succeeds; 101 is rejected and the route day remains
          PLANNED so the corrected 100-case load can still succeed.
        test_recipe:
          setup:
            - "Clock 2026-09-01T09:00:00Z. Store assigned TUE. Route base 100, truck cap 200 -> non-event capacity 100. Product P loaded in two lots."
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
          trigger:
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-A", expiration_date: "2026-09-20", loaded_cases: 100 }, { product_id: "${prod_id}", lot_code: "L-B", expiration_date: "2026-09-20", loaded_cases: 1 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-A", expiration_date: "2026-09-20", loaded_cases: 60 }, { product_id: "${prod_id}", lot_code: "L-B", expiration_date: "2026-09-20", loaded_cases: 40 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          assert:
            - "the first load returns 422 and err == ERR_CAPACITY_EXCEEDED (101 > 100)"
            - "RouteDay.${day_id}.capacity_cases == 100 and loaded_cases == 100 after the second load"
            - "RouteDay.${day_id}.status == LOADED after the exact-capacity retry"

