    roles: [InventoryPlanner]
    code: 200
    input: []
    output: ResaleListing
    side_effects: ["markdown_step incremented and resale_pricing re-run when markdown_step < MAX_MARKDOWN_STEPS, state EXPIRED -> LISTED, listed_at re-stamped", "state EXPIRED -> WITHDRAWN when the ladder is exhausted"]
  - method: POST
    path: "/resale-listings/{listing_id}/sale"
    description: "Record the sale of a listed unit and recognise recovered revenue"
    roles: [InventoryPlanner]
    code: 200
    input: [sale_price_cents]
    output: ResaleListing
    side_effects: ["state LISTED -> SOLD, sold_at stamped", "channel_fee_cents and net_recovery_cents re-derived from sale_price_cents", "unit RETIRED -> SOLD (realized_revenue_cents is NOT touched: end-of-life money reaches unit_economics through the SOLD listing's net_recovery_cents, so adding it here would double-count)", "style unit-economics end-of-life inputs refreshed"]

  # --- test-driving surface ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["every date and instant comparison in §1.3 and §1.4 reads the new logical clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- authentication & authorization ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty on any request"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of Member, WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin"
  - id: ERR_ACTOR_NOT_FOUND
    http: 401
    condition: "role Member or WarehouseTech presented with an X-User-ID that is not an existing Member id or Technician id"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Member acts on a member, reservation, shipment, damage claim, fit feedback or ledger entry belonging to a different member"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the technician signing a repair is the same technician who filed the job's inspection"
  - id: ERR_TECHNICIAN_NOT_CERTIFIED
    http: 403
    condition: "repair or quarantine clearance attempted without repair_certified, or photography attempted without photography_certified"
  - id: ERR_TECHNICIAN_SUSPENDED
    http: 403
    condition: "the acting technician's status is SUSPENDED"
  # --- existence ---
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "membership plan id in the path or body does not resolve"
  - id: ERR_TECHNICIAN_NOT_FOUND
    http: 404
    condition: "technician id in the path does not resolve"
  - id: ERR_STYLE_NOT_FOUND
    http: 404
    condition: "style id in the path or body does not resolve"
  - id: ERR_RENTAL_UNIT_NOT_FOUND
    http: 404
    condition: "rental unit id in the path or body (including preferred_unit_id) does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member id in the path or body does not resolve"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "reservation id in the path or body does not resolve"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment id in the path does not resolve"
  - id: ERR_JOB_NOT_FOUND
    http: 404
    condition: "reverse-logistics job id in the path does not resolve"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id in the path does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "damage claim id in the path does not resolve"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "resale listing id in the path or supersedes_listing_id does not resolve"
  - id: ERR_FEE_ENTRY_NOT_FOUND
    http: 404
    condition: "fee ledger entry id in the path does not resolve"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing or has the wrong JSON type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed body field or enum list filter carries a value outside its declared set"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative or non-integer"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "plan code, employee_code, style_code, unit_code or member email already exists"
  # --- optimistic concurrency ---
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version on a swap does not equal the member's current version"
  - id: ERR_STALE_UNIT_VERSION
    http: 412
    condition: "expected_rental_unit_version on a resale listing does not equal the unit's current version"
  # --- state preconditions ---
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "a reservation, swap, return initiation or outbound shipping action is attempted while the member is PAUSED, DELINQUENT or CANCELLED"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested trigger is not declared from the resource's current state in §1.2"
  - id: ERR_RESOURCE_TERMINAL
    http: 409
    condition: "an action is attempted on a resource already in one of its terminal states"
  # --- safety and reconditioning integrity ---
  - id: ERR_QUARANTINE_HOLD_ACTIVE
    http: 409
    condition: "cleaning, repair, photography or restock attempted while the unit's quarantine_hold is set"
  - id: ERR_UNIT_CONDEMNED
    http: 409
    condition: "photography, restock or allocation attempted on a unit whose condition_state is CONDEMNED"
  - id: ERR_OPEN_CLAIM_BLOCKS_RESTOCK
    http: 409
    condition: "restock attempted while a DamageClaim on the unit and turn is OPEN, ASSESSED or DISPUTED"
  - id: ERR_REPAIR_PENDING
    http: 409
    condition: "cleaning sign-off attempted before the job's required repair leg has completed"
  - id: ERR_REPAIR_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a further repair attempt is signed off after repair_attempts already reached REPAIR_ATTEMPT_CAP"
  # --- constraint satisfaction ---
  - id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http: 409
    condition: "a dispute is filed after dispute_round already reached MAX_DISPUTE_ROUNDS"
  - id: ERR_DISPUTE_WINDOW_CLOSED
    http: 409
    condition: "a charged claim is disputed more than DISPUTE_WINDOW_DAYS after charged_at"
  - id: ERR_SIZE_NOT_IN_SIZE_RUN
    http: 422
    condition: "requested_size is not a member of the style's size_run"
  - id: ERR_UNIT_NOT_ALLOCATABLE
    http: 409
    condition: "a named preferred_unit_id belongs to another style or size, or is not IN_STOCK and FLOOR_READY, or is on quarantine hold"
  - id: ERR_UNIT_TURNS_EXHAUSTED
    http: 409
    condition: "a named preferred_unit_id has already completed its style's expected_rental_turns_per_unit"
  - id: ERR_INVALID_SUPERSEDE_TARGET
    http: 422
    condition: "supersedes_listing_id references a listing on another unit or a listing not in EXPIRED"
  - id: ERR_LISTING_ALREADY_ACTIVE
    http: 409
    condition: "a DRAFT or LISTED resale listing already exists for the unit"
  - id: ERR_FEEDBACK_NOT_ELIGIBLE
    http: 409
    condition: "fit feedback filed on a reservation that has not reached RETURNED or CLOSED"
  - id: ERR_FEEDBACK_ALREADY_EXISTS
    http: 409
    condition: "a second fit feedback is filed for the same reservation"
  - id: ERR_SHIPMENT_EXCEPTION_CAP_REACHED
    http: 409
    condition: "a further exception or re-dispatch is attempted after exception_count reached SHIPMENT_EXCEPTION_CAP"
  - id: ERR_SHIPMENT_ALREADY_EXISTS
    http: 409
    condition: "a second outbound leg, or a second inbound leg, is created for the same reservation"
  # --- temporal ---
  - id: ERR_INVALID_RENTAL_WINDOW
    http: 422
    condition: "requested_end_date is not after requested_start_date, or the window length falls outside MIN_RENTAL_DAYS..MAX_RENTAL_DAYS"
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "requested_start_date is earlier than the current logical clock date"
  - id: ERR_UNIT_WINDOW_COLLISION
    http: 409
    condition: "a named preferred_unit_id is already committed over an interval that overlaps the requested window plus the recondition buffer"
  - id: ERR_SHIPPING_CADENCE_COLLISION
    http: 409
    condition: "an outbound leg's planned_ship_date falls inside the closed cadence window of another outbound leg of the same member"
  - id: ERR_LISTING_WINDOW_OPEN
    http: 409
    condition: "expiration attempted before LISTING_WINDOW_DAYS have elapsed since listed_at"
  # --- referential ---
  - id: ERR_UNIT_HAS_ACTIVE_COMMITMENT
    http: 409
    condition: "retirement attempted while the unit holds a live reservation or an unresolved damage claim"
  - id: ERR_UNIT_NOT_RETIRED
    http: 409
    condition: "a resale listing is created for a unit whose availability_state is not RETIRED"
  # --- fiscal ---
  - id: ERR_ITEM_SLOTS_EXHAUSTED
    http: 409
    condition: "a new reservation would exceed the plan's item_slots for the member"
  - id: ERR_SWAP_ALLOWANCE_EXHAUSTED
    http: 409
    condition: "a swap is requested after the plan's monthly_swaps_allowed is used up in the current calendar month"
  - id: ERR_WAIVER_NOT_AVAILABLE
    http: 409
    condition: "waiver absorption requested while the member has no active waiver or insufficient remaining coverage"
  - id: ERR_NOTHING_TO_CHARGE
    http: 409
    condition: "a charge or UPHELD resolution is attempted on a claim whose net_fee_cents is zero"
  - id: ERR_SETTLEMENT_EXCEEDS_BALANCE
    http: 422
    condition: "settlement amount_cents is not positive or exceeds the member's outstanding_fee_cents"
  - id: ERR_SALE_PRICE_BELOW_FLOOR
    http: 422
    condition: "sale_price_cents is below the listing's maximum permitted discount off list_price_cents"
  - id: ERR_OUTSTANDING_BALANCE
    http: 409
    condition: "cancellation attempted while the member still owes fees"
  - id: ERR_UNITS_STILL_OUT
    http: 409
    condition: "pause attempted while the member still holds units out"

# =============================================================================
# 1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: Member
    description: "A subscriber who reserves, swaps, returns, rates and disputes; sees only their own resources"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /reservations"
      - "POST /reservations/{reservation_id}/swap"
      - "POST /reservations/{reservation_id}/return-initiation"
      - "POST /reservations/{reservation_id}/fit-feedback"
      - "PATCH /members/{member_id}/style-preferences"
      - "POST /damage-claims/{claim_id}/disputes"
    shared_operations:
      - "GET /members/{member_id}"
      - "GET /members/{member_id}/damage-risk"
      - "GET /members/{member_id}/personalization-summary"
      - "POST /members/{member_id}/pause"
      - "POST /members/{member_id}/resume"
      - "POST /members/{member_id}/fee-settlements"
      - "POST /members/{member_id}/cancellation"
      - "POST /reservations/{reservation_id}/release"
      - "GET /reservations, GET /reservations/{reservation_id}"
      - "GET /shipments, GET /shipments/{shipment_id}"
      - "GET /damage-claims, GET /damage-claims/{claim_id}"
      - "GET /fee-ledger-entries, GET /fee-ledger-entries/{entry_id}"
      - "GET /fit-feedback, GET /fit-feedback/{feedback_id}"
      - "GET /styles, GET /styles/{style_id}, GET /rental-units, GET /rental-units/{unit_id}, GET /membership-plans, GET /membership-plans/{plan_id}"
  - name: WarehouseTech
    description: "Reverse-logistics operator who receives, inspects, cleans, repairs, photographs and restocks units"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /shipments/{shipment_id}/receipt"
      - "POST /reverse-logistics-jobs/{job_id}/inspections"
      - "POST /reverse-logistics-jobs/{job_id}/cleaning-completion"
      - "POST /reverse-logistics-jobs/{job_id}/repair-completion"
      - "POST /reverse-logistics-jobs/{job_id}/quarantine-clearance"
      - "POST /reverse-logistics-jobs/{job_id}/photography"
      - "POST /reverse-logistics-jobs/{job_id}/restock"
    shared_operations:
      - "POST /shipments"
      - "POST /shipments/{shipment_id}/dispatch"
      - "POST /shipments/{shipment_id}/delivery"
      - "POST /shipments/{shipment_id}/exception"
      - "GET /reverse-logistics-jobs, GET /reverse-logistics-jobs/{job_id}"
      - "GET /inspections, GET /inspections/{inspection_id}"
      - "GET /damage-claims, GET /damage-claims/{claim_id}"
      - "GET /reservations, GET /reservations/{reservation_id}, GET /shipments, GET /shipments/{shipment_id}"
      - "GET /styles, GET /styles/{style_id}, GET /rental-units, GET /rental-units/{unit_id}, GET /technicians, GET /technicians/{technician_id}, GET /membership-plans, GET /membership-plans/{plan_id}"
  - name: ClaimsAdjuster
    description: "Damage and loss adjudicator who assesses, waives, charges and resolves disputes; never touches physical reconditioning"
    identity: "opaque"
    exclusive_operations:
      - "POST /damage-claims/{claim_id}/assessment"
      - "POST /damage-claims/{claim_id}/waiver"
      - "POST /damage-claims/{claim_id}/charge"
      - "POST /damage-claims/{claim_id}/dispute-resolution"
    shared_operations:
      - "GET /damage-claims, GET /damage-claims/{claim_id}"
      - "GET /inspections, GET /inspections/{inspection_id}"
      - "GET /reverse-logistics-jobs, GET /reverse-logistics-jobs/{job_id}"
      - "GET /members, GET /members/{member_id}, GET /members/{member_id}/damage-risk"
      - "GET /fee-ledger-entries, GET /fee-ledger-entries/{entry_id}"
      - "GET /reservations, GET /reservations/{reservation_id}"
      - "GET /styles, GET /styles/{style_id}, GET /rental-units, GET /rental-units/{unit_id}, GET /technicians, GET /technicians/{technician_id}, GET /membership-plans, GET /membership-plans/{plan_id}"
  - name: InventoryPlanner
    description: "Merchandising and asset owner who acquires styles and units, plans depth, retires units and runs resale recovery"
    identity: "opaque"
    exclusive_operations:
      - "POST /styles"
      - "PATCH /styles/{style_id}/depth-plan"
      - "POST /styles/{style_id}/rental-units"
      - "POST /rental-units/{unit_id}/retirement"
      - "POST /resale-listings"
      - "POST /resale-listings/{listing_id}/expiration"
      - "POST /resale-listings/{listing_id}/reprice"
      - "POST /resale-listings/{listing_id}/sale"
    shared_operations:
      - "GET /styles/{style_id}/unit-economics"
      - "GET /resale-listings, GET /resale-listings/{listing_id}"
      - "GET /reverse-logistics-jobs, GET /reverse-logistics-jobs/{job_id}"
      - "GET /inspections, GET /inspections/{inspection_id}"
      - "GET /reservations, GET /reservations/{reservation_id}, GET /shipments, GET /shipments/{shipment_id}"
      - "GET /fit-feedback, GET /fit-feedback/{feedback_id}"
      - "GET /styles, GET /styles/{style_id}, GET /rental-units, GET /rental-units/{unit_id}, GET /membership-plans, GET /membership-plans/{plan_id}"
  - name: PlatformAdmin
    description: "Operator who provisions plans, technicians and memberships and drives the logical clock; cannot reserve, inspect, adjudicate or merchandise"
    identity: "opaque"
    exclusive_operations:
      - "POST /membership-plans"
      - "POST /technicians"
      - "PATCH /technicians/{technician_id}"
      - "POST /members"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /members/{member_id}/pause"
      - "POST /members/{member_id}/resume"
      - "POST /members/{member_id}/fee-settlements"
      - "POST /members/{member_id}/cancellation"
      - "POST /reservations/{reservation_id}/release"
      - "POST /shipments"
      - "POST /shipments/{shipment_id}/dispatch"
      - "POST /shipments/{shipment_id}/delivery"
      - "POST /shipments/{shipment_id}/exception"
      - "GET /members, GET /members/{member_id}, GET /members/{member_id}/damage-risk, GET /members/{member_id}/personalization-summary"
      - "GET /styles/{style_id}/unit-economics"
      - "GET /resale-listings, GET /resale-listings/{listing_id}"
      - "GET everything else in the read surface"
