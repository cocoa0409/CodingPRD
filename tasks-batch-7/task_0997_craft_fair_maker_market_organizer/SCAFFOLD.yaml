  - method: GET
    path: "/applications/{app_id}"
    description: "Canonical single VendorApplication read"
    roles: [EventCoordinator, Treasurer, Juror, Vendor, PlatformAdmin]
    code: 200
    input: []
    output: VendorApplication
    side_effects: []

  - method: GET
    path: "/applications"
    description: "Filtered list of VendorApplications (FK reverse-reachability)"
