              as: InnovationLead
              captures: { cw_bc_id: $.data.id }
            - call: "POST /business-cases/${cw_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 5.0000 }
              as: InnovationLead
            - call: "POST /innovation-projects/${cw_p_id}/gate-reviews"
              payload: { gate_id: "${cw_g2_id}", scheduled_at: "2026-08-05T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-cw"
              captures: { cw_gr_id: $.data.id }
            - call: "POST /gate-reviews/${cw_gr_id}/open"
              as: GateChair
              as_user_id: "chair-cw"
            - call: "POST /gate-reviews/${cw_gr_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE_WITH_CONDITIONS", rationale: "Capacity letter outstanding." }
              as: FunctionalReviewer
              as_user_id: "rev-ops-cw"
            - call: "POST /gate-reviews/${cw_gr_id}/close"
              payload: { conditions: "Confirm co-packer capacity in writing.", conditions_due_at: "2026-08-31T00:00:00Z" }
              as: GateChair
              as_user_id: "chair-cw"
          trigger:
            - call: "POST /gate-reviews/${cw_gr_id}/expire-conditions"
