            - { call: "POST /intake-applications/${app_a}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_a}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_a}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_a}/open-case", payload: { service_level: "EXTENDED" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_a: "$.data.id", case_a_v: "$.data.version" } }
            - { call: "POST /cases/${case_a}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case_a_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "POST /clients", payload: { full_name: "Cli B", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_b: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_b}", case_type: "EVICTION_DEFENSE", opposing_party_name: "Y", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_b: "$.data.id" } }
            - { call: "POST /intake-applications/${app_b}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_b}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_b}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_b}/open-case", payload: { service_level: "EXTENDED" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_b: "$.data.id", case_b_v: "$.data.version" } }
            - { call: "POST /clients", payload: { full_name: "Cli C", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_c: "$.data.id" } }
