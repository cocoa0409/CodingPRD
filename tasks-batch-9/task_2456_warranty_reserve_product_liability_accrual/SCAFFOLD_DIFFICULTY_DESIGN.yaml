          assert:
            - "ProductFamily.${fam_f_id}.observed_history_months == 12, observed_exposure_units == 5000, history_maturity_status == MATURE"
            - "ProductFamily.${fam_g_id}.observed_history_months == 12, observed_exposure_units == 4999, history_maturity_status == LIMITED"
