          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Sweep Sam", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "56 Lost Ln" }, as: Applicant, captures: { app_id: $.data.id } }
