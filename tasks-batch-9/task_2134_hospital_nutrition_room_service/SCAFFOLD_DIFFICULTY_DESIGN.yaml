  - rule_id: resource_temporal_overlap
    instances:
      - name: procedure_hold_buffered_half_open_intervals_touch_without_colliding
        grounds:
          - validations[priority=29]
          - errors[ERR_PROCEDURE_HOLD_OVERLAP]
          - entities.ProcedureHold.fields.buffered_start_at
          - entities.ProcedureHold.fields.buffered_end_at
        distinguishing_aspect: |
          Interval semantics on the Patient resource: intervals are BUFFERED and HALF-OPEN, so a new
          hold whose buffered_start_at equals an existing buffered_end_at (10:30 meeting 10:30) is
          accepted, while a hold whose 45-minute pre-buffer pulls its start back to 09:15 inside the
          existing [07:30, 10:30) window is rejected with 409.
        test_recipe:
          setup:
            - "One admitted patient exists on ward W5E."
            - "A SCHEDULED hold H1 runs 08:00-10:00 on 2026-08-02 with buffer_before_minutes 30 and buffer_after_minutes 30, so its buffered interval is [07:30, 10:30)."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/patients"
              payload: { ward_id: "${w_id}", mrn: "MRN-I001", full_name: "Ivo Petrov", age_years: 62 }
              as: DietClerk
              as_user_id: "u-clerk-1"
              captures: { p_id: $.data.id }
            - call: "POST /nutrition/procedure-holds"
              payload: { patient_id: "${p_id}", procedure_code: "ENDO-01", npo_kind: "NPO_STRICT", hold_start_at: "2026-08-02T08:00:00Z", hold_end_at: "2026-08-02T10:00:00Z", buffer_before_minutes: 30, buffer_after_minutes: 30 }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /nutrition/procedure-holds"
              payload: { patient_id: "${p_id}", procedure_code: "CT-02", npo_kind: "NPO_CLEAR_LIQUIDS", hold_start_at: "2026-08-02T10:30:00Z", hold_end_at: "2026-08-02T12:00:00Z", buffer_before_minutes: 0, buffer_after_minutes: 0 }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { h2_id: $.data.id }
            - call: "POST /nutrition/procedure-holds"
              payload: { patient_id: "${p_id}", procedure_code: "US-03", npo_kind: "NPO_STRICT", hold_start_at: "2026-08-02T10:00:00Z", hold_end_at: "2026-08-02T11:00:00Z", buffer_before_minutes: 45, buffer_after_minutes: 0 }
              as: Physician
              as_user_id: "u-phys-1"
              captures: { err: $.data.error_id }
          assert:
            - "ProcedureHold.${h1_id}.buffered_start_at == \"2026-08-02T07:30:00.000Z\""
            - "ProcedureHold.${h1_id}.buffered_end_at == \"2026-08-02T10:30:00.000Z\""
            - "the touching hold is created with status 201 and ProcedureHold.${h2_id}.status == SCHEDULED"
            - "ProcedureHold.${h2_id}.buffered_start_at == \"2026-08-02T10:30:00.000Z\""
            - "the third create returns status 409 with data.error_id == \"ERR_PROCEDURE_HOLD_OVERLAP\""
            - "GET /nutrition/procedure-holds?patient_id=${p_id} returns total_count == 2"

      - name: meal_period_windows_closed_interval_rejects_touching_windows_on_same_ward
        grounds:
          - validations[priority=28]
          - errors[ERR_MEAL_PERIOD_WINDOW_OVERLAP]
          - entities.MealPeriod.fields.window_start_at
          - entities.MealPeriod.fields.window_end_at
        distinguishing_aspect: |
          Interval semantics on the Ward resource, geometrically opposite to the ProcedureHold rule:
          windows carry no buffers and are compared as CLOSED intervals, so a period starting exactly
          at another period's 13:00 window end IS rejected on the same ward, while the identical
          clash on a different ward is accepted because the tray line is the contended resource.
        test_recipe:
          setup:
            - "Two ACTIVE wards exist: W5E and W6N."
            - "Ward W5E already has a PLANNED LUNCH period for 2026-08-02 with window 11:30-13:00."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w1_id: $.data.id }
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 6 North", code: "W6N", tray_line_capacity_per_window: 16, delivery_lead_minutes: 25 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w2_id: $.data.id }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w1_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T10:30:00Z", window_start_at: "2026-08-02T11:30:00Z", window_end_at: "2026-08-02T13:00:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp1_id: $.data.id }
          trigger:
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w1_id}", period_code: "DINNER", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T12:30:00Z", window_start_at: "2026-08-02T13:00:00Z", window_end_at: "2026-08-02T14:30:00Z", production_capacity_trays: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
            - call: "POST /nutrition/meal-periods"
              payload: { ward_id: "${w2_id}", period_code: "LUNCH", service_date: "2026-08-02", order_cutoff_at: "2026-08-02T11:00:00Z", window_start_at: "2026-08-02T12:00:00Z", window_end_at: "2026-08-02T13:30:00Z", production_capacity_trays: 16 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { mp3_id: $.data.id }
          assert:
            - "the same-ward touching window returns status 409 with data.error_id == \"ERR_MEAL_PERIOD_WINDOW_OVERLAP\""
            - "the other-ward overlapping window is created with status 201 and MealPeriod.${mp3_id}.status == PLANNED"
            - "GET /nutrition/meal-periods?ward_id=${w1_id} returns total_count == 1"
            - "GET /nutrition/meal-periods?ward_id=${w2_id} returns total_count == 1"

  - rule_id: compensating_invariant
    instances:
      - name: tray_slot_count_conserved_across_validate_then_cancel
        grounds:
          - state_machines.MealOrder.PENDING_VALIDATION_to_VALIDATED
          - state_machines.MealOrder.VALIDATED_to_CANCELLED
          - entities.MealPeriod.fields.committed_tray_count
          - entities.MealPeriod.fields.committed_food_cost_cents
          - calculations.meal_period_cost_rollup
        distinguishing_aspect: |
          The conserved quantity is a discrete slot COUNT pinned as
          MealPeriod.committed_tray_count == count(MealOrder where meal_period_id == P.id AND
          fulfillment_status IN {VALIDATED, IN_PRODUCTION, PLATED, DELIVERED}). Validate reserves one
          slot (1) and cancel is its compensating action, so the count returns to 0 with the cents
          ledger and the whole cost rollup back at 0 - no drift left behind.
        test_recipe:
          setup:
            - "A PLANNED LUNCH period with production_capacity_trays 5 and no cost ceiling holds one PENDING_VALIDATION tray of 1 x SOU-BRO with food_cost_cents 211."
            - "committed_tray_count is 0 and committed_food_cost_cents is 0 before the trigger."
          setup_api_calls:
            - call: "POST /nutrition/wards"
              payload: { name: "Ward 5 East", code: "W5E", tray_line_capacity_per_window: 20, delivery_lead_minutes: 20 }
              as: NutritionManager
              as_user_id: "u-mgr-1"
              captures: { w_id: $.data.id }
            - call: "POST /nutrition/diet-rules"
              payload: { diet_code: "REGULAR_STD", display_name: "Regular", precedence_rank: 90, requires_dietitian_cosign: true }
              as: Dietitian
