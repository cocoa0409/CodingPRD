              captures: { tc3_ev: $.data.id }
            - call: "POST /service-events/${tc3_ev}/resolve"
              payload: { outcome: "APPROVED" }
              as: SupportAgent
          assert:
            - "ServiceEvent.${tc3_ev}.status == RESOLVED and resolution == APPROVED"
            - "hop 1: Brewer.${tc3_br}.operational == DECOMMISSIONED"
            - "hop 2: Household.${tc3_hh}.installed_brewers == 0"
            - "hop 3: Household.${tc3_hh}.engagement == CHURNED and expected_monthly_pods == 0.00"

