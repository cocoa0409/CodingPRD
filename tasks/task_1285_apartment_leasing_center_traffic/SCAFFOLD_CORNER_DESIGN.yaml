      - name: publish_second_offer_for_floorplan_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_OFFER_ALREADY_PUBLISHED]"]
        distinguishing_aspect: "Single-display constraint: at most one PUBLISHED offer per floorplan; publishing a second DRAFT while one is PUBLISHED fails with ERR_OFFER_ALREADY_PUBLISHED, and succeeds after the first is retired."
        test_recipe:
          setup: ["Property P, floorplan F; offer O1 PUBLISHED; offer O2 DRAFT"]
          setup_api_calls:
            - call: "POST /leasing/properties"
              payload: { name: "Display Downs", code: "DS1" }
