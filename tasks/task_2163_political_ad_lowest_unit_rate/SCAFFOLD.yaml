scenario: "desgin task harder than expert level.!!!!2163. Political Advertising Compliance & Lowest Unit Rate (FCC-licensed broadcaster): candidate vs issue advertiser classification, lowest-unit-charge calculation within pre-election windows, equal opportunity request handling & response deadline, disclosure/sponsorship identification requirements, public political file posting & update timeliness, preemptible vs fixed rate class management, order acceptance policy & payment terms, audit & FCC complaint response"
domain_name: political-ad-lowest-unit-rate
api_prefix: "/political-ads"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: call_sign
        type: string
        source: input
        description: FCC call sign of the licensed broadcast station
        constraints: non-empty, unique across all Station rows
      - name: licensee_name
        type: string
        source: input
        description: Legal name of the FCC licensee
      - name: market_code
        type: string
        source: input
        description: DMA market code the station serves
      - name: political_file_posting_deadline_hours
        type: integer
        source: input
        description: Hours after a political-file event within which the entry must be posted
        default: 24
        constraints: integer >= 1
      - name: daily_political_seconds_cap
        type: integer
        source: input
        description: Maximum total political spot seconds the station will carry on any single air_date
        default: 300
        constraints: integer >= 30
      - name: eo_parity_basis
        type: enum
        source: input
        description: Which equal-opportunity parity algorithm this station applies when granting a request
        default: SPOT_COUNT
        constraints: one of {SPOT_COUNT, DOLLAR_VALUE}
      - name: pending_file_entry_count
        type: integer
        source: computed
        description: Count of PoliticalFileEntry rows for this station with posting_status == PENDING
        default: 0
      - name: overdue_file_entry_count
        type: integer
        source: computed
        description: Count of PoliticalFileEntry rows for this station with posting_status == OVERDUE
        default: 0
      - name: late_posting_count
        type: integer
        source: computed
        description: Cumulative count of PoliticalFileEntry rows for this station that reached posting_status == LATE_POSTED
        default: 0
      - name: open_complaint_count
        type: integer
        source: computed
        description: Count of FccComplaint rows for this station with status IN {OPEN, REOPENED}
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gating posture over overdue_file_entry_count and open_complaint_count per calculation station_compliance_posture
        default: OPEN
        constraints: one of {OPEN, RESTRICTED, FROZEN}
      - name: last_sweep_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent POST /political-ads/stations/{id}/audit-sweep; null before the first sweep

  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; the station whose political window this election defines
      - name: office_sought
        type: string
        source: input
        description: Office contested in this election
      - name: election_type
        type: enum
        source: input
        description: Statutory election category that fixes the lowest-unit-charge window length
        constraints: one of {PRIMARY, GENERAL, RUNOFF, SPECIAL}
      - name: election_date
        type: string
        source: input
        description: Calendar date of the election, YYYY-MM-DD
      - name: luc_window_days
        type: integer
        source: computed
        description: LUC_WINDOW_DAYS[election_type] - 45 for PRIMARY/RUNOFF/SPECIAL, 60 for GENERAL
      - name: window_start_date
        type: string
        source: computed
        description: election_date minus luc_window_days calendar days, YYYY-MM-DD; first date inside the lowest-unit-charge window
      - name: window_end_date
        type: string
        source: computed
        description: Equal to election_date; last date inside the lowest-unit-charge window
      - name: status
        type: enum
        source: computed
        description: SCHEDULED when clock_date < window_start_date, WINDOW_OPEN when window_start_date <= clock_date <= election_date, CLOSED when clock_date > election_date; re-derived on every read
        default: SCHEDULED
        constraints: one of {SCHEDULED, WINDOW_OPEN, CLOSED}

  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; station at which this advertiser seeks time
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; election this advertiser is bound to; null for advertisers with no election linkage
      - name: legal_name
        type: string
        source: input
        description: Legal name of the buying entity, used verbatim in the sponsorship identification conformance test
      - name: requested_class
        type: enum
        source: input
        description: Class the buyer asserts on intake
        constraints: one of {CANDIDATE, ISSUE}
      - name: candidate_name
        type: string
        source: input
        description: Name of the legally qualified candidate; null for issue advertisers
      - name: office_sought
        type: string
        source: input
        description: Office the candidate seeks; null for issue advertisers
      - name: qualification_evidence_ref
        type: string
        source: input
        description: Reference to the filed evidence of legal qualification; null when not supplied
      - name: status
        type: enum
        source: computed
        description: Classification state machine position
        default: SUBMITTED
        constraints: one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, CLASSIFIED_CANDIDATE, CLASSIFIED_ISSUE, CLASSIFICATION_REJECTED}
      - name: review_round
        type: integer
        source: computed
        description: Number of completed REQUEST_INFO rounds; increments on every UNDER_REVIEW -> INFO_REQUESTED transition
        default: 0
      - name: entitled_to_luc
        type: boolean
        source: computed
        description: True only while status == CLASSIFIED_CANDIDATE; drives lowest-unit-charge capping of this advertiser's orders
        default: false
      - name: classified_by_user_id
        type: string
        source: system
        description: X-User-ID of the StationComplianceOfficer who moved status out of UNDER_REVIEW into a terminal classification; null before that
      - name: classification_reason
        type: string
        source: system
        description: Free-text reason recorded with the terminal classification decision, or MAX_REVIEW_ROUNDS_EXCEEDED when auto-rejected

  - name: RateClass
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; station whose inventory this rate class sells
      - name: class_code
        type: string
        source: input
        description: Station-facing code for the rate class
      - name: daypart
        type: enum
        source: input
        description: Daypart the class sells; selects DAYPART_MULTIPLIER
        constraints: one of {MORNING, DAYTIME, EARLY_NEWS, PRIME, LATE_NIGHT}
      - name: preemptible
        type: boolean
        source: input
        description: True for preemptible classes, false for fixed (non-preemptible) classes
      - name: preemption_priority
        type: integer
        source: input
        description: Preemption order within preemptible classes; must be 0 when preemptible is false and 1..5 when preemptible is true
        default: 0
      - name: posted_rate_cents
        type: integer
        source: input
        description: Posted 30-second unit rate in cents before daypart multiplier and volume discount
        constraints: integer >= 1
      - name: status
        type: enum
        source: computed
        description: ACTIVE on creation; WITHDRAWN after POST /political-ads/rate-classes/{id}/withdraw
        default: ACTIVE
        constraints: one of {ACTIVE, WITHDRAWN}

  - name: CommercialOrder
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; station the order is placed against
      - name: advertiser_id
        type: string
        source: input
        description: FK -> Advertiser.id; buyer placing the order
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; election this order is attributed to; null for orders with no election linkage
      - name: rate_class_id
        type: string
        source: input
        description: FK -> RateClass.id; rate class every spot on this order is sold from
      - name: payment_terms
        type: enum
        source: input
        description: Terms under the station's order acceptance policy
        constraints: one of {PREPAY, NET_30}
      - name: agency_placed
        type: boolean
        source: input
        description: True when placed through an agency, enabling the agency commission step of order_net_due
        default: false
      - name: sponsorship_disclosure_text
        type: string
        source: input
        description: Sponsorship identification announcement carried on every spot of this order
      - name: disclosure_duration_seconds
        type: integer
        source: input
        description: On-screen or audible duration of the sponsorship identification
        constraints: integer >= 0
      - name: disclosure_status
        type: enum
        source: computed
        description: Result of calculation disclosure_conformance, recomputed on order creation and on POST /political-ads/orders/{id}/submit
        default: MISSING
        constraints: one of {MISSING, NONCONFORMING, CONFORMING}
      - name: status
        type: enum
        source: computed
        description: Order lifecycle dimension of the parallel state machine
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED, SUSPENDED, RUNNING, COMPLETED, CANCELLED}
      - name: payment_status
        type: enum
        source: computed
        description: Settlement dimension of the parallel state machine, advancing independently of status
        default: UNBILLED
        constraints: one of {UNBILLED, INVOICED, PAID, REFUND_DUE, REFUNDED}
      - name: spot_count
        type: integer
        source: computed
        description: Count of ScheduledSpot rows on this order with status IN {SCHEDULED, AIRED}; selects the volume discount tier
        default: 0
      - name: gross_charge_cents
        type: integer
        source: computed
        description: Output of calculation order_gross_charge
        default: 0
      - name: agency_commission_cents
        type: integer
        source: computed
        description: Step 2 output of calculation order_net_due; 0 when agency_placed is false
        default: 0
      - name: net_due_cents
        type: integer
        source: computed
        description: Output of calculation order_net_due
        default: 0
      - name: rebate_total_cents
        type: integer
        source: computed
        description: Sum of RebateLedgerEntry.amount_cents rows whose order_id is this order
        default: 0
      - name: paid_cents
        type: integer
        source: computed
        description: Cumulative CHARGE payments received on this order
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Cumulative REFUND payments returned on this order
        default: 0
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the order entered ACCEPTED; null before acceptance
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the StationComplianceOfficer who accepted the order; null before acceptance
      - name: payment_due_at
        type: datetime
        source: computed
        description: Output of calculation payment_due_at; null before acceptance
      - name: first_air_at
        type: datetime
        source: system
        description: Logical-clock instant at which the first ScheduledSpot on this order reached AIRED; null until then
      - name: rejection_reason
        type: string
        source: system
        description: Reason recorded when the order was rejected or cancelled; null otherwise

  - name: ScheduledSpot
    parent: CommercialOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: FK -> CommercialOrder.id; owning order, taken from the creation path
      - name: rate_class_id
        type: string
        source: system
        description: FK -> RateClass.id; copied from the owning order's rate_class_id at spot creation
      - name: air_date
        type: string
        source: input
        description: Scheduled air date, YYYY-MM-DD
      - name: start_offset_seconds
        type: integer
        source: input
        description: Seconds after 00:00:00 local broadcast day at which the spot starts
        constraints: integer in [0, 86399]
      - name: duration_seconds
        type: integer
        source: input
        description: Spot length in seconds
        constraints: one of {30, 60}
      - name: program_code
        type: string
        source: input
        description: Program adjacency code the spot runs in
      - name: status
        type: enum
        source: computed
        description: Spot disposition state
        default: SCHEDULED
        constraints: one of {SCHEDULED, AIRED, PREEMPTED, CANCELLED}
      - name: charged_rate_cents
        type: integer
        source: computed
        description: Per-spot charge from calculation order_gross_charge, after any lowest-unit-charge cap; 0 once PREEMPTED or CANCELLED
        default: 0
      - name: unit_equivalent_rate_cents
        type: integer
        source: computed
        description: round_half_up(charged_rate_cents * 30 / duration_seconds); the 30-second-normalised rate used by lowest_unit_charge
        default: 0
      - name: luc_capped
        type: boolean
        source: computed
        description: True once charged_rate_cents has been reduced by a lowest-unit-charge cap or a FINAL determination reprice
        default: false
      - name: luc_cap_cents
        type: integer
        source: computed
        description: The 30-second-unit lowest unit charge currently binding this spot; null while luc_capped is false. Every later repricing clamps charged_rate_cents at round_half_up(luc_cap_cents * duration_seconds / 30).
      - name: aired_at
        type: datetime
        source: system
        description: Logical-clock instant recorded when status became AIRED; null otherwise
      - name: preemption_reason
        type: string
        source: system
        description: Reason recorded when status became PREEMPTED; null otherwise

  - name: PoliticalFileEntry
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: FK -> Station.id; station whose public political file must carry this entry
      - name: order_id
        type: string
        source: system
        description: FK -> CommercialOrder.id; order the disclosable event concerns
      - name: event_type
        type: enum
        source: system
        description: Disclosable event that produced this entry
        constraints: one of {ORDER_ACCEPTED, RATE_ADJUSTMENT, EQUAL_OPPORTUNITY_RESPONSE}
      - name: event_occurred_at
        type: datetime
        source: system
        description: Logical-clock instant of the disclosable event
      - name: due_at
        type: datetime
        source: computed
        description: event_occurred_at plus Station.political_file_posting_deadline_hours
      - name: posted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the entry was posted; null while unposted
      - name: posting_status
        type: enum
        source: computed
        description: Timeliness state of the public-file posting
        default: PENDING
        constraints: one of {PENDING, POSTED, LATE_POSTED, OVERDUE}
      - name: late_by_seconds
        type: integer
        source: computed
        description: max(0, posted_at - due_at) in whole seconds; 0 while unposted or posted on time
        default: 0
      - name: public_file_url
        type: string
        source: system
        description: URL supplied at posting time; null while unposted
      - name: disclosure_snapshot
        type: string
        source: system
        description: Copy of CommercialOrder.sponsorship_disclosure_text captured at event_occurred_at

  - name: EqualOpportunityRequest
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; station the request is served on
      - name: election_id
        type: string
        source: system
        description: FK -> Election.id; copied from the trigger order's election_id at request creation
      - name: requesting_advertiser_id
        type: string
        source: input
        description: FK -> Advertiser.id; opposing legally qualified candidate making the request
      - name: trigger_order_id
        type: string
        source: input
        description: FK -> CommercialOrder.id; the opponent's prior use that opens the equal-opportunity right
      - name: granted_order_id
        type: string
        source: system
        description: FK -> CommercialOrder.id; the requester's own order the grant attaches to; null unless status == GRANTED
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the request was received
      - name: response_due_at
        type: datetime
        source: computed
        description: received_at plus EO_RESPONSE_DEADLINE_HOURS
      - name: status
        type: enum
        source: computed
        description: Request handling state
        default: RECEIVED
        constraints: one of {RECEIVED, GRANTED, DENIED, EXPIRED}
      - name: owed_units
        type: integer
        source: computed
        description: Output of calculation equal_opportunity_owed_units at grant time; 0 in every other state
        default: 0
      - name: fulfilled_units
        type: integer
        source: computed
        description: Sum over the granted order's ScheduledSpot rows with status == AIRED of duration_seconds / 30
        default: 0
      - name: parity_basis_applied
        type: enum
        source: computed
        description: Station.eo_parity_basis in force at grant time; null unless status == GRANTED
        constraints: one of {SPOT_COUNT, DOLLAR_VALUE}
      - name: denial_reason
        type: string
        source: system
        description: Reason recorded with a DENY decision; null otherwise
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the GRANT or DENY decision; null otherwise

  - name: LucDetermination
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: system
        description: FK -> Station.id; copied from the election's station_id
      - name: election_id
        type: string
        source: system
        description: FK -> Election.id; election whose pre-election window bounds the determination
      - name: rate_class_id
        type: string
        source: input
        description: FK -> RateClass.id; rate class the determination prices
      - name: basis_spot_id
        type: string
        source: computed
        description: FK -> ScheduledSpot.id; the qualifying spot that set luc_cents; null when basis == POSTED_RATE_FALLBACK
      - name: variant
        type: enum
        source: input
        description: Which inclusion set the determination uses
        constraints: one of {PROVISIONAL, FINAL}
      - name: luc_cents
        type: integer
        source: computed
        description: Output of calculation lowest_unit_charge
        default: 0
      - name: basis
        type: enum
        source: computed
        description: LOWEST_QUALIFYING_SPOT when the candidate set was non-empty, POSTED_RATE_FALLBACK when empty
        constraints: one of {LOWEST_QUALIFYING_SPOT, POSTED_RATE_FALLBACK}
      - name: qualifying_spot_count
        type: integer
        source: computed
        description: Size of the candidate set the determination minimised over
        default: 0
      - name: window_start_date
        type: string
        source: computed
        description: Copy of Election.window_start_date at computation time
      - name: window_end_date
        type: string
        source: computed
        description: Copy of Election.window_end_date at computation time
      - name: status
        type: enum
        source: computed
        description: ACTIVE on creation; SUPERSEDED once a later determination for the same election_id, rate_class_id and variant is created
        default: ACTIVE
        constraints: one of {ACTIVE, SUPERSEDED}
      - name: computed_at
        type: datetime
        source: system
        description: Logical-clock instant of computation
      - name: repriced_spot_count
        type: integer
        source: computed
        description: Number of ScheduledSpot rows this determination repriced; always 0 for variant PROVISIONAL
        default: 0
      - name: rebate_total_cents
        type: integer
        source: computed
        description: Sum of RebateLedgerEntry.amount_cents rows this determination produced
        default: 0

  - name: RebateLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: system
        description: FK -> CommercialOrder.id; order the refund is owed on
      - name: luc_determination_id
        type: string
        source: system
        description: FK -> LucDetermination.id; determination that produced the entry; null when reason is SPOT_PREEMPTED or ORDER_CANCELLED
      - name: amount_cents
        type: integer
        source: system
        description: Refund owed to the advertiser at the instant the entry was written
      - name: reason
        type: enum
        source: system
        description: Compensating action that produced the entry
        constraints: one of {LUC_FINAL_REPRICE, SPOT_PREEMPTED, ORDER_CANCELLED}
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant the entry was written

  - name: FccComplaint
    parent: null
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: FK -> Station.id; station complained about
      - name: order_id
        type: string
        source: input
        description: FK -> CommercialOrder.id; order the allegation concerns; null for station-level allegations
      - name: complainant_name
        type: string
        source: input
        description: Name of the complaining party
      - name: allegation_code
        type: enum
        source: input
        description: Category of the allegation
        constraints: one of {LUC_OVERCHARGE, FILE_TIMELINESS, EQUAL_OPPORTUNITY_DENIED, DISCLOSURE_DEFECT}
      - name: narrative
        type: string
        source: input
        description: Free-text allegation narrative
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the complaint was filed
      - name: response_due_at
        type: datetime
        source: computed
        description: filed_at plus COMPLAINT_RESPONSE_DEADLINE_HOURS
      - name: status
        type: enum
        source: computed
        description: Complaint handling state
        default: OPEN
        constraints: one of {OPEN, RESPONDED, REOPENED, CLOSED}
      - name: remedy_code
        type: enum
        source: system
        description: Remedy asserted in the most recent response; null before the first response
        constraints: one of {CURED, PENDING_CURE, NO_VIOLATION}
      - name: cure_due_at
        type: datetime
        source: computed
        description: responded_at plus CURE_PERIOD_HOURS when remedy_code == PENDING_CURE; null otherwise
      - name: responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent response; null before the first response
      - name: response_text
        type: string
        source: system
        description: Text of the most recent response; null before the first response
      - name: late_response
        type: boolean
        source: computed
        description: True when the most recent response was recorded strictly after response_due_at
        default: false
      - name: responded_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who recorded the most recent response; null before the first response

state_machines:
  - entity: Advertiser
    initial_state: SUBMITTED
    terminal_states: [CLASSIFIED_CANDIDATE, CLASSIFIED_ISSUE, CLASSIFICATION_REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /political-ads/advertisers/{id}/review"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == SUBMITTED"
        side_effects:
          - "increments Advertiser.version by 1"
        note: "Opens the first classification round."
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /political-ads/advertisers/{id}/decision with decision == REQUEST_INFO"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == UNDER_REVIEW"
          - "Advertiser.review_round < MAX_REVIEW_ROUNDS (3)"
        side_effects:
          - "sets Advertiser.review_round = review_round + 1"
          - "increments Advertiser.version by 1"
        note: "Cycle leg one: the station asks for more qualification evidence."
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /political-ads/advertisers/{id}/review"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == INFO_REQUESTED"
        side_effects:
          - "increments Advertiser.version by 1"
        note: "Cycle leg two: review reopens after the buyer files more evidence. UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW is the cyclic loop."
      - from: UNDER_REVIEW
        to: CLASSIFICATION_REJECTED
        trigger: "POST /political-ads/advertisers/{id}/decision with decision == REQUEST_INFO"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == UNDER_REVIEW"
          - "Advertiser.review_round == MAX_REVIEW_ROUNDS (3)"
        side_effects:
          - "sets Advertiser.classification_reason = 'MAX_REVIEW_ROUNDS_EXCEEDED'"
          - "sets Advertiser.classified_by_user_id = X-User-ID"
          - "sets Advertiser.entitled_to_luc = false"
          - "increments Advertiser.version by 1"
        note: "Branch on the review_round counter: the fourth REQUEST_INFO is refused as an auto-rejection instead of a fourth loop."
      - from: UNDER_REVIEW
        to: CLASSIFIED_CANDIDATE
        trigger: "POST /political-ads/advertisers/{id}/decision with decision == CLASSIFY_CANDIDATE"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == UNDER_REVIEW"
          - "Advertiser.requested_class == CANDIDATE"
          - "Advertiser.election_id is not null"
          - "Advertiser.qualification_evidence_ref is a non-empty string"
        side_effects:
          - "sets Advertiser.entitled_to_luc = true"
          - "sets Advertiser.classified_by_user_id = X-User-ID"
          - "sets Advertiser.classification_reason = request body reason, or 'LEGALLY_QUALIFIED' when reason is omitted"
          - "increments Advertiser.version by 1"
      - from: UNDER_REVIEW
        to: CLASSIFIED_ISSUE
        trigger: "POST /political-ads/advertisers/{id}/decision with decision == CLASSIFY_ISSUE"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == UNDER_REVIEW"
        side_effects:
          - "sets Advertiser.entitled_to_luc = false"
          - "sets Advertiser.classified_by_user_id = X-User-ID"
          - "increments Advertiser.version by 1"
        note: "Issue advertisers never receive the lowest unit charge and are bound to PREPAY terms at acceptance."
      - from: UNDER_REVIEW
        to: CLASSIFICATION_REJECTED
        trigger: "POST /political-ads/advertisers/{id}/decision with decision == REJECT"
        actor: StationComplianceOfficer
        preconditions:
          - "Advertiser.status == UNDER_REVIEW"
        side_effects:
          - "sets Advertiser.entitled_to_luc = false"
          - "sets Advertiser.classified_by_user_id = X-User-ID"
          - "increments Advertiser.version by 1"

  - entity: CommercialOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /political-ads/orders/{id}/submit"
        actor: AdvertiserAgent
        preconditions:
          - "CommercialOrder.status == DRAFT"
          - "CommercialOrder.spot_count >= 1"
          - "recomputed disclosure_status == CONFORMING"
        side_effects:
          - "recomputes CommercialOrder.disclosure_status via calculation disclosure_conformance"
          - "increments CommercialOrder.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
        actor: StationComplianceOfficer
        preconditions:
          - "CommercialOrder.status == SUBMITTED"
          - "Station.compliance_posture != FROZEN"
          - "Advertiser.status IN {CLASSIFIED_CANDIDATE, CLASSIFIED_ISSUE}"
          - "Station.compliance_posture != RESTRICTED when Advertiser.status == CLASSIFIED_ISSUE"
          - "sponsorship_disclosure_text contains 'AUTHORIZED BY' when Advertiser.status == CLASSIFIED_CANDIDATE"
          - "RateClass.status == ACTIVE"
          - "CommercialOrder.payment_terms == PREPAY when Advertiser.status == CLASSIFIED_ISSUE"
        side_effects:
          - "sets CommercialOrder.accepted_at = logical clock, CommercialOrder.accepted_by_user_id = X-User-ID"
          - "advances CommercialOrder.payment_status UNBILLED -> INVOICED on the settlement dimension"
          - "creates one LucDetermination with variant PROVISIONAL for (order.election_id, order.rate_class_id) when Advertiser.entitled_to_luc is true and order.election_id is not null, superseding the prior ACTIVE PROVISIONAL determination for that pair"
          - "caps every ScheduledSpot S on this order with S.status == SCHEDULED and Election.window_start_date <= S.air_date <= Election.window_end_date at charged_rate_cents = min(S.charged_rate_cents, round_half_up(luc_cents * S.duration_seconds / 30)), setting S.luc_cap_cents = luc_cents and S.luc_capped = true when that cap strictly lowers the charge"
          - "recomputes CommercialOrder.gross_charge_cents, agency_commission_cents and net_due_cents"
          - "computes CommercialOrder.payment_due_at via calculation payment_due_at"
          - "creates one PoliticalFileEntry with event_type ORDER_ACCEPTED, posting_status PENDING, and increments Station.pending_file_entry_count by 1"
          - "increments CommercialOrder.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /political-ads/orders/{id}/decision with decision == REJECT"
        actor: StationComplianceOfficer
        preconditions:
          - "CommercialOrder.status == SUBMITTED"
          - "request body rejection_reason is a non-empty string"
        side_effects:
          - "sets CommercialOrder.rejection_reason = request body rejection_reason"
          - "sets every ScheduledSpot on this order with status == SCHEDULED to CANCELLED and its charged_rate_cents to 0"
          - "recomputes CommercialOrder.spot_count, gross_charge_cents, agency_commission_cents and net_due_cents to 0"
          - "increments CommercialOrder.version by 1"
        note: "Branch sibling of ACCEPT with a disjoint side-effect set: no LucDetermination, no political file entry, no invoicing."
      - from: ACCEPTED
        to: RUNNING
        trigger: "system: first ScheduledSpot on the order reaches AIRED via POST /political-ads/spots/{id}/disposition"
        actor: system
        preconditions:
          - "CommercialOrder.status == ACCEPTED"
          - "CommercialOrder.first_air_at is null"
        side_effects:
          - "sets CommercialOrder.first_air_at = logical clock"
          - "increments CommercialOrder.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "system: the last non-terminal ScheduledSpot on the order reaches AIRED or PREEMPTED"
        actor: system
        preconditions:
          - "CommercialOrder.status == RUNNING"
          - "every ScheduledSpot on the order has status IN {AIRED, PREEMPTED, CANCELLED}"
        side_effects:
          - "increments CommercialOrder.version by 1"
      - from: ACCEPTED
        to: SUSPENDED
        trigger: "system: POST /political-ads/stations/{id}/audit-sweep step 5"
        actor: system
        preconditions:
          - "CommercialOrder.status == ACCEPTED"
          - "Station.compliance_posture == FROZEN after sweep step 4"
          - "CommercialOrder.payment_status != PAID"
        side_effects:
          - "increments CommercialOrder.version by 1"
        note: "Third hop of the audit-sweep cascade; caused by the posture flip in step 4, not directly by the sweep request."
      - from: SUSPENDED
        to: ACCEPTED
        trigger: "system: POST /political-ads/stations/{id}/audit-sweep step 6"
        actor: system
        preconditions:
          - "CommercialOrder.status == SUSPENDED"
          - "Station.compliance_posture == OPEN after sweep step 4"
        side_effects:
          - "increments CommercialOrder.version by 1"
        note: "Cyclic leg: ACCEPTED -> SUSPENDED -> ACCEPTED once the station clears its overdue file entries and open complaints."
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /political-ads/orders/{id}/cancel"
        actor: AdvertiserAgent
        preconditions:
          - "CommercialOrder.status IN {DRAFT, SUBMITTED, ACCEPTED, SUSPENDED, RUNNING}"
        side_effects:
          - "sets CommercialOrder.rejection_reason = request body cancellation_reason"
          - "sets every ScheduledSpot on this order with status == SCHEDULED to CANCELLED and its charged_rate_cents to 0"
          - "recomputes CommercialOrder.spot_count, gross_charge_cents, agency_commission_cents and net_due_cents; net_due_cents becomes 0 when no SCHEDULED or AIRED spot remains"
          - "let owed = paid_cents - refunded_cents - net_due_cents; when owed > rebate_total_cents, creates one RebateLedgerEntry with reason ORDER_CANCELLED and amount_cents = owed - rebate_total_cents, refreshes rebate_total_cents to owed, and advances payment_status PAID or REFUND_DUE -> REFUND_DUE"
          - "reverts every EqualOpportunityRequest R with R.granted_order_id == this order from GRANTED to RECEIVED, clearing R.granted_order_id, R.owed_units, R.fulfilled_units, R.parity_basis_applied and R.responded_at"
          - "increments CommercialOrder.version by 1"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /political-ads/orders/{id}/cancel"
        actor: AdvertiserAgent
        preconditions:
          - "CommercialOrder.status == RUNNING"
        side_effects:
          - "identical to the ACCEPTED -> CANCELLED side-effect set; AIRED spots keep their charged_rate_cents and therefore keep net_due_cents above zero"
          - "increments CommercialOrder.version by 1"

  - entity: CommercialOrder
    initial_state: UNBILLED
    terminal_states: [REFUNDED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
        actor: StationComplianceOfficer
        preconditions:
          - "CommercialOrder.payment_status == UNBILLED"
        side_effects:
          - "computes CommercialOrder.payment_due_at"
        note: "Settlement dimension of CommercialOrder. It evolves independently of the lifecycle dimension above: SUSPENDED/RUNNING/COMPLETED orders may sit at any of INVOICED, PAID or REFUND_DUE."
      - from: INVOICED
        to: PAID
        trigger: "POST /political-ads/orders/{id}/payments with direction == CHARGE"
        actor: AdvertiserAgent
        preconditions:
          - "CommercialOrder.payment_status == INVOICED"
          - "request body expected_order_version == CommercialOrder.version"
          - "request body amount_cents == net_due_cents - paid_cents + refunded_cents"
        side_effects:
          - "sets CommercialOrder.paid_cents = paid_cents + amount_cents"
          - "increments CommercialOrder.version by 1"
      - from: PAID
        to: REFUND_DUE
        trigger: "system: any recompute that lowers net_due_cents below paid_cents - refunded_cents (FINAL LucDetermination reprice, spot preemption, or order cancellation)"
        actor: system
        preconditions:
          - "CommercialOrder.payment_status == PAID"
          - "paid_cents - refunded_cents - net_due_cents > 0"
        side_effects:
          - "creates one RebateLedgerEntry with amount_cents = (paid_cents - refunded_cents - net_due_cents) - rebate_total_cents, i.e. only the increment not already on the ledger"
          - "sets CommercialOrder.rebate_total_cents = sum of RebateLedgerEntry.amount_cents for this order, which then equals paid_cents - refunded_cents - net_due_cents"
      - from: REFUND_DUE
        to: REFUNDED
        trigger: "POST /political-ads/orders/{id}/payments with direction == REFUND"
        actor: AdvertiserAgent
        preconditions:
          - "CommercialOrder.payment_status == REFUND_DUE"
          - "request body expected_order_version == CommercialOrder.version"
          - "request body amount_cents == paid_cents - refunded_cents - net_due_cents"
        side_effects:
          - "sets CommercialOrder.refunded_cents = refunded_cents + amount_cents"
          - "increments CommercialOrder.version by 1"
        note: "Closes the money invariant paid_cents - refunded_cents == net_due_cents."

  - entity: ScheduledSpot
    initial_state: SCHEDULED
    terminal_states: [AIRED, PREEMPTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /political-ads/spots/{id}/disposition with disposition == AIRED"
        actor: TrafficScheduler
        preconditions:
          - "ScheduledSpot.status == SCHEDULED"
          - "CommercialOrder.status IN {ACCEPTED, RUNNING}"
          - "CommercialOrder.payment_status == PAID when CommercialOrder.payment_terms == PREPAY"
          - "ScheduledSpot.air_date <= date part of the logical clock"
        side_effects:
          - "sets ScheduledSpot.aired_at = logical clock"
          - "advances CommercialOrder ACCEPTED -> RUNNING when CommercialOrder.first_air_at is null"
          - "advances CommercialOrder RUNNING -> COMPLETED when no ScheduledSpot on the order remains in SCHEDULED"
          - "recomputes EqualOpportunityRequest.fulfilled_units for every GRANTED request whose granted_order_id is this spot's order"
          - "increments ScheduledSpot.version by 1"
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "POST /political-ads/spots/{id}/disposition with disposition == PREEMPTED"
        actor: TrafficScheduler
        preconditions:
          - "ScheduledSpot.status == SCHEDULED"
          - "RateClass.preemptible == true"
          - "CommercialOrder.status IN {ACCEPTED, SUSPENDED, RUNNING}"
          - "request body preemption_reason is a non-empty string"
        side_effects:
          - "hop 1: sets ScheduledSpot.charged_rate_cents = 0, ScheduledSpot.unit_equivalent_rate_cents = 0 and ScheduledSpot.preemption_reason = request body preemption_reason"
          - "hop 2, caused by hop 1: recomputes CommercialOrder.spot_count (now excluding this spot), which reselects the volume discount tier and reprices every remaining SCHEDULED or AIRED spot, then recomputes gross_charge_cents, agency_commission_cents and net_due_cents"
          - "hop 3, caused by hop 2: let owed = paid_cents - refunded_cents - net_due_cents; when owed > rebate_total_cents, creates one RebateLedgerEntry with reason SPOT_PREEMPTED and amount_cents = owed - rebate_total_cents, refreshes rebate_total_cents to owed, and advances payment_status PAID -> REFUND_DUE (an order already in REFUND_DUE stays there and accrues the additional entry)"
          - "hop 4, caused by hop 3: creates one PoliticalFileEntry with event_type RATE_ADJUSTMENT and posting_status PENDING, and increments Station.pending_file_entry_count by 1"
          - "advances CommercialOrder RUNNING -> COMPLETED when no ScheduledSpot on the order remains in SCHEDULED"
          - "increments ScheduledSpot.version by 1"
        note: "Fixed (non-preemptible) rate classes reject this transition with ERR_RATE_CLASS_NOT_PREEMPTIBLE."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: CommercialOrder reaches REJECTED or CANCELLED"
        actor: system
        preconditions:
          - "ScheduledSpot.status == SCHEDULED"
        side_effects:
          - "sets ScheduledSpot.charged_rate_cents = 0 and ScheduledSpot.unit_equivalent_rate_cents = 0"
          - "increments ScheduledSpot.version by 1"

  - entity: PoliticalFileEntry
    initial_state: PENDING
    terminal_states: [POSTED, LATE_POSTED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "POST /political-ads/file-entries/{id}/post"
        actor: StationComplianceOfficer
        preconditions:
          - "PoliticalFileEntry.posting_status == PENDING"
          - "logical clock <= PoliticalFileEntry.due_at"
        side_effects:
          - "sets posted_at = logical clock, public_file_url = request body public_file_url, late_by_seconds = 0"
          - "decrements Station.pending_file_entry_count by 1"
          - "increments PoliticalFileEntry.version by 1"
      - from: PENDING
        to: LATE_POSTED
        trigger: "POST /political-ads/file-entries/{id}/post"
        actor: StationComplianceOfficer
        preconditions:
          - "PoliticalFileEntry.posting_status == PENDING"
          - "logical clock > PoliticalFileEntry.due_at"
        side_effects:
          - "sets posted_at = logical clock, public_file_url = request body public_file_url, late_by_seconds = whole seconds between due_at and posted_at"
          - "decrements Station.pending_file_entry_count by 1 and increments Station.late_posting_count by 1"
          - "increments PoliticalFileEntry.version by 1"
      - from: PENDING
        to: OVERDUE
        trigger: "system: POST /political-ads/stations/{id}/audit-sweep step 1"
        actor: system
        preconditions:
          - "PoliticalFileEntry.posting_status == PENDING"
          - "logical clock > PoliticalFileEntry.due_at"
        side_effects:
          - "hop 1: decrements Station.pending_file_entry_count by 1 and increments Station.overdue_file_entry_count by 1"
          - "hop 2, caused by hop 1: recomputes Station.compliance_posture from the new overdue_file_entry_count"
          - "increments PoliticalFileEntry.version by 1"
      - from: OVERDUE
        to: LATE_POSTED
        trigger: "POST /political-ads/file-entries/{id}/post"
        actor: StationComplianceOfficer
        preconditions:
          - "PoliticalFileEntry.posting_status == OVERDUE"
        side_effects:
          - "sets posted_at = logical clock, public_file_url = request body public_file_url, late_by_seconds = whole seconds between due_at and posted_at"
          - "decrements Station.overdue_file_entry_count by 1 and increments Station.late_posting_count by 1"
          - "recomputes Station.compliance_posture from the new overdue_file_entry_count"
          - "increments PoliticalFileEntry.version by 1"

  - entity: EqualOpportunityRequest
    initial_state: RECEIVED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: RECEIVED
        to: GRANTED
        trigger: "POST /political-ads/eo-requests/{id}/respond with decision == GRANT"
        actor: StationComplianceOfficer
        preconditions:
          - "EqualOpportunityRequest.status == RECEIVED"
          - "logical clock <= EqualOpportunityRequest.response_due_at"
          - "request body granted_order_id references a CommercialOrder G with G.advertiser_id == requesting_advertiser_id, G.status == ACCEPTED, G.election_id == EqualOpportunityRequest.election_id and G.rate_class_id == the trigger order's rate_class_id"
        side_effects:
          - "sets owed_units via calculation equal_opportunity_owed_units and parity_basis_applied = Station.eo_parity_basis"
          - "sets granted_order_id, responded_at = logical clock, fulfilled_units = 0"
          - "creates one PoliticalFileEntry with event_type EQUAL_OPPORTUNITY_RESPONSE against granted_order_id, posting_status PENDING, and increments Station.pending_file_entry_count by 1"
          - "increments EqualOpportunityRequest.version by 1"
      - from: GRANTED
        to: RECEIVED
        trigger: "system: POST /political-ads/orders/{id}/cancel on the granted order"
        actor: system
        preconditions:
          - "EqualOpportunityRequest.status == GRANTED"
          - "the cancelled order's id equals EqualOpportunityRequest.granted_order_id"
        side_effects:
          - "clears granted_order_id, parity_basis_applied, responded_at; sets owed_units = 0 and fulfilled_units = 0"
          - "increments EqualOpportunityRequest.version by 1"
        note: "Cyclic leg RECEIVED -> GRANTED -> RECEIVED; it is the compensating action that restores election_eo_outstanding_units."
      - from: RECEIVED
        to: DENIED
        trigger: "POST /political-ads/eo-requests/{id}/respond with decision == DENY"
        actor: StationComplianceOfficer
        preconditions:
          - "EqualOpportunityRequest.status == RECEIVED"
          - "logical clock <= EqualOpportunityRequest.response_due_at"
          - "request body denial_reason is a non-empty string"
        side_effects:
          - "sets denial_reason and responded_at = logical clock"
          - "creates one PoliticalFileEntry with event_type EQUAL_OPPORTUNITY_RESPONSE against trigger_order_id, posting_status PENDING, and increments Station.pending_file_entry_count by 1"
          - "increments EqualOpportunityRequest.version by 1"
      - from: RECEIVED
        to: EXPIRED
        trigger: "system: POST /political-ads/stations/{id}/audit-sweep step 2"
        actor: system
        preconditions:
          - "EqualOpportunityRequest.status == RECEIVED"
          - "logical clock > EqualOpportunityRequest.response_due_at"
        side_effects:
          - "increments EqualOpportunityRequest.version by 1"

  - entity: FccComplaint
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RESPONDED
        trigger: "POST /political-ads/complaints/{id}/respond"
        actor: StationComplianceOfficer
        preconditions:
          - "FccComplaint.status == OPEN"
          - "X-User-ID != the accepted_by_user_id of the CommercialOrder referenced by FccComplaint.order_id, when order_id is not null"
        side_effects:
          - "sets response_text, remedy_code, responded_at = logical clock, responded_by_user_id = X-User-ID"
          - "sets late_response = true when logical clock > response_due_at"
          - "sets cure_due_at = responded_at + CURE_PERIOD_HOURS when remedy_code == PENDING_CURE, else null"
          - "hop 1: decrements Station.open_complaint_count by 1"
          - "hop 2, caused by hop 1: recomputes Station.compliance_posture"
          - "increments FccComplaint.version by 1"
      - from: RESPONDED
        to: REOPENED
        trigger: "system: POST /political-ads/stations/{id}/audit-sweep step 3"
        actor: system
        preconditions:
          - "FccComplaint.status == RESPONDED"
          - "FccComplaint.remedy_code == PENDING_CURE"
          - "logical clock >= FccComplaint.cure_due_at"
        side_effects:
          - "increments Station.open_complaint_count by 1"
          - "recomputes Station.compliance_posture"
          - "increments FccComplaint.version by 1"
      - from: REOPENED
        to: RESPONDED
        trigger: "POST /political-ads/complaints/{id}/respond"
        actor: StationComplianceOfficer
        preconditions:
          - "FccComplaint.status == REOPENED"
          - "X-User-ID != the accepted_by_user_id of the CommercialOrder referenced by FccComplaint.order_id, when order_id is not null"
        side_effects:
          - "identical to the OPEN -> RESPONDED side-effect set"
          - "increments FccComplaint.version by 1"
        note: "Cyclic leg RESPONDED -> REOPENED -> RESPONDED, bounded only by supplying a remedy_code other than PENDING_CURE."
      - from: RESPONDED
        to: CLOSED
        trigger: "system: POST /political-ads/stations/{id}/audit-sweep step 3"
        actor: system
        preconditions:
          - "FccComplaint.status == RESPONDED"
          - "FccComplaint.remedy_code IN {CURED, NO_VIOLATION}"
        side_effects:
          - "increments FccComplaint.version by 1"

  - entity: LucDetermination
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a later POST /political-ads/elections/{id}/luc-determinations for the same election_id, rate_class_id and variant"
        actor: system
        preconditions:
          - "LucDetermination.status == ACTIVE"
        side_effects:
          - "increments LucDetermination.version by 1"

concurrency_rules:
  - rule_id: luc-determination-create-stale-election
    parent_entity: Election
    write_endpoint: "POST /political-ads/elections/{id}/luc-determinations"
    occ_field: "expected_election_version"
    description: |
      Creating a LucDetermination against an Election whose version has advanced since the
      client last observed it is rejected. A determination legitimately supersedes the prior
      ACTIVE determination for the same rate class and variant and, for variant FINAL,
      reprices candidate spots and writes rebates; a client working from a stale view of the
      election would therefore supersede a determination it has never seen.
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412

  - rule_id: order-payment-stale-order
    parent_entity: CommercialOrder
    write_endpoint: "POST /political-ads/orders/{id}/payments"
    occ_field: "expected_order_version"
    description: |
      Recording a payment against a CommercialOrder whose version has advanced since the
      client last observed it is rejected. Payments are additive and a second settlement
      call would otherwise legitimately succeed, so the stale-version check is the only
      thing that stops a client from settling against a charge figure that a reprice,
      preemption or cancellation has already moved.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

calculations:
  - name: order_gross_charge
    trigger: "POST /political-ads/orders/{id}/spots; POST /political-ads/orders/{id}/decision (both ACCEPT and REJECT); POST /political-ads/orders/{id}/cancel; POST /political-ads/spots/{id}/disposition with disposition == PREEMPTED; the FINAL reprice hop of POST /political-ads/elections/{id}/luc-determinations"
    algorithm: tiered_pricing
    formula: |
      # Step A - reselect the volume tier from the order's CURRENT spot population.
      spot_count = count of ScheduledSpot S on this order with S.status IN {SCHEDULED, AIRED}
      volume_discount_pct = VOLUME_DISCOUNT_TIERS row whose [min_spots, max_spots] contains spot_count
      # Step B - reprice EVERY surviving spot at the reselected tier. Charges are never
      #          frozen at the tier that was in force when the spot was added.
      for each ScheduledSpot S on this order with S.status IN {SCHEDULED, AIRED}:
          raw = RateClass.posted_rate_cents
                * DAYPART_MULTIPLIER[RateClass.daypart]
                * (S.duration_seconds / 30)
                * (1 - volume_discount_pct)
          S.charged_rate_cents = round_half_up(raw)        # ROUNDING HAPPENS HERE, ONCE PER SPOT
          if S.luc_capped is true:
              S.charged_rate_cents = min(S.charged_rate_cents,
                                         round_half_up(S.luc_cap_cents * S.duration_seconds / 30))
          S.unit_equivalent_rate_cents = round_half_up(S.charged_rate_cents * 30 / S.duration_seconds)
      for each ScheduledSpot S on this order with S.status IN {PREEMPTED, CANCELLED}:
          S.charged_rate_cents = 0
          S.unit_equivalent_rate_cents = 0
      # Step C - sum the ALREADY ROUNDED per-spot charges.
      gross_charge_cents = sum over S of S.charged_rate_cents
    input_set: "ScheduledSpot rows on the order whose status IN {SCHEDULED, AIRED}; PREEMPTED and CANCELLED spots contribute 0 and are excluded from spot_count, so preempting a spot can drop the order into a lower volume tier and raise every surviving spot's charge."
    constants:
      UNIT_SECONDS: 30
      DAYPART_MULTIPLIER: { MORNING: 0.60, DAYTIME: 0.45, EARLY_NEWS: 1.00, PRIME: 2.25, LATE_NIGHT: 0.35 }
      # Derived helper used by lowest_unit_charge and equal_opportunity_owed_units:
      #   card_unit_rate_cents(RateClass) = round_half_up(posted_rate_cents * DAYPART_MULTIPLIER[daypart])
      # It is the undiscounted 30-second card rate for the class.
      VOLUME_DISCOUNT_TIERS:
        - { min_spots: 1, max_spots: 4, pct: 0.00 }
        - { min_spots: 5, max_spots: 9, pct: 0.05 }
        - { min_spots: 10, max_spots: 19, pct: 0.125 }
        - { min_spots: 20, max_spots: null, pct: 0.20 }
    precision: |
      Whole cents, round_half_up, applied exactly ONCE PER SPOT at the end of Step B over the
      full product posted_rate_cents * daypart_multiplier * duration_ratio * (1 - discount).
      The pinned order is ROUND-PER-SPOT-THEN-SUM. Summing the unrounded per-spot products and
      rounding the total once (SUM-THEN-ROUND) is explicitly wrong and yields a different figure
      whenever the per-spot product carries a fractional cent.
    variants: []

  - name: order_net_due
    trigger: "every recomputation of order_gross_charge, and POST /political-ads/orders/{id}/decision with decision == ACCEPT"
    algorithm: constraint_propagation
    formula: |
      # The commission tier table is written against 'the amount payable on the order',
      # and the amount payable is net_due_cents, which itself contains the commission.
      # The evaluation order below RESOLVES that circularity by fiat; it is not iterated
      # to a fixed point and the tier is NEVER reselected from net_due_cents.
      step 1: gross = CommercialOrder.gross_charge_cents            # from order_gross_charge
      step 2: if CommercialOrder.agency_placed is false:
                  agency_commission_cents = 0
              else:
                  pct = AGENCY_COMMISSION_TIERS row whose [min_cents, max_cents] contains GROSS
                  agency_commission_cents = round_half_up(gross * pct)
      step 3: net_due_cents = gross + agency_commission_cents
      step 4: refund_owed_cents = max(0, paid_cents - refunded_cents - net_due_cents)
    input_set: "The order's own gross_charge_cents, agency_placed flag, paid_cents and refunded_cents. RebateLedgerEntry rows never feed net_due_cents; they only record the refund already implied by step 4."
    constants:
      AGENCY_COMMISSION_TIERS:
        - { min_cents: 0, max_cents: 49999, pct: 0.00 }
        - { min_cents: 50000, max_cents: 249999, pct: 0.02 }
        - { min_cents: 250000, max_cents: null, pct: 0.035 }
    precision: "Whole cents, round_half_up, applied once in step 2. Tier selection in step 2 reads gross_charge_cents only."
    variants: []

  - name: lowest_unit_charge
    trigger: "POST /political-ads/elections/{id}/luc-determinations; and the PROVISIONAL determination created as a side effect of POST /political-ads/orders/{id}/decision with decision == ACCEPT"
    algorithm: aggregation
    formula: |
      window_start = Election.window_start_date
      window_end   = Election.window_end_date            # equal to Election.election_date
      candidates = every ScheduledSpot S such that
            S.rate_class_id == input.rate_class_id
        AND the CommercialOrder O owning S has O.station_id == Election.station_id
        AND O.election_id == Election.id
        AND window_start <= S.air_date <= window_end          # BOTH ENDPOINTS INCLUSIVE
        AND S.status IN INCLUDED_SPOT_STATUSES[variant]
        AND O.status  IN INCLUDED_ORDER_STATUSES[variant]
        AND (when invoked as the ACCEPT side effect) O.id != the order being accepted
      if candidates is empty:
          luc_cents = card_unit_rate_cents(RateClass)
                    = round_half_up(RateClass.posted_rate_cents
                                    * DAYPART_MULTIPLIER[RateClass.daypart])
          basis = POSTED_RATE_FALLBACK
          basis_spot_id = null
          qualifying_spot_count = 0
      else:
          luc_cents = min over candidates of S.unit_equivalent_rate_cents
          basis = LOWEST_QUALIFYING_SPOT
          qualifying_spot_count = count of candidates
          basis_spot_id = the candidate attaining luc_cents, tie-broken by
                          earliest S.created_at ASC, then earliest S.air_date ASC,
                          then smallest S.start_offset_seconds ASC
    input_set: "ScheduledSpot rows priced from the named rate class on orders attributed to the named election, restricted by variant. Spots whose air_date is one day before window_start_date are outside the window; a spot whose air_date equals window_start_date is inside it."
    constants:
      UNIT_SECONDS: 30
      LUC_WINDOW_DAYS: { PRIMARY: 45, GENERAL: 60, RUNOFF: 45, SPECIAL: 45 }
      INCLUDED_SPOT_STATUSES: { PROVISIONAL: [SCHEDULED, AIRED], FINAL: [AIRED] }
      INCLUDED_ORDER_STATUSES: { PROVISIONAL: [ACCEPTED, SUSPENDED, RUNNING, COMPLETED], FINAL: [RUNNING, COMPLETED] }
    precision: "Whole cents; unit_equivalent_rate_cents is already round_half_up normalised to a 30-second unit, so the minimum is taken over integers."
    variants:
      - name: PROVISIONAL
        when: "Computed at order acceptance to cap a legally qualified candidate's spots, and on demand via POST /political-ads/elections/{id}/luc-determinations with variant PROVISIONAL"
        difference: "Counts spots that are merely SCHEDULED on orders that are only ACCEPTED or SUSPENDED. A cheap commercial order that has been accepted but has never run therefore drags the provisional charge down."
      - name: FINAL
        when: "Computed after the window closes via POST /political-ads/elections/{id}/luc-determinations with variant FINAL"
        difference: "Counts only spots that actually reached AIRED on orders that reached RUNNING or COMPLETED. The same database therefore yields a different luc_cents, and the FINAL figure retroactively reprices every candidate spot that was charged above it."

  - name: luc_final_reprice
    trigger: "POST /political-ads/elections/{id}/luc-determinations with variant == FINAL"
    algorithm: constraint_propagation
    formula: |
      D = the FINAL LucDetermination just computed
      targets = every ScheduledSpot S such that
            S.rate_class_id == D.rate_class_id
        AND the owning CommercialOrder O has O.election_id == D.election_id
        AND the Advertiser A owning O has A.status == CLASSIFIED_CANDIDATE
        AND S.status IN {SCHEDULED, AIRED}
        AND D.window_start_date <= S.air_date <= D.window_end_date
        AND S.unit_equivalent_rate_cents > D.luc_cents
      process targets in created_at ASC order, then air_date ASC, then start_offset_seconds ASC
      for each target S:
          hop 1: S.charged_rate_cents = round_half_up(D.luc_cents * S.duration_seconds / 30)
                 S.unit_equivalent_rate_cents = D.luc_cents
                 S.luc_cap_cents = D.luc_cents
                 S.luc_capped = true
          hop 2 (caused by hop 1): recompute O.gross_charge_cents, O.agency_commission_cents,
                 O.net_due_cents via order_gross_charge and order_net_due
          hop 3 (caused by hop 2): let owed = O.paid_cents - O.refunded_cents - O.net_due_cents;
                 if owed > O.rebate_total_cents, write one RebateLedgerEntry
                 {order_id: O.id, luc_determination_id: D.id, reason: LUC_FINAL_REPRICE,
                 amount_cents: owed - O.rebate_total_cents}, refresh O.rebate_total_cents to owed,
                 and move O.payment_status PAID -> REFUND_DUE (already-REFUND_DUE orders stay
                 REFUND_DUE and simply accrue the additional entry)
          hop 4 (caused by hop 3): create one PoliticalFileEntry {order_id: O.id,
                 event_type: RATE_ADJUSTMENT, posting_status: PENDING} and increment
                 Station.pending_file_entry_count by 1
      D.repriced_spot_count = count of targets
      D.rebate_total_cents  = sum of the RebateLedgerEntry.amount_cents written above
    input_set: "Only spots of CLASSIFIED_CANDIDATE advertisers inside the window priced above the FINAL charge. Issue advertisers are never repriced; the lowest unit charge is a candidate entitlement only."
    constants:
      UNIT_SECONDS: 30
    precision: "Whole cents, round_half_up on the per-spot cap in hop 1."
    variants: []

  - name: equal_opportunity_owed_units
    trigger: "POST /political-ads/eo-requests/{id}/respond with decision == GRANT"
    algorithm: weighted_scoring
    formula: |
      T = the CommercialOrder referenced by EqualOpportunityRequest.trigger_order_id
      opponent_spots = every ScheduledSpot S with S.order_id == T.id and S.status IN {SCHEDULED, AIRED}
      basis = Station.eo_parity_basis                       # variant selector
      if basis == SPOT_COUNT:
          owed_units = sum over opponent_spots of (S.duration_seconds / 30)
      if basis == DOLLAR_VALUE:
          opponent_value_cents = sum over opponent_spots of S.charged_rate_cents
          reference_rate_cents = card_unit_rate_cents(the trigger order's RateClass)
                               = round_half_up(RateClass.posted_rate_cents
                                               * DAYPART_MULTIPLIER[RateClass.daypart])
          owed_units = floor(opponent_value_cents / reference_rate_cents)
    input_set: "The trigger order's SCHEDULED and AIRED spots only. PREEMPTED and CANCELLED spots of the opponent create no equal-opportunity entitlement."
    constants:
      UNIT_SECONDS: 30
      DAYPART_MULTIPLIER: { MORNING: 0.60, DAYTIME: 0.45, EARLY_NEWS: 1.00, PRIME: 2.25, LATE_NIGHT: 0.35 }
    precision: "Integer units; DOLLAR_VALUE truncates toward zero via floor, never rounds up. reference_rate_cents is the UNDISCOUNTED card rate, so any volume discount on the opponent's order makes DOLLAR_VALUE award strictly fewer units than SPOT_COUNT on the very same spots."
    variants:
      - name: SPOT_COUNT
        when: "Station.eo_parity_basis == SPOT_COUNT"
        difference: "Parity is measured in 30-second units of airtime actually scheduled, so a 60-second opponent spot owes 2 units regardless of what it cost."
      - name: DOLLAR_VALUE
        when: "Station.eo_parity_basis == DOLLAR_VALUE"
        difference: "Parity is measured in dollars divided by the undiscounted 30-second card rate, so a volume-discounted opponent order owes strictly fewer units than SPOT_COUNT would award on the very same spots."

  - name: station_compliance_posture
    trigger: "every mutation of Station.overdue_file_entry_count or Station.open_complaint_count, and step 4 of POST /political-ads/stations/{id}/audit-sweep"
    algorithm: threshold
    formula: |
      breach_count = max(Station.overdue_file_entry_count, Station.open_complaint_count)
      if breach_count >= POSTURE_FROZEN_THRESHOLD:      compliance_posture = FROZEN
      elif breach_count >= POSTURE_RESTRICTED_THRESHOLD: compliance_posture = RESTRICTED
      else:                                              compliance_posture = OPEN
    input_set: "PoliticalFileEntry rows for this station with posting_status == OVERDUE, and FccComplaint rows for this station with status IN {OPEN, REOPENED}. The two counters are compared with max, never summed."
    constants:
      POSTURE_RESTRICTED_THRESHOLD: 1
      POSTURE_FROZEN_THRESHOLD: 2
    precision: "Integer comparison; the boundary is inclusive on both thresholds - exactly 2 overdue entries FREEZE, exactly 1 RESTRICTS."
    variants: []

  - name: political_file_timeliness
    trigger: "creation of any PoliticalFileEntry; POST /political-ads/file-entries/{id}/post; step 1 of POST /political-ads/stations/{id}/audit-sweep"
    algorithm: interval_merge
    formula: |
      due_at = event_occurred_at + Station.political_file_posting_deadline_hours hours
      on POST /political-ads/file-entries/{id}/post at logical clock NOW:
          if posting_status == OVERDUE:              posting_status = LATE_POSTED
          elif NOW <= due_at:                        posting_status = POSTED
          else:                                      posting_status = LATE_POSTED
          posted_at = NOW
          late_by_seconds = max(0, whole seconds from due_at to NOW)
      during audit-sweep step 1, for PENDING entries in created_at ASC order:
          if NOW > due_at: posting_status = OVERDUE
    input_set: "One PoliticalFileEntry at a time; Station.political_file_posting_deadline_hours is read at entry creation and frozen into due_at."
    precision: "Whole seconds. The deadline comparison is NOW <= due_at, so posting at exactly due_at is ON TIME and posting one second later is LATE."
    variants: []

  - name: payment_due_at
    trigger: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
    algorithm: threshold
    formula: |
      if CommercialOrder.payment_terms == PREPAY: payment_due_at = accepted_at
      if CommercialOrder.payment_terms == NET_30: payment_due_at = accepted_at + 30 days
    input_set: "The accepting order only."
    constants:
      NET_TERM_DAYS: 30
    precision: "ISO 8601 UTC with three fractional digits."
    variants: []

  - name: disclosure_conformance
    trigger: "POST /political-ads/orders; POST /political-ads/orders/{id}/submit"
    algorithm: threshold
    formula: |
      text = CommercialOrder.sponsorship_disclosure_text
      A = the Advertiser owning the order
      if text is null or text trimmed is empty:                    disclosure_status = MISSING
      elif text does not start with the exact prefix "PAID FOR BY ": disclosure_status = NONCONFORMING
      elif A.legal_name is not a substring of text:                 disclosure_status = NONCONFORMING
      elif CommercialOrder.disclosure_duration_seconds < DISCLOSURE_MIN_SECONDS:
                                                                    disclosure_status = NONCONFORMING
      else:                                                         disclosure_status = CONFORMING
      # The additional 'AUTHORIZED BY' requirement for legally qualified candidates is NOT part
      # of this calculation; it is validation priority 46, evaluated only at order acceptance,
      # because the advertiser may still be UNDER_REVIEW when the order is submitted.
    input_set: "The order's own sponsorship_disclosure_text and disclosure_duration_seconds, plus the owning Advertiser's legal_name. Branches are evaluated top to bottom and the first matching branch wins."
    constants:
      DISCLOSURE_MIN_SECONDS: 4
    precision: "Exact, case-sensitive string matching on the prefix and on legal_name."
    variants: []

  - name: eo_response_deadline
    trigger: "POST /political-ads/eo-requests"
    algorithm: threshold
    formula: |
      received_at = logical clock at request creation
      response_due_at = received_at + EO_RESPONSE_DEADLINE_HOURS hours
      # Request admissibility, checked at creation as validation priority 57:
      request_deadline = trigger_order.first_air_at + EO_REQUEST_WINDOW_DAYS days
      the request is admissible only while received_at <= request_deadline
    input_set: "The trigger order's first_air_at, which is non-null because the trigger order must have reached RUNNING or COMPLETED."
    constants:
      EO_REQUEST_WINDOW_DAYS: 7
      EO_RESPONSE_DEADLINE_HOURS: 24
      COMPLAINT_RESPONSE_DEADLINE_HOURS: 240
      CURE_PERIOD_HOURS: 720
    precision: "Whole seconds; both comparisons are inclusive (<=)."
    variants: []

  - name: spot_placement_geometry
    trigger: "POST /political-ads/orders/{id}/spots"
    algorithm: interval_merge
    formula: |
      new_start = request.start_offset_seconds
      new_end   = new_start + request.duration_seconds          # half-open interval [start, end)
      # (i) INVENTORY COLLISION - exact half-open overlap on one rate class and one air date.
      collide_set = every ScheduledSpot X with
            X.rate_class_id == order.rate_class_id
        AND X.air_date == request.air_date
        AND X.status IN {SCHEDULED, AIRED}
        AND the order owning X has status IN {DRAFT, SUBMITTED, ACCEPTED, SUSPENDED, RUNNING, COMPLETED}
      reject with ERR_SPOT_SLOT_COLLISION when any X satisfies
            new_start < X.start_offset_seconds + X.duration_seconds
        AND X.start_offset_seconds < new_end
      # Touching intervals do NOT collide: new_start == X_end or new_end == X_start is accepted.
      # (ii) CANDIDATE SEPARATION - buffer-expanded adjacency across one election, any rate class.
      separation_set = every ScheduledSpot Y with
            Y.air_date == request.air_date
        AND Y.status IN {SCHEDULED, AIRED}
        AND the order P owning Y has P.election_id == order.election_id (both non-null)
        AND P.advertiser_id != order.advertiser_id
        AND P.status IN {DRAFT, SUBMITTED, ACCEPTED, SUSPENDED, RUNNING, COMPLETED}
        AND the Advertiser of P and the Advertiser of the new spot's order are BOTH
            in status CLASSIFIED_CANDIDATE
      gap(Y) = max(0, max(new_start, Y.start) - min(new_end, Y.start + Y.duration_seconds))
      reject with ERR_CANDIDATE_SEPARATION_VIOLATION when any Y has
            gap(Y) < CANDIDATE_SEPARATION_BUFFER_SECONDS
      # (iii) STATION DAILY CAP - aggregate seconds over one station and one air date.
      day_seconds = sum of Z.duration_seconds over every ScheduledSpot Z with
            Z.air_date == request.air_date
        AND Z.status IN {SCHEDULED, AIRED}
        AND the order owning Z has station_id == order.station_id
        AND that order's status IN {DRAFT, SUBMITTED, ACCEPTED, SUSPENDED, RUNNING, COMPLETED}
      reject with ERR_STATION_DAILY_CAP_EXCEEDED when
            day_seconds + request.duration_seconds > Station.daily_political_seconds_cap
    input_set: "Checks (i), (ii) and (iii) are evaluated in that order at validation priorities 61, 62 and 63 respectively, so a placement that fails both (i) and (ii) reports ERR_SPOT_SLOT_COLLISION."
    constants:
      CANDIDATE_SEPARATION_BUFFER_SECONDS: 900
    precision: "Whole seconds. (i) uses strict half-open overlap so adjacency is legal; (ii) expands each interval by a 900-second buffer so adjacency up to 899 seconds apart is illegal; (iii) ignores placement entirely and sums durations over the whole broadcast day."
    variants: []

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty, and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "When the acting role is AdvertiserAgent, X-User-ID equals the advertiser_id of the resource being acted on (CommercialOrder.advertiser_id for order endpoints, EqualOpportunityRequest.requesting_advertiser_id for request endpoints, the request body's advertiser_id or requesting_advertiser_id on creates)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /political-ads/orders, POST /political-ads/orders/{id}/spots, POST /political-ads/orders/{id}/submit, POST /political-ads/orders/{id}/payments, POST /political-ads/orders/{id}/cancel, POST /political-ads/eo-requests"
  - priority: 4
    category: auth
    check: "The responding officer's X-User-ID differs from CommercialOrder.accepted_by_user_id of the order named by FccComplaint.order_id (segregation of duties: the officer who accepted the order may not answer the complaint about it)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /political-ads/complaints/{id}/respond"
  - priority: 5
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "every GET collection endpoint"
  - priority: 6
    category: existence
    check: "The Station named by the path or by the request body exists"
    error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /political-ads/stations/{id}/audit-sweep, GET /political-ads/stations/{id}, POST /political-ads/elections, POST /political-ads/advertisers, POST /political-ads/rate-classes, POST /political-ads/orders, POST /political-ads/eo-requests, POST /political-ads/complaints"
  - priority: 7
    category: existence
    check: "The Election named by the path or by the request body exists"
    error_id: ERR_ELECTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/elections/{id}, POST /political-ads/elections/{id}/luc-determinations, POST /political-ads/advertisers, POST /political-ads/orders"
  - priority: 8
    category: existence
    check: "The Advertiser named by the path or by the request body exists"
    error_id: ERR_ADVERTISER_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/advertisers/{id}, POST /political-ads/advertisers/{id}/review, POST /political-ads/advertisers/{id}/decision, POST /political-ads/orders, POST /political-ads/eo-requests"
  - priority: 9
    category: existence
    check: "The RateClass named by the path or by the request body exists"
    error_id: ERR_RATE_CLASS_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/rate-classes/{id}, POST /political-ads/rate-classes/{id}/withdraw, POST /political-ads/orders, POST /political-ads/elections/{id}/luc-determinations"
  - priority: 10
    category: existence
    check: "The CommercialOrder named by the path or by the request body exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "every /political-ads/orders/{id} endpoint, POST /political-ads/eo-requests, POST /political-ads/eo-requests/{id}/respond, POST /political-ads/complaints"
  - priority: 11
    category: existence
    check: "The ScheduledSpot named by the path exists"
    error_id: ERR_SPOT_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/spots/{id}, POST /political-ads/spots/{id}/disposition"
  - priority: 12
    category: existence
    check: "The PoliticalFileEntry named by the path exists"
    error_id: ERR_FILE_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/file-entries/{id}, POST /political-ads/file-entries/{id}/post"
  - priority: 13
    category: existence
    check: "The EqualOpportunityRequest named by the path exists"
    error_id: ERR_EO_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/eo-requests/{id}, POST /political-ads/eo-requests/{id}/respond"
  - priority: 14
    category: existence
    check: "The LucDetermination named by the path exists"
    error_id: ERR_LUC_DETERMINATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/luc-determinations/{id}"
  - priority: 15
    category: existence
    check: "The FccComplaint named by the path exists"
    error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/complaints/{id}, POST /political-ads/complaints/{id}/respond"
  - priority: 16
    category: existence
    check: "The RebateLedgerEntry named by the path exists"
    error_id: ERR_REBATE_NOT_FOUND
    http_status: 404
    applies_to: "GET /political-ads/rebates/{id}"
  - priority: 18
    category: business_constraint
    check: "Every required body field is present with the declared type; enum fields carry a declared member; duration_seconds is 30 or 60; start_offset_seconds is in [0, 86399]; posted_rate_cents >= 1; preemption_priority is 0 when preemptible is false and in [1,5] when preemptible is true; amount_cents >= 1; preemption_reason is non-empty when disposition == PREEMPTED; denial_reason is non-empty when decision == DENY; granted_order_id is present when decision == GRANT; rejection_reason is non-empty when decision == REJECT; dates parse as YYYY-MM-DD and timestamps as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every POST endpoint"
  - priority: 20
    category: state
    check: "expected_election_version equals Election.version"
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412
    applies_to: "POST /political-ads/elections/{id}/luc-determinations"
  - priority: 21
    category: state
    check: "expected_order_version equals CommercialOrder.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /political-ads/orders/{id}/payments"
  - priority: 24
    category: state
    check: "Advertiser.status == SUBMITTED or INFO_REQUESTED for /review; Advertiser.status == UNDER_REVIEW for /decision"
    error_id: ERR_ADVERTISER_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /political-ads/advertisers/{id}/review, POST /political-ads/advertisers/{id}/decision"
  - priority: 25
    category: state
    check: "CommercialOrder.status == DRAFT"
    error_id: ERR_ORDER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/spots, POST /political-ads/orders/{id}/submit"
  - priority: 26
    category: state
    check: "CommercialOrder.status == SUBMITTED"
    error_id: ERR_ORDER_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/decision"
  - priority: 27
    category: state
    check: "CommercialOrder.status IN {ACCEPTED, SUSPENDED, RUNNING, COMPLETED} for a CHARGE payment"
    error_id: ERR_ORDER_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/payments with direction == CHARGE, POST /political-ads/spots/{id}/disposition"
  - priority: 28
    category: state
    check: "CommercialOrder.status is not one of the terminal states REJECTED, COMPLETED, CANCELLED"
    error_id: ERR_ORDER_TERMINAL
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/cancel"
  - priority: 29
    category: state
    check: "ScheduledSpot.status == SCHEDULED"
    error_id: ERR_SPOT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /political-ads/spots/{id}/disposition"
  - priority: 30
    category: state
    check: "PoliticalFileEntry.posting_status IN {PENDING, OVERDUE}"
    error_id: ERR_FILE_ENTRY_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /political-ads/file-entries/{id}/post"
  - priority: 31
    category: state
    check: "EqualOpportunityRequest.status == RECEIVED"
    error_id: ERR_EO_REQUEST_NOT_OPEN
    http_status: 409
    applies_to: "POST /political-ads/eo-requests/{id}/respond"
  - priority: 32
    category: state
    check: "FccComplaint.status IN {OPEN, REOPENED}"
    error_id: ERR_COMPLAINT_NOT_OPEN
    http_status: 409
    applies_to: "POST /political-ads/complaints/{id}/respond"
  - priority: 33
    category: state
    check: "CommercialOrder.payment_status == REFUND_DUE for a REFUND payment"
    error_id: ERR_REFUND_NOT_DUE
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/payments with direction == REFUND"
  - priority: 40
    category: business_safety
    check: "Station.compliance_posture != FROZEN"
    error_id: ERR_STATION_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
  - priority: 42
    category: business_safety
    check: "Advertiser.status IN {CLASSIFIED_CANDIDATE, CLASSIFIED_ISSUE}"
    error_id: ERR_ADVERTISER_NOT_CLASSIFIED
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
  - priority: 43
    category: business_safety
    check: "The requesting Advertiser has status == CLASSIFIED_CANDIDATE"
    error_id: ERR_ADVERTISER_NOT_QUALIFIED_CANDIDATE
    http_status: 409
    applies_to: "POST /political-ads/eo-requests"
  - priority: 44
    category: business_safety
    check: "Station.compliance_posture != RESTRICTED when the ordering Advertiser has status == CLASSIFIED_ISSUE; a RESTRICTED station keeps serving legally qualified candidates but stops taking new issue advertising"
    error_id: ERR_STATION_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
  - priority: 45
    category: business_safety
    check: "The order's recomputed disclosure_status == CONFORMING"
    error_id: ERR_DISCLOSURE_NONCONFORMING
    http_status: 422
    applies_to: "POST /political-ads/orders/{id}/submit"
  - priority: 46
    category: business_safety
    check: "sponsorship_disclosure_text contains the literal 'AUTHORIZED BY' when the ordering Advertiser has status == CLASSIFIED_CANDIDATE"
    error_id: ERR_DISCLOSURE_AUTHORIZATION_MISSING
    http_status: 422
    applies_to: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
  - priority: 47
    category: business_safety
    check: "RateClass.preemptible == true"
    error_id: ERR_RATE_CLASS_NOT_PREEMPTIBLE
    http_status: 409
    applies_to: "POST /political-ads/spots/{id}/disposition with disposition == PREEMPTED"
  - priority: 50
    category: business_referential
    check: "The referenced RateClass.station_id, Advertiser.station_id and Election.station_id all equal the request body station_id"
    error_id: ERR_RATE_CLASS_STATION_MISMATCH
    http_status: 422
    applies_to: "POST /political-ads/orders"
  - priority: 51
    category: business_referential
    check: "RateClass.status == ACTIVE"
    error_id: ERR_RATE_CLASS_WITHDRAWN
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/spots, POST /political-ads/orders/{id}/decision with decision == ACCEPT"
  - priority: 52
    category: business_referential
    check: "The trigger order belongs to a different Advertiser than the requester, that Advertiser has status == CLASSIFIED_CANDIDATE, and the trigger order's election_id is non-null and equals the requester's Advertiser.election_id"
    error_id: ERR_EO_NOT_OPPOSING_CANDIDATE
    http_status: 422
    applies_to: "POST /political-ads/eo-requests"
  - priority: 53
    category: business_referential
    check: "The trigger CommercialOrder has status IN {RUNNING, COMPLETED} so that a first use has actually aired"
    error_id: ERR_EO_TRIGGER_ORDER_NOT_AIRED
    http_status: 409
    applies_to: "POST /political-ads/eo-requests"
  - priority: 55
    category: business_temporal
    check: "air_date is on or after the date part of the logical clock"
    error_id: ERR_SPOT_AIR_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /political-ads/orders/{id}/spots"
  - priority: 56
    category: business_temporal
    check: "ScheduledSpot.air_date is on or before the date part of the logical clock"
    error_id: ERR_SPOT_AIR_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /political-ads/spots/{id}/disposition with disposition == AIRED"
  - priority: 57
    category: business_temporal
    check: "The logical clock is on or before trigger_order.first_air_at plus EO_REQUEST_WINDOW_DAYS (7) days"
    error_id: ERR_EO_REQUEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /political-ads/eo-requests"
  - priority: 58
    category: business_temporal
    check: "The logical clock is on or before EqualOpportunityRequest.response_due_at"
    error_id: ERR_EO_RESPONSE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /political-ads/eo-requests/{id}/respond"
  - priority: 60
    category: business_constraint
    check: "CommercialOrder.spot_count >= 1"
    error_id: ERR_ORDER_HAS_NO_SPOTS
    http_status: 422
    applies_to: "POST /political-ads/orders/{id}/submit"
  - priority: 61
    category: business_constraint
    check: "Check (i) of calculation spot_placement_geometry: no half-open interval overlap with another SCHEDULED or AIRED spot on the same rate_class_id and air_date"
    error_id: ERR_SPOT_SLOT_COLLISION
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/spots"
  - priority: 62
    category: business_constraint
    check: "Check (ii) of calculation spot_placement_geometry: every opposing legally qualified candidate spot on the same air_date is at least CANDIDATE_SEPARATION_BUFFER_SECONDS (900) away"
    error_id: ERR_CANDIDATE_SEPARATION_VIOLATION
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/spots"
  - priority: 63
    category: business_constraint
    check: "Check (iii) of calculation spot_placement_geometry: the station's political seconds for that air_date, including the new spot, do not exceed Station.daily_political_seconds_cap"
    error_id: ERR_STATION_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /political-ads/orders/{id}/spots"
  - priority: 70
    category: business_fiscal
    check: "CommercialOrder.payment_terms == PREPAY when the ordering Advertiser has status == CLASSIFIED_ISSUE"
    error_id: ERR_PAYMENT_TERMS_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /political-ads/orders/{id}/decision with decision == ACCEPT"
  - priority: 71
    category: business_fiscal
    check: "For direction CHARGE, amount_cents == net_due_cents - paid_cents + refunded_cents; for direction REFUND, amount_cents == paid_cents - refunded_cents - net_due_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /political-ads/orders/{id}/payments"
  - priority: 72
    category: business_fiscal
    check: "CommercialOrder.payment_status == PAID when CommercialOrder.payment_terms == PREPAY"
    error_id: ERR_ORDER_NOT_PAID
    http_status: 409
    applies_to: "POST /political-ads/spots/{id}/disposition with disposition == AIRED"

endpoints:
  - method: POST
    path: "/political-ads/stations"
    description: "Register an FCC-licensed station and its political-file, inventory-cap and equal-opportunity parity configuration"
    roles: [PlatformAdmin]
    code: 201
    input: ["call_sign", "licensee_name", "market_code", "political_file_posting_deadline_hours?", "daily_political_seconds_cap?", "eo_parity_basis?"]
    output: Station
    side_effects: ["initialises all four compliance counters to 0 and compliance_posture to OPEN"]

  - method: GET
    path: "/political-ads/stations/{id}"
    description: "Read one station with its live compliance counters and derived posture"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: POST
    path: "/political-ads/stations/{id}/audit-sweep"
    description: "Run the compliance audit checkpoint: sweep overdue political-file entries, expire unanswered equal-opportunity requests, reopen or close cured complaints, recompute posture, then suspend or resume orders"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Station
    side_effects:
      - "step 1: PoliticalFileEntry PENDING -> OVERDUE for every entry past due_at, in created_at ASC order"
      - "step 2: EqualOpportunityRequest RECEIVED -> EXPIRED for every request past response_due_at, in created_at ASC order"
      - "step 3: FccComplaint RESPONDED -> REOPENED when remedy_code == PENDING_CURE and the clock reached cure_due_at; FccComplaint RESPONDED -> CLOSED when remedy_code IN {CURED, NO_VIOLATION}"
      - "step 4: recomputes overdue_file_entry_count, open_complaint_count and compliance_posture"
      - "step 5: CommercialOrder ACCEPTED -> SUSPENDED for every unpaid order on the station when posture is FROZEN"
      - "step 6: CommercialOrder SUSPENDED -> ACCEPTED for every suspended order on the station when posture is OPEN"
      - "sets Station.last_sweep_at and increments Station.version by 1"

  - method: POST
    path: "/political-ads/elections"
    description: "Declare an election and derive its lowest-unit-charge window"
    roles: [PlatformAdmin]
    code: 201
    input: [station_id, office_sought, election_type, election_date]
    output: Election
    side_effects: ["computes luc_window_days, window_start_date and window_end_date"]

  - method: GET
    path: "/political-ads/elections/{id}"
    description: "Read one election, including its current window status and version"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: Election
    side_effects: []

  - method: GET
    path: "/political-ads/elections"
    description: "List elections, optionally filtered by station or type. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "election_type?", "limit?", "offset?"]
    output: Election[]
    side_effects: []

  - method: POST
    path: "/political-ads/elections/{id}/luc-determinations"
    description: "Compute and record a lowest-unit-charge determination for one rate class under one variant; a FINAL determination retroactively reprices candidate spots"
    roles: [StationComplianceOfficer]
    code: 201
    input: [rate_class_id, variant, expected_election_version]
    output: LucDetermination
    side_effects:
      - "supersedes the prior ACTIVE LucDetermination for the same election_id, rate_class_id and variant"
      - "runs calculation lowest_unit_charge"
      - "runs calculation luc_final_reprice when variant == FINAL, cascading into ScheduledSpot, CommercialOrder, RebateLedgerEntry and PoliticalFileEntry"
      - "increments Election.version by 1"

  - method: POST
    path: "/political-ads/advertisers"
    description: "Open an advertiser intake record asserting candidate or issue status"
    roles: [StationComplianceOfficer, PlatformAdmin]
    code: 201
    input: ["station_id", "legal_name", "requested_class", "election_id?", "candidate_name?", "office_sought?", "qualification_evidence_ref?"]
    output: Advertiser
    side_effects: ["sets status to SUBMITTED, review_round to 0 and entitled_to_luc to false"]

  - method: GET
    path: "/political-ads/advertisers/{id}"
    description: "Read one advertiser with its classification state and review round"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: Advertiser
    side_effects: []

  - method: GET
    path: "/political-ads/advertisers"
    description: "List advertisers, optionally filtered by station, election or classification state. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "election_id?", "status?", "limit?", "offset?"]
    output: Advertiser[]
    side_effects: []

  - method: POST
    path: "/political-ads/advertisers/{id}/review"
    description: "Open or reopen the classification review; drives SUBMITTED -> UNDER_REVIEW and the INFO_REQUESTED -> UNDER_REVIEW loop leg"
    roles: [StationComplianceOfficer]
    code: 200
    input: []
    output: Advertiser
    side_effects: ["increments Advertiser.version by 1"]

  - method: POST
    path: "/political-ads/advertisers/{id}/decision"
    description: "Record a classification decision: request more evidence, classify as legally qualified candidate, classify as issue advertiser, or reject"
    roles: [StationComplianceOfficer]
    code: 200
    input: ["decision", "reason?"]
    output: Advertiser
    side_effects:
      - "decision REQUEST_INFO below MAX_REVIEW_ROUNDS increments review_round and moves to INFO_REQUESTED"
      - "decision REQUEST_INFO at review_round == MAX_REVIEW_ROUNDS moves to CLASSIFICATION_REJECTED with classification_reason MAX_REVIEW_ROUNDS_EXCEEDED"
      - "decision CLASSIFY_CANDIDATE sets entitled_to_luc true"
      - "records classified_by_user_id from X-User-ID"

  - method: POST
    path: "/political-ads/rate-classes"
    description: "Publish a preemptible or fixed rate class with its posted 30-second unit rate"
    roles: [PlatformAdmin]
    code: 201
    input: ["station_id", "class_code", "daypart", "preemptible", "posted_rate_cents", "preemption_priority?"]
    output: RateClass
    side_effects: ["sets status to ACTIVE"]

  - method: GET
    path: "/political-ads/rate-classes/{id}"
    description: "Read one rate class"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: RateClass
    side_effects: []

  - method: GET
    path: "/political-ads/rate-classes"
    description: "List rate classes, optionally filtered by station, daypart or status. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "daypart?", "status?", "limit?", "offset?"]
    output: RateClass[]
    side_effects: []

  - method: POST
    path: "/political-ads/rate-classes/{id}/withdraw"
    description: "Withdraw a rate class from sale; existing spots keep their charges but no new spot or acceptance may use it"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RateClass
    side_effects: ["sets status to WITHDRAWN and increments RateClass.version by 1"]

  - method: POST
    path: "/political-ads/orders"
    description: "Open a draft political advertising order under one rate class with its sponsorship identification and payment terms"
    roles: [AdvertiserAgent]
    code: 201
    input: ["station_id", "advertiser_id", "rate_class_id", "payment_terms", "sponsorship_disclosure_text", "disclosure_duration_seconds", "election_id?", "agency_placed?"]
    output: CommercialOrder
    side_effects: ["runs calculation disclosure_conformance to set disclosure_status", "sets status DRAFT and payment_status UNBILLED"]

  - method: GET
    path: "/political-ads/orders/{id}"
    description: "Read one order with both state dimensions, all money fields and its current version"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: CommercialOrder
    side_effects: []

  - method: GET
    path: "/political-ads/orders"
    description: "List orders, optionally filtered by station, advertiser, election, rate class or lifecycle state. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "advertiser_id?", "election_id?", "rate_class_id?", "status?", "limit?", "offset?"]
    output: CommercialOrder[]
    side_effects: []

  - method: POST
    path: "/political-ads/orders/{id}/spots"
    description: "Add a scheduled spot to a draft order; runs the three placement-geometry checks and reprices the whole order at the reselected volume tier"
    roles: [AdvertiserAgent]
    code: 201
    input: [air_date, start_offset_seconds, duration_seconds, program_code]
    output: ScheduledSpot
    side_effects:
      - "runs calculation spot_placement_geometry checks (i), (ii) and (iii)"
      - "recomputes CommercialOrder.spot_count, then order_gross_charge and order_net_due, repricing every surviving spot"
      - "increments CommercialOrder.version by 1"

  - method: POST
    path: "/political-ads/orders/{id}/submit"
    description: "Submit a draft order for station acceptance"
    roles: [AdvertiserAgent]
    code: 200
    input: []
    output: CommercialOrder
    side_effects: ["recomputes disclosure_status", "increments CommercialOrder.version by 1"]

  - method: POST
    path: "/political-ads/orders/{id}/decision"
    description: "Accept or reject a submitted order under the station's order acceptance policy"
    roles: [StationComplianceOfficer]
    code: 200
    input: ["decision", "rejection_reason?"]
    output: CommercialOrder
    side_effects:
      - "ACCEPT: invoices the order, creates the PROVISIONAL LucDetermination and applies the lowest-unit-charge cap for legally qualified candidates, computes payment_due_at, files an ORDER_ACCEPTED political file entry"
      - "REJECT: cancels every scheduled spot and zeroes the order's money fields"
      - "increments CommercialOrder.version by 1"

  - method: POST
    path: "/political-ads/orders/{id}/payments"
    description: "Record a settlement movement on the order's payment dimension; CHARGE settles the invoice, REFUND discharges a rebate"
    roles: [AdvertiserAgent]
    code: 200
    input: [direction, amount_cents, expected_order_version]
    output: CommercialOrder
    side_effects:
      - "CHARGE advances payment_status INVOICED -> PAID and raises paid_cents"
      - "REFUND advances payment_status REFUND_DUE -> REFUNDED and raises refunded_cents"
      - "increments CommercialOrder.version by 1"

  - method: POST
    path: "/political-ads/orders/{id}/cancel"
    description: "Cancel an order, cancelling its scheduled spots, writing any refund owed and releasing an equal-opportunity grant attached to it"
    roles: [AdvertiserAgent, StationComplianceOfficer]
    code: 200
    input: [cancellation_reason]
    output: CommercialOrder
    side_effects:
      - "cancels every SCHEDULED spot and recomputes the order's money fields"
      - "writes a RebateLedgerEntry with reason ORDER_CANCELLED and moves payment_status PAID -> REFUND_DUE when money is owed back"
      - "reverts any EqualOpportunityRequest granted against this order from GRANTED to RECEIVED"
      - "increments CommercialOrder.version by 1"

  - method: GET
    path: "/political-ads/spots/{id}"
    description: "Read one scheduled spot with its charge, unit-equivalent rate and cap flag"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: ScheduledSpot
    side_effects: []

  - method: GET
    path: "/political-ads/spots"
    description: "List scheduled spots, optionally filtered by order, rate class, status or air date. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["order_id?", "rate_class_id?", "status?", "air_date?", "limit?", "offset?"]
    output: ScheduledSpot[]
    side_effects: []

  - method: POST
    path: "/political-ads/spots/{id}/disposition"
    description: "Record traffic disposition of a spot: aired as ordered, or preempted out of a preemptible class"
    roles: [TrafficScheduler]
    code: 200
    input: ["disposition", "preemption_reason?"]
    output: ScheduledSpot
    side_effects:
      - "AIRED advances the owning order ACCEPTED -> RUNNING and then RUNNING -> COMPLETED when no spot remains SCHEDULED, and refreshes fulfilled_units on any equal-opportunity grant against the order"
      - "PREEMPTED zeroes the spot charge, reprices the order at the reselected volume tier, may write a SPOT_PREEMPTED rebate and files a RATE_ADJUSTMENT political file entry"
      - "increments ScheduledSpot.version by 1"

  - method: GET
    path: "/political-ads/file-entries/{id}"
    description: "Read one public political file entry with its due, posted and lateness fields"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: PoliticalFileEntry
    side_effects: []

  - method: GET
    path: "/political-ads/file-entries"
    description: "List public political file entries, optionally filtered by station, order, event type or posting status. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "order_id?", "event_type?", "posting_status?", "limit?", "offset?"]
    output: PoliticalFileEntry[]
    side_effects: []

  - method: POST
    path: "/political-ads/file-entries/{id}/post"
    description: "Post a political file entry to the public file, recording timeliness against its deadline"
    roles: [StationComplianceOfficer]
    code: 200
    input: [public_file_url]
    output: PoliticalFileEntry
    side_effects:
      - "sets posting_status to POSTED or LATE_POSTED and computes late_by_seconds"
      - "adjusts Station.pending_file_entry_count, overdue_file_entry_count and late_posting_count, then recomputes compliance_posture"
      - "increments PoliticalFileEntry.version by 1"

  - method: POST
    path: "/political-ads/eo-requests"
    description: "File an equal-opportunity request against an opposing candidate's first use"
    roles: [AdvertiserAgent]
    code: 201
    input: [station_id, requesting_advertiser_id, trigger_order_id]
    output: EqualOpportunityRequest
    side_effects: ["copies election_id from the trigger order and computes response_due_at"]

  - method: GET
    path: "/political-ads/eo-requests/{id}"
    description: "Read one equal-opportunity request with its deadline, owed units and parity basis"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: EqualOpportunityRequest
    side_effects: []

  - method: GET
    path: "/political-ads/eo-requests"
    description: "List equal-opportunity requests, optionally filtered by station, election, requester, trigger order or granted order. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "election_id?", "requesting_advertiser_id?", "trigger_order_id?", "granted_order_id?", "status?", "limit?", "offset?"]
    output: EqualOpportunityRequest[]
    side_effects: []

  - method: POST
    path: "/political-ads/eo-requests/{id}/respond"
    description: "Grant or deny an equal-opportunity request inside the response deadline"
    roles: [StationComplianceOfficer]
    code: 200
    input: ["decision", "granted_order_id?", "denial_reason?"]
    output: EqualOpportunityRequest
    side_effects:
      - "GRANT computes owed_units via equal_opportunity_owed_units and records parity_basis_applied"
      - "files an EQUAL_OPPORTUNITY_RESPONSE political file entry"
      - "increments EqualOpportunityRequest.version by 1"

  - method: GET
    path: "/political-ads/luc-determinations/{id}"
    description: "Read one lowest-unit-charge determination with its basis, window and reprice totals"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: LucDetermination
    side_effects: []

  - method: GET
    path: "/political-ads/luc-determinations"
    description: "List lowest-unit-charge determinations, optionally filtered by station, election, rate class, basis spot, variant or status. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "election_id?", "rate_class_id?", "basis_spot_id?", "variant?", "status?", "limit?", "offset?"]
    output: LucDetermination[]
    side_effects: []

  - method: GET
    path: "/political-ads/rebates/{id}"
    description: "Read one rebate ledger entry"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: RebateLedgerEntry
    side_effects: []

  - method: GET
    path: "/political-ads/rebates"
    description: "List rebate ledger entries, optionally filtered by order, determination or reason. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["order_id?", "luc_determination_id?", "reason?", "limit?", "offset?"]
    output: RebateLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/political-ads/complaints"
    description: "File an FCC complaint against a station, optionally naming a specific order"
    roles: [PublicComplainant]
    code: 201
    input: ["station_id", "complainant_name", "allegation_code", "narrative", "order_id?"]
    output: FccComplaint
    side_effects:
      - "computes response_due_at, increments Station.open_complaint_count by 1 and recomputes Station.compliance_posture"

  - method: GET
    path: "/political-ads/complaints/{id}"
    description: "Read one FCC complaint with its response deadline, remedy and cure clock"
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: []
    output: FccComplaint
    side_effects: []

  - method: GET
    path: "/political-ads/complaints"
    description: "List FCC complaints, optionally filtered by station, order, allegation or status. Results are ordered by created_at ASC, then paginated with limit and offset."
    roles: [PlatformAdmin, StationComplianceOfficer, TrafficScheduler, AdvertiserAgent, PublicComplainant]
    code: 200
    input: ["station_id?", "order_id?", "allegation_code?", "status?", "limit?", "offset?"]
    output: FccComplaint[]
    side_effects: []

  - method: POST
    path: "/political-ads/complaints/{id}/respond"
    description: "Record the station's response to an FCC complaint, subject to segregation of duties from the accepting officer"
    roles: [StationComplianceOfficer]
    code: 200
    input: [response_text, remedy_code]
    output: FccComplaint
    side_effects:
      - "sets responded_at, responded_by_user_id, late_response and cure_due_at"
      - "decrements Station.open_complaint_count by 1 and recomputes Station.compliance_posture"
      - "increments FccComplaint.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window and timeliness rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["moves the logical clock; performs no sweep of its own"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an undeclared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed for the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An AdvertiserAgent acts on an order or request belonging to a different advertiser"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The officer answering an FCC complaint is the same user who accepted the order the complaint names"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset negative"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required body field, wrong type, undeclared enum member, or out-of-range numeric value"
  - id: ERR_STATION_NOT_FOUND
    http: 404
    condition: "Referenced Station does not exist"
  - id: ERR_ELECTION_NOT_FOUND
    http: 404
    condition: "Referenced Election does not exist"
  - id: ERR_ADVERTISER_NOT_FOUND
    http: 404
    condition: "Referenced Advertiser does not exist"
  - id: ERR_RATE_CLASS_NOT_FOUND
    http: 404
    condition: "Referenced RateClass does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced CommercialOrder does not exist"
  - id: ERR_SPOT_NOT_FOUND
    http: 404
    condition: "Referenced ScheduledSpot does not exist"
  - id: ERR_FILE_ENTRY_NOT_FOUND
    http: 404
    condition: "Referenced PoliticalFileEntry does not exist"
  - id: ERR_EO_REQUEST_NOT_FOUND
    http: 404
    condition: "Referenced EqualOpportunityRequest does not exist"
  - id: ERR_LUC_DETERMINATION_NOT_FOUND
    http: 404
    condition: "Referenced LucDetermination does not exist"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "Referenced FccComplaint does not exist"
  - id: ERR_REBATE_NOT_FOUND
    http: 404
    condition: "Referenced RebateLedgerEntry does not exist"
  - id: ERR_STALE_ELECTION_VERSION
    http: 412
    condition: "expected_election_version does not equal the election's current version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the order's current version"
  - id: ERR_ADVERTISER_NOT_IN_REVIEW
    http: 409
    condition: "Review opened on an advertiser that is not SUBMITTED or INFO_REQUESTED, or a decision recorded on an advertiser that is not UNDER_REVIEW"
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "Spot added to, or submit attempted on, an order that has left DRAFT"
  - id: ERR_ORDER_NOT_SUBMITTED
    http: 409
    condition: "Acceptance decision recorded on an order that is not SUBMITTED"
  - id: ERR_ORDER_NOT_ACCEPTED
    http: 409
    condition: "Charge payment or spot disposition attempted on an order that has not been accepted"
  - id: ERR_ORDER_TERMINAL
    http: 409
    condition: "Cancellation attempted on an order already REJECTED, COMPLETED or CANCELLED"
  - id: ERR_SPOT_NOT_SCHEDULED
    http: 409
    condition: "Disposition recorded on a spot that already left SCHEDULED"
  - id: ERR_FILE_ENTRY_ALREADY_POSTED
    http: 409
    condition: "Posting attempted on a political file entry already POSTED or LATE_POSTED"
  - id: ERR_EO_REQUEST_NOT_OPEN
    http: 409
    condition: "Response recorded on an equal-opportunity request that is not RECEIVED"
  - id: ERR_COMPLAINT_NOT_OPEN
    http: 409
    condition: "Response recorded on a complaint that is not OPEN or REOPENED"
  - id: ERR_REFUND_NOT_DUE
    http: 409
    condition: "Refund payment attempted on an order whose payment_status is not REFUND_DUE"
  - id: ERR_STATION_POSTURE_FROZEN
    http: 409
    condition: "Order acceptance attempted while the station's compliance posture is FROZEN"
  - id: ERR_STATION_POSTURE_RESTRICTED
    http: 409
    condition: "Issue advertiser's order acceptance attempted while the station's compliance posture is RESTRICTED"
  - id: ERR_ADVERTISER_NOT_CLASSIFIED
    http: 409
    condition: "Order acceptance attempted while the advertiser has not reached a terminal classification"
  - id: ERR_ADVERTISER_NOT_QUALIFIED_CANDIDATE
    http: 409
    condition: "Equal-opportunity request filed by an advertiser that is not a legally qualified candidate"
  - id: ERR_DISCLOSURE_NONCONFORMING
    http: 422
    condition: "Order submitted while its sponsorship identification is MISSING or NONCONFORMING"
  - id: ERR_DISCLOSURE_AUTHORIZATION_MISSING
    http: 422
    condition: "Candidate order accepted without an AUTHORIZED BY clause in the sponsorship identification"
  - id: ERR_RATE_CLASS_NOT_PREEMPTIBLE
    http: 409
    condition: "Preemption attempted on a spot sold from a fixed rate class"
  - id: ERR_RATE_CLASS_STATION_MISMATCH
    http: 422
    condition: "The order's rate class, advertiser or election belongs to a different station than the order"
  - id: ERR_RATE_CLASS_WITHDRAWN
    http: 409
    condition: "Spot added or order accepted against a WITHDRAWN rate class"
  - id: ERR_EO_NOT_OPPOSING_CANDIDATE
    http: 422
    condition: "The trigger order is the requester's own, or belongs to an advertiser that is not a legally qualified candidate in the same election"
  - id: ERR_EO_TRIGGER_ORDER_NOT_AIRED
    http: 409
    condition: "The trigger order has not reached RUNNING or COMPLETED, so no first use has aired"
  - id: ERR_SPOT_AIR_DATE_IN_PAST
    http: 422
    condition: "Spot scheduled for a date before the logical clock's date"
  - id: ERR_SPOT_AIR_DATE_NOT_REACHED
    http: 409
    condition: "Spot marked AIRED before its air_date is reached on the logical clock"
  - id: ERR_EO_REQUEST_WINDOW_CLOSED
    http: 422
    condition: "Equal-opportunity request filed more than 7 days after the opponent's first use aired"
  - id: ERR_EO_RESPONSE_DEADLINE_PASSED
    http: 409
    condition: "Response recorded after the equal-opportunity request's 24-hour response deadline"
  - id: ERR_ORDER_HAS_NO_SPOTS
    http: 422
    condition: "Order submitted with spot_count of 0"
  - id: ERR_SPOT_SLOT_COLLISION
    http: 409
    condition: "New spot's half-open interval overlaps an existing spot on the same rate class and air date"
  - id: ERR_CANDIDATE_SEPARATION_VIOLATION
    http: 409
    condition: "New candidate spot sits within 900 seconds of an opposing candidate's spot on the same air date"
  - id: ERR_STATION_DAILY_CAP_EXCEEDED
    http: 409
    condition: "New spot would push the station's political seconds for that air date past its daily cap"
  - id: ERR_PAYMENT_TERMS_NOT_PERMITTED
    http: 422
    condition: "Issue advertiser's order accepted with NET_30 terms"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "Payment amount does not equal the exact outstanding charge or the exact refund owed"
  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "Spot on a PREPAY order marked AIRED before the order was paid in full"

roles:
  - name: PlatformAdmin
    description: "Regulatory operations administrator; provisions stations, elections and rate cards, drives the logical clock and runs the compliance audit sweep"
    identity: opaque
    exclusive_operations:
      - "POST /political-ads/stations"
      - "POST /political-ads/stations/{id}/audit-sweep"
      - "POST /political-ads/elections"
      - "POST /political-ads/rate-classes"
      - "POST /political-ads/rate-classes/{id}/withdraw"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /political-ads/advertisers"
      - "every GET endpoint"
  - name: StationComplianceOfficer
    description: "Station political-file and compliance officer; classifies advertisers, decides order acceptance, computes lowest-unit-charge determinations, posts the public file and answers equal-opportunity requests and FCC complaints"
    identity: opaque
    exclusive_operations:
      - "POST /political-ads/advertisers/{id}/review"
      - "POST /political-ads/advertisers/{id}/decision"
      - "POST /political-ads/orders/{id}/decision"
      - "POST /political-ads/elections/{id}/luc-determinations"
      - "POST /political-ads/file-entries/{id}/post"
      - "POST /political-ads/eo-requests/{id}/respond"
      - "POST /political-ads/complaints/{id}/respond"
    shared_operations:
      - "POST /political-ads/advertisers"
      - "POST /political-ads/orders/{id}/cancel"
      - "every GET endpoint"
  - name: TrafficScheduler
    description: "Station traffic and continuity operator; the only role that may record what actually ran. Segregated from the compliance officer so that the party deciding acceptance never certifies the airing."
    identity: opaque
    exclusive_operations:
      - "POST /political-ads/spots/{id}/disposition"
    shared_operations:
      - "every GET endpoint"
  - name: AdvertiserAgent
    description: "Buyer-side agent acting for one advertiser; places orders and spots, settles and refunds, cancels, and files equal-opportunity requests"
    identity: "entity_backed:Advertiser"
    exclusive_operations:
      - "POST /political-ads/orders"
      - "POST /political-ads/orders/{id}/spots"
      - "POST /political-ads/orders/{id}/submit"
      - "POST /political-ads/orders/{id}/payments"
      - "POST /political-ads/eo-requests"
    shared_operations:
      - "POST /political-ads/orders/{id}/cancel"
      - "every GET endpoint"
  - name: PublicComplainant
    description: "Member of the public or opposing interest; inspects the public political file and files FCC complaints"
    identity: opaque
    exclusive_operations:
      - "POST /political-ads/complaints"
    shared_operations:
      - "every GET endpoint"
