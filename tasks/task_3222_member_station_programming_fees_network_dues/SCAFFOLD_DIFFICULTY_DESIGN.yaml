            - "After the supersede the proposal reports yes_votes 0 and no_votes 2, since a CLASS_A NO weighs max(1, (3+1)//2) == 2"
            - "After the restore the proposal reports yes_votes 3 again, equal to the pre-supersede total, so Σ recorded_weight over RECORDED rows is conserved by the pair"
            - "The invalidated superseding row contributes recorded_weight 0 and does not double-count the station"
