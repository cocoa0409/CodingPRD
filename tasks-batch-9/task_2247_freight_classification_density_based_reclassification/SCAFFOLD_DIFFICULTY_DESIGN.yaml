  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: shipment_parallel_dimensions_with_reclass_revert_on_overturn
        grounds:
          - state_machines.Shipment.DECLARED_to_RECLASS_PENDING
          - state_machines.Shipment.RECLASS_PENDING_to_RECLASSED
          - state_machines.Shipment.RECLASSED_to_CAPTURED
          - state_machines.Shipment.UNBILLED_to_BILLED
          - state_machines.Shipment.REBILLED_to_CREDITED
        distinguishing_aspect: |
          Shipment carries two independent state axes: billing moves UNBILLED -> BILLED -> REBILLED
          -> CREDITED while classification moves DECLARED -> RECLASS_PENDING -> RECLASSED and then
          BACKWARD to CAPTURED on a full overturn — the only reverse edge in the scaffold — with
          neither axis advancing on the other's triggers.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1; customer ACME on an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "Shipment PRO5001 with a single 400 lb class 70 line (4 pieces 48.0x40.0x48.0), still UNBILLED and DECLARED."
