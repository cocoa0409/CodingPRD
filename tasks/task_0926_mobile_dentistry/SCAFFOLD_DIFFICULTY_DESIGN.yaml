              payload: { performing_staff_id: "${hyg_id}", sterilization_load_id: "${load1_id}" }
              as: FieldHygienist
              as_user_id: "${hyg_id}"
            - call: "POST /mobile-dentistry/encounters/${enc_id}/price"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /mobile-dentistry/procedures/${proc_id}/void"
              payload: { void_reason: "PATIENT_DECLINED_AT_CHAIR" }
              as: FieldDentist
              as_user_id: "${dentist_id}"
            - call: "POST /mobile-dentistry/encounters/${enc_id}/price"
              payload: {}
              as: BillingSpecialist
          assert:
            - "Before the trigger, Encounter.${enc_id}.total_charge_cents == 15025 and equals plan_paid_cents 0 + patient_responsibility_cents 2500 + write_off_cents 12525"
            - "Procedure.${proc_id}.status == VOIDED"
            - "Encounter.${enc_id}.billing_status == PRICED"
            - "Encounter.${enc_id}.subtotal_cents == 9300"
            - "Encounter.${enc_id}.supply_surcharge_cents == 1200"
            - "Encounter.${enc_id}.total_charge_cents == 10500"
            - "Encounter.${enc_id}.allowed_amount_cents == 2500"
            - "Encounter.${enc_id}.patient_responsibility_cents == 2500"
            - "Encounter.${enc_id}.plan_paid_cents == 0"
            - "Encounter.${enc_id}.write_off_cents == 8000"
            - "Encounter.${enc_id}.total_charge_cents == Encounter.${enc_id}.plan_paid_cents + Encounter.${enc_id}.patient_responsibility_cents + Encounter.${enc_id}.write_off_cents"
            - "Patient.${patient_id}.varnish_applications_in_period == 0"
            - "Patient.${patient_id}.last_varnish_date == null"

      - name: chair_minute_ledger_returns_exactly_the_minutes_each_void_releases
        grounds:
          - conservation_invariants[chair_minute_ledger]
          - calculations.site_visit_booked_chair_minutes
          - state_machines.Procedure.PLANNED_to_VOIDED
          - entities.SiteVisit.fields.booked_chair_minutes
        distinguishing_aspect: |
          A different conserved quantity — site-visit chair minutes rather than money. Booking runs
          10 + 15 + 12 + 8 = 45; voiding the 12-minute D1351 returns exactly 12 (leaving 33) and
          voiding the 8-minute D1206 returns exactly 8 (leaving 25), which is the sum over the
          surviving PLANNED-or-PERFORMED rows with no residue.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-11T09:00:00Z."
            - "Standard school stack with an ACTIVE SCREENING_FLUORIDE_SEALANT consent."
            - "One encounter screened and examined (25 chair minutes booked from the auto D0190 and D0150), then one PLANNED D1351 on tooth 3 surface O and one PLANNED D1206, bringing booked_chair_minutes to 45."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mobile-dentistry/program-periods"
              payload: { name: "SY2025-26", starts_on: "2025-08-01", ends_on: "2026-06-30" }
              as: ProgramAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /mobile-dentistry/sites"
              payload: { name: "Lincoln Elementary", site_type: "SCHOOL", state_code: "CA" }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
              payload: { full_name: "Ada Reyes", staff_role: "DENTIST", license_number: "D-1001", license_state: "CA", supervision_level: "SELF" }
              as: ProgramAdmin
              captures: { dentist_id: $.data.id }
            - call: "POST /mobile-dentistry/staff-members"
