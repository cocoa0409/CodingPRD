      - name: shared_operations_are_open_to_every_role_that_declares_them
        claim_type: shared_operations_allowed
        grounds:
          - roles.StudioExecutive.shared_operations
          - roles.Showrunner.shared_operations
          - roles.GuildAdministrator.shared_operations
          - roles.Writer.shared_operations
          - roles.LegalCounsel.shared_operations
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: |
          A shared operation is genuinely shared: the credit window closes identically for a Showrunner and
          for a GuildAdministrator, a room wraps identically for a Showrunner and a StudioExecutive, an
          availability window may be declared by the writer or by the guild on their behalf, and the clock
          endpoint answers all five roles - so no shared operation hides a second, role-specific gate.
        test_recipe:
          setup:
            - "Two independent seasons exist so the same shared operation can be exercised once per permitted role without collision."
          setup_api_calls:
