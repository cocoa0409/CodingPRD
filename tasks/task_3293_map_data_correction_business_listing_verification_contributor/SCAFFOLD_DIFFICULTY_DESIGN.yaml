              payload: { region_id: "${r14_id}", collection_zone: "zone-B", operator_id: "op-2", window_start: "2026-09-03T00:00:00Z", window_end: "2026-09-04T00:00:00Z", blur_obligation: "FULL_PRIVACY" }
              as: ImageryOperator
              as_user_id: "op-2"
              captures: { t14b_id: $.data.id }
          trigger:
            - call: "POST /v1/imagery-tasks/${t14b_id}/schedule"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-2"
              captures: { t14b_status: $.data.status }
            - call: "GET /v1/regions/${r14_id}"
              payload: {}
              as: PlatformAdmin
              captures: { r14_posture: $.data.posture }
          assert:
            - "ImageryTask.${t14b_id}.status == SCHEDULED (CLEARANCE_PENDING admits scheduling; only FROZEN blocks)"
            - "Region.${r14_id}.posture == CLEARANCE_PENDING (posture derived from sibling task state — the cross-entity dependency)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: imagery_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=15]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) — a task whose
          window_start == an existing SCHEDULED task's window_end does NOT
          overlap (allowed), while a task starting one hour before that end
          DOES overlap (rejected). Resource: Region+collection_zone on
          ImageryTask.
        test_recipe:
          setup:
            - "Region R15; task T15a SCHEDULED on zone-A with window [2026-09-02T08:00, 2026-09-02T16:00)"
            - "Task T15b PLANNED on zone-A with window [2026-09-02T16:00, 2026-09-03T00:00) (adjacent, half-open)"
            - "Task T15c PLANNED on zone-A with window [2026-09-02T15:00, 2026-09-02T17:00) (overlaps by 1h)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R15", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r15_id: $.data.id }
            - call: "POST /v1/imagery-tasks"
              payload: { region_id: "${r15_id}", collection_zone: "zone-A", operator_id: "op-1", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T16:00:00Z", blur_obligation: "FACES_ONLY" }
              as: ImageryOperator
              as_user_id: "op-1"
              captures: { t15a_id: $.data.id }
            - call: "POST /v1/imagery-tasks/${t15a_id}/schedule"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-1"
            - call: "POST /v1/imagery-tasks"
              payload: { region_id: "${r15_id}", collection_zone: "zone-A", operator_id: "op-1", window_start: "2026-09-02T16:00:00Z", window_end: "2026-09-03T00:00:00Z", blur_obligation: "FACES_ONLY" }
              as: ImageryOperator
              as_user_id: "op-1"
              captures: { t15b_id: $.data.id }
            - call: "POST /v1/imagery-tasks"
              payload: { region_id: "${r15_id}", collection_zone: "zone-A", operator_id: "op-1", window_start: "2026-09-02T15:00:00Z", window_end: "2026-09-02T17:00:00Z", blur_obligation: "FACES_ONLY" }
              as: ImageryOperator
              as_user_id: "op-1"
              captures: { t15c_id: $.data.id }
          trigger:
            - call: "POST /v1/imagery-tasks/${t15b_id}/schedule"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-1"
              captures: { t15b_status: $.data.status }
            - call: "POST /v1/imagery-tasks/${t15c_id}/schedule"
              payload: {}
              as: ImageryOperator
              as_user_id: "op-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "ImageryTask.${t15b_id}.status == SCHEDULED (adjacency end==start allowed under half-open semantics)"
            - "T15c schedule rejected with error_id == ERR_WINDOW_OVERLAP (1h overlap)"
            - "HTTP status for T15c == 409"

      - name: routing_24h_buffer_exactly_allowed_23h_rejected
        grounds:
          - validations[priority=16]
        distinguishing_aspect: |
          Different interval semantics and different resource than instance 1:
          a 24h exclusion BUFFER around CLOSURE windows on the same segment_ref
          (RoutingUpdate). Exactly 24h gap is allowed; 23h gap is rejected.
        test_recipe:
          setup:
            - "Region R16 ACTIVE"
            - "RoutingUpdate U16a CLOSURE on segment S1 validated with window [2026-09-10T00:00, 2026-09-12T00:00) -> ACTIVE-or-SCHEDULED (starts in future -> SCHEDULED)"
            - "U16b CLOSURE on S1 with window starting exactly 2026-09-13T00:00 (24h gap) — must validate"
            - "U16c CLOSURE on S1 with window starting 2026-09-12T23:00 (23h gap) — must be rejected"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R16", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r16_id: $.data.id, r16_v0: $.data.version }
            - call: "POST /v1/routing-updates"
              payload: { region_id: "${r16_id}", segment_ref: "S1", kind: "CLOSURE", effective_start: "2026-09-10T00:00:00Z", effective_end: "2026-09-12T00:00:00Z", expected_region_version: "${r16_v0}" }
              as: RoutingEngineer
              as_user_id: "re-1"
              captures: { u16a_id: $.data.id }
            - call: "POST /v1/routing-updates/${u16a_id}/validate"
              payload: {}
              as: RoutingEngineer
              as_user_id: "re-1"
            - call: "GET /v1/regions/${r16_id}"
              payload: {}
              as: PlatformAdmin
              captures: { r16_v1: $.data.version }
            - call: "POST /v1/routing-updates"
              payload: { region_id: "${r16_id}", segment_ref: "S1", kind: "CLOSURE", effective_start: "2026-09-13T00:00:00Z", effective_end: "2026-09-14T00:00:00Z", expected_region_version: "${r16_v1}" }
              as: RoutingEngineer
              as_user_id: "re-1"
              captures: { u16b_id: $.data.id }
            - call: "GET /v1/regions/${r16_id}"
              payload: {}
              as: PlatformAdmin
              captures: { r16_v2: $.data.version }
            - call: "POST /v1/routing-updates"
              payload: { region_id: "${r16_id}", segment_ref: "S1", kind: "CLOSURE", effective_start: "2026-09-12T23:00:00Z", effective_end: "2026-09-13T23:00:00Z", expected_region_version: "${r16_v2}" }
              as: RoutingEngineer
              as_user_id: "re-1"
              captures: { u16c_id: $.data.id }
          trigger:
            - call: "POST /v1/routing-updates/${u16b_id}/validate"
              payload: {}
              as: RoutingEngineer
              as_user_id: "re-1"
              captures: { u16b_status: $.data.status }
            - call: "POST /v1/routing-updates/${u16c_id}/validate"
              payload: {}
              as: RoutingEngineer
              as_user_id: "re-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "RoutingUpdate.${u16b_id}.status in {SCHEDULED, ACTIVE} (exactly 24h gap allowed)"
            - "U16c validate rejected with error_id == ERR_ROUTING_WINDOW_CONFLICT (23h gap < 24h buffer)"
            - "HTTP status for U16c == 409"

  - rule_id: compensating_invariant
    instances:
      - name: grant_post_then_revoke_restores_total_points
        grounds:
          - calculations.contributor_points_award
          - state_machines.MapEdit.PUBLISHED_to_REVERTED
        distinguishing_aspect: |
          Conserved quantity: Contributor.total_points. Forward action = edit
          publish (grant POSTED); compensating action = edit revert (grant
          REVOKED). Invariant: total_points after publish+revert equals
          total_points before publish, while lifetime_points grows by the
          grant amount (revoke does not erase history).
        test_recipe:
          setup:
            - "Region R17; contributor C16 with total_points 0; listing L17"
            - "C16 submits an ATTRIBUTE edit with 3 evidence URLs -> score 85 -> PUBLISHED with grant (base 5, multiplier 0.5 for NEWCOMER => 3 points)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R17", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r17_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C16", email: "c16@x.com", home_region_id: "${r17_id}" }
              as: Anonymous
              captures: { c16_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r17_id}", name: "Spa Seventeen", category: "SERVICE", address_text: "17 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l17_id: $.data.id, l17_v0: $.data.version }
            - call: "POST /v1/map-edits"
              payload: { listing_id: "${l17_id}", contributor_id: "${c16_id}", edit_type: "ATTRIBUTE", payload: { attribute: "wifi", value: true, evidence_urls: ["u1", "u2", "u3"] }, expected_listing_version: "${l17_v0}" }
              as: Contributor
              as_user_id: "${c16_id}"
              captures: { e17_id: $.data.id }
            - call: "GET /v1/contributors/${c16_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pts_after_pub: $.data.total_points, life_after_pub: $.data.lifetime_points }
          trigger:
            - call: "POST /v1/map-edits/${e17_id}/revert"
              payload: {}
              as: PolicyAnalyst
              as_user_id: "pa-1"
            - call: "GET /v1/contributors/${c16_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pts_final: $.data.total_points, life_final: $.data.lifetime_points }
          assert:
            - "total_points after publish == 3 (round(5*0.5)=3)"
            - "total_points after revert == 0 (conserved quantity restored)"
            - "lifetime_points after revert == 3 (revocation preserves history)"
            - "MapEdit.${e17_id}.status == REVERTED"

      - name: listing_review_count_add_then_remove_restores_aggregate
        grounds:
          - state_machines.UserReview.UNDER_MODERATION_to_REMOVED
          - entities.BusinessListing.fields.review_count
        distinguishing_aspect: |
          Different conserved quantity than instance 1:
          BusinessListing.review_count (count of PUBLISHED reviews). Forward =
          review creation (+1); compensating = moderation REMOVE (-1).
          Invariant: review_count returns to its pre-creation value and
          rating_avg returns to 0.0.
        test_recipe:
          setup:
            - "Region R18; listing L18 (no reviews; review_count 0, rating_avg 0.0)"
            - "Reviewer C17 posts a 4-star review -> review_count 1, rating_avg 4.0"
            - "Flagger C18 flags; moderator pulls to UNDER_MODERATION (aggregates already exclude it: count 0)"
          setup_api_calls:
            - call: "POST /v1/regions"
              payload: { name: "R18", country_code: "US", timezone: "America/Chicago", geo_min_lat: 40.0, geo_max_lat: 41.0, geo_min_lng: -88.0, geo_max_lng: -87.0 }
              as: PlatformAdmin
              captures: { r18_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C17", email: "c17@x.com", home_region_id: "${r18_id}" }
              as: Anonymous
              captures: { c17_id: $.data.id }
            - call: "POST /v1/contributors"
              payload: { display_name: "C18", email: "c18@x.com", home_region_id: "${r18_id}" }
              as: Anonymous
              captures: { c18_id: $.data.id }
            - call: "POST /v1/business-listings"
              payload: { region_id: "${r18_id}", name: "Cafe Eighteen", category: "RESTAURANT", address_text: "18 Main St", geo_lat: 40.5, geo_lng: -87.5 }
              as: PlatformAdmin
              captures: { l18_id: $.data.id }
            - call: "POST /v1/reviews"
              payload: { listing_id: "${l18_id}", contributor_id: "${c17_id}", rating: 4, text: "Solid coffee and quick service, will visit again." }
              as: Contributor
              as_user_id: "${c17_id}"
              captures: { rv18_id: $.data.id }
            - call: "GET /v1/business-listings/${l18_id}"
              payload: {}
              as: PlatformAdmin
              captures: { count_after_add: $.data.review_count, avg_after_add: $.data.rating_avg }
            - call: "POST /v1/reviews/${rv18_id}/flag"
              payload: { reason: "SPAM" }
              as: Contributor
              as_user_id: "${c18_id}"
              captures: { fl18_id: $.data.id }
            - call: "POST /v1/review-tickets"
              payload: { queue: "REVIEW_MODERATION", review_flag_id: "${fl18_id}" }
              as: Moderator
              as_user_id: "mod-1"
              captures: { t18_id: $.data.id }
          trigger:
            - call: "POST /v1/review-tickets/${t18_id}/resolve"
              payload: { resolution: "REMOVE" }
              as: Moderator
              as_user_id: "mod-1"
            - call: "GET /v1/business-listings/${l18_id}"
              payload: {}
              as: PlatformAdmin
              captures: { count_final: $.data.review_count, avg_final: $.data.rating_avg }
          assert:
            - "review_count after add == 1 and rating_avg after add == 4.0"
            - "review_count after REMOVE == 0 (conserved quantity restored)"
            - "rating_avg after REMOVE == 0.0 (empty PUBLISHED set)"
            - "UserReview.${rv18_id}.status == REMOVED"
