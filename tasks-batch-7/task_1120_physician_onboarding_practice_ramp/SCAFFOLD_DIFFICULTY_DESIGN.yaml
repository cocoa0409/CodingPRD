            - { call: "POST /onboarding/income-guarantees/${gar_id}/activate", payload: {}, as: FinanceAnalyst }
            - { call: "POST /onboarding/ramp-milestones/${ms1}/attest", payload: {}, as: FinanceAnalyst, captures: { ms_st: "$.data.status", attained: "$.data.attained" } }
