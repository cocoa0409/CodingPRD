          - errors[ERR_MAKEUP_CREDIT_EXCEEDED]
        distinguishing_aspect: "Applying even 1 cent of makeup credit against a zero bank balance is 422 ERR_MAKEUP_CREDIT_EXCEEDED — the request fails rather than clamping."
        test_recipe:
