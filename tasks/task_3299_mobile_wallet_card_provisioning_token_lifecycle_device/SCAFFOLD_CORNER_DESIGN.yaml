              as_user_id: "${ch_id}"
              captures: { b_sess: $.data.id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${b_sess}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "POST /devices/${dev_id}/provisioning-sessions/${b_sess}/verify"
