            - "Candidate A and candidate B are both FEDERAL INCUMBENTS with voting_alignment_pct 90 and committee_relevance_score 80 and no grassroots alerts in their districts, so each scores 80.50 and gets max_allowed_cents 250000."
            - "Contribution X: 250000 to candidate A, PENDING_BOARD, proposed by gad-1. Contribution Y: 200000 to candidate B, PENDING_BOARD, proposed by gad-1."
