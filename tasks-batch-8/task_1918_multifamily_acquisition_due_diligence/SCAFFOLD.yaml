  - method: POST
    path: "/acquisitions/{id}/proration-statements"
    description: "Generate a proration statement (OCC on expected_acquisition_version); DRAFT_CLOSING allowed in DILIGENCE_COMPLETE/PRE_CLOSING, FINAL_CLOSING in PRE_CLOSING, POST_CLOSING_TRUEUP in CLOSED; FINAL_CLOSING supersedes the APPROVED DRAFT_CLOSING"
    roles: [UnderwritingManager]
    code: 201
    input: [statement_type, day_count_method, expected_acquisition_version]
    output: ProrationStatement
    side_effects: ["GENERATED lines computed per closing_proration; supersede cascade; increments Acquisition.version by 1"]
  - method: GET
    path: "/acquisitions/proration-statements"
    description: "List statements; filterable"
    roles: *all_roles
    code: 200
    input: ["acquisition_id?", "status?", "statement_type?", "limit?", "offset?"]
    output: "ProrationStatement[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/proration-statements/{id}"
    description: "Read one statement with totals"
    roles: *all_roles
    code: 200
    input: []
    output: ProrationStatement
    side_effects: []
  - method: POST
    path: "/acquisitions/proration-statements/{id}/lines"
    description: "Append a MANUAL line while the statement is DRAFT (OCC on expected_statement_version)"
    roles: [UnderwritingManager]
    code: 201
    input: [expected_statement_version, line_type, direction, amount_cents, "memo?"]
    output: ProrationLine
    side_effects: ["statement totals recompute; increments ProrationStatement.version by 1"]
  - method: GET
    path: "/acquisitions/proration-statements/{id}/lines"
    description: "List lines of a statement"
    roles: *all_roles
    code: 200
    input: ["limit?", "offset?"]
    output: "ProrationLine[]"
    side_effects: []
  - method: POST
    path: "/acquisitions/proration-statements/{id}/submit-review"
    description: "DRAFT -> REVIEWED; reviewer must differ from creator"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: ProrationStatement
    side_effects: ["reviewed_by_user_id stamped"]
  - method: POST
    path: "/acquisitions/proration-statements/{id}/send-back"
    description: "REVIEWED -> DRAFT (revision loop)"
    roles: [UnderwritingManager]
    code: 200
    input: ["reason?"]
    output: ProrationStatement
    side_effects: ["reviewed_by_user_id cleared"]
  - method: POST
    path: "/acquisitions/proration-statements/{id}/approve"
    description: "REVIEWED -> APPROVED; approver must differ from creator and reviewer; drift check and approved-tax gate enforced"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: ProrationStatement
    side_effects: ["Acquisition.net_proration_cents re-derives"]
  - method: POST
    path: "/acquisitions/proration-statements/{id}/settle"
    description: "APPROVED -> SETTLED for FINAL_CLOSING/POST_CLOSING_TRUEUP once the acquisition is CLOSED"
    roles: [EscrowOfficer]
    code: 200
    input: []
    output: ProrationStatement
    side_effects: ["Acquisition.net_proration_cents finalized"]

  # --- Post-closing adjustments ---
  - method: POST
    path: "/acquisitions/adjustments"
    description: "Assert a post-closing adjustment; only while acquisition is CLOSED and within the true-up window"
    roles: [AcquisitionsAnalyst]
    code: 201
    input: [acquisition_id, adjustment_type, amount_cents, direction]
    output: PostClosingAdjustment
    side_effects: ["status ASSERTED; asserted_date stamped from clock"]
  - method: GET
    path: "/acquisitions/adjustments"
    description: "List adjustments; filterable"
    roles: *all_roles
    code: 200
    input: ["acquisition_id?", "status?", "limit?", "offset?"]
    output: "PostClosingAdjustment[]"
    side_effects: []
  - method: GET
    path: "/acquisitions/adjustments/{id}"
    description: "Read one adjustment"
    roles: *all_roles
    code: 200
    input: []
    output: PostClosingAdjustment
    side_effects: []
  - method: POST
    path: "/acquisitions/adjustments/{id}/evidence"
    description: "ASSERTED -> EVIDENCED; COLLECTION_LOSS cap enforced here; an optional corrected amount_cents replaces the asserted amount before the cap check"
    roles: [AcquisitionsAnalyst]
    code: 200
    input: [evidence_note, "amount_cents?", "pre_closing_arrears_cents?", "collections_applied_cents?"]
    output: PostClosingAdjustment
    side_effects: []
  - method: POST
    path: "/acquisitions/adjustments/{id}/accept"
    description: "EVIDENCED -> ACCEPTED"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: PostClosingAdjustment
    side_effects: []
  - method: POST
    path: "/acquisitions/adjustments/{id}/dispute"
    description: "EVIDENCED -> DISPUTED"
    roles: [UnderwritingManager]
    code: 200
    input: [reason]
    output: PostClosingAdjustment
    side_effects: []
  - method: POST
    path: "/acquisitions/adjustments/{id}/resolve"
    description: "DISPUTED -> RESOLVED with an agreed amount"
    roles: [UnderwritingManager]
    code: 200
    input: [resolved_amount_cents]
    output: PostClosingAdjustment
    side_effects: ["resolved_amount_cents recorded"]
  - method: POST
    path: "/acquisitions/adjustments/{id}/apply"
    description: "ACCEPTED or RESOLVED -> APPLIED; posts an ADJUSTMENT line into the acquisition's DRAFT POST_CLOSING_TRUEUP statement (creating it if absent, day_count_method copied from the FINAL_CLOSING statement)"
    roles: [UnderwritingManager]
    code: 200
    input: []
    output: PostClosingAdjustment
    side_effects: ["true-up statement found or created; ADJUSTMENT line appended (ACCEPTED uses amount_cents; RESOLVED uses resolved_amount_cents); statement totals recompute"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Advancing the clock runs the service-contract auto-renew sweep (IDENTIFIED/UNDER_REVIEW contracts with auto_renew true and decision_deadline < new clock become AUTO_RENEWED)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["ServiceContract auto-renew sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not in the declared catalog" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  # --- Request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or negative money/count where meaningless" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries a value outside its declared set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "End precedes start (lease term, walk window, coverage window, notice/effective ordering)" }
  # --- Existence ---
  - { id: ERR_ACQUISITION_NOT_FOUND, http: 404, condition: "Acquisition id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Unit id does not exist (path or body FK)" }
  - { id: ERR_LEASE_FILE_NOT_FOUND, http: 404, condition: "LeaseFile id does not exist (path or body FK)" }
  - { id: ERR_CONCESSION_NOT_FOUND, http: 404, condition: "Concession id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "UnitWalkInspection id does not exist" }
  - { id: ERR_FINDING_NOT_FOUND, http: 404, condition: "DeficiencyFinding id does not exist" }
  - { id: ERR_UTILITY_RECORD_NOT_FOUND, http: 404, condition: "UtilityExpenseRecord id does not exist" }
  - { id: ERR_TAX_PROJECTION_NOT_FOUND, http: 404, condition: "TaxReassessmentProjection id does not exist" }
  - { id: ERR_DEPOSIT_NOT_FOUND, http: 404, condition: "SecurityDepositLedgerEntry id does not exist" }
  - { id: ERR_EMPLOYEE_DECISION_NOT_FOUND, http: 404, condition: "EmployeeDecision id does not exist" }
  - { id: ERR_SERVICE_CONTRACT_NOT_FOUND, http: 404, condition: "ServiceContract id does not exist" }
  - { id: ERR_INSURANCE_POLICY_NOT_FOUND, http: 404, condition: "InsurancePolicy id does not exist" }
  - { id: ERR_PRORATION_STATEMENT_NOT_FOUND, http: 404, condition: "ProrationStatement id does not exist" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND, http: 404, condition: "PostClosingAdjustment id does not exist" }
  # --- State ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not allowed from the entity's current state (includes all mutations on terminal entities)" }
  - { id: ERR_ACQUISITION_NOT_IN_DILIGENCE, http: 409, condition: "Operation requires acquisition status IN_DILIGENCE (e.g. employee-decision approve, DRAFT_CLOSING preconditions)" }
  - { id: ERR_ACQUISITION_NOT_PRE_CLOSING, http: 409, condition: "Operation requires acquisition status PRE_CLOSING (deposit queue-escrow, FINAL_CLOSING generation)" }
  - { id: ERR_ACQUISITION_NOT_CLOSED, http: 409, condition: "Operation requires acquisition status CLOSED (statement settle, adjustment assert)" }
  - { id: ERR_STATEMENT_TYPE_NOT_ALLOWED_FOR_PHASE, http: 409, condition: "Statement type not generatable in the acquisition's current phase (DRAFT_CLOSING needs DILIGENCE_COMPLETE/PRE_CLOSING; FINAL_CLOSING needs PRE_CLOSING; POST_CLOSING_TRUEUP needs CLOSED)" }
  - { id: ERR_STATEMENT_NOT_REVIEWED, http: 409, condition: "Approve requires statement status REVIEWED" }
  - { id: ERR_STATEMENT_NOT_SETTLABLE, http: 409, condition: "Settle requires statement_type FINAL_CLOSING or POST_CLOSING_TRUEUP" }
  - { id: ERR_LEASE_NOT_AUDITED, http: 409, condition: "Deposit reconcile requires the lease status in {AUDITED, RESOLVED, WAIVED}" }
  - { id: ERR_TAX_PROJECTION_NOT_APPROVED, http: 409, condition: "An APPROVED TaxReassessmentProjection is required (statement generation and approve)" }
  - { id: ERR_NO_APPROVED_DRAFT_STATEMENT, http: 409, condition: "advance-to-pre-closing requires an APPROVED DRAFT_CLOSING statement" }
  - { id: ERR_NO_APPROVED_FINAL_STATEMENT, http: 409, condition: "execute-closing requires an APPROVED FINAL_CLOSING statement" }
  - { id: ERR_DEPOSITS_NOT_QUEUED, http: 409, condition: "execute-closing requires every deposit ESCROW_QUEUED or TRANSFERRED" }
  - { id: ERR_OPEN_DECISIONS_REMAIN, http: 409, condition: "execute-closing requires no EmployeeDecision in PROPOSED" }
  - { id: ERR_OPEN_SERVICE_CONTRACTS_REMAIN, http: 409, condition: "execute-closing requires no ServiceContract in IDENTIFIED or UNDER_REVIEW" }
  - { id: ERR_UNRESOLVED_AUDIT_ITEMS, http: 409, condition: "complete-diligence requires all leases audited-clean, no RECORDED/DISPUTED deposits, all non-EXCLUDED units VERIFIED" }
  - { id: ERR_FINAL_STATEMENT_NOT_SETTLED, http: 409, condition: "Acquisition settle requires the FINAL_CLOSING statement SETTLED" }
  - { id: ERR_TRUEUP_STATEMENT_NOT_SETTLED, http: 409, condition: "Acquisition settle requires any POST_CLOSING_TRUEUP statement SETTLED" }
  - { id: ERR_OPEN_ADJUSTMENTS_REMAIN, http: 409, condition: "Acquisition settle requires all adjustments terminal (APPLIED)" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_acquisition_version / expected_statement_version does not match the parent's current version" }
  # --- Referential / SoD ---
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties breached: statement reviewer/approver must differ from creator (and approver from reviewer); employee approver must differ from proposer; QA caller must differ from completer" }
  - { id: ERR_SUPERSEDE_TARGET_NOT_CURRENT, http: 409, condition: "supersedes_lease_id does not name the unit's current non-SUPERSEDED lease" }
  - { id: ERR_RENT_ROLL_ENTRY_MISSING, http: 422, condition: "Lease audit requires a RentRollEntry for the unit" }
  # --- Safety / compliance ---
  - { id: ERR_HIGH_RISK_POLICY_REQUIRES_OVERRIDE, http: 409, condition: "Assuming a policy with risk_tier HIGH without override_high_risk=true" }
  - { id: ERR_ACQUISITION_BLOCKED, http: 409, condition: "complete-diligence attempted while readiness_posture is BLOCKED" }
  # --- Constraint ---
  - { id: ERR_DUPLICATE_UNIT_NUMBER, http: 409, condition: "unit_number already exists within the acquisition" }
  - { id: ERR_ACTIVE_LEASE_EXISTS, http: 409, condition: "Unit already has a current (non-SUPERSEDED) lease and no supersedes_lease_id was given" }
  - { id: ERR_RENT_ROLL_ENTRY_EXISTS, http: 409, condition: "Unit already has a rent roll entry" }
  - { id: ERR_UTILITY_RECORD_EXISTS, http: 409, condition: "A record already exists for (acquisition, period_month, category)" }
  - { id: ERR_INSPECTION_NOT_COMPLETED, http: 409, condition: "Findings may only be recorded on a COMPLETED inspection" }
  - { id: ERR_FINDINGS_REQUIRED, http: 409, condition: "QA accept with no_findings_declared=false requires at least one finding" }
  # --- Temporal ---
  - { id: ERR_INSPECTOR_DOUBLE_BOOKED, http: 409, condition: "Half-open walk window overlaps another SCHEDULED/COMPLETED inspection of the same inspector_ref (adjacent windows allowed)" }
  - { id: ERR_CONCESSION_OVERLAP, http: 409, condition: "Closed coverage interval shares at least one calendar day with another PENDING/VERIFIED concession on the same lease" }
  - { id: ERR_NOTICE_WINDOW_MISSED, http: 409, condition: "send-notice with logical clock past decision_deadline (term_end_date - cancellation_notice_days); the deadline day itself is still allowed" }
  - { id: ERR_NOTICE_PERIOD_INSUFFICIENT, http: 409, condition: "Employee decision effective_date - notice_date < required_notice_days" }
  - { id: ERR_NOT_YET_EFFECTIVE, http: 409, condition: "mark-effective before effective_date per the logical clock" }
  - { id: ERR_CANCELLATION_NOT_YET_EFFECTIVE, http: 409, condition: "mark-cancelled before cancellation_effective_date per the logical clock" }
  - { id: ERR_TRUE_UP_WINDOW_EXPIRED, http: 409, condition: "Adjustment asserted after closing_executed_at + true_up_window_days" }
  - { id: ERR_TRUE_UP_WINDOW_OPEN, http: 409, condition: "Acquisition settle attempted before the true-up window elapsed" }
  # --- Fiscal ---
  - { id: ERR_STATEMENT_DRIFT, http: 409, condition: "Approve-time recomputation of a GENERATED line from live data differs from its stored amount_cents" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_CLAIMABLE, http: 422, condition: "COLLECTION_LOSS amount exceeds min(pre_closing_arrears_cents, collections_applied_cents)" }
  - { id: ERR_DEPOSIT_VARIANCE_UNRESOLVED, http: 409, condition: "resolve-dispute leaves variance_cents != 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# All roles are opaque: X-User-ID is an operator identifier never required to
# equal any entity id. Segregation of duties is enforced by comparing stored
# *_by_user_id fields against the caller's X-User-ID.
roles:
  - name: PlatformAdmin
    description: "Test-driving operations (logical clock)"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: AcquisitionsAnalyst
    description: "Diligence data intake and audit execution"
    identity: opaque
    exclusive_operations:
      - "POST /acquisitions; PATCH is NOT allowed for this role"
      - "POST /acquisitions/units, POST /acquisitions/units/{id}/exclude"
      - "POST /acquisitions/lease-files, audit, flag, resolve"
      - "POST /acquisitions/rent-roll-entries"
      - "POST /acquisitions/concessions, verify, reject"
      - "POST /acquisitions/utility-records"
      - "POST /acquisitions/{id}/tax-projections, compute"
      - "POST /acquisitions/deposits, reconcile, resolve-dispute"
      - "POST /acquisitions/insurance-policies"
      - "POST /acquisitions/adjustments, evidence"
    shared_operations: ["All GET endpoints"]
  - name: UnderwritingManager
    description: "Approvals, waivers, statements, closing execution; cannot approve what the same user proposed/reviewed (SoD)"
    identity: opaque
    exclusive_operations:
      - "PATCH /acquisitions/{id}"
      - "kickoff, complete-diligence, advance-to-pre-closing, execute-closing, terminate"
      - "lease-files waive"
      - "tax-projections approve, revise"
      - "proration-statements generate, lines, submit-review, send-back, approve"
      - "employee-decisions approve, reject"
      - "insurance-policies review-loss-runs, assume, exclude"
      - "findings dispute"
      - "adjustments accept, dispute, resolve, apply"
    shared_operations: ["All GET endpoints"]
  - name: PropertyOperationsLead
    description: "Unit walks and deficiency findings; QA caller must differ from the walk completer (SoD)"
    identity: opaque
    exclusive_operations:
      - "inspections create, complete, qa-accept, qa-reject, reschedule"
      - "findings create, verify, exclude"
    shared_operations: ["All GET endpoints"]
  - name: HRPartner
    description: "Staffing decisions proposer/notifier; cannot approve own proposals"
    identity: opaque
    exclusive_operations:
      - "employee-decisions create, notify, mark-effective, rescind"
    shared_operations: ["All GET endpoints"]
  - name: VendorManager
    description: "Service contract review, assumption, cancellation, renewal"
    identity: opaque
    exclusive_operations:
      - "service-contracts create, begin-review, assume, send-notice, mark-cancelled, renew"
    shared_operations: ["All GET endpoints"]
  - name: EscrowOfficer
    description: "Deposit escrow queueing and statement/acquisition settlement"
    identity: opaque
    exclusive_operations:
      - "deposits queue-escrow"
      - "proration-statements settle"
      - "acquisitions settle"
    shared_operations: ["All GET endpoints"]
