              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { err: $.data.error_id }
            - call: "GET /clerk/minutes/${min1}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { mv_now: $.data.version, st_before: $.data.status, pend_before: $.data.pending_correction_text }
            - call: "POST /clerk/minutes/${min1}/corrections"
              payload: { expected_minutes_version: "${mv_now}", corrected_text_body: "The finance report was received, filed and referred to committee." }
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { st_after: $.data.status, cc_after: $.data.correction_count }
          assert:
            - "the stale correction returns HTTP status 412 and ${err} == ERR_STALE_MINUTES_VERSION"
            - "${mv_now} >= ${mv_old} + 3 (narrative write, submit and the approval cascade each bumped it)"
            - "${st_before} == APPROVED, ${pend_before} == null and MinutesRecord.${min1}.correction_count == 0 at that observation"
            - "the re-read correction returns HTTP 200 with ${st_after} == CORRECTION_PENDING and ${cc_after} == 1"
            - "MinutesRecord.${min1}.revision_number is still 1 — the correction is only pending, not adopted"
            - "MinutesRecord.${min1}.version == ${mv_now} + 1"

      - name: every_accepted_write_advances_the_version_of_the_row_it_touched
        claim_type: optimistic_concurrency
        grounds: ["complexity_profile.complexity_layers.optimistic_concurrency", "entities.Venue", "entities.Meeting", "endpoints[PUT /clerk/venues/{venue_id}]"]
        distinguishing_aspect: "The version column is not decorative: two successive PUTs on one venue take it 1 -> 2 -> 3, a read in between changes nothing, and the meeting's own version advances on the packet filing and again on the posting — the two writes that the OCC rule in §1.2.1 is defined against."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id, v1: $.data.version }
          trigger:
            - call: "GET /clerk/venues/${venue}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { v_read: $.data.version }
            - call: "PUT /clerk/venues/${venue}"
              payload: { capacity: 140 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { v2: $.data.version }
            - call: "PUT /clerk/venues/${venue}"
              payload: { teardown_buffer_minutes: 45 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { v3: $.data.version }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mv1: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mv1}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mv2: $.data.version }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mv3: $.data.version }
          assert:
            - "${v1} == 1 and ${v_read} == 1 (the GET does not advance the version)"
            - "${v2} == 2 and ${v3} == 3"
            - "Venue.${venue}.capacity == 140 and teardown_buffer_minutes == 45"
            - "${mv1} == 1, ${mv2} == 2 and ${mv3} == 3"
            - "Meeting.${mtg}.status == NOTICED"

      - name: the_four_hop_officialization_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: minutes_approval_officializes_vote_mints_number_and_creates_notice
          rationale: "The deepest chain in the scaffold is the MINUTES_APPROVAL tally: minutes SUBMITTED -> APPROVED, result_official on every motion of the recorded meeting, ADOPTED_UNOFFICIAL -> ADOPTED with the minted number and series counters, then the DRAFT PublicationNotice with its computed count and deadline. That §1.8 instance walks all four hops in one request and pins every field they touch, including the ordering sensitivity (hop 3 cannot run before hop 2 stamps result_official). Restating it here would add no coverage."

      - name: both_fee_schedule_variants_are_exercised_and_their_delta_is_pinned
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: records_fee_actual_cost_versus_flat_schedule_diverge_on_identical_lines
          rationale: "records_request_fee has exactly two variants (ACTUAL_COST and FLAT_SCHEDULE) and that §1.8 instance assesses two requests with byte-identical fee_lines under each variant, asserting 1175 against 1375 cents and the 200-cent delta, plus the fact that the recorded variant cannot be reselected. The dual_variant_calculation row is therefore already fully pinned at greater depth than a breadth test would reach."

      - name: the_packets_derived_counters_are_recomputed_on_every_item_change_and_mirrored_at_posting
        claim_type: derived_field_reconciliation
        grounds: ["entities.AgendaPacket.fields.item_count", "entities.AgendaPacket.fields.contains_public_hearing", "calculations[meeting_notice_requirement]", "endpoints[POST /clerk/agenda-packets/{packet_id}/post]", "endpoints[POST /clerk/meetings/{meeting_id}/agenda-packets]"]
        distinguishing_aspect: "item_count and contains_public_hearing are re-derived after each item is added (0/false -> 1/false -> 2/true), the notice requirement materialises at posting as 72 + 168 = 240 hours mirrored onto the Meeting, and filing a fresh revision resets the derived set: the new packet reads item_count 0 while the meeting falls back to SCHEDULED with notice_compliant false."
        test_recipe:
          setup: ["A COUNCIL REGULAR meeting scheduled for 2026-09-15T18:00:00Z with one DRAFT packet; the clock is at its default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p1: $.data.id, ic0: $.data.item_count, ph0: $.data.contains_public_hearing }
          trigger:
            - call: "POST /clerk/agenda-packets/${p1}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: DeputyClerk
              as_user_id: "dc-01"
            - call: "GET /clerk/agenda-packets/${p1}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { ic1: $.data.item_count, ph1: $.data.contains_public_hearing }
            - call: "POST /clerk/agenda-packets/${p1}/agenda-items"
              payload: { sequence_number: 2, item_type: "PUBLIC_HEARING", title: "Hearing on the Elm Street rezoning" }
              as: DeputyClerk
              as_user_id: "dc-01"
            - call: "GET /clerk/agenda-packets/${p1}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { ic2: $.data.item_count, ph2: $.data.contains_public_hearing }
            - call: "POST /clerk/agenda-packets/${p1}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { rnh: $.data.required_notice_hours, ndl: $.data.notice_deadline_at, comp: $.data.notice_compliant }
            - call: "GET /clerk/meetings/${mtg}"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_rnh: $.data.required_notice_hours, m_comp: $.data.notice_compliant, mtgv2: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv2}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { p2: $.data.id, ic_new: $.data.item_count, ph_new: $.data.contains_public_hearing }
          assert:
            - "${ic0} == 0 and ${ph0} == false"
            - "${ic1} == 1 and ${ph1} == false"
            - "${ic2} == 2 and ${ph2} == true"
            - "${rnh} == 240 (BASE_NOTICE_HOURS[REGULAR] 72 + PUBLIC_HEARING_ADDITIONAL_HOURS 168, BODY_MULTIPLIER[COUNCIL] 1.0)"
            - "${ndl} == 2026-09-05T18:00:00Z and ${comp} == true (posted at the 2026-08-01T00:00:00Z clock)"
            - "${m_rnh} == 240 and ${m_comp} == true — the packet's derivation is mirrored onto the Meeting"
            - "${ic_new} == 0 and ${ph_new} == false"
            - "AgendaPacket.${p1}.status == SUPERSEDED with item_count still 2"
            - "Meeting.${mtg}.status == SCHEDULED and Meeting.${mtg}.notice_compliant == false after the new revision"

  # ===================================================================
  # SECTION 9 — consistency_model (§1.0 complexity_profile)
  # ===================================================================
  - section: consistency_model
    instances:

      - name: a_cancellation_reports_every_downstream_change_in_the_same_response_it_returns
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /clerk/meetings/{meeting_id}/cancel]", "state_machines[Meeting].NOTICED->CANCELLED"]
        distinguishing_aspect: "Nothing lags: the cancel response itself already carries notice_compliant false, and reads issued immediately afterwards — with no intervening write and no delay — show the packet WITHDRAWN, the agenda notice VOID and the new CANCELLATION notice present, so no denormalised field converges later."
        test_recipe:
          setup: ["A NOTICED meeting whose posted packet holds one item and whose MEETING_AGENDA notice is DRAFT."]
          setup_api_calls:
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/publication-notices"
              payload: { meeting_id: "${mtg}" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { agenda_notice: "$.data[0].id" }
          trigger:
            - call: "POST /clerk/meetings/${mtg}/cancel"
              payload: { cancelled_reason: "Loss of quorum expected" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { st: $.data.status, comp: $.data.notice_compliant }
            - call: "GET /clerk/agenda-packets/${pkt}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { pkt_st: $.data.status }
            - call: "GET /clerk/publication-notices/${agenda_notice}"
              payload: {}
              as: DeputyClerk
              as_user_id: "dc-01"
              captures: { notice_st: $.data.status }
            - call: "GET /clerk/publication-notices"
              payload: { meeting_id: "${mtg}", status: "DRAFT" }
              as: DeputyClerk
              as_user_id: "dc-01"
          assert:
            - "the cancel response itself carries ${st} == CANCELLED and ${comp} == false"
            - "${pkt_st} == WITHDRAWN on the very next read, with no retry or delay"
            - "${notice_st} == VOID on the very next read"
            - "the filtered notice list returns meta.total_count == 1 with notice_type == CANCELLATION and publication_deadline_on == 2026-09-15"
            - "GET /clerk/publication-notices?meeting_id=${mtg} returns meta.total_count == 2"
