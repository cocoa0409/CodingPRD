          assert:
            - "st1 == NEEDS_INFO (cycle branch entered)"
            - "st2 == UNDER_REVIEW (loop back to the same state — cyclic re-entry)"
            - "st3 == CORROBORATED"
            - "v_final == 5 (create stamped version 1; begin-review, request-info, resubmit, corroborate each bump by 1)"

      - name: alert_parallel_dimensions_ack_posture
        grounds:
          - state_machines.Alert.QUEUED_to_SENT
          - entities.Alert.fields.ack_posture
          - entities.Alert.fields.distribution_status
        distinguishing_aspect: |
          Alert carries two independent state dimensions on one row: the
          distribution_status pipeline (DRAFT -> QUEUED -> SENT) evolves via
          queue/send while the ack_posture dimension (UNTRACKED -> PARTIAL ->
          MAJORITY -> FULL) evolves via ack calls without touching
          distribution_status — with recipient_count 3, acks of 1, 2, 3 walk
          PARTIAL, MAJORITY (floor(3/2)+1 = 2), FULL respectively.
        test_recipe:
          setup:
            - "OPERATIONAL group with 1 REGISTERED block holding 3 ACTIVE SMS members (one the captain)."
