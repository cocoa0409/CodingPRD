scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: oe_parts_ratio_count_vs_cost_divergence
    grounds:
    - calculations.oe_parts_ratio
    - entities.RepairOrder.fields.oe_parts_ratio_by_count
    - entities.RepairOrder.fields.oe_parts_ratio_by_cost
    distinguishing_aspect: "Same four part lines on one RepairOrder produce DIFFERENT values for the\ncount variant (0.5000) and the cost variant (0.7843) \u2014 a dual-variant\ndivergence on the RepairOrder/parts\
      \ domain.\n"
    test_recipe:
      setup:
      - Shop S1 CERTIFIED-capable posture is irrelevant here; order in ESTIMATE so part lines are editable
      - Clock at default 2026-09-01T00:00:00Z
      - Technician T1 PROVISIONAL NON_STRUCTURAL in shop S1
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Ratio Body Works
          state_code: CA
          zip_code: '90001'
          latitude: 34.05
          longitude: -118.24
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/shops/${shop_id}/technicians
        payload:
          full_name: Pat Panel
          tech_role: NON_STRUCTURAL
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          tech_id: $.data.id
      - call: POST /network/shops/${shop_id}/repair-orders
        payload:
          expected_shop_version: ${shop_v}
          vin: 1HGCV1F34LA000001
          vehicle_model_year: 2015
          estimate_total_cents: 100000
          assigned_technician_id: ${tech_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          order_id: $.data.id
      - call: POST /network/repair-orders/${order_id}/part-lines
        payload:
          part_number: BMP-100
          part_class: OE
          unit_cost_cents: 50000
          quantity: 1
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/part-lines
        payload:
          part_number: FND-200
          part_class: OE_SURPLUS
          unit_cost_cents: 30000
          quantity: 1
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/part-lines
        payload:
          part_number: CLP-9
          part_class: AFTERMARKET
          unit_cost_cents: 500
          quantity: 4
          alternative_justification: consumer declined OE clips; consent ref C-11
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/part-lines
        payload:
          part_number: LMP-77
          part_class: RECYCLED
          unit_cost_cents: 20000
          quantity: 1
          alternative_justification: like-kind-quality lamp per insurer; consent ref C-12
        as: ShopManager
        as_user_id: ${shop_id}
      trigger:
      - call: GET /network/repair-orders/${order_id}
        as: ShopManager
        as_user_id: ${shop_id}
      assert:
      - RepairOrder.${order_id}.oe_parts_ratio_by_count == 0.5
      - RepairOrder.${order_id}.oe_parts_ratio_by_cost == 0.7843
      - RepairOrder.${order_id}.oe_parts_ratio_by_count != RepairOrder.${order_id}.oe_parts_ratio_by_cost
  - name: compliance_score_live_vs_audit_snapshot_divergence
    grounds:
    - calculations.shop_compliance_score
    - entities.Shop.fields.live_compliance_score
    - entities.CertificationCycle.fields.audit_snapshot_score
    distinguishing_aspect: "The audit-snapshot variant frozen at cycle close and the live variant\nrecomputed on later attestation lapse DIVERGE on identical underlying\nrequirement data \u2014 a dual-variant\
      \ divergence on the Shop/compliance\ndomain (different entity domain from the parts ratio instance).\n"
    test_recipe:
      setup:
      - Shop S2 with one PUBLISHED EQUIPMENT requirement R1 (effective_from in the past relative to an early clock) and an ACTIVE attestation pinned to R1
      - Cycle C1 closed PASS with zero findings so audit_snapshot_score is frozen at 100.0
      - Then R1 is retired, lapsing the attestation
      setup_api_calls:
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: NetworkAdmin
      - call: POST /network/shops
        payload:
          legal_name: Snapshot Collision
          state_code: OH
          zip_code: '43215'
          latitude: 39.96
          longitude: -82.99
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/requirements
        payload:
          requirement_code: EQ-SNAP-01
          category: EQUIPMENT
          description: Snap gauge set
          severity_if_failed: MINOR
          effective_from: '2026-08-01T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      - call: POST /network/requirements/${req_id}/publish
        payload: {}
        as: NetworkAdmin
      - call: POST /network/shops/${shop_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/snap1.jpg
          expected_shop_version: ${shop_v}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cycle_id: $.data.id
      - call: POST /network/certification-cycles/${cycle_id}/audits
        payload:
          scheduled_start: '2026-09-02T09:00:00Z'
          scheduled_end: '2026-09-02T17:00:00Z'
        as: NetworkAuditor
        captures:
          audit_id: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-02T10:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${audit_id}/begin
        payload: {}
        as: NetworkAuditor
      - call: POST /network/audits/${audit_id}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
      - call: POST /network/requirements/${req_id}/publish-revision
        payload:
          description: Snap gauge set v2
          severity_if_failed: MINOR
          effective_from: '2026-09-02T11:00:00Z'
        as: NetworkAdmin
      trigger:
      - call: GET /network/certification-cycles/${cycle_id}
        as: NetworkAuditor
        captures:
          snapshot_score: $.data.audit_snapshot_score
      - call: GET /network/shops/${shop_id}
        as: NetworkAuditor
      assert:
      - CertificationCycle.${cycle_id}.audit_snapshot_score == 100.0 (frozen at close)
      - 'Shop.${shop_id}.live_compliance_score == 85.0 (revision lapsed the only EQUIPMENT attestation: EQUIPMENT cat 0/1 -> 0, other categories vacuous 100; (30*0+15*100+30*100+25*100)/100 = 85.0)'
      - audit_snapshot_score != live_compliance_score proves the two variants diverge on identical requirement rows
- rule_id: combinatorial_formula
  instances:
  - name: referral_ranking_three_factor_nonlinear
    grounds:
    - calculations.referral_ranking
    - entities.Shop.fields.pending_referral_count
    - entities.Shop.fields.live_compliance_score
    distinguishing_aspect: "Mode (a): the selector score combines distance, compliance, and load with\na nested min() load cap \u2014 three inputs with non-linear interaction. With\nidentical distance the\
      \ compliance term decides; after the winner accrues\npending referrals the load term drags it down but cannot flip a 0.045 gap\nuntil 9 referrals accumulate \u2014 proving the min()-capped load term\
      \ is\ngenuinely non-linear (each pending is worth exactly 0.005 up to the cap).\n"
    test_recipe:
      setup:
      - Shops LOW and HIGH at IDENTICAL coordinates (distance term equal); LOW has one unsatisfied PUBLISHED EQUIPMENT requirement (live_compliance_score 85.0), HIGH is fully satisfied (100.0)
      - "Score: HIGH = 0.6k + 0.300 + 0.100, LOW = 0.6k + 0.255 + 0.100 where k = (1 - d/25) \u2014 identical for both; HIGH leads by exactly 0.045"
      - Both CERTIFIED via zero-finding audits, locator_visible
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Low Compliance Body
          state_code: CA
          zip_code: '90001'
          latitude: 34.05
          longitude: -118.24
          structural_capability: false
        as: NetworkAdmin
        captures:
          low_id: $.data.id
          low_v: $.data.version
      - call: POST /network/shops
        payload:
          legal_name: High Compliance Body
          state_code: CA
          zip_code: '90001'
          latitude: 34.05
          longitude: -118.24
          structural_capability: false
        as: NetworkAdmin
        captures:
          high_id: $.data.id
          high_v: $.data.version
      - call: POST /network/requirements
        payload:
          requirement_code: EQ-RANK-01
          category: EQUIPMENT
          description: Rivet gun
          severity_if_failed: MINOR
          effective_from: '2026-08-01T00:00:00Z'
        as: NetworkAdmin
        captures:
          req_id: $.data.id
      - call: POST /network/requirements/${req_id}/publish
        payload: {}
        as: NetworkAdmin
      - call: POST /network/shops/${high_id}/attestations
        payload:
          requirement_id: ${req_id}
          evidence_uri: s3://ev/high.jpg
          expected_shop_version: ${high_v}
        as: ShopManager
        as_user_id: ${high_id}
      - call: POST /network/shops/${low_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          low_cycle: $.data.id
      - call: POST /network/certification-cycles/${low_cycle}/audits
        payload:
          scheduled_start: '2026-09-01T01:00:00Z'
          scheduled_end: '2026-09-01T09:00:00Z'
        as: NetworkAuditor
        captures:
          low_audit: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${low_audit}/begin
        payload: {}
        as: NetworkAuditor
      - call: POST /network/audits/${low_audit}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
      - call: POST /network/shops/${high_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          high_cycle: $.data.id
      - call: POST /network/certification-cycles/${high_cycle}/audits
        payload:
          scheduled_start: '2026-09-01T10:00:00Z'
          scheduled_end: '2026-09-01T18:00:00Z'
        as: NetworkAuditor
        captures:
          high_audit: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T11:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${high_audit}/begin
        payload: {}
        as: NetworkAuditor
      - call: POST /network/audits/${high_audit}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
      trigger:
      - call: POST /network/referrals
        payload:
          consumer_zip: '90001'
          source_type: CONSUMER_DIRECT
          source_reference: WEB
          vin: 1HGCV1F34LA000002
        as: DealerRep
        captures:
          ref_id: $.data.id
          routed_shop: $.data.routed_shop_id
      assert:
      - Referral.${ref_id}.status == ROUTED
      - 'Referral.${ref_id}.routed_shop_id == ${high_id} (compliance term decides at equal distance: 100.0 vs 85.0)'
      - Shop.${high_id}.pending_referral_count == 1
      - Shop.${low_id}.pending_referral_count == 0
      - Shop.${low_id}.live_compliance_score == 85.0 and Shop.${high_id}.live_compliance_score == 100.0
  - name: warranty_accrual_pinned_evaluation_order
    grounds:
    - calculations.warranty_reserve_accrual
    - state_machines.RepairOrder.COMPLETE_to_WARRANTY_ACTIVE
    distinguishing_aspect: "Mode (c): the accrual pins evaluation order \u2014 tiered base rate, then ADAS\nmultiplier, then round_half_up to whole cents, then flat rework penalty \u2014\nand rounding before\
      \ the penalty yields 8500 cents where rounding after\nadding the penalty would diverge; the circular-looking base/multiplier/\npenalty composition is only well-defined because the order is pinned.\n"
    test_recipe:
      setup:
      - Shop S3 CERTIFIED with a CURRENT STRUCTURAL technician (no structural repair needed; NON_STRUCTURAL suffices)
      - ADAS-equipped repair order (vehicle_model_year 2020, adas_equipped omitted -> derived true), estimate_total_cents 200000
      - Order driven ESTIMATE -> APPROVED -> IN_REPAIR -> QC, then fail-qc twice (rework_count == 2), then pass-qc twice to COMPLETE
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Accrual Collision
          state_code: TX
          zip_code: '75001'
          latitude: 32.77
          longitude: -96.79
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v1: $.data.version
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
          cycle_id: $.data.id
      - call: POST /network/certification-cycles/${cycle_id}/audits
        payload:
          scheduled_start: '2026-09-01T01:00:00Z'
          scheduled_end: '2026-09-01T09:00:00Z'
        as: NetworkAuditor
        captures:
          audit_id: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T02:00:00Z'
        as: NetworkAdmin
      - call: POST /network/audits/${audit_id}/begin
        payload: {}
        as: NetworkAuditor
      - call: POST /network/audits/${audit_id}/issue-findings
        payload:
          findings: []
        as: NetworkAuditor
      - call: POST /network/shops/${shop_id}/technicians
        payload:
          full_name: Sam Fix
          tech_role: NON_STRUCTURAL
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          tech_id: $.data.id
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-03T00:00:00Z'
        as: NetworkAdmin
      - call: GET /network/shops/${shop_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          shop_v2: $.data.version
      - call: POST /network/shops/${shop_id}/repair-orders
        payload:
          expected_shop_version: ${shop_v2}
          vin: 2HGFC2F59LH500003
          vehicle_model_year: 2020
          estimate_total_cents: 200000
          assigned_technician_id: ${tech_id}
        as: ShopManager
        as_user_id: ${shop_id}
        captures:
          order_id: $.data.id
      - call: POST /network/repair-orders/${order_id}/procedure-steps
        payload:
          step_type: PRE_SCAN
          performed_by_technician_id: ${tech_id}
          performed_at: '2026-09-03T01:00:00Z'
          result: PASS
          scan_report_uri: s3://scans/pre1.json
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/approve
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/part-lines
        payload:
          part_number: RAD-1
          part_class: OE
          unit_cost_cents: 40000
          quantity: 1
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/start-repair
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/submit-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/fail-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/submit-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/fail-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/submit-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      - call: POST /network/repair-orders/${order_id}/procedure-steps
        payload:
          step_type: POST_SCAN
          performed_by_technician_id: ${tech_id}
          performed_at: '2026-09-03T06:00:00Z'
