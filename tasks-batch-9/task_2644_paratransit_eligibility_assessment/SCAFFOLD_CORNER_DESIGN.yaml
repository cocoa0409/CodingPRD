              as: IntakeClerk
              captures: { v1: $.data.id }
            - call: "POST /applications/${a1}/verifications/${v1}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["angina"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /applications"
              payload: { applicant_id: "${r2}", application_type: "NEW", functional_answers: { can_board_bus_steps: false, can_navigate_unfamiliar_route: false, max_walk_distance_meters: 240, uses_mobility_aid_outdoors: true, has_cognitive_impairment: false } }
              as: IntakeClerk
              captures: { a2: $.data.id }
            - call: "POST /applications/${a2}/submit"
              payload: {}
              as: IntakeClerk
            - call: "POST /applications/${a2}/verifications"
              payload: { provider_name: "Dr. E Haddad", provider_type: "PHYSICIAN", provider_license_number: "MD-90017" }
              as: IntakeClerk
              captures: { v2: $.data.id }
            - call: "POST /applications/${a2}/verifications/${v2}/receive"
              payload: { outcome: "ACCEPTED", attests_conditions: ["vertigo"], attests_permanent: true }
              as: IntakeClerk
            - call: "POST /assessment-slots"
              payload: { site_name: "West Annex", evaluator_user_id: "eval-1", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
              captures: { slot_small: $.data.id }
            - call: "POST /assessment-slots"
              payload: { site_name: "West Annex", evaluator_user_id: "eval-2", starts_at: "2026-08-06T09:00:00Z", ends_at: "2026-08-06T10:00:00Z", capacity: 1, site_is_wheelchair_accessible: true }
              as: AccessibilityOfficeAdmin
