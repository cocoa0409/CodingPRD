          - "§1.3 calculations.filing_penalty_points constants FILING_DUE_DAYS=5, FILING_GRACE_DAYS=10, LATE_DAY_POINTS=0.75, PER_ENTRY_LATE_RATE=0.065, STATION_POINT_CEILING=5.00"
