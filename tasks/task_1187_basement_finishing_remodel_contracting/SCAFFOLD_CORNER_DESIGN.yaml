            - { call: "POST /api/projects/${proj_id}/permits", payload: { bedroom_count: 0, windows: [], ceiling_height_in: 86, finished_area_sqft: 800, low_area_sqft: 100, prohibited_area_sqft: 0 }, as: Contractor, as_user_id: "${ctr_id}", captures: { pm_id: $.data.id } }
