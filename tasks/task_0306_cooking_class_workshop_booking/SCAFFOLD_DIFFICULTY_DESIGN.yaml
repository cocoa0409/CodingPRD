      - name: station_overlap_adjacency_zero_gap_open_endpoint
        grounds:
          - validations[priority=22]
          - errors[ERR_STATION_DOUBLE_BOOKED]
          - entities.ClassTemplate.fields.prep_minutes
          - entities.ClassTemplate.fields.cleanup_minutes
        distinguishing_aspect: |
          Empty-gap (adjacency) boundary on the station temporal-overlap check (endpoint
          POST /culinary/sessions/{id}/open), a different metric than the discount tier: session B's
          occupation starts exactly when session A's occupation ends (16:30 == 16:30). Half-open
          intervals mean adjacency is NOT overlap, so B opens successfully (no ERR_STATION_DOUBLE_BOOKED).
