    input: [production_id, jurisdiction_program_id, estimated_qualified_spend_cents]
    output: IncentiveApplication
    side_effects: ["status=DRAFT", "computed totals initialized to 0", "ERR_APPLICATION_ALREADY_OPEN when another application for the same (production_id, jurisdiction_program_id) has status NOT IN {DENIED, WITHDRAWN, REVOKED}", "ERR_NOT_OWNER unless caller owns the production's company"]
  - method: GET
    path: "/api/applications"
    description: "List applications (filtered)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["production_id?", "jurisdiction_program_id?", "status?", "limit?", "offset?"]
    output: "IncentiveApplication[]"
    side_effects: []
  - method: GET
    path: "/api/applications/{applicationId}"
    description: "Get an application"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: []
    output: IncentiveApplication
    side_effects: []
  - method: POST
    path: "/api/applications/{applicationId}/submit"
    description: "Submit a DRAFT application; window checks use the logical clock; deadline boundary inclusive"
    roles: [Producer]
    code: 200
    input: []
    output: IncentiveApplication
    side_effects: ["DRAFT -> SUBMITTED", "submitted_at = now"]
  - method: POST
    path: "/api/applications/{applicationId}/withdraw"
    description: "Withdraw a pre-approval application"
    roles: [Producer]
    code: 200
    input: []
    output: IncentiveApplication
    side_effects: ["-> WITHDRAWN from DRAFT|SUBMITTED|UNDER_REVIEW|CORRECTION_REQUESTED"]
  - method: POST
    path: "/api/applications/{applicationId}/claim-review"
    description: "Reviewer claims a SUBMITTED application"
    roles: [FilmOfficeReviewer]
    code: 200
    input: []
    output: IncentiveApplication
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "reviewer_user_id = X-User-ID"]
  - method: POST
    path: "/api/applications/{applicationId}/request-corrections"
    description: "Reviewer sends the application back for corrections"
    roles: [FilmOfficeReviewer]
    code: 200
    input: ["notes?"]
    output: IncentiveApplication
    side_effects: ["UNDER_REVIEW -> CORRECTION_REQUESTED"]
  - method: POST
    path: "/api/applications/{applicationId}/resubmit"
    description: "Producer resubmits after corrections (cycle back to UNDER_REVIEW)"
    roles: [Producer]
    code: 200
    input: []
    output: IncentiveApplication
    side_effects: ["CORRECTION_REQUESTED -> UNDER_REVIEW"]
  - method: POST
    path: "/api/applications/{applicationId}/approve"
    description: "Approve an UNDER_REVIEW application; approver must differ from the claiming reviewer"
    roles: [FilmOfficeReviewer]
    code: 200
    input: []
    output: IncentiveApplication
    side_effects: ["UNDER_REVIEW -> APPROVED", "decided_by_user_id = X-User-ID", "allocation_share_pct recomputed for the application and its siblings"]
  - method: POST
    path: "/api/applications/{applicationId}/deny"
    description: "Deny an UNDER_REVIEW application; denier must differ from the claiming reviewer"
    roles: [FilmOfficeReviewer]
    code: 200
    input: ["reason?"]
    output: IncentiveApplication
    side_effects: ["UNDER_REVIEW -> DENIED", "decided_by_user_id = X-User-ID"]
  - method: GET
    path: "/api/applications/{applicationId}/credit-estimate"
    description: "Computed read of the credit pipeline. variant=PROVISIONAL (default) uses system sums; variant=FINAL uses attested sums and requires an audit package in ATTESTED or ACCEPTED (else ERR_AUDIT_NOT_ACCEPTED)"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, atl_qualified_cents: integer, btl_qualified_cents: integer, capped_total_qualified_cents: integer, applied_rate: number, credit_cents: integer, meets_minimum: boolean }"
    side_effects: []
  - method: GET
    path: "/api/applications/{applicationId}/cashflow-projection"
    description: "Computed read of the cash-flow projection against the production schedule; variant=OPTIMISTIC (default) | CONSERVATIVE per cashflow_projection"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, basis_credit_cents: integer, expected_net_proceeds_cents: integer, milestones: array }"
    side_effects: []
  - method: POST
    path: "/api/applications/{applicationId}/issue-credit"
    description: "Issue the tax credit certificate after an accepted audit; debits the program annual cap"
    roles: [FilmOfficeAdmin]
    code: 201
    input: []
    output: CreditCertificate
    side_effects: ["Application APPROVED -> CREDIT_ISSUED", "creates CreditCertificate", "program.remaining_cap_cents -= final_credit_cents; program.allocated_credit_cents += final_credit_cents", "application already CREDIT_ISSUED -> ERR_CERTIFICATE_ALREADY_ISSUED"]

