              captures: { cm_id: $.data.id }
            - call: "POST /snack-mfg/co-man-agreements"
              payload: { co_manufacturer_id: "${cm_id}", weekly_capacity_lbs: 10000, rate_per_lb_cents: 50, budget_cents: 1000000 }
              as: PlantManager
              captures: { ag_id: $.data.id }
            - call: "POST /snack-mfg/co-man-agreements/${ag_id}/activate"
              as: PlantManager
            - call: "POST /snack-mfg/co-man-slots"
              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 6000 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
          trigger:
            - call: "POST /snack-mfg/co-man-slots"
              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 4000 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
              captures: { slot2_id: $.data.id }
            - call: "POST /snack-mfg/co-man-slots"
              payload: { agreement_id: "${ag_id}", product_id: "${p_id}", week_start_date: "2026-09-07", reserved_lbs: 1 }
              as: CoManufacturer
              as_user_id: "${cm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the 4000-lb booking succeeds (aggregate exactly 10000 == weekly_capacity_lbs, inclusive <=)"
            - "CoManSlot.${slot2_id}.status == BOOKED"
            - "the subsequent 1-lb booking fails 422 ERR_CAPACITY_EXCEEDED (10001 > 10000)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_start_consumes_validated_changeover
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_RUNNING
          - state_machines.Changeover.VALIDATED_to_APPLIED
          - errors[ERR_ALLERGEN_CHANGEOVER_REQUIRED]
        distinguishing_aspect: |
          Pair ProductionRun x Changeover: the run's SCHEDULED -> RUNNING
          transition is gated on a DIFFERENT entity's state — a VALIDATED,
          unconsumed, fresh (<48h) Changeover for the same line and product;
          starting without it fails, and a successful start atomically consumes
          the changeover (VALIDATED -> APPLIED).
        test_recipe:
          setup:
            - "run1 (DAIRY product) completed on the line -> current_allergen_profile == [DAIRY]"
