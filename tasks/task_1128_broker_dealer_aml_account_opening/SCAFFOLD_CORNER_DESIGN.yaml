            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-X04", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
          trigger:
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id", v1: "$.data.version" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer, captures: { v2: "$.data.version" } }
            - { call: "POST /aml/accounts/${acct_id}/transactions", payload: { txn_type: "WIRE_OUT", amount: 10.00 }, as: RegisteredRep, as_user_id: "${rep_id}" }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: RegisteredRep, as_user_id: "${rep_id}", captures: { v3: "$.data.version" } }
          assert:
            - "captured v1 == 1 and v2 == 2 and v3 == 3"

      - name: posture_reconciles_after_document_replacement
        claim_type: derived_field_reconciliation
        grounds: [state_machines.BrokerageAccount.aml_posture, state_machines.IdentificationDocument.EXPIRED_to_SUPERSEDED]
        distinguishing_aspect: "Posture rises to ELEVATED when the only GOVERNMENT_ID expires and falls back to STANDARD once a replacement is verified (EXPIRED doc SUPERSEDED) — derived field reconciled in BOTH directions."
        test_recipe:
          setup: ["OPEN LOW account; GOVERNMENT_ID expires 2026-05-03; clock 2026-05-04 + sweep."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep X5", crd_number: "CRD-X05" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "X5", tax_id: "TIN-X05", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-X05a", expiry_date: "2026-05-03" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d1: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${d1}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { p1: "$.data.aml_posture" } }
          trigger:
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-X05b", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d2: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${d2}/verify", payload: {}, as: AMLAnalyst }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: ComplianceOfficer, captures: { p2: "$.data.aml_posture" } }
            - { call: "GET /aml/identification-documents/${d1}", payload: {}, as: ComplianceOfficer, captures: { d1st: "$.data.status" } }
          assert:
            - "captured p1 == ELEVATED (expired doc present)"
            - "captured d1st == SUPERSEDED"
            - "captured p2 == STANDARD (elevation trigger removed)"

      - name: sweep_output_counts_literal
        claim_type: ops_run_checkpoint
        grounds: [endpoints]
        distinguishing_aspect: "Crafted state (one VERIFIED doc expiring 2026-05-02, one CRITICAL finding created 2026-05-01 with deadline 2026-05-31) swept at 2026-06-01 yields exactly {documents_expired: 1, edd_reviews_flagged: 0, sar_reviews_due: 0, requests_314a_overdue: 0, holds_released: 0, findings_aged: 1}."
        test_recipe:
          setup: ["Customer with VERIFIED doc expiring 2026-05-02; engagement FIELDWORK with CRITICAL finding; clock 2026-06-01."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep X6", crd_number: "CRD-X06" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "X6", tax_id: "TIN-X06", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-X06", expiry_date: "2026-05-02" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { d1: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${d1}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/audit-engagements", payload: { scope_unit: "AML_PROGRAM", start_date: "2026-04-01", end_date: "2026-06-30" }, as: IndependentAuditor, captures: { eng_id: "$.data.id" } }
            - { call: "POST /aml/audit-engagements/${eng_id}/begin-fieldwork", payload: {}, as: IndependentAuditor }
            - { call: "POST /aml/audit-engagements/${eng_id}/findings", payload: { severity: "CRITICAL", description: "no SAR governance" }, as: IndependentAuditor, captures: { finding_id: "$.data.id" } }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin, captures: { de: "$.data.documents_expired", edd: "$.data.edd_reviews_flagged", sar: "$.data.sar_reviews_due", r314: "$.data.requests_314a_overdue", holds: "$.data.holds_released", aged: "$.data.findings_aged" } }
            - { call: "GET /aml/audit-findings/${finding_id}", payload: {}, as: IndependentAuditor, captures: { sev: "$.data.severity", od: "$.data.is_overdue" } }
          assert:
            - "captured de == 1, edd == 0, sar == 0, r314 == 0, holds == 0, aged == 1"
            - "captured od == true and sev == CRITICAL (escalation capped at CRITICAL)"

      - name: clock_default_startup_value
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z: a 314(a) request created at startup stamps received_at 2026-05-01 and response_deadline 2026-05-15."
        test_recipe:
          setup: ["Empty DB; clock never set."]
          setup_api_calls:
            - { call: "POST /aml/fincen-314a-requests", payload: { request_reference: "FIN-X7", subjects: [{ name: "Nobody", subject_type: "INDIVIDUAL" }] }, as: ComplianceOfficer, captures: { req_id: "$.data.id", dl: "$.data.response_deadline" } }
          trigger:
            - { call: "GET /aml/fincen-314a-requests/${req_id}", payload: {}, as: ComplianceOfficer, captures: { recv: "$.data.received_at" } }
          assert:
            - "captured recv starts with 2026-05-01 (startup default, not wall clock)"
            - "captured dl == 2026-05-15"

      - name: elevated_posture_autoflags_new_transactions
        claim_type: conditional_feature_flags
        grounds: [state_machines.SecurityTransaction.POSTED_to_FLAGGED, state_machines.BrokerageAccount.aml_posture]
        distinguishing_aspect: "While aml_posture == ELEVATED (expired doc), a newly posted transaction lands FLAGGED (not POSTED); on a STANDARD account the same payload lands POSTED."
        test_recipe:
          setup: ["Account A ELEVATED (doc expired + swept); account B STANDARD; both OPEN LOW."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep X8", crd_number: "CRD-X08" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "X8A", tax_id: "TIN-X08a", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_a: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_a}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-X08a", expiry_date: "2026-05-03" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_a: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_a}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_a}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_a: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_a}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "X8B", tax_id: "TIN-X08b", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_b: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_b}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-X08b", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_b: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_b}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_b}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_b: "$.data.id" } }
            - { call: "POST /aml/accounts/${acct_b}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/maintenance/run-daily-sweep", payload: {}, as: SystemAdmin }
          trigger:
            - { call: "POST /aml/accounts/${acct_a}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 10, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { sta: "$.data.status" } }
            - { call: "POST /aml/accounts/${acct_b}/transactions", payload: { txn_type: "BUY", security_id: "ACME", quantity: 10, unit_price: 40.00 }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { stb: "$.data.status" } }
          assert:
            - "captured sta == FLAGGED (ELEVATED posture auto-flag)"
            - "captured stb == POSTED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_approve
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "The approve response itself carries lifecycle_status OPEN and version 2; a follow-up GET reflects the same state with no delay or reconciliation step."
        test_recipe:
          setup: ["Rep + customer + VERIFIED doc + PENDING_APPROVAL account."]
          setup_api_calls:
            - { call: "POST /aml/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /aml/reps", payload: { full_name: "Rep Y1", crd_number: "CRD-Y01" }, as: SystemAdmin, captures: { rep_id: "$.data.id" } }
            - { call: "POST /aml/customers", payload: { customer_type: "INDIVIDUAL", full_name: "Y1", tax_id: "TIN-Y01", country_risk_tier: "LOW" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { cust_id: "$.data.id" } }
            - { call: "POST /aml/customers/${cust_id}/identification-documents", payload: { doc_type: "GOVERNMENT_ID", document_number: "P-Y01", expiry_date: "2030-01-01" }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { doc_id: "$.data.id" } }
            - { call: "POST /aml/identification-documents/${doc_id}/verify", payload: {}, as: AMLAnalyst }
            - { call: "POST /aml/accounts", payload: { customer_id: "${cust_id}", product_set: ["CASH"] }, as: RegisteredRep, as_user_id: "${rep_id}", captures: { acct_id: "$.data.id" } }
          trigger:
            - { call: "POST /aml/accounts/${acct_id}/approve", payload: {}, as: ComplianceOfficer, captures: { lc: "$.data.lifecycle_status", v: "$.data.version" } }
            - { call: "GET /aml/accounts/${acct_id}", payload: {}, as: SAROfficer, captures: { lc2: "$.data.lifecycle_status" } }
          assert:
            - "captured lc == OPEN and v == 2 (mutation visible in the same response)"
            - "captured lc2 == OPEN (immediately consistent on read)"
