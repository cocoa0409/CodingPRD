  # ===========================================================================
  # §1.9 breadth walk — endpoints
  # Every endpoint SHAPE in §1.5: collection read with ordering and paging,
  # multi-axis filtered reverse lookup, nested child creation, action endpoints
  # that return the mutated resource, computed reads, and the parameter guards.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: film_collection_read_orders_created_at_desc_and_pages_without_overlap
        claim_type: standard_crud
        grounds:
          - "endpoints[GET /film-sales/films]"
          - envelope.pagination_defaults
        distinguishing_aspect: |
          The declared order is created_at DESC, which is the reverse of insertion order, and the logical
          clock makes it observable: three films registered on three different days must come back
          newest-first, and a limit 2 page followed by offset 2 must partition them with no repeat and no
          gap.
        test_recipe:
          setup:
            - "Three films registered on 2026-08-01, 2026-08-02 and 2026-08-03 respectively."
          setup_api_calls:
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Northern Lights", genre: "ACTION", production_budget_usd: 24000000.00, principal_cast_score: 80, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_a: $.data.id }
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Cold Harbour", genre: "DRAMA", production_budget_usd: 24000000.00, principal_cast_score: 80, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_b: $.data.id }
            - call: "POST /film-sales/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /film-sales/films"
              payload: { title: "Paper Kings", genre: "COMEDY", production_budget_usd: 24000000.00, principal_cast_score: 80, estimated_delivery_date: "2027-02-28T00:00:00Z", theatrical_release_date: "2027-04-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { film_c: $.data.id }
          trigger:
            - call: "GET /film-sales/films"
              payload: { limit: 2, offset: 0 }
              as: SalesAgent
              captures: { p1_first: "$.data[0].title", p1_second: "$.data[1].title" }
            - call: "GET /film-sales/films"
              payload: { limit: 2, offset: 2 }
              as: SalesAgent
              captures: { p2_first: "$.data[0].title" }
          assert:
            - "${p1_first} == Paper Kings and ${p1_second} == Cold Harbour — newest first, not insertion order"
            - "page one reports total_count 3 and has_more true"
            - "${p2_first} == Northern Lights"
            - "page two reports total_count 3 and has_more false and carries exactly 1 row"
            - "no id appears on both pages"

      - name: valuation_reverse_lookup_filters_compose_conjunctively
