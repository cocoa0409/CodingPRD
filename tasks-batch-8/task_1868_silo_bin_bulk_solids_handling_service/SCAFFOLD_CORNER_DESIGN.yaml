  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_limit_and_has_more
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "GET /service-tickets?limit=1 with two tickets returns exactly one item, total_count == 2, has_more == true; offset=1 returns the second item with has_more == false."
