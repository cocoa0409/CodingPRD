  - method: GET
    path: "/mlc/audits/{id}"
    description: "Get one audit"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []

  - method: GET
    path: "/mlc/audits"
    description: "Filtered list of audit engagements (FK reverse reachability by auditor_member_id)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
