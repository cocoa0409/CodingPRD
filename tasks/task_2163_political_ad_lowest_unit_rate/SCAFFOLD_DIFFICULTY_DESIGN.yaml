scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: luc_provisional_vs_final_diverge_on_same_rate_class
        grounds:
          - calculations.lowest_unit_charge
          - entities.LucDetermination.fields.luc_cents
          - entities.LucDetermination.fields.qualifying_spot_count
          - state_machines.LucDetermination.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          This dual-variant instance lives in the airtime-pricing domain on LucDetermination: the
          identical spot population yields luc_cents 95000 under PROVISIONAL (which counts merely
          SCHEDULED spots on ACCEPTED orders) and luc_cents 100000 under FINAL (which counts only
          spots that actually AIRED), so the two variants disagree by 5000 cents on the same data.
        test_recipe:
          setup:
            - "One station with an open PRIMARY election whose lowest-unit-charge window is 2026-08-01 through 2026-09-15."
            - "One EARLY_NEWS rate class with posted_rate_cents 100000."
            - "Issue advertiser Empire Growth Fund holds an ACCEPTED, PAID order of five 30-second spots on 2026-08-21 that have never aired; each spot is charged 95000 because five spots select the 5 percent volume tier."
            - "Issue advertiser Coastal Water Alliance holds a COMPLETED order whose single 30-second spot on 2026-08-10 aired at charge 100000 with no volume discount."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WKPX-TV", licensee_name: "Palmetto Broadcasting LLC", market_code: "DMA-518", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300, eo_parity_basis: "SPOT_COUNT" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/elections"
              payload: { station_id: "${st}", office_sought: "US Senate", election_type: "PRIMARY", election_date: "2026-09-15" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { el: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE", election_id: "${el}" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv_a: $.data.id }
            - call: "POST /political-ads/advertisers/${adv_a}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv_a}/decision"
              payload: { decision: "CLASSIFY_ISSUE", reason: "Non-candidate issue advocacy" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Coastal Water Alliance", requested_class: "ISSUE", election_id: "${el}" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv_b: $.data.id }
            - call: "POST /political-ads/advertisers/${adv_b}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv_b}/decision"
              payload: { decision: "CLASSIFY_ISSUE", reason: "Non-candidate issue advocacy" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv_a}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
              captures: { ord_a: $.data.id }
            - call: "POST /political-ads/orders/${ord_a}/spots"
              payload: { air_date: "2026-08-21", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-A1" }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders/${ord_a}/spots"
              payload: { air_date: "2026-08-21", start_offset_seconds: 3600, duration_seconds: 30, program_code: "EN-A2" }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders/${ord_a}/spots"
              payload: { air_date: "2026-08-21", start_offset_seconds: 7200, duration_seconds: 30, program_code: "EN-A3" }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders/${ord_a}/spots"
              payload: { air_date: "2026-08-21", start_offset_seconds: 10800, duration_seconds: 30, program_code: "EN-A4" }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders/${ord_a}/spots"
              payload: { air_date: "2026-08-21", start_offset_seconds: 14400, duration_seconds: 30, program_code: "EN-A5" }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders/${ord_a}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders/${ord_a}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
            - call: "GET /political-ads/orders/${ord_a}"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
              captures: { ord_a_v: $.data.version }
            - call: "POST /political-ads/orders/${ord_a}/payments"
              payload: { direction: "CHARGE", amount_cents: 475000, expected_order_version: "${ord_a_v}" }
              as: AdvertiserAgent
              as_user_id: "${adv_a}"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv_b}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Coastal Water Alliance", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv_b}"
              captures: { ord_b: $.data.id }
            - call: "POST /political-ads/orders/${ord_b}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-B1" }
              as: AdvertiserAgent
              as_user_id: "${adv_b}"
              captures: { sp_b: $.data.id }
            - call: "POST /political-ads/orders/${ord_b}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_b}"
            - call: "POST /political-ads/orders/${ord_b}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
            - call: "GET /political-ads/orders/${ord_b}"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_b}"
              captures: { ord_b_v: $.data.version }
            - call: "POST /political-ads/orders/${ord_b}/payments"
              payload: { direction: "CHARGE", amount_cents: 100000, expected_order_version: "${ord_b_v}" }
              as: AdvertiserAgent
              as_user_id: "${adv_b}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/spots/${sp_b}/disposition"
              payload: { disposition: "AIRED" }
              as: TrafficScheduler
              as_user_id: "traffic-01"
          trigger:
            - call: "GET /political-ads/elections/${el}"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { el_v1: $.data.version }
            - call: "POST /political-ads/elections/${el}/luc-determinations"
              payload: { rate_class_id: "${rc}", variant: "PROVISIONAL", expected_election_version: "${el_v1}" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { prov_id: $.data.id, prov_luc: $.data.luc_cents, prov_count: $.data.qualifying_spot_count }
            - call: "GET /political-ads/elections/${el}"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { el_v2: $.data.version }
            - call: "POST /political-ads/elections/${el}/luc-determinations"
              payload: { rate_class_id: "${rc}", variant: "FINAL", expected_election_version: "${el_v2}" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { final_id: $.data.id, final_luc: $.data.luc_cents, final_count: $.data.qualifying_spot_count }
          assert:
            - "LucDetermination.${prov_id}.luc_cents == 95000"
            - "LucDetermination.${prov_id}.qualifying_spot_count == 6"
            - "LucDetermination.${prov_id}.basis == LOWEST_QUALIFYING_SPOT"
            - "LucDetermination.${final_id}.luc_cents == 100000"
            - "LucDetermination.${final_id}.qualifying_spot_count == 1"
            - "LucDetermination.${final_id}.repriced_spot_count == 0"
            - "LucDetermination.${final_id}.luc_cents != LucDetermination.${prov_id}.luc_cents"
            - "CommercialOrder.${ord_a}.gross_charge_cents == 475000"

      - name: eo_owed_units_dollar_value_diverges_from_spot_count
        grounds:
          - calculations.equal_opportunity_owed_units
          - entities.EqualOpportunityRequest.fields.owed_units
          - entities.EqualOpportunityRequest.fields.parity_basis_applied
          - state_machines.EqualOpportunityRequest.RECEIVED_to_GRANTED
        distinguishing_aspect: |
          This dual-variant instance lives in the equal-opportunity airtime domain on
          EqualOpportunityRequest, not in the pricing domain: the opponent's identical five spots
          (four 30-second plus one 60-second, all volume-discounted) owe 6 units under SPOT_COUNT
          but exactly 5 units under DOLLAR_VALUE, because DOLLAR_VALUE divides 570000 cents of
          actual charge by the undiscounted 100000-cent card unit rate and floors the quotient.
        test_recipe:
          setup:
            - "One station configured with eo_parity_basis DOLLAR_VALUE."
            - "Two legally qualified candidates in the same PRIMARY election, Okafor For Governor and Whitlock For Governor."
            - "Okafor's order is ACCEPTED and RUNNING with four 30-second spots charged 95000 each and one 60-second spot charged 190000, total 570000 cents; its first spot aired at 2026-08-10T12:00:00Z."
            - "Whitlock holds an ACCEPTED order on the same election and rate class with one 30-second spot on 2026-08-25."
            - "Whitlock filed an equal-opportunity request at 2026-08-12T09:00:00Z, inside the 7-day request window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
