  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # instance 1 = metric: day bed-minute budget (priority 15, inclusive)
  #              endpoint POST /induction-bookings/{bookingId}/hold-capacity
  # instance 2 = metric: measured_d2i_minutes floor + DRILL_PASS_MINUTES 30
  #              endpoint POST /cesarean-readiness-drills/{drillId}/validate
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: day_bed_minute_budget_rejects_1290_against_1289_and_admits_1290_against_1290
        grounds:
          - validations[priority 15]
          - errors[ERR_INDUCTION_CAPACITY_EXCEEDED]
          - calculations.induction_capacity_projection
          - calculations.induction_bed_minute_conservation
          - endpoints[POST /induction-bookings/{bookingId}/hold-capacity]
          - endpoints[PATCH /obstetric-units/{unitId}]
        distinguishing_aspect: |
          The priority-15 day test is declared inclusive — "landing exactly on the
          budget PASSES" — and this instance pins it to a ONE-MINUTE window on the
          same booking, the same bed and the same day, moving only the budget:
          with max_daily_induction_bed_minutes 1289 the hold that would take the
          day to 645 + 645 = 1290 is refused with
          409 ERR_INDUCTION_CAPACITY_EXCEEDED, and with the budget at 1290 the
          identical hold is admitted and leaves remaining_bed_minutes at exactly 0.
          Two independent off-by-one traps are armed at once. The first is the
          comparison operator: an implementation using `day_load + projected >=
          budget` rejects the 1290-against-1290 hold. The second is the projection
          itself: the quantity compared is NOT expected_labor_minutes (600) but
          expected_labor_minutes + the unit's CURRENT turnover_buffer_minutes
          (45), so an implementation that forgets the buffer computes 1200 and
          admits the hold even at 1289, and one that uses the DIVERT buffer of 75
          computes 1350 and refuses it even at 1290. Because the failing and the
          passing attempt are the SAME call separated only by a PATCH of the
          budget, no other rule in the ladder can account for the difference in
          outcome.
        test_recipe:
          setup: |
            A quiet unit — no encounters at all, so coverage_deficit_units is 0.0,
            staffing_posture is OPEN and turnover_buffer_minutes is 45 for every
            freeze in the fixture — with three LDR beds so two simultaneous holds
            still leave one AVAILABLE. Two MEDICALLY_INDICATED (PREECLAMPSIA)
            bookings both want 2026-08-20T06:00:00Z with expected_labor_minutes
            600, so each freezes at 645. The first is held on LDR-01 under a
            generous 2000-minute budget, putting held_bed_minutes_by_day
            [2026-08-20] at 645. The trigger then walks the budget across the
            boundary with PATCH /obstetric-units/{unitId}, re-reading unit.version
            each time because the PATCH bumps it and the hold carries an OCC guard
            at priority 6.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-19T07:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Pemberley Heights Perinatal", licensed_ldr_beds: 4, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2000 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-03", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_3: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-EDGE-A17", gestational_age_weeks: 38, indication_code: "PREECLAMPSIA", requested_start_utc: "2026-08-20T06:00:00Z", expected_labor_minutes: 600 }
              as: PatientAccessCoordinator
              captures: { bk_a: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-EDGE-B24", gestational_age_weeks: 39, indication_code: "PREECLAMPSIA", requested_start_utc: "2026-08-20T06:00:00Z", expected_labor_minutes: 600 }
              as: PatientAccessCoordinator
              captures: { bk_b: $.data.id }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PatientAccessCoordinator
              captures: { u_v1: $.data.version, buffer_now: $.data.turnover_buffer_minutes }
            - call: POST /induction-bookings/${bk_a}/hold-capacity
              payload: { bed_id: "${bed_ldr_1}", expected_unit_version: "${u_v1}" }
              as: PatientAccessCoordinator
              captures: { projected_a: $.data.projected_occupancy_minutes }
          trigger:
            - call: PATCH /obstetric-units/${unit_id}
              payload: { max_daily_induction_bed_minutes: 1289 }
              as: PerinatalSafetyOfficer
              captures: { u_v2: $.data.version, budget_under: $.data.max_daily_induction_bed_minutes }
            - call: POST /induction-bookings/${bk_b}/hold-capacity
              payload: { bed_id: "${bed_ldr_2}", expected_unit_version: "${u_v2}" }
              as: PatientAccessCoordinator
            - call: PATCH /obstetric-units/${unit_id}
              payload: { max_daily_induction_bed_minutes: 1290 }
              as: PerinatalSafetyOfficer
              captures: { u_v3: $.data.version, budget_exact: $.data.max_daily_induction_bed_minutes }
            - call: POST /induction-bookings/${bk_b}/hold-capacity
              payload: { bed_id: "${bed_ldr_2}", expected_unit_version: "${u_v3}" }
              as: PatientAccessCoordinator
              captures: { projected_b: $.data.projected_occupancy_minutes }
          assert:
            - "trigger[1].response.status == 409"
            - "trigger[1].response.error.code == ERR_INDUCTION_CAPACITY_EXCEEDED"
            - "trigger[3].response.status == 200"
            - "InductionBooking.${bk_a}.status == CAPACITY_HELD"
            - "InductionBooking.${bk_a}.projected_occupancy_minutes == 645"
            - "InductionBooking.${bk_b}.status == CAPACITY_HELD"
            - "InductionBooking.${bk_b}.projected_occupancy_minutes == 645"
            - "InductionBooking.${bk_b}.bed_id == ${bed_ldr_2}"
            - "InductionBooking.${bk_b}.hold_expires_at == 2026-08-19T09:00:00Z"
            - "ObstetricUnit.${unit_id}.max_daily_induction_bed_minutes == 1290"
            - "ObstetricUnit.${unit_id}.held_bed_minutes_by_day[2026-08-20] == 1290"
            - "ObstetricUnit.${unit_id}.committed_bed_minutes_by_day[2026-08-20] == 0"
            - "ObstetricUnit.${unit_id}.turnover_buffer_minutes == 45"
            - "ObstetricUnit.${unit_id}.staffing_posture == OPEN"
            - "Bed.${bed_ldr_1}.status == HELD"
            - "Bed.${bed_ldr_2}.status == HELD"
            - "Bed.${bed_ldr_2}.held_booking_id == ${bk_b}"
            - "Bed.${bed_ldr_3}.status == AVAILABLE"

      - name: drill_pass_threshold_admits_thirty_minutes_fifty_nine_seconds_and_refuses_thirty_one_minutes_flat
        grounds:
          - calculations.decision_to_incision_measurement
          - validations[priority 11.4]
          - errors[ERR_DRILL_PERFORMANCE_FAILED]
          - endpoints[POST /cesarean-readiness-drills/{drillId}/validate]
          - state_machines.CesareanReadinessDrill.DOCUMENTED_to_VALIDATED
          - calculations.cesarean_readiness_derivation
        distinguishing_aspect: |
          Two drills documented ONE SECOND apart land on opposite sides of the pass
          threshold, and the metric that separates them is a floor, not a round:
          30 minutes 59 seconds (1859 seconds) floors to measured_d2i_minutes 30,
          which PASSES because DRILL_PASS_MINUTES is inclusive, while 31 minutes
          0 seconds (1860 seconds) floors to 31 and is refused with
          422 ERR_DRILL_PERFORMANCE_FAILED. Three distinct precision mistakes are
          caught by the pair. Rounding to nearest instead of flooring turns 30:59
          into 31 and rejects the drill that must pass. A strict `< 30` comparison
          rejects the exact-30 drill. Comparing raw seconds against 30 * 60
          rejects 1859 as well. The pair also proves the measurement is stored
          rather than recomputed at validation time: the successful validate stamps
          expires_at at validated_at + 90 days (2026-11-16T08:00:00Z from a
          2026-08-18T08:00:00Z validation) and back-dates every participant's
          last_validated_drill_at to the drill's simulated decision_at
          (2026-08-18T06:00:00Z), NOT to the clock. Finally, the unit that now
          owns a passing current drill still reports DEGRADED rather than READY,
          because the rolling emergency-cesarean window is empty and no OR_STANDBY
          shift exists — the boundary win does not buy full readiness.
        test_recipe:
          setup: |
            One unit with two LDR beds (an LDR census of zero AVAILABLE beds would
            force DIVERT and block drill /start, so the beds exist purely to keep
            the posture OPEN) and four staff: the OB attending and the
            anesthesiologist who form the mandatory participant pair on BOTH
            drills, a charge nurse to start them, and a separate safety officer to
            validate them so the segregation-of-duties rule at priority 10 is
            satisfied (the validator is never the documenter). Two
            DECISION_TO_INCISION drills are scheduled for 06:00:00Z, started at
            06:00:00Z, and then documented at 08:00:00Z with simulated timings that
            differ by exactly one second: 06:00:00 -> 06:30:59 on the first and
            06:00:00 -> 06:31:00 on the second.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-18T06:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Kirkwall Coastal Maternity", licensed_ldr_beds: 2, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
