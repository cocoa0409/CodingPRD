            - "The clock moves to 2026-10-01T00:00:00Z and a posting run makes item A EFFECTIVE."
            - "A DRAFT invoice dated 2026-10-05T00:00:00Z carries two lines at exactly the posted prices: line ZERO with cases_quantity 0, bottles_quantity 5, a 2750-cent promotional allowance and a 1-cent depletion allowance; line TWO with cases_quantity 2, bottles_quantity 0, no promotional allowance and a 300-cent depletion allowance."
