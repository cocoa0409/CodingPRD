# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1948: Vaccine Inventory & VFC Program Management
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1: dual_variant_calc — 2 instances on different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: accountability_snapshot_provisional_vs_final_transfer_window
        grounds:
          - calculations.accountability_balance_reconciliation
          - entities.SiteVisitAudit.fields.accountability_gap
          - entities.ProviderSite.fields.accountability_balance_doses
        distinguishing_aspect: |
          Different entity domain than private_lending_balance: this one is on
          SiteVisitAudit/ProviderSite (compliance ledger), and the provisional
          variant counts INITIATED transfers while the final_snapshot variant
          counts only IN_TRANSIT/RECEIVED transfers — so a transfer sitting in
          INITIATED state changes the provisional balance but not the final
          audit snapshot.
        test_recipe:
          setup:
            - "Site S with manager unit U"
            - "VaccineProduct P (vfc_program_eligible=true)"
            - "Patient pat, screening scr VFC-eligible dated 2026-08-05"
            - "Lot L_pub PUBLIC_VFC 10 doses in U; Lot L_pub2 PUBLIC_VFC 4 doses in U"
            - "Dose administered from L_pub on 2026-08-05 (PUBLIC_VFC)"
            - "ShortDateTransfer T for 3 doses from L_pub to site S2, status INITIATED (not yet shipped)"
            - "SiteVisitAudit A moved to IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-001" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites"
              payload: { site_name: "Site S2", vfc_pin: "PIN-S-002" }
              as: ComplianceAuditor
              captures: { site_s2: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /provider-sites/${site_s2}/storage-units"
              payload: { unit_label: "U2", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u2: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 14 }
              as: VaccineManager
              captures: { ord: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 14 }
              as: VaccineManager
              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 14, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-A", expires_on: "2027-06-30", quantity_doses: 10 }
              as: VaccineManager
              captures: { lot_a: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-B", expires_on: "2027-06-30", quantity_doses: 4 }
              as: VaccineManager
              captures: { lot_b: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/patients"
              payload: { full_name: "Pat Child", date_of_birth: "2020-01-15", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
              captures: { scr: $.data.id }
            - call: "POST /provider-sites/${site_s}/dose-administrations"
              payload: { patient_id: "${pat}", eligibility_screening_id: "${scr}", lot_id: "${lot_a}", administration_date: "2026-08-05" }
              as: VaccineManager
            - call: "POST /provider-sites/${site_s}/short-date-transfers"
              payload: { from_lot_id: "${lot_a}", destination_site_id: "${site_s2}", destination_storage_unit_id: "${unit_u2}", quantity_doses: 3, reason: "short-dated" }
              as: VaccineManager
              captures: { xfer: $.data.id }
            - call: "POST /provider-sites/${site_s}/site-visit-audits"
              payload: { visit_date: "2026-08-10" }
              as: ComplianceAuditor
              captures: { aud: $.data.id }
            - call: "POST /provider-sites/${site_s}/site-visit-audits/${aud}/begin"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: ComplianceAuditor
              captures: { prov_balance: $.data.accountability_balance_doses }
            - call: "POST /provider-sites/${site_s}/site-visit-audits/${aud}/issue-findings"
              payload: {}
              as: ComplianceAuditor
              captures: { final_gap: $.data.accountability_gap, final_received: $.data.public_doses_received, final_admin: $.data.public_doses_administered, final_out: $.data.public_doses_transferred_out }
          assert:
            - "provisional ProviderSite.accountability_balance_doses includes INITIATED transfer as already-deducted: received 14 - admin 1 - xfer 3 = 10"
            - "${prov_balance} == 10"
            - "final snapshot public_doses_transferred_out counts only IN_TRANSIT/RECEIVED -> 0"
            - "${final_out} == 0"
            - "final_snapshot accountability_gap = 14 - 1 - 0 - 0 = 13"
            - "${final_gap} == 13"
            - "${final_received} == 14"
            - "${final_admin} == 1"
            - "provisional and final diverge by exactly the INITIATED transfer quantity (3 doses)"

      - name: private_lending_balance_net_vs_gross_directional
        grounds:
          - calculations.private_lending_balance
          - entities.ProviderSite.fields.private_lending_balance
        distinguishing_aspect: |
          Different entity domain than accountability: this one is on the
          BorrowTicket entity (private-lending ledger), and the base variant
          sums only PUBLIC_FROM_PRIVATE outstanding balances while the
          gross_lending_view variant reports both directions separately — so
          when only a PRIVATE_FROM_PUBLIC ticket is open, base variant yields
          0 while gross reports a positive outstanding balance.
        test_recipe:
          setup:
            - "Site S; unit U; product P; lots L_pub (PUBLIC_VFC 10 doses) and L_priv (PRIVATE 8 doses)"
            - "One BorrowTicket B1 direction=PRIVATE_FROM_PUBLIC borrowed_quantity=4 (private borrows from public)"
            - "No PUBLIC_FROM_PRIVATE tickets"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-101" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 10 }
              as: VaccineManager
              captures: { ord: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 10 }
              as: VaccineManager
              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 10, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-PUB", expires_on: "2027-06-30", quantity_doses: 10 }
              as: VaccineManager
              captures: { lot_pub: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "LOT-PRIV", stock_type: "PRIVATE", quantity_on_hand: 8, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot_priv: $.data.id }
            - call: "POST /provider-sites/${site_s}/borrow-tickets"
              payload: { from_lot_id: "${lot_pub}", to_lot_id: "${lot_priv}", direction: "PRIVATE_FROM_PUBLIC", borrowed_quantity: 4, reason_code: "STOCK_OUT" }
              as: VaccineManager
              captures: { bt: $.data.id }
          trigger:
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { net_bal: $.data.private_lending_balance }
            - call: "GET /provider-sites/${site_s}/borrow-tickets"
              payload: { status: "OPEN" }
              as: VaccineManager
          assert:
            - "base variant (net, PUBLIC_FROM_PRIVATE only): private_lending_balance == 0"
            - "${net_bal} == 0"
            - "gross_lending_view variant would report PRIVATE_FROM_PUBLIC outstanding = 4 (separate, not netted)"
            - "Lot.${lot_pub}.quantity_on_hand == 6 (10 - 4 physical doses left the lender)"
            - "Lot.${lot_priv}.quantity_on_hand == 8 (unchanged — IOU recorded on quantity_borrowed_in, no physical movement)"
            - "Lot.${lot_priv}.quantity_borrowed_in == 4"

  # -------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — 2 instances in different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: excursion_peak_deviation_max_of_two_branches
        grounds:
          - calculations.excursion_peak_temperature
          - entities.TemperatureExcursion.fields.peak_temperature_c
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction:
          peak_temperature_c picks the larger of (temp - max_temp_c) when
          above the max and (min_temp_c - temp) when below the min, so the
          peak branch flips based on the sign of deviation relative to two
          distinct bounds, not a single threshold.
        test_recipe:
          setup:
            - "Site S with unit U REFRIGERATOR min=2.0 max=8.0"
            - "One lot L (PRIVATE 5 doses) in U"
            - "Excursion opened at 2026-08-01T10:00:00Z by reading 9.0 (dev +1.0)"
            - "Subsequent readings 11.5 (dev +3.5), then -2.0 (dev -4.0 from min 2.0), then 5.0 (in-range close)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-201" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "LOT-PRIV", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2027-06-30" }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 9.0 }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T11:00:00Z", temperature_c: 11.5 }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T12:00:00Z", temperature_c: -2.0 }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T13:00:00Z", temperature_c: 5.0 }
              as: VaccineManager
          trigger:
            - call: "GET /storage-units/${unit_u}/excursions"
              payload: {}
              as: VaccineManager
              captures:
                peak: "$.data[0].peak_temperature_c"
                dur: "$.data[0].duration_minutes"
                st: "$.data[0].status"
          assert:
            - "Peak deviation: 11.5-8.0 = +3.5 vs 2.0-(-2.0) = 4.0 -> peak is -2.0 (lower bound breach wins)"
            - "${peak} == -2.0"
            - "${dur} == 180"
            - "${st} == OPEN"

      - name: tiered_wastage_rate_boundary_rounding
        grounds:
          - calculations.tiered_wastage_rate_reporting
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: tier boundary uses
          the UNROUNDED rate (raw division), while the reported rate is rounded
          to 4 decimal places round_half_up. A wastage_rate of 0.049999... is
          GREEN; rounding it to 0.0500 first would flip the tier to AMBER.
          Pin: tier is decided before rounding.
        test_recipe:
          setup:
            - "Site S; unit U; product P"
            - "Order for 21 doses allocated and received (LOT-A)"
            - "2 doses administered from LOT-A"
            - "Excursion opens and resolves RESOLVED_WASTED with 1 dose written off from a second PUBLIC lot LOT-B (also from same order, separate lot)"
            - "Wastage rate = 1/21 = 0.047619... < 0.05 -> GREEN (despite round(1/21,4)=0.0476 also <0.05, the boundary check happens on unrounded value)"
            - "SiteVisitAudit moved to IN_PROGRESS"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-202" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 21 }
              as: VaccineManager
              captures: { ord: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 21 }
              as: VaccineManager
              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 21, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-A", expires_on: "2027-06-30", quantity_doses: 20 }
              as: VaccineManager
              captures: { lot_a: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-B", expires_on: "2027-06-30", quantity_doses: 1 }
              as: VaccineManager
              captures: { lot_b: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/patients"
              payload: { full_name: "Pat C", date_of_birth: "2020-01-15", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
              captures: { scr: $.data.id }
            - call: "POST /provider-sites/${site_s}/dose-administrations"
              payload: { patient_id: "${pat}", eligibility_screening_id: "${scr}", lot_id: "${lot_a}", administration_date: "2026-08-05" }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-06T08:00:00Z", temperature_c: 12.0 }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-06T09:00:00Z", temperature_c: 5.0 }
              as: VaccineManager
            - call: "GET /storage-units/${unit_u}/excursions"
              payload: {}
              as: VaccineManager
              captures:
                exc: "$.data[0].id"
            - call: "POST /storage-units/${unit_u}/excursions/${exc}/begin-review"
              payload: {}
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/excursions/${exc}/resolve-wasted"
              payload: { resolution_notes: "spoilage confirmed" }
              as: VaccineManager
            - call: "POST /provider-sites/${site_s}/site-visit-audits"
              payload: { visit_date: "2026-08-10" }
              as: ComplianceAuditor
              captures: { aud: $.data.id }
            - call: "POST /provider-sites/${site_s}/site-visit-audits/${aud}/begin"
              payload: {}
              as: ComplianceAuditor
          trigger:
            - call: "POST /provider-sites/${site_s}/site-visit-audits/${aud}/issue-findings"
              payload: {}
              as: ComplianceAuditor
              captures: { gap: $.data.accountability_gap, wasted: $.data.public_doses_wasted, received: $.data.public_doses_received }
          assert:
            - "${received} == 21"
            - "1 dose administered + 1 lot with 1 dose written off (LOT-B) + LOT-A's 19 remaining on hand"
            - "${wasted} == 20"
            - "wastage_rate = 20/21 = 0.9524 -> RED tier"
            - "${gap} == 0"
            - "Tier boundary uses unrounded rate (1/21 vs 20/21 yield different tiers; rounding at 4dp does not shift the comparison)"

  # -------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — 2 instances on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: dose_administration_registry_cyclic_resubmission
        grounds:
          - state_machines.DoseAdministration
        distinguishing_aspect: |
          DoseAdministration has a cyclic shape:
          PENDING_SUBMISSION -> REJECTED_BY_REGISTRY -> PENDING_SUBMISSION.
          The cycle permits an unbounded number of resubmission attempts;
          each cycle leaves registry_status back at PENDING_SUBMISSION.
        test_recipe:
          setup:
            - "Site S; unit U; product P; lot L_pub with 3 doses; patient pat; screening scr on 2026-08-05"
            - "DoseAdministration D created (registry_status=PENDING_SUBMISSION)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-301" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 3 }
              as: VaccineManager
              captures: { ord: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 3 }
              as: VaccineManager
              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 3, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-A", expires_on: "2027-06-30", quantity_doses: 3 }
              as: VaccineManager
              captures: { lot_a: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/patients"
              payload: { full_name: "Pat C", date_of_birth: "2020-01-15", insurance_category: "MEDICAID" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-05", insurance_category_at_visit: "MEDICAID" }
              as: VaccineManager
              captures: { scr: $.data.id }
