              as: Forecaster
              as_user_id: "${p_fc}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_PRODUCT_STATE (supersede target CANCELLED)"
            - "error_id != ERR_WINDOW_INVALID even though expires_at 09:00 precedes the 10:00 clock (temporal violation also present)"
            - "Product.${p_w2} remains DRAFT and Product.${p_w1} remains CANCELLED"

      - name: low_wind_and_polygon_outside_cwa_reports_criteria_error
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors.ERR_ISSUANCE_CRITERIA_NOT_MET
          - errors.ERR_POLYGON_OUTSIDE_CWA
        distinguishing_aspect: "Category pair (business_safety, business_referential): a warning whose storm readings fail the criteria AND whose polygon reaches into a CWA with no covering agreement fails with ERR_ISSUANCE_CRITERIA_NOT_MET (priority 8 safety), never ERR_POLYGON_OUTSIDE_CWA (priority 11 referential)."
        test_recipe:
          setup:
            - "Office A (no agreement with office C). Office C owns zone ZC (rect lon 0.2..0.3). Storm in A: SEVERE wind 50 (below the 58 threshold). Warning polygon lon 0.05..0.25 overlaps ZC by half, so cross-CWA coordination would be required but is unsatisfiable (no agreement)."
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KPBA", name: "Prio A", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { pb_off_a: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KPBC", name: "Prio C", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { pb_off_c: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZPC1", name: "Prio C Zone", office_id: "${pb_off_c}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.2, lon_max: 0.3, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${pb_off_a}", full_name: "Pete A", employee_code: "EMP-PB", level: "SENIOR" }
              as: PlatformAdmin
              captures: { pb_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${pb_off_a}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 50 }
              as: Forecaster
              as_user_id: "${pb_fc}"
              captures: { pb_storm: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${pb_off_a}", storm_event_id: "${pb_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.05 }, { lat: 0.0, lon: 0.25 }, { lat: 0.1, lon: 0.25 }, { lat: 0.1, lon: 0.05 } ] }, expires_at: "2026-09-01T01:00:00Z" }
              as: Forecaster
              as_user_id: "${pb_fc}"
              captures: { pb_w: $.data.id, pb_wv: $.data.version }
          trigger:
            - call: "POST /alerts/products/${pb_w}/issue"
              payload: { expected_product_version: "${pb_wv}" }
              as: Forecaster
              as_user_id: "${pb_fc}"
              captures: { err_id2: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_ISSUANCE_CRITERIA_NOT_MET (wind 50 < 58)"
            - "error_id != ERR_POLYGON_OUTSIDE_CWA even though the polygon overlaps office C's zone with no agreement"
            - "error_id != ERR_COORDINATION_NOT_ACKED (the coordination requirement is unsatisfiable, so it never becomes the state-level blocker)"
            - "Product.${pb_w} remains DRAFT"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wind_58_issues_wind_57_rejected
        grounds:
          - calculations.issuance_criteria_evaluation
          - errors.ERR_ISSUANCE_CRITERIA_NOT_MET
        distinguishing_aspect: "Scalar threshold metric: the SEVERE_THUNDERSTORM warning wind criterion is >= 58 inclusive — a storm at exactly 58 mph issues while 57 mph is rejected with ERR_ISSUANCE_CRITERIA_NOT_MET, exercised through the issue endpoint."
        test_recipe:
          setup:
            - "Office, zone ZW (rect lat 0..0.1 lon 0..0.1). Two SEVERE_THUNDERSTORM storms: S58 wind 58, S57 wind 57. Two warning drafts with identical polygons and 45-minute windows at clock 2026-09-01T10:00:00Z."
