          - errors.ERR_GUIDE_EFFECTIVE_FROM_IN_PAST
        distinguishing_aspect: "The precondition guide.effective_from > clock now is evaluated at publish time, not at create time: a guide created legally with effective_from 2026-08-05 becomes unpublishable once the clock passes it, returning 422 ERR_GUIDE_EFFECTIVE_FROM_IN_PAST while a sibling guide dated 2026-09-01 publishes at the same clock."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. Two DRAFT guides on disjoint scopes, each with one requirement: RG-PAST (effective_from 2026-08-05, scope GROCERY) and RG-FUTURE (effective_from 2026-09-01, scope APPAREL)."
