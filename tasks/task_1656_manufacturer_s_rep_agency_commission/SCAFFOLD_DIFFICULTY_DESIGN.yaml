# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task 1656 (Manufacturer's Rep Agency)
# §1.8 Test Targeting Index: 2+ instances per each of the 9 Difficulty Rules.
# All setup chains replay from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# All numeric asserts are literals obtained by executing the §1.3 formulas.
# Canonical fixture ("BASE") replayed inside many instances:
#   principal P1 (quota 10,000,000c, notice 90d) -> agreement A1 over
#   [CA,OR,WA,TX] (specify_share_bp 6000, registered_protection_share_bp 10000,
#   tail 180d, activated) -> rate schedule RS1 (CONNECTORS 1000bp, CABLES 800bp;
#   tiers [{0,10000},{8000,11000},{10000,12500}]; registration bonus 200bp)
#   -> reps R1 [CA,OR], R2 [WA] -> customer C1 (spec CA, ship WA).
#   Clock default 2026-08-01T00:00:00Z unless a set_current_utc call precedes.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (instances on different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: chargeback_original_vs_current_rate
        grounds:
          - calculations.chargeback_amount
          - state_machines.ReturnAuthorization.REQUESTED_to_APPROVED
          - state_machines.ReturnAuthorization.APPROVED_to_CLOSED
          - entities.ReturnAuthorization.fields.provisional_chargeback_cents
          - entities.ReturnAuthorization.fields.final_chargeback_cents
        distinguishing_aspect: |
          Entity domain = ReturnAuthorization/Order commission clawback. The same
          returned goods (10 x CONNECTORS @ 5000c) price at 2500c under the
          CURRENT_RATE provisional variant (new active schedule, 500bp) and at
          5000c under the ORIGINAL_RATE final variant (line's stored
          applied_rate_bp 1000bp) — the variants diverge because a rate-schedule
          supersede landed between invoice and RMA approval.
        test_recipe:
          setup:
            - "BASE: principal P1, agreement A1 ACTIVE, schedule RS1 (CONNECTORS 1000bp), reps R1[CA,OR] R2[WA], customer C1 spec CA ship WA"
            - "Order O1 invoiced: L1 CONNECTORS 100x5000 + L2 CABLES 50x2000; attainment 0bp -> tier0; L1 rate 1000bp -> 50,000c, L2 rate 800bp -> 8,000c; splits per line SPECIFY R1 6000 / SHIP_TO R2 4000; ACCRUAL R1 +34,800, R2 +23,200; credited_ytd 600,000"
            - "RS2 supersedes RS1: CONNECTORS base rate lowered to 500bp"
            - "RMA for 10 units of L1 approved (provisional priced at CURRENT_RATE)"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-1", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }, { line_id: "L2", family_code: "CABLES", quantity: 50, unit_price_cents: 2000 }] }
              as: AgencyAdmin
              captures: { o1: $.data.id }
            - call: "POST /rep-agency/orders/${o1}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${o1}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "GET /rep-agency/principals/${p1}"
              as: AgencyAdmin
              captures: { p1_v2: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 500 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v2}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/rmas"
              payload: { order_id: "${o1}", lines: [{ line_id: "L1", qty: 10 }] }
              as: AgencyAdmin
              captures: { rma1: $.data.id }
            - call: "POST /rep-agency/rmas/${rma1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { prov: $.data.provisional_chargeback_cents }
          trigger:
            - call: "POST /rep-agency/rmas/${rma1}/receive"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { fin: $.data.final_chargeback_cents }
          assert:
            - "after approve: RMA.${rma1}.provisional_chargeback_cents == 2500 (CURRENT_RATE: 10 x 5000 x 500bp / 10000, tier0 since attainment 600bp)"
            - "after receive: RMA.${rma1}.final_chargeback_cents == 5000 (ORIGINAL_RATE: 10 x 5000 x stored 1000bp / 10000)"
            - "provisional != final: 2500 vs 5000 on identical returned goods"
            - "CHARGEBACK CommissionEntry for rep ${r1} amount_cents == -3000 (5000 x 6000bp share)"
            - "CHARGEBACK CommissionEntry for rep ${r2} amount_cents == -2000 (5000 x 4000bp share)"
            - "Rep.${r1}.commission_balance_cents == 31800 (34,800 - 3,000); Rep.${r2}.commission_balance_cents == 21200"
            - "Principal.${p1}.credited_ytd_sales_cents == 550000 (600,000 - 10 x 5000)"

      - name: statement_accrual_vs_cash_expectation
        grounds:
          - calculations.statement_expectation
          - state_machines.CommissionStatement.RECEIVED_to_IN_RECONCILIATION
          - entities.CommissionStatement.fields.expected_total_cents
          - entities.CommissionStatement.fields.expected_cash_basis_cents
        distinguishing_aspect: |
          Entity domain = CommissionStatement reconciliation (not returns). One
          untouched ledger yields expected_total_cents == 50000 (accrual basis:
          O_B invoiced in period 2026-09) and expected_cash_basis_cents == 16000
          (cash basis: O_A paid in period 2026-09) — the two bases diverge
          because invoice date and payment date straddle the period boundary.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "O_A: PO-A, CABLES 100x2000 = 200,000c, placed+shipped+invoiced at clock 2026-08-05 -> commission 16,000c (800bp, tier0)"
            - "O_A marked paid at clock 2026-09-02 (paid_at inside 2026-09)"
            - "O_B: PO-B, CONNECTORS 100x5000 = 500,000c, placed+shipped+invoiced at clock 2026-09-03 -> attainment 200bp -> tier0 -> 50,000c (1000bp)"
            - "statement for period 2026-09 with one line referencing PO-B at 50,000c"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-A", placed_at: "2026-08-05T00:00:00Z", lines: [{ line_id: "LA", family_code: "CABLES", quantity: 100, unit_price_cents: 2000 }] }
              as: AgencyAdmin
              captures: { oa: $.data.id }
            - call: "POST /rep-agency/orders/${oa}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${oa}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/orders/${oa}/mark_paid"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-B", placed_at: "2026-09-03T00:00:00Z", lines: [{ line_id: "LB", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { ob: $.data.id }
            - call: "POST /rep-agency/orders/${ob}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${ob}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/statements"
              payload: { principal_id: "${p1}", period_label: "2026-09", lines: [{ line_id: "S1", external_order_ref: "PO-B", amount_cents: 50000 }] }
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /rep-agency/statements/${st1}/start_reconciliation"
              payload: {}
              as: AgencyAdmin
              captures: { exp_accrual: $.data.expected_total_cents, exp_cash: $.data.expected_cash_basis_cents }
          assert:
            - "CommissionStatement.${st1}.expected_total_cents == 50000 (accrual: O_B invoiced 2026-09-03 inside period)"
            - "CommissionStatement.${st1}.expected_cash_basis_cents == 16000 (cash: only O_A, paid 2026-09-02 inside period)"
            - "the two expectation variants differ (50000 != 16000) on the identical entry ledger"
            - "CommissionStatement.${st1}.variance_cents == 0 (stated 50,000 - expected 50,000)"
            - "line S1 disposition == MATCHED (|50000 - 50000| = 0 <= 25)"
            - "CommissionStatement.${st1}.status == IN_RECONCILIATION"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (instances in different modes a/b/c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: line_commission_rate_stack_protected
        grounds:
          - calculations.order_line_commission
          - calculations.quota_attainment
          - state_machines.Order.SHIPPED_to_INVOICED
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: family base rate
          (1000bp) x attainment tier multiplier (10000bp) with a nested floor,
          plus a conditional +200bp registration bonus gated on an APPROVED
          registration whose window covers placed_at. Effective rate 1200bp ->
          60,000c on 500,000c, vs 50,000c for the identical unprotected line.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "R1's registration for (P1, C1, CONNECTORS) APPROVED at clock 2026-08-01T00:00:00Z -> protection [2026-08-01, 2027-01-28)"
            - "Order PO-P placed exactly at protection_start (inclusive boundary)"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/project-registrations"
              payload: { principal_id: "${p1}", customer_id: "${c1}", family_code: "CONNECTORS", project_name: "Project Falcon" }
              as: Rep
              as_user_id: "${r1}"
              captures: { reg1: $.data.id }
            - call: "POST /rep-agency/project-registrations/${reg1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-P", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 100, unit_price_cents: 5000 }] }
              as: AgencyAdmin
              captures: { op: $.data.id }
            - call: "POST /rep-agency/orders/${op}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          trigger:
            - call: "POST /rep-agency/orders/${op}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
          assert:
            - "Order.${op} line L1 applied_rate_bp == 1200 (floor(1000 x 10000 / 10000) + 200 registration bonus)"
            - "Order.${op} line L1 commission_cents == 60000 (round_half_up(500000 x 1200 / 10000))"
            - "Order.${op} line L1 protected_registration_id == ${reg1}"
            - "OrderSplit rows for ${op}/L1: exactly one row, role REGISTERED, rep ${r1}, share_bp 10000"
            - "ACCRUAL CommissionEntry for ${r1} amount_cents == 60000 (identical unprotected line would pay 50000)"

      - name: chargeback_per_line_round_then_sum
        grounds:
          - calculations.chargeback_amount
          - state_machines.ReturnAuthorization.APPROVED_to_CLOSED
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-per-line THEN
          sum. Lines 3x1151c and 7x929c at 1000bp round to 345 + 650 = 995c;
          the alternative sum-then-round interpretation (3453+6503)x0.1 = 995.6
          -> 996c is a different cent and is explicitly NOT the spec.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer (schedule unchanged throughout so CURRENT_RATE == ORIGINAL_RATE numerically — isolates the rounding-order claim)"
            - "Order PO-R invoiced: L1 CONNECTORS 3x1151 = 3,453c; L2 CONNECTORS 7x929 = 6,503c; tier0 -> 1000bp both lines"
            - "RMA returning both lines in full, approved"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
              as: AgencyAdmin
              captures: { c1: $.data.id }
            - call: "POST /rep-agency/orders"
              payload: { customer_id: "${c1}", principal_id: "${p1}", external_order_ref: "PO-R", placed_at: "2026-08-01T00:00:00Z", lines: [{ line_id: "L1", family_code: "CONNECTORS", quantity: 3, unit_price_cents: 1151 }, { line_id: "L2", family_code: "CONNECTORS", quantity: 7, unit_price_cents: 929 }] }
              as: AgencyAdmin
              captures: { or_: $.data.id }
            - call: "POST /rep-agency/orders/${or_}/ship"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/orders/${or_}/invoice"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
            - call: "POST /rep-agency/rmas"
              payload: { order_id: "${or_}", lines: [{ line_id: "L1", qty: 3 }, { line_id: "L2", qty: 7 }] }
              as: AgencyAdmin
              captures: { rma1: $.data.id }
          trigger:
            - call: "POST /rep-agency/rmas/${rma1}/approve"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { prov: $.data.provisional_chargeback_cents }
            - call: "POST /rep-agency/rmas/${rma1}/receive"
              payload: {}
              as: PrincipalOps
              as_user_id: "${p1}"
              captures: { fin: $.data.final_chargeback_cents }
          assert:
            - "RMA.${rma1}.provisional_chargeback_cents == 995 (per-line: round_half_up(345.3)=345 + round_half_up(650.3)=650)"
            - "RMA.${rma1}.final_chargeback_cents == 995 — NOT 996 (sum-then-round of 995.6 is the forbidden order)"
            - "Order line L1 commission_cents == 345 and L2 commission_cents == 650 (same per-line rounding at invoice)"
            - "CHARGEBACK entries for ${r1} total -597 (345x0.6=207 + 650x0.6=390), for ${r2} total -398"

      - name: attainment_excludes_invoicing_order
        grounds:
          - calculations.quota_attainment
          - entities.Principal.fields.credited_ytd_sales_cents
          - state_machines.Order.SHIPPED_to_INVOICED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the rate of the order being invoiced depends on credited YTD, but YTD
          only absorbs the order AFTER its rate is fixed. Pre-credit 9,700,000c
          -> attainment 9700bp -> tier2 (11000bp multiplier) -> 1100bp rate,
          44,000c; self-inclusive evaluation would give 10100bp -> tier3 ->
          1250bp -> 50,000c.
        test_recipe:
          setup:
            - "BASE principal/agreement/schedule/reps/customer"
            - "Order PO-0 invoiced first: CONNECTORS 1940x5000 = 9,700,000c (tier0 rate 1000bp); credited_ytd becomes 9,700,000"
            - "Order PO-C shipped but not yet invoiced: CONNECTORS 80x5000 = 400,000c"
          setup_api_calls:
            - call: "POST /rep-agency/principals"
              payload: { name: "P1", annual_quota_cents: 10000000, notice_period_days: 90 }
              as: AgencyAdmin
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /rep-agency/principals/${p1}/agreements"
              payload: { territory_codes: ["CA", "OR", "WA", "TX"], effective_start: "2026-01-01T00:00:00Z", specify_share_bp: 6000, registered_protection_share_bp: 10000, tail_period_days: 180 }
              as: AgencyAdmin
              captures: { a1: $.data.id }
            - call: "POST /rep-agency/agreements/${a1}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /rep-agency/principals/${p1}/rate-schedules"
              payload: { family_rates: [{ family_code: "CONNECTORS", base_rate_bp: 1000 }, { family_code: "CABLES", base_rate_bp: 800 }], attainment_tiers: [{ min_attainment_bp: 0, multiplier_bp: 10000 }, { min_attainment_bp: 8000, multiplier_bp: 11000 }, { min_attainment_bp: 10000, multiplier_bp: 12500 }], registration_bonus_bp: 200, expected_principal_version: "${p1_v}" }
              as: AgencyAdmin
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R1", territory_codes: ["CA", "OR"] }
              as: AgencyAdmin
              captures: { r1: $.data.id }
            - call: "POST /rep-agency/reps"
              payload: { display_name: "R2", territory_codes: ["WA"] }
              as: AgencyAdmin
              captures: { r2: $.data.id }
            - call: "POST /rep-agency/customers"
              payload: { name: "C1", spec_territory_code: "CA", ship_to_territory_code: "WA" }
