scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: overage_contract_flat_vs_tiered_charge_diverges
        grounds:
          - calculations.mileage_overage_charge
          - entities.Lease.fields.overage_model
          - state_machines.OverageSettlement.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Two valid overage algorithms on the Lease domain: CONTRACT_FLAT (25000 excess * 25c
          = 625000) vs TIERED_EXCESS (10000*20c + 15000*35c = 725000) yield different
          mileage_charge_cents for identical excess miles.
        test_recipe:
          setup:
            - "Lessee ACTIVE; Vehicle HEAVY_DUTY at odometer 0; Lease CONTRACT_FLAT contracted_miles=60000, per_mile_overage_cents=25, activated (odometer_start=0); vehicle driven to 85000; lease RETURN_INITIATED then settlement opened (PENDING_SETTLEMENT)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "Flat Co", billing_email: "flat@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINFLAT0001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "CA", odometer_miles: 85000, segment_miles: 85000, harsh_events: 10, idle_minutes: 100, recorded_at: "2026-06-01T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/leases/${lease_id}/initiate-return"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/overage-settlements"
              payload: { lease_id: "${lease_id}" }
              as: FleetManager
              captures: { settlement_id: $.data.id }
          trigger:
            - call: "POST /fleet/overage-settlements/${settlement_id}/finalize"
              payload: {}
              as: FleetManager
              captures: { charge: $.data.mileage_charge_cents }
          assert:
            - "OverageSettlement.${settlement_id}.excess_miles == 25000"
            - "OverageSettlement.${settlement_id}.mileage_charge_cents == 625000"
            - "OverageSettlement.${settlement_id}.net_charge_cents == 625000"

      - name: collision_waterfall_deductible_first_vs_insurance_first_diverges
        grounds:
          - calculations.collision_repair_waterfall
          - entities.Lease.fields.waterfall_model
          - state_machines.RepairOrder.ASSESSED_to_APPROVED
        distinguishing_aspect: |
          INSURANCE_FIRST allocation ordering on the RepairOrder domain: with est=550000,
          deductible=100000, cap=800000, INSURANCE_FIRST yields insurance_paid_cents=550000 and
          lessee_responsible_cents=0, whereas DEDUCTIBLE_FIRST on the same inputs would yield
          driver_deductible_cents=100000 and lessee_responsible_cents=100000 — divergent on a
          different entity than the overage calc.
        test_recipe:
          setup:
            - "INSURANCE_FIRST lease on a vehicle; a RepairOrder ASSESSED with estimate_cents=550000, insurance_cap_cents=800000 (550000 <= 0.8*800000=640000, so approvable, not a total loss)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "WF Co", billing_email: "wf@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINWF000001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "INSURANCE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
              captures: { veh_v: $.data.version }
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 550000, insurance_cap_cents: 800000 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/approve"
              payload: {}
              as: FleetManager
              captures: { lessee_cents: $.data.lessee_responsible_cents }
          assert:
            - "RepairOrder.${repair_id}.insurance_paid_cents == 550000"
            - "RepairOrder.${repair_id}.driver_deductible_cents == 0"
            - "RepairOrder.${repair_id}.lessee_responsible_cents == 0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ifta_per_jurisdiction_round_then_sum_net_tax
        grounds:
          - calculations.ifta_net_tax
          - state_machines.IftaReturn.DRAFT_to_FILED
          - entities.IftaReturn.fields.net_tax_due_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: per-jurisdiction taxable gallons (3dp) and tax (2dp) are rounded
          BEFORE summing; fleet_mpg=6.250 over 3 jurisdictions gives net_tax_due_cents=4960 — pinning
          round-per-jurisdiction-then-sum order.
        test_recipe:
          setup:
            - "Lessee with a HEAVY_DUTY vehicle, lease, fuel card; 3 telematics readings (CA 12000, NV 8000, AZ 5000 miles) and 3 POSTED fuel txns (CA 1500, NV 2200, AZ 300 gallons) in 2026Q1; IftaReturn 2026Q1 in DRAFT."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "IFTA Co", billing_email: "ifta@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINIFTA0001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 100000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/fuel-cards"
              payload: { lease_id: "${lease_id}", card_number: "CARD-IFTA-1" }
              as: FleetManager
              captures: { card_id: $.data.id }
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "CA", odometer_miles: 12000, segment_miles: 12000, recorded_at: "2026-01-10T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "NV", odometer_miles: 20000, segment_miles: 8000, recorded_at: "2026-02-10T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "AZ", odometer_miles: 25000, segment_miles: 5000, recorded_at: "2026-03-10T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/fuel-transactions"
              payload: { fuel_card_id: "${card_id}", jurisdiction: "CA", gallons: 1500, purchased_at: "2026-01-11T00:00:00Z" }
              as: FleetManager
            - call: "POST /fleet/fuel-transactions"
              payload: { fuel_card_id: "${card_id}", jurisdiction: "NV", gallons: 2200, purchased_at: "2026-02-11T00:00:00Z" }
              as: FleetManager
            - call: "POST /fleet/fuel-transactions"
              payload: { fuel_card_id: "${card_id}", jurisdiction: "AZ", gallons: 300, purchased_at: "2026-03-11T00:00:00Z" }
              as: FleetManager
            - call: "POST /fleet/ifta-returns"
              payload: { lessee_id: "${lessee_id}", quarter: "2026Q1" }
              as: ComplianceOfficer
              captures: { return_id: $.data.id }
          trigger:
            - call: "POST /fleet/ifta-returns/${return_id}/file"
              payload: {}
              as: ComplianceOfficer
              captures: { net: $.data.net_tax_due_cents }
          assert:
            - "IftaReturn.${return_id}.fleet_mpg == 6.25"
            - "IftaReturn.${return_id}.net_tax_due_cents == 4960"
            - "IftaReturn.${return_id}.status == FILED"

      - name: collision_waterfall_nested_minmax_branch
        grounds:
          - calculations.collision_repair_waterfall
          - entities.RepairOrder.fields.lessee_responsible_cents
          - state_machines.RepairOrder.ASSESSED_to_APPROVED
        distinguishing_aspect: |
          Mode (a) ≥3-input non-linear: lessee_responsible_cents = min/max waterfall over
          (estimate_cents, collision_deductible_cents, insurance_cap_cents) with a branch on
          waterfall_model — distinct combinatorial mode from the IFTA nested-rounding instance.
        test_recipe:
          setup:
            - "DEDUCTIBLE_FIRST lease; RepairOrder ASSESSED with estimate_cents=500000, insurance_cap_cents=800000, deductible=100000 (estimate <= 0.8*cap, approvable)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "Comb Co", billing_email: "comb@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCOMB0001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 500000, insurance_cap_cents: 800000 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/approve"
              payload: {}
              as: FleetManager
          assert:
            - "RepairOrder.${repair_id}.driver_deductible_cents == 100000"
            - "RepairOrder.${repair_id}.insurance_paid_cents == 400000"
            - "RepairOrder.${repair_id}.lessee_responsible_cents == 100000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_order_branch_assessed_to_approved_or_total_loss
        grounds:
          - state_machines.RepairOrder.ASSESSED_to_APPROVED
          - state_machines.RepairOrder.ASSESSED_to_TOTAL_LOSS
          - state_machines.RepairOrder.ASSESSED_to_REJECTED
        distinguishing_aspect: |
          RepairOrder is a fork from ASSESSED to {APPROVED, TOTAL_LOSS, REJECTED} with divergent
          side-effect sets (approve runs waterfall + IN_REPAIR; total-loss leads to RETIRED; reject
          unblocks) — branching on the RepairOrder entity.
        test_recipe:
          setup:
            - "RepairOrder ASSESSED with estimate_cents=900000, insurance_cap_cents=1000000 (900000 > 0.8*1000000 so total loss branch is the valid one)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "Branch Co", billing_email: "br@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINBR000001", class: "MEDIUM_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "GET /fleet/vehicles/${veh_id}"
              payload: {}
              as: FleetManager
              captures: { veh_ver: $.data.version }
            - call: "POST /fleet/repair-orders"
              payload: { vehicle_id: "${veh_id}", lease_id: "${lease_id}", expected_vehicle_version: "${veh_ver}" }
              as: FleetManager
              captures: { repair_id: $.data.id }
            - call: "POST /fleet/repair-orders/${repair_id}/assess"
              payload: { estimate_cents: 900000, insurance_cap_cents: 1000000 }
              as: FleetManager
          trigger:
            - call: "POST /fleet/repair-orders/${repair_id}/declare-total-loss"
              payload: {}
              as: FleetManager
              captures: { st: $.data.status }
          assert:
            - "RepairOrder.${repair_id}.status == TOTAL_LOSS"

      - name: vehicle_cycles_allocated_to_in_maintenance_and_back
        grounds:
          - state_machines.Vehicle.ALLOCATED_to_IN_MAINTENANCE
          - state_machines.Vehicle.IN_MAINTENANCE_to_ALLOCATED
          - entities.Vehicle.fields.status
        distinguishing_aspect: |
          Vehicle is cyclic on a different entity than RepairOrder: ALLOCATED->IN_MAINTENANCE
          (maintenance start) then IN_MAINTENANCE->ALLOCATED (maintenance complete) returns the
          vehicle to the prior state — a non-linear loop.
        test_recipe:
          setup:
            - "Vehicle ALLOCATED via an active lease; a SCHEDULED MaintenanceOrder; started (vehicle IN_MAINTENANCE)."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "Cyc Co", billing_email: "cyc@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCYC0001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/maintenance-orders"
              payload: { vehicle_id: "${veh_id}", kind: "PREVENTIVE", labor_cents: 5000, parts_cents: 3000, window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: FleetManager
              captures: { mo_id: $.data.id }
            - call: "POST /fleet/maintenance-orders/${mo_id}/start"
              payload: {}
              as: FleetManager
          trigger:
            - call: "POST /fleet/maintenance-orders/${mo_id}/complete"
              payload: {}
              as: FleetManager
          assert:
            - "Vehicle.${veh_id}.status == ALLOCATED"
            - "Vehicle.${veh_id}.open_block_count == 0"
            - "MaintenanceOrder.${mo_id}.total_cost_cents == 8000"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settlement_finalize_cascades_lease_then_vehicle
        grounds:
          - state_machines.OverageSettlement.DRAFT_to_FINALIZED
          - state_machines.Lease.PENDING_SETTLEMENT_to_CLOSED
          - state_machines.Vehicle.ALLOCATED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-3 chain: finalizing the OverageSettlement (A) sets Lease PENDING_SETTLEMENT->CLOSED
          (B), and that lease close itself drives Vehicle ALLOCATED->AVAILABLE (C). Each hop is caused
          by the previous, originating from the finalize trigger.
        test_recipe:
          setup:
            - "Lease activated, driven to 85000, RETURN_INITIATED, settlement opened (PENDING_SETTLEMENT); vehicle has no open blockers."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "Casc Co", billing_email: "casc@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINCASC001", class: "HEAVY_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/telematics-readings"
              payload: { vehicle_id: "${veh_id}", jurisdiction: "CA", odometer_miles: 85000, segment_miles: 85000, harsh_events: 10, idle_minutes: 100, recorded_at: "2026-06-01T00:00:00Z" }
              as: TelematicsGateway
            - call: "POST /fleet/leases/${lease_id}/initiate-return"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/overage-settlements"
              payload: { lease_id: "${lease_id}" }
              as: FleetManager
              captures: { settlement_id: $.data.id }
          trigger:
            - call: "POST /fleet/overage-settlements/${settlement_id}/finalize"
              payload: {}
              as: FleetManager
          assert:
            - "OverageSettlement.${settlement_id}.status == FINALIZED"
            - "Lease.${lease_id}.status == CLOSED"
            - "Vehicle.${veh_id}.status == AVAILABLE"

      - name: maintenance_start_increments_block_then_blocks_vehicle
        grounds:
          - state_machines.MaintenanceOrder.SCHEDULED_to_IN_PROGRESS
          - entities.Vehicle.fields.open_block_count
          - state_machines.Vehicle.ALLOCATED_to_IN_MAINTENANCE
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: maintenance start (A) increments
          Vehicle.open_block_count (B), and that increment from 0 drives Vehicle
          ALLOCATED->IN_MAINTENANCE (B's mutation causes the status change).
        test_recipe:
          setup:
            - "Vehicle ALLOCATED via active lease; a SCHEDULED MaintenanceOrder exists."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "MB Co", billing_email: "mb@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINMB00001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
            - call: "POST /fleet/leases/${lease_id}/activate"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/maintenance-orders"
              payload: { vehicle_id: "${veh_id}", kind: "CORRECTIVE", labor_cents: 1000, parts_cents: 2000, window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: FleetManager
              captures: { mo_id: $.data.id }
          trigger:
            - call: "POST /fleet/maintenance-orders/${mo_id}/start"
              payload: {}
              as: FleetManager
          assert:
            - "Vehicle.${veh_id}.open_block_count == 1"
            - "Vehicle.${veh_id}.status == IN_MAINTENANCE"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocation_license_invalid_beats_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          business_safety (ERR_DRIVER_LICENSE_INVALID, p8) vs business_temporal (ERR_ALLOCATION_OVERLAP,
          p10): a request that both names a SUSPENDED driver AND overlaps an existing allocation returns
          the p8 safety error.
        test_recipe:
          setup:
            - "Lease ACTIVE; an existing ASSIGNED allocation on its vehicle for [2026-06-01,2026-06-10); a driver whose license is SUSPENDED."
          setup_api_calls:
            - call: "POST /fleet/lessees"
              payload: { company_name: "PP1 Co", billing_email: "pp1@x.com" }
              as: FleetManager
              captures: { lessee_id: $.data.id }
            - call: "POST /fleet/vehicles"
              payload: { vin: "VINPP10001", class: "LIGHT_DUTY" }
              as: FleetManager
              captures: { veh_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "Good Driver", license_number: "LIC-PP1-GOOD" }
              as: FleetManager
              captures: { good_driver_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { lessee_id: "${lessee_id}", full_name: "Bad Driver", license_number: "LIC-PP1-BAD" }
              as: FleetManager
              captures: { bad_driver_id: $.data.id }
            - call: "POST /fleet/drivers/${bad_driver_id}/suspend-license"
              payload: {}
              as: FleetManager
            - call: "POST /fleet/leases"
              payload: { lessee_id: "${lessee_id}", vehicle_id: "${veh_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", contracted_miles: 60000, per_mile_overage_cents: 25, overage_model: "CONTRACT_FLAT", collision_deductible_cents: 100000, waterfall_model: "DEDUCTIBLE_FIRST" }
              as: FleetManager
              captures: { lease_id: $.data.id }
