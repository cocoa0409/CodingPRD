            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-103B", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 2000, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_max: $.data.id }
          assert:
            - "trigger[0] returns 201 with percentage_rent_rate_bps 100, reval_collar_min_uplift_bps 1, reval_collar_max_uplift_bps 2, total_permitted_gfa_sqft 1 and gfa_unallocated_sqft 1"
            - "trigger[1] returns 201 with percentage_rent_rate_bps 2000"
            - "both leases start lease_status ACTIVE, rent_status BASE_ONLY, insurance_status LAPSED and version 1"

      - name: alteration_use_clause_rechecked_against_the_use_in_force_at_decision
        claim_type: temporal_validation
        grounds:
          - validations.priority_17_permitted_use
          - errors.ERR_USE_NOT_PERMITTED
          - endpoints.POST_/portfolio/leases/{id}/terms
        distinguishing_aspect: |
          The use clause is enforced twice against two different snapshots. A mismatched request is
          refused at creation, and a request that was compliant when filed must be refused at decision
          once an intervening terms amendment changed permitted_use_code - so the check cannot be cached
          on the request row. The refusal must also leave the envelope untouched at 0 allocated.
        test_recipe:
          setup:
            - "One lease permitting RETAIL_MIXED."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
