          - validations[priority=15]
          - validations[priority=29]
          - errors.ERR_WHEEL_REQUIRES_DRESSING
          - errors.ERR_CELL_BUFFER_CONFLICT
          - calculations.wheel_life_consumption
        distinguishing_aspect: |
          A different error-category pair — business_safety (priority 15) vs business_temporal
          (priority 29): the new grinding run both books a worn wheel that has dropped under the
          150-unit dressing threshold and starts 44 minutes after the previous run in the same cell
          (inside the 45-minute setup buffer), and the safety check must pre-empt the buffer check.
        test_recipe:
          setup:
            - "GrindingWheel WH-1 with initial_life_units 1000"
            - "A COMPLETED run in CELL_A over [2026-08-12T06:00Z, 10:00Z] on a product with grind_units_per_tool 20 and 43 charged tools, leaving remaining_life_units 140 and the wheel in DRESSING"
            - "Logical clock at 2026-08-12T10:00:00Z"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { em_product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-1", spec_code: "D64-C100", initial_life_units: 1000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T10:00:00Z", planned_units: 43 }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T10:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/grinding-runs/${run1_id}/complete"
              payload: { produced_units: 40, scrap_units: 3, measured_diameter_dev_um: 4.5 }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/grinding-runs"
              payload: { wheel_id: "${wheel_id}", product_id: "${em_product_id}", cell_id: "CELL_A", window_start: "2026-08-12T10:44:00Z", window_end: "2026-08-12T12:00:00Z", planned_units: 5 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_WHEEL_REQUIRES_DRESSING"
            - "HTTP status == 409"
            - "${err} != ERR_CELL_BUFFER_CONFLICT (the priority 29 temporal check is never reached)"
            - "GrindingWheel.${wheel_id}.remaining_life_units == 140 and status == DRESSING"
            - "GrindingRun.${run1_id}.tolerance_class == IT6"
            - "no new GrindingRun row is created"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: order_quantity_equals_min_order_qty_passes
        grounds:
          - validations[priority=31]
          - errors.ERR_BELOW_MIN_ORDER_QTY
          - calculations.order_price
          - entities.ToolProduct.fields.min_order_qty
        distinguishing_aspect: |
          Metric: order quantity in pieces against min_order_qty, on POST /tooling/tool-orders.
          Exactly 25 pieces is accepted and prices through the >= 25 volume tier (4678 per unit,
          116950 total) while 24 pieces is rejected — the boundary is inclusive on the low side and
          the discount tier switches on the same number.
        test_recipe:
          setup:
            - "The full qualification chain through a RELEASED / STOCKED CAT-INS-1 product with min_order_qty 25 and list_price_cents 4550"
            - "Customer CU-1 ACTIVE with 50000 cents of credit"
