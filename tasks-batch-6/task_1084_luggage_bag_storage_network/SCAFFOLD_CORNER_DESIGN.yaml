              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-11", bags: [ { declared_value_cents: 20000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "K0", photo_url: "http://p/0" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/claims"
              payload: { bag_id: "${bag0}", reason: "DAMAGE", description: "d", claimed_amount_cents: 5000 }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claims/${claim_id}/decide"
              payload: { decision: "APPROVE", approved_amount_cents: 5000 }
              as: Host
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ROLE (HTTP 403)"

      - name: dropoff_missing_auth_header_returns_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_HEADER]"]
        distinguishing_aspect: "Calling POST /hosts/{id}/status with no auth headers -> ERR_MISSING_AUTH_HEADER (401)."
        test_recipe:
          setup: ["A host exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /hosts/${host_id}/status"
              payload: { to_status: "SUSPENDED" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_AUTH_HEADER (HTTP 401)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: booking_create_stale_location_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-create-stale-location]", "errors[ERR_STALE_LOCATION_VERSION]"]
        distinguishing_aspect: "A second POST /bookings carrying the pre-first-booking location version (now stale) -> ERR_STALE_LOCATION_VERSION (412)."
        test_recipe:
          setup: ["OPEN location; one successful booking already advanced Location.version past the value the client still holds."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v_stale: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-11", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v_stale}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-11", bags: [ { declared_value_cents: 1000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v_stale}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_LOCATION_VERSION (HTTP 412); the first booking already bumped Location.version"

      - name: location_version_increments_on_status_change
        claim_type: derived_field_reconciliation
        grounds: [entities.Location.fields.status]
        distinguishing_aspect: "A freshly created Location has version 1; opening it (one mutation) advances version to 2."
        test_recipe:
          setup: ["A host exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { v1: $.data.version, st: $.data.status }
          assert:
            - "Created Location.version == 1; after OPEN, version == 2 and status == OPEN"

  # ---------------------------------------------------------------------------
  # excluded_because stubs (already covered by §1.8 depth instances)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_capacity_exceeded_on_booking_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / capacity_exact_equal_allowed_one_over_rejected
          rationale: "ERR_CAPACITY_EXCEEDED is asserted as the one-over failure path of that §1.8 boundary instance."

      - name: error_location_not_open_on_booking
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOCATION_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / booking_create_location_state_beats_capacity
          rationale: "ERR_LOCATION_NOT_OPEN is the winning error in that §1.8 priority-conflict instance (and in dropoff_requires_location_open)."

      - name: error_claim_window_closed
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLAIM_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_create_window_beats_amount
          rationale: "ERR_CLAIM_WINDOW_CLOSED is the winning error asserted in that §1.8 instance."

      - name: error_host_concurrency_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOST_CONCURRENCY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / host_concurrency_closed_interval_count
          rationale: "ERR_HOST_CONCURRENCY_EXCEEDED is asserted directly by that §1.8 overlap instance."

      - name: error_payout_has_open_claim
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYOUT_HAS_OPEN_CLAIM]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / payout_release_blocked_by_open_claim
          rationale: "ERR_PAYOUT_HAS_OPEN_CLAIM is asserted as the blocked-release path of that §1.8 instance."
