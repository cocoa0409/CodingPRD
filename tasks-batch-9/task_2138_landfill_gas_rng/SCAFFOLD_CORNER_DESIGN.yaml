            - "GET /injection-batches?plant_id=${plant_id}&limit=10&offset=0 returns total_count == 0"

      - name: nomination_with_zero_length_window_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=57]", "errors[ERR_INTERVAL_INVALID]"]
        distinguishing_aspect: "gas_day_end must be strictly after gas_day_start; an identical pair returns 422 ERR_INTERVAL_INVALID before any capacity arithmetic runs."
        test_recipe:
          setup: ["One LandfillSite, one ProcessingPlant and one ACTIVE OfftakeContract."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
