  # ---------------------------------------------------------------------------
  # Rule 8: resource temporal-overlap conflicts with DIFFERENT interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: petition_window_discrete_set_overlap
        grounds:
          - validations[priority=13]
          - calculations.transfer_discount_rates
          - state_machines.TransferPetition.DRAFT_to_FILED
        distinguishing_aspect: |
          Semantics = inclusive due-date window mapped to a DISCRETE payment set,
          on resource TransferPetition: petition B's window [2029-06-01,
          2030-12-31] collides with filed petition A's matched set through the
          single shared payment due 2029-06-01, while petition C's immediately
          adjacent window [2030-01-01, 2031-12-31] is allowed because the matched
          SETS are disjoint (date ranges may even interleave — only the payment
          sets matter).
