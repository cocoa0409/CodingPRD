          A different entity pair - RetailContract -> ContractDocument: the contract's
          funding_status is not set directly but derived from its children, so verifying
          the second document bubbles it up to DOCS_VERIFIED and rejecting a previously
          verified document reverts it to PENDING_DOCS, blocking funding again.
