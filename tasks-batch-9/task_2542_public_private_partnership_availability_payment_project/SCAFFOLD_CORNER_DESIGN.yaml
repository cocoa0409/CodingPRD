      - name: approving_an_unknown_milestone_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DRAWDOWN_MILESTONE_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          The certifier is the right role and the body is well formed, so nothing but the
          unresolvable path id can answer. The 404 must precede every state precondition —
          there is no milestone whose status could be consulted.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/drawdown-milestones/mil-does-not-exist/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_DRAWDOWN_MILESTONE_NOT_FOUND\""
            - "GET /ppp/drawdown-milestones as LenderAgent returns total_count == 0"

      - name: rejecting_an_unknown_performance_report_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PERFORMANCE_REPORT_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          Distinguished from the ERR_CROSS_ENTITY_MISMATCH family by where the id sits: a
          report id in the PATH that resolves to nothing is a 404 on its own entity code,
          whereas the same unresolvable id in a BODY would surface as
          ERR_REFERENCED_ENTITY_NOT_FOUND at priority 25.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/performance-reports/pr-does-not-exist/reject"
              payload: { rejection_reason: "Unsupported minute log." }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_PERFORMANCE_REPORT_NOT_FOUND\""
            - "GET /ppp/performance-reports as AuthorityOfficer returns total_count == 0"

      - name: withdrawing_an_unknown_deduction_event_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEDUCTION_EVENT_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          Withdrawal is the one write that reverses money, so its 404 has to be reached
          before any period is touched: an unresolvable event id must leave every
          ServicePeriod untouched rather than triggering a recompute of an empty event set.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/deduction-events/de-does-not-exist/withdraw"
              payload: { withdrawal_reason: "Issued against the wrong period." }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_DEDUCTION_EVENT_NOT_FOUND\""
            - "GET /ppp/deduction-events as AuthorityOfficer returns total_count == 0"

      - name: adjudicating_an_unknown_dispute_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEDUCTION_DISPUTE_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          The decision enum is valid and the officer is permitted, so the unresolvable
          dispute id is the only defect; the 404 must beat the segregation-of-duties check
          at priority 45, which would otherwise need an issuer to compare the adjudicator
          against.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/deduction-disputes/dsp-does-not-exist/adjudicate"
              payload: { decision: "UPHOLD", outcome_note: "Relief overlap accepted." }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_DEDUCTION_DISPUTE_NOT_FOUND\""
            - "GET /ppp/deduction-disputes as AuthorityOfficer returns total_count == 0"

      - name: determining_an_unknown_relief_claim_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RELIEF_CLAIM_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          A REJECT determination carries no granted figures at all, so this request has no
          body defect the 400 layer could catch and no claim whose status the 409 layer
          could read — the 404 is the only possible answer.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/relief-claims/rc-does-not-exist/determine"
              payload: { decision: "REJECT", determination_note: "Not a qualifying event." }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_RELIEF_CLAIM_NOT_FOUND\""
            - "GET /ppp/relief-claims as AuthorityOfficer returns total_count == 0"

      - name: reversing_an_unknown_reserve_transaction_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RESERVE_TRANSACTION_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          The reversal endpoint is the only PlatformAdmin write in the surface, and it is
          also the one whose 404 must be distinguished from the two reversal-specific 409s:
          with no target row there is nothing to have been reversed already and nothing that
          could itself be a reversal, so neither ERR_TRANSACTION_ALREADY_REVERSED nor
          ERR_CANNOT_REVERSE_REVERSAL may be returned in its place.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "POST /ppp/reserve-transactions/tx-does-not-exist/reverse"
              payload: { reason: "Booked against the wrong concession." }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_RESERVE_TRANSACTION_NOT_FOUND\""
            - "GET /ppp/reserve-transactions as PlatformAdmin returns total_count == 0"

      - name: reading_an_unknown_refinancing_event_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_REFINANCING_EVENT_NOT_FOUND]
          - validations[priority=20]
          - endpoints[GET /ppp/refinancing-events/{id}]
        distinguishing_aspect: |
          A read-side 404 on the gain-sharing entity: the lender is an admitted reader of
          refinancing events, so the absent row — not the role — must be the reason, and the
          response must not fall back to an empty object with zeroed share fields.
        test_recipe:
          setup:
            - "An empty system."
          setup_api_calls: []
          trigger:
            - call: "GET /ppp/refinancing-events/rf-does-not-exist"
              as: LenderAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_REFINANCING_EVENT_NOT_FOUND\""
            - "the body carries no authority_share_cents or concessionaire_share_cents field"

      - name: escalating_an_unknown_enforcement_action_is_not_found
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ENFORCEMENT_ACTION_NOT_FOUND]
          - validations[priority=20]
        distinguishing_aspect: |
          escalate takes no body at all, which strips away every other possible failure and
          leaves the path id as the sole subject: the 404 must be raised before the cure
          window is consulted, so no ERR_CURE_WINDOW_VIOLATION may surface from a missing
          row whose deadline is unknowable.
        test_recipe:
          setup:
            - "An empty system, with the logical clock at 2027-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ppp/enforcement-actions/ea-does-not-exist/escalate"
              payload: {}
              as: LenderAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == \"ERR_ENFORCEMENT_ACTION_NOT_FOUND\""
            - "GET /ppp/enforcement-actions as LenderAgent returns total_count == 0"

      - name: a_reversal_of_an_already_reversed_transaction_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TRANSACTION_ALREADY_REVERSED]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: reserve_withdrawal_then_reversal_conserves_the_ledger_balance
          rationale: |
            That instance already drives a WITHDRAWAL through its reversal and then attempts
            a second reversal of the same target, asserting the 409 and the unchanged
            replayed balance. A standalone corner here would repeat the same ledger fixture
            without adding a distinct observation.

      - name: a_reversal_entry_cannot_itself_be_reversed
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CANNOT_REVERSE_REVERSAL]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: reserve_withdrawal_then_reversal_conserves_the_ledger_balance
          rationale: |
            The same instance aims the reverse endpoint at the REVERSAL row it has just
            created and asserts this code, which is the only way to reach it; covering it
            again in breadth would duplicate that exact three-call ledger.

      - name: a_fourth_dispute_submission_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DISPUTE_ROUNDS_EXHAUSTED]
          - validations[priority=65]
        excluded_because:
          difficulty_instance: dispute_referral_cycle_is_bounded_at_three_submissions
          rationale: |
            Reaching this code requires the full raise / refer-back / resubmit cycle run to
            its bound, which is precisely the depth probe that instance exists to drive; a
            breadth copy would have to replay the entire cycle to observe nothing new.

      - name: a_refinancing_with_no_gain_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_REFINANCING_GAIN]
          - validations[priority=76]
        excluded_because:
          difficulty_instance: open_enforcement_freeze_beats_the_no_gain_refinancing_check
          rationale: |
            That priority-pair instance builds a zero-gain refinancing fixture and shows the
            code both when it is reached and when the enforcement freeze at priority 48
            pre-empts it, so the isolated violation is already asserted there.

      - name: a_repeated_period_index_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_PERIOD_INDEX]
          - validations[priority=65]
        excluded_because:
          difficulty_instance: service_period_half_open_intervals_allow_exact_adjacency
          rationale: |
            The adjacency instance distinguishes the overlap rule from the index-uniqueness
            rule by reusing index 1 on a non-overlapping interval and asserting this code,
            which is the only interesting way to reach it in isolation.

  - section: rbac
    instances:
      - name: the_concessionaire_cannot_verify_its_own_period
        claim_type: denied_operations
        grounds:
          - roles.Concessionaire
          - roles.AuthorityOfficer.exclusive_operations
