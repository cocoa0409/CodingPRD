              captures: { arb: "$.data.id" }
            - call: "POST /comp/matters"
              payload: { client_key: "CLI-DP", client_display_name: "Departure Dynamics", matter_type: "NEW", practice_group: "CORPORATE", opened_on: "2026-02-01", billing_attorney_id: "${pd}", responsible_attorney_id: "${pd}" }
              as: CycleAdmin
              captures: { m: "$.data.id", mv1: "$.data.version" }
            - call: "POST /comp/credit-claims"
              payload: { cycle_id: "${cy}", matter_id: "${m}", claim_basis: "NEW_CLIENT", requested_pct: 100.00, narrative: "My client relationship." }
              as: Partner
              as_user_id: "${pd}"
