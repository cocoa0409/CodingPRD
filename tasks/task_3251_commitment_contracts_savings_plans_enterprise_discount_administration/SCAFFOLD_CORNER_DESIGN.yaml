# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3251_commitment_contracts_savings_plans_enterprise_discount_administration
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7 claims not exercised by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: org_create_applies_currency_default_and_system_fields
        claim_type: Defaults
        grounds: [entities.BillingOrganization, endpoints.POST_/api/billing-orgs]
        distinguishing_aspect: "Omitting currency yields USD; current_period_index starts at 0, unapplied_credit_cents at 0, version at 1 — system/computed defaults are not client-controllable."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/billing-orgs"
              payload: { name: "Dft Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { df_org: $.data.id, df_currency: $.data.currency, df_period: $.data.current_period_index, df_credit: $.data.unapplied_credit_cents, df_v: $.data.version }
          assert:
            - "response status 201; currency == USD (default applied)"
            - "current_period_index == 0 and unapplied_credit_cents == 0 and version == 1"
            - "id, created_at, updated_at are present and system-generated"

      - name: usage_record_org_and_period_denormalized_at_ingest
        claim_type: Computed Fields
        grounds: [entities.UsageRecord.fields.org_id, entities.UsageRecord.fields.period_index, endpoints.POST_/api/usage-records]
        distinguishing_aspect: "org_id and period_index are not inputs: they are derived from the linked account and the org's current_period_index at ingest time; after one period close, new ingest carries period_index 1."
        test_recipe:
          setup:
            - "Clock at default. Org; account a1; one usage ingested in period 0; period closed."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Cp Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { cp_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${cp_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { cp_acct: $.data.id }
            - call: "POST /api/billing-orgs/${cp_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${cp_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 500 }
              as: LinkedAccountManager
              as_user_id: "${cp_acct}"
              captures: { cp_org_id: $.data.org_id, cp_period: $.data.period_index, cp_status: $.data.status }
          assert:
            - "org_id == ${cp_org} (denormalized from the account, not supplied in the payload)"
            - "period_index == 1 (org counter after one close)"
            - "status == INGESTED and invoice_id is null"

      - name: invoice_line_has_no_version_field_immutable_rows
        claim_type: Immutability
        grounds: [entities.InvoiceLine]
        distinguishing_aspect: "InvoiceLine declares common_fields: false — rows carry id/created_at but no version and no updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup:
            - "Clock at default. Org; account; usage 500 in period 0; invoice generated."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Im Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { im_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${im_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { im_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${im_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 500 }
              as: LinkedAccountManager
              as_user_id: "${im_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${im_org}", period_index: 0 }
              as: OrgAdmin
              captures: { im_inv: $.data.id }
          trigger:
            - call: "GET /api/invoices/${im_inv}/lines"
              payload: {}
              as: OrgAdmin
              captures: { im_line_id: "$.data[0].id"}
          assert:
            - "line object has id and created_at but no version and no updated_at keys"
            - "GET /api/invoice-lines/${im_line_id} returns the same row (single-fetch endpoint exists)"

      - name: agreement_get_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/api/enterprise-agreements/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND, not a 500 or empty body."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/enterprise-agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OrgAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "response status 404 and error_id == ERR_NOT_FOUND"

      - name: linked_accounts_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/api/linked-accounts, response_envelope.pagination_fields]
        distinguishing_aspect: "With 3 accounts and limit=2: page 1 returns 2 rows, total_count 3, has_more true; offset=2 returns 1 row, has_more false."
        test_recipe:
          setup:
            - "Clock at default. Org with 3 linked accounts."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Pg Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { pg_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${pg_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${pg_org}", name: "a2", external_ref: "e2" }
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${pg_org}", name: "a3", external_ref: "e3" }
              as: OrgAdmin
          trigger:
            - call: "GET /api/linked-accounts?org_id=${pg_org}&limit=2&offset=2"
              payload: {}
              as: OrgAdmin
          assert:
            - "page at offset=2 with limit=2 returns exactly 1 row"
            - "pagination block reports total_count == 3 and has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: credit_grant_terminal_lockdown_revoke_on_exhausted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CreditGrant, "errors[ERR_CREDIT_NOT_USABLE]"]
        distinguishing_aspect: "Revoking an EXHAUSTED grant (terminal) is rejected with 409 ERR_CREDIT_NOT_USABLE; no fields change."
        test_recipe:
          setup:
            - "Clock at default. Org; account; grant 300 expiring 2026-12-01; usage 300; invoice generated and finalized (grant EXHAUSTED)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Tl Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { tl_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${tl_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { tl_acct: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${tl_org}", amount_cents: 300, expires_at: "2026-12-01T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { tl_g: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${tl_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 300 }
              as: LinkedAccountManager
              as_user_id: "${tl_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${tl_org}", period_index: 0 }
              as: OrgAdmin
              captures: { tl_inv: $.data.id }
            - call: "POST /api/invoices/${tl_inv}/finalize"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/credit-grants/${tl_g}/revoke"
              payload: {}
              as: PlatformBillingOperator
              captures: { tl_err: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_CREDIT_NOT_USABLE"
            - "grant remains EXHAUSTED with consumed_cents == 300 and forfeited_cents == 0"

      - name: invoice_settle_from_draft_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Invoice, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Settle is declared only from FINALIZED; calling it on a DRAFT invoice returns 409 ERR_INVALID_STATE_TRANSITION even when amount_cents would match."
        test_recipe:
          setup:
            - "Clock at default. Org; account; usage 1000; DRAFT invoice generated."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "St Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { st_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${st_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { st_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${st_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 1000 }
              as: LinkedAccountManager
              as_user_id: "${st_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${st_org}", period_index: 0 }
              as: OrgAdmin
              captures: { st_inv: $.data.id }
          trigger:
            - call: "POST /api/invoices/${st_inv}/settle"
              payload: { amount_cents: 1000 }
              as: OrgAdmin
              captures: { st_err: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_INVALID_STATE_TRANSITION"
            - "invoice remains DRAFT"

      - name: agreement_double_activate_rejected_not_idempotent
        claim_type: Idempotency
        grounds: [state_machines.EnterpriseAgreement]
        distinguishing_aspect: "activate on an already-ACTIVE agreement returns 409 ERR_INVALID_STATE_TRANSITION — transitions are not idempotent."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Id Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { id_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${id_org}", name: "A", committed_spend_cents: 1000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { id_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${id_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${id_agr}/activate"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/enterprise-agreements/${id_agr}/activate"
              payload: {}
              as: OrgAdmin
              captures: { id_err: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_INVALID_STATE_TRANSITION"

      - name: credit_expiry_at_period_close_forfeits_remainder_conditional_cascade
        claim_type: conditional_cascade
        grounds: [state_machines.CreditGrant, "endpoints.POST_/api/billing-orgs/{id}/run-period-close"]
        distinguishing_aspect: "run-period-close auto-EXPIREs only grants whose expires_at <= clock: an expired grant forfeits its remainder while a later-expiring grant is untouched."
        test_recipe:
          setup:
            - "Clock advanced to 2026-10-01T00:00:00Z. Org with grant gA 500 expiring 2026-09-15 (past) and grant gB 700 expiring 2026-12-01 (future)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Ex Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { ex_org: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${ex_org}", amount_cents: 500, expires_at: "2026-09-15T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { ex_ga: $.data.id }
            - call: "POST /api/credit-grants"
              payload: { org_id: "${ex_org}", amount_cents: 700, expires_at: "2026-12-01T00:00:00Z" }
              as: PlatformBillingOperator
              captures: { ex_gb: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/billing-orgs/${ex_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
              captures: { ex_pool: $.data.unapplied_credit_cents }
            - call: "GET /api/credit-grants/${ex_ga}"
              payload: {}
              as: OrgAdmin
              captures: { ex_ga_status: $.data.status, ex_ga_forfeit: $.data.forfeited_cents }
            - call: "GET /api/credit-grants/${ex_gb}"
              payload: {}
              as: OrgAdmin
              captures: { ex_gb_status: $.data.status }
          assert:
            - "gA: status == EXPIRED, forfeited_cents == 500, remaining_cents == 0"
            - "gB: status == ISSUED, remaining_cents == 700 (conditional cascade skips it)"
            - "org.unapplied_credit_cents == 700"

      - name: invoice_void_reverts_usage_records_to_ingested
        claim_type: side_effect_execution
        grounds: [state_machines.Invoice.DRAFT_to_VOIDED, entities.UsageRecord.fields.status]
        distinguishing_aspect: "Voiding a DRAFT invoice reverts its usage records from BILLED back to INGESTED with invoice_id null, making them billable into a later invoice."
        test_recipe:
          setup:
            - "Clock at default. Org; account; usage 800 in period 0; DRAFT invoice generated (usage BILLED)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Vd Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { vd_org: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${vd_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { vd_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${vd_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 800 }
              as: LinkedAccountManager
              as_user_id: "${vd_acct}"
              captures: { vd_usage: $.data.id }
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${vd_org}", period_index: 0 }
              as: OrgAdmin
              captures: { vd_inv: $.data.id }
          trigger:
            - call: "POST /api/invoices/${vd_inv}/void"
              payload: {}
              as: OrgAdmin
            - call: "GET /api/usage-records/${vd_usage}"
              payload: {}
              as: OrgAdmin
              captures: { vd_status: $.data.status, vd_invoice: $.data.invoice_id }
          assert:
            - "usage record status == INGESTED and invoice_id is null after the void"
            - "a second POST /api/invoices/generate for period 0 now succeeds (no ERR_INVOICE_PERIOD_ALREADY_BILLED for a VOIDED invoice)"

      - name: settle_flips_billed_trueup_charges_to_settled_bubble_up
        claim_type: bubble_up
        grounds: [state_machines.Invoice.FINALIZED_to_SETTLED, state_machines.TrueUpCharge]
        distinguishing_aspect: "Settling the invoice auto-transitions the agreement's BILLED true-up charges to SETTLED — a child-state change driven by the parent invoice's transition."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement committed 10000, COMPUTE tier, term ending 2026-10-01; account; usage 6000 billed into invoice (DRAFT kept open)."
            - "Clock past term; period close expires agreement; assess -> SHORTFALL 4000 ASSESSED; bill -> BILLED. Invoice finalized."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Bu Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 10 }
              as: PlatformBillingOperator
              captures: { bu_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${bu_org}", name: "A", committed_spend_cents: 10000, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
              captures: { bu_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${bu_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${bu_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${bu_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { bu_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${bu_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 6000 }
              as: LinkedAccountManager
              as_user_id: "${bu_acct}"
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${bu_org}", period_index: 0 }
              as: OrgAdmin
              captures: { bu_inv: $.data.id, bu_due: $.data.total_due_cents }
            - call: "POST /api/invoices/${bu_inv}/finalize"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformBillingOperator
            - call: "POST /api/billing-orgs/${bu_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
            - call: "POST /api/true-up-charges/assess"
              payload: { agreement_id: "${bu_agr}" }
              as: OrgAdmin
              captures: { bu_tu: $.data.id }
            - call: "POST /api/true-up-charges/${bu_tu}/bill"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/invoices/${bu_inv}/settle"
              payload: { amount_cents: 5400 }
              as: OrgAdmin
              captures: { bu_status: $.data.status }
            - call: "GET /api/true-up-charges/${bu_tu}"
              payload: {}
              as: OrgAdmin
              captures: { bu_tu_status: $.data.status }
          assert:
            - "invoice total_due_cents == 5400 (6000 - 10% tier discount of 600) and settle of exactly 5400 succeeds -> SETTLED"
            - "true-up charge auto-transitions BILLED -> SETTLED as a side effect of the settle"

  # ===========================================================================
  - section: calculations
    instances:

      - name: waterfall_stage_order_amendment_then_plan_then_tier_then_credit
        claim_type: correct_result
        grounds: [calculations.invoice_waterfall, calculations.savings_plan_coverage, calculations.tiered_eda_discount]
        distinguishing_aspect: "Full four-stage worked example: list 100000, amendment 10% -> 90000, plan covers all at 30% -> 63000, tier 10% -> 56700, credit 6700 -> net 50000. Any other stage order yields a different number."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier (0, 0.10); amendment COMPUTE 10% covering September; plan SAVINGS_PLAN COMPUTE hourly 100000 rate 0.30; credit grant 6700."
            - "One account; usage 100000 at 2026-09-01T00:00."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Wf Org", max_hourly_commitment_cents: 100000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { wf_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${wf_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { wf_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${wf_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${wf_agr}/activate"
              payload: {}
              as: OrgAdmin
              captures: { wf_v1: $.data.version }
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${wf_agr}", service_family: "COMPUTE", discount_rate: 0.10, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_agreement_version: "${wf_v1}" }
              as: FinanceAnalyst
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${wf_org}", agreement_id: "${wf_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100000, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
            - call: "POST /api/credit-grants"
              payload: { org_id: "${wf_org}", amount_cents: 6700, expires_at: "2026-12-01T00:00:00Z" }
              as: PlatformBillingOperator
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${wf_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { wf_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${wf_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 100000 }
              as: LinkedAccountManager
              as_user_id: "${wf_acct}"
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${wf_org}", period_index: 0 }
              as: OrgAdmin
              captures: { wf_inv: $.data.id, wf_due: $.data.total_due_cents }
            - call: "GET /api/invoices/${wf_inv}/lines"
              payload: {}
              as: OrgAdmin
              captures: { wf_am: "$.data[0].amendment_discount_cents", wf_pl: "$.data[0].plan_discount_cents", wf_ti: "$.data[0].tier_discount_cents", wf_cr: "$.data[0].credit_applied_cents", wf_net: "$.data[0].net_due_cents"}
          assert:
            - "line amendment_discount_cents == 10000 (stage 1: 100000 * 0.10)"
            - "line plan_discount_cents == 27000 (stage 2: 90000 * 0.30)"
            - "line tier_discount_cents == 6300 (stage 3: 63000 * 0.10)"
            - "line credit_applied_cents == 6700 (stage 4 grant fully consumed)"
            - "line net_due_cents == 50000 and invoice.total_due_cents == 50000"

      - name: amendment_window_excludes_usage_outside_half_open_window
        claim_type: input_set_filtering
        grounds: [calculations.invoice_waterfall, entities.PricingAmendment.fields.effective_to]
        distinguishing_aspect: "Two usage hours, one at 2026-09-30T23:00 (inside window) and one at 2026-10-01T00:00 (exactly at effective_to, excluded by half-open semantics): only the first receives the amendment discount."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier (0, 0.10); amendment COMPUTE 50% over [2026-09-01, 2026-10-01). No plan, no credit."
            - "Usage: 1000 at 2026-09-30T23:00 and 1000 at 2026-10-01T00:00 (same period 0)."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Hw Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { hw_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${hw_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { hw_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${hw_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${hw_agr}/activate"
              payload: {}
              as: OrgAdmin
              captures: { hw_v1: $.data.version }
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${hw_agr}", service_family: "COMPUTE", discount_rate: 0.50, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", expected_agreement_version: "${hw_v1}" }
              as: FinanceAnalyst
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${hw_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { hw_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${hw_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-30T23:00:00Z", list_price_cents: 1000 }
              as: LinkedAccountManager
              as_user_id: "${hw_acct}"
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${hw_acct}", service_family: "COMPUTE", usage_hour_start: "2026-10-01T00:00:00Z", list_price_cents: 1000 }
              as: LinkedAccountManager
              as_user_id: "${hw_acct}"
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${hw_org}", period_index: 0 }
              as: OrgAdmin
              captures: { hw_inv: $.data.id }
            - call: "GET /api/invoices/${hw_inv}/lines"
              payload: {}
              as: OrgAdmin
              captures: { hw_am: "$.data[0].amendment_discount_cents", hw_ti: "$.data[0].tier_discount_cents", hw_net: "$.data[0].net_due_cents"}
          assert:
            - "line amendment_discount_cents == 500 (only the 23:00 hour is discounted; the 10-01T00:00 hour is outside the half-open window)"
            - "line tier_discount_cents == 150 (10% of 1500 post-amendment)"
            - "line net_due_cents == 1350"

      - name: consolidated_coverage_shared_across_accounts_in_created_at_order
        claim_type: constants_applied
        grounds: [calculations.savings_plan_coverage]
        distinguishing_aspect: "One plan hourly commitment 100 shared org-wide: two accounts post 80 each in the same hour; account created first is covered 80, second only 20 — allocation order follows account created_at ASC, not request order."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier (0, 0.10); accounts a1 then a2; plan hourly 100 rate 0.30 COMPUTE."
            - "Both accounts post usage 80 at 2026-09-01T00:00, a2's request sent first."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Sh Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { sh_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${sh_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { sh_agr: $.data.id }
            - call: "POST /api/discount-tiers"
