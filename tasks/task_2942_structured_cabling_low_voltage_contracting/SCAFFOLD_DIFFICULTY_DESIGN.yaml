          90.00 is admitted (the rule rejects on > , not >=) while 90.01 — one unit of the
          declared precision above the limit — is rejected with 422
          ERR_LINK_LENGTH_EXCEEDED. This is a threshold-equality boundary on an input-derived
          number, unlike zero_link_project_certification_summary_is_the_empty_set_boundary
