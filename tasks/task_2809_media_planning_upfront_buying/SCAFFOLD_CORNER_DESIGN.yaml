      - name: campaign_funding_axis_advances_while_the_plan_axis_stays_draft
        claim_type: Valid Transition
        grounds:
          - state_machines.Campaign.funding_status
          - state_machines.Campaign.plan_status
          - endpoints[POST /upfront/campaigns/{campaignId}/fund]
        distinguishing_aspect: |
          funding_status is a parallel machine: two deposits of 4,000,000 and 6,000,000 cents
          take it UNFUNDED -> PARTIALLY_FUNDED -> FUNDED on a campaign that was never
          submitted, so plan_status is still DRAFT at the end while Campaign.version has
          reached 3.
        test_recipe:
          setup:
            - "one advertiser and one DRAFT campaign with a 10,000,000 cent budget and no allocations"
          setup_api_calls:
            - call: "POST /upfront/advertisers"
              payload: { name: "Cascadia Beverage", category_code: "BEVERAGE", credit_limit_cents: 500000000, payment_terms_days: 30, sequential_liability_enabled: true }
              as: AgencyController
              as_user_id: "controller-01"
              captures: { adv_id: $.data.id }
            - call: "POST /upfront/campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Linear Base", target_demo: "A25-54", universe_thousands: 120000, reach_goal_pct: 60.0, frequency_goal: 4.0, total_budget_cents: 10000000, flight_start: "2026-11-01T00:00:00Z", flight_end: "2026-12-31T23:59:59Z", fiscal_quarter: "2026Q4" }
