          trigger:
            - call: "POST /drone-ops/accident-reports"
              payload: { flight_id: "${fa}", occurred_at: "2026-08-10T09:40:00Z", injury_level: "MINOR", reported_property_damage_cents: 800000, narrative: "Rotor arm fatigue failure; fence damaged and one bystander grazed." }
