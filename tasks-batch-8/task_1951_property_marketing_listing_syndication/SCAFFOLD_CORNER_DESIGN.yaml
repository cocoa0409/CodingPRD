      - name: submit_incomplete_listing_returns_listing_incomplete
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_LISTING_INCOMPLETE]"]
        distinguishing_aspect: "Submit-review with bedrooms/bathrooms/square_feet/marketing_remarks/mls_number null fails ERR_LISTING_INCOMPLETE before the photo check."
