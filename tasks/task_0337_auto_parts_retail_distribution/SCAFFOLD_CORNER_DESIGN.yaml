              as: InventoryManager
            - call: "POST /accounts"
              payload: { name: "WS Shop", account_type: "WHOLESALE", price_tier_id: "${jobber_id}", credit_limit_cents: 1000000 }
              as: WholesaleRep
              captures: { acct_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { account_id: "${acct_id}", channel: "WHOLESALE" }
              as: WholesaleRep
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", part_id: "${pid}", qty: 1 }
              as: WholesaleRep
            - call: "GET /sales-orders/${order_id}"
              as: WholesaleRep
              captures: { v_pre_alloc: $.data.version }
            - call: "POST /sales-orders/${order_id}/allocate"
              payload: { expected_sales_order_version: "${v_pre_alloc}" }
              as: WholesaleRep
          trigger:
            - call: "POST /sales-orders/${order_id}/ship"
              payload: { expected_sales_order_version: "${v_pre_alloc}" }
              as: WholesaleRep
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION with HTTP 412"
            - "SalesOrder.${order_id}.fulfillment_status == ALLOCATED (ship did not fire)"

      - name: ccl_warranty_replace_restock_derived_inventory
        claim_type: derived_field_reconciliation
        grounds: [state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED, entities.Part.fields.on_hand_qty, entities.WarrantyClaim.fields.restock_defective]
        distinguishing_aspect: "An APPROVED REPLACE claim with restock_defective true nets zero inventory change: REPLACE debits one unit, restock credits one back (on_hand returns to its pre-approve value)."
