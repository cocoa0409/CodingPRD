      - name: localization_cost_tier_boundaries_and_surcharge_ordering
        claim_type: tiered_pricing
        grounds: ["calculations.localization_job_cost", "calculations.localization_job_cost.constants"]
        excluded_because:
          difficulty_instance: localization_cost_surcharge_before_volume_discount_mode_c
          rationale: "That instance sweeps the rush / no-rush and volume-tier combinations on one locale and asserts the surcharge-before-discount order that a tier-boundary test would otherwise probe piecemeal."

      - name: doc_set_budget_projection_rounds_each_locale_before_summing
        claim_type: waterfall_allocation
        grounds: ["calculations.doc_set_localization_budget"]
        excluded_because:
          difficulty_instance: doc_set_budget_rounds_per_locale_before_summing_mode_b
          rationale: "That instance builds a projection whose per-locale rounding order is the only way to land exactly on the cap, so the allocation order is asserted through an admitted publish."

      - name: doc_set_budget_projection_rounding_precision
        claim_type: precision
        grounds: ["calculations.doc_set_localization_budget", "calculations.localization_job_cost"]
        excluded_because:
          difficulty_instance: doc_set_budget_rounds_per_locale_before_summing_mode_b
          rationale: "The same instance pins the 2-decimal round_half_up per locale before the integer-cent sum; a sum-then-round implementation misses the cap by cents and fails it."

      - name: localization_cost_variant_switch_reconciles_the_train_ledger
        claim_type: reconciliation
        grounds: ["calculations.localization_job_cost.variants", "calculations.release_train_localization_commitment"]
        excluded_because:
          difficulty_instance: localization_cost_provisional_versus_final_on_one_job
          rationale: "That instance asserts the train's localization_committed_cents moving 12420 -> 10839 as one job's quote switches from PROVISIONAL to FINAL, which is exactly the reconciliation delta."

      - name: topic_health_score_variant_selected_by_publication_state
        claim_type: variant_selection
        grounds: ["calculations.topic_documentation_health_score.variants", "entities.Topic.fields.health_score_variant"]
        excluded_because:
          difficulty_instance: topic_health_score_pre_versus_post_publication
          rationale: "That instance verifies both which variant is applied at each publication state and the numeric divergence between them on identical churn and violation data."

      - name: writer_load_points_rescored_on_reassignment_without_drift
        claim_type: weighted_scoring
        grounds: ["calculations.writer_capacity_load_points", "calculations.writer_committed_load_points"]
        excluded_because:
          difficulty_instance: writer_load_points_conserved_across_assign_reassign_cancel
          rationale: "That instance re-scores the same deliverable under a different seniority divisor and reconciles both writers' aggregates against a full recompute, covering both the re-score and the no-drift claim."

      - name: locale_word_aggregate_correct_after_reversal
        claim_type: aggregation
        grounds: ["calculations.locale_committed_source_words"]
        excluded_because:
          difficulty_instance: locale_committed_source_words_conserved_across_job_create_cancel
          rationale: "That instance asserts the running total after the add and after the reversal against a recompute over the surviving jobs."

      - name: deflection_metrics_window_and_denominator_filtering
        claim_type: input_set_filtering
        grounds: ["calculations.topic_deflection_metrics", "endpoints.GET /topics/{id}/deflection-summary"]
        excluded_because:
          difficulty_instance: deflection_metrics_zero_sample_and_all_abandoned_null_boundaries
          rationale: "That instance covers the 30-day window edges, the exclusion of ABANDONED feedback from the denominator, and the null-versus-zero boundaries for an empty sample."

  - section: validations
