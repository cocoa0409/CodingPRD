            - "current_servicer_org_id == \"1000002\" (C services after the second hop)"
            - "current_investor_org_id == \"1000000\" (A never moved beneficial rights)"
            - "loan_status == ACTIVE"

  # ===========================================================================
  - section: errors
    instances:
      - name: foreclosure_jurisdiction_errors_split_by_mode
        claim_type: violation_to_error
        grounds:
          - errors.ERR_ASSIGNMENT_OUT_REQUIRED
          - errors.ERR_FORECLOSURE_MODE_FORBIDS_ASSIGN_OUT
        distinguishing_aspect: "The two foreclosure-mode errors are mirror images: NY loan without assignment_out -> 422 ERR_ASSIGNMENT_OUT_REQUIRED; TX loan with assignment_out=true -> 422 ERR_FORECLOSURE_MODE_FORBIDS_ASSIGN_OUT."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A ACTIVE with ALL-scope signer; one NY loan and one TX loan."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { sig: $.data.id }
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "NY", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan_ny: $.data.id }
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan_tx: $.data.id }
          trigger:
            - call: "POST /registry/loans/${loan_ny}/foreclose"
              payload: { signer_id: "${sig}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_ny: $.data.error_id }
            - call: "POST /registry/loans/${loan_tx}/foreclose"
              payload: { signer_id: "${sig}", assignment_out: true }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_tx: $.data.error_id }
          assert:
            - "err_ny == ERR_ASSIGNMENT_OUT_REQUIRED (422)"
            - "err_tx == ERR_FORECLOSURE_MODE_FORBIDS_ASSIGN_OUT (422)"
            - "both loans remain ACTIVE"

      - name: signer_scope_and_window_gate_foreclosure
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_SIGNER_NOT_AUTHORIZED
        distinguishing_aspect: "The signer gate is two-dimensional: a REGISTRATION-scope signer fails even inside its window, and an ALL-scope signer fails outside its window (clock past effective_until) — both 403 ERR_SIGNER_NOT_AUTHORIZED."
        test_recipe:
          setup:
            - "Logical clock 2026-06-01. Member A ACTIVE with two signers: S1 (REGISTRATION scope, open-ended) and S2 (ALL scope, window 2026-01-01..2026-03-01). One TX loan."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Reg Signer", email: "reg@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "REGISTRATION" }
              as: RegistryAdmin
              captures: { s1: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "All Signer", email: "all@alpha.example", effective_from: "2026-01-01T00:00:00Z", effective_until: "2026-03-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
              captures: { s2: $.data.id }
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /registry/loans/${loan}/foreclose"
              payload: { signer_id: "${s1}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_scope: $.data.error_id }
            - call: "POST /registry/loans/${loan}/foreclose"
              payload: { signer_id: "${s2}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_window: $.data.error_id }
          assert:
            - "err_scope == ERR_SIGNER_NOT_AUTHORIZED (wrong role_scope despite being inside window)"
            - "err_window == ERR_SIGNER_NOT_AUTHORIZED (clock 2026-06-01 is past effective_until 2026-03-01)"
            - "RegisteredLoan.${loan}.status remains ACTIVE"

  # ===========================================================================
  - section: rbac
    instances:
      - name: memberrep_cannot_create_members_or_settle_reviews
        claim_type: RBAC denial
        grounds:
          - roles.RegistryAdmin.exclusive_operations
          - roles.QAAuditor.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
        distinguishing_aspect: "Entity-backed MemberRep is denied on both operator-only surfaces: POST /registry/members and POST /registry/qa-reviews/{id}/settle each return 403 ERR_ROLE_FORBIDDEN."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A ACTIVE with signer; one loan; an issued review exists for A (created by qa-creator, issued)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev: $.data.id }
            - call: "POST /registry/qa-reviews/${rev}/findings"
              payload: { loan_id: "${loan}", field_name: "MIN", expected_value: "x", actual_value: "y", severity: "MINOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          trigger:
            - call: "POST /registry/members"
              payload: { legal_name: "Rogue Member", org_id: "3000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_create: $.data.error_id }
            - call: "POST /registry/qa-reviews/${rev}/settle"
              payload: {}
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err_settle: $.data.error_id }
          assert:
            - "err_create == ERR_ROLE_FORBIDDEN (403)"
            - "err_settle == ERR_ROLE_FORBIDDEN (403)"
            - "GET /registry/members still returns exactly 1 row"

      - name: borrower_inquirer_cannot_write_and_registryadmin_cannot_inquire
        claim_type: RBAC denial
        grounds:
          - roles.BorrowerInquirer.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
        distinguishing_aspect: "The inquiry role is read-only on the inquiry surface and nothing else: BorrowerInquirer POSTing a loan is 403; RegistryAdmin (who can do almost everything) is denied the borrower-inquiry endpoint — exclusivity is enforced in both directions."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member A ACTIVE with signer; one loan (min 100000000000000016)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
          trigger:
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 10000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: BorrowerInquirer
              as_user_id: "borrower-line-1"
              captures: { err_write: $.data.error_id }
            - call: "GET /registry/borrower-inquiries/100000000000000016"
              payload: {}
              as: RegistryAdmin
              captures: { err_inq: $.data.error_id }
          assert:
            - "err_write == ERR_ROLE_FORBIDDEN (403)"
            - "err_inq == ERR_ROLE_FORBIDDEN (403) — the inquiry endpoint is exclusive to BorrowerInquirer"

      - name: missing_user_context_header_is_401
        claim_type: RBAC denial
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_USER_CONTEXT
        distinguishing_aspect: "A request without X-User-Role is rejected 401 ERR_MISSING_USER_CONTEXT before any other check — including on a path with a nonexistent id (auth outranks existence)."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /registry/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and err == ERR_MISSING_USER_CONTEXT (not 404)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-create-stale-loan]
        excluded_because:
          difficulty_instance: endpoints / transfer_success_moves_rights_and_bumps_loan_version
          rationale: "OCC stale-version rejection and the +1 version bump are asserted by the named §1.9 endpoint instance and by §1.8's priority-pair instance."

      - name: derived_member_portfolio_counts_reconcile_after_termination
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Member.ACTIVE_to_TERMINATION_PENDING
          - entities.SORReconciliationRun.fields.registry_only_count
        excluded_because:
          difficulty_instance: transitive_cascade / termination_cascade_member_loan_sorexception_run
          rationale: "The derived run counts after the termination cascade are asserted hop-by-hop by the named §1.8 instance."

      - name: duplicate_report_without_force_and_vacated_sanction_zeroes_total
        claim_type: idempotency
        grounds:
          - state_machines.Sanction.APPEALED_to_VACATED
          - entities.Sanction.fields.total_amount_cents
        distinguishing_aspect: "VACATED is the compensating write on the sanction ledger: adjudicating VACATED sets total_amount_cents to exactly 0 while keeping the row; a member with only a VACATED prior is NOT a repeat offender (VACATED not in the proven-prior set)."
        test_recipe:
          setup:
            - "Logical clock 2026-01-05. Member D ACTIVE with signer; one loan; review R1 (1 MAJOR) settled, sanction appealed and adjudicated VACATED by a third auditor."
            - "Review R2 (1 MAJOR on the same loan) issued."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Delta Funding", org_id: "1000002", org_id_type: "TAX_ID", member_type: "ORIGINATOR" }
              as: RegistryAdmin
              captures: { m_d: $.data.id }
            - call: "POST /registry/members/${m_d}/signers"
              payload: { full_name: "Dan Signer", email: "dan@delta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_d}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 40000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_d}"
              captures: { d_loan: $.data.id }
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_d}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev1: $.data.id }
            - call: "POST /registry/qa-reviews/${rev1}/findings"
              payload: { loan_id: "${d_loan}", field_name: "PROPERTY_STATE", expected_value: "TX", actual_value: "TN", severity: "MAJOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev1}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev1}/settle"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-settler"
            - call: "GET /registry/sanctions"
              payload: { review_id: "${rev1}" }
              as: QAAuditor
              as_user_id: "qa-settler"
              captures: { sanc1: "$.data[0].id" }
            - call: "POST /registry/sanctions/${sanc1}/appeal"
              payload: {}
              as: MemberRep
              as_user_id: "${m_d}"
            - call: "POST /registry/sanctions/${sanc1}/adjudicate"
              payload: { decision: "VACATED" }
              as: QAAuditor
              as_user_id: "qa-judge"
            - call: "POST /registry/qa-reviews"
              payload: { member_id: "${m_d}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: QAAuditor
              as_user_id: "qa-creator"
              captures: { rev2: $.data.id }
            - call: "POST /registry/qa-reviews/${rev2}/findings"
              payload: { loan_id: "${d_loan}", field_name: "PROPERTY_STATE", expected_value: "TX", actual_value: "TN", severity: "MAJOR" }
              as: QAAuditor
              as_user_id: "qa-creator"
            - call: "POST /registry/qa-reviews/${rev2}/issue"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-creator"
          trigger:
            - call: "POST /registry/qa-reviews/${rev2}/settle"
              payload: {}
              as: QAAuditor
              as_user_id: "qa-settler"
            - call: "GET /registry/sanctions"
              payload: { review_id: "${rev2}" }
              as: QAAuditor
              as_user_id: "qa-settler"
              captures: { sanc2: "$.data[0].id" }
          assert:
            - "Sanction.${sanc1}.status == VACATED and total_amount_cents == 0"
            - "Sanction.${sanc2}.total_amount_cents == 100000 (first-offender base: VACATED is not a proven prior)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: transfer_effects_visible_in_same_request_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/registry/transfers
        distinguishing_aspect: "Consistency is immediate: the 201 response of POST /registry/transfers already carries the computed days_late, late_fee_cents, derived from_member_id and CONFIRMED status — no re-read needed to observe the mutation."
        test_recipe:
          setup:
            - "Logical clock 2026-01-20. Members A, B ACTIVE with signers; A registers one TX loan (version 1) at clock 2026-01-05."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Alpha Mortgage", org_id: "1000000", org_id_type: "TAX_ID", member_type: "SERVICER" }
              as: RegistryAdmin
              captures: { m_a: $.data.id }
            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/members"
              payload: { legal_name: "Beta Investors", org_id: "1000001", org_id_type: "LEI", member_type: "INVESTOR" }
              as: RegistryAdmin
              captures: { m_b: $.data.id }
            - call: "POST /registry/members/${m_b}/signers"
              payload: { full_name: "Bob Signer", email: "bob@beta.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_b}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-20T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_b}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-imm-1", expected_loan_version: "${loan_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { tr: $.data.id }
          assert:
            - "the create response itself shows Transfer.${tr}.status == CONFIRMED, from_member_id == ${m_a}, days_late == 5, late_fee_cents == 12500"
            - "the create response version field is 1 and reported_at is absent (that lives on TransferMatch)"
