  # ===========================================================================
  # SECTION: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: receipt_on_suspended_client_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - entities.Client.fields.status
          - errors[ERR_CLIENT_SUSPENDED]
        distinguishing_aspect: |
          Announcing a receipt for a SUSPENDED client is rejected with
          ERR_CLIENT_SUSPENDED; no Receipt is created.
        test_recipe:
          setup:
            - "A client onboarded then suspended; an ACTIVE SKU and a bin exist"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SuspCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
