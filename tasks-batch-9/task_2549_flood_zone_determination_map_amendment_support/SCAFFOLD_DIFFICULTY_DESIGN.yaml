              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 2, zone_code: "VE", base_flood_elevation_ft: 12.50, effective_date: "2027-04-28T00:00:00Z", supersedes_panel_id: "${p1_id}", sfha_boundary_shift_ft: 0.0, horizontal_uncertainty_ft: 0.0, study_case_number: "26-04-1234P" }
