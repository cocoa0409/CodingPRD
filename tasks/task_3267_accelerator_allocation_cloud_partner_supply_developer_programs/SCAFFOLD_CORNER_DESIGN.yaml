scaffold_corner_design:
- section: entities
  instances:
  - name: partner_create_returns_system_fields_and_lands_unqualified
    claim_type: Creation
    grounds:
    - entities.PartnerAccount
    - endpoints.POST_/accelerators/partners
    - state_machines.PartnerAccount
    distinguishing_aspect: A partner registered with four input fields comes back 201 with qualification_status APPLIED, allocation_priority_class UNQUALIFIED, entitlement_units_held 0, version 1 and server-minted id / created_at / updated_at — qualification status is never client-supplied.
    test_recipe:
      setup:
      - Logical clock at its startup default 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_new: $.data.id
          pa_ver: $.data.version
      assert:
      - the response status is 201 and response_type is object
      - PartnerAccount.${pa_new}.qualification_status == APPLIED
      - PartnerAccount.${pa_new}.allocation_priority_class == UNQUALIFIED
      - PartnerAccount.${pa_new}.entitlement_units_held == 0 and capacity_ledger_net == 0
      - PartnerAccount.${pa_new}.qualification_attempt_count == 0
      - ${pa_ver} == 1
  - name: allocation_create_applies_declared_band_and_derives_free_units
    claim_type: Computed Fields
    grounds:
    - entities.AcceleratorProduct.fields.export_performance_density
    - entities.AcceleratorProduct.fields.available_units
    - calculations.export_density_band
    - calculations.evaluation_ring_fence
    distinguishing_aspect: A SKU declared at 1350 watts opens at PREVIEW with available_units equal to its full ceiling and no evaluation ring fence, because the declared variant of the density band uses tdp_watts verbatim.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_new: $.data.id
      assert:
      - the response status is 201
      - AcceleratorProduct.${sku_new}.lifecycle_stage == PREVIEW
      - AcceleratorProduct.${sku_new}.available_units == 10000
      - AcceleratorProduct.${sku_new}.reserved_evaluation_units == 0
      - AcceleratorProduct.${sku_new}.allocated_units == 0
      - AcceleratorProduct.${sku_new}.export_performance_density == 1350
      - the input tdp_watts value was used verbatim and was not rounded up to 1400 at creation
  - name: allocation_update_re_derives_available_units
    claim_type: Computed Fields
    grounds:
    - endpoints.PUT_/accelerators/allocations/{id}
    - entities.AcceleratorProduct.fields.supply_ceiling_units
    - entities.AcceleratorProduct.fields.available_units
    distinguishing_aspect: Raising a SKU's supply ceiling through the update endpoint re-derives available_units as supply_ceiling_units minus allocated_units minus reserved_evaluation_units, without disturbing the already-committed allocation.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified; SKU AC-100-PCIE with ceiling 10000, a COOL pool, and 400 units committed.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/blueprints
        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-AMER-1
          product_sku_id: ${sku_id}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
        captures:
          node_id: $.data.id
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v: $.data.version
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 400
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          hold_id: $.data.id
      - call: POST /accelerators/allocation-holds/${hold_id}/commit
        payload:
          consume_reservation: false
        as: PartnerOps
        as_user_id: ${pa_id}
      trigger:
      - call: PUT /accelerators/allocations/${sku_id}
        payload:
          supply_ceiling_units: 12000
        as: PlatformAdmin
        captures:
          sku_ceiling: $.data.supply_ceiling_units
          sku_avail: $.data.available_units
      assert:
      - the response status is 200
      - ${sku_ceiling} == 12000
      - ${sku_avail} == 11600
      - AcceleratorProduct.${sku_id}.allocated_units is still 400
  - name: allocation_holds_list_paginates_with_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints.GET_/accelerators/allocation-holds
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With three holds on file, limit 2 and offset 0 returns two rows with total_count 3 and has_more true, while offset 2 returns the remaining row with has_more false — total_count counts the filtered set, not the page.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified with a COOL pool of capacity 1000 and three requested holds of 100, 150 and 200 units.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/blueprints
        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-AMER-1
          product_sku_id: ${sku_id}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
        captures:
          node_id: $.data.id
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v: $.data.version
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 100
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v2: $.data.version
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 150
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v2}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v3: $.data.version
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 200
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v3}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
      trigger:
      - call: GET /accelerators/allocation-holds
        payload:
          partner_id: ${pa_id}
          limit: 2
          offset: 0
        as: PartnerOps
      - call: GET /accelerators/allocation-holds
        payload:
          partner_id: ${pa_id}
          limit: 2
          offset: 2
        as: PartnerOps
      assert:
      - limit 2 with offset 0 returns 2 rows, total_count 3 and has_more true
      - limit 2 with offset 2 returns 1 row, total_count 3 and has_more false
      - total_count counts the filtered set rather than the returned page
      - the default limit is 10 and the default offset is 0 when neither is supplied
  - name: unknown_partner_get_returns_partner_not_found
    claim_type: Not Found
    grounds:
    - endpoints.GET_/accelerators/partners/{id}
    - errors.ERR_PARTNER_NOT_FOUND
    distinguishing_aspect: A read against a well-formed but unknown partner id returns 404 with the partner-specific not-found error and no partial body, rather than an empty object.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Empty database.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /accelerators/partners/3f1c9a52-6d4b-4d7e-9c11-5b8e2a7d0f44
        payload: {}
        as: PartnerOps
        captures:
          err_missing: $.data.error_id
      assert:
      - the response status is 404
      - ${err_missing} == ERR_PARTNER_NOT_FOUND
      - response_type == error and data carries no partner object
  - name: supply_node_filtered_list_returns_only_matching_sku_pools
    claim_type: Parent Relationships
    grounds:
    - endpoints.GET_/accelerators/supply-nodes
    - entities.SupplyNode.fields.product_sku_id
    - complexity_profile.entity_topology
    distinguishing_aspect: The graph topology resolves SupplyNode.product_sku_id as a body-level foreign key, so the SKU-filtered pool list returns only the pools bound to that SKU and never the sibling pools of another SKU.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Two SKUs, AC-100-PCIE and AC-EMB-PCIE, each with one COOL pool, plus a second COOL pool on the first SKU.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_a: $.data.id
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-EMB-PCIE
          product_family: EMBEDDED
          form_factor: PCLE
          hbm_capacity_gb: 32
          tdp_watts: 900
          supply_ceiling_units: 4000
          long_term_availability_through: '2032-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_b: $.data.id
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-A1
          product_sku_id: ${sku_a}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-A2
          product_sku_id: ${sku_a}
          node_region: EMEA
          capacity_units: 500
          requested_hotness_tier: COOL
        as: SupplyPlanner
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-B1
          product_sku_id: ${sku_b}
          node_region: APAC
          capacity_units: 300
          requested_hotness_tier: COOL
        as: SupplyPlanner
      trigger:
      - call: GET /accelerators/supply-nodes
        payload:
          product_sku_id: ${sku_a}
        as: SupplyPlanner
        captures:
          a_sku: $.data[0].product_sku_id
      assert:
      - the filtered list returns exactly 2 pools, both bound to SKU ${sku_a}
      - ${a_sku} == ${sku_a}
      - no returned pool belongs to SKU ${sku_b}
- section: state_machines
  instances:
  - name: allocation_hold_commit_after_commit_is_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.AllocationHold.REQUESTED_to_COMMITTED
    - endpoints.POST_/accelerators/allocation-holds/{id}/commit
    - errors.ERR_INVALID_STATE
    distinguishing_aspect: A second commit on the same hold is refused because the hold is already COMMITTED, and node.held_units does not move a second time.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified with a COOL pool and one REQUESTED hold of 300 units.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/blueprints
        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-AMER-1
          product_sku_id: ${sku_id}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
        captures:
          node_id: $.data.id
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v: $.data.version
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 300
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          hold_c: $.data.id
      trigger:
      - call: POST /accelerators/allocation-holds/${hold_c}/commit
        payload:
          consume_reservation: false
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          state_first: $.data.state
      - call: POST /accelerators/allocation-holds/${hold_c}/commit
        payload:
          consume_reservation: false
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          err_second: $.data.error_id
      - call: GET /accelerators/supply-nodes/${node_id}
        payload: {}
        as: SupplyPlanner
        captures:
          node_held_after: $.data.held_units
      assert:
      - ${state_first} == COMMITTED
      - the response status is 409 and ${err_second} == ERR_INVALID_STATE
      - ${node_held_after} == 300
  - name: drained_supply_node_refuses_new_allocation
    claim_type: precondition_enforcement
    grounds:
    - state_machines.SupplyNode.OPEN_to_DRAINING
    - validations[priority=10]
    - errors.ERR_NODE_NOT_OPEN_FOR_ALLOCATION
    distinguishing_aspect: Once the pool has been moved to DRAINING it refuses a fresh allocation with ERR_NODE_NOT_OPEN_FOR_ALLOCATION even though capacity and tier band would both have allowed it.
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z. Partner HELIOS qualified with a COOL pool; no holds exist yet.
      setup_api_calls:
      - call: POST /accelerators/_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /accelerators/blueprints
        payload:
          blueprint_code: RA-8X-HGX
          blueprint_type: TRAINING_CLUSTER
          target_tdp_watts: 1400
          required_validation_minutes: 120
          evaluation_deadline_days: 30
        as: SupplyPlanner
        captures:
          bp_id: $.data.id
      - call: POST /accelerators/blueprints/${bp_id}/certify
        payload: {}
        as: SupplyPlanner
      - call: POST /accelerators/partners
        payload:
          legal_name: Helios Cloud Systems
          partner_type: CLOUD_PROVIDER
          destination_country: US
          export_restriction_tier: LICENSE_EXCEPTION
          origin_epoch_index: 5
        as: PartnerOps
        captures:
          pa_id: $.data.id
      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/supply-nodes
        payload:
          node_code: POOL-AMER-1
          product_sku_id: ${sku_id}
          node_region: AMERICAS
          capacity_units: 1000
          requested_hotness_tier: COOL
        as: SupplyPlanner
        captures:
          node_id: $.data.id
      - call: GET /accelerators/partners/${pa_id}
        payload: {}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          pa_v: $.data.version
      - call: GET /accelerators/allocations/${sku_id}
        payload: {}
        as: PlatformAdmin
        captures:
          sku_alloc: $.data.allocated_units
      - call: POST /accelerators/supply-nodes/${node_id}/stage
        payload:
          target_stage: DRAINING
        as: SupplyPlanner
        captures:
          stage_after: $.data.stage
      trigger:
      - call: POST /accelerators/allocation-holds
        payload:
          product_sku_id: ${sku_id}
          supply_node_id: ${node_id}
          quantity_units: 100
          hold_friction_tier: COOL
          expected_partner_version: ${pa_v}
          expected_allocated_units: ${sku_alloc}
        as: PartnerOps
        as_user_id: ${pa_id}
        captures:
          err_drained: $.data.error_id
      - call: GET /accelerators/supply-nodes/${node_id}
        payload: {}
        as: SupplyPlanner
        captures:
          node_held_drained: $.data.held_units
      assert:
      - ${stage_after} == DRAINING
      - the response status is 409 and ${err_drained} == ERR_NODE_NOT_OPEN_FOR_ALLOCATION
      - ${node_held_drained} == 0
      - GET /accelerators/allocation-holds?partner_id=${pa_id} returns 0 rows
  - name: membership_renewal_before_evaluation_deadline_is_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.DeveloperProgramMembership.UNDER_EVALUATION_to_ACTIVE
