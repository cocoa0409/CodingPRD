        distinguishing_aspect: "Cumulative threshold trigger: first out-of-tolerance delivery leaves the agreement ACTIVE (flagged 1 < 2); the second flips it to SUSPENDED (flagged 2 >= FLAG_SUSPEND_THRESHOLD 2)."
