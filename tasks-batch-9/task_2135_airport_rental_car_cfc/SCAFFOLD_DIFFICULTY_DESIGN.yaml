              captures: { agr_v3: $.data.version }
            - call: "POST /rac/counter-assignments"
              payload: { agreement_id: "${agr_a_id}", counter_space_id: "${cs_id}", effective_start_date: "2026-03-31", effective_end_date: "2026-06-30", expected_agreement_version: "${agr_v3}" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the adjacent create returns HTTP 201 and CounterAssignment.${ca_2_id}.status == ALLOCATED"
            - "the overlapping create returns HTTP 409 with data.error_id == ERR_COUNTER_SPACE_OCCUPIED"
            - "CounterSpace.${cs_id}.assignment_count == 2"
            - "ConcessionAgreement.${agr_a_id}.counter_units_assigned == 2"
            - "GET /rac/counter-assignments filtered by counter_space_id ${cs_id} returns total_count == 2"

      - name: fleet_zone_closed_interval_touching_day_collides_and_aggregates_capacity
        grounds:
          - calculations.fleet_stall_overflow_allocation
          - validations[priority=19]
          - errors[ERR_ZONE_CAPACITY_EXCEEDED]
          - entities.FleetParkingZone.fields.stalls_allocated
          - concurrency_rules[fleet-allocation-create-stale-zone]
        distinguishing_aspect: |
          Interval semantics #2 — CLOSED [start, end] intervals with AGGREGATE
          capacity on the FleetParkingZone resource, geometrically different from
          the counter's exclusive half-open rule. A request starting on the
          incumbent's own end_date (2026-03-10) DOES collide and is rejected
          because 60 + 50 exceeds the 100-stall zone, while a 40-stall request
          shifted one day later (2026-03-11) is disjoint and is granted in full.
        test_recipe:
          setup:
            - "One facility with overflow_lot_stalls 100 and one ACTIVE agreement whose term is 2026-01-01 through 2026-12-31."
            - "FleetParkingZone Z1 has stall_capacity 100."
            - "FleetAllocation F1 holds 60 stalls in Z1 over the closed interval 2026-03-01 to 2026-03-10 in status ALLOCATED."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/fleet-parking-zones"
              payload: { facility_id: "${fac_id}", zone_label: "Z1", stall_capacity: 100 }
              as: FacilityAdmin
              captures: { zone_id: $.data.id, zone_v1: $.data.version }
            - call: "POST /rac/fleet-allocations"
              payload: { agreement_id: "${agr_a_id}", zone_id: "${zone_id}", start_date: "2026-03-01", end_date: "2026-03-10", stalls_requested: 60, allow_overflow: false, expected_zone_version: "${zone_v1}" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { fa_1_id: $.data.id }
            - call: "GET /rac/fleet-parking-zones/${zone_id}"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { zone_v2: $.data.version }
          trigger:
            - call: "POST /rac/fleet-allocations"
              payload: { agreement_id: "${agr_a_id}", zone_id: "${zone_id}", start_date: "2026-03-10", end_date: "2026-03-20", stalls_requested: 50, allow_overflow: false, expected_zone_version: "${zone_v2}" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { err_touch: $.data.error_id }
            - call: "GET /rac/fleet-parking-zones/${zone_id}"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { zone_v3: $.data.version }
            - call: "POST /rac/fleet-allocations"
              payload: { agreement_id: "${agr_a_id}", zone_id: "${zone_id}", start_date: "2026-03-11", end_date: "2026-03-20", stalls_requested: 40, allow_overflow: false, expected_zone_version: "${zone_v3}" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { fa_3_id: $.data.id }
          assert:
            - "the touching-day create returns HTTP 409 with data.error_id == ERR_ZONE_CAPACITY_EXCEEDED"
            - "the disjoint create returns HTTP 201 and FleetAllocation.${fa_3_id}.zone_stalls_granted == 40"
            - "FleetAllocation.${fa_3_id}.overflow_stalls_granted == 0 and overflow_surcharge_cents == 0"
            - "FleetAllocation.${fa_3_id}.inclusive_days == 10"
            - "FleetParkingZone.${zone_id}.stalls_allocated == 100"
            - "FleetParkingZone.${zone_id}.stalls_available == 0"
            - "ConcessionAgreement.${agr_a_id}.fleet_stalls_allocated == 100"
            - "Facility.${fac_id}.overflow_stalls_allocated == 0"

  - rule_id: compensating_invariant
    instances:

      - name: cfc_trust_cash_conservation_across_authorize_then_void
        grounds:
          - state_machines.CapitalDisbursement.REQUESTED_to_AUTHORIZED
          - state_machines.CapitalDisbursement.AUTHORIZED_to_VOIDED
          - entities.Facility.fields.trust_lifetime_received_cents
          - entities.Facility.fields.trust_encumbered_cents
          - entities.Facility.fields.trust_capital_fund_cents
        distinguishing_aspect: |
          Conserved quantity #1 — MONEY, pinned as
          trust_lifetime_received_cents == trust_debt_service_reserve_cents +
          trust_debt_service_funded_cents + trust_om_reserve_cents +
          trust_capital_fund_cents + trust_unallocated_cents +
          trust_encumbered_cents + trust_disbursed_cents. Authorizing a 300,000
          cent draw and then voiding it must leave that identity at 2,000,000
          throughout and restore trust_capital_fund_cents to exactly 1,000,000.
        test_recipe:
          setup:
            - "A facility with ds_reserve_requirement_cents 1,000,000 and om_reserve_requirement_cents 0 that has received one 2,000,000 cent FINAL remittance."
            - "The waterfall put 1,000,000 into the debt-service reserve and 1,000,000 into the capital fund; the coverage flip auto-funded the 800,000 cent obligation, leaving reserve 200,000 and funded 800,000."
            - "CapitalProject P1 (budget 900,000) was released to FUNDED by that obligation, and a 300,000 cent draw is REQUESTED by fin-1."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 1000000, om_reserve_requirement_cents: 0, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/debt-service-obligations"
              payload: { facility_id: "${fac_id}", series_label: "Series 2026A", due_date: "2026-12-01", amount_due_cents: 800000, coverage_requirement_bps: 12500 }
              as: FacilityAdmin
              captures: { ob_id: $.data.id }
            - call: "POST /rac/capital-projects"
              payload: { facility_id: "${fac_id}", project_name: "Counter millwork", budget_cents: 900000 }
              as: FacilityAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /rac/capital-projects/${proj_id}/approve"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_a_id}", period_year: 2026, period_month: 1, reported_gross_revenue_cents: 5000000, reported_on_airport_transaction_days: 4000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_id}/accept"
              payload: { audited_gross_revenue_cents: 5000000, audited_on_airport_transaction_days: 4000 }
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/cfc-remittances"
              payload: { agreement_id: "${agr_a_id}", report_id: "${rep_id}", remittance_basis: "FINAL" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rem_id: $.data.id }
            - call: "POST /rac/cfc-remittances/${rem_id}/receive"
              payload: { amount_received_cents: 2000000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "GET /rac/capital-projects/${proj_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { proj_v: $.data.version }
            - call: "POST /rac/capital-disbursements"
              payload: { project_id: "${proj_id}", amount_cents: 300000, memo: "Millwork deposit", expected_project_version: "${proj_v}" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { dis_id: $.data.id }
          trigger:
            - call: "POST /rac/capital-disbursements/${dis_id}/authorize"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
            - call: "POST /rac/capital-disbursements/${dis_id}/void"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-2"
          assert:
            - "after the authorize call: Facility.${fac_id}.trust_capital_fund_cents == 700000 and trust_encumbered_cents == 300000"
            - "after the authorize call the conservation identity holds: 200000 + 800000 + 0 + 700000 + 0 + 300000 + 0 == 2000000"
            - "after the void call: Facility.${fac_id}.trust_capital_fund_cents == 1000000"
            - "after the void call: Facility.${fac_id}.trust_encumbered_cents == 0"
            - "after the void call: Facility.${fac_id}.trust_disbursed_cents == 0"
            - "after the void call the conservation identity holds: 200000 + 800000 + 0 + 1000000 + 0 + 0 + 0 == 2000000"
            - "Facility.${fac_id}.trust_lifetime_received_cents == 2000000 at every step"
            - "CapitalDisbursement.${dis_id}.status == VOIDED"
            - "CapitalProject.${proj_id}.encumbered_cents == 0 and CapitalProject.${proj_id}.disbursed_cents == 0"

      - name: fleet_stall_conservation_across_overflow_grant_then_release
        grounds:
          - calculations.fleet_stall_overflow_allocation
          - state_machines.FleetAllocation.ALLOCATED_to_RELEASED
          - entities.FleetParkingZone.fields.stalls_allocated
          - entities.Facility.fields.overflow_stalls_allocated
          - entities.ConcessionAgreement.fields.fleet_stalls_allocated
        distinguishing_aspect: |
          Conserved quantity #2 — PHYSICAL STALLS, a different kind of quantity
          from cash, pinned as two identities: zone.stalls_allocated +
          zone.stalls_available == zone.stall_capacity (200) and
          facility.overflow_stalls_allocated + facility.overflow_stalls_available
          == facility.overflow_lot_stalls (100). A 250-stall grant that spills 50
          into the overflow lot and is then released must return both identities
          to their pre-grant split with zero drift.
        test_recipe:
          setup:
            - "One facility with overflow_lot_stalls 100 and overflow_daily_surcharge_cents 400."
            - "One ACTIVE agreement whose term is 2026-01-01 through 2026-12-31."
            - "FleetParkingZone Z1 with stall_capacity 200, no allocations yet."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/fleet-parking-zones"
              payload: { facility_id: "${fac_id}", zone_label: "Z1", stall_capacity: 200 }
              as: FacilityAdmin
              captures: { zone_id: $.data.id, zone_v1: $.data.version }
          trigger:
            - call: "POST /rac/fleet-allocations"
              payload: { agreement_id: "${agr_a_id}", zone_id: "${zone_id}", start_date: "2026-03-01", end_date: "2026-03-10", stalls_requested: 250, allow_overflow: true, expected_zone_version: "${zone_v1}" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /rac/fleet-allocations/${fa_id}/release"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
          assert:
            - "after the grant: FleetAllocation.${fa_id}.zone_stalls_granted == 200 and overflow_stalls_granted == 50"
            - "after the grant: FleetAllocation.${fa_id}.inclusive_days == 10 and overflow_surcharge_cents == 200000"
            - "after the grant: FleetParkingZone.${zone_id}.stalls_allocated == 200 and stalls_available == 0"
            - "after the grant: Facility.${fac_id}.overflow_stalls_allocated == 50 and overflow_stalls_available == 50"
            - "after the grant: ConcessionAgreement.${agr_a_id}.fleet_stalls_allocated == 250"
            - "after the release: FleetAllocation.${fa_id}.status == RELEASED"
            - "after the release: FleetParkingZone.${zone_id}.stalls_allocated == 0 and stalls_available == 200"
            - "after the release: Facility.${fac_id}.overflow_stalls_allocated == 0 and overflow_stalls_available == 100"
            - "after the release: ConcessionAgreement.${agr_a_id}.fleet_stalls_allocated == 0"
            - "after the release: FleetAllocation.${fa_id}.zone_stalls_granted == 200 and overflow_stalls_granted == 50 are retained on the row for billing"

      - name: rent_ledger_conservation_when_amended_report_supersedes_original
        grounds:
          - state_machines.TransactionDayReport.ACCEPTED_to_SUPERSEDED
          - calculations.percentage_rent_accrual
          - entities.ConcessionAgreement.fields.gross_revenue_ytd_cents
          - entities.ConcessionAgreement.fields.accepted_report_count
          - validations[priority=21]
        distinguishing_aspect: |
          Conserved quantity #3 — a DERIVED LEDGER IDENTITY rather than cash or
          stalls: gross_revenue_ytd_cents must always equal the sum of
          audited_gross_revenue_cents over the agreement's ACCEPTED reports.
          Accepting an amended 2026-01 report at 9,000,000 must subtract the
          superseded 5,000,000 before adding the new figure, ending at exactly
          9,000,000 with accepted_report_count back at 1 — no 14,000,000 drift.
