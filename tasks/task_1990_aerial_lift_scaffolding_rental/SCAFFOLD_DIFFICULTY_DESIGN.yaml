            - "after second dispute: status DISPUTED again (cycle repeats)"
            - "after WAIVE resolve: status WAIVED (terminal)"
            - "contract damage_subtotal_cents == 0 after waive (was 50000 after charge)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: claim_charge_suspends_customer
        grounds:
          - state_machines.DamageClaim.ASSESSED_to_CHARGED
          - state_machines.CustomerAccount.ACTIVE_to_SUSPENDED
          - calculations.customer_outstanding_balance
          - calculations.damage_chargeback
        distinguishing_aspect: |
          Depth-3 cascade originating at POST /damage-claims/{id}/charge: the charge
          mutates RentalContract.damage_subtotal_cents (link 1); that contract mutation
          forces customer_outstanding_balance recompute on CustomerAccount (link 2);
          that balance mutation flips CustomerAccount ACTIVE -> SUSPENDED (link 3).
          Each link is caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Class LFT: daily 10000, weekly 70000, monthly 200000, min 1, height 30, replacement 2000000"
            - "Customer credit_limit_cents 100000"
            - "Contract ACTIVE (waiver false); line window 2026-08-05..2026-08-06 delivered 2026-08-05T09:00:00Z, off-rent 2026-08-06T09:00:00Z (1 day -> 10000; logistics 15000; balance so far 25000)"
