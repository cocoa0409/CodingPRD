      - name: corner_call_without_credentials_returns_unauthenticated
        claim_type: Error triggerability
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1 ERR_UNAUTHENTICATED]
          - validations[priority 4 ERR_INVALID_REQUEST]
          - roles
        distinguishing_aspect: "Authentication is the priority-1 gate and runs before body validation and before path existence: an unauthenticated GET of a real area returns 401 ERR_UNAUTHENTICATED, an unauthenticated POST /mep/areas with an empty body returns 401 rather than the 422 the body would earn, and an unauthenticated GET of an unknown id returns 401 rather than 404."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea created by an authenticated administrator"
            - "the three trigger calls are then issued with NO authentication headers at all (no role header and no X-User-ID); the `as:` column records the identity that would otherwise have been used"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id, area_v1: $.data.version }
          trigger:
            - call: "GET /mep/areas/${area_id}"
              payload: {}
              as: StateProgramAdmin
            - call: "POST /mep/areas"
              payload: {}
              as: StateProgramAdmin
            - call: "GET /mep/areas/00000000-0000-0000-0000-000000009999"
              payload: {}
              as: StateProgramAdmin
          assert:
            - "all three calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the second call returns 401 and NOT 422 ERR_INVALID_REQUEST, even though its body is missing every required field"
            - "the third call returns 401 and NOT 404 ERR_AREA_NOT_FOUND, so authentication precedes path existence"
            - "AgriculturalArea.${area_id}.version is still ${area_v1} == 1 and GET /mep/areas as an authenticated administrator still returns exactly 1 row - nothing was written"

      - name: corner_qc_decision_needs_credentials_and_cannot_be_repeated
        claim_type: Error triggerability
        grounds:
          - errors[ERR_QC_CREDENTIAL_REQUIRED]
          - errors[ERR_QC_REVIEW_ALREADY_DECIDED]
          - validations[priority 6 ERR_QC_REVIEW_ALREADY_DECIDED]
          - validations[priority 9 ERR_QC_CREDENTIAL_REQUIRED]
          - entities.Recruiter.fields.credential_level
          - endpoints[POST /mep/qc-reviews/{review_id}/decide]
        distinguishing_aspect: "Two independent guards on the same decide trigger: a reviewer whose Recruiter row is only BASIC gets 403 ERR_QC_CREDENTIAL_REQUIRED even though the QualityControlReviewer role itself is authorised, and once a QC_CERTIFIED reviewer records PASS the review is terminal, so a second decide returns 409 ERR_QC_REVIEW_ALREADY_DECIDED and the certificate stays QC_PASSED."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea; recruiter A is BASIC and certifies, recruiter B is QC_CERTIFIED, recruiter C is BASIC and will attempt the decision"
            - "one ENROLLED Student with a VERIFIED AGRICULTURAL move and a supporting INITIAL interview"
            - "one certificate with qc_hold_exempt false, submitted, then pulled into QC by a selection run"
            - "one QC_REINTERVIEW interview recorded by recruiter B against that certificate"
          setup_api_calls:
            - call: "POST /mep/areas"
              payload: { name: "Yakima Valley", state_code: "WA", primary_activity: "AGRICULTURE", peak_season_start_date: "2026-06-01", peak_season_end_date: "2026-09-30", recruiter_capacity: 3 }
              as: StateProgramAdmin
              captures: { area_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Rosa Aguilar", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_a_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Paula Vega", state_code: "WA", credential_level: "QC_CERTIFIED", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_b_id: $.data.id }
            - call: "POST /mep/recruiters"
              payload: { full_name: "Luis Ortega", state_code: "WA", credential_level: "BASIC", status: "ACTIVE" }
              as: StateProgramAdmin
              captures: { rec_c_id: $.data.id }
            - call: "POST /mep/students"
              payload: { full_name: "Mateo Reyes", birth_date: "2010-03-20", current_state_code: "WA", area_id: "${area_id}" }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /mep/qualifying-moves"
              payload: { student_id: "${stu_id}", from_state_code: "CA", to_state_code: "WA", move_date: "2026-06-15", work_type: "AGRICULTURAL", worker_relationship: "SELF", purpose: "SEEK_OR_OBTAIN_QUALIFYING_WORK", distance_miles: 820.50 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { move_id: $.data.id }
            - call: "POST /mep/qualifying-moves/${move_id}/adjudicate"
              payload: { decision: "VERIFIED" }
              as: StateProgramAdmin
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "INITIAL", conducted_on: "2026-06-20", informant_relationship: "SELF", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Youth confirms apple harvest work.", corroboration_count: 1 }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { int_a_id: $.data.id }
            - call: "POST /mep/coes"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", residency_date: "2026-07-01", qc_hold_exempt: false }
              as: Recruiter
              as_user_id: "${rec_a_id}"
              captures: { coe_id: $.data.id }
            - call: "POST /mep/coes/${coe_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "${rec_a_id}"
            - call: "POST /mep/qc-selections"
              payload: {}
              as: StateProgramAdmin
              captures: { cand_n: $.data.candidate_count }
            - call: "GET /mep/qc-reviews"
              payload: { coe_id: "${coe_id}" }
              as: StateProgramAdmin
              captures: { review_id: "$.data[0].id", review_reason: "$.data[0].selection_reason" }
            - call: "POST /mep/interview-records"
              payload: { student_id: "${stu_id}", move_id: "${move_id}", interview_kind: "QC_REINTERVIEW", conducted_on: "2026-07-20", informant_relationship: "SELF", outcome: "SUPPORTS_ELIGIBILITY", documentation_notes: "Re-interview corroborates the move date and the work type.", corroboration_count: 2, coe_id: "${coe_id}" }
              as: QualityControlReviewer
              as_user_id: "${rec_b_id}"
              captures: { reint_id: $.data.id }
          trigger:
            - call: "POST /mep/qc-reviews/${review_id}/decide"
              payload: { decision: "PASS", reinterview_id: "${reint_id}" }
              as: QualityControlReviewer
              as_user_id: "${rec_c_id}"
            - call: "POST /mep/qc-reviews/${review_id}/decide"
              payload: { decision: "PASS", reinterview_id: "${reint_id}" }
              as: QualityControlReviewer
              as_user_id: "${rec_b_id}"
