        distinguishing_aspect: |
          ENTITY PAIR: GuideAreaAuthorization depends on Guide — a different pair from the
          Permit/OperatingPlan gate, and the dependency is on a status the API itself flips through
          a separate endpoint rather than on a document review workflow. A guide sitting in
          PENDING_QUALIFICATION is refused even though its certificate, level and outfitter are all
          perfectly valid; the very same request succeeds the moment the guide is qualified, and the
          frozen authorized_client_capacity shows the dependency also supplies data, not just
          permission.
