              as: TeamCapAnalyst
              as_user_id: "${ca_team_id}"
              captures: { ca_txn_id: $.data.id, ca_c_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${ca_p_id}", team_id: "${ca_team_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${ca_txn_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${ca_team_id}"
              captures: { ca_ex_id: $.data.id }
            - call: "POST /physical-exams/${ca_ex_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${ca_team_id}"
            - call: "POST /transactions/${ca_txn_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ca_team_id}"
            - call: "POST /transactions/${ca_txn_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "GET /teams/${ca_team_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ca_team_id}"
              captures: { ca_team_v3: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${ca_team_id}", player_id: "${ca_p_id}", transaction_type: "RELEASE", expected_team_version: "${ca_team_v3}" }
              as: TeamCapAnalyst
              as_user_id: "${ca_team_id}"
              captures: { ca_rel_id: $.data.id }
            - call: "POST /transactions/${ca_rel_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${ca_team_id}"
            - call: "POST /transactions/${ca_rel_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
          trigger:
            - call: "POST /waiver-requests"
              payload: { player_id: "${ca_p_id}", from_team_id: "${ca_team_id}", transaction_id: "${ca_rel_id}" }
              as: TeamCapAnalyst
              as_user_id: "${ca_team_id}"
              captures: { ca_wr_id: $.data.id, ca_rev: $.data.revocability, ca_placed: $.data.placed_at, ca_clear: $.data.clearance_deadline_at }
          assert:
            - "HTTP 201 with the captured ${ca_rev} == REVOCABLE and ${ca_placed} == 2026-08-10T14:00:00Z"
            - "the captured ${ca_clear} == 2026-08-11T14:00:00Z — placed_at + 24h, inside [13:00:00Z, 21:00:00Z) so processing_window_snap is the identity here"
            - "WaiverRequest.${ca_wr_id}.status == PENDING, contract_id == ${ca_c_id}, awarded_to_team_id == null, claim_count == 0"
            - "Player.${ca_p_id}.roster_designation == WAIVED_PENDING"

