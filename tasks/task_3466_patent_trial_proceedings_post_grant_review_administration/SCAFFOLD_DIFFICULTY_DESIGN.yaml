              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_PHASE (state category, priority 7)"
            - "error_id != ERR_PAGE_LIMIT_EXCEEDED even though 200 pages also breaches the 110-page hard cap (business_constraint, priority 9)"

      - name: existence_error_beats_business_fiscal_fee_error
        grounds:
          - validations[priority=3]
          - validations[priority=10]
          - errors[ERR_PATENT_NOT_FOUND]
          - errors[ERR_FEE_INSUFFICIENT]
        distinguishing_aspect: |
          Error-category pair (existence vs business_fiscal): a petition filed
          against a non-existent patent with fee_paid_cents 0 violates BOTH the
          body-FK existence check (priority 3) and the fee floor (priority 10);
          the 404 must win over the 402.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Petitioner P11 exists. A real patent exists only to source a valid version token; the petition targets a different, non-existent patent id."
          setup_api_calls:
