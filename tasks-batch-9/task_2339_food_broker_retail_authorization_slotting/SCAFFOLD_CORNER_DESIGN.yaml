              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e6: $.data.error_id }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av0}", period_index: 1, reported_store_count: 400, distributed_store_count: 400, reported_case_volume: 1000 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { s1: $.data.id }
            - call: "GET /authorizations/${auth}"
              payload: {}
              as: BrokerAccountManager
              captures: { av1: $.data.version }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av1}", period_index: 1, reported_store_count: 400, distributed_store_count: 399, reported_case_volume: 800 }
              as: RetailerBuyer
