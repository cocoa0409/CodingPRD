              captures: { rec: $.data.recommended_outlet_id }
          assert:
            - "DiversionOrder.${order_id}.processing_cost == 1200.00"
            - "DiversionOrder.${order_id}.hauling_cost == 777.60"
            - "DiversionOrder.${order_id}.subtotal_cost == 1977.60"
            - "DiversionOrder.${order_id}.surcharge_pct == 0.00"
