  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: retainage_release_conserves_customer_exposure
        grounds:
          - state_machines.Project.COMMISSIONED_to_PUNCH_CLOSED
          - entities.Project.fields.retainage_held_cents
          - entities.Customer.fields.outstanding_exposure_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.outstanding_exposure_cents. Forward
          action: quote accept debits exposure by grand_total_cents (which
          includes retainage). Compensating action: close-punch-list releases
          retainage_held_cents to 0 AND debits Customer exposure by the same
          amount; project complete then debits the remainder. Invariant:
          after accept, exposure increased by grand_total; after close-punch +
          complete, exposure decreased by exactly grand_total. Net drift == 0.
        test_recipe:
          setup:
            - "Customer C credit_limit 100000000, exposure starts 0"
            - "Project CITY_HEALTH; Layout APPROVED with one STOCK item qty 1 unit_price 100000"
            - "Quote accepted -> grand_total = 100000 + 6000 + 295000 + 183000 = 584000 (freight 6% = 6000; install 250000+45000 = 295000; startup 180000+3000 = 183000)"
            - "retainage_held = round_half_up(584000 * 0.10) = 58400"
            - "Exposure after accept = 584000"
            - "Delivery + startup drive Project to COMMISSIONED"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Retain Cust", contact_email: "rt@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
