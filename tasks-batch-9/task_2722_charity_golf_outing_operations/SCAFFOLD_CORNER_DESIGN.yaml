  - section: rbac
    instances:
      - name: a_request_missing_auth_headers_is_rejected_before_every_other_check
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 sits above the role check, the schema check and the existence checks, so an absent X-User-Id, an absent X-User-Role, an undeclared role name and a request that is ALSO malformed or ALSO role-forbidden all report ERR_UNAUTHENTICATED (401) - reads included."
        test_recipe:
          setup:
            - "No fixtures are needed beyond the clock; the header defect under test is named on each assert line."
            - "Each trigger call below is sent with the header defect stated in its assert line; the `as:` value records the role the request would have carried had its headers been well formed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TournamentDirector
          trigger:
            - call: "POST /outing-ops/outings"
              payload: { name: "No User Id", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { e_no_id: $.data.error_id }
            - call: "POST /outing-ops/outings"
              payload: { name: "No User Role", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { e_no_role: $.data.error_id }
            - call: "POST /outing-ops/outings"
              payload: { name: "Unknown Role", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { e_unknown_role: $.data.error_id }
            - call: "GET /outing-ops/outings"
              as: Beneficiary
              captures: { e_read: $.data.error_id }
            - call: "POST /outing-ops/outings"
              payload: { name: "Malformed And Anonymous", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { e_both: $.data.error_id }
            - call: "POST /outing-ops/outings"
              payload: { name: "Wrong Role And Anonymous", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: CharityTreasurer
              captures: { e_role_and_anon: $.data.error_id }
            - call: "POST /outing-ops/outings"
              payload: { name: "Fully Authenticated", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00Z", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
              as: TournamentDirector
              captures: { ok_id: $.data.id }
          assert:
            - "call 1, sent with X-User-Role 'TournamentDirector' but NO X-User-Id header: ${e_no_id} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "call 2, sent with X-User-Id 'td-1' but NO X-User-Role header: ${e_no_role} == 'ERR_UNAUTHENTICATED' with HTTP 401"
            - "call 3, sent with X-User-Role 'Volunteer' (not one of the six declared roles): ${e_unknown_role} == 'ERR_UNAUTHENTICATED' with HTTP 401 - an undeclared role is unauthenticated, not merely unauthorized"
            - "call 4, a GET sent with NEITHER header: ${e_read} == 'ERR_UNAUTHENTICATED' with HTTP 401 - reads are not exempt"
            - "call 5, sent with NEITHER header AND missing the required beneficiary_name: ${e_both} == 'ERR_UNAUTHENTICATED', NOT ERR_INVALID_REQUEST - priority 1 outranks priority 3"
            - "call 6, sent with X-User-Role 'CharityTreasurer' (a role forbidden on this endpoint) but NO X-User-Id: ${e_role_and_anon} == 'ERR_UNAUTHENTICATED', NOT ERR_UNAUTHORIZED - priority 1 outranks priority 2"
            - "call 7, sent with both headers well formed: HTTP 201 and ${ok_id} is a UUID"
            - "GET /outing-ops/outings as TournamentDirector returns total_count == 1 - only the fully authenticated call created a row"

