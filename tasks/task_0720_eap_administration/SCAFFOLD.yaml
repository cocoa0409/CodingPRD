    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/eap/claims/{id}/review"
    description: "Move a submitted/resubmitted claim to UNDER_REVIEW"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status=UNDER_REVIEW"]

  - method: POST
    path: "/eap/claims/{id}/approve"
    description: "Approve a claim; computes final_cents (budget-prorated)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status=APPROVED, final_cents computed"]

  - method: POST
    path: "/eap/claims/{id}/reject"
    description: "Reject a claim under review"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status=REJECTED"]

  - method: POST
    path: "/eap/claims/{id}/resubmit"
    description: "Provider resubmits a rejected claim with corrected billed_cents (cycle)"
    roles: [Provider]
    code: 200
    input: [billed_cents]
    output: Claim
    side_effects: ["status=RESUBMITTED, provisional_cents recomputed"]

  - method: POST
    path: "/eap/claims/{id}/pay"
    description: "Pay an approved claim (terminal)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status=PAID"]

  # ---- WellnessActivity ----
  - method: POST
    path: "/eap/wellness-activities"
    description: "Log a wellness activity for an employee"
    roles: [ProgramAdmin, CareCoordinator]
    code: 201
    input: [employee_id, activity_type, points, completed_on]
    output: WellnessActivity
    side_effects: []

  - method: GET
    path: "/eap/wellness-activities"
    description: "List wellness activities; filter by employee_id"
    roles: [ProgramAdmin, CareCoordinator]
    code: 200
    input: ["employee_id?", "limit?", "offset?"]
    output: WellnessActivity[]
    side_effects: []

  - method: GET
    path: "/eap/wellness-activities/{id}"
    description: "Get a wellness activity"
    roles: [ProgramAdmin, CareCoordinator]
    code: 200
    input: []
    output: WellnessActivity
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, invalid enum, or numeric constraint violation" }
  - { id: ERR_REFERENTIAL_MISMATCH, http: 409, condition: "Cross-FK inconsistency (e.g., plan not under contract, session not under claim's contract)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal source state for the requested transition" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "expected_contract_version does not match EmployerContract.version (OCC)" }
  - { id: ERR_CONFIDENTIALITY_BLOCKED, http: 403, condition: "Employer role attempted to read confidential PII (employee/dependent/case/session)" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires EmployerContract.status == ACTIVE" }
  - { id: ERR_EMPLOYEE_INELIGIBLE, http: 409, condition: "Employee eligibility_status is INELIGIBLE (not ELIGIBLE or GRACE)" }
  - { id: ERR_ANNUAL_CAP_EXCEEDED, http: 409, condition: "Authorizing the case would exceed contract.annual_session_cap" }
  - { id: ERR_ALLOTMENT_EXHAUSTED, http: 409, condition: "Case has no remaining session allotment" }
  - { id: ERR_WORKLIFE_CAP_EXCEEDED, http: 409, condition: "Work-life/legal/financial referral cap for the employee's plan is reached" }
  - { id: ERR_CASE_HAS_OPEN_SESSIONS, http: 409, condition: "Cannot close a case with SCHEDULED sessions" }
  - { id: ERR_SESSION_NOT_COMPLETED, http: 409, condition: "Claim review requires the referenced session to be COMPLETED" }
  - { id: ERR_SESSION_IN_PAST, http: 422, condition: "scheduled_for is before the logical clock now" }
  - { id: ERR_PROVIDER_DOUBLE_BOOKED, http: 409, condition: "Provider already has a SCHEDULED session overlapping the requested [start, start+duration) interval" }
  - { id: ERR_CASE_SAME_DAY_SESSION, http: 409, condition: "Case already has a SCHEDULED session on the same UTC calendar day" }
  - { id: ERR_NO_PROVIDER_AVAILABLE, http: 409, condition: "Provider-selection pool is empty after filters/exclusions" }
  - { id: ERR_NOT_ASSIGNED_PROVIDER, http: 403, condition: "Acting provider is not the referral's assigned provider" }
  - { id: ERR_DISPOSITION_NOT_ESCALATABLE, http: 409, condition: "Triage disposition is not URGENT_REFERRAL or EMERGENCY_DISPATCH" }
  - { id: ERR_DISPOSITION_NOT_RESOLVABLE, http: 409, condition: "Triaged contact disposition is not SELF_HELP or ROUTINE_REFERRAL for direct resolve" }
  - { id: ERR_IMMINENT_REQUIRES_ESCALATION, http: 409, condition: "IMMINENT-severity crisis contact cannot resolve without escalation" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Report window period_start >= period_end" }
  - { id: ERR_PLAN_NOT_PUBLISHED, http: 409, condition: "Employee enrollment requires a PUBLISHED plan" }
  - { id: ERR_DEPENDENT_NOT_UNDER_EMPLOYEE, http: 409, condition: "dependent_id on a case is not a dependent of employee_id" }
  - { id: ERR_DUPLICATE_EXTERNAL_REF, http: 409, condition: "external_ref already exists within the contract" }
  - { id: ERR_CLAIM_ALREADY_CLAIMED, http: 409, condition: "A non-REJECTED claim already exists for this session_id" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "EAP program operator; manages contracts, plans, eligibility, adjudicates claims, builds reports"
    identity: opaque
    exclusive_operations:
      - "POST /eap/contracts (and suspend/reinstate/terminate)"
      - "POST /eap/plans, POST /eap/plans/{id}/publish"
      - "POST /eap/employees, POST /eap/employees/{id}/eligibility"
      - "POST /eap/cases/{id}/revoke"
      - "POST /eap/claims/{id}/review, approve, reject, pay"
      - "POST /eap/_clock/set_current_utc"
    shared_operations:
      - "GET on contracts, plans, employees, cases, sessions, providers, referrals, claims, crisis-contacts, wellness-activities"
      - "POST /eap/contracts/{id}/reports"
      - "POST /eap/dependents, POST /eap/wellness-activities"

  - name: CareCoordinator
    description: "Clinical case manager; opens cases, authorizes funding, schedules sessions, manages referrals"
    identity: opaque
    exclusive_operations:
      - "POST /eap/cases, POST /eap/cases/{id}/authorize, close"
      - "POST /eap/cases/{id}/sessions"
      - "POST /eap/referrals, POST /eap/referrals/{id}/reassign, cancel"
    shared_operations:
      - "GET on employees, dependents, cases, sessions, providers, referrals"
      - "POST /eap/dependents, POST /eap/wellness-activities"
      - "POST /eap/sessions/{id}/status"

  - name: CrisisCounselor
    description: "24/7 crisis line counselor; intakes, triages, escalates, resolves crisis contacts"
    identity: opaque
    exclusive_operations:
      - "POST /eap/crisis-contacts (and triage, escalate, resolve)"
    shared_operations:
      - "GET on crisis-contacts"

  - name: Provider
    description: "Network counselor; accepts/declines/completes referrals, completes sessions, submits/resubmits claims"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /eap/referrals/{id}/accept, decline, complete"
      - "POST /eap/claims, POST /eap/claims/{id}/resubmit"
    shared_operations:
      - "GET on providers, referrals, claims"
      - "POST /eap/sessions/{id}/status"

  - name: Employer
    description: "Employer-side HR viewer; sees only contract-level and aggregate/anonymized data, never PII"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET on contracts, plans"
      - "GET /eap/contracts/{id}/utilization"
      - "POST /eap/contracts/{id}/reports"
