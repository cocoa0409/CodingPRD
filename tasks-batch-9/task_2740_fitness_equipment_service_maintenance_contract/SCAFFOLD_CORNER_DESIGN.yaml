      - name: end_of_support_touches_the_fleet_only_for_a_critical_spare
        claim_type: conditional_cascade
        grounds:
          - state_machines[PartCatalogEntry].transitions[ACTIVE->OBSOLETE].side_effects
          - state_machines[PartCatalogEntry].transitions[ACTIVE->END_OF_SUPPORT_ANNOUNCED].side_effects
          - entities.Equipment.fields.support_status
          - calculations.fleet_renewal_risk
        distinguishing_aspect: "Two declarations on the same model diverge on the is_critical_spare flag: obsoleting a non-critical part changes only its own row and leaves both units SUPPORTED, while announcing end-of-support for a critical spare with refurbished stock left pushes both units to END_OF_SUPPORT_ANNOUNCED — which is still not UNSUPPORTED, so obsolete_unit_count stays 0 and the 40.00 replacement threshold is retained."
        test_recipe:
          setup:
            - "Clock 2026-08-15T08:00:00Z; club NORTH with two units e1/e2 (installed 2024-03-01, 500 usage hours, health 93.50), ACTIVE GOLD/FULL contract."
            - "Catalogue part CUP-HOLDER is non-critical with no stock at all; part MOTOR-CTRL is a critical spare with 1 refurbished unit on the shelf."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-EO-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-EO-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "CUP-HOLDER", category: "COSMETIC", unit_price_cents: 1500, is_critical_spare: false, initial_on_hand_qty: 0, initial_refurb_qty: 0 }, as: PartsPlanner, captures: { p_cosmetic: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "MOTOR-CTRL", category: "ELECTRONIC", unit_price_cents: 90000, is_critical_spare: true, initial_on_hand_qty: 0, initial_refurb_qty: 1 }, as: PartsPlanner, captures: { p_critical: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/parts/${p_cosmetic}/declare-end-of-support", as: PartsPlanner, captures: { cos_status: "$.data.lifecycle_status", cos_declared: "$.data.eos_declared_at" } }
            - { call: "GET /fleetcare/equipment/${e1_id}", as: PartsPlanner, captures: { e1_support_after_cosmetic: "$.data.support_status" } }
            - { call: "POST /fleetcare/parts/${p_critical}/declare-end-of-support", as: PartsPlanner, captures: { crit_status: "$.data.lifecycle_status" } }
            - { call: "GET /fleetcare/equipment/${e2_id}", as: PartsPlanner, captures: { e2_support_after_critical: "$.data.support_status", e2_notified: "$.data.eos_notified_at" } }
          assert:
            - "${cos_status} == 'OBSOLETE' (refurb_on_hand_qty was 0) and ${cos_declared} == '2026-08-15T08:00:00Z'"
            - "${e1_support_after_cosmetic} == 'SUPPORTED' and Equipment.${e1_id}.eos_notified_at == null — a non-critical part cascades nowhere"
            - "${crit_status} == 'END_OF_SUPPORT_ANNOUNCED' (1 refurbished unit still on the shelf), not OBSOLETE"
            - "${e2_support_after_critical} == 'END_OF_SUPPORT_ANNOUNCED' and ${e2_notified} == '2026-08-15T08:00:00Z'"
            - "Equipment.${e1_id}.support_status == 'END_OF_SUPPORT_ANNOUNCED' as well (the cascade covers every unit of the model)"
            - "both units keep health_score 93.50 and replacement_recommended == false (the 60.00 threshold applies only to UNSUPPORTED units)"
            - "ServiceContract.${c_id}.obsolete_unit_count == 0, replacement_candidate_count == 0 and fleet_renewal_risk == 'LOW'"

