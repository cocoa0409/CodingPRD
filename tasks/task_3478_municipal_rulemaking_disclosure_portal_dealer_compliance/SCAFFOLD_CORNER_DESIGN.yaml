  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: regulator_cannot_create_proposal
        claim_type: role_exclusive_denied
        grounds:
          - roles[RulemakingOfficer]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Rule proposal creation is exclusive to RulemakingOfficer; Regulator is rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-500", title: "Regulator attempt", body: "r", category: "DISCLOSURE" }
              as: Regulator
              as_user_id: regulator-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
      - name: dealerrep_cannot_moderate_comment
        claim_type: role_exclusive_denied
        grounds:
          - roles[PortalOperator]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Comment moderation is exclusive to PortalOperator; DealerRep is rejected 403 ERR_UNAUTHORIZED even for a letter on a live proposal."
        test_recipe:
          setup: ["A dealer org; a proposal OPEN_FOR_COMMENT with one RECEIVED letter."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-6001", name: "Dealer Moderator", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-501", title: "Moderation rbac", body: "m", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_id}/comment-letters"
              payload: { author_name: "Reader", body: "note", sentiment: "NEUTRAL" }
              as: PublicReader
              captures: { letter: $.data.id }
          trigger:
            - call: "POST /msrb/comment-letters/${letter}/moderate"
              payload: { action: "PUBLISH" }
              as: DealerRep
              as_user_id: "${org_d}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
      - name: rulemaking_officer_cannot_decide_proposal
        claim_type: role_exclusive_denied
        grounds:
          - roles[Regulator]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "decide is exclusive to Regulator; the RulemakingOfficer role is rejected 403 ERR_UNAUTHORIZED (distinct from the segregation-of-duties check, which compares user ids within the Regulator role)."
        test_recipe:
          setup: ["A PENDING_APPROVAL proposal."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-502", title: "Decide rbac", body: "d", category: "DEALER_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
          trigger:
            - call: "POST /msrb/rule-proposals/${p_id}/decide"
              payload: { decision: "APPROVE" }
              as: RulemakingOfficer
              as_user_id: officer-2
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
      - name: subscriber_with_wrong_principal_cannot_pull_feed
        claim_type: role_exclusive_denied
        grounds:
          - roles[MarketDataSubscriber]
          - validations[priority=24]
        distinguishing_aspect: "The feed license is principal-scoped: an ACTIVE subscription registered to principal sub-ok does not license X-User-ID sub-other — 403 ERR_PRODUCT_NOT_LICENSED."
        test_recipe:
          setup: ["A dealer org with an ACTIVE TRADE_HISTORICAL subscription registered to principal sub-ok."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-6002", name: "Dealer PrincipalScope", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/data-subscriptions"
              payload: { product_code: "TRADE_HISTORICAL", licensee_org_id: "${org_d}", subscriber_principal: "sub-ok", license_scope: "INTERNAL", seats: 2 }
              as: LicensingOfficer
              captures: { sub: $.data.id }
            - call: "POST /msrb/data-subscriptions/${sub}/transition"
              payload: { to_state: "ACTIVE" }
              as: LicensingOfficer
          trigger:
            - call: "GET /msrb/data-feeds/TRADE_HISTORICAL"
              payload: {}
              as: MarketDataSubscriber
              as_user_id: sub-other
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PRODUCT_NOT_LICENSED"
      - name: non_systemadmin_cannot_set_clock
        claim_type: role_exclusive_denied
        grounds:
          - roles[SystemAdmin]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The logical clock is exclusive to SystemAdmin; RulemakingOfficer is rejected 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED"
  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_patch_rejected_then_fresh_patch_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[proposal-draft-edit-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on RuleProposal.version: a PATCH carrying the pre-edit version minus one is rejected 412 ERR_STALE_VERSION, and the retry carrying the current version succeeds with version incremented to 2."
        test_recipe:
          setup: ["A DRAFT proposal with version 1 (captured at create)."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-600", title: "OCC rule", body: "o", category: "DISCLOSURE" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "PATCH /msrb/rule-proposals/${p_id}"
              payload: { title: "stale edit", expected_rule_proposal_version: "${p_v} - 1" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { err: $.data.error_id }
            - call: "PATCH /msrb/rule-proposals/${p_id}"
              payload: { title: "fresh edit", expected_rule_proposal_version: "${p_v}" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { v2: $.data.version, t2: $.data.title }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "${v2} == 2"
            - "${t2} == 'fresh edit'"
      - name: rule_effectuation_cascade_layer
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RuleProposal.APPROVED_to_EFFECTIVE
        excluded_because:
          difficulty_instance: rule_effectuation_supersession_referral_cascade
          rationale: "The depth-3 supersession cascade is asserted end-to-end there."
      - name: posture_rejection_cascade_layer
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DataSubscription.PENDING_to_REJECTED
        excluded_because:
          difficulty_instance: late_trade_watch_posture_subscription_cascade
          rationale: "The depth-3 late-trade -> posture -> subscription cascade is asserted end-to-end there."
      - name: approved_proposal_waits_for_effective_date
        claim_type: scheduled_actions
        grounds:
          - calculations.epoch_pass_ordering
          - entities.RuleProposal.fields.effective_at
        distinguishing_aspect: "Effectiveness is scheduled, not immediate: one day before effective_at the epoch pass leaves the proposal APPROVED; at exactly effective_at it flips EFFECTIVE."
        test_recipe:
          setup: ["Standard proposal G-601 approved at 2026-09-22T00:00:00Z with effective_at 2026-10-22T00:00:00Z."]
          setup_api_calls:
            - call: "POST /msrb/rule-proposals"
              payload: { rule_code: "G-601", title: "Scheduled rule", body: "s", category: "DEALER_CONDUCT" }
              as: RulemakingOfficer
              as_user_id: officer-1
              captures: { p_id: $.data.id }
            - call: "POST /msrb/rule-proposals/${p_id}/open-comment-period"
              payload: { comment_period_days: 21 }
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /msrb/rule-proposals/${p_id}/submit-for-approval"
              payload: {}
              as: RulemakingOfficer
              as_user_id: officer-1
            - call: "POST /msrb/rule-proposals/${p_id}/decide"
              payload: { decision: "APPROVE" }
              as: Regulator
              as_user_id: regulator-1
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-21T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /msrb/rule-proposals/${p_id}"
              payload: {}
              as: RulemakingOfficer
              captures: { st_before: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-22T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /msrb/rule-proposals/${p_id}"
              payload: {}
              as: RulemakingOfficer
              captures: { st_at: $.data.status }
          assert:
            - "${st_before} == APPROVED"
            - "${st_at} == EFFECTIVE"
      - name: ce_epoch_due_then_lapse_transitions
        claim_type: scheduled_actions
        grounds:
          - calculations.ce_cycle_satisfaction
          - state_machines.MunicipalProfessional.QUALIFIED_to_CE_DUE
          - state_machines.MunicipalProfessional.CE_DUE_to_LAPSED
        distinguishing_aspect: "The CE lifecycle is clock-scheduled with exact anchors: qualified 2026-09-01T00:00:00Z yields ce_cycle_end 2027-09-01T00:00:00Z (epoch -> CE_DUE) and ce_grace_end 2027-10-31T00:00:00Z (epoch -> LAPSED)."
        test_recipe:
          setup: ["A MUNICIPAL_DEALER_REP professional QUALIFIED at the default clock via MSRB_52 score 80."]
          setup_api_calls:
            - call: "POST /msrb/organizations"
              payload: { org_code: "BD-6003", name: "Dealer CEEpoch", org_type: "BROKER_DEALER" }
              as: PortalOperator
              captures: { org_d: $.data.id }
            - call: "POST /msrb/professionals"
              payload: { full_name: "Pro Lapse", employer_org_id: "${org_d}", professional_class: "MUNICIPAL_DEALER_REP" }
              as: ExamAdmin
              captures: { prof: $.data.id }
            - call: "POST /msrb/exam-attempts"
              payload: { professional_id: "${prof}", series_code: "MSRB_52", score: 80 }
              as: ExamAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /msrb/professionals/${prof}"
              payload: {}
              as: ExamAdmin
              captures: { q_due: $.data.qualification_status, cyc: $.data.ce_cycle_end, grace: $.data.ce_grace_end, m_due: $.data.may_transact }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-31T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /msrb/professionals/${prof}"
              payload: {}
              as: ExamAdmin
              captures: { q_lapsed: $.data.qualification_status, m_lapsed: $.data.may_transact }
          assert:
            - "${q_due} == CE_DUE"
            - "${cyc} == '2027-09-01T00:00:00Z'"
            - "${grace} == '2027-10-31T00:00:00Z'"
            - "${m_due} == false"
            - "${q_lapsed} == LAPSED"
            - "${m_lapsed} == false"
      - name: dual_variant_rule_delay_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.rule_effectiveness_delay
        excluded_because:
          difficulty_instance: rule_effectiveness_standard_vs_expedited
          rationale: "Both delay variants and their 20-day divergence are asserted there."
      - name: dual_variant_trade_banding_layer
        claim_type: dual_variant_calculation
        grounds:
          - calculations.disseminated_par_publication
        excluded_because:
          difficulty_instance: trade_publication_actual_vs_capped_size
          rationale: "Both dissemination-size variants are asserted there."
  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: create_response_carries_computed_fee_immediately
        claim_type: immediate_consistency
        grounds:
          - calculations.subscription_monthly_fee
          - entities.DataSubscription.fields.monthly_fee_cents
        excluded_because:
          difficulty_instance: subscription_fee_multi_input_interaction
          rationale: "The computed monthly and annual fees are asserted from the create response itself (no re-read), which is the immediate-consistency claim."
