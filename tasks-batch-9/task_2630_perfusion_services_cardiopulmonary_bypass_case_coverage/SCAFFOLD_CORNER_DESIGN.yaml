              as: Perfusionist
              as_user_id: "${p1}"
          assert:
            - "${e_case_open} == ERR_INCIDENT_CASE_NOT_COMPLETE with HTTP 409 - the case is ON_BYPASS, not OFF_BYPASS or CLOSED"
            - "IncidentReport.${ir1}.status is still DRAFT with filed_by_perfusionist_id == ${p1} and reviewed_readiness_score == null"
            - "${e_clamp} == ERR_CROSS_CLAMP_EXCEEDS_PUMP_TIME with HTTP 422 for cross_clamp_minutes 200 against pump_time_minutes 150"
            - "after the refused end-bypass, BypassCase.${case1}.bypass_status is still ON_BYPASS with pump_time_minutes == null and billing_status == PROVISIONAL_ACCRUED"
            - "the second end-bypass returns HTTP 200: BypassCase.${case1}.bypass_status == OFF_BYPASS, pump_time_minutes == 150, cross_clamp_minutes == 90, final_fee_cents == 400000 (150 is below the contract's 180-minute prolonged threshold and ELECTIVE carries no acuity uplift) and billing_status == FINAL_ACCRUED"
            - "the second submit returns HTTP 200 with IncidentReport.${ir1}.status == SUBMITTED - the submitter is the filer, satisfying the segregation-of-duties rule"

      - name: pack_config_refuses_a_machine_that_is_in_use_or_needs_service
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=34]
          - errors.ERR_DEVICE_NOT_AVAILABLE
          - entities.PerfusionDevice.fields.status
        distinguishing_aspect: |
          Pack configuration depends on the current status of a different entity, so a primary or backup
          machine sitting at IN_USE or NEEDS_SERVICE must be refused while AVAILABLE and RESERVED pass.
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / pack_config_requires_primary_device_available"
          rationale: |
            That instance drives the same machine through NEEDS_SERVICE and IN_USE and asserts
            ERR_DEVICE_NOT_AVAILABLE for both, then repeats the configuration successfully once the
            machine is serviced back to AVAILABLE.

      - name: third_return_for_info_is_refused_by_the_return_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority=37]
          - errors.ERR_INCIDENT_RETURN_LIMIT
          - entities.IncidentReport.fields.return_count
        distinguishing_aspect: |
          The limit is a strict < comparison against MAX_INCIDENT_RETURNS, so the third RETURN_FOR_INFO
          decision on the same report is refused and return_count stays at 2.
        excluded_because:
          difficulty_instance: "non_linear_state_machine / incident_review_return_cycle_then_resubmit"
          rationale: |
            That instance cycles submit and RETURN_FOR_INFO twice, asserts the third return answers
            ERR_INCIDENT_RETURN_LIMIT with return_count unchanged at 2, and then accepts the report.

      - name: lapsed_certification_outranks_the_contract_case_cap_on_assignment
        claim_type: priority_conflict
        grounds:
          - validations[priority=41]
          - errors.ERR_CERTIFICATION_NOT_CURRENT
          - entities.Certification.fields.status
        distinguishing_aspect: |
          When the same assignment violates the credentialing rule at priority 41 and the fiscal cap at
          priority 72, the credentialing error must be the one returned.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cert_safety_beats_contract_case_cap_fiscal_on_assign"
          rationale: |
            That instance lapses the CCP certification while the contract already sits at its monthly cap
            and asserts ERR_CERTIFICATION_NOT_CURRENT rather than ERR_CONTRACT_CASE_CAP_EXCEEDED.

      - name: assignment_beyond_the_monthly_case_cap_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=72]
          - errors.ERR_CONTRACT_CASE_CAP_EXCEEDED
          - entities.HospitalContract.fields.accrued_case_count
          - entities.HospitalContract.fields.monthly_case_cap
        distinguishing_aspect: |
          The cap is evaluated only for a case that is not already holding an accrual slot, so a case at
          PROVISIONAL_ACCRUED can be superseded at the cap while a fresh case cannot take a new slot.
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / cert_safety_beats_contract_case_cap_fiscal_on_assign"
          rationale: |
            The second half of that instance, once the certification is current again, asserts the
            assignment answers ERR_CONTRACT_CASE_CAP_EXCEEDED with the contract ledger untouched.

      - name: pack_config_needs_a_resolvable_backup_machine
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors.ERR_NO_BACKUP_DEVICE_AVAILABLE
          - entities.PerfusionDevice.fields.backup_device_id
        distinguishing_aspect: |
          A primary machine with no designated backup and no backup_device_id in the payload cannot be
          configured, and the same call succeeds once a backup is named explicitly.
        excluded_because:
          difficulty_instance: "boundary_precision_check / pack_config_rejects_when_backup_device_pool_is_empty"
          rationale: |
            That instance configures a backup-less machine, asserts ERR_NO_BACKUP_DEVICE_AVAILABLE and no
            reservation, then repeats the call with an explicit backup_device_id and asserts both machines
            end RESERVED.

      - name: rotation_slot_overlap_is_rejected_while_adjacency_is_admitted
        claim_type: temporal_validation
        grounds:
          - validations[priority=66]
          - errors.ERR_ROTATION_SLOT_OVERLAP
          - entities.CallRotationSlot.fields.window_start
          - entities.CallRotationSlot.fields.window_end
        distinguishing_aspect: |
          Slot windows are half-open, so a new slot starting exactly where the incumbent ends is admitted
          while one overlapping by a single minute is refused.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / rotation_slot_half_open_adjacency_allowed_overlap_rejected"
          rationale: |
            That instance creates the adjacent slot successfully and the one-minute overlap unsuccessfully
            for the same holder, asserting ERR_ROTATION_SLOT_OVERLAP only for the latter.

      - name: device_turnaround_conflict_blocks_a_second_case_on_the_same_machine
        claim_type: violation_to_error
        grounds:
          - validations[priority=68]
          - errors.ERR_DEVICE_TURNAROUND_CONFLICT
          - calculations.device_reservation_ledger
        distinguishing_aspect: |
          A machine already held by another live case may only be re-reserved for a case whose window
          clears the incumbent's by more than the turnaround buffer, on either side.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / device_turnaround_buffer_rejects_gap_of_exactly_ninety_minutes"
          rationale: |
            That instance asserts ERR_DEVICE_TURNAROUND_CONFLICT for gaps of 89 and exactly 90 minutes and
            a successful configuration at 91 minutes, on the same primary machine.

      - name: concurrent_case_capacity_is_an_aggregate_over_intersecting_cases
        claim_type: aggregate_validation
        grounds:
          - validations[priority=69]
          - errors.ERR_PERFUSIONIST_CONCURRENT_CASE_LIMIT
          - calculations.device_reservation_ledger.constants.MAX_CONCURRENT_STAFFED_CASES
        distinguishing_aspect: |
          Each individual assignment is legal, but the third intersecting case for the same perfusionist
          exceeds MAX_CONCURRENT_STAFFED_CASES and is refused with no accrual leaking.
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / perfusionist_aggregate_concurrent_case_capacity_rejects_third_overlap"
          rationale: |
            That instance assigns two intersecting cases successfully, asserts the third answers
            ERR_PERFUSIONIST_CONCURRENT_CASE_LIMIT with the contract ledger unchanged, and then places the
            third case with a second perfusionist.

  - section: endpoints
    instances:
      - name: contract_rate_update_applies_forward_only_and_never_reprices_accruals
        claim_type: standard_crud
        grounds:
          - endpoints[PUT /hospital-contracts/{id}]
          - entities.HospitalContract.fields.per_case_fee_cents
          - entities.HospitalContract.fields.accrued_case_fee_cents
          - calculations.case_fee_settlement
        distinguishing_aspect: |
          The update writes the new commercial terms and bumps the contract version, yet the already
          accrued case keeps the fee it was priced at while the next assignment prices at the new rate -
          an implementation that recomputes accruals on update shows 500000 on the first case.
        test_recipe:
          setup:
            - "LEAN BASE chain through assign-perfusionist, so case1 is STAFFED with provisional_fee_cents 400000 and the contract has accrued 400000 across one case; the contract's version is then re-read so the update can quote it."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
