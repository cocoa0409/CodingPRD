            - call: "POST /installations/damage-claims/${claim_id}/review"
              payload: { notes: "re-scored on plant dispute" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claim_id}/adjudicate"
              payload: { allocation_basis: "EVIDENCE" }
              as: ClaimsAdjuster
          assert:
            - "trigger step 1 returns HTTP 200 with data.status == DISPUTED and data.dispute_round == 1"
            - "trigger step 2 returns HTTP 200 with data.status == UNDER_REVIEW (the cycle re-entry)"
            - "trigger step 3 returns HTTP 200; approved_amount_cents == 90000 (round_half_up(100000 * 0.90))"
            - "plant_charge_cents == 22500, hauler_charge_cents == 67500, installer_charge_cents == 0 (points 1/3/0 of 4, exact, no remainder cents)"
            - "the three charges sum to 90000 exactly"
            - "Plant.${plant_id}.chargeback_balance_cents == 22500 and status == ACTIVE (below PLANT_PROBATION_THRESHOLD_CENTS 750000)"
            - "Hauler.${hauler_id}.chargeback_balance_cents == 67500 and status == ACTIVE (below HAULER_SUSPENSION_THRESHOLD_CENTS 500000)"
            - "SetCrew.${crew_id}.chargeback_balance_cents == 0"
            - "negative probe: trigger step 1 sent as ClaimsAdjuster returns HTTP 403 ERR_UNAUTHORIZED - the adjuster is barred from dispute"
            - "negative probe: trigger step 2 sent as TransportManager returns HTTP 403 ERR_UNAUTHORIZED"
            - "negative probe: trigger step 3 sent as PlantDispatcher returns HTTP 403 ERR_UNAUTHORIZED"
            - "negative probe: POST /installations/damage-claims/${claim_id}/reverse as SetCrewLead returns HTTP 403 ERR_UNAUTHORIZED"
            - "negative probe: POST /installations/damage-claims as InstallationInspector, PermitDesk or NetworkAdmin returns HTTP 403 ERR_UNAUTHORIZED - claim opening is restricted to the three named parties plus the adjuster"
            - "positive: the dispute is accepted from PlantDispatcher even though §1.4 priority 6 deliberately does NOT list the dispute endpoint, so party scoping on dispute is by role, not by X-User-ID ownership"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_set_job_create_412_on_stale_order_version_and_self_advancing_parent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[set-job-create-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
          - endpoints[POST /installations/set-jobs]
        distinguishing_aspect: |
          Exercises §1.2.1 rule set-job-create-stale-order on its declared
          write_endpoint and occ_field, and adds the case the layer's own description
          points at: the successful write ITSELF advances InstallationOrder.version,
          so replaying the same (just-accepted) expected_order_version to book a
          second job is rejected 412 - a client cannot supersede the booking it
          created without re-reading. Re-reading yields a version that works and the
          first job then moves to SUPERSEDED.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant, one SetCrew with daily_capacity 2, a two-section AZ order and both floors declared"
            - "the order version is read AFTER both sections but BEFORE the site, and the site creation then advances it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-021" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-94", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 2 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 3260", section_count: 2, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 2, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000, mates_to_section_id: "${a1_id}" }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { a2_id: $.data.id }
            - call: "GET /installations/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { order_v_stale: $.data.version }
            - call: "POST /installations/sites"
              payload: { order_id: "${order_id}", pad_type: "CONCRETE_RUNNER", pier_plan_ref: "PP-3260-A", pier_count: 12, utility_water: true, utility_sewer: true, utility_electric: true }
              as: NetworkAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v_stale}" }
              as: NetworkAdmin
            - call: "GET /installations/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { order_v_fresh: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 480000, expected_order_version: "${order_v_fresh}" }
              as: NetworkAdmin
              captures: { job1_id: $.data.id }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 495000, expected_order_version: "${order_v_fresh}" }
              as: NetworkAdmin
            - call: "GET /installations/orders/${order_id}"
              payload: {}
              as: NetworkAdmin
              captures: { order_v_fresh2: $.data.version }
            - call: "POST /installations/set-jobs"
              payload: { order_id: "${order_id}", set_crew_id: "${crew_id}", scheduled_start_date: "2026-08-10", scheduled_end_date: "2026-08-11", labor_base_cents: 495000, expected_order_version: "${order_v_fresh2}" }
              as: NetworkAdmin
              captures: { job2_id: $.data.id }
          assert:
            - "trigger step 1 returns HTTP 412 with error_id ERR_STALE_ORDER_VERSION (the site creation had advanced the order past ${order_v_stale})"
            - "after trigger step 1: zero SetJob rows exist for order ${order_id}"
            - "trigger step 2: ${order_v_fresh} == ${order_v_stale} + 1 (exactly one intervening write: the site)"
            - "trigger step 3 returns HTTP 201 with data.progress_status == SCHEDULED and data.scope_status == SCOPE_PENDING"
            - "trigger step 4 returns HTTP 412 with error_id ERR_STALE_ORDER_VERSION - the accepted step-3 write advanced the order itself, so replaying the same version fails"
            - "after trigger step 4: SetJob.${job1_id}.progress_status == SCHEDULED (the rejected booking superseded nothing)"
            - "trigger step 5: ${order_v_fresh2} == ${order_v_fresh} + 1"
            - "trigger step 6 returns HTTP 201; SetJob.${job1_id}.progress_status == SUPERSEDED and SetJob.${job2_id}.progress_status == SCHEDULED"
            - "InstallationOrder.${order_id}.version increased by exactly 1 for each of the two accepted set-job writes and by 0 for each 412"

      - name: occ_permit_create_412_on_stale_section_version_and_supersession
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[permit-create-stale-section]
          - errors[ERR_STALE_SECTION_VERSION]
          - endpoints[POST /installations/permits]
          - state_machines.TransportPermit.REQUESTED_to_SUPERSEDED
        distinguishing_aspect: |
          Exercises §1.2.1 rule permit-create-stale-section on its declared
          write_endpoint and occ_field. The version captured at measure time is
          invalidated by release, so the first permit request with it is 412; the
          post-release version works; and because permit creation itself increments
          HomeSection.version, replaying that same version to file a superseding
          permit is 412 as well. Only after a re-read does the second permit land,
          retiring the first to SUPERSEDED with its paid fee frozen.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant and a one-section AZ order whose 168 x 150 in floor is measured (version captured) and then released (version captured again)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-022" }
              as: NetworkAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plant_id}", dealer_name: "Valley Homes", home_model: "Titan 1668", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { order_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${order_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /installations/sections/${sec_id}/measure"
              payload: { measured_width_in: 168, measured_height_in: 150 }
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_v_measure: $.data.version }
            - call: "POST /installations/sections/${sec_id}/release"
              payload: {}
              as: PlantDispatcher
              as_user_id: "${plant_id}"
              captures: { sec_v_release: $.data.version }
          trigger:
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${sec_v_measure}", night_move: false }
              as: PermitDesk
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 1, expected_section_version: "${sec_v_release}", night_move: false }
              as: PermitDesk
              captures: { permit1_id: $.data.id }
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 2, expected_section_version: "${sec_v_release}", night_move: false }
              as: PermitDesk
            - call: "GET /installations/sections/${sec_id}"
              payload: {}
              as: PermitDesk
              captures: { sec_v_now: $.data.version }
            - call: "POST /installations/permits"
              payload: { section_id: "${sec_id}", state_code: "AZ", planned_leg_count: 2, expected_section_version: "${sec_v_now}", night_move: false }
              as: PermitDesk
              captures: { permit2_id: $.data.id }
          assert:
            - "trigger step 1 returns HTTP 412 with error_id ERR_STALE_SECTION_VERSION (release advanced the section past ${sec_v_measure})"
            - "trigger step 2: ${sec_v_release} == ${sec_v_measure} + 1 and the call returns HTTP 201 with data.status == REQUESTED"
            - "trigger step 3 returns HTTP 412 with error_id ERR_STALE_SECTION_VERSION - permit creation increments HomeSection.version, so the version that just worked is already stale"
            - "after trigger step 3: TransportPermit.${permit1_id}.status == REQUESTED (nothing was superseded)"
            - "trigger step 4: ${sec_v_now} == ${sec_v_release} + 1 (exactly one increment from the accepted permit)"
            - "trigger step 5 returns HTTP 201; TransportPermit.${permit1_id}.status == SUPERSEDED and TransportPermit.${permit2_id}.status == REQUESTED"
            - "HomeSection.${sec_id}.version == ${sec_v_now} + 1 after trigger step 5, and unchanged across both 412s"

      - name: plant_probation_threshold_at_exactly_750000_and_one_cent_short
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.party_chargeback_ledger
          - calculations.damage_claim_allocation
          - entities.Plant.status
        distinguishing_aspect: |
          The plant probation threshold is probed from both sides with the haircut in
          the way: claimed 833333 haircuts to round_half_up(749999.7) = 750000, which
          is EXACTLY PLANT_PROBATION_THRESHOLD_CENTS and therefore PROBATION (the
          refresh is >=), while claimed 833332 haircuts to round_half_up(749998.8) =
          749999 - one cent short - and the second plant stays ACTIVE. A reversal on
          the first plant drops it back to ACTIVE, showing the threshold trigger is
          re-evaluated on decrease, not latched.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "two AZ plants, one ACTIVE AZ hauler, one licensed SetCrew"
            - "one order and one declared floor per plant"
            - "one PLANT_QC-stage non-blocking claim per order, reviewed: 833333 cents against plant A and 833332 cents against plant B"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /installations/plants"
              payload: { name: "Champion Chandler", state_code: "AZ", hud_plant_code: "AZ-023" }
              as: NetworkAdmin
              captures: { plantA_id: $.data.id }
            - call: "POST /installations/plants"
              payload: { name: "Champion Yuma", state_code: "AZ", hud_plant_code: "AZ-024" }
              as: NetworkAdmin
              captures: { plantB_id: $.data.id }
            - call: "POST /installations/haulers"
              payload: { name: "Desert Toter", dot_number: "DOT-771010", insurance_expiry_date: "2027-01-31", endorsed_states: ["AZ"] }
              as: NetworkAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /installations/set-crews"
              payload: { company_name: "Sonoran Set", hud_installer_license_no: "AZ-INST-95", license_state: "AZ", license_expiry_date: "2027-06-30", daily_capacity: 1 }
              as: NetworkAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plantA_id}", dealer_name: "Valley Homes", home_model: "Titan 1668", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { orderA_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${orderA_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000 }
              as: PlantDispatcher
              as_user_id: "${plantA_id}"
              captures: { secA_id: $.data.id }
            - call: "POST /installations/orders"
              payload: { plant_id: "${plantB_id}", dealer_name: "Mesa Homes", home_model: "Titan 1668", section_count: 1, destination_state: "AZ", wind_zone: "I" }
              as: NetworkAdmin
              captures: { orderB_id: $.data.id }
            - call: "POST /installations/sections"
              payload: { order_id: "${orderB_id}", section_index: 1, declared_width_in: 168, declared_height_in: 150, declared_length_in: 744, declared_weight_lb: 23000 }
              as: PlantDispatcher
              as_user_id: "${plantB_id}"
              captures: { secB_id: $.data.id }
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${orderA_id}", section_id: "${secA_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "PLANT_QC", claimed_amount_cents: 833333, blocks_set: false, plant_evidence_points: 1, hauler_evidence_points: 0, installer_evidence_points: 0 }
              as: ClaimsAdjuster
              captures: { claimA_id: $.data.id }
            - call: "POST /installations/damage-claims/${claimA_id}/review"
              payload: { notes: "plant QC miss, sidewall out of square" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims"
              payload: { order_id: "${orderB_id}", section_id: "${secB_id}", hauler_id: "${hauler_id}", set_crew_id: "${crew_id}", discovered_stage: "PLANT_QC", claimed_amount_cents: 833332, blocks_set: false, plant_evidence_points: 1, hauler_evidence_points: 0, installer_evidence_points: 0 }
              as: ClaimsAdjuster
              captures: { claimB_id: $.data.id }
            - call: "POST /installations/damage-claims/${claimB_id}/review"
              payload: { notes: "plant QC miss, one cent short of probation" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /installations/damage-claims/${claimA_id}/adjudicate"
              payload: { allocation_basis: "STAGE" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claimB_id}/adjudicate"
              payload: { allocation_basis: "STAGE" }
              as: ClaimsAdjuster
            - call: "POST /installations/damage-claims/${claimA_id}/reverse"
              payload: { reason_code: "NEW_EVIDENCE" }
              as: ClaimsAdjuster
          assert:
            - "after trigger step 1: DamageClaim.${claimA_id}.approved_amount_cents == 750000 (round_half_up(833333 * 0.90) = round_half_up(749999.7))"
            - "after trigger step 1: Plant.${plantA_id}.chargeback_balance_cents == 750000 and status == PROBATION (>= threshold is inclusive)"
            - "after trigger step 2: DamageClaim.${claimB_id}.approved_amount_cents == 749999 (round_half_up(833332 * 0.90) = round_half_up(749998.8))"
            - "after trigger step 2: Plant.${plantB_id}.chargeback_balance_cents == 749999 and status == ACTIVE - one cent short of probation"
            - "after trigger step 2: Hauler.${hauler_id}.chargeback_balance_cents == 0 and SetCrew.${crew_id}.chargeback_balance_cents == 0 (STAGE PLANT_QC charges the plant only)"
            - "after trigger step 2: network_chargeback_cents == 1499999 == 750000 + 749999, matching the sum of approved_amount_cents over ADJUDICATED claims"
            - "after trigger step 3: Plant.${plantA_id}.chargeback_balance_cents == 0 and status == ACTIVE - the threshold trigger is recomputed on decrease, not latched"
            - "after trigger step 3: Plant.${plantB_id}.status == ACTIVE and network_chargeback_cents == 749999"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / permit_revoke_five_level_transport_cascade
          rationale: "That instance walks all five levels of the permit-revocation chain end-to-end and asserts every intermediate row, and claim_adjudicate_five_level_chargeback_cascade does the same for the claims chain, which is the whole content of this layer's claim."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_fee_provisional_vs_final_divergence
          rationale: "Both variant families are covered by §1.8: that instance proves the PROVISIONAL/FINAL fee delta and reconciliation, and damage_claim_stage_vs_evidence_allocation proves the STAGE/EVIDENCE divergence on identical claim data."

      - name: rate_threshold_reset_on_escort_minutes
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations.escort_reserved_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / escort_reserved_minutes_restored_to_zero_after_release
          rationale: "The escort-minutes arm of this layer is the reset case: that instance drives the crew over its daily ceiling and then releases the assignment, asserting the counter returns to zero and the crew to AVAILABLE."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_derived_fields_visible_in_the_writing_response
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model[immediate]
          - calculations.order_posture
          - calculations.site_readiness_evaluation
          - calculations.party_chargeback_ledger
        distinguishing_aspect: |
          Every derived value a write touches is visible in that write's OWN response
          body, not only on a later GET: the readiness-inspection response already
          carries readiness_status READY and the recomputed round, the claim response
          already carries the section hold's consequence, and the adjudicate response
          already carries the three charges. Each is then re-read through its GET and
