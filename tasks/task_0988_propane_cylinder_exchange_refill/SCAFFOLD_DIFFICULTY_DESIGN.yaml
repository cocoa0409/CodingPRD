  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: cylinder_recert_due_to_certified_cycle
        grounds:
          - state_machines.Cylinder.CERTIFIED_to_RECERT_DUE
          - state_machines.Cylinder.RECERT_DUE_to_CERTIFIED
          - calculations.cylinder_certification_expiry
        distinguishing_aspect: |
          Entity = Cylinder: the cert dimension is cyclic (CERTIFIED ->
          RECERT_DUE on clock advance -> CERTIFIED on PASS recert) while the
          fill dimension evolves independently (parallel state dimensions on
          one row): the cylinder stays FULL throughout the cert cycle.
        test_recipe:
          setup:
            - "FULL fleet cylinder C with manufacture_date 2014-06-01 (initial expiry 2026-06-01); technician T (cert_level FULL)"
            - "Clock advanced to 2026-06-02 (past expiry)"
          setup_api_calls:
            - call: "POST /cylinders"
              payload: { serial_number: "FC-901", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2014-06-01", initial_fill: FULL }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", cert_level: FULL }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /cylinders/${c_id}"
              as: PlatformAdmin
              captures: { c_status_mid: $.data.cert_status }
          trigger:
            - call: "POST /certification-records"
              payload: { cylinder_id: "${c_id}", method: VISUAL, outcome: PASS }
              as: Technician
              as_user_id: "${t_id}"
              captures: { rec_new_exp: $.data.new_expires_on, rec_status: $.data.status }
            - call: "GET /cylinders/${c_id}"
              as: PlatformAdmin
              captures: { c_cert: $.data.cert_status, c_fill: $.data.fill_status, c_exp: $.data.certification_expires_on, c_on: $.data.certified_on }
          assert:
            - "mid-cycle Cylinder.cert_status == RECERT_DUE (clock past 2026-06-01 expiry)"
            - "CertificationRecord.status == RECORDED (PASS is immediately effective)"
            - "CertificationRecord.new_expires_on == 2031-06-02 (performed 2026-06-02 + VISUAL_RECERT_YEARS=5)"
            - "after recert Cylinder.cert_status == CERTIFIED (cycle closed)"
            - "Cylinder.certified_on == 2026-06-02 and cert_method_last == VISUAL"
            - "Cylinder.fill_status == FULL throughout (parallel dimension untouched by cert cycle)"

      - name: reconciliation_recount_revert_loop
        grounds:
          - state_machines.ReconciliationSession.OPEN_to_VARIANCE_FLAGGED
          - state_machines.ReconciliationSession.VARIANCE_FLAGGED_to_OPEN
          - state_machines.ReconciliationSession.OPEN_to_BALANCED
        distinguishing_aspect: |
          Entity = ReconciliationSession: revert loop OPEN -> VARIANCE_FLAGGED
          -> OPEN (recount) -> BALANCED; the first count flags on a cylinder-count
          variance (cash exact), proving the OR-composition of the flag rule,
          and recount must null the counted_* fields before the fresh count.
        test_recipe:
          setup:
            - "Site S with active policy, 1 FULL fleet cylinder, 1 EMPTY customer cylinder; one swap-with-return completed on 2026-05-01 (drawer cash 22705, cage 0 full / 1 empty)"
            - "Session for 2026-05-01 created after the sale"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Loop Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FL-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "CL-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { cc_id: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}", returned_cylinder_id: "${cc_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /exchange-orders/${o_id}/complete"
              payload: { payment_cash_cents: 2705 }
              as: SiteClerk
              as_user_id: "clerk-1"
            - call: "POST /reconciliation-sessions"
              payload: { site_id: "${s_id}", business_date: "2026-05-01" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 22705, counted_full_cylinders: 1, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { st1: $.data.status, fv1: $.data.full_variance, cv1: $.data.cash_variance_cents }
            - call: "POST /reconciliation-sessions/${rs_id}/recount"
              payload: {}
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { st2: $.data.status, cc2: $.data.counted_cash_cents }
            - call: "POST /reconciliation-sessions/${rs_id}/count"
              payload: { counted_cash_cents: 22705, counted_full_cylinders: 0, counted_empty_cylinders: 1 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { st3: $.data.status }
          assert:
            - "first count: status == VARIANCE_FLAGGED with cash_variance_cents == 0 and full_variance == 1 (count variance alone flags)"
            - "after recount: status == OPEN and counted_cash_cents == null (fields reset)"
            - "second count: status == BALANCED"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: leak_confirm_quarantine_chain
        grounds:
          - state_machines.LeakReport.REPORTED_to_CONFIRMED
          - state_machines.Cylinder.FULL_to_QUARANTINED
          - state_machines.ExchangeOrder.DRAFT_to_VOIDED
          - calculations.site_sales_posture
          - calculations.site_cage_counts
        distinguishing_aspect: |
          Depth-3+ chain from leak confirm: confirm -> quarantines site fleet
          cylinders (hop 1) -> site cage counts recompute (hop 2) ->
          restock_alert flips on the floor threshold (hop 3); a parallel chain
          confirm -> SALES_BLOCKED -> auto-VOID of the DRAFT order and OPEN
          refill ticket (hop 2') with void_reason=SAFETY.
        test_recipe:
          setup:
            - "Site S (par 12, floor 6) with active policy, 2 FULL + 1 EMPTY fleet cylinders in the cage, 1 EMPTY customer cylinder"
            - "One DRAFT exchange order and one OPEN refill ticket pending at the site"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Leak Site", cage_capacity_cylinders: 20, par_level_full: 12, commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /pricing-policies"
              payload: { site_id: "${s_id}", expected_site_version: "${s_v}", swap_price_cents: 2499, core_deposit_cents: 3500, tax_rate_bps: 825, refill_tier1_cents_per_lb: 349, refill_tier1_max_lbs: 15.00, refill_tier2_cents_per_lb: 299, effective_from: "2026-05-01" }
              as: PlatformAdmin
            - call: "POST /cylinders"
              payload: { serial_number: "FK-001", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { k1: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "FK-002", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: FULL, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { k2: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "FK-003", owner_kind: FLEET, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY, current_site_id: "${s_id}" }
              as: PlatformAdmin
              captures: { k3: $.data.id }
            - call: "POST /cylinders"
              payload: { serial_number: "CK-001", owner_kind: CUSTOMER, water_capacity_lbs: 47.60, tare_weight_lbs: 17.00, manufacture_date: "2020-01-15", initial_fill: EMPTY }
              as: SiteClerk
              captures: { ck: $.data.id }
            - call: "POST /exchange-orders"
              payload: { site_id: "${s_id}" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { o_id: $.data.id }
            - call: "POST /refill-tickets"
              payload: { site_id: "${s_id}", cylinder_id: "${ck}", pre_weight_lbs: 17.50 }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { t_id: $.data.id }
            - call: "POST /leak-reports"
              payload: { site_id: "${s_id}", severity: MAJOR, note: "smell at cage" }
              as: SiteClerk
              as_user_id: "clerk-1"
              captures: { lr_id: $.data.id }
          trigger:
            - call: "POST /leak-reports/${lr_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /sites/${s_id}"
              as: PlatformAdmin
              captures: { s_full: $.data.full_on_hand, s_empty: $.data.empty_on_hand, s_q: $.data.quarantined_on_hand, s_post: $.data.sales_posture, s_alert: $.data.restock_alert }
            - call: "GET /cylinders/${k1}"
              as: PlatformAdmin
              captures: { k1_fill: $.data.fill_status }
            - call: "GET /exchange-orders/${o_id}"
              as: PlatformAdmin
              captures: { o_st: $.data.status, o_vr: $.data.void_reason }
            - call: "GET /refill-tickets/${t_id}"
              as: PlatformAdmin
              captures: { t_st: $.data.status }
          assert:
            - "Cylinder.${k1}.fill_status == QUARANTINED (hop 1: confirm quarantined all site fleet)"
            - "HostSite.full_on_hand == 0 and empty_on_hand == 0 and quarantined_on_hand == 3 (hop 2: counts recompute)"
            - "HostSite.restock_alert == true (hop 3: 0 <= reorder_floor 6)"
            - "HostSite.sales_posture == SALES_BLOCKED (hop 2' trigger)"
            - "ExchangeOrder.${o_id}.status == VOIDED and void_reason == SAFETY (hop 2' effect)"
            - "RefillTicket.${t_id}.status == VOIDED (hop 2' effect)"

      - name: condemn_confirm_inventory_alert_chain
        grounds:
          - state_machines.CertificationRecord.PENDING_SECOND_to_CONFIRMED
          - state_machines.Cylinder.CERTIFIED_to_CONDEMNED
          - calculations.site_cage_counts
          - calculations.site_sales_posture
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (condemn confirm, not leak
          confirm): second-signature confirm -> cylinder cert_status=CONDEMNED
          (hop 1) -> CONDEMNED exclusion recomputes site full_on_hand from 7 to
          6 (hop 2) -> restock_alert flips false->true exactly at the inclusive
          floor (hop 3).
        test_recipe:
          setup:
            - "Site S (par 12, reorder_floor 6) with exactly 7 FULL fleet cylinders (restock_alert false); two FULL-cert-level technicians T1 and T2"
          setup_api_calls:
