      - name: enrollment_uniqueness_aggregate_capacity_one_over_open_ended_window
        grounds:
          - validations[priority=9.5]
          - errors[ERR_ENROLLMENT_ALREADY_DECLARED]
          - entities.Application.fields.status
        distinguishing_aspect: |
          Interval semantics: aggregate capacity-1 over an OPEN-ENDED window
          [enroll_time, ∞) (no terminal point) — DIFFERENT from instance 1's
          closed window. An applicant may have at most one Application in
          status ENROLLED forever. A second enroll attempt collides with the
          first's open-ended occupation → ERR_ENROLLMENT_ALREADY_DECLARED.
          Different resource (Application×Applicant aggregate over ENROLLED
          status) and different geometric treatment.
        test_recipe:
          setup:
            - "Applicant A has app_en1 at school S_e1 ENROLLED (open-ended occupation)."
            - "Applicant A ALSO has app_en2 at school S_e2 in status ADMITTED, with a FINALIZED AidPackage. (Per scaffold, app_en2 would have been auto-cascaded to DECLINED by the enroll of app_en1, so to reach the 'second enroll attempt' precondition we need to manufacture a state where both an ENROLLED app and a separately-ADMITTED app exist. Reachable only via two enrolling attempts where the second is attempted after the cascade — but the cascade already DECLINEs siblings. Therefore the precondition for ERR_ENROLLMENT_ALREADY_DECLARED can only be triggered via the implementation's literal precondition check itself: in any reachable state, the second enroll call's target Application would itself have been DECLINED by the first enroll. We instead probe this validation by simulating: applicant A enrolls in app_en1; then we attempt to call /applications/${app_en1}/enroll AGAIN (now ENROLLED, the SM rejects via state precondition first — ERR_INVALID_STATE wins). To genuinely surface ERR_ENROLLMENT_ALREADY_DECLARED we structure the test against a second applicant... reframe: use a second Application of the SAME applicant that was admitted AFTER the first was enrolled. Reachable as follows: app_en1 → ADMITTED with aid FINALIZED → ENROLLED (cascade DECLINEs no others, since none). THEN a new Application app_en2 is created (Application can be created in DRAFT even while one is ENROLLED), submitted (sole essay still allowed — but applicant is LOCKED; status still allowed), reviewed, ADMITTED. Then app_en2 has an AidPackage FINALIZED. Now attempt enroll on app_en2 — this is the second enroll attempt, ERR_ENROLLMENT_ALREADY_DECLARED fires.)"
            - "applicant.submitted_application_count starts at 2 by the time of trigger."
