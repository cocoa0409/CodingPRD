        grounds:
          - entities.PickupSlot.fields.window_start
          - entities.PickupSlot.fields.window_end
          - entities.PickupSlot.fields.capacity
          - entities.PickupSlot.fields.booked_count
          - validations[priority=21]
        distinguishing_aspect: |
          PickupSlot interval semantics: aggregate-capacity occupation of a FIXED,
          pre-declared window [window_start, window_end). Up to `capacity` distinct orders
          may co-occupy the same window; the occupation that pushes booked_count to capacity
          is the last accepted, and the next is rejected ERR_SLOT_FULL — collision is by
          aggregate count over a fixed window, not by point adjacency.
        test_recipe:
          setup:
            - "Slot capacity 1 with fixed window; one order occupies it; a second order's occupation of the same window collides"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", curbside_spaces: 2, hold_window_minutes: 60 }
              as: PlatformAdmin
