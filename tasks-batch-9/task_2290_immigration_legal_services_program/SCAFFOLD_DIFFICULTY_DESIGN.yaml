            - call: "GET /case-matters/${m_id}"
              payload: {}
              as: ProgramDirector
              captures: { m_ver2: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${m_id}", representative_id: "${arep_id}", role_on_case: "LEAD", expected_matter_version: "${m_ver2}" }
              as: ProgramDirector
