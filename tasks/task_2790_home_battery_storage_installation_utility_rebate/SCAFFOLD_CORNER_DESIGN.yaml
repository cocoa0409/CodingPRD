scaffold_corner_design:
  - section: entities
    instances:
      - name: create_battery_system_returns_catalog_derived_capacity_and_default_statuses
        claim_type: creation
        grounds:
          - entities.BatterySystem.fields.usable_kwh
          - entities.BatterySystem.fields.continuous_kw
          - entities.BatterySystem.fields.build_status
          - entities.BatterySystem.fields.grid_status
          - endpoints[POST /battery-systems]
        distinguishing_aspect: |
          A 2-unit PWX_A creation returns 201 with usable_kwh 27.0 and continuous_kw 10.0 derived from MODEL_CATALOG, build_status DESIGN_DRAFT, grid_status NOT_APPLIED, warranty_status UNREGISTERED and version 1 — every declared default present in the creation response.
        test_recipe:
          setup:
            - "One ADVANCED installer certified for PWX_A/PWX_B/PWX_C exists."
            - "One site exists with an APPROVED essential-loads load calculation (required_continuous_kw 7.00)."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
          trigger:
            - call: "POST /battery-systems"
              payload: { site_id: "${site_id}", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_A", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 3200000 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "BatterySystem.${sys_id}.usable_kwh == 27.0"
            - "BatterySystem.${sys_id}.continuous_kw == 10.0"
            - "BatterySystem.${sys_id}.build_status == DESIGN_DRAFT"
            - "BatterySystem.${sys_id}.grid_status == NOT_APPLIED"
            - "BatterySystem.${sys_id}.warranty_status == UNREGISTERED"
            - "BatterySystem.${sys_id}.verified_capacity_kwh is null"
            - "BatterySystem.${sys_id}.expands_system_id is null"
            - "BatterySystem.${sys_id}.version == 1"
      - name: get_load_calculation_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /load-calculations/{loadCalculationId}]
          - entities.LoadCalculation.fields.connected_load_kw
          - entities.LoadCalculation.fields.required_continuous_kw
          - entities.LoadCalculation.fields.required_surge_kw
        distinguishing_aspect: |
          The single-resource read returns every stored input unchanged plus the three computed sizing fields 21.48 / 7.00 / 9.25 and status DRAFT — the read channel and the creation channel agree field for field.
        test_recipe:
          setup:
            - "One installer and one site exist."
            - "A DRAFT essential-loads load calculation exists for that site (lighting_area_sqft 2400, appliance_load_va 18000, heating_va 9600, cooling_va 7200, four essential circuits)."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
          trigger:
            - call: "GET /load-calculations/${lc_id}"
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
          assert:
            - "HTTP status == 200"
            - "LoadCalculation.${lc_id}.method == NEC_220_82_STANDARD"
            - "LoadCalculation.${lc_id}.backup_scope == ESSENTIAL_LOADS"
            - "LoadCalculation.${lc_id}.connected_load_kw == 21.48"
            - "LoadCalculation.${lc_id}.required_continuous_kw == 7.00"
            - "LoadCalculation.${lc_id}.required_surge_kw == 9.25"
            - "LoadCalculation.${lc_id}.status == DRAFT"
            - "LoadCalculation.${lc_id}.version == 1"
      - name: list_load_calculations_with_limit_and_offset_returns_pagination_metadata
        claim_type: listing
        grounds:
          - endpoints[GET /load-calculations]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three load calculations on one site, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, while limit 2 / offset 2 returns the remaining 1 row with has_more false — total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "One installer and one site exist."
            - "Three DRAFT whole-home load calculations exist for that site."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "WHOLE_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_a: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "WHOLE_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_b: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "WHOLE_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_c: $.data.id }
          trigger:
            - call: "GET /load-calculations"
              payload: { site_id: "${site_id}", limit: 2, offset: 0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "GET /load-calculations"
              payload: { site_id: "${site_id}", limit: 2, offset: 2 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
          assert:
            - "the first trigger returns HTTP status 200 with response_type == \"array\""
            - "the first trigger returns exactly 2 LoadCalculation rows with total_count == 3 and has_more == true"
            - "the second trigger returns exactly 1 LoadCalculation row with total_count == 3 and has_more == false"
            - "every returned row has site_id == ${site_id}"
      - name: get_unknown_battery_system_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_BATTERY_SYSTEM_NOT_FOUND]
          - validations[priority=30]
          - endpoints[GET /battery-systems/{batterySystemId}]
        distinguishing_aspect: |
          A well-formed id that matches no row returns 404 ERR_BATTERY_SYSTEM_NOT_FOUND in the error envelope shape, not an empty 200 object.
        test_recipe:
          setup:
            - "One installer and one site exist; no battery system has been created."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /battery-systems/11111111-1111-1111-1111-111111111111"
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_BATTERY_SYSTEM_NOT_FOUND"
            - "response_type == \"error\""
            - "the response data carries both error_id and message"
      - name: create_site_with_missing_required_postal_code_returns_invalid_request
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=35]
          - endpoints[POST /sites]
          - entities.Site.fields.postal_code
        distinguishing_aspect: |
          postal_code has source input and no default, so omitting it returns 400 ERR_INVALID_REQUEST and no Site row is created — the field is required, not silently defaulted.
        test_recipe:
          setup:
            - "One installer exists; no site has been created."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "no Site row exists after the trigger"
      - name: omitting_optional_inputs_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Site.fields.existing_pv_kw_dc
          - entities.LoadCalculation.fields.essential_circuits
          - entities.LoadCalculation.fields.measured_peak_kw
          - entities.LoadCalculation.fields.revision_round_count
        distinguishing_aspect: |
          Omitting existing_pv_kw_dc yields 0, and omitting measured_peak_kw / essential_circuits on a whole-home standard calculation yields null and [] respectively while status defaults to DRAFT and revision_round_count to 0 — each declared default is applied, none left null.
        test_recipe:
          setup:
            - "One installer exists."
            - "A site is created without existing_pv_kw_dc."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "WHOLE_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_def: $.data.id }
          assert:
            - "Site.${site_id}.existing_pv_kw_dc == 0"
            - "LoadCalculation.${lc_def}.measured_peak_kw is null"
            - "LoadCalculation.${lc_def}.essential_circuits == []"
            - "LoadCalculation.${lc_def}.status == DRAFT"
            - "LoadCalculation.${lc_def}.revision_round_count == 0"
            - "LoadCalculation.${lc_def}.reviewer_notes is null"
            - "LoadCalculation.${lc_def}.connected_load_kw == 21.48"
      - name: create_battery_system_with_capacity_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.BatterySystem.fields.usable_kwh
          - entities.BatterySystem.fields.continuous_kw
          - endpoints[POST /battery-systems]
        distinguishing_aspect: |
          usable_kwh and continuous_kw are source computed, so client-supplied values of 99.0 are discarded and the catalog-derived 27.0 / 10.0 are stored instead.
        test_recipe:
          setup:
            - "One installer and one site with an APPROVED load calculation exist."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
          trigger:
            - call: "POST /battery-systems"
              payload: { site_id: "${site_id}", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_A", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 3200000, usable_kwh: 99.0, continuous_kw: 99.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_x: $.data.id }
          assert:
            - "BatterySystem.${sys_x}.usable_kwh == 27.0"
            - "BatterySystem.${sys_x}.continuous_kw == 10.0"
            - "BatterySystem.${sys_x}.usable_kwh != 99.0"
      - name: create_site_with_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Site.common_fields
          - endpoints[POST /sites]
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-generated: a payload that supplies id and version 77 is stored with a server-minted id and version 1.
        test_recipe:
          setup:
            - "One installer exists."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
          trigger:
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", id: "33333333-3333-3333-3333-333333333333", version: 77 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_sys: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Site.${site_sys}.version == 1"
            - "Site.${site_sys}.id != \"33333333-3333-3333-3333-333333333333\""
            - "Site.${site_sys}.created_at and Site.${site_sys}.updated_at are both present"
      - name: create_load_calculation_with_invalid_enum_backup_scope_rejected
        claim_type: type_constraints
        grounds:
          - entities.LoadCalculation.fields.backup_scope
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=35]
        distinguishing_aspect: |
          backup_scope is constrained to {WHOLE_HOME, ESSENTIAL_LOADS}, so PARTIAL_HOME returns 400 ERR_INVALID_REQUEST rather than being stored as an unknown enum member.
        test_recipe:
          setup:
            - "One installer and one site exist."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "PARTIAL_HOME", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /load-calculations?site_id=${site_id} returns an empty array"
      - name: create_battery_system_with_unknown_site_returns_not_found
        claim_type: parent_relationships
        grounds:
          - errors[ERR_SITE_NOT_FOUND]
          - validations[priority=30]
          - entities.BatterySystem.fields.site_id
        distinguishing_aspect: |
          The FK input site_id is resolved before any business rule, so an unknown site id returns 404 ERR_SITE_NOT_FOUND even though the referenced load calculation is APPROVED.
        test_recipe:
          setup:
            - "One installer and one site with an APPROVED load calculation exist."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
          trigger:
            - call: "POST /battery-systems"
              payload: { site_id: "22222222-2222-2222-2222-222222222222", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_A", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 3200000 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_SITE_NOT_FOUND"
            - "GET /battery-systems?load_calculation_id=${lc_id} returns an empty array"
      - name: flat_topology_permit_creation_with_unknown_system_returns_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.Permit.fields.battery_system_id
          - errors[ERR_BATTERY_SYSTEM_NOT_FOUND]
        distinguishing_aspect: |
