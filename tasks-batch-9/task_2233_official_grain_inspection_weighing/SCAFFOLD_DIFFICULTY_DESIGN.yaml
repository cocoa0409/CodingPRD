  - rule_id: boundary_precision_check
    rule_summary: "A rounding or counting boundary where the value exactly at the boundary must resolve one specific way."
    instances:
      - name: moisture_round_half_up_at_14_045_flips_grade_and_limiting_factor
        mechanism: |
          Official factors are rounded to 1 decimal with round_half_up BEFORE the table comparison, so
          a moisture reading of 14.04 rounds to 14.0 and clears the US_NO_1 limit while 14.05 rounds to
          14.1 and fails it. Two otherwise identical CORN lots therefore receive different grades and
          different limiting factors from a difference of one hundredth of a percentage point, and
          banker's rounding (which would send 14.05 to 14.0) gives the wrong answer.
        distinguishing_aspect: "A decimal rounding-mode boundary on a measured input; the sibling boundary is an integer counting boundary on a derived resource."
        entities_involved: [GradingResult, InspectionRequest, Sample]
        grounds:
          - "calculations.grade_determination"
          - "entities.GradingResult.fields.rounded_factors"
          - "entities.GradingResult.fields.moisture_pct"
          - "entities.GradingResult.fields.limiting_factor"
        test_recipe:
          setup:
            - "A DELEGATED area with an APPROVED SAMPLING_DEVICE and an inspector holding SAMPLING and GRADING."
            - "Two CORN requests, each with its own SEALED sample of 2 portions, identical in every factor except moisture."
            - "The first determination (moisture 14.04) is already recorded; the second (14.05) is the trigger."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-005", contact_email: "billing@prairie.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-7001", full_name: "T. Boone", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-K5", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-1404", declared_quantity_bushels: 4000, requested_services: ["GRADING"] }
              captures: { req_low: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_low}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-1404", portions_count: 2 }
              captures: { smp_low: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req_low}", sample_id: "${smp_low}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 14.04, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
              captures: { gr_low: "$.data.id", grade_low: "$.data.assigned_grade" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-1405", declared_quantity_bushels: 4000, requested_services: ["GRADING"] }
              captures: { req_high: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req_high}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-1405", portions_count: 2 }
              captures: { smp_high: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req_high}", sample_id: "${smp_high}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 14.05, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
              captures: { gr_high: "$.data.id" }
          assert:
            - "The 14.04 result has rounded_factors.moisture_pct == 14.0, assigned_grade == US_NO_1, limiting_factor == NONE"
            - "201; the 14.05 result has rounded_factors.moisture_pct == 14.1, assigned_grade == US_NO_2, limiting_factor == MOISTURE"
            - "Test weight exactly at the US_NO_1 minimum (56.0) and heat damage exactly at the limit (0.1) both PASS — limits are inclusive"
            - "moisture_pct is stored unrounded on both rows (14.04 and 14.05); only rounded_factors is rounded"
            - "Both requests are in grading_status GRADED"
        expected_failure_mode_if_naive: "round-half-even sends 14.05 to 14.0 and grades the second lot US_NO_1; comparing unrounded values grades the FIRST lot US_NO_2 because 14.04 > 14.0."

      - name: last_sample_portion_exhaustion_at_exactly_zero_available
        mechanism: |
          Portion accounting is an integer boundary: a sample split into exactly one portion has
          portions_available 1, the grading determination consumes it, and the sample flips to
          integrity_status CONSUMED with portions_available exactly 0. The next analysis must fail on
          the portion count (ERR_SAMPLE_PORTIONS_EXHAUSTED, priority 11), NOT on integrity — a consumed
          sample is still officially intact, only BROKEN and EXPIRED disqualify it. The at-boundary case
          (available exactly 1) must succeed and the below-boundary case (0) must fail.
        distinguishing_aspect: "An integer resource-counting boundary whose off-by-one determines WHICH error surfaces; the sibling boundary is a decimal rounding mode."
        entities_involved: [Sample, GradingResult, ProteinAnalysis, Equipment]
        grounds:
          - "entities.Sample.fields.portions_available"
          - "state_machines.Sample.integrity_status.SEALED_to_CONSUMED"
          - "validations[priority=11]"
          - "errors[ERR_SAMPLE_PORTIONS_EXHAUSTED]"
          - "errors[ERR_SAMPLE_INTEGRITY_BROKEN]"
        test_recipe:
          setup:
            - "A DESIGNATED area with an APPROVED SAMPLING_DEVICE and an APPROVED PROTEIN_INSTRUMENT certified into 2027."
            - "A SOYBEANS request with GRADING and PROTEIN requested and a sample split into exactly one portion."
            - "The grading determination has consumed that portion, leaving portions_available 0 and integrity_status CONSUMED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-007", contact_email: "ops@delta.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-7002", full_name: "P. Analyst", endorsements: ["SAMPLING", "GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-Z1", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-Z1", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "SOYBEANS", point_of_service: "LOADING", lot_identifier: "LOT-ONE", declared_quantity_bushels: 2000, requested_services: ["GRADING", "PROTEIN"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-ONE", portions_count: 1 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 55.0, moisture_pct: 12.95, damaged_total_pct: 2.5, heat_damaged_pct: 0.3, foreign_material_pct: 1.4 }
              captures: { gr: "$.data.id" }
          trigger:
            - call: POST /grain-inspection/protein-analyses
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", instrument_id: "${nir}", inspector_id: "${insp}", protein_pct_as_is: 34.60, instrument_moisture_pct: 12.80 }
              captures: { err: "$.data.error_id" }
          assert:
            - "The grading determination at exactly one available portion SUCCEEDED and returned assigned_grade == US_NO_2, limiting_factor == TEST_WEIGHT (soybean table)"
            - "GET /grain-inspection/samples/${smp} -> portions_count == 1, portions_consumed == 1, portions_retained == 0, portions_available == 0, integrity_status == CONSUMED"
            - "422 ERR_SAMPLE_PORTIONS_EXHAUSTED on the trigger"
            - "The error is NOT ERR_SAMPLE_INTEGRITY_BROKEN: CONSUMED is an acceptable integrity state and only BROKEN or EXPIRED would raise that code"
            - "POST /grain-inspection/samples/${smp}/break-seal then a further analysis attempt -> 409 ERR_SAMPLE_INTEGRITY_BROKEN, confirming the two codes are distinguishable at the same portion count"
        expected_failure_mode_if_naive: "Treating CONSUMED as an integrity failure returns 409 and misdirects the office; allowing portions_available to go negative silently double-uses one portion."

  - rule_id: cross_entity_state_dependency
    rule_summary: "An operation on entity A is legal only because entity B is in a particular state; the same call fails when B moves."
    instances:
      - name: weight_certificate_legality_depends_on_area_supervision_flag_and_weighing_state
        mechanism: |
          Issuing a WEIGHT certificate reads TWO other entities: the WeighingRecord's status and the
          ServiceArea's supervision_required flag. In a DESIGNATED area with supervision_required true
          a record in WEIGHED is not enough — it must be countersigned into SUPERVISED by a DIFFERENT
          inspector holding SUPERVISION. In a DELEGATED area with the flag false the identical
          WEIGHED record certifies immediately. The legality of the call is therefore a function of a
          configuration field on a grandparent entity, not of the certificate payload.
        distinguishing_aspect: "The controlling state lives on a configuration flag of the service area and gates a same-entity state check; the sibling gates on the authority TYPE of the area plus the terminal state of an unrelated resource entity."
        entities_involved: [ServiceArea, WeighingRecord, Certificate, Inspector, InspectionRequest]
        grounds:
          - "entities.ServiceArea.fields.supervision_required"
          - "state_machines.InspectionRequest.weighing_status.WEIGHED_to_SUPERVISED"
          - "validations[priority=9]"
          - "errors[ERR_WEIGHING_SUPERVISION_REQUIRED]"
          - "errors[ERR_SELF_SUPERVISION_FORBIDDEN]"
        test_recipe:
          setup:
            - "A DELEGATED area with supervision_required false, an ACTIVE WEIGHING schedule, a certified scale and a WEIGHED record that has ALREADY produced an ISSUED WEIGHT certificate of 10000 cents."
            - "A DESIGNATED area with supervision_required true, an ACTIVE WEIGHING schedule, a certified scale, a weigher holding WEIGHING and a separate ACTIVE inspector holding SUPERVISION."
            - "The designated request has a WEIGHED (not yet countersigned) weighing record of 3609.27 net bushels."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
