            - "Batch.${b_id}.drawn_liters == 0.0"
            - "Batch.${b_id}.remaining_liters == 400.0"
            - "Batch.${b_id}.loss_liters == 0.0"
            - "Batch.${b_id}.pitched_liters == 400.0"
            - "Batch.${b_id}.ferment_stage == READY_TO_PACKAGE"
            - "no FinishedLot exists whose packaging_run_id is ${run_id}"

      - name: a_late_keg_return_still_conserves_every_deposit_dollar
        grounds:
          - conservation_invariants.keg_deposit_conservation
          - calculations.keg_deposit_settlement
          - state_machines.Keg.issue_on_deposit
          - state_machines.Keg.return_keg_good
          - entities.Account.fields.keg_deposit_balance
