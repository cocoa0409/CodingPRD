      - name: terminal_state_lockdown_voided_agreement_refuses_every_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PremiumFinanceAgreement.terminal_states
          - state_machines.PremiumFinanceAgreement.PENDING_VERIFICATION_to_VOID
          - validations.priority_11_ERR_AGREEMENT_STATE_INVALID
        distinguishing_aspect: |
          VOID is one of four declared terminal states and therefore has NO outbound edge at all.
          Four different triggers are aimed at a VOID note — submit, activate, void again and a
          payment — and every one must return ERR_AGREEMENT_STATE_INVALID (409). The payment attempt
          is the sharp one: POST /agreements/{id}/payments is a creation endpoint whose own §1.4 gate
          could plausibly be read as fiscal, so an implementation that only guards the transition
          endpoints will happily attach a Payment row to a dead note.
        test_recipe:
          setup:
            - "the canonical TX regime with an effective License; the 600k note submitted (PENDING_VERIFICATION) with one PENDING_VERIFICATION policy and no payments, then voided"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "TX", finance_charge_method: "ADD_ON", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 10, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { tl_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${tl_rule}/licenses"
              payload: { license_number: "PFC-TX-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Cascade Logistics Inc", mailing_state_code: "TX", email: "ap@cascade.example" }
              as: FinanceAnalyst
              captures: { tl_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { tl_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Meridian Casualty", naic_code: "10123", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { tl_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${tl_insured}", producer_agent_id: "${tl_agent}", state_rule_id: "${tl_rule}", down_payment_cents: 100000, service_fee_cents: 2000, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
