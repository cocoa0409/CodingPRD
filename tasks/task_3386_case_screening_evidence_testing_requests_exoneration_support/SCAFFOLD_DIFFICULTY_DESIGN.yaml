            - { call: "POST /intake-requests/${intake_id}/advance", payload: { event: "RECOMMEND", recommendation: "ACCEPT" }, as: IntakeSpecialist, as_user_id: "spec_1" }
            - call: "POST /intake-requests/${intake_id}/decide"
