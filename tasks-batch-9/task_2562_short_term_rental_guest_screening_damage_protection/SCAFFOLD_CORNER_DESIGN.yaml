              payload: { full_name: "Stale Stay Guest", email: "stalestay@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "8 Beach Street", city: "San Francisco", max_occupancy: 4, bedrooms: 2, nightly_rate_cents: 20000, protection_product: "DEPOSIT", deposit_amount_cents: 50000, waiver_nightly_fee_cents: 0, claim_ceiling_cents: 400000, event_policy: "EVENTS_PROHIBITED", turnover_buffer_nights: 1 }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "GET /rentals/properties/${p1}"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { p1v: $.data.version }
            - call: "POST /rentals/reservations"
              payload: { guest_id: "${g1}", property_id: "${p1}", check_in: "2026-08-10", check_out: "2026-08-12", guest_count: 2, event_declared: false, expected_property_version: "${p1v}" }
              as: Guest
              as_user_id: "${g1}"
              captures: { r1: $.data.id, rv_stale: $.data.version }
            - call: "POST /rentals/reservations/${r1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { rv_current: $.data.version, stay_now: $.data.stay_state }
          trigger:
            - call: "POST /rentals/damage-claims"
              payload: { reservation_id: "${r1}", claimed_amount_cents: 60000, description: "Filed against a stale reservation snapshot.", expected_reservation_version: "${rv_stale}" }
              as: Host
              as_user_id: "${h1}"
              captures: { err: $.data.error_id }
          assert:
            - "${rv_stale} == 1 and ${rv_current} == 2 and ${stay_now} == CONFIRMED"
            - "HTTP 412"
            - "${err} == ERR_RESERVATION_VERSION_STALE"
            - "${err} != ERR_STAY_NOT_COMPLETED — priority 7 fires before priority 11 even though the stay is not COMPLETED"
            - "GET /rentals/damage-claims filtered by reservation_id ${r1} reports total_count 0"
            - "Reservation.${r1}.version == 2 and Reservation.${r1}.deposit_state == HELD"

      - name: stale_guest_version_on_blocklist_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.blocklist-create-stale-guest
          - validations.priority_7_ERR_GUEST_VERSION_STALE
        distinguishing_aspect: "A payment-signal write re-scores the guest and moves Guest.version, so a ban submitted with the pre-signal version returns 412 ERR_GUEST_VERSION_STALE ahead of the grounds check at priority 41 — the unevidenced reason_code is never even reached."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE listing, and one guest captured at version 1 whose payment signal is then set to ADVERSE, moving the stored version on."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Corner Stays LLC", email: "occhost3@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/guests"
              payload: { full_name: "Stale Guest Version", email: "staleguest@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id, gv_stale: $.data.version }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "14 Harbor Way", city: "San Francisco", max_occupancy: 6, bedrooms: 3, nightly_rate_cents: 30000, protection_product: "WAIVER", deposit_amount_cents: 0, waiver_nightly_fee_cents: 3000, claim_ceiling_cents: 500000, event_policy: "EVENTS_ALLOWED", turnover_buffer_nights: 0 }
              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /rentals/guests/${g1}/payment-signals"
              payload: { payment_risk_signal: "ADVERSE", chargeback_count: 1 }
              as: PlatformAdmin
              captures: { gv_current: $.data.version, score_now: $.data.risk_score }
          trigger:
            - call: "POST /rentals/blocklist-entries"
              payload: { guest_id: "${g1}", scope: "PROPERTY", property_id: "${p1}", reason_code: "SUBSTANTIATED_INCIDENT", expected_guest_version: "${gv_stale}" }
              as: Host
              as_user_id: "${h1}"
              captures: { err: $.data.error_id }
          assert:
            - "${gv_stale} == 1 and ${gv_current} == 2 and ${score_now} == 70"
            - "HTTP 412"
            - "${err} == ERR_GUEST_VERSION_STALE"
            - "${err} != ERR_BLOCKLIST_GROUNDS_NOT_MET — priority 7 fires before priority 41, so the unevidenced reason_code is never evaluated"
            - "GET /rentals/blocklist-entries filtered by guest_id ${g1} reports total_count 0 and Guest.${g1}.active_blocklist_scope_count == 0"

      - name: adjudication_sweep_expires_accepted_document_and_rebands_risk
        claim_type: scheduled_actions
        grounds:
          - calculations.adjudication_sweep
          - endpoints.POST_rentals_ops_adjudication_sweep
          - calculations.guest_verification_state
        distinguishing_aspect: "The ops-run checkpoint is the only actor that can expire a document: nothing changes while the clock sits before expiry, and after the clock passes it the sweep reports documents_expired 1 and drives the guest VERIFIED/20/LOW -> VERIFICATION_EXPIRED/35/ELEVATED in one run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One guest with two ACCEPTED documents: a GOVERNMENT_ID expiring 2026-08-20T00:00:00Z and a SELFIE expiring 2030-01-01T00:00:00Z, so the guest is VERIFIED at risk_score 20 / LOW."
            - "The clock is then moved to 2026-09-01T00:00:00Z, past the government ID expiry only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Expiring Doc Guest", email: "expiring@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/identity-documents"
              payload: { guest_id: "${g1}", doc_type: "GOVERNMENT_ID", issuing_country: "US", document_ref: "blob/gov-exp", expires_on: "2026-08-20T00:00:00Z" }
              as: Guest
              as_user_id: "${g1}"
              captures: { d_gov: $.data.id }
            - call: "POST /rentals/identity-documents/${d_gov}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /rentals/identity-documents"
              payload: { guest_id: "${g1}", doc_type: "SELFIE", issuing_country: "US", document_ref: "blob/selfie-long", expires_on: "2030-01-01T00:00:00Z" }
              as: Guest
              as_user_id: "${g1}"
              captures: { d_selfie: $.data.id }
            - call: "POST /rentals/identity-documents/${d_selfie}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { state_verified: $.data.review_state }
            - call: "GET /rentals/guests/${g1}/risk-profile"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rentals/ops/adjudication-sweep"
              payload: {}
              as: PlatformAdmin
              captures: { swept_at: $.data.swept_at, expired: $.data.documents_expired }
          assert:
            - "${state_verified} == ACCEPTED and the pre-sweep risk-profile read reported verification_state VERIFIED, risk_score 20 and risk_tier LOW"
            - "HTTP 200 with ${expired} == 1 and ${swept_at} == 2026-09-01T00:00:00Z"
            - "IdentityDocument.${d_gov}.review_state == EXPIRED and IdentityDocument.${d_selfie}.review_state == ACCEPTED"
            - "Guest.${g1}.accepted_doc_count == 1 and Guest.${g1}.accepted_gov_id_count == 0"
            - "Guest.${g1}.verification_state == VERIFICATION_EXPIRED"
            - "Guest.${g1}.risk_score == 35 and Guest.${g1}.risk_tier == ELEVATED — the VERIFIED_CREDIT of -15 is withdrawn"
            - "The other counters are untouched: incidents_sla_breached 0, claims_denied_sla 0, claims_settled 0, claims_closed_denied 0, deposits_released 0, dispute_windows_expired 0"

      - name: document_acceptance_multi_level_cascade_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.IdentityDocument.PENDING_to_ACCEPTED
          - calculations.guest_verification_state
          - calculations.guest_risk_score
        excluded_because:
          difficulty_instance: transitive_cascade / document_acceptance_cascade_rebands_guest_risk_tier
          rationale: "The end-to-end chain from a single accept through verification_state, risk_score and risk_tier is asserted link by link in that §1.8 instance."

      - name: claim_recovery_dual_variant_corner
        claim_type: dual_variant_calculation
        grounds:
          - calculations.claim_recovery.variants.provisional_at_submission
          - calculations.claim_recovery.variants.final_at_decision
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_recovery_projection_diverges_from_final_after_layer_partly_consumed
          rationale: "Both variants and the exact 75000 delta on switching between them are asserted there."

  - section: consistency model
