      - name: clock_sweep_stale_check_flag_cascade
        grounds:
          - calculations.stale_check_sweep
          - state_machines.Payout.ISSUED_to_STALE_UNCASHED
          - state_machines.Participant.UNVERIFIED_to_FLAGGED_UNCASHED
        distinguishing_aspect: |
          Depth-2 chain with a different trigger than the sibling cascades
          (POST /_clock/set_current_utc, not a locate or a confirm): the clock
          reaching issued_at + 90 days flips the Payout ISSUED -> STALE_UNCASHED,
          and that flip itself flags the participant UNVERIFIED ->
          FLAGGED_UNCASHED. Exactly 90 days trips the >= threshold; 89 does not.
        test_recipe:
          setup:
            - "Case in DISTRIBUTION_IN_PROGRESS; participant (150000, vested 100%) elected LUMP_SUM_CHECK and the payout was issued at 2026-10-16T00:00:00Z. Participant locate_status UNVERIFIED."
