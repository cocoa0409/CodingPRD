              as: PlatformAdmin
              captures: { z: $.data.id }
            - call: "POST /sidewalk-segments"
              payload: { zone_id: "${z}", segment_code: "S1", segment_type: "WALKWAY", length_m: 320.0, measured_clearance_cm: 118.0, surface_grade_pct: 2.0, sightline_m: 40.0, pedestrian_flow_per_min: 5.0, curb_ramp_present: true }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "SURVEY" }
              as: PlatformAdmin
            - call: "POST /sidewalk-segments/${s1}/transitions"
              payload: { action: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /service-zones/${z}/permit-transitions"
              payload: { action: "ACTIVATE_PERMIT" }
              as: PlatformAdmin
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
              as: PlatformAdmin
              captures: { r: $.data.id }
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "STAGE" }
              as: FleetDispatcher
            - call: "POST /robots/${r}/duty-transitions"
              payload: { action: "MAKE_AVAILABLE" }
              as: FleetDispatcher
            - call: "POST /depot-bays"
              payload: { zone_id: "${z}", bay_code: "B1", bay_type: "CHARGE", power_kw: 22.0, state: "OPEN" }
              as: PlatformAdmin
              captures: { b: $.data.id, b_v: $.data.version }
            - call: "POST /bay-reservations"
              payload: { bay_id: "${b}", robot_id: "${r}", reservation_type: "CHARGE", window_start_utc: "2026-08-03T10:00:00.000Z", window_end_utc: "2026-08-03T11:00:00.000Z", expected_depot_bay_version: "${b_v}" }
              as: FleetDispatcher
              captures: { res: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T10:00:00.000Z" }
