scaffold_corner_design:
  - section: entities
    instances:
      - name: municipality_creation_returns_server_minted_identity_fields
        claim_type: creation
        grounds: ["entities.Municipality.fields.name", "entities.Municipality.fields.population_served", "entities.Municipality.fields.owns_treatment_works"]
        distinguishing_aspect: "A municipality created with the four input fields comes back with a server-minted uuid id, version 1, and the computed totals zeroed, so identity is never client-supplied."
        test_recipe:
          setup: ["empty database", "logical clock at the default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_new: $.data.id }
          assert:
            - "Municipality.${mun_new}.version == 1"
            - "Municipality.${mun_new}.total_operator_penalty_cents == 0"
            - "Municipality.${mun_new}.benchmark_index_baseline == 0.0"
      - name: contract_creation_rejects_inverted_operating_window
        claim_type: type_constraints
        grounds: ["validations[priority=32]", "errors[ERR_INVALID_DATE_WINDOW]", entities.Contract.fields.contract_end_date]
        distinguishing_aspect: "A contract whose contract_end_date precedes contract_start_date is rejected with ERR_INVALID_DATE_WINDOW before any contract row is created."
        test_recipe:
          setup: ["one municipality"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
          trigger:
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2027-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
          assert:
            - "the response has data.error_id == 'ERR_INVALID_DATE_WINDOW'"
            - "GET /water-om/municipalities/${mun_id}/contracts returns exactly 0 rows"
      - name: asset_creation_defaults_condition_score_and_band
        claim_type: defaults
        grounds: [entities.Asset.fields.condition_score, entities.Asset.fields.condition_band, entities.Asset.fields.status]
        distinguishing_aspect: "A newly registered asset with no assessment carries condition_score 100.0, condition_band EXCELLENT and status REGISTERED, so the defaults are system-applied rather than client-supplied."
        test_recipe:
          setup: ["one contract with one ACTIVE performance standard"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-101", asset_class: "PUMP", install_year: 2016, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_id: $.data.id }
          assert:
            - "Asset.${asset_id}.condition_score == 100.0"
            - "Asset.${asset_id}.condition_band == 'EXCELLENT'"
            - "Asset.${asset_id}.status == 'REGISTERED'"
      - name: work_order_expense_class_is_computed_and_ignores_client_input
        claim_type: computed_fields
        grounds: [entities.WorkOrder.fields.expense_class, calculations.expense_class_boundary]
        distinguishing_aspect: "The expense_class is a computed field: a client-supplied value in the create payload is neither accepted nor echoed, and the server's own classification is what the response carries."
        test_recipe:
          setup: ["one OPERATING contract with one in-service asset installed 2011 with a 15 year useful life"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-102", asset_class: "PUMP", install_year: 2011, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_id: $.data.id }
            - call: "POST /water-om/assets/${asset_id}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 55.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /water-om/asset-assessments/${asmt_id}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/freeze-baseline"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/commence-operating"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /water-om/assets/${asset_id}/work-orders"
              payload: { work_type: "CORRECTIVE", estimated_cost_cents: 3000000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.expense_class == 'CAPITAL_LIFE_EVENT'"
            - "WorkOrder.${wo_id}.actual_cost_cents == 0"
            - "WorkOrder.${wo_id}.status == 'DRAFT'"
      - name: employee_years_of_service_computed_from_hire_date
        claim_type: computed_fields
        grounds: [entities.Employee.fields.municipal_years_of_service, state_machines.Employee.MUNICIPAL_to_OFFERED]
        excluded_because:
          difficulty_instance: benefit_vesting_vs_tiered_band_from_running_total
          rationale: "The same computed field is asserted as the pinned input of the vesting tier in the named §1.8 instance."
  - section: state_machines
    instances:
      - name: contract_review_from_awarded_state_is_an_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.Contract.AWARDED_to_MOBILIZING, "validations[priority=22]", "errors[ERR_CONTRACT_INVALID_STATE]"]
        distinguishing_aspect: "An AWARDED contract has no reviews edge: the same endpoint that opens a review from OPERATING returns ERR_CONTRACT_INVALID_STATE with 409 and leaves the contract untouched."
        test_recipe:
          setup: ["one AWARDED contract with one ACTIVE performance standard"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "GET /water-om/contracts/${con_id}"
              payload: {}
              as: OperatorAdmin
              captures: { con_version: $.data.version }
          trigger:
            - call: "POST /water-om/contracts/${con_id}/reviews"
              payload: { expected_contract_version: "${con_version}", review_outcome: "OPEN" }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
          assert:
            - "the response has data.error_id == 'ERR_CONTRACT_INVALID_STATE'"
            - "Contract.${con_id}.status == 'AWARDED'"
            - "Contract.${con_id}.version == ${con_version}"
      - name: work_order_schedule_from_closed_state_is_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkOrder.VERIFIED_to_CLOSED, "validations[priority=27]", "validations[priority=49]", "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "CLOSED is a terminal state for a work order: a re-schedule request is refused with ERR_ALREADY_TERMINAL and the immutable closure fields keep their values."
        test_recipe:
          setup: ["one OPERATING contract with one in-service asset and one CLOSED corrective work order"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-103", asset_class: "PUMP", install_year: 2021, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_id: $.data.id }
            - call: "POST /water-om/assets/${asset_id}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 90.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /water-om/asset-assessments/${asmt_id}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/freeze-baseline"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/commence-operating"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/assets/${asset_id}/work-orders"
              payload: { work_type: "CORRECTIVE", estimated_cost_cents: 400000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /water-om/work-orders/${wo_id}/schedule"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/work-orders/${wo_id}/start"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/work-orders/${wo_id}/complete"
              payload: { labour_hours: 4.0, materials_cents: 300000, closure_narrative: "Replaced the pump mechanical seal and verified shaft alignment after reassembly." }
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/work-orders/${wo_id}/verify"
              payload: { condition_delta: 0.0 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-om/work-orders/${wo_id}/close"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
          trigger:
            - call: "POST /water-om/work-orders/${wo_id}/schedule"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          assert:
            - "the response has data.error_id == 'ERR_ALREADY_TERMINAL'"
            - "WorkOrder.${wo_id}.status == 'CLOSED'"
            - "WorkOrder.${wo_id}.actual_cost_cents == 360050"
      - name: contract_termination_cascades_employees_to_separated
        claim_type: side_effect_execution
        grounds: [state_machines.Contract.OPERATING_to_TERMINATED, state_machines.Employee.ACTIVE_to_SEPARATED, entities.Employee.fields.status]
        distinguishing_aspect: "A single termination call is a cross-entity cascade: every employee in TRANSFERRED, INDUCTION, ACTIVE, OFFERED or ACCEPTED moves to SEPARATED, and each employee's staffing commitment is re-evaluated as a consequence."
        test_recipe:
          setup: ["one OPERATING contract with one bound staffing commitment, one ACTIVE employee and one ACTIVE permit"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards/${std_id}/activate"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/staffing-commitments"
              payload: { role_code: "OPS-3", committed_fte: 1.0 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/staffing-commitments/${sc_id}/bind"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/employees"
              payload: { role_code: "OPS-3", full_name: "Dana Whitfield", municipal_hire_date: "2018-05-01T00:00:00Z", transfer_offer_fte: 1.0 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { emp_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/assets"
              payload: { asset_tag: "PMP-104", asset_class: "PUMP", install_year: 2019, useful_life_years: 15, criticality_rank: 1 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { asset_id: $.data.id }
            - call: "POST /water-om/assets/${asset_id}/baseline-assessments"
              payload: { assessed_at: "2026-05-01T00:00:00Z", assessed_score: 88.0, is_baseline: true, assessor_party: "OPERATOR" }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { asmt_id: $.data.id }
            - call: "POST /water-om/asset-assessments/${asmt_id}/accept"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/freeze-baseline"
              payload: {}
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
            - call: "POST /water-om/contracts/${con_id}/commence-operating"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/contracts/${con_id}/employees/${emp_id}/offer"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/employees/${emp_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /water-om/employees/${emp_id}/transfer"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/employees/${emp_id}/begin-induction"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
            - call: "POST /water-om/employees/${emp_id}/complete-induction"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          trigger:
            - call: "POST /water-om/contracts/${con_id}/terminate"
              payload: { termination_reason: "Material breach of the permit compliance standard." }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
          assert:
            - "Contract.${con_id}.status == 'TERMINATED'"
            - "Employee.${emp_id}.status == 'SEPARATED'"
            - "StaffingCommitment.${sc_id}.status == 'SHORTFALL'"
      - name: contract_mobilization_requires_an_active_standard
        claim_type: precondition_enforcement
        grounds: [state_machines.Contract.AWARDED_to_MOBILIZING, "errors[ERR_CONTRACT_INVALID_STATE]"]
        distinguishing_aspect: "Mobilization is refused while every performance standard is still DRAFT, demonstrating that the transition's precondition is enforced rather than merely documented."
        test_recipe:
          setup: ["one AWARDED contract with one DRAFT performance standard and one DRAFT staffing commitment"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
              as_user_id: "${mun_id}"
              captures: { con_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/performance-standards"
              payload: { code: "EFF-01", title: "Effluent ammonia", metric_type: "TREATMENT_EFFLUENT", criticality_weight: 0.5, threshold_value: 10.0, threshold_direction: "AT_MOST", breach_penalty_cents: 500000 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { std_id: $.data.id }
            - call: "POST /water-om/contracts/${con_id}/staffing-commitments"
              payload: { role_code: "OPS-3", committed_fte: 4.0 }
              as: OperatorAdmin
              as_user_id: "${con_id}"
              captures: { sc_id: $.data.id }
            - call: "POST /water-om/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-om/contracts/${con_id}/mobilize"
              payload: {}
              as: OperatorAdmin
              as_user_id: "${con_id}"
          assert:
            - "the response has data.error_id == 'ERR_CONTRACT_INVALID_STATE'"
            - "Contract.${con_id}.status == 'AWARDED'"
            - "StaffingCommitment.${sc_id}.status == 'DRAFT'"
  - section: calculations
    instances:
      - name: breach_score_severity_band_at_exact_deviation_ratio
        claim_type: correct_result
        grounds: ["calculations.breach_score", "state_machines.PerformanceMeasurement.RECORDED_to_ASSESSED"]
        distinguishing_aspect: "A measurement exactly at the 0.25 deviation ratio lands in the 0.60 severity band, so a criticality weight of 0.50 yields weighted_breach_score exactly 0.3000 rather than 0.0500."
        test_recipe:
          setup: ["one OPERATING contract with one ACTIVE standard of threshold 10.0 and weight 0.5, and one RECORDED breaching measurement of 12.5"]
          setup_api_calls:
            - call: "POST /water-om/municipalities"
              payload: { name: "Rivergate", state_code: "OH", population_served: 250000, owns_treatment_works: true }
              as: PlatformAdmin
              captures: { mun_id: $.data.id }
            - call: "POST /water-om/municipalities/${mun_id}/contracts"
              payload: { title: "Wastewater O&M", award_date: "2026-04-01T00:00:00Z", contract_start_date: "2026-05-01T00:00:00Z", contract_end_date: "2027-04-30T00:00:00Z", annual_fee_cents: 40000000, operator_penalty_share_pct: 0.45, benchmark_index_baseline: 0.0004 }
              as: MunicipalityAdmin
