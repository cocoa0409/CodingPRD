      - name: transfer_expiry_temporal_beats_insufficient_donor_units_fiscal
        grounds:
          - validations[priority:24]
          - validations[priority:33]
          - entities.TransferRecommendation.fields.expires_at
          - errors.ERR_TRANSFER_EXPIRED
          - errors.ERR_INSUFFICIENT_DONOR_UNITS
        distinguishing_aspect: |
          A third distinct error-category pair - business_temporal against business_fiscal - on one
          approve. The 12-unit recommendation aged past its expires_at of 2026-08-08 while a competing
          20-unit transfer out of the same donor was approved, dropping donor available_units from 30 to
          10. Both the expiry rule (24) and the donor sufficiency rule (33) are violated, and the expiry
          error must win; a create attempt at the same instant, which has no expiry check, proves the
          donor shortfall is real by returning ERR_INSUFFICIENT_DONOR_UNITS.
