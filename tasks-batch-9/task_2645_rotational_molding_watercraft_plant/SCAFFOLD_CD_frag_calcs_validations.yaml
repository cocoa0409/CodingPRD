              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /product-models/${pm}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { pm_v2: $.data.version }
            - call: "POST /warranty-claims/${clm1}/approve"
              payload: { expected_product_model_version: "${pm_v2}" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVY-2", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "second hull of the same delivery" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /customers/${cust}/reinstate"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVY-3", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "COSMETIC", storage_description: "gelcoat chalking" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clm3: $.data.id }
            - call: "GET /product-models/${pm}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the first approve fails 409 ERR_WARRANTY_RESERVE_EXHAUSTED — PAIR-4 member B in isolation. months_in_service is 12 (2026-08-01T12:00:00Z to 2027-08-01T12:00:00Z), coverage_pct == round((60 - 12) / 60 * 100, 2) == 80.00, pre_fee_gross_cents == round_half_up(400000 * 80.00 / 100 * 1.00) == 320000, the fee tier is chosen from that gross (320000 > 200000) so admin_fee_pct == 5.00 and admin_fee_cents == 16000, storage_deduction_cents == 0 under GUIDANCE_VERIFIED, and net_payout_cents == 320000 - 0 - 16000 == 304000, which exceeds warranty_reserve_cents 50000"
            - "the refused approve wrote nothing: PM-CVY still reads warranty_reserve_cents 50000, warranty_paid_cents 0 and an unchanged version, and CLM-CVY-1 is still UNDER_REVIEW with net_payout_cents null"
            - "POST /customers/${cust}/suspend returns 200 with status SUSPENDED and, by its own cascade, drives CLM-CVY-1 from UNDER_REVIEW to VOIDED with denial_reason APPROVAL_VOIDED and no reserve movement"
            - "the retried approve of CLM-CVY-1 — a request that violates rung 60 (customer SUSPENDED) and rung 76 (304000 > 50000) at once — returns 409 ERR_CLAIM_INVALID_STATE, because rung 43 sits above both: the PAIR-4 ordering is structurally unobservable on this endpoint, since the only way to make the customer non-ACTIVE also voids the claim"
            - "PAIR-4 member A is nevertheless reachable on the sibling endpoint: POST /warranty-claims for CLM-CVY-2 while the customer is SUSPENDED fails 409 ERR_CUSTOMER_NOT_ACTIVE, and no claim row is created"
            - "after reinstatement the same customer can file CLM-CVY-3 (201, SUBMITTED) — reinstate does not resurrect the VOIDED CLM-CVY-1, which stays VOIDED"
            - "the COSMETIC claim CLM-CVY-3 would price at round(400000 * 80.00 / 100 * 0.30) == 96000 gross, fee tier 8.00 (96000 <= 200000) == 7680 and net 88320, still above the 50000 reserve — the reserve gate does not care which claim type produced the payout"
            - "PM-CVY closes at warranty_reserve_cents 50000 and warranty_paid_cents 0: across one refused approve, one void cascade, one refused create and one reinstatement, warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents 50000 at every observation"

      # -----------------------------------------------------------------------
      # V8 — priority 38 (parallel-axis build-state guard) must be answered
      # before priority 82 (OCC on the warehouse), even though §1.2 happens to
      # LIST the OCC precondition earlier. §1.4 puts every OCC rung at 80+.
      # -----------------------------------------------------------------------
      - name: val_priority_ordering_unit_build_state_beats_stale_warehouse_version
        claim_type: "Priority Ordering"
        grounds:
          - validation_rules.priority_38
          - validation_rules.priority_82
          - errors.ERR_UNIT_INVALID_BUILD_STATE
          - errors.ERR_STALE_WAREHOUSE_VERSION
          - state_machines.FinishedUnit.logistics_status
          - endpoints.POST_/finished-units/{finished_unit_id}/store
        distinguishing_aspect: "One store request carrying BOTH an OUTFITTED (not yet SELLABLE) hull and a stale expected_warehouse_version must return 409 ERR_UNIT_INVALID_BUILD_STATE, and the identical stale version replayed after the hull is inspected must then return 412 ERR_STALE_WAREHOUSE_VERSION — the same body yields two different errors purely by the rung ordering."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The PM-CVW base: one 2-cavity mould, oven OV-CVW, bay CB-CVW, site WH-CVA (capacity 100.0000 in one zone Z-A), resin lot LOT-CVW, four technicians."
            - "Cycle CYC-CVW demoulded two hulls. fu1 was trimmed, outfitted and inspected to SELLABLE; fu2 was trimmed and outfitted and is OUTFITTED with inspection_verdict null."
            - "fu1 has been stored at WH-CVA, so the warehouse version captured before that store (wh_v1) is now one behind, and the site reads committed_cube_m3 1.0000."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvW_pm
            - *cvW_mold
            - *cvW_oven
            - *cvW_bay
            - *cvA_wh
            - *cvW_lot
            - *cvW_po
            - *cvW_release
            - *cvW_cycle
            - *cvW_charge
            - *cvB_clk_0900
            - *cvW_start
            - *cvB_clk_1000
            - *cvW_cool
            - *cvB_clk_1035
            - *cvW_demold
            - *cvW_units
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_get_wh1
            - *cvW_store1
          trigger:
            - call: "GET /finished-units/${fu2}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu2}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v_fresh: $.data.version }
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v_fresh}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "GET /finished-units/${fu2} reads build_status OUTFITTED and logistics_status UNALLOCATED before the first store attempt, and ${wh_v1} is exactly one less than the live Warehouse.version because fu1's store incremented it"
            - "the first store returns 409 ERR_UNIT_INVALID_BUILD_STATE — not 412 — even though expected_warehouse_version is provably stale; rung 38 is a parallel-axis guard evaluated long before the OCC rungs at 80+"
            - "note the audit point: §1.2's transition block LISTS the stale-warehouse precondition above the FROZEN and cap checks, but §1.4 assigns OCC priority 82 and states OCC is evaluated last; the §1.4 ladder is what this claim tests"
            - "after the inspect, fu2 reads build_status SELLABLE with inspection_verdict PASS (wall points 5.90..6.10 against wall_thickness_min_mm 4.50, cv well under 12.00, impact 120.00 >= 90.00, cosmetic grade A) — six measurement points satisfy rung 25"
            - "replaying the byte-identical store body now returns 412 ERR_STALE_WAREHOUSE_VERSION, which proves the OCC rung was violated all along in the first attempt and was merely out-ranked"
            - "the store with the freshly read version returns 200: fu2 becomes STORED in zone Z-A with is_zone_anchor false and stored_footprint_cube_m3 == round(1.0000 * 0.5000, 4) == 0.5000, because fu1 already anchors PM-CVW in that zone"
            - "the footprint summary reports committed_cube_m3 1.5000 (1.0000 anchor + 0.5000 nested), remaining_cube_m3 98.5000, utilization_pct == round(1.5000 / 100.0000 * 100, 2) == 1.50 and posture NORMAL"
            - "neither refused store advanced Warehouse.version: it moved exactly twice across the whole recipe, once per accepted store"

      # -----------------------------------------------------------------------
      # V9 — priority 51 (lot not qualified) must beat priority 72 (insufficient
      # mass) on POST /resin-charges; each rung is then shown firing alone.
      # -----------------------------------------------------------------------
      - name: val_priority_ordering_resin_lot_not_qualified_beats_resin_insufficient
        claim_type: "Priority Ordering"
        grounds:
          - validation_rules.priority_51
          - validation_rules.priority_72
          - errors.ERR_RESIN_LOT_NOT_QUALIFIED
          - errors.ERR_RESIN_INSUFFICIENT
          - calculations.qualified_resin_lot_count
          - calculations.resin_mass_ledger
          - endpoints.POST_/resin-charges
        distinguishing_aspect: "A 20.000 kg charge drawn from a 5.000 kg MDPE lot violates both rung 51 and rung 72 and must return 422 ERR_RESIN_LOT_NOT_QUALIFIED; the same charge from a qualified 5.000 kg lot returns 409 ERR_RESIN_INSUFFICIENT, and from a qualified 20.000 kg lot it succeeds by draining the lot to exactly 0.000."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVQ demands resin_grade HDPE_LINEAR, additive UV12, master colour SEAFOAM (max_color_delta_e 1.50) and a melt index inside [2.50, 6.00]; its 2-cavity mould MLD-CVQ-1 has nominal_charge_kg 20.000."
            - "Four lots exist, all colour SEAFOAM / delta 0.50 / additive UV12 / regrind 10.00 pct: LOT-CVQ-BAD is MDPE with 5.000 kg, LOT-CVQ-HOT is HDPE_LINEAR with melt_index 6.01 and 100.000 kg, LOT-CVQ-THIN is HDPE_LINEAR melt 4.00 with 5.000 kg, and LOT-CVQ-OK is HDPE_LINEAR melt 4.00 with 20.000 kg."
            - "ProductionOrder PO-CVQ (ordered_qty 2) is RELEASED — the qualified lot count is 2 (THIN and OK), so it reached READY_TO_SCHEDULE — and holds one SCHEDULED cycle at 2026-08-01T09:00:00Z with charged_mass_kg 0.000."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvQ_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVQ", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 10.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.0000, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 200000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvQ_mold
              call: "POST /molds"
              payload: { mold_code: "MLD-CVQ-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 20.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - &cvQ_oven
              call: "POST /oven-stations"
              payload: { station_code: "OV-CVQ", arm_count: 1, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cvQ_bay
              call: "POST /cooling-bays"
              payload: { bay_code: "CB-CVQ", concurrent_slot_capacity: 1, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - *cvA_wh
            - &cvQ_lot_bad
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-BAD", resin_grade: "MDPE", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 180, received_kg: 5.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_bad: $.data.id }
            - &cvQ_lot_hot
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-HOT", resin_grade: "HDPE_LINEAR", melt_index_g10min: 6.01, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 190, received_kg: 100.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_hot: $.data.id }
            - &cvQ_lot_thin
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-THIN", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 5.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_thin: $.data.id }
            - &cvQ_lot_ok
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVQ-OK", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 20.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_ok: $.data.id }
            - &cvQ_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVQ", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - &cvQ_release
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - &cvQ_cycle
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /resin-lots/${lot_bad}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { bad_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_bad}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${bad_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_hot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { hot_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_hot}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${hot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_thin}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { thin_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_thin}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${thin_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_ok}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ok_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_ok}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${ok_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_ok}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-charges?molding_cycle_id=${cyc}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "the LOT-CVQ-BAD charge fails 422 ERR_RESIN_LOT_NOT_QUALIFIED: the lot is MDPE against a HDPE_LINEAR model, AND its available_kg 5.000 is far short of the 20.000 requested, so rung 51 and rung 72 are violated by one request and the lower rung answers"
            - "the LOT-CVQ-HOT charge fails 422 ERR_RESIN_LOT_NOT_QUALIFIED with 100.000 kg available — rung 51 alone, on the melt-index band: 6.01 sits just outside the inclusive upper bound max_melt_index_g10min 6.00, so the band is closed at both ends"
            - "the LOT-CVQ-THIN charge fails 409 ERR_RESIN_INSUFFICIENT — rung 72 alone, on a lot that qualifies on grade, colour, additive and melt index but holds only 5.000 of the 20.000 kg needed; this is the proof that rung 72 was genuinely violated in the LOT-CVQ-BAD request"
            - "the two failures return different HTTP codes as well as different ids (422 for 51, 409 for 72), so a handler that evaluated availability first would be caught twice over"
            - "the LOT-CVQ-OK charge returns 201 with status RESERVED: 20.000 >= 20.000, the equality case of rung 72, which drains the lot to available_kg exactly 0.000 with reserved_kg 20.000 and consumed_kg 0.000 — sum 20.000 == received_kg"
            - "MoldingCycle.${cyc}.charged_mass_kg == 20.000 and GET /resin-charges?molding_cycle_id=${cyc} returns exactly 1 row: none of the three refused charges left a row behind"
            - "LOT-CVQ-BAD, LOT-CVQ-HOT and LOT-CVQ-THIN all still read reserved_kg 0.000 and their original available_kg (5.000, 100.000, 5.000) with unchanged version — a refused charge never touches the mass ledger"
            - "the blended regrind share of the accepted charge is round(2.000 / 20.000 * 100, 2) == 10.00 pct, inside max_regrind_pct 30.00, so rungs 50 and 52 are satisfied throughout and cannot be confused with either failure"

      # -----------------------------------------------------------------------
      # V10 — priority 61: warranty eligibility depends on a DIFFERENT entity's
      # state, and only the terminal DELIVERED state admits a claim.
      # -----------------------------------------------------------------------
      - name: val_cross_entity_claim_requires_the_hull_to_be_delivered
        claim_type: "Cross-entity validation"
        grounds:
          - validation_rules.priority_61
          - errors.ERR_UNIT_NOT_DELIVERED
          - state_machines.FinishedUnit.logistics_status
          - endpoints.POST_/warranty-claims
        distinguishing_aspect: "The same claim body is refused 409 ERR_UNIT_NOT_DELIVERED while the hull is STORED and again while it is IN_TRANSIT, and is accepted 201 the moment the shipment is delivered — while a sibling hull still sitting in the warehouse remains unclaimable."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. The PM-CVW base with site WH-CVA and customer CUS-CVW."
            - "Hulls fu1 and fu2 are SELLABLE and STORED at WH-CVA: fu1 anchors zone Z-A at 1.0000 m3 and fu2 nests at 0.5000 m3."
            - "No shipment exists yet and no warranty claim has been filed."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvW_pm
            - *cvW_mold
            - *cvW_oven
            - *cvW_bay
            - *cvA_wh
            - *cvW_cust
            - *cvW_lot
            - *cvW_po
            - *cvW_release
            - *cvW_cycle
            - *cvW_charge
            - *cvB_clk_0900
            - *cvW_start
            - *cvB_clk_1000
            - *cvW_cool
            - *cvB_clk_1035
            - *cvW_demold
            - *cvW_units
            - *cvW_trim1
            - *cvW_outfit1
            - *cvW_inspect1
            - *cvW_trim2
            - *cvW_outfit2
            - *cvW_inspect2
            - *cvW_get_wh1
            - *cvW_store1
            - *cvW_get_wh2
            - *cvW_store2
          trigger:
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVZ-1", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "hull still in the plant warehouse" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CVZ", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CAR-CVZ", trailer_cube_capacity_m3: 1.6000, trailer_max_payload_kg: 1000.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { shpz: $.data.id, shpz_v: $.data.version }
            - call: "POST /shipment-lines"
              payload: { shipment_id: "${shpz}", finished_unit_id: "${fu1}", expected_shipment_version: "${shpz_v}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shpz}/seal"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:30:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shpz}/depart"
              payload: { departed_at: "2026-08-01T11:30:00Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVZ-2", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "hull on the road" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /shipments/${shpz}/deliver"
              payload: { delivered_at: "2026-08-01T12:00:00Z" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVZ-3", finished_unit_id: "${fu1}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "hull delivered, deformation reported on arrival" }
              as: WarrantyAgent
              as_user_id: "agent-1"
              captures: { clm: $.data.id }
            - call: "POST /warranty-claims"
              payload: { claim_code: "CLM-CVZ-4", finished_unit_id: "${fu2}", customer_id: "${cust}", claim_type: "HULL_DEFORMATION", reported_deformation_mm: 3.50, storage_description: "sibling hull never shipped" }
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /warranty-claims?finished_unit_id=${fu1}"
              payload: {}
              as: WarrantyAgent
              as_user_id: "agent-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
          assert:
            - "CLM-CVZ-1 fails 409 ERR_UNIT_NOT_DELIVERED while fu1 is STORED: warranty eligibility is a property of the FinishedUnit's logistics_status, not of the claim body, and no claim row is created"
            - "the single-hull trailer seals because cube_utilization_pct == round(1.0000 / 1.6000 * 100, 2) == 62.50 clears MIN_SEAL_UTILIZATION_PCT 60.00 — the seal is a precondition of reaching IN_TRANSIT at all, so rung 68 must be satisfied to expose rung 61's middle case"
            - "CLM-CVZ-2 fails 409 ERR_UNIT_NOT_DELIVERED while fu1 is IN_TRANSIT — departure is not delivery, and the rung tests DELIVERED specifically rather than 'not in the warehouse'"
            - "CLM-CVZ-3 returns 201 with claim_status SUBMITTED, storage_review_status NOT_STARTED, months_in_service null and every money field null, immediately after the deliver call sets fu1 to DELIVERED with delivered_at 2026-08-01T12:00:00Z"
            - "CLM-CVZ-4 on the sibling hull fu2 fails 409 ERR_UNIT_NOT_DELIVERED: the two hulls share an order, a model and a customer, so the only discriminator is fu2's logistics_status STORED"
            - "GET /warranty-claims?finished_unit_id=${fu1} returns total_count 1 — exactly the accepted claim; the two refusals wrote nothing, so claim_code CLM-CVZ-1 remains available"
            - "the site's footprint summary after the departure reports committed_cube_m3 1.0000 with fu2 now is_zone_anchor true and stored_footprint_cube_m3 1.0000: fu1 vacated zone Z-A as its group's anchor, so the surviving nested sibling was promoted to the full gross cube inside the depart request"
            - "the promotion is why a departure leaves the site MORE utilised than a naive subtraction predicts: 1.5000 - 1.0000 would be 0.5000, yet the observed committed cube is 1.0000, and utilization_pct is round(1.0000 / 100.0000 * 100, 2) == 1.00"

      # -----------------------------------------------------------------------
      # V11 — priority 63: the clock instant itself is a legal oven_start_at and
      # one second earlier is not.
      # -----------------------------------------------------------------------
      - name: val_temporal_oven_start_at_the_clock_passes_one_second_earlier_fails
        claim_type: "Temporal validation"
        grounds:
          - validation_rules.priority_63
          - errors.ERR_OVEN_START_IN_PAST
          - calculations.cycle_window_projection
          - endpoints.POST_/molding-cycles
        distinguishing_aspect: "With the logical clock at 2026-08-01T09:00:00Z a cycle requesting oven_start_at exactly 09:00:00Z is created, 08:59:59Z is refused 422 ERR_OVEN_START_IN_PAST, and 09:00:01Z is created — so the rung is a closed lower bound at the clock instant, not a strict one."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-08-01T09:00:00Z. ProductModel PM-CVP (nominal_charge_kg 12.000, min_cooling_minutes 30) with two single-cavity moulds MLD-CVP-1 and MLD-CVP-2 (nominal_charge_kg 12.000, service_interval_cycles 10), oven OV-CVP with 2 arms and changeover_buffer_min 15, bay CB-CVP with 2 slots, site WH-CVA and resin lot LOT-CVP (100.000 kg)."
            - "ProductionOrder PO-CVP (ordered_qty 2, so the overbuild ceiling is floor(2 * 1.20) == 2) is RELEASED and READY_TO_SCHEDULE with no cycles yet."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - &cvP_pm
              call: "POST /product-models"
