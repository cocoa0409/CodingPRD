              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-09-01T00:00:00Z", repricing_mode: "ABSORPTION_INDEXED", expected_community_version: "${v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s1: $.data.id }
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v2: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-09-01T00:00:00Z", repricing_mode: "ABSORPTION_INDEXED", expected_community_version: "${v2}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /communities/${c}/absorption-reviews"
              payload: { product_type: "DETACHED", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z", planned_absorption_units: 3 }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { rev: $.data.id }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-09-01T00:00:00Z", repricing_mode: "ABSORPTION_INDEXED", expected_community_version: "${v2}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s2: $.data.id }
          assert:
            - "The first indexed publication returns HTTP 404 with data.error_id == ERR_RENT_SCHEDULE_NOT_FOUND — no schedule of any status exists for (community, DETACHED)"
            - "The MANUAL publication returns HTTP 201 with MarketRentSchedule.${s1}.asking_rent_cents == 285000, applied_growth_bps == 0 and status == PUBLISHED"
            - "The second indexed publication returns HTTP 404 with data.error_id == ERR_ABSORPTION_REVIEW_NOT_FOUND — the baseline now resolves but no review does"
            - "AbsorptionReview.${rev}.actual_absorption_units == 0, so pacing_index == 0.0000, concession_tier == AGGRESSIVE and recommended_growth_bps == -150"
            - "The third indexed publication returns HTTP 201 with MarketRentSchedule.${s2}.applied_growth_bps == -150 and asking_rent_cents == 280725 (285000 + round_half_up(285000 * -150 / 10000) == 285000 - 4275)"
            - "MarketRentSchedule.${s1}.status becomes SUPERSEDED with superseded_at == 2026-08-15T00:00:00Z"

      - name: absorption_indexed_publication_off_a_superseded_baseline_is_rejected
        claim_type: error_triggerable
        grounds:
          - calculations.rent_growth_repricing
          - entities.MarketRentSchedule.fields.status
          - errors.ERR_SCHEDULE_ALREADY_SUPERSEDED
        distinguishing_aspect: |
          Publishing out of date order splits "latest-dated" from "PUBLISHED": a 2026-09-01 schedule at
          900000 is superseded by a later-published 2026-08-01 schedule at 270000, so the highest
          effective_from now belongs to a SUPERSEDED row. An indexed repricing refuses to index off that
          stale baseline instead of quietly repricing from the 270000 schedule that base_rent_selection
          would use.
        test_recipe:
          setup:
            - "Community 'Hartwell' with a 2026-09-01 DETACHED schedule at 900000 published first, then a 2026-08-01 DETACHED schedule at 270000 published second, plus one absorption review."
          setup_api_calls:
