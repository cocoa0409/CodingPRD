            - { call: "GET /licenses/${lic_id}", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_v1: "$.data.version" } }
          trigger:
            - { call: "POST /renewals", payload: { license_id: "${lic_id}", requested_term_months: 24, expected_license_version: "${lic_v1}" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { ren2_id: "$.data.id" } }
          assert:
            - "Renewal.${ren2_id}.status == REQUESTED"
            - "Renewal.${ren1_id}.status == SUPERSEDED"

      - name: renewal_default_term_months_applied
        claim_type: conditional_feature_flags
        grounds: [entities.Renewal.fields.requested_term_months]
        distinguishing_aspect: "Creating a renewal without requested_term_months defaults it to 12."
        test_recipe:
          setup: ["ACTIVE BINGO license; version captured"]
          setup_api_calls:
            - { call: "POST /organizations", payload: { legal_name: "Occ5", ein: "49-5050505", nonprofit_type: "501C3", incorporation_date: "2020-01-01T00:00:00Z", good_standing: true, state_code: "CA" }, as: Regulator, captures: { org_id: "$.data.id" } }
            - { call: "POST /licenses", payload: { organization_id: "${org_id}", license_type: "BINGO", contact_email: "xx@x.org", venue_name: "Hall" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /licenses/${lic_id}/submit", payload: {}, as: OrgOfficer, as_user_id: "${org_id}" }
            - { call: "POST /licenses/${lic_id}/approve", payload: {}, as: Regulator }
            - { call: "GET /licenses/${lic_id}", payload: {}, as: OrgOfficer, as_user_id: "${org_id}", captures: { lic_v: "$.data.version" } }
          trigger:
            - { call: "POST /renewals", payload: { license_id: "${lic_id}", expected_license_version: "${lic_v}" }, as: OrgOfficer, as_user_id: "${org_id}", captures: { ren_id: "$.data.id" } }
          assert:
            - "Renewal.${ren_id}.requested_term_months == 12"
            - "Renewal.${ren_id}.status == REQUESTED"

  - section: consistency_model
    instances:
      - name: financial_report_aggregates_visible_immediately
        claim_type: immediate
        grounds: [calculations.proceeds_distribution, entities.FinancialReport.fields.net_proceeds_cents]
        excluded_because:
          difficulty_instance: combinatorial_formula / proceeds_distribution_rounding_order
          rationale: "The §1.8 rounding-order instance already asserts the aggregate computed fields (net/admin/regulatory/charitable_minimum) are present and correct in the create response, which is the immediate-consistency claim."

  - section: errors
    instances:
      - name: error_prize_limit_exceeded_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRIZE_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / prize_allowance_nested_min_annual_arm_binds
          rationale: "ERR_PRIZE_LIMIT_EXCEEDED is asserted as the failure path of the nested-min §1.8 instance."

      - name: error_org_not_eligible_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_ORG_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / approve_requires_eligible_org
          rationale: "ERR_ORG_NOT_ELIGIBLE is asserted as the failure path of the approve-requires-eligible-org §1.8 instance."

      - name: error_license_not_active_triggerable
        claim_type: violation_to_error
