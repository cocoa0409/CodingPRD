            - "Producer.${p_id}.certification_level == NONE and competency_codes == []"
            - "TrainingCourse.${c_id}.passed_count == 0 and enrolled_count == 1"

      - name: corner_air_understaffed_slot_blocked_by_guard
        claim_type: guarded_transitions
        grounds:
          - state_machines.PlaybackSlot.SCHEDULED_to_AIRED
          - validations[priority=19]
          - errors[ERR_SLOT_UNDERSTAFFED]
          - calculations.crew_staffing_readiness
        distinguishing_aspect: "The SCHEDULED -> AIRED transition is guarded by a cross-entity condition on CrewAssignment coverage: with required_crew_roles [CAMERA] and no CONFIRMED assignment the air is refused with ERR_SLOT_UNDERSTAFFED, and it succeeds the moment the volunteer confirms."
        test_recipe:
          setup:
            - "Producer P is ACTIVE with certification_level BASIC and owns APPROVED, CLEARED Program PR with required_crew_roles [CAMERA]."
            - "Producer V is ACTIVE with certification_level NONE and is OFFERED the CAMERA role on the slot but has not confirmed."
            - "Channel PATV1 carries SCHEDULED slot SL at 2026-08-20T18:00:00Z with staffing_status UNDERSTAFFED, and the clock has reached 18:00:00Z."
