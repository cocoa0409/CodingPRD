        test_recipe:
          setup: ["excavators ex1 and ex2 exist (no invoices needed — ownership fails first)"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "OtherCo", contact_email: "o@x.com" }, as: RecoveryManager, captures: { ex2: $.data.id } }
          trigger:
            - { call: "POST /damage-recovery/payments", payload: { payer_type: "EXCAVATOR", payer_id: "${ex1}", amount_cents: 1000 }, as: Excavator, as_user_id: "${ex2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OWNERSHIP_MISMATCH"

      - name: non_filer_cannot_counter_dispute_returns_ownership
        claim_type: rbac_ownership
        grounds: ["state_machines.Dispute", "errors[ERR_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Counter is filer-only: excavator ex2 counters a dispute filed by ex1 -> ERR_OWNERSHIP_MISMATCH; the dispute stays UNDER_REVIEW."
        test_recipe:
          setup: ["excavators ex1 (filer) and ex2; finalized case for ex1, invoice ISSUED, dispute OPEN then responded (UNDER_REVIEW)"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "OtherCo", contact_email: "o@x.com" }, as: RecoveryManager, captures: { ex2: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "45 Waw St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseNF: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseNF}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseNF}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseNF_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseNF}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseNF_v}", shares: [ { party_type: "EXCAVATOR", party_id: "${ex1}", share_bp: 10000 } ] }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocNF: $.data.id } }
            - { call: "POST /damage-recovery/fault-allocations/${allocNF}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocNF}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseNF}" }, as: RecoveryManager, captures: { invNF: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invNF}/issue", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/disputes", payload: { target_type: "CLAIM_INVOICE", target_id: "${invNF}", reason: "AMOUNT" }, as: Excavator, as_user_id: "${ex1}", captures: { dspNF: $.data.id } }
            - { call: "POST /damage-recovery/disputes/${dspNF}/respond", payload: { response_note: "reviewed" }, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /damage-recovery/disputes/${dspNF}/counter", payload: { counter_note: "not mine" }, as: Excavator, as_user_id: "${ex2}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OWNERSHIP_MISMATCH and dispute remains UNDER_REVIEW"

      - name: segregation_of_duties_pattern_stub
        claim_type: rbac_pattern
        grounds: ["roles", "validations[priority=6]"]
        excluded_because:
          difficulty_instance: finalize_sod_beats_invoice_authority_cap
          rationale: "The segregation-of-duties role pattern is exercised as the winning error of the named §1.8 priority-conflict instance (same-user finalize rejected with ERR_SEGREGATION_OF_DUTIES)."

  # ============================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_allocation_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[fault-allocation-create-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DamageCase.version: the client reads version 1, an evidence write bumps it to 2 and begin-investigation to 3; creating an allocation with expected_damage_case_version 1 fails 412 ERR_STALE_VERSION, while the fresh version succeeds (two strictly sequential requests, no parallelism)."
        test_recipe:
          setup: ["excavator ex1; case created (version 1 captured), evidence added, investigation begun (version 3)"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "46 Zayin St", facility_type: "GAS", severity: "MINOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseOC2: $.data.id, caseOC2_v1: $.data.version } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseOC2}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseOC2}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseOC2_v3: $.data.version } }
          trigger:
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseOC2}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseOC2_v1}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { err: $.data.error_id } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseOC2}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseOC2_v3}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocOC2: $.data.id } }
          assert:
            - "stale write: error_id == ERR_STALE_VERSION with http status 412"
            - "fresh write: allocation created (${allocOC2} non-empty) in DRAFT"
            - "create succeeded once with the correct version — version bumped again by the supersede side effect"

      - name: delete_cost_line_recomputes_subtotal
        claim_type: derived_field_reconciliation
        grounds: ["calculations.repair_cost_compilation", "entities.DamageCase.fields.subtotal_cents"]
        distinguishing_aspect: "Derived field stays consistent on delete: removing the 103500 LABOR line from a 120000 subtotal leaves exactly 16500 (the MATERIAL line) — recomputed, not stale."
        test_recipe:
          setup: ["excavator ex1; case in COSTING with LABOR (103500) and MATERIAL (16500) lines"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "47 Heth St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseDL: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseDL}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster, captures: { lineL: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseDL}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
          trigger:
            - { call: "DELETE /damage-recovery/cost-line-items/${lineL}", payload: {}, as: ClaimsAdjuster }
            - { call: "GET /damage-recovery/damage-cases/${caseDL}", payload: {}, as: RecoveryManager, captures: { sub_after: $.data.subtotal_cents } }
          assert:
            - "DamageCase.subtotal_cents == 16500 after the delete"
            - "GET /cost-line-items?damage_case_id returns exactly 1 row"

      - name: finalize_cascade_stub
        claim_type: cascading_side_effects
        grounds: ["state_machines.FaultAllocation.PROPOSED_to_FINAL"]
        excluded_because:
          difficulty_instance: finalize_violation_probation_training_cascade
          rationale: "The depth-3 finalize cascade (ViolationRecord -> score/band -> TrainingAssignment) is asserted end-to-end by the named §1.8 instance."

      - name: offender_threshold_boundary_stub
        claim_type: rate_threshold_triggers
        grounds: ["calculations.repeat_offender_score"]
        excluded_because:
          difficulty_instance: offender_points_exactly_12_probation_10_watch
          rationale: "Threshold boundary precision (12 -> PROBATION, 10 -> WATCH) is asserted by the named §1.8 instance."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_payment_effects_visible
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "calculations.payment_waterfall_allocation"]
        distinguishing_aspect: "Immediate consistency: the payment creation response already carries the computed allocations, and an immediate re-read of the invoice shows amount_due_cents == 0 with status PAID — no lag."
        test_recipe:
          setup: ["excavator ex1; finalized case, invoice ISSUED 120000"]
          setup_api_calls:
            - { call: "POST /damage-recovery/excavators", payload: { company_name: "DigCo", contact_email: "d@x.com" }, as: RecoveryManager, captures: { ex1: $.data.id } }
            - { call: "POST /damage-recovery/damage-cases", payload: { excavator_id: "${ex1}", dig_site_address: "48 Teth St", facility_type: "GAS", severity: "MAJOR", occurred_at: "2026-05-02T09:00:00Z" }, as: IntakeCoordinator, captures: { caseIC: $.data.id } }
            - { call: "POST /damage-recovery/evidence-items", payload: { damage_case_id: "${caseIC}", evidence_type: "PHOTO", captured_at: "2026-05-02T10:00:00Z", description: "scene" }, as: IntakeCoordinator }
            - { call: "POST /damage-recovery/damage-cases/${caseIC}/begin-investigation", payload: {}, as: DamageInvestigator, as_user_id: "inv-1", captures: { caseIC_v: $.data.version } }
            - { call: "POST /damage-recovery/fault-allocations", payload: { damage_case_id: "${caseIC}", root_cause_code: "NO_TICKET", expected_damage_case_version: "${caseIC_v}" }, as: DamageInvestigator, as_user_id: "inv-1", captures: { allocIC: $.data.id } }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseIC}", category: "LABOR", description: "crew", quantity: 10, unit_cost_cents: 9000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/cost-line-items", payload: { damage_case_id: "${caseIC}", category: "MATERIAL", description: "pipe", quantity: 5, unit_cost_cents: 3000 }, as: ClaimsAdjuster }
            - { call: "POST /damage-recovery/fault-allocations/${allocIC}/propose", payload: {}, as: DamageInvestigator, as_user_id: "inv-1" }
            - { call: "POST /damage-recovery/fault-allocations/${allocIC}/finalize", payload: {}, as: RecoveryManager, as_user_id: "mgr-1" }
            - { call: "GET /damage-recovery/claim-invoices", payload: { damage_case_id: "${caseIC}" }, as: RecoveryManager, captures: { invIC: "$.data[0].id" } }
            - { call: "POST /damage-recovery/claim-invoices/${invIC}/issue", payload: {}, as: ClaimsAdjuster }
          trigger:
            - { call: "POST /damage-recovery/payments", payload: { payer_type: "EXCAVATOR", payer_id: "${ex1}", amount_cents: 120000, claim_invoice_id: "${invIC}" }, as: Excavator, as_user_id: "${ex1}", captures: { payIC: $.data.id, payIC_st: $.data.status } }
            - { call: "GET /damage-recovery/claim-invoices/${invIC}", payload: {}, as: RecoveryManager, captures: { invIC_due: $.data.amount_due_cents, invIC_st: $.data.status } }
          assert:
            - "Payment response status == APPLIED with allocations == [ { claim_invoice_id: ${invIC}, amount_cents: 120000 } ]"
            - "immediate read: ClaimInvoice.amount_due_cents == 0 and status == PAID"

