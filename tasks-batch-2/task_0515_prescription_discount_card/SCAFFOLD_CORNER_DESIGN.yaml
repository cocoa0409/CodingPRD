              as: PharmacyOperator
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: PharmacyOperator
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { ls: $.data.lifetime_savings_cents }
          assert:
            - "Member.${m_id}.lifetime_savings_cents == 3000"
