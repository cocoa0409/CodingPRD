  - section: errors
    instances:
      - name: unrecognized_role_header_returns_401_unauthorized
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication at priority 1 precedes authorization at priority 2: a role string outside the seven declared names returns 401 ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED, even on an endpoint that would accept several roles."
        test_recipe:
          setup:
            - "no rows are required; the call is refused before any lookup"
          setup_api_calls: []
          trigger:
            - call: "GET /recreation/residents"
              payload: {}
              as: Custodian
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 401"
            - "${err_id} == \"ERR_UNAUTHENTICATED\""
            - "${err_id} != \"ERR_UNAUTHORIZED\", authentication outranking authorization"
      - name: remaining_not_found_codes_each_triggerable_not_found
        claim_type: error_triggerable
        grounds:
          - errors.ERR_ASSESSMENT_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_ROOM_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_VEHICLE_NOT_FOUND
          - errors.ERR_OUTING_NOT_FOUND
          - errors.ERR_COUNCIL_REQUEST_NOT_FOUND
          - errors.ERR_SURVEY_PACKET_NOT_FOUND
        distinguishing_aspect: "Sweeps the eight not-found codes no other instance reaches, proving the segment-to-error and FK-field-to-error maps of validations 5 and 6 are honoured per entity rather than collapsed into one generic 404."
        test_recipe:
          setup:
            - "one catalog program exists so the two body-FK probes fail on their SECOND FK rather than on program_id"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Sweep Program", domain: "SOCIAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /recreation/assessments/00000000-0000-4000-8000-000000000301"
              as: RecreationTherapist
              captures: { assessment_err: $.data.error_id }
            - call: "GET /recreation/activity-plans/00000000-0000-4000-8000-000000000302"
              as: RecreationTherapist
              captures: { plan_err: $.data.error_id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "00000000-0000-4000-8000-000000000303", starts_at: "2026-09-14T10:00:00Z", ends_at: "2026-09-14T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { room_err: $.data.error_id }
            - call: "GET /recreation/volunteer-assignments/00000000-0000-4000-8000-000000000304"
              as: VolunteerCoordinator
              captures: { assignment_err: $.data.error_id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "00000000-0000-4000-8000-000000000305", destination: "Nowhere", departure_at: "2026-09-14T09:00:00Z", return_at: "2026-09-14T12:00:00Z", escort_count: 1 }
              as: ActivityDirector
              captures: { vehicle_err: $.data.error_id }
            - call: "GET /recreation/outings/00000000-0000-4000-8000-000000000306"
              as: ActivityDirector
              captures: { outing_err: $.data.error_id }
            - call: "GET /recreation/council-requests/00000000-0000-4000-8000-000000000307"
              as: ActivityDirector
              captures: { council_err: $.data.error_id }
            - call: "GET /recreation/survey-packets/00000000-0000-4000-8000-000000000308"
              as: ComplianceOfficer
              captures: { packet_err: $.data.error_id }
          assert:
            - "every one of the eight calls returns 404"
            - "${assessment_err} == \"ERR_ASSESSMENT_NOT_FOUND\""
            - "${plan_err} == \"ERR_PLAN_NOT_FOUND\""
            - "${room_err} == \"ERR_ROOM_NOT_FOUND\", the valid program_id being resolved first"
            - "${assignment_err} == \"ERR_ASSIGNMENT_NOT_FOUND\""
            - "${vehicle_err} == \"ERR_VEHICLE_NOT_FOUND\""
            - "${outing_err} == \"ERR_OUTING_NOT_FOUND\""
            - "${council_err} == \"ERR_COUNCIL_REQUEST_NOT_FOUND\""
            - "${packet_err} == \"ERR_SURVEY_PACKET_NOT_FOUND\""
      - name: plan_outing_consent_invalid_state_codes_returns_4XX
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PLAN_INVALID_STATE
          - errors.ERR_OUTING_INVALID_STATE
          - errors.ERR_CONSENT_INVALID_STATE
        distinguishing_aspect: "Three different entities each return their OWN state code for an undeclared trigger: REACTIVATE on an ACTIVE plan, DEPART on a PLANNING outing and REVOKED on a DENIED consent never collapse into one shared ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "one ADMITTED, assessed resident holding an ACTIVE plan"
            - "one PLANNING outing whose single consent has already been DENIED, so consent_status is CONSENT_BLOCKED"
