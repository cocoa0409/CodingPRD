        excluded_because:
          difficulty_instance: transitive_cascade / license_termination_cascades_booking_release_hold_release_and_space_day_reversal
          rationale: "The named §1.8 instance already verifies termination fanning out to the booking, the hold and the space-day ledger with the escrow returned."

  - section: consistency_model
    instances:
      - name: settlement_issue_response_carries_the_fee_and_total_in_the_same_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.facility_service_fee
          - endpoints[POST /convention-center/settlements/{id}/issue]
        distinguishing_aspect: |
          The declared model is immediate, so the response body of the issuing call already
          carries the recomputed facility_service_fee_cents and grand_total_cents rather
          than leaving them for a later read to fill in. A deferred implementation that
          returned the pre-issue zeros and only settled the figures on the next GET would
          pass a read-after-write test but fails this one, and the follow-up read must
          agree to the cent with what the write returned.
        test_recipe:
            setup:
              - "the Ballroom C CONSUMER_SHOW booking is CLOSED with contracted_rental_cents exactly 5000000"
              - "a DRAFT CONTRACTED settlement holds one RENTAL line of 5000000 and still reports zeros for the fee and the total"
            setup_api_calls:
              - call: "POST /convention-center/policy-windows"
                payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
                as: VenueAdmin
              - call: "POST /convention-center/spaces"
                payload: { name: "Ballroom C", space_class: "BALLROOM", rentable_sqft: 42000, daily_base_rate_cents: 1250000 }
                as: VenueAdmin
                captures: { sp_bc_id: $.data.id }
              - call: "POST /convention-center/clients"
                payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
                as: VenueAdmin
                captures: { cl_ssp_id: $.data.id }
              - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
                payload: { amount_cents: 1300000 }
                as: VenueAdmin
              - call: "POST /convention-center/bookings"
                payload: { client_id: "${cl_ssp_id}", space_id: "${sp_bc_id}", event_name: "Sunbelt Boat Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-06-09", show_start_date: "2027-06-10", show_end_date: "2027-06-12", move_out_end_date: "2027-06-13" }
                as: SalesManager
                captures: { bk_id: $.data.id, bk_v1: $.data.version }
              - call: "POST /convention-center/bookings/${bk_id}/holds"
                payload: { expected_booking_version: "${bk_v1}" }
                as: SalesManager
                captures: { hold_id: $.data.id }
              - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
                payload: {}
                as: SalesManager
              - call: "POST /convention-center/bookings/${bk_id}/license"
                payload: {}
                as: SalesManager
                captures: { lic_id: $.data.id }
              - call: "POST /convention-center/licenses/${lic_id}/issue"
                payload: {}
                as: SalesManager
              - call: "POST /convention-center/licenses/${lic_id}/countersign"
                payload: {}
                as: Licensee
                as_user_id: "${cl_ssp_id}"
              - call: "POST /convention-center/bookings/${bk_id}/confirm-definite"
                payload: {}
                as: SalesManager
              - call: "POST /convention-center/_clock/set_current_utc"
                payload: { to_iso8601: "2027-06-09T08:00:00Z" }
                as: VenueAdmin
              - call: "POST /convention-center/bookings/${bk_id}/open-show"
                payload: {}
                as: EventServicesManager
              - call: "POST /convention-center/_clock/set_current_utc"
                payload: { to_iso8601: "2027-06-14T09:00:00Z" }
                as: VenueAdmin
              - call: "POST /convention-center/bookings/${bk_id}/close"
                payload: {}
                as: EventServicesManager
              - call: "POST /convention-center/bookings/${bk_id}/settlement"
                payload: { basis: "CONTRACTED" }
                as: SettlementAnalyst
                as_user_id: "analyst-1"
                captures: { set_id: $.data.id, fee_before: $.data.facility_service_fee_cents, total_before: $.data.grand_total_cents }
              - call: "POST /convention-center/settlement-line-items"
                payload: { settlement_id: "${set_id}", line_kind: "RENTAL", amount_cents: 5000000, memo: "contracted rental" }
                as: SettlementAnalyst
                as_user_id: "analyst-1"
            trigger:
              - call: "POST /convention-center/settlements/${set_id}/issue"
                payload: {}
                as: SettlementAnalyst
                as_user_id: "analyst-1"
                captures: { fee_at_issue: $.data.facility_service_fee_cents, total_at_issue: $.data.grand_total_cents }
              - call: "GET /convention-center/settlements/${set_id}"
                payload: {}
                as: SettlementAnalyst
                as_user_id: "analyst-1"
            assert:
              - "${fee_before} == 0 and ${total_before} == 0"
              - "the first trigger returns 200 with ${fee_at_issue} == 350000 and ${total_at_issue} == 5350000"
              - "the first trigger's body already reports data.line_subtotal_cents == 5000000 and data.status == ISSUED"
              - "the first trigger's body already reports data.dispute_deadline_utc == 2027-06-24T09:00:00Z"
              - "the second trigger reports the identical figures 350000 and 5350000"
              - "the second trigger reports data.deposit_applied_cents == 0, because the deposit is applied only at finalisation"

      - name: license_issue_response_and_client_read_agree_on_credit_balance
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /convention-center/licenses/{id}/issue]
          - entities.Client.fields.credit_balance_cents
          - entities.LicenseAgreement.fields.deposit_held_cents
        distinguishing_aspect: |
          Issuing the license moves money between two aggregates in one request: 90900
          cents leave the client's credit_balance_cents and appear as the license's
          deposit_held_cents. Under the immediate model the write's own body already shows
          the escrow, and an immediate read of the other aggregate already shows the
          reduced credit. Total money is conserved, so a denormalised counter refreshed
          out of band would break the pairing.
        test_recipe:
            setup:
              - "the client has paid deposits of 200000 cents and the Meeting Room 301 booking requires 90900"
              - "the license is DRAFT with deposit_held_cents 0"
            setup_api_calls:
              - call: "POST /convention-center/policy-windows"
                payload: { event_class: "CONSUMER_SHOW", priority_rank: 3, open_months_before: 18, close_months_before: 2, max_holds_per_booking: 2, challenge_response_hours: 48, rental_discount_pct: 0.0, max_challenge_rounds: 1 }
                as: VenueAdmin
              - call: "POST /convention-center/spaces"
                payload: { name: "Meeting Room 301", space_class: "MEETING_ROOM", rentable_sqft: 2600, daily_base_rate_cents: 90900 }
                as: VenueAdmin
                captures: { sp_mr_id: $.data.id }
              - call: "POST /convention-center/clients"
                payload: { legal_name: "Sunbelt Show Promotions", contact_email: "ssp@example.org", organization_type: "PROMOTER" }
                as: VenueAdmin
                captures: { cl_ssp_id: $.data.id }
              - call: "POST /convention-center/clients/${cl_ssp_id}/deposits"
                payload: { amount_cents: 200000 }
                as: VenueAdmin
                captures: { credit_before: $.data.credit_balance_cents }
              - call: "POST /convention-center/bookings"
                payload: { client_id: "${cl_ssp_id}", space_id: "${sp_mr_id}", event_name: "Regional Gem Show", event_class: "CONSUMER_SHOW", move_in_start_date: "2027-03-01", show_start_date: "2027-03-02", show_end_date: "2027-03-04", move_out_end_date: "2027-03-05" }
                as: SalesManager
                captures: { bk_id: $.data.id, bk_v1: $.data.version }
              - call: "POST /convention-center/bookings/${bk_id}/holds"
                payload: { expected_booking_version: "${bk_v1}" }
                as: SalesManager
                captures: { hold_id: $.data.id }
              - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
                payload: {}
                as: SalesManager
              - call: "POST /convention-center/bookings/${bk_id}/license"
                payload: {}
                as: SalesManager
                captures: { lic_id: $.data.id }
            trigger:
              - call: "POST /convention-center/licenses/${lic_id}/issue"
                payload: {}
                as: SalesManager
                captures: { escrow_at_issue: $.data.deposit_held_cents }
              - call: "GET /convention-center/clients/${cl_ssp_id}"
                payload: {}
                as: SalesManager
                captures: { credit_after: $.data.credit_balance_cents }
            assert:
              - "${credit_before} == 200000"
              - "the first trigger returns 200 with ${escrow_at_issue} == 90900 and data.status == ISSUED"
              - "the first trigger's body already reports data.issued_at_utc == 2026-08-01T00:00:00Z"
              - "the second trigger reports ${credit_after} == 109100"
              - "the second trigger reports data.total_deposits_paid_cents == 200000, so the paid-to-date figure is untouched by the escrow move"
              - "${credit_after} + ${escrow_at_issue} == ${credit_before}, so the escrow conserves the client's money"
              - "Client.${cl_ssp_id}.booking_standing == GOOD"
