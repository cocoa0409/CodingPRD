scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: enrollment_credit_provisional_vs_final
        grounds:
          - calculations.credit_award_calc
          - calculations.credit_award_calc.variants.provisional
          - calculations.credit_award_calc.variants.final
          - entities.Enrollment.fields.provisional_credit
          - entities.Enrollment.fields.final_credit
          - state_machines.Enrollment.CONFIRMED_to_COMPLETED
          - state_machines.Enrollment.CONFIRMED_to_FAILED
        distinguishing_aspect: |
          The provisional and final variants run on the same Enrollment but produce different
          numeric outputs whenever the trainee's attendance is PARTIAL and the subsequent exam
          is failed: provisional_credit = credit_value * 0.5 while final_credit =
          credit_value * 0.5 * 0.5 = credit_value * 0.25. The first instance domain is the
          Enrollment (learner-side credit award).
        test_recipe:
          setup:
            - "Create Course code=ENG-101 credit_value=4.0 is_charged=false; publish so a CourseVersion v1 is pinned"
            - "Create CertificateTemplate for the course (requires_exam_pass=true, requires_attendance=true)"
            - "Create Instructor (INTERNAL, expertise_tags overlapping course.tags), AVAILABLE window covering the session"
            - "Create Classroom; create Session start=2026-06-01T09:00Z end=2026-06-01T13:00Z capacity=10 enrollment_deadline=2026-05-31T23:59Z; open-enrollment"
            - "Create Trainee T1; POST /training/enrollments {session_id, trainee_id=T1, mode=SELF} -> CONFIRMED"
            - "Advance clock to 2026-06-01T09:30Z; run sweep so session=IN_PROGRESS"
            - "POST /training/sessions/{id}/check-ins {enrollment_id, channel=QR, source_value=<valid QR token>} once so attendance_status becomes PARTIAL (server treats single check-in for a multi-hour session as PARTIAL)"
          trigger:
            - "Inspect Enrollment.provisional_credit after check-in (variant: provisional)"
            - "POST /training/exam-attempts; submit with given_answers that score 60.00 (below pass threshold)"
            - "Advance clock to 2026-06-01T13:30Z; run sweep; POST /training/sessions/{id}/complete (variant: final)"
          assert:
            - "After check-in: Enrollment.provisional_credit == 2.0"
            - "After session complete (PARTIAL + failed exam): Enrollment.final_credit == 1.0"
            - "provisional_credit (2.0) != final_credit (1.0)"
            - "Enrollment.status == FAILED (attendance OK but exam failed)"

      - name: instructor_fee_internal_vs_external
        grounds:
          - calculations.instructor_fee_calc
          - calculations.instructor_fee_calc.variants.payable_internal
          - calculations.instructor_fee_calc.variants.payable_external
          - entities.Instructor.fields.instructor_type
          - entities.Instructor.fields.hourly_rate
          - entities.Instructor.fields.travel_cost
        distinguishing_aspect: |
          Two valid algorithms compute instructor-fee on the same Session but on a different
          entity domain (Instructor compensation, not Enrollment credit). For identical
          hourly_rate=200, duration_hours=4.0, travel_cost=50 inputs, payable_internal returns
          0 (zeroed for internal) while payable_external returns 810.00 (200*4.0*0.95 + 50).
          The two outputs differ by 810.00.
        test_recipe:
          setup:
            - "Create Course duration_hours=4.0, publish; CertificateTemplate not required (is_charged=false)"
            - "Create Instructor I_INT (INTERNAL, hourly_rate=200, travel_cost=50, expertise_tags overlap course.tags)"
            - "Create Instructor I_EXT (EXTERNAL, hourly_rate=200, travel_cost=50, expertise_tags overlap)"
            - "Create AVAILABLE windows for both instructors covering 2026-06-01T09:00Z..13:00Z"
            - "Create Classroom; create Session_INT with I_INT and Session_EXT with I_EXT, same time window using different classrooms"
            - "Advance clock to 2026-06-01T13:30Z; run sweep; complete both sessions"
          trigger:
            - "GET /training/sessions/{Session_INT.id}/instructor-fee"
            - "GET /training/sessions/{Session_EXT.id}/instructor-fee"
          assert:
            - "Session_INT fee total == 0"
            - "Session_EXT fee total == 810.00"
            - "fee_internal (0) != fee_external (810.00)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: instructor_fee_tier_with_three_inputs
        grounds:
          - calculations.instructor_fee_calc
          - calculations.instructor_fee_calc.constants.TIER_1_MAX
          - calculations.instructor_fee_calc.constants.TIER_2_MAX
          - calculations.instructor_fee_calc.constants.TIER_2_MULT
          - calculations.instructor_fee_calc.constants.TIER_3_MULT
          - entities.Instructor.fields.hourly_rate
          - entities.Instructor.fields.travel_cost
          - entities.Course.fields.duration_hours
        distinguishing_aspect: |
          Mode (a): formula has >=3 inputs (hourly_rate, duration_hours, travel_cost) with
          conditional tier-multiplier branching on a derived value (effective_hours), then
          conditional zeroing on instructor_type. Crossing the duration boundary (2.0 vs 2.5)
          flips the multiplier from 1.00 to 0.95, producing a non-linear interaction between
          duration and rate. Falls in mode (a) — combinatorial inputs and conditional branches.
        test_recipe:
          setup:
            - "Create Instructor EXTERNAL hourly_rate=200, travel_cost=50, expertise overlapping"
            - "Course A duration_hours=2.0 published; Course B duration_hours=2.5 published"
            - "Sessions for both; complete via clock advance + sweep + complete"
          trigger:
            - "GET fee for Course A session (effective_hours=2.0)"
            - "GET fee for Course B session (effective_hours=2.5)"
          assert:
            - "Course A fee == round(200 * 2.0 * 1.00, 2) + 50 == 450.00"
            - "Course B fee == round(200 * 2.5 * 0.95, 2) + 50 == 525.00"
            - "Boundary at 2.0 is inclusive in TIER_1 ([0.5, 2.0]); 2.5 falls in TIER_2 (2.0, 5.0]"

      - name: exam_score_rounding_order
        grounds:
          - calculations.exam_score_calc
          - calculations.exam_score_calc.formula
          - calculations.exam_score_calc.precision
        distinguishing_aspect: |
          Mode (b): the formula pins 'sum correct_weight then divide then round to 2dp', NOT
          'round each per-question percentage then sum'. For 2 correct of 3 equal-weight
          questions, the pinned order yields 66.67 while per-question rounding would yield
          66.66 (3 * round(1/3*100,2) = 3 * 33.33 = 99.99 vs 100). The scaffold pins one order
          explicitly and the test asserts the resulting cent.
        test_recipe:
          setup:
            - "Create Course; publish; CertificateTemplate exists"
            - "Schedule and start Session with 1 confirmed trainee; check-in PRESENT"
            - "POST /training/exam-attempts creates ExamAttempt with 3 questions weight=1 each"
          trigger:
            - "POST /training/exam-attempts/{id}/submit with answers correct for question 1 and 2, wrong for question 3"
          assert:
            - "ExamAttempt.score == 66.67"
            - "ExamAttempt.passed == false"
            - "score != 66.66 (per-question-round-then-sum interpretation is rejected)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: course_revert_loop_draft_review_draft
        grounds:
          - state_machines.Course.DRAFT_to_PENDING_REVIEW
          - state_machines.Course.PENDING_REVIEW_to_DRAFT
          - state_machines.Course.PENDING_REVIEW_to_ON_SHELF
          - state_machines.Course.ON_SHELF_to_OFF_SHELF
          - state_machines.Course.OFF_SHELF_to_ON_SHELF
        distinguishing_aspect: |
          Course's state machine is non-linear in two ways: (1) PENDING_REVIEW can revert to
          DRAFT via /reject (cycle A->B->A); (2) ON_SHELF<->OFF_SHELF can ping-pong via
          /unpublish and /publish. Belongs to entity Course.
        test_recipe:
          setup:
            - "Create Course in DRAFT"
          trigger:
            - "POST /submit-for-review -> PENDING_REVIEW"
            - "POST /reject -> DRAFT"
            - "POST /submit-for-review -> PENDING_REVIEW"
            - "POST /publish -> ON_SHELF (creates CourseVersion v1)"
            - "POST /unpublish -> OFF_SHELF"
            - "POST /publish -> ON_SHELF (current_version_no remains 1; no new version created)"
          assert:
            - "Course.status visits DRAFT twice and ON_SHELF twice across the run"
            - "current_version_no == 1 throughout (republish from OFF_SHELF does not increment)"

      - name: enrollment_branching_complete_failed_no_show
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_COMPLETED
          - state_machines.Enrollment.CONFIRMED_to_NO_SHOW
          - state_machines.Enrollment.CONFIRMED_to_FAILED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
        distinguishing_aspect: |
          Enrollment's state machine is non-linear via branching fork at CONFIRMED on session
          complete: divergent terminal targets {COMPLETED, FAILED, NO_SHOW} with divergent
          side-effect sets (credit award full / credit award half / no credit). Different
          entity (Enrollment) from the Course instance above.
        test_recipe:
          setup:
            - "Three confirmed Enrollments E_PASS, E_FAIL, E_ABSENT on same session"
            - "E_PASS: PRESENT + exam pass; E_FAIL: PRESENT + exam fail; E_ABSENT: no check-in"
          trigger:
            - "Advance clock past end_at; sweep; complete session"
          assert:
            - "E_PASS.status == COMPLETED, final_credit > 0"
            - "E_FAIL.status == FAILED, final_credit == credit_value * 0.5"
            - "E_ABSENT.status == NO_SHOW, final_credit == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: session_complete_to_credit_pool_chain
        grounds:
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.Enrollment.CONFIRMED_to_COMPLETED
          - calculations.credit_award_calc
          - calculations.credit_pool_accumulation_calc
          - entities.CreditPool.fields.accumulated_credits
        distinguishing_aspect: |
          Depth-3 chain triggered by session complete: (1) Session IN_PROGRESS->COMPLETED;
          this mutation on Session itself triggers (2) each Enrollment CONFIRMED->COMPLETED
          and credit_award_calc writing Enrollment.final_credit; that mutation on Enrollment
          itself triggers (3) credit_pool_accumulation_calc recomputing
          CreditPool.accumulated_credits. Each hop is caused by the previous hop, not by the
          original trigger directly. Originates from session.complete.
        test_recipe:
          setup:
            - "Trainee T1, CreditPool P1 covering 2026 cycle"
            - "Course (credit_value=4.0) published with CertificateTemplate"
            - "Session scheduled 2026-06-01 09:00-13:00; T1 enrolled CONFIRMED; PRESENT check-in; exam passed"
          trigger:
            - "Clock advance past end_at; sweep; POST /training/sessions/{id}/complete"
          assert:
            - "Session.status == COMPLETED"
            - "Enrollment.status == COMPLETED, Enrollment.final_credit == 4.0"
            - "CreditPool.accumulated_credits == 4.0 (depth-3 hop completed)"

      - name: session_cancel_to_waitlist_promotion_chain
        grounds:
          - state_machines.Session.ENROLLMENT_OPEN_to_CANCELLED
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - state_machines.Enrollment.WAITLISTED_to_CANCELLED
          - entities.Session.fields.enrolled_count
          - entities.Session.fields.waitlist_count
        distinguishing_aspect: |
          Different triggering transition (enrollment.cancel on a non-cancelled session).
          Depth-2 chain: (1) Enrollment CONFIRMED->CANCELLED (decrement enrolled_count); that
          mutation itself triggers (2) the head WAITLISTED row to WAITLISTED->CONFIRMED, which
          itself adjusts session counts and remaining waitlist_position numbers. Originates
          from POST /enrollments/{id}/cancel — a different trigger from session.complete.
        test_recipe:
          setup:
            - "Session capacity=1, waitlist_capacity=3; status=ENROLLMENT_OPEN"
            - "Trainees T1, T2, T3 each enroll: T1 CONFIRMED, T2 WAITLISTED pos 1, T3 WAITLISTED pos 2"
          trigger:
            - "POST /training/enrollments/{T1_enrollment_id}/cancel"
          assert:
            - "T1.status == CANCELLED"
            - "T2.status == CONFIRMED (promoted by chain hop)"
            - "T3.waitlist_position == 1 (decremented by chain hop)"
            - "session.enrolled_count == 1, session.waitlist_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pair
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair: (category=state, ERR_INVALID_STATE, priority 5) vs (category=business_safety,
          ERR_INSTRUCTOR_BLACKLISTED, priority 7). When both conditions fail simultaneously
          on PATCH /training/sessions/{id} (target session is not SCHEDULED AND new
          instructor_id is BLACKLISTED), the lower priority number wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Session_A in IN_PROGRESS (not editable)"
            - "Instructor I_BL status=BLACKLISTED"
          trigger:
            - "PATCH /training/sessions/{Session_A.id} {instructor_id: I_BL.id}"
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Not ERR_INSTRUCTOR_BLACKLISTED — priority 5 wins over priority 7"

      - name: business_temporal_vs_business_referential_pair
        grounds:
          - validations[priority=9]
          - validations[priority=13]
        distinguishing_aspect: |
          A different error-category pair: (category=business_referential,
          ERR_PREREQUISITE_NOT_MET, priority 9) vs (category=business_temporal,
          ERR_ENROLLMENT_DEADLINE_PASSED, priority 13). When a trainee tries to enroll after
          the deadline AND lacks prerequisites, the lower priority number wins ->
          ERR_PREREQUISITE_NOT_MET (priority 9 < priority 13).
        test_recipe:
          setup:
            - "Course C_PREQ with prerequisite_course_ids=[C_FOO.id]; trainee never completed C_FOO"
            - "Session for C_PREQ with enrollment_deadline=2026-05-30T00:00Z; clock at 2026-05-31T00:00Z (past deadline)"
          trigger:
            - "POST /training/enrollments {session_id, trainee_id, mode=SELF}"
          assert:
            - "HTTP 422 with error_id == ERR_PREREQUISITE_NOT_MET"
            - "Not ERR_ENROLLMENT_DEADLINE_PASSED — priority 9 wins over priority 13"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: exam_pass_threshold_boundary
        grounds:
          - calculations.exam_score_calc
          - calculations.exam_score_calc.constants.PASS_THRESHOLD
          - entities.ExamAttempt.fields.passed
        distinguishing_aspect: |
          Numeric threshold boundary: passing is score >= 70 (inclusive, not >). Tested on
          ExamAttempt via POST /training/exam-attempts/{id}/submit. Score exactly 70.00 must
          pass; 69.99 must fail.
        test_recipe:
          setup:
            - "Two enrollments E_70 and E_60 (same session as exam_score_rounding_order scenario)"
            - "Each has ExamAttempt with 2 questions: weights [7, 3]"
          trigger:
            - "E_70 submits: correct=question1 only (weight 7) -> 70.00"
            - "E_60 submits: correct=question2 only (weight 3) -> 30.00; then change to weights [6,4] correct=question1 only -> 60.00"
          assert:
            - "E_70.score == 70.00 AND E_70.passed == true"
            - "E_60.score == 60.00 AND E_60.passed == false"
            - "Boundary is >=, not > (70.00 inclusive)"

      - name: empty_waitlist_promotion_noop
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - entities.Session.fields.waitlist_count
        distinguishing_aspect: |
          Empty-collection edge case on a different metric (collection emptiness, not numeric
          threshold) and a different endpoint (POST /training/enrollments/{id}/cancel). When
          a CONFIRMED enrollment is cancelled and the session has waitlist_count==0, no
          promotion occurs and no errors are raised — but session.enrolled_count must still
          decrement exactly by 1.
        test_recipe:
          setup:
            - "Session capacity=5, waitlist_count=0; one Enrollment E1 CONFIRMED"
          trigger:
            - "POST /training/enrollments/{E1.id}/cancel"
          assert:
            - "E1.status == CANCELLED"
            - "session.enrolled_count == 0 (decremented)"
            - "session.waitlist_count == 0 (unchanged; no promotion)"
            - "No new Enrollment row created"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_creation_requires_course_on_shelf
        grounds:
          - validations[priority=6]
          - state_machines.Course.PENDING_REVIEW_to_ON_SHELF
          - state_machines.Course.ON_SHELF_to_OFF_SHELF
          - entities.Session.fields.course_id
        distinguishing_aspect: |
          Cross-entity dependency between Session and Course (one entity pair). Session can
          only enter SCHEDULED via POST /training/sessions when Course.status==ON_SHELF. If
          Course.status is OFF_SHELF, session creation is rejected with
          ERR_COURSE_NOT_ON_SHELF.
        test_recipe:
          setup:
            - "Course C published then unpublished (status=OFF_SHELF)"
            - "Instructor + Classroom prepared"
          trigger:
            - "POST /training/sessions {course_id=C.id, ...}"
          assert:
            - "HTTP 409, error_id == ERR_COURSE_NOT_ON_SHELF"
            - "After re-publish (C.status==ON_SHELF), the same POST succeeds with 201"

      - name: certificate_renewal_requires_completed_enrollment
        grounds:
          - state_machines.Certificate.EXPIRING_SOON_to_RENEWED
          - state_machines.Enrollment.CONFIRMED_to_COMPLETED
          - validations[priority=21]
          - entities.Certificate.fields.source_enrollment_id
          - entities.Enrollment.fields.status
        distinguishing_aspect: |
          A different entity pair (Certificate ↔ Enrollment) than the Session ↔ Course
          instance above. Certificate's EXPIRING_SOON->RENEWED transition requires a
          source Enrollment with status==COMPLETED whose session.start_at is within
          (cert.expires_at - renewal_window_days, cert.expires_at]; otherwise
          ERR_RENEWAL_WINDOW_INVALID is returned.
        test_recipe:
          setup:
            - "Trainee T1 with a Certificate Cert_A status=EXPIRING_SOON expires_at=2026-12-01"
            - "Cert_A.certificate_template_id has renewal_window_days=30"
            - "Enrollment E_OLD for same course, COMPLETED, session.start_at=2026-09-01 (outside renewal window)"
            - "Enrollment E_GOOD for same course, COMPLETED, session.start_at=2026-11-15 (inside renewal window)"
          trigger:
            - "POST /training/certificates/{Cert_A.id}/renew {source_enrollment_id=E_OLD.id}"
            - "POST /training/certificates/{Cert_A.id}/renew {source_enrollment_id=E_GOOD.id}"
          assert:
            - "First call -> HTTP 422, error_id == ERR_RENEWAL_WINDOW_INVALID"
            - "Second call -> HTTP 201; new Certificate emitted; Cert_A.status == RENEWED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: classroom_buffered_interval_overlap
        grounds:
          - validations[priority=10]
          - entities.Classroom.fields.setup_buffer_minutes
          - entities.Session.fields.classroom_id
          - entities.Session.fields.start_at
          - entities.Session.fields.end_at
        distinguishing_aspect: |
          Interval semantics #1 (different from instance #2): half-open intervals on the
          Classroom resource with a setup_buffer_minutes appended to each session's end_at.
          Geometry: a new session [s2, e2) conflicts when [s2, e2) intersects
          [s_existing, e_existing + buffer). Buffer is single-instructor, single-classroom
          single-row capacity (max 1 session per moment). Different resource entity:
          Classroom.
        test_recipe:
          setup:
            - "Classroom C1 setup_buffer_minutes=30"
            - "Session_X using C1: 09:00-11:00 SCHEDULED"
          trigger:
            - "POST /training/sessions creating Session_Y using C1: 11:15-12:00 (within buffer)"
            - "POST /training/sessions creating Session_Z using C1: 11:30-12:30 (exactly at buffer end)"
          assert:
            - "Session_Y creation -> HTTP 409, error_id == ERR_CLASSROOM_CONFLICT"
            - "Session_Z creation succeeds (11:30 == 11:00 + 30min; half-open buffer end is exclusive of 11:30 boundary)"

      - name: online_room_aggregate_capacity_overlap
        grounds:
          - validations[priority=11]
          - entities.OnlineRoom.fields.max_participants
          - entities.Session.fields.online_room_id
          - entities.Session.fields.capacity
        distinguishing_aspect: |
          Interval semantics #2: same online room CAN host concurrent sessions, but the
          summed session.capacity at any point in [start_at, end_at) must not exceed
          online_room.max_participants. No buffer applied. Different resource entity
          (OnlineRoom) and different interval geometry (aggregate-capacity sum vs single-slot
          buffered overlap).
        test_recipe:
          setup:
            - "OnlineRoom O1 max_participants=100"
            - "Session_X using O1: 09:00-11:00 capacity=60 SCHEDULED"
          trigger:
            - "POST /training/sessions creating Session_Y using O1: 10:00-12:00 capacity=50 (overlap 10:00-11:00 sum 110 > 100)"
            - "POST /training/sessions creating Session_Z using O1: 10:00-12:00 capacity=40 (overlap sum 100 <= 100)"
          assert:
            - "Session_Y -> HTTP 409, error_id == ERR_ONLINE_ROOM_CAPACITY_EXCEEDED"
            - "Session_Z succeeds; aggregate-capacity rule allows concurrent sessions in same online room"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: session_enroll_cancel_seat_invariant
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_CANCELLED
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - entities.Session.fields.enrolled_count
          - entities.Session.fields.capacity
        distinguishing_aspect: |
          Conserved quantity: free_seats = session.capacity - session.enrolled_count.
          Forward action POST /training/enrollments increments enrolled_count by 1 (free_seats
          -1). Compensating action POST /training/enrollments/{id}/cancel decrements
          enrolled_count by 1 (free_seats +1), UNLESS a WAITLISTED row was promoted, in which
          case promotion increments enrolled_count by 1 (net change zero — invariant
          preserved). Invariant: capacity - enrolled_count never decreases below
          0 and the pair (cancel + promotion) leaves enrolled_count unchanged from prior to
          cancel. Conserved quantity: 'seat occupancy'.
        test_recipe:
          setup:
            - "Session capacity=1 waitlist_capacity=3"
            - "T1 CONFIRMED, T2 WAITLISTED pos1, T3 WAITLISTED pos2"
            - "Pre-state: session.enrolled_count=1, session.waitlist_count=2, free_seats=0"
          trigger:
            - "POST /training/enrollments/{T1.id}/cancel  (forward+compensating in one step due to cascade)"
          assert:
            - "After: session.enrolled_count == 1 (T2 promoted preserves the seat)"
            - "session.waitlist_count == 1 (T3 only)"
            - "Conserved quantity free_seats == 0 (unchanged from before cancel)"

      - name: credit_pool_award_revoke_invariant
        grounds:
          - state_machines.Enrollment.CONFIRMED_to_COMPLETED
          - calculations.credit_award_calc
          - calculations.credit_pool_accumulation_calc
          - entities.CreditAdjustment.fields.delta
          - entities.CreditPool.fields.accumulated_credits
        distinguishing_aspect: |
          A different conserved quantity (credit balance, not seat occupancy). Forward
          action: session.complete awards final_credit (e.g., +4.0). Compensating action:
          CreditAdjustment with delta=-4.0 and reason='reversal'. Invariant: after the pair,
          accumulated_credits returns to its prior value. Tested by snapshotting
          accumulated_credits before and after the forward+compensating pair.
        test_recipe:
          setup:
            - "Trainee T1 with CreditPool P1, accumulated_credits=0"
            - "Course C credit_value=4.0 published"
            - "Schedule session, T1 enrolled CONFIRMED, PRESENT, exam passed"
          trigger:
            - "Clock advance past end_at; sweep; complete session (forward leg -> +4.0)"
            - "POST /training/credit-adjustments {credit_pool_id=P1.id, delta=-4.0, reason='reversal'} (compensating leg)"
          assert:
            - "After forward leg: P1.accumulated_credits == 4.0"
            - "After compensating leg: P1.accumulated_credits == 0.0 (invariant preserved)"
            - "AuditLog row written for the CreditAdjustment with subject_kind=CREDIT_POOL"
