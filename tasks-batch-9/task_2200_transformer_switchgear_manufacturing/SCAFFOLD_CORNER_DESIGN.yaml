  - section: cross_cutting_complexity_layers
    instances:
      - name: submittal_drawing_create_with_version_stale_by_one_patch_returns_stale_order_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[submittal-revision-create-stale-order]
          - validations[P32]
          - errors[ERR_STALE_ORDER_VERSION]
          - endpoints[create_submittal_drawing]
        distinguishing_aspect: "The version captured before an intervening PATCH is stale by exactly one, and the declared occ_field expected_engineered_order_version must reject it with 412 ERR_STALE_ORDER_VERSION; re-reading the order and resending the fresh version then succeeds."
        test_recipe:
          setup:
            - "An order that has been patched once since its creation response was captured."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CC1"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", stale_order_version: "$.data.version" }
            - call: PATCH /engineered-orders/${order_id}
              payload: { customer_name: "Riverbend Utility District 4" }
              as: ContractAdmin
              captures: { fresh_order_version: "$.data.version" }
          trigger:
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-CC1-A", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${stale_order_version}" }
              as: DesignEngineer
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_ORDER_VERSION\"."
            - "fresh_order_version == stale_order_version + 1, so the PATCH incremented the order version exactly once."
            - "GET /engineered-orders/${order_id}/submittal-drawings as DesignEngineer returns an empty data array."
            - "Resending the same body with expected_engineered_order_version ${fresh_order_version} returns HTTP 201 with data.revision_round == 1."

      - name: allocation_create_with_version_stale_by_one_receipt_returns_stale_component_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocation-create-stale-component]
          - validations[P33]
          - errors[ERR_STALE_COMPONENT_VERSION]
          - endpoints[create_component_allocation]
        distinguishing_aspect: "Allocation pins the component, not the order: a receipt posted between capture and allocation makes expected_component_version stale and yields 412 ERR_STALE_COMPONENT_VERSION - never ERR_STALE_ORDER_VERSION, and never ERR_COMPONENT_INSUFFICIENT even though the quantity requested is within stock."
        test_recipe:
          setup:
            - "An approved supplier with one ACTIVE component at 10 on hand, then a receipt of 5 posted after the component version was captured."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CC2"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /suppliers
              payload: { supplier_code: "SUP-CC2", legal_name: "Northline Copperworks GmbH", region: "NA" }
              as: PlantAdmin
              captures: { supplier_id: "$.data.id" }
            - call: POST /suppliers/${supplier_id}/long-lead-components
              payload: { part_number: "PN-CC2-1", category: "VACUUM_INTERRUPTER", lead_time_days: 120, quantity_on_hand: 10, allocation_policy: "PREEMPTIBLE" }
              as: MaterialsPlanner
              captures: { component_id: "$.data.id", stale_component_version: "$.data.version" }
            - call: POST /long-lead-components/${component_id}/receipts
              payload: { quantity: 5 }
              as: MaterialsPlanner
            - call: GET /long-lead-components/${component_id}
              payload: {}
              as: MaterialsPlanner
              captures: { fresh_component_version: "$.data.version" }
          trigger:
            - call: POST /component-allocations
              payload: { long_lead_component_id: "${component_id}", engineered_order_id: "${order_id}", quantity: 4, priority_class: 3, need_by_date: "2026-06-01T00:00:00Z", expected_component_version: "${stale_component_version}" }
              as: MaterialsPlanner
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_COMPONENT_VERSION\"."
            - "GET /long-lead-components/${component_id} as MaterialsPlanner reports data.quantity_on_hand == 15 and data.quantity_reserved == 0."
            - "Resending the same body with expected_component_version ${fresh_component_version} returns HTTP 201 with data.status == \"RESERVED\"."

      - name: order_material_allocated_cascade_fires_only_on_the_last_reserved_allocation
        claim_type: cascading_side_effects
        grounds:
          - state_machines[engineered_order_fulfillment]
          - state_machines[component_allocation]
          - endpoints[commit_component_allocation]
        distinguishing_aspect: "The component-to-order cascade is ordering sensitive: committing the first of two allocations leaves the order in PLANNING because a RESERVED sibling remains, and only the second commit derives MATERIAL_ALLOCATED - the cascade is guarded on the aggregate, not fired once per commit."
        test_recipe:
          setup:
            - "An order with two RESERVED allocations of 3 and 4 units against one ACTIVE component holding 10 on hand."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CC3"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /suppliers
              payload: { supplier_code: "SUP-CC3", legal_name: "Northline Copperworks GmbH", region: "NA" }
              as: PlantAdmin
              captures: { supplier_id: "$.data.id" }
            - call: POST /suppliers/${supplier_id}/long-lead-components
              payload: { part_number: "PN-CC3-1", category: "TAP_CHANGER", lead_time_days: 90, quantity_on_hand: 10, allocation_policy: "PROTECTED" }
              as: MaterialsPlanner
              captures: { component_id: "$.data.id", version_v0: "$.data.version" }
            - call: POST /component-allocations
              payload: { long_lead_component_id: "${component_id}", engineered_order_id: "${order_id}", quantity: 3, priority_class: 2, need_by_date: "2026-06-01T00:00:00Z", expected_component_version: "${version_v0}" }
              as: MaterialsPlanner
              captures: { alloc_a_id: "$.data.id" }
            - call: GET /long-lead-components/${component_id}
              payload: {}
              as: MaterialsPlanner
              captures: { version_v1: "$.data.version" }
            - call: POST /component-allocations
              payload: { long_lead_component_id: "${component_id}", engineered_order_id: "${order_id}", quantity: 4, priority_class: 2, need_by_date: "2026-06-01T00:00:00Z", expected_component_version: "${version_v1}" }
              as: MaterialsPlanner
              captures: { alloc_b_id: "$.data.id" }
          trigger:
            - call: POST /component-allocations/${alloc_a_id}/commit
              payload: {}
              as: MaterialsPlanner
            - call: GET /engineered-orders/${order_id}
              payload: {}
              as: MaterialsPlanner
            - call: POST /component-allocations/${alloc_b_id}/commit
              payload: {}
              as: MaterialsPlanner
          assert:
            - "After the first commit the order read reports data.fulfillment_status == \"PLANNING\"."
            - "After the second commit GET /engineered-orders/${order_id} as MaterialsPlanner reports data.fulfillment_status == \"MATERIAL_ALLOCATED\"."
            - "GET /long-lead-components/${component_id} as MaterialsPlanner then reports data.quantity_reserved == 0 and data.quantity_committed == 7."

      - name: final_variant_rejected_where_provisional_variant_is_accepted_on_the_same_clause
        claim_type: dual_variant_calculation
        grounds:
          - validations[P69]
          - errors[ERR_INDEX_WINDOW_EMPTY]
          - endpoints[create_escalation_adjustment]
        distinguishing_aspect: "With only the base month published, the two variants diverge at the same clause and clock: FINAL demands a populated window after the base month and fails 422 ERR_INDEX_WINDOW_EMPTY, while PROVISIONAL settles for the latest published point and is created."
        test_recipe:
          setup:
            - "An order with a clause based on 2026-01 running to 2026-06, and index points published for 2026-01 only."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /commodity-index-points
              payload: { commodity: "COPPER", index_month: "2026-01", index_value: 10000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: POST /commodity-index-points
              payload: { commodity: "ALUMINUM", index_month: "2026-01", index_value: 10000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: POST /commodity-index-points
              payload: { commodity: "CORE_STEEL", index_month: "2026-01", index_value: 10000, published_at: "2026-02-05T00:00:00Z", is_provisional: false }
              as: ContractAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CC4"
                customer_name: "Riverbend Utility"
                product_family: "POWER_TRANSFORMER"
                rated_kv: 69
                contract_value_cents: 9000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /engineered-orders/${order_id}/escalation-clauses
              payload:
                copper_weight_bp: 6000
                aluminum_weight_bp: 2000
                core_steel_weight_bp: 2000
                escalatable_base_cents: 5000000
                base_index_month: "2026-01"
                cap_bp: 1000
                collar_bp: 200
                de_escalation_enabled: true
                final_window_end_month: "2026-06"
              as: ContractAdmin
              captures: { clause_id: "$.data.id" }
            - call: GET /engineered-orders/${order_id}
              payload: {}
              as: ContractAdmin
              captures: { order_version: "$.data.version" }
          trigger:
            - call: POST /engineered-orders/${order_id}/escalation-adjustments
              payload: { escalation_clause_id: "${clause_id}", variant: "FINAL", prepared_by_user_id: "u-contract-1", expected_engineered_order_version: "${order_version}" }
              as: ContractAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_INDEX_WINDOW_EMPTY\"."
            - "The same call with variant PROVISIONAL returns HTTP 201 with data.variant == \"PROVISIONAL\"."

      - name: released_drawing_revision_stays_pinned_when_a_later_revision_is_submitted
        claim_type: version_pinning_on_approval
        grounds:
          - state_machines[submittal_drawing]
          - state_machines[engineered_order_engineering]
          - endpoints[disposition_submittal_drawing]
          - endpoints[create_submittal_drawing]
        distinguishing_aspect: "Approval pins EngineeredOrder.released_drawing_revision to the approved revision_round; opening and submitting revision 2 afterwards must leave the pinned value at 1, so the pin records what was approved rather than tracking the newest drawing."
        test_recipe:
          setup:
            - "An order whose revision 1 drawing has been submitted, reviewed and approved."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CC5"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-CC5-A", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_one_id: "$.data.id" }
            - call: POST /submittal-drawings/${drawing_one_id}/submit
              payload: {}
              as: DesignEngineer
            - call: POST /submittal-drawings/${drawing_one_id}/begin-review
              payload: {}
              as: CustomerReviewer
            - call: POST /submittal-drawings/${drawing_one_id}/disposition
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u-reviewer-1" }
              as: CustomerReviewer
              as_user_id: "u-reviewer-1"
            - call: GET /engineered-orders/${order_id}
              payload: {}
              as: DesignEngineer
              captures: { pinned_order_version: "$.data.version" }
          trigger:
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-CC5-B", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${pinned_order_version}" }
              as: DesignEngineer
              captures: { drawing_two_id: "$.data.id" }
            - call: POST /submittal-drawings/${drawing_two_id}/submit
              payload: {}
              as: DesignEngineer
          assert:
            - "The revision 2 create returns HTTP 201 with data.revision_round == 2 and data.status == \"DRAFT\"."
            - "GET /engineered-orders/${order_id} as DesignEngineer reports data.released_drawing_revision == 1 after both triggers."
            - "GET /submittal-drawings/${drawing_one_id} as DesignEngineer still reports data.status == \"APPROVED\" with data.revision_round == 1, so the pin's source row was not superseded in place."

  - section: consistency_model
    instances:
      - name: component_reservation_counters_are_visible_without_any_re_read_delay
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - endpoints[create_component_allocation]
          - calculations[component_availability]
        distinguishing_aspect: "Under the immediate consistency model the denormalised quantity_reserved on LongLeadComponent is updated inside the allocation write: the first read after the 201 already shows 4 reserved, with no intermediate window reporting 0."
        test_recipe:
          setup:
            - "An approved supplier with one ACTIVE component holding 10 units and no allocations."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CM1"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /suppliers
              payload: { supplier_code: "SUP-CM1", legal_name: "Northline Copperworks GmbH", region: "NA" }
              as: PlantAdmin
              captures: { supplier_id: "$.data.id" }
            - call: POST /suppliers/${supplier_id}/long-lead-components
              payload: { part_number: "PN-CM1-1", category: "HV_BUSHING", lead_time_days: 150, quantity_on_hand: 10, allocation_policy: "PREEMPTIBLE" }
              as: MaterialsPlanner
              captures: { component_id: "$.data.id", component_version: "$.data.version" }
          trigger:
            - call: POST /component-allocations
              payload: { long_lead_component_id: "${component_id}", engineered_order_id: "${order_id}", quantity: 4, priority_class: 3, need_by_date: "2026-06-01T00:00:00Z", expected_component_version: "${component_version}" }
              as: MaterialsPlanner
            - call: GET /long-lead-components/${component_id}
              payload: {}
              as: MaterialsPlanner
          assert:
            - "The allocation create returns HTTP 201 with data.status == \"RESERVED\" and data.quantity == 4."
            - "The immediately following component read reports data.quantity_reserved == 4, data.quantity_committed == 0 and data.quantity_on_hand == 10."
            - "A second identical component read returns the same values, so nothing settles later."

      - name: financial_summary_recomputes_from_the_patched_contract_value_on_the_next_request
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - endpoints[update_engineered_order]
          - endpoints[get_order_financial_summary]
        distinguishing_aspect: "net_contract_value_cents is a computed read, not a stored snapshot: the request issued straight after the PATCH already reports the figures derived from 7000000, so no stale 4000000 net value is ever observable."
        test_recipe:
          setup:
            - "An order sold at 4000000 cents with no escalation and no warranty credits."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-CM2"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: GET /engineered-orders/${order_id}/financial-summary
              payload: {}
              as: ContractAdmin
          trigger:
            - call: PATCH /engineered-orders/${order_id}
              payload: { contract_value_cents: 7000000 }
              as: ContractAdmin
            - call: GET /engineered-orders/${order_id}/financial-summary
              payload: {}
              as: ContractAdmin
          assert:
            - "The pre-patch summary reports data.contract_value_cents == 4000000 and data.net_contract_value_cents == 4000000."
            - "The post-patch summary reports data.contract_value_cents == 7000000 and data.net_contract_value_cents == 7000000."
            - "Both summaries report data.escalation_accepted_total_cents == 0, data.warranty_credit_total_cents == 0 and data.billed_to_date_cents == 0."

      - name: supplier_receipt_counter_and_quality_index_move_in_the_same_write
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - endpoints[create_supplier_receipt_event]
          - calculations[supplier_quality_index]
        distinguishing_aspect: "The trailing quality index and its receipt_event_count denominator are recomputed synchronously with the receipt event: one read after the write shows count 1, and there is no lagging window in which the count has moved but the index has not."
        test_recipe:
          setup:
            - "A freshly approved supplier at the seeded index of 100 with receipt_event_count 0."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /suppliers
              payload: { supplier_code: "SUP-CM3", legal_name: "Northline Copperworks GmbH", region: "APAC" }
              as: PlantAdmin
              captures: { supplier_id: "$.data.id" }
            - call: GET /suppliers/${supplier_id}
              payload: {}
              as: QualityEngineer
          trigger:
            - call: POST /suppliers/${supplier_id}/receipt-events
              payload: { event_count: 1 }
              as: MaterialsPlanner
            - call: GET /suppliers/${supplier_id}
              payload: {}
              as: QualityEngineer
          assert:
            - "The pre-write read reports data.receipt_event_count == 0, data.attributed_failure_count == 0 and data.quality_index_trailing == 100."
            - "The post-write read reports data.receipt_event_count == 1 with data.attributed_failure_count still 0 and data.quality_index_trailing still 100."
            - "A repeat read returns identical values, confirming no deferred recomputation."
