              payload: { event_id: "${ev_id}", buyer_id: "${buyer_id}", items: [{ ticket_type_id: "${tt_id}", seat_block_id: "${sb_id}", quantity: 2, seat_numbers: [3, 4] }], expected_event_version: "${ev_v1}" }
              as: Buyer
