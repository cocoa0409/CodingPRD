              as: BuyerManager
              as_user_id: "${b1_id}"
              captures: { sr1_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 100, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${fC}"
              captures: { qC: "$.data.id", qCv: "$.data.version" }
            - call: "POST /sourcing/sourcing-requests/${sr1_id}/quotations"
              payload: { unit_price_cents: 100, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${fB}"
              captures: { qB: "$.data.id", qBv: "$.data.version" }
            - call: "POST /sourcing/factories/${fC}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 50, social_compliance_score: 60, production_capability_score: 55, financial_stability_score: 55, critical_findings: 0 }
              as: SourcingAgent
