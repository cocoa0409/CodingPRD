  - section: consistency_model
    instances:
      - name: immediate_consistency_writes_visible_in_same_request
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "Writes are immediately visible in the same request's response; no read-after-write lag."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-IC", legal_name: "ImmCo", counterparty_kind: "SUPPLIER", credit_limit_usd: 5000 }
              as: Trader
              captures: { ic_id: $.data.id, ic_status: $.data.counterparty_status, ic_v: $.data.version }
          assert:
            - "The POST response data already contains counterparty_status == ACTIVE, version == 1, and id — no separate GET needed to observe the write."
