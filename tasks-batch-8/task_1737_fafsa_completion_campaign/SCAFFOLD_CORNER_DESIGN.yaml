  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the confirm response, a subsequent GET on the senior, and the checklist list all reflect the MATCHED state and generated checklist within the same request sequence — no staleness window."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior with SUGGESTED link"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
            - { call: "POST /fafsa/campaigns/${camp}/activate", as: CampaignAdmin }
            - { call: "POST /fafsa/schools", as: CampaignAdmin, payload: { campaign_id: "${camp}", name: "North HS", district_code: "D01", school_code: "SC01" }, captures: { sch: $.data.id } }
            - { call: "POST /fafsa/schools/${sch}/enroll", as: CampaignAdmin }
            - { call: "POST /fafsa/senior-records", as: SchoolCoordinator, as_user_id: "${sch}", payload: { school_id: "${sch}", student_ref: "S1", full_name: "Ana Lee", dob: "2009-03-04", home_language: "en" }, captures: { sr: $.data.id, sr_v: $.data.version } }
            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "E1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC99", district_code: "D01", initial_status: "SUBMITTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" }, captures: { lk: $.data.id } }
          trigger:
            - { call: "POST /fafsa/match-links/${lk}/confirm", as: MatchReviewer, captures: { lk_st: $.data.status } }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { ms: $.data.match_status, cur: $.data.current_match_link_id } }
            - { call: "GET /fafsa/document-checklists?senior_record_id=${sr}", as: CampaignAdmin }
          assert:
            - "Confirm response itself shows status == CONFIRMED"
            - "Immediate GET senior: match_status == MATCHED and current_match_link_id == ${lk}"
            - "Immediate checklist list: exactly 1 checklist with status GENERATED"
