              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "PET" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "second accept returns ERR_INVALID_STATE (409), NOT ERR_VARIANT_PRODUCT_MISMATCH"
            - "DesignLayout.${design_id}.status remains ACCEPTED"

