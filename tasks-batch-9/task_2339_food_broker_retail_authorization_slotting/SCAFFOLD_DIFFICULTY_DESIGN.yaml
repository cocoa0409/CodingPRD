          Entity pair SlottingDeal ← CommissionAgreement: the deal itself is in a
          perfectly acceptable state and its review is DECIDED, but acceptance is
          gated on a THIRD entity whose gating attribute is a half-open date
          window evaluated against the logical clock — not a status enum. The same
          agreement that legally admitted the presentation on 2026-08-15 no longer
          covers the acceptance on 2026-09-02 because effective_end_date
          2026-09-01 is exclusive. The sibling pair is PromotionEvent ←
