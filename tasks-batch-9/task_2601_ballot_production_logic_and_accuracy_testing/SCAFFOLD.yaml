      - "decision == REJECT: style.status = PROOF_REJECTED; proof_decided_by_user_id = X-User-ID; translated_languages and certified_formats are cleared to empty arrays; every DRAFT or SEALED TestDeck of the style is VOIDED; style.version is bumped. revision is NOT touched here - only the PROOF_REJECTED -> PROOFING re-request bumps it (see state_machines.BallotStyle)."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BALLOT_STYLE_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_STYLE_STATE_INVALID, ERR_SEGREGATION_OF_DUTIES]

