            - call: "GET /api/certificates/${cert_a}"
              as: StateAuditor
              captures: { ca_status: $.data.status, ca_reason: $.data.reject_reason }
            - call: "GET /api/certificates/${cert_b}"
              as: StateAuditor
              captures: { cb_status: $.data.status, cb_reason: $.data.reject_reason }
          assert:
            - "TestRecord.${t2}.result == 'POSITIVE'"
            - "Premises.${prem_id}.disease_status == 'INFECTED' (cascade link 1)"
            - "Exactly one auto QuarantineOrder: status 'ACTIVE', reason == 'AUTO_POSITIVE_TEST:${t2}', issued_by_user_id == 'system', disease_code == 'BRUCELLOSIS'"
            - "Auto order window: start_at == '2026-08-10T00:00:00Z', end_at == '2026-09-09T00:00:00Z' (clock + 30 days)"
