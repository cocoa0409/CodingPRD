  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_milk_accept
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SCC_LIMIT]
        distinguishing_aspect: |
          Pair state (p5) vs business_safety (p6): accepting an ALREADY-REJECTED
          intake whose SCC is 999999 violates both; the state error
          ERR_INVALID_STATE (priority 5) must win over ERR_SCC_LIMIT (priority 6).
        test_recipe:
          setup:
            - "Intake with somatic_cell_count 999999 created and then REJECTED"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant I", license_number: "WI-108" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 999999 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/reject", payload: {}, as: MilkReceiver }
          trigger:
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (state priority 5 beats business_safety priority 6 despite SCC violation also holding)"

      - name: business_referential_beats_business_fiscal_on_cutwrap_reconcile
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_BATCH_NOT_RELEASED]
          - errors[ERR_WASTE_TOLERANCE]
        distinguishing_aspect: |
          Different category pair than instance 1: business_referential (p8) vs
          business_fiscal (p12). A reconcile against an order whose batch is NOT
          released AND whose waste gap exceeds 2% must return
          ERR_BATCH_NOT_RELEASED (p8), not ERR_WASTE_TOLERANCE (p12).
        test_recipe:
          setup:
            - "CHEDDAR batch completed but ZERO wheels placed (wheels_placed 0 < wheels_produced 4) AND aged 0 days (< 60-day minimum): both p8 referential (ERR_WHEELS_UNPLACED) and p10 temporal (ERR_AGE_MINIMUM_NOT_MET) violations hold simultaneously"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant J", license_number: "WI-109" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v: $.data.version } }
            - { call: "POST /plant/plants/${plant_id}/milk-intakes", payload: { hauler_ticket: "HT-1", received_at: "2026-08-01T01:00:00Z", volume_liters: 5000.0, fat_pct: 3.7, protein_pct: 3.0, somatic_cell_count: 100000 }, as: MilkReceiver, captures: { milk_id: $.data.id } }
            - { call: "POST /plant/milk-intakes/${milk_id}/accept", payload: {}, as: MilkReceiver }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "CULTURE", supplier_lot_no: "CUL-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 100.0 }, as: PlantAdmin, captures: { cul_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/additive-lots", payload: { kind: "COAGULANT", supplier_lot_no: "COA-1", expires_at: "2027-01-01T00:00:00Z", quantity_initial: 5000.0 }, as: PlantAdmin, captures: { coa_id: $.data.id } }
