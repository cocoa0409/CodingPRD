      - name: seal_publishes_measured_indexes_to_every_dependent_reader_at_once
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "The seal's four-level cascade is visible to all readers in the response to the sealing call itself; §1.8 pins every level's literals."
        excluded_because:
          difficulty_instance: "survey_seal_cascades_segment_pci_to_candidate_to_allocation_to_scenario_totals"
          rationale: "That §1.8 transitive_cascade instance seals a second survey and asserts, in reads taken immediately afterwards, the segment's SURVEY_MEASURED index, the prior candidate SUPERSEDED, its allocation WITHDRAWN with allocated_cents 0, and the parent scenario's recomputed allocation_count / funded_cost_cents / backlog_cents. Immediate visibility for the seal chain is exactly what it asserts."
